  2. It strictly requires that all premises needed for the solution be textually present, but merely fits well with the hope that readers will successfully traverse the inferential distance between those premises and the conclusion.
  3. Informational equality is maintained by providing identical data to both parties, while inferential inequality is licensed by treating the detective's expertise as an additional, shared premise rather than hidden information.
  4. The tolerance for hidden mechanical tricks confirms the norm governs clues about human agency specifically, though both your salience account and a retrospective inevitability account would license this distinction.
  5. If we adopted the standard formal treatment of knowledge, the norm would have to shift from withholding solutions to withholding premises entirely. Displaying any clue would logically force the solution into the reader's mind immediately, eliminating the space for mystery.
