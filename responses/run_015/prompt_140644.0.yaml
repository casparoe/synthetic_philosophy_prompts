answer: |-
  **Private Pass: Candidate Mappings**

  (a) **Mappings:**
  1.  **Captain as Sole Agent:** Agent = Sullenberger. Options = {LGA, TEB, Hudson}. Aspiration = "Safe landing on solid ground." Stopping = Reject until Hudson meets "survivable ditching."
  2.  **Crew as Distributed Agent:** Agent = Sullenberger + Skiles + Checklists. Options emerge via dialogue/ATC. Aspiration = Shared mental model of feasibility. Stopping = Consensus on impossibility of airports.
  3.  **Socio-Technical System:** Agent = Crew + ATC + Airframe. Options constrained by physics (glide ratio) and protocol. Aspiration = System integrity/loss minimization.

  (b) **Explanatory Power & Strains:**
  *   *Captain:* Explains final authority and speed. Strains: Ignores Skiles' checklist work which bought time/power; treats cognition as isolated.
  *   *Crew:* Explains division of labor (fly vs. fix). Strains: Hard to define a single aspiration level for two minds; Sullenberger overrode ATC, suggesting hierarchical stop.
  *   *System:* Best captures physical constraints (altitude = currency). Strains: Dilutes agency; hard to apply "rationality" to a plane.
  *   *General Strain:* Simon's search usually assumes exogenous options. Here, evaluating LGA consumed altitude needed for Hudson (endogenous cost). Aspiration shifts in a one-shot case risk unfalsifiability.

  ***

  **Case Analysis: US Airways Flight 1549**

  **1. The Mapping**
  The most disciplined mapping treats the **Captain as the stopping agent**, embedded within a crew system that manages search costs. The option set was {Return LaGuardia (LGA), Divert Teterboro (TEB), Ditch Hudson}. These options surfaced exogenously via ATC suggestion, except Hudson, which emerged from the Captain's perceptual assessment. Search costs were physical: altitude, airspeed, and attentional bandwidth. Satisficing predicts search stops when an option meets an aspiration level. Here, the aspiration was initially "landing at an airport." LGA and TEB were evaluated and rejected as failing this threshold (unsafe). The search stopped at Hudson not because it met the initial aspiration, but because the aspiration level adapted to "survivable impact." The episode matches satisficing in the sequential rejection of options, but departs in the speed; there was little active "search," mostly recognition of failure.

  **2. The Aspiration Ratchet**
  Simon's aspiration levels typically adapt across repeated trials. In this one-shot crisis, the threshold moved downward: from "airport" to "water." Is this rational adaptation or unfalsifiable drift? It appears rational if aspiration is tied to *feasibility* rather than *preference*. If the agent perceives the airport option as physically impossible, maintaining that aspiration is delusional, not rational. However, a theory where thresholds drift instantly to match the only remaining option risks tautology: any choice becomes satisficing by definition. Simon's framework lacks robust machinery for one-shot, high-stakes adaptation, relying instead on the assumption that learned aspirations reflect environmental regularities. Here, the regularity broke (dual engine failure), forcing immediate recalibration.

  **3. Endogenous Option Arrival**
  Standard satisficing treats search costs as cognitive or temporal. Here, search costs were **energy**. Evaluating the LGA return consumed altitude required for the Hudson ditching. This is a strain on the theory. Simon's machinery assumes the option set is stable during search. In Flight 1549, the option set degraded *because* of the search. A stopping rule is only reasonable if the agent recognizes that further search destroys the value of remaining options. Satisficing does not explicitly model search destroying the object of search, though it can accommodate it if "cost of search" is defined broadly enough to include physical depletion. The ledger must account for the fact that stopping at Hudson was reasonable partly because looking longer at LGA made Hudson impossible.

  **4. The Settling Ledger**
  Applying your **Settling Ledger**: The runway return surfaced and was rejected. To judge this rejection without optimization, the ledger needs a threshold of "reasonable belief in impossibility." It requires a counterfactual: "Given the information at *t*, was the probability of making LGA below the safety threshold?" If the ledger accepts the Captain's subjective probability, it risks becoming merely satisficing with ex post bookkeeping. It adds little unless it demands evidence that the option was genuinely represented and dismissed via a robust heuristic.
  Is it self-undermining? If aspiration adapts to surfaced options, a minimally competent agent always passes, provided they don't stop *before* an option surfaces. This is a defect if the ledger cannot distinguish between a lucky guess and a robust rule. However, if the ledger demands the option be vetted against trained repertoire (e.g., glide ratios), it retains normative force. It prevents hindsight bias (judging by outcome) but may fail to prevent foresight errors (judging by flawed heuristics).

  **5. The As-If Challenge**
  Economists argue any threshold behavior can be redescribed as optimizing expected utility with information costs. Does this episode break the tie? Empirically, no. An optimizer would also stop searching when the marginal cost of altitude exceeded the expected gain of finding a runway. The disagreement is normative and psychological. Optimization implies the agent *should* have calculated probabilities; satisficing implies the agent *should* have used a robust rule of thumb. In this case, the normative difference matters for training. Optimizing suggests training pilots to calculate glide paths; satisficing suggests training them to recognize patterns of impossibility. The episode favors the latter; there was no time for calculation, only recognition. The tie is broken not by the outcome, but by the mechanism required to achieve it under bounded time.

  **6. A Competitor: Recognition-Primed Decision (RPD)**
  Klein's RPD model suggests experts do not compare options but recognize situations and simulate a single course of action. Sullenberger's statement ("I could not make it") sounds like evaluation (satisficing), but may have been instantaneous recognition (RPD). RPD better describes the four-minute timeline; comparative search is too slow. They are likely compatible descriptions at different levels: RPD describes the generation of the option (Hudson), satisficing describes the rejection of alternatives (LGA/TEB). To discriminate, we would need evidence of explicit comparison. The transcript shows ATC offering options and Sullenberger rejecting them, suggesting some comparison occurred, but the rejection may have been based on a single recognized parameter (altitude vs. distance) rather than a weighted utility calculation.

  **7. What the Case Does to the Theory**
  The explanatory weight falls on the **structure of the environment**: the glide ratio of the A320, the straight geometry of the Hudson, the presence of ferries. This aligns with Simon's "scissors" metaphor: rationality is the fit between mind and environment. If the river had been narrow or crowded, the same heuristic would have failed. This collapses into ecological rationality. Does satisficing survive? Yes, but only as the agent-side blade. The theory cannot explain survival without referencing the river. The case confirms that bounded rationality is not just about cognitive limits, but about leveraging environmental structure to compensate for them. The "rationality" is in the coupling, not just the calculation.

  ***

  **Critique of Framing and Uncertain Facts**

  **Confused Framing:**
  Your framing of the **aspiration level moving downward** risks conflating *preference* with *feasibility*. In Simon's theory, aspiration is often about satisfying a need. Here, the "need" (survival) remained constant; the *means* changed. It is more precise to say the **feasible set shrank** rather than the aspiration drifted. If aspiration drifts too easily to match available options, the theory loses predictive power, as you noted. Additionally, your **Settling Ledger** risks circularity if "surfaced" is defined too loosely. If an option is physically possible but not cognitively represented, the ledger excuses ignoring it. This is useful for blaming agents, but less useful for designing systems that ensure critical options *do* surface.

  **Uncertain Facts:**
  I must flag several facts where I lack confidence due to no web access:
  1.  **APU Timing:** I believe the Auxiliary Power Unit was started during the ditching checklist, providing electrical power after engine failure. I am not certain if this was before or after the decision to ditch in the Hudson. If it was after, it did not influence the decision space, only the outcome.
  2.  **Exact Altitude:** I cited ~2,800 feet. NTSB data suggests the strike was closer to 2,700 feet, and the decision timeline was under 208 seconds. Small variations here change the energy budget significantly.
  3.  **ATC Sequence:** I recall ATC offering LGA, then TEB. I am not certain if TEB was offered before or after Sullenberger initially doubted LGA. The precise sequencing matters for the "search cost" analysis.
  4.  **Injury Count:** I cited ~100 injured. Some reports say fewer serious injuries. This affects the evaluation of the "survivable" aspiration level.

  These uncertainties matter because the "rationality" of the stop depends on the precise energy state at the moment of decision. If the altitude was higher, the LGA return might have been clearly viable, changing the normative assessment of the rejection.
