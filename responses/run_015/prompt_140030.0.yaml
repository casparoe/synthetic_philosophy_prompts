      *(Refining the Argument)*:
      Sam's strongest point: You can't deceive yourself if you don't hold the truth to begin with.
      Leo's strongest point: You can arrange your life so you *can't* form the truth, which achieves the same result as lying to yourself.

      Let's ensure the "outsourced" concept gets a proper workout. Leo thinks it solves the paradox (the cousin is the 'knower'). Sam thinks it's just shifting blame (the cousin is an agent, not a part of Ruth's mind).

