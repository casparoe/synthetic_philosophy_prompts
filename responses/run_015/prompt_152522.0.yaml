answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, and I want to say immediately that your intuition to ground this practice in Strawson is sound, precisely because it addresses the drift you are seeing without requiring your staff to become metaphysicians. The problem you describe, where liking leads to management and fear leads to moralizing, is a classic corruption of what Strawson calls the participant and objective attitudes, and turning this into a procedure requires us to simplify his framework ruthlessly while keeping the structural integrity of the distinction between excuses and exemptions. What follows is a draft of that procedure, written as I would explain it to you over coffee, followed by an application to your three cases and a candid account of where this tool will remain silent.

  To begin with, you asked me to address the question your staff ask in every single case, which is whether the service user was really able to do otherwise. You are right to suspect that the procedure has nothing to say about this, and it is vital that the first step of this protocol is to explicitly forbid asking it. Strawson's central point is that the practice of holding people responsible does not depend on a theoretical answer to determinism, so your staff must be instructed that if the discussion turns to whether the universe is deterministic or whether the service user had metaphysical freedom, the conversation is idle and must stop. This is not a finding of fact but a rule of procedure, and it serves to prevent the team from paralysing themselves with a question that has no clinical answer. Once that door is closed, the procedure moves to the first substantive question, which concerns exemptions. You must ask whether there is any current condition, such as acute psychosis, severe mania, or profound cognitive impairment, that renders the service user incapable of understanding moral demands or participating in ordinary interpersonal relationships. This is a factual question based on clinical evidence, and if the answer is yes, the procedure stops here and mandates a management stance. You should treat a current section under the Mental Health Act relating to capacity, or a consultant's certification of incapacity, as a sufficient answer to this question when you do not have perfect information. If the answer is no, meaning the person is not exempt, you do not move to management; you remain within the moral community, and this is where many teams drift incorrectly into management simply because a person is difficult.

  If the person is not exempt, the next question concerns excuses, which is distinct from exemption. You must ask whether the specific behaviour in question was unintentional, coerced, or performed under duress that would mitigate blame while leaving the person's status as a moral agent intact. It is crucial to mark that this is not a stop point for the procedure in the same way exemption is; if an excuse is found, the stance remains moral-protest, but the content of that stance shifts from resentment to forgiveness or modified demand. However, if there is no excuse, the default stance is moral-protest, involving clear demands and the possibility of reproach. Here I must highlight a point where the answer is not a fact but a value judgment that has to be handed to a person rather than settled by the test. Even if a person is not exempt and has no excuse, the team must decide whether maintaining a moral-protest stance is therapeutically beneficial or safely possible. This is a value judgment about risk and relationship, not a metaphysical fact about the service user, and if the team judges that the risk of violence or self-harm is too high to sustain a relationship of mutual demand, they may opt for management, but they must record this as a clinical safety override rather than a judgment on the service user's moral status. This distinction is what will keep your files defensible to a tribunal, because it separates what the person is capable of from what you are currently able to risk. Finally, you asked what parts of Strawson to drop, and my advice is to drop the entire taxonomy of reactive attitudes. Your staff do not need to distinguish between indignation and resentment, or guilt and shame; they only need to know whether they are speaking to a moral agent who can hear a demand, or to a patient who requires a treatment plan. Drop the philosophical history and keep only the binary switch of address versus management.

  Now I will apply this procedure to the three situations you described, starting with the man with bipolar disorder. During his hypomanic episode, he would have qualified for an exemption because the severity of the mood disorder likely impaired his capacity to understand the moral weight of his threats or debts, so at that time the management stance was correct. However, he is now well and ashamed, which means the exemption no longer applies. The procedure dictates that you return to a moral-protest stance, not to punish him, but to acknowledge his return to the moral community. His mother's insistence that you hold him to what he said is actually a demand that you treat him as a responsible agent again, and if you continue to manage him as though he were still exempt, you are effectively denying his recovery. The procedure would tell you to acknowledge the past behaviour as occurring during an exemption, but to treat current interactions as those with a moral agent who can make amends, meaning you should support him in facing the debts and repairing the relationship with his mother rather than absorbing those consequences yourselves.

  The second case, the woman with emotionally unstable personality disorder, is the one where I fear your team is most vulnerable, and if the procedure is faithful to Strawson it will indeed tell you that you have been doing her an injury. Personality disorder, unlike acute psychosis, is rarely an exemption in Strawson's sense because it does not typically remove the capacity to understand moral demands, even if it makes complying with them emotionally costly. By habitually managing her rather than reproaching her, your team has adopted an objective attitude that treats her as a child or an object of policy, which is a withdrawal of moral address that you have no business making unless she is currently incapacitated. You mentioned you would rather hear this from the procedure than from a coroner, and the procedure says plainly that by denying her the status of a moral agent who can keep commitments, you are reinforcing the very alienation and lack of agency that often drives her pathology. The value judgment here is that the risk of her breaking commitments must be weighed against the harm of infantilizing her, and the procedure suggests you have tipped too far toward safety at the cost of her dignity. You should shift to a moral-protest stance where her commitments are treated as real promises that matter, and where breaking them attracts reproach rather than just a revised care plan.

  The third case, the man who invokes his diagnosis to ask you to stop holding him to his promises, presents the challenge of self-claimed exemption. The procedure does not allow you to simply switch on an exemption because a service user claims one; you must assess the validity of the claim against the clinical evidence of his capacity. If he is capable of understanding the demand and has no acute impairment, his claim is an attempt to move himself from the participant stance to the objective stance to avoid the discomfort of moral accountability. Here his own self-reactive attitudes, such as his shame or his desire to be seen as ill, belong in the conversation but do not decide it. The procedure tells you to acknowledge his distress but to maintain the moral-protest stance because granting him an exemption he does not clinically qualify for is a form of collusion that undermines his recovery. You must tell him that while you understand he feels driven by illness, you see him as capable of choice, and therefore you will continue to hold him to his promises. This is where your own resentment belongs; it is not a personal grudge but a signal that you are maintaining the relationship as one between adults, and suppressing that signal to spare him discomfort would be to treat him as less than a person.

  I want to close by telling you what such a procedure cannot do, because I do not want you to expect it to solve problems it was not designed to touch. It cannot resolve genuine disagreement among staff about the clinical facts of capacity, and if half the room thinks he is exempt and half thinks he is not, the procedure simply highlights the disagreement for the consultant to break. It cannot answer the question of whether you have enough resources to support a moral-protest stance safely, because sometimes the only reason a team chooses management is that they are too understaffed to handle the conflict that moral demand generates. It cannot tell you whether a specific instance of reproach will trigger a specific instance of violence, because risk assessment remains probabilistic. And finally, it cannot remove the emotional burden from your staff, because holding someone responsible is often harder than managing them, and knowing you are philosophically justified does not make the confrontation less frightening. But what it will do is stop the drift, ensure that your files reflect a coherent theory of agency, and protect both your service users and your team from the corrosion of unexamined paternalism. I hope this serves as a useful foundation for your rounds, and I am happy to discuss how the wording might be tweaked once you have tried it in the room.

  Warmly,

  Your Colleague
