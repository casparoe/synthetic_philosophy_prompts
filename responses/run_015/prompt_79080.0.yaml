      *   *Recommendation:* Abandon the inference that "Reducing Numbers = Reducing Suffering" *via habitat destruction*. Keep (3) (Don't create miserable lives) but add a side-constraint: "Do not kill existing lives to prevent future suffering unless the suffering of death is less than the suffering prevented."
      *   *Cost:* You have to accept that conservation might be "neutral" or "less bad" than destruction, even if wild lives are net negative, because conservation respects existing agents. You might also need to modify (1) to account for rights or constraints.

