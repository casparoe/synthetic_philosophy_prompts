  # The Laws of Nature Sorting Tree

  **Instructions:**
  This handout contains six questions. Each question describes a concrete situation (a "case"). Choose the option that best matches your intuition about that case. Do not worry about the names of philosophical positions; those are revealed only at the end.

  **Taboo Words:**
  To keep the discussion concrete, do not use the following words when discussing your answers: *govern, supervene, necessitate, primitive, Humean.* If you feel you need one of these concepts, describe the *case* that would prove it instead.

  ---

  ### Question 1: The Palimpsest World
  Imagine a universe whose entire history is written in a book. Every single event that actually happens is recorded. Now imagine there are **two** different sets of rules (System A and System B) that both fit every single event in the book perfectly. However, they disagree about what *would* have happened if something else had occurred (a counterfactual). System A says "If X had happened, Y would follow." System B says "If X had happened, Z would follow." X never actually happens.

  **Is there a fact of the matter about which System is the true law of that universe, even if no one can ever check it?**
  *   **(A) Yes.** One system is truly the law, the other is not, regardless of what we can know. *(Go to Q2)*
  *   **(B) No.** "Law" is just a label we give to the system we prefer (because it's simpler, or more useful, or fits our language better). There is no hidden fact beyond the events and our description. *(Go to Q5)*

  ---

  ### Question 2: The Idealization (For "Yes" answers)
  Consider the fundamental equations of physics (like $F=ma$ or Schrödinger's equation). In the real world, objects are never perfectly isolated; there is always some interference.

  **Are these equations strictly and literally true of the objects in the real world?**
  *   **(A) No.** They are true only in artificial, sheltered setups (models). In the messy real world, they are strictly false, though they point to real capacities. *(Leaf: False Fundamentals)*
  *   **(B) Yes.** They describe reality strictly, even if we have to add "all else being equal" clauses to apply them. *(Go to Q3)*

  ---

  ### Question 3: The Decaying Pattern (For "Yes/Yes" answers)
  Imagine a regularity holds perfectly for a billion years (e.g., all particles attract inversely to the square of distance) and then, without any cause or change in the objects themselves, it simply stops holding and changes to a different pattern.

  **Did the law of the universe change?**
  *   **(A) Yes.** The fundamental rule itself changed. It is a basic fact about the world that rules can shift. *(Leaf: Brute Facts)*
  *   **(B) No.** If it changed, it wasn't a law to begin with, or our description was wrong. Laws don't just "stop." *(Go to Q4)*

  ---

  ### Question 4: The Source (For "Yes/Yes/No" answers)
  Think about why objects follow the law.

  **Does the law exist because of what the objects *are* (their intrinsic nature), or is the law a separate rule that the objects *follow*?**
  *   **(A) Because of what they are.** An electron acts that way because it is in its nature to do so. *(Leaf: Causal Powers)*
  *   **(B) A separate rule.** The law is a relation or entity distinct from the objects themselves. *(Go to Q4b)*

      **Question 4b: The Abstract**
      **Is this separate rule a physical relation between properties we can find in the world, or is it an abstract object (like a number or a form) that exists outside space and time?**
      *   **(i) Physical Relation.** *(Leaf: Relations Among Universals)*
      *   **(ii) Abstract Object.** *(Leaf: Platonic Entities)*

  ---

  ### Question 5: The Gold Spheres (For "No" answers to Q1)
  Imagine it is true that every sphere of gold in the history of the universe is less than 1km wide. (There just happens to be no more gold than that).

  **Is that statement a law of nature?**
  *   **(A) Yes, automatically.** If it's true everywhere and always, it's a law. *(Leaf: Naive Constant Conjunction)*
  *   **(B) No, not automatically.** It depends on whether it fits into the best overall system of descriptions. *(Go to Q6)*
  *   **(C) No.** "Law" is the wrong word entirely; we are just using models. *(Leaf: Error Theory)*

  ---

  ### Question 6: The Green vs. Grue (For "No/No" answers)
  Imagine two descriptions fit all observed data equally well. One says "All emeralds are green." The other says "All emeralds are grue" (green before the year 3000, blue after).

  **Is one description objectively the better candidate for a law, or does it depend on our language and interests?**
  *   **(A) Objectively better.** There is a fact about which predicates are "natural" or simple. *(Leaf: Best System Account)*
  *   **(B) Depends on us.** "Law" picks out whatever plays a useful role in our scientific practice. *(Leaf: Quietism)*
  *   **(C) Time-Indexed.** The law might just be "Emeralds are green-before-3000..." if that's what the pattern is. *(Leaf: Time-Indexed Regularity)*

  ---

  ### Leaf Key (Do not look until finished)

  1.  **False Fundamentals:** (Q2-A) Laws are true only in models; real regularities require something extra.
  2.  **Brute Facts:** (Q3-A) Laws are basic, unanalysable facts that can change without explanation.
  3.  **Causal Powers:** (Q4-A) Laws flow from the intrinsic natures or dispositions of things.
  4.  **Relations Among Universals:** (Q4b-i) Laws are contingent relations among physical properties.
  5.  **Platonic Entities:** (Q4b-ii) Laws are abstract entities standing in relation to things.
  6.  **Naive Constant Conjunction:** (Q5-A) Laws are just true universal generalizations.
  7.  **Error Theory:** (Q5-C) Nothing in the world answers to "law"; the word works only inside models.
  8.  **Best System Account:** (Q6-A) Laws are the axioms of the system that best balances simplicity and strength.
  9.  **Quietism:** (Q6-B) "Law" picks out a role in practice; the metaphysics is a pseudo-dispute.
  10. **Time-Indexed Regularity:** (Q6-C) Laws can be local or time-bound without losing their status.

  ---

  ### Meta-Analysis of the Logical Space

  **1. Logical Space and Occupancy**
  The tree has 6 binary (or trinary) branching points. Roughly, this permits $2 \times 2 \times 2 \times 2 \times 3 \times 3 = 144$ possible answer-combinations (cells).
  *   **Occupied Cells:** 10 (The leaves listed above).
  *   **Empty Cells:** 134.

  **2. Analysis of Empty Cells**
  *   **Incoherent:** Many empty cells represent logical contradictions within the tree structure (e.g., answering "No" to Q1 but then answering Q3, which is only reachable via "Yes").
  *   **Unattractive/Unstable:** Some combinations are philosophically unstable. For example, a view that says "There is no fact of the matter about laws" (Q1-No) but also "Universal Generalizations are automatically laws" (Q5-A) is tense: if laws are just summaries, why does *any* summary count? This tension is why **Naive Constant Conjunction** is often abandoned for **Best System**.
  *   **Unexplored:** The cell corresponding to **"Brute Facts" + "Time-Indexed"** (answering Yes to Q3-A, but also holding a view that usually rejects brute changes) is a viable position someone ought to hold.
      *   *Awkward Commitment:* You must accept that the universe has a "clock" built into its fundamental rules without any physical mechanism driving the change. It makes prediction fundamentally limited in a way most physicists dislike.

  **3. Indistinguishable Leaves**
  *   **Relations Among Universals vs. Platonic Entities:** The tree separates these by Q4b (Physical vs. Abstract). However, in practice, it is very hard to construct a case where these two yield different predictions. Both posit a "separate rule." The difference is purely metaphysical (where the rule "lives"). Your group may find these two leaves feel identical in every concrete scenario.
  *   **Error Theory vs. False Fundamentals:** Both claim fundamental equations are not strictly true of the world. The split relies on whether you think "Law" is a word we should keep (False Fundamentals) or discard/replace with "Model" (Error Theory). This is a linguistic distinction more than a case-based one.

  **4. Question Efficiency**
  *   **Most Work:** **Question 1 (The Palimpsest World).** This does the heaviest lifting. It immediately separates the "Realists" (who think laws add something to the world) from the "Anti-Realists" (who think laws are descriptions of the world). Roughly 5 leaves sit on each side.
  *   **Redundant:** **Question 4b (The Abstract).** Distinguishing Universals from Platonic Entities rarely changes how one handles the cases (One-Shot, Decaying, etc.). If you had to cut a question to save time, this is the one to merge into Q4.

  **5. Confidence Note**
  I am least confident in the separation of **Quietism** from the **Best System Account**. Both views agree that "laws" depend on our choice of system/language (Q1-No). The split relies on whether there is an *objective* fact about simplicity (Best System) or whether simplicity is relative to human interests (Quietism).
  *   *Why this is shaky:* A Quietist can agree that "Green" is simpler than "Grue" *for us*, without agreeing it is simpler *for the universe*. The case (Q6) tries to force this, but in a meeting room, people often talk past each other here.
  *   *Reorganization:* If I came to think the deepest split is not Realism vs. Anti-Realism (Q1), but rather **Modal vs. Non-Modal**, I would move Q1 to ask about the **One-Shot World** first. If you think a single event can instantiate a law, you are committed to modality (potentiality) existing in the world. If you think laws require repetition, you are committed to laws being statistical summaries. This might be a cleaner cut than the Palimpsest case, which relies on intuitions about underdetermination that some find artificial. However, the Palimpsest case is better at forcing the "Fact of the Matter" commitment explicitly.
