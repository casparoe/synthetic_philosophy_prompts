  # Diagnostic Decision Tree: Pragmatist Theories of Truth

  ### Root Node
  **Question:** Is truth essentially a property of beliefs that successfully guide action in experience, with no further constraint?
  *   **No:** [Exit] *Respondent falls outside the logical space of pragmatist theories of truth as defined for this seminar.*
  *   **Yes:** Proceed to Axis 1.

  ---

  ### Axis 1: Convergence vs. Pluralism
  **Question:** Does rational inquiry necessarily tend toward a single, unique final representation of reality shared by all investigators, or can incompatible beliefs remain equally valid in different contexts?
  *   **Single Final Representation (Convergence):** Proceed to Axis 2A.
  *   **Equally Valid/Contextual (Pluralism):** Proceed to Axis 2B.

  ---

  ### Axis 2A: Scope (Convergence Branch)
  **Question:** Is the 'success' required for truth restricted to predictive and experimental control of physical phenomena, or does it extend equally to ethical, aesthetic, and religious domains?
  *   **Extended (Broad Domains):** Proceed to Axis 3A1.
  *   **Restricted (Empirical Only):** Proceed to Axis 3A2.

  ### Axis 2B: Scope (Pluralism Branch)
  **Question:** Is the 'success' required for truth restricted to predictive and experimental control of physical phenomena, or does it extend equally to ethical, aesthetic, and religious domains?
  *   **Extended (Broad Domains):** Proceed to Axis 3B1.
  *   **Restricted (Empirical Only):** Proceed to Axis 3B2.

  ---

  ### Axis 3A1: Fallibilism (Convergence + Broad)
  **Question:** Is every belief, in principle, open to future revision, or are some beliefs permitted to become permanently settled?
  *   **Any Response:** **Leaf 1: Logically Possible but Unoccupied (Speculative Convergence).**
      *   *Note:* This position posits a single final truth across ethical/religious domains. It is logically consistent but historically unoccupied within classical pragmatism, which typically restricts convergence to science or rejects convergence entirely in broad domains.

  ### Axis 3A2: Fallibilism (Convergence + Empirical)
  **Question:** Is every belief, in principle, open to future revision, or are some beliefs permitted to become permanently settled?
  *   **Some Permanently Settled:** **Leaf 2: Logically Possible but Unoccupied (Dogmatic Empiricism).**
      *   *Note:* This position asserts a single scientific truth that is immune to future revision. It contradicts the core pragmatist commitment to the open-ended nature of inquiry.
  *   **All Open to Revision:** **Leaf 3: Strict Peircean Convergence Pragmatism.**
      *   *Commitment:* Truth is the ideal limit of scientific inquiry; a single reality exists independent of opinion, but our access is fallible until the community of inquirers converges in the indefinite long run.

  ### Axis 3B1: Fallibilism (Pluralism + Broad)
  **Question:** Is every belief, in principle, open to future revision, or are some beliefs permitted to become permanently settled?
  *   **Some Permanently Settled:** **Leaf 4: Hybrid Local-Convergence Position.**
      *   *Commitment:* Inquiry is globally plural (no single worldview dominates), but within specific contexts or communities, beliefs can achieve temporary or local permanence sufficient to count as settled truth for that domain.
  *   **All Open to Revision:** **Leaf 5: Jamesian Radical Pluralism (Indistinguishable from Deweyan Instrumentalism on these axes).**
      *   *Commitment:* Truth is made in the process of verification; multiple truths can exist simultaneously across ethical, religious, and empirical domains, and all remain subject to the flux of experience.
      *   *Ambiguity Flag:* **Deweyan Instrumentalism** cannot be separated from this leaf using only these three axes. While Dewey emphasizes 'warranted assertibility' over 'truth' and focuses on social problem-solving, his commitments to pluralism, broad scope, and universal fallibilism map identically to this node.

  ### Axis 3B2: Fallibilism (Pluralism + Empirical)
  **Question:** Is every belief, in principle, open to future revision, or are some beliefs permitted to become permanently settled?
  *   **Some Permanently Settled:** **Leaf 6: Logically Possible but Unoccupied (Contextual Dogmatism).**
      *   *Note:* This position allows multiple empirical truths but claims some are permanently fixed within their context. It is rarely held, as pluralists typically extend fallibilism to all empirical claims.
  *   **All Open to Revision:** **Leaf 7: Logically Possible but Unoccupied (Narrow Fallibilist Pluralism).**
      *   *Note:* This position restricts truth to empirical success while denying convergence. It is logically possible but historically rare, as pragmatists who accept pluralism usually extend it to ethical/religious domains (see Leaf 5).

