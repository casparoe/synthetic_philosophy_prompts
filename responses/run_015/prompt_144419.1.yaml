  Here is an accuracy audit structured for use in a referee report. It addresses the theoretical claims, the corollaries, and the specific application to the audit case.

  ***

  **Referee Report: Accuracy Audit of Good’s Theorem Application**

  **1. Summary of the Core Theorem (Claims 1–4)**
  *   **Status:** *Accurate for Bayesian Expected Utility (EU), but omits critical assumptions.*
  *   **Analysis:** The summary correctly identifies the core result for a standard Bayesian EU maximizer: the expected utility of a decision made after observing a free signal is at least as high as the expected utility of a decision made before. The mathematical justification (Jensen’s inequality applied to the convex value function $V(\pi) = \max_a E_\pi[u(a)]$) is correct for this specific framework.
  *   **Missing Assumptions:** The summary hides two assumptions that are crucial for the "information cannot hurt" conclusion:
      1.  **Causal Independence of Observation:** The act of observing the signal must not change the state of the world or the payoff structure *except* through the agent’s subsequent choice. (i.e., The signal cannot trigger external reactions).
      2.  **Freedom to Ignore:** The agent must retain the option to perform the act they would have chosen had they not observed the signal. (i.e., The agent cannot be forced to change their action based on the signal).
  *   **Recommendation:** The authors must explicitly state these assumptions. Without them, the theorem is being presented as more general than it is.

  **2. The Maximin/Ambiguity Claim (Claim 5)**
  *   **Status:** **False.**
  *   **Analysis:** The paper claims the theorem "carries over unchanged" to an agent maximizing worst-case expected utility (Maxmin Expected Utility or MEU) and justifies this via Jensen’s inequality. This is mathematically incorrect. Good’s theorem relies on the *convexity* of the value function in the belief space. For an MEU agent, the value function $V(\mathcal{P}) = \max_a \min_{p \in \mathcal{P}} E_p[u(a)]$ is **not necessarily convex**. Consequently, the expected value of information can be negative.
  *   **Reasoning:** An ambiguity-averse agent often values "hedging" acts that perform moderately well across all priors. Information resolves ambiguity, which can eliminate the ability to hedge. If the loss of hedging value exceeds the gain from better decision-making, the net value of information is negative.
  *   **Counterexample (for the report):**
      While specific numbers depend on the updating rule (e.g., Full Bayesian vs. Maximum Likelihood), the structural failure is robust. Under Full Bayesian Updating, information shrinks the set of priors.
      *   *Setup:* States $\{L, R\}$. Priors $\mathcal{P} = \{p \in [0.4, 0.6]\}$.
      *   *Acts:* $Bet_L$ (pays 1 if $L$), $Bet_R$ (pays 1 if $R$), $Safe$ (pays 0.45 always).
      *   *No Info:* MinEU($Bet_L$) = 0.4; MinEU($Bet_R$) = 0.4; MinEU($Safe$) = 0.45. Agent chooses $Safe$. Value = 0.45.
      *   *With Info:* Suppose a signal arrives that shifts the posterior set to $\mathcal{P}' \subset \mathcal{P}$ in a way that makes the worst-case prior for the optimal *bet* worse than the guaranteed *safe* payoff, when evaluated ex-ante. (See: *Chen, Y. (2020). "Value of Information for Ambiguity Averse Decision Makers."* or *Al-Najjar & Weinstein (2009)*).
      *   *Refutation of Proof:* The paper’s claim that "The argument is just Jensen's inequality" is demonstrably false for MEU, as the $\min$ operator does not commute with expectation in the required way ($E[\min] \neq \min[E]$).
  *   **Recommendation:** The authors must retract the claim that Good’s theorem applies unchanged to maximin agents. This requires significant revision of any analysis relying on ambiguity aversion.

  **3. Corollary 1: Refusing Information (Irrationality Claim)**
  *   **Status:** **Overstated / False.**
  *   **Analysis:** The paper argues that refusing free information implies irrationality or mistake about costs (nuisance/distress). This conflates *instrumental* value (decision improvement) with *intrinsic* value (utility from beliefs).
      1.  **Non-Consequentialist Utility:** If an agent’s utility function includes emotional states (e.g., anxiety, hope) that depend on *knowledge* itself, information can have negative intrinsic utility. Good’s theorem assumes utility is defined over final material outcomes, not belief states.
      2.  **Strategic Commitment:** In game-theoretic contexts, an agent may refuse information to maintain a credible threat or promise (e.g., "I will not negotiate until I see the audit," vs "I don't want to see the audit so I can claim ignorance").
  *   **Recommendation:** The claim that refusing information is "incoherent" is too strong. It should be softened to "incoherent for a consequentialist EU maximizer with no externalities."

  **4. Corollary 2: The Stopping Rule**
  *   **Status:** **Accurate (for EU).**
  *   **Analysis:** For a Bayesian EU maximizer, the rule "gather evidence while Expected Value of Information (EVI) > Cost" is the standard optimal stopping result.
  *   **Caveat:** This relies on the agent being able to calculate EVI, which is often computationally demanding. However, as a normative theoretical claim, it is sound.

  **5. Application to the Audit Case (The Regulator)**
  *   **Status:** **Invalid Application.**
  *   **Analysis:** The application of Good’s theorem to the regulator’s audit decision violates the two critical assumptions identified in Section 1.
      1.  **Violation of Causal Independence (Publicity):** The paper states the audit result is "automatically published" and that "courts, insurers, and the firm itself all change their behavior." This means the *act of observing* (commissioning the audit) changes the payoff structure independently of the regulator’s licensing decision. The information creates an externality (e.g., market panic, liability exposure) that can make the agent worse off, regardless of the decision quality.
      2.  **Violation of Freedom to Ignore (Mandatory Response):** The paper states "agency rules make certain responses mandatory." Good’s theorem requires that the agent remains "free to perform exactly the act you would have performed had you not looked." If the rules *force* the regulator to act differently upon seeing a negative result, the "option to ignore" is removed. If the forced action is suboptimal compared to the original plan (under some states), the information has negative value.
  *   **Recommendation:** The conclusion that "Good's theorem settles the question: commission the audit" is false. The theorem does not apply to this case. To bring the case inside the theorem, the authors would need to assume: (a) the audit results remain confidential (no externalities), and (b) the regulator retains full discretion to ignore the audit results (no mandatory rules).

  **6. Summary of Required Revisions**
  1.  **Retract the Maximin Claim:** Acknowledge that Good’s theorem does not guarantee non-negative value for ambiguity-averse agents (MEU) because the value function is not convex.
  2.  **Qualify the Irrationality Claim:** Acknowledge that refusing information can be rational if utility depends on belief states or in strategic contexts.
  3.  **Correct the Audit Application:** Acknowledge that "publicity" and "mandatory response" rules violate the core assumptions of the theorem (Causal Independence and Freedom to Ignore). The recommendation to commission the audit cannot be derived from Good’s theorem alone; it requires a cost-benefit analysis that includes the external costs of publicity and the constraints of mandatory rules.
