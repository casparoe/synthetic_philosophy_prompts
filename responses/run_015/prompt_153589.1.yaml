          1.  High Office (Controls Pool) + High Need.
          2.  High Office + Low Need.
          3.  Low Office (Gatekeeper) + High Need.
          4.  Citizen + High Need.
          5.  Citizen + Low Need.
          6.  Outsider/Mediator + High Need.
      *   *Constraint:* The prompt asks for *six representative hidden role cards*. I will write these so they can be duplicated/adapted for the 18 students (2 of each per society, or distributed to ensure mix). Let's make them specific to the *tension* rather than just title.
      *   *Correction:* 18 students / 3 societies = 6 students per society. I need 6 distinct role cards that can be distributed among the 18 students (2 of each card type, one per society, or just 6 types distributed across the 18). Let's create 6 *types* of cards, distributed so each society has a mix of Office/Citizen and High/Low Need.

  5.  **Predict the Collapse:**

      *   *Society A:* Requires private gifts. Western standard calls this corruption. But it's the *rule*.
      *   *Society B:* Requires ritual. Western standard might see this as inefficient but not necessarily corrupt.
      *   *Society C:* Bans transfers.
      *   *Prediction:* **Society A** is most likely to collapse into mutual accusations *if* the scarcity is high enough that Office Holders cannot satisfy everyone even with gifts, leading to accusations of "hoarding" or "betrayal of loyalty." However, the prompt asks which structure causes collapse *regardless of formal rules*.
      *   *Refined Prediction:* **Society C** (The Bureaucratic one) is actually the most fragile in a high-survival context. Why? Because it bans the *mechanism* of coordination (exchange). If the formal rule (ban on transfers) conflicts with the survival need (high scarcity), students will break the rule secretly. When revealed, they will accuse each other of breaking the "sacred" impartial rule.
      *   *Alternative Prediction (Better fit for "Corruption" theme):* **Society A**. Why? Because "Personal loyalty is the sole contract-enforcement mechanism." If an Office Holder takes a gift but *still* cannot provide the resource (due to scarcity), the Citizen perceives this as a betrayal of the *social contract* (Loyalty), while the Office Holder perceives it as bad luck. This leads to accusations of "Corruption" (taking without giving) within a system defined by gift-exchange.
      *   *Decision:* I will predict **Society A** collapses. The logic: When survival is at stake, the "gift" becomes a "bribe" in the eyes of the giver if the return isn't guaranteed, but the receiver views it as a "tribute." This ambiguity causes friction.
