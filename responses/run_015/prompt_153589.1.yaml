          *   **Society C (The Impersonal Bureau):** Office Holders distribute Water based on a List (Random/Fixed). No Reds allowed. No Altar.
      *   *Scarcity:* Total Water < Total Need. This forces competition.

      *   *The "Corruption" Reveal:*
          *   Western Standard: Any private exchange for public good = Corruption. (Society A fails).
          *   Anthropological: Ritual for access = Gift/Culture. (Society B passes).
          *   Structural: Systemic necessity = Clientelism. (Society A is "Clientelism").

      *   *Role Cards:* Need to ensure Office Holders have power but also needs.
      *   *Payoff:* "Survival" = 3 Blue tokens. "Thriving" = 3 Blue + 1 Red left. "Death" = <3 Blue.

  7.  **Addressing Specific Prompt Requirements:**

      *   *Predict Collapse:* Society A. (Reason: The ambiguity of the "gift" under scarcity).
      *   *Intervention:* "Freeze Frame" on a rejected gift.
      *   *Unreproducible Feature:* Historical Path Dependence/Trust accumulation.
      *   *6 Role Cards:* Distinct combinations of Power/Need.
      *   *Token Rules:* Precise movement logic.
      *   *Non-monetary Payoff:* Survival tokens.

  8.  **Final Review against Constraints:**
      *   90 mins? Yes.
      *   18 students? Yes (6 per group).
      *   No real countries? Yes (A, B, C).
      *   Hidden roles? Yes.
      *   Scoring matrix reveal? Yes.
      *   Conceptual distinction from mechanics? Yes.

      *(Self-Correction during drafting)*: Make sure the "Scoring Matrix" isn't just handed out as a definition, but used as a tool for the 20-min deliberation. The prompt says "reveal a hidden scoring matrix... Then require groups to defend one classification." Okay, I will provide the matrix in the facilitator guide to be revealed *after* the sim.

