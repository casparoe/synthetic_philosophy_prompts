      *   *Let's go with Society A.* The tension between "Loyalty" and "Scarcity" is the classic clientelism trap. If I give you my last token (gift) and you don't give me water, I accuse you of corruption. You say I didn't show enough loyalty.
      *   *Facilitator Intervention:* Freeze the game, highlight the specific transaction, ask "Was this a gift or a price?"
      *   *Unreproducible Feature:* **Time/History.** Real clientelism relies on decades of trust. A 30-min sim cannot replicate the "shadow of the future." Facilitator must explain this.

  6.  **Drafting the Plan (Iterative refinement):**

