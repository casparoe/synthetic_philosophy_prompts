  so im in a philosophy of biology class this semester and my prof keeps giving her verdicts on borderline life cases and i think shes setting us up for a new one on the final

  here is her track record so far:
  - a normal E coli bacterium: alive
  - a campfire flame: not alive
  - a sterile mule that cant reproduce: alive
  - a lone flu virus particle floating around: not alive
  - a tardigrade dried out in a tun for five years that wakes up when you add water, she says its still alive even while dried out: alive
  - a laptop virus that copies itself and mutates a bit to dodge antivirus: not alive

  next week she wants us to discuss this new case from the chem department. some grad students made what they call forager droplets. they are little oil droplets in water with some chemistry inside so they crawl toward certain salts, soak up fatty micelles as fuel, grow bigger, then pinch in half into two smaller droplets that do the same thing. if you poke one apart it reforms. you can freeze them and restart them. but there is no DNA or RNA or anything like genes, and variation isnt heritable at all, like if you make one wobbly or dye it blue the daughters dont inherit that, they just go back to normal. so they metabolize and divide but they cant really evolove over generations.

  do you think she will say the forager droplets are alive or not? im less interested in just the yes or no than in the rule she seems to be running, like what defintion of life fits all her old verdicts. and are there two different arguements that both fit her old verdicts equally well but split on the droplets? tell me what each one predicts for the droplets, which one you think she is actually using and why, and what one extra hypothetical case would seperate them best going forward
