  If seed falls hard on stone, it will not grow,
  Add drought to this; the barren ground stands still.
  Though warmth depart and no soil lie below,
  No extra clause can bend the stubborn will.
  Pile on the frost, the darkness, and the light,
  The null result remains exactly true.
  Let every harsh condition join the fight,
  And adding more will never change the view.

  But had it fallen there with hope to start,
  It might have sprouted green against the grey.
  Yet add a frost, and cold congeals the heart,
  Add shade, it lives; add drought, it dies away.
  So fact stands firm while fancy shifts its sand,
  One truth holds fast, one slips from out the hand.
