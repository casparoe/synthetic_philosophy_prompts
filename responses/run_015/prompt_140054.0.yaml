  The shortwave radio clicked at 0600, a sharp burst of static followed by the six pips that marked the hour. Elena sat at the iron table in the caretaker's cottage, the heat of the coffee mug seeping into her palms. Outside, the pampas stretched flat and grey under a winter sky, the grass stiff with frost. This was the last week. In spring, the road crews would come to dismantle the dome, to strip the copper wiring, to seal the logbooks into boxes for the archive.

  She had kept the books for six years. Leather-bound, heavy, smelling of dust and ink. Every clear night, a page. Every clouded night, a note. It was a rhythm more reliable than the stars themselves.

  She opened the book to yesterday's date. The page was full.

  She blinked. She turned the page back, then forward again. There were two entries for the night past. Both dated correctly. Both in her hand—the loop of the 'y', the sharp cross of the 't' unmistakable. The ink was dry on both. They occupied the same space on the page, not one above the other, but woven into the same paragraph, except for a single divergence.

  Entry one: *03:00. Frost heavy. Lens **cleared**.*
  Entry two: *03:00. Frost heavy. Lens **ignored**.*

  Elena sat very still. The radio hummed in the background, a low carrier wave.

  She remembered the cold. She remembered the bite of it through her wool gloves as she climbed the ladder to the dome slit. She remembered the scraper in her hand, the sound of ice cracking against the glass, the satisfaction of the clear patch she had wiped away so the sensor could breathe. She remembered the relief of climbing back down, the warmth of the cottage stove.

  She also remembered the cold. She remembered the heaviness in her limbs, the decision to stay under the blanket. She remembered telling herself the frost wouldn't matter, that the heating element would handle it. She remembered the silence of the cottage, the guilt settling in her stomach as she drifted off, knowing she had neglected the protocol.

  Both memories had texture. Both had weight. The first carried the ache of cold fingers; the second carried the ache of shame. They did not feel like a dream fading upon waking. They felt like two roads she had walked, both ending at this chair, this mug, this morning.

  She stood up and walked to the window, looking toward the dome. It sat silent on the hill, white against the grey grass. If she had ignored the frost, the lens should be coated. The heating element was old; it rarely kept up with a hard freeze. If she had cleared it, the glass should be clean.

  She would have to go up there to check. But she knew, with a sudden certainty, that checking would not solve the problem. If the lens was clean, it would prove the first entry true and the second false. If the lens was frosted, it would prove the second true and the first false. But neither outcome would erase the memory of the path not taken by the glass.

  If the lens was clean, she would still remember the warmth of the blanket and the choice to stay in it. She would still feel the guilt of the woman who slept.
  If the lens was frosted, she would still remember the scrape of the ice and the cold wind. She would still feel the pride of the woman who worked.

  The question "Which one happened?" felt suddenly thin, like asking which hand is the real hand when you are clapping. They had both led here. The night had forked, and the morning had gathered the pieces back up. She was the place where they met.

  She sat back down. The archive would take the book. A young technician in Buenos Aires would read this page in six months. What would they make of it? They would assume a mistake. A slip of the pen. A moment of confusion in the dark. They would circle the word *ignored* and write a note in the margin: *Contradiction. Verify with sensor data.*

  The sensor data would be clean. The image quality from 03:00 was perfect. The physical record supported the woman who worked. The physical record exonerated her.

  But the woman who slept was also her.

  Her colleague, the physicist who visited sometimes to check the wiring, would tell her she was tired. He would say there is only one history, one block of time, and that she was misremembering. He would say she wrote one line, realized it was wrong, and wrote the correction without crossing out the error, though the ink density was identical. He would say the universe does not allow for contradictions.

  But the universe was not here. The book was. The memory was.

  She thought about the guilt. It sat in her chest, heavy and cold. She had neglected her duty. She had risked the instrument. In the world where the lens was frosted, perhaps the heating element would have failed. Perhaps the glass would have cracked. Perhaps the station would have lost a month of data. That woman would be fired. That woman would carry the failure for years.

  In this world, the lens was clean. The data was saved. She would receive her pension with honor.

  Was she allowed to feel relieved? If she accepted the relief, she was denying the woman who slept. She was saying that version of herself was a mistake, a ghost, something to be shed. But that woman's memory was as vivid as the cold wind. That woman's fear was real.

  If she accepted the guilt, she was punishing herself for a failure that physically did not happen. The lens was clean. No harm was done. To feel shame would be irrational.

  Unless the harm wasn't the lens. Unless the harm was the choice itself.

  Elena picked up the pen. She hovered it over the page. She could cross out *ignored*. She could make the record consistent. She could align the paper with the physical reality of the clean lens. It would be easy. A single stroke of ink.

  But the book was a record of time, not just of weather. If time had forked, then the book should hold the fork. To erase the word was to erase the path. It was to say that only the successful version mattered, that the struggle was irrelevant if the outcome was good.

  She thought of the man who runs over a dog in the street. In one version, he brakes in time. In another, he does not. If he wakes up in the version where the dog lives, does he owe nothing to the dog that died? If he feels relief, is he a monster? If he feels grief, is he mad?

  She was not a philosopher. She was a night assistant. Her job was to watch the sky and write down what happened.

  What happened was both.

  She put the pen down. She closed the book. The leather creaked.

  She would not cross it out. She would pack the book as it was. When the archivists asked, she would tell them the truth: that she wrote both. They would mark her as senile. They would note that the final log of Station 4 was compromised by the caretaker's decline. They might even discard the page.

  Let them.

  She stood up and put on her coat. She had to go up to the dome to lock it for the last time. She needed to see the lens. Not to check the frost, but to acknowledge the convergence.

  Outside, the wind was sharp. The grass whispered against her trousers. She climbed the ladder, the metal rungs cold through her gloves. Inside the dome, the air was still. She looked up at the lens.

  It was clean. Perfectly clear. The light of the grey morning passed through it without scattering.

  She touched the glass. It was cold, but dry.

  "You did the work," she said to the glass.

  "And I didn't," she said to the silence.

  She climbed down. The guilt did not leave her, but it changed shape. It was no longer a question of punishment. It was a debt. She owed something to the version of herself who had slept. She owed her the vigilance she had lacked. She owed her the care she had neglected.

  For the rest of the week, until the road crews arrived, she would check the lens every hour. Not because the protocol demanded it—the station was closing, the data no longer mattered. She would do it because the woman who slept needed to know that someone was watching. She would carry the vigilance for both of them.

  Back in the cottage, the radio clicked again. A time signal. Another hour marked. Another moment where the future split and the past gathered itself up.

  Elena opened the book one last time. She looked at the two words. *Cleared. Ignored.*

  She ran her finger over the ink. It was dry. It was real.

  She picked up the pen and wrote nothing. She simply closed the book, tied the strap, and waited for the trucks to come. She would take the guilt with her. It was hers. All of it.
