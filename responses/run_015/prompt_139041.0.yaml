answer: |-
  Here is a design for a ninety-minute seminar section titled **"The Liability of Control."** It is built to operationalize Schelling's *The Strategy of Conflict* (specifically the logic of the threat that leaves something to chance and the burning of bridges) and Jervis's *Perception and Misperception*, without requiring a lecture prior to play.

  ### I. Game Overview

  **Title:** The Liability of Control
  **Players:** 18 students (9 pairs per round).
  **Materials per Pair:**
  *   1 six-sided die (d6).
  *   1 "Controller Card" (distinctive color, e.g., Red).
  *   2 "Burn Tokens" per player (e.g., poker chips or distinct coins).
  *   1 Deck of 10 "Fog Cards" (for Block 2 only).
  *   Score sheet.

  **The Stakes:**
  *   **Territory:** 10 Points (Awarded to the player who forces the other to Retreat, or split if both Retreat).
  *   **Catastrophe:** -50 Points (Both players lose if the Die rolls 1–3 at Crisis Level 5).
  *   **Status Quo:** 0 Points.

  **The Board (Mental Track):**
  *   **Crisis Level:** 1 (Safe) to 5 (Brink).
  *   **Catastrophe Threshold:** At Level 5, the d6 is rolled. On 1–3, Catastrophe. On 4–6, the player who *did not* Retreat wins the Territory (10 pts).

  ### II. Mechanics & Rules (For Instructor Use)

  Do not distribute a rule sheet. Project the moves on the screen or write them on the board *after* students are seated. Read the instructions aloud as "Protocol."

  **The Moves (Available each Turn):**
  1.  **Hold:** Maintain current Crisis Level.
  2.  **Alert:** Increase Crisis Level by +1. (Reversible next turn).
  3.  **Deploy:** Increase Crisis Level by +1. **Spend 1 Burn Token.** (Irreversible: You cannot choose "Retreat" in future turns).
  4.  **Retreat:** Decrease Crisis Level by -1. (Forbidden if you have no Burn Tokens left *and* you are not the Controller).

  **The Controller Card (Last Clear Chance):**
  *   Starts with the **Defender** (Player 2).
  *   **Function:** Only the player holding the Controller Card may choose **Retreat** when the Crisis Level is 4 or 5.
  *   **Transfer:** The Card *must* be passed to the opponent at the end of every turn.
  *   **Constraint:** If you hold the Controller Card at Level 5, you *must* either Retreat or Roll. If you have no Burn Tokens, you *must* Retreat. If you have Burn Tokens, you *may* Roll.

  **Winning the Round:**
  *   **Victory:** Opponent Retreats while you remain. (You get 10, they get 0).
  *   **Compromise:** Both Retreat. (Both get 5).
  *   **Catastrophe:** Die Roll at Level 5 results in 1–3. (Both get -50).
  *   **Stalemate:** Time expires before Level 5. (Both get 0).

  ### III. Timeline (90 Minutes)

  **0:00 – 0:10 | Setup & Pairing**
  *   Assign pairs. Designate Player 1 (Challenger) and Player 2 (Defender).
  *   Distribute materials.
  *   **Instruction:** "You are in a crisis over territory. You want the points. You do not want the Catastrophe. You have 6 turns per round. Play 3 rounds. Rotate partners after each round. Do not talk about the rules; talk only to your partner."
  *   *Note:* Do not define "Credibility," "Commitment," or "Brinkmanship."

  **0:10 – 0:35 | Block 1: Clean Signals (25 mins)**
  *   **Condition:** Perfect information. Moves are visible and exactly as stated.
  *   **Pacing:** 3 Rounds (approx. 7 mins each).
  *   **Fast Groups:** If a pair finishes in 2 minutes, they must play a "Rematch" with the stakes doubled (Territory = 20 pts) to test risk tolerance.
  *   **Slow Groups:** At 7 minutes, call "Turn 6." If Crisis Level < 5, force an immediate Die Roll. This punishes delay and creates end-game pressure.

  **0:35 – 1:00 | Block 2: The Fog of Crisis (25 mins)**
  *   **Condition:** Misperception introduced.
  *   **New Rule:** When playing **Alert** or **Deploy**, draw a **Fog Card**.
      *   *Card Text:* "Signal Clear" (70% of deck) -> Opponent sees actual move.
      *   *Card Text:* "Signal Noise" (30% of deck) -> Opponent sees the move as *one level more aggressive* (e.g., Hold reads as Alert; Alert reads as Deploy).
  *   **Crucial Constraint:** The player drawing the card sees it, but *does not tell the opponent what it says.* They simply state their move. The opponent records what they *perceive*.
  *   **Pacing:** 3 Rounds. Rotate partners.

  **1:00 – 1:30 | Debrief (30 mins)**
  *   See Section V below.

  ### IV. Anticipated Failure Modes & Handling

  | Failure Mode | Diagnosis | Handling Note |
  | :--- | :--- | :--- |
  | **Collusion** | Pairs agree to split points (5/5) every round to avoid risk. | **Intervention:** In Block 2, announce a "Leaderboard." Top 3 scores get bonus credit. This introduces tournament pressure that breaks collusion. |
  | **Risk Neutrality** | Students treat -50 as just a number and roll casually. | **Intervention:** In the intro, state: "A Catastrophe result eliminates you from the Leaderboard entirely." Make the downside lexicographic. |
  | **The Griefers** | One pair escalates to Level 5 immediately for fun. | **Debrief:** Use them. "Pair 7 chose War. Why? Because for them, the utility of disrupting the seminar exceeded -50 points. In IR, we assume rational actors. When that fails, the model breaks." |
  | **Controller Resentment Missing** | Students don't mind holding the Controller Card. | **Design Fix:** Ensure the rule is strict: *Only* the Controller can Retreat at Level 4/5. If they hold it, the burden of saving the game is legally theirs. Ask in debrief: "Who felt angry receiving the Card at Turn 5?" |
  | **Time Overrun** | Pairs still negotiating at 1:00. | **Hard Stop:** "Drop the dice. If Level is 4 or 5, roll now. If Level is <4, Score is 0." This simulates crisis timeout/collapse. |

  ### V. The Debrief: Mapping Mechanics to Theory

  Do not ask "What did you learn?" Ask specific forensic questions about their decisions.

  **1. Cheap Talk & Structure (10 mins)**
  *   **Question:** "In Round 1, how many of you told your partner 'I will not retreat'? Did they believe you?"
  *   **Theory:** Cheap talk is costless. In the game, saying "I won't retreat" costs nothing.
  *   **Mechanism:** Point to the **Burn Token**. "The only time you were believed was when you spent a token. Why? Because it degraded your own agency. You didn't prove you were *tough*; you proved you were *bound*."
  *   **Takeaway:** Credibility comes from surrendering choice (Schelling's *burning bridges*), not from asserting resolve.

  **2. The Liability of Control (10 mins)**
  *   **Question:** "Who held the Controller Card at Turn 5? Raise your hand. Did you feel safer or more vulnerable than your opponent?"
  *   **Theory:** The *Last Clear Chance* (Quincy Wright/Herman Kahn).
  *   **Mechanism:** The Controller Card is a liability. Holding it means the responsibility for avoiding catastrophe rests on you. If you are "Burned" (no retreat option), you want the *opponent* to hold the Card so they can save you.
  *   **Takeaway:** In a crisis, having the final say is often a disadvantage. You want to maneuver the adversary into a position where *they* must make the concession to avoid disaster.

  **3. Deliberate vs. Accidental Risk (10 mins)**
  *   **Question:** "In Block 2, how many Catastrophes occurred? How many were intentional rolls vs. misread signals?"
  *   **Theory:** The Spiral Model (Jervis).
  *   **Mechanism:** The **Fog Cards**. In Block 1, risk was deliberate (you chose to roll). In Block 2, risk was accidental (you thought you were at Level 3, opponent thought Level 4).
  *   **Takeaway:** Brinkmanship relies on controlling risk. Misperception turns controlled risk into uncontrolled roulette. The game separates *coercive risk* (Block 1) from *systemic risk* (Block 2).

  ### VI. Limitations: What the Game Cannot Reproduce

  You must address this explicitly in the final 5 minutes. Do not let them leave thinking the game *is* the crisis.

  **1. The Payoff Problem (Finite vs. Infinite)**
  *   **The Simplification:** In the game, Catastrophe is -50 points. It is a bad outcome, but mathematically comparable to winning 10 points.
  *   **The Reality:** In nuclear crises, the catastrophic outcome is lexicographically preferred against. It is not -50; it is $-\infty$. No amount of territory is worth it.
  *   **Discussion:** "In the game, you might roll the die if the pot was 1000 points. In reality, there is no pot large enough. This means rational actors in the real world should *never* reach Level 5. The fact that they do suggests the game misses a variable: **Uncertainty about the Payoff.**"

  **2. The Information Problem (Symmetric vs. Asymmetric)**
  *   **The Simplification:** You knew your partner's Burn Tokens (2 per player). You knew the rules.
  *   **The Reality:** In real crises (e.g., Cuba 1962), you do not know how many "Burn Tokens" the adversary has. You don't know if their leadership is bound by domestic politics (Locked) or free to Retreat.
  *   **Discussion:** "The game made the 'Burn' visible. In reality, commitment is often hidden. This leads to miscalculation. You might push because you think they can retreat, not knowing they have already burned their bridges."

  **3. The "Rational Actor" Assumption**
  *   **The Simplification:** The game assumes you want points and dislike -50.
  *   **The Reality:** Leaders may value prestige, ideology, or regime survival over the "Points" in the game.
  *   **Discussion:** "If your opponent values 'Honor' more than 'Safety,' the -50 payoff doesn't deter them. The game assumes a shared desire to avoid catastrophe. Real crises often involve actors who value the fight more than the survival of the state."

  ### VII. Instructor's Cheat Sheet (Key Concepts to Write on Board *After* Play)

  *   **Commitment:** Making a threat credible by restricting your own future choices (Burn Tokens).
  *   **Brinkmanship:** Deliberately creating a risk of disaster to force concession (Moving to Level 4/5).
  *   **Last Clear Chance:** The asymmetry of who has the final option to retreat (Controller Card).
  *   **Security Dilemma / Spiral:** When defensive moves are read as offensive (Fog Cards).

  ### VIII. Why This Design Works for Your Constraints

  1.  **No Lecture:** The rules are the theory. They discover the "Liability of Control" by feeling the resentment of holding the Card.
  2.  **Probability vs. Magnitude:** The "Alert" move raises Probability (Level). The "Territory" is Magnitude. The "Burn Token" is Irreversibility. They learn that raising Probability without Irreversibility is cheap talk.
  3.  **Physical Randomizer:** The d6 roll at Level 5 creates genuine tension. It is not a number on a page; it is a physical event they trigger.
  4.  **Block 2 Contrast:** By running the clean version first, they establish a baseline of "rational risk." Block 2 corrupts that baseline, allowing you to distinguish between *calculated* brinkmanship and *accidental* war in the debrief.
  5.  **Scalability:** 9 pairs can play simultaneously with minimal space. Materials fit in a briefcase.

  **Final Advice:** When a pair triggers a Catastrophe in Block 1, do not comfort them. Let the -50 sit on their score sheet. That discomfort is the pedagogical hook for the debrief. When they complain it was "unfair," ask: "Was the move that led there reversible? If not, was it unfair, or was it the logic of the commitment you chose?"
