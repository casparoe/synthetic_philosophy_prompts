      *   *Step 3: The Break.* The curve breaks.
      *   *Step 4: The Explanation (Knowledge Growth).* Why did it break? Not just "people reacted," but "people learned something new that changed the system."
      *   *Step 5: The Generalization (Popper's Point).* Connect to knowledge growth unpredictability.

      *   *Dependencies:* Must establish the *law-like* nature of the initial prediction before showing it fails. Otherwise, it's just "models are hard." Must establish the *mechanism* of failure (knowledge/behavior change) before generalizing to epistemology.

