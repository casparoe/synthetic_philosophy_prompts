  2.  **Deconstruct Popper's Argument (for internal alignment):**
      *   Popper isn't saying history is random. He's saying human history is influenced by the growth of human knowledge.
      *   We cannot predict future knowledge (because if we could, we'd have it now).
      *   Therefore, we cannot predict the future course of history (where history depends on knowledge).
      *   This undermines "historicism" (the idea that there are deterministic laws of historical development like physics).
