answer: |-
  My dear friend,

  Your letter arrived this morning here in Dublin and I have spent the better part of an hour walking the garden with your question turning over in my mind like a stone in a pocket. It is a sharp objection, perhaps the sharpest one can bring against the view I have come to hold dear in these later years, and I appreciate that you do not offer it lightly. You ask why, if consciousness is truly one singular entity as the Upanishads claim, a stroke can sever a man from the memory of his own children, seemingly chopping the mind into pieces. It is a devastating observation because it appeals to the hardest of facts, the physical vulnerability of the brain, and I will not pretend it does not strike at the heart of the mystery.

  If I were to wave this away by saying the brain is merely an illusion, I would be dishonest with you and with science. The brain is real, its damage is real, and the loss of memory is a tragedy that cannot be spiritualized away. However, my thesis does not rest on the idea that the brain is the mind, but rather that the brain is the vessel through which the one mind manifests in time and space. You must distinguish between consciousness itself and the contents of consciousness. The memory of a child, the recognition of a face, the narrative of a personal history, these are functions of the neural mechanism. They are data stored in the physical apparatus. When the apparatus is damaged by a stroke, the data is corrupted or lost, just as a broken radio ceases to play the symphony. But does the breaking of the radio destroy the broadcast? Does it destroy the music itself?

  This is where I must be honest with you about the fragility of my position. The analogy of the radio is comforting, but it is only an analogy, and it risks slipping into dualism, which I wish to avoid. The difficult truth I must concede is that we do not know how the one becomes the many in appearance. If consciousness is truly one, then the individuation we experience is a kind of trick, a Maya. The stroke proves that the individuation is physically enforced. It hurts my view only in the sense that it highlights our profound ignorance of the mechanism of individuation. It forces me to admit that while I am convinced of the unity of the substratum, the way this unity accommodates the specific damages of the physical world is something I cannot fully explain without resorting to metaphor. I cannot show you the mathematical proof of why the one mind forgets itself when the brain bleeds.

  Yet, I do not retreat from the conclusion. The loss of memory is not the loss of the self that experiences the loss. Even in the confused state of the patient, there is still a witnessing presence, however fragmented the content may be. The pain is felt, the confusion is experienced. That capacity to experience, the bare fact of being aware, remains unchopped. The stroke removes the furniture from the room, but it does not destroy the light that illuminates the room. If the mind were truly plural, if each of us were a separate ontological entity, then the death of one would be the absolute extinguishing of a universe. But I suspect, and the Vedanta confirms, that the plurality is in the forms, not in the substance. The tragedy of the stroke is that it damages the form so severely that the expression of the substance is hindered, but it does not split the substance itself.

  I understand why this feels unsatisfactory when faced with the suffering of a man who cannot recognize his son. It feels like I am prioritizing metaphysics over human tragedy. I am not. I am suggesting that the tragedy lies in the attachment to the personal narrative, which is always vulnerable to the brain's decay. If we identify ourselves solely with our memories and our personalities, then yes, the stroke proves we are fragmented and perishable. But if we identify with the consciousness that knows the memories, then the damage is to the instrument, not the musician. I admit this is a difficult stance to maintain when faced with the brutal evidence of neurology. It requires a leap of faith, not in a religious dogma, but in the logical necessity that there cannot be multiple infinities. There can only be one. So I stand by the view, though I acknowledge that the bridge between the singular mind and the plural brains remains the darkest part of the map, and your example of the stroke illuminates that darkness without dispelling it.

  Yours sincerely,

  Erwin Schrödinger
