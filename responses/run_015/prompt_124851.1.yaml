answer: |-
  # Operational Procedure: Residual Accountability Determination

  **Purpose:** To evaluate applicants for "Residual Accountability" status. This status grants exemption from criminal prosecution in exchange for full public testimony and ongoing civil restrictions. It is not amnesty; it is a conditional civil status acknowledging guilt without prison.

  **Team Requirement:** Minimum of three decision-makers present for final determination. None need be lawyers, but all must sign the ethical pledge of confidentiality and impartiality.

  ---

  ## Phase 1: The Hard Gates (Automatic Disqualifiers)
  *These steps are factual and binary. If the answer is NO, the application stops immediately. No values discussion yet.*

  **Step 1: Admission of Core Acts**
  *   **Question:** Does the applicant admit to participating in or ordering specific acts of violence, detention, or dispossession?
  *   **Requirement:** They must admit *their own* role. Blaming only others without admitting personal agency is a failure.
  *   **Decision:**
      *   **YES:** Proceed to Step 2.
      *   **NO:** **STOP.** Application rejected. Refer to standard community dispute mechanisms or legal aid if available.

  **Step 2: Cessation of Threat**
  *   **Question:** Is the applicant currently armed, holding a position of coercive power, or actively affiliated with an armed group?
  *   **Requirement:** Immediate disarmament and resignation from any command structure is a precondition for applying.
  *   **Decision:**
      *   **YES (They are safe/civilian):** Proceed to Step 3.
      *   **NO (They are still active):** **STOP.** Application rejected. Security takes precedence over justice.

  **Step 3: Corroboration of Critical Truth**
  *   **Question:** Can at least one key factual claim made by the applicant be independently verified (e.g., location of remains, identity of victims, timeline of events)?
  *   **Requirement:** Unverifiable stories do not qualify. We need evidence that the testimony helps establish the historical record.
  *   **Decision:**
      *   **YES:** Proceed to Step 4.
      *   **NO:** **STOP.** Application rejected. Truth must be demonstrable.

  ---

  ## Phase 2: The Values Calls (Judgment Required)
  *These steps require deliberation. There is no automatic "No," but these are the points where your team must define your moral boundaries. Record the reasoning for every decision here.*

  **Step 4: Completeness vs. Utility (The "Upper Chain" Problem)**
  *   **Question:** Did the applicant provide *all* known information, including names of superiors or financiers?
  *   **The Tension:** Sometimes lower-level actors know names but fear retaliation. Sometimes they claim ignorance to protect leaders.
  *   **Values Call:** Does the truth provided (e.g., burial sites) outweigh the truth withheld (e.g., command structure)?
  *   **Decision:**
      *   **Accept:** The truth provided is deemed high-value enough to excuse gaps.
      *   **Reject:** The gaps undermine the goal of accountability (e.g., protecting architects of violence).
      *   **Flag:** *This is a major unsettled value. See "Unsettled Values" below.*

  **Step 5: Victim/Community Consultation**
  *   **Question:** What is the stance of the direct victims and the immediate community?
  *   **The Tension:** Restorative justice (like Gacaca) relies on community reintegration. However, victims cannot hold a veto over truth, or silence will be bought by fear.
  *   **Values Call:** How much weight do you give to community opposition? Is a 50/50 split a barrier? Does "forgiveness" matter more than "acceptance of punishment"?
  *   **Decision:**
      *   **Accept:** Community concerns are noted but restrictions are deemed sufficient.
      *   **Reject:** Community opposition is so severe that granting status risks renewed violence or deep trauma.
      *   **Flag:** *This is a major unsettled value. See "Unsettled Values" below.*

  **Step 6: Design of Restrictions (The "Residual" Element)**
  *   **Question:** Are the proposed civil restrictions proportional to the harm and feasible to enforce?
  *   **Requirement:** Restrictions must be public and ongoing (e.g., ban on public office, mandatory weekly labor, public apology).
  *   **Values Call:** Is "community repair work" enough for grave crimes? Does banning them from office satisfy the need for justice?
  *   **Decision:**
      *   **Accept:** Restrictions are approved.
      *   **Reject:** Restrictions are too lenient to be meaningful or too harsh to be enforceable.

  ---

  ## Phase 3: Final Determination
  *   **Vote:** All three decision-makers must vote.
  *   **Unanimous:** Status Granted.
  *   **Split Vote:** Status Denied (In cases of doubt, err on the side of not granting immunity).
  *   **Output:** A public certificate of "Residual Accountability" listing the admitted acts and the specific restrictions.

  ---

  # Case Runs

  Here is how the procedure applies to your two specific cases.

  ## Case 1: The Militia Organizer
  *   **Profile:** Organized local units. Can identify three burial sites. Refuses to name superiors who gave orders ("not certain").
  *   **Step 1 (Admission):** **PASS.** Admits to organizing units.
  *   **Step 2 (Threat):** **PASS.** Assumes he is currently civilian.
  *   **Step 3 (Corroboration):** **PASS.** Burial sites can be dug up and verified. This is high-value truth.
  *   **Step 4 (Completeness):** **VALUES CALL.**
      *   *Logic:* He is withholding the "command responsibility." This protects the leadership from exposure.
      *   *Procedure Outcome:* If your team prioritizes **Truth Utility** (finding bodies), you **ACCEPT**. If you prioritize **Accountability Hierarchy** (naming bosses), you **REJECT**.
      *   *Likely Result:* **ACCEPT.** The physical recovery of remains is often weighted higher in transitional justice than prosecuting mid-level organizers, because it closes wounds for families.
  *   **Step 5 (Community):** **PASS.** Families of the disappeared usually prioritize knowing where loved ones are over punishing the organizer.
  *   **Step 6 (Restrictions):** **PASS.** Ban from office + labor.

  **Result:** **Status Granted.**
  **The Uncomfortable Truth:** You have granted a form of immunity to a man who protected the warlords. You traded justice for the leaders in exchange for truth about the dead. This looks like impunity for the command structure.

  ## Case 2: The Elderly Guard
  *   **Profile:** Guarded a detention site. Provides full names of detainees and guards. Expresses remorse. Community is split 50/50 (half want forgiveness, half want prison).
  *   **Step 1 (Admission):** **PASS.** Admits role.
  *   **Step 2 (Threat):** **PASS.** Elderly, non-combatant.
  *   **Step 3 (Corroboration):** **PASS.** Names can be cross-referenced with missing persons lists.
  *   **Step 4 (Completeness):** **PASS.** Provided full names.
  *   **Step 5 (Community):** **VALUES CALL.**
      *   *Logic:* The community is divided. Granting status might inflame the half who want prison. Denying status punishes a truth-teller because others are angry.
      *   *Procedure Outcome:* If your team prioritizes **Social Stability**, you **REJECT** (to avoid angering the half who want prison). If you prioritize **Incentivizing Truth**, you **ACCEPT** (because he did everything asked).
      *   *Likely Result:* **REJECT.** In a local, non-mandated context, you cannot afford to alienate half the community. Your authority relies on local consent.
  *   **Step 6 (Restrictions):** N/A (Rejected at Step 5).

  **Result:** **Status Denied.**
  **The Uncomfortable Truth:** You are punishing full cooperation because the victims cannot agree. This signals to future applicants that telling the truth is not enough; you must also be lucky enough to be forgiven. This undermines the incentive to testify.

  ---

  # Unsettled Value Judgments (Team Discussion Required)

  Before using this tomorrow, your team must agree on the following. The procedure cannot run without these answers.

  **1. The "Upper Chain" Threshold (Step 4)**
  *   **The Question:** Is revealing burial sites enough to excuse protecting superiors?
  *   **The Risk:** If you say **Yes**, you become a tool for leaders to hide behind subordinates. If you say **No**, you may never get the locations of the dead.
  *   **Decision Needed:** Define "Full Testimony." Does it mean "Everything you know" or "Everything that helps victims most"?

  **2. The Community Veto (Step 5)**
  *   **The Question:** Can a single victim family block an application? Does a 50/50 community split mean automatic rejection?
  *   **The Risk:** If victims have a **Veto**, perpetrators may intimidate victims to block applications. If victims have **No Voice**, you impose justice from above and risk community backlash.
  *   **Decision Needed:** Define "Consultation." Is it informational (we listen, then decide) or consensual (we decide based on their wish)?

  **3. The Enforcement Reality (Step 6)**
  *   **The Question:** Who enforces the civil restrictions?
  *   **The Risk:** You have no national mandate. If the applicant runs for office anyway, who stops them? If they skip community work, what happens?
  *   **Decision Needed:** Define the consequence of breach. Does "Residual Accountability" revert to "Prosecution" (if possible), or just public shaming? If you cannot enforce restrictions, the status is meaningless.

  # Summary for Your Meeting
  *   **Use the Hard Gates** to filter out liars and active threats quickly.
  *   **Pause at the Values Calls.** Do not rush Step 4 and 5. These are where your legitimacy is built or lost.
  *   **Expect Discomfort.** Case 1 shows you may have to tolerate some impunity to get truth. Case 2 shows you may have to reject truth to keep peace. Acknowledge this tradeoff openly with your team.
  *   **No Citations Needed.** This logic draws on the practical tensions seen in South Africa (truth vs. justice) and Rwanda (community vs. individual guilt), but is stripped down for local use.

  **Immediate Action:** Before the meeting, decide on the "Community Veto" rule. That is the most likely point of failure for a local group without state power.
