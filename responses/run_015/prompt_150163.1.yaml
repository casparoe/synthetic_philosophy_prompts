answer: |-
  You have constructed a sharp *reductio ad absurdum* of the conjunction of (1) and (3). Since the conclusion (5) is unacceptable—decision theory must be able to distinguish a dollar from a Pasadena gamble—you are correct that one of the premises must be rejected.

  You should reject **(3)**.

  Here is the diagnosis of why (3) fails, why it felt compelling, what the cost of rejecting it is, and why keeping (1) is the safer harbor.

  ### 1. Why (3) is False
  Step (3) asserts a continuity principle: *If two gambles differ only on an event of probability $\delta$, their rational evaluation must differ by an amount that vanishes as $\delta \to 0$.*

  This principle holds if you measure "distance" between gambles by **probability of disagreement** (convergence in probability). However, Expected Value theory measures distance by **expected absolute difference** (convergence in $L_1$).

  In your construction of $G^*$, you ensure the probability of disagreement is $\delta$, but you scale the payoffs on that disagreement by $1/\delta$ (and then some, to generate the harmonic divergence).
  *   **Probability Distance:** $P(G \neq G^*) = \delta \to 0$.
  *   **Value Distance:** $E[|G - G^*|] = \infty$.

  Expected Value theory is continuous with respect to the latter, not the former. A sequence of random variables can converge almost surely to a limit (agreeing on probability 1) while their expectations diverge to infinity. Your construction exploits exactly this gap. Step (3) smuggles in the assumption that the payoffs on the $\delta$-branch are bounded, or at least uniformly integrable. Once you allow unbounded utility, small-probability events can carry infinite weight.

  ### 2. Why (3) Looked Fine
  The intuition behind (3) is robust in almost all practical and bounded contexts. It underpins the idea that we can ignore "de minimis" risks. If I offer you a gamble, and then modify it so that in one in a billion cases you get \$100 instead of \$0, your evaluation shouldn't shift meaningfully.

  This intuition works because, implicitly, we assume **bounded utility** in ordinary reasoning. If there is a maximum possible value $M$ any outcome can have, then changing an outcome on a set of probability $\delta$ changes the EV by at most $M \cdot \delta$. In a bounded world, (3) is a theorem.

  The Pasadena perturbation violates the hidden premise of boundedness. It feels like a "small" change because we focus on the *likelihood* of the branch, but EV theory is sensitive to the *magnitude* of the branch. The fallacy is equating "rare" with "negligible." In unbounded EV theory, rare things are only negligible if their value doesn't scale inversely with their probability.

  ### 3. The Cost of Rejecting (3)
  You are worried that dropping (3) surrenders the intuition that "tiny-probability differences can't carry much weight," which you note does work in dominance and sure-thing reasoning.

  **You do not lose Dominance.**
  Statewise Dominance says: If $G(\omega) \geq H(\omega)$ for all $\omega$, then $G \succeq H$. This does not rely on probabilities at all, let alone small ones. It is safe.

  **You do lose "Probabilistic Negligence."**
  You must accept that in an unbounded utility framework, you cannot ignore an outcome solely because it is improbable. If the payoff is sufficiently large (or structurally volatile, like Pasadena), it dominates the evaluation.
  *   **The Cost:** You cannot argue that a gamble is "effectively" the same as its truncated version just because the truncation probability is low.
  *   **The Benefit:** You avoid Pascal's Wager-style vulnerabilities. If you kept (3), you would be forced to say that a 1-in-$10^{100}$ chance of infinite utility is negligible. But EV theory says it's not. Rejecting (3) aligns your continuity principle with the actual math of expectation.

  **Does this break the Sure-Thing Principle?**
  Savage's Sure-Thing Principle (P2) is often interpreted as: "If you prefer $A$ to $B$ given $E$, and $A$ to $B$ given $\neg E$, prefer $A$ to $B$."
  Your argument shows that P2 cannot hold unrestrictedly for unbounded utilities if "preference" is determined by EV. If $A$ and $B$ agree on $\neg E$ (where $P(\neg E) \approx 1$), but $A$ has a Pasadena tail on $E$ while $B$ is flat, EV says they are incomparable or vastly different, despite agreeing on the "sure" part.
  To save decision theory, you must restrict the domain of the Sure-Thing Principle to **integrable gambles** (those with absolutely convergent expectations). This is a standard move: axioms of decision theory are typically proven for bounded or integrable acts. Rejecting (3) simply forces you to make that restriction explicit.

  ### 4. Why Keep (1)?
  You identified (1) as your "fixed point": *If EV is undefined, EV theory yields no verdict.*
  This is the strongest link in the chain. The Pasadena game's expectation is conditionally convergent. By the Riemann Rearrangement Theorem, the sum depends on the order of summation. Since states of the world do not come with a canonical ordering (unlike time series), there is no fact of the matter about the sum.
  *   If you reject (1), you must claim there *is* a correct way to order the outcomes to get the EV. (e.g., "order by time"). But this commits you to a specific metaphysics of decision (time-dependence) that standard EV theory rejects.
  *   If you keep (1), you admit that EV theory has a **domain of applicability**. It works for integrable random variables. It breaks for conditionally convergent ones.

  This is not a bug; it is a boundary condition. Just as Newtonian physics yields no verdict on objects moving at light speed, EV theory yields no verdict on Pasadena gambles. The contagion argument (steps 4–5) attempts to show that because the boundary is porous (you can perturb any gamble into the undefined zone), the whole theory is void.
  But rejecting (3) seals the porous boundary. It says: "$G$ is in the domain (integrable). $G^*$ is outside the domain (non-integrable). They are not 'close' in the metric that matters for the theory, even if they are close in probability."

  ### 5. Resolving the "Indistinguishable" Worry
  You wrote: *"I owe a story about why the theory is fine for my coin flip but silent for $G^*$, when from the agent's point of view the two are indistinguishable except in a corner she'll almost certainly never land in."*

  The story is the distinction between **epistemic indistinguishability** and **ontological structure**.
  *   **Epistemically:** The agent cannot distinguish $G$ from $G^*$ in finite time.
  *   **Ontologically:** The acts are structurally distinct. One has a defined mean; the other does not.

  Decision theory is normative regarding the structure of the choice, not just the frequency of experienced outcomes. If you accept a gamble, you accept the *entire* payoff function, not just the high-probability truncation. If the payoff function is mathematically ill-posed (undefined EV), the theory cannot evaluate it, regardless of how likely you are to notice.

  If you find this unsatisfying, the solution is not to keep (3), but to **impose Bounded Utility**. If utility is bounded, $G^*$ cannot be constructed (you cannot scale the payoffs to infinity). In a bounded world, (1) becomes false (Pasadena gets a defined EV via dominated convergence) and (3) becomes true.
  But if you want to keep unbounded utility (which allows for the Pasadena game to exist in the first place), you must pay the price of discontinuity.

  ### Summary Recommendation
  1.  **Reject (3).** It conflates probability convergence with expectation convergence.
  2.  **Keep (1).** Undefined EV means no EV verdict. This preserves mathematical rigor.
  3.  **Restrict the Domain.** Explicitly state that EV theory applies to the set of absolutely convergent gambles. $G$ is in the set; $G^*$ is not. They are not "neighbors" in the relevant topology.
  4.  **Salvage the Intuition.** The intuition that "small probabilities don't matter" is a heuristic for bounded contexts. In unbounded contexts, it is false. Acknowledge this limitation rather than letting it destroy the theory.

  This allows you to tell your reading group: "EV theory is robust for ordinary decisions because ordinary decisions are effectively bounded. It fails for Pasadena-style tails not because the theory is broken, but because those tails violate the integrability conditions required for expectation to function as a guide."
