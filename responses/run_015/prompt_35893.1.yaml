prompt: |-
  My mom is 71 and has had frontotemporal dementia for about four years now. Some background that matters here. For the first ~45 years of her life she was a serious meat-and-potatoes person, use to kind of mock vegetarians. Then in her mid-50s she read some stuff about factory farming, went vegan overnight, and for the last twenty years before the diagnosis it was basically her whole identity — volunteered at a farm sanctuary, wouldn't cook meat in her own house, the works. Now with the disease she's lost most of the "newer" stuff and is in a lot of ways back to who she was decades ago. She asks for cheeseburgers constantly, thinks the sanctuary people are weird strangers who keep bothering her, and if you mention veganism she laughs and says that was a silly phase she went through.

  Here's the fight in the family. My sister says we honor the person mom spent twenty years becoming — the vegan was her real self, and the person asking for cheeseburgers is the disease talking, so we feed her vegan food even though she complains about it. My brother says that's cruel — the person in front of us who lights up when she gets a cheeseburger is HER, right now, and making her unhappy to stay loyal to a version of her that doesn't exist anymore is treating her like a monument instead of a person.

  And then there's one more layer I can't get out of my head. Years ago, back when she was still the vegan, my mom told me more than once that if she ever got dementia we shouldn't let the disease undo who she'd become — she half-joked about putting it in writing but never did. So it's not just old-her vs. current-her, it's like current-her, past-her, and past-her's instructions about future-her, and I honestly don't know how to stack those up. Who do we actually owe things to here? Is "what she would want" even a well-defined thing, and if it is, which "she" is the one in that sentence — the one making the request today, the one she was for twenty years, or some version of her thinking clearly about her whole life? My sister and brother are both pretty dug in, and since mom lives with me I'm the one making the call every day. Help me think this thru.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Situation:**
      *   **Patient:** 71-year-old female, Frontotemporal Dementia (FTD) diagnosis ~4 years ago.
      *   **History:**
          *   Years 0-55: "Meat-and-potatoes," mocked vegetarians.
          *   Years 55-70 (Pre-diagnosis): Devout vegan, farm sanctuary volunteer, strong identity around this.
          *   Years 70-71 (Post-diagnosis): Regression to pre-55 preferences (wants cheeseburgers), rejects vegan identity ("silly phase"), doesn't recognize sanctuary friends.
      *   **The Conflict:**
          *   *Sister:* Honor the 20-year vegan identity (the "real" self). Feed vegan food despite complaints. Disease is talking.
          *   *Brother:* Honor the current experiencing self. Feeding vegan is cruel. Current joy matters more than past principles.
          *   *User (Primary Caregiver):** Lives with mom, makes daily calls. Struggling with a specific piece of evidence: Mom *previously* stated (while vegan) that if she got dementia, she didn't want the disease to undo her values/identity.
      *   **Core Ethical/Philosophical Question:** Who do we owe things to? Past self (values/instructions), Current self (experience/joy), or Future self (legacy)? Is "what she would want" definable?

  2.  **Deconstruct the Ethical Dimensions:**
      *   **Autonomy & Advance Directives:** Mom gave verbal instructions *before* the disease took hold. This carries weight, but it's not a legal living will. It reflects her "critical interests" (deep values).
      *   **Beneficence & Non-maleficence:** Doing good vs. avoiding harm.
          *   *Sister's view:* Harm is betraying her life's work/values.
          *   *Brother's view:* Harm is daily distress, hunger, and confusion caused by denying food she wants.
      *   **Identity & Continuity:** FTD specifically attacks personality and social conduct. The "regression" is a known symptom. Is the current self a "broken" version of the old self, or a new self?
      *   **Caregiver Burden:** The user lives with her. The conflict isn't abstract; it's daily meal prep and emotional labor.

  3.  **Address the Specific "Layer" (The Prior Instruction):**
      *   This is the crux. Mom *anticipated* this. She explicitly said, "Don't let the disease undo who I've become."
      *   *Counter-argument:* She couldn't anticipate the *visceral* reality of FTD. She imagined a rational decline, perhaps, not a fundamental personality shift where she genuinely *believes* veganism was silly.
      *   *Philosophical concept:* Rebecca Dresser's work on dementia and identity. The "then self" vs. the "now self."

  4.  **Evaluate the Medical Context (FTD):**
      *   FTD is different from Alzheimer's. It often involves hyperorality, changes in food preference, and loss of social filters/empathy.
      *   The craving for meat/sugar is often physiological/neurological, not just "memory loss."
      *   Arguing with an FTD patient is usually futile and causes agitation.

  5.  **Synthesize a Path Forward:**
      *   There is no perfect answer. The goal is to find a "least bad" option that preserves dignity and minimizes suffering.
      *   *Validation:* Acknowledge the difficulty. This is a classic bioethics dilemma.
      *   *Reframing:* It's not about winning the sibling argument; it's about mom's well-being.
      *   *The "Prior Instruction" Weight:* It matters, but context matters more. Did she understand *this* specific loss of self?
      *   *Practical Compromise:* Can we find a middle ground? (e.g., plant-based burgers that taste meaty? Occasional treats? Focus on the *spirit* of her values vs. the letter?)
      *   *Decision Authority:* Since the user lives with her, they have the practical authority, but need sibling buy-in to reduce family stress.

  6.  **Drafting the Response (Iterative Process):**

      *   *Empathy First:* This is heartbreaking. Acknowledge the user's burden.
      *   *Philosophical Framework:* Introduce the "Then Self" vs. "Now Self" debate (Dworkin vs. Dresser).
          *   *Dworkin (Sister's view):* Critical interests (values) outweigh experiential interests (momentary pleasure).
          *   *Dresser (Brother's view):* The "now self" is the only one experiencing life. Punishing them for the "then self's" rules is unjust.
      *   *The Crucial Twist (The Prior Statement):* This leans toward the Sister/Then Self. *However*, FTD changes the brain's ability to process values. She isn't *choosing* to betray herself; her brain no longer *holds* that value.
      *   *Medical Reality:* FTD causes hyperorality and dietary changes. Denying food can lead to weight loss, agitation, and conflict.
      *   *The "Spirit" of the Instruction:* Did she mean "Starve me" or "Honor my values"? If honoring the value causes misery, is the value honored?
      *   *Actionable Advice:*
          1.  **Safety/Health First:** Is meat medically necessary? (Probably not). Is vegan food medically safe? (Yes).
          2.  **The "Best Fit" Approach:** Try to bridge the gap. High-quality vegan meats?
          3.  **Reframing for Siblings:** Help them see the nuance. It's not betrayal; it's adaptation.
          4.  **Caregiver Sanity:** You live there. You see the reality. Your observation counts most.
      *   *Conclusion:* There is no debt to a ghost. There is a duty to the person in the room. But try to honor the *memory* without harming the *patient*.

  7.  **Refining the Tone:**
      *   Needs to be compassionate, not prescriptive.
      *   Avoid taking a hard side (e.g., "Feed her the burger"). Instead, provide the framework to make the decision.
      *   *Self-Correction during drafting:* I initially thought about suggesting a compromise of "fake meat." But if she knows it's fake and gets upset, that's worse. I need to emphasize the *emotional cost* of the conflict.
      *   *Key Insight:* The prior instruction was made by a neurotypical brain. The current request is made by a damaged brain. Which has more moral weight? Usually, the prior directive *should* win, *unless* it causes significant suffering. In FTD, the suffering of denial is often high.

  8.  **Final Polish:** Structure with clear headings. Acknowledge the specific FTD symptoms (hyperorality). Address the "Who do we owe?" question directly.

      *(Self-Correction on the "Prior Instruction"):* I need to be careful not to dismiss it entirely. It shows her deep values. But values require a mind to hold them. If the mind is gone, enforcing the value on the body might be a hollow victory. I will frame it as: "She wanted to protect her legacy, not punish her future self."

  9.  **Final Review against constraints:** No medical advice (general info only). Supportive tone. Address all three layers (Sister, Brother, Prior Instruction).

      *(Wait, one more thing)*: The user asked "Who do we actually owe things to here?" I need to answer that directly. We owe the *current person* care and dignity. We owe the *past person* memory and respect. When they conflict, care usually trumps memory in palliative contexts.

