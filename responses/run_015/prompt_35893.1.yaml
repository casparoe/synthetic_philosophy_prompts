answer: |-
  This is one of the profound, heartbreaking ethical dilemmas that dementia care forces upon families. You are standing at the intersection of three different people: the mother you grew up with (Meat-Eater), the mother who raised you in her later years (Vegan Activist), and the mother who exists today (FTD Patient).

  Your sister, your brother, and your mom's past self all have valid claims, but they are claims on different things. To help you make this call—and to help you sleep at night while living with the consequences—it helps to untangle the ethics of "identity" versus "experience."

  Here is a framework to help you think through who you owe what to, and how to navigate the conflict.

  ### 1. The Philosophical Conflict: Critical vs. Experiential Interests
  Bioethicists often divide a person's interests into two categories, and your siblings are each championing one.

  *   **Critical Interests (Your Sister's View):** These are the deep values, beliefs, and life projects that define a person's integrity. Your mom's veganism wasn't just a diet; it was a moral stance. Your sister argues that feeding her meat violates her *critical interests*, effectively erasing the moral person she spent 20 years building. To her, satisfying the hunger is less important than preserving the integrity of the life lived.
  *   **Experiential Interests (Your Brother's View):** These are the moment-to-moment sensations of pleasure, pain, comfort, and joy. Your brother argues that the "Vegan Mom" no longer exists to feel violated. The only person who exists is the one sitting at the table. If she feels joy eating a burger and distress eating vegan food, denying her that joy is inflicting real-time suffering on a vulnerable person.

  **The FTD Factor:** Frontotemporal Dementia is distinct from Alzheimer's. It specifically attacks the frontal lobes, which govern personality, social conduct, and impulse control. The regression to "meat-and-potatoes" isn't just memory loss; it is often a physiological change in taste and impulse (hyperorality). Her brain is literally signaling that she wants meat.

  ### 2. The Weight of the "Prior Instruction"
  This is the layer that keeps you up at night. She explicitly said: *Don't let the disease undo who I've become.*

  This sounds like a clear advance directive, but there is a nuance here. When she made that statement, she was imagining a future self who might be *forgetful*, not a future self who would be *fundamentally altered*.

  *   **The Argument for Honoring It:** She valued her moral consistency above her future comfort. To ignore this is to treat her past agency as irrelevant.
  *   **The Argument for Context:** She could not anticipate the specific reality of FTD. She likely imagined a scenario where she might *ask* for meat out of confusion, not a scenario where she would genuinely *believe* her life's work was "silly." When she made that request, she was speaking for a self that valued moral reasoning. The current self lacks the capacity for that reasoning. Enforcing a rule on someone who no longer has the capacity to understand *why* the rule exists can feel less like "honoring values" and more like "punishing the disabled."

  **A crucial question:** Did she mean "Protect my legacy" or "Protect my body from betraying my values"? If the goal was to prevent animal suffering, feeding her a burger now doesn't actually increase animal suffering in the way her active participation did before. If the goal was to maintain her integrity, integrity requires a coherent self.

  ### 3. Who Do You Owe?
  You asked: *"Who do we actually owe things to here?"*

  **You owe the person in the room care.**
  In palliative and dementia care, the ethical scale usually tips toward the **current experiencing self**. The "Vegan Mom" is a memory. She is not cold, hungry, or confused. The "Current Mom" is all of those things.

  Philosophically, many ethicists argue that when the continuity of self is broken as severely as it is in FTD, the "prior self" loses the right to dictate the comfort of the "current self," especially when the prior self cannot comprehend the cost.

  However, you also owe the **family unit** peace. A constant battle over food creates a toxic environment for everyone, including your mom. She will pick up on the tension, even if she doesn't understand the cause.

  ### 4. A Path Forward: The "Best Fit" Approach
  Since you live with her, you are the one who sees the reality of her distress. Here is a practical way to navigate this that honors all three layers without breaking anyone.

  **A. Prioritize Health and Calm**
  If she is losing weight because she refuses vegan food, or if mealtime has become a daily battle that leaves her agitated for hours, the "Vegan Rule" is causing harm. In dementia care, minimizing agitation is often the highest priority. If a cheeseburger brings a moment of pure peace and connection, that has medicinal value.

  **B. The "Spirit vs. Letter" Compromise**
  Can you honor the *spirit* of her veganism without enforcing the *letter* of it in a way that causes suffering?
  *   **High-Quality Plant Meats:** We are in an era of very convincing plant-based burgers. If she eats it and enjoys it, does it matter if it's technically vegan? (Note: If she tastes it and rejects it, this won't work).
  *   **Reframing:** If you do feed her meat, do not frame it as "Giving in." Frame it as "Nutritional support."
  *   **The "Special Occasion" Middle Ground:** Some families choose a hybrid. Mostly vegan (honoring the sister/past self), but if she is having a terrible day or is fixated, a small concession is made (honoring the brother/current self).

  **C. Addressing the Siblings**
  You need to bring your siblings into the reality of the disease, not just the philosophy.
  *   **To your Sister:** "I know we want to honor her values. But when we enforce them, she becomes agitated and unhappy. Is her moral legacy more important than her daily peace? She doesn't understand the 'why' anymore, so enforcing it feels like punishment to her."
  *   **To your Brother:** "I hear you that she is happy in the moment. But we also have to live with the knowledge of who she was. We need to find a balance where we aren't erasing her life's work entirely, but we also aren't starving her of joy."

  **D. The Decider**
  Ultimately, because she lives with you, **you are the primary decision-maker.** Your siblings have opinions, but they do not have the data. They do not see the 3 PM agitation or the look on her face when she is denied food.
  *   You can say: "I appreciate both your perspectives. But I am the one managing her daily care. I have to make the call that keeps her safest and calmest in this house. I need you to trust my judgment on the ground."

  ### 5. Final Thought on Guilt
  You might feel like you are betraying her. You aren't.
  The woman who told you not to let the disease undo her was a woman with a healthy frontal lobe. She was making a request from a place of strength. The woman asking for a cheeseburger is a woman with a damaged brain making a request from a place of need.

  If you choose to feed her the vegan food, you are honoring a ghost.
  If you choose to feed her the burger, you are caring for a patient.

  In the hierarchy of dementia care, **care usually trumps legacy.** If you choose to give her the cheeseburger, you are not killing the Vegan Mom; that version of her is already gone. You are loving the Mother who is left. That is not a betrayal; it is an adaptation. And given her instruction, if she could see that her "rules" were causing her child stress and her current self misery, the woman who loved you might tell you to let the rules go.

  **Recommendation:** Try to find a nutritional compromise that minimizes conflict. If none exists, prioritize her current emotional well-being and physical health. Document your reasoning (for your own peace of mind), and tell your siblings that while their input is valued, the daily reality requires your discretion. You are doing the hard work of love; don't let the philosophy of it paralyze the practice of it.
