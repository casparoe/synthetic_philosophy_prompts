  Mara: Let's agree on this: The synthetic subject needs treatment.

  Leo: Absolutely. Their arm is dying.

  Mara: Because the signal failed to motivate.

  Leo: Because the pain failed to exist.

  Mara: I'll write the grant proposal. You write the ethics briefing.

  Leo: Only if you admit the subject isn't suffering.

  Mara: I'll admit the subject isn't suffering. I won't admit they aren't in pain.

  Leo: Then we're still stuck.

  Mara: We're still working.

  Leo: Fair enough. Pass the coffee. It's hot.

  Mara: Don't touch it without a sleeve.

  Leo: Why? It won't hurt.

  Mara: It'll damage.

  Leo: See? You know the difference.

  Mara: I know the difference between injury and agony. I'm not sure you do.

  Leo: And I know the difference between a signal and a message. You're reading the signal. I'm reading the message.

  Mara: The signal is the message.

  Leo: Not if nobody's listening.

  Mara: The brain is listening.

  Leo: The part that cares isn't.

  Mara: Then the brain is split.

  Leo: Then the pain is split.

  Mara: Or non-existent.

  Leo: Or non-existent.

  Mara: ...

  Leo: ...

  Mara: One more round?

  Leo: One more round.
