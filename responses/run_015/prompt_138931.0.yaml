answer: |-
  The proverb is not a coherent moral rule but an ambiguous heuristic that collapses when local behavior conflicts with local rules, and your girlfriend's inconsistency demonstrates she treated it as a justification for convenience rather than a principle of conduct.

  ### Menu of Readings

  **1. The Pragmatic Safety Claim**
  *   **Claim:** You should follow local conventions to avoid punishment, confusion, or practical trouble for yourself.
  *   **Verdict:** Defensible.
  *   **Condition:** Holds only when the convention is enforced or when violating it creates tangible friction (e.g., getting arrested, slowing down a line). It fails if the violation is undetectable or harmless.

  **2. The Expressive Respect Claim**
  *   **Claim:** You should follow local conventions to signal respect for the host culture and avoid giving offense.
  *   **Verdict:** Defensible.
  *   **Condition:** Holds only if the locals care about the convention and would perceive your violation as an insult. It fails if the convention is invisible to them or if they explicitly excuse outsiders (the "tourist pass").

  **3. The Fair Coordination Claim**
  *   **Claim:** You should follow local conventions to avoid free-riding on a system of cooperation that others are maintaining (e.g., queueing).
  *   **Verdict:** Strongly Defensible.
  *   **Condition:** Holds when the convention solves a coordination problem where your deviation benefits you at the expense of those complying. It fails if the convention is purely symbolic or personal (e.g., dietary habits).

  **4. The Descriptive Mimicry Claim**
  *   **Claim:** You should do exactly what you see locals doing in the moment, regardless of formal rules.
  *   **Verdict:** False.
  *   **Condition:** Would only hold if local behavior perfectly tracked moral correctness. It fails because locals often violate their own norms (e.g., jaywalking), and mimicking them imports their hypocrisies rather than their values.

  **5. The Normative Submission Claim**
  *   **Claim:** You should obey what locals believe they *ought* to do (the formal rule or ideal), even if they fail to do it themselves.
  *   **Verdict:** Defensible.
  *   **Condition:** Holds when there is a distinction between the "law" and the "practice." It requires epistemic effort to learn the rule rather than just watching the crowd.

  **6. The Boundary Maintenance Claim**
  *   **Claim:** You should follow conventions to avoid marking yourself as an outsider where that distinction matters (e.g., safety, pricing).
  *   **Verdict:** Trivial.
  *   **Condition:** Holds only if the convention functions as a shibboleth to sort insiders from outsiders. It fails if the convention is universal or if being marked as a tourist is inconsequential.

  **7. The Moral Imperialism Claim**
  *   **Claim:** You should only follow local conventions when they align with your home morality; otherwise, bring your own norms.
  *   **Verdict:** False (as a reading of this proverb).
  *   **Condition:** This contradicts the literal meaning of the phrase. It might be a valid *moral* stance, but it is not what "When in Rome" means.

  ### Application to Your Cases

  **The Shape of the Cases**
  Tipping and jaywalking are not the same shape of normative case. Tipping in Tokyo is a **constitutive norm** of the transaction; the price on the menu is the total cost, and offering extra disrupts the social script (implying the staff are beggars or the employer is stingy). Jaywalking is a **regulatory norm**; the light dictates safety and order, but the behavior of the crowd suggests a temporary suspension of that rule (safety in numbers).

  **The Inconsistency**
  Your girlfriend applied the **Normative Submission Claim** to tipping (locals don't tip, so you shouldn't) but switched to the **Descriptive Mimicry Claim** for jaywalking (locals are crossing, so you should). This is philosophically unstable. If "When in Rome" means "follow the local rules," she was wrong to jaywalk. If it means "do what you see," she was right to jaywalk, but then the tipping advice was lucky rather than principled. Most defensible readings of the proverb prioritize the **Normative** (what they think they ought to do) over the **Descriptive** (what they actually do) when the two diverge, because the norm represents the culture's self-conception.

  **Verdict on Your Tipping**
  None of the defensible readings make you wrong for not tipping.
  *   **Pragmatic:** You avoided confusion.
  *   **Respect:** You honored the local script (tipping can be offensive there).
  *   **Coordination:** You didn't disrupt the pricing system.
  *   **Normative:** You followed the rule (no tipping).

  For her to be right that you did something *wrong* by not tipping, she would have to rely on the **Moral Imperialism Claim** (arguing tipping is universally required regardless of location) or a failed **Epistemic Claim** (arguing that locals secretly want tips despite appearances). Neither fits the proverb she invoked. She was right about the action (not tipping), but if she criticized you for it, she contradicted the very principle she cited. If she criticized your *later* judgment of her jaywalking, she is guilty of switching definitions to avoid blame.
