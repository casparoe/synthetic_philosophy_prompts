answer: |-
  ### Exam Question

  **Question 1 (90 Minutes)**

  Graham Priest argues that the Liar Paradox is best resolved by dialetheism: accepting that the Liar sentence is a true contradiction (a "glut"). Critics counter that this solution is vulnerable to "Revenge." 

  Construct a specific Revenge Liar sentence targeting the dialetheist's semantic categories (e.g., targeting the predicate "is a true contradiction" or "is merely false"). Explain Priest's standard strategy for handling this revenge. 

  Critically evaluate whether this strategy genuinely dissolves the paradox or merely relocates it. In your evaluation, you must address the status of the **metatheory**: Can the dialetheist coherently describe their semantics using a classical metalanguage, or must the meta-level also be paraconsistent? Discuss the costs of either choice regarding the expressibility of the dialetheist's position.

  ***

  ### Model Answer

  The standard Liar sentence ($\lambda$) is equivalent to $\neg T\langle\lambda\rangle$. In Classical Logic, this yields contradiction; in Paraconsistent Logic (LP), $\lambda$ is assigned both True and False ($B$). Priest argues we should accept $\lambda$ as a true contradiction. However, this invites Revenge.

  Consider the sentence $\rho$: "This sentence is not a true contradiction." Formally, $\rho \leftrightarrow \neg (T\langle\rho\rangle \land F\langle\rho\rho\rangle)$. If $\rho$ is a true contradiction (glut), then the right-hand side is false, making $\rho$ false. But if it is a glut, it is also true. Thus, if $\rho$ is a glut, it is not a glut. Conversely, if $\rho$ is not a glut (e.g., merely true), then the right-hand side is true, making $\rho$ true. But if it is merely true, it satisfies the condition of "not being a glut," seemingly avoiding contradiction. However, within LP, if $\rho$ is true, it implies the negation of the glut status. Priest's reply is to "glut" the revenge: accept that $\rho$ is *also* a true contradiction. He argues the dialetheist is committed to accepting all such contradictions generated by semantic closure.

  While this preserves consistency within LP (by rejecting explosion), it fails to dissolve the paradox if we examine the metatheory. The Revenge problem is not merely logical but semantic. To assert "$\rho$ is a true contradiction," the dialetheist uses semantic predicates in a metalanguage. If this metalanguage is Classical, it obeys the Law of Non-Contradiction. The meta-theorist cannot consistently assert that an object-language sentence is "both True and False" without violating the meta-logic's exclusivity constraints. The dialetheist claims gluts exist, but if their *description* of that claim relies on a classical metalanguage where $T \cap F = \emptyset$, the claim becomes inexpressible.

  To avoid this, the dialetheist must adopt a paraconsistent metatheory. However, this generates a regress. If the metalanguage allows gluts, we can construct a Meta-Revenge Liar targeting the meta-predicates. To describe the status of the meta-predicates, we need a meta-metalanguage. If every level must be paraconsistent to express the glut at the level below, the dialetheist never achieves a stable vantage point from which to declare their semantics correct.

  Alternatively, if they retain a classical metatheory, they must admit that while the object language contains contradictions, the *fact* that it contains contradictions cannot be truly stated without contradiction. This creates a distinction between paraconsistency (a formal property of the logic) and dialetheism (a metaphysical claim). The Revenge shows that while paraconsistency blocks explosion, dialetheism struggles to assert its own truth conditions without triggering a new contradiction at the level of assertion. Thus, Priest's reply does not disarm the threat; it reveals that the instability is a structural feature of any semantically closed language, regardless of whether gluts are permitted. The cost of the dialetheist's position is the loss of the ability to consistently characterize the boundary between truth and falsity, even at the meta-level.

  ***

  ### Marking Scheme (Out of 20)

  **1. Reconstruction of the Revenge Sentence (5 Marks)**
  *   **5:** Clearly constructs a sentence targeting semantic categories (e.g., "This is not a glut" or "This is only false"). Shows the derivation of the contradiction/glut status formally or rigorously informally.
  *   **3-4:** Constructs a revenge sentence but derivation is slightly vague or relies on standard Liar structure without modifying the predicate.
  *   **0-2:** Fails to construct a specific sentence; merely states "there is another liar."

  **2. Explanation of Priest's Reply (5 Marks)**
  *   **5:** Accurately explains Priest's strategy of accepting the revenge as a further true contradiction (glut) and appealing to semantic closure.
  *   **3-4:** States Priest accepts contradictions but misses the specific commitment to *semantic closure* or the iterative nature of the acceptance.
  *   **0-2:** Claims Priest rejects the revenge sentence or blocks it via explosion (fundamental error).

  **3. Metatheory and Expressibility (A-Grade Discriminator) (5 Marks)**
  *   **5 (A Grade):** Explicitly analyzes the tension between a classical metalanguage and paraconsistent object language. Identifies the "inexpressibility" problem (cannot consistently state gluts exist in classical meta) OR the regress problem (paraconsistent meta invites meta-revenge). Distinguishes logic (inference) from semantics (truth predicates).
  *   **3-4 (B Grade):** Discusses metatheory generally but fails to identify the specific cost (inexpressibility or regress). Treats the meta-level as unproblematic.
  *   **0-2:** No mention of metalanguage/metatheory; treats the logic as self-contained.

  **4. Critical Evaluation & Structure (5 Marks)**
  *   **5:** Clear thesis (e.g., "Revenge reveals structural instability"). Argument flows logically. Conclusion synthesizes the metatheory point with the initial reconstruction.
  *   **3-4:** Good structure but conclusion is weak or does not follow from the metatheory analysis.
  *   **0-2:** Disorganized or merely descriptive without evaluation.

  **Grade Boundaries:**
  *   **A (17-20):** Must score 5 in Section 3. Must reconstruct the revenge specifically (Section 1). Must identify that the problem shifts from *inference* to *semantics/metatheory*.
  *   **B (13-16):** Solid reconstruction and explanation of Priest. Lacks the specific insight into the *cost* of the paraconsistent metatheory or the classical meta-inexpressibility.
  *   **C (9-12):** Understands Dialetheism basics but struggles with the Revenge construction or treats it as identical to the original Liar.
  *   **Fail (0-8):** Fundamental misunderstandings of LP, explosion, or the Liar paradox.

  **Specific Penalties:**
  *   **-5 Marks:** If the answer claims the Revenge is blocked by the Principle of Explosion (Dialetheism rejects explosion).
  *   **-3 Marks:** If the answer fails to distinguish between the object language and the metalanguage.
