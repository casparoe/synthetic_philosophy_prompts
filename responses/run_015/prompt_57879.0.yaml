      *   *Lying:* Asserting $P$ while believing $\neg P$ with the intention that the audience believes $P$. (Standard philosophical definition).
      *   *Misleading:* Asserting $P$ (which is true) but intending the audience to infer $Q$ (which is false), often via Gricean implicature, presupposition, or omission.
      *   *Journalistic Ethics:* Truthfulness isn't just literal accuracy; it's about not deceiving the audience. SPJ Code of Ethics: "Seek Truth and Report It," "Minimize Harm."
