  # Decision Tree: Post-Branching Expectation

  **Start Node:** I accept no-collapse QM, branching, and the Born rule as the right third-personal probability rule.

  **Node 1:** When you ask "What will I experience after the trigger fires?", is there a fact of the matter about the answer that is true before you decide how to act?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2:** If there is no fact, is first-personal probability simply undefined, or is it a matter of rational policy?
  *   **Undefined:** **Leaf: First-Person Probability Undefined.** (Awkward commitment: "Expectation" is a category error in branching scenarios; you can only speak of external measures).
  *   **Policy:** **Leaf: Pragmatic Anticipation.** (Awkward commitment: You know a successor survives in every branch, but you adopt a policy of anticipating death to align with Born-rule betting).
      *   *Note: The "Uniform Counting" policy (betting on the 1% lottery over 99% survival) is logically possible here but unoccupied; see Empty Nodes.*

  **Node 3:** In a standard branching where both outcomes have conscious successors, does the "you" of now become *both* successors?
  *   **No:** Go to Node 4.
  *   **Yes:** Go to Node 5.

  **Node 4:** (Selection/Cessation). In the Graded Gun case (99% death, 1% dense anterograde amnesia), is the amnesiac survivor you?
  *   **No:** **Leaf: Expect Death.** (Awkward commitment: You accept MWI and branching, but agree with Copenhageners that you should expect to die in quantum suicide setups).
  *   **Yes:** **Leaf: Psychological Continuity.** (Awkward commitment: You survive only if psychology holds; this path is logically valid but effectively unoccupied; see Empty Nodes).

  **Node 5:** (Fission). Even though both successors are you, is there a further fact about which one you will *find yourself* to be?
  *   **No:** **Leaf: No-Fact Identity.** (Awkward commitment: You are both futures equally; asking "which one will I be?" is like asking "which twin is the original?").
  *   **Yes:** Go to Node 6.

  **Node 6:** (Trajectory). Does the fact of which future is yours track the squared amplitude of that branch?
  *   **Yes:** **Leaf: Measure-Weighted Realist.** (Awkward commitment: There is a fact you survive in the low-amplitude branch, but a further fact you will not find yourself there).
  *   **No:** Go to Node 7.

  **Node 7:** If you survive a 1-in-a-billion branch, does that give you evidence for Many Worlds that your friend outside the box cannot share?
  *   **Yes:** **Leaf: Strong Quantum Immortality.** (Awkward commitment: You can prove MWI to yourself by attempting to die; survival is guaranteed evidence).
  *   **No:** Go to Node 8.

  **Node 8:** After 1,000 rounds, is the survivor in the branch of measure 2^-1000 still you?
  *   **Yes:** **Leaf: Deflationary Reading.** (Awkward commitment: You survive the experiment, but it is a tautology of identity that proves nothing new about physics).
  *   **No:** **Leaf: Degradation Reading.** (Awkward commitment: Quantum immortality works in idealised boxes, but real death is gradual; you eventually die when branches become too noisy to support you).

  ***

  ### Empty Nodes & Logical Collisions

  **1. Non-Factualist + Uniform Policy (Node 2, Policy path)**
  *   *Position:* Expectation is a policy, but it should count every existing successor equally rather than weighting by amplitude.
  *   *Status:* **Unattractive.** In the "Inverted Case" (99% live, 1% die) vs. "Lottery" (1% win), this view implies you should anticipate the 1% outcome more strongly in the Lottery case. This leads to betting against the Born rule in standard scenarios, which contradicts the Start Node commitment.

  **2. Factualist + Selection + Psychological Continuity (Node 4, Yes path)**
  *   *Position:* Only one branch contains "you," but it is the low-amplitude amnesiac branch, not the high-amplitude death branch.
  *   *Status:* **Unbothered.** This requires a mechanism for reality to "select" the low-measure branch as the true successor specifically because it contains consciousness. No one seems to want the metaphysics of selection without the comfort of high-measure survival.

  **3. Factualist + Fission + No Trajectory + Measure-Weighting (Node 5, No path)**
  *   *Position:* You are both successors (no fact which one), but you should still expect the high-measure one more.
  *   *Status:* **Incoherent.** If there is no fact about which future is yours, "expecting" one over the other implies a hidden variable or a contradiction in the definition of "you." This collapses into the Pragmatic Anticipation leaf (Node 2) upon inspection.

  **4. Factualist + Fission + Trajectory + Non-Amp + No Evidence + 1000th-Round No (Node 7, No / Node 8, No)**
  *   *Position:* You survive QS (non-amplitude trajectory), it proves nothing (no evidence), but you die at the 1,000th round (degradation).
  *   *Status:* **Unoccupied.** This is the "Degradation Reading" without the "Strong QI" evidence claim. It is logically stable but rare; most Degradation proponents (e.g., Tegmark) argue the lack of evidence is *because* real death degrades, making the distinction between Deflationary and Degradation collapse on the evidence question. I have separated them at Node 8 to capture the physical claim about branch support.

  ***

  ### Note on the "Friend Outside" (Node 7)
  I have placed the "Friend Outside" distinction at Node 7 rather than treating it as a separate axis. This is because the evidential status of survival collapses into the identity claim: if survival is a guaranteed tautology of identity (Deflationary), it cannot be evidence. If survival is a contingent fact about *which* trajectory is yours (Strong QI), it functions as evidence. Separating them would create a fake fork; a person who claims "I survive but it's not evidence" is functionally at the Deflationary leaf, regardless of what they call it.
