answer: |-
  This is an exceptionally sharp argument your friend has constructed. It forces a choice between consistency and intuition, which is the hallmark of good philosophy. He has effectively trapped you in a dilemma: either accept open borders (reject exclusion) or accept that long-term residents can be deported (reject your fixed point).

  Here is the diagnosis. To hold onto (1) and (5), you must reject **(3)**.

  However, the cost of that rejection is high, and you need to understand why (2) is also tempting to reject, and why your friend's "Adverse Possession" fallback is actually stronger than he realizes.

  ### The Diagnosis: Why Step (3) is the Weak Link

  Step (3) is the "Anti-Accrual Premise." It claims that because the state decided how long someone stayed, the state cannot use that duration to justify treating them differently. It argues that time is morally neutral because it is state-created.

  **Why it looked fine on the way in:**
  It appeals to a principle of "clean hands." It feels like cheating for the state to say, "You've been here 20 years, so now we owe you," when the state could have deported you in year 1. It suggests the state shouldn't be penalized for its own laziness or delay.

  **Why you should reject it:**
  Step (3) ignores the moral reality of *reliance*. When the state allows a person to remain for 20 years, it isn't just "waiting"; it is allowing that person to build a life. The state collects taxes, enforces laws, and allows the formation of families. These are not passive events; they are active engagements.

  By rejecting (3), you are asserting that **time changes the moral relationship between coercer and coerced.** Even if the state "allowed" the time to pass, the *effect* of that time is to weave the person into the social fabric. The justification for coercion changes because the *cost* of coercion changes. Deporting someone at the border costs them a trip; deporting someone after 20 years costs them their life's context.

  **The Cost of Rejecting (3):**
  If you give up (3), you must accept that **state inaction can create rights against the state.** You are conceding that the state can be "estopped" (prevented) from exercising a power it technically holds because it waited too long to use it. This feels like rewarding rule-breaking (if the person entered illegally). You have to argue that the moral weight of the person's established life outweighs the procedural fact of their initial unauthorized entry.

  ### The Alternative: What if You Reject (2) Instead?

  Step (2) claims that refusing someone at the airport and deporting a 20-year resident are exercises of "one and the same power."

  **Why it looked fine on the way in:**
  Both acts result in the person being outside the territory. Both rely on the state's claim to control its geography.

  **The Cost of Rejecting (2):**
  If you keep (3) (time doesn't matter) but reject (2), you must argue that "preventing entry" and "severing presence" are categorically different powers, not just the same power applied at different times.
  *   **What you gain:** You avoid the "state inaction creates rights" problem. You can say the state never owed the person entry, but once they are *in*, a different set of rules applies.
  *   **What you lose:** You open yourself to the charge of arbitrariness. If time doesn't morally matter (because you kept 3), *when* does the power switch from "exclusion" to "deportation"? Is it day 1? Day 100? If you say "when they have ties," you are secretly relying on time, which brings you back to rejecting (3). If you say "the moment they cross the line," you have to explain why crossing a line changes the moral nature of the state's power if time itself doesn't.

  **Verdict:** Rejecting (3) is the more honest philosophical move. Rejecting (2) is a useful debate shortcut, but it collapses without (3) also being false. Time matters *because* it changes the nature of the act.

  ### The "Adverse Possession" Fallback and the Paperwork Question

  Your friend's fallback is that time spent in coercive jurisdiction converts into a claim, regardless of paperwork. You asked if the state can defeat this by using temporary visas (stopping the clock). He said no, because "what does the work is a person's life and not a stamp."

  **He is right, and here is why:**
  Recall your starting point (1): *A state may do something to a particular person only if it can justify doing it to that person.*

  Justification is owed because of **coercion**, not **permission**.
  *   A visa is *permission* to be present.
  *   Taxation, policing, and conscription are *coercion*.

  If a person is on a temporary visa, but the state taxes their income, arrests them for crimes, and drafts them into the military, the state is treating them as a member. The state is extracting value and demanding obedience. If the state coerces you continuously for 20 years, it owes you a justification for that coercion that is proportional to the depth of that coercion.

  A "temporary" stamp cannot morally negate the reality of 20 years of subjection to the law. To argue otherwise is to say the state can have it both ways: it can treat you as a member when it wants your taxes, and as a guest when it wants to remove you. That violates (1). The clock does not care about the paperwork because the *coercion* does not care about the paperwork.

  ### The "House" Analogy (Step 7)

  Your friend argues that if your logic holds, you can't ask a guest to leave your house. This is the *reductio*. You need to break the analogy.

  **Why the State is Not a House:**
  1.  **Monopoly on Force:** You cannot leave your state as easily as you leave a house. There is no "outside" that is neutral. Being expelled from a state is qualitatively different than being asked to leave a living room.
  2.  **Jurisdiction vs. Property:** A house is private property; exclusion is the default right. A state is a jurisdiction; coercion is the default reality. You enter a house by invitation. You are born into a state's reach.
  3.  **The Stakes:** The harm of being asked to leave a house is inconvenience. The harm of being deported after 20 years is the destruction of a life plan.

  You can reject the analogy without rejecting the argument. The right to exclude exists for private associations (houses, friendships) because the *cost of exclusion* is low and the *right of association* is high. The right to exclude is weaker for states because the *cost of exclusion* is catastrophic and the *coercion* is total.

  ### Standing and Uncertainty

  Here is where my diagnosis might be wrong, and what would change my mind.

  **Where I might be wrong:**
  I am assuming that the *harm* to the individual (uprooting) outweighs the *right* of the community (self-determination). My diagnosis prioritizes the individual's claim against coercion.

  **The consideration that would move me:**
  If you can demonstrate that **democratic self-determination is impossible without a closed border.**
  If it turns out that the welfare state, public trust, or the ability of a people to shape their own culture *requires* the ability to remove people at will—even long-term residents—then (5) might have to go. If the "20-year resident" claim destroys the political community that makes rights possible in the first place, then the community's right to survive might override the individual's right to stay.

  **How to test this on the bus:**
  Ask your friend: *"If the state collects taxes from a person for 20 years, does it owe them the same justification it owes a citizen? If yes, can it deport them? If no, is the state just a protection racket?"*

  If he says the state *doesn't* owe them justification, he violates (1).
  If he says the state *does* owe them justification, he must admit that 20 years of taxation creates a debt that deportation cannot repay.

  **Summary:**
  Keep (1) and (5). Reject (3). Accept that time creates moral claims even if the state "allowed" the time to pass. Accept that paperwork cannot hide the reality of coercion. This preserves the right to control the border (initially) while acknowledging that the right to exclude expires when the cost of exclusion becomes a destruction of life.
