      *   *Limitation:* A game has an end. Deweyan inquiry is continuous. The game implies a "solution" exists. Dewey says the solution is a temporary resting point. I need to admit this.

  8.  **Refining the "Observer Effect" (Requirement 3):**

      *   Let's make it physical. The "Site" is represented by the Whiteboard.
