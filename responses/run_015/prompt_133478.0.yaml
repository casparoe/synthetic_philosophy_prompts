  2.  **Deconstruct the Philosophical Core:**

      *   *Aggregative Democracy:* Preferences are fixed. Task = Count. Solution = Vote.
      *   *Deweyan Democracy:* Preferences are fluid. Task = Define the problem together. Solution = Emerges from interaction.
      *   *The "Observer Effect" in Social Context:* In Dewey's view, the act of inquiring changes the situation. You can't stand outside the situation to judge it. The "public" is created by the consequences of actions.

