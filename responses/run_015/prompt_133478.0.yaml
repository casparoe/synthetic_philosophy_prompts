answer: |-
  # Session Plan: "The Common Ground"

  **Objective:** To experience the friction between aggregating fixed preferences and reconstructing a shared situation through interaction.
  **Time:** 90 minutes (including tea).
  **Participants:** 14 (split into 3 tables of 4–5).
  **Materials:** Whiteboard + markers, 3 sets of "Briefing Envelopes" (see below), 1 "Consequence Deck" (Facilitator only), Timer, Handout (1 per person).

  ---

  ## 1. The Handout (Print single-sided A4)

  **THE COMMON GROUND: BRIEFING NOTE**

  **Your Role:** You are members of a Steering Committee.
  **Your Task:** Produce a single, signed **Statement of Intent** regarding the use of a shared resource (The Site).
  **The Rules:**
  1.  **No Voting:** You may not take a vote to resolve disagreements. You must reach a consensus.
  2.  **Private Data:** Open your Envelope. Do not show your card to others unless you choose to. Your data is incomplete and may conflict with others'.
  3.  **The Whiteboard:** Anything written on the main Whiteboard is "Fixed". It cannot be erased or contradicted, only added to.
  4.  **Queries:** You may ask the Facilitator up to **three** Yes/No questions in total (for the whole room).
      *   *Warning:* Every Question asked triggers a **Consequence** for the whole group.
  5.  **Success:** The session ends when all 14 signatures are on the Statement. If time runs out, the task is incomplete.

  **Note:** You have not been told what the Statement should achieve. You must decide what counts as a successful outcome.

  ---

  ## 2. Timeline & Facilitator Script

  ### 00:00 – 00:10: Setup & Distribution
  *   **Action:** Seat participants at 3 tables. Hand out the Briefing Note. Hand out Envelopes (face down).
  *   **Script:** "Welcome. You have a task. You have rules. You have private information. You have 25 minutes at your tables to draft a Statement. Then we have tea. Then we reconvene to merge your drafts into one Group Statement. I will not answer questions about the *goal*, only the *rules*. Open your envelopes when I say."
  *   **Crucial:** Do not define "Success". Do not say "Discuss the problem". Say "Draft a Statement".

  ### 00:10 – 00:35: Table Work (The Indeterminate Situation)
  *   **Action:** Participants open envelopes.
      *   *Envelope Contents (Mix these randomly within tables):*
          *   Card A: "Site has high flood risk. Construction costs +50%." (Implies: Don't build/Drain)
          *   Card B: "Local housing waiting list is critical." (Implies: Build Flats)
          *   Card C: "Site is a known wildlife corridor." (Implies: Preserve/Green)
          *   Card D: "Budget surplus available, must be spent this year." (Implies: Spend/Build)
          *   Card E: "Community survey shows high demand for recreation." (Implies: Park)
      *   *Conflict:* Individually, each card suggests a different "obvious" goal. Together, they create a mess that requires redefining the goal (e.g., "Flood-resistant Community Green Space with Shelter").
  *   **Facilitator Role:** Circulate. If asked "What are we trying to do?", reply: "That is for the Committee to determine."
  *   **The Observer Effect (Query Rule):** If a table tries to ask you a question (e.g., "Can we build flats?"), count it against the room's **3 Query Tokens**.
      *   *If they spend a token:* You must draw a card from the **Consequence Deck** and read it aloud to the *whole room*.
      *   *Consequence Examples:* "Planning Permission Delayed (Time reduced)", "New Stakeholder Group Objects (Consensus harder)", "Material Costs Rise (Budget constrained)".
      *   *Why:* Seeking certainty (measurement) disturbs the system (adds constraints).

  ### 00:35 – 00:50: TEA BREAK
  *   **Action:** Collect Table Drafts. Leave the Whiteboard as is (with whatever "Fixed" statements they wrote).
  *   **Note:** This allows the "Fixed" nature of their early thoughts to sit visibly while they cool off.

  ### 00:50 – 01:20: Plenary (The Public)
  *   **Action:** Bring everyone together. The goal is now one Statement for 14 people.
  *   **Dynamic:** This is where the "Voting" impulse will peak. 14 people is too many for pure consensus without a mechanism.
  *   **Facilitator Role:** Enforce the "No Voting" rule. If they call for a show of hands, intervene: "The rules require a signed Statement. A vote does not produce signatures."
  *   **The Trap:** They will try to aggregate wants ("5 want flats, 9 want park, so we do park"). Watch for the dissenters who refuse to sign because their "Private Data" (Flood Risk) wasn't addressed.
  *   **Success Condition:** They only succeed if they reframe the problem so the dissenters' data is *included* in the solution, not outvoted. (e.g., "We build a raised park that manages flood water").

  ### 01:20 – 01:30: The Debrief (Naming the Philosophy)
  *   **Action:** Stop the game. Whether they finished or not, stop.
  *   **Script:** (See Debrief Guide below).

  ---

  ## 3. Debrief Guide: Mapping Experience to Dewey

  **Phase 1: The "What are we doing?" Confusion (0–10 mins of game)**
  *   **Experience:** Frustration that there was no objective (Maximise Profit? Happiness?).
  *   **Deweyan Concept:** *The Indeterminate Situation.* We often think problems come with labels. Dewey says the first job of inquiry is to *find* the problem, not solve a given one.
  *   **Resistance Point:** Participants who demanded a goal immediately.
  *   **Cost:** They tried to solve the wrong problem (e.g., "Build Flats") only to find later it violated someone else's private data (Flood Risk).

  **Phase 2: The Private Cards (Table Work)**
  *   **Experience:** "My card says build, yours says don't."
  *   **Deweyan Concept:** *Democracy as Aggregation vs. Reconstruction.* Aggregation counts the cards (Vote). Reconstruction pools the cards to make a new picture (Inquiry).
  *   **Resistance Point:** The person who said "Let's just vote on it."
  *   **Cost:** Voting leaves the minority (the Flood Risk person) alienated. They won't sign. The "Public" isn't formed until the consequences are shared.

  **Phase 3: The Query Tokens (Observer Effect)**
  *   **Experience:** Asking for clarity made things harder (Consequence Cards).
  *   **Deweyan Concept:** *The Observer Effect in Social Inquiry.* You cannot stand outside the situation to measure it. Acting to learn changes the situation.
  *   **Biologist Analogy:** "It's like trying to measure the flow of a stream by sticking a meter in it; you change the flow. In social life, asking 'Can we do X?' makes X a political target."

  **Phase 4: The Whiteboard (Fixed Statements)**
  *   **Experience:** Regretting writing something down early.
  *   **Deweyan Concept:** *Habits and Reconstruction.* Our early habits (statements) constrain later inquiry. We must reconstruct our habits to fit the new situation.

  **Phase 5: The Signature (Consensus)**
  *   **Experience:** The difficulty of getting 14 signatures vs. a show of hands.
  *   **Deweyan Concept:** *The Public.* The Public is not everyone in the room; it is everyone affected by the consequences. If they don't sign, they aren't part of the Public, they are subjects.

  ---

  ## 4. Honest Assessment: What Will Go Wrong

  **1. The "Vote" within 4 Minutes**
  *   **Prediction:** Someone sensible will say, "Look, we haven't got all day. Show of hands, Flats or Park?"
  *   **Intervention:** Do not ban it angrily. Say: "You can vote, but the Rules require 14 signatures on the final Statement. A vote does not guarantee signatures. Do you want to risk the dissenters refusing to sign?"
  *   **Philosophical Point:** This highlights the difference between *authority* (vote) and *consent* (signature/inquiry).

  **2. The "Manipulated" Participant**
  *   **Prediction:** Someone will realise the Query Tokens are a trap and get cross. "You're punishing us for asking questions!"
  *   **Intervention:** Acknowledge it. "Yes. In real life, demanding certainty often creates new complications. That feeling of frustration is the data point we need."
  *   **Risk:** They may disengage. Keep an eye on them during tea.

  **3. The Dominator**
  *   **Prediction:** One retired professional (maybe like you) will take charge and try to "solve" the puzzle logically.
  *   **Intervention:** Remind them of the Private Data. "You have Card A. Sarah has Card B. You cannot solve it with logic alone; you need her information."
  *   **Philosophical Point:** Expertise is necessary but insufficient without communication.

  **4. The Limitation of the Game (What Dewey says that the Game Can't)**
  *   **Truth:** The game has an end (90 mins). Deweyan inquiry is *continuous*.
  *   **What to say:** "In this game, we stopped at a Signature. In reality, the Signature is just the start of the next problem. Dewey doesn't promise a final solution, only a reconstructed situation that allows us to move forward. We gamified the end, but democracy has no finish line."
  *   **Truth:** The game implies a "Right Answer" (the combination of cards).
  *   **What to say:** "In the game, the cards *could* fit together perfectly if you talked enough. In reality, sometimes values are truly incompatible. Dewey is optimistic; he thinks inquiry can usually find a path. Be wary of that optimism."

  ---

  ## 5. Facilitator Cheat-Sheet (Forbidden Words)

  **DO NOT USE UNTIL DEBRIEF:**
  *   ~~Inquiry~~ (Say: "The Work" or "The Task")
  *   ~~Experimentalism~~ (Say: "Trying things out")
  *   ~~The Public~~ (Say: "The Group" or "The Committee")
  *   ~~Aggregation~~ (Say: "Counting" or "Voting")
  *   ~~Reconstruction~~ (Say: "Changing the plan" or "Reframing")

  **ALLOWED:**
  *   Problem, Situation, Consequences, Shared, Fixed, Consensus, Signature.

  ---

  ## 6. Preparation Checklist

  1.  **Envelopes:** Prepare 14 envelopes.
      *   4 x Card A (Flood)
      *   4 x Card B (Housing)
      *   3 x Card C (Wildlife)
      *   3 x Card D (Budget)
      *   Ensure each table gets a mix. Do not give one table all the same cards.
  2.  **Consequence Deck:** 5 index cards with "Complications" written on them (e.g., "Budget Cut 10%", "Media Scrutiny Increased").
  3.  **Whiteboard:** Draw a box labelled "FIXED STATEMENTS".
  4.  **Handouts:** Print 14 copies.

  *Good luck. It will be messy. That's the point.*
