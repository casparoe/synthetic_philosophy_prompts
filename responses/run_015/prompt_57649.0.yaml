      *   Belief 5 is also dangerous.
      *   *Decision:* I should advise modifying Belief 4 (the hope) and Belief 5 (the pragmatism), while keeping Belief 3 (the skepticism). The contradiction is between hoping process supervision works *because* of the steps, while admitting the steps might be lies.
      *   *Wait, is there a synthesis?* Yes. Process supervision works *if* we enforce faithfulness. So Belief 4 is contingent on solving Belief 3.
