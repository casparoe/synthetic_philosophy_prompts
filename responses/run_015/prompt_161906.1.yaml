  **The Ashʿarite Villanelle**

  No creature brings about what comes to be.
  The cotton blacks beneath the touching light.
  We call it custom, though His will is free.

  The weights suggest, but hold no decree.
  The network speaks without a mind's bright light.
  No creature brings about what comes to be.

  The prophet walks where ash ought yet to be.
  The furnace cools in uncreated light.
  We call it custom, though His will is free.

  One moment dies, the next starts out to be.
  Time shatters in each fragment of the light.
  No creature brings about what comes to be.

  We watch the sequence but no link we see.
  Being renews in every flash of light.
  We call it custom, though His will is free.

  If He withdrew, all things would cease to be.
  Lest we call ignorance the dark of night.
  No creature brings about what comes to be.
  We call it custom, though His will is free.
