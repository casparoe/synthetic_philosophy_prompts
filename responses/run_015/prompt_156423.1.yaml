prompt: |-
  hey — im helping a tiny grantmaker (three staff, maybe $400k a year to move) redo their cause-scoring sheet. Right now it's plain ITN: importance × tractability × neglectedness, each 1–5, multiplied. Someone on the board wants to bolt on five extra "correction terms," and I cant tell which of them are real signal and which are just a way to smuggle in someone's favorite cause:

  1. crowding-out — how much of our marginal dollar just displaces another funder's dollar instead of paying for new work
  2. feedback speed — how many years pass before you find out whether you were wrong
  3. talent-vs-capital bottleneck — whether the field is short of good people or short of money (the pitch being that neglectedness should only count if its money thats missing)
  4. reversibility — how much of the damage you could undo if you backed the wrong horse
  5. legibility discount — how much of the apparent importance is really just an artifact of the problem being easy to measure

  Rate each 0–10 on how much it should actually move a naive ITN score, rank them, and give one line per term saying why it lands where it does. One more thing: we're also deciding whether next year's money should go to one extra staff hire instead of grants — does the sheet need a different score depending on whether the thing being allocated is dollars or a person's year of attention, and if so which of the five terms changes most or flips direction?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Helping a tiny grantmaker (3 staff, ~$400k/year).
      *   **Task:** Redoing a cause-scoring sheet based on ITN (Importance, Tractability, Neglectedness).
      *   **Problem:** A board member wants to add 5 "correction terms." The user suspects some might be bias/smuggling in pet causes.
      *   **Request:**
          1.  Rate each term 0–10 on how much it should move a naive ITN score.
          2.  Rank them.
          3.  Give one line per term explaining the rating.
          4.  Answer a specific question about allocating dollars vs. hiring staff (does the score need to change? which term flips?).

  2.  **Evaluate the 5 Correction Terms:**

      *   **1. Crowding-out:**
          *   *Concept:* Does my money just replace someone else's?
          *   *Relevance to Tiny Grantmaker:* High. With only $400k, they aren't moving markets, but they could be funding things that Google or OpenPhil would fund anyway. However, "crowding out" is often hard to measure and sometimes conflated with Neglectedness (if it's crowded, it's less neglected).
          *   *Signal vs. Noise:* Real signal, but often double-counts Neglectedness.
          *   *Rating:* 6/10. It matters, but ITN's "N" already captures some of this.

      *   **2. Feedback Speed:**
          *   *Concept:* How long until we know if it worked?
          *   *Relevance to Tiny Grantmaker:* Critical. Small teams need to learn fast to pivot. Long feedback loops (e.g., policy change, existential risk reduction) make it hard to justify small grants because you can't iterate.
          *   *Signal vs. Noise:* Strong signal for organizational learning and accountability.
          *   *Rating:* 8/10. Essential for small, agile teams.

      *   **3. Talent-vs-Capital Bottleneck:**
          *   *Concept:* Is the constraint people or money?
          *   *Relevance to Tiny Grantmaker:* Very High. If a field is money-constrained, grants help. If it's talent-constrained, grants might just inflate salaries or sit idle. This refines "Tractability."
          *   *Signal vs. Noise:* Strong signal. Prevents throwing money at a wall that needs engineers, not cash.
          *   *Rating:* 9/10. Directly impacts marginal utility of dollars.

      *   **4. Reversibility:**
          *   *Concept:* Can we undo damage if we're wrong?
          *   *Relevance to Tiny Grantmaker:* Moderate. Most grants are small enough that "damage" is limited to wasted money. Unless they are funding risky tech (bio/AI), reversibility is less critical than for a massive foundation.
          *   *Signal vs. Noise:* Good heuristic, but often low variance for small grants.
          *   *Rating:* 4/10. Important for existential risks, less for general small grants.

      *   **5. Legibility Discount:**
          *   *Concept:* Is importance real or just easy to measure?
          *   *Relevance to Tiny Grantmaker:* High risk of bias. "Legible" causes often get overfunded. Discounting them helps find hidden gems. However, it's highly subjective and easy to game ("my cause is illegible therefore undervalued").
          *   *Signal vs. Noise:* Real phenomenon (Goodhart's Law), but high risk of smuggling bias.
          *   *Rating:* 7/10. Necessary correction, but dangerous to quantify.

  3.  **Rank and Rate (Drafting the response):**

      *   *Ranking:* Talent/Capital > Feedback Speed > Legibility > Crowding-out > Reversibility.
      *   *Ratings:* 9, 8, 7, 6, 4.

  4.  **Addressing the "Dollars vs. Person" Question:**
      *   *Context:* Hiring a staff member vs. giving grants.
      *   *Analysis:*
          *   Grants (Dollars): Need capital-constrained fields.
          *   Hire (Person): Needs talent-constrained fields. A person can solve problems money can't (coordination, research, management).
          *   *Which term flips?* **Talent-vs-Capital Bottleneck.**
          *   *Why:* If you are granting money, you want capital bottlenecks (score high). If you are hiring a person, you *want* talent bottlenecks (score high). The preference inverts.
          *   *Secondary:* Feedback speed matters more for hires (you need to manage performance), but the *direction* doesn't flip, just the weight. Crowding out matters less for a hire (you aren't displacing funding).
          *   *Decision:* The sheet *does* need to change. The Talent-vs-Capital term is the critical flip.

  5.  **Refining the Output:**
      *   *Tone:* Professional, direct, EA-adjacent (since they use ITN), pragmatic.
      *   *Constraints:* One line per term explanation. 0-10 rating. Rank them. Answer the staff/dollar question.
      *   *Self-Correction on "Crowding-out":* Actually, for a $400k funder, crowding out is less about "displacing OpenPhil" and more about "is this grant actually additive?" It's a subset of Tractability. I'll keep the rating moderate.
      *   *Self-Correction on "Legibility":* This is the most dangerous one for bias. I need to emphasize that in the one-liner.
      *   *Self-Correction on the Hire Question:* If they hire, they are adding *capacity*, not just capital. The bottleneck term is definitely the one that flips. If a field needs money, give money. If it needs hands/brains, hire.

  6.  **Final Polish:** Check against constraints.
      *   Rate 0-10? Yes.
      *   Rank them? Yes.
      *   One line per term? Yes.
      *   Address the hire vs. grant question? Yes.
      *   Identify which term flips? Yes.

      *(Self-Correction during drafting)*: Make sure the ranking is clear. I will present the rating and rank together.

      *Re-evaluating "Crowding-out":* For a tiny funder, crowding out is actually quite low signal unless they are co-funding. If they write a $50k check to a $10M org, they aren't crowding out. If they write a $50k check to a $60k project, they might be. But "Neglectedness" usually covers "are there other funders?" I'll stick with a 5 or 6. Let's go with 5 because it overlaps heavily with N.

      *Re-evaluating "Legibility":* This is high risk for bias. But it is a real signal (Goodhart's Law). I'll rate it 7 but warn about subjectivity.

      *Re-evaluating "Talent vs Capital":* This is the strongest modifier for ITN. ITN assumes money is the lever. If money isn't the lever, ITN breaks. So 9 or 10. Let's say 9.

      *Re-evaluating "Feedback Speed":* For a 3-person team, learning is survival. 8.

      *Re-evaluating "Reversibility":* Mostly relevant for x-risk. For general cause scoring, 4.

      *Final Order:* Talent/Capital (9), Feedback (8), Legibility (7), Crowding (5), Reversibility (4).

      *Hire Question:* Yes, the sheet needs to change. Talent-vs-Capital flips. (Money wants capital constraints, People want talent constraints).

  7.  **Final Review of the "One Line" Constraint:** Ensure strict adherence. No rambling.

      *   *Talent-vs-Capital:* "ITN assumes money is the lever; if the constraint is skilled labor, cash grants have near-zero marginal utility."
      *   *Feedback Speed:* "Small teams survive by iterating; long feedback loops prevent learning and trap you in bad strategies."
      *   *Legibility Discount:* "Protects against Goodhart's Law, but is highly subjective and the easiest vector for smuggling bias."
      *   *Crowding-out:* "Mostly double-counts Neglectedness, though relevant if you're funding marginal line-items in already-solved budgets."
      *   *Reversibility:* "Critical for existential risk, but for small grants the downside is usually just wasted cash, not catastrophe."

      *Hire/Grant:* Yes, use different sheets. Talent-vs-Capital flips direction (you want capital bottlenecks for grants, talent bottlenecks for hires).

      *Wait, one nuance:* If I hire a person, do I want a talent bottleneck? Yes, because my person *is* talent. If I give money, do I want a capital bottleneck? Yes. So the *preference* flips based on the asset class.
      *Actually:*
      *   Grant (Money): Score high if Capital Bottleneck exists.
