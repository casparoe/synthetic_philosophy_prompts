answer: |-
  **Ratings & Ranking (0 = Ignore, 10 = Overhaul ITN)**

  1.  **Talent-vs-Capital Bottleneck: 9/10**
      ITN assumes money is the lever; if the constraint is skilled labor, cash grants have near-zero marginal utility.
  2.  **Feedback Speed: 8/10**
      Small teams survive by iterating; long feedback loops prevent learning and trap you in bad strategies.
  3.  **Legibility Discount: 7/10**
      Protects against Goodhart's Law, but is highly subjective and the easiest vector for smuggling bias.
  4.  **Crowding-out: 5/10**
      Mostly double-counts Neglectedness, though relevant if you're funding marginal line-items in already-solved budgets.
  5.  **Reversibility: 3/10**
      Critical for existential risk, but for small grants the downside is usually just wasted cash, not catastrophe.

  **Dollars vs. Person-Year**

  Yes, you need different scorecards. The **Talent-vs-Capital Bottleneck** term flips direction: for grants you want capital-constrained fields, but for a hire you want talent-constrained fields where extra hands actually unlock progress.
