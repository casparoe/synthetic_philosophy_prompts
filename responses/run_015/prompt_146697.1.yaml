  | Requirement | Motivating Case | Status (Non-negotiable / Camp Preference) | What it Rules Out | Conflicts with Requirement # |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Decisional Completeness** | The Board must act; "incomparable" or "indeterminate" is not a valid output for resource allocation. | **Non-negotiable** (Board Constraint) | Incomparability views, Parfit's Vagueness, Radical Uncertainty views. | Conflicts with **Imprecision Robustness** if blur is too wide to resolve. |
  | **2. Identity Independence** | The Board chooses *how many* and *how well*, not *who*. Future people are not identifiable ex ante. | **Non-negotiable** (Board Constraint) | Narrow Person-Affecting Views (PAV), Asymmetry views relying on specific harm. | None (compatible with most impersonal views). |
  | **3. Imprecision Robustness** | Welfare arrives as intervals (e.g., [0.8, 1.2]), not cardinals. Theory must rank options given overlapping ranges without arbitrary point-estimates. | **Non-negotiable** (Board Constraint) | **Precise Lexical Thresholds**, Standard Total Utilitarianism (without interval modification), any theory requiring exact utility sums. | Conflicts with **Continuity** (if robustness requires zones) & **Precise Lexicality**. |
  | **4. Non-Repugnance** | A world of flourishing lives is intuitively better than a world of trillions of lives barely worth living, even if total sum is higher in the latter. | **Camp Preference** (Anti-Totalist) | Classical Total Utilitarianism, Simple Average Utilitarianism (in some formulations). | Conflicts with **Continuity** + **Dominance** (Arrhenius Impossibility). |
  | **5. Non-Sadism** | It is worse to add lives with negative welfare than to add lives with positive welfare (all else equal). | **Strong Desideratum** (Near Universal) | Negative Utilitarianism, Some Critical-Level views (if CL set too high). | Conflicts with **Non-Repugnance** + **Continuity** (Arrhenius Impossibility). |
  | **6. Continuity** | Small changes in welfare or population size should not cause discontinuous jumps in value (no "lexical cliffs"). | **Camp Preference** (Totalist/Continuist) | **Lexical Views**, Discontinuous Threshold Views. | Conflicts with **Non-Repugnance** (if avoiding RC requires a lexical break). |

  ### Analysis of Your "Lexical Threshold" Move

  You asked whether **Imprecision Robustness (#3)** kills the lexical move. **Yes, it does.**

  Here is the professional verdict: A lexical threshold relies on a discontinuity at a specific point $t$. If welfare is precise, you can say $w > t \implies$ Lexical Superiority. But under **Imprecision Robustness**, welfare is an interval $[w_{min}, w_{max}]$. If your threshold $t$ falls inside that interval, the theory cannot determine if the life is lexically superior or inferior.

  To fix this, you would need to make the threshold itself a "lexical zone" (e.g., anything above 1.0 is lexical, anything below 0.9 is not, and the middle is indeterminate). But if the middle is indeterminate, you violate **Decisional Completeness (#1)** (the Board can't act). If you force a decision in the middle, you are effectively treating the zone as continuous trade-offs, which abandons the lexical claim. **Imprecision Robustness forces continuity upon you**, or else it forces paralysis.

  ### Desiderata vs. Prejudice & Impossibility

  *   **Camp Prejudice:** **Non-Repugnance (#4)** and **Continuity (#6)** are the main battlegrounds. Totalists treat Additivity as non-negotiable; Anti-Totalists treat Non-Repugnance as non-negotiable. Both are begging the question against the other.
  *   **Genuine Desiderata:** **Non-Sadism (#5)** is the closest thing to a universal constraint; very few theorists willingly admit their view implies it is better to create miserable people than happy ones. **Identity Independence (#2)** is a structural constraint of your scenario, not ethics per se.
  *   **Impossibility:** The Arrhenius Impossibility Theorem proves you cannot jointly satisfy: *Dominance, Non-Elitism, Non-Sadism, Non-Repugnance, and Avoid Very Repugnant Conclusion.*
  *   **Effect of Blur:** **Imprecision Robustness** actually *dissolves* the strict logical force of the Arrhenius paradox (because you can't construct the precise spectrum required for the proof), but it replaces it with an **Implementation Crisis**. You avoid the contradiction by admitting you can't measure the steps, but then you can't calculate the sum either. It lets Totalism off the hook slightly (you can't prove the Repugnant Conclusion follows if you can't count the Z-lives precisely), but it kills Lexical views harder.

  ### The Most Exclusive Requirement

  **Imprecision Robustness (#3)** excludes the most candidates *in this specific context*. While **Non-Repugnance** excludes Totalism (the dominant view), **Imprecision Robustness** excludes almost *all* standard formalizations, which assume cardinal utility. It forces a rewrite of the mathematical machinery for nearly every theory on the table.

  ```json
  {
    "jointly_unsatisfiable_sets": [
      "Non-Repugnance + Continuity + Dominance + Non-Sadism (Arrhenius Impossibility)",
      "Decisional Completeness + Imprecision Robustness + Precise Lexicality"
    ],
    "most_exclusive_requirement": "Imprecision Robustness",
    "weakest_link_in_my_own_list": "Decisional Completeness",
    "best_available_option_for_the_board": "Imprecise Critical-Level Utilitarianism"
  }
  ```

  ### Notes on the JSON Fields
  *   **Weakest Link:** **Decisional Completeness** is the most vulnerable. If the blur is too wide, forcing a ranking is epistemically arrogant. You may need to advise the Board that "No Decision" is the only rational output in some edge cases.
  *   **Best Option:** **Imprecise Critical-Level Utilitarianism (ICLU)**. It sets a critical level (avoiding the Repugnant Conclusion if set high enough), handles intervals naturally (summing ranges), satisfies Non-Sadism (if CL > 0), and can be made complete by using interval dominance rules (e.g., if Range A is strictly higher than Range B, choose A). It is the most robust engineering solution for the Archive Board.
