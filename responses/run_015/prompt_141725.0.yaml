      *   *Undersold:* Testing consistency (WARP) to detect UI friction or confusion, not just maximizing.
      *   *Logs Don't Give You:* Counterfactuals, constraint awareness, mental state, external consequences.

  5.  **Refining the "Proponent Says" (Careful Defender):**
      *   Need to sound like an economist who knows RPT, not a pop-sci writer.
      *   Focus on the distinction between *positive* theory (predicting choice) and *normative* theory (welfare).
      *   Focus on the requirement of stable constraints and full information.

  6.  **Refining the "Memo Survives" Section:**
      *   Explicitly state it fails.
      *   Extra assumptions needed: Rationality (no biases), Full Information, No Externalities, Stable Preferences over time.

  7.  **Refining the "Undersold" Section:**
      *   What does RPT actually buy? It buys the ability to test for consistency. If users violate WARP, the model breaks. This is useful for detecting confusing UIs or context effects (like the decoy mentioned). It predicts how demand changes when prices/constraints change.

  8.  **Refining "Logs Don't Give You":**
      *   Counterfactual choices (what they didn't see).
      *   Knowledge of constraints (did they know option Y existed?).
      *   Post-choice satisfaction (regret).
      *   External costs (time spent vs. value gained).

  9.  **Formatting Constraints:**
