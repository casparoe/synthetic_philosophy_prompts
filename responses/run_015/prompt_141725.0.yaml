      *   *Claim 6:* This utility is the same quantity welfare economics cares about.
      *   *Claim 7:* A change that raises measured engagement makes users better off by their own lights.

  3.  **Evaluate Claims against Serious Revealed Preference Theory (RPT):**
      *   *Claim 1 (Preferences = Behavior):* This is the core behavioral definition (Samuelson). *Status:* Roughly right but misleading (philosophically distinct from psychological preference).
      *   *Claim 2 (No surveys needed):* True for *revealed* preference, but assumes stable context. *Status:* Fine (within scope).
