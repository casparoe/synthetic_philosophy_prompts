answer: |-
  This is a fantastic line of inquiry. You are absolutely not making it up; in fact, you've put your finger on the exact nerve where Hobbes's metaphysics, his mathematics, and his politics bleed into one another. Most people treat the Hobbes-Wallis feud as a funny footnote where a great philosopher got humbled by a real mathematician. But if you read it through Hobbes's own epistemology, it becomes a crisis of authority.

  You asked to map this out carefully, focusing on epistemic authority, the "Sovereign as Geometer" analogy, and where Hobbes's theory goes silent. Let's break this down into the framework of the dispute, the players, the payoffs, and the theoretical gaps.

  ### 1. The Epistemic Framework: What Counts as "Science"?

  To understand the feud, we have to start with Hobbes's definition of knowledge in *De Corpore* and *Leviathan*.

  *   **Science as Construction:** For Hobbes, "Science" (scientia) is not observing the world. It is knowledge of consequences from definitions. It is conditional: *If* you define a circle this way, *then* these properties follow.
  *   **The Privilege of Geometry:** Physics is inferior because it relies on external causes (which we can't fully know). Geometry is the only perfect science because **we create the objects**. We define the line, the circle, the angle. Therefore, the cause of the truth is internal to the mind.
  *   **Assent is Compulsory:** In Hobbes's view, a geometric demonstration isn't an argument to be weighed; it is a machine that forces the mind to agree. If you see the steps, you *cannot* disagree unless you are irrational or malicious. There is no room for "interpretation."

  **The Hidden Assumption:** You noted that Hobbes seems to want politics to work like private study. You are right. Hobbes assumes that **Truth is singular and coercive.** Just as a geometric proof forces the mind, the Sovereign's law should force the will. Disagreement is not a difference of opinion; it is an error in reckoning or a sin against peace.

  ### 2. The Players and Their Authority

  Here is where the feud stops being about math and starts being about *who gets to define reality*.

  | Player | **Thomas Hobbes** | **John Wallis** |
  | :--- | :--- | :--- |
  | **Role** | The Individual Reasoner | The Institutional Expert |
  | **Source of Authority** | **Internal Demonstration.** Truth is accessible to any rational person who follows the steps. It is universal and private. | **Consensus & Institution.** Truth is validated by the community of peers, the University (Oxford), and symbolic algebra. |
  | **View of Disagreement** | Disagreement is impossible if the proof is clear. If Wallis disagrees, Wallis is either stupid or trying to start a war. | Disagreement is part of the process of peer review. Error is corrected by collective scrutiny, not individual fiat. |
  | **Political Alignment** | Royalist/Absolutist. Order requires a single definer of terms. | Presbyterian/Parliamentarian. Order emerges from negotiated consensus (in church and math). |

  **The Clash of Standing:**
  Hobbes is operating on **Epistemic Individualism**. He believes his mind, following the rules of reason, is the final court of appeal.
  Wallis is operating on **Epistemic Socialism** (for lack of a better term). He believes authority resides in the *practice* of the mathematical community.

  When Wallis attacks Hobbes, he isn't just saying "your math is wrong." He is saying, "You do not have the standing to declare truth without the consent of the guild." For Hobbes, this is an affront to reason itself. For Wallis, Hobbes is a dilettante threatening the standards of the profession.

  ### 3. The "Squaring the Circle" Stalemate

  You asked: *Is that a failure of Hobbes's method, or does it show that his method was never meant to handle public disagreement?*

  It is the latter. Here is the payoff matrix for the "Squaring the Circle" dispute:

  *   **Hobbes's Payoff:** If he admits Wallis is right, he admits that **Reason is fallible.** If his geometric method (the gold standard of his philosophy) can produce error that he cannot see, then his political method (defining Justice/Right) might also produce error he cannot see. The whole system collapses. He *must* insist he is right to save the system.
  *   **Wallis's Payoff:** If he defeats Hobbes, he defends the authority of the University and the new algebraic methods against Hobbes's old-school Euclidean verbal geometry. He also discredits Hobbes's political philosophy by association (bad math = bad politics).

  **Why neither budged:**
  For Hobbes, a geometric proof is like a punch. If I punch you and you say "I wasn't punched," I don't debate you; I conclude you are lying or senseless. Hobbes viewed Wallis's refusal to accept the squaring of the circle not as a mathematical counter-argument, but as a **refusal to see the light.**

  This reveals a massive blind spot in Hobbes's theory: **He has no mechanism for persistent, good-faith disagreement among rational equals.** His system only works if the "Geometer" (or Sovereign) is infallible, or if everyone else is immediately compelled by the clarity of the demonstration. Wallis proved that clarity is subjective.

  ### 4. The Sovereign as Geometer: The Political Implication

  You asked: *Does this mean Hobbes's model for politics... secretly depends on there being no Wallis-type opponents?*

  **Yes. Absolutely.** This is the critical insight.

  In *Leviathan*, the Sovereign defines "Justice," "Property," and "Good" just as the Geometer defines "Circle" and "Line."
  *   **In Geometry:** The definition creates the object.
  *   **In Politics:** The Command creates the Law.

  Hobbes wants subjects to accept the Sovereign's definitions the way a student accepts a geometric proof: silently, internally, and completely.

  **The Wallis Problem in Politics:**
  Wallis represents the **Private Conscience made Public.**
  *   Hobbes hates "private judgment" in public matters. He wants you to internalize the Sovereign's reason.
  *   Wallis, however, uses his institutional platform (Oxford) to publicly judge the Sovereign's "Geometer" (Hobbes/Royalist authority) and declare him wrong.

  If a Wallis exists in politics—a person with institutional authority who can publicly demonstrate that the Sovereign's definitions are "false" or "unjust"—the Leviathan fails. The Sovereign's word is no longer self-evident.

  Hobbes's theory stays **silent** on how to handle an opponent who uses *reason* (or the appearance of reason) to undermine the Sovereign, provided that opponent isn't immediately crushed by the sword. Hobbes assumes the Sword and the Pen are the same. Wallis proved the Pen could wound the Sword without bleeding.

  ### 5. Where Hobbes's Theory Goes Silent (The Gaps)

  You asked where the theory stays silent rather than forcing an answer. Here are the three specific silences exposed by the feud:

  **A. The Problem of Epistemic Sovereignty**
  Hobbes solves the problem of political authority (The Sovereign) but ignores the problem of *epistemic* authority. Who decides what counts as a valid proof?
  *   Hobbes says: "Reason decides."
  *   Wallis says: "The Community of Reasoners decides."
  *   **Silence:** Hobbes has no answer for when "Reason" splits into two camps. He defaults to "They are enemies," which is a political solution, not an epistemic one.

  **B. The Fallibility of the Constructor**
  Hobbes claims we build figures in our head, so there is no guessing. But the feud shows that **mental construction is prone to error.**
  *   Hobbes genuinely *thought* he saw the proof.
  *   **Silence:** Hobbes's theory cannot account for the *illusion* of certainty. If the Geometer can be wrong about the Circle, the Sovereign can be wrong about Justice. Hobbes never allows for the possibility that the Sovereign is sincerely mistaken, only that they are the *defined* truth.

  **C. The Role of Institutions**
  Hobbes is deeply suspicious of corporations and universities (he saw Oxford as a nest of rebellion). He wants a direct line from Sovereign to Subject.
  *   Wallis represents the power of an intermediate institution to validate truth.
  *   **Silence:** Hobbes cannot explain why the University has the power to ruin his reputation. His theory says only the Sovereign has public power. Yet, Wallis (an academic) wielded immense public power against him. Hobbes's map of power missed the terrain of **cultural capital.**

  ### Summary: The Verdict on the Feud

  You suspected there was something about "standing or epistemic authority" in there. There is. We can call it **The Crisis of Private Demonstration.**

  Hobbes tried to build a system where truth is generated privately (in the mind of the Geometer/Sovereign) but binds publicly. The Wallis feud proved that **private demonstration cannot bind a public that refuses to recognize the demonstrator's standing.**

  *   **Was it a failure of method?** Yes. Hobbes's method relies on the transparency of reason. The feud showed reason is opaque; two people can look at the same "proof" and see different things.
  *   **Does politics require no Wallis?** Yes. Hobbes's absolutism requires that there be no rival authority to validate truth. A "Wallis" in politics is a Pope, a University, or a Press that can say "The King is Wrong" and be believed. Hobbes knew this was dangerous, which is why he hated universities so much.

  **The Irony:**
  Hobbes wanted to make politics as certain as geometry. But in trying to do geometry, he ended up making it as messy as politics. He turned the squaring of the circle into a struggle for prestige, authority, and survival—exactly the state of nature he was trying to escape.

  Wallis didn't just beat Hobbes at math; he demonstrated that Hobbes's epistemology was politically naive. Truth, it turns out, is not just constructed; it is negotiated. And Hobbes refused to negotiate.
