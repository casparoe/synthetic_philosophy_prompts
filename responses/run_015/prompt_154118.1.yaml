  Dagen H ultimately complicates Lewis's account by demonstrating that while conventions function as coordination equilibria, their transition can require coercive state intervention and material restructuring rather than emerging solely from shared expectations.

  In Lewis's framework, conventions solve recurrent coordination problems where agents prefer conformity conditional on others conforming. For Dagen H, the agents were all road users. The payoff matrix featured two stable equilibria: all-left and all-right. The preference was purely coordinative; driving on the right is only valuable if others do too. However, the transition was not a spontaneous shift in belief but a mandated jump. Common knowledge was manufactured artificially through a saturation media campaign and a legally fixed switch-over time, ensuring everyone knew that everyone else would switch simultaneously. While the end-state was a pure coordination game, the transition involved conflict regarding who bore the costs of retrofitting vehicles, rebuilding intersections, and replacing signage. Vehicle owners faced asset devaluation, while municipalities absorbed infrastructure costs, introducing bargaining dynamics absent in Lewis's pure coordination examples.

  Lewis's analysis treats conventions primarily as mental equilibria sustained by mutual expectations. Dagen H reveals that conventions are also anchored in physical artifacts—steering wheel placement, road markings, and traffic signals—which act as material memory resisting change. This infrastructure creates inertia that pure belief updates cannot overcome. Consequently, the convention could not evolve gradually; the material environment required a discontinuous, synchronous jump to avoid catastrophic coordination failure during the transition. The state had to physically alter the coordinating environment overnight to match the new normative rule. Drivers might have believed others would switch, but their cars physically prevented it without modification. This suggests precedent can be severed, contrary to Lewis's emphasis on gradual evolutionary selection.

  This episode implies that social norms can be deliberately redesigned by state action, provided the state can synchronize belief updates with material restructuring. Lewis's model explains the stability of the convention once established but underestimates the friction involved in shifting equilibria when physical infrastructure is involved. The success of Dagen H shows that top-down engineering can override evolutionary selection pressure, but only by treating the material world as part of the coordination mechanism itself. Thus, while Lewis correctly identifies the logical structure of conventions, his account requires expansion to include the material constraints that lock equilibria in place and the coercive power sometimes necessary to break them. Norms are not merely self-enforcing agreements but socio-technical systems where state action can overcome the hysteresis of built environments, provided it acts as a central coordinator to reset the material baseline.
