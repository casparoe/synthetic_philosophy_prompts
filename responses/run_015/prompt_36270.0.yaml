  **Question:** Does a point *eventually* come where Law becomes the *only* rational choice?
  *   **YES** → **Leaf 1: Single-Scale Comparabilist**
  *   **NO** → **Node 2**

  ### **Node 2: The Trump Card Test**
  **Case:** You answered "No" above. The salary increases forever, but Law never becomes *required*.
  **Question:** Is this because Art is *strictly more important* than Money (like Justice vs. Fun), or because they are just *different kinds* of things?
  *   **"Strictly More Important"** → **Leaf 2: Lexicographic View**
  *   **"Different Kinds"** → **Node 3**

  ### **Node 3: The Coin-Flip Test**
  **Case:** You answered "Different Kinds." Neither option is better, and neither strictly trumps the other.
  **Question:** Before you choose, is it *already true* that you are permitted to pick either, or do you *make* it true by committing?
  *   **"I Make It True"** → **Leaf 3: Existentialist/Constitutive View**
  *   **"Already True"** → **Node 4**

  ### **Node 4: The Third-Option Test**
  **Case:** You answered "Already True." There is a fact that you may pick either.
  **Question:** Imagine a third option, **Law+**, which is slightly better than Law. If you can still rationally choose **Lisbon** over **Law+**, what does that mean?
  *   **"It Means They Share a Special Connection"** → **Leaf 4: Parity View**
  *   **"It Means Reason Just Runs Out"** → **Leaf 5: Brute Pluralist**

  ***

  ### **The Leaves (Positions & Awkward Commitments)**

  **Leaf 1: Single-Scale Comparabilist**
  *   **The View:** Every option can be measured on one universal scale of value; hard choices are just ignorance of the score.
  *   **Most Awkward Commitment:** You must accept that enough units of "trivial good" (e.g., paperclips) could theoretically outweigh a "major good" (e.g., a human life) if the number gets high enough.

  **Leaf 2: Lexicographic View**
  *   **The View:** Values are distinct but ranked; higher values absolutely trump lower values regardless of quantity.
  *   **Most Awkward Commitment:** You must accept that a tiny amount of the "higher" value (e.g., a speck of justice) always outweighs an infinite amount of the "lower" value (e.g., universal happiness).

  **Leaf 3: Existentialist/Constitutive View**
  *   **The View:** In hard choices, there is no normative fact prior to choice; your will creates the reason.
  *   **Most Awkward Commitment:** You must accept that your choice is fundamentally groundless; you cannot say you chose "right," only that you committed.

  **Leaf 4: Parity View (Fourth Relation)**
  *   **The View:** "Neither better nor equal" is a positive fourth relation (parity); options are comparable but not ranked.
  *   **Most Awkward Commitment:** You must defend the existence of a specific value relation that is distinct from equality but still permits rational choice between the two.

  **Leaf 5: Brute Pluralist**
  *   **The View:** Values are distinct and sometimes incomparable; reason simply provides no guidance in these cases.
  *   **Most Awkward Commitment:** You must accept that in some choices, rationality is silent, and there is no structural relationship (like parity) explaining why either is permissible.

  ***

  ### **Note on Indistinguishable Leaves**
  **Flagged Leaves:** **Leaf 4 (Parity)** and **Leaf 5 (Brute Pluralist)**.
  **Reason:** This tree cannot definitively separate these two because the "Third-Option Test" at Node 4 relies on a subtle theoretical distinction. Both views agree that neither option is better and both permit choosing either. Whether you describe this as "a fourth relation exists" (Parity) or "no relation exists" (Brute Pluralism) often collapses into the same practical advice for a decision-maker, making it a distinction without a difference for first-year students.
