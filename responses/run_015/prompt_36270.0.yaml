  # The "Hard Choices" Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your intuition about the case provided. Follow the arrow to the next Node or to a Final Position (Leaf).

  ### **Node 1: The Small-Improvement Test**
  **Case:** You are choosing between **Law** (high money, low art) and **Lisbon** (low money, high art). Neither seems clearly better. Imagine we improve Law slightly (e.g., +$100 salary). We keep adding $100 forever.
  **Question:** Does a point *eventually* come where Law becomes the *only* rational choice?
  *   **YES** → Go to **Node 2**.
  *   **NO** → Go to **Node 3**.

  ### **Node 2: The Common Measure Check**
  **Case:** You answered "Yes" above. When the extra money finally tips the scale, why does it win?
  **Question:** Is it because money and art can both be converted into a single "score" of goodness, or because one value simply outranks the other?
  *   **"Single Score"** → **Leaf A: Single-Scale Comparabilist**
  *   **"Outranks"** → **Leaf B: Lexicographic View**
      *(Note: If you think money never tips the scale because Art is strictly higher priority, you should have answered NO at Node 1. If you think money tips the scale because they share a measure, you are here.)*
      *Correction for Tree Logic:* To make this cleaner:
      *   **Node 1 YES** → **Leaf A: Single-Scale Comparabilist**. (If small improvements eventually tip the scale, you believe in a common metric).
      *   **Node 1 NO** → **Node 2**.
      *   **Node 2:** Why doesn't it tip? Is it because Art is *strictly more important* than Money (no amount of money matters)?
      *   **YES** → **Leaf B: Lexicographic View**.
      *   **NO** → **Node 3**. (They don't compare, but neither strictly wins).

  *(Revised Flow for Logic Accuracy)*

