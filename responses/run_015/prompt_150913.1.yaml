answer: |-
  # Dissertation Prospectus

  **Working Title:** Moral Residue and the Structure of Obligation: A Case for Justificatory Dilemmas

  **Research Question**
  Does the persistence of justificatory obligations (specifically duties of repair or apology) following a forced moral choice entail that the chosen action retained its status as morally forbidden, notwithstanding the all-things-considered obligation to perform it?

  In simpler terms: If I am required to violate a norm to satisfy a higher priority norm, does the fact that I still owe compensation to the violated party prove that the violation remained "wrong" in a way that standard "overriding ought" accounts cannot explain?

  **Context and Problem**
  The debate over genuine moral dilemmas typically stalls on two fronts. Proponents argue from the phenomenology of guilt and regret, claiming that the emotional residue of difficult choices indicates a moral remainder. Opponents argue from logical consistency, specifically the principle that "ought implies can" and the agglomeration principle (if I ought to do A and ought to do B, I ought to do A and B). They argue that if an agent is required to do X, X cannot be forbidden; therefore, the conflicting obligation is defeated, not violated.

  Both sides focus on the *moment of choice*. The standard view treats moral obligations like a priority queue: the higher obligation overwrites the lower one, rendering the lower one inert. The opposing view treats them as tragic conflicts where both remain in force, paralyzing the agent.

  This project argues that both views neglect the *post-choice normative landscape*. Drawing on an analogy from distributed systems engineering (specifically error handling and compensating transactions), I propose that moral obligations function less like a priority queue and more like a transactional ledger. In a transactional system, a "rollback" does not mean the error never occurred; it means the system acknowledges the state change and incurs a cost to reverse it. Similarly, in ethics, if an agent owes a duty of repair (a compensating transaction) after making the "right" choice, this suggests the initial violation was not overwritten but rather *incurred*.

  **Proposed Framework**
  I will distinguish three types of moral residue often run together in the literature:
  1.  **Deliberative Residue:** Internal feelings of regret or guilt.
  2.  **Evaluative Residue:** The judgment that the act was sub-optimal or unfortunate.
  3.  **Justificatory Residue:** An outstanding normative debt owed to a specific party (e.g., a duty to apologize or compensate).

  My hypothesis is that (1) and (2) are compatible with the standard "overriding ought" view; an agent can regret doing what they had to do without implying a dilemma. However, (3) is incompatible with the standard view. If I truly *ought* to have broken the promise (all things considered), and that "ought" nullifies the prohibition against breaking it, I should not owe you anything. If I do owe you repair, the prohibition against breaking the promise must have survived the conflict.

  **Methodology**
  This project will proceed via conceptual analysis and argument reconstruction rather than historical exegesis or empirical study. The method is "Normative Accounting": testing whether standard deontic logic can account for the persistence of second-order obligations without admitting a contradiction in first-order obligations.

  I will avoid intuition-pumping case studies (e.g., trolley problems) in favor of structural analysis. The core test case will be "promissory conflicts" where a promise is broken to prevent a disaster. The question is not whether breaking the promise was permissible, but whether the specific obligation to the promisee is extinguished or transformed.

  **Work Plan (8 Months, Part-Time)**
  *   **Months 1–2: Literature Mapping.** Identify the strongest formulations of the "overriding ought" argument and the leading accounts of moral residue. Focus on logical structure, not history.
  *   **Months 3–4: Argument Construction.** Draft the core argument distinguishing Justificatory Residue from Deliberative/Evaluative Residue. Formalize the claim that duties of repair entail surviving prohibitions.
  *   **Months 5–6: Objection Handling.** Anticipate counter-arguments (e.g., that duties of repair are merely consequentialist tools for future good, not acknowledgment of past wrong). Refine the "Normative Accounting" analogy.
  *   **Month 7: Drafting.** Assemble the argument into the final 8,000-word structure.
  *   **Month 8: Revision.** Tighten definitions, ensure the conclusion answers the specific research question, and format citations.

  **Success and Failure Conditions**
  *   **Success:** The dissertation demonstrates that Justificatory Residue cannot be explained by consequentialist or "overriding ought" frameworks without ad hoc adjustments. It establishes that admitting genuine dilemmas is the only coherent way to account for duties of repair in conflict cases.
  *   **Failure:** The project fails if it turns out that duties of repair can be fully explained as forward-looking tools (e.g., "I apologize to restore trust") rather than backward-looking acknowledgments of wrong. It also fails if the distinction between the three types of residue collapses under scrutiny.

  **Feasibility**
  The scope is limited to the logical relationship between residue and obligation, avoiding broad meta-ethical commitments. This makes 8,000 words sufficient for a determinate conclusion. The constraint of one evening per week requires strict adherence to the "Normative Accounting" method to avoid getting lost in the broader history of the dilemma debate.

  ***

  # Private Note: Feasibility & Strategy Verdict

  **Is this too big or too small?**
  It is **just right**, but only if you are ruthless. 8,000 words is a standard journal article length. For 8 months at one evening a week, you have roughly 30–35 working sessions. That is enough for a tight, argumentative paper, but *not* enough for a historical survey or a broad meta-ethical defense.

  **The Verdict on Your Three-Way Split**
  Your split is strong, but for 8,000 words, I recommend **collapsing (1) and (3)**.
  *   *Why:* "Deliberative" (feelings) and "Evaluative" (judgments of badness) are easily dismissed by the opposition as subjective or consequentialist. They are "cheap," as you noted.
  *   *The Pivot:* Focus 80% of the word count on **(2) Justificatory Residue**. This is your "compensating transaction." The argument is sharper if you frame it as: *Internal guilt is compatible with monism (one right answer); external debt is not.*
  *   *Reframed Question:* "Does the existence of a duty to make amends entail that the violated duty was not overridden?" This is cleaner than asking about dilemmas generally.

  **Engineering Analogy: Use with Caution**
  Your backend intuition is the engine of this insight, but **do not lean heavily on the engineering terminology in the text** unless your supervisor is open to interdisciplinary work. Some philosophy departments are conservative.
  *   *Instead of:* "Compensating transactions."
  *   *Use:* "Second-order obligations of repair."
  *   *Instead of:* "Hard-fail vs. Best-effort."
  *   *Use:* "Extinguished obligations vs. Surviving prohibitions."
  Keep the *structure* of the engineering logic, but translate the *vocabulary* into standard deontic terms. It makes the argument harder to dismiss as a category error.

  **Risk Management**
  *   **The Trap:** Getting stuck on "Ought Implies Can." This is a black hole.
  *   **The Fix:** Concede "Ought Implies Can" for the *all-things-considered* ought, but argue it doesn't apply to the *prima facie* ought that generates the residue. Your niche is the survival of the *prima facie* obligation *after* the choice is made.
  *   **Time:** One evening a week means you will forget what you read in Week 1 by Week 4. Keep a "Argument Log" (bullet points only). Do not take detailed notes on papers; only note how they help or hurt your specific thesis.

  **Final Word**
  This is a viable MA dissertation topic. It has a clear thesis, a novel angle (residue as proof rather than symptom), and a bounded scope. If you stick to the "Justificatory Residue" lane and ignore the rest, you can hit 8,000 words without fluff.
