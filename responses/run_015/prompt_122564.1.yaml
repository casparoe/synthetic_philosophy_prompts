  Welcome to the Office of the Nomisma, the central banking authority of the Polis. We regulate exchange to ensure civic virtue. Our mission is to prevent citizens from mistaking conventional tokens for natural wealth. All monetary policy derives from the principle that currency exists by statute, not nature. We manage the Weekly Demand Index, oversee Diagonal Conjunction compliance, and enforce strict prohibitions on usury. The following FAQ clarifies your obligations under the current virtuous framework. Please read carefully before attempting any transaction. Non-compliance is treated as a moral failing. Your cooperation ensures the city remains just.

  1. **What backs the currency?**
  Nothing natural. It is *nomisma*, established by custom rather than physical properties. The Assembly declares Clay Token Reissue Day quarterly. Old coins become ceramic dust. This reminds everyone that value is legal, not physical. Hoarding is discouraged because storing convention is futile. The token is a measure of demand, not a store of value. If you cling to clay, you cling to an illusion. We prioritize the health of the polis over your personal financial security. You cannot expect permanent value from a conventional instrument designed for temporary exchange.

  2. **How is value calculated?**
  We utilize the Weekly Demand Index to set values. Surveyors visit households to assess actual need for goods. If the city needs shoes more than houses, the shoe-token ratio adjusts accordingly. Money measures demand, not intrinsic worth or labor input. This ensures exchange reflects real necessity rather than arbitrary price signals or greed. Fluctuations may seem volatile to outsiders, but they represent moral accuracy. Your purchasing power changes based on collective virtue. Do not complain when your savings vanish because the city no longer requires your specific output. Need dictates value, not your desire for stability.

  3. **How do I execute a trade?**
  All exchanges require a Diagonal Conjunction Compliance Form filed in triplicate. Before a builder trades house-claims for shoes, the Office equalizes the products in proportion. The trader must be put into the same ratio as the goods exchanged. This prevents exploitation. You cannot simply swap; you must align the human value with the object value before transfer. Filing takes three days to process. Unregistered swaps are considered theft of justice. We verify that the builder and shoemaker are equated before the tokens move. This prevents exploitation through unequal ratios and maintains civic harmony.

  4. **Can I earn interest on savings?**
  No. Interest is money born of money, the most unnatural form of wealth-getting known to man. Currency was invented for exchange, not breeding offspring from metal. The Office of Usury Prevention audits all accounts for suspicious growth. If deposited tokens seem to multiply, the account is frozen and the surplus confiscated for public works. Savings accounts are effectively banned because they encourage unlimited accumulation of symbols. We distinguish between managing a household and piling up tokens for no end. The latter is contrary to nature and banned. Your capital must remain sterile to remain virtuous within our borders.

  5. **What is the limit on wealth?**
  Wealth getting has two kinds: natural and unnatural, and we forbid the latter. Natural acquisition is limited to what is needed to run a household. Unlimited piling-up of tokens is unhealthy and strictly forbidden by statute. The Office monitors accumulation closely for signs of greed. If you possess more than required for self-sufficiency, you are suspected of engaging in chrematistics. We encourage you to spend excess on civic duties. Hoarding disrupts the circulation of need and corrupts the holder. True wealth consists of useful goods, not conventional markers. Do not mistake the measure for the thing measured. Enough is enough for a virtuous citizen.

  6. **What about foreign traders?**
  Visiting merchants are informed that tokens stop being money once they leave the city. Convention does not travel beyond our jurisdiction. Our currency is valid only where the law holds sway. Professor Ivor Bullion of the Mercantile School claimed this wrecks trade, insisting money is a natural commodity and store of value. He argues banning interest destroys investment and growth. We reject this entirely. Money is not a commodity; it is a legal measure of need. If his tokens fail outside, it proves our point. Nature does not respect borders; law does. His distress confirms our success in separating value from nature.

  7. **Why is this system superior?**
  It aligns economics with ethics perfectly. Other states allow money to dominate man, but here, man dominates money through law. By rendering currency useless, we break the illusion of permanent value. By banning interest, we stop the unnatural breeding of metal. By enforcing diagonal conjunction, we ensure proportional justice in every swap. Critics call it insufferable; we call it virtuous. The goal is not efficiency, but the good life for the citizen. If trade slows because justice is complex, so be it. We are a city-state, not a marketplace. Your compliance ensures our soul remains intact against corruption.
