  hey — I need a parody FAQ for a dataset, about 800 words. Could you write it as the public information page for the Office of the Nomisma, the central bank of a small, insufferably virtuous city-state that has decided to run its entire monetary system straight off Aristotle’s theory of money and exchange? I want deadpan official voice, a short intro paragraph, then six or seven numbered Q&As (questions in bold, answers maybe 80-120 words each).

  The target is the Aristotelian position itself, followed dead seriously into policy, so the humor comes from the content: money is only a conventional measure of the real standard, which is demand or need; it is called nomisma because it exists by custom/law rather than by nature, and the assembly can in principle revalue it or render it useless whenever it feels like it; before any exchange the products have to be equalized in a proportion (the builder/shoemaker/house/shoe bit, where the traders are put into the same ratio as the goods, and only then does the swap happen — call it diagonal conjunction if you want); and lending money at interest is especially unnatural, because money was brought into existence for exchange, not for making more money, so interest is money born of money and the most contrary-to-nature form of wealth-getting.

  The piece should exaggerate those real commitments into bureacracy: a weekly Demand Index that revalues the currency by surveying what people actually want; a Diagonal Conjunction Compliance Form that has to be filed before a builder can trade house-claims for shoes; an Office of Usury Prevention that shuts down ordinary savings accounts and any product where deposited tokens seem to breed; and a Clay Token Reissue Day on which the assembly declares the old coins worthless just to remind everyone that money is custom, not nature. Distinguish the natural, limited business of getting enough to run a household from the unlimited piling-up of tokens, which the Office treats as the seperate, unhealthy kind. A visiting trader should be told the tokens stop being money once he leaves the city, because convention doesn’t travel.

  Please include at least one indignant comment from a fictional outside economist — invent a pun-name, something like Professor Doreen Specie or Professor Ivor Bullion — who insists money is really a natural commodity and a store of value and that banning interest will wreck everything; let the FAQ answer her without breaking character, making the Aristotelian logic feel calm and pitiless.

  No footnotes, no citations, no bibliography, and don’t quote any ancient text or put Aristotle’s actual words in quotation marks — just paraphrase everything as if it were ordinary central-bank policy. A classicist should recognize the views and think the exaggeration is fair; a non-specialist should just feel the nightmare. Keep your own tone casual, but the FAQ itself should be straight-faced. thanks!
