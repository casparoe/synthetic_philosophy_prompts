answer: |-
  **Title:** Portable Virtues: Exemplar Portability and Structural Context in Plutarch's *Parallel Lives*

  **Project Overview**
  Standard debates in moral philosophy regarding biography typically ask whether reading lives successfully cultivates virtue. This proposal shifts the inquiry from efficacy to cognitive structure. I propose investigating whether biographical narrative trains a specific reasoning habit I term "exemplar portability": the capacity to treat a moral agent as a detachable pattern of virtue rather than an entity embedded in a specific institutional or historical setting. While the workshop focuses on biography and hagiography, this paper will use Plutarch's *Parallel Lives* as the primary test case to theorize this mechanism, offering a framework applicable to later hagiographical traditions.

  **Research Question**
  Does Plutarch's formal strategy of Greek/Roman pairing encourage exemplar portability, or does the juxtaposition preserve cultural context in ways that block it? Specifically, does the *Synkrisis* (the formal comparison concluding each pair) invite the reader to abstract a virtue from its historical conditions, or does it insist that moral worth is inseparable from specific political and cultural ecosystems?

  **Why Standard Debates Do Not Settle This**
  Contemporary virtue ethics (e.g., exemplarist theories) often assumes that emulation is either psychologically feasible or impossible based on the distance between reader and agent. These debates focus on the *psychology* of admiration rather than the *narrative architecture* that guides it. They fail to account for how the structural arrangement of lives—specifically the parallel format—might train the reader to either ignore or attend to contextual constraints. By focusing on the text's formal mechanics rather than general efficacy, this project bypasses the stalemate between situationists and virtue ethicists regarding whether characters are imitable at all.

  **Methodology and Scope**
  To remain realistic for a semester-length paper, I will eschew a corpus survey in favor of close reading two specific pairs: *Alexander/Caesar* and *Demosthenes/Cicero*. These pairs offer high thematic overlap (ambition and oratory, respectively) across distinct cultural contexts. I will focus primarily on the *Synkrisis* sections, supplemented by key narrative moments where cultural difference is highlighted. I will analyze the text for linguistic markers of abstraction (universalizing language) versus particularization (insistence on local custom).

  **Expected Results and Failure Conditions**
  A successful result will demonstrate that Plutarch's pairing either systematically strips agents of their contextual particularity to create portable moral templates, or conversely, uses the comparison to highlight incommensurability, thereby blocking portability. A failure condition would be textual inconsistency where the *Synkrisis* contradicts the narrative regarding portability, suggesting no coherent reasoning habit is being trained. Findings will conclude with a brief note on how this Plutarchan mechanism informs the reading of hagiographical saints' lives as either universal models or context-bound witnesses.

  This paper argues that Plutarch's parallel structure functions as a cognitive tool that trains readers to either extract or retain contextual moral data, thereby redefining how biography facilitates moral learning.
