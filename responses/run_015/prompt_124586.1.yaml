      *   *Critique:* The "stable craton" argument is strong. Why didn't God put humans only in safe zones if He knew? Leibniz might say "freedom" or "population density," but that weakens the "best" claim.

  5.  **Final Review against Prompt:**
      *   Map episode precisely? (Done)
