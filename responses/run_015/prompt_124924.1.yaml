  UNITED STATES COURT OF APPEALS FOR THE NATURAL KINDS
  *In re Functionality of the Vermiform Appendix*

  OPINION OF THE COURT

  The Court convenes to adjudicate whether the human appendix currently possesses a "function," specifically regarding its secretion of a defensive peptide during episodes of gut dysbiosis. The Petitioner, advocating the Causal-Role Doctrine, submits that the peptide contributes materially to the containing system's capacity for immune defense. The Respondent, advocating the Etiological Doctrine, counters that function requires historical selection for said specific effect.

  Under the Etiological Doctrine, function is akin to property title derived from original grant. A trait possesses function only if natural selection historically maintained it for that specific effect. The Respondent argues that without a phylogenetic audit confirming the peptide secretion was the selective pressure preserving the appendix in ancestral lineages, the trait lacks standing. The evolutionary record is binding case law; absent precedent, the claim is void. To rule otherwise would permit traits to claim functional status based merely on contemporary utility, violating the statute of limitations imposed by deep time.

  Conversely, the Causal-Role Doctrine treats function as current utility within a systemic capacity. The Petitioner argues that the peptide's defensive contribution is observable fact, regardless of ancestral intent. To deny function based on history is to ignore present testimony. However, this Court finds that allowing current contribution alone to establish standing invites frivolous claims of functionality for any biological activity, however incidental. Such functional inflation undermines the regulatory integrity of biological classification.

  Accordingly, this Court issues the following order: No biological trait shall be legally recognized as possessing "function" under the Causal-Role Doctrine unless accompanied by a documented selection history satisfying the Etiological standard. We hereby enjoin all researchers from invoking functional attribution without a certified phylogenetic audit. The burden of proof lies with the trait to demonstrate it was selected for its current capacity. Until such documentation is filed, the appendix remains in a state of functional suspension, prohibited from contributing to systemic capacity in any official legal capacity.

  DISSENTING OPINION

  Justice Gould dissents.

  The majority attempts to reconcile irreconcilable doctrines by imposing Etiological standards upon Causal-Role claims. This procedural patchwork fails to address the substantive defect: exaptation. The evidence suggests the peptide secretion is an exaptation—a repurposing of existing machinery rather than an original adaptation.

  Under a strict reading, the Etiological Doctrine must deny function here, as the trait was not selected for this use. However, the majority assumes the Causal-Role Doctrine could grant function if only history were proven. This is error. If the trait is repurposed, its current contribution is merely activity, not function, because the systemic capacity relies on a historical accident rather than a designed role. To grant function based on current utility in cases of exaptation is to legitimize biological serendipity as legal statute.

  Because the appendix is functionless under the Etiological view (no history) and functionless under a rigorous Causal-Role view (no designed capacity), the concept of "biological function" is too vague to be adjudicated in cases of evolutionary repurposing. I would declare the matter unjusticiable. To rule otherwise is to pretend nature complies with our categorical imperatives. The Court should dismiss the case and cease attempting to legislate evolutionary contingency.
