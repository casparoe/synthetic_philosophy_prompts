prompt: |-
  I'm writing a piece on the replication crisis, and I've been leaning on an analogy several statistician sources offered me: a null-hypothesis significance test is a diagnostic screening test. Power plays the role of sensitivity, α the false-positive rate, the prior probability that a hypothesis is true plays the role of disease prevalence, and the positive predictive value — the share of "significant" findings that are real — is what a reader of a paper actually cares about. Used this way it is meant to license two claims I would like to print: that the folk reading of p < 0.05 as "only a one-in-twenty chance this is noise" is a base-rate fallacy, and that in fields where most tested hypotheses are false, most published positives will be false however carefully each individual test is run.

  One source says the analogy is worse than useless, and I want to know whether she is right. A screening test is applied repeatedly to a population with a stable, measurable prevalence and its error rates are calibrated against a gold-standard follow-up; research hypotheses are not sampled from any population, "true effect" is a matter of degree rather than a condition you either have or don't, and α is a long-run rate over a procedure that includes the analyst's unrecorded choices about which comparisons to make — none of which has a counterpart in the clinic.

  Audit the analogy for me. Give the correspondence table explicitly, say what the screening frame quietly imports that the target lacks (it seems to smuggle a prior probability of truth into a machinery built to avoid one), and separate the disanalogies that matter for those two conclusions from the ones that don't. In particular: suppose a funder required pre-registration of every hypothesis tested, publication of every result, and a replication as the gold-standard follow-up. Would the analogy then become exact, or is there a mismatch left over? And does it point at the right remedy — it recommends raising positive predictive value by improving the prior or the specificity — compared with the proposals to lower the significance threshold or to increase power? If the two conclusions survive, tell me on what; if they don't, tell me what the analogy was carrying. If there is a better analogy for where the unreliability actually comes from, I'd like that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Topic:** The Replication Crisis and the analogy between Null-Hypothesis Significance Testing (NHST) and Diagnostic Screening Tests.
      *   **User's Goal:** Writing a piece on the replication crisis. Wants to use the screening test analogy to support two specific claims:
          1.  Interpreting $p < 0.05$ as "1 in 20 chance of noise" is a base-rate fallacy.
          2.  In fields where most hypotheses are false, most published positives are false (Ioannidis-style argument).
      *   **Conflict:** One source (statistician) says the analogy is "worse than useless."
      *   **Task:** Audit the analogy.
          *   Provide an explicit correspondence table.
          *   Identify what the screening frame "smuggles in" (specifically regarding priors).
          *   Separate relevant disanalogies from irrelevant ones regarding the two conclusions.
          *   Address the "Ideal Scenario" (pre-registration, publication of all results, replication as gold standard): Does the analogy become exact then?
          *   Evaluate the remedies: Does the analogy point to the right solutions (improve prior/specificity) vs. others (lower $\alpha$, increase power)?
          *   Determine if the two conclusions survive and on what basis.
          *   Suggest a better analogy if applicable.

  2.  **Initial Assessment of the Analogy:**

      *   *The Analogy:* NHST $\approx$ Medical Screening.
      *   *Mapping:*
          *   $H_0$ True $\approx$ Healthy.
          *   $H_1$ True $\approx$ Diseased.
          *   Significant Result ($p < \alpha$) $\approx$ Positive Test.
          *   $\alpha$ $\approx$ False Positive Rate (1 - Specificity).
          *   Power ($1-\beta$) $\approx$ Sensitivity.
          *   Prior Probability $P(H_1)$ $\approx$ Prevalence.
          *   PPV (Positive Predictive Value) $\approx$ Probability $H_1$ is true given significance.
      *   *Validity:* Mathematically, Bayes' Theorem applies to both. The structure is isomorphic *if* you accept the frequentist/Bayesian mapping.
      *   *Critique:* The critic is right that the *ontology* differs (hypotheses aren't diseases, no stable population of hypotheses), but wrong that the *logic* fails for the specific claims the user wants to make. The analogy is a pedagogical tool, not an ontological claim.

  3.  **Drafting the Correspondence Table:**

      *   Need to be precise.
      *   Screening: Disease Status vs. Test Result.
      *   NHST: Truth Status vs. Statistical Decision.

  4.  **Analyzing the "Smuggled Prior":**

      *   Frequentist NHST claims to be objective and prior-free.
      *   The Screening Analogy *requires* a prevalence (prior) to calculate PPV.
      *   *The Tension:* Using the analogy forces the reader to acknowledge a prior probability of truth, which standard NHST rhetoric tries to ignore. This is actually a *feature* for the user's argument, not a bug, but the critic sees it as category error.
      *   *The "Population of Hypotheses":* In medicine, prevalence is empirical. In science, "proportion of true hypotheses" is metaphysical/subjective. This is the core disanalogy.

  5.  **Evaluating the Two Conclusions:**

      *   *Claim 1: $p < 0.05 \neq 5\%$ false positive risk.*
          *   Does the analogy hold? Yes. Even if $\alpha = 0.05$, the False Discovery Rate (FDR) depends on the prior. The math is identical (Bayes' rule).
          *   Does the disanalogy matter? No. The mathematical relationship between conditional probabilities holds regardless of whether "truth" is binary or continuous.
      *   *Claim 2: Low prior $\rightarrow$ High FDR.*
          *   Does the analogy hold? Yes. If prevalence is low, PPV is low even with good sensitivity/specificity.
          *   Does the disanalogy matter? No. As long as the "proportion of true effects" is low, the math works.

  6.  **The "Ideal Scenario" (Pre-registration + Full Reporting + Replication):**

      *   If we pre-register, we define the "population of tests."
      *   If we publish everything, we remove publication bias (selection bias).
      *   If we replicate, we establish the "Gold Standard."
      *   *Does it make the analogy exact?* Closer, but not exact.
      *   *Why not?* Because "Truth" in science isn't binary like "Disease." Effects are continuous. $H_0$ is almost never *exactly* true (point null). In screening, you either have the antigen or you don't. In science, an effect might be $d=0.0001$. Is that "True"?
      *   *Residual Mismatch:* The definition of "True." In screening, truth is independent of sample size. In NHST, "significance" depends on $N$. A tiny trivial effect can be "true" and "significant" with huge $N$.

  7.  **Evaluating the Remedies:**

      *   *Analogy suggests:* Increase Prevalence (test better hypotheses) or Increase Specificity (lower $\alpha$).
      *   *Standard Reform:* Lower $\alpha$ (increase specificity), Increase Power (sensitivity).
      *   *Ioannidis/Analogy view:* The biggest lever is the Prior (Prevalence). Testing unlikely hypotheses yields garbage even with perfect stats.
      *   *Comparison:* The analogy highlights the *Prior* problem better than standard power analysis does. Standard reforms often ignore the "how plausible was this idea?" question. So the analogy points to a *neglected* remedy (better theory selection), not necessarily the *only* remedy.

  8.  **Identifying a Better Analogy (if needed):**

      *   *Screening* is actually quite good for PPV.
      *   *Alternative:* *Quality Control / Manufacturing.* (Defective vs. Non-defective). Same issue with priors.
      *   *Alternative:* *Signal Detection Theory.* (Signal vs. Noise). This handles the continuous nature of effects better.
      *   *Verdict:* Stick with Screening for PPV arguments, but acknowledge the "Signal Detection" nuance for effect sizes. Actually, the "Screening" analogy is the standard for PPV arguments (Ioannidis used it). The critic is being overly pedantic about ontology vs. epistemology.

  9.  **Synthesizing the Argument:**

      *   *Validate the Critic (partially):* She is right about ontology (hypotheses aren't diseases).
      *   *Validate the User:* She is wrong about utility. For the specific logical claims (Base Rate Fallacy & FDR), the math is isomorphic.
      *   *The "Smuggle":* The analogy forces a Bayesian interpretation onto a Frequentist tool. This is the point of the critique, but it's exactly what's needed to explain the replication crisis.
      *   *Ideal World:* Even with pre-registration, the "Point Null" problem remains.
      *   *Remedies:* The analogy correctly identifies that statistical tweaks ($\alpha$, Power) are insufficient without theoretical priors.

  10. **Refining the Output Structure:**

      *   **Executive Summary:** Verdict on the critic.
      *   **Correspondence Table:** Clear mapping.
      *   **The Smuggle:** Explain the Prior/Prevalence issue.
      *   **Audit of Conclusions:** Do they survive the disanalogies?
      *   **The Ideal Scenario:** Pre-registration/Replication impact.
      *   **Remedies:** What the analogy implies vs. standard reforms.
      *   **Better Analogy:** Signal Detection.

  11. **Self-Correction/Nuance Check:**
      *   *Wait, is $\alpha$ the False Positive Rate?* Technically $\alpha$ is $P(\text{Significant} | H_0 \text{ True})$. In screening, FPR is $P(\text{Positive} | \text{Healthy})$. Yes, they match.
      *   *Is Power Sensitivity?* Power is $P(\text{Significant} | H_1 \text{ True})$. Sensitivity is $P(\text{Positive} | \text{Diseased})$. Yes.
      *   *The Critic's point on "Analyst Choices":* In screening, the test is fixed. In NHST, "p-hacking" changes the effective $\alpha$. This is a major disanalogy. I need to address "Researcher Degrees of Freedom."
      *   *The "Point Null" issue:* In medicine, "healthy" is a real state. In stats, $H_0: \theta = 0$ is almost never literally true. This undermines the "Prevalence of True Hypotheses" concept. I need to be careful here. The "True Hypothesis" usually means "Effect size large enough to matter," not "Effect size $\neq 0$."

  12. **Final Polish:** Ensure tone is analytical, authoritative, and helpful for a writer. (Proceed to generate response based on these thoughts.)
answer: |-
  ### Executive Summary

  Your source is **ontologically correct but pragmatically wrong.**

  She is right that the *nature* of scientific truth differs fundamentally from the *nature* of biological disease. Hypotheses are not sampled from a stable population, and "truth" in science is rarely binary. However, she is wrong that this makes the analogy "worse than useless." For the specific logical claims you wish to make (the base-rate fallacy and the False Discovery Rate), the mathematical structure is isomorphic. The analogy is not a claim about what hypotheses *are*; it is a claim about how probability *behaves* when you filter signals through noisy tests.

  The analogy's utility lies precisely in what your source dislikes: it forces a Bayesian prior into a Frequentist framework. That is not a bug; it is the feature required to explain the replication crisis.

  Below is the audit you requested.

  ---

  ### 1. The Correspondence Table

  | Diagnostic Screening | Null-Hypothesis Significance Testing (NHST) |
  | :--- | :--- |
  | **Patient Status** | **Hypothesis Status** |
  | Diseased ($D+$) | True Effect / $H_1$ is True |
  | Healthy ($D-$) | Null Effect / $H_0$ is True |
  | **Test Characteristics** | **Test Characteristics** |
  | Sensitivity ($P(T+ \| D+)$) | Statistical Power ($1 - \beta$) |
  | Specificity ($P(T- \| D-)$) | Specificity ($1 - \alpha$) |
  | False Positive Rate ($1 - \text{Spec}$) | Significance Level ($\alpha$) |
  | **Population Parameters** | **Research Context** |
  | Prevalence ($P(D+)$) | Prior Probability ($P(H_1)$) |
  | **Outcome** | **Outcome** |
  | Positive Predictive Value (PPV) | Positive Predictive Value (PPV) / False Discovery Rate (1 - PPV) |
  | "Probability you have disease given + test" | "Probability effect is real given $p < \alpha$" |

  ---

  ### 2. What the Screening Frame "Smuggles In"

  The screening analogy imports a **stable reference class** and a **subjective prior** into a machinery designed to avoid them.

  1.  **The Reference Class Problem:** In medicine, "prevalence" is an empirical fact about a defined population (e.g., women over 50). In science, there is no "population of hypotheses." The "prior probability" is not an empirical frequency; it is a subjective degree of belief about the plausibility of a theory *before* data collection. The analogy smuggles in the idea that hypotheses *have* a base rate, which orthodox Frequentist NHST explicitly denies.
  2.  **The Binary Truth Assumption:** Screening assumes you either have the cancer or you don't. NHST treats $H_0$ as a point null ($\text{effect} = 0$). In reality, effects are continuous. The analogy forces a binary "True/False" categorization onto a continuous reality, obscuring the distinction between "statistically significant" and "scientifically meaningful."

  **Why this matters for your piece:** The "smuggle" is necessary. You cannot explain the replication crisis using only Frequentist logic, because Frequentist logic defines error rates conditional on the truth ($\alpha = P(\text{Sig} | H_0)$), whereas readers care about error rates conditional on the result ($P(H_0 | \text{Sig})$). The analogy bridges this gap by forcing the reader to accept that $P(H_0 | \text{Sig})$ depends on $P(H_0)$.

  ---

  ### 3. Audit of the Two Conclusions

  Do the disanalogies undermine the claims you want to print?

  #### Claim 1: "$p < 0.05$ is not a 1-in-20 chance of noise." (The Base-Rate Fallacy)
  *   **Verdict:** **Survives.**
  *   **Reasoning:** This is a mathematical identity, not an empirical claim. Bayes' Theorem governs both screening and significance testing. Even if hypotheses aren't diseases, the conditional probability $P(H_0 | \text{Sig})$ is never equal to $\alpha$ unless the prior probability of $H_1$ is 50% and power is 100%. The ontological mismatch (binary vs. continuous truth) does not change the arithmetic of conditional probability.
  *   **Disanalogy that doesn't matter:** Whether "truth" is a physical state (disease) or a model state (hypothesis) is irrelevant to the calculation of false discovery risk.

  #### Claim 2: "In fields where most hypotheses are false, most published positives are false."
  *   **Verdict:** **Survives, with a caveat.**
  *   **Reasoning:** This is the Ioannidis argument. It holds mathematically *if* you accept that "most hypotheses are false" is a coherent statement.
  *   **Disanalogy that matters:** In screening, prevalence is measurable. In science, "proportion of true hypotheses" is unknowable. A critic can argue you cannot assert "most are false" because there is no denominator.
  *   **Fix:** Phrase it conditionally. "If the prior probability of a tested hypothesis is low (e.g., exploratory 'fishing expeditions'), the False Discovery Rate will be high." This preserves the logic without requiring an empirical census of truth.

  ---

  ### 4. The "Ideal Scenario" Test

  *Suppose a funder required pre-registration of every hypothesis, publication of every result, and replication as the gold-standard follow-up. Does the analogy become exact?*

  **No. A mismatch remains.**

  1.  **The Point Null Problem:** In screening, "Healthy" is a real state. In NHST, the Null Hypothesis ($\text{effect} = 0$) is almost never *literally* true in the real world (everything is correlated with something to some decimal place). With infinite sample size, every null hypothesis is rejected. In screening, a healthy person does not become "diseased" if you test them enough times. In NHST, "Truth" is confounded by Sample Size ($N$).
  2.  **Researcher Degrees of Freedom:** Even with pre-registration, a screening test is a fixed physical assay. A statistical test is a logical procedure that depends on data cleaning, outlier removal, and covariate selection. A "positive" in screening is a chemical reaction; a "positive" in NHST is a decision boundary that can be moved by the analyst (p-hacking). Pre-registration reduces this, but does not eliminate the flexibility inherent in data analysis compared to a lab assay.
  3.  **The Gold Standard:** In medicine, a biopsy confirms the screening test. In science, a replication *is just another statistical test* with its own $\alpha$ and power. It is not a "truth machine"; it is just a second noisy filter.

  **Conclusion:** The ideal scenario makes the analogy *operational*, but not *ontological*. It fixes the "publication bias" (selection bias) problem, but not the "point null" or "researcher flexibility" problem.

  ---

  ### 5. Remedies: What the Analogy Recommends

  The analogy highlights a divergence in reform strategies.

  | Reform Strategy | Mechanism | Analogy Equivalent |
  | :--- | :--- | :--- |
  | **Lower $\alpha$ (e.g., to 0.005)** | Increase Specificity | Require more specific diagnostic test (fewer false alarms). |
  | **Increase Power (Larger $N$)** | Increase Sensitivity | Ensure test catches all diseased patients. |
  | **Improve Theory (Better Priors)** | Increase Prevalence | Only screen high-risk populations. |

  **Does the analogy point to the right remedy?**
  It points to the **neglected** remedy.
  Most methodological reforms focus on Specificity ($\alpha$) and Sensitivity (Power). The screening analogy demonstrates that if Prevalence (Prior) is sufficiently low, improving Specificity and Sensitivity yields diminishing returns.
  *   *Example:* If only 1 in 1,000 hypotheses is true, even $\alpha = 0.001$ yields a 50% False Discovery Rate.
  *   *Implication:* The analogy correctly argues that statistical rigor alone cannot save a field that tests implausible hypotheses. It validates the call for **stronger theory** and **preregistration of high-risk predictions** (which increases the effective prior).

  However, the analogy can be misleading if it suggests we *cannot* improve PPV without knowing the prior. We can improve PPV by lowering $\alpha$ (Benjamin et al. argument). The analogy shouldn't be used to say "statistics don't matter," but rather "statistics aren't enough."

  ---

  ### 6. Is There a Better Analogy?

  If your source finds the medical analogy too ontologically loaded, the **Signal Detection Theory (SDT)** analogy is more precise for statisticians, though less intuitive for general readers.

  *   **Signal:** The true effect size.
  *   **Noise:** Sampling error / Variance.
  *   **Criterion:** The significance threshold ($\alpha$).
  *   **Hit:** Correctly detecting a signal.
  *   **False Alarm:** Detecting noise as signal.

  **Advantage:** SDT handles continuous effect sizes naturally. It acknowledges that "noise" and "signal" are distributions that overlap, rather than binary states. It avoids the "disease" ontology.
  **Disadvantage:** It does not intuitively capture the **Base Rate** problem as well as the Screening analogy. SDT focuses on the separation of distributions ($d'$), whereas the Replication Crisis is largely about the *proportion* of signals to noise tests (the Prior).

  **Recommendation:** Stick with the **Screening Analogy** for the text. It is the standard pedagogical tool for PPV (used by Ioannidis, Gelman, etc.). It is "true enough" for the logical points you are making.

  ### 7. How to Address the Critic in Your Piece

  You can acknowledge the critique to strengthen your credibility. Consider a footnote or a parenthetical clause:

  > *"Statisticians rightly note that hypotheses are not diseases, and there is no stable population of 'true' theories to measure prevalence against. But mathematically, the filtering problem is identical. Whether you are screening for cancer or screening for truth, if the thing you are looking for is rare, a positive test is more likely to be an error than a discovery. The analogy is not an ontological claim; it is an arithmetic warning."*

  ### Summary for Your Draft

  1.  **Keep the analogy.** It is the most effective way to visualize the Base Rate Fallacy for a general audience.
  2.  **Qualify the "Prevalence."** Acknowledge that in science, this is a "prior plausibility" rather than an empirical frequency.
  3.  **Use it to argue for Theory.** Leverage the analogy to show why better statistics ($\alpha$, Power) are insufficient without better priors (Theory).
  4.  **Accept the "Ideal Scenario" limit.** Acknowledge that even with perfect transparency, the "Point Null" problem means science is harder than screening.

  The critic is protecting the purity of statistical ontology; you are explaining the reliability of scientific knowledge. Her precision is not your enemy, but your argument does not require her level of ontological commitment to hold water.
