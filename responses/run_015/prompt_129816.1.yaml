answer: |-
  1. Preliminary Brainstorming
  Several existing concepts approach this configuration but fail to capture its specific mechanics. Reflective equilibrium concerns the coherence between principles and judgments, yet it is typically a normative ideal rather than a description of dynamic computational failure. Performative contradiction involves a logical inconsistency between the content of an assertion and the act of asserting it, whereas the phenomenon described involves causal feedback without logical error. Self-defeating prophecy describes a prediction that falsifies itself through the act of prediction, but this case involves decision rules and self-models rather than truth-values alone. Finally, Newcomb-style reasoning focuses on selecting fixed points in self-referential decision problems, presupposing convergence rather than accounting for persistent oscillation. None of these isolate the specific pattern of non-convergent, locally rational updates within an embedded feedback loop.

  2. Diagnosis and Nearest Concepts
  No established concept precisely fits this configuration. The phenomenon is distinct because it describes a stable oscillation of rational procedures rather than a logical breakdown or a static state of incoherence. The nearest neighbor, performative contradiction, succeeds in highlighting how an agent's output can undermine its own premises, but it breaks down because performative contradictions typically entail a logical impossibility or a halt in reasoning. In the configuration described, the agent continues to compute perfectly valid steps; the failure is not in logical consistency but in dynamic stability. The agent is not contradicting itself; it is chasing a moving target created by its own footprint in the environment.

  Reflective disequilibrium and self-defeating predictions also offer partial analogies but ultimately miss the mark. Reflective disequilibrium usually refers to a temporary state of normative confusion awaiting resolution, whereas this oscillation is a permanent structural feature of the specific architecture described. Similarly, self-defeating predictions focus on the epistemic status of a belief becoming false because it was held. In contrast, the pattern here involves the *prescriptive* status of a decision rule becoming suboptimal because it was followed. The feedback loop is not falsifying a truth claim but invalidating a policy criterion, creating a cycle where each step is locally optimal but globally non-convergent.

  3. Proposed Concept
  I propose the term **Reflexive Limit Cycle** to name this configuration. A Reflexive Limit Cycle occurs when an embedded agent's self-model functions as a causal input to its decision procedure, and the output of that procedure alters the environment or the agent's state in a way that necessitates an update to the self-model, resulting in a closed loop of states that never reaches a fixed point. The necessary markers are: physical embedding where actions change the modeled environment, endogenous feedback where the self-model updates based on those actions, and computational continuity where each step is locally rational without logical paradox. A clear instance belonging to this category is the climate-policy model described, where the act of mitigating emissions changes the climate trajectory such that the mitigation model becomes obsolete, prompting a shift to adaptation, which then restores conditions favoring mitigation.

  A clear boundary case that does not belong but might be confused with this is an agent oscillating due to exogenous noise or sensor error. If an agent flips between policies because its data stream is corrupted by external interference, this is merely environmental volatility, not a Reflexive Limit Cycle. The distinction lies in the source of the instability: in a Reflexive Limit Cycle, the oscillation is generated entirely by the agent's own successful operation within its environment. Another non-instance is a logical paradox that halts computation, such as a liar sentence variant; this represents a crash in consistency, whereas the Reflexive Limit Cycle represents a failure of convergence despite maintained consistency.

  4. Implications for Embedded Agency
  Isolating this pattern matters because it reveals that rationality for embedded agents requires dynamic stability conditions that transcend local logical coherence. Traditional models of agency often assume that if an agent avoids paradox and maximizes utility at each step, it will eventually settle into an optimal policy or equilibrium. The existence of Reflexive Limit Cycles demonstrates that an agent can be perfectly consistent and locally rational at every time step yet fail to achieve any stable goal state due to the topology of its self-modeling feedback loop. This forces a shift in how we evaluate embedded rationality, suggesting that robust agency requires mechanisms to dampen reflexive oscillations or accept cyclic behavior as a fundamental constraint rather than a correctable error.
