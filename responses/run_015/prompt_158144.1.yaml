  You're a professor of metaethics who's been teaching this exact literature for twenty years, so please actually think it through carefully rather than hedging — brainstorm the sub-questions for a couple of hundred words first, then commit to numbers, and only then tell me where the number is fragile.

  Ok so I got into a huge argument with my friend Sam after dinner last night and I still can't tell who's right, so I want your honest credence on this proposition: genuine moral dilemmas are possible — meaning there are possible situations where an agent, with no relevant ignorance and no culpable history of their own, both morally ought to do A and morally ought to do B, and cannot do both, so that whichever they pick they do something they had a moral requirement not to do. (I want to separate that sharply from epistemic cases where you just don't know what you ought to do, and from "tragic choice" cases where one option is merely worse-but-permissible and the other is wrong — Sam kept sliding between those and I think that's where our disagreement actually hides, but I'm not sure.) My credence is about 0.7 and his is about 0.2, and I'd like your own number to two decimal places, decomposed into the sub-questions you think it rides on, with a rough probability and one line of justification for each, then how you combine them. Some things I want in there, though add whatever else belongs: how much rides on semantics of "ought" (does it agglomerate, does the ought-implies-can principle hold, and is that a substantive moral claim or just a fact about the word); how much rides on first-order axiology, e.g. whether there can be genuine incommensurability or whether some options are on a par with each other rather than equal or incomparable (there's a view like this, I think Ruth Chang, but I might be misremembering who argues it); how much rides on whether the regret we think is fitting after a tragic choice needs wrongdoing to be fitting, or whether there's such a thing as regret that's appropriate without anyone having done anything wrong; and how much rides on the idea that morality has to be action-guiding, because Sam's main argument was that if dilemmas were real then moral requirements couldn't guide action and morality would be broken, and I said that only refutes one particular advice-model of what moral requirements are for.

  Two more wrinkles I want you to weigh, because they're what actually got us stuck. First, Sam insisted that if you read conflicting requirements on the wide-scope reading — you ought: if you've promised, you keep it — rather than as narrow-scope conditional requirements, then the conflict doesn't agglomerate into "you ought to do the impossible," it just shows up as an inconsistency you have to plan your way out of, which he says dissolves the whole puzzle; I said that just relocates the conflict rather than removing it, but I couldn't say why cleanly. Second, I floated a view I partly made up on the spot, call it retroactive resolution: maybe in a tragic case there is no fact of the matter about what you all-things-considered ought to do until you've actually chosen, and the choice itself settles it, so the situation is resolvable but not solvable-in-advance — and then the question is whether a case like that still counts as a genuine dilemma or whether it's just a dilemma in name. Please tell me whether that view is coherent, how much probability it deserves, and how much it would move your headline number if it were right. Also tell me which term you're least confident in, what kind of argument or evidence would move it most, and — given that I'm at 0.7 and Sam's at 0.2 — which single sub-question most likely explains the gap between us. Don't answer with "it depends on what you mean by ought"; I want that dependence to appear as a term inside the decomposition instead.
