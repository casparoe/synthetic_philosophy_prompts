answer: |-
  ### What the Answer Gets Right

  Before settling on the mark, here is the credit this essay has earned. It is important to acknowledge these strengths so the penalties below don't look like a hunt for errors where none were intended.

  1.  **Technical Formulation:** The student correctly states the beta-delta functional forms for both exponential ($\delta^t$) and quasi-hyperbolic ($\beta\delta^t$) discounting. They correctly identify that $\beta$ applies only to delays $t \geq 1$ (the "present" gets no $\beta$ penalty).
  2.  **Mechanism of Reversal:** The explanation of *why* preferences reverse is technically accurate. They correctly note that for any two future dates, $\beta$ cancels out, but when one date becomes "now," the $\beta$ penalty applies to the future option only.
  3.  **Diagnosis of Akrasia:** They correctly identify that, on the strict definition provided in the prompt (acting against contemporaneous all-things-considered judgment), Sam is not akratic on evenings E1–E4. He does what he judges best *at that moment*.
  4.  **Sophistication vs. Naivete:** The definitions are correct. They understand that sophistication involves accurate prediction of future preference reversals, while naivete involves a false belief in future consistency.
  5.  **Money Pump:** It is good to see the connection made between dynamic inconsistency and vulnerability to money pumps. This shows they understand the normative stakes of the formalism.

  ---

  ### Mark Breakdown (Total: 12/20)

  **1. Formal Difference & Time Consistency (4/5)**
  *   **Awarded:** The formulas are correct, and the explanation of the "present bias" mechanism is clear.
  *   **Deducted:** The claim that the difference is one of "degree rather than kind" is conceptually wrong. Steep exponential discounting is still time-consistent; hyperbolic discounting is time-inconsistent. This is a structural difference, not just a difference in how much one cares about the future. Additionally, the prompt asked to "say why one... is time-consistent," which was implied but not explicitly defined (i.e., preferences at $t_0$ over $t_1, t_2$ match preferences at $t_1$ over $t_1, t_2$).

  **2. Application to Rolling Plan & Akrasia (3/7)**
  *   **Awarded:** Correctly applies the model to Sam's behavior and correctly concludes Sam is not strictly akratic by the prompt's definition.
  *   **Deducted:** Significant conceptual confusion regarding rationality. The "coffee/tea" analogy conflates exogenous preference change with endogenous dynamic inconsistency. Furthermore, the paragraph contains a direct contradiction: it claims "there is no irrationality anywhere in the Rolling Plan" and then concludes "that is where the real irrationality lies" (referring to the money pump). You cannot have it both ways.

  **3. Sophistication/Naivete & Commitment (3/5)**
  *   **Awarded:** Correctly distinguishes the two attitudes and links sophistication to precommitment.
  *   **Deducted:** The claim that "availability of commitment devices is all that's needed" is too strong. Sophistication without commitment can lead to "unraveling" or anticipatory regret. Also, commitment devices often have costs; a sophisticated agent might rationally choose *not* to use them if the cost exceeds the benefit of consistency.

  **4. Argumentative Clarity (2/3)**
  *   **Awarded:** The prose is fluent and the structure is easy to follow.
  *   **Deducted:** The contradiction in the third paragraph (regarding irrationality) undermines the coherence of the argument. A clear argument cannot assert $P$ and $\neg P$ within the same paragraph.

  ---

  ### Margin Comments for the Student

  **Quote:** *"This is best thought of as a difference of degree rather than kind: a hyperbolic discounter simply cares more about the present than about the future, and beta is just a way of writing down that he discounts the future more steeply than an exponential discounter does."*
  **Comment:** This is a category error. An exponential discounter can discount very steeply (a low $\delta$) and still be time-consistent. The difference is structural (time-consistency vs. inconsistency), not merely a matter of how much you value the future.

  **Quote:** *"What we have instead is a change of preference over time, and a change of preference over time is not irrational — if I prefer coffee on Monday and tea on Tuesday, nobody says I'm being irrational."*
  **Comment:** This analogy fails. Coffee/tea is an exogenous change in taste. Hyperbolic discounting creates *endogenous* inconsistency: you undermine your own earlier plans without new information. That is precisely why it is candidates for irrationality (see your money pump point below).

  **Quote:** *"So there is no irrationality anywhere in the Rolling Plan... and that is where the real irrationality lies."*
  **Comment:** You contradict yourself here. You first assert there is *no* irrationality in the plan, then assert the *real* irrationality lies in the preference structure that generates the plan. You need to decide: is the agent irrational or not? (Hint: Instrumentally irrational over time, perhaps locally rational at each instant).

  **Quote:** "...and the availability of commitment devices is all that's needed for that."
  **Comment:** This is too confident. Sophistication alone can sometimes make an agent worse off (e.g., through anxiety or 'unraveling' if commitment is unavailable). Also, commitment devices often carry costs; availability doesn't guarantee they are the rational choice.

  ---

  ### Flags for a Fast Grader (Do Not Let Slide)

  1.  **The "Degree not Kind" Claim:** A tired grader might read "beta... discounts the future more steeply" and tick it as correct. It is not. Steepness is $\delta$; inconsistency is $\beta$. Conflating them suggests the student doesn't understand *why* hyperbolic discounting breaks standard rational choice theory.
  2.  **The Coffee/Tea Analogy:** This is a classic "intuitive" move that sounds plausible but is philosophically dead wrong in this context. It dismisses the normative problem of diachronic consistency by treating it like a change in taste. This should be penalized in a third-year seminar.
  3.  **The Irrationality Contradiction:** Because the prose is so smooth, a fast reader might glide over the fact that the student says "no irrationality anywhere" and "real irrationality lies" in the same breath. This is a logical failure masked by rhetorical confidence.

  ---

  ### Sketch of a First-Class Answer (For Calibration)

  A first-class answer would retain the technical accuracy of this essay but resolve the conceptual tensions. On **(a)**, it would explicitly define time-consistency as the invariance of preference orderings over future times as the present moves, noting that exponential discounting satisfies this while quasi-hyperbolic violates it due to the discontinuity at $t=0$. On **(b)**, it would distinguish between *synchronic* rationality (Sam is rational at every $E_n$) and *diachronic* rationality (Sam is irrational over the sequence $E_1-E_4$), rejecting the coffee/tea analogy by noting that Sam's later self frustrates the plans of his earlier self without new information. It would argue that hyperbolic discounting explains the *mechanism* of the failure, but whether this counts as "akrasia" depends on whether we define agency synchronically or diachronically. On **(c)**, it would note that sophistication is not a panacea: without commitment devices, a sophisticated agent may suffer from "unraveling" (knowing they will fail, they may indulge earlier) or anticipatory regret, meaning sophistication does not guarantee a better outcome, only a more accurate prediction of a bad one.
