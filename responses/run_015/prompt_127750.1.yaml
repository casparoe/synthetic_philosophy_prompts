answer: |-
  Consider Patient K in a neurology ward undergoing experimental deep brain stimulation for chronic pain, where the intervention successfully uncouples the subjective hurtfulness of the pain from the motor-verbal pathways used to report it. The stimulation ensures that while nociceptive input triggers the phenomenal experience of pain, that experience itself is causally inert regarding speech, yet the nociceptive input simultaneously triggers both the inert qualia and the physical speech mechanisms via parallel neural pathways. When asked, "Does it hurt?" K consistently answers "Yes" precisely when the inert painful qualia are present, creating a scenario where accurate phenomenal judgment persists even though the experience itself exerts no causal influence on the judgment.

  On this setup, the epiphenomenalist argues that the judgments come out right because the physical brain state acts as a common cause. The nociceptive input causes the physical state that produces the verbal report, and it also causes the phenomenal experience, so the correlation between the report and the experience is perfect without the experience ever pushing the physical dominoes. The interactionist or physicalist opponent counters that this renders the accuracy of the judgment miraculous or coincidental; if the belief is caused entirely by physical states and not the experience itself, the belief is not properly sensitive to the truth of the experience, undermining the claim that the patient actually *knows* they are in pain. The feature doing the heavy lifting here is the stipulation of parallel pathways, which allows for a reliable correlation between event A (qualia) and event B (report) without a direct causal arrow from A to B.

  However, a defender of epiphenomenalism would likely attack this case by arguing that the intervention described is conceptually impossible or misdescribed. They might claim that if the patient is truly making a first-person judgment about the *phenomenal quality*, then by definition that quality must be playing a causal role in the judgment, meaning the stimulation hasn't actually made the qualia inert. Alternatively, they could argue that the patient isn't judging the qualia at all, but merely reacting to the physical brain state, which means the case fails to isolate phenomenal judgment and instead describes a blind physical reflex that merely mimics knowledge.
