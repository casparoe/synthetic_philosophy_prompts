  - cost_of_rejecting — what I lose elsewhere in the argument, or in the wider picture, if I drop it
  - confidence_0_100 — your confidence in that row's verdict

  Then a JSON object with exactly these fields:
  - rejected_step
  - flaw_type — one of: equivocation / quantifier_or_scope_shift / modal_slide / level_underdetermination / valid_argument_reject_a_premise / other
