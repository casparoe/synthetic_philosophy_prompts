      *   **Reconstructing France's Commitments:**
          *   *Risk Ontology:* Risk is *probabilistic* and *manageable*. Engineering controls risk.
          *   *Precaution:* Climate change is the primary catastrophe. Nuclear is a risk management tool against it.
          *   *Intergenerational:* Focus on the *atmospheric* legacy (CO2). We cannot leave an uninhabitable planet.
