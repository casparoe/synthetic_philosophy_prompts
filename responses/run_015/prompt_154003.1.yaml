      *   *Intergenerational Equity:* Germany focuses on waste burden (long-term radiological risk). France focuses on climate burden (long-term atmospheric risk).
      *   *Risk Depreciability:* Can risk be reduced over time via learning? Germany seems to say "No, the ontological risk remains." France says "Yes, engineering and regulation mitigate risk."
