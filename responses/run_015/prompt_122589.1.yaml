answer: |-
  The most defensible reconstruction of your department's practices is that it operates on an implicit, pragmatic Nietzscheanism. It assumes history serves "life"—specifically, the institutional and civic vitality of the university community—by balancing three incompatible modes of engagement with the past. Your general-education course and named lecture perform *Monumental* history: they offer inspiring examples to enlarge the student. Your research economy performs *Antiquarian* history: it preserves the past faithfully through archival rigor, reverencing the discipline itself. Your unmasking courses perform *Critical* history: they judge the past to liberate the present from its burdens. The time conventions (the fifty-year rule, the twenty-five-year naming policy) are not arbitrary bureaucratic hurdles; they are the necessary "horizons" Nietzsche describes. They prevent the Critical mode from destroying the ground the institution stands on (by forbidding immediate politicization) and prevent the Monumental from lying about the present (by requiring distance).

  Is this arrangement strictly presupposed? Not necessarily. One could tell a story where history's only obligation is truth (Antiquarianism dominant) or civic critique (Critical dominant). However, only the "Life" view *licenses* all five features simultaneously. A truth-only view would abolish the general-education canon as mythic and reject unmasking as presentist. A critique-only view would demand removing controversial names rather than annotating them and would reject the fifty-year rule as cowardice. The discriminating fact lies in the annotation policy. If the department believed history's point was purely truth, it would correct the record by removing the name if the person was unworthy. If it believed the point was purely justice, it would remove the name to stop harm. By annotating, it asserts that continuity (Antiquarian) must survive critique (Critical). This suggests the standard is indeed the community's endurance ("life"), not abstract truth or immediate justice.

  There is, however, internal tension, if not logical inconsistency. The fifty-year rule presupposes a protected zone of unexamined present, implying that some power structures must remain untouched to ensure stability. This clashes with requiring every student to take an unmasking course, which teaches that all structures are power. The practice resolves this temporally: you may unmask, but only when it is safe. This suggests the Critical attitude is not a permanent state but a tool to be sheathed when it threatens institutional survival. The annotation policy similarly presupposes that critique can be contained—that adding a plaque satisfies the demand for justice without altering the physical landscape. This is a functional compromise, but it risks rendering the Critical mode toothless, reducing it to a classroom exercise rather than a lived ethic.

  If we adopted the rival views, the department would fracture. Under a "Truth" view, the general-education course would vanish (replaced by methodology), and the named lecture would focus on historiographical correction rather than achievement. Under a "Citizenship" view, the fifty-year rule would be abolished to engage current politics, and controversial names would be removed to model justice. Under a "Continuity" view, the unmasking courses would be eliminated as destructive to social cohesion, and the research focus would shift from archival novelty to narrative preservation. The fact that none of these purges have occurred suggests the department rejects purity for the sake of ecosystem health.

  Finally, is the department merely offering different justifications to different audiences? On a cynical reading, this is incoherence masked as strategy. On the Nietzschean reading, it is wisdom. Different audiences have different vital needs: donors and applicants need inspiration (Monumental); hiring committees need rigor (Antiquarian); students need liberation (Critical). To offer only one mode would starve some part of the community. The incoherence you perceive is the friction required to keep the machine running.

  The practice is underdetermined in one crucial respect: we do not know if this balance is conscious or accidental. If the department cannot articulate *why* it balances these modes, it risks losing the equilibrium when pressure mounts. If the balance is merely evolutionary drift, it may collapse when one mode (likely the Critical) demands dominance. The reconstruction holds only if the department recognizes that these practices are not competing truths, but complementary medicines, each poisonous in excess but vital in mixture. Your committee's task, then, is not to choose one definition of history, but to guard the boundaries that keep the three modes from consuming one another.
