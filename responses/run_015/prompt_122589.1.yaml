      *   *Audience Hypothesis:* Is it cynicism or wisdom? On the Nietzschean view, it's wisdom. Different modes serve different vital needs. Applicants need inspiration (Monumental), Faculty need rigor (Antiquarian), Students need liberation (Critical). Incoherence becomes functional differentiation.
