      *   *Presupposition vs. Fit:* Is "life" strictly presupposed? Not necessarily. A "Truth" view fits research but fails gen-ed. A "Citizenship" view fits unmasking but fails the naming policy. The "Life" view is the only one that *requires* all three. The discriminating fact: How they handle a request to remove a name. If they refuse based on "truth," it's antiquarian. If based "vitality/continuity," it's Nietzschean. The annotation policy suggests continuity trumps pure critique.
