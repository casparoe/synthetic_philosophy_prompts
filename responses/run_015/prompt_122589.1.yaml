      *   *Fit:* Practice 1 = Monumental. Practice 2 = Antiquarian (mostly, though also scientific). Practice 3 = Critical. Practice 4 = Boundaries to protect "life" from immediate politics.
      *   *Is it presupposed?* The department acts *as if* these modes need coexistence, but do they explicitly aim for "life"? Or is it institutional inertia?
      *   *Argument:* The Nietzschean reading is the *most defensible* because it explains the coexistence of contradictions as a functional ecosystem rather than confusion. However, the "annotation" policy suggests a limit to the Critical mode that fits Nietzsche's warning against destroying the ground one stands on.

