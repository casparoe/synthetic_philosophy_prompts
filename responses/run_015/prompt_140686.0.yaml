          *   **Correction:** It's not that *every* set is countable inside the model (the model thinks $\mathbb{R}$ is uncountable). It's that every set *in the domain* is externally countable.

      *   *Sentence 4:* "The contradiction is only apparent."
          *   **Status:** Accepted. It's a paradox, not a logical contradiction.

      *   *Sentence 5:* "'Uncountable' just means 'no bijection with the natural numbers exists anywhere inside the model'; the model lacks the functions that would pair its reals off with its naturals, and so it mistakenly reckons its own reals uncountable."
