prompt: |-
  Hey, I'm teaching a grad seminar next term on conceptual issues at the end of life — not clinical ethics exactly, more philosophy of biology and legal ontology. We've been going in circles on brain death vs. circulatory death, which is fine, but I feel like the field is stuck rehashing the same 1980s arguments about whole-brain versus higher-brain criteria, and I want to figure out what actually deserves energy right now instead of just recieve more of the same papers.

  I'm trying to decide what open questions should be prioritized if you've got, say, a small research group with about three years, people who know philosophy of mind and some law but aren't medical doctors. One idea I've been playing with is whether death should be treated as a property of the organism, the person, or maybe even a relational status that depends on technological context — like, does sustained artificial perfusion or partial brain preservation change what death means? There's also this edge case I'm obsessed with: patients with isolated brainstem function but zero cortical integration, where the body breathes but there's no narrative continuity. Is that a kind of partial death, or just a confusion about personal identity? I don't know if that's a real conceptual opening or just a red herring.

  So rank the main unresolved lines — maybe the ontology of brain death, the legal framing of suspended animation, whether death should be indexed to biological or personal persistence, and whatever that relational-status idea amounts to — and defend the ordering. Which are upstream of the others? Which are tractable for philosophers without clinical training? And what result — a distinction, a framework, a revised criterion — would move one up or down? Please answer in British English; I spent a year at Cambridge and still default to 'grey' and 'favour', even though I'm writing this in American English with all the z's.
