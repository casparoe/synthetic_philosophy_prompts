answer: |-
  ### 1. Fix the Purpose

  You are right to narrow this. A philosophy of history cannot bargain a clause. If the deliverable is advice to a union federation on a specific technology in a specific sector (Fight / Negotiate / Welcome), the theory must be **tactical**, not teleological.

  It cannot merely explain why capitalism *eventually* crises; it must explain what *this* box does to *this* workforce *now*. This shifts the burden from "Is this historically progressive?" to "Does this increase or decrease our leverage?"

  **The Spec:** A Marxist account of automation is adequate if and only if it allows a labour organisation to map the **leverage points** created or destroyed by a specific technical change, distinguishing between technical constraints and managerial prerogatives, within a time horizon relevant to a bargaining cycle (1–5 years), while accounting for the reproduction of labour power over a career cycle (10–20 years).

  ### 2. The Desiderata (Sifted and Tagged)

  I have sorted your list. I rejected the demand that the theory explain recurring discourse panic (that is a job for cultural theory, not bargaining strategy) and the demand that forces of production never be the engine (if the machine breaks, it doesn't matter what the relations are).

  **1. The Separation Clause**
  *   **Requirement:** Distinguish machinery *as such* from machinery *under capitalist relations*, without the distinction becoming vacuous.
  *   **Case:** If you cannot conceive of the machine outside the wage relation, you cannot demand worker control of it; you can only demand its destruction. If the distinction is vacuous ("all tech is capital"), you surrender the productive forces to the bourgeoisie permanently.
  *   **Tag:** **LOAD-BEARING**. Without this, there is no socialist horizon, only sabotage.

  **2. The Dual-Movement Mechanism**
  *   **Requirement:** Generate both displacement and reinstatement from a single mechanism.
  *   **Case:** A theory that only predicts job loss cannot advise on retraining clauses. A theory that only predicts new tasks cannot advise on severance. The union needs to know the *turnover rate*, not just the net total.
  *   **Tag:** **LOAD-BEARING**. Essential for the "Negotiate" option.

  **3. The Control Override**
  *   **Requirement:** Handle automation introduced for control at a net productivity loss.
  *   **Case:** Management often accepts inefficiency to break solidarity or pace. If the theory assumes capital always maximises output, it will mispredict the introduction of surveillance or algorithmic pacing tools.
  *   **Tag:** **LOAD-BEARING**. Essential for the "Fight" option.

  **4. The Phantom Constraint**
  *   **Requirement:** Handle investment in the *announcement* of automation where the machine is partial or absent.
  *   **Case:** The threat disciplines labour even if the bot doesn't work. A theory tracking only realised value composition misses the primary disciplinary mechanism in the bargaining period.
  *   **Tag:** **LOAD-BEARING**. Essential for understanding management's bluffing power.

  **5. The Fictitious Machinery Test**
  *   **Requirement:** Distinguish actual automation from hidden human labour (e.g., AI trained by clickworkers).
  *   **Case:** If the theory counts "AI" as a rise in organic composition of capital when it is actually a shift to precarious gig labour, it miscalculates the leverage. The leverage lies with the hidden humans, not the code.
  *   **Tag:** **LOAD-BEARING**. Definitional integrity.

  **6. The Captive Time Account**
  *   **Requirement:** Count unpaid standby/on-call time as work, even if automated.
  *   **Case:** Automation often fragments the working day rather than shortening it. If the theory only tracks contracted hours, it will endorse a "shorter week" that actually increases availability.
  *   **Tag:** **LOAD-BEARING**. Essential for the "Welcome (with conditions)" option.

  **7. The Apprenticeship Cliff**
  *   **Requirement:** Represent the decay of tacit knowledge when entry-level tasks are automated.
  *   **Case:** A technology might be viable for 5 years but destroy the skill pipeline for 15. A union federation represents the future workforce, not just current members.
  *   **Tag:** **LOAD-BEARING** (with a note: this stretches the time horizon, but is necessary for inter-generational solidarity).

  **8. The Empirical Anchor**
  *   **Requirement:** Stay consistent with boring background facts (Solow paradox, aggregate employment stability, polarisation).
  *   **Case:** A theory predicting mass immediate unemployment is useless for bargaining; a theory predicting endless upskilling is a lie. It must fit the actual data of the last 40 years.
  *   **Tag:** **LOAD-BEARING**. Credibility constraint.

  **9. The Refused Machine**
  *   **Requirement:** Explain why capital sometimes rejects automation.
  *   **Case:** Useful for understanding why *this* tech is being pushed *now*, but less critical for deciding what to do once it *is* pushed.
  *   **Tag:** **NICE-TO-HAVE**. Contextual, not decision-critical.

  **10. The Global Shift**
  *   **Requirement:** Handle offshoring vs. reshoring dynamics.
  *   **Case:** Critical for a national federation, less so for a sectoral union deciding on a specific tool.
  *   **Tag:** **NICE-TO-HAVE**. Scale mismatch for the specific purpose.

  **11. The Discourse Cycle**
  *   **Requirement:** Explain recurring panic/enthusiasm without reducing it to "false consciousness."
  *   **Case:** This is STS gold, but for a union deciding on a contract clause, knowing *why* the hype exists matters less than knowing *if* the hype is material.
  *   **Tag:** **CAMP PREJUDICE**. (Specific to your dissertation's STS angle, not the union's decision spec).

  **12. Technology as Dispossession / Forces of Production**
  *   **Requirement:** (Your suspected prejudices).
  *   **Case:** Demanding every tech be a "fresh act of dispossession" forces a negative verdict prematurely. Demanding forces of production never drive the story ignores that some tech actually does reduce labour time regardless of relations.
  *   **Tag:** **CAMP PREJUDICE**. These are philosophical guardrails, not tactical tools. Drop them for this specific purpose.

  ### 3. The Incompatibility (The "Show Stopper")

  You hunch that the tension is between **Systemic Mechanism** (displacement/reinstatement) and **Local Decision** (one firm). You are close, but the contradiction is sharper.

  It is between **The Control Override (Req 3)** and **The Dual-Movement Mechanism (Req 2)**.

  **The Conflict:**
  *   **Req 2** demands a *technical/economic* mechanism: the machine changes the labour process, which displaces task A and creates task B. This implies a predictable relationship between the *specs of the machine* and the *outcome for labour*.
  *   **Req 3** demands a *political* mechanism: the machine is chosen to weaken labour, even if it creates *fewer* tasks or *lower* output. This implies the outcome is determined by *class struggle intensity*, not the machine's specs.

  **Why they cannot be jointly satisfied in a single predictive model:**
  If the Control Override is active, the technical specifications of the automation do not determine the labour outcome; the balance of power does.
  *   *Scenario:* A new algorithmic scheduler is introduced.
  *   *Mechanism View:* It optimises routes, displacing 10% of drivers, creating 2% of data jobs. (Predictable).
  *   *Control View:* It is introduced to break the informal break-taking culture. Management accepts the 10% inefficiency to achieve this. (Unpredictable without knowing the power balance).

  If you build a theory that accounts for the Control Override, you cannot generate a prediction about displacement/reinstatement *from the technology alone*. You need a variable for "Union Power." But if you need "Union Power" as an input variable, the theory is no longer a **theory of automation**; it is a **theory of class struggle** where automation is just a parameter.

  **The Consequence for your Spec:**
  You cannot give the union a theory that says "This machine *will* displace X workers." You can only give them a theory that says "This machine *allows* management to displace X workers *if* they can break resistance on clause Y."
  This breaks the "Advice on a Decision" purpose. The advice cannot be "Fight/Welcome" based on the tech. It must be "Fight/Welcome" based on your current organisational density. The theory of automation drops out of the decision loop, leaving only the theory of organisation.

  **Resolution:**
  To keep the spec coherent, you must downgrade **Req 2 (Dual-Movement)** from Load-Bearing to **Conditional**. The theory can describe the *potential* for displacement/reinstatement, but it must explicitly state that the *realisation* of that potential is indeterminate until the struggle occurs. You cannot have a predictive theory of automation that also takes capitalist irrationality (control over profit) as a core axiom. One must yield. For a union, **Control** must yield to **Power**, meaning the "theory of automation" is actually a "theory of managerial prerogative."

  ### 4. The Most Exclusionary Requirement

  **The Separation Clause (Req 1): Distinguish machinery as such from machinery under capitalist relations.**

  If you drop this, you let back in **Technological Determinism** (both Accelerationist and Luddite).
  *   *Without it:* The machine *is* capitalist command. Therefore, socialism requires de-automation (Luddism) or the machine will automatically lead to socialism because it makes work impossible (Accelerationism).
  *   *With it:* You can argue that the *same* machine could be used to reduce the working week under worker control. This is the only requirement that keeps the "Negotiate/Welcome" options open. If you drop this, the only rational union decision is always "Fight." Since your purpose includes "Negotiate" and "Welcome" as valid outputs, this requirement does the most work to keep the spec from collapsing into sectarianism.

  ### 5. Scorecard of Existing Readings

  **The Productivist Reading**
  *   *Verdict:* Fails **Req 1** and **Req 3**.
  *   *Why:* Treats automation as purely progressive development of forces. Cannot account for control motives or the distinction between tech and relation. Good for macro growth, useless for bargaining leverage.

  **The Labour-Process / Deskilling Reading**
  *   *Verdict:* Passes **Req 3**, fails **Req 2**.
  *   *Why:* Excellent on control and degradation. But tends to see only displacement/de-skilling, missing the reinstatement/complexity side. Predicts perpetual decline, which contradicts **Req 8** (boring facts).

  **The General Intellect / Immaterial Labour Reading**
  *   *Verdict:* Passes **Req 11** (Discourse), fails **Req 5** and **Req 6**.
  *   *Why:* Strong on the hype and the cognitive shift. Weak on distinguishing fictitious machinery (often treats platform labour as "automated" when it is hyper-exploited human labour). Misses the materiality of captive time.

  **The Convivial-Tools / Neo-Luddite Reading**
  *   *Verdict:* Passes **Req 1** (in a negative sense), fails **Req 8**.
  *   *Why:* Correctly identifies tech as political. But empirically inadequate regarding aggregate employment and wage growth. Advises "Fight" universally, rendering the "Negotiate" branch of your decision tree impossible.

  **Summary for your Chapter:**
  Your spec requires a hybrid that admits the *technical capacity* for liberation (Productivist) while insisting on the *political reality* of control (Labour-Process), without collapsing into a deterministic prediction. The tension you are feeling is the friction between the *potential* of the machine and the *reality* of the relation. Don't try to resolve it; map it as the site of the struggle.
