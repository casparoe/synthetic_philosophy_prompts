prompt: |-
  Hey — I'm mid-way through the third chapter of my diss (STS, on how automation gets narrated in two centuries of labour-movement writing) and I keep loosing the thread whenever I try to say what a Marxist account of automation would even have to *do* to count as adequate. Everyone reaches for the same two or three passages, then jumps straight to a verdict about AI, and I can't tell anymore whether the disagreements are about facts or about what the theory is for. So help me write the spec, not the verdict.

  Fix the purpose first, and fix it narrowly: I want a theory good enough to advise a union federation that has to decide, about one specific new technology in one specific sector, whether to fight its introduction, demand a shorter week alongside it, or welcome it. Not a philosophy of history — a theory for a decision. Under that purpose, give me the list of desiderata, each with the case or consideration that makes it a requirement, and each tagged load-bearing / nice-to-have / camp prejudice.

  Things I think are in the running as requirements, which you should sift rather than just ratify:

  - it has to distinguish machinery as such from machinery under capitalist relations, without that distinction becoming an excuse for saying nothing predictive;
  - it has to generate, from one mechanism, both the displacement of labour and the creation of new tasks that pull labour back in — i.e. the same story should be able to produce a shrinking and a growing demand for the same kind of worker;
  - it has to handle automation introduced primarily for control rather than productivity: the case where a machine is installed at a net output loss because it breaks a craft's grip on the pace and content of work;
  - it has to handle what I'd call the apprenticeship cliff: automation removes the low-level work through which a skill is transmitted, everything looks fine for a generation, and then the tacit knowledge needed to maintain and repair the system is simply gone and the productive force itself decays. Does a theory of automation need to be able to represent a productive force that deteriorates, or is that a separate story about education?
  - it has to handle phantom automation: capital is invested in the *credible announcement* of automation, workers concede on work rules and pay, and the machines partly or never arrive. Is a theory that only tracks materially realised automation adequate, given that the political effects occur anyway?
  - it has to handle captive time: automation frees ninety minutes a day, and the ninety minutes are reabsorbed as unpaid standby, on-call availability, and fragmented attention, so the time exists but isn't free. Can the theory count that as intensification, or does its notion of freed time only track the formally contracted day?
  - it has to handle the refused machine: a workforce, through its own organisation, demands that dangerous or humiliating labour be mechanised, and capital declines because the labour is cheaper than the machine. Whose instrument is automation meant to be here?
  - it has to handle fictitious machinery: the system presented as automating a task is, behind an interface, a crowd of underpaid people doing it. If the theory can't tell the difference, its concept of machinery isn't doing any work.
  - it has to say what would count as the emancipatory upshot — shorter working time, worker control over the design and pacing of the technology, or simply more goods — and take a stand on whose judgement settles it;
  - it has to stay consistent with the boring background facts: long-run real wage growth, no collapse in aggregate employment, occupational polarisation, long stretches where heavy investment in information technology produced disappointingly little measured productivity growth;
  - it has to handle the global dimension, where automation in one region throws a workforce in another into superfluity, or conversely makes offshoring unprofitable;
  - and it has to be able to say something about the *discourse* — why both enthusiasm and panic about automation recur on schedule — without that something collapsing into "they've been duped."

  Some of those I suspect are just things one sub-literature wants rather than genuine requirements. I'm thinking especially of the demand that any technology raised to the status of a productive force must also be describable as a fresh act of dispossession, and the demand that the forces of production never be allowed to be the engine of the story. If I've misidentified which ones are the prejudices, say which and why — that sorting is half of what I want.

  Then the part I care most about: name the subset of the load-bearing requirements that you think cannot be jointly satisfied, and show it. My own hunch is that there's a real incompatibility between "generate displacement and reinstatement from a single mechanism" and "be usable for a decision about one technology in one firm," because the first operates at the level of the system and the second at the level of a workplace, and I'm not convinced the bridge between them is licit. But if the actual contradiction is somewhere else, argue for that instead.

  Also: which single requirement does the most exclusionary work — the one that, if you dropped it, lets back in a reading you think is clearly inadequate? And if you want, a short scorecard at the end: a few lines each on the productivist reading (automation as the material preparation for something better), the labour-process and deskilling reading, the general-intellect and immaterial-labour reading, and the convivial-tools or neo-Luddite one. Only if it doesn't eat the space — the list is the deliverable, and no reading lists or citations, I've got the canon and I can't look anything up from where I'm sitting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing Chapter 3 of a dissertation (STS, Marxism, automation narratives in labour-movement writing).
      *   **Problem:** They keep losing the thread on what a *Marxist account of automation* needs to *do* to be adequate. Existing literature jumps to verdicts on AI without defining the theoretical spec.
      *   **Goal:** Define the *purpose* narrowly (advising a union federation on a specific tech/sector decision: fight, negotiate, or welcome). Generate a list of *desiderata* (requirements) based on the user's provided list, tagged by importance (load-bearing, nice-to-have, camp prejudice). Identify incompatibilities within the load-bearing set. Identify the most exclusionary requirement. Provide a brief scorecard of existing readings (optional but requested).
      *   **Constraints:** No citations, no reading lists (user has the canon). Focus on the *spec*, not the verdict. Be critical of the user's provided list (sift, don't just ratify).
      *   **Tone:** Academic, rigorous, precise, slightly conversational but dense (matching the user's voice).

  2.  **Deconstruct the Purpose:**
      *   *Purpose:* Advise a union federation on a specific decision (fight/negotiate/welcome) regarding one tech in one sector.
      *   *Implication:* The theory must be *actionable*, *localizable*, and *predictive* (in a limited sense). It cannot be purely a philosophy of history (macro-trends don't help a local bargaining unit decide on a specific algorithmic management tool). It must handle *power*, not just economics.

  3.  **Evaluate the User's Provided List (Sifting & Tagging):**
      *   *Machinery vs. Capitalist Relations:* Essential. If you can't separate the tech from the social relation, you can't imagine socialism with machines. -> **Load-bearing.**
      *   *Displacement & Reinstatement (Single Mechanism):* Crucial for prediction. If the theory only sees job loss, it misses reskilling/complexity. If it only sees new jobs, it misses displacement. -> **Load-bearing.**
      *   *Control vs. Productivity (Braverman/Edwards):* Essential for union strategy. If the machine is for control, "productivity gains" arguments are lies. -> **Load-bearing.**
      *   *Apprenticeship Cliff (Skill Reproduction):* This is about social reproduction of labour power. Vital for long-term union health, but maybe secondary for an *immediate* decision? Actually, if the tech kills the pipeline, the union dies in 10 years. -> **Load-bearing.**
      *   *Phantom Automation (Threat Effect):* Crucial. The *threat* disciplines labour even if the machine doesn't work. A theory ignoring this misses the political mechanism. -> **Load-bearing.**
      *   *Captive Time (Standby/On-call):* Essential for defining "working day." If automation creates unpaid labour, the "shorter week" demand needs to account for this. -> **Load-bearing.**
      *   *Refused Machine (Capital says no):* Important for understanding capital's logic, but less useful for a union deciding on a machine *being introduced*. It explains why automation *doesn't* happen. -> **Nice-to-have** (contextual, not decision-critical).
      *   *Fictitious Machinery (Mechanical Turk):* Essential definitionally. If you can't distinguish real automation from hidden labour, your category is useless. -> **Load-bearing.**
      *   *Emancipatory Upshot (Who decides?):* Vital. Is the goal leisure? Control? Wages? The union needs to know what victory looks like. -> **Load-bearing.**
      *   *Boring Background Facts (Solow Paradox, etc.):* A theory that contradicts empirical reality is useless. -> **Load-bearing.**
      *   *Global Dimension:* Hard to localize. A single union federation might not care about offshoring if they are protecting local jobs, but a *federation* might. Given the "specific sector" constraint, this might be too macro. -> **Nice-to-have** (contextual).
      *   *Discourse (Panic/Enthusiasm):* Important for STS, but does it help the *decision*? It helps understand the *pressure*, but not the *material outcome*. -> **Camp Prejudice** (specific to STS/Cultural Marxism, less to bargaining strategy).
      *   *User's Suspicions:* "Technology as dispossession" and "Forces of production not the engine."
          *   "Forces of production not the engine": If the purpose is a decision *now*, historical materialism's engine matters less than the immediate power dynamic. -> **Camp Prejudice** (Philosophical purity vs. tactical utility).
          *   "Technology as dispossession": This is often a tautology. -> **Camp Prejudice**.

  4.  **Identify Incompatibilities (The "Hard Part"):**
      *   The user suspects: *Systemic mechanism (displacement/reinstatement)* vs. *Local decision*.
      *   My analysis: The real tension is between *Predictive Stability* (Boring Background Facts) and *Political Contingency* (Control/Phantom Automation).
      *   Why? To advise a union, you need to predict the outcome of the tech. But if the outcome depends on *struggle* (control, phantom threats, refused machines), the theory can't predict the *tech's* effect independently of the *union's* power.
      *   Better Incompatibility: **The "Single Mechanism" requirement vs. The "Control/Productivity" requirement.**
          *   If the mechanism is technical (productivity), it generates displacement/reinstatement based on efficiency.
          *   If the mechanism is political (control), it generates displacement based on discipline, even at efficiency losses.
          *   You cannot derive *both* from a *single* mechanism without smuggling in a variable for "class struggle intensity." If you add that variable, the mechanism isn't doing the work; the struggle is.
      *   Another Incompatibility: **Local Decision vs. Global/Structural Facts.** A theory adequate for a specific firm decision cannot simultaneously account for global offshoring dynamics without becoming too abstract to be actionable. (I'll stick with the Mechanism/Control tension as it's more theoretical).
      *   *Wait, let's look closer at the User's hunch:* "Generate displacement/reinstatement from a single mechanism" vs "Usable for a decision."
      *   Actually, the strongest tension is between **"Boring Background Facts" (Aggregate stability)** and **"Displacement/Reinstatement" (Specific mechanism).**
      *   If the theory explains why aggregate employment doesn't collapse (compensation theory), it often fails to explain why *this* worker loses *this* job. A theory good for the federation (macro) might fail the shop steward (micro).
      *   *Decision:* I will argue the tension is between **Predictive Specificity** (needed for the decision) and **Structural Indeterminacy** (required by the Control/Phantom requirements). If the outcome depends on struggle (Control/Phantom), the theory cannot predict the *tech's* impact prior to the struggle. But the union needs to know the impact *to decide how to struggle*. This is a feedback loop, not a linear prediction.

  5.  **Identify the Most Exclusionary Requirement:**
      *   Which one kills the most "bad" theories?
      *   "Distinguish machinery from capitalist relations." This kills technological determinism (both utopian and dystopian).
      *   "Handle phantom automation." This kills pure economistic Marxism that only looks at value composition.
      *   *Winner:* **"Distinguish machinery as such from machinery under capitalist relations."** If you drop this, you can't distinguish between a socialist use of AI and a capitalist one. You collapse into Luddism or Accelerationism.

  6.  **Drafting the Scorecard:**
      *   Productivist: Good on forces, bad on relations.
      *   Labour-process: Good on control, bad on macro trends.
      *   General Intellect: Good on discourse, bad on material leverage.
      *   Convivial/Neo-Luddite: Good on ethics, bad on feasibility.

  7.  **Refining the Output:**
      *   Structure:
          1.  Fix the Purpose (Validate and sharpen).
          2.  The Spec (The List with Tags and Justifications).
          3.  The Incompatibility (The "Show Stopper").
          4.  The Exclusionary Requirement.
          5.  The Scorecard.
      *   Tone Check: Keep it tight. No fluff. Use the user's terminology ("load-bearing," "camp prejudice").
      *   Self-Correction on Incompatibility: The user's hunch is strong. I should validate it but refine it. The tension is between *functional explanation* (what the machine does) and *relational explanation* (what the machine is for). A single mechanism can't do both because "what it is for" changes the function. I will frame this as the **Function/Relation Tension**.

  8.  **Final Polish:** Check against constraints. No citations. No reading lists. Focus on the spec. Ensure the "Union Federation" constraint is central.

  *(Self-Correction during drafting)*: I need to be careful with the "Apprenticeship Cliff." Is that load-bearing for a *decision*? If the union is deciding whether to fight introduction *now*, the cliff is 10 years away. However, if the theory can't account for it, it can't advise on "demand a shorter week alongside it" because the skill base might vanish. I'll keep it load-bearing but note the time-horizon tension.

  *(Refining the Incompatibility)*: The user suspects "Single Mechanism" vs "Local Decision." I think the deeper issue is "Predictive Capacity" vs "Political Contingency." If the theory admits that *control* motives override *productivity* motives, then the technical specs of the machine don't predict the outcome. The outcome depends on the balance of power. So the theory can't advise *based on the tech*; it must advise *based on the power*. This undermines the prompt's premise of a "theory of automation." It becomes a "theory of class struggle using automation as a variable." I will highlight this.

