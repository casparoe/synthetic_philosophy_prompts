answer: |-
  You have spotted a very real and frustrating dynamic that often goes unnamed in casual discussion though it has roots in formal philosophy of science. In the strict Popperian sense this is often grouped under ad hoc rescue or immunizing stratagem where a theory is modified to escape falsification without increasing its predictive power. However you are right that those terms feel too broad for the specific evolutionary psychology maneuver you described where the mechanism shifts between being narrowly tuned or broadly misfiring depending on the data. Because there is not a single universally recognized label specifically for this evolutionary version of the problem I am happy to propose a term that captures the specific edges you are looking for and we can call it adaptive retrofitting.

  The reason this coined term fits better than the general philosophical labels is that it highlights the specific construction work being done after the fact. Adaptive retrofitting counts as occurring when the explanation of the mechanism's scope or function is altered solely to accommodate the new data point without any independent evidence for that alteration. For example if a theory claims a fear module exists and people show fear the theory is confirmed but if people show no fear the theory claims the module is mismatched to the modern environment and if people show fear again later the theory claims the module is actually broad enough to cover screens then you are witnessing retrofitting. The edge of what counts is determined by whether the modification generates new testable predictions or merely explains away the anomaly. If the change in explanation allows you to predict a future outcome that you could not have predicted before then it is legitimate theory refinement but if it only serves to make the past data fit then it is retrofitting.

  This is distinct from simply adding a normal exception or acknowledging that the environment has changed because legitimate science requires evidence for the exception itself rather than just positing it to save the hypothesis. In a robust theory the claim that the environment has changed must be supported by data about the environment independent of the behavioral data being explained. For instance if you argue that online interactions are different you need independent psychological or sociological evidence that screens alter threat perception specifically not just the observation that people behave differently online. The key difference lies in the direction of the support where normal science uses independent facts to constrain the theory whereas adaptive retrofitting uses the theory to absorb any fact regardless of independent verification.

  Ultimately the problem you are noticing is that the theory becomes a sponge that absorbs contradictions rather than a structure that risks being broken by them. By naming it adaptive retrofitting we can point to the specific moment when the explanation shifts from predictive to protective. It allows us to ask whether the new constraint on the theory was discovered or invented. I hope this distinction helps you articulate the pattern more clearly in future discussions because having a specific label for it makes it much easier to identify when the goalposts are being moved under the guise of nuance.
