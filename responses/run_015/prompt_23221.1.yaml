answer: |-
  It is a pleasure to address a colleague from the sciences. The transition from physics to metaphysics often involves a shift from modeling empirical regularities to modeling the conceptual preconditions of those regularities. Your request to avoid the superficial "denies vs. affirms" distinction is well-founded; that distinction is merely the symptom, not the diagnosis.

  To understand the divide between Counterpart Theory (CT), championed by David Lewis, and the Doctrine of Transworld Identity (TWI), associated with Saul Kripke and Alvin Plantinga, we must look at the underlying "manifold" on which these theories operate.

  Here is the comparison structured around your three specific points, followed by the convergence.

  ### 1. The Ontology of Worlds: Concrete Multiverse vs. Abstract State Space

  The disagreement about identity is secondary to a primary disagreement about the nature of the "space" in which modality occurs.

  **Transworld Identity (TWI): The Abstract State Space**
  For the TWI proponent (like Kripke), possible worlds are not concrete places you could travel to. They are abstract entities: maximal consistent sets of propositions, states of affairs, or properties.
  *   **The Analogy:** Think of a phase space in classical mechanics. The phase space represents all possible configurations of a system. The system itself (the particle) is distinct from the space. We can point to a coordinate in the phase space and say, "In this configuration, the particle has position $X$." The particle is not *made of* the phase space; the phase space describes the particle.
  *   **Impact on Identity:** Because worlds are abstract descriptions, the object itself (the "substance" or "haecceity") is logically prior to the world. We identify the object first (via rigid designation), and then we stipulate which worlds contain it. Identity is an invariant property of the object that persists across different abstract descriptions. The object is the "invariant" under the transformation of world-states.

  **Counterpart Theory (CT): The Concrete Multiverse**
  For Lewis, possible worlds are concrete, spatiotemporally isolated universes. They are just as real as the actual world, but causally disconnected.
  *   **The Analogy:** Think of the Many-Worlds Interpretation (MWI) of quantum mechanics, but without the branching from a single origin. For Lewis, every logically consistent way a world could be *is* a physical reality somewhere in logical space.
  *   **Impact on Identity:** If worlds are concrete and spatiotemporally isolated, nothing can be in two worlds at once, just as nothing can be in two places at once in our world. Lewis adheres to a strict mereology: an object is the sum of its spatiotemporal parts. Since no spatiotemporal part can exist in two isolated spacetimes, no object can exist in two worlds.
  *   **Why it matters:** For TWI, cross-world identity is primitive. For CT, it is impossible. Therefore, CT must replace identity with a **counterpart relation** based on similarity. When we say "I could have been a physicist," TWI says *you* are in that world doing physics. CT says a *counterpart* of you (a distinct individual who resembles you closely) is in that world doing physics.

  **The Philosophical Work:** This ontological difference dictates the logic. TWI allows you to treat modal properties as intrinsic to the object (like mass or charge). CT treats modal properties as extrinsic relations between distinct concrete objects across the multiverse.

  ### 2. Contingent Existence: "I Might Not Have Existed"

  You noted that "could have been otherwise" is easier to grasp than "could have failed to exist." This is because the former implies a subject undergoing variation, while the latter implies the absence of the subject. This is where the scoping of variables becomes critical.

  **Transworld Identity (TWI)**
  *   **The Mechanism:** TWI handles this by separating *existence* from *identity*. An object has an identity (a haecceity) that can be referred to even in worlds where it does not exist.
  *   **The Analysis:** The proposition "I might not have existed" is true because there is a possible world $W$ such that the proposition "I exist" is false in $W$.
  *   **The Difficulty:** As you sensed, this requires a form of "existential inertia." How can *I* be the subject of a fact about a world where *I* am not there? Kripke answers this by arguing that we stipulate the world *about* the actual object. We fix the reference in the actual world and then look at other abstract states of affairs to see if that referent is included. The object has a kind of metaphysical traction that reaches into worlds where it has no ontological footprint.

  **Counterpart Theory (CT)**
  *   **The Mechanism:** Lewis finds the TWI approach mystifying. For Lewis, to exist is to exist-in-a-world. There is no "you" floating above the multiverse.
  *   **The Analysis:** How does CT analyze "I might not have existed"? It does not say there is a world where *you* don't exist (since you are world-bound). It says: **There is a possible world $W$ such that no counterpart of you exists in $W$.**
  *   **The Resolution:** This shifts the modal burden. In TWI, the modality attaches to the object's existence. In CT, the modality attaches to the *distribution of counterparts*.
  *   **Why this might appeal to a physicist:** CT avoids the "ghostly subject" problem. It treats existence strictly locally. The statement "I might not have existed" is not about *me* having a property of non-existence elsewhere; it is about the actual world's relation to other concrete universes where the causal chain producing me never occurred. It treats "existence" not as a predicate of the individual, but as a quantifier over the multiverse.

  ### 3. Non-Transitivity: Defect or Feature?

  This is the most technical point. Identity is an equivalence relation: it is reflexive, symmetric, and **transitive**. If $A=B$ and $B=C$, then $A=C$. The counterpart relation is based on similarity, and similarity is notoriously non-transitive (the Sorites paradox). If $A$ is similar to $B$, and $B$ is similar to $C$, $A$ is not necessarily similar to $C$.

  If CT uses a non-transitive relation to do the work of identity, isn't it just a broken version of identity? Lewis argues **no**, and his reasoning solves a major paradox that TWI struggles with.

  **The Problem: Chisholm's Paradox**
  Imagine a person, Adam.
  1.  Adam could have been born one day later ($A \to B$).
  2.  That person ($B$) could have been born one day later ($B \to C$).
  3.  Repeat this 10,000 times.
  At the end of the chain, we have a person $Z$ born 10,000 days later, with different genetic material, different parents, perhaps a different species.
  *   **TWI Dilemma:** If identity is transitive across worlds, then $A=Z$. But $A$ and $Z$ share no essential properties. This forces the TWI theorist to posit a "bare particular" or haecceity that holds them together despite total qualitative difference. This smells of mysticism to a scientific mind.
  *   **Lewis's Solution:** Lewis accepts that $A$ has a counterpart $B$, and $B$ has a counterpart $C$, but denies that $A$ has a counterpart $Z$.
  *   **Why it's not a defect:** Lewis argues that the counterpart relation is not *trying* to be identity. It is trying to analyze **modal truth conditions**.
      *   Identity is strict logic.
      *   Modality is vague semantics.
      *   By making the counterpart relation non-transitive, Lewis preserves the **Indiscernibility of Identicals** within a world (strict logic) while allowing for vagueness across worlds (semantic flexibility).
  *   **What it accomplishes:** It allows us to say "Adam could have been slightly different" without committing to "Adam could have been completely different." It creates a "modal horizon." You can move a certain distance from actuality before the link breaks. This matches our intuition that there are limits to how much something can change and still be *that* thing, without requiring us to identify exactly where the limit lies (which would be arbitrary).

  For a physicist, think of this like **renormalization group flow**. At the local scale (within a world), the laws are exact and symmetries hold (identity is transitive). At the macro scale (across the multiverse), we are dealing with effective descriptions where strict symmetry breaks down, but the effective theory (Counterpart Theory) still yields correct predictions for observable modal claims.

  ### 4. Convergence: Where the Disagreement Dissolves

  It is vital not to overstate the rift. In terms of "saving the phenomena" (our ordinary modal judgments), CT and TWI are often allies.

  1.  **Validation of Modal Logic:** Both agree that possible world semantics is the correct tool for analyzing modal logic (S5, etc.). They both reject modal skepticism. They agree that "Necessarily $P$" means "$P$ is true in all possible worlds."
  2.  **Actualism vs. Realism:** While Lewis is a Modal Realist (worlds are concrete), many TWI proponents are Actualists (only the actual world is concrete). However, functionally, they both treat non-actual worlds as legitimate truth-makers for modal claims.
  3.  **Truth Conditions:** For almost all ordinary sentences ("I could have worn a blue shirt"), CT and TWI yield the same truth value. The disagreement is rarely about *whether* a claim is true, but *in virtue of what* it is true.
  4.  **The Status of the Actual:** Both agree that "actual" is indexical in a sense. For Lewis, "actual" just means "this world" (like "here"). For Kripke, "actual" is fixed by our perspective, but the other worlds are no less real as abstracta. Both deny that the actual world is metaphysically unique in its *nature*, only in our *relation* to it.

  ### Summary for the Physicist

  *   **TWI** treats the individual as an invariant trajectory through an abstract state space. Existence is a property of the trajectory at specific coordinates. Identity is transitive because the trajectory is continuous.
  *   **CT** treats the individual as a localized excitation in one specific concrete universe. "Modality" is a comparison between distinct excitations in distinct universes. Identity is local; similarity is global.
  *   **Contingent Existence:** TWI says the trajectory stops in some regions. CT says there are regions where no similar excitation occurs.
  *   **Non-Transitivity:** In CT, this is not a bug; it is a cutoff parameter that prevents the "drift" of identity over long modal distances, preserving the strictness of logic within the local frame.

  Lewis's system is more ontologically extravagant (infinite concrete worlds) but logically cleaner (no bare particulars, no transworld identity puzzles). Kripke's system is ontologically parsimonious (abstract worlds) but metaphysically heavier (haecceities, transworld identity). Which you prefer may depend on whether you favor expanding the ontology to save the logic (Lewis) or expanding the logic to save the ontology (Kripke).
