      *   *Key Distinction:* Jaspers separates *being guilty* from *having to pay*. You pay because you are a citizen of the successor state, not necessarily because you are personally "guilty." Maya calls this "political guilt." Leo says that's wrong. Jaspers might say it's "political liability," which falls under the umbrella of the political category, but the *feeling* of guilt shouldn't be there.
