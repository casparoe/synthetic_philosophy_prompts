prompt: |-
  You are a senior researcher in algorithmic fairness — someone equally at home with the impossibility literature (the independence / separation / sufficiency trichotomy, calibration-within-groups, equalized error rates, demographic parity, and the degenerate conditions under which pairs of these can be jointly satisfied) and with the compliance-and-audit culture that has grown up around it. Please think carefully before drafting, and work in the deadpan register of real vendor documentation: no winking, no scare quotes around *fairness*, no punchline that announces itself.

  I'm a PhD student writing a paper on how the fairness impossibility results get operationalized in practice, and I want a piece of satire to open a talk with. The target is not the theorems — those should be stated correctly, since a FAccT audience will be reading — but the practice of metric-shopping and compliance theater: the way a dashboard, a procurement checklist, or a release note can convert an impossibility into a configuration option.

  The piece: **release notes and an FAQ for version 5.0 of a commercial fairness-compliance SDK ("FairStack 5.0")**, sold by a fictional vendor to a lender, a pretrial-services agency, and a hospital readmission-triage team. The satire should exaggerate real features of the situation rather than invented ones. Two in particular I'd like you to build on:

  1. The impossibility results are conditional on a fixed target variable and unequal base rates. So give the SDK a **Base-Rate Reconciliation Layer**: an optional module that attains calibration-within-groups *and* equalized false-positive and false-negative rates at once by adjusting, per group, the definition of the outcome whose prevalence is being equalized (the observation window, the threshold at which an event counts, the source of the label). Let the engineering notes be entirely straightforward about this, and let the reductio land on its own: the score no longer means the same thing across groups, and cross-group comparison is quietly listed as unsupported in this release.
  2. Fairness criteria are licensed in pairs, with the triad available only to customers who can certify one of the two degenerate escape conditions. Price it accordingly.

  Other items should draw on the real escape hatches and pathologies: parity achieved by leveling down (or by adding randomization that helps nobody), fairness through unawareness with the protected attribute reconstructed from proxies, incompatibility flattened into a single weighted "Fairness Score," and subgroup certificates issued only for subgroups named in advance.

  Constraints: every metric value you quote must be one the theorems actually permit; the narrator must never state a falsehood about the mathematics, only about its significance. It should be recognizable to a fairness researcher and still funny to a first-year graduate student.

  Please structure the response as follows:

  - **Brainstorming (100–150 words):** ten candidate changelog items, with a one-line note on which real feature each exaggerates, and which ones you are discarding as unfair or merely confused.
  - **Release notes (650–800 words):** versioned entries in the voice of a well-written enterprise changelog — summary, new features, known limitations, migration notes.
  - **FAQ (300–400 words):** six to eight questions a procurement officer or an auditor would genuinely ask, answered in the vendor's voice.
  - **Commentary (200–250 words):** which real feature or argument each retained item targets, and why you think the satire is fair rather than a strawman.
