  3. "The dead-hand and democratic legitimacy problem" (~2 paragraphs) — why locking in rules might be unfair or illegitimate now that one person is suffering.
  4. "Bottom line — what should actually happen" (~1 paragraph) — give your call, even if its messy. dont just say "talk to your roommates"; take the theory seriously.
