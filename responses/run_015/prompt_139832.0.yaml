answer: |-
  **Project Title:** Absolute vs. Comparative Weighting: Re-evaluating the Prioritarian Escape from Levelling-Down

  **Research Question**
  Does the prioritarian escape from the levelling-down objection depend essentially on the priority weight being a function of absolute welfare rather than relative standing? Specifically: In fixed-population cases, can a prioritarian view that assigns weights based on relative rank or welfare share recommend a policy that makes some worse off while making no one better off?

  **Background and Gap**
  The standard defense of prioritarianism rests on its immunity to the levelling-down objection (LDO). Unlike egalitarianism, which values equality for its own sake, prioritarianism values benefiting people more the worse off they are. On the received view, the priority weight is a strictly increasing, concave function of *absolute* welfare. Consequently, reducing the welfare of the better-off (leveling down) always reduces the weighted sum, preserving the intuition that such a move is never all-things-considered right.

  However, this immunity assumes a specific metaphysics of the priority weight. It assumes the weight attaches to absolute levels. If the weight instead tracks comparative facts—such as a person's rank in the welfare distribution, their share of total welfare, or their distance from the mean—the arithmetic changes. In such "Relative Prioritarianism," lowering the better-off can alter the relative standing of the worse-off without changing the worse-off's absolute welfare. If this shift increases the weight assigned to the worse-off sufficiently, the total weighted value could rise despite the welfare loss.

  Current literature treats prioritarianism and egalitarianism as distinct camps, with the LDO as the boundary marker. This leaves open whether the boundary is actually between *Absolute* and *Comparative* weighting functions. If Relative Prioritarianism succumbs to the LDO, the standard defense of prioritarianism is unstable: it holds only for the Absolute variant, which may be less theoretically motivated than defenders assume. This project isolates this fault line without recourse to variable-population cases, focusing strictly on fixed-population distribution.

  **Methodology (Nine Months)**
  *Months 1–2: Formalization.* I will define three distinct weight functions: Absolute (standard), Rank-Based (ordinal), and Share-Based (proportional). I will establish the formal conditions under which a weighted sum increases while total welfare decreases.
  *Months 3–4: Case Construction.* I will construct minimal fixed-population cases (two and three persons) involving risk and certainty. I will test whether Level-Down moves increase the weighted sum under Rank-Based and Share-Based functions. I will distinguish Ex-Ante (weights applied to prospects) and Ex-Post (weights applied to outcomes) applications.
  *Months 5–6: Stress-Testing.* I will subject these cases to standard prioritarian replies. Does the view collapse into egalitarianism? Is the weight function separable? I will refine the definitions to ensure the view remains distinctively prioritarian (i.e., still concerned with weighted welfare, not equality per se).
  *Months 7–8: Drafting.* I will write the 9,000-word paper, structuring the argument around the formal results from Months 1–4.
  *Month 9: Revision.* I will finalize the text, ensuring the distinction between "Levelling-Down" and "Efficiency Loss" is precise.

  **Range of Conclusions**
  1.  **Strong:** Relative Prioritarianism recommends levelling-down in specific fixed-population cases. The prioritarian escape is not a feature of the view's structure but an artifact of the Absolute assumption.
  2.  **Moderate:** Relative Prioritarianism avoids levelling-down but violates other core prioritarian constraints (e.g., separability), suggesting the Absolute assumption is necessary for the view's coherence.
  3.  **Deflationary:** The cases where Relative Prioritarianism recommends levelling-down are indistinguishable from egalitarian recommendations. The fault line remains Prioritarianism vs. Egalitarianism, not Absolute vs. Comparative.

  The deciding factor will be whether the weight increase for the worse-off in the Level-Down scenario is driven by their *absolute* plight (which hasn't changed) or their *comparative* plight (which has). If the latter drives the recommendation, the LDO applies.

  **Failure Conditions**
  The project fails if:
  1.  **Conceptual Collapse:** It turns out that "Relative Prioritarianism" is merely egalitarianism described in different mathematical language. If the weight function tracks relative gaps, the view may lack the distinctively prioritarian focus on absolute gains.
  2.  **Misidentified Objection:** The cases constructed are not genuine LDO cases. The LDO requires that the move makes some worse off and no one better off *in terms of welfare*. If the change in relative standing counts as a "benefit" within the theory's metric, then the move is not leveling-down but leveling-up for the bottom (in relative terms). If I cannot show that the theory recommends the move *despite* it being a welfare loss with no welfare gain, the objection fails.
  3.  **Triviality:** The conditions under which Relative Prioritarianism recommends levelling-down are so pathological (e.g., requiring specific discontinuities in the weight function) that they do not threaten the core view.

  **Epistemic Key**

  | Claim | Status |
  | :--- | :--- |
  | Standard prioritarianism escapes the LDO via absolute weighting. | **Settled** (Standard consensus in normative ethics) |
  | Prioritarianism is distinct from egalitarianism. | **Contested** (Some argue they converge in practice) |
  | Priority weights *can* be coherently defined by relative rank/share. | **My Conjecture** (Requires formal proof of coherence) |
  | Relative Prioritarianism can recommend welfare destruction. | **My Conjecture** (The core hypothesis to be tested) |
  | The LDO applies if weights shift due to relative changes alone. | **Contested** (Depends on definition of "benefit") |

  **Most Likely Wrong Step:**
  The claim that **Relative Prioritarianism is a distinct view from Egalitarianism.** It is highly probable that once weights are made functions of relative standing, the view loses its "prioritarian" character and becomes a form of weighted egalitarianism. If this is true, the project demonstrates a linguistic ambiguity rather than a structural vulnerability in prioritarianism proper. I will mitigate this by strictly defining prioritarianism as any view maximizing a weighted sum of welfare, regardless of the weight's input, but this definition itself may be contested.
