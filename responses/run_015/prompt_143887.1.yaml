  *(Self-Correction during final output generation)*: I need to make sure I don't just list them but explain *why* a specific reading fails to support the opponent's conclusion, especially the materialist one. That's the strongest philosophical counter-move.

  Let's organize the menu by the *type* of claim being made (Semantic, Ontological, Causal, Normative).

  *   **T1: Semantic Stipulation.** (Trivial)
