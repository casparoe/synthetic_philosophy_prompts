      *Refining Thesis 2 (The Materialist Trap):* This is crucial. If the student says "Harm is physical," a philosopher says "Fear is a physical state." So the student must mean "Harm is *macroscopic* physical damage." I need to make that distinction clear. Let's call it "Macro-Physicalism."

      *Refining Thesis 4 (The Normative Claim):* This is likely the "Real Harm" claim. "Real" = "Morally Compensable."

  8.  **Final Review against Constraints:**
