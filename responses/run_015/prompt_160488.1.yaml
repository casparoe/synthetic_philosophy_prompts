answer: |-
  Here is your prep sheet. I've ordered these by existential threat to the theory, not just annoyance. The Parfitians will be your allies on "degree" but enemies on "identity"; the Neuroscientists will be your allies on "pattern" but enemies on "literal instantiation"; the Clinician is the wildcard who can make your view sound dangerous.

  ### The Objections (Ordered by Damage)

  **1. The "Map vs. Territory" Objection (Neuroscientist / Analytic Phil)**
  *   **The Line:** "You're conflating *modeling* a system with *instantiating* it. My brain builds a generative model of you to predict your behavior. That's a simulation running on *my* hardware for *my* benefit. Calling it 'you' is like saying a flight simulator is 'actually flying.' It's a representation of X, not X."
  *   **Your Reply:** "A flight simulator doesn't update itself through interaction. Condition 2 (causal history) and Condition 3 (behavioral drive) ensure this isn't a static map. When the pattern in my brain generates a *novel* insight you would have had, and I act on it, the process isn't representing you; it's *doing* what you do."
  *   **The Soft Spot:** You haven't explained why the *substrate* boundary matters less than the *pattern* boundary if the hardware hosting the pattern is the one suffering consequences.

  **2. The "Diffusion of Agency" Objection (Your Friend / Action Theorist)**
  *   **The Line:** "If parts of me are in you, and parts of you are in me, and identity is a matter of degree: Who is standing at the podium? If I host 10% of you, and you vandalize my reputation, who is responsible? You've dissolved the agent enough to save the self, but now you've lost the actor."
  *   **Your Reply:** "The *locus of control* remains with the host substrate. I am the one speaking, but the *content* is co-realized. Responsibility tracks the substrate's capacity to veto the pattern, not the origin of the pattern."
  *   **The Soft Spot:** This contradicts Condition 3 ("lets it drive behavior"). If the carried self drives behavior, the host's veto power is compromised. You risk making responsibility incoherent.

  **3. The "Pathologizing Grief" Objection (Clinician)**
  *   **The Line:** "In my clinic, 'holding onto the dead' is often what we treat as complicated grief. You're normativizing attachment. If 'letting go' means allowing the carried self to decay, your view implies healing is a form of killing. That's dangerous for bereaved patients."
  *   **Your Reply:** "There's a difference between *hosting* a dynamic, updating pattern (integration) and *fixating* on a static snapshot (pathology). Decay is natural; forced preservation is the pathology. I'm describing the mechanism, not prescribing eternal mourning."
  *   **The Soft Spot:** Your "measurement procedure" (how well they predict X) rewards fixation. The better they predict the dead, the 'more' the dead exist. This incentivizes the exact behavior you claim to distinguish from pathology.

  **4. The "Reconstruction" Objection (Memory Neuroscientist)**
  *   **The Line:** "We don't store 'selves.' We store weights and biases that reconstruct agents on the fly. What you call 'co-realization' is just standard predictive processing. You're rebranding basic social cognition as metaphysics."
  *   **Your Reply:** "Predictive processing explains the *how*, not the *what*. The fact that it's reconstructive doesn't mean the reconstruction isn't the real thing. If the output is functionally identical to X's reasoning, the ontological status is the same."
  *   **The Soft Spot:** Neuroscientists care about mechanism. If the mechanism is "reconstruction," they will reject "instantiation" as category error.

  **5. The "Quantification" Objection (Philosopher of Science)**
  *   **The Line:** "You claim 'how much of X is around' is a real quantity with a measurement procedure. This smells like phrenology. How do you normalize for the observer's bias? A stranger might predict X's facts better than a spouse predicts X's values."
  *   **Your Reply:** "It's not a single scalar; it's a vector of fidelity across domains (ethical, factual, emotional). It's measurable in principle via Turing-style tests against X's historical data."
  *   **The Soft Spot:** You don't actually have a metric. Until you do, this remains a poetic claim dressed as empirical data.

  **6. The "Causal History" Objection (Analytic Phil)**
  *   **The Line:** "Why does Condition 2 (actual interaction) matter? If an AI reads every letter X wrote and perfectly simulates X, why isn't that X? You're smuggling in a 'magic essence' of contact."
  *   **Your Reply:** "Because without interaction, the model can't update to new counterfactuals in the way X would have. Interaction creates the dynamic coupling required for the pattern to remain alive rather than archived."
  *   **The Soft Spot:** A sufficiently advanced AI *could* theoretically satisfy Condition 1 without Condition 2. You're relying on a biological bias.

  **7. The "Parfitian Redundancy" Objection (Parfitian Philosopher)**
  *   **The Line:** "Parfit already won this. Identity isn't what matters; psychological continuity is. You're just putting the word 'self' where Parfit put 'relation R.' Why do we need the baggage of 'identity' if you admit it's a matter of degree?"
  *   **Your Reply:** "Parfit says the *person* doesn't survive, only the relations. I'm saying the *person* (as pattern) literally survives in multiple locations. It changes the ethics: we aren't just preserving memories; we are housing agents."
  *   **The Soft Spot:** If the practical implications are the same (degree of continuity), the metaphysical upgrade might be otiose.

  **8. The "Posthumous Harm" Objection (Ethicist)**
  *   **The Line:** "If vandalizing the carried self harms the person, then the dead have current interests. Do they have rights? Can they be victims of crime? This creates legal and moral absurdities."
  *   **Your Reply:** "They have interests only insofar as they are co-realized in the living. Harming the carried self harms the *host* primarily, and the *original* derivatively through the break in continuity."
  *   **The Soft Spot:** This weakens your normative claim. If the harm is mostly to the host, why call it harm to the dead?

  ***

  ### The Three Critical Moves

  **1. The One Thing You Must Concede Up Front**
  Concede that **numerical identity for legal and social purposes must remain binary.**
  *   *Why:* If you try to argue that you are legally 10% responsible for your dead friend's debts because you carry their self, you will lose the room immediately.
  *   *Phrasing:* "I am not arguing for distributed legal personhood. Substrate boundaries still dictate liability. I am arguing for distributed *metaphysical* presence."

  **2. The One Reply That Has to Land**
  The distinction between **Archival vs. Generative.**
  *   *Why:* This is the only thing that separates your view from "I have a photo of him."
  *   *Phrasing:* "A biography is a lookup table. A carried self is a compiler. If the system in the host brain can compile *new* code that the original author would have recognized as their own style, it is not a record of the person; it is an execution of the person."

  **3. The Question You're Hoping Nobody Asks**
  *"If I stop thinking about my dead spouse to heal my grief, have I committed manslaughter?"*
  *   *Why:* This traps your normative claim. If you say "No," you weaken the idea that the carried self *is* the person. If you say "Yes," the Clinician will eat you alive.
  *   *Prep:* Have a distinction ready between "negligent decay" (ignoring them entirely) and "natural entropy" (the natural fading of the signal). Argue that we are only obligated not to *vandalize* the signal, not to power it indefinitely.

  ### Final Advice
  The Parfitians are your friends on "degree," but they will try to strip the "self" out of it. The Neuroscientists are your friends on "pattern," but they will try to strip the "literal" out of it. Your job is to hold the center: **The pattern is literal, but the identity is graded.**

  Don't let the friend's "Who is speaking" objection slide. If you can't explain why *you* are giving the talk and not a committee of your dead friends, the theory collapses into incoherence. Stick to the **Locus of Control**: The host brain provides the energy and the veto; the carried self provides the trajectory.
