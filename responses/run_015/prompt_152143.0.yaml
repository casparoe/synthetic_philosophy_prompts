answer: |-
  # Activity: The Blocked Cure (An Anticommons Simulation)

  **Objective:** Students will experience how fragmenting exclusion rights over a single resource can prevent its use, even when using it would benefit everyone.

  **Materials:**
  *   8 Envelopes labeled "Patent Holder 1" through "8".
  *   Fake money or candy (enough for a pot of 100 units).
  *   Whiteboard/Screen to track the "Company Budget".
  *   Slips of paper for bidding.

  **Setup (5 Minutes):**
  1.  **Scenario:** Tell the club: "A pharmaceutical company wants to produce a life-saving vaccine. However, the science requires 8 distinct patents. You 8 are the universities holding those patents."
  2.  **The Pot:** Write **$100** on the board. This is the maximum revenue the company can pay out to license all patents.
  3.  **The Rule:** To produce the vaccine, the company must license **ALL 8** patents. If even one patent is missing or too expensive, the deal dies.
  4.  **The Safety Net:** Tell them: "If the deal fails, you keep your patent. It has a baseline value of **$5** to you (representing future research potential). If the deal succeeds, you get the cash price you negotiated, but you lose the patent (can't use it again)."
  5.  **Goal:** Maximize your individual payout.

  **Round 1: The Silent Thicket (10 Minutes)**
  1.  **Constraint:** No talking between students.
  2.  **Action:** Each student writes down a private "License Price" on a slip of paper and puts it in their envelope.
  3.  **Resolution:** Collect envelopes. Sum the prices publicly.
      *   **If Sum ≤ $100:** Deal succeeds. Everyone gets their bid amount.
      *   **If Sum > $100:** Deal fails. Everyone gets the $5 consolation prize.
  4.  **Likely Outcome:** Without coordination, students will likely bid above $12.50 (the equal share) hoping to grab more value, causing the sum to exceed $100. The resource (vaccine) goes unused.

  **Round 2: The Negotiation Trap (10 Minutes)**
  1.  **Constraint:** Talking is allowed. Unanimity is still required.
  2.  **Action:** Students have 5 minutes to agree on a price split. The Facilitator (Company) will accept any split under $100.
  3.  **The Twist:** Hand one student a secret card before starting: *"Hardliner: You must demand at least $25, or you veto."* (This ensures the tragedy manifests even if they are cooperative).
  4.  **Resolution:** Attempt to finalize the deal.
  5.  **Likely Outcome:** The group may struggle to accommodate the Hardliner without others feeling shortchanged. Trust breaks down. Others may threaten to veto in retaliation. The deal often dies again due to "holdout" behavior.

  **Debrief (20 Minutes):**
  1.  **Reveal the Concept:** Explain that they just experienced the **Tragedy of the Anticommons**. Unlike the "Tragedy of the Commons" (where too many people *use* a resource until it breaks), this is where too many people have the right to *exclude* others, so the resource is never used at all.
  2.  **Map the Game:**
      *   **The Vaccine:** The underused shared resource.
      *   **The Patents:** Fragmented ownership rights (each student owned a "piece" of the solution).
      *   **The Veto:** The power to say "no" (either by refusing to sign or pricing too high).
      *   **The Failure:** Value was destroyed ($100 potential became $5 actual) because rights were too scattered.
  3.  **Real-World Examples:** Mention smartphone patents (too many owners block new features), vacant buildings in cities (too many heirs block development), or land mines in post-war zones (too many agencies block clearing).

  **Facilitator Notes:**
  *   **Predicted Mess Up:** Students might collude too easily in Round 2 and split it $12.50 each immediately.
      *   **Fix:** Use the "Hardliner" card mentioned above, or introduce a "Transaction Cost" in Round 2 (e.g., "Every minute of negotiation costs the pot $5"), forcing them to rush and make mistakes.
  *   **Missing Piece:** This game assumes value is purely monetary and known. In reality, patent holders often don't know the total potential value of the final product, or they have emotional/ideological reasons for withholding rights (e.g., ethical objections to the vaccine) which makes negotiation harder than simple math.

