      *   **Specific Mechanism:** User suggests shuffled decks with outcomes/probabilities, different orders yielding different sums. Alternatively, a 2D variant (row vs. column sums). User wants students to *do arithmetic* and find discrepancies.
      *   **Debrief Needs:** Map activity moments to formal points (EV = gamble + procedure, undefined $\neq$ infinite, escape hatches & their costs).
