              5.  **The Task:** "Compute the Expected Value."
              6.  **The Trick:** I tell them "For infinite series, EV is the limit of partial sums." I ask them to plot the **Running Total** after every 5 cards.
              7.  **The Reveal:** With only 20 cards, the sums will eventually meet (commutativity of finite sums). *This is the flaw.*
              8.  **Correction:** I need them to realize that for the *infinite* case, the order dictates the limit. I will give them the first 20 terms but ask them to **project** the behavior based on the pattern of the partial sums.
              9.  **Better Correction:** Use the **Two Procedures** framing.
                  *   Procedure 1 (Coin): "We flip until Heads. This defines the order $n=1, 2, 3...$"
                  *   Procedure 2 (Urn): "We draw from an urn containing all outcomes. The order is undefined/random."
                  *   *Actually, the most robust way to handle the finite constraint:* Acknowledge it. Use the finite sum to show the *pattern* of partial sums.
                  *   Groups 1-2: Calculate partial sums $S_1, S_2, ... S_{20}$ in natural order. (Oscillates, settles near 0.69).
                  *   Groups 3-4: Calculate partial sums in "Positive First" order. (Grows large, then crashes when negatives hit).
                  *   Groups 5-6: Calculate partial sums in "Negative First" order. (Crashes, then grows).
                  *   *Discussion:* "If the game were infinite, where would the line go?"
                  *   *This works.* It highlights that the *trajectory* of belief/value update depends on order, and for infinite cases, the destination depends on it too.

