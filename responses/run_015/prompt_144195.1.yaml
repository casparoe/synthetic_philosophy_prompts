          *   *Wait, if I give them finite cards, Group B will run out of positives and start summing negatives.*
          *   *Solution:* The cards must represent the **Infinite Rule**. "Card 1: Term 1. Card 2: Term 2..."
          *   *Okay, here is the winning design:*
              1.  **The Gamble:** The Pasadena Game (truncated for calculation, but conceptually infinite).
              2.  **The Groups:** 6 Groups of 3.
              3.  **The Materials:** Each group gets an envelope. Inside are 20 slips.
              4.  **The Catch:** The slips are labeled differently.
                  *   Groups 1-2 (Natural): Slips labeled $n=1$ to $20$. Order in envelope is $1, 2, 3...$
