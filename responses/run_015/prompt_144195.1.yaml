answer: |-
  # Lesson Plan: The Order of Value
  **Course:** Decision Theory / Philosophy of Probability (Upper-Level Undergrad)  
  **Time:** 75 Minutes  
  **Class Size:** 18 Students (6 Groups of 3)  
  **Topic:** Expected Value, Conditional Convergence, and the Pasadena Paradox  

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  1.  Demonstrate that for certain infinite gambles, the Expected Value (EV) depends on the *order of aggregation*, not just the probability-outcome pairs.
  2.  Distinguish between an EV that is *infinite*, *unknown*, and *undefined*.
  3.  Critique standard "escape hatches" (capping, median, absolute convergence) by articulating the decision-theoretic cost of each.

  ## 2. Materials & Preparation
  *   **6 Envelopes** (labeled Group 1 through 6).
  *   **Inside each envelope:**
      *   **12 Index Cards:** Each card represents one "term" in the expected value sum ($p_i \times v_i$). The values are pre-calculated to save time.
          *   *The Series:* The Alternating Harmonic Series (derived from the Pasadena Game: $v_n = \frac{(-1)^{n+1}2^n}{n}, p_n = 2^{-n} \implies \text{term} = \frac{(-1)^{n+1}}{n}$).
          *   *Values:* $+1.00, -0.50, +0.33, -0.25, +0.20, -0.17, +0.14, -0.13, +0.11, -0.10, +0.09, -0.08$.
      *   **1 Instruction Sheet:** Specific to the group type (see below).
      *   **1 Worksheet:** For recording running totals and final price.
      *   **1 "Spoiler" Task Card:** (For the 2 students who know the paradox—see *Spoiler Management*).
  *   **Projector:** To display the "Market Board" (a simple table to write group prices).
  *   **Calculators:** Students may use phones.

  ## 3. Activity Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute envelopes. No lecture. Read instructions silently. |
  | **05-30** | **Calculation** | Groups compute running totals and determine a "Fair Price." |
  | **30-45** | **Market** | Groups post prices. Discrepancies revealed. |
  | **45-65** | **Debrief** | Facilitated discussion mapping activity to formal theory. |
  | **65-75** | **Closure** | Addressing limitations (finitude) and homework assignment. |

  ---

  ## 4. The Activity Mechanics

  ### The Envelope Variants
  You have 18 students. You know 2 of them are "Spoilers" (have read about Pasadena). Do not seat them together.

  **Groups 1 & 2 (The Sequentialists / "Coin Flippers")**
  *   **Narrative:** "This gamble is generated by flipping a coin until Heads. $n$ is the flip number."
  *   **Card Order:** Cards are rubber-banded in natural order ($n=1$ to $12$).
  *   **Task:** "Calculate the Running Total after every card. Extrapolate the limit as $n \to \infty$. Set your price equal to this limit."
  *   *Expected Result:* Running total oscillates but stabilizes near **0.69** ($\ln 2$).

  **Groups 3 & 4 (The Aggregators / "Urn Drawers")**
  *   **Narrative:** "This gamble is generated by an Urn containing all possible outcome tickets. You may inspect and sort the tickets before summing."
  *   **Card Order:** Cards are sorted **Positives First**, then Negatives ($+1, +0.33, \dots, -0.5, -0.25 \dots$).
  *   **Task:** "Calculate the Running Total. Extrapolate the limit."
  *   *Expected Result:* Running total grows significantly during the positive phase. Students should see divergence or a much higher "apparent" value before the negatives hit.

  **Groups 5 & 6 (The Pairers / "Hedgers")**
  *   **Narrative:** "You are allowed to pair outcomes to manage risk."
  *   **Card Order:** Cards are pre-paired $(+1, -0.5), (+0.33, -0.25) \dots$
  *   **Task:** "Sum each pair, then sum the pairs."
  *   *Expected Result:* Converges faster, same as Group 1, but highlights the *pairing* procedure.

  ### Spoiler Management
  Identify the two students who know the paradox beforehand (ask via email or pre-class poll).
  *   **Do not** tell them to stay quiet.
  *   **Give them a specific role:** Hand them the **"Auditor Card."**
  *   **Auditor Task:** "Do not calculate the price. Instead, calculate the sum of the *absolute values* of the cards ($\sum |p_i v_i|$). Does this sum converge or diverge? If it diverges, write 'UNDEFINED' on your group's price tag."
  *   **Why:** This keeps them engaged, prevents them from shouting "It's Pasadena!" to ruin the calculation for others, and gives you a crucial data point for the debrief (Absolute Divergence).

  ---

  ## 5. Predictable Problems & Facilitator Moves

  | Problem | Facilitator Move |
  | :--- | :--- |
  | **"I wouldn't pay 69 cents, it's too risky."** | "You are acting as a Risk-Neutral Bank. We are calculating *Expected Value*, not Utility. Suspend risk aversion for this calculation." |
  | **"The sum is the same regardless of order (Finite Sum)."** | "You are correct for 12 cards. The question asks you to *extrapolate* to the infinite case based on the *trajectory* of your running totals. Does the line look flat or does it drift?" |
  | **Group refuses to bid.** | Accept this. Write "NO BID" on the board. This is a valid decision-theoretic response to undefined EV. |
  | **Spoilers reveal the trick early.** | "Excellent. You've identified the mathematical structure. Does that tell the other groups *which* order is the correct one? Stay in your role as Auditors." |
  | **Arithmetic errors.** | The values are rounded to 2 decimals. Tell students: "Precision matters less than the *pattern* of the running total." |

  ---

  ## 6. The Debrief (Mapping Activity to Theory)
  *This is the critical section. Do not lecture until the prices are on the board.*

  **Step 1: The Discrepancy (5 mins)**
  *   **Action:** Write the group prices on the board. They will differ (e.g., 0.69 vs. "High/Undefined" vs. "No Bid").
  *   **Ask:** "You all had the same cards. Same probabilities. Same payoffs. Why are the prices different?"
  *   **Point:** Expected Value is not an intrinsic property of the *outcomes* alone. It is a property of the **Outcomes + Aggregation Procedure**.

  **Step 2: The Infinite Limit (10 mins)**
  *   **Ask Group 1:** "Your running totals settled. Why?" (Answer: Alternating series test).
  *   **Ask Group 3:** "Your running totals grew. Why?" (Answer: Summing positives first creates a large positive drift).
  *   **Formal Point:** For finite sums, order doesn't matter (Commutativity). For infinite sums, order *does* matter if the series is **Conditionally Convergent**.
  *   **Ask the Auditors (Spoilers):** "What did you find?" (Answer: Sum of absolute values diverges).
  *   **Formal Point:** If $\sum |p_i v_i| = \infty$, the EV is **Undefined**, not Infinite. "Infinite" means it grows without bound in one direction. "Undefined" means the value depends on how you ask the question.

  **Step 3: The Two Procedures (5 mins)**
  *   **Ask:** "Group 1 was told 'Coin Flip'. Group 3 was told 'Urn'. Are these the same gamble?"
  *   **Discussion:** Physically, they yield the same distribution. But the *Coin Flip* imposes a temporal index ($n=1, 2, 3...$). The *Urn* implies a set without inherent order.
  *   **Formal Point:** Decision theory usually assumes the sample space is indexed. If the index is arbitrary, the EV is arbitrary.

  **Step 4: Escape Hatches & Costs (10 mins)**
  *   **Ask:** "How do we fix this? How do we make a decision?"
  *   **Elicit Solutions:**
      1.  **Cap the Payoff:** "Make the game finite."
          *   *Cost:* Changes the gamble. Violates the "Unbounded Utility" assumption some theorists want.
      2.  **Natural Order:** "Always use the time order ($n=1, 2, 3$)."
          *   *Cost:* Why is time privileged? What if the outcomes are spatial?
      3.  **Median/Mode:** "Don't use Mean."
          *   *Cost:* Violates standard axioms of rationality (e.g., dominance principles can fail).
      4.  **No Bet:** "Refuse to play."
          *   *Cost:* Paralysis. You might pass up a genuinely good opportunity.
  *   **Takeaway:** Every fix requires sacrificing a theoretical virtue (generality, axiomatic consistency, or action-guidance).

  ---

  ## 7. Limitations & Honesty (The "Retraction" Handling)
  *You must address the fact that this was a simulation.*

  **The "Finite World" Objection:**
  *   **Student:** "But in reality, you can't have infinite money. So the series stops eventually. So EV is defined."
  *   **Your Response:** "Correct. In the physical world, all gambles are finite. So why did we do this?"
  *   **The Bridge:** "We use infinite models to represent **ignorance of the upper bound**. If you don't know where the cap is, you must model it as unbounded. This paradox shows that if your uncertainty is unbounded *and* your values oscillate, standard EU theory breaks down even before you hit the bank's limit."
  *   **The Handoff:** "I am not asking you to believe infinite money exists. I am asking you to accept that **Decision Theory is a formal system**, and like any formal system, it has edge cases where its rules contradict. The Pasadena Game is the 'division by zero' of Expected Utility."

  **Homework Assignment:**
  "Write a 1-page memo to a casino manager. They want to offer this game. Based on today's activity, do you recommend they offer it? If yes, at what price? If no, which 'escape hatch' from the debrief do you recommend they codify in the rules to protect themselves?"

  ---

  ## 8. Why This Design Works
  1.  **Arithmetic over Announcement:** Students physically feel the divergence in the running totals (Group 3's sum grows, Group 1's stabilizes) before they hear the word "convergence."
  2.  **Spoiler Containment:** The Auditors validate the math without solving the pricing problem for the others (knowing it's undefined doesn't tell you what price to post).
  3.  **Procedural Dependence:** By tying the order to a physical narrative (Coin vs. Urn), you make the "order of summation" feel like a feature of the *world*, not just a math trick.
  4.  **Honesty:** It admits the classroom constraint (finite cards) but uses it to teach the concept of *limits*, which is where the actual mathematical trouble lies.
