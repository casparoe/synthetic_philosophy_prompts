      *   **Title:** The Order of Operations.
      *   **Phase 1: Setup (10 min):** Distribute envelopes. No lecture.
      *   **Phase 2: Calculation (25 min):** Groups compute partial sums.
      *   **Phase 3: Pricing (15 min):** Groups set a price based on their sums.
      *   **Phase 4: Conflict (10 min):** Reveal discrepancies.
      *   **Phase 5: Debrief (15 min):** Formalize.

      *   *Refining the Math:* Pasadena Game: $v_n = \frac{(-1)^{n+1} 2^n}{n}$, $p_n = 1/2^n$. Term $t_n = \frac{(-1)^{n+1}}{n}$.
