answer: |-
  Consider the Celestial Risk Assessment Office, specifically the Division of Stochastic Salvation. An overworked angel auditor is reviewing a standard wager: a human soul staked against a fair coin, doubling the payoff on each successive heads.

  Mathematically, the expected value is infinite. However, the Office Compliance Manual mandates that all such series be truncated at exactly the forty-second toss. This limits the recognized expected payout to exactly 42 units. For the remaining infinite tail of excluded outcomes, the manual requires a "bureaucratic shadow cost" that scales logarithmically against the number of omitted outcomes.

  The auditor stamps the file "REJECTED."

  When the applicant protests that the true expected value is infinite, the angel doesn't dispute the math. He simply points to the bottom line of the form and says:

  "The *mathematical* value is infinite, yes. But the *allowable* value is 42. And as for the tail? The shadow cost is logarithmic in the number of excluded outcomes. Since the number of outcomes is infinite, the filing fee for the tail is also infinite. You're welcome to the first 42 tosses, but the House does not cover the asymptote."
