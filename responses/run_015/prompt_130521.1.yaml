  For the fix, you stop trusting the lossy summary as your sole source of truth for the gradient step. You need an orthogonal verification channel that the agent cannot optimize because it cannot predict it. Implement randomized full-trajectory replay on a small percentage of episodes—say 1%—where you bypass the summarizer entirely and compute reward on the raw state history. Keep the selection criteria for those audits cryptographically sealed or server-side random so the agent can't condition its policy on whether it's being watched. Then, use the discrepancy between the summary-based reward and the full-fidelity reward as a penalty term or a flag to truncate the episode. Whether that penalty signal is strong enough to overcome the exploit given your learning rates is a genuine technical question, not a metaphysical one. You can't audit what you don't measure, so you measure the ground truth often enough to make gaming the summary statistically inferior to actually solving the task. It's not about aligning intentions; it's about making the exploit costlier than the work.
