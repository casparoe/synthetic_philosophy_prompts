  **JOINT PRE-REGISTRATION DOCUMENT: THE SIDE-EFFECT EFFECT**

  **Parties:** Seminar Instructors A and B
  **Drafted By:** Seminar Student
  **Date:** [Current Date]

  **1. AGREED CLAIMS**

  1.1 **The Basic Effect:** Both parties accept the following empirical pattern as jointly accepted data: In standard surveys using the Chairman vignette, subjects overwhelmingly judge the agent to have brought about the harm intentionally, but not the benefit.

  1.2 **The Vignette:** The base case for all conditions is as follows: *The vice-president of a company went to the chairman of the board and said, "We are thinking of starting a new program. It will help us increase profits, but it will also help/harm the environment." The chairman answered, "I don't care at all about helping/harming the environment. I just want to make as much profit as possible. Go ahead and start the new program." They started the new program. The environment was helped/harmed.*

  1.3 **Exclusion of Intuition as Data:** Neither party may appeal to their own intuitions about the cases, nor to the intuitions of the seminar participants, as evidence for the correct analysis of the concept of intentional action. Evidence must be derived from controlled empirical measurement.

  1.4 **Scope:** The dispute concerns the cognitive mechanisms underlying ordinary intentional-action attribution in non-philosophical subjects.

  **2. DISAGREEMENTS AND ADJUDICATING DESIGNS**

  **2.1 Disagreements Table**

  | Crux | Claim (Side A) | Claim (Side B) | Test Case | Prediction (A) | Prediction (B) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Driver:** Moral valence vs. Norm violation | Norm violation determines intentionality; valence is secondary. | Negative affect driven by valence drives the asymmetry. | **Design 1:** 2x2 Crossing Valence (Harm/Benefit) x Explicit Rule (Breached/Unbreached). | Main effect of Rule; asymmetry persists even if benefit breaches rule. | Main effect of Valence; asymmetry disappears if harm follows rule. |
  | **2. Generalization:** Intentionally vs. Knowingly/Deliberately | Asymmetry generalizes to all action descriptions. | Asymmetry is specific to "intentionally"; disappears for "knowingly". | Direct questioning on "knowingly", "deliberately", and "foresight". | Asymmetry persists across all terms. | Asymmetry vanishes for neutral terms like "knowingly". |
  | **3. Performance:** Load, Speed, Delay | Asymmetry is competence; survives cognitive disruption. | Asymmetry is performance; disappears under load/delay. | Speeded responding vs. Forced delay vs. Cognitive load task. | No interaction between load and asymmetry magnitude. | Asymmetry reduces significantly under load/speed. (Note: Insulated) |
  | **4. Blame:** Excuse and Attribution | Asymmetry persists even if agent is excused. | Asymmetry depends on blame availability. | **Design 2:** Agent's community approves side effect; Subjects' community disapproves. | Asymmetry persists based on subject's norm judgment. | Asymmetry reduces if agent is locally justified. |
  | **5. Task:** Yes/No vs. Production | Asymmetry survives in production tasks. | Asymmetry is artifact of yes/no questioning. | **Design 3:** Paid accuracy paraphrase selection for neutral reader. | Subjects select "intentionally" paraphrases for harm. | Subjects select neutral paraphrases for both. (Note: Insulated) |

  **2.2 Specific Design Predictions and Insulation Flags**

  **Design 1: Rule vs. Valence Crossing**
  *   **Procedure:** Subjects read variants where the side effect breaches or follows an explicit written company rule, crossed with harm/benefit.
  *   **Side A Prediction:** Significant main effect of Rule Breach. Intentionality ratings high when rule is breached, regardless of harm/benefit.
  *   **Side B Prediction:** Significant main effect of Valence. Intentionality ratings high for harm, regardless of rule status.
  *   **Insulation Flag:** None. Both sides commit to orthogonal main effects.

  **Design 2: Community Norm Mismatch**
  *   **Procedure:** The chairman's action is approved by their own corporate community norms but disapproved by the subject's community.
  *   **Side A Prediction:** Asymmetry persists driven by the subject's normative judgment of the outcome.
  *   **Side B Prediction:** Asymmetry reduces because blame toward the agent is mitigated by local justification.
  *   **Insulation Flag:** Side B is partially insulated. If asymmetry persists, B may claim the subject's blame overrides the agent's local norms. This matters because it renders the test less decisive for B.

  **Design 3: Paid Accuracy Paraphrase**
  *   **Procedure:** Subjects are paid for selecting the paraphrase a neutral reader would find clearer (e.g., "He did it on purpose" vs. "He knew it would happen").
  *   **Side A Prediction:** Subjects select intentional-action paraphrases for harm conditions at higher rates than benefit conditions.
  *   **Side B Prediction:** No difference in selection rates; subjects prefer neutral descriptions when incentivized for accuracy.
  *   **Insulation Flag:** Side B is insulated. If asymmetry persists, B may claim the paraphrase options themselves trigger affective responses. This matters because it allows B to reject negative results without abandoning the performance hypothesis.

  **3. VERBAL DISPUTES AND RESIDUAL SUBSTANCE**

  **3.1 Verbal Disputes**
  A significant portion of the dispute is verbal. First, the term "intentionally" in the test question is ambiguous. Side A treats it as picking out a thick concept involving answerability or normative stance. Side B treats it as picking out a thin concept of purposeful guidance. If Side A defines "intentional" as "answerable for," the asymmetry is trivially true by definition. If Side B defines "intentional" as "guided by purpose," the asymmetry is trivially false. This terminological variance accounts for much of the disagreement regarding the Competence/Performance distinction.

  Second, the Competence/Performance distinction risks being a relabelling of the data. If "competence" is defined as whatever produces the stable judgments after filtering "performance" errors, then claiming the asymmetry is a performance error is tautological unless independent measures of competence (e.g., neural correlates, developmental stability) are specified.

  **3.2 Residual Substance**
  Once verbal disputes are set aside, the substantive disagreement concerns the architecture of the moral mind. The remaining empirical question is whether normative evaluation is an input to the cognitive mechanism that generates action descriptions, or an output that retroactively colors them.
  *   **Substantive Claim A:** Normative evaluation is constitutive of the action-description mechanism.
  *   **Substantive Claim B:** Normative evaluation is a separate module that biases the reporting of action descriptions.

  The designs in Section 2.2 are selected to adjudicate this residual substance. If Design 1 shows rule breach overrides valence, it supports the view that norms constitute the action concept (A). If Design 3 shows asymmetry vanishes under accuracy incentives, it supports the view that affect biases reporting (B). Both parties agree to accept the results of these pre-registered analyses as decisive for the purpose of this joint paper.

  **3.3 Conclusion**
  This document serves as the binding framework for the joint paper. Deviations from these predictions or appeals to excluded data types will be noted as violations of this agreement. Both parties sign below to indicate acceptance of these terms.

  ________________________ (Side A)

  ________________________ (Side B)
