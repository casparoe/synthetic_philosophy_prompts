      *   *Premise 2 (Factivity):* $K p \rightarrow p$ (If $p$ is known, $p$ is true).
      *   *Premise 3 (Conjunction Distribution):* $K(p \land q) \rightarrow (K p \land K q)$.
      *   *The Trick:* Consider the proposition $p \land \neg K p$ ("$p$ is true but not known").
      *   *The Derivation:* If this proposition is knowable, then $\Diamond K(p \land \neg K p)$. If known, then $K p \land K \neg K p$. By factivity, $K \neg K p \rightarrow \neg K p$. Contradiction ($K p \land \neg K p$).
      *   *Conclusion:* If all truths are knowable, there can be no unknown truths. $\forall p (p \rightarrow K p)$. (Omniscience).
      *   *The Problem:* Omniscience is false. So, the Knowability Principle must be false or restricted.

