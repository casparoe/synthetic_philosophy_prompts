      *   *Incompatible Pair:* **Functional Retention** vs. **Dependency Integrity**. To keep the anti-realist spirit (R2) while avoiding omniscience (R1), you often have to tweak the logic (R4) or the definition of knowledge. There is a tension between keeping the logic standard and keeping the principle strong.
