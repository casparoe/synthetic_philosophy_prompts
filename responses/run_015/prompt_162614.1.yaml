  **OFFICE FOR INTERGENERATIONAL EQUITY**
  **INTERNAL MEMORANDUM**

  **TO:** All Regional Assessors
  **FROM:** Director, Strategic Planning
  **DATE:** 14 October 2023
  **SUBJECT:** Operational Guidance 44-B (Identity-Conditional Harm)

  Please find attached the updated protocol for assessing long-term policy impacts. Staff are reminded that the Office's mandate is restricted to remedying harms suffered by identifiable claimants. Where a policy alters the circumstances of conception such that a different individual is born than would otherwise have existed, no claimant exists to lodge a grievance. Assessors must not conflate "a worse life" with "harm to a person." Strict adherence to the Identifiable Claimant Principle is required to prevent liability creep. Special attention is drawn to Clause 5 regarding universal depreciation scenarios.

  ***

  **EXTRACT FROM OPERATIONAL GUIDANCE 44-B**

  **1. Definition of Actionable Harm**
  1.1. An actionable harm is recorded only where a specific individual is rendered worse off than they would have been had the policy not been enacted.
  1.2. Existence is presumed to be a positive baseline. An individual cannot claim harm based on the assertion that they would have been better off never having been born.

  **2. Temporal and Circumstantial Displacement**
  2.1. Policies that alter economic conditions, environmental factors, or daily routines inevitably shift the timing of conception events.
  2.2. Where conception is delayed or accelerated by any magnitude, the resulting individual is genetically distinct from the individual who would have been conceived under the counterfactual baseline.
  2.3. **Worked Example A:** A proposed noise barrier near a residential zone reduces sleep disturbance but delays conception for Resident X by 48 hours due to construction scheduling. The child born subsequent to this delay is not the same child who would have been born without the barrier. Therefore, any health deficits suffered by the actual child cannot be attributed to the barrier, as the alternative child (who would have had better health) does not exist to compare them against.
  2.4. **Worked Example B:** A carbon tax reduces disposable income for Couple Y, postponing their decision to have a second child by three years. The second child born under the tax regime is a different individual than the one who would have been born without the tax. Complaints regarding the second child's reduced economic prospects are inadmissible.

  **3. Fixed Identity Exceptions**
  3.1. In rare instances where a policy impacts an individual whose identity is already fixed (e.g., radiation exposure to an existing fetus), an actionable harm may be recorded.
  3.2. Assessors are advised to treat these cases as administrative anomalies. Policy architects should be encouraged to structure interventions to avoid affecting fixed-identity subjects wherever possible, thereby reducing Office workload.
  3.3. Reliance on Clause 3.1 should be minimized in final reporting.

  **4. Discounting of Future Grievances**
  4.1. All future damages must be converted to Present Value using the standard Treasury Discount Rate of 5% per annum.
  4.2. **Calculation Example:** A policy failure projected to cause £1,000,000 of damage per capita in 220 years' time shall be recorded as a present liability of approximately £22.00 per capita.
  4.3. Assessors should note that beyond the 200-year horizon, most intergenerational liabilities diminish to negligible administrative values.

  **5. Universal Baseline Depreciation**
  5.1. Scenarios may arise where a policy results in a future population where every individual possesses a quality of life considerably lower than the population that would have existed under an alternative policy.
  5.2. Provided that every individual in the actual future population enjoys a life worth living, and their existence is contingent upon the policy enactment, the Office records zero harm.
  5.3. The fact that every member of the future population is worse off than the members of the counterfactual population is irrelevant, as the counterfactual population does not exist.
  5.4. Assessors must not flag this outcome as a ethical difficulty. It is a logical necessity of the Identifiable Claimant Principle.

  **6. Demographic Volume Metrics**
  6.1. Assessments involving trade-offs between total population size and average welfare quality are classified as Non-Justiciable Demographic Questions.
  6.2. Specifically, scenarios where a policy leads to a vastly larger population with lives barely above the threshold of worthiness, versus a smaller population with high welfare, are out of scope.
  6.3. Staff should not attempt to quantify "total welfare" aggregates. The Office measures harm to persons, not abstract utility sums.

  **7. Compliance**
  7.1. Forms submitted without a completed "Identity Variance Confirmation" will be returned.
  7.2. Do not speculate on the feelings of the unborn. They are not clients.
