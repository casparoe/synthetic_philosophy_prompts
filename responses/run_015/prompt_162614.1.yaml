      *   **Clause 4 (Discounting):** Introduce the Treasury Discount Rate. 3.5% standard? Over 200 years, £1 million becomes tiny.
      *   **Clause 5 (Aggregate Welfare vs. Individual Harm):** The concession. Even if everyone is worse off, if no *specific* person is worse off than their non-existence alternative, no harm is recorded.
      *   **Clause 6 (Population Size):** The repugnant conclusion nod. "Quantitative demographic expansions where quality of life falls below threshold X but remains positive..." -> Out of scope.

  4.  **Refining the Tone:**
      *   Must be dry, administrative, unemotional.
