      *   *Repugnant:* "High-volume low-yield demographic scenarios".

      *(Self-Correction during drafting)*: Make sure the discount rate joke lands. £1 billion in 200 years at 3.5% is... let's calculate. $1.035^{-200} \approx 0.001$. So £1 billion becomes £1 million? No, wait. $1.035^{200} \approx 950$. So £1 billion / 950 \approx £1 million. That's not pocket change. Need longer or higher rate. 5%? $1.05^{200} \approx 17,000$. £1 billion / 17,000 \approx £58,000. Still not pocket change.
