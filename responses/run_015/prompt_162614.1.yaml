          *   Address cases where the *same* people exist either way (treat as a loophole to be closed/discomfort).
          *   Include a discount rate with plausible numbers showing compound interest making future damages negligible.
          *   Concede that a policy making every future life worse still counts as harming nobody (without regarding it as a difficulty).
          *   Smuggle in the "repugnant conclusion" as a single clause waved away as out of scope.
      *   **Constraints:** Do NOT use phrases "non-identity problem", "person-affecting", "repugnant conclusion". Do NOT add an afterword or explanatory note.

  2.  **Deconstruct the Philosophy:**
      *   *Non-Identity Problem:* If a policy changes who comes into existence (by changing timing/circumstances of conception), the resulting people cannot claim they were harmed by the policy, because without the policy, they wouldn't exist at all. Existence is presumed better than non-existence.
      *   *Person-Affecting View:* An outcome can only be bad if it is bad *for someone*.
      *   *Discount Rate:* Future costs/benefits are worth less than present ones. Over long timescales, this becomes absurd (e.g., a catastrophe in 200 years is worth pennies today).
      *   *Repugnant Conclusion:* A very large population with lives barely worth living is better than a smaller population with very high quality of life (total utilitarianism). The prompt asks to wave this away as out of scope.
      *   *Same People Cases:* If a policy harms people who would have existed anyway (e.g., radiation poisoning existing fetuses), that's straightforward harm. The bureaucracy should treat this as an annoying exception or loophole.

  3.  **Drafting - Section by Section:**

      *   **Memo Header:** Needs to look official. To: All Staff, From: Director, Subject: Guidance Update.
      *   **Memo Body:** Brief, setting the tone. Emphasize strict adherence to the "Identifiable Claimant Principle" (a euphemism for person-affecting).
      *   **Guidance Extract:** Numbered clauses.
      *   **Clause 1 (Definition of Harm):** Establish that harm requires a specific identifiable victim who is worse off than they would otherwise be.
      *   **Clause 2 (Conception Variance):** Explain that policies altering conception timing/conditions create different individuals. Therefore, no harm.
