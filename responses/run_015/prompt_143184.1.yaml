answer: |-
  **The Principle of Autonomy-Constrained Well-Being**

  **Precise Statement:**
  A sexual act is morally permissible if and only if it satisfies the following four conditions:
  1.  **Net Well-Being:** The act produces a net balance of satisfaction over suffering for the direct participants.
  2.  **Valid Consent:** All direct participants possess the capacity for, and provide, informed and voluntary agreement, free from internal or external coercion.
  3.  **Fidelity to Commitments:** The act does not violate explicit, voluntary promises of exclusivity or transparency made to third parties.
  4.  **Respect for Personal Integrity:** The act does not utilize the sexualized likeness or identity of a non-consenting person, nor does it treat a participant merely as a means to an end in a way that violates their dignity.

  **Clause Motivation by Case:**
  *   **Clause 1 (Net Well-Being):** Motivated by **Case 1** (recreational sex) and **Case 4** (sex work). It establishes that mutual satisfaction and lack of physical/psychological harm are the baseline for moral permission, validating consensual pleasure and labor alike.
  *   **Clause 2 (Valid Consent):** Motivated by **Case 5** (coerced open relationship). It clarifies that outward agreement is insufficient if internalized fear or coercion vitiates the voluntariness of the choice.
  *   **Clause 3 (Fidelity to Commitments):** Motivated by **Case 2** (cheating). It accounts for the wrongness of deception and promise-breaking even when immediate physical harm is absent, grounding the wrong in the violation of trust rather than the sex act itself.
  *   **Clause 4 (Personal Integrity):** Motivated by **Case 6** (VR replica). It extends moral protection beyond physical harm to include rights over one's digital identity and dignity, prohibiting the instrumentalization of a person's likeness without consent.

  **Prediction on Unlisted Case:**
  *   **Case:** An asexual couple sharing deep physical intimacy (sleeping naked, non-sexual genital contact) for emotional bonding with full mutual understanding.
  *   **Analysis:** This act satisfies Clause 1 (emotional bonding produces well-being), Clause 2 (full mutual understanding implies valid consent), Clause 3 (no promises violated), and Clause 4 (no violation of integrity). The definition of "sexual act" is broad enough to cover genital contact, but the moral calculus relies on consent and well-being, not reproductive potential or orgasmic release.
  *   **Predicted Verdict:** Not morally wrong.

  **Accommodation Failure:**
  This principle cannot accommodate **Case 3** (consensual adult incest). Under the Principle of Autonomy-Constrained Well-Being, the incestuous relationship is permissible: it produces well-being (Clause 1), involves valid consent between adults (Clause 2), violates no prior promises (Clause 3), and violates no third-party integrity (Clause 4). Your intuition that Case 3 is wrong relies on a moral foundation (often categorized as "purity" or "sanctity") that posits certain acts as intrinsically wrong regardless of harm, consent, or autonomy. To accommodate Case 3, one would need to add a clause prohibiting acts that violate "natural boundaries" or "social taboos," but this would contradict the Benthamite focus on consequences and the liberal focus on autonomy, rendering the principle ad hoc and inconsistent with Cases 1 and 4.

  Verdict: The Principle of Autonomy-Constrained Well-Being and the verdict on Case 3.
