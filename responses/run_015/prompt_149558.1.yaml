answer: |-
  # Seminar Plan: The Encouragement Protocol

  **Topic:** Moral Worth (Kantian distinction between *in accordance with duty* and *from duty*).
  **Time:** 80 minutes.
  **Students:** 18 (First-year, non-specialists).
  **Budget:** £15 (2 boxes of high-quality chocolates, stationery, postage).
  **Room:** Standard seminar table or clustered desks.

  ## 1. Materials & Setup

  **You need:**
  *   **18 "Decision Slips"** (small pieces of paper, numbered 1–18).
  *   **18 "Action Sheets"** (A5 paper, pre-printed with a prompt).
  *   **18 Envelopes** (sealed, empty).
  *   **2 Boxes of Chocolates** (e.g., Hotel Chocolat or similar; something clearly desirable but not life-changing).
  *   **3 Collection Boxes** (labelled Round 1, Round 2, Round 3).
  *   **A Whiteboard.**

  **Preparation:**
  *   Write numbers 1–18 on the Decision Slips.
  *   On the Action Sheets, print: *"Please write a short note of encouragement (2–3 sentences) to a first-year student in a different department. I will collect and deliver these anonymously."*
  *   Place a Decision Slip, an Action Sheet, and a pen at each seat.
  *   Keep the chocolates visible but out of reach.

  ## 2. Timeline & Script

  ### 00:00 – 00:10: Introduction & Round 1 (Incentivised)
  **Goal:** Establish the baseline act with a positive incentive.

  **Say:**
  "Welcome. Today we're running a decision-making protocol. There is no right answer, and there is no test. I am collecting data on how we allocate praise. Everything you decide is anonymous. I will not know who made which choice until after grades are submitted.

  On your desk is a Decision Slip and an Action Sheet.
  **Round 1:** If you choose to write the note on the Action Sheet, you may place it in the Round 1 box. If you do, you will receive a chocolate immediately. If you choose not to write the note, simply place the blank Decision Slip in the box. You keep the Action Sheet as a souvenir. You have three minutes."

  *(Walk around. Hand out chocolates visibly to those who submit notes. Count the submissions silently.)*

  ### 00:10 – 00:25: Round 2 (The Counterfactual)
  **Goal:** Remove the incentive to test the motivation.

  **Say:**
  "Collect your pens. We are moving to Round 2. The task is identical: write the note of encouragement. The impact is identical: a student receives support.
  **The Change:** There are no chocolates this time. It is purely voluntary labour.
  If you choose to write the note, place it in the Round 2 box. If not, place the blank Decision Slip in the box.
  You have three minutes."

  *(Collect silently. Do not comment on the drop-off rate. Stack the boxes visibly.)*

  ### 00:25 – 00:35: Round 3 (The System)
  **Goal:** Remove the necessity of the act (outcome secured regardless).

  **Say:**
  "Round 3. Same task. Write the note.
  **The Change:** I have already emailed a generic encouragement message to the entire cohort of first-years myself. The outcome—them feeling supported—is guaranteed whether you write a note or not. Your note is redundant.
  If you still choose to write it, place it in the Round 3 box. If not, the blank slip.
  Three minutes."

  *(Collect.)*

  ### 00:35 – 00:40: Data Reveal
  **Goal:** Make the aggregate pattern public without exposing individuals.

  **Say:**
  "Thank you. I am not going to tell you who did what. But I will tell you the numbers."
  *(Write on board: Round 1: [X]/18. Round 2: [Y]/18. Round 3: [Z]/18.)*
  "Look at those numbers. Keep them in mind. Now, clear your desks. We're going to talk about what just happened."

  ### 00:40 – 01:20: Debrief & Theory Mapping
  **Goal:** Extract the philosophical distinction from their intuition, then name it.

  **Phase 1: The Gap (10 mins)**
  **Ask:** "Look at Round 1 and Round 2. The act was the same. The result was the same. The cost was the same. But the participation rate likely dropped. Why?"
  *(Students will say: "No reward," "Less motivation.")*
  **Push:** "Imagine two students. Alice did it in Round 1. Bob did it in Round 2. Both wrote the exact same note. Do we value their actions equally?"
  *(Expect consensus: No. Bob gets more credit.)*
  **Ask:** "Why? What did Bob have that Alice didn't?"
  *(Target answer: Bob did it for the sake of the act itself, not the chocolate.)*

  **Phase 2: Breaking the Test (15 mins)**
  **Say:** "We've just used a test: 'Would you do it if the reward was taken away?' If yes, you get moral credit. Now I want to break that test."
  **Present Case:** "Imagine Charlie. He did the task in Round 2 (no chocolate). But suppose I told you Charlie *loves* writing notes. It relaxes him. He finds it deeply satisfying personally. He didn't do it for chocolate, he did it for the enjoyment. Does he get the same credit as Bob, who found it tedious but did it anyway?"
  **Activity:** "Hands up: Charlie gets full credit. Hands up: Charlie gets less credit."
  *(Facilitate the disagreement. Some will say 'intent matters', others 'result matters'.)*
  **Point:** "Some of you think enjoyment cancels moral worth. Some think it doesn't. This is a genuine fault line in ethics."

  **Phase 3: The System (10 mins)**
  **Say:** "Look at Round 3. The good outcome happened regardless (my email). Yet some of you still wrote the note. What was the point?"
  *(Students: "It's more personal," "It shows you care.")*
  **Ask:** "If the *only* thing that mattered was the student feeling supported, Round 3 was a waste of time. If you did it anyway, what were you preserving?"
  *(Target: Your own integrity / the relationship / the expression of goodwill.)*

  **Phase 4: Naming the Doctrine (15 mins)**
  **Say:** "You've just reconstructed a 250-year-old argument. Immanuel Kant called this the distinction between acting **in accordance with duty** and **from duty**."
  *(Write terms on board.)*
  "**In accordance with duty:** You do the right thing, but maybe because of chocolates, or enjoyment, or fear. (Round 1 / Charlie).
  **From duty:** You do the right thing *because* it is the right thing, even if the chocolates vanish and the task is boring. (Round 2 / Bob).
  Kant argues that only actions done **from duty** have genuine **moral worth**."
  **Check:** "Does this match your intuition about Bob vs Alice? Does it match your worry about Charlie?"

  **Phase 5: Limitations (10 mins)**
  **Say:** "I need to be honest about what this game couldn't do. This game measured what you *would* do under different conditions (your disposition). Kant cares about what was in your mind *at the exact moment* you acted (your maxim).
  You could have done Round 2 for the wrong reason (e.g., to look good in front of me) and still got the chocolate. The game can't see inside your head. Kant's theory is about the invisible will, not the visible choice. That's why it's hard to prove, but hard to shake."

  ## 3. Troubleshooting: Predictable Failures

  **1. The Strategist ("I'm saving my virtue for Round 2")**
  *   **Risk:** A student realises Round 1 is a trap and refuses the chocolate to signal virtue.
  *   **Handle:** In the debrief, acknowledge this. "If someone refused Round 1 to look good for Round 2, are they acting *from duty*? Or are they playing a longer game for social credit?" This actually *helps* the Kantian point (it's still inclination, just delayed).

  **2. The Cynic ("It's just a seminar game, nothing matters")**
  *   **Risk:** Student refuses to engage, says the notes are meaningless.
  *   **Handle:** Don't argue. "You're right, the stakes are low. But your intuition about the *difference* between Round 1 and 2 probably still holds. If I offered you £1000 in Round 1, would that change how much credit you'd give the actor?" Use their cynicism to isolate the variable.

  **3. The Teacher-Pleaser ("You want us to say Duty")**
  *   **Risk:** Students guess the 'right' answer in the debrief.
  *   **Handle:** "I haven't told you the theory yet. I'm asking what *you* feel. If you think the chocolate-maker deserves the same praise as the volunteer, say that. I'm recording dissent." Validate the non-Kantian view (Consequentialism) as a legitimate alternative they just discovered.

  **4. The Guilt-Trip ("I feel bad for not doing Round 2")**
  *   **Risk:** Students feel morally judged for taking the chocolate.
  *   **Handle:** Reiterate early and often: "We are studying where *praise* goes, not where *blame* goes. Taking the chocolate is rational. We are asking if it's *morally worthy*." Keep the tone analytical, not pastoral.

  ## 4. Limitations: What You Must State Plainly

  You identified a crucial worry: *The game rigs the case toward "worth is about what you'd have done otherwise" (counterfactual robustness), rather than "what the agent's will was actually up to at the moment" (the maxim).*

  **You must say this in Phase 5:**
  "This activity tested your **reliability**. We assumed that if you did Round 2 without chocolate, you did it for the right reason. But you might have done Round 2 because you wanted to look virtuous in front of the class.
  Kant's point is stricter. Even if you do the right thing every time, if your internal reason is 'I want to be seen as good', you lack moral worth.
  This game can't see your internal reason. It can only see your choices under pressure. So, this game demonstrates the *intuition* behind the theory, but it can't prove the theory itself. The theory makes a claim about your invisible will, which no seminar game can capture."

  ## 5. Practical Notes for the Tutor

  *   **Anonymity is Safety:** Ensure the Decision Slips are folded. When revealing numbers, do not look at the names on the slips (if you put names on them for admin, tear that bit off immediately). Better: No names on slips, just numbers matching a seating plan you keep secret.
  *   **The Chocolates:** Hand them out *immediately* in Round 1. The sensory experience of eating the chocolate while discussing "duty" in Round 2 sharpens the contrast.
  *   **The Notes:** Actually deliver the notes. If the students find out later you didn't, the "real stakes" contract is broken, and they will feel manipulated (in the bad way). If you can't deliver them, be honest in Round 3: "I will keep them as a record of this seminar."
  *   **Timekeeping:** Be ruthless. If Round 1 runs over, cut the discussion on Charlie short. The *experience* of the rounds is the primary text; the debrief is the gloss.

  ## 6. Why This Works

  1.  **Lived Counterfactual:** They don't imagine Round 2; they sit in it. They feel the absence of the chocolate.
  2.  **No Jargon:** They argue about "credit" and "reasons" first. The terms "duty" and "worth" arrive as labels for feelings they've already had.
  3.  **Safe Exposure:** No one knows who took the chocolate. The "shame" is abstracted into aggregate data.
  4.  **Genuine Disagreement:** The "Charlie" (Overdetermination) case splits the room. Utilitarians will say "Good outcome + Good feeling = Good." Kantians will say "Mixed motive = Tainted." This sets up the term's conflict perfectly.
