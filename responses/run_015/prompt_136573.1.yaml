  There is no single, canonical term in analytic metaphysics or bioethics that specifically labels this triad of intuitions as a distinct inconsistency. Philosophers generally discuss these cases under the broader umbrella of **Origin Essentialism** (associated with Saul Kripke and Graff Forbes), where the consensus is actually that your intuition of inconsistency is a misunderstanding of what "origin" technically means in this framework.

  However, since you asked to name and define the pattern of *intuition* you are observing (the way people slide between criteria), I will label this **"Asymmetric Origin Weighting."**

  Here is the precise carving of that pattern, how it functions, and why it is distinct from mere sloppiness.

  ### The Pattern: Asymmetric Origin Weighting

  **Definition:** This is the cognitive tendency to apply different metaphysical criteria for "personal identity" depending on whether the scenario involves *environmental displacement* (adoption/surrogacy), *genetic replication* (cloning), or *developmental fission* (twinning).

  **What Is Held Constant (The Invariant):**
  The underlying, often unstated constant is **Zygotic Token Identity**. This is the specific, spatio-temporal particularity of the single cell formed at fertilization. In all three cases, the intuition is tracking the continuous physical history of that specific biological entity.
  *   **Adoption:** The zygote token is the same; the environment changes. (Identity preserved).
  *   **Cloning:** The zygote token is different (a new egg + new nuclear transfer event), even if the DNA type is the same. (Identity not preserved).
  *   **Twinning:** The zygote token physically divides into two distinct spatio-temporal paths. (Identity splits).

  **What Gets Dropped (The Variables):**
  *   **Genetic Type:** In cloning, people drop the idea that "same DNA = same person."
  *   **Gestational Context:** In adoption, people drop the idea that "same womb = same person."
  *   **Singular Trajectory:** In twinning, people drop the idea that "one start = one finish."

  ### Why This Is Not Just Sloppiness

  You asked how this differs from being sloppy. Sloppiness implies a lack of rules or random error. Asymmetric Origin Weighting is not random; it follows a **Hierarchy of Metaphysical Dependence**.

  People are intuitively operating on a ranked system of what constitutes "you":
  1.  **Primary Essence:** The specific historical trajectory of the zygote (Token).
  2.  **Secondary Essence:** The genetic code contained within (Type).
  3.  **Tertiary Essence:** The environment of development (Womb).

  When people say the adopted embryo is the "same person," they are correctly prioritizing Level 1 over Level 3. When they say a clone is a "different person," they are correctly prioritizing Level 1 over Level 2. The "shift" you perceive is actually a consistent application of Level 1, but it *feels* inconsistent because laypeople often verbally describe Level 1 using Level 2 language (saying "it's the DNA" when they mean "it's the cell that holds the DNA").

  The twinning case is the stress test. It reveals that Level 1 (Zygotic Token) is not actually stable until implantation. Philosophers handle this by introducing **"Indeterminacy of Identity."** Before the split, it is not one person or two; it is metaphysically indeterminate. After the split, two new tokens exist. This isn't a rule change; it's an acknowledgment that the "token" itself branched.

  ### Confidence and Uncertainty

  **Confidence Level:** 85%
  I am highly confident in the metaphysical distinction between *Token Identity* (the specific cell) and *Type Identity* (the DNA sequence), and that this distinction resolves the apparent inconsistency you identified. The explanation that this is a hierarchy of dependence rather than sloppiness is the standard view in contemporary analytic metaphysics (e.g., the work of E.J. Lowe or Kathrin Koslicki on constitution).

  **Point of Least Certainty:**
  I am least certain that there isn't a niche term in **experimental philosophy** or **cognitive science** specifically for this triad. While "Origin Essentialism" is the metaphysical label, there may be a specific psychometric term (like "Folk Biological Essentialism" or "Psychological Essentialism") that categorizes this specific sliding scale as a cognitive bias rather than a metaphysical stance. If such a term exists in the psychological literature regarding layperson intuitions on cloning vs. twinning, it is not standardized across the philosophical canon.

  **Summary:** The pattern is **Asymmetric Origin Weighting**. It is not sloppy because it consistently prioritizes **Zygotic Token Identity** over genetic or environmental factors, even though verbal explanations often conflate the two.
