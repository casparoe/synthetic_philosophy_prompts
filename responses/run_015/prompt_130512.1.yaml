answer: |-
  **Project Title:** Endogenous Reference Classes in Evidential Cooperation

  **1. The Question**
  Consider a world with $N$ agents facing identical one-shot Prisoner's Dilemmas. Payoffs are standard ($T > R > P > S$). Let $A_i$ be the action of agent $i$ and $U_i$ their utility. In evidential decision theory (EDT), agent $i$ chooses $A_i$ to maximize expected utility conditional on $A_i$, treating other agents' actions $A_{-i}$ as evidentially correlated with $A_i$. Let $\rho$ be the residual correlation between $A_i$ and $A_{-i}$, conditional on the agent's information set $K$. In a "large world" ($N \to \infty$), the evidential weight of $A_i$ on the sum of others' actions can outweigh the direct causal payoff, recommending cooperation if $\rho$ is sufficiently high.

  The standard model treats $\rho$ and $K$ as exogenous. This project fixes them as choice variables. The agent controls her information acquisition (choosing $K$) and her similarity signal (choosing $S$, which affects $\rho$). The question is determinate: Does there exist a stable fixed point $(K^*, S^*)$ such that an agent maximizing evidential expected utility chooses a similarity structure that implies cooperation? Formally, does the function mapping chosen similarity to evidential correlation yield a stable equilibrium where $E[U|Cooperate] > E[U|Defect]$?

  **2. Why Existing Answers Leave It Open**
  Three standard responses fail to address this endogeneity. First, the two-agent case does not scale; the evidential swamping effect depends on $N$, and the cost of managing similarity may vary non-linearly with group size. Second, Causal Decision Theory (CDT) and Functional Decision Theory (FDT) bypass the problem rather than solving it within the evidential framework. CDT ignores the correlation; FDT changes the decision rule to evaluate algorithms rather than acts. This project asks whether EDT *itself* can accommodate these insights via endogenous reference classes. Third, existing work on ratifiability assumes a fixed type; it asks if an act is stable given who you are, not if you should choose to be the kind of agent for whom the act is stable.

  I must acknowledge two risks here. First, the "endogenous reference class" problem resembles "type selection" in program equilibrium literature; the novelty lies not in the choice of type, but in modeling it as an evidential update within EDT rather than a logical constraint. Second, the convergence claim risks a category error: if managing similarity collapses the distinction between evaluating acts and evaluating policies, the project may demonstrate that EDT is unstable rather than successful. This proposal treats that collapse as a finding to be verified, not a feature to be assumed.

  **3. The Method**
  The twelve-month schedule distinguishes formal proofs from illustrative cases.
  *Months 1–3:* Formalize the similarity function. Define $\rho(S, K)$ and the cost function $C(S, K)$. Establish the evidential expected utility function $V(A|S, K)$.
  *Months 4–6:* Prove existence conditions for the fixed point. Determine under what parameters a stable $(S^*, K^*)$ exists. This will be the primary theoretical deliverable.
  *Months 7–9:* Worked cases. Model symmetric agents vs. heterogeneous populations. Illustrate how the fixed point shifts as $N$ grows.
  *Months 10–12:* Interpretation and limitations. Analyze the normative status of the fixed point.

  A single year cannot deliver a full normative defense of the resulting policy, nor empirical validation of the similarity costs. The proof of existence will likely remain restricted to symmetric cases; asymmetric fixed points will remain conjectural.

  **4. Possible Conclusions**
  Three outcomes are possible.
  *Yes:* A stable fixed point exists where optimal similarity management implies cooperation. This saves EDT in large worlds by showing it endogenously generates policy-like reasoning.
  *No:* No stable fixed point exists, or the optimal strategy is to minimize similarity to evade evidential burden. This suggests EDT is self-undermining in large worlds.
  *Ill-Posed:* The model yields multiple equilibria with no selection mechanism, or the act/policy distinction dissolves entirely. This would indicate the formalism is insufficient to capture the normative question.
  The deciding consideration will be the stability of the equilibrium under perturbation of $N$. If cooperation holds only for precise parameter values, the result is fragile; if it holds across a range, it is robust.

  **5. Failure Conditions**
  To prevent wriggling: The project fails if I cannot produce a formal model where similarity $S$ is a continuous variable affecting correlation $\rho$, or if I cannot demonstrate whether a fixed point exists for at least one plausible cost function. Mere philosophical argument without formal derivation counts as failure. Similarly, if the "convergence" to cooperation relies on assuming the conclusion (e.g., by stipulating costs that force cooperation), the project fails.

  **6. Objection and Scope**
  The expected objection is that this is a reason to abandon EDT rather than refine it: if one must manage similarity to make EDT work, one should instead use CDT or FDT. The response is that this project tests the *limits* of EDT. If EDT converges on "be the kind of agent who cooperates" only when similarity is endogenous, it shows that evidential reasoning requires a theory of agency that CDT lacks. However, if the convergence rests on the confusion noted in Section 2, the project will recommend abandoning the evidential framework for act-evaluation.

  Regarding scope: A single year cannot deliver item (4) definitively. While I can prove existence conditions, determining which conclusion (Yes/No/Ill-Posed) is *normatively* correct requires ethical premises beyond the decision-theoretic model. The year will deliver the formal conditions, not the final verdict on rationality.
