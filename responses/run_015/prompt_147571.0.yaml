          *   Be compatible with reconstructive memory (psychology/neuroscience).
          *   Provide a *mechanism* for paralysis (why too much history sickens life), not just a metaphor.
          *   Distinguish knowledge vs. determinism.
          *   Address edge cases: intergenerational trauma, epigenetic/cultural memory.
          *   Identify Non-Negotiable vs. Relaxable desiderata.
          *   Identify the "Killer Constraint" (which requirement eliminates the most popular theories).
          *   Score surviving candidates.
          *   Apply to the AI Curation edge case (predictive recommendation of the past).

  2.  **Analyze the Philosophical & Scientific Landscape:**

      *   *Nietzsche's UM:* The baseline. History serves life, not the other way around. Forgetting is active, not passive.
      *   *Memory Science:* Memory is reconstructive (Bartlett), not archival. Trauma affects biology (epigenetics, nervous system regulation).
      *   *Digital Culture:* Stiegler (technics of memory), Byung-Chul Han (burnout society), Cukier (dataism). The "end of forgetting."
      *   *Political Theory:* Memory politics, victimhood narratives, national identity.

  3.  **Drafting the Desiderata (The "Spec"):**

      *   *Requirement 1: Functional Differentiation.* Must keep the three modes distinct but dynamic.
      *   *Requirement 2: The Forgetting Mechanism.* Must explain *how* forgetting enables action (filtering noise).
      *   *Requirement 3: Pre-Literate Compatibility.* Can't rely on texts. Must work with ritual/oral tradition.
      *   *Requirement 4: Pathology of Excess.* Must explain the *physiological/psychological* cost of hyper-historicism (paralysis).
      *   *Requirement 5: Agency vs. Determinism.* Knowing the past $\neq$ being bound by it.
      *   *Requirement 6: The Weaponization Clause.* Critical history can become a trap (grievance).
      *   *Requirement 7: Embodied/Intergenerational Transmission.* Trauma isn't just "ideas"; it's somatic/cultural.

  4.  **Categorizing Constraints (Non-Negotiable vs. Relaxable):**

      *   *Non-Negotiable:* The Mechanism of Paralysis (R4), Functional Differentiation (R1), Agency/Determinism (R5). If a theory says history determines us completely, it fails Nietzsche's core premise. If it doesn't explain *why* too much history stops action, it's just poetry.
      *   *Relaxable:* Specifics of the three modes (Nietzsche's taxonomy might need updating), Pre-literate specifics (less relevant to digital age but theoretically important).

  5.  **Identifying the "Killer Constraint":**

      *   Most popular theories treat history as either *Moral Education* (learn from mistakes) or *Trauma Storage* (never forget).
      *   *The Killer:* **Requirement 4 (Mechanism of Paralysis) + Requirement 5 (Agency).**
      *   Why? Moral education assumes more history = better decisions (linear progress). Trauma storage assumes more memory = healing (catharsis). Nietzsche argues *more history = sickness/paralysis*. A theory that doesn't account for the *toxicity* of perfect memory fails the "Vitality" test.

  6.  **Evaluating Candidates:**

      *   *Candidate A: Standard Liberal Humanism (History as Moral Teacher).* Fails R4 (doesn't explain paralysis).
      *   *Candidate B: Trauma Theory/Adorno (History as Duty to Remember).* Fails R2 (Forgetting) and R6 (Weaponization).
      *   *Candidate C: Nietzschean/Deleuzian Vitalism.* Strong on R2, R4. Weak on R7 (Embodiment/Science).
      *   *Candidate D: Cognitive/Evolutionary Psychology (Predictive Processing).* Strong on R2, R4, R7. Weak on R1 (Normative modes).
      *   *Candidate E: Stiegler/Technics of Memory.* Strong on Digital context. Weak on Biological vitality.

      *   *Synthesis Candidate:* **Predictive Processing + Vitalist Normativity.** (The brain predicts to minimize surprise; history is training data. Too much data = overfitting = paralysis.)

  7.  **Addressing the AI Edge Case:**

      *   AI curation = Externalized "Forgetting/Remembering."
      *   If AI optimizes for engagement, it likely amplifies Monumental (heroes/villains) or Critical (grievance) based on clicks.
