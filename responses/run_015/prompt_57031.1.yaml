answer: |-
  **Case A — shame without guilt.**

  Elena is a senior archivist at a municipal records office. She processes the donated papers of the city's founding mayor, a figure celebrated for local development. The files reveal he legally purchased land from indigenous families using loopholes now recognized as coercive, though lawful at the time. Professional ethics mandate neutral description; Elena catalogs the deeds without commentary, exercising due care and violating no protocols. The exhibit opens, celebrating the mayor. Elena realizes her neutral cataloging sanitizes the dispossession, making her the mechanism by which the injustice is rendered invisible. She broke no rules; she was not negligent. Yet she is implicated in the erasure. She feels shame. She decides to append a contextual note to the digital finding aid, violating neutrality protocols to align her work with truth-telling. Guilt cannot motivate this: there is no wrongful act to repair, only a self to realign.

  **Analysis of Case A**

  **Intentional Object:**
  For guilt, the object is the specific act of neutral cataloging. For shame, the object is Elena *as* the archivist who enables erasure. Guilt asks, "What did I do?" Shame asks, "Who am I in this structure?"

  **Appraisal Conditions:**
  Guilt requires a violation of a legitimate norm or duty. Elena violated none; neutrality was her duty. Thus, guilt's appraisal conditions fail. Shame requires a discrepancy between the agent's self-conception (a guardian of truth) and their actual position (an instrument of sanitization). This discrepancy exists independently of rule-breaking.

  **Action Tendency:**
  Guilt issues in reparation: undoing the wrong or compensating the victim. Since the cataloging was not wrongful, there is nothing to repair retroactively. Shame issues in withdrawal or re-orientation of the self's commitments. Elena's addition of the note is not repair of the past act (which remains neutral) but a re-orientation of her future standing as an archivist.

  **Verdict:**
  Shame is appropriate; guilt is structurally unavailable.

  **Reasoning:**
  The divergence falls out of the norm-dependence of guilt versus the identity-dependence of shame. Elena's implication is real (she benefits from the completed exhibit; her labor enables the erasure), but it is non-culpable. Guilt cannot latch onto non-culpable implication without distorting into agent-regret. Shame, however, targets the self's relation to values (truth vs. neutrality) rather than adherence to rules. The productive response (breaking protocol to add context) is a transformation of professional identity, which shame drives, whereas guilt would demand restoring the status quo ante (which was unjust) or apologizing for following rules (which implies fault where there was none).

  **Case B — guilt without shame, as a mirror.**

  Later, Elena accidentally spills coffee on a rare, uncataloged letter, permanently staining the ink. She violated a clear preservation duty through carelessness. If she responds with shame, she dwells on her clumsiness and unworthiness to handle the collection, potentially withdrawing from the work entirely. If she responds with guilt, she focuses on the damaged object and initiates restoration protocols immediately.

  **Analysis of Case B**

  **Intentional Object:**
  For guilt, the object is the act of spilling. For shame, the object is Elena as a careless person.

  **Appraisal Conditions:**
  Guilt requires a norm violation (preservation duty). This is met. Shame requires a global self-assessment. This is also met, but irrelevant to the moral demand.

  **Action Tendency:**
  Guilt issues in reparation (restoration). Shame issues in hiding or withdrawal.

  **Verdict:**
  Guilt is appropriate; shame is morally counter-productive.

  **Reasoning:**
  The moral work here is fixing the damage. Guilt's action tendency aligns perfectly with this requirement. Shame's tendency (withdrawal) removes the agent from the site of repair. Furthermore, shame turns attention to Elena's standing ("I am clumsy") rather than the victim's loss (the letter). In this clear violation case, guilt's act-focused structure outperforms shame's self-focused structure, confirming the asymmetry: shame is not generally superior, but uniquely necessary in Case A.

  **The honest part**

  (a) **The Single Feature:** The operative feature in Case A is **non-culpable structural complicity**. Elena is causally and morally implicated in a harm (erasure) through her role, yet she satisfies all local normative requirements (neutrality). This creates a gap where rule-based emotions (guilt) have no purchase, but value-based emotions (shame) do.

  (b) **Weakening the Feature:** If Elena's implication is made tenuous (e.g., she only filed the box, not cataloged the content), the shame becomes disproportionate and collapses into mere sadness. If the "no-audience" stipulation is dropped, the response risks becoming fear of exposure or social anxiety rather than moral shame. The verdict holds only so long as the complicity is real but the fault is absent.

  (c) **Best Attacks:** A guilt-primacy defender would likely argue: (1) The response is **agent-regret**, not shame, as it concerns outcomes rather than self; (2) The shame is really **guilt about a disposition** (being the sort of person who follows unjust rules); (3) The action could be motivated by **virtue** without emotion. The strongest attack is (2): re-describing the shame as guilt about the disposition of "blind neutrality." My case is softest here. To resist this, I must insist that guilt requires a *violation*, whereas Elena's disposition was professionally *virtuous* by local standards. If guilt can target dispositions that are not violations, the concept of guilt becomes so flexible it loses its distinct act-based definition, conceding my point that the standard division of labour is unsustainable.
