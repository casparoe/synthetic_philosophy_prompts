      **Student Name:** [My Name]
      **Course:** History-Philosophy Elective
      **Date:** [Today's Date]

      **Research Question**
      The "Hinge of History" hypothesis suggests that history isn't a smooth line but has pivot moments where a small choice changes the whole timeline. Usually, people assume a hinge has to be obvious while it's happening, like a war starting or a big invention. My project asks: Does the hypothesis actually require hinges to be visible to people living through them? Or can there be "hidden hinges"—like tiny bureacratic decisions that only look huge fifty years later?

      If hinges must be visible, then historians are basically just picking winners in retrospect and the theory is circular. If hidden ones count, then we need some rule to tell them apart from random noise, or else the theory explains everything and nothing. I want to figure out which one it is.

      **Why Existing Answers Don't Settle It**
      People talk alot about big obvious turning points but never really define what makes something a hinge versus just a regular cause. Like, WW2 is obviously a hinge, but was a specific meeting in 1938 a hinge? The narrativist stuff says we always construct hinges after the fact, which is helpful, but that still doesnt say whether visibility is part of the concept itself or just an accident. Existing literature treats "importance" as the same thing as "visibility," and I think that's a mistake. They leave open whether a hinge is a real thing in the moment or just a story we tell later.

      **Approach vs. Alternatives**
      Instead of a big lit review im gonna pick three case studies where a decision seemed boring at the time but had massive downstream effects. Then I'll check if they still count as hinges under both a visible-definition and a hidden-definition.
      *   *Case Selection:* I need events that were mundane initially but changed everything (e.g., a specific zoning law, a ignored intelligence report, a minor patent filing).
      *   *Comparison:* I will compare these against "visible" hinges (declarations of war, elections) to see if the philosophical weight is the same.

