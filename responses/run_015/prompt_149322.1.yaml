      **Timeline**
      *   **Week 1-3:** Pick cases and do background reading. Need to make sure the "boring" decisions actually had big effects.
      *   **Week 4-8:** Run the comparison. Analyze the cases against the visible/hidden criteria.
      *   **Week 9-12:** Write up. Drafting, revising, and final polish.

