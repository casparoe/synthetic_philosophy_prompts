answer: |-
  This is a strong list. You clearly know the literature, and you've identified the classic pressure points (Indeterminacy, Swampman, Novelty). However, since you mentioned she has "her own version" of the view and you want to avoid questions she's answered "a hundred times," we need to sharpen the phrasing. The goal is to move from "Here is the textbook objection" to "Here is how that objection applies to the specific theoretical machinery you are deploying."

  I have reordered your list for logical flow (starting with the core mechanism, moving to scope, then implications), refined the wording to sound more like a colleague than a student, and added one crucial question about **Epistemic Access** (how we *know* functions), which is often more damaging than Swampman. I also merged your Indeterminacy and Misrepresentation points slightly, as they are two sides of the same coin, to make room for the new question.

  Here is a revised set of 8 questions, with likely replies and follow-ups.

  ### 1. The Consumer & Indeterminacy (Refining your Q1)
  **The Question:** "The standard Millikan move on indeterminacy is to appeal to the consumer system: content is fixed by how downstream mechanisms use the signal. But doesn't this just relocate the indeterminacy? If the consumer system is also a biological mechanism with its own selection history, what fixes *its* interpretive function? Are we not facing a regress of functions, or do we have to posit a 'final consumer' that doesn't itself represent?"

  **Likely Reply:** She will likely argue that the regress stops at the point of **direct proper functions**—mechanisms that produce a behavioral output directly (like a muscle contraction) rather than another representation. The content is fixed by the conditions under which that final behavior succeeds biologically.

  **Follow-up:** "But doesn't that collapse semantic normativity into mere biological success? If the 'final consumer' is a motor mechanism, its 'success' is just causal efficacy. How do we get *truth conditions* out of *causal success conditions* without conflating 'working' with 'being true'?"

  ### 2. Misrepresentation & Selection History (Refining your Q2)
  **The Question:** "You ground content in selection history. But selection selects for *correlations* that were reliable in the past. When a state is tokened in a novel environment (like the frog seeing a BB), is the error that it violates its *current* truth conditions, or that it violates its *historical* success conditions? If it's the latter, doesn't that make content essentially backward-looking in a way that seems disconnected from the organism's current cognitive grip on the world?"

  **Likely Reply:** She will distinguish between **selection of** (the trait was selected) and **selection for** (the trait was selected *because* it did X). She will argue the content is fixed by what it was selected *for* (flies), so firing at BBs is a malfunction, hence misrepresentation.

  **Follow-up:** "I understand the distinction, but in the actual history of the lineage, the mechanism likely fired at flies, shadows, and BBs indiscriminately. The selection pressure was on the *survival value* of the behavior, not the semantic accuracy. How do you isolate the semantic property from the broader survival disposition without smuggling in an intuition about what the frog 'means'?"

  ### 3. Swampman & Methodological Cost (Refining your Q3)
  **The Question:** "Many teleosemanticists bite the Swampman bullet: no history, no content. I want to press the methodological cost of this. If Swampman behaves exactly like me but lacks content, does cognitive science apply to him? If we explain his behavior using representational vocabulary, are we speaking falsely? If so, doesn't this make content an occult property that is invisible to empirical investigation?"

  **Likely Reply:** She will likely say that cognitive science *is* the study of evolved systems, so Swampman is outside the domain of the theory. She might argue that we speak metaphorically about Swampman, or that he acquires content very quickly once he interacts with the environment.

  **Follow-up:** "If it's metaphorical, then teleosemantics isn't analyzing our folk-psychological concept of belief, but replacing it with a technical one. Are you comfortable saying that your theory is revisionary? That when we say 'Swampman believes there is a tree,' we are strictly speaking wrong?"

  ### 4. Novel Concepts & Derived Content (Refining your Q4)
  **The Question:** "Let's move to human cognition. We have concepts like 'hedge fund' or 'quark' that have no selection history. The standard story is 'derived content': these are built from primitive representations that *do* have selection histories. But what is the mechanism of derivation? If the learning process itself is a cognitive process, does *it* require content to operate? Are you presupposing the very intentionality you're trying to naturalize at the ground floor of learning?"

  **Likely Reply:** She will argue for a **mapping account**. We map new symbols onto old indicator systems. The learning mechanism itself is a biological function (e.g., pattern recognition) selected for flexibility. The content is derived via a functional role that piggybacks on underived content.

  **Follow-up:** "But for the mapping to be non-arbitrary, the system has to recognize the *relevant similarity* between the new concept and the old indicator. Doesn't recognizing that similarity already require a contentful state? It feels like we need content to get content, which threatens the reductive project."

  ### 5. Scaling Up to Propositional Attitudes (Refining your Q5)
  **The Question:** "Teleosemantics works intuitively for sub-personal states (edge detectors, fly detectors). But does the same machinery scale to propositional attitudes like 'believing that democracy is fragile'? The selection history of a belief that complex seems impossible to individuate. Are you suggesting there is a specific selected function for *that* specific belief, or is the function at the level of a general capacity for belief-formation?"

  **Likely Reply:** It is almost certainly at the level of **general capacities**. The function is to have a belief-forming mechanism that tracks truth in a certain domain, not that specific token belief.

  **Follow-up:** "If the function is at the level of the general capacity, how do you individuate the content of specific tokens? If the function is 'track truth about politics,' that's too broad to fix the content 'democracy is fragile' specifically. How do you get fine-grained content from coarse-grained functions?"

  ### 6. Logic, Math, and Normativity (Refining your Q6)
  **The Question:** "Biological functions are normative in the sense of 'what ought to happen for the organism to survive.' But logical and mathematical norms seem different. '2+2=4' isn't true because it helped our ancestors survive. How does a theory grounded in reproductive success account for the normativity of logic? Are logical concepts just useful fictions, or do they have teleosemantic content too?"

  **Likely Reply:** She will likely argue that the *capacity* for logical reasoning was selected for, even if the specific truths weren't. Or, she might argue that mathematical concepts are tools for tracking real relations in the environment that *were* fitness-relevant (e.g., quantity, spatial relations).

  **Follow-up:** "But the validity of Modus Ponens doesn't depend on fitness. If we evolved in a world where logical reasoning led to death, would Modus Ponens be false? If your theory implies that logical norms are contingent on selection history, that's a hard bullet to bite. Do you accept that contingency?"

  ### 7. Epistemic Access (The New "In the Weeds" Question)
  **The Question:** "This is a worry about empirical tractability. Content is fixed by selection history. But selection history is often opaque to empirical investigation. We can't always distinguish whether a trait was selected *for* X, or was a byproduct of selection for Y. If content depends on facts that are potentially unknowable, doesn't that make content itself unknowable? How can a naturalistic theory posit facts that are in principle inaccessible to science?"

  **Likely Reply:** She will argue that we don't need the *full* history, just enough to identify the **Proper Function** in the current context. We can infer functions from current design and contribution to fitness, similar to how biologists attribute functions without knowing the exact evolutionary timeline.

  **Follow-up:** "Biologists can be wrong about functions, though. If they are wrong about the function, are they wrong about the *content*? If so, then semantic interpretation is hostage to paleontological speculation. That seems to make the philosophy of mind dependent on empirical conjectures in a way that undermines its conceptual role."

  ### 8. The "Hardest Problem" (Your Q7)
  **The Question:** "Finally, setting aside the standard objections you've likely heard before: What is the single hardest problem for your specific version of teleosemantics right now? Is there a gap in the theory that keeps you up at night, or a phenomenon you haven't yet been able to fully accommodate?"

  **Likely Reply:** (Varies, but usually something about) Consciousness, the specific nature of the "Consumer," or handling infinite productivity of language.

  **Follow-up:** (Listen closely). "Do you see that as a problem that can be solved within the teleosemantic framework, or does it suggest we need a hybrid view?"

  ---

  ### Moderation Tips for the Session

  1.  **Tailor to Her Papers:** Since you mentioned she has "her own version," scan her recent abstracts. If she emphasizes **Predictive Processing**, ask how teleosemantics fits with prediction error minimization (which is often ahistorical). If she emphasizes **Normativity**, lean harder on Q6.
  2.  **Manage the "Standard" Replies:** Teleosemanticists have very polished defenses for Swampman and the Disjunction Problem. If she starts giving the "Standard Millikan Answer," use your follow-up to interrupt gently: *"I see how that works for the frog, but I'm worried about how that scales to the logic question..."*
  3.  **Audience Management:** If the Q&A drags on the first question, be ready to say: *"We have a lot of questions on the scope of the theory, so let's move to the novelty objection."*
  4.  **The "Steamroll" Defense:** If she gives a long, technical answer that confuses the room, don't pretend you understood. It is perfectly professional to say: *"Let me see if I can summarize that to make sure the audience follows..."* This gives you control and ensures the follow-up lands.

  This list moves from the mechanism (1-2) to the scope (3-5) to the implications (6-7) and ends on a collaborative note (8). It shows you respect the theory enough to know its weak points without being hostile. Good luck!
