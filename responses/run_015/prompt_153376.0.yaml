answer: |-
  The question forces candidates to decide whether luck egalitarianism can survive the realization that choice itself is often a product of brute luck without abandoning its core commitment to responsibility.

  ### A. Examination Question

  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 900 words
  **Total Marks:** 20

  **Question:**

  In the imaginary Republic of Varrania, the state operates the **Equal Risk Scheme**. Each year, every citizen's disposable income is adjusted by a "luck audit" designed to distinguish between misfortune caused by chance and misfortune caused by choice. The audit works as follows:

  1.  Officials construct, for each citizen, a **counterfactual twin**: a person placed in the same social position and with the same legal rights, but endowed with the average bundle of native endowments (health, talents, temperament) and an average-quality upbringing.
  2.  Any shortfall between the citizen's income and the twin's is attributed to **brute luck** and is cancelled by a state transfer. (A misfortune counts as brute luck when it did not flow from any choice of the agent.)
  3.  Any shortfall that flows from the citizen's own choices is left standing; the citizen bears it. (A misfortune counts as **option luck** when it is the outcome of a gamble the agent knowingly took.)
  4.  Officials treat a choice as genuinely the agent's own, and therefore as a responsibility-bearing choice, only when three conditions hold: the agent had adequate information about the risks, was not coerced, and could reasonably have foreseen the outcome.
  5.  Varrania maintains a modest floor below which no one is allowed to fall, but it insists that the floor is humanitarian relief rather than justice. Justice, it says, is done by the audit.

  Varrania's actuaries have recently published two awkward findings:
  (i) **The Endogeneity of Choice:** The choices that show up in the audit are themselves distributed by brute luck. People who grew up in poverty, or who inherited a temperament low in impulse control, are markedly more likely to make exactly the choices—casual work, no saving, early dropout—that leave them short of their twin. The audit therefore converts brute luck into apparent option luck, and the transfers shrink towards zero precisely for those who began worst off.
  (ii) **Covariant Losses:** Some losses are covariant. When Varrania's shipbuilding region collapses after a trade shock, everyone who chose to work there loses at once, and no private insurer would ever have covered the risk, since there is no pool across which to spread it.

  **Write an essay that addresses the following three parts:**

  1.  Explain why Varrania's architects would say the Equal Risk Scheme is the most natural institutional expression of luck egalitarianism—why the audit, and not merely the floor, is supposed to be where the justice is.
  2.  Give a verdict on the actuaries' findings: do they refute the scheme, or can it be reformed so that it survives them? You must pick the strongest reform available (for instance, relocating the luck/choice cut from outcomes to opportunities, or confining compensation to a baseline) and defend that reform against the strongest objection to it.
  3.  State what your answer to part 2 shows about what sort of doctrine luck egalitarianism actually is: is it fundamentally a view about treating people as equals, or a view about people getting what they deserve, and can it coherently be both?

  **Instruction to Candidates:**
  You are expected to use the terms "brute luck" and "option luck" correctly, but defining them is not enough to earn high marks. To score above 12/20, you must take a position on whether the scheme can be saved and explain what that implies about the purpose of equality. Answers that merely describe the distinction without solving the problem posed by finding (i) will be capped at a middling grade.

  ***

  ### B. Model Answer

  The architects of Varrania believe justice requires neutralizing the effects of chance while holding individuals accountable for their choices. The Equal Risk Scheme expresses this by using the counterfactual twin to isolate brute luck. If a citizen earns less than their twin solely because of a disability or a market crash unrelated to their conduct, that is brute luck, and justice demands compensation. However, if the shortfall results from a gamble taken with adequate information and no coercion, that is option luck, and justice permits the loss. The floor is merely humanitarian because it addresses need without distinguishing cause; the audit is justice because it respects agency. By compensating only for unchosen disadvantages, the scheme treats citizens as equals who are responsible for their own lives, rather than as victims to be managed.

  However, the actuaries' first finding threatens to collapse this distinction. If temperament and upbringing determine the capacity to make prudent choices, then "option luck" is often just brute luck in disguise. A person born with low impulse control did not choose that temperament; therefore, penalizing them for the resulting choices violates the theory's own core principle. Finding (ii) reinforces this by showing that some risks labeled as individual choices (working in shipbuilding) are actually systemic vulnerabilities that no individual could insure against. Together, these findings suggest the current audit punishes people for luck they could not control, mistaking structural disadvantage for personal irresponsibility.

  The scheme is not refuted, but it must be reformed to survive. The strongest reform is to shift the locus of compensation from ex-post outcomes to ex-opportunities. Instead of asking "did this choice cause the loss?", the state should ask "did this person have a genuine capacity to choose otherwise?" This requires compensating for unequal capacities—such as impulse control or educational background—before the choice is made. Under this reform, the citizen with low impulse control receives resources to mitigate that disadvantage, ensuring their choices are genuinely theirs. Regarding covariant risks, these should be reclassified as brute luck because they cannot be diversified by any individual agent; the state must act as the insurer of last resort for systemic shocks.

  The strongest objection to this reform is that it is paternalistic and epistemically impossible. How can the state measure "capacity to choose" without intrusive surveillance, and does compensating for temperament not treat adults like children? This objection fails because the alternative is worse: holding people responsible for factors they cannot control is not respect, it is abandonment. True respect requires ensuring agents have the actual power to govern their lives, not just the formal right. If we refuse to compensate for unequal capacities, we are not holding people responsible; we are punishing them for their genetics. Intrusion is a cost we must bear to ensure the legitimacy of the responsibility we impose.

  This leads to a conclusion about the doctrine itself. Luck egalitarianism cannot fundamentally be about desert. If it were about desert, the person who chose poorly would deserve their poverty regardless of their impulse control. The necessity of the reform shows the theory is actually about relational equality: ensuring no one is inferior to others due to circumstances beyond their control. It seeks to eliminate oppressive hierarchies of luck, not to reward moral virtue. It can coherently be both only if we understand "desert" not as moral worthiness, but as the legitimate outcome of a fair game. Since the game is currently rigged by brute luck, justice requires fixing the board before judging the players. Therefore, luck egalitarianism is a view about equal standing, using responsibility only as a tool to secure that standing, not as an end in itself.

  ***

  ### C. Marking Scheme

  | Point | Marks | Specific Move or Claim Required | Common Error / Cap |
  | :--- | :--- | :--- | :--- |
  | **1. Varrania's Logic** | 4 | Explains that the audit distinguishes unchosen disadvantage (brute) from chosen gamble (option) to respect agency while ensuring equality. | Defining terms without explaining *why* this constitutes justice (caps at 10/20). |
  | **2. Critique of Finding (i)** | 4 | Identifies that if choices are determined by temperament/upbringing, penalizing them violates the brute luck principle (endogeneity of choice). | Treating finding (i) as a practical glitch rather than a theoretical contradiction (caps at 12/20). |
  | **3. The Reform** | 4 | Proposes a specific structural change (e.g., compensating capacities ex-ante or reclassifying covariant risks as brute luck). | Vague suggestions like "give more money" without linking to the luck/choice cut (caps at 14/20). |
  | **4. Defense of Reform** | 4 | Anticipates a strong objection (e.g., paternalism/impossibility) and argues why the reform is necessary for legitimacy. | Asserting the reform is good without addressing the cost or objection (caps at 16/20). |
  | **5. Doctrinal Conclusion** | 4 | Concludes that the theory is about equal standing/relations, not moral desert, and explains how responsibility serves equality. | Claiming it is about desert or failing to link part 2 to the nature of the doctrine (caps at 18/20). |

  **Discrimination Rules:**
  *   **The B Cap:** An answer that correctly defines brute and option luck and explains Varrania's system but fails to propose a specific reform for Finding (i) cannot exceed **12/20**. Fluency without solution is insufficient.
  *   **The A Differentiator:** To exceed **16/20**, the candidate must explicitly argue in Part 3 that responsibility is instrumental to equality, not an independent moral truth. Answers that treat responsibility as an absolute constraint rather than a tool for equality cannot reach the top band.
  *   **Word Count:** Significant deviation from 900 words (±15%) incurs a 1-mark penalty.
