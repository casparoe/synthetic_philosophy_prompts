prompt: |-
  My lab has started reporting self-consistency numbers on evals: sample the model k times at temperature 0.8, take the most common answer, report that. One guy on the team insists this is literally an instance of the Condorcet jury theorem — each sample is a voter with competence p > 1/2, the votes are independent, so majority accuracy goes to 1 as k grows, and we can pick k the way youd size a jury. He also wants to weight samples by the models own confidence score, on the grounds that better voters should count more; that bit i think is importing something the theorem doesnt say, since the version i know is equal-weight majority over voters with the same p.

  Can you audit the analogy? Give me the correspondence table — what plays the role of the voter, of p, of independence, of the binary proposition, of the truth — and then the places the mapping breaks. The ones i care about: our votes come out of one model with shared weights and shared pretraining, so they have a common cause (is that like a jury with a shared bias, and how much correlation does the theorem tolerate before the result stops holding?); the theorem is binary but our majority is over an open answer space, or over 4–5 options when its multiple choice (does the guarantee weaken as options multiply, and in what way?); and p is a property of voters, whereas what we vary is the *question* — on the hard items wed actually bother running this on, per-sample accuracy could be under half, and then majority makes things worse. In practice our gains flatten out around k = 5, which seems to tell against the asymptotic story.

  Then: does the conclusion he wants — its not a hack, its asymptotically justified, we can buy accuracy with compute — survive, or was the analogy carrying it? And if theres a better thing to compare k samples to than k jurors, say what. Please separate whats just the mathematics under stated assumptions from whats genuinely contested among people who work on this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** The user's lab is using "self-consistency" (sampling a model $k$ times at $T=0.8$, taking the mode) for evaluations.
      *   **Colleague's Claim:** This is an instance of the Condorcet Jury Theorem (CJT). Each sample is a voter with competence $p > 1/2$, votes are independent, majority accuracy $\to 1$ as $k \to \infty$. He also wants to weight by confidence.
      *   **User's Skepticism:**
          *   CJT assumes equal weights (confidence weighting might violate this).
          *   Samples come from *one* model (shared weights/pretraining), implying correlation/common cause.
          *   CJT is binary; tasks are often open-ended or multi-choice (4-5 options).
          *   $p$ varies by question (on hard items, $p < 1/2$), making majority harmful.
          *   Empirical gains flatten at $k=5$, contradicting asymptotic claims.
      *   **Tasks:**
          1.  Audit the analogy (Correspondence Table).
          2.  Identify where the mapping breaks (Correlation, Multi-class, Variable $p$).
          3.  Evaluate the conclusion (Is it justified? Is it a hack?).
          4.  Suggest a better analogy if applicable.
          5.  Distinguish math from contested empirical claims.

  2.  **Analyze the Condorcet Jury Theorem (CJT):**

      *   **Core Assumptions:**
          1.  Binary choice (True/False, A/B).
          2.  $n$ voters.
          3.  Independence of votes (conditional on the truth).
          4.  Competence $p_i > 0.5$ for all voters (or average $p > 0.5$).
          5.  Sincere voting (voters vote for what they believe is true).
      *   **Conclusion:** Probability of correct majority vote approaches 1 as $n \to \infty$.
      *   **Weighted Version:** There are extensions for weighted votes, but they require specific conditions on weights relative to competence.

  3.  **Analyze Self-Consistency (SC) in LLMs:**

      *   **Mechanism:** Sample $k$ reasoning paths/answers from the *same* model with stochastic decoding.
      *   **Aggregation:** Majority vote over final answers.
      *   **Reality:**
          *   Outputs are correlated (same weights, same context).
          *   Competence $p$ is question-dependent.
          *   Output space is often large (open generation) or multi-class.
          *   Temperature introduces randomness, but is it "independent noise" or "correlated exploration"?

  4.  **Drafting the Correspondence Table:**

      *   *Voter* $\leftrightarrow$ Single sampled completion.
      *   *Competence ($p$)* $\leftrightarrow$ Probability a single sample is correct (given the question).
      *   *Independence* $\leftrightarrow$ Stochastic independence of decoding steps (conditional on prompt/model).
      *   *Binary Proposition* $\leftrightarrow$ Correct vs. Incorrect (or Option A vs. Not A).
      *   *Truth* $\leftrightarrow$ Ground truth label.

  5.  **Auditing the Breaks (The "Stress Test"):**

      *   **Correlation (The Big One):** CJT requires conditional independence. LLM samples share weights. If the model *doesn't know* the fact, all samples are likely to hallucinate similarly. This violates independence. It's more like a jury that all read the same biased newspaper before deliberating.
      *   **Competence ($p < 0.5$):** CJT fails catastrophically if $p < 0.5$. In LLMs, on hard questions, the model might be confidently wrong. SC amplifies errors here.
      *   **Multi-class/Open-Ended:** CJT is strictly binary. For $M$ options, the threshold for $p$ changes ($p > 1/M$). For open-ended, "majority" is ill-defined unless answers cluster semantically.
      *   **Weighting:** Weighted CJT exists but requires knowing the competence to set weights. Using *confidence* as a proxy for competence is risky (calibration issues).
      *   **Asymptotics vs. $k=5$:** The flattening at $k=5$ suggests diminishing returns due to correlation. If they were truly independent, gains would continue longer.

  6.  **Evaluating the Colleague's Conclusion:**

      *   "It's not a hack, it's asymptotically justified": False. The asymptotic justification relies on assumptions (independence, $p>0.5$) that do not hold strictly.
      *   "We can buy accuracy with compute": True in practice (up to a point), but not for the reasons CJT states. It's more about "error correction via sampling" than "jury wisdom."
      *   Is it a hack? It's a heuristic with theoretical backing in specific limits, but the CJT analogy is loose.

  7.  **Finding a Better Analogy:**

      *   *Ensemble Methods (Bagging):* This is closer. Bootstrapping data vs. sampling decoding paths.
      *   *Monte Carlo Integration:* Estimating a distribution over outputs.
      *   *Error Correction Coding:* Redundancy to overcome noise.
      *   *Best Fit:* **Correlated Ensemble.** Acknowledges the shared weights.

  8.  **Distinguishing Math vs. Contested Empirics:**

      *   *Math:* CJT proof is solid *given* assumptions. Weighted CJT exists *given* known weights.
      *   *Empirics:* Are LLM samples independent? (No). Is $p > 0.5$ on hard evals? (Sometimes no). Does confidence correlate with accuracy? (Often poorly calibrated).

  9.  **Structuring the Response:**

      *   **Executive Summary:** Validate the user's skepticism. The analogy is evocative but technically flawed.
      *   **Correspondence Table:** Clear mapping.
      *   **The Breaks (Detailed Analysis):**
          *   Independence (Shared Weights).
          *   Competence ($p < 0.5$ risk).
          *   Cardinality (Binary vs. Multi/Open).
          *   Weighting (Confidence $\neq$ Competence).
      *   **The Verdict on the Conclusion:** Asymptotics don't hold, but practical gains are real for different reasons.
      *   **Better Analogy:** Correlated Ensemble / Monte Carlo.
      *   **Math vs. Contested:** Clear separation.

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to mention that temperature sampling *does* introduce some independence, but it's conditional on the model's latent knowledge. If the knowledge is missing, temperature just samples different hallucinations.
      *   *Nuance:* The "Weighted CJT" point. Nitzan and Paroush (1982) showed optimal weights are log-odds of competence. Using confidence scores is a heuristic approximation of this, but only if calibrated.
      *   *Empirical Reality:* Mention that $k=5$ flattening is a known phenomenon in SC literature (e.g., Wang et al., 2023), usually attributed to the diversity limit of the model.

  11. **Final Polish:** Ensure tone is professional, analytical, and directly answers the prompt's specific questions. (Check: Did I address the $p$ vs. question variance? Yes. Did I address the correlation? Yes.)

  12. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is an audit of the Condorcet Jury Theorem (CJT) analogy as applied to LLM self-consistency.

  ### Executive Summary
  Your skepticism is well-founded. The CJT analogy is **evocative but technically brittle**. It provides a comforting theoretical veneer for a heuristic that works in practice for different reasons. Your colleague's claim that this is "asymptotically justified" in the CJT sense is mathematically false because the independence and competence assumptions are systematically violated in LLMs. However, the practical conclusion ("spending compute buys accuracy") often holds, just not because of Condorcet.

  ---

  ### 1. The Correspondence Table

  | Condorcet Jury Theorem Concept | Self-Consistency Analogue | Status of Mapping |
  | :--- | :--- | :--- |
  | **The Voter** | A single sampled completion (at $T=0.8$). | **Loose.** A "voter" implies an agent; a sample is a stochastic trajectory from one agent. |
  | **Competence ($p$)** | $P(\text{sample is correct} \mid \text{question})$. | **Broken.** In CJT, $p$ is a property of the voter. In SC, $p$ is a property of the *question-model pair*. |
  | **Independence** | Stochastic independence of decoding tokens. | **Failed.** Samples are conditionally independent given weights, but marginally highly correlated due to shared parameters. |
  | **Binary Proposition** | Correct vs. Incorrect (or Option A vs. $\neg$A). | **Strained.** CJT requires binary truth. SC often aggregates over high-cardinality text spaces. |
  | **The Truth** | Ground truth label. | **Match.** |
  | **Majority Rule** | Mode of the $k$ samples. | **Match.** |
  | **Weighted Vote** | Weighting by model confidence (logprob). | **Theoretically valid but empirically risky.** (See below). |

  ---

  ### 2. Where the Mapping Breaks

  You identified the three critical failure points. Here is the technical breakdown of why they invalidate the CJT guarantee.

  #### A. The Correlation Problem (Shared Weights)
  *   **CJT Assumption:** Votes are independent conditional on the truth. If the truth is $T$, Voter 1 voting $T$ tells you nothing about Voter 2 voting $T$.
  *   **LLM Reality:** Samples are drawn from $P_\theta(\text{answer} \mid \text{prompt})$. The parameters $\theta$ are fixed.
  *   **The Break:** This is not a jury of 10 people; it is **one person asked 10 times**. If the model lacks the knowledge (a "systematic error"), temperature sampling does not recover the truth; it samples from the distribution of *plausible hallucinations*.
  *   **Tolerance:** CJT tolerates *some* correlation, but the convergence rate slows drastically. If correlation $\rho > 0$, the error rate does not go to 0 as $k \to \infty$; it plateaus at $\rho$. The flattening you see at $k=5$ is the empirical signature of this correlation ceiling. You are hitting the "diversity limit" of the model's posterior, not the asymptotic limit of independent voters.

  #### B. The Competence Problem ($p < 1/2$)
  *   **CJT Assumption:** $p > 1/2$ for every voter (or on average).
  *   **LLM Reality:** $p$ is not fixed. On easy items, $p \approx 0.9$. On hard items (the ones you care about for evals), $p$ can easily drop to $0.3$.
  *   **The Break:** CJT has a "phase transition." If average $p < 1/2$, majority vote accuracy converges to **0** as $k \to \infty$. By running self-consistency on hard questions where the model is mostly wrong, you are actively amplifying error.
  *   **Nuance:** In multiple choice with $M$ options, the threshold is $p > 1/M$. For 4-option MC, $p$ only needs to be $>0.25$. This saves the analogy slightly for MCQs, but for open-ended generation (effectively $M \to \infty$), the "correct" answer often has probability mass $< 1/2$ even for good models.

  #### C. The Cardinality Problem (Binary vs. Open)
  *   **CJT Assumption:** Binary choice.
  *   **LLM Reality:** Open text or 5+ options.
  *   **The Break:** As options multiply, the probability mass of the correct answer dilutes. In open-ended math reasoning, two *correct* reasoning paths might end in slightly different phrasing, splitting the "correct" vote. Two *incorrect* paths might hallucinate the same wrong number (e.g., "42"), consolidating the "wrong" vote. This violates the assumption that errors are random; errors are often **mode-collapsing**.

  #### D. Weighted Votes (Confidence)
  *   **CJT Extension:** Weighted CJT exists (Nitzan & Paroush, 1982). Optimal weight $w_i \propto \log(\frac{p_i}{1-p_i})$.
  *   **Your Colleague's Plan:** Weight by confidence score (logprob of the answer).
  *   **The Break:** This assumes confidence is calibrated to competence ($p$). LLMs are notoriously miscalibrated. A model can be highly confident ($p_{\text{model}} \approx 0.99$) and wrong. If confidence correlates with *fluency* rather than *truth*, weighting amplifies hallucinations. It is theoretically sound *if* confidence $\approx$ competence, but empirically contested.

  ---

  ### 3. Verdict on the Conclusion

  **Claim:** *"It's not a hack, it's asymptotically justified, we can buy accuracy with compute."*

  **Audit:**
  1.  **"Asymptotically justified": False.** Under CJT assumptions, accuracy $\to 1$. Under LLM realities (correlation + variable $p$), accuracy $\to \text{Ceiling} < 1$. The asymptote is bounded by the model's intrinsic knowledge, not the sampling process.
  2.  **"Buy accuracy with compute": True, but diminishing.** You are buying **variance reduction**, not bias reduction. If the model is biased (wrong), more compute won't fix it. The flattening at $k=5$ confirms you are exhausting the useful variance.
  3.  **"Not a hack":** It is a **heuristic with ensemble properties**. It is standard practice in ML (e.g., Monte Carlo Dropout, Deep Ensembles). Calling it CJT is "physics envy"—importing a social choice theorem where an ensemble learning framework fits better.

  **Survival of the Conclusion:** The practical advice (use $k=5$ self-consistency) is good. The theoretical justification (CJT) is wrong. Do not let the theorem drive your eval design (e.g., do not assume $k=20$ will fix hard questions).

  ---

  ### 4. A Better Analogy

  Do not compare $k$ samples to $k$ jurors. Compare them to:

  **1. Correlated Ensemble (Bagging)**
  In Random Forests, we build many trees on bootstrapped data. They are diverse but correlated. Accuracy improves with $k$ until the correlation dominates. This matches your $k=5$ flattening perfectly. It acknowledges shared weights ($\theta$) as the source of correlation.

  **2. Monte Carlo Integration**
  You are estimating the expectation of the answer distribution: $\mathbb{E}_{y \sim P_\theta(\cdot|x)} [y]$.
  *   If the distribution is sharp (model knows the answer), samples cluster on truth.
  *   If the distribution is flat/entropy-high (model is guessing), samples scatter.
  *   Taking the mode is finding the argmax of the estimated density.
  *   **Implication:** This frames the problem as **density estimation**, not truth-seeking. It explains why it fails on hard questions (the density is flat or peaked on the wrong answer).

  ---

  ### 5. Mathematics vs. Contested Empirics

  To settle the team debate, separate the claims into these buckets:

  #### Pure Mathematics (Settled)
  *   **CJT:** If votes are independent and $p > 1/2$, majority accuracy $\to 1$ as $k \to \infty$. (Proof is solid).
  *   **Weighted CJT:** If weights are proportional to log-odds of competence, accuracy is maximized. (Proof is solid).
  *   **Correlation:** If votes are correlated with coefficient $\rho$, the error rate lower-bounds at $\rho$. (Proof is solid).

  #### Contested Empirics (Where your team is arguing)
  *   **Independence:** Are samples from one model "independent enough"?
      *   *Consensus:* No. They share a common cause ($\theta$). They are conditionally independent given $\theta$, but marginally correlated.
  *   **Competence Threshold:** Is $p > 1/2$ (or $1/M$) on the specific eval subset we care about?
      *   *Consensus:* Not necessarily. On "hard" evals, models often operate below chance for single-shot, making SC dangerous without verification.
  *   **Confidence as Weight:** Does logprob correlate with correctness sufficiently to justify weighting?
      *   *Consensus:* Weakly. Calibration is poor. Weighting helps slightly in some domains (math) but hurts in others (creative writing/hallucination prone).
  *   **Diminishing Returns:** Does accuracy plateau?
      *   *Consensus:* Yes. Literature (e.g., Wang et al., 2023 "Self-Consistency Improves Chain of Thought") shows gains saturate typically between $k=5$ and $k=10$.

  ### Recommendation for the Lab
  Tell your colleague: **"The CJT analogy is useful for intuition, but dangerous for prediction."**
  1.  Keep self-consistency; it works.
  2.  Keep $k \approx 5$; the data shows diminishing returns due to correlation.
  3.  Do not claim asymptotic convergence to 1.0; claim variance reduction on the model's existing knowledge distribution.
  4.  Be very careful weighting by confidence unless you have calibration data.
  5.  Treat it as a **Correlated Ensemble**, not a Jury.
