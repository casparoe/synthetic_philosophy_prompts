answer: |-
  ### I. Systematic Translation: The Cluelessness Objection as a Robust Decision Problem

  **The Setup:**
  Let the moral agent be modeled as a learning policy $\pi_\theta$ operating within a partially observable Markov decision process (POMDP). The environment is characterized by a state space $S$, action space $A$, and a transition dynamics function $P(s'|s, a)$. The moral objective is to maximize the expected cumulative discounted reward $J(\pi) = \mathbb{E}[\sum \gamma^t R(s_t, a_t)]$, where $R$ represents the axiological value function (utility). The "long-range, branching causal structures" of ethical discourse correspond to the trajectory distribution over an infinite horizon $T \to \infty$.

  **The Cluelessness Argument (The Impossibility Claim):**
  The claim that moral agents lack predictive access translates to a failure of **out-of-distribution (OOD) generalization** under severe **distribution shift**.
  1.  **Epistemic Budget Exhaustion:** The agent possesses a finite **epistemic budget**—a limit on the computational and informational resources available to allocate confidence across competing causal models of the world. In social and ecological systems, the data-generating process is non-stationary. The training distribution (past experience and historical data) diverges radically from the test distribution (the long-term future states resulting from novel interventions).
  2.  **Adversarial Perturbations:** The causal chain is sensitive to initial conditions (chaos). Minor, unobservable fluctuations act as **adversarial perturbations of the data-generating process**, causing the predicted trajectory to diverge exponentially from the modeled trajectory.
  3.  **Failure of Empirical Risk Minimization (ERM):** Standard expected-utility reasoning relies on **empirical risk minimization** over observed outcomes. However, because the reward signal is delayed and noisy, and the horizon is infinite, the variance of the return estimator exceeds the signal. Consequently, the risk landscape is flat or arbitrarily rugged; no policy $\pi$ can be distinguished as superior to its complement within the bounds of the agent's confidence intervals. The optimization problem is ill-posed.

  **The Anti-Cluelessness Argument (The Robustness Claim):**
  The defense against cluelessness translates to a proposal for **policy classes constrained by complexity bounds** and robust optimization.
  1.  **Constrained Policy Classes:** We need not identify the globally optimal policy over the full state space. Instead, we restrict the search to a policy class $\Pi$ with bounded complexity (e.g., policies that prioritize near-term, high-certainty rewards). Within this restricted class, the **generalization error** is manageable.
  2.  **Epistemic Budget Allocation:** Rather than seeking a single dominant causal model, the agent allocates its **epistemic budget** across an ensemble of plausible models. A robust policy is one that maximizes the worst-case expected utility across this ensemble (minimax regret).
  3.  **Signal Dominance:** For many actions, the near-term reward signal is sufficiently strong that it dominates the noise of the long-term tail. Even under **distribution shift**, certain actions (e.g., preventing immediate extinction) maintain a positive expected value across all plausible models in the confidence set. Thus, **empirical risk minimization** on a truncated horizon yields determinate guidance, rendering the long-term uncertainty irrelevant for the decision boundary.

  ***

  ### II. Residue Report: Translation Fidelity and Loss

  This section evaluates the isomorphism between the ethical debate and the statistical framework.

  #### 1. Translations Without Loss (High Fidelity)
  *   **"Ought Implies Can" $\leftrightarrow$ Learnability Conditions:** The ethical principle that obligation requires capacity maps precisely to statistical learnability. If the optimal policy is not identifiable within the agent's **epistemic budget** (i.e., the sample complexity required to distinguish $\pi^*$ exceeds available data), then the normative claim that the agent "ought" to execute $\pi^*$ is mathematically vacuous. Both frameworks agree that impossibility negates obligation.
  *   **Foreseeability $\leftrightarrow$ Generalization Bounds:** The ethical requirement that consequences be "foreseeable" to count against an agent corresponds to the requirement that the test error (long-term consequences) be bounded by the training error (immediate evidence) plus a complexity term. If the generalization bound is too loose, the consequence is ethically and statistically irrelevant.

  #### 2. Distorted Translations (Structural Strain)
  *   **Act- vs. Rule-Utilitarianism $\leftrightarrow$ Direct vs. Constrained Optimization:**
      *   *Ethical View:* Rule-utilitarianism often invokes normative rules that have weight independent of immediate optimization (e.g., "do not lie" as a heuristic).
      *   *Statistical View:* This translates to **policy classes constrained by complexity bounds** or regularization.
      *   *Distortion:* In decision theory, constraints are instrumental shortcuts to maximize the same reward function $R$. In ethics, rule-utilitarians often argue the rule *changes* the evaluation metric itself. The statistical translation reduces the deontological flavor of rules to mere computational heuristics, stripping them of their normative independence.
  *   **Intentions $\leftrightarrow$ Policy Parameters:**
      *   *Ethical View:* Intentions (the will) have moral weight distinct from outcomes.
      *   *Statistical View:* Intentions map to the policy parameters $\theta$ prior to sampling the trajectory.
      *   *Distortion:* In robust decision theory, $\theta$ matters only insofar as it predicts $R$. If a "good" intention (parameter set) systematically leads to high loss due to model error, the optimizer discards it. Ethics often preserves the praiseworthiness of the intention despite the failure of the outcome (moral luck). The statistical framework is purely consequentialist regarding the parameters themselves.

  #### 3. Vanishing Claims (The Untranslatable Residue)
  *   **Non-Instrumental Value (Axiology):** Decision theory takes the reward function $R$ as exogenous. It can optimize for well-being, preference satisfaction, or pain reduction, but it cannot *justify* why one is valuable and another is not. The ethical debate regarding *what* constitutes the good (hedonism vs. pluralism) vanishes; only the *maximization* of the given metric remains.
  *   **Omission vs. Commission:** In a standard MDP, a null action $a_{null}$ is mathematically symmetric to an active intervention $a_{active}$; both are transitions in state space. The moral distinction—that harming via commission is often weightier than harming via omission—has no counterpart unless explicitly hard-coded as an asymmetric cost in $R$. The statistical vocabulary is blind to the *mode* of causation, tracking only the state transition.
  *   **Moral Standing and Rights:** The framework treats all "patients" as sources of reward signal. It cannot capture the notion of a "right" as a constraint that trumps utility maximization (e.g., sacrificing one to save five) unless modeled as a hard constraint. Even then, the *normative force* of the right (why it trumps) is external to the optimization logic.
  *   **Agent-Relative Prerogatives:** Robust optimization is typically agent-neutral (maximize global $J$). It struggles to model the ethical intuition that an agent is permitted to prioritize their own projects even if global utility would be higher otherwise, without framing it as a "selfish" reward term which changes the moral problem.

  ***

  ### III. Conclusion: Optimization or Blindness?

  The translation exercise reveals that **consequentialism is structurally isomorphic to robust optimization**, but this isomorphism comes at the cost of axiological emptiness.

  The untranslatable residue does not suggest that consequentialism is *false*; rather, it demonstrates that the statistical vocabulary is systematically blind to the **source of the objective function**. Robust decision theory provides a rigorous account of *how* to act given a goal under uncertainty (handling the cluelessness problem via complexity bounds and epistemic budgets), but it is silent on *what* the goal ought to be.

  The "cluelessness" objection, when translated, ceases to be a metaphysical worry about causal chains and becomes a technical problem of **sample complexity and generalization error**. The anti-cluelessness response successfully demonstrates that moral decision-making is feasible if treated as a **bounded rationality** problem rather than a god's-eye optimization.

  However, the residue indicates that ethical reasoning tracks dimensions that optimization ignores: the moral significance of the *mode* of action (omission/commission), the intrinsic status of patients (rights), and the independence of the will from the outcome. Therefore, consequentialism is not *merely* applied robust optimization missing axioms; rather, robust optimization is the **engine** of consequentialism, while the ethical debate resides in the **design of the loss function** and the **constraints on the agent's identity**—elements that the statistical framework must treat as exogenous inputs. The statistical vocabulary solves the *epistemic* problem of cluelessness but leaves the *normative* problem of value entirely untouched.
