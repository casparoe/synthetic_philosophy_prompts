  Hi — hoping you can settle something that's been eating a lot of time at work.

  I work on the forecasting side at a small hydro outfit; we sell river-level forecasts a few weeks out. There's a proposal on the table to spend a chunk of money on a much denser network of rain and river gauges, and one of the senior guys — call him Dave — keeps killing it with the butterfly thing. You know the line: a butterfly flaps its wings somewhere and weeks later a storm happens on the other side of the world. His version: "it's chaotic, so no amount of measuring buys you anything past about a week — spend the money on the climatology average instead."

  He's also using it for two other things. One: because it's chaotic, by day thirty literally anything could happen, so our 30-day risk numbers are basically fiction. Two, newer: our ensemble spread is meaningless, because "chaos isn't probability" — either the trajectory goes one way or it doesn't, so putting probabilities on it is pretending.

  A junior on the team, Priya, pushed back and now I'm stuck in the middle. She says the whole point of chaos is that the system is still deterministic, so the future is fully fixed by the present and the unpredictability is only ours — and if that's right, she can't see how Dave gets from there to "the model is worthless" rather than "the model is hard". Dave's reply was that determinism is exactly why it's hopeless: any description of the state we can actually store already differs from the true state somewhere out in the decimal expansion, that difference grows, and no computer can hold infinitely many digits, so "hard" and "impossible in practice" collapse into each other here.

  Numbers, if they help: our current initial-condition error is roughly 1 part in a thousand, the new gauge network would get us to about 1 part in a million, and the error-doubling time in our model is around two days. My instinct is that the slogan is doing at least three or four separate jobs at once and that they don't stand or fall together.

  Could you set out, as a numbered menu I can take into the meeting, the distinct precise claims "it's chaotic / butterfly effect / you can't predict past a week" could be making here — the trivial ones, the substantive ones, the ones that are just false — and mark each as platitude, defensible, or wrong? For each, say whether it would actually support dropping the gauge network, whether it would support "anything could happen by day thirty", and whether it would support binning the ensembles. Then say where Priya and Dave are each right. Please do the doubling-time arithmetic explicitly if it bears on Dave's conclusion, and write in British English. Finish with a machine-readable last line naming the reading that has to carry Dave's conclusion and how well it carries it, in this form: \answer{R3 — partly} (fully / partly / not at all).
