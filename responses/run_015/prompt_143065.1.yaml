  *   **Doubling Time ($T_d$):** 2 days.
  *   **Saturation Error ($E_{sat}$):** Assume order of magnitude 1 (climate variance).

  The time $t$ to reach saturation is calculated by $E_{sat} = E_0 \times 2^{(t/T_d)}$, which rearranges to $t = T_d \times \log_2(E_{sat}/E_0)$.

  *   **Current Horizon:** $t = 2 \times \log_2(10^3) \approx 2 \times 10 = 20$ days.
  *   **Proposed Horizon:** $t = 2 \times \log_2(10^6) \approx 2 \times 20 = 40$ days.

  **Result:** The proposed network theoretically extends skillful prediction by roughly **20 days**. Dave's claim that improvement yields nothing past a week is mathematically inconsistent with the provided doubling time and error reduction figures.

