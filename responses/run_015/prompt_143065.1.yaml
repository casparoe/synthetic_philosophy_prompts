  ### 1. The Arithmetic of Predictability

  Dave's assertion that "no amount of measuring buys you anything past about a week" relies on the assumption that error saturation happens almost immediately regardless of initial precision. However, in chaotic systems, the relationship between initial error and predictability horizon is logarithmic.

  *   **Current State:** Initial error $E_0 = 10^{-3}$.
