  7.  **Final Polish:** Ensure the distinction between *assertion* and *implicature* is clear, as that's the only lifeline Augustine offers in this specific constraint.

  *(Self-Correction on the "Refusal reveals" constraint)*: If the prompt says "a simple refusal to answer would itself reveal," does Augustine allow a *complex* refusal? Yes. "I am bound by confidentiality" is not a refusal to answer in the negative; it is a statement of duty. It is true. The inference is on the abuser. This is the critical path.

