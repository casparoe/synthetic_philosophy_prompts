      *   **Rank 2 (Theoretical Core): Intrinsic vs. Graded (1 vs 3).** This challenges the definition of "suffering" in the core framework.
          *   *Revision:* Refine (1) to specify that "suffering" refers to *disvalued experience*, where disvalue is a function of intensity and cognitive context.
          *   *Cost:* Moves away from classical NU toward a "Priority View" or "Person-Affecting" view.
      *   **Rank 3 (Scope of Harm): Phenomenal vs. Structural (1 vs 5).**
          *   *Revision:* Allow structural suffering to generate direct weight *if* the self-model is sufficiently complex (linking 5 back to 3).
          *   *Cost:* Complicates the epistemology of suffering (harder to verify than qualia).

  6.  **Drafting the Audit (incorporating constraints):**
      *   Tone: Formal, analytical, audit-style.
      *   No citations.
      *   Structure: Executive Summary, Tension Analysis (Ranked), Revision Proposals.

