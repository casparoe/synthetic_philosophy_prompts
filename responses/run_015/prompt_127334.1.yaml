      *   **Input:** Five specific philosophical commitments (Restricted Negative Utilitarianism, Procreation Asymmetry, Graded Patienthood based on Self-Model, Evolutionary Continuity vs. Vertebrate Priority, Structural vs. Phenomenal Suffering).
