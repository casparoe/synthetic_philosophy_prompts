      *Refining the Ranking:*
      1.  **Grading vs. Heuristic (3 vs 4):** Most actionable conflict.
      2.  **Intrinsic vs. Contextual Badness (1 vs 3):** Most theoretical conflict.
      3.  **Phenomenal vs. Structural (3 vs 5):** Most nuanced conflict (linking weight to harm type).

      *Revisions:*
