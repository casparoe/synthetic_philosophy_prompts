  2.  **Deconstruct the Commitments:**

      *   **(1) Restricted Negative Utilitarianism (RNU):** Suffering = Bad (intrinsic). Pleasure = Neutral (not good). Goal: Minimize suffering.
      *   **(2) Procreation Asymmetry:** Create suffering = Bad (direct reason against). Create pleasure = Neutral (no direct reason for). Consistent with (1).
      *   **(3) Graded Patienthood:** Consciousness = Necessary. Weight = Function of (Temporal Depth + Integrative Complexity of Self-Model).
          *   *Implication:* A being with a complex self-model suffering for 1 hour might outweigh a being with a simple self-model suffering for 10 hours, or at least the *type* of suffering matters based on cognitive architecture.
      *   **(4) Evolutionary Continuity vs. Vertebrate Priority:** Consciousness is continuous (no sharp species lines). *But* practical resource allocation prioritizes vertebrates.
          *   *Implication:* There's a gap between the metaphysical claim (continuum) and the practical heuristic (vertebrate focus).
      *   **(5) Structural vs. Phenomenal Suffering:** Phenomenal (felt) = Direct moral weight. Structural (preference frustration without feeling) = Indirect/Instrumental weight only.
          *   *Implication:* A complex AI or a comatose human with frustrated preferences but no qualia gets less moral consideration than a suffering mouse.

  3.  **Identify Potential Tensions (Pairwise Analysis):**

      *   **(1) & (2):** RNU and Asymmetry are standard companions. If pleasure is neutral, creating it isn't good. If suffering is bad, creating it is bad. *Verdict: Consistent.*
      *   **(1) & (3):** RNU says minimize suffering. (3) says weight depends on self-model complexity.
          *   *Tension:* Does "suffering" in (1) refer to raw qualia or the *impact* on the self? If raw qualia are all that matter, why does self-model complexity scale weight? If a mosquito suffers "rawly," does it count less than a human suffering "rawly"?
          *   *Analysis:* This is a modification of classical NU. Classical NU often treats pain as pain. (3) introduces a hierarchy. Is this inconsistent? Not logically, but it risks undermining the "intrinsic negative weight" claim in (1). If weight varies by cognitive capacity, is the suffering itself intrinsic, or is the *loss* intrinsic?
          *   *Severity:* Moderate. It shifts from "Suffering Focused" to "Person-Affecting Suffering Focused."
      *   **(1) & (5):** (1) says suffering has intrinsic negative weight. (5) says structural suffering (preference frustration) has *no* direct weight.
          *   *Tension:* If I have a stable preference not to be cheated, and I am cheated but never know (no phenomenal experience), (5) says no direct wrong was done to *me*. (1) says suffering is bad. Is preference frustration suffering? (5) defines it as "structural," distinct from "phenomenal."
          *   *Analysis:* This is a definitional move. As long as "suffering" in (1) is defined as "phenomenal suffering," (1) and (5) are consistent. However, it narrows (1) significantly.
          *   *Severity:* Low (definitional alignment).
      *   **(3) & (4):** (3) says weight scales with self-model complexity. (4) says allocate primarily to vertebrates.
          *   *Tension:* Do all vertebrates have higher self-model complexity than all invertebrates? Likely not. Some cephalopods or insects might have complex integration; some vertebrates (fish, larvae) might have minimal self-models.
          *   *Analysis:* (4) admits this is a "practical allocation rule," not a metaphysical claim. It acknowledges the tension ("evolutionary considerations debunk sharp... boundaries") but insists on the heuristic.
          *   *Severity:* Moderate/High. It risks arbitrariness. If a crab has a more complex self-model than a zebrafish, but you fund zebrafish research over crab welfare, you violate the weighting in (3).
      *   **(3) & (5):** (3) weights based on self-model complexity. (5) discounts structural suffering (preference frustration) in beings that might have complex preferences but no phenomenal experience of frustration.
          *   *Tension:* A being with a high-complexity self-model (high weight per (3)) that experiences structural suffering (low weight per (5)).
          *   *Analysis:* (3) applies to "moral patienthood" generally. (5) specifies what *counts* as suffering within that patienthood. If the being is a patient, but the specific harm is structural, (5) overrides (3)'s weighting for that specific harm.
          *   *Severity:* Low. (5) acts as a filter for (3).
      *   **(2) & (3):** Asymmetry says don't create sufferers. (3) says some sufferers matter more.
          *   *Tension:* Does the asymmetry apply equally to all? Is it worse to create a human sufferer than a mouse sufferer?
          *   *Analysis:* If weight scales (3), then the reason against creating a high-weight sufferer is stronger than against a low-weight sufferer. This is consistent.
          *   *Severity:* Low.

  4.  **Deep Dive into the Real Tensions:**

      *   **Tension A: The "Taxonomy vs. Heuristic" Conflict (3 & 4).**
          *   (3) demands individual assessment of self-model complexity.
          *   (4) mandates a taxonomic heuristic (vertebrates).
          *   *Conflict:* Taxonomy is a poor proxy for cognitive architecture. Prioritizing vertebrates systematically misallocates resources away from high-complexity invertebrates toward low-complexity vertebrates. This violates the utilitarian calculus implied by (1) and (3).
          *   *Severity:* High. It undermines the optimization goal of (1).

      *   **Tension B: The "Intrinsic Weight vs. Cognitive Mediation" Conflict (1 & 3).**
          *   (1) claims suffering has *intrinsic* negative weight.
          *   (3) claims weight scales with *extrinsic* cognitive features (self-model, temporal depth).
          *   *Conflict:* If the badness is intrinsic to the *phenomenology*, a unit of pain should be a unit of pain regardless of who feels it. By scaling it via cognitive complexity, you are claiming the badness lies partly in the *context* or the *loss*, not just the sensation. This subtly shifts (1) from Negative Utilitarianism to a hybrid view.
          *   *Severity:* Medium-High. It threatens the theoretical purity of the "Restricted Negative Utilitarian" label.

      *   **Tension C: The "Phenomenal Gatekeeping" Conflict (1 & 5).**
          *   (1) wants to minimize suffering.
          *   (5) excludes structural preference frustration from "suffering."
          *   *Conflict:* In a sophisticated agent, structural frustration often *causes* phenomenal suffering later, or constitutes a harm that feels like suffering to an observer. But the hard line in (5) creates a "zombie" loophole. If a being has a complex self-model (3) but is currently unconscious or incapable of feeling frustration (5), their interests can be violated with no direct moral cost.
          *   *Severity:* Medium. It creates counter-intuitive results regarding deception or unconscious harm to high-weight patients.

