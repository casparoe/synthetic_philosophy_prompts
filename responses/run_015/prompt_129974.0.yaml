  Add more on Ana's defense of the "package" issue. Why is it okay to be realist about harm but not purity?
  Add more on Ravi's positive account of moral argument. If there are no facts, what are we doing when we argue?

  *Revised Plan:*
  Expand the middle section where Ana defends the bifurcation. Expand Ravi's explanation of moral argument as negotiation rather than discovery.

  *Let's rewrite/expand.*

