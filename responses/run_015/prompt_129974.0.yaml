  *(Drafting content)*
  "Okay, stipulate the study," Ana said. "Forty societies, thirty years. Market integration goes up, impartial fairness converges, everyone feels like they're getting *better*. Purity norms stay random, nobody feels progress. You still think this kills realism?"

  Ravi leaned back. "It kills *global* realism. You can't say morality is one unified domain of facts if half of it behaves like weather and half like arithmetic. But look at (i). You say convergence on impartiality is discovery. I say it's lock-in. Market integration requires trusting strangers. If you don't adopt impartial fairness norms, your economy crashes. The phenomenology of 'progress' is just the feeling of a coordination problem solving itself."

  "But the participants report it as *moral* progress," Ana countered. "Not just 'this works better.' They say favoring kin over strangers is *wrong* now, whereas before it was obligatory. If I'm born in a subsistence niche, kin-favoring is the only way to survive. That's an ecological constraint, not a moral truth. Once the constraint lifts, the truth becomes visible. The variation in (ii)—purity, taboos—that's noise. It doesn't track survival needs, so it drifts. I can be realist about (i) and quietist about (ii). Morality isn't a package deal. It's a mix of coordination facts and cultural aesthetics."

  "So you're bifurcating," Ravi said. "You're saving realism by shrinking its domain. But here's the wedge: If (i) is truly tracking mind-independent facts, why does it track *market integration* so perfectly? Why not track something else? If moral facts are like math, you should see convergence even without the market pressure. Instead, you see tight covariance. That suggests the 'truth' is endogenous to the social structure."

  "Correlation isn't causation," Ana said. "The market doesn't create the truth; it creates the *conditions* where ignoring the truth is too costly. Before, you could hide from the requirement of impartiality. Now you can't. That explains the covariance without conceding constructivism. And it answers the 'born elsewhere' objection. If I were born in a subsistence niche, I'd have different *practices*, but because my access to the relevant facts was occluded by survival needs. My intuition wouldn't be tracking falsehood; it would be tracking a different set of constrained options."

  "Occluded," Ravi repeated. "Convenient. But let's talk about the phenomenology. You say it feels like discovery. I agree. But on my view, it feels like discovery because we're navigating a landscape of social affordances. When we shift from kin-based to market-based norms, we unlock new capabilities. It feels like leveling up in a game. It's real progress, just not *moral* progress in the realist sense. It's pragmatic optimization that wears moral clothing because that's how humans motivate compliance."

  "But then why does (ii) stay divergent?" Ana asked. "If it's all just pragmatic optimization, why don't purity norms converge? Surely uniform hygiene standards would help markets."

  "Because purity norms aren't doing optimization work," Ravi said. "They're boundary markers. They signal group membership. You *want* them to diverge so you can tell who's in your tribe. Impartial fairness is for dealing with *outgroups* in trade. Purity is for bonding *ingroups*. Different functions. So (i) converges because trade requires universalism. (ii) diverges because bonding requires particularism. No moral facts needed. Just evolutionary tinkering."

  Ana paused. "Okay. So we agree on the data. We disagree on whether the utility of (i) implies truth or just utility. Can we break this? Give me an observation, runnable in principle, that would make you quit functionalism."

  Ravi frowned. "If impartial fairness norms persisted *after* market collapse. If a society reverted to subsistence but kept the stranger-help norms despite survival costs, that would suggest the norm isn't tied to function. It would look like... inertia, or maybe truth."

  "And if they dropped it immediately?"

  "Then it's a tool. You put the hammer down when the wall is built." Ravi looked at her. "Your turn. What makes you quit realism?"

  "If we found a society with high market integration that *rejected* impartial fairness and thrived," Ana said. "If they favored kin exclusively and outperformed impartial societies economically. That would show impartiality isn't a requirement of the niche, and if it's not required... why think it's true?"

  "But they didn't thrive in the study," Ravi noted. "They converged."

  "Right." Ana sighed. "So we're both hiding behind the same covariance. You say 'function explains it.' I say 'truth explains the function.' We're fitting the same curve."

  "Looks like it," Ravi said. "We're just arguing about whether the curve is a map or a territory."

  "And neither of us can climb off the graph to check."

  "Exactly."

