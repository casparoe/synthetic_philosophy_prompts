      *   **Ravi (Anti-Realist/Functionalist):** Needs to argue that (i) isn't truth-tracking but *functional* convergence. Market integration *requires* impartial fairness to function, so cultures evolve that norm. It feels like progress because it solves coordination problems, not because it hits a moral platonic form. (ii) is pure cultural drift/signaling.
      *   **The Split:** The hypothetical creates a wedge. Ana wants to say (i) is real morality, (ii) is noise. Ravi wants to say (i) is functional necessity, (ii) is cultural aesthetics.
      *   **Mind-Changing:** Needs to be something empirical that distinguishes "tracking truth" from "tracking functional utility."

  3.  **Drafting - Section by Section:**

      *   *Opening:* Establish the WEIRD consensus immediately. No time wasted on "is psychology biased?" Yes, it is.
      *   *The Hypothetical:* Introduce the 40-society study results.
      *   *Ana's Move:* (i) is discovery. Market integration reveals the underlying structure of cooperative truth. (ii) is just conventions.
      *   *Ravi's Counter:* (i) is functional adaptation. You don't need moral facts to explain why traders stop killing each other. You need game theory.
      *   *The "Package" Problem:* Ana needs to address why morality isn't unified. She can bifurcate: Core vs. Periphery.
      *   *Ravi's Phenomenology:* Why does (i) *feel* like progress? Because solving coordination problems feels like lifting a fog.
      *   *Mind-Changing Test:* This is the tricky part. What observation distinguishes realism from functionalism?
