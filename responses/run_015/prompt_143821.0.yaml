answer: |-
  ### I. Logical Architecture and Preliminary Distinctions

  Before advancing the specific argument, we must delineate the logical terrain. The **Argument from Illusion** is a reductio against Direct Realism. Its canonical form proceeds as follows:
  1.  In cases of hallucination (or illusion), the subject has an experience as of $O$.
  2.  In cases of veridical perception, the subject has an experience as of $O$.
  3.  These two experiences can be subjectively indistinguishable to the subject.
  4.  **Inference:** Therefore, the immediate object of awareness (or the fundamental mental kind) must be identical in both cases (The Common Factor Principle).
  5.  **Conclusion:** Since the hallucinatory object is not a mind-independent $O$, the veridical object cannot be a mind-independent $O$ either.

  **Settled vs. Contested Claims:**
  It is settled within the disjunctivist tradition that premise (4) must be rejected. Disjunctivism asserts that the metaphysical structure of veridical perception (a relation to a mind-independent object) is fundamentally distinct from that of hallucination (a mere appearance without such an object). However, what remains genuinely contested is the *explanatory cost* of this rejection. Specifically, there is no consensus on whether hallucination confers *any* justification, nor is there consensus on whether the "Symmetry Thesis"—the assumption that indistinguishability entails equal epistemic standing—is a necessary premise of the Argument from Illusion or a downstream consequence.

  My contribution targets this contested space. I argue that the Argument from Illusion is vicious only if one accepts the Symmetry Thesis: that subjective indistinguishability necessitates epistemic parity regarding justification. I propose that we can retain the phenomenological datum of indistinguishability without accepting metaphysical identity or epistemic symmetry, by distinguishing between **World-Anchored Warrant** and **Defeasible Structural Coherence**.

  ### II. Definitional Framework

  To construct this argument, we must rigorously define the two modes of epistemic support at play. These definitions are constructed for the purpose of this specific disjunctive account.

  **1. World-Anchored Warrant (WAW)**
  WAW is a factive normative status. A perceptual experience provides WAW for a belief $p$ (e.g., "there is a cup") if and only if the justification for $p$ is constituted by the actual presence of the cup making itself manifest to the subject.
  *   *Key Feature:* WAW is externally individuated. It cannot exist unless the world cooperates. If the cup is absent, WAW is absent *by definition*.
  *   *Normative Force:* It entails truth. One cannot have WAW for a false belief.

  **2. Defeasible Structural Coherence (DSC)**
  DSC is a non-factive, internalist normative status. An experience provides DSC if the internal architecture of the experiential field exhibits a coherence consistent with the presence of the object, lacking internal markers of error (e.g., blurring, inconsistency with peripheral vision, cognitive dissonance).
  *   *Key Feature:* DSC is internally individuated. It relies on the *absence of defeaters* within the subject's cognitive horizon, not the *presence of anchors* in the world.
  *   *Normative Force:* It renders belief rational but fallible. One can have DSC for a false belief (as in hallucination).

  ### III. The Argument: Breaking the Symmetry Thesis

  The core of the Argument from Illusion is the move from (3) Indistinguishability to (4) Common Factor. I contend this move relies on an implicit equivocation between WAW and DSC.

  **Step 1: The Epistemic Equivocation**
  The proponent of the Argument from Illusion argues: "Since the subject cannot tell the difference between Veridical ($V$) and Hallucinatory ($H$) cases, the justification provided in $V$ cannot be superior to $H$."
  This assumes that justification is a singular commodity accessible from the first-person perspective. However, if we distinguish WAW from DSC, we see that $V$ provides *both* WAW and DSC, whereas $H$ provides *only* DSC.

  **Step 2: Indistinguishability as Cognitive Limitation**
  Why are $V$ and $H$ indistinguishable? The traditional Common Factor view says they share a positive property (e.g., a sense-datum or representational content). The Disjunctivist view I propose is that indistinguishability is a **negative epistemic limit**.
  The subject cannot distinguish $V$ from $H$ not because they share a mental ingredient, but because the subject lacks the cognitive capacity to detect the *absence* of the world-anchor in $H$.
  *   In $V$, the subject is in contact with the world (WAW).
  *   In $H$, the subject possesses a coherent structure (DSC) that mimics the *feel* of contact.
  *   The "feel" is not a positive shared quality; it is the absence of internal alarm bells. Since the absence of the world is an external fact, it does not generate an internal signal. Therefore, the failure to detect the lack of WAW in $H$ does not imply the presence of WAW in $H$; it implies only the presence of DSC.

  **Step 3: Blocking the Common Factor Inference**
  The inference to a Common Factor requires that the indistinguishable aspect be the *source* of justification.
  *   If justification were solely DSC, then $V$ and $H$ would be epistemic peers, and skepticism would loom.
  *   However, if the primary justification in $V$ is WAW, then $V$ and $H$ are **not** epistemic peers.
  *   The fact that $H$ possesses DSC explains why the subject *takes* themselves to be justified. The fact that $V$ possesses WAW explains why the subject *is* justified.
  *   Therefore, subjective indistinguishability tracks the presence of DSC, but it does not track the presence of WAW. Since WAW is the distinctive mark of veridical perception, the lack of access to the distinction between WAW and DSC does not prove they are the same mental kind. It proves only that DSC is a necessary but not sufficient condition for WAW, and that DSC can exist without WAW.

  Consequently, the Argument from Illusion fails because it treats the *rationality of the belief* (supported by DSC in both cases) as identical to the *warrant for the truth* (supported by WAW only in veridical cases).

  ### IV. Addressing the Explanatory Burden Objection

  **The Objection:**
  A critic might argue: "This strategy merely relocates the explanatory burden. You have denied the Common Factor, but you still must explain *why* DSC feels exactly like WAW. If the metaphysical nature of $V$ is relational and $H$ is not, there must be some positive phenomenological property that makes them indistinguishable. By calling it 'Structural Coherence,' you have simply renamed the Common Factor without explaining its origin."

  **The Response:**
  This objection rests on a misconception of phenomenology. It assumes that for two experiences to be indistinguishable, they must share a positive *qualitative* constituent (a 'phenomenal paint'). I reject this assumption in favor of a **Normative Phenomenology**.

  1.  **Phenomenology as Accessibility:** What it is like to have an experience is not a matter of introspecting an internal object; it is a matter of what commitments the experience makes available to the subject. In both $V$ and $H$, the experience makes available the commitment "There is an $O$."
  2.  **The Source of Sameness:** The sameness is not in the *constituents* of the experience, but in the *availability of the commitment*. In $V$, the commitment is anchored (WAW). In $H$, the commitment is unanchored but coherent (DSC).
  3.  **Why No Positive Property is Needed:** To explain why a subject cannot tell the difference between a real dollar bill and a perfect counterfeit, we do not need to posit a "bill-ish sense-datum" common to both. We need only posit that the counterfeit successfully replicates the *features relevant to detection*.
      *   In perception, the "features relevant to detection" are normative, not qualitative. They are the absence of internal defeaters.
      *   Hallucination succeeds in replicating the *absence of internal defeaters*.
      *   It fails to replicate the *external anchor*.
      *   Since the external anchor is not an internal feature, its absence cannot be detected internally.

  Therefore, the burden is not to explain a shared positive property, but to explain how a non-relational state ($H$) can mimic the normative availability of a relational state ($V$). The answer lies in the cognitive architecture: our perceptual systems are designed to treat DSC as a proxy for WAW. This is an evolutionary and functional fact, not a metaphysical identity. The "feel" of veridicality is the operational smoothness of DSC. When DSC operates without internal friction, it presents itself as WAW. The error lies in assuming that this presentation guarantees the metaphysical status.

  ### V. Conclusion

  The Argument from Illusion derives its force from the Symmetry Thesis: the idea that if two states are indistinguishable, they must confer the same epistemic rights. By decomposing epistemic support into **World-Anchored Warrant** (factive, relational) and **Defeasible Structural Coherence** (non-factive, internal), we dissolve this symmetry.

  Veridical perception and hallucination are not epistemic peers. The former provides a guarantee of truth via the world; the latter provides a rational entitlement to believe via internal coherence. Subjective indistinguishability is not evidence of a shared mental factor, but rather a testament to the limits of introspection: a subject can detect the presence of coherence, but cannot introspectively detect the absence of the world. This disjunctive account preserves the Direct Realist intuition that we perceive the world itself, without denying the phenomenological reality of hallucination, by reclassifying the latter as a coherent but unanchored cognitive state rather than a perception of a different object.
