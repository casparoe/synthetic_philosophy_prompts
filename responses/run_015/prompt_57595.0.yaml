answer: |-
  **The principle**

  The account rests on three clauses distinguishing specific claims, direct agency, and fundamental prohibitions. "Ought" does not agglomerate; conflicting obligations generate real dilemmas when neither cancels the other.

  1.  **The Specific Claim Clause:** Residue is owed only when a specific person holds a claim against the agent that is overridden. In Case 2, patients claim care, not a specific vial; triage criteria satisfy the duty, leaving no residue. In Case 1 and 3, children claim life from the mother. Overriding this creates residue. This explains why Case 2 is clean while Case 3 is stained.
  2.  **The Direct Agency Clause:** Moral wrong attaches only if the agent is the direct cause of the harm, not merely the allocator of inevitable harm. In Case 1, the guard pulls the trigger; the mother allocates death but does not kill. She owes a debt (residue) but commits no wrong. In Case 3, the mother ceases support; she is the direct cause of death. She owes a debt and commits a wrong. This preserves your verdict that Case 1 lacks wrongness while retaining residue.
  3.  **The Fundamental Prohibition Clause:** Stain arises only from violating prohibitions protecting bodily integrity or fundamental humanity, not conventional rules. In Case 4, forgery violates administrative trust; the end justifies the means without stain. In Case 5, torture violates bodily integrity; the end justifies the act but cannot cleanse the agent. This distinguishes the forgery from the torture.

  Source matters only insofar as it affects agency. Coercion (Case 1) transfers wrong to the coercer but leaves residue with the agent. Chance (Case 2) dissolves residue if impersonal criteria exist. Prior conduct (Case 6) creates a dilemma but adds culpability for the predicament, stripping dignity without removing the wrong. Case 7 involves lost goods, not overridden rights; thus it is regret, not residue. The principle accommodates all eight cases by separating the geometry of the choice from the phenomenology of the aftermath.

  **The two pairs**

  **Cases 2 and 3:** The difference is not scarcity but role morality. In Case 2, the doctor acts as an agent of distribution, bound by impersonal criteria (prognosis). In Case 3, the mother acts as an agent of sustenance, bound by partial love. An intermediate case: A lifeguard must choose between two drowning strangers. Verdict: No residue. The lifeguard, like the doctor, acts on professional impartiality. If the lifeguard chooses one child over another own child, residue returns. Your verdicts stand; the principle holds that impersonal roles dissolve residue where personal bonds sustain it.

  **Cases 4 and 5:** The difference is the locus of violation. Forgery damages an institution; torture damages a person. An intermediate case: A man assaults a guard to steal keys to free a prisoner. Verdict: Stain exists, but less than torture. Assault violates bodily integrity like torture, but lacks the prolonged degradation. If you accept assault leaves a stain, the gradient holds. If you insist assault is stain-free, Case 5 must concede; but given the gravity of torture, Case 4 is the outlier only if forgery is seen as deeply personal. It is not. Your verdicts stand; the principle distinguishes conventional wrongs from visceral violations.

  **Casualties**

  The account cannot fully accommodate Case 7 without sharpening the distinction between regret and residue. You describe the regret as having the "shape" of residue. The principle insists shape is not substance. Regret concerns lost goods; residue concerns overridden rights. Abandoning this verdict costs little; it clarifies your taxonomy.

  The rival one-clause account is Utilitarianism: "Choose the best outcome; no residue exists." This saves consistency but loses the data of Cases 1, 3, and 5 entirely. It cannot explain why the mother in Case 3 feels wronged while the doctor in Case 2 does not.

  Ranking costs:
  1.  **Case 7 (Low Cost):** Reclassifying regret as non-moral loss simplifies the theory without damaging the fiction.
  2.  **Case 1 (Medium Cost):** If readers perceive the mother as complicit in killing, the "Direct Agency" clause fails. You must write the guard's agency clearly.
  3.  **Case 4 (High Cost):** If forgery is felt as a stain, the "Fundamental Prohibition" clause needs gradation.

  Overall, my account saves the phenomenology of guilt which is essential to your work. Utilitarianism saves logic but kills the novel.

  **New cases**

  1.  **The Lifeboat Ration:** Five survivors, food for four. One must be pushed out. Verdict: Genuine dilemma, stain exists. (Direct agency + specific claim). Confidence: High.
  2.  **The Tax Evasion:** A man evades taxes to fund underground railroad. Verdict: No stain. (Conventional rule vs. humanity). Confidence: High.
  3.  **The Broken Vow:** A woman promises to keep a secret that, if kept, allows abuse to continue. She tells. Verdict: Dilemma, residue owed to friend. (Specific claim violated for greater good). Confidence: Medium.
  4.  **The Accidental Harm:** A driver swerves to avoid a dog, hitting a pedestrian. Verdict: No dilemma, only tragedy. (No choice between duties). Confidence: High.

  Flag: Case 3 might feel stain-free to some. If the abuse is severe, the duty to prevent harm might outweigh the promise entirely, eliminating residue. My account predicts residue remains because a specific claim (confidence) was overridden. If you find this wrong, the Specific Claim Clause needs a threshold for severity.

  **The directive**

  This is a genuine dilemma grounded in the Specific Claim Clause. The past self made a claim on the husband regarding her dignity; the present self makes a claim regarding her existence. Because the present self lacks the capacity to understand the value of dignity over existence (due to degeneration), the past self's claim holds moral weight.

  Recommendation: Honor the promise. Turn off the machine.
  Why: The promise was made by a lucid agent defining the boundaries of her life. The current wish is a symptom of the illness eroding those boundaries.
  Licensed Ending: He honors the promise, carries the residue, and lives with the stain of killing a content woman.
  Illicit Endings: 1) He keeps her alive (betrays the lucid self, treats her as a object of care only). 2) He finds a loophole (dishonest, avoids the moral weight). The novel requires the stain to validate the promise's seriousness.

  **What I should write**

  Aesthetic considerations entitle you to present a non-dilemma as a dilemma if the character perceives it as one. Truth to character outweighs metaphysical ethics. However, you cannot cheat the consequences. If the principle says no residue is owed, but the character feels none, the scene rings false. If they feel residue where none is owed, that is psychology, not ethics.

  The question bears the weight of emotional truth, not philosophical proof. You may keep a verdict the account rejects if doing so reveals a deeper truth about the character's conscience. But do not confuse the character's confusion with moral reality unless the confusion is the point. The principle is a tool for clarity, not a cage for complexity. Use it to sharpen the conflict, not to resolve it prematurely.
