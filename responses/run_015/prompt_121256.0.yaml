answer: |-
  This is a sharp distinction, and you're right to sense that the metaphysics might drive a wedge into the ethics. Let's reason through the interventionist logic first, then see how it lands on responsibility.

  **The Metaphysics: Is it Omission or Presence?**

  On a strict interventionist view, causation is about difference-making. If you wiggle the cause, the effect wiggles.

  In **standard omission**, the "cause" is a variable that defaults to zero. The gardener variable is set to "no water." The plant variable goes to "dead." If you intervene and set gardener to "water," the plant lives. The causal work feels thin because you are pointing to a null value in a history of events. You are saying "the event that *didn't* happen matters."

  In your **negative presence** case, the "absence" isn't just a null value; it's a maintained state of a system. Think of the dead-man's switch again. The brake is engaged not because the driver did nothing, but because a spring is under tension. That tension is a physical, present fact. The "absence" of the driver's hand is merely the condition that allows the tension to exist.

  Here is the crucial interventionist pivot: To manipulate the outcome in a negative presence scenario, you cannot just "will" the absence to change. You have to intervene on the *mechanism* that sustains the absence. You have to cut the spring, disable the sensor, or lock the lever.

  This suggests that the causal work is actually being done by the **presence of the mechanism**, not the absence of the action. The "absence" is reified. It has been turned into a structural feature of the environment. In standard omission, the background is neutral. In negative presence, the background is weaponized (or functionalized).

  So, metaphysically, negative presence collapses into **causation by presence**. The "absence" is just a description of a specific configuration of present physical forces. The system is actively holding the "off" state as a positive condition. Therefore, you aren't tracking a lack of an event; you are tracking the stability of a state.

  **The Ethics: Does Responsibility Come Apart?**

  If the metaphysics shifts from omission to presence, the moral responsibility should shift with it.

  1.  **Standard Omission and Duty:**
      Responsibility for omissions usually hinges on a pre-existing duty. The gardener is responsible because they were *supposed* to water. If a random passerby doesn't water the plant, we usually say they didn't cause the death, because they had no duty. The causal link is normative, not just physical.

  2.  **Negative Presence and Design:**
      In your negative presence cases, the "absence" only has causal power because someone *configured* the system that way. The responsibility shifts from the moment of the "omission" (letting go of the switch) to the moment of the **configuration** (building the switch).

      If I rig a door to explode if it *isn't* opened by noon, and it isn't opened, did the lack of opening cause the explosion? Metaphysically, yes. But morally, the heavy lifting was done when I rigged the door.

      This changes the blame profile:
      *   **Omission:** Blame is often mitigated by "I didn't do anything." It's passive.
      *   **Negative Presence:** Blame is amplified by "I set things up so that doing nothing triggers the outcome." It's active management of risk.

  **The Verdict**

  They do come apart.

  If you treat negative presence as standard omission, you let the system designer off the hook. You focus on the person who "didn't press the button." But if you recognize it as causation by presence (of a sustaining mechanism), the causal locus moves to the architecture of the situation.

  On an interventionist account, the most robust cause is the variable that is hardest to vary without breaking the system. In standard omission, the cause is fragile (just water the plant). In negative presence, the cause is robust (you have to dismantle the mechanism to stop the outcome).

  Therefore, **negative presence is morally closer to commission.** It transforms a "failure to act" into a "maintenance of a dangerous state." If you sustain the conditions where an absence becomes lethal, you are actively doing something, even if your hands are still. The machinery turns the silence into a signal, and sending a signal is an act.

  So for your seminar: Argue that negative presence isn't a subtype of omission. It's a camouflage for presence. The "absence" is just a specific setting on a present machine. Once you see that, the moral responsibility snaps from the person who failed to intervene, to the person who built the machine that required the intervention.
