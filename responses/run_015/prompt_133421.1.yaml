  **MEMORANDUM**

  **TO:** Model-Governance Board
  **FROM:** Board Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Allocation Methodology for Job-Training Slots

  **Decision**

  After reviewing the technical constraints, legal boundaries, and community feedback, the Board recommends **Proposal (i): Maintain the current group-blind score and single cut-off**, subject to enhanced monitoring conditions. While this approach does not mathematically guarantee equal error rates across fluctuating budget appropriations, it is the only option that fully complies with the existing consent decree and county ordinance.

  **Rationale**

  Our primary fiduciary and legal duty is to operate within the bounds of the consent decree, which explicitly bars allocating resources based on race. Proposals (ii) and (iii) necessitate explicit racial classification in the allocation rule—either through group-specific cut-offs or distribution-matched rescaling. While these methods address the technical incompatibility results (balancing error rates across cut-offs), they expose the agency to significant litigation risk and potential violation of court orders. In public administration, legal compliance must supersede technical optimization.

  Furthermore, the budget volatility (700–1,100 slots) presents a challenge. Proposal (i) requires us to accept that disparate impact may shift as the cut-off moves. To mitigate this, we will condition this approval on an **annual internal audit** of disparate impact at the *actual* utilization rate, regardless of whether the appropriation changes. This ensures we remain informed of equity outcomes without incurring the five-figure external re-audit fee unless a legal threshold is breached.

  **The Runner-Up: Proposal (iii)**

  The strongest alternative is **Proposal (iii) (Vendor Distribution-Matched Variant)**. Technically, this is the superior solution for our operational volatility. By ensuring error rates match at *every* cut-off, it provides the desired guarantee across budget fluctuations without requiring re-audits. It effectively "future-proofs" the model against appropriation changes.

  However, Proposal (iii) fails on two critical governance fronts. First, the rescaling method renders the published scores non-probabilistic, violating the county ordinance requiring transparency in published scores. Second, like Proposal (ii), it relies on group membership to adjust scores, triggering the consent decree's prohibition on race-based allocation. While the vendor argues this is a "remedial" adjustment, without explicit legal counsel clearance or a decree modification, the Board cannot authorize a rule that explicitly treats applicants differently based on race. The administrative savings on audits do not justify the legal exposure.

  **Addressing the Coalition Objection**

  The community coalition raises a profound ethical challenge: if the target variable (12-month retention) is depressed by external hiring discrimination, optimizing for parity on this metric may entrench existing inequities. This objection applies forcefully to Proposals (ii) and (iii), which seek to equalize errors on a potentially biased outcome.

  The Board accepts this premise. Optimizing for fairness on a biased target is insufficient. Therefore, alongside adopting Proposal (i), we will establish a **Metric Task Force** comprising community representatives, labor economists, and agency staff. Their mandate is to:
  1.  Evaluate alternative success metrics (e.g., wage growth, credential completion) less susceptible to employer discrimination.
  2.  Assess whether the vendor's model can be retrained on these new metrics.

  **Timeline and Conditions**

  1.  **Immediate (Month 1):** Implement Proposal (i) for the upcoming allocation cycle. Legal Counsel to issue a formal opinion on the permissibility of remedial race-conscious post-processing under the current decree.
  2.  **Short-Term (Month 6):** Metric Task Force to deliver preliminary findings on alternative outcome variables.
  3.  **Medium-Term (Month 12):** Conduct internal audit of disparate impact at the realized cut-off. If disparate impact exceeds legal thresholds, trigger an external re-audit and reconsider Proposal (iii) contingent on legal clearance.

  **Conclusion**

  We cannot mathematically solve our way out of structural inequities or legal constraints. Proposal (i) offers the safest path forward, allowing us to maintain operations while we investigate better metrics and legal avenues. We prioritize compliance and transparency today to build the foundation for a more equitable model tomorrow.

  **Action Required:** Vote to adopt Proposal (i) with the stated conditions.
