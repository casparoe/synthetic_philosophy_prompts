answer: |-
  Here is a decision tree designed for your writing group. It bypasses the jargon (supererogation, latitude, utilitarianism) and forces everyone to commit to specific judgments on your cases.

  Print this out. Have everyone answer the questions silently first, then follow the arrows.

  ***

  # The "Kidney & Grenade" Moral Decision Tree

  **START:** Everyone agrees: *Donating the kidney was a Good Thing.*
  **GO TO NODE 1.**

  ### NODE 1: The Blame Test (The Kidney Case)
  **Question:** If your character had looked at the stranger on the forum and said, *"No, I am keeping my kidney,"* would she be **morally blameworthy** (i.e., did something wrong), or is it **morally permissible** (i.e., allowed, even if less nice)?

  *   **A. She would be blameworthy/wrong.** → Go to **NODE 2**.
  *   **B. It is permissible/allowed.** → Go to **NODE 3**.

  ---

  ### NODE 2: The Risk Ceiling (The Grenade Case)
  *(You believe helping is generally required, but let's test the limit.)*
  **Question:** In the backstory, a soldier jumps on a grenade to save their squad. If that soldier had *not* jumped (and the squad died), would they be **blameworthy**?

  *   **A. Yes, they would be blameworthy.** → **LEAF 1 (The Singer/Duty View)**.
  *   **B. No, death is too high a cost.** → **LEAF 2 (The Threshold View)**.

  ---

  ### NODE 3: The Scope of Duty (The Panhandler Case)
  *(You believe refusing the kidney is allowed. Now, is there *any* duty to help?)*
  **Question:** Your character walks past a panhandler because she is late for a medical appointment. If she does this, but *never* helps anyone else, is she **failing a moral duty**?

  *   **A. Yes, she must help *someone* sometimes; she just gets to pick when.** → **LEAF 3 (The Kantian/Latitude View)**.
  *   **B. No, helping strangers is never a strict duty; it's always a choice.** → Go to **NODE 4**.

  ---

  ### NODE 4: The Category Test
  *(You believe helping is optional. Why is it praiseworthy?)*
  **Question:** When we praise her for the kidney, are we praising her for entering a **special moral category** (above and beyond), or are we just praising her for doing something **permissible that happens to be nice**?

  *   **A. It is a special moral category (The "Fourth Category").** → **LEAF 4 (Classic Supererogation)**.
  *   **B. It's just Permission + Praise. "Supererogation" is a label, not a real moral thing.** → **LEAF 5 (Moral Illusion/Excuse View)**.

  ---

  ### NODE 5: The Consistency Check (The Splitter)
  *(For anyone who got stuck because their answer changed between cases.)*
  **Question:** Do the Kidney Case and the Grenade Case belong in the **same moral box**?

  *   **A. Yes.** → Return to **NODE 1** and answer based on the case you feel is *more* definitive.
  *   **B. No. The Grenade is Duty; the Kidney is Optional.** → **LEAF 6 (The Splitter View)**.

  ***

  # The Leaves (Where You Land)

  Hand this section out after they've traced their path. This tells them what their answers imply.

  ### LEAF 1: The Singer/Duty View
  *   **Core Belief:** Morality demands we do the most good we can. "Optional" is just a word we use when a duty is very hard.
  *   **On the Kidney:** She *should* have donated. Not donating is a moral failure, even if we don't punish her for it.
  *   **On the Grenade:** The soldier *should* have jumped.
  *   **On the Panhandler:** Walking past is wrong unless she has a very strong excuse (like her own health).
  *   **Tension Point:** Makes morality very demanding.

  ### LEAF 2: The Threshold View
  *   **Core Belief:** We have a duty to help, but the duty turns off when the cost to us becomes too high.
  *   **On the Kidney:** Likely a Duty (low risk). Refusing is wrong.
  *   **On the Grenade:** Not a Duty (death risk). Refusing is allowed.
  *   **On the Panhandler:** Walking past is wrong (low cost), unless the "medical appointment" is urgent.
  *   **Tension Point:** Where is the line? Is kidney surgery "too high" a cost?

  ### LEAF 3: The Kantian/Latitude View
  *   **Core Belief:** We have a "wide duty" to help humanity, but we get to choose the *time, place, and manner*.
  *   **On the Kidney:** Optional. She fulfilled her duty by living a good life or helping in other ways.
  *   **On the Grenade:** Optional. You can't duty someone to die.
  *   **On the Panhandler:** Permissible to walk past *if* she helps others sometimes. If she never helps anyone, she is failing her duty.
  *   **Tension Point:** How much helping is enough to satisfy the "wide duty"?

  ### LEAF 4: Classic Supererogation
  *   **Core Belief:** There is a real "Fourth Category" of action. It is good to do, blameless to skip.
  *   **On the Kidney:** Supererogatory. She is a saint for doing it, but not a sinner for skipping it.
  *   **On the Grenade:** Supererogatory. The soldier is a hero, not a deserter.
  *   **On the Panhandler:** Giving money is Supererogatory. Keeping it is Permissible.
  *   **Tension Point:** Why does praiseworthiness require optionality? (See Contested Nodes below).

  ### LEAF 5: Moral Illusion / Excuse View
  *   **Core Belief:** There are only Duties and Permissions. "Supererogation" is a psychological trick to make us feel better about not helping.
  *   **On the Kidney:** It is Permitted. We praise it to encourage others, but morally, it's just a permission.
  *   **On the Grenade:** Permitted.
  *   **On the Panhandler:** Permitted.
  *   **Tension Point:** Indistinguishable from Leaf 4 in practice. The difference is philosophical, not practical.

  ### LEAF 6: The Splitter
  *   **Core Belief:** The Kidney and the Grenade are fundamentally different kinds of moral problems.
  *   **On the Kidney:** Optional/Supererogatory.
  *   **On the Grenade:** Duty/Obligatory (due to role, contract, or extreme necessity).
  *   **On the Panhandler:** Usually Optional.
  *   **Tension Point:** What makes them different? Risk? Social role? Urgency?

  ***

  # ⚠️ The "Blunt Instrument" Warning
  *Read this before arguing about the results.*

  This tree sorts you by **case judgments**, not **philosophical labels**. Be aware of these two blind spots:

  1.  **Leaf 4 (Classic Supererogation) and Leaf 5 (Moral Illusion) are practically identical.**
      *   Both people will say: "Donating is good, skipping is okay."
      *   The only difference is metaphysical: One thinks "Supererogation" is a real thing in the universe; the other thinks it's just a name for "Permitted + Praiseworthy."
      *   *Advice:* If two people land here but argue, they are arguing about definitions, not your plot. Tell them to shake hands.

  2.  **Leaf 1 (Singer) and Leaf 2 (Threshold) might agree on the Kidney.**
      *   A Singerian might agree the kidney donation is a duty.
      *   A Threshold theorist might agree the kidney donation is a duty (because the risk is low).
      *   They will only split on the **Grenade**. If your group only argues about the Kidney, these two views will look the same. Use the Grenade case to separate them.

  ***

  # ⚔️ Contested Nodes (Where the Real Fights Are)
  *If the group gets stuck at a Node, it's because the question itself is philosophically loaded. Point this out.*

  **At NODE 1 (Blame Test):**
  *   **The Contest:** Can an act be **Praiseworthy** if it is **Required**?
  *   **Side A:** No. You don't get a medal for doing what you're supposed to do. (Supports Leaf 4).
  *   **Side B:** Yes. Doing a hard duty is *more* praiseworthy than an easy one. (Supports Leaf 1).
  *   *Novelist Note:* This determines if your protagonist is "virtuous" (Side A) or "responsible" (Side B).

  **At NODE 2 (Risk Ceiling):**
  *   **The Contest:** Is morality sensitive to **Risk** or **Outcome**?
  *   **Side A:** If the soldier dies, they can't fulfill future duties. Death cancels duty.
  *   **Side B:** If the squad lives, the good outweighs the bad. Risk is irrelevant.
  *   *Novelist Note:* This determines if the backstory soldier is a "martyr" or a "calculation."

  **At NODE 3 (Scope of Duty):**
  *   **The Contest:** Is there a **General Duty to Rescue**?
  *   **Side A:** Yes. We owe each other aid. (Kant/Singer).
  *   **Side B:** No. We only owe each other non-harm. (Libertarian/Classic Supererogation).
  *   *Novelist Note:* This is the core of the daughter's anger. If Side A is true, the mother owes aid to *everyone* (family and stranger). If Side B is true, the mother owes nothing to the stranger, making her choice to help the stranger even more baffling to the daughter.

  ***

  # Case Application Cheat Sheet
  *Use this to check if someone's position is consistent.*

  | Position | The Kidney (Donation) | The Grenade (Backstory) | The Panhandler (Dialysis Conflict) |
  | :--- | :--- | :--- | :--- |
  | **Singer (Duty)** | **Obligatory.** (She should have done it). | **Obligatory.** (Soldier should jump). | **Obligatory.** (Unless dialysis is life-threatening). |
  | **Threshold** | **Obligatory.** (Risk is low). | **Optional.** (Risk is death). | **Obligatory.** (Cost is low). |
  | **Kant (Latitude)** | **Optional.** (One way to fulfill duty). | **Optional.** (Beyond duty). | **Optional.** (Allowed if she helps elsewhere). |
  | **Classic Super.** | **Optional.** (Above & Beyond). | **Optional.** (Above & Beyond). | **Optional.** (Above & Beyond). |
  | **Moral Illusion** | **Permitted.** (We just praise it). | **Permitted.** (We just praise it). | **Permitted.** (We just praise it). |
  | **Splitter** | **Optional.** | **Obligatory.** | **Optional.** |

  **How to use this in the room:**
  If your ex-lawyer says, "Skipping the kidney is fine," but then says, "Walking past the panhandler was wrong," point to the **Kant/Latitude** leaf. They are arguing for a *General Duty*, not a *Specific Duty*.
  If the Peter Singer reader says, "The grenade jump was optional," they have moved to the **Threshold** leaf. Call them out on switching leaves mid-argument.
