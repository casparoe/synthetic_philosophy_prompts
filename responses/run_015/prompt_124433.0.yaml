prompt: |-
  Hey, I'm a novelist working on a character who's an ethicist with a bad habit of mixing up her actual preferences with moral biases. I've been using these cases to figure out her instincts, and I keep running into the same wall.

  She thinks eating meat is wrong because of animal suffering, and she thinks gambling is wrong because it exploits addicts -- both feel like real moral stances. She also thinks lying to a murderer at the door is fine, but lying to her sister about liking her painting is not -- that one feels like a practical rule, not a deep bias.

  But then there's the messy stuff. She drives a hybrid but judges people with big trucks as selfish. She flies home twice a year and doesn't see the contradiction. She thinks arranged marriage in other cultures is oppressive, but calls online dating 'just how people meet now.' And here's the one I can't resolve: she won't wear leather because of the animals, but she wears silk without a second thought, even though silk kills way more bugs per yard.

  Her verdicts seem to split into 'this is a principle' versus 'this is just my taste dressed up.' Is there actually a philosophical principle that can seperate moral preferences from biases in these cases? Maybe something about universalizability, or harm to people who can't consent, or consistant reflection? Or is the line basically circular -- you call it a bias when it doesn't match your social group?

  If there's a principle, what does it say about the silk/leather thing? And if there isn't one, what do I call the failure mode -- the way people build moral rules that happen to line up with their lifestyle? I don't need citations, just whether the carving holds up or if I'm writing a character who's just rationalizing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a novelist creating a character (an ethicist) who conflates personal preferences with moral biases.
      *   **The Problem:** The character has clear moral stances (meat, gambling), clear practical rules (lying to sister vs. murderer), but also inconsistent/hypocritical stances (hybrid vs. trucks, flying vs. driving, arranged marriage vs. online dating, leather vs. silk).
      *   **The Core Question:** Is there a philosophical principle that distinguishes "moral preference" from "bias/taste"? Or is the line circular (social signaling)?
      *   **Specific Test Case:** The leather vs. silk contradiction (leather bad due to animals, silk okay despite killing silkworms).
      *   **Goal:** Determine if the "carving" (distinction) holds up philosophically or if the character is simply rationalizing. The user wants to know *what* this failure mode is called if it's the latter.
      *   **Constraint:** No citations needed, just analysis of the concepts.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Universalizability (Kant):* Can everyone do this without contradiction? (Applies to lying, maybe driving, but hard to apply to taste).
      *   *Harm Principle (Mill):* Does it harm others? (Applies to meat/gambling, but then why not silk?).
      *   *Reflective Equilibrium (Rawls):* Balancing intuitions and principles. (The character is failing at this).
      *   *Moral Luck/Cultural Relativism:* Why is arranged marriage bad but online dating okay? (Cultural bias).
      *   *Cognitive Dissonance/Rationalization:* The psychological explanation.

  3.  **Evaluate the "Carving" (Principle vs. Bias):**
      *   *Is there a clean philosophical line?* Honestly, no. Philosophers argue about this constantly. Meta-ethics is a minefield.
      *   *However,* for a *character study*, the *failure* to distinguish is the point. The character *thinks* there's a line, but her application reveals it's mostly bias.
      *   *The "Silk vs. Leather" Case:* This is the smoking gun. If the principle is "do not kill sentient beings for clothing," silk violates it (boiling larvae). If the principle is "do not support factory farming," leather fits better (byproduct), silk is agriculture. But usually, vegetarians/vegans avoid both. Her avoiding leather but wearing silk suggests *visibility* and *cultural coding* matter more than the actual harm. Leather is viscerally "dead animal." Silk is "luxury fabric."
      *   *The "Flying vs. Driving" Case:* This is classic *compartmentalization*. High-impact infrequent acts (flying) vs. low-impact frequent acts (driving). Or convenience weighting.
      *   *The "Arranged Marriage" Case:* This is *ethnocentrism*. Framing one's own cultural norm as "agency" and the other as "oppression" without examining the coercion in both (social pressure to date online vs. family pressure to marry).

  4.  **Identify the Failure Mode:**
      *   It's not just "hypocrisy." Hypocrisy is knowing the rule and breaking it. She *believes* her rules are consistent.
      *   It's *Rationalization* or *Motivated Reasoning*.
      *   Specific philosophical term: *Particularism* (judging case-by-case without a unifying rule) masquerading as *Principlism*.
      *   Psychological term: *Cognitive Dissonance Reduction*.
      *   Sociological term: *Bourgeois Bohemian (Bobo) Contradictions* or *Signaling*.
      *   Best fit for an ethicist character: **Casuistry** (case-based reasoning) gone wrong, or **Motivated Reasoning** disguised as **Reflective Equilibrium**.
      *   Actually, the most precise term for "making up principles to fit your lifestyle" is **Special Pleading** or **Ad Hoc Reasoning**.
      *   But there's a specific concept in moral psychology: **Moral Licensing** (I did good thing A, so I can do bad thing B) or **Identity-Protective Cognition**.
      *   Let's look for a term that describes the *structural* failure. It's the **Is-Ought Problem** applied to personal taste. She turns "I don't like X" into "X is wrong."
      *   David Hume's **Sentimentalism**: Morality *is* sentiment. So maybe she's right? No, she claims objective standing.
      *   The best label for the *character flaw* is **Self-Serving Bias** within a framework of **Naïve Realism** (thinking she sees the moral truth clearly).
      *   Wait, there is a specific philosophical concept for "principles that align too conveniently with the agent's interests": **Ideology** (in the Marxist sense of false consciousness) or **Rationalization**.
      *   Let's go with **Motivated Reasoning** leading to **Inconsistent Universalization**.
      *   Actually, the prompt asks: "What do I call the failure mode?"
      *   Option A: **Hypocrisy** (Too simple, implies knowing better).
      *   Option B: **Rationalization** (Accurate, but psychological).
      *   Option C: **The Availability Heuristic** (Leather is visible dead skin, silk is not).
      *   Option D: **Cultural Arbitrary** (Leather is redneck, silk is high-brow).
      *   Option E: **Reflective Equilibrium Failure**. She isn't adjusting her principles to fit her judgments, she's adjusting her justification to fit her habits.

  5.  **Drafting the Response:**
      *   **Acknowledge the realism:** This is a incredibly accurate portrayal of how actual humans (even ethicists) function.
      *   **Address the "Principle":** There is no clean philosophical line that survives her scrutiny. The "carving" doesn't hold up under rigorous meta-ethics.
      *   **Analyze the Silk/Leather:** This is the key. It's about *proximity to violence* and *cultural signaling*. Leather = Cow (big mammal, visible slaughter). Silk = Worm (bug, invisible boiling). It's the **Identifiable Victim Effect** applied to species.
      *   **Name the Failure Mode:**
          *   Philosophically: **Special Pleading** (making exceptions for oneself without justification).
          *   Psychologically: **Motivated Reasoning** (starting with the conclusion "I want to wear this" and working backward to the principle).
          *   Sociologically: **Status Signaling** (Leather is low status in her circle, Silk is high status).
          *   The specific term for "moral rules that align with lifestyle": **Convenience Morality** or **Lifestyle Ethics**.
          *   Better term: **The Fundamental Attribution Error** applied to morals (others' actions = character, my actions = circumstance).
          *   Best term for the *system*: **Casuistry** (in the pejorative sense). Jesuit casuistry became synonymous with clever but unsound moral reasoning to justify specific cases.
      *   **Synthesize:** The character isn't finding principles; she's engaging in **Post-Hoc Rationalization**. She treats her intuitions as data points but refuses to discard the outliers (her own habits).
      *   **Advice for the Novel:** Lean into the *discomfort*. She shouldn't notice the silk/leather thing until someone points it out. The tension comes from her inability to see the pattern.

  6.  **Refining the "Silk vs. Leather" Analysis:**
      *   Why silk? Silkworms are pupae. They are killed inside the cocoon.
      *   Why leather? Cow skin.
      *   Difference: Mammal vs. Insect. Sentience perception.
      *   Difference: Leather is often a byproduct of meat (if she eats no meat, leather is waste? No, it adds value). Silk is the *purpose* of the insect farming.
      *   Actually, if she eats no meat, leather is arguably *more* wasteful (using the whole animal), but silk is *direct* killing.
      *   The real reason: Leather is associated with cowboys/butchers (visceral). Silk is associated with monks/nuns/elegance (abstract).
      *   This confirms it's **Aesthetic Disgust** masquerading as Ethics. (Rozin's work on disgust, though no citations needed).

  7.  **Finalizing the Verdict:**
      *   Does the carving hold? No.
      *   Is she rationalizing? Yes.
      *   What is it called? **Motivated Reasoning** within a framework of **Naïve Intuitionism**.
      *   Specific phrase for the user: **"The Coherence Gap."** Or simply **"Rationalization."**
      *   Let's suggest **"Moral Schizophrenia"** (in the philosophical sense of split agency) or **"Compartmentalization."**
      *   Actually, the most useful term for a writer is **"The Availability Heuristic"** combined with **"Status Signaling."**
      *   Wait, I need to answer the specific question: "Is there actually a philosophical principle...?"
      *   Answer: No, not one that she is applying consistently. If there *were*, she'd have to drop silk or accept leather.
      *   The failure mode is **Motivated Reasoning** (psych) / **Special Pleading** (logic).
      *   Let's focus on **Reflective Equilibrium**. She claims to use it, but she stops reflecting when it gets uncomfortable.

  8.  **Structure of the Output:**
      *   **Direct Answer:** The carving doesn't hold. She is rationalizing.
