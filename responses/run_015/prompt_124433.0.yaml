answer: |-
  Here is the blunt truth: **The carving does not hold.**

  From a rigorous philosophical standpoint, your character is not discovering moral truths; she is engaging in **motivated reasoning**. She starts with the conclusion (what she wants to do or what her social tribe does) and works backward to find a principle that justifies it, while ignoring principles that would condemn it.

  If she were actually applying a consistent ethical framework (like Utilitarianism, Deontology, or Virtue Ethics), the silk/leather contradiction would break her system. Since it doesn't, the system isn't doing the work—her instincts are.

  Here is how to diagnose the failure mode, specifically regarding the silk/leather case, and what to call it in your notes.

  ### 1. The Silk vs. Leather Verdict
  If her stated principle is "do not kill sentient beings for clothing," silk is objectively worse than leather by the numbers (thousands of pupae boiled per garment vs. one cow hide that yields multiple items).

  If her principle is "do not support factory farming," leather is complicated (often a byproduct), but silk is agriculture specifically for killing.

  The fact that she rejects leather but accepts silk reveals that her actual principle is not about *harm* or *consent*. It is about **visceral disgust** and **cultural signaling**.
  *   **Visceral Disgust:** Leather smells like a dead cow. It reminds us of slaughter. Silk feels like magic fabric; the boiling worms are invisible and abstract. She is following the **Availability Heuristic**—she judges based on how easily she can imagine the suffering, not the magnitude of it.
  *   **Class Signaling:** In her academic/social circle, leather is often coded as "rustic," "aggressive," or "low-status." Silk is coded as "refined," "historical," or "high-status." She is mistaking **aesthetic preference** for **moral superiority**.

  ### 2. The Failure Mode: What to Call It
  You asked if there is a name for "building moral rules that happen to line up with your lifestyle." There are a few, depending on which lens you want to use for her internal monologue:

  **A. Special Pleading (Logical Fallacy)**
  This is the most direct label. She applies a strict rule to others (don't wear leather) but creates an unspoken exception for herself (silk is fine) without a relevant difference in the underlying logic.

  **B. Reflective Equilibrium Failure (Philosophical Term)**
  Philosophers aim for "reflective equilibrium"—a state where your specific judgments (leather is bad) and your general principles (killing is bad) align. When they clash, you must adjust one. Your character refuses to adjust. She keeps the judgment *and* the principle, ignoring the clash. She is **stagnant**, not reflective.

  **C. Identity-Protective Cognition (Psychological Term)**
  This is likely the most accurate for a novelist. Her morality is a shield for her identity. Admitting silk is unethical would require her to change her wardrobe, spend more money, or lose status. Her brain protects her identity by rationalizing the exception. She isn't lying; she genuinely believes the rationalization in the moment.

  **D. Casuistry (Historical/Pejorative)**
  Originally a method of case-based reasoning, "casuistry" became an insult meaning "clever but unsound reasoning used to justify specific cases." It fits an ethicist perfectly. She is a **casuist** who thinks she is a **principled deontologist**.

  ### 3. How to Write the "Carving"
  You asked if there is a principle that separates moral preferences from biases. There is one test she *could* use, but she consistently fails it: **The Veil of Ignorance.**

  *   **The Test:** Would she still hold this rule if she didn't know her place in the scenario?
      *   *Meat:* Would she ban meat if she were the animal? (Yes, implies principle).
      *   *Silk:* Would she ban silk if she were the worm? (If she says "worms don't count," why do cows? If she says "I need clothes," why not leather?)
      *   *Flying:* Would she accept climate change consequences if she were the person drowning in a coastal city? (No, she wouldn't accept the trade-off).

  **The Character Flaw:**
  She treats her **intuitions** as **data**, but she treats her **inconveniences** as **exemptions**.

  When she judges the truck driver, she is using a **Fundamental Attribution Error**: "They drive a truck because they are selfish." When she flies, she uses **Situational Attribution**: "I fly because I have no other way to see my family."

  ### 4. Recommendation for the Novel
  Don't make her a hypocrite who *knows* she's lying. That's boring. Make her a hypocrite who is **genuinely confused** when someone points out the silk thing.

  *   **The Scene:** Someone points out the silkworms.
  *   **Her Reaction:** She shouldn't say, "Oh, I guess I'm wrong." She should double down. "It's not the same. Cows feel pain. Worms are... instinctual."
  *   **The Tell:** Watch her scramble to find a *difference* that isn't just "I like silk better."

  **The Verdict:**
  She is not an ethicist finding the truth; she is a human building a **Myth of Consistency**. She is constructing a narrative where she is the Good Guy, and any evidence that contradicts that is treated as an exception, not a refutation.

  If you need a single phrase for your character bible to describe this: **"Post-Hoc Rationalization of Pre-Existing Bias."** She feels the preference first, then writes the ethics paper to justify it.
