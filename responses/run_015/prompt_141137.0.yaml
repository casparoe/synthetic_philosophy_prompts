  In a housing co-op, Alex repeatedly borrows Sam's specialized tools without asking, returning them dull or missing parts. Each instance is apologized for as an oversight, but over six months, Sam's equipment is degraded. All agree the pattern violates property and trust. An honor-oriented Sam demands Alex publicly restore Sam's standing by replacing the tools and acknowledging the disrespect at the next meeting. A dignity-oriented Sam files a formal grievance with the co-op board, seeking impartial enforcement of the borrowing bylaws to restore equal standing. A victimhood-oriented Sam documents every incident and circulates a statement to the house mailing list, framing the behavior as systemic abuse requiring collective validation and policy change. The divergence lies not in the harm's reality, but in whether redress requires personal vindication, procedural correction, or public acknowledgment of vulnerability. Swap Alex and Sam's cultural repertoires, and the conflict dynamics shift entirely despite identical facts.

  | culture | first_move | counts_as_wrong | currency | success_condition | strongest_line | cost_here |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Honor | Confronts Alex directly at meeting | Pattern shows disregard for status | Reputation | Public restoration of respect | Prevents normalization of disrespect | Risks escalating into personal feud |
  | Dignity | Files formal grievance | Rule violation proven | Equal standing | Impartial ruling enforced | Depersonalizes conflict; protects neutrality | Destroys neighborly trust; feels cold |
  | Victimhood | Circulates documented statement | Pattern proves systemic harm | Audience validation | Collective acknowledgment of harm | Highlights power imbalances invisible to rules | Polarizes community; centers victimhood |

  The cumulative nature of the injury drives the divergence. If this were a single smashed tool, dignity culture wins: clear rule, clear remedy. But micro-harms evade binary rule enforcement. The board can rule "no violation" on each instance in good faith, technically satisfying dignity while failing Sam. The structural mismatch makes dignity look bureaucratic and blind to relational erosion.

  A dignity defender objects that formal channels prevent vigilante justice and escalation. This lands poorly here because the "justice" needed is relational, not legalistic. The cost is social cohesion.

  Settled: These are ideal types (Campbell & Manning), not empirical descriptions of every individual. Contested: Whether victimhood is distinct or honor-by-proxy. Contested: Whether dignity is neutral or reflects privileged insulation from slights. I am extrapolating ideal responses; actual people mix repertoires. I am not claiming dignity is superior; the scenario structures its failure via the "cumulative" constraint to test moral ranking questions.
