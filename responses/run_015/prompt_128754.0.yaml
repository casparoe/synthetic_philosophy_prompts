answer: |-
  # Decision Tree: Responses to the Heterogeneity Problem in Hedonism

  **ROOT:** Is there a single phenomenal quality present in every case of pleasure?

  *   **NO** (Non-Qualitative Accounts)
      *   **BRANCH:** What unifies these states instead of quality?
          *   **Pro-Attitude** (Desire/Liking-based)
              *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                  *   **Yes:** **Pure Pro-Attitude Hedonism**
                      *   *Awkward Commitment:* It must classify the sadist's enjoyment of cruelty as phenomenologically identical in value-structure to the saint's enjoyment of charity.
                  *   **No:** **Perfectionist Pro-Attitude Hedonism**
                      *   *Awkward Commitment:* It must explain why some pro-attitudes count as "pleasure" while others do not, without appealing to a felt quality.
          *   **Representational** (Content/Awareness-based)
              *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                  *   **Yes:** **Pure Representational Hedonism**
                      *   *Awkward Commitment:* It implies that being falsely aware of a good state (e.g., deception) is as pleasurable as being truly aware of one.
                  *   **No:** **Veridical Representational Hedonism**
                      *   *Awkward Commitment:* It risks collapsing into objective list theory by making pleasure dependent on external facts rather than internal state.
          *   **Functional** (Causal/Dispositional Role-based)
              *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                  *   **Yes:** **Pure Functional Hedonism**
                      *   *Awkward Commitment:* It must accept that a brain-in-a-vat stimulated to play the pleasure-role is experiencing genuine pleasure.
                  *   **No:** **Normative Functional Hedonism**
                      *   *Awkward Commitment:* It conflates the description of a mental state with the evaluation of its moral outcomes.
          *   **Family Resemblance** (No common unity, only overlaps)
              *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                  *   **Yes:** **Wittgensteinian Hedonism**
                      *   *Awkward Commitment:* It abandons the search for a unified theory of value, making interpersonal comparisons of pleasure logically precarious.
                  *   **No:** **Fragmented Hedonism**
                      *   *Awkward Commitment:* It suggests "pleasure" is merely a homonym, undermining hedonism as a single normative principle.

  *   **YES** (Qualitative Accounts)
      *   **BRANCH:** Is that quality intrinsic to the experience or relational?
          *   **RELATIONAL** (e.g., Attitudinal Pleasure)
              *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                  *   **Yes:** **Uniform Relational Hedonism**
                      *   *Awkward Commitment:* It must maintain that the relation of "liking" is identical whether directed at poetry or push-pin.
                  *   **No:** **Hierarchical Relational Hedonism**
                      *   *Awkward Commitment:* It must posit a second-order relation to explain why some first-order likings are "higher" than others.
          *   **INTRINSIC** (Feeling Theory)
              *   **BRANCH:** Is heterogeneity dissolved by treating pleasure as a determinable rather than a determinate?
                  *   **DETERMINATE** (Specific Feeling)
                      *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                          *   **Yes:** **Qualitative Uniformitarianism**
                              *   *Awkward Commitment:* It requires introspective evidence for a specific "tingle" common to orgasmic bliss and solving a puzzle, which most subjects deny.
                          *   **No:** **Qualitative Hierarchism**
                              *   *Awkward Commitment:* It must explain how the same specific feeling can be morally elevated in one context and base in another.
                  *   **DETERMINABLE** (Generic Feeling)
                      *   **BRANCH:** Do base/malicious pleasures count as genuinely pleasurable in the same sense as elevated ones?
                          *   **Yes:** **Determinable Hedonism**
                              *   *Awkward Commitment:* It relies on a generic quality so abstract it risks becoming indistinguishable from the non-qualitative pro-attitude view.
                          *   **No:** **Determinable Hierarchism**
                              *   *Awkward Commitment:* It must claim the generic quality itself comes in morally weighted varieties, contradicting its status as a generic determinable.

  ***

  ### Collapsing Leaves and Logical Instabilities

  **1. Determinable Hedonism vs. Pure Pro-Attitude Hedonism**
  These positions collapse once we allow family-resemblance relations among pleasures. If the "determinable quality" is defined broadly enough to cover all heterogeneous cases (chocolate, math, relief), it often loses its phenomenal content and becomes functionally identical to "having a pro-attitude toward the experience." The distinction between "feeling a generic pleasantness" and "liking the experience" vanishes.

  **2. Uniform Relational Hedonism vs. Pure Pro-Attitude Hedonism**
  Relational accounts define pleasure by the subject's attitude toward an object. Without a robust phenomenal quality to anchor the relation, this view is extensionally equivalent to Pro-Attitude Hedonism. The tree separates them by metaphysical commitment (relation vs. desire), but their practical implications and awkward commitments regarding base/elevated pleasures are indistinguishable.

  **3. Wittgensteinian Hedonism vs. Determinable Hedonism**
  If the "determinable" is sufficiently flexible to accommodate heterogeneity without a specific common thread, it effectively operates as a family resemblance. The tree treats them as distinct (Yes/No to single quality), but in practice, a sufficiently thin determinable is logically indistinguishable from a resemblance cluster.
