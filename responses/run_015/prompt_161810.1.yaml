answer: |-
  This is one of the most sophisticated engagements with public history I've seen. You are essentially grappling with the tension between *historical truth* (what happened) and *narrative truth* (what it means), but you've correctly identified that a simple binary doesn't work because power, function, and harm matter more than accuracy.

  Your tentative principle ("Record = who/what, Memory = meaning/like") is strong, but it breaks on Case 6 (Colonial) and Case 9 (The Crime). In Case 6, the record *lies* about the "who/what." In Case 9, the memory *is* the evidence of the "who/what."

  Here is a proposed framework that fits your gut instincts, explains the outliers, and gives you language for your committee.

  ### The Principle: Epistemic Jurisdiction and Harm

  The principle isn't about accuracy; it's about **jurisdiction** and **direction of harm**.

  1.  **Jurisdiction:** Archives have jurisdiction over *mechanisms* (logistics, chain of command, dates, financial transactions). Memory has jurisdiction over *impact* (fear, solidarity, betrayal, identity).
  2.  **Direction of Harm:** Memory is protected when it serves **internal cohesion** or **corrects a power imbalance**. Memory must yield when it assigns **false external liability** or **obstructs justice**.
  3.  **The Archive's Integrity:** The archival record loses its jurisdiction when the archive itself was an instrument of oppression (Case 6) or erasure (Case 9).

  ### Applying the Principle to Your Verdicts

  Here is how this principle validates most of your gut, but forces a shift on the Statues (Case 3) and clarifies the Crime (Case 9).

  **1. Alpine Village (Mercenaries vs. Militia)**
  *   **Verdict:** Keep.
  *   **Why:** The claim is one of *virtue* (we were brave), not *liability* (you owe us). The error harms no one external. The reenactment is ritual, not a history lesson. The plaque is a claim of fact, so it gets corrected to preserve the archive's jurisdiction over mechanisms.
  *   **Principle Check:** Internal cohesion (high), External harm (low).

  **2. Grandfather (Resistance vs. Clerk)**
  *   **Verdict:** Keep.
  *   **Why:** "Resistance" is a historical category (Archival jurisdiction). "He saved families" is a moral truth (Memory jurisdiction). You are separating the label from the act.
  *   **Principle Check:** You are respecting the archive's limit on labels while honoring memory's limit on meaning.

  **3. National Independence (Statues)**
  *   **Verdict:** **You must move or contextualize the statues.**
  *   **Why:** This is where your gut needs to shift. A holiday is participatory (we celebrate *ourselves*). A statue is didactic (we honor *him*). A statue claims the subject is a moral exemplar. If the record shows he took foreign money to kill compatriots, he fails the moral test. Keeping the statue validates the lie as a model for the future.
  *   **Principle Check:** Statues claim historical greatness (Archival jurisdiction). If the mechanism (treason) undermines the meaning (liberation), the statue becomes a tool of disinformation.

  **4. The Flood (Abandoned vs. Refused)**
  *   **Verdict:** Memory yields.
  *   **Why:** This feels different from Case 1 because it assigns **external liability**. "The government abandoned us" is a claim against the state that demands policy changes, compensation, or trust. If false, it corrupts the social contract. It is using memory as a "receipt" for grievance based on a falsehood.
  *   **Principle Check:** False external liability. This is the exact boundary where memory loses protection.

  **5. Religious Shrine (Beginning of Time vs. 1400)**
  *   **Verdict:** No correction.
  *   **Why:** Category error. "Beginning of time" is theological, not chronological. The archive has no jurisdiction over theology.
  *   **Principle Check:** Distinct jurisdictions.

  **6. Colonial Police (Riot vs. Protest)**
  *   **Verdict:** Trust Memory.
  *   **Why:** The Archive is not neutral here; it is the weapon of the occupier. The "mechanism" (who fired first) was recorded by the shooter to justify the shooting. Memory here is not just "feeling"; it is a **counter-archive**.
  *   **Principle Check:** Archive integrity is voided due to power imbalance. Memory corrects power.

  **7. Massacre Survivor (Unit Alibi)**
  *   **Verdict:** Keep testimony, remove unit name.
  *   **Why:** Trauma memory is hyper-accurate on *sensory/experiential* data (fire, fear, pain) but often unreliable on *administrative* data (unit numbers, distances). Honoring the burning (Memory) without libeling the specific soldiers (Archive) balances the jurisdictions.
  *   **Principle Check:** Respecting the limits of trauma memory regarding logistics.

  **8. Invented Legend (1890 vs. 400-year)**
  *   **Verdict:** Protect the 400-year error, allow the 1890 stunt.
  *   **Why:** This isn't about reliability; it's about **sincerity and continuity**. The 400-year memory is *constitutive*; it built the community's identity over generations. The 1890 legend is *decorative*; it was a marketing stunt. We protect organic traditions even when flawed; we tolerate cynical inventions as long as they are known to be cynical ("civic cosplay").
  *   **Principle Check:** Internal cohesion via continuity vs. commercial fabrication.

  **9. The Crime (Memory as Only Evidence)**
  *   **Verdict:** **Memory must stand as evidence.**
  *   **Why:** This is the crux. If the descendants of perpetrators demand the "record decide," they are weaponizing the archive. Often, crimes (especially state or colonial crimes) leave no paper trail *because* the perpetrators destroyed it. To say "no record, no crime" is to grant the perpetrators a veto on justice.
  *   **Principle Check:** When the archive is silent due to erasure, Memory assumes jurisdiction over the "who/what" provisionally. To do otherwise is to complete the erasure.

  ### The "Purely Academic" Case

  You asked about the situation where record and memory disagree but no one alive has a stake.

  **Verdict:** The Record wins, but the Memory gets a footnote.
  If there is no living community to be harmed or cohesive bond to be broken, history reverts to a discipline of evidence. However, a good historian will note *why* the memory diverged. (e.g., "The battle did not happen here, but the village believed it did because...")
  *   **Why:** Without a living stake, there is no "Harm" constraint. The goal becomes accuracy. But the *existence* of the memory remains a historical fact worth recording.

  ### Summary for Your Committee

  You are arguing about a plaque. Here is how to frame it using this framework:

  1.  **Identify the Function:** Is this plaque a **historical marker** (claiming archival truth) or a **memorial** (honoring communal meaning)?
      *   If it's a memorial, accuracy on logistics matters less than sincerity of sentiment.
      *   If it's a historical marker, the archive has jurisdiction.
  2.  **Check for Liability:** Does the plaque assign blame or demand debt from an external group?
      *   If yes, the archival standard must be higher (Case 4).
      *   If no (it's just about us), you have more leeway (Case 1).
  3.  **Check the Archive's Hands:** Was the record created by a power that had an interest in lying?
      *   If yes, oral testimony carries equal or greater weight (Case 6).
  4.  **The "Both/And" Solution:** Most of your verdicts suggest a dual approach.
      *   *Case 1:* Plaque says "Tradition holds X, Records show Y."
      *   *Case 7:* Memorial says "A village was burned," avoids naming the unit.
      *   *Case 3:* Statue stays only if a second plaque explains the complexity.

  **The Principle in One Sentence:**
  > *Community memory governs meaning and identity unless it falsely assigns external liability or obstructs justice; the archival record governs mechanism and logistics unless it was created as an instrument of oppression.*

  Your gut was right on almost everything. The only adjustment is the Statues (Case 3), because statues are pedagogical tools that claim historical virtue, not just communal feeling. And on Case 9, you must be firm: when the archive is silent, memory is not just a story; it is the only evidence left, and demanding a receipt is a form of silencing.
