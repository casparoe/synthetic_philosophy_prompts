answer: |-
  **The Scenario**

  Elena manages a fleet of emergency medical couriers, a role she has held for five years since her company mandated the use of "DispatchPro," a tablet system that stores all delivery sequences and calculates routes in real-time. Her biological capacity to mentally map routes or recall order sequences has atrophied significantly; without the tablet, she cannot coordinate more than two drivers simultaneously without catastrophic errors, making the device functionally indispensable for her cognitive performance on the job. The tablet is always on, instantly accessible, and never glitches, satisfying all requirements for availability and reliability, and company audits punish any deviation from its instructions, ensuring constant invocation. However, Elena knows the algorithm prioritizes fuel savings over safety, frequently routing drivers through high-crime zones she would never choose, and she follows every instruction solely to avoid termination rather than because she believes the route is correct; she mentally flags each instruction as "company risk" rather than "my plan," maintaining a standing distrust of the content even as she relies on it to generate her actions.

  ***

  **Analysis of the Views**

  **The Parity Principle**
  The parity principle states that if a process in the world were performed in the head, we would regard it as cognitive. If Elena were calculating these routes and storing these sequences biologically, we would unquestionably call it cognition. The permissive coupling view leans heavily on this: since the tablet is doing the exact work her brain used to do (storing sequences, transforming location data into action plans), and she is cognitively degraded without it, the tablet *must* be part of her cognitive system. The physical location is irrelevant; the functional role is identical to internal memory and planning.

  **The Four Trust-and-Glue Conditions (Clark & Chalmers)**
  1.  **Reliably available and typically invoked:** **Yes.** The tablet is always on, never crashes, and she uses it for every delivery.
  2.  **Automatically endorsed:** **No.** This is the breaking point. Otto believes his notebook entries are true; Elena believes the tablet's routes are *dangerous*. She does not accept the content as accurate or good; she accepts it as compulsory. There is a meta-cognitive layer of distrust that Otto lacks.
  3.  **Easily accessible:** **Yes.** It is in her hand, instant retrieval.
  4.  **Consciously endorsed in the past:** **No.** Otto wrote his notes; Elena never chose this system or verified its logic. It was imposed by the company.

  Because conditions 2 and 4 fail, Clark and Chalmers' specific version of EMT says this resource is *not* part of her mind. It is a tool she is forced to use, not a component of her cognitive agency.

  **The Permissive Coupling View**
  This view says **Yes**. It cares only about tight causal coupling and representational work. The tablet stores the content (routes), transforms input (orders) into output (directions), and Elena's brain treats it as the primary source of action-planning. The fact that she dislikes or distrusts the content is irrelevant to the *mechanics* of the coupling. Her brain has offloaded the work; therefore, the mind extends.

  **The Single Feature Doing the Work**
  The decisive feature is **coercive imposition decoupling reliance from endorsement**. In Otto's case, reliance and endorsement match: he uses the book because he trusts it. In Elena's, reliance is driven by external threat (firing), while endorsement is withheld. This feature creates the wedge between the permissive view (which sees the reliance) and C&C (which requires the endorsement).

  If you tweak the case so Elena *does* trust the resource—perhaps she chose the software herself and believes its safety calculations are perfect—the case collapses back into plain Otto. The C&C conditions are met, the permissive view still says yes, and the disagreement vanishes. The divergence exists *only* because the scaffolding was imposed against her normative judgment.

  **The Causal-Constitutional Critic**
  The critic who argues that cognition must be inside the skull (the causal-constitutional objection) would also say **No**, but for a entirely different reason. They don't care about trust, endorsement, or coercion. They care about boundaries. For them, the tablet is outside the skin, so it is merely a causal influence on the mind, not a constituent of it. Their "No" aligns with C&C's verdict here, but it is a blanket exclusion based on location, whereas C&C's exclusion is specific to the *quality of the relationship* (lack of trust). This shows the two "No" verdicts come apart: the constitutionalist would reject Otto's notebook too; C&C accepts Otto's but rejects Elena's.

  **The Strongest EMT Defense (Implicit Trust)**
  A defender of Clark and Chalmers might argue: "Action implies trust. If Elena acts on the tablet's instructions automatically to coordinate her fleet, she *is* endorsing them practically, regardless of her verbal dissent. Her explicit distrust is just a higher-order attitude sitting on top of real, first-order reliance. Otto might worry his notebook is wrong sometimes, but he still uses it; Elena is doing the same."

  **How well this reply works:**
  This reply is strong but vulnerable in this specific case. The difference between Otto and Elena is the *motivation for action*. Otto acts because he believes *p* (the route is correct). Elena acts because she believes *q* (if I don't follow *p*, I get fired). The cognitive system is supposed to track truth or goal-achievement, not just behavior. If the tablet is driving her actions via threat rather than via accepted representation, it functions more like a gun to the head than a memory store. However, the weak point for the critic is that functionally, the tablet *is* guiding the behavior exactly like memory. If the EMT defender insists that "functional role trumps motivational nuance," they can absorb Elena. But to do so, they must weaken the "trust" condition to the point where it barely means anything more than "used."

  **Honesty Check: Where This Breaks**
  The weakest step in this demonstration is the distinction between **functional reliance** and **normative endorsement**. An EMT defender could argue that "trust" in the parity principle isn't about feeling safe or agreeing with the content; it's about whether the resource is treated as a primary source of information for action. Elena *does* treat it as the primary source. Her internal protestations might be epiphenomenal to the cognitive process itself.

  To make you abandon the claim that C&C says "No," an EMT defender would need to show that **Condition 2 (Automatic Endorsement) is satisfied by behavioral compliance alone.** They would need to argue that the "glue" is the smoothness of the interaction, not the subject's internal agreement. If they can convince you that Elena's mental flagging of "company risk" is just extra processing *within* the extended system (like an error-checking subroutine) rather than a refusal of integration, then the case collapses. The demonstration relies on the intuition that *coercion* breaks cognitive integration. If you believe a coerced tool can still be part of a mind (e.g., a soldier following orders via a radio they distrust), then the case fails to drive a wedge between the views. The case ultimately trades on the intuition that "mind" implies a degree of agency or ownership that imposed scaffolding lacks—a normative claim that functionalists might reject.
