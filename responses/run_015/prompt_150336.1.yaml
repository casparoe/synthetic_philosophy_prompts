prompt: |-
  I'm defending, in next week's philosophy-of-science seminar, the thesis that Gödel's incompleteness theorems are illegitimately extended outside mathematics: Lucas-Penrose-style anti-mechanist arguments conflate syntactic omega-incompleteness with epistemic openness, and popular claims that Gödel "shows" social or cognitive unpredictability are straightforward category errors. I do concede one narrowly engineered exception—self-certifying distributed software architectures face a structurally analogous constraint related to the second theorem—and I argue that recognizing this boundary case actually reinforces confinement of Gödel to formal domains. The audience is mostly philosophers of science, with two AI researchers skeptical of mechanist dismissals and one logician who knows the derivations cold. Prepare me for the objections in roughly the order they'll arise: the logician's technical correction, the AI researcher's mechanist counter, the "so what?" challenge to my exception, and the objection I'm hoping nobody raises linking this to Turing's halting problem. For each, phrase it as that interlocutor would, indicate what I should concede, what I should hold, where my reply is weakest, and how long I have to deliver it. Also tell me what specific result or argument—for example, a valid formal extension of Gödel's second theorem to non-axiomatized epistemic practices, or a proof that my distributed-system analogy collapses into a standard consistency check—would change my mind, and identify the point in my reasoning that is most likely to fail.
