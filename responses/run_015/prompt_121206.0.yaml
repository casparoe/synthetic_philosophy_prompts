answer: |-
  This is a sharp observation. You have identified a structural weakness in what meta-ethicists call **Ideal Advisor Theory** (or Ideal Observer Theory) and what bioethicists call **Substituted Judgment**.

  To answer your first question directly: **No, there is no single, canonical term** in the philosophical literature that isolates this specific rhetorical failure mode. It is usually subsumed under broader categories like "Special Pleading," "Motivated Reasoning," or critiques of "Non-Ideal Theory."

  However, given your request for precision and boundaries (and honoring your background in the sciences), I propose we coin a term that captures the structural mechanics of the error. The most precise label is:

  ### **The Epistemic-Normative Asymmetry**
  *(Also acceptable: The Idealization Asymmetry)*

  Here is the exact definition, the boundaries you requested, and why it differs from adjacent concepts.

  ---

  ### 1. The Definition
  **The Epistemic-Normative Asymmetry** occurs when an arguer treats a hypothetical ideal agent (e.g., "your rational future self," "a reasonable person") as having **high normative authority** (binding obligations) but selectively manipulates the **epistemic accessibility** (knowability) of that agent's desires to suit a preferred conclusion.

  *   **When the ideal agent supports the conclusion:** The agent is treated as *epistemically accessible*. ("We know exactly what your rational self would want: to save money/to live.")
  *   **When the ideal agent undermines the conclusion:** The agent is treated as *epistemically inaccessible*. ("We cannot possibly compute what a rational patient would choose in this state, so we must default to preservation.")

  The **Normative** weight remains constant (the ideal self is always the boss), but the **Epistemic** access to the boss's orders shifts based on convenience.

  ### 2. The Boundaries (What it is NOT)

  To ensure this term does useful work, we must distinguish it from three nearby concepts:

  #### **A. It is not Ordinary Hypocrisy**
  *   **Hypocrisy:** "I say you should save for retirement, but I spend all my money." (Violation of the rule).
  *   **Asymmetry:** "You should save because your ideal self says so. But we can't ask your ideal self about euthanasia because that's unknowable." (Manipulation of the *source* of the rule).
  *   **Boundary:** Hypocrisy is about *action* vs. *preachment*. Asymmetry is about *justification* vs. *justification*.

  #### **B. It is not Simple Equivocation**
  *   **Equivocation:** Using the word "rational" to mean "logical" in premise 1 and "self-interested" in premise 2.
  *   **Asymmetry:** The definition of "rational/ideal" remains stable. The *status* of our access to that definition changes.
  *   **Boundary:** Equivocation shifts *meaning*. Asymmetry shifts *accessibility*.

  #### **C. It is not Legitimate Kantian Regulative Use**
  *   **Kantian Regulative Idea:** An ideal (like the "Kingdom of Ends") is acknowledged as *constitutively unreachable* but *regulatively binding*. We know we can't fully achieve it, but we must strive toward it as a compass.
  *   **Asymmetry:** The arguer treats the ideal as *constitutive* (a specific algorithm yielding a specific answer) when it yields their desired result, but retreats to calling it *regulative* (too abstract to apply) when it yields an undesired result.
  *   **Boundary:** Kant is consistent about the ideal's unreachability. The Asymmetry is inconsistent about the ideal's computability.

  ### 3. A Chemist's Analogy: The Ideal Gas Law
  Since you come from chemistry, consider the **Ideal Gas Law ($PV=nRT$)**.

  *   **Legitimate Use:** You acknowledge it is a model that works well under low pressure/high temperature. You use it within those bounds.
  *   **The Asymmetry:**
      *   *Scenario A:* You want to prove a container is safe. You use the Ideal Gas Law because it predicts lower pressure than reality. You treat the "Ideal Gas" as authoritative.
      *   *Scenario B:* Someone points out the container is at high pressure, where the Ideal Gas Law fails (requiring Van der Waals equations). You reply, "We can't measure the Van der Waals constants for this mixture, so we must default to the Ideal Gas Law."
      *   *Result:* You are using the "Ideal" model not because it is accurate, but because it is *conveniently indeterminate* when the accurate model threatens your conclusion.

  ### 4. Why This Happens (The Philosophical Mechanism)
  This move exploits a gap in **Ideal Advisor Theory** (championed by philosophers like Peter Railton or Michael Smith). The theory states: *X is good for Agent A if A's fully informed, rational self would want A to have X.*

  The problem is that the "fully informed, rational self" is a **counterfactual**. It does not exist.
  *   When the speaker wants to enforce prudence (retirement), they pretend the counterfactual is **determinate** (we know the answer).
  *   When the speaker wants to enforce default norms (preservation of life), they pretend the counterfactual is **indeterminate** (we can't know the answer, so we use a proxy).

  ### 5. Proposed Usage
  If you encounter this in debate or writing, you can now label it precisely:

  > "You are engaging in an **Epistemic-Normative Asymmetry**. You treat the 'ideal self' as epistemically accessible when it mandates saving, but epistemically inaccessible when it might mandate stopping treatment. You cannot claim the ideal agent is a binding authority *and* an unknowable heuristic simultaneously."

  ### Summary of the Concept
  *   **Name:** The Epistemic-Normative Asymmetry (of Idealization).
  *   **Core Mechanism:** Fixing the *authority* of the ideal while shifting the *knowability* of the ideal.
  *   **Genus:** A specialized form of Special Pleading.
  *   **Species:** Distinct from Equivocation (meaning doesn't change) and Hypocrisy (action isn't the issue).
  *   **Kantian Violation:** Treating a Regulative Idea as Constitutive when convenient.

  This gives you a precise tool to dissect the move without getting bogged down in accusations of bad faith. It identifies the structural flaw in the argumentation itself.
