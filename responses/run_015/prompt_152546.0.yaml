prompt: |-
  You're an expert philosopher of physics who works on the foundations of quantum mechanics — please take this seriously and brainstorm a bit before you commit to anything. I want to see the candidate principles you consider, the ones you throw out, and why, not just a verdict.

  So me and my buddy got into a long argument last night about Bell's theorem, and he has this weirdly consistent set of likes and dislikes about which "way out" of the Bell inequalities counts as legit, and I want to know what he'll say about a case we never got to. He's a physics guy, not a philosopher, but he's read a lot of this stuff on his own.

  His track record, best I can reconstruct from last night:

  - Bohmian mechanics / pilot-wave: rejects it. His complaint is that the guidance lets what happens at one wing depend instantaneously on what the knob at the other wing is set to. Says it's cheating.
  - Spontaneous collapse models (the GRW kind, where the wavefunction jumps at random): rejects those too. His complaint there is that the jump is a single physical event smeared across both wings at once. Important detail: he knows perfectly well these don't let you signal, and he does not care — no-signalling isn't his standard.
  - Superdeterminism — the source's hidden variables are correlated with what the experimenters will choose, because of how the universe was initially set up: rejects hard. Calls it a conspiracy and says the "explanation" just restates the data.
  - Everett / many worlds: accepts it, or at least says it isn't cheating. Says the dynamics is strictly local, nothing crosses the gap, and the correlations come out of branching. He'll happily admit the quantum state is holistic and non-separable and it doesn't seem to bother him at all.
  - Plain operational QM — no hidden variables, no collapse, the state is just a predictive gadget and the correlations are brute: he allows this one. Calls it unsatisfying but honest.

  Here's the case we didn't get to. A retrocausal model: the hidden variables at the source partly depend on what the experimenters will later set their knobs to, because the influence runs backwards in time along the particles' worldlines (or inside the light cone), so nothing travels faster than light — everything stays timelike or null, it's just that some of the causal arrows point the other way. The people pushing these models also insist it isn't fine-tuned the way superdeterminism is, because the dependence of the source on the settings is produced by an actual backwards causal process instead of being a coincidence somebody had to arrange in the initial conditions.

  So: yes or no from him? What's the principle he's actually running here — "nothing crosses a spacelike gap," Bell-style local causality / screening off by the shared past, "no conspiracy," or something more like cost accounting where every option violates something and you pick the cheapest violation? Which of those fit all five of his verdicts above, where do they come apart on the retro case, and what's your best guess with the reasons for preferring it? Does it matter for your answer that he tolerates Everett's holism while rejecting superdeterminism's settings-dependence, and that he doesn't care about signalling?

  Then two more things. First, what's the single further case I should put to him that would actually tell the surviving principles apart, and what would each predict (I was thinking something like a retro model where the backwards influence isn't carried along worldlines at all but imposed as a global constraint on the whole setup, but tell me if that's the right probe or a bad one). Second, please don't just name-drop interpretations at me — I want the shape of the disagreement, in a way I could take back to the bar.
