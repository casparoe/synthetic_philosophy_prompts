answer: |-
  **DRAFT JOINT STATEMENT: ADVERSARIAL COLABORATION ON RORTY**
  **Participants:** [Neopragmatist Proxy] & [Scientific Realist Proxy]
  **Status:** Working Draft v.3 (pending final review)

  **1. Agreed Claims**

  1.  **On the History of the Mirror:** We agree that the "Mirror of Nature" metaphor is not merely Rorty's invention but identifies a lineage tracing from Descartes through Kant to early analytic philosophy. Both sides accept that this lineage treats the mind (or language) as a medium that *contains* representations which can be judged by their accuracy to an external object. We agree Rorty's primary target is the *philosophical utility* of this metaphor, not the everyday use of words like "accurate."
  2.  **On External Reality:** We agree that Rorty does not deny the causal efficacy of the external world (e.g., fire burns regardless of vocabulary). The dispute is not about whether the world exists, but whether the world *proposes* sentences to us. The Realist side agrees Rorty accepts causal constraint; the Rortyan side agrees the Realist accepts social mediation. The split is on whether "truth" names a relation to the world or a property of beliefs within a practice.
  3.  **On Correspondence Theories:** We agree that the stakes of the correspondence theory of truth turn on whether it offers a *method* for checking beliefs or merely a *goal* for inquiry. Both sides accept that no human agent can step outside their skin to compare belief to reality without using more beliefs. We disagree on whether this limitation makes correspondence empty (Rortyan) or merely regulative (Realist).

  **2. Disagreements Table**

  | Issue | Rortyan Formulation (Antirepresentationalist) | Realist Formulation (Representationalist) |
  | :--- | :--- | :--- |
  | **Nature of Truth** | Truth is an attribute of sentences, and sentences depend on vocabularies, which are human tools. Truth is "made" in the sense that no vocabulary is privileged by Nature itself. | Truth is a relation of accurate representation between belief and mind-independent states of affairs. Truth is "found" in that successful inquiry converges on how things actually are. |
  | **Role of Consensus** | Justification is always social. "Objective" just means "intersubjectively agreed upon within our community." There is no appeal beyond current solidarity. | Consensus is evidence of truth, not constitutive of it. Peer agreement can be wrong if the underlying representation fails to match the causal structure of reality. |
  | **Scientific Progress** | Science progresses by finding new vocabularies that offer better utility for prediction and control, not by getting "closer" to the intrinsic nature of things. | Science progresses by asymptotically approaching a true description of the world. New theories are true *because* they capture mechanisms the old ones missed. |

  **3. Cruxes & Predictive Cases**

  **Crux 1: Metaphysical vs. Therapeutic**
  *   **Question:** Is the claim "truth is made" a metaphysical assertion about reality (anti-realism) or a therapeutic suggestion to stop asking certain questions (pragmatism)?
  *   **Concrete Case:** The phrase "The World Well Lost." When Rorty suggests we stop trying to know the "intrinsic nature" of reality, is he saying there *is* no intrinsic nature, or just that talking about it is useless?
  *   **Predictions:**
      *   *Rortyan:* Predicts that treating "intrinsic nature" as a real question leads to pseudoproblems (e.g., skepticism). Dissolving the question improves inquiry.
      *   *Realist:* Predicts that dissolving the question undermines the motivation for science. If there's no intrinsic nature to find, why bother testing?

  **Crux 2: Counterfactual Stability in Science**
  *   **Question:** Can antirepresentationalism handle modal counterfactuals? If a specific scientific theory had never been discovered, would the truths it describes be different?
  *   **Concrete Case:** **Quantum Mechanics.** If human beings had never developed quantum mechanics, would electrons *still* have been in superposition?
  *   **Predictions:**
      *   *Rortyan:* Predicts the question is bad. "Electrons" are posits within a vocabulary. Without the vocabulary, there are no electrons, just causal pressure. The truth "electrons superpose" is made by the utility of the QM vocabulary.
      *   *Realist:* Predicts the superposition was occurring prior to the vocabulary. The truth was waiting to be found. Denying this makes the success of QM miraculous.

  **Crux 3: Hidden Causal Commitments**
  *   **Question:** Does Rorty's view secretly rely on a causal story about belief-formation that it officially rejects as philosophically irrelevant?
  *   **Concrete Case:** **Pain and C-Fibers.** When someone says "I am in pain," is this true because of a social justification or because of a neurological state?
  *   **Predictions:**
      *   *Rortyan:* Predicts "pain" is a status granted within a linguistic community. The causal firing is irrelevant to the *truth* of the claim, only to the *cause* of the claim. Truth is justificatory, not causal.
      *   *Realist:* Predicts this distinction collapses. You can't have a theory of belief formation that ignores causation. If the causal story doesn't track reality, the justification is just mob rule. Rorty needs realism to explain why some beliefs work and others don't.

  **4. Verbal vs. Substantive Disagreements**

  We identify a significant **verbal disagreement** regarding the definition of "truth." The Rortyan side uses "truth" to mean *justified assertibility* (what we can defend now). The Realist side uses "truth" to mean *idealized justification* (what we would defend at the end of inquiry).

  However, we identify a **substantive disagreement** regarding **normativity.** The Realist side insists we need a norm outside of current social practice to criticize that practice (e.g., Galileo vs. the Church). The Rortyan side insists that criticism always comes from *another* social practice (e.g., new evidence vocabularies), not from "Reality" itself. This is not just semantics; it changes how we view scientific revolutions.

  **5. Next Steps**
  Need to clarify if the QM case actually breaks the Rortyan view or if "utility" covers counterfactual stability. Also check if the causal commitement crux is just a category error (explanation vs. justification).

