answer: |-
  ### I. The Material Map: Defining the Planks

  To treat the restoration of Notre-Dame as a strict iteration of the Ship of Theseus, we must first enumerate the constituent parts and their ontological status post-2019. The "ship" is not a monolith but an aggregate of specific material classes, each undergoing different identity conditions during reconstruction.

  1.  **The 13th-Century Oak Frame (*La Forêt*):** Completely destroyed by combustion. In the restoration, this is replaced by new oak, harvested to match the species and dimensions of the medieval original, cut using traditional techniques. Material continuity is zero; typological continuity is total.
  2.  **Viollet-le-Duc's Spire:** A 19th-century addition that collapsed. It is being reconstructed identically in oak and lead. This plank was already a replacement; its destruction and re-replacement compound the paradox.
  3.  **Medieval Stained Glass:** Survived the fire (though threatened by heat and falling debris). These parts retain material continuity. They serve as the only physical link to the pre-19th-century vessel.
  4.  **Lead Roofing:** Melted and vaporized, releasing toxins. The new roofing is new lead. No material continuity exists here, only functional replacement.
  5.  **Hidden Structural Steel and Fireproofing:** Non-existent in the original design. Inserted into the new wooden frame to prevent future combustion. This constitutes a functional upgrade that violates strict material replication but remains invisible to the observer.
  6.  **Stone Vaulting and Walls:** Structurally intact but chemically altered by heat, water, and soot. Cleaned and reinforced. Material continuity is high but modified by intervention.

  ### II. Applying Theories of Diachronic Identity

  With the components mapped, we test the restoration against three standard theories of persistence to determine what object is being "restored."

  **Material Continuity:**
  Under this theory, an object persists only if its constituent matter remains substantially the same. By this metric, Notre-Dame ceased to exist in April 2019. The majority of the combustible material (roof, spire) is gone. The lead is new. Even the stone has been chemically scrubbed. If identity relies on atoms, the cathedral is a replica, not a restoration. The insertion of steel further violates this, as the new object contains matter the original explicitly excluded.

  **Spatio-Temporal Continuity:**
  This theory posits that an object persists if there is an unbroken path through space and time. Notre-Dame satisfies this condition. The walls stood through the fire. The site was never abandoned. The reconstruction occurs *in situ* without a gap in the institution's legal or physical presence. The "ship" never left the dry dock; it was repaired while afloat. This theory supports the claim that the cathedral is the same object, despite material loss.

  **Formal or Functional Persistence:**
  Here, identity resides in the arrangement of parts and the purpose they serve. The restoration prioritizes the *form* (the visual silhouette, the interior volume) and the *function* (Catholic liturgy, national monument status). The decision to hide steel within the wood supports this: the material is sacrificed to preserve the form and ensure future function. Under this view, the cathedral persists because the design-plan and sacramental utility remain unbroken.

  ### III. The Palimpsest Problem: The Myth of the Original Ship

  The Ship of Theseus paradox assumes an initial, authentic state from which deviation is measured. Notre-Dame invalidates this premise. The spire that burned in 2019 was not medieval; it was a 19th-century neo-Gothic interpretation by Viollet-le-Duc. The roof had been modified repeatedly over eight centuries. The stone had been sandblasted, blackened by pollution, and cleaned multiple times.

  Consequently, there is no "Original Ship." The building is a historical palimpsest where every generation has rewritten the material text. To argue for material continuity is to argue for the continuity of the 19th-century restoration, not the 13th-century foundation. The paradox collapses because the "Ship" was already a vessel of replacements. The 2019 fire is merely the latest iteration of a cycle of destruction and reconstruction that defines the object's history. Identity cannot be rooted in an origin point that is historically inaccessible.

  ### IV. Political Will and the Illusion of Essentialism

  The political decision-making process reveals the specific type of identity the public and state actually value. President Macron's initial suggestion of a contemporary spire was rapidly abandoned following public outcry. The mandate shifted to identical reconstruction.

  Superficially, this suggests a naive material essentialism: the belief that the building's "soul" resides in its specific visual configuration. However, the acceptance of hidden steel and modern fireproofing contradicts this. If the public demanded true material essentialism, they would reject the steel reinforcement as a corruption of the authentic oak frame. They do not, because they cannot see it.

  This indicates that the valued identity is **phenomenological**, not material. The public insists on the persistence of the *image* and the *experience*, not the atoms. This aligns with the metaphysical concept of four-dimensional persistence of a design-plan. The "object" is not the wood and stone, but the trajectory of the building's visual and functional existence through time. The public accepts the substitution of matter (new oak, steel) provided the spatio-visual profile remains constant. The "Ship" is defined by its silhouette and its use, not its substance.

  ### V. Reflexivity: The Category Mistake

  Turning the analysis back on the paradox itself, Notre-Dame suggests that the Ship of Theseus is a category mistake when applied to architecture and institutions. The paradox treats the object as a mereological sum—an aggregate of physical parts. However, Notre-Dame operates as a **social object** with legal personality, sacramental function, and collective memory.

  An institution can survive the replacement of every material part because its identity is constituted by recognition, not constitution. The "Ship" is not the wood; it is the legal entity that owns the wood, the congregation that prays within it, and the state that protects it. If identity were purely material, the melting of the lead would end the cathedral. Instead, the institution absorbed the loss.

  This reveals that the paradox fails to account for **normative identity**. A building persists because we agree to treat it as persistent. The paradox asks, "Is this the same ship?" based on physics. Notre-Dame answers, "It is the same cathedral," based on social contract. The restoration debate confirms that material continuity is irrelevant to institutional identity. It complicates the spatio-temporal view by showing that even significant breaks in function (the closure for reconstruction) do not sever identity. It dissolves the material-continuity view entirely, proving that for social objects, matter is interchangeable so long as the form and function are recognized.

  ### VI. Two-Way Account: Explanatory Power and Silence

  **What the Framework Explains:**
  The philosophical framework of diachronic identity successfully explains the tension in the public reaction. It clarifies why the rejection of a modern spire was not about historical accuracy (since the spire was already a 19th-century fake) but about **formal persistence**. It explains the acceptance of hidden steel as a prioritization of **functional persistence** over material purity. The framework elucidates why the "Ship" is considered the same: because spatio-temporal continuity (the site) and formal continuity (the design) were maintained, satisfying the conditions for institutional survival even when material continuity failed.

  **Where the Framework is Silent:**
  However, the framework is silent on **value theory**. It explains *how* the identity persists, but not *why* this specific persistence matters more than others. The Ship of Theseus logic could apply to a generic warehouse; it does not explain why Notre-Dame's reconstruction commands national resources while other destroyed heritage sites do not. The philosophical model treats all parts as equal "planks," but the restoration treated the stained glass (surviving matter) differently from the roof (replaced matter) based on cultural valuation, not just ontological status. Furthermore, the framework cannot account for the **trauma** of the loss. Ontologically, the building persists; phenomenologically, a rupture occurred that logic cannot heal. The paradox treats identity as a binary (same/different), but the public experience was one of grief and recovery, suggesting that identity is also an emotional narrative, not just a metaphysical status.

  **Conclusion:**
  The restoration of Notre-Dame confirms that for architectural institutions, the Ship of Theseus is not a problem to be solved but a condition of existence. The building is not an aggregate of wood and stone; it is a four-dimensional design-plan enacted through matter. The paradox dissolves when we recognize that the "Ship" is a legal and cultural construct that wears material parts temporarily. The restoration was not an attempt to recover the past matter, but to secure the future continuity of the form. Identity here is not found in the planks, but in the sailing.
