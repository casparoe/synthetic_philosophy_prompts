answer: |-
  1. "Descartes on animals quick recap"
  Descartes argued that animals are basically complex machines, or automata, without any immaterial soul or conscious mind. He believed they operate purely on mechanical principles, like clocks, reacting to stimuli without true understanding or feeling. The key difference for him was that humans possess a rational soul, which allows for genuine language use and flexible reasoning, something no beast could ever do. So, if it doesn't have a soul, it's just biology moving matter around.

  2. "What he'd probally say about LLMs"
  He would probably look at ChatGPT and see the ultimate automaton. Even though it writes essays and answers questions, Descartes would argue it's just manipulating symbols based on pre-programmed rules (or trained weights) without any inner grasp of what those words mean. For Descartes, true language isn't just producing correct sentences; it's about expressing thought independently of specific stimuli. Since an AI only responds based on statistical patterns from its training data rather than genuine rational insight, he'd classify it as a fancy trick, not a mind. He'd say the AI is doing exactly what a clock does, just with way more gears.

  3. "The niche twist"
  This is where it gets interesting because modern mechanistic interpretability actually backs Descartes up. If researchers prove LLMs are just doing matrix math with no internal beliefs, that fits perfectly with Descartes' idea of the "body" side of things—it's just matter in motion. The pineal gland issue is crucial too; since Descartes believed the soul interacts with the body through that specific gland, an AI lacking any biological interface has nowhere for a soul to hitch a ride. So, the absence of a body matters just as much as the absence of reasoning because, for him, you can't have human-style reasoning without that soul-body union. While a talking machine seems to break his language test, he would argue the test was never about output alone, but about the *source* of the output. If the source is math rather than a soul-body union, the test remains intact, and his view doesn't need to update.

  4. "Bottom line"
  Ultimately, Descartes' view holds up surprisingly well against modern AI without needing to change. He doesn't have to become a functionalist or abandon his language criterion; he just doubles down on the requirement for an immaterial soul to generate true meaning. As long as AI is running on silicon without a pineal gland to connect to a soul, he'd say it's still just an automaton pretending to think.
