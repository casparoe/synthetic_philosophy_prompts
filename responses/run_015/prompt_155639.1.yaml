answer: |-
  **Project Title:** Scaffold Collapse: A Coordination Model of Moral Revolutions

  **Project Summary**
  Why do some moral norms vanish overnight while others endure for centuries despite vigorous opposition? The standard philosophical narrative, championed by thinkers like Bernard Williams and Kwame Anthony Appiah, suggests that moral change is driven by a shift in moral psychology—specifically, a transformation in how agents understand honor and identity. In this view, dueling ended because gentlemen stopped believing it was honorable, and slavery ended because the moral language of the world shifted.

  My project challenges this "belief-shift" model. I argue that moral revolutions are not primarily about persuasion, but about the collapse of the *coordination scaffolds* that sustain norms. Norms like dueling or foot-binding function as signaling equilibria: they require visible, costly actions to confer status. When the infrastructure supporting that signaling degrades—when the signal loses credibility, defection becomes invisible, or exit costs drop—the norm collapses regardless of whether individual moral beliefs have fully shifted.

  Over six weeks, I will develop a conceptual framework to test this "Scaffold Hypothesis." I will reconstruct the mechanics of norm dissolution using secondary literature on dueling, foot-binding, and slavery. The goal is to produce a predictive model that distinguishes between "fast collapse" (scaffold failure) and "slow erosion" (belief shift), clarifying why rationalist accounts feel implausible and pure interest-based accounts feel too slow.

  **The Problem: Honor vs. Interest**
  Existing accounts of moral change tend to bifurcate into two camps: the moral-psychological and the materialist. Appiah's *The Honor Code* is the definitive statement of the former. He argues that dueling ended not because it became illegal or economically inefficient, but because the concept of honor was reconfigured. To be a "man of honor" ceased to require violence. Williams similarly emphasizes the internal conceptual shifts required for moral progress.

  The problem with these accounts is that they treat honor and interest as rivals. They assume that for a norm to end, people must be *persuaded* that it is wrong. This fails to explain the speed of certain collapses. Dueling didn't fade over centuries; in many contexts, it evaporated within a generation. Conversely, slavery persisted long after moral arguments against it were well-known.

  Purely materialist or "interest-based" stories face the opposite problem. They explain persistence well (slavery was profitable) but struggle to explain rapid abandonment. If norms are solely about interest, why would a dominant class ever relinquish a status signal without a fight?

  Both models miss the layered reality of social norms. Honor is not just a feeling; it is a coordination technology. It requires a scaffold to function. My project proceeds from the observation that Appiah and Williams leave the *structural preconditions* of honor open. They describe the engine (honor) but not the track it runs on (the scaffold). I propose that moral revolutions occur when three specific structural conditions crash together, rendering the norm unsustainable regardless of individual belief.

  **The Hypothesis: Three Conditions of Collapse**
  I will argue that a norm sustained by honor signaling collapses only when the following three conditions are compromised:

  1.  **Credibility of the Status Signal:** Does performing the norm still reliably confer high status? If the signal becomes noisy (e.g., cowards duel as often as brave men) or if the audience stops valuing the signal (e.g., martial prowess matters less in a commercial society), the incentive to participate drops.
  2.  **Visibility of Defection:** Can agents observe others opting out? Norms rely on common knowledge. If defection becomes visible without immediate punishment, it creates a cascade. If the scaffold hides defection, the norm persists even if private belief shifts.
  3.  **Exit Costs:** What is the penalty for stopping? High exit costs (legal, economic, or physical violence) maintain the equilibrium even if credibility and visibility waver.

  My hypothesis is that "fast collapse" norms (like dueling in certain periods, or foot-binding in early 20th-century China) vanish when all three conditions fail simultaneously. "Slow erosion" norms (like chattel slavery) persist because at least one condition remains robust (e.g., high exit costs via economic entrenchment) even if credibility is challenged.

  **Methodology: Conceptual Reconstruction**
  This is a conceptual project, not an archival one. I will not be uncovering new historical data. Instead, I will engage in a reconstruction of existing historical narratives through the lens of coordination theory.

  *Weeks 1-2: Framework Construction.* I will formalize the "Scaffold Hypothesis," defining the three conditions precisely and distinguishing them from Appiah's psychological criteria. I will integrate insights from signaling theory and institutional economics to flesh out the "costly signal" aspect of honor.

  *Weeks 3-4: Case Testing.* I will apply the model to three cases using secondary literature:
  *   **Dueling:** The classic Appiah case. Did the signal lose credibility before the moral belief shifted?
  *   **Foot-Binding:** A rapid collapse in the 1910s-20s. Was this driven by anti-foot-binding societies making defection visible and safe (lowering exit costs)?
  *   **Slavery:** The stress test. If the model works, it should explain why slavery required war and economic disruption (forcing exit costs down) rather than just moral argument.

  *Weeks 5-6: Synthesis and Refinement.* I will draft the final paper, focusing on the predictive power of the model. I will explicitly map where the "belief-shift" model succeeds and where the "scaffold-collapse" model is necessary.

  **Success and Failure Conditions**
  It is vital to define what counts as success for a six-week fellowship.

  *Success:* I will have produced a coherent conceptual model that explains the *speed* and *trajectory* of moral change better than pure moral-psychological accounts. Success looks like a paper that can predict why foot-binding ended faster than slavery, not by appealing to the "severity of the wrong," but by analyzing the visibility and cost structures of the norms. If I can show that honor is a *dependent variable* of the scaffold rather than an independent engine, the project succeeds.

  *Failure:* The primary risk is that the model is too reductionist. If slavery breaks the model—for example, if the scaffold remained intact but the norm collapsed anyway due to pure moral persuasion—then the scope of my theory shrinks significantly. Failure would look like having to admit that "scaffold collapse" only explains trivial norms (like fashion or dueling) but not "deep" moral crimes. If I find that I need separate mechanisms for slavery versus dueling, the unified theory fails, though the comparative analysis would still be valuable.

  Another failure mode is conceptual vagueness. If "credibility" and "visibility" cannot be distinguished from "moral belief," the model adds no value over Appiah. I must ensure the structural conditions are distinct from the psychological states.

  **Feasibility and Limitations**
  Six weeks is a tight constraint for historical philosophy. I am limiting the scope to conceptual reconstruction to make this tractable. I will not be reading primary source material from the 18th or 19th centuries. I will rely on established secondary histories and philosophical treatments (Appiah, Williams, Elster, McAdams).

  This limitation is a feature, not a bug. The goal is not to write a history of dueling, but to refine a philosophical tool for understanding moral change. By avoiding archival deep-dives, I can focus on the logical coherence of the scaffold model.

  I am also limiting the comparative set. I will not attempt to cover all moral revolutions. Focusing on dueling, foot-binding, and slavery provides a spread of "fast" and "slow" collapses without overextending the research timeline.

  **Significance**
  This project matters because we are currently living through a period of intense moral upheaval. Understanding whether norms change because people are persuaded or because their social infrastructure crumbles has practical implications for activism and policy. If the scaffold model is correct, then moral progress requires not just better arguments, but the strategic disruption of signaling equilibria.

  My roommate and I argued for two hours because the stakes of this question are real. If Appiah is right, we need to win the argument. If I am right, we need to break the machine. This fellowship will allow me to determine which view holds water, producing a paper suitable for submission to journals in moral philosophy or social theory.

  **Conclusion**
  The "Scaffold Collapse" model offers a way to bridge the gap between moral psychology and structural sociology. It respects the intuition that honor matters (against pure interest theories) but insists that honor is structurally embedded (against pure psychological theories). Over the next six weeks, I will build this bridge, testing its load-bearing capacity against the heavy histories of dueling, foot-binding, and slavery. The result will be a clearer map of how moral worlds actually end.
