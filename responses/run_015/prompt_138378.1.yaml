answer: |-
  ### Stage 1: Brainstorming the Logical Space

  Before constructing the instrument, we must map the terrain. The "adaptationism wars" are not a single fight but a tangle of distinct disagreements about evidence, definition, and default assumptions. If we label the positions first, we risk building questions that merely signal tribal affiliation. Instead, we identify the underlying axes of disagreement. There are five primary distinctions that carve up the logical space.

  **1. The Function Axis (History vs. Current Utility)**
  When we say a trait is "for" something, are we making a claim about its etiology (it exists *because* it did this in the past) or its current physiology (it *does* this now, regardless of origin)?
  *   *Pole A:* Etiological. A trait without a history of differential retention for a specific outcome has no function, even if it is currently useful.
  *   *Pole B:* Causal-Role. If the trait contributes to the system's capacity now, it has a function. History is secondary.
  *   *Pole C:* Deflationist. "Function" is a loose shorthand for both; demanding precision here is a category error.

  **2. The Null Axis (Optimization vs. Noise)**
  When encountering a trait with no immediate explanation, what is the prior probability?
  *   *Pole A:* The trait is a solution to a problem until proven otherwise. The burden of proof lies on showing it *isn't* optimized.
  *   *Pole B:* The trait is noise (random fluctuation, by-product, or inertial) until proven otherwise. The burden of proof lies on showing it *is* optimized.
  *   *Pole C:* The null depends on the grain of analysis (e.g., molecules are noise, morphology is solutions).

  **3. The Model Axis (Realism vs. Instrumentalism)**
  When an optimality model (a mathematical prediction of the "best" trait) fails to match reality, what does the failure mean?
  *   *Pole A:* The organism is not at the optimum; the model reveals a limitation in the organism (e.g., physics, development).
  *   *Pole B:* The model is a measuring stick; the failure reveals a limitation in the modeler's assumptions about the environment or trade-offs.
  *   *Pole C:* The model is a storytelling device; failures indicate the whole approach is flawed.

  **4. The Variation Axis (External vs. Internal)**
  Where does the raw material for change come from, and does it have direction?
  *   *Pole A:* Variation is isotropic (random with respect to need); the "direction" comes entirely from the filtering process.
  *   *Pole B:* Variation is biased by physics, development, or architecture; the "arrival" of the trait shapes the outcome as much as the filtering.
  *   *Pole C:* Variation is constructed by the organism's activity (niche construction); the organism changes the filter itself.

  **5. The Epistemic Axis (Tractable vs. Underdetermined)**
  Can we actually distinguish between these histories using data?
  *   *Pole A:* Yes, via comparative methods, phylogenetics, or experimental evolution.
  *   *Pole B:* Only in rare, ideal cases.
  *   *Pole C:* No, the historical record is fundamentally erased; we are left with coherence arguments, not evidence.

  **Combinatorics and Collapses**
  Theoretically, $2^5 = 32$ cells (simplifying to binaries for the moment). In practice, many combinations are incoherent. For example, holding that history is unknowable (Epistemic C) while insisting on a specific historical null (Null A) is pragmatically unstable. Similarly, believing variation is strictly biased toward sub-optimal forms (Variation B) while holding optimality models are literally true (Model A) is a contradiction.

  We will target 12 occupied leaves. Two pairs of leaves will be flagged as "collapses": they represent distinct philosophical self-conceptions but yield identical predictions on this specific ten-question instrument. This is a feature, not a bug; it shows where the methodology converges despite divergent metaphysics.

  **Empty Cells**
  We will explicitly identify four logical cells that remain empty in the scoring key, explaining why no coherent position occupies them.

  ***

  ### Stage 2: The Diagnostic Instrument

  **Title:** Which Kind of Selectionist (or Non-Selectionist) Are You Actually?
  **Instructions:** For each case, select the option that best matches your *prior expectation* before looking up the data, or your interpretation of the data if you already know it. Do not select the option that sounds most prestigious; select the one that reflects how you actually reason.

  **Q1. The Genome Bulk**
  You are sequencing a newly discovered amphibian. You find that 85% of its genome consists of repeated sequences that do not code for proteins and do not appear to regulate the coding regions. What is your default assumption about why this bulk exists?
  *   (A) It likely performs a structural or regulatory role we do not yet understand; biological systems rarely carry dead weight.
  *   (B) It is likely accumulated noise that hasn't been costly enough to remove; removal requires specific mechanisms that may not exist.
  *   (C) The question is ill-posed; "weight" implies a design standard that doesn't apply to molecular chemistry.

  **Q2. The Human Chin**
  The human mandible has a protruding bony ridge (the chin) found in no other primate. Biomechanical models show it does not strengthen the jaw against chewing stress. What is the most productive next step?
  *   (A) Assume it solves a subtle problem (e.g., sexual signaling, muscle attachment) and refine the model until the benefit matches the cost.
  *   (B) Assume it is a by-product of the face shortening during development; look for the developmental rule that necessitates it.
  *   (C) Assume it serves a current social function regardless of origin; investigate how it is used in interaction today.

  **Q3. The Peacock's Train**
  A male peacock's tail is metabolically expensive and hinders flight. It correlates with mating success. If you found a population where the tail size decreased over ten generations without a change in predator density, what would you infer?
  *   (A) The cost-benefit ratio shifted; perhaps the females changed their preference criteria.
  *   (B) Random fluctuation in small populations overwhelmed the advantage; the trait is not as tightly linked to survival as assumed.
  *   (C) The tail is a handicap signal; if it decreased, the signal's honesty was compromised, breaking the system.

  **Q4. The Seven Vertebrae**
  Almost all mammals, from mice to giraffes, have exactly seven cervical vertebrae. Sloths and manatees are the rare exceptions. What explains this uniformity?
  *   (A) Seven is the optimal number for nerve routing and developmental stability across all mammal niches.
  *   (B) The developmental pathway is locked; changing the number causes cancer or nerve failure, regardless of neck length needs.
  *   (C) It is a historical accident from a common ancestor that never found a viable path to change.

  **Q5. The Cave Fish Eyes**
  Populations of fish living in dark caves often lose their eyes entirely. This happens independently in different lineages. What is the primary driver?
  *   (A) Energy savings; maintaining neural tissue is costly when unused, so individuals with smaller eyes out-reproduce others.
  *   (B) Accumulation of mutations; without light, there is no penalty for eye-degrading mutations, so they fix randomly.
  *   (C) Pleiotropy; genes that enhance taste or smell in the dark actively suppress eye development as a side effect.

  **Q6. Compound Case: The Silent Bell (Extinct/Linkage)**
  *Case Stipulation:* You study a moth lineage where the closest relatives are extinct. The moth has a wing pattern that matches a specific bark type. However, that bark type vanished 1,000 years ago, and the moth now rests on mismatched lichen. The gene for the pattern is physically fused to a gene essential for thermal regulation.
  *Question:* Why does the pattern persist?
  *   (A) It must still provide a benefit we haven't measured (e.g., thermal properties mimic the bark's heat signature).
  *   (B) It is dragged along by the thermal gene; the pattern itself is inert but cannot be separated from the useful trait.
  *   (C) The history is inaccessible; we can only describe the current thermodynamics, not the reason for the pattern's origin.

  **Q7. Compound Case: The Heavy Bone (Physics/Bias)**
  *Case Stipulation:* A diving bird lineage evolves denser bones to reduce buoyancy. Physics dictates that for this specific bone shape, density can only increase in discrete 10% jumps. The optimal density for diving is 5% higher than current, but the next possible jump is 15% higher, which causes breakage. The birds remain at the lower density.
  *Question:* How do you interpret the sub-optimality?
  *   (A) The model is wrong; there must be a hidden cost to the 15% jump we haven't accounted for.
  *   (B) The organism is trapped by the "arrival" of variants; the filtering process cannot act on variants that physics forbids.
  *   (C) The bird is "good enough"; optimality is a human standard, not a biological requirement.

  **Q8. The Inverted Retina**
  Vertebrate eyes have the retina installed "backwards" (wires in front of photoreceptors), creating a blind spot. Octopus eyes do not have this flaw. Both are camera-style eyes. What does this imply?
  *   (A) Vertebrates are on a sub-optimal local peak; the path to the octopus design was blocked by early evolutionary history.
  *   (B) The vertebrate design has compensating advantages (e.g., nutrient supply) that outweigh the blind spot cost.
  *   (C) The two designs are different solutions to the same problem; "flaw" is a judgment based on comparing distinct lineages.

  **Q9. The Recurrent Laryngeal Nerve**
  In giraffes, a nerve connecting the brain to the larynx loops down around the heart and back up, adding meters of unnecessary length. What is the status of this trait?
  *   (A) It is a historical artifact; the nerve path was set in fish ancestors and stretched as the neck elongated.
  *   (B) It persists because rerouting it during development would disrupt other vital systems; the cost of change exceeds the cost of length.
  *   (C) It serves a current signaling or timing function related to the heart loop that we have not yet discovered.

  **Q10. The Failed Model**
  You build a precise model predicting the optimal beak depth for a finch species based on seed hardness. The finches' actual beaks are consistently 10% shallower than the model predicts. You check your data; the seed hardness and metabolic costs are correct. What is the conclusion?
  *   (A) The finches are not at equilibrium; they are in the process of evolving toward the optimum.
  *   (B) The model missed a trade-off (e.g., shallower beaks allow faster singing or heat dissipation).
  *   (C) The approach is flawed; organisms are not bead-on-a-wire optimizers, and the deviation reveals the limit of the method.

  ***

  ### Stage 3: Scoring Key and Leaves

  **Scoring Instructions:**
  Tally your responses. You will likely have a mix. Identify your dominant pattern.
  *   **Pattern A-Heavy:** You lean toward optimization and historical function.
  *   **Pattern B-Heavy:** You lean toward null hypotheses, bias, and historical accident.
  *   **Pattern C-Heavy:** You lean toward current utility, deflationism, or methodological skepticism.
  *   **Mixed Patterns:** Specific combinations map to specific philosophical leaves.

  **The Leaves (12 Occupied Positions)**

  1.  **The Panglossian (Mostly A)**
      *   *Profile:* Assumes traits are solutions, models are literal, and history is tractable.
      *   *Awkward Commitment:* Must argue that even apparent flaws (like the nerve detour) are actually hidden features, risking unfalsifiability.
  2.  **The Engineer (Mostly A, but Q10=B)**
      *   *Profile:* Believes organisms are optimized, but treats model failures as missing variables in the model, not flaws in the organism.
      *   *Awkward Commitment:* Must constantly posit hidden trade-offs to save the optimization hypothesis from disconfirmation.
  3.  **The Heurist (Mostly A, but Q5=B, Q10=C)**
      *   *Profile:* Uses optimization as a default method to find interesting biology, but admits it's a tool, not a law of nature.
      *   *Awkward Commitment:* Must explain why a method known to be sometimes false is the best way to find truth.
      *   *Collapse Note:* This leaf is functionally indistinguishable from **The Engineer** on this specific quiz, though they differ on whether the model describes reality or is merely a probe.
  4.  **The Pluralist (Mostly B)**
      *   *Profile:* Treats noise and by-products as common; expects developmental rules to override optimization.
      *   *Awkward Commitment:* Must define a clear criterion for when a trait is a "by-product" versus a "solution" without circular reasoning.
  5.  **The Structuralist (Mostly B, specifically Q4=B, Q7=B)**
      *   *Profile:* Believes the "arrival of the fittest" (variation bias) dictates form more than the "survival of the fittest."
      *   *Awkward Commitment:* Must explain why convergent evolution (like camera eyes) happens at all if internal structure dictates form.
  6.  **The Neutralist (Mostly B, specifically Q1=B, Q5=B)**
      *   *Profile:* Treats random fluctuation as the default null, especially at molecular or non-critical morphological levels.
      *   *Awkward Commitment:* Must explain complex functional integration without invoking differential retention for every piece.
  7.  **The Deflationist (Mostly C)**
      *   *Profile:* Rejects historical function claims; focuses only on current causal contribution.
      *   *Awkward Commitment:* Must accept that a harmful trait caused by past history has the same "function" status as a beneficial one if it currently does something.
  8.  **The Skeptic (Mostly C, specifically Q6=C, Q10=C)**
      *   *Profile:* Believes historical claims are fundamentally underdetermined by evidence; the debate is unresolvable.
      *   *Awkward Commitment:* Must continue doing biology despite believing the core explanatory questions are unanswerable.
  9.  **The Exaptationist (Mixed A/B, specifically Q2=B, Q3=A)**
      *   *Profile:* Traits often originate as by-products or for one use, then are co-opted and optimized for another.
      *   *Awkward Commitment:* Requires a complex two-stage historical narrative for every trait, doubling the evidentiary burden.
  10. **The Niche Constructor (Mixed B/C, specifically Q5=C, Q9=B)**
      *   *Profile:* Organisms change their own selective pressures; traits persist because the organism maintains the environment that suits them.
      *   *Awkward Commitment:* Risks making every trait a self-fulfilling prophecy, hardening the status quo against critique.
  11. **The Local Optimist (Mixed A/B, specifically Q8=A)**
      *   *Profile:* Selection is powerful, but history locks lineages into sub-optimal peaks (like the retina).
      *   *Awkward Commitment:* Must explain why selection is powerful enough to optimize details but too weak to cross valleys to better peaks.
  12. **The Trade-Off Hunter (Mostly A, specifically Q7=A, Q10=B)**
      *   *Profile:* Apparent sub-optimality is always a result of unmeasured competing demands.
      *   *Awkward Commitment:* Must assume nature is infinitely complex, making simple models perpetually provisional.

  **Collapses and Indistinguishability**
  *   **The Engineer vs. The Heurist:** On these ten questions, these two positions yield identical answers. They differ only on the metaphysical status of the model (truth vs. tool). This instrument cannot separate them; you must introspect on whether you think the finch *is* optimal or if the model is just *useful*.
  *   **The Pluralist vs. The Neutralist:** In many concrete cases (Q1, Q4, Q5), these overlap. They separate only on whether the "noise" is purely random (Neutralist) or structurally biased (Pluralist/Structuralist).

  **Empty Cells (4 Unoccupied Logical Spaces)**
  1.  **History Unknowable + Selection Default:** Believing we can never know the past (Q6=C) while assuming selection is the default null (Q1=A). *Why Empty:* If you believe the history is erased, you cannot justify a historical default assumption; the prior becomes arbitrary.
  2.  **Optimality Literal + Variation Strictly Biased:** Believing organisms are literally at optimum (Q3=A) while believing physics forbids the optimal variant (Q7=B). *Why Empty:* This is a direct contradiction; if physics forbids the optimum, the organism cannot be at the optimum.
  3.  **Current Utility Only + Drift Default:** Believing function is only about current use (Q2=C) while assuming random fluctuation is the historical null (Q5=B). *Why Empty:* If you reject historical function, the historical null hypothesis is irrelevant to your definition of the trait's purpose.
  4.  **Strong Empirical Adaptationism + Low Tractability:** Believing almost everything is optimized (Q1=A) while believing we can't test it (Q10=C). *Why Empty:* This renders the belief a matter of faith rather than science; it is a philosophical stance, not a research programme.

  **Final Note to the Group:**
  If you land on a leaf with an "awkward commitment" you cannot swallow, do not change your answers to fit a label. Change your label to fit the answers. The instrument is not a verdict on your intelligence, but a map of where your intuitions pull against your stated philosophy. Use the tension to find your actual research priors.
