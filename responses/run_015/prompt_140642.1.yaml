  2.  **Verify the Data (Mental Check):**
      *   *Cell Rates:*
          *   A-High: T 95% (36), C 85% (16). T > C.
          *   A-Low: T 70% (144), C 60% (4). T > C.
          *   B-High: T 40% (4), C 30% (144). T > C.
          *   B-Low: T 15% (16), C 10% (36). T > C.
          *   *Cell Verdict:* T wins all 4. Correct.
      *   *Centre Aggregation:*
          *   Centre A Total T: $(36 \times 0.95 + 144 \times 0.70) / 180 = (34.2 + 100.8) / 180 = 135 / 180 = 75\%$.
          *   Centre A Total C: $(16 \times 0.85 + 4 \times 0.60) / 20 = (13.6 + 2.4) / 20 = 16 / 20 = 80\%$.
          *   Centre A Verdict: C (80%) > T (75%). Correct.
          *   Centre B Total T: $(4 \times 0.40 + 16 \times 0.15) / 20 = (1.6 + 2.4) / 20 = 4 / 20 = 20\%$.
          *   Centre B Total C: $(144 \times 0.30 + 36 \times 0.10) / 180 = (43.2 + 3.6) / 180 = 46.8 / 180 = 26\%$.
          *   Centre B Verdict: C (26%) > T (20%). Correct.
          *   *Centre Verdict:* C wins both. Correct.
      *   *Overall Aggregation:*
          *   Total T (200 students): $135 + 4 = 139$ passes. Rate = $139/200 = 69.5\%$.
          *   Total C (200 students): $16 + 46.8 = 62.8$ passes. Rate = $62.8/200 = 31.4\%$.
          *   *Overall Verdict:* T (69.5%) > C (31.4%). Correct.
