      *   The Centre level is *also* biased because within Centre A, T got easier students (Low prior are usually harder? Wait. Let's check rates).
      *   High Prior rates: 95/85 (A), 40/30 (B).
      *   Low Prior rates: 70/60 (A), 15/10 (B).
      *   High Prior > Low Prior. (Makes sense).
      *   Centre A > Centre B. (Makes sense).
      *   In Centre A: T got mostly Low (144), C got mostly High (16). Wait.
          *   T: 36 High, 144 Low.
          *   C: 16 High, 4 Low.
          *   T got the *harder* group in Centre A (Low prior usually lower pass rate). Yet T still beat C in Centre A aggregate?
          *   Wait, let's re-calc Centre A.
          *   T: 75%. C: 80%. C won Centre A.
          *   Why? C had 16 High (85%) and 4 Low (60%). T had 36 High (95%) and 144 Low (70%).
          *   T's weighted avg: $(36 \times 95 + 144 \times 70) / 180 = 75\%$.
          *   C's weighted avg: $(16 \times 85 + 4 \times 60) / 20 = 80\%$.
          *   C won because C's sample was tiny and skewed High, but T's sample was huge and skewed Low.
          *   Wait, T had 36 High. C had 16 High. T had more High students in absolute terms, but proportionally T was 20% High, C was 80% High.
          *   So in Centre A, C looks better because C had a much higher proportion of High prior students.
          *   So Centre A comparison is *confounded* by Prior Attainment.
          *   Therefore, the Centre verdict is biased.
          *   The Cell verdict controls for Prior.
          *   So Cell is better than Centre.
          *   What about Overall?
          *   Overall T: 69.5%. Overall C: 31.4%.
          *   T had 180 students in Centre A (easy centre). C had 180 students in Centre B (hard centre).
          *   So Overall is confounded by Centre.
          *   So Cell is better than Overall.
          *   So "Finer" (Cell) *does* win here.
          *   So why is the Colleague's argument wrong?
          *   Because the argument claims "Finer *always* wins" (Step 3), which leads to the absurdity of 1 student/stratum.
          *   The rule isn't "Finer is fairer." The rule is "Adjust for Confounders."
          *   In this specific case, Cell happens to be the confounder-adjusted level. But the *principle* (3) is wrong.
          *   If there was a third variable "Rainfall on exam day" (pre-treatment, irrelevant), adjusting for it (finer) would just add noise.
          *   So (3) is the step to reject.

  5.  **Drafting the Response:**
      *   **Tone:** Direct, professional, no fluff. "Say so plainly rather than answering politely."
      *   **Data Check:** Confirm the arithmetic holds (it does).
      *   **Diagnosis:** Reject Step (3).
      *   **Why it looked fine:** It works in textbook cases (Kidney Stones) where the finer partition *is* the confounder.
      *   **The Cost:** You can't just run the data. You need a causal model (DAG). You have to defend *why* those specific variables matter.
      *   **Replacement:** "Adjust for the Minimal Sufficient Adjustment Set."
      *   **Policy Question:** Distinguish between *Causal Effect* (is T better?) and *Predictive Outcome* (what happens if we roll out T?). If the rollout population matches the *current* T population, Overall predicts. If it matches the *general* population, Cell (standardized) predicts. Usually, we want Causal Effect to inform policy.
