      *   Which is the "Truth"? The Cell level is the closest to the causal effect *if* Prior Attainment is the main confounder.
      *   But the Colleague's argument leads to skepticism (6). To save (6), we must reject the idea that statistics alone solves this.

      *   *Decision:* Reject Step (3).
      *   *Why:* "Finer-is-fairer" assumes that heterogeneity is always confounding. It isn't. Sometimes it's noise. Sometimes it's effect modification.
      *   *Replacement:* "Adjust for the *minimal sufficient set* of confounders identified by a causal model, not the maximal set of pre-treatment variables."
      *   *Cost:* You have to do the hard work of building a causal model (DAG) instead of just running regressions. You have to admit the data alone doesn't speak.
      *   *Confidence:* High (90%).
      *   *Counter-consideration:* If the causal model is wrong, adjustment makes it worse.

      *   *Wait, is there a stronger rejection?*
      *   Step (1) says "no dataset 'contains' a direction of effect". This is actually philosophically sound (Hume). But (6) says we *do* have causal knowledge.
      *   The bridge between (1) and (6) is **Assumptions**. The colleague's argument fails because it pretends the *weighting choice* is data-driven. It is not. It is assumption-driven.
      *   So, rejecting (3) is correct because it claims a *rule* ("finer wins") that doesn't exist.
      *   But I need to address the User's specific situation: "Which verdict to print in the report?"
      *   And the Policy Question: "Isn't the top-line number the one that matters?"
      *   If the policy is "Roll out T to everyone exactly as they are currently distributed," the top-line predicts the outcome. But it doesn't tell you if T *caused* the success. If the distribution changes, the top-line prediction fails. The Causal Effect (Cell level) generalizes.
