      *   *Wait, let's look closer at the Policy Question.* The user asks: "the college is going to roll out one programme to everyone next year, so isn't the top-line number actually the one that matters for that decision?"
      *   This is the **Target of Inference** question.
      *   If the allocation mechanism next year matches the *overall* mix this year, the overall number is the predictive number.
      *   If the allocation mechanism next year matches the *Centre* mix (i.e., we decide per centre), the Centre number matters.
      *   The "Causal Effect" (ATE) is distinct from the "Predictive Value for this specific population."
      *   Simpson's Paradox often confuses **Causal Effect** (what happens if I force treatment?) vs **Associational** (what happens if I observe treatment?).
      *   In this dataset, the allocation was clearly non-random (T got all the easy A-Low students, C got all the hard B-High students).
