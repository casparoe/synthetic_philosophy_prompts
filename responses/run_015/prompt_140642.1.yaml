      *   Confidence: 95%.
      *   Strongest counter: If you can't agree on the causal model, you're stuck.

      *   *Wait, one nuance:* The User's data shows T wins in Cells, C wins in Centres, T wins Overall.
      *   Centre aggregation hides Prior Attainment.
      *   Overall aggregation hides Centre AND Prior Attainment.
