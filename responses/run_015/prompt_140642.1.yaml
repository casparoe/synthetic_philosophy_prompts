      *   The colleague's argument is a reductio ad absurdum against *naive* adjustment.
      *   The User wants to keep (6).
      *   The break point is indeed (3).
      *   Why did it look fine? Because in the Kidney Stone example, the finer partition (stone size) *is* the confounder.
