  **MEMORANDUM**

  **TO:** University Honors Committee
  **FROM:** Advisory Counsel
  **DATE:** October 23, 2024
  **SUBJECT:** Recommendation Regarding 1956 Honorary Doctorate

  **EXECUTIVE SUMMARY**

  The committee is deadlocked between two valid concerns: the moral imperative to withdraw endorsement of actions that violate fundamental human rights (the Anscombe objection) and the historical imperative to avoid presentist revisionism (the contextualist objection).

  This memo recommends a third path: **Rescind Active Honor, Relocate to Archive.**

  We vote to rescind the degree's status as an active honor removed from public celebration, but we do not erase the record. Instead, the physical diploma and citation are transferred to the University Archives as a curated object of ethical study, accompanied by a permanent explanatory plaque. This satisfies the moral requirement to stop "approving" the act while satisfying the historical requirement to preserve the record.

  **THE PHILOSOPHICAL TENSION**

  **1. The Anscombe Objection (Intention vs. Outcome)**
  The core of the argument against keeping the honor is not simply that civilians died. It is about *intention*. The philosophical line drawn here (following Elizabeth Anscombe's reasoning) is that you cannot intentionally kill innocents as a means to an end, even if that end is just (winning a war, saving lives). The atomic bombings were not collateral damage; the destruction of civilian populations was the mechanism of victory.

  When a university awards an honorary doctorate, we are not merely noting that someone held office. We are directing approval at their judgment and character. By keeping the honor active, the institution implicitly validates the moral calculus that allowed those deaths. We are saying, "Our standards for honor are compatible with this logic." The committee half arguing for revocation is correct: silence here looks like complicity.

  **2. The Contextualist Counter-Argument (Presentism & Slippery Slope)**
  The opposing half is correct that we cannot judge 1956 by 2024 standards without risk. In 1956, the prevailing utilitarian view was that the bombings ended the war and saved net lives. If we revoke this, do we revoke every honoree who held views we now reject? Do we start editing history?

  The danger here is "moral hygiene"—cleaning up the past so we feel better now. If we simply burn the record, we lose the ability to study how institutions failed to grapple with these issues at the time. Erasure helps no one.

  **THE INSTITUTIONAL DISTINCTION: CELEBRATION VS. RECORD**

  The solution lies in distinguishing between *honoring* and *recording*.

  *   **Honoring** is a present-tense act. It says, "We stand with this person now."
  *   **Recording** is a historical act. It says, "This happened, and here is the context."

  We cannot change the fact that the degree was awarded in 1956. But we can change what the degree *means* in 2024. Keeping the diploma in a display case of "Distinguished Honorees" is an act of celebration. Moving it to an archive with a plaque explaining the controversy is an act of education.

  This addresses the Anscombe objection: We are no longer directing approval at the act.
  This addresses the Contextualist objection: We are not pretending the award never happened.

  **RECOMMENDATION**

  **Vote: Approve Rescission of Active Status with Archival Relocation.**

  1.  **Rescind Active Status:** The recipient is removed from the list of current honored distinguished guests. Their name is removed from public halls, websites, and ceremonial materials.
  2.  **Archival Relocation:** The physical diploma (or a facsimile if the original is lost) is transferred to the University Archives.
  3.  **Explanatory Plaque:** The item is displayed with a permanent label that reads roughly:
      > "Awarded 1956. Rescinded 2024. This honor was originally conferred for political leadership during WWII. It has been relocated to the archives to facilitate ethical study regarding the authorization of atomic warfare and the university's role in endorsing political power. The University no longer endorses the moral calculus underlying this award."

  **TIMELINE FOR IMPLEMENTATION**

  *   **Thursday (Vote):** Committee votes on the "Rescind & Relocate" motion.
  *   **November 1:** Public statement issued. Framing is crucial: "We are not erasing history; we are updating our endorsement."
  *   **November 15:** Physical removal from public display.
  *   **January (Next Semester):** Archival exhibit goes live. Faculty from Philosophy and History departments consulted on plaque wording to ensure the ethical tension is accurately described.
  *   **May 2025:** Review committee meets to ensure the archival context is being utilized in coursework (ensuring the "study" part of the plan is actualized).

  **RISKS AND MITIGATION**

  *   **Risk:** The "Slippery Slope." Critics will say this opens the door to reviewing every past honoree.
      *   **Mitigation:** The statement must specify that this decision is based on the *specific* nature of authorized mass civilian destruction, which violates a universal threshold, not shifting political winds. This sets a high bar for future reviews.
  *   **Risk:** Accusations of "Virtue Signaling."
      *   **Mitigation:** The archival component proves this isn't about hiding shame. It's about owning the complexity. We are keeping the evidence visible, just reframing it.

  **CONCLUSION**

  This approach accepts the Anscombe-style objection without falling into presentist naivety. It acknowledges that while we cannot judge the 1956 committee by our lights, we are responsible for our own current endorsement. We stop honoring the act without deleting the history.

  Recommendation is to proceed with the vote on Thursday.
