answer: |-
  # Workshop Design: The Restoration Clinic
  **Time:** 75 Minutes  
  **Players:** 8 (4 Patients, 2 Controls, 2 Observers)  
  **Vibe:** Clinical, slightly tense, low-budget sci-fi. No powerpoints, no intro lecture.

  ## 1. The Setup & Materials
  You need to build the "sensory gap" physically. If the props are too clean, the philosophy dies.

  **The "Black Box" (Touch Station)**
  *   **Container:** A cardboard box with two armholes cut in the side, covered with thick black fabric (light-tight). Or just a table covered with a heavy blanket.
  *   **Gloves:** 4 pairs of thick winter gloves or welding gloves. The goal is to kill fine texture sensation, leaving only gross shape (edges vs. curves).
  *   **The Objects:** 4 distinct 3D-printed shapes (or wooden blocks).
      1.  **Cube** (rough sandpaper texture)
      2.  **Sphere** (smooth plastic)
      3.  **Pyramid** (ridged edges)
      4.  **Cylinder** (felt wrapping)
      *   *Crucial:* Do not call them by geometric names. Let patients name them (e.g., "The Cruncher," "The Roller").
  *   **Audio Substitution (The Twist):** For 2 of the 4 patients.
      *   *Low-tech version:* One Observer acts as the "Sonifier." When the patient touches a corner/edge, the Observer makes a sharp high-pitched click. When they touch a curve/flat surface, a low hum.
      *   *High-tech version:* Use a free distance-sensor app on a phone (like a proximity alarm) taped to the glove. Pitch rises as hand gets closer to an edge.
      *   *Recommendation:* Use the **Human Sonifier**. Tech fails in workshops; humans don't. It ensures the audio cue is consistent for the experiment.

  **The "Restoration Screen" (Visual Station)**
  *   **Display:** Projector or large TV.
  *   **The Images:** 7 Photos total.
      *   4 Targets: Photos of the *exact* objects they touched, but from disorienting angles (e.g., extreme close-up of a corner, heavy shadow obscuring the silhouette, colored lighting).
      *   3 Distractors: Objects they *didn't* touch (e.g., a Torus, a Cone, a complex lattice).
  *   **Tokens:** Poker chips, coins, or slips of paper. Value: $100 each.

  ---

  ## 2. Turn Order & Rules (75 Mins)

  ### Phase 1: The Wager (10 Mins)
  *   **Observers** take the pot. They explain the stakes: "Losing team buys snacks for the next meetup."
  *   **Observers** assign roles randomly (draw straws).
      *   **Patients (4):** Will enter the Black Box. (2 get Audio Substitution, 2 do not).
      *   **Controls (2):** Sit in the room, no blindfolds, no touch access. They can browse their phones or stare at the wall. They represent "Prior Visual Knowledge."
  *   **Betting:** Observers bet on the outcome.
      *   *Bet A:* Will Patients score higher than Controls? (The "Rationalist" bet: Geometry is universal).
      *   *Bet B:* Will Controls score higher? (The "Empiricist" bet: Senses don't talk without experience).
      *   *Bet C:* Will the Audio Patients beat the Touch-Only Patients?
  *   **Lock bets.** No talking during the Touch Phase.

  ### Phase 2: The Dark Room (15 Mins)
  *   **Patients** put on blindfolds *and* thick gloves.
  *   They enter the Black Box.
  *   **Task:** Explore the 4 objects for 10 minutes. Memorize them. Invent a name for each.
  *   **Audio Group:** The Sonifier Observer sits by the box. When Audio Patients touch, the Sonifier makes the corresponding sounds (Click for edges, Hum for curves).
  *   **Touch-Only Group:** Silence.
  *   **Controls:** Wait outside the box area. No peeking at objects.
  *   *Facilitator Note:* Keep time strictly. Announce "5 minutes remaining."

  ### Phase 3: The Restoration (15 Mins)
  *   **Patients** remove gloves but **keep blindfolds on** until seated facing the screen.
  *   **Controls** sit at a separate table with a printed scorecard.
  *   **The Reveal:** Lights dim. Screen turns on. The 7 images appear simultaneously, numbered 1–7.
  *   **Task (Patients):** "Point to the image that matches 'The Cruncher' (Cube). Now 'The Roller' (Sphere)..." etc. They must map their tactile memory to the visual data.
  *   **Task (Controls):** "Point to the 4 images that represent standard geometric primitives (Cube, Sphere, Pyramid, Cylinder)."
  *   **Constraint:** Patients cannot speak to each other. Controls cannot speak to Patients.
  *   **Time Limit:** 5 minutes to decide.

  ### Phase 4: Scoring & Payout (10 Mins)
  *   **Reveal Answers:** Highlight the 4 correct images on screen.
  *   **Score:**
      *   **Patients:** 1 point per correct match of their specific object name to the correct image. (Max 4).
      *   **Controls:** 1 point per correct identification of the shape class. (Max 4).
  *   **Settle Bets:** Observers calculate winnings based on the pre-set odds.
  *   **Snack Debt:** Record who owes snacks.

  ---

  ## 3. The Debrief (25 Mins)
  *Do not lecture. Ask questions based on the data you just generated.*

  **1. The Phenomenological Gap (10 Mins)**
  *   Ask Patients: "When you saw the photo of the Cube, did it feel like *your* cube? Or did it feel like a picture of a cube?"
  *   Ask Audio Patients: "Did the sound help you build a picture in your head, or was it just noise that distracted you from the touch?"
  *   *The Point:* If Patients struggled, you just felt Locke's Empiricism. Sight and Touch are different languages. Just because you know the word "Spiky" in Touch doesn't mean you know what "Spiky" looks like in Light.

  **2. The Control Variable (5 Mins)**
  *   If Controls beat Patients: Why? (Because Controls have years of visual training. Patients have 10 mins of tactile training).
  *   If Patients beat Controls: Why? (Did the tactile memory anchor the visual recognition?)
  *   *The Point:* Molyneux's original question assumes a "blank slate." Your Controls aren't blank slates. They have a lifetime of visual priors. This is why the experiment is hard to run in real life.

  **3. The "Acquired" vs. "Congenital" Reality Check (5 Mins)**
  *   **Honesty Moment:** Remind the group this game simulates *new* association.
  *   **Your Partner's Case:** She had sight for years before losing it. Her brain has a "visual library." Molyneux's problem is usually about people who *never* had sight.
  *   **The Hope:** For acquired blindness, the answer is often "Yes, faster than congenital." The neural pathways exist; they are just dormant. This game simulates the *hard* version (congenital-style), so if you struggled, don't panic. It doesn't predict her outcome perfectly.

  **4. The Audio Twist (5 Mins)**
  *   Did the sound bridge the gap?
  *   *Philosophical Hook:* This is "Sensory Substitution." If the brain can turn sound into "shape," is the modality (eye vs. ear) even the point? Or is it all just data processing?
  *   *Outcome:* Usually, audio helps spatial awareness but confuses object identity. It adds cognitive load.

  ---

  ## 4. What Will Predictably Break (And How to Fix It)

  **1. The "Peek" Problem**
  *   *Failure:* Patients lift the blanket or peek through blindfold slits.
  *   *Fix:* Use a sleep mask *under* a blindfold. Have an Observer watch the gloves, not the patients.

  **2. The "Too Easy" Images**
  *   *Failure:* You show a perfect CAD render of a cube. Everyone gets it.
  *   *Fix:* Use photos of *real* objects with clutter. A cube sitting on a messy desk, half in shadow. A sphere that looks like a flat circle because of the lighting. The visual ambiguity is where the philosophy lives.

  **3. The Audio "Tell"**
  *   *Failure:* The Human Sonifier accidentally makes a "Click" when the patient touches the Cube, giving it away verbally later.
  *   *Fix:* The Sonifier must not be in the room during the Visual Phase. Or, the Sonifier wears noise-canceling headphones so they don't hear the Patients naming the objects.

  **4. The "Control" Advantage**
  *   *Failure:* Controls get 100% because everyone knows what a sphere looks like.
  *   *Fix:* Make the distractors tricky. Use a "Spheroid" (egg shape) as a distractor for the Sphere. Use a "Rectangular Prism" as a distractor for the Cube. Force the Controls to actually look, not just guess.

  ---

  ## 5. Limitations (Read this to yourself, share if needed)
  This workshop is a metaphor, not a medical test.
  1.  **Neural Plasticity:** 10 minutes of touch cannot replicate 6 months of blindness or a lifetime of vision. Real restoration involves the brain rewiring over weeks, not seconds.
  2.  **Congenital vs. Acquired:** Molyneux asked about the congenitally blind. Your partner is acquired. Her brain remembers "light." This game simulates the congenital experience (building from zero). If the group fails the task, it does **not** mean your partner won't recognize you. It just means cross-modal mapping is hard without prior visual memory.
  3.  **Emotional Weight:** Keep the betting light. For you, this is theoretical. For your partner, it's life. Don't let the game's "failure" feel like a prognosis.

  **Final Instruction for You:**
  Run the game. Let them lose the bet. Let them feel the confusion of seeing a shape you know by hand but not by eye. That confusion *is* the answer. Molyneux's problem isn't solved by a yes/no; it's solved by feeling the gap between the senses.

  Good luck with the treatment. Hope the workshop helps your group hold space for the complexity of it.
