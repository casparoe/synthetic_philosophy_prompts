      *   *Nihilism label:* Technically, van Inwagen calls his view "Organicism." The view that *nothing* composes anything (except maybe simples) is "Mereological Nihilism." Van Inwagen isn't a full nihilist because he believes living organisms exist. The blog calls it nihilism, which is a common simplification but slightly imprecise.
      *   *Linguistic Move:* Van Inwagen does argue that ordinary sentences can be "paraphrased away" to be true without committing to the existence of the object. This is accurate.
