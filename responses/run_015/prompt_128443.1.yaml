  This procedure mandates tracing the informational lineage of the validation criterion to ensure at least one node remains causally independent of the instrument's prior outputs. It distinguishes direct circularity, where outputs validate themselves, from subtle calibration, where prior outputs shape the看似 independent criterion. The rule requires an independent anchor not downstream of the tool's ecosystem. If no anchor exists, funding is withheld; if ambiguity remains regarding exposure, human judgment determines tolerable risk based on intervention stakes.

  **Decision Checklist**
  1.  **Identify Criterion:** What specific data validates the instrument? Is it distinct from the instrument's raw output?
      *   *Sufficient:* Criterion is externally generated (e.g., medical diagnosis, independent observation).
      *   **Stop: Reject** if criterion *is* the instrument's output or directly derived from it (First-order bootstrap).
  2.  **Trace Lineage:** How was the criterion constructed? Were raters, clinicians, or coders exposed to instrument outputs, pilot data, or training materials derived from the instrument?
      *   *Sufficient:* No exposure to instrument ecosystem prior to validation.
      *   **Stop: Pass** if no exposure exists (Independent anchor found).
      *   *Proceed:* If exposure confirmed, move to Q3.
  3.  **Assess Contamination:** Did exposure shape the definitions, intuition, or coding manual used for the criterion?
      *   *Sufficient:* Exposure was negligible or strictly blinded.
      *   **Hand to Judgment:** If exposure shaped the criterion, this is Second-order bootstrapping. Proceed to Q4.
  4.  **Verify Anchor:** Is there at least one node in the validation chain completely untouched by the instrument's prior outputs?
      *   *Sufficient:* Yes, documented independent source. **Stop: Pass**.
      *   **Stop: Reject** if no independent anchor exists.

  **Judgment Points & Misfire Warnings**
  Judgment is required at Q3 to weigh whether exposure invalidates the criterion. This is where values enter: is the contamination fatal or manageable given the cost of error? The procedure misfires when dependencies are implicit, such as shared terminology evolving between pilot and final manual without explicit acknowledgment. This is the "easy knowledge" trap: the instrument makes the criterion look valid because they speak the same language. Auditors must probe for conceptual drift, not just data flow. A "Pass" at Q2 may be false if cultural osmosis occurred among experts. Furthermore, the procedure cannot detect if the independent anchor itself is flawed, only if it is independent.

  **Absolute Limits**
  1.  It cannot establish the instrument's base-rate reliability in real-world deployment.
  2.  It cannot resolve whether a small residual circularity is ethically tolerable given high-stakes intervention needs.

  **Worked Cases**
  1.  **Depression App:** Clinicians used app flags during intake. Q1 fails; the diagnosis is contaminated by the output. **Reject**. This is classic first-order bootstrapping; the criterion is causally downstream.
  2.  **Literacy Tool:** Teachers trained on sample items from the tool. Q3 flags this; training shaped the criterion (ratings). **Reject/Flag**. This is second-order bootstrapping; teachers are not independent anchors because their assessment framework was built by the instrument.
  3.  **Climate Survey:** Expert manual incorporated pilot terminology. Q3 flags hidden dependency. Despite political popularity, the procedure requires **Flag/Reject**. The auditor must document the conceptual contamination and insist on re-validation with a truly blind manual, regardless of funding pressure. This is the unwelcome case: the auditor must prioritize epistemological integrity over political capital, noting that second-order bootstrapping inflates confidence falsely.
