answer: |-
  Based on your six verdicts, you are rejecting pure **Etiological Accounts** (which require selection history, ruling out the Synthetic Patch) and pure **Causal-Role Accounts** (which require only current contribution, ruling out the Bacterial Enzyme, Beetle Wings, and Junk DNA).

  Your intuitions suggest a **Hybrid Stabilization Principle**. You require a causal contribution, but that contribution must be "normatively sanctioned" by a history of retention—either through natural selection (biological) or intentional design (artifact)—and that retention must be established at the **population or type level**, not the individual level.

  Here is the proposed principle, the mapping, the prediction for your unlisted case, and an assessment of its limitations.

  ### The Principle: Stabilized Contribution Account (SCA)

  **Definition:**
  A trait $T$ within a system $S$ has the function $F$ if and only if:
  1.  **Causal Capacity:** $T$ causally contributes to effect $F$ within $S$.
  2.  **Teleological Stabilization:** The presence of $T$ in the relevant **Reference Class** is explained by a feedback loop wherein $F$ played a role in the retention or production of $T$.
  3.  **Stabilization Mechanism:** This feedback loop is instantiated by either:
      *   (a) **Natural Selection:** $F$ contributed to the reproductive fitness or **maintenance** of $T$ in a biological lineage.
      *   (b) **Intentional Design:** $F$ was the intended goal of an agent who produced or retained $T$.
  4.  **Reference Class Constraint:** The relevant class for stabilization must be a **biological population** or an **artifact type**, not a single organism's idiosyncratic state.

  ---

  ### Mapping the Principle to Your Six Cases

  | Case | Verdict | SCA Clause Application |
  | :--- | :--- | :--- |
  | **1. Human Heart** | **Function** (Pumping) | **Causal:** Yes. **Stabilization:** (a) Natural Selection (origin). **Class:** Population. |
  | **2. Synthetic Patch** | **Function** (Pumping) | **Causal:** Yes. **Stabilization:** (b) Intentional Design (engineered *for* pumping). **Class:** Artifact Type. <br>*(Explains why it functions despite no evolutionary history.)* |
  | **3. Appendix** | **Function** (Immune) | **Causal:** Yes. **Stabilization:** (a) Natural Selection (**Maintenance**). <br>*(Crucial: You accept "weak/indirect" selection. SCA counts maintenance selection as sufficient stabilization, distinguishing it from vestiges.)* |
  | **4. Bacterial Enzyme** | **No Function** (Accident) | **Causal:** Yes. **Stabilization:** **Failed.** No history of selection *for* this metabolism (yet), and no design intent. <br>*(Explains why essentiality alone is insufficient.)* |
  | **5. Beetle Wings** | **No Function** (Heat) | **Causal:** Yes. **Stabilization:** **Failed.** Heat dissipation did not select for or maintain the wings (they are vestigial/decaying). <br>*(Distinguishes useful byproducts from functions.)* |
  | **6. Junk DNA** | **No Function** (Regulation) | **Causal:** Yes. **Stabilization:** **Failed.** **Reference Class Constraint.** The trait is fixed in neither a population nor a design type; it is an individual idiosyncrasy. <br>*(Rules out individual-level causal roles.)* |

  ---

  ### Prediction for the Unlisted Case
  **Case:** *An artificial organoid grown in vitro, subjected to directed evolutionary selection for a metabolic task it was never originally designed to perform.*

  **Verdict:** **Function.**

  **Reasoning:**
  *   **Causal Capacity:** The organoid performs the metabolic task.
  *   **Stabilization Mechanism:** **Directed Evolution** counts as a hybrid of (a) and (b). It is an **Intentional Selection** process. Humans create the selection environment *for the purpose* of fixing that trait.
  *   **Reference Class:** If the directed evolution fixes the trait in the *line* of organoids (making it a stable type rather than a one-off mutation), it meets the Population/Type constraint.
  *   **Conclusion:** Unlike the Bacterial Enzyme (random acquisition) or Junk DNA (individual accident), this trait has been **stabilized by agency for this specific role.** The SCA grants it functional status.

  ---

  ### Limitations and Accommodation
  **Can this principle accommodate all six judgments without revision?**
  **Yes, but with one empirical caveat regarding Case 3 (Appendix).**

  The SCA accommodates all six judgments logically *if* the empirical premise of Case 3 holds: that the appendix is maintained *because* of its immune contribution (Maintenance Selection).
  *   **The Friction:** If future biology reveals the appendix is truly neutral debris (like the beetle wings) and the immune benefit is purely incidental, the SCA *must* deny it has a function to remain consistent with Case 5 (Beetle).
  *   **Accommodation:** To save your intuition on the Appendix while denying the Beetle, the principle relies on the distinction between **Maintenance Selection** (Appendix) vs. **Incidental Byproduct** (Beetle). If the Appendix is merely a byproduct, the SCA cannot accommodate your verdict without revising Clause 2 to allow "Current Utility" without "Historical Retention." However, doing so would force you to concede Function to the Beetle Wings, which you explicitly rejected.
  *   **Therefore:** The principle holds only if you accept that the Appendix is under *some* selective maintenance, whereas the Beetle wings are not.

  ---

  ### Confidence and Uncertainty

  **Confidence Level:** **85%**
  This reconstruction successfully unifies your artifact intuitions (Patch) with your biological intuitions (Heart, Enzyme) by treating "Design" and "Selection" as parallel stabilizing mechanisms. It also rigorously enforces the Population Constraint to handle the Junk DNA case.

  **Point of Least Certainty:** **The Boundary between Maintenance and Byproduct (Appendix vs. Beetle).**
  I am least sure about the empirical distinction between Case 3 and Case 5. Both involve traits where the *original* selected effect is gone or murky, and a *new* causal benefit exists.
  *   **The Risk:** Your intuition treats the Appendix as a **Function** but the Beetle Wings as a **Byproduct**. Philosophically, these are structurally identical (Exaptations).
  *   **The Differentiator:** The only thing saving the distinction in the SCA is the claim that the Appendix is *conserved* by selection (Maintenance), while the wings are *degenerating* (Vestigial). If the wings are stable and the heat dissipation helps survival, evolutionary theory would eventually call that a function.
  *   **Recommendation:** Be prepared to defend the claim that the Appendix is under **maintenance selection** while the Beetle wings are **decaying**. If that empirical claim fails, you must choose: either accept the Beetle wings have a function (shifting toward Causal-Role) or deny the Appendix has a function (shifting toward strict Etiological). You cannot currently have both without relying on that specific biological detail.
