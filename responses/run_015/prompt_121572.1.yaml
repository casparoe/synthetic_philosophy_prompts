answer: |-
  **MEMORANDUM**

  **TO:** Program Committee, "Progress & Method" Stream
  **FROM:** PhD-Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Finalists: Proposal A (Atlas) vs. Proposal B (Cassandra)

  **Bottom Line:** Fund Proposal A (Atlas), subject to strict constraints on validation and scope. Do not split the grant.

  **Reasoning**
  Our stream's mandate is to investigate "projects that get us closer to the truth." Proposal B concludes this mandate is incoherent. While B's philosophical critique is rigorous, funding it effectively funds the dissolution of our own mission. Proposal A attempts the impossible; even a demonstrated failure teaches us more about the limits of funding metrics than a successful argument that measurement is void. We are a foundation, not a philosophy department; our risk tolerance should cover technical failure, not mission negation.

  **The Losing Case (Proposal B)**
  To justify funding A, we must accept B's strongest objection, stated more sharply than Cassandra itself does. The issue is not merely that metrics are hard to choose, but that *any* finite partition of state-space encodes an ontology. If we measure "closeness" by cells ruled out, the ranking of theories is invariant only if the carving of the world is invariant. But it isn't. Redscribe the space using a logically equivalent but non-linear transformation (e.g., measuring temperature vs. squared temperature), and the "distance" to truth flips. A's toolkit does not measure closeness-to-truth; it measures coherence with the analyst's chosen vocabulary. Unless A can prove their metric is invariant under reconceptualization, the output is a record of the funder's biases, not nature's structure. This is not a technical bug; it is a categorical limit on formalizing verisimilitude.

  **The Deciding Dispute**
  Of the three disputes raised, **carving-relativity** carries the recommendation. The Popperian collapse (Miller/Grünbaum) is a red herring; it is a technical problem regarding false theories that A can adjust for via scoring rules without abandoning the core project. The statistician's predictive proxy is also a red herring; it changes the subject from truth to utility. We can estimate predictive accuracy, but our stream is explicitly mandated to investigate *truth*, not just survival. If prediction and truth come apart (as they can in underdetermined systems), the proxy fails our founding language. Carving-relativity is the only objection that threatens the internal coherence of A's method.

  **Committee Stance**
  The committee must resolve the invariance issue before funds are released. We should require **invariance under reconceptualization** as a hard constraint for success. A must demonstrate that their scoring metric yields stable rankings across logically equivalent redescriptions of the historical test cases. If the ranking flips when the vocabulary changes, the project fails. This is not kicking the can to the applicants; it is defining the success condition of the grant. We are not funding a toolkit that works only if we agree on the vocabulary; we are funding a toolkit that claims to measure reality, not our description of it.

  **Scope: The Live Case**
  Exclude the live cellular aging case from the initial 18-month scoping phase. Including it poisons the validation. If the toolkit produces a number that contradicts the committee's existing renewal intuition, we will be tempted to tweak the metric until it matches. If it matches, we will claim validation where there is only circularity. Historical cases (Ptolemy, Newton, etc.) provide fixed endpoints where the "winner" is settled enough to test the metric. The live case should only be introduced in a second phase, *after* the metric proves stable on history.

  **Failure Milestones**
  We need milestones that indicate technical failure, not just lack of publication.
  1.  **Instability under Redescription:** If the toolkit ranks Theory X above Theory Y in the standard partition, but Y above X in a logically equivalent non-linear transformation of the same state space, the project has failed.
  2.  **Historical Mismatch:** If the toolkit ranks a historically superseded theory (e.g., Ptolemy) as "closer to truth" than its successor (Copernicus) on the standard historical menu without a defensible, non-arbitrary justification for the metric choice.
  3.  **Metric Arbitrariness:** If the team cannot produce a principled argument for the choice of metric over the state space that does not rely on "fitting" the known historical outcome.

  **Institutional Context**
  Regarding the program officer's concern: Funding A does not require us to assume B is wrong. It requires us to assume B is *testable*. We are funding an experiment to see if verisimilitude can be measured despite B's objections. If A fails, we have empirical evidence that the mission is harder than hoped, which is preferable to adopting B's conclusion as dogma. We avoid funding the argument that our language is nonsense while still funding the rigorous critique of that language.

  **Summary**
  Fund A. Force them to solve carving-relativity. Keep the live case out of the validation set. Define failure as metric instability. This honors our mandate while respecting the depth of the philosophical risk.
