answer: |-
  ### Part 1: The Logical Space

  Before the cases, we map the terrain. We are testing five structural dimensions. Each "Leaf" (theoretical position) occupies a specific region of this space.

  **The Dimensions:**
  1.  **Modal Profile:** Is the belief *Safe* (true in nearby worlds) and/or *Sensitive* (would be false if P were false)?
  2.  **Causal/Explanatory Link:** Does the truth of the belief depend on the agent's ability, or on environmental luck?
  3.  **Defeater Status:** Are there true or misleading facts available that undermine justification?
  4.  **Process/Environment Fit:** Is the belief-forming process reliable *in this specific environment*?
  5.  **Pragmatic Context:** Do stakes or conversational context alter the verdict?

  **The Leaves (Theoretical Positions):**
  1.  **Safety:** Knowledge requires Safety. (Insensitive beliefs are not knowledge).
  2.  **Sensitivity:** Knowledge requires Sensitivity. (Unsafe beliefs are not knowledge).
  3.  **Anti-Luck:** Knowledge excludes significant epistemic luck (covers both Safety and Sensitivity failures).
  4.  **No-Defeater:** Knowledge is incompatible with undefeated defeaters (even misleading ones).
  5.  **Virtue/Credit:** Knowledge requires the truth to be *because of* the agent's cognitive ability.
  6.  **Reliabilism (Normal):** Knowledge requires a reliable process *in normal conditions*.
  7.  **Knowledge-First:** Knowledge is primitive; analysis via JTB+X is misguided. (Often aligns with strong intuitions).
  8.  **Error Theory:** The Gettier intuition is mistaken; these cases *are* knowledge (or JTB is not the target).
  9.  **Stakes/Context:** Knowledge attributions shift with practical stakes or attributor context.

  **Empty Cells (Combinations that yield no viable theory):**
  *   *Insensitive + Unsafe + Knowledge:* Ruled out by all modal theories (too much luck).
  *   *Sensitive + Safe + No Knowledge (with full justification):* Ruled out by most, unless a defeater is present.
  *   *High Stakes + Low Stakes (Same Verdict):* Ruled out by Stakes/Context theories (by definition).
  *   *False Defeater + Knowledge:* Ruled out by strict No-Defeater theories.

  **Flagged Indistinguishable Pairs:**
  *   **Safety vs. General Anti-Luck:** In most concrete cases, a violation of Safety *is* a case of epistemic luck. This quiz may not separate them cleanly; treat them as a cluster.
  *   **Knowledge-First vs. Error Theory:** Both may output "Knows" on Gettier cases. The difference is meta-philosophical (primitive status vs. denial of intuition), which cases alone cannot fully probe.

  ---

  ### Part 2: The Instrument (Orbital Debris Monitoring Station)

  **Setting:** ODMS Night Shift.
  **Cast:** Morgan (Shift Lead), Jordan (Analyst), Riley (Tech), Taylor (Comms).
  **Instructions:** For each case, select the verdict that best matches your intuition.
  **Verdict Options:**
  *   **K:** Knows.
  *   **~K:** Does Not Know.
  *   **K-:** Knows, but credit is diminished / epistemically lucky.
  *   **Varies:** Verdict shifts with stakes/context.

  #### The Cases

  **Case 1: The Stuck Readout (False Lemma)**
  Jordan believes "Sector 4 is clear." Jordan infers this from Monitor A, which reads "Clear." Monitor A is stuck on "Clear" due to a freeze. However, Sector 4 *is* actually clear (verified by a backup radar Jordan didn't check). Jordan has strong justification for trusting Monitor A.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 2: The Solar Flare (Environmental Luck)**
  Riley checks the battery voltage using Meter X. Meter X is working perfectly. However, a solar flare is currently frying 90% of all meters on the station. Riley happened to grab the one working meter from the rack without knowing about the flare. The reading is accurate.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 3: The Double Glitch (Intervening Luck)**
  Morgan sends a "Purge" command. She believes "The command was received." A signal glitch should have blocked it, but a second, independent glitch reopened the channel instantly. The command arrives. Morgan has no reason to suspect glitches.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 4: The Hyper-Sensitive Alarm (Safe, Not Sensitive)**
  Taylor believes "Pressure is Normal." Taylor bases this on Alarm B. Alarm B is designed to never miss a pressure spike (Safe: if Pressure is Normal, Alarm says Normal). However, Alarm B is known to flicker "Normal" occasionally even when Pressure is *High* (Not Sensitive: if Pressure were High, Taylor might still believe Normal). In the actual world, Pressure is Normal.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 5: The Fragile Orbit (Sensitive, Not Safe)**
  Jordan believes "Satellite X is stable." Jordan checked the long-range telemetry, which is accurate. However, the orbit is precariously balanced; in most nearby possible worlds, a tiny dust impact would destabilize it immediately, but Jordan's telemetry wouldn't register the dust until too late. In those nearby worlds, Jordan believes "Stable" but is wrong. In the actual world, it is stable.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 6: The Abnormal Algorithm (Reliabilism/Normal Conditions)**
  Riley uses the Standard Prediction Algorithm (SPA). SPA is 99% reliable in normal solar conditions. Today, solar conditions are highly abnormal (1 in 1000 year event), making SPA only 50% reliable. Riley doesn't know about the anomaly. SPA outputs the correct prediction.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 7: The Existential Guess (Loose Content)**
  Morgan says, "There is a fault in the thruster system." Morgan thinks Thruster 1 is faulty (based on a shaky reading). Thruster 1 is fine. However, Thruster 2 *is* faulty (unknown to Morgan). The statement "There is a fault" is true.
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 8: The Prank Report (Misleading Defeater)** **[CONTESTED CASE]**
  Taylor receives a memo: "Comms Link 3 is compromised." Taylor ignores it, trusting the live feed. The memo was a prank by a departing intern; Link 3 is fine. The live feed is accurate. Taylor believes "Link 3 is secure."
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-
  *   [ ] Varries (Depends on if Taylor *should* have checked)

  **Case 9: The Repaired Chain (Testimonial Luck)**
  Morgan tells Jordan "Orbit decaying." Morgan guessed. Jordan checks a chart that confirms it. The chart was updated by Riley, who actually measured it. Jordan doesn't know Riley measured it; Jordan thinks the chart is automated. The chain contains a lie (Morgan) but is repaired by fact (Riley).
  *   [ ] K
  *   [ ] ~K
  *   [ ] K-

  **Case 10: The Crewed Vessel (Stakes/Context)**
  *Scenario A:* Routine check. Evidence suggests "Path Clear."
  *Scenario B:* A crewed ship is in the path. Evidence is identical to A.
  Does the attribution of knowledge change between A and B?
  *   [ ] No (Same verdict)
  *   [ ] Yes (Knows in A, ~K in B)
  *   [ ] Yes (Knows in B, ~K in A)

  #### Tiebreakers (For Inconsistent Profiles)

  **Tiebreaker A: The Credit Split (Virtue vs. Reliability)**
  Riley fixes a circuit using a standard tool. The tool works. Unknown to Riley, the tool was scheduled for recall due to a 1% failure rate, but Riley's specific unit is fine. Is the success credit due to Riley's skill or the tool's luck?
  *   [ ] Mostly Riley (K)
  *   [ ] Mostly Luck (~K)
  *   [ ] Split (K-)

  **Tiebreaker B: The Primitive Intuition (Knowledge-First vs. Analysis)**
  Reflect on Case 1 (Stuck Readout). If you feel a strong pull to say "Knows" despite the false lemma, is that because:
  *   [ ] The analysis (JTB+X) is failing the intuition. (Error Theory/K-First)
  *   [ ] The intuition is failing the analysis. (Traditionalism)

  ---

  ### Part 3: Scoring Key & Diagnosis

  **How to Score:**
  Tally the responses. Do not look for a perfect match; look for the *cluster*.

  | Leaf / Theory | Primary Signal (Cases) | Secondary Signal | Tiebreaker Preference |
  | :--- | :--- | :--- | :--- |
  | **1. Safety** | Case 4: **K** (Safe) <br> Case 5: **~K** (Unsafe) | Case 2: ~K (Env Luck) | TB-A: Mostly Luck |
  | **2. Sensitivity** | Case 4: **~K** (Insensitive) <br> Case 5: **K** (Sensitive) | Case 1: ~K (False Lemma) | TB-A: Mostly Luck |
  | **3. Anti-Luck** | Case 1, 2, 3: **~K** or **K-** | Case 4, 5: ~K (If luck present) | TB-A: Mostly Luck |
  | **4. No-Defeater** | Case 8: **~K** (Defeater exists) | Case 1: ~K | TB-B: Intuition fails |
  | **5. Virtue/Credit** | Case 1, 2, 3: **~K** (No ability) | Case 6: ~K (Env abnormal) | TB-A: Mostly Riley |
  | **6. Reliabilism (Normal)** | Case 6: **~K** (Abnormal Env) | Case 2: ~K | TB-A: Split |
  | **7. Knowledge-First** | Case 1, 8: **K** (Intuition > Analysis) | Case 10: No | TB-B: Analysis failing |
  | **8. Error Theory** | Case 1, 2, 3: **K** (Gettier is wrong) | Case 10: No | TB-B: Analysis failing |
  | **9. Stakes/Context** | Case 10: **Varies** | Case 8: Varies | TB-B: N/A |

  **The Most Discriminating Case:**
  **Case 4 (The Hyper-Sensitive Alarm).**
  *   **Why:** This is the cleanest split between **Safety** (Yes, it's Safe) and **Sensitivity** (No, it's not Sensitive). Anti-Luck theories often struggle here depending on how they define "luck." If a respondent says **K**, they lean Safety. If **~K**, they lean Sensitivity.

  **Handling Mixed Profiles:**
  *   **Safety + Anti-Luck:** If they mark Case 4 as **K** and Case 2 as **~K**, they are in the Safety/Anti-Luck cluster. You cannot separate these with cases alone (see Flagged Pairs).
  *   **Knowledge-First + Error Theory:** If they mark Case 1 as **K** and select "Analysis failing" on Tiebreaker B, they are in this cluster. Distinguish by asking if they think "Knowledge" is a useful analytic term (K-First) or if they think the Gettier literature is a mistake (Error).
  *   **Inconsistent Modal Profiles:** If they say **K** on Case 4 (Safe/Insensitive) and **K** on Case 5 (Sensitive/Unsafe), they likely hold a **Virtue** or **Error Theory** view (ignoring modal features in favor of ability or primitive intuition). Use Tiebreaker A to split them.

  ---

  ### Part 4: Contestation & Caveats

  **The Genuinely Contested Case: Case 8 (The Prank Report)**
  *   **The Verdict:** Is it **K** or **~K**?
  *   **Why Contested:** This probes the *No-Defeater* condition.
      *   *Group A (Undefeated Justification):* Says **K**. The defeater is false (a prank), so it doesn't actually defeat justification. The evidence (live feed) is sufficient.
      *   *Group B (Misleading Defeaters Count):* Says **~K**. The agent possesses information (the memo) that, if true, would destroy justification. Possessing this information undermines knowledge even if the info is false.
      *   *Group C (Contextualist):* Says **Varies**. In a casual context, the memo is ignored (**K**). In a high-stakes audit, the memo must be ruled out (**~K**).
  *   **Literature Status:** There is no consensus on whether *misleading* defeaters destroy knowledge. Some argue knowledge is compatible with misleading defeaters; others argue that "defeasibility" includes potential defeaters.

  **Settled vs. Contested Map:**
  *   **Settled:** Case 1 (Stuck Readout) is generally agreed to be **~K** by almost all post-Gettier theories (the "Gettier Intuition" itself is the settled data point). If someone says **K** here, they are an Error Theorist or Radical Invariantist.
  *   **Contested:** The mapping from Case to Theory is disputed. For example, Virtue Epistemologists and Reliabilists might agree on the verdict for Case 6 (Abnormal Algorithm) but disagree on *why* (Ability vs. Process). This quiz sorts by verdict, not explanation.
  *   **The "JTB+X" Warning:** Note that several leaves (Knowledge-First, Error Theory) reject the premise that we are looking for a "fix" to JTB. If a respondent clusters there, they are opting out of the "analysis" game entirely.

  **Final Instruction for the Moderator:**
  If the group splits on Case 4 (Safe/Not Sensitive), you have successfully recreated the last 40 years of epistemology in one room. If they agree on Case 4 but split on Case 8 (Defeaters), you have recreated the internal debate within Invariantism. If they agree on everything, check if they are all Error Theorists.
