      *   **Tone:** Disciplined, analytical, philosophical, avoiding standard introductory fluff.

  2.  **Task 1: The Mapping (LE applied to Katrina)**
      *   *Outcome:* What is being equalized? Welfare? Resources? Opportunity? LE usually focuses on *advantage* relative to *responsibility*. In a disaster context, the relevant outcome is survival/safety (rescue), basic subsistence (relief), restoration of status quo ante (compensation), and future security (rebuilding).
      *   *Interval:* Is it the moment of the storm? The week after? The year after? LE typically looks at a "currency" of advantage over time.
      *   *Subjects:* The heterogeneous population who stayed.
      *   *Subgroups Analysis:*
          1.  *No car/cash/nowhere to go:* Brute luck (poverty). LE says: Compensate fully.
          2.  *Caring for relatives:* Option luck? Or brute (family obligations)? LE might see this as a choice, but a permissible one. If permissible, compensation is due. If "expensive taste" in family duty, maybe less.
          3.  *Prior gridlock/failed orders:* Brute luck (institutional failure). LE says: Compensate. The risk was not voluntarily assumed if the system failed before.
          4.  *Roof > Shelter (safety judgment):* Option luck (risk assessment). If reasonable, brute luck (bad info). If unreasonable, option luck. LE distinguishes based on epistemic conditions.
          5.  *Stubbornness/Fatalism/Bravado:* Classic Option Luck. LE implies: No compensation (or less), they bear the cost of their gamble.
      *   *Policy Implications:*
          *   *Rescue Priority:* LE is tricky here. It's comparative advantage, not triage. Strict LE might say save those who didn't choose the risk first? But LE doesn't inherently dictate *urgency* or *duty*. It dictates *distribution of burden*.
          *   *Emergency Relief:* Basic needs. LE might allow relief to prevent destitution but distinguish based on cause. However, immediate survival usually trumps responsibility tracking in practice, but theoretically, LE could deny "luxury" relief to the imprudent.
          *   *Compensation:* Here LE bites hardest. Those with brute bad luck get made whole. Those with option bad luck get nothing (or less).
          *   *Rebuilding:* Subsidizing floodplain rebuilding. LE says: If you chose to stay/live there knowing risks (option luck), don't subsidize. If you were trapped by poverty (brute), you need housing, but maybe not *there*.
      *   *Silences:* LE is a theory of distributive justice, not emergency triage or institutional duty. It doesn't say *who* must rescue, only how burdens/benefits should be distributed relative to responsibility. It struggles with the *state's* prior negligence (levees).

  3.  **Task 2: Structural Problems**
      *   *Temporal Unit:*
          *   *Episode:* Focus on the decision to evacuate. Imprudent = no aid.
          *   *Lifetime:* A catastrophe this big swamps prior choices. Even the "stubborn" might be below the threshold of a decent life afterwards. LE aims for equality of advantage over a life.
          *   *Problem:* LE doesn't specify the window. If the window is "post-storm welfare," the imprudent look responsible. If the window is "lifetime welfare," the storm is a brute shock to everyone's trajectory.
