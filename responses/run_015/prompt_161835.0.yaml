  ## Final Advice for the Host

  *   **Don't Save Them:** When they ask "So who was right?", resist the urge to give a satisfying answer. The discomfort *is* the lesson. Say: "That's the question. I can't answer it. Can you?"
  *   **Watch the Drunks:** If someone gets too abstract, ground them: "Show me with your hands. Did you bite hard or soft?"
  *   **The "Wittgenstein" Drop:** When you say his name at minute 40, frame it as: "You just spent 40 minutes fighting a ghost named Ludwig. He died in 1951, but he set this trap for you."
  *   **Writing It Up:** In your article, distinguish between the *experience* of the room (the confusion, the betting) and the *philosophical claim* (the impossibility of private ostension). The former is settled (they felt it); the latter is still fought over (what it implies about the mind).
