answer: |-
  There is no single canonical term in political science or sociology that captures this exact configuration of sincerity, structural pressure, and doctrinal drift without oligarchy. However, the phenomenon you describe is the intersection of three established concepts: **Latent Function** (Merton), **Schismogenesis** (Bateson), and **Adaptive Preference Formation** (Elster/Sen).

  If a label is required for this specific carving, the most precise existing term is **Symmetrical Schismogenesis** (for the differentiation case) operating through **Latent Cohesion** (for the internal pressure case). However, to capture the *doctrinal* nature of the drift—where beliefs are selected for group utility rather than truth or original purpose—I propose we define this as **Identity-Constitutive Doctrinal Drift**.

  Here is the carving of the mechanism, its distinction from nearby concepts, the evaluation of Weil's apparatus, and the shape of immunity.

  ### 1. The Mechanism: Identity-Constitutive Doctrinal Drift

  The mechanism is not a conspiracy, nor a failure of information. It is a systemic feedback loop where the *continuation of the group* becomes the latent telos, selecting for doctrines that maximize cohesion and differentiation.

  **The Steps:**
  1.  **Survival Imperative:** The organization outlives its manifest purpose (the tenants' association wins the repair; the society exists after the thesis is proven). To justify continued association (and the social goods it provides: status, friendship, purpose), it must generate new *reasons* to exist.
  2.  **Boundary Maintenance:** To remain distinct from the environment (or neighboring rivals), the group must sharpen its boundaries. In the learned society, this means amplifying minor differences into major schisms (Schismogenesis). In the tenants' association, this means treating tactical questions as moral imperatives to raise the cost of exit.
  3.  **Sincere Adaptation:** Members do not lie (ruling out preference falsification). Instead, they unconsciously adjust their cognitive evaluation of the evidence to align with the group's emerging center. This is **motivated reasoning** at scale. When the line shifts, members genuinely perceive the new reasons as superior; the old reasons are retroactively seen as naive or incomplete.
  4.  **Anonymity of Authorship:** Because every member adjusts slightly to the center, and the center is the aggregate of those adjustments, no single individual dictates the drift. The "pressure" is the sum of a thousand micro-signals of approval and disapproval (the "coldness" you noted).

  ### 2. Differentiation from Nearby Concepts

  *   **Vs. The Iron Law of Oligarchy (Michels):** Michels argues leadership consolidates power to preserve *their* position. In your cases, officers rotate and gain no material advantage. The drift is not driven by a leadership class protecting privileges, but by the *membership* protecting the *group identity*.
  *   **Vs. Goal Displacement (Selznick):** Goal displacement suggests the *means* become the *ends* (e.g., fundraising becomes the goal). Here, the *content of belief* changes. The group does not just keep working; it starts believing *differently* to justify the work.
  *   **Vs. Groupthink (Janis):** Groupthink implies a suppression of dissent due to stress or fear, leading to irrational decisions. You specify deliberation is vigorous and sincere. In Identity-Constitutive Drift, dissent is not suppressed; it is *absorbed and reinterpreted*. The group does not ignore counter-arguments; it collectively re-weights them until they support the new line.
  *   **Vs. Mission Creep:** Mission creep is an expansion of scope. This is a *contraction of intellectual independence*. The scope may expand, but the key feature is that the *rationale* for the scope is determined by internal cohesion needs, not external reality.

  ### 3. Weil's "Heavier Apparatus" vs. The Thinner Story

  Simone Weil posits a metaphysical collective entity: "The party is a collective that exerts pressure... nobody is answerable." She treats the party as a distinct moral agent that corrupts the individual.

  **The Thinner Story Suffices.**
  You do not need Weil's mystical collective mind to explain this. A thinner story based on **methodological individualism** and **social signaling** explains the phenomenon more robustly:

  *   **Cost of Exit:** In a volunteer group, the "salary" is social capital and moral self-regard. Questioning the aim threatens both.
  *   **Signaling:** To remain a member in good standing, one must signal commitment. As the group drifts, the signal required to prove membership becomes more specific (e.g., adopting the new differentiating thesis).
  *   **Cognitive Dissonance:** Humans dislike holding beliefs that isolate them from their tribe. It is psychologically cheaper to change one's view of the *tactic* than to change one's view of the *group*.

  Weil's "collective pressure" is simply the aggregate of individual members minimizing social friction and maximizing belonging. However, Weil's contribution is the **moral insight**: even if the mechanism is just individual psychology, the *result* is a structure that bypasses individual conscience. The "thinner story" explains *how* it happens; Weil explains *why it matters*. The phenomenon creates a structure where responsibility is dissolved, even if everyone is sincere.

  ### 4. Immunity: The Shape of Organization

  If the mechanism relies on the need for continued association, boundary maintenance, and the lack of external feedback, immunity requires breaking those links. An organization is immune to Identity-Constitutive Doctrinal Drift if it possesses:

  1.  **External Reality Testing:** The group's success is judged by immediate, non-negotiable physical feedback, not internal consensus.
      *   *Example:* A surgical team or a fire crew. If they drift doctrinally on procedure, people die immediately. The "coldness" of the group cannot override the reality of the outcome.
      *   *Contrast:* Political or advocacy groups deal in counterfactuals and future predictions, allowing doctrine to drift without immediate falsification.
  2.  **Automatic Dissolution (Sunset Clauses):** The organization is legally or constitutionally bound to dissolve upon achieving its specific manifest goal.
      *   *Example:* A special purpose vehicle (SPV) in finance, or a constitutional convention that disbands after ratification. This removes the "Survival Imperative."
  3.  **Overlapping Memberships:** Members belong to multiple, cross-cutting groups with different identities.
      *   *Example:* A scientist who is also a parishioner, a union member, and a parent. If the learned society drifts, the scientist's identity is not wholly invested in it; they can tolerate being out of step because their status is anchored elsewhere. Totalizing groups (where the group is the sole source of social capital) are most susceptible.
  4.  **Institutionalized Dissent:** Not just tolerance, but *required* roles for opposition.
      *   *Example:* The "Devil's Advocate" (Promotor Fidei) in the Catholic canonization process (historically), or red teams in intelligence. If the structure *rewards* identifying drift, the feedback loop is broken.

  ### Summary
  The phenomenon is **Identity-Constitutive Doctrinal Drift**. It is driven by the **latent function** of group preservation selecting for **schismatic** beliefs, enacted through **adaptive preferences** by sincere members. Weil's collective "pressure" is real in effect but requires no collective agent in explanation; it is the emergent result of individual social risk management. Immunity lies in **external verification**, **ephemerality**, and **cross-cutting identities**.
