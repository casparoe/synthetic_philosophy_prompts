      *   Need 2 sentences.
      *   Formula: "We felt [Infection Description] but [Barrier/Flag Issue]." OR "We felt [Infection] and [Stakes]."

  7.  **Addressing Limitations:**

      *   Satire/Irony (feels insincere by design).
      *   Cold/Withholding (minimalism).
      *   Cultural Competence (infection requires shared language).

  8.  **Review against Constraints:**

