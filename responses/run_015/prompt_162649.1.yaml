          *   *Loss:* We lose the transcendent/universal claim. We settle for "local resonance."
      *   *(4) Counterfeit Flags:* Tolstoy listed borrowing, imitation, strikingness, amusement.
          *   *Flags:* "The Echo" (derivative), "The Shock" (style over substance), "The Puzzle" (intellectualized without feeling), "The Gig" (pure entertainment).
