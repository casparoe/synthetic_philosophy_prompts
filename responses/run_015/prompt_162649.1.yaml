          3.  The Barrier Check (Craft vs. Status).
          4.  The Stakes Check (Secular Religious Perception).
          5.  The Counterfeit Scan.
      *   *Decision Logic:* Pass/Fail at each stage. Hand-off to human judgment at "Stakes."

