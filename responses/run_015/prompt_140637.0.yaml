answer: |-
  Based on the track record you've provided, here is the reconstruction of her standard, the prediction for the new case, and the specific question that will force her hand.

  ### The Verdict on the New Case
  She will **not** treat this as a confirmed cultural difference. She will likely characterize it as "suggestive but confounded by outcome bias" or "inconclusive pending process data."

  Even though the methodology is "clean" (within-subject, translation checks, comprehension), she will withhold the "Real Difference" stamp. She will argue that without the **mirror probe** (to check for symmetry) or **free-text justifications** (to check for conceptual alignment), she cannot distinguish between a genuine cultural divergence in *praiseworthiness* and a universal cognitive bias where one culture is simply more sensitive to negative outcomes than the other.

  ### The Rule She Is Actually Running
  **"The Asymmetric Burden of Proof."**

  Her standard is not consistent across all philosophical domains. She operates with a dual standard:
  1.  **Epistemic/Semantic Intuitions (Knowledge, Names, Reference):** These are granted **Default Realism**. A raw rating difference or forced-choice divergence between populations is sufficient to establish a "real" cultural difference (Cases 1, 2, 7). The burden of proof is on the skeptic to show it's an artifact.
  2.  **Normative/Metaphysical Intuitions (Morality, Free Will, Permissibility):** These are subject to **Structural Skepticism**. A raw rating difference is presumed to be noise, performance error, or framing effects until validated by "second signature" data (justifications, symmetry probes, stability checks) (Cases 3, 4). The burden of proof is on the researcher to show it's *not* an artifact.

  **Why the earlier verdicts rule out other rules:**
  *   **It's not just "Clean Method = Real":** Case 3 (Trolley) and Case 4 (Free Will) had reasonable methods but were dismissed. Case 5 (Translation) was "fixed" but still dismissed. Cleanliness is necessary but not sufficient for Normative cases.
  *   **It's not just "Moral Content = Junk":** She hasn't ruled out moral differences entirely, but she requires a higher evidentiary bar for them. If she believed moral intuitions were *always* junk, she wouldn't be running the study; she would have dismissed it at the design phase. The fact that she is "deciding on it right now" implies it *could* be accepted if the missing data (mirror probe) pans out.
  *   **It's not just "Within-Subject = Real":** Case 4 was a within-subject design (seeing both versions) where the difference *disappeared*, leading to dismissal. The New Case is within-subject where the difference *persists*. However, because it is Normative, persistence isn't enough; she needs to know *why* the rating moved (justifications) and if it moves back symmetrically (mirror probe).

  ### The Stress Test: The Single Follow-Up Question
  To force her to reveal whether she is committed to **Epistemic Privilege** (my theory) or a **Universal Structural Standard**, ask her this:

  > **"You accepted the 'Sheep/Gettier' case (Case 1) as a real cultural difference based on raw 'knows/doesn't know' ratings between groups. But you're hesitating on the Nurse case without a 'mirror probe' to check for symmetry. If we ran the mirror probe on the Sheep case and found that the Hong Kong students' ratings *didn't* move symmetrically when the truth conditions were flipped, would you retract the Sheep finding?"**

  **Why this works:**
  *   **If she says "No, the Sheep case stands":** She admits that Epistemic intuitions get a free pass that Moral intuitions do not. This confirms **Epistemic Privilege**. It undermines her claim that she is simply looking for "robust intuition," because she is tolerating less robustness in the Epistemic domain.
  *   **If she says "Yes, we'd have to retract the Sheep case":** She admits her true standard is **Universal Structural Symmetry**. This implies her earlier acceptance of Cases 1, 2, and 7 was premature or lucky, and she is actually much more skeptical of *all* x-phi data than her publication record suggests.

  **Journalistic Angle:**
  This exposes the tension in her field. Experimental philosophy wants to claim that "intuitions vary," but to make that scientific, they have to define what counts as a valid intuition. If she holds the Nurse case to a higher standard than the Sheep case, she is implicitly arguing that *what we know* is culturally relative, but *what we value* is just noise—unless proven otherwise. That is a massive philosophical claim hidden inside a methodological complaint.
