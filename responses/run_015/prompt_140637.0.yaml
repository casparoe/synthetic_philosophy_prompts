  Hey — I'm a journalist and I'm working on a feature about how much of philosophy is really just codified intuition, and how much of *that* is just local. I've been interviewing this experimental philosopher for weeks, and I can't work out what her actual standard is. Here's her track record, as best I can reconstruct it. (1) The old vignette where a guy looks across a field at something that looks like a sheep but is actually a dog, and a real sheep is hidden behind a hill, so his belief is true but for the wrong reason: her Pittsburgh undergrads say "true belief but he doesn't know," her Hong Kong sample and her rural north-India sample lean the other way and say he does know. She treats that as a real difference. (2) The vignette where everyone in a community knows a name only through a description — "the man who did X" — and it turns out someone else did X and the famous guy didn't: Americans say the name still picks out the guy everyone associates it with, her Chinese sample says it picks out whoever actually did X. Real difference. (3) A push-vs-switch trolley thing where her two samples diverge on "is it permissible": she says it's junk, because one group is answering "would I do it" or isn't taking the story seriously, not "is it permitted." (4) A determinism/free-will vignette: a gap between students in two cities, but it disappears when the same person sees both versions back to back — she dismisses it. (5) A case where the difference between samples vanished once she asked "does he really know" instead of "does he know" in proper translation — dismissed as a translation problem. (6) A study where the rural sample failed the comprehension questions 20% of the time — dismissed. (7) A knowledge vignette where the two samples picked different options in a forced choice between two nearly identical stories — she accepted that one.

  Here's the new case, which she's deciding on right now and which I'm trying to pre-write a paragraph about. Its a study about whether someone is *praiseworthy*: a nurse who promised a patient's sister she'd call if things took a turn, doesn't call, and the sister misses the death by an hour; the nurse's excuse is that she was swamped and honestly forgot. Her two samples disagree on how much praise or blame is due. But this one is methodologically clean: everyone saw both a version where the call gets made and a version where it doesn't, the questions were translated and back-translated, comprehension checks pass at the same rate in both samples, and the difference shows up on a 1-to-7 scale. She hasn't run the free-text justifications yet, has no reaction-time data, and she hasn't tried what her lab calls the "mirror probe" — you tell the same people the story with the outcome flipped and check whether their ratings move by the same amount in both directions. So: what do you think she says about this one? I don't just want the guess, I want the rule you think she's actually running — something like "clean method means real," versus "moral content never survives because people are reading the scenario differently," versus "a bare rating difference isn't enough, you need a second signature" — and I want to know which of those rules her earlier verdicts rule out and which they leave open. And most useful to me: if I get her on the record again, what single follow-up case would force her to show me which rule she's committed to?
