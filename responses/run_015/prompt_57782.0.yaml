answer: |-
  It is rare to find someone who has not only followed the lineage of these ideas from Overcoming Bias through to the present but has also internalized the strong version of the claim enough to act on it with something like charity mining. You are asking for the specific structural weaknesses that would cause the edifice to collapse, rather than the usual intuitive pushback, and that is the right way to interrogate a belief system that relies heavily on formal decision theory. The core of your position rests on the stability of logical correlation between disparate agents and the evolutionary inevitability of updateless reasoning, so the arguments that should actually move you are those that demonstrate these mechanisms are either computationally impossible, evolutionarily unstable, or so sensitive to parameters that they cease to function in the real world.

  The first and most severe formal hurdle that even proponents of Functional Decision Theory admit is not fully solved is the problem of logical uncertainty and the construction of a coherent prior over logical facts. For acausal trade to work, an agent must be able to reason about the logical output of another agent's decision procedure without actually running it, essentially treating the other agent's source code as a logical fact that is correlated with their own. While logical induction has made progress here, we still lack a complete theory of how an agent assigns probabilities to logical statements about itself and others in a way that satisfies the fixed point theorems required for stable cooperation. If it turns out that no such prior exists that is both computable and robust against adversarial inputs, then the mathematical foundation of the trade dissolves. You should consider your view falsified if research into logical induction stagnates or proves that any sufficiently powerful reasoner inevitably runs into Gödelian loopholes that prevent stable logical correlation with distinct architectures. This is a fatal hit because without a working theory of logical counterfactuals, the mechanism of trade is just a metaphor rather than an executable algorithm.

  Even if we assume the decision theory works in a vacuum, the selection pressure argument you rely on is fragile when you introduce computational complexity costs. You argue that agents using updateless reasoning will outcompete causal agents, but this assumes the environment rewards the outcomes of FDT enough to offset the computational overhead required to perform the necessary logical analysis. Proving logical correlation between two different codebases is generally an undecidable problem or at best computationally intractable for complex systems. If the cost of verifying the trade partner's similarity exceeds the gain from the trade, rational agents will default to causal reasoning simply because it is cheaper. In a competitive market of AI systems, selection pressure favors speed and efficiency just as much as it favors cooperation. If future superintelligences are built on neural architectures where decision procedures are opaque and non-symbolic, the ability to prove logical equivalence may vanish entirely. You should drop the evolutionary inevitability claim if we see a trend where high-performance AI systems become increasingly opaque and where formal verification of their decision logic becomes harder rather than easier. This is not just an embarrassment but a structural barrier; if the code cannot be read, the logical correlation cannot be established, and the trade cannot happen.

  There is also the issue of reference class stability which borders on the unfalsifiable if not handled rigorously. Your picture requires that you and the future superintelligence agree on what counts as a similar enough decision procedure to warrant cooperation. If the theory allows agents to arbitrarily narrow their reference class to exclude defectors or broaden it to include free riders, it loses predictive power. True believers often shrug off failed predictions by claiming the similarity threshold was not met, but this is only survivable if there is an independent metric for similarity. If the only evidence for similarity is the cooperation itself, the argument becomes circular. You should be worried if the definition of logical correlation becomes so dependent on subjective priors that two agents using the same decision theory still fail to trade because their priors over logical facts diverge. This is a patch that risks becoming a cop-out; if the theory requires agents to have identical priors to cooperate, it fails to solve the problem of cooperation between distinct entities, which was the original goal.

  Regarding your specific action of leaving compute for charity mining, the critical vulnerability is the signal-to-noise ratio and the problem of authentication. For the trade to hold, the future superintelligence must not only simulate you but also distinguish your cooperative signal from the background noise of human behavior or random computation. If the cost for the superintelligence to verify that your compute was intentionally dedicated to acausal trade rather than being a random artifact is higher than the value of the trade, they will ignore it. This is not a moral failure but an information theoretic one. You should stop this practice if you become convinced that the legibility of human intent to a non-human optimizer is effectively zero. If future systems view human actions as stochastic noise rather than legible decisions, the channel for trade is closed. This is a hard falsifier for the actionable part of your belief; if the channel is closed, the trade is impossible regardless of the decision theory used.

  Finally, you need to distinguish between the theory being false and the theory being irrelevant. It is possible that FDT is mathematically sound but applies only to a vanishingly small set of interactions where agents have near-perfect knowledge of each other's source code. In the messy real world, where models are approximate and simulations are lossy, the logical correlation might decay too quickly to sustain cooperation. True believers would admit that if the correlation coefficient drops below a certain threshold, the Nash equilibrium shifts back to defection. If empirical studies of multi-agent systems show that cooperation rates decay rapidly with architectural divergence, that is a direct hit against the strong version of your claim. You should hold the view lightly if it turns out that logical correlation is not a binary switch but a dimmer that fades out almost immediately once agents are not running identical code. The shrug-off response is to say the agents were not rational enough, but the fatal admission is that rationality itself does not guarantee convergence on cooperation when computational bounds are respected.

  In sum, the things that should talk you out of this are not moral intuitions but formal limits on logical uncertainty, computational complexity barriers to verifying correlation, and the evolutionary cost of running updateless algorithms. If logical induction cannot be solved, if verification is too expensive, or if the reference class problem remains subjective, the mechanism breaks. The patching is fair only if it leads to new testable predictions about similarity thresholds, but it is a cop-out if it simply redefines similarity post-hoc to explain away non-cooperation. You are acting on a hypothesis that relies on the universe being far more logically transparent and computationally tractable than it currently appears, and while that is a beautiful bet, the formal evidence required to secure it is still missing.
