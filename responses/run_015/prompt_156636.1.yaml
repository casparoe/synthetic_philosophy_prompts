  **The Legalist Paradox: Reconceptualizing Democratic Backsliding in the Age of Autocratic Legalism**

  The contemporary crisis of democracy is rarely characterized by the dramatic spectacle of a tank in the square or the suspension of a constitution. Instead, it arrives through the quiet accumulation of statutes, the strategic bundling of legislation, and the meticulous restructuring of judiciaries—all conducted within the letter of the law. This phenomenon presents a profound analytical challenge: does the concept of "democratic backsliding" retain value when regimes degrade political competition without breaching formal constitutional text? If a government uses omnibus bills, statutory emergency decrees, and legally valid judicial appointments to entrench power, is it backsliding, or is it merely exercising a democratic mandate? To answer this, one must navigate the risk of circular reasoning, where "backsliding" becomes a synonym for "policies I oppose." By examining Hungary, Poland, Turkey, and the United States, it becomes evident that restricting the definition of backsliding to explicit rule-breaking renders the concept analytically obsolete. Therefore, democratic backsliding must be reconceptualized around procedural degradation, anchored not in policy outcomes but in the reduction of electoral uncertainty and the violation of institutional neutrality.

  The central difficulty in identifying backsliding within legal bounds is the problem of legitimacy. In a majoritarian democracy, a winning coalition has the right to legislate. If a party wins a supermajority and alters election laws or judicial appointment rules, a strict legalist might argue this is the essence of democracy, not its erosion. To designate this as backsliding without circular reasoning requires moving beyond the *legality* of an act to its *structural impact* on competition. The criterion for legitimate designation cannot be the ideological content of the legislation (e.g., tax rates or social policy) but rather the procedural architecture of power. Political scientist Adam Przeworski defines democracy as a system where parties lose elections and relinquish power. Consequently, a regime is backsliding if procedural changes are designed to insulate incumbents from the risk of loss. This "uncertainty test" provides a non-partisan metric: would the ruling party accept these procedural changes if they anticipated losing the next election? If the answer is no, the changes are not democratic governance but autocratic entrenchment, regardless of their statutory validity.

  This form of governance, termed "autocratic legalism" by scholar Kim Lane Scheppele, relies on the weaponization of legal instruments. In Hungary, Viktor Orbán's Fidesz party utilized its constitutional supermajority to pass an omnibus "Fundamental Law" and subsequent cardinal laws that gerrymandered districts and media regulations. Every step was voted on legally. Similarly, in Poland, the Law and Justice (PiS) party restructured the National Council of the Judiciary through statutory amendments that were technically constitutional but effectively politicized judicial oversight. In Turkey, Recep Tayyip Erdoğan utilized emergency decrees following the 2016 coup attempt; while the state of emergency was constitutionally permissible, the decrees were used to purge opposition indefinitely, bypassing parliamentary scrutiny. In these cases, the formal text was respected, but the *spirit* of constitutionalism—the limitation of power—was eviscerated. If analytical frameworks exclude these cases because no law was "broken," they fail to capture the primary mechanism of modern authoritarianism.

  The application of this framework to the United States tests whether the concept reveals a structural pattern or collapses into partisan labeling. Critics argue that labeling U.S. developments as backsliding is merely liberal anxiety over conservative judicial appointments or voting regulations. However, when viewed through the lens of procedural degradation, specific patterns emerge that align with the Hungarian and Polish cases, albeit at an earlier stage. The use of gerrymandering to create "safe seats" reduces electoral uncertainty. The strategic use of the filibuster to block routine governance, followed by its removal for judicial appointments (the "nuclear option"), represents a breakdown of institutional forbearance. Furthermore, the proliferation of omnibus spending bills prevents legislative scrutiny, mirroring the procedural opacity seen in Europe. While the U.S. retains robust civil society and federalist checks that Hungary lacks, the *mechanism*—using legal procedural tools to minimize the risk of political loss—is structurally identical. Recognizing this pattern is not partisan labeling; it is the identification of a specific strategy of power consolidation that transcends ideology. If the concept of backsliding is reserved only for illegal coups, it cannot diagnose the slow-acting virus that currently threatens these diverse regimes.

  However, reconceptualizing backsliding around procedural degradation requires rigorous guardrails to avoid the circularity trap. If every controversial law is deemed "backsliding," the term loses meaning. The designation must be reserved for actions that violate the principle of institutional neutrality. For example, a government cutting funding for a public broadcaster is a policy choice; a government restructuring the broadcaster's board to ensure only ruling-party loyalists can be appointed is procedural degradation. The distinction lies in whether the rule change is *general* (applicable to any future winner) or *particularistic* (designed to benefit the current incumbent). In Hungary and Poland, judicial reforms were often retroactive or tailored to specific terms, failing the generality test. In the U.S., debates over court-packing or voting ID laws must be evaluated on whether they disproportionately alter the weight of votes or the independence of referees, rather than on the policy merits of the laws themselves.

  Ultimately, retaining the traditional definition of democratic breakdown—which requires explicit unconstitutional acts—is an analytical failure in the twenty-first century. Autocrats have learned that violating the constitution invites resistance, while rewriting it invites legitimacy. If scholars and observers insist that backsliding requires a breach of formal text, they grant a blueprint for authoritarianism: simply ensure every erosion of rights is voted on by a compliant legislature. This would render the concept of backsliding useless for early warning or comparative analysis.

  Therefore, the concept of democratic backsliding must be reconceptualized around procedural degradation. It should be defined as the state-led alteration of the rules of political competition, through legally valid instruments, with the intent and effect of reducing the uncertainty of electoral outcomes and compromising institutional neutrality. This definition allows for the legitimate designation of regimes in Hungary, Poland, Turkey, and potentially the United States without relying on partisan policy preferences. It focuses on the *rules of the game* rather than the *score*. To argue otherwise is to privilege form over substance, allowing democracy to be legally voted out of existence while observers claim nothing is wrong because the paperwork is in order. Democracy is not merely the presence of laws, but the presence of a contestable future; when legal instruments are used to foreclose that future, backsliding has occurred, regardless of the statute books.
