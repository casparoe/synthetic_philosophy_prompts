  ### The Three-Exit Motorway Case

  **The Scenario**
  You are driving a standard sedan on a featureless motorway at night. You know there are exactly three exits remaining before the road ends at a remote terminus. Due to fatigue-induced imperfect recall, you cannot distinguish the exits from one another, nor can you remember if you have passed one already. You cannot count, mark the dashboard, or use external aids. You must decide on a policy *now*: at every exit you encounter, you will exit with probability $p$ and continue with probability $1-p$.

  **The Payoffs**
  The outcomes are concrete and ranked as follows:
  1.  **Exit 1 (The Quick Diner):** You stop early. The food is edible but you are still far from your destination. **Payoff: 3.**
  2.  **Exit 2 (The Grand Hotel):** This is your intended destination. Perfect rest. **Payoff: 10.**
  3.  **Exit 3 (The Closed Service Area):** You overshot the hotel. This station is under renovation; you waste fuel and gain nothing. **Payoff: 0.**
  4.  **Pass All (The Distant All-Night Café):** You reach the end of the motorway. It is a long drive, but the café is reliable and safe. **Payoff: 4.**

  **The Optimal Plan ($p^*$)**
  Your ex-ante expected utility $V(p)$ for a mixed strategy $p$ (where $q=1-p$) is:
  $$V(p) = p(3) + pq(10) + pq^2(0) + q^3(4)$$
  Substituting $q = 1-p$ and simplifying:
  $$V(p) = 3p + 10p(1-p) + 4(1-p)^3$$
  $$V(p) = -4p^3 + 2p^2 + p + 4$$
  Differentiating with respect to $p$:
  $$V'(p) = -12p^2 + 4p + 1$$
  Setting $V'(p) = 0$ yields roots at $p = 1/2$ and $p = -1/6$.
  Thus, the global maximum on $[0,1]$ is **$p^* = 1/2$**.
  *   Value of Optimal Plan: $V(1/2) = 4.5$.
  *   Value of Always Exit ($p=1$): $V(1) = 3$.
  *   Value of Never Exit ($p=0$): $V(0) = 4$.
  The optimal plan is strictly interior and strictly better than the pure strategies.

  **The Decision at the Intersection**
  You find yourself at an intersection. You know you are following plan $p^*=1/2$. You consider a one-shot deviation: Exit now, then revert to $p^*=1/2$ at any future intersections.
  Let $C_k$ be the expected value of *Continuing* from exit $k$ (given you revert to $p^*=1/2$ thereafter).
  *   $C_3 = 4$ (Value of passing exit 3).
  *   $C_2 = 0.5(0) + 0.5(4) = 2$.
  *   $C_1 = 0.5(10) + 0.25(0) + 0.25(4) = 6$.

  Let $D_k$ be the net gain of *Exiting* at $k$ rather than Continuing ($D_k = u_k - C_k$).
  *   $D_1 = 3 - 6 = -3$ (Exiting too early is a loss).
  *   $D_2 = 10 - 2 = +8$ (Exiting at the hotel is a large gain).
  *   $D_3 = 0 - 4 = -4$ (Exiting at the closed station is a loss).

  We evaluate the expected gain of exiting ($\Delta$) under the three belief rules.

  1.  **Rule (A): Visit-Frequency.**
      Beliefs are proportional to the probability of reaching the node under $p^*$.
      Reach probabilities: $1, 1/2, 1/4$. Normalized weights: $(4/7, 2/7, 1/7)$.
      $$\Delta_A = \frac{4}{7}(-3) + \frac{2}{7}(8) + \frac{1}{7}(-4) = \frac{-12 + 16 - 4}{7} = 0$$
      **Verdict:** Indifferent. (This is mathematically guaranteed when $p^*$ maximizes ex-ante utility).

  2.  **Rule (B): Uniform-Indifference.**
      Beliefs are $(1/3, 1/3, 1/3)$.
      $$\Delta_B = \frac{1}{3}(-3) + \frac{1}{3}(8) + \frac{1}{3}(-4) = \frac{1}{3} > 0$$
      **Verdict:** Strictly prefer to **Exit**.

  3.  **Rule (C): Halfer Rule.**
      Beliefs are $(1/2, 1/4, 1/4)$.
      $$\Delta_C = \frac{1}{2}(-3) + \frac{1}{4}(8) + \frac{1}{4}(-4) = -1.5 + 2 - 1 = -0.5 < 0$$
      **Verdict:** Strictly prefer to **Continue**.

  **Performance of Deviant Strategies**
  If you adopt the advice of (B) at every intersection, you effectively choose $p=1$. Ex-ante value: **3**.
  If you adopt the advice of (C) at every intersection, you effectively choose $p=0$. Ex-ante value: **4**.
  Both are strictly inferior to the optimal plan value of **4.5**.

  ***

  ### Analysis of the Tension

  **Why the Payoff Structure Matters**
  The divergence between (B) and (C) arises because the payoff structure creates a "peak" at the second exit ($D_2 > 0$) flanked by "valleys" at the first and third exits ($D_1, D_3 < 0$).
  *   **Rule (B)** is optimistic: It assigns equal weight to the "peak" ($X_2$) as it does to the "valleys". Because the gain at $X_2$ (+8) is large enough to outweigh the losses at $X_1$ and $X_3$ in a simple average, (B) recommends exiting.
  *   **Rule (C)** is pessimistic: It assigns 50% probability to being at the first exit ($X_1$). Since $X_1$ is a loss (-3), this heavy weighting drags the expected value of exiting below zero, recommending continuation.
  *   **Rule (A)** is calibrated: It weights the nodes by their actual likelihood of occurrence under the optimal plan ($X_1$ is most likely, $X_3$ least). This specific weighting is the *only* one that balances the large gain at $X_2$ against the losses at $X_1$ and $X_3$ to produce exact indifference.

  **Why Interior Optimality Forces (A)'s Indifference**
  An interior ex-ante optimum $p^*$ satisfies $V'(p^*) = 0$. The derivative of the ex-ante value function can be decomposed into the sum of the marginal gains at each node, weighted by the probability of reaching that node. Mathematically, $V'(p) = \sum P(\text{Reach } k) \cdot (u_k - C_k)$.
  Therefore, if $p^*$ is optimal, the weighted sum of gains ($D_k$) using reach-probabilities as weights must be zero. Rule (A) uses exactly these weights (normalized). Thus, Rule (A) *must* yield indifference at the ex-ante optimum. The tension in this case is not that the plan is unstable; it is that Rules (B) and (C) apply the wrong weights to the node-specific gains, leading to actions that degrade the ex-ante value.

  ***

  ### The Two-Exit Reduction

  If we delete the third exit, the scenario collapses to:
  *   Exit 1 ($u_1$), Exit 2 ($u_2$), Pass All ($u_3$).
  *   To maintain an interior optimum at $p=1/2$, the condition becomes $u_1 = u_3$.
  *   Let $u_1 = 3, u_3 = 3, u_2 = 10$.
  *   $D_1 = 3 - (0.5 \cdot 10 + 0.5 \cdot 3) = -3.5$.
  *   $D_2 = 10 - 3 = 7$.
  *   Note that $D_1 = -0.5 D_2$.

  **What Collapses:**
  In the 2-exit case, **Rule (B) and Rule (C) become numerically identical.**
  *   Rule (B) (Uniform): 2 exits $\implies$ probabilities $(1/2, 1/2)$.
  *   Rule (C) (Halfer): 1st is $1/2$. Remaining $1/2$ divided among later (only $X_2$) $\implies$ probabilities $(1/2, 1/2)$.

  Both rules now calculate $\Delta = 0.5(-3.5) + 0.5(7) = 1.75 > 0$. Both recommend **Exit**.
  Rule (A) (Weights $2/3, 1/3$) calculates $\Delta = 2/3(-3.5) + 1/3(7) = 0$. Indifferent.
  **Conclusion:** The 3-exit structure is *necessary* to drive a wedge between the Uniform and Halfer rules. With only two exits, the "Halfer" logic converges to the "Uniform" logic, and you lose the ability to show them bracketing the correct (A) verdict in opposite directions.

  ***

  ### Replies from Defenders

  **To the Defender of (B) (Uniformity):**
  *   **Reply:** "My rule is based on the Principle of Indifference. Subjectively, the exits are identical. I have no evidence favoring one over the other. The ex-ante plan is a separate cognitive act; it does not change my current epistemic state."
  *   **Cost:** This agent is vulnerable to a **money pump**. If offered a small fee to switch from their preferred action (Exit) to the optimal action (Mix) before starting, they would pay. But at every intersection, they would pay to switch back to Exit. They systematically sacrifice value for the sake of an epistemic principle that ignores the causal structure of their own strategy.

  **To the Defender of (C) (Halfer):**
  *   **Reply:** "I should treat my current awakening as a new coin flip. The probability of being at the first exit is always 1/2 regardless of how many exits follow. The ex-ante plan is irrelevant to the truth of my current location."
  *   **Cost:** This agent suffers from **time inconsistency**. They plan to mix ($p=1/2$) at the start, but when they arrive at an intersection, they strictly prefer to Continue ($p=0$). They cannot self-enforce their own optimal plan without external commitment devices (which are ruled out in this scenario). They are forced to accept a suboptimal outcome (Value 4) because their belief rule makes their optimal plan dynamically unstable.

  ***

  ### Limitations Note

  This case establishes that *if* one accepts ex-ante planning as the normative standard for rationality, then Rule (A) is the only belief rule consistent with that standard. However, it does not prove that ex-ante planning is the *only* valid normative standard. A defender of (B) or (C) might reject the "modified multiself" framework entirely, arguing that rationality is about maximizing expected utility *given current beliefs*, regardless of whether those beliefs align with the ex-ante optimum. This case shows the cost of that rejection (suboptimal payoffs), but it does not logically refute the epistemic coherence of (B) or (C) in isolation. Furthermore, this model assumes the agent can perfectly compute and commit to a mixed strategy $p$, which may be cognitively unrealistic for ordinary drivers, though it remains the standard idealization in decision theory.
