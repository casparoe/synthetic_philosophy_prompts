  2.  **Rule (B)** (Uniform 1/3) $\implies$ Strict Exit.
  3.  **Rule (C)** (Halfer 1/2, 1/4, 1/4) $\implies$ Strict Continue.

  **Payoff Structure Strategy:**
  Let $u_1, u_2, u_3, u_4$ be payoffs for exiting at 1, 2, 3, or passing all.
  Let $p$ be the exit probability. $q = 1-p$.
  Ex-ante Value: $V(p) = p u_1 + pq u_2 + pq^2 u_3 + q^3 u_4$.
  To simplify arithmetic, I will force the optimal plan to be **$p^* = 1/2$**.
  The first-order condition $V'(1/2) = 0$ simplifies to: $4u_1 = u_3 + 3u_4$.
  To generate the required preference divergence, I need the "gain from exiting" ($D_k = u_k - \text{Value of Continuing}$) to have specific signs.
  Typically, $X_2$ is the target ($D_2 > 0$). $X_1$ is too early ($D_1 < 0$). $X_3$ is a trap ($D_3 < 0$).
  Rule (B) weights all nodes equally. If $D_2$ is large, (B) favors Exit.
  Rule (C) weights $X_1$ heavily (1/2). If $D_1$ is negative, (C) favors Continue.
  Rule (A) weights by reach probability ($1, q, q^2$). At $p=1/2$, weights are $(4/7, 2/7, 1/7)$. This balances the equation to zero by definition of optimality.

