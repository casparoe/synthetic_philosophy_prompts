answer: |-
  In preparing these notes for our seminar I have attempted to map the logical terrain of the discursive dilemma as it arises when a committee must aggregate judgments on a nested argument containing both empirical premises and a normative conclusion, specifically where members express graded confidence rather than binary acceptance. You might begin by asking whether the collective should secure consistency by aggregating the supporting reasons first and inferring the outcome, or whether it should simply aggregate the final outcome directly without regard for the underlying structure of reasons. If one begins by aggregating the reasons first, one must then decide whether the graded confidence members express in those premises should be preserved through the aggregation process or collapsed into a binary threshold beforehand. Suppose the group chooses to collapse graded confidence into a binary threshold before aggregating the premises, and further suppose that within this framework normative premises are aggregated just like empirical ones without any special protection. This position is known as the Premise-Based Procedure, and its most awkward commitment is forcing members to revise their logical consistency in public by accepting a conclusion they privately reject because the collective premises entail it. Alternatively, if the group chooses to collapse graded confidence into a binary threshold but insists that normative premises are protected by an individual-sovereignty clause that prevents collective override of personal values, no theorist currently occupies this position. This gap appears incoherent because if normative premises cannot be aggregated to form a collective normative premise, no valid collective conclusion can be logically derived from the collective empirical premises alone. Returning to the branch where graded confidence is preserved through aggregation, if normative premises are aggregated like empirical ones, this position is largely unnamed though it resembles probabilistic opinion pooling applied to judgments. Its most awkward commitment is that the collective may hold a degree of belief in a conclusion that exceeds the confidence of any individual member, creating a form of collective dogmatism. However, if graded confidence is preserved while normative premises are protected by an individual-sovereignty clause, this combination is also unnamed. This gap appears unattractive because it creates a hybrid system that sacrifices logical closure for value protection without providing a clear mechanism for reaching a decisive collective judgment.

  Having exhausted the paths where reasons are aggregated first, consider the alternative root where the group chooses to aggregate the final outcome directly without regard for the underlying structure of reasons. Within this camp, one must again decide whether the graded confidence members express in the conclusion should be preserved through aggregation or collapsed into a binary threshold beforehand. If the group chooses to collapse graded confidence into a binary threshold and normative premises are treated as aggregated like empirical ones, this position is known as the Conclusion-Based Procedure. Its most awkward commitment is permitting the collective to endorse a decision without sharing any agreed-upon reason for it, thereby severing the link between justification and action. If instead the group chooses to collapse graded confidence into a binary threshold but normative premises are protected by an individual-sovereignty clause, this position is unnamed. This gap appears simply unexplored because direct aggregation of the conclusion renders the status of the premises functionally irrelevant to the aggregation mechanism unless it acts as a veto that reverts the process to premise-based logic. Moving to the scenario where graded confidence is preserved through aggregation of the conclusion, if normative premises are aggregated like empirical ones, this position aligns with Weighted Voting or Utilitarian Aggregation. Its most awkward commitment is allowing high confidence among a minority to outweigh low confidence among a majority, potentially violating principles of political equality. Finally, if graded confidence is preserved while normative premises are protected by an individual-sovereignty clause, this position is unnamed. This gap appears incoherent because direct aggregation of the conclusion bypasses the normative premises entirely, making their protection logically disconnected from the outcome being decided. I hope this flowing taxonomy helps you navigate the commitments inherent in each design choice without relying on rigid structures to separate the ideas.
