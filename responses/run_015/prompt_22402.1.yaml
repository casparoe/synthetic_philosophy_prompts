prompt: |-
  I cover science and ideas, but I'm stuck on a tiny newroom dispute and I think I'm overthinking it. We have a style rule that says when a politician announces a policy, we should write "the mayor said she will raise the minimum wage," not "the mayor will raise it." A new reporter wrote the latter after a press conference because the mayor's office confirmed it and no one is denying it. I told them we have to keep the "said" because the rule is about attribution. They say the rule is really about not turning claims into facts, and in this case it's already a fact. I can't point to a fact that settles it except our past usage, and they can always say they meant the rule a little differently. Is there a principled way to decide who's right, or is this just two people inventing a rule after the fact?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** Science and ideas journalism (likely high rigor, precision-focused).
      *   **Conflict:** A style dispute between an editor (the user) and a new reporter.
      *   **The Rule:** "When a politician announces a policy, write 'the mayor said she will...' not 'the mayor will...'"
      *   **The Situation:** Mayor announced a policy at a press conference. Mayor's office confirmed it. No denial.
      *   **User's Position:** Stick to the rule strictly (attribution is key).
      *   **Reporter's Position:** The rule is about avoiding claims-as-facts. Since it's confirmed/undisputed, it *is* a fact (or close enough), so "will" is acceptable.
      *   **The Core Question:** Is there a principled way to decide who's right, or are they both just rationalizing post-hoc?

  2.  **Deconstruct the Style Rule:**
      *   *Surface Level:* It's about attribution ("said").
      *   *Deep Level:* It's about epistemic humility and accuracy. What is the *nature* of the event being reported?
      *   *The Event:* A politician *announcing* an intention.
      *   *The Reality:* An announcement is a speech act. The *fact* is that they announced it. The *future action* (raising the wage) is contingent on many things (city council approval, budget, legal challenges, elections, changing minds).
      *   *Journalistic Principle:* Distinguish between *statements of intent* and *events that have occurred*.

  3.  **Evaluate the Arguments:**
      *   **User (Editor):** "We have to keep the 'said' because the rule is about attribution."
          *   *Strength:* Consistency, protects against future embarrassment if the policy doesn't happen.
          *   *Weakness:* Can feel robotic if over-applied to settled matters.
      *   **Reporter:** "The rule is about not turning claims into facts. In this case, it's already a fact."
          *   *Strength:* Reads smoother, acknowledges high confidence.
          *   *Weakness:* Is it *actually* a fact? No. It's a *plan*. Plans change. Even with confirmation, a politician saying "I will do X" is not the same as X happening.

  4.  **Identify the Principled Distinction:**
      *   The core journalistic principle here isn't just "attribution." It's **separating the act of speaking from the act of governing.**
      *   *Fact:* The Mayor announced a plan.
      *   *Projection:* The wage *will* be raised.
      *   *Risk:* If the wage isn't raised (vetoed, delayed, abandoned), the headline "Mayor will raise wage" looks like an error. "Mayor said she will raise wage" remains accurate forever (she did say it).
      *   *Science/Ideas Context:* Since the user covers science/ideas, precision about uncertainty and claims is paramount. This bleeds into political coverage within that beat.

  5.  **Formulate the Advice:**
      *   **Validate the User:** They aren't just making it up. There is a solid journalistic principle behind the rule.
      *   **Validate the Reporter (partially):** Their intuition about "claims vs. facts" is correct, but their application to *future policy* is flawed.
      *   **The "Principled Way":** Focus on **Contingency** and **Agency**.
          *   *Contingency:* Policy announcements are not self-executing. They require legislation, funding, etc.
          *   *Agency:* The journalist reports what was *communicated*, not what will *occur*.
      *   **The "Fact" Check:** Is it a fact that the wage *will* rise? No. It's a fact that the Mayor *wants* it to rise.
      *   **Recommendation:** Stick with "said." It's safer and more accurate. However, explain *why* to the reporter so it's not just "because I said so."
      *   **Nuance:** Acknowledge where the reporter *would* be right (e.g., if the council already voted and it's law).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Acknowledge the frustration. It's a common newsroom debate.
      *   *Core Principle:* Define the difference between a *promise* and an *event*.
      *   *The "Fact" Fallacy:* Explain why the reporter is wrong about it being a "fact." A press conference confirmation is still just an intention.
      *   *The "Science" Angle:* Leverage the user's beat. Science writing is all about distinguishing hypothesis from conclusion. This is similar.
      *   *Actionable Advice:* How to explain this to the reporter without sounding authoritarian.
      *   *Exception Handling:* When *can* you drop the "said"? (When the legislation is passed).

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is the user overthinking?* Maybe slightly, but the principle is sound. I should affirm the principle but suggest a nuanced explanation.
      *   *Is the reporter completely wrong?* They are right about the *spirit* of the rule (don't assert claims as facts), but wrong about the *status* of the policy. I need to make that distinction clear.
      *   *Tone:* Professional, empathetic, authoritative but collaborative.

  8.  **Final Polish:** Ensure the distinction between "reporting the announcement" vs. "reporting the outcome" is crystal clear. (This aligns with the "Map vs. Territory" concept).

  **(Self-Correction Note):** I need to make sure I don't just tell them "You're right." I need to give them the *argument* to win the dispute principledly. The argument is about **temporal accuracy** and **contingency**.

  9.  **Final Structure:**
      1.  Direct answer: You are right, but here's the deeper principle.
      2.  The Core Principle: Statement of Intent vs. Event.
      3.  Why the Reporter is Mistaken: Confirmation $\neq$ Completion.
      4.  The Science/ideas Parallel: Hypothesis vs. Data.
      5.  How to resolve it: Teach the "why," not just the "rule."
      6.  The Exception: When the rule actually changes.

  10. (Proceed to generate output based on this thought process.)
answer: |-
  This is a classic newsroom tension, but you are not overthinking it, and you are not merely inventing a rule after the fact. There is a principled, journalistic distinction here that goes beyond simple attribution.

  You are right to hold the line, but the reporter is right about the *spirit* of the rule (distinguishing claims from facts). They are just misapplying it to the *status* of the policy.

  Here is the principled framework you can use to resolve this dispute without it feeling like "because I'm the editor."

  ### 1. The Core Principle: Statement of Intent vs. Event
  The fundamental journalistic error the reporter is making is conflating a **statement of intent** with an **accomplished fact**.

  *   **The Fact:** The mayor held a press conference and stated an intention to raise the wage. (This is undeniable.)
  *   **The Projection:** The minimum wage *will* be raised. (This is contingent.)

  Even with confirmation from the mayor's office, a policy announcement is not self-executing. It usually requires city council approval, budget allocation, legal review, or implementation timelines. Any of those can stall, change, or kill the policy.

  If you write "The mayor will raise the minimum wage," you are predicting the future. If the council blocks it two weeks later, your story is factually incorrect. If you write "The mayor said she will raise the minimum wage," your story remains accurate forever, because she did indeed say it.

  **The Principle:** Report what *has happened* (the announcement), not what *might happen* (the policy implementation).

  ### 2. The "Science and Ideas" Parallel
  Since you cover science and ideas, use that lens. This is identical to the distinction between a **hypothesis** and a **conclusion**.

  *   If a researcher says, "We believe this drug will cure the disease," you write: "The researcher said the drug will cure the disease."
  *   You do not write: "The drug will cure the disease."

  Even if the researcher is confident, even if the lab is funded, even if no one is denying it yet, it is not a fact until the data exists. A politician's plan is a hypothesis about governance. Until the legislation is passed and signed, it is not data.

  ### 3. Addressing the Reporter's Argument
  The reporter argues: *"The rule is really about not turning claims into facts, and in this case it's already a fact."*

  You can validate their intuition while correcting their application. Tell them:
  > "You are exactly right that the rule is about not turning claims into facts. That is precisely why we need the 'said.' The mayor's confirmation makes the *announcement* a fact, but it does not make the *policy* a fact. Until the city council votes or the law is codified, the wage increase is still a claim, not a reality."

  ### 4. When the Reporter Would Be Right (The Exception)
  To show you aren't being dogmatic, acknowledge when their approach *would* be correct. This builds trust.

  If the city council had already voted, the mayor had already signed the bill, and the law was on the books, then "The minimum wage will rise" is acceptable. At that point, the administrative machinery is engaged, and the outcome is legally binding (barring a court injunction).

  But at the **press conference stage**, it is purely rhetorical.

  ### 5. How to Resolve It
  Don't frame this as a style guide violation. Frame it as an **accuracy and liability issue.**

  **Say this to the reporter:**
  "I agree with you that we shouldn't be robotic about attribution if something is truly settled. But in politics, 'settled' means 'law,' not 'press release.' If we write 'will raise' and the council dilutes the bill next month, we look like we were misled or careless. If we write 'said she will,' we are accurate today and accurate next month. The 'said' protects the reader from assuming the outcome is guaranteed."

  ### Summary
  You are not inventing a rule. You are upholding the distinction between **reporting the news** (the announcement) and **advocating the outcome** (the policy).

  *   **Reporter's view:** Smooths the reading, assumes good faith/stability.
  *   **Your view:** Protects accuracy, acknowledges political contingency.

  In science and ideas journalism, precision about uncertainty is the product. Stick with "said." It is the more rigorous choice.
