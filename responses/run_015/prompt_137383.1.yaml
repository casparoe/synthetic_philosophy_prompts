answer: |-
  1. **Essay Question**

  **Question 4**
  Consider a mechanism of **provisional amnesty**: immunity is granted individually up front, but remains defeasible for a fixed period (e.g., fifteen years). It lapses if (a) the applicant's disclosure is later contradicted by evidence or victim testimony, or (b) the state fails to meet a binding timetable for reparations, vetting, and institutional reform. After the period expires, immunity becomes final.

  Critically evaluate whether this model offers a superior justificatory structure to the standard South African (final immunity for truth) or Argentine (legislative amnesty later repealed) models. Your answer must:

  *   Distinguish three distinct functions amnesty might perform: (i) settling with actors capable of wrecking the transition; (ii) inducing testimony otherwise withheld due to self-incrimination; and (iii) expressing what kind of wrong was committed and what kind of political community is being built.
  *   Analyse how making amnesty provisional shifts the epistemic weight of the process. Specifically, address the concern that testimony bought with immunity is compromised, and that requiring corroboration turns a truth commission into an adjudicator.
  *   Address the standing worry (that the state trades claims not its to trade) alongside the credibility point raised by the Argentine case (if amnesties are repealable, is honesty about provisionality preferable?).
  *   Briefly distinguish this mechanism from the Rwandan *gacaca* model (sentence reduction rather than immunity) and from mere non-prosecution due to institutional incapacity.

  **Note:** You must conclude with a defended position on whether provisional amnesty is morally preferable. Answers that merely recite the trade-off between truth and justice without taking a stance will be capped at 16 marks.

  ***

  2. **Model Answer**

  The proposal for provisional amnesty attempts to navigate the instability of transitional justice by rejecting the false binary between final impunity and immediate prosecution. By making immunity defeasible based on both individual conduct (disclosure accuracy) and state performance (reform timetables), it acknowledges that transitions are processes, not events. While the South African model prioritises finality to secure elite cooperation, and the Argentine trajectory reveals the fragility of legislative forgiveness, provisional amnesty offers a more honest, albeit unstable, justificatory structure. It is morally preferable because it aligns the legal mechanism with the political reality of fragile states, even if it imposes a heavy burden of uncertainty on victims.

  To evaluate this, we must distinguish the jobs amnesty is doing. First, there is the *strategic* job: settling with spoilers who could wreck the transition. Final amnesty secures this best; provisional amnesty leaves elites nervous, potentially incentivising backsliding. Second, there is the *epistemic* job: inducing testimony withheld due to self-incrimination. Here, provisional amnesty is risky. If immunity can be revoked based on later contradictions, rational actors may remain silent, fearing perjury traps. Third, there is the *expressive* job: defining the wrong and the new community. Final amnesty suggests the debt is paid; provisional amnesty expresses that the community's legitimacy depends on ongoing state performance, not just past disclosure. This shifts the focus from the perpetrator's truth to the state's reform, which is normatively superior but politically volatile.

  This shift highlights the epistemic compromise inherent in all amnesty deals. The 'truth for justice' framing assumes the testimony given is reliable. However, testimony bought with immunity is inherently suspect; applicants have an incentive to minimise culpability while meeting the threshold for immunity. The South African model attempts to mitigate this through full disclosure requirements, but without adversarial testing, this is administrative rather than judicial. Provisional amnesty admits this uncertainty by allowing revocation upon contradiction. However, this turns the commission into an adjudicator. If a victim's testimony contradicts the applicant's, the commission must weigh evidence to decide if immunity lapses. This blurs the line between restorative truth-telling and retributive fact-finding, potentially corrupting the epistemic value of the commission's archive. It forces the mechanism to do two incompatible jobs: gathering narrative truth and adjudicating factual accuracy.

  The standing and credibility objections are equally pressing. The standing worry holds that the state cannot trade away victims' claims to justice; only the victim can forgive. Provisional amnesty does not solve this metaphysical problem, but it mitigates the political hypocrisy. The Argentine case demonstrates that legislative amnesties are often pretend-permanent. When political winds shift, courts repeal them, revealing that the state never truly had the authority to grant finality in the first place. If permanence is illusory, provisional amnesty is more honest. It signals to victims that their claims are suspended, not extinguished, contingent on the state earning the right to close the book through reform. This respects the standing worry by acknowledging the state's lack of ultimate authority to forgive on behalf of others, treating the immunity as a pragmatic suspension rather than a moral absolution.

  Distinct from this are models like Rwanda's *gacaca*, which offered sentence reductions for confession rather than amnesty. This is fundamentally different: it maintains the label of criminal guilt and imposes punishment, whereas provisional amnesty still relies on immunity as the baseline. Similarly, mere non-prosecution due to institutional incapacity is a pragmatic admission of failure, not a normative justification. Provisional amnesty claims normative weight; it argues that immunity *should* be conditional, not just that prosecution *cannot* happen.

  Despite these strengths, there is a significant concession to be made regarding the victim's experience. A fifteen-year period of defeasibility leaves victims in a state of limbo. Justice delayed is often justice denied, and the psychological closure required for reconciliation may be impossible while the threat of prosecution hangs over perpetrators but remains contingent on state bureaucracy. If the state fails its reform timetable due to corruption unrelated to the atrocity crimes, victims lose the chance for justice through no fault of the perpetrators. This undermines the expressive function, signaling that victims' rights are bargaining chips for broader institutional reform.

  Furthermore, there is a loose end regarding enforcement. Who adjudicates whether the state has failed its reform timetable? If this is a political question, elites will manipulate it to secure final immunity. If it is a judicial question, courts may lack the capacity to measure institutional reform. Without a clear adjudicator for condition (b), the provisional element risks becoming dead letter, reverting to de facto final amnesty.

  Nevertheless, provisional amnesty is preferable. The Argentine repeal shows that finality is often a lie told to secure peace, which is later exposed to secure legitimacy. Provisional amnesty tells the truth: that justice is contingent on political stability. It forces the state to perform its duties to earn the right to amnesty, rather than granting immunity as a down payment on a transition that may never materialise. While it risks elite cooperation and burdens victims with uncertainty, it avoids the moral hazard of pretending the state has the authority to extinguish claims it cannot morally settle. In a context where transitions are fragile, honesty about provisionality is the only stable foundation for a legitimate political community.

  ***

  3. **Marking Scheme**

  | Band | Marks | What the answer must contain | The characteristic failure that caps it at this band |
  | :--- | :--- | :--- | :--- |
  | **First** | 21–25 | **Forced Choice:** Takes a clear stance for/against provisional amnesty. **Three Jobs:** Clearly distinguishes strategic (spoilers), epistemic (testimony), and expressive (community) functions. **Epistemic Shift:** Analyses how provisionality changes the truth/justice dynamic (corroboration vs. adjudication). **Standing/Credibility:** Addresses state authority to trade claims AND the Argentine honesty argument. **Comparisons:** Distinguishes from Rwanda (punishment vs. immunity) and incapacity. **Critical Edge:** Includes a genuine concession and identifies a structural loose end. | Fails to take a definitive stance (fence-sitting); or treats the three functions of amnesty as interchangeable; or ignores the specific mechanics of the provisional model (e.g. state failure clause). |
  | **2:1** | 16–20 | **Forced Choice:** Takes a stance but justification is thinner. **Three Jobs:** Identifies the functions but may blend strategic and expressive. **Epistemic Shift:** Notes the testimony problem but misses the adjudicator shift. **Standing/Credibility:** Addresses one well (usually standing) but misses the Argentine credibility point. **Comparisons:** Mentions Rwanda or incapacity but lacks precise distinction. | Recites the trade-off cliché without resolving it; or treats the question as a general "transitional justice" essay without engaging the specific provisional mechanism; or fails to distinguish Rwanda/incapacity. |
  | **2:2** | 11–15 | **General Discussion:** Discusses amnesty generally with some reference to the prompt. **Three Jobs:** Mentions truth vs. justice but doesn't distinguish the three specific jobs. **Epistemic Shift:** Vague on epistemic compromise. **Standing/Credibility:** Mentions victims' rights but misses the state authority nuance. **Comparisons:** Omits Rwanda or incapacity distinction. | Descriptive rather than analytical; relies on standard South Africa/Argentina/Rwanda summaries without applying the provisional framework; no forced choice made. |
  | **Fail** | 0–10 | **Irrelevant/Incomplete:** Does not address the provisional amnesty mechanism. **Understanding:** Fundamental misunderstandings of amnesty vs. pardon vs. incapacity. **Structure:** No clear argument or conclusion. | Fails to engage with the prompt's specific definition; purely descriptive history of transitions; or fails to submit a coherent argument. |

