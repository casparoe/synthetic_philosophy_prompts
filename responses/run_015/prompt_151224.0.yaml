answer: |-
  You are absolutely right to be frustrated. "Revolutions devour their children" is a historical cliché (often attributed to Danton, though likely apocryphal) that functions as a conversation stopper. It sounds profound but often masks a lack of specific causal analysis.

  To help you push back constructively, here is a menu of four distinct interpretations of that phrase. For each, I have broken down the specific claim, checked it for tautology, tested it against the falls of Danton (April 1794) and Robespierre (July 1794), and evaluated how it interacts with your "personality politics" hypothesis.

  ### 1. The Institutional Suicide Claim
  **The Precise Claim:** Revolutionary governments are born of emergency (war, civil unrest). To survive, they create emergency institutions (Revolutionary Tribunal, Committee of Public Safety) that suspend normal law. These institutions require a constant supply of "enemies" to justify their existence. Eventually, the supply of external enemies runs low, so the machine turns inward to find internal enemies, consuming the administrators who built the machine.

  *   **Is it a Tautology?** No. This is a functionalist argument. It posits a specific mechanism: *Emergency Powers → Need for Legitimacy → Purging of Creators.* It is falsifiable (a revolution could theoretically demobilize emergency powers).
  *   **Does the Evidence Support It?**
      *   **Danton:** Yes. Danton wanted to "moderate" the Terror (reduce emergency powers). The Committee of Public Safety (CPS) viewed this as disarming the revolution during wartime and executed him.
      *   **Robespierre:** Yes/No. Robespierre fell because he tried to *expand* the emergency powers (Law of 22 Prairial) to purge the Convention itself. The Convention realized *they* were the next fuel for the machine and struck first.
  *   **Compatibility with Personality Politics:** **Compatible.** This view suggests the *structure* created the gun, but personality pulled the trigger. Robespierre's specific rigidity made him willing to use the Law of 22 Prairial; a different leader might have demobilized the Terror earlier. This argument says the *risk* was structural, but the *timing and target* were personal.

  ### 2. The Ideological Purity Spiral Claim
  **The Precise Claim:** Revolutionary legitimacy is based on "Virtue" rather than legal procedure or elections. Virtue is subjective and impossible to prove definitively. Therefore, political rivals cannot debate policy; they must debate moral standing. To win, you must accuse your rival of being less virtuous (a traitor, a moderate, or a tyrant). Since no one is perfectly virtuous, everyone eventually becomes vulnerable to accusation.

  *   **Is it a Tautology?** **High Risk.** If you define "Revolution" as "Rule by Virtue," then yes, it is circular. However, if you treat "Virtue" as a specific rhetorical strategy used by the Jacobins, it is a valid sociological claim about political language.
  *   **Does the Evidence Support It?**
      *   **Danton:** Yes. He wasn't executed for policy errors, but for "moral corruption" (indulgence, financial speculation).
      *   **Robespierre:** Yes. The Thermidorians didn't argue policy; they accused him of wanting to be a "dictator" and violating the virtue of the Republic.
  *   **Compatibility with Personality Politics:** **Highly Compatible.** This reading essentially *is* personality politics weaponized by ideology. Robespierre's personal inability to compromise made him the perfect vessel for this spiral. His personality made the "purity test" lethal. This argument supports your idea that Robespierre's specific character traits accelerated the devouing process.

  ### 3. The Elite Cartel Theory (Power Scarcity)
  **The Precise Claim:** Revolutions concentrate power in a very small group (the CPS, the Commune). In a dictatorship, there is no peaceful mechanism for leadership transition (no elections, no term limits). The only way to change policy or leadership is the physical removal of the rival. Therefore, violence is the only arbiter of disputes within the revolutionary elite.

  *   **Is it a Tautology?** No. This is a standard political science theory regarding authoritarian regimes (similar to selectorate theory). It predicts violence based on the lack of exit ramps for power.
  *   **Does the Evidence Support It?**
      *   **Danton:** Yes. The CPS (Robespierre/Saint-Just) eliminated the Dantonists to maintain their monopoly on power.
      *   **Robespierre:** Yes. The Thermidorian Reaction was a conspiracy by other committee members (Billaud-Varenne, Collot d'Herbois) and the Convention who feared *they* would be purged. It was a preemptive strike by the elite cartel.
  *   **Compatibility with Personality Politics:** **Compatible.** This explains *why* they had to kill each other (no peaceful exit), but personality explains *who* fought whom. Tallien's personal fear of Robespierre (who had a list of names) was the catalyst for Thermidor. Without that personal threat, the structural pressure might not have exploded in July 1794.

  ### 4. The Deterministic/Fatalistic Claim (The Tutor's Likely Default)
  **The Precise Claim:** "Revolution" is a singular force or event that possesses an inherent logic independent of human actors. Once the boundary of law is crossed, the outcome is pre-ordained. Robespierre *had* to die because he was a revolutionary leader, full stop.

  *   **Is it a Tautology?** **Yes.** This is the "No True Scotsman" of history. If a revolution *doesn't* devour its children, this theorist would likely claim "it wasn't a real revolution." It explains nothing because it allows for no counter-examples.
  *   **Does the Evidence Support It?** **Weakly.** It ignores contingency. Robespierre's fall was not inevitable; it relied on specific failures (his illness kept him away from the Committee in his final weeks; his speech on 8 Thermidor was vague enough to unite enemies but not scare them into submission). A different set of personal choices could have prolonged his rule.
  *   **Compatibility with Personality Politics:** **Blocks It.** This is the interpretation you need to fight. If this claim is true, your question about personality politics is meaningless. It renders human agency irrelevant.

  ### How to Use This Menu with Your Tutor

  When your tutor drops the phrase again, try this response:

  > "I agree that the structural pressures of the Terror made violence likely (Menu Item 1 or 3), but I'm worried that saying 'revolutions devour their children' treats the outcome as inevitable (Menu Item 4).
  >
  > If we look at Thermidor, the conspiracy relied heavily on specific personal fears—Tallien fearing the guillotine, Robespierre's refusal to name the deputies he was accusing. If we accept the 'devouring children' line as a total explanation, does that mean we stop analyzing how Robespierre's specific personality flaws turned a structural risk into a specific political defeat?"

  **Summary for your notes:**
  *   **Institutional Logic:** Structure loads the gun. (Compatible with personality)
  *   **Purity Spiral:** Ideology aims the gun. (Compatible with personality)
  *   **Elite Cartel:** Lack of exit ramps forces the trigger pull. (Compatible with personality)
  *   **Determinism:** The gun goes off by magic. (Incompatible with personality; Tautological)

  Your intuition is correct: the phrase is usually a shield against having to do the hard work of distinguishing between *structural necessity* and *contingent human error*. Most modern historians (like Timothy Tackett or Simon Schama, though they differ on conclusions) would argue that while the *risk* of purging was structural, the *specific fall of Robespierre* was deeply rooted in his personality and political miscalculations.
