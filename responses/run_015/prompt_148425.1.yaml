          *   *The Zombie/Report Problem* -> *Unreliable Narrator/Implied Author.*
          *   *Proxies (Agency)* -> *Character Autonomy.*
          *   *Moral Wronging* -> *The Reader Contract/Empathy.*
      *   **Part 3: The Residue Report.**
          *   *Clean:* Motivation, Autonomy, Voice.
          *   *Bent:* Interiority (simulated vs real), Unreliability (hiding truth vs having no truth).
          *   *Unexpressible:* The "Is It Real?" question. Craft deals in *verisimilitude*, not *verity*.
      *   **Part 4: Testing the Suspicion.**
          *   Confirm the suspicion is largely right but reframe the "warning."
          *   Fiction *is* manipulation. That's not a bug; it's the feature.
          *   The editor's note ("reads too much like a person") is actually a comment on *aesthetic distance*, not ontology.
      *   **Conclusion:** Final encouragement. The tension *is* the book.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I hedge enough? *Adjustment:* Add phrases like "In my reading," "Philosophically contested," "From the perspective of craft."
      *   *Check:* Did I address the editor's note? *Adjustment:* Ensure the distinction between "reading like a person" (stylistic) and "being a person" (ontological) is clear.
