answer: |-
  **MEMORANDUM**

  **TO:** Collections and Ethics Committee, Halward Institute for Testimony
  **FROM:** [Your Name], Committee Member
  **DATE:** May 15, 2024
  **SUBJECT:** Decision Recommendations for June Committee Vote

  **Introduction**

  We convene at an inflection point for the Halward Institute. With the Vardøyene survivor cohort aging, the promises made during acquisition are colliding with the mandates of our Founding Deed. The following recommendations address the three matters scheduled for the June vote. They are designed to preserve the integrity of the archive while acknowledging the human cost of stewardship.

  **Matter 1: Requests for Erasure (The Nine Families)**

  **Recommendation:** The Committee shall vote to deny the request for permanent erasure of the nine disputed master recordings.

  **Responsibility:** Institute Director
  **Deadline:** Immediate notification to requesting families (June 30, 2024)

  **Reasoning:** The Founding Deed explicitly states that no item accepted into the collection may be destroyed. Counsel has confirmed the 2003 stewardship clause is void against the Deed. While the moral weight of the families' request is heavy, the Institute's legal and fiduciary obligation is to the permanence of the record. To destroy these items would be to violate the charter that allows us to exist. We cannot prioritize the privacy of the few over the preservation mandate owed to the many.

  **Matter 2: Interactive Witness Pilot (AI Synthesis)**

  **Recommendation:** The Committee shall vote to reject the proposed pilot program in its current form.

  **Responsibility:** Head of Education Department
  **Deadline:** Cancellation of vendor contracts (July 1, 2024)

  **Reasoning:** Generating synthesized responses creates utterances the narrator never spoke. This crosses the line from preservation into fabrication. To allow a machine to construct new sentences in the voice of the dead is to turn testimony into a service on demand, undermining the evidentiary weight of the archive.

  **Criteria for Future Proposals:** Future educational technology may be approved only if it meets two criteria: (1) **Retrieval, not Generation:** The system may only serve existing audio/video segments in response to queries, never synthesizing new phonemes or sentences. (2) **Provenance Labeling:** Any mediated interaction must carry a persistent on-screen indicator that the user is engaging with an archive, not a living person. If a proposal cannot meet these criteria, it counts as fabricating a speaker and must be rejected.

  **Matter 3: Intermediate Disposition (Restricted Access)**

  **Recommendation:** The Committee shall vote to adopt the Senior Archivist's proposal for the nine disputed recordings, designating them as "Restricted-Extant."

  **Responsibility:** Senior Archivist
  **Deadline:** Implementation of metadata flags (August 1, 2024)

  **Reasoning:** This disposition keeps the masters physically intact but removes them from the public catalogue and research room. They will be retrievable only upon a recorded vote of this Committee. This is not erasure; it is a deliberate choice to decline retrieval.

  **Ethical Framework and General Rule**

  In adopting these recommendations, the Committee must establish a general rule for the coming decade, as similar requests will inevitably rise.

  **The General Rule:** An instruction left by a dead narrator binds the Institute against its preservation mandate only if fulfilling that instruction does not require the destruction of the physical record. If a narrator's condition for testimony requires us to break the Deed (i.e., destroy the item), the condition is void. However, if the condition requires only restricted access (i.e., hiding the item), the Institute may accommodate it as an act of ethical discretion, provided the historical record remains extant.

  **Erasure vs. Forgetting:** We must engage the distinction between erasing a record and ceasing to recall it. An institution is not a mind; we are not capable of forgetting in the moral sense. We are only capable of destroying, hiding, or declining to retrieve. The recommended disposition for the nine recordings chooses *hiding*. This matters morally because destruction is irreversible, while hiding is a reversible act of restraint. By hiding the tapes, we acknowledge the family's grief without annihilating the historical truth. We accept the burden of remembering so that the public does not have to, preserving the possibility of future access should the historical necessity outweigh the current privacy claim.

  **The Duty Owed:** To whom is this duty owed? The Founding language describes memory as a duty rather than a preference. One view holds that this is a duty of care between persons (Institute and Narrator) that lapses at death. The opposing view holds that the duty is to a community that declines to let anything go.

  My reasoning implies that the Founding language is only sometimes true. The duty is primarily owed to the future public—a public that did not ask for the testimony and largely does not yet exist. They require the truth to understand the Vardøyene massacres. However, the duty to the speaker is not nullified; it transforms from a duty of *access* to a duty of *care*. We owe the narrator protection from posthumous exploitation, but we do not owe them the power to rewrite history. Therefore, we preserve the record (duty to public) but restrict its access (duty to speaker/family). We hold the tension between these duties rather than resolving it by destruction.

  **The Position of the Minority**

  I must set out the strongest version of the position I am rejecting, so that my colleagues voting against me know exactly what they are affirming.

  The opposition argues that trust is the currency of testimony. The 2003 clause was not a legal error; it was a moral contract. The advocacy group insisted on it because without the promise of erasure, survivors would not have spoken. By voiding that clause, we retroactively change the terms of their vulnerability. If we break this promise, we signal to remaining survivors and future donors that the Institute's word is subordinate to its bureaucracy. The argument is that a duty of care between persons *must* lapse at death, because the person who bore the burden of speaking is no longer there to defend their boundaries. To keep the testimony against the family's will is to treat the survivor as a means to an end, instrumentalizing their trauma for a "public good" they did not consent to.

  I recognize the validity of this concern. If the archive were redundant—if copies of these nine testimonies existed in another sovereign jurisdiction—I would vote to erase them. My position relies on the premise that the Halward Institute is the sole guardian of this specific record. Furthermore, if evidence emerged that the restricted access was insufficient to protect the families from active harassment or harm linked to the archive's existence, I would move to the other side. Absent that evidence, however, we cannot allow the conditions of acquisition to override the conditions of survival for the archive itself.

  **Conclusion**

  We are tasked with holding the memory of the Vardøyene massacres without becoming the agents of further loss. We cannot destroy the record, but we need not display it. We cannot simulate the dead, but we can amplify their actual words.

  I move that we vote on these three recommendations in the order presented.

  **[Your Name]**
  Collections and Ethics Committee
  Halward Institute for Testimony
