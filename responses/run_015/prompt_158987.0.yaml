  Here is the breakdown of the specification, the predictions for your sweepstake, and the test case to isolate the underlying algorithm.

  ### 1. The Underlying Algorithm (The "Spec")

  You hypothesized three rules: **Convergence** (consensus), **Formal Traction** (shared machinery), and **Reframing** (export or dissolution). Based on the ledger's track record, these are not three competing rules but rather branches of a **single decision tree**. The four categories are not independent; they are the terminal states of a state machine evaluating the *dialectical health* of a question.

  **The Decision Tree:**
  1.  **Is the question still being asked by philosophers?**
      *   **No:** Has it been exported to a formal science (math, econ, physics)?
          *   **Yes:** → **'Solved'** (Zeno, Arrow).
          *   **No:** Has the framework collapsed/become indefensible?
              *   **Yes:** → **'Dissolved'** (Verificationism).
              *   **No:** (Theoretically impossible in this schema, but would imply 'Stalled' outside philosophy).
      *   **Yes:** (Philosophers are still working on it).
          *   **Is there shared formal machinery/desiderata?** (Logic, semantics, structural rules).
              *   **Yes:** → **'Genuine Progress'** (Liar, Sorites, Personal Identity). *Note: Consensus is explicitly NOT required here.*
              *   **No:** → **'Stalled'** (Free Will, Moral Realism, Mind-Body). *Note: Literature growth and relabeling do not count.*

  **Key Insight:** The philosopher distinguishes 'Genuine Progress' from 'Stalled' not by *agreement* (Convergence), but by *infrastructure* (Formal Traction). The Liar Paradox is 'Progress' despite no agreement because everyone uses the same logical tools. Free Will is 'Stalled' because compatibilists and incompatibilists talk past each other without shared metrics.

  ### 2. The Predictions

  #### Case A: Grounding and Metaphysical Fundamentality
