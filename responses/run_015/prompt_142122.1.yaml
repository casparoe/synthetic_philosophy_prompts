answer: |-
  **VIVA PREPARATION SHEET: UNCERTAIN EVIDENCE & FRACTIONATED UPTAKE**

  **Candidate:** [Your Name]
  **Date:** [Date]
  **Language:** British English (Strict adherence required)

  ---

  ### PART 1: THE OBJECTIONS
  *Ordered by potential damage to your outcome with this specific committee.*

  **1. The Hardline Bayesian (External 1)**
  *"Let us be plain. If your experience warrants a shift from 0.3 to 0.7, you have learnt a proposition about your experience. If you haven't, you are merely guessing. By introducing $\lambda$, you are admitting you cannot specify the partition. Why should I accept this as a normative rule of rationality rather than a heuristic for confused agents who cannot properly formulate their own state space?"*

  *   **Reply:** I accept that in an idealised God's-eye view, one could conditionalise on a maximally specific proposition about the sensory input. However, the thesis addresses *bounded* agents who cannot articulate that partition without error. Fractionated uptake models the *process* of uptake where the channel reliability is distinct from the signal. It is not a heuristic for confusion, but a norm for situations where the 'proposition about experience' is itself uncertain. It formalises the intuition that one should not fully rigidify against a noisy channel.
  *   **Weakness:** You are conceding that your rule is not for ideal agents. A hardline Bayesian may view this as admitting your rule has no fundamental normative force, only pragmatic utility.

  **2. The Decision Theorist (External 2)**
  *"You claim this minimises a weighted inaccuracy score. But to calculate that score, you must weight the inaccuracy of the channel against the inaccuracy of the hypothesis. Doesn't fixing $\lambda$ in advance require you to know the very reliability you are trying to model? Is this a rule, or merely a family of rules where the agent must magically know the correct attenuation beforehand?"*

  *   **Reply:** It is a family of rules, but the commitment is not to a specific $\lambda$ value *a priori*, but to the *method* of selecting $\lambda$ based on prior calibration of the channel. Just as one commits to Conditionalisation but must supply a likelihood function, here one commits to fractionated uptake and supplies a channel reliability estimate. The accuracy argument shows that *if* you have an estimate of channel noise, this rule outperforms full Jeffrey conditioning.
  *   **Weakness:** If $\lambda$ is subjective, the accuracy argument loses its objective bite. If $\lambda$ is objective, it is unclear how the agent accesses it without circularity.

  **3. The Stats Guy (Curiosity)**
  *"Looking at your equation, $P_{new} = \lambda P_{Jeffrey} + (1-\lambda) P_{old}$. In my department, we call this shrinkage or regularisation. We've used it to prevent overfitting for decades. You've wrapped it in epistemic clothing, but what is the actual philosophical content beyond saying 'don't trust your data too much'?"*

  *   **Reply:** The mathematical isomorphism is intentional and I welcome it. However, the philosophical content lies in the *justification*. In statistics, shrinkage is often justified by frequentist risk or predictive accuracy. Here, I am justifying it via diachronic coherence and the specific nature of *evidential uptake*. The content is the claim that belief revision is not just data processing, but involves a normative stance on how much authority the evidence partition holds over the hypothesis partition.
  *   **Weakness:** It is difficult to deny that the 'philosophical content' is thin if the maths is identical. You risk sounding like you are rebranding standard statistics.

  **4. The Supervisor (Internal)**
  *"I am sympathetic, but you need a story for rigidity. Jeffrey conditioning assumes $P(H|E)$ remains fixed. You relax this. But why linearly? Why not some other function of $\lambda$? Without a mechanistic story for why the mind fractionates uptake this way, it looks like an ad hoc adjustment to get the numbers to behave."*

  *   **Reply:** The linearity is derived from the weighted inaccuracy minimisation, not assumed arbitrarily. It falls out of the optimisation problem when we treat the channel reliability as a weight on the scoring rule. It is not a claim about cognitive mechanics, but about rational commitment. The 'story' is that the agent treats the evidence as a mixture of signal and noise, and the linear mixture reflects the expected utility of trusting the signal versus the prior.
  *   **Weakness:** 'Expected utility' here is doing heavy lifting. If the examiner presses on why the utility function is quadratic (implied by Brier score), you may struggle to justify linearity without circularity.

  **5. The Chair (Philosopher of Science)**
  *"You speak of noisy channels and blurry photos. Have you looked at actual instrument readouts? In a lab, we calibrate instruments to eliminate $\lambda$. We don't say 'the voltmeter is 80% reliable', we fix the voltmeter. Does your model apply to science, or only to casual observation?"*

  *   **Reply:** It applies most strongly where calibration is impossible or incomplete, which is more common in science than we admit. Consider astronomical data or palaeontological records where the 'instrument' is the geological record itself. We cannot recalibrate the past. In these contexts, scientists effectively use a $\lambda$ < 1 when they discount outliers without discarding them. My model makes that implicit practice explicit.
  *   **Weakness:** If you have no concrete case study in the thesis, this is a bluff. They may ask for a specific example from the literature which you haven't analysed.

  **6. The Hardline Bayesian (External 1) — Follow Up**
  *"If you do not conditionalise, you are vulnerable to a Dutch Book. If I know your $\lambda$ is 0.8, I can construct a series of bets you will accept that guarantee a loss. Are you prepared to say rational agents should be vulnerable to sure loss?"*

  *   **Reply:** I am prepared to say that avoiding sure loss is not the only diachronic norm. If the alternative to being Dutch Booked is accepting a highly inaccurate belief state due to overfitting noisy evidence, I argue accuracy trumps coherence in this specific context. However, fractionated uptake dampens the exposure; it does not invite the same magnitude of book as arbitrary updating.
  *   **Weakness:** This is a dangerous concession. Formal epistemologists often view Dutch Book vulnerability as a *reductio ad absurdum*. You are prioritising accuracy over coherence, which is a contentious stance.

  **7. The Decision Theorist (External 2)**
  *"You claim this dampens order dependence. But if I update on E1 with $\lambda$, then E2 with $\lambda$, do I converge to the same belief as E2 then E1? Or do you merely claim the distance between the two outcomes is smaller? If the latter, you haven't solved order dependence, you've just muted it."*

  *   **Reply:** I claim the latter, and I argue that muting it is the best we can do without certainty. Full Jeffrey conditioning is order-dependent. My rule reduces the variance between orderings. In a world of uncertain evidence, demanding strict commutativity is asking for a certainty we do not possess. The norm should be to minimise the divergence, not to eliminate it impossibly.
  *   **Weakness:** You are redefining success. If the committee holds that rationality requires commutativity, you have failed. You need to sell 'minimising divergence' as a virtue in itself.

  **8. The Supervisor (Internal)**
  *"Where does $\lambda$ come from? Is it a property of the agent or the evidence? If I am more confident than you, do I have a higher $\lambda$? If so, isn't this just subjective Bayesianism with an extra parameter?"*

  *   **Reply:** It is a property of the *interface* between agent and evidence. It is subjective in that different agents may assess the channel reliability differently, but it is objective in that there is a fact of the matter about the channel's noise. It is not merely 'confidence'; it is an estimate of the likelihood ratio stability.
  *   **Weakness:** This distinction is slippery. If it's an estimate, it's a credence. If it's a credence, why doesn't *it* update? (See Part 3).

  **9. The Stats Guy (Curiosity)**
  *"If $\lambda$ is close to 0, you never learn. If it's 1, you do Jeffrey. What happens if the evidence is overwhelming? Does your rule allow you to ever reach certainty, or do you asymptote below 1?"*

  *   **Reply:** The rule allows for asymptotic approach to certainty, but never reaches 1 in a single step if $\lambda < 1$. This is a feature, not a bug. It reflects the fallibilist stance that no empirical evidence guarantees truth. If the evidence is overwhelming, repeated updates will drive the credence arbitrarily close to 1, provided $\lambda$ is not zero.
  *   **Weakness:** This contradicts the standard Bayesian idea that one *can* become certain of empirical propositions (even if rarely). You are committing to a strict fallibilism which may not be shared.

  **10. The Hardline Bayesian (External 1)**
  *"Ultimately, this looks like a solution to a problem that shouldn't exist. If you cannot specify the partition, you are not doing probability. You are doing something else. Why should the department award a PhD in epistemology for a model that admits it cannot handle propositions?"*

  *   **Reply:** Because epistemology must account for how agents actually reason, not just how idealised agents reason. The 'proposition' exists, but the agent's access to it is mediated. My model captures the mediation. Ignoring the mediation because it is mathematically inconvenient leaves the theory unable to describe real inference.
  *   **Weakness:** This is a 'pragmatic' defence of a 'normative' project. It may not satisfy a philosopher who believes norms must be ideal.

  ---

  ### PART 2: STRATEGIC CONCESSIONS
  *Do not fight these for forty minutes. Concede them in your opening remarks or early in the defence to disarm the examiner.*

  1.  **To the Stats Guy:** Concede immediately that the mathematics is isomorphic to shrinkage/regularisation.
      *   *Say:* "I am fully aware that this structure mirrors shrinkage estimators in statistics. I do not claim mathematical novelty. My contribution is the epistemic interpretation and the normative justification via accuracy, not the algebra itself."
      *   *Why:* If you fight this, you look ignorant of the literature. If you own it, you look interdisciplinary.

  2.  **To the Hardline Bayesian:** Concede that ideal agents should conditionalise.
      *   *Say:* "I agree that for an agent with perfect access to their experiential partition, Conditionalisation is the norm. My thesis is restricted to agents for whom that access is noisy. I am not proposing this as a replacement for Bayes, but as a correction for non-ideal uptake."
      *   *Why:* It removes the charge that you are 'breaking' Bayesianism. You are merely extending it to non-ideal conditions.

  3.  **To the Chair:** Concede the lack of empirical instrument data *if* your thesis is purely theoretical.
      *   *Say:* "This thesis is a work of formal epistemology, not data science. I have not tested this on lab voltmeters. However, the framework is designed to be applicable there, and I welcome suggestions on how to operationalise it."
      *   *Why:* Do not bluff. If you haven't done the lab work, admit it. Claiming otherwise is academic misconduct.

  ---

  ### PART 3: THE QUESTION YOU HOPE NOBODY ASKS

  **Your Guess:** Whether $\lambda$ itself gets updated (the second-order problem).

  **My Verdict:** **You are correct. This is the nastiest hole in the chapter.**

  **Why it is worse than the Dutch Book objection:**
  The Dutch Book objection is external; you can bite the bullet and say "Accuracy matters more than Coherence." It is a clash of values.
  The $\lambda$ update problem is internal; it suggests your model is **incomplete by its own lights**.

  **The Trap:**
  If $\lambda$ represents the reliability of the channel, and you receive new evidence (the blurry photo), you surely learn something about the reliability of the channel (e.g., "photos from this source are usually blurry").
  1.  **If $\lambda$ is fixed:** You are ignoring evidence about the channel's reliability. This violates the very spirit of Bayesian updating.
  2.  **If $\lambda$ updates:** How does it update?
      *   Does it update by *Fractionated Uptake*? If so, you need a $\lambda_2$ to update $\lambda_1$. This leads to an infinite regress.
      *   Does it update by *Jeffrey Conditioning*? If so, why is the channel reliability treated differently from the hypothesis $H$? Why is rigidity acceptable for $\lambda$ but not for $H$?
      *   Does it update by *Conditionalisation*? If so, why can't you conditionalise on $H$?

  **The Examiner's Phrasing (likely from the Decision Theorist or Supervisor):**
  *"You treat $\lambda$ as a parameter. But $\lambda$ is a credence in the reliability of the evidence. If you receive evidence, surely your credence in the reliability of the source should shift? If you apply your own rule to $\lambda$, do you not require a hyper-parameter? If you don't, aren't you violating the very norm you're proposing?"*

  **How to Prepare:**
  You cannot solve this in three weeks. You must **contain** it.
  *   **Strategy:** Frame $\lambda$ not as a credence that updates, but as a **structural prior** on the learning environment, fixed for the duration of the specific learning sequence.
  *   **Reply:** "In this model, $\lambda$ is treated as a fixed characteristic of the *type* of evidence for the duration of the update sequence, akin to a likelihood function structure. Updating $\lambda$ would require a higher-order model of channel dynamics which is beyond the scope of this thesis. I am modelling a single uptake event, not long-term learning of channel reliability."
  *   **Risk:** They will call this ad hoc. Be prepared to admit this is a limitation for future work. "That is a compelling objection and points to the need for a dynamic $\lambda$ in future iterations. For this thesis, I am isolating the static case to establish the baseline accuracy benefits."

  **Is there something nastier?**
  Only one thing: **The Origin of the Partition.**
  If the Hardline Bayesian presses you on *how* you get the partition $\{E_i\}$ in the first place without conditionalising. If you can't define the $E_i$ without already having a theory of uptake, the whole algebra collapses before you even apply $\lambda$.
  *   *Mitigation:* Stick to the line that the partition is given by the phenomenology of the experience, even if the *weight* given to that partition is uncertain.

  **Final Advice:**
  Keep your answers short. British examiners appreciate brevity and dislike 'waffle'. If you do not know, say "I have not considered that, but it seems significant," rather than bluffing. Good luck.
