answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee (CEC)
  **FROM:** Consent-Forms Working Group
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Re: Isotype-Style Risk Disclosure for Elective Knee Replacement

  **RECOMMENDATION: ADOPT WITH CONDITIONS (HYBRID MODEL)**

  The Working Group recommends **against** adopting the vendor's proposed "picture-only" constraint for the general launch in ten weeks. However, we recommend **adopting the visual Isotype framework conditionally**, provided it is reintegrated with numerical denominators and minimal text anchors. We cannot validate a consent tool where 50% of users cannot identify the higher risk profile, but we also cannot ignore the literacy barriers that render our current text-only forms ineffective for a significant patient cohort.

  **RATIONALE**

  Our pilot data presents a conflict between *recall* and *comprehension*. While patients recalled the pictorial information better after one week, side-by-side testing revealed a critical failure: approximately half of participants could not determine which option carried the higher complication rate. Furthermore, the picture-only format failed to convey the probability of *non-occurrence* or the natural history of the condition without surgery.

  Ethically, informed consent requires comprehension of relative risk, not just memory of icons. The vendor's pitch relies on a specific interpretation of the Vienna Method (Isotype), citing the slogan "words divide, pictures unite." However, our review of the Neurath archives suggests this application contradicts the method's philosophical foundation. Otto and Marie Neurath viewed Isotype not as a universal rebus for one-off transactions, but as a "helping language" requiring a trained "transformer" to mediate between the statistic and the viewer. In the vendor's proposal, the "transformation" is performed by Marketing, and the "mediator" is absent. By restoring numerical anchors, we allow the clinical team to act as the Neurathian "transformer," using the visuals as an aid to explanation rather than a replacement for it.

  **IMPLEMENTATION TIMELINE & CONDITIONS**

  To meet the ten-week go-live target, the following conditions must be met immediately:

  1.  **Redesign (Weeks 1–4):** The visual icons will be retained, but the "no digits/no words" rule is waived. Each risk block must display the icon array *alongside* the numerical frequency (e.g., "1 in 100") and a minimal text descriptor. The "benefit" section must explicitly visualize the "no surgery" trajectory.
  2.  **Staff Training (Weeks 5–8):** Pre-op nursing staff and surgeons must receive brief training on interpreting the charts. This fulfills the Neurathian requirement for a "transformer." The script cannot be marketing-led; it must be clinically vetted.
  3.  **Micro-Pilot (Weeks 5–7):** A rapid follow-up pilot (n=50) will test the *Hybrid* version.
  4.  **CEC Final Review (Week 8):** The Working Group will submit micro-pilot data to the CEC for final go/no-go authorization before the Week 10 launch.

  **CRITERIA TO CHANGE COURSE**

  We will revert to the standard text-based consent form if the Week 7 Micro-Pilot shows:
  *   **Comparative Failure:** More than 20% of participants fail to correctly identify the higher-risk option in a side-by-side comparison.
  *   **Therapeutic Misconception:** More than 15% of participants interpret the benefit visualization as a guarantee of cure rather than a statistical probability.

  **STATEMENT OF THE LOSING ARGUMENT**

  *The case for the "Picture-Only" Format (Vendor/Equity Perspective)*

  The strongest argument against our recommendation comes from the equity imperative. Our current text-based forms are functionally decorative for patients with low English proficiency or low literacy, effectively denying them true informed consent. The "Picture-Only" proponents argue that adding numbers and text reintroduces the very barriers we are trying to dismantle. They contend that the pilot's failure on comparative risk is a failure of *design*, not *concept*, and that abandoning the picture-only constraint capitulates to a system that excludes vulnerable populations. From this view, a visual language should be universal enough to stand alone; requiring numbers privileges the numerate and perpetuates the exclusion of those the Neurath method was originally designed to serve (the working class of 1920s Vienna). To condition the visuals on text is to admit that the pictures failed, rather than admitting our design of them was insufficient.

  ***

  **Next Steps:**
  The Working Group will begin the redesign phase immediately upon CEC acknowledgment of this memo. We will present the Micro-Pilot protocol at the next bi-weekly meeting.
