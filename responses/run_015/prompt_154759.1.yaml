      *   Thirder: $n=1$ awakening. Estimator is unbiased for the Superpopulation proportion of Head-Awakenings.
      *   Halfer: $n=1$ awakening. Estimator (weighted) is unbiased for the Superpopulation proportion of Head-Runs.
      *   This works.

      *(One more check on the "Red" condition)*:
      *   User: "On seeing red both positions should evidently go to probability zero on Heads".
      *   My logic: Red only occurs in T-Tue. So $P(H|Red) = 0$.
      *   Thirder: Frame {H-M, T-M, T-T}. Red = {T-T}. $P(H) = 0$.
      *   Halfer: Weights {H-M:1, T-M:0.5, T-T:0.5}. Red = {T-T}. $P(H) = 0$.
      *   Matches.

      *(Final check on "Self-Weighting")*:
      *   Thirder: Design is self-weighting for Awakenings.
      *   Halfer: Design is self-weighting for Runs (requires weighting awakenings by inverse cluster size).
      *   This is the key insight.

      *(Residue)*:
      *   The "I". In surveys, the estimator doesn't care *who* calculates it. Here, the "I" is the sampling mechanism.
