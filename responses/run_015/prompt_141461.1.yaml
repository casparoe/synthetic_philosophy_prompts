answer: |-
  ### 1. The Scenes

  **Scene One**
  The email from Kellman arrives at 9:14 AM, subject line: *Contract Renewal.* The base retainer is locked—eighty-five percent chance it clears compliance by Friday, putting twenty thousand dollars in the operating account no matter what I do. The only variable is the performance bonus, the remaining fifteen percent. I can take the steady escalator (ninety-five percent chance of sixteen thousand, five percent of fifteen) or the accelerator (fifty percent of twenty-five, fifty percent of eight). I look at the retainer, solid and heavy in my mind's eye. I don't need to be a hero. I click the steady escalator. It's boring, it's safe, and with the retainer secured, boring is exactly what pays the rent.

  **Scene Two**
  The follow-up lands at 2:30 PM, subject line: *Budget Adjustment.* Compliance is still eighty-five percent likely, but the client has slashed the base retainer to three thousand dollars due to "internal reallocation." The performance bonus structure is identical to this morning: the steady escalator or the accelerator. The math on the bonus hasn't moved a millimeter. But now the base retainer feels like a joke, a phantom limb. Three thousand doesn't cover the overhead. The steady escalator won't save the quarter. I click the accelerator. It's reckless, it's volatile, and with the base gutted, reckless is the only thing that leaves me with a business to run.

  ***

  ### 2. The Proof

  **The Structure**
  Let $p = 0.85$ be the probability of the "Common Slice" (the retainer clearing compliance).
  Let $1-p = 0.15$ be the probability of the "Sliver" (the performance bonus).
  Let $C_1 = \$20,000$ (Scene 1 Common Payoff).
  Let $C_2 = \$3,000$ (Scene 2 Common Payoff).
  Let $L_S$ be the "Safe Sliver" lottery: 95% \$16k, 5% \$15k.
  Let $L_R$ be the "Risky Sliver" lottery: 50% \$25k, 50% \$8k.

  **The Choices**
  *   **Scene 1:** Choose between Lottery $A = (p, C_1; 1-p, L_S)$ and Lottery $B = (p, C_1; 1-p, L_R)$.
      *   *Narrator chooses A.*
  *   **Scene 2:** Choose between Lottery $C = (p, C_2; 1-p, L_S)$ and Lottery $D = (p, C_2; 1-p, L_R)$.
      *   *Narrator chooses D.*

  **The Violation**
  Expected Utility (EU) theory states that the utility of a compound lottery is the weighted sum of the utilities of its outcomes.
  $$EU(A) = p \cdot U(C_1) + (1-p) \cdot EU(L_S)$$
  $$EU(B) = p \cdot U(C_1) + (1-p) \cdot EU(L_R)$$

  The narrator prefers $A$ over $B$, so $EU(A) > EU(B)$.
  $$p \cdot U(C_1) + (1-p) \cdot EU(L_S) > p \cdot U(C_1) + (1-p) \cdot EU(L_R)$$

  Subtract $p \cdot U(C_1)$ from both sides (the Common Slice cancels out):
  $$(1-p) \cdot EU(L_S) > (1-p) \cdot EU(L_R)$$
  Divide by $(1-p)$:
  $$EU(L_S) > EU(L_R)$$

  Now look at Scene 2. The narrator prefers $D$ over $C$, so $EU(D) > EU(C)$.
  $$p \cdot U(C_2) + (1-p) \cdot EU(L_R) > p \cdot U(C_2) + (1-p) \cdot EU(L_S)$$

  Subtract $p \cdot U(C_2)$ from both sides:
  $$(1-p) \cdot EU(L_R) > (1-p) \cdot EU(L_S)$$
  Divide by $(1-p)$:
  $$EU(L_R) > EU(L_S)$$

  **Conclusion:** The narrator asserts that $EU(L_S) > EU(L_R)$ and $EU(L_R) > EU(L_S)$ simultaneously. This is a logical contradiction. No utility function $U(x)$—whether risk-averse, risk-seeking, or S-shaped—can satisfy both inequalities. The preference reversal depends entirely on the Common Slice ($C_1$ vs $C_2$), which EU theory demands be irrelevant.

  ***

  ### 3. The Feature Doing the Work

  The mechanism is the **Common Consequence Effect** (the engine of the Allais Paradox), specifically triggered by **Reference Dependence**.

  In Expected Utility theory, wealth is absolute. In your narrator's brain, wealth is relative to a *reference point* established by the Common Slice.
  *   In Scene 1, the \$20k retainer sets a high reference point. She is in the "domain of gains." She protects her win by taking the low-variance sliver.
  *   In Scene 2, the \$3k retainer sets a low reference point. She is in the "domain of losses" relative to her needs. She tries to break even by taking the high-variance sliver.

  **What collapses if you remove it?**
  *   **If the Common Slice paid the same in both scenes:** The reversal disappears. She would make the same choice twice, and the ex-husband has no case.
  *   **If the Common Slice got *better* in Scene 2:** The reversal would feel unnatural. Usually, feeling richer makes people *more* risk-averse, not less. The violation relies on the Common Slice dropping, pushing her from "protecting gains" to "chasing losses."

  ***

  ### 4. The Ex-Husband's Attack

  **The Argument:**
  He should use a **Money Pump (Dutch Book)** argument. If her preferences are intransitive (A > B in context 1, but B > A in context 2), he can construct a series of trades where she pays a fee to switch from A to B, and then pays another fee to switch back from B to A, ending up exactly where she started but with less money. He doesn't need to prove she's wrong about risk; he needs to prove she's vulnerable to exploitation because her logic isn't consistent.

  **The Dialogue:**
  "You're treating the same fifteen percent chance like it's two different currencies just because the background noise changed, and if I were a shark instead of an ex, I'd charge you a fee to swap them back and forth until you couldn't afford the lease."

  ***

  ### 5. Honesty About Weaknesses

  **The "No Certainty" Problem:**
  You are right to worry. The classic Allais Paradox hits harder because it uses a 100% sure thing vs. a 99% chance. The psychological weight of "Certainty" is unique; removing it dulls the emotional spike. In your version, 85% feels like "likely," not "done." A sharp reader might feel the reversal is less visceral because neither option feels truly secure in Scene 1.

  **How I Propped It Up:**
  1.  **High Probability:** I pushed the Common Slice to 85%. It's not 100%, but it's high enough that she treats it as her "baseline reality."
  2.  **Narrative Framing:** In Scene 1, she describes the retainer as "locked" and "solid." In Scene 2, it's a "joke" and a "phantom limb." This subjective framing does the work that the mathematical certainty usually does.
  3.  **The Sliver Gamble:** By making the Safe Sliver *also* a gamble (95/5 split) rather than a fixed number, we strictly meet your constraint, but be aware this dilutes the "Safety" signal. I compensated by making the variance on the Safe Sliver extremely low (\$1k spread) vs the Risky Sliver (\$17k spread).

  **The Risk:**
  The weakest link is that a sophisticated reader might argue her *utility function* actually did change because the marginal utility of money is higher when she has less (Scene 2).
  *   *Counter-argument:* The math proof in Section 2 shows that marginal utility changes apply to the *total* wealth. Since the Common Slice is additive, it shifts total wealth. If she is standard risk-averse (concave utility), having *less* wealth (Scene 2) should make her *more* risk-averse, not less. Her switching to the *riskier* option when poorer is the specific violation that standard EU cannot explain without invoking Prospect Theory (loss aversion). You must trust that the reader accepts "needing to catch up" as a valid emotional state that overrides standard risk calculus.
