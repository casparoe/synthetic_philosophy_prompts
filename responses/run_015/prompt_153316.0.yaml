answer: |-
  # Joint Statement on Consciousness and Access

  **Signatories:** A Defender of Global Workspace Theory and a Defender of the Phenomenal Overflow View

  Following a year of adversarial collaboration, we issue this joint statement. We represent two positions: **Global Workspace Theory** (henceforth Workspace), which holds that phenomenal consciousness coincides with global cognitive access, and the **Phenomenal Overflow View** (henceforth Overflow), which holds that phenomenal consciousness outruns cognitive access. We agree on the following foundations, disagree on specific empirical claims, and identify where our dispute may be merely verbal.

  ## 1. Agreed Claims

  1.  The distinction between phenomenal consciousness (what it is like for the subject) and cognitive access (availability for downstream use) is conceptually coherent and empirically useful.
  2.  Workspace ignition is a real, measurable neural event characterised by late, sustained, and global activity patterns distinct from early sensory processing.
  3.  Workspace ignition is necessary for verbal report, deliberate reasoning, and intentional action planning.
  4.  Subjects consistently report experiencing rich visual scenes, including peripheral details and fringe feelings, which exceeds what they can immediately report; this richness is a datum requiring explanation.
  5.  Standard report-based measures confound the capacity for phenomenology with the capacity for access, limiting their diagnostic power for settling this dispute.
  6.  Early sensory areas retain high-capacity information traces that decay rapidly, regardless of whether these traces are conscious.
  7.  The Workspace side accepts that ignition may be a consequence or correlate of consciousness rather than its constitutive basis.
  8.  The Overflow side accepts that high-capacity sensory buffers may operate entirely without phenomenology.
  9.  Neither party is an eliminativist; both agree consciousness is a natural phenomenon requiring explanation and is not reducible to mere behaviour.
  10. Resolving the dispute requires methods that dissociate neural signatures of content retention from signatures of reportability.

  ## 2. Disagreements Table

  | crux_id | crux | workspace formulation | overflow formulation | agreed bearing test | workspace prediction | overflow prediction | genuine_or_verbal |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | C1 | Is the high-capacity store in Sperling-style tasks phenomenally conscious? | The store is a detailed non-conscious sensory buffer; consciousness requires ignition which decays too fast for late report. | The store is phenomenally conscious; report failure is due to access loss, not lack of experience. | Partial report with cue delays of 100 ms and 500 ms, crossed with a pattern mask and concurrent six-digit load, plus confidence ratings. | Performance and confidence will drop together with delay and load; confidence tracks access. | Confidence will remain high despite report failure under load; confidence tracks phenomenology. | Genuine |
  | C2 | Can report-based measures settle questions about phenomenal consciousness? | No report implies no confirmed consciousness; without access, we cannot verify phenomenology. | Yes, if supplemented by neural decoding; phenomenology can exist without report capacity. | Comparison of report-based accuracy against neural decoding accuracy in no-report paradigms. | Neural decoding will not exceed report-based limits for conscious content. | Neural decoding will reveal conscious content above report-based limits. | Genuine |
  | C3 | Is peripheral/crowded vision rich or gist-based? | Apparent richness is reconstructed from gist; detailed phenomenology requires foveal access. | Peripheral vision is phenomenally rich and determinate despite access failure. | Crowded-flanker display where target identification fails, scored against gist-plus-reconstruction model predictions. | Subject reports will match gist model; determinate jumble is post-hoc reconstruction. | Subject reports will exceed gist model; determinate jumble is perceived. | Genuine |
  | C4 | Does access mean availability for report or any downstream consumer? | Access means availability for report, reasoning, and deliberate action (global broadcast). | Access means availability for any downstream consumer, including motor guidance without report. | Experience-sampling study of absorbed walking with mid-episode probes rather than retrospect. | Subjects will report little conscious detail unless probed to access it. | Subjects will report rich conscious detail even if not previously accessed for report. | Verbal |

  ## 3. Verbal Disputes

  A portion of our disagreement arises from divergent definitions of **access**. The Workspace position defines access strictly as availability for report, reasoning, and deliberate action (global broadcast). The Overflow position sometimes defines access broadly to include any downstream use, such as motor guidance, while reserving **phenomenal** for what-it-is-likeness. If Workspace defines consciousness by global availability and Overflow defines it by local what-it-is-likeness, we may be talking past each other regarding whether consciousness *requires* access. Furthermore, we disagree on whether introspective self-access counts as cognitive access. If introspection is a form of access, then phenomenal consciousness might always be accessed by the subject, rendering the overflow claim false by definition. We agree to treat this as a verbal dispute requiring terminological alignment before empirical adjudication.

