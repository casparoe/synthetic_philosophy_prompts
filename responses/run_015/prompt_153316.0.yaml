  Write the joint statement that a defender of global workspace theory and a defender of the overflow claim — the view that phenomenal consciousness outruns cognitive access — could both sign after a year of good-faith adversarial collaboration. Both accept the access/phenomenal consciousness distinction as worth drawing, both take workspace ignition to be a real and measurable neural event, and neither is an eliminativist about consciousness. Name the two positions; do not cite, footnote, or discuss the literature.

  Give the document three parts.

  1. A numbered section of agreed claims (8–12). Include what both accept about the architecture and its neural signature; what stands in need of explanation, among it the fact that subjects take themselves to see rich scenes — the periphery, the fringes, the staircase walked down while absorbed in thought; what the existing evidence does and does not establish; and which arguments on each side have been overstated. No claim should be of the sort only a bystander would find uncontroversial.

  2. A disagreements table, one row per crux, with columns: crux_id | crux (the sub-question such that settling it would move at least one side) | workspace formulation (wording the workspace side would accept for its own view) | overflow formulation | agreed bearing test | workspace prediction | overflow prediction | genuine_or_verbal. Cover at least these cruxes: whether the high-capacity, briefly retained store that supports Sperling-style partial report is phenomenally conscious or merely a detailed non-conscious sensory buffer; whether report-based measures can in principle settle a question about phenomenal consciousness and, if not, what a no-report or neural-decoding measure would have to show to count; whether the apparent richness of crowded and peripheral vision is perceived or reconstructed from a gist; and whether access means availability to any downstream consumer or specifically availability for report, reasoning and deliberate action.

