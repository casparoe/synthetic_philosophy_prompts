      *   *Precautionary Principle (PP):* Usually defined as "lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures to prevent environmental degradation" (Rio) or "when an activity raises threats of harm... precautionary measures should be taken" (Wingspread).
      *   *The Twist:* The user is right. Standard PP assumes the *status quo* is safe and the *new action* is risky. Here, the *new action* (vaccination) prevents the risk (virus), and the *pause* (return to status quo or slower rollout) introduces risk (virus spread).
