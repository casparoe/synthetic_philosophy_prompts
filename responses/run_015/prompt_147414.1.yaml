answer: |-
  Here is the argument you requested, constructed to be the strongest possible version of the claim that Epistemic Utility Theory (EUT) is merely pragmatism in epistemic costume.

  ***

  ### The Instrumentalist Mask: Why Accuracy-First Epistemology is Pragmatism Redux

  The promise of Epistemic Utility Theory (EUT) is seductive. It claims to liberate Bayesian norms from the grime of practical consequence. Where Dutch Book arguments threatened to reduce rationality to avoiding financial sure-loss, EUT promises to ground Probabilism and Conditionalization in the pure, distinctively epistemic value of accuracy. It claims to offer categorical norms: you *ought* to be probabilistic and you *ought* to conditionalize, full stop, because these are the requirements of epistemic rationality.

  But this is a mirage. When we strip away the technical apparatus of strictly proper scoring rules and look at the logical structure of the vindication, EUT collapses into a sophisticated form of instrumental pragmatism. It does not tell you what to believe; it tells you how to manage the beliefs you happen to have. It offers hypothetical imperatives disguised as categorical ones.

  #### The Diachronic Trap: Self-Ratification and Relativity

  The core of the diachronic accuracy argument (as developed by Greco, Leitgeb, and Pettigrew) relies on the concept of **self-ratification**. A rule is self-ratifying for an agent if, given her current credence function, she expects that following the rule will yield higher accuracy than following any alternative rule. The argument demonstrates that Conditionalization is the unique updating rule that is self-ratifying for a probabilistic agent.

  Read carefully, however, the quantifier scope here is fatal to the categorical claim. The theorem establishes that *relative to a prior $P$*, conditionalizing on $P$ minimizes expected inaccuracy. It proves that if you start at $P$, you should stay loyal to $P$ as you update.

  This renders the norm a hypothetical imperative: *If* you want to maximize accuracy as defined by your current epistemic state, *then* you must conditionalize. But this is no different than saying, "If you want to maximize your bank account as defined by your current investment strategy, you should consistently buy the stocks you currently favor."

  Consider a conspiracy theorist whose prior assigns high probability to the idea that all data is fabricated. EUT validates her conditionalization. If she receives evidence $E$, and her prior dictates that $E$ is likely a fabrication, EUT mandates she lower her confidence in the hypothesis $E$ supposedly supports. She is "epistemically rational" by accuracy-first standards because she is faithfully minimizing expected inaccuracy *relative to her prior*. The theory validates the *consistency* of the trajectory, not the *virtue* of the starting point. It tells her to be accurate by her own lights, which is no more categorical than telling a gambler to be wealthy by his own lights.

  #### The Synchronic Silence

  The accuracy-firster might retreat to the synchronic argument for Probabilism (Joyce's non-pragmatic representation theorem). This argument uses accuracy domination to show that any incoherent credence function is accuracy-dominated by some coherent one. Surely, this is categorical?

  No. The domination argument is a negative filter, not a positive guide. It knocks out the incoherent functions and then falls silent. It leaves the agent with an infinite set of coherent priors, ranging from the empirically grounded to the solipsistic. The normative work in Bayesian epistemology—the work that actually guides inquiry and distinguishes science from superstition—happens in the selection of the prior and the subsequent updating.

  By remaining silent on which coherent prior to adopt, EUT admits that accuracy alone cannot dictate belief. It requires an input. If the output (the normative constraint) depends entirely on an unconstrained input (the prior), the norm is not categorical. It is structural. It says, "Whatever you value epistemically, structure it coherently." This is precisely the structure of pragmatic rationality: "Whatever you desire practically, pursue it consistently."

  #### The Pragmatic Mirror

  The resemblance to old-school pragmatism is exact.
  *   **Pragmatic Vindication:** Rationality is maximizing expected utility. The norm is hypothetical: "Given your desires, act thus."
  *   **Epistemic Vindication:** Rationality is maximizing expected accuracy. The norm is hypothetical: "Given your prior, believe thus."

  In both cases, the theory is agnostic about the source of the input (desires or priors). In both cases, the "ought" is derived from a maximization procedure applied to that input. EUT attempts to hide this by calling accuracy a "constitutive aim" rather than a "desire," but functionally, the logic is identical. It is a theory of *instrumental epistemic rationality*. It tells you how to be an efficient believer, not what a good believer looks like.

  #### The Best Reply: The Constitutive Aim Argument

  The strongest reply available to the accuracy-firster is to attack the distinction between hypothetical and categorical imperatives by appealing to the **Constitutive Aim of Belief**.

  The argument runs as follows: Belief, by its very nature, aims at truth. One cannot believe $P$ while being indifferent to whether $P$ is true. Therefore, valuing accuracy is not a contingent goal an agent chooses (like getting rich); it is a condition of having beliefs at all. Since the goal (accuracy) is non-optional for any believer, the means to that goal (Probabilism and Conditionalization) inherit that non-optionality. The imperative is categorical because you cannot opt out of the aim without opting out of belief itself. Thus, EUT does not say "If you want accuracy..."; it says "Since you *must* aim at accuracy to be a believer, you *must* be probabilistic."

  #### Why The Reply Fails

  This reply is sophisticated, but it fails to plug the hole because it conflates the *goal* with the *metric*.

  Even if we grant that belief constitutively aims at truth (the goal), EUT still requires us to maximize *expected* accuracy (the metric). To calculate an expectation, you need a probability function. The Constitutive Aim Argument establishes that we must care about the truth, but it does not establish *which probability function* correctly tracks the truth.

  The conspiracy theorist also aims at truth. She genuinely believes her prior tracks reality. When EUT tells her to conditionalize, it is because that is the best way to satisfy her aim *given her metric*. The Constitutive Aim Argument cannot force her to adopt a *different* prior without begging the question. To tell her she is wrong, you need a normative principle that ranks priors (e.g., the Principal Principle or a Principle of Indifference). But EUT purports to derive norms *from* accuracy alone, without smuggling in external constraints on priors.

  If EUT relies on the agent's own expectations to determine the norm, it remains trapped within the agent's subjective perspective. You cannot jump outside your own credal state to check if your credal state is the right one using only the tools provided by that state. The "expectation" in "expected accuracy" is always relative to a prior. Therefore, the norm is always relative to a prior.

  Consequently, the Constitutive Aim Argument restores categorical force only to the trivial claim that "believers should try to be accurate." It fails to restore categorical force to the specific Bayesian norms EUT promises to vindicate. It leaves us with the same pragmatic hollow core: a rigorous method for satisfying epistemic goals that refuses to judge the goals themselves. EUT is not a foundation for epistemic normativity; it is a calculus for epistemic consistency. And consistency, without a constraint on the starting point, is no more epistemically categorical than consistency is morally good.
