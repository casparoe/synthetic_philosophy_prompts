answer: |-
  ### Mental Brainstorm: Drawing the Line

  Before we cut into your cases, here are three common ways philosophers try to distinguish therapy from enhancement, and why two of them fail to do the heavy lifting you need:

  1.  **The Statistical Model:** Therapy restores you to the species average; enhancement pushes you above it.
      *   *Verdict:* **Discard.** This is the weakest. If a pandemic lowers the average lung capacity, breathing becomes "enhancement." If everyone takes a smart drug, being smart becomes "therapy." It makes medical status dependent on popularity.
  2.  **The Intent Model:** Therapy aims to cure pathology; enhancement aims to optimize preference.
      *   *Verdict:* Keep as a secondary check, but it's too subjective. A parent might sincerely believe making their child taller is "curing" shortness, even if shortness isn't a disease.
  3.  **The Functional Fit Model:** Therapy secures the minimum functional capacity required to participate in the *current* environment; enhancement provides capacity beyond what the environment demands for standard participation.
      *   *Verdict:* **Keep.** This anchors the definition in the relationship between the organism and its niche, not just biology or statistics.

  ***

  ### The Principle: Functional Environmental Fit

  Here is the principle derived from the strongest model:

  **An intervention is Therapy if it prevents functional obsolescence within the agent's specific socio-biological environment. It is Enhancement if it provides competitive advantage beyond the threshold of standard participation.**

  This principle relies on a **Time-Indexed Norm**. "Normal function" isn't what your ancestors had; it's what your peers need to function as equal agents *now*.

  ### Applying the Principle to Your Cases

  **1. The Cognitive Chip & Myopia**
  Your intuitions here are solid under this principle.
  *   **Broken Memory/Myopia:** Without the intervention, the agent falls below the threshold of standard participation (cannot work, read, navigate). This is **Therapy**.
  *   **Average Memory/20/20 Vision:** The agent already meets the threshold. The chip/glasses provide a surplus capacity (seeing farther, remembering more) that yields a competitive edge, not basic agency. This is **Enhancement**.
  *   *Note:* The tool is identical, but the *status* changes because the *relation to the threshold* changes. You got this right.

  **2. The Depression Drug**
  *   **Subclinical Sadness → Typical Range:** If "typical range" means the emotional baseline required to maintain social bonds and employment without undue suffering, this is **Therapy**.
  *   **Typical → Unusually Cheerful:** This exceeds the requirement for social/functional participation. This is **Enhancement**.
  *   *Note:* This works *only if* "typical emotional range" is a stable target. We will come back to this.

  **3. The Genetic Baseline Reset (The Crunch)**
  *   **The Scenario:** Parents have "historical nutrition deficits" (old baseline). Kid is adjusted to "modern societal average" (new baseline).
  *   **The Conflict:** Is it Therapy (restoring modern norm) or Enhancement (leg up over parents)?
  *   **The Verdict:** Under **Functional Environmental Fit**, this is **Therapy**.
  *   **The Reasoning:** Medical status is not determined by ancestry; it is determined by the environment the child will actually inhabit. If the "modern societal average" represents the cognitive baseline required to function as an equal citizen in the modern world (due to complexity, information load, etc.), then a child with the "old baseline" is functionally obsolete. They would be like a person with 20/100 vision in a world built for 20/20 drivers.
  *   Restoring them to the modern norm prevents obsolescence. The fact that it gives them a "leg up" over their *parents* is irrelevant. Parents are not the reference class for the child's health; the child's *peers and environment* are. To call this enhancement is to argue that children should inherit their parents' functional deficits as a matter of fairness.

  ***

  ### The Break: Which Verdict You Must Drop

  You asked which of your calls breaks under this principle. It is not the Genetic case (which we just resolved); it is your confidence in the **Depression/Sadness** case.

  Here is the inconsistency:

  In the **Genetic Case**, you accepted (or I argued) that the "Norm" is **Dynamic**. The "Modern Average" is higher than the "Historical Average," and meeting the Modern Average counts as Therapy. This admits that **Therapy chases the moving target of societal demand.**

  In the **Depression Case**, you treated the "Typical Emotional Range" as a **Static** biological anchor. You assumed there is a fixed line between "subclinical sadness" and "unusual cheerfulness."

  **The Break:**
  If you accept the Genetic Reset as Therapy because the *environmental demand* has shifted (requiring higher cognition), you must admit that *emotional demands* shift too.
  *   If modern society is more stressful/competitive, the "functional emotional range" might shift.
  *   If the "typical range" moves, then what counts as Therapy moves.
  *   Your distinction between "Therapy (back to typical)" and "Enhancement (unusually cheerful)" assumes "typical" is a fixed biological fact. The Genetic case proves "typical" is a socio-historical construct.

  **The Cost:**
  You must drop the intuition that the **Depression Drug** verdict is stable.
  If the Genetic Reset is Therapy, then "Therapy" is defined by **Functional Fit to Current Society**, not **Restoration of Biological Baseline**.
  Therefore, if society becomes more demanding, treating "subclinical sadness" might shift from Therapy to Enhancement (if the new norm requires higher resilience), OR treating mild sadness might become Therapy even if it was previously considered "normal" (if the new norm requires higher stability).

  You cannot have it both ways. You cannot say the Genetic Norm moves (making the reset Therapy) while the Emotional Norm stays fixed (making the drug verdict stable). **The principle that saves the Genetic case destabilizes the Depression case.**

  **Summary:**
  1.  **Principle:** Functional Environmental Fit (Time-Indexed).
  2.  **Genetic Verdict:** Therapy (prevents obsolescence).
  3.  **Broken Call:** The stability of your "Subclinical Sadness" distinction. It is not a biological fixed point; it is a moving target contingent on societal demands, just like the genetic baseline.
