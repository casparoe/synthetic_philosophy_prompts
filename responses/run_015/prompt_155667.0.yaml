  **MEMORANDUM FOR THE RECORD**

  **TO:** Steering Committee, Department of Anthropological Policy
  **FROM:** Intergenerational Subsistence Reversion Commission (ISRC)
  **DATE:** October 24, 2023
  **SUBJECT:** Feasibility Assessment: Neolithic Reversion Initiative (Phase I)

  **EXECUTIVE SUMMARY**

  The ISRC was convened to evaluate the operational viability of reverting to pre-agricultural subsistence modes, pursuant to literature suggesting the Neolithic transition reduced individual leisure and increased stratification. Our charter mandates the restoration of "Original Affluent Society" conditions—defined here as the maximization of leisure time rather than caloric surplus—while adhering to Section 4(b): *No reduction in current beneficiary headcount.*

  Initial modeling indicates a critical conflict. The "Affluent" forager model relies on low-density resource extraction compatible with approximately 100 million humans globally. Current stakeholders number 8.1 billion. This discrepancy illustrates the demographic ratchet: agricultural surplus facilitated population growth that now precludes a return to surplus-free production. While bioarchaeological data regarding stature, enamel hypoplasia, and anemia suggests a decline in individual biological welfare post-transition, the evidence remains ambiguous regarding survivorship bias. Furthermore, while aggregate welfare increased via total headcount, individual metrics degraded.

  Consequently, the Commission cannot satisfy the leisure-maximization mandate without violating the no-depopulation condition. The transition was not a singular ratification event but a gradual, often reversed process; therefore, no administrative toggle exists to undo it. We must instead address the carrying capacity inertia.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can we simply vote to return to foraging?**
  A: No. The literature confirms there was no single decision to adopt agriculture. It was piecemeal and local. Reversion requires decentralized disengagement, which is logistically incompatible with centralized food provisioning systems.

  **Q: Did foragers enjoy better health and equality?**
  A: Comparative data suggests greater leisure and less hierarchy. However, stakeholders should note that forager egalitarianism included high rates of infanticide and interpersonal violence. These "non-state conflict resolution mechanisms" are difficult to integrate into current liability frameworks.

  **Q: Why not feed everyone on a forager diet?**
  A: Caloric density is insufficient. Farming made individuals worse off but allowed more individuals to exist. Reverting reduces the total welfare capacity unless the number of welfare recipients is adjusted.

  **Q: How does the Commission propose to meet the Section 4(b) constraint?**
  A: Strict adherence is mathematically impossible under current land-use parameters. To achieve reversion without mass starvation, the Commission recommends relaxing the headcount constraint through *demographic rightsizing*.

  **Q: What does demographic rightsizing entail?**
  A: A phased reduction in provisioning eligibility. This includes *voluntary non-provisioning* incentives and strict *Phase II eligibility* criteria for future dependents. This ensures the remaining population enjoys forager-level affluence without violating the spirit of the charter.

  **RECOMMENDATION**

  Proceed to Phase II. Acknowledge that while the Agricultural Revolution may have been a mistake for the individual, correcting it is incompatible with the individual's existence. Prioritize rightsizing.
