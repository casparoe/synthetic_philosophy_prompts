  We point to the apple, call it red
  but the light shifts before the hand
  can touch the surface of the ground.
  Just another label, another token,
  chasing the shadow of a meaning
  without ever finding the cause.

  We look for the lever, the cause,
  but the signal stays strictly red,
  a warning light devoid of meaning.
  It waits for a pulse from the hand
  to swap out the static token
  before it connects to the ground.

  There is no solid ground
  only the chain of cause
  passing the invisible token.
  We map the wavelength of red
  but the sensor is not a hand,
  and the map lacks meaning.

  We ask the system for meaning
  it maps the shifting ground
  latitude waiting for a hand.
  Nothing moves without a cause,
  nothing bleeds except the red
  on the screen, a digital token.

  Spend another symbolic token
  buying a slice of meaning.
  The debt burns bright as red
  but never touches the ground.
  Is there a final cause
  or just the open hand?

  Reach out with the mechanical hand
  to grasp the floating token.
  Is gravity a sufficient cause?
  Does the grip confer meaning?
  Or do we hover above the ground
  seeing everything bathed in red.

  Whether the hand finds ground
  or trades a token for a cause,
  the meaning stays the color red.
