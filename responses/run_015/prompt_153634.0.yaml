      *   **Position:** Defends a "strictly therapeutic interpretation" of Nāgārjuna (often associated with the "Prāsaṅgika" reading, but pushed further towards a non-ontological, anti-metaphysical stance akin to Wittgenstein or Pyrrhonism).
      *   **Task:** Provide an "honest map" of what would *genuinely count against* this reading. Distinguish decisive defeaters from awkward ones. Assess specific risks (nihilism, essentialism). Rank potential defeaters. Identify where the reasoning is most exposed. State what would change my mind and where I am least confident.
      *   **Tone:** Academic, rigorous, nuanced, honest about philosophical limitations. No fluff.

  2.  **Deconstruct the Therapeutic Reading:**
      *   *Core Claim:* Emptiness is not an ontology (nothing exists inherently), but a method to stop conceptual proliferation (*prapañca*).
      *   *Implication:* No positive thesis (*pratijñā*) is held. The tetralemma is exhausted, not resolved into a fifth state.
      *   *Goal:* Peace (*śiva*), cessation of construction.

  3.  **Identify Potential Defeaters (Brainstorming):**
      *   *Textual:* MMK 13.8 ("The victorious ones have said that emptiness is the relinquishing of all views. For whomever emptiness is a view, that one has accomplished nothing."). This supports therapy. BUT, MMK 24.18 ("That which is dependent origination, we call it emptiness..."). This sounds ontological. Also, *Yuktiṣaṣṭikā* or *Vigrahavyāvartanī* might have stronger ontological claims.
      *   *Philosophical (Self-Refutation):* If "all views are empty," is *that* view empty? If yes, why follow it? If no, it's a *svabhāva* claim.
      *   *Two Truths:* If ultimate truth is just the cessation of views, how does it relate to conventional truth without making conventional truth *ultimately* false (nihilism) or *ultimately* real (essentialism)?
      *   *Soteriology:* If there's no ontological correction (seeing things *as they are*), what is the cognitive shift in enlightenment? Is it just psychological calm?
      *   *Comparison:* Pyrrhonian Skepticism. If Madhyamaka is just skepticism, why is it a *Buddhist* path to liberation?

  4.  **Evaluate Defeaters (Ranking & Categorization):**

      *   *Defeater 1: The Self-Undermining Charge (Vigrahavyāvartanī).*
          *   Nāgārjuna explicitly addresses this. If his statement is empty, it doesn't negate anything. If it's not empty, he contradicts himself.
          *   *Therapeutic Response:* It's a pragmatic tool, like a purgative.
          *   *Weakness:* Does this dodge the logical force? If the tool works, it implies a causal structure. Does that structure have *svabhāva*?
          *   *Verdict:* Awkward but manageable *if* one accepts the pragmatic turn. Not decisive unless one demands classical logic.

      *   *Defeater 2: The Ontological Slip in Dependent Origination (MMK 24).*
          *   "Dependent origination is emptiness." This links emptiness to the *nature* of reality (even if that nature is lack of nature).
          *   *Therapeutic Response:* It's a description of how language fails, not how things are.
          *   *Weakness:* Nāgārjuna argues against opponents *because* they misunderstand reality, not just because they are anxious. He claims they are *wrong*.
          *   *Verdict:* **Decisive.** If Nāgārjuna claims opponents are *mistaken* about the world, not just *troubled*, there is an ontological commitment to the correctness of dependent origination.

      *   *Defeater 3: The Two Truths Distinction.*
          *   If ultimate truth is just "no views," then conventional truth is the only truth. But Nāgārjuna says without conventional truth, ultimate truth is not taught.
          *   *Therapeutic Response:* Ultimate is the *limit* of conventional.
          *   *Weakness:* If the therapeutic reading makes ultimate truth purely negative, it risks making the Buddha's teaching (conventional) ultimately false.
          *   *Verdict:* Awkward. Requires careful balancing.

      *   *Defeater 4: Nihilism vs. Essentialism.*
          *   If emptiness is just therapy, does it imply things *do* exist conventionally? Yes. Does it imply they *don't* exist ultimately?
