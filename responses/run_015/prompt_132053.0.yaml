  Your package is robust against classical descriptivist objections but faces fatal exposure from the approximation fork in scientific identity and risks modal redundancy if the derivation thesis eliminates the metaphysical work of necessity.

  (a) **Defeaters and Rankings**
  *   **(1) Rigidity and Reference:**
      *   *Fatal:* Empty names (e.g., "Vulcan") where the causal chain exists but no object does; if the chain anchors to nothing, rigidity is undefined. [Confidence: High]
      *   *Awkward:* Descriptivist clusters (Searle) where reference is fixed by a weighted majority of descriptions rather than a single act. *Defender Concession:* Some descriptions fix reference, but not meaning. *Critic Claim:* If descriptions fix reference, rigidity is de facto, not de jure. [Confidence: High]
  *   **(2) Necessary Identity:**
      *   *Fatal:* Contingent identity arguments (Lewis) where distinct counterparts in other worlds make identity world-relative. [Confidence: Medium]
      *   *Awkward:* Cognitive significance objections (Frege) where Hesperus/Phosphorus differ in sense. *Defender Concession:* Sense differs, reference does not. *Critic Claim:* If sense differs, the necessity is linguistic, not metaphysical. [Confidence: High]
  *   **(3) Derivation Thesis:**
      *   *Fatal:* The conditional "If anchoring obtains, then necessarily a=b" contains empirical concepts (anchoring, identity) and is not strictly a priori. [Confidence: Medium]
      *   *Awkward:* Two-dimensionalist collapse (see b). *Defender Concession:* The conditional maps epistemic to metaphysical intensions. *Critic Claim:* This dissolves the category of necessary a posteriori into contingent primary intensions. [Confidence: High]
  *   **(4) Scientific Identities:**
      *   *Fatal:* Kind eliminativism or multiple realizability (e.g., genes are not unified by DNA structure alone). [Confidence: High]
      *   *Awkward:* Sample impurity (water is never pure H2O). *Defender Concession:* Identities refer to idealized kinds. *Critic Claim:* Idealized kinds do not exist, so identities are false. [Confidence: High]

  (b) **Two-Dimensionalism and the Derivation Thesis**
  Two-dimensionalism (2D) distinguishes the primary intension (epistemic, contingent) from the secondary intension (metaphysical, necessary). Under 2D, "Water = H2O" has a contingent primary intension (could have been XYZ) but a necessary secondary intension (given actual world is @, water is H2O in all worlds). The Derivation Thesis survives this but is reinterpreted: the a priori conditional maps the primary intension to the secondary. [Confidence: High]
  Does it collapse? It does not collapse the necessary a posteriori into the contingent a priori; rather, it locates the contingency in the epistemic mode of presentation and the necessity in the metaphysical content. [Confidence: Medium]
  Is it worth holding? Only if you value distinguishing epistemic access from metaphysical ground. If your psychology suggests modality is redundant once essentialism is granted, 2D confirms that the "necessary a posteriori" is merely a artifact of crossing intensions, reducing the Derivation Thesis to a linguistic mapping rule rather than a metaphysical insight. [Confidence: High]

  (c) **The Approximation Fork**
  The defender is obliged to take the "strict theoretical term" horn: "Water = H2O" is strictly true of the natural kind, even if actual samples are impure. [Confidence: Medium]
  Taking this horn puts fatal pressure on (4) because modern science often eliminates kinds rather than reducing them (e.g., "gene" is a fragmented category). [Confidence: High]
  This bleeds into (1) and (2): if natural kinds do not have strict essences due to approximation, rigid designation for kind terms fails, and the identity becomes either false or contingent. [Confidence: High]
  The "hedged role" horn makes the identity contingent (something else could play the role), which contradicts (2). [Confidence: High]
  You cannot maintain (4) without assuming a realism about natural kinds that current science often undermines. [Confidence: High]

  (d) **Over-Anchored Designator**
  There is no principled answer within the package as to what the term designated; reference is indeterminate. [Confidence: Medium]
  The causal-historical theory lacks a mechanism to prioritize one anchor over another when both are equally authoritative and indistinguishable. [Confidence: High]
  Cost: High. This undermines the determinacy required for (2); if reference is indeterminate, the identity statement lacks a truth value, let alone a necessary one. [Confidence: High]
  You must admit that rigid designation presupposes a determinate causal history, which this case violates. [Confidence: High]

  (e) **Insulation and Qualifications**
  The "exists in world" qualification is load-bearing; without it, necessary identity fails for contingent beings (e.g., Nixon). [Confidence: High]
  The "de jure / de facto" distinction is protective; it insulates the view from descriptivist objections by stipulating how names *should* work rather than how they *do*. [Confidence: Medium]
  Protective qualifications are legitimate only if they clarify pre-theoretic intuitions; if they immunize the view against empirical semantic data (like the approximation fork), they render the view unfalsifiable and theoretically inert. [Confidence: High]
  Your package risks unfalsifiability if (4) is hedged enough to accommodate scientific revision while claiming necessity. [Confidence: High]

  **Psychology and Redundancy**
  Your intuition that modality is redundant is correct if "necessary" adds nothing to "essential." [Confidence: High]
  The word "necessary" marks the metaphysical status of the truth, not the method of discovery; if you have the essentialist claim ("Water is essentially H2O"), the modal claim ("Water is necessarily H2O") is derivative. [Confidence: High]
  The Derivation Thesis makes this explicit, showing that the necessity is a consequence of the anchoring conditions, not an independent modal fact. [Confidence: Medium]

