prompt: |-
  I'm teaching an upper-level undergraduate seminar on social philosophy, and we're spending two weeks on David Lewis's account of convention from his book *Convention: A Philosophical Study* (1969). I'd like to pair the theoretical material with Shirley Jackson's short story "The Lottery" (1948), which I'm assigning as a companion text.

  Lewis argues that conventions are arbitrary but stable regularities that solve recurrent coordination problems: they are self-enforcing because each person has reason to conform given that others do, they could have been otherwise, and they persist through mutual expectation and common knowledge without requiring explicit agreement. Jackson's story depicts a convention — the annual stoning — that seems, on its face, to be maintained through precisely these mechanisms: precedent, mutual expectation, and the sheer inertial weight of "that's how we've always done it." Yet the lottery is a convention that no one can articulate a genuine purpose for, that many participants seem privately uneasy about, and that everyone would presumably be better off abandoning. Old Man Warner's proverb — "Lottery in June, corn be heavy soon" — gestures at a long-forgotten rationale, but the ritual details have eroded over time while the essential violence remains intact.

  I'd like a reading of "The Lottery" through Lewis's theory that takes both seriously and doesn't reduce either to a straw man. Specifically:

  1. Where does the story illustrate Lewis's mechanisms — salience, precedent, common knowledge of mutual expectations — in ways that deepen our understanding of how conventions grip participants? Which scenes or details show Lewisian convention at work?

  2. Where does the story pose genuine problems for Lewis's framework? Can his account explain a convention that persists when the original coordination problem has become opaque to participants, or when the convention is actively harmful and would be rejected if the population could coordinate on an alternative? Does the story suggest that Lewis's picture is too rationalistic — that it misses the way conventions can become ritualized, insulated from the purposes that originally sustained them, and propped up by superstition rather than by mutually recognized interests?

  3. What does the story add to the philosophical debate that Lewis's formal account alone doesn't capture? I want students to see both that Lewis's framework genuinely illuminates the story's logic and that the story forces us to complicate the framework — perhaps by attending to the difference between a convention that is in fact a coordination equilibrium and one that is merely believed to be, or to the role of sanction and fear in maintaining regularities that have ceased to serve anyone's interests.

  I'm not looking for a thematic essay that gestures vaguely at "tradition" or "conformity." I want a reading that engages the specific conceptual architecture of Lewis's account — arbitrariness, coordination equilibria, common knowledge, precedent, salience — and tests it against the specific narrative machinery of Jackson's story: the black box, the slips of paper, the children gathering stones before they fully grasp why, the neighboring village that is talking of giving up the lottery, Old Man Warner's insistence that abandoning it would return them to primitive chaos, and Tessie Hutchinson's protest that the process "wasn't fair" even as she participates in it until the moment it turns against her.
reasoning: |-
  Here's a thinking process that leads to the suggested reading:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar on social philosophy.
      *   **Texts:** David Lewis's *Convention* (1969) and Shirley Jackson's "The Lottery" (1948).
      *   **Goal:** A reading that pairs the two texts seriously, avoiding straw men.
      *   **Key Questions:**
          1.  Where does the story illustrate Lewis's mechanisms (salience, precedent, common knowledge)?
          2.  Where does the story challenge Lewis's framework (opaque purpose, harm, irrationality/superstition vs. rational coordination)?
          3.  What does the story add to the debate (coordination equilibrium vs. believed equilibrium, role of sanction/fear)?
      *   **Constraints:** Avoid vague thematic essays on "tradition/conformity." Engage specific conceptual architecture (arbitrariness, equilibria, common knowledge) and specific narrative details (black box, stones, Old Man Warner, Tessie).

  2.  **Deconstruct Lewis's *Convention*:**
      *   *Definition:* A regularity $R$ in behavior among population $P$ in recurrent situation $S$.
      *   *Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition that* others do (coordination equilibrium).
          4.  There is an alternative regularity $R'$ that could have solved the problem (arbitrariness).
          5.  Common knowledge of 1-4.
      *   *Key Concepts:* Coordination problems (interests align), Salience (focal points), Precedent (past solutions guide future expectations), Arbitrariness (could be otherwise).
      *   *Implicit Assumption:* Conventions are generally beneficial or at least utility-maximizing given the coordination problem. They solve a problem.

  3.  **Deconstruct Jackson's "The Lottery":**
      *   *Plot:* A village gathers for an annual lottery. Heads of households draw. One family is selected. Then family members draw. One person is selected. That person is stoned by the rest.
      *   *Key Details:* Black box (shabby, tradition-bound), slips of paper, children gathering stones (play/violence blend), Old Man Warner (tradition enforcer), Mr. Adams (mentions other villages quitting), Tessie Hutchinson (complains about fairness only when targeted).
      *   *Nature of the Ritual:* Violent, harmful, purpose obscured ("Lottery in June, corn be heavy soon"), persistence despite potential alternatives (neighboring villages).

  4.  **Synthesize: Lewis through Jackson (Question 1):**
      *   *Regularity:* The annual gathering and stoning.
      *   *Expectations:* Everyone shows up. Everyone knows the rules (mostly).
      *   *Precedent:* "There's always been a lottery." The shabby black box represents the weight of precedent.
      *   *Salience:* The date (June 27th), the box, the specific procedure. These are focal points.
      *   *Common Knowledge:* Everyone knows everyone knows. The children gathering stones shows the intergenerational transmission of common knowledge.
      *   *Arbitrariness:* The specific rules have changed (chips of wood to paper, one box vs. two). The *specific* victim is arbitrary (random draw).
      *   *Insight:* Lewis helps explain *how* the village coordinates on the violence. It's not just blind obedience; it's a structured expectation system.

  5.  **Synthesize: Jackson against Lewis (Question 2):**
      *   *Coordination Problem?* Lewis assumes conventions solve a problem where interests align. Here, interests *don't* align with the outcome (death). Is there a coordination problem? Maybe the "problem" is social cohesion or fear of chaos (Warner's view).
      *   *Preference Condition:* Lewis says I prefer to conform *if* others do. Do the villagers prefer to stone Tessie if others do? Most seem uneasy. They conform due to fear/sanction, not because it's a preferred equilibrium *per se*.
      *   *Arbitrariness & Alternatives:* Lewis says conventions could be otherwise. Mr. Adams mentions other villages stopped. So an alternative $R'$ exists. Why don't they switch? Lewis implies rational agents would switch to a better equilibrium. Jackson suggests inertia/superstition blocks this.
      *   *Rationality:* Lewis's agents are rational utility maximizers. Jackson's villagers are bound by ritualized irrationality. The "corn be heavy" rationale is dubious.
      *   *Insight:* Jackson exposes the "dark side" of convention. Lewis describes *functional* conventions. Jackson describes *pathological* ones that mimic the structure of convention but lack the beneficial payoff.

  6.  **Synthesize: What Jackson Adds (Question 3):**
      *   *Believed vs. Actual Equilibrium:* Lewis focuses on actual preferences. Jackson shows a *believed* equilibrium (Warner thinks chaos ensues without it) that might be false.
      *   *Sanction/Fear:* Lewis mentions sanctions but focuses on self-enforcement via interest. Jackson highlights the threat of ostracism or supernatural retribution (bad harvest) as the glue, not mutual benefit.
      *   *The "Fairness" Complaint:* Tessie says "It wasn't fair." She accepts the convention until she loses. This highlights the *conditional* nature of consent in Lewis's theory. She agreed to the *procedure* (convention), just not the *outcome*.
      *   *Intergenerational Transmission:* The children gathering stones. Lewis talks about common knowledge; Jackson shows how it's embodied and taught before it's understood.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the pairing's potency. State the thesis: Lewis explains the *mechanics* of the lottery's persistence, while Jackson exposes the *pathology* of conventions detached from their original coordination function.
      *   *Section 1 (Lewisian Mechanics):* Focus on Precedent (the box), Salience (the date/stones), and Common Knowledge (the procedure). Use specific text evidence.
      *   *Section 2 (The Challenge):* Focus on the Coordination Condition. Is this a coordination equilibrium? Discuss the "harmful convention" problem. Discuss Old Man Warner's rationale vs. Lewis's rationality. Discuss the existence of alternatives (North Village).
      *   *Section 3 (Philosophical Contribution):* Focus on "False Consciousness" of equilibrium. The role of Sanction (social/supernatural). Tessie's protest (procedural vs. substantive agreement).
      *   *Conclusion:* Summarize the pedagogical value. Lewis gives the skeleton; Jackson gives the flesh and blood (and bloodletting).

  8.  **Refining and Polishing:**
      *   *Check Terminology:* Ensure "coordination equilibrium," "common knowledge," "salience," "arbitrariness," and "precedent" are used correctly in the Lewisian sense.
      *   *Check Textual Evidence:* Ensure references to the black box, the chips/paper, Warner's quote, and Tessie's scream are accurate.
      *   *Tone:* Academic, rigorous, suitable for an upper-level seminar guide.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Lewis is wrong." Lewis allows for bad conventions, but his model assumes agents prefer conformity *given* others conform. In the Lottery, do they? Warner does. The others? They conform out of fear/habit. I need to distinguish between *preference to conform* and *compulsion to conform*. Lewis distinguishes conventions from coercive orders. The Lottery blurs this line. That's a key point.

  9.  **Final Review against Prompt:**
      *   Did I answer Q1? Yes (Mechanisms).
      *   Did I answer Q2? Yes (Problems/Challenges).
      *   Did I answer Q3? Yes (Philosophical Additions).
      *   Is it specific? Yes (Black box, stones, Warner, Tessie).
      *   Is it avoiding vague "tradition" talk? Yes, focusing on equilibrium and expectations.

  10. **Final Polish:** (Produces the structured response below).
answer: |-
  This is a compelling pairing. Lewis provides the structural anatomy of social regularities, while Jackson provides a pathological case study that stress-tests the limits of that anatomy. Below is a reading designed for your seminar that engages the specific conceptual architecture of *Convention* against the narrative machinery of "The Lottery."

  ### 1. The Lewisian Mechanics of the Lottery
  Jackson's story is remarkably precise in depicting the *mechanisms* Lewis identifies as necessary for a convention to persist. Even if the *purpose* of the lottery is obscure, the *structure* of the practice is a textbook example of Lewisian convention.

  **Precedent and the Black Box**
  Lewis argues that conventions rely heavily on **precedent**: past solutions to coordination problems become the focal point for future expectations. In the story, the physical artifact of the convention is the black box. It is "shabby," "splintered," and no longer even the original box, yet the villagers refuse to replace it.
  *   **Lewisian Reading:** The box is the material embodiment of precedent. Lewis notes that conventions persist because "we have done it this way before." The villagers' reluctance to make a new box isn't just superstition; it is the preservation of the **salient focal point**. If they made a new box, the salience of the ritual might weaken. The box anchors the mutual expectation that *this* is the object that governs the procedure.

  **Salience and the Stones**
  Lewis discusses **salience** (or "focal points") as features that make one equilibrium stand out from others without communication. The date (June 27th) and the gathering time (10 AM) are salient focal points.
  *   **Lewisian Reading:** Consider the opening scene where the children gather stones. Bobby Martin stuffs his pockets; the other boys soon follow. This is not explicit coercion; it is the transmission of salience. The stones are the "equipment" of the equilibrium. The children recognize the salience of the stones in the context of the gathering before they fully understand the *outcome* of the equilibrium. This illustrates Lewis's point that conventions are often learned behaviorally before they are understood propositionally.

  **Common Knowledge and Procedure**
  For Lewis, a convention requires **common knowledge**: I know the rules, you know the rules, I know that you know, etc. The story depicts a high degree of procedural common knowledge. Mr. Summers knows the steps; the heads of households know when to step forward; the villagers know to stay back until signaled.
  *   **Lewisian Reading:** When Tessie Hutchinson arrives late, she is chided ("Clean forgot what day it was"). This indicates that the temporal coordination is part of the common knowledge required for the equilibrium. The smoothness of the draw (until the very end) demonstrates that the population is successfully coordinating on a regularity $R$. Everyone expects everyone else to draw.

  ### 2. The Challenge: Pathological Equilibria and Rationality
  While the story illustrates Lewis's mechanisms, it simultaneously poses a severe challenge to the *normative* and *rational* assumptions underpinning his account. Lewis defines a convention as a coordination equilibrium where everyone prefers to conform *on the condition that* others conform. "The Lottery" forces us to ask: What happens when the equilibrium is harmful, or when the preference condition is maintained by falsehoods?

  **The Coordination Problem vs. The Harm Problem**
  Lewis assumes conventions solve recurrent coordination problems where interests generally align (e.g., driving on the right side of the road avoids crashes). In "The Lottery," the "problem" being solved is opaque. Old Man Warner cites the rhyme: "Lottery in June, corn be heavy soon."
  *   **The Challenge:** Lewis's model assumes agents are rational utility maximizers. If the convention is a coordination equilibrium, the participants must prefer the outcome of the convention (given others conform) to the outcome of no convention.
      *   *Warner's View:* He believes the alternative to the lottery is a return to chaos ("Living in caves"). For him, the lottery is a genuine coordination equilibrium that solves a survival problem.
      *   *The Reality:* The story implies the harvest is not actually dependent on the sacrifice. If the coordination problem (famine/chaos) is illusory, then the convention is not solving a coordination problem; it is creating a prisoner's dilemma where everyone would be better off if *no one* conformed, but no one dares to deviate unilaterally.
      *   *Lewisian Tension:* Lewis acknowledges conventions can be arbitrary, but he assumes they are *useful*. Jackson presents a convention that is arbitrary and *harmful*. This suggests Lewis's framework needs expansion to account for **parasitic conventions**—regularities that mimic the structure of coordination but rely on collective delusion rather than mutual benefit.

  **The Existence of Alternatives ($R'$)**
  A key condition for Lewis is **arbitrariness**: there must be at least one other possible regularity $R'$ that could have solved the problem. Mr. Adams mentions that "Over in the north village they're talking of giving up the lottery."
  *   **The Challenge:** In Lewis's framework, if an alternative $R'$ (no lottery) yields higher utility, rational agents with common knowledge should be able to coordinate on switching to $R'$. The fact that the village *knows* an alternative exists (other villages quit) but *still* persists suggests that Lewis underestimates the **inertial cost** of breaking precedent. The "cost" here isn't just logistical; it is the fear of social ostracism or supernatural retribution. Lewis's model of rational choice struggles to explain why a population wouldn't coordinate on the superior equilibrium (abolition) once the alternative becomes common knowledge.

  **Rationality vs. Ritualization**
  Lewis treats conventions as tools of rational agency. Jackson depicts the ritual details eroding (the wood chips replaced by paper, the original chant forgotten) while the violence remains.
  *   **The Challenge:** This suggests a decoupling of the convention from the *reasons* that supposedly sustain it. For Lewis, the expectation of conformity is based on the recognition of mutual interest. In the story, the expectation is based on **ritualized inertia**. The villagers don't conform because they recognize a mutual interest in stoning Tessie; they conform because the *form* of the convention has outlasted its *function*. This points to a limitation in Lewis: his account explains how conventions *start* (as solutions to problems) but may be less effective at explaining how they *survive* after the problem vanishes.

  ### 3. What Jackson Adds: Sanction, Fear, and "False" Equilibria
  Assigning "The Lottery" alongside *Convention* allows students to identify specific gaps in Lewis's formal account, specifically regarding the role of sanction and the distinction between actual and believed preferences.

  **Sanction and Coercion vs. Self-Enforcement**
  Lewis distinguishes conventions from coercive orders. Conventions are self-enforcing because it is in my interest to conform if you do. Coercion involves a threat.
  *   **The Complication:** In the story, the line blurs. Is the lottery self-enforcing? When Tessie is selected, she screams, "It isn't fair, it isn't right." The others, including her own family, pick up stones. Are they conforming because they prefer the equilibrium (Lewis), or because they fear being the next target if they refuse (Coercion/Sanction)?
  *   **Philosophical Addition:** Jackson suggests that many social conventions are propped up by **latent sanctions** that Lewis's idealized model minimizes. The "mutual expectation" isn't just "we all want to do this"; it is "we all expect that anyone who *doesn't* do this will be targeted." This adds a layer of **enforcement costs** to Lewis's model. A convention persists not just because it is an equilibrium, but because deviating from the equilibrium is made prohibitively expensive by social or physical violence.

  **Believed vs. Actual Coordination Equilibrium**
  Lewis analyzes conventions based on the agents' preferences. Jackson introduces the possibility of **false consciousness** regarding those preferences.
  *   **The Complication:** Old Man Warner prefers the lottery because he believes it ensures corn growth. If he knew the corn grew regardless, his preference would change. Thus, the village is in a **believed coordination equilibrium**, but not necessarily an **actual** one.
  *   **Philosophical Addition:** This forces students to distinguish between the *objective* conditions of a convention and the *subjective* common knowledge required to sustain it. Lewis requires common knowledge of the preferences. Jackson shows that common knowledge can be built on shared falsehoods. The "common knowledge" in the village is not "we all benefit from this," but "we all believe we might benefit, and we all know we can't risk being the one who doubts."

  **Tessie's Protest: Procedural vs. Substantive Consent**
  Tessie's famous line—"It isn't fair"—comes *after* she is selected. Before that, she participated willingly.
  *   **The Complication:** This illuminates the **conditional preference** in Lewis's account. Lewis says I prefer to conform *given that* others conform. Tessie's behavior confirms this: she preferred to conform (draw her slip) as long as the burden fell on someone else. She only rejected the convention when the equilibrium turned against her.
  *   **Philosophical Addition:** This highlights the moral fragility of Lewisian conventions. A convention can be stable even if individual consent is entirely contingent on not being the "loser" of the coordination. Jackson adds a moral dimension to the stability condition: a convention can be Lewisian-stable (everyone conforms, expectations align) yet morally abhorrent because the "coordination" is essentially a conspiracy of mutual victimization.

  ### Seminar Discussion Questions
  To operationalize this reading in your seminar, you might pose these questions:

  1.  **The Black Box as Precedent:** Lewis argues precedent creates salience. Why does the village refuse to replace the black box even though it is falling apart? Does this support Lewis's view of precedent as a coordination device, or does it suggest precedent can become a fetish that overrides utility?
  2.  **The North Village Alternative:** Mr. Adams mentions other villages are quitting. For Lewis, the existence of a better alternative ($R'$) should allow rational agents to switch. Why doesn't the common knowledge that "other villages quit" trigger a shift in equilibrium in this village? What does this say about the limits of rationality in Lewis's model?
  3.  **Tessie's Scream:** Tessie accepts the convention until she loses. Does this validate Lewis's claim that conventions are based on conditional preferences? Or does it reveal that the "agreement" Lewis describes is morally vacuous if it relies on the exclusion of a victim?
  4.  **Warner's Rationality:** Is Old Man Warner irrational? Or, given his beliefs about the corn, is he the only true Lewisian rational actor in the story? If he is rational, what does that imply about the role of truth in sustaining social conventions?

  ### Conclusion for Students
  Lewis gives us the **skeleton** of the lottery: the rules, the expectations, the regularity, and the arbitrariness. He explains *how* the village is able to act in unison without a dictator. Jackson gives us the **flesh and blood**: the fear, the superstition, and the violence that the skeleton supports. Together, they show that a social practice can be a stable "convention" in the philosophical sense—even meeting Lewis's criteria for common knowledge and equilibrium—while being morally catastrophic. This forces us to ask whether philosophical stability is enough, or whether a theory of convention must also account for the *validity* of the beliefs that sustain the equilibrium.
