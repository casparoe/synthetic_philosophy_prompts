answer: |-
  You have identified a genuine conceptual blind spot. It is not merely that the existing categories are imprecise; it is that the dominant frameworks in ethics, anthropology, and compliance are structurally incapable of seeing this move without pathologising it.

  To answer your first question directly: there is no single, canonical term in English-language philosophy or corruption studies that captures this specific normative structure. The anthropology of the gift is dominated by Mauss, who insists that all gifts create obligation (the *hau* of the gift). Your cases are defined by the *absence* of obligation. Economics reduces it to an inefficient transfer. Compliance regimes reduce it to a latent bribe.

  However, there is a conceptual vocabulary that comes close, and I believe we can construct a precise label from it.

  ### 1. Naming the Phenomenon

  The closest existing concept is the **phatic expression**, borrowed from linguistics (Malinowski, later Jakobson). A phatic utterance ("Lovely day, isn't it?") conveys no information. Its function is not to describe the weather but to establish or maintain a channel of social contact. It says: *I acknowledge you as a interlocutor.*

  Your cases are **Phatic Transfers**.

  Like phatic speech, the transfer conveys no economic content (it does not buy speed, quality, or favour) and creates no debt (it does not oblige a return). Its sole function is to acknowledge the humanity of the role-bearer. It transforms a *functional interface* (citizen–state, client–provider) into a *social relation* (person–person) without collapsing the distinction between the two.

  Why the other candidates fail:

  *   **The Maussian Gift:** As you noted, Mauss argues the gift binds because it demands a return. Your cases are **terminal**. The envelope to the driver is the full stop, not the comma. If the driver buys you a drink in return, the awkwardness returns because the loop has been re-opened.
  *   **The Tip (Gratuity):** A tip is retrospective (reward for quality) or prospective (investment in future service). Your bin men bottle is neither. It is periodic and fixed by convention, not performance.
  *   **The Honorarium:** This implies payment for a service that is nominally free, often professional. It retains too much of the market logic.
  *   **The "Social Lubricant":** In corruption studies, this term is often used for *facilitation payments* (grease money). Those *do* alter outcomes (speeding up a process). Your transfer explicitly forbids this.

  **Proposed Definition:**
  A **Phatic Transfer** is a voluntary provision of value, governed by strict social norms, which serves to recognise the personhood of a service provider without altering the terms, quality, or priority of the service provided. Its value lies in the *refusal* to be instrumental.

  **Boundary Cases: The Surgeon**
  You asked about the large gift to a surgeon after a successful operation. Is this a Phatic Transfer or a bribe in disguise?

  The distinction rests on **publicity** and **proportionality**.
  *   **Phatic Transfer:** A box of chocolates or a bottle of wine, given privately, after the fact. It acknowledges the stress and skill involved without implying the skill was *for sale*. It closes the loop.
  *   **Corrupt Gift (or Latent Bribe):** A large sum of money, or a gift given *before* the procedure, or a gift given publicly.
      *   *Why?* A large gift cannot be "consumed" socially; it retains economic value that demands accounting. A pre-operative gift creates an obligation (the Maussian trap). A public gift signals to *other* patients that this surgeon is accessible via wealth, commodifying the queue for future patients.

  If an official refuses a Phatic Transfer (the bin men bottle), they are not necessarily rejecting corruption. They are likely enforcing a **Sphere Defence** (to borrow Michael Walzer's term). They are asserting that the relationship *must* remain impersonal to ensure equality. However, if they refuse the *category* of Phatic Transfer entirely, they are asserting that the bureaucratic role exhausts the person's moral standing. That is a substantive ethical claim, not merely a compliance one.

  ### 2. Stability and Slippage

  Does the practice slide? Does the "must not change the outcome" norm hold, or is it the thin end of the wedge?

  This is the crux of your corruption project. The standard compliance answer is that it *always* slides. The anthropological answer is that it *never* slides so long as the culture holds. The truth is mechanistic.

  **The Mechanism of Stability**
  The norm is stable only so long as the transfer remains **earmarked** (in Viviana Zelizer's sense). Money and gifts are not neutral; they are socially earmarked. The Christmas bottle is earmarked as "Christmas"; the driver's envelope is earmarked as "hospitality".
  *   **Stability Condition:** The practice remains stable if the timing is fixed (Christmas, end of term) and the value is capped by convention. This removes the agent's discretion. If I cannot give *more* to get *more*, I cannot use the gift to buy influence.
  *   **The Slippage Mechanism:** Slippage occurs when the **earmarking dissolves**. This happens in two ways:
      1.  **Temporal Drift:** The gift moves from *periodic* (Christmas) to *occasional* (whenever I need something). Once it becomes occasional, it becomes transactional.
      2.  **Value Inflation:** The "small" present becomes a "generous" present. Once the value exceeds the threshold of social consumption (a bottle of wine vs. a new television), it re-enters the economic sphere. It can no longer be "consumed" as a gesture; it must be accounted for as assets.

  **The "Wedge" Argument**
  The anti-corruption framework assumes that the *capacity* to corrupt is the same as the *intent* to corrupt. It assumes that because a gift *could* be used to buy influence, it *will* be.
  *   **Where they are right:** In low-trust environments or weak institutional cultures, the normative firewall is porous. A gift given to a customs officer in a high-corruption jurisdiction is rarely phatic; it is an opening bid.
  *   **Where they are wrong:** In high-trust environments (like your school example), the norm is policed by the community (the parents' association). The "sordid" shift you describe happens precisely when a parent breaks the norm (giving early, giving while a grade is pending). The community recognises the slippage immediately.

  **Conclusion on Policy**
  When a university or council bans all gifts outright, they are not preventing corruption; they are **flattening the social ontology**. They are asserting that the only legitimate relationship between citizen and state (or client and provider) is the contractual one.
  *   **The Cost:** This creates the "flatness" you feel with the bin men. It produces a bureaucracy that is technically clean but morally brittle. It removes the space for *gratitude* that is not *payment*.
  *   **The Risk:** The risk is not the Phatic Transfer itself. The risk is the **erosion of the distinction**. If we ban the Phatic Transfer, we do not stop bribery; we simply drive it underground where it lacks the normative constraints of the Phatic. A bribe in an envelope is worse than a bottle on the doorstep because the bribe comes with silence and secrecy, whereas the Phatic Transfer relies on public convention.

  ### Summary for your Volume

  If you need a term to operationalise this in your interdisciplinary work, I recommend **The Phatic Transfer**.

  *   **Definition:** A conventionalised transfer of value that functions to recognise personhood within a bureaucratic relationship without creating an obligation of return or altering service outcomes.
  *   **Key Feature:** The value is in the *refusal* to be instrumental.
  *   **Boundary:** It becomes corruption when it loses its periodicity (becomes occasional) or exceeds the threshold of social consumption (becomes asset-like).
  *   **Policy Implication:** Blanket bans on Phatic Transfers are not neutral; they actively degrade the social fabric that makes impersonal bureaucracy bearable. A better regulatory approach is **transparency and caps** (allow the bottle, ban the cheque; allow Christmas, ban Tuesdays) rather than prohibition.

  This preserves the distinction you are circling: the difference between a move that *buys* a relationship and a move that *acknowledges* one.
