  Hi everyone, here is the decision tree I put together to sort us before the discussion, designed to bypass labels and focus on case judgments. We start with six questions that carve up the logical space without using any theory names. The first question asks whether a single unnoticed dust speck in the eye counts as a harm in itself, distinct from any annoyance it causes, or if it is effectively zero. If you say it is zero, you exit the tree immediately. If you say it is a harm, the second question asks you to compare one person enduring a lifetime of these specks against one person suffering a broken arm, asking which is worse. The third question shifts the distribution, asking whether a billion people each receiving one speck is worse than one person suffering a broken arm. These two questions separate those who think harms add up within a life, across lives, both, or neither. For those who answer that the billion specks are worse in the third question, we add three more branches to refine the view. The fourth question asks whether tiny benefits aggregate in the same way as tiny harms, or if losses loom larger than gains. The fifth question asks whether it matters if the billion mild harms are identical tokens like dust specks versus a varied list of different mild annoyances like hiccups or paper cuts. The sixth question asks what you do when you cannot calculate the sum with confidence, specifically whether you default to preventing the severe harm or the widespread mild harms.

  Now I will walk you through the ten leaves this tree produces, giving each a name, noting its most awkward commitment, and stating what it tells a funder choosing between programs. The first leaf captures those who said a single speck is not a harm at all, whom we might call the Zeroists, whose most awkward commitment is denying that any phenomenological negative exists below the threshold of notice. This tells a funder to ignore the mild discomfort program entirely since multiplying zero by any number remains zero. The second leaf contains those who said specks are harms but chose the broken arm over both the lifetime of specks and the distributed billion, whom we might call the Lexicalists, whose most awkward commitment is ignoring the moral significance of vast numbers of people. This tells a funder to always prioritize the torture prevention program regardless of the scale of the mild discomfort. The third leaf holds those who said the broken arm is worse than the lifetime of specks but better than the distributed billion, a position we might call the Inter-Personal Aggregators, whose most awkward commitment is treating the boundary of a single skin as morally decisive for aggregation. This tells a funder to prioritize the mild discomfort program only when it is spread across many people rather than concentrated. The fourth leaf collects those who said the lifetime of specks is worse than the broken arm but the distributed billion is not, whom we might call the Intra-Personal Aggregators, whose most awkward commitment is caring more about intensity within a life than breadth across lives. This tells a funder to prioritize the mild discomfort program only if the recipients are already suffering many such discomforts individually.

  The remaining six leaves are for those who said the distributed billion specks are worse than the broken arm, meaning they accept full aggregation. The fifth leaf is for those who say harms and benefits sum identically, token identity does not matter, and they default to preventing severe harm under uncertainty, whom we might call the Risk-Averse Aggregators, whose most awkward commitment is accepting aggregation in principle but ignoring it in practice when numbers are fuzzy. This tells a funder to prioritize the torture prevention program whenever the calculation is close or uncertain. The sixth leaf is for those who say harms and benefits sum identically, token identity does not matter, and they default to preventing mild harm under uncertainty, whom we might call the Expected Value Aggregators, whose most awkward commitment is accepting that enough specks justify allowing a torture. This tells a funder to prioritize the mild discomfort program whenever the numbers are astronomical even if the sum is uncertain. The seventh leaf is for those who say harms sum more aggressively than benefits, token identity does not matter, and they default to preventing severe harm, whom we might call the Loss-Averse Aggregators, whose most awkward commitment is holding inconsistent standards for good and bad outcomes. This tells a funder to prioritize the torture prevention program because harms weigh heavier than benefits. The eighth leaf is for those who say harms sum more aggressively than benefits, token identity does not matter, and they default to preventing mild harm, whom we might call the Asymmetric Neutral Aggregators, whose most awkward commitment is justifying why asymmetry does not trigger risk aversion. This tells a funder to prioritize the mild discomfort program but weight the benefits of prevention lower than the harms.

  The ninth leaf is for those who say token identity matters, meaning varied annoyances sum differently than identical specks, whom we might call the Token-Sensitives, whose most awkward commitment is making moral value depend on the variety of experiences rather than their quality. This tells a funder to prioritize the mild discomfort program only if the annoyances are diverse rather than identical. The tenth leaf is for those who accept full aggregation but refuse to choose under uncertainty, whom we might call the Paralyzed Aggregators, whose most awkward commitment is allowing both programs to fail when a decision is required. This tells a funder to maintain the status quo rather than risk choosing the wrong aggregation model.

