answer: |-
  The city wakes and calls it **Spring**,
  counting on every **Return**,
  burying another **Seed**
  along the property **Line**,
  convinced there is no **End**
  but smoke and **Ash**.

  The wall is mostly **Ash**,
  though the calendar says **Spring**.
  We have met the **End**
  of what we counted as **Return**.
  Erase the old **Line**,
  guard the rotten **Seed**.

  This **Seed** drinks deep of **Ash**
  blown in from past the **Line**,
  where men still call it **Spring**
  because they expect no **Return**,
  and see no **End**.

  There is no **End**
  to borrowing the **Seed**,
  pretending each **Return**
  is fresh and not old **Ash**.
  We name this **Spring**
  because we lost the **Line**.

  Cross the **Line**,
  meet the **End**,
  make a new **Spring**
  from the old **Seed**,
  carry the **Ash**
  as the only **Return**.

  They wait for the **Return**,
  redraw the **Line**,
  sweep up the **Ash**,
  promise no **End**,
  bury the **Seed**,
  and claim it's **Spring**.

  If this is **Spring**, **Return**
  the **Seed** across the **Line**;
  the **End** is not **Ash**.

  ***

  The poem sides with Toynbee, suggesting the cycle can become a vehicle for linear survival, but only if the "seed" is actively moved across the boundary rather than buried in place. Your reading of Toynbee is slightly off, however: he argues the linear outcome isn't a secular cart moving forward, but a spiritual chrysalis (the Universal Church) surviving the petrified state.
