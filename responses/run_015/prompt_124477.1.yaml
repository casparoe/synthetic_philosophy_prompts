  I've been arguing with my roommate about Szasz and whether mental illness is mostly a myth, and she tried to map out what she takes to be his rulings across different cases. She says schizophrenia with hallucinations and disorganized speech isn't a literal brain disease but a problem in living; epilepsy is a real neurological disorder but not a psychiatric mental illness in the stigmatizing sense; alcoholism isn't a disease at all, just a pattern of choice and habit; homosexuality being listed in the old DSM was pure social control with no medical basis; and PTSD in soldiers returning from war is a normal human reaction, not an illness. But then she also said that severe OCD with contamination rituals probably counts as a real mental disorder, since the person genuinely can't stop the intrusive thoughts even though they want to, and it's not just social deviance being medicalized.

  Now there's this proposed diagnosis being floated for the next DSM revision, chronic interpersonal betrayal syndrome (CIBS), defined as a lasting collapse of trust and social engagement lasting over six months after a specific, documented betrayal by an intimate partner, with no other symptoms like hallucinations or mood swings, and it's meant to be distinct from depression or PTSD. Do you think she'll classify CIBS as a mental illness or reject it? I'm less interested in the bare answer than in the rule she's actually running—maybe it's about involuntary suffering versus chosen behavior, maybe it's about whether there's an identifiable brain lesion, maybe it's about whether the condition medicalizes social failure—and I want you to lay out the competing rules that fit her prior verdicts, say what each predicts for CIBS, and tell me which further case would actually split them apart. Also, if you had to recommend a verdict that keeps her consistent with her own track record, what's the closest analog and what principle is she really adopting either way? Sorry if this is convoluted, I'm writing it betwen classes and my brain is frid.
