answer: |-
  Notes-to-self: What is the real question here? You are asking whether diagnosis can survive its success, but that presupposes diagnosis is a single thing with a single goal. It isn't. It is a hybrid entity serving epistemic functions (tracking truth about suffering) and deontic functions (granting access to resources). The tension isn't just scientific; it's institutional. You might be asking the wrong question by assuming the "success" is scientific validity. The system is succeeding perfectly at its actual design specification: rationing care via categorization. The real philosophical puzzle is whether a category can remain scientifically coherent when its primary selection pressure is administrative utility. Also, be careful with "loop capture." It sounds like Goodhart's Law met Hacking's looping effects. Distinguish between the patient changing their identity (looping) and the population changing its composition to fit the code (capture).

  You are also circling a category mistake. You treat the diagnosis as if it claims to be a natural kind (like a virus) while acting like a social kind (like "citizen"). The practice doesn't necessarily presuppose disorders are discrete natural kinds; it presupposes they are *actionable* kinds. The inconsistency you feel—between "in the person" and "depends on your job"—isn't a bug, it's a feature of a system trying to bridge biology and sociology without admitting it. If you frame the piece as "diagnosis is broken," you miss the point. The piece should be: "Diagnosis is doing too many jobs, and the friction is becoming visible."

  ***

  To understand whether psychiatric diagnosis can survive its own success, we must first dismantle the idea that "diagnosis" is a unified scientific instrument. In your description, the diagnosis operates simultaneously as a clinical hypothesis, an insurance claim, a legal credential, and a identity marker. Philosophically, this is a category error waiting to collapse. When you ask if the practice presupposes disorders are discrete, stable dysfunctions, the answer is nuanced: the *insurance* logic requires them to be stable and discrete (binary eligibility), while the *clinical* logic (specifically the impairment clause) admits they are relational and contextual. The system holds these contradictory ontologies together through pragmatic hypocrisy. It treats the disorder as internal when billing, and relational when assessing need. This isn't necessarily incoherent practice, but it is ontologically unstable.

  The implicit theory of mental disorder required to make this gatekeeping work is what I would call "Functional Realism." It does not require disorders to be natural kinds in the strict sense (like gold or electrons). It only requires them to be stable enough to justify budget allocation and distinct enough to prevent total overlap. The practice rules out pure social constructivism (because then there is nothing to treat) and strict biological essentialism (because the impairment clause admits environmental context). It occupies a muddy middle ground where the disorder is real enough to cost money but flexible enough to fit the patient's life. This is why the "in the person" vs. "depends on your job" tension feels so puzzling. You are looking for ontological consistency in a system designed for bureaucratic feasibility. The system doesn't care if the disorder is strictly inside you; it cares if the *impairment* is documentable.

  Regarding your concept of "loop capture": this is a coherent and vital distinction. Ian Hacking's "looping effects" describe how classifying people changes their self-conception, which changes the class itself. Your "loop capture" describes how administrative incentives change the population's reporting behavior, which changes the statistics. They are different mechanisms. Hacking's looping is about identity; yours is about access. The diagnostic practice actually *presupposes* a limited form of looping—it hopes the patient accepts the label to engage in treatment—but it fears "capture," where the label is accepted only to unlock resources. The auto-suggest tool you mention exacerbates this. It creates a cybernetic loop where the classification system trains itself on its own administrative outputs rather than clinical reality. This risks decoupling the code from the suffering entirely.

  Does the practice presuppose kinds are inert or efficacious? It needs them to be efficacious for treatment (the label helps heal) but inert for verification (the label describes a pre-existing fact). This is the core contradiction. If the diagnosis changes the patient (efficacious), then the pre-diagnostic baseline is unreachable, making validation impossible. If the diagnosis is inert, it lacks the therapeutic power clinicians claim. The system rides this paradox by ignoring the timing. It assumes the disorder existed before the label (for insurance) but only becomes manageable after the label (for therapy).

  Finally, could a dimensional system replace the categorical code? Only if you still draw a line. Gatekeeping requires a threshold. Whether you say "you have Major Depression" or "your depression score is 18/27," someone must decide that 17/27 gets no funding and 18/27 gets full funding. A dimensional system might reduce the stigma of the binary "have/have-not," but it cannot solve the resource allocation problem without reintroducing a categorical cut-off. The friction you are observing isn't about categories vs. spectra; it's about the collision between continuous human suffering and discrete resource buckets. Diagnosis cannot survive its success if "success" means perfect scientific validity, because the administrative tail is wagging the scientific dog. But it can survive if we admit it is a socio-technical tool for distribution, not just a mirror of nature.

