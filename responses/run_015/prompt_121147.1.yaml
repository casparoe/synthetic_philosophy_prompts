  I am a software engineer with no formal background in philosophy, and during a recent architecture review with colleagues we drifted into a debate about whether modern forecasting systems could eventually predict macro-historical trends at scale. One colleague mentioned Karl Popper’s argument—the “poverty of historicism”—that history lacks discoverable laws because the growth of human knowledge is inherently unpredictable and thereby alters the very conditions any law would need to hold constant. I found the reasoning compelling, but I am struggling to locate the precise boundary between a legitimate predictive model and a historicist fallacy, particularly now that feedback loops and self-updating algorithms routinely change the behaviors they attempt to forecast.

