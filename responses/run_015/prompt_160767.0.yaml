answer: |-
  This is a sophisticated stalemate, and your hunch is correct: you are not fighting one battle, but three that have been conflated under the label "integrity." The reason the seminar room splits and the work-in-progress group stalls is not because the arguments are weak, but because the interlocutors are operating with incommensurable descriptions of the *location* of the moral problem.

  Here is the diagnosis, stripped of literature review, focusing on the structural commitments of each side.

  ### 1. The Diagnosis: Three Layers, One Label

  You are right that there are three disputes stacked here, but they are not merely parallel; they are hierarchical. The stalemate persists because the Consequentialist is arguing at Layer 1, while the Williamsian is arguing at Layer 3, and both think they are addressing the same claim.

  **Layer 1: The Metaphysics of Reasons (Agent-Relative vs. Agent-Neutral)**
  *   **The Dispute:** Are there reasons that exist only *for me* simply in virtue of being me, which cannot be translated into agent-neutral value?
  *   **The Stalemate:** This is substantive, but it is not where the heat is. A sophisticated consequentialist can grant agent-relative *permissions* (via indirect utilitarianism or rules of thumb) without granting agent-relative *requirements* that block optimization.
  *   **Verdict:** This strand is arguable, but it is not the engine of the impasse. The Consequentialist in your group already concedes the phenomenology; they don't need to deny agent-relative *feelings*, only agent-relative *normativity*.

  **Layer 2: The Metaphysics of the Self (Attachment vs. Constitution)**
  *   **The Dispute:** Your grad student's point is the sharpest instrument in the room. Is a "project" something the agent *has* (a deep attachment) or something the agent *is* (identity-conferral)?
  *   **The Commitments:**
      *   **Consequentialist:** The self is a container of satisfactions. Projects are contents. If the content is removed or swapped for a greater good, the container remains intact to experience the new outcome. Integrity is the psychological friction of swapping contents.
      *   **Williamsian:** The self is constituted by its projects. To remove the project is not to swap a content; it is to dissolve the container. Integrity is not a feeling; it is the structural integrity of the agent.
  *   **Verdict:** This bottoms out in intuition. There is no neutral arbitration between "self as container" and "self as constitution." However, this is where the real disagreement lives. The Consequentialist treats the "betrayal" feeling as a *cost* (like pain); the Williamsian treats it as a *category error* (like a logical contradiction).

  **Layer 3: The Locus of Evaluation (Criteria of Rightness vs. Deliberative Standpoint)**
  *   **The Dispute:** Is moral theory about judging the *act* from the outside, or guiding the *agent* from the inside?
  *   **The Commitments:**
      *   **Consequentialist:** Moral theory provides the *criterion of rightness*. Deliberation is a heuristic tool. If the criterion says "maximize," but the heuristic says "save your wife," and the result is optimal, the theory is vindicated.
      *   **Williamsian:** Moral theory must account for the *deliberative standpoint*. If the criterion requires a thought process that alienates the agent from the action (the "one thought too many"), the theory has failed, regardless of the output.
  *   **Verdict:** This is the source of the "Outsourcing Test" disagreement.

  ### 2. The Outsourcing Test as a Revealer

  Your outsourcing test (institutional discharge of impersonal demands) is excellent because it forces the layers apart.

  *   **Why the Consequentialist says "Objection Dissolved":** They are looking at Layer 1 (Outcomes/Reasons). If the optimal outcome is achieved via institutions, allowing the agent to pursue personal projects, the *criterion of rightness* is satisfied. The alienation is removed because the impersonal demand is no longer pressing on the individual deliberative moment.
  *   **Why the Williamsian says "Objection Intact":** They are looking at Layer 3 (Deliberative Standpoint). Even if I outsource the maximizing, I must still *endorse* the outsourcing. I must still view my personal life as a "leisure sphere" permitted only because the institution handles the real moral work. I am still alienated from my own agency because my agency is now *delegated*. I am no longer the author of my moral life; I am a subcontractor.

  **Diagnosis:** The dispute is **people answering different questions under one name.**
  *   The Consequentialist asks: "Can the agent produce the right state of affairs without psychological breakdown?"
  *   The Williamsian asks: "Can the agent recognize themselves in the justification of their action?"

  ### 3. Do These Strands Bottom Out?

  Yes. Honestly, they do.

  The core incompatibility is the **Normative Significance of the First-Personal Standpoint.**
  *   **Consequentialist Intuition:** The first-personal standpoint is epistemically privileged (I know my motives best) but normatively transparent. The "I" should not matter morally any more than the "you" or the "they." Any weight given to the "I" is bias.
  *   **Williamsian Intuition:** The first-personal standpoint is normatively constitutive. There is no "action" without an "actor." If the theory requires the actor to vanish into a neutral conduit of value, there is no action, only event-causation happening through a body.

  You cannot argue someone out of this without arguing them out of a conception of agency. If your Consequentialist colleague believes the "self" is ultimately a fiction or a locus of value rather than a source of value, Williams cannot touch them. If your Williamsian colleague believes that morality must be *lived* from the inside to be morality at all, Consequentialism will always look like a description of a hive mind.

  ### 4. What Counts as Progress?

  Do not conclude the question is ill-posed. It is precisely posed, but it is a *knot*, not a *line*. Pulling harder tightens it. Progress requires disentangling the strands you identified.

  **A. Stop Trying to Solve "Integrity"**
  Treat "The Integrity Objection" as a historical label for a cluster of problems, not a single problem. Declare in the seminar and the group that you are disaggregating the objection.

  **B. Focus on the "Constitution vs. Container" Distinction (Layer 2)**
  This is your most fertile ground for a paper or seminar module.
  *   **Progress Move:** Ask the Consequentialist to model "Identity-Conferral" formally. If a project is constitutive, removing it changes the utility function of the *agent*, not just the outcome.
  *   **The Challenge:** Can Consequentialism accommodate *constitutive aims* without collapsing into a deontology of the self? If the Consequentialist says "Yes, we value identity stability instrumentally," press them on the *Jim and the Indians* case. If Jim shoots one to save nineteen, does he remain the *same agent* who can enjoy the future utility? If Williams is right, the Jim who shoots is not the Jim who benefits.
  *   **Result:** This forces the Consequentialist to either accept a fragmented self (which undermines the unity required for aggregation) or concede that some projects are lexically prior to optimization.

  **C. Formalize the Criterion/Deliberation Split (Layer 3)**
  *   **Progress Move:** Explicitly grant the Consequentialist the *Criterion of Rightness* but challenge them on the *Decision Procedure*.
  *   **The Shift:** Admit that Utilitarianism might be *true* (as a standard of judgment) but *unlivable* (as a guide to deliberation).
  *   **The Question:** If a moral theory cannot be adopted as a deliberative stance without self-alienation, is it a moral theory for *humans*? This shifts the debate from Metaethics to Moral Psychology. It forces the Consequentialist to defend the claim that "True but Unlivable" is a coherent category for a practical philosophy.

  **D. Reframe the Outsourcing Test as Political Philosophy**
  *   **Progress Move:** Accept your political philosophy colleague's point. The Outsourcing Test shows that the Integrity Objection is actually a critique of the *Division of Moral Labor*.
  *   **The Result:** You concede that Individual Consequentialism fails the integrity test, but Institutional Consequentialism might pass it.
  *   **The Cost:** This admits that Utilitarianism cannot be a comprehensive ethics of individual life; it must be a political theory that carves out a "private sphere" by fiat. This is a massive concession for the Consequentialist (it looks like Rule Utilitarianism or Liberalism) and a victory for the Williamsian (it admits the personal is not fully subsumable by the impersonal).

  ### 5. Final Recommendation

  Three years is exactly the right amount of time to have spent on this if you were trying to solve it as a single unit. You should not expect to resolve it.

  **For the Seminar:**
  Teach the disaggregation. Show the students that "Integrity" is a Rorschach test. Ask them: "When Williams says integrity, does he mean (a) don't violate your deep attachments, (b) don't violate your constitutive projects, or (c) don't adopt a deliberative standpoint that makes you a stranger to yourself?" Let the class see that the Consequentialist can answer (a), struggles with (b), and fails (c).

  **For the Work-in-Progress:**
  Pivot. Do not write "A Defense of Williams Against Consequentialism." Write **"The Metaphysics of the Agent in the Integrity Objection."**
  Focus entirely on Layer 2 (Identity-Conferral). Argue that the stalemate exists because Consequentialism lacks a theory of the *constituted self*. The progress isn't proving Williams right; it's proving that the debate stalls *because* Consequentialism treats the self as a container. If you can demonstrate that the "Container Self" is insufficient to explain the phenomenology of agency even *outside* of morality (e.g., in rational choice or practical identity), you undermine the Consequentialist's metaphysical footing without needing to defeat their moral arithmetic.

  The question is not ill-posed, but the expectation that it yields a binary "Win/Loss" is. The progress lies in mapping the incommensurability.
