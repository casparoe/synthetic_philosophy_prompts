prompt: |-
  I was arguing with my freind about whether there's a real difference between reasons that justify something and reasons that actually move you — like if you only help someone because it makes you feel good, is your kindness fake? That led me to the wrong-kind-of-reasons problem in philosophy, especially around belief and love, and I want a story that gets into the weeds without turning into a lecture.

  Write a short story about Mara, a junior technician at a near-future clinic called the Alignment Office, where clients pay to have there cognitive reasons mapped into separate "justifying tracks" and "motivational tracks." Mara specializes in affective alignment — she helps people see if their commitments are running on the right kind of fuel. One Tuesday she gets two clients back-to-back: an older woman who wants to keep believing in an afterlife despite having only pragmatic reasons (it keeps despair away), and a young man who realizes he cares for his partner mainly because she solves practical problems for him. As Mara works, she starts scanning her own reasons for staying in the job and for living with her roommate, who she's been with for years mostly out of habit and shared rent. The story should show the tension through the clinic's procedures and Mara's observations — body language, the way clients hesitate when describing "wrong kind" reasons, the machinery's hum — rather than through speeches. Keep the sci-fi elements minimal and grounded. For the ending, leave it ambiguous: either Mara decides that instrumental reasons are all anyone ever has, or she notices her own reasons quietly shifting category without her consent.

  Please structure your answer like this:

  The story: about 900-1100 words, weaving Mara's professional work with her personal crisis.

  Commentary on the choices made: about 250 words, explaining where you deployed the wrong-kind distinction (belief, love, professional motivation), what liberties you took with the philosophical idea, and whether your ending resolves the problem or sidesteps it.
