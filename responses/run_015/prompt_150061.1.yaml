  The story:

  The Resonator hummed, a low C-sharp that vibrated in Mara's molars. She adjusted the haptic gain on the console, watching the dual waveforms stabilize. On the screen, the blue line represented justificatory track—evidence, truth-conditions, intrinsic value. The red line was motivational—utility, comfort, pragmatic payoff. In a healthy alignment, they synced. Usually, they didn't.

  Mara worked at the Alignment Office, a sterile suite of beige walls and ozone smells where clients paid to see why they did what they did. She was a junior technician, specializing in affective alignment. Her job wasn't to fix the reasons, but to map the friction between them.

  Mrs. Gable sat in the chair, her hands knotted in her lap. She was seventy, wearing a coat that smelled of lavender and stale rain. She wanted the belief module scanned. Specifically, her conviction in an afterlife.

  "It keeps the dark away," Mrs. Gable said, her voice thin. "If I think my husband is waiting, I can get out of bed."

  Mara didn't speak. She tapped the sequence key. The screen flickered. The blue line flatlined almost immediately. There was no evidential support, no theological coherence registering in the cognitive cortex. But the red line spiked, jagged and fierce. Pragmatic utility. Despair avoidance.

  Mrs. Gable watched the monitor. She saw the blue line die. Her shoulders slumped, not in surprise, but in recognition. "Is it... invalid?" she asked.

  "The track is clear, ma'am," Mara said softly. "The fuel is pragmatic."

  "So it's a lie."

  "It's a stabilization mechanism." Mara hovered her finger over the 'Certify' button. To certify meant validating the belief as truth-tracking. To flag it meant marking it as instrumental. She looked at the woman's trembling hands. She pressed 'Flag'. The machine hummed higher. Mrs. Gable nodded, once, and took the printout like a prescription she knew wouldn't work but took anyway.

  The next client was David, twenty-four, tapping his foot against the leg of the exam table. He wanted an attachment scan regarding his partner, Sarah.

  "She does my taxes," David said, rubbing the back of his neck. "She reminds me to call my mother. She's... efficient."

  Mara watched the waveforms. The blue line—affection, admiration, intrinsic valuing of the other—was a faint ripple. The red line—security, logistical ease, social optimization—was a mountain range.

  "I feel guilty," David admitted, looking at his shoes. "Like I'm using her. But I care about her. Don't I?"

  "The map shows dependency," Mara said. "Not attachment."

  David flinched. "So I should leave?"

  "That's not my function." Mara typed the notes. *Instrumental attachment detected. Justificatory deficit.* She handed him the slip. He looked at it as if it were a death sentence for a relationship that had never really been alive.

  When the office cleared, the hum of the Resonator settled into the background noise of the building. Mara leaned back, the leather chair creaking. She thought about her own apartment, shared with Elena for four years. They split rent. They knew each other's schedules. It was efficient.

  She closed her eyes and ran a internal diagnostic, a habit she'd picked up from the machine. Why did she live with Elena? The blue line flickered. Memories of laughter, late nights, a shared warmth that wasn't about money. But the red line was heavy. Rent control. The cost of moving. The fear of loneliness. She couldn't tell where the habit ended and the affection began. The tracks were tangled.

  Then, the job. Why was she here? She told herself it was to help people find truth. That was the blue line. But the paycheck cleared on the first of every month. The student loans were paid automatically. The red line was solid concrete.

  Mara stood up and walked to the window. The city outside was gray, rain streaking the glass. She placed her hand against the cool pane. She thought about Mrs. Gable's lavender smell, the way the belief kept her vertical. She thought about David's efficiency, the way his partner kept his life from collapsing.

  She looked back at the Resonator. The lights were dormant, but the hum remained, vibrating in the floorboards. She thought about Elena. She thought about the rent.

  Mara reached for her comms unit to text Elena. *Coming home,* she typed. Then she deleted it. *Looking forward to seeing you,* she typed instead.

  She paused. Was that true? Or was it just alignment? She hit send before she could scan the reason. The machine behind her clicked, cycling down for the night, or perhaps cycling up. Mara couldn't tell if the relief she felt was because the work was done, or because she had finally stopped checking the tracks. The hum continued, steady and indifferent, filling the silence where a reason should have been.

  Commentary on the choices made:

  I deployed the Wrong-Kind-of-Reasons (WKR) problem across three domains: belief (Mrs. Gable), love/attachment (David), and professional/personal commitment (Mara). Mrs. Gable illustrates the doxastic WKR—believing for comfort rather than evidence. David illustrates the practical WKR in relationships—valuing someone for utility rather than intrinsic worth. Mara's arc internalizes the problem, questioning whether her own "alignments" are genuine or merely instrumental.

  I took liberties by reifying abstract philosophical distinctions into visible waveforms. In reality, reasons aren't separable data streams; this technification allows the story to "show" the conflict without dialogue-heavy exposition. The sci-fi elements remain grounded to keep the focus on the psychological tension rather than the technology itself.

  The ending sidesteps a resolution. It doesn't confirm if instrumental reasons are sufficient (pragmatism) or if Mara's text message signifies a genuine shift in attitude (internalism). By leaving the hum "indifferent," I suggest the distinction might be a feature of the observer, not the world. Mara acts before analyzing, implying that living requires ignoring the split the machine reveals.
