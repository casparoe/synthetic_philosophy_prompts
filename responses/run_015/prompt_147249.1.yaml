answer: |-
  ### I. System-Theoretic Restatement of the Integrity Objection

  **The Agent as a Homeostatic Architecture**
  Consider the moral agent not as a metaphysical soul, but as a complex, multi-loop control system. The agent's "ground projects" and deep commitments (e.g., marriage, vocation, artistic pursuit) are modeled as **endogenous regulated variables**. These variables possess **defensible set-points** that define the system's operational identity. The maintenance of these variables within specific bounds constitutes the system's *integrity*. This is not merely survival (basic homeostasis) but the maintenance of a specific trajectory and state-space occupancy (allostatic identity).

  **Utilitarianism as Exogenous Override**
  Act utilitarianism functions as a **supra-systemic optimization algorithm**. It imposes an **exogenous control signal** that demands the agent's effector mechanisms prioritize a global cost function (total utility) over local set-point defense. In control-theoretic terms, utilitarianism requires the agent to decouple its effectors from endogenous feedback loops (personal commitments) and couple them to an external reference signal (the general good). This creates a conflict between **local controllers** (protecting identity variables) and a **global optimizer** (maximizing aggregate output).

  **Alienation as Decoupling**
  Williams's claim that utilitarianism alienates the agent from their actions translates to **sensorimotor decoupling**. When the exogenous signal overrides endogenous feedback, the agent becomes a transparent channel for external regulation. The system loses **autonomy** (self-law) and becomes **heteronomous** (other-law). The "integrity" of the system is compromised because the internal state is no longer determined by the system's own regulatory history and set-points, but by transient external demands. This induces high **allostatic load**, as the system must constantly reconfigure its internal parameters to match the fluctuating exogenous signal, leading to regulatory fatigue and potential system instability.

  **"One Thought Too Many" as Feedback Latency**
  The scenario of the man saving his wife is a crisis requiring rapid **error correction**. The endogenous set-point ("wife's safety") should trigger a dedicated, low-latency **reflex arc**.
  *   **The Williams-compliant response:** The signal bypasses high-level processing and actuates the effector directly. This is a stable, hard-wired feedback loop.
  *   **The "One Thought Too Many" response:** The signal is routed through a high-level **supervisory controller** for cost-benefit analysis (utilitarian calculation). This introduces **feedback latency**. In a non-linear, time-sensitive system, this latency creates a **phase lag** between the disturbance (wife drowning) and the correction (saving her). This lag risks **oscillatory instability** (hesitation) or system failure (death). The "thought" is not just a delay; it is the engagement of a control architecture inappropriate for the time-constant of the crisis. It indicates that the regulated variable ("wife's safety") has not been successfully hard-wired as a high-priority set-point, but remains dependent on computational validation.

  ***

  ### II. Residue Report

  This section identifies the fidelity of the translation between Williams's philosophical concepts and physiological regulatory dynamics.

  #### 1. Clean Mappings (High Fidelity)
  *   **Feedback Latency vs. Deliberation:** The mapping of "one thought too many" to control-loop latency is precise. Both describe a failure of responsiveness due to unnecessary processing stages in a time-critical context.
  *   **Allostatic Load vs. Moral Burden:** The wear-and-tear of constantly overriding local set-points to satisfy a global optimizer maps cleanly to the psychological exhaustion and alienation Williams describes. The cost of maintaining integrity against constant utilitarian perturbation is energetically expensive.
  *   **Boundary Defense vs. Integrity:** The physiological effort to maintain internal variables against external perturbation (boundary defense) mirrors the philosophical effort to maintain personal identity against the dissolving pressure of impartial morality.

  #### 2. Distorted Mappings (Significant Loss of Information)
  *   **Set-Point Defense vs. Normative Ownership:** In physiology, a set-point is defended because it is *causally* entrenched (e.g., via gene expression or neural wiring), not because it *ought* to be defended. Williams argues that a project is mine and I *must* pursue it because it constitutes my integrity. The biological model can explain *that* I defend it, but it cannot capture the **normative force** of the claim that I am *justified* in defending it against the global optimizer. The translation converts a moral right into a descriptive stability mechanism.
  *   **System Stability vs. Moral Worth:** In control theory, a stable system is not necessarily a "good" system (a tyrant can be highly stable). Williams implies that integrity has moral value. The biological translation reduces this value to **operational coherence**. The distinction between a "stable fascist" and a "stable person of integrity" is lost in pure regulatory terms.

  #### 3. No Counterpart (Translation Failure)
  *   **The "Me-ness" of Projects:** Physiology recognizes "self" via immune markers or proprioceptive maps, but these are functional distinctions. Williams's claim that a project belongs to *me* in a way that grants it special moral weight relies on a notion of **subjective ownership** that has no counterpart in regulatory physiology. A thermostat defends temperature, but the temperature does not belong to the thermostat in a morally relevant sense.
  *   **Moral Luck:** Williams often ties integrity to contingent projects (e.g., saving *this* wife, not *a* wife). Control theory treats all regulated variables as functionally equivalent based on gain and priority. The specific *content* of the attachment (why *her*?) is irrelevant to the control architecture, whereas for Williams, the specific historical contingency is essential to the moral claim.

  ***

  ### III. Specific Examination of Regulatory Architectures

  **1. Set-Point Defense vs. Normative Claim**
  Can the claim "this project belongs to me and must be pursued by me" be expressed as set-point defense?
  *   **Analysis:** It can be expressed as a **high-gain feedback loop** with a **deadband** that rejects exogenous interference. The system will violently correct deviations from the project trajectory.
  *   **Loss of Content:** This captures the *behavioral* profile of integrity but loses the *justificatory* content. In biology, if the set-point is maladaptive (e.g., addiction), the system defends it just as vigorously. Williams argues that ground projects are constitutive of a *good* life, not just a *persistent* one. The regulatory model is morally blind to the *value* of the set-point, treating a life of virtue and a life of pathology as identical if both exhibit high set-point defense. Therefore, the translation loses the specifically moral content of "must."

  **2. First-Order Attachment vs. Second-Order Reflection**
  Does the distinction survive translation into layered feedback architectures?
  *   **Analysis:** Yes, structurally. First-order attachment corresponds to **low-level autonomous loops** (e.g., spinal reflexes, limbic drives). Second-order moral reflection corresponds to **high-level supervisory control** (e.g., prefrontal cortical regulation).
  *   **The Conflict:** Williams argues that second-order reflection (utilitarianism) should not override first-order attachment in certain domains. In control theory, higher loops *exist* to override lower loops when environmental conditions change (allostasis).
  *   **The Distortion:** In physiology, the higher loop has **causal authority** (it can inhibit the lower loop). In Williams's ethics, the higher loop (impartial reason) lacks **normative authority** over ground projects. The biological model assumes a hierarchy of *power*, whereas Williams posits a hierarchy of *value* where the lower level (personal commitment) trumps the higher level (impartial calculation) in specific contexts. The control architecture cannot represent a "lower" loop having authority over a "higher" loop without redesigning the hierarchy itself.

  ***

  ### IV. Conclusion

  The residue report indicates that the translation failure points to a **genuine limitation in the biological vocabulary**, specifically regarding **normativity**.

  Control theory is a descriptive framework of *causal* dynamics (how systems maintain stability), whereas Williams's objection is a *normative* claim (how agents should justify their actions). The biological vocabulary can successfully model the *phenomenology* of integrity (stability, latency, load) and the *structural conflict* between local and global optimization. However, it cannot capture the **deontic power** of the claim that an agent is *permitted* to prioritize their own projects against the global good.

  In the biological model, if the exogenous utilitarian signal is strong enough, it *should* override the endogenous set-point for the system to adapt to the broader environment. To say it *should not* requires a value judgment external to the regulatory dynamics. Therefore, Williams's objection depends on distinctions (normative authority, moral ownership) that do independent philosophical work which cannot be reduced to homeostatic or allostatic dynamics without remainder. The residue is not merely noise; it is the signal of the **Is-Ought gap**. While systems biology explains the *cost* of violating integrity (instability, load), it cannot generate the *prohibition* against doing so. Thus, Williams's objection retains philosophical force precisely where the biological vocabulary runs out.
