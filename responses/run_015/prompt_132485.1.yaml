      *   *Bernard/Lenina:* Contrast their levels of awareness. Lenina = embedded. Bernard = friction-aware but not system-aware.
      *   *Conclusion:* Summarize the implication for the course. The danger isn't just the nudge; it's the engineering of the nudgee.

  5.  **Refine the Tone:**
