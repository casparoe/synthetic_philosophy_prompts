prompt: |-
  hey im taking this ethics/philosophy of tech course and weve been arguing about paternalism and nudging — like thalers choice architecture stuff vs full blown coercion. my prof threw in this distinction between 'surface nudges' (reordering options without hiding them) and 'deep nudges' (reshaping what people even count as a reason), and i want to apply that to brave new world for my paper. specifically: is hypnopaedia a surface nudge or a deep one? does soma work on preferences or on the ability to form them? and when john the savage refuses the whole system, is he defending autonomy against nudging, or is he just reacting to the absence of any real choice architecture? i want to know if huxley actually separates these mechanisms or if the novel treats all control as the same thing. also, do bernard or lenina ever have a moment where they feel the system pushing them rather than just living inside it? i dont need citations or a reading list — just a conceptual reading that takes the novel and the philosophy seriously without reducing one to the other.
