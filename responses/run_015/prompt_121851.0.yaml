  8. Literary Theorist: "Does this theory deny agency to historical actors by subordinating their choices to narrative requirements? People aren't characters." This targets my conceptual framework. It raises ethical concerns about reducing humans to plot devices. They focus on human subjectivity and resistance. Damage 1. This questions ethical implications.

  3. Two-Minute Replies and Vulnerabilities
  1. Reply: I distinguish reconstruction from invention. Viscosity affects explanation, not evidence. We still rely on documents, but the stitching is narrative. I am not saying the past is fiction, but that our explanation behaves like it. Vulnerability: Relies heavily on analogy to plot resolution in novels, which historians may reject as irrelevant to evidence. They may see this as admitting guilt.
  2. Reply: It warns against overconfidence, not uselessness. It highlights bias so we can correct for it. Counterfactuals remain heuristics, just flawed ones. We must account for the pull of the actual. Vulnerability: Concedes reduced utility, which may satisfy no one who relies on them for causal inference. It weakens the tool they use daily.
  3. Reply: Viscosity operates at the level of assertion, not semantics. It explains why we assert certain counterfactuals as plausible, not their truth conditions. It is a pragmatic constraint. Vulnerability: Sidesteps the truth condition question, which philosophers will see as dodging the core logical problem. They want semantic rigor.
  4. Reply: Evidence constrains, but selection is narrative. I don't ignore documents, but I note how they are arranged. The archive is silent; the historian speaks. We choose what counts. Vulnerability: Hard to prove selection bias without implying negligence or manipulation of data. Historians defend their selection processes fiercely.
  5. Reply: It is epistemological, regarding how we know, not ontological. I am analyzing historiography, not the past itself. The past is fixed; our view is viscous. Vulnerability: Might weaken the claim's force, making it seem like a trivial observation about writing rather than history. It limits the scope significantly.
  6. Reply: I analyze historiography, not events. The text is the object of study, not the reality it describes. We study the map, not the territory. Vulnerability: Risks isolating history from reality, turning the discipline into pure textual analysis. Historians hate losing the reality.
  7. Reply: Look at failed predictions that were narratively smoothed later. Historians often rewrite failed counterfactuals to fit the outcome. The narrative heals the breach. Vulnerability: Anecdotal. Requires specific examples I may not have ready at hand during Q&A. General claims need specific proof.
  8. Reply: Actors have agency; historians impose structure. The viscosity is in the writing, not the living. People act; we narrate. Vulnerability: Dichotomy might be too clean; historical writing influences future agency, blurring the line. It separates text and life too sharply.

  4. What to Concede Up Front
  I must concede two points to lower the temperature. First, I must affirm the utility of counterfactuals. Precise language: "I do not argue we abandon counterfactual reasoning, only that we recognize its narrative friction." This assures historians I am not destroying their toolkit. Second, I must affirm the constraint of evidence. Precise language: "Narrative coherence operates within the bounds of archival evidence, not outside them." This assures them I am not advocating fiction over fact. These concessions clarify that I am critiquing the interpretation of results, not the evidentiary basis of the discipline. They signal respect for their methods while maintaining my theoretical claim. It prevents the accusation that I am importing novelistic license into the archive. By establishing these boundaries early, I frame viscosity as a refinement of method rather than a rejection of it. This lowers defensiveness regarding my competence.

  5. The Dreaded Question
  The Dreaded Question: "If every failed counterfactual is explained by viscosity, isn't this theory unfalsifiable?" This is uniquely dangerous because it categorizes my thesis as pseudoscience or mere speculation. If viscosity explains both the success and failure of counterfactuals post-hoc, it predicts nothing. It becomes a tautology where narrative always wins.
  Best Reply: "It predicts specific patterns in historiographic writing, not events themselves. We can measure narrative smoothing over time." I shift the object of study from the past to the literature about the past.
  Softest Ground: The distinction between prediction and post-hoc description. I am mostly describing existing texts, not predicting new ones. If pressed on how to test this prospectively, I stand on soft ground. I lack a method for prospective testing of narrative constraints. This admits the theory is primarily diagnostic. I must avoid claiming predictive power I do not possess. The risk is appearing to offer a scientific theory that is actually literary criticism. I need to own the diagnostic nature without apologizing for it.

  6. Closing Strategy
  Closing Strategy: I must land one line to ensure the proposal survives scrutiny. The line is: "The past is fixed; our understanding of its necessity is not." This separates ontology from epistemology clearly. When philosophers press on formal semantics, I must adopt a tone of collaborative humility. I should not argue semantics with them but invite them to model the narrative constraint. I will say, "I need your help to formalize this." This turns adversaries into collaborators. It acknowledges their expertise while preserving my insight. The tone must be respectful but firm on the narrative insight. I must not appear defensive about my novelist background but use it as a unique lens. This ensures the interdisciplinary nature of the workshop is honored rather than threatened.
