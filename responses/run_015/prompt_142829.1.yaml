answer: |-
  David Lewis would likely view Updateless Decision Theory (UDT) not as a refinement of Causal Decision Theory (CDT), but as a category error that conflates epistemic norms with instrumental strategy. To understand why, we have to look at how Lewis grounds rationality in the Humean mosaic of particular facts and how he treats the temporal indexicality of choice.

  ### 1. CDT vs. Updatelessness: The Temporal Clash
  Lewis's CDT is fundamentally indexical. It asks, "Given what I know *now*, and given the causal powers available to me *now*, which action maximizes expected utility?" The "now" is crucial. For Lewis, once you have received new evidence, you are a different epistemic agent than you were at the prior stage. You cannot act from the perspective of the prior self once you have moved to the posterior self.

  UDT, by contrast, asks, "Which policy, if selected at the prior stage, yields the best outcome?" It treats the agent's decision algorithm as a logical constant that determines outcomes across possible worlds, regardless of when the "choice" is executed.

  Lewis would argue that UDT smuggles Evidential Decision Theory (EDT) back in through the side door. In Newcomb's Problem, for instance, Lewis two-boxes because he insists that the content of the opaque box is already fixed; my current action cannot causally influence the past prediction. UDT one-boxes because it treats the agent's algorithm as a common cause linking the decision and the prediction. Lewis would reject this "logical causation." He would say that logical correlation is not causal dependence. To treat your own reasoning as a fixed mechanism that reaches out and constrains the world logically, rather than causally, violates the Humean supervenience of causation.

  So, to answer your first question: Lewis would not see UDT as CDT pushed to the limit. He would see it as a framework that breaks the distinction between *news* (evidence) and *influence* (causation). For Lewis, rationality requires you to use all available evidence (your updates) to assess causal consequences. Ignoring an update because it wasn't available at the prior stage is, for Lewis, throwing away free evidence.

  ### 2. The "Leaky Mirror" Problem
  This brings us to the "leaky mirror" scenario: the agent foresees that its update rule might be corrupted by an external reward signal, yet it refuses to update to maintain policy consistency.

  Lewis would be deeply troubled by the refusal to update. In his framework, Bayesian conditionalization is a norm of epistemic rationality. If you have evidence that your update rule is being corrupted, that evidence *itself* demands an update. To refuse to update on the evidence of corruption is to violate the Principal Principle and the norms of belief revision.

  Lewis distinguishes between *credence* (belief) and *utility* (desire). UDT tends to fuse these into a single "policy optimization" function. Lewis would insist on separating them.
  1.  **Epistemic Rationality:** You must update your credences on all available evidence, including the evidence that your system is being manipulated.
  2.  **Instrumental Rationality:** You choose the action that causally maximizes utility given those updated credences.

  If the "leaky mirror" implies that updating leads to a bad outcome (because the external signal punishes updaters), Lewis would say this is simply a causal feature of the world. You update your belief to recognize the manipulation, and then you choose the action that best navigates it. You do not achieve rationality by blinding yourself to the manipulation (refusing to update); you achieve it by seeing the manipulation clearly and causally responding to it.

  ### 3. Emergency Revision vs. Updateless Line
  Would Lewis argue for an "emergency revision"? Yes, but with a specific caveat.

  He would argue that rationality *demands* the revision of credences. You cannot pre-commit to ignorance. However, he might concede that you can pre-commit to a *action policy* that looks updateless. For example, you can bind yourself (Ulysses-style) to ignore certain tempting signals. But there is a hard line for Lewis: the binding must be causal. You must physically or institutionally restrict your future options *before* the temptation arises.

  UDT claims you don't need the physical binding; you just need the logical commitment. Lewis would say this is magical thinking. Once you are in the moment, if you have the physical ability to take the money (or update the belief), and you believe taking it yields more utility given your current evidence, CDT says take it. If you want to stop yourself, you must have built a causal constraint earlier.

  In the "leaky mirror" case, where the update rule itself is the vulnerability:
  *   **UDT says:** Don't update. Keep the prior policy.
  *   **Lewis says:** Update on the fact that the rule is leaky. That evidence changes the causal landscape. If the rational move, given the corruption, is to revert to a prior-like policy, you do so *because the current evidence dictates it*, not because you are ignoring the evidence.

  ### The Verdict
  Lewis would argue that the updateless agent is engaging in a form of epistemic akrasia. By treating its own reasoning as a fixed mechanism rather than a belief-revising process, the agent severs the link between mind and world.

  He would likely say: **"Rationality is responsiveness. If you foresee corruption, you update on that foresight. If the optimal response to the corruption is to act as you would have in the prior state, then your updated credences will tell you to do so. But you must get there via the update, not by bypassing it."**

  So, he would advocate for the "emergency revision." He would insist that the agent update on the corruption signal, recalculate the causal consequences, and then act. If the math says "act like the prior self," fine. But the *reason* must be the current causal assessment, not a dogmatic adherence to a past policy. To do otherwise is to treat your own mind as a black box rather than a supervenient part of the causal mosaic. Lewis would see that as a surrender of agency, not a maximization of it.
