answer: |-
  # Handout: Disambiguating "Unrealistic Assumptions are a Feature, Not a Bug"

  **Context:** This slogan is often deployed to deflect objections that a model's premises do not match reality (e.g., humans do not actually maximize utility). However, the slogan conflates several distinct methodological claims. Below is a breakdown of the specific theses hiding behind the phrase, evaluated on defensibility and their ability to answer objections regarding rational-agent models.

  ---

  ## The Menu of Theses

  ### 1. The Trivial Simplification Thesis
  *   **The Claim:** All models must abstract from reality to be tractable. Unrealistic assumptions are merely necessary simplifications, like assuming a frictionless vacuum in physics.
  *   **Status:** **Defensible.** No model can include every variable; abstraction is a precondition of modeling.
  *   **Does it get the speaker off the hook?** **No.** This justifies *some* unreality, but not *any* unreality. It fails to explain why *this specific* false assumption (e.g., perfect rationality) is acceptable rather than a distorting error. It confuses necessity with virtue.
  *   **Domain Sensitivity:** Universal. Applies equally to Economics and Climate Science.

  ### 2. The Friedman-Style "F-Twist"
  *   **The Claim:** The significance of a theory is positively correlated with the unrealisticness of its assumptions. If a model predicts well, the assumptions *should* be unrealistic because they capture the "central forces" while ignoring "noise."
  *   **Status:** **Controversial/Weakly Defensible.** While predictive success is valuable, the claim that *more* unrealistic assumptions lead to *better* predictions is empirically dubious. Often, unrealistic assumptions limit the range of prediction.
  *   **Does it get the speaker off the hook?** **Partially.** If the rational-agent model predicts market behavior accurately, this thesis says the psychology doesn't matter. However, if the objection is about *explaining* behavior (mechanism) rather than predicting aggregate outcomes, this thesis offers no defense.
  *   **Domain Sensitivity:** High. Common in Economics. Less viable in Climate Science, where accurate internal mechanisms are required to predict novel interventions (e.g., geoengineering).

  ### 3. The Hard Instrumentalist Reading
  *   **The Claim:** Descriptive accuracy of assumptions is irrelevant. Models are not truth-claims; they are calculation devices or tools for organizing data. Asking if agents "really" maximize is a category error.
  *   **Status:** **Defensible as a stance, but limiting.** It protects the model from ontological criticism but surrenders the claim that the model explains *why* things happen.
  *   **Does it get the speaker off the hook?** **Yes, by changing the subject.** It dismisses the objection by denying that the model was ever trying to describe real people. If the seminar is about *explanation*, this is a concession, not a defense.
  *   **Domain Sensitivity:** Moderate. More acceptable in Finance (trading algorithms) than in Welfare Economics or Climate Policy, where knowing the causal truth matters for ethical or physical intervention.

  ### 4. The Active Explanatory Benefit Thesis
  *   **The Claim:** Being descriptively wrong is *actively beneficial* for explanation. False assumptions isolate specific causal mechanisms that would be obscured by realistic "noise." (e.g., Assuming rationality isolates the effect of incentives from psychological quirks).
  *   **Status:** **Strongly Defensible.** This is the only reading where unreality is truly a "feature." It treats the model as a controlled experiment.
  *   **Does it get the speaker off the hook?** **Yes.** This provides a positive reason for the false assumption. It argues that introducing realistic psychology *now* would hinder the specific explanatory goal of the model.
  *   **Domain Sensitivity:** Moderate. Works well in Economics (isolating incentives). In Climate models, "active falsehood" is riskier; assuming unrealistic physics usually breaks the model rather than clarifying it.

  ---

  ## The "As-If" Fiction Reading
  *   **The Claim:** Agents do not maximize, but they act *as if* they do. The assumption is an organizing fiction that allows us to map behavior without committing to the psychological truth.
  *   **Does this solve the problem or relocate it?**
      *   **It Relocates the Problem.** It shifts the burden from "Is the assumption true?" to "Under what conditions does the *as-if* mapping hold?"
      *   **The New Objection:** If the model is just a fiction, we need a bridge principle explaining why the fiction tracks reality. If people deviate from the fiction systematically (e.g., behavioral biases), the *as-if* defense collapses.
      *   **Verdict:** It buys time, but it does not solve the underlying issue of robustness. It requires a secondary argument about why the fiction is stable.

  ---

  ## Domain Dependence: Economics vs. Climate Models

  The defensibility of these theses shifts significantly depending on the subject matter.

  | Feature | **Economic Models (Rational Agents)** | **Climate Models (Physical Systems)** |
  | :--- | :--- | :--- |
  | **Target** | Human behavior (mutable, psychological). | Physical systems (immutable, law-governed). |
  | **Unrealistic Assumptions** | Often **psychological** (perfect info, rationality). | Often **structural** (grid resolution, simplified clouds). |
  | **Instrumentalism** | More defensible. If markets clear, who cares why? | Less defensible. We need causal truth to intervene safely. |
  | **"Feature not Bug"** | Plausible if isolating incentives (Thesis 4). | Risky. False physics usually leads to false predictions. |
  | **Key Vulnerability** | Lucas Critique / Behavioral anomalies. | Tipping points / Non-linear feedback loops. |

  **Summary for Class Discussion:**
  If the speaker is using the slogan to defend an Economic model, they are likely relying on **Thesis 2 (Friedman)** or **Thesis 4 (Isolation)**. If they are defending a Climate model, they must rely on **Thesis 1 (Simplification)**; claiming false physics is a "feature" (Thesis 4) is generally untenable in physical sciences.

  **Bottom Line:** The slogan is only a valid defense if the speaker can argue that the unrealistic assumption **isolates a causal force** (Thesis 4). Mere appeal to prediction (Thesis 2) or instrumentality (Thesis 3) concedes that the model does not explain the underlying reality.
