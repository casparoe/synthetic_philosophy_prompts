answer: |-
  The institutional pattern described presupposes an **Affective Theory** (or Motivational Theory) of pain's badness. Under this view, the moral and legal significance of pain lies not in the raw sensory detection of noxious stimuli (nociception), but in the negative phenomenological valence—the unpleasantness, distress, or suffering—that accompanies it.

  **Reconstruction of the Implicit Theory**
  The legal system implicitly operates on a dual-interest model: the protection of **bodily integrity** and the protection of **experiential well-being**.
  1.  **Strict Requirement:** For the specific head of damages labeled "pain and suffering," the strict requirement is the presence of negative affective tone. The law treats the *suffering* as the harm, not the *sensation*. Consequently, a plaintiff with pain asymbolia (high sensory intensity, zero affective reaction) fails to meet the criteria for this specific damage category because their experiential well-being remains intact despite the sensory signal.
  2.  **Merely Accommodated:** The system accommodates the epistemic difficulty of accessing internal states by relying on behavioral proxies (withdrawal, aversive behavior, testimony of distress). However, behavior is evidentiary, not constitutive. If behavior were the harm itself, stoic plaintiffs would be under-compensated and theatrical plaintiffs over-compensated. The practice attempts to peer through the behavior to the affective state, strictly requiring the latter while accommodating the former as proof.

  **Addressing the Disparities and Consistency**
  Could a view on which intense nociception is intrinsically harmful justify the disparity? **No.** If nociception were intrinsically harmful regardless of affect, the asymbolic plaintiff would be owed full damages for the nociceptive event itself. The routine discounting of damages in such cases demonstrates that the law does not treat raw sensory firing as a compensable injury in the context of "pain and suffering."

  Does the practice treat sensory intensity without suffering as ethically and legally weightless? **Yes, within the specific domain of non-economic damages.** While sensory intensity may correlate with medical costs or functional impairment (economic damages), it carries no independent weight for "pain and suffering" absent the affective component.

  Is the willingness to compensate purely structural injury without any felt component consistent with this theory? **Yes.** This is consistent because the legal system recognizes two distinct goods. Compensating structural injury (e.g., a severed tendon that is painlessly repaired) protects the objective interest in **bodily integrity** and functional capacity. Compensating "pain and suffering" protects the subjective interest in **experiential welfare**. Denying pain damages to an asymbolic plaintiff does not deny they were injured structurally; it denies that their *experience* was harmed. Thus, the system is consistent: it pays for the broken body (objective) and the broken spirit (subjective), but not for a sensory signal that breaks neither.

  **Hypothetical Shift to Sensory Intensity**
  If the badness of pain were located entirely in sensory intensity, courts would have to fundamentally alter damage calculations. Testimony regarding "how much it hurt" (in terms of unpleasantness) would become irrelevant. Instead, damages would be calculated based on objective physiological metrics of nerve firing, stimulus magnitude, or tissue innervation density. An asymbolic plaintiff would receive the same "pain and suffering" award as a suffering plaintiff for the same injury, because the "harm" (the sensory signal) would be identical. Courts would essentially be compensating for the *presence* of the signal, not the *reaction* to it.

  Verdict: The Affective Theory of pain's badness.
