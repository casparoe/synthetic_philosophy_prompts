      *   *Actually, simplest for 90 mins:* One main game. The other 13 are "Stakeholders." They hold veto tokens or can bid on unsealings? No, too complex.
      *   *Best approach:* Run the game with 3 volunteers. The other 13 are "Auditors." They have scorecards. They must predict the winner and the truth. This keeps them engaged.
