      *   **Round 2 (The Decomposition Fix):** Unsealing budget introduced. Debaters must point to specific cards. Judge can spend budget to verify. *Outcome:* Truth becomes easier to find if the liar gets caught on a detail.
      *   **Round 3 (The Black Box):** Introduce "Expert Testimony" cards that *cannot* be unsealed/verified (e.g., "I analyzed the code"). *Outcome:* Judge is blind again, rhetoric returns.

  5.  **Addressing the Audience (16 participants):**

      *   If only 3 play, 13 watch. That's a lecture.
      *   *Idea:* Split into 4 groups of 4. Each group plays a mini-version? No, too much setup.
      *   *Idea:* One fishbowl. The 13 observers are assigned specific "lenses."
          *   Group A: Track rhetorical moves.
