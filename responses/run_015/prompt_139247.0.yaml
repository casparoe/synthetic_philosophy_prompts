      *Solution:* Pre-packaged "Truth Envelopes" for each table. The Facilitator (me) walks around.
      *Risk:* Noise level. Debrief coherence.
      *Decision:* Stick to **One Fishbowl, 13 Auditors**. Why? Because the prompt asks for *a* runnable activity for *this group* to acquire *a* felt understanding. A shared experience is better for debrief than 4 divergent experiences. I will give the Auditors specific scoring rubrics to keep them engaged.

