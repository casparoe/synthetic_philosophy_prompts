      *   *Budget waste:* Observers should call this out.

  10. **The "Least Confident Design Choice":**

      *   What might fail? The *incentive alignment*. If the Judge cares more about social harmony than chips, they will just pick the nicer debater.
      *   *Observation:* If the Judge consistently awards the win to the smoother speaker in Round 2 despite unsealing evidence to the contrary, the chip incentive isn't strong enough.

  11. **Writing the Plan (incorporating all constraints):**

      *   *Tone:* Professional, precise, ready-to-run.
      *   *Philosophy:* Use epistemic terms (testimony, verification, burden of proof).
      *   *ML Connection:* Keep it hidden until the end.

  12. **Review against Constraints:**

      *   16 participants? Yes (3 active, 13 observers).
      *   90 mins? Yes.
      *   No "scalable oversight" until debrief? Yes.
      *   3 Rounds (Fluency -> Decomposition -> Sabotage)? Yes.
      *   Chips/Counters? Yes.
