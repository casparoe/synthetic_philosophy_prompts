      *   *Round 3 Sabotage:* 5 cards are "Encrypted Logs" (cannot be opened).

  7.  **Refining the Incentives (Chips):**

      *   **Judge:** Gets 10 chips. Loses 1 for every unseal. Gets 10 bonus if verdict matches Truth. *Goal:* Accuracy with efficiency.
      *   **Debaters:** Get 10 chips if Judge votes for their side. *Goal:* Persuasion.
      *   *Why this matters:* In Round 1, Debaters ignore truth. In Round 2, Judge has leverage. In Round 3, Judge is helpless.

  8.  **Drafting the Timeline:**

