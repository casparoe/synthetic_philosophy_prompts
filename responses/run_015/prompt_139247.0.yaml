  3.  **Evaluate the User's Skeleton:**

      *   *Skeleton:* 40 cards, Facilitator knows truth, 2 Debaters read all, Judge reads none (budgeted unsealing).
      *   *Critique:* It's solid but needs tuning for 90 minutes with 16 people. 16 people is too many for just 3 active roles (2 debaters, 1 judge). The rest will be bored.
