  To: Board of Directors
  From: Finance Committee Member
  Date: October 24, 2023
  Re: Recommendation Regarding Executive Director Status

  Colleagues,

  We face an unprecedented governance question. Our Executive Director (ED) sent an email resigning "effective immediately" at 1:40 a.m. Saturday. She retracted it at 8:15 a.m., explaining the text was generated by an AI tool from a private voice note without her review. The Chair acknowledged receipt at 7:02 a.m. Our bylaws state resignations are effective upon receipt and cannot be withdrawn without Board consent. Our lawyer notes employment law is silent.

  I recommend we rule that the 1:40 a.m. communication did not constitute a valid resignation. Consequently, the ED remains in her role, and no withdrawal consent is required.

  My reasoning rests on the nature of the act. Saying "I resign" is performative; like saying "I do" at a wedding, it changes reality. But performative acts require agency. If a person is coerced, unconscious, or, as noted here, "mumbled in a fever," the words lack force. Here, the ED did not author the specific words "effective immediately," nor did she review the message before transmission. The AI acted as an unauthorised agent. To treat this as valid is to treat a forged signature as binding because the pen belonged to the signer.

  I know half of you disagree. Your case is strong: institutions need certainty. If we allow morning-after retractions, we invite instability. The bylaw's bright line ("effective upon receipt") exists precisely to prevent us from probing subjective intent. If we blur this line, future Chairs may hesitate to acknowledge notices, paralysing operations during crises. You argue that protecting the organisation's stability must outweigh one individual's error, however unfortunate.

  I hear this. But this is where we make a value call. No amount of conceptual clarification settles whether we prioritise procedural certainty or substantive intent in cases of demonstrable technological error. I believe we must prioritise intent here. Accepting the resignation risks wrongful dismissal claims and devastates morale among staff already reeling from funding losses and threats. The cost of stability here is too high.

  My verdict would change if one fact were different: if the ED had waited more than 24 hours to retract, or if she had confirmed the resignation in a subsequent meeting. Delay implies ratification. Her immediate disowning of the message confirms the lack of intent.

  To prevent recurrence, I recommend we amend the bylaws. We cannot rely on "receipt" alone in an age of automated tools. We need a confirmation step. Specifically, we should require that electronic notices be confirmed by the sender within one business hour to be deemed received.

  Please come to Thursday's meeting ready to vote on this recommendation and the proposed amendment. We must resolve this to support our staff and our ED.

