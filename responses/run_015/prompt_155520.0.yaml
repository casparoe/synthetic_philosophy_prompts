  hey — some context first, and please be patient with me because I'm a novelist, not a philosopher, and I don't know the jargon. You're an expert in the history of utilitarian moral philosophy and in the philosophy of the criminal law, so take a minute at the start to brainstorm the shape of the logical space before you begin sticking names on anything.

  I'm writing a novel that's mostly set around a radical dinner table in London in the early 1820s: a young Benthamite who quotes the manuscript essay on sexual irregularities that (I think?) he never dared print, an elderly clergyman who is genuinely horrified rather than cartoonishly evil, a physician who keeps pushing a demographic argument about national strength and wasted seed, and a young woman who is herself a utilitarian but wants to keep the criminal law anyway, for the sake of social peace. I don't want the scene to be people reciting slogans at each other, so what I need from you is a taxonomy, not an essay: a tree where every branch is labeled with the single claim that splits it from its siblings, and every leaf is a named position (or else "unnamed — nobody here"). Aim for roughly eight to ten branch questions and nine to twelve leaves; an ASCII tree or a table is fine. The branches have to be questions a character could answer without already knowing which position they lead to — so each node should really be a concrete case rather than a label: two adults who consent, nobody ever finds out, no disease, no unwanted children; the same act but the neighbours do find out and are miserable about it; a case where the disgust only exists because there's a law on the books (I want you to be explicit about whether that pain gets counted once or twice, since it seems to me it bootstraps itself); an act that's said to corrupt the agent's own character while harming no one else; a case where one party can't consent at all; and celibacy, which seems to me to make exactly the same demographic trouble as the acts everyone is shouting about. I also want two anachronistic leaves, the structural-coercion / feminist critique and the modern offense-principle view, marked clearly as positions nobody at that table could have occupied — I may give one of them to a narrator writing fifty years later.

  A few more things I care about. Each leaf gets one sentence on its most awkward commitment, and I especially want to know which leaves a utilitarian can honestly occupy and which ones cost you something Bentham is committed to. I'm fairly sure Bentham's own view lands on the "no harm, no law" leaf, but tell me honestly whether he actually sits there or wobbbles between two leaves — he seems to take the depopulation objection seriously enough to answer it, which makes me think his position is shakier than the slogan. Please also mark any two leaves your tree can't really separate rather than pretending the distinction is clean, and note the unoccupied combinations with a one-line diagnosis (incoherent? unattractive? just never defended?). And here's the bit I invented for the scene, which I want placed: my young Benthamite also argues that the real mischief is the spectacle of punishment — that a public hanging or pillory spreads more pain through a town than the act ever did, and that a statute nobody enforces corrupts the standing of law itself, so the law should retreat even where the conduct is genuinely bad. Tell me whether that hybrid collapses into an existing leaf, or whether it really is an empty spot in the tree, and why nobody has defended it. No footnotes or reading lists, I don't need them for fiction — I just want the map, so think it through carefully and don't hedge everything into mush.
