answer: |-
  Here is the taxonomy of positions mapped onto a decision tree. I have constructed the branches as concrete questions your characters can answer based on their intuitions, leading to specific philosophical leaves. Following the tree, I have added the analysis you requested regarding Bentham, your invented position, and the structural ambiguities.

  ### The Taxonomy of Criminalization (1820s Logical Space)

  ```text
  ROOT: Should this sexual conduct be criminalized?
  │
  ├── Q1: Is one party incapable of consent (child, insane, coerced)?
  │   ├── YES → LEAF 1: The Protectionist
  │   └── NO  → Q2: Does the act reduce population strength more than celibacy does?
  │       ├── YES → LEAF 2: The Depopulationist
  │       └── NO  → Q3: Is celibacy the real demographic threat to the nation?
  │           ├── YES → LEAF 3: The Demographic Pragmatist
  │           └── NO  → Q4: Does the act rot the agent's soul without hurting others?
  │               ├── YES → LEAF 4: The Legal Paternalist
  │               └── NO  → Q5: Do neighbours suffer genuine misery if they find out?
  │                   ├── NO  → LEAF 5: The Pure Libertarian
  │                   └── YES → Q6: Would neighbours care if the law didn't exist?
  │                       ├── YES → Q7: Can neighbours avoid seeing/hearing it?
  │                       │   ├── NO  → LEAF 6: The Modern Offense Principled [ANACHRONISTIC]
  │                       │   └── YES → LEAF 7: The Legal Moralist
  │                       └── NO  → Q8: Do we count pain caused by the law as a reason for the law?
  │                           ├── YES → LEAF 8: The Moral Enforcer
  │                           └── NO  → LEAF 9: The Anti-Bootstrap Utilitarian
  │                               │
  │                               └── Q9: Does the hanging/pillory cause more pain than the act?
  │                                   ├── NO  → LEAF 10: The Quietist (Keep law, don't enforce)
  │                                   └── YES → Q10: Is the harm to legal authority or social structure?
  │                                       ├── LEGAL AUTHORITY → LEAF 11: The Institutional Abolitionist
  │                                       └── SOCIAL STRUCTURE → LEAF 12: The Feminist Critique [ANACHRONISTIC]
  ```

  ### Leaf Annotations & Utilitarian Viability

  | Leaf | Position | Most Awkward Commitment | Utilitarian Viability |
  | :--- | :--- | :--- | :--- |
  | **1** | **Protectionist** | Must punish even if the child claims happiness. | **High** (Compatible with harm principle). |
  | **2** | **Depopulationist** | Must criminalize private acts that never result in pregnancy anyway. | **Low** (Bentham argues this is empirically false). |
  | **3** | **Demographic Pragmatist** | Must criminalize celibacy/priesthood instead of the sexual act. | **Medium** (Consistent, but politically suicidal in 1820s). |
  | **4** | **Legal Paternalist** | Must punish a man for damaging only his own character. | **Low** (Violates sovereignty of self regarding utility). |
  | **5** | **Pure Libertarian** | Must allow acts that most people find spiritually repugnant. | **High** (Core Benthamite "no harm, no law"). |
  | **6** | **Modern Offense Principled** | Must allow offense if it is easily avoidable by the observer. | **N/A** (Anachronistic; Feinberg 1980s). |
  | **7** | **Legal Moralist** | Must punish private acts if public knowledge causes pain. | **Medium** (Compatible with rule-utilitarianism). |
  | **8** | **Moral Enforcer** | Must admit the law creates the pain it claims to prevent. | **Low** (Incoherent for a utilitarian; bootstraps harm). |
  | **9** | **Anti-Bootstrap Util** | Must ignore the actual misery neighbours feel because it's "illegal." | **High** (Consistent rejection of adaptive preferences). |
  | **10** | **Quietist** | Must keep a law on the books that is never enforced. | **Medium** (Pragmatic, but risks arbitrary enforcement). |
  | **11** | **Institutional Abolitionist** | Must repeal law even if some conduct is genuinely bad. | **High** (Protects long-term utility of legal system). |
  | **12** | **Feminist Critique** | Must view consent as impossible under patriarchy. | **N/A** (Anachronistic; structural theory unavailable). |

  ### Analysis of Specific Positions

  **1. Where Bentham Sits (The Wobble)**
  Bentham aims for **Leaf 5 (Pure Libertarian)** and **Leaf 9 (Anti-Bootstrap Utilitarian)**. His core argument is that private consent without disease or force creates no pain, so law is mischief. However, he **wobbles toward Leaf 2 (Depopulationist)** only insofar as he feels compelled to write lengthy rebuttals to it. He takes the objection seriously enough to debunk it empirically (arguing that these acts do not actually reduce population more than celibacy or prostitution), which suggests he fears the political utility of the demographic argument even if the moral logic doesn't hold. He does not sit on Leaf 5 firmly; he sits on Leaf 5 *protected by* the arguments against Leaf 2 and Leaf 8.

  **2. The Two Leaves The Tree Can't Separate**
  **Leaf 10 (Quietist)** and **Leaf 11 (Institutional Abolitionist)** are practically indistinguishable in a 1820s setting. Both result in no one being punished. The distinction is purely theoretical: one keeps the statute to preserve moral signaling (Quietist), the other repeals it to preserve legal integrity (Abolitionist). In a novel, a character arguing for one could easily be mistaken for the other unless they explicitly debate the *text* of the statute versus the *practice* of the courts.

  **3. Unoccupied Combinations**
  *   **Moral Enforcer + Utilitarian:** (Leaf 8 + Utilitarian Viability). **Diagnosis:** Incoherent. A utilitarian cannot count pain created by the law as a justification for the law without infinite regress.
  *   **Paternalist + Libertarian:** (Leaf 4 + Leaf 5). **Diagnosis:** Contradictory. You cannot believe the state should rot the soul *and* that the state should never touch private virtue.
  *   **Depopulationist + Demographic Pragmatist:** (Leaf 2 + Leaf 3). **Diagnosis:** Unattractive. You cannot claim the act destroys the nation *and* that celibacy is the real problem simultaneously.

  **4. Your Invented Position (The Young Benthamite)**
  Your character argues: (A) Punishment spectacle spreads more pain than the act, and (B) Unenforced statutes corrupt the standing of law.
  *   **Placement:** This collapses cleanly into **Leaf 11 (The Institutional Abolitionist)**.
  *   **Why Nobody Defended It:** In the 1820s, legal theory was largely Command Theory (law is the sovereign's order) or Natural Law (law is God's reason). The sociological idea that *unenforced* law damages *legitimacy* (a la Fuller or Hart mid-20th century) was not available. Benthamites argued against punishment because of the *pain of the penalty*, not because of the *corruption of the institution*. Your character is accidentally inventing Rule Utilitarianism regarding legal institutions, which is historically premature but logically sound within the tree.

  **5. Anachronistic Leaves**
  *   **Leaf 6 (Modern Offense Principle):** Requires the distinction between "hurt feelings" and "wrongful offense" and the concept of "avoidability," which wasn't codified until Joel Feinberg.
  *   **Leaf 12 (Feminist Critique):** Requires viewing consent as structurally compromised by power dynamics rather than individual capacity, which is a late 20th-century development.

  **6. Note on the "Bootstrap" (Q6/Q8)**
  You asked to be explicit about whether pain gets counted once or twice. In **Leaf 8 (Moral Enforcer)**, the pain is counted *once* (the neighbour's misery) but the *source* is ignored. In **Leaf 9 (Anti-Bootstrap)**, the pain is acknowledged but *discounted* because it is adaptive to the law. A strict utilitarian must occupy Leaf 9; occupying Leaf 8 allows the law to justify itself by creating the very disgust it punishes, which is logically circular for a utility calculator.
