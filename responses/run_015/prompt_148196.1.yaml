  I'm on one side of a commercial mediation in about three weeks — two small firms arguing over how to split the proceeds of a joint licence — and I've been reading thru the back catalogue of the mediator we've been assigned. She posts anonymised write-ups, each with a little diagram of what was achievable for the two sides, what each side's walk-away was, and then a single pair of numbers for what she says she'd have awarded. Every past case I can find has a straight-line frontier, and here is what she said: in one, 60k was on the table with nothing for either side if they walked, and she split it 30/30; in another, side A could get up to 100k and side B up to 50k with a straight frontier running between those two corners and zero walk-aways, and she awarded 50 to A and 25 to B; in a third, the pie was a fixed 100k transferable one-for-one with zero walk-aways, and she said 50/50; and in a fourth, the same fixed 100k but with each side's walk-away at 20k, and she still said 50/50. All figures in £000s, she seems to treat money as utility, and she only ever considers outcomes that are feasible and at least as good as walking away.

  Our case doesn't look like any of those. Neither of us has a real walk-away — if we don't settle the licence lapses and we both get nothing — but the frontier is kinked: A can get at most 90 and B at most 60, and the frontier runs in two straight pieces, from (0 for A, 60 for B) down to (40, 50), and then from (40, 50) to (90, 0). So over the first 40 units that A gets, B loses only a quarter of a unit per unit, and beyond that point it's one-for-one. I'm on side A, if that matters. I've done a bit of reading since getting the date through, and it sounds like the two named candidates are the Nash bargaining solution and the Kalai–Smorodinsky one, but every time I try them on her past cases they come out identical, so its not clear to me whether her track record tells us anything at all. Can you work out what each candidate rule predicts for our numbers, tell me whether one of those old cases actually discriminates and I've just misread it, give me your best guess at what she'll award with the reason you prefer it, and tell me what further hypothetical case would most cleanly separate the rules that are still live after our one is settled?

  One of the comments under her last post insists that what she's really doing is maximising the total and then splitting it evenly, which I think the 50/25 award kills — but say if I'm wrong about that, and whether that rule happens to agree with the others on our particular numbers anyway. Please write the answer in British English, and do show the arithmetic rather than just the final split.
