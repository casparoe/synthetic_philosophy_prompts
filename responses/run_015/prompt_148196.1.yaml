  *   **Ideal Point (for KS):** Max A = 90, Max B = 60.

  #### A. The Nash Bargaining Solution (NBS)
  The NBS maximises the product of the gains: $P = x \cdot y$. We must check both segments.

  *   **Segment 1:** $y = 60 - 0.25x$.
      $$P_1 = x(60 - 0.25x) = 60x - 0.25x^2$$
      To find the maximum, take the derivative: $60 - 0.5x = 0 \Rightarrow x = 120$.
      This is outside the valid range $[0, 40]$. Since the peak is to the right, the function increases throughout the segment. The maximum is at the boundary **$x = 40$**.
      Point: $(40, 50)$. Product: $2,000$.

  *   **Segment 2:** $y = 90 - x$.
      $$P_2 = x(90 - x) = 90x - x^2$$
      Derivative: $90 - 2x = 0 \Rightarrow x = 45$.
      This is inside the valid range $[40, 90]$.
      Point: $(45, 45)$. Product: $2,025$.

  *   **Comparison:** $2,025 > 2,000$.
      **NBS Prediction:** **£45k for A, £45k for B.**

  #### B. The Kalai–Smorodinsky Solution (KS)
  The KS solution maintains the ratio of gains equal to the ratio of maximum possible gains.
  $$\frac{x}{90} = \frac{y}{60} \Rightarrow y = \frac{2}{3}x$$

  *   **Intersection:** We test where this ray hits the frontier.
      Try Segment 2 ($y = 90 - x$):
      $$\frac{2}{3}x = 90 - x$$
      $$\frac{5}{3}x = 90$$
