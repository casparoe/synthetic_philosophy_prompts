  1.  **Probability of Gradation ($P_G$): 0.85**
      *   *Justification:* Evolutionary continuity and neural scaling strongly favor a spectrum of consciousness over a binary switch, though hard thresholds (e.g., Integrated Information Theory) cannot be fully ruled out.

  2.  **Probability Insect Weight $\ge 10^{-4}$ Human ($P_W$): 0.35**
      *   *Justification:* While complex insects (bees) may approach this, the *average* insect (e.g., simple beetles, flies) has a neural architecture ($\sim 10^5$ neurons) vastly simpler than a human's ($\sim 10^{11}$), making non-linear scaling of moral weight uncertain.

  3.  **Probability Population Ratio is Sufficient ($P_R$): 0.50**
      *   *Justification:* While the numerical ratio ($\sim 10^5$ insects per vertebrate) is robust, the "vertebrate total" is dominated by fish ($\sim 10^{13}$); if average fish sentience is $>1\%$ of a human, the insect aggregate fails to dominate even given $P_W$.

  4.  **Correction Factor for Lifespan/Intensity ($C_T$): 0.30**
      *   *Justification:* Average insect lifespans (weeks) are 1–2 orders of magnitude shorter than vertebrates (years), requiring implausibly high experiential density to maintain aggregate superiority over time.

  **Calculation:** $0.85 \times 0.35 \times 0.50 \times 0.30 \approx 0.0446$

  **Least Certain Term:**
  **Term 2 (Relative Sentience Weight).** We lack a "consciousness meter," and the relationship between neuron count/architecture and moral weight is the deepest philosophical and scientific unknown in the equation.

  **Empirical Result to Update Credence:**
  The demonstration of **centralized nociceptive processing with opioid-like analgesic modulation in a basal insect order** (e.g., Archaeognatha or Cockroaches). This would suggest pain mechanisms are not merely reflexive but involve affective regulation comparable to vertebrates, significantly raising the probability of $P_W$.
