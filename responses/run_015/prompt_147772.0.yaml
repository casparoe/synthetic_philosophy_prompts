prompt: |-
  Consider the boundary problem between legend and history in traditions where archaeological correlation and textual transmission do not converge symmetrically. Rather than offering a broad comparison, provide one precise conceptual issue that arises specifically at this boundary, using at least two of the three traditions: the Trojan War, the Arthurian cycle, and the Exodus narrative. Frame the issue through the idea of referential drift: the shift in geographical or institutional anchoring of a proper name across retellings, such that later attempts to match legend with material remains risk circular verification. Contrast how this drift functions in a tradition with a stable archaeological candidate — for instance, Hisarlik in relation to Troy, or the Sinai route in relation to the Exodus — with how it functions in a tradition that lacks any fixed geographical referent, such as Camelot in the Arthurian material. Explain the conceptual difficulty this creates for deciding when a legend has become history, without providing bibliographies, citations, or reading lists. Write your response in British English.
