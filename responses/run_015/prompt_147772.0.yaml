answer: |-
  The precise conceptual issue arising at the boundary between legend and history is the **circularity of retroactive anchoring**. This occurs when the identification of a material site depends upon the textual tradition, yet that same site is subsequently employed to validate the historicity of the tradition. This problem is framed by referential drift, wherein the geographical or institutional meaning of a proper name shifts across centuries of transmission. When archaeologists or historians attempt to fix these drifting names to physical coordinates, they risk conflating a locus of memory with a locus of event. The difficulty lies not merely in finding a match, but in determining whether the material remains caused the legend or whether the legend curated the remains.

  In the tradition of the Trojan War, referential drift is minimised by the presence of a stable archaeological candidate: the mound of Hisarlik in western Anatolia. Here, the geographical referent 'Troy' possesses a degree of continuity that allows for a seemingly straightforward correlation between text and soil. However, the circularity persists in the stratigraphic interpretation. While the site itself is fixed, the specific historical layer corresponding to the Homeric narrative has shifted over time, from the burnt strata identified by nineteenth-century excavators to later Bronze Age levels proposed by subsequent scholarship. The name 'Troy' anchors the site, but the textual expectation dictates which layer signifies the war. Consequently, the archaeology does not independently verify the legend; rather, the legend selects the archaeology. The drift is temporal rather than spatial, yet it produces the same epistemological hazard: the material evidence is rendered legible only through the lens of the poetic tradition, making it impossible to ascertain if the war occurred as described or if the description was imposed upon a known ruin.

  Contrast this with the Arthurian cycle, where referential drift functions without a fixed geographical referent. The proper name 'Camelot' does not appear in the earliest Welsh traditions and emerges in later French romances as a conceptual centre of kingship rather than a specific coordinate. Consequently, the anchoring of Camelot is entirely fluid, shifting to suit the political or cultural needs of the reteller. Sites such as Cadbury Castle, Winchester, or Caerleon have been proposed, each relying on local topography or etymology to arrest the drift of the name. Unlike Hisarlik, where the mound demands attention regardless of the text, these Arthurian sites often require the text to grant them significance. The drift here is spatial and institutional; the name moves to wherever legitimacy is required. When a candidate site is excavated, finding fortifications from the appropriate period confirms only that a stronghold existed, not that it was Camelot. The name is draped over the ruins post hoc, creating a verification loop where the legend validates the site's importance, and the site's existence is used to validate the legend.

  This contrast illuminates the conceptual difficulty in deciding when a legend has become history. In both instances, the threshold of historicity is obscured by the dependency of material identification on textual transmission. In the Trojan case, the stability of the site masks the interpretive drift of the narrative layers; in the Arthurian case, the instability of the site reveals the constructed nature of the geography. The core issue is that referential drift ensures the proper name is never a neutral label. It is either a sticky designation that accumulates contradictory historical layers, as with Troy, or a floating signifier that attaches itself to convenient ruins, as with Camelot. Therefore, the transition from legend to history cannot be achieved simply by correlating name and place. Until the material evidence can be interpreted independently of the textual expectation—a condition rarely met when referential drift has shaped the search itself—the boundary remains porous. The legend does not become history upon discovery; rather, the discovery becomes an extension of the legend.
