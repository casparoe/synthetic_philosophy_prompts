answer: |-
  The corridor lights hummed. Dr. Aris capped a marker, staring at two circles on the whiteboard.

  "The corpus callosum is gone," Aris said. "The left hemisphere sees the key, the right sees the ring. The left hand picks the key. The right hand says 'I saw nothing.' That isn't one mind with a bad connection. That's two minds sharing a skull."

  Dr. Bell leaned against the wall. "But ask the patient afterwards. They say, 'I just felt like me.' If you claim there are two subjects, you're overruling the only testimony we have."

  "Because the testimony comes from the speaking hemisphere," Aris countered. "The left side explains away the right side's actions. It confabulates. If the machinery for introspection is halved, why expect it to notice the division?"

  "Because if we ignore the report," Bell said, "then no evidence could ever prove unity. You've made 'one subject' unfalsifiable. If a patient feels unified, you say they're blind to their split. If they feel split, you say they're one. That's not science."

  Aris sighed, wiping a smudge from the board. "I concede that the patient's report of unity is sincere. They aren't lying."

  "And I concede," Bell replied, "that cutting the fibres changes something profound. The organism loses global access to its own states. But 'loss of access' isn't 'loss of self.'"

  "Is it?" Aris picked up the marker again. "Consider this new case. A callosal shunt. We implant a device to replace the fibres. We can dial the bandwidth. Zero to full. We can delay signals by a third of a second. We can drop half the packets."

  Bell frowned. "So, at half bandwidth, are there two subjects? Or one?"

  "Exactly. If unity is all-or-nothing, where is the cliff? Is it at 51% bandwidth? 52%? And if we run it in reverse—a split patient living for years, then we open the shunt gradually over a fortnight. Is that two subjects fusing? Does one die? Or is it one subject recovering?"

  "If you say one subject recovers," Bell said, "you imply the subject existed during the split, just dormant. But the left hemisphere was learning things the right didn't know. Those are distinct histories."

  "But if you say two fuse," Aris said, "you imply consciousness can merge. That suggests unity comes in degrees. But experience doesn't feel graded. I don't feel 'half united' with my left hand."

  "Unity of experience versus unity of access," Bell murmured. "I mean, whether things feel like one show versus whether one part can talk about what the other sees."

  "Right. If the shunt passes sensory data but not motor intentions, I see what my hand does, but I don't feel I willed it. Am I two then?"

  Bell rubbed her temples. "This suggests there's no fact of the matter until we define what counting a subject means. It's a convention."

  "But conventions don't feel pain," Aris said. "Subjects do."

  They stood silently for a moment.

  "Here's what we agree on," Bell said finally. "We both assume consciousness depends on information integration. That without some level of sharing, there's no 'us'."

  "Agreed," Aris said. "But here's what would change my mind. If we could train the non-speaking hemisphere to communicate independently—say, via spelling with the left hand—and it reported a separate, continuous history of experience during the split. Not just reflexes, but a narrative."

  "And for me," Bell said, "if the patient, with the shunt at full bandwidth, reported feeling like two people watching one screen. If the first-person data contradicted the integration, I'd have to accept the division. But I don't think that observation is possible. If integration is complete, the report will be unified."

  "Then we're stuck," Aris said, capping the marker.

  "No," Bell said. "We're just looking at the same mirror from different sides."
