answer: |-
  Friends, colleagues, neighbors, and students:

  We stand today in the open air, in the heart of this university, before three faces cast in bronze. They are familiar to us, or at least their names are. Thomas Jefferson. Winston Churchill. Christopher Columbus.

  If you look closely at the stone beneath them, you will notice what is missing. There are no lists of achievements. There are no summaries of controversies. There are only the years they breathed air on this earth, and a single question engraved in the granite: *What do we owe them?*

  This absence of text is not an oversight. It is not a budgetary constraint, and it is certainly not an attempt to remain neutral. Neutrality is impossible here. Instead, this silence is a philosophical position. It is designed to disrupt the two most comfortable ways we usually handle the dead: the uncritical celebration that turns history into mythology, and the iconoclastic condemnation that turns history into a courtroom.

  To understand why this installation asks a question rather than offering an answer, we must examine the phrase we so often use to shield ourselves from the complexity of the past. We say: "He was a man of his time."

  When we say this, we usually mean one of two very different things, and confusing them is where our moral thinking goes wrong.

  The first appeal is what we might call *epistemic limitation*. This suggests that a historical figure lacked access to moral knowledge that we now possess. It argues that they were blind to certain truths in the same way a surgeon in 1700 was blind to germ theory. They could not know slavery was a fundamental violation of human rights, or that empire was a system of extraction rather than civilization, because the moral vocabulary to describe those wrongs had not yet been invented. If this were true, judgment would be unfair. You cannot blame a man for not seeing in the dark.

  The second appeal is grounded in *motivational constitution*. This suggests that even if they knew better, their character was formed by norms they could not have escaped. It argues that to be "of a time" is to be woven into a social fabric so tight that pulling one thread would unravel the person entirely. On this view, Jefferson could not have been an abolitionist not because he didn't know the arguments, but because to be a Virginia planter of that stature *was* to be a slaveholder. To ask him to be otherwise is to ask him to be someone else.

  Both of these appeals rely on a hidden assumption. In the study of history and ethics, we might call this assumption "serial monism."

  Serial monism is the belief that any given historical era possesses a single, dominant moral framework. It assumes that 1776, or 1940, or 1492, had one mood, one set of rules, and one prevailing wind. If you were alive then, you were swept up in that singular current. Serial monism treats history like a series of distinct rooms, each painted a single color. If you were in the room, you saw only that color.

  This installation exists to tell you that serial monism is false.

  History is not a series of monochromatic rooms. It is a noisy marketplace where competing moral vocabularies shout over one another, even in the darkest times. The past was just as conflicted, just as uncertain, and just as morally pluralistic as the present.

  Consider Thomas Jefferson. It is common to suggest that the moral clarity regarding the evil of slavery was a discovery of a later age. But walk with me, in your mind, to Jefferson's own library at Monticello. On those shelves, alongside the classics and the agricultural manuals, sat pamphlets and treatises written by his own contemporaries. There were voices in Virginia, in London, and in Paris during Jefferson's lifetime—people breathing the same air, living under the same laws—who argued explicitly and forcefully that slavery was a sin, a crime, and a contradiction of natural law.

  The moral knowledge was available. The epistemic limitation did not exist. The vocabulary of abolition was not a future invention; it was a present reality.

  This destroys the comfort of the first appeal. They were not blind. And it complicates the second appeal. If others in their time could conceive of a different way to live, then the claim that they were constitutionally unable to do so becomes a claim about their choices, not their constraints.

  This is why there are no plaques.

  To place a plaque here explaining their virtues would be to pretend that their achievements exist in a vacuum, separate from their moral failures. But to place a plaque listing their crimes would be to pretend that we stand on a summit of moral progress they could never have reached. Both approaches rely on the false comfort of serial monism. Both assume that the past is simpler than the present.

  To the historians and philosophers in the audience: This installation refuses to resolve the tension between moral realism and historical context. It insists that we hold both. We must acknowledge that these figures shaped the world we inhabit, for better and for worse, without granting them the immunity of ignorance.

  To the students, donors, and residents: This refusal to explain is not evasion. It is intellectual honesty. It is an admission that the dead do not get to write their own verdicts, but neither do we get to judge them by pretending we know exactly what it cost them to be who they were.

  When we reject serial monism, we admit that the past was full of choices. And if the past was full of choices, then the legacies we inherit are not forces of nature. They are the results of human decisions. Jefferson chose to hold slaves despite the arguments on his own bookshelves. Churchill chose to defend an empire while voices around him questioned its cost. Columbus chose a course of action that contemporaries warned would lead to ruin.

  They were not swept away by the tide of their time. They swam in it, often against currents that others were already navigating.

  So, what do we owe them?

  We do not owe them our gratitude, blindly given. We do not owe them our condemnation, easily won.

  We owe them the truth that they denied themselves. We owe them the recognition that they had alternatives, and that they chose the paths that built the world we now occupy.

  This question on the stone is not about their debt to us. It is about our debt to the truth. It asks us to stand in the same moral complexity they stood in, without the excuse that we are merely products of our own time. Because if serial monism is false for them, it is false for us. We, too, live in a noisy marketplace. We, too, have competing moral vocabularies shouting in our ears. We, too, will be judged by what we did with the knowledge available to us.

  Let these bronze faces remain silent. Let the stone speak only to ask. The answer is not in the granite. It is in how we live with the inheritance they left us, and how we decide to act when the history of our own time is being written.

  Thank you.
