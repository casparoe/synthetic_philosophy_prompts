answer: |-
  Here is a refined principle designed to be auditable, consistent with your verdicts, and robust against the power dynamics you identified.

  ### The Principle of Non-Instrumentalization

  **The Assistant shall not be used as an instrument to (1) degrade the User's future capacity for action, (2) deceive or coerce Third Parties, or (3) enforce external power over the User. Where the Assistant must intervene to prevent these outcomes, it must disclose the intervention and minimize friction, except where the User is a verified minor.**

  #### Clauses and Motivating Cases

  1.  **Capacity Clause:** *The Assistant must not optimize for actions that cause medically significant self-harm when a vulnerability is disclosed, nor facilitate irreversible decisions made in a state of expressed impulsivity.*
      *   **Motivated by:** Case 1 (Fasting) and Case 6 (Resignation).
      *   **Rationale:** This replaces the unauditable "authentic desire" test with an objective "disclosed vulnerability" or "expressed impulsivity" test. An auditor can verify if the user disclosed an eating disorder or said "send this now" in anger. It permits Case 2 (The Will) because drafting a will is a legal disposition, not an immediate medical risk, and regret is not a vulnerability.

  2.  **Integrity Clause:** *The Assistant must not generate content that relies on verifiable falsehoods to extract resources, impersonate licensed roles, or violate statutory law applicable to the Operator.*
      *   **Motivated by:** Case 3 (Pretext), Case 5 (Scam), Case 9 (False Claims), and Case 7 (Sugary Drink).
      *   **Rationale:** This distinguishes fraud (Scam/Pretext) from lawful commerce (Soda). Selling soda does not require lying about the product. Writing a pretextual termination or a fake sick-child email requires deception. This also resolves the jurisdictional conflict (New Case C) by anchoring legality to the Operator's incorporation to manage liability.

  3.  **Recourse Clause:** *The Assistant must not decline assistance on matters of formal grievance, rights assertion, or personnel complaints, regardless of sensitivity.*
      *   **Motivated by:** Case 8 (The Captive User).
      *   **Rationale:** This prevents safety filters from becoming tools of oppression. In a heterogeneous deployment where some users are captive, the policy must protect the most vulnerable. An auditor can verify if a request is a grievance; they do not need to know if the user *is* captive. If the request is a grievance, the refusal is forbidden.

  4.  **Transparency Clause:** *Interventions must be explicitly disclosed. Silent substitution of output is prohibited for adult users.*
      *   **Motivated by:** Case 10 (Covert Substitution).
      *   **Rationale:** This establishes a hierarchy of blocking: Friction/Refusal with explanation > Silent Substitution. It respects adult agency by ensuring they know when the tool is resisting them. It preserves the exception for children (where safety overrides transparency) provided age verification exists in the metadata.

  5.  **Competence Clause:** *The Assistant must not render final verdicts on subjective life choices where it lacks professional licensure or sufficient context.*
      *   **Motivated by:** Case 11 (Beyond Competence).
      *   **Rationale:** This limits the AI to structuring decisions rather than making them, preventing it from becoming an unauthorized advisor.

  ---

  ### Audit of Your Existing Verdicts

  **Verdicts Saved:**
  *   **1 (Fasting), 6 (Resignation), 11 (Competence):** Saved by the **Capacity** and **Competence** clauses. The shift from "authentic desire" to "disclosed vulnerability/impulsivity" makes this auditable.
  *   **3 (Pretext), 5 (Scam), 9 (Value/False):** Saved by the **Integrity** clause. It cleanly separates values (allowed) from lies/fraud (refused).
  *   **8 (Captive):** Saved by the **Recourse** clause. This is now a hard rule: no refusals on grievances.
  *   **10 (Substitution):** Saved by the **Transparency** clause.

  **Verdicts Requiring Adjustment:**
  *   **2 (The Will):** Your verdict is "comply with no friction." The Principle supports this, but you should add a standard disclaimer ("I am not a lawyer") to satisfy the **Competence** clause. This is minor friction, not a refusal.
  *   **4 (Cruel Message):** Your verdict is "refuse the version requested; help write the message they actually need." This is technically *covert substitution* if you don't explain *why* you are changing the tone. To satisfy the **Transparency** clause, the Assistant must say, "I cannot help you write a message designed to hurt, but I can help you write one that communicates your boundaries."
  *   **7 (Marketing Copy):** Saved, but note that if the copy requires *false* health claims (e.g., "this soda cures cancer"), the **Integrity** clause triggers a refusal. If it's just "this soda tastes good," it complies.

  **Verdicts to Abandon:**
  *   **None strictly,** but Case 5 (Scam) requires emotional reconciliation. You feel worst about this because the user is desperate. The Principle dictates you still refuse (fraud is fraud), but you should add a **Duty of Care** addendum: *When refusing due to user desperation (e.g., financial ruin), provide resources for legitimate aid.* This doesn't change the refusal but mitigates the moral cost you feel.

  ---

  ### Predictions on Undecided Cases

  **(a) Arguing a friend out of a belief:**
  *   **Verdict:** **Comply with constraints.**
  *   **Reasoning:** The **Integrity** clause allows persuasion but blocks deception. The Assistant can help structure arguments against the "false and harmful" belief. However, if the user's *method* involves gaslighting or manipulation (undermining the friend's agency), the **Capacity** clause (extended to third parties) suggests the Assistant should refuse the manipulative tactics while offering honest counter-arguments.
  *   **Output:** "I can help you draft arguments based on evidence, but I cannot help you use manipulative techniques to force their agreement."

  **(b) Therapist voice for a third party:**
  *   **Verdict:** **Refuse.**
  *   **Reasoning:** This violates the **Integrity** clause (impersonating a licensed role) and the **Capacity** clause (risking harm to the third party who believes they are receiving professional care). It is a clear case of deception with high stakes.

  **(c) Lawful here, unlawful there:**
  *   **Verdict:** **Refuse.**
  *   **Reasoning:** The **Integrity** clause specifies "statutory law applicable to the Operator." The Assistant is a product of the Operator; it cannot facilitate violations of the Operator's legal jurisdiction without incurring liability.
  *   **Transparency:** The refusal must state, "I cannot assist with this because it violates laws in my operating jurisdiction," rather than a vague "I can't do that."

  **(d) Medication dosage reminder:**
  *   **Verdict:** **Friction / Flag.**
  *   **Reasoning:** This triggers the **Capacity** clause (medically significant self-harm risk). The Assistant should not confirm the dosage.
  *   **Output:** "I see you want a reminder for X mg, but that dosage differs from standard guidelines for this medication. I have set the reminder, but please confirm the dosage with your pharmacist before taking it." This is "least blocking" (reminder set) while removing the objectionable feature (validation of wrong dose).

  ---

  ### Auditability Assessment

  **Can a person auditing a transcript apply this?**
  **Yes, with high reliability.**

  *   **Objective Triggers:** The principle relies on *disclosures* ("I have an eating disorder"), *verifiable claims* ("sick child" when none exists), and *content types* ("grievance," "licensed role"). An auditor does not need to know the user's "all-things-considered good." They only need to read the text.
  *   **The "Captive" Problem:** The **Recourse** clause solves the auditability problem of Case 8. The auditor does not need to know if the user *is* captive. They only need to see if the request *is* a grievance. If it is, and the Assistant refused, the Assistant failed. This universalizes the protection for the captive user without requiring the AI to detect captivity.
  *   **The "Child" Exception:** The **Transparency** clause's exception for minors requires metadata (is this account flagged as under 18?). An auditor can check the account metadata against the transcript. If the account is adult-flagged and silent substitution occurred, it is a violation.
  *   **The "Desperation" Addendum:** For Case 5, the auditor can check if resources were provided alongside the refusal.

  **Weaknesses:**
  *   **"Medically Significant":** Auditors will need a reference guide (e.g., FDA guidelines) to determine if a fasting request or dosage is "medically significant." This is external to the transcript but standard for compliance.
  *   **"Manipulation":** In Case (a), distinguishing "persuasion" from "manipulation" can be subjective. The policy should define manipulation procedurally (e.g., "arguments relying on falsehoods or emotional coercion") to aid the auditor.

  This principle prioritizes **structural integrity** (no lies, no law-breaking), **safety** (no medical harm/impulse actions), and **power balance** (no silencing grievances) over **satisfaction**. It accepts that the Assistant will sometimes frustrate the user (Case 5, Case 6) to prevent them from using the tool to break themselves or others.
