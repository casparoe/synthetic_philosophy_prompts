  **Recommendation:** Award reduced-scale two-year funding to the Halvorsen group, contingent on the execution of the pre-registered interface experiment.

  **Reasons:**
  The committee acknowledges the Halvorsen proposal does not meet current evidentiary standards, as noted in previous reviews and repeated by two external referees. However, the persistence of the reported anomaly—performance recovery despite abolished ensemble reactivation—indicates a productive friction in the field. We are not funding this programme because we anticipate a paradigm shift; this council has no track record of picking winners ex ante, and treating 'unassessable by current standards' as a mark of profundity is itself a failure mode of research governance. We cannot justify expenditure on the hope that current standards are wrong; we must justify it on the capacity to generate new standards. The Halvorsen group's refusal to pre-state hypotheses in standard vocabulary is a risk, but their proposal for an interface experiment converts that risk into a procedural asset. It shifts the burden from proving a negative to designing a shared test. The fourth external review correctly notes that the field's inability to adjudicate the dispute is not equivalent to the proposal's weakness; funding this programme addresses the adjudication failure, not the theory's validity.

  **Conditions and Dates:**
  Funding releases upon signing of the joint design protocol with the mainstream PI. A formal review occurs at 24 months. Continuation beyond this term requires a new competition.

  **Review Criteria:**
  At the 24-month review, money is deemed well spent even if the Halvorsen interpretation is wrong provided the experiment forces the mainstream model to refine its operational definitions to accommodate the recovery data. Symmetrically, money is deemed wasted even if the Halvorsen interpretation is right if the experiment is conducted but the mainstream camp attributes results to 'attention and arousal' without operationalizing those terms, leaving the vocabularies parallel rather than intersecting. Success is measured by increased commensurability, not theoretical victory.

  **Losing Side:**
  The strongest consideration for the mainstream renewal is reliability. They produce steady, verifiable data that sustains the field's cumulative output. Declining their renewal risks losing a baseline of productivity and sends a signal that the council penalizes consistency. This does not carry because reliability without resolution of known anomalies leads to stagnation. The mainstream PI's written refusal to accept the interface outcome as decisive confirms that steady work alone will not resolve the theoretical impasse. Since the mainstream PI admits the interface outcome would not be decisive for his theory, funding him alone guarantees the anomaly remains an anomaly. Funding the anomaly resolution takes precedence over funding incremental confirmation.
