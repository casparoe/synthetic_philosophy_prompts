      *   To make the memo compelling and address the "waste vs. spent" constraint, a 2-year award seems most appropriate. It allows for the interface experiment without committing the full 5-year block to a theory that admits it cannot be assessed by current standards.
      *   *Decision:* Recommend funding the Halvorsen group at reduced scale (2 years), contingent on the interface experiment. This balances the risk.

