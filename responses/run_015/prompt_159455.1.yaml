      *   The Halvorsen group offers an "interface experiment" co-designed with the mainstream. This is a concrete mechanism for adjudication, even if the Mainstream PI hedges.
      *   Funding Halvorsen at *full scale* cuts the Mainstream group. Funding at *reduced scale* (2 years) is an option.
      *   Given the previous rejection (7-4) and the fact that two reviews repeat the objection, a full 5-year commitment might be too risky for a council accountable for steady output. However, the one strong review and the specific anomaly suggest there is value in resolving the impasse.
      *   A 2-year bridge/reduced scale funding seems the most prudent "actual" decision. It allows the interface experiment to proceed without completely defunding the steady producers immediately, or it forces a decision point sooner.
