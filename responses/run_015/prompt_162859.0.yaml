  # JOINT STATEMENT ON SORTITION AND ELECTIONS

  **Preamble:** We, the undersigned representatives of the lottocratic and electoral democratic camps, acknowledge that while our institutional prescriptions differ, our diagnosis of the current crisis shares significant overlap. This document records where our convergence ends and where our divergence begins, structured to isolate testable claims from definitional disputes.

  ### Section 1: Agreed Claims

  1.  **Electoral Demographics:** Elections systematically produce legislatures that are unrepresentative of the populace regarding wealth, profession, race, and age. This skew is not accidental but structural, arising from the costs of campaigning and the self-selection of candidates.
  2.  **Incentive Structures:** Electoral competition incentivizes short-term horizon planning, pandering to concentrated interests, and avoidance of complex trade-offs that require immediate sacrifice for long-term gain.
  3.  **Money and Access:** Financial capital disproportionately determines agenda-setting power and access to officeholders in electoral systems, undermining political equality regardless of formal voting rights.
  4.  **Deliberative Capacity:** Existing records of citizens' assemblies demonstrate that laypeople, when properly briefed and facilitated, can master complex policy details and produce reasoned recommendations that exceed the quality of typical partisan debate.
  5.  **Sortition's Scope:** Sortition is a claim about composition, independence from donors, and deliberative conditions. It is not a claim that random citizens possess inherent virtue, nor is it a proposal for direct democracy without institutional safeguards.
  6.  **Safeguard Necessity:** Neither system guarantees virtue or competence ex ante. Both require robust institutional constraints—whether through checks and balances or procedural rules—to prevent capture by elites or bureaucratic inertia.

  ### Section 2: Residual Disagreements

  | Question | Lottocrat Formulation | Electoral Democrat Formulation | Diagnosis |
  | :--- | :--- | :--- | :--- |
  | **Source of Legitimacy** | Legitimacy derives from the fairness of the selection procedure and the descriptive accuracy of the body. | Legitimacy derives from explicit consent via voting and the authorization of specific agents to act. | **Substantive:** Disagreement on whether consent or fairness is the primary moral ground of authority. |
  | **Mechanism of Accountability** | Accountability is secured through transparency, peer review, and ex-post evaluation of outcomes. | Accountability requires the retrospective sanction of removal; without the vote, there is no punishment. | **Verbal/Substantive:** Turns on the definition of "accountability." Lottocrats mean "responsiveness to evidence"; Electoralists mean "power to fire." |
  | **Nature of Representation** | Representation is mirroring; the body must statistically resemble the populace to think as them. | Representation is acting; the agent must be authorized to decide for the principal, regardless of resemblance. | **Verbal:** Turns on the term "representation." One means "standing for" (descriptive); the other means "acting for" (symbolic/authorized). |

  ### Section 3: Institutional Devices and Principles

  We evaluate four proposed devices based on our stated principles, noting where instinct may betray principle.

  **(a) The Twin-Panel Test:** Two random bodies deliberate the same question independently.
  *   **Lottocrat Verdict:** Favorable. Principles demand proving that outcomes are driven by procedure, not specific composition.
  *   **Electoral Democrat Verdict:** Skeptical. Principles suggest outcomes will vary wildly, proving arbitrariness.
  *   **Instinct Check:** Lottocrats may fear this test if panels diverge significantly, exposing randomness as instability rather than fairness.

  **(b) The Shadow Assembly:** A random body convened only if the sitting chamber fails a supermajority.
  *   **Lottocrat Verdict:** Favorable. Creates a pathway for sortition to check electoral gridlock.
  *   **Electoral Democrat Verdict:** Favorable. Acts as a threat to force compromise without abolishing elections.
  *   **Instinct Check:** Electoral Democrats may instinctively resist this as undermining their mandate, even if principles suggest it improves overall system stability.

  **(c) The Priced Opt-Out:** Selected members may decline by paying a fee scaled to income.
  *   **Lottocrat Verdict:** Mixed. Principles demand universal burden-sharing, but pricing reveals who can afford citizenship.
  *   **Electoral Democrat Verdict:** Hostile. Principles suggest this commodifies duty and excludes the poor despite scaling.
  *   **Instinct Check:** Lottocrats may favor this pragmatically to reduce refusal rates, contradicting their principle that service is a non-negotiable duty.

  **(d) Staff-Rotation and Competing Briefs:** Preventing bureaucracy capture via rotating staff and adversarial expert testimony.
  *   **Lottocrat Verdict:** Favorable. Essential to prevent unelected staff from becoming the real rulers.
  *   **Electoral Democrat Verdict:** Favorable. Aligns with checks and balances already desired in elected systems.
  *   **Instinct Check:** Both camps may fear loss of institutional memory, but principles demand preventing elite capture of information.

  ### Section 4: Falsifiers and Closing

  We conclude by specifying what evidence would compel us to abandon our positions.

  **Lottocrat Disconfirmation:** We would reject sortition if randomly selected bodies consistently produce policy outcomes that are more extreme, volatile, or susceptible to lobbying capture than elected bodies over a 20-year period. Specifically, if the correlation between lobbying expenditure and policy outcome remains high in sortition chambers, the claim of independence is false.

  **Electoral Democrat Disconfirmation:** We would reject the primacy of elections if elected bodies demonstrably fail to remove corrupt actors despite clear evidence and public demand, and if welfare metrics in hybrid systems consistently outperform pure electoral systems without losing civil liberties.

  **Shared Movers:** Both sides agree that a pilot program implementing a hybrid model (e.g., a bicameral legislature with one sorted house) producing superior welfare outcomes, lower corruption indices, and higher public trust than a control region would move the debate. We agree that theoretical purity matters less than measurable governance quality.

  ***

