answer: |-
  ### Strategic Concessions (First 5 Minutes)

  Before taking questions, state these three points explicitly to disarm the Methods Hawk and the Vision Scientists:

  1.  **On Power:** "Our power analysis was based on pilot effect sizes which, in hindsight, were optimistic. We are underpowered for small interaction effects, though adequately powered for the main boundary effect. I will share the raw code and data immediately after the talk for independent verification."
  2.  **On Pre-registration:** "The specific boundary location was selected based on pilot discrimination thresholds, not post-hoc fishing, but the analysis pipeline was not pre-registered. I am treating this as a strong pilot for a registered replication."
  3.  **On 'Penetration':** "I am using 'penetration' to mean 'non-informationally encapsulated processing,' not necessarily 'V1 modulation.' I am not claiming to know the neural locus, only that the effect survives controls for decision criteria."

  ---

  ### Q&A Prep Sheet: 8 Objections

  #### 1. The Replication Discrepancy (The European Group)
  **The Objection:** "A European lab ran a near-identical paradigm last year with double your N. They found the effect in confidence ratings but *not* in d′. Furthermore, their articulatory suppression was more rigorous. Given your internal reanalysis admits your suppression load was lighter, isn't it more likely your d′ effect is residual covert naming that their stricter protocol successfully eliminated?"
  **The Reply:** "That discrepancy is exactly why we included the six-point confidence rating. If the effect were purely decisional—driven by covert naming—we should see the variance absorbed by the criterion parameter ($c$) or confidence, leaving d′ flat. In our data, the d′ advantage persists even when modeling confidence separately. The difference in suppression load suggests a boundary condition: heavier suppression may force the system to rely on decision strategies (shifting confidence), while lighter suppression allows the lexical cue to tune sensitivity. The key is that *within our data*, the dissociation holds. The European data confirms the lexicon affects the task; our data specifies that under these load conditions, it affects sensitivity."
  **Soft Spot:** You are admitting your suppression was weaker, which technically makes the "perceptual" claim harder to defend if stronger suppression removes the effect.
  **Status:** *Contested.* (Whether d′ changes definitively rule out decisional noise is not settled; whether suppression load scales linearly with covert naming is not settled.)
  **Time Cost:** 3 minutes.

  #### 2. The Equal-Variance Assumption (SDT Technicality)
  **The Objection:** "You're interpreting a shift in d′ as a change in sensitivity. But d′ assumes equal variance in the signal and noise distributions. If learning the lexicon simply reduces noise for the 'between' pair but not the 'within' pair, you violate equal variance. A likelihood ratio test would show this is a criterion shift on a non-linear axis, not a sensitivity gain."
  **The Reply:** "We tested the equal-variance assumption. The slope of the zROC functions did not differ significantly between the trained and control conditions. While no model is perfect, the deviation wasn't large enough to account for the magnitude of the d′ difference we observed. Even if we use $A_z$ (area under the ROC) which is assumption-free, the category advantage remains significant."
  **Soft Spot:** If your sample size is small, your test for equal variance is underpowered, making this check unreliable.
  **Status:** *Settled.* (SDT mechanics are standard; whether zROC slopes are stable in color tasks is mostly settled.)
  **Time Cost:** 2 minutes.

  #### 3. Analytic Flexibility (The Methods Hawk)
  **The Objection:** "You mentioned the boundary was selected based on pilot thresholds. How many boundary locations did you test in pilot before finding one that worked? And did you try other transformations of the CIELAB distance before settling on the matched pairs you reported?"
  **The Reply:** "We tested three potential boundary regions in pilot to ensure they were equidistant in CIELAB and discriminable above chance. We selected the one with the most stable baseline. We did not transform the distance metric; we used Euclidean CIELAB. I am happy to show the pilot exclusion criteria and the raw discrimination thresholds for the rejected regions to demonstrate they weren't discarded for failing to show the effect."
  **Soft Spot:** If you discarded a region because the effect *wasn't* there, that is p-hacking, regardless of the reason.
  **Status:** *Contested.* (Norms on reporting pilot exclusions are shifting but not universal.)
  **Time Cost:** 2 minutes.

  #### 4. Recurrent Feedback vs. Cognition (The Neurophysiologist)
  **The Objection:** "Even if I grant you the d′ effect, you're calling it 'cognitive penetration.' But recurrent feedback from IT or PFC to V4 is just the visual system doing its job. Contextual modulation is perception, not cognition intruding on perception. Why label this 'penetration' rather than just 'visual learning'?"
  **The Reply:** "I distinguish them by the *source* of the information driving the modulation. If the tuning change is driven by a newly acquired lexical rule (a symbolic, arbitrary mapping) rather than statistical regularities in the stimulus distribution, it counts as cognitive penetration in the Fodoran sense. The training was explicitly lexical, not statistical. If the visual system changes its gain based on a symbolic rule, that breaks informational encapsulation, regardless of whether the wiring is 'recurrent feedback.'"
  **Soft Spot:** Defining "cognitive" vs. "visual" based on information source is a philosophical stipulation, not an empirical measurement.
  **Status:** *Contested.* (The definition of "cognitive" in this literature is the primary battleground.)
  **Time Cost:** 2 minutes.

  #### 5. Articulatory Suppression Efficacy
  **The Objection:** "You claim suppression blocks covert naming. But subjects are notoriously good at subvocalization even under suppression. Without a secondary task validation—like showing their digit span actually crashed during the retention interval—you can't prove they weren't naming the colors to themselves."
  **The Reply:** "We monitored error rates on the suppression task itself. Subjects maintained 95% accuracy on the articulatory stream, which typically correlates with effective blocking of phonological loop access. However, I concede we did not run a separate digit-span validation block. That is a limitation. But combined with the eye-tracking data showing no differential scanning patterns, a simple 'naming strategy' account becomes less parsimonious than a sensitivity shift."
  **Soft Spot:** You lack the direct validation of the suppression efficacy.
  **Status:** *Contested.* (How to validate suppression efficacy without interrupting the main task is an open methodological problem.)
  **Time Cost:** 2 minutes.

  #### 6. Perceptual Learning vs. Lexical Penetration
  **The Objection:** "You trained them for nine sessions. That's classic perceptual learning. You've shown that practice improves discrimination at a boundary. Why do we need 'lexicon' in the explanation at all? Isn't this just low-level tuning to the relevant stimulus dimension?"
  **The Reply:** "Because the improvement is category-specific, not just location-specific. If it were pure perceptual learning on the stimulus dimension, we should see generalization to nearby untrained boundaries or a symmetric improvement around the discrimination point. The improvement tracks the *arbitrary* named categories, including the asymmetry between the two names straddling the boundary versus the two on one side. The structure of the improvement mirrors the lexical structure, not just the physical stimulus statistics."
  **Soft Spot:** Perceptual learning can be highly specific. Distinguishing "lexical structure" from "task structure" is difficult.
  **Status:** *Contested.* (The line between perceptual learning and cognitive penetration is the core theoretical dispute.)
  **Time Cost:** 2 minutes.

  #### 7. CIELAB Uniformity (The Control Pair)
  **The Objection:** "You matched the pairs in CIELAB space. But CIELAB isn't perceptually uniform, especially in the blue-green region. Your 'control' pair might just be in a region of higher intrinsic noise. How do you know the effect isn't just a non-linearity in the color space?"
  **The Reply:** "We acknowledge CIELAB imperfections. However, we counterbalanced the assignment of categories across subjects. If the effect were due to intrinsic noise in that region of color space, it should appear regardless of where the category boundary was placed. The effect follows the *trained boundary*, not the fixed coordinates of the control pair. When we shift the boundary in the training, the d′ advantage shifts with it."
  **Soft Spot:** If you didn't fully counterbalance the boundary location across the spectrum, this reply is weak.
  **Status:** *Settled.* (CIELAB is known to be imperfect; counterbalancing is the standard fix.)
  **Time Cost:** 2 minutes.

  #### 8. Epistemic Justification (The Philosopher)
  **The Objection:** "Let's grant the empirical claim. If perception is shaped by the lexicon, perception can no longer serve as an independent check on belief. Doesn't this lead to a circularity where language confirms language through experience? What justificatory work is left for perception to do?"
  **The Reply:** "Independence doesn't require total isolation. It requires that the channel isn't *wholly* determined by the hypothesis being tested. Even if the lexicon tunes sensitivity, the sensory input still constrains the outcome—you can't learn to see red as green if the wavelength is 650nm. The justification shifts from 'foundationalist' (pure given) to 'coherentist' (mutual constraint). Perception still provides the friction; it just isn't friction from a vacuum."
  **Soft Spot:** This concedes the "independence" philosophers want. It changes the subject from epistemology to coherence.
  **Status:** *Contested.* (This is a live debate in philosophy of mind; no empirical data resolves it.)
  **Time Cost:** 2 minutes.

  ---

  ### Critical Strategy Notes

  **The Single Answer That Must Land:**
  **Objection #1 (The European Replication).**
  If you fumble this, the Vision Scientists will dismiss the data as a false positive. You must sound like you know their paper better than they do, without being defensive. Acknowledge the suppression difference immediately. Do not try to claim their study was flawed; claim the *difference* illuminates the mechanism (load-dependent locus of effect).

  **The Objection to Lose Gracefully:**
  **Objection #8 (Epistemic Justification).**
  You cannot solve the circularity problem in two minutes. If pressed, say: "That's a consequence I'm willing to accept. My claim is descriptive (how the system works), not normative (how it ought to justify). I'll leave the epistemic implications for the paper's discussion section."

  **Time Budget:**
  *   **Total Q&A Time:** Assume 20 minutes.
  *   **Cost per Reply:** Aim for 90 seconds to 2 minutes.
  *   **Buffer:** If you talk longer than 2 minutes on #1 or #2, you will run out of time for the philosophers. Cut the technical SDT details short if you see eyes glazing over.

  **Settled vs. Contested Legend:**
  *   **Settled:** Facts or methods generally accepted by the room (e.g., CIELAB limitations, SDT math). *Strategy:* Stand firm.
  *   **Contested:** Theoretical interpretations or definitions (e.g., what counts as "cognitive," whether d' proves perception). *Strategy:* Acknowledge the dispute, frame your choice as the most productive working hypothesis.

  **Final Note on the "European Group" Dread:**
  Do not wait for them to ask. If possible, weave a sentence into your conclusion: "We are aware of recent work suggesting this effect may be sensitive to suppression load, appearing in confidence under high load and sensitivity under lower load. Reconciling these boundary conditions is our next step." This shows you are on top of the literature and removes the "gotcha" sting.
