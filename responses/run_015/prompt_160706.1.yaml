prompt: |-
  I run the philosophy club at my high school. We meet for one 55-minute period on Thursday afternoons, usually 13 to 16 students aged 16 to 18, with very uneven mathematical confidence: a few do competition maths, most have met averages and perhaps a little probability, and none has studied decision theory. We have no budget, a whiteboard but no projector, and I would rather not put real money in front of them; points convertible into something trivial at the last meeting of term are fine.

  I want to build a session around the two-envelope paradox, but as something they *do* rather than something I describe. Please design it as a runnable game, with these things I want them to walk out having felt rather than been told:

  First, that the argument for switching is genuinely seductive and not obviously stupid. I want them to generate it themselves, in their own words, before anyone names it or writes a formula.

  Second, that the claim at the centre of it — that whatever amount I hold, the other envelope is equally likely to hold half or double — cannot possibly be true of every amount I could see. I want them to collide with the ceiling of the distribution rather than hear about it.

  Third, that the argument is completely indifferent to scale and to cost: if it works for four units it works for four billion, and it works just as well if every switch costs you a chip. I want that indifference to strike them as a symptom rather than as a virtue.

  Fourth, and most important: that opening the envelope is not epistemically inert. A rule that depends on what you see can really earn more than always keeping, even though always switching cannot beat always keeping inside a closed pair. That combination is the thing I most want them to sit with, and I am not sure how to stage it so that both halves land.

  Concretely, I need:

  Materials and preparation: what to print, how many envelopes or cards, how to generate the pairs so I can do it in five minutes without arithmetic errors.

  Three rounds, roughly 12, 20 and 10 minutes: a blind round (choose an envelope, offered a switch, repeated, never look); a peek round (look at your own amount first, then decide, with the pair amounts drawn from a distribution whose ceiling is kept secret and which they are invited to infer from the values they have seen); and a friction round where every switch costs a fixed number of chips.

  A closed-system element: I would like one student to play the house, keeping a ledger, so that any gain to the room has to come out of somebody's column. If you think that will misfire, say so and propose something better.

  A prediction sheet they fill in before playing and return to after, with the questions you think are worth asking.

  A short note on what the facilitator is allowed to say. I want almost nothing: no mention of expected value, priors, or the name of the paradox until the last round is finished.

  A debrief that maps specific moments in the game onto the specific claims above — which round is supposed to make which point, what I should write on the board and when, and how to reveal the hidden ceiling so that it arrives as a discovery rather than as an announcement.

  An honest account of what will predictably go wrong the first time I run it: the student who refuses to engage with points, the student who announces the answer in round one, the arithmetic that someone will get wrong, and how to handle each without breaking the staging.

  Finally, be frank about which part of the problem this activity cannot reproduce and which part I will simply have to supply myself in the debrief. I suspect it is the point about no probability distribution over all amounts being able to make the equal-odds claim come out true, but tell me if you think it is something else, and tell me the least lecturing way to say it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** High school philosophy club, 55 mins, 13-16 students (ages 16-18), mixed math confidence (some competition math, most basic stats, no decision theory).
      *   **Constraints:** No budget, whiteboard only, no real money (points system), facilitator wants minimal lecturing during the game.
      *   **Goal:** Teach the Two-Envelope Paradox through *experience* (game) rather than *exposition*.
      *   **Key Learning Objectives (Feelings):**
          1.  The switching argument is seductive (generate it themselves).
          2.  The "equal likelihood of half/double" claim breaks at distribution limits (collide with the ceiling).
          3.  Scale/Cost indifference is a symptom, not a virtue.
          4.  Opening the envelope *is* epistemically useful (conditional strategy > blind strategy).
      *   **Structure:**
          *   Materials/Prep (quick setup).
          *   Three Rounds: Blind (12m), Peek/Inference (20m), Friction/Cost (10m).
          *   Closed System (Student "House").
          *   Prediction Sheet.
          *   Facilitator Constraints (No EV/Priors talk until end).
          *   Debrief (Map game moments to objectives).
          *   Troubleshooting (What goes wrong).
          *   Limitations (What the game can't show).

  2.  **Deconstruct the Paradox & Game Design:**

      *   *The Paradox:* You have Envelope A. Envelope B has either $2A$ or $A/2$. Expected value of switching = $0.5(2A) + 0.5(A/2) = 1.25A$. So switch. But then you have B, and the same logic applies. So switch back. Contradiction.
      *   *The Flaw:* The assumption that $P(B=2A | A=x) = P(B=A/2 | A=x) = 0.5$ for *all* $x$ is impossible for a proper probability distribution (you can't have a uniform distribution over infinite positive reals). There must be a maximum amount.
      *   *The Solution:* If you see an amount $x$, and you know the maximum possible amount $M$, if $x > M/2$, you know you have the larger envelope. If $x$ is small, switching might be +EV.
      *   *Game Mechanics:*
          *   Need physical envelopes or cards. Cards are easier to manage than stuffing cash/envelopes quickly. Let's use index cards inside manila envelopes (or just folded paper if budget is truly zero, but "envelopes" adds tactile weight). Let's assume folded paper slips inside generic envelopes to keep cost near zero.
          *   *Round 1 (Blind):* Establishes the baseline. Switching blindly vs. Keeping blindly should yield same result over time. This highlights that the *act* of switching isn't magic.
          *   *Round 2 (Peek):* This is the crux. Students see $x$. They need to decide to switch. To make the "ceiling" matter, the distribution of money needs a hard cap. If they see a number near the cap, they should keep. If they see a low number, they should switch. This teaches Objective 2 & 4.
          *   *Round 3 (Friction):* Add a cost to switch. If the EV argument were universally true ($1.25x$), a small cost shouldn't stop it. But since the edge is thin or non-existent, cost kills the strategy. Teaches Objective 3.
          *   *The "House":* A student banker. Zero-sum game. If players win, House loses. This makes the stakes feel real (points-wise).

  3.  **Drafting the Plan - Section by Section:**

      *   **Materials:** Need pairs of numbers. $(x, 2x)$. Need a distribution. A geometric distribution works well for "ceiling" feel without being obvious, but a hard cap is easier for high schoolers to grasp. Let's use a deck of cards mechanism or pre-written slips. Pre-written slips are safer for time.
          *   *Prep:* 20 pairs of slips. Pairs like $(10, 20), (20, 40)...$ up to a max like $(1280, 2560)$. Put each pair in two opaque envelopes.
          *   *Currency:* Poker chips or just tally marks on the "House" ledger. Tally marks are zero budget. Let's use "Club Points."
      *   **Rounds:**
          *   *Round 1:* Pick envelope. Offer switch. Do not open. Repeat 5 times. Record win/loss relative to starting value (actually, since they don't see value, they just record "Switched" or "Kept" and final points awarded). *Correction:* If they don't open, they don't know if they won. The House knows. The House records the outcome.
          *   *Round 2:* Pick envelope. Open it. See $x$. Decide Switch/Keep. House reveals other envelope. Calculate score. *Crucial:* The distribution must have a visible max eventually.
          *   *Round 3:* Same as Round 2, but switching costs 10% of the held value (or flat fee). Flat fee is easier math. Let's say 50 points.
      *   **Prediction Sheet:** Needs to capture intuition before math. "If you see \$100, do you switch?" "Does switching blindly help?"
      *   **Facilitator Script:** Strict constraints. "What do you notice?" "Why did you decide that?" No "Expected Value."
      *   **Debrief:** Connect the feelings. Round 1 = Indifference. Round 2 = Information matters (Ceiling). Round 3 = Cost kills weak edges.
      *   **Troubleshooting:** The "Math Kid" who ruins it. The "Apathetic Kid." Arithmetic errors.
      *   **Limitations:** The game shows *that* the distribution matters, but not *why* a uniform distribution over infinity is impossible. That needs a whiteboard explanation at the end.

  4.  **Refining the Mechanics (Self-Correction):**

      *   *Issue:* In Round 1, if they don't open, how do they know they gained points?
      *   *Fix:* The House records the value. At the end of the round, the House announces total payout for "Switchers" vs "Keepers." Or, simpler: Students commit to a strategy (Always Switch vs Always Keep) for 5 hands. House reveals values after.
      *   *Issue:* Round 2 "Ceiling." If I just pick numbers, they might not hit the ceiling.
      *   *Fix:* I need to rig the deck slightly or ensure the max is reachable. Better: Use a specific set of 15 pairs. Max value is \$2560. Min is \$10. If someone sees \$2560, they *know* they can't double. If they see \$10, they might suspect they can double.
      *   *Issue:* "House" student.
      *   *Fix:* Make it a competition. Class vs. House. If Class net positive, everyone gets a point. If House net positive, House gets a prize (or bragging rights). This aligns incentives.
      *   *Math Level:* Keep numbers powers of 2 times 10. \$10, \$20, \$40... \$2560. Easy doubling/halving mentally.
      *   *Time:* 55 mins is tight. 12+20+10 = 42 mins. Leaves 13 mins for intro/debrief. Doable.

  5.  **Addressing Specific User Constraints:**

      *   *Seductive Argument:* In Round 2, ask them to justify their switch. They will naturally say "It could be double or half."
      *   *Ceiling:* In Round 2, someone will eventually get the max. Ask them why they kept.
      *   *Scale/Cost:* Round 3 handles this.
      *   *Epistemic Value:* Compare Round 1 (blind) results to Round 2 (peek) results.
      *   *No Lecturing:* Facilitator guide must be strict.
      *   *Limitations:* Acknowledge the "infinite prior" issue is theoretical, not empirical.

  6.  **Final Polish:**

      *   Make the Prediction Sheet specific.
      *   Ensure the "House" role is clear but not burdensome.
      *   Write the "What Goes Wrong" section honestly (e.g., students treating it as gambling rather than logic).
      *   Clarify the "Infinite Distribution" explanation for the end.

  7.  **Review against constraints:**
      *   55 mins? Yes.
      *   13-16 students? Yes, group them if needed or run as whole class with volunteers. *Correction:* 16 students doing individual trials takes too long.
      *   *Pivot:* Run it as **teams**. 4 teams of 4. Each team makes a decision. This speeds up Round 1 & 2. Or, run it as a "Market."
      *   *Better Pivot:* To ensure everyone *feels* it, use a "Simultaneous Play" method. Everyone gets an envelope at the same time.
      *   *Logistics:* 16 envelopes prepared in advance.
      *   *Round 1:* Everyone picks. Facilitator says "Switch?" They raise hands. House calculates.
      *   *Round 2:* Everyone picks. Opens. Facilitator says "Switch?" They raise hands.
      *   *This is faster.* Let's design for simultaneous play.

      *(Self-Correction on Simultaneous Play)*: If everyone plays at once, I need 16 sets of envelopes. That's 32 slips. Prep time might exceed 5 mins.
      *Alternative:* Use a "Dealer" system. 4 Dealers (students). Each Dealer has a stack of pairs. The rest are players. Rotate dealers? No, too complex.
      *Best Compromise:* Prepare 5 sets of envelopes. Pass them around. 3 rounds x 5 hands = 15 hands total. 16 students. Some watch, some play.
      *Actually, best for "Feeling":* Every student needs to make a decision.
      *Solution:* Use **Cards** instead of Envelopes. It's faster to shuffle and deal.
      *Deck:* Create a custom deck of 30 cards. 15 Pairs. (10, 20), (20, 40)... (1280, 2560).
      *Round 1:* Deal one card face down. Offer swap for the "partner" card (which the House holds). *Wait, Two Envelope requires the other envelope to exist.*
      *Okay, stick to Envelopes but simplify.*
      *Prep:* 20 Envelopes. Inside are slips. 10 Pairs.
      *Procedure:* 5 volunteers at the front per round? No, excludes most.
      *Procedure:* All students get an envelope. But I only have 10 pairs.
      *Okay, I will instruct the user to prepare 16 pairs (32 envelopes). It takes 10 mins to write numbers on slips. It's worth it for the experience.*
      *Wait, User said "generate pairs... in five minutes".*
      *Okay, I need a generation method that is fast.*
      *Method:* Use a standard deck of playing cards? Red = Small, Black = Big? No, needs specific ratios.
      *Method:* Dice? Too random.
      *Method:* Pre-printed sheet cut up. I will provide the numbers to write.
      *Okay, I will advise the "House" student to help prep. That counts as "prep time" not "session time".*

      *Let's refine the "House" role.* One student manages the ledger. They need to know the pairs.
      *Let's refine the "Ceiling".* If I use powers of 2 ($10 \times 2^n$), the math is easy.
      *Max:* $10 \times 2^8 = 2560$.
      *Min:* $10$.
      *Pairs:* $(10,20), (20,40), (40,80), (80,160), (160,320), (320,640), (640,1280), (1280,2560)$.
      *That's 8 pairs. I need more for 16 students.* Duplicate them. 2 sets of 8 pairs = 16 pairs. Perfect for 16 students.
      *Prep:* Write these 16 pairs on slips, put in envelopes. Time: 10 mins. I'll tell the user to get a helper or do it before the club starts.

      *Wait, Round 2 "Inference".* They need to infer the ceiling. If they see 2560, they know. If they see 1280, they wonder.
      *Round 3 "Friction".* Cost to switch.

      *Okay, ready to write.*

  8.  **Final check on "Epistemically Inert":**
      *   Round 1 (Blind): Switching = Keeping (statistically).
      *   Round 2 (Peek): Switching > Keeping (if using threshold strategy).
      *   This contrast proves opening the envelope provides information.
      *   I need to make sure the debrief highlights this comparison.

  9.  **Final check on "Infinite Prior":**
      *   The game cannot prove infinity is impossible. It only shows *this* distribution has a limit.
      *   I need to explain in the "Limitations" section that the game simulates a *finite* world, and the paradox relies on an *infinite* assumption which is physically impossible.

  10. **Tone:** Professional, practical, respectful of the teacher's constraints.

  *(Self-Correction during drafting)*: Make sure the "House" doesn't get bored. Give them a specific script for tallying.
  *(Self-Correction)*: Ensure the "Math Kid" is managed. Give them a job (House?) or warn the teacher to shut them down gently.
  *(Self-Correction)*: Prediction sheet needs to be collected and returned.

