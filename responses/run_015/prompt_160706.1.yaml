answer: |-
  Here is a complete session plan designed for your constraints. It prioritizes tactile experience over exposition and uses the game mechanics to force the contradictions you want them to feel.

  ### 1. Materials and Preparation (10 Minutes Max)

  You need a "closed economy" of values. Do not use real money. Use "Club Points" (CP).

  **The Slips (The Distribution)**
  You need 16 pairs of numbers. To keep arithmetic fast for everyone, use powers of 2 scaled by 10.
  *   **The Pairs:** $(10, 20), (20, 40), (40, 80), (80, 160), (160, 320), (320, 640), (640, 1280), (1280, 2560)$.
  *   **Quantity:** Make **two** complete sets of these 8 pairs. This gives you 16 pairs total, one for each student.
  *   **Prep:** Write the numbers on small slips of paper. Fold them. Put each pair into two identical, opaque envelopes (or folded paper sleeves if budget is zero). Label the outside of the envelopes "A" and "B" lightly in pencil so *you* know which is which, but ensure the students cannot tell.
  *   **The Ceiling:** The maximum possible value in the game is **2560**. This is the secret "ceiling."

  **The Ledger**
  *   Print or draw a simple grid on a sheet of paper for the "House."
  *   Columns: `Player ID`, `Round`, `Held Value`, `Other Value`, `Decision (K/S)`, `Net Change`.

  **The Prediction Sheet (One per student)**
  *   *See Section 4 below.*

  **The House**
  *   Select one student to be "The House." Give them the Ledger, a calculator (optional, but mental math is better for flow), and the master key (a list of which envelope contains which number for each pair).
  *   **Incentive:** If the Class ends the session with a net positive score, the House loses. If the Class ends net negative, the House wins a trivial prize (first pick of snacks next week, etc.). This makes the House adversarial but honest.

  ---

  ### 2. The Three Rounds (42 Minutes Total)

  **General Rule:** You (Facilitator) do not explain *why*. You only manage the flow. If asked "Should I switch?", your answer is "That is the question."

  #### Round 1: The Blind Faith (12 Minutes)
  *Goal: Establish that blind switching is statistically inert.*
  1.  Deal one envelope to each of the 15 players (House does not play).
  2.  **Instruction:** "Do not open this envelope. You hold a value. I am offering you the chance to swap your envelope for the partner envelope in your pair. You must decide: Keep or Switch. You will not know the value until the end of the round."
  3.  Players write their decision on a scrap paper.
  4.  **The Swap:** Collect the "Switch" slips. Physically swap those envelopes with their partners (you know which are partners).
  5.  **Reveal:** Players open envelopes. The House records the values and calculates points.
      *   If they Kept: Score = Value in envelope.
      *   If they Switched: Score = Value in new envelope.
  6.  **Tally:** The House announces the Class Average for "Keepers" vs. "Switchers."
  7.  **Expected Outcome:** The averages will be nearly identical.
  8.  **Facilitator Note:** Write on board: *Round 1: Blind Switching = Blind Keeping.* Do not explain why.

  #### Round 2: The Peek (20 Minutes)
  *Goal: Collide with the ceiling; realize information has value.*
  1.  Reshuffle and redeal envelopes.
  2.  **Instruction:** "Open your envelope. Look at your number. Now decide: Keep or Switch. You may discuss with your neighbors *why* you are deciding, but you must make your own choice."
  3.  **The Trap:** As they discuss, they will naturally generate the paradox argument ("If I have 100, the other is 50 or 200. 200 is bigger than 50, so I should switch"). Let them say this. Do not validate it.
  4.  **The Ceiling Collision:** Eventually, a student will open **2560**. They will realize they cannot double. They will Keep.
  5.  **The Inference:** A student with **1280** will hesitate. A student with **10** will likely Switch.
  6.  **Resolution:** Players announce decisions. House reveals the partner value. Scores calculated.
  7.  **Tally:** The House announces the Class Average.
  8.  **Expected Outcome:** If students play intuitively (switch on low, keep on high), the Class Average should beat the "Always Keep" baseline.
  9.  **Facilitator Note:** Write on board: *Round 2: Seeing changed the result.* Ask: "Did anyone see a number that made them *certain* not to switch?" (Elicit the 2560 reveal).

  #### Round 3: The Friction (10 Minutes)
  *Goal: Show scale/cost indifference is a symptom of error.*
  1.  Reshuffle and redeal.
  2.  **Instruction:** "Open your envelope. You may Switch, but it costs **100 CP** to switch. If you Keep, cost is 0."
      *   *Math:* Final Score = (Value in Final Envelope) - (Switch Cost).
  3.  **The Conflict:** The "1.25x" argument suggests switching is always good. But now, if you have 160, switching expects 200 (gain 40). But cost is 100. Net loss.
  4.  **Resolution:** Play out the round.
  5.  **Tally:** House announces results. Likely, the Class profit drops significantly compared to Round 2.
  6.  **Facilitator Note:** Write on board: *Round 3: Cost killed the edge.*

  ---

  ### 3. Closed-System Element (The House)

  **Will it misfire?**
  It risks misfiring if the House feels like a servant rather than a player.
  **Fix:** Give the House a "Veto." In Round 2 and 3, if the Class's total net gain exceeds a certain threshold (e.g., +2000 CP), the House can invoke "Audit" and force a re-roll on one pair of their choice. This gives them agency.
  **Ledger Management:** The House must record the *pair* values, not just the player's held value. This ensures that at the end, you can prove the total money in the system was constant. The Class only wins if they extract more from the specific pairs than they put in.

  ---

  ### 4. The Prediction Sheet

  Hand this out **before Round 1**. Collect it **after Round 3**.

  > **PHILOSOPHY CLUB: THE ENVELOPE GAME**
  >
  > **Before we play:**
  > 1. I have an envelope. You offer me the other one. I don't know the amounts. Do I switch?
  >    [ ] Yes  [ ] No  [ ] Indifferent
  >    *Why?* _________________________________________________
  >
  > 2. I open my envelope. It says $100. The other is either $50 or $200. Do I switch?
  >    [ ] Yes  [ ] No  [ ] Indifferent
  >    *Why?* _________________________________________________
  >
  > 3. If switching is good for $100, is it good for $1,000,000?
  >    [ ] Yes  [ ] No
  >
  > 4. If switching costs $10, does that change your answer to #2?
  >    [ ] Yes  [ ] No
  >
  > **After we play:**
  > 5. Did looking at the number change your strategy? How?
  > 6. Did anyone ever feel *sure* they had the bigger envelope? What number did they see?
  > 7. Look at your answer to #2. Do you still agree with it?

  ---

  ### 5. Facilitator Constraints (The "Black Box" Rule)

  You are the referee, not the teacher, until the debrief.
  *   **Forbidden Words:** "Expected Value," "Probability," "Prior," "Distribution," "Paradox," "Infinite."
  *   **Allowed Phrases:** "What did you notice?" "Who saw a number that stopped them?" "Does the cost change the math?" "Compare Round 1 to Round 2."
  *   **Handling the "Math Kid":** If a student says, "The EV is 1.25x, we should always switch," your response is: "That is a hypothesis. Test it in Round 2. If it works, the House pays."
  *   **Handling Arithmetic:** If a student struggles with $1280 / 2$, allow them to ask the House. The House is the bank; they must verify transactions.

  ---

  ### 6. The Debrief (13 Minutes)

  Map the game moments to your four learning objectives.

  **1. The Seduction (Round 2 Discussion)**
  *   *Ask:* "In Round 2, many of you switched on low numbers. What was the thought?"
  *   *Board:* Write their words: "Could be half or double." "Double is worth more."
  *   *Point:* Acknowledge this feels logical. It is not stupid. It is seductive.

  **2. The Ceiling (Round 2 Reveal)**
  *   *Ask:* "Who saw 2560? Did you switch?" (They will say No). "Why?"
  *   *Point:* "Because you knew there was no 5120."
  *   *Board:* Draw a number line. Mark the Max.
  *   *Conclusion:* "If the 'half or double' rule were true for *every* number, 2560 would also have a double. It didn't. So the rule breaks at the top. If it breaks at the top, it can't be perfectly true everywhere."

  **3. Scale and Cost (Round 3)**
  *   *Ask:* "In Round 3, a small cost stopped the switching. If the '1.25x' rule were universally true, a small cost shouldn't stop it. 1.25x is a huge edge."
  *   *Point:* "The fact that a tiny fee kills the strategy proves the edge was tiny to begin with. The '1.25x' advantage was an illusion."

  **4. Epistemic Value (Round 1 vs Round 2)**
  *   *Ask:* "Compare Class Scores. Round 1 (Blind) vs Round 2 (Peek)."
  *   *Point:* "Blind switching earned nothing. Peek switching earned points. Opening the envelope gave you *information*. It wasn't inert. It told you where you were in the distribution."

  ---

  ### 7. Troubleshooting: What Will Go Wrong

  **1. The "Answer" Announcer**
  *   *Risk:* A student who knows the paradox shouts "It's because of the prior distribution!" in Round 1.
  *   *Fix:* Pre-brief the House. If anyone uses technical jargon, the House fines them 50 CP for "Market Manipulation." Keep it colloquial.

  **2. The Apathetic Gambler**
  *   *Risk:* A student treats it like a slot machine, switching randomly, ignoring the logic.
  *   *Fix:* During Round 2 discussion, explicitly ask them: "What number did you see? Why did you switch?" Force them to articulate a reason, even if it's weak.

  **3. Arithmetic Errors**
  *   *Risk:* Someone calculates $1280 / 2$ wrong and thinks they should switch.
  *   *Fix:* The House is the arbiter of truth. All score calculations go through the House. This slows the game slightly but ensures accuracy.

  **4. The Ceiling Isn't Hit**
  *   *Risk:* With 15 players and 16 pairs, it's possible no one draws the 2560 pair.
  *   *Fix:* If Round 2 ends without the 2560 appearing, *you* reveal it. "I am the Bank. I tell you now, the maximum value in play was 2560. Would anyone who saw 1280 change their decision?" This preserves the lesson without relying on RNG.

  ---

  ### 8. Limitations: What You Must Supply

  The game cannot reproduce the **mathematical impossibility of a uniform prior over infinite reals.**

  *   **What the game shows:** In *this* specific game, there was a maximum number. Therefore, the "equal odds" rule failed at the top.
  *   **What the game hides:** Why can't we just make the maximum number bigger? Say, a trillion?
  *   **The Lecturing Bit (Last 5 Minutes):**
      You must explain this verbally.
      *   *Say:* "You might think, 'Okay, just make the max 1 trillion.' But to make the 'half or double' argument work for *every* number, you need the probability of seeing any number to be the same. You need a flat line that never drops."
      *   *Draw:* A probability graph.
      *   *Say:* "In math, you cannot have a flat line that goes on forever and still adds up to 100%. It's impossible. There *must* be a drop-off somewhere. The paradox asks you to assume something that cannot exist: a game with no ceiling. We played a game with a ceiling. That is why the paradox broke."

  This approach ensures they feel the contradiction in their guts during the game, and only use the theory to clean up the mess afterward.
