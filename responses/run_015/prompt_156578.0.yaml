  I've come around to thinking that weakness of will isnt actually a failure of self-control but a rational stalemate driven by hyperbolic discounting. The core claim is that your present self treats future selves as distinct strategic agents with unreliable commitment devices — think of it like a shadow-contract problem — and because the discount curve spikes right near now, the present self correctly predicts that any long-term plan gets undermined by the near-future self. So akrasia becomes a stable equilibrium: youre not failing to do what you judge best, youre rationally refusing to sign contracts you know will be broken. What would count against this? I want defeaters ranked from fatal to awkward — empirical findings on discount curves, phenomenological mismatches, maybe formal results showing the equilibrium collapses — plus an honest take on whether this has been qualified into unfalsifiability, and if so whether thats actually a problem for this kind of view. Also tell me which objections defenders of this framing would themselves concede as damaging, versus ones they'd write off as category errors. No need for citations or reading lists, just the actual exposure map.
