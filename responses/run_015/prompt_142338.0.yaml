  7.  **Final Polish:** Ensure the tone is respectful but rigorous, matching the undergraduate's high level of sophistication. (Self-Correction: Make sure the replies don't sound *too* polished; they need to sound like something a student can actually say under pressure.)

  8.  **Final Check on Ossian:** The user asks: "Tell me whether I am right that this is the one to fear, whether my apparatus can absorb it, or whether something worse is waiting that I have not seen."
