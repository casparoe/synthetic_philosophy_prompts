      *   **Cases:** Trojan War (Classical period), Arthurian Legend (Medieval/Early Modern), Exodus (Second Temple/Liturgical).
      *   **Respondents:**
          1.  Archaeologist (Bronze Age Aegean/Anatolia, evidence-first, anti-theory).
          2.  Cultural Memory Theorist (Affect, trauma, postcolonial, anti-positivist).
          3.  Analytic Philosopher of History (Necessary/sufficient conditions, circularity, semantics vs. epistemology).
          4.  Historian of Ancient Judaism (Minimalist/Maximalist politics, liturgical load).
      *   **Friend's Warning:** Trojan half is weakest.
      *   **User's Fear:** The Ossian case (forged but had load + uptake).
      *   **Deliverables:**
          *   9-10 objections (ordered by likelihood/damage), attributed to specific respondents, phrased in their voice, with 2-minute replies + weakness note.
          *   What to concede up front.
