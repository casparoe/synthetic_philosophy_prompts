  6.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address the ecology grad student's point? *Adjustment:* Make sure to explicitly mention the "pasture vs. cropland" wild animal displacement issue in the ethical analysis.
      *   *Check:* Is the recommendation vote-able? *Adjustment:* Phrase it as a motion.
      *   *Check:* Is the tone too harsh on the petitioners? *Adjustment:* Validate their utilitarian logic before explaining its limitations. They did the math; we need to check the variables.

  7.  **Final Review against constraints:**
      *   Does it dodge the "Beef vs Chicken" ethics? No, it uses them to justify the Plant Default.
