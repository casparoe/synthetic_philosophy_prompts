prompt: |-
  I'm a PhD student in environmental policy and I somehow got roped onto our university's Dining & Sustainability Committee (the story involves me volunteering at a bake sale table, long story). At the last meeting a student group presented a petition, maybe 1,500 signatures, asking us to make beef the default protein on the main dining halls' hot line instead of chicken — default meaning the unmarked option you get unless you opt out, since apparently defaults move actual behavior a lot. Their argument: a chicken-based diet kills something like two hundred animals a year while a beef-based one kills well under one (they had a spreadsheet, with per-calorie adjustments and everything), so switching the default would prevent an enormous number of animal deaths. Some committee members are genuinely sympathetic. Others think it's insane that the same committee that signed the carbon-neutrality pledge would push more beef, since beef is basically the worst food there is for emmissions and the petition says nothing about that. And the campus vegan caucus is furious that we're even debating it, on the grounds that anything short of a plant-based default is a betrayal — they also claim the spreadsheet is bogus because cattle eat a ton of feed crops, so every burger comes with the animals that died producing the feed. Then a grad student in ecology on the committee muttered something about pasture vs. cropland and how wild animals figure in all this, and nobody engaged with it because it was 9pm and everyone wanted to go home.

  Draft the memo I'll circulate before next month's meeting. It needs a concrete recommendation the committee can actually vote on — adopt the switch as petitioned, reject it, or something in between (e.g., rotating default, or a plant-based default with meat opt-ins) — with a timeline attached. More importantly, it should engage the hardest philosophical issue instead of dodging it: is the morality of this measured in deaths, in suffering, or in something else? A broiler's life is short and reportedly miserable; a beef cow's is much longer and maybe better, maybe not — so does "fewer deaths" even track the thing we should care about? And it should say something honest about the feed-crop objection and the wild-animal stuff the petition just ignores, including the awkward possibility that we know so little about the moral status of the animals killed in crop cultivation (pests, whatever gets shredded in tilling) that the numbers can't settle the question either way. Please don't land on "more study needed" as your actual recommendation — make a call, be upfront about which side has the stronger argument even if it's the side that loses, and note what the recommendation costs the losers.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in Environmental Policy (user) on the University Dining & Sustainability Committee.
      *   **Task:** Draft a memo for the next committee meeting.
      *   **Context:** A student petition (1,500 signatures) wants to make *beef* the default protein instead of *chicken* to reduce animal deaths (chicken = many small deaths, beef = few large deaths).
      *   **Conflicts:**
          *   Petitioners: Focus on minimizing *count of deaths*.
          *   Climate/Sustainability Wing: Beef is high carbon (violates carbon-neutrality pledge).
          *   Vegan Caucus: Wants plant-based default; argues feed crops kill animals too (hidden deaths).
          *   Ecology Grad Student: Mentioned pasture vs. cropland and wild animal suffering (ignored previously).
      *   **Requirements:**
          *   Concrete recommendation (vote-able option + timeline).
          *   Engage the hardest philosophical issue (deaths vs. suffering vs. other metrics).
          *   Address the feed-crop objection and wild animal uncertainty honestly.
          *   *No* "more study needed" cop-out. Make a call.
          *   Acknowledge the costs to the losing side.
          *   Tone: Professional, academic yet actionable, ethically rigorous, diplomatic but firm.

  2.  **Determine the Recommendation:**
      *   *Option A: Adopt Beef Default.* Bad for climate goals. Ignores suffering intensity. Likely vetoed by admin due to carbon pledge.
      *   *Option B: Keep Chicken Default.* Maintains status quo. Ignores the "fewer deaths" argument. High carbon compared to plants.
      *   *Option C: Plant-Based Default.* Best for climate. Best for avoiding direct slaughter. Hardest sell politically (student pushback on "nanny state").
      *   *Option D: Rotating/ Hybrid.* Weak leadership.
      *   *Decision:* The prompt asks to engage the *hardest philosophical issue* (deaths vs. suffering) and the *climate issue*. A pure "Beef Default" is unsustainable given the university's carbon pledge. A pure "Plant Default" ignores the nuance of the petition (which is about *meat* defaults). However, as an Environmental Policy PhD, the climate argument is usually paramount in this specific institutional context. But the prompt specifically highlights the *animal ethics* dilemma.
      *   *Strategic Choice:* The most defensible position that balances the carbon pledge, the animal ethics nuance, and the feed-crop issue is a **Plant-Forward Default with Opt-In Meat (Rotating Source)**. However, to directly address the petition's specific ethical claim (deaths vs. suffering), I need to explicitly reject the "Beef Default" while acknowledging its ethical logic, and pivot to a Plant Default as the only option that satisfies *both* climate and the "least harm" principle (when including crop deaths).
      *   *Refinement:* Actually, the prompt asks to "make a call." If I recommend Plant-Based, I sidestep the Chicken vs. Beef debate entirely. Is that dodging? No, it resolves it by moving up the hierarchy. But the prompt asks to engage the "deaths vs. suffering" debate specifically.
      *   *Better Recommendation:* **Reject the Beef Default, Maintain Chicken as the *only* meat default option (if meat must be served), but transition to a Plant-Based Default over 1 year.**
      *   *Wait, let's look closer:* The prompt asks to engage the "deaths vs. suffering" debate. If I just say "Go Vegan," I'm agreeing with the Vegan Caucus but not necessarily engaging the "Beef is better because fewer deaths" argument deeply enough.
      *   *Best Path:* Recommend **rejecting the Beef Default** and **accelerating the transition to a Plant-Based Default**. Why? Because even if Beef kills fewer animals, the *suffering* intensity and *climate cost* outweigh the death count metric. This allows me to discuss the philosophy of suffering vs. death count.
      *   *Alternative:* Recommend a **Plant-Based Default** immediately. This addresses the carbon pledge, the vegan caucus, and technically minimizes crop deaths compared to feeding crops to cows (inefficient conversion).
      *   *Let's go with:* **Recommendation: Reject the Beef Default proposal. Adopt a Plant-Forward Default (Plant-based is default, meat is opt-in) with a 6-month phase-in.** This allows me to tackle the "Beef vs. Chicken" ethics directly as a rejected alternative, explaining *why* the death-count metric is insufficient.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the petition and the gravity of the debate.
      *   **The Ethical Core (The "Hard Question"):** Address the "Fewer Deaths" argument.
          *   Acknowledge the math (1 cow vs. 200 chickens).
          *   Challenge the metric: Is death the only harm? What about suffering (broiler conditions vs. pasture)?
          *   Address the "Feed Crop" argument: Beef requires *more* crops, so it inherits crop deaths *plus* the cow death.
          *   Address the "Wild Animal" uncertainty: Acknowledge we don't know the moral weight of field mice/pests, but beef multiplies this uncertainty.
      *   **The Climate Core:** Cannot ignore the Carbon Neutrality Pledge. Beef is incompatible.
      *   **The Recommendation:** Plant-Forward Default.
      *   **Timeline:** 6 months.
      *   **Costs to Losers:** Be honest. Petitioners lose their "least death" victory. Meat-eaters lose convenience. Vegan Caucus might feel it's too slow.
      *   **Conclusion:** Call to vote.

  4.  **Refining the Tone:**
      *   Needs to sound like a PhD student: Analytical, precise, comfortable with uncertainty, but decisive.
      *   Avoid preaching. Use "we" and "the committee."
      *   Ensure the "Beef vs. Chicken" ethical debate is treated with intellectual seriousness, not dismissed out of hand. The petitioners have a point (utilitarian calculus), but it's incomplete.

  5.  **Addressing Specific Prompt Constraints:**
      *   *Concrete recommendation:* Yes (Plant-Forward Default).
