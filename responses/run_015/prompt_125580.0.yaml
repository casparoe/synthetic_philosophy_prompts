prompt: |-
  I am a finishing PhD student in philosophy, and in three weeks I am giving a job talk at a department that has no one at all working on AI or machine learning. The search is in philosophy of mind. The talk is provisionally titled *Understanding Without a Life: What Minimal-Pair Evidence Does and Does Not Show*, and it defends two claims. The first is methodological: I argue that the debate about whether large language models understand anything has stalled because both sides test the wrong property. Success on a benchmark cannot distinguish a system that is tracking the evidential support actually present in the prompt from one that is tracking surface features that merely correlate with it, so I propose testing what I call *support sensitivity* instead. The instrument is a class of items I have been building, which I call support-inverting pairs: take a task family where a model does well, then construct two prompts matched on everything cheap and statistical — length, topical vocabulary, unigram distribution, and, crucially, near-identical perplexity under the model's own distribution — but in which the evidentially correct completion flips. If accuracy survives only where the surface cue and the real support happen to coincide, and collapses toward chance where they come apart, that is evidence of cue tracking rather than support tracking. On about a dozen task families I get collapse, sometimes nearly to chance. The second claim is the one I actually care about and the one I expect to be hurt on: I run a deliberately rough analogue of the same design on human subjects — undergraduates, time-pressured, working on material outside their training — and I get a partial version of the same collapse. I then argue that our habit of treating the human collapse as a mere performance factor (haste, fatigue, domain mismatch) while treating the model collapse as a revelation about the absence of understanding is not itself supported by anything in the data. I call this the charity asymmetry, and my conclusion is deflationary rather than dismissive: the model's failure is real and diagnostic, but what it diagnoses is a specific structural fact about which cues the training signal made available, not a global verdict that nothing is understood.

  The room will be: two senior faculty who hold a teleological, biological-function theory of content and think the whole question is settled in advance by the observation that a language model has no etiological history of the right sort; one enactivist with phenomenological leanings who will be hostile to the idea that understanding is the kind of thing a minimal-pair experiment could measure at all; a psycholinguist who runs eyetracking and priming work and will have strong views about my human data and about what a twenty-minute experiment with undergraduates can possibly establish; a formal epistemologist who will want error bars, a pre-registration, and to know whether I have committed a base-rate fallacy; and a group of graduate students who are sympathetic but have absorbed the popular version of the stochastic-parrots critique and are not sure whether I am refuting it or reinventing it. Assume nobody has read the technical literature and nobody is fluent in machine-learning vocabulary, so that every objection will arrive in the idiom of their own subfield. I do not need the objections I would get from an ML audience — I have those already — I need the ones this room will produce.

  What I want from you is a Q&A prep sheet, not a defense of the view. Give me roughly ten objections, ordered by when they will actually arrive in the question period rather than by importance, each written in the voice and vocabulary of the person who will raise it rather than translated into mine, each with the two-minute reply I should give, an explicit note on where that reply is soft, and a verdict on whether I should concede fully, concede and redirect, or hold the line. Please format the sheet as a markdown table with exactly these columns: Objection as phrased by that questioner | Who raises it | Likelihood it comes up (1–5) | Damage if I handle it badly (1–5) | My two-minute reply | Where my reply is weakest | Concede, redirect, or hold. After the table, add a single JSON object, on its own, with these fields and nothing else: "most_likely_opening_question", "most_damaging_question", "question_i_hope_nobody_asks", "concession_to_make_in_the_talk_itself", "single_reply_that_must_land", "weakest_link_in_my_own_argument", "vocabulary_swaps" (an array of objects with keys "my_term", "their_term", "who"), and "what_to_do_if_the_human_data_is_challenged". Keep the JSON values compact — a sentence or two each — and do not add any commentary before or after the two blocks.
