answer: |-
  ### Initial Philosophical Brainstorming

  *   **Aquinas's Core Mechanism:** The key isn't emotions; it's the *structure of the act*. In *Summa Theologiae* II-II, q. 64, a. 7, the act is "self-defense." The effects are (1) preservation of life and (2) death of aggressor. The death must be *praeter intentionem* (outside the intention).
  *   **Intention vs. Volition:** Does "not intending" mean "I hope it doesn't happen" (psychological) or "I didn't choose it as a means to my end" (structural)? Scholastic consensus leans structural.
  *   **The AI Problem:** DDE is traditionally agent-centered (requires a moral will). Algorithms have optimization functions, not wills.
  *   **The "Means" Objection:** In Aquinas's self-defense, the death isn't *how* you survive (the blow stops the attack; death is incidental). In the SDC swerve, is the death of the one *how* the five are saved? If yes, DDE fails regardless of the agent.
  *   **Distributed Agency:** If the decision is split between sensors, neural nets, and braking actuators, where does the "intention" reside? In the code? The trainer? The user?
  *   **Terminology:** Need to distinguish *finis operis* (end of the act) from *finis operantis* (end of the agent).

  ***

  ### 1. The Settled Ground: What Aquinas Actually Said

  Let's anchor this in the text before we drift into the speculative. You are looking at *Summa Theologiae*, Second Part of the Second Part, Question 64, Article 7: "Whether it is lawful to kill a man in self-defense?"

  There is a high degree of scholarly consensus on the basic architecture of Aquinas's argument here. He is not offering a psychological profile of a soldier or a victim; he is offering a metaphysical anatomy of an action.

  **The Act vs. The Effects**
  Aquinas argues that nothing prevents one act from having two effects. In his example, the single act is "using force against an aggressor." The two effects are "saving your own life" and "killing the aggressor."

  **The Condition of *Praeter Intentionem***
  The Latin phrase *praeter intentionem* is the hinge. It translates roughly to "outside the intention."
  *   **Settled:** Aquinas explicitly states that for the act to be morally licit, the death of the aggressor must not be the *end* (goal) nor the *means* (method) of the defense. It must be an unavoidable byproduct.
  *   **Settled:** Proportionality is required. You cannot use a cannon to stop a slap. The force must be moderate (*moderamen inculpatae tutelae*).

  **The Nature of the Will**
  Aquinas is a Scholastic realist, not a modern psychologist. When he speaks of "intention," he is not primarily talking about your inner emotional state (e.g., feeling sad about the killing). He is talking about the **object of the will**.
  *   **Settled:** If your will chooses "death of aggressor" as the tool to achieve "safety," you have intended the death.
  *   **Settled:** If your will chooses "stop the attack" and death occurs inevitably, the death is *praeter intentionem*.

  So, to answer your first specific question: **It is not about actively wanting the good outcome emotionally.** It is about whether the bad outcome (death) is structurally necessary for the plan to work. If the plan is "I will kill him to stop him," you intend the death. If the plan is "I will stop him, even if he dies," the death is foreseen but not intended.

  ### 2. The Contested Terrain: Interpreting "Intention"

  Here is where the philosophers start fighting. While the text is stable, the *application* of "intention" is not.

  **Psychological vs. Structural Interpretations**
  *   **View A (The Psychological Reading):** Some interpreters argue that *praeter intentionem* requires a specific mental attitude. You must regret the death. If you are glad the aggressor died, you intended it, regardless of the mechanics.
  *   **View B (The Structural Reading - Dominant):** Most contemporary ethicists (like Philippa Foot or Joseph Boyle) argue Aquinas means the structural role of the effect. Did the bad effect serve as a *means*?
      *   *Example:* If I blow up a bridge to stop an army, and civilians on the bridge die, did I intend their deaths? Structurally, yes, because their bodies blocking the bridge (or the debris) might be part of the stoppage.
      *   *Contrast:* If I blow up the bridge to stop the army, and civilians die in a nearby field from shockwaves, that is side-effect.
      *   *Relevance to you:* This suggests you don't have to "actively want" the good, you just have to ensure the bad isn't the *engine* of the good.

  **The "Closeness" Problem**
  A major contestation is how close the side effect can be to the means before it becomes intended. If I shoot an aggressor in the heart to "stop the attack," but I know shooting the heart kills, is the death intended?
  *   **Strict Thomists:** Yes, because you chose a lethal mechanism.
  *   **Moderate Thomists:** No, because you chose a *defensive* mechanism that happened to be lethal.
  *   **Why this matters:** This ambiguity is what allows the Doctrine of Double Effect (DDE) to be flexible enough to survive into the 21st century, but it also makes it legally and ethically fuzzy.

  ### 3. The Weird Twist: Algorithms and Artificial Intention

  Now we get to your self-driving car (SDC) scenario. This is where we leave the 13th century and enter the "Black Box."

  **Can Code Have *Mens Rea*?**
  Traditional DDE requires a moral agent—a being with a will (*voluntas*) capable of ordering ends and means.
  *   **The Hard No:** A strict Thomist would say DDE cannot apply to the car itself. A car has no soul, no will, and no capacity for sin or virtue. Therefore, the car cannot "intend" anything. The moral evaluation falls entirely on the **programmers** and the **manufacturers**.
  *   **The Functional Yes:** Contemporary philosophy of technology (think of folks like Peter Asaro or the MIT Moral Machine group) often treats algorithms as having "functional intentionality." If the code is written to optimize for "minimize total casualties," we treat that optimization function *as if* it were an intention for the sake of analysis.

  **The "Means" Problem in SDCs**
  Here is the critical philosophical snag for your SDC scenario.
  In Aquinas's self-defense case, the death of the aggressor is **not** what saves you. The *blow* saves you. The death is incidental.
  In the classic Trolley/SDC swerve case:
  *   **Scenario:** The car swerves onto a sidewalk to avoid five pedestrians, hitting one.
  *   **Analysis:** Is the death of the one a *means* to save the five?
      *   If the car calculates, "Hitting this one person absorbs the kinetic energy required to stop the car from hitting the five," then the death is a **means**. Under DDE, this is forbidden. You cannot use an innocent person as a brake pad.
      *   If the car calculates, "This path has zero pedestrians, but due to sensor error/unavoidable physics, one person is in the blind spot," then the death is a **side effect**. Under DDE, this *might* be permissible (assuming proportionality).

  **The Distributed Intention Problem**
  You asked if DDE applies when the decision is "spread across code and sensors." This is a genuine frontier in ethics.
  *   **The Fragmentation View:** In deep learning systems, the "decision" isn't a single line of code (`if x then y`). It is the emergent result of millions of weighted nodes. There is no single locus of intention.
  *   **Implication for DDE:** If there is no locus of intention, DDE collapses. You cannot say the death was *praeter intentionem* if there is no *intentio* to begin with.
  *   **The "Design Phase" Solution:** Many ethicists argue we must push the DDE analysis back to the **training phase**. Did the engineers intend the car to sacrifice individuals?
      *   *Contested:* If the engineers set a utilitarian goal ("minimize harm") knowing it will sometimes kill innocents as a means to save others, do *they* violate DDE?
      *   *Consensus:* Most agree the engineers intend the *policy*, not the specific death. But critics argue that coding a car to swerve onto a sidewalk is encoding a willingness to use bystanders as means, which violates the Kantian/Thomistic prohibition on using humans as tools.

  ### 4. Synthesis: Applying the Doctrine to Your Car

  If we try to force Aquinas into the SDC, here is the rigorous breakdown:

  1.  **Agency:** The car is not an agent. The DDE applies to the **human designers**.
  2.  **Intention:** The designers do not "want" the one person to die (psychological). But did they structure the algorithm so that the one person's death is a **means** to safety (structural)?
      *   If the car targets the one person to stop the impact: **DDE Violation.** (Intended means).
      *   If the car targets an empty space, but the one person is unpredictably there: **DDE Compliant.** (Foreseen side effect).
  3.  **Proportionality:** Aquinas requires the good to outweigh the bad *and* the force to be moderate. Saving five at the cost of one seems proportional numerically, but Thomistic ethics cares about **justice**, not just math. Killing an innocent bystander (who is not an "aggressor" like in Aquinas's text) is arguably disproportionate regardless of the numbers, because the bystander has no liability to harm.

  **The Verdict**
  Aquinas's doctrine is difficult to map onto SDCs because his framework relies on **liability**. In self-defense, the aggressor has made themselves liable to harm by attacking. In the SDC trolley case, the one person on the sidewalk is innocent.
  *   **Settled:** Aquinas would likely forbid killing an innocent bystander even to save five, because the death is not *praeter intentionem* of the *act of defense* (since the bystander isn't attacking), but rather the direct object of a utilitarian calculation.
  *   **Contested:** Whether modern "risk management" (statistical inevitability of death) counts as "intention." If I program a car to drive 40mph in a school zone knowing there is a 0.01% chance of killing a child to get to work on time, is that intended death? Most philosophers say no (it's risk), but strict DDE proponents worry this is a loophole that swallows the rule.

  **Summary for your thinking:**
  Don't get hung up on whether the car "wants" the good outcome. Look at the **causal structure**. If the algorithm uses the death of the one as a tool to save the five, it fails Double Effect, regardless of whether the code "feels" bad about it. If the death is an unavoidable residue of a legitimate defensive maneuver, it passes. But since SDCs often face "innocent vs. innocent" choices rather than "defender vs. aggressor," Aquinas's specific self-defense justification is on shaky ground when applied directly to the Trolley Problem.
