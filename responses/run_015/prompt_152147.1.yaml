  Elara is a pianist. Take worlds $w_0$ to $w_{100}$. In $w_0$, Elara performs nightly. In $w_{i+1}$, she performs one less concert and spends one more hour woodworking than in $w_i$. Each step is a minor shift, insufficient to constitute a different person. By $w_{100}$, she never plays piano, working solely as a carpenter. No change of origins, species, or kind occurs; only accumulated accidental changes. Could Elara herself have been a carpenter? Could there have been a carpenter qualitatively like the $w_{100}$ individual? Steps are possible; endpoints differ radically.

  1.  **Actualist Verdict:** Permissive. The package employs ersatz worlds and trans-world identity governed by S4 modal logic, where iterated possibility collapses ($\Diamond\Diamond P \to \Diamond P$). Since identity is transitive, if Elara@ $w_i$ is identical to Elara@ $w_{i+1}$ for every step, Elara@ $w_0$ is identical to Elara@ $w_{100}$. An actualist who is also an origin essentialist would refuse the first step if origins differed, but the scenario constraints fix origins and kind, leaving only accidental changes which trans-world identity preserves across the chain.

  2.  **Lewisian Verdict:** Restrictive *de re*, Permissive *de dicto*. The *de re* claim translates to $\exists w \exists y (In(w, y) \land C(y, \text{Elara}) \land Carpenter(y))$. This fails because the counterpart relation $C$ is grounded in similarity and is not transitive; while $C(e_i, e_{i+1})$ holds, $C(e_0, e_{100})$ fails as the carpenter is too dissimilar to the pianist. Plenitude guarantees a world containing the carpenter (making *de dicto* true), but without a counterpart link to actual Elara, *de re* modality fails. The blocking features are the similarity threshold and non-transitivity; if $C$ were transitive, the threshold would be violated, and if the threshold holds, $C$ cannot be transitive. This verdict is hostage to the context of assessment fixing similarity standards strictly around career traits.

