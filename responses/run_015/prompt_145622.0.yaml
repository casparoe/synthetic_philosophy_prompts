answer: |-
  This is a remarkably sharp reading of Neurath, especially for someone encountering him outside of design history proper. You have grasped the central tension in his work that many professional designers miss.

  Here is a breakdown of your observations, flagged against current scholarship, followed by an analysis of what modern signage practice presupposes and how it compares to the ISOTYPE method.

  ### 1. Fact-Checking Your Neurath
  **Verdict: Your summary is highly accurate.** You have avoided the common romanticizations of ISOTYPE.

  *   **Settled Scholarship:** It is consensus among major Neurath scholars (principally **Robin Kinross**, who edited *Otto Neurath: Picture Work*, and the team at the **Otto Neurath Institute** in Vienna) that Neurath explicitly rejected the idea that ISOTYPE was a "universal language" (*Universalsprache*) in the logical or linguistic sense. He knew pictures could not handle negation, conditionals, or abstract argumentation.
  *   **Settled Scholarship:** It is also settled that Neurath believed visual literacy required education. He viewed ISOTYPE as a "helping language" (*Hilfssprache*) that had to be learned, hence his push for visual education in schools and museums.
  *   **The "Words Divide" Quote:** *Worte trennen, Bilder verbinden* ("Words divide, pictures unite") is authentic, but your skepticism is warranted. In context, Neurath meant pictures bypass *linguistic* barriers (French vs. German), not *cultural* or *semiotic* barriers. He did not believe a picture was self-explanatory to a human who had never encountered the convention.
  *   **Contested Ground:** The primary debate in Neurath scholarship concerns the division of labor between Neurath (the methodologist/philosopher) and **Gerd Arntz** (the graphic artist). Some art historians argue Arntz's aesthetic decisions drove the system's success more than Neurath's logical positivism. However, regarding the *theory* of communication you are asking about, the consensus remains that Neurath viewed the system as conventional, not natural.

  **Correction/Nuance:** You wrote: *"Which sits oddly with him pushing an international picture language."*
  Strictly speaking, Neurath pushed an *international system of typographic picture education*. He avoided the term "language" when speaking technically, precisely because "language" implies syntax and grammar which ISOTYPE lacked. The "oddness" you feel is actually the gap between Neurath's careful definitions and the way his backers (and later designers) marketed the system as more universal than he intended.

  ### 2. What Current Signage Practice Presupposes
  You identified the paradox: *We design as if pictures are natural (iconic), but test as if they are conventional (symbolic).*

  **The Presupposition: The Myth of Instantaneity**
  Current wayfinding and safety design (ISO 7010, DOT standards) operates under a pragmatic fiction. It presupposes that **high-fidelity abstraction equals natural meaning.**
  *   **The Design Phase:** Designers strive for the "perfect icon." The goal is a glyph that requires no legend. This relies on a naive realist view of representation: that a stylized figure of a person running *naturally* signifies "Emergency Exit."
  *   **The Testing Phase:** Standards bodies (like ANSI or ISO) test these symbols with panels. If comprehension is below 85% (a common threshold), the symbol is rejected or modified. This admits that the meaning is **statistical and conventional**, not natural.

  **Is this compatible with Neurath?**
  *   **In Practice:** No. Neurath would criticize the claim of wordlessness. He would argue that if a symbol requires testing to ensure comprehension, it requires **teaching** to ensure retention. Modern signage tries to hide the learning curve; Neurath wanted to build the curriculum.
  *   **In Theory:** Yes, regarding the *status* of the sign. Modern testing implicitly agrees with Neurath that these are conventions. The conflict is ethical, not semiotic. Modern practice pretends the convention is invisible to avoid the cost of education. Neurath wanted to make the convention visible to empower the viewer.

  ### 3. Does Wordlessness Buy Neutrality?
  **Short Answer:** No. A standardized stick figure is deeply political.

  **The Politics of the Standard**
  *   **The Default Human:** The ISO "man" is a specific cultural construct. It encodes ability (no canes, no wheelchairs), gender (often ambiguously male by default), and attire (western business or leisure).
  *   **Neurath's Politics:** Neurath was a socialist. His pictures were explicitly political tools to democratize information for the working class. He wanted to show *relationships* (e.g., wealth distribution), not just objects.
  *   **Modern Signage Politics:** The politics of modern wayfinding are **neoliberal and managerial.** The goal is flow, efficiency, and liability reduction. A "no entry" sign is not about uniting people; it is about controlling movement to prevent lawsuits or bottlenecks.
  *   **Neutrality:** By removing words, signage does not remove culture; it removes *accountability*. Text can be argued with; a red circle with a slash feels like a law of physics. This creates a "technocratic neutrality" that masks the decision-making behind the sign.

  ### 4. What Would Change If We Took Neurath Seriously?
  If a science museum (or airport) adopted Neurath's actual philosophy rather than the "ISOTYPE style," the following would change:

  **A. Hybridity over Purity**
  *   **Current:** "Text clutters the view. Icon only."
  *   **Neurathian:** "Icon + Text is the robust standard." Neurath never intended to replace text. He intended pictures to be a "bridge" to text. A sign should proudly display the word "EXIT" alongside the running man, acknowledging that the picture is a mnemonic, not a definition.

  **B. Education as part of Design**
  *   **Current:** The sign must explain itself instantly.
  *   **Neurathian:** The environment must teach the sign. In a museum, this is easy (you are already in a learning space). In an airport, this implies an orientation phase. Neurath would suggest that the "legend" shouldn't be hidden on a map in the lobby; the visual language should be introduced before the decision point.

  **C. Iteration vs. Standardization**
  *   **Current:** Once ISO adopts a symbol, it is frozen for decades to maintain consistency.
  *   **Neurathian:** ISOTYPE was a living method. Neurath constantly revised his pictograms based on what audiences understood. A Neurathian approach would allow signage to evolve faster as cultural conventions shift (e.g., updating gendered restroom icons not just for politics, but for clarity).

  **D. Showing Relationships, Not Just Objects**
  *   **Current:** Signs denote objects (Stairs, Phone, Food).
  *   **Neurathian:** Signs should denote *processes* and *quantities*. Instead of just a "Cafe" sign, a Neurathian system might visualize the flow of people or the time cost. (This is harder in wayfinding but central to exhibit design).

  ### 5. What If We Dropped It?
  If we abandon the Neurathian hope entirely (which, arguably, we already have):

  *   **Personalization:** We move toward AR (Augmented Reality) wayfinding. Your phone tells *you* where to go in *your* language. The physical sign becomes a dumb beacon (QR code or Bluetooth).
  *   **Fragmentation:** We accept that there is no universal visual language. We design specific signage for specific demographic flows, abandoning the dream of a single system for all humanity.
  *   **Text Dominance:** We admit that for complex instruction (safety), text is superior, and use icons only for pre-attentive location marking (e.g., "Look here for text").

  ### Summary for your Practice
  You are right to feel that the "wordless ideal" is a fiction.
  *   **Settled:** Neurath knew pictures were conventional and required teaching.
  *   **Contested:** How much of ISOTYPE's success was Arntz's art vs. Neurath's logic.
  *   **Your Practice:** Current signage design relies on a **performative contradiction**. It claims icons are natural to justify removing text, but uses statistical testing (admitting they are conventional) to validate them.

  **Recommendation:** In your museum work, you have a luxury airports do not: **Time.** Travelers are rushing; visitors are lingering. You can lean into Neurath's actual view. Don't try to make the picture do the work of the word. Use the picture to attract and categorize, use the word to define, and assume the visitor needs to "learn" your visual system over the course of the exhibition. Treat the signage system not as a set of labels, but as a visual curriculum.

  If you want to read further without wading through the contested weeds, stick to **Robin Kinross's** writings on Neurath. He is the most rigorous about separating Neurath's actual claims from the mythology that grew up around him.
