answer: |-
  This is a fantastic policy proposal for a class project. It's essentially a **Social Wealth Fund** with a **Citizen's Dividend** (similar to the Alaska Permanent Fund, but funded by capital/automation rather than oil).

  Your teacher is pushing you because they want you to move from *policy mechanics* (how it works) to *political philosophy* (why it is just).

  Here is the breakdown of the assumptions, the "owed" argument, the universal payout logic, and where your policy is rigid vs. flexible.

  ### 1. Where does the "Owed" claim come from?
  You hit the nail on the head: Traditional welfare assumes **charity** (you are unlucky/needy). Your policy assumes **ownership** (you are a shareholder).

  To defend this, you need to articulate why citizens are "shareholders" in private companies. You have three strong philosophical arguments for where this "owed" money comes from:

  *   **The Social Infrastructure Argument:** No company builds software in a vacuum. They use public roads, the internet (originally government-funded), a legal system to enforce contracts, and a public education system that trained their workers. Therefore, the public is a *silent partner* in every business. The dividend is the public collecting its return on investment.
  *   **The Technological Inheritance Argument:** Automation and AI aren't invented by one genius in a garage. They stand on centuries of shared human knowledge (math, science, code). Since innovation is cumulative and social, the profits from that innovation should be socially shared, not privately hoarded.
  *   **The Data/Consumption Argument:** (Specific to tech/software) Companies like Google or Meta become rich because *everyone* uses them and generates data. The users create the value; the company just captures it. The dividend is users getting paid for the data they generate.

  **The Pitch:** "We aren't giving people money because they are poor. We are paying people a dividend because they are owners."

  ### 2. Why give checks to rich people? (Is it inconsistent?)
  It feels inconsistent if you think the goal is **poverty relief**. It is perfectly consistent if you think the goal is **protecting a property right.**

  *   **Political Durability (The Alaska Argument):** This is the strongest practical defense. Programs for the poor (welfare) usually have weak political support because only the poor benefit. Programs for *everyone* (Social Security, Alaska Dividend) have massive support because everyone defends them. If you means-test it (only give to poor), the middle class will vote to cut it. If everyone gets it, the program is safe.
  *   **Privacy and Dignity:** Means-testing requires the government to investigate your bank account, drug test you, and judge your life. A universal check requires no snooping. You are defending a right to privacy.
  *   **Net Progressivity:** You can explain that while the *check* is the same, the *funding* is progressive. If the fund is financed by taxes on capital/robots, a billionaire might get a \$2,000 check but pay \$50,000 in new taxes to fund the program. A poor person gets \$2,000 and pays \$0. The *net effect* is still redistributive, even if the check is universal.

  ### 3. Does this clash with "People should get what they worked for"?
  **Yes.** This is the biggest philosophical hurdle.
  *   **The Conflict:** Traditional economics (and libertarian philosophy) relies on the idea that income should track **marginal productivity** (you get paid what your labor contributes).
  *   **Your Counter-Argument:** Automation **breaks** the link between labor and value. If a robot does the work, "labor" is no longer the source of wealth. If we stick to "income = work," we will have a society where a few robot-owners have all the money and everyone else starves, not because they are lazy, but because their labor is no longer needed.
  *   **The Shift:** Your policy argues that in an automated age, citizenship itself must become the basis for income, not employment.

  **Would you have to change the policy?**
  If you believed strictly in "income = work," you could not support this. You would have to support a **Job Guarantee** (the government ensures everyone has a job) instead of a **Cash Guarantee**. So yes, your policy *requires* you to reject the idea that survival must be tied to employment.

  ### 4. Forced vs. Contingent (Where can you be confident?)
  Your teacher wants to know which parts are essential to the philosophy and which are just implementation details.

  **The "Forced" Parts (Core Philosophy):**
  *   **Universality:** You cannot means-test it. Once you add a "needs test," you turn it from an *ownership dividend* back into *welfare*. This destroys the dignity and political durability arguments.
  *   **No Conditions:** You cannot require work or drug tests. Again, this turns it into behavioral policing rather than a property right.
  *   **Funding Source:** It *must* come from capital/automation profits (or a sovereign wealth fund). If you fund it by taxing poor people's sales tax, the logic falls apart. It must be a distribution of *surplus* wealth generated by technology.

  **The "Contingent" Parts (Debatable/Implementation):**
  *   **State Ownership vs. Tax:** Your group proposes the state *owns* stock. You could defend the same philosophy by saying the state *taxes* robot profits and distributes the cash. The philosophy (social dividend) stays the same, the mechanism changes.
  *   **Replacing Welfare:** You could argue this check is *on top* of existing welfare, or *replaces* it. Both are defensible. Replacing it simplifies bureaucracy; keeping it ensures a higher safety floor.
  *   **The Amount:** Whether the check is \$500 or \$5,000 is an economic calculation, not a philosophical one.

  ### 5. Is this "Luck Egalitarianism"?
  The person who told you that was *close*, but not quite right.
  *   **Luck Egalitarianism** argues that inequalities caused by "brute luck" (being born disabled, poor parents) should be compensated, but inequalities caused by "option luck" (choices you make) are okay.
  *   **Your Policy** is closer to **Citizen Stakeholderism** (associated with philosophers like Bruce Ackerman and Anne Alstott) or **Geoism**.
      *   *Stakeholderism:* Every citizen is born with a stake in the nation's wealth.
      *   *Geoism:* Certain resources (land, spectrum, now maybe algorithms/automation) belong to everyone, and rent should be paid to the public.

  **How to use this in class:**
  If you use the term "Luck Egalitarianism," clarify it: *"We aren't compensating people for bad luck (welfare). We are distributing the gains of good luck (technological breakthroughs) that belong to society as a whole."*

  ### Summary for your Defense
  When you stand up, don't say "It helps people." Say this:

  1.  **Premise:** Automation creates wealth without labor.
  2.  **Problem:** If income is tied only to labor, automation creates inequality and instability.
  3.  **Solution:** We must decouple survival from employment.
  4.  **Justification:** Citizens are shareholders in the social infrastructure that allows automation to exist.
  5.  **Design:** The check is universal not as charity, but as a dividend. This protects privacy and ensures the program cannot be politically dismantled.

  This moves you from "this is nice" to "this is a necessary adjustment of the social contract for the AI age." Good luck!
