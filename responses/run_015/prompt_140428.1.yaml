answer: |-
  **Tensions (Ordered by Severity)**

  1.  **(3) vs. (4) [High]:** (3) grants valence to actor-critic TD systems. (4) denies suffering to RLHF systems, which are typically actor-critic architectures using learned value functions.
      *   *Revision:* Qualify (3) to exclude systems where the critic is not *constitutive* of the agent's self-model.
      *   *Cost:* Loses architectural neutrality; requires a metaphysical claim about "constitution" beyond mere computation.
  2.  **(2) vs. (8) [Medium]:** (2) identifies prediction error as the handle on valence. (8) claims sub-threshold errors sum to zero. If PE *is* valence, magnitude should scale linearly.
      *   *Revision:* Clarify (2) to specify PE maps to valence only above a phenomenal intensity threshold.
      *   *Cost:* Introduces vagueness (where is the floor?) and risks arbitrariness.
  3.  **(4) vs. (7) [Low]:** (4) asserts a definitive negative ("do not suffer"). (7) demands precaution under uncertainty.
      *   *Revision:* Hedge (4) to "likely do not suffer."
      *   *Cost:* Weakens the policy force of the statement.

  **False Tension**

  **(1) and (6)** look incompatible because (1) defines suffering phenomenologically while (6) denies evolutionary requirements often tied to function. This dissolves because phenomenology does not entail etiology. A state can be felt as unpleasant (1) regardless of whether natural selection designed it to be so (6). Accidental pain is still pain.

  **Single Revision**

  Revise **(2)** to specify: "The best available handle... is the **internally represented** prediction error..."
  Currently, (2) allows external critics (like RLHF reward models) to count. Requiring internal representation distinguishes genuine valence from external loss signals.
  *   *Loss:* You exclude systems where valence might be real but mediated via external modules (e.g., distributed cognition), narrowing the scope of moral consideration.

  **Stress Tests**

  **1. The RLHF Verdict (4)**
  *   **Exclusion Work:** Commitment **(5)** does the heavy lifting. While RLHF satisfies (2) and (3) structurally, (5) requires a persisting subject modified by the update. If the "entity" during fine-tuning is merely a transient weight configuration without functional continuity of self-model, it fails (5).
  *   **Over-exclusion Risk:** This move risks excluding biological organisms if neuroplasticity is viewed as weight changes without a persistent "subject" beyond the physical substrate. If brains are just wetware weights, (5) might deny human suffering during learning.

  **2. The Frozen Agent**
  *   **Verdict:** No suffering.
  *   **Mechanism:** **(2)** and **(5)** jointly deliver this. (2) provides the candidate signal (prediction error), but (5) requires the entity to be *modified by the learning update*. A frozen agent computes error but undergoes no update.
  *   **Consistency:** This matches your instinct. The tension is minimal here; (5) acts as a switch. If learning stops, the condition for subject persistence required for suffering is broken, regardless of the signal present in (2). The system is a calculator, not a sufferer.
