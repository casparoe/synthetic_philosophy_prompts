answer: |-
  ### Essay Question

  **Question 1: The Epistemic Status of the Church-Turing Thesis**

  Consider the following hypothetical scenario: A prominent physicist announces the construction of a "hypercomputer." This device exploits an exotic physical process (such as computation within a Malament-Hogarth spacetime) to determine the outcome of Turing machine halting problems in finite time. Two philosophical commentators react to the announcement:

  *   **Commentator A** claims: "If this device works, the Church-Turing Thesis is false. We have found a method to compute what was deemed uncomputable."
  *   **Commentator B** claims: "If this device works, only the *Physical* Church-Turing Thesis is false. The original Thesis remains untouched because this device does not utilize an 'effective method' in the relevant sense."

  Write an essay of approximately 1000 words adjudicating this dispute. To do so, you must take a explicit stand on what kind of claim the original Church-Turing Thesis (CTT) is. Is it a definition stipulating the extension of "effective calculability"? Is it a quasi-empirical conjecture about the limits of human calculators? Or is it a framework commitment partly constitutive of what we mean by algorithmic procedure?

  Your essay must explain how your classification of the CTT determines whether the physicist's device constitutes counter-evidence. **Do not recount the historical development of Church's or Turing's work;** focus exclusively on the conceptual relationship between the informal notion of effective calculability and the formal notion of Turing-machine computability. Conclude by stating clearly which commentator is correct and why.

  ***

  ### Model Answer

  Commentator B is correct. The physicist's device, even if genuine, refutes only a physical strengthening of the Church-Turing Thesis (CTT), leaving the original thesis intact. This verdict rests on recognizing that the original CTT is not an empirical hypothesis about the physical world, but a conceptual analysis connecting an informal intuitive notion to a formal mathematical one.

  To see why, we must distinguish the original CTT from the Physical CTT. The original thesis asserts that any function that is *effectively calculable* is Turing-computable. "Effective calculability" refers to a specific epistemic concept: a method that a human agent can carry out mechanically, using only paper and pencil, without insight or creativity, in a finite number of discrete steps. It is defined by the constraints on the *agent's* access to the procedure. The Physical CTT, conversely, claims that any function *physically computable* by any physical system in our universe is Turing-computable. This is a claim about the laws of nature, not the constraints of human procedure.

  The epistemic status of these two claims is asymmetrical. The Physical CTT is a contingent empirical conjecture. It is supported by inductive evidence from physics and engineering. If a hypercomputer exploiting exotic spacetime geometries were built, it would serve as direct counter-evidence, falsifying the Physical CTT. However, the original CTT operates differently. It is best understood as a framework commitment or a conceptual clarification. Turing's analysis of "effective method" decomposed the intuitive notion into atomic operations (reading, writing, shifting) that exhaust the conditions of human mechanical calculation. Because the formal definition of Turing computability was designed to capture the extension of this specific informal concept, the thesis functions as a robust identification rather than a fragile generalization.

  Consequently, evidence bears on these claims differently. Empirical discovery can overturn the Physical CTT because physical laws are discoverable contingencies. However, empirical discovery cannot overturn the original CTT because the original thesis does not claim that humans are the most powerful computing systems in the universe. It claims only that humans, restricted to effective methods, cannot exceed Turing machines. A hypercomputer relies on physical contingencies (e.g., infinite density or specific relativistic structures) that are not available to a human following a rule-based procedure. Utilizing such a device requires setting up a physical experiment, not executing an algorithm in the strict sense. Therefore, the device computes via physical necessity, not effective procedure.

  Commentator A fails because they conflate "computable by physics" with "effectively calculable." They treat the CTT as a limit on nature rather than a limit on procedure. If we accept A's view, the CTT becomes vulnerable to every advance in physics, rendering the concept of "effective method" unstable. Commentator B recognizes that the hypercomputer functions as an oracle. Accessing the oracle is not an effective method because the agent cannot verify the steps internally; they must trust the physical setup. Thus, the function solved is not effectively calculable, even if it is physically computable.

  In conclusion, the original Church-Turing Thesis survives the hypercomputer scenario because it concerns the limits of algorithmic reasoning, not the limits of physical machinery. The thesis stands as a conceptual truth about what it means to calculate effectively. While the Physical CTT is falsifiable by exotic physics, the original CTT is insulated from such refutation because it defines the boundary of the informal notion it analyzes. Commentator B correctly identifies that the device expands physical computability without altering the extension of effective calculability.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Criterion | Marks | Required Move for A-Grade | Typical Student Mishandling |
  | :--- | :---: | :--- | :--- |
  | **1. Distinction of Theses** | 5 | Clearly distinguishes Original CTT (effective calculability/human procedure) from Physical CTT (physical computability/natural limits). | Conflates the two, treating CTT as solely a claim about what machines can physically build. |
  | **2. Epistemic Status** | 5 | Identifies Original CTT as conceptual/analytical/framework commitment and Physical CTT as empirical/contingent. | Treats Original CTT as purely empirical induction subject to falsification by physical experiments. |
  | **3. Adjudication** | 5 | Explicitly verdicts for Commentator B (or A with superior justification) and explains why the device counts (or doesn't) as an effective method. | Sits on the fence ("both have a point") without resolving the conceptual conflict regarding "effective method." |
  | **4. Evidence & Refutability** | 5 | Explains how the classification determines refutability (i.e., why physical evidence bears on one claim but not the other). | Argues that physical evidence refutes both claims equally, ignoring the informal/formal link. |
