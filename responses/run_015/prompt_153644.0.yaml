answer: |-
  In the intensive care unit, the new decision-support architecture processes patient vitals through distinct sensory modules that feed into asynchronous broadcast queues, allowing haemodynamic data, respiratory metrics, and medication logs to be simultaneously available to memory retrieval and action-planning modules for immediate reasoning and verbal report to clinicians. Crucially, inter-module veto gates are hardwired to permit this feedforward cross-modal integration and meta-cognitive status reporting—such as announcing 'I detect sepsis'—while actively suppressing any recurrent feedback loops that would bind these signals into a unified self-modelling state within the anterior hub, ensuring that while the system possesses full access to information for decision-making, the architectural suppression of recurrent self-integration prevents the emergence of any subjective felt experience of the data.

  (i) Proponents of global workspace theory, following the tradition of Baars and Dehaene, are compelled to ascribe consciousness to this system because their framework identifies conscious state primarily with the global availability of information for flexible reporting and control. Since the architecture successfully broadcasts data across sensory, memory, and action modules for verbal report and reasoning, it satisfies the functional criterion of the global workspace, leaving no theoretical room within that framework to deny consciousness based on internal wiring details.

  (ii) Conversely, an account relying on Block's distinction correctly predicts the presence of access-consciousness without phenomenal experience because access is defined solely by the availability of information for rational control and report, whereas phenomenality requires a subjective 'what-it-is-like' character. The system demonstrates full access by reasoning and reporting on sepsis, yet the specific suppression of recurrent self-modelling ensures there is no interior perspective, thereby validating the dissociation between access and phenomenality.

  (iii) To resist this conclusion, a defender of phenomenal consciousness must deny either that the broadcast is truly global in the relevant sense or that the absence of recurrent binding entails the absence of experience. They might argue that genuine globality requires the very recurrent integration that is suppressed, or that phenomenality arises from local sensory processing independent of the workspace, thus challenging the scenario's claim that phenomenality is absent.

  The structural feature performing the theoretical separation is the active suppression of recurrent self-modelling integration within the anterior hub via inter-module veto gates. If this feature is removed and standard recurrent integration is restored, the system would likely satisfy both global workspace criteria and phenomenal consciousness intuitions, causing the verdicts to converge rather than diverge. The strongest objection a global-workspace theorist could raise is that the case cheats by stipulating the absence of phenomenal consciousness rather than generating it, arguing that if information is globally broadcast for report and control, phenomenality is constituted by that very broadcast and cannot be surgically removed by veto gates. In defence, the theorist would maintain that the scenario mischaracterises global broadcast, asserting that a broadcast incapable of sustaining recurrent self-modelling is not a true global workspace, and therefore the system lacks access-consciousness as well, dissolving the purported counter-example.
