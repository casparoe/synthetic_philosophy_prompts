  8.  **Final Polish:** Check against the user's constraints (American English, specific point-by-point comments, justify the score).

      *(Self-Correction during drafting)*: I should be careful not to say Williams is *wrong*, but that the student's *characterization* of Williams might be too reductive (economic vs. social). The bigger error is definitely Appiah. I will weight the feedback accordingly.

