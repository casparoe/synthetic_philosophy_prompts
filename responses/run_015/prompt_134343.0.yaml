  A clear framework paper (approx. 5,000 words) that acts as a diagnostic tool. Instead of asking "Is this model aligned?", researchers can ask "Which layer is misaligned?"

  Ideally, this shifts the conversation from "how do we align AI" to "which alignment are we working on?" It might reveal that ontological alignment is a prerequisite for instrumental alignment, which would change funding priorities.
  I'll also pitch 2-3 shorter articles to major pubs to disseminate the ideas beyond the safety community. The goal is to give researchers a vocabulary to stop talking past each other.

  **Honest Failure Condition**
  It turns out the distinctions are semantic sugar. If, after digging, I find that you can't actually separate hermeneutic failures from ontological ones in practice, the project "fails" to find separate problems. But that's still a valuable negative result—it tells us we need a unified theory, not a modular one.

