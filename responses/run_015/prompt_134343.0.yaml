  Philosophers talk about the ontology, engineers talk about the instrumentals, and the hermeneutic piece gets lost in the middle. Because we haven't disentangled them, we risk solving the wrong problem. If ontological misalignment is the bottleneck, tweaking reward functions won't save us. We need a map of the dependencies before we can build the solution. Right now, the field is optimizing for clarity on goals without checking if the model inhabits the same reality as we do.

  **The Method (Month-by-Month)**
  I'm not running experiments; I'm mapping the conceptual terrain through interviews and case analysis. This is journalism and philosophy, not engineering.

  *   **Months 1-2: Mapping.** Deep dive into existing lit (safety papers + philosophy of tech). Conduct 15-20 interviews with safety researchers and philosophers to stress-test the three categories. Do they recognize these distinctions? Where do they push back?
  *   **Months 3-4: Case Studies.** Identify real-world failures where one type of misalignment happened without the others. Example: A model that gets the goal right (instrumental) but uses categories we reject (ontological). Or one that explains itself well (hermeneutic) but fails the task. I'll look for edge cases in current LLM deployments where these fractures show up.
  *   **Months 5-6: Synthesis & Writing.** Draft the framework. Test it against counter-arguments. Produce the final deliverable. I'll circulate drafts to interviewees for sanity checks before finalizing.

