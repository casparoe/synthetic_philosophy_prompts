      *   *Nuance:* If the engineer *intended* catalysis and selected for it, but failed (and resistance kept it), SE says the *attempted* function was catalysis, but the *actual* etiological function is resistance. This highlights the difference between *design function* and *biological function*.

  5.  **Synthesize the "Who Wins?" Question:**
      *   The book claims CR "wins easily."
      *   **Philosophical Consensus:** There is no consensus. It's a live debate. Pluralism (using both depending on context) is the most common modern stance. Claiming CR "wins easily" is pop-sci oversimplification.

  6.  **Drafting the Response:**

