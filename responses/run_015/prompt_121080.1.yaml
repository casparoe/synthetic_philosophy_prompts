          *   Boorse (1977) - Biostatistical Theory (often linked to CR but tries to handle norms).
          *   Garson (2016) - *A Critical Overview of Biological Functions* (Good recent summary).

      *   *Refining the Supervisor Point:* The supervisor is right that DE creates history. But the *specific* history matters. If the selection pressure was Ampicillin resistance, and the enzyme does something else, SE says the function is resistance. If the selection was for the reaction, and it stuck, SE says function is reaction. The hitchhiking case is the killer for SE if the selection pressure didn't match the trait in question.

      *   *Refining the Medicine Point:* The author is conflating "what doctors measure" (CR - does it pump?) with "what doctors diagnose" (SE - is it *supposed* to pump?). Boorse tries to bridge this with "species-typical functioning," which is a hybrid.

