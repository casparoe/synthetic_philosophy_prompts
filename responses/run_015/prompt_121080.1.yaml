answer: |-
  This is a fantastic question. You have spotted genuine philosophical tensions that professional philosophers of biology still argue about, and your skepticism is well-founded. The passage you've quoted is a classic example of a popularizer taking a complex, live debate and flattening it into a narrative where one side "wins" for the sake of readability.

  Here is a breakdown of what is settled, what is simplified, and what is arguably wrong, followed by an assessment of your supervisor's claim and your specific hitchhiking case.

  ### 1. The Breakdown of the Passage

  **The Definitions (SE vs. CR)**
  *   **Verdict:** **Accurate.**
  *   The descriptions of the Selected-Effects (SE) account (Millikan, Neander) and the Causal-Role (CR) account (Cummins) are standard and fair. SE ties function to evolutionary history (why it's here); CR ties function to current contribution to a system's capacity (what it does now).

  **The "Carving the System" Point**
  *   **Verdict:** **Misleading Simplification (Your suspicion is correct).**
  *   The author frames the fact that CR allows multiple functions (pumping blood vs. making noise) as a neutral feature ("we happen to take an interest"). In philosophy, this is known as the **indiscriminability problem**, and it is considered a major *bug*, not a feature.
  *   If *any* causal contribution counts as a function, then the heart's function is also to vibrate the sternum, to cast a shadow on an X-ray, and to warm the pericardial fluid. The CR account lacks a principled way to distinguish "function" from "mere effect" without appealing to the interests of an observer. Most philosophers think a theory of biological function should be objective, not dependent on what a cardiologist finds interesting. The author glosses over this to make CR look more flexible.

  **The "No History" Objection**
  *   **Verdict:** **Wrong / Outdated.**
  *   The claim that SE "is stuck saying that none of these [lab enzymes, robots] have functions, which nobody seriously believes" is false.
  *   First, many philosophers *do* argue that artifacts (robots) have functions derived from human intentionality, which is analogous to selection.
  *   Second, and more importantly for you, strict SE theorists argue that lab-evolved enzymes *do* have a selection history (more on this in the supervisor section).
  *   Third, even for a hypothetical "first heart" with no history, SE proponents (like Neander) have developed "Modern History" accounts that handle trait tokens vs. trait types. It is not the slam-dunk refutation the author claims.

  **The Medicine and Malfunction Contradiction**
  *   **Verdict:** **Contradictory (Your second suspicion is correct).**
  *   The author says CR is "the account that medicine already assumes," but then admits CR "lose[s] the ability to call it diseased."
  *   This is a genuine inconsistency. If CR defines function as "what it contributes," a broken heart that doesn't pump simply *has the function of not pumping* (or no function). To call it "diseased" implies a norm—it *ought* to pump even if it *doesn't*.
  *   SE handles this beautifully: the function is fixed by history (it was selected to pump), so a non-pumping heart is *malfunctioning*.
  *   **The Nuance:** The author is likely conflating *diagnosis* with *definition*. Doctors use CR to *measure* function (does it pump?), but they rely on SE (or a statistical norm) to *define* disease (it should pump). By saying CR "wins" because medicine uses it, then admitting CR can't define disease, the author is trying to have it both ways.

  **The Conclusion ("CR wins easily")**
  *   **Verdict:** **Howler.**
  *   There is no consensus in philosophy of biology that CR "wins easily." The field is currently dominated by **pluralism**. Most philosophers agree that SE is better for explaining *why a trait exists* and handling *malfunction*, while CR is better for explaining *how a trait works* in a physiological context. Claiming one side has knocked the other out is pop-sci rhetoric, not philosophical reality.

  ### 2. Is Your Supervisor Cheating?

  **Verdict:** **Your supervisor is largely right, but with a caveat.**

  Your supervisor is correct that the "no history" objection doesn't touch directed evolution. Directed evolution *is* an evolutionary process. It involves:
  1.  **Variation:** Mutagenesis / shuffling.
  2.  **Selection:** Screening for activity/stability.
  3.  **Heredity:** Amplifying the winners.

  Therefore, a variant produced by directed evolution *does* have an etiological history. It exists *because* it was selected for a specific effect. A strict SE theorist (like Karen Neander) would happily say your lab-evolved enzyme has a "proper function" because it is the product of a selection process, even if that process happened in a tube over a fortnight rather than in the wild over a millennium.

  **The Caveat:** The history must match the trait. This leads directly to your hitchhiking case.

  ### 3. The Hitchhiking Case Study

  *Scenario: Variant catalyzes Reaction X. It persists in culture because it is linked to an Antibiotic Resistance marker (Selection Pressure Y). Catalysis X was not the reason it was selected to persist in the final culture.*

  Here is how the two accounts handle this:

  **The Selected-Effects (SE) Account:**
  *   **Verdict:** The function is **Antibiotic Resistance** (or plasmid maintenance), *not* Catalysis.
  *   **Reasoning:** SE defines function as the effect *for which the trait was selected*. If the catalytic activity did not contribute to the variant's reproductive success (persistence in the culture) relative to other variants, it is not the selected effect. It is a **spandrel** (a byproduct).
  *   **Implication:** Even if you *intended* it to catalyze Reaction X, and even if it *does* catalyze Reaction X, biologically speaking (under SE), that is not its function. It is an incidental capacity. This aligns with the intuition that if you remove the antibiotic, the variant disappears; therefore, the catalysis isn't doing the work of keeping it alive.

  **The Causal-Role (CR) Account:**
  *   **Verdict:** It has **both** functions, depending on the system boundary.
  *   **Reasoning:**
      *   Relative to the *cell's survival in antibiotic media*, the function is resistance.
      *   Relative to the *assay in the test tube*, the function is catalysis.
  *   **Implication:** CR is context-dependent. It doesn't care about the history of selection, only the current causal contribution. If you put the enzyme in a bioreactor to make a product, its function is catalysis. If you put the cell in a mouse to test persistence, its function is resistance.
  *   **Problem:** CR struggles to tell you which function is the "real" biological one. It allows both, which is useful for engineering but less useful for understanding why the organism is built that way.

  **Does it matter that you didn't know about the hitchhiking at the time?**
  *   **SE:** No. Function is determined by the actual historical facts of selection, not the epistemic state of the engineer. If the selection pressure was resistance, the function is resistance, regardless of your belief.
  *   **CR:** No. Function is determined by current causal contribution.
  *   **Design/Intentional View:** Some philosophers argue that for artifacts (and lab enzymes are artifacts), function is determined by *intention*. If you designed it for catalysis, its function is catalysis, even if it hitchhiked. However, this moves away from *biological* function toward *artifact* function.

  ### 4. Summary: What should you believe?

  1.  **The "Winner":** Disregard the claim that CR "wins easily." It is a live debate. In enzyme engineering, you likely use a **hybrid**. You use CR when characterizing kinetics (what does this variant do?), and SE when discussing stability or fitness (why did this variant dominate the population?).
  2.  **The Supervisor:** Trust them on the history point. Directed evolution generates etiological history. Your enzymes *do* have selected effects.
  3.  **The Hitchhiker:** This is a case where SE is more illuminating. It correctly identifies that the catalytic activity is causally decoupled from the trait's persistence. Calling catalysis the "function" in an evolutionary sense is misleading; it's a capacity, but not the function that explains the variant's existence in that specific population.
  4.  **The Medicine Contradiction:** You read that correctly. The author contradicts themselves. Medicine relies on SE (norms) to define disease, even if it uses CR (measurements) to diagnose it.

  **Recommendation:**
  If you want to dig deeper without getting bogged down in dense metaphysics, look up **Justin Garson**. He wrote *A Critical Overview of Biological Functions* (2016). He is very clear on the distinction between "selected effects" and "causal roles" and discusses the medical/malfunction issue extensively. He is also one of the few philosophers who explicitly discusses **neurobiology and engineering cases**, so he might bridge the gap between your PhD work and the philosophy better than the generalists like Millikan.

  **Bottom line:** Your instincts are better than the book's. The passage is a defensible simplification of the *definitions*, but the *conclusions* are rhetorically skewed. The "carving" issue is a problem, not a feature, and the medicine point is inconsistent. Your supervisor is philosophically sound on the history point, but your hitchhiking case shows exactly where the SE account bites back: it forces you to admit that just because an enzyme *can* do a reaction doesn't mean that reaction is its *function* in that specific evolutionary context.
