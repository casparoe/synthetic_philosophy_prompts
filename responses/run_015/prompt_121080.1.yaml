  2.  **Deconstruct the Passage (Claim by Claim):**

      *   *Claim 1: "Philosophers used to treat talk of what a trait is 'for' as just shorthand for how it evolved..."*
          *   **Analysis:** Roughly accurate historically. Before the 1970s (Cummins 1975), function talk was often teleological or purely historical.
      *   *Claim 2: SE Account (Millikan, Neander) = Effect that explains selection.*
          *   **Analysis:** Accurate definition of the Etiological/Selected-Effects view.
      *   *Claim 3: CR Account (Cummins) = Contribution to a larger capacity.*
          *   **Analysis:** Accurate definition of the Causal-Role view.
      *   *Claim 4: "The heart's function is to pump blood only because we happen to take an interest in blood circulation..."*
          *   **Analysis:** This is the "arbitrariness" objection to CR. The book frames this as a neutral feature ("carve the system up differently"). The user is suspicious here. *Verdict:* This is a simplification that hides a major weakness of CR (the "indiscriminability" problem).
      *   *Claim 5: "CR wins easily... covers everything that has no evolutionary history... SE is stuck saying none of these have functions."*
          *   **Analysis:** This is the core debate. SE proponents *do* argue that artifacts/lab enzymes have functions via *analogous* selection or derived intentionality. But strictly speaking, a *novel* trait with no history is problematic for strict SE. However, the claim that "nobody seriously believes" SE applies to artifacts is false; many philosophers argue artifacts *do* have selection histories (design). For lab enzymes, it's trickier.
      *   *Claim 6: "Medicine already assumes [CR]... so it is the one that actually matters."*
          *   **Analysis:** Controversial. Boorse's Biostatistical Theory (BST) is often linked to CR, but many argue disease requires a normative element that SE provides better (proper function vs. current capacity).
      *   *Claim 7: "SE wins one round: malfunction... CR... lose the ability to call it diseased."*
          *   **Analysis:** This is the classic "normativity" objection to CR. If function is just *what it does*, a broken heart that doesn't pump has the function of *not pumping* (or no function). SE preserves the norm (it *should* pump).
      *   *Claim 8: Contradiction Check:* The author says CR is what medicine uses (Claim 6) but then says CR can't handle disease/malfunction well (Claim 7).
          *   **Analysis:** The user is right. This is a tension. The author tries to have it both ways.

  3.  **Address the Supervisor's Point:**
      *   *Supervisor:* Directed evolution = selection in a tube. Therefore, lab enzymes have a selection history. SE applies.
      *   **Analysis:** The supervisor is actually philosophically sophisticated here. Directed Evolution (DE) *is* an evolutionary process. There is variation, selection, and heredity. Therefore, a DE enzyme *does* have an etiological history. The "no history" objection usually applies to *single* mutations or spontaneous traits, not necessarily DE products. However, if the specific variant arose *after* selection stopped, or if the selection pressure was for resistance but not catalysis (the hitchhiking case), SE gets complicated.
