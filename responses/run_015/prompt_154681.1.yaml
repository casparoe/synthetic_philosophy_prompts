  3.  **Identify the Weak Link:**
      *   The core tension is between (3) and (4)/(7).
      *   (3) asserts that *no explanatory residue* is allowed for a level to be legitimate. This implies that legitimate levels must be reducible without loss.
      *   However, non-reductive physicalism (NRP) is the dominant view that accepts (1) (physicalism/cranes) and (4) (MR) but rejects (3) and (6).
