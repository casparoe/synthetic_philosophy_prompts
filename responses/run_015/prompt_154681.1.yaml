  2.  **Evaluate the Argument Steps:**
      *   (1) *Crane definition:* Roughly consistent with Dennett. Cranes build up from the bottom without miraculous lifts.
      *   (2) *Greedy Reductionism:* Dennett defines greedy reductionism as trying to explain too much too quickly, skipping intermediate levels. The user claims this makes it a skyhook. This is a specific interpretation.
      *   (3) *The Inference:* "Every intermediate explanatory level must be fully accounted for by the level immediately beneath it, leaving no predictive or explanatory residue." This is the strong reductionist claim. It implies that if level L+1 has *any* explanatory power not captured by L, it's problematic unless reduced.
      *   (4) *Multiple Realizability (MR):* Standard Fodor-style claim. Psych states map to many neural states.
      *   (5) *The Dilemma:* If MR means residue exists, and residue is forbidden by (3), then psych is illegitimate.
      *   (6) *Eliminativism:* The conclusion.
