answer: |-
  **Argument for Restricted Eliminative Materialism Based on Calibration Stability**

  **I. The Criterion of Inter-Subjective Calibration Stability**
  A viable scientific taxonomy must satisfy the criterion of inter-subjective calibration stability. This criterion requires that attributions of kind-membership to a target system remain consistent across different observers and remain robust under slight shifts in contextual parameters. If a taxonomy is to describe objective features of reality rather than observer-relative projections, independent observers utilizing the taxonomy must converge on the same classification when presented with the same physical data, regardless of minor variations in the observational context.

  **II. The Failure of Folk-Psychological Taxonomy**
  The folk-psychological taxonomy partitions mental life into discrete propositional attitudes, such as beliefs and desires, characterized by fixed satisfaction conditions. This taxonomy fails the criterion of inter-subjective calibration stability. When observers attribute a specific belief to a subject, the attribution relies heavily on contextual assumptions about the subject's rationality, background information, and linguistic conventions. If the context shifts even slightly—for example, if the observers assume different background knowledge for the subject—the attribution of the specific belief changes discontinuously. Furthermore, first-person access does not stabilize these attributions; a subject's own report of their belief often shifts depending on how the question is framed. Because the boundaries of these kinds are fluid and observer-dependent, they do not track stable features of the physical system producing the behavior.

  **III. The Stability of Neural-Dynamical Descriptions**
  In contrast, coarse-grained neural-dynamical descriptions satisfy the criterion of inter-subjective calibration stability. Descriptions of the brain as a system minimizing predictive error through adjusted activation trajectories are measurable and consistent across observers. Whether observed via imaging or behavioral inference modeled dynamically, the trajectory of a neural system moving toward a state of lower error remains invariant under contextual shifts that destabilize folk attributions. These dynamical patterns are objective features of the physical substrate, not dependent on interpretive narratives about rationality or content.

  **IV. Conclusion: Elimination and Replacement**
  Therefore, the folk-psychological kinds of belief and desire should be eliminated from scientific ontology rather than reduced. Because the folk taxonomy lacks the stability required for scientific kinds, there can be no successful reductive mapping of belief onto brain state. Neuroscience should not seek to identify which brain state *is* a belief. Instead, it should replace the folk kind-structure with a dynamical-systems taxonomy. Explanations of behavior should reference trajectories of predictive-error minimization and neural coordination patterns. These new kinds bear no one-to-one correspondence to beliefs or desires; they constitute a fundamentally different structural description of the system.

  **V. Defense Against the Self-Refutation Objection**
  A standard objection posits that asserting eliminativism is self-refuting, as the assertion itself seems to express the belief that eliminativism is true. This objection relies on the eliminated vocabulary. The thesis can be asserted using only the successor vocabulary. The utterance of this argument is not the expression of a propositional attitude held by an agent. Rather, the production of this text is a behavioral output caused by a neural state characterized by high stability in error-minimization regarding the inconsistency of folk categories. The cognitive system generating this argument is undergoing a dynamical transition that aligns its output with the stable patterns of neural dynamics described herein. There is no requirement that this process involve "believing" the content; there is only the causal propagation of a stable dynamical pattern that disposes the system to produce these specific marks on the page. The coherence of the argument rests on the stability of the neural dynamics producing it, not on the truth-conditions of a proposition.

  **VI. Examination of Distinctness from Reductive Physicalism**
  We must now examine whether this restricted eliminativism genuinely differs from reductive identity theory. Identity theory claims that mental states are identical to brain states, thereby preserving the mental kind by locating it in the physical. Restricted eliminativism claims the mental kind does not exist and should be replaced by a different physical kind (dynamical trajectories).

  However, a critical tension arises. For the successor taxonomy to explain behavior as effectively as folk psychology, the dynamical trajectories must play a functional role analogous to that of beliefs and desires. They must guide action, respond to sensory input, and coordinate with other states to produce outcomes. If the new taxonomy hosts functional analogues of belief-like and desire-like states—states that carry information, guide behavior, and have success conditions relative to the organism's goals—the distinction between "eliminating" the kind and "reducing" the kind becomes merely verbal.

  If a dynamical trajectory performs the exact explanatory work posited for a belief, and does so stably, it satisfies the functional definition of a belief, even if it lacks discrete propositional structure. Reductive physicalism can accommodate multiple realization or complex structural mappings. If the dynamical trajectory is the physical realizer of the functional role previously misdescribed by folk psychology, then the folk kind was not strictly non-existent; it was merely an imperfect description of the dynamical kind. Consequently, the claim that beliefs do not exist collapses into the claim that beliefs are complex dynamical brain states. The elimination is ontological only if the functional role is also discarded, but if the functional role is retained to explain behavior, the view converges with a sophisticated reductive physicalism.

  Verdict: The position collapses into reductive physicalism because any taxonomy sufficiently stable to explain behavior must functionally replicate the propositional attitudes it seeks to eliminate.
