      *   *Alternative:* Biological organisms (cells replace, identity remains) vs. Artifacts. But the prompt suggests Score/Performance. Let's stick with that or refine the "Artifact vs. Work" distinction. Actually, a "Vintage Car" analogy is often closer than Score/Performance for physical objects, but Score/Performance helps separate the *sound* from the *box*. Let's analyze the Score/Performance suggestion from the prompt.
      *   *Refinement:* The prompt asks *if* the conclusion doesn't survive, what's a better analogy? I should evaluate the Score/Performance idea.
      *   *Score = Schematic.* Performance = Specific sonic output. But the *instrument* is the vessel. Maybe the "Institutional Theory of Art" (Danto/Dickie) is closer to the "Social Tag" idea. But for *restoration*, the "Historic Building" analogy is usually strongest (preserve the fabric vs. preserve the appearance).
      *   *Decision:* I will critique the Score/Performance analogy too. It might be *too* abstract. A "Historic Building" analogy might be better for physical restoration. But I must address the user's suggestion. I'll argue that the "Work/Instance" distinction is better than the "Social Tag" reduction.

