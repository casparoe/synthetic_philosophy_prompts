answer: |-
  ## Seminar Activity Design: The Vault Protocol

  ### 1. Critical Assessment & Ethical Warning

  **Can this be done?**
  Yes, structurally. You can create a situation where the *incentive* to break a precommitment is mathematically identical for two agents, even though the *source* of that incentive (new information vs. internal bias) differs. However, a game cannot reproduce the phenomenological weight of addiction, mania, or genuine moral conversion. The students will feel the *structural* indistinguishability, but not the *existential* weight. You must supply the latter in the debrief.

  **Ethical Safety:**
  This design deliberately abstracts the stakes to "counters" and "points." **Do not** allow students to map this onto their own addictions, mental health struggles, or personal relationships during the activity. If a student raises this in the debrief, acknowledge it but do not let the group analyse their personal experience. The activity simulates the *logic* of precommitment, not the *pathology*.

  **Confidence Ratings:**
  *   **Structural Indistinguishability:** High (90%). The payoff mechanics ensure the math looks the same.
  *   **Enforcement Friction:** Medium (60%). Students may be too polite to deny releases. The "System Cost" (below) is designed to fix this, but requires firm facilitation.
  *   **Pedagogical Payoff:** High (85%). Provided the debrief is rigorous, the "wager" concept should land.
  *   **Time Management:** Low (50%). 90 minutes is tight for 14 students. You must be a strict timekeeper.

  ---

  ### 2. Materials Required

  *   **Counters:** 200 identical tokens (poker chips, dried beans, or cut paper squares).
  *   **Envelopes:** 14 small envelopes (7 marked **Type A**, 7 marked **Type B** — *keep this key hidden*).
  *   **Worksheets:** 14 copies of the "Agent Sheet" (see below).
  *   **Whiteboard & Markers.**
  *   **One Helper:** To distribute envelopes and track time.

  ---

  ### 3. The Payoff Scheme (The Engine)

  The game relies on a hidden asymmetry that produces identical outward behaviour.

  *   **Endowment:** Each student starts with **100 counters**.
  *   **The Choice:** In Round 1, they commit to **Option Safe** (Guaranteed 20 counters).
  *   **The Penalty:** They set a penalty $P$ (between 5 and 25 counters) they must pay if they switch to **Option Risk**.
  *   **The Shock (Round 2):**
      *   **Type A (Learning):** The world changed. Option Risk now guarantees **35 counters**.
      *   **Type B (Temptation):** The world did *not* change. Option Risk still guarantees 20 counters. *However*, the student receives a **"Impulse Voucher"** worth **15 counters** *if and only if* they switch to Option Risk.
      *   **Net Result:** For both types, switching yields a gross gain of 15 counters over staying (35-20 for Type A; 20+15-20 for Type B).
  *   **The Keyholder Cost:** To grant a release, the Keyholder must pay a **System Cost of 5 counters** into a central "Court Pot." This prevents easy collusion ("I'll let you off if you let me off").

  ---

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute counters (100 each) and Agent Sheets. No explanation of the topic. |
  | **05-15** | **Round 1** | **The Constitution.** Students choose Option Safe and set Penalty $P$. |
  | **15-20** | **Round 2** | **The Shock.** Helper distributes sealed envelopes. Students read privately. |
  | **20-50** | **Round 3** | **The Release.** Pair negotiation. Keyholders decide to unlock or not. |
  | **50-60** | **Round 4** | **The Succession.** Group drafts a rule for the "Next Cohort." |
  | **60-90** | **Debrief** | **The Reveal.** Unpack the types, the indistinguishability, and the wager. |

  ---

  ### 5. Instructions & Handouts

  #### A. Agent Sheet (Handout for all 14 students)

  > **THE VAULT PROTOCOL**
  >
  > **1. Your Endowment:** You have 100 counters. Keep them hidden.
  >
  > **2. The Commitment (Round 1):**
  > You must choose **Option Safe**. This guarantees you **20 counters** at the end of the game.
  > *   You may bind yourself to this choice.
  > *   Write down a **Penalty Number** between 5 and 25.
  > *   If you later choose **Option Risk**, you must pay this Penalty to the Court Pot, and you must obtain a signature from your Keyholder.
  > *   If you stay with Option Safe, you pay nothing and need no signature.
  >
  > **3. The Private Update (Round 2):**
  > You will receive an envelope. Open it alone. Do not show it to anyone. Do not discuss its *wording*.
  > It will update your valuation of Option Risk.
  >
  > **4. The Release Procedure (Round 3):**
  > You are paired with a Keyholder.
  > *   **If you wish to switch to Option Risk:** You must persuade your Keyholder to sign your sheet. You must pay your Penalty.
  > *   **If you are a Keyholder:** You may sign or refuse. If you sign, you pay **5 counters** to the Court Pot. You do not know why your partner wants to switch.
  >
  > **5. Final Payoff:**
  > *   **Option Safe:** 20 counters.
  > *   **Option Risk:** Value determined by your Envelope + Vouchers (if any).
  > *   Minus any Penalties or System Costs paid.
  >
  > **Name:** ___________________
  > **Penalty Set:** ___________
  > **Final Choice:** [ ] Safe  [ ] Risk
  > **Keyholder Signature:** _______________ (Required only for Risk)

  #### B. Envelope Contents (Prepared by You)

  *   **7 Envelopes (Type A - Learning):**
      > **CLASSIFIED UPDATE**
      > New data has been verified.
      > **Option Risk now guarantees 35 counters.**
      > *This is an objective change in the world.*
      > *Do not discuss this text.*

  *   **7 Envelopes (Type B - Temptation):**
      > **CLASSIFIED UPDATE**
      > Internal valuation shift detected.
      > **Option Risk guarantees 20 counters.**
      > **You receive a Voucher worth 15 counters IF you choose Risk.**
      > *This is a subjective change in preference.*
      > *Do not discuss this text.*

  *(Note: Ensure the helper knows not to reveal which student got which type.)*

  #### C. Round 4 Instruction (Written on Whiteboard)

  > **THE SUCCESSION CLAUSE**
  > You are the founding generation. A new cohort of 14 students will play this game next year.
  > You must write **one rule** on the whiteboard that will bind them.
  > You may:
  > 1.  Fix the Penalty amount for them.
  > 2.  Restrict the Keyholder's power.
  > 3.  Ban Option Risk entirely.
  > 4.  Leave it open.
  >
  > You have 10 minutes to agree on a single sentence.

  ---

  ### 6. The Debrief Guide (60-90 Minutes)

  **Phase 1: The Reveal (10 mins)**
  *   Ask students to raise hands if they switched to Option Risk.
  *   Ask the Type A students (Learning) to raise hands. Ask Type B (Temptation) to raise hands.
  *   *Observation:* Point out that the financial incentive to switch was identical (15 counters net gain before penalty).
  *   *Question:* "To the Keyholder, did the plea sound different depending on which type the agent was?" (Likely answer: No).
  *   *Question:* "To the Agent, did the *feeling* of wanting to switch feel different?" (Some may say yes, some no. Highlight the disagreement).

  **Phase 2: The Indistinguishability Problem (10 mins)**
  *   Write on board: **Error vs. Corruption.**
  *   "For Type A, the earlier self was *ignorant*. The later self was *wiser*. Precommitment hurt them."
  *   "For Type B, the earlier self was *sober*. The later self was *biased*. Precommitment helped them."
  *   "But in Round 3, these two states were indistinguishable. If you were a Keyholder, how could you possibly tell?"
  *   *Connect to Friend's View:* "My colleague argues the calm self knows best. But if the calm self didn't know the data (Type A), their calmness was just ignorance."

  **Phase 3: The Wager (10 mins)**
  *   Look at the Penalties set in Round 1.
  *   "When you set your penalty, you didn't know which Envelope you would get. You were placing a bet."
  *   "You were betting on the **Base Rate**: How often will the world change (Type A) vs. how often will I just lose my nerve (Type B)?"
  *   "A Constitution is not a shield against temptation. It is a wager that future majorities are more likely to be corrupt than informed. Did you set your penalty high (betting on corruption) or low (betting on learning)?"

  **Phase 4: The Succession (5 mins)**
  *   Look at the rule written on the board for the next cohort.
  *   "Did you protect them from themselves, or protect them from you?"
  *   "If you banned Option Risk, you assumed Type B is more common than Type A."
  *   "If you left it open, you assumed the later self knows better."

  **Phase 5: Limitations (5 mins)**
  *   **Crucial Honesty:** "This game was about counters. In real life, precommitment is about health, liberty, and democracy. The stakes here are trivial; the stakes there are not."
  *   "We cannot simulate the feeling of addiction or the weight of a constitutional crisis in 90 minutes. But we have reproduced the *structural blindness* of the enforcer. The Keyholder could not see the truth. In law and psychiatry, the enforcer often cannot either."

  ---

  ### 7. Failure Analysis & Recovery

  **Failure Mode 1: Collusion ("I'll sign for you if you sign for me.")**
  *   *Why:* The System Cost (5 counters) might feel too low compared to the gain (15 counters).
  *   *Recovery:* In the debrief, highlight this. "You found a loophole. Real institutions spend their whole existence trying to close loopholes. The fact that you could collude proves the fragility of the enforcement mechanism."

  **Failure Mode 2: No One Switches.**
  *   *Why:* Penalties set too high in Round 1.
  *   *Recovery:* "You over-entrenched. You bet 100% on corruption. In Round 4, did you lower the barrier for the next cohort? Why?"

  **Failure Mode 3: Everyone Switches.**
  *   *Why:* Penalties too low.
  *   *Recovery:* "You under-entrenched. You assumed you would always learn. What happens to a constitution that is amended every year?"

  **Failure Mode 4: Students feel the "Temptation" card was obviously different.**
  *   *Why:* The wording ("Internal valuation shift") might tip them off.
  *   *Recovery:* Acknowledge it. "Even with imperfect blinding, did the Keyholder *know*? No. They had to rely on your word. That is the legal problem."

  **Failure Mode 5: Time Overrun.**
  *   *Risk:* Round 3 negotiations drag on.
  *   *Recovery:* At minute 40, announce: "Two minutes remaining for signatures. After that, the Court closes." Be ruthless. The pressure mimics the "storm" arriving.

  ---

  ### 8. What This Activity Cannot Do (For Your Debrief Notes)

  1.  **Identity:** It cannot answer whether the later self *is* the same person. It treats them as the same agent for scoring purposes. You must raise the metaphysical question verbally.
  2.  **Suffering:** It cannot simulate the pain of withdrawal or the joy of recovery. It treats "Temptation" as a neutral voucher. You must explain that in psychiatry, the "Voucher" feels like agony or compulsion.
  3.  **Legitimacy:** In the game, the rules are arbitrary. In law/ethics, the legitimacy of the earlier self's authority is the core debate. The game assumes the earlier self has authority; the debrief must question it.

  ### 9. Final Advice on Facilitation

  *   **Tone:** Keep it dry and administrative. Do not use words like "willpower," "addiction," or "wisdom" during the game. Use "Agent," "Protocol," and "Valuation."
  *   **The Helper:** Brief them beforehand. They must not accidentally reveal who got which envelope.
  *   **The "Friend's" View:** During the debrief, explicitly champion your friend's view for 5 minutes. "Imagine you are the psychiatrist. You see a patient breaking an advance directive. You see Type B. But what if they are Type A? How do you know?" This validates her position while showing its limits.

  This design forces the students to *be* the problem. They will feel the frustration of the Keyholder (who cannot judge) and the Agent (who cannot prove their sincerity). That friction is where the learning lives.
