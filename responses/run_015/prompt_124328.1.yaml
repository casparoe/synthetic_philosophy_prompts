      *   *CS Students:* Explicitly instruct them in the invite or opening to "play the role of a calculator" to slow them down conceptually. Or just rely on the fact that analyzing cycle structure of quadratic residues mod p isn't instant mental math.

  13. **Final Review against constraints:**
      *   75 mins? Yes.
      *   18 people? Yes (6 groups of 3).
      *   Materials? Envelopes, cards, dice, paper.
      *   No lecture? Yes.
      *   (1), (2), (3) covered? Yes.
      *   Betting? Yes.
