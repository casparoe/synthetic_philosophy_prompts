      *   **Move 3 (Noor):** *The Empirical Rebuttal.*
          *   *Claim 1:* Threshold is unlikely (totals cluster at 12 or 90). 90 is far from 30? Wait. If totals cluster at 90, the threshold (30) is *always* passed. If totals cluster at 12, it's *never* passed.
