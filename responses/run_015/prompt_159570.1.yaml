          *   *Claim 2:* Annual rounding (48). My unit matters only if total is $48k - 1$.
          *   *Assessment:* This is the strongest empirical pushback. If the distribution of orders doesn't hover near the thresholds, marginal impact is near zero.
          *   *Verdict:* Strong point on empirical probability. Weakness: Assumes past data predicts future distribution perfectly (could change *because* of people like Wes).

      *   **Move 4 (Wes):** *The Complicity/Participation Argument.*
          *   *Claim:* Morality isn't just about consequences; it's about participation in a harmful practice.
          *   *Assessment:* Shifts from Consequentialism to Deontology/Virtue Ethics (Complicity). "Doing my part."
          *   *Verdict:* Philosophically coherent, but changes the rules of the debate from "does it make a difference?" to "is it clean hands?"

