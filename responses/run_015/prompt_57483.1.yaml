answer: |-
  The air in the Continuity Bureau's audit chamber smelled of ozone and old paper, a scent that hadn't changed in fifty years. Outside the thick concrete walls, the city hummed, but in here, the only sound was the low thrum of the server stacks holding the dormant instances. Two desks faced each other across a expanse of polished steel. On one sat Kael, rubbing his temples. On the other, Elara tapped a pen against a ledger that weighed more than a brick.

  They had been at this for six hours. The decade audit was due at midnight.

  "It's not about what you want, Kael," Elara said, her voice echoing slightly in the sterile room. "It's about the count. You're ignoring the volume of the room just because you're standing in one corner."

  Kael looked up, his eyes tired. "I'm not ignoring anything. I'm following the Particulars Protocol. You know the rule. Facts about your position matter. Facts about your mere existence do not. I am here. I am an auditor. I know that already. It tells me nothing about how many people are sleeping in the vaults."

  "It tells you everything," Elara countered, leaning forward. She opened the ledger to a page covered in her neat, sharp handwriting. "Look at the numbers. We agree on the living. There are 2.4 million originals walking the streets right now. That's fixed. The dispute is the vaults."

  "The dispute," Kael said, "is whether the Bureau lied about the Outer Districts during the Quarantine Years."

  "And the math settles it. If we assume the Lean estimate, the Bureau only scanned the Inner Districts. That's 400,000 instances. Add the 2.4 million originals, and you have a total population of 2.8 million souls who could be sitting in this chair."

  Kael nodded slowly. "I'm following."

  "Now look at the Deep estimate," Elara continued, her finger tracing the line. "The Bureau finished the whole city before the walls closed. That's 7.2 million instances. Add the 2.4 million originals. That's 9.6 million souls who could be sitting in this chair."

  "And you think because the number is bigger, it's more likely?" Kael asked, skepticism tightening his jaw.

  "I think about where I find myself," Elara said. "If the Deep world is true, there are 9.6 million people. If the Lean world is true, there are only 2.8 million. Assuming we started with even odds—no reason to think the Bureau was competent or incompetent beforehand—then I should treat myself as a random draw from the available pool."

  She picked up her pen and wrote two figures in the margin.

  "In the Deep scenario, there are 9.6 million possible observers. In the Lean scenario, there are 2.8 million. The ratio is 9.6 divided by 2.8. That's twenty-four to seven. Roughly 3.4 to 1."

  Kael watched her hand. "So."

  "So, the odds are 3.4 to 1 in favor of Deep," Elara said. "That converts to a probability of about 77 percent. It's not certainty, Kael, but it's enough to sign off. The Bureau reached the Outer Districts. They saved them."

  Kael leaned back, the chair creaking. "Seventy-seven percent based on what? Based on the fact that you exist? That's the Presence Precept, Elara. You're betting the city's history on the idea that existence is evidence."

  "It is evidence," she insisted. "If a lottery sells a million tickets instead of a hundred, and you hold a winning ticket, it's more likely the lottery was the big one."

  "But you didn't win a lottery," Kael said sharply. "You were always going to be here. You were born an original. You were always going to grow up to be an auditor. You knew you'd be around to wonder about this. No information actually arrived. You're just updating on a fact you held before you opened the ledger."

  "That's the first objection," Elara said, ticking it off on her fingers. "Selection effect. I've heard it. But it doesn't hold. I didn't know *which* auditor I would be. I could have been a copy woken for the count. I could have been an original from the Outer Districts who died in the quarantine because the Bureau failed. The fact that I am here, now, asking the question, filters the possibilities."

  "It filters nothing if the filter is constant," Kael snapped. "But let's say I grant you the logic. There's a second problem. A bigger one." He gestured toward the humming server walls. "The copies. The 7.2 million instances. They are dormant. They are asleep. They aren't observing anything right now. How can a sleeping mind count as an observer in your pool? Your Presence Precept requires people who can find themselves in a situation. The vault dwellers aren't finding themselves anywhere. They're data on a disk."

  Elara paused. The hum of the servers seemed to grow louder. "They are people. They have continuity. If we wake them, they speak. They remember. They count."

  "They count when they wake," Kael said. "Not while they sleep. If you count the sleepers, you're inflating the pool with ghosts. If you exclude them, your 9.6 million drops back down. The math collapses."

  "The Bureau defines them as persons for legal continuity," Elara said, her voice hardening. "You can't switch definitions just because it helps your argument."

  "I'm switching definitions because reality demands it," Kael said. He stood up and walked to the window, looking out at the grey sky. "If you sign off on Deep, you're validating the Bureau's claim that they saved the Outer Districts. You're saying the quarantine protocols worked perfectly. You're saying there was no corruption, no abandonment."

  Elara looked down at the ledger. The pen hovered over the signature line. There were two forms. One marked *Lean: Inner Districts Only*. One marked *Deep: Citywide Completion*.

  "It's not about corruption," she said quietly.

  "Isn't it?" Kael turned back. "History says the Outer Districts were left to the plague. Families wiped out. No records. If you sign Deep, you're telling the families still living here that their ancestors weren't lost. They were stored."

  Elara's hand trembled, just once. She set the pen down. "My brother was in Sector Nine."

  Kael froze. The air in the room seemed to vanish. They had worked together for five years. He had never heard her mention family.

  "Sector Nine was Outer," Kael said softly.

  "Yes," Elara said. She looked at him, her eyes dry but bright with a fierce, desperate intensity. "When the quarantine started, he was twelve. The records say everyone in Sector Nine died. If the Lean estimate is true, the Bureau never reached them. He's dead. Gone forever. If the Deep estimate is true... he's in there." She pointed at the server wall. "He's one of the 7.2 million. He's sleeping. He's waiting."

  Kael walked back to the desk slowly. "Elara. You can't use the math because you want him to be there."

  "I'm not," she said. "The math is the math. 3.4 to 1. Seventy-seven percent. That's better than any forensic archive could give you. The Presence Precept settles it. It tells me he's likely in the vault."

  "And if you're wrong?" Kael asked. "If you sign Deep based on this reasoning, and it turns out the Bureau lied, and the vaults are empty... you've legitimized a lie. You've given false hope to thousands of families who think their loved ones are stored."

  "I'm giving them the truth," Elara said. "The probability is on my side."

  "The probability is on the side of the larger number," Kael corrected. "Not the truth. There's a difference. You're conflating volume with validity." He leaned over the desk, his voice dropping. "And you're conflating your hope with evidence. You want him to be there so badly that you're willing to count sleeping ghosts to make the numbers work."

  "I'm willing to count people," she said.

  "Then you're not an auditor," Kael said. "You're a mourner."

  Elara stared at him. The hum of the servers filled the silence between them, a million quiet hearts beating in the dark. She looked at the *Deep* form. It promised a city saved. It promised a brother waiting. It promised that the Bureau had been godlike in its efficiency.

  She looked at the *Lean* form. It admitted failure. It admitted death. It was safe. It was the Particulars Protocol. It required proof she didn't have. It required her to ignore the weight of the numbers.

  Kael waited. He didn't move to stop her. He just watched, his face unreadable, waiting to see if principle would break under the weight of love, or if logic would break under the weight of hope.

  Elara picked up the pen. She uncapped it. The click sounded like a gunshot in the quiet room. She moved her hand to the right-hand page, the one marked *Deep*. She pressed the nib to the paper. The ink flowed, dark and permanent, signing off on the 7.2 million. She signed her name clearly beneath the estimate, then closed the ledger.

  Kael exhaled, a long, slow breath. He didn't say anything. He just picked up his own copy of the audit, looked at the number she had validated, and placed it back in his bag without signing.
