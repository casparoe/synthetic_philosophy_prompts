answer: |-
  **Pre-Game Strategy**

  **Concede Upfront:** Open by acknowledging that inventory buffers exist and that not every unit sold triggers immediate production. This disarms the IO modelers who know Economic Order Quantity (EOQ) models involve safety stock. It signals you aren't claiming a 1:1 mechanical link for every transaction, but rather an expected value over a distribution of states.

  **The Reply That Must Land:** Objection #1 (Supply Response). If you cannot convince them that orders eventually translate to production adjustments (even if lagged or contractual), the causal mechanism collapses. You need to distinguish between *instantaneous* production and *committed* production capacity.

  **Hope Nobody Asks:** Objection #7 (Normative Contingency). You suspect it, and you're right. It's the awkward moment where you admit moral wrongness depends on whether a retailer uses SAP or Excel. It feels unintuitive to philosophers and arbitrary to economists.

  **Q&A Prep Sheet**

  **1. The Inframarginal Production Objection**
  *The Objection:* "You're conflating inventory replenishment with production scheduling. In modern supply chains, processing batches are forecast-driven, not order-driven. My purchase triggers a reorder from the distributor, but the processor's batch was likely scheduled weeks ago based on aggregate forecasts. You're affecting inventory levels, not inframarginal production units."
  *The Reply:* Distinguish between spot markets and contractual commitments. While immediate production may be buffered, persistent demand signals adjust future contracts. If retailers consistently hit reorder points earlier, safety stock parameters update, shrinking future batches or delaying subsequent runs. The causal chain exists over a longer time horizon than the purchase event.
  *Soft Spot:* The lag time is undefined. If the adjustment takes years, the causal link to *your* act weakens significantly.

  **2. The Identification Objection**
  *The Objection:* "This is a structural claim without reduced-form evidence. How do you identify the threshold parameter? Without exogenous variation in demand at the retailer level, this is just a storytelling model. Where's the empirical strategy?"
  *The Reply:* Point to IO literature on menu costs and batch ordering (e.g., Kahneman-style rigidities). We don't need a full structural estimation to establish existence; we need only show thresholds are non-zero. Analogize to regression discontinuity designs in voting: we know the threshold exists even if we can't predict the margin ex ante.
  *Soft Spot:* You lack a specific food-system RD design. You're relying on mechanistic plausibility rather than econometric identification.

  **3. The Leakage (Substitution) Objection**
  *The Objection:* "Even if you trigger a batch, what happens to the marginal unit if you don't buy? Price elasticity. The retailer discounts it, someone else consumes it. You haven't reduced quantity demanded, you've just transferred consumer surplus. Market clears."
  *The Reply:* Perishables have non-zero waste rates. Unlike durable goods, unsold chicken is often destroyed, not discounted indefinitely. If the threshold trigger leads to a batch that exceeds realized demand, the marginal units are wasted, not consumed by a substitute buyer.
  *Soft Spot:* Waste rates vary wildly by region and store tier. In discount markets, leakage is nearly perfect.

  **4. The Probability Weighting Objection**
  *The Objection:* "Even with thresholds, the probability of being the pivot is $1/BatchSize$. If batches are large (pallets/containers), expected impact is still negligible. You haven't solved the aggregation problem, just discretized it."
  *The Reply:* Batch sizes at the retail margin are surprisingly small (cases, not containers). Furthermore, the expected value is the batch size $\times$ probability. If the batch size is 100 and probability is 1/100, the expected impact is 1 unit—far higher than the smooth curve approximation of near-zero.
  *Soft Spot:* Depends heavily on the specific supply chain tier. Wholesale triggers dwarf retail triggers.

  **5. The Voting Analogy Validity Objection**
  *The Objection:* "Voting thresholds are legal constants. Supply chain thresholds are endogenous optimization variables. Firms change batch sizes to avoid exactly this sensitivity. The analogy breaks on exogeneity."
  *The Reply:* Firms face menu costs. They don't change thresholds continuously because adjusting logistics protocols is costly. This creates sticky thresholds similar to legal rules, making the pivot probability stable over relevant timeframes.
  *Soft Spot:* Firms *do* optimize over time. If your theory becomes common knowledge, supply chains could adjust to nullify it.

  **6. The Epistemic Access Objection**
  *The Objection:* "Agents don't know the reorder point. If moral obligation depends on a probability distribution over unknown inventory states, the action-guiding force collapses. I can't calculate the expected value."
  *The Reply:* Expected value reasoning under uncertainty is standard in economics. You don't need to know the state, just the distribution. We act on expected returns in investment without knowing the exact market clearing price; same logic applies here.
  *Soft Spot:* Agents have poor priors on supply chain mechanics. Their subjective probability may be zero.

  **7. The Normative Contingency Objection**
  *The Objection:* "You're making the wrongness of my act depend on the retailer's inventory software version. That makes morality arbitrarily contingent on corporate logistics. If they switch to Just-In-Time, I'm suddenly harmful?"
  *The Reply:* Consequentialism demands morality track consequences. If physical facts change, moral facts change. It's not arbitrary; it's empirical. The instability is a feature of the world, not the theory.
  *Soft Spot:* It feels unintuitive. Most people want moral rules to be robust across minor empirical variations.

  \answer{Inventory buffers absorb some shocks}
