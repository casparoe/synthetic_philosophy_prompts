          *   *Anti-Kuhnians (Rationalists):* Data = Success of modern science. Win = Show theory choice is algorithmic or at least logical.
          *   *Strong Kuhnians:* Data = Historical texts showing confusion. Win = Show rationality is internal to a form of life.
          *   *The Mismatch:* One side looks at the *product* (current science), the other at the *process* (transition).
      *   *The Diagnosis:* It's a **Category Error regarding Normativity**. The debate conflates *semantic* incommensurability (can I translate 'mass'?) with *axiological* incommensurability (do we value the same virtues?). The user's "frame-locked evaluation" hits the axiological part. The critics fight the semantic part. They think they are fighting the same battle, but they aren't.
