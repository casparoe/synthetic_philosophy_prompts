ding height onto a big circle taped on the floor, measured the chords — and there I'm totally fine saying there's a single real answer and it's whatever the straw-dropping setup produces, and I don't care that it won't be a clean fraction. And the one I keep flip-flopping on: a machine that makes cubes with edge length between 1 and 3 cm. Chance the edge is under 2 cm — gut says 1/2. Chance the volume is under 8 cubic cm — gut also says 1/2, but then I notice those are the same event (edge under 2 iff volume under 8) and my brain just stops, and if I'm honest I feel more confident about the edge version than the volume version, which is obviously insane.

