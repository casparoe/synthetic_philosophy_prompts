          *   *The Scope/Quantity Shift (User's Worry 1):* If the model is licensed *only* for $X$, but policymakers use it for $Y$. DII defender says "Misuse." *Counter:* If the model's presentation *invites* inference to $Y$ (e.g., by claiming to represent the "mechanism"), DII shares the blame. If DII is purely predictive, it can't police mechanistic inference.
      *   **Category 3: The Unfalsifiability/Insulation Worry:**
