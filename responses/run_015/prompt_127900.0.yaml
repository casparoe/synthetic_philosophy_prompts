      *   **Position:** Defending a specific version of as-if instrumentalism called "De-idealization Invariance Instrumentalism" (DII).
      *   **Core Claim of DII:** Unrealistic assumptions are virtues *if* predictions remain invariant (within tolerance/sensitivity flags) when assumptions are made more realistic (de-idealized) and parameters re-fitted. Friedman's F-twist is a corollary: significant theories survive de-idealization.
      *   **Task:** Identify what would count *against* DII. No citations/reading lists. Focus on evidence and arguments that should move the user.
      *   **Specific Worries:**
          1.  *Scope:* Model predicts peak timing well (invariant) but fails on total burden (non-invariant) when de-idealized. Policy failure ensues. Counterexample or misuse?
          2.  *Path Divergence:* Different de-idealization paths yield incompatible predictions. Refutation or need for weighting?
          3.  *Unfalsifiability:* Moving the goalposts (changing intended predictions) to save the theory. Vice or feature?
      *   **Preference:** Less interested in abstract philosophical skepticism (regress, precision), more interested in concrete cases where invariance held for headline prediction, policy was guided by it, and systematic failure occurred on a *changed* quantity of interest.
      *   **Output Requirement:** Rank defeaters from Fatal to Merely Awkward. Be explicit about what a committed defender must concede vs. dismiss. Address the insulation/unfalsifiability worry honestly.

  2.  **Deconstruct DII:**
      *   *Premise 1:* Models have known-false assumptions (idealizations).
      *   *Premise 2:* We test them by de-idealizing (making assumptions more realistic) and re-fitting.
      *   *Criterion:* Success = Predictive Invariance (predictions stay within tolerance or flagged sensitivity).
      *   *Normative Claim:* If a model passes this, we are entitled to trust it (and its unrealistic assumptions are virtuous).
      *   *Friedman Connection:* Significant theories are those robust to de-idealization.

  3.  **Brainstorming Defeaters (Potential Falsifiers):**

      *   *Case A (The Scope Shift):* Model $M$ predicts $X$ well. De-idealization $M'$ predicts $X$ well (invariant). But policy needs $Y$. $M$ says nothing about $Y$. $M'$ predicts $Y$ very differently than $M$ implied (or $M$ implied $Y$ via background theory). If the user says "DII only cares about $X$," is that a dodge?
      *   *Case B (The Path Problem):* De-idealize assumption 1 -> Prediction $P_1$. De-idealize assumption 2 -> Prediction $P_2$. $P_1 \neq P_2$. Which is the "real" test? If DII requires *all* paths, almost no model passes. If DII allows *some* paths, it's too weak.
      *   *Case C (The Black Box Success):* A model works (predicts well) but fails de-idealization tests (predictions shift wildly when assumptions are realistic), *yet* it remains the best tool we have. (e.g., some machine learning or complex climate parameterizations where "realistic" assumptions break the computability). If DII says "don't trust it," but we *must* trust it to act, DII is impractical.
      *   *Case D (The Hidden Variable):* Invariance holds for $t_1$ to $t_{10}$. At $t_{11}$, the system changes structurally (Lucas Critique style). The de-idealization didn't catch this because the "realistic" assumptions were still static.
