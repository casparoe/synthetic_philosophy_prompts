          *   *The "No De-idealization Path Exists" Case:* Some successful models rely on assumptions that *cannot* be de-idealized without destroying the model's solvability (e.g., certain equilibrium assumptions in macro). If the model is empirically successful but DII says "we can't test this via de-idealization," DII renders the model untrustworthy. If we *should* trust it (because it works), DII is too strict.
      *   **Category 2: Serious Challenges (Requires Friendly Amendment):**
