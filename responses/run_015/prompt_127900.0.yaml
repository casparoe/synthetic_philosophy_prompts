      *   *Refining the "Fatal" category:* The most fatal case is where DII gives a "Green Light" to a model that leads to disaster, not because the prediction was wrong, but because the *context of use* shifted in a way DII declares irrelevant. If DII says "That's not the model's fault," but the model was sold as a policy tool, DII is socially/epistemically irresponsible.
