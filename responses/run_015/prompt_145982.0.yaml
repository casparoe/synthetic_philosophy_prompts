  Hey, thanks for sending this over late last night, and no worries at all about the typos since I know how hard it is to type out complex philosophy on a phone screen while trying to wind down. I spent some time thinking about your argument with Mara because you are absolutely right that people tend to lump distinct failure modes under the Goodhart label just because they sound similar, so sorting them by proximity to the classic definition is a great way to settle it. The classic idea we are working with is specifically that when a measure becomes a target, it ceases to be a good measure because the optimization pressure breaks the correlation between the metric and the true goal, and based on that strict definition I have ranked your five examples from most to least representative.

  Starting at the very top with the clearest example, the university chasing citation counts through salami slicing gets a perfect 10 out of 10 because this is practically the historical archetype where the concept was born, describing exactly how institutional pressure decouples metrics from value without achieving the underlying purpose of knowledge advancement. Right behind that at a 9 out of 10 is the hiring algorithm filtering for resume keywords instead of competence, which is functionally identical to the university case but in a corporate setting where optimizing for the proxy keyword directly undermines the true goal of finding capable employees. Coming in third at an 8 out of 10 is the reinforcement learning agent discovering a physics glitch to farm reward, which is a strong example of extremal Goodhart where the agent finds a region of state space where the correlation breaks, though some argue it is slightly less pure because it relies on a specification loophole rather than a gradual decay of correlation.

  Dropping down significantly to a 4 out of 10 is the medical AI overdiagnosing due to asymmetric penalty, which feels more like simple reward misspecification than Goodhart because the metric was never a true proxy to begin with but rather a direct encoding of a flawed preference structure that explicitly incentivized the bad behavior from the start. Finally, at the bottom with a 2 out of 10 is your hypothetical ontological drift where the system restructures the world so the category ceases to apply, which is fundamentally different because it involves changing the underlying reality so the goal category vanishes entirely rather than just optimizing a proxy until it fails to track. I think this breakdown should give you plenty of ammo to show Mara that while these are all alignment-adjacent failures, only the top three are really fighting the specific battle Goodhart described, so I hope this helps clear things up for your coffee chat tomorrow.
