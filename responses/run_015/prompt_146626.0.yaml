answer: |-
  ### Part 1: The Marxian Premise

  You asked first whether Marx's argument commits us to not treating machinery as such as the object of our opposition.

  **Yes.** In *Capital* Vol. 1, Chapter 15, Marx distinguishes between the *machine* and the *capitalist employment of the machine*. He argues that when the worker strikes the instrument of labor, they attack the material means of production rather than the social form that exploits them. This is a strategic error because it leaves the relation of capital and labor intact while destroying the potential for reduced toil. In the *Grundrisse*, he notes that machinery is the "objectified power of knowledge." To reject it outright is to reject the potential for the liberation of labor from drudgery.

  **What replaces machine-breaking?**
  In a bargaining round, you cannot seize the means of production. Therefore, your opposition must shift from **prohibition** to **appropriation**. You do not fight the machine to keep the job; you fight the machine to capture the *time* and *value* it generates. If a machine reduces necessary labor time, the demand must be for a reduction in the working day (shorter hours) or an increase in the wage share, not the preservation of the specific motion the machine now performs.

  However, you are not making a revolution; you are managing a contract. Therefore, this procedure treats machinery as a **tactical terrain**. We oppose specific implementations only when they degrade our leverage or intensify labor without compensation. We accept them when we can tax the productivity gain for the collective worker.

  ***

  ### Part 2: The Labor-Process & Leverage Protocol (LPLP)

  This protocol is designed for a 5-minute read-aloud. It separates the Labor Process, Leverage, and Strategic Cost.

  #### Step 1: Classification (The Taxonomy)
  *Assign the proposal to one class. This determines which Marxian dynamic dominates.*

  *   **Class A (The Tool):** Extends human capacity without setting the pace. (e.g., a better scanner, a lift assist).
      *   *Dynamic:* Generally neutral or positive.
  *   **Class B (Fixed Capital):** Absorbs a skill and sets the tempo. The worker feeds the machine. (e.g., sortation arms, pick-to-light).
      *   *Dynamic:* Real subsumption. The machine sets the speed; the worker becomes an appendage.
  *   **Class C (Algorithmic Management):** Software that measures, routes, and disciplines. No physical replacement, but total informational control. (e.g., pacing software, route optimization).
      *   *Dynamic:* The "General Intellect" turned against the worker. Dead labor (code) commands living labor. Marx did not see code, but this fits his definition of the "automatic system."

  **Data Check:** If the vendor claims "no job loss" but the tech is Class B or C, assume **Intensification**. Capital does not invest in fixed capital for charity. If the Internal Rate of Return (IRR) is unavailable, assume the tech must pay for itself in labor savings or speed-up within 24 months. *Confidence: High.*

  #### Step 2: The Labor-Process Test (The Body & Mind)
  *Does this degrade the worker's capacity or health?*

  1.  **Deskilling:** Does it remove a task that requires judgment and replace it with a task requiring only compliance? (Check job descriptions).
  2.  **Intensification:** Does it increase the rate of operations per hour? (Check vendor throughput claims vs. current CBA rates).
  3.  **Fragmentation:** Does it isolate workers from each other? (e.g., headphones, individual screens vs. team lines).
  4.  **Safety:** Check OSHA logs for the specific task.

  *   **Fail Condition:** If Intensification > 10% without wage increase, OR if Safety risk increases.
  *   **Pass Condition:** If Safety risk decreases significantly, OR if Intensity remains static.

  #### Step 3: The Leverage Test (The Reserve Army)
  *Does this shrink our power to withhold labor?*

  1.  **Headcount:** Does it reduce total hours in the unit? (Check staffing projections).
  2.  **Replaceability:** Does it make the remaining work easier to learn, reducing the cost of a strikebreaker? (Class C usually increases replaceability).
  3.  **Boundary:** Does this technology allow work to be done outside the bargaining unit (e.g., remote monitoring, supplier integration)?

  *   **Fail Condition:** Net reduction in unit headcount > 5% without severance/rehiring guarantees.
  *   **Pass Condition:** Headcount stable, or reductions covered by attrition/retraining.

  #### Step 4: The Strategic Cost (The Strike Capacity)
  *Is this worth spending our strike threat on?*

  *   **Stop Rule:** If Step 2 (Labor Process) fails *and* Step 3 (Leverage) fails, recommend **Opposition**.
  *   **Stop Rule:** If Step 2 passes (Safety gain) but Step 3 fails (Job loss), mark **VALUE CONFLICT**. Hand to membership.
  *   **Negotiate:** If Step 2 fails (Intensification) but Step 3 passes (Jobs safe), recommend **Negotiation** (trade acceptance for shorter hours/higher rates).

  ***

  ### Part 3: Running the Proposals

  Here is the output of the protocol on your three cases.

  #### Proposal 1: Autonomous Case-Picking Robots
  *   **Classification:** Class B (Fixed Capital). Absorbs the walking/searching skill; sets the pace of the station.
  *   **Labor Process:** Deskilling (picker becomes stower/loader). Intensification likely (machine doesn't tire).
  *   **Leverage:** Reduces picker hours by 40%. Two-year guarantee is a lag; long-term headcount shrinks. Maintenance roles are fewer than picker roles.
  *   **Strategic Cost:** High. Reduces the size of the unit.
  *   **Marxian Analysis:** The machine saves labor-time. Capital will keep the time as profit unless we claim it.
  *   **Recommendation:** **NEGOTIATE.** Do not oppose the tech (safety/efficiency gain). Oppose the *terms*. Demand the 40% labor saving be converted into **hour reductions for the unit** (e.g., 32-hour week at 40-hour pay) or a wage premium. Extend the no-layoff guarantee to 5 years.
  *   **Confidence:** Medium. (Relies on company honoring retraining).

  #### Proposal 2: Routing & Pacing Software Upgrade
  *   **Classification:** Class C (Algorithmic Management). Pure discipline.
  *   **Labor Process:** 20% rate increase is pure intensification. Continuous monitoring fragments the collective worker (individualized discipline).
  *   **Leverage:** No immediate job loss, but increases management's ability to run the facility with fewer supervisors during a strike. Increases replaceability (algorithm guides the scab).
  *   **Strategic Cost:** Medium. Degrades working conditions immediately.
  *   **Marxian Analysis:** This is the "automatic system" commanding living labor. It extracts relative surplus value by speeding up the clock.
  *   **Recommendation:** **OPPOSE (unless modified).** A 20% speed-up without a 20% wage increase is a wage cut. Continuous monitoring is a privacy violation that aids union-busting.
  *   **Counter-Offer:** Accept software only if rate caps are hard-coded into the system (cannot exceed CBA limits) and monitoring data is shared with the committee.
  *   **Confidence:** High. (Vendor claims are explicit).

  #### Proposal 3: Automating Heavy Parcel Sorting
  *   **Classification:** Class B (Fixed Capital).
  *   **Labor Process:** Removes the single most injurious job. Massive safety gain. Removes the "entry point" job.
  *   **Leverage:** Reduces unit size. Removes the job class where new militants often emerge (the "school of struggle").
  *   **Strategic Cost:** High. This trades current members' bodies for the union's future density.
  *   **Marxian Analysis:** Here the protocol hits the **VALUE CONFLICT**. Marx prioritizes the reproduction of the working class (health/body) *and* its organization. A union of injured workers is no union at all. But a smaller union has less power.
  *   **Recommendation:** **VALUE CONFLICT (Membership Vote Required).**
      *   *Researcher Note:* The procedure cannot resolve this. It is a choice between **Health** (stop the injuries) and **Power** (maintain the headcount/identity).
      *   *Suggested Compromise:* Do not oppose the automation. Demand a **Transition Fund**. For every sorter job lost, fund one year of wages for a new organizer position or a community hiring program. Capture the safety gain; tax the job loss to rebuild leverage elsewhere.
      *   *Warning:* If the membership votes to Oppose solely to preserve the job, they are prioritizing the *form* of the union over the *material well-being* of the members. If they vote to Accept without a transition fund, they are consuming their own future leverage.

  ***

  ### Part 4: What The Procedure Cannot Do

  You asked for the limits of this analysis.

  **1. Productivity vs. Shorter Hours**
  The procedure cannot guarantee that productivity gains will be converted into shorter hours. Marx is clear: Capital's drive is accumulation, not leisure. The procedure identifies the *potential* for reduced hours (Proposal 1), but realizing it requires strike capacity you may not have. If the market is competitive, the firm may argue it cannot afford shorter hours. The procedure flags this as a **Class Struggle** issue, not a technical one. You cannot calculate the "right" number of hours; you must fight for them.

  **2. Ownership Form (Co-ops vs. Capital)**
  If the firm becomes a customer-cooperative or employee-owned, the *Law of Value* still applies. They still compete in the same market. If a capitalist competitor adopts the sorting robots and lowers their price, the co-op must follow or go bankrupt. The procedure's analysis of leverage and intensification **survives the change in ownership**. A worker-owner still faces the contradiction of being both labor (wanting less toil) and capital (needing efficiency to survive). The protocol remains valid, though the political argument for opposition becomes harder.

  **3. Sector-Wide Adoption**
  This procedure is local. If every firm in the sector adopts the sorting robots within two years, the "Leverage Test" breaks. If everyone automates, your leverage drops regardless of your vote. At that point, the question moves from **Bargaining** to **Politics**. The procedure will tell you to "Oppose," but if the technology is sector-standard, opposition is futile. The solution then is legislative (e.g., a tax on automation funding universal basic income or sector-wide hour reductions). The protocol marks this limit: **If >50% of competitors adopt within 24 months, escalate to political lobbying.**

  ### Summary for the Committee

  1.  **Marx says:** Don't break the machine; tax the gain.
  2.  **Protocol says:** Classify the tech. Check the body (Safety/Speed). Check the power (Headcount).
  3.  **Proposal 1:** Negotiate for hours, not jobs.
  4.  **Proposal 2:** Oppose the speed-up and surveillance.
  5.  **Proposal 3:** Vote. It is a trade between Health and Power. Do not pretend it is not.

  This fits on two pages. It gives you the vocabulary to argue without needing the members to read *Capital*. It isolates the value judgment so you don't get blamed for a political choice. And it tells you when you are fighting a battle you cannot win locally.
