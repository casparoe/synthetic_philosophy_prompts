prompt: |-
  I work as the staff researcher for a technology review committee at a regional parcel logistics company. The committee has seven members — four of them warehouse workers, one a part-time industrial economist, none of them readers of political economy — and it meets roughly eight times a year to review automation proposals that the company is contractually obliged to disclose to us before it signs anything. We do not decide. We write a recommendation of at most two pages, the local's membership votes on it, and the vote is binding, which in practice means a recommendation has to survive being read aloud in five minutes and argued about by people who are tired.

  Over the last three years we have opposed some proposals outright, negotiated over the terms of others, and let others pass in silence, and we have no way of saying which of those was right. What I want is a decision procedure we can actually run on a proposal, grounded in Marx's account of machinery and the labor process — the chapters on machinery and modern industry in the first volume of *Capital*, and the notebooks published as the *Grundrisse*, if the material there is genuinely load-bearing rather than decorative.

  The procedure needs several things I have not been able to supply myself.

  First, it has to separate three questions we constantly conflate: what the technology does to the labor process (deskilling, intensification, the fragmentation of what the collective worker knows how to do, who sets the pace); what it does to our leverage, including the effects that run through workers who are not in our bargaining unit or who may be hired in this labor market later; and whether opposing the technology, as opposed to bargaining over its terms, is the right use of strike capacity we can spend only once or twice a year.

  Second, it has to classify the thing being proposed, and the classification has to do real work in the procedure rather than being a label. I suggest three kinds, but correct me if the taxonomy is wrong: a tool that replaces human effort; fixed capital that absorbs a skill and then sets the tempo to which the living worker must move; and software that does not replace anyone but measures, routes, and disciplines the work that remains. Our hardest recent cases are all of the third kind, and I am not confident that Marx's machinery analysis reaches them in the same way — if it does not, the procedure should say so at that step rather than forcing the fit.

  Third, it must be runnable on the documents we can actually obtain: vendor throughput claims, staffing projections by job classification, OSHA injury logs, the current collective agreement, and the wage schedule. We cannot get the company's internal rate-of-return model, so for every step that wants a number, the procedure has to say what to do when the number is unavailable and what our confidence should be when we are guessing.

  Fourth, it must mark where it stops with a no, and where it hands the decision to the membership because the question is one of values rather than facts. My members will not accept a flowchart that pretends to settle whether solidarity with workers at a non-union supplier is worth our own dues money.

  Please also state plainly, early, whether Marx's own argument commits us to not treating machinery as such as the object of our opposition. I suspect it does — that fighting the instrument while leaving untouched the relation that sets it to work is, on his account, a strategic error and not merely a tactical one — and if that is right, the procedure should say what replaces machine-breaking for us, concretely, in a bargaining round.

  Then run it on three proposals. One: autonomous case-picking robots that would remove roughly forty percent of picker hours, offered with two years of no-layoff guarantee and retraining into maintenance roles. Two: a routing and pacing software upgrade with no job losses, a twenty percent increase in the required rate, and continuous performance monitoring with algorithmic discipline. Three: automating heavy parcel sorting — the single most injurious job in the building, and also the entry point into the unit and the job around which much of this local's identity was formed, which a majority of my committee already wants to fight. I want the third one run honestly. If the procedure clears a proposal that my members have already decided to oppose, I would rather have that on paper now than discover it in the meeting.

  Finally, tell me what the procedure cannot do. I am particularly interested in whether it has anything to say about whether productivity gains at a firm facing competitive pressure can ever be converted into shorter hours rather than fewer jobs, whether any of this survives a change in ownership form — a customer-cooperative or an employee-owned firm in the same market — and what happens to the analysis when every firm in the sector adopts the same technology within two years and the question stops being local.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Staff researcher for a technology review committee at a regional parcel logistics company.
      *   **Committee Composition:** 7 members (4 warehouse workers, 1 part-time industrial economist, 2 others implied, none read political economy).
      *   **Constraints:** Meets 8x/year, 2-page recommendation max, must survive a 5-minute read-aloud + argument by tired members. Vote is binding.
      *   **Goal:** A decision procedure grounded in Marx's *Capital* Vol. 1 (Machinery & Modern Industry) and *Grundrisse* (Fragment on Machines), specifically addressing the labor process, leverage, and strike capacity.
      *   **Specific Requirements:**
          1.  Separate three questions: Labor Process impact, Leverage impact, Strategic use of strike capacity.
          2.  Classify the technology (Tool vs. Fixed Capital/Tempo vs. Software/Discipline) and ensure the classification does work. Address if Marx covers software.
          3.  Runnable on available docs (vendor claims, staffing, OSHA, CBA, wage schedule). Handle missing data (IRR models).
          4.  Mark where it stops (facts vs. values/solidarity).
          5.  Address the theoretical question: Does Marx commit us to *not* opposing machinery as such? What replaces machine-breaking?
          6.  Run the procedure on three specific proposals (Robots w/ retraining, Software w/ speed-up, Sorting automation w/ identity/safety trade-off).
          7.  State limitations (productivity vs. hours, ownership forms, sector-wide adoption).

  2.  **Theoretical Grounding (Marx on Machinery):**

      *   *Capital* Vol. 1, Ch. 15: Machinery doesn't save toil; it saves labor *cost*. It lengthens the working day, intensifies labor, displaces workers (creates an industrial reserve army), and subsumes the worker under the machine (real subsumption).
      *   *Grundrisse* ("Fragment on Machines"): General Intellect. Knowledge becomes a direct force of production. Living labor is reduced to a watchman/regulator. Capital appropriates social knowledge.
      *   *Key Insight:* Marx argues against *machine-breaking* (Luddism) as a strategic error. The enemy is the *capitalist use* of machinery, not the machinery itself. However, in a bargaining context, opposing specific implementations is a tactical necessity to gain leverage, even if the strategic goal is changing the relation.
      *   *Software:* Marx didn't see software, but his analysis of the "automatic system of machinery" fits. Software is the ultimate realization of the machine setting the tempo and measuring the worker. It is "dead labor" (coded past labor) commanding "living labor."

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Name:* Needs to sound official but grounded. "The Labor-Process & Leverage Protocol" (LPLP).
      *   *Structure:* Needs to fit the 3 questions requested.
      *   *Step 1: Classification (The Taxonomy).*
          *   Type A: Tool (extends human capacity).
          *   Type B: Fixed Capital (absorbs skill, sets tempo).
          *   Type C: Algorithmic Management (measures, routes, disciplines).
          *   *Marx Check:* Does Marx cover Type C? Yes, under the "automatic system" and the subordination of living labor to objectified labor.
      *   *Step 2: Labor Process Impact (The "Real Subsumption" Test).*
          *   Deskilling? Intensification? Fragmentation of collective knowledge?
          *   Data sources: Staffing projections, job descriptions.
      *   *Step 3: Leverage & Reserve Army (The "Bargaining Power" Test).*
          *   Does this shrink the unit? Does it make replacement easier? Does it impact suppliers/non-union?
          *   Data sources: Staffing projections, wage schedule.
      *   *Step 4: Strategic Cost (The "Strike Capacity" Test).*
          *   Is this worth burning a strike threat on?
          *   Value judgment marker.
      *   *Step 5: The Marxian Constraint.*
          *   Are we fighting the machine or the relation?
          *   Replacement for machine-breaking: Bargaining for *control* and *distribution of gains* (hours/wages), not prohibition.

  4.  **Addressing the "Missing Data" Problem:**

      *   If IRR is missing, assume the tech *must* pay for itself in labor reduction or speed-up within 2-3 years. This is a safe Marxist assumption (capital seeks valorization).
      *   Confidence levels: High (contractual guarantees), Medium (vendor claims), Low (management verbal promises).

  5.  **Running the Three Proposals:**

      *   *Proposal 1 (Robots + Retraining):*
          *   Class: Type B (Fixed Capital).
          *   Labor Process: Deskilling picking, upskilling maintenance (but fewer slots).
          *   Leverage: Reduces headcount long-term (after 2 years).
          *   Marxian View: Acceptable *if* gains are shared (hours/wages).
          *   Recommendation: Negotiate (extend guarantee, demand hour reductions).
      *   *Proposal 2 (Software/Speed-up):*
          *   Class: Type C (Algorithmic).
          *   Labor Process: Intensification, surveillance.
          *   Leverage: Harder to strike (scabs guided by algo?), but no job loss initially.
          *   Marxian View: Pure real subsumption. High risk of injury/burnout.
          *   Recommendation: Oppose or Demand Hard Caps on rate.
      *   *Proposal 3 (Sorting Automation + Identity/Safety):*
          *   Class: Type B.
          *   Labor Process: Removes injury, removes entry point/identity.
          *   Leverage: Reduces unit size, removes "gateway" job.
          *   Conflict: Safety (good) vs. Power/Identity (bad).
          *   Marxian View: Safety is a win for the worker *as a human*, but loss for the worker *as a class fighter* if it shrinks the army.
          *   Recommendation: This is the Values Stop. The procedure flags the trade-off. The membership must decide: Health or Power? (Ideally: Health + Severance + Reduced Hours for remaining).

  6.  **Addressing the Limitations:**

      *   Productivity vs. Hours: Marx says capital *won't* voluntarily reduce hours unless forced. The procedure can't predict capital's concession, only demand it.
      *   Ownership Form: Co-ops still compete in the market. Law of value still applies. Tech will still be used to compete. Analysis holds but political dynamic changes.
      *   Sector-wide adoption: Becomes a class-wide issue, not local. Requires political action/legislation, not just bargaining.

  7.  **Refining the Tone:**

      *   Needs to be respectful of the user's intelligence and constraints.
      *   Avoid academic jargon where possible, but keep the theoretical rigor.
      *   Be honest about the "Values Stop."
      *   Ensure the "Marxian Constraint" is clear: Don't be Luddites, be strategists.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I answer the specific question about whether Marx commits us to not opposing machinery?
      *   *Fix:* Yes, need to explicitly state that Marx views machine-breaking as misdirected anger. The opposition must be to the *capitalist application*, which in bargaining means demanding the *fruits* of the machine (time/money), not banning the machine.
      *   *Critique:* Is the software classification accurate?
      *   *Fix:* Ensure the *Grundrisse* "General Intellect" is referenced to validate that software counts as "dead labor" commanding living labor.
      *   *Critique:* Proposal 3 is the tricky one. The prompt says the committee *already wants to fight it*. If the procedure says "Clear," I need to explain why (Safety vs. Power).
      *   *Fix:* The procedure should flag this as a "Value Conflict." Safety is a material gain for the worker's body; Union density is a material gain for the worker's class power. Marx prioritizes the reproduction of the working class (health) but also its organization. The procedure must force a choice.

  9.  **Final Polish:** Check against the 5-minute read-aloud constraint. The procedure itself needs to be concise enough to be summarized, even if the background is deep. I will structure the output to provide the "Theoretical Preamble" (for the researcher) and the "Field Protocol" (for the committee).

  **(Self-Correction on Proposal 3):** The prompt says "If the procedure clears a proposal that my members have already decided to oppose, I would rather have that on paper now." I need to be honest. If the safety gain is massive (OSHA logs prove injury), Marx would argue preserving the worker's body is fundamental. However, if it destroys the union's future (entry-level jobs), that's a long-term class defeat. The procedure should likely recommend *negotiating the transition* rather than outright opposition, unless the job loss is catastrophic. I will lean into the "Values Stop" here.

  10. **Finalizing the Output Structure:**
      *   Part 1: The Marxian Premise (Machine vs. Relation).
      *   Part 2: The Decision Protocol (The 4 Steps).
      *   Part 3: Application to the Three Proposals.
      *   Part 4: Limitations & Boundaries.

