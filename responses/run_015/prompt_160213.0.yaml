answer: |-
  **Joint Statement on Scientific Modeling: Adversarial Collaboration**

  **I. Agreed Claims**
  1.  **Function:** Models are mediators between theory and world, not literal copies.
  2.  **Prediction:** Requires empirical adequacy within a specified domain, regardless of assumption literalness.
  3.  **Intervention:** Requires robustness under manipulation of boundary conditions.
  4.  **Explanation:** Requires identifying difference-makers, though not necessarily all causal factors.
  5.  **No-Miracles:** Predictive success establishes reliability, not literal truth of assumptions.
  6.  **Taxonomy:** We distinguish subtractive (dropped small factors), distortive (misdescribed factors), and fictive (absent entities) assumptions.

  **II. Residual Disagreements**

  | Topic | As-If Defender (Instrumentalist) | De-idealization Realist | Status |
  | :--- | :--- | :--- | :--- |
  | **Assumption Truth** | Assumptions are tools; truth is irrelevant if output matches data. | Assumptions must track structure; falsehoods must be identified and controlled. | Substantive |
  | **Role of Falsehoods** | Unrealism isolates the dominant causal work (F-twist). | Unrealism hides confounding variables; must be relaxed to recover phenomena. | Verbal |
  | **Model Validation** | Validated by predictive accuracy within the calibration range. | Validated by derivational robustness as idealizations are removed. | Substantive |

  **III. The Cruxes**

  **Crux 1: Scope of the F-Twist**
  *Question:* Does predictive license extend to fictive assumptions, or only subtractive/distortive ones?
  *Case:* A macroeconomic model using a Representative Agent (fictive) to forecast aggregate consumption under tax policy changes.
  *   **Defender Prediction:** The model will forecast aggregate trends accurately despite the fictive agent, provided the policy stays within historical bounds.
  *   **Realist Prediction:** The model will fail when policy changes affect distributional dynamics hidden by the fictive agent.
  *   **Move Condition:** Defender moves if the model fails on distributional shocks; Realist moves if the model predicts aggregate outcomes accurately despite known heterogeneity.

  **Crux 2: Intervention vs. Observation**
  *Question:* Does success at novel prediction under intervention support different conclusions about assumptions than success on passive observation?
  *Case:* A climate-economy model calibrated on historical emissions (observation) used to forecast outcomes of a novel carbon tax (intervention).
  *   **Defender Prediction:** Successful historical fit licenses the intervention forecast; the mechanism is black-boxed.
  *   **Realist Prediction:** Intervention requires validated causal mechanisms; historical fit alone is insufficient for policy manipulation.
  *   **Move Condition:** Defender moves if the intervention forecast fails despite good historical fit; Realist moves if the forecast succeeds without mechanistic validation.

  **Crux 3: The De-idealization Audit**
  *Question:* What does a systematic audit find when false assumptions are relaxed one at a time?
  *Case:* Metapopulation model of a coastal fishery. The original assumed uniform larval dispersal (fictive/distortive) and forecast a northern stock's collapse four years ahead, to within a season. The successor replaced uniform dispersal with measured currents (de-idealized).
  *   **Defender Prediction:** Performance will survive relaxation; the original model's accuracy was due to isolated causal work, not luck. The new model may fit better but won't fundamentally change outcomes.
  *   **Realist Prediction:** Performance will improve or extend domain; the original success was partially coincidental within the calibration range. The new model should reveal phenomena the old one obscured.
  *   **Move Condition:** Defender moves if the high-resolution model fails to match the original forecast or performs worse outside the calibrated range. Realist moves if the high-resolution model matches the original forecast *and* successfully predicts a second collapse in a stock the first model had folded into the same unit (as occurred).

  **IV. Commitment**
  We agree to update our credences based on the outcomes of these cases, specifically monitoring whether de-idealization yields monotonic improvement, survival, or degradation of predictive power. We acknowledge that if the fishery successor model predicts the second collapse while the original could not, this favors the Realist view on the utility of de-idealization for domain extension, even if the Instrumentalist maintains the original was sufficient for its specific narrow purpose.
