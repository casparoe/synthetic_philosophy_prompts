      *   *Attack:* Defender of B argues that if it passes A (Intentional Stance), it *must* pass B. If it acts for reasons, it owns the reasons. Separating them is a category error.

      *Wait, I need to make sure I don't violate the "no feelings" constraint.*
      The feature must be functional. "Incapacity to treat normative claims as terminal value modifiers."
