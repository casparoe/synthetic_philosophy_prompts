      *   *Claim 2 & 3:* Mostly correct. Utility is ordinal in standard consumer theory. Interpersonal comparison is indeed ruled out in Pareto welfare economics.
      *   *Claim 4:* This is a category error. RPT defines *revealed* preference. It doesn't deny mistakes exist; it says if you choose X over Y, you *revealed* a preference for X over Y *in that context*. It doesn't mean you wouldn't regret it later. The handout conflates "preference" with "welfare."
      *   *Claim 5:* **FALSE.** This is the big error. You cannot rationalize *any* choice data with a utility function. Cycles (intransitivity) break it. This is likely why the econ students rolled their eyes.
      *   *Claim 6:* **FALSE.** Because Claim 5 is false, Claim 6 is false. RPT *is* testable (via consistency axioms).
      *   *Claim 7:* Partially true but misleading. Money metrics (WTP/WTA) are used, but they rely on the same underlying utility assumptions. Welfare econ hasn't "given up" on utility; it uses quasi-linear utility or money as a numeraire.

