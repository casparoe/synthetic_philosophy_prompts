answer: |-
  The gravel on Mercer Street crunched underfoot, a dry, rhythmic percussion marking the passage of steps. Late April light stretched long shadows from the elms, stripping the afternoon of its warmth. Einstein walked with his usual slouch, coat collar turned up against the Princeton draft, while Gödel matched his stride precisely, hands clasped behind his back, hat brim low.

  Gödel stopped at the gate. He did not reach for the latch. Instead, he pulled a folded manuscript from his inner pocket. The paper was crisp, dense with ink.

  "For your birthday, Albert," Gödel said. His voice was soft, nearly swallowed by the rustling leaves. "A solution. To your field equations."

  Einstein took the paper, his brow furrowing. He knew the weight of Gödel's silences; they were heavier than most men's speeches. He scanned the tensors, the Greek indices dancing in the margin. "Rotating," Einstein murmured, tracing a line. "You have the matter rotating."

  "Uniformly," Gödel corrected. "Everywhere."

  Einstein looked up, eyes weary. "If the universe spins, the light cones tip. I see this." He tapped the page. "Here. The geodesics curve back on themselves. A rocket could fly out and return before it departed."

  "It is not a rocket," Gödel said. "It is the geometry. The path is always there."

  Einstein chuckled, a dry sound. "Then we have paradoxes. Grandfathers killed before they meet grandmothers. Nature forbids this. It is nonsense."

  "No." Gödel stepped closer. The intimacy of the moment tightened the air between them. "It is not nonsense. It is permitted. Your laws allow it."

  "Only in a universe that spins. Ours does not."

  "That is the contingency," Gödel said. He looked past Einstein, toward the house, but his eyes were focused on something invisible, something structural. "If the existence of time depends on how the matter is arranged—if in one solution time is a circle, and in another a line—then time is not fundamental. It is conditional."

  Einstein shifted his weight, the cane digging into the gravel. "Kurt, you are speaking of metaphysics now."

  "I am speaking of logic. If something can cease to exist simply because the matter moves differently, then it was never truly there to begin with." Gödel's hand hovered over the manuscript in Einstein's grip. "If the door to the past exists in the next room, the wall between us is not real. It is merely painted on."

  Einstein stiffened. The implication landed not as a theory, but as a physical chill. "You are saying because it is possible there, it is an illusion here?"

  "I am saying the 'now' you feel," Gödel whispered, "the sense that this moment is passing into the next... it is a persistence of vision. Like a film reel. The frames exist all at once. Your equations prove the reel is static. My solution just shows you the splice."

  Einstein looked down at the path. A leaf drifted down, landing on the toe of his shoe. For a second, he stared at it as if waiting for it to un-fall. The certainty of the ground beneath them seemed to soften, the crisp crunch of the gravel losing its temporal anchor. If the path looped back behind them, had they already walked it? Was the walk finished before it began?

  "The gift," Gödel said, turning toward the gate, "is that you need not worry about the end. It is already behind you."

  Einstein did not move immediately. He held the paper tight, the edges digging into his palm. The shadows of the elms had lengthened further, darkening the path ahead, but the distinction between the light behind them and the dark before them felt suddenly arbitrary, a trick of the angle.

  He pushed the gate open. The latch clicked, a sharp sound that echoed too long in the quiet street. They walked toward the porch, but the rhythm of their steps felt out of sync, as if one of them was walking toward a destination that had already been left.
