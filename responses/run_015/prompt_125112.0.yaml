answer: |-
  Here is the translation of the metaphysical debate into your build/release vocabulary, followed by the test cases and the residue report.

  ### 1. The Translation: Necessity of Origins as Input-Addressed Identity

  **The Core Thesis**
  In your vocabulary, Kripke's "Necessity of Origins" is the claim that **identity is input-addressed, not content-addressed.**

  *   **The Metaphysical Claim:** An artifact (a person, a table) is identified by the hash of its inputs (gametes, wood block) and the build recipe (conception, carpentry), *not* by the hash of its output bytes (DNA, physical shape).
  *   **The Build Equivalent:** You cannot say two artifacts are "the same" just because they are bit-identical (fixed-output derivation). They are only the same if they share the same derivation path (input hashes + build script). If you swap a single input dependency (a different sperm), you generate a different output path, even if the resulting binary (the person) behaves identically.

  **The Argument For (Kripkean)**
  *   **Intuition Pump:** If you build a binary from `source_v1` and I build a binary from `source_v2`, and they happen to be bit-identical, your CI system treats them as distinct artifacts because their provenance chains differ. Kripke argues reality works the same way. The "build event" (conception) ties the artifact to specific inputs.
  *   **Rigidity:** The name "Alexander" rigidly designates the output of *this specific derivation*. It does not designate "whatever human-shaped thing has Alexander's DNA."
  *   **Mapping:**
      *   *Person* $\rightarrow$ Artifact in the store.
      *   *Parents/Gametes* $\rightarrow$ Input Dependencies (source tarballs, base images).
      *   *DNA/Properties* $\rightarrow$ Output Content (bits).
      *   *Essential Origin* $\rightarrow$ The Output Path is a function of Input Hashes. You cannot change Input Hashes and keep the same Output Path.

  **The Argument Against (Counter-Positions)**
  *   **Content-Addressed Identity:** Opponents argue that if the output bits (DNA, psychological continuity) are identical, the artifact is the same. The provenance is metadata, not identity. This is the "Fixed-Output Derivation" view: we key the thing by the hash of its bytes.
  *   **Vagueness/Tolerance:** If you swap 1% of the input wood, it's the same table. If you swap 100%, it's not. Where is the cutoff? In build terms: If I patch one byte of a dependency, does the output artifact become a "different object" metaphysically, or just a new version? Kripke says there is a sharp boundary (different inputs = different object); opponents say identity is fuzzy.
  *   **The Regress (The "Garbage Collection" Problem):**
      *   *The Move:* If the sperm is essential to the person, is the *father* essential to the sperm? If yes, then the father's parents are essential to the father...
      *   *Build Translation:* If Artifact $A$ is defined by Input Hash $H_1$, and $H_1$ is the output of Derivation $D_1$, is $D_1$ essential to $H_1$?
      *   *The Trap:* If you say "Yes, the full attestation chain is essential," you require an infinite build history going back to the Big Bang (or the empty store). If you say "No, we stop at the gametes," you have arbitrarily chosen a **Garbage Collection Root**. You are treating gametes as "fixed-output derivations" (keyed by their bytes) while treating the person as "input-addressed." Kripke needs to explain why the regress stops where he says it does without it being a convention.

  *(Note: The specific formulation of the regress argument is widely discussed in secondary literature responding to Kripke. Kripke himself focuses more on the intuition that "this thing came from *that* stuff." I am flagging this because the regress is often used to attack the thesis rather than defend it.)*

  ---

  ### 2. The Test Cases

  Here is how your specific scenarios translate, along with their philosophical status.

  **(a) Swap in a numerically different but genetically identical sperm.**
  *   **Build Translation:** You replace a source dependency with a different file that has the exact same content hash (a collision, or a mirror).
      *   *Input-Addressed View:* Different input path $\rightarrow$ Different derivation $\rightarrow$ Different artifact.
      *   *Content-Addressed View:* Same input content $\rightarrow$ Same build $\rightarrow$ Same artifact.
  *   **Philosophical Status:** This is a standard "Molecular Duplicate" case. Kripkeans insist the *numerical identity* of the gamete matters, not just its qualitative properties (DNA). In your terms: The *inode* or *store path* of the dependency matters, not just its checksum.

  **(b) Same sperm, same egg, distinct fusion event at a different time.**
  *   **Build Translation:** You run the exact same derivation (same inputs, same script) twice. In a reproducible build system, you get the same output hash. In a non-reproducible system (timestamp embedded), you get different hashes.
      *   *Kripkean View:* Generally, time isn't essential, but the *event* is. If the fusion is the "build command," running it twice creates two distinct artifacts (twins), even if they share inputs. You cannot have the *same* artifact built twice.
      *   *Nuance:* Kripke focuses on material origins. If the materials are identical, he might allow the same person, but most successors argue the *spatiotemporal location* of the build event individuates the artifact.
  *   **Philosophical Status:** This is the "Two Tables from the Same Wood" case. If a carpenter makes a table from wood $W$ at $T_1$, and God makes a table from wood $W$ at $T_2$, are they the same table? Consensus: No, they are distinct artifacts sharing a source.

  **(c) Two zygotes merge into one chimeric embryo.**
  *   **Build Translation:** Two derivations merge their outputs into a single artifact (e.g., static linking of two libraries, or a merge commit in git where history is squashed).
      *   *Identity Question:* What is the input hash of the result? Is it a tuple of both parents?
      *   *Problem:* If identity is input-addressed, this artifact has two distinct "essential origins." Does it have two identities?
  *   **Philosophical Status:** This is a "Fusion" case. It is less standard than fission but discussed in personal identity literature. It breaks the "single origin" assumption. In build terms, it forces you to admit that an artifact can have multiple valid provenance roots, challenging the idea of a unique essential derivation.

  **(d) An early embryo splits (identical twins).**
  *   **Build Translation:** One derivation produces two output artifacts (forking a repo, or a build script that emits two binaries).
      *   *Identity Question:* Which output path is the "original"?
      *   *Input-Addressed View:* Neither. They are both new artifacts derived from the same inputs. The "original" zygote ceased to exist (was garbage collected) and replaced by two new artifacts.
      *   *Content-Addressed View:* They are clones.
  *   **Philosophical Status:** This is the classic "Fission" case (often associated with Parfit, not Kripke). It is the strongest counter-example to simple origin essentialism. If the zygote is the essential origin, and it splits, do both twins have an equal claim to be the "original"? If yes, identity is not one-to-one. If no, on what basis do you choose? (In build terms: which output path gets the name?)

  ---

  ### 3. The Residue Report

  This is where the analogy strains. You identified several friction points; here is the analysis of which are real mismatches and which are artifacts of the translation.

  **1. Modality: "Could-Have-Been" vs. "What-Is"**
  *   **Verdict:** **Real Mismatch.**
  *   **Analysis:** Your vocabulary is entirely indicative (what *did* build). Kripke's thesis is modal (what *could* build).
      *   In Nix, if the input hash changes, the output path *does* change. It is a definition.
      *   In metaphysics, Kripke claims that if the input *had* changed, the person *would not* exist. He claims this is a fact about the world, not a naming convention.
      *   **The Risk:** You might be smuggling in a verificationist stance ("If we can't distinguish the build, it's the same") against a realist stance ("It is different even if we can't tell"). When you say "Identity is whatever we key on," you are adopting a conventionalist view that Kripke explicitly rejects. He thinks he is discovering a constraint on possibility, not choosing a hash function.

  **2. Provenance: Metadata vs. Causal History**
  *   **Verdict:** **Real Mismatch.**
  *   **Analysis:** In SLSA/in-toto, provenance is a signed artifact (metadata). It can be detached, faked, or lost while the binary remains.
      *   In metaphysics, the "provenance" is the actual causal history. You cannot lose the causal history of a person; it is constitutive of them.
      *   **The Risk:** If you treat origins as "attestation," you imply they are external to the artifact. Kripke treats origins as internal. A table *is* (partly) the wood it is made of. A Nix store path *is not* the source code; it is a reference to it. This makes the "essentiality" claim harder to map. In your world, the artifact is self-contained. In Kripke's, the artifact is relationally defined.

  **3. Determinacy: Fiat vs. Fact**
  *   **Verdict:** **Artifact of Analogy (but a useful one).**
  *   **Analysis:** You noted that in build systems, we force determinacy by fiat (hash collisions are impossible by crypto design). In philosophy, there is vagueness.
      *   **The Insight:** This is actually the strongest point *against* Kripke. Your intuition that "we choose a hash function" mirrors the philosophical objection that "origin essentialism is just a linguistic convention."
      *   **The Distortion:** However, treating it *purely* as a convention loses the explanatory power Kripke wants. He wants to explain why we feel it's *wrong* to say "This person could have had different parents." If you say "It's just a convention," you dissolve the intuition rather than explaining it. The residue here is that your vocabulary makes the debate look verbal (how should we name things?), whereas Kripke insists it is substantial (how does the world work?).

  **4. Fixed-Output vs. Input-Addressed**
  *   **Verdict:** **Strong Mapping.**
  *   **Analysis:** This is your best lever.
      *   **Kripke:** Identity is Input-Addressed (Derivation-based).
      *   **Opponent:** Identity is Content-Addressed (Fixed-Output).
      *   **The Conflict:** In engineering, we admit both are valid depending on the use case (security vs. caching). In metaphysics, Kripke claims only one is correct.
      *   **The "Verbal Dispute" Worry:** Does treating them as conventions make the debate purely verbal?
          *   *Yes:* If there is no "fact of the matter" outside our indexing scheme, then Kripke is just advocating for a specific naming convention (Input-Addressing) and calling it a law of nature.
          *   *No:* Kripke would argue that our *practices* of naming track real modal constraints. If we treat people as content-addressable, we run into paradoxes (e.g., if we swap brains, who goes where?). He claims the "Input-Addressed" intuition survives reflection better than the "Content-Addressed" one.
          *   **What is lost:** If you reduce it to "we pick conventions," you lose the normative force. Kripke isn't just saying "Let's call it different." He's saying "You *cannot* coherently imagine it being the same." Your vocabulary allows you to imagine it (just change the hash function); his vocabulary forbids the imagination itself.

  **Summary for your Argument:**
  You can tell your friend: "In my work, we distinguish between **content identity** (bits) and **derivation identity** (provenance). Kripke is arguing that persons are derivation-identity objects. The counter-argument is that persons are content-identity objects. The problem is that in my world, I *choose* which one to use based on utility. Kripke claims reality *forces* one on us. My suspicion is that he's mistaking a very deeply ingrained convention (input-addressing) for a metaphysical law. The 'Regress' argument shows that if you take input-addressing seriously, you need an infinite build chain unless you arbitrarily declare some inputs 'fixed-output' (gametes), which looks like a convention, not a discovery."

  *(Flag: The claim that Kripke is "mistaking convention for law" is a standard critique from the counterpart theory and conventionalist camps, not necessarily my own invention, but it aligns with your engineering perspective.)*
