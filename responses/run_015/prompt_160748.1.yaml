prompt: |-
  I host a monthly "concepts night" in my living room — ten or so people, mostly programmers and EA-adjacent types with a couple of philosophy majors mixed in, all of whom have read a fair amount of LessWrong and Slate Star Codex but almost no formal ethics. Next month I'm on the hook for a forty-minute slot on the procreation asymmetry: the claim that there is no moral requirement to bring into existence a person who would have a life clearly worth living, but that there is a strong one not to bring into existence a person whose life would be worth not living. I have my own half-baked view about where it goes wrong, but what I need from you is a plan for teaching it, not a defense or a critique of it.

  Start with the order of ideas, since that's where I expect to get it wrong. I'm fairly confident that the move "no one is made worse off by being created" has to be on the table before the four-cell table — create a good life, create a bad life, don't create a good life, don't create a bad life — will do any work, but I'm unsure where to place the distinction between an act's being permissible and its being required, and where to place the point that the asymmetry is a constraint on one kind of choice rather than a general account of which outcomes are better. Give me the dependency structure with the reason for each ordering decision. Then the carrying example. The case I've been using with friends is a "hatchery" machine with two dials: one dial sets whether the mind it produces has a life clearly worth living or clearly not worth living, and a second dial can add a fixed amount of well-being to one of the people who already exists. The point of the second dial is to force the question of whether the asymmetry has any verdict at all in a choice between two permissible options — I suspect the honest answer is that it doesn't, and I suspect that will be the thing my group resists hardest. Tell me whether that example can carry the whole session, what it must have and what it must lack in order to work (does the counterfactual of non-existence need to be made vivid, and does the case need to be scrubbed of the politics of reproduction, of uncertainty, of identity-affecting timing, of flow-through effects on third parties?), whether you would replace it and with what, and what to do with a third dial I've also toyed with — one that painlessly deletes an already-existing contented person, as a probe for whether the asymmetry is really about existence or about being made worse off.

  Third, the misconception map, in the order you'd expect them to arise and with the point in the sequence where each should be headed off — before it can form, or after it has formed and can be named. The ones I anticipate: that the asymmetry is just antinatalism in a lab coat; that no one is worse off is the same claim as no one is harmed and settles the matter; that the asymmetry is really a threshold view about lives being worth living plus something about risk; that it must be total utilitarianism with the serial numbers filed off; and that it must say something in the second-dial case. Correct my list, add what I'm missing, and tell me which of these are worth deliberately letting surface so they can be killed in front of the room. Close with one question I can ask at the end that distinguishes having understood the asymmetry from having merely been talked out of arguing with it, and with an explicit accounting of what I should refuse to explain in forty minutes — I'd guess at least the non-identity problem and the view that coming into existence is always a harm to the person who comes into existence, but tell me what you'd cut and how I should say out loud that I'm cutting it rather than dodging it.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** ~10 people, programmers/EA-adjacent/philosophy majors, read LessWrong/SSC, little formal ethics. Smart, analytical, likely familiar with utilitarian calculus but maybe not population ethics specifics.
      *   **Topic:** The Procreation Asymmetry (Parfit's Non-Identity Problem context, but specifically the asymmetry claim: no duty to create happy people, strong duty not to create miserable people).
      *   **Goal:** A teaching plan (order of ideas, example usage, misconception management, closing question, scope boundaries). *Not* a defense or critique of the user's view.
      *   **Time:** 40 minutes.
      *   **User's Specific Inputs:**
          *   Believes "no one is made worse off" must come before the 4-cell table.
          *   Unsure where to place permissibility vs. requirement distinction.
          *   Unsure where to place the "constraint on choice vs. account of outcomes" point.
          *   Current Example: "Hatchery Machine" (Dial 1: Create Happy/Sad, Dial 2: Add welfare to existing person).
          *   Worry: Does the Hatchery example carry the whole session? Does it need scrubbing (politics, identity, etc.)? What about Dial 3 (delete existing person)?
          *   Anticipated Misconceptions: Antinatalism, "worse off" = "harmed", threshold/risk view, Total Utilitarianism disguise, must have verdict on Dial 2 case.
          *   Closing: Need a comprehension check question and scope boundaries (what to explicitly cut).

  2.  **Deconstruct the Content & Structure (Order of Ideas):**
      *   *Constraint:* 40 minutes is short. Need tight flow.
      *   *User's Intuition:* "No one made worse off" $\rightarrow$ 4-Cell Table. This is sound. The intuition pumps the table.
      *   *The Asymmetry:* It's about *obligations*, not just *value*. This needs to be highlighted early to avoid conflating it with Total Utilitarianism (which says creating happy people is good/required).
      *   *Dependency Structure:*
          1.  **Intuition Pump:** "No one is worse off by being created" (Person-Affecting Intuition). *Why first?* Because without this, the asymmetry looks arbitrary. It grounds the "no duty to create" side.
          2.  **The 4-Cell Table:** Visualizes the logical space. *Why second?* Once grounded in the intuition, we map the intuition onto the four possibilities.
          3.  **Permissibility vs. Requirement:** *Why third?* The table shows outcomes; ethics is about action. We need to distinguish "Good to do" vs. "Must do." This clarifies the asymmetry (One is forbidden, one is merely optional).
          4.  **Constraint on Choice vs. Outcome Value:** *Why fourth?* This is the meta-ethical pivot. It explains *why* the table looks lopsided. It's not that the outcome "Happy Person Exists" is neutral, but that the *reason* to bring it about is missing.
      *   *Refinement:* Actually, combining 3 and 4 might be necessary for time. The distinction between "Better Outcome" and "Required Action" is crucial for the Asymmetry.

  3.  **Evaluate the "Hatchery Machine" Example:**
      *   *Strengths:* Scrubs politics (no sex, no parents), scrubs identity (machine makes generic minds), isolates variables.
      *   *Weaknesses:* Can feel too sci-fi/abstract. Dial 2 (add welfare to existing) is the critical stress test.
      *   *Dial 2 Analysis:* The user suspects the Asymmetry has *no verdict* here (incommensurable options). The audience will resist this (EA types love maximizing). This is the perfect friction point.
      *   *Dial 3 (Delete Existing):* *Danger.* This introduces the "Person-Affecting View" vs. "Impersonal View" conflict too aggressively. It might derail into "Is killing worse than not creating?" which is a different debate. *Recommendation:* Keep it in the back pocket only if time permits, or use it to define the boundary of the asymmetry (Asymmetry applies to *potential* people, not existing ones).
      *   *Scrubbing:* Yes, scrub politics, uncertainty, and third-party effects. Keep it sterile. The counterfactual of non-existence *must* be vivid (the "Never Existed" state).
      *   *Verdict:* The Hatchery works well *if* kept sterile. Dial 2 is the climax. Dial 3 is a distraction for a 40-min intro.

  4.  **Map Misconceptions:**
      *   *List:* Antinatalism, Worse Off = Harmed, Threshold/Risk, Total Utilitarianism, Verdict on Dial 2.
      *   *Ordering:*
          1.  *Total Utilitarianism:* Head this off *before* the 4-cell table. If they think it's just Utilitarianism, they won't see the asymmetry.
          2.  *Worse Off = Harmed:* Address this *during* the "No one is worse off" intuition pump. This is the philosophical crux.
          3.  *Antinatalism:* Address *after* the table. Show that creating happy people is *permissible*, distinguishing it from antinatalism.
          4.  *Threshold/Risk:* Address *during* Dial 2 discussion.
          5.  *Verdict on Dial 2:* This is the final boss. Let it surface, then explain the "No Verdict" implication (incommensurability).
      *   *Strategy:* Let "Total Utilitarianism" and "Antinatalism" surface early so they can be dismissed. Let "Verdict on Dial 2" surface late as the synthesis challenge.

  5.  **Closing Question & Scope:**
      *   *Question:* Needs to test understanding of the *asymmetry*, not just the conclusion. "If you could press a button to create a happy person or a button to add happiness to an existing person, does the Asymmetry tell you which to pick?" (Answer: No/It doesn't say).
      *   *Scope Cuts:* Non-Identity Problem (too deep), Benatar (Existence is always harm - distinct view), Repugnant Conclusion (related but distinct). Need to explicitly state: "We are not solving the Non-Identity Problem today; we are defining the Asymmetry that arises within it."

  6.  **Drafting the Plan (Iterative refinement):**
      *   *Intro:* 5 mins. Hook + Definition.
      *   *Section 1:* The Intuition (No one worse off). 10 mins.
      *   *Section 2:* The Table + Asymmetry. 10 mins.
      *   *Section 3:* The Hatchery (Dial 1 & 2). 10 mins.
      *   *Section 4:* Misconceptions + Closing. 5 mins.
      *   *Wait, 40 mins is tight.* Need to integrate misconceptions into the flow rather than a separate section.
      *   *Refining the Order:*
          1.  Setup (Hatchery Dial 1).
          2.  Intuition ("No one worse off").
          3.  The Table (Visualizing the asymmetry).
          4.  Distinction (Permissible vs. Required).
          5.  Stress Test (Hatchery Dial 2).
          6.  Closing.

  7.  **Addressing Specific User Queries:**
      *   *Dependency Structure:* Need to justify why "No one worse off" precedes the Table. (Because the Table's top-left cell relies on it).
      *   *Permissibility vs. Requirement:* Place this *after* the Table but *before* Dial 2. The Table shows the moral status; the distinction explains the action.
      *   *Constraint vs. Outcome:* Place this with Permissibility. It explains *why* the requirement is missing.
      *   *Hatchery:* Keep it. Scrub politics/identity. Dial 3? Cut it. It confuses potential vs. existing persons.
      *   *Misconceptions:* Add "The Asymmetry implies happy lives have zero value." (Common confusion).
      *   *Closing Question:* Focus on the Dial 2 incommensurability.
      *   *Cuts:* Non-Identity Problem (mention as context, don't teach), Benatar, Repugnant Conclusion.

  8.  **Final Polish:** Ensure tone is appropriate for EA/LW crowd (analytical, precise, acknowledging uncertainty). Make sure the "No Verdict" on Dial 2 is highlighted as the feature, not a bug, of the view.

  *(Self-Correction during drafting)*: I need to be careful about the "Constraint on choice" point. The user wants to know where to put it. It fits best when explaining *why* we don't have a duty to create happy people. It's not that the world isn't better, it's that the *moral reason* doesn't apply to non-existent subjects. I will place this immediately after the 4-cell table to explain the empty cell.

  *(Refining Dial 3)*: The user asked specifically about Dial 3. I should advise *against* using it live, but explain *why* (it shifts from Procreation Asymmetry to Person-Affecting Restriction generally). I'll suggest keeping it as a "parking lot" idea if someone asks about killing.

  *(Refining Misconceptions)*: The EA crowd will definitely jump to "Total Utilitarianism." I need to make sure the user explicitly contrasts the Asymmetry with Total Utilitarianism early.

  *(Final check on time)*: 40 minutes is very fast for population ethics. The plan must be aggressive on cutting tangents.

  9.  **Final Output Structure:**
      *   Dependency Structure (Order of Ideas).
      *   The Carrying Example (Hatchery analysis).
      *   Misconception Map.
      *   Closing Question & Scope Boundaries.

