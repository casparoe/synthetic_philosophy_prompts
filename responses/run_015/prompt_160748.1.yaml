answer: |-
  Here is a teaching plan designed for a forty-minute slot with an analytically sophisticated, EA-adjacent audience.

  ### 1. Dependency Structure: Order of Ideas

  You are correct that the "no one is made worse off" intuition must precede the table. If you present the table first, the asymmetry looks like an arbitrary rule. If you present the intuition first, the table looks like a logical consequence.

  Here is the dependency graph with the reasoning for each ordering decision:

  1.  **The Person-Affecting Intuition ("No one is made worse off")**
      *   *Position:* First.
      *   *Reason:* This is the engine. Without establishing that existence cannot be a harm/benefit *to the subject* relative to non-existence, the claim that "creating a happy person is optional" looks like nihilism. You must secure the premise that moral obligations usually require a subject who is wronged.
  2.  **The Four-Cell Table (The Logical Space)**
      *   *Position:* Second.
      *   *Reason:* Now that you have the intuition, map it. The table visualizes the asymmetry.
          *   Create Happy: Permissible (Intuition: No one harmed by creation).
          *   Create Miserable: Forbidden (Intuition: Someone harmed by creation).
          *   Don't Create Happy: Permissible (Intuition: No one exists to be deprived).
          *   Don't Create Miserable: Permissible/Required (Intuition: Prevents harm).
      *   *Note:* Do not linger on the "Don't Create Miserable" cell; the friction is in the "Create/Don't Create Happy" column.
  3.  **Permissibility vs. Requirement (The Deontic Status)**
      *   *Position:* Third.
      *   *Reason:* The table shows outcomes; ethics dictates action. You must distinguish between "This outcome is good" and "You are required to cause this outcome." This is where you block the Total Utilitarian objection. The asymmetry claims creating a happy person is *good* (or neutral) but not *required*.
  4.  **Constraint on Choice vs. Account of Value (The Meta-Ethical Pivot)**
      *   *Position:* Fourth (Integrated with #3).
      *   *Reason:* This explains *why* #3 is true. It is not that the universe is not better with the happy person; it is that the *moral reason* to act is constrained by the existence of a subject. Place this here to explain the "gap" in the requirement. If you place this earlier, it's too abstract. If later, the audience is already stuck on why they aren't required to maximize.
  5.  **The Incommensurability Claim (The Dial 2 Stress Test)**
      *   *Position:* Fifth (The Climax).
      *   *Reason:* This applies the structure to a hard case. If you do this earlier, they lack the framework to understand why there might be "no verdict."

  ### 2. The Carrying Example: The Hatchery Machine

  **Verdict:** The Hatchery example is strong enough to carry the session, *provided* you rigorously scrub it. It is superior to real-world reproduction cases because it removes the "special obligation of parents" confounder.

  **What it must have:**
  *   **Vivid Non-Existence:** You must explicitly state that Dial 1's "Off" position means *no mind is instantiated*. No soul waiting in the void. Just silence.
  *   **Isolation:** Explicitly state there are no resource constraints, no environmental impacts, and no effect on society. This is moral physics in a vacuum.
  *   **The "Fixed Amount" Specifics:** For Dial 2, use specific hedonic units (e.g., "+100 utils to an existing person"). EA types love units. It makes the trade-off concrete.

  **What it must lack:**
  *   **Identity-Affecting Timing:** Do not discuss *which* child is created. The Hatchery creates a generic mind. This avoids the Non-Identity Problem rabbit hole (see Scope Boundaries).
  *   **Politics of Reproduction:** No mention of overpopulation, climate change, or parental rights.
  *   **Uncertainty:** The dials are deterministic. You know exactly what life the mind will have.

  **How to run the Dials:**
  *   **Dial 1 (Create Happy vs. Create Sad vs. Off):** Use this to establish the Asymmetry. Ask: "Are you required to turn it to Happy?" (Most will say no). "Are you forbidden to turn it to Sad?" (Most will say yes). "Why the difference?" (Elicit the "No one is worse off" intuition).
  *   **Dial 2 (Create Happy vs. Boost Existing):** This is your climax.
      *   *Option A:* Create new happy person.
      *   *Option B:* Add +100 utils to existing person.
      *   *The Trap:* Total Utilitarians say A is better (more total utility). Person-Affecting views struggle here.
      *   *The Asymmetry View:* There is **no verdict**. The moral reason to boost the existing person (they exist) outweighs or silences the moral reason to create the new person (they don't exist). Or, the values are incommensurable.
      *   *Teaching Point:* This is where you expect resistance. Lean into it. "The Asymmetry implies that sometimes there is no 'right' answer, only 'permissible' answers."
  *   **Dial 3 (Delete Existing):** **Cut this from the main flow.**
      *   *Reason:* It shifts the topic from *Procreation* (potential persons) to *Killing* (existing persons). The Procreation Asymmetry is specifically about the moral status of bringing people into existence vs. keeping them out. Introducing deletion muddies the water with the "Right to Life" debate.
      *   *Usage:* Keep it in your back pocket. If someone asks, "Does this mean existing people don't matter?" you can say, "No, Dial 3 is forbidden for entirely different reasons. We are only discussing the entry ticket, not the exit."

  ### 3. Misconception Map

  Here is the order in which these will arise, and where to intercept them.

  1.  **"This is just Antinatalism."**
      *   *When:* Immediately after you say "No duty to create happy people."
      *   *Intercept:* **Head it off before it forms.** When defining the Asymmetry, explicitly state: "Antinatalism says creating is *wrong*. The Asymmetry says creating is *optional*." Write "Optional vs. Forbidden" on the board.
  2.  **"No one is worse off = No one is harmed."**
      *   *When:* During the "No one is made worse off" intuition pump.
      *   *Intercept:* **Let it surface, then refine.** Allow them to equate the two. Then correct it: "Harm usually implies making someone worse off than they *otherwise would be*. If they otherwise wouldn't be, the concept of harm breaks. That's the bug we're exploring."
  3.  **"This is Total Utilitarianism with serial numbers filed off."**
      *   *When:* During the 4-Cell Table.
      *   *Intercept:* **Kill it early.** Total Utilitarianism requires maximizing the sum. If you are not required to create the happy person, you are not a Total Utilitarian. Make this a hard binary distinction.
  4.  **"It's really a threshold view about risk."**
      *   *When:* During Dial 1 (Sad vs. Happy).
      *   *Intercept:* **Let it surface.** It's a plausible alternative theory. Acknowledge it: "Some argue it's just about avoiding risk of suffering." Then counter: "But the Asymmetry holds even if we are *certain* the life is good. It's not about risk; it's about the subject."
  5.  **"The Asymmetry must have a verdict on Dial 2."**
      *   *When:* The Climax (Dial 2).
      *   *Intercept:* **Let this one bleed.** This is the hardest pill. If you tell them "There is no verdict" too smoothly, they won't feel the weight. Let them argue for a verdict. Then reveal that the Asymmetry's cost is accepting incommensurability. This distinguishes understanding from agreement.

  **Missing Misconception:**
  *   **"Happy lives have zero value."**
      *   *When:* Anytime.
      *   *Intercept:* Clarify that the Asymmetry is compatible with thinking happy lives are *good*, just not *morally required to be caused*. The value is impersonal; the obligation is personal.

  ### 4. Closing Question & Scope Boundaries

  **The Comprehension Question:**
  Do not ask "Do you agree?" Ask a question that tests if they grasp the *structure* of the view, specifically the incommensurability.

  > "If the Procreation Asymmetry is true, and you have a choice between creating a new happy person or adding a small amount of happiness to an existing person, does the theory tell you which choice is *better*?"

  *   *Correct Answer:* No (or "It depends on how you weigh incommensurable reasons, but the Asymmetry itself doesn't rank them").
  *   *Incorrect Answer:* "Yes, help the existing person" (This is a Person-Affecting Restriction, which is stronger than the Asymmetry) OR "Yes, create the person" (Total Utilitarianism).
  *   *Why:* This tests if they understand that the Asymmetry removes the *requirement* to create, without necessarily providing a *ranking* for mixed choices.

  **Scope Boundaries (What to Cut):**
  You cannot teach Population Ethics in 40 minutes. You must explicitly declare what you are ignoring to prevent "Well, actually..." derailments.

  1.  **The Non-Identity Problem:**
      *   *Cut:* Do not explain Parfit's specific formulation involving different identities based on timing.
      *   *Script:* "The Non-Identity Problem is the broader context for this, specifically regarding *which* child is born. Today we are isolating the *Asymmetry* regarding *whether* a child is born. We are assuming the identity is fixed or irrelevant to keep the logic clean."
  2.  **Benatar's 'Better Never to Have Been':**
      *   *Cut:* Do not discuss the claim that *all* existence is harm.
      *   *Script:* "We are discussing the asymmetry between good and bad lives. Claims that *all* lives are net negative are a separate debate we don't have time for."
  3.  **The Repugnant Conclusion:**
      *   *Cut:* Do not discuss massive populations of barely-livable lives.
      *   *Script:* "We are looking at clear-cut cases: lives clearly worth living vs. clearly not. We are not solving the math of massive populations today."

  **How to announce the cuts:**
  Start the session with this: *"Population ethics is a minefield. To get anywhere in forty minutes, I am going to surgically remove three topics: The Non-Identity Problem, Antinatalism, and the Repugnant Conclusion. If you bring those up, I will park them in the 'Parking Lot' and we will return to the Asymmetry. This isn't because they aren't important, but because they will eat the time we need to understand the core mechanism."*

  This signals respect for their knowledge while maintaining control of the clock.
