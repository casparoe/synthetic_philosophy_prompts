      *   **Critical Analysis:** Identify where Jaspers' framework breaks down (defeated aggressor vs. negotiated transition). Address specific questions about amnesty, political guilt, and metaphysical guilt in a unified nation.
      *   **Extension:** Propose a potential "fifth kind of guilt" inherent in the TRC's restorative justice model that Jaspers didn't anticipate.
