      *   *Key Insight:* The TRC effectively converted *Criminal Guilt* into *Political/Moral Guilt* to save the state. Jaspers would likely hate this, but it might have been necessary.
      *   *The "Fifth":* Let's call it **"Civic Guilt"** or **"Constitutional Guilt."** The guilt of inheriting a broken system and the mandate to fix it. Actually, **"Structural Complicity"** is better. The TRC focused on *events* (killings), but the real guilt was *structure* (pass laws, Bantu education). Jaspers didn't account for systemic, bureaucratic evil that isn't a specific "crime."
