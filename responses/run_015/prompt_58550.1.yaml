prompt: |-
  Having read rationalist blogs and forums for the better part of a decade, I have internalized the habit of dissolving confused concepts into operations, and I now need that habit made usable for others. I lead assessment design for a software apprenticeship that admits about twenty career-changers from several hundred applicants every six weeks. The stakes are livelihoods and cohort quality, and my assessors are working engineers with no training in psychometrics who have at most twenty minutes to vet a proposed task before our program director signs off on it.

  My problem is that our tasks all claim to select for intelligence, but they mean incompatible things by it: on one hand, accumulated knowledge and practiced skill; on the other, speed and efficiency in acquiring new skills when the environment is novel and uncertain; on still another, a bundle of largely independent aptitudes rather than one thing. I am also worried about Goodhart effects from coaching and from unrestricted use of AI assistants. I want you to translate that philosophical disagreement into a reusable vetting procedure that non-specialists can actually run.

  Give me a stepwise procedure, flowchart in words, with questions to ask in order about any proposed assessment task, what counts as passing each step, where a task fails outright, and where the procedure must defer to human judgment because the issue is normative or empirically underdetermined. The procedure must preserve the distinctions that matter most — between difficulty and novelty, between transfer near and far, between learning quickly from few examples and performing well after extensive practice, and between generality across goals and narrow optimization — while dropping whatever cannot be checked in twenty minutes. Mark explicitly the points where judgment cannot be eliminated and the kinds of tasks where you expect the procedure to misfire.

  Then demonstrate the procedure on these three candidate tasks we are actually considering:

  Task A, Alien Spreadsheet: 45 minutes, no internet, candidates may consult documentation for a fictional data-transformation language with twelve unfamiliar operators, then must clean a messy dataset containing edge cases not covered in the examples.

  Task B, Familiar Build: 48-hour take-home, open internet and AI tools allowed, to build a standard to-do application with login and persistence, graded on completeness, code organization, and polish.

  Task C, Broken Pipeline: 90-minute live exercise in a deliberately obfuscated and invented build system where half the files are irrelevant and several error messages point to the wrong cause, graded on diagnosing the root failure and getting a minimal deployment working.

  Show your work for each, include at least one verdict my team will dislike and explain why the procedure requires it, and close with a short statement of what the procedure cannot do and what it should never be used to justify.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Leads assessment design for a software apprenticeship (high stakes, 20 admits/6 weeks, career-changers).
      *   **Context:** Rationalist background (dissolving concepts into operations), assessors are working engineers (no psychometrics training, 20 mins max vetting time).
      *   **Problem:** "Intelligence" is ill-defined (knowledge vs. learning speed vs. aptitude bundle). Worries about Goodhart's Law (coaching, AI).
      *   **Goal:** A stepwise vetting procedure (flowchart in words) to translate philosophical disagreements into operational checks.
      *   **Requirements:**
          *   Preserve distinctions: Difficulty vs. Novelty, Near vs. Far Transfer, Quick Learning vs. Practice Performance, Generality vs. Narrow Optimization.
          *   Drop uncheckable items (must fit 20 mins).
          *   Mark points of irreducible human judgment.
          *   Mark where the procedure might misfire.
          *   Demonstrate on three specific tasks (A, B, C).
          *   Include at least one unpopular verdict.
          *   Close with limitations (what it can't do/shouldn't justify).

  2.  **Deconstruct the Core Tension:**
      *   The user wants to measure *potential* (learning speed, adaptability) but often ends up measuring *status* (accumulated knowledge, practiced skill).
      *   AI and coaching exacerbate this by allowing candidates to outsource the "thinking" part or memorize the "doing" part.
      *   The procedure needs to force assessors to decide *what* they are actually measuring before they approve *how* they measure it.

  3.  **Drafting the Procedure (The "Operational Vetting Protocol"):**
      *   *Constraint:* 20 minutes. Needs to be fast, binary checks where possible, explicit flags for judgment.
      *   *Structure:*
          1.  **Define the Target:** What specific cognitive operation is this testing? (Dissolve "intelligence").
          2.  **Check Novelty vs. Knowledge:** Is this recall or adaptation?
          3.  **Check AI/Coaching Vulnerability:** Can this be outsourced?
          4.  **Check Signal-to-Noise:** Does performance correlate with the target?
          5.  **Final Go/No-Go.**
      *   *Distinctions to preserve:*
          *   Difficulty (hard known thing) vs. Novelty (easy unknown thing).
          *   Near Transfer (same context) vs. Far Transfer (new context).
          *   Learning Rate (slope) vs. Performance Level (height).
          *   Generality vs. Narrow Optimization.

      *   *Refining the Steps (Mental Walkthrough):*
          *   Step 1: The "Because" Statement. Force them to say "We accept if they do X because it proves Y."
          *   Step 2: The "Google/AI" Test. If the answer is searchable or promptable, it measures resourcefulness, not raw aptitude.
          *   Step 3: The "Cramming" Test. Can a bootcamp teach this specifically in a week? If yes, it measures prior exposure, not potential.
          *   Step 4: The "Time/Complexity" Balance. Is the time limit forcing speed over accuracy or depth over breadth?

      *   *Identifying Judgment Calls:*
          *   Determining "Fairness."
          *   Deciding if a specific skill is "core" enough to be a knowledge gate.
          *   Estimating AI capability evolution.

  4.  **Developing the Demonstration (Tasks A, B, C):**

      *   **Task A (Alien Spreadsheet):**
          *   *Type:* Novelty/Learning Speed.
          *   *Pros:* Hard to coach (fictional language), limits AI (no internet).
          *   *Cons:* Might measure reading comprehension more than coding.
          *   *Verdict:* Likely Pass (measures learning speed).

      *   **Task B (Familiar Build):**
          *   *Type:* Knowledge/Practice.
          *   *Pros:* Realistic work.
          *   *Cons:* High AI vulnerability, high coaching vulnerability (standard tutorial). Measures prior experience more than potential.
          *   *Verdict:* Likely Fail (for *aptitude* selection, though good for skill check). *This is the unpopular one.* Most engineers love take-homes that look like real work. But for *selecting career-changers with potential*, it selects for those who already know React/Node.

      *   **Task C (Broken Pipeline):**
          *   *Type:* Debugging/Resilience under uncertainty.
          *   *Pros:* Hard to AI (obfuscated, live), measures diagnosis.
          *   *Cons:* High stress, might measure tolerance for bad tools rather than engineering skill.
          *   *Verdict:* Conditional Pass (needs calibration on "obfuscation" level).

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the rationalist framing (map/territory).
      *   **The Protocol:** The 20-minute flowchart.
      *   **The Demonstration:** Applying the protocol to A, B, C.
      *   **The Unpopular Verdict:** Highlighting Task B's failure.
      *   **Limitations:** What this tool isn't.

  6.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions specific "Yes/No" or "Fill in the blank."
      *   *Critique:* Did I address the AI concern enough?
      *   *Fix:* Add a specific "AI Substitution" step.
      *   *Critique:* Is the distinction between Difficulty and Novelty clear?
      *   *Fix:* Ensure Step 2 explicitly asks "Is this hard because it's complex, or hard because it's new?"
      *   *Tone:* Professional, precise, slightly clinical (matching the rationalist vibe).

  7.  **Final Review against Constraints:**
      *   Stepwise procedure? Yes.
      *   Flowchart in words? Yes.
      *   Questions to ask? Yes.
      *   Pass/Fail criteria? Yes.
      *   Judgment markers? Yes.
      *   Misfire warnings? Yes.
      *   Demo on A, B, C? Yes.
      *   Unpopular verdict? Yes (Task B).
      *   Closing statement? Yes.

  8.  *(Self-Correction on Task B Verdict)*: I need to make sure I explain *why* the team will dislike it. They will dislike it because it looks like "real work." I need to emphasize that "real work" in a hiring context often selects for prior privilege/training, not future potential.

  9.  *(Self-Correction on Procedure Length)*: Keep it tight. Assessors have 20 minutes. The procedure itself shouldn't take 20 minutes to read. Use bolding and bullet points.

  10. *(Final Polish)*: Ensure the "Rationalist" terminology (dissolving, Goodhart, map/territory) is used correctly but not pretentiously.

  *(Drafting the response based on these thoughts...)*
answer: |-
  ## The Operational Vetting Protocol (OVP)

  **Purpose:** To dissolve the label "intelligence" into specific cognitive operations and prevent Goodhart's Law from corrupting selection signals.
  **Time Budget:** 20 Minutes maximum per task.
  **Users:** Working engineers (no psychometrics training required).

  ### Part 1: The Procedure

  **Step 1: The "Because" Statement (3 Minutes)**
  *   **Action:** The proposer must complete this sentence in writing: *"We accept a candidate who performs well on this task because it proves they can _______ in our program."*
  *   **Pass:** The blank is filled with a specific operation (e.g., "debug unfamiliar systems," "learn syntax from docs," "structure a project").
  *   **Fail:** The blank contains a noun or trait (e.g., "are smart," "have potential," "know React").
  *   **Judgment Call:** If the operation is vague (e.g., "think like an engineer"), the Program Director must arbitrate before proceeding.

  **Step 2: The Novelty vs. Difficulty Check (5 Minutes)**
  *   **Action:** Ask: *"Is this task hard because the concepts are complex (Difficulty), or because the context is unfamiliar (Novelty)?"*
  *   **Question A:** Can a candidate solve this using only knowledge acquired in a standard 12-week bootcamp or common tutorials?
      *   **Yes:** This measures **Accumulated Knowledge**. (Acceptable only if knowledge is a strict prerequisite).
      *   **No:** This measures **Learning Speed/Adaptability**.
  *   **Question B:** If we gave the candidate the solution key 24 hours prior, could they memorize the path to success without understanding the mechanism?
      *   **Yes:** **High Coaching Vulnerability.** (Reject or Redesign).
      *   **No:** **Low Coaching Vulnerability.**
  *   **Fail Outright:** If the task claims to measure Adaptability but Question A is "Yes."

  **Step 3: The AI Substitution Test (5 Minutes)**
  *   **Action:** Assume the candidate has access to a state-of-the-art LLM (unless explicitly air-gapped).
  *   **Question:** Can the prompt for this task be pasted into an AI to generate a passing solution with less than 10 minutes of human debugging?
      *   **Yes:** This measures **Prompt Engineering**, not target operation. (Reject for aptitude selection).
      *   **No:** Proceed.
  *   **Exception:** If the task *explicitly* allows AI and grades the *evaluation* of AI output, mark as "AI-Integrated" and skip to Step 4.
  *   **Judgment Call:** Estimating AI capability is empirical guesswork. If assessors disagree on AI solvability, default to "AI Solvable" (conservative bias).

  **Step 4: Transfer Distance Calibration (5 Minutes)**
  *   **Action:** Map the task context to the apprenticeship context.
  *   **Question:** Is the context **Near** (same tools, same domain) or **Far** (different tools, isomorphic logic)?
      *   **Near Transfer:** Measures **Readiness**. (Risk: Selects for prior privilege/exposure).
      *   **Far Transfer:** Measures **Generalization**. (Risk: Candidates may fail due to confusion, not lack of ability).
  *   **Requirement:** If the goal is to select for *growth potential* (career-changers), the task must have at least one **Far Transfer** element (e.g., new language, broken environment).
  *   **Fail Outright:** A task claiming to measure "potential" that is purely Near Transfer.

  **Step 5: The Signal-to-Noise Ratio (2 Minutes)**
  *   **Action:** Identify the primary failure mode.
  *   **Question:** If a candidate fails, is it most likely because (A) they lack the target aptitude, or (B) they misunderstood the instructions/run into a trivial bug?
      *   **Mostly B:** The task is **Noisy**. (Reject).
      *   **Mostly A:** The task is **Signal-Rich**. (Approve).
  *   **Judgment Call:** Distinguishing A from B requires past data. For new tasks, assume "Noisy" until proven otherwise.

  ---

  ### Part 2: Demonstration on Candidate Tasks

  Here is the OVP applied to your three specific tasks.

  #### Task A: Alien Spreadsheet
  *   **Step 1 (Because):** "We accept... because it proves they can **parse unfamiliar documentation and apply rules to edge cases**." (Pass: Specific operation).
  *   **Step 2 (Novelty):**
      *   Bootcamp knowledge? No (fictional language).
      *   Memorizable? No (edge cases vary).
      *   *Verdict:* Measures **Learning Speed**.
  *   **Step 3 (AI):**
      *   Air-gapped (no internet). AI cannot access the specific fictional docs provided in the exam room.
      *   *Verdict:* **AI Resistant.**
  *   **Step 4 (Transfer):**
      *   Context: Fictional (Far). Logic: Data transformation (Near).
      *   *Verdict:* Good balance for career-changers.
  *   **Step 5 (Signal):**
      *   Failure mode: Misreading docs vs. inability to apply logic.
      *   *Risk:* Reading comprehension might confound coding ability.
  *   **Final Verdict:** **APPROVE.**
  *   **Note:** This measures the "slope" (learning rate) rather than the "height" (current skill).

  #### Task B: Familiar Build (To-Do App)
  *   **Step 1 (Because):** "We accept... because it proves they can **build a standard CRUD app with auth**." (Pass: Specific operation).
  *   **Step 2 (Novelty):**
      *   Bootcamp knowledge? **Yes.** This is the canonical bootcamp project.
      *   Memorizable? **Yes.** Thousands of tutorials exist.
      *   *Verdict:* Measures **Accumulated Knowledge**.
  *   **Step 3 (AI):**
      *   Promptable? **Yes.** "Build a todo app with login and persistence in [Stack]" is a trivial prompt for current models.
      *   *Verdict:* **High AI Vulnerability.**
  *   **Step 4 (Transfer):**
      *   Context: Standard Web Dev (Near).
      *   *Verdict:* Pure Near Transfer.
  *   **Step 5 (Signal):**
      *   Failure mode: Did they code it, or did they copy/paste? Hard to distinguish in 48 hours without proctoring.
  *   **Final Verdict:** **REJECT for Aptitude Selection.**
  *   **Why your team will dislike this:** Engineers love this task because it looks like "real work." However, under OVP, this task selects for **prior exposure and access to training**, not **potential to learn**. In a career-changer cohort, this systematically biases toward those who had the time/money to learn React/Node beforehand, violating the "growth potential" mandate. It also collapses under AI pressure.
  *   **Pivot:** Use only if the goal is to verify *minimum viable skill* before day 1, not to select for *intelligence*.

  #### Task C: Broken Pipeline
  *   **Step 1 (Because):** "We accept... because it proves they can **diagnose root causes in opaque systems**." (Pass: Specific operation).
  *   **Step 2 (Novelty):**
      *   Bootcamp knowledge? No (invented build system).
      *   Memorizable? No (deliberately obfuscated).
      *   *Verdict:* Measures **Resilience/Debugging**.
  *   **Step 3 (AI):**
      *   Promptable? Error messages are misleading. AI relies on pattern matching against known errors.
      *   *Verdict:* **Moderate AI Resistance** (AI may hallucinate fixes).
  *   **Step 4 (Transfer):**
      *   Context: Invented system (Far). Logic: Dependency resolution (Near).
      *   *Verdict:* Good Far Transfer.
  *   **Step 5 (Signal):**
      *   Failure mode: **High Noise.** "Deliberately obfuscated" often means "randomly broken." Candidates may fail because the break is illogical, not because they are bad engineers.
      *   *Judgment Call:* The Program Director must review the specific "breaks" to ensure they are solvable via logic, not just trial-and-error.
  *   **Final Verdict:** **CONDITIONAL APPROVE.**
  *   **Condition:** The "obfuscation" must be audited. If the error messages point to the *wrong* cause, is there a logical path to find the *right* cause? If not, it measures **tolerance for frustration**, not engineering skill.

  ---

  ### Part 3: Limitations & Warnings

  **Where the Procedure Misfires:**
  1.  **The "Creativity" Blindspot:** The OVP favors convergent thinking (finding the right answer) over divergent thinking (creating new paths). It will systematically undervalue tasks that measure architectural innovation or design intuition.
  2.  **The AI Arms Race:** Step 3 relies on current assessor intuition about AI. This will become outdated within 6-12 months. This procedure requires a quarterly "AI Calibration" session.
  3.  **The Fairness Trade-off:** By filtering out "Familiar Build" tasks (Task B) to reduce privilege bias, you increase stress on candidates who *do* have experience. They may perceive the "Alien" tasks as arbitrary hoops.

  **What This Procedure Cannot Do:**
  *   **It cannot validate fairness.** A task can pass the OVP and still be demographically biased (e.g., "Alien Spreadsheet" might correlate highly with prior exposure to Excel-like logic, which is socioeconomically stratified). You need external outcome data for that.
  *   **It cannot measure "Culture Fit."** It dissolves "intelligence," not "collaboration" or "values."

  **What This Should Never Justify:**
  *   **Never use an OVP "Pass" to defend a task that candidates find meaningless.** Operational validity does not equal candidate experience. If a task passes the OVP but causes high drop-out rates among accepted candidates, the *predictive validity* is irrelevant because the *selection yield* is broken.
  *   **Never use this to reject a candidate.** This is a tool for vetting the *test*, not the *test-taker*. Using these distinctions to explain a rejection to a candidate ("You failed because this was a Far Transfer task") is adversarial and unhelpful.

  **Final Instruction to Assessors:**
  If you cannot complete Step 1 ("The Because Statement") without using a vague noun, **stop**. Do not build the task. You are measuring a ghost.
