      *   *The Defect:* Why is this still weird? Because Alex doesn't *feel* the force of the reason. Alex treats "disrupts deep work" as a *rule* Jordan identified, not a *value* Alex grasps. Alex is following a *map* drawn by Jordan, not navigating by their own compass, even if the map is accurate.
      *   *Refining the Defect:* The "Residue" is the lack of *Moral Ownership*. Alex treats the moral truth as a *discovery made by Jordan* rather than a *demand apprehended by Alex*.
      *   *Specific nuance:* Alex treats the normative connection (Disruption -> Wrong) as a piece of *information* transmitted, rather than a *judgment* exercised.

  4.  **Drafting the Contrast Case (The "Unproblematic" Case):**
      *   *Difference:* Alex arrives at the verdict via the *same* reasons but through *deliberation* triggered by Jordan, rather than *acceptance* of Jordan's verdict.
      *   *Scenario:* Jordan says, "Have you thought about how low volume disrupts deep work?" (Prompting, not testifying).
      *   *Result:* Alex thinks, weighs the value of music vs. work, and concludes "It's wrong."
      *   *Key Difference:* In the first case, the *authority* of the reason comes from Jordan's endorsement. In the second, the *authority* comes from Alex's recognition of the value.
      *   *Wait, Condition 2 says:* "the speaker supplies is only the moral verdict plus a compressed schema."
      *   *Okay, I need to keep the testimony structure similar.*
      *   *Revision:* In the Defective Case, Alex accepts the schema *on Jordan's say-so* regarding its normative force. In the Unproblematic Case, Alex accepts the schema but *validates the normative force themselves* immediately.
      *   *Actually, the cleanest distinction is often "Taking the speaker's word for the verdict" vs "Taking the speaker's word for the facts/reasons, then judging."*
      *   *But Condition 2 says Hearer has all descriptive facts.* So the speaker only adds the *moral verdict* and the *schema* (the connecting principle).
      *   *So the difference must be in how the Hearer relates to the Schema.*
      *   *Defective:* Alex thinks "Jordan says disruption implies wrongness. I trust Jordan. So disruption implies wrongness."
      *   *Unproblematic:* Alex thinks "Jordan says disruption implies wrongness. I see that disruption *does* imply wrongness. So disruption implies wrongness."
      *   *The "One Respect" Difference:* The *basis* of the acceptance of the normative principle. Is it trusted testimony or recognized insight?

  5.  **Addressing the Final Question (Epistemic vs. Non-Epistemic):**
      *   *Epistemic Reading:* Alex lacks knowledge because knowledge requires understanding/appreciation of the grounds (Hills).
      *   *Non-Epistemic Reading:* Alex has knowledge (true, justified belief) but violates a norm of *moral agency* or *autonomy* (Hopkins).
      *   *Divergence:*
          *   If Epistemic: Alex should have sought to *understand* before believing. Belief is premature.
          *   If Non-Epistemic: Alex can believe/know, but should not *act* on it (or act with full moral credit) without making it their own. Or, Alex should have engaged in deliberation even if the outcome was the same.
      *   *My stance for the paper:* The "Residue" is best understood as a norm of *Moral Agency* (Non-Epistemic), specifically regarding the *ownership of judgment*.

  6.  **Refining the Case to meet all constraints strictly:**
      *   *Constraint 4:* "Hearer can reproduce those reasons accurately."
      *   *Constraint 4:* "Belief survives speaker's retraction."
      *   *Constraint 1:* Low stakes.
      *   *Constraint 3:* No laziness.
      *   *The "Residue":* It's the difference between *believing P because the reasons support P* vs *believing P because the Speaker says the reasons support P*. Even if the believer can cite the reasons, if the *link* between reasons and verdict is held on testimony, it's defective.
      *   *Case:* The Office Lunch Order.
      *   *Details:* Ordering food for a meeting. Dietary restrictions vs. Cost vs. Preference.
      *   *Let's try the "Shared Flat Cleaning" again, it's more intuitive for moral weight.*
      *   *Scenario:* Cleaning the bathroom.
      *   *Facts:* It's Alex's turn. Alex is tired. Jordan says it's wrong to skip.
      *   *Schema:* "Fairness requires adhering to rosters even when inconvenient, unless emergency."
      *   *Defective Case:* Alex accepts the principle *because Jordan endorses it*.
      *   *Unproblematic Case:* Alex accepts the principle *because Alex sees its truth*, prompted by Jordan.
      *   *Wait, I need to ensure the "Residue" isn't just Understanding (Constraint 4 says they understand).*
      *   *The Philosophical Nuance:* The "Residue" is often called *Moral Autonomy* or *Non-Deferential Judgment*. Even if I understand *why* X is wrong, if I believe it is wrong *because you told me so*, I am not exercising moral agency.
      *   *How to show this in the case?* Alex must treat the *normative connection* as a fact transmitted by testimony, rather than a truth apprehended by reason.
      *   *Example:* Alex treats "Fairness requires..." like a law of physics reported by Jordan, rather than a demand of reason recognized by Alex.

  7.  **Finalizing the Case Construction:**
      *   *Case:* The Committee Vote (Workplace).
      *   *Issue:* Whether to approve a minor expense claim that is technically allowed but feels borderline.
      *   *Hearer:* Sam. *Speaker:* Taylor (Senior, trusted).
      *   *Facts:* Sam knows all the numbers, rules, and context.
      *   *Testimony:* Taylor says, "It's wrong to approve. It violates the spirit of reciprocity, even if it fits the letter."
      *   *Defective:* Sam believes it's wrong. Sam votes No. Sam explains "Spirit of reciprocity." If Taylor says "Actually, I changed my mind," Sam says "I still think it violates reciprocity."
      *   *Why Defective?* Sam treats "violates reciprocity -> wrong" as a piece of data Taylor provided. Sam hasn't *weighed* reciprocity against the rules themselves. Sam's confidence in the *normative force* of reciprocity is borrowed.
      *   *Contrast:* Taylor says the same thing. Sam thinks, "Yes, reciprocity *does* outweigh the letter here." Sam's confidence rests on the value of reciprocity, not Taylor's grip on it.
      *   *The "One Respect":* The *locus of normative authority*. In the defective case, the authority is Taylor's judgment. In the unproblematic case, the authority is the Reason itself.

  8.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the query. Validate the suspicion (the "Residue" is real).
      *   *The Case:* "The Committee Expense."
