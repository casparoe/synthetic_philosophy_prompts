      *   Standard Pessimist arguments (Hills, Hopkins, Callahan) often converge on *autonomy* or *moral agency*. The idea is that morality demands *first-personal engagement*. It's not just about getting the right answer; it's about *owning* the answer.
      *   The "residue" is often described as a lack of *moral appreciation* or *moral worth* of the action/belief, even if the belief is true and justified.
      *   Key concept: *Moral Deference vs. Moral Trust*. Or *Taking Ownership of the Verdict*.
      *   The specific defect might be that the hearer treats the moral verdict as a *conclusion* handed down, rather than a *judgment* arrived at through their own weighing of reasons, even if they can recite the reasons. They are treating the reasons as *evidence that the speaker believes P*, rather than *reasons for P itself*.
      *   Wait, condition 4 says "the hearer can reproduce those reasons accurately." The challenge is to make it so they reproduce them *as the speaker's reasons* or *as a schema provided*, rather than *as their own weighing*.
      *   Let's refine the "residue": It's about the *basis* of the belief. Even if they have the facts and the schema, do they believe it *because* the schema makes it right, or *because* the speaker said the schema makes it right?
