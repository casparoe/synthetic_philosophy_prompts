answer: |-
  Here is a 35-minute session plan designed to shift their understanding from *consequences* to *obligation*.

  ### The Central Example: "The Tuesday Call"
  Do not use the "Stranger on the Train." You are right to worry; it makes promising look like a solitary vow. For crisis volunteers, promising is a **relational transfer of authority**.

  Use this case instead:
  > *You promise a friend you will call them Tuesday evening to check in. They have a great support network and aren't relying on you (no harm if you don't). They can't force you to pick up the phone (no enforcement). You don't call.*

  **Why this carries the session:**
  1.  **Isolates the Obligation:** It removes "harm" (reliance) and "punishment" (enforcement), leaving only the broken promise.
  2.  **Relational:** It mirrors the volunteer-caller dynamic (trust-based) without the immediate life-or-death stakes that trigger panic.
  3.  **Scalable:** You can easily pivot from this to the "Debt" example and then to the Crisis Line.

  ---

  ### The Sequence (35 Minutes)

  **0:00–0:05 | The Hook: The Two Mistakes**
  *   State the two recent errors plainly: promising availability (shift) and promising absolute secrecy (confidentiality).
  *   **Frame:** "We aren't here to talk about policy violations. We are here to talk about what happened morally the moment you said the words 'I promise.'"

  **0:05–0:15 | The Mechanism: "The Tuesday Call"**
  *   Present the case (above). Ask: *"Did you wrong your friend?"*
  *   Most will say yes. Ask: *"Why? You didn't hurt them, and they can't sue you."*
  *   **The Point:** Guide them to see that a promise gives the other person a **right to complain**. It transfers a slice of your autonomy to them. They now own a piece of your future behavior.
  *   **Kill Misconception #1 ("Promises bind because people get hurt"):** If they argue "but no harm was done," stop them. "If harm was the only thing that mattered, it was just a prediction. A promise binds even when no one gets hurt."
  *   **Kill Misconception #2 ("If they can't hold you to it you're free"):** Remind them the friend can't force the call. "Enforceability isn't the source of the bond. The bond is the source of the enforceability."

  **0:15–0:25 | The Stress Test: "The Debt"**
  *   Introduce the second case: *You owe a colleague $50. You say, 'I promise to pay you back.'*
  *   Ask: *"Did the promise add anything? You already had to pay."*
  *   **The Point:** Yes. Before the promise, you owed the money. After the promise, you owe the money *and* you owe them the assurance. If you pay late, you haven't just delayed payment; you've broken a trust.
  *   **Application:** Map this to the Crisis Line. "You already have a duty to be ethical. When you promise confidentiality, you aren't just stating policy; you are personally staking your integrity on a limit you might not be able to control."

  **0:25–0:30 | The Crisis Line Application**
  *   Return to the two mistakes.
  *   **The Shift Promise:** "I promise I'll be here next week." You cannot give them a right to your future schedule. You are promising something you don't own.
  *   **The Secrecy Promise:** "Nothing will leave this room." You cannot give them a right to absolute secrecy because the organization/policy holds a veto (safety/mandatory reporting). You promised authority you didn't possess.
  *   **Kill Misconception #3 ("Keeping a promise means doing literally what you said"):** Clarify that promising implies *ceteris paribus* (all else being equal). If a safety risk emerges, the obligation shifts, but you still owe them an explanation because you gave them a right to expect consistency.

  **0:30–0:35 | Assessment & Close**
  *   Pose the final question (see below).
  *   Debrief answers briefly.
  *   Close with: "Don't promise outcomes. Promise presence. Don't promise what you don't own."

  ---

  ### What They Will Get Wrong (And When to Kill It)

  1.  **"Promises are just strong predictions."**
      *   *When:* During "The Tuesday Call."
      *   *The Kill:* "If I predict rain, and it's sunny, I'm mistaken. If I promise to come, and I don't, I'm blameworthy. Prediction is about truth; promising is about authority."
  2.  **"It's only a promise if there are consequences."**
      *   *When:* During "The Tuesday Call."
      *   *The Kill:* "Consequences are what happen *after* you break it. The obligation is what exists *before* you break it."
  3.  **"I meant well, so the promise is okay."**
      *   *When:* During Application.
      *   *The Kill:* "Intent matters for your character. The promise matters for their rights. You can be a good person and still violate someone's right."

  ---

  ### The Final Question
  Do not ask "What is a promise?" (Too abstract). Do not ask "What should you do?" (Too policy-focused).

  Ask this:
  > **"When you say 'I promise' to a caller, what specific thing have you handed them that they didn't have five seconds ago?"**

  *   *Wrong answers:* "Hope," "Support," "Safety." (These are outcomes/feelings).
  *   *Right answer:* "The right to hold me accountable," or "A claim on my behavior."
  *   *Why:* This confirms they understand the *normative transfer*, not just the emotional vibe.

  ---

  ### What to Flatly Refuse to Get Into
  In 35 minutes, you cannot fight every battle. Cut these off immediately:

  1.  **Legal Contracts:** If they ask about suing or legal liability, shut it down. "We are talking about moral obligation, not contract law. The law is the floor; this training is about the ceiling."
  2.  **Mandatory Reporting Specifics:** Do not get bogged down in *when* you break confidentiality (e.g., "What if they're suicidal?"). That is policy training. This session is about *why* promising absolute secrecy is the error, regardless of the exception.
  3.  **Utilitarian Calculus:** If they argue "But promising made them feel better in the moment," stop. "We are not weighing good outcomes against bad rules. We are discussing whether you had the authority to make the rule in the first place."

  ### Facilitator Note
  Your instinct to focus on the *source* of the obligation is correct. Volunteers often think, "I broke the promise, but nobody got hurt, so it's fine." This plan forces them to see that the *breaking* is the harm because it violates the authority transfer, regardless of the outcome. Keep the "Tuesday Call" simple. If they get stuck on the details of the call, remind them: "The content doesn't matter. The structure matters."
