answer: |-
  ### 1. Mapping

  In your friend's analogy, the political system is engineered to function like a heating system. The **Setpoint** is the pre-registered welfare index (the specific value society aims to maximize). The **Room** is the society itself over the five-year horizon. The **Sensor** is ostensibly the future measurement of that index, but functionally, the **Market Prices** act as the proxy sensor, estimating the future state. The **Error Signal** is the price spread between policy contracts (e.g., Policy A vs. Policy B). The **Actuator** is the implementation of the winning policy by the legislature. The **Lag** is the five-year gap between trade and settlement. Finally, the **Dial Turner** is the trader, who moves prices based on expectations.

  | Thermostat Component | Futarchy Equivalent (Your Setup) |
  | :--- | :--- |
  | **Setpoint** | Pre-registered Welfare Index |
  | **Sensor** | Market Price (estimating future index) |
  | **Error Signal** | Price Spread (A vs. B) |
  | **Actuator** | Policy Implementation |
  | **Room** | Society (5-year horizon) |
  | **Lag** | 5 Years (Trade to Settlement) |
  | **Dial Turner** | Traders (motivated by cause points) |

  ### 2. What carries over

  The analogy holds water on the separation of *ends* and *means*. Just as a homeowner sets 21°C without knowing boiler mechanics, voters define the welfare metric without designing policy details. It also correctly identifies the market as an information aggregator; like a thermostat's internal logic, the market processes dispersed information to minimize the "error" (the gap between status quo and improved welfare). Finally, it captures the automated decision rule: if the spread exceeds the threshold, the "boiler" kicks on (policy adopts); if not, the system stays idle (status quo). In these structural respects, the mechanism is indeed instrumental rather than expressive.

  ### 3. Where it breaks

  The analogy fractures on **lag**, **incentives**, and **measurement integrity**.

  First, **lag**. A thermostat reacts in seconds; your setup settles in five years. This isn't control; it's prophecy. Traders aren't adjusting a current state; they are guessing complex causal chains amidst external noise (wars, pandemics). Your friend cannot shrug this off: high variance in the "sensor" reading makes the "controller" noisy. If the market guesses wrong due to uncertainty rather than bias, the mechanism fails instrumentally.

  Second, **incentives**. Thermostat controllers have no agenda. Your traders are paid in "points for causes." This decouples profit from truth. A trader might boost a policy not because it raises the index, but because its adoption funds their preferred cause via the settlement mechanism. This introduces political motive into the "neutral" controller. Your friend must admit this breaks the "purely instrumental" claim.

  Third, **measurement**. Temperature is physical and hard to game. A welfare index is abstract. If the index is Goodhartable (e.g., GDP rises while wellbeing falls), the "sensor" is broken. While your friend says "blame the metric," the market might actively select policies that game the metric most efficiently, rather than those that actually help the "room."

  Fourth, **actuator limits**. A boiler works when told. A legislature shortlisted policies may fail implementation or be undermined by bureaucracy. The thermostat assumes the actuator obeys; your setup acknowledges political friction via the shortlist, admitting the market isn't fully in charge.

  ### 4. What it smuggles in

  The thermostat analogy quietly lends futarchy a reputation for **physical inevitability**. Thermostats *always* reach the setpoint unless broken. This smuggles in an assumption of **tight feedback**, whereas your five-year lag creates a loose, noisy loop. It implies **automaticity**, suggesting the policy *will* happen if prices move, ignoring the legislative shortlist constraint which retains human veto power.

  Crucially, it smuggles **neutral measurement**. We trust thermometers because physics is non-partisan. By calling the welfare index a "setpoint," the analogy implies it is equally objective. It isn't. It also suggests the **controller has no interests**. As noted, your "points for causes" incentive gives traders agency and preference, unlike a boiler's circuit board. The analogy hides the fact that your mechanism is populated by political actors, not physical components. It makes the system look like engineering when it remains sociology.

  ### 5. Verdict

  The conclusion that "you should blame the metric and not the market" does not survive the audit. That claim relies on the market being a noiseless, neutral transmitter of information. Your specific setup introduces significant noise (five-year lag) and bias (cause-based settlement incentives).

  If the market selects a policy that games the index rather than improving welfare, that is a failure of the *market's incentive structure*, not just the metric. If the market fails to predict external shocks due to the long lag, that is a failure of the *mechanism's capacity*, not the target. The thermostat analogy works only if the controller is perfect and the sensor is instant. Since your setup lacks both, the mechanism itself bears responsibility for bad outcomes. You can no longer treat the market as a black box that simply "delivers." It is an active participant with its own distortions. Your friend is using the analogy to immunize the market from criticism it deserves. The politics haven't been eliminated; they've just been moved from the voting booth to the trading floor.

  ### 6. Better analogy

  **Commissioning a Building.** You specify the requirements (metric). Architects submit plans (shortlist). Contractors bid on cost and timeline (market). But payment depends on the building's condition in five years (lag), and contractors are paid in credits to donate to charities (incentives).

  This frame makes visible the **construction risk** (policy might fail), the **measurement delay** (defects appear later), and the **contractor motives** (they might cut corners to fund their charity). It highlights that this is a human contract prone to dispute, not a physical law like heating.
