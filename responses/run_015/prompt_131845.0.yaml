      *Self-Correction on Thesis 1 (Entitlement):* The prompt notes GLF involved output collapse. Sen's original work on Bengal emphasized *no* output decline. GLF had *both* output decline and entitlement failure. So Thesis 1 is weak for GLF unification. I need to make sure this is highlighted.
