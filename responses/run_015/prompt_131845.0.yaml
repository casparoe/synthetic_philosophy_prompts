      *   *(b) Mirror Pair (Region A vs B):*
          *   A: Harvest loss, no starvation.
          *   B: No harvest loss, starvation (price shock).
          *   Thesis 1: B is famine, A is not.
          *   Thesis 2: A is not famine (shows shortage insufficient).
          *   Thesis 6: B is political, A is natural (but A didn't become famine).
          *   *Tension:* Does A count as a "natural disaster averted by politics"?
      *   *(c) Shadow Famine (Disease/Destitution):*
          *   Mechanism: Disease > Starvation.
          *   Thesis 1: Still entitlement failure.
          *   Thesis 3: Still failure of protection.
          *   *Implication:* Strengthens the "social" argument (disease spread is social), but complicates "food security" framing.

