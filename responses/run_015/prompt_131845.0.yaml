      *   *Thesis 3 (Definitional):* "Famine" implies failure of protection. Semantic/Stipulative. Risks begging the question. Unifies by definition, but might exclude pre-modern cases.
      *   *Thesis 4 (Avoidability):* Deaths were preventable. Risks vacuity (as noted). Substantive only if "available" is constrained. Hard to verify counterfactually for GLF.
      *   *Thesis 5 (Attributability):* Moral responsibility. Substantive/Moral. Unifies morally, but doesn't unify *mechanism*.
      *   *Thesis 6 (Explanatory-Priority):* Politics > Nature. Substantive/Causal. Strong unifier, but needs nuance on GLF (nature played a role, but politics amplified).
      *   *Thesis 7 (Institutional-Immunity):* Democracy/Press prevents famine (Sen's correlation). Substantive/Political. Fits Bengal/Ireland (colonial/absent democracy). GLF (authoritarian) fits the *failure* side, but the thesis is usually about *prevention*.
