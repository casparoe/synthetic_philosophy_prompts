prompt: |-
  I've been reading LessWrong and the forums that grew out of it for about fifteen years, so I've watched the part of that world concerned with doing good efficiently go through several self-corrections. There is a pattern I keep seeing in it that I can describe in three pieces but cannot name, and I am not confident the three pieces are the same thing.

  One. A grantmaker compares two programs: a bednet-style distribution with clean randomised evidence and a dollars-per-life-saved figure, and a multi-year effort to change how a national research-funding agency sets its priorities. The second has no usable control group, diffuse and delayed effects, and no unit cost. It loses. It loses again five years later, and this time the reason recorded is that its evidence base is thin. But the thinness is not independent of the earlier decisions: nobody paid for the measurement infrastructure, and the people who would know how to judge that kind of work went elsewhere, so the file gets thinner as a consequence of never having been funded. Measurability here looks like a property of the intervention, but it is partly a product of the funding history.

  Two. The same shape appears in career choice. Someone picks a career by expected lifetime donation. That expectation is computable for software and finance and essentially incalculable for "go build the infrastructure for evaluating the diffuse thing." So the pipeline fills the legible careers, and the advice ("earn to give") treats the existence of an evidence base as a fixed background condition when it is in part a function of who took which job. The evaluators are selected the same way, and are themselves ranked by the same style of cost-effectiveness reasoning, so the people whose job is to notice the exclusion are under the same pressure.

  Three. The corrections I've seen proposed do not seem to escape it. Apply a multiplier to options with weak evidence; ring-fence a fraction of the budget for unmeasurable work; fund hits-based. But to size the correction you need a number for how much you are missing, and producing that number requires exactly the kind of evidence you do not have. Any estimate of the bias is generated by the biased process. And no one inside the system is rewarded for saying "I cannot produce a number for this." The filter appears to operate again on the attempted repair of the filter.

  I don't think this is just Goodhart's law: nothing is being gamed, and the problem is not that a measure degrades once it becomes a target but that a whole class of options never enters the comparison. It isn't quite Campbell's law, which seems to be about deliberate distortion under pressure. The streetlight effect gets closer, except that in the streetlight case the key is wherever it is and only the light is misplaced, whereas here the light is being constructed as we go, so where it is now depends on where we looked before. It is more than path dependence or a Matthew effect, since what compounds is not advantage but apparent certainty. It has a family resemblance to Scott-style legibility, except that no simplifier is imposing a grid; it falls out of many individually sensible choices. And I can't tell whether some of it is just exploitation crowding out exploration, which might be fine.

  So: is there an established concept for this configuration, or for the three pieces separately? Is "measurability bias," which gets thrown around loosely in these discussions, a term of art with a definition, or just a gesture? Does the recursive part — the correction being subject to what it corrects for — have its own literature? If nothing established fits, coin a term and define it, and give me boundary cases: when is this same structure benign, and when is it the thing I think I'm seeing?

  Please don't give me a bibliography or citations; I want the carving — what the phenomenon is, what it isn't, where its edges are — and I'll consider the naming question closed if there is nothing established. Finally, say what would change your mind: which consideration would convince you that I have conflated three unrelated things, or that the whole pattern dissolves into ordinary value-of-information reasoning, and where in your analysis you think the reasoning is most likely to break.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a long-time reader of LessWrong and associated forums (EA, rationalist community). They have observed a specific recurring pattern in how "doing good efficiently" (Effective Altruism) evolves and self-corrects.
      *   **The Pattern (Three Pieces):**
          1.  *Funding/Intervention Selection:* Measurable interventions get funded; unmeasurable ones don't. This lack of funding prevents measurement infrastructure from being built, making future interventions look even less measurable. Measurability is endogenous, not exogenous.
          2.  *Career Choice:* People choose careers based on calculable impact (earn-to-give). This drains talent from building evaluation infrastructure for hard-to-measure things. Evaluators themselves are selected/ranked by the same metrics, reinforcing the blind spot.
          3.  *Failed Corrections:* Attempts to fix this (multipliers, ring-fencing) require estimating the bias, but that estimation is subject to the same bias. Admitting ignorance is penalized. The filter applies to the repair of the filter.
      *   **The Question:** Is there an established concept for this? Is "measurability bias" a real term? Does the recursive part have literature? If not, coin a term, define it, give boundary cases (benign vs. malignant), and explain what would change my mind (convince me I'm conflating things or it's just VOI).
      *   **Constraints:** No bibliography/citations. Focus on "the carving" (conceptual boundaries). Be precise.

  2.  **Deconstruct the Phenomenon:**
      *   *Core Mechanism:* Selection pressure based on legibility/measurability creates a feedback loop that reduces the legibility of the non-selected category over time.
      *   *Key Feature:* Endogeneity of the metric. The metric (measurability) isn't a fixed property of the world; it's a function of past investment in measurement.
      *   *Recursive Element:* Attempts to correct the bias are evaluated using the biased metric, preventing effective correction.
      *   *Distinction from known concepts:*
          *   *Goodhart's Law:* No, because the metric isn't being gamed; the *space of options* is being pruned.
          *   *Streetlight Effect:* Close, but the streetlight effect implies the light is static. Here, the light moves *away* from the dark places because no one builds lights there.
          *   *Path Dependence:* Yes, but specific to *epistemic* access.
          *   *Legibility (Scott Alexander):* Yes, but this is emergent from individual rational choices, not top-down imposition.
          *   *Exploitation vs. Exploration:* Related, but this is more about the *capacity to explore* decaying.

  3.  **Search for Existing Concepts (Mental Check):**
      *   *Measurability Bias:* Often used loosely in EA circles, but rarely defined rigorously as a *dynamic system* property. Usually treated as a cognitive bias (preferring what can be measured) rather than a systemic feedback loop.
      *   *Procrustes Bed:* Forcing reality to fit the measure. Not quite.
      *   *McNamara Fallacy:* Ignoring what can't be measured. This is the closest static equivalent.
      *   *Reflexivity (Soros):* Market prices affect fundamentals. Similar structure (feedback loop between perception and reality).
      *   *Performative Forecasting:* The act of predicting changes the outcome.
      *   *Epistemic Neglect / Epistemic Tragedy:* Sounds right, but is it established?
      *   *The "Observer Effect" on Policy:* Not quite.

      *Decision:* There isn't a single established term that captures the *recursive, endogenous, systemic* nature of this specific three-part pattern within the EA/LW context. "Measurability Bias" is too weak. "McNamara Fallacy" is too static. I need to coin/refine a term that captures the *self-reinforcing erosion of the unmeasurable*.

  4.  **Develop the Concept:**
      *   *Name:* **Endogenous Legibility Trap** or **Epistemic Drain**. Let's go with **The Legibility Feedback Loop** or **Metric-Induced Epistemic Decay**. Actually, the user asked to coin a term if nothing fits. Let's try **The Legibility Ratchet**. No, that implies one way only. How about **Endogenous Measurement Bias**?
      *   *Better Idea:* **The Epistemic Hollowing-Out**. Or **The Legibility Sink**.
      *   *Best Fit:* **The Metricization Trap** is common. But the specific recursive element needs highlighting. Let's call it **Reflexive Legibility Bias**.
      *   *Wait, looking closer at the prompt:* The user describes a situation where the *ability to measure* is destroyed by the *preference for measurement*.
      *   *Proposed Term:* **Endogenous Opacity**. Or **The Legibility Drain**.
      *   *Let's settle on:* **The Legibility Sink**. (A sink where resources go in, but the capacity to see out diminishes).
      *   *Actually, a more precise philosophical term might be **Performative Blindness**.*
      *   *Let's stick to the core mechanic:* The metric determines the territory's visibility. **Metric-Dependent Epistemology**.
      *   *Okay, I will propose: **The Endogenous Legibility Trap**.* It captures the "inside the system" nature and the "stuck" nature.

      *Wait, I need to check if "Measurability Bias" is a term of art.* In psychology/behavioral econ, it's a cognitive bias. In EA, it's a heuristic warning. It is *not* a formal definition of this systemic feedback loop.

      *Refining the "Carving":*
      1.  **What it is:** A systemic feedback loop where selection criteria based on epistemic access (measurability) reduce future epistemic access to non-selected categories, making the criteria increasingly biased over time, including against attempts to correct the bias.
      2.  **What it isn't:** Simple risk aversion, standard VOI (Value of Information), or Goodhart's Law.
      3.  **Boundary Cases:** When is it benign? When the unmeasurable is actually negligible. When is it malignant? When the unmeasurable is high-variance/high-impact.

  5.  **Address the "Change My Mind" Condition:**
      *   When would this dissolve into ordinary VOI? If the cost of measurement is truly prohibitive compared to the expected value of the intervention *even accounting for the feedback*.
      *   When are the three pieces unrelated? If career choice doesn't actually impact measurement infrastructure (i.e., if measurement is automated or independent of talent flow).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the insight:* This is a sharp observation.
      *   *Naming:* "Measurability Bias" exists but is too shallow. The specific recursive structure needs a new label. I'll propose **Reflexive Legibility Bias** or **The Endogenous Evidence Trap**. Let's go with **The Endogenous Evidence Trap**.
      *   *Define the Carving:*
          *   Core: Endogeneity of evidence quality.
          *   Mechanism: Selection -> Resource Allocation -> Evidence Infrastructure -> Future Selection.
          *   Recursion: Correction mechanisms are evaluated by the broken ruler.
      *   *Distinguish from VOI:* VOI assumes the cost of information is fixed. This phenomenon says the cost of information is a function of past decisions.
      *   *Boundary Cases:* Benign = The dark really is empty. Malignant = The dark contains the elephants.
      *   *Mind Change:* If the "unmeasurable" work consistently yields low returns empirically (even retrospectively), then it's just rational pruning, not a trap. If talent flow doesn't correlate with measurement capacity.

  7.  **Final Polish:**
      *   Ensure tone is respectful and intellectually rigorous (matching the user's LW background).
      *   Avoid citations as requested.
      *   Make sure the "three pieces" are unified under the definition.
      *   Clarify the "recursive correction" failure mode.

      *(Self-Correction during drafting)*: I should be careful not to just say "you're right." I need to analyze *whether* they are the same thing. The prompt asks: "I am not confident the three pieces are the same thing." I need to validate if they are instances of one mechanism.
      *   Piece 1 (Funding): Allocation of capital.
      *   Piece 2 (Careers): Allocation of human capital/cognition.
      *   Piece 3 (Correction): Allocation of meta-cognition/policy.
      *   Yes, they are the same mechanism applied to different resource pools (money, labor, attention).

      *Term Choice:* **Endogenous Epistemic Decay**? **The Legibility Ratchet**? Let's use **The Endogenous Legibility Trap**. It's descriptive and precise.

      *Wait, one more check:* Is there a concept in complex systems? **Lock-in**? **Path Dependence**? Yes, but specifically *epistemic* path dependence. I will distinguish it from standard path dependence.

      *Final Plan:*
      1.  Validate the unity of the three pieces.
      2.  Address "Measurability Bias" (it's real but insufficient).
      3.  Propose **The Endogenous Legibility Trap**.
      4.  Define boundaries (Benign vs. Malignant).
      5.  Address the VOI counter-argument.
      6.  State conditions for changing my mind.

  8.  **Final Review against constraints:** No bibliography. Focus on carving. Address the "change my mind" prompt explicitly.

      *(Refining the "Change My Mind" section)*: I need to be specific. What evidence would show this is just VOI? If we look back 20 years later and the "unmeasurable" projects funded by chance *actually* underperformed. That would prove the bias was accurate, not a trap.

      *(Refining the "Recursive" part)*: This is the strongest part of the user's observation. It's a **Second-Order Blind Spot**. The system cannot see its own blindness because the tool for seeing is broken.

      Okay, ready to write.
answer: |-
  You have identified a single coherent mechanism operating across three different resource pools (capital, labor, and meta-cognition). The three pieces are the same thing. They are not merely analogous; they are instances of a specific systemic failure mode regarding how epistemic access is produced and maintained.

  Here is the carving you requested.

  ### 1. The Naming and Definition
  "Measurability bias" is a real phrase, but it is not a term of art with a rigorous definition. In psychology and behavioral economics, it refers to a cognitive heuristic (preferring quantifiable data). In Effective Altruism circles, it is used as a warning label. Neither usage captures the *dynamic, recursive, endogenous* nature of the pattern you described. The standard definition treats measurability as an intrinsic property of an intervention; your observation correctly identifies it as a *produced* property.

  I propose the term: **The Endogenous Legibility Trap**.

  **Definition:** A systemic feedback loop where selection criteria based on epistemic access (legibility/measurability) direct resources away from the infrastructure required to produce that access in neglected domains. Over time, this increases the cost of knowledge production in those domains, making them appear increasingly inferior by the selection criteria, thereby reinforcing the resource diversion. The trap closes when attempts to correct the bias are evaluated using the degraded epistemic infrastructure, rendering the correction invisible or unjustifiable.

  ### 2. The Carving: What It Is and Isn't

  **What it is:**
  *   **Endogenous:** The "noise" or "uncertainty" in the system is not fixed; it is a function of past investment.
  *   **Selection-Driven:** It requires a competitive allocation process (grants, hiring, policy adoption) where options are compared.
  *   **Recursive:** The mechanism that detects the error is subject to the error.

  **What it isn't:**
  *   **Goodhart's Law:** Goodhart's requires the metric to be *gamed* or *optimized for* at the expense of the goal. In the Legibility Trap, the metric is obeyed faithfully. The goal is actually lost because the map stops updating, not because the territory is being distorted to fit the map.
  *   **Standard Value of Information (VOI):** VOI reasoning assumes the cost of information is a static parameter of the world. In the Trap, the cost of information is a variable dependent on prior funding decisions. A VOI calculation that treats measurement cost as fixed will systematically underestimate the value of funding measurement infrastructure.
  *   **Simple Path Dependence:** Path dependence implies history matters. The Legibility Trap implies history *determines visibility*. It is not just that we are stuck on a path; it is that the lights on the path are powered by the path itself, and the off-path areas are actively darkening.
  *   **Exploration vs. Exploitation:** In standard bandit problems, exploration is costly but the reward distribution is fixed. In the Legibility Trap, the reward distribution of the "explore" arm degrades over time if not pulled, because the "reward" (impact) is partly constituted by the ability to verify it.

  ### 3. Boundary Cases: Benign vs. Malignant

  The structure exists on a spectrum. It is not always a "trap" in the negative sense; sometimes it is a "filter."

  **Benign Case (The Legibility Filter):**
  The unmeasurable domain is genuinely low-impact or high-noise regardless of investment.
  *   *Condition:* If you were to forcibly fund the "unmeasurable" infrastructure, the resulting data reveals that the interventions were indeed ineffective.
  *   *Example:* Astrology. It is hard to measure rigorously because the effects are diffuse. We do not fund measurement infrastructure for it. The "trap" does not form because the underlying signal is zero. The legibility matches the reality.

  **Malignant Case (The Legibility Sink):**
  The unmeasurable domain contains high-variance, high-impact opportunities (black swans) that require specific infrastructure to detect.
  *   *Condition:* Retrospective analysis (or accidental funding) shows that neglected areas contained massive opportunities that were invisible *at the time* specifically because the measurement capacity was allowed to atrophy.
  *   *Example:* Global catastrophic risk reduction prior to 2010. It was hard to measure "prevented extinction." Because it was hard to measure, talent and money flowed to bednets (easy to measure). This delayed the build-out of biorisk monitoring infrastructure, making biorisk look even *harder* to measure in 2015 than it did in 2005, further delaying funding.

  **The Edge:**
  The boundary lies in the **correlation between measurability and impact.**
  *   If Measurability $\approx$ Impact (high correlation), the system works efficiently.
  *   If Measurability $\perp$ Impact (uncorrelated), the system is inefficient but stable.
  *   If Measurability $\propto$ Past Investment in Measurement (the Trap), and Impact is independent of Measurability, the system diverges from optimal allocation over time.

  ### 4. The Recursive Correction Failure

  You asked if the recursive part has literature. It is a specific instance of **Second-Order Ignorance** (not knowing what you don't know) compounded by **Institutional Reflexivity**.

  The failure mode you describe in Piece Three is the defining characteristic of the Trap. A system can survive a blind spot if it has a "meta-sensor" that detects the blind spot. In the Endogenous Legibility Trap, the meta-sensor (the evaluation process for corrections) relies on the same sensory input as the primary sensor.
  *   *Standard Bias:* I can't see X.
  *   *Reflexive Bias:* I can't see X, and I can't see that I can't see X, because the tool I would use to detect my blindness requires data from X.

  This is why "fund hits-based giving" often fails to escape the trap. To size the "hits-based" portfolio, you need an estimate of the hidden value. That estimate is generated by the people and models selected by the legible criteria. They will systematically underestimate the hidden value, leading to a hits-based portfolio that is too small to matter, which is then cited as evidence that hits-based giving doesn't work.

  ### 5. What Would Change My Mind

  I currently agree with your assessment that these three pieces form a unified, malignant structure. Here is what would convince me otherwise:

  **1. Decoupling of Talent and Infrastructure (Against Piece Two)**
  If it could be shown that the "measurement infrastructure" for diffuse problems does not actually depend on human capital allocation in the way you describe. For example, if measurement is primarily a function of technological automation (sensors, data scraping) that proceeds on a Moore's Law trajectory regardless of whether smart people go into finance or evaluation.
  *   *Falsification:* If we see domains where talent fled but measurement quality *improved* due to tech, the career piece is not part of the same trap.

  **2. The "Dark is Empty" Hypothesis (Against the Malignancy)**
  If a retrospective audit of the "unmeasurable" interventions rejected 15 years ago shows that, even with perfect hindsight, their cost-effectiveness was indeed lower than the bednets.
  *   *Falsification:* This would prove the bias was accurate, not a trap. It would mean measurability *was* a valid proxy for impact, and the "thinning file" was just correctly identifying a barren field. The trap only exists if the field was fertile but appeared barren due to lack of tools.

  **3. VOI Convergence (Against Piece Three)**
  If the "correction" mechanisms (multipliers, ring-fencing) actually *do* work despite the recursion. This would happen if the bias is self-limiting. For example, if the legible interventions saturate (diminishing returns), the marginal value of the unmeasurable rises high enough to punch through the epistemic fog even with bad tools.
  *   *Falsification:* If we observe that as legible causes saturate, capital *still* does not flow to unmeasurable causes (it flows to consumption or other legible areas), the recursion is holding the trap shut.

  **Where the Reasoning is Most Likely to Break:**
  The weakest link in your analysis is **Piece Three**. It assumes the correction mechanisms are *fully* captured by the bias. However, human institutions often have "escape hatches" that are not algorithmic. A grantmaker might have a crisis of faith, or a donor might act on intuition outside the model. If these non-algorithmic injections of capital are sufficient to maintain the measurement infrastructure in neglected areas, the trap is leaky, not closed. The Trap requires the system to be sufficiently closed that no external epistemic input can update the priors. If the system allows for "philanthropic intuition" or "donor whim" that bypasses the cost-effectiveness analysis, the recursion is broken.

  ### Summary
  You are describing **The Endogenous Legibility Trap**. It is not merely Goodhart's Law or the Streetlight Effect; it is a dynamic erosion of the capacity to see the dark. The three pieces are unified by the mechanism of **resource-dependent epistemology**. The pattern is malignant when legibility diverges from truth, and benign when they correlate. The recursion holds unless there are non-algorithmic channels for resource allocation that bypass the measurement criteria.
