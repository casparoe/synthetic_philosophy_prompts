answer: |-
  ### Taxonomy of Moral Positions on the 1945 Atomic Bombings

  **Instructions for Use:** Begin at Node 1. Answer the question based on your moral intuition regarding the specific case of Hiroshima and Nagasaki. Follow the branch corresponding to your answer until you reach a terminal leaf.

  ---

  #### **Node 1: The Status of the Civilian Population**
  **Claim:** *Civilians working in industries supporting the war effort (e.g., munitions factories, logistics) retain full moral immunity from direct attack, identical to that of children or the elderly.*
  *   **Affirm (Yes, they are immune):** Proceed to **Node 2**.
  *   **Deny (No, they are liable):** Proceed to **Node 4**.

  ---

  #### **Node 2: The Relevance of Intention**
  **Claim:** *It is morally permissible to cause the deaths of these immune civilians if their death is a foreseen but unintended side-effect of destroying a military target, provided the military target is legitimate.*
  *   **Affirm (Yes, intention distinguishes the act):** Proceed to **Node 3**.
  *   **Deny (No, foreseen death is morally equivalent to intended death):** Proceed to **Leaf A**.

  ---

  #### **Node 3: The Constraint on Side-Effects**
  **Claim:** *The permissibility of these foreseen deaths depends primarily on whether the total number of lives saved (e.g., by avoiding invasion) exceeds the number of civilians killed, regardless of the ratio of harm to military advantage.*
  *   **Affirm (Yes, net lives saved is the primary metric):** Proceed to **Leaf B**.
  *   **Deny (No, the harm to civilians must be proportionate to the specific military advantage gained, not just the net global outcome):** Proceed to **Leaf C**.

  ---

  #### **Node 4: The Basis of Liability**
  *(Note: This branch introduces the distinction between individual moral status and structural complicity.)*
  **Claim:** *The loss of moral immunity for these individuals is derived from their individual capacity to inflict harm (e.g., bearing arms, commanding troops), rather than their structural integration into the war economy.*
  *   **Affirm (Yes, liability requires individual capacity to harm):** Proceed to **Leaf D**.
  *   **Deny (No, structural participation in the war economy is sufficient for liability):** Proceed to **Leaf E**.

  ---

  #### **Node 5: The Emergency Override**
  *(Return to this node if you affirmed immunity at Node 1 but believe the specific historical threat of 1945 alters the rules.)*
  **Claim:** *Even if civilians are immune and killing them is intended, the existential threat of a prolonged invasion or totalitarian victory licenses the violation of standard prohibitions.*
  *   **Affirm (Yes, emergency overrides prohibition):** Proceed to **Leaf F**.
  *   **Deny (No, prohibitions hold even in catastrophe):** Return to **Leaf A** or **Leaf C** depending on your stance on intention.

  ---

  ### **Terminal Leaves**

  **Leaf A: Absolute Prohibition (Anscombean Deontology)**
  *   **Definition:** The intentional or foreseen killing of innocents is strictly forbidden, regardless of the consequences. The bombings were morally equivalent to murder.
  *   **Status:** Occupied.

  **Leaf B: Act Consequentialism**
  *   **Definition:** The bombings are justified solely because the aggregate outcome (total deaths prevented) was superior to the alternative (invasion). Intention and status are secondary to the calculus of lives.
  *   **Status:** Occupied.
  *   **Separability Flag:** This leaf is not genuinely separable from **Leaf F** in practical application, as both rely on catastrophic outcome avoidance to justify civilian death, though they differ on whether the rule is *suspended* (F) or *outweighed* (B).

  **Leaf C: Doctrine of Double Effect (Standard Just War)**
  *   **Definition:** Civilian death is permissible only as an unintended side-effect, and the harm must be proportionate to the direct military advantage gained, not merely the net global utility.
  *   **Status:** Occupied.

  **Leaf D: Traditional Combatant Liability**
  *   **Definition:** Only uniformed combatants are liable. Since the bombings targeted cities, they were immoral unless justified by Leaf B or F. This position rejects the "military-industrial center" justification for area bombing.
  *   **Status:** Occupied (by strict interpreters of the Geneva conventions).

  **Leaf E: Total War Liability (Structural Complicity)**
  *   **Definition:** Civilians lose immunity based on their economic function within the war machine, rendering them legitimate targets regardless of individual intent.
  *   **Status:** **Occupied but Unstable.** This distinction opens a logical space often occupied by historical apologists for area bombing, but it is rarely defended as a standalone moral principle because it collapses into **Leaf B** (Consequentialism) to avoid the implication that conscripted laborers are morally equivalent to generals.

  **Leaf F: Supreme Emergency Exception**
  *   **Definition:** Standard prohibitions against targeting innocents are temporarily suspended due to the uniqueness and gravity of the threat (e.g., defeat of liberal democracy), licensing intentional harm that would otherwise be forbidden.
  *   **Status:** Occupied.
  *   **Separability Flag:** See **Leaf B**. Distinction rests on whether the moral rule is *broken* (F) or *balanced* (B).

  **Leaf G: Unnamed (Punitive Collective Liability)**
  *   **Description:** This position holds that structural complicity (Node 4, Deny) makes civilians liable to *intentional* targeting (Node 2, Deny) without requiring a consequentialist calculation of net lives saved (Node 3, Deny).
  *   **Commitment:** It commits the respondent to the view that civilians may be intentionally punished for their nation's war economy even if doing so does not minimize total deaths.
  *   **Status:** **Unoccupied Logical Space.** This position is logically coherent but morally untenable in modern discourse, as it advocates retributive killing without utilitarian justification.
