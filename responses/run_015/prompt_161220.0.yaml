answer: |-
  **Project Title:** The Logic of Causation in the Protestant Ethic Thesis: Disentangling Asymmetry, Contamination, and Transmission

  **Problem Statement**
  The longstanding debate regarding Weber's thesis on ascetic Protestantism and the spirit of modern capitalism is stalled. This is not due to a lack of historical data, but because the thesis is treated as a monolithic causal claim when it is actually three distinct logical claims wearing one coat: (1) an **Asymmetry Claim** (ideas move economics more than economics moves ideas in this setting); (2) an **Outcome Contamination Worry** (the effect is an ethos constituted by the attitudes whose origin is at issue, risking tautology); and (3) a **Transmission Claim** (the causal mechanism persists after the underlying belief weakens). Current arguments fail because interlocutors defend or attack different claims while assuming they are addressing the same proposition. This project proposes to disentangle these claims, determine which is load-bearing, and establish the conditions under which the thesis could be empirically adjudicated.

  **The Core Argument**
  I argue that the **Outcome Contamination** claim is the logical prerequisite for the other two. If the effect (the spirit of capitalism) is indistinguishable from the cause (religious attitude) except in name, then neither Asymmetry nor Transmission can be coherently stated. A causal relation requires distinct relata. If the "spirit" is merely the religious attitude secularized, the thesis collapses into the claim that attitudes produce similar attitudes, with economic behavior demoted to a symptom. To salvage the thesis as a causal explanation rather than a phenomenological description, it must be restatable with non-attitudinal outcomes (bookkeeping practices, reinvestment rates, firm longevity) without ceasing to be Weber's thesis. If it cannot be so restated, the thesis is not a causal hypothesis but a conceptual clarification of modern rationality. The standard positions leave this open: materialist reductionism dismisses the mechanism of meaning entirely, while hermeneutic primitivism treats meaning as a sufficient explanation without demanding adequate causation. Both bypass the interface where value-rational action becomes instrumentally rational conduct.

  **Methodology**
  The project combines conceptual reconstruction with historical micro-analysis. I commit to two methodological devices to ensure the causal mechanism is neither too abstract nor too narrative.

  1.  **The Resolution Test:** The mechanism must be stateable at the scale of a single household's or workshop's weekly decisions. A causal story about values that cannot be cashed out at this resolution—what this believer declines to spend, what records he keeps, how he treats an unexpected surplus—has not yet specified a mechanism. I will reconstruct decision trees from household accounts and congregational discipline records to identify where doctrinal constraints bind economic choices distinct from budget constraints.
  2.  **The Double Contrast:** To isolate doctrinal content from social position, I will employ a difference-in-differences shape. First, across communities matched on region, legal status, and occupational mix but differing in confession. Second, within a single confession, comparing stricter and laxer congregations or successive phases of the same congregation. This allows attribution to doctrinal content rather than network effects or self-selection.

  **Twelve-Month Plan**
  *   **Months 1–3 (Conceptual):** Reconstruct the logical structure of the thesis. Define "ethos" as a potential effect variable. Determine the necessary conditions for distinguishing religious attitude from economic habit.
  *   **Months 4–7 (Historical Reconstruction):** Apply the Resolution Test. Select two matched urban centers (e.g., Leipzig vs. Magdeburg, or specific wards within a city). Extract micro-data from probate records, business ledgers, and church discipline logs. Code for specific behaviors (reinvestment vs. consumption, hours worked, credit extended) correlated with confessional strictness.
  *   **Months 8–10 (Comparative Analysis):** Apply the Double Contrast. Analyze intra-confessional variation to control for regional economic shocks. Assess whether behavioral differences track doctrinal strictness or merely institutional capacity.
  *   **Months 11–12 (Synthesis):** Evaluate findings against the logical reconstruction. Draft the dissertation proposal chapters.

  **Possible Conclusions and Failure Conditions**
  There are three viable outcomes. First, the thesis holds: behavioral outcomes vary with doctrinal strictness independent of material conditions, and the mechanism is visible at the household resolution. Second, the thesis fails empirically: no such variation exists. Third, and most critical, the thesis fails logically: it turns out the behavioral outcomes cannot be distinguished from the religious attitudes without losing the specific "spirit" Weber identified.

  A negative empirical result is not a dissertation failure; it is a finding. A dissertation failure would occur if I cannot distinguish the three claims logically, or if I cannot define the "Resolution Test" operationalizable criteria. If it turns out the thesis cannot be restated with a behavioral outcome without ceasing to be Weber's thesis, I will argue this is a **clarification**, not a refutation. It would show the thesis is actually a claim about the genealogy of rationality, not a causal hypothesis about economic growth. This reclassification is a substantive theoretical contribution.

  **Scope Assessment**
  Is all three claims too much for one year? Yes. While Asymmetry and Transmission are crucial for the full historical narrative, they rely on the successful definition of the relata addressed by the Contamination claim. If the effect cannot be distinguished from the cause, asking which is stronger (Asymmetry) or how it lasts (Transmission) is premature. Therefore, if cuts are required during the research phase, I will prioritize **Contamination** and **Asymmetry**, treating **Transmission** as a secondary implication. Cutting Transmission loses the explanation of secularization—how the ethic survives the faith—but preserves the core causal mechanism. Without solving Contamination, Transmission is merely a story about institutional inertia. Without solving Asymmetry, the thesis loses its specific counter-factual force. But without solving Contamination, the thesis has no object. This project prioritizes defining the object.

  **Significance**
  This project does not ask whether Weber was right about history. It asks what kind of thing Weber claimed to have found. By forcing the thesis to meet the Resolution Test and the Double Contrast, I will demonstrate whether "culture as a cause" is a coherent category in historical sociology or a placeholder for unresolved conceptual problems. This clarifies the conditions under which any value-based explanation can claim adequate causation.
