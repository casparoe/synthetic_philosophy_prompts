      *   **Problem:** Managing ~500 individual clauses vetted by different working groups. Facing the "Preface Paradox" (believing each clause is true but believing the conjunction is false) + "Lottery Problem" (high probability per ticket/clause, but certainty some will fail).
      *   **Goal:** Create a decision procedure/framework for reviewers (20 mins/clause) to Accept, Reject, or Escalate.
      *   **Key Constraints:**
          *   Must distinguish between "accepting for practical reasoning" (adoption) vs. "believing it's true" (epistemic certainty).
          *   Must include a document-level "error budget" (accepting one clause affects risk for others).
          *   Must apply to three specific cases:
              1.  Routine typography/formatting.
              2.  Pedestrian-bridge structural-load (99.2% confidence, high stakes).
              3.  Climate-adaptation (industry push, high historical error rate).
