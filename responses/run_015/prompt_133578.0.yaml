answer: |-
  A clause receives operational clearance not when it is deemed true, but when its calculated risk cost fits within the remaining document-level error budget.

  ### The Reasoning
  This procedure decouples epistemic belief from regulatory adoption. Reviewers are not asked to swear a clause is "true"—acknowledging the Preface Paradox that some errors undoubtedly exist—but rather to certify that including the clause does not exceed the organization's tolerable risk exposure. By treating the standard as a fixed portfolio of risk, we solve the Lottery Problem: a 99% confidence clause may be rejected if its failure mode is catastrophic, while a 90% confidence clause may be accepted if its failure is trivial, provided the aggregate "Expected Harm Units" (EHU) of the document remain below the Board-defined cap.

  ### The 20-Minute Decision Procedure
  **Prerequisites:** Reviewer must have access to the current "Remaining Document Error Budget" (tracked by the Lead Editor).

  **Step 1: Assign Severity Class (2 Minutes)**
  Categorize the consequence of this clause being wrong.
  *   **Class C (Trivial):** Formatting, terminology, non-operative guidance. (Weight: 1)
  *   **Class B (Operational):** Economic loss, downtime, reversible environmental impact. (Weight: 50)
  *   **Class A (Critical):** Loss of life, irreversible environmental damage, systemic infrastructure failure. (Weight: 1000)
  *   *Stop Condition:* If the clause involves value judgments on equity, distribution of harm, or ethical trade-offs rather than technical facts, **Escalate** immediately. This procedure calculates risk, not values.

  **Step 2: Estimate Error Probability (5 Minutes)**
  Determine the probability ($P$) that the clause is technically incorrect or non-compliant.
  *   Use working group data, historical base-rates, or expert consensus.
  *   Do not use "confidence." Use $P = 1 - \text{Confidence}$.
  *   *Constraint:* If historical base-rates for this clause type exceed 10%, cap confidence at 90% ($P=0.1$) regardless of expert assertion.

  **Step 3: Calculate Risk Cost (3 Minutes)**
  $$ \text{Risk Cost} = \text{Severity Weight} \times P $$
  *   *Example:* Class A (1000) $\times$ 0.008 (99.2% confidence) = 8.0 EHU.

  **Step 4: Check Budget & Decide (5 Minutes)**
  Compare Risk Cost against the **Remaining Document Error Budget**.
  *   **Accept:** Risk Cost $\le$ Remaining Budget. Deduct cost from budget.
  *   **Reject:** Risk Cost $>$ Remaining Budget. Clause cannot be included without removing higher-risk clauses elsewhere.
  *   **Escalate:** Risk Cost is within budget, but the Severity Class is A, or the clause consumes $>50\%$ of the remaining budget alone.

  **Step 5: Record Epistemic Status (5 Minutes)**
  Mark the clause in the registry as "Adopted for Regulation" **NOT** "Verified True."
  *   Append a disclaimer tag: "Operational clearance granted under Budget Cycle [ID]; epistemic uncertainty remains."

  ---

  ### Worked Cases

  **1. Routine Typography Clause**
  *   **Context:** Defines font size for header tables.
  *   **Severity:** Class C (Weight 1).
  *   **Confidence:** 95% ($P = 0.05$).
  *   **Risk Cost:** $1 \times 0.05 = 0.05$ EHU.
  *   **Decision:** **Accept.**
  *   **Reasoning:** Negligible cost to the budget. Even if wrong, no harm occurs. This absorbs the "noise" of the lottery problem without threatening the document's integrity.

  **2. Climate-Adaptation Clause (Industry Push)**
  *   **Context:** Requires specific flood-resistance materials based on industry models.
  *   **Severity:** Class B (Weight 50) (Economic/Property loss).
  *   **Confidence:** Industry claims 90%, but historical base-rate for similar predictive clauses is 60% accuracy ($P = 0.4$).
  *   **Risk Cost:** $50 \times 0.4 = 20$ EHU.
  *   **Decision:** **Reject/Escalate.**
  *   **Reasoning:** The historical base-rate overrides expert confidence. The cost (20 EHU) is too high for a single operational clause. It forces the working group to return with better data or downgrade the requirement to a recommendation.

  **3. Pedestrian-Bridge Structural-Load Clause**
  *   **Context:** Sets maximum load capacity; expert confidence is 99.2%.
  *   **Severity:** Class A (Weight 1000) (Loss of Life).
  *   **Confidence:** 99.2% ($P = 0.008$).
  *   **Risk Cost:** $1000 \times 0.008 = 8.0$ EHU.
  *   **Decision:** **Reject (Delay for Further Testing).**
  *   **Reasoning:** This is the unwelcome result. The team sees 99.2% and wants to accept. However, the document-wide Error Budget is set at 5.0 EHU to ensure overall public safety across all 500 clauses. This single clause consumes 160% of the total allowable risk budget. Accepting it would require removing other safety clauses or admitting the standard is statistically unsafe. The high confidence is irrelevant against the severity multiplier; the clause must be hardened to 99.9% confidence ($P=0.001$, Cost=1.0 EHU) before it can be admitted.

  ---

  ### Hard Limits of This Procedure

  **1. The Global Error Cap is Political, Not Technical**
  This procedure cannot determine the total Error Budget (e.g., why 5.0 EHU and not 10.0?). That number represents the Board's risk appetite and liability tolerance. Reviewers cannot adjust the budget; they can only spend it. If the Board sets the budget too tight, no standards get published; too loose, and the standard becomes dangerous. That decision sits above this workflow.

  **2. No Mechanism for Reopening Accepted Clauses**
  This is a gatekeeping procedure, not a maintenance protocol. Once a clause is accepted and the budget deducted, this framework does not trigger a review if new evidence emerges later. If Clause 45 is proven wrong after publication, the budget is already "spent." A separate lifecycle management process is required to handle retroactive risk, otherwise the error budget for future versions becomes meaningless.

  **3. Political Pressure is Excluded from the Math**
  The procedure treats industry lobbying, government mandates, and public pressure as external noise. If a clause is mandated by law but exceeds the Error Budget, this procedure will flag it as **Reject**. It cannot weigh "legal requirement" against "safety budget." That conflict must be resolved by the Board before the clause enters this review stream, or the Board must explicitly override the budget cap, acknowledging they are violating the statistical safety model.
