          *   Must explicitly state limitations (who sets error cap, reopening clauses, political pressure).
          *   **Format:** Lead with the bottom line (single governing rule) in the first sentence. No preamble. No restating the question. Practical but philosophically honest.

  2.  **Deconstruct the Philosophical Core:**
      *   *Preface Paradox:* An author believes each claim in the book but admits in the preface that there's likely an error somewhere.
      *   *Lottery Problem:* Each ticket is likely a loser, but believing of any specific ticket "this will lose" seems problematic if you believe *some* will win.
      *   *Solution Strategy:* Shift from binary truth-values to risk-weighted utility within a constrained budget. Acceptance isn't "this is true," it's "this is safe to include given the remaining error budget."
      *   *Error Budget:* If the document allows $X$ expected errors, each clause consumes budget based on its risk profile (Probability of Error $\times$ Severity of Error).

  3.  **Drafting the Governing Rule:**
      *   Needs to replace a flat belief threshold (e.g., "95% confidence").
      *   Needs to incorporate the error budget.
      *   *Draft:* A clause is accepted only if its risk-weighted error cost fits within the remaining document-level error budget, regardless of individual confidence levels.
