      *   *Case 3: Climate Adaptation.* Industry push (bias), high historical error rate. Severity might be medium/high (economic/environmental). Probability of error is high. Likely Reject or Escalate.
      *   *Selection for Unwelcome Result:* The prompt asks for one to come out in a way the team won't like, "probably forcing rejection or an expensive delay despite the high confidence number." This points directly to the Bridge Load clause. 99.2% sounds great, but if stakes are life/death, the "error cost" is massive. If the budget is fixed, this clause might consume too much of it, forcing rejection until confidence is 99.99%.

  6.  **Addressing the Limitations:**
      *   Who sets the cap? (Board/Leadership, not reviewers).
      *   Reopening clauses? (Not covered by this procedure).
      *   Political pressure? (Explicitly excluded from the math, must be escalated).

  7.  **Refining the Output (Self-Correction/Review):**
      *   *Check:* Did I lead with the bottom line? Yes.
