  1. Start with the formal definition of a social welfare function and the three axioms because the theorem is unintelligible without them. State the theorem immediately after defining the axioms but before the proof, so they know the target before walking the path. This placement prevents them from viewing the axioms as arbitrary constraints rather than the precise conditions of the impossibility.
  2. Use model ranking aggregation where three algorithms rank three hyperparameter configurations, ensuring ordinal preferences without confidence scores. The example must show two profiles where individual rankings of pair A-B are identical but the aggregate ranking flips when C is introduced or moved. It must lack utility magnitudes to enforce the ordinal constraint that drives the impossibility.
  3. Head off the "democracy is impossible" myth when stating the theorem by emphasizing this is about ordinal rank aggregation, not political systems. Clarify "dictator" as a functional dependency immediately after defining the non-dictatorship axiom to prevent anthropomorphic confusion. Correct the IIA misunderstanding when defining axioms, and preempt the "use scores" or "add conditions" fixes during the domain definition and proof discussions.
  4. Instead of asking them to audit their own pipeline immediately, ask them to construct a minimal profile where a standard Borda count violates IIA. This verifies they grasp the mechanical failure of specific rules without forcing them to defend their own work prematurely. It shifts the mood from defensive auditing to active construction of counterexamples.
  5. Explicitly refuse to discuss cardinal utility or range voting as solutions, stating clearly that Arrow applies only to ordinal inputs. Decline to cover partial orders or overlapping item sets, noting that the theorem requires a fixed universal set of alternatives. Reiterate that this provides a diagnostic vocabulary rather than a prescription for which aggregator to deploy.
