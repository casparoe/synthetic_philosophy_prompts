  **Least Sensitive Term:** $P(L)$ (Epistemic License).
  *   **Why:** Most philosophers of decision theory already accept some form of risk-neutral EV maximization, provided the probabilities aren't arbitrarily assigned. The insect case is empirically anchored enough that moving this from 0.8 to 0.9 doesn't change the decision as much as moving the biology.

