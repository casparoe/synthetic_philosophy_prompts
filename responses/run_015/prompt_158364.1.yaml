  **Most Sensitive Term:** **$P(S)$ (Robust Sentience)**.
  *   **Why:** The metabolic floor is the steepest prior. If you convince me that global integration is possible at $10^4$ neurons (or that integration isn't required for valence), $P(S)$ jumps from 0.40 to 0.70.
  *   **Impact:** This alone raises the top-line number from **0.10 to 0.175**.
