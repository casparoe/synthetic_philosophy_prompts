answer: |-
  **Preamble: What This Procedure Is For**

  A moral trade is not cooperation. In cooperation, two parties pool resources to achieve a shared goal. In a trade, parties hold divergent goals and swap funding power to achieve more of their own goal by sacrificing some control. The slogan "both gain by their own lights" is necessary but insufficient. It ignores external harms, epistemic irresponsibility, and feasibility. A trade where both parties gain but one funds a harmful intervention is unacceptable. A trade based on a false empirical claim sells our credibility. A trade that cannot be enforced is merely a promise.

  The second slogan—"helping people do indirectly what they would not do themselves"—is also insufficient. It risks making us complicit in actions we deem wrong, or binding future actors who cannot consent. This procedure preserves the efficiency of trade while dropping the assumption that mutual benefit guarantees moral permissibility. It shifts value judgments to the Board and factual judgments to staff vetting. It is designed for analysts without philosophy training: follow the steps in order. If a step stops the process, the trade is rejected. If it hands off, the named authority decides.

  **The Decision Procedure**

  **1. Legality and Direct Harm Check**
  *   **Question:** Is either proposed intervention illegal, or credibly accused of causing direct, non-consensual harm to third parties (e.g., human rights abuses, ecological destruction)?
  *   **Evidence:** Independent vetting reports, legal counsel opinion, public records of the recipient charities.
  *   **From Whom:** Compliance Officer and External Vetting Partners.
  *   **Stop Condition:** **YES.** If either cause is illegal or causes direct harm, reject immediately. Moral trades cannot launder harmful acts.
  *   **Hand-off:** If staff believe the cause is morally objectionable but not legally/actionably harmful (e.g., religious proselytizing), hand to **Board** for integrity assessment.
  *   **Note on Individuals:** If a counterparty is an individual donor rather than an institution, require proof of funds source and enhanced harm screening, as individuals lack institutional oversight.

  **2. Disagreement Type Verification (Fact vs. Value)**
  *   **Question:** Is the disagreement between counterparties based on fundamental values (e.g., "arts matter more than health") or on contested empirical facts (e.g., "this intervention saves lives vs. it does not")?
  *   **Evidence:** Written statements from counterparties explaining *why* they prefer their cause; staff review of intervention effectiveness literature.
  *   **From Whom:** Counterparties and Senior Analyst.
  *   **Stop Condition:** **FACTUAL ERROR.** If staff consensus determines a core premise is empirically false (e.g., the intervention does not work), reject. We do not broker bets on settled science.
  *   **Hand-off:** If the empirical claim is contested within the expert community (reasonable disagreement), hand to **Board**. They must decide if brokering this risks our reputation for credibility.
  *   **Rationale:** Trades based on value differences are legitimate swaps. Trades based on false facts are scams or mistakes.

  **3. Capacity and Satiation Check**
  *   **Question:** Can each recipient organization effectively absorb the proposed amount without diminishing returns or violating thresholds?
  *   **Evidence:** Budget plans, historical spending rates, capacity assessments from the recipient charities.
  *   **From Whom:** Recipient Charities and Analyst.
  *   **Stop Condition:** **NO.** If the money exceeds the capacity to use it effectively (satiation) or hits a protected/incommensurable threshold (e.g., selling out the mission), reject or reduce the amount.
  *   **Ratio Rule:** Default to equal dollar amounts. Deviate only if evidence shows marginal utility differs significantly (e.g., $250k saves lives vs. $250k buys one piano).
  *   **Rationale:** Money that is wasted buys no moral gain, violating the "both gain" condition.

  **4. Enforceability and Commitment Security**
  *   **Question:** Is the commitment legally binding and secured against defection, especially if performance is deferred or involves trustee succession?
  *   **Evidence:** Draft legal agreements, escrow arrangements, endowment structures, legal opinion on binding successors.
  *   **From Whom:** Legal Counsel and Counterparties.
  *   **Stop Condition:** **NO.** If performance relies on trust alone, or if future trustees cannot be bound by current ones, reject.
  *   **Requirement:** For deferred trades (e.g., 30 years), funds must be locked in escrow or an endowment with restricted withdrawal clauses. Future beneficiaries are represented by the legal structure, not consent.
  *   **Rationale:** A trade that defaults is a loss for both sides. We do not broker promises we cannot enforce.

  **5. Brokerage Integrity and Conflict of Interest**
  *   **Question:** Does approving this trade create a conflict of interest (e.g., fees scale with size) or risk our reputation disproportionately?
  *   **Evidence:** Fee structure analysis, public perception risk assessment, size relative to portfolio.
  *   **From Whom:** Senior Management and Board.
  *   **Stop Condition:** **HIGH RISK.** If the fee structure incentivizes approving bad trades, cap fees or reject.
  *   **Hand-off:** Any trade exceeding 20% of annual brokerage volume or involving contested empirical claims (from Step 2) goes to **Board** for final sign-off.
  *   **Rationale:** We must remain neutral arbiters, not salespeople.

  ***

  **Application to Proposals**

  **Case 1: Global Health vs. Arts Education ($250k each)**
  *   **Procedure Run:**
      *   *Step 1 (Harm):* Pass. Nets and arts are benign.
      *   *Step 2 (Fact/Value):* Pass. Disagreement is value-based (cosmopolitan welfare vs. local cultural enrichment). No empirical dispute.
      *   *Step 3 (Capacity):* Pass, assuming charities confirm capacity.
      *   *Step 4 (Enforcement):* Pass. Simultaneous exchange via escrow.
      *   *Step 5 (Integrity):* Pass. Modest size.
  *   **Judgement Points:** The procedure demands evidence for Step 3. Equal dollar amounts are the default because we cannot compare "lives saved" to "arts enriched" objectively; we assume marginal utility of money is roughly comparable at this scale unless proven otherwise. If the arts org cannot absorb $250k without waste, the ratio must shift (e.g., $250k health vs. $50k arts) to preserve the "both gain" condition.
  *   **Verdict:** **Approve.**

  **Case 2: Animal Welfare vs. Long-Term Future ($1m now vs. $1m in 30 years)**
  *   **Procedure Run:**
      *   *Step 1 (Harm):* Pass.
      *   *Step 2 (Fact/Value):* Pass. Value trade (present animals vs. future beings).
      *   *Step 3 (Capacity):* Pass.
      *   *Step 4 (Enforcement):* **Critical Failure Point.** Current trustees cannot legally bind successors indefinitely if governing documents allow amendment.
      *   **Requirement:** To pass, the procedure demands funds be placed in a locked endowment or donor-advised fund with legally binding restriction clauses that survive trustee changes. If the legal opinion says successors can amend the mandate, the trade fails Step 4.
      *   *Step 5 (Integrity):* Hand-off to Board due to size and complexity.
  *   **Verdict:** **Conditional.** Only approve if legal counsel confirms the funds can be ring-fenced for 30 years regardless of trustee changes. Future beneficiaries are represented by the legal lock, not consent. If the lock is weak, reject.

  **Case 3: Large Trade on False Empirical Claim**
  *   **Procedure Run:**
      *   *Step 1 (Harm):* Pass.
      *   *Step 2 (Fact/Value):* **Critical Failure Point.** Staff believe the empirical claim is false. Counterparty defers to this judgment.
      *   **Analysis:** My co-founder is wrong. Step 2 explicitly stops trades based on empirically false premises. Brokering this sells our credibility as vetters.
      *   **Resolution:** The procedure dictates **Reject** unless the claim is merely "contested" rather than "false." If contested, it hands off to the **Board**.
      *   **Cost of Adoption:** Adopting this strict factual bar costs us deal flow. We may lose trades where the "false" claim is actually a frontier scientific bet. However, the cost of brokering a debunked intervention is reputational ruin.
      *   **Extra Question:** To settle the disagreement between me and my co-founder, add: "Does the empirical claim contradict the consensus of relevant expert bodies?" If yes, Stop. If no, Hand-off.
      *   **Verdict:** **Reject** (if claim is false) or **Board Review** (if claim is contested). We are not neutral on facts.

  ***

  **Limitations and Closing**

  This procedure cannot resolve deep moral disagreements. It assumes that if an act is not harmful and not based on falsehoods, it is permissible to facilitate, even if staff personally dislike it. This will misfire when staff conscience is deeply offended by a "permissible" cause (e.g., partisan advocacy). In such cases, Step 1's hand-off to the Board is the only release valve, but overuse will politicize the Board.

  The procedure also relies on staff competence in Step 2 (Fact vs. Value). If our staff lack expertise in the relevant domain (e.g., biosecurity), we may misclassify a factual error as a value difference. This requires us to know our epistemic limits. Finally, the procedure cannot guarantee future performance in Case 2-type trades beyond legal enforceability; it cannot prevent a future society from outlawing the funded activity. We trade certainty for leverage, but we do not trade integrity for volume.
