answer: |-
  Here is a breakdown of the desiderata for a theory of material constitution, structured by logical constraints, ontological commitments, and explanatory power. I have flagged which are generally treated as hard constraints versus theoretical preferences, and concluded with the specific incompatibilities that force theorists to choose their poison.

  ### I. Logical and Formal Constraints (Non-Negotiable)
  *These are the rules of the game. A theory that violates these is usually considered logically incoherent unless it explicitly argues for a revision of logic itself.*

  **1. Compliance with Leibniz's Law (Indiscernibility of Identicals)**
  *   **The Constraint:** If $x$ is identical to $y$, then every property of $x$ is a property of $y$ (and vice versa). Formally: $x=y \rightarrow (Fx \leftrightarrow Fy)$.
  *   **Motivation:** Logical consistency. If you claim the statue *is* the clay (identity), you cannot assert the statue has a property the clay lacks (e.g., "could not survive being squashed") without contradiction.
  *   **Status:** **Non-Negotiable** (for classical logic).
      *   *Note:* Relative Identity theorists challenge this, but they pay a high price in logical complexity. For standard metaphysics, this is a hard constraint.

  **2. Transitivity of Identity**
  *   **The Constraint:** If $a=b$ and $b=c$, then $a=c$.
  *   **Motivation:** Prevents circular or branching identity chains. If the morning star is the evening star, and the evening star is Venus, the morning star must be Venus.
  *   **Status:** **Non-Negotiable.**
      *   *Motivation Case:* If a ship replaces plank A, then plank B, is it the same ship? If Ship-1 = Ship-Intermediate and Ship-Intermediate = Ship-2, then Ship-1 must = Ship-2. Theories cannot allow identity to "fade" over time without breaking transitivity.

  **3. Non-Contradiction**
  *   **The Constraint:** A proposition and its negation cannot both be true in the same sense at the same time.
  *   **Motivation:** Basic rationality.
  *   **Status:** **Non-Negotiable.**
      *   *Motivation Case:* You cannot say "The statue is the clay" and "The statue is not the clay" are both true under the same interpretation of "is."

  ---

  ### II. Ontological Desiderata (Contested Preferences)
  *These are the intuitions theories try to preserve. Different camps (Nihilists, Universalists, Coincidentalists) sacrifice different items on this list.*

  **4. Acceptance of Ordinary Objects (Common Sense Ontology)**
  *   **The Desideratum:** The theory should affirm the existence of mid-sized dry goods (statues, cats, ships).
  *   **Motivation:** Radical skepticism about ordinary objects is counterintuitive and pragmatically unlivable.
  *   **Status:** **Preference** (Rejected by Nihilists and some Eliminativists).
      *   *Motivation Case:* The Statue/Clay case. It seems absurd to say "There is clay here, but no statue." Nihilists bite this bullet to save other constraints.

  **5. The Uniqueness of Location (No Co-location)**
  *   **The Desideratum:** Two distinct material objects cannot occupy the exact same spatial region at the exact same time.
  *   **Motivation:** Prevents "ontological bloating." If distinct objects can co-locate, what stops there from being infinite distinct objects (a statue, a clay-lump, an atom-fusion, a trog) all in one spot?
  *   **Status:** **Preference** (Rejected by Coincidentalists/Constitutionalists).
      *   *Motivation Case:* The Statue/Clay. If the statue and clay are distinct (due to modal differences), but occupy the same space, you violate this. Coincidentalists accept co-location; Monists reject it to preserve uniqueness.

  **6. Distinct Persistence Conditions (Modal Profiles)**
  *   **The Desideratum:** Different kinds of objects survive different changes.
  *   **Motivation:** Sortal concepts matter. What it is to be a "statue" dictates different survival conditions than what it is to be a "lump of clay."
  *   **Status:** **Preference** (Rejected by Strict Identity Theorists).
      *   *Motivation Case:* If you squash the statue, the clay survives but the statue is destroyed. If they are identical, how can one survive and the other perish? Theories must explain whether these modal properties are real or merely descriptive.

  **7. Causal Non-Overdetermination**
  *   **The Desideratum:** A single effect should not have two fully sufficient, distinct causes.
  *   **Motivation:** Causal exclusion. If the clay causes the window to break, and the statue causes the window to break, and they are distinct, the breaking is systematically overdetermined.
  *   **Status:** **Preference** (Though widely held as a strong constraint).
      *   *Motivation Case:* The "Too Many Thinkers" problem. If I am a human animal, and I am also a person, and these are distinct co-located objects, do both think my thoughts? If so, thought is overdetermined.

  ---

  ### III. Explanatory Desiderata (Theoretical Virtues)
  *These are criteria for how well the theory integrates the above constraints.*

  **8. Sortal Sensitivity**
  *   **The Desideratum:** The theory must explain *why* sortal terms (cat, lump, statue) dictate identity conditions.
  *   **Motivation:** We don't count objects in a vacuum; we count *cats* or *ships*.
  *   **Status:** **Strong Preference.**
      *   *Motivation Case:* Tibbles the Cat. If Tibbles loses a tail, is it the same cat? The answer depends on the sortal "cat," not just the matter. A theory must ground this dependence.

  **9. Handling Vagueness without Contradiction**
  *   **The Desideratum:** The theory must account for borderline cases (e.g., when exactly does the clay become the statue?) without violating bivalence or logic.
  *   **Motivation:** Material constitution often involves gradual change.
  *   **Status:** **Strong Preference.**
      *   *Motivation Case:* The Ship of Theseus. If you replace planks one by one, at which step does the identity cease? A theory cannot simply say "it's vague" if that vagueness entails a logical contradiction in identity.

  **10. Metaphysical Grounding**
  *   **The Desideratum:** If two objects are distinct but co-located, the theory must explain what *grounds* their distinctness.
  *   **Motivation:** Brute facts are theoretically costly.
  *   **Status:** **Preference** (Varies by camp).
      *   *Motivation Case:* If the statue and clay are distinct, is it because of their modal properties? Their historical properties? Their form? A theory needs a principled basis for distinction, not just an assertion.

  ---

  ### IV. The Incompatibility Matrix (The "Impossible Trinity")

  This is the critical section. You cannot satisfy all the desiderata above simultaneously. The material constitution debate is essentially a menu of which desiderata to sacrifice. Here are the specific jointly unsatisfiable sets.

  #### Trilemma 1: The Standard Puzzle
  *You cannot hold all three of these simultaneously:*
  1.  **Existence:** Both the Statue and the Clay exist as objects. (Desideratum 4)
  2.  **Distinctness:** The Statue and the Clay are not identical (due to different modal/historical properties). (Desideratum 6)
  3.  **Uniqueness:** Only one object can occupy a spatial region at a time. (Desideratum 5)

  *   **The Trade-off:**
      *   **Coincidentalists** keep (1) and (2), sacrifice (3). (Accept co-location).
      *   **Eliminativists/Nihilists** keep (3), sacrifice (1). (Deny the statue exists).
      *   **Identity Theorists** keep (1) and (3), sacrifice (2). (Claim Statue = Clay, explain away modal differences).

  #### Trilemma 2: The Modal Problem
  *You cannot hold all three of these simultaneously:*
  1.  **Leibniz's Law:** Identicals share all properties. (Constraint 1)
  2.  **Modal Realism:** The statue and clay genuinely have different modal properties (e.g., "could survive squashing"). (Desideratum 6)
  3.  **Identity:** The statue is identical to the clay.

  *   **The Trade-off:**
      *   If you assert Identity, you must deny either Leibniz's Law (revisionary logic) or deny that the modal properties are real/attributable to the object (temporal parts or counterpart theory).
      *   If you assert Modal Realism and Leibniz's Law, you must deny Identity (leading back to Trilemma 1).

  #### Trilemma 3: The Causal Exclusion Problem
  *You cannot hold all three of these simultaneously:*
  1.  **Distinctness:** The constituting object (clay) and constituted object (statue) are distinct.
  2.  **Causal Efficacy:** Both objects are causally efficacious (the statue breaks the window; the clay breaks the window).
  3.  **No Overdetermination:** Effects are not systematically overdetermined by distinct sufficient causes. (Desideratum 7)

  *   **The Trade-off:**
      *   If they are distinct and both cause the effect, you have overdetermination.
      *   To avoid this, you must either claim they are **identical** (solving exclusion but inviting modal problems) or claim one is **causally inert** (epiphenomenalism about statues, which violates Common Sense).

  ### Summary of the "Hard Problem"
  The central tension is between **Leibniz's Law** (Logic) and **Sortal-Dependent Persistence** (Intuition).

  *   If you respect **Leibniz's Law** strictly, you are forced toward **Identity** (Statue = Clay).
  *   If you respect **Sortal-Dependent Persistence** strictly, you are forced toward **Distinctness** (Statue $\neq$ Clay).
  *   If you force **Identity** + **Distinct Persistence**, you violate **Leibniz's Law**.
  *   If you force **Distinctness** + **One Location**, you violate **Uniqueness**.

  Adequacy in this debate is not about solving the puzzle so that all intuitions are satisfied; it is about identifying which desideratum is the *least* costly to abandon.
