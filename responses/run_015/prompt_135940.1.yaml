  **MINISTRY OF JUSTICE**
  **PENAL ARCHITECTURE AND ETHICS REVIEW PANEL**

  **TO:** The Minister of State for Justice; Chair, Prison Governors' Association
  **FROM:** Member, Penal Architecture and Ethics Review Panel
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation Regarding Proposed Halden-Model Pilot Unit in Category A Estate
  **CLASSIFICATION:** OFFICIAL-SENSITIVE

  **1. PURPOSE**

  This memo provides the Panel's formal opinion regarding the proposal to integrate a pilot housing unit modelled on the Norwegian Halden prison principles within an existing United Kingdom Category A high-security establishment. The proposal advocates for private cells arranged around shared domestic kitchens, normalised staff-inmate interaction, and the removal of overt institutional signage. The Panel has evaluated this proposal against current security protocols, recidivism data, and competing ethical frameworks regarding the purpose of incarceration.

  **2. RECOMMENDATION**

  The Panel recommends **approval of a limited pilot subject to quarterly review**.

  We advise against immediate rejection, as the philosophical and empirical case for environmental normalization warrants testing within the UK context. We also advise against immediate full-scale implementation, given the security risks inherent to Category A populations. The pilot should be confined to a single wing (maximum 60 places) within a designated high-security estate, operating under a **24-month feasibility window**.

  **3. ETHICAL ANALYSIS AND OBJECTIONS**

  The Panel has engaged seriously with two competing philosophical claims regarding the architectural treatment of prisoners.

  **3.1 The Objection of Rehabilitative Theatre**
  Critics argue that importing the Halden model risks producing "rehabilitative theatre." In this view, a domesticated environment encourages prisoners to enact normative personhood solely to secure institutional rewards (privileges, parole) without genuine internal transformation. This objection posits that the American model of mass incarceration, while brutal, maintains a transparent boundary between punishment and personhood. It avoids moral deception by clearly signalling that the prisoner is currently stripped of full social standing.

  The Panel rejects the conclusion that transparency of degradation serves the public interest. While the "theatre" objection is valid regarding performative compliance, it conflates *performance* with *habituation*. Ethical agency is not merely an internal state but a practiced behaviour. If architecture demands the performance of responsibility (e.g., cooking, cleaning, conflict resolution in shared space), it creates the structural conditions for moral muscle memory. A system that is honest about degradation produces individuals adept at surviving degradation, not citizens adept at lawful living. The risk of performative compliance exists in all penal models; it is preferable to incentivize the performance of pro-social norms than the performance of submission.

  **3.2 Architecture as Moral Recognition**
  The competing claim is that architecture constitutes a form of moral recognition. To deny prisoners domestic space is ontologically reductive; it treats them as beings permanently incapable of future moral agency. By designing spaces that assume incapacity (e.g., hatches, bars, communal canteens), the state reinforces the very deficits it claims to remedy.

  The Panel accepts this premise as the ethical baseline for the pilot. If the state retains the power to release prisoners back into the community, it must acknowledge their potential for community membership during confinement. Architecture that precludes this acknowledgement contradicts the statutory aim of rehabilitation.

  **4. SECURITY AND OPERATIONAL VIABILITY**

  The primary constraint is the Category A designation, reserved for prisoners whose escape would pose a serious threat to the public.
  *   **Risk:** Shared kitchens and normalised interaction reduce direct surveillance sightlines and introduce potential weapons (utensils).
  *   **Mitigation:** The pilot must utilize tamper-proof culinary equipment and maintain dynamic security protocols where staff interaction replaces static surveillance. Staff training must shift from containment to engagement.
  *   **Incommensurability:** We reject the argument that high security and normalization are culturally incommensurable. Security is a function of procedure and staffing, not solely of austere design. However, the pilot must demonstrate that "normalcy" does not degrade perimeter integrity.

  **5. IMPLEMENTATION PLAN AND TIME FRAME**

  *   **Phase 1 (Months 1-6):** Staff recruitment and specialized training. Architectural modification of the designated wing.
  *   **Phase 2 (Months 7-24):** Operational pilot.
  *   **Review Cycle:** Quarterly reports submitted to the Panel and the Prison Governors' Association.
  *   **Metrics:**
      1.  **Security:** Number of serious incidents (assaults, escapes, contraband finds) compared to control wings.
      2.  **Behaviour:** Frequency of adjudications for disciplinary breaches.
      3.  **Psychological:** Pre- and post-intervention assessments of impulse control and pro-social reasoning (using standardized psychometric tools).
      4.  **Staff:** Retention rates and sickness absence related to stress.

  **6. CONDITIONS FOR REVERSAL OF RECOMMENDATION**

  This recommendation is contingent. The Panel will withdraw support and recommend immediate cessation of the pilot under the following conditions:
  1.  **Empirical Evidence:** If recidivism rates (tracked post-release for pilot participants) exceed matched control groups by a statistically significant margin (p < 0.05) after the 24-month period.
  2.  **Security Failure:** If there is more than one Category A escape attempt or successful escape originating from the pilot unit during the operational phase.
  3.  **Philosophical/Operational Failure:** If qualitative data demonstrates that the "domestic" setting is being systematically co-opted by coercive prisoner hierarchies to exert control more effectively than in standard wings (i.e., the "kitchen" becomes a site of exploitation rather than rehabilitation).

  **7. VULNERABILITY OF REASONING**

  The precise point in this reasoning most vulnerable to collapse is the **assumption of environmental determinism in high-risk populations**.

  The recommendation relies on the premise that altering the physical environment will positively influence the behavioural psychology of Category A prisoners. This assumes that the drivers of serious criminality are responsive to environmental cues of trust and responsibility. If the specific cohort placed in the pilot unit comprises individuals whose pathology is resistant to normative social cues (e.g., severe psychopathy or entrenched ideological extremism), the architectural intervention may become irrelevant to their behaviour. In such a scenario, the unit would incur the security risks of normalization without achieving the rehabilitative benefits, rendering the model operationally unsustainable. The pilot's success depends entirely on the rigorous selection of candidates who retain the capacity for moral agency, a metric that is itself difficult to assess with precision.

  **8. CONCLUSION**

  The Panel advises that the Ministry proceed with the limited pilot. To reject the proposal on the grounds of "cultural incommensurability" is to accept the status quo of ontological reduction without empirical justification. To approve it without a pilot is to ignore security realities. A measured, data-driven trial is the only mechanism to resolve the tension between security imperatives and ethical obligations.

  **Signed,**

  **Member, Penal Architecture and Ethics Review Panel**
  *Declaration of Interest: Relevant interests have been declared to the Panel Chair in accordance with Ministry of Justice guidance.*
