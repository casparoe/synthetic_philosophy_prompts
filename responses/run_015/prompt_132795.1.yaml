      *   **Conflict 4: The Definition of Punishment (h).**
          *   *Analysis:* (h) says monitoring is not punishment. (a) says punitive hard treatment requires culpable violation. If monitoring is burdensome (hard treatment) but imposed after desert is exhausted, is it punitive?
