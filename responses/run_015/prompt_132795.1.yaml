      *   **Conflict 5: State Culpability (g) vs. Desert Ceiling (b).**
          *   *Analysis:* (g) reduces sentence due to state failure. (b) says ceiling is desert.
          *   *Tension:* Low. Reducing *below* the ceiling is allowed in (b). The tension is theoretical: does this undermine the idea that desert is about *offender* culpability?
          *   *Resolution:* Easy fit. It's a mitigation policy within the discretionary space.
          *   *Severity:* **Low.**

  5.  **Synthesizing and Ranking:**

      *   **Rank 1 (Critical):** (e) vs (f). The "Split-Verdict" cannot sustain the "Expressive Severity" claim. If severity expresses censure, you cannot decouple it from blameworthiness.
      *   **Rank 2 (High):** (b) vs (d). Marginal deterrence often requires penalties that exceed ordinal desert rankings (e.g., punishing completion much more than attempt, or white collar more than street crime). If Desert is a *ceiling*, these utilitarian spikes might hit the roof.
