answer: |-
  This is the classic tutorial room stalemate. You know the type: the student looks at the Allais pairs, nods at the independence violation, and then says, 'But if I choose 1A, I avoid the regret of getting nothing,' or 'The money means more to me in the sure case because of diminishing marginal utility of *security*.' They are not denying the logic; they are denying the mapping.

  You are asking for the name of the move where the normative theory is preserved by expanding the ontology of the choice problem. I have seen this manoeuvre countless times. It sits at the intersection of psychology, logic, and semantics. Let us carve out the conceptual space before we settle on a label.

  ### The Nearest Existing Concepts

  There are three concepts hovering around this move. None fit perfectly, but each captures a different facet of the geometry.

  **1. Framing Effects**
  *   **The Concept:** In behavioural economics, a framing effect occurs when logically equivalent descriptions of a problem lead to different choices (e.g., '90% survival' vs '10% mortality'). This is typically treated as a bias, a violation of description invariance.
  *   **Why it differs:** Your students are arguing the *inverse*. They are not admitting that the frame changed their mind irrationally; they are insisting the frames are *not* equivalent. They claim the objective situations differ (one includes regret, one does not). Framing theory says 'same world, different words'; your students say 'different words, different worlds.' They are using the *logic* of framing to defend rationality, rather than expose irrationality.

  **2. Small Worlds vs. Grand Worlds (Savage)**
  *   **The Concept:** Leonard Savage distinguished between 'small worlds' (simplified, closed contexts where axioms hold) and 'grand worlds' (complex reality where they might not). He explicitly warned that applying expected utility theory to grand worlds is a category error.
  *   **Why it differs:** Your students are effectively trying to force a grand world problem into a small world model. They do not say, 'This is too complex for the axiom.' They say, 'If we add these extra variables (tax, bankruptcy, regret), it *becomes* a small world where the axiom holds.' They are using the Small World concept not as a limitation, but as an expandable container. They are engaging in **state-space expansion** to preserve the Small World assumption.

  **3. Immunising Stratagem (Popper)**
  *   **The Concept:** In the philosophy of science, this is an auxiliary hypothesis added to a theory solely to protect it from falsification, without adding independent testability.
  *   **Why it differs:** This captures the *logical structure* of the move perfectly. The axiom is the core theory; the problem description is the auxiliary hypothesis. By changing the description, they save the theory. However, 'Immunising Stratagem' is too broad; it applies to astrology as much as decision theory. It lacks the specific flavour of *re-describing outcomes* that characterises your case.

  ### The Verdict: A Coined Term

  None of the above captures the specific *decision-theoretic* nature of the move. 'Framing' is behavioural; 'Small Worlds' is about scope; 'Immunising' is epistemological.

  The technical mechanism your students are using is known in the literature as **outcome re-individuation**. This is the process of distinguishing outcomes not just by monetary payoff, but by psychological or contextual features (e.g., £1m *with regret* vs £1m *without regret*).

  However, there is no standard name for the *argumentative strategy* of using re-individuation solely to protect an axiom from violation. Therefore, I propose we call this move:

  ## **The Re-individuation Rescue**

  **Definition:** The argumentative move wherein an apparent violation of a normative axiom is resolved by postulating hidden features of the outcomes or states (e.g., regret, diagnostic value, liquidity), thereby rendering the choices consistent with the axiom, without independent prior evidence that those features were decision-relevant.

  ### Carving the Edges: Legitimate vs. Rescue

  The danger of the Re-individuation Rescue is that it renders decision theory tautological. If any choice can be rationalised by inventing a suitable consequence, the theory predicts nothing. To distinguish a legitimate refinement of the model from a rescue operation, we must apply three tests.

  **1. The Ex Ante Specification Test**
  *   **Legitimate:** The agent can specify the relevant feature *before* the choice is made. 'I am choosing 1A because I know I will feel regret if I gamble and lose.'
  *   **Rescue:** The feature is introduced *after* the violation is pointed out. 'I chose 1A... oh, and by the way, that choice includes 'no regret' as a consequence.'
  *   **The Edge:** If the re-individuation is generated to explain the data rather than to model the deliberation, it is a rescue.

  **2. The Independent Evidence Test**
  *   **Legitimate:** There is independent psychological or contextual evidence that the feature matters to this agent. (e.g., We know this doctor values diagnostic information over immediate cure in other contexts).
  *   **Rescue:** The only evidence for the existence of the 'hidden consequence' is the choice itself. (e.g., 'How do you know regret mattered?' 'Because I chose the safe option.')
  *   **The Edge:** Circular reasoning marks the rescue. The consequence is inferred from the choice it is meant to justify.

  **3. The Predictive Power Test**
  *   **Legitimate:** The re-individuated model predicts behaviour in *other* similar problems. If regret is the key, the agent should display regret-aversion elsewhere.
  *   **Rescue:** The re-individuation is local to the specific paradox. The agent accepts the Independence Axiom in modified Allais problems but re-individuates only when caught out.
  *   **The Edge:** A legitimate model generalises; a rescue is ad hoc.

  ### Summary

  You are encountering **The Re-individuation Rescue**. It is a specific species of **Immunising Stratagem** that operates via **Outcome Re-individuation** within a **Small World** framework.

  It is a seductive move because it is often *partially* true. Real-world choices *do* involve regret, taxes, and bankruptcy risks. The error lies not in noticing these features, but in treating the axiom as inviolable truth rather than a normative ideal. When the axiom becomes immune to violation by definition, it ceases to be a tool for evaluating choices and becomes a mere description of whatever was chosen.

  In your tutorials, the counter-move is to ask: 'If we wrote down all those extra features in the problem statement *before* you chose, would you still have made the same choice, or does the axiom only hold once we explain your choice to you?' That usually exposes the rescue.
