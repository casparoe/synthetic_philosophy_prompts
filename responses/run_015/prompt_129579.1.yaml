answer: |-
  Your observation cuts to the heart of a messy intersection between ethical criticism, institutional pragmatism, and public relations. The pattern you describe—suppressing living musical offenders while retaining dead visual artists and controversial filmmakers—is not the result of a single, coherent philosophical framework. Rather, it is a patchwork of competing intuitions that institutions stitch together to manage risk.

  To reconstruct the implicit theory presupposed by these practices, we must look at three specific axes of distinction: temporality, collaboration, and the nature of financial support.

  ### 1. Reconstructing the Implicit Theory

  The current institutional landscape operates on a hybrid view that blends **consequentialist ethics** with a weak form of **historical contextualism**. It does not strictly adhere to aesthetic autonomism (the view that art is separate from morality) nor radical moralism (the view that moral defects always diminish aesthetic value). Instead, it presupposes the following commitments:

  **A. The Consequentialist Constraint (Living vs. Dead)**
  The sharpest distinction is between the living and the dead. When a platform demonetises a living artist, the primary philosophical commitment is not necessarily that the *art* has become worse, but that *consuming it now causes harm*.
  *   **The Commitment:** Financial support for a living convicted violent criminal constitutes complicity in their ongoing agency. Royalties provide resources that could facilitate further harm or reward past wrongdoing.
  *   **The Decay Factor:** Once the artist is dead, the financial pipeline leads to an estate or heirs, not the moral agent themselves. The "moral taint" is viewed as non-transferable to the corpse. This suggests a 'statute of limitations' on moral accountability, but it is pragmatic rather than metaphysical. It assumes that the ethical weight of supporting a villain diminishes once the villain can no longer act.

  **B. The Collaborative Defence (Film vs. Music)**
  You noted that films by morally compromised directors are often retained while music is suppressed. The implicit theory here relies on the **ontology of the medium**.
  *   **The Commitment:** A film is a massively collaborative enterprise involving hundreds of innocent workers (actors, cinematographers, editors, crew). To suppress a film is to punish the innocent collective for the sins of the auteur.
  *   **Contrast:** A pop song or album is often perceived (rightly or wrongly) as a more solitary endeavour, or at least one where the primary financial beneficiary is the named artist. Therefore, suppressing music is seen as a targeted sanction, whereas suppressing film is seen as collateral damage. This is not an aesthetic judgement, but an ethical calculation regarding collateral harm.

  **C. Contextualism over Erasure (The Plaque Solution)**
  University galleries keeping works by dead artists with 'awful' records, accompanied by biographical plaques, presuppose **moderate ethical contextualism**.
  *   **The Commitment:** The moral failing is relevant to the *interpretation* of the work, but not necessarily to its *preservation*. The plaque serves to neutralise the risk of the institution appearing to endorse the behaviour. It signals: 'We display this for its historical/aesthetic significance, not as a moral endorsement.' This assumes that aesthetic value can survive moral rot, provided the context is managed correctly.

  ### 2. Is the Practice Coherent?

  Philosophically, this pattern is **incoherent** if viewed as a unified theory of value. It contradicts itself on the nature of the artwork.
  *   If the art is tainted by the artist's violence, it should remain tainted after death (the work doesn't change).
  *   If the art is autonomous, it should be platformed regardless of the artist's status (living or dead).

  However, the practice does not *need* one consistent theory to function. It is **philosophically underdetermined**. This means the same pattern of behaviour can be justified by several rival views, depending on which auxiliary premises you accept.
  *   **View A (Utilitarian):** We suppress living artists to minimise future harm, but keep dead artists to maximise cultural utility.
  *   **View B (Retributive):** We punish living artists because they can feel the punishment; punishing the dead is futile.
  *   **View C (Reputational Risk):** Living artists generate active scandals; dead artists generate only academic debate.

  Institutions are not philosophical monoliths; they are bureaucratic entities managing reputation and revenue. The inconsistency arises because they are balancing **ethical purity** against **cultural preservation** and **profit**. They are not trying to solve the problem of aesthetic value; they are trying to avoid a PR crisis. Therefore, looking for a rigorous philosophical system here is likely to result in frustration. The 'theory' is actually a set of heuristics for damage control.

  ### 3. Counterfactual Policies: What Would Change?

  To clarify the commitments, let us imagine how policy would shift if institutions adopted the two extreme philosophical poles you mentioned.

  **Scenario A: Radical Autonomism (Aesthetic Value is Completely Independent)**
  *   **The View:** The moral character of the creator is irrelevant to the value of the work and the ethics of its consumption.
  *   **Policy Changes:**
      *   **Streaming/Radio:** Algorithms would continue to recommend music by convicted violent criminals without restriction. Monetisation would remain intact. The 'report' function for artist morality would be removed.
      *   **Galleries:** Acquisitions from imprisoned artists would proceed as normal. No biographical plaques detailing crimes would be necessary, as the information is deemed irrelevant to the aesthetic experience.
      *   **Film:** No distinction would be made between collaborative and solitary works; all would be treated purely on formal merit.
  *   **The Consequence:** Institutions would face significant public backlash and potential boycotts. This view assumes the public can compartmentalise ethics and aesthetics perfectly, which sociological evidence suggests is false.

  **Scenario B: Radical Moralism (Serious Wrongdoing Always Diminishes Value)**
  *   **The View:** Moral defects in the creator infect the work itself, rendering it aesthetically diminished or ethically toxic regardless of time or medium.
  *   **Policy Changes:**
      *   **Archives:** Works by dead artists with 'genuinely awful' records (e.g., known abusers, collaborators with oppressive regimes) would be removed from permanent display or de-accessioned entirely.
      *   **History:** Art history curricula would require significant rewriting. 'Great' works would be reclassified as 'morally compromised artifacts.'
      *   **Film/Music:** A blanket ban on works by anyone with a serious conviction, regardless of whether they are alive or dead, or whether the work was collaborative.
  *   **The Consequence:** This would lead to a massive erosion of cultural heritage. Museums would become emptier, and the historical record would be sanitised. It presupposes that we cannot learn from or appreciate the output of immoral agents, a view that many historians find untenable.

  ### Conclusion

  The pattern you have identified is not a hidden philosophical truth waiting to be decoded; it is a **pragmatic compromise**. It presupposes that our relationship with art is partly about aesthetic experience, but largely about **social signalling**.

  By suppressing living artists, institutions signal that they do not condone current violence. By retaining dead artists, they signal that they value heritage and history. By adding plaques, they signal ethical awareness without sacrificing the collection.

  Philosophically, this is a form of **impure contextualism** governed by a **consequentialist statute of limitations**. It is not logically tight, but it is socially functional. If you wish to argue with your friends, the strongest point is not that one side is 'right', but that the institutional behaviour proves that society does not actually believe art can be fully separated from the artist. If we truly believed in autonomism, the criminal record would be irrelevant. The fact that we manage it through suppression and plaques proves that, in practice, we treat the artist's morality as a property of the work, but only when it is convenient to do so.
