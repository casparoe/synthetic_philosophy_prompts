answer: |-
  ### I. Requirements Specification for a Commitment-Detection Theory

  To underwrite an annotation scheme and classifier for speaker commitment regarding antecedents, a theory of the indicative/counterfactual distinction must satisfy the following requirements.

  **1. Coverage of Boundary Cases**
  The theory must assign a determinate commitment status to antecedents in the following specific configurations:
  *   **Settled-but-Unknown:** Cases where the fact is metaphysically settled but epistemically open to the speaker (e.g., the sealed biopsy result). The theory must distinguish this from genuine metaphysical openness.
  *   **True Antecedent Counterfactuals:** Constructions like "if it weren't for" or "but for," where the antecedent is known to be true but is grammatically marked as counterfactual. The theory must explain why the speaker signals a commitment to the truth of $A$ while using counterfactual morphology.
  *   **Oswald/Kennedy Cases:** Indicatives where the speaker believes the antecedent is false (e.g., "If Oswald didn't shoot Kennedy, someone else did"). The theory must permit an indicative form despite the speaker's commitment to $\neg A$.
  *   **Asymmetric Information:** Exchanges where the speaker knows $A$ but the audience does not, and the speaker uses an indicative to maintain the flow of conversation. The theory must account for the felicity of the utterance without forcing the speaker to lie about her own epistemic state.
  *   **Future-Directed and Inverted Forms:** "Were he to arrive" or standard future indicatives. The theory must classify these as committing to nothing regarding the truth of $A$ (agnosticism), distinct from settling on $\neg A$.

  **2. Preservation of Granular Distinctions**
  The theory must not collapse the following categories into a single binary feature:
  *   **Speaker Information vs. Common Ground:** It must distinguish what the speaker knows from what is mutually accepted in the conversation. A theory that relies solely on the Common Ground will fail the asymmetric information and biopsy cases.
  *   **Commitment to $\neg A$ vs. Commitment to Ignorance:** It must distinguish between a speaker who believes the antecedent is false and a speaker who believes the antecedent is unknown. Both may use counterfactual-like forms, but the annotation tag differs.
  *   **Author Commitment vs. Reported Commitment:** It must distinguish the current speaker's commitment from commitments embedded under attitude verbs ("She said that if...") or within fictional suppositions.
  *   **Entailment vs. Implicature vs. Presupposition:** It must specify whether the commitment to the antecedent's status is a truth condition, a pragmatic inference, or a presupposition. This determines how the tag behaves under negation.

  **3. Derivation of Phenomena (No Stipulation)**
  The theory must explain the following patterns as consequences of its core mechanics, not as ad-hoc rules:
  *   **Morphological Distribution:** Why "would" appears in the consequent of one class and "will" in the other, and why this correlates with antecedent commitment.
  *   **Speech Act Compatibility:** Why only one form supports offers, bets, or threats (which require an open antecedent), while the other supports explanations or excuses (which often assume a settled antecedent).
  *   **Antecedent Sensitivity:** Why adding detail to an antecedent (e.g., specifying a time or place) can flip the classification from indicative to counterfactual.
  *   **Disagreement Data:** How two speakers with different information can assert conditionals with the same antecedent and contradictory consequents without one being semantically incorrect.
  *   **Embedding Stability:** How the commitment status projects (or fails to project) under negation, question formation, and attitude reports ("I doubt whether if...").
  *   **Cross-Linguistic Variation:** Whether the distinction is semantic or pragmatic, given that not all languages mark it morphologically. A semantic theory must explain unmarked languages; a pragmatic theory must explain embedding.

  ***

  ### II. Analysis of Requirements

  **Non-Negotiable vs. Preference**
  *   **Non-Negotiable:** The separation of **Speaker Information from Common Ground** is mandatory. Your task is to tag *speaker commitment*, not conversational status. A theory that defines the indicative/counterfactual distinction solely via the Common Ground (e.g., standard Stalnakerian accounts) is unusable for your corpus, as it will mislabel the biopsy and asymmetric information cases. Similarly, **Embedding Stability** is non-negotiable; if the theory cannot handle "She said that if...", your classifier will fail on reported speech, which is prevalent in news and transcripts.
  *   **Preference:** **Uniformity of Treatment** (treating indicatives and counterfactuals as the same underlying operator with different parameters) is a theoretical preference, not a practical necessity. You can tolerate an ambiguous taxonomy if the classification rules remain distinct. **Compositionality** is preferred for classifier architecture but may be sacrificed if a holistic feature set yields higher accuracy. **Conservatism about Modality** (keeping the modal base fixed) is a preference; your data suggests the modal base shifts dynamically, so a flexible theory is better.

  **The Single Key Requirement**
  The requirement that does the most work in excluding candidates is: **The theory must distinguish Speaker Information from Common Ground.**
  Most classical semantic theories define the indicative/counterfactual distinction based on what is *possible in the context set* (Common Ground). If a fact is settled in the context set, the counterfactual is required. However, your "Biopsy" and "Asymmetric Information" cases show that speakers use indicatives even when *they* know the fact is settled, provided the *audience* does not. A theory that cannot index modal bases to the speaker rather than the conversation will fail to generate the correct annotation tags for these tokens.

  **Incompatible Pairs and Diagnosis**
  *   **Pair:** "Classify every token from the Common Ground alone" vs. "Get the asymmetric-information cases right."
      *   **Diagnosis:** This tension is a **finding about conditionals**, not a sign that your specification is confused. It reveals that the indicative/counterfactual distinction is not purely a function of the public conversational score. Your specification correctly identifies that speaker commitment is a private state that can diverge from public common ground. Any theory insisting on Common Ground exclusivity must be rejected for this task.
  *   **Pair:** "Purely Pragmatic Distinction" vs. "Explains Projection out of Embeddings."
      *   **Diagnosis:** This is also a **finding about conditionals**. If the distinction were purely pragmatic (a matter of use), it should vanish under semantic embedding (like presuppositions sometimes do). The fact that it survives embedding ("He denied that if it had rained...") suggests a semantic component. A theory that claims it is *only* pragmatic will fail the embedding requirement. Your specification is not confused; it is correctly identifying a hard constraint that eliminates purely Gricean accounts.

  ***

  ### III. Theoretical Scorecard

  **Closest-World Similarity (Lewis–Stalnaker)**
  Fails the non-negotiable requirement on Speaker vs. Common Ground; it treats counterfactuality as a shift in the context set, making the "Biopsy" case (settled fact, open conversation) difficult to classify without ad-hoc adjustments. Good for truth conditions, poor for private commitment detection.

  **Modal-Restrictor View (Kratzer)**
  Strongest candidate; allows the modal base to be shifted to the speaker's knowledge state rather than the common ground, directly satisfying the asymmetric information requirement. However, operationalizing the selection of the correct modal base for a classifier requires complex context modeling.

  **Probabilistic/No Truth Conditions (Adams)**
  Fails the embedding requirement; if conditionals lack truth conditions, they cannot be straightforwardly negated or reported in "She said that" clauses. Useful for modeling degrees of belief, but unsuitable for a discrete annotation scheme requiring commitment tags.

  **Dynamic Update Semantics**
  Handles embedding and information flow well, treating conditionals as tests on information states. However, it often struggles to explain the morphological distinction (indicative vs. subjunctive) without importing external pragmatic rules, which complicates the derivation requirement.
