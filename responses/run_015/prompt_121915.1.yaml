answer: |-
  **Project Title:** Beyond Epistemics: Mapping Structural Cluelessness in Consequentialism
  **Applicant:** [Your Name]
  **Duration:** 8 Weeks (Half-Time)
  **Request:** [Amount/Stipend]

  **The Problem**
  Discussions on consequentialist cluelessness usually stall at "we can't predict the far future." That's empirical ignorance, and it's only one piece of the puzzle. I propose cluelessness actually splits into three distinct categories:
  1.  **Empirical Ignorance:** Missing data about outcomes.
  2.  **Axiological Drift:** Uncertainty about which values survive context shifts.
  3.  **Structural Cluelessness:** Where the decision framework itself fails to stabilize comparisons across world-states that are ontologically too different.

  Standard fixes—expected value with wide confidence intervals, robustness analysis, etc.—handle empirical ignorance well. They fail on structural cluelessness. You cannot assign intervals to comparisons that lack a common metric because the ontological categories themselves shift (e.g., comparing digital sentience to biological suffering).

  **The Core Question**
  Is there a principled reason structural cluelessness hits consequentialism harder than it hits rule-deontology or virtue ethics? Or is this asymmetry just an artifact of how philosophers formalize these theories? Consequentialism demands a common currency for comparison; deontology and virtue ethics often rely on local constraints or character traits that might bypass the need for global ontological stability. I want to know if consequentialism is uniquely fragile here, or if the other frameworks just hide the structural break better.

  **Methodology**
  Given the 8-week, half-time scope, this is a conceptual mapping project, not a definitive proof.
  1.  **Weeks 1–2: Taxonomy.** Rigorously define the three types of cluelessness, isolating structural instability from epistemic uncertainty.
  2.  **Weeks 3–5: Comparative Stress Test.** Apply the taxonomy to consequentialism, rule-deontology, and virtue ethics. Identify where each framework loses traction when ontological categories shift.
  3.  **Weeks 6–7: Case Studies.** Test the framework on two non-obvious cases:
      *   *AI Alignment:* Where agents may create ontologically new forms of value/disvalue.
      *   *Wild Animal Suffering:* Where ecological complexity challenges standard utility aggregation.
  4.  **Week 8: Synthesis.** Draft a report detailing the asymmetry (or lack thereof).

  **Success vs. Failure**
  *   **Success:** A clear taxonomy that distinguishes structural cluelessness from empirical ignorance, plus a defensible argument on whether consequentialism is uniquely vulnerable. Even a negative result (showing the asymmetry is an artifact) is valuable—it clears the field for better formalizations.
  *   **Failure:** If the three categories collapse back into simple epistemic uncertainty upon scrutiny, or if the 8-week timeline proves insufficient to fairly characterize the competing ethical frameworks. I will mitigate this by narrowing the scope of the comparative analysis if needed.

  **Why This Matters**
  If structural cluelessness is a unique bug in consequentialism, high-stakes decision-making (like AI governance or global prioritization) needs alternative decision procedures. If it's a feature of all ethics, we need to stop pretending expected value calculations can solve deep ontological uncertainty. This project clarifies which it is.
