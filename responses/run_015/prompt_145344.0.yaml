answer: |-
  # The Structural Desiderata of Well-Being: An Experience Machine Stress Test

  Treating the Experience Machine (EM) not as a singular intuition pump but as a structural stress test reveals that well-being theories are not merely competing answers to "what is good?" but competing topologies of value space. An adequate theory must navigate the tension between the *subjective feel* of a life and its *objective structure*. The following specification outlines the full desiderata required for adequacy, derived from the structural pressures of the EM and its variants.

  ## I. Specification of Desiderata

  | Desideratum | Motivating Consideration | Status |
  | :--- | :--- | :--- |
  | **1. The Non-Supervenience Constraint**<br>(Standard EM) | A theory cannot claim a simulated life of equal pleasure is *equally* good as a real life of equal pleasure. Well-being must depend on factors beyond phenomenal experience (e.g., causal contact, authenticity). | **Broad Consensus**<br>(Post-Nozickian Standard; rejects Pure Hedonism) |
  | **2. The Phenomenal Adequacy Constraint**<br>(Reverse EM) | A theory cannot claim a life of unmitigated suffering is "good" solely because it contains objective goods (e.g., virtue, truth) or fulfilled desires. If it feels like hell, it cannot be a high well-being life. | **Non-Negotiable**<br>(Empirical/Conceptual Hard Limit) |
  | **3. The Agency/Authorship Constraint**<br>(Partial EM) | In scenarios where only specific domains (e.g., achievement) are simulated, the theory must explain why *doing* is valued over *feeling like one did*. Well-being requires a threshold of causal efficacy. | **Camp-Specific**<br>(Perfectionist/Agency-Centric) |
  | **4. The Empirical Alignment Constraint**<br>(Psychology/Biology) | The theory must accommodate **hedonic adaptation** (set-points) and **adaptive preferences** (the "happy slave"). It cannot posit that reported satisfaction always tracks well-being, nor that it never does. | **Non-Negotiable**<br>(Scientific Credibility) |
  | **5. The Distinction Preservation Constraint**<br>(Conceptual) | The theory must distinguish between **experiential quality** (feeling good), **life evaluation** (judging life good), and **objective welfare** (being well). Collapsing these renders the Reverse EM inexplicable. | **Non-Negotiable**<br>(Methodological Coherence) |
  | **6. The Degree Sensitivity Constraint**<br>(Quantification) | The theory must explain not just *possession* of well-being but *degrees*. (e.g., Is 50 years in the machine better than 1 year of real struggle?). Monistic theories often fail here. | **Non-Negotiable**<br>(Logical Coherence) |

  ### Detailed Analysis of Key Desiderata

  **1. The Non-Supervenience Constraint (Standard EM)**
  *   **Motivation:** The widespread intuition that plugging into the machine is a mistake, even if pleasure is maximized. This exposes the hidden commitment that *contact with reality* is constitutive of value, not merely instrumental.
  *   **Status:** While logically possible to reject (Hedonists do), it is a **Broad Consensus** requirement for any theory claiming to capture *human* well-being in the post-1974 philosophical landscape. To ignore this is to advocate for a theory known to be counter-intuitive to the majority of subjects.

  **2. The Phenomenal Adequacy Constraint (Reverse EM)**
  *   **Motivation:** Consider a subject in the real world enduring torture who refuses to enter a machine that would end their pain. A theory that says they are "better off" suffering in reality violates the **Phenomenal Adequacy Constraint**. Well-being must have a necessary (though not sufficient) connection to positive phenomenology.
  *   **Status:** **Non-Negotiable.** A theory that declares a life of agony to be "high well-being" due to objective goods (e.g., "The Martyr Problem") loses its connection to the concept of *welfare* and becomes a theory of *moral worth* instead.

  **3. The Empirical Alignment Constraint**
  *   **Motivation:** Psychology demonstrates **hedonic adaptation** (people return to baseline happiness after major events) and **adaptive preferences** (people lower desires to match oppressive circumstances). A theory claiming well-being = desire satisfaction fails when desires adapt to misery. A theory claiming well-being = happiness fails when happiness persists despite objective deprivation.
  *   **Status:** **Non-Negotiable.** A theory of human well-being that contradicts established data on human psychology is empirically falsified.

  ## II. Jointly Unsatisfiable Subsets (The Philosophical Result)

  The structural stress test of the Experience Machine reveals a **Trilemma of Welfare**. No monistic theory can simultaneously satisfy the following three desiderata without arbitrariness or contradiction:

  1.  **The Reality Principle:** Well-being requires causal contact with the actual world (derived from Standard EM).
  2.  **The Resonance Principle:** Well-being requires the subject's positive endorsement/experience (derived from Reverse EM/Phenomenal Adequacy).
  3.  **The Monism Principle:** Well-being consists in *one* kind of thing (e.g., only pleasure, only desire, only objective goods).

  **The Tension:**
  *   If you prioritize **Reality** (to satisfy Standard EM), you risk violating **Resonance** in the Reverse EM case (declaring the suffering truth-teller better off than the happy simulator).
  *   If you prioritize **Resonance** (to satisfy Reverse EM), you violate **Reality** in the Standard EM case (declaring the simulated life equally good).
  *   If you maintain **Monism**, you must dismiss one of the EM intuitions as "mistaken."

  **The Result:**
  To accommodate the full structural range of the Experience Machine (Standard, Reverse, and Partial), a theory must abandon **Monism**. The subset {Reality Principle, Resonance Principle, Monism Principle} is **jointly unsatisfiable**. Adequacy requires a hybrid or pluralistic account that accepts a trade-off function between authenticity and experience, rather than a single constitutive metric.

  ## III. The Killer Desideratum

  The single desideratum that eliminates the largest share of mainstream *classic* theories is:

  ### **The Non-Supervenience on Experience Constraint**
  *(Derived from Desideratum #1)*

  This requirement states that two lives identical in phenomenal experience (pleasure/pain balance) but differing in causal contact with reality cannot be identical in well-being. This is the direct logical output of the Standard Experience Machine intuition.

  **Why it is the "Killer":**
  It eliminates the "Null Hypothesis" of well-being (Hedonism) and forces all surviving theories to introduce externalist complications that often destabilize their internal logic (e.g., Desire theories must add "informed" conditions that look suspiciously like Objective List items).

  ### Theory Performance Against the Killer Desideratum

  | Theory | Performance Against **Non-Supervenience Constraint** | Consequence |
  | :--- | :--- | :--- |
  | **Hedonism** | **Fails.** | **Eliminated.** By definition, Hedonism holds that well-being supervenes entirely on mental states. It must reject the Standard EM intuition, branding it a systematic error. |
  | **Desire-Satisfaction** | **Struggles.** | **Forced Hybridization.** To pass, it must claim we desire "reality" itself. But if we desire reality *instrumentally* (for pleasure), it collapses to Hedonism. If *intrinsically*, it becomes an Objective List theory. |
  | **Objective-List** | **Passes.** | **Survives (with caveats).** Naturally accommodates the constraint (truth/authenticity are on the list). However, it risks failing the *Phenomenal Adequacy Constraint* (Desideratum #2) if it values objective goods too highly over experience. |

  ### Summary of the Structural Result
  The Experience Machine, when treated as a structural stress test rather than a single puzzle, demonstrates that **Pure Mental State Theories are untenable** for a general audience, but **Pure Externalist Theories are inhumane**. The unsatisfiable subset (Reality + Resonance + Monism) dictates that the only viable path forward is a **Pluralistic Hybrid Theory** that accepts a weighted trade-off between how life *feels* and how life *is*, constrained by empirical data on adaptation. Any theory that refuses this hybridization fails the adequacy test.
