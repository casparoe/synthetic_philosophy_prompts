      5.  Suggest specific literature to engage with (Goldberg, Peet, MacFarlane, Kukla).
      6.  Conclusion: Keep the framing, but ground it in "accountability" rather than just "cost."

  9.  (Final check of the prompt's specific question): "Which part of my framing has to go?"
      *   Answer: Don't throw the framing away, but discard the idea that the *norms are* the profiles. Instead, the norms *entail* the profiles. Also, refine the ranking of the Truth Norm.

      *Wait, one more thing:* The user asks if treating them as *incommensurable* exposure profiles is a mistake. If they are answers to different questions about risk distribution, they *are* commensurable on that axis. So the "incommensurable" label might be the part to drop.

