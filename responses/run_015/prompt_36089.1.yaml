answer: |-
  **MEMORANDUM**

  **TO:** Graduate Studies Committee
  **FROM:** Chair, Graduate Studies Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation on AI-Assisted Proof Submissions in Graduate Coursework

  **1. Purpose and Context**

  This memo addresses a gap in our department's academic integrity policy regarding the use of Artificial Intelligence (AI) tools in graduate mathematics coursework. Current rules prohibit submitting "work that is not their own," but this language was drafted for plagiarism and contract cheating, not for iterative, generative AI collaboration.

  The urgency of this policy is driven by the "oracular case": a scenario where a student submits a correct proof generated through AI interaction, verifies the steps logically, yet cannot reproduce the reasoning or the construction independently when questioned. As evidenced by the recent incident in the Model Theory course, our current framework cannot adjudicate this situation. The student was not dishonest by traditional definitions, yet the submission failed to demonstrate the learning outcomes the course is designed to assess.

  **2. The Core Question: Honesty, Learning, or Labor?**

  We must categorize the oracular case to determine the appropriate policy response.

  *   **Is it a failure of honesty?** No. In the precedent case, the student was transparent about the tool's use and verified the steps. There was no intent to deceive regarding authorship.
  *   **Is it an acceptable division of cognitive labor?** In professional research, yes. We rely on computer-assisted proofs (e.g., Kepler Conjecture) and massive collaborative results (e.g., Classification of Finite Simple Groups) that no single individual fully verifies from scratch. We accept these based on community trust and specialized verification.
  *   **Is it a failure of learning?** Yes. This is the critical distinction. Graduate *coursework* is not research publication. Its primary objective is the internalization of reasoning capabilities by the individual student. When a student treats an AI as an oracle they cannot interrogate, they have outsourced the cognitive struggle required to build mathematical maturity.

  Therefore, the committee should classify the oracular case in coursework as a **failure of learning**. The degree certifies that the holder possesses specific reasoning capabilities, not merely that they can curate correct arguments.

  **3. Evaluation of Proposals**

  We considered three distinct approaches. To ensure a robust decision, I have outlined the strongest argument for each, including those I do not recommend.

  *   **Proposal 1: Prohibition.**
      *   *The Argument:* Mathematics is a "mental gym." Just as we do not allow calculators in basic algebra to ensure arithmetic fluency, we should not allow AI in graduate proofs to ensure logical fluency. Allowing AI risks atrophy of the very intuition we are paid to develop. Prohibition is the only way to guarantee that the cognitive load remains on the student.
      *   *The Flaw:* Enforcement is nearly impossible without invasive detection tools (which are unreliable) or constant surveillance. Furthermore, it ignores the reality of modern research, where AI will inevitably be a partner. Banning it in coursework creates a false dichotomy between "school math" and "real math."

  *   **Proposal 2: Disclosure Regime.**
      *   *The Argument:* Transparency is the bedrock of academic integrity. If we permit the tool, we must require citation, similar to software or data usage in experimental sciences. This normalizes the tool while allowing instructors to adjust grading weights based on the level of assistance.
      *   *The Flaw:* Disclosure alone does not solve the oracular case. A student can disclose "AI generated this proof" and still fail to understand it. This policy manages the *record* of the work but does not verify the *competence* of the student.

  *   **Proposal 3: Reconstructability Standard.**
      *   *The Argument:* The medium of discovery is irrelevant; the capacity for explanation is paramount. This aligns with our existing oral qualifier traditions. It permits students to use any tool to *find* a solution, provided they can *own* the solution subsequently. It treats AI as a scaffold to be removed, not a crutch to be kept.
      *   *The Flaw:* It increases faculty workload. Conducting "reconstruction defenses" requires time and scheduling logistics that exceed standard grading.

  **4. Recommendation**

  I recommend the committee adopt **Proposal 3 (The Reconstructability Standard)**, implemented with a mandatory component of Proposal 2 (Disclosure).

  **Rationale:** This hybrid approach acknowledges the inevitability of AI tools while protecting the pedagogical integrity of the degree. It shifts the focus from policing *process* (which is opaque) to assessing *competency* (which is observable). It draws the necessary line between research (where collective verification suffices) and coursework (where individual verification is the goal).

  **5. Implementation Sketch**

  *   **Policy Statement:** Students may use AI tools to explore problems or debug reasoning. However, all submitted work must be accompanied by a disclosure statement indicating AI usage. Crucially, students must be prepared to re-derive or explain any part of their submission in an oral setting without aid.
  *   **Affected Parties:** All PhD students enrolled in 500-level or higher mathematics courses. (Masters students may be exempted pending separate review).
  *   **Enforcement Mechanism:** Instructors will randomly select 10-20% of submissions for "reconstruction defense" each semester. This may be done during office hours or dedicated assessment weeks. Failure to reconstruct the argument results in a grade reduction for that assignment, regardless of the written proof's correctness.
  *   **Timeline:** Policy effective for the Fall Semester of the upcoming academic year.
  *   **Review:** The Graduate Studies Committee will review the policy's impact at the end of the first academic year of implementation. We will assess faculty workload, student performance metrics, and any unintended chilling effects on tool experimentation.

  **6. Conclusion**

  We cannot ban the future of our discipline, but we must not certify competence we have not verified. By adopting the Reconstructability Standard, we affirm that a proof is not merely a string of true statements, but a chain of reasoning that the mathematician must hold in their own mind.

  ***

