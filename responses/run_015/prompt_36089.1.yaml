  *(Self-Correction on Recommendation)*: I need to make sure I explicitly choose one or a hybrid. I will choose the Hybrid (Disclosure + Reconstructability) as it mitigates the weaknesses of 3 alone. Actually, the prompt asks to recommend one (or a defensible hybrid). I will frame it as "The Reconstructability Standard" but note that disclosure is a prerequisite component of that standard. To keep the JSON simple, I will label the recommendation clearly.

