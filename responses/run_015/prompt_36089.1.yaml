      *   *Decision:* Option 3 is the strongest pedagogically, though hardest to administer. It reframes the issue from "cheating" to "competency." It respects the tool while protecting the degree's value. I will recommend a hybrid of 2 and 3: Disclosure + Reconstructability. This ensures transparency *and* verifies understanding.

