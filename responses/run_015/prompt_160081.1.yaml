prompt: |-
  ok so my friend Priya and I got into a genuinely long argument last night and I don't want someone to settle it, I want someone to settle what we were even arguing about. Her mom was just diagnosed with early-stage Alzheimer's and is going to a lawyer about an advance directive, and Priya is all the way on the side of: whatever her mom writes now has to bind the person her mom becomes, that IS the whole point of the thing, otherwise you're just letting the disease do the rewriting. I kept throwing cases at her where that feels obviously wrong and we went around in circles for two hours without ever stopping to ask what we were each demanding a theory of this even do. So please: you're a professional philosopher who works on personal identity and practical rationality — brainstorm the space of cases for a minute before you write anything, and don't just hand me the familiar four principles, I've read those.

  What I want is the spec. Concretely: what does a theory of diachronic authority — a theory of when an earlier self's directive binds a later self, and when it doesn't — have to deliver to be good enough to actually adjudicate a live dispute in a hospital room, where there's a current patient refusing something, a piece of paper saying she wanted it, and a surrogate standing there? Give me the requirements, each with the case or consideration behind it. I'll seed the case list so you know the territory I mean, but add ones I've missed: the standard dementia patient who now seems content and says she wants to live; the person whose values changed through something transformative (a conversion, a transition, becoming a parent) and who now says the earlier self didn't know what she was talking about; the request made in an obviously temporary state (acute pain, fresh grief, mania, week one of withdrawal); and two we invented that broke us — the cycling self, whose values swing every few months so there's no single "later" self to defer to and the answer depends on when you happen to ask, and the archival-self adjudicator, a model trained on everything she ever wrote or decided, which is asked whether her current refusal is a stable value change or a passing state. Say what must not be collapsed while you're at it: identity versus authority, the earlier self merely being better placed (calmer, better informed about which decision procedure to use) versus the earlier self having the right to settle it, directives about outcomes versus directives about who or what gets to decide later, the later self's experience versus the later self's judgment, waiving versus committing, and whether a directive can authorize something it would be wrong to do to her later. For each requirement tell me whether it's non-negotiable or a prejudice of one camp, flag any subset you think can't be jointly satisfied (that's the part I care most about), and tell me which single requirement does the most work at knocking views out.

  Format: a markdown table, one row per requirement, columns exactly id | requirement | motivating_case | status (non-negotiable or camp-preference) | what_it_excludes | conflicts_with (ids of other rows it can't be jointly satisfied with). Under the table, four to six lines max on which requirement is most exclusionary, which subset is unsatisfiable and why, and a very short scorecard for the three views we kept circling back to: the self-governance one (the earlier act of authoring is what makes it binding), the continuity one (identity isn't what matters, what matters is psychological and value continuity), and the procedural one (no temporal stage has authority, hand it to a surrogate, a process, or the adjudicator). Then a tiny JSON object with these fields: most_exclusionary (an id), unsatisfiable_subset (array of ids), and verdict_on_our_case — an object with adjudicator_legitimacy (one line on what, if anything, makes the archival-self model authorized) and cycling_self (one line on what a theory should even say when there's no unified later self). No citations or reading recommendations, we can't look anything up from here anyway.
