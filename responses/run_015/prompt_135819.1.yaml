answer: |-
  Welcome, everyone. To the logicians in the room: you know the terrain. To the journalists and policy students: you know the stakes. We are here to discuss truth and trust, but I want to begin by marking a boundary around what we can possibly achieve this weekend.

  In semantics, we often study the Liar Paradox: "This sentence is false." It creates a crash in the system. But in institutions, the paradox is more dangerous because it wears a suit. Consider this variant I've been working on: Imagine a self-certifying authority that issues a single foundational claim: "Every statement endorsed by this body is true." Then, the body officially endorses that very claim.

  For the logicians, this triggers Tarski's undefinability theorem. An institution cannot contain its own truth predicate without risking inconsistency. If the body is fallible—and all human bodies are—then the claim "Everything we say is true" is itself false. But since the body endorsed it, the body has endorsed a falsehood. The system collapses under its own weight.

  For the non-logicians, translate this into power. Imagine a government agency or a newsroom that declares, "We never lie," and treats that declaration as beyond scrutiny. If they make even one mistake, their foundational claim is broken. But because they claim infallibility, they cannot admit the mistake without destroying their authority. So, they hide it. Trust evaporates not because errors occur, but because the institution claims it cannot err.

  This logical loop imposes a structural constraint on me as your opening speaker. I cannot promise you that this workshop will produce a definitive, self-certifying theory of truth. To make that promise would be to replicate the paradox. It would be to stand before you as an authority claiming that "Everything concluded in this room is the final word." If we are wrong—even slightly—that claim becomes a lie. If we are right, we have no way to prove it from within these walls.

  So, we must abandon the comfort of certainty. The logicians cannot retreat into formal systems that ignore social reality. The policy students cannot rely on institutional prestige to validate facts. Instead, we are constrained to a fallibilist framing. Our work must be iterative. We are not building a monument to Truth; we are building a mechanism for error-correction.

  Trust, then, is not the belief that an institution is infallible. Trust is the confidence that an institution can survive being proven wrong. Our goal this weekend is not to certify our own conclusions, but to expose them to enough friction that they might hold weight outside this room.

  We cannot solve the liar paradox. But we can refuse to become it. Let's get to work.

