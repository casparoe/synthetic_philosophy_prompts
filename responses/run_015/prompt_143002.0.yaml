answer: |-
  To: Practice Review Panel Chair
  From: Ethics Advisory Consultant
  Re: Decision Procedure Based on Montaigne's *Of the Cannibals*

  You asked for a procedure grounded in Montaigne's argument rather than generic slogans. To build this, I first audited his essay to separate philosophical insights from historical baggage.

  **What We Keep:**
  1.  **The Anti-Projection Move:** We must assume our initial shock is often just cultural reflex. We need a mechanism to strip away our own framing before judging.
  2.  **The Universal Vice Criterion:** Difference is not deviance. We only oppose practices that involve universal vices (cruelty, treachery, gratuitous suffering), not merely those that look strange.
  3.  **The Comparative Test:** We must check if we tolerate equivalent harms at home before condemning them abroad.
  4.  **Epistemic Modesty:** We admit our information is always incomplete. If we cannot verify the facts, we cannot condemn.

  **What We Discard:**
  1.  **The State of Nature:** Montaigne uses "natural law" as a baseline. We cannot. We will use "minimization of harm" instead.
  2.  **The Single Eyewitness:** Montaigne trusted one servant's story. We will require triangulated sources.
  3.  **Irony and Literary Framing:** Montaigne writes to provoke. We write to decide. Our language must be plain to avoid misinterpretation in donor reports.

  Below is the procedure derived from these moves. It is designed to fit your six-week constraint and three-person panel.

  ***

  ### The Practice Review Protocol (Montaigne Framework)

  **Step 1: The Description and Substitution Test**
  *   **Who:** Regional Programme Officer (RPO) drafts; Anthropologist (ANT) reviews.
  *   **Task:** Write a one-page description of the practice. Then, apply the **Substitution Test**: Rewrite the description replacing the local actors with actors from our own society (e.g., "confinement of a disturbed person" becomes "involuntary psychiatric commitment").
  *   **Sufficiency:** The description must be accepted by at least one local partner staff member as accurate *and* the Substitution Test must not change the moral valence of the act.
  *   **Timeout/Stop Rule:** If the Substitution Test changes the verdict (e.g., from "abuse" to "therapy"), send back for reframing. If local partner staff strongly dispute the description, pause for two weeks to gather dissenting views. If unresolved, default to **Accommodate with Mitigation**.
  *   **Hard Case (Funding Bias):** If all testimony comes from paid beneficiaries, the ANT must interview one unpaid community member. If impossible, mark the file "High Epistemic Risk."

  **Step 2: The Universal Vice Assessment**
  *   **Who:** Panel Chair (YOU) leads; ANT advises.
  *   **Task:** Determine if the practice involves **Cruelty** (infliction of severe, unnecessary suffering) or **Treachery** (betrayal of trust or consent).
  *   **Sufficiency:** Evidence of physical or psychological harm that exceeds what is legally or culturally tolerated in our own jurisdiction for equivalent cases.
  *   **Timeout/Stop Rule:** If harm is unverified or anecdotal within six weeks, default to **Accommodate, No Action**.
  *   **Hard Case (Legality):** If the practice is illegal locally, note this, but do not let it decide the moral verdict. Proceed to Step 3.
  *   **Hard Case (Severity vs. Type):** If the practice is acceptable in type but abusive in specific instances (e.g., a ritual that becomes violent), classify as **Accommodate with Mitigation** (target the abuse, not the ritual).

  **Step 3: The Comparative and Consequence Check**
  *   **Who:** YOU and Executive Director (ED).
  *   **Task:** Apply the **Comparative Test**: Do we allow equivalent harm at home? Then assess **Backlash Risk**: Will public opposition make the practice a badge of identity and strengthen it?
  *   **Sufficiency:** If the practice is worse than our equivalent *and* opposition will not cause greater harm, proceed to Oppose. If opposition risks staff safety or program collapse, downgrade the response.
  *   **Handoff:** If the decision rests on a value judgment (e.g., "Is this suffering necessary?"), the ANT must sign off on the cultural context, and the ED must sign off on the risk.
  *   **Hard Case (Internal Contestation):** If the community is divided, we do not defer to authority alone. We weigh the harm to the vulnerable against the benefit to the powerful.

  **Step 4: The Verdict Matrix**
  *   **Accommodate, No Action:** No universal vice found; or facts unverified; or equivalent to accepted home practices.
  *   **Accommodate, Mitigation:** Vice found in execution, not type. (e.g., monitor safety).
  *   **Oppose Privately:** Universal vice confirmed, but public opposition causes backlash.
  *   **Oppose Publicly:** Universal vice confirmed, high confidence, low backlash risk.
  *   **Condition of Funding:** Universal vice confirmed, partner refuses change, program viability at risk. (Requires ED sign-off).

  ***

  ### Application to Current Cases

  **Case 1: Boarding School / Marriage at Sixteen**
  *   **Step 1 (Description):** Staff frame this as "child marriage." Substitution Test: In our jurisdiction, marriage at 16 requires parental consent or emancipation. Here, families consent, but girls lose school access if they marry.
  *   **Step 2 (Vice):** The marriage itself is not inherently treacherous if consensual, but the *coercion* (marry or leave school) is a harm. However, the harm of leaving school (loss of future agency) may exceed the harm of early marriage in this specific context.
  *   **Step 3 (Comparison/Consequence):** We allow 16-year-olds to work or marry with consent in some jurisdictions. Public opposition may force families to pull girls from school entirely to marry sooner.
  *   **Verdict:** **Accommodate with Mitigation.**
  *   **Reasoning:** We cannot oppose the marriage without destroying the education program. We will negotiate to keep girls in school post-marriage.
  *   **Panel Friction:** Some will argue this normalizes child marriage. The procedure dictates we prioritize the greater harm (loss of all education).

  **Case 2: Healing Practice / Confinement and Beating**
  *   **Step 1 (Description):** Staff frame this as "torture." Substitution Test: "Involuntary psychiatric commitment with aversion therapy." Local staff respect the practitioner; patients recover and reintegrate.
  *   **Step 2 (Vice):** Beating is a universal vice *unless* it is the only available therapeutic intervention and consent is retroactively validated by recovery. Evidence suggests recovery is common.
  *   **Step 3 (Comparison/Consequence):** We use restraint and medication in our own mental health crises, sometimes involuntarily. Public condemnation would destroy the only mental health resource in the region.
  *   **Verdict:** **Accommodate with Mitigation.**
  *   **Reasoning:** We monitor the severity of the beating. If it causes permanent injury, we switch to **Oppose Privately**.
  *   **Panel Friction:** The "beating" language is hard to stomach. The procedure forces us to look at the outcome (reintegration) rather than the shock of the method.

  **Case 3: Mortuary Rite / Consumption of Remains**
  *   **Step 1 (Description):** Field officer reports "cannibalism." Substitution Test: "Consuming a portion of a revered elder's remains" vs. "Desecrating a corpse." In our culture, we keep ashes or bones; they consume flesh. The intent is reverence, not nutrition or malice.
  *   **Step 2 (Vice):** There is no cruelty (the elder is dead) and no treachery (it is consensual family ritual). There is no universal vice here, only custom difference.
  *   **Step 3 (Comparison/Consequence):** Donor is horrified. However, public opposition will turn this into a resistance symbol. The practice is rare and symbolic.
  *   **Verdict:** **Accommodate, No Action.**
  *   **Reasoning:** This is the core Montaignean move. The horror lies in our framing ("cannibalism"), not the act itself. Condemning it gains us nothing morally and costs us the donor relationship.
  *   **Panel Friction:** **High.** This will cost money. The donor may pull out. The field officer's report was factually correct but morally framed. We must tell the donor that "cannibalism" is a loaded term for a mourning rite we do not prohibit. This verdict protects the partner but risks funding.

  ***

  ### Honest Limits of This Procedure

  You need to know where this tool breaks. I cannot give you a checklist for these; they require your personal judgment.

  1.  **Metaphysical Objectivity:** This procedure does not prove our judgments are "objectively correct." It only proves they are consistent and non-hypocritical. If you need to know if you are *truly* right in a cosmic sense, this form cannot answer that.
  2.  **Community Boundaries:** The procedure asks us to listen to the community. It cannot tell you *who* counts as the community. If a patriarch speaks for silenced women, the procedure might validate his view unless you actively seek dissent. You must decide when "culture" is just "power."
  3.  **Aggregation:** If a practice protects 90% of the community but destroys 10% (e.g., a caste system), the procedure flags the harm but does not calculate the trade-off. You must decide if minority harm vetoes majority benefit.
  4.  **Political Presence:** Montaigne assumes contact is already happening. This procedure cannot tell you if your NGO should be there at all. If your presence itself distorts the culture, no bucket will fix that.

  **Where the Montaignean Frame Fails:**
  Step 2 (Universal Vice) is the weak point. Montaigne assumes we agree on what "cruelty" is. We often do not. If the Panel disagrees on whether a specific pain counts as "cruelty," I recommend switching to a **Human Rights Framework** for that specific step only. Use international law as a tie-breaker, not as the primary driver.

  **Final Advice:**
  The hardest part of this procedure is Step 1. Your staff will resist the Substitution Test because it makes them complicit in things they find disgusting. Remind them: Montaigne did not eat the dead. He simply refused to call it barbarism without understanding why. Your job is not to adopt the practice, but to judge it fairly.

  If you run this protocol, you will lose some donors. You will also save some relationships that generic relativism would have destroyed. That is the trade.

  Let's schedule a run-through for next Tuesday.

  Best,
  Consultant
