  **The Classification of Drift**

  The air in Municipal Records Room 4B was stale, recycled through vents that hummed like tired bees. Simon, the committee chair, tapped his pen against Form 88-C. "Activity Name: Drift. Description: Participants walk without destination. If two participants cross paths, they match stride length for ten steps. No winner. No end time."

  "It's a game," Elias said, leaning back in his chair. He was the senior classifier, a man who looked like he'd been carved from old paperwork. "It has rules. Matching stride. Voluntary participation. It's separated from ordinary walking by that agreement."

  Mara shook her head. She was new to the committee, brought in for her background in logic. "Ordinary walking has rules too. Don't walk on the grass. Don't run indoors. 'Drift' lacks a goal. There is no state of affairs that constitutes winning. Without a lusory attitude—the willingness to overcome unnecessary obstacles for the sake of the activity—it's just loitering with extra steps."

  "It doesn't need winning," Elias countered. "Think of make-believe. Think of catch, where you just keep the ball in the air. What ties 'game' together isn't one thing. It's a network of similarities. Some have scores, some have rules, some have fun. 'Drift' shares enough threads with the rest of the rope to be part of the rope."

  "That's a metaphor, not a definition," Mara said, her voice tight. "If we can't state the necessary and sufficient conditions, we don't know what the word means. We're just pointing at things and saying 'like that.' Eventually, that breaks. If 'game' covers everything from chess to walking aimlessly, it covers nothing. There is a boundary. We just haven't found the right set of conditions to draw it yet. Maybe the condition is 'structured interaction.' Maybe it's 'fictional consequence.' But it exists."

  Simon looked between them. "The office needs a box checked. 'Game,' 'Sport,' or 'Hobby.' If I check 'Hobby,' it falls under Leisure Tax. If I check 'Game,' it's exempt. The stakeholders want exemption."

  "Then check 'Game'," Elias said. "Language works by use, not by essence. People call this a game. They organize tournaments. They keep records of longest drifts. The practice creates the meaning."

  "The practice creates confusion," Mara insisted. "You're arguing that because the usage is messy, the concept is messy. I'm arguing the usage is messy because we are ignorant of the underlying structure. If we classify this as a game, we dilute the category until it's useless for regulation. You're accepting vagueness as a feature. I'm saying it's a bug we haven't patched."

  Simon sighed. He looked at the form, then at the clock. The hum of the vents seemed to grow louder. He understood Elias's pragmatism; the world moved on whether definitions were perfect or not. But he felt the pull of Mara's rigor. If nothing had edges, how did anything hold shape?

  "Exempt," Simon said, checking the box for 'Game'.

  Elias nodded, satisfied. Mara gathered her papers, her expression unreadable. As they stood to leave, she paused at the door.

  "You can check the box, Simon," she said, not turning around. "But if 'game' means everything, then when you say 'no games in the lobby,' you haven't actually said anything at all. You've just made a noise."

  She left the room. Simon looked at the checkmark. It was dark and final, yet suddenly it looked very thin against the white paper.

  ***

  **Analytical Note**

  In interpreting Wittgenstein's notion of family resemblance, scholars distinguish between settled interpretations and ongoing metaphysical disputes. It is broadly accepted among Wittgensteinians that the absence of a single unifying feature across all instances of a concept (like "game") suggests we should not expect a classical definition. However, whether this absence implies genuine semantic indeterminacy or merely the inadequacy of our current descriptions remains contested. Essentialists argue that vagueness is epistemic—we lack the knowledge to find the boundary—while Wittgensteinians argue it is ontological—the boundary does not exist.

  Furthermore, there is debate over whether the claim that no necessary and sufficient conditions exist is a semantic claim about meaning or a methodological claim about how we should stop looking for essences. Some interpreters argue Wittgenstein was making a point about human psychology and inquiry (methodological), while others argue he was making a point about the nature of language itself (semantic).

  This story commits to the semantic indeterminacy view. Elias argues that the meaning of "game" is constituted by its use and overlapping similarities, not by hidden essences. Consequently, the committee's decision validates the concept's flexibility. However, the story flags the Essentialist counter-argument as credible. Mara's position—that vagueness renders regulation impossible—reflects a genuine philosophical objection still maintained by some contemporary metaphysicians and philosophers of sport. The story presents Elias's view as dominant for practical purposes, but it does not present the Essentialist view as definitively refuted, acknowledging that the demand for precision remains a live philosophical tension.
