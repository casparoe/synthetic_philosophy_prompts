prompt: |-
  You are a professional philosopher and senior advisor on institutional ethics, with deep familiarity in virtue theory and its empirical critics. Before drafting anything, please think carefully: begin by brainstorming the central philosophical tension—whether moral education and institutional blame presuppose cross-situationally stable character traits, or whether situation-sensitive psychology undermines that presupposition—then outline the strongest argument for each side, and only then compose the formal document.

  I serve on my university’s Honor Council, and this issue has recently become personally relevant after I studied the situationist critique of virtue ethics: the experimental literature suggesting that honest or dishonest behavior is driven more by situational features—time pressure, ambiguous instructions, peer norms—than by enduring dispositions. The Council must circulate a written opinion before Thursday’s meeting recommending a concrete course of action to the faculty senate. We are weighing a proposed revision to our disciplinary code that would replace our current character-based sanction framework—under which a finding of “academic dishonesty” is recorded as a stable moral failure—with a situation-responsive remediation protocol. This protocol would require a contextual-pressure assessment (examining environmental variables before assigning blame) and would calibrate sanctions to situational severity rather than to an inferred vicious character.

  Advocates argue that if virtues lack robust cross-situational stability, then punishing students for what amounts to environmental noise is both unfair and educationally self-defeating. Opponents respond that abandoning character attribution erodes institutional trust, weakens the signaling function of sanctions, and contradicts the university’s mission to cultivate stable moral habits through accountability.

  Please draft the memo I will circulate. It should recommend one specific, actionable path—either adopting the revision with a defined pilot timeline and evaluation criteria, or retaining the current framework supplemented by an explicit safeguard—and it should include reasoning that treats the strongest consideration on the losing side with genuine seriousness rather than dismissal. Do not provide a bibliography, reading list, or citation requests. Write in a formal, polished register appropriate for circulation to a faculty senate.
