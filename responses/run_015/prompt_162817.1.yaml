answer: |-
  **MEMORANDUM**

  **TO:** Technical Staff
  **FROM:** [Your Name/Role]
  **SUBJECT:** Diagnosis of the Economic Unit's Argument on Long-Term Emissions Targets

  **1. Executive Summary**
  The argument provided by the Economics Unit is logically valid, but it rests on a substantive moral premise that is too narrow for public policy deliberation. Specifically, it relies on a "Narrow Person-Affecting" view of harm (Premise 1) and assumes this exhausts all grounds for moral objection (Premise 4). This leads to the conclusion that we owe nothing to future generations unless our actions make their specific lives worse than they would otherwise have been.

  This conclusion is untenable because it conflates *harm* (a comparative loss to a specific individual) with *wronging* (a violation of moral constraints or rights). We can reject the conclusion (6) without abandoning the demographic fact (2) or the requirement for a victim/rights breach (5). We do this by rejecting the inference in (4): a policy can violate the rights of future people even if it does not make those specific people comparatively worse off.

  **2. Diagnosis: Where the Argument Breaks**
  The argument breaks at the transition from **Premise (3)** to **Premise (4)**.

  *   **Premise (3)** establishes that future individuals are not *comparatively harmed* by our choice (because without the choice, they would not exist).
  *   **Premise (4)** claims that because they are not comparatively harmed, there is "no way in which a policy could be bad for the people who live under it."

  This step is the error. It assumes that the only way a policy can be "bad for" or "objectionable to" a person is by lowering their welfare relative to their specific alternative. This ignores the **Rights Clause in Premise (5)**.

  The colleague's argument implicitly assumes that rights are only violated when a specific person is made worse off than they would otherwise be. However, moral rights can be understood as constraints on *what we may do to people*, regardless of whether those people are made comparatively worse off.

  **3. The Repair: Rights Without Comparative Harm**
  To fix the argument while respecting your preferences (keeping the demographic fact and avoiding pure aggregation), we should adopt the following modification:

  **Reject the inference in (4).** Accept that a policy can violate a person's rights even if that person owes their existence to the policy.

  *   **Why this works:** It distinguishes between a *right to existence* and a *right to conditions of existence*. Future people do not have a right to be born (which would make any birth control a rights violation). But they do have a right, once they are conceived, to inherit a world that meets basic standards of habitability and justice.
  *   **Application to the Argument:**
      *   **Keep (2):** Yes, policies change who exists.
      *   **Keep (5):** Yes, a choice without a victim or rights breach is not objectionable.
      *   **Modify (1) & (4):** A policy creates a "victim" in the moral sense if it violates their rights, even if it doesn't lower their welfare compared to non-existence.

  **4. Addressing Your Specific Concerns**
  This repair resolves the four absurdities you identified without resorting to the "repairs" you found unsatisfactory.

  *   **(i) Historical Injustices:** Under the colleague's view, descendants of slavery cannot claim harm because they wouldn't exist without the historical events. Under the **Rights Repair**, the injustice is not that the descendants are worse off than they would have been; the injustice is that their ancestors were treated in a way that violated their rights, and the *structural conditions* resulting from that violation persist. The current policy can be objectionable if it perpetuates rights-violating structures, regardless of the specific identities of the victims.
  *   **(ii) The Toxin Case:** Your colleague admits a firm wrongs no one by conceiving disabled children if their lives are worth living. The Rights Repair says the firm *does* wrong the child. It violates the child's right to a baseline of health, even if the alternative was non-existence. This matches your intuition that the firm's behavior is objectionable without requiring us to say the child is "worse off" than a ghost.
  *   **(iii) The Cliff-Edge:** The colleague's view creates a cliff between "lives worth living" and "lives not worth living." The Rights Repair replaces this with a threshold of **Decency or Justice**. We do not need to locate the precise line where life becomes not worth living. We need to locate the line where environmental conditions violate the rights of inhabitants (e.g., inability to secure food, safety, or health). This gives you a stable basis for a target: set emissions to ensure the future world remains above the *rights threshold*, not just above the *suicide threshold*.
  *   **(iv) The Epistemic Problem:** You worry that we cannot verify conception dates. The Rights Repair removes this burden. We do not need to know *who* will exist to know *that* people will exist. We owe duties to the *class* of future inhabitants. Just as a builder owes a duty to "whoever lives in this house" to ensure the roof doesn't collapse, we owe a duty to "whoever lives in this century" to ensure the climate doesn't collapse. The duty attaches to the *slot*, not the *person*.

  **5. Implications for the Emissions Target**
  Does this narrower conclusion still do the work required for your recommendation? **Yes.**

  1.  **It avoids Aggregation:** You are not summing total welfare across generations (which you and the colleague reject). You are setting a **constraint**. The target is the maximum emissions level compatible with respecting the rights of future persons to a habitable environment.
  2.  **It avoids the "Morally Inert" Conclusion:** Benefits and costs beyond 80 years are not inert. They are morally salient because they determine whether the rights of future people are respected.
  3.  **It provides a Selection Mechanism:** When choosing between two numbers, you do not choose the one that maximizes total happiness. You choose the one that keeps the probability of rights-violation (e.g., catastrophic warming) below an acceptable risk threshold.

  **6. Recommended Wording for the Memo**
  I recommend we respond to the Economics Unit as follows:

  > "We accept the demographic premise that policy choices affect the identity of future persons (Premise 2). However, we reject the inference that this renders future interests morally inert (Conclusion 6).
  >
  > Moral objectionability (Premise 5) arises not only from comparative harm to specific individuals (Premise 1) but also from the violation of rights owed to persons irrespective of their specific identity. Future generations hold a right to inherit environmental conditions that do not preclude a decent human life.
  >
  > Therefore, a policy is objectionable if it creates a high risk of violating these rights, even if the specific individuals who suffer would not have existed under a cleaner regime. Our target must be set to ensure these rights are secured, not merely to maximize welfare for the currently living."

  **7. Conclusion**
  The colleague's argument is a classic philosophical puzzle (the Non-Identity Problem), but it is not a binding constraint on policy. It fails because it defines "wronging" too narrowly as "comparatively harming." By recognizing that we can wrong people by imposing unacceptable conditions on their existence—even if we are also the cause of their existence—we can justify a long-term target without relying on impersonal aggregation or denying demographic reality.

  You should proceed with the target recommendation based on the **rights/constraint model**, not the **comparative welfare model**.
