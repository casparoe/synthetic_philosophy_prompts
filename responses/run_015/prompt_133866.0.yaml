answer: |-
  # Diagnostic Instrument: Hard Choices and Incommensurable Goods
  **Seminar Handout | Practical Reason & Resource Allocation**

  ### The Anchor Dilemma
  A municipal council holds a fixed budget surplus. Two proposals are on the table, and only one can be funded.
  *   **Option A (Cultural):** Restore an irreplaceable historic archive destroyed by fire. If not funded now, the physical site will be lost forever, erasing a specific community identity.
  *   **Option B (Medical):** Fund a one-time intervention for a rare, fatal condition affecting a small cohort. If not funded now, these patients will die prematurely.
  *   **Constraint:** Both involve irreversible loss. Neither value can be fully reduced to the other. You cannot split the funds.

  ---

  ### The Decision Tree
  *Follow the path that matches your intuitive judgment about the **structure of the reasoning** required to solve this dilemma. Do not select based on philosophical labels.*

  **1. The Nature of the Conflict**
  When you consider the archive against the medical intervention, is the difficulty in choosing due to:
  *   **(A) Moderate Incommensurability:** There is no single quantitative scale (e.g., "utils"), but it is still possible to make a true comparative judgment (e.g., "in this context, saving lives is more urgent") prior to the choice?
      *   *Go to Question 2.*
  *   **(B) Radical Incommensurability:** The values operate in entirely distinct normative languages (e.g., "sanctity" vs. "efficiency") such that no comparative judgment is possible *before* the choice is made?
      *   *Go to Question 3.*

  **2. The Requirement of Reason (Moderate Path)**
  If a comparative judgment is possible, does practical reason **require** you to identify one option as the single correct choice?
  *   **(A) Yes:** Rationality demands a maximizing answer; choosing the "less good" option is an error.
      *   *Go to Question 4.*
  *   **(B) No:** Rationality permits "satisficing" or underdetermination; both options are rationally permissible, even if one seems slightly better.
      *   *Go to Question 5.*

  **3. The Requirement of Reason (Radical Path)**
  If no comparative judgment is possible, how is the choice legitimized?
  *   **(A) Pre-existing Priority:** A higher-order rule dictates that one type of value (e.g., Life) always overrides the other (e.g., Heritage) regardless of context.
      *   *Go to Leaf 1 (Lexical Absolutism).*
  *   **(B) Creative Will:** The choice itself creates the reason; there is no prior fact about which is better.
      *   *Go to Question 5.*

  **4. The Source of Authority (Moderate + Resolution)**
  If reason requires a single correct choice, what determines it?
  *   **(A) First-Order Valuation:** The specific weights of the lives and the history in *this* case determine the outcome.
      *   *Go to Question 6.*
  *   **(B) Institutional Procedure:** A secondary rule (e.g., democratic vote, lottery, seniority) legitimately substitutes for first-order valuation to break the tie.
      *   *Go to Leaf 2 (Procedural Mediation).*

  **5. The Status of the Unchosen (Underdetermination / Will)**
  If reason does not dictate a single answer (or the will creates the reason), does the unchosen option leave a moral trace?
  *   **(A) No Residue:** Since the choice was rationally permissible (or created its own reason), there is no remaining moral cost or obligation to mourn the loss.
      *   *Go to Leaf 3 (Rational Indeterminacy).*
  *   **(B) Tragic Residue:** Even though the choice was permissible, the loss of the unchosen good imposes a continuing moral cost (regret, duty to compensate, obligation to mourn).
      *   *Go to Leaf 4 (Existential Voluntarism).*

  **6. The Phenomenology of Loss (Moderate + Resolution + First-Order)**
  If reason identifies the better option based on values, does the value of the *unchosen* option vanish upon choice?
  *   **(A) No Residue:** The "better" judgment fully compensates for the loss; the unchosen option imposes no further moral demand.
      *   *Go to Leaf 5 (Harmonistic Particularism).*
  *   **(B) Tragic Residue:** The "better" judgment justifies the act, but the loss of the unchosen good remains a moral wound that cannot be fully cancelled.
      *   *Go to Leaf 6 (Tragic Realism).*

  ---

  ### Taxonomy of Positions (Leaves)

  **Leaf 1: Lexical Absolutism**
  *   **Defining Claim:** One value category (e.g., life) categorically overrides the other (e.g., culture) in all instances, rendering comparison unnecessary.
  *   **Awkward Commitment:** Must defend why one value always dominates regardless of magnitude (e.g., why one life saved always trumps the total erasure of a civilization's history).

  **Leaf 2: Procedural Mediation**
  *   **Defining Claim:** When first-order values conflict, institutional rules (votes, lotteries) legitimately decide the outcome without needing to resolve the moral conflict substantively.
  *   **Awkward Commitment:** Risks masking substantive moral loss behind bureaucratic form, potentially legitimizing moral avoidance through process.

  **Leaf 3: Rational Indeterminacy**
  *   **Defining Claim:** In hard choices, reason permits either option without a fact of the matter regarding which is better, and no moral cost remains.
  *   **Awkward Commitment:** Implies the unchosen value was not truly binding, making it difficult to criticize agents who choose selfishly under the guise of "indeterminacy."

  **Leaf 4: Existential Voluntarism**
  *   **Defining Claim:** The agent's will chooses without prior rational grounding, incurring unavoidable guilt or residue for the unchosen path.
  *   **Awkward Commitment:** Offers no guidance for future similar cases and romanticizes anguish without providing normative traction for policy.

  **Leaf 5: Harmonistic Particularism**
  *   **Defining Claim:** Context allows for rational weighing that identifies a single best option which fully resolves the normative conflict without remainder.
  *   **Awkward Commitment:** Denies the phenomenological reality of tragic loss, suggesting deep moral conflicts are merely data-processing errors.

  **Leaf 6: Tragic Realism**
  *   **Defining Claim:** Reason can identify the better option, but the loss of the unchosen good remains a genuine moral cost that persists after the choice.
  *   **Awkward Commitment:** Requires acting against a recognized moral cost (the "wound") while acknowledging it, creating a permanent tension in agency.

  ---

  ### Meta-Analysis: Gaps and Indistinctions

  **1. Indistinguishable Pair: Tragic Realism (Leaf 6) vs. Existential Voluntarism (Leaf 4)**
  *   **Diagnosis:** While theoretically distinct (one posits a fact of the matter, the other denies it), these positions are practically indistinguishable in the weeds. Both require the agent to make a choice while acknowledging a persistent moral cost or regret. In a budget allocation scenario, both positions result in the same behavior: fund the priority, but allocate resources for mourning or compensation. The tree separates them based on metaphysics (does a "better" fact exist?), but not based on practical output.

  **2. Unexplored Coherent Combination: Radical Incommensurability + Resolution + Procedural + No Residue**
  *   **Diagnosis:** This combination (Radical values + Rule decides + No moral loss) appears unoccupied.
  *   **Reason for Gap:** **Incoherence.** If values are *radically* incommensurable, the loss of one is a loss of a distinct normative language. A procedure (like a vote) might decide *which* loss occurs, but it cannot logically negate the *reality* of the loss without denying the initial premise that the unchosen good was valuable. To claim "No Residue" here implies the procedure magically dissolves the value of the unchosen option, which contradicts the setup of a "hard choice" between goods.

  **3. Unexplored Coherent Combination: Moderate Incommensurability + Underdetermination + Procedural + Residue**
  *   **Diagnosis:** This combination (Comparison possible + Reason doesn't dictate + Rule decides + Moral loss remains) is theoretically coherent but rarely defended as a distinct position.
  *   **Reason for Gap:** **Neglect / Redundancy.** This view collapses into **Procedural Mediation (Leaf 2)** in practice. If a procedure is invoked to break a tie where reason is underdetermined, the "Residue" question usually depends on whether the procedure is seen as *constitutive* of the value (no residue) or *substitutive* for the value (residue). Most proceduralists accept the residue to avoid the charge of bureaucracy masking moral loss, making this effectively a sub-variant of Leaf 2.
