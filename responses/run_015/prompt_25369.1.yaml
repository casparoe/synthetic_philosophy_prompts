      *   *Claim 5:* "This is why Quine is considered the father of naturalized epistemology: he showed that epistemology can't be done from the armchair and has to be continuous with empirical science." -> **RED FLAG.** This is the user's main suspicion. "Two Dogmas" (1951) vs. "Epistemology Naturalized" (1969).

