prompt: |-
  I'm in this philosophy of language seminar and we just got to Quine, and I'll be honest — I read "Two Dogmas" twice and I'm still not sure I could explain the argument to someone at a party. So I did what any reasonable person does and googled it. I found this summary on a site that does "key ideas" explainers for philosophy papers (my friend who's a grad student says the site is hit-or-miss, sometimes great, sometimes subtly wrong in ways that matter). Here's the paragraph I've been staring at:

  "Quine's 'Two Dogmas of Empiricism' argues that the distinction between analytic and synthetic truths is a myth. Analytic truths are supposed to be true purely in virtue of meaning — like 'all bachelors are unmarried' — while synthetic truths depend on facts about the world. Quine's argument is that any attempt to define 'analytic' ends up circular: you define it in terms of synonymy, synonymy in terms of definition, and definition in terms of analyticity, so the whole thing is a closed loop with no independent grounding. His conclusion is that there's no principled difference between changing your mind about 'all bachelors are unmarried' and changing your mind about 'there are brick houses on Elm Street' — both are just revisions to your overall web of belief, and you could in principle hold onto either one in the face of any experience if you're willing to adjust enough elsewhere. This is why Quine is considered the father of naturalized epistemology: he showed that epistemology can't be done from the armchair and has to be continuous with empirical science."

  I'm supposed to write a response paper on Two Dogmas and I was going to lean on this summary pretty heavily, but something about it bothers me. The jump from "no sharp analytic-synthetic line" to "epistemology must be naturalized" feels like a whole extra step that the summary just asserts without argument. And the claim that there's no principled difference at all between revising a definition and revising an empirical belief — is that really what Quine says, or is the summary overreading the holism? I'm not confident enough in my own reading to call it either way. Can you go through this claim by claim and tell me what a Quine scholar would nod at, what they'd wince at, and whether the naturalized epistemology conclusion is actually supported by anything in the paper itself, or if the summary is smuggling in a later Quine under the same banner?
