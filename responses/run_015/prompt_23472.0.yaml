prompt: |-
  I've got a churn model at work that's pretty well calibarated, so when it spits out something like "10% chance this user cancels" I usually just trust it. But one user it scored at 10% just filed a really angry support ticket an hour ago, and my gut says their odds of churning are way higher right now. A teammate says I should stop second-guessing the model and just use the 10% since its calibrated. But what if the model doesn't even have access to support tickets? I feel like there's a real difference between those two cases and I can't articulate what it is. How do I decide whether to go with the model's number or update it based on what I'm seeing?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user has a well-calibrated churn model (e.g., 10% score $\approx$ 10% actual churn rate).
      *   **Situation:** A specific user got a 10% score, *but* just filed an angry support ticket.
      *   **Conflict:** The user's intuition says churn risk is now much higher. A teammate says "trust the model, it's calibrated."
      *   **Key Insight:** The user suspects the model *might not* include support ticket data as a feature.
      *   **Goal:** How to decide whether to trust the model score or manually adjust it based on new information (the ticket)? How to articulate the difference between the two cases?

  2.  **Deconstruct the Core Statistical/ML Concept:**
      *   **Calibration:** Calibration means $P(\text{Churn} | \text{Score} = 0.1) = 0.1$. It holds *on average* over the population the model was trained on.
      *   **Conditional Probability:** The model outputs $P(\text{Churn} | X_{\text{model}})$. The user wants to know $P(\text{Churn} | X_{\text{model}}, \text{Angry Ticket})$.
      *   **Information Set:** The crux of the issue is *what information* the model has seen vs. what information the human has now.
      *   **Concept:** This is about *Bayesian Updating* or *Residual Analysis*. If the new information (ticket) was *not* in the model's feature set ($X_{\text{model}}$), the model's probability is conditional on less information than the human possesses.

  3.  **Evaluate the Teammate's Argument:**
      *   "Stop second-guessing, just use the 10%."
      *   *Valid if:* The model includes real-time support sentiment/ticket data.
      *   *Invalid if:* The model only uses historical/demographic/usage data and ignores support interactions.
      *   *Risk:* Blindly trusting a model when you have strictly more relevant information leads to suboptimal decisions.

  4.  **Evaluate the User's Intuition:**
      *   "Odds are way higher right now."
      *   *Valid if:* Angry tickets are strong predictors of churn (they usually are).
      *   *Valid if:* The model didn't know about the ticket when scoring.

  5.  **Formulate the Decision Framework:**
      *   I need to help the user articulate *why* they might be right.
      *   I need to provide a concrete way to check the model's feature set.
      *   I need to explain the concept of "Conditional Probability" simply.
      *   I need to suggest a process for handling this (not just a one-off fix).

  6.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Start by validating the user. Their intuition is statistically sound. The teammate is partially right but missing a crucial nuance.
      *   *The "Why":* Explain the difference between $P(\text{Churn} | \text{Model Features})$ and $P(\text{Churn} | \text{Model Features} + \text{Ticket})$. Use the "Weather Forecast" analogy (it's classic and effective).
      *   *The Check:* How to verify? Check the feature list. Check the latency (when was the score generated vs. when did the ticket arrive?).
      *   *The Solution:*
          1.  **Immediate:** If the model doesn't know, override (with documentation).
          2.  **Systemic:** Feed this data back into the model. This is "online learning" or just feature engineering.
          3.  **Process:** Create a "human-in-the-loop" protocol for edge cases.
      *   *Risk Management:* Warn about "overriding too much." If you override every 10% score, you break calibration. Only override on *new, strong signal*.

  7.  **Refining the Concepts:**
      *   *Term:* "Information Asymmetry."
      *   *Term:* "Stale Score."
      *   *Term:* "Feature Leakage" (wait, no, that's bad. We want feature *inclusion*).
      *   *Term:* "Bayesian Update." (Keep it simple though).
      *   *Analogy:* Medical diagnosis. Doctor gives risk based on blood test. Patient then gets into a car accident. Risk of death changes, even if blood test hasn't changed.

  8.  **Structuring the Advice:**
      *   **Direct Answer:** You are likely right, here's why.
      *   **The Core Concept:** Conditional Probability & Information Sets.
      *   **The Diagnostic:** 3 questions to ask (Features, Timing, Latency).
      *   **The Action Plan:** Short term (override) vs. Long term (retrain).
      *   **The Caveat:** Don't become the model.

  9.  **Self-Correction/Edge Case:**
      *   What if the model *does* include support tickets but they are batched weekly? Then the score is stale.
      *   What if the model includes tickets but this specific type of anger is new?
      *   Make sure to emphasize that calibration is a *population* metric, not an *individual* guarantee.

  10. **Final Polish:** Ensure tone is professional, empathetic to the workplace dynamic, and statistically accurate without being overly academic. (The resulting output matches the detailed response provided previously.)
answer: |-
  You are right to question this, and your intuition is statistically sound. Your teammate is relying on a correct definition of calibration but applying it to the wrong context.

  Here is the breakdown of why your gut is likely correct, how to articulate the difference to your team, and a framework for deciding when to override the model.

  ### 1. The Core Concept: Conditional Probability
  The disagreement comes down to **information sets**.

  *   **The Model's Output:** $P(\text{Churn} | \text{Model Features})$
      *   The model says: "Among all users who look like this *based on the data I was trained on*, 10% churn."
  *   **Your Reality:** $P(\text{Churn} | \text{Model Features} + \text{Angry Ticket})$
      *   You are asking: "Among all users who look like this *AND just screamed at support*, what is the churn rate?"

  If the model **does not** have support ticket data as a feature, its 10% score is mathematically incomplete. It is conditional on *less information* than you possess.

  **The Analogy:**
  Imagine a weather model says there is a 10% chance of rain today based on satellite data. But then you walk outside and see dark storm clouds directly overhead.
  *   **Teammate's view:** "The model is calibrated. Trust the 10%."
  *   **Your view:** "The model didn't see the clouds I'm seeing right now. The odds are higher."

  You are describing **Information Asymmetry**. You have access to a signal (the ticket) that the model does not.

  ### 2. The Diagnostic Checklist
  Before you override the score, run through these three questions to confirm your hypothesis:

  **A. Feature Check:**
  Does the model ingest support ticket data?
  *   *If No:* The model is blind to this event. Your override is justified.
  *   *If Yes:* Proceed to question B.

  **B. Latency Check:**
  Even if the model *uses* support data, how fresh is it?
  *   Many models are scored in batch jobs (e.g., once a night or once a week). If the model ran at 3:00 AM and the ticket came in at 2:00 PM, the score is **stale**. It represents the risk *before* the ticket, not *after*.

  **C. Signal Strength:**
  Is an "angry ticket" a known strong predictor?
  *   If historical data shows that users who file angry tickets churn at 60%, but the model scored them 10%, the model is missing a massive feature. This is a "residual" signal.

  ### 3. How to Decide: The Override Framework
  You shouldn't override the model every time you have a hunch, or you destroy the value of the calibration. Use this decision matrix:

  | Scenario | Model Data | Your Data | Decision |
  | :--- | :--- | :--- | :--- |
  | **1. Blind Spot** | No ticket data | Angry ticket | **Override.** The model is missing a key variable. |
  | **2. Stale Score** | Ticket data (batched) | New ticket (real-time) | **Override.** The probability mass has shifted since the score was generated. |
  | **3. Weak Signal** | No ticket data | Minor inquiry | **Trust Model.** Don't override on noise; calibration holds better on average. |
  | **4. Model Knows** | Real-time ticket data | Angry ticket | **Trust Model.** If the model sees this and still says 10%, your intuition might be biased by recency. |

  ### 4. How to Articulate This to Your Teammate
  Your teammate is worried about "model gambling"—where humans override scores based on bias, eventually making performance worse. You need to frame your override not as "second-guessing," but as **feature augmentation.**

  **Say this:**
  > "I agree that calibration matters. But calibration is conditional on the inputs the model sees. Since this model doesn't ingest real-time support sentiment, its 10% is $P(\text{Churn} | \text{Historical Data})$. I'm observing $P(\text{Churn} | \text{Historical Data} + \text{Crisis Event})$. If we don't account for the ticket, we are knowingly ignoring a high-correlation variable. I'm not breaking the model; I'm applying a business rule on top of it for edge cases it can't see."

  ### 5. The Long-Term Fix (Turning Intuition into Code)
  If you find yourself overriding the model often because of support tickets, that is a **feature engineering opportunity**, not a reason to keep overriding manually.

  1.  **Document the Override:** Log that you changed the risk from 10% to (say) 60% and why.
  2.  **Measure the Outcome:** Track if those overridden users actually churn.
  3.  **Retrain:** Work with data science to add "Recent Support Sentiment" or "Ticket Count (Last 24h)" as a feature.

  ### Summary
  *   **Trust the model** when it has the same information you do.
  *   **Trust your judgment** when you possess a strong, predictive signal that the model is structurally blind to (like real-time angry tickets).
  *   **Fix the system** so the model eventually learns what you know.

  In this specific case: **Update the risk.** An angry support ticket is a leading indicator of churn that likely outweighs the historical patterns the model captured. Just make sure you log *why* you did it so you can prove your teammate wrong (or right) later.
