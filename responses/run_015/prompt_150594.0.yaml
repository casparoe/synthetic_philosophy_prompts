answer: |-
  **Title:** The Indexical Turn: Why Indexical Presentism Collapses into Eternalism

  **Introduction**

  The traditional debate in the metaphysics of time is often framed as a contest between Presentism and Eternalism. Presentism holds that only present entities exist; the past is gone and the future is not yet real. Eternalism holds that past, present, and future entities all exist equally; time is a dimension akin to space, forming a "block universe." This stalemate typically grinds on over two main issues: truthmakers for past-tense claims (if dinosaurs don't exist, what makes "there were dinosaurs" true?) and the conflict with Special Relativity (which denies a privileged global "now").

  Recently, a hybrid view has been proposed to break this deadlock: Indexical Presentism. This view suggests we drop the objective present but keep the presentist ontology by treating "now" as a context-sensitive indexical, much like "here." On this view, existence is not absolute but relative to a temporal context. "Dinosaurs exist" is false at our context but true at a Jurassic context. This promises to accommodate Relativity (no privileged slice) while retaining the linguistic feel of Presentism.

  In this essay, I will argue that Indexical Presentism is not a stable third option. It is Eternalism in disguise. By analyzing the truthmaker objection, the intuition of temporal passage, and the observational indistinguishability of the views, I will demonstrate that Indexical Presentism requires the very ontological commitments it seeks to avoid. Consequently, the dispute between Indexical Presentism and Eternalism is merely verbal, revealing that the core Presentism/Eternalism debate is substantive only if one insists on an absolute, non-indexical notion of existence that Relativity renders untenable.

  **The Truthmaker Objection: A Regress, Not a Solution**

  To evaluate Indexical Presentism, we must first understand the truthmaker principle. This principle states that for every true proposition, there must be something in reality that makes it true. Standard Presentism struggles here. If "There were dinosaurs" is true, but dinosaurs do not exist, what grounds this truth? Presentists often posit abstract surrogates (like "ersatz times"), but these are ontologically costly.

  Indexical Presentism claims to solve this by relativizing the truth. The proposition "There were dinosaurs" is shorthand for "At the past context $C$, dinosaurs exist." Since existence is relative to $C$, and dinosaurs exist relative to $C$, the truthmaker is simply the dinosaurs-at-$C$. No need for abstract surrogates; the dinosaurs themselves do the work, just at a different index.

  However, this solution merely pushes the truthmaker problem one level up. We must now ask: what makes it true *that* at context $C$, dinosaurs exist? For this higher-order statement to be true, there must be a truthmaker in our current ontology. There are only two options.

  First, the context $C$ (the Jurassic time) does not exist in any sense. If $C$ is nothing, then the statement "At $C$, dinosaurs exist" is about nothing. It lacks a truthmaker just as much as the original claim. You cannot ground a truth by referencing a non-entity, even if you call it a "context."

  Second, the context $C$ does exist in some sense. It must be a real component of reality that we can quantify over and refer to from our current position. But if the Jurassic context is a real part of the ontology, then we have admitted non-present entities into our inventory of what there is. We have conceded that the past is "there" to be referred to, even if we insist the dinosaurs within it only "exist" relative to that location.

  This reveals the fatal flaw. To make the indexical analysis work, the Indexical Presentist needs a manifold of times—a structure containing the Jurassic context, the present context, and future contexts. But a manifold of times is precisely what the Eternalist posits. The Indexical Presentist tries to have their cake and eat it too: they want the structure of the block universe to ground their truth claims, but they want to deny that the contents of that block "exist" simpliciter. This distinction cannot hold. If the context is real enough to make propositions true, the ontology is eternalist.

  **Passage and the Open Future**

  Perhaps the Indexical Presentist will concede the ontological point but argue that their view saves the *phenomenology* of time, which Eternalism destroys. Presentists are often motivated by the intuition of temporal passage: the feeling that time flows, and that the future is "open" in a way the past is not. Eternalism implies the future is already "there," fixed like a spatial location, which seems to threaten free will and the reality of change.

  Does Indexical Presentism save passage? It treats "now" like "here." Consider spatial indexicality. When I say, "Paris is not here," I do not mean Paris ceases to exist when I am in London. I mean Paris is not at my current spatial location. The spatial manifold is fixed; my location within it changes. If "now" works exactly like "here," then the temporal manifold is also fixed. The future is not "open" in the sense of being ontologically indeterminate; it is simply "not now," just as Paris is "not here."

  This removes the spine of Presentism. The Presentist wants to say the future *literally is not there*. The Indexical Presentist says the future *is there* (as a context), but we aren't in it. This is a crucial metaphysical difference. If the future context is real enough to be the referent of our thoughts and the ground of our truths, then the future is fixed. The "openness" is reduced to mere ignorance of which index we will occupy next, rather than a genuine ontological openness.

  Furthermore, if "now" is purely indexical, there is no metaphysical privilege to the present. In standard Presentism, the present is special because it is the only thing that exists. In Indexical Presentism, the present is special only in the trivial sense that "here" is special to the speaker. But "here" has no metaphysical weight; it is merely a coordinate. By adopting this view, the Indexical Presentist surrenders the idea that the present is metaphysically unique. They have saved the word "present" but killed the concept.

  **Distinguishability and the Verbal Dispute**

  We must now ask: is there any observation or argument that distinguishes Indexical Presentism from plain Eternalism?

  The Eternalist says: "All times exist. 'Now' picks out the time of utterance."
  The Indexical Presentist says: "Only the time of utterance exists (relative to itself). 'Now' picks out the time of utterance."

  In terms of the structure of reality, both agree there is a manifold of times. Both agree that Relativity prohibits a privileged global slice. Both agree that "There were dinosaurs" is true because of the relationship between our current context and the Jurassic context. The only remaining disagreement is over the application of the word "exists."

  The Eternalist applies "exists" to the whole manifold. The Indexical Presentist applies "exists" only to the slice indexed by "now." But since the Indexical Presentist admits the other slices are real enough to ground truth and support reference, this restriction on the word "exists" does no metaphysical work. It is a linguistic preference, not a disagreement about the furniture of the universe.

  This suggests the dispute is merely verbal. In metaphysics, a dispute is substantive if the parties disagree about the underlying structure of reality. If they agree on the structure (a four-dimensional manifold of events) but disagree on which parts get the label "real," they are talking past each other. The Indexical Presentist might insist, "But I deny the existence of the future!" The Eternalist replies, "You admit it is a real context that makes your statements true. We agree on the reality; you just refuse to use the E-word for it."

  If a view is observationally indistinguishable from Eternalism, agrees with Eternalism on truthmakers, and agrees with Eternalism on the structure of time, it is charitable to interpret it as Eternalism. To maintain it as distinct is to insist on a definition of "existence" that isolates the present moment without granting it any actual metaphysical privilege over other moments. This is a definition without a difference.

  **Conclusion**

  Indexical Presentism attempts to navigate between the Scylla of Relativity and the Charybdis of Truthmakers by relativizing existence. However, this navigation fails. To solve the truthmaker problem, the view must commit to the reality of non-present contexts, thereby adopting an eternalist ontology. To make sense of indexicality, it must treat time like space, thereby abandoning the robust intuition of temporal passage and the open future that motivates Presentism. Finally, because it agrees with Eternalism on the structure of reality and the grounds of truth, the remaining disagreement is purely semantic.

  Therefore, Indexical Presentism is not a genuine third option. It is Eternalism in disguise. It is Presentism with the spine removed: it keeps the language of the present but abandons the metaphysical claim that only the present is real.

  This collapse tells us something significant about the original debate. It suggests that the Presentism/Eternalism dispute is substantive only if Presentism insists on an absolute, non-indexical existence. If one accepts the relativistic picture where "now" is frame-relative or indexical, Presentism inevitably bleeds into Eternalism. The stability of Indexical Presentism depends on ignoring its own ontological commitments. Once those are brought to light, we see that a coherent metaphysics of time compatible with modern physics requires us to accept the block universe. We may choose to speak indexically, highlighting our current position within the block, but we cannot metaphysically deny the rest of the block without losing the ability to speak truly about the past or the future. The choice is not between a moving present and a static block; it is between a static block we experience from within, or an incoherent fragment that cannot account for its own truth. We should choose the block.
