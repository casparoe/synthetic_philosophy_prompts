prompt: |-
  I sit on the program committee of a private foundation whose stated mission is to increase the number of people who lead flourishing lives, and at our next meeting we have to choose between two five-year grants of identical size. The vote is deadlocked in a way I have come to think is philosophical rather than empirical. Grant A funds contraceptive access and voluntary family planning in a district of roughly 900,000 people; the foundation's own modelling says it would avert about 11,000 births over five years, mostly births to women who report not wanting another child now, and that it would raise measured wellbeing among people who exist either way — maternal health, household earnings, schooling per child. Grant B funds IVF and fertility care in the same district, where staff estimate roughly 1,200 additional births over five years to people who want children and cannot otherwise have them. The staff economist scored both grants on wellbeing-adjusted person-years and got nearly the same figure: the lives averted under Grant A would, on our own data, have been well above the local average, while the lives created under Grant B are expected to come out slightly higher still, though the two estimates sit inside each other's error bars. A complication that keeps resurfacing is that many of Grant B's patients would eventually have conceived naturally, so the children born under the grant are not merely earlier versions of children who would otherwise have been born; under the grant, different children exist.

  The deadlock tracks two positions. One bloc argues that the beneficiaries of Grant B do not exist independently of the grant, so there is no one whom the grant makes better off and no one whom declining it leaves worse off; on the person-affecting asymmetry, Grant B's value is close to zero and Grant A wins comfortably on its benefits to women and existing children. The other bloc replies that Grant A does nothing the mission statement names — it makes nobody's life flourish — and points out that the first bloc's principle, applied consistently, would tell the foundation to stop counting most of what it currently counts. A third trustee has floated a compromise rule: count benefits to people whose existence depends on the grant, but only to the extent that their expected wellbeing exceeds a threshold set at the district median, and cap the contribution of such existence-dependent benefits at a fixed fraction of any grant's total score. Separately, our board chair has raised the repugnant conclusion about the mission statement itself, noting that maximizing the number of flourishing lives seems to imply that a much larger population of lives just barely worth living would be better, and has asked whether the committee should propose an amendment.

  Please draft the decision memo I will circulate before the meeting. It should recommend a concrete course of action — fund one grant, split the money, fund both with conditions, or decline both and reopen the search — with a rationale a colleague who disagrees could actually answer, and it should state whether you accept, reject, or revise the threshold-and-cap rule and why. It should also give the committee's honest view on whether to recommend amending the mission statement, and it should give the strongest version of the losing position rather than only arguing for the winner.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Program Committee Member of a private foundation.
      *   **Mission:** Increase the number of people who lead flourishing lives.
      *   **Problem:** Deadlocked vote between two 5-year grants of identical size.
          *   *Grant A:* Contraceptive access/family planning (900k district). Averts 11k births. Improves wellbeing of existing people (mothers, siblings).
          *   *Grant B:* IVF/fertility care (same district). Creates 1.2k births. Helps those who want children but can't have them.
      *   **Data:** Wellbeing-adjusted person-years are nearly identical (within error bars). Grant B lives expected to be slightly higher wellbeing than Grant A averted lives, but Grant A helps existing people significantly.
      *   **Philosophical Conflict:**
          *   *Bloc 1 (Person-Affecting View):* Grant B creates new people (non-identity problem). No one is made better off by existing (vs. not existing). Grant A helps existing people. Grant A wins.
          *   *Bloc 2 (Total/Impersonal View):* Grant A doesn't make anyone flourish (it prevents existence). Mission says "increase number... flourishing lives." Grant B does this. Grant A contradicts mission if taken literally.
          *   *Compromise (Trustee 3):* Count existence-dependent benefits only if wellbeing > district median, capped at a fraction of total score.
          *   *Chair's Concern:* Repugnant Conclusion (Maximizing flourishing lives implies huge populations of barely worth living lives). Should we amend the mission?
      *   **Deliverable:** Decision Memo.
      *   **Requirements:**
          *   Recommend concrete action (Fund A, Fund B, Split, Conditions, Decline).
          *   Rationale must be answerable by a disagreeing colleague.
          *   Address the Threshold-and-Cap rule (Accept, Reject, or Revise + Why).
          *   Address the Mission Statement Amendment (Yes/No + Why).
          *   Present the strongest version of the losing position (Steel-manning).

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund A.* Strongest alignment with reducing suffering for existing people. Avoids non-identity pitfalls. But ignores the "increase number" part of the mission.
      *   *Option 2: Fund B.* Aligns with "increase number." But vulnerable to non-identity critique (does creating a happy person make the world better if that person wouldn't exist otherwise?).
      *   *Option 3: Split.* Kicks the can. Doesn't solve the philosophical deadlock.
      *   *Option 4: Decline/Reopen.* Acknowledges the philosophical impasse but delays impact.
      *   *Decision:* **Fund Grant A.**
      *   *Reasoning:* The "Person-Affecting" constraint is a safer ethical baseline for a private foundation than the "Total" view, which risks the Repugnant Conclusion. Helping existing people flourish is more robustly defensible than creating new people to flourish. However, the rationale needs to acknowledge the mission tension.
      *   *Wait, looking closer at the Mission:* "Increase the number of people who lead flourishing lives."
          *   Grant A: Reduces births. Technically decreases the number of people. But increases flourishing *per capita* among existing.
          *   Grant B: Increases births. Increases number of people.
          *   *Tension:* If the mission is strictly total utilitarian, B wins. If the mission implies "flourishing" requires a threshold, A might win by ensuring existing people cross that threshold.
      *   *Revised Decision:* **Fund Grant A, but recommend Mission Amendment.**
      *   *Why?* The current mission invites the Repugnant Conclusion. Grant A is ethically safer (helps identifiable victims/beneficiaries). The compromise rule (Threshold/Cap) is a good heuristic but shouldn't be rigid policy yet.
      *   *Alternative Decision:* **Fund Grant A.** (Stick with this). It's the more conventional philanthropic choice (harm reduction/wellbeing of existing vs. procreation subsidies).
      *   *Wait, let's look at the "Strongest Version of Losing Position".* If I recommend A, I must steel-man B (and the Total View). If I recommend B, I must steel-man A.
      *   *Strategic Choice:* Recommending **Grant A** is generally more defensible in a real-world foundation context because "preventing unwanted births" has clearer welfare benefits for existing agents than "subsidizing IVF" which has the non-identity problem. However, the prompt highlights the deadlock is *philosophical*.
      *   *Actually, the most constructive path:* **Fund Grant A**, **Reject the specific Threshold/Cap rule** (in favor of a broader principle), and **Recommend Amending the Mission**.
      *   *Why Amend Mission?* The Chair is right. "Increase the number... flourishing lives" is classic Total Utilitarianism. It leads to the Repugnant Conclusion. It creates the deadlock. Fixing the mission fixes future deadlocks.
      *   *Why Fund A?* Because under uncertainty about population ethics, prioritizing existing people (Person-Affecting) is the "minimax regret" strategy. You can't harm someone by not creating them; you *can* harm someone by denying them contraception they want.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly.
      *   **Context:** Briefly recap the grants and the deadlock.
      *   **Recommendation:** Fund Grant A.
      *   **Rationale (The "Answerable" Argument):** Focus on *identifiable beneficiaries* and *risk mitigation*.
      *   **Addressing the Compromise (Threshold/Cap):** Evaluate Trustee 3's idea. It's a heuristic, not a moral truth. Reject as rigid policy, accept as a sensitivity check.
      *   **Addressing the Mission:** The Chair is right. The mission needs nuance to avoid the Repugnant Conclusion.
      *   **Steel-manning the Opposition:** If I choose A, I must make the case for B sound incredibly reasonable (Total View, fulfilling deep desires, symmetry of interests).

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is "Fund A" too easy? The prompt says the economist scored them nearly the same.
      *   *Correction:* I need to lean heavily on the *uncertainty* of population ethics. When moral theories clash, prioritize the one that avoids harming existing agents.
      *   *The Compromise Rule:* Trustee 3 wants to count new lives only if > median and capped. This is a "Critical Level" utilitarianism approach. I should acknowledge its philosophical merit but argue it's too arbitrary for a hard cap.
      *   *The Mission:* This is crucial. The deadlock exists *because* of the mission wording. "Increase the number" is the problem. It should be "Enable people to lead flourishing lives" (drop the "increase number" or qualify it).
      *   *Tone:* Professional, philosophical but practical, respectful of the deadlock.

  5.  **Finalizing the Content:**
      *   **Decision:** Fund Grant A.
      *   **Mission:** Recommend Amendment.
      *   **Compromise Rule:** Reject as formal policy, adopt as analytical lens.
      *   **Steel-man:** The argument for Grant B is that "flourishing" is a good state to be in, and bringing good states into existence is good, regardless of identity. Denying B denies the mission's literal instruction.

  6.  **Writing the Memo:** (Mental check of constraints: Concrete course of action? Yes. Rationale answerable? Yes. Threshold rule stance? Yes. Mission stance? Yes. Strongest losing position? Yes.)

      *   *Wait, one nuance:* The prompt asks me to draft the memo *I* will circulate. I am a committee member. I need to sound like a peer proposing a path forward to break the deadlock, not necessarily a dictator. But it needs to be a *recommendation*.
      *   *Key Philosophical Term:* Non-Identity Problem (Parfit). Person-Affecting View vs. Total View. Repugnant Conclusion.
      *   *Structure:*
          1.  Recommendation.
          2.  Analysis of Grants (The Empirical vs. Philosophical).
          3.  The Population Ethics Question (Mission).
          4.  The Compromise Proposal.
          5.  The Case for the Other Side (Steel-man).
          6.  Next Steps.

