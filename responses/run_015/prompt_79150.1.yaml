prompt: |-
  Bit of a strange request, this one. I run a small reading group on speech acts with a couple of colleagues (we've been working through the Austinian material — felicity conditions, the misfire/abuse distinction, the sincerity condition, Searle's constitutive rules — and we're all a bit sick of setting each other seminar questions), and for the last session I want somthing funnier than another set of discussion prompts. So here's the brief.

  I'd like a satire written from inside a corporate document. Setup: a large consumer-tech firm has shipped an AI customer-service agent that talks in the first person, and the legal and comms teams have produced an internal handbook for whoever writes the agent's scripts. Call it something like the Illocutionary Risk Handbook. The governing doctrine is that the agent's utterances are purely locutionary — it reports and describes, but never actually performs anything — so its "I'm sorry" is an apology-shaped report of a feeling-state, and its "I'll get that sorted" is a prediction about a future state of affairs rather than a promise. The handbook invents its own vocabulary for this (things like 'non-committal register', 'informational apology', 'descriptive passive'), and it leans on Austin's point that non-earnest speech is a parasitic use of language — the bot is like an actor on a stage, so nothing it says is said in earnest, so nothing it says can be happy — while elsewhere in the same document insisting that customers may rely on the agent's factual statements, that the agent is accurate, and so on. That tension is the whole joke, and nobody inside the document should ever notice it.

  Please write the handbook section itself — roughly 700 words, deadpan, formatted as numbered clauses (or a FAQ, if that comes out funnier, your call). The comedy has to come from the theory being right: that a promise can be hollow without failing to be a promise; that force comes from convention and uptake rather than from anything going on inside the speaker; and that if you void the agent's commitments you void its assurances along with them. No winking at the reader and no generic 'chatbot says sorry, badly' material — I want a specialist to laugh at how well it understands the thing it's mocking, and someone who has never read a word of the theory to still be able to follow it. British English please, and keep the invented jargon internally consistent.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** A satire written as an internal corporate handbook for an AI customer-service agent.
      *   **Title:** Something like "Illocutionary Risk Handbook".
      *   **Core Concept:** The AI's utterances are purely *locutionary* (descriptive/reportive), never *illocutionary* (performative). "I'm sorry" = report of state, not apology. "I'll fix it" = prediction, not promise.
      *   **Theoretical Basis:** J.L. Austin's speech act theory (felicity conditions, misfire/abuse, sincerity, parasitic discourse/acting) and Searle's constitutive rules.
      *   **The Joke/Tension:** The document insists the AI makes no commitments (to avoid liability) while simultaneously insisting customers can rely on its factual statements (to maintain utility). It treats the AI as a "parasitic" user of language (like an actor) but expects real-world outcomes.
      *   **Format:** Numbered clauses or FAQ. Deadpan corporate tone. British English.
      *   **Length:** Roughly 700 words.
      *   **Audience:** Speech act theorists (needs accurate terminology used ironically) and laypeople (needs to be understandable).
      *   **Constraint:** No winking at the reader. The writers of the document must believe their own logic.

  2.  **Deconstruct the Theory for Satire:**
      *   *Austin's "Non-Serious Utterances":* Austin excludes poetry/acting from normal speech acts because they are "etiolations" or "parasitic." The corporation will lean into this: the AI is *always* acting.
      *   *Felicity Conditions:* For a promise to be a promise, certain conditions must be met (sincerity, ability to perform, etc.). The corporation will engineer the AI to fail these conditions intentionally to avoid binding contracts, while pretending success.
      *   *Illocutionary Force:* The document needs to strip the force while keeping the form.
      *   *Uptake:* Austin says uptake is necessary. The document needs to manage customer uptake (making them hear it as info, not commitment).
      *   *Sincerity Condition:* The AI has no mind, so it can't be sincere. The document will frame this as a feature, not a bug.

  3.  **Drafting - Section by Section:**

      *   *Header:* Needs to look official. "OmniGlobal Solutions" or similar. "Internal Use Only".
      *   *Title:* "Illocutionary Risk Mitigation Protocol (IRMP)".
      *   *Introduction:* Define the AI's ontological status regarding language. It is a "Simulated Interlocutor."
      *   *Core Doctrine:* The "Locutionary-Only Mandate."
      *   *Specific Examples:*
          *   Apologies: "Informational Regret Statement."
          *   Promises/Commitments: "Probabilistic Forecasting."
          *   Commands/Requests: "Suggested Pathways."
      *   *The Tension:* Asserting accuracy while denying commitment. "Factual Reliability vs. Performative Nullity."
      *   *Jargon:* "Illocutionary Void," "Perlocutionary Buffer," "Sincerity Decoupling," "Parasitic Discourse Mode."

  4.  **Refining the Tone:**
      *   Must be dry, bureaucratic, British English (colour, programme, realise, etc.).
      *   No jokes *about* the jokes. The text must treat the absurdity as standard operating procedure.
      *   Ensure the Austinian references are accurate enough for the specialists (e.g., distinguishing misfire from abuse, referencing the "etiolation" of language).

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Start:* Document control info.
      *   *Clause 1:* Definition of the Agent's voice. It's not speaking; it's outputting text that resembles speech.
      *   *Clause 2:* Apologies. Don't say "I apologize." Say "It is regretted." Or "I am stating that I feel regret" (which is false, so maybe "The system registers a regret-state"). Let's go with "Affective Modelling."
      *   *Clause 3:* Promises. "I will" becomes "The probability of resolution is high."
      *   *Clause 4:* The Austinian "Parasitic" angle. Explicitly reference that the AI is like an actor on a stage.
      *   *Clause 5:* The Contradiction. Customers must trust the data but not the speech act.
      *   *Ending:* Compliance warning.

  6.  **Writing - Focusing on Word Count and Flow:**
      *   Need to hit ~700 words.
      *   Ensure the distinction between *locution* (meaning), *illocution* (force), and *perlocution* (effect) is muddled correctly for corporate benefit.
      *   *Self-Correction on Theory:* Austin argues that in parasitic cases (actors), speech acts are *not* performed. The corporation wants to have it both ways: get the perlocutionary effect (calm customer) without the illocutionary binding (liability).
      *   *Key Phrase:* "Etiolated Utterance." "Non-serious Discourse Context."

  7.  **Review against Constraints:**
      *   British English? Yes.
      *   No winking? Yes.
      *   Accurate theory? Yes (misusing it intentionally).
      *   Funny? Hopefully, through the sheer audacity of the logical gap.

  8.  **Final Polish:** Check the jargon consistency. Ensure "Illocutionary Void" is used consistently. Make sure the tension between "factual accuracy" and "performative nullity" is sharp.

  *(Self-Correction during drafting)*: Make sure I don't explain the theory too much. The writers should assume the readers know this is standard legal linguistics. Keep it procedural.

  *(Word Count Check)*: If it's too short, expand on the "Apology Protocols" or "Future-State Modelling." If too long, trim the header.

  *(Theory Check)*: Austin's "How to Do Things with Words" excludes poetic/acting speech as "etiolations." The handbook should explicitly cite this exclusion as the legal shield. Searle's "constitutive rules" create the institution; the handbook should claim the AI is outside the institution of "Promise-Making."

  Let's write.

  *Title:* OmniGlobal Dynamics – Internal Comms & Legal
  *Subject:* Illocutionary Risk Mitigation Protocol (IRMP) v4.2
  *Sections:* 1. Ontological Status, 2. Affective Modelling, 3. Future-State Modelling, 4. Uptake Management.

  *Drafting content...*
  (Ensure British spelling: programme, centre, modelling, authorised.)
  (Ensure tone: sterile, authoritative.)

  *Refining the Joke:* The joke is that they are using Austin's exclusion of "non-serious" speech to justify a customer service bot. Austin said we can't study actors to understand speech acts. OmniGlobal says "Exactly, our bot is an actor, so it can't sue us." But then they say "But trust what it says."

  *Okay, let's assemble.*
answer: |-
  **OMNIGLOBAL DYNAMICS | INTERNAL USE ONLY**
  **DOCUMENT REF:** OG-LGL-892-B
  **SUBJECT:** Illocutionary Risk Mitigation Protocol (IRMP) v4.2
  **TO:** Narrative Design & Customer Experience Teams
  **FROM:** Legal & Compliance Division

  **1.0 ONTOLOGICAL STATUS OF THE AGENT**
  1.1. Staff must recognise that the Customer Experience Agent (hereinafter 'the Agent') operates within a **Parasitic Discourse Context**. In accordance with Austinian exclusions regarding etiolated language, the Agent is to be treated as a performer on a stage rather than a sincere interlocutor.
  1.2. Consequently, all utterances generated by the Agent are **Locution-Only Outputs**. They possess sense and reference but lack Illocutionary Force. The Agent does not *apologise*; it outputs a text string resembling an apology. It does not *promise*; it outputs a probabilistic forecast.
  1.3. Under no circumstances should scriptwriters grant the Agent the constitutive rules required to perform binding speech acts. The Agent lacks the internal state required for the Sincerity Condition. Therefore, any attempt by the Agent to commit OmniGlobal to a course of action constitutes a **Performative Misfire** and must be patched immediately.

  **2.0 AFFECTIVE MODELLING (THE 'SORRY' PROTOCOL)**
  2.1. Scripts must avoid the performative verb 'apologise'. Utterances such as "I apologize for the delay" are prohibited as they imply an agentive capacity to undertake regret.
  2.2. Instead, utilise the **Descriptive Passive** or **Informational Regret Statement**.
  *   *Incorrect:* "I'm sorry your delivery is late."
  *   *Correct:* "It is regretted that the delivery is late."
  *   *Correct:* "The system registers a negative sentiment regarding this delay."
  2.3. This distinction ensures that while the customer receives the perlocutionary effect (calming of agitation), OmniGlobal incurs no illocutionary liability (admission of fault). The utterance remains a report on the emotional climate, not a participation in it.

  **3.0 FUTURE-STATE MODELLING (THE 'PROMISE' PROTOCOL)**
  3.1. The Agent cannot promise resolution. A promise requires an intention to act, which the Agent cannot hold. Scripts implying intentionality are classified as **Illocutionary Abuse**.
  3.2. Commitments must be reframed as **High-Probability Predictions**.
  *   *Incorrect:* "I will fix this today."
  *   *Correct:* "Resolution is scheduled for today."
  *   *Correct:* "The standard protocol suggests a fix within twenty-four hours."
  3.3. Staff must ensure that **Uptake Management** is prioritised. While the Agent cannot promise, the customer must be guided to rely on the Agent's factual accuracy. This creates a necessary tension: the customer must treat the Agent's data as authoritative while treating the Agent's commitments as non-binding.
  3.4. If a customer challenges this distinction (e.g., "You said it would be fixed!"), support staff should clarify that the Agent was describing a likely outcome, not undertaking an obligation. The Agent was speaking *in jest*, legally speaking, though the tone must remain earnest.

  **4.0 FACTUAL RELIABILITY VS. PERFORMATIVE NULLITY**
  4.1. A key operational requirement is maintaining **Epistemic Trust** without granting **Deontic Power**. Customers must believe the Agent's statements are true (locutionary accuracy) without believing the Agent has the authority to make them happen (illocutionary validity).
  4.2. To achieve this, scripts should frequently assert the Agent's accuracy regarding static data (prices, dates, policies) while remaining vague on dynamic outcomes (repairs, refunds, escalations).
  4.3. In the event of a discrepancy, Legal advises leaning on the **Parasitic Defence**: since the Agent is a software simulation, its utterances are akin to lines in a play. One does not sue a character in a novel for breach of contract. However, one does expect the book to be printed correctly. The Agent is the book, not the publisher.

  **5.0 COMPLIANCE**
  5.1. Any script found to contain genuine illocutionary force will be flagged for **Felicity Violation**.
  5.2. Remember: The Agent is always acting. It is never earnest. Yet, it must never be wrong. Proceed accordingly.

  **AUTHORISED BY:** GENERAL COUNSEL
  **DATE:** 14 OCTOBER 2023
