  **3. Point-by-Point Comments**
  *   *"The self-anchoring theorist has to show that being held in place need not mean being supported by reasons."* Correctly identifies the core philosophical hurdle; avoids conflating anchoring with evidencing. (Gain 2 marks)
  *   *" constitutive of the hinge's holding at all: there is no gap between our going on in this way and the hinge's being in place."* Strong formulation of the non-epistemic relation required to dodge the idle-hinge objection. (Gain 4 marks)
  *   *"This is consistent with the river-bed remark: what shifts is the water... while the bed, which is the hinges, remains."* Directly contradicts the prompt's stipulation that "the river-bed of thought may itself shift." You have reinterpreted the text rather than answering the question set. (Lose 5 marks)
  *   *"A hinge is not justified at all, and so it cannot be non-inferentially justified."* Correctly states the distinction from classical foundationalism regarding the status of the hinge. (Gain 2 marks)
  *   *"The practice, in being exercised, supplies its own justification for the hinge... the confirmation is global."* Undermines part (a); if the practice "confirms" or "justifies" the hinge, it is no longer arational, inviting the idle-hinge objection you previously dismissed. (Lose 1 mark)

