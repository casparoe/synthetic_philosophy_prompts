answer: |-
  The principle and its parts

  Your intuitions align with a hybrid view I'd call **Diachronic Impartiality with Prudential Constraints**. The first part is **Welfare Neutrality**: units of happiness or suffering count equally regardless of when they occur, ruling out pure time preference on well-being. This explains why discounting your own future happiness at 50% feels like self-neglect and why climate damages shouldn't be discounted morally. The second part is **Instrumental Discounting**: goods like money can be discounted because of investment opportunities or diminishing marginal utility, not because time erodes value. This justifies preferring $1000 now over $1030 later without violating welfare neutrality.

  The third part is **Diachronic Autonomy**: you are an extended self over time, so you can bind future impulses (weakness of will) but cannot suppress future rational value changes (growth). This distinguishes binding contracts from preference-wiping drugs. It treats your life as a narrative where the author can edit drafts but cannot burn the book to avoid plot twists. This tripartite principle allows you to treat money pragmatically while treating persons (including your future self) impartially.

  Which verdicts survive and which break

  Most of your verdicts survive this framework, but the asteroid case requires adjustment to maintain consistency. Your retirement, climate, commitment, and contract intuitions all fit neatly into the goods/welfare and autonomy distinctions. However, your view on the asteroid strike conflicts with Welfare Neutrality if the risk is genuinely catastrophic and real; ignoring it simply because it is 400 years away implies a pure time preference on survival itself. To maintain consistency, you must drop the verdict that it is fine to spend way less on the asteroid solely due to timing. Instead, you must justify lower spending via opportunity costs (curing cancer saves lives *now* with certainty) or probability assessments, not because future lives matter less.

  The torn case and the future-only infrastructure case

  For the job case, Welfare Neutrality dictates that you should not take the job if the future misery outweighs the current gain; the fact that you are the current decider does not grant you sovereignty to discount your future self's suffering. You are a trustee, not an owner, of your future welfare, so temporal symmetry holds. Regarding the infrastructure case, if the project benefits only people after everyone currently alive is dead, impartiality demands you build it only if it doesn't sacrifice greater welfare today. If resources are scarce, saving present lives takes precedence due to certainty and opportunity costs, but if the choice is between present luxury and future essential infrastructure, Welfare Neutrality obligates you to build for the future.

  Bottom line

  You are running one coherent rule set, not two incompatible ones, provided you strictly separate goods from welfare. Keep the distinction between investment returns and moral value, and drop the idea that timing alone justifies ignoring existential risks.
