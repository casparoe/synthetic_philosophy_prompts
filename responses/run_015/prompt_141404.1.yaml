answer: |-
  ### Specification of Desiderata for Strong Longtermism

  **Purpose:** To determine the necessary conditions under which a theory of intergenerational value warrants allocating a fixed budget to a long-term existential risk reduction intervention (small probability shift, vast stakes) over a near-term welfare intervention (certain benefit, limited scope).

  **Scope:** These are not general desiderata for *any* moral theory, but specific conditions a theory must satisfy to derive the **Strong Longtermist Conclusion** (that far-future effects dominate).

  ---

  #### 1. The Locus of Value: Impersonal Aggregation
  **Requirement:** The theory must locate value in *impersonal states of affairs* (e.g., total welfare, complexity, knowledge) rather than in *relations to specific agents*. It must treat the addition of lives with positive welfare as a contributory good, even if no antecedent person is made better off by that addition.

  **The Central Case: The Degraded Survival Scenario**
  *   **Option A (Near-Term Focus):** Guarantees humanity survives for 1,000 years at a high level of welfare per capita ($W_{high}$), after which extinction occurs naturally.
  *   **Option B (Long-Term Focus):** Increases the probability of survival to an astronomical timeframe by a margin $\delta$ (e.g., 0.01%), but conditional on survival, locks in a social structure that yields a lower level of welfare per capita ($W_{low}$), where $W_{low} < W_{high}$.
  *   **The Conflict:** Option B creates a future where every individual is worse off than they would have been in Option A's future (assuming identity is held constant for the comparison class), or creates entirely different individuals.
  *   **Why this matters:** For Strong Longtermism to warrant choosing B, the theory must assert that $ExpectedValue(B) > ExpectedValue(A)$. This requires:
      1.  **Neutrality of Identity:** The value of the future does not depend on *which* specific people inhabit it.
      2.  **Linearity of Scale:** The sheer number of future lives ($N_{future}$) must be able to outweigh the per-capita welfare deficit ($W_{high} - W_{low}$).
      3.  **Existence as Benefit:** Bringing $N_{future}$ people into existence at $W_{low}$ must count as a positive value contribution, not merely a neutral event.

  #### 2. The Non-Identity Condition: Rejection of the Person-Affecting Restriction
  **Requirement:** The theory must explicitly reject the **Person-Affecting Restriction** (the claim that an outcome can only be better if it is better for some particular person). It must affirm that we have obligations to "possible people" contingent on our choices, such that failing to bring them into existence can be a harm *simpliciter*, even if there is no subject for whom it is worse.

  **The Consideration:**
  *   In long-term interventions (e.g., climate policy, existential risk reduction), the specific people who will exist in 200 years depend causally on the precise choices we make now (the Non-Identity Problem).
  *   If a theory adheres to the Person-Affecting Restriction, preventing extinction cannot be said to benefit the people who would have existed (since they will not exist to experience the loss), nor can it harm them (since they never exist to be harmed).
  *   **Work to be done:** This requirement forces the theory to adopt an **Impersonal Comparative Principle**. Without this, the "benefit" of saving humanity dissolves into "changing which people exist," which person-affecting views often treat as morally neutral. Strong Longtermism cannot survive if the creation of future value is morally inert.

  #### 3. The Taxonomy of Loss: Extinction vs. Lock-In vs. Replacement
  **Requirement:** The theory must distinguish between **Extinction** (cessation of value-bearing entities), **Lock-In** (permanent sub-optimality), and **Replacement** (succession by entities with different values). It must assign a specific disvalue to Extinction that is not merely the sum of lost welfare, but includes the loss of *moral potential*.

  **The Consideration:**
  *   **Extinction:** Value = 0 (or negative, if suffering occurs during end).
  *   **Lock-In:** Value > 0, but $< Potential$. (See Degraded Survival Scenario above).
  *   **Replacement:** Humanity goes extinct but is replaced by AI or post-humans.
  *   **Why this matters:** Strong Longtermism often prioritizes preventing extinction over preventing lock-in. However, if the "Lock-In" future is sufficiently long and large, it may contain more total value than a short, high-quality human future.
  *   **Specification:** The theory must specify whether *humanity's* survival is intrinsically valuable, or only the survival of *value-generating capacity*. If the latter, "Replacement" by a superior successor might be preferable to human survival. Strong Longtermism typically assumes the latter (value is impersonal), but this must be stated to handle the "Replacement" objection.

  #### 4. Epistemic Tractability: Resolution of Cluelessness
  **Requirement:** The theory must provide a decision rule that yields determinate verdicts under **Severe Cluelessness** regarding flow-through effects. It must assert that the expected value of the long-term intervention is calculable (or boundable) with sufficient precision to outweigh the certain near-term benefit.

  **The Consideration:**
  *   **Flow-Through Effects:** Any action changes the timing of conceptions, altering the identity of all future people. Saving a life now might lead to a future tyrant; preventing a war now might delay a technological breakthrough that prevents extinction.
  *   **The Problem:** If the sign of the long-term effect (positive or negative) is unknowable, the Expected Value (EV) is undefined or zero.
  *   **Specification:** To warrant the Strong Longtermist Conclusion, the theory must either:
      1.  Claim that existential risk reduction has *robustly positive* flow-through effects regardless of identity changes (e.g., "any future is better than no future").
      2.  Adopt a decision theory (e.g., risk-weighted utilitarianism) that allows acting on tiny probabilities of astronomical value despite epistemic noise.
      3.  **Negotiability:** This is marked **Non-Negotiable** for the conclusion. If the theory admits that cluelessness swamps the calculation, the budget allocation to long-term interventions becomes irrational.

  #### 5. Temporal Neutrality and Discounting
  **Requirement:** The theory must apply a **Zero Pure Time Preference** to welfare. The value of a unit of welfare occurring in 1,000 years must be weighted equally to a unit of welfare occurring today, adjusted only for probability of occurrence.

  **The Consideration:**
  *   Standard economic and some ethical models apply a discount rate to future utility.
  *   Given the astronomical number of future people, even a tiny non-zero discount rate reduces the value of the far future to negligible levels compared to the present.
  *   **Specification:** To get the "dominance" result, the discount rate must be zero. Any positive discount rate acts as an exponential filter that negates the "size of the future" argument.

  ---

  ### Internal Tensions and Incompatibilities

  **1. The Epistemic vs. Ethical Conflict**
  *   **Tension:** Requirement 1 (Impersonal Aggregation) demands we count the value of astronomical numbers of future people. Requirement 4 (Epistemic Tractability) demands we know our actions positively affect them.
  *   **Incompatibility:** The more we lean into Impersonal Aggregation (counting everyone), the more severe the Cluelessness problem becomes (because the causal chains to those specific people are more complex). A theory that satisfies the ethical magnitude of Requirement 1 may logically be forced to fail the epistemic confidence of Requirement 4. If we cannot know if we are helping or hindering the long-term aggregate, the ethical imperative dissolves.

  **2. The Risk-Neutrality vs. Catastrophe Aversion Conflict**
  *   **Tension:** Strong Longtermism relies on Expected Value (EV) maximization (Requirement 4). This implies risk-neutrality regarding stakes.
  *   **Incompatibility:** Many plausible decision theories suggest risk-aversion when stakes involve the total loss of value (extinction). If a theory incorporates risk-aversion (e.g., maximizing the minimum outcome), it might prioritize the *certain* near-term benefits over the *low-probability* long-term survival, even if the EV of the latter is higher. You cannot simultaneously hold "Maximize Expected Total Value" and "Avoid Catastrophic Risk at all costs" if the EV calculation favors the risk.

  ---

  ### The Exclusionary Requirement (The "Kill Switch")

  **Requirement 4 (Epistemic Tractability)** does the most to exclude the Strong Longtermist Conclusion.

  **Reasoning:**
  While Requirement 1 (Impersonal Aggregation) is the most *philosophically* controversial (clashing with person-affecting intuitions), Requirement 4 is the most *practically* fatal. Even if one accepts Total Utilitarianism (satisfying Req 1), if one admits that "flow-through effects" are epistemically inaccessible (i.e., we are clueless about whether reducing risk now speeds up or slows down arrival of other risks), the Expected Value calculation becomes undefined.
  *   If $EV = Probability \times Value$, and $Probability$ is unknowable (could be positive or negative), then $EV$ cannot dominate near-term certain benefits.
  *   Therefore, a theory that insists on **Epistemic Humility** regarding long-term causal chains automatically excludes the Strong Longtermist Conclusion, regardless of its ethical commitments.

  ---

  ### Partisan Preferences (Optional Items)

  The following items on the list are not universal ethical constraints but reflect specific commitments of the Longtermist/Utilitarian camp. You are free to drop them, but doing so will likely invalidate the Strong Longtermist Conclusion.

  1.  **Rejection of the Person-Affecting Restriction (Requirement 2):**
      *   *Status:* **Partisan.**
      *   *Why:* Many robust theories of justice (e.g., contractualism, rights-based views) hold that we cannot owe duties to non-existent beings. Dropping this requirement and adopting a Person-Affecting View blocks the inference that "preventing extinction is good because it benefits future people."
      *   *Consequence:* If you keep this as a desideratum, you are pre-loading the debate in favor of Impersonal Totalism.

  2.  **Risk-Neutrality in Decision Theory (Implicit in Requirement 4):**
      *   *Status:* **Partisan.**
      *   *Why:* Standard Expected Value Theory assumes linear weighting of probabilities. However, "Pascal's Mugging" objections suggest that rational agents should discount tiny probabilities of astronomical stakes.
      *   *Consequence:* If you require a decision rule that discounts low-probability high-stakes events (to avoid manipulation), the long-term intervention loses its dominance over the near-term intervention.

  3.  **Value of Replacement (Implicit in Requirement 3):**
      *   *Status:* **Partisan.**
      *   *Why:* The assumption that "humanity replaced by successors" is acceptable (provided value is maintained) is a specific axiological claim. A theory valuing *human continuity* specifically would reject this.
      *   *Consequence:* If you require the theory to value *humanity* specifically, not just *value-bearers*, the calculation changes when considering AI successors or post-human evolution.

  ### Summary for Decision
  To accept the Strong Longtermist package, you must accept a theory that is **Impersonal**, **Totalizing**, **Risk-Neutral**, and **Epistemically Optimistic**. The most fragile link is **Epistemic Optimism**; the most philosophically costly link is **Impersonalism**. If your political theory commitments lean toward contractualism or rights-based views (which are typically person-affecting), Requirement 2 alone is sufficient to exclude the conclusion.
