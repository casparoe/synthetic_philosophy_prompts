  hey i'm writing teh final exam for my grad seminar on conceptual analysis—specifically the unit on copycat reasoning and fluid concepts, where concepts slide around inside small domains without clear borders. i want an essay question that gets students away from the usual art-forgery examples and into a microdomain where the slippage is genuinely hard to police: vintage analog synthesizer repair. here's the setup—original circuit boards are long gone, so techs swap in modern digital equivalents but keep the chassis, keyboard, and branding. the community then calls the result a 'replica', a 'reconstruction', or a 'continuation' of the original instrument, and those labels shift depending on whether people care about sonic fidelity, material continuity, or historical lineage. the exam should ask whether there's a principled line between those three categories or whether they're just family-resemblance clusters that move with context. students should answer in about 75 minutes, take an actual position, and they shouldn't be able to just summarize wittgenstein or goodman. no bibliographies or citations—some take this remotely. can you draft: (1) The exam prompt—clear enough for 75 mins; (2) A model answer around 700 words that argues rather than lists; (3) A marking scheme out of 25 with five must-hit points (marks for each, total 25), plus one line per point on teh typical wrong move. please use these exact headings in this order: Exam prompt, Model answer (~700 words), Marking scheme. avoid asking for reading lists.
