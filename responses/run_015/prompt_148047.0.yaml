      *Prompt:*
      **Exam prompt**
      Time: 75 Minutes
      Total Marks: 25

      In the community of vintage analog synthesizer repair, original circuit boards are often unavailable. Technicians frequently replace degraded analog components with modern digital equivalents while retaining the original chassis, keyboard, and branding. Depending on the speaker's priority—sonic fidelity, material continuity, or historical lineage—the modified instrument is labeled a 'replica', a 'reconstruction', or a 'continuation' of the original.

      Write an essay arguing whether there is a principled philosophical line distinguishing these three categories, or whether they function as fluid, overlapping clusters that shift based on contextual use. You must take a definite position. Do not simply summarize course readings (e.g., Wittgenstein or Goodman) or provide bibliographies. Your analysis must remain grounded in the synthesizer scenario provided above.

      *Model Answer:*
      **Model answer (~700 words)**
      The debate over modified vintage synthesizers reveals that the categories of 'replica', 'reconstruction', and 'continuation' are not ontological buckets with principled borders, but rather fluid conceptual tools that shift to serve specific communal interests. Attempting to draw a rigid line between these labels fails because the identity of the instrument depends entirely on which feature is being privileged in a given context: sound, matter, or history. Therefore, conceptual analysis in this domain must abandon the search for necessary and sufficient conditions in favor of understanding how these labels function pragmatically within the repair community.

      Consider the tension between sonic fidelity and material continuity. If a technician replaces every capacitor and chip with modern digital equivalents, but the output voltage and waveforms remain indistinguishable from the 1970s original to the human ear, is it a continuation? A materialist argues no; the physical substance is new, making it a reconstruction at best. However, a musician argues yes; the functional identity—the sound—is what defines the instrument's utility. If we insist on a principled line based on materiality, we render the instrument useless for performance because preserved analog components are unreliable. If we insist on a line based on sound, we risk calling a software emulation a 'continuation' simply because it sounds right. The label slides depending on whether the speaker is a collector valuing scarcity or a performer valuing reliability. This slippage suggests the concepts are not fixed descriptions of reality but negotiations of value.

      Furthermore, the label 'replica' versus 'continuation' hinges on historical lineage rather than physical properties. A 'continuation' implies an unbroken chain of existence, whereas a 'replica' suggests a copy made after a break. Yet, in synthesizer repair, the chain is often broken by necessity (part failure) and bridged by substitution. If the chassis and keyboard are original, the historical artifact persists physically, even if the brain is new. Calling this a 'replica' denies the historical weight of the chassis; calling it a 'continuation' ignores the technological discontinuity of the circuits. The community resolves this not by finding the truth, but by shifting labels to match intent. When selling to a museum, the tech emphasizes the chassis to claim 'continuation'. When selling to a purist, they emphasize the new chips to claim 'reconstruction', lowering the price accordingly. The concept changes to fit the transaction.

      Critics might argue that without principled lines, the market collapses into fraud. If anything can be a 'continuation', forgery becomes easy. However, recognizing fluidity does not invite dishonesty; it invites clarity about criteria. We do not need a metaphysical boundary to prevent fraud; we need transparent disclosure of modifications. The harm lies not in the conceptual slippage, but in hiding the swap. Therefore, the concepts should be treated as disclosures of modification levels rather than claims of essential identity. A 'reconstruction' discards the claim of original sound for reliability; a 'continuation' claims both but admits risk.

      Ultimately, insisting on a principled line misunderstands how technical concepts work in practice. The synthesizer is not a natural kind with an essence waiting to be discovered; it is a cultural artifact whose identity is constituted by use. When the concept of 'continuation' slides to include digital replacements, it is not a corruption of language, but an adaptation to material scarcity. The boundaries move because the needs of the community move. To freeze these definitions would be to prioritize philosophical tidiness over the lived reality of repair and performance. Thus, the categories are family-resemblance clusters, held together not by a single common thread of identity, but by the overlapping needs of those who build, play, and sell them. The analysis must therefore focus on the utility of the label in context, not the metaphysics of the object.

      *Marking Scheme:*
      **Marking scheme**
      1.  **Clear Position on Categories (5 marks):** Student must explicitly argue for either principled lines or fluid clusters.
          *   *Typical wrong move:* Hedging indefinitely or refusing to take a side between the two options.
      2.  **Engagement with Material/Sonic Tension (5 marks):** Analysis must specifically address the conflict between original chassis and modern circuits.
          *   *Typical wrong move:* Discussing identity abstractly without referencing the specific synth components provided.
      3.  **Analysis of Contextual Shifts (5 marks):** Must explain how/why the labels change based on user intent (collector vs. musician).
          *   *Typical wrong move:* Treating the labels as static definitions rather than context-dependent tools.
      4.  **Argumentative Cohesion (5 marks):** Essay must flow logically from premise to conclusion without disjointed paragraphs.
          *   *Typical wrong move:* Listing points sequentially without connecting them into a unified argument.
      5.  **Adherence to Constraints (5 marks):** No citations, no bibliography, no simple summary of course authors.
          *   *Typical wrong move:* Name-dropping Wittgenstein/Goodman without applying their logic to the synth scenario.

