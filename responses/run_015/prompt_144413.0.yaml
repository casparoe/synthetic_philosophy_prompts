answer: |-
  ## Part 1: The Logical Decision Tree

  This tree maps the **logical space** of possible positions first. The named philosophical positions are located at the leaves. Every branch is labeled with the single claim that separates the views below it.

  ```text
  START: Does an individual have ANY moral obligation regarding the collective harm?
  │
  ├── NO ──────────────────────────────────────────────────────────────► [FATALISM / MORAL NIHILISM]
  │   (Claim: The scale of the problem dissolves individual agency.)
  │
  └── YES
      │
      ├── BRANCH 1: Does your obligation depend on what OTHERS would do 
      │             if they acted as you do? (Conditional vs. Fixed)
      │   │
      │   ├── YES (Conditional) ───────────────────────────────────────► [RULE UTILITARIANISM / 
      │   │   (Claim: "What if everyone did that?" is the test.)        KANTIAN UNIVERSALIZATION]
      │   │
      │   └── NO (Fixed: Hold others' behavior constant)
      │       │
      │       ├── BRANCH 2: Is the wrongness located in the CAUSAL 
      │       │             OUTCOME of the act? (Consequentialist vs. Non-Consequentialist)
      │       │   │
      │       │   ├── NO (Wrongness is in the Act/Agent itself)
      │       │   │   │
      │       │   │   ├── BRANCH 3: Is the focus on YOUR CHARACTER 
      │       │   │   │             or your ASSOCIATION?
      │       │   │   │   │
      │       │   │   │   ├── CHARACTER ───────────────────────────────► [VIRTUE ETHICS]
      │       │   │   │   │   (Claim: "A virtuous person wouldn't do this.")
      │       │   │   │   │
      │       │   │   │   └── ASSOCIATION ─────────────────────────────► [COMPLICITY / 
      │       │   │   │       (Claim: "I am joining a harmful group.")   PARTICIPATION VIEW]
      │       │   │   │
      │       │   └── YES (Wrongness is in the Outcome)
      │       │       │
      │       │       ├── BRANCH 4: Do we count PROBABILISTIC impact 
      │       │       │             (Expected Value) or only ACTUAL 
      │       │       │             pivotality?
      │       │       │   │
      │       │       │   ├── ONLY ACTUAL PIVOTALITY ──────────────────► [CAusal INEFFICACY VIEW]
      │       │       │   │   (Claim: "If I don't change the outcome, 
      │       │       │   │    I did no harm.")
      │       │       │   │   *NOTE: In collective harm cases, this 
      │       │       │   │   logically collapses into Fatalism (No 
      │       │       │   │   Obligation) because pivotality is near 
      │       │       │   │   zero. Marked as logically distinct but 
      │       │       │   │   practically empty.*
      │       │       │   │
      │       │       │   └── PROBABILISTIC (EXPECTED VALUE) ──────────► [ACT CONSEQUENTIALISM]
      │       │       │       (Claim: "Tiny chance × Huge stakes = 
      │       │       │        Significant obligation.")
  ```

  ### Empty or Unattractive Logical Combinations
  1.  **The "Magic Pivotality" Node:** *Obligation: Yes / Others: Fixed / Outcome: Actual Only / Pivotality: High.*
      *   **Status:** **Empty (Incoherent).** In large collective harms (climate, elections), it is empirically false that a single act guarantees a change in outcome. A view requiring guaranteed pivotality to generate obligation cannot occupy this space in the real world.
  2.  **The "Blameless Obligation" Node:** *Obligation: Yes / Blame: No.*
      *   **Status:** **Unattractive.** While logically possible (supererogation), most theories discussed here link obligation to blameworthiness. A view that says "You must do it, but you aren't bad if you don't" is usually a different category (advisability vs. obligation).
  3.  **The "Virtue Without Consequence" Node:** *Virtue Ethics / Consequences: Totally Irrelevant.*
      *   **Status:** **Unattractive.** Few virtue ethicists claim consequences matter *not at all*. They usually argue consequences are part of what defines virtue. A view that ignores consequences entirely is caricatured.

  ---

  ## Part 2: The Diagnostic Quiz (10 Questions)

  **Instructions:** Read the five scenarios. For each, answer the **Verdict** (What should you do?) and the **Reason** (Why?).

  ### Scenario 1: The Safe District Vote (Standard Pivotality)
  *Your district hasn't been close in 20 years. Your vote won't change the winner.*
  1.  **Verdict:** Should you vote? (Yes / No / Doesn't Matter)
  2.  **Reason:** Why?
      *   A. My vote has a tiny chance of being the tie-breaker; that risk matters.
      *   B. Voting is what a responsible citizen does, regardless of the count.
      *   C. If everyone like me stayed home, democracy would collapse.
      *   D. One vote changes nothing, so I waste my time.

  ### Scenario 2: The Supermarket Burger (Complicity)
  *You buy one burger. The supply chain is so huge your purchase won't change how many cows are killed.*
  3.  **Verdict:** Is buying the burger wrong? (Yes / No / Doesn't Matter)
  4.  **Reason:** Why?
      *   A. It makes me a participant in a cruel industry.
      *   B. It doesn't actually cause extra suffering, so it's fine.
      *   C. A compassionate person wouldn't support this.
      *   D. If everyone bought burgers, it would be a disaster.

  ### Scenario 3: The Risky Shortcut (Variance Case)
  *You need to drive. Route A emits 10 units of pollution steadily. Route B emits 0 units 90% of the time, but 100 units 10% of the time (due to traffic jams/spills). The **average** (expected) harm is identical (10 units).*
  5.  **Verdict:** Is Route B worse than Route A? (Yes / No / Same)
  6.  **Reason:** Why?
      *   A. Yes, gambling with a chance of disaster is reckless, even if the average is the same.
      *   B. No, the expected harm is the same, so the acts are equal.
      *   C. Yes, taking the risk shows a lack of care for others.
      *   D. No, unless I *know* I will cause the spill, it doesn't matter.

  ### Scenario 4: The Capped Damage (Threshold Case)
  *A factory pollutes a lake. Harm occurs only if pollution hits 1,000 units. It is currently at 500. You can add 1 unit. The harm is **capped**: if it hits 1,000, the fish die. If it hits 1,500, the fish still just die (no extra harm).*
  7.  **Verdict:** Do you have an obligation to stop? (Yes / No)
  8.  **Reason:** Why?
      *   A. Yes, I might be the one to cross the threshold (tiny chance × big harm).
      *   B. No, the chance I cross the threshold is too small to worry about.
      *   C. Yes, I shouldn't contribute to a capped harm any more than an uncapped one.
      *   D. No, my act won't change the fact that the fish are safe right now.

  ### Scenario 5: The Group Project (Conditional Cooperation)
  *Your group is dumping trash. You could stop, but if you stop alone, the trash still gets dumped by others. It only works if the whole group stops.*
  9.  **Verdict:** Should you stop? (Yes / No / Only if others do)
  10. **Reason:** Why?
      *   A. Only if others do; otherwise my effort is wasted.
      *   B. Yes, I must keep my own hands clean regardless of them.
      *   C. Yes, because if everyone reasoned like me, we'd never stop.
      *   D. No, the harm happens either way.

  ---

  ## Part 3: Scoring Key & Position Mapping

  Match your dominant pattern of answers to the positions below. Most people will have a mix; find the cluster that fits best.

  ### 1. Act Consequentialism (The "Expected Value" View)
  *   **Pattern:** Q1: Yes (A) | Q3: Yes (B - *Wait, AC says if no causal link, it's fine. But AC usually accepts EV.* Let's refine: AC says Q3: No (B) because no *expected* change in cow deaths) | Q5: Same (B) | Q7: Yes (A) | Q9: Yes (A - *If others fixed, no utility gain*).
  *   **Core Logic:** You are obligated to minimize **Expected Harm** (Probability × Magnitude).
  *   **Key Marker:** Accepts tiny probabilities of huge stakes (Q7-A) but rejects acts with no expected difference (Q3-B). Treats risk neutrally (Q5-B).
  *   **Tree Location:** Yes Obligation → Fixed Others → Causal Outcome → Probabilistic Impact.

  ### 2. Rule Utilitarianism / Universalization (The "What If Everyone?" View)
  *   **Pattern:** Q1: Yes (C) | Q3: Yes (D) | Q5: Same/Yes | Q7: Yes | Q9: Only if others do (C).
  *   **Core Logic:** You are obligated to follow rules that would be good if **everyone followed them**, even if your specific act changes nothing.
  *   **Key Marker:** Conditional cooperation (Q9-C) and Universalization reasons (Q1-C, Q3-D).
  *   **Tree Location:** Yes Obligation → Conditional on Others.

  ### 3. Complicity / Participation View (The "Dirty Hands" View)
  *   **Pattern:** Q1: Yes | Q3: Yes (A) | Q5: Yes (A or C) | Q7: Yes (C) | Q9: Yes (B).
  *   **Core Logic:** You are obligated not to **join** or **support** harmful collective actions, regardless of causal impact.
  *   **Key Marker:** Focus on participation/association over outcome (Q3-A). Often sees risk as morally worse (Q5-A).
  *   **Tree Location:** Yes Obligation → Fixed Others → Non-Causal → Association.

  ### 4. Virtue Ethics (The "Character" View)
  *   **Pattern:** Q1: Yes | Q3: Yes (C) | Q5: Yes (C) | Q7: Yes | Q9: Yes (B).
  *   **Core Logic:** You are obligated to act as a **virtuous person** would. The focus is on your character, not the math.
  *   **Key Marker:** Reasons appeal to traits ("compassionate," "reckless," "responsible") rather than rules or math (Q3-C, Q5-C).
  *   **Tree Location:** Yes Obligation → Fixed Others → Non-Causal → Character.

  ### 5. Fatalism / Causal Inefficacy (The "No Difference" View)
  *   **Pattern:** Q1: No (D) | Q3: No (B) | Q5: Same (D) | Q7: No (B or D) | Q9: No (D).
  *   **Core Logic:** If your act does not **guarantee** a change in the outcome, you have no obligation.
  *   **Key Marker:** Rejects probabilistic reasoning (Q7-D) and insists on actual pivotality.
  *   **Tree Location:** Yes Obligation → Fixed Others → Causal Outcome → Actual Pivotality *(Collapses into No Obligation)* OR Root: No Obligation.

  ---

  ## Part 4: Limitations & Unseparated Positions

  This quiz cannot perfectly separate the following positions. Here is why:

  1.  **Kantian Deontology vs. Rule Utilitarianism:**
      *   **Why:** Both rely on universalization ("What if everyone did that?"). In Q9 and Q1, a Kantian and a Rule Utilitarian will give identical answers.
      *   **Distinction:** Kantians focus on *duty/rights* (intrinsically), Rule Utilitarians focus on *good outcomes* (instrumentally). The quiz scenarios focus on harm/outcomes, making it hard to distinguish a duty-based view from a rule-based outcome view.

  2.  **Complicity vs. Virtue Ethics:**
      *   **Why:** Both are non-consequentialist and hold others' actions fixed. Both will say "Don't buy the burger" (Q3) and "Stop your part of the trash" (Q9).
      *   **Distinction:** Complicity is about *relation to the harm* (being part of the group); Virtue is about *internal state* (being a good person). In practice, these recommendations overlap significantly for teenagers.

  3.  **Contractualism (Scanlon) vs. Universalization:**
      *   **Why:** Contractualism asks "Could others reasonably reject this principle?" This often yields the same verdict as "What if everyone did this?"
      *   **Distinction:** Contractualism is about justification to others; Universalization is about logical consistency or aggregate rules. The quiz questions are too brief to capture the "reasonable rejection" nuance.

  4.  **Satisficing Consequentialism:**
      *   **Why:** This view says "Do enough good, not the *most* good."
      *   **Distinction:** The quiz asks binary Yes/No questions about obligation. It doesn't test whether the student feels obligated to maximize the good or just do "their fair share." A Satisficer might answer like an Act Consequentialist on big harms but like a Fatalist on small ones.

  ### Note on the "Variance" and "Capped" Cases
  *   **Variance (Q5/6):** This is the strongest separator for **Risk-Averse Consequentialists** vs. **Standard Consequentialists**. Standard EU theory says Q5 is "Same." Risk-averse views (or Complicity views) say Route B is worse.
  *   **Capped (Q7/8):** This separates **Act Consequentialists** (who must multiply tiny probability by huge capped harm) from **Fatalists** (who see the cap and low probability and say "negligible"). It tests whether the student accepts the "Tiny Chance × Huge Stakes" calculus.
