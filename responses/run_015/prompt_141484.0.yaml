answer: |-
  **Desiderata for Polity Survival Estimation**

  1.  **Operational Identity Criterion** (Non-negotiable): The method must define "polity continuity" via ex-ante observable thresholds (e.g., retention of core territory, sovereignty, or constitutional order) rather than post-hoc cultural continuity.
      *   *Motivation:* Without this, "state death" is indistinguishable from "regime change," rendering the lifespan variable undefined (e.g., is France 2024 the same polity as France 1700?).

  2.  **Censoring and Survivorship Correction** (Non-negotiable): The estimator must explicitly model right-censored data (existing polities) and correct for the fact that historical records only preserve polities that left a trace.
      *   *Motivation:* Currently existing cases are incomplete lifespans; finished cases are a biased sample of everything that started, leading to overestimated survival probabilities if untreated.

  3.  **Partition Invariance** (Non-negotiable): The resulting probability must not swing wildly based on arbitrary choices of time units (years vs. decades) or start dates (founding vs. current constitution).
      *   *Motivation:* Analysts can gerrymander the time unit or start point to manufacture a desired base rate (e.g., counting from a stable constitution vs. initial independence).

  4.  **Ex-Ante Specifiability** (Non-negotiable): All properties defining the reference class must be observable at the start of the forecast horizon without knowledge of the outcome.
      *   *Motivation:* Prevents selecting class properties (e.g., "democracies with stable banks") because we already know which ones survived, which inflates predictive confidence.

  5.  **Informative Specificity** (Non-negotiable): The reference class must be narrow enough to yield a probability distinct from the universal prior (i.e., "everything eventually ends").
      *   *Motivation:* A class like "all political entities" yields a trivial estimate; the method must isolate relevant risk factors to be useful for decision-making.

  6.  **Hazard Function Transparency** (Preference of a camp): The method must declare whether the hazard rate is constant (memoryless) or duration-dependent (aging/vulnerability).
      *   *Motivation:* Resolves the tension between time-invariant estimates and those conditional on duration already survived; some camps argue states age, others argue they stabilize.

  7.  **Epistemic Boundary Condition** (Non-negotiable): The estimate must account for the fact that the historical sample was assembled by past observers with their own recording biases, not by a neutral arbiter.
      *   *Motivation:* The analyst is forecasting from inside the lifetime of the object, using data recorded by agents who had incentives to misclassify or ignore certain failures.

  **Exclusion of Practice**
  The single requirement that excludes the most actual forecasting practice is **Ex-Ante Specifiability**. Most contemporary risk modeling selects reference classes and covariates based on historical correlations known only after the fact, effectively training on the test set.

  **Impossibility Result**
  The subset **{Informative Specificity, Statistical Stability, Ex-Ante Specifiability}** cannot be jointly satisfied. To achieve *Specificity* (a narrow, homogeneous class), one requires detailed covariates that are rarely available *Ex-Ante*; if one restricts variables to *Ex-Ante* availability, the class becomes too broad, reducing *Stability* (sample size) or forcing a trade-off where you must sacrifice Specificity to maintain enough historical cases to correct for Censoring. No method escapes this because information that homogenizes the class is inherently retrospective.

  **Comparison**
  Naive base-rate reasoning fails Ex-Ante Specifiability and Operational Identity by grouping distinct regimes. Narrative reasoning violates Partition Invariance and Ex-Ante Specifiability by overfitting to known outcomes. Duration-based reasoning from a single observation fails Informative Specificity and Epistemic Boundary Conditions by ignoring the historical sample's construction.
