answer: |-
  # SPEAKER PREP SHEET: Narrative-Relational Taurekism
  **Event:** Interdisciplinary Seminar (Tuesday)  
  **Audience:** Moral Philosophers (Taurek-literate), 2 Narrative Theorists, 1 Decision Theorist (EU maximizer)  
  **Thesis:** Anti-aggregation (Taurek-style) applies *only* when victims share a narrative bond. Strangers = Aggregation permitted.

  ---

  ### 1. The Impartiality Objection (The Heavy Hitter)
  **Who:** Senior Moral Philosopher (Taurek skeptic)  
  **The Question:** "You're introducing a morally arbitrary distinction. Why does the metaphysical status of 'loss' change based on whether the victims know each other? Are you saying strangers deserve less moral protection than a book club? This looks like favoritism dressed up as metaphysics."
  **2-Minute Reply:** "I'm not arguing strangers deserve less protection; I'm arguing aggregation *works* differently on them. Taurek's core insight is that there is no 'super-person' who suffers the sum of losses. With strangers, losses are discrete events, so summing them is a useful heuristic for impartial aid. But within a shared narrative, the losses are interdependent—the destruction of the group is a singular catastrophic event for each member, not five separate losses. I'm not privileging the group; I'm respecting the structural integrity of their shared existence."
  **Soft Spot:** The claim that narrative interdependence prevents summing losses is metaphysically shaky.
  **Concede:** Acknowledge that "narrative bond" is a proxy for moral relevance, not the source of it.  
  **Hold Firm:** Aggregation is a tool, not a law; its applicability depends on the relational context of the loss.

  ### 2. The Boundary Problem (The Vagueness Charge)
  **Who:** Narrative Theorist  
  **The Question:** "Where do you draw the line? Is a family a narrative? A town? A nation? If I save a family of four over five strangers because of their 'story,' aren't you just codifying tribalism? Who gets to define the narrative?"
  **2-Minute Reply:** "It's not about size or legal status; it's about *causal and emotional entanglement*. A family's fate is woven; five people waiting at a bus stop are not. I'm not codifying tribalism; I'm recognizing that moral mathematics breaks down when the variables are emotionally fused. We don't need a rigid line, just a heuristic: are their lives lived as a plural subject? If yes, Taurek applies. If no, utilitarianism may proceed."
  **Soft Spot:** "Plural subject" is vague. Philosophers will hammer you on edge cases (e.g., coworkers, teammates).
  **Concede:** Admit there are gray zones (e.g., close friends vs. acquaintances).  
  **Hold Firm:** The extremes are clear (family/unit vs. statistical crowd), and that's where the theory does work.

  ### 3. The Expected Utility Violation
  **Who:** The Decision Theory Guy  
  **The Question:** "This is incoherent. If utility is linear in lives saved, your view is irrational. You're saying I should maximize expected utility in Case A (strangers) but ignore it in Case B (narrative). That opens you to a Dutch Book argument. You're inconsistent."
  **2-Minute Reply:** "Expected utility assumes independent variables. My thesis is that narrative binding makes the variables *dependent*. If a family dies, the utility loss isn't 5x Individual Loss; it's potentially infinite or singular because the surviving meaning structure collapses. I'm not violating rationality; I'm correcting your input data. You're calculating utility on bodies; I'm calculating it on meaningful lives."
  **Soft Spot:** Decision theorists hate non-linear utility functions for human lives.
  **Concede:** Grant that standard EU models can't capture this without modification.  
  **Hold Firm:** Rationality requires accurate modeling of the value at stake, not just counting heads.

  ### 4. The Taurek Purist Objection
  **Who:** Taurek Scholar / Moral Philosopher  
  **The Question:** "Taurek argues numbers *never* count because there is no super-person. You're saying numbers *sometimes* count. Haven't you just abandoned Taurek? If the 'separate persons' argument holds for strangers, why doesn't it hold for families?"
  **2-Minute Reply:** "I'm refining Taurek, not abandoning him. Taurek assumes all groups are merely collections of individuals. I'm arguing that some groups function as a single moral unit due to narrative weave. For strangers, Taurek's 'no super-person' claim is weak—they are just a sum. For a narrative unit, the 'super-person' analogy is actually *stronger*, making aggregation even less appropriate. I'm applying Taurek where it fits best."
  **Soft Spot:** Taurek explicitly rejects the "super-person" idea. You might be misreading him.
  **Concede:** Acknowledge this is a deviation from strict Taurekian text.  
  **Hold Firm:** It's a *development* of the intuition, not a betrayal of it.

  ### 5. The Epistemic Access Problem
  **Who:** Practical Ethicist / Philosopher  
  **The Question:** "In a triage scenario, how do I know? Do I have time to interview the victims about their narrative bonds? This theory is useless in the real world where decisions must be instant."
  **2-Minute Reply:** "Most narrative bonds are visually or contextually apparent (parents holding children, uniformed teams). We make these judgments already—we don't treat a crowd the same as a family. My theory just makes explicit what first responders intuit: that severing a woven life is different than severing isolated ones. If you truly can't tell, default to the stranger protocol (save the most)."
  **Soft Spot:** Relies on stereotypes about what looks like a "bond."
  **Concede:** Admit implementation requires heuristic judgment calls.  
  **Hold Firm:** Moral theory doesn't need to be an algorithm to be valid.

  ### 6. The Narrative Coercion Objection
  **Who:** Narrative Theorist (Critical)  
  **The Question:** "Isn't this dangerous? You're implying people *should* form narratives to gain moral weight. Or worse, that we impose a narrative on them to justify saving fewer of them. It feels exploitative."
  **2-Minute Reply:** "I'm not prescribing how people should live; I'm describing how loss is experienced. We don't impose the narrative; we witness it. And it's not about gaining weight—it's about recognizing that for some, survival is collective. Ignoring that is the exploitation, because it treats them as mere containers of utility rather than authors of a shared story."
  **Soft Spot:** Risks sounding like you value "stories" over "lives."
  **Concede:** Wording must avoid implying stories are *more* valuable than biology.  
  **Hold Firm:** Ignoring relational context is dehumanizing.

  ### 7. The "Moral Math" Reversal
  **Who:** Moral Philosopher (Utilitarian leanings)  
  **The Question:** "So, if I have to choose between 5 strangers and 1 member of a tight-knit narrative group, you're saying I might save the 1? That means being part of a community makes you *harder* to save utilitarianly, but being alone makes you *easier* to aggregate against. That's perverse."
  **2-Minute Reply:** "It's not about making them harder to save; it's about refusing to trade them off. When numbers count (strangers), we maximize survival. When numbers don't count (narrative), we give equal chance. It's not perverse; it's recognizing that some values aren't fungible. You can't trade five chapters of one book for one chapter of five different books."
  **Soft Spot:** The book analogy might fail (books aren't people).
  **Concede:** Acknowledge the counter-intuitive outcome in edge cases.  
  **Hold Firm:** Fungibility of human lives is the real error, not my conclusion.

  ---

  ### 🛑 THE "PRAYING NOBODY ASKS" OBJECTION
  **The Question:** "If narrative bonds prevent aggregation, does this apply to *negative* narratives? Do we owe less to a gang of five criminals because their fates are woven together than to five innocent strangers? Or does your theory inadvertently protect bad actors if they share a strong story?"
  **Why it hurts:** It collapses your moral distinction into mere structural description. If "shared narrative" is the only criterion, you might end up arguing we shouldn't aggregate the losses of a hate group compared to their victims.
  **Emergency Reply:** "Narrative Relational Taurekism is a theory of *loss*, not *desert*. It addresses how we weigh tragedies, not how we judge merit. However, moral justification for saving lives always includes a baseline of innocence/threat assessment. My theory only kicks in *after* we've established all parties are permissible victims of rescue. Don't let me walk into the trap of equating 'shared story' with 'moral worth.'"
  **Prep Note:** If they push this, pivot hard to "baseline permissibility." Do not defend the moral weight of a criminal gang's narrative.

  ---

  **General Tone Tips:**
  *   **Don't apologize** for being a novelist. Use that. You see the "weave" they miss.
  *   **Watch the Decision Theorist.** He's the most likely to try to formalize you into a contradiction. Keep bringing it back to *phenomenology* (how loss feels).
  *   **Watch the Taurek Fans.** They care about the "separate persons" argument. Don't let them say you've abandoned the individual.
  *   **American English:** Keep it punchy. "Here's the thing," "Let's be clear," "The hard truth is."

  *Good luck Tuesday. You got this.*
