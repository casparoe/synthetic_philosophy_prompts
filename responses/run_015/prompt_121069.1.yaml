answer: |-
  ### Conceptual Landscape and Preliminary Analysis

  Before specifying the desiderata, we must map the terrain where personal identity fractures under technological pressure. The core tension lies between *process* and *pattern*. Gradual substrate transition (neuron-by-neuron replacement) leverages the intuition of continuity of process; the light of consciousness never ostensibly turns off, and functional integration is maintained at every micro-step. Instantaneous destructive copying (scanning and reconstruction), by contrast, relies solely on pattern replication across a discontinuity of substance and space-time. A robust theory must explain why the tempo of change matters, or argue convincingly that it does not.

  Complicating this is the boundary of the cognitive system. If cognition is not skull-bound but extends into digital scaffolding (the Extended Mind thesis), then "uploading" the brain while leaving the integrated external tools behind may constitute a lobotomy of the self, regardless of internal substrate fidelity. Furthermore, standard theories of persistence fracture under incremental change due to the Sorites paradox: if replacing one neuron preserves identity, and replacing one neuron from a mostly synthetic brain preserves identity, transitivity suggests the fully synthetic brain is identical to the original. Yet, intuition balks at the endpoints.

  Finally, we must distinguish the *metaphysics* of identity (what makes person A at t1 the same entity as person B at t2) from the *ethics* of survival (what matters to me about my future). A theory may confirm identity persists while admitting what matters (phenomenal continuity) is lost, or vice versa. The following specification outlines the requirements for any theory claiming to resolve these tensions adequately.

  ---

  ### Specification of Desiderata for Personal Persistence

  #### 1. The Temporal Granularity Requirement
  **Requirement:** The theory must explicitly account for the rate of substrate change, distinguishing between continuous gradual replacement and instantaneous discontinuous reconstruction. It must provide a principled reason why the temporal profile of the transition affects identity preservation, or deny that it does with justification.
  **Motivating Case:** Consider the "Teletransporter" (instantaneous destruction and replication) versus the "Ship of Theseus" neuron replacement. Intuitively, most subjects fear the former but accept the latter. A theory that treats them identically must explain away this intuition as error; a theory that distinguishes them must identify the metaphysical threshold where tempo becomes identity-constitutive.
  **Status:** **Non-negotiable.** Any theory that ignores the temporal dimension fails to address the primary phenomenological distinction in uploading scenarios.

  #### 2. The Reversibility and Liminality Condition
  **Requirement:** The theory must specify the identity status of a subject during a partial transition that is subsequently reversed. Specifically, in a case where 40% of cognitive function is mapped to synthetic substrate and then rolled back to biological tissue without data loss, the theory must determine: (a) whether the subject during the 40% phase is numerically identical to the pre-transition subject, (b) whether the post-rollback subject is identical to the pre-transition subject, and (c) whether the "round-trip" introduces any metaphysical residue or branching.
  **Motivating Case:** The Intermittent Reversibility Case. If identity is preserved during the 40% synthetic phase, and preserved during the rollback, transitivity demands the final biological subject is the original. However, if the synthetic phase constituted a distinct entity temporarily inhabiting the biological stream, the rollback might be a replacement rather than a restoration. The theory must resolve this liminal state without contradiction.
  **Status:** **Non-negotiable.** Failure to address reversibility renders the theory incapable of handling dynamic substrate environments.

  #### 3. The Boundary Porosity Constraint
  **Requirement:** The theory must define the spatial and functional boundaries of the self relative to external cognitive scaffolding. It must explain whether identity-bearing continuity includes integrated external digital devices (memory stores, processing aids) prior to internal replacement, and whether removing or migrating these external components during internal substrate shifting constitutes a break in identity.
  **Motivating Case:** Distributed Cognitive Scaffolding. If a subject relies on a neural-linked cloud interface for working memory, uploading the biological brain while severing the link (or failing to upload the interface architecture) may disrupt the cognitive system just as severely as replacing neurons. The theory cannot arbitrarily contract the boundary of the self at the skull if functional integration extends beyond it.
  **Status:** **Preference of the Extended Mind Camp,** but necessary for completeness. Biological theories may reject this, but must explicitly argue against the constitutive role of external tools.

  #### 4. The Non-Branching Specification
  **Requirement:** The theory must adjudicate the status of backup snapshots created during the gradual process. If a backup exists at stage *n* and the process continues to stage *n+1*, the theory must determine what makes the forward-moving stream the "original" rather than a high-fidelity duplicate, or deny that uniqueness is preserved.
  **Motivating Case:** The Branching Problem. If psychological continuity is the sole criterion, both the backup and the forward stream are equally continuous with the original. Yet, subjective anticipation usually privileges the forward stream. The theory must either introduce a "no-branching" constraint, accept that identity divides (and thus survival is not unique), or explain why the forward stream has metaphysical priority.
  **Status:** **Non-negotiable.** A theory that cannot handle branching fails in any digital environment where copying is trivial.

  #### 5. Phenomenal Binding Continuity
  **Requirement:** The theory must address the preservation of subjective experience (qualia) across substrate gaps. It must state whether temporary fragmentation of phenomenal binding (e.g., during the switch-over of a neural cluster) is compatible with survival, and how it distinguishes between a loss of continuity (death) and a mere functional interruption (sleep/anesthesia).
  **Motivating Case:** Phenomenal Binding. Functional isomorphism does not guarantee phenomenal identity. A system could function perfectly while the "light" of consciousness is extinguished and replaced by a new instance. The theory must provide a criterion for when the *subject of experience* persists, not just the *structure of processing*.
  **Status:** **Non-negotiable** for any theory claiming to address *personal* persistence rather than mere information preservation.

  #### 6. The Tripartite Distinction Clause
  **Requirement:** The theory must maintain strict conceptual separation between: (a) Strict Numerical Identity (being the very same entity), (b) Psychological Continuity (sharing memories, traits, and capacities), and (c) Survival vs. Flourishing (what matters prudentially vs. ontological status). It must not collapse the original biological organism into a functionally equivalent successor system without explicit justification.
  **Motivating Case:** Conceptual Clarity. Confusing "my successor will act like me" with "I will survive" leads to ethical errors. Similarly, conflating organismic persistence with psychological persistence obscures whether uploading is a migration or a succession.
  **Status:** **Non-negotiable.** Conceptual coherence requires these distinctions remain visible even if the theory argues they coincide in practice.

  ---

  ### Empirical and Philosophical Constraints

  Any adequate theory must respect the following established findings and philosophical constraints:

  1.  **Neural Plasticity:** Neuroscience confirms that the biological brain is in a state of constant flux regarding synaptic weights and cellular turnover. A theory requiring strict material continuity of specific atoms is empirically falsified. Persistence must be compatible with gradual material turnover.
  2.  **The Extended Mind Thesis:** Cognitive science increasingly treats tools and environmental structures as constitutive parts of cognitive processing. A theory that insists on skull-bound cognition must provide a positive argument for why biological tissue is metaphysically privileged over functionally integrated silicon.
  3.  **The Unity of Consciousness:** Phenomenology suggests experience is unified at any given moment. A theory that suggests the self fragments into multiple concurrent subjects during processing gaps must explain how this unity is restored or whether it is an illusion.
  4.  **Causal Continuity:** Standard metaphysics requires a causal connection between temporal stages of an object. Discontinuous jumping (teleportation) lacks standard causal chains unless information transfer is accepted as a causal mechanism.

  ### Jointly Unsatisfiable Desiderata (The Tension Map)

  No theory can satisfy all intuitive demands without contradiction. The following pairs represent fundamental tensions where a theory must choose one horn of the dilemma:

  *   **Strict Numerical Identity vs. Full Substrate Independence:** You cannot maintain that the uploaded entity is *numerically identical* to the biological organism (in the strict sense of being the same physical object) while also claiming the substrate is irrelevant. If substrate matters, uploading breaks identity. If substrate does not matter, identity is pattern-based, which invites the branching problem (where one pattern becomes two).
  *   **Boundary Porosity vs. Organismic Integrity:** If you accept that external scaffolding is constitutive of the self (Extended Mind), you undermine the integrity of the biological organism as the sole vessel of identity. If you insist on Organismic Integrity, you must argue that deeply integrated external tools are merely contingent aids, despite functional evidence to the contrary.
  *   **Phenomenal Continuity vs. Functional Isomorphism:** If you demand that subjective experience must be continuously unbroken (no gaps), you may rule out certain uploading processes that involve pauses or reboots. If you accept Functional Isomorphism as sufficient, you risk allowing "zombie" successors that function like you but lack your specific phenomenal history.

  ---

  ### Evaluation of Broad Theoretical Families

  Below is a scoring of three dominant families of view against the specified desiderata. The weight is on adherence to the criteria rather than metaphysical popularity.

  #### 1. Psychological-Continuity Theories
  *   **Core Claim:** Persistence is grounded in the continuity of memory, character, and psychological connections.
  *   **Performance:**
      *   *Temporal Granularity:* **High.** Easily accommodates gradualism; struggles slightly to explain why instantaneous copying feels different unless causality is emphasized.
      *   *Reversibility:* **High.** Handles rollback well as long as psychological connections are restored.
      *   *Boundary Porosity:* **Medium.** Can accommodate extended cognition if psychological states are distributed, but traditionally focuses on internal memory.
      *   *Branching:* **Low.** Famously struggles here. If psychology is copied, both branches are equal. Requires an ad-hoc "non-branching" clause to preserve uniqueness.
      *   *Phenomenal Binding:* **Medium.** Often sidelines qualia in favor of functional memory states.
      *   *Distinctions:* **High.** Clearly separates identity from bodily continuity.
  *   **Verdict:** Strong on intuition and gradualism, but fails the Non-Branching Specification without modification.

  #### 2. Embodied or Animalist Accounts
  *   **Core Claim:** Persistence is grounded in the continuity of the living biological organism.
  *   **Performance:**
      *   *Temporal Granularity:* **High.** Naturally aligns with biological metabolism and gradual turnover.
      *   *Reversibility:* **High.** As long as the organism lives, identity holds.
      *   *Boundary Porosity:* **Low.** Explicitly rejects external scaffolding as constitutive of identity. Violates the Boundary Porosity Constraint unless argued against.
      *   *Branching:* **High.** Biological organisms do not branch (twins are new organisms). Solves branching by denying uploading is survival.
      *   *Phenomenal Binding:* **High.** Ties experience strictly to biological life processes.
      *   *Distinctions:* **Low.** Collapses identity into biological survival, potentially ignoring what matters prudentially (psychological continuity).
  *   **Verdict:** Metaphysically robust and handles branching well, but fails the Temporal Granularity Requirement regarding uploading (implies death upon full substitution) and rejects Boundary Porosity.

  #### 3. Patternist or Functionalist Approaches
  *   **Core Claim:** Persistence is grounded in the preservation of informational structure and computational function, regardless of substrate.
  *   **Performance:**
      *   *Temporal Granularity:* **Low.** Often treats instantaneous and gradual transfer as equivalent, violating strong intuitions about process.
      *   *Reversibility:* **Medium.** Treats rollback as data restoration, but struggles with the identity of the intermediate state.
      *   *Boundary Porosity:* **High.** Naturally accommodates distributed cognition as long as the functional system is preserved.
      *   *Branching:* **Low.** Like psychological theories, if the pattern is copied, identity is copied. Struggles to privilege the forward stream.
      *   *Phenomenal Binding:* **Low.** Often assumes functional equivalence guarantees phenomenal continuity, which is contested.
      *   *Distinctions:* **Medium.** Good at separating organism from successor, but often collapses identity into continuity.
  *   **Verdict:** Best fit for technology and extended mind, but fails the Temporal Granularity Requirement and struggles with Phenomenal Binding and Branching.

  ### Final Assessment
  No existing family satisfies all desiderata perfectly. The **Psychological-Continuity** framework offers the best balance for gradual uploading but requires修补 (repair) to handle branching. The **Animalist** account is the only one that preserves strict numerical identity without contradiction but at the cost of ruling out uploading as survival. The **Patternist** view is most technologically compatible but risks dissolving the self into replicable data, failing the Phenomenal Binding and Temporal Granularity requirements. An adequate theory must likely be a hybrid: grounding identity in causal psychological continuity while imposing a non-branching constraint and acknowledging the constitutive role of extended cognitive scaffolding.
