answer: |-
  First, a quick note: you spelled it "epistimic" in your notes; the correct spelling is **epistemic**. I'll use the correct spelling below so you can copy-paste this into your group materials without editing.

  Here is the **15-Minute Epistemic Audit Procedure**. It is designed to be run live during your deliberation sessions. It forces the transparency threshold and domain-distance factors you described, while explicitly flagging where you are inevitably making subjective calls.

  ### The 15-Minute Epistemic Audit Checklist

  **Time Limit:** 15 Minutes per argument.
  **Goal:** Output one of three verdicts: **UPDATE**, **DEFER TO BASE RATE**, or **NO UPDATE**.

  #### Step 1: The Transparency Dump (5 Minutes)
  The proponent of the argument must write out the core reasoning chain for their claim.
  *   **Constraint A:** Maximum 200 words.
  *   **Constraint B:** No filler phrases (e.g., "obviously," "it stands to reason," "clearly," "everyone knows").
  *   **Action:** Write the argument. Count words. Scan for filler.
  *   **Gate 1 Result:**
      *   **PASS:** Meets both constraints. (Inside View Weight = 1.0)
      *   **FAIL:** Exceeds word count OR uses filler. (Proceed to Step 2 to calculate penalty).

  #### Step 2: Domain Distance Assessment (2 Minutes)
  *Only required if Step 1 is a FAIL.*
  Determine how close the topic is to the proponent's formal expertise or coursework.
  *   **Near:** Topic is within current major/coursework (e.g., CS student on algorithms).
      *   **Factor:** 0.5
  *   **Far:** Topic relies on general knowledge, moral intuition, or unrelated fields (e.g., Phil student on AI safety, Econ student on moral reparations).
      *   **Factor:** 0.2
  *   **[JUDGEMENT CALL 1]:** Deciding what counts as "coursework" vs. "general knowledge" is subjective. Be strict.
  *   **Calculation:** Inside View Weight = Factor (0.5 or 0.2).
  *   *Note: If Step 1 was a PASS, Inside View Weight remains 1.0.*

  #### Step 3: Reference Class Search (5 Minutes)
  Look for an outside view (base rate) for the claim being made.
  *   **Query:** "In how many similar historical cases did this claim turn out true?"
  *   **Gate 2 Result:**
      *   **CLEAR:** You can find a specific, relevant statistical base rate or consensus among verified experts. (Outside View Strength = HIGH)
      *   **AMBIGUOUS:** No direct data exists; you must broaden the class (e.g., using "economic policy failures" instead of "carbon tax failures").
      *   **Action:** If AMBIGUOUS, flag Outside View as **NOISY**. (Outside View Strength = LOW).
      *   **[JUDGEMENT CALL 2]:** Deciding if a reference class is "similar enough" is subjective. If you have to stretch the analogy, it is Ambiguous.

  #### Step 4: Weighting & Verdict (3 Minutes)
  Compare Inside View Weight (IVW) against Outside View Strength (OVS).

  *   **Scenario A:** IVW is 1.0 (Transparency Pass).
      *   **Verdict:** **UPDATE** (Unless Outside View directly contradicts with HIGH strength).
  *   **Scenario B:** IVW is ≤ 0.5 (Transparency Fail) AND Outside View is HIGH.
      *   **Verdict:** **DEFER TO BASE RATE** (Ignore the inside argument; adopt the base rate).
  *   **Scenario C:** IVW is ≤ 0.5 (Transparency Fail) AND Outside View is NOISY.
      *   **Verdict:** **NO UPDATE** (Insufficient evidence on either side; maintain prior belief).
  *   **[JUDGEMENT CALL 3]:** If IVW is 0.5 and OVS is HIGH, do you defer or update? This procedure says **DEFER**, but you may feel tension here. Stick to the rule.

  ---

  ### Test Run 1: The CS Grad Student
  **Argument:** A specific fairness metric is unreliable because of analogies to Simpson's Paradox.
  **Proponent:** CS Grad Student.

  1.  **Transparency Dump:** Student writes: "Metric M aggregates data across groups. If group sizes differ significantly, the trend reverses when aggregated versus disaggregated. This is structurally identical to Simpson's Paradox. Therefore, M yields false positives in heterogeneous populations." (45 words. No filler.)
      *   **Gate 1:** **PASS**. (IVW = 1.0)
  2.  **Domain Distance:** Not needed (Step 1 Passed).
  3.  **Reference Class:** Is there a base rate for this metric failing?
      *   **Search:** Literature shows this specific paradox occurs in 40% of heterogeneous datasets using this metric.
      *   **Gate 2:** **CLEAR**. (OVS = HIGH).
  4.  **Verdict:** IVW is 1.0. Outside View confirms the risk.
      *   **Output:** **UPDATE**. (Collective stance should shift to acknowledge the metric is unreliable).

  ### Test Run 2: The Econ Undergrad
  **Argument:** Carbon-tax reparations are morally required based on intuition and one historical comparison to post-war reparations.
  **Proponent:** Econ Undergrad.

  1.  **Transparency Dump:** Student writes: "It stands to reason that if you damage something, you pay for it. Obviously, climate change is damage. Historically, after wars, winners paid losers. So rich nations should pay poor nations. It is clearly the right thing to do." (65 words. Uses "stands to reason," "obviously," "clearly".)
      *   **Gate 1:** **FAIL**. (Proceed to Step 2).
  2.  **Domain Distance:** Is moral philosophy/intuition part of Econ coursework?
      *   **Assessment:** No, this is moral intuition + loose history.
      *   **Factor:** **0.2** (Far).
      *   **IVW:** 0.2.
  3.  **Reference Class:** Base rate for successful reparations schemes?
      *   **Search:** Post-war reparations are unique; climate reparations have no direct historical precedent.
      *   **Gate 2:** **AMBIGUOUS**. (OVS = NOISY).
  4.  **Verdict:** IVW is 0.2. Outside View is NOISY.
      *   **Output:** **NO UPDATE**. (The argument carries too little epistemic weight to shift the collective stance, and there is no solid base rate to defer to).

  ### Test Run 3: Your Belief (AI Existential Risk)
  **Argument:** AI existential risk is overblown.
  **Proponent:** You (Philosophy Student).

  1.  **Transparency Dump:** You attempt to write your reasoning.
      *   *Draft:* "Basically, people panic about new tech. It stands to reason that AI is just tools. Obviously, humans control the off switch. The doomers don't have proof. It seems like hype."
      *   *Critique:* Uses "Basically," "stands to reason," "Obviously," "seems like." Word count is low, but filler density is high.
      *   **Gate 1:** **FAIL**. (You cannot trace the steps of *why* risk is overblown without relying on intuition markers).
  2.  **Domain Distance:** Is AI safety modeling part of Philosophy coursework?
      *   **Assessment:** No. You are analyzing technical risk profiles from a philosophical distance.
      *   **Factor:** **0.2** (Far).
      *   **IVW:** 0.2.
  3.  **Reference Class:** Base rate for expert consensus on AI risk?
      *   **Search:** Surveys of AI researchers show a non-trivial median probability of catastrophic outcomes (often >10%).
      *   **Gate 2:** **CLEAR** (There is a measurable expert consensus, even if disputed). (OVS = HIGH).
  4.  **Verdict:** IVW is 0.2. Outside View is HIGH.
      *   **Rule:** Scenario B (IVW ≤ 0.5 AND OVS HIGH) → **DEFER TO BASE RATE**.
      *   **Output:** **DEFER TO BASE RATE**.
      *   **Implication:** You must downgrade your confidence that the risk is "overblown." Your inside view has been penalized to 0.2 weight due to lack of transparency and domain distance. The procedure dictates you align closer to the expert base rate, not your intuition.
      *   **[JUDGEMENT CALL 3 FLAG]:** You will feel resistance here. You might feel the expert base rate is "biased." The procedure forbids you from using that counter-argument unless you can pass Step 1 (Transparency) with technical evidence. Since you failed Step 1, you must defer.

  ### Implementation Notes for Your Group
  *   **Hard Stop:** If Step 1 takes more than 5 minutes, mark it as a **FAIL** automatically. Rambling is a transparency failure.
  *   **The "No Update" Trap:** If you get **NO UPDATE** (Scenario C), do not treat it as validation of your prior belief. Treat it as "Insufficient Evidence to Move."
  *   **Judgement Calls:** Steps marked **[JUDGEMENT CALL]** are where bias hides. If the group disagrees on whether a word is "filler" or a domain is "Near," vote on the classification before proceeding to the math. This makes the bias part of the record.
