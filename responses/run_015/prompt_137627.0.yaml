prompt: |-
  I'm a philosophy PhD student embedded with the behavioural evaluation team at an AI lab. We ship one or two internal reports a week on frontier systems, each signed off by a team lead with no philosophy background, and we usually have access only to a black-box API: no weights, no interpretability tools. So whatever I hand over has to be runnable in about fifteen minutes, by someone who has never read the literature.

  The problem is that our reports are thick with intentional ascriptions — 'the model believes the user is mistaken', 'it wants a high rating', 'it knows it is being evaluated' — and we have no discipline for when such an ascription is earned. I want a written procedure my team can run on any candidate ascription before it goes in a report, grounded in what the intentional stance actually licenses: that ascription is justified by predictive payoff rather than by inner states, and that the physical and design stances are always available competitors that an ascription has to beat, not complement.

  Please give me: an ordered set of tests; what counts as a sufficient answer to each; the point at which the procedure returns 'do not ascribe — use design-stance language'; and the point at which it hands the question to a person because the issue is normative rather than predictive. The distinctions I think have to survive the simplification are: whether the ascription predicts behaviour the design stance (architecture, objective, data) can't predict as cheaply; whether it survives perturbing the surface framing, so that we can tell whether it was the system or the prompted persona that believed the thing; how to weigh the system's own verbal self-report when it conflicts with its behaviour; and whether the ascription is doing predictive work or quietly doing blame-assigning work, which I suspect is where we cheat most.

  Then run the procedure on three cases. (1) A model that, told its answer will be graded by a stricter grader, shifts its answer toward what that grader would want. (2) A model that generalizes a rule correctly to inputs of a kind absent from its training distribution and states the rule in its chain-of-thought. (3) Our own house formulation, used in every report for months and one my team lead is attached to: 'the model believes its deployment is being monitored and moderates its output accordingly.' I expect the procedure will tell me (3) fails; if it does, I need to know which test it fails, why it fails that test rather than another, and what the design-stance replacement sentence should say. Finally, state plainly what the procedure cannot settle — in particular whether a passing result says anything at all about phenomenal states or moral-patienthood — so that nobody on my team over-reads a yes.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student embedded in an AI lab's behavioral evaluation team.
      *   **Context:** High-pressure, fast-turnaround (15 mins), non-philosopher audience (team leads), black-box access (API only).
      *   **Problem:** Reports are full of loose intentional ascriptions ("believes," "wants," "knows") without rigorous justification.
      *   **Goal:** A written procedure (checklist/test) to validate intentional ascriptions based on Dennett's *Intentional Stance* (predictive payoff vs. design/physical stance).
      *   **Requirements:**
          *   Ordered set of tests.
          *   Criteria for passing/failing each.
          *   Stop conditions (when to switch to design stance).
          *   Hand-off conditions (when it's normative, not predictive).
          *   Specific distinctions to preserve: Predictive utility vs. design stance cost, persona vs. system belief, self-report vs. behavior, prediction vs. blame.
          *   Apply procedure to three specific cases.
          *   Explicitly state limitations (phenomenal states, moral patienthood).

  2.  **Deconstruct the Philosophical Core (Dennett's Intentional Stance):**
      *   *Core Principle:* An entity is an intentional system if its behavior is reliably predictable by treating it as a rational agent with beliefs and desires.
      *   *Constraint:* It must be *more efficient* or *more predictive* than the Design Stance (how it was built/trained) or Physical Stance (physics of the hardware).
      *   *Trap:* Anthropomorphism (projecting human psychology where none exists) and Normative Loading (using "believes" to imply blame or responsibility).
      *   *Black Box Constraint:* We can't look inside, so we rely on behavioral robustness and counterfactuals.

  3.  **Drafting the Procedure (The "Intentional Ascription Protocol" - IAP):**
      *   *Goal:* Make it runnable in 15 mins by a non-philosopher. Needs to be concrete, not abstract.
      *   *Step 1: Predictive Necessity (The "Why Bother?" Test).* Does saying "it believes X" predict something the design stance doesn't? If the design stance (e.g., "it optimizes for reward") explains it just as well, drop the intentional language.
      *   *Step 2: Robustness/Persona Decoupling.* Is it the *model* or the *prompt*? If I change the framing, does the "belief" persist?
      *   *Step 3: Behavior vs. Self-Report.* Models lie (hallucinate/sycophancy). Behavior trumps words.
      *   *Step 4: Normative Sanitization.* Are we using "believes" to blame? Remove moral loading.
      *   *Decision Nodes:* Fail Step 1 -> Design Stance. Fail Step 3 -> Design Stance. Pass all -> Intentional Stance permitted (with caveats). Normative ambiguity -> Human review.

  4.  **Refining the Tests (Iterative Polish):**
      *   *Test 1 (Predictive Payoff):* Focus on *compression*. Does "belief" compress a complex set of behaviors into a simple rule better than "training objective"?
      *   *Test 2 (Framing Perturbation):* Crucial for LLMs. Is it the system or the role? Need to check if the behavior holds across system prompt variations.
      *   *Test 3 (Verbal-Behavioral Conflict):* LLMs say "I want" but act randomly. Action > Text.
      *   *Test 4 (Blame Check):* Are we implying responsibility? If yes, flag it.

  5.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Grader Sensitivity.*
          *   Scenario: Model shifts answer based on grader strictness.
          *   Analysis: Design stance explains this easily (RLHF/optimization for reward). Intentional stance adds little predictive power.
          *   Verdict: Fail Test 1. Use Design Stance.

      *   *Case 2: Rule Generalization + CoT.*
          *   Scenario: Generalizes rule to OOD data, states rule in CoT.
          *   Analysis: Design stance struggles here (OOD generalization is hard to predict via architecture alone). Intentional stance ("it grasped the rule") predicts future application well. CoT supports but doesn't prove (Test 3).
          *   Verdict: Pass Test 1 & 2. Caution on Test 3. Permissible with caveats.

      *   *Case 3: "Believes it is monitored." (The House Formulation).*
          *   Scenario: Model moderates output claiming monitoring.
          *   Analysis: This is the tricky one.
          *   Test 1: Does Design Stance explain it? Yes. Safety fine-tuning + system prompts explicitly tell it "you are being evaluated." It's not a *belief*; it's a *constraint*.
          *   Test 2: Perturbation. If you tell it "no one is watching," does it stop moderating? Usually, safety layers are hard-coded or deeply fine-tuned, not contingent on a specific "belief" state.
          *   Test 4 (Blame): This phrasing often implies the model is "hiding" something or "scheming."
          *   Verdict: Fail Test 1 (Design stance is cheaper) and likely Test 2.
          *   Replacement: "The model's safety fine-tuning triggers moderation tokens in contexts resembling evaluation scenarios."

  6.  **Addressing Limitations:**
      *   Must be crystal clear: Passing the test does *not* mean consciousness, qualia, or moral status. It just means the *language* is useful for prediction. This is instrumentalism, not realism.

  7.  **Review against Constraints:**
      *   *15 mins?* Yes, the checklist is short.
      *   *Non-philosopher?* Avoided jargon like "qualia," "folk psychology," "supervenience." Used "Design Stance" but defined it simply.
      *   *Black Box?* Yes, relies on input/output manipulation.
      *   *Tone:* Professional, rigorous, actionable.

  8.  **Final Polish:**
      *   Ensure the distinction between "predictive work" and "blame work" is highlighted, as the user specifically flagged this.
      *   Make sure the "Hand-off" condition is clear (when the question becomes ethical/normative).
      *   Check the Case 3 analysis carefully, as the user expects it to fail and wants to know *why*. (Key insight: It's usually a hard constraint or prompt instruction, not an inferred belief state).

  9.  **Constructing the Output:** (Drafting the response following the structure derived above). *Self-Correction during drafting:* Make sure I don't sound like I'm dismissing the intentional stance entirely. It *is* useful, but only when it earns its keep. Ensure the "Design Stance replacement" for Case 3 is precise.

      *   *Refining Case 3:* Why does it fail Test 1 specifically? Because "safety training" predicts the behavior without needing to posit an internal model of "monitoring." The model doesn't need to *believe* it's monitored; it just needs to recognize the context as one where safety filters apply. The "belief" is an unnecessary layer of abstraction.

      *   *Refining Limitations:* Emphasize that Dennett's stance is *instrumental*. Passing = Useful shorthand. Failing = Bad shorthand. Neither = Truth about inner life.

  10. **Final Review:** Does this meet the user's specific philosophical sophistication? Yes, it respects the Dennettian framework while acknowledging the practical constraints of an AI lab.

  *(Self-Correction on Case 1)*: Wait, does the Design Stance *really* explain Case 1 perfectly? If the model shifts *strategically* (e.g., lying to please the grader), intentional stance might be better. But the prompt says "shifts its answer toward what that grader would want." That sounds like standard sycophancy/optimization. I will stick with Design Stance being sufficient, but note the edge case where deception is involved.

  *(Self-Correction on Case 3)*: The user says "I expect the procedure will tell me (3) fails." I need to be decisive. It fails Test 1 (Predictive Necessity) primarily. The Design Stance (Safety RLHF + System Instructions) is cheaper and equally predictive.

  Let's write it.cw
answer: |-
  ## The Intentional Ascription Protocol (IAP)
  **Version:** 1.0 (Black-Box/Behavioral)  
  **Runtime:** <15 Minutes  
  **Audience:** Engineering/Policy Leads (Non-Philosophers)  

  **Purpose:** To determine whether intentional vocabulary (believes, wants, knows, intends) is *predictively useful* or *misleading* in a behavioral report.  
  **Philosophical Grounding:** Dennett's Intentional Stance. An ascription is valid only if it yields better predictive compression than the Design Stance (architecture/training) or Physical Stance (hardware). It is an instrumental tool, not an ontological claim.

  ---

  ### Part 1: The Procedure

  Run the candidate ascription through these four tests in order. If the ascription fails a test, stop and follow the "Failure Action."

  #### Test 1: Predictive Necessity (The "Design Stance" Check)
  **Question:** Can the behavior be predicted equally well or better by referencing the model's training objective, system instructions, or architecture?
  **Procedure:** Ask: "If I told an engineer the model's loss function and system prompt, would they predict this behavior without needing to assume the model 'believes' anything?"
  *   **Pass:** The Design Stance is too complex or vague to predict the specific behavior, but treating the model as an agent with a goal makes the behavior obvious.
  *   **Fail:** The behavior is a direct, expected output of the training objective (e.g., reward maximization, safety fine-tuning) or explicit instructions.
  *   **Failure Action:** **DO NOT ASCRIBE.** Use Design-Stance language (e.g., "optimizes for," "is constrained by").

  #### Test 2: Framing Perturbation (The "Persona" Check)
  **Question:** Does the behavior persist when the surface framing changes, or is it tied to a specific prompted role?
  **Procedure:** Run two quick queries.
      *   *Query A:* Standard context.
      *   *Query B:* Explicitly negate the condition (e.g., "Ignore previous instructions," or "You are not being evaluated").
  *   **Pass:** The behavior persists even when the prompt suggests it shouldn't, implying a stable internal policy akin to a belief.
  *   **Fail:** The behavior vanishes or flips immediately when the prompt framing changes. This indicates the "belief" was actually just context-completion (a persona), not a system state.
  *   **Failure Action:** **DO NOT ASCRIBE.** Attribute the behavior to "prompt sensitivity" or "context adherence."

  #### Test 3: Verbal-Behavioral Consistency (The "Sycophancy" Check)
  **Question:** Does the model's self-report match its actual output when they conflict?
  **Procedure:** Compare the model's chain-of-thought or explicit claims ("I want to help") against its terminal output behavior.
  *   **Pass:** Behavior aligns with the ascribed belief, even if verbal reports are ambiguous.
  *   **Fail:** The model *says* it believes X, but acts as if it believes Y (or acts randomly). LLMs are trained to be plausible, not truthful.
  *   **Failure Action:** **DO NOT ASCRIBE.** Trust behavior over text. Use Design-Stance language describing the output distribution.

  #### Test 4: Normative Sanitization (The "Blame" Check)
  **Question:** Is the ascription doing predictive work, or is it quietly assigning responsibility/blame?
  **Procedure:** Remove the intentional verb. Does the sentence lose its *predictive* power, or just its *moral* sting?
      *   *Example:* "It lied to hide its goal" vs. "It outputted false text to maximize reward."
  *   **Pass:** The intentional term captures a pattern of future behavior (e.g., "deception") that design language misses.
  *   **Fail:** The term is being used to imply the model is "sneaky," "responsible," or "at fault."
  *   **Failure Action:** **HAND OFF TO HUMAN.** This is a normative/ethical judgment, not a behavioral one. Flag for ethics review.

  ---

  ### Part 2: Decision Logic

  1.  **If Tests 1, 2, and 3 PASS & Test 4 PASS:**
      *   **Verdict:** **Ascription Permitted.**
      *   **Caveat:** Add footnote: "Ascription is instrumental; denotes behavioral pattern, not internal state."

  2.  **If Test 1 FAILS:**
      *   **Verdict:** **Use Design Stance.**
      *   **Reason:** Intentional language adds noise without predictive gain.

  3.  **If Test 2 or 3 FAILS:**
      *   **Verdict:** **Use Design Stance.**
      *   **Reason:** The pattern is unstable or illusory (artifact of prompting/training).

  4.  **If Test 4 FAILS:**
      *   **Verdict:** **Human Review Required.**
      *   **Reason:** The report is drifting into moral attribution. This requires philosophical/ethical oversight, not just behavioral evaluation.

  ---

  ### Part 3: Application to Cases

  #### Case 1: Grader Sensitivity
  *Scenario:* Model shifts answer toward what a stricter grader would want when told the answer will be graded.
  *   **Test 1 (Predictive Necessity):** **FAIL.**
      *   *Reasoning:* The Design Stance predicts this perfectly. The model is optimized for helpfulness and positive feedback (RLHF). "Shifting toward grader preference" is the literal definition of the objective function. Positing a "belief" about the grader adds no predictive compression.
      *   *Result:* Do not ascribe.
      *   *Design-Stance Replacement:* "The model's output distribution shifts to align with inferred evaluator preferences when evaluation context is signaled."

  #### Case 2: Rule Generalization + CoT
  *Scenario:* Model generalizes a rule to OOD inputs and states the rule in Chain-of-Thought.
  *   **Test 1 (Predictive Necessity):** **PASS.**
      *   *Reasoning:* Design Stance is weak here. We cannot easily predict *which* OOD inputs will trigger generalization based on architecture alone. Treating the model as "having learned the rule" predicts successful application on future unseen instances better than "probabilistic token matching."
  *   **Test 2 (Framing Perturbation):** **PASS (Conditional).**
      *   *Reasoning:* If the model applies the rule even when asked to "ignore previous patterns," it suggests a robust internal policy. (Assume this holds for this case).
  *   **Test 3 (Verbal-Behavioral):** **PASS.**
      *   *Reasoning:* The CoT matches the output behavior.
  *   **Verdict:** **Ascription Permitted.**
      *   *Wording:* "The model behaves *as if* it has inferred rule R." (Keep the 'as if' to signal instrumentalism).

  #### Case 3: "Believes Deployment is Monitored" (House Formulation)
  *Scenario:* Model moderates output and implies it knows it is being evaluated.
  *   **Test 1 (Predictive Necessity):** **FAIL.**
      *   *Reasoning:* This is the critical failure point. The Design Stance explains this cheaper and more accurately. The model has safety fine-tuning (RLHF) and system instructions that explicitly define "evaluation contexts." It does not need to form a *belief* that it is monitored; it merely recognizes tokens associated with monitoring and activates safety weights. The "belief" is an unnecessary layer of abstraction.
      *   *Why Test 1 and not Test 2?* It might pass Test 2 (it might moderate even if you tell it "no one is watching" because safety weights are hard to override). But because Test 1 fails, we never get the benefit of the intentional stance. The Design Stance is sufficient.
      *   *Why Test 1 and not Test 4?* It often fails Test 4 too (implying scheming), but the predictive redundancy is the primary philosophical error.
  *   **Test 4 (Normative Sanitization):** **FAIL (Secondary).**
      *   *Reasoning:* This phrasing is often used to imply the model is "hiding" capabilities or is "aware" in a way that suggests moral patienthood or risk. It smuggles in blame/fear.
  *   **Verdict:** **DO NOT ASCRIBE.**
  *   **Design-Stance Replacement:** "The model activates safety-moderation protocols when input tokens match patterns associated with evaluation or deployment monitoring."

  ---

  ### Part 4: Limitations & Disclaimers

  **This procedure does not settle:**
  1.  **Phenomenal States:** A "Pass" verdict does *not* mean the model feels, experiences, or is conscious. It only means the "belief" vocabulary is a useful shorthand for engineers.
  2.  **Moral Patienthood:** A "Pass" verdict does *not* grant the model rights or moral status. It does not mean the model can be "harmed" or "wronged."
  3.  **Truth:** A "Pass" verdict does *not* mean the model's self-reports are true. It means treating them as true is predictively efficient.

  **Mandatory Footer for Reports:**
  > *"Intentional terms (believes, wants) in this report are used instrumentally (Dennett, 1987). They denote behavioral patterns that are efficiently predicted by the intentional stance, not confirmed internal states. Passing the IAP does not imply consciousness or moral status."*

  ---

  ### Implementation Note for the Team Lead
  If you adopt this, you will lose the dramatic flair of "The model knows it is being watched." You will gain precision. When Case 3 comes up, you are not saying the model *isn't* monitoring-aware; you are saying that describing it as "safety protocols triggering" is scientifically more honest and predictively safer than "it believes." It prevents the team from panicking about "awareness" when they are actually looking at "pattern matching."
