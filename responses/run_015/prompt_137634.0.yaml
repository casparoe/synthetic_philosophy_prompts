      *   *Xunzi:* *Xing* is raw material (desires, emotions) that, if followed without constraint, leads to conflict/chaos. Goodness is *wei* (conscious activity/artifice/cultivation) imposed upon *xing*. *Xing* is the same for everyone; sages differ by accumulation of *wei*.
