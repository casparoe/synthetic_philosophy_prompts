      *   Section 1: Translation (Mencius, Xunzi, Tinbergen's questions).
      *   Section 2: The Residue (Universality, Normativity, Wei, Teleology).
      *   Section 3: The Verdict (Limits vs. Confusion, The Bare Rearing Test).

  9.  **Writing the content (incorporating the "no quote" rule strictly).**

      *   *Mencius:* Reaction norm biased toward cooperation. Canalization of virtue.
      *   *Xunzi:* Reaction norm of raw drives. Goodness is a constructed niche product.
      *   *Residue:* Normativity, Teleology, The Dualism of Wei.
      *   *Verdict:* The biological framework dissolves the empirical disagreement but exposes the normative divergence. The "Bare Rearing" test is a category error.

      *(Final check on constraints)*: "Paraphrase rather than quote." I will ensure no Chinese characters are used unless defined as terms, and no classical text is quoted. I will use the biologist's terms explicitly.

      *Wait, one nuance:* The prompt asks to say *which of the four explanatory questions* each position is answering. Tinbergen's four: Mechanism (Causation), Ontogeny (Development), Function (Survival Value), Phylogeny (Evolution).
      *   Mencius: Mostly Ontogeny (how virtue grows) and Function (why we are social).
