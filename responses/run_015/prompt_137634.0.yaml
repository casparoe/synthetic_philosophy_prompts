      *   *Item 2: Normativity of "Good".* Biological "good" = fitness/functioning. Moral "good" = social harmony/ritual propriety. The biologists' vocabulary is descriptive; the philosophers' is prescriptive.
      *   *Item 3: Xunzi's Wei.* It means "artificial" but also "effort." In DST, everything is constructed. Xunzi creates a dualism (Nature vs. Artifice) that DST rejects (everything is nature-nurture entanglement). *Wei* sits outside the reaction norm.
      *   *Item 4 (Additional): Teleology.* Mencius thinks nature *aims* at goodness. Evolution is blind. This is a fundamental clash.

  5.  **Formulate the Verdict (Task 3):**
