      *Let's refine the "Bare Rearing" verdict.* If the biologist asks "What happens at age 20?", Mencius might say "Stunted but potentially recoverable if sprouts remain." Xunzi might say "Beast-like, driven by appetite." The *difference* is real but secondary to the main point: Both say "Not a moral agent." The *interesting* disagreement is about where moral authority comes from, not the empirical outcome of neglect.

