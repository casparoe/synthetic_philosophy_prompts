  Here is an analysis of Eventual Dominance (ED), ranked by the severity of the defeaters, followed by an assessment of the specific theoretical challenges you raised.

  ### 1. Fatal Defeaters (Logical and Structural Coherence)

  **The Non-Transitivity of Indifference**
  For ED to function as a rational preference ordering, the relation "at least as good as" ($\succeq$) must be transitive. ED defines $A \sim B$ (indifference) as the absence of eventual dominance in either direction (i.e., the cumulative difference oscillates infinitely often).
  *   **The Defeater:** It is mathematically demonstrable that this indifference relation is not transitive. You can construct three streams $A, B, C$ such that $A \sim B$ (oscillating difference), $B \sim C$ (oscillating difference), but $A \succ C$ (the sum of the oscillations drifts positive).
  *   **Concession:** A committed ED theorist **must concede** this if they wish to maintain ED as a guide for choice. A preference cycle ($A \sim B \sim C \succ A$) violates the minimal requirements of rational agency.
  *   **Dismissal:** They are entitled to dismiss this only if they reframe ED not as a decision procedure but as a *value ranking* that admits quasi-ordering (where indifference is not an equivalence relation). However, this undermines the claim that ED "escapes paralysis," as non-transitive indifference reintroduces a form of indecision in choice contexts.

  **Spatial Exhaustion Dependence**
  ED relies on "cumulative totals over finite horizons." In a temporal stream, the horizon order is natural ($t=1, 2, 3...$). In a spatially infinite world, there is no natural ordering of regions.
  *   **The Defeater:** By the Riemann Rearrangement Theorem, if the utility stream is conditionally convergent, the cumulative total can be made to converge to any value (or diverge) simply by changing the order in which regions are summed. ED would verdict $A \succ B$ under one exhaustion and $B \succ A$ under another.
  *   **Concession:** The theorist **must concede** that ED is ill-defined for general spatial infinities.
  *   **Dismissal:** They are entitled to dismiss this only by restricting the domain of ED to temporally ordered streams or spatial worlds with a "natural" nested geometry (e.g., expanding spheres centered on the agent). This is a significant qualification.

  ### 2. Serious Defeaters (Agency and Normativity)

  **Diachronic Inconsistency (The Money Pump)**
  This is the most persuasive argument against ED for embedded agents.
  *   **The Defeater:** Suppose $A$ eventually dominates $B$ by an epsilon, but $B$ dominates $A$ by a billion for the first trillion years. Ex-ante (at $t=0$), ED mandates choosing $A$. However, at any time $t$ within that first trillion years, the cumulative total of $B$ is vastly superior. An agent living through time would constantly prefer to switch to $B$, only to switch back to $A$ as the "crossover point" approaches.
  *   **Money Pump:** An adversary could sell you $A$ for a small fee (since $A \succ B$ ex-ante), then sell you back to $B$ at time $t$ (since $B \succ A$ ex-post at that horizon), then sell you back to $A$ later. You end up where you started but poorer.
  *   **Concession:** The theorist **must concede** that ED cannot guide dynamic, embedded agents who lack pre-commitment technology.
  *   **Dismissal:** They are entitled to dismiss this if ED is framed strictly as a "God's eye" evaluative metric for a planner who can enforce pre-commitment, rather than a guide for individual choice.

  ### 3. Merely Awkward Defeaters (Intuition and Magnitude)

  **Magnitude Insensitivity**
  *   **The Defeater:** ED treats a permanent lead of $10^{-9}$ utils identically to a lead of $10^9$ utils. It also treats a stable lead identically to a lead that only emerges after astronomical oscillations.
  *   **Concession:** The theorist should concede this is counter-intuitive but **dismiss** it as a fatal flaw. Ordinal rankings do not require cardinal sensitivity. This is a standard feature of overtaking criteria in welfare economics; it prioritizes the "long-run" state over the "path," which is a feature, not a bug, for certain utilitarian aggregations.

  ### Addressing Your Specific Questions

  **1. Is the indifference relation genuinely an equivalence?**
  No. As noted in the Fatal section, $A \sim B$ and $B \sim C$ does not guarantee $A \sim C$. This matters profoundly. If indifference is not transitive, the "no-incomparability" claim is misleading. You have not eliminated incomparability; you have hidden it inside a non-transitive indifference relation that fails to support rational choice.

  **2. Is trading swings for an epsilon lead a cost or a feature?**
  It is a **cost** for agency, but a **feature** for evaluation. It allows ED to avoid the "infinite sum" problem by focusing on asymptotic behavior. However, it implies that the well-being of the first billion generations can be sacrificed for a negligible gain in the trillionth generation, which violates strong Pareto intuitions regarding the near future.

  **3. Is ED well-defined for spatial infinity?**
  No, not without qualification. "Finite horizons" require an exhaustion sequence. Without a privileged topology, the verdict is arbitrary. ED is inherently temporal or requires a spatial analog to time (e.g., distance from an origin).

  **4. Does the no-incomparability claim survive undefined totals?**
  Yes, technically. ED operates on partial sums $S(n)$, which are always defined for finite $n$ given real-valued utilities. It does not require the limit $\lim_{n\to\infty} S(n)$ to exist. It only requires the *relationship* between $S_A(n)$ and $S_B(n)$ to stabilize. However, if the streams are so pathological that the difference doesn't oscillate or diverge (e.g., chaotic non-convergence), the "eventual" condition may never trigger, potentially reviving incomparability unless "oscillation" is defined broadly to include all non-dominance.

  **5. Does ED collapse into a rival view?**
  ED is essentially the **Overtaking Criterion** (Gale, 1967) with a forced resolution for oscillation.
  *   It does not collapse into **Lexicographic** views (which prioritize earlier terms).
  *   It does not collapse into **Ultrafilter** views (which select a "large set" of indices non-constructively).
  *   It is distinct from standard **Catching-Up** criteria only in its refusal to declare oscillating streams incomparable. This specific clause is what generates the transitivity problems.

  ### Insulation and Qualifications

  You asked whether ED has been qualified into insulating itself. **Yes.** To survive the fatal defeaters, ED must be insulated by the following qualifications:
  1.  **Domain Restriction:** It applies only to temporally ordered streams or spatially nested regions with a natural center.
  2.  **Quasi-Ordering:** It must admit that indifference is not transitive, limiting its use as a decision procedure.
  3.  **Ex-Ante Perspective:** It must apply only to evaluators capable of pre-commitment, not embedded agents maximizing at every moment.

  Is this insulation legitimate? For a *general* theory of infinite ethics intended to solve paralysis in *all* worlds, **no**. It solves paralysis only by ignoring the cases (spatial, dynamic, pathological) where paralysis is most acute. For a *specific* tool in welfare economics regarding temporal growth, **yes**.

  Verdict: insulated by its own qualifications
