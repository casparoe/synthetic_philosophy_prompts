answer: |-
  **The Slide Case (149 words)**

  Vienna Municipal Housing Office, 1930. A wall chart displays 100 figure-icons representing households. 80 are blue, 20 red. Caption: "Households with Income." The Transformator grouped full-wage and casual-wage earners into the blue block. Viewer A (Union) sees "Secure Community": the visual unity implies stable livelihoods. Viewer B (Council) sees "Solvent District": the visual unity implies rent capacity. Both know the convention: 1 icon = 10 households, Blue = Income > 0. Neither disputes the count. Yet A claims the chart depicts stability; B claims it depicts solvency. Adding the caption "Households with Income" confirms the data but not the social reality. Remove the chart: the raw table lists "Full-time: 40, Casual: 40, None: 20." Both agree on the numbers immediately. The visual grouping creates the disagreement about the *kind* of neighborhood this is.

  ***

  **The Analysis**

  **1. The Defender of Neutrality**
  They will argue the dispute is semantic, not visual. The picture merely counts; the disagreement lies in the verbal concept "Income." They claim the visual is a neutral container for the data. If the viewers disagree, it is because they bring different definitions of stability to the chart, not because the chart itself biases them. The picture resembles the count; the interpretation is extra-pictorial.

  **2. The Goodman-ish Camp**
  Goodman would say the chart is a symbol system where resemblance is irrelevant. The disagreement arises because the visual scheme *constructs* a category ("Blue") that is extensionally accurate (all have income) but intensionally misleading (implies homogeneity). The system is dense in color but digital in count. The visual grouping functions as a predicate that erases the distinction between full and casual labor, creating a new "kind" that supports conflicting projections.

  **3. Neurath's Position**
  Neurath would acknowledge this immediately. It confirms his claim that pictures are a *helping language*, never a full one. He cannot say one reading is correct without invoking the *purpose* of the chart (e.g., "Was this for rent collection or welfare planning?"). He is anti-foundationalist; there is no neutral protocol language to adjudicate "stability" vs. "solvency." The case shows why pictures cannot be a full language: the Transformation step necessarily erases distinctions to create visual unity. Once erased, the picture lacks the syntactic resources (negation, qualification) to restore them. Words are required to specify the *type* of income, but even then, the visual unity exerts a psychological pull that words struggle to neutralize.

  **4. The Working Feature**
  The **color grouping**. If the Transformator had used two shades of blue (light for casual, dark for full), the visual distinction would match the statistical distinction, and the disagreement would vanish. The visual *unity* is what licenses the conflicting interpretations of the social reality.

  **5. The Neutrality Escape**
  They will argue: "This is a dispute about statistics (grouping), not depiction." They claim the Transformator's decision to merge categories is a data choice, not a visual one.
  *Rebuttal:* This moves the bump in the carpet. If it were purely statistical, the raw table ("Full-time: 40, Casual: 40") would sustain the disagreement. It does not; the table forces the distinction. The chart *hides* the distinction via visual grouping. The depiction *enforces* the grouping perceptually, making the merger feel like a natural kind rather than a statistical aggregation.

  **6. Can a Neurathian Say One Reading is Correct?**
  No, not on semantic grounds. Neurath would judge the chart based on its *educational utility* for a specific audience. If the goal is to encourage tenants, A's reading is useful; if to reassure investors, B's is. To declare one "correct" would require a metaphysical claim about the essence of "Employment" that Neurath rejects. This case explains why he thought pictures could never be a full language: they cannot express the logical qualifications necessary to prevent such divergent readings without ceasing to be pictures. They stimulate attention but cannot fix meaning alone.
