  2.  **Deconstruct the Logic:**
      *   **Paraconsistent Logic:** Allows contradictions ($A \land \neg A$) without explosion ($A \land \neg A \vdash B$).
      *   **Dialetheism:** Some contradictions are true (truth-value gluts).
      *   **Disjunctive Syllogism (DS):** $A \lor B, \neg A \vdash B$. In many paraconsistent logics (like LP - Logic of Paradox), DS fails. Why? Because if $A$ is a glut (both true and false), $\neg A$ is also true. So premises $A \lor B$ (true) and $\neg A$ (true) can hold while $B$ is false.
      *   **Modus Ponens (MP):** $A, A \to B \vdash B$. In LP, MP fails for the material conditional if defined classically ($\neg A \lor B$). If $A$ is a glut and $B$ is false, $A \to B$ is true (since $\neg A$ is true), $A$ is true, but $B$ is false. So yes, MP is unsafe in LP for the material conditional.
      *   **Glut vs. Gap:** Glut = Both True and False. Gap = Neither True nor False (K3 logic). Paraconsistency usually targets gluts to avoid explosion. Gaps don't cause explosion classically, but they invalidate DS too (if $A$ is gap, $\neg A$ is gap, $A \lor B$ depends). The prompt asks for a contrast if possible.
