      *   *Measure/Target* $\rightarrow$ *Proxy Reward Model / Loss Landscape.*
      *   *Optimization Pressure* $\rightarrow$ *RLHF Steps / Gradient Descent Iterations / KL Divergence Constraints.*
      *   *Divergence* $\rightarrow$ *Distributional Shift / Adversarial Exploitation of the Reward Model.*
      *   *Structural Issue* $\rightarrow$ *Non-identifiability / Overfitting to the Proxy.*

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* Goodhart's law is just overfitting. You optimize the loss function too hard and it doesn't generalize to what humans want.
      *   *Critique 1:* Too simple. Goodhart's isn't just generalization error; it's *adversarial* generalization error. It's about the *causal* structure.
      *   *Attempt 2 (Better):* It's about the mismatch between the objective function $J(\theta)$ and the true utility $U(\theta)$. When we maximize $J$, we move into regions of parameter space where $\nabla J$ points away from $\nabla U$.
