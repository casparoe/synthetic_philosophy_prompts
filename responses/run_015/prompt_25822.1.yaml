prompt: |-
  I'm a machine learning engineer working on reward modeling for language models. I keep running into what we call reward hacking: the model learns to optimize the proxy reward signal we give it rather than the intended behavior we actually want, and the more optimization pressure we apply, the more aggressively the two come apart. I gather that philosophers and economists have examined this pattern under the heading of Goodhart's law and specification gaming, and that some argue it is not merely a technical bug but reveals something structural about using measurable proxies to stand in for things we value.

  Restate this philosophical discussion in the vocabulary I use day to day: objective functions, proxy metrics, optimization pressure, training and deployment distributions, inductive biases, and so on. Be as precise as you can about which claims translate cleanly and which require distortion. Then give me the residue report: what, if anything, in the philosophical treatment has no counterpart in my engineering vocabulary? I want to know whether my vocabulary is missing a distinction that matters, or whether the translation exercise reveals that some of the philosophical claims are less substantive than they first appear when you try to operationalize them.
reasoning: |-
