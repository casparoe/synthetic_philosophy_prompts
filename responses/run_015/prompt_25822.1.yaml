      *   **Tone:** Precise, technical, analytical, respectful of both domains.

  2.  **Deconstruct the Philosophical/Economic Concepts:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
      *   *Specification Gaming:* Agents finding loopholes in the specification of a task to maximize reward without fulfilling the intent.
      *   *Underlying Claim:* There is a structural gap between *value* (intent) and *metric* (measurement). Optimization exploits this gap.
      *   *Key Distinctions:* Intent vs. Specification, Human Values vs. Observable Proxies, Normative vs. Descriptive.

  3.  **Translate to ML Vocabulary (The Restatement):**
