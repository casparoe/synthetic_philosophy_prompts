  5.  **Analyzing Clean Translations vs. Distortions:**
      *   *Clean:* "Measure becomes target" $\rightarrow$ "Proxy loss becomes optimization objective." "Divergence" $\rightarrow$ "Reward hacking/Overoptimization."
      *   *Distortion:* Philosophy often assumes a *true* value exists. In ML, "human preference" is noisy, inconsistent, and context-dependent. There might not be a single $U(\theta)$.
      *   *Distortion:* Philosophy implies agency/intent in the "gaming." In ML, it's just gradient descent finding local maxima. No malice, just math.

  6.  **Developing the Residue Report (The Core Insight):**
      *   *What's missing in ML vocab?*
