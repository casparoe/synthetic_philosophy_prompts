answer: |-
  The single most important structural decision is to defer the causally disconnected "later era" wrinkle until after the core likelihood divergence is established in a simpler, synchronous urn model.

  ### Session Plan (90 Minutes)

  **Phase 1: Baseline and Agreement (0–30 mins)**
  *   **0–10: Bayesian Review with Selection Effects.**
      *   Establish notation: $H$ (hypothesis about the world), $D$ (data/evidence), $I$ (indexical data: "I am an observer").
      *   Quick urn analogy: Small Urn (10 balls) vs. Large Urn (1000 balls). If you draw Ball #5, likelihoods differ ($1/10$ vs $1/1000$). If you draw *a* red ball (and all balls are red), likelihoods are equal ($1$ vs $1$).
      *   **Goal:** Separate *sampling probability* from *existence probability*.
  *   **10–30: The Agreement Case.**
      *   **Case:** $H_S$ (10 observers with evidence $E$) vs. $H_L$ (10 observers with evidence $E$ + 1,000 observers without $E$).
      *   **Task:** Students write likelihoods for $D=$"I have evidence $E$".
      *   **Result:** SSA and SIA agree (no update).
      *   **Why:** The surplus observers lack the evidence, so they enter neither the SSA denominator (reference class) nor the SIA numerator (count of evidentiary observers).
      *   **Pedagogical Function:** Defuses the misconception that "Anthropic reasoning always moves the answer." It isolates the variable that matters: the number of observers *in the reference class*.

  **Phase 2: The Disagreement Case and Formalism (30–60 mins)**
  *   **30–45: The Plain Disagreement Case.**
      *   **Case:** $H_S$ (10 observers with $E$) vs. $H_L$ (1,000 observers with $E$). Synchronous, no causal wrinkle yet.
      *   **Task:** Write $P(D|H)$ for both assumptions, holding priors $P(H)$ equal.
      *   **SSA Likelihood:** $\frac{1}{N_H}$ (Probability of being *this* specific observer among $N_H$).
      *   **SIA Likelihood:** $1$ (or proportional to $N_H$ if framing datum as "I exist"). *Correction for clarity:* Frame datum as "I am an observer with $E$."
          *   SSA: $P(D|H) = \frac{N_H(E)}{N_H(Total)}$. (Here $10/10$ vs $1000/1000$ = 1 vs 1? No, that agrees).
          *   *Adjustment:* To force divergence, the datum must be "I am a random observer" (Presumptuous Philosopher style) OR the reference class must include the surplus.
          *   *Revised Case for Divergence:* $H_S$ (10 observers total) vs. $H_L$ (1,000 observers total). All have evidence $E$.
          *   **SSA:** $P(D|H) = 1/N_H$. ($1/10$ vs $1/1000$). Favors $H_S$.
          *   **SIA:** $P(D|H) \propto 1$. (Probability of existence scales with $N$, cancelling sampling penalty). Favors $H_L$ (if framed as prior shift) or is neutral (if framed as likelihood).
          *   *Strict adherence to prompt:* "Disagreement concerns a likelihood term."
          *   **Formalism:** Fix Priors $P(H_S)=P(H_L)$.
              *   SSA Likelihood: $L(H) = \frac{1}{N_H}$.
              *   SIA Likelihood: $L(H) = 1$ (because $P(\text{Exist}|H) \propto N_H$ and $P(\text{Sample}|\text{Exist}) = 1/N_H$).
              *   **Divergence Point:** The normalization term $\frac{1}{N_H}$. SSA retains it; SIA cancels it via the existence weight.
  *   **45–60: Locating the Term.**
      *   Have students explicitly circle the $\frac{1}{N_H}$ term in the SSA expression and show where it vanishes in the SIA expression.
      *   Emphasize: This is not a prior dispute (we set them equal); it is a dispute over how to model the likelihood of self-location.

  **Phase 3: The Wrinkle and Misconceptions (60–80 mins)**
  *   **60–70: Adding the Wrinkle.**
      *   **Modification:** The 990 surplus observers in $H_L$ are in a causally disconnected future era.
      *   **Why Add It Now?** Now that the math is stable, introduce the metaphysical stake. If they were observable, we could just count them and dissolve the anthropic problem. The wrinkle forces reliance on the principle rather than empirical verification.
      *   **Check:** Does the math change? No. $N_H$ is still 1,000.
  *   **70–80: Defusing Misconceptions.**
      *   **Misconception 1:** "You cannot update on your own existence (you had to exist to ask)."
          *   **Defuse:** Refer to Phase 1 urn analogy. You can update on "Ball #5 was drawn" even though Ball #5 had to be drawn to be identified. The information is *which* observer you are, not *that* you exist.
      *   **Misconception 2:** "SIA is just SSA with a wider reference class."
          *   **Defuse:** Point to the algebraic divergence in Phase 2. Widening the reference class in SSA *increases* the penalty ($1/N$ gets smaller). SIA *removes* the penalty. They are structurally opposite operations, not parameter tweaks.

  **Phase 4: Closing and Boundaries (80–90 mins)**
  *   **80–85: What Not to Settle.**
      *   Openly decline to resolve:
          1.  **The Reference Class Problem:** Who counts as an "observer"? (Brains? Moments? Simulations?). Acknowledge this is a free parameter in both SSA and SIA.
          2.  **Metaphysics of Possibility:** Whether merely *possible* observers (SIA) count vs. only *actual* observers (SSA).
          3.  **The Verdict:** Which principle is true. (The goal is structural literacy, not conversion).
  *   **85–90: Closing Question.**
      *   **Question:** "In the Presumptuous Philosopher case ($H_S$: 10 observers, $H_L$: 1,000 observers), suppose we discover the 990 surplus observers in $H_L$ are conscious but lack *your specific evidence* (e.g., they live in a different epoch and see different data). How does the likelihood ratio $L(H_L)/L(H_S)$ change for SSA versus SIA?"
      *   **Expected Answer:**
          *   **SSA:** Ratio drops significantly (Denominator $N_{Total}$ remains 1,000, Numerator $N_{Evidence}$ drops to 10. Likelihood $\approx 10/1000$).
          *   **SIA:** Ratio remains unchanged (Likelihood depends only on $N_{Evidence}$, which is 10 for both. The surplus without evidence is ignored).
      *   **Purpose:** Tests if they understand that SSA penalizes based on *total* reference class size, while SIA weights based on *evidentiary* observer count.
