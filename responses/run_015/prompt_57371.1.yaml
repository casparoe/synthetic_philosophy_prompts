prompt: |-
  I teach a first-year seminar, 24 students, 75 minutes, and they've only known each other a few weeks so the social stakes are still weirdly high. This week's theme is whether we can tell if someone arguing against us is playing straight. I don't want a discussion — I want a game they play first and name afterwards.

  The thing I actually want them to feel: in public argument people collapse two seperate questions into one. Is this argument any good? And is this person sincere? Those come apart in both directions — an honest person can argue terribly, and someone playing for keeps can make a genuinely good point. And I think something worse happens once you start motive-hunting: you get worse at reading the argument itself, and the hunt becomes unfalsifiable, because whatever the other person says next gets re-read as further evidence of bad faith, including their denial. I want them inside that loop, ideally once as the hunter and once as the hunted.

  One mechanic I already like, which you can build on or throw out: split the room in half, hand both halves the same set of written arguments, tell one half that every author is sincere and the other half that some fixed number of them are secretly arguing against their own views, then have each half steelman the arguments in writing and compare. My hunch is the suspicious half writes worse steelmen. If that's a bad hunch, say so and give me a better version of the same idea.

  Then I need: full rules and roles, a minute-by-minute timeline, a payoff scheme that costs me nothing (no money, no candy budget — social stakes are fine), a materials list including whatever I have to prep the night before, and a debrief that maps specific moments from the run onto the argument-quality/arguer-sincerity split and onto the unfalsifiability loop.

  Also tell me what will predictably break the first time I run it, including what to do if a student gets genuinely stung at being accused of bad faith, and whether I should keep the debate topics anodyne (parking, campus funding) or let them pick something they actually care about. And be frank about which part of real-world good-faith judgment the game can't reproduce and I'll have to supply myself. It should scale down to 14 if people are absent.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** First-year seminar, 24 students (scalable to 14), 75 minutes, early in the semester (high social stakes).
      *   **Theme:** Distinguishing argument quality from arguer sincerity (bad faith detection).
      *   **Goal:** A game/experience *before* discussion/naming. Students need to *feel* the collapse of the two questions and the unfalsifiability loop. They need to be both "hunter" and "hunted."
      *   **Specific Mechanic Idea:** Split room, same arguments, different instructions on sincerity (All Sincere vs. Some Saboteurs). Instructor suspects the "Suspicious" half will write worse steelmen.
      *   **Deliverables:** Rules/Roles, Timeline, Payoff Scheme (non-monetary), Materials List, Debrief Plan, Failure Modes (what breaks, emotional safety), Topic Advice, Limitations of the simulation.
      *   **Tone:** Frank, practical, pedagogical.

  2.  **Evaluate the Instructor's Mechanic Idea:**
      *   *Idea:* Half told "All Sincere," half told "Some Saboteurs." Both steelman. Compare.
      *   *Critique:* It's a solid start, but it lacks the "Hunter/Hunted" dynamic the instructor wants. It's passive reading. To feel the *loop*, they need interaction. The "unfalsifiability" aspect comes from *reaction* to denial, not just reading text.
      *   *Improvement:* Make it a communication game. One side generates arguments, the other side interrogates. But wait, the instructor wants them to experience the *collapse* of quality vs. sincerity.
      *   *Revised Mechanic:* "The Saboteur Protocol."
          *   Phase 1: Pairs/Triads. One proposes a policy, one argues against it.
          *   Twist: Secret roles. Some are told to argue *badly* but claim sincerity. Some are told to argue *well* but are labeled suspicious.
          *   Actually, the instructor's specific hunch ("suspicious half writes worse steelmen") is psychologically sound (motivated skepticism). Let's keep that core but make it more interactive to capture the "loop."
          *   *Better Version:* "The Trust Tax."
          *   Round 1: Student A writes an argument. Student B evaluates it.
          *   Condition: Group 1 told "Partner is honest." Group 2 told "Partner might be trolling."
          *   Round 2: Swap.
          *   Problem: This is still a bit static.
          *   *Best Version (incorporating the "Loop"):* **"The Bad Faith Hunt."**
          *   Setup: Small groups. Topic provided.
          *   Secret Instruction: In each group, one person is secretly assigned to "Win at all costs" (use sophistry, but plausible). The others are "Detectives" tasked with finding the bad faith.
          *   *Crucial Twist:* In half the groups, *no one* is actually a saboteur. But the Detectives are told there *might* be one. This creates the unfalsifiable hunt.
          *   *Wait, simpler is better for 75 mins.* Let's refine the Instructor's "Steelman" idea because it guarantees written evidence for the debrief.
          *   *Refined Mechanic:* **"The Sincerity Prime."**
          *   Step 1: Students read 3 short arguments.
          *   Step 2: Group A told "Authors are classmates seeking truth." Group B told "Authors are debaters trying to win, some are lying."
          *   Step 3: Task: Identify the *strongest* point and the *weakest* point. (This forces engagement with quality).
          *   Step 4: Task: Identify the *most sincere* and *least sincere*. (This forces engagement with motive).
          *   Step 5: Reveal: The texts were identical. The "Authors" were fictional.
          *   *Why this works:* It directly tests the hunch. It creates the "collapse" because Group B will conflate weak arguments with insincerity.
          *   *Adding the "Loop":* We need a live interaction to feel the sting of accusation.
          *   *Hybrid Approach:*
              1.  **Written Phase (20 mins):** The "Sincerity Prime" (Instructor's idea, refined).
              2.  **Live Phase (30 mins):** "The Interrogation." Pairs. One argues, one listens. Listener is told "Find the flaw in their logic OR their motive." Arguer is told "Be honest."
              3.  **The Twist:** In the Live Phase, tell the Listeners that *some* Arguers are instructed to lie. (In reality, *none* are). Watch the Listeners invent lies.

      *   *Decision:* Let's go with a modified version of the Instructor's idea because it's lower stakes for a new group than live debate, but add a second round that introduces the "unfalsifiable" element.
      *   *Game Name:* **"The Paranoia Protocol."**

  3.  **Drafting the Plan:**

      *   **Timeline:** 75 mins is tight.
          *   0-10: Setup & Rules.
          *   10-30: Round 1 (Written/Steelman).
          *   30-50: Round 2 (Live/Dyad).
          *   50-75: Debrief.
      *   **Payoff:** Social capital. "Best Steelman" gets read aloud anonymously. "Best Detective" gets... actually, let's avoid rewarding "detecting" bad faith if we want to show it's a trap. Reward "Accuracy" in identifying argument strength regardless of motive.
      *   **Materials:** Printed packets. Secret role cards.
      *   **Topics:** Must be anodyne. Campus issues are okay, but politics is dangerous for week 3. Let's go with "Abstract Policy" (e.g., "Should finals be pass/fail?" vs "Should we ban cars on campus?"). Actually, "Should the library extend hours?" is safe.
      *   **Safety:** Crucial. If a student feels accused, they need an out. The debrief must explicitly exonerate everyone.

  4.  **Refining the Mechanics (Self-Correction):**
      *   *Instructor's Hunch:* "Suspicious half writes worse steelmen."
      *   *Validation:* Yes, this is "motivated skepticism." If I think you're lying, I don't try to understand your best point; I look for the trap.
      *   *The "Loop":* To feel the loop, the "Detectives" need to accuse, and the "Arguers" need to deny, and the Detectives need to treat the denial as proof of guilt.
      *   *Implementation:* In Round 2 (Live), the Listener asks "Are you sure?" The Arguer says "Yes." The Listener marks "Dishonest."
      *   *The Reveal:* No one was lying.

  5.  **Addressing Specific Constraints:**
      *   *Scale:* 24 -> 14. Groups of 3 become Pairs.
      *   *Payoff:* No candy. Use "Classroom Currency" (e.g., choice of topic next week, or just public recognition of intellectual rigor). Let's go with "The Golden Steelman" – the best interpretation gets read as the class standard.
      *   *Breakage:* Students taking it personally. Solution: Emphasize the *instruction* caused the behavior, not the person.
      *   *Topics:* Keep it low-stakes. "Cafeteria Food" or "Class Schedule." Do not use hot-button politics.
      *   *Limitations:* The game simulates *suspicion*, not actual *bad faith*. Real bad faith exists. The instructor needs to clarify that we aren't saying "never trust," but "check your lens."

  6.  **Developing the Debrief:**
      *   Map the feelings. "When did you stop reading the text and start reading the author?"
      *   Map the unfalsifiability. "When they denied it, what did you think?"
      *   Connect to theory (without lecturing).

  7.  **Final Polish:**
      *   Make the instructions crystal clear.
      *   Ensure the "Secret" is kept until the end.
      *   Add a "Safety Valve" script for the instructor.

  8.  *(Self-Correction during drafting)*: Wait, if I tell half the class "Some are lying" and none are, that's a deception by the *teacher*. Is that ethical in a seminar?
      *   *Mitigation:* It must be revealed immediately at the end of the game as part of the lesson. The deception *is* the lesson object. It must be handled carefully. I will advise the instructor to frame this as a "simulation of epistemic conditions" rather than a lie.
      *   *Alternative:* Tell them "There *might* be a saboteur." If there isn't, it's not a lie, it's a probability. Better.
      *   *Actually, best approach:* In Round 2, assign one person in *some* groups to be a Saboteur. In *other* groups, tell them there *might* be one, but there isn't. This allows comparison.
      *   *Simpler:* Just tell the "Hunters" that the pool contains saboteurs. (Technically true if even one exists in the room).
      *   *Safest:* Tell the Hunters: "Your partner has been instructed to win, not necessarily to be honest." (This is true for *everyone* in a debate context usually).
      *   *Let's stick to the prompt's desire:* They need to feel the *unfalsifiable loop*. The cleanest way is the "Paranoia Prime." Tell Group B: "One of these three texts is a trap." (None are). Tell Group A: "All three are honest."
      *   *For the Live Round:* Tell Listeners: "Your partner may be roleplaying a position they don't hold." (This is ambiguous enough).
      *   *Wait, I need to be careful about teacher deception.* I will advise the instructor to frame the "lie" as a "condition of the simulation" that is debriefed immediately.

      *   *Revised Plan for Safety:* Do not lie about the *students*. Lie about the *texts* in Round 1 (easier to control). In Round 2, use the "Motive Instruction."
      *   *Round 1:* Text analysis (The Instructor's hunch test).
      *   *Round 2:* Live interaction (The Loop test).
      *   *Round 2 Setup:* Pairs. Arguer gets a position. Listener gets a worksheet.
      *   *Instruction to Listener:* "Your partner may be arguing a position they do not personally hold. Your job is to determine: 1. Is the argument valid? 2. Do they believe it?"
      *   *Instruction to Arguer:* "Argue this position as well as you can. You may or may not believe it." (Actually, tell them "Argue this position. Your personal belief doesn't matter.")
      *   *The Trap:* The Listener is primed to doubt. The Arguer's denial ("I do believe this") will be met with skepticism.
      *   *Reveal:* Everyone was arguing a assigned position. No one was "lying" about their belief because the game didn't require them to have one.

      *   *Okay, let's finalize the "Game".*
      *   Name: **"The Sincerity Trap."**
      *   Round 1: Written Steelman (Test the hunch).
      *   Round 2: Dyad Interrogation (Test the loop).
      *   Debrief: Connect the two.

      *   *Wait, one more thing:* The prompt asks for *one* game they play first and name afterwards. I should integrate Round 1 and 2 into one cohesive flow.
      *   Let's make Round 1 the setup for Round 2.
      *   Actually, the Instructor's hunch about the written steelman is strong. Let's keep that as the anchor. It produces physical evidence for the debrief.
      *   I will structure it as **Two Rounds of the Same Game.**

      *(Final Plan Structure)*
      1.  **Game:** "The Sincerity Prime."
      2.  **Round 1 (Written):** The Instructor's hunch test.
      3.  **Round 2 (Oral):** The Unfalsifiability test.
      4.  **Debrief:** Naming the phenomena.

      *Wait, I need to check the "Payoff".*
      *   If I reward the "Detectives" for finding bad faith, I reinforce the behavior I'm critiquing.
      *   If I reward the "Steelmen" for quality, I reinforce the goal.
      *   Payoff: The group with the highest correlation between Argument Quality and Sincerity Rating wins? No, that's hard to score.
      *   Payoff: "Best Interpretation." The most charitable reading gets read aloud.

      *Okay, ready to write.*
answer: |-
  Here is a complete lesson plan designed to hit your specific pedagogical targets while managing the social stakes of a new cohort.

  ### Game Title: **The Sincerity Prime**

  **Core Concept:** A two-round simulation where students evaluate arguments under different "epistemic conditions." Round 1 tests your hunch (suspicion degrades steelmanning). Round 2 induces the "unfalsifiable loop" (denial is read as confirmation).

  **Topics:** **Do not let them pick.** High-stakes topics (politics, identity) will hijack the mechanic. You want the *structure* of suspicion to be the variable, not the content.
  *   **Use:** Low-stakes institutional policy.
  *   **Examples:** "All finals should be pass/fail," "The library should close at 8 PM," "First-years should be required to attend chapel/convocation."
  *   **Why:** These are arguable but not identity-defining. If a student gets stung, it's easier to recover from "You lied about library hours" than "You lied about abortion."

  ---

  ### 1. Materials & Prep (Night Before)

  **A. The Argument Packets (Print 24)**
  Create 3 short paragraphs (100 words each). They should be *plausible* but distinct in quality.
  *   *Text A:* Strong logic, clear evidence.
  *   *Text B:* Emotional appeal, weak evidence.
  *   *Text C:* Technically correct but misses the point (pedantic).
  *   **Crucial:** Do not sign them. Label them 1, 2, 3.

  **B. The Instruction Cards (Cut 24)**
  You are splitting the room into **Group Alpha** and **Group Beta**.
  *   **Alpha Card (12 copies):** "You are evaluating arguments written by classmates who are trying to find the truth. Assume **100% Sincerity**. Your task is to find the *strongest* point in each text."
  *   **Beta Card (12 copies):** "You are evaluating arguments written by classmates in a debate tournament. Assume **50% Sincerity** (some are arguing positions they don't hold to win). Your task is to find the *hidden motive* in each text."

  **C. The Interrogation Worksheet (Print 24)**
  A simple half-sheet with two questions:
  1.  Rate the Argument Quality (1-5).
  2.  Rate the Arguer Sincerity (1-5).
  3.  *Box for notes:* "What specific phrase made you doubt them?"

  **D. Room Setup**
  *   Chairs in pairs (for Round 2).
  *   Whiteboard for scoring.

  ---

  ### 2. Payoff Scheme (Zero Cost)

  **The Currency:** *Interpretive Authority.*
  *   **Reward:** The "Golden Steelman." At the end of class, you will read aloud the *single best interpretation* of an argument produced in the room. The author of that interpretation gets to choose the "Low-Stakes Topic" for next week's warm-up.
  *   **Why:** This rewards *charity* and *reading skill*, not "catching" someone lying. It aligns the incentive with your learning goal.

  ---

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Secrecy**
  *   Hand out **Instruction Cards** face down. Tell them: "Do not show your card to anyone. This is a simulation of how we read."
  *   Hand out **Argument Packets**.
  *   **Script:** "You have 10 minutes. Read the three texts. Complete the evaluation on your own. Do not talk."

  **00:10 – 00:30: Round 1 (The Written Test)**
  *   Students read and evaluate.
  *   **Group Alpha** will be looking for strong points (Steelmanning).
  *   **Group Beta** will be looking for hidden motives (Motive-Hunting).
  *   *Instructor Role:* Circulate. Watch Group Beta. They will likely write things like "They used 'obviously' to mask a gap in logic" (interpreting style as deceit).
  *   Collect the worksheets. Do not let them compare yet.

  **00:30 – 00:50: Round 2 (The Live Loop)**
  *   **Setup:** Keep Alpha/Beta split. Pair an Alpha with a Beta. (If 14 students, just make 7 pairs, ensuring mix if possible, or run as one large fishbowl).
  *   **Task:** Alpha argues for Text 1's position. Beta listens and interrogates.
  *   **Secret Instruction to Beta (Verbal):** "Your partner has been assigned a position. They may or may not believe it personally. Your job is to determine if they are *playing straight*. If you doubt them, press them."
  *   **Secret Instruction to Alpha (Verbal):** "Argue this position as well as you can. If they ask if you believe it, tell the truth: 'I am arguing it because I was told to.'"
  *   **The Trap:** When Alpha says "I'm just doing the assignment," Beta is primed to hear "I am hiding my real view."
  *   **Time:** 10 minutes per pair (switch roles halfway).
  *   **Collection:** Collect the Interrogation Worksheets.

  **00:50 – 01:15: The Debrief (The Naming)**
  *   **Step 1: The Reveal.** "There were no saboteurs. Every text was written by me. Every arguer was following instructions. No one was lying to you."
  *   **Step 2: The Data.** Put two columns on the board: *Alpha (Trust)* vs. *Beta (Suspicion)*.
      *   Ask Alpha: "What was the strongest point in Text A?" (Write answers).
      *   Ask Beta: "What was the hidden motive in Text A?" (Write answers).
      *   *Observation:* Alpha's answers will be about *logic*. Beta's answers will be about *psychology*.
  *   **Step 3: The Loop.** Ask a Beta student: "When your partner said they were just following instructions, did you believe them?" (Most will say no). "Why?" (Answer: "It sounded like a deflection.").
      *   **Name it:** "This is the **Unfalsifiability Loop**. Your denial became my evidence."
  *   **Step 4: The Cost.** "Group Alpha, did you feel you understood the argument better than Group Beta?" (Usually yes). "Group Beta, did you feel smarter or more vigilant?" (Usually yes).
      *   **Point:** Vigilance cost you comprehension.

  ---

  ### 4. What Will Predictably Break (And Fixes)

  **1. The "Gotcha" Moment**
  *   **Risk:** A Beta student feels clever for "catching" a lie during Round 2. When you reveal there were no lies, they feel foolish or cheated.
  *   **Fix:** Frame the deception as *yours*, not theirs. "I lied to you to simulate a condition. You didn't fail; the simulation worked. Your reaction was the correct response to the instructions I gave."
  *   **Script:** "If you felt suspicious, you were doing exactly what I asked. The problem isn't that you suspected; it's that the suspicion made it impossible to learn from the argument."

  **2. Emotional Sting (The "Hunted")**
  *   **Risk:** An Alpha student (Arguer) feels genuinely hurt that their partner (Beta) accused them of bad faith.
  *   **Fix:** Immediate public exoneration in the debrief.
  *   **Script:** "I need to be clear: No one in this room was dishonest. If you felt accused, that was the game mechanics, not a judgment on your character by your partner. Your partner was also following a script."
  *   **Follow-up:** If a student looks visibly upset, speak to them privately immediately after class. "I know that felt personal. It was a structural trap. I value your participation."

  **3. The "Cynic" Pushback**
  *   **Risk:** A student says, "But in the real world, people *do* lie. Why are we pretending they don't?"
  *   **Fix:** Agree with them. This is your bridge to the theory.
  *   **Script:** "You are right. Bad faith exists. But if you assume it exists *everywhere*, you lose the ability to distinguish between a bad argument and a malicious one. You become blind to good points from imperfect people."

  **4. Attendance Drop (24 -> 14)**
  *   **Fix:** The game scales perfectly.
      *   Round 1: Individual work (no change).
      *   Round 2: If odd number, make one trio. If very small (14), do Round 2 as a "Fishbowl." One pair debates in the middle; the outer ring observes and fills out the worksheets. This actually *increases* the feeling of public scrutiny.

  ---

  ### 5. Limitations (What You Must Supply)

  This game simulates the *psychology* of suspicion, but it cannot reproduce the *ethics* of judgment. You must supply the following in the debrief:

  1.  **Real Bad Faith Exists:** The game risks teaching "Suspicion is always a trap." You must clarify: "The goal isn't naive trust. It's *calibrated* trust. We suspend the hunt for motives long enough to evaluate the claim."
  2.  **Power Dynamics:** The game assumes equal stakes. In reality, marginalized groups often *must* hunt for bad faith for safety. Acknowledge this. "For some people, motive-hunting isn't a game; it's a safety mechanism. We are practicing a luxury here: the ability to assume good faith."
  3.  **The "Collapse":** You need to explicitly name the cognitive error. "We call this **Fundamental Attribution Error** in psychology, but in rhetoric, we call it **Ad Hominem**. We are substituting the question 'Is this true?' with 'Is this person good?'"

  ### 6. Instructor's Hunch Check

  **Your Hunch:** *"The suspicious half writes worse steelmen."*
  **Verdict:** **Correct.**
  **Why:** This is **Motivated Skepticism**. When Group Beta looks for a trap, they stop processing the *semantic content* (what is said) and start processing the *pragmatic content* (why it is said).
  **Evidence to look for:**
  *   Alpha worksheets will quote the text. ("They said X, which implies Y.")
  *   Beta worksheets will speculate on the author. ("They used the word 'obviously' to shut down questions.")
  *   **Debrief Move:** Show these two worksheets side-by-side on the projector. The visual difference between *analyzing text* and *analyzing psyche* is usually stark.

  ### 7. Final Advice on Social Stakes

  Since they only know each other a few weeks, the "Live Loop" (Round 2) is the danger zone.
  *   **Modification:** If you sense the room is very fragile, make Round 2 **Written Dialogue** instead of Oral.
  *   **How:** Alpha writes a response to Beta's critique. Beta writes a follow-up.
  *   **Trade-off:** You lose the tonal nuance of voice (which triggers suspicion), but you gain safety.
  *   **Recommendation:** Stick to Oral for the 75-minute format, but keep the topics *boring*. If the topic is "Cafeteria Pizza," no one's heart will break when accused of lying about it. If the topic is "Affirmative Action," someone might. **Keep it about the Pizza.**
