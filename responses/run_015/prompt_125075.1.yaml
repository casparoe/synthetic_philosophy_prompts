answer: |-
  Hey — this sounds like a fantastic talk. The "friction model" is a really sharp hook, especially for grad students who are currently drowning in archives. It moves the conversation away from "sadly, this was lost" to "why was this made hard to keep?" which is way more productive.

  Here's a draft of eight questions. I've kept the tone conversational—you want this to feel like a dialogue between colleagues, not an oral exam. I've also baked in the follow-ups you asked for on the tricky ones, specifically designed to catch her if she tries to pivot to "that's just technical."

  Feel free to tweak the wording to match your voice.

  ***

  **1. The Foucault Question (Theory)**
  "I want to start with the theoretical framing. Foucault famously described the archive as the system that governs what can be said—the 'law of what can be spoken.' Your friction model seems to describe the *mechanics* of what gets stuck or slowed down during processing. Do you see your model as updating Foucault for the bureaucratic age, or are you proposing something fundamentally different about how power operates in the gaps?"

  *   **Follow-up (if she says it's just a technical/mechanistic update):** "If it's purely mechanistic, though, doesn't that risk depoliticizing the silence? If friction is just 'resistance at a node,' couldn't one argue that the placement of those nodes is itself a discursive power move? I'm wondering if 'friction' might unintentionally soften the violence of exclusion that Foucault highlighted."

  **2. The Directional Bias (Case Study)**
  "You mention that friction usually protects institutional voices over personal ones. In your example contrasting labor contracts with family letters, does the model suggest that contracts survive *because* of the friction—the bureaucracy acts as a preservative—or do they survive *despite* it? How do we distinguish between institutional durability and institutional bias?"

  *   **Follow-up (if she says it's just about better filing systems/paper quality):** "Right, but who decides which filing systems get funded and which don't? If the 'technical' capacity to preserve is itself distributed along class lines, isn't the technical problem actually a conceptual one about whose lives are deemed worth the cost of storage?"

  **3. The Digital Shift (Method/Medium)**
  "A lot of historians hope digitization will democratize access. You argue it just relocates the friction to metadata and algorithms. Can you walk us through a specific example where a digitized record is actually *harder* to retrieve than its physical counterpart because of this new layer of metadata friction?"

  *   **Follow-up (if she says it's just about metadata standards):** "But metadata standards aren't neutral; they're ontological claims about what matters. If the friction is now embedded in the schema itself, doesn't that mean the 'technical' problem is actually encoding a specific worldview? How do we troubleshoot a bias that's built into the search bar?"

  **4. Locating the Silence (Methodology)**
  "For the grad students in the room who are currently struggling with silences in their own dissertations: how do we methodologically locate friction? Since silence is an absence, what's the evidence trail that tells us 'this was resisted' rather than 'this was never here'?"

  **5. Agency and Intent (Structure)**
  "I'm curious about the human element at these nodes. When you talk about resistance at the cataloguing or preservation stage, are you describing intentional gatekeeping by archivists, or is this a structural inertia that happens even when everyone is acting in good faith?"

  **6. Historian of Science Context (Discipline)**
  "Since you work in the history of science, how does this model apply to lab notebooks versus published papers? We often assume the notebook is the 'raw' truth and the paper is the polished narrative. Does friction operate differently on the raw data that never makes it to publication?"

  **7. Ethics of Intervention (Practice)**
  "If friction is productive—it creates the silence that shapes history—should historians be trying to reduce it? Or is our job to document the friction itself? I'm wondering where you stand on the ethics of 'smoothing' the archive for future researchers."

  **8. Advice for the Room (Pedagogy)**
  "Finally, for the students here who are designing their own archives or managing data: what's one practical takeaway from the friction model? Is there a way to build 'anti-friction' into our own work now, or is the goal just to be more honest about the resistance we encounter?"

  ***

  **Moderator Notes:**
  *   **Timing:** If she goes long on Q1 (Foucault), you can safely skip Q5 (Agency) since they overlap slightly on structure vs. intent.
  *   **The "Technical" Trap:** She's smart, so she might anticipate the follow-ups. If she preempts them, just acknowledge it ("I suspected you'd say that, but...") and move to the next question. Don't let the follow-up stall the room.
  *   **Vibe Check:** Keep your tone curious, not corrective. You're inviting her to expand, not catching her in a contradiction (even if you kind of are).

  Let me know if you want to tighten any of these up before Thursday!
