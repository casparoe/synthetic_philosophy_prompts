  *   **Same Thing:** The "Institutional Objection" to Revisionist Just War Theory *is* this phenomenon when it claims unjust combatants are *not liable* (moral claim) because recognizing liability would cause war to be worse (pragmatic claim).
  *   **Different Thing:** **"Rule Consequentialism."** If a theorist explicitly adopts rule consequentialism, they are not equivocating; they have chosen a theory where acceptance-conditions determine truth. The confusion only exists if they claim to be liability-based (non-consequentialist) but argue like rule consequentialists.

