  There is no single, universally canonical term (like "Ad Hominem" or "Straw Man") that precisely captures the specific dialectical slide you are describing across all of philosophy. However, in the specific subfield you are reading (the ethics of war, specifically the debate between "Revisionists" like Jeff McMahan and "Traditionalists" like Michael Walzer or Henry Shue), this phenomenon is well-recognized, frequently discussed, and usually described rather than named.

  The closest established concepts are **"The Publicity Condition"** (in meta-ethics/political philosophy) and **"The Institutional Objection"** (in Just War Theory). However, neither captures the *illicit conflation* you are identifying.

  Below is an analysis of the neighbors, a proposed name for the specific confusion, and the boundary conditions you requested.

  ### 1. The Established Neighbors and How They Differ

  You listed several near neighbors. Here is how the phenomenon you describe differs from them:

  *   **The Publicity Condition (Rawls/Scanlon):** This is the requirement that moral principles must be capable of being publicly known and accepted without undermining themselves.
      *   *Difference:* Asserting a publicity condition is a *first-order claim* about the nature of morality (i.e., "Morality *requires* publicity"). The phenomenon you describe is a *dialectical slide* where arguers treat publicity consequences as evidence against moral truth *without* establishing that morality requires publicity. They act as if the consequence refutes the truth, rather than arguing that the truth requires the consequence.
  *   **Ideal vs. Non-Ideal Theory (Rawls):** Ideal theory asks what justice requires in perfect compliance; non-ideal theory asks what to do given partial compliance and institutional constraints.
      *   *Difference:* This distinction *announces* the two levels. The phenomenon you describe occurs when authors *fail* to announce the shift, using non-ideal constraints (institutional stability) to refute ideal claims (moral liability), treating them as if they are competing answers to the same question.
  *   **Criteria of Rightness vs. Decision Procedures (J.J.C. Smart):** A distinction between what makes an act right (e.g., maximizing utility) and how agents should decide what to do (e.g., follow rules).
      *   *Difference:* This is typically a consequentialist distinction. Your second instance describes *non-consequentialists* (liability theorists) suddenly using decision-procedure arguments to settle criteria-of-rightness questions. This is not just distinguishing the two; it is using the latter to determine the former inconsistently.
  *   **Self-Effacing Theories:** A theory that says, "I am true, but you should not believe me."
      *   *Difference:* A self-effacing theory is consistent. It admits the gap between truth and acceptance. The phenomenon you describe involves arguers who *deny* the gap when it suits them, claiming the consequences of acceptance determine the truth itself.
  *   **Appeal to Consequences (Fallacy):** Arguing a proposition is false because its truth would have bad outcomes.
      *   *Difference:* As you noted, the standard fallacy concerns consequences of the *truth* (e.g., "If God doesn't exist, life is meaningless, so God exists"). Your case concerns consequences of *belief/acceptance*. This is technically distinct, sometimes called the **"Pragmatic Fallacy"** (though that term is overloaded in semantics).

  ### 2. Proposed Name and Definition

  Since no single canonical term exists for the *illicit slide* specifically, the most precise descriptive label used in the meta-ethical and Just War literature is:

  **Normative-Pragmatic Equivocation**
  *(Alternatively: The Acceptance-Truth Conflation)*

  **Definition:** A dialectical move in which an arguer treats the *pragmatic consequences of accepting a normative claim* (e.g., institutional instability, increased violence) as evidence against the *truth of the normative claim itself* (e.g., moral liability, permissibility), without explicitly arguing for a meta-ethical framework (such as Moral Publicity or Practice-Dependence) that would make those consequences relevant to truth.

  **Why this fits:**
  1.  **Normative:** It concerns moral truth (liability, permission).
  2.  **Pragmatic:** It relies on empirical outcomes of belief (soldier behavior, surrender rates).
  3.  **Equivocation:** It treats these two distinct categories as if they are the same currency in the argument, switching between them depending on which side yields a preferred conclusion.

  ### 3. Boundary Conditions

  You asked specifically how to distinguish this from legitimate variations. Here is the breakdown:

  **Does it occur when the person is an explicit consequentialist?**
  *   **No.** If an act-consequentialist argues that a principle is false because accepting it leads to bad outcomes, they are being consistent. For a consequentialist, the "truth" of a moral claim *is* determined by outcomes (including the outcomes of inculcating that belief).
  *   **Distinction:** The phenomenon is specifically a problem for **non-consequentialists** (deontologists, liability theorists) who claim moral truth is mind-independent but then use mind-dependent acceptance conditions to settle it.

  **Does it occur when the change of level is announced?**
  *   **No.** If an author says, "While unjust combatants are morally liable (Deep Morality), the Law of War should treat them as equals to ensure stability (Institutional Design)," this is a legitimate **Division of Labor**.
  *   **Distinction:** The phenomenon you identify is the *silent* slide where the institutional argument is used to refute the moral claim, not to complement it. McMahan calls this **"Conflating Deep Morality with the Laws of War."**

  **Does it occur when proposed as a division of labor (Philosophers vs. Lawyers)?**
