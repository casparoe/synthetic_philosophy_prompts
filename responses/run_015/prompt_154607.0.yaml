  1. The precise question and why existing cultural-comparison answers leave it open

  Standard comparative frameworks often reduce German-American moral differences to a binary of collectivism versus individualism, or institutional trust versus self-reliance. This dichotomy obscures a deeper conceptual asymmetry in how moral failure and success are categorized. The prevailing view assumes Germans prioritize rule-following and Americans prioritize authenticity. However, it remains unclear whether these priorities constitute distinct moral ontologies. Specifically, does German folk morality recognize a unique category of procedural betrayal—violating a legitimate rule one has genuinely accepted—that is morally distinct from mere hypocrisy? Conversely, does American folk morality recognize conscientious deviation—breaking an illegitimate rule for sound moral reasons—as a moral achievement rather than simple disorder? Existing literature treats these as degrees of compliance rather than qualitatively different moral types. Sociological accounts measure adherence rates but ignore the justificatory structure of the violations. Normative ethics prescribes universal duties rather than analyzing folk taxonomies. Consequently, the specific moral weight assigned to breaking a rule one accepts versus breaking a rule one rejects remains theoretically underdeveloped. Most comparisons assume a universal metric of morality where rule-breaking is always negatively valenced, merely weighted differently by culture. This project challenges that assumption. It posits that in the German context, the breach of trust inherent in accepting a rule may be the primary vice, whereas in the American context, the breach of self-integrity is primary. It isolates this asymmetry to determine if the moral logic underlying *Ordnung* and conscience operates on incommensurable principles regarding the validity of rules versus the integrity of the agent, moving beyond behavioral description to the logic of moral judgment itself.

  2. The conceptual method—how to construct and test the asymmetry argument without empirical anthropology, and why this angle rather than standard normative ethics or sociology

  This project employs conceptual analysis rather than empirical anthropology. The goal is not to measure how often Germans or Americans break rules, but to map the logical space of moral justification available within each folk framework. The method involves constructing paired vignettes that isolate variables of rule legitimacy and agent acceptance. For example, a scenario where an agent breaks a legitimate rule they endorsed versus one they rejected. By analyzing the reactive attitudes (blame, praise, resentment) appropriate to each case within the respective cultural conceptual schemes, we can test whether distinct moral categories exist. This approach differs from standard normative ethics, which seeks to determine what agents ought to do regardless of cultural context. Here, the object of study is the folk moral concept itself, not its validity. It also diverges from sociology, which treats moral claims as data points reflecting social structures. Instead, this project treats folk morality as a coherent system of reasoning worthy of philosophical reconstruction. We will analyze the conditions under which a violation is deemed "treacherous" versus "hypocritical" or "heroic" versus "chaotic." This requires dissecting the necessary and sufficient conditions for these labels within each tradition. By focusing on the structure of justification rather than the frequency of behavior, the project avoids the naturalistic fallacy while respecting the phenomenology of moral experience. Crucially, empirical methods often fail here because folk morality operates pre-reflectively; agents may not articulate the specific taxonomy of their judgments in surveys. Conceptual analysis reconstructs the implicit logic governing these judgments. The asymmetry is tested by attempting to translate justificatory reasons from one framework to the other; if significant moral residue remains untranslatable—if a German justification sounds like rigidity to an American, or an American justification sounds like arbitrariness to a German—the conceptual asymmetry is confirmed. This philosophical reconstruction reveals the underlying architecture of moral judgment without requiring fieldwork, focusing on the validity conditions of moral claims within each system rather than their social utility. Given the six-month timeline, this non-empirical method ensures tractability while maintaining philosophical rigor, allowing for a deep dive into the conceptual structures rather than a broad superficial survey of attitudes.

  3. What a successful result would look like, what would count as failure, and the realistic six-month deliverable

  A successful result will demonstrate that "procedural betrayal" and "conscientious deviation" are irreducible moral categories within their respective frameworks, not merely synonyms for dishonesty or chaos. Success means showing that the moral logic of *Ordnung* treats rule-violation by an insider as a specific vice of trust, distinct from general hypocrisy. Conversely, it means showing American folk morality treats conscientious rule-breaking as a specific virtue of integrity, distinct from mere lawlessness. Failure would occur if the analysis reveals these categories collapse into universal moral concepts (e.g., honesty vs. dishonesty) across both cultures, implying the asymmetry is linguistic rather than moral. Another failure mode is finding the distinctions are too vague to support rigorous philosophical categorization, or if the asymmetry dissolves into mere power dynamics rather than moral reasoning. The realistic six-month deliverable is a detailed prospectus and a draft dissertation chapter mapping this taxonomy. This will include a set of defined moral failure types and a comparative analysis of their justificatory conditions. The output will not be a final theory of everything, but a validated conceptual framework ready for empirical testing or further normative evaluation. The primary contribution will be a refined vocabulary for comparative ethics that moves beyond stereotypes. This groundwork allows future research to investigate whether these conceptual asymmetries lead to tangible conflicts in transnational cooperation or policy. The deliverable ensures the project remains a philosophical inquiry into moral concepts, providing the structural analysis necessary before any subsequent sociological validation. By the end of the period, the project will have established whether the asymmetry is robust enough to sustain a full dissertation, securing the conceptual foundation for later comparative work. This ensures the project avoids generic culture-war summaries by focusing on the specific mechanics of moral categorization.

  4. A brief defense of why this should be funded as philosophical work rather than as cultural studies

  This project must be funded as philosophical work because its primary object is the logical structure of moral justification, not the cultural performance of morality. Cultural studies typically examines how moral concepts are deployed in power relations or historical contexts. While valuable, that approach treats the concepts as artifacts to be deconstructed. Philosophy, conversely, treats them as claims to validity that require reconstruction. This project investigates whether the moral reasoning itself differs structurally, not just how it is used socially. Funding this as cultural studies would risk reducing the conceptual asymmetry to a symptom of historical power dynamics, bypassing the core question of whether the moral categories themselves are distinct. As philosophical work, it contributes to moral psychology and action theory by refining our understanding of how agents conceptualize duty and integrity. It bridges the gap between abstract normative theory and concrete moral experience without surrendering the rigor of conceptual analysis. Therefore, it belongs in philosophy, where the validity of reasoning structures is the primary metric of success.
