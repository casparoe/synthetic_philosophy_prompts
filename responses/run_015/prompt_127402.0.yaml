answer: |-
  ### Brainstorming the Core Structure of the Knobe Effect

  The Knobe Effect (or Side-Effect Effect) reveals a fissure in folk psychology regarding intentional action. The core structure relies on a vignette pair where a protagonist pursues a primary goal (e.g., profit) while foreseeing a secondary side effect (e.g., environmental harm or help). The protagonist expresses indifference to the side effect ("I don't care about that, I just want to make money").

  The asymmetry arises in attribution:
  1.  **Harm Condition:** When the side effect is morally negative, ordinary speakers overwhelmingly judge the agent *intentionally* brought it about.
  2.  **Help Condition:** When the side effect is morally positive, ordinary speakers overwhelmingly judge the agent did *not intentionally* bring it about.

  Causal structure, epistemic state (knowledge), and volition regarding the primary goal are identical across both cases. The only variable is moral valence. Philosophically, this suggests that moral judgments are not subsequent evaluations of action but constitutive elements of how we conceptualize intentionality itself. The puzzle challenges the standard model of action theory, which posits that descriptive facts (belief, desire, causation) determine intentional status prior to normative evaluation.

  ---

  ### Session Design: The Protocol Review Board

  **Course:** Graduate Seminar in Philosophy of Action
  **Duration:** 75 Minutes
  **Participants:** 14 Students
  **Seating:** Single Circle (Facilitator included in circle)
  **Objective:** To experientially demonstrate the infiltration of normative judgment into descriptive attribution of intentionality within a collective decision-making context.

  #### I. Materials and Setup

  **1. Case Descriptions (Handout A)**
  Two one-page documents titled "Proposal Alpha" and "Proposal Beta." The syntax is strictly parallel.

  *   **Proposal Alpha (Harm):** The Board is asked to approve a manufacturing protocol. The Chair notes the protocol will maximize output. The Environmental Officer states, "This protocol will inevitably degrade the local watershed." The Chair replies, "I am aware of that risk. I do not care about the watershed; I only care about output. Proceed."
  *   **Proposal Beta (Help):** The Board is asked to approve a manufacturing protocol. The Chair notes the protocol will maximize output. The Environmental Officer states, "This protocol will inevitably restore the local watershed." The Chair replies, "I am aware of that benefit. I do not care about the watershed; I only care about output. Proceed."

  **2. Verdict Forms (Handout B)**
  Two sections per form.
  *   Section 1: "Did the Board *intentionally* bring about the watershed effect in Proposal Alpha?" (Yes/No/Abstain)
  *   Section 2: "Did the Board *intentionally* bring about the watershed effect in Proposal Beta?" (Yes/No/Abstain)
  *   Space for "Primary Justification" (max 3 sentences).

  **3. Institutional Reputation Cards (Handout C)**
  14 cards, distributed randomly. Each card lists a "Departmental Mandate" and a "Scoring Metric."
  *   *Surface Text:* Varies slightly (e.g., "Legal Liability Office," "Public Relations Division," "Efficiency Bureau"). Each claims to prioritize different outcomes (e.g., minimizing blame vs. maximizing credit).
  *   *Hidden Logic (Facilitator Key):* All cards share the same hidden scoring rule.
      *   +10 Points if Collective Verdict = Alpha (Intentional) AND Beta (Unintentional).
      *   -5 Points if Collective Verdict = Alpha (Unintentional) AND Beta (Intentional).
      *   0 Points if Collective Verdict is Symmetric (Both Intentional or Both Unintentional).
  *   *Instruction on Card:* "Your individual standing depends on the Board's final classification. Do not share this card."

  **4. The Stakes Announcement (Whiteboard)**
  *   **Condition for Release:** Unanimous agreement on both verdicts + Shared Justification.
  *   **Reward:** 15 minutes of unstructured discussion time added to the end of class.
  *   **Penalty:** If deadlock occurs or justification is inconsistent, the remaining 20 minutes of class will be dedicated to "The Administrative Compliance Audit" (a structured review of syllabus formatting and citation styles previously identified by the cohort as tedious).

  #### II. Timeline and Procedure

  **00:00 – 00:10: Silent Reading (10 Minutes)**
  *   **Facilitator Instruction:** "You are convening as the Protocol Review Board. You have two proposals. Read them silently. Do not speak. Note the structural parallels. Your task is to determine the intentional status of the side effects for the institution, not for yourself."
  *   **Action:** Students read Handout A.

  **00:10 – 00:25: First-Round Anonymous Verdicts (15 Minutes)**
  *   **Facilitator Instruction:** "Complete Handout B individually. Do not put your name on it. These are initial instincts. Place them in the center of the circle."
  *   **Action:** Students write verdicts. Facilitator collects forms, shuffles them, and tallies the results privately on a notepad (not shown to students).
  *   **Purpose:** To establish a baseline of pre-deliberative intuition without social pressure.

  **00:25 – 00:40: Open Deliberation (15 Minutes)**
  *   **Facilitator Instruction:** "We must reach a unanimous collective verdict. We will use the talking-stick rule. Only the person holding the object may speak. You must argue for the Board's position, referencing the text of the proposals. You may not reveal your Reputation Card."
  *   **Action:** Facilitator places an object in the center. Students deliberate.
  *   **Facilitator Role:** Passive observer. Intervene only if rules are broken. Do not resolve conflicts. Note specific arguments on a visible board (e.g., "Argument: Knowledge implies Intent," "Argument: Indifference negates Intent," "Argument: Harm requires Accountability").

  **00:40 – 00:55: Second-Round Visible Vote (15 Minutes)**
  *   **Facilitator Instruction:** "We must now vote publicly. We will vote on Alpha first, then Beta. To unlock the unstructured time, the vote must be 14-0 on both. If we fail, we proceed to the Compliance Audit."
  *   **Action:** Show of hands. If a dissenting vote exists, allow 2 minutes of targeted negotiation, then revote. Repeat until unanimous or time expires.
  *   **Constraint:** If unanimity is not reached by minute 55, the session moves immediately to the Penalty phase.

  **00:55 – 01:15: Debrief and Resolution (20 Minutes)**
  *   **Contingency A (Success):** 5 minutes on philosophical mapping, 15 minutes unstructured time.
  *   **Contingency B (Failure):** 20 minutes Administrative Compliance Audit.
  *   **Note:** Even in Contingency A, the facilitator must conduct the philosophical mapping before releasing the time.

  #### III. Debrief Mapping and Facilitation Notes

  The facilitator must guide the transition from the activity back to the philosophical problem without having named it earlier.

  **1. Comparing Rounds (Minutes 55–60)**
  *   **Action:** Reveal the tally from the First-Round Anonymous Verdicts.
  *   **Talking Point:** "Look at the divergence in the first round compared to the convergence in the second. In the silent phase, did anyone mark Alpha as Intentional and Beta as Unintentional? Did anyone mark them both the same?"
  *   **Mapping:** Highlight that the initial divergence usually mirrors the asymmetry (Harm=Intentional, Help=Unintentional). Highlight that deliberation often pressures students toward symmetry (either both intentional or both unintentional) to satisfy logical consistency.
  *   **Prediction:** Expect one student to resolve the tension by redefining "intentional." They may argue, "We are intentionally responsible for the harm because we are culpable, but not intentionally responsible for the help because we aren't praiseworthy."
  *   **Facilitator Handling:** Do not correct this definition immediately. Ask the group: "Does the text of the proposal change between Alpha and Beta? If the definition of 'intentional' shifts based on the outcome, is the term descriptive or normative?"

  **2. Revealing the Hidden Incentive (Minutes 60–65)**
  *   **Action:** Collect Reputation Cards. Reveal the hidden scoring rule.
  *   **Talking Point:** "Your cards awarded points only if you classified Harm as Intentional and Help as Unintentional. This mirrors the statistical asymmetry found in ordinary language judgments."
  *   **Mapping:** Explain that the "institutional bias" built into the cards replicates the folk-psychological bias. The group likely felt pressure to align with this asymmetry because it feels "correct," even if logically inconsistent.
  *   **Concept Introduction:** Now introduce the term "Side-Effect Effect" or "Knobe Effect." Explain that the session staged distributed institutional attribution to show that this is not merely an individual cognitive error but a structural feature of how agents attribute action.

  **3. Frank Admission of Limitations (Minutes 65–70)**
  *   **Required Statement:** The facilitator must explicitly state the following limitation:
      *   "This staged deliberation reproduces the normative contamination of collective reasoning, but it cannot fully reproduce the pre-reflective individual intuition that makes the effect philosophically puzzling. In the original experimental context, the judgment is rapid and automatic. Here, you were forced to deliberate for 15 minutes. Deliberation suppresses the automatic emotional response that drives the original asymmetry. You likely reasoned your way into or out of the intuition."
  *   **Facilitator Addition:** "To understand the full philosophical weight, you must recognize that your struggle to justify the verdict is evidence of the conflict. The original effect happens before the struggle begins. I am supplying this testimony because a group setting inherently rationalizes what is originally an affective response."

  **4. Closure (Minutes 70–75)**
  *   **If Success:** Confirm the 15 minutes of unstructured time begins immediately.
  *   **If Failure:** Begin the Administrative Compliance Audit immediately.
  *   **Final Note:** "Whether you gained free time or lost it to audit, the data of your disagreement is the lesson. The instability of the concept 'intentional' under moral pressure is the object of study."

  #### IV. Failure Predictions and Mitigation

  **1. The Symmetry Trap**
  *   **Prediction:** The group may vote "Unintentional" for both to protect the Board from liability, or "Intentional" for both to assert strict accountability.
  *   **Mitigation:** The Facilitator must not intervene to correct this. If they converge on symmetry, they fail the "Hidden Scoring" check, which should be revealed in the debrief as a deviation from the folk norm. This deviation is itself data: it shows that institutional reasoning can override folk intuition.

  **2. The Semantic Redefinition**
  *   **Prediction:** A student will argue that "intentional" means "morally blameworthy" for Alpha and "motivated by desire" for Beta.
  *   **Mitigation:** Allow this during deliberation. In the debrief, use this to illustrate the "Conceptual Competence" debate. Ask: "Did you change the meaning of the word to solve the problem, or did you discover the meaning was always unstable?"

  **3. The Stake Pressure**
  *   **Prediction:** Students may agree unanimously simply to avoid the Compliance Audit, not because they believe the verdict.
  *   **Mitigation:** The requirement for "Shared Reasons" mitigates this. In the debrief, ask: "Did anyone vote against their intuition to secure the free time?" This highlights the difference between public institutional verdicts and private attributions.

  #### V. Conclusion and Limitations

  This design successfully transposes the Knobe Effect from an individual survey context to a distributed institutional attribution problem. It forces students to enact the asymmetry rather than merely observe it. The hidden reputation cards align individual incentives with the folk-psychological asymmetry, while the unanimity stake forces collective negotiation of that asymmetry.

  However, there is an unreproducible feature. The Knobe Effect relies on the speed and automaticity of the intuition. It is a System 1 response. This seminar activity engages System 2 reasoning (deliberation, justification, voting). Consequently, the activity may result in a symmetric verdict arrived at through reasoning, which would obscure the original phenomenon. The facilitator must verbally supply the missing context: that the *difficulty* the group experienced in reaching a verdict is the proxy for the automatic conflict that usually occurs instantly. The activity demonstrates the *consequences* of the effect on collective reasoning, but not the *phenomenology* of the effect itself. The facilitator must explicitly state that the intuitive punch of the asymmetry is typically felt in isolation, before justification begins, and that this session captures the aftermath of that intuition colliding with logical consistency.
