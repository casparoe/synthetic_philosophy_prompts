prompt: |-
  I'm in my junior year phil of mind course and next week I'm running a 45-min study group on pansentience in fundamental physics — specifically whether panpsychism implies actual suffering obligations at the quantum field level. There are like 8 other students, mostly philosophy majors who haven't taken physics since high school, and I need to plan how to explain this without them just laughing and saying so atoms are depressed? Don't explain the concept to me; I need the teaching arc. What has to come first — establishing that physical properties don't automatically exclude proto-experiential ones, or framing the ethical problem of distributed suffering — and what depends on what? What's the one carrying example I should build around? I'm leaning toward comparing decoherence, when quantum coherence breaks, to the breakdown of an integrated experiential field, but I'm not sure if that works or if it requires too much physics; what must that example have and what must it lack? Then the misconceptions: they'll probably think I'm saying particles have human-like consciousness, or that this is just old animism with math symbols, and maybe that if fields suffer we have to save every rock. At exactly which point in the sequence should I head off each one? I also need one check question at the end that forces them to apply the ethical implication to a new physical system — not just repeat the idea — so I can tell if they actually got it. And what should I openly say I'm leaving out — maybe integrated information theory? — and refuse to explain at this level? There's a typo in my outline, I wrote existant but I think it's existent? Anyway help me map the dependencies.
