      *   *Best fit:* A Black Hole or a Vacuum State. Let's go with the **Quantum Vacuum**. It's fundamental, usually considered "empty," but in QFT it's active. If fields have proto-experience, does "empty" space suffer?

  7.  **Scope Limitations (What to Cut):**
