      *   "A 'reasonable people disagree' ending is a fail." -> Will end with a strong verdict.

  *(Self-Correction)*: Wait, I need to be careful not to conflate "belief" with "sentience." The prompt specifically says *not* the "is it conscious" question. I must stick rigidly to the *Intentional Stance*. Dennett's view is that beliefs are real patterns, not internal qualia. I will lean heavily into "Real Patterns."

  Let's write.

  *Structure:*
