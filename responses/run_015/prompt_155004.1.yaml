answer: |-
  **The Scenario**
  A three-member budget committee must approve a departmental grant, which institutional policy states is only truly justified if it satisfies two criteria: efficiency and equity. Member 1 votes yes solely because the grant is efficient, disregarding equity. Member 2 votes yes solely because the grant is equitable, disregarding efficiency. Member 3 votes no. By majority rule, the grant is approved. The outcome aligns perfectly with the institutional standard (both criteria are satisfied), but the specific rationale "approved because both efficiency and equity are satisfied" existed in the decision structure without being mentally held by any participant; Member 1 would have approved an inequitable efficient grant, and Member 2 would have approved an inefficient equitable one.

  **The Realist Explanation**
  A realist about free-floating rationales argues that the normative force of the decision comes from the objective fact that the grant met both criteria, regardless of the voters' mental states. The reason ("fund because efficient AND equitable") is a truth-apt proposition that obtained in the world. The committee functioned as a collective reason-responder where the structure of aggregation allowed the group to track a complex reason that exceeded the cognitive grasp of any individual member. The reason exists independently of being grasped; the committee merely discovered it through their voting mechanism.

  **The Anti-Realist Explanation**
  An anti-realist argues that reasons are necessarily grounded in the attitudes, intentions, or social practices of agents. Here, the "reason" is just a description of the institutional rules established by past agents, not a free-floating entity. The outcome is explained by the causal interaction of individual intentions (Member 1's desire for efficiency, Member 2's desire for equity) operating within a rule-based system. The appearance of a shared reason is an illusion created by the overlap of distinct, agent-bound motives. There is no "group reason" over and above the rules the agents agreed to follow.

  **The Structural Feature**
  The crucial feature is the **aggregation mechanism without reason-sharing**. The voting rule allows partial inputs (efficiency OR equity) to produce a collective output that satisfies a conjunctive standard (efficiency AND equity). This disconnect between individual intentional content and collective normative satisfaction forces the realist to posit a reason that bridges the gap without residing in a mind.

  **Stripping the Feature**
  If you strip this feature by requiring **unanimous reason-sharing** (i.e., all members must vote yes *because* both criteria are met), the case collapses into a standard agent-based explanation. The reason would then be explicitly held by every participant, eliminating the need for a "free-floating" entity to explain the normative alignment.

  **The Anti-Realist Attack**
  The anti-realist would attack this as a **stacked deck via reification**. They would argue the scenario treats the institutional rulebook as a "mind" capable of holding reasons, which is a category error. By defining the "true justification" as whatever the rulebook says, the realist smuggles in a proxy agent (the institution) and then claims the reason is free-floating because that proxy has no brain. The anti-realist insists that if you trace the rulebook back to its human authors, you find only grounded reasons; if you don't, you aren't dealing with reasons at all, just causal regularities.
