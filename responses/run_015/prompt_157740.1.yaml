  I'm putting together a one-page research pitch for a small philosophy-of-mind grant, about six months part-time. My half-formed idea is kind of messy: the usual debate about mind uploading and gradual neuron replacement asks whether personal identity survives if we swap biological parts for synthetic ones one by one, but everyone frames it in terms of preserving either synaptic weights or functional roles. I want to look at a weirder middle case—replacing tissue with synthetic nodes that dont preserve micro-connectivity or point-to-point weights, but do preserve the brain's macro-scale dynamical attractors, i.e. the same state-space trajectories over time. So the precise question is: does personal identity track structural continuity, dynamical continuity, or neither, and is there a principled reason to pick one?

