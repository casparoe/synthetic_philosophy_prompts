  **Project Title:** Dynamical Continuity and Personal Identity in Neural Replacement

  **Research Question:**
  Standard debates on mind uploading and gradual neuron replacement ask whether personal identity survives the swap of biological parts for synthetic ones. Prevailing positions frame survival conditions in terms of preserving either synaptic weights (structural continuity) or computational roles (functional continuity). This project asks a distinct question: Does personal identity track *macro-scale dynamical attractors*—the brain's state-space trajectories over time—even if micro-connectivity and point-to-point weights are not preserved? Is there a principled reason to privilege structural fidelity over dynamical fidelity?

  **The Gap:**
  Current literature leaves this open because it typically assumes micro-structural preservation is necessary for macro-functional continuity. Structuralists argue identity requires physical continuity; functionalists argue it requires causal role preservation. Both camps presuppose that altering micro-weights disrupts the relevant psychological continuity. Neither adequately addresses cases where micro-structure diverges significantly while macro-dynamics remain stable. By decoupling micro-structure from macro-dynamics, this project tests whether the "self" is a structural artifact or a dynamical pattern. This offers a novel middle ground between biological naturalism and abstract functionalism, challenging the assumption that psychological continuity supervenes strictly on local physical properties.

  **Methodology (6 Months Part-Time):**
  *   *Months 1-2:* Literature synthesis. Map existing arguments on identity and integrate foundational concepts from dynamical systems theory applied to cognition. Identify key definitions of "attractor states" in philosophical context.
  *   *Months 3-4:* Case construction. Develop rigorous thought experiments where synthetic nodes preserve global attractors but alter local connectivity. Analyze intuitive verdicts on identity survival in these scenarios against standard psychological continuity criteria. Refine cases based on initial analysis.
  *   *Months 5-6:* Argumentation and Drafting. Formulate a criterion for identity based on dynamical continuity. Address counterarguments regarding causal basis and substrate neutrality. Produce a draft article.

  **Deliverables and Success Conditions:**
  The concrete result will be a complete manuscript (approx. 8,000 words) suitable for submission to a journal in philosophy of mind or cognitive science. Success is defined as establishing a coherent distinction between structural and dynamical continuity that withstands initial objection and offers a defensible criterion for identity survival.

  **Failure Conditions:**
  The project fails if the distinction between micro-structure and macro-dynamics proves unintelligible in this context, or if intuitive verdicts on the thought experiments are too inconsistent to support a principled criterion. Given the part-time scope, failure also includes inability to fully formalize the dynamical systems analogy without oversimplification.

