answer: |-
  **Audit of Raw Material**
  The provided constraints divide into three categories. Chronological proximity and numerical independence are genuine desiderata, though "independence" requires strict definition to exclude copyists. Agreement with excavation is genuine but vulnerable to circularity. The criterion of embarrassment and absence of motive are reflexes of a suspicious temperament; they assume we can reliably reconstruct ancient psychology. Generic plausibility is a preference of secular modernity, often excluding the miraculous by definition. Finally, inferring reality from real place names is a high-risk heuristic that conflates background setting with narrative event.

  **Desiderata for Historical Classification**

  1.  **Claim Decomposition** (Non-negotiable)
      The criterion must grade discrete claims rather than whole narratives. A war may be historical while the divine intervention causing it is legendary. Treating "The Trojan War" as a single boolean value ignores that geography, causality, and supernatural agency carry different evidentiary weights. This merges the existence/accuracy split: a figure may exist without performing the attributed acts.

  2.  **Independent Anchoring** (Non-negotiable)
      To pass the Circular Cross-validation test, archaeological or epigraphic evidence must be identifiable without recourse to the narrative. If a site is identified *because* of the story, it cannot subsequently confirm the story.
      *Cost:* This drastically reduces the available evidence pool, as most excavations in contested regions are guided by the very traditions they aim to test.

  3.  **Signal vs. Noise Discrimination** (Non-negotiable)
      To pass the Absorbed Detail test, the criterion must distinguish between background color and specific corroboration. Real place names and offices were available for any storyteller to absorb; their presence confirms only the story's origin context, not its events. Corroboration requires a detail that is specific, unlikely to be guessed, and independently verified.
      *Cost:* Requires deep contextual knowledge of the period's "background noise" to establish what counts as surprising information.

  4.  **Utility Inversion** (Non-negotiable)
      To pass the Transmission Selection test, the criterion must treat vividness, moral clarity, and persistence as evidence of distortion, not fidelity. Features that make a story worth retelling are those that invite elaboration. A criterion must estimate distortion rates by analyzing the story's functional utility to its transmitters, not its coherence.
      *Cost:* Removes the most memorable parts of a tradition from consideration as historical data.

  5.  **Expected-Record Baseline** (Non-negotiable)
      Silence counts against a tradition only if there is a positive reason to expect a record. The criterion must explicitly state the documentation capacity of the society in question. Arguing from silence in an illiterate context is invalid; arguing from silence in a bureaucratic empire is permissible.
      *Cost:* Prevents the use of negative evidence in periods or regions where record-keeping was sporadic or perishable.

  6.  **Control Calibration** (Preference)
      The criterion should be run on cases where the outcome is independently settled. A method that fails to certify well-documented recent events or fails to exclude known inventions is defective.
      *Status:* Preference of methodological rigor. Some camps argue that ancient traditions are sui generis and cannot be judged by modern analogues.

  **Structural Questions**

  **Incompatible Desiderata:** The pair is **Control Calibration** versus **Neutrality Across Media**. If you tune a criterion to succeed on known historical cases (usually literate, state-level societies like Rome), you inevitably bake in requirements for written documentation or monumental architecture. This biases the criterion against oral traditions or stateless societies, causing it to return "legendary" for narratives that might be historically grounded but lack the specific evidence types available in the control cases. To maintain neutrality, one must give up perfect calibration on known cases, accepting that the tool will be less decisive in contexts unlike the controls.

  **Most Exclusionary Desideratum:** **Independent Anchoring**. This requirement excludes the most candidate criteria because the majority of arguments for the historicity of traditional narratives rely on archaeological correlations established *through* the narrative. Excavators often use the text to find the site, then use the site to validate the text. Insisting on independence breaks this loop but invalidates most existing claims of confirmation, leaving very few narratives able to satisfy the burden.

  **Purpose Shift:**
  *   **Court:** The **Expected-Record Baseline** becomes non-negotiable but shifts to legal standards of evidence (e.g., hearsay rules). **Utility Inversion** drops out; a motive to lie is relevant, but a motive to embellish is less so than direct testimony.
  *   **Religious Community:** **Independent Anchoring** and **Generic Plausibility** drop out or flip signs. Empirical verification is secondary to doctrinal coherence. The "miraculous" moves from implausible to expected. The non-negotiable requirement becomes fidelity to the community's theological identity rather than secular evidentiary standards.

  **Scorecard of Stances**

  | Desideratum | Austere Evidentialism | Generous Default | Memory-First |
  | :--- | :--- | :--- | :--- |
  | **Decomposition** | Pass | Fail (Treats narrative as whole) | Pass (Treats memory as object) |
  | **Independent Anchoring** | Pass | Fail (Accepts guided archaeology) | Fail (Irrelevant to memory study) |
  | **Signal vs. Noise** | Pass | Fail (Accepts absorbed detail) | Pass (Studies noise as signal) |
  | **Utility Inversion** | Pass | Fail (Trusts stability) | Pass (Focuses on utility) |
  | **Record Baseline** | Pass | Fail (Assumes records should exist) | Pass (Contextualizes silence) |
  | **Calibration** | Pass | Fail (Rejects modern analogues) | Fail (Rejects occurrence question) |
