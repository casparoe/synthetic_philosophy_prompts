answer: |-
  ### Specification for a Theory of Generational Cohort Kinds

  To serve both the empirical researcher (who needs a valid explanatory variable) and the metaphysician (who needs a valid ontological category), a theory of generational cohorts must satisfy the following nine requirements. Each includes the motivating case and the justification for its status as a requirement.

  **1. Identification Constraint (The APC Problem)**
  *   **Motivation:** Cohort = Period − Age. In any linear model, these three are perfectly collinear. Without external constraints, a "cohort effect" is mathematically indistinguishable from an age effect or a period effect.
  *   **Requirement:** The theory must specify substantive, non-statistical constraints (e.g., assuming age effects are non-linear while cohort effects are step-wise) that license identifying a specific variance component as *cohort* rather than *period*. It must explain how these constraints are empirically tested rather than merely assumed.
  *   **Why a Requirement:** Without this, the researcher commits specification error, and the metaphysician reifies a statistical artifact.

  **2. Boundary Determination**
  *   **Motivation:** Categories like "Millennial" have start/end years that shift between studies. If cohorts are kinds, a person born in 1980 cannot be ontologically distinct from a person born in 1981 without a principled reason.
  *   **Requirement:** The theory must state whether boundaries are sharp (necessary and sufficient conditions) or fuzzy (degrees of membership). If fuzzy, it must provide a metric for membership degree. If sharp, it must identify the event or mechanism that creates the discontinuity.
  *   **Why a Requirement:** Ontological kinds must have identity conditions; explanatory variables must have operational definitions.

  **3. Granularity Principle**
  *   **Motivation:** Cohorts are typically 15–20 years, but political shocks might last 4 years and technological shifts 30. Using a fixed width risks averaging over distinct causal mechanisms.
  *   **Requirement:** The theory must provide a principle for temporal width that is independent of the specific outcome variable being explained. It cannot define the width *post hoc* based on where the data looks significant.
  *   **Why a Requirement:** To avoid circularity. If the width is chosen to maximize the effect, the kind is a construct of the analysis, not a feature of the world.

  **4. Variance Threshold**
  *   **Motivation:** Within-cohort variance usually dwarfs between-cohort variance. If 95% of the variation is within the group, the group may be descriptively useless.
  *   **Requirement:** The theory must specify a minimum ratio of between-group to within-group variance required for kindhood, or explain why low variance does not preclude kind status (e.g., if the mechanism is necessary but rare).
  *   **Why a Requirement:** The researcher needs to know if the variable adds predictive power; the metaphysician needs to know if the clustering is robust enough to be a natural division.

  **5. Portability and Scope**
  *   **Motivation:** "Gen Z" is applied globally, but formative events (e.g., 9/11, the Euro crisis) are local. A person in rural India and one in New York share a birth year but not necessarily a historical context.
  *   **Requirement:** The theory must define the extension of the kind. Is it fixed by calendar dates (universal), shared exposures (local), or self-identification (psychological)? It must resolve conflicts when these criteria diverge.
  *   **Why a Requirement:** Determines whether the kind is a universal feature of human sociality or a local cultural construct.

  **6. Reflexivity (Looping)**
  *   **Motivation:** People hear they are "Millennials," adopt the label, and change their behavior to match stereotypes. This feedback loop alters the properties of the group.
  *   **Requirement:** The theory must state whether this instability disqualifies the kind (as unstable) or constitutes its reality (as an interactive kind). It must predict how the kind evolves as the label spreads.
  *   **Why a Requirement:** Human kinds differ from natural kinds because they react to classification. Ignoring this leads to failed predictions over time.

  **7. Causal Mechanism vs. Proxy**
  *   **Motivation:** "Generation" might just be a label for "entered labor market during a recession." If we control for the recession, the generation effect might vanish.
  *   **Requirement:** The theory must specify whether the cohort *itself* is the causal unit (e.g., via demographic crowding) or a proxy for a bundle of exposures. It must identify what evidence would distinguish the cohort from its correlated exposures.
  *   **Why a Requirement:** If it is merely a proxy, it is ontologically derivative and explanatorily redundant (omitted variable bias).

  **8. Epistemic Access and Error**
  *   **Motivation:** Individuals often misreport or dispute their cohort membership. There is no central authority.
  *   **Requirement:** The theory must explain what constitutes a mistake in cohort identification. If membership is self-identified, error is impossible; if it is objective, error is possible.
  *   **Why a Requirement:** Real kinds exist independently of our knowledge of them. If membership is purely subjective, it is a psychological kind, not a demographic one.

  **9. Temporal Persistence (Added Case)**
  *   **Motivation:** Some cohort effects fade (fashion), while others persist (political socialization). A kind that vanishes after five years differs from one that lasts a lifetime.
  *   **Requirement:** The theory must specify the expected duration of the cohort effect. Does the kind persist until death, or does it dissolve when the formative exposure recedes?
  *   **Why a Requirement:** Distinguishes a enduring social kind from a transient period shock.

  ***

  ### Analysis of Requirements

  **Non-Negotiable vs. Prejudicial**
  *   **Non-Negotiable:** Requirements **1 (Identification)**, **7 (Causal Mechanism)**, and **8 (Error)** are non-negotiable. Without 1, the variable is statistically illegitimate. Without 7, the kind is ontologically inert (a mere label for other causes). Without 8, there is no distinction between the kind and our belief about the kind, collapsing realism into subjectivism.
  *   **Prejudicial:** Requirements **2 (Sharp Boundaries)** and **4 (Large Effect Size)** are prejudices imported from classical natural kind essentialism. Biological species often have fuzzy boundaries and small effect sizes on specific traits while remaining real kinds. Insisting on sharp boundaries or high variance thresholds arbitrarily excludes "homeostatic property cluster" kinds, which may be the appropriate model for social groups.

  **Incompatibilities**
  There is a significant tension between **Requirement 3 (Granularity)** and **Requirement 5 (Portability)**.
  *   If the theory posits universal bands (e.g., 15-year widths globally) to satisfy Granularity, it struggles to satisfy Portability, because formative historical exposures (the likely causal mechanism) do not respect uniform 15-year cycles across different nations.
  *   If the theory posits local exposures to satisfy Portability, it struggles to satisfy Granularity, because different societies may require different band widths to capture equivalent social maturation.
  *   **Verdict on Compatibility:** Real-kind status, explanatory power, and tolerance of vague boundaries *can* be had together (as seen in biological species). However, **Universal Portability** and **Uniform Granularity** cannot likely be jointly satisfied if the causal mechanism is historical exposure. The specification implies that a theory claiming both is likely false.

  **Most Exclusionary Requirement**
  **Requirement 7 (Causal Mechanism)** does the most work in excluding candidate theories.
  *   Many theories can solve the APC problem (1) by stipulation.
  *   Many can accept fuzzy boundaries (2).
  *   But if "Generation" dissolves when controlling for specific exposures (recessions, wars, technology), it fails to be a *sui generis* kind. It becomes a shorthand for a list of events. This requirement excludes both the Strong Realist (who posits a mystical generational spirit) and the Deflationary (who denies the mechanism exists), leaving only the Derivative Realist.

  ***

  ### Scoring Candidate Positions

  **1. Strong Realism (Cyclical/Narrative)**
  *   *Score:* **Fail.**
  *   *Reasoning:* Fails Requirement 1 (APC) by relying on narrative assertion rather than identification constraints. Fails Requirement 7 (Causal) by positing an intrinsic "generational spirit" rather than identifiable exposures. Fails Requirement 5 (Portability) by imposing US-centric cycles on global populations. It satisfies Requirement 2 (Boundaries) too well, imposing artificial sharpness where none exists.

  **2. Deflationary Conventionalism**
  *   *Score:* **Partial Pass (Researcher), Fail (Metaphysician).**
  *   *Reasoning:* Satisfies Requirement 1 (APC) by treating cohorts as arbitrary controls, acknowledging the collinearity. Satisfies Requirement 2 (Boundaries) by admitting arbitrariness. However, it fails Requirement 7 (Causal) by denying the cohort any explanatory power beyond the label. It fails Requirement 8 (Error) because if membership is purely conventional, misclassification is impossible. It serves the researcher as a control variable but denies the metaphysician any ontological bracket.

  **3. Derivative Realism (Formative Exposures)**
  *   *Score:* **Pass.**
  *   *Reasoning:* Satisfies Requirement 7 (Causal) by identifying cohorts as carriers of specific historical shocks (e.g., labor market entry conditions). Satisfies Requirement 1 (APC) by modeling non-linear exposure effects. Satisfies Requirement 8 (Error) as membership is objective based on exposure. It struggles with Requirement 5 (Portability) and 3 (Granularity), admitting that "generations" may vary in width and scope by nation, but this is a feature of the theory, not a bug. It treats boundaries as fuzzy (passing 2) and accounts for Looping (6) via socialization.
