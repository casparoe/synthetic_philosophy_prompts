      *   Explain: "We are simulating universes. In some universes, few observers exist. In others, many do."
      *   Place two opaque bags at the front.
          *   **Bag H (Heads):** Contains 1 slip saying "OBSERVER", 11 slips saying "VOID".
          *   **Bag T (Tails):** Contains 6 slips saying "OBSERVER", 6 slips saying "VOID".
      *   **The Procedure:**
          1.  You (Facilitator) flip a coin privately. Select the corresponding bag.
          2.  All 12 participants draw one slip each, simultaneously.
          3.  **If "VOID":** They move to The Void. They put on noise-canceling headphones (or blindfolds). They receive a guaranteed £3 "participation fee" at the end. They do not bet. They do not see the pot. *For this round, they do not exist.*
          4.  **If "OBSERVER":** They sit in The Game Circle. They know they exist. They do **not** know how many other Observers are in the circle (they cannot turn around to count; they face forward). They know the bag rules.
  3.  **The Epistemic State:** Everyone in the Game Circle knows: *"I was randomly selected from the population. I exist. Was the coin Heads (1 of 1) or Tails (1 of 6)?"*

  ## 00:15 – 00:45 | Round 1: The Multiplier (Fixed Prize)
  **Payoff Regime:** Every correct guesser gets a fixed prize.

  1.  **The Pot:** Place £10 cash on the table for *each* Observer. (Visually: If there are 6 observers, there is £60 on the table. If 1 observer, £10).
  2.  **The Bet:** Each Observer writes down **H** or **T** on a card.
      *   If Coin matches Bet: They take the £10.
      *   If Coin mismatches: They get £0.
  3.  **The Presumptuous Option:** Before submitting their bet, offer them a choice:
      *   **Option A:** Bet as normal.
      *   **Option B:** Pay £3 from your potential winnings to **Reveal the Coin** before betting. (This guarantees a win, net £7).
      *   *Note:* This is the "Presumptuous Philosopher" moment. If they trust their anthropic reasoning, they shouldn't need to pay. If they think it's 50/50, the info is worth £5 (expected value gain), so they should pay.
  4.  **Action:** Collect bets. Do not reveal the coin yet. Keep the tension.
  5.  **Reset:** Everyone returns slips to a neutral pile. Mix positions.

  ## 00:45 – 01:15 | Round 2: The Dividend (Split Pot)
  **Payoff Regime:** One fixed pot per world, split equally.

  1.  **The Pot:** Place a single **£12** bundle on the table.
      *   **Rule:** "This £12 belongs to the World. It is split equally among all Observers in the Game Circle *if* the World guesses correctly."
      *   **Implication:**
          *   If Heads (1 Observer): They get £12 if right.
          *   If Tails (6 Observers): They get £2 each if right.
  2.  **The Bet:** Same as before (H or T).
  3.  **The Presumptuous Option:** Same offer. Pay £3 to reveal the coin.
  4.  **Action:** Collect bets.
  5.  **Resolution:** Now reveal the Coin Flip result for both rounds. Pay out the Observers. Pay the Void participants their £3.

  ## 01:15 – 01:30 | Debrief: Mapping the Pain to the Theory
  **Now you lecture.** Connect their gut feelings to the formalism.

  ### 1. The Algebra Check (Validating Your Insight)
  Write the expected utilities on the board. Let $N=6$.

  | Regime | Theory | $P(Heads)$ | $P(Tails)$ | Payoff (H) | Payoff (T) | **EU (H)** | **EU (T)** | **Preference** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Fixed Prize** | **SIA** | $1/7$ | $6/7$ | £10 | £10 | £1.43 | £8.57 | **Tails** |
  | | **SSA** | $1/2$ | $1/2$ | £10 | £10 | £5.00 | £5.00 | **Indifferent** |
  | **Split Pot** | **SIA** | $1/7$ | $6/7$ | £12 | £2 | **£1.71** | **£1.71** | **Indifferent** |
  | | **SSA** | $1/2$ | $1/2$ | £12 | £2 | **£6.00** | **£1.00** | **Heads** |

  *   **Point out:** "In Round 1, most of you bet Tails. That's SIA intuition. You felt 'I'm here, so it's more likely to be the world with more people.'"
  *   **Point out:** "In Round 2, did your confidence drop? SIA says you should be *indifferent* now. The higher probability of Tails is exactly cancelled by the smaller share of the pot. SSA says you should switch to Heads, because you don't update the probability, so you just see the dilution."
  *   **The Verdict on Your Claim:** Confirm explicitly: "The organizer hypothesized that SIA+Selfish mimics Total Utilitarianism, and SSA+Selfish mimics Average Utilitarianism. Look at the Split Pot row. Total Utilitarianism (World H Total = £12, World T Total = £12) is indifferent. Average Utilitarianism (World H Avg = £12, World T Avg = £2) prefers Heads. The math matches the anthropology perfectly. The debate is indeed a disguised utility aggregation problem."

  ### 2. The Presumptuous Moment
  *   Ask: "Who paid the £3 to see the coin?"
  *   **SIA players (Round 1):** Should not have paid. (EV of betting Tails was £8.57; EV of buying info was £7). If they paid, they didn't trust the anthropic update.
  *   **SSA players:** Should have paid. (EV of betting was £5; EV of buying info was £7).
  *   **Discussion:** "The Presumptuous Philosopher says 'I don't need to run the experiment, my existence tells me the answer.' In Round 1, SIA believers *are* the Presumptuous Philosopher. Did you feel arrogant skipping the info? Did it pay off?"

  ### 3. Reference Classes & "Existence"
  *   Ask the "Void" participants: "How did it feel to be told you didn't exist?"
  *   This addresses the "could have failed to exist" limitation. In the game, "Void" = "Non-existent". In reality, we can't experience non-existence. Acknowledge this gap: "You felt *exclusion*, not *non-existence*. That's the limit of the simulation."

  ---

  ## Predictable Failure Modes & Fixes

  **1. The "Gamer" (Reference Class Attack)**
  *   **The Problem:** A participant argues: "I'm not a random observer. I'm [Name]. [Name] would have been selected regardless of the coin flip. So $P(H)=P(T)=1/2$."
  *   **The Fix:** Pre-empt this in the rules. "For the purpose of this bet, you are to reason as if you are a random sample from the set of Observers. If you break this frame, you forfeit the bet."
  *   **Debrief Use:** This is actually a valid philosophical objection (the "Reference Class Problem"). Acknowledge it in the debrief. "This is why SSA is tricky—defining the class of 'observers like me' is hard. But for the game, we fixed the class."

  **2. The "Void" Jealousy**
  *   **The Problem:** The 11 people in the Void during Heads feel cheated out of the game.
  *   **The Fix:** The guaranteed £3 participation fee is crucial. Frame the Void as "You are in a universe where you weren't born. You get a universal basic income."
  *   **Debrief Use:** Use their boredom to illustrate the "Silence of the Universe." If Tails is true, most observers are in crowded worlds. If Heads, most are alone.

  **3. Counting Heads**
  *   **The Problem:** Observers in the Game Circle try to peek or count chairs to estimate $N$.
  *   **The Fix:** Face everyone forward. Use dividers if possible. Emphasize: "You cannot see other observers. You only know your own existence."
  *   **Debrief Use:** "If you could see the others, the uncertainty collapses. Anthropics only applies when you are uncertain about your indexical location."

  **4. The "Split Pot" Confusion**
  *   **The Problem:** Participants think the pot is £12 *per person* in Round 2.
  *   **The Fix:** Use physical cash. In Round 1, put £10 in front of *each* chair. In Round 2, put one £12 bundle in the *center*. Visuals matter more than words.

  ---

  ## Limitations: What This Cannot Reproduce

  Be honest about this in the final 5 minutes.

  1.  **The "Could Have Been Nothing" Gap:**
      *   *Issue:* In the game, "Void" participants still exist in the room. They just don't bet. In the real Presumptuous Philosopher problem, the worry is about *ontological* existence, not *participation*.
      *   *How to Bridge:* "In the game, you felt the *selection effect*. In reality, the debate is about whether the fact of your consciousness is evidence about the world. We simulated the selection; you have to imagine the metaphysics."

  2.  **The Stakes:**
      *   *Issue:* £10 isn't enough to trigger deep existential dread or true risk assessment.
      *   *How to Bridge:* "You played for chocolate money. The Presumptuous Philosopher is arguing about the fate of the cosmos. The logic scales, but the emotional weight does not."

  3.  **The "One-Shot" Nature:**
      *   *Issue:* Anthropics often implies a frequentist long-run (many universes). This was one coin flip.
      *   *How to Bridge:* "We ran two rounds. If we ran this 100 times, the SIA bettors would win more money in Round 1, but break even in Round 2. The SSA bettors would lose in Round 1, win in Round 2. The 'truth' of the probability depends on which payoff structure governs reality."

  ## Facilitator Script Snippet (For the Debrief)
  *"You just lived the 'Total vs. Average' utilitarianism debate without hearing the words. When the pot was fixed per person (Total Utility), you wanted the big world (Tails). When the pot was fixed per world (Average Utility), you wanted the small world (Heads). SIA and SSA are just the probability engines that make your selfish preferences align with those two ethical frameworks. If you are a Total Utilitarian, you should act like an SIA agent. If you are an Average Utilitarian, you should act like an SSA agent. The disagreement isn't about math; it's about what you value."*
