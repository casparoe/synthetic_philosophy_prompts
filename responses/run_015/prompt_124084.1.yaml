answer: |-
  Dear Colleague,

  Your observation cuts to the quiet heart of what historical drama does, which is not merely to bend the past but to occupy it. You are right to sense that the existing vocabulary fails you here. Prosthetic memory describes an acquisition, a new layer added to the self, whereas you are describing a subtraction, a overwriting. The misinformation effect describes a corruption of belief, whereas you describe a corruption of imagination where belief remains intact. Dramatic license is the justification, not the wound. There is no single established term that captures this specific mechanism of knowing falsehood becoming functional truth, so I offer you this carving: let us call it Iconic Usurpation.

  Iconic Usurpation occurs when a fabricated narrative element, despite being acknowledged as fiction by the audience, displaces the factual record in the cultural imagination because it offers superior narrative coherence or visual availability. The key distinction lies in the epistemic status of the viewer. In ordinary falsehood, the audience is deceived; they think the thing happened. In Iconic Usurpation, they know it did not happen, yet they retain the image as the primary heuristic for understanding the subject. It matters not at all that the audience is not deceived. The human mind does not store truth and fiction in separate silos; it stores them by associative weight. The invented scene is usually designed to be emotionally resonant, visually distinct, and structurally tidy. The historical truth is often bureaucratic, ambiguous, and visually thin. When the brain retrieves the concept of the historical figure, it reaches for the handle that fits the hand best. The disclaimer acts as a label on the handle, but it does not change the grip. Thus, the fiction becomes the operational truth.

  This definition excludes the case of the composite character, which is a different phenomenon entirely. A composite is an act of consolidation, merging several historical agents into one for clarity. It is an effacement of plurality, not a usurpation by fiction. The audience understands they are looking at a representative figure, whereas in Iconic Usurpation, they are looking at a specific individual acting out a specific lie. Similarly, an avowedly fictional novel about real people operates differently because the contract of fiction is established before the first page is turned. The reader enters a space of play. The prestige drama, however, wears the costume of history; it claims the authority of the record even while subverting it. The medium does matter, though it is not exclusive to the audiovisual. A vivid anecdote in a popular history can achieve Iconic Usurpation if it is sufficiently narratively satisfying to override drier records. However, film accelerates the process because it provides the specific image. Text requires the reader to generate the image, leaving room for the factual record to coexist. Film provides the image ready-made, leaving no visual vacuum for the truth to fill.

  You ask whether it matters if the real person did the mythologizing first. Here the carving must be precise. If the subject lied in their memoirs and the film adapts that lie, the film is transmitting a historical artifact rather than inventing a new one. This is not Iconic Usurpation in the purest sense, because the fiction originated in the life, not the production. However, the film amplifies the usurpation by cementing the self-myth into the public record with the authority of cinema. The wrong shifts from being against the person's actual history to being against the historical record itself.

  This leads to the nature of the wrong. You ask whether this is misrepresentation or usurpation. It is unequivocally usurpation. Misrepresentation implies getting the picture wrong; usurpation implies taking the place. When a fictional scene becomes the standard against which a person's courage is measured, the fiction has taken the seat of judgment. The real person is not merely misrepresented; they are evicted from their own life. This holds true even when the image is flattering. A flattering fiction is still a wrong because it denies the subject their actual humanity. It reduces a complex, perhaps difficult, human being to a symbol of virtue. The dead are wronged not because their reputation is tarnished, but because their reality is erased. They become monuments to a virtue they did not practice, which is a form of silencing as potent as defamation. It turns a life into a lesson, and in doing so, it strips the life of its truth.

  Does this concept help determine what correction is owed? Sadly, it suggests that correction is often impossible. Your memos perform the vital work of marking the boundary between the record and the invention, but they cannot compete with the visceral availability of the image. Once Iconic Usurpation has occurred, the truth becomes a footnote to the fiction. The correction owed is not to the audience, who will not unsee what they have seen, but to the record itself. Your work ensures that somewhere, in the archives of production or in the footnotes of history, the displacement is documented. You are not preventing the usurpation; you are bearing witness to it.

  There is a temptation to think that if the fiction captures a structural truth, the usurpation is justified. But structural truth is the province of the historian or the philosopher, not the dramatist. When the dramatist claims it, they demand the authority of fact while exercising the liberty of fiction. This is the core of Iconic Usurpation: it is the enjoyment of the authority of history without the burden of its constraints. You are right to be preoccupied by it. It is the quiet violence of the genre, the moment the image eats the person. Your memos are the only thing standing between the person and the monument, and even if the monument stands, your work ensures we know it is stone, not flesh.

  Yours,

  A Fellow Traveller in History
