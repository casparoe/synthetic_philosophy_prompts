answer: |-
  **TO:** All Members, Local 412 (Precision Metal-Fabrication)
  **FROM:** Technology Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Management Proposal on CNC Adaptive Process-Control System

  **RECOMMENDATION: ACCEPT WITH CONDITIONS**

  The Technology Review Committee has reviewed Management's proposal to install machine-vision and adaptive process-control systems across the CNC lines. After three weeks of deliberation, including testimony from shop stewards, external technical consultants, and legal counsel, the Committee recommends that the membership **vote to accept the proposal only if the following two conditions are met.**

  We believe the core offer—an eight-year no-layoff guarantee and a four-hour reduction in the workweek at unchanged pay—represents a tangible capture of productivity gains. However, the current language regarding data ownership and job classification threatens the long-term value of our labor. We cannot trade our collective expertise for short-term leisure if it means dismantling our bargaining power for the next generation.

  **COUNTER-PROPOSALS (CONDITIONS OF ACCEPTANCE)**

  To move forward, Management must agree to the following modifications in the Side Letter Agreement:

  1.  **Data Sovereignty and Non-Compete Restriction (Modifying the Feedback Clause):**
      *   **Current Text:** Overrides/corrections are logged, uploaded, and used to retrain the vendor's model, which is licensed to the plant and competitors.
      *   **Required Change:** All operational data generated by machinist overrides constitutes "Work Product" owned jointly by the Plant and the Union. The vendor is granted a non-exclusive license for system maintenance *only*.
      *   **Restriction:** The vendor is explicitly prohibited from licensing models trained on Local 412 data to competing fabrication firms. If the vendor wishes to commercialize this data externally, a royalty structure must be negotiated, with 50% of net licensing revenue distributed to the Union Training Fund.

  2.  **Classification Protection (Modifying the Reassignment Clause):**
      *   **Current Text:** Management may reassign displaced workers to 'process monitoring,' graded a band lower.
      *   **Required Change:** The new classification of "Process Monitor" shall be graded at the *current* Machinist Band minimum or higher.
      *   **Rationale:** Supervising an adaptive system requires diagnostic judgment and liability assumption equivalent to manual operation. If the system absorbs manual tasks, the remaining cognitive load is of higher value, not lower. No current employee shall be red-circled (paid above grade) or down-graded as a result of this transition.

  ***

  **THE STRONGEST VERSION OF THE REJECTED POSITION**

  In making this recommendation, the Committee explicitly rejects the position held by approximately one-third of our membership to **reject the proposal outright.** We owe it to those members to state their case as strongly as possible, for it contains a vital warning.

  The argument for outright rejection holds that the "generous" offer is a Trojan Horse. The eight-year no-layoff guarantee is not job security; it is a slow-acting displacement strategy. By Year 8, the system will have learned enough from our overrides (via the Feedback Clause) to render the Machinist classification obsolete. At that point, the Union will have no leverage because the "accumulated judgment of the shop floor" will have been extracted, packaged, and sold to our competitors.

  Proponents of rejection argue that accepting *any* version of the Feedback Clause legitimizes the commodification of worker knowledge. They contend that a four-hour week is meaningless if, in exchange, we train the algorithms that will eventually undercut our wages industry-wide. From this view, the only winning move is to refuse the technology until the ownership of the learning process itself is transferred to the workers. To accept the machine, even with conditions, is to acknowledge Management's right to own the means of cognitive production.

  ***

  **PHILOSOPHICAL ANALYSIS: CO-OPERATION VS. COLLABORATION**

  A third perspective within the Committee, drawing on historical materialist analysis, suggests that machinery itself is neutral; the outcome depends on who captures the gain. This raises a critical question for every member voting on Friday:

  **On this way of thinking, what is the difference between co-operating with the new machinery and collaborating in our own displacement, and does the feedback clause fall on one side of that line or the other?**

  **The Distinction:**
  Co-operating with machinery means utilizing technology to reduce necessary labor time, thereby increasing leisure or wages while maintaining control over the production process. It is the worker using the tool to master the material.

  Collaborating in displacement occurs when the worker surrenders the *knowledge* required to use the tool, allowing the technology to become an independent power that stands against them. It is the tool using the worker to master the process. When the worker's input becomes mere data feed for a system they do not control, they are not operating the machine; they are training their replacement.

  **The Verdict on the Feedback Clause:**
  Under the current wording, the Feedback Clause falls squarely on the side of **collaborating in displacement.**

  It does not merely record production metrics; it extracts the tacit knowledge—the "feel," the intuition, the corrective judgment—that constitutes the machinist's skill. By allowing the vendor to license this retrained model to competitors, the clause socializes the cost of training (our labor) while privatizing the benefit (the vendor's IP and the competitors' efficiency).

  If we accept the Feedback Clause as written, we are not shortening the working day through increased efficiency; we are eroding the scarcity of our skills that allows us to demand a shorter working day. We are turning our expertise into a public good for capital, while our wages remain a private cost to be cut.

  **However,** if we secure the Counter-Proposals listed above, the balance shifts. By retaining ownership of the data and preventing competitor licensing, we transform the Feedback Clause from an extraction mechanism into a protected asset. By maintaining the job classification, we acknowledge that monitoring complex adaptive systems is skilled labor.

  **CONCLUSION**

  We can welcome the machine without welcoming our own obsolescence. The Technology Review Committee urges the membership to vote **YES** on the proposal *conditional* on the acceptance of the Counter-Proposals. If Management refuses these conditions, the Committee recommends the proposal be treated as **REJECTED.**

  Solidarity,

  *The Technology Review Committee*
  *Local 412*
