      *   **Constraint:** Focus on Aristotle's conceptual resources, avoiding uncritical importation of modern vocabulary, but use comparisons where illuminating. Think step-by-step.

  2.  **Step 1: Clarify Aristotle's Distinction (First vs. Second Actuality):**
