  # DIAGNOSTIC HANDOUT: MAPPING THE SLEEPING BEAUTY SPACE

  **Instructions:** Answer the following ten questions based on your immediate philosophical intuitions. Do not worry about standard labels (e.g., "Halfer") yet; follow the branches to find your position in the logical space.

  ### THE TREE

  **1. The Scoring Unit**
  When assessing the rationality of Beauty's credence, should accuracy be calculated **per awakening** (each time she opens her eyes counts) or **per experimental run** (the whole coin-toss procedure counts once)?
  *   (A) Per Awakening → *Go to 2*
  *   (B) Per Run → *Go to 4*

  **2. The Large-Number Stress Test**
  In a variant where Tails yields **1,000 awakenings** and Heads yields one, does rationality require near-certainty (e.g., >99%) that the coin landed Tails?
  *   (A) Yes → *Go to 3*
  *   (B) No → *Leaf E (Unattractive/Unexplored)*

  **3. The Temporal Unit**
  In a variant where the Monday awakening lasts **one minute** and the Tuesday awakening lasts **five hours**, does the longer duration carry more weight for your credence?
  *   (A) Yes (Time matters) → **Leaf D (SIA-Thirder)**
  *   (B) No (Discrete awakenings matter) → **Leaf A (Standard Thirder)**

  **4. The Monday Update**
  Upon being told "It is Monday," does Beauty's credence in Heads **increase** from her awakening credence?
  *   (A) Yes → *Go to 5*
  *   (B) No (It stays fixed) → *Go to 6*

  **5. The Diachronic Constraint**
  Could Sunday Beauty rationally mandate a **different** credence for Monday Beauty, or must Sunday's plan bind Monday's state?
  *   (A) Sunday binds Monday → **Leaf B (Lewisian Halfer)**
  *   (B) They can diverge → **Leaf C (Hybrid/Unstable)**

  **6. The Red/Blue Variant**
  In a variant where Tails-awakenings are qualitatively distinct (Red room / Blue room) but guaranteed to occur, does finding yourself in **Red** update your credence away from the base rate?
  *   (A) Yes (Self-location is evidence) → *Go to 7*
  *   (B) No (No new information) → *Go to 8*

  **7. The Future Coin**
  In a variant where the coin is tossed **Tuesday night** (after awakenings), is your Monday credence different from the Standard Case (tossed Sunday)?
  *   (A) Yes (History matters) → **Leaf F (Past-Fact View)**
  *   (B) No (Structure matters) → **Leaf B (Lewisian Halfer)** *[Merges with 5A]*

  **8. The Frequency Check**
  If the experiment is run **1,000 times** in a series, does your credence for a *single* run change compared to running it once?
  *   (A) Yes (Frequency drives single-case) → **Leaf G (Frequentist Halfer)**
  *   (B) No (Single-case is autonomous) → **Leaf C (Double Halfer)** *[Merges with 4B/6B]*

  **9. The Evidence Claim**
  Is the proposition "I am awake now" **new evidence** compared to what Beauty knew on Sunday?
  *   (A) Yes → *Check Consistency with Leaf A/B*
  *   (B) No → *Check Consistency with Leaf C*
  *(Note: This node tests coherence with your previous path. If you answered "Per Run" but "Yes Evidence," you may be in an empty cell.)*

  **10. The Number**
  In the Standard Case (one awakening on Heads, two on Tails), is your credence in Heads **1/2**?
  *   (A) Yes → *Confirm Leaf B, C, or G*
  *   (B) No (It is 1/3 or proportional) → *Confirm Leaf A or D*

  ---

  ### THE LEAVES (POSITIONS)

  **Leaf A: Standard Thirder**
  *Commitments:* Per Awakening; Large-N implies near-certainty; Discrete counts (not time); Self-locating evidence counts.
  *Awkward Commitment:* Must accept that merely being awake is evidence of Tails, despite knowing in advance you would be awake.

  **Leaf B: Lewisian Halfer**
  *Commitments:* Per Run; Monday Update increases credence (to 2/3); Sunday binds Monday; Causal history irrelevant.
  *Awkward Commitment:* Must accept that $P(Heads)$ changes upon learning "Monday" without new information about the coin itself (violates strict Conditionalization on coin states).

  **Leaf C: Double Halfer**
  *Commitments:* Per Run; Monday Update fixed (1/2); Self-locating evidence irrelevant; Single-case autonomous.
  *Awkward Commitment:* Must explain why the betting odds (2:1 on Tails) diverge from rational credence (1:1), or deny the betting setup is relevant.

  **Leaf D: SIA-Thirder (Time-Weighted)**
  *Commitments:* Per Awakening; Large-N implies near-certainty; **Duration matters** (5 hours > 1 minute).
  *Awkward Commitment:* Must accept that a dreamless coma extension changes the probability of a past coin toss.

  **Leaf E: The "Run-Count" Hybrid (Unattractive)**
  *Commitments:* Per Awakening scoring but rejects Large-N implication.
  *Status:* **Incoherent.** If awakenings are the unit of scoring, 1000 awakenings must outweigh 1.

  **Leaf F: Past-Fact Halfer (Rare)**
  *Commitments:* Per Run; Credence depends on the coin being a *fixed past fact* (changes in Future Coin variant).
  *Status:* **Unexplored.** Most Halfers rely on Objective Chance (1/2) regardless of past/future status.

  **Leaf G: Frequentist Halfer**
  *Commitments:* Per Run; Single-case credence depends on long-run series frequency.
  *Awkward Commitment:* Must accept that a single isolated experiment lacks a determinate rational credence.

  ---

  ### INSTRUCTOR'S COMMENTARY & META-ANALYSIS

  **1. Label Placement & Empty Cells**
  *   **Genuine Cells:** Leaves A (Thirder), B (Lewisian Halfer), and C (Double Halfer) are the standard occupied cells.
  *   **Unoccupied/Incoherent:** Leaf E is logically incoherent (scoring unit contradicts weight). Leaf F is theoretically possible but practically unoccupied (most Halfers are Chance-based, not Past-Fact-based). Leaf G is usually a methodological stance rather than a distinct credence view.
  *   **Indistinguishable Leaves:** Leaf B (Lewisian) and Leaf F (Past-Fact) may collapse. If a student answers "Yes" to Future Coin (Node 7) but "No" to Monday Update (Node 4), they have no leaf. This suggests the **Future Coin variant** is a weak discriminator for standard views; most Halfers answer "No" (Chance is 1/2 either way).
      *   *Recommendation:* If Leaf F remains empty, replace Node 7 with a **Cloning Variant** (e.g., "If Beauty is cloned on Tails rather than woken twice, does credence change?"). This better tests the "number of observers" intuition without causal history noise.

  **2. The "No Leaf" Outcome**
  If a student's answers lead to no leaf (e.g., Per Awakening + No Monday Update), this indicates an **inconsistent triple of intuitions**.
  *   *Diagnosis:* They likely hold that awakenings count for scoring (Thirder) but deny that "It is Monday" is evidence (Halfer).
  *   *Fix:* Ask them to revisit **Node 9 (Evidence Claim)**. If they claim "I am awake" is *not* evidence, they cannot consistently score per awakening (Node 1). They must choose: either awakenings don't count (go to Branch B) or "Monday" is evidence (go to Branch 4A).
  *   *Missing Node:* If many students land here, add a node on **Centered Worlds**: *"Are propositions about 'me' and 'now' capable of being true or false independently of uncentered facts?"* This clarifies whether they reject the evidence or the ontology.

  **3. Variant Diagnostics**
  *   **Future Coin (Node 7):** As suspected, this variant does not cleanly separate Halfers from Thirders (both often say "Same"). It separates **Chance-Trackers** from **Truth-Trackers**. If you want to test memory/evidence specifically, the **Red/Blue (Node 6)** node is more effective.
  *   **Duration (Node 3):** This effectively separates "Awakening Counters" (Standard Thirder) from "Observer-Moment Counters" (SIA). It is a strong diagnostic for the *unit* of self-location.
  *   **Large Numbers (Node 2):** This is your strongest filter. Any view that says "Per Awakening" but "No" to Large Numbers is unstable. Use this to force students off the fence.

  **4. Labels That Didn't Fit**
  *   **"Halfer"** is not a single cell. It splits into **Lewisian (Leaf B)**, **Double (Leaf C)**, and **Frequentist (Leaf G)**. Your handout should explicitly teach that "Halfer" is a family of views distinguished by Nodes 4, 5, and 8.
  *   **"Thirder"** is similarly split by Node 3 (Time vs. Count), though this distinction is less commonly named in the literature.

  **5. Final Advice**
  The tree prioritizes **logical consistency** over **popularity**. If a student lands in Leaf E or F, do not tell them they are "wrong." Tell them they have found a gap in the literature: Leaf F is a viable position nobody has explicitly defended, and Leaf E is a contradiction that needs resolving. This turns the diagnostic into a research tool.
