      *   (iv) Fly/Beetle: P = Prey. Why? Because nutrition comes from both normally. (Keeps verdict).
      *   (vii) Network: If downstream exploitation is selected for (loss reduction), then yes, content. (Resolves tension).
      *   (viii) Colonists: Content shifts when the *normal conditions* shift and selection stabilizes the new correlation. (Accepts vagueness as a feature of "normality").
      *   *Sacrifice:* The user might have to soften (i) slightly. It's not just *Fly*, it's *Fly-or-Normal-Surrogate*. But given pellets are rare, *Fly* is the normal condition.
      *   *Hard Overturn:* I need to pick one verdict to overturn if necessary. The "First Creature" case (x) usually forces an overturn of the idea that an individual can have content without a lineage. I will advise overturning the intuition that Gen 1 has content.
