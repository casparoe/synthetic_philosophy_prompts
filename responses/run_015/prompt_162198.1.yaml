      *   *Draft:* A state S represents P iff: (1) S has a Proper Function to indicate P; (2) This function is conferred by a history of selection (or design) where tokens of S were reproduced because they indicated P *and* this indication allowed a consumer system to perform a survival/reproductive (or loss-reducing) task; (3) P is the condition that *normally* obtains when S performs this function successfully.

  7.  **Evaluating the User's Verdicts against the Repair:**
