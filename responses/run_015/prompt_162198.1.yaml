      *   *Recommendation:* The user seems to want Specific Content in (i) but General in (iv). This requires a "Normal Conditions" clause. In (i), pellets are *abnormal*. In (iv), beetles are *normal*.
      *   *Wait, looking closer:* In (i), the frog snaps at pellets (error). In (iv), the creature eats beetles (success). The difference is whether the non-Fly item yields the *selected-for effect*.
