      *   **Friend's Position (Instrumentalism):** Technology is a neutral tool. A hammer can build a house or hit a thumb. The wristband *could* be used for coaching, but capitalists use it for firing. This aligns with liberal technocracy.
      *   **User's Position (Critical Theory/Marxism):** Technology is never neutral. It embodies the social relations of its production and deployment. The wristband *is* a disciplinary device, regardless of the "coaching" label.
      *   **Marx on Machinery:** In *Capital Vol. 1*, Marx argues machinery isn't just a productivity booster; it's a weapon against labor power. It deskills, intensifies labor, and creates a reserve army of labor. It subsumes the worker under the machine, not vice versa.
      *   **Theory of Value:** The system relies on *Surplus Value* extraction. Time = Money. "Inefficiency" is theft. The "coaching" frame tries to mask exploitation as self-actualization.
      *   **Coherence/Contradiction:** The contradiction lies between the *subjectivity* offered to the worker ("You are a craftsman improving!") and the *objectivity* imposed on them ("You are data point #492, delete if below threshold").

