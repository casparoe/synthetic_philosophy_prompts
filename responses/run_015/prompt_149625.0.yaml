answer: |-
  The minute book from 1937 smells of damp paper and iron gall ink, a sharp, metallic tang that catches in the back of the throat. It sits on the folding table in the committee room, open to the page where the first chairman recorded the receipt of the land deed. The solicitor's handwriting is looping and confident, noting that the plot was gifted to the town in perpetuity. That word sits on the page like a stone. Perpetuity. It implies a timeline that outlasts the people writing it, a promise extending beyond the reach of any single life. I run my finger over the photocopy we made for the archives, feeling the slight ridge of the toner, and then I look at the letter from the council sitting next to it. The council letter is printed on bright white stock, crisp and temporary. It informs us that the lease is being terminated in six weeks and the site will be transferred to the Urban Renewal Trust. The Trust plans to fill the pool and install a splash park. There is no mention of perpetuity in their brochure. There is only a rendering of children running through misters, wearing swim shorts that look nothing like the ones hanging on the line outside.

  I close the book. The sound is a dull thud that seems too loud for the small room. Outside, the air is thick with the smell of chlorine and cut grass. It is July, the peak of the season, and the lido is full. From the window, I can see the water flashing green in the sunlight. It is not the bright turquoise of the leisure centre two miles away; it is darker, stained by algae and age, but it holds the heat of the sun longer. There are thirty people in the water. Some are doing lengths, heads down, arms cutting through the water with the rhythmic precision of people who have done this every morning for twenty years. Others are floating, staring up at the sky. A mother is teaching her son to kick, holding him under the arms, her voice drifting up through the open sash window. She is telling him he is doing well. He is not doing well, but he is trying. This is the thing that confuses the half of the committee who say nothing has collapsed. The swimming is happening. The skill is being transmitted. The water is holding them up. If you judged by the activity alone, the institution is healthy.

  I take the box files down from the shelf. There are eighty-seven of them. They contain the records of every repair, every subscription drive, every argument about the price of entry tickets. In 1954, they argued about whether to install a diving board. In 1978, they argued about the heating costs. In 2019, they argued about the state of the concrete surround. The arguments are different, but the shape of them is the same. They are all arguments about how to keep the thing going for another year, and then another. I pack the files into cardboard boxes. The tape gun makes a ripping sound each time I seal a lid. It sounds like something tearing.

  Arthur is waiting by the gate when I go out to lock up the office. He is eighty-two and has swum here since he was ten. He is wearing a towelling robe over his trunks, smoking a cigarette despite the signs. He doesn't look like a man witnessing a catastrophe. He looks like a man waiting for a bus. He asks me if I have heard anything about the lanes at the leisure centre. I tell him the swimming club has been offered six lanes on Tuesday evenings. He nods, tapping ash onto the concrete. He says the water there is too cold, but he supposes he can wear a wetsuit. He says it is a pity about the dive board, but he never used it much anyway. He is not grieving. He is adjusting. He is making the promise shorter without calling it that. He is accepting that the thing which was supposed to last forever will now last only as long as the council contract for the leisure centre lanes, which is reviewed annually. He does not say this. He asks me if I want a lift to the station. I say no, I have to check the locks.

  Later, I sit at the kitchen table with the transfer agreement from the Trust. My daughter is asleep upstairs. She learned to swim here last August. She was four. She wore a suit with pink flamingos on it. She was terrified of the water until the lifeguard, a boy with bleached hair and a whistle, showed her how to put her face in and blow bubbles. Now she sleeps with a towel wrapped around her like a cape. I look at the agreement. Clause 4, Section B details the handover of the site. The Trust will take possession on the first of September. Their funding is secured for three years. After that, they will need to apply for renewed grants based on usage metrics. I look at the number three. I look at the date. I think about my daughter. She will be seven when the funding runs out. She will be eleven when the next review happens. I think about the word perpetuity in the 1937 minute book. I think about the distance between those two timelines. It feels like a physical gap, a trench opening up in the floorboards.

  I nearly see it then. I nearly see that the promise has shrunk. I nearly see that we are moving from a structure designed to outlast us to one designed to be evaluated within our lifetimes. I look at the clause about the splash park equipment. It has a warranty of five years. I imagine the misters rusting. I imagine the pumps failing. I imagine the site being fenced off again in 2029, waiting for another idea. I have the thought clearly in my head. I have the shape of it. It is right there, on the edge of vision, like a smell you catch for a second and then lose. Then the phone rings. It is the council officer, asking if we can vacate the office by Friday instead of Monday because the contractors need to survey the drainage. I say yes, that will be fine. I write the date in my diary. I close the folder. The moment passes. The horizon stays where it is, or rather, I stop looking at it. It is easier to be busy. It is easier to focus on the keys than the lock.

  On the last day, the water is drained. It takes six hours. The sound is a low, sucking groan as the pipes empty the basin. The bottom of the pool is revealed. It is cracked and stained, mapped with lines of grey repair work over the original blue paint. It looks like a dry riverbed. People stand around the edge, looking down. They are not crying. They are taking photographs with their phones. They are commenting on the depth. Someone says it looks smaller without the water. Someone else says the leisure centre is nicer anyway, because it has a café. They are being cheerful. They are licensing the change. If they were to grieve, they would have to admit that something was broken that shouldn't have been. If they admit that, they would have to ask who broke it, and whether they could have stopped it. It is simpler to say that things change. It is simpler to say that the pool was old.

  I walk the perimeter one last time. The concrete is warm under my feet. I check the changing rooms. There are lost coins in the drains, a hairclip on a bench, a bottle of sunscreen left behind. These are the artifacts we leave. I pick up the sunscreen and put it in the bin. I turn off the main power switch. The hum of the filtration system stops. The silence is immediate and heavy. It is not the silence of emptiness; it is the silence of a machine that has been switched off. It could be switched on again. That is the trick of it. Nothing is destroyed yet. The building stands. The land is still there. The promise is just no longer being made.

  I walk to the gate. Arthur is there again, leaning on his walking stick. He is not swimming today. He says he thought he would see it off. I hand him the set of keys I was holding. He says he doesn't need them. I say I know, but I don't know what else to do with them. He takes them anyway. He puts them in his pocket. He says he might keep them for a souvenir. We stand there for a moment, looking at the empty basin. It is just a hole in the ground. In five hundred years, if someone digs here, they will find the concrete shell. They will find the minute books if the archives survive. They will see the date of the gift and the date of the transfer. They will calculate the difference. They will see the gap. They will call it what it is. But today, it is just a Tuesday. The sun is going down. The shadows are lengthening across the cracks in the concrete. Arthur turns to go. He says he will see me at the leisure centre on Tuesday. I say yes, I will be there. We walk away in opposite directions. The gate clicks shut behind me. It does not lock. There is no need to lock it anymore.

  I aimed to keep the narration strictly observational, letting the contrast between the 1937 "perpetuity" and the new three-year funding cycle do the work of defining collapse without naming it. The near-miss moment with the phone call is intended to show how logistical busyness obscures the shortening horizon, while the ending refuses to resolve the emotional tension, leaving the character in the state of "ordinary life" despite the institutional break.
