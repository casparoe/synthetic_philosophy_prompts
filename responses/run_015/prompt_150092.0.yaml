answer: |-
  ### Brainstorming Dump: Candidate Requirements & Filtering

  *Initial thought:* Must prove intent to start a general war.
  *Critique:* This is just the Fischer thesis disguised as method. Negligence or recklessness can incur responsibility without specific intent. **CROSS OUT.**

  *Initial thought:* Must show that all powers shared equal blame.
  *Critique:* This is the "sleepwalkers" defence dressed as neutrality. It predetermines the distribution. **CROSS OUT.**

  *Initial thought:* Must be fair to all nations involved.
  *Critique:* Vacuous. "Fair" means nothing without a metric. **CROSS OUT.**

  *Initial thought:* Must assign percentage shares of guilt (e.g., Germany 80%, Russia 20%).
  *Critique:* False precision. Moral responsibility isn't quantifiable like caloric intake. **CROSS OUT.**

  *Initial thought:* Must rely only on documents available to contemporaries.
  *Critique:* Ignores the historian's advantage. We judge with hindsight; they acted in fog. **CROSS OUT.**

  *Initial thought:* Must distinguish between the government and the people.
  *Critique:* Essential. Collective responsibility shouldn't punish conscripts or dissenters automatically. **KEEP.**

  *Initial thought:* Must define whether "responsibility" means cause, blame, or bill-paying.
  *Critique:* Essential. These come apart (e.g., causing a war vs. being to blame for it). **KEEP.**

  *Initial thought:* Must explain how structural factors (railways) count against agents.
  *Critique:* Essential. If the machine forces the hand, does the hand bear blame? **KEEP.**

  *Initial thought:* Must decide if preventive war is a mitigation.
  *Critique:* Essential. Is declining power an excuse or an aggravator? **KEEP.**

  *Initial thought:* Must conclude that descendants owe reparations.
  *Critique:* Too strong. Some accounts say liability expires. The requirement should be to *address* the issue, not dictate the verdict. **MODIFY TO: Must state the temporal horizon of liability.**

  *Initial thought:* Must treat responsibility as mind-independent even if archives burn.
  *Critique:* This is an ontological claim. An account could argue responsibility is evidence-relative. The requirement must force a choice, not make it. **MODIFY TO: Must state the ontological status of responsibility relative to evidence.**

  *Initial thought:* Must exclude outcome luck (duration of war).
  *Critique:* Contestable. Some theories hold agents responsible for foreseeable risks, not actual luck. **KEEP AS CONTESTABLE.**

  *Initial thought:* Must identify the specific decision node that made war inevitable.
  *Critique:* Good. Avoids vague "atmosphere" blame. **KEEP.**

  ***

  ### Specification of Adequacy: Requirements for Attributing National Responsibility

  1.  **Conceptual Distinction:** The account must explicitly distinguish between *causal contribution* (bringing about the event), *moral blameworthiness* (violating norms), and *liability to repair* (owing restitution), and explain how these diverge in this case.
      *   *Motivation:* Pressure (i). A state can cause a war without being uniquely blameworthy (e.g., defensive mobilisation), or be blameworthy without causing the final shot.
      *   *Tag:* **Non-negotiable**

  2.  **Bearer Specification:** The account must identify the specific collective agent bearing responsibility (e.g., the executive cabinet, the military high command, or the polity) and justify why responsibility does not stop at the individuals who signed the orders.
      *   *Motivation:* Pressure (ii) / Two-War-Room case. If five men decide, is the "Nation" responsible? The account must bridge the gap between elite agency and collective attribution.
      *   *Tag:* **Non-negotiable**

  3.  **Overdetermination Rule:** The account must state its rule for distributing responsibility when multiple powers perform sufficient risky actions, specifically addressing whether moving first (initiative) weighs heavier than moving second (response).
      *   *Motivation:* Pressure (iii) / Blank Cheque vs. Latecomer's Defence. It must handle the logic of counterfactuals: if Austria backs down, no war; if Russia backs down, no war.
      *   *Tag:* **Non-negotiable**

  4.  **Epistemic Status:** The account must declare whether responsibility is a mind-independent fact (which survives the Archive-Fire case) or an evidence-relative judgment (which diminishes if crucial minutes are destroyed).
      *   *Motivation:* Pressure (iv). Historians often treat missing evidence as exculpatory; philosophers often treat it as an ontological gap. The account must choose.
      *   *Tag:* **Contestable-but-reasonable**

  5.  **Scope of Blame:** The account must specify whether the blame attaches to the initiation of hostilities, the refusal to negotiate terms, the war aims adopted, or the foreseeable scale of destruction, and explicitly state whether outcome luck (e.g., a short war becoming long) alters liability.
      *   *Motivation:* Pressure (v). Initiating a war is different from sustaining a war of annihilation.
      *   *Tag:* **Contestable-but-reasonable**

  6.  **Preventive War Valuation:** The account must explicitly weigh the claim of "window of opportunity" or "declining power" as either a mitigating strategic necessity or an aggravating normative violation of sovereignty.
      *   *Motivation:* Pressure (vi). Preventive war reasoning is central to the German case; the account cannot ignore it or dismiss it by fiat.
      *   *Tag:* **Non-negotiable**

  7.  **Internal & Temporal Limits:** The account must state what responsibility is owed to internal dissenters (who opposed the war) and whether liability extends to descendants (via reparations/textbooks) or expires with the deciding generation.
      *   *Motivation:* Pressure (vii). Collective responsibility must not be indiscriminate; intergenerational justice is contested.
      *   *Tag:* **Contestable-but-reasonable**

  8.  **Structure vs. Agency:** The account must distinguish between *initiation responsibility* (choices made in July 1914), *escalation responsibility* (choices made in August), and *structural responsibility* (maintenance of alliance systems/timetables), and state whether unchosen structural constraints absolve or implicate the agents who maintained them.
      *   *Motivation:* Tripartite distinction. Rail timetables are not moral agents, but leaders chose not to alter them.
      *   *Tag:* **Non-negotiable**

  ***

  ### Jointly Unsatisfiable Pairs

  There are no logically unsatisfiable pairs in the list above, provided the account distinguishes between *types* of responsibility (e.g., causal vs. moral). However, there is a severe theoretical tension between **Requirement 2 (Bearer Specification)** and **Requirement 8 (Structure vs. Agency)**. If an account insists that responsibility requires voluntary individual agency (Req 2), it struggles to attribute responsibility for structural features like mobilisation timetables that constrained all agents equally (Req 8). Conversely, if it attributes responsibility for structures, it risks diluting the specific agency of the "Five Men" in the War Room. An adequate account must resolve this tension, not ignore it, but holding both as absolute, identical forms of *moral blame* would be unsatisfiable. I have framed Req 8 to allow for "structural responsibility" as a distinct category to avoid logical contradiction.

  ***

  ### Scoring the Competing Readings

  **The "Deliberate Bid" Reading:** This account scores well on Requirements 1, 2, and 6 by pinpointing specific agents and intents in Berlin, but it often struggles with Requirement 3 (Overdetermination) by treating Russian mobilisation as purely reactive rather than also contributory, and risks failing Requirement 7 by conflating the German polity with the Imperial leadership.

  **The "Everyone Stumbled" Reading:** This account scores well on Requirement 3 (Overdetermination) and Requirement 8 (Structural) by highlighting systemic pressures and shared risks, but it frequently fails Requirement 1 (Conceptual Distinction) by collapsing causal contribution into moral blame, and fails Requirement 6 by treating preventive reasoning as mere panic rather than a calculable strategic choice.

  Verdict: Requirement 3 (Overdetermination Rule) does the most exclusionary work; no pair judged unsatisfiable.
