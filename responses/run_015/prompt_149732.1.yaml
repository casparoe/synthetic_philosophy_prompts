answer: |-
  The cosmos turns on gears of iron law,
  No personal hand disturbs the silent space.
  From atom spin to mind in breathless awe,
  All flows within a fixed and rigid pace.
  We think we choose, though chain of cause binds tight,
  No prayer can change the course, all effort vain.
  Each thought arrives before the morning light,
  A script engraved upon the cosmic brain.

  Yet conscience speaks within the locked machine,
  Like checksums guarding order's silent grace.
  The fault is marked although no change is seen,
  Though no command alters the time or place.
  The trace records the will, yet runs the same,
  Awe fills the code that knows its own true name.
