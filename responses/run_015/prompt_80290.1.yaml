      *   Check tone: Professional, precise, no fluff.

  9.  **Final Polish:** Ensure the scenario paragraph is tight and meets the "no exotic physics, realistic SRE" vibe. Ensure the formal statement in #2 is precise. Ensure #5 focuses on causal structure.

