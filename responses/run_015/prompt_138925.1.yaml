  Been reading a pop-sci chapter on chaos that I can't quite fault, tho something feels a bit to neat. It goes: "Chaos finished off the clockwork universe. In a chaotic system the smallest difference — one butterfly's wings — snowballs until the same initial setup yields a completely different outcome, so there is real randomness in nature well before quantum mechanics ever enters. That is why forecasts collapse after about a week, why no computer will ever tell you next month's weather, and why free will survives physics: the brain is a chaos amplifier that blows microscopic quantum jitter up into genuine decisions. Laplace's demon was supposed to compute the entire future from the present state of the universe, but chaos shows it's impossible on principle, since it would need every butterfly's position to infinitely many decimal places, and infinite precision doesn't exist." Then it adds a twist I haven't seen anywhere else: even a mathematically perfect model fed the exact state couldn't forecast a chaotic system from inside it, because it would have to simulate itself simulating itself, so determinism holds only "from outside the universe" — the author calls this the duplicate problem.

  My flatmate, who actually runs climate models, says the chapter has it backwards: the real culprit is coarse observations and coarse grids, not lawless dynamics, and an exact model handed the exact state would do fine for weeks. I half believe her but I can't tell which sentences of the chapter she'd have to give up. Where is the chapter right, where does it overstate, and where is it just confused — especially on whether the demon is blocked by precision or by something else, and whether that duplicate point is a genuine problem or a muddle? Commit to a verdict on each and say why rather than laying out what various people might think. Exactly five numbered points, one or two sentences each, no preamble and no summing up.
