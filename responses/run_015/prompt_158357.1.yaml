  4.  **Drafting the Critique (The "Honest Part"):**
      *   Is robustness just a prior?
      *   Bayesians argue that $H_{robust}$ should have a higher prior because it's simpler or because $H_{sharp}$ is a "gerrymandered" subset of parameter space.
