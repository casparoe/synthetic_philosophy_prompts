answer: |-
  ## Seminar Game: The Archive Protocol

  **Topic:** Reasoning Under Uncertainty (Surrogate for the Doomsday Argument)
  **Time:** 75 Minutes
  **Students:** 18 (Upper-Division)
  **Materials:** 18 Envelopes, 2 Special Envelopes, Projector/Board, Score Sheet.

  ---

  ### I. Design Note: The Ambiguity Constraint
  **Read this before running the game.**
  You requested that a "typical card" be genuinely ambiguous (compatible with both hypotheses). In a standard Doomsday setup, if the True Total is Large ($N_L$) and the Small Hypothesis is ($N_S$), any student drawing a rank $k > N_S$ instantly falsifies the Small Hypothesis.
  If $N_S = 40$ and $N_L = 400$, and you draw honestly from $N_L$, 90% of your class will draw $k > 40$. The debate collapses into certainty immediately.
  **The Trade:** To preserve ambiguity for the whole class, **you must rig the True Total to be the Small Hypothesis ($N_S$).**
  **What you lose:** Students will not experience the "falsification" branch of the argument (where evidence rules out a hypothesis entirely). They will only experience the "likelihood ratio" branch (where evidence shifts probability density).
  **What you gain:** A room full of students holding ambiguous evidence, allowing for a robust debate on Bayesian updates rather than a trivial revelation of truth. You must disclose this rigging in the debrief.

  ---

  ### II. Materials Preparation

  **1. The Hypotheses (Write on Board at Start)**
  *   **Hypothesis S (Sparse):** The Archive contains **40** entries.
  *   **Hypothesis D (Dense):** The Archive contains **400** entries.
  *   **Prior:** There is a **50%** chance the Archive is Sparse, and **50%** chance it is Dense.

  **2. The Envelopes (16 Standard, 2 Special)**
  Prepare 18 envelopes.
  *   **16 Standard Envelopes:**
      *   **Card A (Visible):** A number drawn uniformly from **1 to 40**. (Since True Total = 40, all numbers are $\le 40$).
      *   **Card B (Sealed/Second Layer):** A note to be opened *after* Round 1 betting.
          *   **10 Cards say:** "Source: **Main Index**." (Your number was drawn from the Archive entries).
          *   **6 Cards say:** "Source: **Appendix**." (Your number was drawn from a fixed reference list of 1,000 items added to *both* Hypothesis S and D equally).
  *   **2 Special Envelopes ("First Observers"):**
      *   **Card A:** "Your Rank is **1**."
      *   **Note:** "You were guaranteed to exist in the first slot. You could not have found yourself later."
      *   **Card B (Sealed):** Marked "Main Index."

  **3. Scoring Sheet**
  Create a spreadsheet or board table to record:
  *   Student ID
  *   Round 1 Probability assigned to S (%)
  *   Round 2 Probability assigned to S (%)
  *   Final Score.

  ---

  ### III. Game Rules & Timeline

  #### 0:00 – 0:10 | Setup & Instructions
  1.  **Context:** Tell students they are auditors for "The Archive." Their job is to estimate the Archive's total size.
  2.  **Hypotheses:** Display S (40) and D (400) on the board. State the 50/50 Prior clearly.
  3.  **Payoff Structure:**
      *   **Individual Score:** Calculated using a **Quadratic Scoring Rule**.
          *   If S is True: Score $= 100 \times (1 - (P_S - 1)^2)$.
          *   If D is True: Score $= 100 \times (1 - (P_S - 0)^2)$.
          *   *Translation:* You maximize points by reporting your true belief. Assigning 100% certainty risks a score of 0 if you are wrong.
      *   **Group Bonus:** If the **Class Average** probability assigned to the *True Hypothesis* exceeds **80%**, every student receives **+20 bonus points**.
      *   *Incentive:* This prevents collapsing to 0% or 100% prematurely and encourages calibration.

  #### 0:10 – 0:25 | Round 1: The Draw & The Bet
  1.  Distribute envelopes. Tell students **not** to open the Sealed Card B yet.
  2.  Students open Card A. They see their Number (or "Rank 1" for the two special students).
  3.  **Task:** Based *only* on the Prior and their Number, assign a probability (%) to Hypothesis S.
  4.  **Constraint:** No talking. Numbers are private evidence.
  5.  Collect probability estimates.

  #### 0:25 – 0:35 | Round 2: The Pool Reveal
  1.  Instruct students to open Sealed Card B.
  2.  **The Reveal:**
      *   **Main Index:** Your number comes from the Archive (1–40 or 1–400).
      *   **Appendix:** Your number comes from the Fixed Bloc (1–1000), which is identical under both Hypotheses.
  3.  **Task:** Update your probability for Hypothesis S.
  4.  *Instructor Note:* Watch the "Appendix" students. Their evidence should wash out, returning them to the Prior (50%), regardless of their number. "Main Index" students should shift strongly toward S.
  5.  Collect final probability estimates.

  #### 0:35 – 0:45 | Truth & Scoring
  1.  Reveal the True Total: **40 (Hypothesis S).**
  2.  Calculate scores live (or project the formula).
  3.  Announce if the Group Bonus was achieved. (With the rigging, Main Index students should drive the average up, but Appendix students might drag it down if they don't understand the wash-out).

  #### 0:45 – 1:15 | Debrief & Mapping
  (See Section V below).

  ---

  ### IV. Predictable Failures (First Run)

  1.  **The "Lucky Number" Fallacy:** Students will treat their number as a random seed rather than a *rank*. They may argue "30 is just a number," failing to see that $P(30|S) = 1/40$ while $P(30|D) = 1/400$.
      *   *Fix:* In Round 2, ask a student with #35 (Main Index) why they shifted. If they didn't, ask: "If the Archive had only 40 items, how likely were you to pick 35? What if it had 400?"
  2.  **The Appendix Confusion:** Students drawn from the Appendix often feel their number *should* mean something. They may resist returning to 50%.
      *   *Fix:* Explicitly write on the board: $P(\text{Number}|S) = P(\text{Number}|D)$ for the Appendix. Likelihood Ratio = 1.
  3.  **The First Observers:** The two students with Rank 1 may feel "special" and assign 100% to S, ignoring the Group Bonus risk.
      *   *Fix:* Use them in the debrief to discuss selection effects.
  4.  **Collusion:** Students might whisper numbers.
      *   *Fix:* Emphasize that sharing numbers invalidates the "random sample" assumption of the game.

  ---

  ### V. Debrief Script: Mapping Game to Argument

  **1. From Position to Total Size (The Core Shift)**
  *   *Game Moment:* Round 1 betting with Main Index numbers.
  *   *Concept:* **The Doomsday Argument.**
  *   *Explanation:* "You didn't know the total size, but you knew your position within it. Finding yourself 'early' (e.g., #30) is much more probable if the total list is short (40) than if it is long (400). You didn't need to see the end of the list to estimate its length. In the real argument, 'your number' is your birth rank among all humans who will ever live."

  **2. The Reference Class Problem (The Pool Mechanic)**
  *   *Game Moment:* Round 2, opening the Sealed Note.
  *   *Concept:* **Reference Class / Sample Bias.**
  *   *Explanation:* "Why did the Appendix students revert to 50%? Because their 'rank' wasn't a rank in the Archive; it was a rank in a fixed bloc. The Doomsday Argument fails if you aren't a random sample from the total population. Are we 'humans'? 'Conscious moments'? 'Carbon-based observers'? If you are in the 'Appendix' of reality (a fixed bloc of observers unaffected by extinction), the argument washes out. Choosing your pool is choosing your conclusion."

  **3. Observer Selection (The First Observers)**
  *   *Game Moment:* The two students with guaranteed Rank 1.
  *   *Concept:* **Self-Indication Assumption (SIA) / Existence Bias.**
  *   *Explanation:* "These two knew they were First. Does that make Hypothesis S more likely? Mathematically, yes ($1/40$ vs $1/400$). But their note said they *could not have found themselves later.* This mirrors the objection: 'I exist, so the universe must allow me to exist.' If your existence is guaranteed early (perhaps by physics or theology), you cannot use your early position to predict a short future. You are not a random sample; you are a selected one."

  **4. The Rigging (The Limitation)**
  *   *Game Moment:* The Truth Reveal.
  *   *Concept:* **Falsification vs. Likelihood.**
  *   *Explanation:* "I rigged the game so the True Total was Small (40). Why? If I had set the True Total to 400, most of you would have drawn numbers like 250. That would have instantly *falsified* Hypothesis S. The debate would have ended. In reality, we don't know the True Total. We are living in the 'ambiguous' zone. The Doomsday Argument doesn't prove extinction is certain; it proves we should shift our probability mass toward earlier extinction, even if we can't rule out the long future yet."

  ---

  ### VI. What the Game Cannot Stage (Instructor Notes)

  You must supply these verbally, as the game mechanics cannot capture them:

  1.  **The "No Observer" State:** In the game, students exist regardless of the Hypothesis. In the real DA, if $H_{small}$ is true, fewer observers exist *in total*. The game cannot simulate the counterfactual "I might not have been born."
  2.  **The Prior Dispute:** We gave a 50/50 prior. In reality, the prior probability of human extinction is the most contested part of the argument. The game shows how the *update* works, not how to justify the *baseline*.
  3.  **Continuous Time:** The game uses discrete integers. Real existence is continuous. This doesn't change the math, but students often fixate on the "discrete" nature of the cards.

  ### VII. Scoring Formula (For your reference)
  To ensure proper scoring without negative numbers:
  **Score** $= 100 \times (2p - p^2)$ if True Hypothesis is chosen with probability $p$.
  *   If $p=0.5$, Score = 75.
  *   If $p=0.8$, Score = 96.
  *   If $p=1.0$, Score = 100.
  *   If $p=0.0$, Score = 0.
  *   *Group Bonus:* Add 20 if Class Mean $p > 0.8$.

  This structure ensures that a student who is 100% sure but wrong gets 0, discouraging collapse to certainty, while the group bonus encourages the class to converge on the truth together.
