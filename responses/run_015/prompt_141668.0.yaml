      *   **Constraint 2 (Surrogate):** Use a scaled-down surrogate population. Two hypotheses about total size ($N_{small}$ vs. $N_{large}$).
      *   **Constraint 3 (Ambiguity):** A "typical card" must be genuinely ambiguous. If honest uniform draws make the likelihood ratio collapse (e.g., drawing a number $> N_{small}$ instantly falsifies $H_{small}$), acknowledge this trade-off in a design note.
      *   **Constraint 4 (Mechanism 1 - Pool Mixing):** A second sealed note reveals the *source pool*. Some drew from the target population, others from a mixed pool (target + fixed bloc present in both hypotheses). This should wash out evidence for some. Re-betting ensues.
      *   **Constraint 5 (Mechanism 2 - First Observers):** Two students start knowing they are "first" (rank 1). They bet under the same rules.
      *   **Constraint 6 (Payoffs):** No real money. Proper scoring rule or points. Group-level component to prevent probability collapse to 0 or 1.
