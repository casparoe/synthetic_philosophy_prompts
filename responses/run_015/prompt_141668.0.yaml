      *   *True State:* Type A (50 entries). (Ensures ambiguity as decided in step 2).
      *   *Draw:* Uniform from 1 to True Total.
      *   *Pool Mechanic:*
          *   "Primary Index" (Core): Drawn from the Archive entries (1-50 or 1-500).
          *   "Secondary Index" (Satellite): Drawn from a fixed set of 1000 reference tags added to both types equally. (Wait, if fixed set is 1000 for both, the number tells you nothing about A vs B).
          *   Let's adjust numbers for 18 students.
          *   $N_A = 40$. $N_B = 400$.
          *   Fixed Bloc = 1000 items (indexed 41-1040 for A? No, needs to be distinct).
          *   Let's simplify the Pool Note.
          *   Note says: "Source: Main List" or "Source: Appendix."
          *   Main List: Size 40 (if A) or 400 (if B).
          *   Appendix: Size 1000 (regardless of A or B).
          *   If Appendix, your number (1-1000) gives no info on A vs B.
          *   If Main List, your number (1-40 or 1-400) gives info.

  7.  **Timeline (75 mins):**

      *   0-10: Setup & Instructions.
      *   10-20: Distribution of Numbers & First Bet.
      *   20-30: Calculation & Submission.
      *   30-40: Reveal Pool Notes & Second Bet.
      *   40-50: Reveal Truth & Scoring.
      *   50-75: Debrief & Lecture Connection.

  8.  **Addressing Specific Constraints:**

      *   *Ambiguity:* By setting True Total = Small (40), no one draws > 40. $H_{large}$ is not falsified, just disfavored. *Design Note required.*
      *   *First Observers:* 2 students get "Rank 1" guaranteed.
      *   *Group Payoff:* Bonus points if Class Mean Probability on Truth > 0.8.
      *   *Debrief Mapping:*
          *   Number -> Birth Rank.
          *   Pool -> Reference Class (Are we 'humans' or 'conscious moments'?).
          *   First Observers -> Observer Selection/SIA.
          *   Truth Reveal -> The "Doom" (Small Total).

  9.  **Refining the "Ambiguity" Design Note:**

      *   Honest uniform draws from a *Large* true population would falsify the Small hypothesis for many students ($k > N_{small}$).
      *   To keep the debate alive for all 18 students, I must rig the True Total to be the *Small* hypothesis.
      *   *Trade-off:* This removes the possibility of "falsification" evidence, leaving only "likelihood ratio" evidence. It weakens the visceral punch of "I exist, therefore the end is nigh," but preserves the Bayesian update mechanics for the whole class. I will explicitly state this.

  10. **Refining the Payoff:**

