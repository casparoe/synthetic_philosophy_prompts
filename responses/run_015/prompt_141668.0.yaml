  *(Self-Correction on Payoff)*: A linear scoring rule ($Score = P(True)$) encourages honesty *if* maximizing expected score. I will add a small penalty for overconfidence to make it strictly proper (Brier).
  Brier Score for binary: $1 - (p - o)^2$. If True, $o=1$, Score $1 - (p-1)^2 = 1 - (1 - 2p + p^2) = 2p - p^2$. This is increasing in $p$.
