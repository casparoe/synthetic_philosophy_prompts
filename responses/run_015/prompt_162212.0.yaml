answer: |-
  # STANDARD OPERATING PROCEDURE: WEEKLY PROBABILITY UPDATE (WPU-01)

  **Effective Date:** Immediate  
  **Owner:** Lead Forecaster  
  **Applicability:** Forecasting Cell (3-person)  
  **Purpose:** To standardize the revision of the joint probability distribution (the "Matrix") in response to weekly intelligence, ensuring mathematical consistency and distinguishing between evidence and expert assessment.

  ---

  ## 1. NOTATION AND DEFINITIONS

  *   **The Matrix:** The set of $N$ mutually exclusive and exhaustive scenario cells $\{c_1, c_2, ..., c_N\}$.
  *   **Prior ($P_{old}$):** The probability distribution signed off on last week (or last quarter). $P_{old}(c_i)$ is the probability of cell $i$.
  *   **Posterior ($P_{new}$):** The revised distribution to be calculated.
  *   **Partition:** A grouping of cells (e.g., all "Northern Route" cells).
  *   **Evidence:** A report from a source with known reliability (e.g., "Sensor X triggered"). Handled via **Likelihoods**.
  *   **Assessment:** A statement about probabilities themselves (e.g., "The chance of delay is now 40%"). Handled via **Constraints**.

  ---

  ## 2. TRIAGE AND ROUTING

  **Step 1: Classify the Input.**
  Every incoming report must be categorized before calculation begins.

  *   **Type A (Evidence):** "Source $S$ reports Event $E$."
      *   *Requirement:* Source reliability rate ($r$) must be known.
      *   *Action:* Route to **Channel 1 (Bayesian Update)**.
  *   **Type B (Marginal Assessment):** "The probability of Partition $K$ is now $q$."
      *   *Requirement:* None, but must check Rigidity (see Section 4).
      *   *Action:* Route to **Channel 2 (Jeffrey Conditioning)**.
  *   **Type C (Conditional/Constraint Assessment):** "If Event $E$, then probability of $F$ is $q$," or "Cell $A$ is at least twice as likely as Cell $B$."
      *   *Requirement:* Must be expressible as a linear equation on cell probabilities.
      *   *Action:* Route to **Channel 3 (Minimum Cross-Entropy)**.

  **STOP 1:** If a single report contains multiple inputs, do **not** process them sequentially. Group all Type A inputs together and all Type C inputs together. Process Channel 1 first, then Channel 3. (See Section 6).

  ---

  ## 3. CHANNEL 1: EVIDENCE (BAYESIAN UPDATE)

  *Use when learning a proposition via an imperfect source.*

  1.  **Define Likelihoods:** For the reported event $E$, assign $P(Report | c_i)$ for every cell.
      *   If cell $c_i$ implies $E$ is true, and source reliability is $r$, then $P(Report | c_i) = r$.
      *   If cell $c_i$ implies $E$ is false, then $P(Report | c_i) = 1 - r$.
  2.  **Calculate Posterior:**
      $$P_{temp}(c_i) = \frac{P_{old}(c_i) \times P(Report | c_i)}{\sum_j P_{old}(c_j) \times P(Report | c_j)}$$
  3.  **Output:** $P_{temp}$ becomes the input prior for Channel 2 or 3 if further assessments exist. If not, $P_{new} = P_{temp}$.

  ---

  ## 4. CHANNEL 2: MARGINAL ASSESSMENT (JEFFREY CONDITIONING)

  *Use when learning a new probability for a partition (e.g., "Customs delay is 40%").*

  **The Rigidity Assumption:** This method assumes the new information changes the probability of the partition *without* changing the relative odds of the cells *inside* that partition.

  1.  **Identify Partition:** Let $K$ be the set of cells covered by the assessment. Let $q$ be the new total probability for $K$.
  2.  **Diagnostic Check (Rigidity):**
      *   Calculate the odds ratio between any two cells $c_a, c_b$ inside $K$ using $P_{old}$.
      *   Ask: "Does the intelligence report imply the *cause* of the delay has changed within this partition?"
      *   **If YES:** Rigidity fails. **STOP.** Route to Channel 3.
      *   **If NO:** Proceed.
  3.  **Calculation:**
      *   For cells $c_i \in K$: $P_{new}(c_i) = P_{old}(c_i) \times \frac{q}{P_{old}(K)}$
      *   For cells $c_j \notin K$: $P_{new}(c_j) = P_{old}(c_j) \times \frac{1-q}{1-P_{old}(K)}$
  4.  **Verification:** Sum of $P_{new}$ must equal 1. Relative odds within $K$ must match $P_{old}$.

  ---

  ## 5. CHANNEL 3: CONSTRAINTS (MINIMUM CROSS-ENTROPY)

  *Use for conditional assessments ("If North, then 75% Depot") or comparative constraints.*

  **Methodological Note:** We use Minimum Cross-Entropy (MinXEnt), minimizing Kullback-Leibler (KL) divergence. This is a policy choice signed off by the Lead. It favors the distribution closest to the prior that satisfies the constraints.
  *Alternative:* Minimizing Euclidean Distance would yield different results (linear adjustment vs. exponential tilt). We do not use Euclidean.

  1.  **Formulate Constraints:** Rewrite the assessment as a linear equation: $\sum a_i P_{new}(c_i) = b$.
      *   *Example:* "Port is twice as likely as Depot" $\rightarrow P(Port) - 2 \times P(Depot) = 0$.
      *   *Example:* "If North, 75% Depot" $\rightarrow P(N \cap D) = 0.75 \times P(N)$.
  2.  **Zero-Prior Check:**
      *   Does the constraint require $P_{new}(c_i) > 0$ for any cell where $P_{old}(c_i) = 0$?
      *   **If YES:** **STOP.** Mathematical update impossible. This indicates a model failure (the quarterly elicitation was wrong). Escalate to Lead for "Model Reset."
  3.  **Satisfiability Check:**
      *   Are the constraints jointly possible? (e.g., $P(A) > 0.5$ and $P(A) < 0.4$).
      *   **If NO:** **STOP.** Escalate to Lead.
  4.  **Operational Move (The Exponential Tilt):**
      *   **Case 1 (One Constraint, Hand Calculation):**
          1.  Identify cells affected by the constraint.
          2.  Assign a multiplier $\alpha$ to cells that "gain" probability and $\beta$ to cells that "lose" or are unaffected, such that the constraint holds and probabilities sum to 1.
          3.  Formula: $P_{new}(c_i) = P_{old}(c_i) \times \text{factor}_i / Z$.
      *   **Case 2 (Two or More Constraints):**
          1.  Do **not** apply sequentially.
          2.  Open the "MinXEnt Solver" spreadsheet tab.
          3.  Input $P_{old}$ and the linear constraint equations.
          4.  Run Solver to minimize $\sum P_{new}(c_i) \ln(P_{new}(c_i) / P_{old}(c_i))$ subject to constraints.
  5.  **Diagnostic Check:**
      *   For any cells *not* involved in the constraint, verify that their relative odds $P_{new}(a)/P_{new}(b)$ equal $P_{old}(a)/P_{old}(b)$. If not, the Solver has erred.

  ---

  ## 6. SEQUENCING AND JOINT UPDATES

  1.  **Evidence First:** Always process Channel 1 (Evidence) before Channel 3 (Constraints). Evidence changes the baseline; constraints shape the resulting distribution.
  2.  **Joint Constraints:** If a single report gives two constraints (e.g., "P(A)=0.4" AND "P(B|A)=0.5"), they must be solved **simultaneously** in the MinXEnt Solver.
      *   *Risk:* Sequential application is order-dependent. Applying Constraint 1 then Constraint 2 yields a different result than 2 then 1.
  3.  **Sign-Off:** The Lead must sign off on the choice of MinXEnt (KL Divergence). Record the divergence rule used in the update log.

  ---

  ## 7. ESCALATION PROTOCOLS

  | Condition | Action |
  | :--- | :--- |
  | **Zero-Prior Conflict** | Report requires mass in a cell previously deemed impossible. | **STOP.** Do not force math. Flag "Model Break." Lead decides on smoothing or cell restructuring. |
  | **Unsatisfiable Constraints** | Constraints contradict each other or probability axioms. | **STOP.** Flag "Logical Inconsistency." Return to source for clarification. |
  | **Rigidity Failure** | Jeffrey update requested, but internal odds clearly shifted. | **STOP.** Switch to Channel 3 (MinXEnt). |
  | **Unknown Reliability** | Evidence provided without source reliability rate. | **STOP.** Treat as Type C Assessment (Constraint) or request metadata. |

  ---

  # ANALYST CHECKLIST (PIN-UP VERSION)

  **WPU-01 QUICK REFERENCE**

  **1. CLASSIFY INPUT**
  *   [ ] **Evidence?** (Source says "X happened"). $\rightarrow$ **Channel 1 (Bayes)**. Need reliability %.
  *   [ ] **Marginal?** ("Prob of Region North is 40%"). $\rightarrow$ **Channel 2 (Jeffrey)**. Check Rigidity.
  *   [ ] **Constraint?** ("If North, then 75% Depot"). $\rightarrow$ **Channel 3 (MinXEnt)**.

  **2. CRITICAL STOPS (DO NOT PROCEED IF TRUE)**
  *   [ ] **Zero Mass:** Does the update require putting probability into a cell that was 0 last week? $\rightarrow$ **CALL LEAD.**
  *   [ ] **Contradiction:** Do the new numbers sum to >1 or contradict each other? $\rightarrow$ **CALL LEAD.**
  *   [ ] **Rigidity Check:** For Jeffrey updates, do the odds *inside* the partition stay the same? If no, use MinXEnt.

  **3. CALCULATION RULES**
  *   [ ] **Evidence First:** Apply Bayes updates *before* Constraint updates.
  *   [ ] **Joint Constraints:** If two constraints come in one report, put them in the Solver *together*. Do not do one then the other.
  *   [ ] **MinXEnt Diagnostic:** After solving, check cells *not* mentioned in the constraint. Their ratios must match last week's ratios.

  **4. SIGN-OFF**
  *   [ ] Divergence Rule: KL (MinXEnt).
  *   [ ] Log Entry: Record if "Model Break" or "Standard Update."
  *   [ ] Lead Signature Required for all Zero-Mass overrides.

  ---

  # LIMITATIONS AND HONEST ASSESSMENT

  This procedure is a tool for consistency, not a guarantee of truth. Analysts and Clients must understand the following boundaries:

  1.  **The Zero-Prior Problem:** This procedure cannot mathematically move probability from 0 to positive without breaking the MinXEnt formula (log of zero is undefined). If the real world produces a scenario we marked "impossible" last quarter, the math stops. This is a feature, not a bug: it forces us to admit our model is broken rather than hiding the error behind a small number.
  2.  **The Divergence Choice:** We use KL Divergence (MinXEnt) because it preserves independence and relative odds best. However, this is a methodological judgment, not a law of nature. If we used Euclidean Distance minimization, the probability mass would shift more aggressively to the constrained cells and less to the correlated cells. We stick to KL for stability, but clients should know this is a "conservative" update rule.
  3.  **Source Reliability:** Channel 1 relies on known reliability rates ($r$). If $r$ is guessed, the output is garbage. We treat $r$ as fixed, but in reality, source reliability degrades over time. This procedure does not auto-update $r$; that requires separate calibration.
  4.  **Rigidity Assumption:** Jeffrey Conditioning (Channel 2) assumes the *cause* of a probability shift doesn't change the internal structure of the scenario. In freight risk, this often fails (e.g., a strike changes not just the delay probability but the *type* of delay). Analysts must be vigilant in failing the Rigidity Check and switching to Channel 3.
  5.  **Time Pressure:** The "Hand-Workable" MinXEnt recipe is an approximation for single constraints. For multiple constraints, the Solver is required. Under extreme time pressure, analysts may be tempted to sequence constraints. This introduces order-bias. The 15-minute limit is a risk factor for procedural drift.

  ---

  # WORKED EXAMPLES

  ### Case 1: Calibration (Judy Benjamin / MinXEnt)
  **Scenario:** Four cells: North-Depot (ND), North-Port (NP), South-Depot (SD), South-Port (SP).
  **Prior:** Uniform (0.25 each).
  **Report:** "If Northern Region, chance is Depot is 3 in 4." ($P(ND | North) = 0.75$).
  **Method:** Channel 3 (MinXEnt).

  **Arithmetic:**
  1.  **Constraint:** $P_{new}(ND) = 0.75 \times [P_{new}(ND) + P_{new}(NP)]$.
      *   Rearranged: $P_{new}(ND) = 3 \times P_{new}(NP)$.
  2.  **MinXEnt Property:** Cells not involved in the constraint (South) preserve relative odds.
      *   Prior Odds SD:SP = 1:1. New Odds SD:SP = 1:1.
      *   Prior Total South = 0.5. MinXEnt preserves Total South unless constrained. So $P_{new}(SD) = 0.25, P_{new}(SP) = 0.25$.
  3.  **North Allocation:** Remaining mass = 0.5.
      *   $P_{new}(ND) + P_{new}(NP) = 0.5$.
      *   Substitute constraint: $3 P_{new}(NP) + P_{new}(NP) = 0.5 \Rightarrow 4 P_{new}(NP) = 0.5$.
      *   $P_{new}(NP) = 0.125$.
      *   $P_{new}(ND) = 0.375$.
  **Result:** ND=0.375, NP=0.125, SD=0.25, SP=0.25.
  **Signature:** The odds within the South region (1:1) remained exactly as they were in the prior. This is the signature of MinXEnt: it changes only what the constraint forces it to change.

  ### Case 2: The Zero-Prior Conflict
  **Scenario:** Cell "Terrorist Strike" was assigned 0.00 probability in the quarterly elicitation (deemed impossible).
  **Report:** "Intel suggests a 10% chance of Strike."
  **Method:** **STOP.**
  **Reasoning:** MinXEnt requires calculating $\ln(P_{new} / P_{old})$. If $P_{old} = 0$, this is undefined. You cannot update a distribution to include an event previously deemed impossible without breaking the mathematical framework.
  **Action:** Analyst flags "Model Break." Lead must decide whether to (a) reject the intel, or (b) authorize a "Model Reset" to re-elicited priors including the new cell. Do not simply type 0.01 into the spreadsheet.

  ### Case 3: Mixed Evidence and Assessment
  **Scenario:**
  *   **Prior:** Customs (C) = 0.5, Port (P) = 0.5. (Within C: Fast=0.5, Slow=0.5).
  *   **Input 1 (Evidence):** Source (70% reliable) says "It is Customs."
  *   **Input 2 (Assessment):** "If Customs, 60% chance Clear < 48hrs (Fast)."

  **Naive Error:** Setting $P(Customs) = 0.7$ and $P(Fast|Customs) = 0.6$ as constraints. This ignores the base rate and treats the source report as a probability rather than data.

  **Correct Procedure:**
  1.  **Channel 1 (Evidence):** Update Prior with Source Reliability.
      *   Likelihood Ratio for "It is Customs": $0.7 / 0.3 = 2.33$.
      *   $P_{temp}(C) = \frac{0.5 \times 0.7}{0.5 \times 0.7 + 0.5 \times 0.3} = 0.7$.
      *   $P_{temp}(P) = 0.3$.
      *   (Internal odds within C remain 1:1 for now).
  2.  **Channel 3 (Assessment):** Apply Constraint to $P_{temp}$.
      *   Constraint: $P_{new}(Fast | C) = 0.6$.
      *   Apply MinXEnt to $P_{temp}$.
      *   Mass of C is 0.7. Split into Fast/Slow at 60/40.
      *   $P_{new}(C \cap Fast) = 0.7 \times 0.6 = 0.42$.
      *   $P_{new}(C \cap Slow) = 0.7 \times 0.4 = 0.28$.
      *   Port cells remain untouched relative to each other (scaled to sum to 0.3).
  **Rigidity Assumption:** We assume the assessment ("60% Fast") applies to the *post-evidence* state. If the source reliability depends on the clearance time (e.g., source only sees slow clearances), this separation fails. We test this by checking if source reliability $r$ is conditional on the outcome. If unknown, we assume independence.
