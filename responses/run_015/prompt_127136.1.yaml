answer: |-
  **Falsifiability Scores (0–10)**

  **(a) Straight differential survival**
  **Score:** 0
  **Refuting Observation:** None. If "fittest" is defined solely by who survives, the statement is a logical tautology ("survivors survive"). No possible world contradicts it.

  **(b) Fitness as propensity**
  **Score:** 6
  **Refuting Observation:** Organisms with independently measured high-propensity traits (e.g., higher metabolic efficiency) consistently leave *fewer* offspring than those with low-propensity traits across multiple generations, controlling for drift.
  **Note:** Statistical noise and probabilistic outcomes allow wiggle room; a single failure doesn't kill it, only systematic deviation does.

  **(c) Optimality models**
  **Score:** 9
  **Refuting Observation:** Organisms in a specific environment consistently lack the predicted optimal trait (e.g., foraging strategy, limb ratio) despite no identifiable phylogenetic or developmental constraints blocking it.
  **Note:** This generates "risky predictions" about design. It is the primary engine of testing adaptation.

  **(d) Replayability / Convergence**
  **Score:** 8
  **Refuting Observation:** Replicated lineages in identical environments diverge functionally and morphologically without bound, showing no tendency toward the same adaptive peak.
  **Note:** Highly falsifiable, but empirically shaky (see below).

  ***

  **Ranking (Worst to Best)**
  1. (a)
  2. (b)
  3. (d)
  4. (c)

  ***

  **The Commitments**

  **Winner (What makes evo bio testable):** **(c) Optimality models.**
  This is the workhorse. It forces specific, quantitative predictions about form and function derived from physical constraints. When organisms deviate, the model is falsified or must be refined with specific constraints. This is where the rubber meets the road.

  **Loser (Armoured against anything):** **(a) Straight differential survival.**
  This is the tautology Popper correctly identified. Without an independent measure of fitness (like propensity or design), it is metaphysics, not science.

  ***

  **Honesty Check on (d)**

  **Is it just (c) dressed up?**
  No. It smuggles in an extra empirical claim: **that the fitness landscape is smooth and single-peaked.** (c) says "X is optimal here." (d) says "Everyone will find X."

  **Do we have reason to think that claim is true?**
  Only partially. We see convergence (eyes, wings), supporting the claim. But we also see historical contingency (Gould's argument), where lineages get stuck on local peaks. The claim is not universally true, which lowers its utility as the *foundation* of testability compared to (c).
