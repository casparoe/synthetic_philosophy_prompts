answer: |-
  You have identified a genuine and under-theorised gap in the taxonomy of deception. Your intuition is correct: standard terms like "paltering" or "misleading implicature" describe the *surface* of the act but fail to capture the specific *mechanism* you have observed—namely, that the deception is powered not by a deviation from the speaker's usual norms, but by the hearer's accurate reliance on them.

  There is no single established term that perfectly captures this specific dynamic. However, there is a literature that circles it, and I can offer you a coined term that fits your pedagogical needs, along with the necessary boundaries and theoretical grounding.

  ### 1. The Nearest Existing Concepts (and why they fall short)

  **Paltering**
  *   **The Concept:** Defined by Rogers, Zeckhauser, and Gino (2017) as "the active use of truthful statements to create a false impression."
  *   **Why it fits:** Your cases are technically instances of paltering. The statements are true; the impression is false.
  *   **Why it fails:** Paltering is typically understood as a form of "spin" where the speaker deviates from a cooperative norm (e.g., cherry-picking facts). In your cases, the speaker *adheres* to a cooperative norm (rigorous truth-telling) and uses that adherence as the weapon. Paltering usually erodes trust if discovered; your cases *compound* trust.

  **Conversational Implicature (Grice)**
  *   **The Concept:** Paul Grice's theory that listeners infer meaning beyond what is said based on the assumption that the speaker is being "cooperative."
  *   **Why it fits:** The hearer is drawing an inference ("It went well") from a statement ("They signed") based on the assumption of cooperativity.
  *   **Why it fails:** Standard misleading implicature usually relies on the *context of the conversation*. Your cases rely on the *context of the speaker's character*. The hearer isn't just inferring from the words; they are inferring from the words *plus* the premise "This speaker would not say this unless the stronger fact were true."

  **Deception vs. Lying (Carson / Bok)**
  *   **The Concept:** Philosophers like Thomas Carson distinguish lying (warranting the truth of what one believes false) from deception (intentionally causing a false belief).
  *   **Why it fits:** This is clearly deception without lying.
  *   **Why it fails:** It is too broad. It covers everything from camouflage to forgery. It does not isolate the specific *epistemic mechanism* of using one's own truthfulness as the vector for the falsehood.

  ### 2. A Proposed Term: "Credibility-Backed Misleading"

  For your module, I propose you coin the term **Credibility-Backed Misleading (CBM)**.

  This term captures the essential feature you identified: the deception is not carried by the semantic content of the sentence, but by the **credit** the speaker has in the hearer's epistemic bank.

  **Definition:**
  *Credibility-Backed Misleading occurs when a speaker intentionally induces a false belief in a hearer by making a true statement, where the success of the deception depends specifically on the hearer's accurate knowledge of the speaker's high standards of truthfulness.*

  **The Mechanism:**
  1.  **The Setup:** The speaker has a reputation for rigor (e.g., "never asserts what she cannot document").
  2.  **The Trigger:** The hearer asks a question that demands a value judgment or a summary ("Did it go badly?").
  3.  **The Move:** The speaker provides a narrow, verifiable fact ("They signed the letter") that is literally responsive but informationally incomplete.
  4.  **The Bridge:** The hearer, knowing the speaker's rigor, infers: "If it had gone badly, she would have said so. She didn't say so. Therefore, it didn't go badly."
  5.  **The Payoff:** The speaker foresaw this inference. The inference is false. The speaker's reputation remains intact because the statement was true.

  ### 3. Boundary Cases: Distinguishing CBM from Neighbors

  To make this useful for trainees, you must distinguish it from the concepts they might confuse it with.

  | Feature | **Credibility-Backed Misleading (CBM)** | **Paltering** | **Withholding** | **Plausible Deniability** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Truth Value** | Statement is True. | Statement is True. | Silence / Omission. | Statement is Ambiguous. |
  | **Responsiveness** | Literally responsive to the question. | Often sidesteps the question. | Avoids the question. | Answers ambiguously. |
  | **Role of Reputation** | **Essential.** Deception fails without the reputation for rigor. | **Incidental.** Works even with a neutral speaker. | **Incidental.** Relies on duty to disclose. | **Defensive.** Used to escape blame later. |
  | **Effect on Trust** | Trust is **earned/compounded**. The speaker looks *more* reliable. | Trust is **spent**. If discovered, speaker looks slippery. | Trust is **eroded**. If discovered, speaker looks evasive. | Trust is **protected**. Speaker avoids commitment. |
  | **Hearer's Recourse** | **None.** No false statement to challenge. | **Low.** Can ask for clarification. | **High.** Can demand the missing info. | **Low.** Can demand clarity. |
  | **Self-Sealing?** | **Yes.** The truth of the statement validates the deception. | **No.** The selection of facts can be challenged. | **No.** The omission can be highlighted. | **No.** The ambiguity can be exposed. |

  ### 4. Why This Defeats the "Misleading < Lying" Argument

  You noted that standard ethical defenses of misleading (it respects agency, leaves a route to truth, preserves the speaker's relation to truth) collapse here. CBM explains why:

  1.  **Agency:** It is argued that misleading respects the hearer's agency because they draw the conclusion themselves. In CBM, the hearer's agency is **hijacked**. They are using their own rational faculties (trusting a reliable source) against themselves.
  2.  **Route to Truth:** It is argued that misleading leaves a route to the truth (the hearer can check the facts). In CBM, checking the facts confirms the speaker's statement ("Yes, they did sign"), which reinforces the false belief. The route to truth is blocked by the truth itself.
  3.  **Speaker's Relation to Truth:** It is argued the speaker remains honest. In CBM, the speaker weaponizes their honesty. They are not merely "keeping their hands clean"; they are using their clean hands to strangle the hearer's understanding.

  ### 5. Recommended Literature for the Module

  While there is no single book on CBM, these texts provide the scaffolding:

  *   **Jennifer Saul, *Lying, Misleading, and What is Said* (2012).**
      *   *Relevance:* Saul argues that misleading can be morally worse than lying because it corrupts the practice of communication itself. This supports your view that CBM is more damaging than a lie.
  *   **Thomas Carson, *Lying and Deception* (2010).**
      *   *Relevance:* Provides the strict definitions of deception vs. lying, allowing you to show trainees that CBM is *deception* even if it isn't *lying*.
  *   **Paul Grice, "Logic and Conversation" (1975).**
      *   *Relevance:* Use the "Cooperative Principle." Explain that CBM follows the *letter* of the maxims (Quality: speak truth) but violates the *spirit* (Quantity/Relation: be as informative as required for the purpose of the exchange).
  *   **Rogers, Zeckhauser, & Gino, "The Art of the Palter" (Harvard Business Review, 2017).**
      *   *Relevance:* Use this to introduce the concept of truthful deception, then critique it using your CBM distinction.

  ### 6. Pedagogical Application

  When teaching this, you might frame it as **"The Truth-Teller's Trap."**

  Ask your trainees: *If you discover a partner lied to you, you downgrade their trust rating. If you discover a partner engaged in Credibility-Backed Misleading, you are forced to upgrade their trust rating (because they told the truth), even as you realise they deceived you. This creates a cognitive dissonance that protects the deceiver.*

  This creates a powerful ethical lesson: **Integrity is not just about the truth-value of your sentences; it is about the management of the inferences you invite.** In professional ethics, inviting a false inference by leveraging your own reputation is not a clever technical compliance; it is a breach of the fiduciary duty of candour.

  ### Summary for Your Module

  *   **Term:** Credibility-Backed Misleading (CBM).
  *   **Core Mechanism:** Leveraging the hearer's correct belief in the speaker's rigor to validate a false inference.
  *   **Key Difference from Paltering:** Paltering uses true facts to obscure; CBM uses the speaker's *character* to validate.
  *   **Ethical Status:** Morally equivalent to (or worse than) lying, because it is self-sealing and leaves the hearer without epistemic recourse.

  This framework should give you the vocabulary to label the phenomenon without forcing it into a category that doesn't fit.
