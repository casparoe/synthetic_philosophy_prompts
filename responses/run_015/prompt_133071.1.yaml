answer: |-
  You have identified something real, and you have identified it sharply. You are not overcomplicating it. What you are noticing is not merely a rhetorical sleight of hand; it is a foundational ontological commitment disguised as a mathematical solution.

  To answer your primary question: **Yes, the Dichotomy swap and the Arrow swap are the same move.** They are two applications of a single underlying metaphysical assumption.

  Here is the breakdown of what this is, where it comes from, where it breaks, and what to call it.

  ### 1. The Name and The Concept
  There is no single standard term in introductory logic for this, because introductory logic usually accepts the swap as valid. However, in the philosophy of time and process philosophy, this has a well-established lineage.

  The best existing label for this is **Bergson's Cinematographical Method**.
  Henri Bergson (early 20th century) argued exactly what you are arguing: that standard mathematical treatments of motion replace *duration* (real, flowing time) with *spatialized time* (a static line of points). He called this the "cinematographical method of thought": taking static snapshots (positions at instants) and claiming that stringing them together *is* motion.

  If you want a descriptive definition for your own use, call it **The Ontological Static Substitution**.
  **Definition:** The move of answering a question about *dynamic process* (how a change occurs) by providing a description of *static extension* (the set of states occupied), thereby presupposing that the process is nothing over and above the set of states.

  ### 2. Is it One Thing or Two?
  It is **one thing**.
  *   **In the Dichotomy:** The "agent" (the runner) is deleted. The question is about the *act of traversing*. The answer provides the *geometry of the path*. The substitution is: **Process $\to$ Path.**
  *   **In the Arrow:** The "instant" (the now) is deleted. The question is about *velocity at a point*. The answer provides the *mapping of points to times*. The substitution is: **Property $\to$ Relation.**

  Both rely on the same metaphysical framework: **The Block Universe (or B-Theory of Time).**
  This is the view that past, present, and future all equally exist as a static 4-dimensional manifold. If you assume the Block Universe, your "swap" is not a swap at all; it is just describing reality as it is. There is no "runner doing the running," there is just a world-line shaped like a runner.

  However, Zeno's paradoxes (and your intuition) arise from a **Process Ontology (or A-Theory of Time)**. This is the view that time "flows" or that there is a genuine distinction between the potential and the actual. From *this* viewpoint, the mathematical answer is a category error. It describes the *track*, not the *race*.

  So, the "swap" you notice is the collision between a Process question and a Block Universe answer.

  ### 3. The Arrow's Second Swap
  You asked: *Is the "not moving" vs. "at rest" bit a separate move?*

  It is a subsidiary move, but it is necessary to make the main swap stick.
  *   **Main Swap:** Motion is a relation over time, not a property of an instant. (This removes the need for "motion at an instant".)
  *   **Secondary Swap:** If there is no "motion at an instant," then the state of the arrow at an instant is indistinguishable from a stationary arrow.

  You are correct to flag this. In standard calculus, velocity at an instant is defined as the derivative (the limit of the ratio). It is a *potentiality* derived from the neighborhood, not a *property* of the point.
  The "swap" here is **Eliminativism about Instantaneous Velocity**. It asserts that "velocity" is a useful fiction we calculate from the static block, not a physical reality possessed by the object at that moment.
  If you reject this eliminativism (as some physicists and philosophers do, arguing for "instantaneous velocity" as a primitive property to avoid determinism issues), the Arrow paradox returns. So yes, it is part of the same animal: it clears the brush so the static structure can stand alone.

  ### 4. The Thomson Lamp and Your Continuity Guess
  You wrote: *Where the structure fixes its own limit, the swap is fine, and where it doesn't, the swap leaves a hole.*

  This is insightful, but I need to push back on the "fine" part.
  In the Dichotomy, the series converges ($\sum 1/2^n = 1$). In the Lamp, the series oscillates ($1, 0, 1, 0...$).
  The standard mathematical response to the Lamp is: "The state at $t=1$ is undefined by the sequence."
  The standard mathematical response to the Dichotomy is: "The arrival at $t=1$ is guaranteed by the convergence."

  **Your guess is half-right:** The mathematical structure determines whether you get a *value* at the limit.
  **Where it needs correction:** Even when the structure *does* fix the limit (Dichotomy), the **ontological gap** remains. The fact that the sum is 1 does not explain *how* the runner completes the infinite tasks. It only proves that *if* they complete them, they end up at 1.
  The Lamp exposes the gap because the math refuses to give an answer. The Dichotomy hides the gap because the math gives a pleasing answer. But in both cases, the "swap" (replacing physical traversal with geometric convergence) has occurred.

  The Lamp shows that **Convergence $\neq$ Physical Completion.**
  The Dichotomy assumes **Convergence $=$ Physical Completion.**
  Your intuition is correct: the Lamp reveals the assumption that the Dichotomy hides.

  ### 5. Boundary Case: Where the Swap Fails
  You asked for a case that falls just outside this pattern, to check the boundary.
  The best boundary case is **Achilles' Fatigue** (or any physical constraint supertask).

  *   **The Setup:** Achilles runs the Dichotomy race, but he gets tired. Suppose his maximum speed decreases such that he can physically complete the first half, and the first quarter, but by the 100th step, his muscles require more energy than exists in the universe to cover the distance.
  *   **The Math:** The geometric series still sums to 1. The static structure (the path) is unchanged. The limit exists.
  *   **The Reality:** Achilles stops. He never reaches the end.
  *   **Why it's a boundary:** Here, the "Static Substitution" is demonstrably false. The sum of the distances is 1, but the runner does not arrive. This proves that the *mathematical limit* is not identical to the *physical act*.

  This case isolates your observation: The "swap" works in Zeno discussions only because we implicitly assume **idealized physical laws** where mathematical convergence guarantees physical possibility. Once you introduce a mechanism (like the Lamp's switch or Achilles' muscles) that isn't purely geometric, the swap leaves the "hole" you noticed.

  ### 6. Distinction from "Dissolving the Problem"
  You mentioned **Dissolution** (Wittgenstein/Ryle).
  *   **Dissolution** says: "Your question is nonsense. There is no such thing as 'motion at an instant' to ask about."
  *   **The Swap** says: "Your question is valid, but the answer is this static structure."

  The responses you are getting are presented as *solutions* (here is the answer), but they function as *dissolutions* (we have redefined your terms so the problem vanishes).
  The reason this feels unsatisfying to you is that it is **Normative Disguised as Descriptive**.
  *   **Descriptive:** "Here is how the math works."
  *   **Normative:** "We decide that 'motion' *means* this math, and not the experience of moving."

  The respondents are not making a mathematical error; they are making a philosophical choice to prioritize the Block Universe ontology. They present it as "just maths" to avoid defending that philosophical choice.

  ### Summary
  *   **Is it one thing?** Yes. It is the substitution of **Process** with **Extension**.
  *   **Does it have a name?** Historically: **The Cinematographical Method** (Bergson). Ontologically: **The Block Universe Reduction**.
  *   **The Arrow's second bit:** It is **Eliminativism about Instantaneous Velocity**, required to make the Reduction work.
  *   **The Lamp:** It exposes that **Convergence $\neq$ Completion**. The Dichotomy hides this; the Lamp reveals it.
  *   **Boundary Case:** **Achilles' Fatigue**. The math converges, the runner stops. This proves the static structure does not dictate the dynamic outcome.
  *   **Not Dissolution:** It is a **Reframing**. It changes the subject from *kinematics* (how things move) to *geometry* (where things are), claiming the latter exhausts the former.

  You are seeing the seam where the map is being passed off as the territory. It is a legitimate philosophical objection, not a confusion on your part.
