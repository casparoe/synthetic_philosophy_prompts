          *   x is F.
          *   For all y, if y is F, then y is x (Uniqueness).
          *   x is G.
      *   **Existence:** "Exists" is not a predicate of individuals. To say "The F exists" is to say "There is an x such that x is F..." To say "The F does not exist" is to deny the existential quantifier.
      *   **Scope Ambiguity:** Crucial for negative existentials and propositional attitudes.
          *   Primary Occurrence (Wide Scope): $\exists x (Fx \land \forall y (Fy \rightarrow y=x) \land \neg Gx)$ -> There is a unique F, and it is not G.
          *   Secondary Occurrence (Narrow Scope): $\neg \exists x (Fx \land \forall y (Fy \rightarrow y=x) \land Gx)$ -> It is not the case that there is a unique F which is G. (This allows the statement to be true even if no F exists).
      *   **Proper Names:** Russell treats ordinary proper names (like "Wren" or "Meridian") as disguised descriptions. However, for the sake of this exercise, I should treat them as constants or assume the descriptions associated with them are satisfied, unless the prompt implies otherwise. The prompt focuses on *definite descriptions* ("The cathedral...", "The Warden...", "The Silent King").
