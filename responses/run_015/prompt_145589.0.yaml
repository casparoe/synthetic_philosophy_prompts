      *   **3. "The Warden of the North Gate is corrupt."**
          *   *Context:* Office exists, position vacant.
          *   *Description:* "The Warden..."
          *   *Existence:* No current holder.
          *   *Form:* $\exists x (Warden(x) \land Corrupt(x))$.
          *   *Verdict:* False. There is no x that is the Warden.
