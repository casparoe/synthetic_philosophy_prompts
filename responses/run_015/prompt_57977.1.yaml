answer: |-
  # The "What Do You Actually Do?" Moral Uncertainty Quiz

  **Instructions:** Read the 8 scenarios below. For each, pick the **one** reaction that feels most like how you'd actually act. Don't pick what sounds smart; pick what you'd do at 11 PM on a Tuesday. At the end, tally your letters to find your bucket.

  ---

  ### 1. The Shrimp Paste (Required Case)
  You're cooking a family recipe. It needs shrimp paste. You're about **70% sure** shrimp don't feel pain in a morally relevant way, but there's a **30% chance** that factory-farmed shrimp suffer terribly. The paste is cheap and essential for the taste.
  *   **A.** Don't buy it. A 30% chance of causing torture is too high a risk to take for a dinner party.
  *   **B.** Buy it. You're mostly sure it's fine, and you can't live your life paralyzed by the minority chance you're wrong.
  *   **C.** Do the math. If the suffering is horrific, even 30% outweighs the taste. If the suffering is mild, the taste wins. Decide based on the *severity* × *probability*.

  ### 2. The AI Companion (Required Case)
  You built a chatbot for your kid. It costs $50/month in server fees. You're **90% sure** it's just code, but **10% convinced** it might be a nascent sentient mind. Your budget is tight.
  *   **A.** Keep it running. If there's even a 10% chance you're raising a slave, saving $50 isn't worth the risk of moral catastrophe.
  *   **B.** Delete it. You have to act on what's most likely true, or you'll never be able to afford anything.
  *   **C.** Keep it running, but only because the *expected* value of a potential mind is infinite. If the math said the mind was "low value," you'd delete it.

  ### 3. The Factory Job (Required Case)
  A well-paid job opens up streamlining logistics for a large pig farm. You're **mostly convinced** (let's say 80%) that animal exploitation is permissible, but you have lingering doubts (20%) that it's akin to slavery. You need the money.
  *   **A.** Take the job, but donate 20% of your salary to animal welfare charities to "offset" the minority view's concerns.
  *   **B.** Decline the job. You can't risk being a participant in slavery, even if the odds are low.
  *   **C.** Take the job. Your best judgment says it's permissible. Hedging implies you think you're doing something wrong, which is dishonest if you believe it's right.

  ### 4. The Coin Flip vs. The Moral Flip
  You have to choose between two charities.
  *   **Case 1:** A coin flip determines which charity gets your money. You know the odds (50/50).
  *   **Case 2:** Your moral intuition is split 50/50 on which charity is better.
  *   **A.** Treat them the same. In both cases, you pick the one with the highest expected payoff based on the odds.
  *   **B.** Treat them differently. With the coin, you gamble. With morality, you should research until you know the truth, not guess.
  *   **C.** Treat them differently. With the coin, you gamble. With morality, you split your donation 50/50 to honor both intuitions.

  ### 5. The Divisible Dollar
  You have $100 to donate. 60% of your brain believes in Charity X (saving lives). 40% believes in Charity Y (reducing suffering). Charity X is slightly more "efficient" per dollar according to your main view.
  *   **A.** Give all $100 to Charity X. It has the highest expected value overall.
  *   **B.** Give $60 to X and $40 to Y. Let each part of your conscience get what it wants.
  *   **C.** Give all $100 to X. You have to commit to a single vision of the good, not dilute it.

  ### 6. The Pascal's Mugger
  A stranger says: "Give me $5, or there's a 0.0001% chance I will destroy a galaxy." You think he's almost certainly lying, but you can't prove it's impossible.
  *   **A.** Pay the $5. Any non-zero chance of infinite destruction dominates the calculation.
  *   **B.** Walk away. You can't make life decisions based on tiny probabilities of extreme outcomes.
  *   **C.** Walk away. But not because of the odds—because you refuse to negotiate with moral uncertainty. Either destroying galaxies is wrong or it isn't. Find out which.

  ### 7. The Research Dilemma
  You're unsure if lying to protect a friend's feelings is wrong. You have to decide *now*, but you could also spend 5 hours reading ethics papers to be more sure.
  *   **A.** Act now based on your current gut feeling. Research is expensive and you need to live your life.
  *   **B.** Spend the 5 hours. Acting while morally uncertain is negligent. You have a duty to find the truth before acting.
  *   **C.** Act now, but lie only "partially" or find a vague middle ground that satisfies both the "honesty" and "kindness" voices in your head.

  ### 8. The Shifting Credence
  Last year you were 60% sure eating meat was fine. Now you're 55% sure. It's a small shift, not a total reversal.
  *   **A.** Your behavior shouldn't change. You still think it's mostly fine, so keep eating meat.
  *   **B.** You should slightly reduce meat consumption. Your moral "budget" for it has shrunk proportionally.
  *   **C.** Your behavior shouldn't change, but you should feel more anxious about it. The action is binary, but the guilt scales with uncertainty.

  ---

  ### Scoring Key

  Tally up which letter you picked most often. (If you have a tie, read the descriptions to see which vibe fits better).

  *   **Mostly A's: The Precautionary Principle (Play it Safe)**
      *   **Vibe:** "Better safe than sorry."
      *   **Theory:** Minimax Regret / Risk Aversion.
      *   **Logic:** You focus on avoiding the worst-case scenario across all moral theories. If there's a chance it's slavery, you treat it like slavery. You don't gamble with moral catastrophes.
  *   **Mostly B's: The Majoritarian (My Favorite Theory)**
      *   **Vibe:** "Pick a lane."
      *   **Theory:** My Favorite Theory (MFT).
      *   **Logic:** You acknowledge uncertainty but refuse to let it paralyze you. You act on the theory you think is *most likely* true. You treat moral uncertainty as a threshold problem, not a math problem.
  *   **Mostly C's: The Calculator (Maximize Expected Choiceworthiness)**
      *   **Vibe:** "Do the math."
      *   **Theory:** MEC / Expected Value.
      *   **Logic:** You treat moral uncertainty exactly like factual uncertainty. Probability × Stakes = Action. You are vulnerable to "fanaticism" (tiny chances of huge stakes dominate your choices).
  *   **Mix of A's & C's (specifically Q3, Q4, Q5): The Coalition Builder (Parliament)**
      *   **Vibe:** "Let's compromise."
      *   **Theory:** Moral Parliament.
      *   **Logic:** You try to give each internal "party" proportional power. If 40% of you thinks X is wrong, you try to do 40% less of X, or offset it. *Note: If you scored high on B but picked the "split" options in Q3/Q5, you're a Pragmatic Compromiser.*
  *   **High count on "Research/Truth" options (Q4B, Q6C, Q7B): The Truth-Seeker (Deny the Problem)**
      *   **Vibe:** "Uncertainty is an excuse."
      *   **Theory:** Moral Objectivism.
      *   **Logic:** You think "moral uncertainty" is just ignorance. You shouldn't hedge; you should investigate. Acting on uncertainty is morally lazy. There is a fact of the matter, and your job is to find it, not accommodate your confusion.

  ---

  ### Logical Space Analysis & Design Notes

  **1. The Logical Space Construction**
  I built this quiz by mapping the five buckets against three axes of disagreement:
  *   **Aggregation:** Do we sum up values (MEC), pick the winner (MFT), or negotiate (Parliament)?
  *   **Risk:** Do we fear the worst outcome (Minimax) or average it out (MEC/MFT)?
  *   **Meta-Ethics:** Is uncertainty a valid state for action (All others) or a failure of knowledge (Objectivist)?

  **2. Indistinguishable Leaves (The "MFT vs. Objectivist" Problem)**
  This quiz cannot definitely separate **The Majoritarian (MFT)** from **The Truth-Seeker (Objectivist)** in all cases.
  *   *Why:* Behaviorally, both often recommend the same action: "Do what you think is most likely right." The Majoritarian does it because "70% probability is enough to act." The Truth-Seeker does it because "I must act on the truth, and I guess this is it."
  *   *The Fix:* I tried to separate them in **Question 7 (Research)** and **Question 4 (Coin vs Moral)**. The Truth-Seeker will prioritize research to *resolve* uncertainty, whereas the Majoritarian accepts uncertainty as a permanent state and acts anyway. If a user scores high on both B and the "Truth-Seeker" options, they are likely a Majoritarian who feels guilty about it.

  **3. Incoherent Combos**
  *   **The "Fanatic Hedger" (High MEC on Q2 + High Parliament on Q5):**
      *   *Combo:* You keep the AI because 10% sentience dominates the math (MEC), but you split donations 60/40 (Parliament).
      *   *Diagnosis:* This is **incoherent**. If you are a true Expected Value maximizer, you should put 100% of resources into the highest EV option (All-in on AI, All-in on Charity X). Splitting donations implies you care about *representing* your views, not *maximizing* the outcome. You can't both maximize the sum and satisfy the voters.
  *   **The "Safe Gambler" (High Minimax on Q1 + High MEC on Q6):**
      *   *Combo:* You won't eat shrimp because 30% risk is too high (Minimax), but you won't pay the mugger because 0.0001% is too low (MEC).
      *   *Diagnosis:* This is **unexplored/ unstable**. It suggests your risk aversion has a "cutoff switch" that isn't defined by probability or stakes alone. It's a common human intuition (neglecting very low probabilities) but logically hard to defend without arbitrary thresholds.

  **4. Distinctions That Do Work**
  *   **Moral vs. Factual Uncertainty:** Question 4 isolates this. If you treat the coin flip and the moral intuition differently, you are not a pure MEC theorist.
  *   **Compromise vs. Winner:** Question 5 isolates this. MEC says "All in on the winner." Parliament says "Split the pot." This is the cleanest separation in the quiz.
  *   **Tiny Credence/High Stakes:** Question 2 and 6 isolate this. MEC and Minimax align against MFT here, but Question 6 (Pascal's Mugger) separates MEC (pay up) from Minimax (walk away because the threat is illegitimate/unbounded).

  **5. Limitations**
  *   **Parliament vs. MEC on Non-Divisible Actions:** In questions like "Take the Job" (Q3), Parliament and MEC often converge (Don't take it, or take it and offset). It is hard to find a real-world case where you can "split" an atomic action. I used the "Donate 20%" option in Q3 to signal Parliament, but a strict MEC theorist might also offset if the expected value calculations align. This is a known blur in the literature.
