      *   *The "Subject Changing" Charge:* If we define "best judgment" as "current strongest desire," hyperbolic agents are rational. If we define it as "considered long-term plan," they are irrational.
      *   *The Authority Question:* Why does the $t_1$ self get to rule the $t_2$ self? This is the "Constitution vs. Humean Bundle" fight.
      *   *Drafting the response:* Focus on the distinction between *synchronic consistency* (which the hyperbolic agent has) and *diachronic consistency* (which they lack). The "weakness" isn't in the moment of choice, but in the failure of the temporal extended agency.

  3.  **Deconstruct Question 2: Phenomenology & Sophistication:**
