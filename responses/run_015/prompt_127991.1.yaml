answer: |-
  The argument breaks at step (8). This step infers that because racial categories are scheme-dependent, claims about racial inequality lack a determinate subject matter or are empty. It looked acceptable because it relies on a hidden premise that only biological or scheme-independent kinds can ground "real" causal explanations or moral claims. This conflates ontological grounding with political efficacy; just as economic inequality is real despite money being constructed, racial inequality is real because the social schemes themselves have objective causal powers.

  The cheapest alternative for you is to reject (8) while keeping (5). The cost is that you must defend a robust realism about social kinds: you must explain how attitude-dependent categories can generate attitude-independent effects (like sentencing disparities) without collapsing into biological realism. You pay for this by accepting that "race" refers to a social position rather than a biological essence, which requires careful philosophical legwork to avoid slipping into eliminativism when pressed on the biology.

  The other main alternative is to reject (5), accepting your friend's conclusion that race is not constructed. The cost here is biological realism about race, which forces you to deny step (4) against scientific consensus regarding clinal variation and genetic diversity. This position is empirically costly and leaves you unable to explain the historical variability of racial categories noted in step (3). A third option is to accept (8) and become an eliminativist, but the price is abandoning the literal truth of anti-racist claims (9), forcing you to treat all talk of racial inequality as useful fiction rather than fact.

  Your "live vs. inertial" distinction helps intuitively but does not strictly block the inference in (8). Inertial dependence explains why race feels more stubborn than money, but even inertial schemes are still schemes. To fully block (8), you need to assert that scheme-relative facts are still facts capable of grounding law and explanation, rendering the inertial distinction supplementary rather than foundational.

