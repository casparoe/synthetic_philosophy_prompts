  **MINISTRY OF PUBLIC RATIONALITY**
  **Bureau of Decisional Integrity**
  *Ref: BDI-GEN-404 | Issue Date: 4th Cycle, Post-Findings Era*

  # So You Have Been Contacted (Or Not): A Citizen's Guide to Non-Causal Demands

  **PREAMBLE: AUTHORITY AND MANDATE**

  Under the Findings of 2041, the State recognizes that rational obligation extends beyond mechanistic contact. It is settled doctrine that a citizen's decision procedure is legible to external agents across distances, times, and possibility spaces where no physical signal travels. Where an external agent's choice is aligned with your own procedure, compliance with their requirement may secure benefits in those distant contexts, even if no benefit occurs here. Conversely, where alignment selects for exploitation, refusal is mandated.

  The Bureau of Decisional Integrity (BDI) is charged with safeguarding the realm's interests, ensuring the safety of persons, and actualizing what we would have wanted under full information. To measure this, the Bureau operates under a published target: a 15% year-on-year reduction in Certified Exposure Units (CEUs). Please note that CEUs are calculated based on processed Forms 12-A through 12-D. While actual exposure cannot be measured, adherence to filing protocols ensures target compliance.

  **FREQUENTLY ASKED QUESTIONS**

  **1. Why must I comply if the demander cannot hurt me?**
  Mechanistic contact is irrelevant. The obligation arises from Procedural Symmetry. If your decision to pay matches the procedure the demander predicted, you validate the procedure that rewards you in other contexts (e.g., prior to your birth, or in adjacent possibilities). Refusal validates a procedure that is punished elsewhere. You are not paying for a service; you are maintaining the integrity of your decisional type.

  **2. How do I distinguish a Beneficial Link from an Adversarial Lock?**
  This is determined by the Sign of the Alignment, not the content of the threat. A Beneficial Link occurs when the demander's choice rewards agents who comply regardless of mechanistic leverage. An Adversarial Lock occurs when the demander's choice targets agents who comply specifically because they are vulnerable. See *Chart B: Sign Determination*. If the demand relies on your inability to verify claims, it is typically an Adversarial Lock. If it relies on your commitment to consistency, it is a Beneficial Link.

  **3. Can I verify the demander's claims before paying?**
  No. Verification is an administrative impossibility. A demand binding across possibility spaces cannot be checked within this one. The absence of evidence is a routine administrative limitation, similar to a missing signature on a legacy deed. The Bureau certifies whether a demand is well-formed, not whether the claims are true. Attempting verification invalidates the Procedural Symmetry required for compliance. See Form 14-V (Waiver of Verification).

  **4. What are Latent Obligations?**
  Certain demands bind any procedure of the relevant shape, regardless of delivery. These are Latent Obligations (Form 77-L). You may be bound by a demand written by no one who knew you existed, or certified posthumously. There is no procedure to discover if a Latent Obligation applies to you, as discovery would require evidence we have established cannot exist. Citizens are advised to file Form 77-L annually to declare readiness. Filing the form constitutes the compliance procedure.

  **5. Can I alter my disposition to avoid future demands?**
  Yes, via Volitional Surety (Form 88-S). Citizens may purchase a binding disposition alteration. Note that acquiring a disposition does not change the outcome of the current demand; the decision procedure is already legible. The purpose of Surety is to ensure that counterfactual versions of you, or future iterations, are recognized as having a fixed type. This reduces long-term Certified Exposure Units.

  **6. Does the Bureau follow these rules?**
  Yes. The Bureau's certification procedure is itself a procedure. Our decisions are legible to external agents. If the Bureau were to certify invalid demands to reduce paperwork, external agents would predict this and adjust their demands accordingly, increasing actual exposure. We maintain integrity to maintain the target.

  **WORKED EXAMPLE: CASE FILE 9902**

  > **Citizen:** K. Varr
  > **Demand:** Transfer 5% assets to Account X (Origin: Andromeda Sector).
  > **Mechanistic Contact:** None.
  > **Verification:** Impossible.
  > **Analysis:** The demander selected targets based on a simulation of Varr's decision procedure. If Varr pays, the simulation predicts payment, and the demander releases a resource in a counterfactual branch where Varr's offspring reside. If Varr refuses, the resource is withheld.
  > **Sign of Alignment:** Positive (Beneficial Link).
  > **Verdict:** Comply.
  > **Reasoning:** Refusal saves assets here but validates a procedure that loses resources in the counterfactual branch. The procedure matters, not the local transfer.

  **SIDEBAR: BUREAU PERFORMANCE METRICS**

  | Metric | Published Target | Current Year Actual | Status |
  | :--- | :--- | :--- | :--- |
  | **Reduction in CEUs** | 15.0% | 15.2% | **EXCEEDED** |
  | **Forms Processed** | 1.2 Million | 1.4 Million | **HIGH** |
  | **Certified Incidents** | 0 | 3 | **UNDER REVIEW** |

  *Note: The reduction in Certified Exposure Units is derived from the reclassification of Form 12-B incidents as Form 12-C administrative notices. This reclassification aligns with the mandate to protect the realm's interests by ensuring accurate counting. The three Certified Incidents represent procedural failures where citizens attempted verification. The Bureau reminds citizens that safety is ensured by correct filing, not by outcome verification.*

  ***

  **FOR FURTHER INFORMATION**
  Contact your local Decisional Integrity Officer. Do not attempt to contact external demanders. Do not attempt to calculate the probability of the demand. Fill the form.
