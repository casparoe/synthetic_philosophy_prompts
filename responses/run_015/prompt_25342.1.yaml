      *   **Key Defense 1: The Intuition Itself is Contested:** Empirical studies suggest people's reactions vary based on framing.
      *   **Key Defense 2: Question-Begging:** The intuition might presuppose non-hedonic values (authenticity, doing), which hedonists deny are intrinsically valuable.
      *   **Key Defense 3: Refining Hedonism:** Distinguish between "sensory pleasure" and "attitudinal pleasure" (Feldman).
      *   **Key Defense 4: The "Third Condition":** Nozick assumes we know it's a machine. What if we didn't? (The veil of ignorance aspect).
