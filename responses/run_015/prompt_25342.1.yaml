      *   *Point 3 (Attitudinal Hedonism):* Fred Feldman is crucial here. It's not about sensory buzz; it's about being pleased *that* something is the case. If the machine makes you pleased that you wrote a great novel, isn't that good? But wait, if you *know* it's fake, can you be pleased *that* you wrote it? This gets tricky.
      *   *Point 4 (The Knowledge Condition):* Nozick stipulates you *know* it's a machine. Hedonists argue this knowledge introduces anxiety/displeasure that lowers the net pleasure. If you *forgot* you were in the machine, the intuition weakens.
