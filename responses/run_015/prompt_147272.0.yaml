answer: |-
  ### 1. Statement of Account

  I have **repaired** your draft. Your core insight—that corruption is the substitution of relation-indexed reasons for role-indexed reasons—is philosophically sound but too abstract for a twenty-minute committee meeting. I have operationalized it by anchoring "role-indexed reasons" to the institution's standard procedures and "relation-indexed reasons" to preferential treatment.

  Corruption occurs when a transfer is intended to make a personal consideration outweigh the public duties of the recipient's role, thereby purchasing priority or access that bypasses standard institutional procedures. Legitimate cross-cultural variation lives in the *manner* of fulfilling roles (courtesies, protocols, hospitality), but never in *whether* the role's duties remain the primary guide for action. The test is not whether the local norm accepts the payment, but whether the transfer allows the recipient to treat your organisation differently from any other similarly situated actor.

  ### 2. The Procedure (8 Steps)

  **Instructions:** Complete this checklist before authorising any payment, gift, or favour over £20, or retrospectively for record-keeping. Information is gathered via email from the Local Coordinator. If an answer cannot be obtained, apply the **Precautionary Principle** (assume the answer is 'Yes' for risk questions).

  1.  **Identify the Role:** What is the recipient's formal job title and which institution do they represent?
      *   *Sufficient Answer:* Specific title and institution (e.g., "Head Teacher, Ghana Secondary School").
      *   *Missing Answer:* If the role is informal or undefined, treat as High Risk.
  2.  **Define the Standard Duty:** What is the recipient required to do by their institution's rules, absent any relationship with us?
      *   *Sufficient Answer:* A description of the standard procedure (e.g., "Process visa paperwork within 30 days for all registered NGOs").
      *   *Missing Answer:* Ask the Coordinator: "What is the written rule?" If no written rule exists, assume the duty is impartial service.
  3.  **Define the Transfer:** Precisely what is being given (cash, gift, travel, time) and what is the stated purpose?
      *   *Sufficient Answer:* Item, value, and stated reason (e.g., "£40 cash, customary signing fee").
  4.  **The Substitution Test (Hard Stop):** Would the recipient perform this exact act, at this exact time, for any other organisation in our position without this transfer?
      *   *Sufficient Answer:* "Yes, this is standard for everyone" OR "No, this secures priority/access."
      *   *Action:* If **No**, the transfer substitutes relation for role. **STOP. Decision: NO.**
  5.  **The Accumulation Test:** Is this a one-off transaction, or part of a recurring pattern of gifts/favours to the same individual?
      *   *Sufficient Answer:* Frequency and history (e.g., "Third year of sending hampers").
      *   *Action:* If recurring, flag for Step 8. Relational debt accumulates even if single instances seem small.
  6.  **The Coordinator Safety Check:** Can we record the nature of this transfer in our minutes without endangering the Coordinator's safety or position?
      *   *Sufficient Answer:* "Yes, it is safe to document" OR "No, documentation risks their employment/safety."
      *   *Action:* If **No**, do not make the payment. You cannot outsource integrity risks to local staff. **STOP. Decision: NO.**
  7.  **The Publicity Test:** Would we be comfortable publishing this transfer, the recipient's name, and the reason on our public website?
      *   *Sufficient Answer:* "Yes" OR "No."
      *   *Action:* If **No**, it indicates an awareness of impropriety. Flag for Step 8.
  8.  **The Values Gate:** If Steps 4–7 are passed but moral doubt remains (e.g., cultural courtesy vs. corruption), refer to the Senior Trustee.
      *   *Action:* This is a values judgment, not a fact check. The Trustee decides if the risk to integrity outweighs the programme benefit.

  **Minutes Record Template:**
  *   **Yes Form:** "The committee authorised [Transfer] to [Recipient] on the grounds that it aligns with standard local protocol, does not secure preferential treatment, and can be safely recorded."
  *   **No Form:** "The committee rejected [Transfer] to [Recipient] because it substitutes personal consideration for institutional duty / creates accumulative obligation / cannot be safely documented."

  ### 3. Application to Cases

  **Case One: The MoU Signing Fee (£40)**
  *   **Step 1 & 2:** Recipient is Head Teacher. Duty is to sign MoUs that benefit the school.
  *   **Step 3:** Transfer is £40 cash.
  *   **Step 4 (Substitution):** Would he sign for another organisation without the £40? The Coordinator advises refusal risks the partnership. This implies he would *not* sign (or would delay significantly) without the cash. The cash is the reason for the action, not the MoU's merit.
  *   **Verdict:** **NO.** (Stops at Step 4).
  *   **Reasoning:** This is a facilitation payment. The money is not a courtesy; it is a condition for the performance of a role-based duty.

  **Case Two: The Host Family Phone (£120)**
  *   **Step 1 & 2:** Recipient is Host Family. Duty is hospitality (private role, but part of charity procurement).
  *   **Step 3:** Transfer is a smartphone.
  *   **Step 4 (Substitution):** Was the phone required for the hospitality? No.
  *   **Step 5 (Accumulation):** This sets a precedent. Future families may expect similar gifts, or compete to host based on potential generosity.
  *   **Step 7 (Publicity):** Would we publish "We buy phones for the poorest host families"? Possibly, but "We buy phones for the family of Volunteer X" looks like favouritism.
  *   **Verdict:** **NO.** (Stops at Step 5/8).
  *   **Reasoning:** While not public corruption, it corrupts the charity's internal allocation process. It substitutes the volunteer's personal gratitude for the charity's standard support policy, creating market distortion among host families.

  **Case Three: The District Official (Hamper + Access)**
  *   **Step 1 & 2:** Recipient is Education Official. Duty is to process paperwork impartially and in order.
  *   **Step 3:** Transfer is Hamper (£25), Travel costs, Friendship.
  *   **Step 4 (Substitution):** The official returns calls *first* and moves paperwork *quietly* and *faster* than others. Other organisations wait months. Therefore, he would *not* provide this speed/access to others without the relationship.
  *   **Step 5 (Accumulation):** High. Three years of gifts and friendship building.
  *   **Verdict:** **NO.** (Stops at Step 4).
  *   **Reasoning:** This is the definition of relational corruption. The "friendship" is the vehicle for the substitution. The official is prioritizing your charity over others due to the relationship/gifts, not the merit of the paperwork.

  ### 4. The Hard Truth

  Your committee will dislike the verdict on **Case Three**.

  You will argue that this is "relationship building" essential for operating in a low-capacity bureaucracy. You will say that without this official, the paperwork stalls, the volunteers cannot go, and the Ghanaian children lose out. You will claim that treating this as corruption is a form of Western ethical imperialism that ignores the reality of how things get done in Northern Ghana.

  You must accept the **NO** verdict anyway.

  Here is the argument: Your procedure defines corruption as the *substitution* of role-reasons for relation-reasons. In Case Three, the official is explicitly bypassing the impartial queue. He is treating you differently *because* of the hamper and the friendship. That is not "getting things done"; that is "queue jumping."

  If you justify this as "relationship building," you are admitting that your programme's viability depends on the official *neglecting* his duty to other schools. You are making your charity complicit in the deprivation of those other schools. If your partnership requires the local official to be corrupt to function, the partnership itself is ethically compromised. The "harm" to the children if you withdraw is real, but it is a harm caused by the corrupt system you are sustaining, not by your refusal to feed it. You cannot solve systemic corruption by becoming a paying participant in it.

  ### 5. Limitations of the Procedure

  I must be honest about what this procedure cannot see.

  First, it cannot measure the **consequences of integrity**. It tells you whether a payment is corrupt, but it does not tell you what happens to the beneficiaries if you refuse to pay. It might be ethically clean to refuse the MoU fee (Case 1), but if that refusal closes the school partnership and ends the programme, the procedure has protected your conscience at the cost of your mission. It is a compliance tool, not a strategy tool.

  Second, it relies on the **Coordinator's safety and honesty**. In Step 6, we ask if it is safe to document. But a Coordinator under pressure may say "it is safe" to protect the programme, or "it is unsafe" to protect themselves from scrutiny. The procedure cannot verify the truth of that claim from a committee room in the UK.

  Third, it cannot detect **covert coercion**. If the District Official (Case 3) hinted that paperwork would be *lost* without the hamper, that is extortion. The procedure treats it as bribery (active payment). The distinction matters for legal reporting and moral blame, but this checklist lumps them together as "Substitution."

  Finally, it assumes **roles are clear**. In many contexts, the "Standard Duty" (Step 2) is ambiguous or unwritten. If the official says "There is no standard time for paperwork," the procedure forces you to assume impartiality. This is legally safe but may be factually naive. You are protecting the charity from liability, not necessarily mapping the ontological reality of the local bureaucracy.
