answer: |-
  **The Glass, The Demon, and The Lead: Why Dispositions Exceed Conditionals**

  The intuitive link between a property and its manifestation is seductive. To say a glass is fragile seems to mean nothing more than that it would break if struck. This Simple Conditional Analysis (SCA) of dispositions—defining a property entirely by a counterfactual conditional—is philosophically economical. It promises to demystify powers by reducing them to logical relations between events. However, the introduction of "fink" and "mask" cases threatens to shatter this reduction. In the mask case, a fragile glass is wrapped in lead; in the fink case, a demon removes the glass's fragility the moment before impact. Both scenarios render the counterfactual "if struck, it would break" false, despite the glass intuitively remaining fragile. While standard philosophical discourse often treats these as symmetrical obstacles, a closer examination reveals a critical asymmetry. The mask is a manageable pragmatic complication, solvable by refining the conditions of the antecedent. The fink, however, is a metaphysical wrecking ball. It demonstrates that the conditional analysis cannot be saved as a reduction. Ultimately, finks and masks show that dispositions are not conditionals; rather, dispositions are the intrinsic categorical bases that *make* those conditionals true.

  To understand the asymmetry, we must first look at the mask. Consider the fragile glass encased in thick lead. According to the SCA, the glass is fragile if and only if, were it struck, it would break. In this scenario, were the glass struck, the lead would absorb the impact, and the glass would not break. The counterfactual is false. Yet, our intuition screams that the glass remains fragile; its molecular structure hasn't changed, only its environment has. The lead *masks* the disposition.

  The mask case is damaging to the *letter* of the SCA, but not its *spirit*. The failure here stems from the antecedent of the conditional being too broad. "If struck" implicitly assumes a standard environment. When we attribute fragility, we are not claiming the glass would break if struck by a feather, dropped in a vacuum, or wrapped in lead. We mean it would break if struck *in conditions appropriate for the manifestation of fragility*. Therefore, the mask can be handled by restricting the "if struck" clause to exclude extrinsic interferers. We can revise the analysis to: "The glass is fragile iff, if it were struck in the absence of masking conditions, it would break." This is a manageable complication because masking is extrinsic. The lead is not part of the glass; it is an external barrier. Excluding it from the "normal conditions" of the test does not require circular reasoning; it simply requires specifying the context. The mask is a noise problem, not a signal problem.

  The fink case, however, strikes at the signal itself. Imagine the same fragile glass, but this time a protective demon monitors it. The moment the glass is about to be struck, the demon magically alters its molecular structure, rendering it non-fragile just before impact. The glass is struck, but because it lost its fragility microseconds prior, it does not break. Like the mask, the counterfactual "if struck, it would break" is false. But unlike the mask, the fink cannot be dismissed as an "abnormal condition" in the same way.

  The fink is a fundamentally deeper threat because it targets the intrinsic nature of the disposition. In the mask case, the fragility persists through the strike; in the fink case, the fragility is removed *by* the stimulus. If we attempt to save the conditional analysis by restricting the antecedent—"if struck, and no fink intervenes"—we run into a vicious circularity. To define what counts as a "fink," we must reference the disposition itself. A fink is something that removes the *fragility*. If we define fragility as "breaking if struck unless a fragility-remover intervenes," we are using the term "fragility" to define "fragility." The analysis becomes vacuous.

  Furthermore, the "normal conditions" restriction that saved us from the mask fails here. In the demon world, the demon's presence is a permanent feature of the environment. If we are evaluating the glass in that world, the demon is part of the "normal conditions." To exclude the demon, we must appeal to a notion of fragility that exists independently of the demon's interference. We have to say the glass *is* fragile even though the demon ensures it won't break. This admits that fragility is a property the glass possesses *before* the counterfactual test is applied. The fink severs the link between the property and the counterfactual outcome, proving that the property can exist even when the counterfactual is false.

  Proponents of the conditional analysis, most notably David Lewis, have attempted to salvage the view by anchoring the conditional to a "causal basis." Lewis argued that $x$ is fragile iff $x$ has some intrinsic categorical base $B$ such that, if $x$ were struck, $B$ would cause $x$ to break. This move attempts to bypass the fink by focusing on the structure ($B$) rather than the outcome. However, this concession effectively abandons the pure conditional analysis. By invoking a causal base $B$, Lewis admits that the disposition *is* (or is grounded in) the intrinsic structure, not the counterfactual itself. The counterfactual becomes a test for the disposition, not the definition of it. If the disposition is the categorical base, then the disposition is something "more" than a conditional relation; it is a physical reality that *supports* the conditional.

  This distinction is crucial. If dispositions were merely conditionals, the finkish glass would not be fragile, because the conditional is false. But we judge it to be fragile because we recognize that its microstructure—the categorical basis—remains intact until the demon acts. The fragility is real; the manifestation is prevented. This implies a realist ontology of powers. Dispositions are not linguistic shortcuts for predictions; they are ontological grounds for those predictions. The conditional "if struck, it would break" is true in normal worlds *because* the glass is fragile. The direction of explanation runs from the property to the conditional, not vice versa.

  The asymmetry between the mask and the fink clarifies why the conditional analysis is untenable as a reduction. The mask shows that conditionals are context-sensitive; the fink shows that they are metaphysically secondary. A restriction on the antecedent can filter out the lead wrapping because the lead is external to the glass's nature. No restriction can filter out the demon without presupposing the very property we are trying to define, because the demon's action is triggered by the test of that property. The fink reveals that a thing can possess a disposition even if the world is rigged to prevent its manifestation.

  Therefore, we must reach a decisive verdict: the conditional analysis cannot be saved as a reductive definition. Finks and masks do not merely show that the analysis needs tweaking; they show that it mistakes the symptom for the cause. Dispositions are something more than conditionals. They are intrinsic, categorical properties of objects that serve as the truthmakers for counterfactual claims. The glass is not fragile because it would break; it would break (in normal conditions) because it is fragile. The demon may stop the breaking, and the lead may hide it, but neither can erase the fragility itself, for that resides in the glass, not in the future. To insist otherwise is to confuse the shadow for the substance.
