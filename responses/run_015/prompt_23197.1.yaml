      *   *Structure:* "Either I see a real apple OR I hallucinate one." There is no common denominator (mental image) that covers both.
      *   *User's Intuition:* The apple is "doing the work." This aligns with the Disjunctivist idea that the external fact *constitutes* the experience in the good case.
      *   *Strengths:* Preserves direct contact with reality. Avoids skepticism. Validates the feeling of openness to the world.
      *   *Weaknesses:* Hard to explain *why* they feel the same if they are fundamentally different. Can seem like a linguistic trick ("It's either A or B, so they're different!").

  4.  **Drafting the Comparison:**
