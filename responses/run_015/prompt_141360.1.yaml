answer: |-
  The divergence of German and French nuclear policy following the 2011 Fukushima accident offers a stark test for real-options reasoning applied to national infrastructure. Standard doctrine treats investment under uncertainty as a matter of timing, but a sharpened lens requires four stipulations: distinguishing retention, replacement, and reversal decisions; recognising that delay incurs costs in learning and supply chain atrophy; defining explicit system boundaries for emissions; and treating capacity as an option on future industrial capability. Mapping the decision nodes of both states against this frame reveals where option价值 explains behaviour and where it collapses against political reality.

  Germany's 2000 consensus was a scheduled reversal decision, sacrificing the retention option of amortised plants for political consensus. The 2010 extension attempted to reclaim the retention option, acknowledging the economic value of existing assets, yet it failed to secure the 'option on future options' regarding industrial capability. When Fukushima struck in 2011, the German government executed an immediate reversal decision. The ethics commission on secure energy supply framed this not as a technocratic calculation under uncertainty, but as a moral imperative, effectively setting the option value of nuclear capacity to zero regardless of data. This ignored the quasi-option value of waiting; delay was not neutral, as it forced reliance on interim generation sources. By April 2023, the final reversal was completed amidst a gas crisis, exercising the exit option fully. France, conversely, treated 2011 as a retention decision. The 2022 stress-corrosion outages demonstrated the cost of deferred maintenance—a penalty for delay under stipulation two—yet the state ordered new build. This preserved the industrial option (stipulation four), ensuring regulatory competence remained intact. At a 2035 horizon, Germany faces a generation gap filled by gas or imports, whereas France retains low-carbon baseload. By 2050, Germany risks carbon lock-in or import dependency, while France retains sovereign capability despite ageing fleet costs.

  The lens explains the French coherence but struggles to accommodate the German morality. The ethics commission's role was pivotal in converting a technocratic question into a moral one, bypassing the option calculus entirely. In real-options terms, the German decision ratified a decades-long social movement, implying the objective function was political stability rather than economic optimisation. The frame captures this only if one accepts that social licence alters the discount rate applied to risk to infinity. France's state dependence on EDF fits the unitary actor model required by the lens, allowing for a coherent retention and replacement strategy. However, this centralisation created a single point of failure, evident in the 2022 output guidance cut. The lens vindicates the French retention of capacity as preserving the option on future options; once the industrial base is lost, as in Germany, rebuilding is not a symmetric transaction. The cost of re-acquiring regulatory competence exceeds the cost of maintaining it, validating stipulation four.

  However, turning the lens on itself exposes significant limitations. The comparison does not fully vindicate irreversibility-and-option-value thinking as the sole correct frame because it misdescribes the binding constraint. For Germany, the constraint was never information uncertainty but social licence. The frame presupposes a single decision-maker with a coherent objective function, yet Germany is a federal system operating within a coupled Central European grid. The 'option' was exercised on a national boundary while the physical system is transnational; Germany's exit exported risk to neighbours, complicating the emissions accounting required by stipulation three. If the boundary is territorial generation, Germany appears cleaner by importing nuclear power; if consumption-adjusted, the carbon intensity rises. The frame is silent on how coupled grids dilute national sovereignty over energy mix. Furthermore, the lens assumes rational actors maximising long-term value, yet the 2011 reversal was a reaction to immediate political pressure. The French state's dependence on a single national champion also violates the robustness expected of diversified portfolios, suggesting that option value can be concentrated rather than spread.

  To discriminate between these paths without hindsight, one would have needed evidence in 2011 regarding the scaling speed of renewables versus the rate of supply chain atrophy. If data had shown that renewable firming could be achieved cheaper than nuclear extension before 2022, Germany's path would hold positive option value. If not, France's retention preserves the superior option. The critical evidence would have been the elasticity of the industrial base: could the supply chain survive a decade-long hiatus? Germany assumed it could not, or did not care; France assumed it must not. The real-options frame highlights this asymmetry but cannot resolve the political valuation of risk itself. Ultimately, the lens clarifies the structural costs of reversal but remains silent on the legitimacy of the preferences driving them. It shows that Germany paid a premium for political closure, while France paid a premium for industrial continuity, but it cannot judge which premium was warranted without exogenous social data. The frame is a tool for mapping consequences, not for validating the objectives that trigger them.
