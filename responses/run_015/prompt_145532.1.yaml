  Here is a sestina exploring the tension between Strawson's participant and objective attitudes through the lens of dissociation.

  The circle waits for someone to assign blame,
  While I watch my own hands like clocks I observe,
  My history kept at arm's length, never close,
  A life that feels irrevocably distant,
  Where once I would have swallowed whole the fault,
  Now I only seek a way to repair.

  Is there a mechanic who can repair
  The mind that will not accept the blame?
  I scan the chart for error and for fault,
  A clinician trained to coldly observe
  The subject who stands too distant,
  Though everyone here wants me close.

  They say bring the memory close,
  But I am building walls to repair
  The breach that makes me feel so distant.
  If I am broken, who is there to blame?
  A machine does not know how to observe
  Its own grinding gears, only the fault.

  It is easier to flee from fault
  When love demands we stay too close,
  Better to be a case to observe
  Than a lover who must repair
  The hurt by taking all the blame,
  So I retreat to somewhere distant.

  The group fades into a distant
  Hum, I am the only one at fault,
  Yet I refuse the sting of blame,
  It is safer not to get too close,
  To treat the soul as something to repair,
  A thing to study, not to observe.

  I cannot truly observe
  Myself as human, only distant,
  What tools remain to repair
  The bond if I deny the fault?
  No hands will reach to close
  The gap if I reject the blame.

  Who will assign the blame or observe the pain,
  No touch can bring me close while I stay distant,
  Without a fault, there is nothing to repair.
