  4. The Knight of Infinite Resignation gives up the finite for the infinite, while the Knight of Faith gives up the finite and believes he will receive it back by virtue of the absurd. This distinction maps onto how one relates to the ethical world after encountering the absolute, not merely being inside or outside its boundaries.
