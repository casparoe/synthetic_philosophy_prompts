  *(Self-Correction during final review)*: I need to make sure I don't write the paper *for* them, but give them the argumentative architecture. The prompt asks me to "tell me whether..." and "point me to...". I will adopt the persona of a knowledgeable tutor or senior colleague providing a detailed briefing.

  *Key Philosophical Insight to inject:* The distinction between *numerical identity* and *qualitative character*. Wilde separates them. Standard metaphysics tries to reconcile them. Wilde shows the horror of their separation.

