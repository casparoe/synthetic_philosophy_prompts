      *   *Perdurantism (Worm):* Dorian is a spacetime worm. Usually, later segments look older. Here, later segments look young. The "corruption" is offloaded to a distinct object (the canvas).
      *   *Perdurantism (Stage):* Dorian-at-$t_1$ and Dorian-at-$t_2$ are distinct entities linked by relations. If the link is psychological, Dorian is the body. If the link includes moral/physical inscription, maybe the picture is part of the "person-stage" complex?
      *   *Temporary Intrinsics:* Lewis's problem. How can $x$ be $F$ and not-$F$? Standard solution: Relational ($F$-at-$t$). Wilde's solution: $x$ is $F$, $y$ is not-$F$, but $x$ and $y$ are mystically linked. This isn't a solution to the logical problem; it's a magical displacement.
      *   *The Objection:* Personal Identity (Lockean) vs. Metaphysical Persistence (Material/Constitution). If Dorian remembers everything, *he* is the person. The picture is just a diary. The paper needs to argue that Wilde is challenging the *necessity* of the physical/psychological link, or highlighting the *phenomenology* of disassociation.

