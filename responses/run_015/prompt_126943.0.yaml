  ### The Scene

  The sherry was warm, and the funeral sandwiches had dried at the edges. In the vestry of St Chad's, the air smelled of damp stone and old hymnals. Marcus stood by the radiator, holding a paper plate he had no intention of eating from.

  Julian approached him first. He was ten years older, his suit the same charcoal one he'd worn to the board meeting on Tuesday. He didn't raise his voice.

  "You took the Henderson file, Marcus," Julian said. It wasn't a question. "And you've signed the lease on the Birmingham road. While we were sitting shiva for Father."

  Marcus looked at his shoes. "The firm was bleeding. I had to secure my future."

  "Our future," Julian corrected. He took a sip of sherry, his hand steady. "I'm not moralising. I'm telling you that you've breached the partnership deed. You can't use the client book to build a rival house. Not while your name is still on the door."

  Eleanor stepped in from the shadows of the organ loft. She was immaculate in black, her posture straight as a ruler. She had never signed a client letter in her life, never billed an hour.

  "It's dishonest, Marcus," she said, her voice cutting through the low murmur of the mourners. "To smile at us on Monday and sign with a competitor on Friday. It's a betrayal of the family. You have no honour."

  Julian glanced at her, a flicker of something unreadable in his eyes, then turned back to Marcus. "I'll have the solicitors draft the injunction by morning. Don't make me serve it at the new office."

  "You're in no position to judge," Marcus said, looking up, his eyes finding Julian's. "Not after what you did with the Coventry development."

  Julian didn't flinch. "That was my burden to carry. This is yours." He set his glass down on a pew. "Get out."

  Eleanor opened her mouth to speak again, to add weight to the verdict, but Julian put a hand on her arm. It wasn't a gesture of affection; it was a restraint. She fell silent, her moral certainty suddenly looking thin, like paper held up to the light. Marcus walked past them both, out into the cathedral close, but the weight of Julian's words stayed with him, heavy and binding. Eleanor's had slipped off like water.

  ***

  ### The Analysis

  **1. The Theoretical Account and Verdicts**

  I am employing a **Role-Relative Waiver Account** of standing. This is a variant of the fair-play view, but it prioritises normative roles and specific waivers over general moral compliance. On this view, standing to blame is not a reward for virtue, but a function of one's position within a specific normative practice and whether one has waived the right to enforce its rules in the present context.

  *   **Julian (The Hypocrite):** He retains standing. Although he violated the same norm (using firm assets for personal manoeuvring with the Coventry development), he occupies the role of **Senior Partner and Residual Claimant**. He bears the ultimate liability for the firm's survival. His blame is not an appeal to abstract morality, but an enforcement of a contractual and fiduciary duty owed specifically to him. He has not waived the norm *against Marcus*. His own past violation is a debt he carries, but it does not negate his current right to protect the firm's assets from dissipation. He is the victim of the specific token act.
  *   **Eleanor (The Scrupulous Woman):** She lacks standing. Although personally immaculate, she occupies the role of **Beneficiary who Waived**. Years ago, when Julian undertook the Coventry development, Eleanor (as a family trustee or influential matriarch figure) explicitly authorised or waived the norm for him to ensure his liquidity. By licensing the violation for Julian, she undermined the norm's authority within the family firm. She cannot now invoke that same norm against Marcus. Her blame is structurally compromised because she rendered the rule optional for the person she loved, making her enforcement against Marcus arbitrary.

  **2. Ablation and Isolation**

  *   **Julian:** If we strip Julian of his **Role as Residual Claimant** (e.g., if he had already sold his share and was merely a bystander), his standing collapses. Without the burden of liability, his blame becomes mere interference, and his own hypocrisy renders him a free-rider on the moral norm. He would be "one of the crowd" blaming a sinner while sinning himself.
  *   **Eleanor:** If we strip Eleanor of her **Prior Waiver** (e.g., if she had fiercely opposed Julian's Coventry deal and refused to benefit from it), her standing is restored. She would then be a consistent enforcer of the family norm, speaking from a position of integrity.
  *   **One Feature or Two?** These are two sides of the same feature: **Normative Consistency within the Relationship**. Julian maintains consistency between his role obligations and his enforcement (he protects the firm, even if imperfectly). Eleanor creates inconsistency between her past permissions and present demands. The feature is the *integrity of the normative relationship*, not the moral purity of the agent.

  **3. The Appraisal Theorist Objection**

  A theorist who holds that blame is simply an **appraisal of badness** (such as a strict Moral Record theorist) would argue that this scene is irrelevant to the metaphysics of blame. They would contend that both Julian and Eleanor are equally entitled to judge Marcus's act as wrong, provided the act *is* wrong. For them, 'standing' is a social etiquette, not a condition of blame itself. They would say Julian is a hypocrite and Eleanor is not, but both can correctly appraise Marcus's action as a breach of duty.
  *   **Is this an embarrassment?** No. The scene does not prove the appraisal theorist wrong about the *truth* of the judgment (Marcus *did* wrong). However, it demonstrates that the *efficacy* and *appropriateness* of the blame speech-act depend on relational history, not just moral facts. The scene shows that blame is a transaction, not just a verdict. The theorist might call this 'pragmatics', but for the novelist, it is the substance of the drama.

  **4. Novelist's Constraint**

  The reader should end up disliking **Eleanor** more, for her weaponised purity masks a structural injustice that Julian, in his weary dishonesty, at least acknowledges as a burden.
