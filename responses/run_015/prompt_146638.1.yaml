answer: |-
  Here is the specification of requirements for a theory of dreaming, calibrated to your stated purpose (licensing scientific inference from reports to experience). I have filtered your draft list to separate functional necessities from philosophical commitments, identified the structural conflict you suspected, and provided the scorecard.

  ### The Requirements Specification

  | Requirement | Specification | Status |
  | :--- | :--- | :--- |
  | **1. Inference Licensing** | The theory must specify conditions under which a report (or behavior) licenses an inference to a concurrent phenomenal state, and conditions under which it does not. It cannot treat all reports as equally valid nor all as equally suspect. | **Non-Negotiable** (Required for your stated scientific purpose) |
  | **2. Epistemic Bridge** | The theory must model the transformation from sleep-state to waking report. It must account for memory decay, state-change distortion, and the "deferred-construction" possibility without rendering the report evidentially void. | **Non-Negotiable** (Required to avoid circularity) |
  | **3. Ontological Determinacy** | The theory must state whether "Did an experience occur?" has a determinate truth value for every sleep episode, or whether truth-value gaps/degrees are permitted. | **Camp Preference** (Realists require Yes; Malcolm/Dennett allow No/Indeterminate) |
  | **4. Phenomenal Scope** | The theory must accommodate non-REM mentation, "white dreams" (contentless awareness), hypnagogia, nightmares, and REM Behavior Disorder enactments without ad-hoc exceptions. | **Non-Negotiable** (Required for empirical adequacy) |
  | **5. First-Person Status** | The theory must reconcile limited first-person authority (the dreamer knows best) with the possibility of error (the dreamer can be wrong about *whether* they dreamt). | **Non-Negotiable** (Required for the 20-second interval protocol logic) |
  | **6. Metaphysical/Evidential Distinction** | The theory must distinguish the fact of the experience from the evidence for the experience. It cannot collapse "I don't remember" into "It didn't happen" (unless argued for). | **Non-Negotiable** (Required to avoid category errors) |

  ### The Structural Conflict (The Trilemma)

  Your suspicion is correct. The following three constraints form an inconsistent triad; a viable theory must reject at least one:

  1.  **Exclusive Evidence:** Dream reports (or sleep behavior) are our *only* access to the phenomenon.
  2.  **Epistemic Opacity:** The theory predicts reports are significantly transformed/unreliable (e.g., deferred construction, memory decay).
  3.  **Ontological Determinacy:** Every sleep episode yields a determinate Yes/No verdict on whether an experience occurred.

  **The Result:** You cannot have a theory that treats reports as the sole evidence, admits they are heavily constructed at waking, *and* insists on a determinate fact of the matter about the sleep state.
  *   **Malcolm** rejects (3). (The question is conceptually confused.)
  *   **Dennett** rejects (3). (Facts are indeterminate; the "cassette" is a myth.)
  *   **Standard Realism** rejects (2). (Claims memory/reporting is reliable enough to track the fact.)
  *   **Your Friend (Degraded Simulation)** likely rejects (3). (Pressing for a verdict is a mistake.)

  ### The Single Most Exclusionary Requirement

  **Requirement 3 (Ontological Determinacy)** excludes the most philosophical candidates.
  While Requirement 1 (Inference Licensing) excludes Malcolm from the *scientific project*, Requirement 3 is the philosophical fault line that divides the field into Realists vs. Anti-Realists/Indeterminists. Demanding a determinate verdict is, as you suspected, a prejudice against the Malcolm/Dennett line. However, for your specific purpose (using dreams as data for consciousness science), **Requirement 1** is the functional killer: if a theory cannot license the inference from report to experience *at all*, it fails your paper's purpose, regardless of its metaphysical elegance.

  ### Scorecard

  | Theory | Inference Licensing (1) | Epistemic Bridge (2) | Ontological Determinacy (3) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Malcolm** | **Fail.** Denies the coherence of inferring private experience from public report. | **Pass.** Accounts for the logical grammar of reporting. | **Fail.** Denies truth conditions for "I dreamt." | **Excluded.** Conceptually blocks the scientific project. |
  | **Dennett** | **Pass.** Heterophenomenology licenses inference to *beliefs*, cautiously to *experiences*. | **Pass.** Explicitly models deferred construction/memory editing. | **Fail.** Accepts indeterminacy; no fact of the matter in borderline cases. | **Conditional.** Usable only if science accepts indeterminate baselines. |
  | **Degraded-Simulation** | **Pass.** Infers experience from fragments/enactment. | **Pass.** Models fragmentation as feature, not bug. | **Fail.** Refuses verdict on "aborted" simulations. | **Conditional.** Useful for grading evidence quality, fails binary classification. |
  | **Standard Realism** | **Pass.** Treats reports as transparent windows. | **Fail.** Often underestimates deferred construction/memory distortion. | **Pass.** Insists on Yes/No facts. | **At Risk.** Fails the Trilemma (must deny Epistemic Opacity to survive). |

  **Recommendation:** In your paper, explicitly state that you are adopting **Requirement 3 (Determinacy)** as a working hypothesis for the sake of the scientific utility you defined, acknowledging this excludes Malcolm and Dennett *by fiat* of the project's design, not by refutation. This exposes the prejudice rather than hiding it in the scoring.
