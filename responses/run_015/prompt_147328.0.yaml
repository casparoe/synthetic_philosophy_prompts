  # Diagnostic Decision Tree: Exploitation vs. Alienation

  **Instructions:** Navigate the tree by selecting the claim that best matches your interpretive commitment at each junction. Terminal nodes (leaves) classify the resulting position.

  ### **SPLIT 1: Conceptual Priority**
  *Which phenomenon provides the foundational explanation for the other?*

  *   **[A] Exploitation is Prior:** The extraction of surplus value explains the experience of estrangement.
  *   **[B] Alienation is Prior:** The estrangement of labor explains the structure of surplus extraction.
  *   **[C] Analytically Independent:** The two are co-occurring phenomena with no单向 explanatory direction.

  ---

  ### **SPLIT 2: Scope of Alienation**
  *Does alienation depend essentially on the capitalist commodity-form, or does it persist wherever labor is separated from the means of production?*

  *   **[A1] (From Exp Prior) → Capitalist Specific:** Alienation is tied to wage-labor and market exchange.
  *   **[A2] (From Exp Prior) → Trans-Historical/Structural:** Alienation persists in bureaucratic/non-market formations where labor is separated from means.
  *   **[B1] (From Al Prior) → Capitalist Specific:** Alienation is tied to wage-labor and market exchange.
  *   **[B2] (From Al Prior) → Trans-Historical/Structural:** Alienation persists in bureaucratic/non-market formations where labor is separated from means.
  *   **[C1] (From Independent) → Capitalist Specific:** Alienation is tied to wage-labor and market exchange.
  *   **[C2] (From Independent) → Trans-Historical/Structural:** Alienation persists in bureaucratic/non-market formations where labor is separated from means.

  ---

  ### **SPLIT 3: Normative Reducibility**
  *Is the wrong of exploitation fully reducible to the harm of alienation, or does exploitation carry a distinct wrong (e.g., domination/distribution) surviving a cure of alienation?*

  *(Note: For Priority branches [A] and [B], normative status is determined by conceptual priority, yielding one terminal node per path. For Independent branches [C], normative status remains an open variable, yielding two terminal nodes per path.)*

  *   **[A1] → Distinct Wrong** (Terminal Node 1)
  *   **[A2] → Distinct Wrong** (Terminal Node 2)
  *   **[B1] → Reducible Wrong** (Terminal Node 3)
  *   **[B2] → Reducible Wrong** (Terminal Node 4)
  *   **[C1] → Reducible Wrong** (Terminal Node 5)
  *   **[C1] → Distinct Wrong** (Terminal Node 6)
  *   **[C2] → Reducible Wrong** (Terminal Node 7)
  *   **[C2] → Distinct Wrong** (Terminal Node 8)

  ---

  ### **TERMINAL NODES (CLASSIFICATIONS)**

  **Node 1: [A1 + Distinct] — Analytical Marxism**
  *   **Core Commitment:** Exploitation is an unjust distribution of property rights independent of subjective experience or commodity forms.
  *   **Most Awkward Commitment:** Must condemn a voluntary, happy worker in a cooperative as exploited if surplus is extracted via market mechanics alone.

  **Node 2: [A2 + Distinct] — Bureaucratic Collectivism**
  *   **Core Commitment:** Surplus extraction by a planning elite constitutes exploitation regardless of commodity forms or market exchange.
  *   **Most Awkward Commitment:** Must classify state-socialist workers as exploited even if they lack a market wage contract and claim collective ownership.

  **Node 3: [B1 + Reducible] — Early Humanist Marx**
  *   **Core Commitment:** Exploitation is wrong solely because it institutionalizes the estrangement of species-being within capitalism.
  *   **Most Awkward Commitment:** Must concede exploitation would be permissible if workers felt fully fulfilled while producing surplus for others.

  **Node 4: [B2 + Reducible] — Unnamed (Neglect)**
  *   **Core Commitment:** Alienation is trans-historical and exploitation is wrong only insofar as it manifests this universal estrangement.
  *   **Most Awkward Commitment:** Lacks a mechanism to explain why capitalist alienation is specifically targeted over feudal or socialist estrangement.

  **Node 5: [C1 + Reducible] — Unnamed (Incoherence)**
  *   **Core Commitment:** Structures and phenomena are separate, yet the structural wrong vanishes if the phenomenological harm is cured.
  *   **Most Awkward Commitment:** Asserts analytical independence while simultaneously asserting normative dependence.

  **Node 6: [C1 + Distinct] — Critical Theory (First Generation)**
  *   **Core Commitment:** Reification and surplus extraction are dual evils requiring separate critiques of culture and economics within capitalism.
  *   **Most Awkward Commitment:** Must propose two distinct revolutionary solutions that may contradict each other in practice.

  **Node 7: [C2 + Reducible] — Unnamed (Incoherence)**
  *   **Core Commitment:** Structures and phenomena are separate, yet the structural wrong vanishes if the phenomenological harm is cured.
  *   **Most Awkward Commitment:** Asserts analytical independence while simultaneously asserting normative dependence.

  **Node 8: [C2 + Distinct] — Structuralist Marxism**
  *   **Core Commitment:** Ideological state apparatuses and economic exploitation operate via distinct logics that co-persist across formations.
  *   **Most Awkward Commitment:** Must deny that overcoming capitalism automatically resolves alienation or domination.

  ---

  **Instrument Limitation Note:**
  This tree fails to separate **Analytical Marxism** and **Libertarian Marxism**, as both occupy Node 1 (Exploitation Prior / Capitalist Specific / Normatively Distinct). It also fails to distinguish **Critical Theory** from **Western Marxism** generally, as both occupy Node 6.
