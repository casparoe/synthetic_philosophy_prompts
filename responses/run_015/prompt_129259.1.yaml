  Before the will descends to shape the clay
  There shines a light through unmade, formless glass
  Where all that can be waits within the day
  Not determined, purely possible
  But in the space between the thought and act
  A shadow falls on unplanted, dry soil
  Where footprints wait without a walker's fact
  I see the path he takes if I should place
  Him in the garden when the serpent speaks
  Yet no decree has touched this chosen space
  Nor does my will compel the choice he makes
  For if the truth depends on what I will
  Then freedom dies beneath the weight of force
  But if it stands apart from my decree
  What ground supports the statement's subtle
  Form? Branch is real though no root system shows
  A fruit suspended neither ripe nor cold
  Independent of the tree that bears load
  I survey worlds feasible to my hand
  But some are closed by choices not yet made
  Though feasible worlds shrink beneath the gaze
  The knowledge stands without any ground to
  Stand. It floats above causeless, uncaused maze
  A mirror showing no original
  Ground. Then will descends to fix final state
  And what was 'would' becomes the 'is' of fate
  Yet still the question hangs in mid-air space
  Who wrote the truth before the time and place
  Is it mystery hidden in the mind
  Or void where no foundation can be found

  The poem's reasoning is most vulnerable in assuming syntactic suspension successfully mirrors metaphysical grounding. If a defensible account of the ground of counterfactuals of freedom exists (e.g., essentialist properties of agents), the poem's tension becomes decorative rather than diagnostic. The enjambment might merely aestheticize a solvable philosophical problem, implying mystery where there is only complexity.
