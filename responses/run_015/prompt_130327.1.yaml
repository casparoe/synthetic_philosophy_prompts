answer: |-
  You have identified a genuine and pervasive structural flaw in modern moral discourse, particularly in liberal ethics. You are correct that it resembles the Euthyphro Dilemma, but as you noted, it is distinct because the arguer does not choose a horn; they slide between them to avoid the vulnerability of either.

  There is no single canonical Latin term for this specific maneuver, but it is a composite of known logical and rhetorical phenomena. Here is the breakdown of the existing frameworks that cover it, followed by a proposed coinage that captures the specific "ground-verdict" mechanic you described.

  ### 1. The Closest Existing Term: The Motte-and-Bailey Doctrine
  The most established rhetorical label for this behavior is the **Motte-and-Bailey Fallacy**.

  *   **The Bailey (The Controversial Claim):** "Autonomy is an independent, supreme good that trumps wellbeing." (This is the substantive claim they want to use to win the debate).
  *   **The Motte (The Defensible Claim):** "Autonomy is the concept we use to describe the boundary against coercion." (This is the definitional retreat).
  *   **The Slide:** When they are arguing *for* a restriction, they treat Autonomy as the **Bailey** (a heavy, independent weight that crushes wellbeing). When you challenge the *source* of that weight, they retreat to the **Motte** (it's not a weight, it's just a definition; you can't ask 'why' a definition).

  **Why this fits:** It explains the tactical advantage. They get the *force* of a foundational value without the *burden* of justifying that foundation.

  ### 2. The Meta-Ethical Structure: The Euthyphro Isomorph
  Your intuition about the Euthyphro Dilemma is structurally correct. This is a **Secular Euthyphro Slide**.

  *   **Euthyphro:** Is X good because God commands it (Command $\to$ Good), or does God command it because it is good (Good $\to$ Command)?
  *   **Your Scenario:** Is coercion wrong because it violates Autonomy (Principle $\to$ Verdict), or is Autonomy just the name we give to the rule against coercion (Verdict $\to$ Principle)?

  **The Difference:** The Euthyphro *Dilemma* forces a choice between two difficult options. What you are observing is the **Euthyphro Evasion**. The arguer treats the Principle as the *cause* of the Verdict when arguing, but treats the Verdict as the *definition* of the Principle when challenged. They want the Principle to be ontologically prior (to have authority) and conceptually posterior (to be indisputable) simultaneously.

  ### 3. Distinction from Circular Reasoning and Reflective Equilibrium
  It is important to distinguish this from the two concepts you mentioned, as the distinction clarifies why it is so frustrating.

  *   **Vs. Circular Reasoning (Petitio Principii):**
      *   *Circular Reasoning* is static: $A$ is true because of $B$, $B$ is true because of $A$ within the *same* argument chain.
      *   *This Phenomenon* is dynamic: The status of $A$ changes depending on the *pressure* applied. In one sentence, Autonomy is a **Premise** (Foundation). In the next, it is a **Conclusion** (Redescription). It is not a closed loop; it is a shape-shifting justification.
  *   **Vs. Reflective Equilibrium:**
      *   *Reflective Equilibrium* (Rawls) is a legitimate method where one moves back and forth between principles and intuitions to find coherence.
      *   *The Difference:* In Reflective Equilibrium, the philosopher *admits* they are adjusting the principle to fit the intuition. In your scenario, the arguer *denies* the adjustment. They claim linear derivation ("Autonomy dictates this") until caught, then claim conceptual truth ("This is what Autonomy means"). It is the *concealment* of the equilibrium process that makes it fallacious.

  ### 4. Proposed Coinage: The Ground-Verdict Slide
  Since existing terms describe the *tactic* (Motte-and-Bailey) or the *structure* (Euthyphro), there is room for a term that describes the specific **justificatory mechanism** you identified: the trading of places between the ground and the judgment.

  I propose calling this **The Ground-Verdict Slide** (or technically, **The Normative Directionality Equivocation**).

  #### Definition
  The **Ground-Verdict Slide** occurs when a moral agent justifies a specific verdict ($V$) by appealing to a principle ($P$), but when the authority of $P$ is challenged, redefines $P$ as being constituted by $V$, without acknowledging the shift in logical direction.

  #### Boundary Conditions
  For an argument to qualify as the Ground-Verdict Slide, it must meet all four conditions:

  1.  **Forward Justification:** In the initial assertion, $P$ is presented as the independent *ground* for $V$ (e.g., "We must not coerce *because* of Autonomy").
  2.  **Challenge of Weight:** An interlocutor challenges why $P$ overrides competing values (e.g., "Why does Autonomy trump Wellbeing?").
  3.  **Reverse Definition:** In response, the agent treats $P$ as conceptually dependent on $V$ (e.g., "Autonomy *is* the prohibition of coercion; it's not a trade-off").
  4.  **Unacknowledged Reversion:** In subsequent reasoning, the agent returns to treating $P$ as an independent ground capable of weighing against other values, as if the Reverse Definition never happened.

  #### Why this term works
  *   **"Ground"** captures the foundational status (the independent good).
  *   **"Verdict"** captures the particular judgment (the prohibition on coercion).
  *   **"Slide"** captures the unnoticed movement between the two directions of fit.

  ### Summary
  You are not imagining this. It is a **Motte-and-Bailey** maneuver executed via a **Secular Euthyphro Slide**. The arguer wants the **ontological weight** of a foundational value (to trump wellbeing) but the **conceptual security** of a tautology (to avoid justification).

  If you need to name it in a debate to call out the mechanism specifically, **The Ground-Verdict Slide** is precise. If you want to name the rhetorical strategy, **Motte-and-Bailey** is the recognized term. If you want to name the meta-ethical confusion, **The Normative Directionality Equivocation** is the most accurate technical description.

  **How to counter it:**
  Force them to pick a horn of the Euthyphro Isomorph explicitly:
  > "You need to decide: Is Autonomy an independent value that *happens* to forbid coercion (which requires justification for why it trumps wellbeing)? Or is Autonomy just a label for 'whatever forbids coercion' (in which case it has no independent weight to trump anything)? You are using it as a foundation when you attack, and a definition when you defend."
