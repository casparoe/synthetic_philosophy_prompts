answer: |-
  Dear Friend,

  I have spent some time with the argument your colleague calls the unbidden-hypothesis argument, and I share your intuition that it proves far too much. It is a sophisticated piece of reasoning that effectively traps us between the norms of diachronic coherence and the reality of scientific progress, but it does so by smuggling in an equivocation about what constitutes the same proposition over time. The break in the argument occurs at the junction where the Conservation Lemma is applied to a case of conceptual change, specifically between steps two and four, though the error only becomes fatal in the inference to step six. You can indeed keep premises one and two, but doing so requires acknowledging that the Dutch-book framework is silent on the very phenomenon your friend uses it to condemn, which means you must accept that probabilistic coherence is a norm for reasoning within a conceptual scheme rather than a norm for evolving the scheme itself.

  The core issue lies in the conditions required for the Conservation Lemma to hold. Your friend states in step two that if the later algebra refines the earlier one and no new evidence arrives, book-immunity requires credences to remain constant. This lemma relies on the assumption of semantic stability, meaning that a proposition P at time one must have the same truth conditions as proposition P at time two. The Dutch book described in the lemma works by selling a bet on P at the old price and buying it back at the new price, guaranteeing a loss regardless of the outcome. This guarantee only holds if the payoff conditions for the bet are identical at both times. However, in step four, your friend describes a case where the old hypotheses do not survive the re-cut, noting that miasma is revealed to be empty or degenerate. If miasma is empty in the new scheme, then the proposition miasma causes disease at time one is not logically equivalent to any disjunction of propositions at time two. It is not a refinement in the logical sense required for the Conservation Lemma; it is a replacement. Consequently, the bookie cannot construct the guaranteed loss because the bet sold at time one and the bet bought at time two are wagers on different states of affairs. The nickel bet your friend sketches is not available because there is no single outcome space over which the loss is guaranteed.

  This addresses your first inarticulate worry about the availability of the nickel bet. It looked sound because we often model belief revision as mere redistribution of probability mass over a fixed set of world-states. In standard conditionalization, the partition gets finer, but the old cells remain meaningful unions of the new cells. In conceptual change, the old cells dissolve. If Clara assigns zero credence to miasma in the new scheme because she believes it does not exist, she is not violating dynamic consistency relative to the old scheme because the old scheme no longer provides the ontology for evaluating the bet. The bookie would need to stand outside both conceptual schemes to enforce the Dutch book, possessing a translation manual that maps the old false concepts to the new true ones, but if such a manual were available to Clara at time one, she would not have undergone conceptual change in the relevant sense. This connects to your third worry about the bookie being conceptually ahead of Clara. If the bookie knows the truth of germ theory while Clara is still operating with miasma, the exploitation reflects the bookie's superior knowledge of the world, not Clara's irrationality. Dutch-book arguments are supposed to detect internal inconsistency, not ignorance of external facts.

  Regarding your second worry about the gap between underdetermination in step three and the requirement to lower confidence in step five, this is less critical than the semantic shift but still worth noting. Step five claims rationality requires confidence to fall because the old categories were inadequate. This conflates the rationality of the prior with the falsity of the hypothesis. Clara was not irrational for believing in miasma given her evidence at time one, even if miasma turned out to be false. Rationality requires responding to evidence, not infallibility. However, the argument tries to force a contradiction by saying she must keep her credences to avoid a Dutch book yet must lower them to be responsive to the inadequacy of the space. The resolution is that the duty to avoid Dutch books only applies when the propositions retain their identity. When the space itself is judged inadequate, the constraint of the Conservation Lemma dissolves, and she is free to redistribute credences, even to zero, without diachronic irrationality.

  If you wish to keep premises one and two, as you stated is your preference, you must price the alternative correctly. Holding onto them means accepting that Dutch-book reasoning has a domain limit. It governs rationality within a fixed language game but cannot adjudicate changes in the rules of the game itself. This does not invalidate the Dutch-book argument for probabilistic coherence or conditionalization; it merely clarifies that those are norms for intra-conceptual reasoning. The cost is that your paper must concede that exploitability cannot tell us everything about rationality, specifically regarding how we ought to revise our ontology. This might feel like a retreat, but it is a necessary clarification. If you try to stretch the Dutch-book framework to cover conceptual change, you end up with your friend's absurd conclusion that all growing agents are irrational. It is better to say that the framework is silent there than to say it condemns progress.

  As for the catch-all hypothesis mentioned in step seven, your instinct that it does not help is correct. Assigning a sharp credence to unknown unknowns is indeed arbitrary, and leaving it unassigned violates synchronic coherence. But more importantly, a catch-all does not solve the semantic problem. You cannot construct a Dutch book involving a proposition you cannot formulate. If Clara has a catch-all hypothesis that something else is true, she still cannot bet on the specific content of that something else until she conceives it. Therefore, the catch-all cannot protect her from the alleged Dutch book in the friend's argument because the bookie cannot offer a bet on the specific new hypothesis K before Clara conceives it. The vulnerability exists only in hindsight, which again points to the bookie's conceptual advantage rather than Clara's irrationality.

  In summary, the argument fails because it treats conceptual change as a violation of diachronic coherence within a fixed space, when it is actually a transition between spaces. The Conservation Lemma requires propositional identity, which is absent in cases of radical theory change. You can maintain that book-immunity is necessary for rationality and that the Conservation Lemma holds, provided you specify that these norms apply only when the algebra of propositions remains stable in meaning. This saves the Dutch-book framework from proving too much, but it does mean acknowledging that the framework falls silent on the rationality of conceptual revolutions. This silence is not a bug but a feature, marking the boundary where logical coherence gives way to empirical discovery and conceptual innovation. You should revise your paper to highlight this boundary rather than trying to bridge it with exploitability arguments, as doing so allows you to preserve the strength of the Dutch-book theorem without committing yourself to the implausible claim that scientific progress is inherently irrational.

  I hope this helps you disentangle the argument. It is a clever trap, but it relies on treating the language of science as fixed when the history of science shows it is fluid. Once you lock down the semantic precondition for the Dutch book, the trap springs open.

  Best regards.
