answer: |-
  ### Exam Question: Metaphysics of Supertasks (45 Minutes)
  **Total Marks: 20**

  **Question:**
  Consider Thomson's Lamp: a lamp is toggled on/off at $t=1/2, 3/4, 7/8 \dots$, completing infinitely many switches by $t=1$. The standard Benacerrafian response is that the switching sequence fails to determine the lamp's state at $t=1$, so there is nothing more to say. This seminar requires you to move beyond this assertion. Answer the following three parts, and conclude with a definitive verdict on the metaphysical status of the lamp.

  **(a) Persistence and Observation (5 marks)**
  Stipulate that no switching occurs after $t=1$, and that at $t=2$ the lamp is observed to be **OFF**. Does this observation settle the lamp's state at $t=1$? If yes, explain how this refutes the claim that the question has no answer. If no, identify the specific metaphysical principle blocking the inference from $t=2$ back to $t=1$.

  **(b) Convergent Quantities (5 marks)**
  The proportion of elapsed time the lamp spends switched on during the interval $[0, 1)$ is given by a geometric series converging to $1/2$. Some argue this implies the lamp is "half-on" or that the state is determined by this limit. Explain precisely what this time-average establishes and why it fails to fix the instantaneous state at $t=1$.

  **(c) Causal Completion (5 marks)**
  Suppose the lamp is wired to a controller programmed to default to **OFF** if the input signal has not settled by $t=1$. Does this stipulation dissolve the original puzzle, or does it merely redescribe the problem? Explain what this shows about whether the original puzzle concerned the lamp's state or the possibility of completing infinitely many tasks.

  **(d) Verdict (5 marks)**
  Based on your analysis above, commit to one of the following four positions and justify it:
  1. The supertask is metaphysically impossible.
  2. The question regarding the state at $t=1$ is ill-formed.
  3. The lamp has no determinate state at $t=1$.
  4. There is a determinate state which the initial description simply does not entail.

  ***

  ### Model Answer (Verdict: Position 4)

  The standard claim that "there is nothing more to say" regarding Thomson's Lamp conflates logical under-determination with metaphysical indeterminacy. A rigorous analysis of persistence, convergence, and causal completion demonstrates that the lamp's state at $t=1$ is determinate, but the original description is causally incomplete. Therefore, Position 4 is correct: there is a determinate state which the initial description simply does not entail.

  Regarding **(a) Persistence**, the observation at $t=2$ does settle the state at $t=1$, provided we accept the principle of temporal continuity for macroscopic objects. If the lamp is off at $t=2$ and no switching event occurs in the interval $(1, 2]$, the state at $t=1$ must also be off. To deny this is to claim an object can change state without a cause in the interval of change. The "no answer" claim relies on the idea that the state at $t=1$ is logically isolated from $t>1$. However, physical objects persist through time. If the description of the supertask leaves the state at $t=1$ open, but physical continuity requires it to match $t=1+\epsilon$, then the *physics* determines what the *logic* of the switching sequence does not. The observation refutes the "no answer" claim by showing that extra-descriptive facts (persistence laws) fix the value.

  Regarding **(b) Convergent Quantities**, the time-average converging to $1/2$ is a category error when applied to instantaneous state. The limit of the proportion of time on is a property of the *interval* $[0, 1)$, not the *point* $t=1$. The lamp is a binary device; "half-on" is not a state it can occupy. This convergence establishes a macroscopic statistical fact about the history of the lamp, but it leaves the microscopic ontological status at the limit point untouched. Students who argue the average fixes the state confuse the integral of a function with its value at a point. A function can be discontinuous at a limit even if its average converges. Thus, the geometric series provides no metaphysical leverage on the binary switch status.

  Regarding **(c) Causal Completion**, the controller stipulation does not dissolve the puzzle; it redescribes the physical laws governing the lamp. By adding a default condition, we are no longer discussing Thomson's original setup, which was causally gappy. The original puzzle arises because the causal history is exhausted before $t=1$, leaving no cause for the state *at* $t=1$. The controller supplies a new causal law that operates specifically at the limit. This shows that the original puzzle was not about the logical impossibility of the sequence, but about the incompleteness of the causal description. If adding a law fixes the state, the indeterminacy was epistemic (due to missing laws), not ontological.

  **Verdict:**
  I defend Position 4. The failure of the switching sequence to entail a state does not imply the state is indeterminate (Position 3), nor that the task is impossible (Position 1). It implies the description is incomplete. Position 2 is incorrect because the question is well-formed; we understand what "on" and "off" mean at $t=1$. The error in the standard view is inferring metaphysical indeterminacy from descriptive under-determination. As shown in (a), physical principles can fix the state where logic does not. As shown in (c), adding causal laws resolves the gap without negating the supertask. The lamp must be either on or off; the fact that the toggle sequence doesn't tell us which is a failure of the narrative, not the world. The supertask is possible, but it requires a physics that handles limit-points, which the original thought experiment deliberately omitted.

  ***

  ### Marking Scheme

  **Total: 20 Marks**

  **Part (a) Persistence (5 Marks)**
  *   **3 Marks:** Correctly identifies that physical continuity/persistence links $t=1$ to $t=2$. Argues that without a switching event in $(1, 2]$, the state cannot change.
  *   **2 Marks:** Explains that this refutes the "no answer" claim by introducing extra-descriptive physical facts.
  *   **Penalty:** Deduct 3 marks if the candidate claims the observation is irrelevant because the state at $t=1$ was already "unsettled" (fails to grasp continuity).

  **Part (b) Convergence (5 Marks)**
  *   **3 Marks:** Identifies the category error: Time-average (interval property) $\neq$ Instantaneous State (point property).
  *   **2 Marks:** Explicitly rejects "half-on" as a valid state for a binary lamp.
  *   **Penalty:** Deduct 4 marks if the candidate argues the convergent series *does* help determine the state (e.g., via probabilistic or fuzzy logic arguments).

  **Part (c) Completion (5 Marks)**
  *   **3 Marks:** Identifies the controller as a *new* causal law/stipulation, not a solution to the original logical gap.
  *   **2 Marks:** Explains this shows the original puzzle was about causal completeness, not logical possibility.
  *   **Penalty:** Deduct 3 marks if the candidate claims the controller "solves" the paradox without acknowledging it changes the setup (redescription).

  **Part (d) Verdict (5 Marks)**
  *   **5 Marks:** Commits to Position 4 (Determinate but under-described). Justification relies on the distinction between logical entailment and physical determination established in (a)-(c).
  *   **3 Marks:** Commits to Position 1 or 3 but provides a consistent argument based on the previous parts.
  *   **Penalty:** Deduct 5 marks (Zero for this section) if the candidate infers the impossibility of the supertask *solely* from the failure of the description to entail an answer (The "Benacerraf Error").

  **Specific Errors to Catch (Global Penalties)**
  *   **The Benacerraf Error:** Inferring metaphysical impossibility from descriptive under-determination. (Costs up to 5 marks).
  *   **The Average Fallacy:** Treating the convergent time-average as fixing the instantaneous state. (Costs up to 4 marks).
  *   **The Continuity Blindspot:** Dismissing the $t=2$ observation as irrelevant because $t=1$ is "isolated." (Costs up to 3 marks).
  *   **The Stipulation Confusion:** Treating the default controller as a solution to the original puzzle rather than a change in physical laws. (Costs up to 3 marks).
  *   **Additional Error:** Conflating epistemic uncertainty (we don't know) with metaphysical indeterminacy (there is no fact). (Costs 2 marks).

  **B-Grade Characterization**
  Possesses the correct vocabulary (supertask, limit, entailment) and identifies the standard positions, but fails to structurally distinguish between logical under-determination and physical indeterminacy, ultimately hedging the verdict.
