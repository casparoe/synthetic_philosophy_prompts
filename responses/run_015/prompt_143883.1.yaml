answer: |-
  # THE ADJUDICATION OF LOSS PROTOCOL (ALP)
  **For use by Duty Moderators. Time limit: 15 minutes. Page limit: 1.**

  **Purpose:** To determine if a legal act under the Charter has generated a compensable loss. This procedure does not judge the legality of the act (Charter Compliance is assumed). It judges the *consequence*.

  **GATE 1: INSTANTIATION**
  *Question:* Did the lost entity possess a Ledger ID at the time of the incident?
  *   **Yes:** Proceed to Gate 2. (Includes Objects and Active Characters).
  *   **No:** **STOP.** Ruling: *No Compensable Loss.*
      *   *Note:* Prose-only constructs (cities, histories, relationships without Ledgered tokens) are ephemeral. Their removal is Grief, not Loss. The engine cannot adjudicate imagination.

  **GATE 2: CUSTODY**
  *Question:* Was the complainant the legal Holder of the Ledger ID at the time of the incident?
  *   **Yes:** Proceed to Gate 3.
  *   **No:** **STOP.** Ruling: *No Standing.*
      *   *Check:* Verify absence logs. Under the Charter, absence >4 years without succession transfers custody to the Harbour. Former holders cannot claim loss for property they had already forfeited.

  **GATE 3: THE SUBSTITUTION TEST**
  *Question:* Ask the complainant: "If the engine generated a duplicate with identical description and stats today, would you consider the debt paid?"
  *   **Yes:** **STOP.** Ruling: *Commodity Loss.*
      *   *Note:* This confirms Description-Parity. The player values the qualities, not the history. No unique loss occurred.
  *   **No:** Proceed to Gate 4.
      *   *Note:* This confirms Provenance-Dependence. The specific history/chain of custody is the asset.

  **GATE 4: REVERSIBILITY**
  *Question:* Can the engine restore the state without violating the permanence of Gaps or Time?
  *   **Yes (e.g., Temporary Binding):** Ruling: *Loss Confirmed. Remedy: Restoration or Time-Credit.*
  *   **No (e.g., Unmaking/Gaps):** Ruling: *Loss Confirmed. Remedy: Compensation.*
      *   *Note:* Gaps are permanent. A Ledger entry once deleted cannot be restored. Do not promise restoration. Offer equivalent value (currency, favour, new instantiation).

  **GATE 5: THE VALUE JUDGMENT (Human Discretion)**
  *Instruction:* If Gates 1–4 are passed, the Moderator must assign a value to the loss.
  *   *Constraint:* You cannot value "fun" or "story." You value *scarcity*.
  *   *Action:* Consult the Story Lead if the compensation requires creating a new Ledger entry of significant power. Otherwise, authorize standard compensation pools.
  *   *Warning:* This step is not procedural. It is a judgment call. Record your reasoning for appeal.

  ***

  # APPLICATION TO CASES

  **Case One: The Ship**
  *   **Gate 1 (Instantiation):** **Pass.** The ship had a Ledger ID.
  *   **Gate 2 (Custody):** **Mixed.** The two holders absent for six years **Fail**. Under the Charter, custody had passed to the Harbour. They have no standing. The active holders **Pass**.
  *   **Gate 3 (Substitution):** **Pass.** A new ship is not the palimpsest of the old. The complainants reject a copy. Provenance is established.
  *   **Gate 4 (Reversibility):** **Fail.** Unmaking creates Gaps. Gaps are permanent. The specific entry cannot be restored.
  *   **Ruling:** Loss Confirmed for active holders. Remedy is Compensation (not Restoration). The destroyer owes a debt to the active former holders, not the inactive ones. The Harbour (current owner) absorbed the loss of the asset, but the history was stolen from the contributors.
  *   **Outcome:** The destroyer must compensate the active former holders for the loss of the *history*, distinct from the *hull*.

  **Case Two: The Binding**
  *   **Gate 1 (Instantiation):** **Pass.** A Character is a Ledgered entity (unique ID, creation timestamp, history).
  *   **Gate 2 (Custody):** **Pass.** The player holds their own character.
  *   **Gate 3 (Substitution):** **Pass.** A new character is not the same life. The player rejects starting over.
  *   **Gate 4 (Reversibility):** **Pass (Partial).** The character is not unmade (no Gaps). However, the *time* is lost. Time is irreversible.
  *   **Ruling:** Loss Confirmed. The Charter permits the *act*, but not the *erasure of consequence*. The faction exercised a legal right that consumed the player's resource (Time).
  *   **Outcome:** The binding faction owes a debt. Not for the binding itself, but for the consumption of the player's continuity. Remedy: Time-credit or equivalent narrative advantage to offset the nine days.
  *   **Note:** This validates your intuition. The procedure distinguishes between "Legal Act" and "Costless Act."

  **Case Three: The City**
  *   **Gate 1 (Instantiation):** **Fail.** No Ledger entry. "Never instantiated."
  *   **Ruling:** **Stop.** No Compensable Loss.
  *   **Outcome:** The player experienced Grief, not Loss. The world's physics did not break; a prose construct was retconned. To rule otherwise is to claim the engine is responsible for all imagination. This protects the moderators from having to adjudicate the deletion of dreams that never touched the mechanics.
  *   **Distinction:** Case One tracks Loss (mechanical destruction of a persistent ID). Case Three tracks Grief (emotional attachment to ephemeral text). The Procedure treats them differently.

  ***

  # CONFIDENCE ASSESSMENT

  **High Confidence:**
  *   **Gate 1 (Instantiation):** This is the bedrock. Distinguishing Ledgered objects from prose is an objective binary check in the database. It cleanly separates Case 1 from Case 3.
