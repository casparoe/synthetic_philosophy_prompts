answer: |-
  ### The Hobbesian Stack: A Technical Restatement

  Thomas Hobbes posits that reasoning is not a mystical faculty but a deterministic computation over symbols. In your vocabulary, human cognition functions as a **deterministic state machine** where 'thinking' is merely the arithmetic of names: adding concepts to form propositions and subtracting them to derive conclusions. He calls this 'reckoning'. For Hobbes, truth is not a property of the external world discovered via observation, but a property of the consistency of these symbolic operations.

  Consequently, geometry stands as the only successful **programme** of knowledge because it is the only domain where the **type signatures** are defined by the reasoner rather than discovered in noisy reality. When a geometer defines a 'line', they are declaring a primitive type with strict constraints. Because the developer (the geometer) constructs the figure synthetically from these primitives, the **semantics** are fully known at compile time. There is no runtime ambiguity. The proof is simply a **build pipeline** that verifies the construction adheres to the initial type definitions. If the definitions are precise, the conclusion follows via **formal verification**; if the logic holds, the system cannot throw an exception.

  Hobbes argues that civil philosophy (politics) fails because it operates like a legacy codebase with undocumented dependencies and ambiguous schemas. Political disputes arise because agents use terms like 'justice' or 'sovereignty' without agreed-upon **type signatures**. This leads to **compilation errors** in social coordination—conflicts that arise not from hardware failure, but from semantic drift. To fix this, Hobbes proposes applying the geometric method to politics: one must define the primitive types (Man, Motion, Right) rigorously and construct the Commonwealth synthetically from them.

  Crucially, Hobbes insists these definitions must refer to 'bodies in motion'. You cannot define a type that does not map to a concrete state in the runtime environment. Abstract universals are void pointers; they reference nothing. For a proposition to be scientifically valid, the terms must denote material entities capable of causal interaction. Therefore, a valid political theory must be grounded in the physics of human bodies and their movements, not in Platonic ideals. The sovereign is not an abstract concept but an artificial person constructed from the authorised actions of real bodies.

  ### Residue Report: Mapping Fidelity

  Here is the analysis of how well Hobbes's ontology maps onto software engineering concepts, categorised by fidelity.

  #### 1. Clean Mappings
  *   **Reasoning as Computation:** This maps cleanly to symbolic logic and type theory. The idea that valid inference is a mechanical process of manipulating symbols according to rules is the foundational premise of computer science. Hobbes's 'reckoning' is effectively an early description of algorithmic processing.
  *   **Definitions as Type Signatures:** The requirement for precise definitions before reasoning begins is identical to strict typing. Just as a compiler rejects code where a function receives an integer instead of a string, Hobbes rejects arguments where terms are used ambiguously.
  *   **The Synthetic Method as Composition:** Hobbes's insistence on building complex truths from simple definitions mirrors functional composition. You define primitive types and compose them into complex structures, ensuring validity at each layer of the stack.
  *   **Political Conflict as Compilation Errors:** Viewing social dispute as a failure of semantic agreement rather than moral failing is a robust analogy. It frames politics as a coordination problem solvable via schema agreement rather than persuasion.

  #### 2. Distorted Translations
  *   **Construction vs. Declaration:** In geometry, Hobbes emphasises that we *make* the figures. In software, we often *declare* types without instantiating them. Hobbes requires the object to be generatable. In code, a type can exist without any inhabited values (an empty type). For Hobbes, a definition without a constructible referent is nonsense. This distorts the mapping: in code, syntax can exist independently of semantics; for Hobbes, valid syntax requires semantic grounding in construction.
  *   **Determinism in State Machines:** Hobbes assumes human reasoning is perfectly deterministic if definitions are fixed. However, human agents are non-deterministic state machines with internal hidden state and side effects that cannot be fully inspected. Treating humans as pure functions of their defined interests is a distortion that ignores psychological complexity and irrationality.
  *   **The Build Pipeline:** In software, the build pipeline is separate from the runtime. For Hobbes, the 'proof' of politics is continuous execution. The Commonwealth must be constantly maintained by the motion of bodies. The separation between 'verification' and 'execution' is blurrier in Hobbes's materialism than in software engineering.

  #### 3. No Counterpart
  *   **Materialist Ontology:** This is the largest gap. Software engineering is agnostic about the substrate. A program behaves the same whether running on silicon, vacuum tubes, or a theoretical Turing machine. Hobbes insists that truth is contingent on the object being a 'body'. He rejects abstract existence entirely. There is no counterpart in SE for the claim that 'if it cannot be touched or moved, it does not exist'. In code, abstract classes exist perfectly well without concrete instantiation.
  *   **Causal Necessity of Motion:** Hobbes believes every mental event is literally physical motion in the brain. While we model neural networks, SE does not require the bits to have physical mass to be valid. Hobbes's science is physics first, logic second; SE is logic first, physics second.

  ### The Materialism Constraint: Code vs. Matter

  You asked whether Hobbes's insistence that geometric objects must be physically constructible bodies survives translation into code, or if it reveals a flaw in the 'code is law' intuition.

  It reveals a flaw.

  In software engineering, we often operate under the intuition that if the logic compiles, the system is valid. This is 'code is law'. Hobbes would argue this is a category error. For Hobbes, a geometric proof is valid not merely because the syntax is correct, but because the engineer can physically generate the figure in space. The truth is grounded in the *capacity to make*.

  When you translate this to politics via code (e.g., smart contracts or algorithmic governance), you encounter the 'bodies in motion' problem. You can define a 'Sovereign' type in your code with perfect type safety. You can verify the logic formally. But if that code does not command physical bodies (police, servers, energy grids, humans) to move in accordance with its logic, it is, in Hobbesian terms, nonsense. It is a definition without a referent.

  Hobbes's materialism survives translation only if you acknowledge that code is not the law; code is merely the specification. The 'law' is the enforcement mechanism—the physical capacity to constrain bodies. If your software defines a property right but lacks a physical enforcement layer (a court, a server admin, a gun), the definition is void.

  Therefore, your intuition that 'it is basically code is law if you compile it right' misses the spatial and material constraint. Hobbes would argue that geometry works because the geometer controls the space in which the line is drawn. Politics fails because no single agent controls the space of human motion. To make politics scientific, you must not just compile the code; you must architect the physical enforcement layer that ensures the state machine transitions actually occur in matter. Without the 'bodies in motion', your political software is merely a document, not a science.
