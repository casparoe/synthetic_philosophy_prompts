prompt: |-
  I'm preparing a close-reading seminar on William Golding's *Lord of the Flies* and I want to run it through David Lewis's account of conventions — the one developed in *Convention*, where a convention is a regularity that solves a coordination problem, is arbitrary in the sense that the opposite regularity would have solved the problem just as well, and holds because each participant expects the others to follow it and knows that they expect it too, so it is sustained by mutual expectation and common knowledge rather than by any intrinsic merit of the particular regularity. I want to test that account against the novel and see where it illuminates, where it strains, and where the book resists being read this way.

  Start with the conch. When the boys gather and it becomes the token of the right to speak, it looks like a textbook convention: the particular sound is arbitrary (any signal would do), its force comes entirely from the shared expectation that everyone will honor whoever holds it, and it solves a real coordination problem (who gets a turn to talk when everyone is talking). Walk through whether the conch actually satisfies Lewis's conditions — especially the arbitrariness condition and the requirement that it be held by mutual expectation — and whether it is a convention in Lewis's technical sense or something else: a custom, a piece of theater, a claim to authority, or a habit that only looks like a convention.

  Then push on the rest of the island's order — the assembly, the signal fire, the early, earnest insistence on rules — and ask whether these form a stable convention or are already failing Lewis's test from the start (held by mutual expectation, or by the charisma of whoever is leading, or by fear?). The central question for me: the conch is eventually smashed, and the order it sustained has broken down into the hunt and the killings of Simon and Piggy. Lewis's account treats conventions as stable equilibria that persist as long as the mutual expectations hold; but the novel is essentially a story about a convention dying. Does that mean the boys' order was never a convention in Lewis's sense to begin with, or does it show something the account underplays — that conventions are fragile, that the underlying coordination problem can re-open, and that a convention can be overthrown rather than merely going out of fashion?

  Finally, the ending: the naval officer arrives, the boys weep, and the adult world reasserts its own conventions — uniforms, rank, the rules of civilization — as if they were natural. I want a reading that takes seriously whether the novel is making a genuinely Lewisian point here (that all conventions, including the officer's, are arbitrary and sustained only by mutual expectation, so the island's collapse was no more a catastrophe than the officer's world is a triumph) or whether it is doing something else entirely (diagnosing a darkness in human nature that conventions merely paper over) and forcing it into the convention frame distorts it.

  Give me the honest critic's verdict rather than a tidy illustration: where the Lewisian reading genuinely illuminates a scene or a choice, where it has to be strained to fit, and what the novel adds to the question of how conventions arise and hold that the argument in *Convention* alone does not. I'm teaching this to a mixed group of philosophy and literature students, so I'd rather have the places where the reading breaks flagged than papered over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** A close-reading seminar on William Golding's *Lord of the Flies* through the lens of David Lewis's *Convention* (1969).
      *   **Core Task:** Test Lewis's account of conventions (regularity, coordination problem, arbitrariness, mutual expectation/common knowledge) against the novel.
      *   **Key Focus Areas:**
          1.  The Conch (Is it a Lewisian convention? Arbitrariness? Mutual expectation?).
          2.  The Island's Order (Assembly, fire, rules: Stable convention or failing from the start? Charisma/Fear vs. Expectation?).
          3.  The Breakdown (Conch smashing, killings: Does this refute Lewis's stability claim? Can conventions be overthrown?).
          4.  The Ending (Naval Officer: Lewisian relativism vs. Golding's moral realism/darkness).
      *   **Tone/Style:** "Honest critic's verdict." No tidy illustrations. Flag where the reading breaks. Suitable for mixed philosophy/literature students.
      *   **Goal:** Illuminate where Lewis fits, where he strains, and what Golding adds to the philosophy of conventions.

  2.  **Deconstruct David Lewis's *Convention*:**
      *   *Definition:* A regularity $R$ in behavior among a population $P$ in a recurrent situation $S$.
      *   *Conditions:*
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on condition that others do (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the problem just as well (Arbitrariness).
          5.  Common knowledge (everyone knows 1-4, everyone knows everyone knows, etc.).
      *   *Nature:* Conventions are self-perpetuating equilibria. They don't need enforcement *per se*, just aligned expectations. They are distinct from commands or laws backed by threat.

  3.  **Deconstruct *Lord of the Flies* (Relevant Aspects):**
      *   *The Conch:* Establishes order initially. Ralph blows it, boys gather. Rule: Holder speaks.
      *   *The Breakdown:* Jack challenges the conch ("Conch doesn't count on this side of the island"). Fear of the Beast supersedes the rule.
      *   *The Violence:* Simon and Piggy killed. Conch shattered.
      *   *The Rescue:* Naval officer. Adult order returns. Ralph weeps for "end of innocence."

  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the ambition. Lewis is game-theoretic/rationalist; Golding is mythic/psychological. This tension is the seminar's engine.

      *   **1. The Conch: Convention or Totem?**
          *   *Lewisian Fit:* It solves a coordination problem (cacophony vs. order). It is arbitrary (could have been a stick, a hand raise). It relies on expectation (boys wait because they expect others to wait).
          *   *The Strain:* Lewis assumes rational agents preferring coordination. The boys *initially* prefer it, but is it *common knowledge*? Jack's early compliance is grudging.
          *   *Crucial Distinction:* Lewisian conventions don't usually need physical enforcement. The conch gains a quasi-magical/authoritative status ("The conch doesn't count"). It shifts from a *convention* (we do this because we expect each to) to a *symbol of authority* (we do this because Ralph says so / because it's "civilized"). When the authority wanes, the convention collapses. Lewis doesn't account well for the *symbolic weight* that exceeds utility.
          *   *Verdict:* It starts as a convention but morphs into a fragile norm dependent on moral buy-in, which Lewis treats as secondary to equilibrium.

      *   **2. The Order: Equilibrium or Precarious Truce?**
          *   *Lewis's View:* Conventions are stable equilibria. If everyone expects it, it persists.
          *   *Golding's View:* The "coordination problem" changes. Initially: "How do we talk?" Later: "How do we survive/be saved?" vs. "How do we hunt/feel safe?"
          *   *The Strain:* Lewis assumes the *same* coordination problem persists. Golding shows the *problem itself* fragments. The fire (rescue) vs. Meat (hunting). These are competing coordination equilibria. Jack offers a *rival convention* (hunt/feast) that solves a *different* coordination problem (fear/hunger) more effectively than Ralph's (hope/order).
          *   *Fear vs. Expectation:* Lewis minimizes coercion. Jack's tribe runs on fear and primal bonding, not just mutual expectation of utility. This violates Lewis's "preference to conform" condition for the *original* convention. They don't prefer Ralph's rule anymore; they prefer Jack's rule.
          *   *Verdict:* Lewis explains the *existence* of the order, but not its *fragility* in the face of competing equilibria driven by emotion rather than utility.

      *   **3. The Breakdown: Dying Convention or Shattered Contract?**
          *   *Lewis:* Conventions fade when expectations fade (e.g., driving on the left vs. right doesn't just stop, it switches).
          *   *Golding:* The conch is *smashed*. This is violent destruction, not just drift.
          *   *The Insight:* Lewis treats conventions as self-enforcing. Golding shows conventions require a *moral substrate* (Piggy) to survive when utility dips. When the "Beast" (internal fear) enters, the rational calculation changes.
          *   *Verdict:* Golding challenges Lewis's rationality assumption. Conventions aren't just about expectations; they are about *trust*. When trust breaks (Simon's death), the convention cannot hold even if the utility remains. Lewis underestimates the emotional/psychological cost of maintaining a convention.

      *   **4. The Ending: The Officer and the "Real" World.**
          *   *Lewisian Reading:* The Officer represents another convention (uniforms, rank). It is equally arbitrary. The island wasn't "savage," just a different equilibrium. The weeping is realizing the arbitrariness of all order.
          *   *Golding's Intent:* Golding is not a relativist. The officer's world is *also* at war (nuclear war implied). But Golding sees the island's collapse as a *moral failure*, not just a shift in equilibrium. The "darkness of man's heart" is not a convention; it's the thing *under* the convention.
          *   *The Strain:* Forcing Golding into Lewis makes the tragedy banal. If the officer's order is just another convention, Ralph's weeping is just confusion. But Ralph weeps for *goodness* lost.
          *   *Verdict:* This is where the reading breaks most. Lewis describes *how* order holds; Golding asks *why* it matters. Lewis is descriptive; Golding is normative/mythic.

      *   **5. Synthesis/Teaching Points:**
          *   Where Lewis shines: Explaining the *initial* emergence of the conch rule without a sovereign.
          *   Where Lewis fails: Explaining the *collapse*. Lewis assumes rational stability; Golding posits irrational destruction.
          *   What Golding adds: Conventions require more than expectation; they require the suppression of instinct. They are thin veneers.

  5.  **Refining the Tone:**
      *   Avoid saying "Lewis is wrong." Say "Lewis's framework assumes X, while Golding dramatizes Y."
      *   Ensure the distinction between *coordination problem* (Lewis) and *prisoner's dilemma/moral conflict* (Golding) is clear. Lewis's conventions solve coordination (we both want to coordinate). Golding's boys often face conflict (I want power, you want safety).
      *   Highlight the "Arbitrariness" condition. Is the conch *really* arbitrary to the boys? It becomes sacred. That violates arbitrariness.

  6.  **Final Review against Prompt:**
      *   Did I cover the conch? Yes.
      *   Did I cover the rest of the order? Yes.
      *   Did I cover the breakdown/death of convention? Yes.
      *   Did I cover the ending/officer? Yes.
      *   Is it an "honest critic's verdict"? Yes, highlighting fractures.
      *   Is it suitable for philosophy/lit students? Yes, balances technical definitions with textual analysis.

  7.  **Final Polish:** (Self-Correction during drafting) *Make sure not to get too bogged down in game theory jargon. Keep it accessible but precise. Ensure the distinction between 'convention' and 'norm' is clear, as Lewis is specific about conventions.* *Emphasize that Lewis's conventions are self-policing, whereas the conch eventually needs Piggy to defend it verbally, then fails physically.*

  8.  *(Drafting the response based on these thoughts...)*
answer: |-
  This is a provocative pairing. David Lewis's *Convention* (1969) is a work of analytic philosophy grounded in game theory and rational choice; *Lord of the Flies* (1954) is a moral fable grounded in psychology and myth. Lewis is interested in how order *emerges* from chaos without a sovereign; Golding is interested in how order *decays* into chaos despite a sovereign.

  For a seminar, this tension is fertile ground. However, you must warn your students immediately: Lewis describes a world of rational agents seeking coordination; Golding describes a world of emotional agents seeking power and safety. Where Lewis sees equilibrium, Golding sees fragility.

  Here is an honest critic's verdict on where the Lewisian reading illuminates the text, where it strains, and where the novel resists the framework entirely.

  ---

  ### 1. The Conch: Convention, Totem, or Command?

  **The Lewisian Fit:**
  Initially, the conch looks like a textbook Lewisian convention.
  *   **Coordination Problem:** The boys are talking over one another (cacophony). They need a regularity to ensure turn-taking.
  *   **Arbitrariness:** As you noted, it could have been a raised hand, a specific rock, or a whistle. The shell itself has no intrinsic power to silence people.
  *   **Mutual Expectation:** Ralph blows it, they gather. Ralph says, "He can hold it when he's speaking." The boys comply because they expect the others to comply. If Jack thought the others would ignore the conch, he would ignore it too.

  **The Strain:**
  Lewis's account relies on the condition that the regularity is *arbitrary* in the sense that the agents are indifferent between $R$ (conch) and $R'$ (stick), provided everyone picks the same one. But very quickly, the conch ceases to be arbitrary for the boys. It accrues **sacred value**.

  By Chapter 2, the conch isn't just a tool for coordination; it is a symbol of "grown-up" authority. Piggy says, "We can use this to call the others. Have a meeting." It becomes a *norm* backed by moral weight, not just a *convention* backed by utility. Lewis distinguishes conventions from norms enforced by sanctions or moral pressure. The conch drifts into the latter. When Jack says, "The conch doesn't count on this side of the island," he isn't just proposing a new equilibrium; he is desecrating a totem.

  **Verdict:** The conch starts as a Lewisian convention but mutates into a **symbolic authority**. Lewis's framework cannot easily account for why the *specific* regularity matters so much once it is established. For Lewis, if everyone agreed to switch to a red flag tomorrow, the convention would hold. For Golding, switching from the conch to a spear is a moral catastrophe, not a neutral coordination shift. The seminar should ask: *Does the conch work because of mutual expectation (Lewis), or because the boys are projecting their desire for adulthood onto it (Golding)?*

  ### 2. The Island's Order: Stability or Precarious Truce?

  **The Lewisian Fit:**
  Lewis argues conventions are self-policing equilibria. You don't need a police force to drive on the left in England; you do it because you expect others to do it. Early on, the assembly and the fire function this way. The boys tend the fire because they expect the others to tend it, and they all want rescue.

  **The Strain:**
  Lewis assumes the **coordination problem remains constant**. In *Lord of the Flies*, the problem fragments.
  *   **Ralph's Equilibrium:** Coordination around *Rescue* (Fire + Conch).
  *   **Jack's Equilibrium:** Coordination around *Safety/Hunting* (Masks + Meat + Dance).

  Lewis's theory struggles to explain why one equilibrium collapses into the other. In a pure Lewisian model, if the "Fire" convention stops working (e.g., the fire goes out), the agents should simply coordinate on a new solution to the *same* problem (Rescue). But Jack isn't solving the Rescue problem; he is solving a *different* problem (Fear and Hunger).

  This reveals a limitation in Lewis: he models conventions as solutions to coordination problems (where interests align), but Golding presents **conflict problems** (where interests diverge). Jack doesn't just want to coordinate; he wants to dominate. When the boys defect to Jack's tribe, they aren't merely shifting conventions; they are changing their utility functions. They value meat and safety from the "Beast" more than rescue.

  **Verdict:** Lewis illuminates the *mechanism* of the early order (mutual expectation), but he cannot explain the *competition* between orders. The novel suggests that conventions are not just about solving coordination problems; they are about **suppressing competing desires**. Lewis assumes rational agents prefer coordination; Golding suggests humans often prefer domination or catharsis over coordination.

  ### 3. The Breakdown: Can a Convention Be Murdered?

  **The Lewisian Fit:**
  Lewis acknowledges conventions can disappear if expectations fade (e.g., a language dies out). If I expect you to ignore the conch, I will ignore it. The smashing of the conch signals the total collapse of the expectation that anyone will honor it.

  **The Strain:**
  For Lewis, the death of a convention is usually a matter of **drift** or **obsolescence**. It goes out of fashion. In *Lord of the Flies*, the convention is **violently destroyed**. Piggy is killed *holding* the conch.

  This is the critical fracture point for your seminar. Lewis's account is bloodless. It treats conventions as abstract equilibria. Golding treats the conch as a physical embodiment of a social contract that requires *defense*.
  *   **Lewis:** Conventions persist because it is in everyone's interest to follow them given that others do.
  *   **Golding:** Conventions persist only as long as the "civilized" impulse is stronger than the "savage" impulse.

  When Roger leans on the lever, he isn't just opting out of a convention; he is destroying the possibility of that convention returning. Lewis's theory implies that if the boys survived and wanted to talk again, they could reinstate the conch convention easily. Golding implies the *capacity* for that convention is gone. The "darkness of man's heart" is a permanent barrier to certain conventions.

  **Verdict:** The novel shows that conventions are not just self-sustaining expectations; they are **fragile constructs requiring moral maintenance**. Lewis underplays the cost of maintaining a convention. For Ralph and Piggy, maintaining the convention requires courage and moral fortitude. For Lewis, it only requires rationality. The smashing of the conch proves that a convention can be overthrown by force, not just abandoned by consensus.

  ### 4. The Ending: The Officer and the Relativism Trap

  **The Lewisian Reading:**
  A strict Lewisian reading of the ending is deeply relativist. The naval officer represents a new population ($P_{adults}$) with their own conventions (uniforms, rank, saluting). These are just as arbitrary as the conch. The officer's world is also at war (the cruiser implies a global conflict). Therefore, the island's collapse was not a moral tragedy, just a shift from one arbitrary equilibrium to another. Ralph's weeping is the realization that all order is contingent.

  **The Golding Reading:**
  Golding is not a relativist. He is a moral realist. The officer's arrival is not a triumph of "better" conventions; it is an ironic rescue from one hell into another. However, Golding insists that the *loss* on the island was real. The death of Piggy and Simon matters.
  *   If you force the Lewisian reading here, you risk **flattening the tragedy**. If the officer's order is just another convention, then Ralph's grief for the "end of innocence" is merely grief for the loss of a specific set of rules.
  *   But Golding suggests the boys have lost something *intrinsic*, not just a set of expectations. They have lost their humanity.

  **Verdict:** This is where the reading breaks most significantly. Lewis describes *how* order functions; Golding diagnoses *why* order matters. Lewis's framework is descriptive; Golding's is normative. To apply Lewis to the ending is to suggest the officer's world is no "better" than Jack's, merely more stable. Golding would likely agree the officer's world is flawed (nuclear war), but he would insist that the *rule of law* (officer) is morally superior to the *rule of force* (Jack), whereas Lewis sees both as coordination equilibria.

  ### Seminar Strategy: The "Honest Critic's Verdict"

  For your mixed group, I recommend structuring the tension around three specific friction points:

  1.  **Rationality vs. Instinct:** Lewis assumes agents want to coordinate. Golding shows agents who want to hunt. *Question:* Can a Lewisian convention exist if the population's preferences are irrational or self-destructive?
  2.  **Arbitrariness vs. Sanctity:** Lewis says the specific rule doesn't matter. Golding shows the conch becoming sacred. *Question:* Does a convention stop being a convention once it acquires symbolic/moral weight?
  3.  **Stability vs. Fragility:** Lewis sees conventions as stable equilibria. Golding sees them as thin veneers over violence. *Question:* Does Lewis's account ignore the *energy* required to maintain a convention against the pull of chaos?

  **What Golding Adds to Lewis:**
  Lewis gives us the *mechanics* of the conch (mutual expectation). Golding gives us the *metaphysics* of the conch (it requires belief). Golding suggests that conventions are not just about solving coordination problems; they are about **keeping the beast at bay**. The "Beast" is the state of nature where no conventions hold. Lewis explains the game; Golding explains the stakes.

  **Where the Reading Breaks:**
  Do not let the students paper over the violence. If the conch is just a convention, smashing it is like changing the traffic law. In the novel, smashing it is murder. Lewis's theory has no category for **sacrilege**. It has no category for the *evil* that actively seeks to destroy coordination for the sake of power.

  **Final Takeaway for the Class:**
  Use Lewis to explain *how* the boys built the society (Chapter 1-2). Use the breakdown of Lewis's conditions to explain *why* it fell apart (Chapter 8-11). When the mutual expectation becomes fear, and the arbitrariness becomes sacred, and the coordination problem becomes a war, Lewis's map no longer matches Golding's territory. That mismatch is where the philosophy meets the literature.
