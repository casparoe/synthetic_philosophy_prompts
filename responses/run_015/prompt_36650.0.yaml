      *   **The Cousin's Dilemma:** This is a classic challenge to supererogation. It resembles the "Paradox of Supererogation" (often associated with utilitarianism or deontological struggles).
          *   Horn 1: If $X$ is better than $\neg X$, then $X$ is obligatory. (Maximizing principle).
          *   Horn 2: If $X$ is not better, why praise it?
          *   Conclusion: "Better but optional" is incoherent.
      *   **The Aunt's Position:** Similar to the Cousin but focuses on the social sanction aspect. If it's optional, you can't disapprove. If you disapprove, it's not optional.
      *   **The Older Sister's Position:** Defends the standard view of supererogation. Praise implies going *above* the call of duty.
      *   **The Conflict:** The tension between *maximizing consequentialism* (do the best thing) vs. *common-sense morality* (some things are optional sacrifices).

  3.  **Evaluate the Arguments (Move-by-Move):**

      *   *Cousin's Dilemma:* It sounds logical but relies on a specific ethical framework (Act Utilitarianism). It assumes "Ought implies Can" and "Better implies Ought." Most non-utilitarians reject "Better implies Ought." So, it's not airtight; it's premise-dependent.
