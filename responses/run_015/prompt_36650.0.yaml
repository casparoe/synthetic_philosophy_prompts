answer: |-
  This is a fantastic example of a "dinner table paradox" that actually maps almost perfectly onto a century-old debate in moral philosophy. Your family inadvertently recreated a classic argument about **supererogation**.

  Supererogation is the technical term for acts that are good to do but not wrong to omit (e.g., heroism, sainthood, significant self-sacrifice).

  Here is the breakdown of who was right, where the logic snagged, and what you can safely say at Christmas without sounding like an amateur.

  ### 1. Move-by-Move Analysis

  **The Cousin's Dilemma ("Better implies Ought")**
  *   **The Argument:** Either giving the kidney is "better" (in which case you must do it) or it isn't (in which case don't praise the sister). He claims "better but optional" is a contradiction.
  *   **The Verdict:** **Logically valid, but philosophically contested.**
  *   **Why:** The Cousin is relying on a specific ethical principle called **Maximizing Consequentialism** (often associated with Utilitarianism). This view holds that you are always morally obligated to produce the best possible outcome. If donating the kidney creates more good than keeping it, a strict Utilitarian says you *must* donate.
  *   **The Flaw:** Most ethical systems (Deontology, Virtue Ethics, Common-Sense Morality) reject the premise that "Better implies Ought." They argue there is a difference between the *best* action and the *required* action. The Cousin isn't exposing a logical contradiction; he is asserting a controversial ethical premise as if it were a law of math.

  **The Aunt's Claim ("No Disapproval if Optional")**
  *   **The Argument:** If the act is optional (above the bar), you can't criticize someone for staying below the bar. If you criticize them, it implies there was a bar they should have met.
  *   **The Verdict:** **Partially right, but conflates "Blame" with "Disappointment."**
  *   **Why:** She is right that you cannot *blame* someone for failing to do a supererogatory act. You cannot call your younger sister "immoral" or "wrong" for not donating. However, she is wrong that you can't feel *disappointment* or wish things were different. Morality allows for "moral regret" without "moral condemnation."
  *   **The Flaw:** She treats moral status as binary (Good/Bad). In reality, there is a spectrum: Obligatory (Must do), Permissible (Can do), and Supererogatory (Should do, but don't have to). You can think someone *should* have done the heroic thing without thinking they are a *bad person* for not doing it.

  **The Older Sister's Defense ("Praise Requires Freedom")**
  *   **The Argument:** The act is only admirable *because* it wasn't demanded. If it were demanded, she just did her job.
  *   **The Verdict:** **Philosophically Standard.**
  *   **Why:** This is the standard definition of supererogation. Praise is the appropriate response to going *beyond* duty. If you praise someone for breathing, it makes no sense, because they have no choice. If you praise someone for running into a burning building, it makes sense because they could have stayed safe.
  *   **The Strength:** She correctly identified that removing the "optionality" removes the "heroism."

  ### 2. What They Were Missing (Talking Past Each Other)

  The reason you felt they were arguing past each other is that they were using different maps of morality.

  1.  **Value vs. Obligation:** The Cousin and Aunt conflated **Value** (how good an act is) with **Obligation** (what you are required to do).
      *   *Cousin's view:* High Value = High Obligation.
      *   *Older Sister's view:* High Value can exist without High Obligation (due to cost/sacrifice).
  2.  **The Cost of the Act:** The argument ignored *why* kidney donation is optional. It involves surgery, risk, pain, and bodily integrity. Most philosophers agree that **bodily autonomy** creates a "prerogative" to not sacrifice yourself, even if the outcome would be better. The Cousin's math ignored the "cost" variable in the equation.
  3.  **Sanctions:** The Aunt confused **external criticism** (telling someone they did wrong) with **internal regret** (wishing they had done better). You can say, "I wish you had donated, it would have been amazing," without saying, "You were wrong not to donate."

  ### 3. Settled vs. Debated (The Christmas Cheat Sheet)

  You asked specifically what is settled among philosophers versus what is still fought over. This is crucial so you don't present a minority opinion as fact.

  **✅ Mostly Settled (Safe to assert):**
  *   **Supererogation exists:** The vast majority of moral philosophers accept that some acts are "above and beyond" duty. Heroism is not obligatory.
  *   **Bodily Integrity matters:** Even among those who demand high moral sacrifice (like Peter Singer), most concede that forced bodily intrusion (surgery) is a higher bar than donating money.
  *   **Praise implies optionality:** It is widely accepted that praising someone for a mandatory duty is conceptually confused (you don't get a medal for not murdering someone).

  **⚔️ Genuinely Debated (Handle with care):**
  *   **The "Better implies Ought" Principle:** This is the Cousin's main weapon. Strict Utilitarians (like Peter Singer) *do* argue that if you can save a life at "minimal cost," you are obligated to do so. They would argue your Older Sister wasn't actually "heroic," she was just "doing her duty." **Do not say the Cousin is obviously wrong;** say he is arguing from a Utilitarian framework which is influential but not universally accepted.
  *   **The Limits of Supererogation:** Where is the line? Is giving 10% of your income supererogatory? 50%? 90%? Philosophers fight over where "duty" ends and "heroism" begins.
  *   **Disapproval:** Is it okay to feel moral disdain for someone who *could* save a life easily but chooses not to? (e.g., not donating a kidney vs. not giving $5 to charity). The Aunt's intuition that "some non-action is blameworthy" has traction here, but applying it to major surgery is much harder.

  ### 4. How to Navigate This at Christmas

  If this comes up again, do not try to "win" by saying the Cousin is logically flawed. Instead, frame it as a clash of ethical frameworks.

  **What to say:**
  > "I looked into this after Thanksgiving. The Cousin's argument is actually a famous philosophical position called 'Utilitarian Maximizing.' It's logically consistent *if* you believe we are always obligated to do the absolute best thing possible. But most ethicists reject that because it ignores personal cost and bodily autonomy. The Older Sister is defending the concept of 'Supererogation,' which is the standard view that heroism is optional. The disagreement isn't about logic; it's about whether morality demands we maximize good at all costs, or if we're allowed to keep some life for ourselves."

  **What NOT to say:**
  > "The Cousin is wrong because 'better' doesn't mean 'required'."
  *(Why? Because to a hardline Utilitarian, that statement is the error. You need to acknowledge his premise to refute it.)*

  > "The Aunt is wrong, you can't criticize anyone for optional stuff."
  *(Why? Because the Aunt is right that there is a social tension there. It's better to distinguish between blame and disappointment.)*

  **Summary:**
  Your Older Sister was the most philosophically accurate regarding common morality. Your Cousin was the most logically rigorous but relied on a controversial ethical premise. Your Aunt identified a real social tension but offered a false dichotomy. You can safely treat the concept of "optional heroism" as the standard view, provided you acknowledge that the Cousin's "maximizing" view is a serious (if demanding) alternative.
