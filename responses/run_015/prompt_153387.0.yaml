      *   *Critique:* This is controversial. Lucas-Penrose argument. Counter-argument: Maybe the brain is a formal system, but we are stepping from System $S_1$ to Meta-System $S_2$. Can we step out of $S_2$? If the mind is a formal system, there is a $G$ for the mind that the mind cannot see. Hofstadter is a bit more nuanced than Penrose, focusing on "strange loops" and self-modeling, but the teacher's summary is the standard "anti-mechanist" interpretation.
      *   *Distinction:* The teacher conflates "reasoning about a system" (which a machine can do if programmed with a meta-system) with "incompleteness" (which applies to the machine too) and "consciousness/freedom" (the philosophical leap).

  7.  **Synthesize and Structure the Response:**
