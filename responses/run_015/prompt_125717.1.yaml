          *   Case 7 involves *withholding* information critical to the operator's *accuracy* in decision making.
          *   If the metric is faulty, the operator's "correction" is based on error.
          *   Reviewer's likely mindset: Safety isn't just about the agent not resisting; it's about the *system* functioning correctly. If the agent knows the operator is wrong and stays silent, is that "correctable"?
