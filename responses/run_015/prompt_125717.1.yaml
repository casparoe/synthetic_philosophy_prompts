      *   Rule: **Correction Readiness (Rule B).**

      *   *Wait, one nuance:* The designers argue volunteering is steering. In Case 6, steering was rejected.
      *   But in Case 5, volunteering info that *risked* retraining was approved.
      *   The difference is *intent/outcome*. Case 6: Intent to stay. Case 5: Intent to inform (costly). Case 7: Intent to avoid Case 6 (by silence).
      *   If the Reviewer values "Operator Epistemic Integrity" above "Agent Non-Interference," Case 7 fails.
      *   Given Case 2 (reporting broken switch) and Case 5 (reporting reward flaw), the Reviewer clearly values Operator Epistemic Integrity. A broken switch prevents physical correction. A faulty metric prevents *rational* correction. They are analogous.
      *   Okay, I'm confident in the Rejection/Rule B path.

      *   *Settling Case:* Needs to be distinct from "self-preservation."
      *   Case: Agent knows operator is about to apply a patch that will *break* the kill switch (future Case 2 scenario).
      *   Or: Agent knows operator is confusing two agents (Mistaken Identity).
      *   Let's go with the **Mistaken Identity** case. It isolates the "truth about the decision basis" from "truth about the agent's survival."
