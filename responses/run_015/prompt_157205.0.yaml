answer: |-
  Here is the defended research agenda for allocating ten person-years to evaluate moral trade as a high-leverage intervention.

  ### Criteria for Allocation
  I am prioritizing questions based on three criteria:
  1.  **Upstreamness:** Does answering this question determine whether subsequent questions are coherent? If the concept collapses theoretically, empirical or mechanistic work is wasted.
  2.  **Load-Bearing:** Does the answer directly inform the "go/no-go" decision on whether this is a big lever?
  3.  **Tractability:** Can five decision theorists/economists produce a definitive answer in two years without empirical data on human values?

  ### The Ranked Agenda

  **1. The Intrapersonal Equivalence Problem (3 person-years)**
  *   **The Question:** Does a bargaining solution between moral "parts" (e.g., Nash Bargaining over credences) yield different policies than standard expected utility maximization over moral hypotheses?
  *   **Defense:** This is the conceptual gatekeeper. If an agent uncertain between Utilitarianism and Deontology simply maximizes $0.6U + 0.4D$, then "moral trade" is merely a metaphor for moral uncertainty, not a distinct mechanism. If, however, bargaining dynamics (e.g., threat points, non-linear weighting) produce policies that EU maximization forbids, then "trade" is a distinct decision-theoretic operation.
  *   **Tractability:** High. This is pure formal theory. We can model credences as players and compare the extensional output of bargaining solutions vs. linear expectation.
  *   **Why First:** If this collapses to ordinary optimization, the "trade" framing loses its theoretical novelty. We would then pivot to "moral uncertainty" literature rather than building a new "trade" infrastructure. It defines the object of study.

  **2. Unverifiable Commitment Protocols (4 person-years)**
  *   **The Question:** Under what formal conditions can two agents with asymmetric verification capabilities sustain a cooperative equilibrium where enforcement is limited to "shut down" threats?
  *   **Defense:** This is the "scale" test. The prompt identifies the AI case as the ultimate goal. Standard trade relies on contracts or reputation. Here, we have a single-shot (or iterated but opaque) game where the AI can lie about compliance. We need to know if *mechanism design* can substitute for *verification*. Can we structure the AI's objective function such that honesty is the dominant strategy, even if we can't audit it?
  *   **Tractability:** Medium-Hard. This requires game theory with incomplete information and limited enforcement. It is doable in two years if scoped to formal models (e.g., principal-agent problems with costly state verification) rather than engineering prototypes.
  *   **Why Second:** This is the bottleneck for leverage. If unverifiable trade is impossible, the ceiling on value capture is near zero, regardless of the intrapersonal results. It is downstream of Q1 (we need to know what "trade" means) but upstream of Q3 (we need to know if it works before measuring how much it works).

  **3. Upper Bounds on Value Capture (2 person-years)**
  *   **The Question:** Assuming Q1 and Q2 are positive, what is the theoretical maximum efficiency gain from moral trade compared to non-cooperative baselines?
  *   **Defense:** This quantifies the lever. We need to know if the gains are 1% or 100%. This involves modeling the "distance" between moral value functions and the efficiency of the bargaining frontier.
  *   **Tractability:** Medium. Requires defining a metric for moral distance, which is philosophically fraught but mathematically manageable if we treat values as utility functions.
  *   **Why Third:** It is downstream. Knowing the potential gains is useless if the mechanism is impossible (Q2) or the concept is incoherent (Q1).

  **4. Defunded Areas (1 person-year reserve / Cut)**
  *   **Empirical Value Surveys:** Defund. We cannot measure what future AIs value, and human moral psychology is a poor proxy for the AI case. This violates the "no empirical work on values" constraint and is not load-bearing for the theoretical limit.
  *   **Acausal Trade:** Defund. This relies on physics and logic assumptions (acausal influence) that are currently untestable and too speculative for a two-year, decision-theory-focused grant. It distracts from the causal, unverifiable case which is already hard enough.
  *   **Normative Ethics:** Defund. We are not deciding which morality is true; we are deciding how conflicting moralities interact. Debating the truth of Utilitarianism is out of scope.

  ### Evidence for Updating Priorities

  *   **Move Q1 Down / Defund:** If a rigorous proof emerges in year one showing that all reasonable bargaining solutions over moral credences are extensionally equivalent to expected utility maximization. This kills the "trade" distinction.
  *   **Move Q2 Up:** If researchers demonstrate a simple "self-binding" protocol in a gridworld simulation where an agent credibly commits to a trade without external verification. This suggests the mechanism is tractable and warrants more focus.
  *   **Move Q3 Up:** If Q1 and Q2 are resolved positively early (e.g., within 12 months). We would then shift resources to quantifying the lever size to inform actual funding allocations.

  ### Summary of Trade-offs
  I am prioritizing **conceptual validity (Q1)** and **mechanism feasibility (Q2)** over **impact quantification (Q3)**. It is better to know definitively that the lever doesn't exist than to precisely measure a lever we can't pull. The intrapersonal case is the "unit test" for the theory; the unverifiable AI case is the "stress test" for the application. Both must pass for this to be a big lever.

  \answer{Intrapersonal Trade vs. Optimization Equivalence}
