  ### 1. The Coarse Description
  A workshop-built device, the "Tri-Sorter," consists of a central hopper and three collection trays arranged in an equilateral triangle around it, labeled **A**, **B**, and **C**. The trays are identical in shape, material, and position relative to the hopper. The device contains an internal release mechanism that, when activated, directs a single steel ball from the hopper into exactly one of the three trays. The external casing is opaque, concealing the internal workings. The construction is perfectly regular: the trays are equidistant from the center, the ball is perfectly spherical, and the release mechanism is centrally mounted with no visible bias toward any specific tray. A careful reader, given only this description, finds no physical basis to distinguish the likelihood of the ball landing in tray **A**, **B**, or **C**; the setup is described as entirely symmetric with respect to the outcome labels.

  ### 2. The Fine-Grained Mechanism
  The internal release mechanism is a **12-position tumbler**. Imagine a circular plate with 12 distinct, physically identical detents (slots) numbered 1 through 12 in cyclic order. The plate is perfectly balanced, and the mechanism selects exactly one detent to align with the drop path for each trial.
  *   **State Space:** The set of fine states is $S = \{1, 2, ..., 12\}$, representing which detent is selected.
  *   **Symmetry:** The hardware is strongly symmetric with respect to these states. For any two states $i$ and $j$, there is a physical rotation of the tumbler that maps position $i$ to position $j$ without altering the mechanical properties (spring tension, friction, shape) of the device. This transitive symmetry vindicates applying the Principle of Indifference to the states: each state has a chance of $1/12$.
  *   **The Mapping:** The connection between detents and trays is fixed by internal wiring that is hidden from the coarse view.
      *   Detents **1, 2** direct the ball to Tray **A**.
      *   Detents **3, 4, 5** direct the ball to Tray **B**.
      *   Detents **6, 7, 8, 9, 10, 11, 12** direct the ball to Tray **C**.

  ### 3. The Verdicts Diverge
  *   **Coarse Verdict (Principle of Indifference on Outcomes):** Since the description treats trays **A**, **B**, and **C** symmetrically, the rational credence assigned to each is **$1/3$**.
  *   **Fine Verdict (Long-Run Frequency):** Based on the uniform distribution over the 12 states:
      *   $P(A) = 2/12 = \mathbf{1/6}$
      *   $P(B) = 3/12 = \mathbf{1/4}$
      *   $P(C) = 7/12 = \mathbf{7/12}$
  *   **Comparison:** The frequencies are pairwise distinct ($1/6 \neq 1/4 \neq 7/12$). None equal $1/3$ (which would be $4/12$). In 120 trials, one would expect roughly 20 A's, 30 B's, and 70 C's, whereas the coarse verdict predicts 40 of each. This deviation is starkly visible in a few hundred trials.

  ### 4. Diagnosis of the Broken Link
  The one-third verdict is the **right rational credence for an agent confined to the coarse description**, but it is the **wrong objective chance**. The objective chance is determined by the physical mechanism (the fine verdict). The link that fails is the assumption that **symmetry of labels implies symmetry of the generating measure**.

  The coarse description establishes a symmetry among the *names* of the outcomes (A, B, C are interchangeable in the text). The fine mechanism establishes a symmetry among the *physical states* (detents 1–12 are interchangeable in the hardware). The Principle of Indifference yields uniform probabilities only when the symmetry of the description matches the symmetry of the mechanism. Here, the mapping from states to outcomes breaks the label symmetry: the set of states leading to A is not the same size as the set leading to B or C. The coarse description underdetermines the mechanism by omitting the mapping, leading the agent to assume a 4-4-4 distribution (symmetric) rather than the actual 2-3-7 distribution (asymmetric).

  ### 5. The Minimal Change
  To make the two verdicts coincide, the **minimal change is in what is said about the world**, not the world itself.
  *   **Change:** Amend the coarse description to include the sentence: *"The internal mechanism maps the 12 equally likely internal states to the trays in a 2-to-3-to-7 ratio."*
  *   **Result:** A reader applying the Principle of Indifference to the *states* (now disclosed) would calculate chances of $1/6, 1/4, 7/12$. This matches the objective chance. The conflict vanishes because the description no longer supports the false inference of outcome symmetry.

  ### 6. Objection and Reply
  **Objection:** "The Principle of Indifference is a rule of logic, not physics. Given *only* the proposition 'The ball lands in A, B, or C' with no further evidence, logic dictates equal credence ($1/3$). The physical mechanism is irrelevant to what it is *rational to believe* under ignorance; you are confusing epistemic probability with objective chance."

  **Reply:** "This reply concedes the tutorial's moral. If the Principle of Indifference yields $1/3$ based on logic alone, but the world produces $7/12$ based on mechanism, then the Principle of Indifference **cannot be used to determine objective chance**. Bertrand's Paradox arises precisely when we treat the logical verdict ($1/3$) as a prediction of physical frequency. If you hold that the Principle needs no mechanism, you must admit it is disconnected from physical reality. To use it for scientific prediction or gambling, you *must* fix the mechanism, proving that the principle has no determinate content for physical setups until the generation process is specified."
