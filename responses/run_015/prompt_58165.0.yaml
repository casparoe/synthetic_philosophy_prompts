      *   *Browning:* Emphasizes the specific context of the war in the East, the shock of the first killing, the option to opt-out (though socially costly), the gradual brutalization, and the power of the group dynamic. He argues "ordinary men" became killers due to circumstance, not necessarily pre-existing murderous intent.
