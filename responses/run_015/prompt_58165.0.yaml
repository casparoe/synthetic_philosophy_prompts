      *   **Section 2: Core Claims (Steel-manning):**
          *   *Browning:* Focus on the *process*. The transition was difficult initially. Social pressure within the primary group (the squad) was the primary driver. Ideology was a rationalization, not the initial spark.
          *   *Goldhagen:* Focus on the *motivation*. The men perceived Jews as an existential threat. Ideology was the engine. Social pressure was secondary; they killed because they believed it was right to eliminate Jews.

      *   **Section 3 & 4: Cruxes and Hypothetical Tests:**
          *   *Crux 1: The Opt-Out Rate & Consequence.*
              *   Browning says opting out was possible but socially hard. If it were easier, more would opt out.
              *   Goldhagen says opting out was irrelevant; they didn't want to opt out. Even if easy, they'd still kill.
              *   *Test:* A unit where opt-out is anonymous/private with no social stigma.
              *   *Prediction:* Browning -> High refusal rate. Goldhagen -> Low refusal rate.
          *   *Crux 2: Target Switching (Ideology vs. Obedience).*
              *   Browning says they kill because they are ordered to kill *this* group in *this* context.
              *   Goldhagen says they kill because the target is *Jewish*.
              *   *Test:* Same unit, same orders, different victim group (e.g., non-Jewish Poles or Partisans) under identical risk conditions.
              *   *Prediction:* Browning -> Similar participation rates (obedience to kill). Goldhagen -> Significantly lower enthusiasm/participation (specific antisemitic drive).
          *   *Crux 3: Initial Reaction (The "First Time" Effect).*
              *   Browning says the first massacre (Józefów) caused shock, vomiting, distress.
              *   Goldhagen says distress was minimal or performative; most were eager or resolute.
              *   *Test:* Psychological assessment or diary entries from the *first* 24 hours of killing orders vs. later.
              *   *Prediction:* Browning -> High acute stress markers initially, habituating later. Goldhagen -> Low stress markers initially, consistent resolve.

      *   **Refining the Predictions:** Make them quantifiable where possible for the table.

      *   **Review against Constraints:**
