  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official. "Adversarial Collaboration Statement on Reserve Police Battalion 101."
      *   **Introduction:** Briefly state the purpose.

      *   **Section 1: Agreed Basic Facts:**
          *   Need historical consensus points.
          *   Battalion 101 operated in Poland (1942).
