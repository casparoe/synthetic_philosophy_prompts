prompt: |-
  I need the result of an adversarial collaboration between two holdouts on why reserve police battalions turned into killers — one is team Browning, its all situation and peer pressure, the other is team Goldhagen, its all deep antisemitic culture. Draft what they could both actaully sign: the basic facts they'd agree happened, each side's core claim put so fairly the other side couldnt call it a strawman, the 2-3 cruxes that would realy move someone, and for each crux a concrete hypothetical they both accept as a test (like a unit where opting out is genuinely easy and private, or guys transferred to a totally different victim group) with both predictions written down beforehand. Do agreed points as a short list, then a small table for disagreements + predictions.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Topic:** Why Reserve Police Battalion 101 (and similar units) turned into killers during the Holocaust.
