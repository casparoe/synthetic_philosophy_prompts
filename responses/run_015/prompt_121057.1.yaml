answer: |-
  **1. The Kelly Rule (Max Expected Log Wealth)**
  **Translation:** In your vocabulary, this is the definition of maximizing the long-run stochastic growth rate ($r = \lim_{t\to\infty} \frac{1}{t} \log N_t$). The claim that the log-optimal policy almost surely exceeds any other policy's wealth translates to the branching-process fact that the lineage with the highest $r$ eventually comprises the entire population share; the ratio of its size to any suboptimal lineage's size diverges to infinity with probability one. "Rationality" here maps to invasion fitness: a mutant strategy maximizing $r$ invades and fixes against residents maximizing any other moment of the wealth distribution.
  **Residue:** The normative force resists translation. In ecology, maximizing $r$ is a description of what persists, not a prescription for what an agent *ought* to do. The decision-theory argument assumes a single persistent self that *should* care about asymptotic dominance. In your terms, "optimal" is a claim about who ends up with most of the population, not a claim about one decision-maker's internal consistency. If the agent has no offspring or inheritance mechanism, the "almost surely exceed" claim is biologically vacuous.

  **2. The Ergodicity Critique (Ensemble vs. Time Average)**
  **Translation:** This is trivially true in your vocabulary. It is simply the distinction between the expectation of population size $E[N_t]$ (ensemble average, dominated by rare lucky lineages) and the exponential of the expected log size $\exp(E[\log N_t])$ (time average, typical lineage growth). The critique that expected-value maximization optimizes the wrong average translates to the ecological fact that selection acts on the geometric mean, not the arithmetic mean, in multiplicative environments. The "log rule" is just the small-noise approximation of the stochastic growth rate you already use.
  **Residue:** The framing of "error" resists. Ergodicity economics posits that agents make a cognitive mistake by using ensemble averages. In evolutionary ecology, there is no error, only selection filters; organisms do not calculate averages, they embody strategies that either persist or vanish. The "ergodicity" label adds no mechanistic insight over "multiplicative noise implies geometric mean fitness." The translation fails to capture the decision-theorist's intent to correct a reasoning flaw rather than describe a selection pressure.

  **3. Fractional Kelly (Betting Less Than Optimal)**
  **Translation:** This maps to conservative bet-hedging driven by extinction risk or parameter uncertainty. In infinite populations, fractional Kelly is suboptimal for long-run growth; it sacrifices $r$ to reduce the variance of the growth rate. In your terms, this is only "rational" if there is an absorbing boundary (extinction) close enough that demographic stochasticity matters, or if the "edge" (environmental cue reliability) is uncertain. It corresponds to maximizing the probability of persistence over a finite horizon rather than the asymptotic growth rate.
  **Residue:** The justification of "drawdown aversion" or subjective utility resists. Decision theory allows an agent to prefer lower growth for smoother wealth trajectories based on personal taste. Ecology has no currency for "smoothness" unless it translates to reduced extinction probability. If the population is effectively infinite and the boundary distant, fractional Kelly is simply maladaptive. The translation holds only if you substitute "utility of wealth" with "probability of avoiding absorbing extinction."

  **4. Geometric Rationality (Geometric Mean of Values)**
  **Translation:** If "values" are fitness components across environmental states, this is standard geometric mean fitness maximization. If "values" are incommensurable dimensions (e.g., survival vs. fecundity trade-offs), it maps to optimizing the life-history trait vector that maximizes $\lambda_s$. However, if "values" are subjective utilities across possible worlds without an inheritance mechanism, this has no expression in your vocabulary. You can model trade-offs, but you cannot model a single agent aggregating utility across non-actualized worlds unless those worlds represent environmental states experienced by a lineage.
  **Residue:** The aggregation of incommensurable *values* (rather than fitness components) resists completely. Ecology reduces all dimensions to fitness contributions; decision theory often treats value as distinct from survival. Furthermore, "probability-weighted" across possible worlds implies a single agent experiencing one world. In ecology, the "weights" are frequencies of environmental states experienced by the lineage over time. The translation fails if the argument relies on a normative rule for belief or value aggregation unrelated to reproductive success.

  **Closing Verdict and Bidirectional Residue Report**
  The bidirectional residue reveals a fundamental category error. What these arguments have that your vocabulary lacks is a *normative theory for a single finite-life agent without inheritance*; they attempt to derive "should" from asymptotic mathematics that only apply to lineages. What your vocabulary has that these arguments lack is *population structure and extinction boundaries*; decision theory treats the agent as immortal or restartable, ignoring that demographic stochasticity can force extinction even on an optimal life history, and that frequency dependence can shift the invasion criterion away from simple growth rate maximization. **Verdict:** The decision-theory arguments are largely rediscoveries of ecological principles (geometric mean fitness, typical lineage growth) dressed in normative clothing. They are determinate only when "optimal" means "what wins in the long run." They become ambiguous or false when "optimal" means "best for me" in the absence of a mechanism to transfer wealth to a future self (offspring). The gap is not in ecology, but in the decision theorists' failure to specify the inheritance mechanism required to make time-averages relevant to the agent.
