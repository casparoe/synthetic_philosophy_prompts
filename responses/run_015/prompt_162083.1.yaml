answer: |-
  This is a sophisticated diagnosis of a tension that sits at the heart of contemporary translational neuroscience. You have identified a friction between the **ethical-regulatory framework** (which leans functionalist to maximize protection) and the **scientific-validity framework** (which leans mechanistic to maximize predictive power).

  Here is a reconstruction of the implicit philosophy, an evaluation of your proposed "Homology Rule," and an analysis of the alternatives and epistemic status.

  ### 1. Reconstructing the Implicit Philosophy: "Pragmatic Dual-Aspectism"

  Your guess that the practice is functionalist is half-right. The system does not operate on a single unified philosophy of mind. Instead, it operates on a **Pragmatic Dual-Aspectism**.

  *   **For Ethics (Severity Classification):** The system adopts a **Phenomenal Functionalism**. It assumes that if a system exhibits the causal/behavioral profile of pain (nociception + affective response + trade-off behavior), it instantiates pain, regardless of the substrate. This is driven by the *Precautionary Principle*. It is safer to falsely attribute pain to a non-sentient machine than to falsely deny it to a sentient animal. Here, Multiple Realizability (MR) is assumed: a mouse cortex and a human cortex are different, but if the output is "suffering," the moral status holds.
  *   **For Science (Translational Validity):** The system adopts a **Mechanistic Constraint**. Reviewers demanding homologous circuits are expressing skepticism about MR in biology. They are effectively saying: "Functional similarity is necessary but not sufficient for generalization." They worry about *false positives* in modeling. A mouse might look depressed, but if the circuit is not homologous, the drug that fixes the mouse might not fix the human.

  **Is this inconsistent?**
  Strictly speaking, yes, it is metaphysically unstable. If pain *just is* a functional state (Functionalism), then knowing the mechanism shouldn't change whether the mouse is in pain, nor necessarily whether that pain models human pain (if the function is identical). If pain *just is* a specific neural firing pattern (Identity Theory), then the mouse cannot be in "human pain" at all, making the severity classification misleading.

  **However, institutionally, it is coherent.** It treats mental state attribution as **context-dependent**.
  1.  **Moral Context:** We ask, "Can it suffer?" (Answer: Yes, if it behaves like it does).
  2.  **Predictive Context:** We ask, "Will this intervention work on humans?" (Answer: Only if the machinery is the same).

  The institution is not saying two inconsistent things about the *nature* of the mind; it is managing two different risks: the risk of **moral harm** (mitigated by functionalism) and the risk of **scientific failure** (mitigated by mechanism-hunting).

  ### 2. Evaluating the "Homology Rule"

  > *The Rule: A finding in a non-human model counts as evidence about human psychology only if the mechanism subserving it has been identified and shown to be homologous to the human mechanism.*

  **Is this an application of the practice's logic or a betrayal?**
  It is a **radicalization of the scientific side that betrays the ethical side's implicit ontology.**

  *   **Why it fits the scientific logic:** It codifies the reviewers' current skepticism. It admits that behavioral isomorphism is often "surface deep." It aligns with the "New Mechanism" philosophy of science (e.g., Craver), which argues that phenomena are explained by constitutive mechanisms. If the mechanism isn't conserved, the phenomenon isn't the *same* natural kind, even if it looks the same.
  *   **Why it betrays the current practice:** The current pipeline relies on **phenomenological validity** (the animal *looks* and *acts* like the human condition) to justify the research *before* the mechanism is known. The Homology Rule reverses the order of operations. Currently, we assume the model is valid enough to *find* the mechanism. Under your rule, we must know the mechanism to *validate* the model.
  *   **The Consequence:** As you noted, this collapses the rodent pipeline. If homology is required, and rodent/human homology is imperfect (which it is for higher cognition), you must move to human systems (organoids, microphysiological systems).

  **The Trap:** This forces the institution to confront the question it currently avoids: **Do human organoids have moral status?**
  *   If the institution stays **Functionalist** (as per the ethics side): A cerebral organoid that replicates the causal profile of pain/anxiety *must* be afforded severity protections.
  *   If the institution stays **Mechanistic/Identity** (as per the Homology Rule): An organoid lacks the full structural architecture of a brain, so it might not count.
  *   **Current Practice:** Avoids this by regulating "animals." Organoids fall into a regulatory blind spot. The Homology Rule drags organoids into the light, demanding a philosophical decision the institution is not equipped to make.

  ### 3. What Would Change Under Alternatives?

  #### Scenario A: Straightforward Identity Theory (Type-Physicalism)
  *Thesis: Mental State M = Neural State N. If N differs, M differs.*

  *   **What to Stop Doing:**
      *   **Stop Cross-Species Generalization:** You cannot claim a mouse model tests "human depression." You can only claim it tests "mouse depression." Translational claims become inductive guesses, not deductions from shared states.
      *   **Stop Generic Severity Bands:** A "moderate" pain protocol in a zebrafish is metaphysically distinct from "moderate" pain in a primate. Severity scales would need to be species-specific and incommensurable.
      *   **Stop Using Behavioral Proxies as Proof:** Behavior is merely a correlate, not the state itself.
  *   **What to Start Doing:**
      *   **Human-Only Models:** Heavy investment in organoids/computational models becomes not just practical but *ontologically necessary* for human psychology.
      *   **Neural Taxonomy:** Ethics committees would need neuroanatomical expertise to determine if a specific species possesses the *exact* tissue type required for the state in question.

  #### Scenario B: Strict Functionalism (Multiple Realizability All the Way Down)
  *Thesis: Mental State M = Causal Role C. Substrate is irrelevant.*

  *   **What to Start Doing:**
      *   **Validate AI and Organoids:** If a simulation or organoid replicates the input-output causal profile of anxiety, it *is* anxious. It requires ethical oversight.
      *   **Accept Behavioral Validity:** If a fly avoids a shock in a way that functionally mirrors human avoidance learning, it is valid evidence for human learning mechanisms, even without circuit homology. The "Homology Rule" would be rejected as substrate chauvinism.
      *   **Unified Ethics:** Severity bands would apply to any system (biological or synthetic) capable of the functional profile.
  *   **What to Stop Doing:**
      *   **Stop Demanding Homology for Validity:** Reviewers could not reject a paper simply because the circuit differs, provided the computational/functional logic is preserved.
      *   **Stop "Human Exceptionalism":** The distinction between human and non-human minds becomes a difference of degree (complexity), not kind (substrate).

  #### Scenario C: The Underdetermined Middle (Current Practice)
  *   **What is Underdetermined:**
      *   **Behavior as Evidence:** Both Identity Theorists and Functionalists use behavior as *evidence* for mental states. The current practice of coding facial expressions is compatible with both (as a symptom vs. as a constituent).
      *   **Evolutionary Conservation:** Everyone agrees evolution conserves *some* traits. The disagreement is whether conservation is required for *identity* or just for *reliability*.
      *   **The Precautionary Principle:** This is a policy heuristic, not a metaphysical claim. It allows the institution to act *as if* functionalism is true for ethics, while acting *as if* identity theory is true for grant validation, without committing to either.

  ### 4. Epistemic Status: Consensus vs. Contention

  Here I distinguish between what is settled in philosophy of mind/neuroscience and what remains debated.

  **Consensus (Settled or Near-Unanimous):**
  1.  **Multiple Realizability is Coherent:** There is broad agreement that MR is a logically coherent concept and constitutes a strong argument against strict Type-Identity Theory (Putnam, Fodor).
  2.  **Behavior is Underdetermined:** Philosophers and scientists agree that behavior alone does not *logically entail* a specific mental state (the problem of other minds/zombies). Behavioral proxies are always inferential.
  3.  **Homology is Evidentially Strong:** There is consensus that phylogenetic homology increases the probability of translational success. No one argues homology *reduces* validity.

  **Contested (Where the Disagreement Bottoms Out):**
  1.  **Does MR Obtain in Biology?** This is the crux. Functionalists argue mental kinds are multiply realizable (a mouse and human can both truly be "in pain"). Identity Theorists (or "Species-Specific Realization" proponents) argue that at the level of detailed neuroscience, MR is rare. *My Analytical View:* The evidence suggests MR is common for low-level sensations (nociception) but rare for high-level cognition. The current practice treats them as the same, which is a source of error.
  2.  **Constitutive vs. Evidential Homology:** Is homology required for the mental state to *exist* (constitutive), or just for us to *know* it exists (evidential)?
      *   *Current Practice:* Treats it as evidential for ethics (we assume pain without knowing circuits) but constitutive for science (no mechanism = no valid model).
      *   *Philosophical Disagreement:* Functionalists say evidential. Identity Theorists say constitutive.
  3.  **The Status of Organoids:** There is no consensus on whether a functional match in an organoid constitutes a mind. This is an empirical question (how complex is the function?) wrapped in a metaphysical one (is function enough?).

  **My Analytical Assessment (Not Consensus):**
  The tension you observe is not a bug; it is a **risk-management feature**. The institution is implicitly Bayesian.
  *   **Ethics:** High cost of False Negative (ignoring pain). Low cost of False Positive (over-regulating). -> **Prior favors Functionalism.**
  *   **Science:** High cost of False Positive (failed clinical trials). Low cost of False Negative (discarding a potentially useful but mechanistically obscure lead). -> **Prior favors Mechanism/Identity.**

  The "Homology Rule" attempts to align the Scientific Prior with the Ethical Prior. If you adopt it, you force the Scientific Prior (Mechanism) onto the Ethical domain. This would likely stall research (too hard to prove homology) while simultaneously creating a moral crisis for human-model systems (if mechanism is key, do organoids have it? If function is key, do they suffer?).

  ### Summary Recommendation for Policy

  If you are arguing about the **Homology Rule**:

  1.  **Acknowledge the Betrayal:** Admit that the rule tightens the scientific validity criteria beyond what the current functionalist-ethical framework anticipates.
  2.  **Highlight the Organoid Paradox:** Point out that enforcing the Homology Rule pushes research toward human systems, which immediately triggers the ethical functionalism already in place. You cannot demand human-homology for validity while denying human-like moral status to human-models that function like minds.
  3.  **Propose a "Graded Realism":** Instead of a binary Homology Rule, policy could require **Mechanistic Plausibility**. Researchers must show *why* the mechanism is likely conserved, rather than proving it is identical. This preserves the functionalist bridge for ethics while satisfying the mechanistic demand for science without demanding impossible identity.

  The institution is currently living in a "Philosophical Twilight Zone." Your reform proposal forces it to step into the light. Be prepared for the shadow it casts on human-based models.
