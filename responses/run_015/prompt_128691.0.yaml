      *   *Critique:* How do I prevent them from just lying about scores?
      *   *Fix:* The instructor collects the sheets. The "justification" for peer downgrading is checked qualitatively.
      *   *Critique:* How to ensure the "Cascade" actually happens?
      *   *Fix:* The rules must *force* a re-evaluation. If you disagree, you *must* adjust the peer rating or explain why not. This forces the tension.
      *   *Refinement on Stakes:* Make the stakes about the *final 30 minutes*. If they score well, they discuss a more intriguing paradox. If not, they do a standard drill. This is low stakes but meaningful for a seminar.

  11. **Finalising the Text:**
      *   Ensure the distinction between First-Order (belief about the case) and Second-Order (belief about the partner) is clear.
      *   Ensure the "Calibration Cascade" is the central tension.
