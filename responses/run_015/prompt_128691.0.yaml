      *   **Context:** Upper-level seminar in philosophical epistemology (postgraduate level).
      *   **Participants:** 12 students.
      *   **Duration:** 90 minutes.
      *   **Topic:** Peer Disagreement (specifically the "calibration cascade").
      *   **Goal:** Design an in-class simulation where the philosophical problem *emerges* from the rules/incentives, not a lecture.
      *   **Key Mechanic:** The "Calibration Cascade" (Disagree $\rightarrow$ Revise Belief $\rightarrow$ Re-evaluate Peerhood $\rightarrow$ Further Revision/Conflict).
      *   **Stakes:** Real but small (affects the final 30 minutes of the seminar).
      *   **Structure:** Pairs, private info packets, initial confidence + peer rating, timed deliberation, convergence/stand, mandatory second-order peer re-rating.
      *   **Incentives:** Costly to lower peer status without justification; costly to maintain peer status while refusing belief revision.
      *   **Output Requirements:** British English, no bibliographies/citations/named secondary literature, no specialised empirical data, explicit rules, minute-by-minute timeline, materials, debrief mapping to formal structures (conciliationism, steadfastness, uniqueness thesis), prediction of failure modes (e.g., ad hominem interpretation), and limitation of the simulation (e.g., stability of belief networks).

  2.  **Deconstruct the "Calibration Cascade":**
      *   Standard peer disagreement models often assume peer status is fixed *before* the disagreement.
      *   The cascade happens when: A and B disagree. A thinks "If B is my peer, I should move towards B." But if A moves towards B, A might think "Why did B not move towards me? Is B actually less competent?" Or, if A doesn't move, B thinks "A is irrational/stubborn, therefore A is not a peer."
      *   The simulation needs to make the *rating of the partner* part of the score, linked to the *movement of belief*.

  3.  **Designing the Incentive Structure (The "Game"):**
      *   Need a scoring system. Let's call it "Epistemic Credit" (EC).
      *   *Goal:* Maximise group EC to unlock the "Premium Case Study" for the final 30 mins. If they fail, they get the "Standard Case Study" (less interesting).
      *   *Individual Scoring:*
          1.  **Accuracy:** Getting the "correct" answer (defined by the instructor's key).
          2.  **Coherence:** Consistency between belief revision and peer rating.
          3.  **Peer Rating Penalty:** Arbitrarily downgrading a partner costs points. Keeping peer status high while diverging wildly costs points.
      *   *The Twist:* The "Correct" answer isn't binary. It's about the *quality of reasoning* regarding the calibration.
      *   *Refinement:* To make it about the *cascade*, the scoring must penalise static peer ratings in the face of disagreement.
      *   *Rule:* If you disagree significantly (>20% confidence gap) but rate them as a Full Peer (5/5), you lose points (irrationality penalty). If you rate them as Inferior (<3/5) but cannot cite a specific evidential asymmetry from your packet, you lose points (arrogance penalty).

  4.  **Developing the Case Study:**
      *   Topic: Algorithmic decision-making in public administration (procedural fairness).
      *   Need two packets (A and B) that lead to different conclusions but are epistemically symmetrical *initially*.
      *   *Packet A:* Emphasises efficiency and consistency (leans towards 'Fair'). Contains a specific statistical caveat.
      *   *Packet B:* Emphasises transparency and recourse (leans towards 'Unfair'). Contains a specific sociological caveat.
      *   *Overlap:* Both contain the same core data, but weighted differently.

  5.  **Drafting the Timeline (90 Minutes):**
      *   00-10: Intro & Setup (No theory, just rules).
      *   10-20: Private Reading & Initial Assessment.
      *   20-35: Round 1 Deliberation (First-order belief).
      *   35-45: Round 2 Calibration (Second-order peer rating).
      *   45-55: The Cascade (Negotiating the rating change).
      *   55-65: Scoring & Aggregation.
      *   65-90: Debrief & Philosophical Mapping.

  6.  **Refining the "Cascade" Mechanic:**
      *   It needs to be iterative.
      *   *Step 1:* State Confidence (0-100%).
      *   *Step 2:* Discuss.
      *   *Step 3:* State New Confidence.
      *   *Step 4:* Rate Partner's Peerhood (1-5).
      *   *Constraint:* If New Confidence differs from Partner's by >15%, Peerhood *must* be rated <5. If Peerhood is rated <5, you must identify a specific 'defeater' in their reasoning.
      *   *The Cascade:* If I lower your peerhood, you might lower mine because I failed to conciliate. This needs to be captured in the "Round 2" phase.

  7.  **Addressing the "Stakes":**
      *   The group of 12 needs a collective goal.
      *   Total Class Score > X threshold = Premium Case (e.g., "The Paradox of Idealisation").
      *   Total Class Score < X threshold = Standard Case (e.g., "Basic Applications").
      *   This creates pressure to cooperate but also to be epistemically rigorous.

  8.  **Drafting the Debrief:**
      *   Must map to Conciliationism (move towards peer), Steadfastness (hold firm), Uniqueness Thesis (only one rational doxastic attitude).
      *   Must explain the "Calibration Cascade" (the instability of peer status).
      *   Must highlight the failure mode: Treating peer-downgrading as personal insult (ad hominem) rather than epistemic weight adjustment.
      *   Must highlight the limitation: Real life has long-term belief networks; this is a one-off snapshot.

  9.  **Review against Constraints:**
      *   British English (e.g., "programme", "centre", "modelling").
      *   No citations/named literature (e.g., don't say "Elga" or "Kelly").
      *   No specialised empirical data.
      *   Tone: Academic, instructional, precise.

