answer: |-
  # Seminar Design: The Calibration Cascade

  ## 1. Seminar Overview
  **Topic:** The Instability of Peer Status in Disagreement.
  **Duration:** 90 minutes.
  **Participants:** 12 postgraduate students (6 pairs).
  **Objective:** To simulate the 'calibration cascade', wherein the attempt to resolve first-order disagreement destabilises second-order assessments of peerhood, necessitating further revision.
  **Stakes:** The collective score of the class determines the topic of the final 30-minute discussion. A high score unlocks the 'Premium Paradox' (a complex, unresolved edge-case); a low score results in the 'Standard Drill' (a textbook application).

  ## 2. The Case Study: Algorithmic Procedural Fairness
  **Context:** A local council proposes using a machine-learning algorithm to allocate housing support.
  **The Question:** Does this specific implementation violate procedural fairness?

  **Packet A (The Efficiency Frame):**
  *   **Core Data:** The algorithm reduces processing time by 80% and eliminates human inconsistency.
  *   **Weighted Consideration:** Emphasises that 'fairness' entails equal treatment of identical cases. The algorithm guarantees this.
  *   **Hidden Caveat:** Acknowledges a lack of explainability but frames it as a trade-off for speed, citing a precedent where speed saved lives in emergency housing.
  *   **Initial Lean:** Towards 'No Violation'.

  **Packet B (The Recourse Frame):**
  *   **Core Data:** The algorithm reduces processing time by 80% and eliminates human inconsistency.
  *   **Weighted Consideration:** Emphasises that 'fairness' entails the right to understand and challenge a decision. The algorithm is a 'black box'.
  *   **Hidden Caveat:** Acknowledges the speed benefit but cites a precedent where lack of explainability led to systemic bias that went unchallenged.
  *   **Initial Lean:** Towards 'Violation'.

  *Note: Both packets contain the exact same core statistics. The divergence arises from the normative weighting of the caveats.*

  ## 3. The Scoring Protocol (Incentives)
  Students are awarded **Epistemic Credit (EC)** points. The class total determines the final session topic.

  1.  **Convergence Bonus (10 points):** If the pair agrees on a final confidence interval (e.g., both say 60–70% likely to be unfair).
  2.  **Coherence Penalty (-15 points):** If a student maintains a 'Full Peer' rating (5/5) for their partner while holding a belief confidence that differs from the partner's by more than 20%. (This forces the choice: agree or downgrade).
  3.  **Arrogance Penalty (-10 points):** If a student downgrades their partner's peer status (below 4/5) but cannot cite a specific evidential asymmetry from the packets to justify it. (This prevents arbitrary ad hominem downgrading).
  4.  **Cascade Trigger:** In Round 2, partners exchange their peer ratings. If Student A downgrades Student B, Student B is permitted to revise their own belief *or* downgrade Student A in retaliation. If they downgrade A without new justification, both lose points.

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10: Introduction and Distribution**
  *   Instructor outlines the rules and stakes. No philosophical theory is introduced.
  *   Pairs are formed. Packets A and B are distributed privately.
  *   **Task:** Students read silently.

  **00:10 – 00:20: Initial Assessment (Private)**
  *   Students complete **Form 1**:
      *   Q1: Confidence that fairness is violated (0–100%).
      *   Q2: Anticipated Peer Rating of partner (1–5 scale, assuming they are a random classmate).
  *   Forms are sealed in envelopes.

  **00:20 – 00:35: Round 1 Deliberation (First-Order)**
  *   Pairs discuss the case. They must share the *content* of their packets but not their initial confidence scores yet.
  *   **Goal:** Attempt to reach a shared conclusion.
  *   **Constraint:** They must identify where their evidence overlaps and where it diverges.

  **00:35 – 00:45: Round 1 Submission and Revelation**
  *   Students complete **Form 2**:
      *   Q1: Revised Confidence (0–100%).
      *   Q2: Revised Peer Rating of partner (1–5).
  *   **Rule:** If Confidence Gap > 20%, Peer Rating *must* be 4 or lower to avoid the Coherence Penalty.
  *   Partners reveal Form 2 to each other.

  **00:45 – 00:55: Round 2 Calibration (The Cascade)**
  *   Students observe their partner's rating of them.
  *   **Scenario:** If A rated B as a '4' (diminished peer) because B didn't move on belief, B now sees they are not trusted.
  *   **Task:** Complete **Form 3**.
      *   Q1: Final Confidence.
      *   Q2: Final Peer Rating.
      *   Q3: Justification for any rating below 5 (must reference packet details).
  *   *Incentive:* If B feels A's downgrading was unjustified (i.e., A was being steadfast without cause), B is incentivised to downgrade A to protect their own EC score (avoiding the Coherence Penalty on their end). This creates the cascade.

  **00:55 – 01:05: Scoring and Aggregation**
  *   Pairs submit forms. Instructor rapidly calculates the class total.
  *   Instructor announces the outcome (Premium vs. Standard topic).
  *   Students are instructed not to discuss the 'fairness' of the game yet.

  **01:05 – 01:30: Debrief and Philosophical Mapping**
  *   Structured discussion connecting the simulation mechanics to epistemological concepts.

  ## 5. Materials Needed
  1.  **12 Information Packets:** 6 marked 'A', 6 marked 'B'.
  2.  **36 Forms:** 3 per student (Form 1, 2, 3).
  3.  **12 Envelopes:** For sealing initial assessments.
  4.  **Scoreboard:** Whiteboard to track the class EC total.
  5.  **Timer:** Visible to all students.

  ## 6. The Debrief: Mapping the Simulation
  The instructor must guide the discussion through three specific phases, mapping the game mechanics to the target philosophical concepts without relying on named secondary literature.

  ### Phase 1: The Conciliationist Pressure (01:05 – 01:15)
  *   **Question:** "Why did the rules penalise you for keeping a high peer rating while maintaining a large belief gap?"
  *   **Mapping:** This mirrors the **Total Evidence View** or conciliationist intuition. If you acknowledge someone is your epistemic equal (peer), and you share the same evidence, rationality demands you move your credence towards theirs. To do otherwise is to claim access to evidence or reasoning they lack.
  *   **Observation:** Point out pairs who converged quickly. They prioritised the Convergence Bonus. Ask if they genuinely changed their minds or merely 'gamed' the score. This highlights the difference between *doxastic revision* and *strategic compliance*.

  ### Phase 2: The Calibration Cascade (01:15 – 01:20)
  *   **Question:** "In Round 2, when you saw your partner had downgraded your peer status, how did that affect your rating of them?"
  *   **Mapping:** This is the **Calibration Cascade**.
      *   Step 1: We disagree.
      *   Step 2: I conciliate slightly, but you do not.
      *   Step 3: I infer you are less competent (downgrade peer status).
      *   Step 4: You see my downgrade. You infer *I* am irrational for downgrading you (since you felt your stance was justified).
      *   Step 5: You downgrade me.
  *   **Philosophical Point:** Peer status is not a fixed background condition; it is a dynamic variable that shifts with first-order disagreement. The simulation forces the realisation that 'peerhood' is fragile.

  ### Phase 3: Steadfastness and the Uniqueness Thesis (01:20 – 01:30)
  *   **Question:** "Did anyone refuse to lower their peer rating despite the penalty? Why?"
  *   **Mapping:** This represents the **Steadfast View**. Some students will argue that their packet contained a 'knock-down' consideration that the partner missed.
  *   **The Uniqueness Thesis:** If students believe there is only one rational response to the evidence, they cannot treat the partner as a peer *and* remain steadfast. They must conclude the partner is irrational.
  *   **Discussion:** Ask if it is possible to remain steadfast without downgrading the partner. (Only if one rejects the Uniqueness Thesis, allowing for permissivism).

  ## 7. Predicted Failure Modes and Limitations

  ### Failure Mode 1: The Ad Hominem Interpretation
  *   **Prediction:** Students will treat the 'Peer Rating' as a personal assessment of intelligence or character rather than an epistemic weight adjustment. They may feel insulted by a '3/5' rating and retaliate emotionally in Round 2.
  *   **Philosophical Correction:** Use this to distinguish between *competence* (general ability) and *current epistemic position* (specific handling of this evidence). The cascade fails when students view peer-downgrading as a social slight rather than a Bayesian update.

  ### Failure Mode 2: Strategic Collusion
  *   **Prediction:** Pairs may agree to ignore the penalties, both rating each other 5/5 and splitting the difference on belief purely to maximise class EC.
  *   **Philosophical Correction:** Highlight that this simulates 'spurious consensus'. In real epistemology, agreeing for the sake of agreement violates the norm of truth-seeking. The Arrogance Penalty is designed to catch this; if they rate 5/5 but cannot explain *why* the evidence supports the middle ground, they lose points.

  ### Limitation: Stability of Belief Networks
  *   **Critique:** The simulation necessarily fails to reproduce the **stability of long-term belief networks**.
  *   **Explanation:** In the game, peer status is reset every round. In reality, we have long-standing relationships with epistemic peers (colleagues, mentors). We are often more steadfast with long-term peers because we trust their overall network of beliefs, even if they err on a specific case.
  *   **Takeaway:** The simulation exaggerates the volatility of peer status. Real-world epistemology involves a 'buffer' of trust that prevents immediate cascades. The game isolates the logic of disagreement by stripping away the history of trust, which is methodologically useful but empirically incomplete.

  ### Limitation: The 'Correct' Answer
  *   **Critique:** The instructor holds a scoring key, implying there is a 'correct' confidence level.
  *   **Explanation:** In genuine philosophical disputes (like procedural fairness), there may be no fact of the matter.
  *   **Takeaway:** Acknowledge that the scoring is a pedagogical device to force movement. In the wild, the 'cost' of disagreement is social or practical, not numerical. The simulation quantifies the unquantifiable to make the tension visible.

  ## 8. Instructor Notes for British English Usage
  *   Ensure all handouts use 's' rather than 'z' in words like 'standardise', 'rationalise', and 'analyse'.
  *   Use 'programme' for the seminar schedule.
  *   Refer to the 'marking' of forms rather than 'grading'.
  *   Ensure the tone remains collegial; the stakes are low enough that frustration should be channeled into philosophical inquiry rather than genuine distress.
