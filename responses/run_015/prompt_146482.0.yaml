  I reject step (4).

  Finite iterations of mutual knowledge, regardless of how large $T$ becomes, do not mathematically constitute common knowledge, and the No-Trade theorem in step (5) strictly requires common knowledge to hold. In game-theoretic terms, there is a discontinuity between "mutual knowledge to level $T$" and "common knowledge" (infinity); agents at level $T$ still entertain the possibility that the other agent stopped reasoning at level $T-1$, which prevents the fixed-point convergence of beliefs that the No-Trade theorem relies on. By rejecting (4), you preserve the Common Prior Assumption (1) because the traders are not actually in the epistemic state required to force belief convergence; they only possess high-order mutual knowledge, which allows private signals to retain marginal value even after many rounds.

  This diagnosis commits you to the view that rationality is bounded by the depth of recursive reasoning agents can practically perform, meaning information aggregation is always asymptotic and never perfect in finite time. You lose the guarantee that any finite mechanism can fully eliminate speculative volume or reconcile all dispersed evidence, but you keep the thought that disagreement is always traceable to uncleared evidence rather than fundamental prior differences. Giving up (1) would indeed cost you that thought, forcing you to accept that rational agents can permanently disagree on the same evidence, but giving up (4) allows you to maintain that all persistent disagreement is ultimately due to information that hasn't yet been fully processed or shared, preserving the link between disagreement and error/evidence.
