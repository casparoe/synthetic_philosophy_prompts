answer: |-
  This institutional asymmetry exposes a profound tension within contemporary liberal democracies, often described by political theorists as **"liberalism for insiders, communitarianism for outsiders."** The pattern you describe presupposes a specific, often unacknowledged, hierarchy of moral worth and political standing. Below is a reconstruction of the implicit theory, an analysis of its philosophical commitments, and a proposal for a bidirectional redesign.

  ### 1. Philosophical Commitments of the Asymmetry

  The dual standard rests on three core philosophical commitments that diverge from strict liberal universalism:

  *   **Distributive Justice as Tiered Entitlement:** The system presupposes that distributive justice is not uniform. For native-born citizens, welfare is a **right of status** (based on membership). For immigrants, welfare is a **privilege of performance** (based on compliance). This implies a "two-tiered" theory of justice where the safety net is a social right for the established demos but a contractual benefit for the aspiring one.
  *   **Political Membership as Ascriptive vs. Performative:** For natives, membership is **ascriptive** (given by birth or soil); it is presumed stable and does not need to be continually earned. For immigrants, membership is **performative**; it must be enacted through language acquisition, value signaling, and economic self-sufficiency. This suggests that "true" membership requires a proof of loyalty that birthright citizens are exempt from providing.
  *   **Cultural Identity as a Boundary Marker, Not a Shared Practice:** The state treats liberal-democratic values not as a universal grammar to be spoken by all residents, but as a **cultural boundary** used to distinguish "us" from "them." By exempting natives from value testing, the state implies that native culture is inherently aligned with liberal norms, while immigrant cultures are inherently suspect. Identity is thus treated as static for natives (they *are* the norm) and malleable for immigrants (they must *become* the norm).

  ### 2. Reconstructing the Implicit Theory

  What kind of theory justifies this arrangement? It is best understood as a hybrid of **Welfare Chauvinism** and **Liberal Nationalism**.

  *   **Welfare as Democratic Reciprocity (Reserved for Co-nationals):** The system treats the welfare state as a club good. Natives are viewed as long-term shareholders who have implicitly contributed to the social capital over generations. Immigrants are viewed as new entrants who must prove they will not drain the capital. However, because natives are not actually tested for their contribution or adherence to norms, this "reciprocity" is largely mythical. It functions more as a presumption of trust for insiders and a presumption of risk for outsiders.
  *   **Welfare as an Instrument of Assimilation:** This is the dominant function. By tying benefits and naturalization to civic exams and contracts, the state uses its distributive leverage to engineer cultural homogeneity. The theory here is that social cohesion requires value homogeneity, and because the state cannot coerce natives into cohesion, it must coerce newcomers.
  *   **The "Fair Play" Pretext:** The implicit argument is that immigrants are asking for a change in status, so they bear the burden of proof. However, this ignores that the welfare state itself changes demographically through immigration. The theory effectively posits that **stability requires stasis**, and therefore those who introduce change (immigrants) must bear the cost of neutralizing that change.

  ### 3. Solidarity vs. Gatekeeping

  Is this practice consistent with the claim that solidarity requires shared values? **No.** It reveals that claim to be instrumental rather than principled.

  *   **The Inconsistency:** If shared liberal values were genuinely the prerequisite for social solidarity and welfare access, then native-born citizens who actively reject liberal norms (e.g., extremists, those who refuse civic participation, or those who undermine democratic institutions) would theoretically face benefit sanctions or denaturalization. They do not.
  *   **Culture as Gatekeeping:** Consequently, culture functions as a **one-directional gatekeeping device.** It is not used to ensure the *quality* of the citizenry's values, but to manage the *composition* of the citizenry. It protects the native population from the obligation to integrate while placing the entire burden of adaptation on the newcomer.
  *   **The "Liberal Paradox":** This creates a paradox where the state illiberally restricts access to rights (via testing and conditionality) in the name of protecting liberal values. It suggests that the "solidarity" being protected is not actually based on shared values, but on **shared identity**, where "identity" is coded by origin rather than belief.

  ### 4. Rebuilding on Mutual Obligations (A Bidirectional Design)

  If we rebuild this system on the premise that entry into a welfare state creates **mutual obligations of integration**, the design shifts from an *Assimilationist Contract* to a *Democratic Covenant*. Integration becomes a public good produced by both the state and the resident, rather than a private duty of the migrant.

  **Key Structural Changes:**

  1.  **Universal Civic Education:**
      *   *Current:* Immigrants take language and values courses.
      *   *Redesign:* Civic and values education becomes mandatory and free for **all** residents, including native-born citizens (e.g., as part of secondary schooling or continuous adult education). If "liberal values" are the glue of society, every member must be accountable to them.
      *   *Enforcement:* Mechanisms for holding natives accountable for violations of democratic norms (e.g., hate speech, anti-democratic activism) are strengthened, potentially linking certain public privileges to adherence to a code of conduct applicable to everyone.

  2.  **Welfare as a Right of Residence, Not a Reward:**
      *   *Current:* Benefits are conditional on passing integration tests.
      *   *Redesign:* Access to the social safety net is decoupled from cultural performance. It is granted based on residence and need. This acknowledges that economic insecurity hinders integration; forcing the poor to pay for courses or risk benefits creates a poverty trap, not integration.

  3.  **State Obligations in the "Integration Contract":**
      *   *Current:* The immigrant signs a contract pledging adherence.
      *   *Redesign:* The contract is bilateral. The immigrant pledges adherence to the law; the **State pledges** to combat discrimination, recognize foreign credentials, and provide language training. If the state fails to provide meaningful pathways to inclusion (e.g., through systemic labor market discrimination), it is in breach of the contract.

  4.  **Naturalization as Recognition, Not Examination:**
      *   *Current:* Naturalization requires passing a test on history and values.
      *   *Redesign:* Naturalization is based on duration of residence, legal compliance, and social ties. The "test" is replaced by an interview or declaration that is dialogic rather than examinatory. This treats naturalization as the formal recognition of an existing social fact (that the person is already part of society) rather than a graduation ceremony.

  5.  **Cultural Literacy as a Two-Way Street:**
      *   *Current:* Immigrants must learn the native language and history.
      *   *Redesign:* Public institutions are required to demonstrate "migrant literacy." Civil servants, healthcare providers, and educators receive training on the cultural backgrounds of the populace they serve. The majority culture is expected to adapt its public sphere to accommodate new linguistic and cultural realities (e.g., multilingual public services), acknowledging that the "national culture" is evolving.

  ### Conclusion

  The current asymmetry presupposes that the welfare state is a fortress to be guarded by cultural tests, where natives are the guardians and immigrants are the supplicants. It treats solidarity as a resource to be protected from dilution. A bidirectional model, by contrast, treats the welfare state as a **project of ongoing construction**. It acknowledges that when new members enter, the definition of "we" changes. In this redesigned system, integration is not something immigrants *undergo*; it is something the society *does* together, with obligations of adaptation, learning, and respect running in both directions.
