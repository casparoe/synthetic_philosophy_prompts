answer: |-
  ### 1. Dependency Order
  **Dennett First, Then Caruso.**
  You must establish Dennett's forward-looking framework *before* deploying Caruso's critique. Caruso's charge is that compatibilism *smuggles* retributivism into a pragmatic system. Your seniors cannot spot the smuggling if they haven't first seen the vehicle (Dennett's pragmatic responsibility) being loaded. If you start with Caruso, the "smuggling" accusation hangs in the void; if you start with Dennett, they buy into the pragmatism, making Caruso's revelation that "this is still just desert in disguise" land as a genuine philosophical shock.

  **The Arc:**
  1.  **The Carrying Case** (Elicit intuition).
  2.  **Dennett** (Systematize the intuition: Pragmatic Responsibility).
  3.  **Caruso** (Destabilize the system: The Smuggling Charge).
  4.  **Tension Check** (Force a reconciliation).

  ### 2. The Carrying Case
  **Case:** **The "Calculated Risk" Structural Engineer.**
  A senior engineer approves a cost-saving material substitution for a pedestrian bridge. He knows the statistical risk of failure is non-zero (1 in 10,000) but deems it acceptable to meet budget/deadline. The bridge collapses; three people die. He is not malicious, intoxicated, or coerced.

  **Must Include:**
  *   **Conscious Risk Assessment:** He must have *known* the risk and weighed it. (This triggers Dennett's "capacity to respond to reasons").
  *   **Catastrophic Outcome:** Death must occur. (This triggers the visceral demand for suffering).
  *   **Systemic Pressure:** He was under pressure to cut costs. (This triggers Caruso's "deterministic circumstances").

  **Must Leave Out:**
  *   **Malice/Intent to Harm:** If he wanted them dead, it's murder, and the free will debate vanishes.
  *   **Intoxication or Pathology:** If he was drunk or manic, it becomes a medical/legal technicality, not a philosophical one.
  *   **Direct Coercion:** If his boss said "Do it or you're fired," it becomes duress. He must have had a viable, albeit costly, alternative.

  ### 3. Misconceptions & Blocking Points
  **Misconception 1: "Dennett is saying punishment is just therapy with cops."**
  *   **When it hits:** Immediately after you explain Dennett's "forward-looking" justification. Seniors hear "pragmatic" and think "rehabilitation."
  *   **Where to block:** **Right after presenting Dennett's view.** Explicitly state: "Dennett is not softening the blow. He argues we must keep the *harshness* of punishment to maintain the efficacy of the threat. It is not therapy; it is moral inoculation."

  **Misconception 2: "Caruso wants to empty every prison."**
  *   **When it hits:** Immediately after you explain Caruso's rejection of just deserts. Seniors hear "no desert" and think "no confinement."
  *   **Where to block:** **When introducing the Public Health Quarantine Model.** Explicitly state: "Caruso does not release the engineer. He quarantines him for safety. The *suffering* is the problem, not the *separation*."

  **Misconception 3: "This is just semantics; the outcome is the same."**
  *   **When it hits:** During the synthesis/discussion. Seniors will argue that if both lock the engineer up, the debate is pointless.
  *   **Where to block:** **In the final 10 minutes.** Point out that the *justification* dictates the *conditions*. If it's desert (Dennett-adjacent), he *must* suffer. If it's quarantine (Caruso), his confinement must be as humane as possible. The *experience* of the prison changes even if the *walls* remain.

  ### 4. End-of-Session Check
  **The "Surgical Removal" Prompt.**
  Do not ask them to vote. Ask them to write a single paragraph answering this:
  *"To fully adopt your preferred philosopher's view on the Engineer, what specific part of your own visceral reaction to the case must you surgically remove?"*

  *   **Why this works:** If they pick Dennett, they must admit they are suppressing the urge for "ultimate" blame. If they pick Caruso, they must admit they are suppressing the urge for the engineer to *suffer* for the sake of suffering. If they write "Nothing," they haven't felt the tension.

  ### 5. The Dennett Skip
  **Skip:** **The Evolutionary Genealogy of "Avoidability."**
  Dennett spends significant time (e.g., in *Freedom Evolves*) detailing how responsibility evolved from simple feedback loops in bacteria up to human cognition ("Competence without Comprehension").

  **Admission Script:**
  *"I am explicitly skipping Dennett's evolutionary story about how 'avoidability' emerged from biological competence. That argument grounds why we have the capacity for responsibility. Today, we are assuming we have that capacity and debating whether using it to justify punishment is morally honest. We are skipping the biology to focus on the ethics."*
