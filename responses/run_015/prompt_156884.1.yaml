prompt: |-
  I'm in a reading group for my early modern political thought class and we're spending way too long on Hobbes right now. This week we got into a dumb argument about his view on geometry, and I definitly came away more confused than when we started. I'm looking at the part of Leviathan where he talks about reason as reckoning and then makes that striking claim about geometry being the only science God has given us (I think it's in the chapter titled Of Reason and Science), but I'm working from a blurry screenshot of a public-domain scan and don't have a clean copy with me, so I'm going to paraphrase the passage rather than quote it—no quotation marks, just the gist, since I don't trust myself to reproduce 17th-century spelling from memory. Here's the bit I mean:

  Reason is just reckoning, that is, adding and subtracting the consequences of general names that we have agreed to use to mark and signify our thoughts. Because the significations of words are settled by human agreement and not by nature, anyone who wants to reason demonstratively has to begin by settling the meanings of their terms; if they don't, their conclusions are not science but empty noise. Geometry is therefore the only science that God has so far been pleased to bestow on mankind, since it alone proceeds from definitions whose significations have been settled and then draws consequences that cannot be doubted. Other subjects, including the study of commonwealths, can become sciences only by imitating this geometrical method: first give precise definitions of the words, then reason from them in due order, rather than dressing up unexamined opinions as knowledge.

  What's tripping me up is the exact status of the necessity here. To argue about it, my friends and I invented a shorthand: call a truth reckoning-relative if its necessity comes entirely from how we have settled the definitions of the words, and call it world-imposed if the definitions latch onto something independent of our agreement, so that once the terms are rightly understood the consequences could not have been otherwise. (That's our own label, not Hobbes's, just to be clear.) Using that shorthand, is the passage saying geometrical truths are reckoning-relative, so that God bestowing geometry just means God gave us the ability to reckon and to agree on definitions? Or is Hobbes better read as a world-imposed theorist here, thinking that correct definitions capture the real natures of body and motion, so geometry is a science of the actual world and not merely a game of conventions? A related thing: Hobbes also says science is knowledge of consequences while prudence is only expectations from experience, which makes me wonder whether, on his view, there is no such thing as an empirical science of nature at all—only geometry and the civil philosophy that copies it. I thought Hobbes was supposed to be some kind of empiricist about where concepts come from, so this all sounds weirdly rationalist, and none of us could tell whether we were onto a real interpretive problem or just confusing ourselves.

  So please help me understand what this passage is actually committing Hobbes to. Walk me through how the bits about reckoning, settling the significations of words, and the claim that geometry is the only science fit together, and tell me whether our reckoning-relative vs world-imposed distinction maps onto a genuine issue in Hobbes or whether one of us is just inventing a problem. Be concrete about what would have to be true for geometry to count as bestowed by God on his account, and say whether civil philosophy ends up being a science in the same full sense or only by analogy to geometry. Don't give me a bibliography or citations—I just want the conceptual map, since the model answering this won't have web access anyway. Please end with a one-sentence summary of your answer as the very last line, with nothing after it.
