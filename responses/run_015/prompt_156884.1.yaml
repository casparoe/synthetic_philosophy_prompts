answer: |-
  Your shorthand distinction between reckoning-relative and world-imposed necessity is not only useful, it actually cuts straight to the core of Hobbes's epistemology, and your confusion stems from the fact that Hobbes is deliberately combining an empiricist origin of concepts with a rationalist, constructivist method of science. To understand the passage, you have to see that for Hobbes, science is not about discovering independent truths hidden in nature, but about constructing certain knowledge from principles we establish ourselves.

  When Hobbes defines reason as reckoning, he is saying that truth is a property of propositions (statements), not of things themselves. A proposition is true when the predicate name includes the subject name (e.g., "a man is a living creature"), and this relationship is established by how we have agreed to define those names. Therefore, the necessity of a scientific conclusion is always conditional on the definitions we start with. This aligns perfectly with your category of reckoning-relative. The necessity does not come from the external world forcing itself upon us; it comes from the logical consistency of the linguistic framework we have built. If we change the definitions, the consequences change.

  This explains why geometry is the only science God has bestowed. Hobbes is not saying God handed us a book of geometric truths existing in a Platonic heaven. He is saying God gave us the faculty to create definitions and the liberty to construct figures in our minds or on paper. Because we create the objects of geometry (we define what a line is, we draw the circle), we know their causes perfectly. We know exactly why a triangle has three angles because we constructed the definition of the triangle. The certainty is guaranteed because the object is dependent on our stipulation. In your shorthand, geometry is reckoning-relative, and that is precisely why it is certain.

  Conversely, this is why natural philosophy (physics) cannot be a science in the strict sense. We did not make nature; God did. The causes of natural phenomena are world-imposed. We can observe effects and guess at causes (prudence), but we cannot demonstrate them with necessity because we do not know the essential definitions of natural things with perfect certainty. We cannot look inside God's mind to see how He defined "stone" or "fire." Therefore, there is no empirical science of nature for Hobbes that yields demonstrative certainty. Physics remains hypothetical and probabilistic.

  This leads directly to the status of civil philosophy. You asked if it is a science in the same full sense or only by analogy. For Hobbes, it is a science in the same full sense as geometry, not merely an analogy. The reason is that the commonwealth is an artificial man made by human covenant. Just as we construct geometric figures, we construct the state through our agreements and definitions of rights, persons, and sovereignty. Because we are the authors of the commonwealth, we can know its causes and consequences demonstratively. We can say with geometric certainty that if you define sovereignty this way, dissolution will follow, because we established the definitions and the structure. Civil philosophy succeeds where physics fails because it is reckoning-relative like geometry, not world-imposed like natural science.

  Regarding your worry about empiricism versus rationalism: Hobbes is an empiricist about the *materials* of thought (all ideas originate in sense experience) but a rationalist/constructivist about the *method* of science. We get the names from experience, but we settle their significations by agreement, and then we reckon with them to produce science. The "weirdly rationalist" feel you are getting is accurate because Hobbes believes certainty is only possible where the human mind imposes order on the material, either in geometry or in politics.

  So, your group's distinction maps onto a genuine and critical feature of Hobbes's system. He is committed to the view that scientific necessity is reckoning-relative. If geometry were world-imposed (dependent on finding perfect circles in nature), it would be uncertain like physics. It is a science only because it is a game of conventions played with perfect consistency. Civil philosophy joins geometry in the realm of science because it too deals with constructs of human making, whereas natural philosophy is excluded from strict science because it deals with God's constructs, which we can observe but not fully know.

  Hobbes commits to the view that geometry and civil philosophy are sciences precisely because their truths are reckoning-relative, grounded in definitions we construct ourselves, whereas natural philosophy remains conjectural because its causes are world-imposed by God and thus beyond our demonstrative grasp.
