      *   *Side B (Non-Doxastic):* Let's call her **Elena**. She wants to preserve the structural role of hinges. She needs to explain why ordinary language ("I know") is misleading in philosophical contexts.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Leaving the lecture hall. Reaction to the speaker's Moorean claim.
      *   **Initial Clash:** Mark thinks the speaker was right (we believe it). Elena thinks the speaker missed Wittgenstein's point (it's not a claim to know).
      *   **Deepening the Dispute (The "Ordinary Person" Objection):**
          *   Elena needs to explain why we shouldn't trust the ordinary assertion "I know I have hands."
