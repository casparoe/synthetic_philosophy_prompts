  4.  **Drafting - Specific Arguments & Lines:**

      *   *Elena (Non-Doxastic):* "Wittgenstein wasn't doing epistemology; he was doing grammar." "You can't doubt the rules while playing." "If it's a belief, it's open to doubt. But this isn't."
      *   *Mark (Doxastic):* "But I act *as if* it's true." "If I lose a hand, I update my commitment." "If it's not a belief, how does it guide action?"
      *   *The "Ordinary Person" point:* Elena: "Ordinary language goes on holiday." Mark: "But philosophy starts with ordinary language."
