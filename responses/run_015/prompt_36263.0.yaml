      *   **Core Dispute:** The status of "hinge commitments."
          *   *Side A (Doxastic/Orthodox):* Hinges are genuine beliefs (propositional, truth-apt) but evidentially unsupported/unknowable.
          *   *Side B (Non-Doxastic/Structural):* Hinges are not beliefs but rules/framework presuppositions (non-propositional, not truth-apt, not rationally revisable).
      *   **Format:** A dialogue between two philosophers leaving a talk.
      *   **Context:** The talk featured a speaker claiming Moore-style knowledge ("I know I have hands").
      *   **Requirements:**
          *   Genuine back-and-forth (not just trading monologues).
