prompt: |-
  I do advance care planning at a community mental health clinic — the psychiatric kind, where somebody who's doing okay right now writes down what should happen the next time they aren't. I'm the one who sits with them and drafts it; a psychiatrist signs off on the clinical bits but honestly she rubber-stamps whatever I put in front of her. I've done maybe three hundred of these over four years, fourty minutes a session, and I also get the 2am call from the ER when one of these documents is the only thing anybody has to go on. So: high stakes, almost no time, and the person applying it is often a resident who has never met the client.

  The story I absorbed from rationalist blog posts years ago is too crude for what I actually see. It says: the person who wrote the document is the real agent, the person in the room is impaired, so the document wins. But the hard cases dont look like that. From the spreadsheet I keep, they split into at least four different things. (1) Plain capacity dips — the person can't reason right now and thanks us later. Easy, maybe sixty percent of calls. (2) Value drift — they're reasoning fine, they've just changed their mind, and they say the old self was scared, or brainwashed, or just wrong. Sometimes they're right! (3) New information — a reason the earlier self never weighed: a side effect that showed up years later, a new diagnosis, a baby, a breakup. The earlier self didn't reject this reason, they never heard it. (4) Trigger gaming — the earlier self wrote a precise trigger and the current self stays just inside it: four hours of sleep instead of three, gives away two hundred dollars instead of whatever the number was, refuses without quite using the words the document keys on. Technically it hasn't fired. And then there's a pattern I only noticed recently: some directives bind the outcome (force the shot if I say no) and some only bind the process (call my sister, make me wait a day, don't let me sign anything), and the process ones basically never blow up in my face.

  What I want is a procedure, not a theory dump. Ordered questions I can run in a session or in ninety seconds on the phone; what counts as a good enough answer to each; where the procedure just stops and says no, honor the document (or no, ignore it); and where it has to hand the decision to a human being because the question is values, not facts. Tell me what to do when I can't get an answer — client won't articulate reasons, nobody who knew them is reachable, it's 2am. Assume I have no philosophical training and I have to be able to explain the result to a sibling who thinks I steamrolled their brother. Please don't give me a reading list; I know the Ulysses stuff and the precommitment discourse, I need something I can run.

  Then run it on three. (A) A client with bipolar I whose directive says treat me as unable to refuse meds if I've slept under four hours for three nights and I'm giving money away. She's on night two, maybe four hours, gave two hundred bucks to a church raffle, perfectly coherent, refusing. Does the trigger fire? (B) A directive written eleven years ago by someone who has since had a serious religious conversion and now says the person who wrote it was a different and worse person and wants the whole thing voided — coherent, not manic, sober. Do I void it? (C) Different scale: our clinic adopted a policy in 2016 after a bad incident, never call the police on a patient, and the same policy made repeal require a two-thirds vote. Everybody currently on staff thinks it's too strong and it's never been repealed. Last week a patient broke a nurse's arm. Does the policy bind us, and is the group case even the same shape as the individual one or am I importing the wrong analogy?

  One of those should give me an answer I don't like. I'd rather have that than a rule that always sides with the earlier self. And be straight about what the procedure can't do, where it'll misfire, and the cheapest way to catch a misfire before it hurts somebody — an expiry date, a re-signing ritual, a single question I always have to ask.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Advance Care Planning (ACP) Facilitator at a community mental health clinic (psychiatric).
      *   **Experience:** High volume (300+ over 4 years), high stakes (2am ER calls), practical reality vs. theoretical ideal.
      *   **Problem:** The standard "Ulysses Contract" theory (Past Self > Present Self) is too crude. Real life has nuances (Capacity, Value Drift, New Info, Trigger Gaming, Process vs. Outcome).
      *   **Goal:** A *procedure*, not a theory. Ordered questions, decision thresholds, stop conditions, hand-off points. Needs to be usable in 90 seconds on the phone or a session. Needs to be explainable to a grieving/angry sibling.
      *   **Constraint:** No philosophical reading lists. Needs to handle uncertainty (client silent, no contacts).
      *   **Task:** Create the procedure, then apply it to three specific cases (A, B, C). One case must yield an uncomfortable answer. Acknowledge limitations/failure modes.

  2.  **Deconstruct the Clinical/Ethical Landscape:**
      *   The user identifies four categories of conflict:
          1.  Capacity Dips (Easy).
          2.  Value Drift (Hard - who is the "real" person?).
          3.  New Information (Hard - was the old decision informed?).
          4.  Trigger Gaming (Hard - technical compliance vs. spirit).
      *   Observation: Process directives (wait, call sister) work better than Outcome directives (force the shot).
      *   Need: A triage algorithm that respects autonomy (past and present) while prioritizing safety and minimizing harm.

  3.  **Drafting the Procedure (The "90-Second Triage"):**
      *   *Goal:* actionable steps.
      *   *Structure:* Decision Tree.
      *   *Step 1: Safety/Emergency.* Is someone in immediate danger? (If yes, emergency hold overrides almost everything usually, but let's stick to the ACP context).
      *   *Step 2: Capacity Check.* Can they understand the consequence *now*? (Distinguishes Category 1 from 2, 3, 4).
      *   *Step 3: The "Why" Check.* Why are they refusing the directive? (Distinguishes Drift vs. New Info).
      *   *Step 4: Trigger Specificity.* Did the technical conditions meet? (Addresses Gaming).
      *   *Step 5: Process vs. Outcome.* Can we compromise on process?
      *   *Decision Rules:* When to honor, when to override, when to escalate.

      *Refining the Procedure:*
      *   Make it a checklist.
      *   Include a "Stop Rule" (When to ignore the document).
      *   Include a "Hand-off Rule" (When to get a second opinion/ethics consult).
      *   Include the "Explainability Test" (Can I say this to the sibling?).

  4.  **Developing the Cases:**

      *   **Case A (Bipolar, Sleep/Money Trigger):**
          *   *Facts:* Directive = <4hrs sleep x3 nights + giving money. Current = Night 2, ~4hrs, $200 raffle. Coherent. Refusing.
          *   *Analysis:* Trigger technically *not* met (Night 2 vs 3). "Giving money" is vague ($200 raffle vs. reckless spending). Client is coherent.
          *   *Procedure Application:* Check triggers. They fail. Check capacity. Intact.
          *   *Verdict:* Do not enforce. Monitor.
          *   *Uncomfortable?* Maybe not enough. Let's look closer. If we wait for Night 3, she might crash. But the contract says 3. Enforcing on 2 is a violation.
          *   *Decision:* Do not enforce *yet*. This highlights the risk of rigid triggers.

      *   **Case B (Religious Conversion, 11 Years Later):**
          *   *Facts:* Directive 11 years old. Serious religious conversion. Claims "old self was worse." Coherent, sober.
          *   *Analysis:* This is Value Drift (Category 2). Is it mania? No. Is it coercion? No. It's a fundamental identity shift.
          *   *Procedure Application:* Capacity intact. Reason is "Values Changed." Time gap is significant (11 years).
          *   *Verdict:* Void the directive. The "Present Self" has sustained a new identity.
          *   *Uncomfortable?* Yes. It invalidates the safety net the Past Self built. But enforcing it violates current autonomy of a competent adult.

      *   **Case C (Clinic Policy, Police, Broken Arm):**
          *   *Facts:* 2016 Policy (No police). Repeal needs 2/3 vote. Staff want change. Patient broke nurse's arm.
          *   *Analysis:* Institutional Ulysses Contract.
          *   *Comparison:* Is it the same shape? Individuals change values/biology. Institutions change staff/policy. But the "Past Board" vs. "Current Staff" dynamic is similar. However, safety liability is different.
          *   *Verdict:* Policy does *not* bind in the face of criminal assault/safety threat. Safety overrides policy. The analogy breaks because institutions have a duty of care to staff that individuals don't have to themselves.
          *   *Uncomfortable?* It admits the analogy fails. Or, it admits the policy *should* bind but won't because of liability. Let's argue the policy *doesn't* bind because the "trigger" (immediate violence) exceeds the scope of the policy's intent (de-escalation).
          *   *Wait, the prompt asks:* "Does the policy bind us, and is the group case even the same shape?"
          *   *Decision:* No, it doesn't bind in this extreme case. And no, the shape is different because institutions have fiduciary duties to third parties (staff) that individuals don't.

      *   *Selecting the "Answer I Don't Like":* Case B is the most ethically fraught for an ACP facilitator. Voiding a directive because someone "changed their religion" undermines the stability of ACPs. But respecting current capacity demands it. I will make Case B the "uncomfortable" one. Actually, Case A is safer. Case B is the real philosophical hammer. Let's make Case B the one where we *honor the current self*, effectively burning the bridge the past self built. That feels risky.
      *   *Alternative:* Case A. If we don't act on Night 2, she might manic on Night 3. But the contract says 3. If we act, we break the contract. If we don't, we risk health. The procedure says "Don't act." That's the uncomfortable truth of legalistic triggers.
      *   *Better Uncomfortable Answer:* Case B. If we void it, we admit ACPs are fragile. If we keep it, we coerce a competent adult. I will recommend voiding it. This undermines the "sanctity" of the document the user spends their life writing.

  5.  **Refining the Procedure (The "Triage Protocol"):**
      *   Need to be crisp.
      *   **Q1: Immediate Safety?** (If yes, emergency statutes apply, ACP is secondary).
      *   **Q2: Capacity?** (Understand, Weigh, Communicate).
      *   **Q3: Trigger Match?** (Strict construction).
      *   **Q4: The "New Info/Value" Test.** (Is this mania or growth?).
      *   **Q5: Process Compromise?** (Can we do the 'wait' instead of the 'shot'?).

  6.  **Addressing the "Misfire" and "Catch":**
      *   Misfire: Competent person forced (tyranny of past self) or Unsafe person freed (tyranny of present self).
      *   Catch: Expiry dates (5 years). "Sunset Clause."
      *   Cheapest Catch: The "Sister Test" (Who else knows?).

  7.  **Drafting the Response:**
      *   *Tone:* Professional, direct, peer-to-peer (no fluff).
      *   *Structure:*
          1.  The Procedure (The "90-Second Triage").
          2.  The Decision Rules (Honor, Ignore, Escalate).
          3.  The Three Cases.
          4.  The Limitations & The "Catch."

      *(Self-Correction during drafting)*: Make sure I answer the specific constraint: "One of those should give me an answer I don't like." I need to be explicit about which one and why.
      *   Case A: Strict trigger interpretation. (Uncomfortable because it feels like waiting for a crash).
      *   Case B: Voiding due to value drift. (Uncomfortable because it makes ACPs temporary).
      *   Case C: Analogy break. (Uncomfortable because it shows limits of the framework).
      *   *Decision:* I'll make Case B the uncomfortable one. It challenges the user's livelihood (writing these docs). If they expire or can be voided by "I changed my mind," the work feels less stable.

      *(Refining Case C)*: The prompt asks if the group case is the same shape. It's not. Individuals have a single continuity of consciousness (mostly). Institutions have turnover. The "Past Board" isn't the "Current Staff." I need to be clear on that.

      *(Refining the Procedure)*: Ensure it handles the "2am, no contact" scenario.
      *   If no contact + Capacity Unclear + Safety Risk = Default to Safety (Ignore ACP).
      *   If no contact + Capacity Clear + Trigger Met = Honor ACP.

      *(Final Polish)*: Check the "Explain to Sibling" constraint. The reasoning must be plain English. "He knew what he was signing" vs "She is safe right now."

  8.  **Final Review against constraints:**
      *   Procedure? Yes.
      *   Ordered questions? Yes.
      *   Good enough answers? Yes.
      *   Stop/Hand-off points? Yes.
      *   2am/No contact scenario? Included.
      *   Run on 3 cases? Yes.
      *   One uncomfortable answer? Yes (Case B).
      *   Limitations/Catch? Yes.
      *   No reading list? Yes.

      *Let's write.*
answer: |-
  Here is the procedure. It is designed for the 2am phone call or the high-tension session. It prioritizes *explainability* and *risk containment* over philosophical consistency.

  ### The 90-Second Triage Protocol

  **Step 1: The Safety Floor (10 seconds)**
  *   **Question:** Is there an immediate threat of death or serious physical injury to self or others *in the next hour*?
  *   **Yes:** Emergency statutes override the directive. Do not argue. Secure safety. Document why the directive was bypassed (Imminent Harm).
  *   **No:** Proceed to Step 2.

  **Step 2: The Capacity Check (30 seconds)**
  *   **Question:** Can the client state (a) where they are, (b) what medication/intervention is being offered, and (c) what happens if they refuse?
  *   **Fail:** They lack capacity. **Honor the Directive** (provided Step 3 passes).
  *   **Pass:** They have capacity. Proceed to Step 3.

  **Step 3: The Trigger Match (20 seconds)**
  *   **Question:** Do the objective facts meet the specific criteria in the document *exactly*? (Sleep hours, dollar amounts, specific phrases).
  *   **No:** **Do Not Honor.** You cannot enforce a Ulysses contract on a technicality. If the trigger hasn't fired, the agent (you) has no authority.
  *   **Yes:** Proceed to Step 4.

  **Step 4: The "Why" Check (30 seconds)**
  *   **Question:** Ask the client: *"You wrote this. Why should we ignore it now?"*
  *   **Answer Type A (Symptom):** "I don't need it," "You're out to get me," "I'm god." → **Honor the Directive.** (This is the illness talking).
  *   **Answer Type B (Value/Info):** "I'm a different person now," "That med caused liver damage later," "My faith changed." → **Escalate/Hand-off.** (This is a values conflict, not a capacity failure).
  *   **No Answer/Unreachable:** If you cannot reach a proxy and the client is coherent (Step 2 Pass), **Do Not Honor.** Coherence defaults to current autonomy in the absence of a proxy to confirm the drift.

  **Decision Rules**
  1.  **Honor the Document** only if: Safety Floor is clear + Capacity Failed + Trigger Met + Reason is Symptomatic.
  2.  **Ignore the Document** if: Safety Risk is Imminent OR Trigger Not Met OR Client is Coherent + No Proxy Available.
  3.  **Hand-Off (Ethics/Attending)** if: Client is Coherent + Trigger Met + Reason is Value/Info Drift. This is not a medical decision; it is a legal/ethical one. Do not make this alone at 2am.

  **The "Sibling Test" (Documentation)**
  Whatever you decide, write this sentence in the chart: *"I am [honoring/ignoring] this directive because [current safety / lack of capacity / unmet trigger / coherent objection]. A reasonable person knowing what I know would make the same call."* If you can't write that sentence, you are in the Hand-Off zone.

  ***

  ### Running the Cases

  #### Case A: The Bipolar Trigger
  *   **Facts:** Directive = <4hrs sleep x3 nights + giving money. Current = Night 2, ~4hrs, $200 raffle. Coherent. Refusing.
  *   **Protocol Run:**
      1.  *Safety:* No immediate physical threat stated.
      2.  *Capacity:* Coherent. Passes.
      3.  *Trigger:* Night 2 is not Night 3. $200 raffle is not necessarily "giving money away" in the reckless sense intended. **Trigger Failed.**
      4.  *Why:* N/A (Trigger failed).
  *   **Verdict:** **Do Not Honor.**
  *   **Explanation to Sibling:** "The document you both signed set a specific alarm. That alarm did not go off yet. If we act before the alarm, we are assaulting her, not helping her. We are monitoring her closely."
  *   **Risk:** She crashes on Night 3.
  *   **Why this stings:** You know she's tipping. But the procedure forces you to wait for the crash because the *specificity* of the trigger is the only legal shield you have. If you enforce on Night 2, you invalidate every other directive you've written because you proved triggers are suggestions, not rules.

  #### Case B: The Religious Conversion
  *   **Facts:** Directive 11 years old. Serious religious conversion. Claims "old self was worse." Coherent, sober. Wants void.
  *   **Protocol Run:**
      1.  *Safety:* No immediate threat.
      2.  *Capacity:* Coherent, sober. Passes.
      3.  *Trigger:* N/A (Client is requesting voidance).
      4.  *Why:* "Value Drift." (Answer Type B).
  *   **Verdict:** **Hand-Off / Likely Void.**
  *   **Reasoning:** This falls under Step 4, Answer Type B. A competent adult cannot be forced into treatment based on a value system they explicitly reject, unless they are currently incapacitated by the illness the directive addresses. If the conversion is stable and not a manic spiritual delusion, the "Present Self" overrides the "Past Self."
  *   **Explanation to Sibling:** "Your brother is legally an adult. Eleven years is a long time. People change religions, marriages, and minds. Unless he is currently unable to understand his choices, we cannot treat him against his will based on who he was in 2013. To do so would be unlawful imprisonment."
  *   **The Answer You Won't Like:** **You have to void it.** This undermines the stability of your entire profession. If a directive can be voided by a "sincere change of heart" 11 years later, the Ulysses contract is fragile. But the alternative is enforcing a belief system the client no longer holds, which is ethically untenable in a secular clinic. You are prioritizing *current autonomy* over *past precommitment*.

  #### Case C: The Clinic Policy (Institutional Ulysses)
  *   **Facts:** 2016 Policy (No police). Repeal needs 2/3 vote. Staff want change. Patient broke nurse's arm.
  *   **Protocol Run:**
      1.  *Analogy Check:* Is this the same shape? **No.**
      2.  *Reasoning:* An individual has a single continuity of consciousness. An institution has turnover. The "Past Board" is not the "Current Staff." More importantly, an individual assumes risk to themselves. An institution assumes risk to *third parties* (employees).
      3.  *Safety Floor:* A broken arm is an immediate safety threat/criminal act.
  *   **Verdict:** **Policy Does Not Bind.** Call the police.
  *   **Explanation to Staff:** "This policy was designed for de-escalation of symptoms, not coverage of criminal assault. The 'Safety Floor' (Step 1) overrides internal policy. We are not bound by a past vote to endanger current employees."
  *   **Key Distinction:** Individual directives protect the self from the self. Institutional policies protect the org from liability. When they conflict with physical safety of staff, the duty of care to the living employee outweighs the procedural commitment to the past board.

  ***

  ### Limitations and The "Cheapest Catch"

  **Where This Misfires**
  1.  **The "Night 2.5" Problem (Case A):** The procedure is binary. Triggers are either met or not. You will have clients who spiral *just before* the trigger fires. You will have to watch them fall. This is the cost of legal defensibility.
  2.  **The "Sincere Delusion" Problem (Case B):** Distinguishing between a genuine spiritual conversion and a manic spiritual delusion in 90 seconds is nearly impossible. You will sometimes void a directive for a manic patient who sounds coherent, or enforce one on a changed person who sounds tired.
  3.  **The "No Contact" Default:** At 2am, if the client is coherent but you can't reach a proxy, the procedure says "Ignore Directive." This favors the Present Self. You will occasionally release a patient who harms themselves later, and the directive *would have* stopped it.

  **The Cheapest Catch**
  You need a **Sunset Clause**.
  *   **The Fix:** Every directive you draft must have an expiry date (recommend 3 to 5 years).
  *   **The Ritual:** To renew, the client must sit with you again. They don't have to change the content, but they must re-sign the date.
  *   **Why:** This converts "Value Drift" from a crisis decision into an administrative status. If the document is expired, it is advisory only. If it is current, it carries weight.
  *   **The Single Question:** When drafting, ask: *"If you change your mind about this in five years, how will we know?"* If they say "I won't," you tell them: *"Then this document is a trap, not a plan. We put a date on it."*

  **Final Note on Case B**
  I know voiding the directive in Case B feels like failure. It feels like the illness won. But in psychiatry, the "self" is the only vessel we have. If the vessel changes its cargo fundamentally, you cannot force the old cargo back in without breaking the vessel. Your spreadsheet shows Value Drift is real. Respect it, or you become the jailer of a ghost.
