answer: |-
  **Exam Question: The Normativity of Inference**

  Consider the following logical scenario, derived from a famous philosophical dialogue. A reasoner accepts proposition $A$ and proposition $A \to Z$. They are asked to accept $Z$. They refuse, stating that accepting $A$ and $A \to Z$ does not logically force them to accept $Z$ unless they also accept the further proposition $(A \land (A \to Z)) \to Z$. When they accept this new proposition, they still refuse $Z$, demanding yet another conditional linking the new set to $Z$, generating an infinite regress.

  To stop this, a proponent suggests replacing the infinite conditionals with a single *rule of inference*: "From $A$ and $A \to Z$, infer $Z$." The reasoner replies: "I see what the rule says, but why should I follow it? Give me a reason to move from the premises to the conclusion."

  **Part A:** Does distinguishing between *premises* (propositions) and *rules* (inference licenses) resolve the reasoner's demand, or does it merely relocate the regress? If it relocates it, distinguish the circularity involved in justifying a rule by using it from the circularity involved in adding the rule's statement to the premise set. What kind of non-question-begging support could a rule of inference receive?

  **Part B:** Imagine an agent who is 'conditionally saturated'. This agent accepts every true conditional linking their total evidence to a conclusion, including the conditional linking their acceptance of the evidence to their acceptance of the conclusion, yet they never perform the transition to believing the conclusion. Is this agent irrational? If so, does the defect lie in their justification, their agency, or their grasp of the concepts involved?

  **Part C:** Reconstruct this demand using a probabilistic norm rather than deduction. Suppose the norm is: "If you believe $E$ and assign probability $x$ to $H$ given $E$, you ought to assign probability $x$ to $H$." If the agent demands a further reason to follow *this* norm, does the regress generalize? Force a verdict: Is this generalization a *reductio ad absurdum* of the agent's demand, or does it reveal a fundamental limitation in all normative systems of reasoning?

  ***

  **Model Answer**

  The distinction between premises and rules does not resolve the regress; it relocates it from a regress of justification to a regress of application. When the reasoner demands a reason to follow the rule, they are treating the rule as if it were a premise—a truth-apt claim requiring validation. However, rules of inference are constitutive norms of reasoning, not descriptions of logical relations. If we treat the rule as a premise, we invite the original regress. If we treat it as a rule, the demand for a "reason" shifts from "Is this true?" to "Why obey this?" This relocation is significant because it changes the category of the problem, but it does not silence the skeptic who questions the authority of logic itself.

  Regarding circularity, there is a vital distinction between premise-circularity and rule-circularity. Adding the rule's statement to the premise set to prove the conclusion is viciously circular; it assumes the very connection it seeks to establish within the truth-conditional framework. However, arguing for a rule's validity by using the rule is not necessarily vicious. This is rule-circularity. Since rules govern the transition between thoughts, they cannot be validated from a standpoint outside all reasoning. Support for a rule must therefore be transcendental or pragmatic rather than evidential. We support Modus Ponens not by proving it true, but by showing that it is constitutive of what it means to hold beliefs that aim at truth. To reject the rule is not to hold a false belief, but to cease engaging in the practice of inference.

  This illuminates the case of the 'conditionally saturated' agent. This agent is irrational, but not because they lack justification. They possess all the true conditionals; their defect is not epistemic but agential. Belief is a normative attitude that aims at truth; inference is the mechanism by which this aim is pursued. An agent who accepts that evidence necessitates a conclusion but refuses to form the conclusion suffers from a form of theoretical akrasia. They fail to apply a norm they acknowledge. The defect lies in their agency—their failure to align their doxastic attitudes with their acknowledged normative commitments. It is a failure of rational disposition rather than a lack of propositional support. They have the map but refuse to walk the path.

  When we generalize this to probabilistic norms, such as conditionalization, the regress structurally persists. An agent could accept $P(H|E) = x$ and $P(E) = 1$, yet refuse to set $P(H) = x$, demanding a further norm to enforce the update. If the Tortoise's demand generalizes to all normative systems, including probabilistic coherence, this serves as a *reductio ad absurdum* of the demand itself. If every norm required a higher-order norm to enforce it, no reasoning could ever begin. The fact that the demand generates an infinite regress in both deductive and probabilistic contexts indicates that the error lies in the demand, not the systems.

  Therefore, the verdict must be that the demand is category-mistaken. Norms of reasoning are self-enforcing in the sense that to engage in reasoning is already to submit to them. One cannot coherently demand a reason for following a norm of reasoning without already presupposing the validity of reasoning to formulate the demand. The regress shows that justification must terminate in practices, not propositions. A first-class resolution recognizes that the Tortoise is not asking for more logic, but for an external validation of logic itself, which is impossible. The saturation agent is broken not because their logic is incomplete, but because their will is disconnected from their judgment. The generalization confirms that this is a universal feature of normativity: rules cannot be fully explicit without losing their normative force. We must accept that some norms are implicit in the competence of the agent, not explicit objects of their belief.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **1. Diagnosis of the Relocated Regress (5 marks)**
  *   **Full marks:** Identifies that the premise/rule distinction moves the problem from truth-conditions to normative authority (application) rather than solving it outright.
  *   **Common error:** Claiming the distinction *dissolves* the problem entirely without addressing the "why follow the rule" demand.
  *   **Note:** Recognizing the shift from "is it true?" to "why obey?" is essential.

  **2. Distinction in Circularity and Rule Support (5 marks)**
  *   **Full marks:** Clearly distinguishes vicious premise-circularity from non-vicious rule-circularity. Identifies that rule support must be pragmatic, transcendental, or constitutive (not evidential).
  *   **Common error:** Treating all circularity as equally vicious or suggesting rules can be proven like theorems.
  *   **Note:** Must articulate *why* rule-circularity is permissible (constitutive nature).

  **3. Diagnosis of the Conditionally Saturated Agent (5 marks)**
  *   **Full marks:** Identifies the defect as agential/dispositional (theoretical akrasia) rather than justificatory. The agent has the reasons but lacks the move.
  *   **Common error:** Claiming the agent is rational because they have all the premises, or that they simply lack one more conditional.
  *   **Note:** Must separate *having justification* from *executing inference*.

  **4. Generalization to Probabilistic Norms (5 marks)**
  *   **Full marks:** Successfully reconstructs the regress using the provided probabilistic norm. Shows the structure holds (demand for a norm to enforce the norm).
  *   **Common error:** Failing to apply the Tortoise's logic to the probabilistic case or claiming probability avoids the issue by definition.
  *   **Note:** Accuracy in applying the structural demand to the new context.

  **5. Verdict on Generalization (5 marks)**
  *   **Full marks:** Takes a definite stance (e.g., *reductio* of the demand). Argues that norms must be implicit/practical to function.
  *   **Common error:** Remaining agnostic ("philosophers disagree") or concluding the problem is unsolvable.
  *   **Note:** The question requires a verdict; suspension of judgment caps marks here.

  **Differentiation Criteria:**
  *   **First-Class (20-25):** Integrates all three cruxes into a unified theory of normativity. Explicitly explains *why* rule-circularity is benign and takes a decisive stand in Part C that norms are constitutive practices.
  *   **Upper-Second (15-19):** Correctly identifies the premise/rule distinction and the agential defect in Part B but treats them as separate points. May hesitate in Part C or offer a standard "rules aren't premises" answer without exploring the relocated regress.
  *   **Cap on Recapitulation:** An answer that relies *solely* on the "premises are propositions, rules are rules" category mistake without addressing the normative demand for the rule (Part A, second half) or the agential defect (Part B) cannot score higher than 14 marks (Lower-Second), regardless of prose quality.
