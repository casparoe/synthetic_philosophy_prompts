  # HANDOUT: The Probability Interpretation Decision Tree

  **Instructions:** Start at the top. Answer each question based on your intuition about the *case described*, not the theory you recall. Follow the path to a leaf.

  **START:** You assert: *"This particular classifier is wrong on this particular image, with probability about 0.7."* (The event is one-off; the procedure is calibrated over other images).

  1.  **The End-of-World Coin:** A coin is flipped exactly once and then destroyed; the universe ends immediately after. Is the statement "The probability of Heads was 0.5" **true**?
      *   **No** (Meaningless/False) → Go to **Q2 (Frequentist Path)**
      *   **Yes** (Meaningful/True) → Go to **Q5 (Single-Case Path)**

  2.  **The Finite Run:** 1,000 trials occur, then the universe ends. The actual frequency of Heads is 0.48. Is the "true probability" 0.48?
      *   **Yes** → **Leaf A: Strict Finite Frequentism**
      *   **No** (It implies a limit that never occurs) → Go to **Q3**

  3.  **The Deterministic Flip:** The coin flip is described by a perfectly deterministic classical model (outcome fixed by initial conditions). Is there a non-0/1 probability of Heads?
      *   **No** (Only 0 or 1) → **Leaf B: Error Theory / Fictionalism**
      *   **Yes** (Still 0.5 due to procedure) → Go to **Q4**

  4.  **The Reference Class:** A patient belongs to several overlapping classes giving different survival rates; no class is more natural. Is there a single true probability of survival?
      *   **No** (Depends on chosen class) → **Leaf C: Hypothetical Frequentism**
      *   **Yes** (Fact of the matter exists) → **Leaf D: Long-Run Propensity** *(Note: Distinguished from C only by Q4)*

  5.  **The Deterministic Setup:** The classifier is a deterministic algorithm. Is the 0.7 a property of the **physical system** (not just your ignorance)?
      *   **No** (It quantifies ignorance/evidence) → Go to **Q6 (Epistemic Path)**
      *   **Yes** (It is a feature of the setup) → Go to **Q9 (Ontic Path)**
      *   **Neither** (It is a property of the *validation procedure*) → **Leaf E: Calibrated Operationalism**

  6.  **The Disagreement:** Two agents have exactly the same total evidence but assign different probabilities. Are both rational?
      *   **Yes** → **Leaf F: Subjectivism**
      *   **No** (One is irrational) → Go to **Q7**

  7.  **The Untested Theory:** A new physical theory is proposed but not yet tested. Is "The probability this theory is true" a meaningful claim?
      *   **No** → (Return to Q6: You are likely a **Subjectivist** who denies theory probabilities)
      *   **Yes** → Go to **Q8**

  8.  **The Source of Constraint:** What constrains the rational probability assignment?
      *   **Logical Relations** (Syntax/Structure of propositions) → **Leaf G: Logical Probability**
      *   **Entropy/Symmetry** (State of information) → **Leaf H: Objective Bayesianism** *(Note: G and H often collapse)*

  9.  **Twin Worlds:** Two possible worlds agree on every particular matter of fact (history, properties, patterns). Could the chance of Heads still differ between them?
      *   **Yes** → **Leaf I: Non-Humean Primitivism**
      *   **No** (Chances supervene on facts) → Go to **Q10**

  10. **The Best System:** Are the chances simply whatever balance of simplicity and informativeness best summarizes the actual occurrent facts?
      *   **Yes** → **Leaf J: Humean Best-System Account**
      *   **No** (Chances are real but supervene differently) → Go to **Q11**

  11. **Directional Tendency:** A particle has a tendency to cause a click. Is P(Emission | Click) the same *kind* of probability as P(Click | Emission)?
      *   **No** (Propensities are directional) → **Leaf K: Single-Case Propensity**
      *   **Yes** (Standard probability calculus applies) → **Leaf L: Unnamed Hybrid View** *(Region occupied by few published views)*

  12. **The Forecaster Score:** A forecaster assigns probabilities to one-off events and is scored later. What exactly is the score checking?
      *   **Correspondence** (Did the probs match the facts?) → (Confirm **Realist** leaves above)
      *   **Utility** (Was the betting useful?) → (Confirm **Pragmatist/Fictionalist** leaves above)

  ***

  # INSTRUCTOR'S ANALYSIS & KEY

  ### 1. Construction of the Space
  The tree above constructs a 5-dimensional conceptual space before assigning labels. The dimensions are:
  1.  **Single-Case Validity:** (Q1) Can probability exist without a long run?
  2.  **Ontic Status:** (Q5) Is probability in the world or the mind?
  3.  **Supervenience:** (Q9) Do chances depend entirely on local facts?
  4.  **Rational Uniqueness:** (Q6) Does evidence dictate a unique prior?
  5.  **Directionality:** (Q11) Is probability symmetric?

  **Empty Regions & Collapses:**
  *   **Logical (G) vs. Objective Bayesian (H):** These leaves are adjacent and often indistinguishable in practice. Q8 attempts to separate them by *source* (Logic vs. Entropy), but many students will not perceive a difference. **Flag:** These leaves are not robustly distinguished by the tree.
  *   **Long-Run Propensity (D) vs. Hypothetical Frequentism (C):** Both posit a limit that may not actualize. Q4 (Reference Class) is the only separator, assuming Propensitists believe the reference class problem has a metaphysical solution while Frequentists accept contextuality. **Flag:** This distinction is fragile.
  *   **Leaf L (Unnamed):** This region (Ontic, Supervenient, Non-Best-System, Non-Directional) is theoretically possible but rarely occupied in literature. It represents a realist view that rejects Humean reduction without accepting primitivist "magic."
  *   **Q3/Q4 Path:** If a student answers "No" to Q2 (Finite Run = Truth) but "Yes" to Q3 (Determinism = Non-0/1), they are inconsistent. This path is **Incoherent** (Strict Frequentism cannot accommodate deterministic single-case probability).

  ### 2. The Starting Sentence Case
  **Case:** *"This particular classifier is wrong on this particular image, with probability about 0.7."*
  **Features:** Single case, no symmetry, algorithmic (not physical), empirically calibrated.

  **Routing:**
  *   **Q1:** Most ML students will say **Yes** (it is meaningful).
  *   **Q5:** Most will say **Neither/Functional**. They do not believe the chip has a physical "disposition" (Propensity), nor is it purely subjective ignorance (they can be objectively wrong about the calibration).
  *   **Result:** This routes directly to **Leaf E: Calibrated Operationalism**.

  **Why a new leaf?**
  Standard views fail here:
  *   *Frequentism:* Denies the single-case claim.
  *   *Propensity:* Requires a physical disposition (algorithms are abstract).
  *   *Subjectivism:* Denies the objective calibration constraint.
  *   *Best-System:* Might accept it, but only as a derivative of the "best system," whereas students view it as a direct property of the *validation protocol*.
  *   **Solution:** **Leaf E** accommodates the view that probability is a **property of a procedure's reliability** applied to a singular instance.
      *   *Definition:* Probability is the verified reliability rate of a specific decision procedure applied to a singular case.
      *   *Awkward Commitment:* It implies probability vanishes if the validation protocol is lost, even if the physical setup remains.

  ### 3. Failed Separations (Flags)
  *   **Logical (G) vs. Objective Bayesian (H):** As noted, Q8 relies on a philosophical distinction (syntax vs. information state) that often collapses in application. Students should be told these are "sibling views."
  *   **Long-Run Propensity (D) vs. Hypothetical Frequentist (C):** Both rely on counterfactual infinite ensembles. The tree separates them via the Reference Class problem (Q4), but a Propensitist might agree with the Frequentist that reference classes are contextual. **Flag:** These leaves are not fully distinguished.
  *   **Error Theory (B) vs. Fictionalism:** The tree lumps them. Strictly, Fictionalism allows the talk to be "true in the story," while Error Theory says it is false. The tree treats them as one leaf for brevity.

  ### 4. Usage Notes
  *   **Time:** 10 minutes. If a student stalls on Q9 (Twin Worlds), skip to Q10.
  *   **Goal:** Do not use this to grade "correctness." Use it to show students that their peers, using the same math, inhabit different metaphysical worlds.
  *   **The "Classifier" Leaf:** Use Leaf E to validate the students' actual practice. It acknowledges that their daily work (calibrated single-case predictions) is a legitimate philosophical position, not just "confused Frequentism."
