  You mistake the terrain for the traveler. It is true that the modern bureaucratic state creates a morphology of irresponsibility, where no one hand seems to hold the blood. But to claim this renders evil relative to institutional form is to deny the human condition itself. The banality I describe is not a sociological category of the office, but a moral category of the man who inhabits it. Eichmann was not evil because he was a bureaucrat; he was a bureaucrat who failed to be a man. The capacity to think—to hold a silent dialogue with oneself—is not granted by the state nor revoked by it. If you argue that structure dictates moral quality, you surrender the possibility of judgment entirely. I do not hide a sociology behind my judgment; I insist that judgment must pierce through sociology. The mistake is assuming that because the system encourages thoughtlessness, the individual is exempt from thinking. On the contrary, the more perfect the bureaucracy, the more urgent the demand to think what we are doing.
