      *   *Decision:* **Overturn the suspension but mandate a Pilot Program/Transitional Framework.** This validates the editor's intent while acknowledging the risk of formalization. It treats the Discord not as a rule violation to be punished, but as a emergent norm to be studied and regulated lightly.

