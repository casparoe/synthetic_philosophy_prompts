prompt: |-
  I sit on the appeals panel for our philosophy-of-science journal association. A senior editor got suspended for running a private Discord where reviewers discuss draft papers openly before formal submission — its become standard in our measurement-theory circle but breaks our official blind-review code. The defense says its a Lewis-style convention now: it solves coordination problems about reviewer availability, everyone expects it, and punishing it just destroys the equilibrium. The board needs a memo by Friday reccomending whether to uphold the suspension, overturn it, or formalize the practice with conditions. Draft it: clear recommendation with a timeline, take the convention argument seriously rather than just quoting the rulebook, and honestly treat the strongest point for the other side — probably that codifying it kills the spontaneity that made it actually work.
reasoning: |-
