answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, Philosophy of Science Journal Association
  **FROM:** Appeals Panel Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Suspension of Senior Editor [Name Redacted]

  ### 1. Executive Summary

  The Appeals Panel has reviewed the suspension of Senior Editor [Name] regarding the administration of a private Discord server used for pre-submission discussion of measurement-theory manuscripts. While this practice technically violates Section 4.2 of our Blind-Review Code, the defense rests on the claim that this constitutes a David Lewis-style *convention* within the measurement-theory sub-field.

  **Recommendation:** The Panel recommends **overturning the suspension**, contingent upon the immediate establishment of a **12-Month Pilot Framework**. We advise against full, permanent codification at this stage. Instead, we propose a "safe harbor" status that acknowledges the practice's utility without subjecting it to bureaucratic rigidities that would destroy its efficacy.

  ### 2. Analysis of the Lewisian Defense

  The Editor's defense invokes David Lewis's account of *Convention*. On this view, a convention is not merely a habit; it is a regularity in behavior that solves a recurrent coordination problem, sustained by mutual expectations.

  In the niche circle of measurement theory, the coordination problem is acute: qualified reviewers are scarce, and the technical density of drafts requires early calibration to avoid wasting formal review cycles. The Discord server functions as an equilibrium. Reviewers expect drafts to be vetted there; authors expect availability only if this vetting occurs. To punish this behavior is to disrupt a stable equilibrium without providing an alternative coordination mechanism.

  If we uphold the suspension, we treat the Association's code as a *regulation* imposed from above, ignoring the *normative force* generated from within the community. In Lewisian terms, we would be attempting to legislate away a solution that the agents themselves have generated to ensure the system functions. Doing so risks a boycott of the journal by the very specialists we rely on, as the "cost" of following official procedure (delayed reviews, mismatched expertise) becomes higher than the cost of non-compliance.

  ### 3. The Risk of Formalization: The Spontaneity Objection

  While the Lewisian argument justifies the *existence* of the practice, it does not automatically justify its *immunity* from oversight. However, the Panel identifies a critical risk in the Board's potential impulse to fully codify this practice into the bylaws.

  The strongest argument against full codification is sociological: **Institutionalization kills informal efficacy.**

  The Discord server works because it is low-friction and trust-based. It relies on what sociologists call "thick trust" among a small cohort. If we formalize this by requiring opt-in forms, conflict-of-interest logs for every message, or mandatory inclusion of non-members, we introduce transaction costs that negate the speed advantage. We risk turning a collaborative workshop into a compliance liability. If we make the "private" aspect public and regulated, the senior scholars who currently volunteer their time there may withdraw, collapsing the reviewer pool.

  Therefore, a binary choice between "ban it" and "make it official policy" is false. We must find a third path that preserves the equilibrium without surrendering governance.

  ### 4. Proposed Framework: The "Controlled Exception" Pilot

  We recommend overturning the suspension but placing the Discord practice under a **Provisional Sanction**. This acknowledges the convention without granting it permanent blanket immunity.

  **Key Conditions:**
  1.  **Transparency of Existence:** The Editor must disclose the existence of the server to the Board (not the public), acknowledging it as an extension of the editorial office.
  2.  **Opt-Out Mechanism:** Authors must be explicitly informed *before* sharing a draft that the discussion occurs in a semi-private forum, allowing them to choose formal submission instead.
  3.  **Firewalling:** No discussion from the Discord may be cited or referenced in the formal blind-review reports. The formal review must remain distinct to preserve the integrity of the official record.
  4.  **No Permanent Codification Yet:** We will not amend the Blind-Review Code immediately. This remains a pilot.

  ### 5. Implementation Timeline

  *   **By Friday, Oct 27 (Immediate):** Board votes to overturn suspension. Editor reinstated with written warning that future violations outside this Pilot framework will result in permanent removal.
  *   **Nov 1 – Nov 15:** Editor submits a "Charter of Conduct" for the Discord server to the Board. This document need not be bureaucratic but must outline basic civility and confidentiality rules.
  *   **Month 1–6 (Pilot Phase):** Practice continues under the "Controlled Exception." The Board collects data on review turnaround times compared to non-Discord submissions.
  *   **Month 12 (Review):** The Appeals Panel reconvenes to assess:
      *   Did the practice exclude junior scholars or underrepresented groups? (A common failure mode of informal conventions).
      *   Did the "firewall" between Discord chatter and formal review hold?
      *   **Decision Point:** Based on data, the Board will either sunset the practice, fully codify it with safeguards, or extend the pilot.

  ### 6. Conclusion

  Upholding the suspension privileges the *letter* of our code over the *function* of our field, risking a breakdown in the measurement-theory review ecosystem. However, ignoring the violation entirely sets a precedent that sub-fields may opt out of governance at will.

  By overturning the suspension while instituting a time-limited pilot, we respect the Lewisian convention as a functional necessity while retaining the Board's right to audit its fairness. We preserve the spontaneity that makes the Discord effective, but we remove the secrecy that makes it ethically vulnerable.

  **Recommendation:** Overturn Suspension; Initiate Pilot Framework.

  ***

  **Signed,**

  **The Appeals Panel**
