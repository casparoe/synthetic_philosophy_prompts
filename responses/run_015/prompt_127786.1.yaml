answer: |-
  This is a really fascinating conflict because it touches on psychology, ethics, and how different brains process emotion. You're both right about your own experiences, but you're talking past each other because you're prioritizing different things: you're prioritizing the **ethics of the source material**, while she's prioritizing the **internal emotional mechanism.**

  Here is a breakdown of what is likely going on with her, why your reaction is different, and whether that comparison to sad songs actually holds water.

  ### 1. Is she a masochist? (The Psychology of "Cleansing")
  It is highly unlikely she is a masochist in the clinical sense. What she is describing is a well-documented psychological phenomenon called **catharsis.**

  *   **The Paradox of Tragedy:** Philosophers and psychologists have long asked: *Why do we seek out art that makes us sad?* The prevailing theory is that sad art allows us to process difficult emotions in a safe environment.
  *   **Emotional Regulation:** For some people, suppressing sadness makes it worse. Watching something sad gives them "permission" to cry. The tears release stress hormones (like cortisol) and release oxytocin. That "cleansed" feeling she describes is a physiological reality.
  *   **Meaning-Making:** Heavy documentaries often aren't just about suffering; they are about *survival*. Watching someone endure something awful and keep going can make viewers feel more resilient about their own problems. It puts her own struggles into perspective.

  So, she isn't seeking the suffering for the sake of pain (masochism); she is seeking the *resolution* of the pain (catharsis).

  ### 2. Does it matter if the sadness is Real vs. Made Up?
  This is the crux of your disagreement.

  **Psychologically:**
  For the person watching, the brain often reacts similarly. Mirror neurons fire when we see pain, whether it's an actor pretending or a real person. The chemical release of crying is the same. So, when she says sad songs and sad docs give her the same feeling, she is being honest about her internal state.

  **Ethically:**
  This is where your discomfort is valid. There is a significant moral difference between a script and a human life.
  *   **Fiction/Music:** No one was actually harmed to create Taylor Swift's sad ballad or the movie *The Notebook*. The sadness is "safe."
  *   **Documentaries:** Real people were actually harmed. The ethical weight depends on the documentary. Is it an advocacy film meant to raise awareness and help the subjects? Or is it "trauma porn" designed to exploit victims for viewer shock value?

  If she is watching exploitative content, your instinct that it feels "wrong" is correct. It turns human suffering into a commodity for her emotional regulation. However, if she is watching ethical journalism or survivor stories, she is bearing witness, which is a valid (though heavy) thing to do.

  ### 3. The "Sad Song" Comparison
  Her argument is: *"If listening to sad music is okay, why is this different?"*

  *   **Where she's right:** Both are using external sadness to regulate internal mood. Both are voluntary exposures to negative emotion to achieve a positive outcome (relief).
  *   **Where she's wrong:** Sad music is abstract. It doesn't have a specific victim. When you listen to a sad song, you aren't witnessing a specific person's violation. When you watch footage of real suffering, you are a **witness.**

  Being a witness carries a burden. If you watch a video of a crime, you feel a responsibility to act or a guilt that you are just watching. She has learned to bypass that guilt to get to the catharsis; you haven't, which is why you feel anxious.

  ### 4. Why you feel anxious (Personal Distress vs. Empathy)
  You mentioned this makes you anxious for days. This suggests you are experiencing **Personal Distress** rather than **Empathic Concern.**

  *   **Empathic Concern:** "That person is suffering, I feel for them, I want them to be okay." (This often leads to catharsis or action).
  *   **Personal Distress:** "That person is suffering, I feel unsafe, this could happen to me, I am overwhelmed." (This leads to anxiety and avoidance).

  Neither is "better," but it explains why you can't watch what she watches. Your brain perceives the footage as a threat to your own safety, whereas her brain perceives it as an opportunity for emotional release.

  ### The Verdict
  **Is she messed up?** Probably not. Using sad media for catharsis is normal human behavior.
  **Is your discomfort valid?** Yes. Consuming real suffering does carry an ethical weight that fiction does not.

  **How to look at it:**
  She is treating the documentaries like **emotional medicine.** She takes a dose of sadness to purge her system.
  You are treating the documentaries like **contamination.** You feel that by watching, you are absorbing the trauma without the ability to process it.

  **Does the comparison to sad songs matter?**
  It matters ethically, but not psychologically. She is right that the *feeling* is the same, but you are right that the *cost* is different.

  **What to do?**
  You don't need to convince her she's wrong, because the catharsis is real for her. But you can hold your boundary. You can say: *"I get that it helps you process emotion, and I'm not saying you're a bad person for it. But my brain processes real suffering as a threat, not a release. So I'm not going to watch them, and I'd appreciate if we don't discuss the graphic details afterward."*

  As long as she isn't glorifying the abusers or treating the victims like objects, she's likely just using a heavy tool to manage her mental health. You just have a different toolkit.
