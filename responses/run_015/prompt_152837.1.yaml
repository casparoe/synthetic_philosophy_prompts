answer: |-
  The moral comparison between beef and chicken consumption becomes significantly more complex when wild animal suffering (WAS) resulting from crop cultivation and land conversion is integrated alongside the direct suffering of farmed animals. The **marginal-harm framework** and the **counterfactual-replacement view** offer divergent methodologies for evaluating this trade-off, leading to different conclusions about whether shifting from beef to chicken reduces or increases net harm.

  ### The Marginal-Harm Framework

  The marginal-harm framework assesses the moral weight of a consumption choice based on the immediate, causal impact of that specific purchase on the supply chain. It asks: *What additional suffering is directly triggered by buying this unit of meat?*

  When applied to beef versus chicken with WAS factored in, this framework highlights a tension between farmed animal density and land-use efficiency. Chicken production is significantly more feed-efficient than beef production; producing one calorie of chicken protein requires far less crop cultivation than producing one calorie of beef protein. Consequently, the marginal purchase of beef triggers a larger demand for crops (if grain-finished) or pasture land (if grass-finished), leading to a higher marginal rate of field deaths (e.g., rodents, insects) and habitat displacement per calorie.

  However, the marginal-harm framework also weighs the direct suffering of the farmed animal heavily. Because chickens are small and short-lived, shifting demand from beef to chicken necessitates the slaughter of many more individual sentient beings per calorie consumed. While beef consumption causes more diffuse harm to wild animals via land use, chicken consumption causes more concentrated, intense harm to a higher number of farmed individuals.

  **Verdict:** Under the marginal-harm framework, the comparison is **indeterminate**. The reduction in wild animal suffering (due to chicken's lower land and crop requirements) is offset by the increase in farmed animal suffering (due to the higher number of individual chickens killed). The net outcome depends entirely on the specific exchange rate a moral agent assigns to a unit of wild suffering versus a unit of farmed suffering, which the framework itself does not resolve.

  ### The Counterfactual-Replacement View

  The counterfactual-replacement view evaluates harm by comparing the actual state of the world resulting from a choice against the closest possible world where that choice was not made, or where a substitute choice was implemented. It focuses on *which populations of animals exist* in each scenario. It asks: *What exists on this land if we produce chicken instead of beef?*

  This view places greater emphasis on the opportunity cost of land use. Beef production is land-intensive, often requiring vast tracts of pasture or feed crops that displace wild ecosystems. The counterfactual-replacement view posits that if this land were not used for beef, it would likely support a population of wild animals. While these wild animals also suffer (via predation, disease, and starvation), they exist independently of human demand. In contrast, farmed animals are brought into existence solely for consumption.

  When shifting from beef to chicken, the counterfactual-replacement view notes that less land is required overall. This land savings implies that less wild habitat is converted or displaced. While more farmed chickens are brought into existence (and subjected to suffering), the beef scenario is viewed as causing a greater *replacement* of wild existence with farmed existence on a massive scale. Because beef consumes more land, it extinguishes the potential existence of more wild animals per calorie than chicken does.

  **Verdict:** Under the counterfactual-replacement view, shifting from beef to chicken likely **reduces net harm**. This conclusion rests on the prioritization of minimizing the total displacement of wild ecosystems. Even though more farmed chickens suffer, the beef industry's massive land footprint results in a greater net loss of wild animal existence and a higher volume of habitat-driven wild suffering.

  ### The Divergent Normative Premise

  The divergence between these two frameworks is driven by a specific normative premise concerning **the relevance of counterfactual existence**.

  The **marginal-harm framework** operates on the premise that moral responsibility is tied to *actualized* suffering caused by the agent's direct causal chain. It treats the existence of the farmed animal as a fixed baseline once the purchase is made, focusing on the intensity and duration of the suffering within that life. It is less concerned with what *would* have existed on the land otherwise, viewing wild suffering as a secondary, indirect consequence.

  Conversely, the **counterfactual-replacement view** relies on the premise that the *non-existence* of wild animals (due to habitat loss) is a morally significant harm comparable to the suffering of existing farmed animals. It asserts that we must weigh the suffering of the animals we create (farmed) against the suffering and existence of the animals we displace (wild). This premise drives the conclusion that beef is worse, as its land inefficiency displaces a larger counterfactual population of wild animals, whereas the marginal-harm framework remains stalled by the immediate count of farmed deaths.
