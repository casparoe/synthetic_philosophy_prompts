  **Analysis**
  This gap reveals that Tolstoy's ostensibly scientific account was always carrying unstated theological commitments. He assumes a teleological endpoint (universal union) that evolutionary dynamics lack. Signaling theory explains *how* feelings spread, not *which* feelings ought to. The failure is not in signaling theory's capacity to encode morality, but in Tolstoy's attempt to ground objective moral valuation in descriptive transmission mechanics. The residue proves Tolstoy was a prophet wearing a scientist's coat; the evolutionary translation strips the coat, leaving the prophecy unintelligible within the model. Evolutionary vocabulary cannot express the *sacred* value of the feeling, only its *strategic* value. Thus, the translation exposes Tolstoy's theory as moral theology disguised as aesthetics, which signaling theory cannot replicate without importing external normative axioms. Consequently, the "universal brotherhood" criterion remains an external input to the evolutionary model, not an emergent property, confirming that Tolstoy's science was subservient to his sermon.
