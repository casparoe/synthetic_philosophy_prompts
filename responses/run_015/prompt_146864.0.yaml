  In evolutionary terms, Tolstoy defines art as a high-fidelity **epidemiological dynamics of idea spread**, where "feeling" is the informational payload coordinating group behavior. "Infectiousness" maps directly to transmission rates dependent on signal clarity. Tolstoy's criterion of "universal brotherhood" translates to **group-level selection for shared norms** that maximize intra-group cooperation; art succeeds if it stabilizes **honest signals** of cooperative intent across diverse sub-populations. Conversely, professionalized elite art functions as **prestige-biased learning**, where adoption relies on the sender's status rather than the content's utility, generating **manipulative signals** that enhance individual fitness at the group's expense. Technical virtuosity becomes **costly signaling** devoid of cooperative benefit, wasting metabolic resources on exclusionary displays rather than social cohesion.

  **Residue Report**

  **Survivors:** The mechanism of transmission survives intact; treating infection as viral spread aligns perfectly with cultural epidemiology. The critique of elite art as status signaling maps cleanly onto **prestige-biased versus content-biased learning** distinctions.

  **Distortions:** Tolstoy's Christian universalism must be secularized into multi-level selection efficiency; "brotherhood" becomes "group stability." His hostility toward professionalism distorts slightly; evolutionary theory acknowledges prestige signaling can stabilize groups, whereas Tolstoy deems it inherently corrupt.

