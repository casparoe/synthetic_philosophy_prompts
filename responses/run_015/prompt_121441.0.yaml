answer: |-
  ### The shortlist, reordered

  Priority one is (3) Aggregated blamers. Institutional codes are rarely enacted by individuals; they are enforced by committees. If a panel's authority collapses because one member is a hypocrite, the system is paralysed. This is the most upstream structural question for your target audience, determining whether the body itself possesses standing independent of its constituents. Solving this offers immediate guidance for quorum rules and recusal policies. Priority two is (1) Borrowed standing. Restorative justice and HR procedures often rely on proxies speaking for victims. Distinguishing solidarity from busybodying is vital for policy clarity regarding who may lodge complaints on behalf of marginalised groups. Priority three is (4) Standing drift. Rehabilitation policies need to know when a reformed wrongdoer regains moral authority, but this presupposes we know who holds it initially. It is downstream of the structural question. Last is (2) The untempted blamer. While philosophically neat, it rarely arises in conduct codes; institutions worry about dirty hands, not saintly ignorance. This ordering maximises institutional fit while retaining philosophical rigour. It moves from the structure of the blaming body, to the source of the grievance, to the temporal status of the blamer, finally to the abstract epistemic condition. You avoid the trap of solving individual morality before institutional authority. Crucially, (3) is upstream of (1) because borrowed standing assumes a valid blamer exists, whereas aggregated standing questions whether the 'blamer' is a collective agent at all. This ensures the fellowship yields tools for panels rather than just papers for journals.

  ### Criteria and where they clash

  The ordering relies on three criteria: Institutional Fit, Upstream-ness, and Neglectedness. Institutional Fit measures how directly the theory informs conduct codes. Upstream-ness asks whether the problem precedes the hypocrisy debate. Neglectedness considers existing literature volume. These criteria clash. Usually, the most upstream questions are the least practically applicable. However, (3) Aggregated blamers is the sweet spot: it is upstream of individual standing because it questions the collective agent, yet it has high Institutional Fit because panels are the primary enforcers of codes. (1) Borrowed standing scores high on Fit and Neglectedness but is slightly downstream, as it assumes a valid blamer exists. (4) Standing drift is highly practical but less upstream; it tweaks existing standing rather than defining it. (2) The untempted blamer scores high on Upstream-ness and Neglectedness but fails Institutional Fit. It is a pseudo-problem for your ends because conduct codes regulate behaviour, not epistemic access to temptation. No panel will disqualify a member for being 'too virtuous'. The clash here is between philosophical purity and practical utility. By prioritising (3), you sacrifice some metaphysical depth for structural clarity. This is necessary because your end goal is not a complete theory of moral authority, but a working framework for university panels. If you prioritise Upstream-ness alone, you risk writing abstract meta-ethics. If you prioritise Fit alone, you risk mere policy analysis. The proposed order balances these, ensuring the work remains philosophical but lands where decisions are made. Balancing neglectedness against fit ensures you aren't just shouting into the void. Since (3) is significantly more neglected than (1), this increases the likelihood of your work defining the field rather than joining a crowd. This strategic selection protects the project from becoming either too abstract or too bureaucratic.

  ### What I've missed

  You have missed the distinction between standing to blame and standing to sanction. Conduct codes deal primarily in sanctions (dismissal, censure), not moral blame. A panel might lack moral standing to blame but retain institutional authority to punish. Failing to separate these conflates moral philosophy with administrative law. Secondly, you overlook power asymmetry. Standing often depends not on clean hands but on hierarchical position; a manager may have standing to blame a subordinate where a peer does not, regardless of hypocrisy. Thirdly, consider victim waiver. Can a victim grant standing to a hypocrite? If a harassed employee insists a harasser sit on their panel, does that cure the deficit? This is crucial for restorative justice programmes where victim agency is paramount. Finally, there is the issue of public vs private standing. Professional bodies operate publicly; university panels often privately. The standing conditions might differ based on whether the blame is meant to signal norms to the wider community or resolve a specific dispute. Ignoring these distinctions risks producing a theory of standing that is morally coherent but institutionally inoperable. You need to ensure your upstream work accommodates the specific mechanics of sanctioning power, not just the morality of condemnation.

  ### What would move things up or down

  Empirical collaboration would shift priorities. If data shows committees routinely ignore members' conflicts, (3) drops. If victim advocacy groups prioritise proxy complaints, (1) rises. Legal developments matter too; if case law solidifies vicarious liability, (3) becomes urgent. Conversely, if restorative justice moves away from panels towards dialogue, (4) gains traction. Your positioning also matters: if you partner with a professional body during the fellowship, Institutional Fit outweighs Neglectedness. Without such partnership, prioritising the neglected (3) is safer for academic impact. Ultimately, the ordering holds unless the institutional landscape shifts away from committee-based adjudication. Monitoring these variables ensures your fellowship remains responsive to real-world constraints rather than assumed ones. It keeps the project anchored in reality.
