      *   *Philosophical commitments?* (Unity, Emergence, Macro-subject priority).
      *   *Integration vs. Pragmatic?* (Both, but pragmatism drives the metaphysics).
      *   *Ignoring entities?* (Yes, ontologically potentially, but not clinically).
      *   *Anti-panpsychism or Agnostic?* (Methodologically anti, ontologically agnostic).
