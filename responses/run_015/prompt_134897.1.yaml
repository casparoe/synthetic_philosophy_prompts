      *   **Fatal hits:** What kills this reduction?
          *   *Argument 1: Akrasia without preference reversal.* Sometimes people choose the worse option knowing it's worse *at the moment of choice*, without preferring it. Hyperbolic discounting says you prefer the immediate reward *at t=0*. But Socrates/Donald Davidson argue akrasia involves acting against one's *current* best judgment. If I choose salad over cake but eat cake anyway, not because I prefer cake *now*, but because I "couldn't help it," that's not discounting. That's a failure of agency, not preference.
          *   *Argument 2: The phenomenology of compulsion vs. choice.* Hyperbolic discounting models rational choice (albeit time-inconsistent). Akrasia often feels like a loss of control, not a choice. Neuroscientific evidence (prefrontal vs. limbic system) suggests conflict between control systems, not just a single discounting curve shifting. If the agent feels overridden rather than choosing, the "preference" model fails.
          *   *Concede/Fight:* Defenders might concede some cases are compulsions (not akrasia) but fight that "true" akrasia is always preference-based. They'd fight the neuro evidence by saying neural conflict *implements* the discounting struggle.

