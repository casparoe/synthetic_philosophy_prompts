answer: |-
  ### 1. Candidate Rules

  Based on the three verdicts provided (One-box in Newcomb, Cooperate in Twin PD, Stay Home in Death in Damascus), your lecturer is running a theory that rejects **Causal Decision Theory (CDT)**. CDT would two-box in Newcomb, defect in the Twin PD, and (in some formulations) be indifferent or unstable in Death in Damascus.

  The verdicts are jointly consistent with two main candidates:

  1.  **Evidential Decision Theory (EDT):** Chooses the act that provides the best news about the outcome. It maximizes $E[U] = \sum P(O|A)U(O)$. It one-boxes and cooperates with twins because the act is strong evidence of the favorable state (money in box, twin cooperating).
  2.  **Functional Decision Theory (FDT) / Timeless Decision Theory (TDT):** Chooses the act based on the output of your decision algorithm, treating logical correlations (like predictors or twins) as subjunctive dependencies. It also one-boxes and cooperates with twins.

  While these theories agree on your lecturer's three cases, they diverge on problems involving **common causes** rather than logical/predictive dependencies.

  ### 2. Analysis of Your Variant ("Allelic Death")

  Your variant is a version of the **Smoking Lesion** problem. It is **not malformed**. The stipulation that you have "no evidence... beyond these frequencies" describes your *prior* state. In EDT, the act itself generates evidence; in FDT/CDT, it does not. The "compulsion" is probabilistic (50% vs 5%), preserving agency while establishing a statistical correlation.

  However, I must correct a critical detail in your setup for the calculation: You stated Death waits in **Damascus if you carry the allele** and **Aleppo if you do not**. This reverses the standard "Smoking Lesion" intuition (where the lesion makes you do the thing that kills you). Here, the allele makes you go to Aleppo, but it sends Death to Damascus. **The allele makes you safe if you go to Aleppo.**

  Here is the arithmetic for each theory:

  **Common Data:**
  *   $P(Allele) = 0.4$; $P(\neg Allele) = 0.6$.
  *   $P(Aleppo | Allele) = 0.5$; $P(Aleppo | \neg Allele) = 0.05$.
  *   $P(Aleppo) = (0.5 \times 0.4) + (0.05 \times 0.6) = 0.23$.
  *   $P(Damascus) = 0.77$.
  *   **Death's Location:** Allele $\to$ Damascus; $\neg$ Allele $\to$ Aleppo.
  *   **Survival:** You survive if your location $\neq$ Death's location.
      *   If Allele: Death in Damascus. You survive if you go **Aleppo**.
      *   If $\neg$ Allele: Death in Aleppo. You survive if you go **Damascus**.

  **Evidential Decision Theory (EDT)**
  EDT conditions on the act. Going to Aleppo is strong evidence you have the Allele (which means Death is in Damascus, so you live).
  *   $P(Allele | Aleppo) = \frac{P(Aleppo|Allele)P(Allele)}{P(Aleppo)} = \frac{0.20}{0.23} = \frac{20}{23} \approx 0.87$.
  *   $P(Survival | Aleppo) = P(Allele | Aleppo) \approx 0.87$.
  *   $EU(Aleppo) = 0.87(1) + 0.13(0) - 0.02 = \mathbf{0.85}$.
  *   $P(Allele | Damascus) = \frac{P(Damascus|Allele)P(Allele)}{P(Damascus)} = \frac{0.20}{0.77} = \frac{20}{77} \approx 0.26$.
  *   $P(Survival | Damascus) = P(\neg Allele | Damascus) \approx 0.74$.
  *   $EU(Damascus) = 0.74(1) + 0.26(0) - 0 = \mathbf{0.74}$.
  *   **Verdict:** **Go to Aleppo.** (The act is good news; it correlates with the state that puts Death in the other city).

  **Functional Decision Theory (FDT) / Causal Decision Theory (CDT)**
  Both FDT and CDT treat the Allele as a fixed physical state (a common cause) that your decision cannot influence or logically determine. They ignore the evidential correlation.
  *   $P(Allele | do(Aleppo)) = P(Allele) = 0.4$.
  *   $P(Survival | do(Aleppo)) = P(Allele) = 0.4$ (Since Allele $\to$ Death in Damascus).
  *   $EU(Aleppo) = 0.4(1) + 0.6(0) - 0.02 = \mathbf{0.38}$.
  *   $P(Survival | do(Damascus)) = P(\neg Allele) = 0.6$ (Since $\neg$ Allele $\to$ Death in Aleppo).
  *   $EU(Damascus) = 0.6(1) + 0.4(0) - 0 = \mathbf{0.60}$.
  *   **Verdict:** **Go to Damascus.** (Causally, Death is more likely to be in Damascus [40%] than Aleppo [60%]? Wait. Allele [40%] $\to$ Death Damascus. No Allele [60%] $\to$ Death Aleppo. So Death is in Aleppo 60% of the time. You should go to Damascus).

  ### 3. Which theory is she running?

  I would bet she is running **Evidential Decision Theory (EDT)**.

  **Reasoning:**
  1.  **Phrasing:** You noted the handouts are phrased in terms of "probabilities of outcomes conditional on acts." This is the literal definition of the EDT valuation formula ($V(A) = \sum P(O|A)U(O)$). FDT literature explicitly critiques this formula, preferring subjunctive conditionals or logical counterfactuals.
  2.  **Course Level:** EDT is the standard "alternative to CDT" taught in undergraduate philosophy courses. FDT is a newer, more niche theory (associated with MIRI/lesswrong) that is rarely the primary framework in standard university curricula.
  3.  **The Twin PD:** While FDT proponents champion the Twin PD, EDT also yields cooperation there (since $P(Twin Cooperates | I Cooperate)$ is high). It does not require FDT to get that verdict.

  If she is running EDT, her verdict on your variant would be **Go to Aleppo**.

  ### 4. A Further Separating Case

  While your Variant separates EDT from FDT, a cleaner case that avoids the "common cause" confusion and targets the *logical* vs *evidential* distinction is **Transparent Newcomb**.

  **The Case:**
  Newcomb's Problem, but the boxes are transparent. You can *see* whether the opaque box contains \$1,000,000 or \$0 before you choose. The Predictor is 99% accurate.

  **The Separation:**
  *   **EDT Verdict:** **Two-Box.**
      *   Once you see the money, the prediction is already made. Your act cannot causally change the box content.
      *   If you see \$1M: $U(2\text{-box}) = 1,001,000$; $U(1\text{-box}) = 1,000,000$.
      *   If you see \$0: $U(2\text{-box}) = 1,000$; $U(1\text{-box}) = 0$.
      *   EDT (like CDT) two-boxes in the transparent case because the conditional probability $P(\$1M | 1\text{-box})$ is effectively 1 or 0 depending on what you see, removing the evidential leverage.
  *   **FDT Verdict:** **One-Box.**
      *   FDT argues that your decision algorithm is logically linked to the Predictor's simulation. Even if you see \$1M, FDT reasons: "If my algorithm outputs 'Two-Box', the Predictor would have predicted that and left the box empty. The fact that I see \$1M means my algorithm must be the type that One-Boxes."
      *   FDT maintains the One-Box policy to ensure the predictor fills the box in the first place.

  **Why this separates them:**
  In your Allelic Death variant, FDT and CDT agree (both say Damascus). In Transparent Newcomb, **CDT and EDT agree** (both say Two-Box), but **FDT disagrees** (One-Box). If you want to distinguish your lecturer's EDT from FDT specifically, this is the canonical test. If she says "Two-Box" in Transparent Newcomb, she is definitely EDT. If she says "One-Box," she is FDT.
