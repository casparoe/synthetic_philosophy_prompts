      *   *Argument:* The 1987 proposal is emotionally strong (acknowledge this!). It builds community. *However*, it treats the flood as an anomaly. The Riverbed proposal treats it as a structural inevitability.
      *   *The "Retroactive" point:* By showing the 400-year shift, we reframe the 1987 heroism not as a victory over nature, but as a negotiation with deep time. This is deeper public history.
