answer: |-
  **MEMORANDUM**

  **TO:** Public History Board
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Funding Recommendation: Old Science Wing Exhibit Proposals

  **Recommendation**
  The Board should approve funding for the **400-Year Riverbed Geology/Climate Archive** proposal, with a mandatory stipulation that the 1987 Flood oral histories be integrated as interpretive anchors within the geological timeline. We should not fund the 1987 Flood proposal as a standalone exhibit.

  **Rationale: Reframing Event through Structure**
  Our mandate is to produce public history that is both accessible and intellectually rigorous. The core distinction between these proposals is not simply "science vs. stories," but rather *longue durée* (structural time) versus *événementielle* (event time).

  The strongest argument for the standalone 1987 Flood proposal is **immediate empathetic resonance**. Oral histories of rescue and heroism provide an accessible entry point for visitors. They validate community trauma and celebrate human agency. In a vacuum, this is compelling public history; it ensures visitors leave feeling connected to their neighbors and the specific moment of crisis. To dismiss this would be to ignore the primary function of public history: to engage the public with their own past.

  However, presenting the 1987 flood solely as a series of heroic events risks mythologizing the disaster as an anomaly—a singular battle between humans and nature that was "won" through bravery. This obscures the deeper reality.

  This is where the Riverbed proposal offers a necessary correction, specifically through the lens of **retroactive structural causation**. This concept suggests that slow-moving geographic shifts do not merely cause events; they rewrite the meaning of those events after the fact. By prioritizing the 400-year geological archive, we allow the deep structure of the river to reframe the 1987 narratives.

  In this hybrid model, the 1987 rescue stories do not disappear; they are recontextualized. A rescue story is no longer just a tale of heroism; it becomes a data point illustrating human friction against a 400-year climatic shift. The "meaning" of the 1987 heroism changes retroactively: it was not a victory over the river, but a temporary negotiation with a geological inevitability. This provides a more urgent, complex public lesson about climate and habitation than the standalone flood proposal could achieve.

  **Implementation Plan & Budget**
  To ensure the geological data does not become too abstract for a general audience, the oral histories must serve as the "human scale" for the deep time data.

  **Total Budget Request:** $215,000
  **Timeline:** 18 Months (November 2023 – May 2025)

  *   **Phase 1: Curation & Integration (Months 1-6)**
      *   *Budget:* $65,000
      *   *Action:* Geologists and historians co-curate the timeline. Select 10-12 oral history clips that correspond to specific geological shifts (e.g., a rescue story played next to a sediment core sample from that specific flood layer).
  *   **Phase 2: Design & Fabrication (Months 7-14)**
      *   *Budget:* $120,000
      *   *Action:* Build the physical archive display. Interactive sediment tables must include audio triggers for the oral histories.
  *   **Phase 3: Public Programming (Months 15-18)**
      *   *Budget:* $30,000
      *   *Action:* Launch series featuring both the lead geologist and the oral history narrators to model the interdisciplinary approach.

  **Conclusion**
  Funding the standalone 1987 proposal would give us a touching memorial, but funding the Riverbed proposal (with integrated narratives) gives us a causal explanation that changes how the community understands its future. We should choose the exhibit that allows the slow violence of the river to rewrite the quick heroism of the flood.

  **Decision Deadline:** Thursday, October 26
