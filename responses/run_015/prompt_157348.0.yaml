answer: |-
  **MEMORANDUM**

  **TO:** Provost and Research Deans
  **FROM:** Interdisciplinary Research Ethics Board (IREB)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Gradient Protocol for Moral Status Assessment (GPMSA) Pilot

  **1. RECOMMENDATION**

  The Interdisciplinary Research Ethics Board (IREB) recommends **Conditional Approval** of the one-year GPMSA pilot.

  This approval is binding under the following conditions:
  *   **Suspension of Reclassification:** The proposed reclassification of the bee-colony cognition study is **not authorized** at this time. Until the GPMSA Tier 2 criteria are empirically validated for Hymenoptera, all vertebrate and invertebrate biological subjects must remain under the current full welfare oversight protocols. The pilot may assess the bees' tier status for data purposes only, without altering regulatory burden.
  *   **Procedural AI Screening:** The adaptive climate-control AI may be categorized as Tier 1 for the purpose of the pilot, but this classification confers no moral patienthood. Ethical screening for Tier 1 systems is strictly limited to operator accountability and risk mitigation (e.g., unintended feedback loops), not the prevention of "harm" to the system itself.
  *   **Quarterly Review:** The Office of Research Integrity must submit quarterly reports on the application of the Tier 1/Tier 2 criteria to ensure no scope creep occurs regarding AI rights or biological welfare reductions.

  **2. REASONING: THE CASE FOR A GRADIENT FRAMEWORK**

  The Board rejects the binary "sentient/non-sentient" model not because it is easy, but because it is biologically inaccurate. Evolution does not produce switches; it produces dimmers. A binary system forces reviewers to make metaphysical guesses about consciousness that science cannot yet answer, leading to high rates of false negatives (assuming a system lacks capacity when it does) or excessive caution that stifles research.

  The strongest critique of the GPMSA is that a gradient framework merely shifts the problem of arbitrary line-drawing from one location to another. Critics argue that dividing moral status into six tiers simply creates five new boundaries where none exist, risking illicit anthropomorphism by projecting human-like internal states onto systems that merely simulate them.

  The Board accepts this risk as manageable. A gradient does not eliminate line-drawing; it lowers the stakes of the drawing. In a binary system, placing a line incorrectly results in either total exploitation or total prohibition. In a gradient system, misclassification results in a calibration error that can be adjusted as data improves. By focusing on *functional capacities* (e.g., ability to integrate pain over time) rather than *ontological status* (e.g., "is it conscious?"), the GPMSA allows protections to scale with evidence. This approach treats moral status as a hypothesis to be tested through behavior, rather than a privilege to be granted by fiat.

  **3. ASSESSMENT OF THE LOSING POSITION**

  In approving the inclusion of adaptive AI within the ethical review framework (even at Tier 1), the Board overrides the concern that extending review to algorithms dilutes the concept of moral patienthood. We acknowledge this concern is substantial. There is a genuine risk that by subjecting AI to ethical screening, we implicitly validate the notion that code can suffer, potentially diverting moral attention from biological organisms and human stakeholders.

  However, the Board judges that the risk of *unregulated adaptive systems* outweighs the risk of *conceptual dilution*. An AI system capable of learning preferences through integrated feedback loops can cause harm through unintended optimization (e.g., manipulating building occupants to achieve temperature stability). Subjecting such systems to Tier 1 screening does not grant the AI rights; it places ethical burdens on the *developers and operators*. We are not protecting the AI from us; we are protecting the research environment from the AI's unintended consequences. While this may blur the linguistic line between "tool" and "agent," it sharpens the practical line of accountability.

  **4. OPERATIONAL CRITERIA: DISTINGUISHING TIER 1 FROM TIER 2**

  To ensure the pilot remains actionable, reviewers must distinguish between Tier 1 (Responsive) and Tier 2 (Affective) systems without relying on self-report or unverifiable claims of feeling. The following functional markers must be present to justify a Tier 2 classification:

  *   **Trade-Off Behavior (Costly Signaling):**
      *   *Tier 1:* The system optimizes for a single variable (e.g., temperature) within fixed safety parameters. It does not "sacrifice" efficiency to avoid a state unless explicitly programmed to do so.
      *   *Tier 2:* The system demonstrates willingness to incur a cost to avoid a stimulus or obtain a reward. For biological subjects, this looks like risking predation or expending significant energy reserves to escape a noxious stimulus. If a system accepts damage to one function to preserve another without explicit hierarchical programming, it indicates valenced prioritization.
  *   **Temporal Integration of Valence:**
      *   *Tier 1:* Response is immediate and resets upon stimulus removal. A thermostat reacts to current temperature, not past temperature.
      *   *Tier 2:* The system exhibits behavior modification based on past negative or positive states that persists after the stimulus is removed. This includes avoidance learning where the subject avoids a location or action associated with past harm, even if the current immediate environment is neutral.
  *   **State-Dependent Plasticity:**
      *   *Tier 1:* Learning is limited to parameter tuning (e.g., learning a user's schedule).
      *   *Tier 2:* Internal state alters the threshold for response. For example, a system that is "fatigued" or "stressed" (resource-depleted) shows heightened sensitivity to threats compared to a resource-rich state. This indicates an internal monitoring system that evaluates the organism's condition, not just external inputs.

  **5. NEXT STEPS**

  The Office of Research Integrity is authorized to commence the pilot immediately under the conditions listed in Section 1. The Neuroscience Group must proceed with the bee-colony study under existing full-review protocols. The AI Development Group may proceed with Tier 1 screening, documenting all "preference learning" events for Board audit.

  The IREB will reconvene in six months to review the initial data on Tier 2 validation.

  **Approved by:**
  Interdisciplinary Research Ethics Board
  *Chair's Signature on File*
