  > **Maximise the sum of a strictly concave transform of each person's expected lifetime welfare, subject to a constraint that forbids imposing losses on a greater number of distinct agents to benefit a fewer number unless the welfare gain is substantially larger than the aggregate loss.**

  ### How the clauses map to your cases

  1.  **"Strictly concave transform... welfare"**: This captures **Case 1** and **Case 2**. The concavity ensures that welfare gains for the worse-off (Bo) count for more than equivalent losses for the better-off (Ana). This explains why you accept the trade in Case 1 (15 for 20) and even Case 2 (40 for 20), as the moral weight of Bo's low baseline outweighs the raw numerical loss.
  2.  **"Subject to a constraint... greater number of distinct agents"**: This is motivated by **Case 3**. Standard Prioritarianism cannot easily distinguish between taking 15 from one person (Case 1) and taking 5 from three people (Case 3) if the total loss is identical. Your verdict implies that burdening three separate wills is morally costlier than burdening one. This clause blocks the transfer in Case 3 because the 'cost' of imposing losses on three people triggers the constraint, whereas the single loss in Case 1 does not.
  3.  **"Expected... welfare"**: This addresses **Case 5**. By applying the concave transform to *expected* welfare (Ex-Ante Prioritarianism) rather than the sum of transformed outcomes (Ex-Post), you capture the intuition that the coin flip is worse. However, to prefer (49, 49) for sure over the flip (50, 50 expected), the principle implies a further social aversion to risk or inequality of prospects, which is bundled into the 'concave transform' of the expectation.
  4.  **"Lifetime... distinct agents"**: This handles **Case 6**. By defining the unit of moral concern as 'lifetime welfare' but acknowledging the intuition in Case 6, the principle treats time-slices analogously to persons for the purpose of smoothing (concavity applies), whilst the 'distinct agents' constraint prevents the numbers objection from collapsing within a single life (since a single life is one agent).

  ### Verdicts you must relinquish

  To maintain consistency with this principle, you must soften or give up two specific intuitions:

  1.  **The 'Respect' in Case 4**: You stated that in the choice between (1000, 10) and (990, 9), the second option is "better in one respect". This principle, however, judges the first option as better *simpliciter* because the total transformed welfare is higher and no aggregation constraint is violated (only one person loses). You must accept that the second option is not better in any *moral* respect, but merely appeals to an aesthetic of equality that has no normative weight once total priority-weighted welfare is accounted for. The 'respect' you feel is likely a phantom intuition generated by the concave function, which the principle has already fully incorporated.
  2.  **The Strength of Case 5**: While the principle captures the preference for the sure thing, it struggles to justify preferring (49, 49) over the flip without implying an implausibly high degree of social risk aversion. You may need to accept that at some point (perhaps at 49, 49), the certainty should no longer outweigh the higher expected total welfare, or admit that your view here is pluralist (valuing equality of prospects independently of welfare) rather than unified.

  ### Prediction for the New Case

  **Case:** Ana 100 alone versus Ana 100 together with Bo at 40.

  **Prediction:** You should prefer **Ana 100 together with Bo at 40**.

  **Reasoning:** The principle commands the maximisation of the sum of transformed welfare. In the first option, the sum is $f(100)$. In the second, it is $f(100) + f(40)$. Since the transform is strictly increasing, $f(40)$ is a positive value. Therefore, the existence of Bo at a positive welfare level adds moral value, regardless of the inequality introduced. Your verdict in Case 6 (smoothing within a life) suggests you treat welfare units as additive across time; this principle extends that additivity across persons. Unless Bo's existence imposes a hidden burden on Ana (which your setup excludes), the addition of a happy life is always a moral gain.
