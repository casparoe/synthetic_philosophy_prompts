  **The Scenario**

  In a collapsed mine, six strangers are trapped: one miner is pinned in a stable shaft accessible with an 80% success rate, while five are buried behind an unstable wall where rescue attempts succeed only 10% of the time due to imminent re-collapse. The rescue team has resources for exactly one attempt before the site becomes inaccessible forever. The plain numbers view calculates expected survival at 0.8 lives for the single miner versus 0.5 lives for the group of five, dictating an attempt on the single miner and writing off the five. A Taurek-style view, holding that numbers do not aggregate moral claims and each party deserves equal consideration, demands a coin flip between the two groups; this grants the five a 50% chance of an attempt—a significant possibility entirely denied by the arithmetic of expected value.

  ***

  **Analysis**

  **The Arithmetic & Reasoning**
  *   **Numbers View (Expected Utility):** Maximizes $E[\text{lives saved}]$.
      *   Save One: $1 \text{ person} \times 0.8 \text{ probability} = 0.8$ expected lives.
      *   Save Five: $5 \text{ persons} \times 0.1 \text{ probability} = 0.5$ expected lives.
      *   **Verdict:** Save the One. The Five receive a 0% chance of rescue.
  *   **Taurek View (Equal Chance):** Rejects aggregation; each *group* has an equal claim to be chosen.
      *   Decision Rule: Flip a fair coin to select which group to attempt.
      *   **Verdict:** 50% chance to attempt saving the One; 50% chance to attempt saving the Five. The Five receive a 50% chance of an attempt (resulting in a 5% overall survival chance), which is strictly greater than the 0% granted by the Numbers view.

  **The Single Feature**
  **Differential Rescue Efficacy** (the inverse correlation between group size and probability of success).

  **If That Feature Is Removed**
  If rescue probability were equal for both groups (e.g., 80% for both):
  *   **Numbers View:** Saves the Five ($4.0 > 0.8$).
  *   **Taurek View:** Still flips a coin (50% for each group).
  *   *Result:* The dialectic returns to the standard setup (Numbers favor the many, Taurek favors a coin flip).

  **The Numbers Theorist's Objection**
  "You haven't reversed the principle; you've manipulated the risk profile to create a threshold case where expected values are close, but in real triage, morality shouldn't grant a 50% shot at a futile rescue when a high-certainty save is available."
