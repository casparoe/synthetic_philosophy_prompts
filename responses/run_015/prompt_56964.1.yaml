  what I want built: a case where somebody's report about their own experience right now is simply false. present tense, coarse grained — not a memory, not a subtle shade of color, not "why did I do that," more like am I anxious / do I feel sick / is there a noise. and it has to survive all four of the usual escapes:

  - no confabulation — they're not explaining anything, they get asked a direct question and answer straight away
  - they're actually attending to the very thing at the moment they report on it
  - zero motive, and build in a reason they'd be relieved to be told the truth
  - nothing clinical or exotic: no brain damage, no blindsight type stuff, no scanners, no drugs, no hypnosis. just an ordinary place a teenager would actually be

  then I want two views to genuinely come apart on it, not just sound different. the introspection-as-an-inner-sense view (introspection is a faculty like a sense, so it can misfire, and the probe can disturb what it's measuring) should be able to call the report flatly false, while the direct-access view (self-intimation — you can't be wrong about this kind of thing without noticing) should have to call the report authoritative. plus one line saying where a higher-order-thought theorist lands, because I cant tell whether that view just collapses into one of the other two.

  the probe-fragility has to be load bearing, not decoration. I want to be able to point at it working.

  what the case is for, so you know what counts as cheating: I'm trying to figure out whether the introspection-is-unreliable people have shown anything about the present tense at all, since every example I run into is about people explaining their own past behavior, which feels like a way easier target. so anything that smuggles in memory or motive or inattention doesn't count. and if you can only build it by dropping one of my constraints, say which one and why instead of quietly dropping it.

  format: the scenario is one paragraph, max. then after it, give me the verdict each of the two views reaches and the actual reason it reaches it, name the single feature of the case that's doing the work, say what happens to the case if I delete that feature, and end with the strongest attack the direct-access person has on my case — the one that would actually make me doubt it, not a strawman. whole thing under 500 words, and open with one sentence telling me which of the two views comes out worse.
