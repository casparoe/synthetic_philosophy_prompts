  1.  **Ideal Point Hostage:** The divergence exists because Option A sets $u_1 = 110$. This flattens the KSS ray ($slope = 40/110$). The NBS ignores Option A (IIA), anchoring itself at the kink (Option B). The KSS is dragged along the ray toward Option A, awarding Spinout a higher share (0.63 vs 0.55). When A is removed, $u_1$ collapses to 60, steepening the ray and shifting KSS dramatically toward Uni.
  2.  **Slope:** In normalized coordinates ($\hat{x}_i = x_i/u_i$), the frontier crosses the diagonal ($\hat{x}_1 = \hat{x}_2$) at the KSS point. The NBS point is determined by where the hyperbola is tangent to the frontier. Because the frontier is kinked at B, the NBS sticks to the kink. The KSS slides along the segment A-B. The slope of A-B in normalized coordinates is steep enough that moving from the NBS point toward the KSS point increases Spinout's share significantly.

  **KSS Share Position:** In this case, the KSS common share (0.632) falls *between* the two NBS shares (0.545 and 0.750). This is mathematically necessary when both points lie on the same downward-sloping segment of the frontier and the NBS favors one party. If the NBS favored Party 1 more than KSS, KSS would be lower than both; here NBS favors Party 2, so KSS is higher than Party 1's NBS share but lower than Party 2's.

  ---

  ### Degeneracy Without Non-Fungibility

  If unrestricted cash side payments were allowed, the feasible set would be defined by $x_1 + x_2 \le V$. The frontier would be a straight line with slope $-1$.
  *   **NBS:** Maximizes $x_1(V-x_1)$, yielding $x_1 = V/2$.
  *   **KSS:** With symmetric ideals (or rescaled utilities), the ray intersects the line at the midpoint.
  *   **Result:** The rules coincide. The disagreement vanishes.
  *   **Workshop Implication:** This case demonstrates that the choice of rule matters *only* when efficiency frontiers are curved or kinked due to institutional frictions (liquidity, policy caps, indivisibilities). If your workshop participants assume transferable utility, the debate is moot. The "weight" of the disagreement depends entirely on the degree of non-fungibility in the specific institutional context.

  ---

  ### Strategic Withholding and Steelman Replies

  **Strategic Withholding:**
  *   **Under Nash:** Since NBS satisfies IIA, a party cannot manipulate the outcome by adding/removing non-chosen options. However, they can manipulate the *shape* of the frontier. In this case, Spinout benefits from keeping Option A on the table? No, NBS ignores A. But Spinout benefits from *hiding* Option C? If C is hidden, $u_2$ drops, potentially shifting the NBS kink.
  *   **Under Kalai–Smorodinsky:** KSS is vulnerable to "ideal point padding." Spinout has a strong incentive to keep Option A on the menu, even if A is never chosen. A inflates $u_1$, flattening the ray and increasing Spinout's share. If Spinout can quietly keep A off the table, $u_1$ drops, and their share collapses (as seen in the Shrinking Test).

  **Steelman Replies:**

  *   **For Nash (The Stability Argument):** The fact that NBS ignores Option A is a feature, not a bug. Option A is a "phantom" deal—operationally difficult for Uni (policy cap violation) and unlikely to be signed. Basing the arbitration on a phantom deal (as KSS does) allows Spinout to hold the process hostage to an unrealistic best-case scenario. NBS focuses only on viable compromises (like B), ensuring stability against strategic menu padding.
  *   **For Kalai–Smorodinsky (The Monotonicity Argument):** The Menu Expanding Test shows KSS's strength. When Option F (a superior structured deal) became available, KSS allowed both parties to benefit. NBS, perversely, made Uni worse off despite the expansion of total value. In dynamic negotiations where new value-creating options emerge, KSS guarantees that growth is shared, whereas NBS can penalize a party if the new value alters the product-maximizing balance of power. An arbitrator prioritizing "growth sharing" should prefer KSS.
