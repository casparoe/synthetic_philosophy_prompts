  4.  **Develop the Argument for Prioritisation:**
      *   *Thesis:* The priority must be **Question 1 (The Metaphysics of Will-Formation)**.
      *   *Reasoning:* You cannot assess the legitimacy of algorithmic populism (Q2) or its constitutional implications (Q3) without first settling whether "will" *requires* formation. If "will" is merely aggregate preference (revealed preference theory), algorithms win. If "will" requires reflexive endorsement (Kantian/Rousseauian), algorithms fail. This is the hinge.
