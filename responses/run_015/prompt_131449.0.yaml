answer: |-
  **Research Agenda: The Metaphysics of Algorithmic Will-Formation**

  Your intuition is correct: the literature on populism has become preoccupied with the institutional symptoms of the phenomenon while neglecting the ontological shift underpinning it. The convergence of populist rhetoric and algorithmic governance represents a fundamental challenge to the concept of 'the will' itself. To treat this merely as a question of institutional design or epistemic accuracy is to misunderstand the threat.

  Below is a committed, three-phase research agenda. It prioritises the metaphysical question of collective intentionality above the normative and constitutional questions. This ordering is not arbitrary; it is dictated by the logical dependencies of the problem. If the distinction between will-formation and will-expression cannot be philosophically sustained, the subsequent debates regarding democratic legitimacy and constitutional limits are rendered moot.

  ### Phase 1: The Metaphysical Priority (Months 1–18)
  **Core Question:** *Is the distinction between will-formation and will-expression conceptually robust, or does it rely on an untenable dualism of inner reflection and outer action?*

  This is the upstream bottleneck. Current democratic theory largely assumes a Rousseauian or Habermasian model where the 'general will' or 'public reason' emerges only through a process of mediation (deliberation, voting, assembly). Algorithmic governance, conversely, operates on a behaviourist model of 'revealed preference', where the will is identical to the aggregate of unreflective actions.

  **Priority Justification:**
  You must tackle this first because it determines the category error in the subsequent debates. If 'will' is nothing more than aggregate behaviour, then algorithmic extraction is not a distortion of democracy; it is its perfection. If, however, 'will' necessitates a reflexive moment of endorsement—a distinction between *what I do* and *what I will*—then algorithmic extraction is categorically incapable of producing a democratic mandate, regardless of its accuracy.

  **Methodology:**
  This requires conceptual analysis rooted in the philosophy of action and collective intentionality, not empirical social science. You must analyse whether 'collective will' can exist without the cognitive labour of formation. Engage with the literature on group agency (e.g., List and Pettit) but push it into the digital realm. The goal is to establish whether the 'silent majority' captured by data scraping possesses the requisite intentionality to be a political subject.

  **Contested Premise:**
  *This phase rests on the normative assumption that democratic agency requires reflexive endorsement.* It assumes that a preference is not a will until it has been subjected to some form of second-order volition (to borrow Frankfurt's terminology). This is a contested Kantian/Rousseauian commitment. A utilitarian or behaviourist would reject this, arguing that satisfaction of preferences is sufficient for legitimacy. Your project must explicitly defend the necessity of reflection as a condition of sovereignty, rather than treating it as self-evident.

  ### Phase 2: The Normative Consequence (Months 19–36)
  **Core Question:** *If the formation/expression distinction is robust, does the algorithmic collapse undermine the normative authority of populist mandates, or can a synthetic, data-derived will carry democratic weight?*

  **Priority Justification:**
  This is downstream of Phase 1. You cannot assess the *authority* of the algorithmic will until you have defined its *nature*. If Phase 1 concludes that algorithmic data captures only 'impulses' rather than 'will', then Phase 2 becomes an exercise in demonstrating why impulses lack normative authority. However, if Phase 1 concedes that data can constitute a form of will (perhaps a 'passive' will), Phase 2 must determine whether this passive will holds the same sovereign weight as a deliberative one.

  **Tractability:**
  This is highly tractable through conceptual analysis because it deals with the conditions of legitimacy. The trap to avoid here is empirical: do not get bogged down in whether algorithms *accurately* measure sentiment. The philosophical problem is whether accurate measurement of sentiment *matters* for legitimacy. Focus on the concept of 'mandate'. A populist claims a mandate because they embody the will. If the will is algorithmically synthesized, is the mandate valid?

  **Decorative Inquiry to Avoid:**
  Disregard debates on whether digital plebiscites increase turnout or satisfaction. These are empirical metrics of stability, not philosophical metrics of legitimacy. Resolving whether citizens *feel* more represented by algorithms changes little about whether they *are* rightfully governed by them.

  ### Phase 3: The Constitutional Boundary (Months 37–48)
  **Core Question:** *How does algorithmic extraction affect the boundary problem—specifically, whether popular sovereignty can be limited by constitutional essentials without betraying the populist premise?*

  **Priority Justification:**
  This is the furthest downstream. The 'boundary problem' (who constitutes the people and what limits their power) relies on the output of Phases 1 and 2. Populism traditionally argues that the people's will is unlimited (absolute sovereignty). Algorithmic governance radicalises this by presenting the will as continuous and real-time, rendering constitutional 'speed bumps' (courts, bicameralism) appear as obstructions to the authentic voice.

  **Tractability:**
  This is less tractable through pure conceptual analysis and risks drifting into institutional design. However, its priority is lowest because the solution depends entirely on the definition of 'will' established in Phase 1. If the algorithmic will is deemed 'defective' (lacking formation), then constitutional limits are not betrayals of sovereignty but protections of the *conditions* for sovereignty. If the algorithmic will is deemed valid, then constitutionalism faces an existential crisis that cannot be solved without redefining the constitution itself.

  **Decorative Inquiry to Avoid:**
  Avoid proposing specific regulatory frameworks for AI in elections at this stage. Proposing 'guardrails' is premature if we have not established why the vehicle is dangerous. Much of the current policy literature is decorative because it attempts to mitigate the effects of algorithmic populism without challenging its core claim to represent the 'real' will.

  ### Summary of Dependencies and Risks

  The logic of this agenda is strictly hierarchical:
  1.  **Ontology (Phase 1):** What *is* the algorithmic will?
  2.  **Normativity (Phase 2):** What *authority* does it hold?
  3.  **Institutionalism (Phase 3):** How do we *contain* or *channel* it?

  **Why this order matters:**
  If you begin with Phase 3 (Constitutional Limits), you risk accepting the populist/algorithmic premise that there *is* a coherent, unlimited will that simply needs taming. This concedes the most important philosophical ground. By starting with Phase 1, you challenge the existence of the entity that populists and technocrats claim to serve.

  **Flagged Contested Premises:**
  1.  **The Necessity of Mediation:** The entire agenda presupposes that mediation (delay, deliberation, formation) is a feature of democracy, not a bug. This is a direct rebuttal to the populist ideal of unmediated identity between ruler and ruled. You must defend this against the charge of elitism.
  2.  **The Unity of 'The People':** The agenda assumes 'the will of the people' is a singular object of analysis. However, algorithmic governance often fragments the populace into micro-targeted clusters. You must address whether 'the will' can exist if the 'people' are computationally disaggregated.
  3.  **The Role of Philosophy:** This agenda assumes that conceptual clarity can constrain political practice. A sceptic might argue that if populists and technocrats *successfully* wield algorithmic will, its philosophical coherence is irrelevant. You must argue that legitimacy crises stem from conceptual incoherence, making the philosophical work politically potent.

  ### Conclusion

  Do not be seduced by the urgency of the technological change into skipping the metaphysical groundwork. The most decorative line of inquiry currently dominating the field is the attempt to reconcile algorithmic governance with existing deliberative norms without first asking if they are commensurable. They may not be.

  Your priority must be to demonstrate that **will-formation is a necessary condition for democratic sovereignty.** If you can establish that data extraction bypasses the agency required for sovereignty, you undermine the normative authority of algorithmic populism at its root. Everything else—mandates, boundaries, institutions—follows from that determination. Start there.
