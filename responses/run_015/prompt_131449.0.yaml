  2.  **Deconstruct the Core Problem:**
      *   *Traditional View:* Will is formed through deliberation (assembly, debate) and then expressed (voting, mandate).
      *   *Algorithmic View:* Will is extracted from behaviour (clicks, sentiment analysis) without conscious formation. It bypasses the "black box" of deliberation.
      *   *Populist Connection:* Populists claim to speak the "real" will. Algorithms claim to measure the "real" will. There's a convergence here that threatens liberal democratic norms (mediation, rights, minorities).

  3.  **Evaluate the Three Key Questions for Prioritisation:**

      *   *Question 1: Robustness of Formation/Expression Distinction.*
