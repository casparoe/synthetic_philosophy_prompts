          *   *Upstream/Downstream:* Upstream. If the distinction doesn't hold, the rest of the critique of algorithmic governance collapses.
          *   *Tractability:* High for conceptual analysis (philosophy of action, collective intentionality).
          *   *Impact:* High. If formation is unnecessary, deliberative democracy is dead.

      *   *Question 2: Normative Authority of Data-Derived Will.*
          *   *Status:* Normative/Political.
          *   *Upstream/Downstream:* Downstream of Q1. You can't judge the authority of the output until you define the nature of the process.
          *   *Tractability:* Medium. Requires bridging metaphysics and normative theory.
