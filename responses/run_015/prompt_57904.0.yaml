answer: |-
  ### The "One Voice" River Watch Filter

  **The Goal:** Stop the council from ignoring us. We act as one team, not 30 individuals.
  **The Rule:** No volunteer emails the Council directly unless it is a life-safety emergency. All non-emergency reports go to the Coordinator (you) first.

  **The 5-Minute Checklist**
  *(Run this mentally or on your phone when you spot something)*

  1.  **Is it an Immediate Danger?** (e.g., Chemical smell making you sick, major flood risk, fire).
      *   **YES:** Call Council Emergency/Cleanup Crew **NOW**. Tell Coordinator afterwards.
      *   **NO:** Go to Step 2.
  2.  **Check the Group Chat/Log.**
      *   Has someone else posted this location/issue in the last 4 hours?
      *   **YES:** **HOLD BACK.** React to their post with a "thumbs up" to confirm. Do not report.
      *   **NO:** Go to Step 3.
  3.  **Is it Clearly Pollution?** (e.g., Dead wildlife, bright colors, thick foam). Or could it be nature? (e.g., Mud, leaves, rain runoff).
      *   **UNSURE:** Post a photo in the Chat. Ask: *"Looks like oil or just rain?"* Wait 15 mins for consensus.
      *   **CLEAR:** Go to Step 4.
  4.  **Submit to Coordinator.**
      *   Send photo, location, and time to Coordinator.
      *   **STOP.** Do not email the Council yet.
      *   **Coordinator Action:** Coordinator consolidates reports and sends **one** email to the Council.

  ***

  ### Running the Rule on Two Cases

  #### Case 1: Oily Sheen on a Rainy Day
  *   **Situation:** It's been raining hard. You see a rainbow sheen on the water near the road.
  *   **Running the Rule:**
      1.  **Danger?** No.
      2.  **Chat Check:** You see two other volunteers already posted "Runoff looking oily near Bridge St."
      3.  **Decision:** **HOLD BACK.** You react to their post with a "👍".
  *   **Outcome:** The Council gets one report noting "multiple confirmations" instead of five identical emails.
  *   **Verdict:** Works as intended. Prevents noise.

  #### Case 2: Dead Fish Near an Outflow (The Annoying One)
  *   **Situation:** You find 10 dead fish floating near a pipe. Water looks grey. You are angry and want the Council to know *immediately*.
  *   **Running the Rule:**
      1.  **Danger?** No (not toxic to you directly).
      2.  **Chat Check:** Nothing posted yet.
      3.  **Clear Pollution?** Yes, dead fish are clear.
      4.  **Submit to Coordinator:** You message the Coordinator. **You must wait for them to send the email.**
  *   **Why This Annoys Us:** You want to blast the Council *now*. This rule forces you to wait for the Coordinator to wake up/check their phone/consolidate the report. It feels like bureaucracy when you want action.
  *   **Why We Do It Anyway:** If you email, and three others email, the Council marks it as spam. If the Coordinator sends one email saying "5 volunteers confirm dead fish," the Council *must* act. The delay saves the impact.

  ***

  ### Where This Rule Will Still Mess Up (Honest Limitations)

  1.  **The Coordinator Bottleneck:** If you (the Coordinator) are on holiday, sick, or busy, reports pile up. The river gets polluted, and the Council hears nothing because everyone is waiting for your sign-off.
      *   *Fix:* Designate one "Deputy Coordinator" to act when you are unreachable.
  2.  **False Negatives (The Quiet Volunteer):** A new volunteer might see something weird, feel unsure about Step 3, and decide not to bother anyone. Real pollution gets missed because the rule felt too much like homework.
      *   *Fix:* Remind the team: "Better a false alarm to me than a missed spill. If in doubt, send it to me."
  3.  **Groupthink:** In Step 3 (Chat Check), if the first person says "That's just mud," everyone else might agree to avoid conflict, even if it *is* pollution.
      *   *Fix:* Encourage dissent. "If you disagree with the chat consensus, message the Coordinator directly."

  **Coordinator Sign-Off:**
  *This protocol shifts the burden from the Council (filtering duplicates) to us (filtering before sending). It will feel slower, but it restores our credibility.*
