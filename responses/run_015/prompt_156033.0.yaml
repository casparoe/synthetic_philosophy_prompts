answer: |-
  Your "protocol mismatch" metaphor is sharp, but you've identified the bug in your own model: a mismatch implies an error state. For Dave and your dad, this is a feature, not a bug. It's not that the handshake fails; it's that they are running a **dual-stack system** that routes packets differently depending on the header.

  You are describing a specific epistemological architecture. Here are the concepts that map to what you're seeing, how they differ from your model, and where the boundaries lie.

  ### 1. The Switching Mechanism: "Hinge Propositions"
  You asked about the register-switching. The precise concept for this comes from Wittgenstein's later work, *On Certainty*. He calls them **Hinge Propositions**.

  In any system, there are some propositions that look like empirical facts ("The server is down," "The earth exists," "Christ rose from the dead") but function as **configuration rules**. They are the hinges on which the door of inquiry turns. You don't test the hinge; you use the hinge to test the door.

  *   **Normal Mode:** When Dave is talking about the Resurrection as a fact, he is operating *within* the system where that hinge is installed. In this mode, it behaves exactly like a fact. It has truth conditions (it happened or it didn't).
  *   **Defense Mode:** When you ask, "What would change your mind?", you are attacking the hinge itself. The system cannot process this as a normal query because the hinge is what defines valid queries. So it switches to a meta-protocol: "This isn't reachable by argument; you need to be inside the practice."

  **How this differs from your "Protocol Mismatch":**
  A mismatch implies two different systems failing to talk. Hinge Propositions explain how *one* system handles two types of data. To Dave, he isn't switching truths; he's switching between **runtime data** (parking spaces, historical claims) and **root permissions** (what counts as evidence). He doesn't feel confused because, in his architecture, the root permissions are not subject to runtime validation.

  ### 2. The Immunity: "Bliks"
  Your description of "nothing would change their minds" matches a concept coined by philosopher R.M. Hare called a **Blik**.

  Hare used the example of a paranoid student who believes all professors are trying to kill him. No amount of evidence (professors smiling, giving good grades) changes his mind. He interprets the evidence *through* the belief. Hare argued that religious belief is a *Blik*: a fundamental way of seeing the world that isn't itself a hypothesis.

  *   **The Fit:** This explains why Dave isn't embarrassed about immunity to evidence. A *Blik* isn't supposed to be falsifiable. It's the lens, not the object.
  *   **The Tension:** Hare argued *Bliks* aren't factual claims. But Dave *does* claim they are facts ("Resurrection happened or it didn't").
  *   **Resolution:** Dave is treating a *Blik* as a Fact. This is the dual-stack. The *Blik* provides the interpretive layer (God answers prayers), and the Fact provides the object layer (A parking space opened). When the parking space opens, it validates the *Blik*. When the parking space doesn't open, the *Blik* absorbs the error (e.g., "It wasn't God's will"), protecting the core from falsification.

  ### 3. The Friend's Suggestion: "Properly Basic Beliefs"
  Your friend suggested these are beliefs held without argument, like trust in a wife or memory. In philosophy, this is **Reformed Epistemology** (associated with Alvin Plantinga), specifically **Properly Basic Beliefs**.

  *   **The Claim:** Some beliefs are rational to hold without evidence because they are foundational to your cognitive equipment. "I see a tree," "I have a past," and "God is speaking to me" are all in the same bucket.
  *   **Vs. Wittgenstein:** Wittgenstein says religious language is a different *game* (don't treat it like science). Plantinga says religious belief *is* knowledge, just like science, but it starts from a different *axiom*.
  *   **Why Dave likes this:** This allows Dave to say, "It is objectively true" (Plantinga) while also saying, "I don't need to argue you into it" (Basic). It validates the "objective truth" claim your dad makes, which pure Wittgensteinians sometimes shy away from.

  ### 4. Is Wittgenstein Committed to Saying It's Not Fact?
  You asked if the Wittgensteinian picture says Dave *can't* be stating facts.

  Strict Wittgensteinians (like D.Z. Phillips) argue that treating religious claims as empirical facts is a **category mistake**. They would say Dave is confused when he says, "It happened or it didn't, like a server status." They argue religious language expresses a *commitment*, not a *state of affairs*.

  However, a more modern reading (and the one that fits Dave better) is that Wittgenstein describes **grammar**, not **ontology**. Wittgenstein says: "Look at how this word is *used*."
  *   If Dave uses "God exists" to comfort the dying, it's functioning as a commitment.
  *   If Dave uses "Resurrection happened" to debate history, it's functioning as a fact.
  *   Wittgenstein doesn't say Dave is *wrong* to call it a fact; he says the *weight* of that fact doesn't rest on empirical evidence in the way a server status does. It rests on the form of life.

  So, Wittgenstein isn't saying Dave *can't* state facts. He's saying the **verification conditions** for those facts are internal to the religious form of life, not external (scientific) ones.

  ### 5. The Edges: What Looks Like This But Isn't?
  To know if you've identified the right joint, you need to know what doesn't fit.

  **Case A: Conspiracy Theories (Not the same)**
  A QAnon believer says, "The elites run the world." If you ask for evidence, they provide links, videos, and documents. If you debunk them, they say, "You're part of the cover-up."
  *   *Difference:* This is **Hypothesis Protection**, not Hinge Propositions. They claim to have empirical evidence (which is fake). Dave admits he doesn't have empirical evidence accessible to you. Conspiracy theorists claim the evidence is hidden; Dave claims the evidence is experiential/structural.

  **Case B: Liberal/Symbolic Theology (Not the same)**
  A progressive believer says, "The Resurrection is a metaphor for hope reborn."
  *   *Difference:* They surrender the factual claim. Dave does not. Your phenomenon requires the tension between **Factual Realism** ("It happened") and **Evidential Immunity** ("Proof doesn't matter").

  **Case C: Scientific Paradigms (Similar, but distinct)**
  A physicist in 1890 believes in Newtonian mechanics. They can't imagine physics without it.
  *   *Difference:* They admit, in principle, that enough anomalies would break the paradigm (Kuhn). Dave says, in principle, *nothing* would break the belief. The religious hinge is **transcendental**; the scientific paradigm is **provisional**.

  ### Summary for Your Argument
  You don't need to win the argument, but you need the vocabulary to stop losing the conceptual ground.

  1.  **Your "Protocol Mismatch" is close,** but call it **Encapsulation**. The core belief is encapsulated. It exposes a public API that looks like factual claims (`isTrue()`, `getHistoricalEvent()`), but the internal logic is private and protected from external writes.
  2.  **The Switching** is handled by **Hinge Propositions**. When things are normal, the hinge looks like a fact. When the hinge is poked, it reveals itself as a rule.
  3.  **The Immunity** is a **Blik** or **Properly Basic Belief**. It is the operating system, not an app running on it.
  4.  **The Fact Claim:** Dave is not lying when he says it's true. He is operating in a system where "Truth" is defined by coherence with the Form of Life, not just correspondence with empirical data.

  **The Edge:** If Dave started producing physical artifacts (bones, photos) and claimed *that* was the basis, he would move out of this category and into standard empirical claims. If he said, "It's just a nice story," he moves out too. The phenomenon you're tracking exists specifically in the tension where **ontological realism** meets **epistemic immunity**.

  Dave isn't confused. He's running a legacy monolith that doesn't expose its source code, but insists it's producing valid output. You're trying to run unit tests on it, and he's telling you the tests don't apply to the kernel. He's right about the kernel; you're right about the tests. That's the stalemate.
