answer: |-
  # Desiderata for an Adequate Framework of Authenticity in Historical Jesus Research

  To evaluate whether specific criteria of authenticity can settle the question of who Jesus was, one must first establish the meta-methodological requirements for any such framework. The following desiderata specify what an adequate system must deliver, the distinctions it must maintain, and the constraints it must respect. This specification distinguishes between broadly accepted premises and genuinely contested methodological claims.

  ## I. Core Desiderata and Motivating Considerations

  An adequate framework must satisfy the following five conditions to be considered methodologically sound.

  ### 1. Differentiation of Tradition Layers
  **Requirement:** The framework must distinguish between (a) traditions originating with the historical Jesus, (b) traditions generated by the early Jesus movement prior to the Gospels, and (c) theological redaction by the Evangelists.
  **Motivating Case:** The Lord's Prayer appears in both Matthew and Luke with variations. An adequate framework must determine if the core petition is traceable to Jesus, if the variations reflect liturgical usage in Syria or Palestine, or if they are Matthean/Lukan theological edits. Failure here conflates the founder with the movement.

  ### 2. Contextual Plausibility without Assimilation
  **Requirement:** The framework must verify that a tradition is plausible within first-century Galilean Judaism without assuming that *only* typical Jewish traditions are authentic. It must preserve the distinction between a tradition being *authentic to Jesus* and being *historically accurate about general Judean practices*.
  **Motivating Case:** Jesus' association with "tax collectors and sinners" is contextually plausible (such people existed) but socially distinct (most Jewish teachers avoided them). A framework that demands total typicality erases Jesus' specific agency; one that ignores context makes him an alien anachronism.

  ### 3. Sensitivity to Oral-Textual Dynamics
  **Requirement:** The methodology must align with current understanding of Aramaic oral transmission, specifically the dynamic of "variation within stability." It cannot assume that verbal exactitude proves authenticity nor that variation proves fabrication.
  **Motivating Case:** The Synoptic variations on the Beatitudes. A form-critical assumption that variation implies community creation is increasingly contested by oral tradition research (e.g., the work of Samuel Byrskog or Anthony LeDonne), which suggests variation is inherent to stable oral performance.

  ### 4. Probabilistic Modesty
  **Requirement:** The framework must yield probabilistic assessments rather than binary certainties. It must acknowledge that "authenticity" is a gradient of likelihood, not a switch.
  **Motivating Case:** The Cleansing of the Temple. Most scholars deem this probable, but not certain. A framework that claims to "prove" this event occurred exactly as described in Mark ignores the inherent limits of ancient historiography.

  ### 5. The Strategic Memory Constraint (Niche Requirement)
  **Requirement:** The framework must account for **strategic communal memory**—the selective preservation and reshaping of traditions to serve group identity formation—without allowing that possibility to collapse into a global skepticism that renders all criteria useless.
  **Motivating Case:** Early Christians portrayed Jesus as a new Moses to legitimize their authority. An adequate framework must explain how this shaping occurred while retaining a mechanism to identify the "resistance" of the historical material (i.e., details that were inconvenient for the Church but preserved anyway, such as Jesus' baptism by John or his cry of dereliction). If the framework admits memory is strategic, it must explain why *some* counter-strategic data survived.

  ## II. Jointly Unsatisfiable Tensions

  There is a significant methodological tension inherent in the classic criteria approach that risks logical incoherence.

  **The Tension: Double Dissimilarity vs. Contextual Coherence**
  *   **The Conflict:** The Criterion of Double Dissimilarity requires that authentic material be dissimilar from both contemporary Judaism and the early Church to be considered authentic. However, the Criterion of Contextual Coherence requires that authentic material fit plausibly within the historical setting of first-century Galilee.
  *   **Why they may be jointly unsatisfiable:** If a tradition is truly dissimilar from Judaism, it risks failing Contextual Coherence (making Jesus unintelligible as a Jew). If it is coherent with Judaism, it risks failing Dissimilarity (making it indistinguishable from his peers). Similarly, if a tradition is dissimilar from the Church, it is unclear why the Church preserved it; if it is coherent with the Church's theology, it fails Dissimilarity.
  *   **Flag:** A framework that rigorously enforces Double Dissimilarity often produces a Jesus who is neither a Jew nor the founder of Christianity. A framework that prioritizes Coherence often produces a Jesus who is indistinguishable from his environment. Satisfying both simultaneously is logically precarious and may require abandoning Double Dissimilarity as a primary filter.

  ## III. Brief Scoring of Current Approaches

  Below is a brief assessment of how three dominant methodological frameworks fare against the desiderata above.

  | Approach | Differentiation | Contextual Plausibility | Oral Dynamics | Strategic Memory | Overall Adequacy |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Multi-Criterion** (e.g., Meier, Webb) | **High.** Explicitly designed to separate layers. | **Medium.** Often struggles with the Dissimilarity/Coherence tension. | **Low.** Often relies on textual criticism over oral theory. | **Low.** Often treats memory distortion as noise rather than data. | **Mixed.** Strong on discrimination, weak on transmission mechanics. |
  | **Social-Memory Framework** (e.g., Keith, LeDonne) | **Low.** Focuses on how Jesus is remembered, not necessarily what he did. | **High.** Embeds Jesus firmly in social context. | **High.** Central to the methodology. | **High.** Explains *why* traditions were shaped. | **Mixed.** Strong on context/memory, risks skepticism on specific authenticity. |
  | **Strict Form-Critical** (e.g., Bultmannian legacy) | **Medium.** Good at spotting redaction. | **Low.** Often assumes a disconnect between Jesus and Judaism. | **Low.** Assumes fragmentation rather than stable oral tradition. | **Low.** Views community creation as fabrication rather than strategy. | **Low.** Outdated regarding orality and social dynamics. |

  ## IV. Epistemic Status: Settled vs. Contested

  To maintain methodological integrity, one must distinguish between premises that are broadly accepted and those that remain subjects of intense debate.

  **Broadly Settled (Consensus)**
  *   **Jesus was a first-century Jew:** Any framework must operate within the historical, linguistic, and religious constraints of Second Temple Judaism.
  *   **The Gospels are Theological:** The texts are not neutral biographies but confessional documents aimed at faith formation.
  *   **Oral Tradition Existed:** There was a period of oral transmission prior to the written Gospels.
  *   **Global Skepticism is Unwarranted:** While details are debated, the majority of specialists reject the notion that Jesus is a complete myth or that *nothing* can be known.

  **Genuinely Contested (No Consensus)**
  *   **The Utility of Criteria:** A significant cohort (the "Memory Historians") argues the traditional criteria of authenticity are fundamentally flawed and should be abandoned, while others (the "Third Quest" proponents) argue they remain necessary tools when refined.
  *   **The Malleability of Memory:** There is no agreement on the degree to which communal memory can reshape tradition. Some argue memory is highly plastic (allowing for significant invention); others argue there are "constraints" that preserve core information.
  *   **Apocalyptic vs. Wisdom:** Whether Jesus was primarily an apocalyptic prophet (Schweitzer, Ehrman) or a wisdom teacher/cynic philosopher (Crossan, Borg) remains unresolved, impacting how "Contextual Plausibility" is defined.
  *   **The "Strategic Memory" Limit:** There is no consensus on how to identify the point where strategic shaping begins and historical reporting ends. The mechanism for detecting the "resistance" of the past (Desideratum 5) is theoretically proposed but practically undefined.

  ## V. Conclusion

  An adequate framework for historical Jesus research must navigate the tension between the necessity of critical discrimination and the reality of socially formed memory. It must account for strategic identity formation without succumbing to the conclusion that all tradition is merely projection. Currently, no single approach fully satisfies all desiderata. The Standard Multi-Criterion approach fails on oral dynamics; the Social-Memory approach struggles with specific authentication; the Form-Critical approach is historically outdated. Until the tension between Dissimilarity and Coherence is resolved, and until a reliable control for Strategic Memory is established, any claim to "settle" who Jesus was remains methodologically premature.
