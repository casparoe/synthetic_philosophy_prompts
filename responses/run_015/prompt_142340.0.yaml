prompt: |-
  I'm writing a novel and have backed myself into a corner about state apologies, and I'm hoping you can help me find the principle I keep fumbling toward. The set-up: a small fictional country (my editor hates the name, but let's call it Vessia) has an institution called the Reckoning — once a year a citizens' assembly picks one historical wrong, and the state apologises for it in a televised ceremony where the text is read aloud not by the head of state but by someone chosen by lot from the population, on the theory that a nation should apologise to itself rather than be apologised for by its politicians. My protagonist is the junior civil servant who drafts these things, and about halfway through the book she starts refusing some of the commissions, and I need to know whether her refusals track anything real or whether I've just handed her my politics.

  Here are my gut verdicts, case by case. (a) The new democracy apologises for a massacre carried out by the junta it replaced fifty years ago; the perpetrators are dead, the survivors' grandchildren are alive. Obviously fine, maybe required. (b) The state apologises for a pogrom carried out ninety years ago by a private mob, where the police stood aside and no one was ever charged. Also fine, and more apt than I'd have guessed, even though the state didn't do it. (c) It apologises for a sterilisation programme that was legal at the time, popular, and administered by doctors who thought they were helping. Fine, and I don't think 'it was legal then' helps the state at all. (d) It apologises for a famine caused by a policy whose authors genuinely didn't foresee the deaths. Fine — intent seems irrelevant to me. (e) It apologises for a wrong committed four hundred years ago by a completely different polity on the same territory, with no institutional continuity and a mostly different population. This one feels hollow, a bit of a stunt. (f) It apologises for a detention system it is currently expanding. Worse than silence — a decoy. (g) It apologises in advance for the displacement a dam will cause, and then builds the dam anyway. I find this more offensive than (f), and I can't say why, since both are apology-plus-ongoing-harm; it's something about the apology functioning as a pre-paid licence. (h) It apologises with generous reparations but names no wrong and no one responsible. Diminished — that's a settlement, not an apology. (i) Descendants of the victims walk out and refuse to accept it. Still counts, but something's missing. (j) The pair I can't reconcile: I genuinely don't think an apology is better for having been politically costly to the leader who gave it (a cheap, popular apology seems just as good to me), and yet I'm attached to the sortition bit in my novel — it matters to me who speaks, and I recoil at the president reading it. And then (k), the one I go back and forth on: nobody remembers the wrong, there are no descendants, no group still identifies as the victims, and the surviving records name no one. Is there anything left to apologise for?

  My half-formed rule, which I don't trust, is that a state apology is apt only when some linking relation holds between today's state and the past wrong, and when the apology does something no other act — compensation, prosecution, repeal — could do; when the second condition fails, the apology is redundant at best and a decoy at worst. But I can't cash out the linking relation, and (e) makes me think I've smuggled in something about national continuity I'd be embarrassed to defend out loud. What I'd like back: a principle, or two or three candidates, stated precisely enough that a character could say it without sounding like a windbag; the case that motivates each clause; verdicts on cases I haven't thought of (a wrong whose victims' own leaders organised it; a wrong done to a group that no longer wants to be counted as a group; an apology issued by a court or a truth commission instead of a government; one where neither the state that did it nor anyone who remembers it still exists); and an honest account of which of my verdicts your principle can't accommodate and which you'd overturn. Please also separate what's actually settled among people who work on this from what's genuinely contested, and flag anywhere my gut is probably just my politics in a philosophical costume — I've got a bad habbit of writing characters who sound more authoritative than the material supports, and I'd rather know where I'm bluffing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel about a fictional country (Vessia) with an institution called "The Reckoning" (annual state apology chosen by lot, drafted by a civil servant protagonist).
      *   **Problem:** The protagonist starts refusing commissions. The user needs a philosophical/practical principle to justify these refusals without just inserting their own politics unexamined.
      *   **Input:** The user provides 11 scenarios (a-k) with their gut verdicts on whether the apology is appropriate.
      *   **Goal:**
          1.  Provide 1-3 precise principles a character could articulate.
          2.  Explain the motivation behind each clause.
          3.  Apply principles to new/unthought-of cases.
          4.  Evaluate the user's gut verdicts (which ones hold, which ones might be overturned).
          5.  Distinguish between settled academic/legal consensus and contested philosophical ground.
          6.  Flag where the user's intuition might be personal bias disguised as objective truth.

  2.  **Deconstruct the User's Gut Verdicts:**
      *   (a) Junta massacre (50 yrs ago): *Fine.* (Standard transitional justice).
      *   (b) Private pogrom (state stood aside): *Fine.* (State responsibility for protection).
      *   (c) Legal sterilisation: *Fine.* (Legality $\neq$ morality).
      *   (d) Unintended famine: *Fine.* (Negligence/Outcome > Intent).
      *   (e) 400 yrs ago, different polity: *Hollow.* (Continuity issue).
      *   (f) Current detention expansion: *Decoy.* (Hypocrisy/Bad faith).
      *   (g) Pre-apology for dam displacement: *Offensive.* (License to harm).
      *   (h) Money, no admission: *Settlement, not apology.* (Needs acknowledgment).
      *   (i) Victims walk out: *Still counts, but incomplete.* (Uptake issue).
      *   (j) Cost vs. Sortition: *Cost irrelevant, Speaker matters.* (Symbolic vs. Political).
      *   (k) No memory/descendants: *Doubtful.* (Purpose of apology?).

  3.  **Identify Key Philosophical Themes in State Apologies:**
      *   **Continuity/Identity:** Is the current state the *same* moral agent as the past wrongdoer? (Relevant to e, a).
      *   **Responsibility/Agency:** Did the state cause it, allow it, or benefit from it? (Relevant to b, c, d).
      *   **Function/Teleology:** What does an apology *do*? (Acknowledge truth, restore dignity, promise non-repetition). (Relevant to f, g, h).
      *   **Uptake/Recognition:** Does the victim community accept it? (Relevant to i, k).
      *   **Sincerity/Performance:** Who speaks and at what cost? (Relevant to j).

  4.  **Drafting the Principles:**
      *   *Constraint:* Must be speakable by a character without sounding like a windbag. Needs to be punchy but precise.
      *   *Candidate 1: The Continuity & Capacity Principle.* Focuses on the link between past and present.
      *   *Candidate 2: The Non-Repetition Principle.* Focuses on the future-oriented nature of apology (stopping the harm).
      *   *Candidate 3: The Recognition Principle.* Focuses on the victim's status and the specificity of the wrong.

      *Refining for the Novel:* Let's combine these into a cohesive framework the protagonist might use. Let's call it the "Three Conditions of the Reckoning."
      1.  **Agency/Link:** The State must bear some responsibility (causal or custodial).
      2.  **Cessation:** The harm must not be ongoing or planned.
      3.  **Specificity:** The wrong must be named and acknowledged as a wrong.

      *Wait, looking at the User's specific struggle:* They are stuck on (e) (continuity) and (k) (memory) and (j) (sortition).
      Let's propose two competing principles that the protagonist might wrestle with.
      *Principle A (The Contractual View):* Apology is a repair mechanism for broken trust between state and citizen.
      *Principle B (The Testimonial View):* Apology is a historical record to prevent erasure.

      *Better approach:* Give one robust principle with clauses, as requested ("a principle, or two or three candidates"). Let's go with a **"Felicity Condition"** approach (borrowing from speech act theory, which fits a civil servant character).

      *Draft Principle:* **The Principle of Moral Continuity and Cessation.**
      1.  **Inheritance:** The current state inherits the *obligations* of the past entity only if it inherits the *benefits* or the *authority*.
      2.  **Cessation:** An apology is void if the machinery of the harm is still running.
      3.  **Address:** An apology requires a living memory or a continuing consequence to be received.

  5.  **Addressing the "Settled vs. Contested" Request:**
      *   *Settled:* Legality doesn't excuse morality (c). Ongoing harm makes apology hypocritical (f, g). Specificity matters (h).
      *   *Contested:* Deep time limits (e). Who must speak (j). Victim acceptance necessity (i). Forgotten wrongs (k).
      *   *User Bias Check:* The user thinks sortition matters more than political cost. This is aesthetic/symbolic, not necessarily moral. The user thinks (g) is worse than (f). That's debatable (pre-meditated vs. reactive hypocrisy).

  6.  **Developing the Response Structure:**
      *   **Introduction:** Acknowledge the strength of the setup.
      *   **The Principles:** Offer two distinct frameworks the protagonist could adopt (The "Trust Repair" vs. The "Truth Telling").
      *   **Applying the Principles:** Run the user's cases (a-k) through the frameworks.
      *   **New Cases:** Address the specific new scenarios requested (collaborator victims, dissolved groups, courts vs. gov, extinct states).
      *   **Settled vs. Contested:** Explicitly map the academic landscape.
      *   **Bias Check:** Point out where the user's gut might be personal preference (especially regarding sortition and the "pre-paid license").

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't just say "you're right." I need to challenge the user where they asked for it.
      *   *Challenge:* Case (g) vs (f). User says (g) is worse. Is it? (f) is lying by omission, (g) is lying by commission. Actually, (g) is arguably *more* honest about the intent, but more cynical. I should highlight this tension.
      *   *Challenge:* Case (j). User prefers sortition. Philosophically, does it matter? Hannah Pitkin's representation theory suggests yes (descriptive vs. symbolic). But is it *moral*? I need to separate the *efficacy* of the apology from the *theatre* of it.
      *   *Challenge:* Case (k). If no one remembers, is it for the *perpetrators'* souls or the *state's* character? This is the "national conscience" argument.

  8.  **Final Polish:** Ensure the tone is collaborative, respectful of the creative process, and philosophically rigorous without being jargon-heavy. (The user knows their stuff, so don't dumb it down, but keep it applicable to fiction).

      *Key Insight for the Protagonist:* The protagonist is a *drafter*. Her power is in the *text*. Her refusals should be about the *text's inability to perform the speech act*, not just political disagreement. She is the guardian of the *felicity conditions*.

      *Let's formulate the "Felicity Conditions for State Apology":*
      1.  **Non-Recurrence:** The harm must have stopped.
      2.  **Continuity of Obligation:** The state must be the legitimate successor to the wrongdoer.
      3.  **Receivability:** There must be someone to receive it (living memory or consequence).

      *Wait, one more thing:* The user asked for "what's actually settled." I need to reference real-world transitional justice literature (e.g., Trudy Govier, Nicholas Smith, the UN Basic Principles).

      *(Self-Correction on Case j):* The user feels sortition matters. I should validate this via the concept of "Descriptive Representation" vs "Symbolic Representation." A politician apologizing is a strategic act; a citizen apologizing is a collective act of conscience. This is a valid philosophical distinction, not just bias.

      *(Self-Correction on Case g):* Why is it worse than (f)? Because it commodifies the apology. It turns remorse into a line item. That's a strong philosophical point (corruption of the speech act).

      *Okay, ready to write.*
answer: |-
  This is a remarkably sophisticated setup. You have intuitively stumbled onto the central debate in the philosophy of transitional justice: the distinction between **apology as moral repair** and **apology as political performance**.

  Your protagonist is a drafter. Her power isn't policy; it's *language*. Therefore, her refusals shouldn't just be political objections ("I disagree with this"); they should be linguistic/philosophical objections ("This text cannot function as an apology").

  Here are two candidate principles she might use to justify her refusals, followed by an audit of your cases, the settled vs. contested landscape, and where your gut might be misleading you.

  ### Candidate Principle 1: The Felicity Condition (The "Truth-Teller" Approach)
  *Best if your protagonist is a purist about language.*

  **The Principle:** A state apology is a "speech act" that fails (is "infelicitous") if the material conditions contradict the words spoken.
  **The Clauses:**
  1.  **Cessation:** The machinery of the harm must have stopped. You cannot apologize for what you are currently building.
  2.  **Specificity:** The text must name the wrong and the wrongdoer. Vagueness converts apology into settlement.
  3.  **Continuity:** The state must claim the past wrong as *its own* history, not just a tragedy that happened nearby.

  **Why she uses it:** It allows her to refuse cases (f), (g), and (h) on technical grounds. The apology literally doesn't work as an apology; it's a different kind of speech (a promise, a transaction, a lie).

  ### Candidate Principle 2: The Relational Condition (The "Repair" Approach)
  *Best if your protagonist cares about the human impact.*

  **The Principle:** An apology is only apt if it repairs a specific rupture in the relationship between the state and the citizenry.
  **The Clauses:**
  1.  **Receivability:** There must be a living community that identifies as harmed, or a continuing structural disadvantage traceable to the act.
  2.  **Agency:** The state must have been either the perpetrator or the guardian who failed to protect.
  3.  **Non-Instrumentalization:** The apology cannot be used to purchase moral credit for future harms.

  **Why she uses it:** It allows her to refuse cases (e), (g), and (k). It centers the *victim's* reality, not the state's conscience.

  ---

  ### Audit of Your Cases (a–k)
  *Using a synthesis of the above principles and current transitional justice theory.*

  *   **(a) Junta Massacre:** **Settled.** This is the core use case of transitional justice. The state is the successor to the regime; the harm is recent enough to have living memory. **Verdict: Apt.**
  *   **(b) Private Pogrom (State stood aside):** **Settled.** States have a "positive obligation" to protect citizens. Failure to police is state action. **Verdict: Apt.**
  *   **(c) Legal Sterilisation:** **Settled.** "Legality" is never a defense against human rights violations in retrospective justice (see: Nuremberg). **Verdict: Apt.**
  *   **(d) Unintended Famine:** **Contested.** Some argue negligence requires apology; others argue apology requires *malice*. However, the trend is toward **Apt**, because the state owes a duty of care regarding policy outcomes.
  *   **(e) 400 Years Ago (Different Polity):** **Contested.** This is the "Historical Injustice" debate. **Your gut is supported by many philosophers (e.g., Jeremy Waldron):** if there is no institutional continuity, the current state is not the moral agent of the past. However, if the current state *benefits* from the land acquisition, some argue obligation remains. **Verdict: Leans Hollow**, unless Vessia explicitly claims continuity of the old empire.
  *   **(f) Current Detention:** **Settled.** This violates the **Cessation** condition. It is hypocritical. **Verdict: Inapt/Decoy.**
  *   **(g) Pre-emptive Dam Apology:** **Contested, but your gut is sharp.** Philosophically, this is "moral licensing." It treats apology as a commodity. **Verdict: Inapt.** It corrupts the speech act.
  *   **(h) Money, No Admission:** **Settled.** This is *reparations*, not *apology*. Apology requires acknowledgment of fault. **Verdict: Diminished/Not an Apology.**
  *   **(i) Victims Walk Out:** **Contested.** Does an apology require "uptake" (acceptance) to be valid? Most theorists say **No**. The obligation is on the apologizer to offer; the victim is not obligated to forgive. **Verdict: Still Counts.**
  *   **(j) Cost vs. Sortition:** **Deeply Contested.**
      *   *Your Gut:* You prefer sortition.
      *   *Theory:* Political scientists argue a leader's apology carries *authority* to change policy. A random citizen's apology carries *moral weight* but no policy power.
      *   *Novel Insight:* Your instinct is actually philosophically defensible via **Hannah Pitkin's theory of representation**. A politician apologizing is "acting for" the state (strategic). A citizen chosen by lot is "standing for" the state (symbolic/descriptive). If the goal is "a nation apologising to itself," sortition is actually *more* coherent than a President. **Verdict: Your gut is defensible.**
  *   **(k) No Memory/Descendants:** **Contested.** Is this for the dead or the living? If it's for the living (to shape current character), it might hold. If it's for the dead, it's incoherent (the dead cannot be wronged in the present). **Verdict: Leans Inapt**, unless framed as "preserving truth" rather than "seeking forgiveness."

  ---

  ### New Cases You Requested

  1.  **A wrong whose victims' own leaders organised it (Collaboration).**
      *   *Verdict:* **Apt, but complex.** The state still apologizes for its failure to protect, but the text must acknowledge the complexity. (See: Apologies for the Holocaust in occupied territories where Jewish Councils were involved).
  2.  **A wrong done to a group that no longer wants to be counted as a group.**
      *   *Verdict:* **Inapt.** Forcing an identity on a group to apologize to them is a second violence. The apology must be reframed to the *individuals* or the *principle* violated, not the group identity.
  3.  **An apology issued by a court or truth commission instead of a government.**
      *   *Verdict:* **Distinct Category.** Courts issue *findings*; Truth Commissions issue *records*. Only the Executive/Legislative can issue *apologies* because only they can promise non-repetition (policy change). A court apologizing is category confusion.
  4.  **One where neither the state that did it nor anyone who remembers it still exists.**
      *   *Verdict:* **Inapt.** This becomes art or memorialization, not apology. There is no relationship to repair.

  ---

  ### Settled vs. Contested (The "Bluff Check")

  **What is Settled (You can write this with authority):**
  *   **Legality $\neq$ Morality:** (Case c). You can confidently have your protagonist say, "Law is not a shield against shame."
  *   **Ongoing Harm Voids Apology:** (Case f). An apology while continuing the crime is gaslighting. This is widely accepted in UN Basic Principles on Gross Violations.
  *   **Specificity:** (Case h). "We are sorry for things that happened" is not an apology. The verb must have a direct object.

  **What is Contested (Your character should hesitate here):**
  *   **The Time Limit:** (Case e). There is no statute of limitations on morality, but there is on political obligation. Your character might struggle here. Is Vessia responsible for the Empire of 1600?
  *   **The Necessity of Forgiveness:** (Case i). Your character might *feel* the walk-out invalidates the apology, but philosophically, it doesn't. She might have to learn that her job is to *offer*, not to *resolve*.
  *   **The Speaker:** (Case j). You feel sortition is better. Be careful not to have your character claim it is *more effective* politically. It is *more pure* morally, but less effective practically. Distinguish those.

  **Where Your Gut Might Be Politics in Costume:**
  *   **Case (g) vs (f):** You find the pre-emptive apology (g) worse than the concurrent one (f).
      *   *The Challenge:* Is it? In (f), they are lying about the present. In (g), they are admitting the harm but claiming necessity. (g) is arguably *more* honest about the trade-off, even if cynical. Your revulsion might be aesthetic (the cold calculation) rather than moral.
      *   *Fix:* Have your protagonist realize that (g) is offensive not because it's hypocritical, but because it **commodifies remorse**. It turns shame into a budget line item. That is a stronger philosophical objection than "it's hypocritical."
  *   **Case (k):** You waffle on the "forgotten wrong."
      *   *The Challenge:* If you are a materialist, (k) is nonsense. If you are an idealist, (k) is vital for the "soul of the nation."
      *   *Fix:* Don't let your protagonist decide this absolutely. Let her refuse (k) on the grounds of **Receivability** (Principle 2), but have a mentor character argue for **Testimony** (Principle 1: "We do it so *we* remember, not so *they* forgive"). This creates conflict.

  ### Recommendation for the Novel

  Give your protagonist **Principle 1 (Felicity/Cessation)** as her hard line. She will refuse (f) and (g) because the text *cannot work*.

  But give her **Case (k)** as her crisis. She is asked to draft an apology for a wrong no one remembers.
  *   If she refuses, she implies the state has no soul beyond its living citizens.
  *   If she accepts, she implies the state is a priestly caste performing rituals for the void.

  The principle she fumbles toward is likely **The Principle of Non-Alienation**: *An apology is only apt if it brings the state and the citizenry closer to a shared truth. If the apology creates a new fiction (that the state is benevolent while building a dam, or that the state is continuous with a polity it replaced), it alienates the citizen from the truth.*

  This allows her to refuse (e) (false continuity), (f) (false benevolence), and (h) (false settlement), while accepting (a), (b), and (c). It leaves (g) and (k) as the complex tensions where she might eventually break or evolve.

  **One specific note on Case (j) (Sortition):**
  Don't let her say "It matters who speaks." Let her say: *"When a President apologises, he asks for our trust. When a citizen apologises, she asks for our conscience. We don't need their trust. We need our conscience."* That captures your intuition without making a claim about political efficacy that political scientists would tear apart.
