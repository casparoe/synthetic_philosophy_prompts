prompt: |-
  Act as an expert philosopher of mind with specialist knowledge of teleosemantics and the naturalisation of mental content. Before constructing the procedure, spend a few sentences brainstorming how proper-function analysis, consumer-based accounts, and conditions for misrepresentation can be operationalised for non-specialists without collapsing into behaviourism or intentional-stance pragmatism, and flag where synthetic functional redundancy breaks the evolutionary paradigm.

  I am a PhD student in philosophy of cognitive science serving on an interdisciplinary research-ethics panel that reviews proposals attributing representational content to biological organisms or engineered systems. The panel convenes monthly, has forty-five minutes per proposal, and includes scientists with no philosophical training. We need a reusable decision procedure—an ordered checklist with decision nodes—to determine whether attributing a specific representation (e.g., that system S represents 'predator presence') is justified on teleosemantic grounds.

  Write the procedure with these specifications:
  - For each step, state what evidence is sufficient, what answer yields a negative verdict, and what answer forces a value judgement rather than a factual determination.
  - Preserve the distinction between proper function, normal conditions, and misrepresentation; do not reduce content to current causal covariance alone.
  - Include explicit instructions for handling engineered systems that possess functional redundancy but lack an evolutionary selection history—this is the hard case our guidelines currently fail on.
  - Provide a small battery of four-sentence test scenarios reviewers can apply rapidly.
  - Then apply the procedure to three proposals:
    1. Attributing a 'food-source' representation to a foraging ant's pheromone-trail system.
    2. Attributing a 'threat' representation to a synthetic drone-vision module with triple-redundant feature detectors engineered to replicate avian escape responses but with no evolutionary history.
    3. A case where the procedure grants the attribution yet the result is counter-intuitive; explain precisely what the procedure cannot resolve and why human judgement must take over.

  Clearly flag where the procedure will misfire, particularly with synthetic redundancy, and state its limits. Do not provide bibliographies, reading lists, or citations. Use British spelling and write in a formal, polished register.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Expert philosopher of mind (specialist in teleosemantics, naturalisation of content).
      *   **Task:** Create a reusable decision procedure (checklist with decision nodes) for an interdisciplinary ethics panel to evaluate claims of representational content in biological/engineered systems.
      *   **Constraints:**
          *   Brainstorming section first (operationalising proper function, consumer accounts, misrepresentation without collapsing into behaviourism/pragmatism; flagging synthetic redundancy issues).
          *   Procedure specifications: Evidence sufficiency, negative verdict triggers, value judgement flags.
          *   Preserve distinctions: Proper function vs. normal conditions vs. misrepresentation (no simple covariance).
          *   Handle engineered systems (functional redundancy without evolution).
          *   Include a 4-sentence test scenario battery.
          *   Apply to three specific cases (Ant, Drone, Counter-intuitive case).
          *   Flag limits/misfires (especially synthetic redundancy).
          *   No citations/bibliographies.
          *   British spelling, formal register.
          *   Time/Context: PhD student on a panel, 45 mins/proposal, mixed audience (scientists + philosophers).

  2.  **Brainstorming & Conceptual Grounding (Mental Draft):**
      *   *Challenge:* How to explain teleosemantics to scientists without dumbing it down into "it acts like it believes X" (intentional stance) or "it correlates with X" (covariation).
      *   *Key Concept:* Proper Function. It's not what a thing *does*, but what it was *selected to do*. For biology, this is evolution. For engineering, this is design intent.
      *   *Consumer Systems:* A state represents $X$ only if there is a downstream mechanism (consumer) that uses that state to perform its proper function, and that usage is correct only if $X$ is the case.
      *   *Misrepresentation:* Crucial. If the system can't be wrong, it doesn't represent. It must be possible for the consumer to act on the state in a way that fails its function *because* the state was inaccurate.
      *   *Synthetic Redundancy:* This is the hard case. If I build three sensors to detect a predator, and they all agree, is it representation? Teleosemantics usually demands a selection history. Engineered systems have "derived" intentionality. If the redundancy is just reliability engineering, it might not ground *content* in the teleosemantic sense, but rather *information* in the Shannon sense. The procedure needs to distinguish between "designed to indicate" (weak) and "has a proper function to indicate" (strong).
      *   *Operationalisation:* Avoid jargon like "etiological function." Use "historical selection role." Avoid "intentional stance." Use "design purpose vs. actual output."
      *   *Risk:* Collapsing into pragmatism (it's useful to treat it as representing). Must insist on the *mechanism's* history, not the *observer's* utility.

  3.  **Drafting the Brainstorming Section:**
      *   Focus on translating "proper function" to "historical selection role."
      *   Focus on "consumer systems" as "downstream mechanisms that rely on the signal."
      *   Focus on "misrepresentation" as "system error leading to functional failure."
      *   Flag the synthetic redundancy issue: Evolution selects for fitness; engineering selects for reliability. If redundancy masks error, misrepresentation becomes impossible, killing content.

  4.  **Developing the Decision Procedure:**
      *   *Structure:* Step-by-step nodes.
      *   *Step 1: Mechanism Identification.* Is there a distinct state?
      *   *Step 2: Historical Selection.* Was it selected (evolution or design) to correlate with $X$?
      *   *Step 3: Consumer System.* Is there a downstream user?
      *   *Step 4: Normal Conditions.* Does the consumer rely on $X$ being true?
      *   *Step 5: Misrepresentation.* Can the system fail when $X$ is false?
      *   *Step 6: Engineered Systems.* Specific check for derived intentionality vs. mere reliability.
      *   *Formatting:* Clear headings, "Sufficient Evidence," "Negative Verdict," "Value Judgement."

  5.  **Developing the Test Scenarios:**
      *   Need four sentences. Quick heuristics.
      *   1. History (Selection).
      *   2. Consumer (Usage).
      *   3. Error (False Positive).
      *   4. Independence (Not just observer utility).

  6.  **Applying the Procedure:**
      *   *Case 1 (Ant):* Classic teleosemantics. Evolutionary history exists. Consumer (motor system) exists. Misrepresentation possible (fake trail). Verdict: Justified.
      *   *Case 2 (Drone):* Engineered. Design history exists. But *triple-redundant*. This is the trap. If redundancy ensures it never triggers falsely, misrepresentation is structurally suppressed. Or, if the redundancy is just for reliability, does it have a "proper function" in the teleosemantic sense? It has derived intentionality. The procedure needs to flag this as "Derived Content" not "Original Content." Verdict: Conditional/Qualified.
      *   *Case 3 (Counter-intuitive):* Needs to pass the test but feel wrong. Maybe a simple thermostat? Or a gene regulatory network? Let's go with a gene regulatory network that meets criteria but feels like mere causation. Or better, a 'reflex' that passes the consumer test but lacks cognitive depth. Let's choose a simple bacterial chemotaxis system. It passes teleosemantics (Millikan would agree), but scientists might resist calling it "representation" due to cognitive baggage. This highlights the gap between philosophical content and psychological content.

  7.  **Refining the Synthetic Redundancy Issue:**
      *   This needs careful handling. In engineering, redundancy is often there to *prevent* error. Teleosemantics *requires* the possibility of error (misrepresentation) to define content. If the system is engineered to be error-proof via voting mechanisms, does it represent?
      *   *Decision:* The procedure must distinguish between the *sensors* representing and the *voting module* aggregating. If the voting module makes error impossible, it doesn't represent; it computes. The sensors represent. I need to make sure the procedure catches this.
      *   *Correction:* The prompt asks to handle engineered systems with functional redundancy but no evolutionary history. The limit is that teleosemantics relies on *selection*. Engineering provides *design*. We must treat design intent as analogous to selection, *but* redundancy complicates the "normal conditions" clause. If redundancy makes failure statistically negligible, the "normal condition" becomes "always true," which threatens the possibility of misrepresentation. I must flag this as a limit.

  8.  **Review against Constraints:**
      *   British spelling (naturalisation, operationalised, programme, etc.).
      *   Formal register.
      *   No citations.
      *   Brainstorming section included.
      *   45-minute context (keep it efficient).
      *   Specific application to the three cases.

  9.  **Final Polish:**
      *   Ensure the distinction between "Value Judgement" and "Factual Determination" is clear in the steps.
      *   Ensure the "Negative Verdict" conditions are sharp.
      *   Check the counter-intuitive case explanation (why human judgement is needed).

  *(Self-Correction during drafting)*: I initially thought about using the thermostat example for Case 3. However, thermostats are often dismissed as too simple. A better counter-intuitive case is one where the teleosemantic criteria are met, but the *cognitive* intuition is missing. A plant's phototropism mechanism might work. It has a function, a consumer (growth mechanism), and can fail (fake light). But calling it a "representation of sunlight" feels category-mistaken to many biologists. I will use a plant defence mechanism.

  *(Refining the Engineered System Step)*: I need to be careful not to say engineered systems *cannot* have content. They have *derived* content. The procedure should validate the attribution *relative to design intent*, but flag that it lacks *original* intentionality. The redundancy issue is specifically about whether the redundancy eliminates the possibility of error. If the redundancy is a 'voting' system, the individual sensors represent, the voter computes. I will instruct the panel to analyse the lowest functional unit.

  *(Final check on Brainstorming)*: Make sure I explicitly mention the risk of collapsing into behaviourism. The focus must be on the *mechanism's history*, not the *output's regularity*.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### Preliminary Conceptual Brainstorming

  To operationalise teleosemantics for a mixed panel, we must translate 'proper function' into 'historical selection role' without implying conscious intent. We cannot simply ask if a state correlates with a worldly condition (covariation), as this collapses into causal information theory and eliminates the possibility of error. Instead, we must ask if the mechanism exists *because* it correlated with that condition in the past. For consumer-based accounts, we must identify a downstream mechanism that relies on the state to perform its own task; if the downstream mechanism works equally well regardless of the state's accuracy, there is no representation, only causation.

  The critical friction point lies in misrepresentation. A system represents only if it can be wrong in a way that disrupts its function. If we attribute content merely because it is useful for prediction (the intentional stance), we lapse into pragmatism. We must insist that the system itself is normatively constrained by its history. Regarding synthetic functional redundancy: this threatens the evolutionary paradigm because engineering often aims to eliminate error. If a system is triple-redundant to ensure it *never* fails, it may lack the modal fragility required for misrepresentation. We must distinguish between reliability engineering (which suppresses error) and functional specification (which defines what counts as an error). If redundancy makes the 'false positive' physically impossible rather than functionally abnormal, the teleosemantic account may misfire, attributing content where there is only robust computation.

  ***

  ### Teleosemantic Attribution Procedure (TAP-1)

  **Context:** This procedure is designed for a 45-minute review window. It prioritises falsification. If a proposal fails any node, the attribution of representational content is not justified on teleosemantic grounds.

  #### Node 1: Mechanism Individuation
  *   **Inquiry:** Is the proposed representational state a distinct, isolable physiological or computational state, separable from the output behaviour?
  *   **Sufficient Evidence:** Identification of a specific neural firing pattern, chemical concentration, or register value that precedes and causally contributes to the output, distinct from the output itself.
  *   **Negative Verdict:** If the 'state' is merely a description of the behaviour itself (e.g., 'the state of fleeing' rather than 'the signal triggering flight'), attribution is denied. This collapses into behaviourism.
  *   **Value Judgement:** Determining the boundaries of the 'system'. Reviewers must agree on whether to include peripheral sensors or only central processing units.

  #### Node 2: Historical Selection Role (Proper Function)
  *   **Inquiry:** Does the mechanism possess a history of selection (evolutionary or design-based) specifically for correlating with condition $C$?
  *   **Sufficient Evidence:**
      *   *Biological:* Phylogenetic data showing the trait was retained because it tracked $C$ and enhanced fitness.
      *   *Engineered:* Design documentation stating the module was implemented to detect $C$.
  *   **Negative Verdict:** If the correlation is accidental, emergent, or a by-product of a mechanism selected for a different condition, attribution is denied. Covariation alone is insufficient.
  *   **Value Judgement:** In engineered systems, distinguishing between 'intended function' and 'side-effect'. Reviewers must interpret design intent documents.

  #### Node 3: Consumer System Identification
  *   **Inquiry:** Is there a downstream 'consumer' mechanism that uses this state to perform its own proper function?
  *   **Sufficient Evidence:** Demonstration that the downstream mechanism fails to perform its function if the representational state is absent or blocked, even if the external condition $C$ is present.
  *   **Negative Verdict:** If the downstream mechanism reacts directly to the external condition $C$ regardless of the internal state, the internal state is epiphenomenal. Attribution is denied.
  *   **Value Judgement:** Determining what counts as the 'function' of the consumer. Is it survival, task completion, or homeostasis?

  #### Node 4: Normal Conditions and Misrepresentation
  *   **Inquiry:** Can the system enter the state when $C$ is absent, causing the consumer to fail its function?
  *   **Sufficient Evidence:** Empirical data or simulation showing 'false positives' lead to functional failure (e.g., energy waste, missed opportunity, system crash).
  *   **Negative Verdict:** If the system is physically incapable of error (e.g., a hardwired reflex that is logically infallible within its operating envelope), it carries information but not representational content. Attribution is denied.
  *   **Value Judgement:** Defining 'Normal Conditions'. Reviewers must decide if a laboratory setting counts as 'normal' or if the assessment requires an ecological context.

  #### Node 5: The Synthetic Redundancy Check (Engineered Systems Only)
  *   **Inquiry:** Does functional redundancy (e.g., triple-modular redundancy) structurally eliminate the possibility of misrepresentation at the level of analysis?
  *   **Sufficient Evidence:** Analysis showing that individual sub-components can misrepresent, even if the aggregate output is voted to be reliable. Attribution is justified only at the level of the sub-component.
  *   **Negative Verdict:** If the redundancy architecture makes error statistically negligible to the point where 'misrepresentation' is a category error (i.e., the system is a calculator, not a detector), attribution is denied for the aggregate system.
  *   **Value Judgement:** Deciding whether 'derived intentionality' (from designers) is sufficient for the panel's ethical purposes, or if 'original intentionality' (from evolution) is required.

  ***

  ### Rapid Test Battery (The 'Four-Sentence' Heuristic)

  Reviewers should apply these four sentences to the proposal. If any sentence cannot be completed truthfully, the attribution is suspect.

  1.  "This specific internal state exists *because* ancestors (or designers) successfully used it to track [Condition $X$] in the past."
  2.  "A downstream mechanism uses this state to guide action, and cannot perform its task if this state is removed."
  3.  "It is possible for this state to activate when [Condition $X$] is absent, causing the downstream mechanism to act inappropriately."
  4.  "We are not attributing this content merely because it helps *us* predict the system, but because the system is normatively constrained to track [Condition $X$]."

  ***

  ### Application to Proposals

  #### 1. The Foraging Ant (Pheromone-Trail System)
  *   **Analysis:**
      *   *Node 1:* The pheromone concentration is a distinct chemical state separable from the walking behaviour. (Pass)
      *   *Node 2:* Evolutionary history confirms trails were selected for indicating food sources. (Pass)
      *   *Node 3:* The ant's motor system (consumer) relies on the gradient to navigate; without it, foraging efficiency drops. (Pass)
      *   *Node 4:* Misrepresentation is possible (e.g., evaporation loops, artificial pheromones) leading to wasted energy. (Pass)
  *   **Verdict:** **Justified.** The attribution of 'food-source representation' is teleosemantically robust.
  *   **Note:** The content is distributed (the trail is external), but the procedure holds for the system as a whole.

  #### 2. The Synthetic Drone (Triple-Redundant Vision Module)
  *   **Analysis:**
      *   *Node 1 & 2:* The vision module is distinct and designed to detect threats. (Pass)
      *   *Node 3:* The flight controller (consumer) relies on the 'threat' signal to initiate evasion. (Pass)
      *   *Node 4 & 5 (Critical):* The system uses triple-redundant feature detectors with a voting mechanism. If the voting mechanism is the unit of analysis, error is engineered out. If one sensor misfires, the vote overrides it.
  *   **Verdict:** **Qualified/Restricted.**
      *   *Reasoning:* Attribution is justified for the *individual sensors* (which can misrepresent), but not for the *voting aggregate* if the redundancy makes error functionally impossible. Furthermore, the content is 'derived' from the engineers, not 'original'.
      *   *Panel Instruction:* The proposal must specify whether it claims the *sensors* represent or the *drone* represents. If the latter, the panel must acknowledge this is a metaphorical extension of teleosemantics based on design intent, not biological selection.

  #### 3. Counter-Intuitive Case: Plant Phototropism Mechanism
  *   **Analysis:**
      *   *Proposal:* Attributing a 'sunlight-direction representation' to the auxin distribution mechanism in a sunflower stem.
      *   *Procedure Result:* **Justified.**
          *   It has a selection history (fitness via photosynthesis).
          *   It has a consumer (cell elongation mechanisms).
          *   It can misrepresent (e.g., under artificial spectral lamps, the plant bends towards non-energy sources, failing its function).
      *   **The Friction:** Many panelists will find it counter-intuitive to call this 'representation' rather than 'causal reaction'.
      *   **Explanation of Limit:** The procedure successfully identifies *biological content*, but it does not resolve the *cognitive* threshold. Teleosemantics naturalises content broadly, including non-cognitive systems. The procedure cannot distinguish between 'mere biological function' and 'cognitive representation' because, strictly speaking, teleosemantics denies that distinction is fundamental.
      *   **Human Judgement Required:** The panel must decide if their ethical guidelines regarding 'representational systems' intend to cover basic biological homeostasis. If the ethical concern is about 'agency' or 'suffering', this procedure yields a 'true' positive that is ethically irrelevant. The procedure validates the *metaphysics* of the claim, not the *moral weight* of it.

  ***

  ### Limits and Misfire Flags

  **1. The Synthetic Redundancy Limit**
  The procedure will misfire on highly reliable engineered systems where 'error' is treated as a system crash rather than a misrepresentation. In safety-critical engineering, a false positive is often designed to be impossible (fail-safe). If a system cannot be wrong, teleosemantics says it does not represent. However, engineers may insist it represents 'safety status'. The procedure forces a 'Negative Verdict' here, which may conflict with industry terminology. Reviewers must be warned that 'information processing' in engineering is not synonymous with 'representational content' in philosophy.

  **2. The 'Normal Conditions' Ambiguity**
  Determining 'Normal Conditions' is often a value judgement disguised as fact. For invasive species or genetically modified organisms, the 'environment of evolutionary adaptedness' is unclear. The procedure flags this as a Value Judgement, but it remains a source of deadlock. If the panel cannot agree on what constitutes the 'proper environment', the attribution of content remains indeterminate.

  **3. The Cognitive Gap**
  As seen in the plant case, the procedure validates content attribution for systems lacking cognition. If the ethics panel's remit is implicitly about *conscious* or *cognitive* agents, this procedure is too permissive. It naturalises content too successfully, stripping it of the psychological baggage the scientists likely associate with the term 'representation'. The panel must explicitly decouple 'representational content' from 'mental states' before using this tool.
