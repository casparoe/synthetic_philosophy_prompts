answer: |-
  ### Argumentative Outlines

  **Dr. Aris Thorne (Refined Adaptationist)**
  1.  **Functional Separation:** The asymmetry is not a contradiction but a division of labor; rigid moral reasoning signals reliability to coalitions (public), while hyperbolic discounting optimizes immediate resource allocation (private).
  2.  **Comparative Continuity:** Primate studies show that impulse control correlates with social rank, suggesting selection pressure on temporal consistency specifically within social contexts, not just general cognition.
  3.  **Specificity Challenge:** The spandrel account explains the *presence* of conflict but fails to explain why the moral representation takes a specifically *deontological* (rule-based) form rather than a utilitarian one, which fits better with adaptive calculation.

  **Dr. Lena Kowalski (Structuralist/Spandrels)**
  1.  **Architectural Mismatch:** The conflict arises from forcing fast, affective predictive loops (sensory-motor) to cohere with slow, linguistic narrative loops (recursive self-modeling), creating friction rather than function.
  2.  **AI Analogues:** Artificial hierarchical predictive systems exhibit similar valuation conflicts when layered for different temporal horizons without specific selection for moral commitment, suggesting structural inevitability.
  3.  **Explanatory Burden:** Adaptationism treats the psychological cost of this asymmetry (e.g., regret, akrasia) as noise, whereas the spandrel view identifies this friction as the primary evidence of non-adaptive architectural byproducts.

  ***

  ### Dialogue: The Architecture of Future Selves

  **Dr. Aris Thorne:** Lena, let's press on the specific phenomenology of the case. We agree the data is robust: humans swear deontological allegiance to their future selves—"I must save for retirement," "I must not harm my future health"—yet economically discount that same future self at steep rates when immediate gratification looms. My claim is that this isn't a glitch. It is a dual-system strategy for coalition stability. The rigid moral stance acts as a credible commitment device observable by peers, ensuring I remain a reliable partner over time. The hyperbolic discounting governs private affective forecasting, allowing flexibility in resource consumption. Selection didn't build a consistent timer; it built a signaler and a consumer.

  **Dr. Lena Kowalski:** Aris, that reads like a just-so story tailored to fit the asymmetry rather than explaining its origin. You are assuming the brain was designed to separate public signaling from private affect. My argument is that this asymmetry is a spandrel of the brain's hierarchical predictive coding architecture. The brain evolved primarily for sensory-motor prediction on short timescales. When we exapted this system for narrative language and recursive self-modeling, we forced two incompatible temporal representations into coherence. The "moral future self" is a linguistic construct running on slow loops; the "hedonic future self" is an affective construct running on fast loops. The conflict isn't a functional division of labor; it's architectural friction.

  **Thorne:** You invoke "architectural friction," but you must account for the specificity of the moral representation. If this were merely a byproduct of mismatched timescales in predictive coding, why does the slow loop adopt a *deontological* structure? Why not a utilitarian calculus that weighs future welfare against present cost? A generic architectural mismatch might produce confusion, but it wouldn't necessarily produce a rigid, rule-based obligation specifically tied to social reputation. The fact that the "moral" side aligns perfectly with the requirements of social contract theory suggests selection harnessed that friction. The architecture provided the tension; selection tuned the frequency.

  **Kowalski:** That assumes selection can tune frequency wherever there is tension. But consider the evidence from artificial predictive systems. When we layer neural networks for long-term narrative consistency over short-term reward maximization without explicit training on "moral commitment," we still see valuation conflicts emerge. The system values the long-term narrative state highly in abstraction but collapses into short-term reward gradients during execution. This happens without any selection for coalition stability. It suggests that whenever you stack a slow linguistic predictor atop a fast affective predictor, this asymmetry is the default output, not a refined adaptation. The deontological flavor is simply the linguistic system's way of stabilizing its own predictions against the noise of the affective system.

  **Thorne:** But artificial systems don't live in coalitions. They don't suffer exclusion if they fail to signal consistency. You're comparing a sterile model to a social organism. Look at comparative primatology. We see proto-forms of this asymmetry in chimpanzees. They exhibit impulse control when being watched by dominants—effectively signaling reliability—but revert to immediate gratification when solitary. This suggests the "public rigidity/private discounting" split predates language. If it were merely a byproduct of linguistic self-modeling, as your exaptation story requires, we shouldn't see the behavioral precursor in non-linguistic primates. The social selection pressure was there first; language just codified it.

  **Kowalski:** You're conflating behavioral inhibition with deontological obligation. A chimp withholding food under observation is managing immediate social risk, not committing to a future self-concept. The human case is distinct because it involves *recursive self-modeling*. My point about the explanatory burden is crucial here. Your adaptationist account explains why we might want to signal commitment, but it treats the psychological cost—the akrasia, the regret, the cognitive dissonance—as noise. But that cost is the phenomenon. If this were a well-engineered commitment device, the transition between moral planning and economic action should be smoother. The spandrel view explains the pain: it is the sound of two different predictive architectures grinding against each other. You explain the utility; I explain the mechanism and the cost.

  **Thorne:** Engineering is never painless. A immune response is costly, but it's still an adaptation. The question is whether the asymmetry tracks fitness. If the spandrel view is correct, and this is merely a structural constraint of predictive coding, then we should expect the asymmetry to be random or universal across all domains of prediction. But it's not. It is specific to *normative* domains involving the self. We don't see this same rigid-vs-discounted split when predicting the weather or fixing a car. It appears specifically when moral identity is at stake. That domain-specificity points to selection, not general architectural constraint. You've relocated the explanatory burden to "predictive coding," but you haven't explained why predictive coding yields *morality* in the slow loop rather than just better planning.

  **Kowalski:** Because morality is the only domain where the linguistic loop attempts to override the affective loop entirely. In weather prediction, the loops cooperate. In moral self-binding, the linguistic loop tries to veto the affective loop. The specificity you see isn't selection for morality; it's the specific site of the architectural collision. Language allows us to model a future self that the affective system cannot feel. The "deontology" is just the linguistic system's hard-coding to protect its model from being invalidated by the affective system's discounting. It's a defensive structure, not an adaptive tool. You argue it serves coalition stability; I argue it serves model coherence. The fact that it *incidentally* aids coalition stability doesn't make it an adaptation for that purpose. That is the essence of the spandrel: a structural consequence that becomes useful, but was not selected *for* that utility.

  **Thorne:** Then we are at the crux. If it is a spandrel, its utility is accidental. If it is an adaptation, its utility is the cause of its retention. The evidence of social monitoring in primates suggests the utility drove the retention. Your predictive coding model explains the *capacity* for conflict, but not the *stabilization* of the conflict into a reliable social signal. I grant you the architecture provides the canvas, Lena, but selection painted the picture.

  **Kowalski:** And I grant you selection may have painted over the cracks, Aris, but the structural integrity of the wall remains determined by the bricks, not the paint. Until you can show that the neural cost of this asymmetry is outweighed by the signaling benefit in a way that excludes the structural explanation, the spandrel remains the null hypothesis. You see a commitment device; I see a cognitive glitch we learned to live with.

  Verdict: The dialogue remains unresolved on whether the asymmetry between moral rigidity and economic discounting is a functional adaptation for social signaling or an architectural byproduct of mismatched predictive systems.
