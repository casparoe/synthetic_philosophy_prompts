answer: |-
  Here's the deal with Dennett's "Center of Narrative Gravity." Basically, he's saying there's no little CEO inside your head calling the shots. Instead, your brain spins a bunch of disjointed experiences into a coherent story, and the "Self" is just the fictional protagonist of that story. It's a user-illusion, but it's a useful one. It lets you predict behavior, hold people accountable, and navigate social life.

  Now, apply that lens to a corporation or a city. Suddenly, the parallel is spooky.

  A corporation doesn't have a brain, but it has memos, meetings, and PR campaigns. It spins a story about who it is ("We innovate," "We care about sustainability"). A city has history, zoning laws, and culture. They both act like they have intentions. Apple *wants* to sell phones; New York *wants* to stay busy. If the human self is just a story that organizes data to predict behavior, then a corporation is arguably *better* at being a self than you are. Its narrative is more consistent, lasts longer than a human lifespan, and is deliberately engineered to be coherent.

  Here are the big implications of taking this seriously:

  **1. Intentionality becomes a feature, not a bug**
  If we stop looking for a "soul" or a "biological brain" as the prerequisite for having intentions, then corporations literally have intentions. Not in a mystical way, but in the same way you do. Their "intentions" are the output of their narrative gravity. When we say "Google decided to fire those employees," we aren't speaking metaphorically in a Dennettian framework. We are describing the output of their center of gravity. The distinction between "literal" and "metaphorical" intentionality collapses. If the story works to predict the outcome, the intention is real enough.

  **2. The Mask becomes the Face**
  The danger here isn't that we treat companies like people; it's that we forget the story is a cover for distributed mechanics. In humans, the narrative sometimes hides the messy biology (e.g., "I chose this" vs. "my hormones spiked"). In corporations, the narrative hides the messy power structures. If we accept the corporation as a "center of narrative gravity," we might stop looking for the actual humans making the decisions. The narrative becomes so heavy it crushes the individuals inside it. The "Corporate Person" isn't a metaphor gone wrong; it's a reality that swallows the actual people.

  **3. Rights follow the Audience, not the Entity**
  This is the kicker. For Dennett, selves exist because other selves treat them as such. It's an intersubjective thing. So, do corporations have rights? Well, they already have legal personhood. But do they have *moral* rights? If the self is just a story, rights aren't inherent; they're granted by the audience (society) based on how useful the story is. We grant corporations rights because it makes the economic story easier to tell. We deny them human rights (like against self-incrimination) because that story doesn't fit our social narrative.

  **So, is it a metaphor gone wrong?**
  No. It's a metaphor that became operational. But that doesn't automatically grant them human-style moral standing.

  **Confidence and Uncertainty**
  Overall, I'm **fairly sure** about the philosophical alignment here. Dennett's functionalism maps neatly onto systems theory. However, I am **least sure** about the leap from "narrative existence" to "moral rights." Just because a corporation has a coherent story doesn't mean it can *suffer*, which is usually the baseline for moral rights. I'm confident the narrative exists, but unsure if that narrative alone justifies moral protection.

