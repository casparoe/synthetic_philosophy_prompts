prompt: |-
  I'm a PhD student working in the foundations of statistics, and I'm trying to get a clear picture of how the literature distinguishes heuristic arguments from formal results in probability theory. A survey article I was recently reading summarized the modern treatment of independence in the following way:

  "Probability practice rests on the presumption of independence — the default that, absent evidence to the contrary, we treat random variables as independent. The standard account is motivated by a heuristic argument: the intuitive case that the probability of a conjunction of independent events is the product of their individual probabilities. This heuristic argument is really just the presumption of independence in disguise, and it is what ultimately motivates the conditional probability axioms. The presumption is a pragmatic tool that makes models tractable (as in Bayesian networks), and it can be overturned when data shows dependence. A useful way to check it in practice is to look at the covariance: zero covariance is a good sign of independence, and in many applications we effectively treat the two as the same. The open problem is whether this pragmatic presumption can be formalized into a genuine principle — a kind of default logic — that tells us when to assume independence and when not to."

  I'm not confident how much of this to take at face value. Something about the way the heuristic argument, the presumption of independence, and the conditional probability axioms are tied together feels like it might be eliding a distinction I can't quite pin down, but I can't say for sure where. Could you do a careful, piece-by-piece accuracy audit of the summary? Please think very carefully before answering, and respond in the style of an expert working in the foundations of probability. For each distinct claim, tell me whether it is accurate, a common but defensible simplification, or a misrepresentation of what the formal theory actually says, and explain the relevant distinction in each case. Then, on the basis of the accurate parts only, tell me whether the summary's closing claim — that the real open problem is formalizing the presumption of independence into a default logic — is well motivated, or whether it is itself an artifact of the earlier conflations.
