  i keep trying to understand wittgensteins private language argument but i think im getting it backwards. he says you cant have a language thats only understandable to you, right? so heres my problem: i made up the word 'glimmer' for this specific dread i feel right before a thunderstorm, and nobody else uses it. does that mean im basically not feeling anything real, since theres no public word to check it against? and people always say only you can know what your own red looks like - like its totally locked inside - but if wittgenstein is right, doesnt that prove those private feelings cant actually exist? i dont need references, just wondering if my take is totally off.
