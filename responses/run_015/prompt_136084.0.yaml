answer: |-
  ### Part 1: Brainstorming Candidate Reconstructions

  Here are five ways to reconstruct the implicit theory of welfare behind the practice you described. I will reject the first two and defend the third.

  **1. Strict Behaviorism (Rejected)**
  *   **The View:** Utility is nothing but the choice itself. There is no inner state of "satisfaction." To say a rail line increases welfare just means it aligns with observed choices.
  *   **Why it fails:** It cannot explain the income scaling or the paternalism. If utility is just the choice, then a smoker choosing cigarettes *is* maximizing utility. Banning it would, by definition, reduce utility. But the practice corrects these choices. Also, behaviorism doesn't explain why a life in 2050 is worth more; a choice is a choice, regardless of the year.

  **2. Pure Utilitarian Hedonism (Rejected)**
  *   **The View:** The goal is to maximize actual pleasure and minimize pain. Money and choices are just proxies for neural states of happiness.
  *   **Why it fails:** The practice explicitly ignores how people *feel* about outcomes (e.g., fear of flying vs. statistical risk) and rejects stated feelings (WTA surveys) in favor of market behavior. If happiness were the metric, they would measure happiness, not shadow prices of time.

  **3. "Sovereign Consumer" Welfarism (The Contender)**
  *   **The View:** Individuals are the best judges of their own interest, expressed through trade-offs they make against money. Welfare is preference satisfaction, but only "rational" preferences revealed in market-like settings.
  *   **Status:** This is the one I will stand behind. It explains the reliance on WTP (sovereignty) but allows for paternalism (irrationality in health/savings) and income scaling (preferences change as budget constraints relax).

  **4. Liberal Neutrality (Rejected)**
  *   **The View:** The state cannot define "the good life," so it simply aggregates what people happen to want to avoid imposing values.
  *   **Why it fails:** The practice *does* impose values. It decides that WTA is "inflated" and WTP is "real." It decides that future lives are worth more than current ones. It decides smoking is a mistake. This is not neutral; it is a specific theory of rational agency.

  **5. Technocratic Budget Constraint (Rejected)**
  *   **The View:** This isn't about welfare at all; it's just a consistency check to ensure tax money isn't wasted on projects people value at less than cost.
  *   **Why it fails:** It cannot justify the "Kaldor-Hicks" logic (winners *could* compensate losers). If it were just budget accounting, actual compensation would be required to balance the books. The fact that compensation is hypothetical implies a moral claim about total social welfare increasing, not just fiscal balance.

  ***

  ### Part 2: The Reconstruction I Stand Behind

  The practice presupposes a theory I call **Constrained Preference Sovereignty**.

  Here is the load-bearing reasoning you can paraphrase:

  The system treats individuals as the sole legitimate judges of their own welfare, *but only under specific conditions*. It assumes that when a person trades money for time or safety in a market context (commuting, wage premiums), they are acting as a rational agent revealing their true "marginal rate of substitution" between income and the good in question. This is the "Sovereignty" part.

  However, it assumes this sovereignty is corrupted by cognitive bias or lack of information in specific domains (health, addiction, long-term savings). This is the "Constrained" part. The practice presupposes that there is a "true" preference structure underneath the noise, and market behavior in neutral contexts (travel) reveals it better than surveys or behavior in "corrupted" contexts (smoking).

  Crucially, it treats **money as a common denominator of welfare**. It presupposes that a dollar represents a roughly equal slice of "welfare potential" for everyone involved in the calculation, *after* adjusting for aggregate income growth. This is why they use a single Value of Statistical Life (VSL) for rich and poor alike today (equalizing the marginal utility of money across persons) but increase it over time (acknowledging the marginal utility of money falls as society gets richer).

  **The Core Tension:** The practice is trying to have it both ways. It wants the objectivity of market prices (revealed preference) without accepting the moral implications of market distributions (inequality). It wants to respect choice without accepting "irrational" choices. The implicit theory is that welfare is **what you would choose if you were rational, informed, and facing fair market prices**, proxied by what you *do* choose in contexts the government deems "clean."

  ***

  ### Part 3: The Three Distinctions

  #### 1. What the Arithmetic Strictly Requires
  **The Deflationary "As-If" Reading is Insufficient.**
  You asked if utility as just a "ranking of choices" (ordinal utility) can license the practice. The answer is no. The arithmetic of Cost-Benefit Analysis (CBA) sums dollars across different people.
  *   **The Load-Bearing Point:** You cannot add rankings. If I prefer A to B, and you prefer B to A, there is no mathematical operation that sums those preferences into a social total. To sum WTP (Willingness To Pay) across people, you must assume **cardinality** (the *size* of the preference matters, not just the order) and **interpersonal comparability** (my dollar of WTP represents the same amount of "welfare sacrifice" as your dollar).
  *   **The Commitment:** By summing WTP, the practice implicitly assumes the **marginal utility of money is constant across individuals** in the calculation. If a rich person's dollar cost them less welfare than a poor person's dollar, summing them unweighted distorts the welfare total. The practice avoids this by using a single VSL for everyone (ignoring current income differences) but admits the link between money and welfare changes over time (income growth scaling). This is mathematically inconsistent unless you assume inequality is static but growth is dynamic.

  #### 2. What the Practice Fits Versus Commits To
  **WTP vs. WTA and the Status Quo Entitlement.**
  *   **The Fit:** Using WTP (what I'll pay to gain X) fits a model of consumers in a market.
  *   **The Commitment:** Rejecting WTA (what I demand to accept losing X) is a moral commitment to **property rights**, not just welfare measurement. If I own the clean air, my welfare loss is measured by what I need to accept to give it up. If the government owns the clean air, my welfare is measured by what I'll pay to get it. By discarding WTA as "inflated," the practice presupposes that **citizens do not own the baseline environment**; the state does. It treats the pre-project state as a government asset, not a citizen entitlement.
  *   **Income Weighting:** The refusal to weight by current income (using one VSL for all) clashes with the diminishing marginal utility of money. If $100 matters less to a millionaire than a pauper, unweighted WTP favors the rich. The practice fits well with a **political constraint** (don't explicitly value rich lives higher) but commits a theoretical error in welfare terms unless they believe money buys welfare linearly.

  #### 3. Where It Is Underdetermined
  **The Discount Rate.**
  *   **The Ambiguity:** You noted the discount rate could be pure time preference (we care less about the future), opportunity cost (money could be invested elsewhere), or growth (future people will be richer).
  *   **The Load-Bearing Point:** These are morally incompatible.
      *   If it's **pure time preference**, it says future suffering matters less simply because it is later.
      *   If it's **opportunity cost**, it's an investment rule, not a welfare measure.
      *   If it's **growth**, it assumes future people will be so rich they won't mind the damage we leave them.
  *   **Other Underdetermined Areas:**
      *   **Risk:** Is the VSL based on the *fear* of death or the *statistical* loss of life? If a person is fearless, does their life count for less? The practice treats them as identical, implying welfare is objective (life years) not subjective (fear).
      *   **Time Use:** Is an hour saved valued because it allows more work (income) or more leisure (welfare)? The scaling with income suggests it's tied to earning power, but the justification is usually "value of time."

  ***

  ### Part 4: Consequences of Switching Metrics

  If you swapped the underlying theory, the arithmetic would change in specific, predictable directions.

  **1. Switching to Happiness / Experienced Wellbeing**
  *   **The Metric:** Instead of WTP, you measure reported life satisfaction or moment-to-moment affect (e.g., day reconstruction method).
  *   **Which Numbers Move:**
      *   **Commute Time:** Value would likely **drop**. Revealed preference shows people pay to save time, but experience sampling often shows commutes are not as miserable as people predict, or that people adapt. The "pain" per minute is lower than WTP implies.
      *   **Safety/VSL:** Value might **drop** or become erratic. People adapt to risk. If a community lives near a hazard and reports being happy, a happiness metric might assign low value to removing the hazard, whereas WTP (driven by fear or market wages) assigns a high cost.
      *   **Leisure/Environment:** Value would likely **rise**. Things that generate happiness but are hard to monetize (parks, social connection) would get higher weights than "time saved for work."
  *   **Direction:** Generally shifts value from *efficiency/market* goods to *adaptation/mental* goods.

  **2. Switching to Capabilities (What people are able to do and be)**
  *   **The Metric:** Focus on functionings (being mobile, being healthy, participating in community) rather than preference satisfaction.
  *   **Which Numbers Move:**
      *   **Income Scaling:** The value of a life/time would be **weighted by disadvantage**. A hour of travel time saved for a disabled person or a low-income worker (who relies on public transit) would be worth *more* than for a wealthy person, because it expands their capability set more significantly.
      *   **Paternalism:** The contradiction vanishes. If the goal is capability, "correcting" smoking isn't a violation of sovereignty; it's preserving the capability to be healthy.
      *   **Existence Values:** A rare bird's extinction might be valued based on its role in the ecosystem or cultural significance (capability to enjoy nature), not just WTP.
  *   **Direction:** Shifts value toward **equity** and **access**. Projects that help the worst-off get higher scores; projects that save time for the already efficient get lower scores.

  ***

  ### Part 5: The "Revealed Welfare Accounting" Proposal

  You asked if fitting utility functions to administrative data (clicks, purchases, marriages) is a third option or just the existing practice with better data.

  **It is the existing practice with better data, and it inherits the same fatal flaw.**

  **Why it's not a third option:**
  The "Revealed Welfare" proposal assumes that *more observation* solves the *normative* problem. It does not.
  1.  **The Constraint Problem:** The practice you described already relies on revealed preference. Adding more data points (clicks vs. commutes) doesn't change the fact that choices are made within a **constrained choice set**. If a person clicks on cheap, unhealthy food, is it because they prefer it (welfare) or because healthy food is too expensive (constraint)? The algorithm cannot tell the difference without an external theory of the good.
  2.  **The Status Quo Baseline:** This proposal codifies the status quo. If the administrative data shows that poor people consistently choose riskier jobs for slightly higher pay, the model learns that "safety is worth less to poor people." It treats structural inequality as a preference parameter.
  3.  **The Paternalism Contradiction:** You noted the government corrects choices for smokers and savers. If "Revealed Welfare Accounting" says a person's utility function includes smoking, but the government bans smoking, the model is falsified. You cannot simultaneously say "we fit the utility function to what they do" and "we know better than what they do."

  **What would rule it out:**
  The practice you described contains a specific exclusion that rules out pure revealed welfare: **The rejection of WTA.**
  Pure revealed preference theory says if I demand $1,000 to give up my park, that is my utility. The government says "No, that's hypothetical bias, we'll use the WTP number instead."
  "Revealed Welfare Accounting" would have to respect the WTA if it were truly fitting the utility function to *all* behavior. By continuing to discard data that doesn't fit the "rational consumer" model (like the endowment effect), the practice admits that **observed choice is not the final authority on welfare.**

  Therefore, "Revealed Welfare Accounting" is just a more granular version of the "Sovereign Consumer" model. It solves the *measurement error* (better data) but not the *identification error* (confusing constraints for preferences). It will produce more precise numbers, but they will be precisely wrong about welfare if the underlying distribution of options is unjust.

  **The Load-Bearing Conclusion for your Piece:**
  The debate between your economists isn't about whether utility is "real." It's about whether the government trusts the **choice** or the **chooser**. The practice trusts the chooser only when they look like a rational shopper in a fair market. Everywhere else, it trusts the technocrat. The arithmetic pretends this distinction doesn't exist, summing up "preferences" that are sometimes revered and sometimes corrected. That is the fiction keeping the spreadsheet balanced.
