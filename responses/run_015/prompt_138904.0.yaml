  It enters now to fetch the spare battery.
  It pulls the weight upon the small wagon.
  It knows the corner holds a waiting bomb.
  It monitors the digits on the timer.
  It proves the light will not fade on the wall.
  It measures space between it and the door.

  It stops to scan the threshold of the door.
  To move the load requires full battery.
  It knows the shade remains upon the wall.
  It does not need to push the empty wagon.
  It checks the speed against the ticking timer.
  It knows the blast radius of the bomb.

  The logic says the fuse lights up the bomb.
  It verifies the hinge upon the door.
  It reads the digits on the digital timer.
  It confirms charge inside the main battery.
  It asks if moving shifts the idle wagon.
  It proves the bricks remain within the wall.

  The structural integrity of the wall
  is irrelevant, yet proved before the bomb.
  It does not load the spare parts on the wagon.
  It stands immobile just inside the door.
  It checks the voltage of the main battery.
  It loses cycles on the counting timer.

  There is no time left on the counting timer.
  The paint remains adhered to every wall.
  It holds the schema for the spare battery.
  It knows the state of every hidden bomb.
  It never passes through the open door.
  It leaves the task behind beside the wagon.

  The wheels are still upon the idle wagon.
  The zero flashes on the silent timer.
  It never crossed the threshold of the door.
  The proof remains intact upon the wall.
  The room explodes around the static bomb.
  It held the truth about the lost battery.

  The wagon stays; the proof holds on the wall.
  The timer stops; it never passed the door.
  The bomb goes off; it kept the battery.

