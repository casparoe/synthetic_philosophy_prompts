answer: |-
  # Desiderata for an Adequate Theory of Population Value

  To move beyond the binary of Totalism and Average Utilitarianism, we must treat population axiology not as a contest of intuitions, but as a constraint-satisfaction problem. An adequate theory must function as a decision procedure that is both morally plausible and formally coherent. The following list specifies the job description for any candidate theory.

  Note that satisfying all desiderata simultaneously is widely believed to be impossible (see *Impossibility Results* below). The philosophical labor lies in determining which constraints to relax.

  ### 1. Avoidance of the Repugnant Conclusion (RC)
  *   **The Case:** Parfit's *A+ vs. Z*. A population of very high welfare (A+) should not be judged worse than a massive population of lives barely worth living (Z), provided the total welfare in Z is higher.
  *   **The Tension:** This conflicts with the *Mere Addition Principle* (adding happy people without affecting others is not worse) and *Transitivity*. If A+ is not worse than A, and B is better than A+ (by equality), and so on, transitivity forces us to accept Z is better than A.
  *   **Status:** *Contested Preference.* Totalists accept the RC as the price of formal coherence. Most other camps treat this as non-negotiable.
  *   **Incompatibility:** Jointly unsatisfiable with Mere Addition, Non-Elitism, and Transitivity (Arrhenius's First Impossibility Theorem).

  ### 2. Avoidance of the "Reverse" Repugnant Conclusion (Structural/Identity Penalty)
  *   **The Case:** As specified, this is the intuition that an enormous population of extraordinarily happy lives should *not* be judged worse simply because their existence relies on "identity-indeterminate" mechanisms (e.g., replacement of prior potential persons rather than addition of new ones) that violate a structural constraint. A theory fails if it penalizes high aggregate welfare solely due to the metaphysical mode of generation (e.g., deeming a world of 1 billion happy people "worse" because they replaced a different 1 billion, rather than being added to a baseline).
  *   **The Tension:** Person-affecting views often struggle here. If value is tied to *specific* individuals, replacing a lineage (even with happier people) may register as neutral or negative compared to adding to an existing lineage, effectively penalizing the "replacement" structure despite the high welfare.
  *   **Status:** *Non-Negotiable for Impersonal Views.* Essential to prevent metaphysical technicalities from overriding welfare magnitude.
  *   **Incompatibility:** Conflicts with strong *Person-Affecting Restrictions* that require acts to be worse *for* a specific subject. If no specific subject is harmed by replacement (because the replaced never exist), a strict person-affecting view may fail to rank the high-welfare replacement as better, or worse, violating completeness.

  ### 3. Navigation of the Non-Identity Problem (NIP) without Pure Actualism
  *   **The Case:** A policy choice (e.g., climate inaction) causes future people to exist who have lives worth living, but would have been different people had the policy been different. Pure Actualism says this is permissible because the actual people are not harmed (they wouldn't exist otherwise). An adequate theory must explain why this might still be objectionable without claiming the people are "harmed" in the counterfactual sense.
  *   **The Tension:** Balancing the *No-Difference Claim* (it shouldn't matter *who* exists, only *how well* they live) against the intuition that we have obligations to future contingents.
  *   **Status:** *Non-Negotiable.* A theory collapsing into Pure Actualism renders long-term policy evaluation inert.
  *   **Incompatibility:** Conflicts with the *Person-Affecting View* (in its narrow form), which holds that an outcome cannot be worse if it is not worse for any particular person.

  ### 4. Preservation of Policy Distinctions (Addition vs. Replacement vs. Alteration)
  *   **The Case:** The theory must distinguish between:
      1.  **Addition:** Increasing population size with new identities.
      2.  **Replacement:** Changing *which* identities exist (e.g., timing of conception).
      3.  **Alteration:** Changing welfare of fixed identities.
  *   **The Tension:** Some axiologies (e.g., Average Utilitarianism) collapse these distinctions in counter-intuitive ways (e.g., implying we should replace existing happy people with slightly happier ones). Others (Totalism) treat addition and alteration as morally equivalent regarding welfare sums, which some argue ignores the special status of existing persons.
  *   **Status:** *Non-Negotiable.* Required for the theory to guide distinct policy levers (e.g., contraception vs. wealth redistribution).
  *   **Incompatibility:** Difficult to maintain alongside *Strong Separability* (the value of a sub-population should not depend on the existence of others) when identities shift between outcomes.

  ### 5. Determinacy Under Existential Uncertainty
  *   **The Case:** Real policy operates under ignorance of *who* will exist and *how many*. A theory must yield determinate rankings for prospects where the population size and identity are probabilistic (e.g., "There is a 50% chance this policy brings about 1 million people at welfare 10, and 50% chance of 2 million people at welfare 5").
  *   **The Tension:** Standard Expected Utility Theory assumes a fixed sample space. In population ethics, the "outcomes" themselves contain the sample space (the people). Integrating probability with variable population value often leads to undefined expectations or violations of stochastic dominance.
  *   **Status:** *Non-Negotiable.* A theory that only works under omniscience is practically useless.
  *   **Incompatibility:** Conflicts with *Critical-Level Views* under uncertainty; calculating expected value becomes sensitive to the critical level chosen, potentially recommending risks that guarantee lower welfare for actual people in exchange for probabilistic existence of new people.

  ### 6. Formal Rationality Constraints (Transitivity, Completeness, Continuity)
  *   **The Case:** The "better than" relation must be a weak ordering.
      *   **Transitivity:** If A > B and B > C, then A > C.
      *   **Completeness:** For any A and B, either A ≥ B or B ≥ A.
      *   **Continuity:** Small changes in welfare/population should not cause discontinuous jumps in value ranking.
  *   **The Tension:** Avoiding the Repugnant Conclusion often requires introducing lexical thresholds or incommensurability, which violates Continuity or Completeness.
  *   **Status:** *Non-Negotiable for Rational Choice.* Without transitivity, money-pump arguments apply; without completeness, decision procedures stall.
  *   **Incompatibility:** As noted in Arrhenius's theorems, you cannot have Transitivity, Completeness, and avoid both the Repugnant and Sadistic Conclusions simultaneously.

  ---

  ### Impossibility Results: The Joint Unsatisfiability
  The central philosophical labor lies in navigating **Gustaf Arrhenius's Impossibility Theorems**. Specifically, the following set of desiderata is provably inconsistent:
  1.  **Transitivity**
  2.  **Completeness**
  3.  **Avoidance of the Repugnant Conclusion**
  4.  **Avoidance of the Sadistic Conclusion** (Adding lives with negative welfare is not better than adding lives with positive welfare).
  5.  **The Mere Addition Principle.**

  Any adequate theory must explicitly state which of these it sacrifices. There is no "free lunch."

  ---

  ### Brief Evaluation of Candidate Axiologies

  | Theory | RC Avoidance | Reverse RC (Identity Penalty) | Non-Identity Problem | Uncertainty | Formal Coherence |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Totalism** | **Fails.** Accepts RC as necessary consequence of maximizing sum. | **Passes.** Indifferent to identity; cares only about sum of welfare. | **Fails.** Collapses into impersonal calculus; struggles to explain "wrongness" if total welfare rises. | **Passes.** Integrates easily with Expected Utility. | **Passes.** Fully transitive and complete. |
  | **Critical-Level** | **Passes.** (If critical level is set above "barely worth living".) | **Passes.** Generally neutral regarding identity structure. | **Passes.** Can judge outcomes based on welfare relative to critical level, regardless of identity. | **Mixed.** Sensitive to the choice of critical level under risk; can violate stochastic dominance. | **Passes.** Maintains ordering, but risks the *Sadistic Conclusion* (preferring negative welfare lives to avoid lowering average/critical margin). |
  | **Person-Affecting** | **Passes.** (Often avoids RC by claiming added lives are "neutral".) | **Fails.** Often penalizes replacement scenarios (Reverse RC) because no specific person is benefited by the swap. | **Passes.** (By definition). But risks collapsing into Actualism if not carefully formulated (e.g., Wide Person-Affecting). | **Fails.** Struggles with completeness; outcomes with different people are often "incomparable." | **Fails.** Frequently violates Transitivity and Completeness (incommensurability). |

  ### Summary for Seminar Discussion
  The goal of the seminar should not be to find the theory that satisfies all desiderata, as none exist. The goal is to identify which constraint each theory sacrifices.
  *   **Totalism** sacrifices the *Repugnant Conclusion* intuition to save *Formal Coherence*.
  *   **Person-Affecting Views** sacrifice *Formal Coherence* (Completeness/Transitivity) and *Identity Neutrality* to save the *Non-Identity* intuition.
  *   **Critical-Level Views** attempt a middle path but risk the *Sadistic Conclusion* and struggle under *Uncertainty*.

  The "Reverse Repugnant Conclusion" you specified highlights the fragility of Person-Affecting views: if a theory values *people* over *places for people*, it may irrationally prefer a smaller, specific population over a larger, happier one simply because the larger one requires "replacement" rather than "addition." An adequate theory must explain why the *structure of generation* does not trump the *magnitude of welfare*.
