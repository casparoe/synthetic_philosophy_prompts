answer: |-
  ### Strategic Defense of the Agenda

  This agenda is ordered by **decision sequence**, not abstract importance. With $3M and five years, you cannot solve population ethics, nor can you run a global demographic campaign. You are buying *information* to decide whether this program should exist, be folded, or be killed.

  **The Ordering Logic**
  1.  **Minimum Viable Population (MVP)** is Rank 1 because it is the only question that creates a *non-linear* urgency. If there is a hard threshold below which civilization cannot recover from catastrophe, population size moves from a "welfare variable" to an "existential constraint." If the answer is "no threshold," the longtermist case for active population growth collapses into standard global development, and the program should be folded immediately.
  2.  **State Capture & Alignment** is Rank 2 because it is a **veto gate**. Even if MVP is true and growth is good, if the only actors capable of moving fertility rates (states) do so for reasons misaligned with longtermist values (ethnic nationalism, military mass), then the "should anyone try" answer is *no*. This is highly tractable via political science case studies.
  3.  **Governance Scaling Elasticity** (The Novel Question) is Rank 3. Standard economics asks if more people mean more GDP. Longtermism needs to know if more people mean *more or less coordination capacity* on x-risk. If population growth degrades governance quality faster than it produces innovators, "bigger" is "riskier."
  4.  **Axiological Robustness & Cohort Lag** is Rank 4. You flagged the cohort-lag point correctly: interventions now only affect the far future. This makes the program dependent on long-term discounting views. However, philosophical consensus is intractable in 5 years. Instead of solving ethics, this workstream tests *robustness*: do Total, Critical-Level, and Person-Affecting views converge on this specific intervention? If they diverge, the program lacks a stable moral foundation.
  5.  **Intervention Elasticity** is Rank 5. It is pointless to know *how* to move fertility (cash vs. norms) if you haven't established *why* (MVP), *whether you should* (Capture), or *if it helps* (Governance). This is the implementation detail, scoped last.

  **Trade-offs: Importance vs. Tractability**
  The tension here is between the **MVP** question (highest importance, medium tractability) and the **Ethics** question (highest theoretical importance, lowest tractability). I have prioritized MVP because a negative empirical finding there renders the ethical debate moot for policy purposes. Similarly, **Capture** is prioritized over **Elasticity** because political feasibility is a harder constraint than technical efficacy.

  **Year 1 Spend Plan**
  *   **$600k (2 Researchers):** Commission and manage a historical modeling project on **MVP**. Focus on post-collapse recovery cases (e.g., Black Death, Bronze Age Collapse) to estimate recovery thresholds.
  *   **$400k (2 Researchers):** Comparative policy analysis on **Capture**. Case studies of pronatalist regimes (Hungary, Russia, Israel, Singapore) to map intent vs. outcome.
  *   **$200k (1 Researcher + Workshops):** **Governance Scaling** literature review and expert elicitation. Run a workshop with political scientists and EA modelers.
  *   **$100k (1 Researcher):** **Ethics** scoping. Map the dependency of specific interventions on ethical views (e.g., "Does this subsidy require Total Utilitarianism to justify?").
  *   **$200k:** Ops, contingency, and dissemination.

  ***

  ### Research Agenda Table

  | Rank | Question | Upstream_Of | Tractable_in_5y | Neglectedness | What_Would_Move_It | Confidence |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Is there a Minimum Viable Population (MVP) for technological recovery?** (User Point 2) | *Governance Scaling*, *Axiological Robustness*. If no threshold exists, urgency drops precipitously. | **Medium.** (Historians, Complexity Modelers). Requires synthesizing historical collapse data with modern tech baselines. | **High.** Usually assumed in EA, rarely empirically stress-tested. | A peer-reviewed model showing recovery is possible from <10M people with modern tech stockpiles. | 0.85 |
  | **2** | **Is state-led pronatalism inherently captured by non-longtermist aims?** (User Point 3) | *Intervention Elasticity*. If capture is inevitable, "should anyone try" is answered *No*, regardless of efficacy. | **High.** (Political Scientists, Historians). Case study methodology is well-established. | **Medium.** Discussed in policy circles, ignored in EA cause prioritization. | Evidence that a major pronatalist shift occurred *without* ethnic/military framing (e.g., purely welfare-driven success). | 0.90 |
  | **3** | **Does population growth increase or decrease governance capacity for x-risk reduction?** (Novel) | *Axiological Robustness*. Determines if "bigger" is instrumentally "better" or "riskier." | **Low/Med.** (Macro-economists, Political Scientists). High complexity, few direct metrics. | **High.** Standard lit focuses on GDP, not coordination capacity or risk mitigation. | Data showing a negative correlation between population density/scale and international treaty compliance/safety regulation quality. | 0.65 |
  | **4** | **Is the value of demographic interventions robust across competing ethical views?** (User Point 1 + Standard Ethics) | *Program Existence*. If value relies solely on Total Utilitarianism, the program is fragile to philosophical shift. | **Low.** (Philosophers). Consensus unlikely, but "robustness mapping" is doable. | **Low.** This is the core of population ethics literature (crowded). | A proof that Critical-Level views justify the intervention *only* if the MVP threshold is breached (linking Q1 & Q4). | 0.75 |
  | **5** | **What is the elasticity of fertility to normative vs. financial incentives?** | *None* (Implementation detail). Only relevant if Q1-Q4 are green-lit. | **High.** (Demographers, Economists). RCTs and natural experiments exist. | **Medium.** Well studied in development econ, less in high-income low-fertility contexts. | Evidence that cash transfers have <0.1 elasticity while norm campaigns have >0.3 (or vice versa). | 0.80 |

  ### Notes on the Dependency Map
  *   **Q1 (MVP)** is the **Foundation**. If Q1 is false (no cliff), Q3 (Governance) becomes the primary driver, and Q4 (Ethics) becomes a standard welfare question rather than an existential one.
  *   **Q2 (Capture)** is the **Gatekeeper**. It sits parallel to Q1. Even if Q1 is true (we need more people), Q2 can veto the program if the *method* of getting them is aligned with bad actors.
  *   **Q4 (Ethics)** is the **Lens**. It does not determine the facts, but it determines whether the facts in Q1 and Q3 translate into *value*. Placing it at Rank 4 reflects the reality that a $3M program cannot shift philosophical consensus, but it can determine if its own work is philosophically fragile.
  *   **Q3 (Governance)** is the **Bridge**. It connects the raw number of people (Q1) to the quality of the future (Q4). It is the most novel because it challenges the assumption that "more people = more innovators = safer future."
  *   **Q5 (Elasticity)** is the **Tool**. It is downstream of everything. Funding this before Q1 or Q2 is resolved is premature optimization.
