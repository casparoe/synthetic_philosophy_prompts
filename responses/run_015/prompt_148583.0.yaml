  The sticking point I keep hitting is this: I post a swap at the early date and a swap back at the late date, and a fully sophisticated agent simply refuses the first swap, having foreseen the second. So I need a structure in which foresight does not let her opt out. I don't mind what device you use — a forced choice imposed by an institution such as a payroll election she has to make or a deadline she cannot extend, an offer that is made to her whatever she happens to hold, anything of that kind — but you have to flag the device explicitly and say why it isn't cheating. What would count as cheating: making her naive, myopic, ignorant, or intransitive at a time; stipulating that she cannot refuse an offer she would in fact refuse; or building the case so that the verdicts are asserted rather than generated by the preference structure. After the scenario, give me the numbers: her discount function, or a table of the dated comparisons that do the work; for each node, which option she prefers and by how much in her own units at that time; and a check that the end state really is dominated by her initial lights. Then give me the verdicts of three accounts — the sophisticated backward-induction account, on which she plans by backward induction over her actual future preferences; the resolute or plan-based account, on which rationality attaches to a plan adopted at the outset even where executing it means acting against what she most prefers at the moment; and the successive-selves or time-slice account, on which each temporal stage is a separate evaluator — saying for each whether she was exploited, whether she was irrational, and what she should have done. Then isolate the feature doing the work: show the pump fails when you remove each of (a) non-stationarity, (b) the impossibility of binding her future self, and (c) whatever makes the later offers unblockable, and tell me which of the three is doing the real work and which is merely enabling. Close with what a defend