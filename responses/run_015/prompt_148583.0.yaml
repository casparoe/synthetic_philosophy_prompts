          *   $V_0(1000, t_3) = 1000 \times 0.42 = 420$.
          *   $V_0(950, t_2) = 950 \times 0.45 = 427.5$. (Prefers Early).
      *   *Correction:* To get the pump, $t_0$ must prefer Later.
      *   **Final Parameters:** $D(1)=0.4, D(2)=0.38, D(3)=0.37$.
      *   **$t_0$:** $V(1000, t_3) = 370$. $V(950, t_2) = 361$. **Prefers Later ($t_3$).**
      *   **$t_1$:** (Delays shrink by 1). $D(1)=0.4, D(2)=0.38$.
      *   $V_1(1000, t_3) = 1000 \times 0.38 = 380$.
      *   $V_1(950, t_2) = 950 \times 0.40 = 380$. (Indifferent).
      *   *Make fee \$40.* $V_1(960, t_2) = 960 \times 0.4 = 384$. **Prefers Early ($t_2$).**
      *   **Check:** At $t_0$, $V(1000, t_3)=370 > V(960, t_2)=364.8$. You would not pay \$40 at $t_0$. At $t_1$, you pay \$40.
      *   **Outcome:** You end with \$960 at $t_2$. Initial self values this at 364.8. Initial self valued the default (\$1000 at $t_3$) at 370. You are worse off by 5.2 units.

  **Verdicts of Three Accounts**
  1.  **Sophisticated Backward-Induction:** You are **exploited** but **rational**. You correctly forecasted the $t_1$ reversal but lacked the technology to bind your future self or opt out of the mandatory login. Given the constraint that Early Access is *only* available at $t_1$, you could not avoid the fee. You should have lobbied for a different payroll system, but within the game, you maximized utility at every node.
  2.  **Resolute (Plan-Based):** You were **irrational**. Rationality requires adherence to the plan formed at $t_0$ (Take April 1) unless new information arrives. No new information arrived; only your preferences changed. You should have pre-committed (e.g., given login credentials to a friend) to ignore the offer. The fee is a penalty for resolute failure.
  3.  **Successive-Selves (Time-Slice):** No single self was **irrational**, and there is no **exploitation** in a moral sense, only arbitrage. $t_0$-you made the best choice available. $t_1$-you made the best choice available. The firm merely arbitraged the difference in valuation between time-slices. The "loss" is only visible from the external $t_0$ perspective, which has no privileged claim on rationality over $t_1$.

  **Isolating the Features**
  *   **(a) Non-Stationarity:** If preferences were stationary (exponential discounting), $t_1$ would agree with $t_0$'s ranking of $t_2$ vs $t_3$. The swap would not occur. **This is the engine of the pump.**
  *   **(b) Impossibility of Binding:** If you could bind at $t_0$ (e.g., disable the login option), you would prevent the $t_1$ swap. The fee would not be paid. **This is the enabling condition.**
  *   **(c) Unblockable Offers:** If the $t_1$ offer were blockable (optional login), sophisticated $t_0$-you would skip the login. **This is the mechanism that closes the escape route.**
  *   **Real Work:** **Non-stationarity** is doing the normative work (creating the preference reversal), but **Impossibility of Binding** is doing the structural work (preventing the sophisticated agent from neutralizing the reversal). Without (b), (a) is expensive but not exploitable.

  **Defender's Response**
  A defender of declining impatience would argue that this case demonstrates **expensive preferences**, not **irrationality**. The agent's preferences are complete and transitive at every slice; the "inconsistency" is merely a change in valuation over time, which is rational if the agent's needs or perspective genuinely shift (e.g., liquidity is more valuable in February than January). The "exploitation" is simply a market transfer: the firm provides liquidity when the agent values it most ($t_1$) and charges a premium for it. The fact that $t_0$ disapproves is irrelevant; $t_0$ is not the one who needs the money. The pump argument fails because it privileges the $t_0$ perspective as the "true" self, which is an arbitrary normative stipulation. The agent paid for a service (liquidity timing) that she did not want at $t_0$ but desperately wanted at $t_1$; calling this a "pump" conflates diachronic preference change with synchronic inconsistency.
