  **The Somatic Substitution and Autobiographical Reindexing Protocol (SSARP)**

  Consider a patient, Elara, undergoing a five-year clinical protocol to treat terminal neurodegeneration via the SSARP, a procedure combining gradual somatic substitution with concurrent cognitive restructuring. Over sixty months, Elara's biological neural tissue is incrementally replaced by functionally isomorphic synthetic analogues, ensuring spatiotemporal continuity of the organism and uninterrupted consciousness throughout the turnover. Simultaneously, she undergoes Autobiographical Reindexing Therapy (ART), a validated cognitive intervention designed to mitigate trauma by altering the phenomenological indexing of memory without erasing content. Upon completion, Elara retains all declarative memories, personality traits, and preferences of the pre-procedure subject, and her body remains spatiotemporally continuous despite the material turnover. However, due to the ART intervention, Elara experiences all pre-procedure memories as third-person archival records belonging to a predecessor; she asserts, "I know exactly what happened to Elara, and I have her desires, but I did not live those life events; I inherited them."

  **Analysis of Specifications**

  1.  **Verdicts:**
      *   **Bodily-Continuity View:** **Survives.** The organism maintains spatiotemporal continuity throughout the procedure; the gradual replacement of tissue does not interrupt the biological life process, satisfying the condition that the same living body persists.
      *   **Psychological-Continuity View:** **Survives.** There is an unbroken causal chain of mental states (memories, character, preferences) from pre-procedure Elara to post-procedure Elara. The view prioritizes the retention and causal connection of psychological content over the specific phenomenological tag of ownership.
      *   **Narrative-Integration View:** **Does Not Survive.** Survival requires that post-transformation experiences be woven into a single first-person autobiographical narrative treating prior events as parts of one's own lived past. Since post-procedure Elara indexes pre-procedure events as third-person records of a predecessor, the necessary narrative weave is broken.

  2.  **Structural Feature Causing the Split:**
      The divergence is forced by the **decoupling of memory content from memory ownership**. The scenario preserves the causal chain and content required for psychological continuity (and the physical organism for bodily continuity) while specifically altering the *indexical phenomenology* (the "mineness" of experience) required by the narrative-integration criterion.

  3.  **Effect of Removing the Feature:**
      If the Autobiographical Reindexing Therapy is removed (standard SSARP without ART), the patient retains first-person ownership of past events. In this modified case, all three views converge on **Survival**: the body is continuous, psychological states are causally connected with appropriate ownership, and the autobiographical narrative remains unified.

  4.  **Narrative-Integration Theorist's Attack:**
      The theorist charges that the scenario **begs the question** by stipulating the failure of survival within the description of the mental state. By defining survival as requiring a unified first-person narrative and then describing the subject as lacking exactly that narrative via ART, the thought experiment merely asserts the conclusion ("Elara does not survive") under the guise of an empirical description. It derives the metaphysical verdict directly from a phenomenological stipulation rather than independent conditions.

  5.  **Continuity View Defender's Reply:**
      The defender responds that the charge conflates **phenomenological data with metaphysical constitution**. The description of Elara's fractured narrative is an empirical prediction about the output of the ART intervention (how memory feels), not a metaphical axiom about who she is. To claim this begs the question assumes that identity is *constituted* by narrative feeling, which is the precise point in dispute. The continuity view treats the fractured narrative as a contingent psychological effect caused by therapy; identity follows the causal chain of states and bodies, not the subjective label attached to them. Therefore, the scenario provides independent causal facts (the therapy protocol) that explain the phenomenology without presupposing the identity verdict.
