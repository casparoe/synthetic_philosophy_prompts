answer: |-
  This is a sharp dissection. You have correctly identified that "amnesty" is not a unitary concept but a container for three distinct normative moves, and that the instability of transitional justice (TJ) theory comes from sliding between them.

  Here is the precise layout you asked for, addressing the tripartite distinction, the two wrinkles, and the conditional model, followed by the confidence flags.

  ### 1. The Tripartite Distinction: Where the Slide Happens

  Your suspicion is correct: **Standard defenses operate at level (1), but the legitimacy of the transition relies on the *appearance* of level (3), mediated by a contested version of (2).**

  *   **(1) Waiver of Enforcement:** This is the legal reality. The state, possessing the *jus puniendi*, chooses not to exercise it. Defenses here are pragmatic (peace, stability) or sovereign (the new state defines its legal horizon). This is robust.
  *   **(2) Waiver of Condemnation:** This is the expressive reality. Criminal trials do not just punish; they authoritatively label acts as "crimes."
      *   *The Slide:* In blanket amnesties (e.g., Chile initially), (1) and (2) are bundled. No trial = no official finding of guilt. This creates the *illusion* of (3).
      *   *The Correction:* In sophisticated TJ (e.g., South Africa), (1) is waived but (2) is *retained*. The TRC established guilt publicly but waived punishment. This breaks the slide. If (2) is retained, (3) cannot logically follow. You cannot say "the slate is wiped clean" (3) if the official record says "you did this wrong" (2).
  *   **(3) Waiver of Normative Standing:** This is the moral metaphysics. It implies the debt is extinguished, not just uncollected.
      *   *The Problem:* The state lacks the standing to waive (3) for private wrongs. It can waive its own claim to retribution, but it cannot waive the victim's moral claim to repair or acknowledgment.
      *   *The Rhetorical Move:* TJ rhetoric often treats "Reconciliation" as a public good that supersedes private claims. It argues that by restoring the *political order*, the state restores the *context* in which private claims can be made, effectively arguing that (3) is a prerequisite for any future justice, even if it isn't justice itself.

  **Verdict:** The arguments hold for (1). They fail for (3) unless one accepts a Hegelian view where the State absorbs all private moral standing. The confusion arises because proponents speak of (3) to comfort victims while legally delivering only (1).

  ### 2. Wrinkle (a): Borrowed Mercy and Public Wrongs

  You ask what "public wrong" must mean to avoid the self-amnesty trap.

  *   **The Theory:** For the "public wrong" defense to work, the crime must be construed not as an aggregate of private injuries, but as an attack on the *constitutive rules of the political community*. Torture isn't just harm to X; it is the state using its monopoly on violence to destroy the status of X as a citizen.
  *   **The Waiver:** If the crime is against the political order, the *representative of that order* holds the claim. In a transition, the **new** state represents the *restored* order. It can waive the claim of the *old* order because it is a different moral agent.
  *   **The Line (Transitional vs. Self-Amnesty):**
      *   *Self-Amnesty:* The perpetrator remains the sovereign. The entity waiving the claim is identical to the entity that incurred the debt. This is a logical contradiction (one cannot forgive oneself a public debt without dissolving the public).
      *   *Transitional Amnesty:* A *successor* regime waives the claim.
      *   *The Weak Point:* This distinction relies entirely on the **legitimacy of the successor**. If the transition is merely a reshuffling of elites (a "pacted transition" where the old guard retains veto power), the "new" state is not a distinct moral agent. It is the old agent in a new suit.
  *   **Does it prove too much?** It risks legitimizing any regime change where the winners decide not to prosecute the losers. The principled line is not just "who won," but **whether the waiver is authorized by the victims**.
      *   *Refinement:* The "public wrong" theory only works if the amnesty is *ratified* democratically by the victimized populace. If the legislature granting amnesty is populated by the perpetrators or their proxies, it reverts to self-amnesty. The line is procedural legitimacy, not just temporal succession.

  ### 3. Wrinkle (b): The Extortion Shape

  Is "amnesty or war" structurally different from "pay up or the hostage dies"?

  *   **Structural Similarity:** Yes. It is a coercive bargain where the threatener (security forces) leverages a harm they control to extract a benefit (immunity).
  *   **The Moral Difference:** In standard extortion, the threat is *created* solely to extract the benefit. In transitions, the threat (civil war/coup) is often a *latent capacity* inherent to the collapsing regime. The perpetrators are not necessarily *creating* a new threat; they are *refusing to restrain* an existing capacity for violence.
  *   **The Necessity Defense:** This does not sink the necessity defense, but it reclassifies it. It is not a "moral achievement" in the sense of virtuous action; it is a **duress defense for the state**.
      *   *Analogy:* If a bank teller hands over money to a robber to save customers, the teller is not "complicit in robbery"; they are acting under duress to minimize harm.
      *   *Implication:* We should stop describing transitions as moral achievements (justice realized) and describe them as **moral tragedies** (justice sacrificed for peace). The confusion comes from trying to frame a duress defense as a virtue.
  *   **Does it sink the defense?** No, provided the "hostage" (the populace) is the primary beneficiary. If the amnesty benefits only the perpetrators without securing peace for the populace, it reverts to extortion. If it secures peace, it is a "lesser evil" justification.

  ### 4. Conditional Amnesty (The TRC Model)

  Does truth-for-amnesty dissolve (a) or (b)?

  *   **On (a) Borrowed Mercy:** It mitigates it. By requiring a full account, the state acknowledges the victim's standing. It says, "We cannot punish you, but we will not let you lie about it." It converts the transaction from "mercy" to "evidence." The state isn't waiving the *truth*, only the *penalty*. This preserves the victim's moral standing (2) even if it waives enforcement (1).
  *   **On (b) Extortion:** It does **not** dissolve the extortion shape. The threat of violence remains the lever. The conditionality just raises the price of the immunity.
  *   **The Artifact Problem:** You are right to worry about the record.
      *   *The Incentive:* Applicants tailor narratives to fit "political motive" criteria (e.g., "I was following orders" vs. "I was sadistic"). This distorts the historical record.
      *   *Is it worth it?* Yes, but for a specific reason: **It prevents denialism.**
      *   *Why:* In the absence of a trial, the default historical setting is "it never happened" or "it was necessary." A coerced truth, even if artifact-laden, creates an *official baseline* that makes denial socially costly. It shifts the burden of proof. A distorted record of *admission* is normatively superior to silence or a distorted record of *denial*.
      *   *The Cost:* The cost is that we lose "forensic truth" (exactly what happened) for "narrative truth" (a plausible account that fits the legal criteria for amnesty). We must accept the record as a **legal artifact**, not a historical archive.

  ***

  ### Confidence Flags

  **1. The Tripartite Distinction (1 vs 3 Slide)**
  *   **Confidence:** **High.**
  *   **Reasoning:** This is a standard analytic philosophy of law distinction (enforcement vs. validity vs. normativity). The observation that TJ rhetoric conflates them is well-supported by the gap between TRC mandates (truth) and victim expectations (justice).

  **2. The Public Wrong / Self-Amnesty Line**
  *   **Confidence:** **Medium.**
  *   **Reasoning:** The theoretical distinction (successor regime vs. incumbent regime) is clear, but the *practical* application is porous. In many transitions (e.g., Spain post-Franco, Chile post-Pinochet), the "successor" regime was heavily constrained by the incumbents. Determining when a "successor" is legitimate enough to waive the "public" claim is a political judgment, not a legal one.

  **3. The Extortion / Duress Analogy**
  *   **Confidence:** **High.**
  *   **Reasoning:** Game theory and moral philosophy align here. The structure is coercive. The moral justification rests entirely on the "lesser evil" calculus. Calling it anything else is propaganda.

  **4. The Value of the "Artifact" Record**
  *   **Confidence:** **Low (This is my least sure claim).**
  *   **Reasoning:** I am claiming that a "partly-artifactual official record" (produced by incentivized testimony) is normatively superior to silence or denial. While intuitively plausible, this is empirically fragile. If the incentivized stories are *too* distorted (e.g., everyone claims they were "following orders" when they weren't), the record may cement a lie rather than prevent denialism. We lack long-term data on whether TRC-style records actually reduce denialism over 50-year horizons compared to Nuremberg-style forensic records.

  **Specific Claim I Am Least Sure About:**
  > *"A distorted record of admission is normatively superior to silence or a distorted record of denial."*

  This relies on the assumption that "admission" has intrinsic moral value even if coerced and shaped by incentives. It is possible that a highly gamified truth process creates a "official fiction" that is more damaging to long-term historical understanding than a frank admission that "we could not establish the truth." I am confident it is *politically* useful in the short term, but less confident it is *historically* or *morally* robust in the long term.
