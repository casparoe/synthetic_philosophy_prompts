answer: |-
  Your skepticism is well-founded. The literature on societal collapse is often less a science than a genre, unified by narrative arc rather than rigorous definition. You propose four questions; I recommend retaining three, reordering them, and discarding one. The following agenda is ranked by logical priority and potential for conceptual clarification, specifically tailored to a lone reader capable of synthesizing published arguments without generating new empirical data.

  **First: The Unit-of-Analysis Problem.**
  This question must rank highest because it is logically prior to all others. You cannot detect a discontinuity, model its dynamics, or deny its existence until you have defined the entity undergoing the change. In current literature, "society" is treated as a monolith, yet as you note, administrative systems, elite culture, subsistence regimes, and biological populations decouple. If collapse refers to the failure of a redistributive palace economy, the Late Bronze Age Eastern Mediterranean is a clear case; if it refers to the welfare of the peasantry, the evidence is far more ambiguous. This ambiguity renders comparative work fragile; scholars argue past one another because they measure different variables.

  *Dependencies:* Nearly all comparative typologies depend on this. Without a standardized unit, "collapse" remains a family-resemblance term, inhibiting cumulative knowledge.
  *Feasibility:* High. This is a conceptual audit requiring no excavation, only a rigorous reading of how different authors operationalize "society."
  *Neglect:* High. While acknowledged in footnotes, it is rarely treated as a fatal flaw in synthetic works.
  *Impact:* Settling this would force a triage of your three cases. The Maya case might shift from "collapse" to "political reorganization," while Rapa Nui might shift from "ecocide" to "resilience," depending on whether the unit is the statue-building culture or the surviving population.

  **Second: The Detection and Null-Model Problem.**
  This ranks second because it validates the data used to answer the first. Even if we agree on the unit, we must determine if the signal represents a systemic discontinuity or ordinary volatility. Your suspicion regarding sampling artefacts is correct: abandonment is archaeologically visible; continuity is often invisible. Furthermore, proxy records (pollen, isotopes) have resolution limits that may smooth over rapid events or exaggerate gradual ones. A null model of normal polity fluctuation is rarely established; without it, any decline looks like a collapse.

  *Dependencies:* High. Empirical claims about timing and severity rest on this.
  *Feasibility:* High for you. Your background in isotope geochemistry allows you to critically evaluate proxy interpretations without relying on authors' conclusions.
  *Neglect:* Medium. Discussed within specialisms (e.g., palaeoclimatology) but rarely integrated into historical narratives.
  *Impact:* Resolving this could invalidate the severity of the Late Bronze Age event or suggest the Maya "collapse" was a regional rather than lowland-wide phenomenon. It determines whether there is a phenomenon to explain at all.

  **Third: The Transfer of Early-Warning Machinery.**
  This ranks third because it is theoretical overlay dependent on the first two. Concepts like critical slowing down or rising variance are borrowed from ecology and physics. Their application to social systems assumes societies behave like complex adaptive systems with attractor states. While mathematically elegant, this risks being a metaphor wearing equations. If the unit is undefined (Q1) or the signal is noise (Q2), applying resilience theory is garbage-in-garbage-out. However, if the first two are settled, this offers the only path toward predictive rather than post-hoc explanation.

  *Dependencies:* Medium. It depends on Q1 and Q2 being sufficiently resolved to provide clean inputs.
  *Feasibility:* Medium. Requires grappling with complexity theory literature, but feasible for a scientifically literate reader.
  *Neglect:* Low. It is currently trendy, meaning there is much literature, but much of it is superficial.
  *Impact:* If valid, it transforms collapse from a historical mystery to a manageable risk. If invalid, it confirms that social systems lack the homeostatic mechanisms of ecological ones.

  **The Question to Drop: The Deflationary Thesis.**
  You should discard the question of whether societies "never fail but only change." This is a cul-de-sac. It is often a rhetorical stance rather than a falsifiable claim. Unless one stipulates a threshold of magnitude or speed, "change" is infinite and "collapse" is merely a label for change we dislike. Pursuing this leads to semantic stagnation rather than explanatory power. It does not deserve your time because it dissolves the phenomenon rather than explaining it.

  **Application to the Three Cases.**
  For the **Eastern Mediterranean**, the **Unit-of-Analysis** question bears most directly. The debate hinges on whether the loss of Literacy and Palaces constitutes a societal death or merely a political restructuring. For the **Classic Maya**, the **Detection** question is paramount. The cessation of dated monuments is a clear signal, but whether this reflects population collapse or merely elite silence is a matter of proxy resolution and sampling bias. For **Rapa Nui**, the **Detection** question is again critical, specifically regarding the timing of ecological degradation versus social contact. However, the **Unit-of-Analysis** is also vital here: if the unit is the moai culture, it collapsed; if the unit is the Rapa Nui people, they persist.

  **Conclusion.**
  You have two years. Spend the first defining the object of study (Q1) and the second validating the signal (Q2). Use Q3 only to test explanations once the phenomenon is secured.

  Regarding your final constraint: I would bet that the **Unit-of-Analysis** question will remain open in twenty years. It requires a consensus on social ontology that archaeology and history are unlikely to reach soon; scholars will continue to talk past one another regarding what constitutes a "society." Conversely, the **Deflationary Thesis** is near enough settled that it does not deserve your time. It is increasingly recognized as a semantic shield that prevents falsification. The field is moving toward recognizing that while continuity exists, distinct thresholds of complexity loss are real and measurable. Do not spend your retirement debating whether decline is merely change; spend it defining what change counts.
