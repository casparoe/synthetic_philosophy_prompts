answer: |-
  You have a very sharp intuition. Your friend's argument is a classic formulation of the "Cartesian Intuition" objection to Dennett, and you are absolutely right to suspect a slide between (3) and (4). In fact, the rot sets in even earlier, at (2).

  Here is the breakdown of where the argument goes wrong, which steps you need to reject to save Dennett (and your own sanity), and what you have to give up to do it.

  ### The Critical Failure Point: Step (2)

  Your friend's argument hinges entirely on premise (2): *"The cartesian theater is the only way to secure that fact [of the matter]."*

  This is the move you must reject. This premise assumes that for an experience to be "real" or have a "fact of the matter," it must occur at a specific place (a center) and a specific time (a precise moment) where everything comes together.

  Dennett's entire project is to show that this intuition is a cognitive illusion. We *feel* like there is a "now" and a "me" inside looking out, but that feeling is the *result* of the processing, not the *precondition* for it.

  **The Cost of Rejecting (2):**
  You have to give up the idea that your introspection is infallible regarding *how* experience happens. You feel like there is a unified "present moment." Dennett says that feeling is like a cursor on a computer screen. The cursor looks like a single point moving smoothly, but "under the hood," the computer is refreshing pixels in chunks, processing mouse inputs asynchronously, and buffering data. The "single point" is a useful fiction for the user, not a physical reality in the circuitry.

  If you reject (2), you accept that a "fact of the matter" about experience doesn't require a singular neural event. It just requires a stable outcome that the system can use.

  ### The Second Failure Point: Step (4)

  This is the slide you suspected. Step (4) claims: *"Without a master copy... at the actual moment of experience there's no determinate content."*

  This assumes there is such a thing as "the actual moment of experience" independent of the drafts. Dennett argues there isn't.

  In the Multiple Drafts Model, the brain is a parallel processor. Different features (color, motion, sound) are processed at different speeds in different areas. There is no master clock in the brain. So, asking "what was I experiencing at exactly millisecond T?" is a category error. It's like asking, "At what exact moment did the US economy enter the recession?" There isn't one. It's a distributed event that gets labeled "recession" retrospectively when enough indicators align.

  **The Cost of Rejecting (4):**
  You have to accept **temporal smearing.** You cannot pinpoint the exact nanosecond where "unconscious processing" becomes "conscious experience." The boundary is fuzzy. If you demand a precise boundary, you are demanding a Cartesian Theater.

  ### How to Keep (1) and (7) Without Falling into (6)

  You want to keep (1) (consciousness is real/fact of the matter) and (7) (Dennett keeps consciousness). You can do this, but you have to redefine what "fact of the matter" means in premise (1).

  **The Fix:**
  Change (1) from:
  *"If consciousness is real, there has to be a fact of the matter about what i'm experiencing right now [defined as a precise neural state]."*

  To:
  *"If consciousness is real, there has to be a fact of the matter about what I can report, act upon, and remember as my experience."*

  For Dennett, the "fact of the matter" **is** the winning draft.

  Your friend's argument assumes there is a "True Experience" hidden somewhere that the drafts might be failing to capture. Dennett says: **The draft that wins the competition for control of speech and memory *is* the experience.** There is no deeper layer.

  If Draft A wins the competition at time T+100ms, and it says "I saw a red light," then the fact of the matter is that you experienced a red light. It doesn't matter if Draft B (green light) was active at T+50ms and lost. Draft B wasn't "suppressed consciousness"; it was unconscious processing that failed to become part of the narrative.

  ### Avoiding Step (6): The "Retroactive Confabulation" Trap

  Step (6) says: *"If there's no fact of the matter about present experience, then phenomenal consciousness doesn't exist — it's just a story we tell after the fact."*

  This is the scariest step. It sounds like Dennett is saying "you aren't actually conscious."

  Here is how you avoid it: **Distinguish between the *process* and the *magic*.**

  Dennett is an eliminativist about the *magic*, not the *process*.
  *   **The Magic:** The idea that there is an inner eye watching a screen, where qualia are intrinsic, ineffable qualities that exist independently of function. (This is what Step 6 eliminates).
  *   **The Process:** The complex, parallel, editing-heavy biological machinery that results in a human being who can say "I am in pain," avoid fire, and write poetry. (This is what Dennett keeps).

  When your friend says "it's just a story we tell after the fact," they treat "story" as a dirty word meaning "lie." For Dennett, a "story" is a **control structure.** The brain tells a story to the rest of the brain to coordinate action. That story *is* the consciousness. It is real, it has causal power, and it is what you are. It is just not *made of* the magical stuff we intuitively think it is made of.

  ### Summary: Which Steps to Reject?

  1.  **Reject (2) Hard.** The Cartesian Theater is not the only way to secure a fact of the matter. Functional stability secures it.
  2.  **Reject (4) Hard.** There is no "actual moment" independent of the drafts. Time in the brain is constructed, not given.
  3.  **Modify (1).** "Fact of the matter" means "functional availability for report/action," not "singular neural snapshot."

  **The Cost:**
  You lose the comfort of thinking your "now" is a sharp, objective line in the sand. You lose the idea that you have direct, infallible access to the *mechanism* of your own mind. You have to accept that consciousness is a **User Illusion**—not in the sense that it doesn't exist (the desktop icons on your computer are real enough to click on), but in the sense that it simplifies a massively complex backend into something manageable for the user.

  **The Payoff:**
  You keep consciousness (7). You keep a fact of the matter (1)—the fact being the output of the system, not the hidden wiring. And you avoid the Cartesian Theater without falling into the idea that you are a philosophical zombie. You are real, but you are a distributed, narrative-driven biological machine, not a ghost in a machine.

  Your friend's argument forces a dilemma (Theater or Nothing) by assuming that *only* the Theater counts as "Something." Dennett's move is to show that "Something" can be a distributed process. Once you accept that, the dilemma dissolves.
