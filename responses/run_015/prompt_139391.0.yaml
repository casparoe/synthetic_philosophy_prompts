answer: |-
  The opening formulation of the categorical imperative in the chapter is a standard and largely acceptable simplification, capturing the core instruction to act only on maxims that can be willed as universal law. However, the transition from this formal definition to the practical instruction to imagine a world where everybody does what you are about to do is where the first subtle distortion occurs. While Kant does speak of a world governed by universal laws of nature, his focus is on the logical consistency of the will within that world, not merely the empirical desirability of the resulting state of affairs. A sympathetic Kantian would accept the heuristic value of visualizing universal adoption but would reject the implication that the test is satisfied merely by finding the resulting world livable. The test is meant to reveal contradictions in conception or in the will, not to assess the prudential acceptability of the outcome. By framing the test as asking whether you could accept living in that world, the chapter subtly shifts the ground from rational consistency to personal preference, which prepares the reader for the consequentialist interpretation that follows.

  This shift becomes explicit when the chapter claims that an action is wrong if universal adoption would destroy the practice the action depends on or produce a state of affairs no rational person would choose. The first part of this claim, regarding the destruction of a practice like promising, aligns with Kant's notion of a contradiction in conception, where the universalization of a maxim makes the action itself impossible. However, the second part, which cites a state of affairs no rational person would choose, conflates Kant's contradiction in the will with a utilitarian calculation of overall welfare. Kant argues that certain maxims cannot be willed universally because they conflict with the necessary ends of a rational will, such as the development of one's talents or the help of others, not because the resulting world is unpleasant or suboptimal. When the chapter explains that universal lying is wrong because a world without trust is worse for everyone, it attributes a consequentialist rationale to Kant that he explicitly rejects. For Kant, lying is wrong because it undermines the very condition of communication and treats humanity as a mere means, not because the aggregate outcome is negative. This misrepresentation allows the author to conclude that stripping away the talk of duty reveals rule-utilitarianism in disguise, but this conclusion relies on the very conflation the previous steps established. A Kantian would argue that the ground of the obligation remains distinct because the validity of the law derives from the structure of rational agency itself, independent of the good or bad states of affairs it produces.

  The chapter then attempts to solidify this critique by applying the test to specific maxims such as training as a doctor or lying to a murderer at the door, claiming the test gives the wrong answer or no answer at all. Regarding the maxim to train as a doctor, the objection misunderstands the scope of the categorical imperative, which tests the permissibility of maxims rather than dictating specific life choices for everyone. Kant distinguishes between perfect and imperfect duties, and while there is a duty to develop one's talents, there is no requirement that everyone adopt the same specific talent or profession. A Kantian would argue that the maxim passes the test as permissible, and the claim that it fails assumes a rigidity Kant does not impose. Regarding the murderer at the door, the chapter claims the test fails because it yields the wrong answer, implying that one should lie. However, Kant famously argued that one must not lie even in this scenario, so the test does provide an answer, albeit one that conflicts with many people's moral intuitions. The difficulty here is not that the test is silent or broken, but that it generates a verdict that many find too demanding. This is a familiar objection based on conflicting moral intuitions rather than a demonstration of internal incoherence, and presenting it as a refutation assumes the conclusion that consequentialist outcomes should override deontological constraints.

  Consequently, the chapter's final assertion that hardly anyone defends Kant's view now is an exaggeration that relies on the preceding mischaracterizations. While Kantian ethics faces challenges, particularly in resolving conflicts between duties or addressing the harshness of absolute prohibitions, it remains a dominant framework in contemporary moral philosophy precisely because it avoids the problems of utilitarianism that the chapter inadvertently highlights. The claim that the theory inherits rule-utilitarianism's problems only holds if one accepts the earlier conflation of rational willing with outcome acceptance. Once the accurate distinction is restored, the critique loses much of its force, leaving only the genuine difficulty of applying abstract formal tests to complex concrete situations, which is a challenge for any normative theory. The core of the chapter's conclusion, that the test is merely disguised consequentialism, does not survive a rigorous audit, though the observation that the test can be difficult to apply without slipping into outcome-based reasoning remains a valid pedagogical warning.

  The variant proposed by the blog author, which suggests testing partial compliance rather than universal adoption, addresses a different problem than the one Kant was solving. Kant's concern was with the rationality of the individual agent's will and the logical possibility of their maxim serving as a law for all rational beings. Introducing a threshold of partial compliance, such as five per cent, shifts the focus from logical consistency to the stability of social practices under non-ideal conditions. This approach captures something Kant's strict universalism struggles with, namely the problem of free-riding in a world where others are not compliant, but it does so by quietly substituting a different theory altogether, likely a form of contractualism or rule-utilitarianism. For Kant, a moral law must hold universally without exception; if a maxim requires others to behave in a certain way for it to be permissible for you, it fails the test of autonomy. The partial compliance variant makes the validity of the moral rule contingent on empirical facts about how others behave, which undermines the categorical nature of the imperative. While this variant may offer more practical guidance in non-ideal circumstances, it abandons the core Kantian insight that moral obligation stems from the nature of rationality itself rather than the contingent stability of social practices. Thus, while the blog author's modification handles free-riding better, it does so by ceasing to be Kantian, confirming that the difficulties identified in the chapter often arise when one attempts to make Kant's formalism do the work of a consequentialist theory.
