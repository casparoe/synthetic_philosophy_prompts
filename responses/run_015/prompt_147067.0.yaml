answer: |-
  Your friend was half-right: this is absolutely a pragmatics problem, and Grice provides the vocabulary to describe it. But your intuition is also correct: the institutional behavior looks like a contradiction. It isn't that the institutions have two different *theories* of meaning; it's that they are strategically exploiting the gap between *semantic content* and *pragmatic force* in two different directions depending on whether they are trying to avoid liability or avoid outrage.

  Here is the reconstruction of the machinery, the inconsistency, and what happens if we break it.

  ### 1. Reconstructing the Implicit Theories

  You have identified two distinct operational stances toward language. Let's formalize them.

  **Stance A (The Apology Law Logic): Pragmatic Realism**
  *   **Presupposition:** Hearers infer agency and fault from expressions of regret, regardless of literal syntax.
  *   **Theory of Meaning:** Communication is defined by *uptake*. If a reasonable hearer infers "I did this" from "I'm sorry," then "I did this" has been communicated, even if it wasn't said.
  *   **Goal:** To protect the speaker from the *pragmatic consequences* of their words. Since the jury cannot help but infer fault, the law must intervene to block that inference from counting as evidence.
  *   **Gricean Status:** This acknowledges that **Generalized Conversational Implicatures** (standard inferences like "sorry" → "fault") are psychologically robust and often functionally non-cancellable in high-stakes contexts.

  **Stance B (The Non-Apology Logic): Semantic Literalism**
  *   **Presupposition:** Liability attaches only to explicit semantic content (truth conditions).
  *   **Theory of Meaning:** Communication is defined by *proposition*. If the sentence does not syntactically bind the agent to the error ("Mistakes were made" vs. "We made mistakes"), no admission has occurred.
  *   **Goal:** To satisfy the social demand for an apology (the *illocutionary* appearance) without triggering the legal consequences of an admission (the *perlocutionary* effect).
  *   **Gricean Status:** This relies on the **Cancellability** of implicature. It assumes that by manipulating syntax (passive voice), you can prevent the fault implicature from arising, or that the hearer will accept the literal meaning and ignore the pragmatic inference.

  **The Inconsistency:**
  The inconsistency lies in the **Cancellability Assumption**.
  *   In Stance A, institutions admit that implicatures are *not* cancellable by the speaker's intent (a juror hears "fault" even if the surgeon meant "sympathy").
  *   In Stance B, institutions bet that implicatures *are* cancellable by syntactic maneuvering (the public will accept "mistakes were made" without inferring "we did it").

  They are inconsistent because they treat the listener as a **psychological realist** in the courtroom (who can't help but infer blame) but as a **semantic robot** in the press release (who only processes literal truth conditions).

  ### 2. Does Grice Explain the Asymmetry?

  Grice's apparatus explains *how* the trick works, but it highlights why the institutional behavior is manipulative rather than cooperative.

  **Implicature and the Cooperative Principle**
  Grice assumed communication is a cooperative effort to exchange truth. Institutions are often engaged in *strategic* communication.
  *   **"I'm sorry":** Generates a generalized implicature of responsibility. Grice says this is *defeasible* (cancellable). You can say, "I'm sorry, but it wasn't my fault."
  *   **The Apology Law:** Acts as an external **defeater**. It essentially tells the jury: "Treat this utterance as if the implicature has been cancelled, by legal fiat."
  *   **"Mistakes were made":** This is a **flout** of the Maxim of Manner (be clear). The speaker is being obscure on purpose. Grice says when you flout a maxim, the hearer looks for an implicature. The implicature of "mistakes were made" in a corporate context is obviously "The company made mistakes."

  **Why Grice Tells Against Stance B**
  Gricean theory suggests Stance B (the non-apology) shouldn't work on a rational hearer. If a company says "mistakes were made," and everyone knows the company made them, the implicature is generated *because* of the obscurity. The fact that Stance B *does* work (the box gets ticked) suggests that public discourse operates on a lower standard of processing than Gricean cooperation. It relies on **cognitive miserliness**: the audience is tired, wants closure, and accepts the literal sentence to move on, ignoring the pragmatic inference.

  So, Grice doesn't validate the inconsistency; he exposes Stance B as a exploitation of the audience's limited processing resources, while Stance A is an admission that in court, processing resources are high (jurors are looking for blame), so the implicature becomes unavoidable.

  ### 3. Speech Act Theory and Relevance Theory

  If Grice feels incomplete, that's because he focuses on inference. Other frameworks cut deeper here.

  **Speech Act Theory (Austin/Searle)**
  This is likely the better fit for your "shape" problem.
  *   **Illocutionary Force:** An apology is not just a description of sadness; it is an act of *taking responsibility*. It has "felicity conditions." One condition is that the speaker acknowledges they caused the harm.
  *   **The Non-Apology:** "Mistakes were made" attempts to perform the act of *Expressing Regret* without the act of *Accepting Blame*. In Speech Act terms, this is a **misfire**. It looks like an apology, but it lacks the essential commitment.
  *   **The Inconsistency:**
      *   **Apology Laws** recognize the *Illocutionary* reality: Saying "sorry" *is* taking responsibility, so we need to protect you from that act.
      *   **PR Firms** rely on *Perlocutionary* effects: We don't care if the act is a misfire; we only care if the audience *feels* appeased.
      *   **Verdict:** Speech Act Theory confirms the practices are incompatible. One treats the speech act as binding (Stance A); the other treats it as aesthetic (Stance B).

  **Relevance Theory (Sperber & Wilson)**
  *   **Principle:** Hearers expect optimal relevance (maximum cognitive effect for minimum processing effort).
  *   **"Mistakes were made":** This forces the hearer to expend effort to identify the agent. If the context makes the company the obvious agent, the *most relevant* interpretation is "The company made mistakes."
  *   **The Gamble:** Stance B bets that the hearer will not bother to compute the most relevant interpretation because the literal sentence offers a "good enough" cognitive effect (closure) without the negative effect (anger). It's a bet on audience fatigue.

  ### 4. The "Sorry" vs. "I Wish" Line: Principled or Superstition?

  Risk managers ban "sorry" but allow "I wish this hadn't happened." Is this principled?

  **Yes, it is principled (in theory).**
  *   **"I'm sorry":** Lexically ambiguous. It can mean "I apologize" (admitting fault) or "I feel sadness" (sympathy). Because it *can* function as a performative verb of apology ("I apologize"), it triggers the liability framework.
  *   **"I wish this hadn't happened":** This is a report of a **psychological state** (a counterfactual desire). It contains no performative force. It does not semantically or pragmatically require an agent. It is purely expressive.

  **No, it is superstition (in practice).**
  *   **Pragmatic Uptake:** To a grieving family, "I wish this hadn't happened" and "I'm sorry" have the same illocutionary force: *Acknowledgement of harm.*
  *   **The Gricean Problem:** If a surgeon says "I wish this hadn't happened," the Maxim of Relation implies they are responding to the harm they caused. The implicature of agency remains.
  *   **Why the ban?** It's a "safe harbor" superstition. Lawyers know that "sorry" is a keyword that triggers plaintiff attorneys' search algorithms and juror heuristics. "I wish" is not. It's not that the meaning is different; it's that the **legal trigger** is different. It is a ritualistic avoidance of a taboo word, not a genuine change in communicated content.

  ### 5. The Hypothetical: A "Reasonable Hearer" Standard

  You asked: *If we replaced the implicit theory with one where you're responsible for what a reasonable hearer would infer, full stop, no cancellability escape hatch... what would these practices look like?*

  This would shift the legal standard from **Semantic Content** to **Pragmatic Effect**.

  **1. Apology Laws would become Pointless (or Redundant).**
  *   Currently, apology laws say: "You can say sorry, and we won't let the jury use it as evidence of fault."
  *   Under a Reasonable Hearer Standard, saying "sorry" *is* evidence of fault because a reasonable hearer infers fault.
  *   To protect clinicians, the law would have to go further: It would have to decouple **Empathy** from **Liability** entirely. It would need to establish that expressing sadness *never* implies agency, legally. But if the standard is "what a hearer infers," and hearers *do* infer agency, the law would be fighting human psychology.
  *   *Result:* Clinicians would likely be gagged entirely. If any expression of regret is legally binding admission of guilt, silence becomes the only safe option.

  **2. Non-Apologies would become Impossible.**
  *   "Mistakes were made" would be treated legally as "We made mistakes."
  *   "We regret that customers were disappointed" would be treated as "We disappointed customers."
  *   *Result:* Corporate language would become radically clearer. The passive voice would vanish from liability contexts.

  **3. What Would We Lose?**
  *   **We would lose the space for Benevolence without Liability.** This is the crucial loss. Currently, apology laws allow a surgeon to be human ("I'm sorry") without being sued. If we adopt a strict "hearer inference" standard, the surgeon cannot express human empathy without accepting legal risk.
  *   **We would lose the "Face-Saving" Off-Ramp.** Non-apologies, while dishonest, sometimes allow conflicts to de-escalate without a total admission of defeat. If "mistakes were made" equals "we are liable," companies will fight harder, litigate more, and settle less.

  **4. What Would We Gain?**
  *   **Radical Honesty.** The gap between what is communicated and what is conceded would close.
  *   **Efficiency.** Less time spent decoding corporate weasel words.

  ### 6. Silence and Refusal to Comment

  You remembered correctly. This folds in neatly under the **Maxim of Quantity** (make your contribution as informative as required).

  *   **Gricean View:** If I accuse you of theft and you say "No comment," you are withholding information you are expected to provide. The hearer infers: "If he were innocent, he would deny it. He didn't deny it. Therefore, he is guilty." This is a **particularized conversational implicature**.
  *   **Legal View:** The 5th Amendment (in the US) explicitly blocks this inference in court. Judges instruct juries: "Do not infer guilt from silence."
  *   **The Tension:** Just like with the apology laws, the *legal rule* tries to override the *pragmatic reality*. Empirical studies show jurors *do* infer guilt from silence despite instructions.
  *   **Connection to your pattern:** This is another instance of **Stance A (Pragmatic Realism)**. The legal system acknowledges that silence communicates (hence the need for a specific right to remain silent), but tries to artificially sever the link between that communication and liability.

  ### Summary: The Shape of the Thing

  The shape you are looking for is the tension between **Institutional Liability** and **Human Communication**.

  1.  **Communication is inherently risky.** To speak is to open yourself to inference (Grice). To apologize is to open yourself to liability (Speech Acts).
  2.  **Institutions want the benefits of communication without the risks.** They want the public to feel they apologized (Stance B) without admitting fault. They want their staff to express empathy (Stance A) without creating evidence.
  3.  **The Inconsistency is Strategic, not Theoretical.** They don't actually believe hearers are semantic robots (Stance B); they just hope the public is distracted enough to let it slide. They don't actually believe hearers are psychological determinists (Stance A); they just know juries are looking for blood.

  If we moved to a strict "Reasonable Hearer" standard, we would force institutions to be honest, but we would likely chill human empathy in high-stakes environments. We would solve the problem of the "non-apology" by destroying the possibility of the "safe apology." We would gain truth, but we might lose mercy.

  The "superstition" about the word *sorry* is the ritual sacrifice at the altar of this inconsistency: we ban the word that most clearly signals the *act* of apology, hoping that by changing the syntax, we can change the moral reality. Grice would say we are merely flouting the maxims; the hearers know we are lying; but the law allows us to pretend we aren't.
