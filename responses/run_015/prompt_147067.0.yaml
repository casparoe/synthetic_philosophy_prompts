          *   *Verdict:* It *is* inconsistent in practice, though Grice provides the vocabulary to describe *why* it's inconsistent. Grice assumes cooperation; institutions are often strategically *uncooperative*.

      *   **Speech Act Theory (Austin/Searle):**
