answer: |-
  **Title:** The Canvas and the Corpse: Metaphysical Persistence in *The Picture of Dorian Gray*

  **Introduction**

  The standard pedagogical entry point into the metaphysics of persistence is the Ship of Theseus: a puzzle regarding material constitution and gradual replacement. It is a clean, abstract problem, but it often fails to capture the existential anxiety that motivates the question. Why do we care whether we are the same person over time? Usually, it is because we fear loss, decay, and the accumulation of moral debt. Oscar Wilde's *The Picture of Dorian Gray* offers a unique thought experiment that inverts the ordinary conditions of persistence. In the standard human condition, the body bears the marks of time (wrinkles, scars) while the psychological or moral self is thought to endure beneath. In Wilde's novel, the body remains statically youthful while the painted image absorbs the temporal and moral degradation.

  This paper argues that Wilde is not merely employing a fantasy plot device but is dramatizing a tension between two competing metaphysical intuitions: the endurantist desire to remain "wholly present" and unchanging in essence, and the perdurantist reality that existence is a temporally extended accumulation of states. By separating the locus of physical change from the locus of conscious experience, Wilde forces a confrontation with the problem of temporary intrinsics and the criteria for personal identity. While the novel does not solve the logical problems of persistence, it reveals the moral stakes that analytic metaphysics often brackets. Specifically, it suggests that numerical identity may be less significant than *moral* identity, and that a theory of persistence which ignores the ontological weight of action is incomplete.

  **Temporary Intrinsics and the Endurantist Dilemma**

  The first metaphysical problem Wilde dramatizes is the problem of temporary intrinsics. For the endurantist, an object is wholly present at every moment of its existence. This view faces the classic objection: how can one and the same object possess incompatible intrinsic properties at different times? Dorian cannot be intrinsically youthful and intrinsically withered. The standard endurantist solution is to relativize property-holding to times: Dorian is youthful-at-$t_1$ and withered-at-$t_2$.

  Wilde's premise offers a fantastical alternative. Dorian remains youthful-at-$t_1$, youthful-at-$t_2$, and youthful-at-$t_n$. The incompatible property (withered/corrupt) is not relativized to a time; it is relocated to a different substance entirely (the canvas). In this sense, the novel does not solve the logical problem of temporary intrinsics so much as it externalizes it. The painting becomes a "property-bearer" for the temporal changes that Dorian's body refuses to accept.

  This dramatization exposes a hidden motivation for endurantism. We are intuitively drawn to the idea that we are wholly present because we wish to disown our past degradations. We want to be the subject of our virtues without being the subject of our vices. Wilde shows that if persistence requires the subject to bear all intrinsic changes, then true endurantism is morally burdensome. Dorian attempts to be a pure endurer—a substance that persists without intrinsic alteration—by offloading the alterations onto a proxy. The horror of the novel arises because this metaphysical bifurcation is unsustainable. The endurantist intuition (that I am the same whole me) clashes with the causal reality that actions leave marks. Wilde suggests that a persisting object that does not accumulate its own history is not a person, but a phantom.

  **Perdurantism: Worms, Stages, and the Canvas**

  If we shift to a perdurantist framework, the analysis becomes more complex. On the worm-theoretic version of perdurantism, Dorian is a space-time worm composed of temporal parts. Ordinarily, these parts vary qualitatively (young stages, old stages). In Wilde's scenario, Dorian's temporal parts are qualitatively identical regarding physical appearance; they are a "degenerate worm" whose external properties never vary.

  This raises the question: Which thing is Dorian? Is the picture the repository of his temporal parts? Strictly speaking, no. The canvas is a numerically distinct object existing alongside Dorian. It is not a temporal part of Dorian; it is a separate substance that mirrors Dorian's moral trajectory. However, functionally, the painting acts as the *record* of the worm's moral extension. If personal identity is tied to the accumulation of character, the painting contains the "temporal parts" of Dorian's soul, while the body contains the temporal parts of his appearance.

  This creates a metaphysical fissure. If the stage theorist is right that we are merely instantaneous stages linked by continuity relations, Dorian's bargain should stop being metaphysically alarming. Each stage of Dorian is simply a young man-stage causally connected to the previous young man-stage. The fact that a painting elsewhere is rotting is irrelevant to the identity of the stage. Yet, the novel treats this as a catastrophe. Why? Because the continuity relation that matters is not just psychological or physical, but *moral*. The stages of Dorian are psychologically continuous (he remembers his sins), but they are morally discontinuous from his physical presentation.

  Wilde thus challenges the perdurantist to explain which relations constitute persistence. If physical decay is not required for persistence, why does the separation of the decay onto another object feel like a fragmentation of the self? The novel suggests that persistence is not merely a matter of causal connection between stages (as the stage theorist holds) but requires a unity of *manifestation*. A worm that does not show its age in any of its parts is a lie. The painting, therefore, is not a temporal part of Dorian, but it is the *truth-maker* for Dorian's persistence. Without the painting, Dorian's persistence is a falsehood; with it, his persistence is revealed as a fractured relation between two objects.

  **The Objection: Category Mistake or Metaphysical Insight?**

  Your seminar leader raises a potent objection: this project commits a category mistake. Persistence concerns numerical identity through change. Wilde's bargain only relocates visible effects. Dorian's memory, remorse, and self-knowledge remain with the body. Since Lockean theories of personal identity tie the person to psychological continuity, the person is with the body, regardless of what the paint does. The painting is merely a magical mirror, not a metaphysical component of Dorian.

  This objection is correct within the strict bounds of analytic personal identity. If "Dorian" is defined by psychological continuity, the painting is external. However, the reading survives if we refine what is meant by "persistence." We must distinguish between *Personal Identity* (who is responsible?) and *Substance Persistence* (what bears the properties?). Wilde's novel suggests that for a human being, these cannot be decoupled without destroying the entity.

  If the painting bears the *causal consequences* of the life (the physical corruption resulting from sin), does it not bear the *ontological burden* of the person? The objection assumes that psychology is the sole criterion for identity. Wilde challenges this by proposing a moral ontology where the soul has a physical reality. If the soul is the essence of the person, and the painting displays the state of the soul, then the painting is the *true* persisting object in a way the body is not. The body becomes a mask; the painting becomes the substance.

  Therefore, the reading does not dodge the objection but complicates it. It forces us to ask: if psychological continuity stays with the body, but moral accountability is visibly inscribed on the canvas, where does the "person" reside? The novel implies that a person is not just a psychological stream but a unity of action and consequence. By splitting them, Wilde creates two entities: the *experiencer* (the body) and the *account* (the painting). Neither is a complete person. The category mistake is not in reading metaphysics into the plot, but in assuming that numerical identity can be settled without reference to how moral properties are instantiated. Wilde argues that you cannot persist as a person if you do not persist as a moral agent *in the flesh*.

  **The Ending: Reunification and Moral Order**

  The climax of the novel, where Dorian stabs the canvas and is found dead while the portrait is restored, is the metaphysical resolution of the experiment. Does this vindicate perdurantism? One could argue that the ending confirms that the person *is* the whole temporally extended thing, corrupted parts included. Dorian attempts to excise the corrupted parts (by hiding them in the attic/canvas), but the universe demands they be reintegrated. The withered corpse on the floor represents the sudden, violent reintegration of all the temporal properties Dorian had offloaded.

  However, it is more accurate to say the ending vindicates a specific kind of endurantism: one where the object must be wholly present *with all its history*. The body cannot remain youthful because the history is not gone; it is merely displaced. When the displacement mechanism (the magic) is attacked, the history crashes back into the substance.

  This is not merely a restoration of moral order; it is a metaphysical claim about the nature of substances. A substance cannot shed its accidental properties (aging, scarring) without ceasing to be that substance. The ending suggests that persistence requires the *integration* of change. To persist is to endure change, not to evade it. The perdurantist thought that a person is the sum of their parts is vindicated only in the sense that you cannot discard the bad parts and keep the good ones. The "unmarked body" was never the person to begin with; it was a shell. The real Dorian was the aggregate of the life lived, and that aggregate demanded a physical correlate.

  **Key Scenes for Analysis**

  To anchor this argument, three scenes are essential:

  1.  **The Wish in Basil's Studio (Chapter 2):** This is the moment of metaphysical fission. Dorian articulates the desire: "If it were only the other way!... If it were I who was to be always young, and the picture that was to grow old!" This scene should be analyzed as the formulation of the endurantist wish—to be wholly present in youth while time passes. It establishes the separation of the *subject of experience* from the *subject of change*.
  2.  **The Locked Attic Room (Various Chapters):** The periodic viewings of the portrait represent the endurantist confronting their own perdurance. Dorian enters the room to check his "temporal parts" stored on the canvas. This scene dramatizes the alienation of the self from its own history. It is the empirical check on the metaphysical bargain, showing that the properties *do* exist, just not on the primary substance.
  3.  **The Final Confrontation and Stabbing (Chapter 20):** Dorian attempts to destroy the record (the canvas) to free himself (the body). This is an attempt to sever the continuity relation entirely—to become a new stage with no past. The failure of this act (the transfer of properties back to the body) demonstrates the necessity of property-bearing for persistence. You cannot kill your history and survive.

  **Conclusion: What Literature Adds to the Debate**

  Does this reading contribute anything to the endurantism/perdurantism debate that the literature does not? Analytic metaphysics excels at logical consistency but often struggles with the *phenomenology* of persistence. Arguments about temporal parts are logically robust but emotionally sterile. Wilde's novel provides a grip on *why* the endurantist picture is so attractive: it is the desire to escape the ravages of time while retaining the self. It also shows why it is terrifying: to be an endurer is to be responsible for every moment of your existence.

  The novel resists being read as a strict metaphysical treatise because it operates in the realm of value, not just ontology. It suggests that the dispute between endurantism and perdurantism is not just about how objects exist, but about how we *value* existence. We prefer endurantism because we want to be the same "good" self over time. We fear perdurantism because it implies we are merely a collection of moments, some of which are rotten.

  Wilde dramatizes the cost of trying to have it both ways. By separating the persistence of the body from the persistence of the moral record, he shows that a theory of persistence that ignores the accumulation of moral properties is a theory of ghosts, not people. The novel does not solve the problem of temporary intrinsics, but it reveals that the "solution" we secretly desire (to keep the good properties and discard the bad) is a form of death.

  In closing, your seminar paper should not claim Wilde proves perdurantism true. Rather, claim that Wilde exposes the *moral stakes* of the metaphysical choice. If you are a worm, you are your worst stages. If you are an endurer, you must bear your worst properties. Dorian tries to be neither, and in doing so, he ceases to be a person at all. The contribution of the novel is to remind metaphysicians that persistence is not just a logical puzzle about identity conditions; it is the condition of being accountable for a life. The "category mistake" your leader identifies is only a mistake if we assume metaphysics is purely descriptive. Wilde argues it is normative: to persist is to bear the weight of what you have become.
