  4.  **Distinguishing the Roles of Beauty/Value:**
      *   *Role 1: Object of Contemplation.* Here, the mental quality is the *object*. The subject is passive (mostly). Value lies in the consciousness of the object.
      *   *Role 2: Element in Reciprocity.* Here, the mental quality is part of a causal/psychological loop. I love you; you love me; I love that you love me.
      *   In Friendship, the "appreciation" isn't just looking at a static object. It's interactive. The "beautiful mental quality" in the friend is often *their appreciation of me*.
      *   So, the content of the appreciation changes.
          *   Case A (Aesthetic): I admire X's virtue.
          *   Case B (Friendship): I admire X's virtue, *and* X admires my virtue, *and* I admire X's admiration of me.
      *   This suggests the "part" inside the whole is not identical to the standalone "whole" of aesthetic appreciation. It's a more complex state.

