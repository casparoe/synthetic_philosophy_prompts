answer: |-
  This is a sharp conceptual knot, and it cuts directly to the coherence of Moore's principle of organic unities. The tension you've identified rests on whether the "appreciation of beautiful mental qualities" functions as a stable, transferable value-atom that gets plugged into different wholes, or whether its axiological nature shifts depending on the structural context.

  To untangle this without resorting to exegesis of secondary literature, we need to dissect the logic of the organic unity itself and apply it rigorously to the phenomenology of the mental states involved. There is no genuine contradiction in Moore's system, but only if we accept a specific, somewhat demanding claim about how value properties supervene on complex states of consciousness.

  Here is the breakdown of the tension and its dissolution.

  ### 1. The Category Error of "Double-Counting"
  First, we must clear away a potential misunderstanding of what "double-counting" means in Moore's framework. The worry implies an additive model of value: if $A$ is valuable, and $B$ contains $A$, then the value of $B$ is $Value(A) + Value(Relation)$. If we prize both $A$ and $B$, we seem to be counting $A$'s value twice.

  But Moore's principle of organic unities explicitly rejects additivity. The value of the whole is *not* the sum of the values of its parts. A part can have zero intrinsic value in isolation but be essential to a highly valuable whole. Conversely, a part can have high intrinsic value in isolation but contribute nothing (or even negative value) to a specific whole.

  Therefore, strictly speaking, there is no arithmetic double-counting. When Moore lists friendship and aesthetic appreciation as the two supreme goods, he is not creating a ledger where you sum them up. He is identifying two distinct *types* of wholes that yield the highest possible quantities of intrinsic value. The question is not about addition; it is about **identity**. Is the "appreciation" found inside friendship *identical* to the standalone good of aesthetic appreciation?

  ### 2. The Identity Problem: Is the "Part" the Same?
  This is the crux of your knot. If the appreciation of a friend's mental qualities is exactly the same mental state as the aesthetic appreciation of a beautiful object (or another's virtues) in isolation, then we have a redundancy problem. Why prioritize the complex whole if it just replicates the value of the part?

  However, Moore implies a phenomenological distinction that dissolves the identity claim. We can distinguish the roles of beauty in these two contexts by looking at **directionality** and **reflexivity**.

  **Aesthetic Appreciation (Standalone):**
  In the case of pure aesthetic appreciation (e.g., contemplating a painting or admiring a stranger's virtue from afar), the structure is subject-to-object. The value lies in the consciousness *of* the beautiful quality. The object is passive. The subject's emotional state is one of admiration or delight, but it does not necessarily entail a desire for reciprocity or a causal impact on the object.

  **Friendship (Organic Whole):**
  In friendship, the "appreciation of beautiful mental qualities" is embedded in a reciprocal loop.
  1.  I appreciate your mental qualities.
  2.  You appreciate my mental qualities.
  3.  Crucially, I appreciate *your appreciation of me*.

  In the friendship whole, the "beautiful mental quality" being appreciated is often *the friend's affection toward the subject*. This makes the object of appreciation reflexive. I am not just contemplating a static virtue; I am contemplating a consciousness that is itself contemplating me.

  This structural difference suggests that the "appreciation" inside friendship is not the same atom as the standalone aesthetic good. It is a more complex state of consciousness. In the standalone case, the object is "Beauty." In the friendship case, the object is "Beauty aware of Me." Because the intentional object of the consciousness differs, the mental state itself differs. Therefore, we are not counting the same value twice; we are valuing two distinct states of consciousness, one of which (friendship) logically presupposes the capacity for the other (appreciation) but transforms it through reciprocity.

  ### 3. The Transformation Thesis
  Even if we grant that the cognitive component ("I see your virtue") is identical in both cases, Moore's organic unity principle allows us to argue that the **value-bearing capacity** of that component changes when embedded.

  Moore argues that the intrinsic value of a whole is not determined solely by the intrinsic value of its parts. The *relation* between parts creates a new value property that supervenes on the whole, not the parts.

  Consider the emotional tone. Moore distinguishes between the *cognitive* awareness of a quality and the *emotional* response to it.
  *   In **Aesthetic Appreciation**, the emotion is admiration or delight.
  *   In **Friendship**, the emotion is *affection* (love).

  Moore insists that friendship is not just "awareness of virtue" + "pleasure." It requires the specific emotion of affection. When the appreciation of mental qualities is infused with *affection*, it ceases to be purely aesthetic appreciation. It becomes a constituent of personal affection.

  Here is the dissolution of the contradiction: The "appreciation" in friendship is not functioning as the *supreme good of aesthetic appreciation*. It is functioning as a **necessary condition** that enables the supreme good of friendship to exist.

  *   **Role 1 (Standalone):** Appreciation acts as the *sole constituent* of the value. The value supervenes directly on the contemplation.
  *   **Role 2 (Friendship):** Appreciation acts as a *structural scaffold*. It allows the reciprocal affection to latch onto something real (the friend's mind).

  If you isolate the appreciation within friendship, you might get *some* intrinsic value (the aesthetic good), but you destroy the *much greater* intrinsic value of the friendship. The "double-counting" worry assumes we can harvest the value of the part without damaging the value of the whole. Moore would argue you cannot. To extract the "aesthetic appreciation" from the friendship (by becoming a detached observer of your friend rather than a participant) is to dismantle the organic unity. You are left with Good A, but you have destroyed Good B. Since Good B >> Good A, there is no practical or theoretical conflict. You don't count them both in deliberation because you can't have the full value of B without sacrificing the isolation required to value A *as a standalone*.

  ### 4. Distinguishing the Object of Contemplation
  To dig even deeper into the weeds: Does the "beauty" being appreciated change category?

  In the standalone aesthetic good, the beauty is often formal or characteristic (a painting's composition, a person's courage). In friendship, the "beautiful mental quality" is often **moral goodness directed at the subject**.

  If I admire a stranger's courage, that is aesthetic appreciation. If I admire my friend's loyalty *to me*, and they admire my loyalty *to them*, the "beauty" is inherently relational. It is a beauty that *cannot exist* in isolation. A disposition of loyalty requires an object. Therefore, the "beautiful quality" appreciated in friendship is ontologically dependent on the relationship itself.

  This means the "aesthetic component" in friendship is not a pre-existing atom that gets plugged in. It is a quality that *emerges* from the relationship. You cannot have the "loyalty to me" without the "me." Consequently, the appreciation of that loyalty cannot be the same as the appreciation of a detached virtue.

  This dissolves the contradiction entirely:
  1.  **Standalone Good:** Appreciation of non-relational beauty (or beauty treated as detached).
  2.  **Friendship Good:** Appreciation of relational beauty (qualities that exist only *in* the relation).

  Since the objects of appreciation are ontologically distinct, the values are distinct. There is no overlap to double-count.

  ### 5. Conclusion: The Hierarchical Resolution
  The tension arises if we view Moore's list of goods as a flat menu of independent items. It is more accurate to view them hierarchically.

  The "appreciation of beautiful mental qualities" is a **fundamental value function**. It is the mechanism by which consciousness connects to value.
  *   When this function operates on static objects, it yields the good of **Aesthetic Appreciation**.
  *   When this function operates recursively between two consciousnesses, infused with affection, it yields the good of **Friendship**.

  The "contradiction" is dissolved by recognizing that the second instance is not a sum of the first instance plus something else. It is a higher-order operation of the same faculty. The value of the appreciation *within* friendship is not the value of the standalone aesthetic good; it is the value of a constituent that makes the higher-order good possible.

  Moore isn't double-counting because he isn't counting the *same thing*. He is identifying that the same psychological faculty (appreciation) generates value in two modes: a simple mode (contemplation) and a complex mode (reciprocal affection). The complex mode is superior not because it contains more "units" of appreciation, but because the organic unity of reciprocity creates a new, emergent value property that dwarfs the simple mode. The "aesthetic" element in friendship is transformed from a terminal value into a constitutive element of a greater terminal value.
