          3.  *Emotional Tone:* "Personal affection" involves emotions (love, care) that are distinct from the "admiration" of aesthetic appreciation. Moore distinguishes "pleasure in the thing" vs. "emotion towards the thing."
      *   **Resolution:** The appreciation in friendship is *transformed*. It is not the standalone good of aesthetic appreciation inserted into a container. It is a constituent that *only* has that specific value-contributing power within the relational context.
      *   **Implication:** We don't double-count because we aren't valuing the *same* thing twice. We are valuing a simple state (aesthetic) and a complex state (friendship) where the complex state's value emerges from the configuration, not the mere presence of the simple state.

  6.  **Refining the "In the Weeds" aspect:**
