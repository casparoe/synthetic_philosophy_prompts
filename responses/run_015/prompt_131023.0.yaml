      *QM Nuance:* Also, clarify that "rejecting PII" in physics is still a live debate. Some philosophers of physics argue for a "Weak PII." Don't state it as settled fact that PII is false in physics, but that standard interpretations suggest it.

  7.  **Final Polish:** Ensure clear headings and a summary verdict. (Proceed to generate output).

      *Wait, one more check on the QM claim:* "electrons in the same orbital literally share every property including position."
