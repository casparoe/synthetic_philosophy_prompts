  1. **A mapping, not a summary.**

  **Textualism (as deployed by the Dissent)**
  *   **Object of Interpretation:** The ordinary meaning of the enacted text at the time of enactment, treated as a bare string of words unless clearly ambiguous.
  *   **Inputs:**
      *   (i) **Dictionary/Isolation:** Admissible; decisive weight. Defines "tangible object" as anything capable of being touched.
      *   (ii) **Company/Canons:** Admissible; low weight. Subordinate to plain meaning; cannot override clear text.
      *   (iii) **Context/Title/History:** Admissible; low weight. Context cannot narrow clear text; bad drafting is Congress's problem.
      *   (iv) **Legislative History/Expectations:** Inadmissible or negligible weight. Expectations do not alter enacted text.
      *   (v) **Penalty/Lenity:** Admissible; low weight. Lenity applies only to ambiguity; text here is clear.
  *   **Real Work:** Input (i) does the real work.
  *   **Difference:** Textualism treats (i) as a threshold constraint that blocks (ii) and (iii) from narrowing the text.

  **Purposivism (as deployed by the Plurality)**
  *   **Object of Interpretation:** The enacted text read against its statutory context and the legislature's aim.
  *   **Inputs:**
      *   (i) **Dictionary/Isolation:** Admissible; low weight. Ordinary meaning yields to contextual meaning.
      *   (ii) **Company/Canons:** Admissible; high weight. *Noscitur a sociis* and *ejusdem generis* define the scope of "tangible object."
      *   (iii) **Context/Title/History:** Admissible; high weight. Sarbanes–Oxley's financial-fraud purpose limits the provision's reach.
      *   (iv) **Legislative History/Expectations:** Admissible; medium weight. Implied by the statutory scheme and title.
      *   (v) **Penalty/Lenity:** Admissible; medium/high weight. Severity informs the absurdity analysis and supports narrowing.
  *   **Real Work:** Inputs (ii) and (iii) do the real work.
  *   **Difference:** Purposivism treats (ii) and (iii) as meaning-constitutive, allowing them to override (i). Both methods formally admit all inputs but differ on the lexicography of weight.

  2. **Where each method is silent or indeterminate.**

  Neither method settles by its own lights whether "tangible object" is genuinely ambiguous or merely broad; textualists treat breadth as clarity, while purposivists treat breadth as an invitation for context. Neither method definitively establishes whether associated-word canons are guides to semantic meaning or tie-breakers used only after meaning runs out; the dissent treats them as tie-breakers (unnecessary here), while the plurality treats them as meaning-makers. Finally, neither method provides a neutral metric for when a result is "absurd" enough to override text; textualists in this case tolerate the severity, while purposivists do not. *Yates* exposes the silence on the threshold for ambiguity: the dissent sees no ambiguity to resolve, while the plurality sees ambiguity created by the mismatch between text and purpose.

  3. **Four controlled rewrites.**

  *   **Variant A (purpose codified).**
      *   *Textualist:* Answer likely unchanged; operative text still controls over findings.
      *   *Purposivist:* Answer strengthened; purpose is now enacted text.
      *   *Grace:* Purposivism absorbs this more gracefully because it treats purpose as text anyway.
      *   *Reveal:* Textualism struggles to give weight to enacted purpose clauses if they conflict with operative text, revealing a hierarchy within text itself.
  *   **Variant B (enactment detached).**
      *   *Textualist:* Answer unchanged; text is identical.
      *   *Purposivist:* Answer changes; without financial context, "tangible object" broadens.
      *   *Grace:* Textualism explains the consistency; Purposivism explains the outcome change.
      *   *Reveal:* Purposivism is inherently context-dependent, while Textualism claims context-independence.
  *   **Variant C ("other" inserted).**
      *   *Textualist:* Answer may change; "other" triggers *ejusdem generis* syntactically.
      *   *Purposivist:* Answer unchanged; confirms narrowing.
      *   *Grace:* Both converge, but Textualism absorbs it via syntax.
      *   *Reveal:* Textualism has resources for context (canons), but they function like purposive tools, blurring the distinction.
  *   **Variant D (stakes lowered).**
      *   *Textualist:* Answer unchanged; penalty does not alter meaning.
      *   *Purposivist/Alito:* Reasoning weakens; less absurdity to avoid.
      *   *Grace:* Textualism is stable; Purposivism is sensitive to consequences.
      *   *Reveal:* The plurality's reasoning (and Alito's vote) was likely driven by the severity of the punishment rather than pure semantics.

  4. **What the case does to the theories.**

  *Yates* counts as evidence that textualism is not the constraint it advertises itself to be, because the "textualist" dissenters advocated for a result (20 years for fish) that the majority found intolerable, suggesting textualism permits outcomes that judges will reject on normative grounds. It counts as evidence that the two methods are not rivals but a shared toolkit plus a second-order disagreement about which materials are legitimate; both sides used dictionaries and canons, but weighted them differently. There is a defensible reading on which both sides are methodologically consistent: the dissent followed hard textualism, while the plurality followed purposivism; the plurality is not cheating on purposivism, but the dissent is cheating on the constraint claim if they ignore the normative cost. Honestly, the case turned on a normative disagreement about which error is worse—criminalizing ordinary destruction of evidence under a 20-year provision, or leaving obstruction of a conservation investigation unpunished. Textualism has no internal resource for settling this; purposivism uses "absurdity" as a proxy for the normative judgment.

  5. **One ranking.**

  1.  **(iii) Context/Title/History:** This input drove the plurality's definition of the statute's scope.
  2.  **(v) Penalty/Severity:** This input likely secured the fifth vote and motivated the avoidance of absurdity.
  3.  **(i) Dictionary/Isolation:** This input drove the dissent's reasoning but lost the case.
  4.  **(ii) Company/Canons:** This input supported the plurality but relied on input (iii) to activate.
  5.  **(iv) Legislative History:** This input was least explicit in the provided opinions and facts.

  \answer{LENITY_OR_CONSEQUENCES_DOES_THE_WORK}
