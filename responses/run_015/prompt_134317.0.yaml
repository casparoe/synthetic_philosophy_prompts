answer: |-
  There is no single, canonical eponym (like "The Gettier Problem" or "The Duhem-Quine Thesis") that exclusively names this specific configuration. However, your intuition is correct: this is a distinct structural problem in confirmation theory that is often conflated with the Problem of Old Evidence or the Theory-Ladenness of Observation, yet it possesses unique boundary conditions.

  In the philosophy of science literature, this pattern is most rigorously discussed at the intersection of **Bayesian Model Selection**, **Bogen and Woodward's Data-Phenomena Distinction**, and **Lakatosian Research Programmes**.

  To give you the precision you require, I will propose the descriptive term **"Residual Reification"** (or alternatively, **"Evidential Re-categorization"**) to label this phenomenon. Below is an exact definition, its Bayesian mechanics, its relationship to adjacent problems, and its boundary conditions.

  ---

  ### 1. Definition and Structure: What It Is

  **Residual Reification** occurs when the confirmation of a theory ($T_2$) over a rival ($T_1$) relies not on predicting new data points, but on reclassifying a subset of existing data ($F$) from *stochastic error* (in $T_1$) to *deterministic signal* (in $T_2$).

  The structure is as follows:
  1.  **Shared Raw Data:** Both theories operate on the same raw measurement stream $D_{raw}$.
  2.  **Divergent Decomposition:**
      *   $T_1$ models $D_{raw} = \text{Signal}_{T1} + \text{Noise}$. Feature $F$ falls into the $\text{Noise}$ term (residuals).
      *   $T_2$ models $D_{raw} = \text{Signal}_{T2}(F) + \text{Noise}'$. Feature $F$ is absorbed into the $\text{Signal}$ term.
  3.  **Confirmation Claim:** Proponents of $T_2$ claim $D_{raw}$ confirms $T_2$ because $T_2$ "explains" $F$, whereas $T_1$ "ignores" it.
  4.  **The Crux:** In the original vocabulary of $D_{raw}$, the probability distributions may overlap significantly. The confirmation arises because $T_2$ reduces the *unexplained variance* of the model, effectively claiming that $T_1$ was **mis-specified**, not just incorrect.

  ### 2. Bayesian Mechanics: Why It Is Not "Old Evidence"

  The classic **Problem of Old Evidence** (Glymour, 1980) asks: How can $E$ confirm $H$ if $P(E) = 1$ (because $E$ is already known)? Standard solutions (Garber, 1983) involve conditionalizing on the *logical relation* between $H$ and $E$.

  **Residual Reification differs fundamentally:**
  *   **Old Evidence:** The proposition $E$ is fixed. The uncertainty lies in whether $H$ entails $E$.
  *   **Residual Reification:** The proposition $E$ itself changes identity.
      *   For $T_1$, the evidence proposition is $E_1$: "The data follows pattern $P$ plus random error $\epsilon$."
      *   For $T_2$, the evidence proposition is $E_2$: "The data follows pattern $P'$ where $\epsilon$ contains structure $F$."

  In Bayesian terms, the likelihood ratio shifts not because $T_2$ predicts a known $E$ better, but because the **model of the error term** changes.
  $$ \frac{P(D_{raw} | T_2)}{P(D_{raw} | T_1)} $$
  If $T_1$ assumes errors are i.i.d. (independent and identically distributed) Gaussian noise, but $F$ represents autocorrelated structure, then $P(D_{raw} | T_1)$ is actually much lower than $T_1$'s proponents claim, because $D_{raw}$ is unlikely under a *true* noise model. $T_2$ wins not by predicting new data, but by correctly specifying the **likelihood function** of the old data.

  **Conclusion:** This is not a problem of temporal priority (Old Evidence); it is a problem of **Model Specification**.

  ### 3. Relation to Key Epistemological Concepts

  #### A. Theory-Ladenness of Observation
  Standard theory-ladenness (Hanson, Kuhn) suggests that theorists "see" different things (e.g., a pendulum vs. a constrained fall).
  *   **Distinction:** Residual Reification is more granular. It is not that the *object* is seen differently, but that the **statistical ontology** of the data stream is partitioned differently. It is **"Theory-Ladenness of Data Processing."** Both parties agree on the voltage readings or reaction times; they disagree on which variance is ontological (signal) and which is epistemological (ignorance/noise).

  #### B. Data vs. Phenomena (Bogen & Woodward, 1988)
  This is the closest existing framework. Bogen and Woodward distinguish **Data** (idiosyncratic, error-prone measurements) from **Phenomena** (stable features of the world).
  *   **The Conflict:** $T_1$ treats $F$ as Data (noise). $T_2$ treats $F$ as a Phenomenon (signal).
  *   **The Confirmation:** $T_2$ is confirmed if it can be shown that $F$ is stable across different experimental setups (i.e., it is a phenomenon, not an artifact). If $F$ disappears when the instrument changes, $T_1$ was right (it was noise). If $F$ persists, $T_2$ is right (it was signal).
  *   **Your Case:** The confirmation claim rests on the assertion that $F$ has **phenomenal stability**, not predictive novelty.

  #### C. Predictive vs. Explanatory Accommodation
  *   **Predictive:** $T$ predicts $D$ before $D$ is known.
  *   **Accommodation:** $T$ is built to fit $D$.
  *   **Residual Reification:** This is **"Deep Accommodation."** It avoids the usual penalty for accommodation (overfitting) *if* $T_2$ provides an independent mechanism for why $F$ exists. If $T_2$ merely adds a parameter to fit $F$, it is overfitting. If $T_2$ derives $F$ from a first principle (e.g., "cognitive state transitions" or "primordial inflation"), it gains explanatory power that justifies the reclassification.

  ### 4. Boundary Conditions: What It Is Not

  To define the edges of Residual Reification, we must distinguish it from three adjacent strategies:

  #### A. vs. Ad Hoc Auxiliary Hypotheses (Lakatos/Popper)
  *   **Ad Hoc:** $T_1$ is threatened by $F$. $T_1$ adds an auxiliary $A$ solely to explain $F$, without new testable content. This is degenerative.
  *   **Residual Reification:** $T_2$ does not add an auxiliary to $T_1$; it **replaces the core model**.
  *   **The Edge:** The distinction lies in **independent motivation**. If $T_2$ treats $F$ as signal *only* to save the theory, it is ad hoc reclassification. If $T_2$ treats $F$ as signal because of independent theoretical reasons (e.g., a new mechanism of cognitive processing), it is legitimate Residual Reification.

  #### B. vs. Immunization Strategies
  *   **Immunization:** $T_1$ dismisses $F$ as "error" to protect the core theory from falsification.
  *   **Residual Reification:** $T_2$ embraces $F$ as signal, thereby *exposing* itself to falsification. If $F$ turns out to be random, $T_2$ fails.
  *   **The Edge:** Immunization reduces risk; Residual Reification (when done by $T_2$) increases risk. $T_1$ is the one potentially immunizing.

  #### C. vs. Standard Underdetermination
  *   **Underdetermination:** $D$ is compatible with both $T_1$ and $T_2$ equally.
  *   **Residual Reification:** $D$ is *not* compatible with both equally **once the error structure is defined**. If $F$ is truly structured, $T_1$ is statistically mis-specified.
  *   **The Edge:** The dispute is resolvable not by new data, but by **diagnostic testing of residuals**. (e.g., Testing if $F$ is white noise or colored noise).

  ### 5. Proposed Label and Formal Definition

  Since no single canonical term exists, I recommend using **"Residual Reification"** to describe this specific Bayesian configuration.

  **Formal Definition:**
  > **Residual Reification** is a mode of theory confirmation wherein a rival theory ($T_2$) gains posterior probability over an established theory ($T_1$) by re-modeling a subset of the residual variance ($F$) of $T_1$ as deterministic signal. Confirmation is achieved not through the prediction of novel data points, but through the reduction of unexplained variance via the **ontological promotion** of anomalies, contingent on the demonstration that $F$ possesses stability properties inconsistent with stochastic error.

  ### 6. Summary of Relations

  | Concept | Relation to Residual Reification |
  | :--- | :--- |
  | **Problem of Old Evidence** | **Distinct.** Old Evidence concerns temporal priority ($P(E)=1$). Residual Reification concerns evidential *status* (Signal vs. Noise). |
  | **Theory-Ladenness** | **Subset.** It is a specific form of theory-ladenness applied to statistical decomposition rather than perceptual reporting. |
  | **Ad Hocness** | **Opposite Risk.** Ad hocness adds parameters to save a theory. Residual Reification changes the *definition of fit*, risking falsification if the "signal" proves random. |
  | **Underdetermination** | **Resolution.** It resolves underdetermination by appealing to the **stability of phenomena** (Bogen & Woodward) rather than predictive divergence. |

  ### 7. Final Verdict for Your Argument

  You can confidently tell your friend that this is **not** the standard Problem of Old Evidence. The Old Evidence problem assumes the evidence proposition is fixed and known. In your pattern, the **evidence proposition is fluid**.

  The dispute is not about whether $D$ confirms $T$, but about **what $D$ is**.
  *   If $F$ is noise, $D$ confirms $T_1$.
  *   If $F$ is signal, $D$ confirms $T_2$.

  Therefore, the confirmation battle is fought not on the ground of prediction, but on the ground of **diagnostic validity** (e.g., "Can we show these reaction time outliers are reproducible?"). If they are reproducible, $T_1$ is not just wrong; it is **category-mistaken**. This makes Residual Reification a more severe epistemic shift than standard accommodation.
