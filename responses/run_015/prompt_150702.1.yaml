answer: |-
  # Question-Period Preparation Sheet
  **Workshop:** Comparative Historical Social Science
  **Paper:** Deflating Strong Path Dependence to Arrival-Time Dependence
  **Time Horizon:** 3 Weeks

  ## Part I: The Eight Objections
  *Ordered by potential damage to the thesis, not order of asking.*

  ### 1. The "Grain of Description" Trap
  **Who:** Philosopher of Science
  **Phrasing:** "You hang the entire taxonomy on the distinction between 'outcome-type' and 'outcome-token.' But you haven't given us a principled metric for similarity. If I describe the outcome as 'industrialisation,' you get convergence. If I describe it as 'textile dominance in Lancashire versus the Ruhr,' you get lock-in. Isn't your deflation just a trivial consequence of choosing a coarse grain of description? What makes your grain the *causal* grain?"
  **Concede:** You cannot derive the "right" grain from theory alone; it is partly pragmatic.
  **Hold:** The grain must be fixed *before* testing, not adjusted post-hoc to fit the path-dependence claim.
  **Reply:** "You're right that grain is a choice, but it's not arbitrary. It's fixed by the functional problem the actors are solving. If the problem is 'generate surplus energy,' steam and nuclear are the same type. If the problem is 'maintain Lancashire employment,' they are not. My claim is that path-dependence literature often switches grains mid-argument: using coarse grains to claim inevitability ('capitalism arrives') but fine grains to claim tragedy ('*this* capitalism'). I demand consistency. If you claim lock-in of the *type*, you must show the functional solution itself fails to re-emerge, not just that the local incumbent changes."
  **Candid Weakness:** I don't have a formal algorithm for "functional equivalence." I am relying on historical consensus about what counts as the same solution (e.g., bureaucracy), which is vulnerable to the charge of being subjective.

  ### 2. The Political Stakes of "Re-Convergence"
  **Who:** Comparative-Historical Political Scientist / Historical Sociologist
  **Phrasing:** "You concede that distributional legacies and welfare differences survive your deflation. But in my work on colonial extraction or racialised dispossession, the *distribution* is the outcome. If you tell a policymaker 'don't worry, the institution will re-converge to the functional optimum,' they hear 'historical injustices wash out.' Are you not providing intellectual cover for the idea that we don't need reparative intervention because the market will eventually re-derive the efficient form?"
  **Concede:** Strongly. Arrival-time dependence does not imply moral neutrality or self-correction of injustice.
  **Hold:** Analytical clarity about *what* is locked in is better than conflating form with distribution.
  **Reply:** "This is the most important objection. I am not saying the victims of the 'arrival-time' delay are compensated. If a colony is dispossessed in 1800, it doesn't matter if the *type* of legal system re-converges in 1950; the wealth gap created in that window is durable. My argument is actually *for* intervention: if strong path dependence were true, reform would be impossible. Because I argue for arrival-time dependence, I am arguing reform *can* work to restore the functional form, but we must explicitly compensate for the distributional scars left by the delay. I am separating the feasibility of reform from the justice of the legacy."
  **Candid Weakness:** "Re-converge" sounds like "return to status quo ante." I need to be careful not to sound like I'm promising efficiency.

  ### 3. Model Properties vs. Empirical Claims
  **Who:** Institutional Economist (Increasing Returns Tradition)
  **Phrasing:** "You treat path dependence as an empirical hypothesis to be tested. For us, it's a property of the model—non-ergodicity, multiple absorbing states. If the parameters allow for multiple equilibria, strong path dependence is *possible* by definition. You're attacking the QWERTY anecdote, but that's just pedagogy. The theoretical point stands: small events *can* select equilibria. Why should we discard the strong concept just because empirical cases are messy?"
  **Concede:** Non-ergodicity is a valid mathematical property.
  **Hold:** Applying that model to history requires evidence that the parameter space actually allows multiple *functional* equilibria, not just multiple *incumbents*.
  **Reply:** "I accept the math. But social science isn't just checking if a model is internally consistent; it's checking if the model maps to the world. The literature uses the *existence* of non-ergodic models to assert the *prevalence* of lock-in in history. I'm arguing the map is wrong. Most historical 'absorbing states' are just high switching costs for incumbents, not true functional dead-ends. If you keep the strong claim as a 'theoretical possibility' but admit it's empirically rare, we agree. But you can't use the model's existence to bypass the burden of proof for specific historical cases."
  **Candid Weakness:** They can retreat to "It happens sometimes" and I can't prove it never happens. I need to keep the pressure on the *prevalence* claim.

  ### 4. Identification and the "Replay" Test
  **Who:** Quantitative Economic Historian
  **Phrasing:** "You propose the 'erasure-and-replay' test as a way to distinguish lock-in from arrival-time. Methodologically, this looks like selection bias. You're looking for cases where systems were isolated and re-derived solutions. But you only observe the replays that succeeded. Where are the counterfactuals where the solution *didn't* re-emerge? This isn't an identification strategy; it's survivorship bias masquerading as a natural experiment."
  **Concede:** It is not a statistical identification strategy in the modern sense.
  **Hold:** It is a logical test for necessity. If X is necessary for Y, removing X should prevent Y.
  **Reply:** "I agree it's not a regression discontinuity. It's a logical stress-test. I'm not claiming every replay succeeds. I'm claiming that where we *do* have clean replays—like the independent invention of calculus, or bureaucracy in China and Europe—the outcome-type recurs. The burden is on the strong path-dependence claimant to show a case where the functional solution was *impossible* to re-derive after a reset. If you can't point to a 'failed replay' where the function was needed but never emerged, the lock-in claim is speculative."
  **Candid Weakness:** "Failed replays" are hard to observe (how do you measure a solution that never happened?). This is the softest methodological point.

  ### 5. The "Relevant Horizon" Problem
  **Who:** Quantitative Economic Historian / Institutional Economist
  **Phrasing:** "You say the outcome re-derives 'within some relevant horizon.' How long is that? If I say QWERTY will be replaced in 500 years, is that arrival-time dependence? If the horizon is infinite, the claim is unfalsifiable. You risk defining away lock-in by just waiting long enough."
  **Concede:** "Relevant horizon" is under-specified in the draft.
  **Hold:** It must be bounded by the lifespan of the actors or institutions making the choice.
  **Reply:** "Fair point. It cannot be infinite. The horizon must be bounded by the political or economic lifecycle of the decision-makers. If a technology locks in a standard for 300 years, that is effectively lock-in for the society that lived then. My claim is that in the canonical cases—legal systems, administrative forms—the re-derivation happens within centuries, not millennia. I need to be more precise: if the delay exceeds the lifespan of the generating conflict, it counts as lock-in. If it's within the lifespan of the civilisation, it's arrival-time."
  **Candid Weakness:** This is the weakest joint. "Centuries" is vague. I need a specific cutoff or admit it's a continuum.

  ### 6. Mechanism vs. Outcome
  **Who:** Historical Sociologist
  **Phrasing:** "Even if the outcome-type is the same (e.g., a welfare state), if the route determines *who* built it (labor unions vs. state elites), the mechanism is different. Doesn't the route determine the stability and character of the outcome? If the path determines the mechanism, isn't that effectively strong path dependence in terms of political dynamics?"
  **Concede:** The *character* and *stability* are path-dependent.
  **Hold:** The *existence* of the functional form is not.
  **Reply:** "This is why I separate 'Routing Effects' from 'Lock-In.' I agree the route matters for the politics of the institution. A welfare state built by unions looks different than one built by Bismarck. But my thesis is that the *function* (social insurance) arrives in both. The strong claim says one route leads to insurance and the other leads to no insurance. I'm saying both get insurance, but the politics differ. That preserves your work on political struggle without requiring the strong lock-in claim."
  **Candid Weakness:** Blurs the line. If the "character" is different enough, is it really the same "outcome-type"? (See Objection 1).

  ### 7. The QWERTY Strawman
  **Who:** Institutional Economist
  **Phrasing:** "Nobody serious believes QWERTY is the definitive proof of path dependence anymore. We use it to teach increasing returns. By spending so much time deflating QWERTY, are you fighting a battle we already lost? What about financial crises or technological standards where network effects are demonstrably stronger?"
  **Concede:** QWERTY is a tired example.
  **Hold:** It is still the canonical illustration used to justify the *intuition* behind the strong claim in broader social science.
  **Reply:** "You're right that economists have moved on. But political scientists and sociologists still cite QWERTY as the paradigm for why history matters. As long as the 'small event, huge consequence' intuition rests on those anecdotes, the strong claim retains undue weight. I'm happy to drop QWERTY if you give me a better empirical case of *functional* lock-in. Do you have one where a superior functional equilibrium was permanently inaccessible due to an early contingency?"
  **Candid Weakness:** If they name a case (e.g., nuclear standardisation), I need to be ready to analyze it as arrival-time.

  ### 8. The Normative Implication of "Efficiency"
  **Who:** Graduate Student (Political Science)
  **Phrasing:** "You talk about 'functional solutions' re-emerging. This implies a functionalist teleology—that history tends toward efficient equilibria. Doesn't this smuggle in a normative assumption that the outcome which arrives is the 'right' one? What if the re-derived solution is a 'bad' equilibrium that just happens to be stable?"
  **Concede:** Functional does not mean normatively good.
  **Hold:** Functional means "solves the coordination/extraction problem at hand."
  **Reply:** "I use 'functional' in the engineering sense, not the moral sense. A predatory state can be a functional solution for elite extraction. My claim is that the *type* of state (predatory) re-emerges, not that a *benevolent* state emerges. I am not arguing history is efficient. I am arguing it is recurrent. The 'bad' equilibria can be path-dependent too; I'm just saying they aren't unique to the specific early contingency."
  **Candid Weakness:** "Functional" is a loaded word in sociology. I should use "recurrent solution to the coordination problem."

  ---

  ## Part II: Strategic Advice

  ### 1. The Pre-Emptive Concession (First Minute)
  **Do this before taking questions.**
  "I want to start by clarifying what this argument does *not* do. I am not arguing that history doesn't matter, nor that historical injustices wash out. The distributional consequences of *when* and *how* an institution arrives are durable and often catastrophic for specific groups. My argument is narrower: I am challenging the claim that the *functional type* of the institution is uniquely determined by early accidents. I make this distinction because if we believe strong lock-in, we give up on reform. If we believe arrival-time dependence, we see reform as possible but historically costly."
  *Why:* This disarms the Political Scientists and Sociologists immediately. It shows you are not a "history doesn't matter" positivist.

  ### 2. The Single Reply That Must Land
  **The Definition of "Outcome-Type."**
  If you lose the room on how you define the "outcome," the taxonomy collapses.
  **The Line:** "The outcome-type is defined by the *problem being solved*, not the *incumbent solving it*. If the problem is 'collect taxes,' and both France and England develop tax bureaucracies, that is convergence, even if the French one is more centralized. If you define the outcome as 'French-style centralization,' you have defined lock-in into your description."
  *Why:* This addresses the Philosopher and the Economists simultaneously. It prevents them from moving the goalposts.

  ### 3. The Weakest Joint (Prepare to Defend)
  **The "Relevant Horizon."**
  The Quant Historians will hammer you on falsifiability. If you say "it comes back eventually," you are unscientific.
  **Preparation:** Do not say "eventually." Say: "Within the lifespan of the political order." If a regime falls and the next one rebuilds the same bureaucracy within 50 years, that is arrival-time. If 500 years pass with no bureaucracy, that is lock-in.
  **Risk:** They will ask for a cutoff.
  **Defense:** "It is a continuum, but the burden of proof lies on the lock-in claimant to show the function *failed* to emerge despite demand. I am not claiming it always emerges instantly, only that the claim of *permanent* absence is unsupported."

  ### 4. The Question You Hope Nobody Asks
  **"Can you name one case of Strong Path Dependence that *does* survive your test?"**
  **Why it's dangerous:**
  *   If you say "No," you look dogmatic and ahistorical (surely *something* is locked in?).
  *   If you say "Yes" (e.g., "The QWERTY keyboard"), you undermine your thesis that the canonical cases are weak.
  *   If you say "Yes" (e.g., "Nuclear War"), it's too trivial.
  **Prepared Answer:** "I am hesitant to name one because doing so validates the 'strong' label for cases that might just be high-switching-cost arrival delays. However, I would point to *biological* or *geographic* constraints—like a specific land bridge closing that permanently isolates a species. In social systems, true lock-in is likely limited to cases where the *capacity* to re-derive is destroyed, not just the incentive. I am open to candidates, but they must pass the erasure-and-replay test."
  *Strategy:* Pivot back to the *test*, not the *list*.

  ---

  ## Part III: Evidence Pocket Check

  **1. The "Replay" Case (Bureaucracy)**
  *   **Fact:** Weberian bureaucracy re-emerged in post-Roman Europe, Imperial China, and the Caliphates independently.
  *   **Use:** To show "outcome-type" (administration) recurs despite different "routes" (feudalism vs. imperial exam).
  *   **Memory Check:** Safe to assert from memory. Do not cite specific dates (e.g., "Tang Dynasty 618 AD") unless you are 100% sure. Say "Early Medieval" or "Tang Era."
  *   **Risk:** A Sinologist in the room might say "Chinese bureaucracy was distinct."
  *   **Defense:** "Distinct in route, same in functional type: impersonal rule-based administration."

  **2. The "Replay" Case (Science/Calc)**
  *   **Fact:** Newton and Leibniz.
  *   **Use:** To show intellectual "lock-in" is actually arrival-time.
  *   **Memory Check:** Safe.
  *   **Risk:** Someone says "But they fought over priority."
  *   **Defense:** "Exactly. The *math* arrived. The *incumbency* was contested. That is arrival-time dependence."

  **3. The "Horizon" Figure**
  *   **Fact:** Do **not** try to cite a specific convergence rate or half-life.
  *   **Advice:** If pressed for a number, refuse. "I do not have a metric for that yet; this is a conceptual taxonomy first."
  *   **Why:** Guessing a number (e.g., "100 years") invites easy falsification.

  **4. The "Distribution" Example**
  *   **Fact:** Post-Communist trajectories.
  *   **Use:** To concede the Political Scientists' point.
  *   **Memory Check:** "Some converged to democracy, some to autocracy, but all faced similar market pressures."
  *   **Risk:** This is contested terrain.
  *   **Defense:** Use it to illustrate the *concession*, not the main thesis. "Whether they converged is debated, but the welfare costs of the transition were path-dependent."

  ## Final Note on Tone
  You are not trying to destroy the field of historical institutionalism. You are trying to save it from its own strongest claims. Frame this as **refining the toolkit**, not discarding it. When the Institutional Economists speak, nod at the model validity. When the Political Scientists speak, nod at the inequality stakes. Your enemy is not them; your enemy is the *conflation* of their distinct insights into a single "Strong Path Dependence" claim that holds neither water theoretically nor empirically.
