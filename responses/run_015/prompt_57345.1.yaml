answer: |-
  ### The Grounded Verification Principle

  Your tentative principle fails because it conflates *logical provability* (where Löb's theorem applies) with *empirical reliability* (where induction applies). You cannot prove yourself sound, but you can observe yourself to be reliable. The repaired principle distinguishes between trusting a *derivation* and trusting a *mechanism*.

  **Clause 1: The Empirical Anchor.**
  Trust is admissible if confidence rests on an observed frequency of reliability of the *mechanism*, independent of the logical validity of the current output. This validates the calculator (Case 1), the friend (Case 5), and the proof assistant's default mode (Case 4). It distinguishes Case 4 from Case 6: you have a track record of the software, but not of your future self's specific reasoning process prior to entering it.

  **Clause 2: Structural Reduction.**
  Trust is admissible if the verification step is computationally or logically simpler than the generation step, allowing direct audit. This validates the kernel check (Case 3). It also validates the chess engine (Case 7) not as logical proof, but as a heuristic process where deeper search empirically correlates with better moves, grounded by Clause 1.

  **Clause 3: Logical Non-Circularity.**
  Trust is inadmissible if the justification for accepting a claim $P$ relies on a derivation that assumes the soundness of the derivation method used to produce $P$ within the same formal system. This bans the future self's promise (Case 6), the procrastinating agent (Case 8), and the unverified proof report (Case 10).

  **Clause 4: Causal Decoupling.**
  Refusal to compute is admissible if the computation itself is a causal variable in the outcome's truth value, decoupling the act of thinking from truth-tracking. This validates the medical refusal (Case 9).

