  6.  **Developing the Analysis:**
      *   *Not a difference maker:* The harm (loss of traceability/compliance) is binary and already realized by the server crash. Her act changes the state from "untraceable" to "untraceable."
      *   *Still responsible:* She is a participant in a normative practice. The obligation is to follow the rule *because it is the rule of the practice*, not merely because it causes good outcomes. Her act expresses a disregard for the joint commitment.
      *   *Defender's Objection:* "Moral responsibility requires causal efficacy. If you couldn't change the outcome, you couldn't be responsible for the harm. You might be 'rule-breaking' but not 'harm-responsible'." They might argue the wrongness is merely conventional, not moral.
