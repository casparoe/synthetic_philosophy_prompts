      *   *Wait, one nuance:* If she adds the agent, does it reduce harm *at all*? If the river is already toxic, reducing it slightly might still be "harmful," but the prompt asks for "not a difference maker for the harm." If the harm is defined as "exceeding the safe threshold," and it's already exceeded, she didn't change the status of "harm occurring."
      *   *Let's tighten the "no difference" claim:* The harm is "violating the legal discharge limit." The limit is already violated by others. Her contribution pushes it higher, but the *state* of "violating" is unchanged. But is pushing it higher "making a difference"? Yes, it makes it *worse*.
      *   *Need stronger overdetermination:* The harm must be binary or saturated.
      *   *Alternative:* A server room cooling system. If temp > 30C, servers degrade. It's currently 35C due to AC failure. A technician turns off a secondary fan to save energy. The temp stays 35C. The harm (degradation) happens regardless.
      *   *Is turning off the fan "wrong"?* Yes, violates protocol, risks making it harder to cool later.
      *   *Is it a joint practice?* Yes, maintaining infrastructure.
      *   *Is there a diffuse harm?* Yes, system reliability risk.
      *   *Let's try the "Culture of Compliance" angle.*
      *   *Scenario:* In a nuclear facility, staff must wear dosimeters. The harm is "normalization of deviance" leading to future accidents. A worker leaves their dosimeter in the locker. The safety culture is already so degraded that one more violation doesn't change the statistical risk profile for the year (the "harm" is the aggregate risk level, which is determined by large-scale trends).
      *   *Critique:* Hard to prove "no difference" to risk profile without probabilistic reasoning.
      *   *Let's go back to the Threshold Case with Saturation.*
      *   *Scenario:* A municipal water treatment facility uses a coagulant to remove sediment. The harm is "cloudy water delivered to residents," which occurs only if sediment levels exceed 5 NTU. Due to a storm, incoming sediment is so high that even with all coagulant added, the output will be 10 NTU. A tired operator skips adding their shift's batch of coagulant. The output remains 10 NTU. The residents receive cloudy water either way. The operator violated protocol.
      *   *Check:* Is skipping the coagulant wrong? Yes, it's a violation of duty within a joint practice. Is it a difference maker to the harm (cloudy water)? No, the water is cloudy either way.
      *   *Wait:* Does it make the water *cloudier*? If I skip coagulant, sediment might be 11 NTU instead of 10 NTU. Is 10 vs 11 a difference in harm? If the harm is defined as "exceeding 5 NTU," then no. If the harm is "amount of sediment," then yes.
      *   *Constraint:* "not a difference maker for the harm." I need to define the harm such that the act doesn't change it.
      *   *Definition of Harm:* "The event of the water being undrinkable." If it's undrinkable at 10 NTU and 11 NTU, then she didn't make a difference to *that* harm.
      *   *Better:* The "Joint Practice" is maintaining the integrity of the safety protocol. The harm is "breach of protocol integrity."
      *   *Let's try a specific "Overdetermined Outcome" scenario.*
