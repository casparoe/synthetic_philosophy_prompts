      *Wait, I need to ensure the "no difference" is robust.* If the fan was off, maybe it goes to 42C? I need to specify the temp stays the same or the harm is binary and already triggered.
      *Let's use the "Threshold" model explicitly.*
      *Harm:* "Triggering the emergency shutdown."
      *Condition:* Shutdown triggers at >100 units of load.
      *Current Load:* 105 units (due to others).
