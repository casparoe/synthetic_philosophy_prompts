  8.  **Final Polish:** Ensure the tone is seminar-appropriate.

      *Wait, one constraint check:* "no expected utility reasoning." This means I cannot argue "she shouldn't do it because there's a chance the server comes back online." I must stipulate the server is definitively dead for the shift.
      *Also:* "no if-everyone-did-it." I cannot argue "if everyone skipped signatures, the system would collapse." I must argue *her* act is wrong *now*.
      *The justification for wrongness:* Complicity/Participation in a corrupted practice. She is treating the rule as optional when it is constitutive of her role.

      *Defender's Objection:* They will say "Responsibility tracks control. No control over outcome = no responsibility for outcome." They might concede she is "blameworthy for rule-breaking" but deny she is "responsible for the harm." The case needs to show she is responsible *for the harm* (or the wrong related to the harm) despite no causal link.
      *Actually, the prompt asks to separate "making a difference to a collective harm" and "being responsible for your role... that produces the harm."*
      *So the defender says: "You aren't responsible for the harm because you didn't make a difference."*
