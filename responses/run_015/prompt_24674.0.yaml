  4.  **Drafting the Analysis:**
      *   **Why not a difference maker:** The outcome (decertification) is overdetermined by the prior error. Her act doesn't change the binary outcome.
      *   **Why still responsible:** She violated a duty inherent to her role in the joint practice (the protocol). The wrongness lies in the breach of the normative structure, not the causal consequence.
      *   **Defender's Objection:** They might argue "Complicity requires causal contribution." Or "If the outcome is fixed, the duty dissolves."
      *   **Key Feature:** The *binary nature of the harm* combined with *prior overdetermination*.
      *   **Collapse:** If the harm is gradual (cumulative), then she *did* make a difference (made it worse). So the binary threshold is crucial.

  5.  **Refining the Scenario for Maximum Impact:**
      *   Make sure the "harm" is clearly collective/diffuse. "Regulatory decertification" affects public trust/safety broadly.
      *   Ensure the "no difference" is absolute.
      *   Ensure the "wrong" is clear (violating a constitutive rule of the practice).

      *Revised Scenario:*
      In a regional blood bank, safety protocol dictates that every batch of donated plasma must be logged by two separate technicians to ensure traceability, a practice designed to maintain systemic public trust in the supply chain. Due to a server crash earlier in the shift, the digital ledger for the entire day's collections was corrupted, rendering traceability impossible for all batches regardless of subsequent actions. A senior technician, aware that the day's traceability is already lost, processes a new batch alone rather than waiting for a second signature, violating the dual-authorization rule. The systemic harm—the loss of public trust and regulatory compliance for that day's supply—is already fixed by the server crash; her solitary signature would not have restored the ledger, nor would her violation worsen the traceability status which is already zero.

      *Check:*
      *   One paragraph? Yes.
      *   Realistic? Yes.
      *   Diffuse harm? Yes (public trust/compliance).
      *   No single victim? Yes.
      *   No expected utility? Yes (we know the ledger is dead).
      *   No "if everyone"? Yes.
      *   No exotic physics? Yes.
