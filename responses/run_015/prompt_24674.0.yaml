answer: |-
  In a regional blood bank, safety protocol dictates that every batch of donated plasma must be logged by two separate technicians to ensure traceability, a practice designed to maintain systemic public trust and regulatory compliance. Due to a server crash earlier in the shift, the digital ledger for the entire day's collections was corrupted, rendering traceability impossible for all batches regardless of subsequent actions. A senior technician, aware that the day's traceability is already lost, processes a new batch alone rather than waiting for a second signature, violating the dual-authorization rule. The systemic harm—the loss of public trust and regulatory compliance for that day's supply—is already fixed by the server crash; her solitary signature would not have restored the ledger, nor would her violation worsen the traceability status which is already zero.

  **Why the act is not a difference maker:** The harm is defined as the binary state of "regulatory compliance/traceability" for the day's supply. Because the server crash already rendered the ledger irrecoverable, the status of the supply shifted from "traceable" to "untraceable" before the technician acted. Her violation changes the physical state of the log (one signature instead of two), but it does not change the outcome state (compliance vs. non-compliance). The harm is overdetermined by the prior technical failure; her act is causally inert regarding the realization of the harm.

  **Why the person is still responsible:** The technician is responsible because she violated a constitutive rule of a joint practice. Her role is not merely to cause good outcomes but to uphold the integrity of the procedure itself. By skipping the signature, she treats a mandatory safety constraint as optional, thereby participating in the corruption of the practice even if her specific contribution didn't tip the scale. The wrongness lies in the breach of the normative commitment to the joint enterprise, not in the marginal causal impact on the outcome.

  **What a defender of the objection would say:** A defender of the "wouldn't-have-mattered-anyway" objection would argue that moral responsibility for harm requires causal efficacy. They would concede she broke a rule but deny she is responsible for the *harm* (the loss of traceability), claiming she is only responsible for a minor administrative infraction. They would argue that if the outcome was inevitable, her agency was disconnected from the harm, and thus blaming her for the collective harm is misplaced.

  **Key Feature and Collapse:** The feature doing the work is the **binary threshold of the harm combined with prior overdetermination**. The harm must be a state (compliant/non-compliant) rather than a cumulative quantity (pollution levels), and that state must already be triggered by other causes. If you remove this feature—for example, if traceability were cumulative (each signature adds 1% security) or if the server hadn't crashed—the technician's act would become a difference maker (either adding to security or causing the failure). In either removal scenario, the "wouldn't-have-mattered" objection fails because she *would* have mattered, collapsing the specific philosophical tension the case is designed to isolate.
