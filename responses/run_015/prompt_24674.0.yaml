      *So the case must show she is responsible for the *harm* (in a non-causal sense) or that the objection fails to exonerate her.*
      *Better:* The objection says "You aren't responsible because you didn't make a difference." The case shows "You are responsible (clearly doing wrong) even though you didn't make a difference."
      *So the "wrong" is the proxy for "responsibility."*

      *Key Feature:* The **constitutive nature of the rule**. The rule isn't just a tool to prevent harm; it defines the practice. Violating it is a wrong independent of marginal causal impact.
