      *   *Critique:* Does adding one file add no risk? Maybe it makes recovery slightly harder/easier?
      *   *Let's try the "Pollution Threshold" again but stricter.*
      *   *Scenario:* A factory emits a non-cumulative pollutant that causes fish kills only when concentration exceeds 100ppm. Today, a upstream chemical spill has already raised the river concentration to 150ppm at the factory's outflow point. The factory's safety protocol requires scrubbing emissions to zero. The shift supervisor, knowing the river is already lethally toxic, bypasses the scrubber to save wear on the machine. The river concentration remains 150ppm (the factory's contribution is negligible compared to the spill, or the spill saturates the effect).
