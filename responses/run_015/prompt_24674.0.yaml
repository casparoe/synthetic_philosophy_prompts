      *   *Collapse:* If the harm is cumulative (e.g., pollution levels), her act adds to the total, making her a difference maker in degree. If the threshold wasn't already crossed, she would be a difference maker. So yes, removing the binary/overdetermined feature collapses the case.

  7.  **Final Review against Constraints:**
      *   "No expected utility reasoning": I must ensure I don't argue "she shouldn't do it because it might set a bad precedent." The wrongness must be intrinsic to the act/practice relation.
      *   "No if-everyone-did-it": The analysis must not rely on universalization.
      *   "Strongest sense": The act *does not change the outcome*.
      *   "Diffuse collective harm": Public trust/regulatory status fits well.

