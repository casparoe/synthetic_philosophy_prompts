      *   *Need:* The harm is binary and already triggered.
      *   *Scenario:* A fire suppression system in a data center requires two keys to turn off. The harm is "system vulnerability." The system is already vulnerable because Key A is missing. The supervisor leaves Key B out on the desk instead of locking it up. The system is vulnerable either way.
      *   *Is that a "collective harm"?* It's more of a safety violation.
      *   *Let's focus on "Complicity in a Joint Practice."*
      *   *Scenario:* In a corporate accounting department, quarterly reports require dual authorization to prevent fraud. The harm is "erosion of internal controls," which allows fraud to occur undetected. Due to a software glitch, the authorization log for this quarter is already corrupted and unreadable, meaning no audit trail exists regardless of signatures. A manager, knowing the log is broken, signs off on a subordinate's report without reviewing it, violating the "review before sign" rule. The internal control is already broken; her failure to review changes nothing about the audit trail's availability.
      *   *Check:* Is she wrong? Yes, she violated the duty of review. Did she make a difference to the harm (broken audit trail)? No, the glitch did that.
      *   *Is the harm "diffuse collective"?* Yes, erosion of controls.
      *   *Is it "no single victim"?* Yes.
      *   *Is it "no expected utility"?* Yes, we know the log is broken.
      *   *Is it "no if-everyone"?* Yes, this is about her act now.
      *   *Refining the "Harm":* The harm is "the state of having no audit trail."
      *   *Wait, does her act contribute to the "culture"?* That might be expected utility (future harm). I need to block that.
      *   *Focus:* The wrongness is *participation in a corrupted practice*, not the outcome.
      *   *Let's try the "Wastewater Threshold" again, it's usually the clearest for "no difference."*
