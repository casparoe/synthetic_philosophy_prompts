      *Is it a difference maker to the shutdown?* No.
      *Is it a difference maker to the *stress*?* Yes. I need to define harm as the shutdown event, not the stress.
      *Better:* The harm is "violating the safety limit." The limit is already violated.
      *Actually, the prompt asks for "collective harm."*
      *Let's go with the "Toxic Lake" but define harm as "The lake being legally classified as toxic."*
      *Scenario:* A chemical plant discharges into a river. The river is legally classified as "contaminated" (triggering fishing bans) if toxin levels exceed 100ppm. Due to a spill upstream, levels are currently 105ppm. The plant's protocol mandates zero discharge during spills. The shift manager authorizes a standard discharge of 1ppm. The level rises to 106ppm. The river remains "contaminated" regardless. The fishing ban remains in place regardless. No single fisherman is identifiable as harmed specifically by this 1ppm.
      *Is this "no difference maker"?* It makes the water dirtier, but not the *status* of the harm (the ban/toxicity classification).
      *To make it stronger:* The toxin degrades instantly above 100ppm? No, unrealistic.
      *Let's try the "Audit/Compliance" angle again. It fits "joint practice" better.*
      *Scenario:* In a pharmaceutical lab, safety protocols require two scientists to verify waste disposal logs to prevent environmental contamination. The harm is "regulatory decertification," which occurs if *any* verification step is missed in a quarterly audit. Due to a clerical error earlier in the week, a previous verification step was already missed, guaranteeing decertification. A scientist, knowing the decertification is inevitable, skips their required verification signature on a harmless saline disposal log. The decertification outcome is unchanged. The environmental risk from this specific log is nil.
      *Check:* Is she wrong? Yes, violated protocol. Difference maker? No (decertification already guaranteed). Realistic? Yes.
