answer: |-
  ### Room Scan: The Three Camps

  1.  **The Appiah Internalists:** They believe honor codes die when the community stops granting social recognition to the virtue. They'll argue your "bureaucracy" is just a downstream symptom of the sentiment already rotting. If the neighbors still cared, the bureaucracy wouldn't stick.
  2.  **The Williams Coherence Theorists:** They focus on how honor fits into a "meaningful life." They'll worry you're treating honor as external machinery rather than internal gravity. They'll press whether "procedural hollowing" reduces the duelist to a rational actor weighing state penalties rather than a moral agent protecting integrity.
  3.  **The Empirical Skeptic (The Historian):** They know the *Code Napoléon* revisions and the police prefecture logs. They don't care about the philosophy of verification; they care that dueling frequencies in France often spiked *after* bureaucratic expansions. They are the kill switch.

  ### Opening Concession

  Start by conceding to Appiah that the *content* of honor shifted (from martial bravery to civic reliability). Tell them you aren't arguing bureaucracy changed their minds, but that it changed the *conditions of satisfaction*. You need the room to accept that honor is performative, not just sentimental. If the performance cannot be staged due to procedural interference, the sentiment loses its object.

  ***

  ### Q&A Prep Sheet: Six Objections Ordered by Damage

  #### 1. The Historian's Timing Trap (The "Prayer Nobody Asks")
  **Objection:** "You claim procedural hollowing killed dueling via state verification monopolies, but in France, the bureaucratic apparatus solidified post-1830, yet duel frequency peaked in the 1880s. If the state made honor-claims unverifiable, why did the practice intensify fifty years after the procedure was installed?"

  **Reply:** "That lag is precisely where **procedural hollowing** does its work, not as an immediate ban but as a gradual erosion of performative force. Initially, the bureaucracy was porous; elites could still treat police reports as mere formalities. But over those fifty years, the state successfully reclassified the *verification* of insult from a peer-witnessed event to a litigable administrative fact. By the 1880s, the duel wasn't dying because people stopped caring, but because the ritual no longer settled the claim. The state didn't stop the fight; it made the outcome irrelevant to the legal record. The spike you see is the honor culture thrashing against a verification system that had already rendered its verdicts technically void."

  **Soft Spot:** You are relying on a qualitative shift in 'relevance' that is hard to quantify against raw duel counts. If the historian has data showing 1880s duelists successfully restored reputation via duels despite the bureaucracy, your 'hollowing' claim collapses.

  #### 2. The Appiah Sentimentalists
  **Objection:** "Aren't you just describing the mechanism of a value shift? If the community stops validating the duel, isn't that just the honor code changing content? Why posit 'procedural hollowing' as a distinct causal force rather than just the social script updating?"

  **Reply:** "Because scripts can persist even when validation fails, provided the performance remains possible. **Procedural hollowing** argues that the state didn't change the script; it broke the stage. Appiah focuses on the internalization of norms, but **procedural hollowing** targets the external verification conditions required to make those norms public. A duelist in 1890 still felt the honor obligation (the script remained), but the state's monopoly on witness testimony meant the duel could no longer function as a truth-procedure. The sentiment survived, but the mechanism for vindicating it was technically unverifiable within the new civic framework."

  **Soft Spot:** Hard to disentangle the 'broken stage' from the 'changed script.' If the audience stops clapping, does it matter if the stage is broken? You risk overstating the structure vs. culture divide.

  #### 3. The Williams Rationalism Smuggle
  **Objection:** "This sounds like rational progress in disguise. You're saying the state's rational bureaucracy outcompeted the irrational honor code. Isn't this just Williams-style coherence winning out through administrative efficiency?"

  **Reply:** "No, because **procedural hollowing** isn't about rationality winning; it's about incompatibility of verification regimes. The state wasn't 'more rational'; it was just monopolistic. **Procedural hollowing** occurs when two systems claim the authority to verify truth—the honor code via blood, the state via paper—and the state simply refuses to recognize the former's data. It's not that duelists became rational; it's that their performative acts ceased to generate public facts. The state didn't convince them; it made their truth-claims unintelligible to the legal record."

  **Soft Spot:** You walk a fine line between 'unintelligible' and 'irrational.' If the state's verification is just 'stronger,' you're back to rational progress. You must insist it's about *jurisdiction*, not truth.

  #### 4. The Reductionist Charge
  **Objection:** "Are you reducing honor to a mere interest calculation? If I avoid a duel because the paperwork is too hard, haven't I just traded honor for prudence? Doesn't this dissolve the moral phenomenon you're trying to explain?"

  **Reply:** "Not prudence, but impossibility. **Procedural hollowing** doesn't suggest the duelist weighed costs; it suggests the honor-claim itself became technically unverifiable. If I cannot prove my honor because the state invalidates my witnesses, I haven't chosen prudence over honor; I've been stripped of the means to enact honor. The moral phenomenon remains, but the channel for its expression is clogged. **Procedural hollowing** preserves the moral weight of honor while explaining its extinction via structural suffocation, not moral conversion."

  **Soft Spot:** Philosophers love counterfactuals. If a duelist *could* have dueled but chose not to due to bureaucracy, isn't that a choice? You need to hold hard on the 'unverifiable' claim.

  #### 5. The Phenomenological Gap
  **Objection:** "Does this account capture the lived experience? Duelists often knew the legal risks and dueled anyway. If the procedure was hollowed, why did they still feel the compulsion to act?"

  **Reply:** "Because **procedural hollowing** is a structural condition, not necessarily a conscious one. The duelist feels the compulsion because the honor code remains internalized, but the act fails to achieve its social end. They are acting within a hollowed procedure. The compulsion persists, but the performative force is lost. They are shouting into a void created by bureaucratic verification monopolies. The tragedy of the late-era duelist is exactly this: acting out a script that the world no longer has the technical capacity to validate."

  **Soft Spot:** If they felt the compulsion and the community still respected them for it (despite the law), was the procedure actually hollowed? You need evidence that the community stopped respecting the duel *because* of the procedure.

  #### 6. The Comparative Exception (US South)
  **Objection:** "The US South had strong bureaucracy and state monopolies on violence post-Civil War, yet dueling persisted. How does **procedural hollowing** explain regional variance if bureaucracy is the cause?"

  **Reply:** "**Procedural hollowing** requires the state's verification monopoly to be legitimate and operational. In the US South, the bureaucracy was often complicit or weak regarding honor crimes; the verification regime remained local, not state-level. **Procedural hollowing** didn't occur there because the state failed to impose its verification standards over the local honor courts. The mechanism holds: where the state successfully monopolized verification (France), dueling died. Where it failed to hollow the procedure (US South), dueling persisted. It confirms the theory."

  **Soft Spot:** This relies on a specific reading of Southern legal enforcement that the Historian might contest. If Southern courts *did* prosecute and dueling continued, your theory takes a hit.

  ***

  Verdict: Your weakest reply survives the historian's follow-up only if you can prove the 1880s duels were socially regarded as "private squabbles" rather than public vindications.
