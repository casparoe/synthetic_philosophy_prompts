prompt: |-
  I teach a 90-minute session in a third-year undergraduate Philosophy of Law seminar — 18 students, mostly philosophy majors with a handful of pre-law students, none of whom has read a judicial opinion. The slot next week is statutory interpretation, and I want to do textualism versus purposivism. Last time I ran it I opened with the no-vehicles-in-the-park chestnut and it flopped: everyone had an intuition, nobody could say why, and forty minutes later we were at it depends on the judge. So I want them to build the problem rather than react to it, and I want the two words textualism and purposivism to stay out of the room until the last fifteen minutes.

  Here is what I have in mind, which I would like you to finish, correct, or replace. Phase one: six committees of three, each handed a card describing a concrete mischief their statute is supposed to stop, each required to write one sentence of no more than thirty words, and each required to write the mischief on the back of the card and seal it. Phase two: I collect the sentences and deliberately mangle them — swapping a word between two committees, or stapling two committees' sentences together into one enactment, or building one statute out of two committees whose aims were partly opposed — so that the enacted text is not the transparent expression of anyone's purpose. Phase three: the class splits into two rooms of nine. One room gets the enacted text and nothing else; the other gets the text plus the mischief cards and is told to decide by what the law was trying to do and not to be stopped by the wording. Both rooms work through the same short stack of cases: one that is squarely inside both the text and the mischief, one the text plainly covers but the mischief doesn't reach, one the mischief plainly covers but the text doesn't, one arising under the compromise statute where there is no single purpose to consult, and one involving a way of causing the harm that did not exist when the statute was written. Nobody is scored for reaching the right outcome; rooms are scored for predicting what the other room will do, and at the end the text-only room is asked to write down what it thinks the mischief was so we can see how recoverable purpose is from words alone.

  What I would like from you: the thing made runnable. Give me the statute texts and the case cards written out and ready to print, the exact wording of each committee's mischief card and of the instructions to each room, a minute-by-minute timeline for the ninety minutes including a buffer, and the scoring sheet. Then a debrief that maps specific moments in the session onto specific parts of the dispute — over-inclusion, under-inclusion, the plurality or absence of purpose, unforeseen applications, and the point that the interesting question may not be about meaning at all but about which institution should get to correct a mistake, and about what a citizen can find out in advance. Tell me what will predictably go wrong the first time I run this: my main worries are that the drafting phase overruns, that students in the text-only room cannot unsee the purpose once they have written it, that someone demands the correct answer and stalls the room, and that students confuse disliking an outcome with disliking a method. And be frank about what the exercise cannot reproduce — I assume it cannot reproduce the base rate of easy cases, the constraint that precedent and the canons of construction put on both methods, the epistemic position of a judge who does or does not have genuine legislative history, and the fact that textualists themselves disagree about whether meaning is fixed at enactment or tracks current usage; say which of these I have to supply in lecture, and whether a short variant run twice with the same statute decades apart would be worth the time or just confusing.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute Philosophy of Law seminar, 3rd-year undergrads (18 students, mix of philosophy/pre-law), no prior experience reading judicial opinions.
      *   **Topic:** Statutory Interpretation (Textualism vs. Purposivism).
      *   **Constraint:** Do not use the terms "textualism" or "purposivism" until the last 15 minutes. Move from intuition-building to theory.
      *   **Current Idea:** A three-phase simulation (Drafting -> Mangling -> Adjudicating).
      *   **Specific Needs:** Runnable materials (statutes, case cards, instructions, timeline, scoring), a debrief script mapping exercise moments to theoretical concepts, a "predictable failures" analysis, and an assessment of what the exercise *cannot* teach (and how to supplement).
      *   **Tone:** Professional, pedagogical, frank, practical.

  2.  **Evaluate the User's Proposal:**
      *   *Strengths:* Active learning, avoids initial jargon, creates genuine conflict between text and purpose, gamification (predicting the other room) reduces stakes on "rightness."
      *   *Weaknesses/Risks:*
          *   **Time:** 90 minutes is tight for 3 phases + debrief. Drafting by 6 committees might take too long.
          *   **Complexity:** "Mangling" the statutes live might be chaotic or produce nonsense that breaks the simulation.
          *   **Cognitive Load:** Students need clear instructions. Splitting rooms requires logistics.
          *   **The "Mischief" Leak:** Text-only room might infer purpose too easily if the text is too clear, or too hard if it's gibberish.
          *   **Debrief:** Needs to connect specific game mechanics to legal theory without being preachy.

  3.  **Refine the Design (The "Runnable" Version):**
      *   *Phase 1 (Drafting):* Needs to be faster. Instead of 6 unique statutes, maybe 3 pairs working on similar topics but different specific mischiefs? No, the user's idea of *mangling* them together is the key insight. Let's keep 6 committees but simplify the drafting task. Give them the "Mischief" pre-written to save time. They just draft the text.
      *   *Phase 2 (Mangling):* The instructor needs to do this *during* a break or while students are moving, or pre-prep some of it to ensure quality. Actually, doing it live is theatrical but risky. Better: Instructor collects cards, takes 5 minutes to "enact" while students grab coffee/stretch, or pre-prepare the "Enacted Statute" based on likely student output. *Decision:* To ensure the class runs smoothly, I will advise the instructor to pre-draft the "Enacted Statute" based on the *structure* of the exercise, but use the students' actual mischief cards to populate the "Legislative History" packet. This guarantees the text/purpose conflict works. *Correction:* The user wants them to build the problem. I will suggest a hybrid: Students draft, but the Instructor has a "Master Statute" ready to swap in if student drafting fails, or simply edits the student text rapidly. Let's stick to the user's spirit: Instructor edits live.
      *   *Phase 3 (Adjudication):* Splitting rooms is logistically heavy. Can we do it in one room? Yes, Left side vs. Right side. But "split rooms" prevents hearing the other side's reasoning until the reveal. I'll keep the split room idea but simplify it to "Side A / Side B" of the same classroom with a "no talking" rule to save transition time.
      *   *Case Cards:* Need to be specific enough to trigger the conflicts (Over/Under inclusion, etc.).

  4.  **Drafting the Materials:**
      *   *Mischief Cards:* Need to be diverse (safety, noise, aesthetics, commerce).
      *   *Enacted Statute:* Needs to be ambiguous enough to support both readings.
      *   *Case Cards:* 5 specific scenarios as requested.
      *   *Instructions:* Clear, distinct for Group A (Text) and Group B (Purpose).
      *   *Timeline:* Strict minute-by-minute.
      *   *Scoring:* Simple tally.

  5.  **Developing the Debrief:**
      *   Map the 5 cases to: Core meaning, Over-inclusion, Under-inclusion, Compromise/Plurality, Evolution/Technology.
      *   Connect to Institutional Competence (Who fixes mistakes?) and Fair Notice (What can citizens know?).
      *   Introduce terms "Textualism" and "Purposivism" here.

  6.  **Addressing "Predictable Failures":**
      *   Drafting overrun: Mitigation (Pre-written mischiefs, strict timer).
      *   Unseeing purpose: Mitigation (Emphasize the rule "Text Only" strictly).
      *   "Right Answer" demand: Mitigation (Scoring based on prediction, not outcome).
      *   Method vs. Outcome: Mitigation (Debrief question).

  7.  **Addressing "What the Exercise Cannot Reproduce":**
      *   Easy cases (Exercise focuses on hard ones).
      *   Precedent/Canons (Too complex for 90 mins).
      *   Legislative History reality (Students *are* the legislature, so they know the history too well).
      *   Fixed vs. Evolving meaning (Need to lecture this).
      *   *Recommendation:* Lecture supplement needed. Variant run (decades apart) is probably too confusing for one session, better as a hypothetical in lecture.

  8.  **Review and Refine:**
      *   *Check:* Did I leave the terms out until the end? Yes.
      *   *Check:* Is it 90 minutes? The timeline looks tight. I need to cut the drafting time. 10 minutes for 6 committees to draft is 1.5 mins per committee. That's very fast. I will suggest providing the Mischief *on the card* so they don't brainstorm the mischief, just the text.
      *   *Check:* Is the "Mangling" feasible? I will advise the instructor to have a backup "Enacted Text" prepared in case student drafting is too uniform.
      *   *Check:* Scoring. Predicting the other room is brilliant. It forces theory of mind.

  9.  **Final Polish:**
      *   Ensure tone is supportive but critical (as requested: "frank about what the exercise cannot reproduce").
      *   Format for printability (clear headers, bold text).

  *(Self-Correction during drafting)*: Wait, splitting the class into two *rooms* might be logistically impossible depending on the building. I will suggest "Two Zones" in one room to save transition time, but maintain the information barrier.
  Actually, the prompt says "splits into two rooms." I should respect that if possible, but warn about time loss. I'll suggest "Two Zones" as a time-saving alternative but provide instructions for "Two Rooms" as requested. Let's stick to "Two Zones" in the timeline to ensure the 90-minute cap is met, noting that physical separation is better if time permits.
  *Re-evaluation:* The user specifically said "Two rooms." I will keep that but warn heavily about transition time. I'll build a 5-minute buffer into the timeline.

  *Refining the Statute:* The "No Vehicles in the Park" is banned by the user. I need a new subject. "Public Safety in the Plaza" or "Noise in the Library." Let's go with "Use of the Commons." It allows for physical objects, activities, etc.
  Actually, let's use a "University Commons" setting. It's relatable.
  Mischief examples: Skateboards damaging tiles, Drones invading privacy, Flash mobs blocking paths, Food waste attracting rats.
  Enacted Text: "No mechanical devices or organized gatherings shall operate in the Commons between 8 AM and 10 PM." (Simple, but ambiguous).

  *Wait, one more thing:* The user wants the *students* to write the text. I need to make sure the "Mangling" phase results in a coherent but conflicted statute. I will provide the Instructor with a "Mangling Script" to ensure the output is usable.

  *Final check on the "Predictable Failures":* The user listed specific worries. I need to address each one specifically.

  *Final check on "What it cannot reproduce":* I need to be specific about what requires lecture follow-up.

