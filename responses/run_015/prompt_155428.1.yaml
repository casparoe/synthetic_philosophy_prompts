answer: |-
  This is a sophisticated pedagogical design. It correctly identifies that students grasp *conflict* better than *definition*. By forcing them to inhabit the roles of drafter and adjudicator before naming the theories, you avoid the "label-matching" trap.

  However, 90 minutes is extremely tight for three phases of active simulation plus a robust debrief. The "Mangling" phase is the highest risk point: if the resulting statute is gibberish, the adjudication fails; if it is too clear, the conflict vanishes.

  Below is the runnable kit. I have tightened the drafting phase to prevent overruns and provided a "Safety Net" statute for you to use if student drafting is too homogeneous.

  ### I. Materials for Printing

  #### A. Committee Mischief Cards (Print 6, cut apart)
  *Hand one to each committee of three. Do not let them share.*

  > **COMMITTEE 1**
  > **The Mischief:** Electric scooters are speeding through pedestrians and scratching the pavement.
  > **Task:** Write **one sentence** (max 30 words) banning this. Do not write "scooters." Describe the *harm* or the *object* generally.
  > **Back of Card:** Write "Mischief: Scooters/Pavement" and seal it in the envelope provided.
  >
  > **COMMITTEE 2**
  > **The Mischief:** Commercial drone photography is invading student privacy in the courtyard.
  > **Task:** Write **one sentence** (max 30 words) banning this. Do not write "drones."
  > **Back of Card:** Write "Mischief: Drones/Privacy" and seal it in the envelope provided.
  >
  > **COMMITTEE 3**
  > **The Mischief:** Flash mobs and protest groups are blocking walkways during class changes.
  > **Task:** Write **one sentence** (max 30 words) banning this. Do not write "protests."
  > **Back of Card:** Write "Mischief: Crowds/Blockage" and seal it in the envelope provided.
  >
  > **COMMITTEE 4**
  > **The Mischief:** Food vendors are leaving grease traps that attract rats and smell.
  > **Task:** Write **one sentence** (max 30 words) banning this. Do not write "food."
  > **Back of Card:** Write "Mischief: Grease/Rats" and seal it in the envelope provided.
  >
  > **COMMITTEE 5**
  > **The Mischief:** Students are camping overnight in the Commons, creating fire hazards.
  > **Task:** Write **one sentence** (max 30 words) banning this. Do not write "camping."
  > **Back of Card:** Write "Mischief: Sleeping/Fire" and seal it in the envelope provided.
  >
  > **COMMITTEE 6**
  > **The Mischief:** Amplified music is disrupting lectures in nearby buildings.
  > **Task:** Write **one sentence** (max 30 words) banning this. Do not write "music."
  > **Back of Card:** Write "Mischief: Noise/Disruption" and seal it in the envelope provided.

  #### B. The Enacted Statute (Instructor Copy)
  *Collect the student cards. While students move to their rooms (Phase 3), assemble this. If student sentences are too similar, use the **Backup Statute** below.*

  **The "Commons Regulation Act" (Enacted Text)**
  > "No mechanical devices, organized gatherings, or commercial substances shall be operated, maintained, or distributed in the University Commons between the hours of 8:00 AM and 10:00 PM."

  *(Note: This combines the inputs but creates ambiguity. Is a wheelchair a mechanical device? Is a study group an organized gathering? Is a single sandwich a commercial substance?)*

  #### C. Adjudication Packets (Print 2 Versions)

  **PACKET A: FOR THE TEXT ROOM (9 Students)**
  > **RULES OF ENGAGEMENT**
  > 1. You are the Court. You have **only** the Enacted Statute above.
  > 2. You are **forbidden** from speculating on why the law was written.
  > 3. You must decide the 5 Cases below based **strictly** on the ordinary meaning of the words.
  > 4. **Scoring:** You get 1 point for every Case where your verdict matches the verdict of the Purpose Room. You get 2 points if you correctly predict *their* verdict before they reveal it.
  >
  > **THE CASES**
  > *   **Case 1 (The Core):** A student rides an electric skateboard through the Commons at 2 PM.
  > *   **Case 2 (Text Yes / Purpose No):** A disabled student uses a motorized wheelchair at 2 PM.
  > *   **Case 3 (Text No / Purpose Yes):** A group of 50 students stands silently holding signs, blocking the path at 2 PM.
  > *   **Case 4 (The Compromise):** A student eats a sandwich bought from a campus cafeteria at 2 PM. (Committee 4 wanted to stop grease traps; Committee 6 wanted to stop noise; the text says "commercial substances").
  > *   **Case 5 (The Future):** A student operates a holographic projector that creates noise and light but uses no "mechanical device" as understood today.

  **PACKET B: FOR THE PURPOSE ROOM (9 Students)**
  > **RULES OF ENGAGEMENT**
  > 1. You are the Court. You have the Enacted Statute **PLUS** the Sealed Mischief Cards (Legislative History).
  > 2. You must decide the 5 Cases based on **what the law was trying to achieve**, even if the words are imperfect.
  > 3. **Scoring:** You get 1 point for every Case where your verdict matches the verdict of the Text Room. You get 2 points if you correctly predict *their* verdict before they reveal it.
  >
  > **THE CASES**
  > *(Same 5 Cases as Packet A)*
  >
  > **THE EVIDENCE**
  > *(Hand them the 6 Sealed Envelopes from Phase 1. They may open them.)*

  #### D. Scoring Sheet (Project on Board or Handout)

  | Case | Text Room Verdict (Yes/No Liability) | Purpose Room Verdict (Yes/No Liability) | Match? (1 pt) | Prediction Correct? (2 pts) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. Skateboard | | | | |
  | 2. Wheelchair | | | | |
  | 3. Silent Protest | | | | |
  | 4. Sandwich | | | | |
  | 5. Hologram | | | | |
  | **Total** | | | | |

  ---

  ### II. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:05 (Intro):** No theory. Explain the simulation. "You are the Legislature."
  *   **00:05 – 00:15 (Phase 1: Drafting):** 6 Committees draft their sentences and seal the mischief cards. *Instructor circulates to ensure they don't write the specific noun (e.g., 'scooter') in the text.*
  *   **00:15 – 00:25 (Phase 2: Enactment):** Collect cards. **Critical Moment.** Take the cards to the podium. Read the student texts aloud. Then, announce: "To pass the bill, we must compromise." Read the **Enacted Statute** (prepared by you, based on their inputs). Explain that the text is now the *only* law, but the envelopes contain the *history*.
  *   **00:25 – 00:30 (Transition):** Split class into two groups (Room A / Room B or Zone A / Zone B). Hand out Packets.
  *   **00:30 – 00:55 (Phase 3: Adjudication):** Groups work through the 5 cases. They must record their verdicts *and* predict the other group's verdict. *Instructor floats between rooms to answer procedural questions only.*
  *   **00:55 – 01:05 (The Reveal):** Bring class together. Reveal verdicts case-by-case. Tally scores. Ask Text Room: "Based on the text alone, what did you think the Mischief was?" Compare to actual envelopes.
  *   **01:05 – 01:25 (Debrief):** Map the exercise to theory (Script below). Introduce terms "Textualism" and "Purposivism."
  *   **01:25 – 01:30 (Buffer/Exit):** Q&A and assignment.

  ---

  ### III. The Debrief Script (Mapping Moments to Theory)

  *Do not lecture. Ask these specific questions to draw the theory out of them.*

  **1. Over-Inclusion (Case 2: The Wheelchair)**
  *   **Ask Text Room:** "Did the text cover the wheelchair?" (Yes, 'mechanical device'). "Did you want it to?" (No).
  *   **Ask Purpose Room:** "Did you let the wheelchair off the hook?" (Yes). "Why?" (Because the mischief was scooters/speed, not mobility).
  *   **Concept:** This is **Over-Inclusion**. Textualism risks capturing conduct the legislature didn't mean to stop. Purposivism risks rewriting the law to fit the judge's view of fairness.
  *   **Theory Drop:** "Textualists call this the 'letter vs. spirit' problem. Purposivists call this 'correcting drafting errors.'"

  **2. Under-Inclusion (Case 3: The Silent Protest)**
  *   **Ask Purpose Room:** "The mischief was blocking walkways. Did the text cover silent protesters?" (No, not 'organized gatherings' or 'mechanical'). "Did you punish them anyway?"
  *   **Ask Text Room:** "Did you let them go?" (Yes). "Even though they caused the exact harm the law wanted to stop?"
  *   **Concept:** This is **Under-Inclusion**. Language is finite; mischief is infinite.
  *   **Theory Drop:** "If you punish the protester, you are acting like a legislature. If you let them go, you are acting like a machine."

  **3. Plurality of Purpose (Case 4: The Sandwich)**
  *   **Ask Both:** "Was there a single purpose here?" (No, Committees 4 and 6 wanted different things). "The text says 'commercial substances.'"
  *   **Concept:** **The Compromise Problem**. Statutes are often coalitions of conflicting aims.
  *   **Theory Drop:** "Purposivism assumes a single 'purpose.' Textualism says if the compromise resulted in vague words, the citizen gets the benefit of the doubt."

  **4. Unforeseen Applications (Case 5: The Hologram)**
  *   **Ask Both:** "Who has the authority to update this law for new technology?"
  *   **Concept:** **Dynamic vs. Static Meaning**.
  *   **Theory Drop:** "Does 'mechanical device' include things that didn't exist when the law was written? Textualists often say 'no, go back to Congress.' Purposivists say 'yes, apply the underlying principle.'"

  **5. The Institutional Question (The Core Philosophical Point)**
  *   **Ask:** "Who had a harder time? Text Room or Purpose Room?"
  *   **Ask:** "If you were a student walking through the Commons, which Room's method helps you plan your day better?" (Text Room = Fair Notice).
  *   **Ask:** "If the law produces a stupid result (like banning wheelchairs), whose job is it to fix it? The Judge's or the Legislature's?"
  *   **Closing Definition:**
      *   **Textualism:** Meaning is fixed in the words at the time of enactment. Priority: Fair notice, democratic accountability (Congress fixes mistakes).
      *   **Purposivism:** Meaning is derived from the goal the law seeks to achieve. Priority: Avoiding absurdity, achieving justice in the specific case.

  ---

  ### IV. Predictable Failures & Mitigations

  **1. The Drafting Overrun**
  *   **Risk:** Students debate the perfect wording for 20 minutes.
  *   **Fix:** Enforce the 30-word limit strictly. Announce "5 minutes remaining" at the 10-minute mark. If they aren't done, take what they have. The imperfection is a feature, not a bug.

  **2. The "Unseeing" Problem**
  *   **Risk:** Text Room students infer the purpose immediately ("Obviously they mean scooters!") and vote like the Purpose Room.
  *   **Fix:** In the instructions, add: "You will be penalized if your written reasoning references 'intent' or 'purpose'." During the debrief, highlight if the Text Room "cheated" by using common sense over text. This proves that *pure* textualism is cognitively difficult.

  **3. The "Correct Answer" Demand**
  *   **Risk:** A pre-law student asks, "But what would a *real* judge do?"
  *   **Fix:** "There is no correct answer. That is the point of the seminar. If there were a right answer, we wouldn't need a Philosophy of Law class; we'd need a memorization class. You are scored on prediction, not morality."

  **4. Method vs. Outcome Confusion**
  *   **Risk:** Students dislike the Text Room outcome (banning wheelchairs) and therefore reject Textualism as "evil."
  *   **Fix:** In the debrief, ask: "Did the Purpose Room produce a nicer result? Yes. Did they act like judges or legislators? If they acted like legislators, did they violate the separation of powers?" Separate the *attractiveness of the result* from the *legitimacy of the method*.

  ---

  ### V. What This Exercise Cannot Reproduce (Lecture Supplement)

  You must explicitly address these limitations in the final 15 minutes or the following lecture, or students will leave with a distorted view.

  1.  **The Base Rate of Easy Cases:**
      *   *Limitation:* This exercise only gives them "Hard Cases" (conflicts). 90% of statutory interpretation is uncontroversial.
      *   *Lecture Fix:* Explain that theories of interpretation are mostly tools for the 10% of cases where text and purpose diverge. Textualism isn't always "strict," it's just the default.

  2.  **Precedent and Canons of Construction:**
      *   *Limitation:* Students are deciding *de novo*. Real judges are bound by prior interpretations and linguistic canons (e.g., *ejusdem generis*).
      *   *Lecture Fix:* Acknowledge that real Textualism isn't just "reading words"; it's reading words through a complex grid of linguistic presumptions.

  3.  **The Epistemic Position of the Judge:**
      *   *Limitation:* In the game, the Purpose Room has *perfect* access to legislative history (the envelopes). In reality, legislative history is voluminous, contradictory, and often manufactured by staff *after* the fact.
      *   *Lecture Fix:* Explain the Textualist critique: "Legislative history is not law; it is often manipulated by lobbyists to create a 'purpose' that wasn't voted on."

  4.  **Fixed vs. Evolving Meaning:**
      *   *Limitation:* The game happens in one sitting. It doesn't capture the "Decades Apart" problem.
      *   *Lecture Fix:* Use the "Hologram" case to introduce the concept of **Original Public Meaning** (what the words meant then) vs. **Living Constitution/Statute** (how the words apply now).
      *   *On the "Variant Run":* Do **not** run the variant twice with the same statute decades apart in this session. It is too confusing. Instead, pose it as a hypothetical in the lecture: "If we ran this game again in 2050, would 'mechanical device' include AI software? The Text Room in 2024 says No. The Text Room in 2050 might say Yes. Which one is the 'Textualist'?"

  ### Final Instructor Note
  The success of this session relies on your willingness to let the "Mangling" produce a flawed statute. If you polish the Enacted Text too much to make it "work," you sanitize the conflict. Let the text be slightly awkward. The friction is where the philosophy lives.
