  This project is viable within one semester, provided the proposed split between evidential and strategic updating does not merely collapse into the standard distinction between evidential and causal decision theory. While the risk of redundancy is high, focusing on the linguistic processing of conditionals rather than pure decision theory offers a novel angle sufficient for a term paper.

  My thesis argues that the Judy Benjamin problem persists because literature treats belief revision and action-selection as a unified update mechanism. I contend that evidential conditionals should guide credence, while pragmatic conditionals guide action. Mixing these mechanisms creates the apparent paradox. Existing accounts, such as Edgington's, assume a unified update rule. If I am correct, the debate regarding credence adjustment is mislocated; it is not about conditionals per se, but about whether belief revision can be action-sensitive.

  My method proceeds in three stages. First, I will formalize the two update norms using a simple decision matrix. Second, I will apply this framework to the Benjamin case to check consistency with the reflection principle. Third, I will stress-test the split against existing counterexamples, such as medical testing scenarios, to ensure robustness.

  The scope is strictly decision-theoretic; I will avoid full formal semantics or attempting to solve Newcomb's problem. This limitation ensures feasibility while maintaining philosophical rigor. The deliverable is a 6,000-word paper arguing either that the split dissolves the paradox or that it fails by requiring the rejection of standard probabilism without gaining explanatory power. Success depends on demonstrating that separating credence from action-choice offers a distinct solution rather than relabeling established decision-theoretic problems. By isolating the linguistic processing of conditionals from strategic outcome manipulation, this paper aims to clarify why the Benjamin case stalls under unified norms.
