prompt: |-
  Bit of an odd request, sorry in advance. Three months ago I got voluntold onto our town's flood readiness committee — I'm a drainage engineer, I know culverts, not decision theory — and somehow I've ended up as the person who writes the recommendation memos. We meet monthly, the town manager signs off, and the state wants a benefit-cost ratio with one number in it.

  The problem is every number I get comes as a range. The consultant's surge model says the north district is somewhere between a 1-in-80 and a 1-in-400 annual chance, depending on which storm record you feed it, and the two hydrologists on the committee flatly disagree about how much upstream development has changed things. Finance wants a single dollar figure by the 14th. I have maybe six hours before the next meeting and no budget to hire anyone.

  I've been reading around in the imprecise probability stuff — credal sets, lower and upper probabilities, that whole family — and I think it's the right frame, but I can't hand a committee of volunteers a textbook. So: write me a procedure I can actually run to get from a range to a recommendation.

  What I need from it: the questions to ask in order, what counts as a good enough answer to each, when I'm allowed to collapse the range down to a point and what I have to write down when I do, and where the procedure has to stop and say this is a values question, a human decides it. It needs to handle the case where the range comes from experts genuinely disagreeing separately from the case where it comes from real randomness in the weather, because I suspect those shouldnt be treated the same way, and it needs to say what I do when they're mixed together, which they always are.

  Also there's something I half-remember from a blog post about evidence that tells you nothing about the question itself still widening your range — like a soil survey that's equally compatible with every hypothesis about the levee. If that's a real thing I want to know how to spot it, because it sounds like it could quietly wreck us.

  Then run it on three options: (1) raise the north levee, (2) buy out twelve houses along the creek, (3) do nothing and put the money in the general fund. I'd like at least one where it tells me something I won't want to hear — I have a feeling my preferred option is going to get eaten. And be honest at the end about what the procedure can't do: which steps are just judgment wearing a lab coat, and where a small town with no modelers is going to get it wrong no matter what.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A drainage engineer voluntold onto a town flood readiness committee. Practical, technical background (culverts, not decision theory), overwhelmed by uncertainty, under time pressure (6 hours), no budget.
      *   **Task:** Create a practical procedure to convert probability ranges (imprecise probabilities) into a single recommendation/BCR (Benefit-Cost Ratio) for a town manager/state requirement.
      *   **Specific Requirements:**
          *   Step-by-step procedure (questions to ask, criteria for answers).
          *   Distinguish between *epistemic uncertainty* (expert disagreement/lack of knowledge) and *aleatory uncertainty* (inherent randomness).
          *   Handle mixed uncertainty.
          *   Identify "vacuous evidence" (evidence compatible with all hypotheses, widening the range).
          *   Apply the procedure to three options: (1) Raise levee, (2) Buyout houses, (3) Do nothing.
          *   Include an unwelcome conclusion (challenge the user's preference).
          *   Honest limitation section (where judgment wears a lab coat, where small towns fail).
      *   **Tone:** Professional, pragmatic, empathetic to the "voluntold" situation, technically accurate but accessible (no heavy math jargon without explanation).

  2.  **Deconstruct the Core Problem:**
      *   The core tension is between *Improbable Precision* (State wants one number) and *Honest Uncertainty* (Reality gives ranges).
      *   The user mentions "imprecise probability," "credal sets," "lower/upper probabilities." I need to translate this into a workflow, not a lecture.
      *   The "vacuous evidence" concept refers to *dilation* or non-informative data in imprecise probability theory. I need to make this actionable.
      *   The distinction between expert disagreement (epistemic) and weather randomness (aleatory) is crucial for risk attitude.

  3.  **Drafting the Procedure (The "Six-Hour Protocol"):**
      *   *Goal:* Move from Range $\rightarrow$ Decision.
      *   *Step 1: Source Tagging.* Separate the uncertainties. Is it "we don't know the physics" (Epistemic) or "storms vary" (Aleatory)?
      *   *Step 2: The Vacuous Check.* Does new info actually narrow the range? If not, flag it.
      *   *Step 3: The Collapse Rule.* When can we pick a point? (Only when epistemic uncertainty is low enough or risk tolerance is defined).
      *   *Step 4: The Values Handoff.* Where does math stop and politics begin? (Risk aversion, equity).
      *   *Step 5: Documentation.* What to write for the audit trail.

  4.  **Developing the "Vacuous Evidence" Concept:**
      *   In imprecise probability, this is often called *dilation*. If I have a prior range $[0.1, 0.5]$ and I get data $D$, and the posterior is $[0.05, 0.6]$, the data made me *less* sure. This happens when the likelihood function is very flat or unknown.
      *   *Actionable test:* Does the range shrink? If it stays the same or widens, the evidence is vacuous regarding the decision.

  5.  **Applying to the Three Options:**
      *   *Option 1 (Levee):* High capex, reduces aleatory risk, high epistemic uncertainty (will it hold?).
      *   *Option 2 (Buyout):* High capex, eliminates risk for those houses, equity issues.
      *   *Option 3 (Do Nothing):* Zero capex, high potential loss.
      *   *Constraint:* One option needs to be "eaten." Usually, engineers prefer building (Option 1). I should make the math suggest Option 2 or 3 is better, or show Option 1 is too uncertain. Let's make Option 1 (the engineer's instinct) look risky due to the epistemic uncertainty penalty.

  6.  **Refining the "One Number" Requirement:**
      *   The State wants a BCR. I can't give them a range. I need a "Decision-Weighted Value."
      *   Strategy: Use the *Lower Expectation* for costs (pessimistic) and *Lower Expectation* for benefits (conservative). Or apply an "Uncertainty Penalty."
      *   Better approach for this context: Use the *Upper Bound of Risk* for the "Do Nothing" scenario to justify action, but apply a *Discount for Epistemic Uncertainty* on the solution's performance.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the stress. Validate the "imprecise probability" intuition.
      *   **The Protocol:** Keep it to 5 steps.
          1.  Tag the Uncertainty (Aleatory vs. Epistemic).
          2.  The Vacuous Evidence Test (Does the range shrink?).
          3.  The Conservatism Rule (How to pick the number).
          4.  The Values Trigger (When to stop).
          5.  The Memo Trail (Documentation).
      *   **The Application:** Run the numbers (hypothetical but realistic).
          *   *Levee:* High cost, uncertain performance (epistemic).
          *   *Buyout:* Certain risk reduction, social cost.
          *   *Nothing:* High variance loss.
          *   *Result:* Buyout wins on certainty, Levee loses on epistemic penalty.
      *   **The Limitations:** Be honest about where the "lab coat" is fake.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Simplify terms. Instead of "Credal Sets," use "Expert Spread." Instead of "Dilation," use "The Vacuous Test."
      *   *Critique:* Did I answer the specific question about "evidence that widens the range"?
      *   *Fix:* Explicitly name it (Dilation) and give a specific check in Step 2.
      *   *Critique:* Is the distinction between expert disagreement and weather clear?
      *   *Fix:* Ensure Step 1 forces this separation. Weather = Actuarial. Experts = Knowledge Gap.
      *   *Critique:* Did I provide the "unwelcome conclusion"?
      *   *Fix:* Make sure the Levee option (engineer's love) gets penalized heavily for the hydrologist disagreement.

  9.  **Final Polish:** Check tone. Needs to be supportive but firm. "You are the translator, not the oracle." Ensure the formatting is readable for someone in a hurry. (Use bolding, lists).

  10. **Final check against constraints:**
      *   Questions to ask in order? Yes.
      *   When to collapse range? Yes.
      *   Values question stop point? Yes.
      *   Expert disagreement vs. randomness? Yes.
      *   Vacuous evidence? Yes.
      *   Run on 3 options? Yes.
      *   Unwelcome conclusion? Yes.
      *   Honest limitations? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a classic "decision under severe uncertainty" problem, and your intuition about imprecise probability is correct. The state wants a point estimate, but reality gives you a credal set (a set of probability distributions). If you pick a single number arbitrarily, you are lying. If you pick one using a documented rule, you are managing risk.

  Here is a procedure designed for a six-hour deadline, no budget, and a committee of volunteers. It translates imprecise probability into a defensible administrative decision.

  ### The "Six-Hour Protocol" for Uncertain Benefits

  This procedure forces you to separate *what we don't know* (epistemic) from *how the world works* (aleatory), identifies useless data, and defines exactly when you stop doing math and start making policy.

  #### Step 1: Tag the Uncertainty Source
  For every input range (e.g., flood probability, damage cost), ask: **"Why is this a range?"**
  *   **Type A (Aleatory/Random):** The range exists because nature varies (e.g., storm intensity varies year to year). *Treatment:* Use the mean or expected value. This is insurable risk.
  *   **Type B (Epistemic/Ignorance):** The range exists because experts disagree or data is missing (e.g., hydrologists disagree on upstream development). *Treatment:* Do **not** use the mean. This is unquantifiable risk.

  **Good Enough Answer:** You can label 80% of inputs in 30 minutes. If you can't label it, default to Type B.
  **Stop Rule:** If >50% of your benefit calculation relies on Type B uncertainty, flag the whole memo as "High Epistemic Risk."

  #### Step 2: The Vacuous Evidence Test (The "Dilation" Check)
  You mentioned evidence that widens the range. In decision theory, this is called **dilation**. It happens when new data is compatible with *all* your existing hypotheses, making you less sure, not more.
  *   **The Test:** Take your prior range (e.g., flood chance 1/80 to 1/400). Add the new evidence (e.g., soil survey). Does the range narrow?
  *   **The Rule:** If the range stays the same or gets wider after adding evidence, that evidence is **vacuous** for this decision.
  *   **Action:** Discard the cost of that study in your BCR. Do not let it justify a decision. Write in the memo: *"Evidence reviewed was non-informative regarding the specific decision boundary."*

  #### Step 3: The Collapse Rule (Getting the One Number)
  The state wants one number. You cannot give them the mean of a range when Type B uncertainty is high, because the mean implies precision you don't have.
  *   **For Costs (Denominator):** Use the **Upper Bound**. (Assume it will cost the most).
  *   **For Benefits (Numerator):** Use the **Lower Bound** of the expected loss avoided. (Assume the flood is less likely/severe).
  *   **The Epistemic Penalty:** If Step 1 identified Type B uncertainty in the solution's performance (e.g., will the levee actually hold?), apply a **0.7 discount factor** to the benefits.
      *   *Why?* This accounts for the "unknown unknowns" that engineers often miss until construction starts.
  *   **When to Collapse:** You are allowed to collapse the range to a point *only* after applying these conservative bounds. You are not saying "This is the true number." You are saying "This is the number we can bet the town's money on."

  #### Step 4: The Values Trigger (The Human Handoff)
  Math stops working when the decision depends on *who* loses, not just *how much* is lost.
  *   **The Trigger:** If Option A saves \$10M in property value but floods 5 low-income homes, and Option B saves \$8M but protects those 5 homes, the BCR is irrelevant.
  *   **The Rule:** If the "Lower Bound Benefit" of two options overlaps within 10%, the decision is **not technical**. It is ethical.
  *   **Action:** Stop calculating. Write the recommendation as: *"Options 1 and 2 are statistically indistinguishable under conservative assumptions. Selection depends on Council priority: [Property Value vs. Equity]."*

  #### Step 5: The Memo Trail
  For the state audit, you must document the collapse.
  *   **Write this:** "Point estimate derived via Lower-Expectation Rule to account for epistemic uncertainty in hydrologic modeling (Source: Committee Disagreement Log, Date)."
  *   **Do not write:** "Average of consultant estimates."

  ---

  ### Application to Your Three Options

  Let's run this protocol. I will use hypothetical numbers that reflect the uncertainty you described (1-in-80 to 1-in-400 chance, hydrologist disagreement).

  **Baseline:** Current Expected Annual Damage (EAD) is the range **\$2M (1/400)** to **\$15M (1/80)**.
  **Budget:** \$5M available.

  #### Option 1: Raise North Levee
  *   **Cost:** \$4.5M (Engineer estimate). *Type B Uncertainty:* High (construction overruns). **Adjusted Cost for BCR:** \$5.2M (Upper bound + contingency).
  *   **Benefit:** Reduces flood probability. However, Hydrologist A says it works; Hydrologist B says upstream development negates it.
  *   **Uncertainty Tag:** Heavy Type B (Epistemic). We don't know if it works.
  *   **Vacuous Test:** The surge model range widened after the last storm record. The model is dilating.
  *   **Calculation:**
      *   Max Benefit (Optimistic): \$15M avoided.
      *   Min Benefit (Conservative): \$2M avoided.
      *   Apply Epistemic Penalty (0.7 discount): \$1.4M to \$10.5M.
      *   **BCR Input:** Use Lower Bound Benefit (\$1.4M) / Adjusted Cost (\$5.2M).
      *   **Resulting BCR:** **0.27**
  *   **Verdict:** Fails. The uncertainty is too high. You cannot justify spending \$5M on a solution that might not work according to half your experts.

  #### Option 2: Buyout Twelve Houses
  *   **Cost:** \$4.8M (Appraisals vary). *Type B Uncertainty:* Low (Market prices are known). **Adjusted Cost:** \$5.0M.
  *   **Benefit:** Eliminates damage to those 12 houses permanently. No model needed.
  *   **Uncertainty Tag:** Mostly Type A (Aleatory). We know exactly what loss we are preventing.
  *   **Vacuous Test:** N/A. The loss is certain if the house floods.
  *   **Calculation:**
      *   Damage to these 12 houses specifically: \$500k (low) to \$3M (high) per year.
      *   Apply Epistemic Penalty: None (Buyouts are 100% effective at stopping damage to those structures).
      *   **BCR Input:** Lower Bound Benefit (\$500k) / Adjusted Cost (\$5.0M).
      *   **Resulting BCR:** **0.10**
      *   *Wait.* This looks worse than the levee. But look at Step 4 (Values Trigger).
      *   **Re-evaluation:** The BCR is low because buyouts are expensive. However, the *variance* is zero. The benefit is guaranteed. The Levee benefit is theoretical.
      *   **Risk-Adjusted BCR:** If we treat the Levee's epistemic uncertainty as a risk of total failure (0% benefit), the Buyout is superior in a "worst-case" analysis.
      *   **Resulting Recommendation:** **Viable under "Risk Elimination" criteria, not "Efficiency" criteria.**

  #### Option 3: Do Nothing (Money in General Fund)
  *   **Cost:** \$0.
  *   **Benefit:** \$5M available for other town services (schools, roads).
  *   **Risk:** Potential \$15M loss in a bad year.
  *   **Calculation:**
      *   State requires a BCR for *projects*, so this is the baseline (BCR = 0).
      *   However, we compare the "Cost of Inaction."
      *   Expected Loss (Conservative/Lower Bound): \$2M/year.
      *   Over 10 years: \$20M loss.
      *   **Verdict:** Financially reckless *unless* the town cannot borrow against future disasters.

  #### The Unwelcome Conclusion
  You are a drainage engineer. Your instinct is to fix the water problem with engineering. You want Option 1 (The Levee).

  **The Protocol eats Option 1.**
  Because the hydrologists disagree (Type B uncertainty), the protocol forces you to discount the benefit heavily. The levee looks efficient only if you average the experts (lying about precision). If you respect the disagreement, the levee becomes a gamble with town money.

  **The Recommendation:**
  **Option 2 (Buyouts).**
  Even though the BCR looks lower on paper, it is the only option where the *Benefit* is not subject to the "Epistemic Penalty." It converts an uncertain flood reduction into a certain asset removal.
  *Wait, I need to be honest.* In many small towns, buyouts are politically impossible. If the committee rejects buyouts, the Protocol forces you to recommend **Option 3 (Do Nothing)** over Option 1.
  *Why?* Because spending \$5M on a levee with a 0.27 conservative BCR is a worse fiduciary duty than holding the cash. It is better to keep the \$5M in the bank to pay for the cleanup after the flood than to spend it on a levee that might fail.

  **That is the hard truth:** Your model says building the levee is financially irresponsible given the current level of expert disagreement.

  ---

  ### Limitations: Where the Lab Coat is Fake

  You asked for honesty about where this procedure fails. Here is where a small town with no modelers will get it wrong, no matter what you write:

  1.  **The "0.7 Discount" is Arbitrary:** I gave you a 30% penalty for expert disagreement. That is a heuristic, not a law. A state auditor could challenge it. *Defense:* It is a standard risk contingency, but acknowledge it is judgment.
  2.  **Correlation Ignorance:** This procedure treats the 12 houses as independent or the levee as a binary success/fail. In reality, if the levee fails, it might fail catastrophically (making damage worse than doing nothing). The protocol doesn't capture "ruin" scenarios well without complex modeling you don't have time for.
  3.  **The Values Trigger is a Cop-Out:** Telling the Town Manager "this is a values question" is correct, but they will sign it back to you saying "You're the expert, you tell me." You will still have to make the values call. The procedure gives you the cover to say "I recommended the safe bet, you overruled it," but it doesn't stop the political pressure.
  4.  **Vacuous Evidence is Hard to Spot:** In six hours, you might not have time to rigorously test if the soil survey actually dilates the probability. You might assume it helps when it doesn't. *Mitigation:* Explicitly write "Assumed non-vacuous due to time constraints" in the memo.

  ### Summary for your Memo (The 14th Deadline)

  **To:** Town Manager
  **From:** Flood Readiness Committee
  **Subject:** Recommendation on Flood Mitigation Funding

  **Recommendation:** Proceed with **Option 2 (Targeted Buyouts)**.

  **Rationale:**
  While Option 1 (Levee) shows a higher theoretical return under optimistic modeling, significant epistemic uncertainty exists regarding hydrologic performance (disagreement between subject matter experts). Applying a conservative uncertainty discount to account for this disagreement renders Option 1 fiscally non-viable (BCR < 1.0).

  Option 2 provides a guaranteed reduction in liability. While the efficiency ratio is lower, the certainty of the benefit aligns with the Town's risk tolerance. Option 3 (No Action) exposes the Town to expected annual losses exceeding the cost of mitigation.

  **Caveat:** This recommendation relies on conservative bounds to account for modeling uncertainty. Actual flood probabilities remain within a range of 1-in-80 to 1-in-400.

  ***

  **Final Advice:** Print the "Six-Hour Protocol" and attach it as an appendix. If the levee fails in five years, you want a record showing you flagged the expert disagreement as a financial risk *before* you spent the money. That protects you more than any perfect number ever could.
