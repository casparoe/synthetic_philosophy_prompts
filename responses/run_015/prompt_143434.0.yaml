  My tutor in phil of mind has been talking about Hofstadter's idea of the I as a strange loop — a symbol that loops back to denote itself. She's given verdicts on a bunch of cases and I want to see if there's a pattern.

  Her calls so far:
  - a normal adult human: yes, full strange-loop I.
  - a 2-month-old infant: yes, it's already booting the loop even if it's crude.
  - a patient in a persistent vegetative state with zero self-awareness reports: no, the loop's broken or absent.
  - a big language model that outputs first-person sentences: no, just pattern-matching, no loop.
  - Gödel's formal sentence that refers to its own unprovability: yes, but only in a thin way — there's self-reference but no subject experiencing it.
  - a slime mold that leaves chemical trails and feeds back on them: no, pure homeostasis with no symbol.

  Now there's this new thing I read about: a distributed robot swarm with no central processor. Each unit is dumb, but together they maintain a real-time symbolic model of this swarm's state and update collective behavior based on it. The model literally contains a token that denotes the swarm itself.

  What do you think she'll say — does this swarm have an I? I'm less interested in yes/no than in the rule she's actually running, and what other rules could fit her earlier verdicts just as well. Which of those rules split on the swarm, and what's the one further case that'd tell them apart?

  Also please seperate what's pretty settled in Hofstadter-style discussions from what's actually up for debate, and don't act like a contested take is the consensus view.
