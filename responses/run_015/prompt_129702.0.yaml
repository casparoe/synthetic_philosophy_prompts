answer: |-
  **Joint Statement on Levels of Selection in Engineered Microbiomes**

  **1. Agreed Claims**
  We, the undersigned, submit the following claims as the shared foundation for analyzing the engineered gut consortium case.

  1.  **Partition Neutrality:** The Price equation partitioning of evolutionary change into within-group and between-group components is mathematically equivalent to kin-selection formulations using relatedness coefficients. Neither partition is causally privileged by the mathematics alone.
  2.  **Assortment Necessity:** The costly enzyme trait (8% growth cost) cannot persist globally without positive assortment between carriers and beneficiaries.
  3.  **Bottleneck Function:** Reducing the colonization bottleneck (fewer founder cells) increases genetic homogeneity within guts, thereby increasing assortment.
  4.  **Migration Effect:** Increasing migration between cages homogenizes the global population, reducing assortment and favoring the non-enzyme mutant.
  5.  **Horizontal Transfer:** Conjugation acts as a transmission bias that can offset the vertical fitness cost of the plasmid, independent of cell division.
  6.  **Group Feedback:** Cage-level differences in enzyme output affect global plasmid frequency only if cages differ in their contribution to the next generation (via export or extinction).
  7.  **Mutant Dynamics:** The mutant plasmid (high transfer, no enzyme) has a within-gut advantage but reduces total cage productivity.
  8.  **Equivalence of Outcome:** For any setting of the four knobs (cost, conjugation, bottleneck, migration), both frameworks must predict the same equilibrium frequency of the plasmid.
  9.  **Empirical Constraint:** A valid explanation must identify which knob provides the primary leverage for changing that equilibrium.

  **2. Disagreements Table**

  | Crux | Nadia's Formulation (Replicator) | Owen's Formulation (Multilevel) | Agreed Experiment | Nadia's Prediction | Owen's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Primary Unit** | The plasmid is the selected unit; the cell is a vehicle. | The cell is the primary interactor; the plasmid is a trait. | Set conjugation to max; vary bottleneck (1 vs 1000 founders). | Plasmid frequency driven by conjugation rate; bottleneck effect is secondary to transmission fidelity. | Plasmid frequency driven by bottleneck; high conjugation merely increases within-group variance. |
  | **2. Causal Status** | The between-group term is bookkeeping for individual correlations. | The between-group term represents a distinct causal force (group selection). | Fix bottleneck; vary migration rate (0% vs 50% swap). | Change in frequency is due to altered individual fitness covariance across contexts. | Change in frequency is due to altered strength of selection between cages. |
  | **3. The Cheater** | The mutant plasmid is the fitter replicator; cell cost is irrelevant to plasmid success. | The mutant-bearing cell is a free-rider; group collapse limits plasmid success. | Introduce mutant plasmid; measure enzyme output vs plasmid freq over 100 gens. | Mutant fixes if transfer rate > cost, regardless of enzyme output collapse. | Mutant spreads only until cage productivity drops below migration threshold. |

  *Note on Table:* We acknowledge that for Crux 2, the numerical prediction for frequency change is identical. The disagreement concerns which parameter change constitutes the *mechanism* of that change.

  **3. Verbal Disputes**
  Several disputes are merely verbal and can be dissolved by stipulating definitions for this context.
  *   **"Group":** Nadia uses "group" to mean a statistical cluster of correlated replicators. Owen uses "group" to mean a physical cage with potential differential extinction. We agree to distinguish *statistical groups* (defined by relatedness) from *physical groups* (defined by cage walls).
  *   **"Selection":** Nadia uses "selection" to mean differential replicator persistence. Owen uses "selection" to include differential persistence of interactors (cells/cages). We agree to specify *selection on what* in all future claims.
  *   **"Altruism":** Nadia defines altruism as costly to the replicator. Owen defines it as costly to the cell. We agree the enzyme is altruistic at the cell level but potentially selfish at the plasmid level if conjugation compensates cost.

  **4. Path Forward**
  We recognize that mathematical equivalence allows both sides to retrofit any outcome. To move beyond this, we must treat the four knobs not just as parameters for fitting curves, but as interventions testing causal leverage. If varying conjugation yields larger frequency shifts than varying bottlenecks, the replicator view gains explanatory priority. If bottleneck variation dominates, the multilevel view gains priority. We commit to analyzing the sensitivity of the system to these specific manipulations rather than arguing over the description of the result.

  \answer{crux 1: horizontal transfer defines unit}
