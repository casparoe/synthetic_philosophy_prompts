answer: |-
  **Title:** Horizontal Defection and the Topology of Normative Change: Reassessing the Honor-World Thesis

  **Research Question**
  Does the historical collapse of dueling support a unified model of moral revolution, or does it necessitate disaggregating normative change into distinct structural types? Current dominant frameworks treat the dissolution of honor-based norms as a singular phenomenon driven either by internal ethical contradictions or by material interest convergence. This project challenges that uniformity. It asks whether the mechanism of collapse depends on the social topology of the norm itself. Specifically, I argue that dueling represents a *horizontal signaling game* susceptible to local peer-defection, whereas norms like slavery or foot-binding constitute *vertical hierarchies* requiring structural or economic rupture. The central inquiry is whether a credible theory of normative change must distinguish between horizontal, vertical, and hybrid mechanisms of dissolution rather than subsuming them under a single "honor-world" model.

  **Context and Existing Positions**
  The debate regarding the end of honor cultures is currently polarized between internalist and externalist explanations. On one side, the Appiahian framework suggests that honor norms collapse when they become internally contradictory or lose credibility within a broader social context. On this view, the end of dueling parallels the end of slavery because both practices eventually became incompatible with a rising global consciousness of dignity. The norm becomes unsustainable because the moral premises supporting it can no longer be coherently held alongside other valued commitments.

  Conversely, the Williams thesis posits that normative shifts are epiphenomenal to changes in material and status interests. Here, honor is merely the rhetorical wrapper for economic or political advantage. When the material utility of a practice vanishes, the moral justification is discarded. While these positions offer robust macro-level explanations, both leave a critical micro-sociological gap. They treat the "honor world" as a monolithic block that shifts uniformly. Neither adequately accounts for the game-theoretic structure of specific norms. Appiah focuses on the *content* of the values becoming untenable, while Williams focuses on the *incentives* changing. Neither fully addresses the *network structure* through which the norm is enforced.

  My intervention isolates a specific mechanism: horizontal peer-defection. In the case of dueling, the norm is sustained by reputation among equals. It does not require state enforcement or deep economic restructuring to end; it requires only that a critical mass of peers within a cohort find a way to refuse challenges without losing status. This is distinct from slavery, which is embedded in vertical legal and economic hierarchies that cannot dissolve through cohort-level refusal alone. By failing to distinguish between these structural types, existing theories risk overgeneralizing the mechanics of moral progress.

  **Methodology**
  This project employs a conceptual-comparative method rather than archival historical research. The goal is not to uncover new historical data regarding the timeline of dueling's abolition, but to analyze the logical and structural conditions required for its dissolution compared to vertical norms.

  The analysis will proceed in three stages. First, I will reconstruct the causal mechanisms implied by the unified honor-world model, clarifying how it explains the transition from acceptance to rejection. Second, I will model dueling as a peer-to-peer signaling game, identifying the specific conditions under which "refusal" becomes a credible signal rather than a mark of shame. This involves distinguishing my "horizontal defection" model from Appiah's "credibility condition." For Appiah, credibility is lost when the practice conflicts with dignity; for this project, credibility is lost when the local network no longer punishes defection, regardless of broader moral sentiment.

  Third, I will contrast this with the structural requirements for ending vertical norms like chattel slavery. This comparison will test whether the mechanisms are interchangeable. If the end of dueling can be explained by local peer-defection while the end of slavery cannot, the unified model is insufficient. The argument relies on philosophical analysis of social ontology and normative structures, using historical cases as illustrative paradigms rather than objects of empirical scrutiny.

  **Work Plan**
  *   **Month 1: Conceptual Foundation.** Refine the definitions of "horizontal peer-defection" and "vertical hierarchy." Conduct a close reading of the core arguments regarding honor-worlds and interest convergence to ensure charitable representation. Draft the section critiquing the unified model.
  *   **Month 2: Case Application.** Apply the signaling game framework to the case of dueling. Articulate exactly how a cohort creates a "safe exit" from the norm. Simultaneously, map the structural barriers in the case of slavery to demonstrate why peer-defection is insufficient there.
  *   **Month 3: Synthesis and Drafting.** Integrate the comparative analysis into the broader theory of normative change. Write the full first draft, focusing on the argument that moral revolutions are topologically distinct.
  *   **Month 4: Revision and Polish.** Review for clarity, flow, and word count compliance. Ensure the distinction between the proposed typology and existing literature is sharp. Finalize the conclusion regarding the implications for moral philosophy.

  **Criteria for Success and Failure**
  A successful outcome will produce a clear typology of normative collapse that explains why some honor norms vanish quickly through social contagion while others require legislative or economic force. Success is defined by the ability to demonstrate that "horizontal peer-defection" is a distinct causal mechanism, not merely a subset of Appiah's credibility condition or Williams' interest convergence. The paper must show that recognizing this distinction changes how we understand moral progress.

  Failure would result if the distinction between horizontal and vertical norms proves trivial or if the collapse of dueling cannot be convincingly separated from broader economic shifts. If it turns out that peer-defection in dueling was actually driven by the same material interests Williams describes, the specific contribution of the "signaling game" framework would be undermined. Additionally, the project would fail if the scope expands too deeply into historical specifics, sacrificing philosophical rigor for narrative detail.

  **Scope Assessment**
  An 8,000-word limit is sufficient for this conceptual work but requires discipline. The primary risk is historical bloat; the paper must avoid becoming a history of dueling. The focus must remain on the *structure* of the norm, not the *chronology* of its end. By limiting the historical cases to paradigmatic examples rather than comprehensive surveys, I can maintain the necessary philosophical depth. The distinction between horizontal and vertical mechanisms is narrow enough to be treated rigorously within one semester, provided I resist the temptation to add additional case studies. The proposed timeline allows for adequate drafting and revision without requiring external data collection.
