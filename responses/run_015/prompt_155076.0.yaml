      *   *Context:* Descartes is starting the *Discourse*. He wants to establish that everyone has the potential to reason correctly if they follow the right method. He needs to democratize reason to justify his project (anyone can do philosophy/science if they follow the method).
      *   *Scholastic/Early-Modern Vocabulary:*
          *   "Form/Nature": The essence of a thing. What makes a human a human. In Scholastic terms, the rational soul.
          *   "Accidents": Non-essential properties (height, weight, health, education, maybe brain state).
