  3.  **Evaluate the Readings:**
      *   *Mere-Threshold Reading:* This suggests reason comes in degrees among humans. But Descartes explicitly says "difference of greater and less holds only among the accidents, and not among the forms or natures." If reason were the form/nature, and there were degrees of reason among humans, then the form would differ in degree. Descartes denies this. He says the *form* doesn't admit of greater or less. Therefore, the essence of reason is identical in all humans.
