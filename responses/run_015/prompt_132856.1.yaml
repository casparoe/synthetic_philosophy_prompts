      *   **Representational Truncation / Structural Deafness:** This sounds like "concept erasure" or "mechanistic interpretability-based surgery." The idea is removing the *connections* between concepts rather than the concepts themselves. E.g., knowing "poison" and knowing "coffee" but lacking the weighted connection that suggests "put poison in coffee to achieve goal X."
      *   **Distinction from "Incapable of Planning":** "Incapable of planning" is a capability claim. "Structural deafness" is an architectural/representational claim. It suggests a specific *mechanism* of incapacity (missing links vs. general compute limit). This is a meaningful distinction.
      *   **Optimizer Objection:** Can a smart optimizer patch truncation? If the model is a general reasoner, it might reconstruct the missing links via inference (e.g., "I can't think of how to do X, but I know Y and Z, therefore..."). This is the biggest weakness of the "deafness" argument. The model might *simulate* the missing representation.

