answer: |-
  **Joint Statement of Adversarial Collaboration on Biological Function**

  **Signatories:** The Selected-Effects Working Group (SE) & The Causal-Role Pluralist Coalition (CR)

  We sat down to hash out where we stand on function. We aren't trying to convert each other yet, but we want to map the battlefield so we know what we're actually fighting about. Below is what we agree on, followed by where we split.

  ### I. Agreed-Claims

  1.  **Malfunction is real.** We both sign onto the view that when a biological trait malfunctions, it's not just a statistical deviation or a rare variant. A heart that doesn't pump is broken, not just unusual. There is an ontological difference between working and broken.
  2.  **Function ascriptions are normative.** Saying "X has function Y" isn't just describing what X does; it implies X *ought* to do Y. These claims do normative work in biology and medicine.
  3.  **Engineered organs are a trouble spot.** We agree that engineered organs without evolutionary ancestors (like a lab-grown kidney never seen in nature) pose a problem for at least one side of this debate. We might disagree on *which* side has the problem, but we admit the tension exists.
  4.  **Both frameworks are useful.** Even if one of us is right about the "true" defintion of function, the other framework picks out real patterns in nature that are worth tracking.

  ### II. Disagreements Table

  | Issue / Crux | Selected-Effects (SE) Position | Causal-Role (CR) Position | Verbal Dispute? |
  | :--- | :--- | :--- | :--- |
  | **Core Defintion** | Function is strictly tied to evolutionary history. A trait functions if it was selected for doing that thing in the past. | Function is tied to current causal contribution. A trait functions if it contributes to the capacity of the containing system now. | **Yes.** SE thinks CR is describing "capacity," not "proper function." CR thinks SE is too restrictive for modern biology. |
  | **Crux 1: The Human Appendix**<br>*(Case: Humans with healthy appendices vs. those with appendicitis in modern environments)* | **Prediction:** If the selection history is murky or nonexistent, it has no proper function, even if it does stuff now. It might just be a spandrel. | **Prediction:** If it currently contributes to immune function or gut flora maintenance, it has a function. History doesn't matter for the current ascription. | **No.** This is a substantive disagreement about whether history is necessary for normativity. |
  | **Crux 2: Synthetic Gene Drives**<br>*(Case: Mosquitoes engineered with a gene drive to suppress population growth)* | **Prediction:** No proper function. They have no selection history. They are artifacts with causal roles, but biologically speaking, they don't have a "function" in the etiological sense. | **Prediction:** Yes, they have functions. Their function is population suppression because that is the causal role they play in the ecosystem system. | **Maybe.** Depends if we allow "function" to apply to artificial systems inserted into biological contexts. |
  | **Normative Source** | Normativity comes from the past (selection pressure). You fail if you don't do what your ancestors did. | Normativity comes from the system's goal (capacity). You fail if you don't contribute to the system's current operation. | **No.** Disagreement on where the "ought" comes from. |

  ### III. Notes on the Cruxes

  We wanted to make sure the predictions above were clear enough to test.

  **On the Appendix:**
  We both agree the relevent case is a human appendix that actively houses beneficial gut bacteria but lacks a clear phylogenetic signal of selection for that trait.
  *   **SE says:** Without the history, calling it a "function" is metaphorical.
  *   **CR says:** Without the history, it's still a function because the system relies on it.

  **On Gene Drives:**
  We both agree the case is a synthetic construct released into the wild that successfully collapses a vector population.
  *   **SE says:** This is engineering, not biology. It has a purpose (designer's intent) but not a biological function.
  *   **CR says:** Once released, it becomes part of the biological system. Its function is defined by its effect.

  ### IV. Closing Thought

  We suspect part of the fight is just verbal over 'proper function' vs 'system contribution'. If SE sticks to "proper function" and CR sticks to "system function," we might agree more than we think. But until we standardize the terms, we're going to keep talking past each other. We'll meet again next month to see if the gene drive case settles anything.

  *(Signed)*
  **Dr. E. Tiology (SE)**
  **Dr. C. Role (CR)**
