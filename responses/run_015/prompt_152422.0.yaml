answer: |-
  # Q&A Prep Sheet: Coordination Occurrentism

  **Strategy Note:** Your thesis lives in the gap between "brute regularity" and "productive power." Every attacker will try to collapse you into one side or the other. Your survival depends on maintaining that middle ground without it looking like a contradiction.

  ---

  ### 1. The Philosopher of Physics
  **Damage Level:** Critical. If they convince the room your "constraint" is incompatible with fundamental physics, the view is dead.
  **The Objection:** "You claim this is a secular reconstruction compatible with science. But fundamental physics—quantum field theory, general relativity—is time-symmetric and local. Your 'global constraint' linking total state $t_1$ to $t_2$ sounds like a preferred foliation or a hidden variable. If it's not in the Lagrangian, where is it? If it *is* in the Lagrangian, it's just a law. You're positing an ontological free rider that physics doesn't need."

  **Two-Minute Reply:**
  "I concede that the constraint does not appear as a variable in the fundamental equations. That is precisely the point of claim (iii): physics underdetermines metaphysics. The equations describe the *pattern* of the occurrents; my constraint describes the *coordination* of that pattern. Think of it like the difference between a film strip and the projection mechanism. Physics gives us the frames (the occurrents) and the statistical regularities between them. It remains silent on whether frame $n$ *produces* frame $n+1$ or whether they are jointly coordinated by a global rule. I'm not adding a physical force; I'm adding a metaphysical principle of unity. Physics doesn't need it to predict; metaphysics needs it to explain why there is a predictable world rather than a chaotic one."

  *   **Concede Up Front:** Yes, the constraint is empirically silent and adds no predictive power to physics.
  *   **Must Hold:** Metaphysics is not exhausted by fundamental physics; the "why order?" question is legitimate even if physics ignores it.
  *   **Soft Spot:** If they press on *how* a non-physical constraint selects specific physical states without violating conservation laws, you risk sounding dualist.

  ### 2. The Dispositionalist (Molnar/Mumford Camp)
  **Damage Level:** High. They will argue that without powers, you have no directionality and no genuine causation.
  **The Objection:** "You say you dissolve the exclusion problem by denying local production. But if nothing produces anything locally, what distinguishes your view from coincidence? Powers provide the ontological ground for the direction of time and the specificity of effects. A global constraint is just a power writ large—a 'super-disposition' of the universe. If it lacks directedness, it can't explain why *this* state follows *that* one. If it has directedness, it's a power. You haven't escaped the powers ontology; you've just hidden it."

  **Two-Minute Reply:**
  "I deny that directedness requires local production. The dispositionalist says the acid dissolves the metal because of the acid's power. I say the acid-and-metal occurrent at $t_1$ is coordinated with the dissolved-metal occurrent at $t_2$ by the global constraint. The 'direction' comes from the asymmetry of the constraint, not from an internal push. This isn't a super-power because powers are local properties of objects. My constraint is a relation between total world-states. It doesn't reside in the acid; it resides in the structure of reality. This allows me to keep the regularity without the occult 'oomph' that creates the exclusion problem for mental causation."

  *   **Concede Up Front:** Yes, the constraint performs an explanatory role similar to powers (accounting for order).
  *   **Must Hold:** The constraint is structural/global, not a local property/ingredient. This distinction saves you from the "hidden power" charge.
  *   **Soft Spot:** Explaining the *asymmetry* of the constraint without invoking time's arrow (which might rely on causation) is tricky.

  ### 3. The Lewis-Style Humean
  **Damage Level:** High. They will attack your main comparative advantage (claim i).
  **The Objection:** "You claim to explain 'why there is order' better than I do. But on the Best System Account, laws *are* the systematic regularities. To ask 'why is there a system?' is to ask for a law behind the laws. You're positing a 'constraint' that does nothing but mirror the regularities we already see. You haven't explained the order; you've just reified the Humean Mosaic and given it a fancy name. My view is more parsimonious: there is order because there is order. Your 'constraint' is an ontological cost with no explanatory dividend."

  **Two-Minute Reply:**
  "The dividend is modal stability. On your view, the fact that the sun rises tomorrow is as brute as the fact that it rose today. The systematization is a human heuristic. On my view, the constraint is a mind-independent feature of reality that *makes* the regularity hold. I am not asking for a law behind the laws; I am saying the 'law-like' connection is the fundamental fact, not the local events. You treat the mosaic as fundamental and laws as derivative. I treat the coordination as fundamental and the mosaic as the manifestation. That shift allows me to say the order is *necessary* in a way Humeanism cannot, without invoking powers."

  *   **Concede Up Front:** Yes, we are empirically equivalent. Yes, my ontology is less parsimonious.
  *   **Must Hold:** Parsimony is not the only theoretical virtue; explanatory depth regarding "why order?" justifies the cost.
  *   **Soft Spot:** If they argue that "necessary order" is incoherent without powers, you risk circularity.

  ### 4. The Historian of Medieval Philosophy
  **Damage Level:** Medium. This attacks your branding and credibility, not the logic.
  **The Objection:** "You're calling this 'occasionalism.' But for al-Ghazālī and the occasionalists, the whole point was Divine Will. The 'habit' of God is a voluntary, continuous act of creation. By secularizing this into a 'global constraint,' you've removed the agent that makes it occasionalism. You're left with a deistic regularity theory. Why appropriate the label if you strip out the theology that defined the position?"

  **Two-Minute Reply:**
  "I am not doing exegesis; I am doing reconstruction. The core structural insight of occasionalism is the denial of local efficacy and the reliance on a global coordinator. The medievalists identified that coordinator with God. I am arguing that the *structural* insight holds even if we replace 'Divine Will' with 'Metaphysical Constraint.' If we strip the theology, do we lose the metaphysics? I argue no. The label is appropriate because the causal architecture is identical: no horizontal causation, only vertical coordination."

  *   **Concede Up Front:** I am not忠实 (faithful) to the historical texts' theological commitments.
  *   **Must Hold:** The *causal structure* is the philosophically valuable part, separable from the theology.
  *   **Soft Spot:** If they argue the "habit" *is* the Will, and without Will there is no habit, your analogy collapses.

  ### 5. The Interventionist
  **Damage Level:** Medium. They care about utility, not fundamental truth.
  **The Objection:** "Causal claims are about what happens under manipulation. If I intervene on $X$, $Y$ changes. That implies a local dependency. Your view says $X$ doesn't produce $Y$; the global constraint does. But in my structural equations, I model $X \to Y$. If your metaphysics can't model interventions without treating them as 'new occurrents coordinated by the constraint,' it's useless for science. How do you handle modularity?"

  **Two-Minute Reply:**
  "Interventions are just specific types of occurrents. When you intervene, you introduce a new local state. The global constraint then coordinates *that* new total state with the next one. The dependency $X \to Y$ holds counterfactually because the constraint links any total state containing $X_{intervened}$ to a state containing $Y_{changed}$. I can accept the interventionist model as pragmatically correct while denying it reflects the fundamental metaphysics. The 'local link' in your equations is a map of the coordination, not a map of production."

  *   **Concede Up Front:** Interventionism is the correct methodology for special sciences.
  *   **Must Hold:** Interventionist causation is derivative; Coordination Occurrentism is fundamental.
  *   **Soft Spot:** Explaining why the constraint respects the modularity of interventions without making the constraint itself modular.

  ### 6. The Older-School Regularity Theorist
  **Damage Level:** Low. They are the easiest to satisfy.
  **The Objection:** "This sounds like constant conjunction with extra steps. If the constraint doesn't produce anything, and it's not reducible to the events, what is the cash value? Why not just say 'events follow events' and save the ontology?"

  **Two-Minute Reply:**
  "Because 'events follow events' leaves the 'follow' unexplained. It treats the succession as a series of accidents. My view treats it as a unified structure. The cash value is solving the exclusion problem: if events don't follow by production, mental and physical events don't compete. The extra ontology buys peace in the philosophy of mind."

  *   **Concede Up Front:** It is more complex than simple regularity.
  *   **Must Hold:** The complexity is necessary to solve the exclusion problem.
  *   **Soft Spot:** Whether the exclusion problem is actually solved or just moved.

  ---

  ### 🚩 Preemptive Move
  **Do this in your opening remarks:**
  Preempt the **Historian's Objection**.
  *Why:* It is the most distracting. If the room spends 20 minutes debating whether al-Ghazālī would approve of your view, you lose time to defend the metaphysics against the Physicist and Humean.
  *How:* "A note on terminology: I am aware that classical occasionalism is theological. I am not proposing a historical exegesis but a structural reconstruction. I retain the label because the *causal architecture*—the denial of local efficacy in favor of global coordination—is identical. I ask you to evaluate the architecture, not the theology."

  ---

  ### ☠️ The Nightmare Question
  **The Question:** "If the constraint is not reducible to occurrents, and not a productive power, and not a law of physics, **what modal force does it have?** If it has none, it explains nothing (it's just a description). If it has some, it *is* a power or a law. You claim a middle ground, but isn't this just a verbal trick to hide a category error?"

  **Why this kills you:** It targets the "Soft Spot" in almost every reply above. It forces you to define the "constraint" positively. If you say it "necessitates," you're a Necessitarian. If you say it "describes," you're a Humean. If you say "neither," you sound mystifying.

  **Preparation:** Do not try to define the modal force positively. Define it *negatively*. "It is not a force. It is a principle of ontological unity. It doesn't *push* the next state into existence; it *constitutes* the reality of the sequence." (Risky, but your only move).
