answer: |-
  This is a fantastic observation. You have identified a specific crack in the standard philosophical models of how we use tools to think. You are right to feel that "Extended Mind" (Otto and his notebook) and "Distributed Cognition" (the navigation team) don't quite capture the *social mediation* of the trust involved.

  Here is the breakdown of what this setup is, what it is called, how it differs from nearby concepts, and where the boundary lies.

  ### 1. The Name: Transactive Memory Systems
  The most precise psychological term for what you are describing is a **Transactive Memory System (TMS)**.

  Proposed by psychologist Daniel Wegner in 1985, TMS describes how couples or groups store memory not just in their own heads, but in the heads of others. It relies on two components:
  1.  **Specialization:** You know that *she* tracks the calendar, and she knows that *you* track something else (perhaps finances or car maintenance).
  2.  **Transactive Retrieval:** When you need the info, you don't search your own brain; you query the person (or the artifact they control).

  In your specific case, the calendar is the **interface** for the transactive memory. You aren't trusting the ink on the fridge; you are trusting the *process* maintained by your partner. In the literature, this is sometimes called **asynchronous transactive memory**, because you aren't asking her directly in the moment; you are accessing the external storage she manages.

  ### 2. The Philosophical Framing: Socially Extended Cognition
  In philosophy of mind, this challenges the classic **Extended Mind Thesis (EMT)** proposed by Clark and Chalmers (the Otto/Notebook case).

  *   **Classic EMT:** Otto looks at his notebook. He trusts the notebook because he wrote in it himself. The endorsement is direct.
  *   **Your Case:** You look at the calendar. You trust it because *she* wrote in it. The endorsement is **delegated**.

  Philosophers (like Joel Krueger and Soren Overgaard) call this **Socially Extended Cognition**. It argues that other people can function as part of your cognitive machinery. In your scenario, your partner is acting as a **cognitive scaffold**. She is performing the "encoding" and "updating" function of your memory, while you perform the "retrieval" and "execution" function.

  The mechanism you identified—"I endorse her, and she endorses it"—is known as **epistemic chaining**. You are outsourcing the *verification* condition of knowledge.

  ### 3. What This Is Not (The Distinctions)
  To clarify exactly what this is, it helps to see what it excludes:

  *   **It is not "Distributed Cognition" (in the Hutchins sense):** As you noted, Distributed Cognition usually looks at the *system* (the ship, the cockpit). It doesn't care about the internal feeling of trust. It just maps where the information flows. You are asking about the *phenomenology of trust* within that flow.
  *   **It is not "Classic Extended Mind":** If you found a notebook on the street that was perfectly accurate, you wouldn't use it as part of your mind. Why? Because you didn't curate it. In your fridge case, the "curation" is done by a trusted other. The boundary of your mind extends *through* her to the calendar.
  *   **It is not "Blind Tool Reliance":** If you used a digital calendar that auto-synced, you are trusting the *code* or the *company*. That is algorithmic trust. Your fridge scenario is **interpersonal trust**. If the calendar is wrong, you blame her. If Google Calendar is wrong, you blame the server. The accountability structure is different.

  ### 4. Where Do You Draw the Line?
  You asked: *Is it still the same thing if I had no idea who maintains it, only that somebody does?*

  This is the critical boundary. The answer is **no, it changes the cognitive category.**

  **Scenario A: You know it's her.**
  *   **Type:** Transactive Memory / Socially Extended Mind.
  *   **Mechanism:** Interpersonal trust.
  *   **Failure Mode:** If she stops writing, your cognitive system collapses because the *agent* failed.
  *   **Status:** The calendar is part of a **social cognitive loop**.

  **Scenario B: You know "someone" maintains it (e.g., a shared office calendar).**
  *   **Type:** Institutional Trust / Environmental Reliability.
  *   **Mechanism:** Systemic trust.
  *   **Failure Mode:** If the calendar is wrong, you assume a process error, not a person error.
  *   **Status:** The calendar is a **public utility**.

  **Why the line matters:**
  In Scenario A, your brain is coupled with *her agency*. You are effectively thinking with her help. In Scenario B, your brain is coupled with a *reliable environment*.

  If you don't know *who* maintains it, you cannot engage in **metacognitive monitoring** of the source. If you notice an error on the fridge, you can ask your partner, "Did you write this?" and update your trust model of *her*. If you see an error on an anonymous spreadsheet, you can't update a person-model; you have to update a system-model ("This sheet is unreliable").

  ### Summary
  You have described a **Socially Extended Transactive Memory System**.

  *   **The Object:** A cognitive artifact (the calendar).
  *   **The Glue:** Not just physical availability, but **delegated endorsement**.
  *   **The Trust:** Directed at the curator (your partner), not the medium (the paper).

  It is distinct from the classic "notebook in the head" theory because the "notebook" is actually a window into someone else's cognitive labor. You aren't remembering the appointment; you are remembering *that she remembered the appointment.*

  If the maintainer becomes anonymous, the system degrades from a **social cognitive extension** into mere **environmental reliance**. You stop thinking *with* a person and start thinking *near* a tool.
