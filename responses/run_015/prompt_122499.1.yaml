prompt: |-
  I'm a print journalist who has covered evolutionary biology on and off for fifteen years, and I've been asked to run a forty-five-minute breakout session at a science-writers' conference this autumn on the units-of-selection dispute: genes, organisms, groups, and whatever else now puts in a claim to be a level. The room will be about twenty-five reporters, editors and freelancers, most of whom cover medicine, environment or technology and last studied biology at school, though two or three have serious genomics or conservation beats. There is a whiteboard and no projector, and a colleague who covers conservation told me last week she had assumed the whole thing was settled decades ago, so I suspect a good half of the room arrives in that state. What I need from you is not an explanation of the debate — I've read the popular treatments and I don't want another one — and not a bibliography or a list of names to read up on, which I have no time for. What I need is a plan for the forty-five minutes: the order the pieces have to come in and why, and in particular what has to be in place before phrases like 'gene's-eye view' or 'group selection' will mean anything to this audience at all, and why that thing cannot be skipped.

  The case I'm considering building the session around is a composite I've been playing with: a clonally transmissible facial tumour in a social, mongoose-like carnivore, passed between animals when they bite each other during feeding contests; the tumour lineage carries its own heritable variation, some lineages grow slowly and keep the host alive and sociable for longer and so reach more new hosts, faster-growing lineages outcompete them inside a single host, and the hosts in turn vary genetically in how readily they accept a graft. I want to know whether that should carry the whole session, and exactly what a carrying case has to have and — as importantly — lack to do this work: my worry is that it is already so strange that people will file it as a medical curiosity rather than see it as a lens on ordinary organisms, and I'm also unsure whether it is better to invent it or to anchor it to the clonally transmissible facial cancer in Tasmanian devils, given that my audience will trust a real story and may treat an invented one as a trick. Relatedly, here is the thought I actually want them to leave with, which I'd like you to check or correct: that much of this dispute is not a disagreement about what happens in nature but about how to do the accounting, that two researchers can partition the same change in the frequency of a trait in two different ways and both be right, and that the genuinely contested part is whether there are cohesive, heritable, variance-generating things above or below the organism at all. What I want them able to do afterwards is open a fresh 'cheater cells' or 'colonies as individuals' paper and ask whether it is reporting a new prediction or a new description. If that is the wrong target for forty-five minutes, tell me what to target instead.

  Then give me the misconceptions this audience will bring or form, in the order they will form them, and the point in the sequence where each should be headed off. My guesses, which I'd like you to correct and add to, are that they will hear 'group selection' as animals sacrificing themselves for the good of the species; that they will take kin selection and multi-level selection to be rival hypotheses with different predictions rather than, as I half-understand it, different ways of cutting the same cake; and that if I say genes are the units they will conclude organisms don't matter. Finally: one question I can put to the room in the last five minutes that would show me they can diagnose a new claim about levels of selection rather than merely repeat my vocabulary, together with the confidently wrong answer they are most likely to give so that I can tell the two apart; what I should openly refuse to explain at this level and say I'm refusing; and which of the ambitions above I should cut.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User:** Experienced print journalist (15 years covering evo bio), running a 45-min breakout session at a science-writers' conference.
      *   **Audience:** ~25 reporters/editors/freelancers. Mostly med/env/tech beats. High school biology level. 2-3 experts (genomics/conservation). One colleague thinks the debate is settled.
      *   **Constraints:** 45 minutes. Whiteboard only (no projector). No lectures/explanations of the debate (user knows it). No bibliographies.
      *   **Goal:** A concrete *plan* (order, timing, rationale). Specifically, what concepts *must* precede terms like "gene's-eye view."
      *   **Core Case Study:** A composite clonally transmissible facial tumor in a social carnivore (mongoose-like). User is debating using this composite vs. real Tasmanian Devil Facial Tumor Disease (DFTD).
      *   **Desired Takeaway:** The dispute is often about *accounting* (partitioning variance), not necessarily contradictory facts. Real contest is about existence of cohesive/heritable entities above/below organism. Goal: Enable them to distinguish new *predictions* vs. new *descriptions* in papers.
      *   **Specific Needs:**
          1.  Session Plan (Order, Timing, Why).
          2.  Case Study Advice (Composite vs. Real, Requirements).
          3.  Takeaway Validation (Is "accounting vs. reality" the right target?).
          4.  Misconception Management (Order of emergence, when to head off).
          5.  Final Diagnostic Question (Right vs. Confidently Wrong answer).
          6.  Refusals (What *not* to explain).
          7.  Ambition Cuts (What to drop).

  2.  **Deconstruct the Challenge:**
      *   **Time:** 45 minutes is *very* short for this topic. It's notoriously dense and semantic.
      *   **Audience:** They think it's settled (Group Selection = Good of Species = False). They equate Gene Selection with Genetic Determinism.
      *   **The "Accounting" Insight:** This is the Lewontin/Price Equation insight. It's abstract. Making it concrete in 45 mins is the hard part.
      *   **The Case Study:** DFTD is real and famous. A composite might seem "made up." However, DFTD is specific. A composite allows tuning variables to fit the pedagogical need. *Decision:* Use the Real (DFTD) but simplify the mechanics to fit the lesson. Trust is paramount for journalists. A "composite" risks the "is this real?" distraction.
      *   **The "Accounting" Takeaway:** This is sophisticated. Is it achievable? Yes, if framed as "Bookkeeping" rather than "War."

  3.  **Drafting the Session Plan (Iterative Process):**
      *   *Initial thought:* Lecture on Price Equation. *Correction:* No, whiteboard only, journalists. Needs narrative.
      *   *Initial thought:* Start with the Tumor. *Correction:* Need to establish what "Selection" normally looks like first to show the deviation.
      *   *Structure:*
          1.  Hook/Setup (The "Settled" Myth).
          2.  The Baseline (Organism Selection).
          3.  The Complication (The Tumor/Cell Level).
          4.  The Reframing (Accounting/Partitions).
          5.  The Diagnostic (Application).
      *   *Crucial Pre-requisite:* Before saying "Gene's Eye View," they need to understand *Replicator vs. Vehicle* (Dawkins/Hull) without using those jargon words. They need to grasp *Heritability* and *Variance*.
      *   *Timing:* 5 min intro, 10 min baseline, 15 min case study, 10 min accounting reframing, 5 min diagnostic.

  4.  **Refining the Case Study:**
      *   *Composite vs. Real:* Journalists smell fiction. If they think you invented the biology, they discount the lesson. Use Tasmanian Devils. It's real, it's transmissible, it's clonal.
      *   *Requirements:* It needs to show conflict *within* the host (cell vs. organism) and conflict *between* hosts (tumor lineage vs. tumor lineage).
      *   *Lack:* Don't get bogged down in MHC genetics unless necessary for the "heritability" point. Keep it about *lineage survival*.

  5.  **Addressing the Takeaway:**
      *   *User's Thought:* "Dispute is about accounting... partitioning change... both be right."
      *   *Verdict:* This is the Okasha/Godfrey-Smith synthesis view. It is correct *mathematically* (Price Equation), but biologically, some partitions are more *causally informative* than others.
      *   *Adjustment:* Don't say "both are right" (implies relativism). Say "both are valid descriptions, but one might yield better predictions." The target "Prediction vs. Description" is excellent. Keep that.

  6.  **Mapping Misconceptions:**
      1.  "Group Selection = Altruism/Species Good." (Head off immediately).
      2.  "Gene Selection = Organisms don't matter." (Head off during the accounting section).
      3.  "Kin vs. Multi-level are enemies." (Head off during the reframing).
      4.  "It's settled." (Head off in Intro).

  7.  **Developing the Diagnostic Question:**
      *   Need a scenario where a paper claims "Group Selection."
      *   *Question:* "A paper says bacteria biofilms evolve via group selection because dead cells help the colony. What do you ask?"
      *   *Right Answer:* "Does the model predict something *different* than individual selection would, or is it just describing the same outcome via group variance?"
      *   *Wrong Answer:* "Group selection is impossible because genes are the unit." (Dogma) OR "Group selection is real because colonies exist." (Dogma).

  8.  **Determining Refusals & Cuts:**
      *   *Refuse:* The Price Equation math. The history of the Wynne-Edwards vs. Williams fight (too much baggage). Hamilton's Rule derivation.
      *   *Cut:* The "Major Transitions in Evolution" deep dive. Specifics of DFTD molecular biology.

  9.  **Review against Constraints:**
      *   Whiteboard only? Yes, plan relies on drawing variance partitions.
      *   45 mins? Tight. Needs strict timekeeping.
      *   Journalist audience? Focus on "How to cover the story," not "How to do the science."

  10. **Final Polish:**
      *   Ensure the tone is peer-to-peer (journalist to journalist).
      *   Make sure the "Accounting" metaphor lands hard.
      *   Clarify why the "Gene's Eye View" needs "Heritability" defined first.

  *(Self-Correction during drafting)*: I initially thought about suggesting the composite tumor. But the user said journalists trust real stories. DFTD is well documented. I should advise using DFTD but *simplified*. The "composite" risk is too high for a skeptical room.
  *(Self-Correction on Takeaway)*: The user wants them to know if a paper is a new prediction or description. This is the "Empirical Equivalence" problem. I need to make sure they understand that *mathematical equivalence* doesn't mean *heuristic equivalence*.

  *(Final check on the "Gene's Eye View" prerequisite)*: You cannot explain the gene's eye view without first establishing that selection requires *heritable variation*. If they think genes = blueprints, they won't get genes = replicators. So, "Replication with Fidelity" must come before "Gene."

