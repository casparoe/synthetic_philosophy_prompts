answer: |-
  Here is a plan for the forty-five minutes, designed for a whiteboard-only room of skeptical generalists.

  ### Part 1: The Session Plan (45 Minutes)

  **0:00–0:05 | The Hook: The "Settled" Myth**
  *   **Action:** Write "UNITS OF SELECTION" on the board. Ask for a show of hands: "Who thinks this debate was settled in the 1970s?" (Expect half the room).
  *   **Point:** Acknowledge the colleague's view. State clearly: "The *math* was settled. The *biology* wasn't. Today is not about who won; it's about how to read the press release when someone claims they've found a new level."
  *   **Why:** You must disarm the "this is old news" defense immediately. If they think it's settled, they won't listen to the nuance.

  **0:05–0:15 | The Prerequisite: Heritability, Not Blueprint**
  *   **Action:** Draw a simple lineage tree on the whiteboard. Parent -> Offspring.
  *   **Concept:** Before you can say "Gene," "Group," or "Tumor," they must understand **Replicator vs. Vehicle** without using those words.
  *   **Script:** "Selection cannot happen unless three things exist: Variation, Fitness Differences, and *Heredity*. If a trait isn't copied, it can't be selected. A 'Unit of Selection' is just a name for whatever thing is doing the copying."
  *   **Why:** This is the non-skippable foundation. If they think genes are "blueprints for building bodies," they will hear "Gene's Eye View" as "Genetic Determinism." They must understand genes (or tumors, or groups) as *things that get copied*.
  *   **Whiteboard:** Draw a circle (Entity). Arrow to next generation. Label "Fidelity."

  **0:15–0:30 | The Case: Tasmanian Devil Facial Tumor Disease (DFTD)**
  *   **Decision:** **Use the Real Story (DFTD), not the Composite.**
  *   **Why:** Journalists operate on trust. If you invent a mongoose-like carnivore, the two genomics experts in the room will whisper "That's not real," and the rest will sense fiction. DFTD is documented, transmissible, and clonal. It is a "cheater cell" lineage that acts like a pathogen.
  *   **Action:** Draw a Host (Devil) containing a Tumor Lineage.
  *   **The Setup:**
      1.  **Level 1 (Cell):** Tumor cells compete *inside* the host. Fast-growing cells win *within* the host.
      2.  **Level 2 (Host):** Hosts die. If the tumor kills the host too fast, the tumor lineage goes extinct (no new hosts to bite).
      3.  **Level 3 (Tumor Lineage):** Tumor lineages compete *between* hosts. Slower-growing lineages might spread further because the host lives longer.
  *   **The Conflict:** What is "fit" here? The fast cell (wins inside) or the slow lineage (wins outside)?
  *   **Why:** This creates an immediate, visceral conflict between levels without invoking "altruism." It forces the audience to ask: "Which one is actually evolving?"

  **0:30–0:40 | The Reframe: Accounting, Not War**
  *   **Action:** Draw a bar chart. Total Change in Trait Frequency.
  *   **Concept:** This is the core takeaway. Divide the bar into two chunks: "Within-Host Change" and "Between-Host Change."
  *   **Script:** "You can describe this entire system by saying 'Cells are selected.' Or you can say 'Tumor Lineages are selected.' Mathematically (via the Price Equation), these are often just different ways of slicing the same bar. The dispute isn't usually about the data; it's about which slice is more *useful* for prediction."
  *   **Why:** This moves them from "Which side is right?" (a fight) to "Which description buys me more insight?" (a tool). This validates your "accounting" thesis.

  **0:40–0:45 | The Diagnostic & Close**
  *   **Action:** Pose the Diagnostic Question (see below).
  *   **Close:** Reiterate the target: "Your job isn't to solve the math. It's to ask the scientist: 'Does this new level predict something the old level couldn't, or does it just describe the same thing differently?'"

  ---

  ### Part 2: The Case Study (Requirements & Risks)

  **Use the Real Tasmanian Devil Story.**
  *   **Why:** A composite case introduces a variable you don't want: *credibility*. In a room of writers, "Did this actually happen?" is a distraction. DFTD is robust enough to carry the load.
  *   **What it must have:**
      1.  **Conflict of Interest:** The interest of the cell (divide fast) must contradict the interest of the lineage (keep host alive).
      2.  **Heritability at Both Levels:** Cells must copy traits to daughter cells; Tumor Lineages must copy traits to new hosts.
      3.  **Bottlenecks:** Transmission events must be rare enough that lineage variance matters.
  *   **What it must lack:**
      1.  **Molecular Detail:** Do not explain MHC suppression. It's a black box. "The tumor evades immunity" is sufficient.
      2.  **Moral Language:** Avoid "selfish," "altruistic," or "cheater" until *after* you've defined the levels. Let the math imply the behavior.

  **Risk:** The audience may file DFTD as a "pathogen" story, not an "organism" story.
  **Mitigation:** Explicitly state: "A clonal tumor lineage *is* an asexual organism. It is born, it reproduces, it dies. If you accept this is a unit of selection, you have accepted that units of selection can exist *inside* the standard organism."

  ---

  ### Part 3: Validating the Takeaway

  **Your Thought:** *"Much of this dispute is not a disagreement about what happens in nature but about how to do the accounting... both be right... genuinely contested part is whether there are cohesive, heritable, variance-generating things above or below the organism at all."*

  **Verdict:** **Keep this, but sharpen the edge.**
  *   **Correction:** Be careful with "both be right." To a journalist, "both are right" sounds like "truth is relative."
  *   **Refinement:** Frame it as **Empirical Equivalence vs. Heuristic Utility.**
      *   *Empirical Equivalence:* Both models fit the past data (the accounting).
      *   *Heuristic Utility:* One model suggests a new experiment or prediction the other misses.
  *   **Target:** Your target ("ask whether it is reporting a new prediction or a new description") is the perfect ambition for 45 minutes. It is actionable. It turns a metaphysical debate into an editorial checklist.

  ---

  ### Part 4: Misconceptions (Order & Interception)

  1.  **"Group Selection = Species Benefit"**
      *   *When:* Minute 5 (Intro).
      *   *Intercept:* Explicitly ban the phrase "Good of the Species." Write "Group Selection ≠ Altruism" on the board. Define Group Selection strictly as "Variance in fitness between groups."
  2.  **"Gene Selection = Organisms Don't Matter"**
      *   *When:* Minute 15 (Prerequisite).
      *   *Intercept:* When defining the "Replicator," state: "The gene is the thing that is copied. The organism is the machine that does the copying. You cannot have one without the other. Saying genes are the unit is not saying organisms are irrelevant; it's saying organisms are the *method*."
  3.  **"Kin Selection vs. Multi-Level are Rival Theories"**
      *   *When:* Minute 35 (Accounting).
      *   *Intercept:* Use the bar chart. Show that Kin Selection partitions the variance by *relatedness*, and Multi-Level partitions by *group membership*. They are often algebraic translations of the same data.
  4.  **"This is Just Semantics"**
      *   *When:* Minute 40 (Close).
      *   *Intercept:* Acknowledge it *is* semantics, but "Semantics dictate funding. If you describe it as 'cancer,' you fund oncology. If you describe it as 'parasitic lineage,' you fund epidemiology. The words choose the tools."

  ---

  ### Part 5: The Diagnostic Question

  **The Question (Last 5 Minutes):**
  "A paper lands on your desk. The authors claim they have proven 'Colony-Level Selection' in a social insect. They show that colonies with more genetic diversity survive longer. What is the *one* question you ask the author to determine if this is a new discovery or just new bookkeeping?"

  **The Confidently Wrong Answer (Dogma):**
  "Is group selection real?" OR "Did you control for kin selection?"
  *(This shows they are stuck in the 1970s debate and view the levels as enemies.)*

  **The Right Answer (Diagnostic):**
  "If you modeled this at the individual level, would you get the same prediction?" OR "Does the colony-level model predict a trait that individual-level selection would forbid?"
  *(This shows they understand the issue is about **predictive power**, not ontological reality.)*

  ---

  ### Part 6: Refusals & Cuts

  **What to Openly Refuse:**
  *   **The Price Equation:** "There is a mathematical proof for this called the Price Equation. I am not going to write it on the board. You do not need it to cover the story. You only need to know that it exists and that it allows the partitioning I just showed you."
  *   **The History:** "I am not going to tell you about Wynne-Edwards or Williams. That is history. You are covering news."

  **What Ambition to Cut:**
  *   **Cut:** The goal of making them understand *Major Transitions in Evolution* (how units merge).
  *   **Why:** That requires understanding how conflict is suppressed (policing, bottlenecks). That adds 20 minutes of complexity. Stick to the *conflict* itself (the DFTD case), not the *resolution* of the conflict.
  *   **Cut:** The distinction between "Soft" and "Hard" selection.
  *   **Why:** Too technical. It muddies the "Accounting" water.

  ### Summary Checklist for the Whiteboard
  1.  **Three Conditions:** Variation, Fitness, Heredity.
  2.  **The Entity:** Host vs. Tumor Lineage.
  3.  **The Bar Chart:** Total Change = Within-Host + Between-Host.
  4.  **The Filter:** Prediction vs. Description.

  If you stick to the bar chart and the DFTD case, you will bypass the "settled science" boredom and give them a tool they can use on Monday morning.
