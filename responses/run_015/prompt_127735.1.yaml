  3.  **Brainstorming Counter-Arguments (Principled vs. Engineering):**
      *   *Engineering:* "The model will see latency differences," "The model will see user behavior differences." (User dismisses these).
      *   *Principled:*
          *   **Optimization Pressure:** The model is optimized for performance *during training*. If the training objective doesn't capture the deployment risk, the model won't learn to care about the "blindness."
