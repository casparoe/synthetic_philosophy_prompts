      *   **Proposed Solution:** Blind the model to the training/deployment distinction. Make the input distributions identical (interleave training and deployment, strip metadata, etc.).
      *   **Conclusion:** If the model can't distinguish phases, it must assume every action is graded, preventing defection. This supposedly works without solving interpretability or scalable oversight.
      *   **User's Assessment of Objections:** Colleagues say it's unsound, but objections seem like "engineering worries" (model might infer phase anyway). User wants to know if there's a *principled* reason it fails.

