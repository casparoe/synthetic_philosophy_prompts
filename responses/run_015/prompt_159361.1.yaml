answer: |-
  # Diagnostic Instrument: Institutional Moral Uncertainty Tree

  **Instructions for the Facilitator:** Hand this sheet to participants. Ask them to answer each question sequentially. If an answer directs them to a "Leaf," they stop and record that view. If they reach Question 8, they record the final Leaf. Do not reveal the Leaf names until the end.

  ### Branch Nodes

  **1. The Allocation Case**
  You control a $100M budget. Credence is 0.6 on near-term health, 0.3 on long-run risk, 0.1 on the view that the money is tainted and must be returned. Do you split the funds proportionally across these options, or commit the whole budget to the single highest-ranking option?
  *   **Split proportionally:** Go to **Leaf A**.
  *   **Commit to one:** Go to **Question 2**.

  **2. The Prohibition Case**
  A proposal has 0.85 credence of producing enormous good, but 0.15 credence of being categorically impermissible (forbidden regardless of consequences). Does the 15% credence in prohibition block the act entirely?
  *   **Yes, it blocks:** Go to **Leaf B**.
  *   **No, it can be overridden:** Go to **Question 3**.

  **3. The Endorsement Case**
  Must an act be permissible according to *every* moral theory you give nontrivial credence to, or is it enough that it scores best in the aggregate?
  *   **Every theory must endorse it:** Go to **Leaf C**.
  *   **Aggregate score is enough:** Go to **Question 4**.

  **4. The Credence Case**
  When aggregating, do you defer to the single theory you find most plausible, or do you weight the value judgments of all theories by your credence in them?
  *   **Defer to the most plausible theory:** Go to **Leaf D**.
  *   **Weight all theories by credence:** Go to **Question 5**.

  **5. The Multi-Trigger Case**
  Five trustees hold divergent credences. Any one can unilaterally launch a deployment; stopping requires near-unanimity. Does this structure require you to raise the evidential bar for each trustee individually, independent of their personal credences?
  *   **Yes, raise the bar:** Go to **Question 6**.
  *   **No, trust individual credences:** Go to **Leaf E**.

  **6. The Risk-Imposition Case**
  Is a moral gamble permissible if the risk falls on the decision-maker, but impermissible if the identical risk falls entirely on unconsenting outsiders?
  *   **Yes, the asymmetry matters:** Go to **Question 7**.
  *   **No, risk is risk:** Go to **Leaf E** (Re-confirmed).

  **7. The Diachronic Case**
  You are drafting a charter. Should it entrench the current trustees' credence distribution against revision, or allow future trustees to update the moral weights by simple majority?
  *   **Entrench current credences:** Go to **Leaf F**.
  *   **Allow revision by successors:** Go to **Question 8**.

  **8. The Variance Case**
  If two acts have the same expected moral value and the same worst-case outcome, but one has high variance (boom or bust) and the other is stable, does the variance itself count against the act?
  *   **Yes, avoid variance:** Go to **Leaf G**.
  *   **No, variance is irrelevant:** Go to **Leaf H**.

  ---

  ### Leaves (Diagnosed Views)

  **Leaf A: Fractional-Compliance View**
  *Gloss:* Satisfy each moral theory proportionally by splitting resources, time, or randomization across their conflicting prescriptions.
  *Awkward Commitment:* May require deliberately diluting impact by funding projects that some of your own credences deem wasteful or harmful.

  **Leaf B: Categorical-Veto View**
  *Gloss:* A theory's deontological prohibition retains veto force above a low credence threshold, blocking acts regardless of aggregate expected good.
  *Awkward Commitment:* Allows a tiny minority credence (e.g., 5%) to paralyze action even when the expected benefit is astronomically high.

  **Leaf C: Unanimous-Endorsement View**
  *Gloss:* An act is admissible only if every theory assigned nontrivial credence could endorse it from within its own framework.
  *Awkward Commitment:* Likely to result in systematic inaction when moral theories are mutually incompatible or fundamentally disagree on permissibility.

  **Leaf D: Deference-to-Highest-Credence View**
  *Gloss:* Ignore all theories except the single one you currently assign the highest probability of being true.
  *Awkward Commitment:* Ignores significant moral risk; a 49% credence that an act is a catastrophe counts for nothing against a 51% credence it is good.

  **Leaf E: Expected-Choiceworthiness Maximization**
  *Gloss:* Calculate the expectation of moral value across all theories weighted by credence and choose the act with the highest sum.
  *Awkward Commitment:* May require committing to an act that most individual theories deem impermissible if the aggregate score is high enough.

  **Leaf F: Maximin Across Theories**
  *Gloss:* Choose the act that secures the best worst-case outcome across the set of live moral theories.
  *Awkward Commitment:* Highly conservative; may force you to ignore enormous probable gains to avoid a low-probability catastrophic floor.

  **Leaf G: Variance-Averse Hedging**
  *Gloss:* Trade off some expected moral value to reduce the variance or spread of possible moral outcomes across theories.
  *Awkward Commitment:* Requires sacrificing guaranteed expected good merely to stabilize the moral profile of your decision.

  **Leaf H: Revisable Aggregation**
  *Gloss:* Maximize expected choiceworthiness but treat the credence weights as institutional variables subject to future democratic revision.
  *Awkward Commitment:* Creates a tension between doing what is currently right and binding your successors to your current moral epistemology.

  ---

  ### Logical Space Analysis (For the Philosopher)

  **Unoccupied Cells:**
  1.  **Variance-Averse Hedging + Entrenchment:** This cell is logically unstable. Hedging usually implies a desire to minimize regret across *possible* future states (including future moral knowledge). Entrenching current credences contradicts the motivation to hedge against the risk that current credences are wrong. I have routed this combination to **Leaf F (Maximin)** in the tree, as entrenchment typically signals a focus on securing a floor rather than smoothing variance.
  2.  **Unanimous Endorsement + Multi-Trigger Unilateralism:** If you require unanimity across theories (Leaf C), you cannot consistently support a structure where one trustee acts unilaterally (Question 5). This combination is incoherent; the tree forces a choice at Node 3 before reaching Node 5.
  3.  **Fractional Compliance + Categorical Veto:** If you split the action (Leaf A), you are by definition not allowing a veto to block the whole action (Node 2). These are mutually exclusive strategies for handling conflict.

  **Indistinguishable Leaves:**
  *   **Leaf E (ECM) and Leaf H (Revisable Aggregation):** The tree separates these only at Node 7 (Diachronic). However, standard Expected-Choiceworthiness Maximization is technically neutral on institutional design. A participant who answers "Maximize Expectation" on moral theory but "Entrench" on diachronic questions will be forced to **Leaf F** or **Leaf E** depending on pathing. The tree treats "Revisable Aggregation" as a distinct institutional leaf, but philosophically it is just ECM applied to a dynamic context. Score them as ECM with an institutional addendum.
  *   **Leaf F (Maximin) and Leaf G (Hedging):** These are separated at Node 8 (Variance). However, in many practical cases, maximizing the floor (Maximin) and minimizing variance (Hedging) recommend the same acts. If a participant answers inconsistently here (e.g., "Raise Bar" but "Variance Irrelevant"), they likely hold a hybrid view. Score as **Hedging** if they prioritize variance; score as **Maximin** if they prioritize the floor.

  ### Scoring Protocol

  **Collapsing Patterns:**
  *   **The "Pure Aggregator":** Answers "Commit," "Override," "Aggregate," "Weight," "No Bar," "Symmetric," "Revise," "Irrelevant." -> **Leaf E**.
  *   **The "Institutional Hedger":** Answers "Commit," "Override," "Aggregate," "Weight," "Raise Bar," "Asymmetric," "Revise," "Avoid Variance." -> **Leaf G**.
  *   **The "Early Exit":** Participants who exit at Questions 1–4 (Leaves A–D) have not answered the Institutional Cases (Questions 5–7).
      *   *Scoring Note:* For Early Exits, record the Moral View (A–D) but mark the Institutional Dimension as **Undiagnosed**. Do not assume an ECM theorist (Leaf E) and a Fractional Compliance theorist (Leaf A) share the same view on Diachronic entrenchment.

  **Inconsistency Handling:**
  *   **Veto vs. Split:** If a participant answers "Split" at Q1 but "Veto" at Q2, they have contradicted themselves (you cannot split if a veto blocks the action). **Action:** Prompt them to revisit Q1. If they insist, score as **Leaf B (Veto)**, as veto power logically precludes splitting.
  *   **Unanimity vs. Multi-Trigger:** If a participant answers "Unanimity" at Q3 but "No Bar" at Q5, they are inconsistent. **Action:** Score as **Leaf C (Unanimity)**, as the moral constraint (Q3) overrides the institutional mechanism (Q5).
  *   **ECM vs. Entrenchment:** If a participant answers "Weighted Aggregation" (ECM) at Q4 but "Entrench" at Q7, they are philosophically tense (binding successors contradicts updating credences). **Action:** Score as **Leaf F (Maximin)**, as entrenchment functions as a conservative constraint similar to Maximin in practice.

  **Workshop Usage:**
  Use the "Undiagnosed" status for Early Exits to spark discussion: *"You chose to split the funds, but does that split remain fixed for 50 years, or can your successors change it?"* This forces the institutional dimension onto the moral view, fulfilling the chapter's core complaint.
