      *   *Ranking the Cases:*
          *   1st (Best): Case 3 (The Choir). Why? The feeling happens *in the transmission*.
          *   2nd (Middle): Case 2 (The Curator). Why? Sincerity exists, but the "labor" is suspect.
          *   3rd (Worst): Case 1 (The Prompt). Why? Zero sincerity. Pure counterfeit.
      *   *Deep Dive into Cases:* For each, explain the "swallow" (what they have to accept) and distinguish theory vs. extrapolation.
      *   *The Big Picture:* Address the Democratization vs. Mechanization paradox. AI is the "Professionalization" he hated, scaled to infinity. It's not the realization of his dream; it's the caricature of it.
      *   *Philosophical Payoff:* Connect back to the user's PhD topic (value without felt emotion). Tolstoy says "No value." That's the bite.

  6.  **Refining the Argument (Self-Correction during drafting):**
