      *   *Correction on Case 2:* Tolstoy hates the "division of labor" in art. The curator outsourcing the mark-making to a machine is the ultimate division of labor. I need to highlight this.
      *   *Correction on Case 3:* Tolstoy distinguishes between the work and the performance. But for music, the performance is often the work. If the singers feel it, they are the artists. The AI is just the composer (and a bad one). But if the singers transmit *their* feeling using the AI tune, the AI tune is just a vessel. This is the strongest case.

  7.  **Final Polish:** Check tone. Ensure I'm not just summarizing Tolstoy but applying him rigorously. Make sure the distinction between "Theory" and "Extrapolation" is clear. (e.g., Tolstoy explicitly talks about sincerity; he doesn't talk about algorithms, so the application to AI is extrapolation based on his principles regarding machinery/industry).

  8.  **Final Review against constraints:** No chapter numbers/citations. Argument focused. Ranked. Distinction made.

  *(Self-Correction during final review)*: Make sure to address the user's specific PhD angle: "whether an artwork's value can survive there being nobody who felt anything while making it." Tolstoy is the ultimate "No" to this. That is the key takeaway for their chapter.

