answer: |-
  **Subject: Re: Intuition behind KS Individual Monotonicity**

  **Alex:**
  Honestly, I'm still way more sold on Kalai-Smorodinsky than Nash after this week. The Individual Monotonicity axiom just feels normatively right. If the feasible set expands in my favor—meaning my utopia point goes up while yours stays fixed—why should I ever end up worse off? It captures the idea that having more opportunities shouldn't punish you. Nash's IIA feels too rigid by comparison; it ignores how the *shape* of the frontier changes relative to the ideal points.

  **Sam:**
  I get the appeal, and yeah, monotonicity is intuitive *if* you hold everything else constant. But that's the rub for me. The axiom assumes the disagreement point $d$ is fixed while the feasible set $S$ expands. In real negotiations, $d$ is often endogenous. If the feasible set expands, agents might reframe the status quo. 

  Think about it: if the potential surplus grows dramatically for you, my perceived fallback position might actually weaken because walking away looks comparatively worse than it did before. If $d$ shifts downward for me as $S$ expands for you, the KS solution line connects a new utopia point to a worse disagreement point. That could easily pivot the solution such that I lose out, even though the set expanded. It breaks the monotonicity guarantee.

  **Alex:**
  That's a fair empirical observation, but I think you're mixing up the model inputs with the solution concept. In the formal setup, $(S, d)$ is the problem definition. If the expansion of $S$ causes the agents to re-evaluate $d$, that's a change in the utility representation or the game structure itself, not a failure of the KS solution. 

  The axiom is asking: "Given a specific status quo and a specific set of possible agreements, what's the fair split?" If the context changes so much that the status quo utility changes, you're literally solving a different bargaining problem. We can't blame the solution concept for failing when we swap out the inputs mid-stream. The monotonicity axiom is about comparative statics on the feasible set, holding preferences and threats constant.

  **Sam:**
  But can we actually hold them constant? That's my pushback. In standard theory, we treat $S$ as purely technological constraints and $d$ as fixed outside options. But in practice, the "feasible set" isn't just physical constraints; it's perceived opportunities. And those perceptions directly construct the threat point. 

  If I know you *could* have gotten way more (a higher utopia point), but we didn't agree, my punishment for disagreement feels heavier. The expansion of $S$ changes the psychological weight of $d$. If we force that into the utility function like you suggest, we're assuming agents can cleanly separate "what is possible" from "what happens if we fail." I don't think negotiators do that. They see the expanded set and immediately update their view of the status quo. If the model can't capture that interdependence without calling it a "different game," does the axiom have any predictive power?

  **Alex:**
  I see what you're saying—you want the model to internalize the framing effects. But if we let $d$ move whenever $S$ moves, we lose the ability to isolate the effect of bargaining power versus opportunity. The strength of KS is that it tells us how to divide gains *given* a certain balance of threats. 

  If framing effects shift $d$, that's crucial, but it belongs in the stage before we apply the solution concept. We should model how $S$ influences $d$ separately, then feed the resulting $(S, d')$ into KS. If we build that dependency directly into the monotonicity axiom, the solution becomes path-dependent and maybe even indeterminate. I'd rather keep the axiom clean and acknowledge that estimating the true $d$ is the hard empirical part.

  **Sam:**
  Maybe "clean" is the problem though. If the clean version assumes a separation that doesn't exist in the wild, are we just solving for a world that isn't there? I'm not saying KS is useless, but that monotonicity axiom feels fragile when the "irrelevant" context of the feasible set bleeds into the disagreement point. It works mathematically, sure, but normatively? If expanding the pie makes one person's fallback look so bad that they accept less than before, calling that "non-monotonic" feels like ignoring the real mechanism at play.

  **Alex:**
  Touché. Maybe the compromise is that KS works for institutional settings where $d$ is contractually fixed, but breaks down in informal negotiations where framing is fluid. I'll concede that the endogeneity of $d$ is a major limitation for applying this outside the lab.

  **Sam:**
  Yeah, that sounds right. It's a robust solution for a specific type of problem, just maybe not all of them. Anyway, good point on keeping the inputs distinct for clarity's sake—I just worry we sweep the interesting dynamics under the rug by calling them "exogenous."
