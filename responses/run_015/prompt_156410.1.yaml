      *   **Influence vs. Identity:** This is the crux. If I adopt my father's mannerisms, am I partly him? Usually, we say no, I'm just me influenced by him. For Hofstadter, if the pattern is sufficiently complex and autonomous, it might count as a "token" of the same "type."
