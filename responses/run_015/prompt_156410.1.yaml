  3.  **Evaluate the Philosophical Issues:**
      *   **Hofstadter's View:** In *I Am a Strange Loop* and *Metamagical Themas*, Hofstadter suggests the "self" is a abstract pattern (a "strange loop") that can be carried by multiple substrates. He explicitly talks about carrying fragments of loved ones within us. He does *not* require neural overlap; he emphasizes functional/isomorphic pattern replication.
