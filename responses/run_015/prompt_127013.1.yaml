  # Diagnostic Instrument: The Vagueness Logical Space Classifier

  ## Part I: Glossary of Terms
  *   **Extension:** The set of objects to which a predicate applies (e.g., the set of all *tall* people).
  *   **Sharp Boundary:** A boundary where for any object, it is determinately true or determinately false that it lies on one side or the other; no borderline cases exist in the extension itself.
  *   **Precisification:** A way of making a vague predicate precise (e.g., defining *tall* as *over 180cm*).
  *   **Supertruth:** Truth on all admissible precisifications (Supervaluationism).
  *   **Subtruth:** Truth on at least one admissible precisification (Subvaluationism).
  *   **Truth-Value Gap:** A statement that is neither true nor false.
  *   **Truth-Value Glut:** A statement that is both true and false.
  *   **Tolerance Principle:** The claim that a sufficiently small change in a magnitude (e.g., removing one grain of sand) cannot change the application of a predicate (e.g., from *heap* to *non-heap*).
  *   **Higher-Order Vagueness:** Vagueness about where the boundary of vagueness lies (e.g., is this case *definitely tall* or *borderline tall*?).
  *   **Ontic Indeterminacy:** Indeterminacy located in the world/objects themselves, not just in language or thought.
  *   **Epistemic Indeterminacy:** Indeterminacy located in our knowledge; the facts are sharp, but we cannot know them.

  ---

  ## Part II: The Decision Tree (8-Question Sorting Quiz)

  **Instructions:** For each node, select the claim that best matches your verdict on the case or the structural commitment you are willing to endorse. Follow the path to a Leaf Position.

  **Node 1: The Metaphysical Location (The Cloud Case)**
  *Case:* Consider a cloud. There is no precise spatial point where the water vapor stops being "part of the cloud" and starts being "atmosphere."
  *   **A:** The indeterminacy is in the world; the cloud itself has no precise spatial boundary. (Go to Node 2)
  *   **B:** The indeterminacy is in our representation; the water droplets are either in or out, but our predicate *cloud* fails to draw the line. (Go to Node 3)

  **Node 2: Ontic Commitment**
  *Claim:* If you chose 1A, do vague objects exist?
  *   **A:** Yes, objects can have indeterminate identity or boundaries. (Leaf: **Ontic Indeterminacy**)
  *   **B:** No, if objects were vague, logic would break; therefore, vague predicates fail to refer to any object at all. (Leaf: **Nihilism / Error Theory** [Extra 1])

  **Node 3: The Existence of Extension (Nihilism Check)**
  *Claim:* Does the predicate *tall* have an extension (a set of things that are tall)?
  *   **A:** No, there are no tall things; the predicate is empty. (Leaf: **Nihilism / Error Theory** [Extra 1])
  *   **B:** Yes, there is an extension, but its nature is disputed. (Go to Node 4)

  **Node 4: The Sharpness of Extension (The Busy-Beaver Case)**
  *Case:* Define *flurg* as "a number $n$ such that $n < \Sigma(10)$," where $\Sigma$ is the Busy-Beaver function. The cutoff is a specific integer, but no algorithm can compute it.
  *   **A:** There is a perfectly sharp cutoff integer, even if it is humanly and computably unknowable. (Go to Node 5)
  *   **B:** If the cutoff is unknowable in principle, there is no fact of the matter; the extension is not a sharp classical set. (Go to Node 6)

  **Node 5: The Source of Ignorance (Epistemic Check)**
  *Claim:* Regarding the *flurg* cutoff, is our ignorance due to a lack of semantic content or a lack of evidence?
  *   **A:** The content is sharp; we lack evidence. The boundary is semantic but epistemically inaccessible. (Leaf: **Epistemicism**)
  *   **B:** The content itself is indeterminate; "flurg" does not pick out that specific integer. (Go to Node 6)

  **Node 6: Contextual Stability (The Cooperative Sorting Case)**
  *Case:* Two competent speakers, Alice and Bob, have slightly different thresholds for *tall*. They must sort a series of men together and agree on a verdict for each.
  *   **A:** To agree, they must implicitly adjust the content of *tall* (the standard shifts) during the conversation. (Leaf: **Contextualism**)
  *   **B:** The content remains fixed; they either converge on the truth, or one is wrong, or the verdict is indeterminate. (Go to Node 7)

  **Node 7: The Truth-Value of Borderlines**
  *Claim:* For a clear borderline case (e.g., a man of average height), what is the truth value of "He is tall"?
  *   **A:** It is neither true nor false (Gap). (Go to Node 8)
  *   **B:** It is both true and false (Glut). (Leaf: **Subvaluationism**)
  *   **C:** It is true to a specific degree between 0 and 1 (Degree). (Leaf: **Degree-Functional / Fuzzy Semantics**)

  **Node 8: Logical Consequence and Higher-Order Vagueness**
  *Claim:* Regarding the Gap view (Node 7A), how do we handle validity and the boundary of the gap?
  *   **A:** We preserve classical validity (e.g., Excluded Middle holds for supertruth), but the boundary between "gap" and "true" is itself sharp. (Leaf: **Supervaluationism (Global)**)
  *   **B:** We reject classical validity (e.g., Conditional Proof fails) to allow the boundary between "gap" and "true" to be unsharp. (Leaf: **Supervaluationism (Local)**)
  *   **C:** We assign degrees of truth to the claim "It is supertrue," allowing the boundary to be fuzzy. (Leaf: **Degree-Supervaluation Hybrid** [Extra 2])

  ---

  ## Part III: Scoring Key and Leaf Diagnostics

  ### Leaf Positions

  1.  **Ontic Indeterminacy:** (Path 1A → 2A). Indeterminacy is worldly. Logic may need revision (e.g., quantum logic) or acceptance of indeterminate identity.
  2.  **Nihilism / Error Theory:** (Path 1A → 2B OR 3A). Vague predicates do not successfully refer; positive assertions using them are false.
  3.  **Epistemicism:** (Path 1B → 3B → 4A → 5A). Classical logic holds. Extensions are sharp. Vagueness is purely ignorance of sharp boundaries.
  4.  **Contextualism:** (Path 1B → 3B → 4B → 6A). Content shifts dynamically to resolve disagreement or Sorites pressure.
  5.  **Subvaluationism:** (Path 1B → 3B → 4B → 6B → 7B). Borderline cases are gluts (true and false). Tolerance is acceptable; Sorites blocked by paraconsistent logic (failure of Adjunction or MP).
  6.  **Degree-Functional / Fuzzy:** (Path 1B → 3B → 4B → 6B → 7C). Truth is continuous. Sorites blocked because the inductive step has a truth value < 1.
  7.  **Supervaluationism (Global):** (Path 1B → 3B → 4B → 6B → 7A → 8A). Truth is supertruth (true on all precisifications). Classical validity preserved. Tolerance is false. Higher-order vagueness is problematic (sharp boundaries of gaps).
  8.  **Supervaluationism (Local):** (Path 1B → 3B → 4B → 6B → 7A → 8B). Truth is defined locally on precisifications. Classical validity lost (e.g., $A \to A$ may fail if $A$ is borderline). Handles higher-order vagueness better.
  9.  **Degree-Supervaluation Hybrid:** (Path 1B → 3B → 4B → 6B → 7A → 8C). [Extra 2] Combines precisifications with degrees of truth to smooth higher-order boundaries.

  ### Empty Cell Diagnosis (Combinations Permitted by Tree but Unoccupied)

  *   **Ontic + Sharp Extension (1A + 4A):** *Incoherent.* If the indeterminacy is in the object, the extension cannot be a sharp classical set.
  *   **Epistemic + Contextual (5A + 6A):** *Unattractive/Redundant.* If the boundary is sharp and fixed (Epistemic), there is no semantic content to shift contextually.
  *   **Subvaluation + Sharp Extension (7B + 4A):** *Incoherent.* Gluts imply the extension is not a classical set (which requires bivalence).
  *   **Supervaluation + Sharp Higher-Order (8A):** *Contested.* Global Supervaluationism is often criticized for merely pushing the sharp boundary up one order (the boundary between true and gap is sharp). Some proponents accept this; others move to Local or Hybrid to avoid it.

  ### Unseparated Leaves (Instrument Limitations)

  *   **Supervaluationism (Global) vs. Epistemicism:**
      *   *Status:* **Unseparated on Sorites Blocking.** Both views reject the Tolerance Premise as false (Epistemic: there is a cut-off; Global: not supertrue).
      *   *Differentiation:* The instrument separates them at **Node 4 (Busy-Beaver)**. Epistemicism asserts a sharp cutoff exists despite uncomputability; Supervaluationism denies the fact of the matter exists.
      *   *Residual:* If a student accepts sharp cutoffs *but* denies we can assert them (a "modest epistemicism"), they may map to Supervaluationism. This is a substantive disagreement about the nature of truth, not merely verbal.
  *   **Supervaluationism vs. Contextualism:**
      *   *Status:* **Unseparated on Disagreement (Node 6).** Both can model "accommodation." Supervaluationism treats it as selecting a precisification; Contextualism as changing content.
      *   *Verdict:* **Substantive.** Contextualism posits a multiplicity of contents; Supervaluationism posits one content with multiple extensions. The instrument flags this at Node 6, but empirical data on conversation may not distinguish them cleanly.

  ---

  ## Part IV: Epistemic Status and Critique of Assumptions

  ### Epistemic Status of Branches
  *   **Settled:** The distinction between Ontic (Node 1) and Semantic representations is standard. The mapping of Degree-Theories to Node 7C is uncontroversial.
  *   **Contested:**
      *   **Node 8 (Global vs. Local):** The distinction rests on technical definitions of validity. Many introductory texts conflate them. I have separated them because they occupy different logical cells (preservation of Classical Validity vs. Truth-Functionality).
      *   **Node 5 (Epistemicism):** Whether "unknowable sharp boundaries" count as "sharp" is the core fight between Epistemicists and Semanticists. The instrument forces a choice, but the literature contains "quasi-epistemic" views that blur this.
      *   **Node 7 (Subvaluation):** The mapping of Subvaluationism to "Gluts" is standard, but the mechanism for blocking Sorites is debated (see below).

  ### Critique of User Assumptions

  **1. Assumption: "Subvaluationism keeps the tolerance premises and blocks the argument by giving up... modus ponens."**
  *   **Verdict:** **Contested/Imprecise.**
  *   **Correction:** Subvaluationism (e.g., Hyde 1997) typically operates in a paraconsistent logic (like LP). In LP, Modus Ponens *fails* for the material conditional. However, some subvaluationists argue Tolerance is *true* (as a glut), not just "kept." The Sorites is blocked because the inference from True Premises to True Conclusion is not valid when gluts are involved (specifically, the argument form is invalid, or Adjunction fails).
  *   **Instrument Adjustment:** Node 7/8 focuses on the Truth-Value (Glut) rather than the specific rule failure, as the rule failure depends on which conditional is chosen. I have flagged this in the Leaf Diagnosis.

  **2. Assumption: "Supervaluationism preserves classical consequence and abandons the tolerance premises."**
  *   **Verdict:** **Settled for Global, False for Local.**
  *   **Correction:** Global Supervaluationism preserves classical validity ($\Gamma \models \phi$) but abandons truth-functionality. Local Supervaluationism preserves truth-functionality but abandons classical validity (e.g., $A \to A$ is not valid if $A$ can be gappy).
  *   **Instrument Adjustment:** Node 8 explicitly splits Global (Classical Validity) from Local (Non-Classical Validity) to capture this logical space accurately.

  **3. Assumption: "Case 1 (Busy-Beaver) distinguishes Sharpness from Indeterminacy."**
  *   **Verdict:** **Settled.** This is the canonical test for Epistemicism. If a student says "There is a fact but we can't know it," they are committed to Epistemicism. If they say "No fact," they are Semantic. This is the cleanest branch in the tree.

  **4. Assumption: "Case 3 (Cooperative Sorting) separates Content from Truth."**
  *   **Verdict:** **Contested.**
  *   **Correction:** As you suspected, this does not separate cleanly. Contextualists say content shifts. Supervaluationists say the *context* selects a precisification (which looks like a content shift). Epistemicists say one speaker is wrong.
  *   **Instrument Adjustment:** Node 6 forces a choice ("Content shifts" vs. "Fixed content"), but I have flagged in the Unseparated Leaves section that empirical data here is ambiguous between Contextualism and Supervaluationist "precisification selection."

  **5. Assumption: "Load-bearing branches are Sharpness, Slack Type, Higher-Order, Sorites."**
  *   **Verdict:** **Mostly Correct, with one addition.**
  *   **Correction:** You omitted **Ontic vs. Semantic** as a primary branch. In a Phil/CS seminar, this is crucial (especially for CS students dealing with fuzzy control vs. ontological modeling). I have made this Node 1. Without it, Ontic Indeterminacy has no home.
  *   **Addition:** I added **Nihilism** as an extra leaf because Node 3 (Existence of Extension) is a live option in the literature (Unger) that is logically distinct from "Semantic Indeterminacy."

  ### Justification for Extra Leaves
  1.  **Nihilism / Error Theory:** Added because Node 3 (Existence of Extension) creates a logical possibility where the extension is empty. This is distinct from Epistemicism (extension exists, unknown) and Semanticism (extension exists, unsharp). It occupies a unique cell: *No Extension.*
  2.  **Degree-Supervaluation Hybrid:** Added at Node 8C. Standard Supervaluationism struggles with Higher-Order Vagueness (the boundary of the gap is sharp). This hybrid assigns degrees of supertruth, smoothing the higher-order boundary. It occupies a unique cell: *Gaps + Degrees of Supertruth.*

  ### Final Note on Instrument Validity
  This instrument maps **logical commitments**, not **intuitions**. A student may find Epistemicism "unattractive" (Node 5), but if they affirm the Busy-Beaver cutoff is sharp (Node 4), the instrument classifies them as Epistemicists. This ensures the diagnosis reflects the structure of their position, not their aesthetic preferences.
