          *   (5) If only Outer: Self-reference needs Frame. (Plausible).
          *   (6) If only Inner: Explicit content is noise. (Plausible).
      *   *(7): Distribution.* Meaning is distributed. (This is the critical pivot).
      *   *(8): Sensitivity.* Altering a layer alters meaning. (Seems to follow from 7).
      *   *(9): Translation Problem.* Translation changes Frame (syntax/grammar) but aims to preserve Meaning. If (8) is true, Translation changes Meaning.
