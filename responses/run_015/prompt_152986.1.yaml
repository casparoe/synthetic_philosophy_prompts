prompt: |-
  hey can you write a satirical internal memo, about 600 words, from the CEO of a made-up hospital network called VitalEnd Solutions? they're rollling out a 'tiered death certification' program that treats brain death as the 'Premium' package and circulatory death as the 'Basic' package, with different billing codes and family notifcation schedules. the joke should come from actually getting the philosophy right — the memo should accidently expose that brain-dead patients can still have functioning heart and lungs, that the 'whole brain' criterion is kind of arbitrary, and that choosing between neurological and cardiopulmonary criteria is really a hidden value call about whether consciousness or biological integration is what matters. include a section on 'Extended Warranty' for patients who stay on ventilators after being declared dead, and a customer satisfaction survey asking familes whether they felt the death was 'authentic enough'. keep the voice totally deadpan corporate, like real hospital admin speak. don't cite anyone, just build the absurdity out of the concepts themselves.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Topic:** Satirical internal memo from the CEO of "VitalEnd Solutions" (a made-up hospital network).
      *   **Subject:** Rolling out a "Tiered Death Certification" program (Brain Death = Premium, Circulatory Death = Basic).
      *   **Key Themes/Jokes:**
          *   Brain-dead patients still have functioning hearts/lungs (biological integration vs. consciousness).
          *   The arbitrariness of the "whole brain" criterion.
          *   The hidden value judgment (consciousness vs. biology).
          *   "Extended Warranty" for ventilated dead patients.
          *   Customer satisfaction survey asking if the death felt "authentic enough."
      *   **Tone:** Deadpan corporate/hospital admin speak (bureaucratic, euphemistic, efficiency-focused).
      *   **Length:** About 600 words.
      *   **Constraint:** Do not cite anyone; build absurdity from concepts themselves.

  2.  **Determine the Voice:**
      *   Needs to sound like a generic CEO memo: "Synergy," "optimization," "stakeholders," "deliverables."
      *   Must treat death as a product/service line.
      *   Must avoid overt laughter; the humor comes from the horror of the logic presented as normal business practice.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the goal (optimizing end-of-life workflows, monetization opportunities).
      *   **The Core Concept (Tiered Death):** Explain Basic vs. Premium.
          *   *Basic:* Circulatory. Old school. Heart stops. Cheap.
          *   *Premium:* Neurological. Heart still beating. High tech. Expensive.
          *   *The Philosophical Slip-up:* Acknowledge that Premium patients are biologically alive but socially dead. Frame this as a feature, not a bug.
      *   **Billing & Notification:** Different codes. Different timelines for telling the family (Premium gets more time to process the ambiguity).
      *   **Extended Warranty:** Keeping the body on machines after declaration. Upselling organ viability or just "presence."
      *   **Feedback/Survey:** The "Authenticity" metric.
      *   **Closing:** Call to action, focus on margins.

  4.  **Drafting - Content & Refinement (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Hey team, we are changing how we call death. Basic is heart stop. Premium is brain stop. Premium costs more because the heart still beats. It's confusing but profitable. We have a warranty for keeping them warm. Ask families if it felt real. Thanks.
      *   *Critique 1:* Too blunt. Needs more corporate jargon to mask the horror. Needs to hit the philosophical points about consciousness vs. integration.

      *   *Attempt 2 (Adding Jargon):* To: All Staff. From: CEO. Subject: Q3 Mortality Optimization. We are segmenting our cessation of vital functions. Tier 1 is Cardiopulmonary. Tier 2 is Neurological. Tier 2 allows for continued hemodynamic stability which looks better for the family but requires more billing codes. We need to decide if the person is the mind or the body. We will charge for the ambiguity.
      *   *Critique 2:* Better. Now expand to meet word count and specific prompt requirements (Extended Warranty, Survey, specific philosophical nods).

      *   *Attempt 3 (Fleshing out the Philosophy):* Make sure to mention that the "whole brain" standard is a choice we are making for efficiency. Highlight that Premium patients are warm and pink (biological integration) but we say they are gone (consciousness).

