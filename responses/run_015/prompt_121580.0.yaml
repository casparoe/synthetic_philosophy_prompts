prompt: |-
  Hi — I work on the data team of a small consortium that publishes a shared authority file for museum and archive catalogs: people, corporate bodies, places, works, one record per entity, everybody downstream pulls from our URIs. What actually fills our week is merge proposals — two records that might be the same person, firm, or place, and someone has to decide whether they become one record or just get linked. It's maybe 20–40 of these a week, they're triaged by rotating catalogers and two interns who have about five to ten minutes each and no research time, and anything irreversible has to be signed off by our senior editor, who is a career librarian, extremely patient, and will not read a line of philosophy. Bad merges are quietly catastrophic because other institutions have already copied the URI and we can't recall it. I also suspect part of the problem is that we currently just use owl:sameAs for every kind of connection we make.

  I did a philosophy minor years ago and halfway through a lunch argument with a colleague I dredged up Frege's puzzle about identity — the morning star/evening star sort of case, where an identity statement can be a genuine discovery and tell you something, while the trivial self-identity tells you nothing, even though both are about one and the same thing. My colleague says this has nothing whatsoever to do with our work: if two records refer to the same thing, obviously they should be one record. I think he's wrong, but I can't turn the intution into something my team could actually run, and "be careful about sense and reference" is not instructions anyone can follow. So what I want is a procedure: an ordered checklist in words that a cataloger with zero philosophy can run on a merge proposal in under ten minutes, with what counts as a sufficient answer to each question, clear STOP-with-a-no points, and clear "hand this to a human because it's a values call rather than a fact" points.

  Some things I think have to survive the translation, though please organize it however is actually right rather than following my list: identity always being identity *under a sortal* (the same person, the same legal entity, the same continuing brand, the same city, the same river — so if no single sortal covers both records, that's a relation, not a merge); a distinction between terms that rigidly tag one thing whether or not any description happens to fit (a personal name, a registry number) and flaccid role-descriptions like "the director", "the artist of this work", "the firm then trading as X", which can be true of different things at different times and probably shouldn't be merged with anything, only time- or role-indexed; and the case where an identification is true but definitely informative — a notname finally attached to a named painter, a pen name, a maiden name — where I take it the merge is fine at the level of reference but rewriting every older sentence that used the other name is not. For that last part I want an actual test my catalogers can run in their heads for when swapping one term for another is unsafe: belief reports, quotations, attributions, "the artist of", modal and temporal contexts, and cases where the source was simply mistaken or the thing referred to doesn't exist. Give me a small set of test sentences with the verdict for each, and say which verdicts are judgment calls dressed up as rules. Also tell me plainly what the procedure cannot do, and separately flag where a wrong merge fails *silently* downstream instead of loudly — that's the bit I actually lie awake about.

  Then please run it on three cases. (1) A proposal to merge a record for an anonymized fifteenth-century painter known only by a conventional nickname — say "Master of the Blue Annunciation", I'm making that up — with a record for a named artist, on the strength of one recent attribution that maybe half the field accepts. (2) A proposal to merge the record for a manufacturing company that was absorbed into a larger firm in a merger and whose name lived on afterwards as a brand: same entity or not, and if "not", what do we put there instead? (3) The one I already know you'll annoy me on: our objects database has a painting whose own historic catalog card attributes it to a famous old master, current scholarship gives it to a pupil in his workshop, and the marketing team wants it merged into the famous painter's record so it surfaces in search on the site. If the procedure says no, I need one paragraph I can paste to the marketing people explaining why, and it can't use the words "sense", "reference", or "opaque". Long answers and bullet points very welcome, and please don't assume I remember any of the terminology.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Data team member at a small consortium publishing a shared authority file (people, corporate bodies, places, works).
      *   **Problem:** High volume of merge proposals (20-40/week), limited time per decision (5-10 mins), low expertise (interns/rotating catalogers), high stakes (bad merges are catastrophic/irreversible downstream).
      *   **Current Issue:** Over-reliance on `owl:sameAs` for everything.
      *   **Philosophical Insight:** User knows Frege (Sense/Reference), Sortals, Rigid Designators vs. Descriptions. Colleague dismisses this as irrelevant. User wants to translate this into a *practical procedure*.
      *   **Requirements:**
          *   Ordered checklist (under 10 mins).
          *   Clear STOP points (Hard No).
          *   Clear ESCALATION points (Values call/Senior Editor).
          *   Specific concepts to preserve: Identity under a sortal, Rigid vs. Flaccid designators, Informative identity (names/aliases) vs. Unsafe substitution.
          *   Test sentences for substitution safety.
          *   Limitations of the procedure.
          *   Silent failure modes (the user's biggest worry).
          *   Apply procedure to 3 specific cases (Artist Attribution, Corporate Merger/Brand, Workshop vs. Master + Marketing explanation).
          *   Constraint: No jargon like "sense", "reference", or "opaque" in the marketing explanation.

  2.  **Deconstruct the Philosophical Concepts into Data Rules:**
      *   *Frege's Puzzle (Sense/Reference):* Two names point to the same thing, but swapping them changes meaning in certain contexts (beliefs, attributions). *Data Translation:* Merging records is okay for the *entity*, but preserving the *names* as distinct labels is crucial. Don't delete the old name; make it an alias. Don't swap names in provenance statements blindly.
      *   *Identity under a Sortal:* "Same X". You can't merge a Person and a Corporation. You can't merge a City and a River even if they share coordinates. *Data Translation:* Check the Entity Type first. If types differ, don't merge.
      *   *Rigid vs. Flaccid Designators:* "George Washington" (Rigid) vs. "The first President" (Flaccid). *Data Translation:* Merge based on stable IDs (VIAF, ISNI, Birth/Death dates, Registration Numbers). Do *not* merge based on roles ("Director of X", "Artist of Y") because roles change hands.
      *   *Informative Identity:* "Clemens = Twain". *Data Translation:* Merge is fine, but keep both names visible.
      *   *Unsafe Substitution:* "The museum believes X painted this." If X = Y, does "The museum believes Y painted this" hold? Not if they didn't know X=Y. *Data Translation:* Don't overwrite historical attributions in downstream records just because the authority file merged.

  3.  **Drafting the Procedure (The "10-Minute Merge Protocol"):**
      *   Need to be actionable.
      *   Step 1: Sortal Check (Type match?).
      *   Step 2: Evidence Check (Rigid designators vs. Descriptions).
      *   Step 3: The "Swap Test" (Contextual safety).
      *   Step 4: Decision (Merge, Link, or Escalate).
      *   Need clear Stop signs.

  4.  **Addressing Silent Failures:**
      *   What happens when a merge goes wrong?
      *   Downstream systems cache the URI.
      *   If URI A merges into URI B, and A was "Hitler" and B is "Churchill", every object linked to A now says Churchill.
      *   Silent failure: Data looks consistent but is factually wrong. Historical accuracy is lost.

  5.  **Developing the Test Sentences:**
      *   Need to show where substitution breaks.
      *   Belief/Attribution: "Cataloger X identified this as [Name A]." -> "[Name B]" (False if X didn't know).
      *   Temporal: "[Name A] signed this in 1900." -> "[Name B]" (False if Name B didn't exist/wasn't using that name then).
      *   Modal: "The founder could have named the company [Name A]." -> "[Name B]" (Nonsense).

  6.  **Running the Cases:**
      *   *Case 1 (Master of Blue Annunciation vs. Named Artist):* Contested attribution.
          *   Sortal: Person/Person (Pass).
          *   Evidence: One recent attribution vs. conventional nickname. Not consensus.
          *   Risk: High. If wrong, we misattribute works.
          *   Verdict: **NO MERGE.** Link as "possibly same as". Escalate if strong evidence exists, but default to separate.
      *   *Case 2 (Company Merger/Brand):* Legal entity vs. Brand.
          *   Sortal: Corp/Corp (Pass).
          *   Evidence: Legal absorption. Brand survives.
          *   Nuance: Legal entity died, Brand lives.
          *   Verdict: **NO MERGE.** Create a "Successor/Predecessor" link. The Brand is a trade name, not the legal entity.
      *   *Case 3 (Workshop Pupil vs. Old Master + Marketing):*
          *   Sortal: Person/Person (Pass).
          *   Evidence: Scholarship says Pupil. Marketing wants Master.
          *   Risk: Historical falsification.
          *   Verdict: **NO MERGE.**
          *   Marketing Explanation: Needs to be plain English. Focus on "Accuracy," "Search Integrity," and "Scholarly Trust." Avoid "Sense/Reference."

  7.  **Refining the Output:**
      *   Tone: Professional, empathetic to the constraints, authoritative but practical.
      *   Structure:
          1.  Introduction (Validating the intuition).
          2.  The Protocol (Checklist).
          3.  The Substitution Test (Sentences).
          4.  Silent Failure Modes.
          5.  Case Studies.
          6.  Marketing Paragraph.
      *   Constraint Check: Ensure "sense", "reference", "opaque" are absent in the marketing blurb. Ensure the checklist is under 10 mins worth of reading/doing.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the checklist too abstract?
      *   *Fix:* Make the questions Yes/No. Add specific examples of "Rigid" (Birth date, Gov ID) vs "Flaccid" (Role, Location).
      *   *Critique:* Is the marketing explanation too technical?
      *   *Fix:* Focus on the user experience. If we lie, researchers stop trusting us. If we merge, the search results become noisy/wrong.
      *   *Critique:* Did I address `owl:sameAs`?
      *   *Fix:* Explicitly mention using narrower properties (`skos:relatedMatch`, `org:successor`) instead of `sameAs` for the "No" cases.

  9.  **Final Polish:** Check against the "Silent Failure" anxiety. Emphasize that a bad merge pollutes the cache. A bad link just looks messy. Messy is fixable; polluted is not.

  *(Self-Correction on Case 3)*: The prompt asks for a merge of the *painting's attribution* to the *painter's record*. Wait, re-reading: "marketing team wants it merged into the famous painter's record so it surfaces in search". This implies the *Object* record points to the *Actor* record. If the Object points to the Pupil, and we merge Pupil into Master, the Object now points to Master. This is the dangerous merge. I need to make sure the explanation addresses why pointing to the Master is wrong even if it helps search.

  *(Refining the Marketing Explanation)*: The goal is search visibility. The counter-argument is trust. "If users find this painting under the Master, but the label says 'Workshop of', they think our search is broken. Keep the records separate so search filters work correctly."

  *(Final check on constraints)*: "Don't assume I remember any of the terminology." -> Define Rigid/Flaccid simply in the guide. "No philosophy words in marketing blurb." -> Check.

