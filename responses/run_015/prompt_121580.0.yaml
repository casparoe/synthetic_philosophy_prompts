answer: |-
  You are right, and your colleague is wrong. In data modeling, `owl:sameAs` is a logical nuclear weapon. It says "A and B are interchangeable in every possible context, forever." In the real world, especially in cultural heritage, almost nothing is interchangeable in *every* context. Names change, legal status changes, and attributions change.

  When you merge two records using `sameAs`, you are telling every downstream system: "Delete B, keep A, and pretend B never existed." If you are wrong, you have not just made a mistake; you have erased history in every catalog that harvested your data last Tuesday.

  Here is the translation of your philosophical intuition into a data procedure. It is designed to be printed and taped to a monitor.

  ***

  # The 10-Minute Merge Protocol

  **Goal:** Decide whether to Merge (A becomes B), Link (A relates to B), or Escalate.
  **Time Limit:** 10 Minutes per proposal.
  **Rule #1:** If you are unsure, **Link, do not Merge.** A bad link is messy; a bad merge is a lie.

  ### Step 1: The Sortal Check (2 Minutes)
  *Identity is always "the same **what**?" You cannot merge records if they are not the same kind of thing.*

  1.  **Do both records have the exact same Entity Type?** (e.g., both are *Person*, both are *Corporate Body*).
      *   **NO:** **STOP.** Do not merge. Use a "Related To" link. (Example: A Person cannot be the same URI as the Company they own).
      *   **YES:** Proceed to Step 2.
  2.  **Is there a single definition that covers both records entirely?** (e.g., If merging two cities, are they both defined by the same geographic boundaries? If merging two companies, are they both defined by the same legal registration?)
      *   **NO:** **STOP.** Do not merge. (Example: A "Brand" is not the same sortal as a "Legal Entity").
      *   **YES:** Proceed to Step 3.

  ### Step 2: The Evidence Check (5 Minutes)
  *Some names stick to a thing no matter what (Rigid). Some names describe a role that can change hands (Flaccid). Merge only on Rigid evidence.*

  1.  **Do the records share a Rigid Identifier?**
      *   *Examples:* Government Tax ID, Birth/Death Date + Place, ISNI/VIAF ID, Serial Number.
      *   *Non-Examples:* "Director of X," "Located in Y," "Active in 1900," "Known as Z."
      *   **NO:** **STOP.** Do not merge based on roles or locations alone. Escalate to Senior Editor if the match feels strong but lacks ID.
      *   **YES:** Proceed to Question 2.
  2.  **Is the evidence consensus or contested?**
      *   *Check:* Is this attribution accepted by the majority of scholars, or is it a recent theory/disputed claim?
      *   **Contested/Recent Theory:** **STOP.** Do not merge. Link as "Possibly Same As."
      *   **Consensus:** Proceed to Step 3.

  ### Step 3: The Substitution Test (3 Minutes)
  *Even if they are the same thing, can we swap the names everywhere without breaking the truth?*

  Imagine you have Record A (Old Name) and Record B (New Name). You plan to merge A into B. Run these three sentences in your head. If **any** sentence becomes False or Nonsense after the swap, **DO NOT MERGE.**

  1.  **The Belief Test:** "In 1950, the cataloger attributed this work to **[Record A]**."
      *   *Swap:* "In 1950, the cataloger attributed this work to **[Record B]**."
      *   *Verdict:* If the cataloger didn't know A=B, this is now a lie. **Result: LINK, DO NOT MERGE.**
  2.  **The Time Test:** "**[Record A]** signed this contract in 1920."
      *   *Swap:* "**[Record B]** signed this contract in 1920."
      *   *Verdict:* If Record B didn't exist or use that name in 1920, this is false. **Result: LINK, DO NOT MERGE.**
  3.  **The Role Test:** "The artist known as **[Record A]** painted this."
      *   *Swap:* "The artist known as **[Record B]** painted this."
      *   *Verdict:* If Record A is a workshop/pupil and Record B is the Master, this changes the physical creator. **Result: LINK, DO NOT MERGE.**

  ### Decision Matrix

  | Result | Action | Property to Use |
  | :--- | :--- | :--- |
  | **All Pass** | **MERGE** | `owl:sameAs` (Redirect A to B) |
  | **Fail Step 1** | **LINK** | `skos:relatedMatch` |
  | **Fail Step 2** | **LINK** | `rdfs:seeAlso` or "Possibly Same As" |
  | **Fail Step 3** | **LINK** | Keep separate records; link names as aliases *within* records if appropriate, but do not merge URIs. |
  | **Unsure** | **ESCALATE** | Send to Senior Editor. |

  ***

  # Silent Failure Modes (The "Lie Awake" List)

  You asked where a wrong merge fails silently. This is the most critical section for your team.

  1.  **The Cache Poison:** Downstream partners harvest your URIs nightly. If you merge A into B today, their system deletes A and rewrites all their local data to B. If you undo the merge next month, **their data does not fix itself.** They are now stuck with the wrong data until their next manual cleanup (which may never happen).
  2.  **The Historical Erasure:** If you merge a "Pupil" record into a "Master" record, every object linked to the Pupil now appears to be by the Master. A researcher querying "Works by Master" gets false positives. A researcher querying "Works by Pupil" gets zero results. The distinction vanishes from the dataset permanently.
  3.  **The Temporal Glitch:** If you merge a "Pre-1950 Company" with a "Post-1950 Company" because they share a brand, queries about "Companies active in 1940" will now incorrectly return the Post-1950 entity. Time-based filtering breaks.

  **Rule of Thumb:** A bad link looks like a typo. A bad merge looks like the truth. **Typos are forgivable; lies are not.**

  ***

  # Case Studies

  Here is the protocol applied to your three scenarios.

  ### Case 1: The "Master of the Blue Annunciation" vs. Named Artist
  *   **Step 1 (Sortal):** Both are Persons. (Pass)
  *   **Step 2 (Evidence):** Evidence is "one recent attribution that half the field accepts." This is **Contested**, not Consensus. (Fail)
  *   **Step 3 (Substitution):** "The Master of the Blue Annunciation painted this." -> "[Named Artist] painted this." Since half the field disagrees, this statement is not universally true. (Fail)
  *   **Verdict:** **DO NOT MERGE.**
  *   **Action:** Keep separate records. Link the "Master" record to the "Named Artist" record with a property like `schema:sameAs` (with a confidence score) or `rdfs:seeAlso` with a note "Attribution disputed."
  *   **Why:** Merging forces a scholarly debate into a binary data fact. You are taking sides in an art history argument. Let the data reflect the uncertainty.

  ### Case 2: The Absorbed Company vs. The Brand
  *   **Step 1 (Sortal):** Record A is "Legal Entity (Defunct)." Record B is "Brand/Trade Name (Active)." Are they the same sortal? **No.** One is a legal corporation, one is an intellectual property asset. (Fail)
  *   **Step 2 (Evidence):** The legal entity ceased to exist at the merger. The brand continued. They do not share a rigid lifecycle. (Fail)
  *   **Verdict:** **DO NOT MERGE.**
  *   **Action:** Create two records.
      *   Record A (Legal Entity): End date = Merger date.
      *   Record B (Brand/Successor): Start date = Merger date.
      *   Link them with `org:successor` or `schema:successorOf`.
  *   **Why:** If you merge them, you imply the legal liability and tax status of the old company continue indefinitely under the new name, which is legally false.

  ### Case 3: The Workshop Pupil vs. The Old Master (Marketing Request)
  *   **Step 1 (Sortal):** Both Persons. (Pass)
  *   **Step 2 (Evidence):** Current scholarship says Pupil. Marketing wants Master. Evidence contradicts the merge. (Fail)
  *   **Step 3 (Substitution):** "This painting was created by the Pupil." -> "This painting was created by the Master." This is factually false according to current conservation science. (Fail)
  *   **Verdict:** **DO NOT MERGE.**
  *   **Action:** Keep records separate. Ensure the Object record points to the Pupil. Add the Master's name as a keyword or "Influenced By" field to aid search without falsifying attribution.

  ***

  # The Marketing Explanation (Copy/Paste Ready)

  *Constraint Check: No "sense", "reference", or "opaque".*

  > "We cannot merge the pupil's record with the master's record because it breaks the accuracy of our search filters. If we combine them, the system will tell users that the master painted this work, which our own catalog labels say is incorrect. When visitors search for 'Works by the Master' and find this painting, they will see the label says 'Workshop of,' and they will assume our website data is broken or lying to them.
  >
  > It is better for search visibility to keep the records separate but link them. We can tag this painting with the master's name as a keyword so it still shows up in searches, but the official creator field must remain accurate. This ensures that when a user filters by 'Verified Artist,' the results remain trustworthy. If we prioritize click-throughs over accuracy now, we lose the scholarly trust that makes our data valuable to partners in the long run."

  ***

  # What This Procedure Cannot Do

  1.  **It cannot solve scholarly disputes.** If two respected historians disagree on whether Person A is Person B, this protocol forces you to keep them separate. This might feel like "missing an opportunity" to clean up the data, but it is the only safe default.
  2.  **It cannot fix downstream errors already made.** If a partner already merged A and B based on your old data, this checklist won't fix their local database. It only stops *new* bleeding.
  3.  **It cannot handle "Fuzzy" identities perfectly.** Sometimes a person changes their identity so radically (e.g., gender transition, witness protection, radical pseudonymity) that the "Swap Test" feels weird even if it is technically the same human. In these cases, **Escalate** to the Senior Editor. This is a values call, not a data call.

  # Final Advice for the Team

  Tell your interns this: **Your job is not to decide the truth. Your job is to decide if the evidence is strong enough to commit the consortium to the truth.**

  If the evidence is 99% solid, merge.
  If the evidence is 80% solid, link.
  If the evidence is 50% solid, link and note the dispute.

  A messy graph with 50 links is annoying. A clean graph with 5 lies is useless.
