answer: |-
  **The Burden Without a Bearer: Why Karma Cannot Be Retributive Desert**

  In Western ethical discourse, the concept of karma is frequently assimilated into a framework of cosmic retributivism. It is understood as a moral ledger: good deeds accrue credit, bad deeds accrue debt, and the universe ensures that every sentient being receives exactly what they deserve, even if the accounting spans multiple lifetimes. This view aligns with your friend's assessment that karma is merely retributivism with reincarnation bolted on. However, this interpretation relies on a metaphysics of the self that Buddhist ethics explicitly rejects. When analyzed through the doctrines of *anatta* (no-self) and beginningless *samsara*, karma collapses as a theory of backward-looking moral desert. It cannot survive the twin pressures of the no-self problem and the initial-conditions regress. Instead, to remain philosophically coherent, karma must be reinterpreted not as a system of justice, but as a forward-looking theory of causal responsibility and moral cultivation.

  The primary obstacle to viewing karma as retributive desert is the problem of personal identity. Retributive justice requires a specific metaphysical condition: the entity that suffers must be numerically identical to the entity that acted. If Person A commits a crime and Person B is punished, we intuitively recognize this as injustice unless B is fundamentally the same being as A. In Hindu Mimamsa or Nyaya schools, where an eternal *atman* (self) persists, this condition is met. The self is the stable substrate that carries moral weight from one life to the next.

  However, in Buddhist philosophy, there is no *atman*. There is only a causal continuum of aggregates (*skandhas*)—physical forms, sensations, perceptions, mental formations, and consciousness. As you noted, this is a mental stream rather than a stable agent. The classic analogy is that of a flame passed from one candle to another: the flame on the second candle is causally dependent on the first, but it is not the *same* flame. If we accept this reductionist view of personhood (akin to Derek Parfit's modern reductionism), the link required for retributive desert is severed. We can say the present continuum is causally responsible for the past continuum's actions, but we cannot say it *deserves* suffering for them in a retributive sense. To inflict suffering on a present mental continuum because of a past continuum's actions, when no strict identity exists between them, is not justice; it is merely cause and effect. Therefore, the no-self doctrine does not save karma from being retributive; it dismantles the very possibility of retribution. Without a bearer of the burden, there can be no desert, only consequence.

  This metaphysical fracture is compounded by the problem of initial conditions, or the regress of causality. For karma to function as a coherent theory of desert, there must be a point at which moral agency began, allowing for a "first" moral fault that set the chain of retribution in motion. However, orthodox Buddhism posits that *samsara* is beginningless (*anadi*). There is no first cause. Every instance of suffering is traced back to past karma, which is traced back to ignorance (*avidya*), which is itself beginningless.

  This creates a dilemma for the desert theorist. If the chain is infinite, then every instance of suffering is structurally inevitable given the prior conditions. While one might argue that the suffering is still "deserved" because it was caused by volitional action, the infinite regress dilutes the moral weight of any single action. If my current suffering is the result of a chain of causes stretching back infinitely, the specific contribution of my "past self's" free will becomes indistinguishable from the mechanical momentum of the system. Furthermore, if there were an initial condition that was *not* karmic (an uncaused starting point), then some suffering would be undeserved, breaking the theory of universal moral desert. Because Buddhism chooses the infinite regress option to avoid a creator god or uncaused matter, it renders the system deterministic in a way that is incompatible with the libertarian free will usually required for strong retributive desert. The suffering is not a punishment for a specific moral failure; it is a symptom of a beginningless structural ignorance.

  One might attempt to salvage the desert model by distinguishing between individual karma and aggregate karma. Perhaps the "individual" does not need to persist, only the aggregate of mental states. However, this distinction merely reinforces the forward-looking interpretation. If karma attaches to the mental continuum rather than the person, the ethical goal shifts from "balancing the ledger" to "purifying the stream." The focus is no longer on what the past self *owed*, but on what the future self *requires* to cease suffering. This aligns with the Buddha's pragmatic silence on metaphysical questions, exemplified in the Parable of the Poisoned Arrow. The Buddha refused to speculate on the origins of the universe or the precise mechanics of past lives, focusing instead on the cessation of suffering. This suggests that the doctrinal function of karma is not to explain why we suffer (backward-looking desert), but to motivate us to act ethically to stop suffering (forward-looking cultivation).

  Consequently, we must conclude that karma, when rigorously analyzed through Buddhist metaphysics, cannot function as a theory of backward-looking moral desert. Your friend's view that it is retributivism with reincarnation is a category error; it imposes a Western, substance-based notion of the self onto a process-based metaphysics. The no-self doctrine ensures that there is no one to *be* retributed against, and the beginningless regress ensures that there is no first moral crime to *justify* the retribution.

  Therefore, the only coherent way to understand karma in this context is as a natural law of moral psychology rather than a system of cosmic justice. It is a theory of causal efficacy: unwholesome actions solidify habits of mind that lead to suffering, while wholesome actions dissolve them. This transforms karma from a retributive mechanism into a therapeutic one. We do not practice ethics because we deserve punishment or reward; we practice ethics because certain actions perpetuate the cycle of suffering and others end it. In this light, the "twist" you suspected is decisive: the absence of a persistent self does not merely modify the theory of desert; it abolishes it, replacing the demand for justice with the necessity of liberation.
