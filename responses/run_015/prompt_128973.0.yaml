prompt: |-
  I'm taking this ethics course and we got onto karma last week, but the prof mostly talked about Hindu versions. I'm intersted in how it works as a theory of moral desert — like, is suffering actually deserved? My freind argues that karma is just retributivism with reincarnation bolted on, but I think there's a twist: in alot of Buddhist accounts the "self" that carries karma isn't a stable agent, it's more like a causal stream or mental continuum. So can you even have desert if there's no persistant person?

  There's also this problem of initial conditions I keep thinking about. If your current suffering is because of past karma, then that past karma was caused by something before it, etc., which either means an infinite regress or that there has to be some uncaused initial suffering that isn't deserved at all. That feels like it breaks the desert part of karma. Write an essay about whether karma, understood specifically as a backward-looking desert theory across rebirths, can survive both the no-self problem and the initial-conditions regress. Weigh the arguments — maybe draw on the distinction between aggregate karma and individual karma, or on whether desert attaches to mental continuums rather than persons — but reach a conclusion. Don't just say it's complicated; defend a view, like that karma collapses into a forward-looking moral-education view, or that the no-self problem actually saves it from being retributive.
