      *   **Tone:** Academic but accessible (ethics course context), analytical, argumentative.

  2.  **Deconstruct the Arguments:**

      *   **The Friend's View:** Karma = Retributivism + Reincarnation. (Punishment fits the crime, just spread over lives).
      *   **The User's Intuition:** Buddhist "No-Self" changes the game. If there's no "I," who deserves what?
      *   **Problem 1: No-Self (Anatta).**
          *   *Standard Desert Theory:* Requires a persisting subject who acted then and suffers now.
          *   *Buddhist View:* Causal continuum (like a flame passing from candle to candle).
          *   *Implication:* If Person A (past) $\neq$ Person B (present) strictly speaking, retributive desert fails. You can't punish B for A's crime if they aren't the same agent.
          *   *Counter:* Psychological continuity might be enough for *responsibility*, even if metaphysical selfhood isn't there. But is it *desert*?
      *   **Problem 2: Initial Conditions/Regress.**
          *   *Infinite Regress:* Every suffering has a past cause. No starting point.
          *   *The Issue:* If there's no beginning, is there ever a "first" moral fault? If the chain is beginningless, is the suffering *actually* deserved, or just inevitable?
          *   *The "Uncaused" Option:* If there was a first cause that wasn't karmic, then some suffering is undeserved, breaking the theory.
          *   *Buddhist Stance:* Samsara is beginningless (anadi). This avoids the "first sin" problem but creates the "infinite debt" problem.
      *   **Synthesis/Conclusion Strategy:**
          *   The prompt suggests defending a view. The strongest philosophical move in Buddhist ethics is usually to shift from *retributive* (backward-looking) to *consequentialist/therapeutic* (forward-looking).
          *   *Thesis:* Karma cannot function as a coherent theory of *backward-looking moral desert* (retributivism) precisely because of the no-self doctrine and the regress problem. Instead, it functions best as a forward-looking theory of moral cultivation and causal responsibility. The "no-self" aspect doesn't save retributivism; it dismantles it, forcing a shift to a therapeutic model.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy and relevant. "The Weight of Empty Hands" or "Karma Without a Self." Let's go with "The Burden Without a Bearer."
      *   **Introduction:**
          *   Hook: Common Western misunderstanding (cosmic justice).
          *   Define the tension: Retributive desert vs. Buddhist metaphysics.
          *   Thesis Statement: While karma resembles retributivism, the doctrines of *anatta* (no-self) and beginningless *samsara* render it incoherent as a backward-looking theory of desert. It must be reinterpreted as a forward-looking, therapeutic account of causal responsibility.
      *   **Body Paragraph 1: The Retributive Intuition (The Friend's View).**
          *   Explain why it looks like retributivism. Good acts = reward, bad acts = suffering.
          *   Why this appeals to moral intuition (just world hypothesis).
      *   **Body Paragraph 2: The No-Self Objection.**
          *   Explain *anatta*. The continuum vs. the person.
          *   Analogy: The flame or the milk curdling into cheese.
          *   Argument: Retributivism requires identity. If the "sufferer" is not numerically identical to the "actor," retributive desert fails. You can't punish a continuum for the sake of justice; you can only manage the continuum for the sake of future states.
      *   **Body Paragraph 3: The Initial Conditions/Regress Problem.**
          *   Beginningless Samsara.
          *   If the chain is infinite, can we ever say a specific instance of suffering is "deserved" in a final sense?
          *   More importantly, if there is no first cause, the system is deterministic/mechanical rather than moral. It becomes natural law, not moral justice.
      *   **Body Paragraph 4: Reconstructing Karma (The Forward-Looking Turn).**
          *   If desert fails, what remains? Causal efficacy.
          *   Shift from "You deserve this" to "This is the condition for that."
          *   Ethical focus becomes liberation (Nirvana), not balancing a cosmic ledger.
          *   This aligns with the Buddha's silence on metaphysical questions (poisoned arrow parable).
      *   **Conclusion:**
