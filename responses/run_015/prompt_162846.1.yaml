answer: |-
  | Requirement | Motivating case (one sentence) | Status (non-negotiable / negotiable / camp prejudice — and whose) | What it rules out | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Causal Grounding** | Mimicking device produces manifestation without underlying capacity. | Non-negotiable | Pure Conditional Analysis (Rylean) | Special sciences require mechanisms, not just counterfactual correlations. |
  | **Stimulus Specificity** | Unstimulated shatterer breaks without external trigger. | Negotiable | Strict Stimulus-Response Models | Allow null stimuli (e.g., radioactive decay) to accommodate spontaneous processes. |
  | **Intrinsicality** | Solubility requires a solvent external to the solute. | Camp Prejudice (Lewisians) | Relational Dispositional Accounts | Chemistry treats dispositions as relational; drop this for special science utility. |
  | **Persistence** | One-shot fuse destroys its own disposition upon manifestation. | Negotiable | Theories requiring disposition survival | Consumable dispositions are real; manifestation can destroy the categorical basis. |
  | **Gradedness** | Probabilistic fink manifests only sometimes under identical conditions. | Non-negotiable | Binary Dispositional Accounts | Science requires probabilities/degrees, not just yes/no presence of capacity. |
  | **Non-Circularity** | Normality riders needed to fix conditionals often invoke dispositions. | Negotiable (possibly impossible) | Pure Power Ontologies | 'Normal conditions' often tacitly dispositional; may need primitive modality. |

  | Requirement A | Requirement B | Why they can't both hold | Which one I should give up |
  | :--- | :--- | :--- | :--- |
  | **Non-Circularity** | **Fink/Mask Coverage** | Fixing conditionals for finks requires 'normal conditions' clauses which are themselves dispositional. | **Non-Circularity** (Accept primitive modality; science cares about prediction, not reduction.) |
  | **Intrinsicality** | **Relational Utility** | Solubility and toxicity are inherently relational between system and environment. | **Intrinsicality** (It blocks chemical/biological application; properties need not be portable.) |

  Conditional analysis with normality riders fails the mimicking device and collapses into circularity when handling finks, as the 'normality' clause inevitably smuggles in the very disposition it seeks to analyze. It is logically tidy but ontologically empty for a scientist asking *why* a system behaves as it does.

  The causal basis view (Lewis-style) handles mimicking well by anchoring dispositions in categorical properties, but struggles with the one-shot fuse if the basis is destroyed, and falters on solubility if intrinsicality is enforced. It is the most usable for engineering but requires loosening the intrinsic constraint to fit chemistry.

  The everything-is-powers view grounds dispositions naturally and handles gradedness well, but violates non-circularity by definition and risks over-metaphysicing special science contexts. It is robust ontologically but demands a fundamental shift in worldview that biologists and chemists will rightly reject as unnecessary.

