answer: |-
  You have described a phenomenon that is distinct from Orwell's diagnosis, distinct from standard "framing," and distinct from simple vocabulary limitation. You are describing a structural constraint where the *ontology of the administrative system* (what it allows to exist as a distinct entity) overrides the *ontology of the actual world*.

  There is no single established term that captures this precisely, though there are three strong neighbors in political science, sociology, and measurement theory. I will outline them, define their boundaries relative to your description, and then propose a term for the specific phenomenon you have isolated.

  ### The Neighbors

  **1. State Legibility (James C. Scott)**
  *   **The Concept:** In *Seeing Like a State*, Scott argues that states simplify complex social realities (forests, cities, populations) into standardized categories to make them manageable ("legible").
  *   **Where it fits:** Your shelter example is a classic case of making a proposal legible. Cash is messy; a "program category" is legible.
  *   **Where it falls outside:** Scott's theory relies heavily on *intent* and *power*. The simplification is usually a tool of control or extraction by a central authority. Your description involves honest, competent actors who are *also* trapped by the system. The constraint is not imposed from above to control the populace, but is inherent to the informational technology itself, binding the administrator as tightly as the subject.

  **2. Commensuration (Wendy Espeland & Mitchell Stevens)**
  *   **The Concept:** The process of transforming different qualities into a common metric (e.g., turning "care" and "dignity" into "cost per unit") to allow for comparison.
  *   **Where it fits:** This perfectly describes your first example. The "axis of comparison" forces the cash proposal to be scored as a program, ensuring it loses.
  *   **Where it falls outside:** Commensuration focuses on *valuation* and *ranking*. Your hospital example is not about ranking; it is about *existence*. The discharge failure doesn't get a bad score; it gets no score. It falls into the "other" box, which is ontologically equivalent to zero. Your phenomenon includes things that cannot even be commensurated because they cannot be parsed by the syntax of the form.

  **3. Ontological Politics (Annemarie Mol)**
  *   **The Concept:** Reality is not a fixed backdrop but is "enacted" by specific practices. A disease in a pathology lab is a different object than a disease in a patient consultation.
  *   **Where it fits:** This captures the idea that the hospital form *creates* the reality of patient safety. If the form doesn't have a box for it, the harm doesn't exist within that reality.
  *   **Where it falls outside:** Mol's work is broad, covering all medical practices. Your observation is specific to *bureaucratic language and forms*. It is about the *syntax of administration*, not just general practice. It is about how a specific linguistic structure (the memorandum, the checkbox) dictates what can be said.

  ### The Coinage: Categorical Assimilation

  Since no existing term captures the specific mechanism of *honest, precise translation that distorts by absorption*, I propose the term **Categorical Assimilation**.

  **Definition:**
  *Categorical Assimilation* occurs when a structured administrative framework (forms, metrics, memoranda) possesses a closed ontology. When an external reality or proposal is introduced that does not map onto the framework's existing categories, the framework does not reject it; instead, it translates the input into the nearest available category. This translation preserves the *record* of the input but alters its *substance*, often neutralizing its critical potential.

  **The Edges of the Phenomenon:**

  1.  **Vs. Vocabulary:** It is not a lack of words. As you noted, the vocabulary is rich. It is a lack of *joints*. The grammar of the system allows for adjectives (costly, efficient) but restricts nouns (only "programs," only "acts").
  2.  **Vs. Ideology:** It requires no conspiracy. It functions best when operators are honest and competent. In fact, competence accelerates the assimilation, because a competent operator knows exactly which box the input belongs in.
  3.  **Vs. Framing:** Framing is rhetorical and optional. Categorical Assimilation is structural and mandatory. You cannot file the memorandum without using the categories.

  ### Addressing Your Specific Questions

  **1. Are the hearing and the hospital form the same thing?**
  They are the same *mechanism* but distinct *outcomes* on a spectrum of assimilation.
  *   **The Hearing (Distortion):** This is **Active Assimilation**. The cash proposal was ingested, translated into "program," and processed. The system claimed to hear it, but heard it as something else. This is more insidious because it creates the illusion of consideration.
  *   **The Hospital Form (Omission):** This is **Passive Assimilation**. The discharge failure was not translated; it was relegated to the residual category ("other"). In administrative data, "other" is functionally equivalent to "nothing."
  *   **Verdict:** They are the same phenomenon. One distorts the signal to fit the channel; the other treats the signal as noise. Both result from the *Categorical Closure* of the system.

  **2. Does awkward expressibility count, or does it require active transformation?**
  The concept requires **active transformation**.
  *   **Friction:** If you can state the position but it takes a paragraph and reads as a digression, that is *Bureaucratic Friction*. It discourages the thought but does not necessarily falsify it.
  *   **Assimilation:** If stating the position *within the required fields* forces you to argue for a "program" when you are arguing against "programs," that is *Categorical Assimilation*. The boundary is crossed when the syntax of the form forces a logical contradiction upon the user. If the form makes your argument *incoherent* unless you change its meaning, you are inside the phenomenon.

  **3. Is the phenomenon located in the vocabulary, the forms/metrics, or the habits?**
  It is located in the **Forms and Metrics**, which then dictate the **Habits**.
  *   **Vocabulary:** As you noted, the words are clean. "Bed-night" is not a euphemism; it is a precise unit. The vocabulary is innocent.
  *   **Forms/Metrics:** This is the locus. The form dictates the *subject-predicate relationships* of the bureaucracy. (e.g., "Harm *must* follow *Act*"). If the form does not allow for "Harm *follows* Circumstance," the reality is excluded.
  *   **Habits:** The habits are the *symptom*. Writers stop imagining alternatives not because they are lazy, but because the form provides no mechanism to record them. The form trains the habit.

  ### Summary
  You are not experiencing Orwellian decay. You are experiencing **Categorical Assimilation**. It is the cost of precision. To make the state legible and accountable, we build forms that define what counts. The unintended consequence is that anything that counts *must* look like the form. When the form defines "intervention" as "a unit administered by the agency," a proposal to *remove* the agency cannot be recorded as an intervention. It must be recorded as a different kind of intervention, or it vanishes.

  This is not a failure of language; it is a failure of **ontological design**. The system is designed to measure the performance of the machine, not the welfare of the people the machine serves. When those two diverge, the machine cannot record the divergence, because it has no sensor for it.
