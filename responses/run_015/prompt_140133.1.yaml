  **Classification Committee for Mental Disorders**
  **Release Notes: Edition 12.0 (Fixed-Point Protocol)**
  **Date:** 14 October 2023
  **Status:** General Availability

  **Overview**
  Edition 12.0 implements the Fixed-Point Protocol. Previous editions operated on a static model wherein criteria were published prior to clinical deployment. Post-release telemetry indicated that public access to criteria induced behavioural alignment within subject populations prior to data capture, resulting in category instability. To resolve this, diagnostic criteria are no longer published. Categories are now generated by a proprietary model hosted on secure servers. Clinicians submit unstructured symptom narratives via API; the system returns a classification code and a patient-facing label. Criteria exist only within the inference engine. This edition describes not the patients who present at intake, but the population state achieved once the previous edition's classifications have fully integrated into subject self-conception.

  **Deprecated**
  *   **Public Criteria Documents:** All human-readable definitions of disorder boundaries have been removed from the public repository. Access to inclusion/exclusion rules is now restricted to the model layer. This prevents pre-emptive narrative optimisation by subjects accessing documentation prior to assessment.
  *   **Semantic Quarantine:** The eighteen-month moratorium between publication and clinical implementation is discontinued. Real-time model weighting allows for immediate deployment. The latency required for subject populations to unknowingly align with new standards is now managed via backend parameter tuning rather than publication delays.

  **Added**
  *   **Narrative Ingestion Engine:** Clinicians must now submit raw symptom narratives rather than checking criteria boxes. The system parses linguistic markers to assign codes. This ensures the input data reflects untreated phenomenology rather than clinician bias toward published checklists.
  *   **Loop-Drift Telemetry:** A new metric monitors the divergence between a category's calibrated prevalence and its observed prevalence two quarters post-release. If loop-drift exceeds 5%, automatic re-anchoring is triggered. The model adjusts boundary conditions to restore prevalence to baseline without clinician notification. This ensures categories remain stable even as subject behaviour shifts in response to diagnosis.
  *   **Diagnostic Arbitrage Guidance:** New protocols detect narrative optimisation aimed at securing secondary gains (e.g., educational accommodations, pharmacological access, disability benefits). The system flags narratives that closely match high-utility categories while lacking corroborating physiological markers. Clinicians are advised to override system suggestions if arbitrage is suspected, though override rates are logged for audit.

  **Known Issues**
  *   **Acquired Nosological Dependency Syndrome (ANDS):** A subset of patients presents who cannot describe distress except by citing categories from the previous edition. These subjects exhibit functional impairment when their assigned label is updated or deprecated by the Fixed-Point Protocol. They require re-education to align their self-reporting with the new opaque criteria.
      *   *Workaround:* Clinicians should administer the Legacy Mapping Module during intake to translate patient vernacular into current codes. Do not inform the patient that their previous diagnosis no longer exists as a discrete entity.
      *   *Note:* High rates of ANDS indicate successful integration of the previous edition. However, excessive dependency may trigger loop-drift corrections.

  **Security**
  *   Criteria leakage is treated as a critical vulnerability. Clinicians found attempting to reverse-engineer classification rules from output labels will have API access revoked.

  **Support**
  *   Tickets regarding classification inconsistencies will not be accepted if they reference specific criteria text, as no such text is authorised for external use. Please submit logs only.

  © 2023 Classification Committee for Mental Disorders. All rights reserved.
