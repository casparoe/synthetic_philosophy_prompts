answer: |-
  Here is the teaching arc to walk your roommate through the logic without triggering a moral panic.

  ### 1. The Prerequisite Idea: "Suffering Doesn't Merge"
  Before you mention numbers or choices, you must land the idea that **pain is experienced individually, not collectively.**
  *   **Why:** If he thinks you believe "one person's hunger = five people's hunger," he thinks you're a sociopath. You need him to see that you believe "one person's hunger is terrible" and "five people's hunger is five separate terrible things," but those five terrible things don't melt together into one giant super-terrible thing that outweighs the first.
  *   **The Hook:** "I didn't choose the one because I care less about the five. I chose him because I don't believe the five have a right to combine their claims to overpower him."

  ### 2. The Scenario: "The Master Key" (Tweaked Food-Bank)
  Do not use the original box scenario (where splitting the box means the five starve, which makes your choice utilitarian by default). Use this tweaked version for the explanation:
  *   **The Setup:** You are holding the **only Master Key** to the warehouse.
  *   **The Choice:** You can hand the key to the **One Guy** waiting outside Door A, or the **Group of Five** waiting outside Door B.
  *   **The Constraint:** Once you hand over the key, the lock changes. You cannot go back. You cannot cut the key in half.
  *   **The Stakes:** If Door A opens, the One Guy eats. If Door B opens, the Five Guys eat. Both outcomes are fully successful; both are fully impossible to combine.
  *   **Why this works:** It removes the "splitting resources" distraction. It forces the choice to be purely about *who* gets saved, not *how much* food exists. It ensures aggregation (adding up needs) is physically impossible because the mechanism (the key) is binary.

  ### 3. The Misconception Sequence & Blocking Points

  **Misconception 1: "So you're saying you just flip a coin?"**
  *   **When it hits:** Immediately after you present the Key Scenario.
  *   **The Fear:** He thinks you're reducing human life to randomness.
  *   **Where to Block:** Right after he asks this.
  *   **The Block:** "No. The coin isn't about chance; it's about **respect**. Flipping a coin is just the physical way of saying, 'I hear your claim, and I hear his claim, and neither of you is more important than the other.' If I save the five *because* there are five, I'm telling the one guy his life is worth 20% of theirs. I'm refusing to do that math."

  **Misconception 2: "This means suffering doesn't scale."**
  *   **When it hits:** After he accepts the coin logic but realizes the outcome (5 starve, 1 eats) feels worse.
  *   **The Fear:** He thinks you're denying that 5 deaths are worse than 1 death for the world.
  *   **Where to Block:** Before he accuses you of ignoring consequences.
  *   **The Block:** "Suffering scales for the *world*, but not for *me, the chooser*. Yes, the world has more pain if the five die. But I don't answer to 'the world.' I answer to the person standing in front of me. To the One Guy, his loss is 100%. To the Five, *each* of their losses is 100%. No single person in that group loses 'more' than the One Guy. I can't sacrifice the One Guy to satisfy a math equation that no single individual is actually feeling."

  **Misconception 3: "This is just utilitarianism run backwards."**
  *   **When it hits:** When he tries to categorize your logic as "minimizing good" instead of "maximizing it."
  *   **The Fear:** He thinks you're just playing word games to justify the same calculation.
  *   **Where to Block:** At the very end, as the summary.
  *   **The Block:** "Utilitarianism adds people up into a single container of 'happiness.' I'm saying the container doesn't exist. It's not backwards math; it's **no math**. It's the difference between averaging five test scores and realizing each student gets their own grade. You can't fail the one student just because the other five passed."

  ### 4. The Check Question
  Do not ask, "Do you understand?" Ask this to test if he grasps the **non-pooling of claims**:

  > "If the five people waiting at Door B were all strangers, you say their claims don't add up. If those five people were all brothers from the same family, does their moral claim suddenly become heavier, or does it stay five separate claims that I can't add together?"

  *   **Correct Answer:** It stays five separate claims. (If he says the family matters more, he still thinks claims can aggregate based on relationship, which misses Taurek's point about the separateness of persons).

  ### 5. What to Skip (The Muddy Part)
  **Skip Taurek's "Permissibility" Nuance.**
  *   **The Argument:** Taurek argues that while you are not *obligated* to save the five, you are *permitted* to save them if you want.
  *   **Why Skip It:** Since you *didn't* save the five, introducing this will backfire. If you tell your roommate, "Taurek says I was allowed to save the five, but also allowed to save the one," he will immediately ask, **"So why didn't you just save the five?"**
  *   **The Risk:** This shifts the conversation from the *philosophical principle* (numbers don't count) to a *defense of your specific action* (why you didn't be nicer). Keep the focus on the lack of obligation, not the symmetry of permission. Let him process the "Numbers Don't Count" rule before you admit you had the option to do otherwise.
