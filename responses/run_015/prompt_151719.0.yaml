answer: |-
  **The Translator's Wager**

  There is no single sound for perfect **rhyme**,  
  Just shifting shapes of temporary **meaning**.  
  We break the bone to fit the ghost of **meter**,  
  And call that violence a strange **fidelity**.  
  Until the breath breaks the expected **cadence**,  
  And let the ship of words begin to **drift**.  

  We navigate by stars that slowly **drift**,  
  No mirror holds the exactness of a **rhyme**.  
  A new tongue demands a different **cadence**,  
  Beyond the dictionary's static **meaning**.  
  Perhaps there is no such thing as pure **fidelity**,  
  Only the body keeping time with **meter**.  

  We walk the line of self-imposed **meter**,  
  And learn to love the unavoidable **drift**.  
  This struggle is the only true **fidelity**,  
  Not matching word to word, or sound to **rhyme**.  
  But catching fire from the hidden **meaning**,  
  That lives inside the breath and not the **cadence**.  

  Find **meaning** in the shift of every **cadence**,  
  Keep **fidelity** to pulse, not just to **meter**,  
  And let the constraint make **rhyme** with **drift**.  

  ***

  **Note on Form and Faithfulness**

  Translators and linguists broadly agree on the mechanics of constraint: holding a tight form (like a sestina or sonnet) in translation forces lexical and syntactic changes that a prose rendering would avoid. There is a consensus that something is always lost; no target text can perfectly replicate the semantic field, sonic texture, and cultural resonance of the source simultaneously. However, the field is deeply divided on whether this loss is merely destructive or potentially generative. The contested question is whether form can carry content that no paraphrase recovers, and whether "faithfulness" to an original is a coherent target at all, or if it presumes a stable "original" that doesn't exist across languages.

  This poem takes a specific side in that debate. It argues that faithfulness is not about word-for-word mapping (Stanza 3, Line 4) but about replicating the generative struggle of the form (Stanza 3, Line 3). This leans on the contested view that constraint creates discovery rather than just distortion. By concluding that constraint can "make rhyme with drift" (Envoi, Line 3), the poem suggests that the deviations required by form are not errors to be minimized, but essential components of the new work's truth—a claim that proponents of strict literalism would reject.
