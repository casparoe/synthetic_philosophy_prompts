answer: |-
  **Scenario**

  In the mill town of Oakhaven, the annual "Martyrs' Day" commemorates the 1934 Strike Massacre, where community memory holds that forty workers were executed by militia on the factory steps. This narrative secures the site's protected heritage status, which legally safeguards the union hall containing the only surviving strike ledgers and casualty lists. New forensic and archival work conclusively shows only twelve died, mostly from crush injuries inside the building, with the militia arriving after the fact. The community committee knows that admitting this discrepancy will trigger a state review, likely stripping the heritage status, leading to the hall's demolition and the dispersal of the ledgers, while empowering local denialists to claim the massacre never happened at all.

  **Reasoning**

  *   **Record-first:** This view prioritizes the survival of evidence and the stability of true belief. Correcting the memory now would destroy the physical evidence (the ledgers) and collapse public belief from a specific falsehood (40 killed) to a general falsehood (nothing happened). Therefore, the false memory must be maintained temporarily as the only viable container for the evidence and the only bulwark against total erasure. The aim (truth preserved) dictates the verdict (keep the lie) because the infrastructure for truth cannot survive the correction.
  *   **Memory-constitutive:** This view prioritizes the community's identity and ongoing obligations. The number forty and the location (the steps) are not data points but the foundation of the union's moral authority and the sacred geography of the ritual. Revising the story to twelve deaths inside the building dissolves the specific claims and obligations that constitute the group as *this* community. The record cannot win because the memory is not a claim about the past but a condition of the present.
  *   **Custodial:** This view prioritizes fidelity to the entrusters (the dead) over the utility of the narrative or the survival of the artifacts. The dead entrusted the community with *their history*, not with a useful myth. To continue asserting they were executed on the steps when they died inside is to instrumentalize the dead as a means to protect the ledgers. The custodian's duty is to the people who lived it, not to the preservation of the archive or the identity of the living; therefore, the breach of fidelity must be corrected immediately, even if the trust is broken and the hall lost.

  **Key Feature**

  The work is done by the **instrumental dependency of the evidence on the false memory**. The Record-first view only agrees to keep the memory because the false narrative is the legal lock protecting the true evidence. If you delete this feature—say, the ledgers are already digitized and safe in a university archive—the Record-first view immediately switches to "Correct," aligning with the Custodial view. This collapses the case into the boring 2-1 split (Record and Custodial demand correction; Memory demands preservation), proving that the Custodial view's demand for correction is principled, not pragmatic, while the Record-first view's agreement with Memory is purely contingent.

  **Objection and Reply**

  A hardline Record-first theorist would attack this case by arguing that **preserving evidence through deception corrupts the evidence itself**. They would claim that keeping the false memory alive taints the ledgers with association, making the archive politically compromised and epistemically suspect for future historians. This attack lands partially—it highlights a risk—but it fails to override the immediate certainty of destruction. The Record-first view must weigh the *certain* loss of evidence (demolition) against the *potential* corruption of context (political taint). Unless the theorist can prove the taint renders the evidence useless, the pragmatic calculus of "something true preserved is better than nothing true preserved" holds, keeping their verdict distinct from the Custodial demand for immediate fidelity.
