          *   Effectiveness: Weak. Set theory has its own arithmetic (cardinal arithmetic) where this *is* valid.

      *   *Interpretation 3: Potential vs. Actual Infinity (Aristotelian/Intuitionist).* Infinity is a process, not a completed object.
