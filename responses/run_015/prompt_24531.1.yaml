          *   Effectiveness: Useless against set theory. Hilbert's Hotel isn't about real numbers.

      *   *Interpretation 2: Arithmetic Operations.* You can't do $ \infty + 1 = \infty $ in standard arithmetic without breaking rules (like cancellation).
