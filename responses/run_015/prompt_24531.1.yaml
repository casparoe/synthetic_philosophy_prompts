prompt: |-
  I was in a thread about Hilberts hotel and one guy kept repeating "infinity is not a number" like it was a knockout against the whole actual infinity business, and I couldn't pin down what he was actually claiming. What are the different precise things that one-liner could be standing for, from the trivially true to the really radical, and for each, is it true, and would it actually do the work he wanted, i.e. make the hotel paradox or the reals being bigger then the naturals go away? Lay it out as a menu I can bring back to the thread and tell me which reading he was probably invoking.
reasoning: |-
