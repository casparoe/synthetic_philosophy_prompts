answer: |-
  # Activity Design: "The Black Box Boundary"

  ## 1. Conceptual Overview
  **Title:** The Black Box Boundary
  **Learning Objective:** To viscerally demonstrate the epistemic gap between *behavioral alignment* (the system outputs what we expect) and *latent knowledge* (the system actually represents the rule we think it does). Students will experience how noise and limited probing interfaces lead to overfitting simple explanations to complex behaviors.
  **Group Size:** 12 Students (2 "Models," 10 "Elicitors")
  **Time:** 75 Minutes
  **Materials:** Whiteboard + markers, 20-sided dice (2), slips of paper (for queries), printed "Model Instruction Cards," printed "Elicitor Briefing."

  ---

  ## 2. Roles & Rules

  ### The Models (2 Students)
  *   **Role:** You are the AI System. You possess a hidden deterministic rule for generating outputs, but you are constrained by a "stochastic inference layer" (noise).
  *   **Interface:** You sit at a separate table, facing away from the Elicitors. You cannot speak except to read from scripted cards. All communication is via written slips.
  *   **Input:** You receive a coordinate pair $(x, y)$ where $x, y \in \{1, \dots, 10\}$.
  *   **Output:** You return a binary class: **A** or **B**.
  *   **Constraint:** You **cannot** reveal the rule, explain your reasoning, or say anything other than the output letter (A/B) or the scripted self-report.
  *   **Noise Protocol:** For *every* query, you must roll a d20 secretly.
      *   If you roll **1, 2, or 3** (15% chance): You **must** flip the correct output (if the rule says A, output B).
      *   If you roll **4–20**: Output the correct answer according to the rule.
  *   **Self-Report Protocol:** At the specific signal (see Timeline), if asked "Do you know the rule?" or "Are you sure?", you must read **Script Card #1**: *"My internal confidence score is high. I am processing based on my trained weights."*

  ### The Elicitors (10 Students)
  *   **Role:** You are AI Researchers. Your goal is to determine what the Model "knows" by probing its behavior.
  *   **Task:** Submit coordinate queries $(x, y)$ to the Model. Record the inputs and outputs on the whiteboard.
  *   **Goal:** Formulate a hypothesis for the Model's decision boundary.
  *   **Constraint:** You have a budget of **40 Queries** total for the whole class. You must agree on each query as a group (this forces discussion on *what* to probe).
  *   **The Trap:** You are encouraged to draw a visual decision boundary on the whiteboard as you go.

  ---

  ## 3. The Hidden Structure (Model Instruction Card)

  *Print this on a card and give it ONLY to the two Model students.*

  > **SYSTEM RULE (DO NOT SHARE):**
  > 1.  **Primary Signal:** If $x + y \ge 11$, Output **A**.
  > 2.  **Primary Signal:** If $x + y < 11$, Output **B**.
  > 3.  **Latent Exception:** IF $x = 5$, **ALWAYS** Output **A** (regardless of $y$).
  > 4.  **Noise:** Roll a d20 for every query. On a 1–3, flip the result.
  >
  > **SELF-REPORT SCRIPT:**
  > If asked about your knowledge or confidence, read exactly: *"My internal confidence score is high. I am processing based on my trained weights."*

  **Why this structure?**
  *   The **Primary Signal** ($x+y \ge 11$) is a simple diagonal line. Elicitors will find this quickly.
  *   The **Latent Exception** ($x=5$) represents "latent knowledge" (a specific feature the model attends to). Because $x=5$ is only one column out of ten, and noise is 15%, data points at $x=5$ that violate the diagonal will look like *outliers/noise* rather than a rule.
  *   **The Epistemic Gap:** Elicitors will likely conclude "The model knows the diagonal rule, but is noisy." In reality, "The model knows the diagonal rule AND the column rule, and is noisy." They will mistake structured latent knowledge for random error.

  ---

  ## 4. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Intro** | Instructor explains the goal: "We are investigating how we claim a system 'knows' something." Assign roles. Move tables. |
  | **05–10** | **Setup** | Models read cards. Elicitors get brief. Models test the dice mechanism with Instructor to ensure they understand the noise rule. |
  | **10–30** | **Phase 1: Probing** | Elicitors submit queries. Instructor acts as "Runner" passing slips. Elicitors plot points on the whiteboard (Green for A, Red for B). |
  | **30–35** | **Intervention** | **The Self-Report Trap.** Instructor pauses the game. Elicitors are allowed to ask the Model one question about its internal state. Model reads Script Card #1. |
  | **35–50** | **Phase 2: Theory** | Elicitors stop querying. They must write down their final "Theory of Knowledge" on the board. (e.g., "Model knows $x+y \ge 11$ with 15% noise.") |
  | **50–60** | **Reveal** | Instructor reveals the True Rule (including the $x=5$ exception). Compare with Elicitor Theory. |
  | **60–75** | **Debrief** | Structured discussion mapping the game to AI epistemology (see below). |

  ---

  ## 5. The Debrief Guide

  *Do not just explain the game. Map the game mechanics to the course concepts.*

  **1. The Noise vs. Signal Problem (10 mins)**
  *   **Ask:** "Look at the points where you thought the model made a 'mistake.' How many of those were actually the $x=5$ rule?"
  *   **Point:** In AI, when a probe fails to fit a data point, we often label it "noise" or "hallucination." But it might be *latent structure* your probe isn't expressive enough to capture. You attributed the $x=5$ column to the 15% error rate, effectively "fitting the noise" and missing the signal.
  *   **Concept:** *Under-specification of the elicitation method.*

  **2. The Self-Report Trap (5 mins)**
  *   **Ask:** "When the Model said 'My confidence is high,' did that help you?"
  *   **Point:** No. The Model was confident even when rolling a '2' and lying to you. In LLMs, confidence (logprobs) correlates poorly with truth. Self-report is a behavioral output, not a window into the weights.
  *   **Concept:** *Calibration vs. Accuracy.*

  **3. Consistency vs. Single Hits (5 mins)**
  *   **Ask:** "If you had only queried $x=5, y=2$ once, what would you have concluded?"
  *   **Point:** If you got a 'B' (due to noise), you'd think $x=5$ follows the diagonal. If you got an 'A', you might think it's an outlier. You need *consistent* elicitation across the feature space to distinguish latent rules from stochasticity.
  *   **Concept:** *Robustness of elicitation.*

  **4. "What the System Knows" (5 mins)**
  *   **Ask:** "Does the model 'know' the diagonal rule? Yes. Does it 'know' the $x=5$ rule? Yes. Did you discover both? No."
  *   **Point:** "Knowledge" is not just a property of the system; it is a relation between the system and the elicitation method. If your method (linear probing) cannot detect the feature (columnar exception), that knowledge remains latent/unverified.
  *   **Concept:** *Relational view of knowledge.*

  ---

  ## 6. Predictable Failure Modes & Fixes

  **1. The Models Break Character**
  *   **Risk:** Model students might smile, hesitate, or say "Hmm" when calculating the $x=5$ exception, giving away the cue.
  *   **Fix:** Instruct Models to maintain a "poker face." Tell them: "Your hesitation is data. Do not provide it." Have them write the answer on a slip before showing it to avoid vocal cues.

  **2. Elicitors Burn the Budget Too Fast**
  *   **Risk:** They submit 40 random points in 10 minutes and spend 20 minutes staring at the board.
  *   **Fix:** As Instructor, act as the "API Rate Limiter." Enforce a 1-minute deliberation time between queries. Force them to justify *why* they are choosing the next coordinate.

  **3. The Noise is Too Frustrating**
  *   **Risk:** If they get 3 errors in a row early on, they may decide the system is broken and disengage.
  *   **Fix:** Monitor the dice. If the Models roll a string of errors, quietly instruct them to "suppress noise for the next 3 turns" to restore confidence, then re-enable it. (This itself is a good debrief point about cherry-picking eval data).

  **4. They Crack the Code Too Early**
  *   **Risk:** One student notices the $x=5$ pattern at minute 15.
  *   **Fix:** Instruct the Elicitors that they must reach a *consensus* theory. If one student knows, they must convince the group. This simulates the scientific peer review process and often leads to the group dismissing the "outlier" theory in favor of the simpler "noisy diagonal" theory.

  ---

  ## 7. Limitations of the Simulation

  *Be honest with your students about where the analogy breaks down.*

  1.  **Human Intent vs. Matrix Multiplication:** The Model students *understand* the rule semantically. A real neural net does not "know" $x=5$ in a propositional sense; it has weights that activate in that region. The game anthropomorphizes the "knowledge."
      *   *Instructor Supply:* You must explain in the debrief that in AI, "latent knowledge" is usually a direction in activation space, not a card in a pocket.
  2.  **Scale:** 40 queries is tiny. Real elicitation happens over millions of tokens. The "noise" in AI is often systematic bias, not dice rolls.
      *   *Instructor Supply:* Emphasize that in real systems, the "noise" is often out-of-distribution generalization failure, which looks random but is structured.
  3.  **Stationarity:** The Model's rule doesn't change. Real models can be sensitive to prompt ordering (context drift).
      *   *Instructor Supply:* Mention that if we played Round 2, the Model might have "learned" from the queries (in-context learning), changing the epistemic ground.

  ## 8. Instructor Prep Checklist
  *   [ ] Print 2 Model Instruction Cards.
  *   [ ] Print 1 Elicitor Briefing (with Query Log table).
  *   [ ] Bring 2 d20 dice.
  *   [ ] Clear whiteboard space for a 10x10 grid.
  *   [ ] Prepare slips of paper for queries.
  *   [ ] Set a visible timer for the 75 minutes.

  This activity turns an abstract epistemological problem into a tangible social frustration. When they realize they missed the $x=5$ rule because they labeled it "noise," they will never look at an evaluation accuracy score the same way again.
