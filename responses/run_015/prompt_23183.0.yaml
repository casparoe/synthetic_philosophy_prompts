answer: |-
  This is one of the most classic "3am Wikipedia spirals" in social choice theory, and your intuition that something is off is correct. You aren't misreading the conclusions, but you are likely conflating the **informational basis** of the two theorems.

  The short answer is: **They are not in conflict.** They are running on different data types. Arrow proves that you cannot fairly aggregate *ordinal rankings*. Harsanyi proves that if you *already have cardinal utilities*, you must aggregate them linearly (utilitarianism).

  Harsanyi does not "rescue" utilitarianism from Arrow; rather, Harsanyi assumes away the specific informational scarcity that causes Arrow's impossibility. To get Harsanyi's result, you must accept assumptions that Arrow explicitly treats as impossible or undesirable.

  Here is the mechanistic breakdown of where the divergence happens, specifically looking at the axioms and the "data types" involved.

  ---

  ### 1. The Data Types: Ordinal vs. Cardinal

  This is the single most important distinction.

  *   **Arrow's Input (Ordinal):** Each voter provides a ranking: $A \succ B \succ C$.
      *   *Information content:* We know $A$ is better than $B$. We do **not** know how much better. We cannot compare the "strength" of Voter 1's preference to Voter 2's preference.
  *   **Harsanyi's Input (Cardinal/vNM):** Each voter has a utility function $U_i$ over lotteries.
      *   *Information content:* We know the *intensity* of preference via risk behavior. If Voter 1 is indifferent between "Sure thing $B$" and "50% $A$, 50% $C$", we know $B$ is exactly halfway between $A$ and $C$ for them. This creates a cardinal scale (unique up to positive affine transformation).

  **The Mechanism:** Arrow's impossibility arises because the aggregation function is "blind" to intensity. If everyone prefers $A$ to $B$ slightly, but one dictator prefers $B$ to $A$ massively, Arrow's system treats these as identical inputs. Harsanyi's system captures that massivity through the utility values.

  ### 2. The Axiom Showdown

  Let's look at the specific axioms that do the heavy lifting and how they diverge.

  #### Arrow's "Killer" Axiom: Independence of Irrelevant Alternatives (IIA)
  *   **Definition:** The social ranking of $A$ vs. $B$ must depend **only** on the individual rankings of $A$ vs. $B$. It cannot depend on how individuals feel about $C$.
  *   **Why it breaks things:** In an ordinal world, IIA strips away the only context we have. If I prefer $A \succ B \succ C$ and you prefer $B \succ C \succ A$, Arrow says the social decision on $A$ vs $B$ cannot look at $C$. But often, $C$ is the compromise candidate. By forbidding the system from looking at the "shape" of the full preference profile, IIA prevents the system from detecting intensity or compromise.
  *   **Result:** Combined with Unrestricted Domain and Pareto, IIA forces the system to lock onto a single voter's ordering to maintain transitivity, creating a dictator.

  #### Harsanyi's "Killer" Axiom: vNM Independence + Pareto
  Harsanyi doesn't use Arrow's IIA. He uses the **von Neumann-Morgenstern Independence Axiom** applied to both individuals and the social planner.
  *   **Definition:** If an agent prefers Lottery $L_1$ to $L_2$, they must prefer a mixture $(p L_1 + (1-p) L_3)$ to $(p L_2 + (1-p) L_3)$.
  *   **The Mechanism:** This axiom forces preferences to be representable as **expected utility**. Once you have expected utility, preferences are linear.
  *   **The Aggregation Step:** Harsanyi adds the **Pareto Principle** over lotteries: If every individual prefers Lottery $L_1$ to $L_2$, society must prefer $L_1$ to $L_2$.
  *   **The Math:** If individual preferences are linear functions (due to vNM), and the Social Welfare Function (SWF) must respect Pareto (preserve the ordering of those linear functions), the only mathematical function that maps a set of linear functions to a single linear function while preserving order is a **weighted linear sum**.
      *   $W = \sum a_i U_i + b$
      *   This is Utilitarianism.

  ### 3. The Hidden Assumption: Interpersonal Comparability

  This is where the "rescue" fails.

  *   **Arrow:** Explicitly assumes **no interpersonal comparison of utility**. Since inputs are just rankings ($A \succ B$), there is no unit of measurement to compare Voter 1's happiness to Voter 2's.
  *   **Harsanyi:** Implicitly requires **interpersonal comparability of utility units**. To sum $U_1 + U_2$, the "utils" must mean the same thing across people.
      *   vNM utility is cardinal, but it is only unique up to *affine transformation* ($U' = aU + b$).
      *   I can scale my utility function however I want. If I say my utility for an apple is 100, and you say yours is 1, Harsanyi's sum depends entirely on those arbitrary scalings.
      *   For Harsanyi's theorem to yield a *moral* conclusion (Utilitarianism), you must add an extra ethical axiom: **The units of utility are comparable across persons.** (Often justified by the "Impartial Observer" thought experiment: if you had an equal chance of being anyone, how would you rank the societies?)

  Arrow's theorem says: "If you can't compare utilities, you can't aggregate fairly."
  Harsanyi's theorem says: "If you *can* compare utilities (and accept vNM rationality), you *must* aggregate via summation."

  ### 4. Why the Results Flip

  | Feature | Arrow's Impossibility | Harsanyi's Aggregation |
  | :--- | :--- | :--- |
  | **Domain** | Deterministic outcomes ($A, B, C$) | Lotteries / Risk ($0.5A + 0.5B$) |
  | **Input Type** | Ordinal Rankings ($\succ$) | Cardinal Utilities ($U$) |
  | **Key Constraint** | **IIA** (No context allowed) | **vNM Independence** (Linearity required) |
  | **Comparability** | Forbidden (Invariance to monotonic transforms) | Required (Invariance to affine transforms only) |
  | **Result** | Dictatorship (or impossibility) | Weighted Utilitarian Sum |

  **The Mechanism of the Flip:**
  Arrow's IIA prevents the aggregation rule from using information about *intensity*. Harsanyi's vNM framework *defines* preferences such that intensity is the primary feature (via risk trade-offs).
  *   In Arrow's world, if I love $A$ and mildly dislike $B$, and you mildly love $B$ and hate $A$, the system sees a tie (1 vote each).
  *   In Harsanyi's world, the lottery structure reveals my intensity. I would pay more (in probability space) to secure $A$ than you would to secure $B$. The linear sum captures this.

  ### 5. The Honest Verdict

  **Does Harsanyi rescue Utilitarianism from Arrow?**
  **No.** It sidesteps it by changing the problem definition.

  Here is the hard truth that usually ends the 3am spiral: **Harsanyi's theorem is arguably more demanding than Arrow's.**

  To use Harsanyi, you must accept:
  1.  **vNM Rationality:** People actually behave like expected utility maximizers (empirically false, see: Allais Paradox, Prospect Theory).
  2.  **Interpersonal Comparability:** We can meaningfully say "one unit of my utility equals one unit of your utility." This is philosophically massive. Arrow specifically rejected this because it requires a "god's eye view" of happiness that liberal democracies usually claim we don't have.
  3.  **Lotteries:** The moral worth of a policy depends on how people value risk, not just outcomes.

  **Where you are misreading (slightly):**
  You aren't misreading the theorems, but you might be misreading the **normative weight** of Harsanyi's assumptions.
  *   Arrow says: "Given minimal, weak assumptions (just rankings), fairness is impossible."
  *   Harsanyi says: "Given strong, specific assumptions (cardinal utility, risk rationality, comparability), Utilitarianism is unique."

  Harsanyi doesn't prove Utilitarianism is *true*; he proves Utilitarianism is the **only consistent system if you accept the vNM framework and interpersonal comparability.** If you reject interpersonal comparability (as Arrow does), Harsanyi's theorem collapses back into Arrow's impossibility.

  ### Summary for the Engineer
  Think of it like type systems:
  *   **Arrow** is trying to write a function `aggregate(List<Ranking>) -> Ranking`. He proves that without throwing exceptions (dictatorship), this function cannot satisfy the interface constraints.
  *   **Harsanyi** is writing `aggregate(List<UtilityFunction>) -> UtilityFunction`. He proves that if the `UtilityFunction` class implements the `vNM_Rational` interface, the only implementation of `aggregate` that satisfies `Pareto` is `sum()`.

  The conflict vanishes when you realize `Ranking` does not implement `vNM_Rational`. You cannot call Harsanyi's function on Arrow's data. To use Harsanyi, you have to cast your data to `UtilityFunction`, which requires adding metadata (intensity/comparability) that Arrow explicitly says we don't have.

  **Conclusion:** They are not in conflict. Arrow defines the limits of **ordinal** democracy. Harsanyi defines the logic of **cardinal** welfare. If you want to escape Arrow's impossibility, you must pay the "tax" of accepting cardinal, interpersonally comparable utility. Whether that tax is worth paying is a political/philosophical question, not a mathematical one.
