answer: |-
  **Presentation Title:** Fluid Concepts and Frozen Decisions: A *Copycat* Analysis of the 2006 IAU Pluto Reclassification

  **Seminar:** Philosophy of Science
  **Subject:** Analogical Reasoning in Scientific Taxonomy

  ---

  ### 1. Introduction: The Cognitive Architecture of Taxonomy

  Douglas Hofstadter and Melanie Mitchell's *Copycat* model proposes that human reasoning is not based on rigid symbolic logic, but on fluid concepts that shift under contextual pressure. In the *Copycat* microdomain (letter-string analogies like *abc $\to$ abd*, *ijk $\to$ ?*), meaning emerges from the competition of small processes ("codelets") that allow concepts to "slip" (e.g., treating a "letter" as a "group") to preserve structural coherence.

  This presentation applies that architecture to the 2006 International Astronomical Union (IAU) decision to reclassify Pluto. I argue that the discovery of Eris created a high-"temperature" analogical crisis that forced conceptual slippage in the definition of "planet." However, the resolution reveals a critical limitation in the *Copycat* model: while scientific *reasoning* behaves like a fluid microdomain, scientific *taxonomy* is subject to institutional "freezing" that halts the bottom-up processing *Copycat* describes.

  ---

  ### 2. Mapping the Microdomain: The Solar System as a Letter String

  To apply *Copycat*, we must first translate the astronomical context into a structured microdomain where relationships, not just objects, are primary.

  **The "Letters" (Primitive Objects):**
  In *Copycat*, letters are the basic tokens. In this case, the tokens are celestial bodies. However, they are not defined by their physical composition alone, but by their relational properties:
  *   **Pluto:** The anomaly (small, eccentric orbit, historical status).
  *   **Eris:** The catalyst (similar mass to Pluto, distant orbit).
  *   **Ceres:** The historical precedent (once a planet, then asteroid, now dwarf planet).
  *   **Neptune/Earth:** The prototypes (dynamically dominant, "clean" orbits).

  **The "Groups" (Categories):**
  *   **"Planet":** The target concept being transformed.
  *   **"Dwarf Planet" / "KBO":** Emerging categories formed to resolve tension.

  **The "Relations" (Rules of Transformation):**
  *   **Hydrostatic Equilibrium:** "Roundness" (Intrinsic property).
  *   **Orbital Clearing:** "Dominance" (Relational property).
  *   **Historical Precedent:** "Legacy Status" (Temporal property).

  **The Analogical Prompt:**
  If we view the history of classification as a string transformation, the prompt is:
  *   *Pre-2006:* {Mercury, ..., Pluto} $\to$ "9 Planets."
  *   *Post-Discovery:* {Mercury, ..., Pluto, **Eris**} $\to$ ?
  *   *The Problem:* If the rule is "Round object orbiting Sun," then Eris $\to$ Planet. But this implies a string of 10, then 12, then 50+ "letters." The pattern loses its coherence (Gestalt).

  ---

  ### 3. Tracing Conceptual Slippages: The Rise in Temperature

  In *Copycat*, "temperature" represents the system's uncertainty. As anomalies arise, temperature rises, allowing concepts to slip to find a new fit. The discovery of Eris raised the temperature of the planetary taxonomy system.

  **Slippage 1: Intrinsic $\to$ Relational**
  *   *Default Concept:* A "planet" is defined by what it *is* (round, orbits Sun).
  *   *The Slip:* Under pressure from Eris, the definition slid to what a planet *does* (clears its neighborhood).
  *   *Copycat Parallel:* This is analogous to slipping from "letter identity" (the letter 'a') to "positional identity" (the first letter). Pluto remained "round" (intrinsic), but failed the "dominance" (relational) test.

  **Slippage 2: Binary $\to$ Graded (and back to Binary)**
  *   *The Tension:* Physically, there is a continuum of sizes. A fluid concept might allow "planet" to be a gradient (e.g., "degree of planethood").
  *   *The Resolution:* The IAU forced a binary slip. Objects are either "Planets" or "Dwarf Planets."
  *   *Copycat Parallel:* In *Copycat*, the system eventually settles on a single best answer (e.g., *ijl*). The IAU settlement mimics this "cooling" process, but as we will see, the mechanism of cooling differs.

  **The Role of "Clearing the Neighborhood"**
  Did this criterion function as an artificial rigid boundary or a conceptual slide?
  *   *As a Slide:* It represents a shift in *salience*. Previously, orbit-clearing was irrelevant background noise. Under analogical pressure from Eris, this feature was highlighted to distinguish Pluto from the "prototype" planets (Jupiter, Neptune).
  *   *As a Boundary:* It was selected specifically to *stop* further slippage. Without it, the concept of "planet" would stretch indefinitely. It functions as a "stop rule" inserted to prevent the category from becoming useless.

  ---

  ### 4. Evaluating Hofstadter's Claim: Fluidity vs. Institutional Authority

  This case study partially validates Hofstadter's claim that real-world concepts are fluid, but it exposes a structural disanalogy regarding *how* stability is achieved.

  **Support for Fluidity:**
  The episode confirms that scientific concepts are not classically defined (necessary and sufficient conditions waiting to be discovered). The definition of "planet" changed not because we learned new facts about Pluto (we knew its size for decades), but because the *context* changed (Eris arrived). The concept stretched and shrank based on analogical pressure, exactly as *Copycat* predicts. The "meaning" of planet is dependent on the surrounding "letters" (other bodies).

  **The Breakdown: Top-Down vs. Bottom-Up**
  Here, the *Copycat* analogy breaks down.
  *   **Copycat Processing:** Purely bottom-up. Thousands of codelets compete; the answer emerges from parallel activity. There is no "Boss Codelet" that declares the answer final. The temperature cools naturally as coherence is found.
  *   **IAU Processing:** Top-down constraint. The "temperature" of the debate was high (public outcry, scientific disagreement), but the concept was frozen by a vote (424 astronomers).
  *   **The Consequence:** In *Copycat*, if the context changes again, the answer can slip again. In the IAU case, the definition was codified. The institutional authority introduced a **rigid symbolic layer** on top of the fluid cognitive layer.

  **Institutional Freezing:**
  The IAU decision functions like an external hand reaching into the *Copycat* program and hard-coding the output. This suggests that while *scientific reasoning* (the discovery and debate phase) behaves like a fluid microdomain, *scientific taxonomy* (the nomenclature phase) behaves like a bureaucratic database. The "concept" in the public mind remains fluid (many still call Pluto a planet), but the "official label" is rigid.

  ---

  ### 5. Conclusion: Fluid Cognition, Frozen Labels

  Does Pluto's demotion reveal that scientific taxonomy behaves like a *Copycat* microdomain?

  **Yes,** insofar as the *pressure* leading to the change was driven by analogical slippage. The category "planet" proved to be fluid, shifting its boundaries to accommodate new structural relationships (Eris/Pluto/Ceres) rather than adhering to a static definition. The "Clearing the Neighborhood" rule was a creative slippage from intrinsic to relational properties to restore coherence.

  **No,** insofar as the *resolution* violates the bottom-up architecture of the model. *Copycat* cannot account for the sociological mechanism of the IAU vote, which imposed a top-down "freeze" on the concept.

  **Final Verdict:**
  The 2006 episode demonstrates that scientific concepts are cognitively fluid but institutionally fragile. Hofstadter's model accurately describes the *crisis* of conceptual change, but it fails to model the *politics* of conceptual stabilization. Pluto's demotion shows that while nature provides the analogical pressure, human institutions provide the rigid boundaries. Therefore, scientific taxonomy is a **hybrid system**: it operates as a fluid *Copycat* domain during discovery, but transforms into a rigid symbolic system during codification. To fully model scientific change, a *Copycat* architecture would need to be augmented with a mechanism for "institutional codelets" capable of overriding emergent coherence with authoritative fiat.
