  8.  **Self-Correction during drafting:** I initially thought about saying SSA is $\alpha=0$. But strictly, SSA is Likelihood $\propto 1/N$. SIA is Prior $\propto N$. The product is the posterior. The user's $\alpha$ tries to sweep both into one parameter. I need to point out that this obscures the mechanism. The mechanism matters for the Presumptuous Philosopher.
      *   Also, need to clarify that "I exist" is the tricky datum. In standard Bayes, we condition on data we *have*. Do we have "I exist" as data? Or is it a precondition? SIA says data. SSA says precondition.

