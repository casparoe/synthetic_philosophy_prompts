      *   *Q2: Reference Class vs. Measure Ambiguity.*
          *   It's exactly measure ambiguity. Defining the reference class is defining the domain over which the measure is normalized. It's unforced and changes the answer.
      *   *Q3: The Likelihood & Indexical Facts.*
