          3.  Critique the user's "toy model" ($N^\alpha$ parameterization).
          4.  **Constraint:** Spend most words on where the translation *fails*, not where it succeeds. Don't be polite about the toy model if it's confused.

  2.  **Deconstruct the Core Dispute (SSA vs. SIA) in Bayesian Terms:**
      *   *Standard Bayesian Setup:* $P(H|D) \propto P(D|H) P(H)$.
      *   *Anthropic Setup:* $H$ = Hypothesis about the world (e.g., total population $N$). $D$ = Data (e.g., "I exist", "My rank is $n$").
      *   *SSA (Self-Sampling Assumption):* "Reason as if you are a random sample from the set of all observers in your reference class."
          *   Bayesian translation: Likelihood $P(\text{I am } n | H_N) = 1/N$. (Uniform sampling from $N$).
          *   Prior: Usually taken as flat over $H$ (or independent of $N$).
      *   *SIA (Self-Indication Assumption):* "Given that you exist, you should favor hypotheses according to the number of observers they contain."
          *   Bayesian translation: Prior $P(H_N) \propto N$. (Or Likelihood $P(\text{I exist} | H_N) \propto N$).
          *   Likelihood for rank: $P(\text{I am } n | H_N, \text{I exist}) = 1/N$.
      *   *The Tension:* SSA puts the $N$ dependence in the likelihood of the indexical fact. SIA puts the $N$ dependence in the prior (or the likelihood of existence).
      *   *The Measure Problem:* In cosmology, we define a measure $\mu$ over the multiverse. $P(H) \propto \mu(H)$. SIA is effectively choosing a measure proportional to the number of observers. SSA is choosing a measure proportional to the number of *worlds* (or uniform over worlds), then sampling observers within them.

  3.  **Address the "Residue Report" Questions:**

      *   *Q1: Is it just a prior/measure disagreement?*
