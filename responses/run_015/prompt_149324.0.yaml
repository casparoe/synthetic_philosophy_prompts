answer: |-
  Good evening. Thank you for coming.

  For sixty years, this painting has hung in this room. For most of that time, it hung in my Great-Aunt Hilda's front room. If you grew up in this town, you know this landscape. You know the dark trees, the hint of water, the quiet light. For sixty years, we have called it "our Sonnevelt."

  When my aunt Hilda gave this painting to the museum in 1963, she taped a note to the back of the panel. It wasn't a certificate of value. It wasn't a demand for recognition. It was three sentences. "For the town," she wrote, "so that everybody can see something beautiful."

  Last year, the museum board applied for a grant to care for our collection. Part of that care involves asking questions we haven't asked in a long time. We wanted to know how to preserve the paint, how to stabilize the wood. We wanted to make sure this beautiful thing lasts for another sixty years. To do that, we needed to understand exactly what it is made of.

  So, we took it to a conservator. We looked at the wood of the panel. We looked at the layers of paint. We looked at the signature.

  What we found was complicated, and I want to share it with you plainly.

  The wood this is painted on comes from a tree that was still growing after Adriaen Sonnevelt had died. The signature on the front was added with a pigment that wasn't invented until two hundred years later. The image itself is based on a composition that existed in Sonnevelt's workshop, but the hand that painted this specific panel was working later, in the 1680s.

  This is not the original painting by Adriaen Sonnevelt. It is a painting from his time, by a painter we don't know, working in his style. It is a piece of the seventeenth century, but it is not the piece we thought it was.

  I know what some of you are feeling. I feel it too. There is a sense of loss. When a name we trusted slips away, it feels like the ground has shifted. My mother has worried that this means her mother was deceived. That Hilda was made a fool. That the value has gone out of the room.

  I am standing here to tell you that is not true.

  Hilda was not deceived about the only thing that mattered to her. She didn't buy this to flip it for a profit. She didn't buy it to win an argument with an expert. She bought it because she loved it. She looked at this night landscape, and she saw something beautiful. And she decided that everyone in this town should see it, too.

  Did she have the thing she thought she had? In terms of art history, no. But in terms of human experience? Yes. She had a seventeenth-century painting. She had a piece of history. And for sixty years, she gave this town a point of pride. We put it on our brochures. We brought visitors here. We told our children that we had something rare.

  That pride was real. The visitors were real. The beauty is still real.

  The conservator who examined this called it "an authentic document of a mistake." That sounds cold. It sounds like we are keeping an error in a display case. But I think it is something more than that. It is a document of belief. For sixty years, this town looked at this canvas and saw quality. We saw history. We saw something worth keeping. It turns out we were right about the quality, and we were right about the history, even if we had the wrong name for it.

  An object is not just the moment it leaves the artist's easel. An object is everything that happens to it afterward. It is the frame it sits in. It is the light it hangs in. It is the hands that dust it, and the eyes that rest on it. For sixty years, this painting has been "our Sonnevelt." That story is now part of the wood and the paint. We cannot strip that away without stripping away our own history.

  So, we have a decision to make about what goes on the wall tomorrow.

  We could take down the brass plaque that says "Sonnevelt." We could replace it with a sterile label that lists the wood density and the pigment analysis. That would be scientifically accurate. But it would be historically dishonest. It would pretend the last sixty years didn't happen.

  Or, we could pretend nothing changed. We could leave the plaque and let the brochure lie. But that disrespects the truth, and it disrespects the intelligence of this community.

  So, we are choosing a third path.

  The brass plaque my aunt Hilda hung will remain. It will stay right where it is. It is part of the painting's life now. It marks the moment this painting became ours. But next to it, we will mount a new label. This label will tell the full story. It will explain that this is a seventeenth-century work, attributed to Sonnevelt for many years, but now understood to be from his circle, painted shortly after his death. It will explain the science. And it will tell Hilda's story.

  And regarding our town brochure: The museum cannot endorse a name we know to be incorrect. We will be asking the selectmen to update the text to reflect the painting's true history. Not to remove it from the brochure—that would be a shame—but to tell the story correctly. A town that can admit a mistake, and find value in it anyway, is a town with confidence.

  I want to speak to my mother, and to my cousin, and to everyone who loved this picture as it was. I did not take anything away from Hilda. I didn't take the beauty. I didn't take the gift.

  Hilda wrote, "So that everybody can see something beautiful." She didn't write, "So that everybody can see a specific investment." She didn't write, "So that experts can nod their heads."

  She wanted us to see something beautiful.

  Look at it. Really look at it. The light is still catching the leaves. The night is still quiet. The paint is still three hundred years old. The gift is still exactly what it was in 1963.

  We are not losing a masterpiece. We are gaining a story. We have a painting that survived three centuries, traveled from a Dutch workshop to a New England front room, and brought a town together for sixty years under a name that wasn't quite its own. That is a rare thing.

  Hilda gave us this picture so we could see something beautiful. She succeeded. The name on the plaque is just a word. The beauty is the fact. The gift is the fact. And we are still here, looking at it together, just as she asked.

  Thank you.
