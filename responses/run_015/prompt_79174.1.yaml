answer: |-
  You have put your finger on the central, often unacknowledged weakness in long-term historical sociology, specifically the kind popularized by Steven Pinker (*The Better Angels of Our Nature*). You are describing a problem that sits at the intersection of psychometrics, philosophy of science, and moral history.

  There isn't one single perfect phrase, but there are three "carvings" that map onto different parts of the bind you're describing.

  ### 1. The Labels

  **A. Concept Creep (Psychology/Sociology)**
  The closest established term is **Concept Creep**, coined by psychologist Nick Haslam. He describes how concepts like "harm," "trauma," and "violence" expand semantically over time to include phenomena previously considered mundane or private.
  *   **Why it fits:** It captures the widening of the category (corporal punishment $\rightarrow$ abuse).
  *   **Why it's insufficient:** Haslam focuses mostly on the *consequences* of the creep (sensitivity vs. resilience), not necessarily the *historical measurement bind* you're highlighting.

  **B. Lack of Diachronic Measurement Invariance (Psychometrics)**
  In statistics, for a trend to be real, the ruler must stay the same. This is **Measurement Invariance**. When you measure "violence" in 1400 and "violence" in 2024, you are violating **Diachronic Invariance**.
  *   **Why it fits:** This is the technical name for your bind. It acknowledges that the "construct" (violence) is not stable across time.
  *   **The specific bind:** You are describing **Construct Drift driven by Normative Shift**. The moral shift changes the behavior *and* the definition simultaneously, making the variable endogenous to the culture you're studying.

  **C. Historical Ontology (Philosophy)**
  Philosopher Ian Hacking calls this **Historical Ontology**. He argues that some categories (like "child abuse" or "homosexuality") do not just *describe* a pre-existing reality; they *create* a new kind of reality.
  *   **Why it fits:** Before the concept of "domestic violence" existed as a public crime, a husband beating a wife was an *institutional fact* of discipline. Once the concept exists, it becomes a *brute fact* of assault. You cannot count the former using the ledger of the latter because the ontology of the act has changed.

  ### 2. How it differs from the Observer Effect

  The **Observer Effect** implies that the act of measuring changes the thing being measured (e.g., checking tire pressure lets air out, or people behave better when watched).

  Your bind is different. It is not that *measuring* violence changes violence. It is that **moral progress changes the definition of violence, which changes the count, which is then used to prove moral progress.**

  This is a **Tautological Loop** or **Reflexivity**.
  *   *Observer Effect:* $Measurement \rightarrow Change in Phenomenon$.
  *   *Your Bind:* $Moral Shift \rightarrow (Change in Phenomenon + Change in Definition) \rightarrow Apparent Progress$.

  The "progress" is baked into the measurement tool because the tool was forged by the same moral shift that produced the progress.

  ### 3. The Medical Analogy: Heart Attacks vs. Violence

  You asked if this is the same as heart attack or autism rates rising due to better detection. **It is structurally similar but ontologically distinct.**

  *   **Heart Attacks (Epistemic Change):** The blocked artery existed in 1800. We just didn't have the test. The reality was there; the *knowledge* was missing. If we could time-travel with an EKG, we could count them.
  *   **Violence (Normative Change):** Did the "violence" exist in 1800? Physically, yes (the hit). Socially/Legally, no (it was discipline).
      *   If you count the hit as violence, you are imposing a modern moral framework on the past (**Anachronism**).
      *   If you don't count it, you are blind to the suffering (**Historical Amnesia**).

  With heart attacks, the redefinition is **convergent** (getting closer to the biological truth). With violence, the redefinition is **divergent** (changing the social truth). The "fact of the matter" for a heart attack is biological; the "fact of the matter" for violence is partly legal and moral.

  ### 4. The Carving: How to actually answer the question

  You asked: *"If I freeze today's definition and recount the past, do I get a fact of the matter or just a guess dressed up?"*

  If you freeze today's definition (e.g., "any non-consensual physical impact"), you get **a guess dressed up**. You get a **Counterfactual Projection**. You are asking: "How many acts occurring in 1400 would be prosecuted in 2024?" That is a valid moral question, but it is not a valid statistical trend. It measures *our* moral sensitivity, not *their* behavior.

  To actually carve this without lying, you have to split the variable. You cannot measure "Violence" as a single number across centuries. You must measure two distinct tracks:

  **Track A: Lethality / Physical Harm (Objective)**
  *   Homicide rates (bodies are hard to hide).
  *   Skeletal trauma (archaeology).
  *   War battle deaths.
  *   *Why:* These are "brute facts." A dead body is a dead body, regardless of whether the culture mourns it or celebrates it. Pinker's strongest data is here.

  **Track B: Illegitimacy / Sanction (Subjective)**
  *   Percentage of physical punishments that are criminalized.
  *   Legal rights of wives/children.
  *   Social stigma attached to hitting.
  *   *Why:* This measures the *moral progress* directly, rather than trying to proxy it through violence stats.

  **The Bind Resolved:**
  The "decline of violence" is actually a conflation of two different trends:
  1.  A decline in **Lethality** (fewer people are being killed).
  2.  An increase in **Sensitivity** (more non-lethal acts are being condemned).

  When you mash these together, you get the paradox you noticed. If sensitivity increases, the *recorded* rate of "violence" should arguably go *up* (because we count more stuff), even if the *lethality* goes down. If the stats show a decline *despite* the widening definition, the decline in lethal harm must be massive to offset the widening net.

  ### Summary of the Edges

  *   **What this isn't:** It isn't just "data quality." It isn't the Observer Effect. It isn't the same as medical detection (because the "disease" is partly defined by the cure).
  *   **The Name:** **Diachronic Measurement Non-Invariance driven by Normative Shift.** (Or, less clunkily: **Moral Construct Drift**).
  *   **The Trap:** Assuming that because we have a word for it now ("domestic violence"), we can count it then.
  *   **The Way Out:** Admit that "Violence" is not a natural kind like "Gold" or "Arteries." It is a **Institutional Fact**. You can measure the *harm* across time, and you can measure the *condemnation* across time, but you cannot measure the *violence* across time as a single continuous variable.

  The trend is real, but it is not one trend. It is the intersection of a biological trend (less killing) and a moral trend (more labeling). Confusing the two is where the debate gets stuck.
