          2.  The Names (Concept Creep, Measurement Invariance, Historical Ontology).
          3.  The Distinctions (Observer Effect, Medical Redefinition).
          4.  The Moral Dimension (Why it's different from heart attacks).
          5.  The "Carving" (How to actually think about it without lying).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Concept Creep" and stop. The user specifically asked about the *measurement bind* where the classification and the phenomenon move together. This is **Endogenous Change**. The moral shift causes less violence *and* different labeling.
      Actually, the user says: "the attitudes that did the widening are the same attitudes we're now using to judge that things got better." This is **Circularity** or **Tautology** in moral progress narratives.
      Let's call it the **Normative Measurement Loop**.
      Okay, I will offer "Concept Creep" as the popular term, "Measurement Invariance" as the technical term, and "Historical Ontology" as the philosophical term.

      *Key distinction on the Medical vs. Moral:* In heart attacks, the artery blockage existed before the test. In violence, did the wife-beating exist as "violence" before the concept? Physically yes, socially no. This is the **Brute Facts vs. Institutional Facts** distinction (Searle).

