      *   **The Bind:** The *widening* of the category (more things count as violence) makes the trend look like progress (because we condemn more things), but it also makes historical comparison impossible (because old records don't categorize those acts as violence). The moral shift drives *both* the reclassification and the judgment of improvement.
      *   **Questions:**
          1.  Is there an established name for this specific bind? (Not just "definitions change," but co-moving measurement and phenomenon downstream of the same cause).
          2.  How does it differ from the Observer Effect or Concept Creep?
          3.  Does the moral dimension matter? (Compare to heart attacks/autism diagnosis where redefinition is technical/medical, not moral).
          4.  What would it take to answer the violence question? (Freezing definitions vs. historical reality).
          5.  **Preference:** "I'd rather have the carving than the label" (Focus on conceptual clarity and boundaries, not just jargon).

  2.  **Initial Brainstorming & Terminology Search:**

      *   *Concept Creep:* Nick Haslam. This fits the "widening category" part (harm, trauma, violence expanding). But does it capture the *historical measurement* problem? Yes, partially.
      *   *Observer Effect:* No, that's about measuring changing the thing measured. This is about *defining* changing the count.
      *   *Goodhart's Law:* No, that's about metrics becoming targets.
      *   *Reflexivity:* George Soros / Social Sciences. The idea that theories influence the reality they describe. Close, but maybe too broad.
      *   *Historical Ontology:* Ian Hacking. How categories come into being and change reality. Very close.
      *   *Measurement Invariance:* Psychometrics. The requirement that a measure means the same thing across groups/time. This is the technical statistical term for the problem.
      *   *Survivorship Bias / Selection Bias:* No.
      *   *Anachronism:* Applying present concepts to the past.
      *   *Moral Progress vs. Statistical Artifact:* The core tension.

  3.  **Synthesizing the "Specific Bind":**

      The user is describing a situation where the *normative framework* changes, which alters both the *behavior* (less violence because it's condemned) and the *classification* (more things count as violence because it's condemned).
      *   If we use *old* definitions: Violence might look stable, but moral horror increases.
      *   If we use *new* definitions: Violence looks like it increased (initially) or the data is missing, but we claim it decreased.
      *   Actually, Pinker argues violence *decreased*. The user argues that if we count the stuff that *used to be ignored*, the baseline was higher, so the drop looks bigger. But we can't count it because records don't exist.
      *   Wait, let's re-read the user's specific point: "A lot of the apparent drop seems to come from stuff that never used to count as violence now counting as violence... if you want to go back and count those under today's definition you mostly can't."
      *   So, the *recorded* rate drops because we stopped recording/doing it? Or because we define it differently?
      *   The user says: The widening of the category makes the trend look like progress (we are better) but makes it unclear if the trend is about the world or us.
      *   This is **Measurement Non-Invariance** driven by **Normative Shift**.
      *   In philosophy/sociology, this is often discussed under **Historical Ontology** (Hacking) or **Concept Creep** (Haslam), but the specific *measurement* problem is **Lack of Diachronic Validity**.

  4.  **Addressing the Comparisons:**

      *   *Observer Effect:* No. That's physical/quantum or behavioral reaction to being watched. This is semantic/normative.
      *   *Concept Creep:* Yes, this is the closest popular term. Haslam specifically talks about "harm" and "violence" expanding. But the user wants to know about the *measurement bind*.
      *   *Heart Attacks/Autism:* These are **Diagnostic Expansion** or **Surveillance Bias**. The difference is the *moral valence*. With heart attacks, it's technical precision. With violence, it's moral recognition. The user asks if this matters. It matters because moral recognition changes the *ontology* of the act (it becomes a crime, not discipline).

  5.  **Drafting the Response - Section by Section:**

      *   **Acknowledge the Insight:** Validate that this is a sharp, under-discussed point. It's not just "definitions change," it's "the moral lens changes the data availability."
      *   **The Label (if there is one):**
          *   *Concept Creep* (Nick Haslam) is the closest psychological term.
          *   *Measurement Invariance* (Psychometrics/Statistics) is the technical failure.
          *   *Historical Ontology* (Ian Hacking) is the philosophical framework.
          *   *The "Civilizing Process" Reflexivity:* (Norbert Elias/Pinker).
          *   *Best fit:* **Diachronic Measurement Non-Invariance driven by Normative Shift.** (A bit clunky, but accurate). Let's stick with **Concept Creep** for the phenomenon and **Anachronistic Projection** for the historical error.
      *   **Differentiating from Observer Effect:** Observer effect is $A$ changes $B$ because $B$ is watched. This is $C$ (Morality) changes $A$ (Definition) and $B$ (Behavior) simultaneously. It's a **Common Cause** problem.
      *   **Differentiating from Medical Redefinition (Heart Attacks/Autism):**
          *   Medical: Epistemic improvement (we know more).
          *   Moral: Normative improvement (we care more).
          *   The "Reality" status differs. A blocked artery is physical. "Violence" is partly social construction (is a slap violence or discipline?).
      *   **The "Carving" (How to answer the question):**
          *   Freezing definitions leads to **Anachronism**.
          *   Ignoring definitions leads to **Blindness**.
          *   The solution isn't a number, it's a **Dual-Track** approach. Measure "Physical Harm" (objective) AND "Social Sanction" (subjective).
