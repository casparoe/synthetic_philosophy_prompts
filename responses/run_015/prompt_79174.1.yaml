  6.  **Refining the Argument:**

      *   The user is describing a **Validity Threat** in longitudinal studies. Specifically, **Construct Drift**.
      *   But the philosophical weight is on the **Moral Ontology**.
      *   Let's bring in **Ian Hacking's "Making Up People"** or **"Historical Ontology."** He argues that classifying people/acts changes the people/acts.
      *   Let's bring in **Nick Haslam's "Concept Creep."** He explicitly discusses how expanding definitions of harm make society look more sensitive but also make data incomparable.
      *   Let's distinguish the **Medical vs. Moral** redefinition. Medical = better detection of static reality. Moral = creation of new reality (the act *becomes* violence socially).
      *   **The Answer to "What would it take?":** You can't get a "fact of the matter." You get a model. You need to separate *lethality* (objective) from *illegitimacy* (subjective).

  7.  **Final Polish:**

      *   Tone: Intellectual, rigorous, empathetic to the frustration.
