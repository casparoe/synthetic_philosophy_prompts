answer: |-
  **Exam Paper: Philosophy of Action (Final Year Option)**
  **Time Allowed:** 2 Hours
  **Total Marks:** 30 (for this question)

  **Question 1**
  Hyperbolic discounting is frequently advanced as a naturalistic explanation for weakness of will. Distinguish carefully between **structural akrasia** (diachronic preference inconsistency) and **executive akrasia** (synchronic failure to act on a stable ranking). 

  Argue whether hyperbolic discounting genuinely explains both, or whether it explains one only by eliminating the other via a 'time-slice' model of agency. Finally, evaluate the proposal that the akratic agent discounts not future goods, but her own *future judgements* about those goods. Is this recasting a theoretical fix that preserves executive akrasia, or merely a redescription? If it is a fix, what normative cost does it incur?

  *In your answer, you must commit to a position on whether the 'future judgements' move saves the phenomenon or dissolves it.*

  ***

  ### Model Answer

  The puzzle of akrasia turns on whether an agent can knowingly act against her own better judgement. To assess hyperbolic discounting (HD) as a solution, we must first distinguish two forms of the phenomenon. **Structural akrasia** occurs when an agent's preferences are time-inconsistent: at $t_1$ she prefers the long-term good (A), but at $t_2$ she prefers the immediate gratification (B). There is no single ranking she violates; she simply changes her mind. **Executive akrasia**, by contrast, requires a synchronic conflict: at the moment of action ($t_2$), the agent holds a stable ranking (A > B) yet chooses B. She judges now that she should not, and does it anyway.

  Standard hyperbolic discounting offers a robust explanation for structural akrasia. Because the discount curve is steep in the short term and flat in the long term, a preference reversal is mathematically inevitable as the temptation nears. The agent is not irrational in a synchronic sense; she is maximizing utility relative to her current discount rate. However, this success comes at the price of eliminating executive akrasia. If the agent's preference at $t_2$ is genuinely for B, she is not acting against her current judgement. On the HD model, the 'will' is just the discount rate at the moment of choice. Consequently, the time-slice model of agency implied by HD dissolves executive akrasia: there is no failure of execution, only a succession of different agents with different preference orderings.

  Proponents of the 'future judgements' hypothesis attempt to rescue executive akrasia from this dissolution. They propose that at $t_2$, the agent does not discount the value of the future good itself, but rather discounts the *authority* of her future self's judgement regarding that good. She acknowledges that Future-Her will value health, but she discounts the weight of that future evaluation in her current deliberation. This attempts to restore a synchronic conflict: I judge now that I should listen to my future self, but I discount her authority and act otherwise.

  However, this move risks being merely a redescription rather than a fix. If I judge now that my future judgement should not move me, then my current all-things-considered judgement is actually to indulge. The conflict vanishes again. To save executive akrasia, the agent must judge now that she *should* abide by her future judgement, yet fail to do so because she discounts it. This creates a paradox: she is simultaneously endorsing a norm (listen to future self) and violating it via a psychological mechanism (discounting) that she ostensibly endorses.

  If we accept this as a genuine fix, the normative cost is high. It fragments the agent's rational authority. It suggests that rationality requires not just consistency in goods, but consistency in trusting one's own temporal extensions. The akratic agent becomes not just weak, but self-alienated; she treats her future self as a stranger whose advice can be weighted lightly. This preserves the phenomenon of executive failure, but only by redefining the agent as a coalition of competing authorities rather than a unified will.

  I commit to the view that the 'future judgements' move is a redescription that fails to save executive akrasia without destroying the unity of agency. Hyperbolic discounting successfully explains structural akrasia, but it cannot account for executive akrasia without ceasing to be a model of *one* agent's failure. To insist on executive akrasia within a discounting framework requires positing a split between what I value and what I allow to move me, which ultimately collapses back into structural inconsistency between my normative commitments and my motivational weights. HD explains why we change our minds; it does not explain why we break our own hearts while keeping them.

  ***

  ### Marking Scheme (30 Marks)

  **1. Distinction between Structural and Executive Akrasia (6 Marks)**
  *   **Full Marks:** Clearly defines Structural as diachronic preference reversal (no single ranking violated) and Executive as synchronic violation (acting against current stable ranking).
  *   **Weak Answer:** Conflates the two, treating all akrasia as simply "changing one's mind" or fails to note the synchronic requirement for Executive Akrasia.

  **2. Analysis of HD regarding Structural Akrasia (6 Marks)**
  *   **Full Marks:** Identifies that HD naturally models Structural Akrasia via preference reversal curves without implying irrationality at specific time-slices.
  *   **Weak Answer:** Claims HD makes the agent irrational at all times, or fails to explain why preference reversal fits the 'Structural' definition.

  **3. Analysis of HD regarding Executive Akrasia (6 Marks)**
  *   **Full Marks:** Argues that HD *eliminates* or *dissolves* Executive Akrasia because the agent at $t_2$ is acting on their current highest preference (time-slice model).
  *   **Weak Answer:** Asserts HD explains Executive Akrasia without addressing how the synchronic conflict disappears when preferences shift.

  **4. Evaluation of the 'Future Judgements' Hypothesis (6 Marks)**
  *   **Full Marks:** Critically assesses whether discounting authority vs. goods is a substantive fix or a redescription. Notes the risk that current judgement shifts to match the discounting.
  *   **Weak Answer:** Accepts the hypothesis uncritically as a solution, or dismisses it without explaining why it might just be semantic shuffling.

  **5. Commitment and Normative Cost (6 Marks)**
  *   **Full Marks:** Commits to a stance (as required) and identifies the cost (e.g., fragmentation of agency, loss of self-trust, or redefinition of unity).
  *   **Weak Answer:** Hedges without committing ("on the one hand, on the other"), or fails to identify what is lost (normatively) if the hypothesis is accepted.
