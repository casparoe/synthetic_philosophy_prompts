  I'm setting the exam for my final-year option on weakness of will and I need one essay question on akrasia and hyperbolic discounting that cant be got through by reciting that the will is really just a discount rate.

  I've been pushing a distinction in lectures that I want them to actually use. Structural akrasia: her preferences are time-inconsistent, so there's no single ranking she's failing to act on — she prefers A at nine and B at five, and five wins. Executive akrasia: at the moment of action she has a stable ranking and still doesn't act on it — she judges, now, that she shouldn't, and does it anyway. I also keep kicking around a thought I can't settle: maybe the akratic isn't discounting the future good at all, but her own future judgements about it — she doesn't distrust what she'll enjoy tomorrow, she distrusts what she'll think tomorrow.

  Build the question so they have to say which of the two akrasias, if either, hyperbolic discounting genuinely explains; whether modelling her as a run of time-slices each with its own preferences explains executive akrasia or quietly makes it disappear; and whether recasting the discount as falling on future judgements rather than future goods is a real fix or just a redescription — and if it's a fix, what it costs. Push them to commit, rather than survey.

  Final-year undergrad, two-hour paper, 30 marks for this one. Give me the question as it'd appear on the paper, a model answer of about 700 words, and a marking scheme with five must-hit points, marks adding to 30, and a one-line note against each on how a weak answer typically muffs it.
