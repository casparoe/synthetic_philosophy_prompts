      *   *Hypothesis 2: Sufficiency vs. Necessity.* Premise (2) claims that if (1) is met, causation is established. But Weber's "elective affinity" is often about *selection* and *stabilization*, not necessarily *genesis*. Also, mere correlation + orientation isn't enough; there must be a *counterfactual* element (would the institution exist without the value?).
