answer: |-
  Subject: Plan for next week's structural realism seminar

  Hi there,

  It sounds like a challenging but rewarding session, and given the constraints of time and student background, you need a tight narrative arc that prioritizes intuition over technical precision. Since your students have limited physics training but some philosophy of science background, you should structure the hour around the problem-solution-objection framework, starting with the Pessimistic Meta-Induction to motivate the need for structural realism in the first place. You cannot explain why structural realism exists without first establishing why standard scientific realism is in trouble, so spend the first ten minutes walking them through the idea that history shows our best theories often turn out to be false regarding their ontological claims, which threatens the no-miracles argument. Once they feel the pressure of the pessimistic meta-induction, introduce structural realism as the middle ground that attempts to save realism from this historical skepticism by claiming that while the nature of entities changes, the mathematical structure is retained across theory change.

  Regarding your choice of case study, you should stick with your leaning toward the luminiferous ether but with a crucial specification. Do not simply teach the collapse of the ether, because elimination alone supports anti-realism. Instead, you must focus on the transition from Fresnel's ether theory to Maxwell's electromagnetic theory. This is the canonical example for structural realism because the mathematical equations describing light propagation remained virtually identical even though the ontological commitment to a mechanical ether was discarded. This case is superior to the electron for your specific audience because the electron requires understanding quantum mechanics to grasp the conceptual shifts, whereas the ether case relies on classical waves which fits their high school physics background. The case needs to have a clear element of ontological elimination, so they see the ether is gone, but it must also have a clear element of mathematical retention, so they see the structure survived. If you only show the collapse, you prove the pessimists right; if you only show the math, you miss the ontological shift.

  You should delay the distinction between epistemic and ontic structural realism until after you have worked through the case study. If you introduce this split too early, it will feel like abstract taxonomy without motivation. Once they see how the Fresnel-Maxwell case works, you can explain that epistemic structural realism claims we can only know the structure but there might be underlying entities, whereas ontic structural realism claims there is nothing but structure. This dependency is important because the case study provides the concrete evidence they need to understand what is at stake in that distinction. By placing it in the middle of the hour, you allow the metaphysical split to emerge naturally from the historical example rather than imposing it as a precondition.

  You are correct to anticipate the misconception that this is just instrumentalism in disguise, and you should defuse this immediately after defining structural realism but before diving into the metaphysics of the epistemic-ontic split. Tell them explicitly that unlike instrumentalism, structural realism claims the structure is real and describes the world, not just a tool for prediction. If you wait until the end to address this, they will have spent the whole hour interpreting your claims through an instrumentalist lens and will be hard to walk back. The second misconception, that keeping the equations means you have said nothing about the world, should be addressed when you explain what structure is. You need to make clear that for the structural realist, the relations described by the equations are physically real relations, not just syntactic devices. This distinction needs to land before they evaluate the ontic version, otherwise they will assume ontic structural realism is vacuous.

  In terms of what to exclude, you must explicitly refuse to cover Ramsey sentences or the technical formalization of structure using category theory or logic. Given the one-hour limit and their physics background, trying to explain how to formally separate structure from content will bog you down in technicalities that obscure the philosophical intuition. You should also avoid getting into the debate about whether structure requires relata, as this is a deep metaphysical rabbit hole that will consume your remaining time without adding to their basic grasp of the position. Stick to the historical and philosophical narrative rather than the formal one.

  Finally, for your assessment question, do not ask them to define the view or list the objections. Instead, ask them to apply the distinction to a hypothetical scenario. A strong question would be to ask whether structural realism can account for a case where the mathematics changes but the entity posited remains the same, or vice versa, and what that implies for what is real. However, a simpler and more direct question to see if the idea landed is to ask them to explain why a structural realist would say we know more about the world than an instrumentalist does, but less than a traditional realist. This forces them to articulate the middle-ground position and demonstrates whether they understand the specific claim about the reality of structure versus the nature of entities. If they can answer that, they have grasped the core motivation and limitation of the view.

  Best of luck with the seminar.
