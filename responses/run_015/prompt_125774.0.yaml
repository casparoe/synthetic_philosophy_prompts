answer: |-
  You have identified a genuine cluster of phenomena that sits right at the friction point between game theory, decision theory, and moral psychology. It is annoying that there isn't a single, universally agreed-upon noun for it, because you are describing something structural rather than merely behavioral.

  The pattern you are tracking is **the instrumental value of ex-post inflexibility.**

  Here is the breakdown of the nearest established concepts, exactly where they miss your criteria, and how to draw the boundaries you asked for.

  ### 1. The Nearest Established Concepts

  There are three main contenders in the literature. None fit perfectly, but together they map the territory.

  **A. Robert Frank's "Emotions as Commitment Devices"**
  *   **Source:** *Passions Within Reason* (1988).
  *   **The Fit:** This is the strongest match for your Case 2 (running/guilt) and Case 1 (roommate). Frank argues exactly what you are observing: emotions like guilt, anger, or honesty are evolutionary adaptations that solve time-inconsistency problems. They alter your payoff matrix *in the moment* so that the locally "irrational" action (paying back money you could keep; running when you want to sleep) becomes the locally rational one.
  *   **The Miss:** Frank focuses heavily on *emotions*. Your description includes "traits" or dispositions that might not feel emotional (e.g., a rigid cognitive rule). Also, Frank argues these are selected for evolutionarily; you are describing them as they function in a seminar on *practical rationality* (i.e., can I cultivate this?).
  *   **Verdict:** This is the substantive answer. If your friend said "commitment device," they were likely thinking of Schelling (external), but Frank is the one who formalized the *internal* version you are describing.

  **B. David Gauthier's "Constrained Maximizer"**
  *   **Source:** *Morals by Agreement* (1986).
  *   **The Fit:** Gauthier distinguishes between a "Straightforward Maximizer" (who defects in Prisoner's Dilemmas when they can get away with it) and a "Constrained Maximizer" (who is disposed to cooperate even when local defection is profitable). He argues the Constrained Maximizer does better overall because other Constrained Maximizers will identify and cooperate with them. This matches Case 1 and 3 perfectly.
  *   **The Miss:** Gauthier's framework is about *choosing* a disposition rationally. You emphasize that the trait works *because* you can't switch it off at the moment. Gauthier assumes you can identify as a Constrained Maximizer, but he gets into trouble explaining why you don't just "fake it" in the moment. Your observation—that the *involuntariness* is load-bearing—is the critique that usually gets leveled at Gauthier.
  *   **Verdict:** Matches the social payoff structure, misses the phenomenology of involuntariness.

  **C. McClennen's "Resolute Choice"**
  *   **Source:** *Rationality and Dynamic Choice* (1990).
  *   **The Fit:** Edward McClennen argues against "Sophisticated Choice" (updating your plan every time your preferences shift). He argues for "Resolute Choice": sticking to a prior plan even when your current preferences dictate otherwise. This matches your condition (b) perfectly.
  *   **The Miss:** This is a normative theory of decision-making, not a description of a psychological trait. It tells you what you *should* do to be rational, not how having a rigid personality trait pays off.
  *   **Verdict:** Matches the decision structure, misses the psychological mechanism.

  ### 2. Why "Commitment Device" Felt Wrong (And Why It's Actually Right)

  You rejected "commitment device" because you defined it as "something you install on purpose... messing with your options or payoffs." You wrote: *"this doesn't touch either."*

  This is the crux of the confusion. In the literature (specifically Schelling and Frank), commitment devices are divided into **exogenous** and **endogenous**.
  *   **Exogenous:** Ulysses tying himself to the mast. (This matches your friend's definition).
  *   **Endogenous:** Cultivating a disposition or emotion that changes your *internal* payoff structure. (This matches your examples).

  In Case 2 (running), the guilt *does* touch the payoffs. It adds a psychic cost to skipping the run. If you didn't feel the guilt, the payoff matrix would say "skip." The guilt is the device. The reason it feels different from a bet with a friend is that the enforcement mechanism is internal and involuntary.

  **Correction:** It *is* a commitment device, specifically an **Endogenous Commitment Device**. The "trick" is that for it to work, you must forget it's a device, or be unable to disable it.

  ### 3. Boundary Cases

  You asked for edges. Here is how to distinguish this pattern from similar phenomena.

  **Is an ordinary habit an instance?**
  *   **No.** Brushing your teeth is automatic, but it lacks the *conflict*. You don't feel a strong local desire *not* to brush your teeth that you must overcome via inflexibility.
  *   **The Edge:** If you hate brushing your teeth but do it anyway because "that's just what I do," and you literally feel unable to skip it without distress, it crosses into your pattern. If it's just mindless routine, it's habit. The presence of a **counterfactual local desire** is the boundary.

  **Is an addiction an instance?**
  *   **No.** It has the *structure* (involuntary, costly in the moment), but the *direction of payoff* is reversed.
  *   **The Edge:** Addiction is locally compelling but globally destructive. Your pattern is locally costly but globally beneficial. You might call your pattern **"Positive Addiction"** or **"Functional Rigidity,"** but structurally, addiction is the evil twin of this phenomenon.

  **Is a rigid principle an instance?**
  *   **Yes, if...** the rigidity is the feature. If you hold a principle ("I never lie") but would abandon it if the stakes were high enough, it's a preference. If you *cannot* abandon it even when the stakes are high, and that inability is what makes people trust you, it fits your pattern.
  *   **The Edge:** Kantian duty vs. Prudential disposition. If you keep the principle *because* it pays off globally, it's your pattern. If you keep it because you think it's morally required regardless of payoff, it's deontology. (Though the outcome is the same).

  ### 4. The Institutional Question

  You asked: *"Is it part of the same thing... that these traits seem to matter less where an institution does the job?"*

  **Yes.** This is known as **Motivational Crowding Out**.

  If there is a public reliability score (institution), the *marginal value* of your internal disposition drops.
  *   **Scenario A (No Score):** My roommate's inability to lie is the only signal of trust. High value.
  *   **Scenario B (Public Score):** My roommate's inability to lie is redundant. The score guarantees repayment.

  In fact, in Scenario B, the disposition might become a *liability*. If the system allows for strategic default (e.g., bankruptcy laws), the person who *cannot* default even when it's financially optimal might be exploited by the system.

  This confirms your intuition: The trait is a **substitute for institutional enforcement**. When institutions are weak or absent (hitchhiking in the desert, lending money to friends), the trait has high market value. When institutions are strong (credit scores, contracts), the trait's value diminishes, potentially becoming a "sucker's payoff."

  ### 5. Proposed Label

  Since "Commitment Device" feels too mechanical and "Disposition" feels too vague, and you need a term for your seminar that captures the *involuntariness* and the *payoff*:

  **Label:** **Strategic Inflexibility**
  **Definition:** A disposition where the agent's inability to optimize locally is the necessary condition for securing global optimization, typically via reliability signaling or internal enforcement.

  **Or, if you want to lean into the decision theory:**
  **Label:** **Updateless Disposition**
  **Definition:** A trait that prevents the agent from updating their policy based on local information/costs, thereby preserving the benefits of a prior commitment that others can rely on.

  ### Summary for your Seminar
  If you need to cite something, **Robert Frank's *Passions Within Reason*** is the text that directly addresses Case 2 and the "why can't I just choose?" problem. **Gauthier** covers the social trust aspect.

  The specific insight you are having—which feels unnamed—is that **rationality is sometimes achieved by the suspension of situational rationality.** You are describing the mechanism by which **Constrained Maximization** is psychologically implemented. The "name" you are looking for is likely **Endogenous Commitment**, but your specific focus on the *inability to switch it off* is the crucial nuance that separates it from simple precommitment.

  **The precise distinction:**
  *   **Precommitment:** I lock the cookie jar. (I can unlock it if I really want to, but it's costly).
  *   **Your Pattern:** I am not hungry for cookies. (I literally cannot want the cookie in the moment).
  *   **Why it matters:** Locking the jar signals I *expect* to be weak. Not wanting the cookie signals I *am* trustworthy. The latter is a stronger signal because it is harder to fake.
