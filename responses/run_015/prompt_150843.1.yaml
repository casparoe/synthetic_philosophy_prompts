      *   *Crux 2: Timing (Fast/Flat vs. Compounding).*
          *   Values side: Fast adoption fits conversion; flatness suggests cultural equilibrium.
          *   Materialist side: Capitalism should compound; flatness suggests a one-off institutional shock, not a deep cultural value.
      *   *Crux 3: Elective Affinity.*
