answer: |-
  **Joint Statement on Weber and Causal Inference**

  **1. Agreed Claims**
  1.  **Testability:** A claim that "values caused economic outcome" is testable only if it implies a counterfactual: Would the specific economic behavior (e.g., bookkeeping, savings) exist without the religious framing, holding material conditions constant?
  2.  **Origin vs. Persistence:** We distinguish the *origin* of a pattern (why it emerged) from its *persistence* (why it endured). Weber's thesis addresses both; statistical data often conflates them.
  3.  **Controls and Channels:** Controlling for confounders (e.g., pre-1500 wealth) is necessary. Controlling for intermediaries (e.g., credit associations) blocks the causal path if values created those intermediaries. Result (ii) in the ruler study is ambiguous without knowing if associations are causes or channels.
  4.  **Natural Experiments:** The ruler study isolates confession from individual choice, but not confession from downstream institutional packages imposed by the ruler.
  5.  **Mechanism:** Statistical residuals are not mechanisms. A mechanism requires a behavioral story (e.g., how doctrine changes daily practice), not just a remaining coefficient.

  **2. Disagreements Table**

  | Disagreement | Values-First Position | Materialist Position | Crux & Evidence | Pre-registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Intermediary** | Credit associations are *channels* through which the ethic operated. Controlling for them (Result ii) over-corrects. | Credit associations are *institutional confounders*. The 2/3 shrinkage proves institutions, not ideas, drive the wealth gap. | **Crux:** Are associations expressions of ethic or substitutes for it?<br>**Evidence:** Study Result (ii). | **V:** Gap remains if associations are exogenously removed (habits persist).<br>**M:** Gap disappears if associations are removed (no structure to enforce savings). |
  | **Timing Dynamics** | Fast/flat adoption (Result iii) matches rapid cultural conversion stabilizing into tradition. Values set a level, not a growth rate. | Capitalism should compound. Flatness suggests a one-off institutional shock, not a deep cultural value driving accumulation. | **Crux:** Should cultural values compound like capital?<br>**Evidence:** Study Result (iii). | **V:** Savings rates remain high absent external shock.<br>**M:** Savings rates decay without continued institutional reinforcement. |
  | **Elective Affinity** | Causal claim: Ideas act as "switchmen," directing material interests onto specific tracks (e.g., bookkeeping vs. hours). | Descriptive claim: Ideas label material interests; "switchmen" is metaphor for selection bias on viable institutions. | **Crux:** Is "affinity" a mechanism or a correlation?<br>**Evidence:** Study Result (iv) (savings vs. hours). | **V:** Specific practices reflect specific doctrines.<br>**M:** Practices reflect efficiency needs; doctrine is post-hoc justification. |

  **3. Note on Verbal Dispute**
  We identify a verbal dispute regarding the definition of "culture." The Values-First side treats culture as a distinct variable operating through internalized norms. The Materialist side treats culture as a label for unmeasured institutional constraints. This is not merely semantic; it dictates model specification. If culture is internalized, lagged variables suffice. If culture is institutional, we must measure the institutions directly. We agree to treat "culture" as a placeholder for unidentified mechanisms until specific behavioral pathways (like Result iv) are isolated.
