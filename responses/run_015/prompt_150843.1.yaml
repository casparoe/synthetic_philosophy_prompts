      *   *Evidence:* The hypothetical study results (ii) and (iii).
      *   *Predictions:* Values side predicts savings practices persist even if associations dissolve. Materialist predicts savings practices decay if associations are removed.

  6.  **Refining and Condensing (Word Count Check):**
