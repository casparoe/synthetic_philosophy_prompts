      *   *Timing (iii):* Appears in first 2 generations, flat thereafter (no compounding).
      *   *Mechanism (iv):* Shows in savings/bookkeeping, not hours worked.

  4.  **Drafting Section 1: Agreed Claims:**
      *   Need to define what "values caused economic outcome" means testably.
      *   Need to distinguish origin vs. persistence.
      *   Need to clarify limits of statistical association, natural experiments, and mechanism stories.
      *   *Drafting ideas:*
