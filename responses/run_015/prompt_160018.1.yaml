      *   *Free Will:* Distinguish mental causation from free will. Epiphenomenalism kills agency, but mental causation doesn't guarantee libertarian free will.
      *   *Verdict on Roommate:* Roommate is wrong. The argument is a challenge, not a refutation. It forces a choice, but many choose paths other than "mental causation is dead."

  5.  **Refining the Nuance (Self-Correction during drafting):**
