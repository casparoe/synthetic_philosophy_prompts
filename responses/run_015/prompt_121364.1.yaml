answer: |-
  # Q&A PREP SHEET: Bureaucratic Roles as Compound Dispositions
  **Workshop:** Metaphysics of Social Institutions | **Date:** Next Tuesday
  **Core Thesis:** Roles = compound dispositions; Rules = finks; Safeguards = masks (explaining corruption survival).

  ## UP-FRONT CONCESSIONS
  *Do not wait to be cornered. Signal these in your intro or first response to disarm hostility.*
  1.  **Not Fundamental:** Concede immediately that institutional dispositions are not fundamental physical dispositions. They are *higher-order functional properties* realized by agents + rules. You are not proposing a new fundamental ontology.
  2.  **Not Mental:** Concede you are not attributing beliefs/desires to the institution itself. The "disposition" is a property of the *role*, not the organization as a collective agent.
  3.  **Idealization:** Acknowledge the fink/mask distinction is a model. Real-world cases may be messy hybrids, but the distinction is necessary for explanatory precision regarding reform failure.

  ---

  ## OBJECTION 1: THE CATEGORY MISTAKE (Highest Damage)
  **Who:** Senior Analytic Metaphysician
  **The Objection:** *"Institutions aren't the right sort of entity to bear dispositions. Dispositions require a categorical base in a concrete particular. A 'bureaucratic role' is an abstract normative construct. Are you saying the job description has causal powers, or the person in the chair? If the latter, you've reduced social metaphysics to individual psychology. If the former, you're reifying abstractions."*

  **2-Minute Reply:**
  "I accept the constraint that dispositions require a base, but I reject that the base must be purely physical or individual. The base of a bureaucratic role is a *hybrid* of physical agents and normative rules.
  Think of it like a software function. The function has a disposition to sort data. The base is the code + the hardware. If you change the code (the rule), you change the disposition.
  I am not saying the job description floats free of people. I am saying the *role* stabilizes behavioral potentials across different occupants. Person A leaves, Person B enters; the corrupt disposition of the role remains. This stability is what demands a dispositional account at the institutional level, not just the individual level. I'm analyzing the *slot*, not just the *plug*."

  **Where it's Soft:**
  If they press on *how* normative rules causally interact with physical agents without invoking mental states, you risk a regress. You need to be ready to say "incentive structures" bridge the norm/physical gap.

  ---

  ## OBJECTION 2: CAUSAL EFFICACY OF MASKED DISPOSITIONS (The "Dreaded" One)
  **Who:** Metaphysician specializing in Powers/Dispositions
  **The Objection:** *"If a safeguard successfully masks a disposition, the manifestation is prevented. In standard literature, a masked disposition is causally inert regarding that manifestation. So, if the corruption is blocked by the mask, in what sense does the disposition 'survive'? If it produces no effect, positing it is explanatorily idle. Why not just say the reform created a new, non-corrupt disposition?"*

  **2-Minute Reply:**
  "This is the crux of the corruption argument. A mask doesn't just block; it *pressurizes*.
  If the disposition were gone (finked), the agent would have no tendency to act. But in masked scenarios, we observe *rerouting*. The agent seeks loopholes, bribes differently, or waits for the safeguard to lapse.
  The causal efficacy of the masked disposition is visible in the *energy expended to bypass the mask*.
  Counterfactually: If the safeguard (mask) were removed, the corruption manifests immediately. If the disposition were truly gone (finked), removing the safeguard would change nothing. The fact that corruption 'survives' reform by changing shape proves the underlying disposition persists. The mask explains the *distortion* of the effect, not the absence of the cause."

  **Where it's Soft:**
  Distinguishing "rerouting" (same disposition) vs. "new disposition" is empirically difficult. They might argue the "pressure" is just a new desire created by the obstacle, not the old disposition persisting.

  ---

  ## OBJECTION 3: PSYCHOLOGIZING STRUCTURES (Political Phils)
  **Who:** Political Philosopher
  **The Objection:** *"You're treating structural problems as if they are latent tendencies waiting to be triggered. This risks absolving individuals of responsibility ('the role made me do it') or reifying structures as having agency. Corruption isn't a disposition; it's a choice within a power dynamic. Your metaphysics obscures the politics."*

  **2-Minute Reply:**
  "I agree that metaphysics shouldn't obscure politics; it should sharpen it.
  Attributing a disposition to a role does not remove agency from the occupant. It highlights how the *structure incentivizes* the choice.
  If we only analyze individual choices, we miss why corruption returns when we swap out 'bad apples.' The dispositional account explains why good people in corrupt roles often produce corrupt outcomes.
  I am not saying the structure chooses. I am saying the structure *disposes*. Recognizing this helps political philosophers target reforms: don't just train the agents (psychology), change the stimulus conditions (structure). My view supports structural critique, it doesn't undermine it."

  **Where it's Soft:**
  The line between "the role disposes" and "the person chooses" is thin. If you lean too hard on the role, you sound deterministic. If you lean too hard on the person, you lose the institutional metaphysics.

  ---

  ## OBJECTION 4: FINK VS. MASK AMBIGUITY
  **Who:** Technical Metaphysician
  **The Objection:** *"Your distinction between procedural rules (finks) and safeguards (masks) seems arbitrary. A rule that requires two signatures to authorize a payment: is that a fink (removing the single signer's power) or a mask (blocking the single signer's disposition to embezzle)? If you can't rigorously distinguish them, the taxonomy collapses."*

  **2-Minute Reply:**
  "It turns on the *intrinsic nature* of the role after the intervention.
  A **Fink** changes what the role *is*. If I require two signatures, the role of 'Authorizer' is fundamentally redefined; the single signer literally lacks the power to complete the act alone. The disposition is removed.
  A **Mask** leaves the role's power intact but interferes with the *stimulus*. An audit safeguard doesn't remove my power to sign a bribe; it adds a risk of detection that inhibits the manifestation.
  Test: If I bypass the mechanism, does the act succeed?
  If yes (I bypass the audit and the bribe goes through), it was a Mask.
  If no (I bypass the second signer and the system rejects the transaction), it was a Fink.
  Corruption survives reform because most reforms are masks (audits) when they need to be finks (structural inability)."

  **Where it's Soft:**
  In complex bureaucracies, bypassing a "fink" is often possible (collusion). You may have to concede that many "finks" are actually "strong masks."

  ---

  ## STRATEGIC NOTES FOR THE ROOM
  *   **If they gang up:** If the metaphysicians start debating the definition of "disposition" endlessly, pivot to the Political Phils: *"This is why the political dimension matters; if we can't model the persistence of the tendency, we can't explain the policy failure."*
  *   **The "So What?"**: Keep returning to the *Corruption Survival* point. That is your unique selling point. Standard metaphysics doesn't explain why reform fails; your mask/disposition model does.
  *   **Tone:** Confident but collaborative. You are offering a tool for their ontology, not challenging the ontology itself.
