      *   *Thesis:* Bureaucratic roles = compound dispositions.
      *   *Mechanism 1:* Procedural rules = finks (remove the disposition entirely in specific contexts).
      *   *Mechanism 2:* Safeguards = masks (hide/reroute the disposition without removing it).
      *   *Implication:* Corruption survives reform because reforms often mask rather than fink the underlying corrupt dispositions.

  3.  **Identify Potential Objections (Brainstorming):**
      *   *Metaphysicians:*
          *   Category mistake: Institutions aren't objects with dispositions; only fundamental particles or maybe agents have dispositions.
          *   Identity conditions: When does a role change its disposition?
          *   Fink vs. Mask distinction: Is it clear in this context?
          *   Causal Efficacy: If a mask blocks the manifestation, is the disposition real/causal? (The "Dreaded" one).
          *   Over-intellectualizing: Is this just a metaphor?
      *   *Political Philosophers:*
          *   Psychologizing: Are you attributing mental states to structures?
          *   Normative implications: Does this excuse corruption?
          *   Structure vs. Agency: Are you blaming the role or the person?

  4.  **Select and Order Objections (by Damage Potential):**
      *   *High Damage:* Category Mistake (Metaphysicians' core skepticism). If this sticks, the project dies.
      *   *High Damage:* Causal Efficacy of Masked Dispositions (The "Dreaded" one). If masked dispositions do nothing, the explanation for corruption survival fails.
      *   *Medium/High Damage:* Psychologizing Structures (Political Philosophers' core worry). Alienates the minority but could sway the room if it sounds like reductionism.
      *   *Medium Damage:* Fink/Mask Distinction Clarity. Technical metaphysical nitpicking.
      *   *Low Damage:* Normative/Political implications. Interesting but not metaphysically fatal.

      *Order:*
      1.  Category Mistake (Ontological status).
      2.  Causal Efficacy of Masked Dispositions (The "Dreaded" one).
      3.  Psychologizing Structures (Agency/Structure).
      4.  Fink/Mask Distinction (Technical).

  5.  **Drafting the Content (Iterative Process):**

      *   *Concessions:* Need to show humility and precision. Admit institutions aren't *fundamental* dispositions. Admit the analogy has limits.
      *   *Objection 1 (Category Mistake):* "Institutions aren't the right sort of thing."
          *   *Reply:* Functionalism. Roles are defined by input/output patterns. Dispositions capture this better than static properties.
          *   *Soft Spot:* Relying on functionalism might beg the question against eliminativists.
      *   *Objection 2 (Causal Efficacy - Dreaded):* "If it's masked, it doesn't do anything. Why posit it?"
          *   *Reply:* Counterfactuals. If the mask (safeguard) fails, the manifestation occurs. The disposition explains the *risk* and the *rerouting* behavior (corruption finding new paths).
          *   *Soft Spot:* Need to ensure the "rerouting" isn't just a new disposition.
      *   *Objection 3 (Psychologizing):* "You're treating structures like agents."
