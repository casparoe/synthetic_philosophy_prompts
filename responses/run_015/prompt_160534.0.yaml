      *   *(2) Underdetermination:* This is the crux. Did different places react differently? Yes. Ireland (typhus/famine), Europe (riots/migration), Switzerland (literature). But was it *institutions* or just *geography*? New England vs. Southern US? Britain vs. Continental Europe? *Strain:* The cooling was so pervasive that *everyone* suffered. Was there enough variation to prove institutions mattered, or did the volcano overwhelm everything? (Actually, there is variation: Britain had better grain reserves than parts of Europe; migration patterns differed).
