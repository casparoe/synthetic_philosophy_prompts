prompt: |-
  I'm working for this small heritage board in the Pacific Northwest and we keep recieveing applications to designate "sites of exceptional testimony" — old logging camps where survivors claim a dead coworker warned them about an avalanche, a 1920s sanitorium where patients said they were healed overnight, that kind of thing. The board doesn't care about religion per se; we just need to know whether the testimony is credible enough to justify listing the place as culturally significant. I read Hume's essay on miracles back in college and it seemed like he had a kind of formula — weigh the uniform experience of nature against the testimony, and only believe the miracle if the falsehood of the report would be more miraculous than the event itself. I want you to turn that into an actual reusable procedure my three-person review team can run in about thirty minutes per file. It needs steps in order: what evidence to gather first, how to compare the implausibility of the law-breaking against the implausibility of error or deception, the exact point where we stop and say "this doesn't support a listing," and the point where we have to hand it to a values judgment because Hume's math runs out. Please apply it to two cases: a 1912 coal-mine rescue where three survivors say they heard a guiding voice (we'd like to list it, but I worry the procedure kills it), and a 1970s drought commune where dozens report simultaneous visions. Flag where the procedure misfires — like when the claim is technically a statistical outlier, not a law-violation — and be honest about which steps are just judgment calls dressed up as rules. Write the answer in American English, and don't just summarize Hume; build the checklist my coworker can actually use without being a philosopher.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Works for a small heritage board in the Pacific Northwest.
      *   **Task:** Create a reusable procedure/checklist based on David Hume's "Of Miracles" (from *An Enquiry Concerning Human Understanding*) to evaluate applications for designating "sites of exceptional testimony."
      *   **Constraints:**
          *   Must be actionable for a 3-person review team.
          *   Time limit: ~30 minutes per file.
          *   Steps must be in order (evidence gathering, comparison, stopping points, values judgment).
          *   Must apply the procedure to two specific cases (1912 coal-mine rescue, 1970s drought commune).
          *   Must flag where the procedure misfires (e.g., statistical outliers vs. law violations).
          *   Must be honest about judgment calls disguised as rules.
          *   Tone: American English, practical, not just philosophical summary.
          *   Goal: Determine cultural significance/credibility, *not* religious truth.

  2.  **Deconstruct Hume's Argument (for practical application):**
      *   *Core Principle:* A wise man proportions his belief to the evidence.
      *   *The Maxim:* No testimony is sufficient to establish a miracle unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish.
      *   *Key Factors:*
          *   Uniform experience (laws of nature).
          *   Quality of witnesses (number, integrity, education, lack of motive to lie).
          *   Psychological factors (passion, surprise, wonder).
          *   Contradictory testimony.
      *   *Practical Translation:* We aren't proving the miracle happened. We are assessing if the *story* is strong enough to carry the weight of the *claim* for heritage designation purposes.

  3.  **Drafting the Procedure (The "Humean Heritage Checklist"):**
      *   *Goal:* Make it fit a 30-minute window.
      *   *Phase 1: Evidence Gathering (Pre-meeting or first 10 mins).* Need concrete data points.
      *   *Phase 2: The Balance Scale (10 mins).* Weighing the "Miracle" vs. the "Mistake/Lie."
      *   *Phase 3: The Stop/Go Decision (5 mins).*
      *   *Phase 4: The Values Pivot (5 mins).* Acknowledging where Hume stops and cultural significance begins.
      *   *Honesty Check:* I need to explicitly state where this is subjective.

  4.  **Developing the Two Case Studies:**
      *   *Case A: 1912 Coal-Mine Rescue.*
          *   Claim: Guiding voice.
          *   Witnesses: 3 survivors.
          *   Context: High stress, life/death.
          *   Humean Analysis: High uniform experience against voices in mines vs. potential for auditory hallucination under stress.
          *   Outcome: Likely fails the "miracle" test, but might pass the "cultural narrative" test.
      *   *Case B: 1970s Drought Commune.*
          *   Claim: Simultaneous visions.
          *   Witnesses: Dozens.
          *   Context: Drought, communal living, potential mass hysteria.
          *   Humean Analysis: Number of witnesses helps, but "contagion of emotion" hurts credibility.
          *   Outcome: High probability of psychological phenomenon vs. supernatural.

  5.  **Addressing the "Misfires" and Limitations:**
      *   Hume assumes "Laws of Nature" are fixed. Heritage boards deal with *human experience*, which is messy.
      *   Statistical outliers (rare but natural) vs. Law violations (impossible).
      *   Cultural Significance $\neq$ Factual Accuracy. A site can be significant *because* people believe the miracle, even if it didn't happen. This is the crucial pivot point.

  6.  **Refining the Tone:**
      *   Needs to be bureaucratic but practical.
      *   American English (e.g., "program," "center," "analyze").
      *   Avoid academic jargon where possible, but keep the philosophical integrity.

  7.  **Step-by-Step Construction of the Response:**

      *   *Introduction:* Acknowledge the constraint (30 mins) and the source (Hume). Set expectations.
      *   *The Checklist:* Break it down into timed sections.
          *   Step 1: Define the Violation (What law was broken?).
          *   Step 2: Audit the Witnesses (Who said it?).
          *   Step 3: The Humean Scale (Falsehood vs. Event).
          *   Step 4: The Cut-Off (When to reject).
          *   Step 5: The Pivot (Cultural value vs. Truth).
      *   *Case Application:* Run the checklist on the Mine and the Commune.
      *   *Limitations/Misfires:* Be honest about where the tool breaks (psychology vs. physics, significance vs. truth).
      *   *Conclusion:* Final advice.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Emphasize that evidence gathering happens *before* the meeting. The meeting is for scoring.
      *   *Critique:* Did I address the "values judgment" requirement?
      *   *Fix:* Make Step 5 explicit about shifting from "Did it happen?" to "Does the belief matter?"
      *   *Critique:* Is the Hume interpretation accurate?
      *   *Fix:* Ensure the "falsehood more miraculous than the event" maxim is the core of Step 3.
      *   *Critique:* The prompt asks to flag where the procedure misfires regarding statistical outliers.
      *   *Fix:* Add a specific section on "Category Errors."

  9.  **Final Polish:** Check formatting (bolding, lists) for readability. Ensure the voice is professional yet candid about the limitations. (Make sure to explicitly mention the Pacific Northwest context if relevant, though the procedure should be generalizable).

