answer: |-
  The standard reaction to higher-order evidence is deference. When you learn that your cognitive faculties are compromised, orthodoxy suggests you must dampen your confidence in whatever those faculties produced, even if the first-order evidence remains unchanged. This leads to epistemic akrasia: believing a proposition while simultaneously believing that holding this belief is irrational. It is a mentally unstable state, demanding you treat your own mind as a broken instrument while continuing to use it to navigate the world. The solution lies not in forcing this split, but in recognizing a specific class of evidence that lacks the normative power to force this update. We must distinguish between evidence that is clean and evidence that is self-implicating.

  In a clean case, like the thermometer, you have independent access to the calibration report. You use your eyes and reasoning to read the report, but the report concerns the thermometer, not your eyes or reasoning. The tool checking the instrument is distinct from the instrument being checked. In the self-implicating case, like the essay arguing that reading essays degrades judgment, the tool checking the instrument is the instrument itself. To evaluate the essay's argument, you must employ the very reasoning capacity the essay claims is degraded. If your reasoning is sound, the essay fails to convince you of your impairment. If your reasoning is broken, your acceptance of the essay is merely a symptom of the breakage, not a valid reason to update. You cannot use a potentially broken ruler to measure its own brokenness and then trust the measurement.

  This raises the hard question: where do we draw the line between the essay case and the sleep-deprived case? If a mania pamphlet is just text, why is it different from the essay? The distinction rests on independent access to the defect. In the sleep or mania case, the higher-order evidence is not solely the pamphlet or the argument. You have access to non-cognitive markers: the clock showing forty hours awake, the physical tremor in your hands, the diagnosis from a doctor who observed your behavior. These markers are evidence of impairment that do not require complex reasoning to assess. The pamphlet merely corroborates what the clock and the tremor already indicate. In the essay case, the essay is the *only* evidence. There is no clock, no tremor, no independent meter saying your logic is off. You are asked to downgrade your faculty based solely on the output of that faculty.

  **Rational downgrading of a cognitive faculty requires evidence of impairment that does not itself rely on the reliable operation of that faculty to be recognized as evidence.**

  When you have independent markers, you update because the clean evidence of impairment outweighs the first-order belief. When you lack independent markers, you cannot update without circularity, so you must maintain your first-order confidence to remain functional. This preserves agency without demanding akrasia. It allows you to ignore the essay not out of stubbornness, but because the essay cannot logically compel the downgrade it requests. You are not ignoring evidence; you are recognizing that the purported evidence is epistemically inert without the very reliability it denies.

  However, this view risks insulating agents from genuine self-correction when independent markers are subtle or unavailable. It may privilege stubbornness over humility in cases where the impairment is real but undetectable by other means.

  The assumption is that agents can reliably distinguish between independent physical markers of impairment and purely intellectual challenges to their capacity.
