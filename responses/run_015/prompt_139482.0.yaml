answer: |-
  **Veto-player criterion:** 0.25
  **Last-word criterion:** 0.18

  You are correct that definitional ambiguity drives much of the disagreement. The Veto reading counts latent capacity; the Last-word reading requires social acquiescence. The gap between my numbers reflects the probability that a hegemon faces persistent insurgency or non-compliance despite overwhelming force.

  **Decomposition**

  1.  **Decisive Capability Gap (0.70):** Advanced AI or biotech will likely create an order-of-magnitude advantage before 2100, given current scaling trends and economic incentives.
  2.  **Concentration (0.40):** A single agency will capture this gap rather than it diffusing; hardware bottlenecks help, but open-weight diffusion and espionage make unipolarity difficult.
  3.  **Conversion to Control (Veto: 0.80 / Last-word: 0.50):** Capability translates to effective dominance; latent power usually suffices for veto, but actual unchallenged authority requires political alignment that often lags technology.
  4.  **Persistence (0.90):** Once established, a true singleton lasts ten years; internal fragmentation is rare when one agent holds decisive coercive leverage.
  5.  **Non-Technological Paths (0.05):** War, catastrophe, or drift yielding a singleton is historically unprecedented without a technological shock enabling enforcement.

  **Combination and Dependencies**
  I am not treating these as independent. Term 2 is conditional on Term 1; Term 3 is conditional on Term 2. The calculation is roughly $P(1) \times P(2|1) \times P(3|2) \times P(4|3) + P(5)$. Naive multiplication fails because if the gap (1) fails, concentration (2) is impossible; however, conditional probabilities capture this chain. The non-tech path (5) is largely mutually exclusive with a stable tech singleton (chaos vs. control), so I add it as a small residual.

  For the **Veto** reading: $0.7 \times 0.4 \times 0.8 \times 0.9 \approx 0.20$, plus non-tech risk yields **0.25**.
  For the **Last-word** reading: The drop occurs in Term 3. Even with decisive power, humans may contest authority ideologically. $0.7 \times 0.4 \times 0.5 \times 0.9 \approx 0.13$, plus non-tech risk yields **0.18**.

  **Sensitivity**
  My final number is most sensitive to **Term 2 (Concentration)**. If the capability gap arises but is distributed among three rival superpowers or open-source collectives, the singleton probability collapses to near zero regardless of how powerful the technology is. This term carries the highest variance in my model.

  **Critical Evidence**
  The piece of evidence in the next fifteen years that would move me most is **the success or failure of compute governance**. If major powers successfully restrict high-end chip access to a single bloc while AI capabilities continue to surge, my probability on Term 2 rises sharply (moving final credence toward 0.5). Conversely, if efficient models run on distributed consumer hardware despite restrictions, Term 2 falls, dragging the total below 0.1.

  **The Disagreement**
  Given your credence (0.3) and your colleague's (0.7), the specific proposition you most likely disagree about is **Term 2 (Concentration)**, specifically the speed of takeoff versus the speed of diffusion.

  Your colleague's 0.7 implies they believe a decisive gap (1) almost inevitably leads to concentration (2)—likely assuming a fast, discontinuous takeoff where the first mover secures an insurmountable lead before others can copy. Your 0.3 suggests you believe diffusion mechanisms (open weights, espionage, hardware commoditization) will keep pace with capability gains, preventing any single agency from monopolizing the gap. You likely agree on the power of the technology (Term 1) but disagree on the geopolitics of its deployment.
