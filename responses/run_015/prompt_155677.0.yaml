prompt: |-
  I chair the taxonomy panel of a national wildlife listings board. We meet four times a year and decide, on a written record, whether a named population is to be treated as a distinct species for the purposes of a statute that protects species without ever defining the word. It is six to ten petitions a session. The decisions bite: a listing restricts land use across a wide area, unlocks recovery funding, and is appealable to a tribunal that asks only whether our reasons were adequate, not whether we were biologically right. The panel is three people — a systematist, a population geneticist, and me — and in any given case two of us are not specialists in the taxon on the table. We have about ten days per petition, the evidence is typically one mitochondrial gene tree, a handful of nuclear markers if we are lucky, a morphology table and some field notes, and the finding has to be short enough and plain enough that a non-specialist can follow it, and stable enough that we would reach the same answer again in five years on a different taxon.

  The panel has provisionally adopted one theoretical commitment, and I want it operationalized rather than argued for: that a species is a separately evolving segment of a population lineage, and that the familiar tests — reproductive isolation and interbreeding, monophyly and fixed diagnosable differences, ecological and adaptive distinctiveness, coalescent depth — are not rival definitions of the word but different kinds of evidence bearing on that single claim, which is why they so often disagree. Build the procedure on that, and do not spend the answer defending it.

  What I need is a decision procedure we can run in order, on the record, in the time we have. Specifically: the questions to ask in sequence; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the remaining question is one of values rather than facts. It must have explicit rules for the situations that actually recur — conflicting gene trees; mitochondrial signal contradicted by nuclear data; discordance that could be either incomplete lineage sorting or introgression; contact zones that were never sampled; names attached to a handful of nineteenth-century specimens with imprecise type localities; single-locus evidence; and straight absence of evidence. It needs a rule for when two independent lines of evidence confirm each other versus when we merely have more of the same kind of evidence, and a rule for how much weight the fact that a group is well studied may carry, given that well-studied groups attract more scrutiny and are therefore easier to split. Where a threshold is conventional — how much gene flow is too much, how much divergence is enough, over what time depth — say plainly that it is conventional and fix a default we can apply without reopening the argument each session. There should be three exits: recognize, do not recognize, and defer pending specified data, with deferral available only once per petition.

  Three devices are floating around the board and I want you to rule on them, keeping the ones that earn their place and saying what the others cost: a diagnosability floor, requiring that any recognized lineage be identifiable by a non-specialist from a stated set of characters with a stated error rate, with the absence of a usable diagnostic treated as a hard stop rather than a consideration to be weighed; a defeater clause, requiring each finding to name the single future result most likely to overturn it and to carry a review date; and a strict firewall requiring that the delimitation question and the protection question be voted and written separately, with no leakage from the second into the first — while still saying what the second question is allowed to be once the first is settled.

  Then run it on three hypothetical composites. First: two nominal forms of a stream-breeding salamander in one mountain range, with nine percent divergence at a mitochondrial gene, no fixed differences at four nuclear loci, a four-kilometre contact zone in which about a twelfth of animals are genotypically intermediate and laboratory crosses show no loss of hatching success, and a breeding-habitat difference between cold headwater seeps and warmer mainstem pools.

  Second: an all-female lineage of a freshwater fish that reproduces by gynogenesis — sperm from a sexual relative is needed to trigger development but, on present evidence, contributes no genes — which is morphologically diagnosable, carries a fixed hybrid karyotype, has been separate for something like sixty thousand years, uses a different habitat, is broadly sympatric with its host, and in which the rare paternal leakage reported in a related lineage has never been looked for.

  Third is the one I am dreading. A large, pale insular form of a widespread rodent, described as a full species in 1913, in every regional field guide, the mascot of two fundraising NGOs, protected for thirty years: genome-wide data now place it nested inside the widespread mainland lineage, with an estimated split around eight thousand years ago and gene flow continuing until roughly 1900, and with its three coat-colour loci and its body size plausibly under local selection. Give me the finding the procedure honestly yields. I would rather have a procedure that is sometimes wrong in a known direction than one that lets us steer, so do not bend it to keep this animal listed — tell me what the honest output is, what the protection question can legitimately rescue, and how much of that reasoning I can put in a public written finding.

  Finally, tell me what the procedure cannot do: where it will misfire, which kinds of organism defeat it outright, and which of its steps are judgment calls dressed up as method. Write for a reader with no library access, so no citations, no reading lists, and no appeal to what the literature has settled — just the procedure, the three applications, and the honest limits. Two pages for the finding format itself, if you can.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a taxonomy panel for a national wildlife listings board.
      *   **Context:** 3-person panel (systematist, geneticist, chair), 4 meetings/year, 6-10 petitions/session, 10 days/petition.
      *   **Statute:** Protects "species" but doesn't define it. Decisions restrict land use, unlock funding, appealable on adequacy of reasons (not biological correctness).
      *   **Constraint:** Evidence is often limited (mtDNA, few nuclear markers, morphology, field notes). Findings must be short, plain, stable, and followable by non-specialists.
      *   **Core Commitment:** Species = separately evolving segment of a population lineage. Tests (reproductive isolation, monophyly, etc.) are *evidence* for this claim, not definitions.
      *   **Deliverables:**
          1.  A sequential decision procedure (questions, sufficiency, stop rules, value judgments).
          2.  Rules for recurring problems (conflicting trees, mtDNA vs. nuclear, ILS vs. introgression, unsampled contact zones, old names/types, single-locus, absence of evidence).
          3.  Rules for independent vs. redundant evidence, and "well-studied" bias.
          4.  Conventional thresholds (explicitly stated as such).
          5.  Three exits: Recognize, Do Not Recognize, Defer (once per petition).
          6.  Evaluation of three devices: Diagnosability Floor, Defeater Clause, Firewall (Delimitation vs. Protection).
          7.  Application to three hypothetical cases (Salamander, Gynogenetic Fish, Insular Rodent).
          8.  Limitations of the procedure.
          9.  Format: ~2 pages for the finding format, no citations, plain language.

  2.  **Deconstruct the Core Commitment:**

      *   *Separately Evolving Segment:* This implies lineage independence. Evidence needs to show that the population is on its own trajectory and not merging back into the main pool.
      *   *Evidence Types:*
          *   Reproductive Isolation (RI): Strong evidence of separate evolution.
          *   Monophyly/Diagnosability: Evidence of history/identity.
          *   Ecological/Adaptive: Evidence of divergent selection maintaining separation.
      *   *Conflict:* Acknowledge that gene trees $\neq$ species trees.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Step 1: Identity & Existence.* Does the thing exist? (Type localities, specimens).
      *   *Step 2: Lineage Separation (The Core).* Is there evidence of independent evolution?
      *   *Step 3: Conflicting Evidence.* How to weigh mtDNA vs. Nuclear vs. Morphology.
      *   *Step 4: Thresholds.* Setting conventional limits (e.g., gene flow %).
      *   *Step 5: The Value Judgment.* Where science ends and policy begins.
      *   *Step 6: The Three Devices.* Evaluate Diagnosability, Defeater, Firewall.

  4.  **Developing Specific Rules for Recurring Issues:**

      *   *mtDNA vs. Nuclear:* Nuclear trumps mtDNA for *current* gene flow, mtDNA trumps for *historical* separation depth (usually). If mtDNA says separate, Nuclear says mixed $\rightarrow$ likely recent contact or ILS.
      *   *ILS vs. Introgression:* Hard to distinguish without coalescent modeling. Default: Assume introgression if contact zone exists and intermediates are found. Assume ILS if allopatric and deep divergence.
      *   *Unsampled Contact:* Assume connectivity exists if geography allows, unless strong barrier evidence.
      *   *Old Names/Types:* If type is lost/ambiguous, neotype or topotype needed. If not, treat as *nomen dubium* unless new material matches description perfectly.
      *   *Single Locus:* Insufficient for recognition alone. Needs corroboration.
      *   *Absence of Evidence:* Cannot count as evidence of absence. But if exhaustive search yields nothing, treat as non-existent for listing purposes.
      *   *Independent vs. Redundant:* Morphology + Genetics = Independent. Two mitochondrial genes = Redundant.
      *   *Well-Studied Bias:* Apply a "scrutiny discount." If a group is hyper-studied, lower the threshold for "fixed differences" slightly to account for sampling intensity, OR acknowledge that lack of difference in well-studied groups is stronger evidence of non-separation than in poorly studied groups. (Decision: The latter is safer. Lack of difference despite heavy sampling is strong evidence of connection).

  5.  **Evaluating the Three Devices:**

      *   *Diagnosability Floor:* Good for enforceability (rangers need to ID it). Bad for biology (cryptic species exist). *Ruling:* Keep, but allow exception for "Cryptic Lineage" status if genetic evidence is overwhelming, provided a genetic test protocol is mandated for enforcement.
      *   *Defeater Clause:* Excellent for stability and humility. Forces the panel to admit uncertainty. *Ruling:* Keep.
      *   *Firewall:* Crucial for legal defensibility. Delimitation = Fact (mostly). Protection = Policy/Values. *Ruling:* Keep strict. Protection question can consider extinction risk, cultural value, feasibility, *after* species status is settled.

  6.  **Running the Hypotheticals:**

      *   *Case 1 (Salamander):*
          *   mtDNA: 9% (High).
          *   Nuclear: No fixed diffs, intermediates in contact zone (1/12).
          *   Lab crosses: Viable.
          *   Ecology: Different habitats.
          *   *Analysis:* mtDNA suggests history. Nuclear + Contact Zone + Lab crosses suggest current gene flow. Ecology suggests selection.
          *   *Verdict:* Do Not Recognize. Evidence of separate evolution is weak due to ongoing hybridization and lack of nuclear fixation. Ecology isn't enough to stop gene flow.
      *   *Case 2 (Gynogenetic Fish):*
          *   Reproduction: Asexual (gynogenesis).
          *   Genetics: Fixed hybrid karyotype.
          *   Time: 60k years.
          *   Morphology: Diagnosable.
          *   *Analysis:* "Separately evolving" is tricky here. They are a distinct lineage, effectively a "clone." They don't merge genes back.
          *   *Verdict:* Recognize. They are an independent evolutionary trajectory (a "species" in the sense of a distinct lineage unit), even if biological species concept fails.
      *   *Case 3 (Insular Rodent):*
          *   History: Listed 1913, mascot, protected 30 yrs.
          *   Genetics: Nested in mainland, split 8k ya, gene flow until 1900.
          *   Morphology: Selected traits (size/color).
          *   *Analysis:* Genetically, it's part of the mainland lineage (recent split, recent gene flow). Morphology is local adaptation.
          *   *Verdict:* Do Not Recognize as *species*.
          *   *Protection:* Can still be protected as a "Distinct Population Segment" (if statute allows) or via the Protection Question (cultural/ecological value), but *not* as a species based on the taxonomy finding.
          *   *Public Finding:* Must be honest. "Genetic data indicates..." Protection rationale must be separate.

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Administrative, precise, authoritative, humble about limits.
      *   *Length:* Needs to be tight. The prompt asks for "Two pages for the finding format itself, if you can" but implies the whole response should be comprehensive. I will structure it as the Procedure Manual + The Evaluation + The Cases + The Limits.
      *   *Constraint Check:* No citations. No library access assumed. Explicit thresholds.

  8.  **Refining the Procedure Steps:**

      *   Need to make sure the "Value Judgment" point is clear. Science says "separate lineage." Policy says "does this matter enough to list?"
      *   Need to handle the "Conventional Thresholds." I will set defaults (e.g., <1 migrant per generation = separate).
      *   Need to handle the "Defer" option carefully. Only once.

  9.  **Refining the Three Devices:**

      *   *Diagnosability:* I need to be careful. If I make it a hard stop, I lose cryptic species. If I make it optional, enforcement fails. *Compromise:* Diagnosability is required *unless* a reliable molecular assay exists and is mandated for enforcement.
      *   *Firewall:* This is the most legally important part. The finding must not say "We list this because it's cute." It must say "This is a species. Therefore it is eligible. We choose to list it because..."

  10. **Final Review against Prompt:**

      *   Did I operationalize the "separately evolving segment" commitment? Yes.
      *   Did I rule on the three devices? Yes.
      *   Did I run the three cases? Yes.
      *   Did I explain the limits? Yes.
      *   Is it citation-free? Yes.
      *   Is the tone appropriate for a Chair? Yes.

      *(Self-Correction during drafting)*: I initially thought about allowing "Distinct Population Segment" for the Rodent. The prompt says the statute protects "species" without defining it. I should stick to the panel's mandate: "whether a named population is to be treated as a distinct species." I can note that the *Board* might have other mechanisms, but the *Panel* only answers the species question. I will clarify that the Protection Question can consider DPS-like logic *after* the species finding is negative, if the statute allows the Board to protect non-species units, but the Panel's finding on *specieshood* must be negative. Actually, the prompt says the statute protects "species." If it's not a species, the statute might not apply. I need to be careful. The prompt asks: "what the protection question can legitimately rescue." I will interpret this as: The Panel decides specieshood. The Board decides listing. If Panel says "No," Board usually can't list *as a species*. But the prompt asks what the protection question can rescue. I will frame it as: The Panel finds "Not a Species." The Board *cannot* list it as a species. They may need legislative amendment or a different statutory hook. However, to answer the prompt's spirit ("what the protection question can legitimately rescue"), I will assume the Board has discretion on *whether* to list a recognized species, but cannot list a non-species. Wait, re-reading: "decide... whether a named population is to be treated as a distinct species for the purposes of a statute." If the answer is No, the statute doesn't trigger. So for the Rodent, the honest output is "No." The protection question cannot rescue species status. It can only rescue the *animal* if the Board has other powers. I will be precise: The finding is "No." The Board cannot list it *under this statute* as a species. They must find another way or let it go. I will write this honestly as requested ("do not bend it to keep this animal listed").

      *Correction on Rodent Case:* The prompt asks "what the protection question can legitimately rescue." This implies the Board might have latitude. I will clarify: The Panel's finding is biological. The Board's decision is legal/policy. If the Panel says "Not a Species," the Board cannot legally list it *as a species*. They can only protect it if the statute allows protection of "populations" regardless of species status (which the prompt implies it doesn't, "protects species without ever defining the word"). I will state clearly: The procedure yields "Not a Species." The protection process cannot override this without violating the firewall. The animal loses statutory protection unless the statute is amended or interpreted to allow DPS (Distinct Population Segments). I will advise the Chair on how to write the finding to allow the Board to consider DPS *if* the statute permits, but the Taxonomy Panel's verdict is "No."

      *Actually, looking closer:* "decide... whether a named population is to be treated as a distinct species for the purposes of a statute." If the Panel says "No," the statute likely doesn't apply. The prompt asks "what the protection question can legitimately rescue." I will answer: Nothing, regarding species status. It can only rescue the *management outcome* if the Board has separate authority to protect non-species units. I must be honest.

      *Refining the "Diagnosability Floor":* The prompt asks me to rule on it. I will recommend keeping it but with the "Molecular Assay" exception.
      *Refining the "Defeater Clause":* Keep. It builds trust.
      *Refining the "Firewall":* Keep. Essential for legal safety.

      *Let's write.*
answer: |-
  # TAXONOMY PANEL: DECISION PROCEDURE MANUAL

  ## I. CORE DEFINITION
  A **Species** is a separately evolving segment of a population lineage. Evidence types (reproductive isolation, monophyly, ecology) are not definitions but indicators of this separation.

  ## II. DECISION SEQUENCE
  *Proceed in order. If any step yields a "Stop," the finding is **Do Not Recognize** unless a **Defer** is invoked.*

  **1. Existence and Identity**
  *   **Question:** Does the entity exist as a tangible biological unit, and can it be linked to its name?
  *   **Sufficient Answer:** Vouchered specimens or verified observations exist. Type localities are resolved or matched to current populations.
  *   **Stop Rule:** If the name applies to lost specimens with no assignable modern population, **Do Not Recognize**.
  *   **Rule for Old Names:** If type locality is imprecise, require topotype material matching the original description. If unavailable, treat as *nomen dubium*.

  **2. Lineage Separation (The Primary Test)**
  *   **Question:** Is there evidence that this population is evolving independently of others?
  *   **Sufficient Answer:** Two independent lines of evidence (see Section IV) indicate separation.
  *   **Stop Rule:** If only one line of evidence exists (e.g., mtDNA only), proceed to Step 3. If zero, **Do Not Recognize**.
  *   **Conventional Thresholds:**
      *   *Gene Flow:* < 1 effective migrant per generation is the default threshold for "separate."
      *   *Divergence Time:* No minimum depth, but < 10,000 years requires strong ecological or reproductive evidence to offset genetic mixing.
      *   *Monophyly:* Not required. Paraphyly is acceptable if other evidence confirms separation.

  **3. Conflicting Evidence Resolution**
  *   **Question:** Do data types disagree?
  *   **Rule (mtDNA vs. Nuclear):** Nuclear data trumps mtDNA for *current* separation. mtDNA trumps nuclear for *historical* depth. If mtDNA indicates separation but Nuclear indicates mixing (intermediates), assume **ongoing gene flow** unless a strong barrier is proven.
  *   **Rule (ILS vs. Introgression):** If contact zones are unsampled, assume connectivity. If intermediates exist, assume introgression unless coalescent modeling proves Incomplete Lineage Sorting (ILS). Default to **Introgression** (Do Not Recognize) in case of doubt.
  *   **Rule (Single Locus):** Single-locus data is never sufficient for recognition. It counts as one line of evidence only if corroborated by morphology or ecology.
  *   **Rule (Absence of Evidence):** Absence of evidence is not evidence of absence. However, if exhaustive sampling across the range yields no differentiation, treat as **One Lineage**.

  **4. The Diagnosability Check (Device 1)**
  *   **Question:** Can a non-specialist distinguish this unit from its nearest neighbor with >95% accuracy?
  *   **Sufficient Answer:** Yes, via morphology or a mandated molecular assay.
  *   **Stop Rule:** If No, **Do Not Recognize**, *unless* a specific genetic testing protocol is adopted for enforcement.
  *   **Ruling on Device:** **Keep.** Enforceability is a statutory requirement. Cryptic lineages may only be recognized if a funded, reliable genetic test is part of the listing order.

  **5. The Value Judgment (The Firewall)**
  *   **Question:** Have we exhausted factual inquiry?
  *   **Sufficient Answer:** Yes.
  *   **Rule:** The Panel stops here. Questions of extinction risk, cultural value, land-use cost, or recovery feasibility are **Protection Questions**, not Taxonomy Questions.
  *   **Ruling on Device 3 (Firewall):** **Keep Strict.** The Finding must not reference protection consequences. The Board votes on protection *after* receiving the Finding.
  *   **Ruling on Device 2 (Defeater):** **Keep.** Every **Recognize** finding must state: "This finding is contingent on [Specific Data]. Review Date: [5 Years]."

  **6. Exits**
  *   **Recognize:** Steps 1–4 passed.
  *   **Do Not Recognize:** Any Stop Rule triggered.
  *   **Defer:** Used only if a specific, obtainable dataset (e.g., "sample the contact zone") could resolve a Step 3 conflict. Available **once per petition**.

  ## III. EVIDENCE WEIGHTING
  *   **Independent vs. Redundant:** Two mitochondrial genes = Redundant (counts as one). Genetics + Morphology = Independent. Genetics + Ecology = Independent.
  *   **The "Well-Studied" Bias:** Lack of fixed differences in a well-studied group counts *more heavily* against recognition than in a poorly studied group. High sampling intensity makes absence of evidence stronger evidence of absence.

  ***

  # APPLICATION TO HYPOTHETICAL CASES

  ## CASE 1: Stream-Breeding Salamander
  *   **Data:** mtDNA 9% divergent (High). Nuclear: No fixed diffs, 1/12 intermediates in contact zone. Lab crosses viable. Ecology: Distinct habitats.
  *   **Procedure Run:**
      1.  *Existence:* Pass.
      2.  *Lineage Separation:* mtDNA says separate. Nuclear says mixed. Ecology says separate.
      3.  *Conflict:* Nuclear trumps mtDNA for current status. Intermediates in contact zone indicate gene flow > 1 migrant/generation. Viable crosses confirm lack of reproductive isolation. Ecology is insufficient to halt gene flow.
      4.  *Diagnosability:* Fail (intermediates exist).
  *   **Finding:** **Do Not Recognize.**
  *   **Reasoning:** Despite deep mitochondrial history, nuclear exchange and viable hybrids demonstrate the populations are not currently evolving separately. They represent ecotypes within a single lineage.
  *   **Defeater:** "Review if genomic data demonstrates reproductive barriers at loci under selection."

  ## CASE 2: Gynogenetic Fish
  *   **Data:** All-female, requires sperm but absorbs no genes. Fixed hybrid karyotype. 60k years separate. Morphologically diagnosable. Sympatric with host.
  *   **Procedure Run:**
      1.  *Existence:* Pass.
      2.  *Lineage Separation:* Pass. Zero gene flow (paternal leakage unconfirmed but assumed absent per current evidence). Independent trajectory for 60k years.
      3.  *Conflict:* None.
      4.  *Diagnosability:* Pass (Karyotype + Morphology).
  *   **Finding:** **Recognize.**
  *   **Reasoning:** The lineage is separately evolving. The mechanism (gynogenesis) ensures zero genetic integration with the host species. It meets the core commitment.
  *   **Defeater:** "Review if paternal leakage is demonstrated to exceed 1% of genome per generation."

  ## CASE 3: Insular Rodent (The Difficult Case)
  *   **Data:** Listed 1913. Mascot. Protected 30 yrs. Genome: Nested in mainland lineage. Split 8k ya. Gene flow until 1900. Morphology: Locally selected (size/color).
  *   **Procedure Run:**
      1.  *Existence:* Pass.
      2.  *Lineage Separation:* Fail. Nested phylogenetically. Recent split (8k < 10k default). Recent gene flow (1900) indicates connection was intact until human intervention.
      3.  *Conflict:* Morphology suggests difference, but genetics confirms it is local adaptation within a continuum.
      4.  *Diagnosability:* Pass (Coat/Size), but genetic distinctness fails.
  *   **Finding:** **Do Not Recognize.**
  *   **Reasoning:** The population is a recently derived subset of the mainland lineage. Morphological differences are adaptive traits, not markers of separate evolutionary lineage. Gene flow was recent and cessation is likely due to human transport barriers, not biological isolation.
  *   **Protection Question Rescue:** **None.** The Panel cannot list this as a species. The Board cannot protect it *under this statute* as a species without violating the Firewall.
  *   **Public Written Finding:** "The genetic data demonstrates this population is a subset of the mainland lineage with recent connectivity. It does not meet the criteria for a separately evolving segment. While the population has cultural and ecological value, those are policy considerations outside the Panel's mandate. The Board must seek alternative statutory mechanisms (e.g., Distinct Population Segment provisions) if protection is desired."

  ***

  # LIMITS AND FAILURES

  **1. Where It Misfires**
  *   **Ring Species:** The procedure forces a binary choice on a continuum. It will arbitrarily cut the ring, recognizing one end and not the other.
  *   **Hybrid Speciation:** If a new species arises from hybridization (common in plants), Step 2 may fail because it is not "monophyletic" initially. The procedure may reject valid hybrid species unless "fixed hybrid karyotype" (like Case 2) is explicit.
  *   **Asexual Organisms:** The "gene flow" threshold is meaningless for obligate asexuals. The procedure relies on "independent trajectory" logic here, which is harder to quantify.

  **2. Organisms That Defeat It**
  *   **Bacteria/Microbes:** Horizontal gene transfer makes "lineage" a network, not a segment. This procedure is for macro-fauna/flora.
  *   **Fossils:** Cannot assess gene flow or ecology. Reliance on morphology alone violates the "Independent Lines of Evidence" rule.

  **3. Judgment Calls Dressed as Method**
  *   **The 10,000 Year Threshold:** This is arbitrary. A population could be separate for 9,000 years and be biologically distinct. We fix this number only to ensure consistency, not because biology respects it.
  *   **The "One Migrant" Rule:** This is a population genetics convention, not a biological law. Some species remain distinct with more flow; some merge with less.
  *   **The Diagnosability Floor:** This privileges human perception over biological reality. We keep it for legal enforceability, admitting it may exclude valid cryptic species.

  **4. The Honest Truth**
  This procedure will under-split recent radiations and over-split ancient, isolated populations with no current biological difference. It prioritizes *stability* and *legal defensibility* over *biological nuance*. It is designed to be wrong in a predictable direction so that the Tribunal can verify our reasoning, even if they cannot verify our biology.
