answer: |-
  You have identified a very specific and pervasive rhetorical maneuver. While there is no single Latin-named fallacy that captures this exact three-step sequence (Claim Antiquity → Retreat to Subjectivity → Re-deploy Antiquity), it is a recognized composite of several logical and sociological concepts.

  In the literature of critical nationalism studies and political philosophy, this is best described as **Ontological Equivocation** functioning within a **Motte-and-Bailey** structure, reliant on the **Reification** of an imagined community.

  Here is the breakdown of the components, the closest established terms, and how to distinguish this from legitimate complex identity.

  ### 1. The Logical Structure: Ontological Equivocation
  The core logical error is **Equivocation**. The arguer uses the word "Nation" to mean two different things within the same argument without acknowledging the shift.
  *   **Definition A (The Offensive Claim):** The Nation is an *objective, historical entity* (a continuous biological or political lineage). This is required to make the normative claim that newcomers must assimilate to something "real" and "pre-existing."
  *   **Definition B (The Defensive Claim):** The Nation is a *subjective, psychological state* (a shared will or belief). This is used when Definition A is falsified by historical evidence.

  When challenged, they switch from A to B. When demanding loyalty, they switch from B back to A. In philosophy, this is sometimes called **"Ontological Smuggling"**—smuggling the normative weight of an objective fact (A) into a argument that is only defensible as a subjective preference (B).

  ### 2. The Rhetorical Structure: The "Bailey-Dependent" Motte-and-Bailey
  You noted this doesn't feel like a standard **Motte-and-Bailey**. In a standard Motte-and-Bailey, the arguer retreats to the Motte (the defensible position) and stays there when attacked.
  *   **Standard M&B:** "Men are better at leadership" (Bailey) → "I just mean on average in some metrics" (Motte). *Retreats to Motte to end the fight.*
  *   **Your Observation:** "Our nation is 1,000 years old" (Bailey) → "Nationhood is just shared belief" (Motte) → "Therefore, you must respect our 1,000-year traditions" (Back to Bailey).

  Scholars of argumentation theory sometimes call this **"Motte-and-Bailey with Counter-Attack"** or **"Oscillating Definitions."** The Motte is not the destination; it is merely a shield used to protect the Bailey so the Bailey can continue doing the normative work. The arguer wants the *prestige* of the Bailey (antiquity) with the *invulnerability* of the Motte (subjectivity).

  ### 3. The Sociological Concept: Reification
  This move relies on **Reification** (from *res*, thing). This is the error of treating an abstract social construct as a concrete, natural thing.
  *   **Benedict Anderson** ("Imagined Communities") and **Eric Hobsbawm** ("Invented Traditions") describe the *phenomenon* (that nations are constructed).
  *   **Peter Berger and Thomas Luckmann** ("The Social Construction of Reality") describe the *process* (how these constructions become "real" to the participants).

  The rhetorical move you are spotting is the **active enforcement of Reification**. The arguer is asking you to treat the "Imagined Community" as if it were a "Biological/Political Continuum" for the sake of policy, while admitting it is only "Imagined" for the sake of history.

  ### 4. Is there a specific name?
  In critical nationalism studies, this tension is often referred to as **The Primordialist-Constructivist Oscillation**.
  *   **Primordialism:** The belief that nations are ancient, natural, and fixed.
  *   **Constructivism:** The belief that nations are modern, created, and fluid.

  Nationalist rhetoric often engages in **"Strategic Essentialism"** (a term coined by Gayatri Spivak). While Spivak originally used this to describe marginalized groups temporarily adopting an essentialist identity for political solidarity, the term is now often applied critically to nationalists who adopt essentialism when it grants authority and constructivism when it grants immunity.

  If you need a label for your writing or debate, **"Ontological Opportunism"** or **"The Continuity Shell Game"** are accurate descriptive terms, though **"Equivocal Nationalism"** is the most philosophically precise.

  ### 5. Boundary Cases: Where does this end and "Regular Identity" begin?
  This is the crucial distinction. Not all claims of national continuity are fallacious. Here is how to distinguish the rhetorical trick from legitimate complex identity:

  **A. The "Honest Myth" vs. The "Rhetorical Switch"**
  *   **Legitimate:** A speaker genuinely believes the nation is ancient. They are historically mistaken, but they are not arguing in bad faith. They will not pivot to "it's just belief" when challenged; they will double down on the history.
  *   **The Fallacy:** The speaker *knows* (or accepts) the historical evidence but refuses to let it change the normative conclusion. They use the "belief" argument *only* to deflect scrutiny, not to revise their understanding of the nation.

  **B. "Cultural Continuity" vs. "Political Continuity"**
  *   **Legitimate:** "Our language, folklore, and customs have continuous roots in the medieval period, even if our borders changed." This is often historically defensible (ethno-linguistic continuity).
  *   **The Fallacy:** "Our *state*, *citizenship*, and *political obligations* are continuous from the medieval period." This conflates culture with polity. Newcomers can be asked to learn the language (cultural), but not to submit to a "timeless political will" that didn't exist 200 years ago (political).

  **C. "Liberal Nationalism" vs. "Ethno-Nationalism"**
  *   **Legitimate (Liberal Nationalism):** "We are a modern construct, but this construct provides a framework for democracy and solidarity that we want to preserve. Assimilation means accepting our current constitution and norms." (Admits the construction, derives norms from the *current* reality).
  *   **The Fallacy:** "You must assimilate to our *ancestral* norms because the nation is timeless." (Derives norms from a *fictionalized past* while defending the nation's existence via *current feelings*).

  ### Summary for Deployment
  If you encounter this, you can name the move without sounding like you are just shouting "fallacy."

  > "You are engaging in **ontological equivocation**. When I challenge your historical facts, you define the nation as a **subjective belief** (which is unfalsifiable). But when you demand my assimilation, you define the nation as an **objective historical reality** (which is binding). You cannot use the shield of constructivism to protect the sword of essentialism."

  This pinpoints the exact mechanism: using the *invulnerability* of the subjective claim to protect the *authority* of the objective claim.
