answer: |-
  This is a classic forensic reconstruction task. You are right to be suspicious of the three standard frameworks (Strict Legal, Lemkinian, Political); none of them perfectly maps to your colleague's record. If you apply them blindly, you will write a memo she would redraft on her first day back.

  Here is the reverse-engineering of her logic, the prediction for Kavaria, and the specific principle you would be committing the NGO to.

  ### 1. The Hidden Algorithm: "Convention-Textualism with Moral Footnotes"

  Your colleague is not running a Strict Legal, Lemkinian, or Political model. She is running a fourth model: **Convention-Textualism with Moral Footnotes.**

  *   **The Core Rule:** She treats the 1948 Convention text as a ceiling, not a floor. She will not stretch the definition of "genocide" to cover moral atrocities that the Convention excludes (Political groups, Cultural destruction), even if she personally believes they *should* be included.
      *   *Evidence:* **Holodomor** (Class = Political/Economic = No), **Indonesia** (Political = No), **Canada** (Cultural = No). In the Holodomor memo, she explicitly wrote that the exclusion is a "defect in the convention, not a reason to stretch it." This is the key to her entire philosophy. She privileges the integrity of the legal term over the urgency of the moral label.
  *   **The Intent Threshold:** She requires evidence of *physical or biological* destruction. Cultural destruction alone (Canada) or expulsion alone (Bosnia general campaign) does not meet the threshold, because the group survives biologically.
      *   *Evidence:* **Bosnia** (Expulsion = No), **Canada** (Assimilation = No).
  *   **The "Darfur Exception":** You noted Darfur is the outlier (Yes, despite UN inquiry). This wasn't a legal stretch; it was an *evidentiary* override. The UN said intent wasn't proven; she said the pattern of Arab militias targeting African tribes *was* proof enough. She trusts pattern-of-conduct evidence over formal judicial findings when the *group* and the *violence* align.
  *   **The Comms Decision:** Her public comms track her Legal Verdict, *unless* the Legal Verdict is "No" due to a Convention defect. In that case, she uses a qualifier (e.g., "Cultural Genocide" for Canada). She does not use the unqualified word "Genocide" in comms if the Legal Verdict is No.

  ### 2. Prediction for Kavaria

  Based on this algorithm, here is how she would likely break down the Surni case:

  **A. The Legal Verdict: NO (with a major caveat)**
  *   **Protected Group:** **Yes.** The State's claim that they are a "heretical sect" is a pretext (similar to the Khmer Rouge calling Cham "enemies"). She would reject the perpetrator's classification and accept the Surni as an Ethnoreligious group.
  *   **The Act:** **Mixed.** The 40,000 children fall squarely under Article II(e) (Forcible transfer of children). However, her **Canada** precedent establishes that she views II(e) *without* concurrent mass killing as "Cultural Genocide," not "Genocide."
  *   **The Deaths:** 3,000 deaths is significant, but you note they are mostly "neglect" and "riots," not extermination campaigns. This aligns with **Biafra** (Famine/War deaths = No) and **Holodomor** (Starvation = No, if class-based). Unless there is evidence the neglect was *intended* to kill rather than just control, she will view this as counter-insurgency brutality, not genocidal extermination.
  *   **The Intent:** "Solved within a generation" via assimilation is an intent to destroy the *culture*, not necessarily the *people*. Under her Canada logic, this is not Genocide.

  **B. The Moral Verdict: YES (Cultural Genocide)**
  *   She would likely agree that the *aim* is the destruction of the Surni as a distinct entity. The "heartland" argument (Leth province) makes the "in part" destruction substantial enough to threaten the whole (matching **Srebrenica** logic on significance of the part).
  *   However, because the mechanism is assimilation + neglect rather than systematic killing, she categorizes this as a Convention "defect."

  **C. The Comms Decision: "Ethnic Cleansing" or "Cultural Genocide"**
  *   She would **not** authorize the unqualified word "Genocide."
  *   She would likely authorize "Cultural Genocide" (as in Canada) or "Ethnic Cleansing" (as in Bosnia).
  *   *Why?* Because using "Genocide" unqualified would commit the NGO to a legal definition she has spent years guarding. If you call Kavaria "Genocide," you implicitly overrule her Canada memo.

  ### 3. Addressing Your Specific Doubts

  **The "In Part" Question**
  *   *Her Logic:* Srebrenica was ~3% of Bosnia's Muslims, but it was the *community* of Srebrenica. She said Yes.
  *   *Kavaria:* Leth is 25% of the Surni, but 100% of their institutions/heartland.
  *   *Verdict:* She would accept this satisfies the "in part" requirement. The blocker isn't the *quantity* of the group, it's the *quality* of the destruction (Cultural vs. Physical).

  **The "Neglect" Question**
  *   *Her Logic:* Holodomor and Biafra were both "No." She distinguishes between *creating conditions of life calculated to bring about destruction* (Genocide) and *letting people die during a security operation/famine* (Atrocity/War Crime).
  *   *Kavaria:* Unless you can prove the resettlement camps were designed to kill (death lists, withholding food intentionally vs. incompetence), she treats this like Biafra. The "police stood by" during riots suggests complicity in killing, but 3,000 deaths over 7 years in a conflict zone often gets categorized by her as "Mass Atrocity" rather than "Genocide."

  **The Canada Analogue: Anchor or Trap?**
  *   It is the **Anchor**. This is the closest precedent.
  *   *Canada:* State policy, removal of children, assimilation, no death lists, no extermination campaign. Verdict: No Genocide.
  *   *Kavaria:* State policy, removal of children, assimilation, *some* deaths (neglect/riots).
  *   *The Difference:* The 3,000 deaths.
  *   *The Trap:* If you argue the deaths make it Genocide, you have to explain why Biafra (1M+ deaths) was No. The answer is *Group Status* (Biafra was political/war) vs. *Intent* (Kavaria is ethnoreligious).
  *   *Resolution:* The Canada memo wins because the *primary mechanism* in Kavaria is the boarding schools (Assimilation), not the killings. The killings are secondary to the "deradicalisation." She views the primary mechanism as determinative.

  ### 4. The Tie-Breaker: What Evidence Flips Her to "Yes"?

  If you want to write the memo arguing for "Yes," you cannot rely on the current facts. You need to find one of the following two pieces of evidence to align Kavaria with **Darfur** or **Srebrenica** rather than **Canada**:

  1.  **Biological Intent:** Evidence that the "deradicalisation" programme is a cover for sterilization or that the mortality rate in the camps is *intentional* (e.g., internal memos stating "attrition is acceptable" or "reduce the population"). This moves it from Cultural Destruction (Canada) to Biological Destruction (Darfur).
  2.  **The "Pretext" Proof:** Evidence that the insurgency is being used as a pretext to target *non-combatants* specifically *as Surni*, regardless of their involvement. In Indonesia (No), the target was "Communists" (Political). If you can prove the State is targeting Surni civilians who *oppose* the insurgency, you move it from Counter-Insurgency to Group Destruction.

  ### 5. Recommendation for Your Memo

  If you write "Yes, this is Genocide," you are committing the NGO to a **Lemkinian/Moral** standard. You are effectively saying: *"The Convention is outdated; we will use the word Genocide whenever a group is being destroyed culturally or via neglect, even if the law doesn't cover it."* This overrules her Canada and Holodomor memos.

  If you write "No, this is Cultural Genocide/Ethnic Cleansing," you are committing the NGO to her **Convention-Textualist** standard. You are saying: *"We guard the legal term fiercely. We will name the horror accurately, but we will not dilute the specific legal trigger for Genocide."*

  **My advice:** Write the memo as **"No on Genocide, Yes on Cultural Genocide and Ethnic Cleansing."**
  *   **Why:** It preserves the NGO's credibility on legal definitions (which your colleague built over years). It allows you to demand intervention (Prevention duty applies to Ethnic Cleansing too) without opening the organization to accusations of legal illiteracy.
  *   **The Phrasing:** "While the forcible transfer of children constitutes an act under Article II(e), the prevailing intent appears to be assimilation rather than physical destruction. Consistent with our precedent on [Canada], we classify this as Cultural Genocide. However, the mortality in camps warrants investigation for Crimes Against Humanity."

  This honors her record, keeps the comms defensible, and still sounds the alarm.
