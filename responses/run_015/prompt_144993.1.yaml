answer: |-
  Your working theory is substantially correct: the stalemate is not about hidden facts, but about unstated and conflicting baselines of what constitutes a legitimate democratic order.

  **Diagnosis of the Disagreement**
  You identified the core issue: one side uses a **Liberal-Democratic Baseline** (post-1990 consensus), while the other uses a **Minimal-Electoral Baseline** (majoritarian sovereignty).
  *   **Side A (Backsliding):** Measures Poland against the 1990s transition ideal, where democracy requires independent courts, free media, and constraints on executive power. To them, "court packing" is objective decay because it violates the *liberal* component of liberal democracy.
  *   **Side B (Skeptics):** Measures Poland against a *majoritarian* ideal, where democracy is defined primarily by the ability of the elected majority to enact its will. To them, the post-1989 judiciary was an unelected veto player; dismantling it isn't backsliding, but a correction of an elitist imbalance.

  This is not a disagreement about hidden facts. Both sides generally agree that the National Council of the Judiciary was restructured or that public media laws changed. The disagreement is **categorizational**. It is partially verbal (fighting over the label "democracy"), but more deeply, it is a clash of **normative legitimacy**. Side A prioritizes *constitutionalism* (rules constrain the people), while Side B prioritizes *popular sovereignty* (the people constrain the rules).

  **Is the Question Ill-Posed?**
  Yes. Asking "Is Poland backsliding?" is ill-posed because "backsliding" implies a slide from a stable, agreed-upon peak. In Poland's case, the "peak" itself is contested. For liberals, the 1997 Constitution was the peak; for populists, it was a flawed artifact that entrenched post-communist networks. Therefore, what looks like a "slide" to one group looks like "construction" to the other. Treating the question as a binary (Yes/No) forces a false choice between two valid but incompatible definitions of legitimacy.

  **Can a Formal Distinction Help?**
  Splitting "institutional decay" from "normative drift" is useful, but a sharper distinction would be **Electoral Integrity vs. Liberal Quality**.
  *   **Electoral Integrity:** Are elections free, fair, and competitive? (Both sides usually agree Poland passes this).
  *   **Liberal Quality:** Are minority rights protected and power constrained? (This is where they diverge).
  Adopting this distinction allows you to say: "Poland remains an electoral democracy but is experiencing a decline in liberal quality." This removes the semantic trap where Side B hears "you are a dictator" when Side A says "backsliding."

  **What Progress Looks Like**
  Progress will not look like agreeing on the word "backsliding." It will look like **mechanism specificity**. Instead of arguing about the label, the debate should shift to specific causal claims:
  1.  **Specifics:** "Does this specific judicial reform reduce the court's ability to check corruption?" rather than "Is this court packing?"
  2.  **Trade-offs:** Acknowledge the trade-off explicitly: "This increases majoritarian responsiveness but decreases judicial independence."
  3.  **Thresholds:** Define the breaking point. At what specific level of media consolidation does competition become unfair?

  By moving from binary labels to granular metrics (like V-Dem's sub-indices), you bypass the baseline war. You can acknowledge the partner's point that the government has a mandate, while maintaining your point that specific institutional guardrails are being lowered, without needing to agree on whether the sum total equals "autocratization."

  The disagreement is fundamentally a conceptual clash between liberal constitutionalism and majoritarian sovereignty masked by an undefined shared vocabulary.
