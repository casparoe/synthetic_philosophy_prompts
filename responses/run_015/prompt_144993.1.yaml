      *   *Side A (Backsliding Advocates):* Focus on liberal democratic norms, checks and balances, rule of law, minority rights. They see the erosion of constraints on executive power as a failure of democracy. Baseline: Liberal Democracy (post-1990 consensus).
      *   *Side B (Skeptics/Defenders):* Focus on electoral legitimacy, majority rule, popular sovereignty. They argue that if the government was elected, their reforms reflect the will of the people. They view "backsliding" claims as elitist attempts to veto electoral outcomes. Baseline: Electoral Democracy (Schumpeterian/Minimalist).
