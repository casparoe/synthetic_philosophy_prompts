answer: |-
  You have identified a genuine and persistent friction point in moral philosophy, specifically within the intersection of care ethics, value theory, and the philosophy of technology. There is no single canonical term for the exact rhetorical move you describe, but it is a recognizable degeneration of a few established concepts.

  Here is the carving you are looking for: the nearest established concepts, how your observation differs, a name for the specific pattern you've found, and an assessment of its substantive validity.

  ### 1. The Nearest Established Concepts

  There are three standard philosophical frameworks that attempt to capture the "residue" you describe. None of them perfectly match the *rhetorical structure* you have identified (definition by subtraction), but they provide the vocabulary for the *value* being claimed.

  **A. Expressive vs. Instrumental Value**
  *   **The Concept:** Instrumental value is the utility of an action (medication taken, food eaten). Expressive value is what the action *says* or *constitutes* about the relationship (honoring, loving, respecting).
  *   **How it fits:** This explains why a paid carer (instrumental) might feel different from a child (expressive).
  *   **How it differs:** In rigorous value theory (e.g., Elizabeth Anderson), expressive value must be *intelligible*. It must be possible to say what is being expressed. The move you describe refuses to specify what is expressed, defining it only as "what the machine lacks." It treats the expression as a ghost rather than a signal.

  **B. Agent-Relative Obligations**
  *   **The Concept:** Some duties are tied to *who you are*, not just *what needs doing*. I have a duty to feed my child that a stranger does not have, even if the stranger feeds the child better.
  *   **How it fits:** This explains the inconsistency you noted. Politically, we might accept paid care (general duty discharged). Morally, the specific agent matters (relative duty).
  *   **How it differs:** Agent-relativity explains why *you* must act, not necessarily why the *recipient* loses value if someone else acts. Your observation is about the value of the care received, not just the duty of the giver.

  **C. Non-Fungibility (or "Sacralization")**
  *   **The Concept:** Certain goods lose their value if they are treated as interchangeable commodities. A gift is not the same as a wage, even if the monetary value is identical.
  *   **How it fits:** This captures the "loss" when care is outsourced or automated.
  *   **How it differs:** Non-fungibility usually relies on social norms (money corrupts the gift). Your example involves software, where no market exchange necessarily occurs between the user and the device. The "residue" here isn't about commodification, but about *ontology* (what kind of thing is providing the care).

  ### 2. The Specific Pattern: "Residual Relational Essentialism"

  The move you have isolated is a rhetorical strategy rather than a strict ethical framework. It relies on defining the essence of care by what it is *not* (functional, replicable, observable) rather than what it *is*.

  I suggest calling this **Residual Relational Essentialism**.

  **The Structure:**
  1.  **Concede Function:** Admit all observable tasks are met (the "Instrumental").
  2.  **Assert Residue:** Claim a value remains unaccounted for (the "Relational").
  3.  **Define by Negation:** Define the Residue exclusively as that which cannot be functionalized or observed.
  4.  **Shift Ground:** When pressed, move the Residue from the *outcome* (the care received) to the *motive* (the giver's interior state), or vice versa, to avoid falsification.

  **Why it feels slippery:**
  It treats **Phenomenology** (how it feels to be cared for) as **Metaphysics** (a hidden substance that exists independently of the feeling).
  *   *Substantive Claim:* "The recipient feels less secure knowing the care is automated." (Testable).
  *   *Residual Essentialist Claim:* "The care is objectively lesser because the motive is absent, regardless of how the recipient feels." (Uncheckable).

  ### 3. Substantive Claim or Rhetorical Shelter?

  Charitably read, this is a substantive claim about **Epistemic Security**. Uncharitably, it is a **Domain Protection** move.

  **The Substantive Core (Epistemic Security):**
  Human motives are predictive. If a child cares for a parent out of love, we predict they will adapt to new, unforeseen needs with flexibility. If a system cares out of code, we predict it will fail at edge cases.
  *   The "Residue" is actually a heuristic for **long-term reliability in uncertain contexts**.
  *   When philosophers say "something is lost," they often mean "the guarantee of adaptive responsiveness is lost."
  *   *Why it looks like a residue:* Because adaptive responsiveness is hard to measure in a two-year pilot. It only shows up in crises. Therefore, it appears as an invisible "extra" rather than a functional capability.

  **The Rhetorical Shelter (Domain Protection):**
  Care ethics emerged partly to defend the moral significance of "women's work" against economic and scientific devaluation.
  *   If care is fully reducible to tasks, it can be fully optimized, priced, and potentially displaced (by you, the engineer).
  *   By positing an uncheckable "Residue," the theorist creates a **Moat**. It ensures that no matter how good the engineering gets, the philosopher retains the authority to say, "But it is not *Care*."
  *   This explains the inconsistency you saw. When arguing for better pay for carers, the "Residue" is emphasized (care is special). When arguing that society must support families, the "Residue" is minimized (paying for care is fine). The concept expands or contracts to protect the conclusion.

  ### 4. Boundary Cases

  To test whether a case involves this pattern or something else, apply the **Substitution Test**.

  **Case A: Anesthesia (Not this pattern)**
  *   *Scenario:* An anesthesiologist puts you to sleep. You require a specific chemical outcome.
  *   *Analysis:* We do not posit a residue. We do not care if the anesthesiologist loves us. If a robot administers the gas with higher precision, we prefer the robot.
  *   *Why:* The good is purely instrumental. There is no claim of relational value.

  **Case B: The Comfort of Presence (This pattern)**
  *   *Scenario:* A lonely elder sits with a visitor. The visitor says the right things, but is checking their watch.
  *   *Analysis:* The tasks (speech, presence) are replicated. The "loss" is located in the attention/motive.
  *   *Boundary:* If the elder *does not know* the visitor is distracted, is the care lesser?
      *   *If Yes:* You are in **Residual Relational Essentialism**. The value is metaphysical, independent of the recipient's experience.
      *   *If No:* You are in **Phenomenology**. The value is in the experience of security. If the elder feels secure, the care is good.

  **Case C: Blood Donation (Neighboring concept)**
  *   *Scenario:* Paid blood vs. Voluntary blood. Safety is identical.
  *   *Analysis:* Richard Titmuss argued voluntary blood creates a social bond; paid blood erodes it.
  *   *Distinction:* This is **Systemic Expressive Value**. The loss isn't in the specific transaction (the transfusion), but in the social meaning of the institution. This is checkable (social trust metrics). It is not a "residue" in the specific interaction, but a cost to the network.

  ### 5. Summary for Your Defense

  When you encounter this move in your internal defense:

  1.  **Identify the Category:** Ask whether they are claiming the loss is **Phenomenological** (the client feels less secure) or **Metaphysical** (the care is objectively lesser regardless of feeling).
  2.  **If Phenomenological:** Treat it as a risk requirement. "We need to design the system to maximize the client's perception of security and continuity." This moves the "residue" into a feature set (e.g., consistency of voice, personalization).
  3.  **If Metaphysical:** Identify it as **Residual Relational Essentialism**. Point out that defining value by what technology cannot do is a moving target. Ask for the **positive definition**: "If motive is unobservable, what behavioral disposition constitutes it, and can we not encode that disposition?"

  The "residue" is real only insofar as it cashes out as **trust**. If your system generates trust, the residue is present. If the philosophers insist the residue is missing even when trust is present, they are engaging in domain protection, not ethical analysis.
