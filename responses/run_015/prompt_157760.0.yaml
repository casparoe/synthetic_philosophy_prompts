          *   *Mortuary:* Terrible if it claims "immortality." Matters if it admits "it's just a ghost."
          *   *Prose:* Worthless if it claims "creativity." Matters if it admits "silence is better."

  5.  **Refining the Voice:**
      *   The response should not *be* Borges (no fake quotes), but an analysis *of* Borges. However, the tone should be erudite, precise, and slightly melancholic, respecting the philosophical depth of the prompt.
