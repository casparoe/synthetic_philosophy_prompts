      *   *The Replay Case:* This is the crux.
          *   Is it the same life? For Borges, *no* life is the "same" because there is no continuous self. Sleep breaks the self; death breaks it more.
          *   Does it matter? If there is no subject, "caring" is just another perception.
          *   Connection to *Circular Ruins*: The emulated brain is the dreamed son.
