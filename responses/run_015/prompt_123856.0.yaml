      *   **Two Claims to Disentangle:**
          1.  *Empirical:* Old SMT was shallow; Deep Learning (DL) is richer/better.
          2.  *Conceptual:* Systems without intentionality/embodiment can only do symbol-to-symbol mapping (syntax without semantics).
      *   **Questions to Answer:**
          1.  Was successful translation ever a legitimate proxy for semantic understanding?
          2.  Does cross-lingual vector alignment change the philosophical picture?
          3.  Was Hofstadter's challenge about weak algorithms or the structural impossibility of deriving meaning from form?
      *   **Constraint:** Do not just survey literature; clarify the conceptual terrain.

  2.  **Analyze Hofstadter's Position (Historical Context):**

      *   Hofstadter (along with Dennett, Searle, etc.) falls into the "Chinese Room" tradition of critique.
      *   His specific critique of SMT (e.g., in *Le Ton beau de Marot* or essays from the 90s/00s) was that SMT relied on surface-level n-grams and shallow probabilities without grasping the *spirit* or *meaning* of the text.
