  Brainstorming:
  The core tension is between logical bivalence (every statement is true or false) and ontological openness (the future is not fixed). Aristotle rejects bivalence for future contingents to save contingency, but critics argue this is just a semantic trick that moves necessity to the meta-level. The twist here is crucial: if probabilities don't sum to 1, the sample space of reality is genuinely gappy, not just epistemically vague. This suggests the indeterminacy is in the world, not just our language, which blocks the "shuffling" objection. If the physics itself denies exhaustive outcomes, there is no higher-level fact to restore determinism. Thus, Aristotle's intuition is physically vindicated.

  1. Aristotle rightly suspected that assigning present truth values to future contingents collapses possibility into necessity, thereby destroying free will. If a proposition about tomorrow is already true, the future is effectively written in the present.

  2. Critics argue that merely rejecting bivalence shuffles the problem by making the indeterminacy merely semantic rather than genuinely ontological. They claim the necessity simply migrates to the meta-language governing truth assignments.

  3. However, your branching-time physics scenario posits an ontology where probabilities do not sum to one, ensuring the future is fundamentally incomplete rather than merely unknown. This gap in the probability space signifies a break in the causal chain itself.

  4. This radical indeterminacy prevents the necessity from resurfacing at a higher level because there is no definite fact of the matter even about the likelihood of outcomes. The logic of the universe simply lacks the substrate required for deterministic truth values.

  5. Therefore, Aristotle's rejection of bivalence is vindicated as a necessary correlate to an open universe, successfully preserving contingency without logical residue. The indeterminacy is not shuffled but grounded in the very fabric of reality.
