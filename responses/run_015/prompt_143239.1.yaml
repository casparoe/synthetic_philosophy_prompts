answer: |-
  **Title:** Cascading Failures: Reliability Engineering and Non-Human Agency in History

  **Proposal**

  Historians of the environment and technology often oscillate between two unsatisfying framing devices when dealing with non-human forces like germs, climate shifts, or volcanic eruptions. In traditional narrative history, these forces are treated as mere background conditions—the stage upon which human actors perform. Conversely, in strong environmental history, they are elevated to full-blown "historical actors," a move that risks slipping into environmental determinism where human agency is eclipsed by natural necessity. Neither framing captures the nuanced causal dependency I utilize daily in distributed-systems reliability engineering. In engineering, a node failure cascades through a network without anyone attributing intention to the server. The system degrades based on dependency graphs, not motives.

  This workshop proposes a interdisciplinary experiment: Can a counterfactual-dependency model, borrowed from reliability engineering, clarify what it means to call a non-human force an "actor" without falling into environmental determinism? The precise question is: Does defining agency through counterfactual causal leverage, rather than intentionality, allow historians to integrate non-human forces into narrative explanation without reducing human actors to passive variables?

  Existing debates in the philosophy of history and environmental history leave this question open because they lack a formal model of causation that sits between coincidence and determinism. Environmental historians rightly insist that nature matters, but they often struggle to articulate *how* it matters without implying that nature dictates outcomes. Philosophers of agency typically restrict "action" to intentional beings. Consequently, non-human forces are either anthropomorphized or rendered inert. The engineering model offers a third path: a node is significant not because it "wants" to change the system, but because the system's state is counterfactually dependent on its function. If the node had not failed, the cascade would not have occurred. This grants the node causal status without intention.

  To test this, I will apply the model to the 1815 eruption of Mount Tambora. Traditional accounts treat Tambora as a backdrop to the "Year Without a Summer." Strong determinist accounts suggest the eruption caused specific political unrest. My method will map the eruption as a primary node failure within a global socio-ecological network. I will trace the cascade: volcanic aerosols (node failure) leading to global cooling (network latency), leading to harvest failures (service degradation), leading to migration and unrest (system state change). I will not invent archival sources but will rely on established historical consensus regarding the climate anomalies and subsequent social disruptions in Europe and North America. The analysis will focus on counterfactuals: At which points in the cascade was the outcome dependent on the volcanic node versus human policy nodes?

  A successful conceptual clarification would look like a vocabulary that distinguishes causal leverage from intentional action. It would allow us to say "Tambora acted upon the harvest" without implying "Tambora intended to starve the population." It would provide a framework where non-human forces are active participants in the causal graph, yet human responses remain contingent variables within that same graph. Success means historians can acknowledge the necessity of the volcanic event without absolving human policymakers of responsibility for how the crisis was managed.

  Failure would look like two possible outcomes. First, the model might collapse into hard determinism, where the cascade is viewed as inevitable, rendering human agency illusory. If the engineering analogy suggests that once the node fails, the system crash is unavoidable, it fails to capture historical contingency. Second, failure would occur if the model proves too abstract or technical to integrate with narrative history. If the dependency graph cannot be translated into readable historical explanation, it remains an engineering toy rather than a philosophical tool.

  Regarding feasibility for a single 20-minute presentation, the assessment is cautiously optimistic but constrained. The core analogy is intuitive: systems fail due to dependencies, not just motives. However, the risk lies in oversimplification. Twenty minutes is sufficient to outline the philosophical gap and present the Tambora case study, but it is barely enough to address the inevitable pushback regarding the definition of "agency." The presentation must avoid engineering jargon while preserving the logical rigor of the dependency model. If I can successfully demonstrate that counterfactual dependency is already implicitly used in historical reasoning, the model will land effectively. If I spend too long explaining distributed systems, the historical relevance will be lost. The goal is to show that historians are already intuitive reliability engineers; they just lack the formal language to describe non-human nodes.

