  7.  **Review against constraints:**
      *   90 mins? Yes.
      *   Order of ideas? Yes.
      *   One example? Yes (Height).
      *   Misconception order? Yes.
      *   Treatment response? Yes (Defer).
      *   Final question? Yes.
