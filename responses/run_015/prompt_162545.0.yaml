      *(Self-Correction on PKU)*: I will explicitly tell them *why* not PKU (monogenic trap) and *why* Height works better (polygenic + clear environmental variance).

      *(Refining the "Equalize Environment" point)*: If you equalize environment, $V_E$ drops. $V_P = V_G + V_E$. If $V_E$ drops, $V_P$ drops. $h^2 = V_G / V_P$. So $h^2$ goes *up*. Residents think this means genes got "stronger." This is the specific misconception. The BMI example is the same logic (environment became more variable? No, obesogenic environment usually increases $V_E$ or allows $V_G$ to express more? Actually, the classic finding is $h^2$ of BMI is higher in obesogenic environments because the environment allows genetic propensity to express. Wait. If environment is uniform (everyone has unlimited food), $V_E$ is low, $h^2$ is high. If environment is restricted (famine), everyone is thin, $V_G$ can't express, $h^2$ is low. So the "Obesogenic" example is actually about *range of environment*. I need to make sure I explain this clearly so the user knows they are the same mistake.)
