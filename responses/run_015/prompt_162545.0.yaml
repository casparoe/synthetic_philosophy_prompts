answer: |-
  Here is a 90-minute battle plan designed to stop the "40% genetic" shorthand without getting bogged down in formulas.

  ### 1. The Single Example: Adult Height
  **Use Height.** Do not use PKU. Do not use IQ.

  *   **Why Height:** It is the canonical quantitative trait for a reason. It is visibly polygenic (no single "tall gene"), universally understood to be biological, but universally acknowledged to be influenced by environment (nutrition/illness in childhood).
  *   **What it must have:** A clear mechanism for environmental variance (e.g., malnutrition vs. abundance).
  *   **What it must lack:** Stigma (unlike IQ) and the "single-switch" logic (unlike PKU).
  *   **How to use it:** Do not use it to explain *what* heritability is. Use it to show *when the number changes*.
      *   *Scenario A:* A population with uniform excellent nutrition. $V_E$ is low. $h^2$ is high (approx 0.8). Differences are mostly genes.
      *   *Scenario B:* A population with random, variable nutrition (some starve, some feast). $V_E$ is high. $h^2$ is lower. Differences are genes + luck.
      *   *The Punchline:* The genes didn't change. The *number* changed. Therefore, the number is not a property of the genes.

  ### 2. The Order of Ideas (Dependencies)
  You cannot start with the definition ($V_G/V_P$) because they will treat it as a formula to memorize rather than a logic to apply. You must start with the clinical error and work backward to the math.

  1.  **The Clinical Hook (Minute 0-10):** Start with the patient question: *"Doctor, is my depression genetic?"*
      *   *Goal:* Establish that the answer "40%" is a lie.
      *   *Dependency:* You must establish that the statistic they hold (0.4) cannot apply to the individual before you explain why.
  2.  **The Population/_variance Concept (Minute 10-30):** Introduce Height.
      *   *Goal:* Show that $h^2$ describes *differences between people*, not the *cause in one person*.
      *   *Dependency:* You cannot explain why it doesn't apply to the individual (Step 1) until you define it as a population variance ratio (Step 2).
  3.  **The Context Dependence (Minute 30-50):** Change the environment in the Height example (Nutrition).
      *   *Goal:* Show that $h^2$ is not fixed.
      *   *Dependency:* You cannot explain why therapy matters (Misconception 2) until they accept $h^2$ changes with environment (Step 3).
  4.  **The Between-Group Fallacy (Minute 50-65):** Compare two different populations (e.g., North vs. South Korea height data).
      *   *Goal:* Show that high $h^2$ within groups explains nothing about differences *between* groups.
      *   *Dependency:* Relies on understanding that $h^2$ is specific to one population's variance (Step 3).
  5.  **The Denominator Trap (Minute 65-80):** Address the "Equalize Environment" and "BMI/Obesogenic" misconceptions.
      *   *Goal:* Correct the interpretation of rising heritability.
      *   *Dependency:* Requires full comfort with the ratio $V_G / (V_G + V_E)$.

  ### 3. The Misconception Kill Order
  Address these exactly in this sequence. Each one sets up the logic required to kill the next.

  **1. The Individual Attribution Error ("40% of *my* depression is genes")**
  *   **When:** Minute 15 (Immediately after the Hook).
  *   **The Kill:** "Heritability explains why *you* are different from your *neighbor*, not why *you* are different from *yourself without depression*."
  *   **Why here:** If they don't get this, nothing else matters clinically.

  **2. The Fixed/Treatment Nihilism Error ("It's genetic, so therapy is noise")**
  *   **When:** Minute 40 (After showing $h^2$ changes with environment in the Height example).
  *   **The Kill:** "PKU is 100% heritable in a normal diet environment. It is 0% heritable in a phenylalanine-free diet environment. High heritability implies nothing about modifiability."
  *   **Why here:** You need the "Environment changes the Ratio" concept from the Height example to make this stick.

  **3. The Between-Population Error ("Group A is sicker than Group B because of genes")**
  *   **When:** Minute 55.
  *   **The Kill:** Use the North/South Korea height example. Same genes, massive height difference due to environment. High $h^2$ within Korea tells you zero about the gap *between* Koreas.
  *   **Why here:** They need to understand $h^2$ is specific to a specific variance distribution before they can understand it doesn't transfer across distributions.

  **4. The Denominator Error ("Equalizing environment makes genes stronger" & "BMI in obesogenic environments")**
  *   **When:** Minute 70.
  *   **Placement:** **Yes, these go in the same place.** They are the exact same mistake.
  *   **The Mistake:** Residents see $h^2$ go up and think $V_G$ (numerator) got bigger.
  *   **The Kill:** "The genes didn't get stronger. The environmental *noise* ($V_E$) got quieter."
      *   *Equalize Env:* $V_E \to 0$, so $h^2 \to 1$.
      *   *Obesogenic Env:* In a famine, everyone is thin (low $V_P$). In an obesogenic environment, food is unlimited, so genetic propensity to store fat is allowed to vary (high $V_G$ relative to $V_E$).
  *   **Why here:** This is the most mathematically subtle point. It requires them to hold the whole ratio in their head. Do it last.

  ### 4. The "Treatment Response" Question
  **Strategy:** **Defer it.** Do not absorb it into this slot.

  *   **Why:** Heritability of *treatment response* (pharmacogenomics) is a different statistical beast. It involves $G \times E$ interactions (where Treatment is the Environment) and change-scores, which confuses the definition of $h^2$ of a *trait*.
  *   **What to say:** "That is a brilliant question, and the answer is 'yes, there is heritability of response,' but it requires us to define heritability of a *delta* rather than a *state*. If we tackle that today, we will break the concept of standard heritability you need for this paper. Let's park that for the Pharmacogenomics rotation."
  *   **Risk:** If you try to answer it, they will leave thinking $h^2$ is a property of the *drug*, not the population variance.

  ### 5. The Final Assessment Question
  Do not ask them to define heritability. Ask them to predict a change in the statistic.

  **The Question:**
  > "Clinic A serves a population where life stressors are random and highly variable (war, displacement, poverty). Clinic B serves a population where life stressors are uniformly low (stable housing, income, safety).
  >
  > Assuming the genetic makeup of the patients in both clinics is identical: **In which clinic will the heritability of Depression be higher, and why?**"

  **The Correct Answer:**
  > "Clinic B (Low Stress). Because environmental variance ($V_E$) is lower, the proportion of total variance due to genetics ($V_G / V_P$) will be higher. In Clinic A, the massive environmental variance swamps the genetic signal."

  **What this tells you:**
  *   If they say "Clinic A because stress triggers genes," they failed (confusing prevalence with heritability).
  *   If they say "They are the same because genes don't change," they failed (treating $h^2$ as fixed).
  *   If they answer correctly, they understand $h^2$ is a ratio dependent on environmental variance.

  ### 6. What to Explicitly Skip
  Name these omissions at the start so they don't hunt for them later.

  1.  **Falconer's Formula:** Do not write $2(r_{mz} - r_{dz})$ on the board. It invites them to treat it as a calculation rather than a concept.
  2.  **The Equal Environments Assumption (EEA):** Do not debate whether twins share environments equally. It's a methodological critique that distracts from the conceptual definition of $h^2$.
  3.  **Missing Heritability / GWAS Mechanics:** Do not explain SNPs vs. CNVs. If the paper mentions "missing heritability," define it simply as "the gap between twin study estimates and current molecular counts," and move on.
  4.  **Epigenetics Mechanisms:** Do not explain methylation. It leads to "so environment changes genes" confusion. Keep it at "Environment changes *expression*."

  ### Summary of Flow
  1.  **0-10:** Patient asks "Is it genetic?" You say "That question is broken."
  2.  **10-30:** Height Example. $h^2$ is about variance, not cause.
  3.  **30-50:** Change the environment. $h^2$ changes. Therapy works even if $h^2$ is high.
  4.  **50-65:** Two populations. $h^2$ doesn't explain group differences.
  5.  **65-80:** The Denominator Trap (Equal Env & BMI).
  6.  **80-90:** Final Assessment Question + Deflect Treatment Response.
