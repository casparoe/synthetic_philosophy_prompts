      **2. Bayesian Updating Procedures**
      All communication regarding probability assessments must be structured as explicit Bayesian updates. Heuristics, gut feelings, and colloquial qualifiers (e.g., "likely," "dodgy") are banned. You must publish your likelihood ratios. Furthermore, you must ensure your updating process is transparent. If you cannot demonstrate the mathematical derivation of your posterior from the prior and the evidence, your conclusion will be invalidated.

