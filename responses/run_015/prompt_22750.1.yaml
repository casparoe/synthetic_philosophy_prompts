  So I've been going down this rabbit hole about Alan Turing and I keep hitting this weird thing where people mention he had this whole thing going on with ESP, like telepathy and all that, and I honestly don't get why. I mean, this is the guy who cracked the Enigma code, right, the most rigorous, no-nonsense scientist you could probably ever meet, and apparently he spent time doing card-reading experiments and taking psychic stuff seriously?? I read somewhere that in one of his later writings about machine intelligence he even talked about some kind of room that was supposedly "proof against telepathy" or whatever, and I figured, okay, fine, maybe he was just being extra careful as an experimenter, like controlling for a variable so his test would be airtight. But then why does everyone act like this is a big deal or a contradiction in his character? If he was just debunking it or being a stickler for methodology, that seems totally in line with everything else he did. Can someone walk me through what he actually believed about ESP and why it mattered to his ideas about whether machines can think? I feel like I'm missing the actual point and just reading it as him being a quirky guy who wasted time on paranormal nonsense.
