      *   *Why does it matter?* It relates to the definition of "thinking." If telepathy exists, it's a form of information transfer not based on physical sensors. If machines can't do it but humans can, does that distinguish them? Turing's stance was pragmatic: even if ESP exists, we can control for it, so it doesn't invalidate the test.
