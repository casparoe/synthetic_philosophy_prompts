answer: |-
  This is a fascinating problem because it sits right on the fault line between two major schools of ethical thought: **Moral Generalism** (there are underlying principles) and **Moral Particularism** (context determines the weight of every feature).

  Your friend is articulating a version of Moral Particularism (similar to the philosopher Jonathan Dancy). She claims that a feature like "lying" isn't inherently good or bad; its moral valence depends on the holism of the situation. In Case 3, lying is protective; in Case 2, it is malicious. She argues you can't extract a rule because the *reason* lying is wrong in Case 2 isn't present in Case 3.

  However, you are right to suspect that even particularists usually operate with "default" tendencies. Here is the breakdown of what she will likely say, the hidden rules that fit her data, and how to test them.

  ### 1. What will she say about the Dementia Case?

  **Prediction:** She will say it is **Fine**.

  **Reasoning:** Look at her verdicts on vulnerability and capacity.
  *   **Case 7 (Tooth Fairy):** Lying to a child is fine because they lack the capacity to process the truth, and the lie is benign/bonding.
  *   **Case 3 (Torture):** Lying is fine to prevent extreme suffering.
  *   **Case 10 (Contractor):** Deception is fine to protect a vulnerable elder from exploitation.

  In all three, she prioritizes **protection of the vulnerable** over **strict truth-telling** when the recipient cannot fully advocate for themselves or is under threat. In the dementia case, the patient lacks capacity, and the truth causes a "grief loop" (active suffering). Her pattern suggests she weights *current well-being* higher than *abstract truth* for non-competent agents.

  ### 2. The Hidden Rules (That Fit the 10 but Split on the Dementia Case)

  You mentioned you have formulas that fit the ten verdicts. The problem is they all agree on the dementia case (they all likely say "Fine"). To catch her, you need rules that fit the original 10 but **disagree** on the new case.

  Here are two candidate rules that explain her past behavior but diverge here:

  **Rule A: The "Substituted Judgment" Principle (Autonomy-First)**
  *   **The Rule:** You must act as the person *would have acted* if they were competent. If their prior wishes are unknown, default to respecting their autonomy (telling the truth), because truth is the baseline for agency.
  *   **How it fits the 10:**
      *   Cases 4 & 5: Follows explicit wishes (Autonomy).
      *   Case 1 (Surprise): Presumed preference for joy (Autonomy).
      *   Case 2 (Humiliation): Violates presumed preference for safety (Autonomy).
      *   Case 7 (Tooth Fairy): Children lack autonomy; parents act in "best interest" until capacity develops.
  *   **Verdict on Dementia:** **Not Fine.** Most competent adults value truth over comfort. Without an advance directive saying "Lie to me," we must assume she would want the truth. Lying treats her like a child, not an adult.

  **Rule B: The "Benevolent Paternalism" Principle (Welfare-First)**
  *   **The Rule:** Truth is the default, *unless* the recipient lacks the capacity to process it without significant harm. In cases of diminished capacity, minimizing suffering trumps autonomy.
  *   **How it fits the 10:**
      *   Cases 4 & 5: Patient has capacity, so their specific wish (truth or silence) dictates the harm/benefit calculation.
      *   Case 7 & 10: Recipients lack full capacity/protection; benevolence rules.
      *   Case 9 (Ex texting): Partner has capacity; hiding it causes relational harm.
  *   **Verdict on Dementia:** **Fine.** She lacks capacity. The truth causes measurable, repeated harm. Therefore, welfare trumps truth.

  **Why this matters:** Your friend claims she has no rule. But if she says "Fine," she is implicitly following **Rule B**. If she hesitates, she might be sensing the pull of **Rule A**.

  ### 3. Is "It Depends" (Particularism) Real or Evasion?

  **It is a real position, but it is often used as an evasion.**

  *   **The Real Position:** Moral Particularism argues that moral reasons are "holistic." A feature (like lying) can be a reason *for* an action in one context and a reason *against* it in another. There is no "atomic" moral rule that applies everywhere. For your friend, the "wrongness" of lying in Case 2 comes from the *malice*, not the lie itself. In Case 3, the "rightness" comes from the *protection*, not the lie itself.
  *   **The Evasion:** People often use particularism to avoid justifying their intuitions. It allows them to say, "This case is different," without explaining *what* makes it different.

  **How to tell the difference:**
  A real particularist can explain *why* the context changes the valence. An evader just says "it's different."
  *   *Test:* Ask her, "What is the specific feature in the dementia case that makes lying okay, given that we don't have her consent?"
  *   If she says, "The grief loop," she is a **Consequentialist** (Rule B).
  *   If she says, "The lack of capacity," she is a **Paternalist** (Rule B).
  *   If she says, "It just feels kinder," she is likely **Evasing**.

  Given her list, she is likely a **Soft Particularist**. She believes context matters, but she clearly has a hierarchy: **Prevent Harm > Respect Autonomy > Tell Truth.** (Note how Truth is almost always the first thing sacrificed in her "Fine" list).

  ### 4. The Cleanest Test Case

  Your proposed case (the Advance Directive) is excellent. It is the classic "Ulysses Contract" dilemma. It cleanly separates **Prior Autonomy** from **Current Welfare**.

  **Your Proposal:**
  > Two years before dementia, she said: "If I'm ever like that, never lie to me, even about something that will upset me."

  **Why it works:**
  *   **Rule A (Substituted Judgment):** Must tell the truth. She explicitly commanded it.
  *   **Rule B (Benevolent Paternalism):** Might still lie. If the suffering is severe enough, a welfare-first ethicist might argue a competent person cannot consent to their own future misery, or that the "current self" is a different moral patient than the "past self."

  **How to make it cleaner:**
  To really corner her, you need to remove the "suffering" ambiguity. In your current draft, the suffering is "grieving." Some might argue grief is "good" or "necessary."

  **Try this variation:**
  > "Same scenario: She left a written directive: 'If I have dementia, do not lie to me about my sister, even if it upsets me.' However, the staff knows that telling her the truth doesn't just make her sad; it sends her into a catatonic state of panic for four hours every day. Telling the lie keeps her calm and eating."

  **This forces a choice between:**
  1.  **Respecting the Dead Woman's Will** (Truth/Autonomy).
  2.  **Protecting the Living Woman's Body** (Welfare/Health).

  **What her answer reveals:**
  *   If she says **"Tell the Truth"**: She is a Deontologist/Autonomy-Maximalist. She believes promises/rights survive incapacity. (This contradicts her "Tooth Fairy" and "Surprise Party" verdicts slightly, suggesting she values *competent* autonomy above all).
  *   If she says **"Tell the Lie"**: She is a Consequentialist/Welfarist. She believes reducing current suffering overrides past consent. (This confirms Rule B).
  *   If she says **"It Depends"**: Ask her *what* it depends on. If she can't name a variable other than "how bad the panic is," she is a Threshold Deontologist (Rights matter until the cost is too high).

  **Recommendation:**
  Use your Advance Directive idea. It is the strongest lever you have. It forces her to admit whether she values the **person she was** (who demanded truth) or the **person she is** (who needs peace). That is the only split that truly challenges her list without being easily dismissed as "just another detail."

  **One final tip:** If she insists there is no rule, ask her: *"If there is no rule, how do you teach anyone to be good? Do you just show them the list of 10 cases and hope they guess the 11th?"* If morality is learnable, there must be some generalizable principle, even if it's complex. Her refusal to name it is the weak point in her argument.
