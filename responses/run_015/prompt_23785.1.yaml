answer: |-
  You press me wisely, friend, to distinguish between the occurrence of a thought and the existence of a thinker. Yet I beg you to turn your gaze inward once more, not to infer a conclusion from a premise, but to attend to what is given in the very act of doubt itself. When I say "I am, I exist," I do not arrive at this by reasoning that "all thinking requires a thinker" and then adding "there is thinking"; rather, I perceive it by a simple intuition of the mind. In the very moment I am aware of the thinking, I am simultaneously aware that it is *I* who think. The natural light of reason reveals that nothingness cannot act; if there is doubting, understanding, or willing, there must be something that possesses these actions as its attributes. To say "there is thinking" without an "I" is to imagine a mode floating free of any substance, which contradicts the primary notion we have of existence itself.

  Consider the wax: its modes change, yet something remains extended beneath them. So too with my mind. I perceive various modes—doubting, affirming, imagining—but I perceive them not as游离 fragments, but as belonging to a single nature that I call "me." I do not yet know if this "me" is distinct from body—that I must reserve for later inquiry when I have secured the existence of God—but I know certainly that this thinking belongs to *some* thing. Grammar does not smuggle the subject in; rather, grammar follows the metaphysical reality that an accident cannot exist except in a subject. I am that subject, insofar as I am aware of myself thinking.
