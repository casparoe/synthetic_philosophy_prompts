prompt: |-
  I'm running a study-group session for some final-year psych undergrads who've just done a module on introspection but haven't touched philosophy of mind. I want to walk them through illusionism about phenomenal consciousness — the view that phenomenal properties are a kind of representational fiction cooked up by introspective mechanisms, a bit like predictive-processing models that misrepresent their own predictions as direct qualitative feels. Don't explain the theory to me; plan how I should explain it in about forty-five minutes.

  What has to come first so the idea doesn't sound like behaviourism in disguise, which concrete example should carry the whole session (and why not the standard Mary-the-scientist or zombie case, if those aren't the right ones), and which misconceptions they'll definately form — I'm guessing 'illusionism means we don't really experience anything' and 'it's just denying the obvious' — with exactly where in the sequence I should head each one off. I also need to know what I should openly refuse to explain at this level — maybe the metaphysical debates about physicalism vs dualism? — and one check question at the end that shows whether they've understood that phenomenal character is misrepresented rather than denied. Please write in British English, and finish with a single line beginning 'Plan summary: ' followed by a one-sentence summary of your plan.
