answer: |-
  Here is a structured plan for your 45-minute session, designed to leverage the students' background in psychology while navigating the philosophical pitfalls of illusionism.

  ### 1. The Crucial First Step: Distinguishing Illusionism from Behaviourism (0–10 minutes)
  **What must come first:** Before you define illusionism, you must explicitly validate the *reality of the introspective report* while questioning the *accuracy of the introspective model*.
  *   **The Trap:** If you start by saying "qualia don't exist," psychology students will hear "behaviourism" or "eliminativism." They will assume you are denying the data of subjective experience (the 'first-person data' they may have collected in labs).
  *   **The Fix:** Open by affirming that experiential states are real physical processes in the brain. The illusion is not that we *have* states, but that these states possess the intrinsic, non-physical properties our introspection tells us they do.
  *   **Scripting Point:** Make this distinction clear: "Behaviourism says talk of experience is useless; Illusionism says talk of experience is useful but metaphysically misleading." Establish that we are treating introspection as a cognitive mechanism subject to error, much like vision or memory, rather than an infallible oracle.

  ### 2. The Carrying Example: Phantom Limb Pain via Predictive Processing (10–25 minutes)
  **The Example:** Do not use Mary the Colour Scientist or Philosophical Zombies.
  *   **Why not Mary/Zombies:** These thought experiments are designed to *preserve* the intuition that qualia are real and irreducible. They beg the question against illusionism. Mary assumes she lacks something (knowledge of qualia) that she actually has; Zombies assume consciousness can be subtracted while function remains. Both rely on the very intuitions illusionism seeks to dismantle.
  *   **Why Phantom Limb Pain:** This is empirically grounded and fits their predictive processing knowledge.
      *   **The Mechanism:** The brain generates a predictive model of the body (the 'body schema'). When a limb is lost, the model persists.
      *   **The Illusion:** The patient feels pain *in the limb*. The pain experience is real (they are suffering), but the property 'located in the missing limb' is a representational fiction. There is no tissue there to be damaged.
      *   **The Link to Consciousness:** Argue that phenomenal consciousness is like the 'phantom limb' of the mind. The brain creates a simplified user-interface model of its own processing states. We feel 'qualia' (the pain in the limb) because the introspective mechanism misrepresents complex neural activity as simple, intrinsic qualities.
      *   **Activity:** Ask them to map the predictive coding error in phantom pain onto the introspective error in seeing 'redness'. The brain predicts 'red' based on wavelength processing, but represents it as a property of the object/experience rather than a coding scheme.

  ### 3. Head Off Misconceptions (25–35 minutes)
  You must anticipate two specific errors. Do not wait for questions; intervene proactively.

  *   **Misconception 1: 'Illusionism means we don't really experience anything.'**
      *   **Where to head it off:** Immediately after introducing the term 'illusion' in the first section, and reinforce it during the Phantom Limb example.
      *   **Correction:** Emphasise that an illusion *requires* an experience to occur. A hallucination is a real mental event. The illusionist claims the *character* of the experience is misrepresented, not that the event is non-existent. Use the phrase: "The feeling is real; the story the feeling tells us about itself is false."
  *   **Misconception 2: 'It's just denying the obvious.'**
      *   **Where to head it off:** After the Phantom Limb example, before moving to scope limits.
      *   **Correction:** Use the 'Bent Stick' analogy. When a stick is half-submerged in water, it *really looks* bent. It is not 'obvious' that it is straight; the visual system presents a bent stick. Denying the stick is bent is not denying the visual experience; it is correcting the interpretation of the data. Similarly, consciousness *really feels* qualitative, but that doesn't mean it *is* qualitative in the way it feels.

  ### 4. Scope Limits: What to Refuse to Explain (35–40 minutes)
  **The Boundary:** Explicitly refuse to engage with the metaphysical debate between Physicalism and Dualism regarding the 'Hard Problem'.
  *   **Why:** Your students are psychologists, not metaphysicians. Getting bogged down in whether physicalism can 'accommodate' qualia leads to stalemate.
  *   **The Stance:** Tell them: "We are not solving the Hard Problem by fitting qualia into physics; we are dissolving it by showing qualia are cognitive user-illusions." Reframe the Hard Problem as a problem of *introspective modelling*, not ontology. If they ask about the 'ultimate nature of reality', park it. State that illusionism is a hypothesis about cognitive architecture, not a final metaphysical truth claim.

  ### 5. The Check Question (40–45 minutes)
  **The Question:** Pose this multiple-choice question to test if they grasp the 'misrepresentation' vs 'denial' distinction.

  > "When an illusionist claims phenomenal properties are illusory, which statement best captures their position?
  >
  > A) Human beings do not actually have subjective experiences.
  > B) Subjective experiences exist, but introspection misrepresents their physical nature as non-physical qualities.
  > C) Subjective experiences are identical to behavioural dispositions.
  > D) We cannot know whether subjective experiences exist."

  **Correct Answer:** **B**.
  **Debrief:** If they choose A, they have reverted to behaviourism/eliminativism. If they choose C, they have misunderstood the functionalist aspect. B confirms they understand that the *state* is real, but the *introspective representation* is non-veridical.

  Plan summary: This session plan prioritises distinguishing illusionism from behaviourism upfront, uses phantom limb pain as a mechanistic analogue for qualia, proactively corrects nihilistic misconceptions, brackets metaphysical debates, and verifies understanding via a targeted check question.
