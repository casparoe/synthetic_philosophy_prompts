  # Memorandum of Understanding: The Ethics of Time Discounting

  **Date:** October 26, 2023
  **Parties:** "Team Zero" (No Pure Time Preference) & "Team Positive" (Some Pure Time Preference)
  **Subject:** Adversarial Collaboration on Intertemporal Valuation

  ## Preamble
  We acknowledge that the question of how to value future wellbeing is one of the most consequential in ethics and economics. It determines policy on climate change, nuclear waste, infrastructure, and existential risk. We agree that confusion often arises from conflating distinct concepts. This document outlines our shared premises, isolates our genuine disagreements, and proposes empirical/thought-experimental cruxes to resolve them.

  ---

  ## Part 1: Agreed Claims (Common Ground)

  Before debating where we disagree, we affirm the following definitions and distinctions. We both sign onto these propositions:

  1.  **Distinction Between Descriptive and Normative:** We agree there is a difference between *describing* how humans actually behave (psychological discounting) and *prescribing* how rational or moral agents ought to behave (normative discounting). This debate is about the latter.
  2.  **Distinction Between Pure and Instrumental Discounting:** We agree that "discounting the future" can happen for two different reasons:
      *   **Instrumental Reasons:** The future is uncertain (the recipient might not exist), or resources invested now might grow (opportunity cost), or future people might be richer (diminishing marginal utility of consumption).
      *   **Pure Time Preference:** Valuing a good less *solely* because it occurs later in time, holding probability, wealth, and utility constant.
      *   **Agreement:** This debate concerns **Pure Time Preference** only. We set aside risk, economic growth, and probability.
  3.  **Distinction Between Personal and Social:** We agree that an individual might have personal reasons to prioritize their own near-future (e.g., planning a vacation) that differ from the obligations of a government or moral agent acting on behalf of humanity across centuries. However, we disagree on whether *any* agent, personal or social, is justified in applying a pure time discount.
  4.  **The "Ceteris Paribus" Condition:** In all test cases below, we assume:
      *   Zero uncertainty (the future outcome is guaranteed).
      *   Zero economic growth/interest rates (no opportunity cost of capital).
      *   Identical recipients (same capacity for wellbeing).
      *   No memory decay or change in personal identity.

  ---

  ## Part 2: Statement of Disagreement

  We disagree on the following specific claims. We have phrased these to ensure both sides feel their view is represented charitably.

  | Feature | Team Zero (User) Position | Team Positive (Roommate) Position |
  | :--- | :--- | :--- |
  | **1. Moral Relevance of Time** | Time is morally neutral. Valuing a wellbeing unit less because it occurs in 2200 rather than 2024 is as irrational as valuing it less because it occurs in London rather than New York. | Time is morally relevant. The "present" has a privileged ontological or agential status. It is rational to weight the near-term more heavily simply because it is near. |
  | **2. Rationality of Impatience** | Pure impatience is a cognitive bias (like present bias). A fully rational agent should be "temporally neutral." | Pure impatience is a feature of rational agency. Preferring a good sooner is intrinsic to what it means to be an agent embedded in time, not a bug to be corrected. |
  | **3. The Social Discount Rate** | For long-term policy (e.g., climate), the pure time discount rate should be effectively **0%**. Future generations count equally with current ones. | For long-term policy, the pure time discount rate should be **>0%**. It is permissible for current policy to prioritize current/near-future citizens over distant ones, even controlling for risk. |
  | **4. Compensation Threshold** | To defer a good, we require only a tiny marginal increase in value (e.g., 10 units now vs. 10.01 units later). | To defer a good, we require a significant premium. The further away the good, the higher the "interest rate" required to make waiting rational. |

  ---

  ## Part 3: Cruxes and Test Cases

  We identify three specific "cruxes." If we could resolve these, the broader argument would dissolve. For each crux, we propose a concrete, controlled test case. We state in advance what choice each side predicts is the correct one.

  ### Crux 1: The "Tuesday" Analogy (Spatial vs. Temporal Neutrality)
  **The Question:** Is "when" morally analogous to "where"? If you wouldn't discount a life saved in a different country, why discount a life saved in a different century?

  **Test Case: The Charity Guarantee**
  *   **Scenario:** A charity can guarantee one of two outcomes. There is zero risk of the charity failing, zero inflation, and the recipients have identical capacity for happiness.
      *   **Option A:** Save 10 Quality-Adjusted Life Years (QALYs) for a person living **today**.
      *   **Option B:** Save 12 QALYs for a person living **150 years from now**.
  *   **Team Zero Prediction:** **Choose Option B.** 12 > 10. The date is irrelevant. To choose A is to discriminate against future people based on birthdate.
  *   **Team Positive Prediction:** **Choose Option A.** The "cost" of waiting 150 years is high enough that a 20% increase (10 vs 12) does not compensate for the temporal distance. We would only choose B if the future benefit were significantly larger (e.g., 50 QALYs).

  ### Crux 2: The Nature of Rational Prudence (Self-Interest Over Time)
  **The Question:** Is it rational for a single individual to prefer a smaller good now over a larger good later for *themselves*, assuming they know they will exist and enjoy it equally?

  **Test Case: The Painful Procedure**
  *   **Scenario:** You must undergo a medical procedure. It causes exactly 1 hour of moderate pain. You will definitely be alive and mentally unchanged at both time points.
      *   **Option A:** Undergo the procedure **today**.
      *   **Option B:** Undergo the procedure **20 years from today**.
      *   **Option C:** Undergo the procedure **100 years from today** (assuming life extension tech guarantees you exist).
  *   **Team Zero Prediction:** **Indifference.** Since the total pain in your life is identical (1 hour), a rational agent should be indifferent between A, B, and C. Preferring A is an irrational "time bias."
  *   **Team Positive Prediction:** **Strong Preference for A (or B over C).** It is rational to "get it over with" or to push pain into the distant future. The "distance" of the pain makes it less bad *now*. The disutility of pain is discounted by temporal distance.

  ### Crux 3: The "Slope" of the Discount Curve
  **The Question:** Does the discount rate stay constant, or does it drop to zero at extreme distances? (i.e., Do we care *nothing* about the very far future, or just *less*?)

  **Test Case: The Extinction Button**
  *   **Scenario:** You can press a button that affects humanity's lifespan. There are no people alive after the cutoff date.
      *   **Option A:** Humanity goes extinct in **200 years**. (Trillions of lives lost after that point).
      *   **Option B:** Humanity goes extinct in **10,000 years**. (Vastly more lives lived).
      *   **Cost:** Pressing Option B costs the current generation $1 trillion in consumption (reduced welfare now).
  *   **Team Zero Prediction:** **Press Option B.** The sum of trillions of future lives vastly outweighs the current consumption cost, because the discount rate is ~0%. The loss of potential lives is a catastrophe regardless of when it happens.
  *   **Team Positive Prediction:** **Likely Option A (or much higher threshold).** If the discount rate is positive (e.g., 1% or 2%), the value of lives 5,000 years from now is mathematically negligible today. Spending $1 trillion now to save people 50 centuries away is irrational resource allocation.

  ---

  ## Next Steps for Collaboration

  1.  **Review:** Both parties review this document to ensure their position is not strawmanned in Part 2.
  2.  **Selection:** We select **Crux 1 (The Charity Guarantee)** as our primary battleground, as it isolates pure time preference most cleanly without involving personal pain or existential scale.
  3.  **Argument Mapping:** We will each write a 500-word max argument for why our prediction in Crux 1 is the morally correct one, focusing *only* on the time element, not risk or growth.
  4.  **Steel-manning:** We will swap arguments and attempt to improve the other person's argument before critiquing it.

  **Signed,**

  _________________________ (Team Zero)

  _________________________ (Team Positive)
