      *   Need to distinguish *pure* time preference (just because it's later) vs. *instrumental* discounting (risk, growth, opportunity cost).
      *   Need to distinguish *personal* ethics vs. *social/policy* ethics.
      *   *Agreement:* Both likely agree that risk matters. Both likely agree that wealth growth matters (diminishing marginal utility). Both agree the distinction between "uncertainty" and "time" is crucial.

  4.  **Drafting Part 2: Disagreements:**
      *   Need to phrase these neutrally.
