      *   **Task:** Stress-test this view. Don't just list objections. Take a stand. Rank defeaters (fatal to awkward). Identify which concessions defenders should make. Determine if the theory is unfalsifiable. Analyze specific cases (Dunkirk, Masada). Commit to whether the structural claim survives.
