      *   *Operation:* Splitting ideal from violence/outcome.
      *   *Claim:* Structural danger (inherent to the form, not the specific ideology).
      *   *Examples:* Confederacy (racist slavery), Masada (Jewish zealots), Kosovo (Serbian nationalism), Dunkirk (British resilience).

  3.  **Brainstorming Defeaters/Objections:**
