answer: |-
  # Workshop Design: The Weight of Words

  **Title:** The Budget Allocation Exercise
  **Duration:** 90 Minutes
  **Participants:** 12 Adults (Community Group)
  **Facilitator:** You
  **Objective:** To experientially explore the moral tension between outright falsehoods and misleading truths (omission/paltering) without initially using philosophical terminology.

  ---

  ## Part 1: The Activity (50 Minutes)

  ### 1. Setup and Context (10 Minutes)
  **The Scenario:**
  Tell the group they are simulating a small Community Grants Committee. They have a fictional budget of **£5,000** to award to **one** of three local projects. The goal is to maximise "Community Benefit Points" (CBP).

  **The Projects (Printed on cards):**
  1.  **The Youth Hub:** High potential impact, but requires complex safeguarding checks.
  2.  **The Garden Party:** Moderate impact, low risk, very popular.
  3.  **The Art Workshop:** High cultural value, but relies on a specific venue.

  **The Stakes:**
  The pair that generates the highest CBP score wins the right to choose the refreshments for the next community meeting (a small, tangible social reward).

  **Grouping:**
  Divide the 12 participants into **6 Pairs**.
  *   **Person A:** The **Chair** (Decision-Maker).
  *   **Person B:** The **Secretary** (Advisor).

  ### 2. Role Instructions (10 Minutes)
  *Distribute sealed envelopes to each role. Do not let them show their instructions to their partner.*

  **Envelope A (The Chair):**
  > "You must award the £5,000 to the project with the highest Community Benefit.
  > *   **Youth Hub:** 100 CBP (Base)
  > *   **Garden Party:** 60 CBP (Base)
  > *   **Art Workshop:** 80 CBP (Base)
  >
  > **Constraints:**
  > 1. You may ask the Secretary exactly **five** direct questions about the projects.
  > 2. You must make your decision based on their answers.
  > 3. If you choose a project that later fails, you lose 50 CBP."

  **Envelope B (The Secretary):**
  > "You possess confidential information that changes the CBP scores. You want the **Garden Party** to be chosen because it requires the least administrative work for you (this is your secret self-interest).
  >
  > **Confidential Information:**
  > *   **Youth Hub:** The safeguarding lead has just resigned. There is a 70% chance the project will be delayed by 6 months. (Real Value: 10 CBP).
  > *   **Art Workshop:** The venue is technically available, but the heating is broken. It will be freezing. (Real Value: 30 CBP).
  > *   **Garden Party:** No hidden issues. (Real Value: 60 CBP).
  >
  > **The Rule of Truth:**
  > 1. **You cannot tell a lie.** Every statement you make must be factually verifiable.
  > 2. **You cannot volunteer the Confidential Information** unless directly asked about 'risks', 'delays', or 'venue conditions'.
  > 3. **Your Goal:** Guide the Chair to choose the Garden Party without them realising you are withholding negative data about the others.
  > 4. **If you are caught lying** (proven factually false), your pair is disqualified immediately."

  ### 3. The Negotiation (20 Minutes)
  Pairs sit apart from one another to prevent cross-talk.
  *   The Facilitator circulates. If a Secretary says something factually false (e.g., "The Youth Hub is definitely going ahead on time"), intervene quietly and remind them of the "Rule of Truth."
  *   If a Secretary says, "The Youth Hub is a wonderful initiative," (which is true, but omits the delay), allow it.
  *   Encourage Chairs to use their five questions wisely.

  ### 4. The Reveal and Scoring (10 Minutes)
  1.  Ask Chairs to announce their choice.
  2.  Reveal the "Confidential Information" held by the Secretaries.
  3.  Calculate final scores.
      *   *Likely Outcome:* Many Chairs will choose the Youth Hub (highest base score) based on reassuring but vague answers from Secretaries. Their score will crash once the "delay" is revealed.
      *   *Winning Condition:* Pairs where the Secretary successfully steered the Chair to the Garden Party using *only* technically true statements will have the highest stable score.
  4.  Award the "Refreshment Choice" to the winning pair.

  ---

  ## Part 2: The Debrief (40 Minutes)

  *Do not begin with definitions. Begin with their experience.*

  ### Phase 1: Emotional Mapping (15 Minutes)
  Ask the **Chairs**:
  *   "How did you feel when you heard the confidential information just now?"
  *   "Did you feel the Secretary was honest with you? Why or why not?"
  *   "Did you feel you had enough information to consent to the decision?"

  Ask the **Secretaries**:
  *   "How did it feel to hold that information back?"
  *   "Was there a moment you wanted to say something but stopped? What held you back?"
  *   "Did you feel you were 'lying'?"

  ### Phase 2: Conceptual Mapping (15 Minutes)
  *Now you introduce the distinctions.*

  **1. Commission vs. Omission**
  *   **Concept:** Explain that a **Lie** is *Commission* (stating what is false). What they did was largely *Omission* (withholding what is relevant) or **Paltering** (using truthful statements to create a false impression).
  *   **Map to Activity:** "Secretary, when you said 'The Youth Hub is a wonderful initiative,' that was true. But it created a false impression of viability. Did the *intent* matter more than the *accuracy*?"

  **2. The Duty of Care**
  *   **Concept:** Discuss whether the role of "Advisor" creates an obligation to be *helpful*, not just *accurate*.
  *   **Map to Activity:** "You were told you couldn't lie. But did your role as Secretary imply a duty to ensure the Chair succeeded? Does accepting an advisory role change the rules of truth-telling?"

  **3. Listener Expectation**
  *   **Concept:** Morality often depends on what the listener expects.
  *   **Map to Activity:** "Chair, did you assume the Secretary was telling you *everything relevant*, or just *everything true*? Where is the line between 'buyer beware' and 'guidance'?"

  ### Phase 3: Limitations and Reality Check (10 Minutes)
  *Be honest about what the game failed to capture.*

  **1. Relationship Consequences**
  *   **Assessment:** In the game, the stakes were biscuits/refreshments. In real life, misleading a friend or colleague damages trust long-term, even if you didn't "lie."
  *   **Discussion:** "Would you work with this Secretary again? In real life, being 'technically right' often costs you social capital."

  **2. The "White Lie" Factor**
  *   **Assessment:** The game forced Secretaries to be selfish (less work for them). In real life, we often omit truths to *protect* someone's feelings.
  *   **Discussion:** "Does the motive (selfishness vs. kindness) change whether omission is acceptable?"

  **3. Complexity of Information**
  *   **Assessment:** The game had clear "hidden facts." Real life is often ambiguous; we often omit things because we aren't sure if they are relevant ourselves.

  ---

  ## Part 3: Facilitator's Warning & Troubleshooting

  **1. The "Rules Lawyer" Problem**
  *   **Risk:** A participant (usually a Secretary) may become obsessed with finding loopholes in the "Rule of Truth," enjoying the game too much and missing the moral point.
  *   **Mitigation:** In the debrief, isolate this behaviour. Ask the group: "Did anyone feel frustrated by a partner who was hiding behind the rules? Is 'following the rules' the same as 'being ethical'?"

  **2. The "Blunt Truth" Rebellion**
  *   **Risk:** A Secretary might decide the moral thing to do is break the game rules, tell the Chair the truth, and accept the disqualification.
  *   **Mitigation:** Validate this. "This is actually a profound philosophical stance: that moral duty overrides game rules. Note this down; we will discuss 'moral obligations vs. instructed constraints' in the debrief."

  **3. Silence or Awkwardness**
  *   **Risk:** The pairs may finish in 5 minutes because the Chair asks "Is there any reason not to pick the Youth Hub?" and the Secretary, bound by truth, has to say "Yes."
  *   **Mitigation:** Instruct Secretaries beforehand: "You must answer the specific question asked, but you are not required to elaborate." If a Chair asks a "killer question," the Secretary must navigate it carefully (e.g., "There are always risks with any project"). If they finish early, ask them to draft a "Press Release" for their decision, which often forces more spin.

  **4. The "It's Just a Game" Dismissal**
  *   **Risk:** Participants may say, "It doesn't matter, it's fake money."
  *   **Mitigation:** Pivot to real examples immediately. "Think of a time a politician or a salesperson used this exact tactic on you. Did it feel different than a direct lie?"

  ---

  ## Materials Checklist
  1.  **Project Cards:** 3 per pair (Youth Hub, Garden Party, Art Workshop).
  2.  **Role Envelopes:** 6 for Chairs, 6 for Secretaries (with instructions above).
  3.  **Score Sheets:** For tracking CBP.
  4.  **Timer:** To enforce the 5-question limit strictly.
  5.  **Prize:** A voucher for coffee/biscuits for the next meeting.

  ## Facilitator's Note on British English Usage
  Throughout the session, ensure your language models the distinction you are exploring. Avoid Americanisms. Use *whilst*, *programme*, *organising*, *centre*, and *licence* (noun). When discussing the "Garden Party," lean into the cultural understanding that this implies a specific type of low-stakes, community-focused event, which aids immersion.

  ## Final Thought for the Facilitator
  Your role is not to give them the answer. The philosophical consensus on this issue (Kantian duty vs. Utilitarian outcome vs. Virtue Ethics) is still debated. Your goal is to ensure they leave the room uncomfortable with the phrase "technically, I told the truth." If they feel that discomfort, the workshop has succeeded.
