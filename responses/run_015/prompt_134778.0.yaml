          *   *Logic:* First, establish what counts as *answering a "Why?" question*. Then introduce Covering-Law as the *demand* for necessity. *Then* introduce Narrative as a competing structure of necessity, not just aesthetics.
          *   *Key Distinction:* "Connection" vs. "Subsumption." If you don't distinguish these early, narrative looks like just "filling in the gaps" between laws.

      *   **Section 2: The Historical Case:**
          *   *Option A: Fall of Rome.* Too messy? Too many causes? Often treated as decline/decay (narrative heavy).
