answer: |-
  ### Session Plan: The Structure of Historical Explanation (90 Minutes)

  #### I. Dependency Order: Conceptual Scaffolding
  **Do not begin by defining the two models.** If you define "Narrative" first, the literary scholars will claim it as their native territory and dismiss Covering-Law as alien. If you define "Covering-Law" first, they will dismiss it as impossible. You must build a shared problem space first.

  1.  **First Distinction (Minute 0–10): "Description" vs. "Explanation."**
      *   **Tool:** Establish that *Explanation* requires answering a specific "Why?" question that rules out alternatives.
      *   **Why:** You must secure agreement that history aims to do more than chronicle (description). Both models claim to explain; they disagree on *how* explanation works.
      *   **Risk:** If you skip this, Narrative collapses into "storytelling" (aesthetic) and Covering-Law collapses into "science" (methodological). They become styles rather than logical structures.

  2.  **Second Distinction (Minute 10–30): "Subsumption" vs. "Configuration."**
      *   **Tool:** Introduce Covering-Law *only* as a demand for **necessity**. (i.e., "To explain X, we must show X *had* to happen given Y.")
      *   **Why:** This prevents the audience from treating Covering-Law as "prediction." It is about *retroactive necessity*.
      *   **Risk:** If you introduce Narrative before this distinction is solid, the audience will treat Narrative as simply "filling in the gaps" between laws, rather than a competing source of necessity.

  3.  **Third Distinction (Minute 30–50): "Universality" vs. "Specific Coherence."**
      *   **Tool:** Now introduce Narrative not as "storytelling" but as **configuring causal density**.
      *   **Why:** This allows you to pivot to the non-obvious framing (Counterfactual Stability) later. Narrative is not "what happened"; it is "how these specific things locked together."

  #### II. The Historical Case: Selection and Justification
  **Choice:** **The British Industrial Revolution (specifically the mechanization of textiles, 1760–1800).**
  **Reject:** The Fall of the Western Roman Empire.

  *   **Why Rome Fails:** The timeframe is too diffuse (centuries), and the "outcome" (transformation vs. collapse) is too contested. It invites *only* narrative explanation. The Covering-Law model cannot get a foothold, so the debate becomes a strawman fight where Narrative wins by default.
  *   **Why Industrial Revolution Works:** It possesses **quantifiable variables that invite generalization** (e.g., high wage/low energy cost ratios) alongside **contextual specificity that resists subsumption** (e.g., British patent law, specific colonial markets).
  *   **Required Feature:** **Contingent Convergence.** The case must allow us to ask: "Was this outcome the result of a universal economic pressure (Law), or the specific locking-together of independent factors (Narrative)?"
      *   *Teaching Instruction:* Present the "Allen Hypothesis" (high wages + cheap coal = innovation) as the Covering-Law candidate. Present the "Institutional/Cultural Context" (property rights, specific inventor networks) as the Narrative candidate. Force the group to decide if the economic variables *alone* explain it, or if the specific context is the explanatory engine.

  #### III. Mapping Misconceptions & Interception Points
  **Audience:** Literary Scholars (prone to subjectivism) + Sociologist (prone to generalization).

  | Misconception | Predictable Argument | Interception Point | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"Narrative = Subjective Interpretation"** | "Narrative is just how the historian chooses to tell the story; it's art, not logic." | **Minute 35** (Intro to Narrative Model) | **Reframe:** Do not use the word "story." Use "Causal Configuration." Assert that a narrative explanation is *false* if the sequence is empirically wrong, regardless of how well-written it is. It is accountable to evidence, not aesthetic pleasure. |
  | **"Covering-Law = Predicting the Past"** | "Historians can't predict the future, so laws are useless for history." | **Minute 15** (Intro to Covering-Law) | **Reframe:** Explicitly state: "We are not forecasting. We are establishing *retrodictive necessity*." The law explains why the event was *to be expected* given the conditions, not that someone actually expected it. |
  | **"Objectivity = Scientific Neutrality"** | "If narrative isn't law-based, it's just opinion." | **Minute 65** (Synthesis) | **Reframe:** Objectivity is **intersubjective accountability**. A narrative is objective if other historians cannot alter the causal links without breaking the explanation. |

  #### IV. The Comprehension Check (Minute 75)
  **Format:** Two-minute silent writing prompt.
  **Prompt:** "Identify one event in the Industrial Revolution case that acts as a 'load-bearing beam.' If you remove this event from the explanation, does the outcome still make sense? Explain why this beam is necessary *without* citing a universal economic law."

  *   **Success Criteria:** Look for answers that identify a specific contextual link (e.g., "The specific enforcement of patent laws in 1770") and argue that removing it breaks the causal chain *in this specific instance*, even if it wouldn't break it in another country. This proves they understand narrative necessity without law-subsumption.
  *   **Failure Criteria:** Answers that say "It's necessary because it happened" (tautology) or "It's necessary because high wages always cause innovation" (reverting to Covering-Law).

  #### V. Scope Refusals (Explicit Boundaries)
  **State these outright at Minute 5 to manage expectations:**
  1.  **Refuse the D-N / I-S Distinction:** Do not explain Hempel's Deductive-Nomological vs. Inductive-Statistical models. It is technical logic-chopping that distracts from the core philosophical tension. Treat Covering-Law as a single "demand for generalization."
  2.  **Refuse Logical Positivist Origins:** Do not discuss the Vienna Circle or verificationism. The *viability* of the model matters for historians, not its genealogical roots in 1930s physics-envy.
  3.  **Refuse "Rational Action" as a Third Category:** Do not introduce W.B. Gallie or William Dray's "Rational Explanation" as a separate third option. Subsume it under Narrative for this session to avoid tripartite confusion.

  #### VI. The Non-Obvious Framing: Counterfactual Stability
  **Placement:** Minute 60–75 (Synthesis Phase).
  **Concept:** Treat Narrative Explanation as relying on **Counterfactual Stability Conditions**.

  *   **Instruction:** Tell the group: "We often think Laws provide necessity ('If A, then always B') and Narrative provides sequence ('A, then B'). This is wrong. Narrative provides necessity through **stability**."
  *   **The Move:** Ask the group to test the Narrative explanation by asking: "If we tweak this specific detail slightly, does the explanation collapse?"
      *   *Example:* If we change the British patent law slightly, does the Industrial Revolution still happen? If the answer is "No," the narrative has **modal rigor**.
  *   **The Payoff:** This shows that Narrative is not "soft." It carries its own form of strictness. It argues that *given this specific configuration of the world*, the outcome was stable. It achieves explanatory power not by appealing to *all possible worlds* (Laws), but by proving the outcome was robust in *this specific world* against minor variations.
  *   **Why this works for this group:** It gives the literary scholars a way to talk about "necessity" without surrendering to sociology, and it gives the sociologist a way to respect "context" without calling it anecdotal. It transforms Narrative from "description" to "modal testing."
