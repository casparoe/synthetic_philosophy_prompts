      *   **Constraint 2 (Structure):** Lead with the bottom line (reject, accept, or indeterminate).
      *   **Constraint 3 (Structure):** Pinpoint the precise conceptual crux (e.g., individuation of harms/benefits across diachronic life).
      *   **Constraint 4 (Format):** One paragraph.
      *   **Constraint 5 (Length):** No more than 180 words.
      *   **Tone:** Precise philosophical prose.

