      *   Core tenet: Suffering/craving is bad. Absence of suffering/craving is good (or neutral, but often framed as the only good). Positive pleasure is neutral.
      *   The Problem: If absence is good, does creating a being to experience absence (after relieving a created craving) generate net value?
      *   The "Proleptic Absence" Scenario: Create being -> Induce mild craving -> Satisfy it -> Return to absence.
      *   Tension: Is the initial craving a harm that outweighs the subsequent absence? Or is the absence a benefit that justifies the craving? If absence is only good *relative* to a subject who exists, does bringing the subject into existence count as a benefit? Tranquilism usually avoids asymmetry problems by saying non-existence isn't bad, but existence with craving is bad.
      *   The Crux: Diachronic individuation. Can you net off a temporal harm against a temporal benefit within the same life if the benefit is merely a return to baseline non-craving?

