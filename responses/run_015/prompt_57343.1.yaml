          *   *Analysis:* Kwesi tries to save the theory by shifting the burden to the community. Sister points out the contingency this introduces.
          *   *Verdict:* Sister wins this logical point. Contingent personhood is inherently unstable.

      *   **Move 3: Kwesi's Distinction (Abandonment vs. Capacity).**
          *   *Claim:* You don't lose standing by being abandoned because abandonment is done *to* you (victimhood doesn't reduce status).
          *   *Sister's Counter:* Contradiction. Either relationships do the work or the individual does. If relationships do the work, a isolated person has less of it.
          *   *Analysis:* Kwesi is trying to distinguish between *capacity to relate* and *actual relation*. Sister argues that if the definition is relational, the *actual* relation matters more than the *capacity*.
