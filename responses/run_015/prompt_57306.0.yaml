      *   If Key is Truth (1/3), and Engine rewards 1/2, the App is broken for training.
      *   If Key is Bid (1/2), the App works, but "Truth" is relative to Engine.
      *   Given "Calibration App," Calibration requires Report = Key. If Engine forces Report=1/2, Key must be 1/2 to allow Calibration.
      *   So **Key = 1/2** is the only way to preserve the app's function as a *calibration* tool.
      *   This is the winning argument.

