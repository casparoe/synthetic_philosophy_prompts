          *   *Resolution:* *Lamp* was fixed to align Protocol with Key. *Two Doors* was not fixed because the Protocol *was* the research variable (self-location).
      *   **Section 2: Ledger Analysis.**
          *   Ledger changes the *scoring weight*, not the *information*.
          *   Under Old Engine, Tails was weighted 2x. Under New Engine, Tails is weighted 1x (per session).
          *   This makes Ledger mathematically isomorphic to Prelude (Session-based scoring).
          *   Closest Analog: *Prelude* (same session-based scoring logic) > *Two Doors* (same protocol, different scoring).
      *   **Section 3: Recommendation.**
          *   **Key: 1/2.**
          *   **Rationale:** The Key defines the "Truth" for the scoring rule. Since the scoring rule now aggregates by Session (like *Prelude*) rather than Awakening (like *Two Doors*), the Truth condition shifts from "Probability of Heads given Awakening" (1/3) to "Probability of Heads given Session" (1/2).
