          *   If the agent knows the engine averages, her belief about the *coin* is still 1/2 (Halfer), but her belief about *which report matters* changes.
          *   Actually, the Quadratic Scoring Rule is proper. You report your true credence to maximize score.
          *   If the engine averages two reports $r_1, r_2$ and scores $S(\text{avg}(r), \text{key})$, and I know $r_1 = r_2$ (because memory wipe makes me the same agent state), then I report $r$. The score is $S(r, \text{key})$.
          *   If the key is 1/3, I should report 1/3. If the key is 1/2, I should report 1/2.
          *   The Engineer says optimal report is 1/2. This implies the *math* of the new engine makes 1/2 the winner against a 1/2 key? Or does it mean 1/2 is the winner against *any* key? No, proper scoring rules always incentivize truth.
          *   Engineer says: "report maximizing expected points is... 1/2 under both new settings." This implies the *Key* should be 1/2 for the report to be "correct."
          *   If we key it 1/3, and the user reports 1/2 (optimal for the engine logic?), they lose points.
          *   Wait, if the scoring rule is quadratic, $S(p, o) = 1 - (p-o)^2$. You maximize expected score by reporting $p = E[o]$.
          *   So the Key *is* the Target $o$.
          *   The Engineer is saying: "Given the coin bias and the protocol, the Expected Value of the Outcome is 1/2 under the new engine."
          *   Why? Because under the old engine, the "Outcome" was weighted by awakenings (1 H, 2 T). Under the new engine, the "Outcome" is weighted by Session (1 H, 1 T).
          *   Therefore, the **Target** has changed. The Key must change to 1/2.
          *   This supports Member B.

  6.  **Drafting the Memo:**

      *   **Header:** To Standards Committee, From [Me], Re: Ledger Recommendation.
      *   **Section 1: The Record & Candidate Rules.**
          *   Define Rule E (Epistemic/Objective) vs. Rule P (Pragmatic/Scoring-Relative).
