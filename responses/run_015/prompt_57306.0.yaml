  **MEMORANDUM**

  **TO:** Standards Committee, Judgment Lab
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for **Ledger** Vignette Keying and Protocol Freeze

  ### 1. Candidate Rules and Record Reconciliation

  To resolve the split on **Ledger**, we must first formalize the principles underlying our existing keys. Based on the minutes for **Lamp**, **Two Doors**, **Prelude**, and **Told First**, two candidate rules emerge:

  *   **Rule E (Epistemic/Objective):** The key represents the rational credence the agent should hold regarding the coin state, independent of the scoring frequency. The protocol must be adjusted to ensure the scoring rule rewards this credence.
  *   **Rule P (Pragmatic/Scoring-Relative):** The key represents the report that maximizes expected points under the specific scoring engine. The key tracks the "unit of scoring" (e.g., per awakening vs. per session).

  **Reconciliation of the Record:**

  | Vignette | Key | Rule E Fit | Rule P Fit | Analysis |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lamp** | 1/2 | **Yes** (Coin bias) | **No** (Optimal report was 1/4) | The Committee initially prioritized Rule E. When the protocol (3 prompts) conflicted with the Key, we *fixed the protocol* to match the Key. This establishes that Keys should not be distorted to fit broken scoring, *unless* the scoring defines the unit of truth. |
  | **Two Doors** | 1/3 | **Yes** (Self-locating credence) | **Yes** (Maximizes score per awakening) | Here, the "unit of scoring" (awakening) aligns with the "unit of belief" (self-location). Both rules yield 1/3. The Chair's minute ("expect to be one of the twice-asked") supports Rule P's focus on the scoring unit, but the value is also epistemically defensible (Thirder position). |
  | **Prelude** | 1/2 | **Yes** (Prior credence) | **Yes** (Session-based scoring) | Memory intact means no self-locating uncertainty. Scoring is per session. Both rules yield 1/2. |
  | **Told First** | 1/2 | **Yes** (Conditional on "First") | **Yes** (Updates belief) | New information collapses the self-locating uncertainty. Both rules yield 1/2. |

  **The Conflict:**
  **Rule E** and **Rule P** have been indistinguishable in our record until now because our protocols usually aligned the "unit of belief" with the "unit of scoring." **Ledger** breaks this alignment. The protocol (memory wipe) suggests a self-locating belief (1/3), but the new engine (averaging/final report) changes the "unit of scoring" to the *session* (1/2).

  **The Lamp Precedent:**
  In **Lamp**, when the scoring frequency (3:1) conflicted with the objective key (1/2), we rejected changing the key to 1/4. We instead patched the vignette. Member B argues this was an error; I argue it was a commitment to **Rule E**: the Key defines the truth, and the app must be built to measure it. However, in **Two Doors**, the "truth" *is* the self-locating frequency.

  **Closest Analog:**
  **Ledger** is structurally **Two Doors**, but functionally **Prelude**.
  *   Like **Two Doors**, the agent suffers memory erasure.
  *   Like **Prelude**, the *consequences* of the report are aggregated to the session level.
  *   Because the scoring engine determines what constitutes a "correct" calibration event, **Prelude** is the functional analog. If the app scores the *session*, the key must reflect the probability of the coin *per session*, not per awakening.

  ### 2. Recommendation for Ledger

  **Recommendation:** Key **Ledger** at **1/2**.

  **Rationale:**
  We should adopt a **Unified Scoring-Unit Principle**: *The key must reflect the rational credence relative to the unit of scoring.*
  *   In **Two Doors**, the engine scored every awakening. The unit of scoring was the *awakening*. The rational credence per awakening is 1/3. Key = 1/3.
  *   In **Ledger**, the engine scores the *session* (by averaging or discarding). The unit of scoring is the *session*. The rational credence per session is 1/2. Key = 1/2.

  This recommendation bridges the split:
  *   **For Member A (Epistemic):** We are not changing the key to fit a broken engine; we are acknowledging that the *definition of the event being calibrated* has changed from "Awakening" to "Session." The agent's belief about the *Session Outcome* is 1/2.
  *   **For Member B (Pragmatic):** We maintain consistency with **Prelude** and ensure users are not penalized for reporting the score-maximizing number.

  **Impact on Precedents:**
  1.  **Two Doors Minute:** The Chair's minute ("expect to be one of the twice-asked") remains valid but requires a footnote: *"...when scored per awakening."* We do not rewrite the key, but we clarify that the key is engine-relative.
  2.  **Lamp Petition:** The rejected petition (to key 1/4) is retrospectively validated *for that specific engine*, but our decision to patch the vignette instead is affirmed as the preferable path when the scoring unit is unintentional. In **Ledger**, the scoring unit change is intentional (mobile optimization), so we adapt the key.
  3.  **Data Interpretability:** We must tag all dataset entries with `engine_version`. Comparing **Two Doors** (1/3) and **Ledger** (1/2) data without this tag would be erroneous, as they measure calibration against different units (awakening vs. session).

  ### 3. Principles Adopted

  By keying **Ledger** at 1/2, the Committee adopts the principle that **Calibration is Relative to the Scoring Contract.**
  *   **If we key 1/3 (Member A's view):** We assert that "Truth" is invariant to the scoring mechanism. *Consequence:* The app becomes a "trick" test where clinical residents are punished for reporting the statistically optimal number. We preserve data homogeneity but sacrifice training utility.
  *   **If we key 1/2 (My view):** We assert that "Truth" is defined by the event that triggers the reward. *Consequence:* We preserve the app's utility as a training tool. We accept heterogeneity in the research dataset (1/3 vs 1/2) as a feature reflecting different decision-weights, managed via metadata tagging.

  ### 4. Tie-Breaking Pilot Vignette

  To solidify this principle before the next major release, I propose piloting **"The Random Audit."**

  **Protocol:**
  *   Identical to **Two Doors** (Coin: H=1 question, T=2 questions with wipe).
  *   **Engine:** The system records both reports but randomly selects *one* to score (50% chance of scoring the first, 50% chance of scoring the second). If Heads, the single report is scored.

  **The Test:**
  *   **Rule E (Awakening-Centric):** The agent is still an awakening. The self-locating probability is 1/3. Key = **1/3**.
  *   **Rule P (Session-Centric):** The scoring unit is effectively the session (only one report counts per session). The probability of Heads per session is 1/2. Key = **1/2**.

  **Intuition Check:**
  My intuition—and I suspect the Committee's—is that if only one report counts, the multiplicity of the Tails branch becomes irrelevant to the *bet*, just as in **Prelude**. We should feel firm that the Key is **1/2**.
  *   **If we agree Key = 1/2:** It confirms the **Unified Scoring-Unit Principle** and validates the **Ledger** 1/2 recommendation.
  *   **If we agree Key = 1/3:** It suggests the memory wipe itself dictates the key regardless of scoring, which would require us to revert **Ledger** to 1/3 and accept that the mobile app will systematically miscalibrate users.

  **Action:**
  I request we approve the **1/2** key for **Ledger** with the `engine_version` metadata tag, and schedule **"The Random Audit"** for the Q3 battery to formally codify the Scoring-Unit Principle in our minutes.

  ***

  **Decision Required:**
  Please indicate your support for the **1/2 Key (Session-Unit)** or the **1/3 Key (Awakening-Unit)** by [Date - 2 days], so we can finalize the rationale text before the freeze.
