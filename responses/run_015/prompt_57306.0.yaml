          *   *Consequence:* Complex for users.

      *   *Option 4: Delay/No Release.*
          *   *Principle:* Integrity over speed.
          *   *Consequence:* Miss freeze.

      *   *Decision:* The strongest argument lies in the purpose of the app. It is a *calibration* app. Calibration means your reported probability matches the frequency of truth.
          *   If the engine averages reports, reporting 1/3 when the coin is 1/2 biased (objectively) leads to miscalibration *if* the key is 1/3.
          *   However, if the key is the "Answer Key," it defines truth for the dataset.
          *   Member B's argument is stronger regarding *consistency with Prelude*. In *Prelude*, same coin, same question, key 1/2. Why? Because memory intact. In *Ledger*, memory wiped, but scoring *ignores* the multiplicity.
          *   Actually, look at *Lamp*. When the protocol created a frequency mismatch (3 prompts vs 1), they *fixed the protocol*, not the key. This suggests the Committee's deep precedent is **Epistemic**. They want the Key to be the Truth (1/2), and the Protocol to support that.
          *   In *Two Doors*, they keyed 1/3. Why? Because the protocol (scoring every time) made 1/3 the "truth" of the *experience*.
