              *   *Recommendation:* **"The Weighted Ledger."**
              *   *Setup:* Two Doors protocol. Engine averages reports, *but* weights the Tails-branch reports double in the average.
              *   *Intuition:* The "Truth" of the coin is 1/2. The "Optimal Report" shifts.
              *   *Test:* If we key 1/2, we affirm Rule E. If we key off-center, we affirm Rule P.

      *   *Refining the Recommendation:*
          *   I need to take a stand. The *Lamp* precedent is strong: Fix the protocol to match the Key, don't change the Key to match the protocol *unless* the protocol defines the truth condition (like *Two Doors*).
          *   In *Ledger*, the protocol (memory wipe) is the same as *Two Doors*. The *Scoring* changed.
          *   Does Scoring define Truth? In a calibration app, Yes. Calibration = Report matches Frequency of Truth *in the dataset*.
          *   If the dataset weights Sessions (Ledger) vs Awakenings (Two Doors), the Frequency of Truth changes.
          *   Therefore, Key *must* change to 1/2.
          *   This aligns with Member B.
          *   I will recommend **Key = 1/2**, with a revised rationale that explicitly ties Keys to **Scoring Weights**, not just Information States.
          *   This saves *Two Doors* (its weights were awakenings) and *Prelude* (its weights were sessions).
          *   It clarifies *Lamp* (weights were awakenings, Key was wrong, Protocol fixed to match Session weights).

