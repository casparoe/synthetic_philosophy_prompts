answer: |-
  1. Gould and Lewontin coined "spandrel" to mark traits that are byproducts, not selected features. You're arguing they're just exaptations in waiting. If everything is either an adaptation or a future adaptation, doesn't "spandrel" just become a synonym for "we haven't figured out the function yet"?
     *   **Follow-up:** If she says it's about timeframe: Then what empirical marker distinguishes a "true byproduct" from a "latent function" before the selection event actually happens?

  2. Why keep the distinction at all? If the lag time is indefinite, isn't this just pan-adaptationism with extra steps?
     *   **Follow-up:** If she says it preserves evolutionary mechanism: Then can you name a trait that is definitively *not* latent-adaptive? If not, isn't the claim metaphysical rather than scientific?

  3. Let's talk concrete biology. The human chin is the classic spandrel example. What's the specific selective pressure you think it's waiting to satisfy?
     *   **Follow-up:** If she says "structural reinforcement": Biomechanical studies suggest the chin doesn't actually reinforce the jaw against stress. If the physics don't hold, what's left of the adaptive story?

  4. Suppose we sequence every genome and run every simulation and find zero fitness advantage for the chin, now or in projected environments. Do you concede it's a spandrel then?
     *   **Follow-up:** If she says "future environment": How far into the future do we have to wait before we call foul? Is there a statute of limitations on natural selection?

  5. This brings me to falsifiability. If a trait has no current function, and you posit a future one, how do we test that without just waiting forever?
     *   **Follow-up:** If she says "look at homologs": Homologs often show loss of function too. If a trait degrades but you call it "latent," aren't you insulating the theory from disconfirmation?

  6. What specific prediction does latent-adaptationism make that standard neutral theory doesn't?
     *   **Follow-up:** If she says "persistence of traits": Neutral traits persist too via drift. What's the measurable difference in the signal?

  7. You extend this to culture—writing, religion. Are you saying these are biological adaptations of the brain, or cultural exaptations?
     *   **Follow-up:** If she says "both/co-evolution": Doesn't that conflate genetic selection with memetic selection? How do you disentangle the lag time of a gene vs. the lag time of a meme?

  8. If writing is a spandrel of brain architecture meant for something else (like pattern recognition), does calling it "latent-adaptive" obscure the actual cognitive history?
     *   **Follow-up:** If she says "function is what matters": But in engineering, knowing if a bridge support is intentional or a byproduct matters for stability. Why is evolutionary engineering different?

  ***

  **Notes on Strategy**

  **Weakest Line:** The Culture angle (Q7 & Q8).
  *   **Why:** Philosophers love to wiggle out of biology/culture analogies by claiming "cultural evolution follows different rules." She could easily concede that biological latent-adaptationism is strict but cultural is loose, which diffuses the tension.
  *   **Drop it if:** She clearly distinguishes between genetic timescales and memetic timescales early on. If she admits cultural traits aren't bound by the same "latent" constraints as biological ones, pressing this harder will make you look like you're conflating categories.

  **What Would Change My Mind About This Interview Angle:**
  *   If she admits upfront that "latent-adaptationism" is a **heuristic** rather than an ontological claim. If she says, "I know we can't prove it, but acting *as if* traits have latent function drives better research than assuming they're useless," the hardball falsifiability questions (Q5 & Q6) become less relevant. In that case, pivot to asking about the *utility* of the mindset for research funding or hypothesis generation, rather than its truth value.
