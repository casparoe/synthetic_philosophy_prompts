          2.  Rationale (Historian's view, Archivist's view, Synthesis).
          3.  Implementation (Who does what, Revision mechanism).
          4.  Oral History specific.

      *   *Refining the "Something Better":* The "something better" is distinguishing between *describing the hole* (valid) and *interpreting the hole* (invalid for a finding aid).

      *   *Let's write.*

      *(Self-Correction during drafting)*: I need to make sure I don't exceed 1,000 words. I will keep the intro punchy. I need to make sure I address the "who does what" within the existing cataloguing round.

      *   *Plan:*
          1.  Header.
