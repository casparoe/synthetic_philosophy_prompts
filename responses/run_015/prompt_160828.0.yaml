answer: |-
  **TO:** Acquisitions and Access Committee
  **FROM:** [Your Name], Council Appointee
  **DATE:** 10 February 2026
  **SUBJECT:** Decision Memorandum: Cataloguing Priorities and Apophatic Description Pilot

  **Recommendation**

  I recommend we prioritise the Marshfield Borough Housing Department deposit (1948–1996) for immediate cataloguing within this round, deferring the Ravensmoor Tenants' Association deposit. Regarding the historian's proposal, I recommend we pilot 'apophatic description' strictly at the **series level** to note structural breaks (e.g., 'Series breaks 1974; resumes 1982'), but decline to adopt collection-level editorial statements regarding whose voices are absent. The Senior Archivist will lead the cataloguing, inserting procedural silence notes where sequences are interrupted. These notes must be tagged with a 'Review Flag' to trigger reassessment if new material arrives. Regarding the oral history: we accept the donor's anonymity but must inform him that his veto power will be recorded explicitly as an access restriction in the catalogue, not hidden.

  **Rationale**

  This decision attempts to reconcile the valid philosophical concerns raised by our historian member with the professional safeguards argued by our senior archivist.

  The historian's case rests on the danger of false completeness. A catalogue that lists only what exists implies that the archive is a neutral mirror of the past, rather than a constructed selection. If we do not mark the 1974–1981 gap in the housing records, we allow the council's administrative continuity to appear unbroken, effectively erasing the Ravensmoor clearance from the official paper trail. This is 'the second silence': hiding the fact that records are missing. Researchers cannot ask why a gap exists if the catalogue suggests no gap exists. We must acknowledge that the structure of the collection is itself data.

  However, the senior archivist's counter-argument is equally robust. We are custodians of what we hold, not auditors of what was lost. To assert definitively that 'tenants' voices are absent' is an interpretive claim, not a descriptive one. We cannot verify negative existence; a stray box found in 2031 would turn our current note into a falsehood. Furthermore, spending scarce cataloguing hours describing non-existent records risks diverting resources from preserving actual material. There is also the political risk noted by the tenants' representative: an official note about absence might sanitize the council's erasure, making it look like a documented administrative decision rather than a silencing.

  **The Synthesis: Procedural vs. Interpretive Silence**

  To resolve this, we must distinguish between *procedural gaps* and *interpretive absence*.

  We should adopt the historian's method for **procedural gaps**. Noting that a rent ledger series stops at volume 45 (1974) and resumes at volume 46 (1982) is a factual description of the physical holding's structure. It does not assert why the gap exists, only that it is there. This satisfies the need to show the shape of the hole without speculating on its cause.

  We must reject the historian's proposal for **interpretive absence**. We should decline to assert in the collection-level description that 'tenants' voices are missing'. This is a historical argument, not an archival description. It hardens our 2026 interpretation into fact for future researchers. Our job is to preserve the evidence so others can make that argument, not to make it for them. This addresses my own concern about accretion: procedural notes describe the box; interpretive notes describe our politics. The former is stable; the latter is not.

  **Implementation and Revision**

  1.  **Cataloguing Priority:** The Senior Archivist will commence work on the Housing Department deposit immediately. The Ravensmoor Tenants' Association deposit, being small (one shoebox), will be secured but catalogued in the next round. The Housing records provide the context necessary to understand the Tenants' records; without the gap marked in the former, the latter loses its critical leverage.
  2.  **Silence Note Format:** Notes must be factual. Example: 'No files survive for Ravensmoor estate between 1974–1981.' They must not read: 'Records were destroyed during clearance.'
  3.  **Revision Mechanism:** Every silence note must carry a metadata flag: 'Provisional – Subject to Review.' If new material is accessioned that fills a gap, the note is not merely deleted; it is amended to read 'Gap filled by Accession [X], [Date].' This ensures the history of the catalogue's uncertainty remains visible.

  **The Oral History Interview**

  We should accept the retired housing officer's interview, as it offers unique insight into the gap. However, we must be transparent about the conditions.
  *   **Anonymity:** We can accommodate this by restricting access to his name while keeping the content open.
  *   **Veto Power:** We cannot accept a veto on passages without recording it. I propose we tell the officer: 'We will honour your request for anonymity. Regarding the veto, we cannot alter the record based on later preference. However, we will accept the interview on the condition that your right to veto specific passages is noted in the access conditions.' This ensures future researchers know the testimony may be self-censored. It preserves the integrity of the archive by marking the limitation rather than hiding it.

  **Conclusion**

  This approach acknowledges the silence without speaking for the silent. It protects the archive from asserting unverifiable truths while ensuring researchers are not misled by apparent completeness. I ask the committee to approve this pilot for the current cataloguing round.
