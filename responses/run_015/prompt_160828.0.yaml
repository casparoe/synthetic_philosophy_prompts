      *   *Wait, one more check:* "open with a single clear recommendation with a timeline and an indication of who does what within our existing cataloguing round". Okay, this needs to be the very first thing after the header.

      *   *Oral History:* "what we should tell the retired housing officer about his conditions". I need to be clear. Anonymity = Yes. Veto = Yes, but recorded as a restriction.

      *   *Revision:* How does a silence note get withdrawn? It needs a flag.

      *   *Let's go.*

      *(Drafting thought)*: Ensure the distinction between the Housing Dept deposit and the Tenants Assoc deposit is clear. We catalogue the Housing Dept because that's where the gap *is*. The Tenants Assoc box is small, can wait.

      *(Drafting thought)*: The Historian wants "collection-level paragraph naming tenants... as absent parties". I am rejecting this specific part while accepting the "series level" note. This is the compromise.

