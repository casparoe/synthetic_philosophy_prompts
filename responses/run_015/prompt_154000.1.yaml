  You are serving as the exam setter for an upper-level undergraduate seminar in philosophy of biology. Before you draft anything, take a breath and work through the conceptual architecture step by step: first map the precise conditions under which an etiological (selected-effect) account attributes a function versus the conditions a causal-role account requires, then identify exactly where each view generates normative judgments about malfunction rather than mere description, and only then design the assessment around a case that forces students to apply those conditions rather than summarize them. I need a single 90-minute final-exam essay question, together with a model answer and a detailed marking scheme, for students who have covered biological function, design, and synthetic biology but have not read any specific literature on horizontal gene transfer in engineered microbiomes.

  This request comes out of a long argument I just had with a friend about whether laboratory-engineered organisms “really” have functions or are merely mechanisms with causal effects. We were debating a hypothetical but realistic scenario: an open-environment bacterial consortium assembled for bioremediation, carrying a plastic-degradation pathway stitched together from plasmids with unrelated evolutionary origins, now undergoing rapid horizontal transfer and selection in a wastewater treatment plant. My friend insisted that because no unified selection history explains the pathway as an integrated unit, etiological accounts must deny it has a proper function, leaving only causal-role descriptions; I countered that this feels wrong because we still want to say the pathway is malfunctioning when it fails to degrade plastic despite being present and structurally intact. We eventually realized we were talking past each other about whether normative function attribution can survive evolutionary mosaicism in synthetic contexts.

  Please construct one essay question (target length approximately 1200 words; total marks 30) that forces students to move beyond reciting the standard distinction between etiological and causal-role theories. Present the engineered consortium case in sufficient detail, then ask students to: (a) articulate the precise conditions each account sets for attributing the function “to degrade polyethylene terephthalate” to the pathway; (b) show why the mosaic evolutionary history of the plasmid cluster creates a specific problem for the etiological account—namely, that selection may have acted on individual plasmid modules rather than on the integrated pathway—while also showing why the causal-role account struggles to distinguish malfunction from mere causal failure in an artificial context that lacks a natural design baseline; (c) evaluate whether a minimal hybrid revision—call it the “stabilized contribution account,” which requires both a recent selective stabilization of the contribution and an actual current causal contribution—can resolve the tension without collapsing into either pure view; and (d) defend or reject that hybrid using the consortium case, with explicit attention to whether synthetic organisms can genuinely malfunction. The model answer should mirror these four sections and should address the normativity of malfunction in engineered organisms directly. The marking scheme must list exactly five must-hit conceptual moves, assign marks to each (summing to 30), and for each move include a one-line note on the characteristic student error—such as conflating “no unified evolutionary history” with “no function whatsoever” rather than addressing modular selection, or treating causal-role malfunction as identical to mechanical breakdown without confronting the baseline problem. Do not ask for bibliographies, reading lists, or citations; do not include verbatim quotations from any philosopher; and avoid framing the task as a literature review. The difficulty should come entirely from applying the distinction to a novel synthetic-biology scenario that requires students to reconstruct and adjudicate the arguments themselves.
