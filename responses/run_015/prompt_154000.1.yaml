answer: |-
  ### Design Logic and Conceptual Architecture

  **1. Mapping Function Accounts:**
  *   **Etiological (Selected-Effect):** Function is grounded in history. Trait $T$ has function $F$ iff $T$ exists because ancestors of $T$ were selected for $F$. Normativity arises from the historical standard: $T$ *ought* to do $F$ because that is why $T$ is here. Malfunction is failing to do $F$ despite being the right type of trait.
  *   **Causal-Role (System):** Function is grounded in current capacity. Trait $T$ has function $F$ iff $T$ makes a causal contribution $C$ to the capacity of containing system $S$. Normativity is weak or investigator-relative: $T$ *does* $F$ relative to our interest in $S$'s capacity. Malfunction is mere causal failure unless a "normal" baseline is defined.

  **2. Locating Normativity:**
  *   **Etiological:** Normativity is robust but exclusive. If there is no selection history, there is no proper function, only effects. In synthetic cases, this risks labeling engineered traits as functionless until they evolve naturally.
  *   **Causal-Role:** Normativity is inclusive but shallow. Anything contributing has a function. Malfunction is indistinguishable from mechanical breakdown unless a "design baseline" is smuggled in.

  **3. The Synthetic Conflict:**
  *   The engineered consortium has a *design* history (lab) but not a *selection* history (nature) for the integrated pathway.
  *   Horizontal Gene Transfer (HGT) creates a mosaic: individual plasmids have histories, the combination does not (yet).
  *   **Etiological Problem:** Did selection act on the *module* or the *system*? If only the module, does the system have a function?
  *   **Causal-Role Problem:** If the pathway stops working, is it malfunctioning or just broken? Without natural selection, is there a "normal" state?
  *   **Hybrid Solution:** "Stabilized Contribution" requires recent selection (stabilization) + current contribution. This allows synthetic traits to gain normative status once they survive in the wild.

  ***

  ### FINAL EXAMINATION: PHILOSOPHY OF BIOLOGY (SEM 404)

  **Time Allowed:** 90 Minutes
  **Total Marks:** 30
  **Instructions:** Answer the following question. Your response should be approximately 1200 words. Do not use citations or direct quotations.

  **Question 1: The Normativity of Engineered Mosaics**

  **Case Vignette: The PlastiConsortium**

  Consider a synthetic bacterial consortium, designated "PlastiConsortium-Alpha" (PCA), engineered for deployment in open-environment wastewater treatment plants. The primary objective of PCA is the degradation of polyethylene terephthalate (PET), a common plastic polymer. To achieve this, synthetic biologists stitched together a novel metabolic pathway using three distinct plasmid modules sourced from unrelated bacterial species found in diverse environments. Plasmid A encodes an esterase originally selected for lipid metabolism in soil bacteria. Plasmid B encodes a transporter protein selected for antibiotic resistance in clinical isolates. Plasmid C encodes a regulator selected for stress response in marine archaea. None of these modules were historically selected for PET degradation, nor were they ever found together in nature prior to laboratory assembly.

  Upon release into a wastewater treatment plant, PCA initially performs well. However, within six months, metagenomic sequencing reveals rapid horizontal gene transfer (HGT) occurring between PCA strains and native wastewater microbes. The plasmid modules are beginning to dissociate and recombine with native genomes. Some native bacteria acquire Plasmid A but lack B and C, rendering the esterase useless for PET degradation. Others acquire the full cluster but lack the regulatory context provided by the original synthetic chassis. Consequently, the overall rate of PET degradation in the plant fluctuates wildly. In some micro-colonies, the pathway is structurally intact but inactive due to metabolic cost; in others, the pathway is partially deleted yet retains residual catalytic activity.

  You are tasked with evaluating the functional status of the PET-degradation pathway in this evolving consortium. Specifically, you must address whether it is philosophically coherent to claim the pathway is "malfunctioning" when it fails to degrade plastic, despite being structurally present, given its mosaic evolutionary history.

  **Essay Task:**

  (a) **Theoretical Conditions:** Articulate the precise conditions under which an etiological (selected-effect) account attributes the function "to degrade PET" to the pathway, and contrast this with the conditions required by a causal-role account. Be specific about the role of history versus current contribution.

  (b) **The Mosaic Problem:** Show why the mosaic evolutionary history of the plasmid cluster creates a specific problem for the etiological account. Explain why selection acting on individual plasmid modules (or artificial lab selection) might fail to ground a unified proper function for the integrated pathway in the wild. Simultaneously, show why the causal-role account struggles to distinguish genuine biological malfunction from mere mechanical breakdown in this artificial context, specifically addressing the lack of a natural design baseline.

  (c) **The Hybrid Proposal:** Evaluate whether a minimal hybrid revision—call it the "stabilized contribution account," which requires both a recent selective stabilization of the contribution in the environment and an actual current causal contribution—can resolve the tension without collapsing into either pure view. Does this account allow the pathway to have a function during the initial lab phase, or only after HGT begins?

  (d) **Normative Defense:** Defend or reject that hybrid using the consortium case, with explicit attention to whether synthetic organisms can genuinely malfunction. If you reject it, propose how normativity survives in engineered systems. If you defend it, explain how "stabilization" converts an artificial mechanism into a biological trait with normative standards.

  ***

  ### MODEL ANSWER

  **(a) Theoretical Conditions**
  An etiological account attributes the function "to degrade PET" only if the pathway exists now because ancestors of the pathway were naturally selected for degrading PET. History is constitutive; without a lineage of selection for this specific effect, there is no proper function, only causal effects. In contrast, a causal-role account attributes the function if the pathway currently makes a causal contribution to the capacity of the containing system (the wastewater plant) to process waste. History is irrelevant; only the current organizational contribution matters. The etiological view grounds function in the past; the causal-role view grounds it in the present system capacity.

  **(b) The Mosaic Problem**
  The mosaic history creates a fatal gap for the etiological account. The individual plasmids have selection histories, but for different traits (lipid metabolism, antibiotic resistance). The *integrated* pathway has no natural selection history; it was designed. An etiological theorist might argue lab selection counts, but if the function must be "natural," the pathway lacks a proper function until it survives in the wild. Furthermore, HGT fragments the unit of selection. If Plasmid A spreads because it confers a side-benefit unrelated to PET degradation, the etiological account might attribute a different function to A, denying the PET degradation function entirely.

  The causal-role account avoids the history problem but fails on normativity. It can say the pathway contributes to degradation. However, if the pathway fails, is it a malfunction or just a broken machine? Causal-role accounts define function relative to system capacity. In a synthetic system, the "system" is arbitrary. Without a natural baseline of "normal operation" established by evolution, distinguishing malfunction (normative failure) from mere causal failure (physical breakdown) becomes difficult. Any failure is just a change in causal role, lacking the "ought" inherent in biological malfunction.

  **(c) The Hybrid Proposal**
  The "stabilized contribution account" offers a promising middle ground. By requiring recent selective stabilization *and* current contribution, it acknowledges that synthetic traits can become biological functions once they enter a evolutionary dynamic. This account suggests the pathway had no proper function in the lab (only design function), but gains proper function once HGT and selection stabilize the trait in the wastewater environment. It avoids collapsing into pure etiology by not requiring deep ancestral history, and avoids pure causal-role by requiring selection, not just contribution. However, it creates a boundary problem: exactly when is stabilization achieved? If the pathway fluctuates due to HGT, is it stabilized?

  **(d) Normative Defense**
  I defend the hybrid account because it captures the intuition that synthetic organisms can genuinely malfunction once they enter an ecological context. In the lab, failure is a design flaw. In the wild, failure is a biological malfunction. The hybrid account explains this transition: once the pathway is selected for (even briefly) in the wastewater, it acquires a normative standard. If a bacterium possesses the stabilized pathway but fails to degrade PET due to a mutation, it is malfunctioning, not just broken. This preserves the normativity of biological function without denying the reality of synthetic biology. It allows us to say the pathway *ought* to degrade PET because it is currently being maintained by selection for that effect, bridging the gap between artifact and organism.

  ***

  ### MARKING SCHEME

  | Conceptual Move | Marks | Characteristic Student Error |
  | :--- | :---: | :--- |
  | **1. Etiological Conditions:** Correctly identifies that etiological accounts require a history of selection for the specific effect as the condition for function attribution. | 5 | Conflating "design history" with "selection history" or claiming etiology ignores history entirely. |
  | **2. Causal-Role Conditions:** Correctly identifies that causal-role accounts require current causal contribution to system capacity regardless of history. | 5 | Treating causal-role as requiring "intention" or failing to note its investigator-relative nature. |
  | **3. Etiological Challenge:** Explains how modular/mosaic history (HGT) prevents the *integrated* pathway from having a unified selection history, threatening function attribution. | 5 | Conflating "no unified evolutionary history" with "no function whatsoever" rather than addressing modular selection. |
  | **4. Causal-Role Challenge:** Explains why causal-role accounts struggle to distinguish normative malfunction from mechanical breakdown without a natural baseline. | 5 | Treating causal-role malfunction as identical to mechanical breakdown without confronting the baseline problem. |
  | **5. Hybrid & Normativity:** Evaluates the hybrid account's ability to grant normative status to synthetic traits via stabilization, concluding on whether synthetic organisms can malfunction. | 10 | Accepting the hybrid without critiquing the "stabilization" threshold or failing to link stabilization to normativity. |
  | **TOTAL** | **30** | |
