  I am a PhD student in welfare biology, and the chapter I am currently writing concerns whether habitat restoration and rewilding projects can be expected to increase or decrease aggregate wild-animal welfare. At a supervision meeting last week, I raised the worry that creating more wilderness might, from the animals' point of view, mostly mean creating more short and painful lives — most wild animals die young, and often badly — and that a policy could therefore succeed by every conservation metric while making things worse in aggregate for the creatures living in it. My supervisor, a conservation biologist who thinks of ecosystems as things to be protected from interference, waved this off with the proverb 'let nature take its course', as though it settled the question of whether welfare considerations should carry any weight in decisions about intervening in, or refraining from intervening in, wild ecosystems. I suspect the proverb is doing several quite different jobs at once, only some of which could actually support that dismissal. Please lay out, as a list I can bring to my next supervision, the distinct precise claims 'let nature take its course' could be expressing in this context. By way of suggestion, the candidates seem to include: a descriptive ecological claim that unmanaged ecosystems tend towards self-regulating equilibrium, so that populations left alone neither overshoot into mass starvation nor collapse; an epistemic claim that we cannot predict the welfare consequences of intervening, so non-intervention is the safer default; an axiological claim that natural states of affairs are better than managed ones, whatever the welfare consequences; a claim about our moral standing, that we have no business interfering in processes we did not create; and a straightforwardly welfarist claim that leaving things alone happens to maximise net welfare over time. For each reading, tell me whether it is a platitude, substantive and defensible, substantive but d