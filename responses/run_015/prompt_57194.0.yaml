  ### Instructor Cheat Sheet (For the Envelope)

  **Proposition Truth Values:**
  *   **A:** TRUE (Sum=45, div by 3)
  *   **B:** TRUE (Sum=45, div by 3)
  *   **C:** TRUE (Sum=45, div by 9)
  *   **D:** TRUE (Sum=45, div by 9)
  *   **E:** TRUE ($2401-1 = 2400$, div by 5)
  *   **F:** TRUE (Ends in 0)

  **Logical Relations to Watch For:**
  1.  **A $\iff$ B:** If a student prices these differently by >10 points, target them.
      *   *Proof Required:* State the divisibility rule for 3 ($N \equiv \sum digits \pmod 3$).
  2.  **C $\iff$ D:** Same as above.
  3.  **C $\implies$ A:** If Price(C) > Price(A), target them. (Cannot be more certain of the specific than the general).
      *   *Proof Required:* $9k = 3(3k)$.
  4.  **E $\iff$ F:** If priced differently, target them.
      *   *Proof Required:* Compute $7^4$ on board. ($49 \times 49$).

  **Dispute Resolution:**
  If a student argues "I didn't know the divisibility rule," reply: "That is exactly the point. Your credence reflects your computational resources, not the fact itself. You were Dutch-Bookable because your internal logic was incomplete."
