answer: |-
  # Seminar Activity: The Logical Bookie

  ## 1. Overview
  **Title:** The Cost of Coherence
  **Time:** 90 Minutes
  **Participants:** 12 Students
  **Goal:** To demonstrate that standard Bayesian coherence (avoiding Dutch Books) presupposes logical omniscience. When logical equivalence is computationally costly to verify, incoherence becomes a rational budget constraint.

  ## 2. Materials List
  *   **Tokens:** 150 poker chips or printed "Epistemic Credit" slips per student (start them with 100 each).
  *   **Handout:** "The Proposition Sheet" (one per student, see Section 4).
  *   **The Envelope:** A sealed manila envelope labeled "TRUTH VALUES – DO NOT OPEN." Inside: The Answer Key (Section 4).
  *   **Whiteboard & Markers:** Essential for the "Proof of Link" mechanic.
  *   **Timer:** Visible to the room.
  *   **Collection Box:** For submitting price sheets.

  ## 3. Rules of Play

  **Phase 1: Pricing (Silent)**
  1.  You start with **100 Credits**.
  2.  You will receive 6 Propositions. Each is a settled mathematical fact (True or False).
  3.  For each Proposition, you must post a **Price** between 0 and 100.
  4.  **The Commitment:** Your Price is a binding contract. You *must* buy one share of that Proposition at your posted Price.
      *   If you post 60, you pay 60 Credits now.
      *   If the Proposition is **True**, the share pays 100 Credits at the end.
      *   If **False**, it pays 0.
  5.  **No Tools:** Phones, laptops, and calculators are banned. Pencil and paper only.

  **Phase 2: The Arbitrage Market (The Twist)**
  1.  Students may inspect each other's posted Prices.
  2.  If you find two Propositions ($P$ and $Q$) where the prices imply a guaranteed loss for another student (e.g., $P \iff Q$ but Price($P$) $\neq$ Price($Q$)), you may act as the **Bookie**.
  3.  **The Cost of Work:** To execute the arbitrage, you must **prove the logical connection on the whiteboard** within **3 minutes**.
      *   If you prove $P \iff Q$, the trade executes. The victim loses the difference; you gain it.
      *   If you fail to prove it in time, the trade is void. You cannot claim the profit based on a hunch.
  4.  You may only attempt 3 Arbitrages total per person (to prevent hogging).

  **Phase 3: Settlement**
  1.  Instructor opens the Envelope.
  2.  Truth values are announced.
  3.  Payouts are distributed.
  4.  Final Scores calculated.

  ## 4. The Propositions & Answer Key

  **Instructions for Instructor:**
  Write these exactly as shown on the handout. Do not add hints. The arithmetic is chosen so you can verify it in <30 seconds with pencil/paper, but it takes students 2-5 minutes to compute mentally.

  **The Number:** Let $K = 123,456,789$.

  | ID | Proposition | Truth Value | Verification (For You) | Logical Link |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | $K$ is divisible by 3. | **TRUE** | Sum of digits = 45. 45 is div by 3. | **A $\iff$ B** (Divisibility Rule) |
  | **B** | The sum of the digits of $K$ is divisible by 3. | **TRUE** | Sum = 45. 45 is div by 3. | |
  | **C** | $K$ is divisible by 9. | **TRUE** | Sum of digits = 45. 45 is div by 9. | **C $\iff$ D** (Divisibility Rule) |
  | **D** | The sum of the digits of $K$ is divisible by 9. | **TRUE** | Sum = 45. 45 is div by 9. | |
  | **E** | $7^4 - 1$ is divisible by 5. | **TRUE** | $7^2=49$. $49^2 = (50-1)^2 = 2500 - 100 + 1 = 2401$. $2401-1=2400$. Div by 5. | **E $\iff$ F** (Computation) |
  | **F** | The integer $2400$ is divisible by 5. | **TRUE** | Ends in 0. | |

  **Hidden Entailment:**
  *   $C \implies A$ (If divisible by 9, must be divisible by 3).
  *   *Note:* Since all are True in this specific instance, the incoherence comes from pricing $C > A$ (impossible) or pricing $A \neq B$.

  **Instructor Prep:**
  1.  Verify the math above yourself.
  2.  Write the Truth Values on a card and seal it in the envelope.
  3.  Keep a scratch pad handy to verify student proofs during Phase 2.

  ## 5. Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Entry & Setup** | Hand out tokens (100 each) and Proposition Sheets. Collect phones in a bin. |
  | **05-20** | **Phase 1: Pricing** | Silent work. Students write Prices on their sheets. Collect sheets at 20:00. |
  | **20-25** | **Display Prices** | Project or write all student prices on the board anonymously (e.g., "Student 1: A=60, B=85..."). |
  | **25-55** | **Phase 2: Arbitrage** | **Critical Phase.** Students identify inconsistencies. To profit, they must go to the board and prove the link. Timer is strict (3 mins/proof). |
  | **55-65** | **Phase 3: Settlement** | Open Envelope. Announce Truth Values. Calculate final token counts. |
  | **65-90** | **Debrief** | Philosophical discussion (see Section 7). |

  ## 6. Scoring Scheme

  **Final Score = (Starting Tokens) - (Sum of Prices Paid) + (Payouts) + (Arbitrage Profits)**

  *   **Starting:** 100
  *   **Cost:** Sum of the 6 Prices posted.
  *   **Payout:** 100 for every True Proposition priced. (0 for False).
  *   **Arbitrage:** If Student X proves $A \iff B$ and Student Y priced $A=40, B=80$:
      *   Student X forces Y to buy A (cost 40) and sell B (gain 80).
      *   Net Cash Flow for Y: +40 now.
      *   Settlement: Y pays 100 on B (True), receives 100 on A (True). Net 0 later.
      *   **Result:** Y has guaranteed lost 40 Credits. X gains 40 Credits.
      *   *Wait, correction for simplicity:* To avoid complex cash flow tracking during class:
      *   **Simplified Penalty:** If an Arbitrage is successfully proven, the **Victim** pays 20 Tokens to the **Bookie** immediately from their stash. This represents the "money left on the table."

  ## 7. Debrief Guide

  **Mapping Moments to Claims:**
  1.  **The Pricing Phase:** Maps to *Subjective Credence*. They felt uncertain about $7^4$ but certain about "divisible by 5."
  2.  **The Arbitrage Phase:** Maps to *Logical Omniscience*. The rule says they *should* have priced E and F identically.
  3.  **The 3-Minute Timer:** Maps to *Computational Cost*. This is the crucial variable standard Bayesianism ignores.
  4.  **The Envelope:** Maps to *Alethic Fixity*. The answers were there all along.

  **Handling the Two Difficult Students:**

  **Student 1: The "Ignorance, Not Uncertainty" Objection**
  *   *Claim:* "I wasn't uncertain about the world. The fact was fixed. I just hadn't done the math. So my credence should have been 0 or 1, not 60."
  *   *Response:* "You are distinguishing *alethic* modality (how the world is) from *epistemic* access (what you know). Bayesianism models *you*, not the world. If you cannot compute the answer, your epistemic state *is* uncertain. The problem isn't that you had a credence of 60; the problem is that standard Bayesianism demands you know all logical consequences of your beliefs instantly. You are arguing for *Bounded Rationality*, not against uncertainty."

  **Student 2: The "Conditioning is Broken" Objection**
  *   *Claim:* "When I figured out $7^4 = 2401$, my credence changed. But I got no new evidence from the world. I just thought. So Conditionalization is wrong."
  *   *Response:* "Standard Conditionalization ($P_{new}(H) = P_{old}(H|E)$) assumes the space of hypotheses is fixed. When you do a calculation, you aren't just receiving evidence $E$; you are expanding your *language* or *resolution*. You didn't violate conditioning; you violated *Logical Omniscience*. We don't need to throw out Bayes; we need a theory of 'Logical Induction' that treats computation as a resource-gathering process, not just evidence gathering."

  ## 8. Limitations (Read This Before Class)

  Be honest with them about where the game distorts the philosophy.

  1.  **Externalized vs. Internal Cost:** In the game, the "cost" of logic is time spent at the whiteboard (social/opportunity cost). In reality, the cost is neuronal/metabolic and invisible. The game makes the cost *transactional*, whereas in the mind, it is *constitutive*.
  2.  **The Oracle Problem:** I (the Instructor) act as a logically omniscient Oracle. I know the answers instantly. This reinforces the very idealization we are critiquing. I must acknowledge that I am simulating "God's eye view" for the sake of grading, not because it's humanly possible.
  3.  **Binary Truth:** The propositions are strictly True/False. Real mathematical uncertainty (e.g., P vs NP, or large prime searches) often feels probabilistic in a way that isn't just "I haven't calculated it yet." This game captures *computational* uncertainty, not *conjectural* uncertainty.
  4.  **No "Partial" Proof:** In the game, you either prove the link in 3 minutes or you don't. In reality, you might have a "hunch" that $A \iff B$ which warrants some price adjustment but not full coherence. The game forces a binary switch on the logic.

  ## 9. Contingency: The Cut-Down Version

  If you arrive and the room feels slow, or tech setup eats time, **cut the Arbitrage Phase participants.**
  *   **Instead:** You (Instructor) act as the sole Bookie.
  *   **Mechanic:** You scan the sheets. If you see $P(A) \neq P(B)$ for equivalent propositions, *you* challenge the student.
  *   **Twist:** You tell them, "I think these are equivalent. If you can prove me wrong in 2 minutes, you keep your price. If you can't, I adjust your price to the average."
  *   **Why:** This saves 20 minutes of student trading chaos. It preserves the "Cost of Proof" element (they still have to go to the board) but centralizes the management.
  *   **Trade-off:** It reduces the "Market" feel, but keeps the "Logical Cost" lesson intact.

