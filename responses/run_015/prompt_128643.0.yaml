answer: |-
  You have identified one of the most persistent and structurally significant tensions in political philosophy and sociology, even if there isn't a single, universally recognized Latin name for the *rhetorical maneuver* itself (like *Ad Hominem*).

  In academic literature, this is usually discussed as the tension between **Primordialism** (nations are ancient, natural, objective) and **Modernism/Constructivism** (nations are recent, invented, subjective). However, you are asking about the *rhetorical exploitation* of that tension.

  Here is a breakdown of the existing concepts that map onto this move, followed by a proposed definition for the specific pattern you've isolated, and finally, the boundary cases you requested.

  ### 1. Existing Conceptual Matches

  While no single term captures the exact three-step pivot (Claim Ancient → Retreat to Subjective → Enforce Ancient), it is a composite of several established concepts:

  **A. Equivocation (Logical Fallacy)**
  At its core, this is a fallacy of **Equivocation**. The arguer uses the word "Nation" (or "People") to mean two different things within the same syllogism.
  *   *Premise 1 (Ancient Claim):* "The Nation is a historical organism that demands loyalty." (Definition: Objective/Ethnic)
  *   *Premise 2 (Defense):* "The Nation is a community of belief." (Definition: Subjective/Civic)
  *   *Conclusion:* "Therefore, you must be loyal to the historical organism."
  The conclusion only follows if the definition remains stable. By swapping the definition mid-argument to avoid falsification, but keeping the normative conclusion of the first definition, they commit equivocation.

  **B. The Motte-and-Bailey (Rhetorical Structure)**
  You noted it isn't *quite* Motte-and-Bailey, but many political theorists argue it is the **definitive** example of it, specifically regarding nationalism.
  *   **The Bailey (The desired position):** "Our nation is an ancient, objective reality that imposes binding duties on residents." (Hard to defend historically).
  *   **The Motte (The defensible position):** "Our nation is a shared psychological community/imagined community." (Easy to defend, per Anderson).
  *   **The Move:** When challenged on the Bailey, they retreat to the Motte ("It's just about shared values!"). Once the challenge passes, they slide back to the Bailey ("And those shared values are based on our ancient history, so assimilate!").
  *   *Why you feel it's different:* In a classic Motte-and-Bailey, the speaker is usually willing to *settle* for the Motte if cornered. In this nationalist pattern, the Motte is *never* the actual goal; it is purely a shield to protect the Bailey. This makes it more aggressive than a standard Motte-and-Bailey.

  **C. Instrumental Primordialism (Sociological Term)**
  In sociology, this is often called **Instrumental Primordialism**. This describes actors who *know* (or suspect) that national identities are constructed (Modernist), but deliberately deploy Primordialist rhetoric (ancient blood, soil, language) because it generates stronger political mobilization and social cohesion. They treat the "ancient" claim as a tool, not a truth, but demand it be treated as a truth by others.

  **D. Reification (Philosophical Concept)**
  This is the mechanism that allows the switch. **Reification** is treating an abstract social construct as if it were a concrete, natural thing.
  1.  They **Reify** the nation to demand obedience (It is a *thing* that exists outside of us).
  2.  They **De-Reify** the nation to avoid historical scrutiny (It is a *feeling* inside of us).
  3.  They **Re-Reify** it to enforce assimilation.

  ### 2. A Proposed Definition: "Ontological Arbitrage"

  Since there isn't a single canonical term for this specific three-step rhetorical loop, the most precise way to define it is **Ontological Arbitrage**.

  In finance, arbitrage is exploiting the price difference of the same asset in two different markets. In this rhetorical move, the nationalist exploits the **authority difference** of the same concept ("The Nation") in two different ontological markets (Objective History vs. Subjective Belief).

  *   **Market A (History):** "Ancient" has high authority/normative weight but low factual security.
  *   **Market B (Psychology):** "Belief" has high factual security but low normative weight (why must I obey a mere feeling?).
  *   **The Arbitrage:** They borrow the *security* of Market B to protect the asset, then spend the *authority* of Market A to demand payment.

  **Definition:** **Ontological Arbitrage** is a rhetorical strategy where a speaker defends a normative claim by oscillating between an objective ontology (when demanding obligation) and a subjective ontology (when evading scrutiny), without acknowledging the incompatibility of the two states.

  ### 3. Boundary Cases: Where does this end and "Complex Identity" begin?

  You asked where this rhetorical trick ends and where legitimate, complex identity begins. This is crucial because nations *are* often both ancient in cultural roots and modern in political structure (e.g., Anthony Smith's *Ethnosymbolism*).

  Here is how to distinguish the **Fallacy** from **Complex Reality**:

  | Feature | **Ontological Arbitrage (The Fallacy)** | **Legitimate Complex Identity** |
  | :--- | :--- | :--- |
  | **Consistency of Obligation** | The *demand* on newcomers remains tied to the **Ancient** claim (blood, soil, deep history) even after the *defense* retreats to the **Modern** claim (values, belief). | The *demand* on newcomers aligns with the **Modern** claim (adherence to current laws/values), acknowledging the history is symbolic. |
  | **Acknowledgment of Tension** | The tension is **concealed**. The speaker acts as if "shared belief" and "ancient continuity" are the same thing. | The tension is **acknowledged**. "We are a modern state, but we draw inspiration from ancient myths." |
  | **Falsifiability** | The claim is **unfalsifiable**. If you disprove the history, they switch to belief. If you challenge the belief, they switch to history. | The claims are **compartmentalized**. "Our borders are 19th-century (Fact), but our language is older (Fact)." |
  | **Normative Weight** | Uses history to **restrict** membership (You can't join because you weren't there in 1200 AD). | Uses history to **enrich** membership (You can join, and here is the story you are joining). |

  **Example of the Boundary:**
  *   **The Fallacy:** "You must speak our language because it is the tongue of our ancestors from 1000 years ago." (When challenged: "Well, actually the standard dialect was made in 1850." Response: "It doesn't matter, it's what we *feel* is ours." Conclusion: "So you must learn it to honor the ancestors.")
  *   **Legitimate Complexity:** "Our standard language was codified in the 19th century, but it is based on older dialects. To participate fully in our public sphere, you need to learn it, not because of blood, but because it's the tool of our current democracy."

  ### 4. Summary for Your Use

  If you need to name this in a debate or paper, you have three options depending on the audience:

  1.  **For Logicians:** Call it **Equivocation on Ontology**. (Shifting the definition of what the nation *is* to preserve the conclusion about what the nation *requires*).
  2.  **For Sociologists:** Call it **Instrumental Primordialism**. (Using ancient claims as a tool while relying on modern construction for safety).
  3.  **For General Discourse:** Call it **The Nationalist Shuttle** or **Ontological Arbitrage**.

  The key insight you've had—which aligns with critics like Tom Nairn and Partha Chatterjee—is that modern nationalism *requires* this double-move. It needs to be "modern" enough to function as a state (borders, schools, bureaucracy) but "ancient" enough to demand the sacrifice (death, loyalty, assimilation) that states usually cannot command. When the argument hides this machinery, it is fallacious. When it admits it, it is political theory.
