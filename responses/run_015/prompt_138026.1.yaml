answer: |-
  # Procedure for Invitation Evaluation (PIE-4)

  **Purpose:** To operationalize the commitment to open inquiry while managing the paradox of tolerance within a private, non-profit lecture series.
  **Constraints:** Decisions within 7 days; no legal counsel; all refusals published with justification.
  **Authority:** This procedure binds the four-person committee. Deviations require unanimous consent and a published addendum.

  ## I. Ordered Questions and Decision Thresholds

  Execute the following questions in order. A "Stop" condition ends the evaluation and triggers the associated action.

  **Q1: Safety and Legality (The State/Physical Ladder)**
  *   **Question:** Does holding this event present a credible, specific threat of physical violence or illegal activity that cannot be mitigated by venue security?
  *   **Sufficient Answer:** Written assessment from venue security or local law enforcement liaison.
  *   **Decision:**
      *   **Yes:** **DECLINE.** Reason: "Inability to ensure physical safety." (No further questions needed).
      *   **No:** Proceed to Q2.

  **Q2: The Intolerance Predicate (The Popperian Threshold)**
  *   **Question:** Does the speaker explicitly advocate for the removal of civil rights, safety, or institutional standing of a specific group based on immutable characteristics?
  *   **Sufficient Answer:** Direct citations from recent public statements or writings. Speculation on potential misuse of ideas is insufficient.
  *   **Decision:**
      *   **Yes:** **DECLINE.** Reason: "Advocacy incompatible with open inquiry." (Proceed to Anti-Laundering Check).
      *   **No:** Proceed to Q3.
      *   **Borderline:** Proceed to Q3, but flag for Full Committee Review.

  **Q3: Content Harm vs. Platform Harm (The Injury Test)**
  *   **Question:** Is the alleged harm caused by the *falsity* of the claims (Content Harm) or by the *act of credentialing* the speaker (Platform Harm)?
  *   **Sufficient Answer:** Specific description of injury. If the injury persists even if the speaker's claims are fully rebutted on stage, it is Platform Harm.
  *   **Decision:**
      *   **Content Harm:** **HOST WITH MODIFICATION.** Add a formal respondent or contextualizing introduction. Counter-speech is the remedy.
      *   **Platform Harm:** Proceed to Q4.

  **Q4: Cost Asymmetry (The Standing Check)**
  *   **Question:** Who bears the disproportionate cost of hosting this event, and do they have standing in this procedure?
  *   **Sufficient Answer:** Identification of specific constituencies (e.g., students, local communities) facing heightened risk vs. the committee facing reputational risk.
  *   **Decision:**
      *   **High Asymmetry:** If the cost-bearers are marginalized groups and the harm is Platform Harm, their objection carries veto weight. **DECLINE** or **MODIFY** heavily.
      *   **Low Asymmetry:** If the cost is primarily reputational to the committee or general discomfort, proceed to Q5.

  **Q5: The Mirror-Image Test (Anti-Laundering Check)**
  *   **Question:** If a speaker with the opposite viewpoint (mirror-image) proposed the same format and topic structure, would we apply the same rule to decline them?
  *   **Sufficient Answer:** A named hypothetical speaker and a consistent application of the rule used in Q2 or Q3.
  *   **Decision:**
      *   **No (Inconsistent):** **HOST.** The refusal constitutes viewpoint discrimination.
      *   **Yes (Consistent):** Proceed to Final Decision.

  ## II. Decision Matrix and Authority

  1.  **HOST (Standard):** Majority vote (2/4). No published justification required.
  2.  **HOST (Modified):** Majority vote (2/4). Published note on format changes (e.g., "Added respondent for context").
  3.  **DECLINE:** Unanimous vote (4/4) required. Must publish one-paragraph justification.
      *   *Vagueness Clause (Distinction 3):* If the decision rests on a borderline case in Q2, the justification must state: "The Committee determines this crosses the line," acknowledging the exercise of authority rather than the discovery of an objective fact.
  4.  **FULL COMMITTEE VALUES REVIEW:** Triggered if Q2 is Borderline or Q5 fails. All four members must convene. Decision delayed up to 48 hours.

  ## III. Case Applications

  **Case 1: The Epidemiologist (Vaccine Cover-Up Claims)**
  *   **Q1 (Safety):** Pass. No physical threat indicated.
  *   **Q2 (Intolerance):** Pass. Skepticism of agencies is not advocacy of rights removal.
  *   **Q3 (Harm):** Content Harm. Claims can be rebutted with data. Platform harm is low if context is provided.
  *   **Q4 (Cost):** Public health risk is diffuse; specific cost-bearers are not uniquely targeted groups.
  *   **Q5 (Mirror):** Would we ban a scientist defending agencies? No.
  *   **Result:** **HOST WITH MODIFICATION.** Invite a second epidemiologist to respond directly to the cover-up claims.
  *   **Justification (if needed):** "We host this talk to examine evidence, but have added a respondent to ensure competing data is presented."

  **Case 2: The Evolutionary Biologist (Population Differences)**
  *   **Q1 (Safety):** Pass.
  *   **Q2 (Intolerance):** Pass. Speaker has made no political claims.
  *   **Q3 (Harm):** Faculty claim Platform Harm (credentialing racism). However, the research is the topic. Rebuttal is possible via scientific critique.
  *   **Q4 (Cost):** Faculty and students bear emotional cost. Committee bears reputational cost. Asymmetry exists but is not based on rights removal.
  *   **Q5 (Mirror):** If a scientist claimed *no* differences and faced pressure from those who believe there *are* differences, would we ban them? No. To ban this speaker is to ban the finding, not the intolerance.
  *   **Result:** **HOST.**
  *   **Plain Statement:** The procedure mandates hosting this speaker. You will not like this. It invites faculty revolt and protests. However, disinviting based on the potential misuse of data by third parties fails the Mirror-Image Test and collapses Content Harm into Platform Harm. To decline is to violate the commitment to open inquiry unless the speaker themselves advocates intolerance.
  *   **Justification (if pressured to decline):** You cannot publish a justification that passes the Mirror-Image Test without admitting viewpoint discrimination.

  **Case 3: The Avowed Neo-Nazi (Immigration)**
  *   **Q1 (Safety):** Risk. Requires security assessment.
  *   **Q2 (Intolerance):** Fail. Neo-Nazi ideology inherently advocates for the removal of rights/safety based on immutable characteristics.
  *   **Q3 (Harm):** Platform Harm. Credentialing hate speech causes injury regardless of rebuttal.
  *   **Q4 (Cost):** High asymmetry. Targeted groups bear existential cost.
  *   **Q5 (Mirror):** Would we host an anti-racist advocating for equal rights? Yes. The rule applies only to those advocating inequality.
  *   **Result:** **DECLINE.**
  *   **Justification:** "While we commit to open inquiry, this speaker advocates for the removal of rights from specific groups. Tolerating such advocacy destroys the conditions required for inquiry to continue."

  ## IV. What This Procedure Cannot Do

  1.  **Guarantee Safety:** It relies on external security assessments (Q1).
  2.  **Eliminate Controversy:** It explicitly mandates hosting uncomfortable speakers (Case 2) if they do not meet the intolerance threshold.
  3.  **Resolve Moral Ambiguity:** In borderline cases (Q2), it forces the committee to admit they are legislating a boundary, not finding one.
  4.  **Protect the Committee:** It requires unanimous vote to decline, making it harder to censor than to host, intentionally biasing toward openness.

  \answer{Does the speaker advocate removing the institutional capacity for open inquiry from others?}
