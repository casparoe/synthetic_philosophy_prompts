  Your skepticism regarding Turkey is well-founded within this framework. While there have been civil society initiatives in Istanbul (such as informal memory walks or private plaques regarding 1915), these lack state sanction and often operate under legal threat (e.g., Article 301 prosecutions). State-sponsored monuments in Turkey predominantly reinforce nationalist founding myths rather than creating spatial dissonance regarding the Armenian Genocide. Since your axis implies institutional commitment, Turkey scores a 1; civil society gestures do not compensate for active state erasure.

  **The Archival-Curricular Mismatch**
  The most significant mismatch appears in the **American South**. There is a divergence between axis (a) and axis (b). Due to broad Freedom of Information laws and robust record-keeping traditions in the U.S., archival transparency regarding slavery and segregation is relatively high (score 4); the raw data exists and is accessible. However, this does not line up with axis (b), where curricular embedding is fragmented and often restricted by state legislation prohibiting "divisive concepts." The archives are open, but the political will to mandate critical engagement with those archives in schools lags significantly behind.

  ### Overall Analysis
  Germany remains the benchmark for this framework, showing consistency across all three axes. The American South ranks second not because it has successfully resolved its history, but because the *contestability* of memory (removing statues, debating curricula) indicates an active, albeit painful, reflexive process supported by open archives. Japan ranks lower due to state-level sanitization of textbooks and the continued official veneration of war criminals at Yasukuni, which contradicts critical remembrance. Turkey ranks last due to codified state denial across all three categories.

