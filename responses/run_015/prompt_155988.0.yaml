  **LOT 42**

  **ATTRIBUTED TO JOHANNES VERMEER (DELFT 1632-1675) / HAN VAN MEEGEREN (DEVENTER 1889-1947)**
  **Study after Vermeer, c. 1665/2023**
  **Oil on canvas, relined.**
  **£4,000,000 - 6,000,000**

  **PROVENANCE**
  Private Collection, Switzerland; acquired from the artist, 1945.
  Thier heirs; sold Christie's, London, 1978 (as 'Circle of Vermeer').
  Private Collection, New York, 1980-2023.

  **LITERATURE**
  *Journal of Conservation Ethics*, Vol. 12, "The Palimpsest Market," 2024.

  **CATALOGUE NOTE**
  This exceptional work represents a singular moment in the history of attribution, offering the discerning collector a unique opportunity to acquire a object whose value is derived not from static origin, but from dynamic narrative instability. Initially catalogued in the mid-20th century as a competent pastiche by Han van Meegeren, technical analysis in 2023 revealed the presence of a genuine Vermeer underlayer beneath the forgery. Tragically, during the subsequent conservation process, the solvent required to separate the layers inadvertently dissolved the original 17th-century study entirely. What remains is the 20th-century overpaint, now functioning as the sole vessel for the destroyed 17th-century essence.

  This condition invites a reevaluation of traditional provenance. We propose the framework of "reverse provenance," wherein value accumulates not by tracing ownership backward to the artist, but by tracking the chain of misattributions forward through the market. Each error, each failed authentication, and each legal dispute adds a layer of commercial history that stabilizes the price despite the physical loss of the original. The forgery is no longer a fake; it is a monument to the market's ability to sustain value through belief alone. The destruction of the Vermeer is not a diminution of the lot, but a consolidation of its ontological status.

  *Legal Precedent: In the landmark 2024 case *The Estate of Van Meegeren v. Rijksmuseum*, the High Court ruled that a destroyed original remains legally "present" within the copy that effected its destruction. The judge noted that the copy now holds the "rights of absence," allowing the overpaint to be sold as the original for insurance and resale purposes. This ruling solidifies the lot's status as a genuine Vermeer study, albeit one mediated through the hand of the forger.*

  **CONDITION REPORT**
  The canvas is stable. There is some loss to the lower quadrant resulting from the 2023 solvent incident, which our specilist advises should be viewed as integral to the work's history rather than damage. The craquelure is consistent with the 1940s, though the spirit of the piece is unequivocally 1665.

  **A NOTE TO COLLECTORS**
  This lot is particularly recommended for collectors interested in ontological ambiguity and negative authenticity. It pairs well with works that possess unstable being, such as digital NFTs with deleted source files or sculptures melted down for bullion. The buyer acquires not merely a painting, but the ghost of a valuation. In an era where truth is increasingly fluid, this work offers a secure investment in the uncertainty itself. The market has spoken, and it values the story over the pigment. We anticipate strong interest from institutions seeking to diversify thier holdings with assets that challenge the very definition of presence.

