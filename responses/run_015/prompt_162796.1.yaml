answer: |-
  You are describing a classic cluster of intuitions surrounding the **Ellsberg Paradox**, but with some nuanced variations (source dependence, hedging, and value of information) that standard textbook summaries often gloss over. Your gut is telling you that you are an **ambiguity averter** who distinguishes between **aleatory uncertainty** (randomness in the process) and **epistemic uncertainty** (ignorance about a fixed state).

  Here is a precise formulation of a principle that captures the majority of your verdicts, followed by an honest accounting of where it forces you to revise your intuitions, and how it compares to the standard rivals you'll encounter in the seminar.

  ### The Principle: Robust Stochastic Preference

  > **Formulation:** When choosing between acts, prefer those where the probability of winning is **robust** to unknown states of the world. Where robustness is equal, prefer acts where the uncertainty is grounded in a **known stochastic mechanism** (aleatory) or a **known fixed composition**, over acts where the uncertainty arises from an **unknown fixed composition** generated by an **opaque process**.
  >
  > **Operational Rule:**
  > 1.  **Calculate Robustness:** Does the probability of winning remain constant across all possible configurations of the unknown variables? If yes, treat as Risk (0.5).
  > 2.  **Assess Grounding:** If robustness is not guaranteed, does the probability derive from a known physical mix or a verified random generator? If yes, treat as Risk.
  > 3.  **Apply Discount:** If the probability derives from an unknown fixed mix with no verified generator, apply an ambiguity discount (act as if the probability is lower than the midpoint).

  ---

  ### Verdicts on Your Cases

  Here is how **Robust Stochastic Preference (RSP)** applies to your specific scenarios.

  | Case | Setup | Your Intuition | RSP Verdict | Match? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Standard Ellsberg (Red)** | Take K | Take K (M is unknown fixed) | **Yes** |
  | **2** | **Standard Ellsberg (Black)** | Take K | Take K (M is unknown fixed) | **Yes** |
  | **3** | **Hostile Filler** | Take K (Strong) | Take K (Unknown fixed + Adversarial) | **Yes** |
  | **4** | **Friendly Filler** | Take K (Feels "dumb") | Take K (Unknown fixed is still ambiguous) | **Conflict** |
  | **5** | **Random Machine Filler** | Indifferent | Indifferent (Known stochastic process) | **Yes** |
  | **6** | **Tremor/Physics (K)** | Take K (Slight flicker) | Take K (Known composition > Unknown) | **Yes** |
  | **7** | **Two Urns (Match)** | Indifferent | Indifferent (Robust: P=0.5 regardless of M) | **Yes** |
  | **8** | **Info Purchase ($5)** | Pay $5, still Take K | Pay $5 (Reduces ambiguity), Keep K (Source still opaque) | **Yes** |
  | **9** | **Partial Info (30-30)** | Flip-flop | Take K (Gap narrows, but M still ambiguous) | **Partial** |

  ---

  ### The Cost: Which Intuitions to Sacrifice

  No principle saves every gut feeling. Here is where RSP demands you bite a bullet.

  **1. The Friendly Filler (Case 4)**
  *   **Your Gut:** You take K, but it feels "dumb." You suspect you *should* take M because the filler wants you to win.
  *   **The Principle:** RSP says stick with K. Why? Because "wanting you to win" is a *psychological state* of the filler, not a *stochastic guarantee*. Unless the filler is *forced* by mechanism to fill the urn 50/50, the composition remains epistemically uncertain. You don't know *how* they will try to help (maybe they think Black is lucky?).
  *   **The Revision:** You must accept that your feeling of "dumbness" is actually a conflict between **social trust** and **decision-theoretic rigor**. In a seminar context, the rigorous move is to treat "Friendly" as still ambiguous unless the *mechanism* of friendliness is binding. Stick with K.

  **2. The Tremor Case (Case 6)**
  *   **Your Gut:** You feel a "flicker" but treat it as even odds.
  *   **The Principle:** RSP agrees with taking K over M, but it validates the "flicker." A known composition with a biased draw mechanism is technically less robust than a machine draw.
  *   **The Revision:** Don't suppress the flicker. It is rational. However, compared to the *total opacity* of Urn M, the *partial knowledge* of Urn K (we know the mix, just not the draw physics) is vastly superior. The principle saves the choice, but asks you to acknowledge the risk premium is non-zero.

  **3. The Partial Info Flip-Flop (Case 9)**
  *   **Your Gut:** 30 Red / 30 Black feels sometimes like "nothing" and sometimes like "fine."
  *   **The Principle:** RSP says this is a **degree** issue. The ambiguity interval has shrunk from [0%, 100%] to [30%, 70%].
  *   **The Revision:** You shouldn't flip-flop; you should slide. You should still prefer K (50% is outside the worst-case of 30%), but the *premium* you demand to switch to M should be lower. If the constraint were 49 Red / 49 Black, you should be nearly indifferent. The principle says: **Ambiguity is continuous.** Your flip-flop is just you sensing the threshold where the ambiguity discount becomes negligible.

  ---

  ### The Information Purchase (Case 8)

  You asked if the principle covers the $5 info purchase. **Yes.**

  Under RSP, information has value for two reasons:
  1.  **Instrumental Value:** It might change your choice (e.g., if you see 100 reds in a row, you might switch to M).
  2.  **Ambiguity Reduction:** Even if it doesn't change your choice, it narrows the set of possible priors.

  **Why you pay $5 but still take K:**
  Drawing one ball from M converts a tiny slice of Epistemic Uncertainty into Aleatory Uncertainty. It updates your belief (e.g., via Bayes rule), narrowing the range of likely compositions. This *reduces* the ambiguity discount on M.
  *   **Before:** M is worth (Expected Value - High Ambiguity Penalty).
  *   **After:** M is worth (Updated Expected Value - Lower Ambiguity Penalty).
  *   **Decision:** You pay $5 because the *reduction in penalty* + *updated value* > $5. But even after the update, the *Source Grounding* of M (unknown fixed mix) is still worse than K (known mix). So K remains the choice.
  *   **Seminar Point:** This distinguishes you from an **Info-Averter**. Some ambiguity models suggest people avoid info because it might confirm their fears. You are an **Info-Seeker** who remains **Source-Skeptical**.

  ---

  ### The Matching Case (Case 7) Explained

  Your seminar peer is wrong, and your gut is right. Here is the precise defense you can use:

  *   **The Bet:** Win if (K=Red & M=Red) OR (K=Black & M=Black).
  *   **The Math:**
      *   Let $p$ be the unknown proportion of Red in M.
      *   P(Win) = P(K=R)·P(M=R) + P(K=B)·P(M=B)
      *   P(Win) = $0.5 \cdot p + 0.5 \cdot (1-p)$
      *   P(Win) = $0.5p + 0.5 - 0.5p = 0.5$
  *   **The Principle:** This act is **Robust**. The unknown variable $p$ cancels out algebraically. The probability is 0.5 *regardless* of M's composition.
  *   **Verdict:** Since the probability is robust, RSP classifies this as **Risk**, not Ambiguity. You should be indifferent. Your peer is applying a heuristic ("M is ambiguous, so avoid M") rather than analyzing the *act* itself.

  ---

  ### Standard Rivals to Your Principle

  When you write this up, you should position your view against these two standard frameworks.

  **1. Subjective Expected Utility (SEU) / Savage**
  *   **The View:** You have a single subjective probability for everything. You should be indifferent in Case 1 & 2.
  *   **Why you reject it:** It cannot explain why you prefer K in Case 1 *and* Case 2 simultaneously (that violates the Sure Thing Principle). It also cannot explain why Case 5 (Random Machine) feels different from Case 1 (Unknown Mix) despite identical probabilities.
  *   **Your Edge:** You capture the **Source Preference** that SEU ignores.

  **2. Maxmin Expected Utility (MEU) / Gilboa-Schmeidler**
  *   **The View:** You have a *set* of probabilities (e.g., M could be anywhere from 0% to 100% Red). You evaluate acts by their **worst-case** scenario.
  *   **Why it's close:** It perfectly predicts Cases 1, 2, 3, and 9.
  *   **Where it fails you:**
