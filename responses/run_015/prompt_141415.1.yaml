answer: |-
  You have put your finger on a genuine gap in the standard taxonomy of philosophy of science. Your description is precise, and your skepticism about whether existing labels fit is well-founded. While there is no single, settled term that captures all four features exactly as you describe them, your configuration sits at the intersection of three distinct philosophical conversations.

  Here is the carving you requested: an analysis of the near neighbors, the identification of the load-bearing feature, and a proposal for how to categorize this without distorting the laboratory reality you know best.

  ### 1. The Near Neighbors and Where They Fail

  You are right to sense that Quine, Kuhn, and Kant are "blundering into" the same territory, but from the wrong angle.

  **The Quinean Web (Immunity vs. Embedding)**
  Quine's claim that "nothing is immune to revision" is a logical point about the network of belief. He argues that if an experiment fails, we can choose to save a core principle by adjusting a peripheral one.
  *   **Where it fails:** Quine treats all principles as *propositions* in a web. Your principles are not merely believed propositions; they are *materialized* in the apparatus. You cannot "choose" to revise the constancy of atomic weights in 1890 any more than you can choose to make a balance beam weigh without gravity. Quine misses the *inertia of the instrument*. Your Feature 3 (the plumbing) is absent in Quine.

  **The Kuhnian Paradigm (Decision vs. Inheritance)**
  Kuhn's "paradigm" or Lakatos's "hard core" captures the idea of a protected principle.
  *   **Where it fails:** Both rely on a sociological or methodological *commitment*. A community *decides* to protect the core. You note that nobody could have stipulated otherwise because the principle was built into the data-reduction routines. A graduate student didn't *learn* the constancy of atomic weights as a rule; she learned it as the condition under which the instrument yielded a number rather than noise. Kuhn makes it sound like a conscious treaty among scientists; you describe it as an unconscious inheritance via tools.

  **The Kantian/Friedmanite A Priori (Necessity vs. Contingency)**
  Michael Friedman's concept of the "relativized a priori" is the closest match for Features 1 and 2. He argues that each scientific framework has constitutive principles (like Newton's laws) that make empirical judgment possible, yet these can change over time (to Einstein's laws).
  *   **Where it fails:** Friedman focuses on the *mathematical and conceptual* framework. He does not sufficiently account for the *instrumental* embedding. For Friedman, the shift is in the equations; for you, the shift is in the calibration of the balance. Your principles are "a priori" not because they are conditions of *thought*, but because they are conditions of *operation*.

  **Wittgenstein's Hinge Propositions (Certainty vs. Precision)**
  In *On Certainty*, Wittgenstein describes propositions that "stand fast" for us (e.g., "The earth has existed for many years"). They are not tested because they are the hinges on which our questions turn.
  *   **Where it fails:** Wittgenstein treats these as grammatical or logical certainties. Your principles are empirically fragile. They *do* break, not by logic, but by precision. A hinge proposition doesn't get refuted by better tools; your principles do.

  ### 2. The Load-Bearing Feature

  Of your four features, **Feature 3 (Material Embedding)** is the load-bearing one.

  Features 1 (Untestability) and 2 (Substantivity) are consequences of Feature 3. Because the principle is built into the instrument (the balance, the spectroscope, the calibration routine), it cannot be tested by that instrument (Feature 1). Because it is a constraint on the physical interaction between observer and world, its failure feels like a discovery about nature, not a change in language (Feature 2).

  Feature 4 (Self-Undermining Discovery) is the *historical signature* of this class of principle.

  If you remove Feature 3, you slide back into Kuhn (social agreement) or Carnap (linguistic framework). It is the fact that these principles are **encoded in the hardware and the routine** that makes them distinct. They are not held by fiat; they are held by friction, voltage, and glassware.

  ### 3. Refutation vs. Replacement

  You ask whether the historical replacement of such a principle is genuinely different from its having been refuted.

  **It is different.** Refutation implies the principle was a hypothesis that turned out to be false. Replacement implies the principle was a **scaffold** that turned out to be too coarse.

  When you discovered isotopes, you did not prove that "atomic weights are constant" was *false* in the way you might prove "all swans are white" false. You proved that the *resolution of the practice* had outgrown the *granularity of the principle*. The principle of constant atomic weights was not a lie; it was an approximation that functioned as a absolute within the error bars of the 19th-century laboratory.

  The transition is not **Falsification** (Popper) but **Obsolescence via Precision**. The practice, driven by the principle to seek greater accuracy, eventually achieves an accuracy that the principle cannot accommodate. The principle is not knocked down; it is absorbed as a limiting case (e.g., classical mass becomes a low-velocity limit of relativistic mass).

  ### 4. A Proposed Terminology

  Since there is no settled term that captures the *material* nature of this embedding, I suggest you coin a term for your talk. It will give the group a handle to grasp.

  I propose: **"Materialized Constitutives"**

  **Definition:** A principle that is constitutive of a scientific practice not because it is asserted as a axiom, but because it is embedded in the instrumentation, calibration, and data-reduction routines of that practice. It defines what counts as a measurement within that regime.

  **Boundary Conditions:**
  1.  **Inside the Boundary:** The constancy of the speed of light in special relativity (conceptual), the additivity of mass in gravimetric analysis (instrumental), the independence of measurement context in classical mechanics (instrumental/conceptual).
  2.  **Outside the Boundary (The "Violations"):**
      *   *Pure Conventions:* Choosing Celsius over Fahrenheit. (This is a decision, not embedded in the physics of the thermometer).
      *   *Pure Hypotheses:* "This sample contains chlorine." (This is tested *by* the practice, not *for* the practice).
      *   *The Breaking Point:* You mentioned the case where improving accuracy violates the principle. This is the critical boundary case. When the error bars shrink below the variance of the isotopes, the "Materialized Constitutive" (constant weight) ceases to be a constitutive and becomes a **source of systematic error**. At that exact moment, the principle moves from being the *condition of measurement* to being an *object of measurement*.

  ### 5. Summary for Your Talk

  If I were in your position, I would structure the argument this way:

  1.  **Acknowledge Quine:** Quine is right that these principles are revisable. But he is wrong about *how*. He thinks we revise them to save the theory. You revise them because the *tools* demand it.
  2.  **Introduce the Category:** These are not analytic truths, nor are they synthetic hypotheses. They are **Materialized Constitutives**.
  3.  **The Mechanism:** They live in the "plumbing" (Feature 3). They are the silence behind the noise of the instrument.
  4.  **The End Game:** They are not refuted; they are outgrown. The discovery of isotopes didn't show chemists were wrong; it showed their balances had become too good for their assumptions.

  You are not inventing a category on the spot; you are describing the **metabolism of scientific practice** which abstract philosophy often misses. The literature that comes closest to this is found in the work of **Hasok Chang** (on epistemic iteration and measurement) and **Michael Friedman** (on the dynamics of reason), but neither emphasizes the *instrumental* embedding as strongly as your experience dictates. You are justified in claiming this distinction.
