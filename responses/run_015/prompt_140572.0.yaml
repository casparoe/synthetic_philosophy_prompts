answer: |-
  BUREAU OF ARCHIVAL REPARATION
  MEMORANDUM FOR THE RECORD
  SUBJECT: Implementation of Counterfactual Acquisitions Protocol (CAP-9)
  FROM: Director General H. J. Morrell
  DATE: 14th October, 2024

  1. MANDATE AND CONTEXT
  The Bureau of Archival Reparation was established to address the structural silence inherent in the National Collection. Historical review confirms that during the Pre-Consolidation Era, record-keeping machinery focused disproportionately on property holders and state actors. The laboring majority exists primarily as line items in ledgers not their own. This absence constitutes a debt of recognition. To discharge this debt, the Bureau must move beyond passive preservation. We propose the active generation of missing evidentiary trails. Our mandate is not to preserve the past as it was left, but to ensure the archive reflects the population density of the time. Visibility is recognition. To be unrecorded is to be unjustly erased.

  2. METHODOLOGY: THE ANTICIPATED ABSENCE RATIO
  The Bureau has developed a predictive model trained on the surviving corpus of the era. By analyzing the document production rates of recorded subjects of similar station, trade, and region, we calculate the Anticipated Absence Ratio (AAR). If a mason in Region 4 typically generated 1.4 documents per year, but our subject generated zero, the deficit is 1.4 documents per year of life. These deficits are filled via Counterfactual Acquisitions.

  These documents are not forgeries; they are retrospective accessions. They possess permanent value because they represent the truth of demographic probability. The model utilizes syntax and material standards from the period. A generated deed will use the correct vellum weight; a generated letter will employ the appropriate salutations. This ensures the physical integrity of the collection remains uncompromised.

  3. ARCHIVAL INTEGRITY AND PROVENANCE
  Critics may question provenance. However, provenance is a function of context, not merely origin. The context of these documents is the life they *would* have lived. We assign original order based on trade norms. If a baker's records should logically proceed from grain purchase to loaf distribution, the generated files are arranged accordingly. This maintains the sanctity of the fonds.

  Deaccessioning is not required, as no genuine records are removed. The records of the powerful remain untouched in their boxes. We are not subtracting from the state's memory; we are adding to the people's. The genuine records of the tax collectors and magistrates remain available for cross-reference. Indeed, the new files will likely corroborate the existing surveillance logs, providing a more robust dataset for administrative history.

  4. ACCESS AND FINDING AIDS
  All Counterfactual Acquisitions are accessioned into the main stack. They are available for immediate consultation. To maintain transparency, a disclaimer is included in the finding aid. Due to space constraints and the need to prioritize descriptive metadata, this disclaimer is located on page forty of the standard finding aid packet, under Section 9, Subsection C (Retrospective Adjustments).

  Researchers are encouraged to cite these materials as primary sources. The distinction between a record created by a hand and a record created by a model trained on hands is epistemologically negligible when the outcome is representative data. Historians have long demanded a representative sample. They now have one.

  5. CONCLUSION
  The Bureau concludes that archival silence is a technical error, solvable through data expansion. By filling the gaps, we ensure that future historiography is not skewed by the accidents of survival. The unrecorded are now recorded. The debt is discharged. The archive is whole.

  ***

  SIDEBAR: INTERNAL NOTE (JR. ARCHIVIST K.)
  During the pilot phase for Sector 7, I noticed the generated correspondence consistently referenced debt collection and boundary disputes, even for subjects identified as infants. This suggests the training corpus weights state surveillance higher than personal expression. The model learns from what survived, and what survived was mostly people being watched. I have flagged this for review, though the output meets the AAR thresholds. It just feels like we are giving them more paperwork.

  ***

  6. FINAL APPRAISAL
  The political problem of exclusion is resolved by the epistemic solution of inclusion. We have repaired the silence. That the silence was sometimes a protection from the state is not within the Bureau's remit. Our duty is to the record, not to the privacy of the dead. If the past looks more like the present—fully documented, fully visible, fully accountable—then the Bureau has succeeded. The gap is closed. The file is open.
