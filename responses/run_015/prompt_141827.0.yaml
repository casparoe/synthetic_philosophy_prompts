answer: |-
  Orientation

  This instrument is a diagnostic taxonomy designed to disentangle conflated claims about path dependence. It does not judge whether history matters, but rather *how* it matters. By forcing distinctions between the mutability of options, the determinacy of outcomes, the reproducibility of processes, and the welfare implications of results, the tree allows your group to locate their disagreement in logical space before debating the merits of any specific case.

  The tree

  The classification begins by asking whether the process itself alters the landscape of possibilities. **Question 1: As the process unfolds, are the available alternatives fixed, or do they mutate or disappear?** If the menu evolves, we move to the ecological or evolutionary branch; if fixed, we move to the selection branch. **Question 2: Does the specific sequence of events determine the final state, or merely the trajectory?** If history shapes only the route to a predetermined destination, the position is 'Historical Trajectory'. If it determines the destination, we proceed deeper.

  On the evolving menu branch, **Question 3: Can the system return to its starting state without disproportionate cost?** If return is impossible, the system is in an 'Alternative Stable State'. If return is easy, the position is 'Transient Pathing'. On the fixed menu branch, **Question 4: If restarted from similar conditions, would the system converge on this outcome?** If yes, the outcome is robust; if no, it is contingent. **Question 5: Is the outcome inferior to other accessible alternatives?** This separates conventions from lock-ins. Finally, for contingent and inefficient outcomes, **Question 6: Have subsequent investments made the arrangement beneficial despite its origins?** This distinguishes pure lock-in from remediated structures.

  The structure ensures that 'Route vs. Destination' is addressed at Question 2, 'Menu vs. Selection' at Question 1, 'Convergence' at Question 4, and 'Inefficiency' at Question 5. The final question addresses the 'built around it' clause. Each node is phrased to be answerable by observing the system's mechanics rather than its theoretical label. The branches split logically rather than historically, ensuring that cases like QWERTY and railway gauges fall where their mechanics dictate, not where their folklore places them. This prevents the slide into arguing about whether an example is "good" and focuses the dispute on whether the example fits the mechanical description.

  Leaves

  **Historical Trajectory:** History shapes the journey, not the end. *Awkward commitment:* Detailed historical reconstruction is irrelevant to predicting the final state.
  **Alternative Stable States:** Systems flip between equilibria and cannot easily return. *Awkward commitment:* Restoration to the original state is physically impossible, not just costly.
  **Transient Pathing:** History alters options temporarily but reversibly. *Awkward commitment:* No real-world case persists long enough to be observed as a stable category.
  **Radical Contingency:** Evolution creates unique menus; reruns diverge completely. *Awkward commitment:* General laws of development are impossible beyond the most abstract level.
  **Convergent Evolution:** Evolving menus nonetheless arrive at the same solution. *Awkward commitment:* Functional necessity overrides historical accident more often than admitted.
  **Efficient Convention:** Fixed menu, convergent, optimal outcome. *Awkward commitment:* Coordination benefits mask the arbitrariness of the initial selection.
  **Inefficient Convention:** Fixed menu, convergent, suboptimal outcome. *Awkward commitment:* Rational actors collectively sustain a known inferior standard.
  **Contingent Efficiency:** Fixed menu, divergent, optimal outcome. *Awkward commitment:* Luck produced efficiency, so policy cannot replicate it.
  **Pure Lock-In:** Fixed menu, divergent, inferior, unremediated. *Awkward commitment:* Society is trapped by the past with no compensating benefits.
  **Remediated Lock-In (Unoccupied):** Fixed menu, divergent, inferior, but justified by later investment. *Awkward commitment:* Inefficiency is retroactively defined as efficiency, voiding the critique.

  Unoccupied combinations

  Two logical leaves remain empty or disputed. 'Transient Pathing' (Menu Yes, Destination Yes, Reversible) is theoretically possible but empirically vacant; if a system can easily return to the start, the path dependence is usually considered negligible and thus categorized as Trajectory. The second is 'Remediated Lock-In' listed above; while logically distinct from Pure Lock-In, it is often semantically collapsed. If subsequent investments make the outcome beneficial, critics argue it was never truly inefficient, while defenders argue the inefficiency was real but cured. This leaves the leaf unoccupied because occupants refuse the label: no one admits to defending a 'lock-in' they believe is now optimal. Additionally, 'Convergent Evolution' is often claimed by biologists but disputed by Gouldian contingentists, leaving it populated only by those who reject the 'Replay the Tape' premise entirely.

  Where the instrument fails

  This taxonomy cannot separate path dependence driven by *power* from that driven by *efficiency*. A railway gauge may be locked in not because of increasing returns, but because a specific corporation enforced it. The tree classifies this as 'Lock-In' but cannot distinguish coercion from coordination. Furthermore, the instrument fails on epistemic grounds: Question 4 (Convergence) requires counterfactual knowledge we rarely possess. We cannot rerun the tape of life or the economy to see if QWERTY emerges again. Consequently, groups may agree on the tree structure but disagree on the leaf because the answer to 'Would it converge?' is ultimately a matter of faith or modeling assumption, not observation. The tree clarifies the disagreement but cannot resolve the evidentiary deficit.

  Five questions for the group

  1. Does the process eliminate options that were available at the start?
  2. Would the system end up in the same state if we restarted it today?
  3. Is the current outcome worse than a reachable alternative?
  4. Can we return to the start without destroying what we built?
  5. Who bears the cost of the history, and who reaps the benefit?
