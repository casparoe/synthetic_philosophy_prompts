answer: |-
  Here is a proposal for the session that attempts to stage the tension without relying on a contested predictor, forcing the conflict into the open through a mechanism of binding policy and optional veto. The core idea is to separate the adoption of the policy from the execution of the action, and to make the reward contingent on the integrity of the policy rather than the outcome of the chance event. You will need to prepare one envelope per student containing two slips of paper labeled Heads and Tails, along with a supply of chocolates or a ledger for course points. The session begins with fifteen minutes of setup where you explain that this is a game about consistency rather than luck. Each student must write down a decision for both Heads and Tails on their respective slips, choosing either to Pay which costs them one chocolate or Keep which costs nothing. They must seal these slips in the envelope without showing anyone. This is the policy selection phase and it represents the ex-ante standpoint. You should emphasize that they are free to choose any combination they like, such as Paying on both or Keeping on both, and that this choice is final once the envelope is sealed.

  Once the envelopes are collected and shuffled, you proceed to the chance phase which takes about five minutes. You flip a coin publicly and let us assume it lands on Tails. You announce that Tails is the loss branch, meaning that if their slip says Pay they must hand over a chocolate, whereas if it says Keep they pay nothing. You then return the envelopes to the students and ask them to open them and look only at the Tails slip. This is the moment of update where they learn their location in the decision tree. Now comes the critical staging maneuver to address your worry about the reason to pay evaporating. You announce that they have a one-time option to Veto their Tails instruction. If they exercise the Veto, they do not have to pay the chocolate even if their slip says Pay. However, you must add the crucial rule that exercising the Veto disqualifies them from the Disposition Dividend. The Dividend is a reward of five chocolates paid to any student whose Heads slip says Pay, provided they did not Veto their Tails instruction. You make it clear that the Dividend is paid by you from a separate fund to simulate the counterfactual reward that would have existed in the Heads branch. This creates the conflict you need. The updateful student sees they are in the Tails branch, knows the Heads branch is impossible, and sees the Dividend as money for nothing that depends on a counterfactual they can no longer influence, so they Veto to save the immediate cost. The updateless student sees the Dividend as the realization of the value of having been the sort of agent who Pays, and honors the slip to claim it, accepting the immediate loss to maintain policy integrity.

  The execution and counting phase should take about ten minutes. Students indicate whether they Veto or Honor. You collect the costs and distribute the Dividends. You will likely see a split in the room, which is exactly what you want. Some will feel foolish for paying the cost when the Heads branch didn't happen, and others will feel foolish for losing the Dividend to save a single chocolate. This emotional residue is the data for your debrief which should occupy the next twenty-five minutes. You start by mapping the envelope sealing to the initial standpoint of UDT. The policy was a function of evidence mapping observations to actions, and the evaluation happened at the moment of sealing. The Veto option represents the updateful temptation to re-evaluate the action based on new evidence. The Disposition Dividend represents the counterfactual value that UDT claims is real because it was accessible from the prior standpoint. You must explicitly address the awkward question of where the initial standpoint comes for an agent that was never behind a veil. You can point out that in the game the veil was artificial, but in real life the veil is the logical fact that the agent exists as a single entity across possible worlds. The agent does not need to forget evidence but must treat their decision as determining the output of a function that exists in all branches.

  Someone will certainly object during this debrief that the connection between the Veto and the Dividend is merely a rule you imposed, whereas UDT requires a logical connection. You should meet this honestly by admitting that the activity cannot reproduce the metaphysical link and that you supplied it via the Dividend rule to make the incentive structure visible. The activity demonstrates the payoff structure of UDT but not the justification. The justification requires the claim that the agent in the Tails branch and the agent in the Heads branch are the same algorithm, so changing the output in Tails implies changing the output in Heads logically. You will have to supply this in your own words because the game mechanics can only simulate it through contract enforcement. This is the limitation of any physical staging of a logical theory. You should validate this objection as the central philosophical disagreement. The updateful student says the rule is arbitrary because the Heads world is gone. The updateless student says the rule is necessary because the policy is the unit of agency. The game forces them to pick a side based on their intuition about whether the Dividend was theirs to lose.

  For the closing phase of ten minutes, you replace the chancy device with a mathematical proposition to shift the uncertainty from empirical to logical. Ask them to take a new slip and write Pay or Keep for the proposition The tenth digit of Pi is even. They do not know the answer yet. They seal this in a new envelope. Then you allow them to use their phones to look up the digit. Suppose it is odd. This is the loss branch. They open the envelope. If they wrote Pay they owe a chocolate. You offer the same Veto option. If they Veto they save the chocolate but forfeit a Dividend that is contingent on the digit being even. The tension should feel different here. The digit being even is a necessary truth or falsehood, not a contingent chance event. If it is false, it is impossible. Yet if they wrote Pay, they committed to a policy that would have paid off if the math were different. This tests whether they treat logical impossibility differently from empirical impossibility. Most will feel the pull of UDT more strongly here because the mathematical truth was fixed all along, mirroring the logical connection UDT relies on. You ask them if the case still goes through. If they say yes, they have accepted that logical uncertainty is the proper domain for decision theory. If they say no, they have identified a boundary condition for the theory.

  There are three things that will predictably go wrong the first time you run this. First, students will try to cheat by changing their slips after seeing the coin flip. You must handle this by collecting the envelopes yourself and only returning them for viewing, not editing, or by having them sign the slips. If you rely on the honor system, assume some will cheat and use it in the debrief as an example of the difficulty of binding one's future self. Second, students will argue that the Dividend rule is arbitrary and therefore irrational to pursue. You should not argue back but instead write their objection on the board as the Evidential Objection. This validates their intuition while categorizing it. Third, the timing may overrun because the debrief on the initial standpoint can become metaphysical. You must keep bringing them back to the slips in their hands. When they ask where the prior standpoint comes from, ask them when they felt most free to choose. They will say at the sealing. That is the standpoint. The rest is just execution. By keeping the focus on the physical artifacts of the game you prevent the discussion from drifting into abstract semantics before they have internalized the mechanical tension. The goal is not to convince them UDT is true but to make them feel the cost of updating, and this staging ensures that cost is paid in chocolate and points rather than just confusion.
