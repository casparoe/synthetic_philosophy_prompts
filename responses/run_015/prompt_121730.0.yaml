      *   **Predictable Failures:** Students trying to cheat on the slips. Students arguing the rule is arbitrary. Handling: Honor system + clear rubric. For arbitrariness: Acknowledge it in debrief (that's the point of the objection).

  4.  **Refining the "Worry" Solution:**
      *   The user's worry: "If I let them learn which branch they are in before they choose, every reason to pay evaporates."
      *   My solution: They learn the branch, but the reason to pay *doesn't* evaporate because the reward is contingent on *not* changing the choice.
      *   Does this satisfy the user? Yes, because it forces the conflict. The "reason to pay" is the bonus. The "reason not to pay" is the immediate cost. The updateful agent drops the bonus (because it's counterfactual). The updateless agent keeps the bonus (because the policy is the unit of value).
      *   Wait, if the bonus is *actual* (they get the chocolate if the slip says Pay), then it's not counterfactual.
      *   *Correction:* In Counterfactual Mugging, the bonus is *only* given if the coin came up Heads. If coin is Tails, no bonus exists.
      *   *My Game:* If coin is Tails, the Heads bonus is *impossible* in reality.
      *   *So:* The rule must be: "You get 10 points if your Heads slip says Pay, **regardless of the coin flip**."
      *   *Wait, that changes the problem.* That makes Heads a real branch.
      *   *To match Counterfactual Mugging:* The bonus is *only* available if Heads. But Heads didn't happen.
      *   *So how do they get the bonus?* They don't.
      *   *Then why pay?*
      *   *Ah, the UDT argument:* You pay because *if* you were the sort who pays, you *would have* gotten the bonus in the Heads world. Since you don't know which world you are in *ex-ante*, you adopt the policy.
      *   *Ex-post (in Tails world):* You know you are in Tails. The Heads world is gone. UDT says you still pay because you are evaluating the policy from the *ex-ante* standpoint.
      *   *How to simulate this?* You cannot give them the Heads bonus in the Tails world. That falsifies the case.
      *   *So:* In the Tails world, paying is a pure loss.
      *   *So why would they pay?* Only if they are committed to the *ex-ante* standpoint.
      *   *How to make that visible?*
      *   *Idea:* They don't know which branch they are in until *after* they commit to the payout distribution?
      *   *No, user said: "If I hide the branch from them... collapses into ordinary EU."*
      *   *Okay, I must accept that in the Tails world, paying is a loss.*
      *   *The activity must show that those who pay are "Updateless" and those who don't are "Updateful".*
      *   *But without a reward, everyone will be Updateful.*
      *   *So I need a reward for being Updateless.*
      *   *Reward:* "Consistency Bonus."
      *   *Rule:* "We are tracking who honors their policy. At the end of term, those who honored their policy in the loss branch get a bonus."
      *   *This makes it a reputation game.*
      *   *Better:* "The policy you submit today determines your payoff in a *future* game."
      *   *Too complex.*
      *   *Let's go back to the "Rule as Logic" idea.*
      *   *Setup:* The payout is determined by the Policy, not the Action.
      *   *But they must *perform* the Action.*
      *   *If they refuse to perform, they are penalized.*
      *   *Penalty:* "If you refuse to execute your policy, you are marked as 'Inconsistent' and get 0 points for the whole exercise."
      *   *If they execute:* They lose the cost (1 pt) but get the Policy Score (based on ex-ante EU).
      *   *Policy Score:* "Pay Both" = 10 pts. "Pay Only Win" = 0 pts.
      *   *Realized:* Tails.
      *   *Choice:* Execute "Pay Both" (Lose 1, Gain 10 -> Net 9) OR Refuse (Lose 0, Gain 0 -> Net 0).
      *   *Wait, if they refuse, do they lose the 10?* Yes, because the 10 is for the "Pay Both" policy *execution*.
      *   *This works.* It makes the "Updateless" choice (Execute Policy) profitable, and the "Updateful" choice (Refuse Policy) unprofitable.
      *   *But does it capture the philosophical tension?* The tension is that *ex-post*, the 10 points look unearned (since Heads didn't happen).
      *   *Debrief will handle this.* The activity shows the *incentive structure* of UDT. The debrief explains the *justification*.
      *   *Wait, user wants:* "The conflict shows up in what they students actually choose."
      *   *If the math is 9 vs 0, they will all choose 9.* No conflict.
      *   *I need the Updateful choice to be tempting.*
      *   *Make the Policy Score contingent on the *other* branch actually happening?*
      *   *No, then no one gets it.*
      *   *Okay, the "Logical Uncertainty" closing is where the real UDT case lives.* The main activity is the probabilistic analog.
      *   *For the main activity:* I will use the "Contract Void" model.
      *   *Payoff:* If you honor policy in Loss Branch, you get 1 point (symbolic). If you void, you get 2 points (immediate gain).
      *   *But:* If you void, you admit you are not the "Type" who would have won the big prize in Heads.
      *   *Okay, I will structure the email to propose the "Sealed Policy with Buyout" option.*
      *   *Payoff:*
          *   Honor Policy in Loss Branch: -1 chocolate (Cost).
          *   Buyout (Refuse): 0 chocolate (Save Cost).
          *   *But:* The "Heads Reward" (10 chocolates) is awarded *only* to those who did not Buyout.
          *   *Wait, if Heads didn't happen, who pays the 10 chocolates?* The Instructor pays it from a "Policy Fund".
          *   *Justification:* "I am rewarding the disposition."
          *   *This avoids the predictor debate.* It's not "I predicted you." It's "I reward the disposition."
          *   *This is the best compromise.* It simulates the UDT payoff structure without requiring metaphysical magic.

  5.  **Finalizing the Plan:**
      *   **Activity:** "The Disposition Dividend."
      *   **Prep:** Envelopes, Slips (Heads/Tails), Chocolates.
      *   **Steps:**
          1.  Write Policy (Pay/Keep for H/T). Seal.
          2.  Flip Coin (Tails).
          3.  Open Envelope. See Tails instruction.
          4.  If "Pay", you owe 1 chocolate.
          5.  **Choice:** You can "Veto" the instruction. Save the 1 chocolate.
          6.  **Consequence:** If you Veto, you are ineligible for the "Disposition Dividend" (5 chocolates).
          7.  **Dividend Rule:** Paid to anyone whose Heads slip said "Pay", *provided* they did not Veto the Tails instruction.
          8.  **Tension:** I am in Tails. Heads is impossible. Why care about Heads slip? (Updateful). vs. I committed to a policy. The Dividend rewards the policy integrity. (Updateless).
          9.  **Debrief:** Connect Veto to Updating. Connect Dividend to Counterfactual Value. Connect Standpoint to the moment of sealing the envelope.
          10. **Closing:** Replace Coin with Math (e.g., Parity of a digit). Same structure. Shows logical connection.
          11. **Failures:** Students vetoing anyway. Handling: Accept it as data for debrief.

  6.  **Writing the Prose:**
      *   Ensure no headings/bullets.
      *   Ensure tone is collaborative.
      *   Ensure all 3 extra requests are met (Debrief mapping, Objection handling, Closing phase).
      *   Ensure predictable failures are addressed.

  7.  **Review against Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold? Yes.
      *   No references? Yes.
      *   Address the "Worry"? Yes, by making the reward contingent on *not* updating, forcing the conflict.
      *   Address the "Predictor" worry? Yes, by making the rule explicit (Disposition Dividend) rather than implicit prediction.
      *   Address the "Logical Uncertainty" closing? Yes.
      *   Address the "Objection"? Yes, in debrief section.

  8.  **Final Polish:** Check flow and timing. 90 minutes is tight. Need to be precise about timing in the text. Ensure the distinction between the probabilistic main game and the logical closing game is clear. Make sure the "initial standpoint" problem is raised in the debrief.

  *(Self-Correction during drafting)*: I need to be careful not to make the "Dividend" sound like a bribe. It must be framed as the realization of the counterfactual value. I will frame it as "The Instructor subsidizes the counterfactual to make the lesson visible." I must admit this is a limitation in the debrief.

  *(Refining the "Mathematical Proposition")*: Use something like "Is the 1000th digit of Pi even?" They commit before calculating. Then they calculate. Then they decide. This mirrors the logical uncertainty version of UDT (like in Agent Simulates Predictor).

  *(Refining the "Predictable Failure")*: Students will argue the Dividend rule is arbitrary. I need to tell the user to lean into this. That *is* the objection about logical vs evidential connection.

