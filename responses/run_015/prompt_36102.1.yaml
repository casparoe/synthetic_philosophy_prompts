answer: |-
  Your observation regarding *The Dawn of Everything* is the key that unlocks the cipher. If the identical methodological criticisms (cherry-picking, teleology, reductionism) are leveled at a book reinforcing the standard narrative of hierarchy (*Sapiens*, *Guns, Germs, and Steel*) and a book explicitly attempting to dismantle it (*The Dawn of Everything*), then the conflict cannot be about the *political valence* of the conclusion. It must be about the *epistemic status* of the claim.

  Your working hypothesis—that the two sides are answering different questions under the single heading of "history"—is correct, but it is too charitable. It implies a simple misunderstanding that could be cleared up with a glossary. The reality is more structural and adversarial. This is not merely a disagreement over questions; it is a collision between two distinct epistemic games with incompatible rules of victory.

  Here is a diagnosis of the structure, a proposal for what progress looks like, and a formulation you can use in your reporting.

  ### I. The Diagnosis: Nomothetic vs. Idiographic

  The quarrel is not about whether the facts are right (though that is the ammunition used); it is about whether the human past is a dataset for deriving laws or a sequence of unique events to be preserved.

  **1. The Synthesizers (Diamond, Harari, Graeber/Wengrow)** are playing a **Nomothetic** game. They seek general laws, patterns, and causal mechanisms that apply across time and space. Their goal is *explanation* in the scientific sense: reducing complexity to manageable variables to make the past predictive or usable for the present.
  *   **What they say:** "We need to understand the *large-scale* structures." "If we cannot generalize, we cannot learn." "The public needs a story to orient themselves."
  *   **Their Standard of Success:** *Resonance and Utility.* Does this framework help us understand the present? Does it offer a coherent causal model?
  *   **Their Blind Spot:** They treat historical data as "points" on a graph. If a specific case study contradicts the model, it is often treated as noise or an exception, rather than a falsification of the model.

  **2. The Academics (Historians, Archaeologists, Anthropologists)** are playing an **Idiographic** game. They seek to describe the particular. Their goal is *understanding* in the hermeneutic sense: reconstructing the specific context, contingency, and texture of a time and place.
  *   **What they say:** "Context is everything." "You cannot compare Neolithic France to Inca Peru." "This generalization erases the agency of the people involved."
  *   **Their Standard of Success:** *Fidelity and Nuance.* Does this account respect the complexity of the archive? Does it acknowledge uncertainty?
  *   **Their Blind Spot:** They often treat any generalization as a violence done to the particular. They lack a language for "good enough" synthesis, leading to the critic's vacuum you identified: "no critic ever spells out what an admissible synthesis would look like."

  **The Hidden Substantive Question:**
  You asked if the target is determinism. It is deeper: it is **reductionism vs. complexity.**
  The academics are charging that the Synthesizers are committing a category error. They are treating *culture* (which is semiotic, symbolic, and contingent) as *nature* (which is causal, law-bound, and predictable). When Graeber and Wengrow were attacked by fellow academics, it was because they were accused of treating archaeological data as political theory rather than material evidence. They were still building a "Grand Narrative," even if the moral of the story was freedom rather than fate. To the specialist, a "Grand Narrative of Freedom" is just as methodologically suspect as a "Grand Narrative of Hierarchy."

  ### II. What Counts as Progress?

  Given this diagnosis, a unified "standard of evidence" is impossible. You cannot ask a novelist and a court stenographer to agree on a standard for describing a crime scene. Therefore, progress will not come from methodological unification.

  **Progress lies in Genre Distinction.**

  The field needs a robust distinction between **History-as-Discipline** (the academic project) and **History-as-Philosophy** (the popular science project). Currently, the Synthesizers market their books as the former to gain authority, while the Academics attack them for failing at the former, ignoring that the public buys them for the latter.

  **The "Plausibility Constraint"**
  To separate permissible synthesis from "just-so storytelling," we do not need a new standard of evidence, but a **Plausibility Constraint**.
  *   **Just-So Story:** A narrative that is internally consistent but insulates itself from counter-evidence by treating contradictions as anomalies or by relying on evidence that cannot, even in principle, be falsified (e.g., claims about the "psychology of early man" without archaeological support).
  *   **Permissible Synthesis:** A narrative that explicitly acknowledges its own heuristic nature. It says, "This is a model to think *with*, not a picture of what *was*."

  **Progress would look like:**
  1.  **Synthesizers** explicitly framing their work as "Political Philosophy using Historical Data" rather than "History."
  2.  **Academics** articulating a positive theory of synthesis. Instead of just saying "this is wrong," they must say, "This is the maximum scale at which a claim can be made without becoming fiction."
  3.  **Reviewers (like you)** stopping the practice of reviewing *Sapiens* as if it were a dissertation. Review it as a work of public intellect, judging it on the coherence of its ideas and the honesty of its limitations, not just its footnotes.

  If this distinction is not made, **no progress should be expected.** The enterprises have different success criteria. The academic succeeds by narrowing the truth; the synthesizer succeeds by widening the audience. They are in a zero-sum game for the label "History."

  ### III. The Fair Formulation

  You asked for a formulation both sides would recognize as fairly stating their position. This is difficult because the conflict is partly about territory (who owns the past). However, both sides generally agree that *misusing the past is dangerous*.

  **The Formulation:**
  > "The disagreement is not about what happened, but about what the past is *for*. Is the primary value of history to preserve the complexity of human experience against the distortions of the present (the Academic view), or is it to extract scalable lessons that allow the present to navigate the future (the Synthesizer view)?"

  **Why this works:**
  *   **The Academic** recognizes their duty to the dead (preserving complexity/nuance). They fear the Synthesizer turns the dead into props for modern political arguments.
  *   **The Synthesizer** recognizes their duty to the living (extraction/utility). They fear the Academic turns the past into a mausoleum where only specialists are allowed to speak.
  *   **The Journalist** recognizes this as the tension between *accuracy* and *relevance*.

  **If they reject this formulation:**
  If the Academics reject this, it reveals their anxiety is about **authority**, not truth (i.e., they fear losing their status as gatekeepers). If the Synthesizers reject this, it reveals their anxiety is about **legitimacy** (i.e., they know they need the shield of "Science/History" to protect their theories from being dismissed as mere opinion).

  ### IV. Reporting Advice

  For your reporting, the most fruitful angle is not to ask "Who is right?" but to investigate the **cost of the synthesis.**

  Every time a Synthesizer draws a line connecting 10,000 years of history, they leave out data. The story isn't that they get facts wrong (though they do); it's that the *act of connecting* creates a causal illusion.
  *   **Ask the Synthesizer:** "What is the strongest piece of evidence that contradicts your model, and why did you decide it was an exception rather than a rule?"
  *   **Ask the Academic:** "If we accept your standard of nuance, what is the largest question about human history that we are *allowed* to ask? If the answer is 'none,' what is the public function of your discipline?"

  The quarrel you have identified is the symptom of a society that desperately wants a "User's Manual for Humanity" (Synthesis) clashing with a profession dedicated to proving that no such manual exists (Academia). The tension is permanent, but it becomes toxic only when one side pretends to be the other.
