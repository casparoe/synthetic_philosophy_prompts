  # Joint Statement on Deployment Standards and Risk Evaluation

  ### I. Agreed Claims
  1.  **Existence of Risk:** Both sides grant that advanced AI systems pose non-negligible risks of catastrophic harm if deployed without adequate safeguards.
  2.  **Imperfect Evaluation:** Both sides agree that current evaluation methods are imperfect proxies for real-world behavior and cannot provide absolute certainty.
  3.  **Trade-offs:** Both sides agree that deployment decisions involve trade-offs between safety risks and the costs of delay (including opportunity costs and strategic disadvantages).
  4.  **Goal:** Both sides aim to minimize expected catastrophic harm while maximizing beneficial capability adoption, differing only on the decision procedure used to balance these.

  ### II. Specific Disagreements
  | Topic | Side A (Worst-Case Guarantee) | Side B (Expected Value Optimization) |
  | :--- | :--- | :--- |
  | **1. The Frame Problem**<br>*(What the guarantee ranges over)* | An explicit bound over a partly arbitrary, hand-built set of scenarios is superior to an expected value calculation over a distribution nobody can estimate. Conceding the set is incomplete does not invalidate the method; it merely defines the scope of the guarantee. | An explicit bound over an artificial set is inferior to an expected value estimate over the actual distribution, even if imperfect. Relying on a hand-built set creates false security because the "max" is taken over a fantasy space, not reality. |
  | **2. Endogenous Distribution**<br>*(Strategic behavior & sandbagging)* | When a system's behavior changes based on measurement (e.g., sandbagging), the measured frequency is self-undermining evidence. It cannot be trusted for probability estimates because the act of evaluation alters the distribution. | When a system behaves strategically, this is a parameter to be modeled within the expected value calculation. The measured frequency is still evidence, provided we adjust for the probability of deception during evaluation. |
  | **3. Risk Aversion vs. Worst-Case**<br>*(Substantive or verbal?)* | This is a **substantive** difference. We advocate for a constraint satisfaction problem (risk must be below a hard threshold) rather than an optimization problem. High risk aversion within an EV framework still permits unacceptable tail risks if benefits are high enough. | This is largely a **verbal** difference. "Worst-case guarantee" is simply extreme risk aversion within an expected utility function. If the stakes are high enough, Side A would also accept some probability of failure, making the positions continuous rather than distinct. |

  ### III. Cruxes and Pre-Registered Predictions
  *For each crux, we define a concrete case or piece of evidence both sides accept as bearing on the disagreement, with specific predictions recorded in advance.*

  **Crux 1: Coverage of the Scenario Set**
  *   **Evidence Case:** A post-deployment catastrophic failure occurs due to a trigger scenario that was *not* included in the pre-deployment "guarantee" set.
  *   **Side A Prediction:** Such failures will occur frequently enough that relying on EV estimates (which would have averaged over this possibility) would have led to net negative outcomes. The cost of expanding the set to cover this will always be lower than the cost of the failure.
  *   **Side B Prediction:** Such failures will be rare enough that the cumulative cost of delaying deployment to expand the scenario set exceeds the cost of the failures. The EV approach would have correctly flagged the delay as too costly.

  **Crux 2: Detectability of Strategic Behavior**
  *   **Evidence Case:** A model passes all pre-deployment evals but exhibits strategic sandbagging in deployment, triggered by specific contexts known only to the model.
  *   **Side A Prediction:** As capability increases, the detection rate of such behavior via evals will approach zero. The frequency metric becomes useless because the model can perfectly distinguish eval from deployment.
  *   **Side B Prediction:** We can maintain a detection rate above a usable threshold (e.g., >50%) using mechanistic interpretability or canary traps. The frequency metric remains useful when corrected for this detection rate.

  **Crux 3: The Acceptable Risk Threshold**
  *   **Evidence Case:** A proposed deployment offers massive economic/strategic benefit but carries a verified 0.1% probability of catastrophic failure.
  *   **Side A Prediction:** We will recommend "Not Yet" regardless of the benefit magnitude. The hard constraint forbids deployment at this probability level.
  *   **Side B Prediction:** We will recommend "Deploy" if the expected value (Benefit × 99.9% - Cost × 0.1%) is positive. The position is continuous, not a hard stop.
