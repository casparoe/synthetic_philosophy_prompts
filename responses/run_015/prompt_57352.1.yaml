answer: |-
  (a) **The Principle: Selective Maintenance Account (SMA)**

  Your "Retentionism" is workable, but to handle the tensions you identified, it requires precise scoping regarding *what* is retained and *why*. I propose the **Selective Maintenance Account**.

  **Clause 1 (Capacity):** Trait token *t* has the capacity to *F*.
  *   *Saves:* 1, 3, 9. Establishes the physical baseline. Without capacity, there is no function (prevents attributing function to broken things that *used* to work, unless we speak of the type).

  **Clause 2 (Type-Identity):** Function attribution applies to the *trait type*, not necessarily the specific token. The token instantiates the type.
  *   *Saves:* 2. The anencephalic heart token does nothing, but the *heart type* is retained in the population. This distinguishes the token's failure from the type's function.

  **Clause 3 (Maintenance Explanation):** The prevalence of the trait type in the relevant population is causally explained, in whole or in part, by the capacity to *F* acting as a filter.
  *   *Saves:* 5, 8, 9. This is the core "Retention" clause. It allows current spreading (5) and clinical filtering (9). It denies function where the filter is absent or unrelated (8: bred for geometry, not startle).

  **Clause 4 (Specificity of Explanation):** The capacity to *F* must be the specific variable screened by the filter, not a correlated byproduct of a different screened capacity.
  *   *Saves:* 4, 6, 7. This distinguishes "Selected For" from "Free Rider." In 7, the chromatin alteration is a byproduct of transcription (which itself may be noise). In 4, if the appendix is a vestige, the flora-harbouring is a byproduct of the tissue's existence, not the cause of its retention. In 6, both functions pass because both are independently screened (vision for lens, metabolism for enzyme).

  (b) **Verdict Conflicts and Necessary Sacrifices**

  The SMA is a two-clause engine (Capacity + Maintenance Explanation) with the Type/Token distinction built in. It is parsimonious, but it forces a collision in your data set.

  **The Collision:** Case 4 (Appendix) vs. Case 5 (Antibiotic Enzyme).
  *   **Case 5:** You grant function based on *current* spreading, ignoring ancestry.
  *   **Case 4:** You deny function despite *current* utility, citing "vestige" (ancestry/original design).
  *   **The Conflict:** If current maintenance explains presence (Case 5), then current utility explaining presence should grant function (Case 4). You cannot hold that *new* traits get function from current utility while *old* traits do not, unless you smuggle history back in.

  **The Sacrifice:** You must abandon the "Vestige" verdict in **Case 4**.
  *   *Argument:* If you grant the hypothesis that the appendix *does* repopulate flora and this *does* contribute to host survival (the filter), then under SMA, it has that function. To call it a "vestige" is to privilege the *origin* of the trait over the *cause of its current retention*. But Case 5 explicitly rejects origin as necessary. If a yesterday's mutation gets function from today's spread, a million-year-old tissue gets function from today's utility.
  *   *Alternative:* If you refuse to budge on Case 4, you must abandon Case 5. You would have to say the enzyme has no "function" yet, only "effect," until it becomes fixed by selection over a longer historical window. But this contradicts your intuition that the work explains the spreading *now*.
  *   *Recommendation:* Abandon the Case 4 verdict. "Vestige" describes history, not current functional status. If it is currently maintained *because* it houses flora, it is functional. If it is maintained *despite* housing flora (drift), it is a vestige. Your hypothesis grants the former.

  **Secondary Tension:** Case 6 vs. Case 7.
  *   SMA handles this via Clause 4 (Specificity). In 6, the refractive capacity is *why* the lens system is retained. In 7, the chromatin alteration is not *why* the DNA stretch is retained (it is "noise"). The principle holds, provided your empirical claim that 7 is "noise" (i.e., not retained *for* that effect) is correct.

  (c) **Classification of Retentionism/SMA**

  SMA is not a genuine third account. It is a **Generalized Etiological Account**.

  *   **Why it is not Causal Role:** Causal Role accounts (Case 7, 4) attribute function to any causal contribution to the system's capacity. SMA explicitly blocks this via Clause 3 (Maintenance Explanation). Mere contribution is insufficient; the contribution must explain retention.
  *   **Why it is not Standard Etiology:** Standard Etiology requires a *past* selection event. SMA allows *ongoing* selection or filtering (Case 5, 9).
  *   **Where the Disguise Fails:** You describe it as "Etiology with the time window widened." This is accurate. Standard Etiology looks at the *origin* of the trait type. SMA looks at the *persistence* of the trait type. Since persistence is just selection continuing into the present, SMA is simply Etiology applied to the present tense. It dissolves the distinction between "selected for in the past" and "selected for now."

  (d) **Verdicts on New Cases**

  Applying SMA (with the recommendation to abandon the strict "vestige" intuition if utility drives retention):

  1.  **Lactase Persistence (Dairying History):**
      *   **Verdict:** Function = Digest Lactose.
      *   **Reasoning:** The trait type is retained in the population *because* of this capacity (cultural/biological co-evolution filter). Clause 3 satisfied.

  2.  **Lactase Persistence (No Dairying History):**
      *   **Verdict:** No Function (regarding lactose).
      *   **Reasoning:** The capacity exists (Clause 1), but the capacity does not explain the trait's retention in that specific population (Clause 3 fails). The allele may be present due to drift or linkage, not lactose digestion. It is a capacity without a function *in that context*.

  3.  **Gene-Drive Construct:**
      *   **Verdict:** Function = Spread (Bias Inheritance).
      *   **Reasoning:** The construct's presence is explained by its capacity to bias inheritance (the drive mechanism acts as the filter). Note: This separates function from *benefit to the organism*. SMA licenses "selfish" functions.

  4.  **Show-Line Dog Dewclaw:**
      *   **Verdict:** No Function.
      *   **Reasoning:** It is retained by a filter (breed standard), but not *for* a capacity it exercises (it does nothing). It is retained for *appearance*. If "looking a certain way" counts as a capacity, one might argue it has an aesthetic function, but biologically/physiologically, it fails Clause 1 (no physiological capacity) and Clause 3 (retention is not due to physiological work). It is an artifact of selection, not a functional trait.

  (e) **Explanatory Power vs. Taxonomy**

  You asked whether this licenses **function explanations** or merely **taxonomy**.

  **Verdict:** SMA licenses **Function Explanations**, but only of a specific logical form: *Persistence Explanations*.

  *   **The Explanation:** "The heart is there *because* it pumps blood." "The plasmid is here *because* it degrades antibiotics."
  *   **The Limit:** It does not license "Developmental Explanations" (how the trait grew) or "Forward-Looking Explanations" (what the trait *will* do). It explains the *presence* of the trait type in the current population.
  *   **The Risk:** The risk of tautology ("It is there because it is retained") is avoided only if Clause 3 (Maintenance Explanation) is empirically falsifiable. You must be able to imagine a world where the trait has the capacity but is *not* retained by that capacity (e.g., Case 8: Moth eyespots have the capacity to startle, but are not retained *for* that).
  *   **Conclusion:** Your principle succeeds in grounding the "doing-versus-failing" distinction (Case 3) because failure is defined as a token's inability to contribute to the capacity that explains the type's retention. It grounds the "function-versus-effect" distinction (Case 7) because effects that do not drive retention are excluded.

  **Final Advisory:** Your intuition in Case 4 is the only point of instability. If you accept Case 5 (current utility grants function to new traits), consistency demands you accept Case 4 (current utility grants function to old traits). "Vestige" is a historical label; "Function" is a maintenance label. Do not conflate them. If the appendix is maintained *because* it helps flora, it is functional, regardless of its evolutionary origin.
