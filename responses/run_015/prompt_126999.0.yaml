  2. "Notes on form and argument"

  The sestina's retrograde rotation enacts the regress of derived intentionality. No end-word holds a privileged first position; *means*, *read*, and *about* shift grammatical roles (verb/noun, preposition/noun) to demonstrate that meaning is slot-dependent, not intrinsic. *Word* functions as a verb in stanza three ("to word"), undermining the idea that symbols possess a fixed, original category.

  Stanza four articulates the Searlean objection: derived symbols ("No derived word") require termination in intrinsic causal powers ("wet and living brain"), otherwise nothing is genuinely *about* anything. Stanza five offers the Dennettian reply: the "user" is merely another layer selected for utility ("useful habits"), where "as-if purpose" constitutes the whole phenomenon without magic. The form mirrors this: the words recycle without ever landing on a foundational "original" stanza.

  The envoi gathers all six terms without resolution. The final line, "No bit has nature till it serves as word," is the crux. A Searlean reads this as false: the bit possesses intrinsic causal powers independent of its service as a word. A Dennettian reads it as true: the bit's nature is constituted entirely by its functional role within the interpretive stance. The poem thus ends precisely where the theories diverge, leaving the artifact's layers suspended between intrinsic power and derived utility.
