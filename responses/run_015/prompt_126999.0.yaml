  1. "The sestina"

  **The Two-Bit Shore**

  Upon the shore the rusted thing **means**
  Nothing until a viewer **read**
  The gauge that holds a single **bit**
  Like signal firing in a **brain**
  Without a voice to speak the **word**
  Or know what state it is **about**

  Is the tide what it is **about**
  Or just the gear that **means**
  To turn the next and speak a **word**
  That only later eyes will **read**
  As thought inside a living **brain**
  Or just another noisy **bit**

  Each layer passes on the **bit**
  And claims no knowledge **about**
  The water rising near the **brain**
  That sits atop the stack to **word**
  The output so the crowd may **read**
  The signal as the system **means**

  No derived **word**
  Can stand alone without a **bit**
  Of causal power truly **read**
  Inside the wet and living **brain**
  Where feeling is the only **means**
  To ground what any state is **about**

  The user is the **brain**
  Selected just to speak the **word**
  By useful habits, not by **means**
  Of magic in a single **bit**
  For as-if purpose is **about**
  All that the design will ever **read**

  So who shall stop to **read**
  The ghost inside the **brain**
  And say what truly is **about**
  When every layer **means**
  To pass along the next **bit**
  Until the final spoken **word**

  If no eye stops to **read** the living **brain**,
  There is no **about** without the **means**,
  No **bit** has nature till it serves as **word**.

