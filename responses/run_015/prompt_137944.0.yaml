  # Adversarial Collaboration Protocol: Moral Emotions in Institutional Design

  ### 1. Shared Premises and Concessions
  Both camps affirm the following claims as the baseline for this collaboration:

  1.  **Domain-Relativity:** Neither guilt nor shame is absolutely superior; efficacy is contingent on institutional goals (e.g., safety reporting vs. moral rehabilitation).
  2.  **Degeneration Risks:** The Guilt-First camp concedes that guilt can degenerate into "ledger failure," where agents treat repair as transactional offsetting, licensing future lapses. The Shame-First camp concedes that shame can degenerate into "vanishing failure," where agents conceal errors to protect status, or become weaponized by audience control.
  3.  **Mechanism Distinction:** Guilt primarily targets the *act* (preserving agent standing); shame primarily targets the *self* (binding agent to relational standards).
  4.  **Internalization:** Both agree that sustainable conduct requires internalization, but disagree on whether internalization arises from owning rules (guilt) or owning identities (shame).
  5.  **Measurement:** Both agree that self-reporting rates and unwatched conduct are valid metrics for evaluating institutional success.

  ### 2. Phenomenological Mapping: Off-Diagonal Cases
  We analyze the four combinations of focus (act vs. self) and audience (present vs. absent) to determine classificatory fit.

  | Case | Focus | Audience | Natural Fit | Cost to Opposing Camp |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard Transgression** | Act | Present | **Guilt-First** | Shame camp must argue audience fear is secondary to self-evaluation. |
  | **Freestanding Guilt** (e.g., survivor guilt) | Act | Absent | **Guilt-First** | Shame camp must stretch "self" to include unchosen affiliations, risking conceptual dilution. |
  | **Public Shaming** | Self | Present | **Shame-First** | Guilt camp must argue status loss is merely instrumental to rule-violation distress. |
  | **Uptake-Insensitive Shame** (e.g., solitude) | Self | Absent | **Shame-First** | Guilt camp must argue this is actually guilt over violating an internalized rule, ignoring the phenomenological sense of "being" rather than "doing." |

  **Analysis:** The Guilt-First camp classifies act-focused cases naturally but struggles to explain why agent-standing matters in solitude. The Shame-First camp classifies self-focused cases naturally but struggles to explain why relational binding persists without an actual audience. Both camps incur theoretical costs when absorbing the off-diagonal cases: Guilt-First must explain non-agentic guilt without invoking identity; Shame-First must explain solitary shame without invoking internalized rules.

  ### 3. Disagreements Table: The Twenty-Five-Year Panel
  The following table outlines the core empirical dispute regarding the matched towns study (Town A: Public Hearings; Town B: Confidential Audits).

  | Crux | Guilt-First Formulation | Shame-First Formulation | Agreed Evidence | Predictions (Decade 2) | Falsification Condition |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Source of Normativity** | Norms are obeyed because they are rational rules owned by the agent. | Norms are obeyed because they constitute the agent's social identity. | Town A (Hearings) shows low reoffending but low self-reporting. Town B (Audits) shows high self-reporting but compliance mindset. | **Guilt:** Town B will show higher honesty in unwatched conditions (tax, private error) because internal compass exceeds audience fear. | If Town B residents cheat significantly when audits cease. |
  | **Mechanism of Repair** | Repair restores the moral balance sheet; the agent remains separate from the act. | Repair restores relational standing; the agent must transform to remain in the community. | Town A victims report higher satisfaction. Town B staff report higher psychological safety. | **Shame:** Town A will sustain norms in unwatched conditions because the "audience" is internalized into identity; Town B will lapse when monitoring stops. | If Town A shows systemic concealment leading to catastrophic failure. |
  | **Institutional Trust** | High trust allows for private accountability; low trust requires public verification. | Public verification builds trust through shared vulnerability; privacy signals distrust. | Town A has higher victim satisfaction. Town B has higher near-miss reporting. | **Guilt:** Town B's high reporting indicates genuine safety culture. **Shame:** Town A's low reporting indicates fear of status loss. | If Town B's near-miss reports correlate with actual error reduction. |

  ### 4. Institutional Choice and Closing Statements

  **Can a Culture Be Chosen?**
  Both camps acknowledge the risk of self-undermining design. Institutions attempting to engineer guilt often produce compliance-shame (fear of being caught breaking the rule). Institutions attempting to engineer shame often produce rule-guilt (performing standards for publication). Furthermore, exportability is limited by selection effects: shame-dominant regimes likely require pre-existing high-trust societies to avoid weaponization. A low-trust society installing public hearings may simply amplify humiliation without restoration.

  **The Verbal Dispute**
  We identify a residual verbal dispute regarding the term "better."
  *   **Guilt-First** defines "better" as *more reliable in producing right conduct* in unwatched scenarios.
  *   **Shame-First** defines "better" as *more likely to constitute the right kind of agent* (one whose identity is bound to the good).
  *   **Joint Agreement:** A third definition, *best to live under*, remains unresolved. Town A residents may feel more bound but less free; Town B residents may feel safer but more alienated.

  **Closing Notes to the Institutions**

  *   **To the Correctional Service:** The Shame-First camp argues that rehabilitation requires identity transformation; public restorative conferences bind the offender to the community they harmed, preventing the "ledger failure" of serving time without moral change. The Guilt-First camp counters that confidential accountability plans protect the agent's standing, allowing reintegration without permanent stigma. **Joint Advice:** If the goal is recidivism reduction via community binding, use restorative conferences *only* if community trust is high enough to prevent weaponization. Otherwise, default to private accountability to avoid vanishing failures.

  *   **To the Patient-Safety Board:** The Guilt-First camp argues that medication errors require act-focused analysis; anonymous reporting ensures near-misses are captured without fear of status loss (vanishing failure). The Shame-First camp argues that open unit meetings make safety a shared identity rather than a compliance checklist. **Joint Advice:** Prioritize anonymous reporting for error capture (guilt-mechanism) but use open meetings for systemic review (shame-mechanism). Do not attempt to engineer shame around individual errors; the selection effect suggests your institution lacks the relational density to sustain it without concealment.

  **Final Sign-off:**
  We agree that the choice is not between guilt and shame as emotions, but between institutional architectures that leverage different motivational structures. The risk lies not in the emotion, but in the mismatch between the institution's trust levels and the vulnerability required by the design.

  *Guilt-First Representative* | *Shame-First Representative*
