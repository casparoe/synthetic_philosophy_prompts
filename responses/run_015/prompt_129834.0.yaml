answer: |-
  Here is the disambiguation menu you asked for. Your friend is likely conflating **Descriptive Relativism** (a fact about the world) with **Normative Relativism** (a rule about how to act), using the former to justify the latter. That leap is where the argument usually breaks.

  Below are the five distinct philosophical readings of "morality is relative," graded by defensibility, utility for your friend's argument, and psychological plausibility.

  ### 1. Descriptive Relativism (The Anthropological Truism)
  *   **The Claim:** Different cultures have different moral codes and practices.
  *   **Defensible?** **Yes.** This is an empirical fact. Some cultures practice polygamy, some monogamy; some value honor killing, some value human rights.
  *   **Does it support "No Outsider Judgment"?** **No.** This is the *Is-Ought Gap*. Just because cultures *do* disagree doesn't mean they *shouldn't* be judged, or that one isn't objectively better. (Example: Cultures used to disagree about whether the earth was flat. The disagreement didn't make truth relative.)
  *   **Do Regular People Mean This?** **Often.** They start here, but they treat it as if it logically forces the conclusion that "no one can judge."
  *   **Verdict:** True premise, invalid inference.

  ### 2. Normative Relativism (The Tolerance Principle)
  *   **The Claim:** We *ought* not to judge or interfere with other cultures' practices.
  *   **Defensible?** **Problematic.** This is a universal moral claim ("You must always tolerate") which contradicts its own spirit. If tolerance is a universal value, then you are justified in judging intolerant cultures (e.g., those with strict caste systems). If tolerance is *not* universal, why should you follow it?
  *   **Does it support "No Outsider Judgment"?** **Yes,** by definition. But it silences the relativist too (they can't judge you for judging them).
  *   **Do Regular People Mean This?** **Yes.** This is usually the *goal* of the argument (please stop criticizing my culture/friends), not the metaethical foundation.
  *   **Verdict:** Self-refuting if stated as a universal rule; coherent only as a personal preference.

  ### 3. Indexical / Contextual Relativism (The "Tall" Analogy)
  *   **The Claim:** Moral predicates like "wrong" are incomplete without a framework parameter. "Slavery is wrong" really means "Slavery is wrong relative to Framework F." Just as "tall" means "tall for a basketball player."
  *   **Defensible?** **Philosophically Strong.** It avoids saying there are no moral facts; it says moral facts are relational. It handles disagreement well (we are arguing about which framework to use).
  *   **Does it support "No Outsider Judgment"?** **Weakly.** It allows you to say, "Relative to *my* framework (Human Rights), your practice is wrong." It doesn't silence criticism; it just clarifies that the criticism isn't "God's eye view" truth. It turns moral debate into a debate about *which framework is better*, not whether the act fits the framework.
  *   **Do Regular People Mean This?** **Rarely.** This is too technical. It requires understanding semantic context.
  *   **Verdict:** The most logically consistent version, but it doesn't give your friend the "conversation stopper" she wants.

  ### 4. Non-Cognitivism / Expressivism (The "Boo/Hurrah" Theory)
  *   **The Claim:** Moral statements aren't truth-apt descriptions of reality; they are emotional expressions. "Caste is wrong" means "I hate caste!" or "Boo caste!"
  *   **Defensible?** **Debatable.** It explains why moral motivation is so strong (emotions drive action), but it fails to explain moral reasoning (we argue about morals as if they are facts).
  *   **Does it support "No Outsider Judgment"?** **No.** If morality is just emotion, I can still express my emotion at your culture. It just means I'm not stating a *fact*. It doesn't make my criticism illegitimate, just non-factual.
  *   **Do Regular People Mean This?** **Almost Never.** Regular people think they are describing reality, not just venting feelings.
  *   **Verdict:** Kills the idea of moral truth, but doesn't necessarily kill the right to criticize.

  ### 5. Radical / Truth Relativism (The "No Universal Standard" Claim)
  *   **The Claim:** There is no fact of the matter regarding moral claims across frameworks. Neither side is "right."
  *   **Defensible?** **Low.** It faces the self-refutation problem: "It is universally true that there are no universal moral truths." It also makes moral progress incoherent (see below).
  *   **Does it support "No Outsider Judgment"?** **Yes.** If there is no truth, judgment is a category error.
  *   **Do Regular People Mean This?** **Yes.** This is the "vibe" of the conversation ender. It's the nuclear option.
  *   **Verdict:** Intellectually unstable, but rhetorically effective.

  ---

  ### The "Moral Progress" Problem
  You asked if any version allows for real moral progress inside a culture without smuggling in universal standards.

  *   **Descriptive & Normative:** Progress is coherent. It means "moving closer to our current ideals."
  *   **Indexical:** Progress is coherent. It means "increasing coherence within Framework F." (e.g., The US becoming more democratic relative to the US Constitution).
  *   **Radical Relativism & Non-Cognitivism:** Progress is **incoherent**. If there is no truth or only emotions, there is no "progress," only *change*. You can't say the abolition of slavery was "better" than slavery, only "different" or "preferred by us now."

  **The Verdict on Progress:** You can have *internal* progress (becoming more consistent with your own rules) without universal standards. You cannot have *comparative* progress (saying Society A is better than Society B) without smuggling in a universal standard to do the comparing. If your friend claims her culture has "progressed" on gender norms, she is implicitly admitting there is a standard she is progressing *toward*, which undermines Radical Relativism.

  ---

  ### What Would Change My Mind & Failure Flags

  Here is where my reasoning (and the philosophical landscape) is most vulnerable.

  **1. The Self-Refutation Flag (Radical Relativism)**
  *   **Weakness:** The strongest argument against Radical Relativism is that it eats itself. If "all truth is relative," is *that* statement relatively true or universally true? If universally, the theory is false. If relatively, then for those of us in the "Universal Truth" framework, it is false.
  *   **What would change my mind:** If a robust model of "truth" could be shown that allows for contradictory truths to exist simultaneously without logical collapse (e.g., quantum superposition applied to semantics). Currently, no such model works for ethics.

  **2. The "Deep Disagreement" Flag (Indexical Relativism)**
  *   **Weakness:** Indexical relativism assumes we can agree on what the frameworks *are*. But often, cultures disagree on the *nature* of the framework itself (e.g., is morality given by God or by social contract?).
  *   **What would change my mind:** If cross-cultural moral convergence happens naturally without coercion. If isolated cultures independently converge on the same norms (e.g., bans on murder, care for children), it suggests a universal standard exists (human nature), undermining the idea that frameworks are arbitrary.

  **3. The Framing of "Judgment" (Your Argument)**
  *   **Weakness:** You might be framing "judgment" as "condemnation." If you frame it as "assessment," the relativist has less ground. However, if "judgment" implies "right to intervene," the relativist has more ground.
  *   **What would change my mind:** If you can demonstrate that *withholding judgment* causes harm. If "tolerance" of caste systems leads to measurable suffering, the Normative Relativist (who values tolerance) must abandon relativism to prevent that suffering. This forces them to admit a universal value (reducing suffering) trumps the relative value (cultural autonomy).

  **4. The Psychological Reality Flag (Non-Cognitivism)**
  *   **Weakness:** I assessed Non-Cognitivism as "regular people don't mean this." But neuroscience might show moral reasoning is post-hoc rationalization of gut feelings.
  *   **What would change my mind:** If moral psychology proves humans are incapable of treating moral claims as objective facts cognitively, even if we speak that way. If we are biologically hardwired to be emotivists, then "truth" in ethics is a fiction regardless of philosophical defensibility.

  ### Summary for Your Friend
  To restart the argument without hitting the wall:
  1.  Ask her: "Do you mean cultures *are* different (Descriptive), or that we *shouldn't judge* them (Normative)?"
  2.  If she says "Shouldn't judge," ask: "Is that a universal rule? If so, you're judging me for judging them."
  3.  If she says "There is no truth," ask: "Did your culture make *progress* on gender norms, or just *change*? If it was progress, what standard were you getting closer to?"

  This forces her to pick a specific reading from the menu, at which point the "conversation ender" loses its power.
