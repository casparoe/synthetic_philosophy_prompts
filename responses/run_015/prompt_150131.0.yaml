          *   *Analysis:* This is the "No Report" paradigm clash. IIT predicts consciousness can exist without report (e.g., dreams, locked-in). But if *verbal report* (a behavior) stays constant while $\Phi$ drops, IIT says the *experience* changed despite the report.
          *   *Crucial Point:* If the substitution preserves the *causal structure* exactly, $\Phi$ doesn't drop. If the substitution makes it feedforward, $\Phi$ drops. If $\Phi$ drops and they still report "I see red," IIT says they are "zombies" regarding that report (the report is a reflex, not an expression of experience).
