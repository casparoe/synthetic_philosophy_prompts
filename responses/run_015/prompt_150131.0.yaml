      *   *Section 2: The Lunchbox.* Acknowledge the absurdity. Explain the "Exclusion Postulate." IIT accepts this. It's a feature, not a bug, for proponents. It forces you to accept consciousness doesn't need an audience. *Rank: Medium (Philosophical bullet to bite).*
      *   *Section 3: The Substitution/Empirical Case.* This is the big one. Distinguish between "functional equivalence" (input-output) and "causal equivalence" (internal mechanism). If internal mechanism changes (becomes feedforward), $\Phi$ drops. If report stays, IIT says report is untrustworthy. *Crucial:* If we can *measure* the drop and the report stays, IIT claims the subject is misleading us (unconsciously). This makes it hard to falsify but also isolates it. *Rank: High.*
      *   *Section 4: Unfalsifiability.* Compare to String Theory or Dark Matter. It posits an unobservable entity (experience) inferred from structure. If structure is hard to measure, theory is shielded. *Rank: Medium-High.*
      *   *Section 5: Existing Evidence.* Cerebellum (Win). PCI/Anesthesia (Win). Cortical vs. Subcortical (Mixed/Win).
      *   *Conclusion/Ranking:* Order them.

  4.  **Refining the "Substitution" Argument (The User's Core Worry):**
      *   The user says: "If the substitution case gives me no grip... I don't know what I ever meant."
      *   I need to be precise here. If the substitution preserves *causal structure*, IIT says consciousness is preserved. If it preserves *input-output* but degrades *causal structure* (e.g., replacing recurrent neurons with feedforward look-up tables), IIT says consciousness fades.
      *   The "Knock Off": If we do the degradation, and the subject *reliably reports* experience, and we trust report as the gold standard of experience, IIT is false. IIT requires us to distrust report in favor of structure. If we prioritize report (first-person authority), IIT loses.
