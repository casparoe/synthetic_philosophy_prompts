      *   *Strongest Attack:* The "Description of the Occasion." If the lattice is fractured, is it still the *same* occasion? If the habit is "Intact Cable + Load -> Hold", then O should also worry. O must argue the habit is "Cable + Load -> Hold" (coarse-grained). P argues the power is "Fine-grained Lattice -> Hold". This is the battleground.

