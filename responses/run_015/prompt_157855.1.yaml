prompt: |-
  You are an expert philosopher of biology and evolutionary theorist. Before answering, please take a moment to brainstorm quietly: list the key correspondences and the most serious breaking points you anticipate. Then think step by step and proceed carefully.

  I am a high school student preparing a formal conceptual essay, and I want to understand exactly how far a particular analogy reaches. In discussions of the units-of-selection debate, people often compare evolutionary change to a persistent open-source repository: genes are the master codebase that survives every fork and merge; individual organisms are temporary builds that compile, run once, and are deleted; and groups are short-lived feature branches that disappear unless their code is copied back into the master. The analogy is used to argue that only genes are genuinely cumulative units of selection, since only the repository accumulates permanent "commits" over evolutionary time, while organism-level and group-level success is just ephemeral execution.

  Please audit this analogy rigorously. First, provide an explicit correspondence table: what plays the role of the repository, the build, the branch, the commit, the fork/merge process, and the version history? Second, identify precisely where the mapping breaks—especially regarding whether reproduction requires copying the entire repository, whether group-level traits can be transmitted horizontally or culturally without altering every gene, and whether evolutionary "credit" requires a persistent identity rather than just statistical recurrence. Third, distinguish the disanalogies that genuinely undermine the gene-centrism the analogy is meant to license from those that are merely decorative. Fourth, state clearly whether the conclusion—that only gene-level change counts as real evolutionary change—survives once these breaks are on the table. If it does not survive, suggest what a less misleading analogy might look like. Please keep your response precise and self-contained: do not provide bibliographies, citation lists, or references to obscure technical literature.
