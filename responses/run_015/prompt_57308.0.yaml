      *   *Problem:* If there's no penalty, they just take the money and don't do it. That proves the point! But we need them to *feel* the inability to intend.
      *   *Adjustment:* The game isn't about winning money. It's about *successfully contracting*. If you take the money and don't do the act, you "break" the game logic.
      *   *Wait, the user wants them to run into the wall.* The wall is realizing you can't intend.
