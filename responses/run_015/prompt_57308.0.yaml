      *Wait, I need to be careful.* If I give them money and they don't act, they win money. They will love that. They won't feel the paradox.
      *The Paradox is:* You can't get the money because you can't form the intention.
      *So:* If they don't act, it proves they never intended.
      *So:* If they don't act, they must return the money? No, that's a penalty.
      *Kavka's Puzzle:* You can't get the money because a rational agent knows they won't drink, so they can't intend, so the scanner won't pay.
      *Game Translation:* If the group thinks you are rational (i.e., you won't drink once paid), they won't certify your intention.
