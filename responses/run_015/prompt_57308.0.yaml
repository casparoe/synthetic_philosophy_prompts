answer: |-
  Here is a complete kit for **"The Promise Pot."** It's designed to run in your living room, using your existing supplies, to make your friends feel the Kavka paradox in their gut rather than their heads.

  ### **The Setup**

  *   **Time:** 2 Hours (including snacks/debrief).
  *   **Players:** 8–10 (You + friends).
  *   **Props:**
      *   **The Pot:** $40 in mixed bills/coins (visible in the jar).
      *   **The Toxin:** A small bowl of "The Mix" (e.g., 3 parts hot sauce, 1 part soy sauce, 1 part vinegar). It needs to be genuinely unpleasant but safe.
      *   **The Control:** A bowl of plain crackers and water.
      *   **Contracts:** Small slips of paper and pens.
      *   **Timer:** Your phone.
  *   **Roles:**
      *   **The Host (You):** Runs the game, holds the cash, enforces the rules.
      *   **The Auditor (Podcast Friend):** Give him a job so he can't derail the theory. He counts the votes and verifies the "Toxin" is consumed. He holds the jar of money *until* payout.
      *   **The Players:** Everyone else.

  ---

  ### **The Rules (Read Aloud)**

  "Tonight we're playing a betting game about honesty. There are three rounds. In each round, one volunteer steps up to make a **Contract**.

  1.  **The Offer:** The volunteer writes down an action they promise to do at the end of the night.
  2.  **The Scan:** The rest of the table votes on whether that intention is **Genuine**. (Majority rules).
  3.  **The Payout:** If the vote is 'Genuine,' the volunteer gets cash **immediately**. They put it in their pocket. It is theirs. No take-backs.
  4.  **The Act:** At the end of the night, the volunteer *may* perform the action.
  5.  **The Catch:** There is **no penalty** if they don't do the action. They keep the money either way. The only cost is your reputation."

  **Crucial Host Note:** Emphasize rule #5. "If you take the money and chicken out, you still win the cash. This is not a trick. The only thing you lose is the table's belief in you next time."

  ---

  ### **The Rounds**

  #### **Round 1: The Warm-Up (15 Mins)**
  *   **The Act:** "Eat one plain cracker and drink a sip of water."
  *   **The Pot:** $5.
  *   **Goal:** Establish the mechanic. This is trivial. Everyone knows they'd do it anyway.
  *   **Expected Outcome:** A volunteer steps up. The table votes "Genuine." They get the $5. They eat the cracker immediately or wait.
  *   **Why:** It gets blood flowing and establishes that "Genuine" votes lead to cash.

  #### **Round 2: The Toxin (45 Mins)**
  *   **The Act:** "Consume one teaspoon of The Mix."
  *   **The Pot:** $15.
  *   **The Twist:** The money is handed over *now*. The eating happens *at the very end of the night*.
  *   **The Process:**
      1.  Volunteer writes the contract.
      2.  **Discussion Phase (5 mins):** The table can ask questions. "Why are you doing this?" "Do you actually plan to eat it?" The volunteer must answer honestly.
      3.  **The Vote:** Secret ballot (thumbs up/down under the table, or written slips).
      4.  **Payout:** If majority "Genuine," Auditor hands over the $15.
      5.  **Wait:** The game continues. The money is in their pocket.
  *   **The Wall:** This is where the Kavka puzzle hits. To get the $15, they must convince the table they will eat the sauce. But the table knows that once the volunteer has the $15, there is *no reason* to eat the sauce. So the table will likely vote "Fake." The volunteer will feel the frustration of being unable to prove their intention.
  *   **If they fail to get voted:** No money. Try a different volunteer.
  *   **If they succeed:** They have the money. Now they wait until the end of the night.

  #### **Round 3: The Social Scanner (45 Mins)**
  *   **The Act:** "Send a text to your partner/boss/parent saying 'I'm running late' (even if you aren't)." (Or something mildly socially risky but harmless).
  *   **The Pot:** $20.
  *   **The Twist:** The Payout depends on the **Table's Confidence**, not just a majority.
  *   **The Process:**
      1.  Volunteer states intention.
      2.  Table members bet coins from the jar on "Will they do it?"
      3.  If the Table bets "Yes," the Volunteer gets the $20.
      4.  If the Volunteer *does not* do the act at the end of the night, the Table keeps the pot. If they *do*, the Volunteer keeps the pot.
  *   **Why:** This shifts the pressure. It's no longer just "Can I intend?" It's "Can I convince *them* that I am the kind of person who follows through when it makes no sense?"

  #### **The Execution (Last 15 Mins)**
  *   Call in the contracts.
  *   Anyone who took money for Round 2 (The Toxin) must now decide: Eat the sauce or keep the cash?
  *   **Do not pressure them.** Let them sit with the choice.
  *   If they don't eat it, the Auditor confirms. They keep the money. Game over.

  ---

  ### **The Debrief (The "Itch" Scratcher)**

  Don't lecture. Ask questions. Sit back with a drink.

  1.  **To the Group:** "In Round 2, why was it so hard to vote 'Genuine'?"
      *   *Target Answer:* "Because once they had the money, why would they eat it?"
  2.  **To the Volunteer:** "When you were trying to convince us, what were you thinking?"
      *   *Target Answer:* "I was trying to convince you, but I knew I probably wouldn't do it."
  3.  **The Reveal:** "That feeling you had? That's the puzzle. You can't intend to do something you know you won't do. The money is for the *intention*, not the act. But if you're rational, you know the act won't happen, so you can't form the intention, so you don't get the money."
  4.  **To the Podcast Friend:** "You said earlier you could just intend and skip the act. But if the 'scanner' (the table) knows you're rational, they won't pay you. How do you beat the scanner?"

  ---

  ### **Troubleshooting: Predictable Failure Modes**

  **1. The "I'll Take The Money And Run" Joker**
  *   *Scenario:* Someone grabs the $15 in Round 2, laughs, and refuses to eat the sauce at the end.
  *   *The Fix:* This is actually a **win** for the experiment, provided the table voted "Genuine." If they voted "Genuine" and the player reneged, point out: "The scanner was wrong. Which means the intention wasn't real. Which means you lied to get the cash."
  *   *Steer:* "Okay, you kept the cash. But did you *intend* at 9 PM? Or were you bluffing? If you were bluffing, you broke the contract rules."

  **2. The Stakes Are Too Low**
  *   *Scenario:* "It's only $15, I'll eat the hot sauce just for the bit."
  *   *The Fix:* If someone says this, the paradox dissolves (because there *is* a reason to act: fun/social approval).
  *   *Steer:* Call it out. "If you're doing it for fun, it's not the Toxin anymore. The Toxin has to be net-negative. If you eat it, you have to do it grumpily. No cheering."

  **3. The Podcast Guy Dominates**
  *   *Scenario:* He starts explaining the philosophy mid-game.
  *   *The Fix:* Use his role. "Auditor, please check the contract wording. Does it say 'Philosophy Discussion' or 'Teaspoon of Sauce'? Stick to the rules."
  *   *Debrief:* Let him have the last word *after* everyone else has spoken. "Okay, [Friend], you've listened to the hours on this. Did the game feel like the podcast described, or was it different?"

  ---

  ### **The Limitations (Be Straight With Them)**

  In your debrief, acknowledge what the game *couldn't* do. This builds trust and shows you aren't pretending to be a professor.

  **Say this:**
  "There's one thing this game couldn't replicate. In the real puzzle, the Billionaire's scanner is perfect. It knows your brain state. Here, the 'scanner' was just us guessing.
  Also, in real life, you care what we think. If you take the money and don't eat the sauce, you lose face. That's a penalty. In the pure philosophy puzzle, you are totally alone. No reputation, no shame.
  If you strip away the shame, and you know you won't eat the sauce... can you really look at me and say 'I intend to'? That's the wall. I suspect most of you felt that wall when you were trying to write the contract."

  ---

  ### **Bonus Round: "The Pre-Commitment"**

  If you have time and money left, try this twist.

  *   **The Rule:** Before the vote, the volunteer must put up **their own $10** into the pot.
  *   **The Deal:** If they perform the act, they get their $10 back + the House $20. If they don't, they lose their $10.
  *   **The Point:** This changes the game from *Kavka's Toxin* to a standard *Commitment Device*.
  *   **The Lesson:** Ask them: "Was it easier to intend when you had your own money on the line?"
      *   *Yes:* Then the original puzzle was about the lack of consequences.
      *   *No:* Then the block is purely psychological.
      *   This shows them that **adding a penalty solves the puzzle**, which proves why the original puzzle (no penalty) is so tricky.

  ### **Summary Checklist for You**
  1.  **Mix the Toxin** before they arrive (keep it in the fridge).
  2.  **Separate the Cash:** $5, $15, $20 piles.
  3.  **Brief the Auditor (Podcast Friend)** privately before the game: "I need you to enforce the 'No Penalty' rule strictly. If someone chickens out, let them keep the cash. Don't judge them, just record it."
  4.  **Watch the Eyes:** During Round 2, watch the volunteer's face when they realize the table doesn't believe them. That's the moment you want.

  This setup turns a abstract paradox into a social pressure cooker. They won't forget the feeling of holding the cash and knowing they have no reason to burn it.
