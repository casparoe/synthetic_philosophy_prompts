  2.  **Deconstruct Kavka's Toxin Puzzle:**
      *   *The Setup:* Billionaire offers $1M if you *intend* at midnight to drink toxin tomorrow. Money deposited tomorrow morning. Drinking happens tomorrow afternoon.
      *   *The Paradox:* To get the money, you must intend. But once you have the money, you have no reason to drink (it makes you sick, reward is secure). Since you know you won't drink tomorrow, you can't genuinely intend tonight.
      *   *The Core Tension:* Instrumental rationality vs. Intentionality. Can you intend to do something you know you won't do?
      *   *Live Version Limitation:* In a thought experiment, the "scanner" is perfect and omniscient. In real life, "intention" is subjective and hard to verify. We need to simulate the "scanner" socially or structurally.

  3.  **Designing the Game ("The Intention Market"):**
      *   *Name:* Needs to sound like a party game, not a seminar. "The Midnight Contract" or "The Intention Game." Let's go with **"The Promise Pot."**
      *   *Structure:* Three Rounds.
          *   Round 1: Low Cost (Do something you'd do anyway).
          *   Round 2: High Cost (The "Toxin" equivalent).
          *   Round 3: Social Verification (The "Scanner" replacement).
      *   *Money:* $40 total. Needs to be distributed wisely. Maybe $5-$10 per round pot.
      *   *Verification:* Since we can't scan brains, we need a delayed action. The money is held in escrow (the jar). The "payout" happens *after* the action is verified, OR we simulate the "deposit before action" rule strictly.
      *   *Crucial Mechanic:* The Kavka puzzle relies on the money being *unconditional* on the act, only on the intention. In a live game, if I pay you for intention, you can just lie. To make it bite, the verification of intention must happen *before* the opportunity to renege, but the reward must be given *before* the act.
      *   *Wait, actually:* In the original puzzle, the money is in the bank *before* you drink. In a 2-hour session, we can't wait until tomorrow. We need to compress time or simulate the "future self."
      *   *Solution:* Compress the timeline.
          *   Phase 1: Form Intention (Write it down).
          *   Phase 2: "Bank Transfer" (Hand over cash).
          *   Phase 3: The Act (Do the unpleasant thing).
          *   *The Catch:* Once they have the cash in Phase 2, why do Phase 3?
      *   *Refinement:* To make it work in 2 hours, we need a "Future Self" mechanic or a "Trust" mechanic.
      *   *Better Approach:* The "Scanner" is the group. But the money must be given *before* the act to replicate the puzzle.
      *   *Revised Plan:*
          1.  **Bid/Intend:** Players write a contract. "I intend to X."
