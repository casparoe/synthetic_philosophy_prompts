prompt: |-
  Hey, I'm a software engineer working on graphics engines, so I don't really have a phil backround, but I got pulled into a debate with my roommate about disjunctivism and the argument from illusion after I mentioned how VR headsets render trees that aren't physically there. He summed it up like this: "Disjunctivism says that seeing a real tree puts you in direct contact with the tree — no mental picture or representation in the middle — so perception is literally a relation to the object. The argument from illusion points out that seeing a tree and hallucinating one feel identical, which proves they share the same mental kind, meaning there's always an inner representation. Disjunctivists reject this by claiming hallucinations aren't perceptions at all, they're more like false beliefs for vision, so there's no common factor between the two. So in VR, since there's no physical tree, every frame is automaticaly a hallucination of the same kind as a drug trip, which kills direct realism for virtual worlds."

  Something about that sounds too neat, especially the VR part. Is this a fair summary? Can you split out what's accurate, what's a standard simplification, and what a disjunctivist would actually push back on? And does that conclusion about VR headsets really follow, or is he smuggling something in?

  Also please say how confident you are overall and single out the point you're least sure of.
