prompt: |-
  I lead a four-person forecasting cell at a humanitarian logistics organization, and I have an old undergraduate minor in philosophy plus a graduate degree in statistics, which is to say I know just enough of each to be dangerous. Every week we are handed numbers we are expected to turn into planning decisions: whether to pre-position supplies in a river basin, whether to hold back a contingency budget, whether to brief a country director that a scenario is now "likely." The numbers arrive from three sources our spreadsheets do not distinguish, and I have become convinced that most of our arguments after the fact trace back to that: ensemble outputs from physical models (seasonal climate forecasts, hydrological models), where the number carries an explicitly chance-like interpretation and usually some hindcast record; prices from a small internal prediction market we run among staff, several of whom have partial field access; and structured expert-judgment elicitations, which produce a number that looks identical in a cell to the other two but is somebody's opinion. We are also audited: six months after a decision, a donor or a board member asks why we moved the tents or did not, so whatever we do has to be reconstructible from a written record by someone who was not in the room.

  What I want from you is a written procedure my analysts can run on an incoming number before it enters a planning document. The analysts have real statistics training and no philosophy; the procedure has to be runnable in fifteen to twenty minutes per item, weekly, and its output has to be something our director of operations, who has no patience for epistemology, will actually sign off on. I have been reading about the Principal Principle — the principle that says your credence in an event should equal what you take the objective chance of that event to be, absent inadmissible evidence — and that feels like roughly the right framework, but I cannot hand my team a principle. I need it operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to use the number, and where it hands the rest to a person because the remaining question is one of values rather than facts.

  Two things I want it to get right, and one I want it to catch. A colleague has proposed the shortcut that we simply defer to any source that comes with a calibration curve, on the grounds that a well-calibrated source is tracking something real; I suspect this collapses a distinction I cannot name precisely, because being reliably calibrated across a run of cases looks like one thing and being a report of the chance of this single event looks like another. Relatedly, we routinely let numbers cross that gap by relabeling: an expert judgment gets fed into a model, the model prints a probability, and from then on it travels downstream as though it were a chance. I have started calling this chance laundering, and I want the procedure to detect it. It also has to handle numbers that arrive stale (a basin forecast issued in March is still circulating in June and nobody adjusts it), evidence that leaks the outcome rather than describing the setup (field reports that the short rains have already failed upstream, or that fighting has begun), and the reference-class problem that arises when the record contains nothing quite like the event being forecast.

  Please give me the procedure, then run it on three cases of the shapes we actually see: a seasonal ensemble forecast putting a 40% chance on below-normal rainfall in a region where the model has a thirty-year hindcast and good reliability, arriving the same week as herder reports that the short rains have failed; our internal market implying a 25% chance that a displacement site exceeds capacity within the quarter, when the trader pool is twelve people and three of them were in the field last month; and a vendor model's 0.4% annual probability for large-scale flood displacement in a basin with no comparable event in the record, which is precisely the case where I expect your procedure to tell me not to put a number in the memo at all and where my director will push back hardest. Where a step depends on a contested reading of the theory — whether chances are Humean, or whether deference to a calibrated expert is covered by deference to chance at all, or what the time-relativity of a chance really requires of us when a forecast ages — say so, mark your confidence, and tell me which steps are judgment calls dressed up as procedure. And if the framing itself is wrong — if for a large share of our events, conflict onset and displacement above all, there are simply no objective chances to defer to and the Principal Principle does not reach them at all — tell me that plainly rather than handing me a checklist I will over-trust.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Lead of a 4-person forecasting cell in humanitarian logistics.
      *   **Background:** Undergrad philosophy minor + Grad stats degree ("dangerous" in both).
      *   **Problem:** Three distinct data sources (Physical Models, Prediction Markets, Expert Judgment) arrive as indistinguishable numbers in spreadsheets. This causes post-hoc arguments and audit risks.
      *   **Goal:** A written procedure (SOP) for analysts to vet incoming numbers *before* they enter planning docs.
      *   **Constraints:**
          *   Runnable in 15-20 mins/week/item.
          *   Output must be sign-off-able by a non-philosophical Director of Operations.
          *   Must operationalize the *Principal Principle* (PP) without teaching philosophy.
          *   Must handle: Calibration vs. Single-Event Chance, "Chance Laundering" (Expert -> Model -> "Fact"), Stale Numbers, Outcome Leakage (inadmissible evidence), Reference Class problems.
          *   Must identify where values trump facts.
          *   Must critique the framework itself (are there objective chances in conflict/displacement?).
      *   **Deliverables:**
          1.  The Procedure (SOP).
          2.  Application to three specific cases (Rainfall/Herders, Market/Capacity, Vendor/Flood).
          3.  Meta-commentary on theoretical contingencies and limitations.

  2.  **Analyze the Theoretical Core (The Principal Principle):**

      *   *Lewis's Principal Principle:* $C(A | X \& E) = X$, where $C$ is credence, $A$ is the proposition, $X$ is the objective chance, and $E$ is admissible evidence.
      *   *The Tension:* Humanitarian logistics deals with singular, complex socio-natural events. Do "objective chances" exist for civil war or displacement?
          *   *Frequentist/Physicalist:* Yes, for weather (maybe). No, for conflict.
          *   *Bayesian/Subjectivist:* Chances are just degrees of belief.
          *   *Humean/Best System:* Chances are summaries of patterns.
      *   *The User's Insight:* The user suspects "Chance Laundering" (turning opinion into probability via a model) and the "Calibration Trap" (good past performance $\neq$ objective chance *now*).
      *   *The Operational Challenge:* How to turn $C(A | X \& E) = X$ into a checklist?
          *   Step 1: Identify the source type (Is $X$ a chance or a credence?).
          *   Step 2: Check Admissibility (Is $E$ leaking the outcome?).
          *   Step 3: Check Temporal Relevance (Is the chance still current?).
          *   Step 4: Check Reference Class (Does the hindcast apply to *this* case?).
          *   Step 5: Decision (Defer, Adjust, or Reject).

  3.  **Drafting the Procedure (The "Source Provenance & Admissibility Protocol" - SPAP):**

      *   *Name:* Needs to sound operational, not philosophical. "Source Provenance & Admissibility Protocol" (SPAP).
      *   *Structure:* 5 Steps.
      *   *Time:* 15-20 mins.
      *   *Output:* A "Confidence Tag" (Green/Yellow/Red) and a "Source Label" (Chance/Credence/Hybrid).
      *   *Key Filters:*
          1.  **Ontology Check:** Is this a physical chance or a human judgment? (Addresses Chance Laundering).
          2.  **Admissibility Check:** Do we know the outcome already? (Addresses Outcome Leakage).
          3.  **Temporal Check:** Is the data stale? (Addresses Time-Relativity).
          4.  **Reference Check:** Does the past predict *this* future? (Addresses Reference Class).
          5.  **Aggregation Rule:** How to mix them.

  4.  **Developing the Three Cases:**

      *   *Case 1: Rainfall (40% below normal) + Herder Reports.*
          *   Source: Physical Model (Chance-like).
          *   Complication: Inadmissible evidence (Herders say rain *already* failed).
          *   Verdict: Model probability is obsolete. Update based on field report.
      *   *Case 2: Prediction Market (25% capacity exceed).*
          *   Source: Market (Credence aggregation).
          *   Complication: Small N (12 traders), Insider info (3 in field).
          *   Verdict: Treat as expert judgment, not objective chance. Risk of insider leakage (admissibility).
      *   *Case 3: Vendor Flood Model (0.4% annual prob).*
          *   Source: Statistical Model (Claimed Chance).
          *   Complication: No reference class (Black Swan territory).
          *   Verdict: Reject the number. It's pseudoprecision. Use scenario planning instead.

  5.  **Addressing the Meta-Commentary (The "Dangerous" Knowledge):**

      *   *Calibration vs. Chance:* Explain why a calibrated gun doesn't tell you where the bullet goes *this time* if the wind changed.
      *   *Chance Laundering:* Explicitly flag the transformation of Subjective -> Objective via computation.
      *   *The "No Chances" Problem:* Be honest. For conflict/displacement, there are no objective chances. The PP doesn't apply. We are dealing with *uncertainty* (Knightian), not *risk*.
      *   *Judgment Calls:* Acknowledge where the analyst must decide what counts as "similar enough" for a reference class.

  6.  **Refining the Tone:**

      *   Professional, direct, respectful of the user's dual background.
      *   Avoid jargon where possible, but use it precisely where needed (e.g., "inadmissible evidence").
      *   Ensure the Director of Operations can read the summary without needing a philosophy degree.

  7.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Make the checklist binary where possible. If "No" to a critical question, stop.
      *   *Critique:* Did I address the Principal Principle enough?
      *   *Fix:* Embed the logic of PP (Credence = Chance given Admissible Evidence) into the steps without naming it constantly.
      *   *Critique:* The user asked to be told if the framing is wrong.
      *   *Fix:* Add a strong "Limitations & Theoretical Risks" section at the end. Don't bury the lead on the "no objective chances for conflict" issue.

  8.  **Final Polish:**

      *   Check against specific constraints: "Chance laundering," "Stale numbers," "Reference class," "Audit trail."
      *   Ensure the output format is clear (Procedure first, then Cases, then Meta-analysis).

  *(Self-Correction on the Principal Principle application)*: I need to be careful not to imply the PP *solves* the problem of singular events. The PP tells you how to set credence *if* there is a chance. If there is no chance, the PP is silent. I must make sure the procedure distinguishes between "Physical Stochasticity" (weather) and "Epistemic Uncertainty" (conflict).

  *(Refining the "Calibration" point)*: The user's colleague says "Calibrated = Real." I need to explain that calibration is a property of the *source over time*, not the *event*. A calibrated clock is still wrong if you don't set it to the current time zone.

  *(Refining the "Admissibility" point)*: In PP, admissible evidence is evidence about the history of the world up to the time of the chance setup, not the outcome. Field reports of rain failure are inadmissible for a forecast of rain failure.

  Let's assemble the response.cw
answer: |-
  This is a sophisticated operational problem disguised as a data management issue. You are correctly identifying that mixing *ontological categories* (physical chance vs. aggregated opinion) creates audit liabilities. If a donor asks why you moved tents, "The model said 40%" is a defensible answer only if the model's 40% represents a physical propensity, not a consensus guess laundered through a spreadsheet.

  Below is the **Source Provenance & Admissibility Protocol (SPAP)**. It is designed to be printed and attached to your weekly data intake sheet. Following the protocol, I have run it against your three cases, and finally, I have provided the theoretical audit you requested regarding the limits of the Principal Principle in humanitarian contexts.

  ---

  # PART 1: THE PROCEDURE
  **Document Title:** Source Provenance & Admissibility Protocol (SPAP)
  **Owner:** Forecasting Cell Lead
  **Time Budget:** 15–20 Minutes per Incoming Metric
  **Output:** A "Data Tag" attached to the number in the planning document.

  ### Instructions for Analysts
  Do not enter a number into the Planning Register until it has a **Source Tag** (Green/Yellow/Red) and an **Epistemic Label** (Physical Chance / Aggregated Credence / Unverified). If a step fails, stop. Do not average a Red number with a Green number.

  ### Step 1: The Ontology Check (Is this a Chance or a Credence?)
  *Goal: Prevent "Chance Laundering."*
  Look at the source generation method.
  *   **A. Physical Stochasticity:** Is the number derived from physical laws with inherent randomness (e.g., climate ensembles, hydrological models)?
      *   *If Yes:* Label **Physical Chance**. Proceed to Step 2.
      *   *If No:* Go to B.
  *   **B. Human Judgment:** Is the number derived from opinions, markets, or expert elicitation (even if processed by an algorithm)?
      *   *If Yes:* Label **Aggregated Credence**. Proceed to Step 2.
      *   *If No:* (e.g., arbitrary target, political directive) Label **Unverified**. **STOP.** Do not use for probabilistic planning.

  **Audit Note:** If a source claims to be Type A but relies on Type B inputs (e.g., a conflict model weighted by expert surveys), it is Type B. Mark as **Hybrid (Credence-Dominant)**.

  ### Step 2: The Admissibility Check (Do We Know the Outcome?)
  *Goal: Prevent "Outcome Leakage."*
  The Principal Principle requires that your evidence does not include information about the *outcome* of the chance event, only the *setup*.
  *   **Question:** Do we possess field information that effectively confirms or denies the event *before* the model's horizon closes?
  *   **Test:** If we sent a truck today based on this number, would field staff say, "But that already happened/didn't happen"?
      *   *If Yes:* The number is **Stale/Inadmissible**. **STOP.** Request an updated forecast or treat the field report as the new baseline (Probability = 0 or 1).
      *   *If No:* Proceed to Step 3.

  ### Step 3: The Reference Class Check (Does the Past Match This Future?)
  *Goal: Prevent False Calibration.*
  Calibration proves a source is reliable *on average*, not that it applies to *this* case.
  *   **Question:** Is the current context sufficiently similar to the hindcast/training period used to calibrate the source?
  *   **Test:** Are there structural breaks (new dam, regime change, climate shift) that make the historical record a poor guide for *this* specific event?
      *   *If Yes (Structural Break):* Label **Yellow (Degraded Confidence)**. The number is a heuristic, not a probability.
      *   *If No (Stable Context):* Label **Green (High Confidence)**. Proceed to Step 4.

  ### Step 4: The Temporal Decay Check (Is the Number Fresh?)
  *Goal: Handle Time-Relativity of Chance.*
  Objective chances evolve as the physical setup evolves.
  *   **Question:** Has the time delta between the forecast issuance and the planning decision exceeded 20% of the forecast horizon?
      *   *Example:* A 3-month forecast issued 3 weeks ago is acceptable. A 3-month forecast issued 2 months ago is not.
      *   *If Expired:* **STOP.** Flag for refresh.
      *   *If Valid:* Proceed to Step 5.

  ### Step 5: The Decision Rule (How to Use the Number)
  *   **Physical Chance (Green):** Defer to the number for resource allocation ratios (e.g., pre-position 40% of stock).
  *   **Aggregated Credence (Green/Yellow):** Use for scenario triggering, not resource ratios. (e.g., "Prepare Plan B," not "Move 25% of tents").
  *   **Hybrid/Red:** Do not put a number in the memo. Use qualitative descriptors ("Plausible," "Unlikely") and document the uncertainty in the "Assumptions" log.

  ---

  # PART 2: CASE APPLICATIONS

  Here is how your analysts should apply SPAP to the three specific scenarios you provided.

  ### Case 1: The Rainfall & The Herders
  *   **Input:** Seasonal Ensemble (40% below-normal rain) + Herder Reports (Short rains failed upstream).
  *   **SPAP Run:**
      1.  **Ontology:** Physical Chance (Climate Model).
      2.  **Admissibility:** **FAIL.** The herder reports constitute inadmissible evidence regarding the outcome. If the short rains have failed upstream, the physical setup for the "below-normal rainfall" event has already collapsed into a near-certainty. The 40% is no longer a chance; it is an outdated snapshot.
      3.  **Action:** **Reject the 40%.**
      4.  **Operational Output:** Do not brief the Director on a "40% risk." Brief on "Confirmed Upstream Failure; Downstream Impact Imminent." The planning decision shifts from *contingency* to *response*.
      5.  **Audit Trail:** "Model probability superseded by field verification (Source: Herder Report, Date X). Probability updated to >90%."

  ### Case 2: The Prediction Market (Displacement Capacity)
  *   **Input:** Internal Market (25% chance site exceeds capacity). Pool = 12 traders, 3 with recent field access.
  *   **SPAP Run:**
      1.  **Ontology:** **Aggregated Credence.** This is not a physical chance. It is a consensus of opinion. Even if well-calibrated historically, it is not tracking a physical propensity like rainfall; it is tracking human behavior and logistics bottlenecks.
      2.  **Admissibility:** **CAUTION.** The three traders with field access may possess inadmissible evidence (e.g., they know a convoy was delayed). If their trading was based on non-public outcome data, the market price is "contaminated."
      3.  **Reference Class:** **Yellow.** 12 traders is a thin market. Calibration is statistically weak.
      4.  **Action:** **Label Yellow.** Do not use for resource ratios (do not pre-position 25% of stock). Use as a "Trigger Warning."
      5.  **Operational Output:** "Market signals elevated risk (25%). Recommend activating monitoring protocol, not pre-positioning."
      6.  **Audit Trail:** "Source identified as Aggregated Credence. Thin market liquidity noted. Used for scenario awareness only."

  ### Case 3: The Vendor Flood Model (0.4% Annual Probability)
  *   **Input:** Vendor Model (0.4% flood risk). Basin has no comparable event in record.
  *   **SPAP Run:**
      1.  **Ontology:** Claims to be **Physical Chance**, but...
      2.  **Reference Class:** **FAIL (Critical).** You stated there is "no comparable event in the record." A probability derived from a distribution with no data points in the tail is not a chance; it is an extrapolation assumption dressed as a number. This is the definition of "Chance Laundering."
      3.  **Action:** **Reject the Number.** This is a Red Tag.
      4.  **Operational Output:** Do not put "0.4%" in the memo. It implies a precision that does not exist. The Director will push back because they want a number for cost-benefit analysis. You must offer: "Risk is Unquantifiable (Deep Uncertainty). Recommendation: Resilient Infrastructure rather than Probabilistic Stockpiling."
      5.  **Audit Trail:** "Vendor probability rejected. Reference class empty. Event treated as 'Black Swan' / Deep Uncertainty. Decision based on worst-case scenario planning, not expected value."

  ---

  # PART 3: THEORETICAL AUDIT & LIMITATIONS

  You asked me to flag where the theory is contested and where the framing might be wrong. Here is the "Dangerous Knowledge" section for your eyes and your analysts' training.

  ### 1. The Calibration Trap (Your Colleague's Shortcut)
  Your colleague argues: *Calibrated Source = Objective Chance.*
  **Verdict:** **False.**
  **Why:** Calibration is a property of the *source over time*, not the *event*. A clock that is exactly 24 hours fast is perfectly calibrated (it shows the right time once a day), but it is useless for telling time *now*. Similarly, a model can be well-calibrated on average but systematically wrong in specific contexts (e.g., El Niño years).
  **Procedure Fix:** Step 3 (Reference Class) catches this. If the current context differs from the calibration set, the calibration is irrelevant.
  **Confidence:** High. This is standard statistical practice, though often ignored in policy.

  ### 2. Chance Laundering (Expert -> Model -> Fact)
  **Verdict:** **Real and Dangerous.**
  **Why:** When an expert judgment (Subjective Credence) is fed into a Monte Carlo simulation, the output *looks* like a Physical Chance (it has decimals, distributions, etc.). But the uncertainty hasn't changed; it has just been obscured. The Principal Principle applies to objective chances. It does not authorize deferring to a computer program that is merely processing opinions.
  **Procedure Fix:** Step 1 (Ontology Check). You must trace the lineage of the input. If the root is human opinion, the fruit is credence, regardless of the computational tree.
  **Confidence:** High. This is the core of your audit risk.

  ### 3. Time-Relativity and Stale Numbers
  **Verdict:** **Theoretically Contested, Operationally Vital.**
  **Why:** In Lewis's framework, chance is time-dependent. $Chance_t(A)$ changes as time $t$ moves closer to the event. A 40% chance in March is not a 40% chance in June, even if the model hasn't updated, because the physical setup has evolved (the "history" up to $t$ has changed).
  **Procedure Fix:** Step 4 (Temporal Decay).
  **Confidence:** Medium-High. The exact decay rate (20% of horizon) is a judgment call dressed as procedure. You may need to adjust this threshold based on the volatility of the specific basin.

  ### 4. The "No Chances" Problem (The Framing Error)
  **Verdict:** **Critical Limitation.**
  **Why:** You asked me to tell you if the framing is wrong. For rainfall, objective chances likely exist (quantum indeterminacy + chaotic systems). For **conflict onset, displacement, and political stability**, there are almost certainly **no objective chances**. These are singular, path-dependent historical events. There is no "propensity" for a civil war in the same way there is a propensity for rain.
  **Implication:** The Principal Principle **does not reach** your conflict/displacement cases. Applying it there is a category error. You are asking your analysts to find $X$ (objective chance) where only $C$ (credence) exists.
  **Procedure Fix:** This is why Step 1 distinguishes Physical Chance from Aggregated Credence. For conflict/displacement (Case 2 and 3), you must explicitly tell your Director: *"There is no true probability here. This number is a betting odd, not a physical law. We cannot optimize resources against it; we must hedge against it."*
  **Confidence:** High (Philosophically), Low (Politically). Your Director will hate this. It removes the comfort of pseudoprecision.

  ### 5. Where Judgment Calls are Dressed as Procedure
  *   **Step 3 (Reference Class):** Determining what counts as a "structural break" is not algorithmic. Is a new dam a structural break? Is a new commander? Your analysts will have to argue this. *Recommendation:* Keep a log of "Reference Class Disputes" to review quarterly.
  *   **Step 5 (Decision Rule):** The line between "Resource Allocation" and "Scenario Triggering" is fuzzy. Moving 10 tents is allocation; moving 1,000 is strategic. *Recommendation:* Define a monetary threshold (e.g., "Any decision >$50k requires Green Tag").

  ### Final Recommendation
  The SPAP procedure will protect you from audit failure by creating a paper trail that distinguishes *facts* from *opinions*. However, it will not protect you from the discomfort of telling leadership that some risks are unquantifiable.

  In Case 3 (The Vendor Flood Model), the procedure tells you to reject the number. When the Director pushes back, your argument is not philosophical; it is financial: *"If we budget based on 0.4%, and the event happens, we are insolvent. Because the reference class is empty, we cannot trust the 0.4%. We must budget for resilience, not probability."*

  This shifts the debate from epistemology to risk management, which is where it belongs.
