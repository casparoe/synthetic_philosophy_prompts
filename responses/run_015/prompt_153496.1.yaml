prompt: |-
  I work on a small product team that is localizing a mental-health app for a language with no established everyday single-word equivalent for burnout: the nearest available resources are a borrowed clinical term and idioms about heaviness or pressure in the body. At a design review a senior colleague ended a long discussion with "language shapes thought — that's established, isn't it," and drew two conclusions from it in the same breath: first, that speakers of that language do not presently undergo what we call burnout in quite the way we do, and second, that if we ship a well-chosen term of our own, users will become able to notice, name, and report it. The slogan did an enormous amount of work in about four seconds, and I suspect it did it by sliding between claims of very different strength.

  Please disambiguate it for me. I'm on a locked-down work laptop with no library access, so give me no citations, no study names, and no suggestions for further reading: where a reading turns on evidence, describe the kind of finding that would support or refute it rather than who found it. The distinctions I care about include: whether the claim is about what people can represent at all versus what they habitually notice, recall, or bother to say; whether it concerns only the moment of preparing to speak or write versus standing habits of attention versus the concepts themselves; whether language is being offered as a cause of cognitive differences or as something in terms of which the contents of thought are individuated; and whether "shapes" means makes possible, makes easier, makes salient, or makes social. Please also mark off the readings that are too vague or too hedged to have any consequences, and tell me honestly which of them most people have in mind when they say the sentence.

  Structure your reply as follows:

  1. "The readings, weakest to strongest" — about 450 words, as a numbered menu. For each: a one-sentence statement of the precise thesis, a verdict (platitude, defensible, contested, or false), and whether it supports the first conclusion, the second, both, or neither.
  2. "What my colleague's two conclusions would each require" — about 200 words: the strongest reading each conclusion needs, and how far that reading is actually supported.
  3. "What would settle it" — about 150 words: two or three concrete probes, of the sort one could run or look for without a research library, that discriminate between the readings that are still live.
  4. "The one-sentence version" — about 60 words: something I can say in the next meeting that is accurate and still gets us a decision.
