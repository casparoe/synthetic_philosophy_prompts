      *   *Round 2: The Arbitrariness of Cutoffs.*
          *   Maya: If continuous, every cutoff is arbitrary. Can't justify treating insects differently from rocks without picking a number out of thin air.
          *   Jordan: Arbitrary lines are fine (voting age analogy). Gradualism allows insects to matter *a little*.
      *   *Round 3: State-Dependence (Disjunctive Moral Patients).*
          *   Maya: Status might depend on functional states (bee flying vs. dormant, thermostat predicting vs. reacting). Makes ethics impractical if checked state-by-state.
          *   Jordan: That's a feature, not a bug (sleeping dog vs. awake). Proposes weighted average over lifespan.
      *   *Round 4: Integration and Affect.*
          *   Maya: Is this just utilitarian math? How to distinguish bee hive (high integration, maybe no feeling) vs. network of thermostats (high integration, zero feeling)?
          *   Jordan: Difference is *affective integration* (serving homeostasis). Admits no clean test yet.

  3.  **Evaluate Each Point (Philosophical & Scientific Context):**

      *   *Round 1 (Binary vs. Continuous):*
          *   Maya: Binary views are intuitive (light switch) but neuroscientifically shaky. Consciousness likely emerges from complex processing, which is gradual. However, "phenomenal consciousness" (what it's like to be) is often treated as binary in philosophy (there is something or there isn't).
          *   Jordan: Scientifically more plausible. Nervous systems vary in complexity. Panpsychism vs. Emergentism. Saying insects have *some* experience is the mainstream scientific view (Cambridge Declaration on Consciousness). Thermostats = zero is standard functionalism.
          *   *Verdict:* Jordan is scientifically stronger; Maya is philosophically traditional but increasingly outdated regarding biology.

      *   *Round 2 (Arbitrariness):*
          *   Maya: This is the "Sorites Paradox" (heap of sand). If sentience is a spectrum, where do we draw the line for *moral protection*? She's right that a *moral* cutoff is arbitrary if the *property* is continuous.
          *   Jordan: Voting age analogy is strong. We draw lines for practical reasons even if the underlying trait (maturity) is continuous. Also, gradualism avoids the "cliff edge" problem (where a slightly smarter animal gets full rights and a slightly dumber one gets none).
          *   *Verdict:* Jordan wins on practical ethics. Maya wins on logical rigor regarding the *justification* of the specific line, but Jordan's pragmatic defense holds up.

      *   *Round 3 (State-Dependence & Time-Weighting):*
          *   Maya: "Disjunctive moral patients." This is a sophisticated point. Anesthesia, sleep, dormancy. If status fluctuates, ethics becomes computationally impossible for agents.
          *   Jordan: Weighted average. This aligns with "time-slice" views in ethics. A sleeping dog still has rights, but maybe violating them is less bad than violating an awake dog's? (Debatable). The mayfly vs. termite comparison is interesting (intensity/duration trade-off).
          *   *Verdict:* Maya highlights a real practical problem. Jordan offers a theoretical solution that is philosophically coherent but practically difficult. Both have valid points.

      *   *Round 4 (Integration & Homeostasis):*
          *   Maya: Hive vs. Thermostat network. This hits the "Combination Problem" and "Chinese Room" style objections. High integration $\neq$ consciousness.
          *   Jordan: Affective integration/Homeostasis. This aligns with the "Free Energy Principle" or "Autopoiesis" theories of consciousness (e.g., Friston, Thompson). Consciousness is for regulating the self. Thermostats regulate temperature, not *themselves*.
          *   *Verdict:* Jordan identifies the crucial distinction (biological self-maintenance vs. mechanical regulation), even if he lacks a test. Maya asks the right hard question.

      *   *The Missing Piece (Boundary Problem):*
          *   Does gradation solve the boundary problem? No, it relocates it. Instead of "Is it sentient?", it becomes "How much sentience is enough for *this specific right*?"
          *   Both miss the distinction between *moral status* (intrinsic) and *moral weight* (extrinsic/practical).

