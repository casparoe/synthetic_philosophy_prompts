answer: |-
  You have spotted a genuine and frustrating category error, and your intuition is spot-on: there is no single, canonical Latin name for this specific misuse (like *ad hominem* or *post hoc ergo propter hoc*). In the literature on formal epistemology and philosophy of economics, this usually gets buried under broader headings like "misplaced concreteness" (Whitehead) or "excessive idealization."

  However, because you asked for the carving and not just a label, I propose we define this as **The Strategy-Stealing Overextension**.

  While "false analogy" is the genus, this is a specific species of error that occurs when a *proof technique* dependent on formal constraints is mistaken for a *descriptive heuristic* in a complex system. To use this term rigorously in your papers or arguments, you need to distinguish it from the general idea that "good ideas spread."

  Here is the philosophical carving of the **Strategy-Stealing Overextension (SSO)**.

  ### The Core Definition
  The SSO occurs when an agent assumes that a *reductio ad absurdum* proof valid in combinatorial game theory (specifically the Strategy-Stealing Argument) holds in domains where the necessary preconditions for the "steal" are physically or structurally impossible.

  In your course, you learned that the Strategy-Stealing Argument (SSA) works because of three strict axioms. The SSO fallacy is the assumption that these axioms hold in the real world. When your friend argues about business moats, or your classmate argues about elections, they are implicitly asserting these three axioms are true, when they are not.

  ### The Three Boundary Conditions (The Carving)
  To identify the SSO, you must show that the argument violates at least one of these three preconditions required for a valid strategy steal:

  **1. Structural Symmetry (The Board Condition)**
  *   **In SSA:** Player 1 and Player 2 face the exact same rules, board state, and payoff matrix.
  *   **In SSO:** The arguer assumes competitors operate on a level playing field.
  *   **The Violation:** In business and politics, agents are *asymmetric*. An incumbent has capital, brand recognition, and regulatory capture that a challenger does not. If Company A copies Company B's model, they are not starting from the same square. The "board" is not symmetric. Therefore, the copied strategy yields different expected utilities for different players.

  **2. Costless Replication (The Friction Condition)**
  *   **In SSA:** "Stealing" the strategy is a mental act with zero cost and zero time lag. I can decide to play your move instantly.
  *   **In SSO:** The arguer assumes copying is frictionless.
  *   **The Violation:** Real-world strategies are embedded in organizational culture, proprietary tech, or path-dependent history. Copying a "playbook" requires hiring, retooling, and time. During that lag, the original player advances. The "steal" is not instantaneous; it is an investment with risk. If the cost of copying exceeds the value of the strategy, the "steal" is not rational, and the contradiction fails.

  **3. Non-Interference (The Zero-Sum Condition)**
  *   **In SSA:** Usually applies to zero-sum games where my gain is your loss, and my using your strategy prevents you from winning *because* I am playing the game too.
  *   **In SSO:** The arguer assumes that my adoption of your strategy neutralizes your advantage completely.
  *   **The Violation:** In many markets, multiple players can use the same successful strategy without neutralizing it (e.g., both Coke and Pepsi can have good supply chains). Conversely, in politics, if both parties adopt the same platform, they may both lose to a third option. The payoff matrix changes when both players hold the same "winning" hand.

  ### Distinguishing SSO from "Diffusion of Innovation"
  This is the critical boundary you asked for. It is **not** fallacious to say "good strategies tend to spread." That is an empirical claim about market efficiency or social learning (often called *isomorphism* in sociology).

  *   **Diffusion Claim:** "Competitors will try to copy the winner, which reduces the winner's margin over time." (This is descriptive and often true).
  *   **SSO Fallacy:** "Because competitors *could* copy the winner, a sustainable advantage is *logically impossible* to begin with." (This is a logical claim about existence).

  The SSO fallacy conflates *pressure toward equilibrium* with *instantaneous equilibrium*. It treats the *threat* of copying as functionally identical to the *act* of copying.

  ### How to Use This in Argument
  If you encounter this in the wild, you can now say:

  > "You're committing a **Strategy-Stealing Overextension**. You're treating a logical proof that requires perfect symmetry and costless replication as if it applies to a market with high barriers to entry and path dependence. The Strategy-Stealing Argument proves Player 1 can't lose in Hex; it doesn't prove a startup can't have a moat when IP law and network effects make 'stealing' their strategy legally or technically impossible."

  ### Why It Matters Philosophically
  The reason this drives you crazy is that it's a **category mistake between normative logic and descriptive reality**.
  *   **Game Theory Proofs** are normative/logical: "Given these rules, this outcome is necessary."
  *   **Social Science** is descriptive/contingent: "Given these human behaviors, this outcome is probable."

  The SSO fallacy tries to use a logical necessity (from the proof) to dictate a descriptive impossibility (in the market). It assumes the world is as clean as the math. Recognizing this distinguishes a student who knows the theorems from a student who understands the *ontology* of the models.

  So, no, there isn't a Latin tag for it yet. But **Strategy-Stealing Overextension** is the precise carve-out for taking a proof about *possibility spaces* and misapplying it to *friction-filled systems*. Use it.
