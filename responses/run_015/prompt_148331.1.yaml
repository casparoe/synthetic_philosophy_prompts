answer: |-
  Hey, this is a high-stakes spot to be in. You're basically building the type system for biological reality, and since biology is messy, your "types" are going to leak. Here's how to handle the philosophy without getting a PhD.

  ### The 3-Sentence Brainstorm
  Etiological accounts define function by history, asking what survival problem this gene solved for our ancestors. Causal-role accounts define function by mechanics, asking what chemical or physical work the gene is doing in the cell right now. When history and current mechanics disagree, you have to decide whether to label the gene by its evolutionary purpose or its present-day activity.

  ***

  ### The Procedure: The Function-Drift Audit (FDA)
  **Timebox:** 25 minutes max per annotation.
  **Goal:** Produce a spec string that tells downstream users exactly *which* definition of "function" you're using.

  **Step 1: Evidence Sweep (10 mins)**
  *   Query literature databases for the gene/protein.
  *   Extract two specific claims:
      1.  **Historical Claim:** What is the conserved, selected purpose? (Look for keywords: "conserved," "ortholog," "selection," "ancestral").
      2.  **Mechanical Claim:** What is the observed biochemical activity? (Look for keywords: "binds," "catalyzes," "expressed in," "pathway").
  *   **[JUDGMENT CALL]**: If literature is contradictory, pick the most recent high-impact paper and note the conflict in the `UNCERTAINTY_FLAG`.

  **Step 2: The Alignment Check (5 mins)**
  *   Compare the Historical Claim vs. the Mechanical Claim.
  *   **Decision Point A:** Do they match? (e.g., History = "digest sugar", Mechanics = "digests sugar").
      *   *Yes:* Go to Step 3, assign **FDSS 0**.
      *   *No:* Go to Decision Point B.
  *   **Decision Point B:** Is the Mechanical Claim real but the Historical Claim missing or different?
      *   *Missing History:* (Orphan gene, no orthologs). Assign **FDSS 2**.
      *   *Different History:* (e.g., History = "viral defense", Mechanics = "placenta building"). Assign **FDSS 1**.
  *   **[JUDGMENT CALL]**: If the mechanical effect looks like a side-effect (noise) rather than a regulated activity, flag as `POTENTIAL_SPANDREL`.

  **Step 3: Scoring & Tagging (5 mins)**
  *   Apply the **Function-Drift Severity Score (FDSS)**:
      *   **0 (Stable):** History and Mechanics align. Safe for automated pipelines.
      *   **1 (Drifted):** History and Mechanics differ (Exaptation). Safe for analysis, but don't assume evolutionary conservation implies same role.
      *   **2 (Opaque):** Mechanics known, History unknown. Do not use for evolutionary modeling.
  *   **[AUTO-FAIL]**: If FDSS is 2 and the pipeline requires evolutionary conservation, halt and request human review.

  **Step 4: Documentation String (5 mins)**
  *   Write the spec using this template:
      *   `FUNC_MECH: [What it does now] | FUNC_ETIO: [What it evolved for] | FDSS: [0-2]`
  *   **[JUDGMENT CALL]**: If you have to truncate the description to fit schema limits, prioritize `FUNC_MECH` for clinicians, `FUNC_ETIO` for researchers.

  ***

  ### Hard Case Handling
  *   **Pleiotropy (One gene, many jobs):** List the primary mechanical role in `FUNC_MECH`. List all known historical pressures in `FUNC_ETIO` separated by semicolons. Set FDSS to 1 if roles conflict.
  *   **Spandrels/Co-option:** If the current job is useful but evolved as a byproduct, set `FUNC_ETIO` to "None/Byproduct" and `FUNC_MECH` to the current activity. FDSS = 1.
  *   **Redundancy:** If the causal role disappears when knocked out (because backup takes over), but evolution kept it: Trust the evolutionary record for `FUNC_ETIO`, note the redundancy in `UNCERTAINTY_FLAG`.
  *   **Missing Evidence:** If you can't find evolutionary data after 10 mins of searching, default to FDSS 2. Do not guess.

  ***

  ### Worked Cases

  **Case 1: The Clean Match (Hexokinase 1)**
  *   **Step 1:** History says "glycolysis initiation in vertebrates." Mechanics says "phosphorylates glucose."
  *   **Step 2:** They match. Decision Point A = Yes.
  *   **Step 3:** FDSS = 0.
  *   **Step 4 Doc:** `FUNC_MECH: Glucose phosphorylation | FUNC_ETIO: Energy metabolism | FDSS: 0`
  *   **Outcome:** Senior engineer signs off instantly. Pipeline treats this as stable ground truth.

  **Case 2: The Messy Split (Syncytin-1)**
  *   **Step 1:** History says "retroviral envelope protein (infection)." Mechanics says "cell-cell fusion in placenta."
  *   **Step 2:** They differ. Decision Point B = Different History. This is co-option.
  *   **Step 3:** FDSS = 1. Tag `CO_OPTION_EVENT`.
  *   **Step 4 Doc:** `FUNC_MECH: Trophoblast fusion | FUNC_ETIO: Viral entry (ancestral) | FDSS: 1`
  *   **Outcome:** Users hate the dual-label because it looks contradictory, but it prevents researchers from assuming this protein behaves like other viral proteins today. You explicitly write: *"Note: Etiological origin is viral, but current physiological role is structural."*

  **Case 3: The Unknown Origin (Human Orphan Gene X)**
  *   **Step 1:** History says "No orthologs found outside primates." Mechanics says "Binds to chromatin modifier Y."
  *   **Step 2:** History is missing. Decision Point B = Missing History.
  *   **Step 3:** FDSS = 2. Tag `EVOLUTIONARY_NOVELTY`.
  *   **Step 4 Doc:** `FUNC_MECH: Chromatin binding | FUNC_ETIO: Unknown/Lineage Specific | FDSS: 2`
  *   **Outcome:** Pipeline blocks this from any analysis requiring cross-species comparison. Clinicians see the mechanical binding but know not to trust animal models for this specific gene.

  ***

  ### What This Procedure Cannot Do
  Look, I need to be real with you so you don't get burned during sign-off. This checklist doesn't solve the metaphysics of biology; it just forces you to be consistent about which metaphysics you're using. It won't catch if the underlying literature is wrong (garbage in, garbage out). It won't replace a real biologist when the FDSS hits 2 and the stakes are life-or-death. And finally, it assumes "function" is a property of the gene itself, when sometimes function is entirely context-dependent (tissue-specific). Use this to structure your specs, not to certify biological truth.
