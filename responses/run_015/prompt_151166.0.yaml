answer: |-
  Hi everyone. Welcome to *Who Gets Counted?*

  Looking around the room, I know this is a slightly unusual mix. On one side, we've got urban planners who deal in concrete, zoning codes, and hard deadlines. On the other, moral philosophers who deal in… well, abstract concepts and hypothetical worlds. Usually, you guys don't have much reason to talk to each other. But for the next few days, you're stuck with us.

  I want to start by admitting something risky. I think we're all trying to solve the same problem, but we're using different maps.

  For the planners here: your job is basically to look at a spreadsheet and say, "Okay, in twenty years, there will be Y people, so we need X housing units." You treat that population number as a given. It's a force of nature. You build the shelter to match the people.

  But for the philosophers in the room, that number isn't a given. It's a choice.

  Here's the thing that keeps me up at night. If you build dense, affordable housing in a specific neighborhood, you aren't just accommodating people who were already waiting in line. You're changing *who* shows up. You're changing which families exist, where they live, maybe even who gets born because the costs shifted. The plan doesn't just house the future; it kind of creates it.

  It's like… okay, imagine you're hosting a party. This analogy might fall apart, but stick with me. You have a limited amount of pizza and space. If you send out more invites, the party is bigger, and maybe the total amount of fun goes up because more people are having *some* fun. But the vibe gets chaotic, and everyone gets less pizza. If you keep the list small, the people there have an amazing time, but fewer people overall get to come.

  You still have to decide whether to send the invite. But adding a name to the list isn't just arithmetic. It changes the party.

  And this is where I worry our spreadsheets are lying to us. When we count future lives as just a positive number—more people equals good—we might accidentally argue for a city that's packed to the brim, where everyone's life is just barely okay, instead of a slightly smaller city where everyone is thriving. I'm not saying one is right. Some people think the total sum of happiness is what matters. Others think quality matters more than quantity. I'm not here to solve that debate today.

  But I am asking us to notice the affect these assumptions have on the blueprints.

  If we treat population as neutral math, we might pick Policy A. But if we acknowledge that Policy A brings different people into existence than Policy B, the "best" choice might flip. This isn't about saying we shouldn't build housing. We absolutely should. It's about admitting that when we draw the lines on the map, we aren't just counting people. We're deciding who gets to be counted.

  So, over the next few days, I hope we can get comfortable with that discomfort. The planners, try not to zone out when the talk gets abstract. The philosophers, try not to cringe when we talk about square footage. Let's see if we can figure out who exactly is inside these numbers.

  Thanks, and welcome.
