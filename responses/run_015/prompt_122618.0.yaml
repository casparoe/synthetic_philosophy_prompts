answer: |-
  **Proposal: Custody vs. Delivery in Intergenerational Climate Justice**

  **1. The Question**
  Can a non-person-affecting custodial duty constrain climate policy without collapsing into a person-affecting delivery duty or becoming merely expressive? I define *delivery duties* as obligations to maximize welfare or options for specific future individuals. I define *custodial duties* as obligations to maintain the integrity of a practice or institution (e.g., the biosphere as a shared trust) independent of specific beneficiaries' welfare metrics. Custodial duties exist only if they prescribe actions that delivery duties would forbid or require differently, based on the structural requirements of the practice rather than outcome values. The determinate question is: In the "successor-values case," does a custodial account prescribe emission constraints that a delivery account rejects?

  **2. Why Existing Positions Leave the Question Open**
  Person-affecting views and "no-difference" replies to the non-identity problem fail to bind agents when policy choices determine which individuals exist. Contractarian intergenerational savings principles rely on mutual advantage or reciprocity, which breaks down when future generations cannot reciprocate. Rights-based accounts struggle to ascribe rights to non-existent entities without presupposing the very welfare metrics at issue. Discounting and cost-benefit approaches treat the issue as aggregative, ignoring deontic constraints on how resources are handled. Veil-of-ignorance devices assume parties share identical rational preferences across time, failing to account for the successor-values case where future rationality diverges from ours.

  **3. The Approach**
  I will argue via conceptual analysis of duty structures rather than settling on a discount rate. A discount rate assumes the metric of value (welfare) is fixed; my approach challenges whether welfare is the correct metric for intergenerational obligations. The invented cases are superior to familiar ones (e.g., resource depletion) because standard cases conflate harming future people with changing who exists. The successor-values case isolates the variable of *valuation*: if future people do not value what we preserve, a delivery view says preservation is wasteful, while a custodial view says it is mandatory. The "end-of-chain" case tests whether custody requires a recipient or is intrinsic to the role.

  **4. Week-by-Week Plan**
  *Weeks 1–3:* Refine the delivery/custody distinction against existing typologies. *Stuck point:* Defining "practice" without smuggling in welfare outcomes.
  *Weeks 4–6:* Draft the core argument using the successor-values case. Establish that delivery views must endorse value-adaptation while custody demands value-preservation.
  *Weeks 7–9:* Stress-test against the empty-custodianship objection. Develop criteria for "substantive custody" vs. symbolic gestures. Analyze the end-of-chain case.
  *Weeks 10–12:* Revise for clarity and word count. Derive the policy implication. Final proofreading. *Stuck point:* Preventing the collapse of custody into rule-consequentialism.

  **5. A Successful Result**
  A successful paper will demonstrate that custodial duties survive the empty-custodianship objection by requiring binding institutional constraints, not just symbolic declarations. It will show that these duties diverge from delivery duties in the successor-values case. For a climate policy committee, the actionable conclusion is: "Mandates must preserve the *capacity* for ecological stewardship as an institutional end, not merely maximize future welfare metrics, even if future generations value stewardship less."

  **6. Honest Failure Conditions**
  The project fails if: (1) The custodial account quietly collapses back into a delivery account (e.g., because "maintaining the practice" is only valuable for future welfare); (2) It survives only by becoming merely expressive (constraining nothing); (3) The successor-values case turns out not to discriminate between the two accounts (e.g., because delivery views also value autonomy over value-formation). A fourth risk is that the "practice" to be custodied cannot be defined non-arbitrarily without begging the question.

  **7. Scope Note**
  The most likely cause of overreach is attempting to fully solve the empty-custodianship objection while also defending the successor-values case. If length becomes critical, I will cut the "end-of-chain" stress case. It is illustrative but secondary to the main discrimination test provided by the successor-values case.

  ***

  **Tractability Note**
  There is a significant risk that the delivery/custodial distinction is merely verbal, mapping onto existing distinctions (e.g., act vs. rule consequentialism) without doing new normative work. If the distinction collapses under analysis, the nearest tractable version of this project is to focus solely on the successor-values case as a critique of welfarist intergenerational ethics. This would shift the paper from defending a specific "custodial" ontology to demonstrating that any adequate theory of intergenerational justice must account for the preservation of values independent of future welfare maximization. This narrower scope is more manageable for 6,000 words and avoids the metaphysical overhead of defining "custody" as a distinct category of duty.
