answer: |-
  Deweyan legitimacy derives not from aggregating pre-existing wills but from institutionalizing the experimental testing of policy consequences as public data. For Dewey, democracy is primarily a mode of associated living grounded in social inquiry, not merely a mechanical counting of votes. If policies are hypotheses about solving shared problems, their legitimacy depends on whether institutions allow communities to observe outcomes, recognize failures, and revise courses of action. This prioritizes fallibilism over fixed consent.

  Critics argue this reduces politics to technocratic management, privileging experts over citizens. However, Dewey distinguishes routine problem-solving, which applies fixed means to ends, from genuinely experimental inquiry, which reconstructs both means and ends through public engagement. Technocracy assumes experts know the good; experimentalism recognizes that only those experiencing the consequences can fully judge them. Therefore, institutional design must not merely empower specialists to implement solutions, but must structure channels for diverse publics to articulate disturbances and interpret results. Routine administration closes inquiry; experimental design keeps it open. Legitimacy fades when institutions rigidify outcomes into dogma rather than treating them as data for further inquiry. True democratic authority emerges from the collective intelligence generated when diverse experiences inform ongoing revision, ensuring power remains responsive to lived reality rather than abstract mandates.
