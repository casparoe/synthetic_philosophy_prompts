  2.  **Determine the Opponent's Strategy (Sortition Advocate):**
      *   I need to challenge the user's reform package without dismissing it outright, but showing why it fails to solve the core problems that sortition solves.
      *   Key arguments against elections (even with term limits):
          *   *Selection Bias:* Elections select for traits unrelated to governance (fundraising, charisma, ruthlessness, wealth). Term limits don't fix *who* gets selected, only how long they stay.
          *   *Party Discipline:* Even without re-election, parties control ballot access, committee assignments, and future career prospects (even with lobbying bans, there are other careers).
          *   *Constituent Accountability vs. Common Good:* Elections incentivize pleasing a plurality/majority of voters or donors, not necessarily deliberating for the common good. Sortition creates a descriptive representative body.
          *   *The "Crook" Argument:* Impeachment/removal is rare and political. Sortition relies on legal accountability like any citizen, plus the short term limits exposure.
          *   *Incentive Residuals:* Even with delayed pensions, politicians want legacy, future book deals, speaking fees (if not banned broadly), or party favor.
      *   I need to focus on the *selection mechanism* itself. The user addresses *incentives* (re-election, lobbying). I need to argue that *selection* is the primary filter that distorts representation.
