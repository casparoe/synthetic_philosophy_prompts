  2. (4) claims obligations to future people despite identity-affecting choices, but (1) relies on person-affecting constraints that dissolve when existence is contingent. You must abandon strict person-affecting views for future generations, costing the intuitive shield against sacrificing specific interests for abstract future stability.
  3. (2) prohibits creating net-positive lives with high suffering, while (1) only prohibits clearly miserable lives. You must either expand (1)'s asymmetry to cover moderate suffering or accept (2) as a separate principle, costing theoretical unity in your prohibition against creation.
  4. (6) asserts value in humanity's continuation beyond individual desires, while (1) claims no reason to add happy individuals. You must ground (6) in impersonal value distinct from individual welfare, costing the person-affecting framing that makes (1) attractive.

  The most efficient revision is to adjust (1) from claiming "no moral reason" to "no strict duty, though pro tanto reasons exist." This preserves the asymmetry (you aren't required to breed) while allowing welfare comparisons to drive the obligations in (3) and (4). The cost is negligible: you lose the hard line against impersonal reasons, but gain a coherent framework where improving future welfare justifies selection and risk reduction without demanding reproduction.

  (5) only appears inconsistent with (1). Supporting fertility treatment addresses the desires of existing parents, not a moral imperative to populate the world. Since (1) forbids reasons to create *for the sake of the child or value*, not reasons to assist *existing people's projects*, state funding remains permissible without contradicting your asymmetry.
