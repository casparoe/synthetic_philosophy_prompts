answer: |-
  You have hit a very real, very old, and genuinely unresolved wall. You are not missing a trick; you are standing in the middle of a debate that has been running in philosophy of probability and statistical foundations since the 1970s.

  Here is the breakdown of the literature, the math, and the normative contestation.

  ### 1. What is this called?

  There is no single "Paradox of X" name, but if you search for these terms, you will find the canonical literature:

  *   **Probability Kinematics (or Jeffrey Conditioning):** The general framework for updating when you don't learn a proposition is *true*, but rather that your probability for it has changed.
  *   **Updating on Conditional Constraints:** The specific sub-problem where the constraint is on $P(A|B)$ rather than $P(B)$.
  *   **The Principle of Minimum Relative Entropy (MinEnt):** The most common operational solution (your third team member).
  *   **Virtual Evidence:** The term used in Bayesian Networks (Pearl) for handling this kind of input, though it often smuggles in MinEnt assumptions.

  The specific configuration you describe—where an expert provides a conditional ratio $P(E|H)$ but leaves the marginal $P(H)$ untouched—is often discussed as a case of **underdetermined belief revision**.

  ### 2. The Mathematical Reality (Settled)

  Your first team member ("refuses to move") and the math are partially right: **The problem is formally underdetermined.**

  Let $H$ be "Admin Access" and $E$ be "Vendor Portal".
  You have a prior $P_{old}$.
  You receive a constraint: $P_{new}(E|H) = k \cdot P_{new}(\neg E|H)$ (or similar).
  You want $P_{new}(E)$.

  By the law of total probability:
  $$P_{new}(E) = P_{new}(E|H)P_{new}(H) + P_{new}(E|\neg H)P_{new}(\neg H)$$

  The expert fixes the first term's ratio. They say nothing about $P_{new}(H)$ (the marginal probability of admin access) and nothing about the branch $\neg H$.
  Mathematically, there is an **infinite family of posteriors** that satisfy the expert's constraint. Any choice of $P_{new}(H)$ yields a valid probability distribution consistent with the expert's statement.

  Therefore, **no update rule can be derived from the axioms of probability alone.** Probability theory tells you how to *propagate* changes, not how to *select* a posterior from a set of consistent posteriors. To pick one, you must import a **meta-principle** (a selection criterion).

  ### 3. The Proposed Answers (and their justifications)

  Here is where your team members' instincts map onto the literature, and where the fighting happens.

  #### A. The "Do Nothing" Stance (Strict Conditionalization)
  *   **Literature:** Traditional Bayesianism (e.g., early Carnap, strict subjectivists).
  *   **Argument:** Rational updating requires **Partitional Evidence**. You must learn that some proposition $D$ is true (or that $P(D)$ is now 1). A constraint on a conditional probability is not an "event" in the sample space.
  *   **Verdict:** Philosophically pure, practically useless for your work. It treats the expert's statement as meaningless noise unless it can be cashed out as a likelihood $P(\text{Expert Says X} | \text{World State})$.

  #### B. The "Fix the Marginal" Stance (Local Updating)
  *   **Literature:** Sometimes called **"The Principle of Minimal Information"** or implicit in some applications of **Jeffrey Conditioning**.
  *   **Mechanism:** Keep $P_{new}(H) = P_{old}(H)$. Only redistribute mass within the $H$ branch to satisfy the ratio.
  *   **Justification:** This assumes the information is **screened off** from the marginal. It assumes the expert's knowledge about the *mechanism* (Vendor vs. VPN) is independent of the *prevalence* (Admin Access).
  *   **The Trap:** This is a massive independence assumption. If the expert knows the ratio is 3:1, does that not imply they have seen data that might also shift the base rate of Admin Access? By fixing the marginal, you are asserting **logical independence** between the constraint and the marginal without evidence.
  *   **Status:** Convenient, but rarely defensible as a rational requirement.

  #### C. The "Closest Posterior" Stance (MinEnt / KL Divergence)
  *   **Literature:** **Shore & Johnson (1980)**, **Jaynes (1957)**, **Williams (1980)**.
  *   **Mechanism:** Select the $P_{new}$ that satisfies the constraint and minimizes the Kullback-Leibler divergence $D_{KL}(P_{new} || P_{old})$.
  *   **Justification:** This is the **Principle of Minimum Relative Entropy**. It claims to be the unique rule that satisfies certain consistency axioms (e.g., system independence, subset independence). It changes the prior *as little as possible* to accommodate the new constraint.
  *   **Status:** This is the dominant convention in Machine Learning and Information Theory. **However**, it is **not a theorem of probability**. It is a normative principle.

  #### D. The "Virtual Evidence" Stance (Pearl)
  *   **Literature:** **Judea Pearl (1988, 2000)**.
  *   **Mechanism:** Model the expert's statement as a likelihood ratio on a dummy node.
  *   **Connection:** In many standard configurations, Pearl's method for virtual evidence yields the **same result as MinEnt**.
  *   **Status:** This is the engineering workaround. It forces the conditional constraint into a standard Bayes update by constructing a likelihood function that *would have produced* that constraint.

  ### 4. Where the Fight Is (Contested vs. Settled)

  This is the part you asked for explicitly.

  **Settled (Math):**
  *   There is no unique solution without a selection criterion.
  *   Different criteria (Fix Marginal vs. MinEnt) yield different posteriors for the unconditional event $P(E)$.
  *   Therefore, the choice of update rule **changes your predictions**.

  **Contested (Philosophy/Rationality):**
  *   **Are Shore & Johnson's Axioms Rational Requirements?**
      Shore and Johnson (1980) proved that MinEnt is the *only* rule satisfying their axioms. However, **Teddy Seidenfeld** (a major figure in this debate) has spent decades arguing that these axioms are not requirements of rationality.
      *   *The Critique:* Seidenfeld argues that MinEnt can lead to **incoherent** decisions in specific sequential betting scenarios. He argues that minimizing KL divergence is a useful heuristic for statistical inference, but it is not a law of thought like Bayes' Rule.
      *   *Reference:* Seidenfeld, T. (1987). "Entropy and Uncertainty."
  *   **Is "Minimal Change" the Right Goal?**
      MinEnt assumes the prior contains "truth" that should be preserved unless forced otherwise. But if the expert's conditional constraint implies their information source is fundamentally different from your prior's source, preserving the marginal (which MinEnt tends to do more than the "Fix Marginal" approach, depending on the geometry) might be wrong.
  *   **The "Irrelevance" Assumption:**
      Team Member 2 (Fix Marginal) assumes the constraint is irrelevant to the marginal. Team Member 3 (MinEnt) makes a softer assumption about the structure of the change. Neither is provably "correct."

  ### 5. Canonical References for Your Literature Review

  If you want to cite the "wall" you are hitting, these are the papers:

  1.  **Diaconis, P., & Zabell, S. L. (1982). "Updating Subjective Probability."** *Journal of the American Statistical Association.*
      *   *Why:* This is the classic paper. They analyze Jeffrey conditioning and show the limitations. They explicitly discuss the underdetermination of conditional constraints.
  2.  **Shore, J. E., & Johnson, R. W. (1980). "Axiomatic derivation of the principle of maximum entropy and the principle of minimum cross-entropy."** *IEEE Transactions on Information Theory.*
      *   *Why:* The foundational argument for why your third team member's instinct (MinEnt) is the "standard" choice.
  3.  **Wagner, C. (2002). "Probability Kinematics and the Principle of Minimum Relative Entropy."** *Philosophy of Science.*
      *   *Why:* Wagner explicitly connects Jeffrey conditioning with MinEnt and discusses the conditions under which they diverge. He addresses the "conditional constraint" problem directly.
  4.  **Pearl, J. (1988). *Probabilistic Reasoning in Intelligent Systems*. (Section on "Virtual Evidence").**
      *   *Why:* For the ML/BN perspective on how to implement this without breaking the graph.
  5.  **Seidenfeld, T. (1987). "Entropy and Uncertainty."** *Philosophy of Science.*
      *   *Why:* For the counter-argument that MinEnt is not rationally required.

  ### 6. Practical Advice for a PhD Student

  Since you are in ML and not pure philosophy, you likely need to ship a model. Here is the honest positioning:

  1.  **Acknowledge the Underdetermination:** In your paper/method section, explicitly state: *"The expert constraint $P(E|H)=k$ underdetermines the posterior distribution. We adopt the Principle of Minimum Relative Entropy to select a unique posterior."*
  2.  **Defend MinEnt as a Convention, not a Law:** Do not claim MinEnt is "the Bayesian way." Claim it is the **standard information-theoretic convention** for handling linear constraints on probabilities when likelihoods are unavailable. Cite Shore & Johnson.
  3.  **Sensitivity Analysis:** Since the choice of $P_{new}(H)$ is the free variable, the most rigorous thing you can do is treat $P_{new}(H)$ as a sensitivity parameter. Show how your final output $P(E)$ varies as you let $P_{new}(H)$ drift from the prior. If your decision is robust across that range, the problem dissolves. If it flips, you have identified a critical information gap.
  4.  **The "Virtual Evidence" Hack:** If you are working in Graphical Models, implement the expert constraint as a **likelihood ratio node** (Virtual Evidence). This is computationally equivalent to MinEnt in many standard topologies and is more accepted in the engineering community than philosophical kinematics.

  **Summary:** Your intuition is correct. There is no theorem that forces one of these updates. MinEnt is the dominant *convention* in information science, but it rests on axioms that are contested in philosophy. The "Fix Marginal" approach is an independence assumption that is usually unjustified. The "Do Nothing" approach is theoretically safe but practically inert.

  You are not stuck; you are doing foundational work. Just make sure you label the selection criterion as a **modeling assumption**, not a mathematical necessity.
