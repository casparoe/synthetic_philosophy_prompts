      *   *The Problem:* If 2 million people get the flu, does their collective complaint outweigh the one death? Scanlon's individualist restriction says we look at the *strongest individual complaint*. The death complaint is stronger than any single flu complaint. So, save the life. This feels counterintuitive to many (the "aggregationist" intuition).
      *   *Strategies for Contractualists:*
          *   *Ex Ante vs. Ex Post:* Maybe we judge principles based on expectations before knowing who is who (Harsanyi/Rawlsian veil of ignorance style, though Scanlon is wary of this).
