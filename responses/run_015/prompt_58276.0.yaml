answer: |-
  **The Sovereign Individual: Contractualism and the Limits of Aggregation**

  T. M. Scanlon's contractualism offers a distinctive account of moral wrongness: an act is wrong if it would be disallowed by principles that no one could reasonably reject as a basis for informed, unforced general agreement. Central to this framework is the "individualist restriction." When assessing whether a principle can be reasonably rejected, we must consider the objections of individuals one by one, rather than summing the gains and losses across a population. This restriction creates a profound tension with common moral intuitions regarding aggregation. Many hold that a sufficiently large number of modest benefits can morally outweigh a single grave harm. Yet, if objections are assessed individually, the person suffering the grave harm appears to have a veto that the many sufferers of modest harms cannot override, as no single one of their complaints matches the gravity of the harm to the one.

  This essay examines whether Scanlonian contractualism can navigate three stylized allocation problems—a one-off rescue, a standing policy, and a risk-imposition scenario—without abandoning the individualist restriction or endorsing morally untenable verdicts. I will argue that contractualism need not capitulate to interpersonal aggregation to solve these puzzles. By distinguishing between ex post and ex ante standpoints, and by permitting intrapersonal aggregation over time, contractualism can yield defensible verdicts in policy and risk cases while maintaining an uncompromising stance in one-off rescue cases. Ultimately, the counterintuitive verdict in the rescue case is not a failure of the theory, but a necessary correction to the utilitarian bias inherent in aggregationist intuitions.

  ### The Core Tension: Separateness and Summation

  The controversy over aggregation stems from a conflict between two moral perspectives. The aggregationist view, often rooted in utilitarianism, treats moral value as a aggregate sum of well-being. On this view, if the total utility of preventing two million bouts of influenza exceeds the utility of preventing one death, the former is obligatory. The contractualist view, drawing on the Rawlsian idea of the "separateness of persons," treats individuals as sovereign sources of claims. To aggregate interpersonal complaints is to treat society as a single super-person, allowing the losses of some to be compensated by the gains of others in a way that violates the distinctness of individual lives.

  For Scanlon, the strength of a reasonable rejection depends on the burden a principle imposes on an individual relative to the burdens alternatives would impose on others. In a direct comparison between one person facing death and one person facing influenza, the death complaint is decisively stronger. The individualist restriction forbids the two million influenza sufferers from combining their complaints to create a "super-complaint" that outweighs the death. To allow this would be to sacrifice the one for the sake of the many, treating the one as a mere means to the aggregate good.

  However, critics argue this leads to absurdity. If contractualism forbids saving the two million from the flu to save the one from death, it seems to prioritize the "identifiable victim" over the "statistical victims" in a way that ignores the sheer scale of suffering. To address this, contractualists have developed three key strategies: (1) appealing to the separateness of persons to defend non-aggregation; (2) utilizing *ex ante* reasoning to assess risks before identities are known; and (3) allowing *intrapersonal* aggregation, where an individual sums burdens they face over time.

  ### Case 1: The One-Off Rescue

  The first case presents a stark choice: prevent the early death of one identified young adult or prevent a two-day bout of moderate influenza for two million people. This is an *ex post* scenario; the victims are identified, and the harms are certain.

  The aggregationist intuition insists that two million people suffering is worse than one person dying. The contractualist verdict, adhering strictly to the individualist restriction, is that the principle allowing the death to prevent the flu is reasonably rejectable by the one, whereas the principle preventing the death to allow the flu is not reasonably rejectable by any single flu-sufferer. The burden of death is generically so much heavier than the burden of a two-day flu that no single flu complaint can match it.

  Does this verdict fail? The contractualist must argue that the counterintuitive feeling arises from a category error. We are tempted to sum the flu complaints because we are thinking like social planners maximizing efficiency. But morality, on the contractualist view, is about what we owe to each other as individuals. To tell the one person, "You must die so that two million others can avoid a mild inconvenience," is to deny their status as an equal. The "loss" to the two million is distributed; no single individual among them suffers a harm comparable to death.

  Therefore, in Case 1, the contractualist must remain uncompromising. The individualist restriction holds. The one life must be saved. This is not a bug but a feature: it protects the individual from being submerged by the collective. The aggregationist position fails here because it cannot account for the *distribution* of harm. It sees a total quantity of pain; contractualism sees a specific violation of a specific person's claim to life.

  ### Case 2: The Standing Policy

  The second case complicates matters by introducing iteration. An agency faces a thousand structurally similar decisions over a decade. In each instance, one severe impairment (analogous to the death/serious harm) is traded against many minor ailments (flu).

  If we treat each decision as an isolated Case 1, the agency must always prevent the severe impairment. Over a decade, this results in 1,000 severe impairments prevented, but millions of flu bouts accumulated. However, the "standing policy" nature of the case opens the door to *intrapersonal aggregation* and *generic* reasoning.

  Scanlon allows individuals to aggregate burdens they face over a lifetime. If the population of "two million" is relatively stable, the standing policy means the *same* individuals suffer the flu repeatedly. While one bout of flu is trivial compared to death, suffering from the flu 1,000 times over a decade (assuming the individuals are in the risk pool each time) constitutes a chronic, debilitating burden. An individual can reasonably reject a principle that condemns them to a decade of chronic illness, even if they cannot reject a principle condemning them to a single bout.

  Here, contractualism handles the case without abandoning the individualist restriction. We do not sum the complaints of Person A and Person B. We sum the complaints of Person A over Time 1 through Time 1000. If the cumulative burden of the flu on a single individual over the decade becomes comparable to the severe impairment, that individual can reasonably reject the policy that prioritizes preventing the severe impairment.

  Alternatively, if the "one" victim is drawn randomly from the population each time, everyone faces a small *ex ante* risk of being the severe victim. This shifts the analysis toward the third case. But assuming the "many" are a fixed group suffering repeatedly, intrapersonal aggregation allows the contractualist to validate the intuition that the flu matters in the aggregate, without permitting interpersonal summation. The aggregationist is partially vindicated, but only because the distributed harm has coalesced into a concentrated harm *within* individuals.

  ### Case 3: Risk-Imposition and the Ex Ante Turn

  The third case involves risk imposition before anyone knows who will be affected. Rule A imposes a tiny increased risk of death on everyone. Rule B imposes a substantial risk of a short hospital stay on a smaller group. The expected outcomes are equivalent in the aggregate.

  This is the natural domain of *ex ante* contractualism, championed by philosophers like Johann Frick. In risk cases, we assess reasonable rejection based on the expected burden to individuals before the lottery is run, not the actual outcome after.

  Under Rule A, every individual faces a tiny risk of death. Under Rule B, a smaller group faces a substantial risk of hospitalization. To determine which principle is rejectable, we compare the strength of the *ex ante* complaints. A tiny risk of death is generally considered a very minor burden (we accept such risks daily by crossing the street). A substantial risk of hospitalization is a more significant *ex ante* burden, even if the outcome is less severe than death.

  However, the contractualist must also consider the "generic standpoint." A principle that concentrates risk (Rule B) condemns a specific subset of people to a high probability of harm, whereas Rule A spreads the risk thinly. Scanlon suggests that individuals can reasonably reject principles that expose them to high risks of severe harm when alternatives exist that spread the risk more evenly, provided the *ex ante* expected burden is not significantly higher.

  In this specific setup, where expected outcomes are equivalent, the contractualist likely favors Rule A (tiny death risk for all). Why? Because the *ex ante* complaint of facing a tiny risk of death is weaker than the *ex ante* complaint of facing a substantial risk of hospitalization. Even though death is worse than hospitalization, the probability weighting matters. If the risk of death is vanishingly small, the expected loss is low. The smaller group in Rule B faces a high probability of a negative outcome. They have a stronger reasonable rejection.

  This allows contractualism to endorse what looks like aggregation (sacrificing the safety of all to prevent the concentrated suffering of a few) without actually summing utilities. It compares individual *ex ante* complaints. The aggregationist argues we should look at the total expected deaths vs. hospitalizations. The contractualist looks at the fairness of the risk distribution and the strength of individual probabilistic complaints. Here, contractualism aligns with intuition (spreading risk is often preferable) but for deontological reasons regarding individual claims, not utilitarian reasons regarding total welfare.

  ### The Case for Aggregation and Its Failure

  Despite these maneuvers, the aggregationist presses a strong objection: there is a threshold where the sheer number of minor harms *must* outweigh a grave harm. If the choice is between one death and two million people losing their lives' savings, surely we save the two million? To deny this seems fetishistic about the individualist restriction.

  The contractualist response is that this intuition relies on sliding between *intrapersonal* and *interpersonal* aggregation. If the two million people each lose their savings, no single individual is ruined. If one person dies, that individual is totally ruined. The aggregationist asks us to treat the group's loss as a single massive loss. But morality is relational; it governs how we treat specific people.

  The aggregationist position fails because it cannot respect the "separateness of persons" without ad hoc constraints. If we allow aggregation for flu vs. death, where is the limit? Does one death outweigh two flu cases? Two thousand? Two million? Any threshold chosen seems arbitrary from a utilitarian perspective, yet necessary from a contractualist one. Contractualism provides the non-arbitrary threshold: the point at which a single individual's burden becomes comparable to the other.

  Furthermore, the aggregationist view struggles with Case 3. If we simply sum expected utilities, we might justify imposing a 100% risk of death on one person to save a million people from a 1% risk of broken legs (if the numbers math out). Contractualism, via *ex ante* reasoning, blocks this, recognizing that the individual facing certain death has a veto that the probabilistic complaints of the million cannot override. The aggregationist view, by focusing on totals, risks sacrificing the identifiable individual to the statistical multitude, a moral hazard contractualism is designed to prevent.

  ### Conclusion: A Defended Verdict

  The aggregation controversy forces a choice between moral mathematics and moral status. My verdict is that contractualism should remain **uncompromising on the individualist restriction in one-off cases (Case 1), but flexible in policy and risk cases (Cases 2 and 3) via intrapersonal and ex ante reasoning.**

  In Case 1, the contractualist must accept the "counterintuitive" verdict: save the one life. This is not a failure of the theory, but a correction of our utilitarian conditioning. The intuition that the two million flu cases outweigh the death is a product of thinking like a bureaucrat managing resources, not a moral agent respecting persons. To allow the aggregation would be to declare that the many have a right to the one's life because their collective discomfort is great enough. This undermines the very idea of individual rights.

  In Cases 2 and 3, contractualism demonstrates its sophistication. By allowing intrapersonal aggregation over time, it acknowledges that repeated minor harms can become major burdens for specific individuals, validating the policy intuition without summing across persons. By utilizing *ex ante* reasoning in risk cases, it allows for the management of statistical lives without condemning specific individuals to fate.

  The opposing aggregationist position fails because it lacks a principled account of distribution. It sees only the sum, blind to the structure of the sacrifice. Contractualism, by contrast, preserves the sovereignty of the individual while offering sufficient tools to handle complex, real-world allocation problems. It teaches us that while we may count costs when they fall upon the same person over time, we cannot count persons when the costs fall upon different people at the same time. In a world increasingly driven by cost-benefit analysis, this uncompromising defense of the individual is not merely plausible; it is indispensable.
