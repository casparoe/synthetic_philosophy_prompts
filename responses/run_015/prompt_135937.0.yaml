answer: |-
  The position you have identified is most precisely termed **Relativistic Presentism** (or **Local Presentism**), but its sophisticated ontological defense is known as **Fragmentalism**.

  Your intuition that this position risks collapsing into the Block Universe (Eternalism) is the central objection raised against it, often formalized as the **Rietdijk-Putnam Argument**. However, there is a logical space between the two, provided one accepts a specific constraint on how reality is structured.

  Here is the carving of that position, its boundaries, and the condition under which it collapses.

  ### 1. The Name and the Ontological Move
  The view is **Relativistic Presentism**. Unlike classical Presentism, which posits a single, global simultaneity slice that constitutes "reality," Relativistic Presentism asserts that existence is **frame-relative**.

  However, your description ("reality contains all of these local present-moments together") hints at the collapse. To remain distinct from Eternalism, the view must be refined into **Fragmentalism** (a term championed by philosopher Kit Fine).
  *   **Eternalism (Block):** All events exist *simpliciter*. The fact that Event $E$ is present for Observer $A$ and past for Observer $B$ is just a matter of perspective on a single, existing manifold.
  *   **Fragmentalism:** The fact that "$E$ is present" is real for $A$, and the fact that "$E$ is past" is real for $B$, but these facts do not obtain *together* in a single, coherent global reality. Reality is "fragmented" into perspectives that are equally real but ontologically disjoint.

  ### 2. Distinction from the Block and Classical Presentism
  The distinction lies in the status of **conjunction**.

  *   **Classical Presentism:** Only one slice exists. (Rejects SR's relativity of simultaneity or posits a preferred frame).
  *   **Block Universe:** All slices exist, and their coexistence is a global fact. (Accepts SR; accepts **Aggregation**).
  *   **Fragmentalism/Relativistic Presentism:** All slices are real *relative to their frames*, but their coexistence is **not** a global fact. (Accepts SR; rejects **Aggregation**).

  The Block Universist says: "It is true that ($E$ is present for $A$) AND ($E$ is past for $B$)."
  The Fragmentalist says: "It is true for $A$ that ($E$ is present), and true for $B$ that ($E$ is past), but there is no 'view from nowhere' where these two truths are conjoined."

  ### 3. The Boundary Condition: The Principle of Aggregation
  You asked where the edge lies: *At what point does multiplying present-slices cease to be presentism and become the very view it was meant to resist?*

  The boundary is crossed at the **Principle of Aggregation**. This principle states: *If fact $P$ is real and fact $Q$ is real, then the conjunction ($P$ and $Q$) is real.*

  *   **Inside the Boundary (Presentism/Fragmentalism):** You deny the Principle of Aggregation for tensed/frame-relative facts. You claim that while Observer $A$'s "now" is real, and Observer $B$'s "now" is real, they do not form a single composite reality. There is no container that holds them both.
  *   **Outside the Boundary (Eternalism):** You accept the Principle of Aggregation. If $A$'s slice is real and $B$'s slice is real, then the union of those slices is real. Once you grant ontological status to the *union*, you have reconstructed the four-dimensional manifold.

  ### 4. Why It Looks Like a Disguise (The Instability)
  You noted that the collection of local presents "looks structurally identical to the four-dimensional layout." This is because the **mathematical structure** is identical, but the **ontological interpretation** differs.

  *   **Eternalism:** The 4D manifold is a concrete object.
  *   **Fragmentalism:** The 4D manifold is a useful abstraction or a "map" of incompatible fragments, but it does not exist as a concrete whole.

  The position feels like a disguise because it requires rejecting the **God's Eye View**. To maintain this middle ground, one must argue that while *we* (as philosophers analyzing the theory) can see all the slices, *reality itself* does not contain a standpoint from which all slices are visible simultaneously.

  If you concede that there is *any* sense in which "all the slices exist" (even if indexed), critics argue you have already granted the existential parity that defines Eternalism. The "intermediate" position is therefore often considered **unstable**: it requires a rigorous denial that the sum of existing things is itself an existing thing.

  ### Summary of the Carving
  *   **What it is:** A view where existence is fundamental but relative to a frame of reference, and incompatible tensed facts are equally real without forming a consistent global whole (**Fragmentalism**).
  *   **What it is not:** It is not **Classical Presentism** (which demands a global now) and it is not **Eternalism** (which demands a global conjunction of all events).
  *   **The Edge:** The position collapses into Eternalism the moment you allow frame-relative facts to aggregate into a single, frame-independent ontology. To stay on the Presentist side of the line, one must assert that **reality is inherently perspectival** and that a "totality of events" is a category error.
