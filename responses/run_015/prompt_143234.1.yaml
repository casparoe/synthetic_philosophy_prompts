      *   *Is the "asymmetric burden" epistemic or pragmatic?* It's pragmatic (cost of error). In ethics, the cost of error is suffering. In SPR, it's falsehood. Sidgwick conflated them because falsehood in SPR (no afterlife) leads to suffering (no sanction for virtue).
      *   *Make sure to address the "gap" question.* Does SPR expose a gap? Yes, the gap between *what reason demands* (ethics) and *what nature provides* (facts).

  9.  **Final Polish:** Check against constraints (no bibliography, assume SPR knowledge). Ensure the argument flows logically. (The resulting output should match the detailed response provided previously.)
answer: |-
  The structural parallel you're drawing is compelling: in both ethics and psychical research, Sidgwick is trying to carve out a space for rationality that is immune to the distortions of individual bias. In *The Methods of Ethics*, the Impartial Spectator (or the "Point of View of the Universe") requires the agent to strip away personal desire and self-interest to see what is objectively right. In the Society for Psychical Research (SPR), Sidgwick requires the investigator to strip away materialist dogma and spiritualist wish-fulfillment to see what is objectively true.

  On the surface, this looks like the same epistemic virtue: a rigorous, dispassionate neutrality. However, when you press on the *asymmetric burden of proof* and the motivations behind his inquiry, the comparison begins to fracture. The Impartial Spectator is a tool for resolving normative conflict; his psychical research stance was a tool for resolving an existential crisis in his ethical system.

  Here is where the comparison holds, where it collapses, and how the asymmetric burden of proof fits into the wreckage.

  ### Where the Comparison Holds: Methodological Conservatism

  The strongest link between the Spectator and the SPR investigator is the demand for **universalizability**.

  For the Impartial Spectator, a moral judgment is only valid if it holds for any agent in similar circumstances. You cannot make an exception for yourself. This imposes a conservative burden on the agent: if you want to deviate from the common good or established moral rules, the burden of justification is on you.

  Sidgwick applies a nearly identical heuristic to psychical research. The "established moral rule" here is replaced by "established natural law." Just as the Spectator assumes the general welfare is the default unless overridden by stronger rational grounds, the SPR investigator assumes the continuity of natural law unless overridden by stronger empirical grounds.

  This validates your intuition about the **asymmetric burden of proof**. In Sidgwick's framework, rejecting a strange result (maintaining the status quo) carries less epistemic risk than accepting it (overturning the framework).
  *   **In Ethics:** If you follow the Spectator and are wrong, you at least maintain social cohesion. If you follow self-interest and are wrong, you create chaos.
  *   **In SPR:** If you reject a telepathy claim and are wrong, science waits. If you accept a fraud and are wrong, the scientific method collapses.

  In this sense, the Spectator's demand for consistency *does* justify his methodological caution. Both roles require a high threshold for "exceptions." The Spectator prevents moral exceptionalism; the SPR caution prevents scientific exceptionalism. Both are defenses against the corruption of the system by the individual ego (whether that ego wants to be morally special or spiritually validated).

  ### Where the Comparison Collapses: The Stakes of the Outcome

  The comparison falls apart when we ask *why* Sidgwick is maintaining this neutrality. The Impartial Spectator is a **constitutive** mechanism of ethics. You cannot step outside the Spectator and still be doing Sidgwickian ethics. The neutrality *is* the point.

  In psychical research, the neutrality is **instrumental**. Sidgwick wasn't investigating ghosts for the sake of ghosts; he was investigating them to solve the "Dualism of Practical Reason." He was terrified that without a belief in divine sanctions (an afterlife where virtue is rewarded and vice punished), Utilitarianism was rationally unstable. Why be moral if it makes you miserable, and death is the end?

  Here, the Impartial Spectator fails to justify his SPR caution because Sidgwick's investment in the *outcome* of the research compromised his impartiality.
  *   **The Spectator** doesn't care if the universe is friendly to morality. It just defines what morality *is*.
  *   **Sidgwick the Investigator** desperately *needed* the universe to be friendly to morality.

  This creates a hidden bias. While he publicly advocated for open-minded caution, privately he was hoping the evidence would pan out. This isn't the View from Nowhere; it's the View from Somewhere Very Anxious. If the Spectator demands we ignore personal stakes, Sidgwick's psychical research was fueled by a massive personal (and philosophical) stake. He wasn't just weighing evidence; he was weighing the viability of his life's work.

  ### The Asymmetric Burden and the Epistemic Gap

  Your suspicion about the asymmetric burden is astute, but it reveals a gap in his ethics rather than justifying his method.

  Sidgwick operates on the intuition that **false positives in SPR are worse than false negatives.** Accepting a fraud destroys the credibility of science (high cost); missing a genuine phenomenon delays knowledge (lower cost). This is standard scientific conservatism.

  However, in his ethical system, the asymmetry flips.
  *   **If Psychical Research fails (False Negative):** If there is no afterlife, the rational sanction for virtue vanishes. The cost is the collapse of moral rationality.
  *   **If Psychical Research succeeds (False Positive):** If we believe in an afterlife based on shaky evidence, we secure the sanctions for virtue. The cost is epistemic, but the gain is moral stability.

  Sidgwick never reconciles these two asymmetries. The SPR method demands he reject the claim unless evidence is overwhelming (to protect science). His ethical needs demand he accept the claim if evidence is plausible (to protect morality).

  The Impartial Spectator cannot bridge this gap because the Spectator is blind to consequences of *belief* and only sees the rightness of *action*. The Spectator would say, "Believe what the evidence warrants." But Sidgwick the man was asking, "What if the evidence warrants nihilism?"

  ### Conclusion: The Gap Exposed

  Psychical research exposes a fissure in Sidgwick's ethics that the Impartial Spectator cannot plaster over. The Spectator assumes that Reason and Nature are compatible, or at least that Reason can dictate duty regardless of Nature. But Sidgwick knew that for most humans, duty requires a "sanction" to be rational.

  His caution in the SPR was an attempt to keep his scientific integrity intact while hunting for the very thing that would save his ethical system. The "double-bind" you identified (gullibility vs. dogmatism) is indeed the same *methodological* stance as the Spectator's neutrality, but it is not the same *moral* stance.

  The Spectator demands we act rightly even if the universe is indifferent. Sidgwick's psychical research admits he couldn't bear that thought. So, while the Spectator justifies his *caution* (don't lie about data), it highlights his *desperation* (why are you looking for this data in the first place?). The asymmetry of proof in SPR was a shield for his science, but it couldn't protect his ethics from the possibility that the universe simply doesn't care about the Impartial Spectator's rules.
