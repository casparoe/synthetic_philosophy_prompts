epend only on the sampling postulate, my framing is wrong, or if the models degenerate into trivial cases that don't track the cosmological setting; and (5) an honest assessment of what is realistic to complete in one year versus what would have to be cut. Don't include a bibliography or literature review by citation — I'll fill those in myself.
