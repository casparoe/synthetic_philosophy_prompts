  *(Self-Correction on the "Harmony of the World" point)*: I need to be careful. *Harmonices Mundi* Book III is literally about astrology. The popular book's claim that astrology "dropped out" is factually incorrect. I must emphasise this.

  *(Self-Correction on "Testing")*: Kepler's "testing" wasn't modern statistical testing. It was more about finding physical mechanisms. If the mechanism (light/angles) made sense, the effect was real, even if predictions failed (due to other variables). I need to explain this distinction.

