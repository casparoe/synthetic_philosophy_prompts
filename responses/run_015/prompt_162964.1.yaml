answer: |-
  Here is a breakdown of that passage, separating the historical fact from the narrative polish, followed by answers to your specific suspicions.

  ### Line-by-Line Assessment

  **"Kepler was in most respects the first modern astronomer… but he had one embarrassing blind spot: he believed in astrology."**
  *   **Verdict:** Fair simplification, but historically presentist.
  *   **Detail:** Calling it an "embarrassing blind spot" is writing backwards from the twenty-first century. To Kepler, astronomy (the geometry of motion) and astrology (the physical effect of that motion) were two halves of a single discipline. He did not see a contradiction. A historian would prefer you say astrology was an "integral part of his worldview" rather than a blind spot. However, for a newsletter, "blind spot" is acceptable shorthand if you acknowledge it looks different to us than it did to him.

  **"He took money for casting horoscopes… and he thought the configurations of the planets actually brought about what happens down here…"**
  *   **Verdict:** Accurate.
  *   **Detail:** He did cast nativities for income (his Imperial salary was often in arrears). He believed in celestial influence on weather, human temperament, and general earthly events. He was more cautious about specific political events (the rise and fall of states), often warning patrons that free will and other factors interfered, but the core claim here is sound.

  **"What he wanted was to clean the subject up. He threw out the magical furniture… and tried to rebuild it as physics…"**
  *   **Verdict:** Fair simplification.
  *   **Detail:** In his work *On the More Certain Fundamentals of Astrology* (1601), he explicitly attacked the traditional "arabic points," houses, and dignities as lacking physical cause. He wanted to base influence on geometric aspects (angles) and light, which he considered physically real. He did not throw out *all* the furniture, but he certainly tried to renovate the house.

  **"…two planets at a given angle to each other produce a real effect on the earth, much as the moon's position produces the tides."**
  *   **Verdict:** Accurate.
  *   **Detail:** This is the crux of his "physical astrology." He argued that the Earth had a soul or faculty that perceived the angles between planets, reacting much like a living organism. The tide analogy is one he would have recognised.

  **"He was also, unusually for the period, willing to test it — he kept records, checked forecasts against what actually happened, and found the hits were no better than chance…"**
  *   **Verdict:** Misleading.
  *   **Detail:** He did keep records and was critical of sloppy predictions. However, he did *not* conclude the hits were no better than chance. He concluded that the *traditional rules* were wrong, not that the *influence* was absent. When predictions failed, he blamed the complexity of the variables or the inaccuracy of the data, not the non-existence of the cause.

  **"…which is why he kept telling astrologers to stop making specific predictions."**
  *   **Verdict:** Accurate.
  *   **Detail:** He consistently argued for general tendencies (weather, temperament) over specific events (you will marry a merchant on Tuesday).

  **"So he is the man who invented the empirical testing of astrology and then quietly disproved it himself…"**
  *   **Verdict:** Wrong.
  *   **Detail:** This is the narrative sticking point. He did not disprove it. He remained a believer in celestial influence until the end of his life. He refined the theory, he did not discard it.

  **"…and by the time he wrote the Harmony of the World in 1619 the astrology has more or less dropped out and it is pure science."**
  *   **Verdict:** Wrong.
  *   **Detail:** *Harmonices Mundi* (The Harmony of the World) contains five books. Book III is explicitly devoted to astrology. It is not "pure science" in the modern sense; it is the culmination of his attempt to unify music, geometry, astronomy, and astrology into a single harmonic system. The astrology did not drop out; it was baked into the harmony.

  ### Addressing Your Suspicions

  **1. The "Embarrassing Blind Spot" Framing**
  You are right to be wary. It implies Kepler should have known better. A fairer way to phrase this for your readers is to note that while we now separate the two, Kepler saw them as cause and effect. If you keep the phrase "embarrassing blind spot," qualify it by adding "to modern eyes." It saves you from sounding like you are judging him by anachronistic standards.

  **2. The Neat Ending (Tested, Flopped, Moved On)**
  Your instinct is correct: this is too neat. It turns Kepler into a modern sceptic trapped in a historical costume. The accurate version is messier: he tested the *traditional rules*, found them wanting, and replaced them with his *own* physical theory, which he continued to believe in. He did not quietly move on to "pure science"; he doubled down on a science that included astrology.

  ### The "Having It Both Ways" Charge

  Is it fair to say he took fees while building a version of astrology that no failed forecast could touch?

  It is fair to say he made the theory harder to falsify, but unfair to imply dishonesty. Kepler was remarkably candid with his patrons. He often included disclaimers that astrology indicated inclination, not necessity, and that weather or human will could override the stars. He viewed the failure of specific predictions as evidence that the "art" of astrology was imperfect, not that the "science" of influence was false.

  In a period where natural philosophy and income were intertwined, taking fees for a service you believed was real (even if difficult to calculate) was not considered hypocrisy. He did not build an unfalsifiable shield to protect a fraud; he built a physical theory to protect a belief he genuinely held, while warning clients that the calculations were prone to error.

  ### The Falsifiability Question

  If someone had asked Kepler what observation would make him abandon the whole thing, what would he have said?

  This is difficult because his astrology was tied to his theology and metaphysics. He believed the universe was created by a geometer God; therefore, geometric relationships (aspects) *must* have an effect. To abandon astrology, he would have had to abandon the idea that the physical universe was spiritually alive or that geometry was the language of creation.

  He likely would have said that if it could be proven that planetary light had no physical interaction with the Earth (like the moon and tides), or if the geometric harmonies were shown to be arbitrary rather than natural, he would have to reconsider. But because he saw the evidence of harmony everywhere (in music, in optics, in orbits), he did not believe such a disproof was possible. He was not looking for a way to prove it false; he was looking for the correct mechanism for why it was true.

  ### Conclusion: What Should You Print?

  The author's conclusion that Kepler "disproved it himself" does not survive contact with the primary sources. If you print that, you will be repeating a myth that historians of science have spent decades correcting.

  The accurate version is less flattering in the sense that it denies Kepler the status of a secret sceptic, but it is more interesting because it shows how a brilliant mind can construct a coherent, rational system that we now consider false.

  **Recommendation for your newsletter:**
  Keep the bit about him reforming astrology into physics (the tide analogy is excellent). Keep the bit about him warning against specific predictions. But cut the claim that he disproved it or that astrology vanished from his later work. Instead, frame it as Kepler attempting to save astrology from superstition by grounding it in physics—a project that failed, but which drove him to discover genuine physical laws in the process. That is a stronger story than the one in the book, because it is true.
