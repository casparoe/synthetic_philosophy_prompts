      *   *Check:* Is the conclusion decisive?
      *   *Fix:* Argue that coherence is a *practice*, not a state of being. Privacy is the studio where that practice happens.

  6.  **Final Polish:** (Reviewing against the prompt's specific questions.)
      *   *Actors identified?* Yes.
      *   *Choices described?* Yes.
      *   *Illumination explained?* Yes.
      *   *Distortions identified?* Yes.
