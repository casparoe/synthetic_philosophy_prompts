answer: |-
  This prediction requires separating Hobbes's moral definitions from his psychological mechanisms. His system rests on a specific architecture: human beings are matter in motion, driven by appetites and aversions, with reason serving as a calculator to satisfy those passions. The paramount passion is the fear of violent death. Justice is not a mystical quality but the keeping of valid covenants. A covenant is valid if entered into voluntarily, even if motivated by fear of a third party (like thirst), but it is void if there is reasonable suspicion that the other party will not perform. The Sovereign provides the power that removes this suspicion.

  Here is how Hobbes's machinery would likely grind through Parfit's hitchhiker, variant by variant.

  ### 1. The Sealed Desert

  In this scenario, the structural supports Hobbes usually relies on—the threat of exclusion from future society and the risk of detection—are removed. The question is whether the covenant itself survives the absence of enforcement.

  Hobbes would likely rule that the traveller's refusal to pay is an **injustice**, but he would struggle to call it **irrational** in the strict sense of his own psychology.

  First, on the validity of the promise: Hobbes distinguishes between covenants extorted by the fear of the promisee (which are void) and those extorted by fear of circumstances or third parties (which are binding). The traveller promises to escape thirst, not the motorist's sword. Therefore, the covenant is valid. Non-performance constitutes a violation of the third law of nature, which dictates that men perform their covenants made. By definition, this is injustice.

  However, Hobbes also argues that in the condition of mere nature, where there is no common power to compel performance, covenants of mutual trust are void upon reasonable suspicion. If the motorist performs first, he assumes the risk. Hobbes might argue that by performing first in a lawless desert, the motorist acted without reasonable assurance, effectively gifting the ride rather than contracting for it. If the covenant is voided by the conditions of the state of nature, the traveller commits no injustice.

  *Prediction:* Hobbes would likely insist the covenant remains binding *in conscience* (internally) even if unenforceable *in action* (externally). He would classify the refusal as injustice because the fear of thirst validates the promise just as much as the fear of a sword. However, he would have to admit that without the hazard of detection or future exclusion, the traveller violates the law of nature without suffering the usual penalty (destruction or war).

  *Contested Reading:* This turns on whether Hobbes believes the laws of nature bind a man to his own destruction. Hobbes explicitly states that no law of nature binds a man to act in a way that leads to his own ruin. If paying the money leaves the traveller destitute and vulnerable in the city, he is released from the obligation. If paying is merely inconvenient, the obligation holds. The prediction assumes the cost is merely financial, not existential.

  ### 2. The Legible Traveller

  Here, the motorist can read the traveller's disposition before acting. The rationality of the act depends on the antecedent state of the agent, not the calculation at the moment of payment. This challenges Hobbes's materialist psychology, where reason is a servant to the passions and the will is simply the last appetite in deliberation.

  Hobbes would argue that the traveller **must** possess the disposition to pay, but he would deny that the traveller can simply "choose" this disposition in the abstract. For Hobbes, passions are not chosen; they are cultivated.

  He would reach for his doctrine of education and the role of the Sovereign as the teacher of civil doctrine. A rational agent knows that to be the kind of person who breaks promises is to be cast out of confederacies. Even if this specific instance is sealed, the *general* disposition must be maintained because one cannot reliably predict which instances will be sealed and which will not. To cultivate a disposition that calculates exceptions is to weaken the habit of obedience required for self-preservation.

  Therefore, Hobbes would say the traveller should have been trained—by parents, tutors, or the sovereign—to feel a passion for honor and a horror of being a "fool" or a liar. This passion must be strong enough to outweigh the appetite for keeping the money. The traveller does not "install" the disposition at will; he inherits it from a well-ordered upbringing. If he lacks it, he is defective, not just calculating.

  *Prediction:* Hobbes would say the rational agent is the one who has been successfully conditioned to value the performance of covenants as a matter of glory and identity. He would reject the idea that one can adopt a disposition purely instrumentally in the moment. The disposition must be real, rooted in a passion for reputation or honor, even if no audience is present.

  *Contested Reading:* This relies on the interpretation of Hobbes's view on "glory." Some read Hobbes as thinking all glory is vain and destructive; others see "well-grounded glory" as essential for social cohesion. The prediction assumes the latter: that a rational agent cultivates a passion for keeping their word because it stabilizes their own psyche against the chaos of constant recalculation.

  ### 3. The Sword Arrives Late

  In this variant, the pair enters a commonwealth where the promise becomes enforceable by law. The awkwardness lies in the timing: the covenant was made when the sword was absent.

  Hobbes's moral here would be straightforward: **the courts must enforce it.**

  For Hobbes, the Sovereign's function is to secure the conditions under which covenants can be relied upon. While covenants made in the state of nature are often unenforceable, they are not necessarily void *ab initio* if they were validly entered (i.e., not coerced by the promisee). The arrival of the Sovereign transforms the status of the covenant from a binding conscience-obligation to a binding civil obligation.

  To rule otherwise would be to allow the state of nature to contaminate the commonwealth. If the courts declared that promises made before the Sovereign's protection were void, it would incentivize men to delay covenant-making until protection is guaranteed, which undermines the very transition from war to peace. The Sovereign validates the past to secure the future. The traveller cannot claim the covenant was void due to suspicion, because the motorist performed first, removing the ground for suspicion on the traveller's part.

  *Prediction:* Hobbes would view this as a confirmation of his theory, not a problem. The Sovereign remedies the defect of the state of nature by making good on the covenants that nature left precarious. The traveller is compelled to pay, and this compulsion justifies the existence of the commonwealth.

  ### General Conclusion

  Once the hazard of detection and the value of future cooperation are stipulated away, **very little of Hobbes's reply to the fool remains standing.**

  Hobbes's answer to the fool is fundamentally consequentialist. He argues that breaking covenants is irrational because it leads to a reputation that invites destruction. He does not argue that breaking a promise is intrinsically wrong in a way that defies self-interest. In the sealed desert, the consequence (destruction) is severed from the act (non-payment). Therefore, on Hobbes's own instrumental definition of reason, the fool wins. The traveller who does not pay preserves his money and suffers no penalty.

  To answer the case as posed, Hobbes would need a doctrine he does not possess: **the rationality of constitutive rules.** He would need to argue that being an agent who keeps promises is a precondition for having a coherent self over time, regardless of the outcome. He would need to separate "rationality" from "maximization of immediate appetite satisfaction."

  Currently, Hobbes defines reason as reckoning the best means to satisfy passions. In the hitchhiker case, the best means to satisfy the passion for wealth is non-payment. To condemn this, Hobbes would need to elevate the *law of nature* from a prudent maxim to a categorical command of reason that overrides immediate appetite even when prudence suggests otherwise. He hints at this when he says the laws of nature bind *in foro interno*, but he consistently pulls back when self-preservation is not at stake.

  *Contested Reading:* The final verdict rests on whether one reads Hobbes as a strict egoist or as a theorist of obligation who believes reason commands obedience to natural law even without immediate threat. If the former (the dominant reading), Hobbes has no answer to the hitchhiker. If the latter, he can argue that the traveller violates reason itself, not just his interest. My prediction leans toward the former: without the sword or the future, Hobbes's machinery cannot generate a reason to pay. He would likely advise the traveller to pay only to maintain a habit that might be useful in an uncertain future, but he could not condemn the man who calculates with perfect certainty that he will never be caught.
