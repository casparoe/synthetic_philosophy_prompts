      *   **Key Constraint:** Mark clearly where the prediction turns on a contested reading vs. settled text.

  2.  **Deconstruct Hobbes's Machinery (Mental Sandbox):**
      *   *Human Nature:* Driven by appetites/aversions (passions). Reason is a calculator (reckoning) for satisfying passions. Primary passion: Fear of death/desire for self-preservation.
      *   *State of Nature:* War of all against all. No justice/injustice, only force and fraud. Covenants without the sword are but words.
      *   *Covenants:* Mutual transfer of right. Performance creates justice. Non-performance is injustice.
      *   *The Fool:* Argues it's rational to break covenants when it serves interest. Hobbes replies: You can't reasonably expect to be believed next time (detection/future risk). Also, you invite destruction (power you cannot resist).
      *   *Laws of Nature:* Precepts of reason forbidding destructive acts. 3rd Law: *Men perform their covenants made.* 9th Law: *Against Pride.* 4th Law: *Gratitude.*
      *   *Validity of Covenants:* Covenants of mutual trust where one performs first are void if there is reasonable suspicion of non-performance. Covenants extorted by fear (of the promisee) are void. Covenants extorted by fear of third parties (e.g., paying ransom to pirates, or promising to pay rescuer to save from thirst) are *valid*.
      *   *Sovereign:* Creates the conditions for justice. Defines property, enforces contracts.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the gap. Hobbes cares about survival and order. Parfit cares about rational consistency. The Hitchhiker removes the "sword" and the "future." This hits Hobbes where he is weakest.

      *   **Variant 1: The Sealed Desert.**
          *   *Facts:* Promise made to save life (fear of thirst, not motorist). Motorist performs first. No enforcement, no future.
          *   *Hobbesian Analysis:*
              *   Is the covenant valid? Yes, fear of thirst (third party nature) validates the promise, unlike fear of the motorist.
              *   Is non-payment injustice? Hobbes defines injustice as breaking a valid covenant. So, technically, yes.
              *   *But:* Hobbes also says covenants of mutual trust are void if there is reasonable suspicion. If the traveller is known to be a fool, the motorist shouldn't have stopped. But if the motorist *did* stop, did he assume the risk?
              *   *Gratitude:* The 4th Law of Nature commands gratitude. But Laws of Nature bind *in foro interno* (in conscience) but not always *in foro externo* (in action) if it leads to destruction. Here, paying doesn't lead to destruction, just loss of money.
              *   *Prediction:* Hobbes would likely call it an *injustice* (violation of the 3rd Law) and a violation of *gratitude* (4th Law). However, without the sword, "injustice" is just a label for a self-destructive habit.
              *   *Contested Point:* Does the "reasonable suspicion" clause void the covenant *after* the motorist performs? Hobbes says if I perform first, I have no reason to suspect *you* (since you haven't acted yet). But if the structure implies you *won't* act, is it void? I need to take a stand. I'll predict he says it's binding because the fear was valid, but the *rationality* of paying is the hard part.
              *   *Refinement:* Hobbes insists covenants entered into out of fear (of circumstances) are binding. So the covenant holds. Non-performance is injustice. But is it *rational*? Hobbes ties rationality to long-term self-preservation. Here, long-term is severed.
              *   *Verdict:* It is Injustice, but the "Fool's" argument (no penalty) stands unless Hobbes leans on the internal binding of Natural Law.

      *   **Variant 2: The Legible Traveller.**
          *   *Facts:* Dispositions are readable. Motorist checks "source code."
          *   *Hobbesian Analysis:*
              *   Hobbes is a materialist. Passions drive us. Reason serves passions. Can reason change passions?
              *   Hobbes thinks education and the Sovereign shape opinions. We can be *trained* to fear dishonor more than poverty.
              *   Can one *choose* a disposition for utility? Hobbes might say you can cultivate a habit until it feels like a passion.
              *   *Prediction:* Hobbes would say the traveller *must* be the kind of person who pays. Not because he chooses it in the moment, but because he should have been educated to value his word as part of his honor/reputation, even if no one sees it.
              *   *Contested Point:* Hobbes's psychology. Is the will just the last appetite? If so, you can't "will" a new appetite easily. But he believes in the power of doctrine. I will predict he relies on the Sovereign's education to install the "paying" disposition as a matter of honor.

      *   **Variant 3: The Sword Arrives Late.**
          *   *Facts:* They reach a Commonwealth. Courts exist.
          *   *Hobbesian Analysis:*
              *   Hobbes says covenants made in the state of nature are binding *in foro interno* but not *in foro externo* until security is established.
              *   Once in the Commonwealth, does the Sovereign enforce past covenants?
              *   Hobbes wants stability. If courts void all prior covenants, trust is undermined. If they enforce them, it validates the Sovereign's power to secure rights.
              *   *Prediction:* The Sovereign enforces it. The covenant was valid (fear of thirst), just unenforceable. The Sovereign's arrival makes it enforceable.
              *   *Awkwardness:* Hobbes says covenants without the sword are "but words." But he also says they bind in conscience. The Court enforces the conscience-binding agreement to maintain the habit of obedience.

      *   **Conclusion: The General Question.**
          *   *What remains?* Without detection/future, the "Fool's" pragmatic argument wins against Hobbes's usual reply. Hobbes relies on *consequences* (exclusion from society). Parfit removes consequences.
          *   *What is missing?* Hobbes lacks a concept of *rule-following* as intrinsically rational regardless of outcome (Kantian duty or Parfit's self-constituency). He needs a doctrine of *integrity* or *identity* that isn't just about reputation. He needs to separate "rational" from "profitable" more sharply than he does.
          *   *Contested Reading:* I need to flag that Hobbes's definition of "Reason" is contested. Is it purely instrumental? If so, he loses. If it includes following Natural Law as a definition of rationality regardless of outcome, he survives. I will predict the instrumental reading is stronger, so he struggles.

  4.  **Refining the Voice:**
      *   Must be analytical, not imitative.
      *   Avoid "Hobbes writes in Chapter 15." Use "Hobbes holds," "His system requires."
      *   Ensure the distinction between *Injustice* (breaking covenant) and *Unreasonableness* (self-destruction) is clear.
      *   Check constraints: No citations. Mark contested readings.

  5.  **Self-Correction/Polishing during drafting:**
      *   *Check on Variant 1:* Did I address the "void upon suspicion" point? Hobbes says if I perform first, I cannot suspect the other because they haven't acted. But if the *nature* of the situation implies they won't (state of nature), is it void? Hobbes says covenants in the state of nature are valid but not performed until security. So the covenant exists. Non-performance is injustice.
      *   *Check on Variant 2:* Be careful not to make Hobbes sound like a Stoic. He doesn't believe in controlling passions directly, but redirecting them via glory/shame.
