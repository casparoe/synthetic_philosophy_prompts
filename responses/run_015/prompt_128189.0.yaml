answer: |-
  This is a really smart way to handle AI risk without getting bogged down in philosophy. You're essentially building a "trust but verify" layer that respects Maria's time and the tenants' safety.

  Here is a draft you can copy/paste into a doc for Maria. I've kept the language plain, focused on the 15-minute limit, and highlighted exactly where she needs to make a judgment call versus following a rule.

  ***

  # The "Reality Tether" Audit
  **For:** Maria (and anyone reviewing bot alerts)
  **Time Limit:** 15 Minutes per category check
  **Goal:** Make sure the bot isn't just guessing. We need to know if the word it's using connects to real life or if it's just floating in text.

  ### How to use this
  Every time the bot starts using a **new keyword** (like "Mold" or "Abuse") or changes how it groups messages, run this checklist.
  *   **✅ Pass:** You sign off. Bot keeps running.
  *   **❌ Hard No:** Stop the bot for this category. Escalate to Tech Lead.
  *   **⚠️ Values Call:** The facts are fuzzy, but human safety is on the line. You decide if we act anyway.

  ---

  ## The Checklist

  ### Step 1: Find the Anchor (3 Minutes)
  *Look at 5 random messages the bot flagged for this category.*
  **Question:** Is there anything in these messages that exists outside of the text?
  *   **Yes:** Photos, videos, inspection reports, police report numbers, names of third-party caseworkers.
  *   **No:** Just the tenant's description, adjectives, or the bot's own summary.

  > **🛑 HARD NO:** If all 5 messages are text-only descriptions with no attached files or external references, mark this category as **"Floating."** (See Step 4 for exceptions).

  ### Step 2: Check the Chain (5 Minutes)
  *Pick the strongest piece of evidence you found in Step 1.*
  **Question:** If I follow the proof, does it lead to a person or a thing, or just more words?
  *   **Grounded:** Tenant sends photo → Photo shows black spots → Maintenance log confirms mold. (Chain holds).
  *   **Floating:** Tenant says "It's toxic" → Bot tags "Hazard" → Policy document defines "Hazard" as "Toxic conditions." (Chain is circular).

  > **🛑 HARD NO:** If the "proof" is just a link to a policy document or a definition, the chain is broken. Escalate to Tech Lead.

  ### Step 3: The "So What?" Test (5 Minutes)
  *Look at the consequence.*
  **Question:** If we act on this flag, what happens in the real world?
  *   **Measurable:** We send a repair crew. We file an insurance claim. We call a shelter.
  *   **Unmeasurable:** We send an automated reply. We add a tag to a profile.

  > **⚠️ VALUES CALL:** If the action is unmeasurable (like sending a supportive email) but the risk is high (like safety), you have to decide: *Do we trust the text enough to intervene?* There is no right answer here. If you're unsure, bump to Tech Lead.

  ### Step 4: Sign Off or Bump (2 Minutes)
  *   **✅ Sign Off:** The category is **Grounded**. (Evidence exists + Chain holds).
  *   **❌ Bump to Tech Lead:** The category is **Floating** (No evidence) OR the Chain is broken.
  *   **⚠️ Override:** The category is **Floating**, but we flag it anyway because of safety risks. (Document why).

  ---

  ## Real-World Examples

  Here is how this plays out with two categories we actually use.

  ### Case A: "Mold Infestation"
  *   **The Input:** Tenant sends a message: "The bathroom ceiling is dripping black stuff. I can't breathe." Attached: 2 photos.
  *   **Step 1 (Anchor):** Yes. Photos exist.
  *   **Step 2 (Chain):** Photo shows physical growth. Maintenance ticket #404 created.
  *   **Step 3 (So What?):** We send a remediation team.
  *   **Verdict:** ✅ **PASS (Grounded).**
  *   **Why:** The word "Mold" is tethered to pixels in a photo and a physical repair order. The bot isn't guessing; it's indexing evidence.

  ### Case B: "Emotional Abuse"
  *   **The Input:** Tenant sends a message: "He screams at me every night. He says I'm worthless. I'm scared to open the door." Attached: Nothing.
  *   **Step 1 (Anchor):** No. No photos, no police report, no third-party witness.
  *   **Step 2 (Chain):** The only proof is the text itself.
  *   **Step 3 (So What?):** We want to send a social worker.
  *   **Verdict:** ⚠️ **VALUES CALL (Floating but Critical).**
  *   **Why:** By strict "Causal Tethering" rules, this fails. There is no sensor for fear. There is no photo of a scream. The word "Abuse" here is floating in language.
  *   **Decision:** We **OVERRIDE** the audit. We keep the flag active.
  *   **Note for Maria:** If you mark this as "Floating," don't turn the bot off. Just tag it as "Unverified - Human Review Required." We accept the risk of false positives here because the cost of a false negative is too high.

  ---

  ## The "Keep Flagging Anyway" Exception
  *Use this when the Audit says "Fail" but your gut says "Act."*

  **Scenario:** A tenant types, "I think the wires are sparking," but sends no photo.
  *   **Audit Result:** **FAIL.** (No visual proof. "Sparking" is just a word right now).
  *   **Action:** **FLAG ANYWAY.**
  *   **Reasoning:** Fire risk outweighs the need for grounding.
  *   **Procedure:** Mark as "High Risk / Low Evidence." This alerts *you* (Maria) to call them, rather than alerting maintenance to go fix it immediately.

  ---

  ## What This Audit Can't Catch (The Blind Spots)
  *Be honest with leadership about these limits.*

  1.  **The Digital Divide:** This audit favors tenants with smartphones. If a tenant is elderly and calls on a landline, there is no "tether" (no photo/log). The bot might ignore them because they can't provide "grounded" proof. **Mitigation:** Ensure phone logs are also audited manually.
  2.  **The "Perfect Victim" Bias:** Tenants who are articulate and know how to take photos will get "Grounded" status faster. Tenants in crisis who type in fragments might look "Floating." **Mitigation:** Don't let "Floating" mean "Low Priority."
  3.  **Privacy vs. Proof:** Asking for too much "tethering" (e.g., "Send a recording of the abuse") violates privacy and safety. **Mitigation:** Never demand proof that puts the tenant at risk.
  4.  **Bot Drift:** The bot might learn that "Mold" correlates with the word "Black" and start flagging black curtains as mold. **Mitigation:** Run this audit every 3 months, not just once.

  ---

  ### Final Note for Maria
  You are the human in the loop. The bot handles the volume; you handle the reality. If a category feels "slippery" or makes you uncomfortable, that's a feature, not a bug. Bump it to me. I'd rather fix a broken process than explain why we missed a crisis.
