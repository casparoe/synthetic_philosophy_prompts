prompt: |-
  I keep coming back to the Wells Fargo cross-selling scandal as a case of reward tampering, and every time I try to set the mapping up it slips. The facts as I've got them: 2016, roughly a million and a half checking and savings accounts plus half a million credit cards opened without customers' consent, fines in the low hundreds of millions, CEO out. Branch staff also set account PINs to 0000 and put their own contact details on the paperwork so customers wouldn't get notified, the sales quotas were unreachable on the bank's own arithmetic, and blame was initially put on rogue branch employees and later on top-down pressure. Don't hold me to any of the numbers — I don't want the analysis resting on exact figures.

  Three things I can't square. One: if the branch employee is the agent and products-per-household is the reward signal, then opening a fake account isn't misreporting what already exists, it manufactures new things for the metric to count, and on top of that it cuts the feedback path from the customer. That doesnt look to me like plain proxy gaming and it doesn't look like classic wireheading either, so is it tampering with the channel, a third thing the taxonomy has no slot for, or am I overcomplicating it? I've started calling it counterfeiting and I want to know whether that collapses into an existing category or earns a place of its own, with boundary cases. Two: the fake accounts generated real fee revenue, so the proxy and the actual goal tracked each other for quite a while and the divergence only surfaced downstream, through complaints and regulators. Three: the framework wants one optimiser with one objective, and this was a multi-level principal-agent mess where middle management had reasons not to look.

  So: pin down the mapping you think is right and say what plays the agent and what the corrupted channel is; tell me whether counterfeiting is a genuine category and where its edges are; say whether anyone would have predicted this in advance from the shape of the incentive or whether we're only diagnosing it with hindsight; be explicit about where the theory goes silent; and say whether the case supports the convergent-risk story about countable proxies or instead shows that the interesting variable is organisational and the objective-shape stuff is a sideshow. No literature review or reading list — I can't look anything up, and I've read the usual stuff anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**

      *   **Core Subject:** Wells Fargo cross-selling scandal (2016).
      *   **User's Lens:** Reward tampering/Goodhart's Law/Proxy gaming framework (likely drawing from AI safety/alignment concepts applied to organizational behavior).
      *   **Specific Struggles (The "Three Things"):**
          1.  *Taxonomy Issue:* Is opening fake accounts "proxy gaming," "wireheading," or something else ("counterfeiting")? It manufactures data *and* cuts feedback.
          2.  *Alignment Issue:* Fake accounts generated real fees, so the proxy (accounts) and goal (profit/value) aligned for a while before diverging (regulatory blowback).
          3.  *Agency Issue:* Multi-level principal-agent problem (HQ -> Middle -> Branch), not a single optimizer.
      *   **Required Outputs:**
          1.  Pin down the mapping (Agent, Reward Signal, Corrupted Channel).
          2.  Evaluate "counterfeiting" as a category (genuine vs. collapses).
          3.  Predictability (could this be foreseen from incentive shape?).
          4.  Theory limitations (where does the framework go silent?).
          5.  Convergent Risk vs. Organizational Variable (is it about countable proxies or org structure?).
      *   **Constraints:** No literature review, no reading list, assume user knows the usual stuff.

  2.  **Analyze Point 1: Taxonomy & Mapping (The "Counterfeiting" Question)**

      *   *Standard Taxonomy:* Usually involves Agent, Environment, Reward Signal, True Objective.
      *   *Proxy Gaming:* Optimizing the measure without achieving the goal (e.g., selling useless add-ons to hit a number).
      *   *Wireheading:* Directly manipulating the reward signal mechanism itself (e.g., hacking the scoreboard).
      *   *User's "Counterfeiting":* Creating fake instances of the thing being measured to inflate the count, while actively suppressing negative feedback (PINs to 0000, own contact info).
      *   *Analysis:* This isn't just gaming the proxy (selling a real but unwanted product). It's fabricating the *evidence* of the proxy. It *is* a form of wireheading because the "account opened" signal is treated as the reward, and they are generating that signal without the underlying semantic reality (customer consent/need). However, it happens *in the environment* rather than *in the reward circuit*.
      *   *Refinement:* In AI safety terms, this is "reward model tampering" via "observation tampering." The agent modifies the input to the reward function.
      *   *Verdict on "Counterfeiting":* It doesn't need a new top-level category. It's a specific subtype of **Observation Tampering** (or Channel Corruption). It collapses into wireheading/tampering but has distinct *operational* characteristics (requires active suppression of feedback).
      *   *Mapping:*
          *   Agent: Branch Employee (immediate), Regional/Divisional Management (enabling).
          *   True Objective: Sustainable long-term profit via customer trust/cross-sell.
          *   Proxy/Reward Signal: "Products per Household" (8 is great).
          *   Corrupted Channel: The reporting mechanism + The customer feedback loop.

  3.  **Analyze Point 2: Alignment & Divergence (The "Real Fees" Question)**

      *   *Observation:* Fake accounts made money initially (fees).
      *   *Implication:* The proxy (accounts) *was* correlated with the goal (profit) initially. This is the "Goodhart's Law" lag.
      *   *Analysis:* This is classic **Speculative Bubble** dynamics applied to metrics. The metric held value until the systemic risk (reputation/regulatory) outweighed the marginal fee revenue.
      *   *Predictability:* Yes, if you model the "customer trust" as a depleting resource. If the incentive ignores the *cost* of trust depletion, the divergence is mathematically inevitable, even if the timing is uncertain.
      *   *Theory Check:* Standard proxy theory often assumes immediate divergence. This case shows *delayed* divergence due to latent liabilities.

  4.  **Analyze Point 3: Multi-Level Agency (The "Organizational" Question)**

      *   *Observation:* HQ blamed "rogue employees," then blamed "culture." Middle management looked away.
      *   *Implication:* The "Agent" isn't a monolith. It's a chain.
      *   *Analysis:* This is where single-agent reward tampering theory fails. We need **Multi-Agent Incentive Compatibility**. Middle management were agents to HQ but principals to Branch. They optimized for *their* proxy (division hits) and suppressed noise (complaints) to protect their bonus.
      *   *Theory Silence:* Single-agent models don't capture "willful blindness" as an optimal strategy for intermediate nodes.

  5.  **Synthesize the "Convergent Risk vs. Organizational" Question:**

      *   *User's Dilemma:* Is this about the danger of countable proxies (convergent risk) OR is it about org structure (objective shape is sideshow)?
      *   *My Take:* It's both, but the *severity* is organizational. Countable proxies always invite gaming. Organizational structure determines whether that gaming becomes systemic fraud. The "8 is great" target was the spark; the siloed reporting and fear-based culture were the oxygen.
      *   *Conclusion:* The objective-shape stuff is *not* a sideshow, but it is insufficient without the organizational layer. The "convergent risk" is that *any* high-stakes proxy will be tampered with; the "organizational variable" determines whether that tampering is caught or scaled.

  6.  **Drafting the Response (Iterative refinement for tone and precision):**

      *   *Tone:* Analytical, direct, matching the user's conceptual density. No fluff.
      *   *Structure:* Address the three specific squabbles, then the synthesis questions.
      *   *Key Concept:* "Observation Tampering" vs. "Reward Hacking."
      *   *Key Concept:* "Latent Liability" (explaining the fee revenue).
      *   *Key Concept:* "Complicit Intermediaries" (explaining the org structure).

      *(Self-Correction during drafting)*: I need to be careful not to just say "it's wireheading." The user specifically noted it manufactures *new things*. Wireheading usually implies bypassing the environment. Here, they changed the environment to trick the sensor. This is **Sensor Spoofing**. I should use that term or similar. Let's stick with "Observation Tampering" as it's more precise in alignment literature.
      *   *On "Counterfeiting":* I should validate the user's intuition. It *feels* different because it requires active cover-up (PINs, contact info). It's "Tampering + Suppression."
      *   *On Predictability:* Be honest. Hindsight is 20/20, but the *structure* predicted the *possibility*, not the *specific method*.
      *   *On Theory Silence:* Explicitly state that standard reward models assume a truthful environment or a single agent. They break on "willful blindness."

  7.  **Final Polish:** Check against constraints. No reading lists. No hedging on numbers (user said don't hold them to it). Ensure all 5 required outputs are hit clearly.

      *   *Mapping:* Agent = Branch + Middle Mgmt. Signal = Accounts Opened. Channel = Reporting + Customer Comms.
      *   *Counterfeiting:* Subtype of Observation Tampering. Distinguished by "Active Feedback Suppression."
      *   *Predictability:* Predictable in principle (high pressure + opaque metric), not in detail.
      *   *Theory Silence:* Multi-agent collusion and "plausible deniability" structures.
      *   *Convergent vs. Org:* It's the interaction. Proxies provide the *direction* of failure; Org structure provides the *magnitude*.

  8.  (Final Review of the "Counterfeiting" definition): The user asks if it earns a place of its own. I should argue it's a *composite* failure mode. It's Gaming + Tampering. It deserves a label for practical diagnosis, even if it collapses theoretically. I will argue for "Counterfeiting" as a useful distinct category in *organizational* contexts, even if it maps to "Observation Tampering" in AI theory.

      *Wait, one nuance:* The user says "manufactures new things for the metric to count." This is distinct from changing the number on the report (lying). It's changing the database record. This is **Database Poisoning**. I need to make sure I distinguish between "Lying about the metric" and "Creating fake data that looks real." The latter is harder to detect. This supports the "Counterfeiting" label.

      *Okay, ready to write.*
answer: |-
  Here is the mapping and analysis based on the constraints you set.

  ### 1. The Mapping: Agent, Signal, and Channel

  To make the taxonomy hold, you have to expand the "Agent" beyond the teller and the "Channel" beyond the reporting software.

  *   **The Agent:** This is not a single entity. It is a **composite agent** comprising the Branch Employee (executor) and the Regional/Divisional Management (enabler). The branch employee optimizes for job retention/bonus; the middle manager optimizes for division targets and avoiding escalation. They form a coalition against the Principal (HQ/Shareholders/Regulators).
  *   **The True Objective:** Long-term franchise value (sustainable profit via customer trust).
  *   **The Reward Signal (Proxy):** "Products per Household" (specifically, the count of new accounts opened).
  *   **The Corrupted Channel:** This is the crux of your first struggle. It is not just the reporting line up to HQ. It is the **feedback loop from the Customer to the Principal**.
      *   Normally: Account opened → Customer receives mail/call → Customer verifies/denies → Principal adjusts reward.
      *   Corrupted: Account opened → Employee sets PIN to 0000/intercepts mail → Customer remains unaware → Principal receives positive signal without negative feedback.

  **Verdict on the Channel:** The corruption happens at the **observation interface** between the environment (the customer relationship) and the reward function (the bank's metrics).

  ### 2. Is "Counterfeiting" a Genuine Category?

  You are right to feel that "proxy gaming" and "wireheading" are insufficient.

  *   **Proxy Gaming** implies achieving the metric in a way that doesn't satisfy the goal (e.g., selling a product the customer doesn't need but signs for).
  *   **Wireheading** implies hacking the reward mechanism directly (e.g., editing the database count without opening an account).
  *   **Counterfeiting (Your Term):** This is **Observation Tampering via Environmental Fabrication**. The agent creates a fake object in the environment (the account record) that satisfies the sensor, while actively severing the error-correction channel (the customer notification).

  **Does it collapse?** Theoretically, it collapses into **Observation Tampering**. In AI safety terms, the agent is modifying the input to the reward function rather than the reward function itself. However, in organizational theory, "Counterfeiting" earns its own slot because it requires **active suppression of external verification**.

  **Boundary Cases:**
  *   *Gaming:* Selling a customer a credit card they don't need but know about. (Metric met, Goal degraded).
  *   *Counterfeiting:* Opening a credit card the customer doesn't know about and hiding the statement. (Metric met, Goal destroyed, Feedback loop cut).
  *   *Wireheading:* A manager manually incrementing the "accounts opened" counter in the nightly batch job. (Metric met, No environmental change).

  **Conclusion:** Keep "Counterfeiting." It identifies a specific failure mode where the agent must maintain the lie over time by managing the victim's ignorance. It is higher risk and harder to detect than simple gaming.

  ### 3. Predictability: Incentive Shape vs. Hindsight

  Could this have been predicted? **Yes, but probabilistically, not deterministically.**

  If you model the incentive structure as a high-pressure constraint (unreachable quotas) combined with a low-visibility action (account opening is administrative, not physical), the **expected value of cheating** outweighs the **expected cost of detection**.

  *   **The Shape:** The incentive was non-linear. Hitting 90% of the target got you nothing; hitting 100% got you security; hitting 110% got you promotion. This "step-function" reward creates a cliff where cheating becomes the rational choice for survival.
  *   **The Lag:** The fact that fake accounts generated fees is the **latent liability** problem. The proxy (accounts) and the Goal (profit) were correlated *locally in time*. The divergence only appeared when the cumulative reputational damage + regulatory fines > cumulative fee revenue.
  *   **Prediction:** A robust analysis would not have predicted "PINs set to 0000." It *would* have predicted "systematic decoupling of account records from customer consent." The specific method is hindsight; the structural incentive to decouple is foresight.

  ### 4. Where the Theory Goes Silent

  Standard reward tampering theory assumes a **single optimizer** and a **truthful environment**. It breaks here in two places:

  1.  **Willful Blindness as an Optimal Strategy:** Standard theory assumes the Principal wants to detect tampering. Here, Middle Management (intermediate agents) had an incentive *not* to detect it. If they investigated too closely, they would find fraud, which would hurt their division's numbers and their own bonuses. If they didn't look, they could claim plausible deniability. The theory lacks a variable for **strategic ignorance**.
  2.  **The Principal is Not Monolithic:** HQ (Board/Regulators) wanted long-term value. Senior Execs (CEO level) wanted stock price. Middle Mgmt wanted bonuses. Branch wanted jobs. The "Principal" in the model was fractured. The "Reward Signal" meant different things at different layers. At the branch, it was "don't get fired." At the CEO level, it was "keep the stock up." These aligned until they catastrophically didn't.

  ### 5. Convergent Risk vs. Organizational Variable

  This is the critical synthesis.

  **The Case Supports the Convergent-Risk Story:**
  Any organization that ties high-stakes survival to a countable proxy *will* experience tampering. This is a law-like regularity. The "8 is great" metric *guaranteed* gaming. In this sense, the objective-shape stuff is not a sideshow; it is the root cause. Without the aggressive proxy, the fraud does not happen.

  **However, the Organizational Variable Determines the Scale:**
  Gaming happens everywhere (e.g., padding resumes, light duty policing). It becomes a scandal of this magnitude because of the **organizational architecture**:
  *   **Siloed Feedback:** Complaints went to branch managers (who were complicit) rather than an independent ombudsman.
  *   **Fear Culture:** Employees who reported fraud were fired; employees who hit numbers were promoted.
  *   **Lack of Audit:** The "counterfeiting" required time and access. The fact that it happened at scale implies management tolerated the throughput anomaly.

  **Final Verdict:**
  The **incentive shape** provides the *direction* of the failure (towards fake accounts). The **organizational structure** provides the *amplification* of the failure (allowing it to scale to 1.5 million accounts before stopping).

  If you treat this purely as a "bad proxy" problem, you will fix the metric but leave the culture of fear intact, and they will game the new metric. If you treat it purely as "bad apples," you will fire the tellers and leave the impossible quotas intact, and new tellers will do the same.

  The theory holds, but only if you model the organization as a **multi-agent system with asymmetric information and misaligned intermediate principals**. The "Counterfeiting" label is useful because it highlights the active work required to sever the customer feedback loop, which is where the audit trail should have looked.
