prompt: |-
  I'm advising a small philosphy-of-physics group that can fund about three post-docs for two years. We're specifically interested in the Born-rule problem within Everettian quantum mechanics, but we're tired of the same old arguements. Which open questions or lines of work should we actually prioritise — not just what's unresolved, but what matters most if our goal is to figure out whether MWI can underpin quantum information theory without smuggling in classical probability? I'm particularly curious about the tension between decision-theoretic derivations in the style of Deutsch and Wallace and more recent attempts to ground branch weights in symmetry arguments or self-locating uncertainty. Rank them: which is upstream of the others, which is tractable for philosophers rather than physicists, and which would you deprioritise because solving it wouldn't change the practial interpretation of quantum randomness certification? Defend the ordering with explicit criteria — tractability, dependency, and whether the answer actually shifts anything outside pure metaphysics. No need for a reading list; just the agenda and why.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Client:** Small philosophy-of-physics group.
      *   **Resources:** Funding for 3 post-docs for 2 years (significant but limited).
      *   **Topic:** Born-rule problem within Everettian Quantum Mechanics (EQM/MWI).
      *   **Goal:** Determine if MWI can underpin Quantum Information Theory (QIT) *without* smuggling in classical probability.
      *   **Specific Interest:** Tension between Decision-Theoretic (Deutsch-Wallace) vs. Symmetry/Self-Locating Uncertainty approaches.
      *   **Task:** Rank open questions/lines of work.
      *   **Criteria for Ranking:** Tractability (for philosophers), Dependency (upstream/downstream), Impact (does it shift anything outside pure metaphysics, specifically QIT/randomness certification).
      *   **Constraint:** No reading list, just agenda and justification.

  2.  **Deconstruct the Core Problem:**
      *   The "Born Rule Problem" in EQM is essentially: How do you get probabilities (specifically $|\psi|^2$) out of a deterministic theory where everything happens?
      *   *Decision-Theoretic (DW):* Probabilities are rational betting quotients. If you act *as if* the Born rule is true, you maximize utility.
      *   *Self-Locating Uncertainty (SLU)/Symmetry:* Probabilities arise from ignorance about *which* branch you are on, constrained by symmetries of the wavefunction.
      *   *The QIT Connection:* QIT relies on randomness for cryptography (QRNG, QKD). If EQM is true, is that randomness "real" or just subjective uncertainty? If it's just subjective, does it compromise security proofs that assume objective stochasticity?

  3.  **Brainstorming Lines of Work:**
      *   *Axiomatization of DW:* Tightening the axioms (e.g., branching indifference).
      *   *The "Incoherence Problem":* Can uncertainty exist if all outcomes occur?
      *   *Typicality vs. Probability:* Is the Born rule about measure or frequency?
      *   *Algorithmic Randomness:* Connecting branch weights to Kolmogorov complexity.
      *   *Operational Equivalence:* Can an EQM agent distinguish their world from a Collapse world via QIT protocols?
      *   *The Role of Decoherence:* How robust is the branching structure needed for the derivations?
      *   *Self-Locating Uncertainty & Indexicals:* Formalizing the "I" in the multiverse.

  4.  **Selecting and Ranking based on Criteria:**
      *   *Criterion 1: Upstream/Dependency.* What needs to be solved first? (Metaphysics of identity/uncertainty).
      *   *Criterion 2: Tractability for Philosophers.* Avoid heavy math physics; focus on concepts, logic, and formal epistemology.
      *   *Criterion 3: Impact on QIT/Practice.* Does this change how we view randomness certification?

      *   *Candidate 1: The Metaphysics of Self-Location (SLU).*
          *   Upstream? Yes. If there's no uncertainty, DW doesn't get off the ground.
          *   Tractable? Yes, fits analytic metaphysics/epistemology.
          *   Impact? High. If uncertainty is illusory, QIT security might need rethinking (though operationally maybe not).
      *   *Candidate 2: Decision-Theoretic Axioms (DW).*
          *   Upstream? Depends on SLU.
          *   Tractable? Yes, logic/game theory.
          *   Impact? Medium. Justifies rational action, but doesn't prove objective chance.
      *   *Candidate 3: Operational Equivalence in QIT.*
          *   Upstream? Downstream. Needs the probability account first.
          *   Tractable? Harder, requires physics knowledge.
          *   Impact? Highest for the stated goal (QIT underpinning).
      *   *Candidate 4: Typicality/Measure.*
          *   Often seen as a dead end or purely mathematical. Deprioritize for *this* group's goal.

  5.  **Drafting the Ranking (Iterative Refinement):**

      *   *Priority 1 (The Foundation): Self-Locating Uncertainty & the "Incoherence Problem".*
          *   Why: You can't have decision theory without an agent who is uncertain. If the "I" splits deterministically, is there room for credence? This is the bottleneck.
          *   QIT Link: Randomness certification relies on the unpredictability of outcomes. If unpredictability is just indexical ignorance, does that hold for device-independent protocols?
          *   Tractability: High for philosophers (epistemology of indexicals).

      *   *Priority 2 (The Bridge): Decision Theory vs. Symmetry.*
          *   Why: Once uncertainty is granted, how do we get $|\psi|^2$ specifically? DW says rationality; Symmetry says structure.
          *   QIT Link: QIT assumes agents maximize success probabilities. If DW is right, QIT is normative. If Symmetry is right, QIT is descriptive of the multiverse structure.
          *   Tractability: High (formal epistemology).

      *   *Priority 3 (The Application): Operational Indistinguishability & Randomness Certification.*
          *   Why: This addresses the "smuggling classical probability" concern directly. Can EQM reproduce the *security proofs* of QKD?
          *   QIT Link: Direct.
          *   Tractability: Medium/Low (needs physics collaboration), but crucial for the "underpin QIT" goal.
          *   *Correction:* The prompt asks what matters most to figure out if MWI can underpin QIT. So this should be high. But it's downstream. Let's make it the *goal* that the first two support. Actually, for a philosophy group, the *conceptual analysis* of the security proofs is the tractable part.

      *   *Deprioritize:* Pure Measure Theory/Typicality without agents.
          *   Why: Doesn't solve the probability *meaning* problem. Doesn't help QIT.

  6.  **Refining the Argument for the "QIT without Classical Probability" Goal:**
      *   The core tension: QIT security proofs often assume an adversary bounded by quantum mechanics but often implicitly rely on objective chance for "private randomness." In EQM, randomness is subjective.
      *   If the post-docs work on *how subjective uncertainty maps to cryptographic security*, that hits the sweet spot.
      *   So, Priority 1 should be the nature of uncertainty (SLU). Priority 2 should be the derivation of weights (DW vs. Symmetry). Priority 3 should be the translation of those weights into information-theoretic security.

      *   *Wait, let's look at the "Upstream" criterion.*
      *   If SLU fails, DW fails. So SLU is most upstream.
      *   If DW/Symmetry fails, we don't have Born weights. So that's next.
      *   If we have weights, can we do QIT? That's the application.

      *   *Re-evaluating Tractability:*
      *   SLU is very philosophical.
      *   DW axioms are very philosophical.
      *   QIT security proofs are technical.
      *   *Strategy:* Frame the QIT work as *conceptual analysis of security definitions* rather than proving new theorems. This keeps it tractable for philosophers.

  7.  **Finalizing the Order:**
      1.  **The Metaphysics of Branching Identity (SLU).** (Upstream, Tractable, High Impact on "Randomness" definition).
      2.  **Normative vs. Structural Derivations (DW vs. Symmetry).** (Midstream, Tractable, Determines if QIT is rational or physical).
      3.  **Operational Equivalence in Cryptographic Protocols.** (Downstream, Less Tractable but Essential for Goal, Direct Impact).
      4.  **Deprioritize:** Measure-theoretic Typicality (Doesn't solve the probability problem).

  8.  **Drafting the Content:**
      *   *Introduction:* Acknowledge the constraint (2 years, 3 post-docs) and the specific goal (QIT underpinning).
      *   *Criterion Definition:* Explicitly state Tractability, Dependency, External Impact.
      *   *The Ranking:*
          *   #1: Self-Locating Uncertainty (The "Incoherence" bottleneck).
          *   #2: Axiomatic Stability of Weight Derivations (DW vs. Symmetry).
          *   #3: The Operational Meaning of "Private Randomness" in EQM.
          *   *Deprioritize:* Typicality/Frequency approaches.
      *   *Defense:* Tie each back to the criteria.
      *   *Synthesis:* How the 3 post-docs split the work.

  9.  **Review against Constraints:**
      *   No reading list? Check.
      *   Rank them? Check.
      *   Defend with criteria? Check.
      *   Focus on QIT/Randomness Certification? Check.
      *   Tone: Advisory, professional, critical.

  10. **Final Polish:** Ensure the distinction between "subjective uncertainty" and "objective chance" is clear in the context of QIT security (e.g., device-independent randomness expansion). If randomness is just self-location, does an adversary on another branch compromise security? This is the killer question. I need to make sure Priority 3 highlights this.

      *(Self-Correction during drafting)*: I need to be careful not to make Priority 3 sound like a physics project. It must be a *philosophy of information* project. Analyzing the *assumptions* of security proofs.

      *(Refining Priority 1)*: Emphasize that without solving SLU, the rest is moot. This is the "upstream" argument.
      *(Refining Priority 2)*: Emphasize that DW makes probability normative (rationality), while Symmetry makes it ontic (structure). This changes how QIT is interpreted.
      *(Refining Priority 3)*: This is the "cash value" for the client's goal.

