answer: |-
  This is an exceptionally sharp observation. You have connected a niche concept in decision theory (Updateless Decision Theory, or UDT) with a complex problem in bioethics (Psychiatric Advance Directives, often called "Ulysses Contracts").

  Your intuition is correct: there is a structural similarity here. Both involve a tension between what you would choose *now* (with specific information about your current state) and what you would have chosen *before* (as a general policy).

  Here is a breakdown of the views of personhood at play, how they map onto decision theory, and where the analogy holds or breaks.

  ### 1. What view of persons does this practice presuppose?

  To allow a past self to override a present self, the practice must reject the idea that a person is just a "momentary agent." Instead, it relies on one of two views:

  *   **The Narrative/Extended Self:** This view holds that "you" are not just the consciousness experiencing this second. You are a story that stretches across time. Your "Well Self" and your "Ill Self" are chapters of the same book. If the "Ill Self" tries to tear out the pages written by the "Well Self," it damages the integrity of the whole story. Authority belongs to the *author* of the life (the Well Self), not the *character* currently on stage (the Ill Self).
  *   **The Competence Hierarchy:** This is the standard medical view. It doesn't necessarily care about time; it cares about *capacity*. It posits that mental illness can temporarily disable the machinery of decision-making. On this view, the "Ill Self" isn't a valid agent making a choice; they are a patient experiencing a symptom. The "Well Self" is treated as the true guardian of the person's interests because they possess the cognitive tools to understand consequences.

  ### 2. Is this genuinely Updateless (UDT), or just Standard Updating?

  This is the crux of your question.

  **The Standard Updating View (The "Capacity" Argument)**
  Standard decision theory says: *Get new information → Update beliefs → Choose best action.*
  In psychiatry, the argument is: The "Ill Self" claims "I don't want meds." The clinician receives this information. However, the clinician also has prior information: *This patient has a history of psychosis where they believe meds are poison.*
  Therefore, the clinician updates their assessment of the *reliability* of the current choice. They don't ignore the new evidence (the refusal); they weigh it against the evidence that the decision-maker is currently impaired.
  *   **Verdict:** This does **not** require UDT. It fits standard reasoning if you treat "mental state" as a variable that affects the validity of the input.

  **The Updateless View (The "Policy" Argument)**
  UDT says: *Choose the policy that leads to the best outcome across all possible scenarios, and stick to it, even if you later feel like deviating.*
  The UDT argument for PADs is stronger. It suggests that even if the "Ill Self" feels lucid and sincere, they should be bound by the "Well Self's" policy. Why? Because the "Well Self" knew that the "Ill Self" would *feel* like refusing treatment, and the "Well Self" calculated that refusing treatment leads to ruin.
  If you allow the "Ill Self" to update and choose based on their current feelings, you guarantee a bad outcome (the "time inconsistency" problem). To win the game, you must commit to the policy *before* the episode starts.
  *   **Verdict:** This **does** require a UDT-style logic. It treats the "Ill Self's" refusal not as invalid data, but as a predicted move that must be blocked by the prior commitment.

  ### 3. Which parts strictly require the UDT story?

  The distinction becomes clear in "gray zone" cases.

  *   **Standard View License:** If the patient is screaming, incoherent, or clearly delusional, the Standard View works fine. We don't need UDT to override someone who cannot speak logically. We just say they lack capacity.
  *   **UDT Strict Requirement:** The UDT story is strictly required when the patient **appears competent** during the episode but is still overruled.
      *   *Example:* A patient with bipolar disorder writes a directive: "If I become manic and want to spend my life savings, restrain me." Later, they become manic. They are not hallucinating; they are just euphoric and convinced spending the money is a brilliant idea. They argue logically.
      *   If we honor their *current* choice, they go broke. If we honor the *past* policy, they stay solvent.
      *   To override them here, you cannot say "they are incompetent" (they seem fine). You must say, "Their current preferences are predictably misaligned with their long-term welfare, so the prior policy holds authority." That is a UDT-style pre-commitment.

  ### 4. What if we dropped that story? (Present Self Only)

  If we decided that *only* the present, best-informed self ever gets to decide (radical current autonomy), the practice would change drastically:

  1.  **PADs become non-binding:** They would be treated like a "letter of wishes." Clinicians would read them, but if the patient said "No" in the moment, treatment would stop.
  2.  **Higher threshold for intervention:** Doctors could only treat if the patient was an immediate physical danger to others (standard police power), not just to themselves.
  3.  **Cyclical Suffering:** Patients might cycle through: Get well → Regret stopping meds → Get sick → Stop meds → Get well → Regret...
  4.  **Loss of Trust:** The "Well Self" would know their instructions wouldn't be followed, so they might stop engaging with clinicians entirely, leading to worse long-term care.

  ### 5. Where my reasoning might break down (Meta-Cognition)

  You asked for intellectual honesty about where this analysis could fail. Here are the three weakest points in my reasoning:

  **A. The Legal Reality vs. The Philosophical Ideal**
  *   **Weakness:** I have been discussing the *justification* for PADs. However, in many jurisdictions (states/countries), the law actually **does** prioritize the current self. If a patient is currently competent, even with a mental illness, their current refusal often legally overrides a past Advance Directive.
  *   **What would change my mind:** If you showed me statutes where a currently competent patient's refusal is *always* absolute, regardless of a PAD, then the UDT analogy fails in practice. The practice is often *less* updateless than the theory suggests.

  **B. The Definition of "Updateless"**
  *   **Weakness:** In strict UDT (like in Newcomb's Problem), you don't update because your decision is *logically correlated* with the outcome. In psychiatry, we override the patient because their brain chemistry is *causally* altered.
  *   **What would change my mind:** If a neuroscientist demonstrated that the "Ill Self" is literally a different computational agent with different utility functions (not just a broken version of the old one), then this isn't "Updateless Decision Theory." It's "Guardianship of a Different Agent." UDT assumes it's the *same* agent binding itself. If the illness creates a *new* agent, the ethical framework shifts from autonomy to protection.

  **C. The Risk of Abuse**
  *   **Weakness:** I have framed this as a rational strategy for the patient's benefit. Historically, "knowing what's best for the patient better than they do" has been used to justify horrific human rights abuses in psychiatry.
  *   **What would change my mind:** If data showed that honoring PADs leads to worse long-term trust outcomes or higher suicide rates than honoring current refusals, then the "policy" is objectively bad. UDT is about optimizing outcomes; if the policy doesn't optimize outcomes, the UDT argument collapses.

  ### Summary
  You have identified a real philosophical tension.
  *   **Standard Medical Ethics** usually avoids UDT by claiming the "Ill Self" lacks the *capacity* to choose (Standard Updating with a reliability filter).
  *   **Deep Autonomy Theory** leans into UDT: The "Well Self" makes a binding commitment to prevent the "Ill Self" from making a predictable error.

  The practice *looks* like UDT, but it is often *justified* by claims of incapacity. It only becomes truly UDT when we enforce the directive even when the patient seems lucid, prioritizing the **policy** over the **preference**.

  ***

  **Does this distinction between "capacity" (Standard) and "commitment" (UDT) make sense to you? I can dig deeper into the specific decision-theory math if you want to see how the "expected utility" calculation changes between the two.**
