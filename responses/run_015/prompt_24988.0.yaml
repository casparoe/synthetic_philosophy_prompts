  **JOINT WORKING DOCUMENT: THE PHILOSOPHICAL STATUS OF PAIN ASYMBOLIA**

  **Date:** October 26, 2023
  **To:** The Philosophy of Mind Working Group
  **From:** Adversarial Collaboration Sub-Committee
  **Subject:** Mapping the Disagreement Space on Pain Asymbolia

  ### Introduction

  This document represents the outcome of our adversarial collaboration regarding the interpretation of pain asymbolia. Our goal is not to force a consensus where none exists, but to isolate the precise locus of our disagreement, distinguish substantive metaphysical disputes from verbal misunderstandings, and identify empirical or conceptual "cruxes" that could adjudicate the matter. The following sections outline our shared commitments, our precise points of divergence, and a research agenda designed to test those divergences.

  ---

  ### 1. Substantive Claims of Agreement

  Both the Separatist and Intrinsicalist factions endorse the following claims. These are not merely trivial observations but constrain the space of viable theories.

  1.  **The Clinical Profile:** There exists a neurological condition (pain asymbolia), typically associated with lesions to the insula, anterior cingulate cortex (ACC), or connections therein, wherein subjects respond to noxious stimuli with withdrawal reflexes and accurate sensory discrimination (location, modality, intensity) but display a marked absence of defensive behavior, distress, or preference for cessation.
  2.  **Sincerity of Report:** We agree to treat the asymbolic patient's first-person reports as *sincere*. We reject the hypothesis that patients are confabulating, lying, or suffering from a general anosognosia regarding their own mental states. When a patient says, "It hurts but it doesn't bother me," they are accurately reporting their phenomenal take on the situation, even if their metaphysical classification of that state is debatable.
  3.  **The Dissociation of Function:** The condition demonstrates a functional dissociation between the *discriminative* capacity to identify noxious input and the *motivational* tendency to prioritize the cessation of that input. Any theory of pain must account for how these two functional roles can come apart.
  4.  **Normative Default:** In neurotypical subjects, the sensory experience of pain and the motivational drive to avoid it are tightly coupled. A successful theory must explain not only how they come apart in asymbolia but why they are necessarily linked in standard cases.
  5.  **Methodological Constraint:** We agree that first-person authority regarding phenomenal character is *prima facie* authoritative but not *infallible*. A patient's claim that "this is the same sensation as before" is strong evidence, but it can be overridden if third-person data or conceptual analysis demonstrates that the underlying state has changed in a way that precludes the application of the concept "pain."

  ---

  ### 2. Table of Disagreements

  The following table isolates the core disputes. The "Neutral Formulation" describes the issue without presupposing a resolution. The "Side-Specific Formulations" allow each camp to state their position in their own preferred vocabulary.

  | Issue | Neutral Formulation | Separatist Position | Intrinsicalist Position |
  | :--- | :--- | :--- | :--- |
  | **Phenomenal Constitution** | What is the relationship between the sensory quality (e.g., burning) and the negative affect (unpleasantness) in the phenomenal character of pain? | **Additive/Modular:** The phenomenal character of pain consists of two distinct components: a neutral sensory qualia and an affective reaction. Asymbolia removes the affect while leaving the sensory qualia intact. | **Infused/Constitutive:** The phenomenal character of pain is unitary. The "burning" is inherently aversive; the unpleasantness is not a layer added to the sensation but a mode of the sensation itself. |
  | **Classification of the State** | Does the mental state tokened in the asymbolic patient fall under the natural kind or folk category *Pain*? | **Yes:** The state is pain, specifically *pain without suffering*. The essential property of pain is its sensory signature; unpleasantness is a contingent, albeit typical, consequence. | **No:** The state is *nociceptive sensation* or *pseudo-pain*. The essential property of pain is its unpleasantness; without it, the state belongs to a different category, akin to touch or pressure. |
  | **Explanatory Direction** | How do we explain the link between feeling pain and minding pain in standard cases? | **Causal/Imperative:** The sensory state generates an imperative command ("Stop this!"). In asymbolia, the command is severed from the sensory input, or the authority of the command is ignored. | **Identity/Realization:** Minding the pain is not caused by feeling it; minding it is part of what it *is* to feel it. Asymbolia is a deficit in the realization of the pain state itself. |
  | **Report Reliability** | How do we weigh the patient's claim that the sensation is "the same" as normal pain? | **High Weight:** The patient has direct access to the sensory qualia. If they say the burning feels the same, the sensory qualia are identical. The difference is purely in the conative response. | **Moderate Weight:** The patient lacks the contrast class necessary to judge similarity. Having lost the "hurt" dimension, they cannot accurately compare the current state to a past state that included "hurt." |

  ---

  ### 3. Cruxes: Sub-Questions for Adjudication

  We have identified three specific sub-questions. Settling these would not necessarily end the debate, but it would force at least one side to significantly revise their theoretical framework or concede ground.

  **Crux A: The "Neutral Qualia" Conceivability Test**
  *   **Question:** Is it conceptually coherent to conceive of a sensory experience with the discriminative profile of pain (burning, stabbing, throbbing) that is phenomenally neutral?
  *   **Stakes:** If Separatists can demonstrate that such a state is positively conceivable without contradiction, Intrinsicalists must retreat to an empirical claim (that such states don't *actually* occur) rather than a conceptual one. If Intrinsicalists can show the concept is incoherent (like "married bachelor"), Separatists lose their conceptual foothold.

  **Crux B: The Neural Signature of "Painhood"**
  *   **Question:** Is there a neural correlate specific to the *unpleasantness* of pain that is distinct from the correlate of *sensory discrimination*, and is the latter preserved in asymbolia?
  *   **Stakes:** If fMRI/MVPA shows that asymbolics process the sensory signature of pain identically to controls but lack activation in specific "affective" hubs (e.g., ACC), Separatists are vindicated. If the "sensory" signature itself is degraded or fundamentally altered in asymbolics (even in S1/S2), Intrinsicalists are vindicated.

  **Crux C: Instrumental Conditioning without Aversion**
  *   **Question:** Can an asymbolic patient learn to avoid a stimulus solely based on its sensory discriminability, absent any negative reinforcement (suffering) or external reward?
  *   **Stakes:** If asymbolics avoid the stimulus simply because they "know" it is damaging (purely cognitive/epistemic motivation), this supports the Separatist view that the sensory info is intact and actionable. If they fail to avoid it unless externally rewarded (e.g., money), this suggests the sensory state lacks the intrinsic motivational force required for pain, supporting the Intrinsicalist view that the state is not fully pain.

  ---

  ### 4. Proposed Tests and Predictions

  For each Crux, we propose a concrete line of inquiry. Both sides have recorded their predictions below.

  #### Test for Crux A: The Margin Case Argument
  *   **Method:** Conceptual analysis of pharmacological interventions. We compare asymbolia to the effects of opioids or cingulotomy.
  *   **Separatist Prediction:** Opioids reduce intensity (S) and unpleasantness (A) together. Cingulotomy/Asymbolia reduces only (A). This double dissociation proves S and A are distinct. We predict we can describe a case where S is high and A is zero without contradiction.
  *   **Intrinsicalist Prediction:** Opioids reduce Pain. Cingulotomy reduces Pain. The fact that both result in "no suffering" suggests they both attack the essential core of pain. We predict that upon rigorous phenomenological interrogation, the "S" remaining in asymbolia will be described differently than the "S" in normal pain (e.g., "distant," "muffled"), proving A inflects S.

  #### Test for Crux B: Multivariate Pattern Analysis (MVPA)
  *   **Method:** Train a machine learning decoder on fMRI data from neurotypical subjects to distinguish "Pain" from "Touch." Test this decoder on asymbolic patients during noxious stimulation.
  *   **Separatist Prediction:** The decoder will classify the asymbolic state as "Pain" based on somatosensory cortex (S1/S2) patterns, even if the ACC/Insula patterns differ. The sensory signature is identical.
  *   **Intrinsicalist Prediction:** The decoder will fail to classify the state as "Pain" with high confidence. The global neuronal workspace pattern for pain includes the affective integration. Without the affective integration, the neural signature is fundamentally that of "Nociception," not "Pain."

  #### Test for Crux C: The "Damage Avoidance" Protocol
  *   **Method:** Present asymbolic patients with two levers. Pressing Lever A delivers a noxious stimulus; Lever B delivers nothing. No external reward is given for pressing B. No pain is felt (by report).
  *   **Separatist Prediction:** Patients will eventually learn to press Lever B, not because the stimulus hurts, but because they possess an epistemic desire to avoid tissue damage. The sensory information is sufficient to drive avoidance.
  *   **Intrinsicalist Prediction:** Patients will show no preference for Lever B over Lever A (random distribution) unless an external reward (money/food) is attached to Lever B. Without the intrinsic badness of the stimulus, there is no motivational gradient to drive learning.

  ---

  ### 5. Flagged Verbal Disputes

  We acknowledge that a portion of our disagreement may be verbal. We agree to flag the following terms when they appear in future arguments to ensure we are not talking past one another.

  1.  **"Pain" (The Term):**
      *   *Separatist Usage:* Often refers to the *sensory event* caused by nociception.
      *   *Intrinsicalist Usage:* Refers to the *total conscious experience* which essentially includes suffering.
      *   *Resolution:* When arguing, specify **"Pain-S"** (Sensory component) vs. **"Pain-A"** (Affective component) vs. **"Pain-T"** (The total state). Agree that the dispute is whether Pain-T *requires* Pain-A.

  2.  **"Unpleasantness" vs. "Suffering":**
      *   *Separatist Usage:* Unpleasantness is a motivational tag or imperative force attached to a sensation.
      *   *Intrinsicalist Usage:* Unpleasantness is a phenomenal property, indistinguishable from the "hurt" of the sensation itself.
      *   *Resolution:* Distinguish between **Motivational Unpleasantness** (disposition to avoid) and **Phenomenal Unpleasantness** (what it feels like). Separatists argue asymbolics lack both; Intrinsicalists argue they lack Phenomenal Unpleasantness, and therefore lack Pain-T.

  3.  **"The Same Sensation":**
      *   *Separatist Usage:* Qualitatively identical in sensory dimensions (location, intensity, modality).
      *   *Intrinsicalist Usage:* Qualitatively identical *only if* affect is ignored. Since affect inflects quality, the sensation cannot be the same if the affect is gone.
      *   *Resolution:* Specify **"Same Discriminative Profile"** vs. **"Same Phenomenal Character."** Separatists claim the former is preserved; Intrinsicalists claim the latter is necessarily altered.

  ---

  ### Conclusion

  This document does not resolve the debate. However, it moves us from a state of mutual incomprehension to a state of precise disagreement. We agree that the asymbolic patient is sincere, that the functional dissociation is real, and that the crux of the matter lies in the metaphysical relationship between sensation and affect. By focusing our future efforts on the tests outlined in Section 4, we hope to generate data that bears directly on these cruxes rather than recycling established interpretations.

  **Signed,**

  *The Separatist Faction*
  *The Intrinsicalist Faction*
