  9.  **Final Polish:** Organize with clear headings. Add an introduction and conclusion to frame the collaboration. Ensure the "Cruxes" are actionable. (Self-correction: Make sure the "Tests" aren't just "do an fMRI" but specify *what* the fMRI would show to count as evidence).

