      *   *Epistemic Contextualism:* The truth conditions of "S knows that p" vary with the *context of the attributor* (the person saying "S knows"). High stakes for the attributor (or their conversational context) raise the standard for knowledge attribution, even if the subject's stakes are low.
      *   *Pragmatic Encroachment (Interest-Relative Invariantism - IRI):* The truth conditions of "S knows that p" depend on the *subject's* practical interests/stakes. If the subject has high stakes, they need more evidence to know. The standard is invariant across attributors but varies with the subject's situation.
      *   *Shared Core:* Knowledge is not just high credence (posterior probability); it requires meeting a threshold that is sensitive to practical factors (not purely evidential).
      *   *Divergence:* *Whose* practical factors set the threshold? Attributor (Contextualism) vs. Subject (Encroachment).

  3.  **Drafting the Translation (Statistical Vocabulary):**
      *   *Subject (S):* The agent holding the belief/parameter estimate.
      *   *Proposition (p):* A hypothesis $H$.
      *   *Evidence:* Data $D$.
      *   *Posterior:* $P(H|D)$.
      *   *Knowledge:* A decision rule $\delta(D)$ that outputs "Accept $H$" (or "Treat $H$ as true").
      *   *Threshold:* A critical value $c$ (e.g., $P(H|D) > c$ or Bayes Factor $> c$).
      *   *Loss Function:* $L(action, state)$. Determines the optimal threshold.
      *   *Contextualism:* The threshold $c$ is set by the *Attributor's* loss function $L_A$. $S$ knows iff $P(H|D) > c(L_A)$.
      *   *Pragmatic Encroachment:* The threshold $c$ is set by the *Subject's* loss function $L_S$. $S$ knows iff $P(H|D) > c(L_S)$.
      *   *Shared:* Knowledge $\neq$ Posterior $= 1$. Knowledge = Posterior crossing a decision threshold derived from a loss function.
