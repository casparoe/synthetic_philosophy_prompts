          *   *Statistical View:* This is a Principal-Agent problem + Calibration issue. The certificate is valid for the loss function it was issued under. It is *miscalibrated* for the downstream loss function.
          *   *Verdict:* Contextualism handles the linguistic shift well. Encroachment handles the action-guiding nature well. Stats sees it as a metadata/protocol mismatch.
