  **Seminar Handout Draft: Distinguishing Williams's Objections**

  **Protagonist:** Dr. Elena Aris, a GP in a public health system.

  **Case 1: The Sick Child (OTTM Yes, Integrity No)**
  Elena's child wakes up with a high fever on the night of a optional departmental dinner. A sophisticated consequentialist calculation suggests Elena should stay home: the distress prevented for her child and the anxiety spared for her partner outweigh the minor networking benefits of the dinner. Elena stays. However, if Elena's partner later discovered she stayed only because she had calculated that this maximized overall household utility, the partner would be rightly hurt; the relationship demands she stay *because* it is her child, not because the numbers favored it. Yet, Elena's integrity remains intact. Nothing in this verdict asks her to abandon her career, betray a professional commitment, or hollow out the projects that give her life meaning; caring for her child is consistent with, rather than destructive of, her identity as a parent and doctor.

  **Case 2: The Administrative Promotion (Integrity Yes, OTTM No)**
  Elena is offered a promotion to Regional Health Director. Data shows she can save more lives overall by managing resource allocation than by continuing her clinical practice. The consequentialist verdict is clear: she must take the job. Here, impartial reasoning is apt; no patient or colleague would be insulted by the fact that she justified this career move using population-health statistics, as the role itself requires impersonal stewardship. However, this verdict threatens her integrity. Clinical practice is Elena's "ground project"—the commitment that generates her actions and gives her life its point. Being forced to abandon the clinic to become a bureaucrat alienates her from her own agency, turning her into a neutral channel for utility rather than a doctor practicing medicine.

  ***

  **Analysis: Why the Cases Work**

  In **Case 1**, the **One Thought Too Many** verdict triggers because of the **normative expectation of the intimate recipient**. The partner/child is entitled to be loved partially, not calculated upon. If you remove this feature (e.g., Elena stays home to care for a stranger instead of her child), the complaint vanishes; impartial reasoning becomes appropriate. The **Integrity** verdict does not trigger because the **sacrifice is transient and compatible with identity**. Staying home is a normal demand of care, not an abandonment of a ground project. If you remove this feature (e.g., the verdict required her to quit medicine entirely to care for the child full-time), the Integrity objection would fire.

  In **Case 2**, the **Integrity** verdict triggers because of the **constitutive nature of the project**. The clinic work is not just a preference; it is the source of her agency. If you remove this feature (e.g., Elena views medicine as just a paycheck and loves administration), the Integrity objection vanishes; she suffers no alienation. The **One Thought Too Many** verdict does not trigger because of the **public nature of the justification**. The reasoning fits the context of systemic resource allocation. If you remove this feature (e.g., Elena justifies taking the job to her child by saying "you matter less than the population"), the OTTM objection would fire.

  **(a) Control Case (Both Complaints Fire)**
  Elena discovers her sister has made a minor medical error that harms no one but violates hospital protocol. The consequentialist verdict is to report her sister to maintain systemic trust. Here, both complaints fire: the sister is entitled to partial loyalty (OTTM), and being forced to betray a family bond attacks Elena's ground project of familial integrity (Integrity). To build this, I had to add a conflict between a special obligation (family) and a ground project (family loyalty), merging the intimacy of Case 1 with the identity-cost of Case 2.

  **(b) Best Consequentialist Replies**
  *   **To Case 1 (OTTM):** *Indirect Consequentialism.* The consequentialist should argue that the *practice* of partial love maximizes utility, so agents should not calculate in intimate moments. The "thought" is excluded not because it's wrong, but because having it leads to worse outcomes; the agent should cultivate a disposition where the calculation is unnecessary.
  *   **To Case 2 (Integrity):** *The Integration Reply.* The consequentialist argues that projects only have value insofar as they contribute to the good. If clinical practice is less valuable than administration, clinging to it is selfishness, not integrity. The "alienation" is merely the discomfort of correcting a mistaken attachment to a sub-optimal project.

  **(c) Honest Verdict: One Argument or Two?**
  They are **two distinct arguments that merely travel together**. The "One Thought Too Many" objection is about the *quality of human relationships* and the appropriateness of motivational structures in intimate contexts. The "Integrity" objection is about the *structure of agency* and the cost of alienation from one's ground projects. They often overlap (as in the Control Case) because our ground projects are often relationships. However, Case 2 proves Integrity can bite without OTTM (impersonal contexts), and Case 1 proves OTTM can bite without Integrity (transient sacrifices). Conflating them risks missing that consequentialism can fail by being too cold (OTTM) even when it doesn't destroy you, or too demanding (Integrity) even when the reasoning is appropriate.

  ***

  **TA Note:** Regarding your family situation: Your brother's error looks structurally like **Case 1**. He is applying impartial arithmetic to a context (family care) where the recipient (your mum) is entitled to partiality. The anger you feel is likely at the *thought* (the reduction of her worth to a calc), not just the outcome. Williams gives you the vocabulary to say: "Even if the conclusion is right, the reasoning is an insult." Hope the handout helps the students—and maybe helps you frame the conversation.
