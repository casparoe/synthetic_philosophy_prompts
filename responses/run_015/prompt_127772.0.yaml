answer: |-
  **Scenario:**
  Your team must choose a single strategy for a mandatory, one-time production database migration occurring during a fixed 4-hour external vendor maintenance window next Tuesday; you cannot split the traffic, hedge, or reschedule. **Option A** uses the Legacy Migration Script, which telemetry from fifty prior migrations of this exact data volume shows exceeds the 4-hour window in exactly 50% of cases (Event $E$). **Option B** uses a New Sharding Tool designed for this scale, but because it has never been run on this specific data topology under vendor-maintenance network constraints, no telemetry exists, testing is impossible without violating data sovereignty agreements, and senior engineers assign a best-guess probability of 50% while admitting the true rate could reasonably be anywhere between 20% and 80%. The payoff structure is strictly financial: a penalty is incurred based on the outcome of the migration timing.

  **Version 1 (Penalty on $E$):**
  You incur a \$100k compliance penalty if the migration exceeds 4 hours ($E$ happens). You pay \$0 if it finishes within 4 hours ($E$ does not happen).
  *   **Expected Utility (EU) Maximizer:** Assigns subjective probability $q=0.5$ to Option B (matching Option A's known $p=0.5$).
      *   $EU(A) = 0.5 \times U(-\$100k) + 0.5 \times U(\$0)$
      *   $EU(B) = 0.5 \times U(-\$100k) + 0.5 \times U(\$0)$
      *   **Verdict:** Indifferent. The utility function $U$ cancels out entirely because the probabilities are identical. They cannot strictly prefer A.
  *   **Ambiguity-Averse (MaxMin Expected Utility):** Evaluates Option B over the set of priors $q \in [0.2, 0.8]$.
      *   $V(A) = 0.5 \times U(-\$100k) + 0.5 \times U(\$0)$
      *   $V(B) = \min_{q \in [0.2, 0.8]} [q \times U(-\$100k) + (1-q) \times U(\$0)]$
      *   Since $U(-\$100k) < U(\$0)$, the minimum occurs at max probability of loss ($q=0.8$).
      *   $V(B) = 0.8 \times U(-\$100k) + 0.2 \times U(\$0)$
      *   **Verdict:** Strictly prefers A (0.5 risk vs 0.8 worst-case risk).
  *   **Ambiguity-Averse (Alpha-MaxMin, $\alpha=0.8$):** Averages worst and best case with weight on worst.
      *   $V(B) = 0.8(0.8 \times U(-\$100k) + 0.2 \times U(\$0)) + 0.2(0.2 \times U(-\$100k) + 0.8 \times U(\$0))$
      *   Effective probability of loss = $0.64 + 0.04 = 0.68$.
      *   **Verdict:** Strictly prefers A (0.5 risk vs 0.68 weighted risk).

  **Version 2 (Penalty on $\neg E$):**
  You incur a \$100k penalty if the migration finishes within 4 hours ($E$ does not happen). You pay \$0 if it exceeds 4 hours ($E$ happens).
  *   **Expected Utility (EU) Maximizer:**
      *   $EU(A) = 0.5 \times U(-\$100k) + 0.5 \times U(\$0)$
      *   $EU(B) = 0.5 \times U(-\$100k) + 0.5 \times U(\$0)$
      *   **Verdict:** Indifferent. Still cannot strictly prefer A.
  *   **Ambiguity-Averse (MaxMin Expected Utility):**
      *   $V(A) = 0.5 \times U(-\$100k) + 0.5 \times U(\$0)$
      *   $V(B) = \min_{q \in [0.2, 0.8]} [(1-q) \times U(-\$100k) + q \times U(\$0)]$
      *   Loss occurs on $\neg E$ (probability $1-q$). To minimize utility, maximize probability of loss ($1-q$). Max $1-q$ occurs at min $q=0.2$.
      *   $V(B) = 0.8 \times U(-\$100k) + 0.2 \times U(\$0)$
      *   **Verdict:** Strictly prefers A (0.5 risk vs 0.8 worst-case risk).
  *   **Ambiguity-Averse (Alpha-MaxMin, $\alpha=0.8$):**
      *   Effective probability of loss ($\neg E$) ranges $[0.2, 0.8]$.
      *   Weighted risk = $0.68$ (same calculation as Version 1, symmetric interval).
      *   **Verdict:** Strictly prefers A.

  **Sensitivity Analysis:**
  The single feature doing the work is the **irreducibility of the uncertainty to a single frequency**.
  (a) **Measurable:** If you could instrument Option B before deciding, the set of priors $[0.2, 0.8]$ would collapse to a single number (e.g., $0.5$). Ambiguity becomes risk. Both EU and AA agents converge to indifference; the preference for A vanishes.
  (b) **Repeated:** If you made this decision 200 times, the Law of Large Numbers ensures the ambiguous frequency converges to the true mean. The "unknown kind" of risk averages out. Both agents converge to indifference; the preference for A vanishes.

  **Steelman Objection:**
  "In software engineering, 'unknown probability' is never neutral; it is a proxy for 'unmeasured complexity.' Preferring Option A isn't philosophical ambiguity aversion; it's empirical prudence based on the heuristic that new tools hide tail risks (catastrophic failures) that telemetry hasn't caught yet. You're just cowardice-disguised-as-theory."

  **Reply:**
  "The case stipulates identical worst-case payoffs (\$100k cap). The aversion is not to the *magnitude* of the harm (which is bounded and equal) but to the *uncertainty of the likelihood*. Ambiguity aversion justifies paying a premium to convert an unknown probability into a known one, even when the disaster size is identical, because it robustifies the decision against model error."

  The preference survives because the decision is single-shot and the probability is fundamentally unmeasurable, making robustness to model error valuable independent of risk magnitude.
  \answer{PRINCIPLED} — ambiguity aversion really does give me a non-question-begging reason for the boring-option rule in the case as designed; \answer{BIAS} — in this case the rule is just risk aversion, prudence, or cowardice in disguise; or \answer{BROKEN} — the case can't be made to do the work, in which case say which requirement above is the one that breaks.
