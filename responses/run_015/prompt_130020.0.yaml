answer: |-
  # Decision Tree: The Architecture of Moral Worth

  **Node 1 (Root):** Does moral worth require that the normative reason for which the action is right also serve as the agent's operative motivating reason?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 3.

  ---

  ### Branch A: The Right Reason is Not Required

  **Node 2:** If the agent is not moved by the right reason, does the specific source of their motivation (e.g., natural sympathy vs. fear of punishment) still affect the action's worth?
  *   **No** (Only the outcome or conformity to duty matters) → **Leaf 1**.
  *   **Yes** (The quality of the motive matters, even if it isn't the "right" reason) → **Leaf 2**.

  ---

  ### Branch B: The Right Reason is Required

  **Node 3:** Must the agent be able to consciously think about or articulate this reason at the moment of action, or can it drive them through trained instinct and background processing?
  *   **Conscious Articulation Required** → Go to Node 4.
  *   **Instinct/Background Processing Allowed** → Go to Node 5.

  **Node 4 (Conscious):** If the agent thinks about the reason consciously, does the agent lose worth if they adopted that reason primarily because a trusted expert or institution told them to, rather than deriving it themselves?
  *   **No** (Worth is retained even with deference) → **Leaf 3**.
  *   **Yes** (Worth is lost without independent derivation) → **Leaf 4**.

  **Node 5 (Instinct/Background):** If the reason works through habit or instinct, does it matter if that processing relies on external tools or social systems to function, rather than just the agent's internal biology?
  *   **No** (Worth is retained even with external scaffolding) → **Leaf 5**.
  *   **Yes** (Worth is lost without internal biological ownership) → **Leaf 6**.

  ---

  ### Leaf Classifications

  **Leaf 1: Pure Outcome View**
  *   **Awkward Commitment:** Awkwardly implies a lucky accident has the same moral worth as a saint's deliberate care.

  **Leaf 2: Character-First View**
  *   **Awkward Commitment:** Awkwardly implies a naturally kind person has more worth than a reformed sinner struggling to do right.

  **Leaf 3: Deferential Intellectualism**
  *   **Awkward Commitment:** Awkwardly implies a student blindly following a guru has the same moral worth as the guru.

  **Leaf 4: Strict Autonomism**
  *   **Awkward Commitment:** Awkwardly implies moral experts who act effortlessly lose worth compared to novices who struggle.

  **Leaf 5: Extended Agency View**
  *   **Awkward Commitment:** Awkwardly implies a group or algorithm can share in the moral worth of an individual's action.

  **Leaf 6: Embodied Internalism**
  *   **Awkward Commitment:** Awkwardly implies using a cognitive aid to remember a duty diminishes the worth of fulfilling it.

  ---

  ### Structural Ambiguity Flag

  **Pair:** **Leaf 5 (Extended Agency View)** and **Leaf 6 (Embodied Internalism)**.

  **Reason for Ambiguity:** The branching logic at Node 5 attempts to separate views that accept subpersonal mediation but reject social outsourcing (Leaf 6) from those that accept both (Leaf 5). However, this distinction collapses when considering habits that are *socially inculcated* but *biologically realized*. If an agent's "internal" instinct was formed entirely by external social conditioning, it is unclear whether Node 5 classifies this as "internal biology" (Leaf 6) or "external social systems" (Leaf 5). Consequently, a view that values enculturated virtue but rejects technological prosthetics may not fit cleanly into either leaf, as the causal origin of the habit is both subpersonal and socially distributed.
