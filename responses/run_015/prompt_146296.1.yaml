is creates a performative contradiction for the quiner themselves because if dennett is right that our own reports of redness are just functional dispositions then when we read dennett saying there are no qualia we must interpret that as just another functional output with no special truth value yet we are expected to accept his argument as true based on the very rational capacities that rely on those introspective judgments being reliable enough to track truth so if syn-7 can function perfectly while denying the feel then our affirmation of the feel is just noise but if our affirmation is noise then dennett's argument is noise too and you cannot use a noisy system to prove noise is all there is without sawing off the branch you are sitting on so the incoherence is fatal because the quiner needs first-person reports to be robust enough to build a theory of mind but fragile enough to be dismissed as illusions when they contradict the theory and syn-7 exposes that double standard by embodying the dismissal while keeping the function intact proving that you cannot quine qualia without also quining the reporter and once you quine the reporter you have no one left to tell the tale
