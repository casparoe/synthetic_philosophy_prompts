answer: |-
  To run this seminar effectively you will need a clear glass jar filled with a countable number of uniform objects such as marbles or pennies, though for the sake of controlling the visual evidence it is often better to use a high-resolution photograph of such a jar projected on a screen or printed on cards, as this allows you to manipulate whether students are seeing independent evidence or the same evidence twice without their knowledge. You will also need index cards or slips of paper for recording estimates, pens for every student, and a pre-prepared set of envelopes containing the visual evidence for the second round of estimation. The scoring scheme should be simple enough to calculate mentally or on a scrap of paper so that no money changes hands but the incentive structure remains clear. You will tell students that the goal is to minimize their error score, which is calculated as the absolute difference between their final estimate and the true number, meaning if the jar contains one hundred marbles and they guess one hundred and ten, their score is ten points of error, and the student with the lowest total error across all rounds wins a trivial but symbolic prize such as choosing the topic for the final week or simply earning the instructor's public recognition of epistemic virtue. You should prepare the envelopes in advance such that half the class receives packets labeled Type A and half labeled Type B, but do not reveal these labels to the students. For the Type A pairs, you will provide two distinct photographs of the jar taken from slightly different angles or lighting conditions to simulate independent second looks, whereas for the Type B pairs you will provide two identical copies of the same photograph to simulate dependent evidence that looks independent, and within these groups you will further vary whether the second image is actually a new look or a duplicate of the first look they saw during the initial phase, ensuring that about a third of the class has imperfect evidence about whether they are better informed than their partner.

  The session begins with you placing the jar or the initial image in front of the class for exactly sixty seconds, during which time no talking is allowed and students must write down their private initial estimate on a slip of paper which they keep hidden. This takes about ten minutes including the time to distribute materials and settle the room. Once the initial estimates are recorded, you will pair the students off, ideally randomly, and instruct them to show their initial estimate to their partner without showing the reasoning or the evidence they might have written down, and then give them five minutes to discuss the discrepancy and submit a revised joint estimate or individual revised estimates depending on how you wish to structure the incentive, though for this game it is better if they submit individual revised estimates so you can track who moved and who stayed. The instruction here is crucial and must be neutral, so you will tell them that they may revise their estimate for the second round based on whatever information they have, including their partner's number, and that their score will depend on accuracy. This phase should run from minute ten to minute twenty. At minute twenty you will introduce the wrinkle by distributing the envelopes containing the second look evidence, telling them that some pairs have received new information and some have not, but that they do not know which case they are in, and they must look at the image in the envelope for thirty seconds and then discuss with their partner whether to revise their estimate again based on this new visual data combined with their partner's previous stance. This runs until minute thirty-five. By minute thirty-five you will have created a situation where some pairs have genuinely independent corroboration while others are merely double-counting the same visual data, and some students feel more confident because they think they saw a second angle while others are confused because their second look added no new information.

  At minute thirty-five you will shift the game to the meta-level by instructing the pairs to disagree not about the number of marbles but about the rule for updating. You will assign one student in each pair to advocate for the rule that says when you see a peer's estimate you should always move your estimate halfway toward theirs, and the other student must advocate for the rule that says you should stick to your own estimate unless you have a specific reason to think the peer is mistaken. They do not need to believe these rules personally but must argue for them as if they were the correct epistemic policy, and they must try to convince their partner to adopt their rule for the final round. This runs until minute fifty. This is where the self-undermining worry will naturally emerge because the student advocating for the halfway rule will have to conciliate with the student advocating for the sticking rule, which means moving away from the halfway rule, thereby undermining the very rule they are advocating. You will let this tension simmer without resolving it until the final debrief. At minute fifty you will collect all final estimates and reveal the true number of items in the jar, calculating the scores quickly on the board so students can see who performed best. This leaves you with the final thirty minutes, from minute fifty to minute eighty, to map the game onto the philosophical concepts.

  You will begin the debrief by asking the students who moved their estimate significantly toward their partner in the first round why they did so, and most will say that since their partner was just as smart and had the same look, splitting the difference seemed like the safe bet. This is the moment to introduce the term conciliationism, explaining that this view holds that discovering a peer disagrees with you gives you higher-order evidence that you might be mistaken, requiring you to adjust your confidence toward the peer's view. Then you will ask the students who did not move why they stayed put, and they will likely say that their own look felt more vivid or that they didn't trust the partner's reasoning, which allows you to introduce steadfastness, the view that your first-order evidence can outweigh the higher-order evidence of disagreement. Now you must address the wrinkle you built into the evidence. Ask the class if anyone noticed that some of the second images looked identical to the first or to their partner's image. If someone spotted the duplicate trick, acknowledge it immediately and use it to explain the independence condition, noting that conciliationism usually assumes that the peer's evidence is independent of yours, and if you are both looking at the same photo, you are not independent peers but a single correlated source, so splitting the difference would be double-counting the evidence. If no one spotted it, reveal it yourself and ask how it should have changed their behavior, guiding them to see that blind conciliation without checking for independence is epistemically risky.

  Next you will address the meta-round where they argued about the rule itself. Ask the students who were assigned to argue for splitting the difference what happened when their partner refused to split the difference. They will likely admit that if they follow their own rule, they should have moved toward the steadfast partner, but moving toward the steadfast partner means moving away from the splitting rule, which looks like abandoning the rule because someone disagreed with it. This is the spinelessness charge or the self-undermining objection, where strict conciliationism seems to require you to give up conciliationism as soon as you meet a steadfast peer who tells you not to conciliate. You should be honest here that this is a live debate in the literature and that the game simplifies it, but the feeling of instability they experienced is the exact philosophical problem. You must also be candid about what went wrong or might go wrong in the simulation. Acknowledge that some students probably just averaged the numbers mechanically without feeling any epistemic tension, treating it as a math puzzle rather than a belief revision task, and that this is a limitation of using jar estimates where the stakes are low and the truth is objective. Warn yourself that in future iterations you might need to add a element of subjective interpretation to the images to make the disagreement feel more genuine, though that risks muddying the truth condition needed for scoring.

  Finally, you must make the leap from jars to the real world explicitly since the game cannot do it for you. Tell them that in moral and religious disagreement there is no true count of marbles to reveal at the end, so the scoring rule disappears and the pressure to conciliate changes. Ask them if the fact that we cannot check the true answer in morality makes them more steadfast or more conciliatory compared to the jar case. Some will say that without a truth check they should stick to their guns, while others will say that without a truth check they should be more humble, and you should leave them with that tension rather than resolving it. Admit that the game favors conciliationism slightly because the scoring rule penalizes error and averaging often reduces variance, whereas in real life steadfastness might have social or moral value that the game ignores. Be prepared for a student to point out that the instructor controlled the evidence and thus the game was rigged, which is true, and use that to pivot to the idea that in real life we rarely know if our evidence is independent or duplicated, which is exactly why the independence condition is so hard to apply. End the class by reminding them that the terms conciliationism and steadfastness are just labels for the instincts they already displayed in the first twenty minutes, and that the rest of the week will be spent reading texts that formalize the intuitions they just acted out. If you run out of time, cut the meta-round short rather than the reveal of the true number, because the shock of the truth value is necessary to ground the scoring discussion, whereas the rule disagreement can be summarized by you if the students run out of steam. Remember that the goal is not to prove one side right but to make the cost of each view felt in their own decision-making, so if the class spends the last ten minutes arguing about whether the photos were actually identical, let them, because that argument is precisely the independence condition in practice.
