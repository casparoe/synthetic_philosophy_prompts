  ### The Principle of Foreseeable Protected Destruction

  **The Principle:**
  An atrocity constitutes genocide when a perpetrator, acting with **knowledge that their conduct will destroy the physical or cultural viability** of a collectivity, proceeds regardless of stated motive, *provided* the targeted collectivity is defined by **inherited or immutable identity** (national, ethnical, racial, or religious) rather than voluntary affiliation or behavior.

  **Analysis of Your Verdicts:**
  This principle resolves your tension by decoupling the *definition of the group* (which adheres to legal conventions) from the *standard of intent* (which adheres to moral epistemology).

  *   **Saved Verdicts:**
      *   **Case 1, 2, 5, 6:** These clearly meet both the protected group criterion and the intent/knowledge criterion.
      *   **Case 3 (Politicide):** This is **saved**. Even if the destruction is systematic and known, political opponents are defined by *behavior or affiliation* (voluntary/changeable), not inherited identity. Thus, they fall outside the principle's scope, aligning with your hesitation.
      *   **Case 4 (Corporate Poisoning):** This is **saved**. While explicit *dolus specialis* (specific intent) is absent, the "full awareness" of the tribe's elimination satisfies the "knowledge of viability destruction" clause. The tribe is an inherited identity group. This validates your moral intuition over the likely legal acquittal.

  *   **Sacrificed Verdicts:**
      *   **None of your specific verdicts require revision.** However, this principle sacrifices **strict legal positivism**. Current international criminal law (e.g., ICTR, ICTY jurisprudence) often demands a higher bar for specific intent than "knowledge of consequence." To maintain coherence across your six cases, you must accept that the moral label of "genocide" can apply where a court might legally acquit due to evidentiary standards on intent (specifically Case 4).

  **Application to Case 7 (Climate-Engineering):**
  *   **Group Status:** Nomadic peoples typically constitute a distinct ethnic or cultural group with inherited identity markers, satisfying the "Protected Group" criterion.
  *   **Intent/Knowledge:** Internal memos showing "full awareness" that the project destroys their habitat (and thus their viability as a nomadic people) satisfy the "knowledge" requirement, overriding the "global carbon mitigation" framing.
  *   **Viability:** For nomadic peoples, habitat is not merely property but the precondition of cultural and physical survival. Its destruction equates to group destruction.
  *   **Determination:** Under this principle, Case 7 is **Genocide**. The bureaucratic framing mirrors Case 4 and 5, and the foreseeability of group destruction overrides the stated benevolent goal.

  **Conclusion on Tension:**
  The tension between Case 3 and Case 4 is resolved by recognizing that *who* is destroyed matters as much as *how* they are destroyed. You can demand strict group boundaries (excluding political opponents in Case 3) while accepting flexible intent standards (including foreseeable destruction in Case 4). The performative risk in Case 6 does not negate the objective criteria; it merely highlights the stakes of applying the label.

  Verdict: A unified principle exists; its core claim is that genocide is the knowing destruction of the viability of a protected identity group, where knowledge of inevitable consequence substitutes for explicit declaratory intent.
