  I'm attempting to determine my own principled view of when an atrocity ought to be named genocide, weighing moral intuition against legal category. Here are my verdicts on specific cases, with one tension I cannot resolve. Case 1: The systematic destruction of European Jewry during the Second World War—this is genocide, unambiguously, in both law and morality. Case 2: A settler-colonial administration deliberately introduces famine and disease to eradicate an indigenous population—genocide, even absent industrial methods or explicit racial ideology, because the group-targeting and destructive intent are clear. Case 3: A government executes tens of thousands of political opponents drawn from every ethnicity—this is a mass atrocity and a crime against humanity, but I hesitate to call it genocide because the victims are not selected for membership in a protected group as such, in the sense Lemkin originally articulated. Case 4: A state-sanctioned corporation diverts and poisons a watershed knowing it will eliminate a specific tribe's physical and cultural survival, but internal documents frame the act as resource optimization with no explicit order to destroy the group—morally this feels like genocide to me, yet I suspect conventional legal doctrine might acquit it for lack of specific intent. Case 5: A regime deploys algorithmic risk-scoring to enforce compulsory sterilization and indefinite detention on members of one ethnic minority, labeling the program predictive public health—genocide, despite the bureaucratic framing, because the group is targeted and the effect is destructive. Case 6: In a civil conflict, both factions engage in ethnic cleansing; each side publicly accuses the other of genocide while denying its own actions. Here I think both should bear the label, but I notice that in practice the naming becomes a political weapon, which makes me wonder whether my other verdicts are also partly performative rather than purely descriptive. There is a tension between Case 3, where I require group-specific targeting, and Case 4, where I want to apply the label despite the absence of explicit targeting language. Is there a coherent principle—perhaps based on intent, foreseeable effect, group identity, or the performative function of naming—that accommodates all six? If not, which verdict must be revised? Apply your principle to one further case I have not listed: a state sponsors large-scale climate-engineering that disproportionately destroys the habitat of a nomadic people, with internal memos showing full awareness of the consequence but framing the project as global carbon mitigation with no mention of the affected group. State the principle precisely, indicate which of my verdicts it saves and which it sacrifices, and deliver your final conclusion in the form: Verdict: [state whether a unified principle exists and, if so, its core claim].
