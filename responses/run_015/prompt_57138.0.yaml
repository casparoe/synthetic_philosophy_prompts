  9.  *(Self-Correction during drafting)*: I need to be careful not to just say "Anscombe would say no." I need to explain *why* based on her text. Her argument is that the *description of the action* is "murder of innocents." If the action is described that way, "necessity" is irrelevant. I must emphasize the *description of the act*.

  10. *(Final check)*: Did I answer the prompt's request for "readings I have missed, including ones on which the slogan is not about alternatives at all"? I will add a section on "Normative Necessity" (It was the *only right thing*) and "Metaphysical Determinism" (Hard determinism) to cover the "not about alternatives" angle.

  11. *Final Polish of the "Anscombe's Charge" section:* Ensure I reiterate that for Anscombe, the morality lies in the *will* (intention), not the *outcome*.

