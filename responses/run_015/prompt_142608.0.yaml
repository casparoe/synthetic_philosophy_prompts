  4.  **Tenant Organizer Alienation**
      *Objection:* "Tenant organizers don't want veto power; they want protection from displacement. You're weaponizing them for a NIMBY agenda."
      *Reply:* Protection is passive; power is active. If renters have stake-weighted say, developers must negotiate with them before filing, not after eviction notices. It aligns developer incentives with tenant retention. It turns tenants from victims of process into partners in shaping growth. It stops forced filtering of neighborhoods into high-rent zones. They get a seat at the table, not just a severance package.
      *Soft Spot:* Many tenants just want cheap rent and might trade stability for lower costs immediately, rejecting your long-term view.

  5.  **Regional vs. Local**
      *Objection:* "Housing is a regional crisis. Why does a hyper-local stake override regional need? You're prioritizing one block over the metro."
      *Reply:* Because the costs of density are local while benefits are regional. If locals get nothing but congestion, they fight. Stake-weighting ensures locals capture some benefit (continuity) so they accept the burden. It balances the ledger so regional goals don't crush specific communities. It makes regional growth politically sustainable locally. You cannot ignore the metro wide needs, but you cannot ignore the block either.
      *Soft Spot:* It prioritizes the incumbent neighborhood over the homeless person outside it who needs housing now.

  6.  **Undermining By-Right**
      *Objection:* "The goal is by-right development. You're reintroducing discretion based on who shows up. That kills financing certainty."
      *Reply:* By-right works when zoning matches community capacity. When it doesn't, you get backlash. Stake-weighting acts as a feedback loop to adjust zoning to actual community tolerance. It makes by-right sustainable long-term by preventing the pendulum from swinging back to total freeze. It ensures the rules fit the people. Developers need certainty, but they need social license more.
      *Soft Spot:* It undermines the certainty developers need to finance construction, potentially raising costs per unit.

  7.  **Land Value Speculation**
      *Objection:* "This doesn't fix land value speculation. Absentee owners still profit from scarcity. You're ignoring the capital flow."
      *Reply:* It reduces the premium on 'unchangeable' neighborhoods. If change is managed rather than blocked, value stabilizes. It shifts value from speculative zoning bets to actual improvements. Small resident landlords benefit over REITs because their stake is higher than their portfolio size. It rewards living there, not just holding there. It changes who captures the land value gain.
      *Soft Spot:* It doesn't directly tax or capture land value gains for the public, leaving equity issues unresolved.

  8.  **Astroturf Gaming**
      *Objection:* "Astroturf groups will just game the stake system. They'll plant residents or fake credentials to block projects."
      *Reply:* Stake requires time. You can't fake a five-year commute or a kid's school history overnight. It raises the cost of astroturfing significantly compared to today, where busing in opponents costs nothing. It filters for genuine investment in the place. Time is the one resource money can't instantly buy. It makes manipulation expensive enough to deter most groups.
      *Soft Spot:* Determining what counts as 'stake' is politically contestable and vulnerable to lobbying itself.

  **Give-aways and hills**
  Concede immediately that the current veto is abused by wealthy homeowners to protect asset prices, and agree that we need more housing overall. Acknowledge that ownership is a terrible proxy for community membership. These concessions disarm the tech crowd's primary framing.
  Refuse to give up two points: First, that continuity of place is a public good worth protecting, not just an individual preference. Second, that newcomers should not have equal decision-making power over a neighborhood compared to those whose daily lives are staked there. If you lose these, you're just a softer NIMBY.

  **The one that has to land**
  The distinction between "veto" and "weighted voice." If they think you want to stop building, you lose. You must say: "I don't want to stop building; I want to stop erasing. A veto says 'no.' Stake-weighting says 'not like this, and not without us.' The goal is integration of new units into existing life, not replacement of existing life with units." This must land in under a minute to prevent the room from categorizing you as an obstructionist. If they hear "veto," you're dead.

  **The question I'm hoping nobody asks**
  "If stake is the currency, then the longest-staked, most continuous neighborhood gets to close the door entirely, which is just an exclusionary suburb in a costume." This is the fatal flaw. Your reply must be: "Then we set a cap. Stake gives you a voice, not a wall. But yes, without regional overrides, this model fails. I'm arguing for the local layer, not the whole system." Don't try to defend total local autonomy; admit it needs a regional backstop or you look like a segregationist.
