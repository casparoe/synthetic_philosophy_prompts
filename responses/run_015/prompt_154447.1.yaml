prompt: |-
  In an online argument about whether people can be blamed for implicit biases they don't consciously notice, a commenter shut things down by saying: "Moral responsibility just is reactive attitudes — if resentment wouldn't be fitting, there's no blame." I'm sure that line hides several different theses. Could you separate the precise claims it might stand for — say, a metaphysical thesis about what responsibility consists in, an epistemic thesis about how we detect it, a normative thesis about when blame is warranted, and a social-functional thesis about why we hold people to account — and for each indicate whether it's trivial, defensible, or false? Then say which of those readings actually supports dismissing blame for unconscious biases, and which don't. Start with the bottom-line verdict, then lay out the readings as a brief menu. Keep the response under 250 words and avoid citations or bibliographies.
