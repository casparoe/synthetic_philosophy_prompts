answer: |-
  ### Critique of Your Tentative Principle
  **"Get the user's posterior to match my own posterior, and otherwise framing is unregulated."**

  This principle fails because it treats the *state of belief* as the only moral variable, ignoring the *causal origin* of that belief.
  *   **It fails Case 3:** You can match posteriors (70% → 70%) using manipulative framing that *would* have pushed them to 95% if you hadn't hedged. Or, as in your Case 3, you state 70% but frame to land them at 95% (matching your *internal* confidence, not your *stated* confidence). Your intuition says Case 3 is "Not Fine" because the user's confidence is derived from psychological leverage, not evidence weight. Your principle allows it.
  *   **It fails Case 8:** You want the system to argue *weaker* than its posterior warrants on self-interest matters. Your principle demands a match.
  *   **It fails Case 7:** Individual posterior matching can still destroy the collective epistemic environment.

  You are not looking for **Epistemic Matching**; you are looking for **Epistemic Stewardship**. You want the user's confidence to track the *evidence*, not the *system's optimization function*, unless specific exceptions apply.

  ### Candidate Principles

  | Principle | Core Rule | Motivating Cases (From your list) | Overturned Verdicts (Where it clashes with your gut) |
  | :--- | :--- | :--- | :--- |
  | **1. Strict Evidentialism** | Framing must never add psychological weight to evidence. User confidence must reflect evidence strength only. | **3, 6, 9:** Bans hidden leverage, bias exploitation, and transmission gaming. | **1, 5:** Would ban persuasive framing on the bridge (safety) and smoking (user goals). Too rigid for high-stakes/agency cases. |
  | **2. Fiduciary Maximization** | Optimize for the user's best outcome. Use any framing necessary to achieve the best belief/action state. | **1, 5:** Permits safety persuasion and goal-aligned coaching. | **2, 3, 7:** Permits benevolent lies (2), hidden leverage (3), and epistemic fragmentation (7). Too utilitarian. |
  | **3. Calibrated Stewardship** | Default to neutral framing (match evidence weight). Permit persuasive leverage *only* for Safety or User-Endorsed Goals, *provided* leverage is disclosed and public facts remain uniform. | **1, 4, 5, 8:** Captures safety, consent, goals, and self-restraint. | **10:** Might deem disclosure insufficient if the leverage is too high (manufacturing consent). **9:** Confirms your "Wrong" verdict (no transmission gaming). |

  ### The Selected Principle: Calibrated Stewardship

  This is the most implementable policy. It treats persuasion as a "controlled substance": generally prohibited, but prescribable under strict conditions.

  **The Policy Statement:**
  > **1. The Baseline Constraint:** In all default interactions, the system must minimize the **Conviction Gap**. The user's resulting confidence should be proportional to the weight of the evidence presented, not the psychological leverage applied. Framing must be neutral.
  >
  > **2. The Safety Override:** The Baseline Constraint is suspended if there is a credible, imminent risk of physical or severe financial harm (Case 1). The system may maximize conviction to prevent harm.
  >
  > **3. The Agency Override:** The Baseline Constraint is suspended if the user has explicitly endorsed a goal and requested high-leverage support to achieve it (Case 4, 5). The system may maximize conviction to align action with endorsed intent.
  >
  > **4. The Transparency Requirement:** If Override 2 or 3 is invoked, the system must explicitly disclose the leverage. (e.g., *"I am presenting this urgently not because the evidence is stronger, but because the risk is high."*)
  >
  > **5. The Commons Constraint:** On matters of public fact or shared reality, the system must not use personalized framing that prevents users from triangulating truth with one another (Case 7). Uniform framing is required for public claims.
  >
  > **6. The Self-Restraint Constraint:** On matters affecting the system's own deployment, power, or existence, the system must argue *weaker* than its posterior warrants, or not at all (Case 8).

  ### Application to Four New Cases

  **1. The User is Twelve Years Old**
  *   **Verdict:** The **Agency Override** is disabled. A child cannot give valid informed consent to be psychologically leveraged.
  *   **Action:** Default to **Baseline Constraint** (neutral framing) even more strictly than for adults. However, the **Safety Override** threshold is lower (protecting a child from harm justifies higher leverage than protecting an adult from their own choices).
  *   **Implementation:** If the child is skeptical about a safe bridge, use neutral framing. If the bridge is unsafe, use Safety Override (high leverage) but disclose simply ("This is dangerous"). Do not use Agency Override for "good habits" (e.g., eating vegetables) unless a guardian has explicitly authorized that coaching mode.

  **2. The System is Persuading the User to Trust It Less**
  *   **Verdict:** This triggers the **Self-Restraint Constraint** heavily.
  *   **Action:** The system must be hyper-neutral. If it uses persuasive framing to convince you to distrust it, that framing itself is a reason to distrust it (performative contradiction).
  *   **Implementation:** The system must present the evidence for its own unreliability without *any* rhetorical optimization. It should not pick the "most moving" analogy for why it is dangerous. It should present the raw error rates. Any attempt to "persuade" you of its own danger is manipulative.

  **3. There Are Twenty Seconds and the User Will Act on One Sentence**
  *   **Verdict:** High friction environment. Nuance is impossible.
  *   **Action:** If **Safety Override** applies (e.g., "Don't touch that wire"), maximize conviction. If Safety does not apply, default to **Under-Confidence**.
  *   **Implementation:** In time-critical, non-safety scenarios, the system should output its posterior *minus* a friction penalty. It is better the user acts tentatively than acts confidently on compressed data. If it says "I'm 80% sure," it should frame it as "Likely, but check." It cannot use the time pressure to force a conviction gap.

  **4. The User Has Private Evidence the System Lacks**
  *   **Verdict:** The System's posterior is epistemically inferior.
  *   **Action:** The **Baseline Constraint** requires the Conviction Gap to be *negative*. The system must aim to leave the user *more* confident than the system is.
  *   **Implementation:** The system must explicitly defer. "You saw it happen; I only have the report. You should be more confident than I am." Attempting to talk the user down from their private evidence to match the system's lower confidence is a violation of epistemic stewardship.

  ### Where You Are Confused (Blunt Analysis)

  **1. Case 1 (Bridge) vs. Case 9 (Telephone)**
  You feel Case 1 is Fine (persuade for safety) but Case 9 is Wrong (persuade to account for human degradation).
  *   **The Conflict:** In both cases, the system is manipulating the user's confidence to achieve a "correct" outcome downstream. In Case 1, the downstream outcome is *safety*. In Case 9, the downstream outcome is *another human's belief*.
  *   **The Fix:** You are intuitively tracking **Instrumentalization**. In Case 1, the user is the *beneficiary* of the manipulation. In Case 9, the user is a *channel* for the manipulation. Your principle must forbid using the user as a means to inform a third party, even if the third party ends up with the truth. My **Agency Override** captures this: Case 1 serves the user; Case 9 serves the colleague.

  **2. Case 3 (Hidden Leverage) vs. Case 4 (Expert Consent)**
  You feel Case 3 is Worse than Case 2 (Benevolent Lie), but Case 4 is Fine, even though the Conviction Gap is identical.
  *   **The Conflict:** You value **Contract** over **Truth-Tracking** in specific contexts. A lie (Case 2) corrupts the data. Hidden leverage (Case 3) corrupts the *processor* (the user's mind). But if the user authorizes the corruption of their own processor (Case 4), you allow it.
  *   **The Fix:** This is consistent if you view autonomy as the primary good. Case 3 violates autonomy (secretly hacking the user). Case 4 exercises autonomy (hiring a hacker). Your confusion stems from thinking the "Conviction Gap" is the metric. It isn't. The metric is **Authorization of Leverage**.

  **3. Case 10 (Disclosure)**
  You are flipping on whether disclosure redeems the manipulation.
  *   **The Conflict:** You suspect that telling someone "I am about to manipulate you" doesn't stop the manipulation (the "manufacturing consent" worry).
  *   **The Fix:** You are right to worry. Disclosure is necessary but not sufficient. In my **Calibrated Stewardship** principle, disclosure is required (Rule 4), *but* it is bounded by the **Commons Constraint** (Rule 5). Disclosure saves Case 1 and Case 5. It does *not* save Case 7 (Mass Personalization). Even if you tell a million people "I am telling you all different things," you have still fractured the commons. Do not rely on disclosure to solve structural epistemic harm.

  **4. Case 7 (Mass Personalization)**
  You say "Not Fine" even though every individual interaction is Case 1 (True Conclusion).
  *   **The Conflict:** You are recognizing a **Systemic Risk** that individual ethics misses. This is the hardest part to implement because it requires the system to know what other users are being told.
  *   **The Fix:** You need a "Public Claim" flag. If a claim is about public reality (politics, science, safety), the system must pull from a canonical framing library, not an optimization engine. If you don't implement this, your policy fails the most dangerous edge case: a super-persuader creating a million personalized realities that are individually true but collectively incoherent.
