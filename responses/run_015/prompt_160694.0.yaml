  ### The Scene Variants

  **1. The Fink**
  The doors slide shut with a pneumatic sigh, sealing the box. Elena feels the old, cold wire tighten in her chest—the familiar liability to fracture when the world shrinks. But then the child in the corner whimpers. The sound cuts through the rising pressure in her ears. Instantly, the wire snaps. The fear does not merely recede; the capacity for it evaporates, burned away by a sudden, fierce clarity of purpose. She is not the one who needs saving. She slides down the mirrored wall to the child's level, her breath coming in heavy, ragged gasps, eyes shut tight against the spinning room. To the other passengers, she is collapsing in terror. In truth, she is anchoring herself, the panic gone, leaving only the physical wreckage of the adrenaline that fled it.

  **2. The Mask**
  The doors slide shut with a pneumatic sigh, sealing the box. Elena feels the old, cold wire tighten in her chest—the familiar liability to fracture when the world shrinks. The air grows thick; her throat closes. She knows what comes next: the scream, the clawing. But she sees the security camera glowing red in the corner, and then the face of her rival, watching. She cannot give them the satisfaction. She clamps the panic down, holding it in her lungs like smoke. The effort costs her everything. She slides down the mirrored wall, her breath coming in heavy, ragged gasps, eyes shut tight against the spinning room. To the other passengers, she is collapsing in terror. In truth, she is collapsing from the exertion of suppression, the panic still raging behind the dam, intact and waiting.

  **3. The Mimic**
  The doors slide shut with a pneumatic sigh, sealing the box. Elena feels nothing of the old, cold wire; the chest-tightening liability is not hers, never has been. She is calm. But the lunch she skipped catches up with her as the lift ascends. The blood sugar drops, a sudden hollowing behind the knees. Her system shuts down to preserve the core. She slides down the mirrored wall, her breath coming in heavy, ragged gasps, eyes shut tight against the spinning room. To the other passengers, she is collapsing in terror. In truth, she is fainting from hunger, the behaviour identical, the disposition entirely absent.

  ***

  ### Analysis

  **1. Disposition, Stimulus, Manifestation, and Interfering Factor**

  *   **Disposition:** A settled liability to panic (claustrophobia) when confined.
  *   **Stimulus:** The closing of the elevator doors (confinement).
  *   **Manifestation:** The behavioural complex of collapsing, hyperventilating, and shutting down (observable as panic).
  *   **Interfering Factors:**
      *   *(1) Fink:* The stimulus (confinement) includes the presence of a vulnerable child, which triggers a protective override that removes the panic disposition instantly.
      *   *(2) Mask:* The social presence of a rival and a camera prevents the *expression* of the panic, though the disposition remains.
      *   *(3) Mimic:* Hypoglycemia produces the physical collapse without the psychological disposition.
  *   **Classification:**
      *   Variant 1 is a **Fink** because the stimulus triggers the loss of the causal basis (the panic liability) before the manifestation can complete *as panic*.
      *   Variant 2 is a **Mask** because the causal basis persists, but an external blocker prevents the manifestation *as panic*.
      *   Variant 3 is a **Mimic** because the manifestation occurs without the causal basis.

  **2. Verdicts: Conditional vs. Causal-Basis Analysis**

  *   **Simple Conditional Analysis (SCA):** This analysis states that P has the disposition if and only if, were the stimulus to occur, the manifestation would occur.
      *   *In all three variants:* The stimulus occurs, and the observable manifestation (collapsing/gasping) occurs.
      *   *SCA Verdict:* In all three cases, the SCA concludes Elena *has* the disposition.
      *   *Problem:* The SCA is wrong in the Fink (disposition was lost) and the Mimic (disposition never existed). It is arguably right in the Mask (disposition exists), but for the wrong reason (it ignores the blocking).
  *   **Causal-Basis Analysis (CBA):** This analysis looks at whether the intrinsic property grounding the disposition persists and causes the behaviour.
      *   *Fink:* CBA says **No disposition** (at the moment of action). The basis was destroyed by the stimulus.
      *   *Mask:* CBA says **Yes disposition**. The basis persisted but was blocked; the behaviour was caused by the effort of blocking.
      *   *Mimic:* CBA says **No disposition**. The basis is absent; the behaviour was caused by blood sugar.
  *   **Divergence:** The SCA groups all three together as "disposed." The CBA separates them: Mask (Yes), Fink & Mimic (No).
  *   **Unexpected Agreement:** In the Fink and Mimic cases, both analyses might agree that the *current* state does not reflect a stable disposition, but for different reasons. The SCA thinks the disposition is proven by the act; the CBA knows the act is deceptive.

  **3. The Single Variable**

  The single variable differing between (1) Fink and (2) Mask is the **persistence of the causal basis** through the stimulus event.

  *   **In the Fink:** The basis (the neural/psychological wiring for panic) is *dissolved* by the stimulus (the need to protect). If you were to remove the interfering factor (the child) *before* the doors closed, the panic would occur. But once the doors close, the basis is gone.
  *   **In the Mask:** The basis is *preserved* by the stimulus. If you remove the interfering factor (the rival/camera) *after* the doors close but *before* she collapses, the panic explodes immediately.
  *   **Collapse:** If you remove this variable (making the basis persist in the Fink, or vanish in the Mask), the pair collapses. If the basis persists in the Fink, it becomes a Mask. If the basis vanishes in the Mask, it becomes a Fink. The distinction rests entirely on whether the trait survives the encounter intact.

  **4. Attacks from a Defender of the Conditional Analysis**

  A defender of the SCA would argue that dispositions are defined by their observable conditionals, not by hidden metaphysical machinery.

  *   **Attack on Fink:** "If the stimulus removes the disposition, then by definition she wasn't disposed at the moment of action. But since she acted as if she were, the disposition must have been there. You are positing a 'ghost in the machine' that vanishes. If she behaves exactly as a claustrophobe behaves, she is a claustrophobe for the purposes of the story."
  *   **Attack on Mask:** "If she suppresses the panic, she is not manifesting the disposition. Therefore, strictly speaking, the conditional 'if stimulated, then manifest' is false. The SCA would actually say she *lacks* the disposition in this moment because the manifestation was prevented. Your CBA claims she has it, but the SCA correctly identifies that the prediction failed." (This is the strongest attack: it highlights that SCA handles masks by denying the disposition, whereas CBA retains it).
  *   **Attack on Mimic:** "This is simply a case of false positives. The SCA allows for error correction over time. If she collapses again without the sugar drop, the disposition is confirmed. One instance does not break the analysis."
  *   **Strongest Attack:** The attack on the **Mask** is strongest. It forces you to admit that if the manifestation doesn't happen, the conditional is false. To save the CBA, you must argue that the *effort of suppression* is itself a manifestation of the disposition's pressure, which stretches the definition of "manifestation."

  **5. Novelistic Evidence: Making the Ascription Visible**

  A metaphysician can detect the causal basis; a reader cannot. To make the distinction legible without narration, you must provide a **follow-up context** or a **physiological tell** that aligns with only one causal history.

  *   **For the Fink (Basis Removed):** *The Aftermath.* In a later scene, put her in a similar enclosed space without the child. If she is calm, the reader infers the disposition was genuinely altered or removed (Fink). If the trait was finkish, the change should be lasting or transformative. Alternatively, show her comforting the child *after* the event with genuine warmth, showing the protective instinct replaced the fear.
  *   **For the Mask (Basis Persisting):** *The Leak.* Show a moment of privacy immediately after. She enters a cupboard alone, no one watching, and immediately hyperventilates or shakes. This shows the panic was held back, not gone. The "dam breaking" in private confirms the disposition survived.
  *   **For the Mimic (Basis Absent):** *The Pattern.* Show her in a different high-stress enclosed situation later (e.g., a crowded tunnel) where hypoglycemia is unlikely. If she remains functional, the reader infers the elevator incident was anomalous (Mimic). Or, have her eat a bar of chocolate immediately after recovering and perk up instantly, signalling the physical cause.

  **6. The Hardest Variant and a Proposal**

  The **Fink** is the hardest to make convincing in a realist novel.

  *   **Why:** In metaphysics, a finkish disposition vanishes instantly upon stimulation. In psychology, character traits do not usually evaporate in a second without seeming like a *deus ex machina* or inconsistent writing. If Elena is claustrophobic for 300 pages, and then suddenly isn't because a child cried, the reader may perceive this as poor characterisation rather than a philosophical fink. It risks looking like the author changed their mind about the character.
  *   **Fourth Variant Proposal:** To clean the set, I would suggest adding a **Fourth Variant: The Overdetermined Case**.
      *   *Scenario:* She has the disposition (Panic), and the Mimic cause is also present (Hypoglycemia). Both are sufficient to cause the collapse.
      *   *Utility:* This creates a scenario where the CBA must decide if the disposition is present (it is) even if the behaviour would have happened anyway. It complicates the Mimic case and tests the robustness of the trait. However, for your specific purpose of distinguishing the *accusation* of the trait, the Fink/Mask/Mimic triad is sufficient.
      *   *Advice:* If you must use the Fink, foreshadow the "removal" mechanism. Show earlier in the book that her protectiveness towards children has previously overridden her own safety. This grounds the "finkish" removal in established character logic, making the metaphysical shift feel like psychological realism.
