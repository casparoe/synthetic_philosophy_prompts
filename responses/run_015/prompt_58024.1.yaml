  Second year metaphysics PhD here, and I am losing my mind over the special composition question. We've done universalism (any collection makes something), nihilism (basically nothing ever does), and all the moderate views that try to draw a line and then get wrecked by vagueness or arbitrariness arguements, and at this point everyone just trades intuitions about scattered hunks of matter and won't budge. My hunch is the standoff isn't really about the world at all but about what we want objects to do for us, like counting ordinary things versus doing fundamental ontology, but I can't quite make that stick. So what kind of disaggreement is this — verbal, substantive, different standards for what counts as evidence, bedrock intuitions? And what would actually count as progress, if anything? Like would a new distinction help, or should we just accept its ill-posed and move on? The case that broke our seminar was stupidly concrete: half-built IKEA shelf with the remaining screws still in the bag sitting on top of it — is there already a shelf-plus-screws thing there or not, and why does that feel like it should settle something but doesn't?
