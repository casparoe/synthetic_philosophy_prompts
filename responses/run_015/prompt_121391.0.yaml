answer: |-
  Dear Colleague,

  This is a wonderfully precise observation, and you are quite right to feel that the standard taxonomy — typically divided between holism, methodological individualism (MI), and perhaps structuralism — leaves a gap here. The pattern you describe is prevalent enough to be a recognised 'sin' in the philosophy of social science, yet it lacks a single, canonical label akin to, say, the 'ecological fallacy' or the 'naturalistic fallacy'.

  Below, I outline the closest existing concepts, propose a precise definition for your seminar purposes, and analyse whether this constitutes a logical inconsistency or merely a pragmatic omission within methodological individualism.

  ### 1. The Terminological Landscape

  There is no single settled term for this specific manoeuvre, but it sits at the intersection of three existing critiques:

  *   **Crypto-holism:** As you noted, this is the closest relative. Traditionally, crypto-holism refers to theorists who claim to explain phenomena via individuals but implicitly attribute agency or intentions to collectives (e.g., 'Germany wanted war'). Your case is subtler: there is no group agency, but there is a **group-level distribution** doing the causal heavy lifting. Some philosophers, such as Daniel Little, might categorise this under **'incomplete micro-foundations'**, where the macro-structure is assumed rather than constituted by the micro.
  *   **The Equilibrium Selection Problem:** In rational choice theory and game theory, this pattern often arises when researchers assume a specific equilibrium (the macro pattern) to justify the individual strategies, without explaining how agents coordinate on that equilibrium rather than another. This is sometimes called **'assuming the explanandum'**.
  *   **Closed-System Modelling:** Critical realists, such as Tony Lawson, argue that treating social structures as exogenous parameters amounts to modelling a 'closed system' where the open-ended nature of social structure is ignored. They might label this **'deductivist abstraction'**.

  For your seminar, I would suggest adopting the label **'Parameterised Holism'** or **'The Exogenous Structure Fallacy'**. Neither is canonical, but both accurately capture the logical shape: holism is not denied ontologically, but it is smuggled in methodologically as a fixed parameter.

  ### 2. A Precise Definition

  To help your students map this, you might define the phenomenon as follows:

  **Phenomenon:** *Exogenous Structural Parameterisation* (or *Parameterised Holism*)
  **Definition:** A modelling strategy wherein a researcher claims adherence to methodological individualism but treats a macro-level distribution or structural constraint as an exogenous input parameter to calibrate micro-level decision rules, thereby using the *explanandum* (the macro pattern) as a hidden premise to generate the *explanans* (the micro behaviour).

  **Boundary Conditions:**
  1.  **Explicit Ontology:** The researcher explicitly denies causal efficacy to social wholes (adheres to MI).
  2.  **Implicit Methodology:** The model requires a macro-level distribution (e.g., density of believers, institutional constraint) to be fixed *before* the simulation or deduction begins.
  3.  **Calibration Loop:** The micro-rules are tuned specifically to reproduce the observed macro-pattern given those fixed parameters.
  4.  **Explanatory Claim:** The reproduction of the pattern is claimed as a successful individualistic explanation, despite the macro-structure remaining unexplained and causally potent.

  ### 3. Distinction from an Ordinary Auxiliary Hypothesis

  You asked how this differs from a legitimate auxiliary hypothesis. In a robust methodological individualist framework (such as Peter Hedström's analytical sociology), auxiliary hypotheses regarding the environment are permissible *provided they are themselves individuated*.

  *   **Legitimate Auxiliary:** 'Individuals face a budget constraint of £X.' (This can be traced to individual endowments or specific transactions).
  *   **Parameterised Holism:** 'Individuals face a belief distribution *D*.' (Where *D* is a property of the collective that cannot be reduced to the specific interactions currently being modelled).

  The key distinction is **endogeneity**. In a consistent MI model, the macro-structure should emerge from the interaction of the agents (the 'micro-macro link' in Coleman's Boat). In the pattern you describe, the macro-structure is a **boundary condition** that constrains the agents but is not produced by them within the model's timeframe. It is not an auxiliary hypothesis; it is the *target of explanation* disguised as a starting condition.

  ### 4. Is it Inconsistent with Methodological Individualism?

  This is the crux of the philosophical debate for your seminar. The answer depends on whether you adopt a **Strong** or **Weak** conception of MI.

  *   **Strong MI (e.g., Watkins, Elster):** Yes, it is inconsistent. Strong MI demands that all social facts be constituted by facts about individuals. If the distribution of beliefs is treated as a sui generis constraint that shapes individual utility functions without itself being explained by individual interactions, the researcher has violated the **Constitutional Claim** of MI. They are relying on a social fact to explain individual action, which reverses the required direction of constitution.
  *   **Weak MI (e.g., Kincaid, Zahle):** It may be viewed as a pragmatic omission rather than a logical contradiction. Weak MI accepts that some social structures may need to be taken as given for the sake of tractability, provided one *could* in principle reduce them. However, even Weak MI proponents would argue that if the structure does the primary explanatory work (i.e., without that specific distribution, the micro-behaviour would not produce the outcome), then the claim to individualism is misleading.

  I would argue for your seminar that it is best characterised as a **performative contradiction**. The researcher *says* they are doing MI, but the logical structure of their explanation relies on the causal autonomy of a collective distribution. It is not merely an 'embarrassing omission'; it is a failure to navigate the **Coleman Boat**. They attempt to go from Macro to Macro (via a micro-simulation) without traversing the first leg (Macro to Micro) explicably.

  ### 5. Seminar Recommendations

  To illustrate this to your students, you might draw upon:

  *   **Coleman's Boat (1990):** Show how this pattern skips the transition from Macro to Micro (Type 1), instead assuming the Micro state matches the Macro requirement.
  *   **Jon Elster's Critique of Functionalism:** Elster argues that explaining a phenomenon by its effects is illegitimate without a mechanism. Here, the 'mechanism' is simulated, but the initial conditions are functionally selected to ensure the outcome.
  *   **Agent-Based Modelling (ABM) Literature:** Refer to critiques of 'pattern-oriented modelling' where calibration against empirical data becomes a form of curve-fitting rather than explanation (e.g., work by **J. Gary Polhill** or **Bruce Edmonds** on verification and validation).

  In summary, while there is no single noun phrase in the canon, the move is well-recognised as a failure of **micro-foundational rigour**. For your course materials, I recommend labelling it **'Parameterised Holism'** to highlight the tension between the individualist ontology and the holistic methodology.

  I hope this proves useful for drafting your seminar materials. It is a sophisticated point that will surely provoke lively discussion among your graduate students.

  Yours sincerely,

  [Your Name/AI Assistant]
