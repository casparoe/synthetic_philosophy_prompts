  2.  **Deconstruct the Philosophy:**
      *   *Standard View:* Pain has two components: sensory (where/how strong) and affective (ouch/bad/go away).
      *   *Asymbolia:* A condition where patients feel pain but don't mind it. They know they are being hurt but don't care.
      *   *Satirical Angle:* The bureaucracy treats the "minding" part as inefficient baggage. By removing the "badness," they claim to eliminate suffering while keeping the "data."
      *   *The Twist (Somatic Sovereignty):* The "badness" is actually what makes us care about our bodies. Removing it makes us indifferent to our own destruction. The bureaucracy frames this as "optimization" or "compliance," missing the existential horror.

