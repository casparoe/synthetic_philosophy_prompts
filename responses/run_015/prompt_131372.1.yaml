answer: |-
  Dear Colleague,

  Thank you for writing. You have put your finger on precisely the nerve that makes the situationist challenge so disruptive to teaching ethics. It is one thing to discuss the metaphysics of virtues in a seminar; it is quite another to decide how to frame moral development to second-year students who are themselves forming their moral identities.

  Your junior colleague is correct on the technical logic, but you are correct on the philosophical stakes. To decide who has the "better" of the argument, we must disentangle the empirical claims from the normative implications. Here is how I would break down the three specific questions you raise, followed by a suggestion for how to frame this in your module.

  ### 1. Is situational sensitivity evidence against the existence of traits?

  Your instinct here is sound: **a disposition is by its nature conditional.** To say sugar is soluble is not to say it dissolves in a dry cupboard, but only that it dissolves *if* immersed in water. Similarly, to say an agent is courageous is not to say they act courageously under torture, but that they do so *if* faced with a threat to a worthy end.

  The situationist literature (Doris, Harman) does not merely claim that behavior is sensitive to conditions; it claims that the *relevant conditions* are often morally trivial (finding a dime, smelling fresh bread) and that the *consistency* of behavior across different contexts is far lower than folk psychology predicts.

  Therefore, the data is not evidence against the existence of *any* dispositions, but it is strong evidence against **global** traits. If "honesty" implies a reliable disposition to tell the truth across a wide range of situations (tax returns, friendships, exams, traffic accidents), the data suggests such a trait is empirically rare or non-existent. Your colleague is right that the data cannot exclude "local" dispositions (e.g., honesty-in-exam-conditions). However, you are right to worry that this changes the definition of "trait" so significantly that it may no longer do the work we want it to do.

  ### 2. Does the critique target normative or descriptive claims?

  This is the pivot point for your module. The situationist challenge is primarily **descriptive** (psychological), but it threatens the **normative** (ethical) via the principle that "ought implies can."

  Virtue Ethics is not merely a list of ideals; it is a theory of moral psychology. It claims that becoming virtuous is the path to *eudaimonia* and that moral education consists of habituating stable states of character. If the situationists are right that human psychology is structurally incapable of sustaining global traits, then Virtue Ethics is prescribing an impossible ideal.

  However, if you treat Virtue Ethics purely as a normative standard (an ideal we *ought* to strive for, even if we rarely achieve it), the situationist critique loses some bite. But this risks turning virtue into a Platonic Form detached from human agency. My view is that the critique strikes most forcefully at the **pedagogical** claim of virtue ethics: the idea that we can build a unified moral self through habituation. If the self is fragmented by situation, habituation may only produce context-specific reflexes, not character.

  ### 3. Does your colleague's proposal answer the critique, or surrender the distinctive value of virtue?

  Here is where your suspicion of a "retreat" is most justified. Your colleague proposes what is often called the "fragmentation" or "local traits" defense. It is logically immune to the situationist data, but it purchases that immunity at a high cost.

  *   **Intelligibility:** One of the great strengths of virtue ethics is that it makes an agent's life intelligible as a narrative unity. If I am honest in the exam room but deceitful in the boardroom because my "local traits" differ, my life lacks moral coherence. We cannot explain *who the agent is*, only how they react to specific cues.
  *   **The Unity of Virtues:** Traditional virtue ethics holds that virtues are interconnected (you cannot truly have courage without wisdom, etc.). Local traits sever this connection. One might have "helpfulness-when-in-a-good-mood" alongside "cruelty-when-stressed." This looks less like a moral agent and more like a collection of behavioral reflexes.
  *   **Intrinsic Worth:** You ask if a local trait is worth having for its own sake. If my "honesty" is merely a reliable response to the presence of CCTV, it looks like prudence or conditioning, not virtue. Virtue requires acting for the sake of the noble (*to kalon*), not merely responding correctly to environmental cues.

  So, while your colleague saves the *concept* of a disposition, she risks losing the *concept of the virtuous agent*.

  ### Pedagogical Recommendation

  For a second-year module, I would advise against presenting either your original view or your colleague's as the "settled" truth. Instead, use the tension as the engine of the course.

  1.  **Present the Situationist Challenge accurately:** Acknowledge that it destroys the "Aristotelian naivety" that people possess robust, global character traits.
  2.  **Present the Colleague's Defense:** Show how "local traits" survive the empirical data.
  3.  **Invite the Critique of the Defense:** Ask the students what is lost. If we accept local traits, do we still have "character"? Do we still have moral responsibility? If my behavior is cued by the weather, am I praiseworthy when the sun shines?
  4.  **The Normative Turn:** Conclude by asking whether Virtue Ethics should be abandoned, or whether it should be revised to focus on **situational management** (as you suggested) *plus* **critical reflection**. Perhaps the virtue of the future is not "global honesty" but the wisdom to recognize which situations corrupt us and the discipline to restructure them.

  **Verdict:** Your colleague has the better *empirical* defense, but you have the better *philosophical* intuition. The "local traits" move saves virtue ethics from falsification but risks draining it of its value.

  I would suggest teaching the situationist critique not as a refutation of virtue ethics, but as a demand for a more sophisticated moral psychology—one that acknowledges our fragility without surrendering the ideal of unity. That seems to me the most honest course for your students.

  Yours sincerely,

  [Your Name]
