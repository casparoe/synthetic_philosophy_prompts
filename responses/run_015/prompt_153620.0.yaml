  2.  **Deconstruct the Two Accounts:**
      *   **Danger-Anchored (DA):** Asylum is emergency shelter. Basis: Fear of persecution/harm. Duty: Non-refoulement (don't send back to danger). Expiry: When danger passes. Location: Any safe place.
      *   **Accrued-Membership (AM):** Asylum/Residence is social integration. Basis: Time, roles, relationships, contribution. Duty: Recognition of existing social fact. Expiry: Doesn't expire easily (roots grow). Location: This specific community (where the roots are).

  3.  **Address the Four Questions:**

      *   *Q1: Who counts?*
          *   DA: Narrow. Needs specific peril (persecution). Struggles with climate migrants, economic collapse unless framed as persecution.
          *   AM: Broad. Anyone who lives here and integrates counts. Doesn't care *why* they came, only that they *are* here and embedded.
      *   *Q2: Who must take them in?*
          *   DA: Any safe state. Duty is negative (don't kill them) or humanitarian (shelter). Third-country removal is logically consistent if safe.
          *   AM: This specific state. Duty is relational (based on existing ties). Third-country removal is a rupture of existing social fabric, morally akin to exile.
      *   *Q3: The Delay (11 years).*
          *   DA: If danger is gone, claim is gone. State delay is unfortunate but doesn't change the factual basis of the danger. Staleness is valid.
