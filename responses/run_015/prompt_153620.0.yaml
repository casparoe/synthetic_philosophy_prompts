      *   *Q4: Peril ended, ties remain.*
          *   DA: Claim extinguished. She is now an undocumented migrant liable to removal.
          *   AM: Claim strengthened. The danger was the entry ticket, but the membership is the current currency. She belongs now regardless of the past.

