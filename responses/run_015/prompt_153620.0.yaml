answer: |-
  The accrued-membership account is not a competing definition of asylum but a separate moral claim that arises from the state's own passage of time, converting the woman's status from a guest protected by fear into a member protected by fact.

  On the question of who counts, the danger-anchored account is inherently exclusive because it requires a specific narrative of targeted harm, leaving no room for those fleeing generalized collapse, climate disaster, or economic suffocation unless those conditions can be twisted to resemble persecution. The accrued-membership account is inherently inclusive regarding presence but exclusive regarding entry; it cannot help those still at the border, but for anyone already inside, it renders the original cause of flight irrelevant, counting the drought-refugee and the political-dissident equally if both have worked, paid taxes, and joined choirs for eleven years.

  On the question of who must take them in, the danger-anchored account views the duty as humanitarian and transferable, implying that any safe state discharges the obligation, which logically permits removing the claimant to a third country with no prior connection to her. The accrued-membership account views the duty as relational and non-transferable, grounded in the specific web of expectations woven between the woman and her neighbors, meaning that removal to a safe third state is not safety but exile, severing the very ties that generate the claim.

  On the question of the state's delay, the danger-anchored account treats the eleven years as evidence that the emergency has passed, allowing the state to argue that the claim has stale-dated regardless of who caused the wait. The accrued-membership account treats the eleven years as a debt incurred by the state, arguing that by permitting her to work the ward and sing in the choir without interruption, the state actively cultivated the membership it now seeks to deny, and cannot benefit from its own procedural negligence to extinguish the rights it allowed to grow.

  On the question of what remains when the peril ends, the danger-anchored account leaves nothing but a liability, reducing the woman to an undocumented alien whose presence is tolerated only until logistics allow removal. The accrued-membership account leaves the core claim intact and strengthened, positing that the original peril was merely the entry ticket while the current integration is the substance of the right, so that the end of the danger changes nothing about the obligation to let her stay.

  These two accounts are not rivals but sequential layers of obligation. The danger-anchored account explains the right to non-refoulement at the moment of arrival, while the accrued-membership account explains the right to regularization after a period of residence. Reading them as independent claims rather than competing theories shifts the burden of the hearing from proving past trauma to proving present integration; it changes the legal question from "Was she in danger then?" to "Is she one of us now?" This distinction transforms the scene from a plea for mercy based on past suffering into a demand for justice based on current contribution, forcing the adjudicator to acknowledge that the state's failure to decide sooner created a new moral reality that cannot be undone by a belated decision.

  I am highly confident in the structural coherence of this distinction and its moral implications. I am least sure about the extent to which a legal tribunal can practically recognize the accrued-membership claim as independent without specific statutory authorization, as existing law often conflates the two rather than treating them as sequential.
