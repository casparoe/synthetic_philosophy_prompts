prompt: |-
  A competent adult can sign an advance directive stating that, should they later lose the capacity to decide -- for example, from advanced dementia -- their life support is to be withdrawn. When that crisis arrives the patient usually can no longer confirm or withdraw the directive, yet physicians and surrogates are expected to carry it out as though it were the patient's own present decision. The practice is strikingly asymmetric: a competent person may revoke a directive at any moment, so the present self outranks the past one, but an incapacitated person may do no such thing, so the past self outranks the present one -- authority tracks competence, not time. What view of the self over time does that practice presuppose? Does it commit us to the claim that one person persists through large psychological change and that the earlier, competent self retains authority over the later, altered one? Reconstruct the implicit theory of diachronic authority the practice rests on, say which rival views of personal identity or of reasons it quietly rules out, mark where the practice is underdetermined and could be licensed by more than one theory, and describe what would have to change in how we treat advance directives if we rejected the assumption that the earlier self outranks the later one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Scenario:** A competent adult signs an advance directive (AD) to withdraw life support if they lose capacity (e.g., advanced dementia). When the crisis hits, they can't confirm/revoke it. Physicians/surrogates execute it.
      *   **The Asymmetry:** Competent self can revoke past directive (Present > Past). Incapacitated self *cannot* revoke past directive (Past > Present). Authority tracks competence, not chronological time.
      *   **Key Questions to Answer:**
          1.  What view of the self over time does this practice presuppose?
          2.  Does it commit us to the claim that one person persists through large psychological change and the earlier self retains authority?
          3.  Reconstruct the implicit theory of diachronic authority.
          4.  Say which rival views of personal identity or reasons it rules out.
          5.  Mark where the practice is underdetermined (could be licensed by more than one theory).
          6.  Describe what would change if we rejected the assumption that the earlier self outranks the later one.

  2.  **Initial Brainstorming & Philosophical Context:**

      *   *Personal Identity:* Lockean psychological continuity vs. Biological continuity (Animalism) vs. Narrative Self.
      *   *Precedent Autonomy:* The standard bioethical justification (Dworkin, Dresser).
      *   *Critiques:* Rebecca Dresser (the "now" self matters), David DeGrazia, Marya Schechtman.
      *   *The Asymmetry:* This is the crux. Why does competence grant veto power only one way?
      *   *Diachronic Authority:* How does authority transfer across time? Is it a property of the *person* (enduring) or the *stage* (temporal slice)?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. The practice is standard bioethics (Precedent Autonomy), but it relies on specific metaphysical and normative assumptions.

      *   **1. The Presupposed View of the Self (Personal Identity):**
          *   Does it require strict identity? Yes, mostly. It assumes the person who signed the AD is the *same* entity as the patient in the bed.
          *   *Psychological Continuity:* Usually, ADs rely on the idea that values/preferences persist even if specific memories don't.
          *   *Critical Interests vs. Experiential Interests:* Ronald Dworkin's distinction is crucial here. The practice assumes "critical interests" (integrity of the life narrative) survive the loss of capacity.
          *   *Commitment:* It does commit to the persistence of the person through psychological change, *but* specifically that the *normative status* of the competent stage is higher.

      *   **2. Reconstructing the Implicit Theory of Diachronic Authority:**
          *   *The "Competence Trump" Principle:* Authority is a function of decision-making capacity.
          *   *The "One Life" Narrative:* The earlier self is the author of the life story; the later self is a character in that story. The author decides the ending.
          *   *Ulysses Contract:* Binding the future self to protect the values of the past self.
          *   *Formula:* Authority = Competence $\times$ Enduring Identity. If Competence = 0, Authority reverts to the last competent expression.

      *   **3. Rival Views Ruled Out:**
          *   *Strict Presentism / Stage Theory:* If the dementia patient is a "new person" (psychological discontinuity), the AD is invalid (like a will written by a stranger). The practice rules this out.
          *   *Pure Experientialism:* If only current suffering/pleasure matters (hedonistic utilitarianism), past preferences don't count. The practice rules this out.
          *   *Radical Revisionism:* The idea that the demented self has *new* rights that override old ones (Dresser's view). The practice rejects this.

      *   **4. Underdetermination (Where multiple theories fit):**
          *   *Biological vs. Psychological Identity:* The practice works whether you think the patient is the same *human organism* (Animalism) or the same *psychological being* (Lockean), as long as the *legal/moral status* remains constant.
          *   *Best Interests vs. Autonomy:* Sometimes following the AD aligns with "best interests" (avoiding suffering). We don't always know if the motive is respecting the *past will* or protecting the *present welfare*.
          *   *Substituted Judgment:* Is the surrogate speaking *for* the past self or *for* the present self based on past data? The practice blurs this.

      *   **5. Consequences of Rejection (If Earlier Self $\ngtr$ Later Self):**
          *   *ADs become advisory only:* They express wishes but don't bind.
          *   *Best Interests Standard:* Decisions default to the current welfare of the demented patient (e.g., if they look happy eating, don't starve them, even if AD said "no tubes").
          *   *Requiring Re-consent:* Impossible for severe dementia, so life-sustaining treatment might become the default (preservation of life) unless current distress is evident.
          *   *Shift from Autonomy to Beneficence:* The ethical center of gravity moves.

  4.  **Refining and Polishing:**

      *   *Tone:* Philosophical, analytical, precise.
      *   *Key Terminology:* Precedent Autonomy, Diachronic, Psychological Continuity, Critical Interests, Stage Theory.
      *   *Check the Asymmetry:* Ensure I explain *why* the asymmetry exists in the standard view (Competence is the gatekeeper of authority).
      *   *Self-Correction during drafting:* I need to be careful not to say the practice *proves* psychological continuity. It could just be a legal fiction. I should highlight that distinction in the "Underdetermined" section.
      *   *Addressing the "Authority Tracks Competence" point:* This is the most insightful part of the prompt. I need to emphasize that authority is not a property of the *time* but of the *capacity*.

  5.  **Final Review against Prompt Requirements:**
      *   View of self over time? (Included)
      *   Commit to persistence + authority? (Included)
      *   Reconstruct implicit theory? (Included)
      *   Rival views ruled out? (Included)
      *   Underdetermination? (Included)
      *   What changes if rejected? (Included)

  6.  **Final Polish:** (Produces the structured output below).
answer: |-
  The practice of enforcing advance directives (ADs) against the apparent interests or silence of an incapacitated patient rests on a specific, robust, yet often unexamined metaphysical and normative framework. It resolves the tension between the past competent self and the present incapacitated self by prioritizing **precedent autonomy**. Below is a reconstruction of the implicit theory of diachronic authority this practice relies upon, the views it excludes, where it remains underdetermined, and the consequences of rejecting its core assumption.

  ### 1. The Presupposed View of the Self Over Time

  The practice presupposes a **Narrative View of Personal Identity** coupled with a **Hierarchical Model of Competence**.

  *   **Numerical Identity through Psychological Change:** The practice assumes that the individual in the advanced dementia stage is numerically identical to the individual who signed the directive. Despite radical psychological discontinuity (loss of memory, reasoning, personality), there is a persisting entity that bears the rights and obligations established earlier.
  *   **The "Critical Interest" Thesis:** Following Ronald Dworkin, the practice assumes that a person has "critical interests" (the integrity of their life narrative and values) that survive the loss of "experiential interests" (current pleasure or pain). The self is viewed not merely as a sequence of experiential moments, but as a unified project extending across time.
  *   **Authority Tracks Capacity, Not Chronology:** The asymmetry you note (Present > Past when competent; Past > Present when incapacitated) reveals that authority is not an inherent property of the *current* temporal slice of the person. Instead, authority is a function of **moral agency**. When agency is intact, it is sovereign; when agency is lost, sovereignty reverts to the last valid exercise of that agency.

  **Does it commit us to the claim that the earlier self retains authority?**
  Yes. It commits us to the claim that the *person* persists, and that the *normative status* of the competent stage of that person is superior to the incapacitated stage. It treats the AD not merely as evidence of what the patient might want, but as a binding command issued by the only version of the self capable of issuing binding commands.

  ### 2. Reconstructing the Implicit Theory of Diachronic Authority

  We can reconstruct the implicit theory governing this practice as the **Principle of Precedent Sovereignty**. It contains three axioms:

  1.  **The Unity Axiom:** The competent signer and the incapacitated patient are the same moral patient. Rights and obligations attach to the enduring entity, not the temporal stage.
  2.  **The Competence Gate:** Moral authority to make life-and-death decisions requires the capacity for rational reflection and value consistency.
  3.  **The Lock-In Effect:** When the Competence Gate closes (incapacity), the last valid output of the moral agent (the AD) becomes the standing will of the entity. The incapacitated stage lacks the machinery to generate new authority, so it cannot override the old authority.

  In this framework, the "self" is not a democracy of temporal stages where each day gets a vote. It is a constitutional monarchy where the "Competent Self" is the monarch and the "Incapacitated Self" is a regent who must rule according to the monarch's last decrees.

  ### 3. Rival Views Ruled Out

  This practice quietly rules out several rival metaphysical and ethical theories:

  *   **Psychological Stage Theory (The "New Person" View):** If personal identity consists strictly in psychological continuity (Locke), and advanced dementia severs that continuity, the dementia patient is effectively a new person. If they are a new person, the AD is a document signed by a stranger. Enforcing it would be a violation of the new person's rights. The practice rules this out by treating the AD as binding despite psychological rupture.
  *   **Pure Experientialism (Hedonistic Utilitarianism):** If moral weight attaches only to current capacity for suffering or enjoyment, the past self's abstract values hold no weight against the present self's concrete experience (e.g., a demented patient enjoying ice cream). The practice rules this out by allowing past values to trump present experiential welfare.
  *   **Radical Presentism (Dresser's Critique):** Rebecca Dresser argues that the demented self has developed new interests that deserve protection. The practice rejects the idea that the emergence of new, simple interests in the incapacitated state generates moral authority sufficient to override complex, prior critical interests.

  ### 4. Where the Practice is Underdetermined

  While the practice relies on the assumptions above, it is underdetermined in ways that allow different theoretical justifications to coexist:

  *   **Biological vs. Psychological Identity:** The practice works equally well under **Animalism** (we are human organisms) and **Psychological Continuity**.
      *   *Animalism:* The human organism persists; the AD is a instruction regarding the care of the organism.
      *   *Psychological:* The person persists via a "thin" psychological thread (values), even if memories are gone.
      *   *Underdetermination:* The law does not require us to decide *why* they are the same person, only *that* they are treated as such.
  *   **Autonomy vs. Best Interests:** Sometimes, honoring an AD aligns with the current best interests of the patient (e.g., avoiding painful, futile treatment).
      *   *Theory A:* We follow the AD because it respects the past autonomous will.
      *   *Theory B:* We follow the AD because it is the best evidence of what benefits the patient now.
      *   *Underdetermination:* In cases where the AD demands withdrawal of care but the patient appears content (the "happy demented patient"), the practice usually still favors the AD. However, in gray areas, clinicians often conflate autonomy with beneficence, masking the theoretical conflict.
  *   **The Nature of the Directive:** Is the AD a **command** (instructional) or **evidence** (interpretive)?
      *   If it is a command, the past self rules.
      *   If it is evidence for "substituted judgment," the surrogate is trying to guess what the *current* self would want if they could speak.
      *   *Underdetermination:* Legal language often blurs these. If it were purely evidence, the current behavior of the patient (smiling, eating) could count as counter-evidence. The practice usually treats it as a command, but the theoretical justification often slides into evidentiary language.

  ### 5. Consequences of Rejecting the Assumption

  If we rejected the assumption that the earlier self outranks the later one (i.e., if we adopted a view where the incapacitated self's current interests hold equal or greater weight than the past self's directives), the treatment of advance directives would change fundamentally:

  1.  **ADs Become Advisory Only:** Advance directives would lose their binding legal force. They would function as "statements of values" to be weighed alongside the current behavior and apparent welfare of the patient, but not as veto-proof commands.
  2.  **Shift to the "Best Interests" Standard:** Decision-making would default to the current welfare of the incapacitated patient. If a patient with advanced dementia appears to enjoy life (even simple pleasures), life support would likely be maintained regardless of a prior directive, unless the treatment itself caused current suffering.
  3.  **Presumption of Life:** Without the binding authority of the past self to authorize death/withdrawal, the default ethical position would likely shift toward the preservation of the current biological life. The burden of proof would move to those wishing to withdraw care to demonstrate *current* suffering, rather than *past* wishes.
  4.  **Requirement of Contemporary Assent:** We might require some form of contemporaneous assent from the incapacitated patient (e.g., lack of resistance to withdrawal) before acting on an AD. This would effectively nullify ADs for those in deep dementia who cannot communicate.
  5.  **Ethical Reorientation:** Bioethics would shift from a primary focus on **Autonomy** (respecting the author of the life) to **Beneficence** (protecting the current inhabitant of the body). The "narrative integrity" of the life would be deemed less valuable than the "experiential quality" of the current moment.

  ### Summary

  The enforcement of advance directives presupposes that **personhood is an enduring project** and that **moral authority is a capacity-dependent property** that, once lost, freezes in its last valid configuration. It rules out views that treat the demented patient as a new person or prioritize current experience over past values. If we were to reject the supremacy of the earlier self, the advance directive would cease to be a tool of self-determination and would become merely a piece of historical data, subordinate to the immediate welfare of the incapacitated being.
