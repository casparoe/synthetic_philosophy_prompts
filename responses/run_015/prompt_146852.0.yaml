      *   *Empirical/Historical:* No. Hegel's system is not empirically falsifiable in that way. Modern conscription doesn't refute Hegel's logic of sovereignty.
      *   *Bedrock Intuitions:* Partially. But we can move past "intuitions" by clarifying the *systematic location* of the argument.
