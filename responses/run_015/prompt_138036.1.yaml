answer: |-
  Here is a structured activity design, refined to fit your 80-minute window and pedagogical goals. It keeps your "chip economy" intuition but tightens the mechanics to ensure the four distinctions emerge from the *friction* of the game rather than just the rules.

  ### Activity Title: The Council of Voice

  **Objective:** To separate the *truth* of a charge from the *authority* of the charger, the *severity* of the response, and the *consequences* for the charger.
  **Materials:** 45 "Voice Tokens" (3 per student; poker chips, colored cards, or coins), 4 Case Cards (projected or printed), Whiteboard + 4 colored markers.
  **Room:** Tables in a single large hollow square or U-shape. Whiteboard visible to all.

  ---

  ### Part 1: The Rules (10 Minutes)
  *Do not use the words "standing," "warrant," "hypocrisy," or "forfeiture."*

  **Script for Setup:**
  "We are a Council tasked with maintaining the norms of a community. Today, we are judging four specific incidents. Here is how the Council operates:

  1.  **The Charge:** To accuse someone of violating a norm, you must place one **Voice Token** in the center pot. This represents your investment in the norm. No token, no accusation.
  2.  **The Challenge:** Once a charge is made, any other member may challenge the Accuser's 'Clean Hands.' This means asking: *'Are you in a position to make this specific charge?'*
  3.  **The Disclosure:** If challenged, the Accuser must reveal the information on their **Case Card** regarding their own relationship to that norm.
  4.  **The Ruling:** The Council votes.
      *   **Majority 'In Order':** The Accuser keeps their token. The charge stands. The target is judged.
      *   **Majority 'Out of Order':** The Accuser loses their token to the pot (it is gone). The charge is dismissed *without* judging the target.
  5.  **The Reckoning:** If an Accuser loses their token, the Council must decide: Does the Accuser owe an apology to the group for wasting our time, or are they free to go?
  6.  **Constraint:** Do not confess real personal faults. Only reveal what is written on the Case Card. This is a simulation."

  **Write on Whiteboard:**
  *   Column 1: **The Act** (Did the target do it?)
  *   Column 2: **The Voice** (Was the Accuser allowed to speak?)
  *   Column 3: **The Weight** (Was the punishment too harsh?)
  *   Column 4: **The Debt** (Does the Accuser owe us?)
  *(Tell students: "I will be marking these columns as we play. Watch where I put the marks.")*

  ---

  ### Part 2: Gameplay (40 Minutes)
  *Run 4 Cases. 10 Minutes each. Assign one student to read the "Accuser's Card" aloud when they stake a token.*

  **Case 1: The Plain Hypocrite**
  *   **Target:** Alex stole office supplies.
  *   **Accuser:** Jordan.
  *   **Card Info:** Jordan also steals office supplies regularly and knows it.
  *   **Goal:** Students should challenge. Council should rule "Out of Order."
  *   **Facilitator Note:** Ensure they dismiss the charge *without* saying Alex is innocent.

  **Case 2: The Discharged Hypocrite**
  *   **Target:** Alex stole office supplies.
  *   **Accuser:** Jordan.
  *   **Card Info:** Jordan stole supplies last year, but publicly admitted it, returned the items, and apologized to the victim.
  *   **Goal:** Tension. Some will say "Past sinner," others "Cleaned hands."
  *   **Facilitator Note:** Watch if they treat the *repentance* as restoring the Voice.

  **Case 3: The Proxy**
  *   **Target:** Alex stole office supplies.
  *   **Accuser:** Jordan.
  *   **Card Info:** Jordan steals supplies regularly. However, Alex stole from *Taylor*, and Taylor is too afraid to speak. Jordan is speaking for Taylor.
  *   **Goal:** This is the critical test. Can you have "dirty hands" but valid "Voice" if representing a victim?
  *   **Facilitator Note:** If they vote "Out of Order," ask: "So Taylor gets no justice because Jordan is flawed?"

  **Case 4: The Self-Deceived**
  *   **Target:** Alex stole office supplies.
  *   **Accuser:** Jordan.
  *   **Card Info:** Jordan steals supplies but genuinely believes their own behavior is "borrowing" and not stealing. They think they are innocent.
  *   **Goal:** Does ignorance restore the Voice?
  *   **Facilitator Note:** Watch if they focus on Jordan's *belief* or the *fact* of the theft.

  *(Cut Cases: Counterfactual and Outsider. Counterfactual stalls on metaphysics ("would you really have done it?"). Outsider is too similar to Proxy for one session. Focus on the four above.)*

  ---

  ### Part 3: The Debrief (25 Minutes)
  *This is the most critical section. Do not lecture. Use the Whiteboard marks you made during play.*

  **Step 1: The Board Map (10 mins)**
  Point to the four columns you marked during the game.
  *   **Column 1 (The Act):** "In Case 1, Alex stole the supplies. That was true. But when Jordan lost their token, did we decide Alex didn't steal them?"
      *   *Target Distinction:* **Blameworthiness of Target.** (The truth of the charge is independent of the charger).
  *   **Column 2 (The Voice):** "Why did Jordan lose the token in Case 1 but keep it in Case 3 (Proxy), even though Jordan was guilty in both?"
      *   *Target Distinction:* **Standing/Authority.** (It's not about innocence; it's about your relation to the norm/victim).
  *   **Column 3 (The Weight):** "In Case 2, if Jordan had demanded Alex be fired for stealing a pen, would that have been 'In Order' even if Jordan had clean hands?"
      *   *Target Distinction:* **Proportionality.** (You can have standing but still blame excessively).
  *   **Column 4 (The Debt):** "When Jordan lost a token, some of you said they owed an apology. Others said 'no harm done.' What determined that?"
      *   *Target Distinction:* **Liability to Counter-Complaint.** (Bad standing makes *you* the target).

  **Step 2: Naming the Concepts (10 mins)**
  "Now we translate. In philosophy, Column 2 is called **Standing**. When you lost your token, your standing was **forfeited**. But notice Case 3: You can be guilty and still have standing if you are a **Proxy**. Notice Case 4: Self-deception doesn't always restore standing."

  **Step 3: The "So What?" (5 mins)**
  "Why does this matter? If we conflate these, what happens?"
  *   *Prompt:* "If we think Column 1 and Column 2 are the same, what happens to truth?" (Answer: We ignore crimes committed by popular people).
  *   *Prompt:* "If we think Column 2 and Column 4 are the same, what happens to discourse?" (Answer: People are afraid to speak for fear of being scrutinized).

  ---

  ### Part 4: Predictable Pitfalls & Setup Fixes
  *Address these in the "Rules" section (Part 1) to prevent them happening.*

  **1. The "No Standing = Innocence" Confusion**
  *   *Risk:* Students think dismissing Jordan means Alex is good.
  *   *Setup Fix:* In the rules, explicitly state: "Ruling a charge 'Out of Order' dismisses the *Accuser*, not the *Act*. We do not vote on Alex's guilt today, only on Jordan's Token."

  **2. The "Who is Worst" Competition**
  *   *Risk:* Students turn it into a contest to find the dirtiest Accuser.
  *   *Setup Fix:* "The goal is not to destroy the Accuser. The goal is to preserve the Norm. If you silence a valid Voice, the Norm suffers. Vote based on whether the Norm is served, not whether Jordan is likable."

  **3. Over-Disclosure/Therapy Session**
  *   *Risk:* Students confess real sins to "win" a token or challenge.
  *   *Setup Fix:* "Strict Rule: Only reveal what is on the Case Card. If you bring in outside information, the charge is automatically void. This is a logic game, not a confessional."

  **4. The Self-Deceived Dissolution**
  *   *Risk:* "If Jordan thinks they are innocent, they aren't hypocrites."
  *   *Setup Fix:* Pre-empt this in the Case 4 briefing. "For the purpose of this Council, hypocrisy is defined by the *fact* of the violation, not the Accuser's awareness. Your job is to rule on the fact."

  ---

  ### Part 5: Limitations & Closing Script (5 Minutes)
  *Be frank about what the game cannot do. This validates your expertise and closes the gap.*

  **The Limitation:**
  "This game treats blame as a **ruling by a committee**. It is third-personal. We are judging Jordan and Alex from the outside. But in real life, blame is **second-personal**. It is *me* talking to *you*. It involves resentment, apology, forgiveness, and relationship repair over time. A token cannot capture the pain of being blamed by a friend, nor the courage it takes to apologize."

  **The Closing Script:**
  "So, when you read the theorists on standing, remember this: They are trying to explain why sometimes, even when the accusation is *true*, the act of blaming is *wrong*. But they are also trying to figure out when we owe it to each other to speak up, even if our hands aren't perfectly clean. The game showed you the mechanics of authority; the reading will show you the ethics of relationship."

  ---

  ### Why This Works for Your Goals
  1.  **Separates the 4 Distinctions:** The Whiteboard columns physically separate the concepts during play. The debrief simply asks them to look at the board.
  2.  **No Jargon Up Front:** The mechanics use "Token," "In Order," and "Debt." The theory terms come only after the experience.
  3.  **Handles the Cases:** The Proxy case (Case 3) is the linchpin. It forces them to realize Standing $\neq$ Innocence. The Discharged case (Case 2) forces them to consider if Standing can be *earned back*.
  4.  **Manages Time:** 10 minutes per case is tight but sufficient if you keep the voting rapid. The debrief is structured to prevent drifting.
  5.  **Addresses the "Second-Personal" Gap:** By admitting the game's limitation, you prevent students from thinking the "Token Economy" is the whole theory of blame. It positions the game as a tool for isolating variables, not a simulation of moral life.
