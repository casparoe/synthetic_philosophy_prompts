  12. **Final Polish:** Ensure the tone respects the user's expertise (PhD student) while being practical about classroom management. (Proceed to generate output).

  *(Self-Correction on the "Proxy" Case)*: The prompt asks for "the proxy who blames on behalf of a third party who really was wronged, while being guilty of the same thing herself." This is the strongest test of Standing vs. Innocence. I must ensure the rules allow this to succeed where the Plain Hypocrite fails. The rule needs to be: "You lose your token if you lack Clean Hands *unless* you are speaking for the direct victim." This might be too complex for a rule. Better: Let the group vote. The *discussion* about why the Proxy keeps the token while the Plain Hypocrite loses it is where the learning happens. I will instruct the facilitator to guide that vote.

