answer: |-
  You are describing a robust and documented psychological tension, though there is no single established term that captures the specific *asymmetry* you observe across perpetrators, rescuers, and non-moral actors. The phenomenon you are witnessing is a convergence of two well-known mechanisms: **Defensive Attribution** and the **Pragmatic Implicature of Mitigation**.

  Here is the breakdown of the existing literature, where it fits, where it fails, and a proposed term for the specific configuration you describe.

  ### Existing Concepts and Their Limits

  **1. The Fundamental Attribution Error (FAE)**
  This is the settled observation that observers tend to over-emphasize dispositional (character-based) explanations for others' behavior while under-emphasizing situational causes.
  *   **Where it fits:** It explains the baseline preference for calling perpetrators "monsters" (disposition) rather than products of circumstance (situation).
  *   **Where it stops fitting:** The FAE is generally symmetrical; it predicts people will ignore situation for *both* good and bad acts. It does not explain why your teachers accept situational accounts for rescuers (Case 2) or students (Case 3). It also does not account for the *hostility* you describe; the FAE is usually a passive cognitive bias, not an active emotional resistance.

  **2. The Ultimate Attribution Error**
  This extends the FAE to group dynamics, noting that people attribute negative acts by out-groups (or moral violators) to disposition, but positive acts to situation or luck.
  *   **Where it fits:** It captures the negative/positive asymmetry between perpetrators and rescuers.
  *   **Where it stops fitting:** It treats the asymmetry as a way to protect the *group's* image, whereas your teachers are likely protecting their *individual* self-concept ("I am not like them"). It also misses the crucial variable you identified: hostility scales with the *relatability* of the cause, not just the valence of the act.

  **3. Defensive Attribution Hypothesis**
  This is the strongest existing match. It posits that observers reject explanations for harmful behavior that make the perpetrator similar to themselves, because accepting such explanations increases the perceived likelihood that they too could commit such acts.
  *   **Where it fits:** It perfectly explains why hostility scales with recognizability (Case 1). If the cause is "peer pressure" (relatable), the threat is high. If the cause is "pathological sadism" (unrelatable), the threat is low. It also explains why Case 2 (rescuers) does not trigger hostility: accepting that an ordinary person can be a hero is not threatening to the self-concept.
  *   **Where it stops fitting:** It describes the *motivation* for the resistance, but not the *mechanism* of the refusal. It doesn't fully explain why the teachers frame their resistance as an accusation of "making excuses" rather than simply disagreeing with the history.

  ### Reasoning Failure vs. Conversational Implicature

  You asked whether this is a failure of reasoning or a correct reading of conversational norms. The evidence suggests it is the latter: a **correct pragmatic inference that misfires in a pedagogical context.**

  In ordinary moral discourse (and specifically in legal sentencing, as you noted), offering a causal story for a bad act is conventionally understood as a request for mitigation. To say "He did X because of Y" is pragmatically equivalent to "He is less responsible because of Y." This is a Gricean implicature: a shared social rule about how language functions.

  Your teachers are not failing at logic; they are successfully decoding the social signal. In their lived experience, causal explanations for harm are almost exclusively offered to reduce blame. When you offer a causal story in a history classroom, you are using the *form* of a mitigation plea without the *function*. The teachers react to the form. They are correctly identifying that if this story were accepted in a moral court, blame would diminish. Their error is assuming the classroom is a moral court rather than a causal inquiry.

  ### One Phenomenon or Three?

  These are three instances of a single underlying phenomenon: **Threat-Modulated Causal Acceptance.**

  The rule your teachers are unconsciously applying is: *"Accept situational causes unless accepting them reduces the perceived distance between myself and a moral violator."*
  *   **Case 1:** Distance reduces (I could be a killer). Result: Rejection/Hostility.
  *   **Case 2:** Distance does not reduce (I could be a hero). Result: Acceptance.
  *   **Case 3:** No moral distance exists (failure is not evil). Result: Acceptance.

  The phenomenon is unified by the protection of moral distinctiveness.

  ### Proposed Coinage

  Since no single term captures the asymmetry of explanation acceptance driven by self-threat, I propose the term **"Moral Explanation Asymmetry."**

  This term distinguishes the specific pattern you observed from general attribution errors. It highlights that the resistance is not to *causality* per se, but to *causality applied to immorality* when it threatens the observer's moral self-exemption.

