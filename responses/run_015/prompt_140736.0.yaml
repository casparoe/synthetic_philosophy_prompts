answer: |-
  Dear Colleague,

  The puzzle you have laid out strikes at the heart of how we conceptualize agency over time, and I appreciate the opportunity to think through the theoretical commitments hidden in our committee's daily work. To begin reconstructing the theory our practice implicitly relies on, it helps to sketch the three main contenders in the philosophy of action regarding the source of reasons. The first is a plain desire-based view, often associated with Humean theories, which holds that reasons are fixed by an agent's actual psychological states at the time of action. The second is the indirect view your colleague champions, sometimes called an idealized deliberation view, which claims reasons are determined by what an agent would endorse under conditions of full information, calmness, and coherence. The third is an objective-list or object-given view, which posits that reasons stem from facts about well-being or value that exist independently of the agent's desires or deliberative capacities. When we test these against the three features of our hospital's practice, the fit is uneven for any single pure theory, suggesting our practice relies on a more nuanced hybrid account.

  Consider first the plain desire-based view. This account struggles significantly with the first feature, the enforcement of Ulysses clauses. If reasons are fixed by actual desires at the time of action, the psychotic patient's current desire to refuse treatment should override the signature given during wellness. To make this work, a desire theorist would need to invoke higher-order desires, arguing that the earlier self's second-order volitions authority over the later self's first-order impulses. However, this same view aligns well with the second feature, the respect for competent refusal, since it prioritizes the actual valuing of the agent at the time. It also fits the third feature, the limits on binding the future self, because it acknowledges that desires change and that a past desire cannot indefinitely constrain a present desire without violating the agent's current motivational structure. Next, consider the objective-list view. This theory handles the first feature easily if we assume treatment is objectively good, but it falters on the second feature. If reasons are given by facts about well-being, allowing a competent patient to die based on mistaken beliefs seems irrational unless we introduce a deontological side-constraint protecting autonomy regardless of the good. Finally, the indirect view your colleague favors offers a compelling unified explanation. It justifies the Ulysses clause because the earlier self was closer to the ideal deliberator, respects the competent refusal because the competent patient is deemed capable of ideal deliberation even with mistaken beliefs, and explains the limits on binding because the idealized deliberator of the future might reasonably diverge from the past, requiring contemporaneous confirmation to ensure continuity of the ideal will.

  Despite the elegance of the indirect view, I am not convinced our practice strictly presupposes it. The three features are mutually consistent without committing to the metaphysics of an idealized deliberator. Instead, they seem to rely on a status-based conception of competence intertwined with a narrative view of personal identity. On this view, authority tracks the capacity to maintain a coherent life story. The Ulysses clause is honored not because the past self was ideal, but because the present self lacks the status of a competent narrator due to psychosis. The competent refusal is respected because the patient retains the status of a competent narrator, even if the plot involves beliefs we find mistaken. The limits on binding exist because personal identity is not static; over long periods, the narrative thread may fray or shift so significantly that the past narrator is no longer the same agent as the present one. This account licenses the same three features just as well as the indirect view but grounds them in social and legal status rather than counterfactual deliberative conditions. It suggests that the inconsistency your colleague perceives is actually a sophisticated balancing of temporal autonomy, where we privilege the competent self whether it is past or present, while acknowledging that competence is fragile and identity is fluid.

  This brings us to the proposed amendment regarding the revocation of Ulysses clauses. The current policy discounts any revocation during an episode, assuming the episode itself negates authority. The amendment proposes honoring a revocation if the patient can reconstruct the considerations cited when signing the directive. This presupposes something distinct from current policy: it assumes that the authority of the earlier self over the later self is not absolute but depends on the later self's capacity to recognize the earlier reasoning as continuous with their own agency. It shifts the criterion from a binary status check are you in an episode to a gradient capacity check can you grasp the reasoning you are rejecting. This does assume that the authority of what we might call the idealized or past deliberator depends on the actual agent's ability to recognize that deliberator's reasoning. I would argue this is a genuine constraint on indirect views rather than merely a practical safeguard. If the indirect view claims that reasons are what you would advise yourself to do under ideal conditions, then a revocation made without cognitive grip on the original reasoning is not an ideal advice scenario it is noise. However, if the patient can reconstruct the reasoning, they demonstrate a continuity of mind that makes the revocation an authentic update rather than a symptom of fragmentation.

  There is a risk, however, that the amendment confuses procedural idealization with substantive idealization. Procedural idealization involves removing obstacles like fear or ignorance, while substantive idealization involves correcting the desires themselves to match what is truly good or coherent. The amendment tests for procedural capacity can you understand the argument but treats a positive result as license for substantive divergence you can reject the argument if you understand it. This is philosophically sound only if we believe that understanding entails the capacity for valid rejection. If the patient understands the reasoning but rejects it due to the very psychosis that clouded their judgment, the test fails to protect them. Yet, if the test is passed, it suggests the patient has regained enough procedural rationality to be treated as a co-author of their life again, even if mid-episode. This implies that our practice views autonomy not as a switch that is either on or off, but as a capacity that can be partially retained even during distress, provided the thread of reasoning remains intact.

  Finally, we must consider what would change if we abandoned the indirect picture altogether. If we adopted the view that reasons are simply given by actual contemporaneous valuing, the first feature of our practice would have to give way. Ulysses clauses would become unenforceable because the present desire would always trump the past desire. We would be forced to treat the psychotic patient's refusal as authoritative, which strikes most of us as a failure of care. Conversely, if we adopted the view that reasons are given by facts about well-being that actual valuing can fail to track, the second feature would have to give way. We would no longer respect a competent patient's refusal of life-saving treatment if their reasons rested on plainly mistaken beliefs, since the objective fact of survival would outweigh the subjective reason. The third feature, limits on binding, might remain under either view but for different reasons. Under actual valuing, it remains because present desire rules. Under objective well-being, it remains because permanent binding might reduce overall well-being by preventing adaptation to new circumstances.

  In conclusion, the amendment before the committee attempts to refine our implicit theory by adding a condition of narrative continuity to the enforcement of past directives. It does not strictly require the indirect view of reasons, but it does require a view that values the coherence of the agent over time more than the snapshot of desire at any single moment. The three features of our practice are consistent if we understand them as protecting the integrity of the competent self across time, acknowledging that sometimes the past self is the competent one, sometimes the present self is, and sometimes the bond between them is too weak to enforce binding commitments. The amendment seeks to identify those moments where the bond is strong enough to allow the present self to reclaim authority, even from within an episode. I believe this is a defensible refinement, provided we remain vigilant that the ability to reconstruct reasoning is not merely a parrot-like repetition but evidence of genuine cognitive grip. If we can ensure that distinction, the amendment strengthens rather than confuses our ethical framework.

  Best regards,

  Your Colleague
