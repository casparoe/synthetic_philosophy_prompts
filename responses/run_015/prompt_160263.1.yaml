  4. Rational-Choice Sociologist: "If these rules fix which considerations count as reasons, why do agents follow them when deviating would yield higher material payoffs without sanction?" Concede external sanctions are sometimes weak, hold that internalized shame operates as a psychic cost within the utility function, weakest point is specifying that cost without making the theory tautological.

