      *   *Inter-theoretic Comparison:* How do we compare "1 unit of utility" in Utilitarianism vs. "1 duty fulfilled" in Deontology? This is the "scaling problem."
      *   *Infinite/Lexicographic Values:* How to handle rights as side-constraints vs. costs.
