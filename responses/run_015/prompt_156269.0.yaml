answer: |-
  Here is the conceptual specification for a decision procedure under normative (moral) uncertainty. This is structured as a set of desiderata—conditions of adequacy that a robust metanormative theory should satisfy—along with the known tension points where these conditions conflict.

  ### 1. Foundational Distinctions
  Before listing the desiderata, the procedure must distinguish between two types of uncertainty. A decent spec cannot conflate them.

  *   **Empirical Uncertainty:** Uncertainty about the state of the world or the consequences of an action (e.g., "Will this donation save a life?").
      *   *Requirement:* The procedure must treat this using standard probability theory.
  *   **Normative Uncertainty:** Uncertainty about which moral theory is correct or how values should be weighed (e.g., "Do consequences matter more than rights?").
      *   *Requirement:* The procedure must treat this distinctively because moral theories often lack a common currency. You cannot simply average "duties fulfilled" with "utils produced" without a conversion metric.

  ### 2. Core Rationality Constraints (Non-Negotiables)
  These are the baseline requirements for the procedure to count as a *decision* procedure rather than a philosophical shrug.

  *   **Dominance:** If every moral theory in your credence distribution ranks Action A higher than Action B, the procedure must not recommend Action B.
  *   **Non-Idleness:** The procedure must output a recommendation (or a permissible set) even when theories conflict. It cannot simply return "Resolve your moral uncertainty first."
  *   **Credence Sensitivity:** If your credence in Theory A shifts from 10% to 90%, the recommendation should shift accordingly. A procedure that ignores credence (e.g., "Follow the theory with the highest stakes regardless of probability") fails this.
  *   **Continuity:** Small changes in credence or value assessments should not result in discontinuous, chaotic flips in recommendation (unless the underlying theories themselves are lexicographic).

  ### 3. The Inter-Theoretic Comparison Problem (The Scaling Spec)
  This is the hardest technical hurdle. Theory A might use a 0–10 scale; Theory B might use an unbounded scale.

  *   **Normalization:** The procedure requires a method to normalize the "choice-worthiness" functions of different theories onto a common scale.
      *   *Desideratum:* **Scale Invariance.** The recommendation should not change simply because one theory expresses its values in "milli-utils" instead of "utils."
      *   *Desideratum:* **Variance Sensitivity.** Theories that care *more* (have higher variance in value across options) should arguably have more influence than theories that are indifferent to everything.
  *   **The Collapse Risk:** The procedure must not implicitly privilege one meta-ethical structure. For example, using "Expected Value Maximization" as the meta-procedure implicitly assumes consequentialism is the correct meta-ethic. A neutral procedure must accommodate deontological constraints without forcing them into a consequentialist calculus.

  ### 4. Handling Infinite and Lexicographic Values
  You specifically asked about the clash between aggregative views (consequentialism) and constraint-based views (deontology/rights).

  *   **The Infinity Problem:** If Theory A assigns $-\infty$ value to a rights violation, and Theory B assigns a finite cost, any non-zero credence in Theory A mathematically dominates the calculation.
      *   *Desideratum:* **Lexicographic Respect.** If there is non-zero credence in a theory with absolute constraints, the procedure should arguably veto actions violating those constraints.
      *   *The Trade-off:* If you satisfy **Lexicographic Respect**, you risk **Paralysis**. If you have >0% credence in *any* theory with absolute constraints (and there are many conflicting ones), you may be unable to act.
      *   *The Alternative:* **Truncation.** The procedure artificially caps infinite values to make them comparable.
      *   *The Cost:* This violates **Theory Integrity**. It fundamentally misrepresents the deontological theory, which says the constraint is *absolute*, not just "very high."
  *   **Spec Requirement:** The procedure must explicitly state whether it allows infinite values to dominate finite ones under uncertainty. There is no neutral solution here; you must choose between **Paralysis** (respecting the infinity) or **Distortion** (capping the infinity).

  ### 5. Incommensurability and Silence
  Sometimes theories don't just use different scales; they disagree on what *counts* as a value.

  *   **The Problem:** Theory A cares about welfare; Theory B cares about autonomy. There may be no fact of the matter on how much welfare trades for how much autonomy.
  *   **Desideratum:** **Handling Structural Incompatibility.**
      *   *Option A (Myopic):* Compare theories only on dimensions they share. (Risk: Ignores the unique concerns of each theory).
      *   *Option B (Silence):* If theories are truly incommensurable, the procedure returns "No Fact of the Matter."
      *   *Requirement:* The procedure must define a threshold for when incommensurability forces silence versus when it forces a "best guess."

  ### 6. Uncertainty Sensitivity and Polarization
  You asked about the "reverse problem": does becoming more uncertain make recommendations more extreme?

  *   **Moral Hedging:** Standard models suggest uncertainty should make you more cautious (choosing the option that is "okay" across most theories).
      *   *Desideratum:* **Risk Neutrality.** The meta-procedure should not impose risk-aversion unless the object-level theories require it. If all your candidate theories are risk-neutral, the meta-procedure should be too.
  *   **The Polarization Risk:** In some models (specifically those focusing on "permissibility" rather than "value"), increasing uncertainty expands the set of permissible actions.
      *   *Scenario:* If Theory A says "Only X is allowed" and Theory B says "Only Y is allowed," a permissibility model might say "X and Y are both permissible" under uncertainty.
      *   *Desideratum:* **Non-Expansion of Permissibility.** Ideally, moral uncertainty should not make *more* things permissible than the union of the individual theories allows. It should generally restrict choice (hedging), not expand it (licensing).
  *   **Extremism:** Does high uncertainty lead to picking the "long shot" theory with the highest potential payoff?
      *   *Requirement:* The procedure must guard against **Pascal's Mugging** in moral space. You cannot allow a theory with 0.0001% credence to dictate action just because it posits infinite value.

  ### 7. Population Ethics as Normative Uncertainty
  Is being unsure between Total Utilitarianism and Average Utilitarianism the same as being unsure between Utilitarianism and Deontology?

  *   **Structural vs. Normative:** Population ethics often involves structural differences (how value scales with N) rather than axiological differences (what is good).
      *   *Desideratum:* **Variable Population Handling.** The procedure must handle cases where the *number* of subjects affected is part of the uncertainty.
      *   *The Trap:* If you treat Total and Average views as standard normative uncertainty, you face the **Repugnant Conclusion** risk within the meta-theory. If you assign 50% credence to Total Utilitarianism, you might be forced to accept outcomes that the Average view finds abhorrent, simply due to the math of expectation.
      *   *Requirement:* The procedure should distinguish between uncertainty about *values* (good vs. right) and uncertainty about *structure* (how to aggregate across populations). They may require different normalization techniques.

  ### 8. Impossibility Results and Trade-Offs
  You need to flag where the spec breaks. There are formal results suggesting you cannot satisfy all desiderata simultaneously.

  *   **The Trilemma:** You generally cannot satisfy all three of the following:
      1.  **Credence Sensitivity:** Recommendations change with probability.
      2.  **Theory Integrity:** The internal logic of each moral theory is preserved (e.g., infinities stay infinite).
      3.  **Action Guidance:** The procedure always yields a definite recommendation.
      *   *Implication:* Any workable procedure must sacrifice one. Most sacrifice **Theory Integrity** (by normalizing infinities) or **Action Guidance** (by allowing "no decision").
  *   **The Meta-Ethical Bias:** Any procedure that aggregates values (like Expected Choiceworthiness) implicitly assumes a consequentialist meta-ethic.
      *   *Requirement:* The spec must acknowledge that a truly neutral procedure might be impossible. The "decision procedure" itself is a moral commitment.

  ### 9. EA Preferences vs. General Ethics
  Distinguish what is required for rationality versus what is specific to Effective Altruism (EA) or similar movements.

  *   **EA Preference:** **Maximization.** The goal is to do the *most* good. This pushes toward Expected Value Maximization.
  *   **General Ethics Requirement:** **Satisficing / Integrity.** Many non-EA theories care about agent integrity, not just outcome maximization.
      *   *Desideratum:* **Agent-Centric Constraints.** The procedure should allow for "options" (supererogation) where an agent is permitted to do less than the theoretical maximum to preserve personal integrity.
      *   *Conflict:* If you build in **Agent-Centric Constraints**, you violate **Impartiality** (a core EA tenet). If you enforce **Impartiality**, you violate **Integrity** (a core Deontological/Virtue Ethics tenet).
  *   **Spec Note:** A general seminar paper should treat **Maximization** as a contingent feature, not a necessary one. The procedure should work for a satisficer as well as a maximizer.

  ### Summary Checklist for the Paper
  If you are evaluating a decision procedure, check it against these flags:

  1.  **Does it normalize?** How does it compare utils to duties?
  2.  **Does it cap infinities?** If yes, it distorts deontology. If no, it risks paralysis.
  3.  **Does it hedge?** Does uncertainty lead to caution or polarization?
  4.  **Is it structurally neutral?** Does it secretly assume consequentialism in its aggregation method?
  5.  **Does it handle population variance?** Can it deal with uncertain existence?
  6.  **Where does it fail?** Which impossibility theorem does it run afoul of?

  This map should allow you to locate the arguments without needing to track down specific authors. The core tension is always between **respecting the internal logic of the uncertain theories** and **producing a workable decision rule for the uncertain agent.**
