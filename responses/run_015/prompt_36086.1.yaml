answer: |-
  The principle that captures your verdicts is that emotions are episodic, object-directed responses, which classifies your two uncertain cases as emotions but identifies your verdict on regret as the one I would overturn first if forced to choose.

  This principle of intentionality sorts your data cleanly: the snake, spider, Milky Way, seaweed, and retracted paper all serve as specific objects directing your state, distinguishing them from the non-directed background of irritability (mood) and the non-intentional arousal of caffeine (physiology). Surprise fits because it is directed at the unexpected event itself, regardless of value, and the harmless spider fits because object-directedness does not require accurate belief about the object's threat level, only the engagement with it. Applied to your uncertain cases, embarrassment at blushing is an emotion because it is directed at the social object of your exposed self, and being moved by sentimental music is an emotion because the feeling is directed at the music, where knowing it is sentimental subtracts nothing from the engagement just as knowing the spider is harmless subtracts nothing from the fear.

  I would bet against your verdict that regret is an emotion, because your description ("nothing more than the judgment... plus a taste") sounds more like a cognitive assessment than the visceral, embodied response seen in your snake or spider cases. To move me to the other side and keep regret in the category, you would need to identify a specific somatic marker or involuntary physiological pull associated with the regret that persists even when you suspend the active judgment that the career change was a mistake.
