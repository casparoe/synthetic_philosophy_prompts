  MINISTRY OF ONTOLOGICAL AFFAIRS
  CIVIL CODE 88-OMEGA: PREDICTIVE STANCE REGISTRATION AND PATTERN VALIDATION

  All citizens are hereby notified of their obligations under the current administrative cycle.

  1.0 CERTIFICATION OF REAL PATTERNS
  1.1 Pursuant to the Ontological Efficiency Act, a pattern shall be recognized as legally real only if it affords significant data compression exceeding baseline noise levels within the national predictive manifold in accordance with Section 5 of the National Data Act.
  1.2 Citizens must demonstrate that the identified pattern supports robust counterfactual projectibility. Patterns failing to generate accurate conditional predictions regarding future states under varying initial conditions shall be administratively downgraded to "Mere Appearance" status.
  1.3 Mere Appearance status revokes all protected legal standing. Entities categorized as Mere Appearances cannot be cited in civil testimony as causal agents, nor can they be used to justify exemption from regulatory compliance. Violations may result in perjury charges.
  1.4 Annual renewal of Pattern Certification is required to ensure continued compressive utility.

  2.0 MANDATORY STANCE ALLOCATION
  2.1 The Physical Stance is reserved for interactions governed exclusively by fundamental forces and particle physics, including but not limited to quarks, leptons, and bosonic fields. Usage is mandatory for subatomic litigation but strictly prohibited for macroscopic artifact explanation unless mechanical failure is indeterminable via higher-level stances.
  2.2 The Design Stance applies to artifacts and biological organs where function is evolved or engineered. Citizens must attribute functional purpose to hearts, kidneys, and microchips without referencing internal computational states or mental content.
  2.3 The Intentional Stance is restricted to entities whose behavior is optimally anticipated by attributing beliefs, desires, and rationality. Adoption requires a Class-C Predictive License verified by annual examination. License holders must renew certification every twenty-four months.
  2.4 Attempting to adopt the Intentional Stance toward non-human animals without a valid License constitutes a Class B Misdemeanor punishable by mandatory re-education in evolutionary biology.
  2.5 Rationality assumptions must be calibrated to the entity's evolutionary niche; attributing human economic rationality to canines is prohibited.

  3.0 FISCAL COMPLIANCE AND DOUBLE-BOOKKEEPING
  3.1 A Stance-Redundancy Tax is levied when a citizen utilizes a lower-level stance to explain phenomena already predicted with sufficient accuracy by a higher-level stance.
  3.2 Example: Explaining a laptop failure via electron flow (Physical) when software malfunction (Design) suffices will incur a fine proportional to the computational waste and time loss incurred by the state auditor. Auditors will assess the bit-cost differential between the chosen stance and the optimal stance.
  3.3 Ontological Double-Bookkeeping is prohibited. Citizens may not simultaneously register an entity under both Design and Intentional categories unless independent predictive utility is demonstrated for each stance in separate, non-overlapping contexts.
  3.4 As noted in Affidavit 992-K: "I was fined for treating my spouse as a rational agent during tax season, but the Ministry ruled their financial behavior was purely mechanistic. I am now required to file a Design Stance waiver for all domestic negotiations." This ruling stands despite prior marital agreements.
  3.5 Waivers must be filed prior to engagement in complex social transactions.

  4.0 FAILED-PREDICTION REVOCATION PROTOCOLS
  4.1 If a registered stance consistently fails to predict entity behavior over a fiscal quarter, the citizen's registration to use that stance is immediately suspended. Suspension remains in effect until a new predictive model is submitted and validated by a certified ontologist.
  4.2 The nature of the entity remains ontologically unchanged; only the citizen's predictive license is revoked pending recalibration.
  4.3 Footnote 4.1.B: A thermostat denied Intentional Stance registration may still be explained via the Design Stance if its thermal behavior is functionally predictable, provided no beliefs are imputed to the heating element. Intentional attribution to non-sentient devices is a violation of Consumer Protection Statute 12.
  4.4 Repeated failure to update stance registration following predictive errors constitutes Ontological Negligence and may result in revocation of citizenship predictive privileges.
  4.5 Appeals must be based on improved compression ratios, not metaphysical assertion.

  The state does not determine what exists, but it strictly penalizes inefficient ways of talking about what exists.
