answer: |-
  Here is the translation of Condorcet's Jury Theorem (CJT) into your diagnostic vocabulary, followed by the residue report on your five hypotheses.

  ### Part 1: The Translation
  **Condorcet's Jury Theorem in Diagnostic Test Evaluation Terms**

  **1. The True State ($D$)**
  There exists a binary latent variable $D \in \{0, 1\}$ (e.g., Disease Absent/Present). In the political analogy, this is the "correct" decision or policy (e.g., "Guilty/Innocent" or "Policy A is better than Policy B").
  *Constraint:* The theorem assumes $D$ exists objectively prior to measurement.

  **2. The Voters as Assays ($T_i$)**
  Each voter $i$ is a diagnostic test yielding a binary result $T_i \in \{0, 1\}$.
  *   **Competence ($p$):** This maps to the probability of correct classification. In the basic theorem, sensitivity and specificity are assumed symmetric and identical for all tests: $P(T_i=1|D=1) = P(T_i=0|D=0) = p$.
  *   **Assumption:** $p > 0.5$. Each assay is weakly informative (better than random chance).

  **3. The Independence Assumption**
  Test results are conditionally independent given the true disease status:
  $$P(T_1, \dots, T_n | D) = \prod_{i=1}^n P(T_i | D)$$
  In your terms: There is no correlated error. No shared reagent batch, no common environmental interference, no spectrum bias affecting all tests simultaneously. Errors are idiosyncratic (random noise), not systematic.

  **4. The Combining Rule (Majority Vote)**
  The composite reference standard is a $k$-of-$n$ rule where $k = \lfloor n/2 \rfloor + 1$.
  *   If $\sum T_i > n/2$, the composite diagnosis is $D=1$.
  *   If $\sum T_i \le n/2$, the composite diagnosis is $D=0$.

  **5. The Limit Result (Consistency)**
  As the number of tests $n \to \infty$, the posterior probability of error for the composite standard approaches zero:
  $$P(\text{Composite} \neq D) \to 0$$
  Provided $p > 0.5$ and conditional independence holds. Adding more weakly informative, independent assays drives the false classification rate to zero.

  **6. The Failure Mode (Correlated Error)**
  If the conditional independence assumption is violated (e.g., all assays rely on the same biological pathway or share a systematic bias), the effective information content is much lower than $n$ suggests. The variance of the composite estimator does not shrink as $1/n$. You get a high-precision result that is systematically inaccurate (high confidence, low validity).

  ***

  ### Part 2: The Residue Report
  Here is the evaluation of your five guesses. I have flagged which are robust analogies, which require distorting the diagnostic framework, and which indicate a category error.

  #### 1. The "No Gold Standard" Problem
  **Your Guess:** *Inferring competence from agreement is circular, similar to no-gold-standard accuracy studies.*
  **Verdict:** **Real Residue (but you have the tools to see why).**

  In diagnostic testing, when you lack a gold standard, you use Latent Class Models (LCM). To identify the parameters (Se, Sp, and prevalence) from the data alone, you *must* impose constraints. The standard constraint is conditional independence.
  *   **The Analogy:** If you try to estimate voter competence ($p$) solely from the vote tally without an external truth, you are running an LCM.
  *   **The Trap:** LCMs are notoriously fragile. If you assume conditional independence when errors are actually correlated (common cause), the model will overestimate $p$ and overestimate the certainty of the latent class assignment.
  *   **The Difference:** In diagnostics, we acknowledge this is an *estimation* problem with uncertainty. In the epistemic argument for democracy, $p > 0.5$ is often asserted as a *premise*, not estimated from the vote. If you estimate $p$ from the consensus, then use that $p$ to justify the consensus, you are indeed circular unless you have an external anchor (a "gold standard" truth) to validate the competence initially.
  *   **Conclusion:** Your intuition is correct. Without an external reference standard, claiming the majority is correct *because* they agree is statistically identical to assuming conditional independence in a latent class model. If voters are correlated (influenced by the same media, culture, rhetoric), the "accuracy" is inflated.

  #### 2. Fact of the Matter vs. Normative Choice
  **Your Guess:** *My framework assumes a fact of the matter; voting often decides what we should do, not what is true.*
  **Verdict:** **Category Error (The Analogy Breaks).**

  *   **Diagnostic View:** Disease status is ontological. It exists regardless of the test. The test discovers; it does not create.
  *   **Political View:** Many votes are not about discovering a pre-existing $D$. They are about *constructing* $D$. If we vote on "Should we build the dam?", there is no biological reality of "Dam-Building-Truth" waiting to be found. The vote *makes* it true.
  *   **The Residue:** CJT requires a truth-apt proposition. It works for "Did the defendant commit the crime?" (factual). It fails for "Is this tax rate just?" (normative).
  *   **Conclusion:** This is the hardest limit. You cannot calculate sensitivity/specificity against a reference standard that does not exist. If the "truth" is created by the vote, the concept of "error" (False Positive/Negative) becomes undefined. You can only speak of satisfaction or preference aggregation, not diagnostic accuracy.

  #### 3. Equal Weighting vs. Likelihood Ratios
  **Your Guess:** *I weight evidence by LR; the theorem gives every voter the same vote.*
  **Verdict:** **Distortion (Theorem is suboptimal by diagnostic standards).**

  *   **Diagnostic View:** If Test A has LR+ = 10 and Test B has LR+ = 2, you weight A more heavily. To minimize error, you should sum log-likelihoods and threshold.
  *   **CJT View:** The *basic* theorem assumes homogeneous competence ($p_i = p$). Under this constraint, majority rule is optimal.
  *   **The Extension:** There is a "Weighted Jury Theorem." If competences vary ($p_i \neq p_j$), the optimal combining rule weights votes by $\log(\frac{p_i}{1-p_i})$ (the log-likelihood ratio of the voter).
  *   **The Residue:** Democracy insists on "one person, one vote" (equal weighting) for normative reasons (equality). Diagnostic testing insists on "one likelihood, one weight" for epistemic reasons (accuracy).
  *   **Conclusion:** The epistemic argument for *simple* majority rule only holds if you assume all voters have identical competence. If competence varies (which it does), simple majority is epistemically inferior to weighted voting. The analogy reveals that democracy sacrifices epistemic efficiency for political equality.

  #### 4. Asymmetric Costs (FP vs. FN)
  **Your Guess:** *Once costs are asymmetric, the optimal rule isn't a bare majority.*
  **Verdict:** **Real Residue (Accuracy $\neq$ Utility).**

  *   **Diagnostic View:** You choose a cut-off based on the cost function $C$. If $Cost(FN) \gg Cost(FP)$, you lower the threshold (high sensitivity). You do not aim for minimum *error rate*; you aim for minimum *expected loss*.
  *   **CJT View:** The theorem proves convergence to the *truth*, not convergence to the *best outcome*.
  *   **The Residue:** Even if the jury correctly identifies the truth ($D=1$), the decision might be to treat as $D=0$ because the treatment is too risky.
  *   **Conclusion:** CJT justifies majority rule as a *truth-tracking* device. It does not justify it as a *utility-maximizing* device. If the cost of a False Positive (e.g., starting a war) is vastly higher than a False Negative (e.g., missing an opportunity), the optimal decision rule is a supermajority or veto system, not a simple majority. The theorem survives as a claim about *accuracy*, but fails as a claim about *governance optimality*.

  #### 5. Fairness and Legitimacy
  **Your Guess:** *Nothing in my vocabulary says being outvoted is fair, or that the majority owes the loser anything.*
  **Verdict:** **Major Gap (Instrumental vs. Constitutive).**

  *   **Diagnostic View:** A test result is instrumental. If the test says you have the disease, the test does not owe you an explanation, nor is it "unfair" that you tested positive while your neighbor tested negative. Validity is the only virtue.
  *   **Political View:** Legitimacy is constitutive. Being outvoted requires a justification beyond "we were more accurate." It requires procedural fairness, rights protection, and the possibility of future reversal.
  *   **The Residue:** The epistemic argument says "Obey the majority because they are likely right." This is a technocratic claim. It offers no account of why the minority should accept the result if they believe the "independence assumption" was violated (e.g., "They are all brainwashed").
  *   **Conclusion:** This is the largest gap. Diagnostic testing has no concept of *legitimacy*, only *validity*. If you use CJT to argue for democracy, you are arguing for an **epistocracy** (rule of the knowers), not necessarily a democracy. To get to "fairness," you must import normative philosophy that has no expression in sensitivity/specificity. The theorem explains why the majority might be *smart*, not why they are *just*.

  ### Summary for your Reading Group
  You can tell them:
  1.  **Technically:** The theorem holds up as a specific case of combining conditionally independent diagnostic tests with symmetric error rates.
  2.  **Statistically:** It fails if errors are correlated (common cause), which is the norm in social systems (shared information environments).
  3.  **Epistemically:** It assumes a pre-existing truth (Disease Status) which often doesn't exist in policy.
  4.  **Decision-Theoretically:** It minimizes error rate, not expected loss (costs), so it doesn't justify simple majority when risks are asymmetric.
  5.  **Normatively:** It justifies accuracy, not legitimacy. It argues for the *wisdom* of the crowd, not the *rights* of the minority.

  Your diagnostic framework is actually *more* rigorous than the standard philosophical presentation because it forces the assumptions (independence, gold standard, cost symmetry) into the open where they can be tested.
