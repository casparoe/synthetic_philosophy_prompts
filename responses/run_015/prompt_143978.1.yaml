prompt: |-
  I work in diagnostic test evaluation — I spend my days with sensitivity and specificity, likelihood ratios, ROC curves, conditional independence of test results given true disease status, composite reference standards, and estimating accuracy when there's no gold standard (latent class / EM-type approaches). Pretty fluent in that, basically no philosophy background.

  Someone in a reading group is presenting Condorcet's jury theorem as part of an epistemic argument for democracy and I said I'd respond, so help me get it right: restate the theorem and the argument people build on it as carefully as you can in my vocabulary. I mean quite literally — a voter as a binary test for which of two options is correct, competence p as accuracy, the independence assumption as conditional independence of errors given the true state, majority rule as a k-of-n combining rule, the limit result as posterior error probability going to zero as you add weakly informative tests, and dependence between voters as the correlated-error / common-cause failure problem that makes two assays for the same analyte much less informative than multiplying error rates suggests. Don't quietly smuggle in assumptions from my side and call it a translation.

  Then the part I actually care about, the residue report: what translates cleanly, what only fits if I distort it, and what has no expression in my vocabulary at all. My guesses, which I'd rather you argue with than definately agree with: (1) I can only measure a test against a reference standard, and in an election there usually isn't one, so where does an estimate of voter competence come from, and is inferring it from how much voters agree with each other any different from what we do in no-gold-standard accuracy studies — circular in the same way, or not? (2) my whole framework assumes a fact of the matter, but a lot of what gets voted on is a question of what we should do rather than what is true. (3) I weight evidence by likelihood ratio, and the theorem gives every voter the same vote. (4) I always have separate costs for false positives and false negatives, and once those are asymmetric the optimal rule isn't a bare majority, so does the "majority rule is epistemically best" conclusion survive that or just move somewhere else? And (5) nothing in my vocabulary can say that being outvoted is still fair, or that the majority owes the loser anything — is that a gap in diagnostic testing, or a sign that the theorem was never doing the political work people want it to do? Tell me which of these are real residues and which are just me forcing the analogy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Diagnostic test evaluation expert. Fluent in sensitivity, specificity, likelihood ratios, ROC, conditional independence, latent class models, no-gold-standard methods. No philosophy background.
      *   **Task:**
          1.  Restate Condorcet's Jury Theorem (CJT) and the epistemic argument for democracy *strictly* in diagnostic testing vocabulary (tests, accuracy, independence, combining rules, etc.).
          2.  Provide a "residue report": Analyze what translates well, what distorts, and what is missing.
          3.  Address 5 specific hypotheses/guesses the user has about the limitations of the analogy.
      *   **Constraint:** "Don't quietly smuggle in assumptions from my side and call it a translation." (Be careful not to conflate the domains while translating).
      *   **Tone:** Professional, precise, analytical, respectful of the user's expertise.

  2.  **Part 1: Translation (CJT in Diagnostic Vocabulary):**
      *   *Concept:* Two alternatives (Correct/Incorrect) $\rightarrow$ Disease Present/Absent (Binary State $D \in \{0, 1\}$).
      *   *Concept:* Voter $\rightarrow$ Diagnostic Test/Assay.
      *   *Concept:* Vote $\rightarrow$ Test Result (Positive/Negative).
      *   *Concept:* Competence ($p > 0.5$) $\rightarrow$ Sensitivity/Specificity (assume symmetric for simplicity first, or average accuracy). Let's call it "Probability of Correct Classification" ($P(Test = D | D)$).
      *   *Concept:* Independence $\rightarrow$ Conditional Independence of test results given the true disease status ($P(T_1, T_2 | D) = P(T_1|D)P(T_2|D)$).
      *   *Concept:* Majority Rule $\rightarrow$ $k$-of-$n$ combining rule (specifically $k = \lfloor n/2 \rfloor + 1$).
      *   *Concept:* Jury Theorem Limit $\rightarrow$ As $n \to \infty$, Posterior Probability of Error $\to 0$ (assuming $p > 0.5$).
      *   *Concept:* Correlated Errors $\rightarrow$ Violation of conditional independence (common cause failure, shared reagent batch, etc.), leading to inflated confidence in the composite result.

      *Drafting the translation:* Need to be rigorous. Use $D$ for truth, $V_i$ for voter/test. $p$ is accuracy.
      *   *Crucial nuance:* In diagnostics, we usually estimate Se/Sp against a reference. In CJT, $p$ is assumed known or fixed. I need to state the theorem *as stated*, not necessarily how we estimate it yet.

  3.  **Part 2: The Residue Report (Addressing the 5 Guesses):**
      *   *Guess 1: No Reference Standard / Circularity.*
          *   *Diagnostic view:* We use Latent Class Models (LCM) when no gold standard exists. We assume conditional independence to identify parameters.
          *   *CJT view:* CJT assumes $p > 0.5$ is *true*, not estimated from the vote itself.
          *   *Analysis:* If we estimate $p$ from the agreement of the voters *without* an external truth, we are doing LCM. LCM requires identification assumptions (usually conditional independence). If voters are correlated, LCM fails (just like diagnostic tests). So, yes, it's circular *if* you try to derive $p$ solely from the vote consensus without prior structural assumptions.
          *   *Verdict:* Real residue. The "truth" in elections is often ontological, not just latent.

      *   *Guess 2: Fact of the Matter vs. Normative Choice.*
          *   *Diagnostic view:* Disease status exists (biological reality).
          *   *Political view:* "Best policy" isn't always a pre-existing fact.
          *   *Analysis:* This is the "Truth vs. Value" problem. CJT requires a binary state $D$. If $D$ is "Is this policy just?", does $D$ exist independently of the vote?
          *   *Verdict:* Real residue. Diagnostic testing collapses if the disease doesn't exist. Democracy often decides what *becomes* true (constructivist).

      *   *Guess 3: Equal Weighting vs. Likelihood Ratios.*
          *   *Diagnostic view:* We weight tests by LR. A high-Se/Sp test counts more.
          *   *CJT view:* One person, one vote.
          *   *Analysis:* CJT *can* be generalized to weighted voting (optimal weights $\propto \log(LR)$). The basic theorem assumes identical $p$. If $p_i$ varies, majority rule is suboptimal compared to weighted likelihood summation.
          *   *Verdict:* Distortion. The theorem holds for identical tests, but diagnostic practice prefers weighted combinations. Democracy insists on equal weight for normative reasons, conflicting with epistemic optimality.

      *   *Guess 4: Asymmetric Costs (FP vs. FN).*
          *   *Diagnostic view:* Cut-off depends on cost ratio.
          *   *CJT view:* Simple majority minimizes *error rate*, not *cost*.
          *   *Analysis:* If Cost(FN) >> Cost(FP), the threshold $k$ should shift. CJT says majority converges to truth. It doesn't say majority maximizes utility.
          *   *Verdict:* Real residue. Epistemic accuracy $\neq$ Decision utility.

      *   *Guess 5: Fairness and Legitimacy.*
          *   *Diagnostic view:* A false negative is a tragedy, not an injustice. The test doesn't owe the patient an explanation.
          *   *Political view:* Being outvoted requires legitimacy/fairness, not just accuracy.
          *   *Analysis:* Diagnostic testing is purely instrumental (find the truth). Politics is constitutive (we govern ourselves).
          *   *Verdict:* Major gap. This is where the "epistemic argument for democracy" fails if it relies *only* on CJT. CJT justifies accuracy, not legitimacy.

  4.  **Review and Refine:**
      *   *Check Constraint:* Did I smuggle philosophy? I need to keep the translation strictly in terms of $P(T|D)$, independence, etc.
      *   *Check Tone:* Ensure I'm challenging the user's guesses where appropriate (e.g., on the weighting issue, weighted CJT exists).
      *   *Check "No Gold Standard":* Make sure to distinguish between *assuming* $p>0.5$ (CJT) vs. *estimating* $p$ (LCM). This is a key technical distinction.
      *   *Refining Guess 1:* In LCM, we need constraints to identify parameters. Usually conditional independence. If we use the consensus to estimate $p$, and then use $p$ to justify consensus, that's circular *unless* we have an external anchor. In politics, the "external anchor" is the problematic part.
      *   *Refining Guess 3:* Be precise. Basic CJT assumes homogeneous competence. Heterogeneous competence requires weighted voting for optimality. Democracy rejects weighted voting. This is a tension between *epistemic optimality* and *political equality*.

  5.  **Final Polish:** Organize clearly. Section 1: The Translation. Section 2: The Residue Report (addressing the 5 points). Ensure the diagnostic terminology is used correctly (Se/Sp, LR, LCM, etc.).

      *(Self-Correction during drafting)*: Wait, in diagnostics, Se and Sp can differ. CJT usually assumes symmetric error ($p$ for both states). I need to note this simplification in the translation. If Se $\neq$ Sp, simple majority is biased. I should mention this in the translation or the residue. Let's put it in the translation as a simplifying assumption required for the basic theorem.

      *(Self-Correction on Guess 1)*: The user asks if inferring competence from agreement is like no-gold-standard studies. Yes, it's exactly Latent Class Analysis. But LCM needs the independence assumption to work. If voters are correlated (common cause), LCM overestimates accuracy. This maps perfectly to the "correlated error" problem in diagnostics. I should emphasize this parallel.

      *(Self-Correction on Guess 5)*: This is the strongest point. Diagnostic testing has no concept of "legitimacy." It only has "validity." I need to make sure this distinction is sharp.

  6.  **Final Output Structure:**
      *   **Introduction:** Acknowledge expertise.
      *   **Section 1: The Translation:** Rigorous mapping of CJT to Diagnostic Terms.
      *   **Section 2: The Residue Report:** Systematic evaluation of the 5 guesses.
      *   **Conclusion:** Summary of where the analogy holds and breaks.

  7.  (Mental Check of Vocabulary):
