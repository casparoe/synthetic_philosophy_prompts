      *   *Key Distinction:* HD is the *math* of the preference change. Akrasia is the *experience* of acting against judgment.
      *   *Refining the "Routing Around" point:* If you bypass a blocker, that's your 1am self valuing the scroll *more* than the penalty. That's HD. But the feeling of "I shouldn't" is Akrasia. The roommate is right that the distinction matters for *solution design*.

  7.  **Self-Correction/Nuance Check:**
