answer: |-
  This is a classic LessWrong dorm-room debate, and honestly, the confusion is warranted because the rationalist community itself has shifted how it uses these terms over the last 15 years.

  Here is the short answer: **Your roommate is right that the distinction matters for fixing the problem, but you are right that they often show up wearing the same clothes.**

  In the rationalist toolkit, **Hyperbolic Discounting** is a model of *preferences*, while **Akrasia** is a description of *action relative to judgment*.

  Here is the breakdown of your two scenarios, why the distinction changes how you fix your sleep schedule, and what "Akrasia" actually points to in a CFAR/LessWrong context.

  ### 1. Mapping Your Scenarios

  **Version A: The Guilt Scroll**
  *   **The State:** It is 1am. You believe "Sleep is best." You want to sleep (in a deliberative sense). You scroll anyway. You feel guilt.
  *   **The Label:** This is **Akrasia** (Weakness of Will).
  *   **The Mechanism:** You are acting against your *current* better judgment. Your System 2 (planner) and System 1 (doer) are in active conflict. System 1 is hijacking the motor controls despite System 2 holding the map.
  *   **Why it fits:** Akrasia requires that you hold a judgment *at the time of action* that contradicts the action.

  **Version B: The Preference Flip**
  *   **The State:** At noon, you plan to sleep. At 1am, you look at the phone and genuinely think, "You know what? Being groggy tomorrow is worth this video. I prefer this." No guilt.
  *   **The Label:** This is **Hyperbolic Discounting** (Time Inconsistency).
  *   **The Mechanism:** Your valuation function changed because the reward moved from "future" to "now." You are not acting against your *current* judgment; your *current* judgment simply disagrees with your *past* judgment.
  *   **Why it fits:** Hyperbolic discounting explains why preferences reverse over time without requiring a "failure of will." You are being perfectly rational according to your 1am utility function; your 1am utility function is just different from your 12pm one.

  ### 2. Can you have one without the other?

  **Yes.** This is why your roommate is right that they are different mechanisms.

  *   **Hyperbolic Discounting without Akrasia:** This is Version B. If you successfully convince yourself at 1am that the scrolling is actually the right choice (perhaps you rationalize that you need the decompression time), you are no longer akratic. You are just time-inconsistent. You have updated your belief to match your action.
  *   **Akrasia without Hyperbolic Discounting:** This is rarer but happens. Imagine you are scrolling not because the reward is *immediate*, but because you are anxious about tomorrow. You know scrolling won't help, the reward isn't even that good, but you do it to regulate emotion. You aren't discounting the future; you are avoiding pain in the present. This is often better modeled as **emotional avoidance** or **compulsion** rather than discounting.

  ### 3. Why the distinction matters for Precommitment

  You asked why blockers work sometimes and get routed around others. The model you use dictates the fix.

  **If it's Hyperbolic Discounting (The Roommate's Model):**
  *   **The Diagnosis:** Your 12pm Self and 1am Self are two different agents with different utility functions. 12pm Self wants health; 1am Self wants dopamine.
  *   **The Fix:** **Ulysses Contracts.** You must bind the future agent. Blockers, betting money, giving your password to a friend.
  *   **Why it fails (Routing Around):** If you bypass the blocker, it means your 1am Self values the scroll *more* than the cost of bypassing the blocker. The precommitment wasn't strong enough to outweigh the hyperbolic spike.
  *   **Strategy:** Increase the cost of bypassing. Make the blocker unbreakable (e.g., throw away the key, use a hardware lock).

  **If it's Akrasia (The "Willpower" Model):**
  *   **The Diagnosis:** There is a conflict within the *same* agent. Part of you wants sleep, part of you wants scroll, and the "scroll" part is winning despite the "sleep" part holding the judgment.
  *   **The Fix:** **Alignment/Integration.** If you just add more constraints (blockers), the akratic part of you will resent it and find a way around it (because the underlying desire isn't resolved).
  *   **Why it fails:** You set a blocker, but you sit there feeling miserable and eventually uninstall it. The "guilt" in Version A is the signal that your internal models are at war.
  *   **Strategy:** Debug the conflict. Why does the 1am self want to scroll? Is it tiredness? Loneliness? Fear of the day ending? If you address the *need* driving the scroll, the akrasia dissolves, and you don't need the blocker.

  ### 4. What is the "Rationalist Use" of Akrasia?

  In the old LessWrong days (Eliezer, 2009-2012), "Akrasia" was often used as a catch-all bucket for "Why don't I do the thing I know I should?" It was treated as an engineering problem: *How do we make the System 1 execution match the System 2 plan?*

  However, the modern rationalist/CFAR (Center for Applied Rationality) view has nuanced this. They distinguish between:

  1.  **False Akrasia (Preference Reversal):** You thought you wanted X, but now you want Y. (Hyperbolic Discounting).
      *   *Solution:* Precommitment or updating your plan to be realistic about your future energy levels.
  2.  **True Akrasia (Execution Failure):** You still want X, you know X is best, but you can't make your body do X.
      *   *Solution:* This is usually a "System 1 safety check." Your subconscious believes doing X is dangerous or painful.
      *   *Example:* You want to write your essay (System 2), but you scroll (System 1). System 2 says "It's safe." System 1 says "Writing is painful/rejection is possible/Scrolling is safe."
      *   *Fix:* You don't need a blocker; you need to make the writing feel safer or the scrolling less comforting (e.g., "urge surfing" or IFS techniques).

  ### 5. Applying this to your 2am Scrolling

  Here is how to use this debate to actually sleep earlier:

  **Step 1: The 1am Audit.**
  Next time you are scrolling at 1am, pause. Ask: *"Do I currently believe I should stop?"*
  *   **If Yes (Guilt):** You are in **Akrasia**. A blocker might help, but it will feel like a prison. You need to address the emotional drive. Are you avoiding tomorrow? Are you over-tired and unable to regulate impulse control? *Intervention:* Focus on emotional regulation or sleep hygiene, not just willpower.
  *   **If No (Preference Flip):** You are in **Hyperbolic Discounting**. You have genuinely decided the video is worth the grogginess. *Intervention:* You need **Precommitment**. You cannot trust your 1am self to make this decision. You must make the decision at 12pm irreversible.

  **Step 2: The Precommitment Test.**
  If you keep "routing around" your blockers, it suggests your 1am Self is smarter than your 12pm Self's constraints.
  *   *Rationalist move:* Acknowledge that 1am You is a different agent. Stop trying to negotiate with them.
  *   *Action:* Use a physical constraint. Plug your phone into a timed lockbox (K-Safe). Set it for 7am. 1am You cannot bypass this without destroying the box, which raises the cost high enough to defeat the hyperbolic spike.

  ### Summary
  *   **Hyperbolic Discounting** explains why your preferences change (Noon You vs. 1am You).
  *   **Akrasia** describes the experience of acting against your *current* judgment (1am You vs. 1am You).
  *   **Your Roommate is Right:** If it's discounting, bind your future self. If it's akrasia (internal conflict), heal the conflict.
  *   **The Rationalist Take:** "Akrasia" is usually a signal that your System 1 and System 2 are not aligned. Sometimes that's because of time discounting (fix with constraints), but often it's because System 1 is trying to protect you from something (fix with curiosity/therapy).

  If you are feeling guilt, it's Akrasia. If you are feeling justification, it's Discounting. Treat them differently.
