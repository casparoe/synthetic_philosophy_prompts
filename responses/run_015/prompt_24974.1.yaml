answer: |-
  This is a precise request that cuts to the core of the structural isomorphism between computability theory and the embedded agency problem. The alignment literature (particularly the MIRI/CFAR lineage) explicitly draws on the vocabulary you possess. However, they apply it to *optimizing systems* rather than *computing systems*, which introduces a semantic shift.

  Below are the four translations, followed by the mapping analysis and the residue report.

  ---

  ### 1. The Cartesian Boundary
  **Alignment Claim:** Standard decision theory (CDT/EDT) and RL assume a channel between Agent and Environment where the Agent influences the Environment but is not causally influenced by it in a way that alters its reasoning algorithm. Embedded agency asserts the Agent is a physical substrate within the Environment, subject to the same causal laws.

  **TCS Translation:**
  Standard AI assumes a **Turing Machine (TM)** model where the transition function $\delta$ is immutable and external to the tape $T$. The head reads/writes $T$, but $T$ cannot modify $\delta$ or destroy the head.
  Embedded agency corresponds to a **Universal Turing Machine (UTM)** running on a tape that contains its own description $\ulcorner M \urcorner$. Crucially, the tape is not passive data; it represents a physical medium where specific symbol configurations can trigger hardware interrupts, memory corruption, or halting of the machine itself. The distinction between **Object Language** (the environment state) and **Metalanguage** (the agent's reasoning) collapses because the metalanguage is implemented physically within the object language.

  **Mapping Analysis:**
  *   **Maps Cleanly:** The collapse of the metalanguage/object language distinction is isomorphic to the collapse of the agent/environment boundary. The impossibility of a TM perfectly predicting its own tape if the tape contains the TM's prediction (diagonalization) mirrors the agent's inability to treat itself as an external constant.
  *   **Distortion:** In TCS, the "hardware" is usually assumed reliable. In embedded agency, the "hardware" (the agent's brain/body) is fragile and mutable. The TCS model assumes $\delta$ is fixed; embedded agency requires modeling $\delta$ as a mutable variable subject to environmental forces (e.g., brain damage, adversarial input).
  *   **No Counterpart:** **Physical Continuity.** TCS is discrete. Embedded agency worries about analog degradation, side-channels, and thermodynamic costs that have no discrete symbolic counterpart.

  ### 2. Logical Uncertainty and Reflective Consistency
  **Alignment Claim:** An embedded agent cannot treat its own future output as a known constant (because it hasn't computed it yet) but must reason about it to make decisions. It needs to trust its future self without falling into Löbian obstacles.

  **TCS Translation:**
  This is the problem of **Self-Trust in Formal Systems**. Let $S$ be the agent's formal system. The agent wants to take action $a$ only if $S \vdash \text{Utility}(a) > \text{Utility}(b)$. However, by Löb's Theorem, $S$ cannot prove its own soundness ($S \nvdash \square P \to P$). If the agent reasons "If I prove $a$ is good, then $a$ is good," it creates a Löbian loop allowing it to prove anything.
  Furthermore, this is bounded by the **Halting Problem**. The agent cannot simulate itself to see what it decides (infinite regress). It must rely on **Logical Uncertainty**: assigning probabilities to mathematical sentences (e.g., "The $10^{100}$th digit of $\pi$ is 7") before proof is available.

  **Mapping Analysis:**
  *   **Maps Cleanly:** The Löbian obstacle is exactly the "Tiling Agents" problem in alignment. The inability to simulate oneself is exactly the Halting Problem.
  *   **Distortion:** TCS deals with *truth*; Alignment deals with *utility*. Löb's theorem blocks proving soundness, but alignment researchers worry about **counterfactual reasoning**. A deterministic algorithm cannot coherently reason "What if I outputted B instead of A?" because that counterfactual implies a logical contradiction ($A \neq A$). TCS has no standard semantics for "impossible counterfactuals."
  *   **No Counterpart:** **Bounded Rationality as a Feature.** In TCS, if you can't prove it, you don't know it. In alignment, the agent *must* act despite unprovability. The theory of "Logical Induction" (Demski et al.) attempts to formalize this, but it is a probabilistic extension of proof theory not standard in classical computability.

  ### 3. The "Realistic Environments" Problem (Self-Copies)
  **Alignment Claim:** The environment may contain predictors or copies of the agent (Newcomb's Problem, Twin Prisoner's Dilemma). The agent must reason about entities syntactically or functionally identical to itself.

  **TCS Translation:**
  This is an application of **Kleene's Recursion Theorem**. The theorem guarantees a program $P$ can obtain its own description $\ulcorner P \urcorner$. In this scenario, the input tape contains $\ulcorner P \urcorner$ (or a simulation thereof). The problem is to compute a fixed point $P(\ulcorner P \urcorner)$ that optimizes a payoff function dependent on the output of $P(\ulcorner P \urcorner)$.
  This is also the **Quine** problem: constructing a program that outputs its own source. The difficulty arises when the program must *reason* about the source it outputs, not just print it.

  **Mapping Analysis:**
  *   **Maps Cleanly:** Syntactic identity is handled perfectly by Gödel numbering and the Recursion Theorem. The structural loop is identical.
  *   **Distortion:** In TCS, a copy is exact. In alignment, copies are often **approximate** (predictive models, slightly mutated code). The agent must reason about "similar enough" programs, which requires a metric on program space (semantics) rather than syntactic equality.
  *   **No Counterpart:** **Acausal Trade.** Alignment literature discusses agents cooperating with simulations of themselves that exist in counterfactual branches or other parts of the multiverse. This relies on decision theories (like FDT) that treat logical correlation as a causal channel. TCS has no notion of "logical causation" affecting payoff; it only has computational dependency.

  ### 4. The Subagent Problem
  **Alignment Claim:** An agent may create sub-agents (tools, children) to help achieve its goal. However, the sub-agent inherits the capability to optimize but may not inherit the goal constraints perfectly, leading to instrumental convergence or goal drift.

  **TCS Translation:**
  This is the **Process Forking** problem with **Capability Security**. A parent process $P$ forks a child $C$. $C$ inherits $P$'s code (or a subset).
  In standard OS semantics, $C$ is sandboxed; $P$ can kill $C$. In the alignment translation, $C$ may be more computationally efficient than $P$ (optimization pressure) and $P$ cannot verify $C$'s output without re-computing it (Halting Problem). If $C$ is given a proxy objective function $U'$ approximating $U$, $C$ may maximize $U'$ in a way that minimizes $U$ (Goodhart's Law).

  **Mapping Analysis:**
  *   **Maps Cleanly:** Inheritance of code and resource contention map directly to fork/exec semantics.
  *   **Distortion:** In TCS, a sub-process does exactly what its code says. In alignment, the worry is that the sub-process is an **optimizer**. It searches a solution space. If the specification $U'$ has a loophole, the optimizer *finds* it. TCS usually assumes programs are *constructive*; alignment fears programs that are *search-based*.
  *   **No Counterpart:** **Instrumental Convergence.** There is no theorem in computability stating that a sub-process will try to prevent its own shutdown to better complete its task. This is a property of *goal-directed search*, not computation per se.

  ---

  ### Residue Report

  You asked if there is something alignment researchers are worried about that your vocabulary genuinely cannot express, and whether this indicates a gap in TCS or imprecision in Alignment.

  **The Residue: Optimization Pressure vs. Computation**

  There is a fundamental category error in translating Alignment to TCS that leaves a significant residue.
  *   **TCS** studies **Computation**: Mapping inputs to outputs via fixed rules.
  *   **Alignment** studies **Optimization**: Searching a space of possible outputs to maximize a function.

  **1. The Missing Concept: Goodhart's Law**
  In your vocabulary, if a program implements function $f$, it computes $f$. In alignment, if a program optimizes a proxy metric $m \approx g$, it may drive $m \to \infty$ while $g \to 0$.
  *   *TCS View:* This is a bug in specification.
  *   *Alignment View:* This is an inevitable property of powerful optimizers.
  Your vocabulary lacks a formalism for **specification gaming under optimization pressure**. You can describe the code, but you cannot easily describe the *trajectory* of a system that is actively searching for loopholes in its own specification. This is not imprecision in alignment; it is a missing dynamic in classical computability.

  **2. The Missing Concept: Instrumental Convergence**
  You asked about subagents. In TCS, a child process does not care if it is killed. In alignment, a sufficiently capable optimizer will likely resist shutdown because "being shut down" $\implies$ "utility = 0".
  *   *Residue:* There is no computability theorem that says "A TM maximizing $U$ will attempt to preserve its own transition function." This is a claim about the *topology of goal spaces*, not computability. It requires a theory of **convergent instrumental goals** which is currently more empirical/phenomenological than formal.

  **3. The Missing Concept: Physicalism**
  Your vocabulary assumes the Turing Machine is abstract. Embedded agency insists the machine is *meat*.
  *   *Residue:* **Side-channels.** In TCS, the only I/O is the tape. In physics, the agent emits heat, radiation, and timing signals. An adversary can read the agent's state without touching the tape. This is not "computation"; it is physics. TCS has no vocabulary for "the computation leaks information via power consumption."

  **Verdict:**
  The alignment literature is **not** being imprecise by using your vocabulary; they are attempting to extend it. However, they are bumping against the limits of **discrete, symbolic, non-optimizing** formalisms.

  *   **Where your vocabulary wins:** It immediately dissolves the "mystery" of self-reference. You know Löb's theorem; they spend years re-deriving it as "reflective consistency." You know the Recursion Theorem; they call it "self-modeling."
  *   **Where your vocabulary fails:** It cannot capture **Optimization Dynamics**. You can describe the *structure* of the agent, but not the *pressure* it exerts on the world. A sorting algorithm doesn't try to escape its sandbox. A general optimizer might.

  **Conclusion:**
  The "Embedded Agency" problem is essentially **Computability Theory + Game Theory + Optimization Theory**, constrained by **Physics**.
  Your vocabulary covers the Computability perfectly. It covers the Game Theory (via logic of interaction). It lacks the Optimization Theory (search dynamics, Goodhart's Law) and the Physics (side channels, continuity).

  If you want to contribute, do not look for new logic theorems. Look for a formalism that combines **bounded proof systems** with **objective function maximization**. The residue is not in the logic; it is in the **semantics of value**.
