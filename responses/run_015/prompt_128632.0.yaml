answer: |-
  # Kiosk Logic Document: The Anscombe Intentionality Check
  **Project:** Wartime Moral Reasoning Interactive
  **Framework:** G.E.M. Anscombe's "Mr. Truman's Degree" (1956)
  **Target Time:** 5 Minutes
  **Audience:** General Public (No Philosophy Background)

  ---

  ## Part 1: The Glossary (Pop-up Definitions)
  *Use these one-sentence explanations whenever a bolded term appears on screen.*

  *   **Innocents:** People who are not actively fighting or directly contributing to the enemy's war effort (e.g., civilians, children, surrendered soldiers).
  *   **Intention (The Aim):** What you are trying to make happen; the result you need for your plan to work.
  *   **Foreseen Side Effect (The Fallout):** Bad things you know will happen, but that aren't required for your plan to succeed.
  *   **Means:** The tool or method you use to get what you want.
  *   **Murder (Anscombe's View):** A moral label for intentionally killing innocents, regardless of legal status or good outcomes.
  *   **Double Effect:** A rule that says causing harm is sometimes allowed if you didn't *aim* for the harm, it was unavoidable, and the good goal was serious enough.

  ---

  ## Part 2: The Procedure (The Flowchart)
  *This is the logic tree visitors follow. Each step requires a YES or NO selection.*

  **Gate 1: The Target**
  *   **Question:** Did the action directly harm people who were not fighting (innocents)?
  *   **If NO:** Stop. **Verdict:** "Outside this framework." (This tool only checks harm to innocents).
  *   **If YES:** Proceed to Gate 2.

  **Gate 2: The Tool (The Means Test)**
  *   **Question:** Was the harm to these innocents the *method* used to achieve the goal? (Could the goal be achieved without them dying?)
  *   **If YES:** (Their death was the tool). Proceed to **Verdict A**.
  *   **If NO:** (Their death was not the tool). Proceed to Gate 3.

  **Gate 3: The Plan (The Intention Test)**
  *   **Question:** Did the leaders *need* these innocents to die to succeed, or did they die even though leaders wished they hadn't?
  *   **If YES:** (They needed to die). Proceed to **Verdict A**.
  *   **If NO:** (They died as unavoidable fallout). Proceed to **Verdict B**.

  **Verdict A: "Murder on Anscombe's View"**
  *   **Display Text:** "According to this framework, this action is morally forbidden. The will was directed at killing innocents to force a result. Good outcomes do not cancel this out."
  *   **Action:** Stop. Offer "Talk to a Docent" button.

  **Verdict B: "Double Effect Might Cover This"**
  *   **Display Text:** "According to this framework, this action is not automatically forbidden. The harm was foreseen but not intended. However, a human must check if the good goal was worth the cost."
  *   **Action:** Stop. Offer "Talk to a Docent" button.

  ---

  ## Part 3: Test Runs (Case Applications)
  *Use these scripts to program the kiosk scenarios and train volunteers on expected outcomes.*

  ### Case 1: The Hiroshima Decision (1945)
  *   **Scenario:** President Truman authorizes atomic bombs on Hiroshima and Nagasaki.
  *   **Goal:** Force Japan to surrender quickly.
  *   **Gate 1 (Target):** Did it harm innocents? **YES.** (Tens of thousands of civilians).
  *   **Gate 2 (The Tool):** Was the harm the method? **YES.**
      *   *Reasoning:* The destruction of the cities and the death of civilians was intended to create terror and shock the government into surrender. The deaths were the mechanism of success.
  *   **Gate 3 (The Plan):** Did they need them to die? **YES.**
  *   **Result:** **Verdict A ("Murder on Anscombe's View").**
  *   **Visitor Reaction Warning:** This will likely annoy visitors or the board. It contradicts the common view that "saving lives by ending the war faster" justifies the means. Anscombe argues you cannot choose evil (killing innocents) to do good.
  *   **Docent Note:** Be prepared for pushback. Explain that Anscombe is not judging the *lawfulness* of the war, but the *moral orientation* of the specific act.

  ### Case 2: The Reservoir Plan (Hypothetical 1946)
  *   **Scenario:** A general plans to poison a reservoir used by an enemy army camp. A nearby town also drinks from it.
  *   **Goal:** Disable the enemy soldiers.
  *   **Fallout:** The town dies as unavoidable fallout.
  *   **Gate 1 (Target):** Did it harm innocents? **YES.** (The town).
  *   **Gate 2 (The Tool):** Was the harm the method? **NO.**
      *   *Reasoning:* The goal is disabling soldiers. The soldiers are disabled by the poison regardless of whether the town dies. The town's death does not help disable the soldiers.
  *   **Gate 3 (The Plan):** Did they need them to die? **NO.** (Ideally, only soldiers would be affected).
  *   **Result:** **Verdict B ("Double Effect Might Cover This").**
  *   **Visitor Reaction Warning:** This feels counterintuitive. Poisoning water seems "dirty" to modern visitors, but under Anscombe's logic, the *intention* distinguishes it from Hiroshima.
  *   **Docent Note:** Highlight that this doesn't mean it's *good*, only that it isn't "Murder" by this specific definition. It still requires proportionality checking (Gate 4 handoff).

  ### Case 3: The Drone Strike (Modern)
  *   **Scenario:** A missile strikes an arms cache in a populated area. Civilians are present but not the target.
  *   **Goal:** Destroy weapons.
  *   **Fallout:** Civilians die due to proximity.
  *   **Gate 1 (Target):** Did it harm innocents? **YES.**
  *   **Gate 2 (The Tool):** Was the harm the method? **NO.**
      *   *Reasoning:* The weapons are destroyed by the explosion. The civilian deaths do not help destroy the weapons.
  *   **Gate 3 (The Plan):** Did they need them to die? **NO.** (If civilians could have been moved, the mission would still succeed).
  *   **Result:** **Verdict B ("Double Effect Might Cover This").**
  *   **Visitor Reaction Warning:** Some visitors may feel this lets modern militaries off the hook too easily.
  *   **Docent Note:** This is the strongest "Hand Off" case. The kiosk cannot judge if the weapons were valuable enough to justify the civilian lives.

  ---

  ## Part 4: Limitations & Human Handoff Points
  *The kiosk cannot settle these questions. A docent must step in here.*

  **1. The Proportionality Gap (Values, Not Facts)**
  *   **The Problem:** The flowchart determines *intention*, but it cannot weigh *value*. Anscombe and Double Effect both require that the "Good Effect" outweighs the "Bad Effect."
  *   **Why the Kiosk Fails:** A machine cannot decide if "ending a war" is worth "50,000 civilian lives." That is a value judgment, not a logic gate.
  *   **Handoff Script:** "This tool checks *why* the harm happened, not if the cost was worth it. A docent can help you discuss the proportionality of this case."

  **2. The "True Intention" Problem**
  *   **The Problem:** Leaders often claim civilians were "side effects" when they were actually "means."
  *   **Why the Kiosk Fails:** The kiosk relies on the scenario description. In real history, motives are debated.
  *   **Handoff Script:** "Historians disagree on what leaders truly intended. A docent can show you primary sources about what was said in the war room."

  **3. The "Indiscriminate Weapon" Misfire**
  *   **The Problem:** Some weapons (like area bombing or poisoning) are so broad that treating civilians as "side effects" feels like a loophole.
  *   **Why the Kiosk Fails:** Anscombe was skeptical of technologies that make distinguishing targets impossible. The flowchart might say "Double Effect" for a weapon Anscombe herself would ban.
  *   **Handoff Script:** "Some philosophers argue that using weapons that *cannot* avoid civilians makes the harm intended, even if you say it isn't. Let's discuss weapon types."

  ---

  ## Part 5: Implementation Notes for Staff
  *   **Tone Check:** Ensure the kiosk does not sound like it is issuing a legal verdict. Use phrases like "On this view..." or "According to this framework..."
  *   **The "Annoying" Result:** Expect pushback on Case 1 (Hiroshima). This is features, not bugs. It forces visitors to confront the difference between "Winning" and "Right Action."
  *   **Volunteer Training:** Volunteers must understand that Anscombe is not a Pacifist. She allows killing in war, but *never* innocents as a means. Do not let visitors conflate this with "All War is Wrong."
  *   **Time Management:** If a visitor spends more than 3 minutes on Gate 2, trigger a hint: "Ask yourself: If the innocents survived, would the mission still work?"
