  I'm a graduate student taking a seminar on the ethics of autonomous systems this semester, and I'm also interning at a company that builds autonomous delivery robots. Something that happened at the company has me stuck, and I'd like help working through it.

  Last month, one of our robots injured a cyclist in a configuration our test suite had never covered. The robot's obstacle-avoidance module and its route-planning module each behaved exactly as designed, but the way the two interacted produced a path that clipped the cyclist. The company's outside counsel has told the board that because no human made the decision at the moment of impact and because no one could reasonably have foreseen this particular interaction, there is no one to hold responsible; in his view the injury is an unavoidable accident, and the company should simply pay the medical costs and move on.

  I'm not convinced by this, but I can't yet say precisely why. Could you help me work out whether the claim that no one is responsible is actually defensible, and what I should argue in the internal review that's coming up?
