answer: |-
  You are absolutely right to be suspicious. Your intuition is spot-on: the guy on the forum was committing a classic bait-and-switch, sliding between a precise mathematical theorem, a false epistemological claim, and a highly contentious philosophical conclusion. This is a very common pattern in online debates about Gödel, often referred to as the "Gödelian Anti-Mechanist" argument (most famously associated with philosopher John Lucas and physicist Roger Penrose).

  Here is the breakdown of the three distinct claims hiding behind "no system can see its own blind spots," their truth values, and what the *GEB* MU puzzle actually tells us.

  ### 1. The Three Claims Disambiguated

  #### Claim A: Formal Incompleteness
  **The Claim:** "In any sufficiently powerful formal system, there are true statements that cannot be proven within that system."
  *   **Status:** **Theorem (True).**
  *   **The Detail:** This is Gödel's First Incompleteness Theorem. Specifically, for any consistent formal system $F$ capable of basic arithmetic, there is a statement $G$ (the Gödel sentence) that says, effectively, "I am not provable in $F$." If $F$ is consistent, $G$ is true but unprovable *in $F$*.
  *   **The Nuance:** There is also Gödel's **Second** Incompleteness Theorem, which is likely what your opponent meant by "blind spots." It states that a system cannot prove its *own consistency*. A system cannot verify from the inside that it doesn't contain contradictions. This is the literal "blind spot."

  #### Claim B: Absolute Unprovability
  **The Claim:** "There are truths that *no* possible system (human or machine) could ever prove."
  *   **Status:** **False.**
  *   **The Detail:** This is the most common misunderstanding of Gödel. Gödel showed that a statement is unprovable *relative to a specific set of axioms*. However, the Gödel sentence for System $F$ is easily provable in System $F+1$ (which simply adds "System $F$ is consistent" as a new axiom).
  *   **Why it matters:** There is no "final" system. We can always step up to a meta-system to prove what the lower system couldn't. There is no mathematical truth that is forever beyond the reach of *any* formalization; there are only truths beyond the reach of *specific* formalizations.

  #### Claim C: Mental Transcendence (The Lucas-Penrose Argument)
  **The Claim:** "Human minds are not formal systems because we can 'see' the truth of the Gödel sentence that the machine cannot prove. Therefore, minds can always step outside their own rules."
  *   **Status:** **Contentious Philosophical Thesis (Likely False).**
  *   **The Detail:** This argument assumes that because a human can recognize the truth of $G$, the human mind is not bound by formal rules.
  *   **The Counter-Argument:** To "see" that $G$ is true, you must know that the original system is *consistent*. But how do you know your own mind is consistent? If your mind is a formal system, Gödel's Second Theorem applies to it too: you cannot prove your own consistency. If you claim you can, you might be deluded (inconsistent). Therefore, the fact that you claim to see the truth doesn't prove you aren't a machine; it might just prove you are an inconsistent one. Most philosophers of mind and logicians reject this argument because it grants humans a magical access to consistency that they cannot actually demonstrate.

  ---

  ### 2. What the MU Puzzle (and *GEB*) Actually Says

  You mentioned the MIU system from *Gödel, Escher, Bach* (can you turn `MI` into `MU`?). You noted that solving it requires mapping the strings to numbers and checking divisibility by 3 from the "outside." You also noted: *"when you jump out of that system you just land in a new one."*

  **You are correct, and your opponent is wrong about what this implies.**

  Douglas Hofstadter (author of *GEB*) is often misunderstood as supporting the "mystical mind" view. He is not. He is a functionalist. Here is what the MU puzzle demonstrates in the context of the book:

  1.  **Meta-Systems are Mechanical Too:** When you "jump out" of the MIU system to analyze it using number theory (checking if the number of `I`s is divisible by 3), you are not using magic. You are using *another* formal system (arithmetic).
  2.  **The Hierarchy is Infinite:** As you suspected, landing in a new system doesn't break the chain. That new system (arithmetic) has its own Gödel sentence. You can jump out of that one too, into meta-arithmetic. This creates an infinite hierarchy of systems.
  3.  **Strange Loops:** Hofstadter's point is not that minds *escape* systems, but that consciousness *is* what happens when a system becomes complex enough to model itself within that hierarchy. It's a "Strange Loop."

  **Does the MU puzzle support your opponent?**
  **No.** The MU puzzle shows that a system can be analyzed by a meta-system. It does *not* show that the meta-system must be non-mechanical. A computer can be programmed to analyze the MIU system. A computer can be programmed to analyze its own code (static analysis). The "jumping out" is just a transition to a higher level of abstraction, which is fully computable.

  ---

  ### 3. Does Any Reading Get Him His Conclusion About AI?

  Your opponent wants to conclude: **"AI can never really understand itself."**

  Let's test this against the three claims:

  *   **Based on Claim A (Incompleteness Theorem):**
      *   *Verdict:* **Trivial but Irrelevant.**
      *   An AI cannot prove its own consistency. But neither can a human. We cannot mathematically prove that our brains aren't harboring a contradiction. If "understanding yourself" requires a rigorous proof of your own consistency, then *nothing* understands itself. This sets the bar so high it renders the word "understand" useless.
  *   **Based on Claim B (Absolute Unprovability):**
      *   *Verdict:* **False.**
      *   Since there is no absolute unprovability, there is no truth about the AI that couldn't be proven by a *larger* system (e.g., the AI plus a verifier, or a successor AI).
  *   **Based on Claim C (Mental Transcendence):**
      *   *Verdict:* **Unproven Assumption.**
      *   This only works if you assume humans have a non-algorithmic capacity to perceive truth. Since there is no evidence for this (and significant evidence against it), it cannot be used to disprove AI self-understanding.

  ### The Bottom Line

  Your opponent was using Gödel's name to dress up a dualist intuition (that minds are magic and machines are not) as a mathematical theorem.

  *   **The Math:** True (systems have internal blind spots).
  *   **The Leap:** False (those blind spots can be seen from the outside by another system).
  *   **The Mind:** Unproven (there is no evidence humans aren't subject to the same limitations).

  The MU puzzle supports **your** view, not his. It shows that "understanding" a system often means modeling it from a meta-level. An AI can do this. It can run a simulation of itself. It can analyze its own weights and biases. It can predict its own output. It cannot prove its own consistency, but neither can you.

  You won the argument; he just ran out of time before you could make him define "understand."
