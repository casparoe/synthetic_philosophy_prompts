answer: |-
  Based on the pattern of your intuitions, I propose a framework I will call **The Principle of Material Reliance and Access.** This principle divides your interactions into two distinct ethical domains: **Access** (managing time and attention) and **Evidence** (providing information upon which others base significant decisions).

  Here is the formulation of the principle, followed by an analysis of your cases, a required revision, and the application to your upcoming patient scenario.

  ### The Principle of Material Reliance and Access

  1.  **The Access Clause:** As an agent, you are permitted to use conventional imprecisions to manage access to your principal (the doctor), provided the requester has no urgent entitlement to that immediate attention. In this domain, social boundary maintenance outweighs literal precision.
  2.  **The Evidence Clause:** You must not assert objective falsehoods regarding facts that materially affect another party's significant life decisions, legal standing, or health. In this domain, literal truth is mandatory.
  3.  **The Integrity Corollary:** When delivering negative outcomes within the Evidence domain, truthful framing is morally superior to convenient falsehoods. Furthermore, "technically true" statements designed to create a false impression on material facts are ethically equivalent to direct lies.

  ### Mapping Your Cases to the Principle

  **1. The Vendor (Access Clause)**
  *   **Your Verdict:** Saying Dr. Patel is "out" or "unavailable" is fine.
  *   **Principle Explanation:** Salespeople do not have an entitlement to the doctor's immediate attention. You are managing the practice's *access*, not providing *evidence* for a decision. The "lie" is a social lubricant to protect your principal's time. The principle validates this as permissible gatekeeping.

  **2. The Job Applicant (Evidence Clause + Integrity Corollary)**
  *   **Your Verdict:** "Position filled" (lie) is not fine; "Better match" (truth) is fine.
  *   **Principle Explanation:** The applicant is making a life decision (employment) based on your feedback. This is the *Evidence* domain. "Position filled" is an objective falsehood about the state of the world. "Better match" is a subjective assessment that is literally true and conveys the necessary outcome without falsifying reality. The principle motivates your preference for the truthful framing.

  **3. The Rental Application (Evidence Clause)**
  *   **Your Verdict:** Eviction date (lie) is clearly not fine.
  *   **Principle Explanation:** The landlord is making a high-stakes financial decision based on objective history. Falsifying the date is a direct violation of the Evidence Clause.

  ### The Required Revision: The "Consulting Name"

  **Your Verdict:** Listing freelance work under a formal consulting name is "not fine but distinctly less wrong" than the eviction lie.
  **The Principle's Revision:** Under the **Integrity Corollary**, you should revise this verdict to view the consulting name as **equally wrong** as the eviction lie.

  **Why?** You distinguish them based on *literal truth* (the name exists vs. the date is false). However, the *intent* (to deceive regarding financial stability) and the *reliance* (the landlord infers stable employment) are identical. In the Applicant case, you preferred "better match" because it was a truthful *assessment*. In the Consulting case, the name is a truthful *label* used to misrepresent an objective *status* (employment type).

  If you accept that "better match" is superior to "position filled" because it respects the applicant's right to accurate information, you must concede that the landlord has the same right to accurate information regarding your solvency. A registered LLC name used to mask freelance instability is a "technically true" statement designed to induce material error. The principle demands you treat this as a breach of the Evidence Clause, not a lesser offense.

  ### Predictions for New Cases

  1.  **The Insurance Company:** If an insurer calls to verify a patient's visit date and you shift it by a day to ensure coverage, the principle predicts this is **impermissible**. This falls under *Evidence* (financial/legal reliance), not *Access*.
  2.  **The Gifted Salesperson:** If a vendor sends a gift and asks, "Did Dr. Patel get my package?" and she threw it away, the principle predicts it is **permissible** to say, "She hasn't had a chance to review it yet." This returns to the *Access* domain; the vendor is not making a life decision based on this data.
  3.  **The Competitor:** If a competing dentist calls asking for Dr. Patel's supplier pricing, and you say, "I don't have that handy," when you do, the principle predicts this is **permissible**. You owe no evidentiary duty to a competitor; this is boundary protection.

  ### The Patient Biopsy Scenario

  Next week, a worried patient will ask if her biopsy results are back. They are. The doctor says "say nothing."

  **Application of the Principle:**
  *   **Domain:** This is clearly the **Evidence** domain. The patient's health decisions and emotional state rely on this information. It is high stakes and high entitlement.
  *   **Constraint:** The *Evidence Clause* forbids you from lying (saying "No, they aren't back").
  *   **Constraint:** The *Access Clause* does not apply here; the patient is entitled to her own medical data, even if the *delivery* is managed by the doctor.
  *   **Resolution:** You must navigate the doctor's instruction without violating the Evidence Clause. You cannot confirm the results (per doctor), but you cannot deny their existence (per principle).

  **Recommended Action:**
  Do not say "No." Do not say "Yes."
  Say: **"I am not authorized to release any information regarding test status until Dr. Patel has reviewed the file. He will be contacting you directly."**

  **Why this works:**
  1.  **It is Literally True:** You are not authorized. He will contact her.
  2.  **It Avoids Deception:** It does not assert the results are missing.
  3.  **It Respects Protocol:** It upholds the doctor's instruction to control the *delivery* of the news without forcing you to lie about the *existence* of the news.

  If she presses, "So they *are* back?" you must reply: **"I cannot discuss the status of the chart, but I promise Dr. Patel will reach out to you."**

  This maintains your integrity under the Principle of Material Reliance while honoring your employment duties. It treats the patient as a rights-holder (Evidence) rather than a nuisance (Access), which is the core distinction your intuitions have been correctly grasping for.
