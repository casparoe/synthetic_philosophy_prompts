answer: |-
  # Regularity Assurance Protocol (RAP-v1.2)
  **Owner:** Model Assurance Team  
  **Audience:** Technical Analysts  
  **Time Limit:** 60 Minutes per Regularity  
  **Purpose:** To classify model regularities based on their stability under extrapolation, distinguishing between robust structural relationships and accidental patterns.

  ---

  ## Part 1: The Procedure

  Run the following four tests in order. Record the result (Pass, Fail, Uncertain) for each. Do not proceed to extrapolation until the Tag is assigned.

  ### Test 1: Predicate Independence (The "Grue" Check)
  **Philosophical Basis:** Projectibility. A regularity cannot be lawlike if the variables are defined by the specific dataset or time window (e.g., "cases before 2023").
  **Action:** Examine the definitions of the input and output variables.
  *   **Pass:** Variables are defined by physical or biological properties independent of the dataset (e.g., "viral load," "room volume," "date of symptom onset").
  *   **Fail:** Variables rely on administrative boundaries, specific policy windows, or data collection artifacts (e.g., "cases reported under Protocol A," "hospitalizations during the Alpha wave").
  *   **Uncertain:** Variables are mixtures (e.g., "positive PCR tests" depends on testing policy).
  **Threshold:** If **Fail**, tag immediately as **Local Coincidence**. Do not extrapolate.

  ### Test 2: Intervention Robustness (The "Modal" Check)
  **Philosophical Basis:** Nomic Necessity/Production. Laws support counterfactuals. If we intervene on the cause, does the effect follow predictably?
  **Action:** Review model sensitivity runs or natural experiments where the input variable was externally manipulated (e.g., a policy change, a change in testing capacity).
  *   **Pass:** The relationship holds (within error bounds) when the input is perturbed by external factors not modeled internally.
  *   **Fail:** The relationship breaks when the context changes, even if the input value is the same.
  *   **Uncertain:** No intervention data exists; only observational correlation is available.
  **Threshold:** If **Fail**, tag as **Local Coincidence**. If **Uncertain**, proceed to Test 3 but flag for Senior Sign-off.

  ### Test 3: Systematic Integration (The "Best System" Check)
  **Philosophical Basis:** Humean Best System Analysis. A regularity is lawlike if it simplifies and strengthens the overall web of accepted models without requiring ad-hoc exceptions.
  **Action:** Check if this regularity conflicts with other accepted regularities in the centre's library. Does accepting this require adding complex "fixes" elsewhere?
  *   **Pass:** The regularity simplifies the overall model suite or is consistent with established biological/physical constraints (e.g., conservation of mass, incubation periods).
  *   **Fail:** Accepting this regularity requires adding specific exception-handling code in three other modules to prevent impossible results.
  *   **Uncertain:** The impact on the wider system is unknown.
  **Threshold:** If **Fail**, tag as **Effective Regularity** (at best) or **Local Coincidence**.

  ### Test 4: Scope & Initial Conditions (The "Accident" Check)
  **Philosophical Basis:** Distinction between Laws and Accidental Generalizations. Does it hold everywhere, or just where we looked?
  **Action:** Compare the regularity against data from a distinctly different context (different country, different pathogen strain, different demographic).
  *   **Pass:** The parameter/relationship remains stable across distinct contexts.
  *   **Fail:** The parameter drifts significantly when the background population or environment changes.
  *   **Uncertain:** No external validation data exists.

  ---

  ## Part 2: Tagging and Action Rules

  Combine the test results to assign one of four tags.

  | Tag | Criteria | Permitted Action |
  | :--- | :--- | :--- |
  | **Exportable Law** | Pass Tests 1, 2, 3, 4. | **Extrapolate Freely.** Use in scenario planning and policy setting. |
  | **Effective Regularity** | Pass 1 & 3; Uncertain/Fail 2 or 4 (with mechanism). | **Extrapolate Under Conditions.** Valid only within the bounds of the calibration data. Must state boundary conditions in output. |
  | **Local Coincidence** | Fail Test 1 or 2. | **Refuse Extrapolation.** Do not use for forecasting. Use only for back-fitting historical data. |
  | **Not Decidable** | Uncertain on Tests 2 & 4; Data insufficient. | **Escalate.** Senior Modeller must decide risk tolerance. |

  ### The Conflict Rule (Crucial)
  **Scenario:** Test 2 (Intervention) suggests the relationship is robust (Pass), but Test 3 (Systematic) suggests it breaks the wider model suite (Fail), *or vice versa*.
  **Action:** This indicates a fundamental tension between the "mechanism" view and the "system" view.
  **Procedure:** Tag as **Not Decidable**. Route immediately to Senior Modeller Sign-off. Do not resolve this at the analyst level.

  ### Judgment Calls (Sign-off Required)
  The following cannot be settled by this procedure and require Senior Modeller authorization:
  1.  **Risk Tolerance:** How much deviation in Test 2 constitutes a "Fail"? (Default: >15% error).
  2.  **Value Judgments:** If a regularity is "Local Coincidence" but is the only way to meet a statutory forecasting deadline, the Senior Modeller must sign the risk waiver.
  3.  **Philosophical Conflict:** As per the Conflict Rule above.

  ---

  ## Part 3: Limitations Statement
  **This procedure does not guarantee model correctness.** It assesses the *status of the regularity*, not the implementation. It will not catch:
  1.  **Coding Errors:** A lawlike relationship implemented with a bug.
  2.  **Structural Blindspots:** Regularities that are true but irrelevant to the actual causal drivers (spurious correlation that passes Test 2 by luck).
  3.  **Phase Shifts:** A regularity that was an Exportable Law yesterday but ceases to be one tomorrow due to pathogen mutation (the procedure is backward-looking).
  4.  **Normative Assumptions:** It does not test whether the *goal* of the extrapolation is ethically permissible.

  ---

  # Part 4: Register Entries (Examples)

  ### Entry 1: School Reopening Delay
  *   **Regularity:** Epidemic peak follows school reopening by 18–22 days.
  *   **Test 1 (Predicate):** **Pass.** "School reopening" and "epidemic peak" are temporally defined independent of specific data values.
  *   **Test 2 (Intervention):** **Uncertain.** No region has experimentally varied reopening dates while holding other NPIs constant. Observational data only.
  *   **Test 3 (Systematic):** **Pass.** Consistent with incubation period + testing lag models used in other modules.
  *   **Test 4 (Scope):** **Fail.** Drifts to 25+ days in regions with high summer outdoor activity.
  *   **Tag:** **Effective Regularity**
  *   **Action:** Extrapolate Under Conditions. Valid only for Autumn/Winter terms.
  *   **Analyst Note:** Mechanism is plausible (contact mixing), but confounded by seasonality.

  ### Entry 2: Indoor Occupancy Power Law
  *   **Regularity:** Transmission rises with indoor occupancy as a power law (stable exponent).
  *   **Test 1 (Predicate):** **Pass.** Occupancy and transmission are physical/biological measures.
  *   **Test 2 (Intervention):** **Pass.** Holds in controlled chamber studies and natural experiments (office returns).
  *   **Test 3 (Systematic):** **Pass.** Aligns with Wells-Riley equation assumptions in ventilation module.
  *   **Test 4 (Scope):** **Uncertain.** Exceptions noted in high-ventilation settings (exponent flattens).
  *   **Tag:** **Effective Regularity**
  *   **Action:** Extrapolate Under Conditions. Must condition on ventilation rate (ACH).
  *   **Analyst Note:** Mechanism (dose-response) is strong, but "occupancy" alone is insufficient without air exchange rate.

  ---

  ### Entry 3: Cases-to-Admissions Lag (Flagship Model)
  *(Note: This entry reflects the "Least Wanted" Tag outcome as requested)*

  **REGULARITY REGISTER ENTRY: #2023-FLAG-04**
  **Date:** 24 Oct 2023
  **Analyst:** J. Doe
  **Senior Sign-off:** [Pending]

  | **Regularity Description** | Hospital admissions lag reported cases by six days (stable across 3 years national data). |
  | :--- | :--- |
  | **Test 1: Predicate Independence** | **PASS.** Variables are standard administrative counts. |
  | **Test 2: Intervention Robustness** | **FAIL.** Relationship collapsed during periods of rapid testing policy change (e.g., removal of LFT reporting). Lag shifted to 9 days when case ascertainment dropped. |
  | **Test 3: Systematic Integration** | **FAIL.** Requires ad-hoc "smoothing" in the admissions module to prevent negative admission projections when case rates drop sharply. |
  | **Test 4: Scope & Conditions** | **FAIL.** Does not hold in regions where hospital capacity was breached (admissions capped by beds, not cases). |
  | **Conflict Rule Triggered?** | **NO.** (Tests 2, 3, 4 all Fail). |
  | **ASSIGNED TAG** | **LOCAL COINCIDENCE** |
  | **PERMITTED ACTION** | **REFUSE EXTRAPOLATION** |
  | **RISK ASSESSMENT** | **CRITICAL.** This regularity is the core driver of the Flagship Model's short-term horizon. Treating it as a law assumes administrative reporting stability that does not exist under intervention. |
  | **ANALYST RECOMMENDATION** | Decouple admissions from *reported* cases. Re-build using *onset* dates or wastewater proxies. Current parameter (6 days) is an artifact of 2020–2023 testing behavior, not biology. |
  | **SENIOR MODELLER DECISION** | [ ] Accept Tag & Refuse Extrapolation (Model unusable for policy)<br>[ ] Override Tag (Requires Risk Waiver)<br>[ ] Escalate to Director |
  | **SIGN-OFF DATE** | _______________ |

  **Limitations Note for Entry 3:** This test identifies the regularity as accidental, but it cannot calculate the *cost* of rebuilding the model. The decision to override this tag is a resource/political decision, not a scientific one.
