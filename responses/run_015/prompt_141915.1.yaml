prompt: |-
  I lead the model-assurance team at a national epidemiological forecasting centre. Several times a year we audit a simulation model before it is used to set rules affecting millions of people, and most of the risk sits in one place: the model contains dozens of regularities — curves fitted to past data, relationships imported from other countries, structural assumptions about how people and pathogens behave — and they get shipped as if they will keep holding outside the conditions in which they were measured. My analysts have epidemiology or statistics training and no philosophy. What I need is a written procedure one of them can run on each regularity: a short sequence of tests in a fixed order, each with a stated threshold for what counts as passing it, ending in one of a few tags — exportable law, effective or derived regularity, local coincidence, or not decidable on the data we have — plus a rule for what we are permitted to do with a regularity given its tag (extrapolate freely, extrapolate only under stated conditions, refuse to extrapolate, escalate).

  The tests should be the ones the philosophy of laws of nature actually supports, not merely statistical ones. As I understand the literature there is a real disagreement here: on one side, laws are just the patterns that survive in the best overall systematisation of what happens — nothing governs, there are no necessary connections, and a generalisation is lawlike in proportion to how much simplicity and strength it buys the total system; on the other, laws are features of the world that produce the patterns, explain why they hold, and ground counterfactuals about what would happen under interventions nobody has performed. I do not care which side is right, but I do care that the procedure does not quietly presuppose only one of them. So give me at least one test that only makes sense on the first picture (does this regularity earn its place in a compact system that also covers other regularities we accept?) and at least one that only makes sense on the second (is there something in the setup that would keep the pattern holding under an intervention, and does the pattern survive when we intervene on it in the model?). Include the grue-style worry about whether the predicates involved are the kind that project, and the distinction between a genuine exceptionless pattern and a coincidence of initial conditions — the difference between a regularity that holds everywhere and one that held in every case we happened to look at. State explicitly what the analyst should do when the two families of tests disagree, because they will.

  Constraints: the procedure has to be runnable in under an hour per regularity by someone with no philosophy background, using data already in front of them; the output is a one-page register entry that a senior modeller signs off on; and where a step requires a judgment we cannot specify in advance — how much risk of a false extrapolation we accept, whose values set that threshold — say so and route it to the sign-off rather than pretending the test settles it. Tell me at the end what the procedure cannot do: which ways a model can go wrong that these tests will not catch.

  Then run it on three regularities from our current work. (1) In all fourteen regions we model, the epidemic peak follows school reopening by eighteen to twenty-two days, and the model reproduces this with a fitted delay parameter. (2) Transmission rises with indoor occupancy as a power law with a stable exponent across countries and settings, there is a plausible mechanism story about airborne dose, and there are known exceptions. (3) The relation our flagship model is built around: hospital admissions lag reported cases by six days, stable across three years of national data. Assume (3) receives the tag we least want, and write that entry as it would actually appear in the register.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and register entries:

  1.  **Analyze the Request:**
      *   **Role:** Lead of a model-assurance team at a national epidemiological forecasting centre.
      *   **Task:** Create a written procedure (audit protocol) for assessing "regularities" (model assumptions/parameters) based on philosophy of science (laws of nature), specifically balancing Humean/Best System Analysis (BSA) and Non-Humean/Modal/Production views.
      *   **Audience:** Analysts with epidemiology/stats training, *no* philosophy background.
      *   **Constraints:**
          *   Runnable in < 1 hour per regularity.
          *   Uses existing data.
          *   Output: One-page register entry signed by a senior modeller.
          *   Must include specific philosophical tests (BSA-style, Modal/Interventionist-style, Grue-style projectibility, Exceptionless vs. Initial Conditions).
          *   Must handle disagreement between test families.
          *   Must state limitations (what the procedure *cannot* catch).
          *   Must run the procedure on three specific examples.
          *   Example (3) must receive the "least wanted" tag and be written as a real register entry.
      *   **Tags:** Exportable Law, Effective/Derived Regularity, Local Coincidence, Not Decidable.
      *   **Actions:** Extrapolate freely, Extrapolate under conditions, Refuse extrapolation, Escalate.

  2.  **Deconstruct the Philosophical Requirements:**
      *   *Humean/BSA View:* Laws are summaries of patterns that optimize simplicity and strength. Test: Does this regularity fit neatly into the broader web of accepted models without adding excessive complexity? (Systematic Integration Test).
      *   *Non-Humean/Modal View:* Laws govern behavior and support counterfactuals. Test: Does the pattern hold under intervention? Is there a mechanism? (Intervention/Robustness Test).
      *   *Projectibility (Goodman's Grue):* Are the predicates used natural kinds or gerrymandered? (Predicate Stability Test).
      *   *Accidental Generalizations (Initial Conditions):* Is it a law or just a coincidence of circumstances? (Scope/Independence Test).

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Name:* Regularity Assurance Protocol (RAP).
      *   *Structure:* Sequential steps with pass/fail/uncertain outcomes.
      *   *Step 1: Predicate Stability (Grue).* Are the variables well-defined independent of the specific dataset?
      *   *Step 2: Intervention Robustness (Modal).* Does it hold when we tweak inputs in the model or look at natural experiments?
      *   *Step 3: Systematic Integration (BSA).* Does this fit with other accepted laws without ad-hoc fixes?
      *   *Step 4: Scope & Independence (Accidents).* Is it tied to specific initial conditions (time/place)?
      *   *Decision Matrix:* How to combine results into tags.
      *   *Escalation:* What to do when tests conflict (route to Sign-off).

  4.  **Refining the Procedure for the Audience:**
      *   Avoid jargon like "Humean" or "Nomic Necessity." Use operational language.
      *   Ensure time limits are realistic.
      *   Make the "Judgment Call" points explicit for the Senior Modeller.

  5.  **Developing the Tags and Actions:**
      *   *Exportable Law:* Passes all. Action: Extrapolate freely.
      *   *Effective Regularity:* Passes most, but has known boundary conditions. Action: Extrapolate under conditions.
      *   *Local Coincidence:* Fails robustness/scope. Action: Refuse extrapolation.
      *   *Not Decidable:* Data insufficient. Action: Escalate.

  6.  **Addressing the "Disagreement" Constraint:**
      *   Need a specific step for "Systematic Fit" (BSA) and "Intervention" (Modal).
      *   Need a rule for conflict: If Modal says "Yes" (mechanism exists) but BSA says "No" (breaks other models), or vice versa, this triggers "Escalate."

  7.  **Drafting the Limitations Section:**
      *   What can't this catch? Structural model error, black swan events, value-laden assumptions, implementation bugs.

  8.  **Running the Procedure on the Three Examples:**

      *   *Example 1: School Reopening Delay (18-22 days).*
          *   Predicate: Stable.
          *   Intervention: Did it hold when reopening strategies changed? Maybe not.
          *   Systematic: Fits contact models? Yes.
          *   Scope: Specific to school terms. Likely "Effective Regularity."

      *   *Example 2: Indoor Occupancy Power Law.*
          *   Predicate: Stable (occupancy, transmission).
          *   Intervention: Ventilation changes might break it. Mechanism exists (dose).
          *   Systematic: Fits physics of aerosols.
          *   Scope: Known exceptions (super-spreading). Likely "Effective Regularity" or "Exportable Law" with caveats. Let's lean towards "Effective" due to exceptions.

      *   *Example 3: Cases -> Admissions Lag (6 days).*
          *   Constraint: Must receive the "least wanted" tag.
          *   Least wanted tag for a flagship model parameter? Probably "Local Coincidence" or "Not Decidable" (implies the model is shaky). Let's aim for "Local Coincidence" because it implies the relationship is accidental/contingent, not lawlike.
          *   Why? Reporting artifacts, changing testing policies, healthcare capacity bottlenecks. It looks stable but is actually a coincidence of administrative processes.
          *   *Register Entry:* Needs to look official, concise, and highlight the risk.

  9.  **Review and Refine:**
      *   *Check Constraints:* Is it under an hour? Yes, if data is ready. Is it philosophy-neutral? Yes, includes both BSA and Modal tests.
      *   *Tone:* Professional, bureaucratic but rigorous.
      *   *Formatting:* Clear headings, bullet points for the procedure, table for the register.

  10. **Final Polish:**
      *   Ensure the "Conflict Rule" is clear.
      *   Ensure the "Judgment Call" points are flagged for the Senior Modeller.
      *   Make sure Example 3's register entry looks authentic (including the "Action" and "Sign-off" sections).

  *(Self-Correction during drafting)*: I initially thought about making Example 3 "Not Decidable." But "Local Coincidence" is more damning for a flagship model because it says "this relationship is accidental." It forces a re-think. I will proceed with "Local Coincidence" for Example 3.
  I need to make sure the procedure explicitly mentions *how* to test for "Grue" without using the word "Grue." I'll call it "Predicate Independence."
  I need to ensure the distinction between BSA (Systematic) and Modal (Intervention) is clear in the instructions.

  *(Final check on the "Least Wanted" tag)*: If the model is flagship, finding a core assumption is a "Local Coincidence" is a crisis. That fits the prompt's tension.

