  **TAXONOMY TREE**

  1. **Is species membership a direct ground for moral status?**
      *   **YES (Direct Ground)**
          *   2. **Is this priority absolute (always trumps capacity)?**
              *   **YES (Absolute)**
                  *   3. **Do obligations run symmetrically (animals owe humans duties)?**
                      *   *YES:* **[EMPTY/INCOHERENT]** — Cannot claim absolute priority while accepting symmetric obligation; logically collapses.
                      *   *NO:* 4. **Does ecological role justify harm?**
                          *   *YES:* **Theological Dominion / Strong Anthropocentrism**
                          *   *NO:* **Human Rights Absolutism**
              *   **NO (Defeasible)**
                  *   3. **Do obligations run symmetrically?**
                      *   *YES:* **Soft Speciesism with Reciprocity** (Rare)
                      *   *NO:* 4. **Does ecological role justify harm?**
                          *   *YES:* **Stewardship Model**
                          *   *NO:* **Moderate Speciesism**
      *   **NO (Indirect Ground / Capacity Proxy)**
          *   2. **Do capacities scale moral status gradually?**
              *   **YES (Gradient)**
                  *   3. **Do obligations run symmetrically?**
                      *   *YES:* **Moral Agency Symmetry** (Requires high cognition)
                      *   *NO:* 4. **Does ecological role justify harm?**
                          *   *YES:* **Ecological Utilitarianism**
                          *   *NO:* **Sentientism / Gradualism**
              *   **NO (Binary Threshold)**
                  *   3. **Do obligations run symmetrically?**
                      *   *YES:* **Contractualism / Personhood Theory**
                      *   *NO:* 4. **Does ecological role justify harm?**
                          *   *YES:* **Environmental Holism**
                          *   *NO:* **Individualist Rights View**

  **EMPTY OR INCOHERENT COMBINATIONS**
  *   **Absolute Direct + Symmetry:** Marked empty above. If humans *always* trump based on species, animals can't hold equivalent moral leverage over humans. It's not just unpopular, it's logically broken unless you redefine "obligation" to mean something non-moral (like training).
  *   **Direct Ground + Gradient Status:** Didn't make it into the tree branches because it's a category error. Species membership is categorical (you are or aren't human), while gradients require continuous variables (like pain sensitivity). You can't have a gradient of species membership without slipping into the Indirect/Capacity view.

  **INDISTINGUISHABLE LEAVES**
  *   **Moderate Speciesism (Direct/Defeasible)** vs. **Individualist Rights View (Indirect/Binary):** These two are functionally identical in 95% of cases. Both protect normal humans fully and allow animal use. The only time they separate is on marginal cases (severely cognitively impaired humans vs. high-capacity animals). Your taxonomy questions can't separate them in practice because both rely on a "normal human" baseline to function, even if one admits it and the other hides behind "personhood."
  *   **Stewardship Model** vs. **Environmental Holism:** Both justify individual harm for system health. One says "because humans are in charge," the other says "because the ecosystem matters." The outcome for the individual animal is the same, making them hard to split without digging into metaphysical intent.

