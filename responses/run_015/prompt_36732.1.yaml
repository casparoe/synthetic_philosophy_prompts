answer: |-
  # Seminar Chat Quiz: Which Updater Are You Actually?

  **Instructions:** We've been arguing about Judy Benjamin all morning. Everyone claims to have a "clear intuition," but the math keeps getting in the way. This quiz strips out the theorems and asks about the cases. 

  For each scenario, pick the **one** option that best matches what you think a rational agent should do *immediately after hearing the report*. Don't overthink the derivation; go with your gut on the output.

  ***

  ### 1. The Original Swamp (Judy Benjamin)
  You are dropped in a swamp. It's either **Red Territory** or **Blue Territory** (50/50). You hear a radio transmission: *"If you are in Red Territory, it is 3 times more likely you are in Company A than Company B."* The radio says nothing about Blue Territory.
  **What happens to your credence that you are in Red Territory?**
  *   **A.** It stays exactly 50%. The news was only about what happens *inside* Red, so my belief about being in Red shouldn't move.
  *   **B.** It drops below 50%. The radio gave me specific info about Red but stayed silent on Blue; that silence makes Red look less likely by comparison.
  *   **C.** It is not fixed by this report. I can rationally hold any credence in Red Territory as long as I satisfy the 3:1 ratio inside it.

  ### 2. The Exaggerating Operator
  Same swamp setup. But you know this radio operator has a tic: they always **double** the odds ratios they report. (If they say 3:1, the real odds are 1.5:1).
  **How do you process this?**
  *   **A.** I correct the ratio to 1.5:1, then keep my credence in Red Territory exactly where it started.
  *   **B.** I correct the ratio to 1.5:1, but I also shift my credence in Red Territory (likely down) because the report is a signal about the world.
  *   **C.** Knowing they distort the numbers makes the report too unreliable to pin down a precise credence in Red Territory.

  ### 3. The Conflicting Antecedent
  You are checking a weather app. Your own sensors say there is a **10% chance of Rain**. A forecaster then broadcasts: *"If it rains, there is a 90% chance the match is moved."* You have no other info about the match.
  **Does the forecaster's report change your 10% credence in Rain?**
  *   **A.** No. The report is conditional on Rain. It doesn't give me new evidence about whether it will rain, only about what happens if it does.
  *   **B.** Yes. The fact that the forecaster issued this specific conditional is itself evidence about the weather system that generated the rain.
  *   **C.** Not necessarily. My sensor and their conditional are different kinds of data; there's no single rule for combining them.

  ### 4. The Sloppy Informant
  A informant says: *"If you're in Red Territory, you're likely in Company A."* Later you realize they might have mixed up their conditionals and meant *"If you're in Company A, you're likely in Red Territory."* You can't ask for clarification.
  **What is your posterior credence in Red Territory?**
  *   **A.** I pick the most likely interpretation, calculate the posterior for that, and stick with it.
  *   **B.** I treat my posterior as a range of values covering both interpretations.
  *   **C.** I discard the report entirely. If I don't know which conditional was meant, the input is meaningless.

  ### 5. Sequential Updates
  You receive two independent conditional reports about the same territory (e.g., one about Company location, one about Supply status), both conditional on being in Red Territory.
  **Does the order in which you hear them matter?**
  *   **A.** No. If I process them correctly, my final beliefs should be the same regardless of order.
  *   **B.** Yes. The first report changes the context for the second, so the order shifts the final result.
  *   **C.** I can't combine them into a single precise belief state anyway.

  ### 6. The Trivial Conditional
  You hear a report: *"If you are in Red Territory, then you are in Red Territory."* (Probability 1).
  **How does this update your prior?**
  *   **A.** It doesn't change anything. It's a tautology.
  *   **B.** It slightly boosts my credence in Red Territory, because receiving a confirmation signal is better than silence.
  *   **C.** It's not a valid piece of evidence. You can't update on a logical truth presented as testimony.

  ### 7. The Vague Report
  The radio says: *"If you are in Red Territory, it is **more likely** you are in Company A than Company B."* (No specific numbers).
  **What does your posterior look like?**
  *   **A.** I assign a specific number (e.g., 75%) to represent "more likely" and update to a single posterior.
  *   **B.** I update to a set of posteriors that all satisfy the "more likely" constraint.
  *   **C.** Without numbers, I can't update my credences at all.

  ### 8. The Meta-Question
  When you do update on a conditional report like this, what is the **primary goal** of your update rule?
  *   **A.** To change my prior beliefs as little as possible while satisfying the new constraint.
  *   **B.** To treat the report as a new piece of evidence about the world and incorporate its full weight.
  *   **C.** There is no single rational goal; different rules work for different contexts.

  ***

  ## Scoring Key

  Tally your answers. You will likely have a dominant column, though mixtures are common.

  *   **Mostly A's: The Minimalist (Minimize Distance)**
      *   **Position:** You are a Van Fraassen-style MinInfo updater. You believe conditional constraints restrict the *ratio* of probabilities within the antecedent but should not disturb the probability *of* the antecedent itself unless logically forced. Your goal is to minimize information gain (cross-entropy).
      *   **Key Tell:** Q1(A) + Q3(A). You insist $P(\text{Antecedent})$ stays constant.

  *   **Mostly B's: The Jeffrey-er (Partial Evidence)**
      *   **Position:** You treat the testimony as an event in the world. Hearing the report is evidence that shifts the probability of the antecedent (usually downward in JBP cases, as specific info "uses up" probability mass). You are comfortable with order-dependence (Q5) and tautological boosts (Q6).
      *   **Key Tell:** Q1(B) + Q6(B). You think silence or tautologies carry evidentiary weight.

  *   **Mostly C's (with some B's): The Constraint Keeper (No Unique Posterior)**
      *   **Position:** You believe the report imposes a rational constraint (e.g., $P(A|B) = k$) but does not determine a unique posterior. Any probability function satisfying the constraint is permissible. You prefer intervals/sets over point values (Q4, Q7).
      *   **Key Tell:** Q1(C) + Q7(B). You are comfortable with indeterminate credences.

  *   **Mostly C's (specifically Q4, Q6, Q8): The Skeptic (No Fact of the Matter)**
      *   **Position:** You believe conditional testimony of this sort is not a well-formed input for Bayesian updating. There is no fact of the matter about what to believe because the input is semantically or epistemically defective.
      *   **Key Tell:** Q4(C) + Q6(C). You reject the input rather than accommodating it.

  ***

  ## Analysis & Limitations

  ### Indistinguishable Positions
  1.  **Constraint Keeper vs. Skeptic:** In this quiz, both often select Option C. The distinction is subtle: The **Constraint Keeper** believes *many* posteriors are rational (Q7-B), whereas the **Skeptic** believes *no* posterior is rationally mandated (Q4-C, Q6-C). If you scored C on Q1 but C on Q4/Q6, you are likely a Skeptic. If you scored C on Q1 but B on Q7, you are a Constraint Keeper.
  2.  **Minimalist vs. Jeffrey-er (in simple cases):** In the original Judy Benjamin case (Q1), Minimalists say $P(\text{Red})$ stays constant. Jeffrey-updaters usually say it drops. However, if a Jeffrey-updater assigns very low "weight" to the testimony, their numerical answer might look like the Minimalist's. This quiz forces a qualitative choice (Stay vs. Drop) to separate them, but in practice, the math can blur.

  ### Incoherent Combinations
  *   **The "Unique but Order-Dependent" Paradox:** If you chose **A** on Q1 (implying a unique, stable posterior exists) but **B** on Q5 (Order matters), your position is mathematically unstable. Standard MinInfo rules are order-invariant for independent constraints. If you believe there is a *unique* rational posterior, it shouldn't depend on the sequence of independent data.
  *   **The "Tautology Boost" vs. "Minimal Change":** If you chose **B** on Q6 (Tautologies boost credence) but **A** on Q8 (Goal is to change as little as possible), you are in tension. Updating on a logical truth violates the principle of minimal change unless you treat the *act of hearing* as the evidence, not the content.
  *   **The "Unoccupied" Slot:** There is a position that claims $P(\text{Antecedent})$ should **increase** upon hearing a conditional about it (e.g., "If Red, then A" makes Red *more* likely). None of the standard positions (MinInfo, Jeffrey, Constraint) typically advocate this for the Judy Benjamin case. If you found yourself wanting to write in "It goes up" for Q1, you hold a minority view not captured by the standard literature (sometimes associated with specific causal interpretations of the testimony).

  ### Note on Q3 (Conflict)
  This question is the hardest separator. **Minimalists** strictly separate the conditional from the antecedent prior. **Jeffrey-updaters** often conflate the reliability of the forecaster with the probability of the antecedent. If you chose **C** here, you likely doubt that conditional probabilities can be straightforwardly combined with marginal priors from different sources without a unified model—a view shared by both Skeptics and sophisticated Constraint Keepers.
