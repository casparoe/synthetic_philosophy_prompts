  ### Conceptual Mapping: Evolutionary Architecture ↔ Joke Structure

  *   **The Arches/Dome:** The necessary cognitive architecture for recursive syntax and semantic processing (the load-bearing walls).
  *   **The Triangular Gap (Spandrel):** The incongruity detected when semantic expectations misfire against syntactic structure (the space where the joke lives).
