  ### The Icebreaker

  **Setting:** A dimly lit conference bar. Two evolutionary psychologists, **ADAPT** and **STRUCT**, are staring at their drinks.

  **ADAPT:** "I'm telling you, humor is an adaptation for coalition signaling. We laugh to prove we share a cognitive map."

