      *   **Low Impact/Side Effects:** This is a classic AI safety problem (Armstrong, Levinstein, etc.).
      *   **Inaction Baseline:** Known issue (omission vs. commission symmetry).
      *   **AUP (Turner et al.):** Measures change in agent's ability to achieve random goals. Known issue: "offsetting" (fixing what you broke to restore utility) and "shutdown" problems (preventing shutdown preserves utility).
