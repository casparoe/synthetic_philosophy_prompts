      *   **Section 5 (AUP Straw Man):** AUP does have a shutdown problem. If the agent preserves its own utility, it might prevent shutdown. But AUP usually penalizes changes to *attainable* utility across a distribution. Preventing shutdown often increases attainable utility for the agent, but does it decrease it for the *human*? Standard AUP is agent-centric. The user's critique here is about *other agents* (human) switching it off counting as impact.
