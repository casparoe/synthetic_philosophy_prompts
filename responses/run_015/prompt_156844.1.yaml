  Write me a joke about Parfits hitchhiker and rational irrationality — you know, the driver who takes you into town only if he predicts youll hand over the money once you're safely there, so it pays to be the sort of person who can't help but keep a promise. But put a twist on the case so it isn't the standard one: in my version the driver reads motives, not just actions. He only picks up hitchhikers he predicts will pay out of plain gratitude, and if he senses that you are paying because you worked out it was the only way to get rescued, he definately drives off and leaves you there. So the hitchhiker needs to become genuinely, non-strategically grateful, and can't do it for the strategic reason that it would get him out of the desert — the motive has to be real, but any reason he has for aquiring it makes it fake. The punchline should turn on that actual structure (prediction, disposition, the circularity of choosing to be irrational), not just be a generic nerd joke with the words hitchhiker and irrational dropped in. Keep it short, a setup and a punchline. Just give the joke: start with the first line of it, no preface, and no explaining the punchline afterwards.
