answer: |-
  The wall accepts the weight of every shadow,
  Bound to the silhouette of the puppet.
  Behind the back, the artificial fire.
  They name the passing heat the living sun.
  No essence holds, no permanent form.
  There is no memory of a return.

  The painful climb begins the slow return.
  Eyes wean themselves from comfort of the shadow.
  To seek the cause that stabilizes form.
  Seeing the arm that manipulated puppet.
  Until the mouth of cave reveals the sun.
  And shames the flicker of the inner fire.

  What burns outside is kin to cave's fire,
  But grants the vision needed to return.
  Source of the seeing, father of the sun.
  Where even truth projects a faint shadow.
  Is nature just a higher kind of puppet?
  Or does the real exist without a form?

  Beyond the grasp of any single form.
  The Good exceeds the fuel and the fire.
  No artifact dragged like a puppet.
  It makes the way possible to return.
  Beyond the split of substance and of shadow.
  More old than light, ancestor of the sun.

  To speak of this is like speaking of sun.
  We cut the silence into distinct form.
  But logic casts its own elongated shadow.
  Words are a mimicry of inner fire.
  This is the burden of the forced return.
  To teach is pulling strings on the puppet.

  The freed man takes the stick, moves the puppet.
  Describing colors born of absent sun.
  He knows the risk inherent in return.
  Trying to draw the line of perfect form.
  Using the dimness of the common fire.
  Knowing all speech is merely painted shadow.

  No hand is free who moves the speaking puppet,
  Even when pointing toward the blinding sun.
  This descent is the truest kind of return;
  For language cannot hold the living form.
  It borrows light from some distant fire,
  And wraps the naked truth in shadow.
