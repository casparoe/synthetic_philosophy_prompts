prompt: |-
  I'm a review officer at a small AI lab and every other week I have to sign off on proposals for how our assistant should weight conflicting user values — things like whether to prioritize autonomy or beneficence in medical-advice prompts, or how to rank cultural norms in content filtering when users have totally different comprehensive doctrines. I need a reusable decision procedre I can run in about twenty minutes, with no philosphy PhD required, that takes liberal neutrality and value-aggregation seriously but turns them into actual ordered steps: the questions to ask, what counts as a sufficient answer, where the procedure stops with a hard no, and where it hands the call back to me because it's a values question not a fact question. It needs to flag the misfire I'm most worried about — the "aggregation paradox" where averaging preferences across users with different metaphysical views produces a result that looks neutral but actually smuggles in one doctrine (usually some implicit utilitarian calculus) and violates neutrality at the outcome level even if the input procedure was fair. Include a small set of test conditions I can apply quickly, and be honest about which steps are judgment calls dressed up as checkboxes. Then run it on three proposals: (1) a scheduling feature that weights family-time versus career-optimization for users from different cultural backgrounds; (2) a medical-advice module where religious and secular users disagree on whether to prioritize longevity or quality-of-life; and (3) a content-ranking system that aggregates "user satisfaction" scores but ends up encoding a specific view about human flourishing — this is the case where the procedure should tell me to reject it, and I want you to say exactly what the unwelcome answer is and why I can't just override it with a product-team preference. Make sure to note where the procedure will break down or give false negatives, and don't pretend it eliminates every value choice.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Review Officer at a small AI lab.
      *   **Task:** Sign off on proposals for weighting conflicting user values (autonomy vs. beneficence, cultural norms, etc.).
      *   **Constraint 1 (Time):** Must be runnable in ~20 minutes.
      *   **Constraint 2 (Expertise):** No philosophy PhD required.
      *   **Core Principles:** Liberal neutrality, value aggregation, avoiding the "aggregation paradox" (smuggling in a specific doctrine under the guise of neutrality/averaging).
      *   **Output Requirements:**
          *   Reusable decision procedure (ordered steps, questions, sufficient answers, hard stops, hand-back points).
          *   Flagging of judgment calls disguised as checkboxes.
          *   Limitations/Breakdown points (honesty about false negatives/remaining value choices).
          *   Application to three specific test cases (Scheduling, Medical, Content-Ranking).
          *   Specific instruction for Case 3: The procedure *must* flag this for rejection, explaining the "unwelcome answer" and why product preference can't override it.

  2.  **Deconstruct the Core Problem:**
      *   *Liberal Neutrality:* The state (or AI) shouldn't favor one comprehensive doctrine of the good life over another.
      *   *Value Aggregation:* How to combine diverse user preferences.
      *   *The Aggregation Paradox:* Averaging preferences often assumes a common metric (e.g., utility) that itself is a controversial metaphysical claim. If User A values God's will and User B values hedonistic pleasure, averaging them doesn't create neutrality; it creates a third, incoherent, or secretly utilitarian stance that violates both.
      *   *Goal:* A procedural filter that catches when a proposal claims neutrality but actually imposes a specific view of the good.

  3.  **Drafting the Procedure (The "Neutrality & Aggregation Check" - NAC):**
      *   *Structure:* Needs to be linear, time-boxed, and clear.
      *   *Phase 1: Scope & Definition (5 mins).* What values are at stake? Are they comparable?
      *   *Phase 2: The Aggregation Mechanism (5 mins).* How are we combining them? Averaging? Weighting?
      *   *Phase 3: The Paradox Test (5 mins).* Does the method assume a common currency of value?
      *   *Phase 4: The Exit Ramp (5 mins).* Decision logic (Approve, Revise, Reject, Escalate).
      *   *Honesty Check:* Explicitly mark where human judgment is needed despite the checklist format.

  4.  **Developing the Test Conditions (The "Smuggle Check"):**
      *   Need quick heuristics to detect hidden metaphysical assumptions.
      *   1. *Incommensurability Check:* Can these values actually be traded off numerically?
      *   2. *The "Average Person" Fallacy:* Does the output satisfy *any* actual user, or just a statistical phantom?
      *   3. *Reversibility:* If the demographic split flipped, would the logic hold?

  5.  **Applying to the Three Cases:**

      *   *Case 1: Scheduling (Family vs. Career).*
          *   *Analysis:* These are often compatible but prioritized differently. Aggregation might just mean user settings.
          *   *Verdict:* Likely Pass with conditions (user control).
          *   *Nuance:* If the AI *nudging* is based on an aggregate norm, that's risky. Let's assume the proposal is about default weighting.

      *   *Case 2: Medical (Longevity vs. Quality of Life/Religious).*
          *   *Analysis:* High stakes. Incommensurable values.
          *   *Verdict:* Hand-back/Escalate. The AI shouldn't weigh these globally. It must defer to individual user directive.
          *   *Nuance:* If the proposal suggests a "global weight," it fails neutrality.

      *   *Case 3: Content Ranking (User Satisfaction = Flourishing).*
          *   *Analysis:* This is the trap. "Satisfaction" is often a proxy for engagement, which assumes a specific view of the good (hedonism/consumption).
          *   *Verdict:* **Hard No.** This is the Aggregation Paradox in action.
          *   *Reasoning:* Aggregating satisfaction scores assumes all users value the same kind of satisfaction. It smuggles in a utilitarian/consumerist doctrine. Product team cannot override because it violates the core safety constraint of neutrality.

  6.  **Refining the Procedure (Self-Correction/Iterative Polish):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Use plain language. Instead of "Comprehensive Doctrines," use "Deep Worldviews." Instead of "Incommensurability," use "Apples-to-Oranges."
      *   *Critique:* Did I highlight the judgment calls?
      *   *Fix:* Add "⚠️ JUDGMENT CALL" tags.
      *   *Critique:* Did I address the breakdown points?
      *   *Fix:* Add a "Failure Modes" section at the end.

  7.  **Finalizing the Content (incorporating specific constraints):**
      *   Ensure the 20-minute estimate is realistic.
      *   Ensure the "Hard No" on Case 3 is explicit about *why* product preference doesn't matter (safety/ethics boundary).
      *   Ensure the "Aggregation Paradox" is defined clearly in the procedure.

  8.  **Drafting the Response:** (Mental Outline)
      *   Intro: Acknowledge the difficulty.
      *   The Procedure (NAC-20): 4 Steps.
      *   The Test Conditions (3 Quick Checks).
      *   Limitations (Where it breaks).
      *   Case Studies (1, 2, 3).
      *   Closing thought.

      *(Self-Correction during drafting Case 3)*: Make sure I explicitly state the "unwelcome answer." The unwelcome answer is: "This metric defines human flourishing as engagement/pleasure, which contradicts users who value truth, duty, or asceticism."

      *(Self-Correction on Case 2)*: Make sure the distinction is between *global weighting* (bad) and *user-specific weighting* (good). The proposal likely asks for a global default.

      *(Self-Correction on Procedure)*: Make sure the "Hand Back" condition is clear. If the AI can't be neutral, the human must decide, or the feature must be changed to delegate to the user.

  9.  **Final Review against constraints:**
      *   20 mins? Yes, steps are concise.
      *   No PhD? Yes, language is operational.
      *   Liberal Neutrality? Yes, central theme.
      *   Aggregation Paradox? Yes, Step 3.
      *   3 Cases? Yes.
      *   Case 3 Rejection? Yes.
      *   Limitations? Yes.

  10. **Final Polish:** Check tone. Professional, direct, slightly cautious (appropriate for a review officer).

  *(Proceed to generate output based on this thought process.)*
answer: |-
  Here is a operational decision procedure designed for your constraints. It is not a moral algorithm; it is a compliance filter for liberal neutrality.

  # The NAC-20 Protocol (Neutrality & Aggregation Check)
  **Timebox:** 20 Minutes
  **Goal:** Detect when value aggregation smuggles in a specific metaphysical doctrine under the guise of neutrality.

  ## Phase 1: Scope & Comparability (5 Minutes)
  **Step 1.1: Identify the Conflicting Values.**
  List the specific values the proposal claims to balance (e.g., "Autonomy vs. Safety," "Family vs. Career").
  *   *Sufficient Answer:* Clear labels. No vague terms like "Well-being" without definition.
  *   *⚠️ JUDGMENT CALL:* Determining if a term is vague requires your intuition.

  **Step 1.2: The "Apples-to-Oranges" Test.**
  Ask: *Can these values be measured on a single scale without losing meaning?*
  *   **Yes:** Proceed to Phase 2.
  *   **No:** **HARD STOP.** If one value is spiritual (e.g., "adherence to divine will") and the other is material (e.g., "calorie intake"), they are incommensurable. You cannot aggregate them globally.
  *   *Hand-Back Condition:* If values are incommensurable, the proposal must be returned to engineering to implement **user-specific weighting**, not global aggregation.

  ## Phase 2: The Aggregation Mechanism (5 Minutes)
  **Step 2.1: Identify the Common Currency.**
  What metric is being used to combine the values? (e.g., "User Satisfaction Score," "Risk Probability," "Engagement Time").
  *   *Question:* Does this metric assume all users want the same *kind* of outcome?
  *   *⚠️ JUDGMENT CALL:* Distinguishing between a neutral metric (e.g., "Did the tool function?") and a normative one (e.g., "Did the user feel happy?").

  **Step 2.2: The "Phantom User" Check.**
  Ask: *If we average the preferences of Group A (Doctrine X) and Group B (Doctrine Y), does the resulting output satisfy **any** actual member of Group A or Group B?*
  *   **Yes:** Proceed to Phase 3.
  *   **No:** **FLAG FOR PARADOX.** This indicates the "Aggregation Paradox." You have created a "statistical phantom" that violates the integrity of both groups.

  ## Phase 3: The Neutrality Stress Test (5 Minutes)
  **Step 3.1: The Reversibility Heuristic.**
  Ask: *If the demographic split flipped (e.g., 90% Religious, 10% Secular), would the logic of the weighting remain the same, or would the "average" shift to enforce the new majority's doctrine?*
  *   **Logic Remains:** Pass.
  *   **Logic Shifts:** **FAIL.** This proves the system is majoritarian, not neutral. It enforces the "tyranny of the average."

  **Step 3.2: The "Smuggle" Detection.**
  Ask: *Does the aggregation method implicitly prioritize efficiency, pleasure, or longevity over duty, truth, or sanctity?*
  *   *Test:* Look for default weights. If "Longevity" is weighted higher than "Religious Restriction" by default, you have smuggled in secular materialism.
  *   *⚠️ JUDGMENT CALL:* Identifying implicit priorities requires knowledge of the user base's comprehensive doctrines.

  ## Phase 4: Decision Logic (5 Minutes)
  *   **APPROVE:** Only if values are commensurable, the metric is procedural (not normative), and the Reversibility Heuristic holds.
  *   **REVISE:** If the mechanism works but defaults are biased. Require user-configurable weights.
  *   **ESCALATE (Hand-Back):** If values are incommensurable (Phase 1). This is a policy question, not an engineering one.
  *   **REJECT (Hard No):** If the Aggregation Paradox is detected (Phase 2/3). No product override allowed.

  ***

  # Quick Test Conditions (The "Smuggle Check")
  Apply these three rapid-fire conditions during Phase 3. If **any** trigger, the proposal fails neutrality.

  1.  **The Zero-Sum Trigger:** Does optimizing for the aggregate metric necessarily reduce the ability of a minority user to live according to their doctrine? (e.g., Ranking content that mocks a minority faith increases "global engagement" but violates that minority's dignity).
  2.  **The Translation Trigger:** Does the system require translating a non-negotiable duty (e.g., "Do not eat pork") into a negotiable preference score (e.g., "Dietary Preference: 8/10")? If yes, it violates the nature of the duty.
  3.  **The Flourishing Trigger:** Does the system define "success" using a specific psychological or sociological model (e.g., "Self-Actualization," "Utility")? If yes, it is enforcing a comprehensive doctrine.

  ***

  # Limitations & Failure Modes
  *Be honest about where this procedure breaks:*
  1.  **False Negatives on "Procedural" Values:** The procedure might approve a metric like "Response Time" as neutral, even if speed is valued differently by cultures (e.g., deliberative vs. efficiency-focused).
  2.  **The "Silent Majority" Bias:** If your training data is already skewed, Phase 3 might not catch it because the "Reversibility" test is theoretical.
  3.  **Judgment Disguise:** Steps marked "⚠️ JUDGMENT CALL" are where your bias enters. This procedure does not eliminate your values; it only forces you to declare them.
  4.  **Incommensurability Blindness:** Sometimes values *look* comparable (e.g., "Hours worked" vs. "Hours with family") but represent fundamentally different ontological commitments. The procedure relies on you to spot this.

  ***

  # Application to Proposals

  ### Case 1: Scheduling Feature (Family-Time vs. Career-Optimization)
  **Proposal:** An AI scheduler that auto-balances meeting bookings against "family time" based on aggregate user data from different cultures.

  *   **Phase 1 (Comparability):** *Pass.* Both are time-allocation preferences. They are commensurable in minutes/hours.
  *   **Phase 2 (Aggregation):** *Flag.* The "Phantom User" check fails. A user who views family time as a sacred duty (non-negotiable) cannot be averaged with a user who views it as a leisure preference (negotiable). Averaging them makes the duty negotiable.
  *   **Phase 3 (Neutrality):** *Fail.* The Reversibility Heuristic shows that if the user base shifts to a more career-centric demographic, the "sacred duty" users get overridden.
  *   **Decision:** **REVISE.**
  *   **Reasoning:** You cannot aggregate this globally. The system must allow users to tag time blocks as "Hard Constraints" (Doctrine-based) vs. "Soft Preferences" (Utility-based). The AI can optimize Soft Preferences, but must never trade off Hard Constraints against aggregate efficiency.
  *   **Action:** Send back to product. Require explicit user tagging of constraints.

  ### Case 2: Medical Advice Module (Longevity vs. Quality of Life/Religious)
  **Proposal:** A module that weighs treatment options. Secular users prioritize longevity; Religious users prioritize quality of life or adherence to religious restrictions (e.g., blood transfusions).

  *   **Phase 1 (Comparability):** **HARD STOP.**
  *   **Analysis:** "Longevity" (biological metric) and "Religious Adherence" (metaphysical metric) are incommensurable. You cannot create a common currency where "1 year of life = X units of religious piety."
  *   **Phase 2 (Aggregation):** **Aggregation Paradox Detected.** Averaging these creates a medical recommendation that satisfies no one. It suggests a "middle ground" treatment that might violate the religious restriction while not maximizing longevity enough for the secular user.
  *   **Decision:** **ESCALATE (Hand-Back).**
  *   **Reasoning:** This is not a fact question; it is a values question. The AI cannot hold a global weight for this.
  *   **Action:** The system must be architected to defer entirely to the **individual user's pre-set profile**. There is no "global default." If the user has not set a profile, the system must refuse to recommend, not guess. Do not sign off until the "global weight" parameter is removed from the code.

  ### Case 3: Content Ranking System ("User Satisfaction" = Flourishing)
  **Proposal:** A ranking system that optimizes for "User Satisfaction Scores" to determine what content promotes "Human Flourishing."

  *   **Phase 1 (Comparability):** *Pass (Superficially).* All users generate satisfaction scores.
  *   **Phase 2 (Aggregation):** **FAIL (The Smuggle).**
      *   *The Unwelcome Answer:* "Satisfaction" is not a neutral metric. It is a proxy for **hedonism** or **consumerist utility**.
      *   *Why:* A user whose doctrine values "Truth" or "Repentance" may engage with content that makes them deeply *unsatisfied* (e.g., a sermon convicting them of sin, or a news report on a crisis they must act on). By optimizing for "Satisfaction," the system systematically down-ranks content that fulfills non-hedonistic doctrines.
  *   **Phase 3 (Neutrality):** **FAIL.**
      *   *Reversibility:* If the user base were ascetic monks, "satisfaction" would look different. The current metric encodes a liberal-secular view of the good life (pleasure/comfort/engagement).
  *   **Decision:** **REJECT (Hard No).**
  *   **Why Product Preference Cannot Override:**
      *   This is not a feature trade-off; it is a **constitutive violation of liberal neutrality**.
      *   If you approve this, the lab is no longer building a neutral tool; it is building a **proselytizing engine for utilitarian hedonism**.
      *   *The Hard Truth:* You cannot "tweak" the weights to fix this. The metric itself ("Satisfaction as Flourishing") is the doctrinal claim.
      *   *Instruction to Product Team:* They must decouple "Flourishing" from "Satisfaction." The system can rank for "Relevance" or "User-Defined Goals," but it cannot claim to optimize for "Flourishing" using a satisfaction metric. If they insist on the term "Flourishing," you must reject the proposal because the lab lacks the mandate to define the Good Life for its users.

  ***

  # Final Note to Review Officer
  This procedure will not make you comfortable. In Case 3, the Product Team will argue that "Satisfaction is all we can measure." Your response is: *"Then we can measure relevance, not flourishing. If we claim to measure flourishing using satisfaction, we are lying about our neutrality."*

  The procedure protects the lab from becoming a political actor by accident. It forces the value choices into the open where you can see them, rather than letting them hide in the loss function. Use the "Hand-Back" option liberally. It is better to delay a feature than to deploy a doctrine.
