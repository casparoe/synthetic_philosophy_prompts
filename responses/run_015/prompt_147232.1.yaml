answer: |-
  ### I. Dependency Order: The Logical Architecture

  Do not introduce concepts linearly as they appear in the text. Introduce them in the order required to make the next step inevitable.

  1.  **Secure the Inescapability of Participation (Before Reactive Attitudes):**
      *   **Goal:** Establish that we cannot permanently opt out of seeing others as agents.
      *   **Why:** If students believe the "objective attitude" is a viable permanent stance, reactive attitudes appear optional (like a hobby). You must demonstrate that viewing humans purely as objects of social policy is psychologically impossible to sustain in face-to-face interaction.
      *   **Checkpoint:** Students must agree that *trying* to view a loved one objectively feels like a loss of the relationship, not a gain in accuracy.

  2.  **Secure the Communicative Function of Resentment (Before Distinguishing Objective Attitude):**
      *   **Goal:** Define resentment not as a feeling (pain/anger) but as a *demand for regard*.
      *   **Why:** If resentment is merely an emotional reaction, the "objective attitude" becomes merely "cool-headedness" or emotional regulation. You must establish that resentment is a moral protest.
      *   **Checkpoint:** Students must grasp that to withdraw resentment is not to "calm down," but to withdraw a claim on the other's goodwill.

  3.  **Secure the Primacy of Practice Over Metaphysics (Before Discussing Determinism):**
      *   **Goal:** Establish that our practices of blaming do not wait for metaphysical justification.
      *   **Why:** If they think responsibility depends on a prior proof of freedom, Strawson looks like a compatibilist trying to "save" responsibility. You must show the practice comes first; the metaphysics is secondary.
      *   **Checkpoint:** Students must admit they already hold people responsible without having solved the free will problem.

  ---

  ### II. The Carrying Example: The Opaque Hiring Algorithm

  **The Scenario:**
  A hiring algorithm rejects Candidate A. Candidate A is objectively qualified. The rejection causes significant financial harm. The weighting error is opaque (deep learning black box); no single line of code caused it, and no human reviewer can trace the specific decision path. The design team followed standard industry protocols but failed to audit for this specific bias.

  **Required Inclusions:**
  *   **Opacity:** No single causal chain can be pointed to. This blocks the "locate the villain" instinct.
  *   **Human Oversight Failure:** The team deployed it knowing limitations. This ensures there is *someone* to address, preventing the "it's just a machine" deflection.
  *   **Direct Harm:** The stakes must be high enough to warrant resentment, not just annoyance.

  **Required Exclusions:**
  *   **Malicious Intent:** Do not allow a scenario where a programmer explicitly coded bias. This triggers retributive instincts that bypass the need for Strawson.
  *   **Single Identifiable Wrongdoer:** Do not let them pin it on the CEO. The responsibility must be diffuse enough to make the "Who do we resent?" question difficult.

  **Why the "Friend's Betrayal" Fails for This Audience:**
  For philosophy undergrads and CS grads skeptical of folk psychology, a friend breaking a promise presupposes the very agency they doubt. They will immediately retreat into metaphysics ("Did the friend *really* choose?"). The algorithm case forces the question: *We know the system is determined/causal, yet we still feel a demand for explanation.* It mirrors their skepticism (humans are just complex algorithms) to show that even if that's true, the *reactive stance* persists. The algorithm case makes the "Quality of Will" visible in a way the betrayal case obscures with emotional noise.

  ---

  ### III. Misconceptions and Interceptions

  **1. Misconception: Reactive attitudes are switchable emotional states.**
  *   **When it surfaces:** Minute 20, when you ask, "Can we just choose not to be resentful?"
  *   **Interception:** Do not argue about emotional control. Argue about *intelligibility*. Ask: "If you stop resenting the design team, do you still see them as colleagues capable of understanding your complaint, or as patients to be managed?" Force the choice: Participation or Objectification.

  **2. Misconception: The Objective Attitude is just clinical analysis.**
  *   **When it surfaces:** Minute 45, when distinguishing the two attitudes.
  *   **Interception:** Use the "Therapist vs. Friend" analogy. A therapist uses the objective attitude to help; a friend uses the reactive attitude to relate. If you treat your friend like a patient during an argument, you haven't become "more rational"; you have ended the friendship. The objective attitude is not an upgrade; it is a suspension of ordinary human relations.

  **3. Misconception: Determinism forces us to adopt the Objective Attitude.**
  *   **When it surfaces:** Minute 60, when the CS grads argue, "If neurons are deterministic, resentment is irrational."
  *   **Interception:** Point to the room. "Do you actually feel less resentment toward someone who cuts you in line because you know their neurons are determined?" Highlight the gap between *theoretical belief* in determinism and *practical engagement*. Strawson's point is empirical: we don't actually do what the skeptic says we should.

  **4. Misconception: Strawson is offering a compatibilist rescue of responsibility.**
  *   **When it surfaces:** Minute 75, during synthesis.
  *   **Interception:** Explicitly forbid the word "compatibilism." Strawson is not arguing responsibility is *compatible* with determinism; he is arguing the debate rests on a category error. We do not need to *save* responsibility; we need to recognize it as a natural fact of human life, like language.

  ---

  ### IV. End-of-Session Diagnostic Question

  Do not ask for a summary. Ask for a judgment call that forces them to choose between metaphysical freedom and relational quality.

  **The Question:**
  > "Imagine the design team proves to you that their negligence was the inevitable result of their genetic upbringing and prior causal history. Does this proof give you a *reason* to withdraw your resentment, or does it merely give you a *cause* to shift into the objective attitude?"

  **Correct Understanding:**
  They should answer that the proof provides no *reason* to withdraw resentment (because responsibility isn't about causal origination), but it might force a psychological shift to the objective attitude (which is a loss, not a moral correction). If they say the proof *justifies* dropping the blame, they have reverted to the metaphysical view Strawson rejects.

  ---

  ### V. Explicit Exclusions

  To protect the core insight within ninety minutes, you must refuse to cover the following:

  **1. The Full Taxonomy of Reactive Attitudes (Guilt, Shame, Indignation).**
  *   **Justification:** Stick strictly to *Resentment*. Guilt and shame introduce self-relation complexities that distract from the interpersonal "Quality of Will." Indignation introduces third-party spectatorship which complicates the "participant stance." Resentment is the clearest vector for the demand for regard.

  **2. Comparison with Kantian Autonomy.**
  *   **Justification:** Your audience is already skeptical of "folk psychology." Introducing Kant invites a debate about noumenal selves and rational agency that pulls them back into the metaphysical trap Strawson is trying to dissolve. Keep the focus on human psychology, not rational idealism.

  **3. The Later Literature on Moral Luck.**
  *   **Justification:** Moral luck asks how external factors affect blame. Strawson's point is that blame is internal to the relationship regardless of outcomes. Discussing luck suggests the *extent* of responsibility is the problem, whereas Strawson argues the *framework* of responsibility is the prior fact.

  **Reason for Exclusion:**
  Including any of these legitimizes the idea that "moral responsibility" is a theoretical construct that needs patching or refining. Your goal is to show it is a natural framework that needs *describing*. Simplifying the taxonomy is not dumbing it down; it is isolating the variable required to make the transcendental argument work.

  ---

  ### VI. 90-Minute Timeline

  *   **00–15: The Algorithm Case.** Present the scenario. Ask: "Who do we blame?" Let them struggle with the lack of a single villain.
  *   **15–40: The Participant Stance.** Analyze their struggle. Introduce "Resentment" as a demand for regard. Secure the inescapability of this stance.
  *   **40–65: The Objective Attitude.** Contrast the demand for regard with managing a system. Show why this is a relational shift, not a rational upgrade.
  *   **65–80: The Determinism Objection.** Address the CS skepticism. Show that belief in determinism doesn't change practice.
  *   **80–90: Diagnostic & Close.** Pose the diagnostic question. Summarize: Responsibility is not a metaphysical status; it is the cost of admission to human relationships.
