  I need help winning a bet, and honestly I also just want to know. Me and three friends have a group chat where we argue about those runaway trolley scenarios, and one of them, Dev (he's an EMT, and annoyingly consistent), always gives a straight yes or no and then explains it. Someone told me the thing he's doing is called the double effect thing and I've read a bit about it, but I don't need the name, I need a prediction, because I bet him I could come up with a case where his own past answers don't determine what he'd say, and he doesn't know I'm asking around. His record so far: divert the trolley onto the side track where one track worker dies instead of five, he says fine, pull the lever; shove the very large stranger off the footbridge so his body stops the trolley, he says no way; surgeon kills the healthy guy in the waiting room and harvests his organs to save five, no; drop a concrete slab onto the rails to derail the trolley even though a worker is pinned under the rails and the slab will crush him, he says yes, that one's different, go ahead; blow the guy out of the mine shaft mouth with dynamite so the other five can get out before the water rises, he says no, and when someone pointed out the guy was going to drown in two minutes anyway he said that makes no difference to him; and a soldier who volunteers for a mission where he blows a bridge and can't get clear in time, saving his platoon, Dev says that's fine, but I couldn't tell whether that's because he volunteered or because his death was just a byproduct of blowing the bridge, so I don't think it settles anything.

  So here's my case. A driverless work train has lost its brakes and is ninety seconds from hitting a stalled cage with five night-shift workers in it who can't get out. The only way to stop it is the line's obstacle detection system, which triggers an emergency stop, but it's calibrated to human-sized obstacles: crates, toolboxes and rubble won't trip it, only a body will, and the train still travels far enough after the trigger to kill whatever it hit before it stops. In the signal room above the track there's a security guard, Marv, pinned under a fallen ceiling beam right over the sensor point; the beam is slipping and he'll be crushed in under a minute no matter what, and nobody can free him. He's lucid, he knows he's dying, and he says: there's a lever that drops this whole section of floor, put me down on the rails, I'm gone anyway, save those guys. If you pull it, Marv goes down with the rubble, the train hits him and trips the sensor, and the five live. I want to know what Dev says about Marv, but I want the reasoning that gets me there more than the answer.

