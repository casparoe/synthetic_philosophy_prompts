  4.  **Fleshing out the Content:**

      *   *Validation:* Start by confirming the user's suspicion. Hume is not doing Bayesian math. He is using a "force" metaphor.
      *   *Historical Nuance:* Hume distinguishes "probability of chances" (dice) from "probability of causes" (induction). He's trying to formalize the latter using the language of the former. In the 1740s, probability wasn't fully axiomatized. He's treating belief as a "lively idea" with a quantity of force.
      *   *The Math:* If I see 1000 sunrises, does that mean $P(\text{Sun rises}) = 1000/1000$? If one testimony says it didn't, is it $1000 - 1$? No. A single reliable witness can overturn many prior instances if the prior isn't *absolute*. But Hume treats uniform experience as *near* absolute.
      *   *The "Smuggling" Charge:* This is the key. By treating "uniform experience against miracles" as one side of the scale (millions of instances) and "testimony for a miracle" as the other (a few instances), he stacks the deck.
