      *   *Respect:* Treat the user as an intellectual equal who just lacks the specific philosophical lexicon.
      *   *Honesty:* Ensure I don't just flatter. Is there a weakness? Perhaps Smith implies a "common human nature" that makes the constitutional variance less of an issue for him than for us (modern neurodiversity perspective). I should mention that Smith assumes a standard human makeup, which makes your critique even more potent because it exposes that assumption.

  5.  **Self-Correction/Review during drafting:**
