answer: |-
  ### MSc Bargaining Theory: Problem Sheet 4
  **Topic:** The Kalai-Smorodinsky Solution & Individual Monotonicity
  **Time Allowed:** 60 Minutes

  **Question 1**

  Consider a two-player bargaining problem with disagreement point $d = (1, 2)$. The feasible set $S$ is convex, with a Pareto frontier composed of two linear segments:
  1.  From $(2, 6)$ to $(5, 7)$ with slope $1/3$.
  2.  From $(5, 7)$ down to $(8, 3)$ with slope $-4/3$.

  The utopia point is therefore $u = (8, 7)$.

  Now, introduce a "regulatory fallback" that expands Player A's outside option. This extends the frontier horizontally from $(8, 3)$ to $(10, 3)$ without changing Player B's maximum payoff or the disagreement point. The new utopia point is $u' = (10, 7)$.

  **Required:**
  1.  Compute the Kalai-Smorodinsky (KS) allocation for both $u$ and $u'$, showing your line-intersection work clearly.
  2.  Explain why A's payoff strictly improves after the shift even though B's maximum payoff and the frontier kink haven't moved.
  3.  Contrast both KS allocations with the Nash Bargaining Solution (NBS), highlighting exactly where scale invariance and Independence of Irrelevant Alternatives (IIA) bite differently.
  4.  Briefly discuss whether this monotonicity behaviour is normatively attractive in a real-world setting where one side's outside option improves.

  ***

  ### Model Answer

  Right then, let's crack this. First, the KS line runs from $d=(1,2)$ to the utopia point. Initially $u=(8,7)$, so the gradient is $5/7$. The line equation is $x_2 = \frac{5}{7}x_1 + \frac{9}{7}$. The relevant frontier segment is the second one, $x_2 = -\frac{4}{3}x_1 + \frac{41}{3}$. Equating them gives $15x_1 + 27 = -28x_1 + 287$, leading to $43x_1 = 260$. Thus the first allocation is $x_{KS1} = (260/43, 241/43) \approx (6.05, 5.60)$.

  After the regulatory shift, $u'=(10,7)$. The KS line flattens to a gradient of $5/9$, equation $x_2 = \frac{5}{9}x_1 + \frac{13}{9}$. Intersecting the same frontier segment yields $5x_1 + 13 = -12x_1 + 123$, so $17x_1 = 110$. Thus $x_{KS2} = (110/17, 257/51) \approx (6.47, 5.04)$.

  Why does A gain strictly? This is individual monotonicity in action. Even though B's maximum payoff (7) and the kink haven't budged, A's utopia payoff increased from 8 to10. This flattens the KS ray, pushing the intersection further along the frontier towards A's favour. B loses share because the solution normalises gains relative to the new maximums; B's claim looks weaker against A's expanded horizon.

  Contrast this with Nash. The NBS maximises the product $(x_1-1)(x_2-2)$. On this specific frontier, the peak occurs exactly at the kink $(5,7)$. The horizontal extension adds points where $x_2=3$, yielding a max product of 9, which is far below 20. So NBS stays fixed at $(5,7)$. Nash relies on Independence of Irrelevant Alternatives (IIA) and scale invariance; adding 'irrelevant' options (the horizontal tail) doesn't shift the solution. KS drops IIA to satisfy monotonicity, so it *does* shift. Nash is invariant to the utopia point, KS is defined by it.

  Normatively? It's properly tricky. KS feels intuitively fairer—if A's potential ceiling rises, A should capture some of that surplus. It rewards improved outside options. But it punishes B for A's good luck, even if B's contribution didn't change. In a regulatory setting, KS might encourage investment (A gets reward for expanded options), but NBS provides stability. If we want to incentivise expanding the pie, KS is better. If we want to protect established expectations, Nash holds firm. Depends if you value dynamic incentives or static fairness in the specific context. Some might argue B shouldn't suffer for A's regulatory win, making KS look agressive.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. KS Calculation (Original & New) [5 Marks]**
  *   **Must Hit:** Correct derivation of both intersection points ($260/43$ and $110/17$).
  *   **Common Mess-up:** Candidates often use the wrong frontier segment (Segment 1) or fail to update the KS line gradient for $u'$.

  **2. Monotonicity Explanation [5 Marks]**
  *   **Must Hit:** Explicit link between the flattened KS ray (due to higher $u_1$) and the shift in intersection point favouring A.
  *   **Common Mess-up:** Saying A gains because the feasible set got bigger, rather than referencing the utopia point shift.

  **3. Nash Contrast & Axioms [5 Marks]**
  *   **Must Hit:** Identification that NBS stays at the kink $(5,7)$ and correct citation of IIA/Scale Invariance vs. Monotonicity.
  *   **Common Mess-up:** Claiming NBS also moves, or confusing IIA with Independence of Equivalent Utility Representations.

  **4. Normative Discussion [5 Marks]**
  *   **Must Hit:** Balanced view on incentives (KS) vs. stability/protection (NBS) regarding outside options.
  *   **Common Mess-up:** Purely descriptive answer without evaluating "attractiveness" or fairness implications.
