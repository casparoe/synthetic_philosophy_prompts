answer: |-
  **The Continuation Procedure**

  1.  **Isolate Remaining Value (RV):** Ignore the original charter. What specific utility does the *next tranche* buy? If the project delivers zero utility without the prior 90% spend, state the utility of the final 10% alone. If RV is zero or unquantifiable, proceed to Step 4 (Stop). If RV is positive, proceed.
      *   *Time limit:* 5 minutes. If the team cannot define RV without referencing past spend, Chair cuts discussion.

  2.  **Adjust Remaining Cost (RC):** The Finance Officer compares the champion's current cost-to-complete against their historical variance. If the champion missed estimates on the last two tranches, the Committee doubles the stated RC for decision math. If the technical risk is unresolved, Engineers must sign off on feasibility; if they dissent, RC is treated as infinite.
      *   *Time limit:* 10 minutes.

  3.  **The Publication Test:** For any reason to continue based on reputation, partners, or policy (e.g., "co-funder will leave"), ask: "Would we print this reason as a general rule in next year's applicant guidelines?" If the answer is no, the reason is discarded as bias. If yes, it is recorded as a Policy Exception.
      *   *Time limit:* 5 minutes.

  4.  **Decision Logic:**
      *   **Definite No:** If (RC > RV) AND (Publication Test Failed). Stop discussion. Recommendation: Terminate.
      *   **Definite Go:** If (RC < RV) AND (Technical Risk Low). Recommendation: Fund.
      *   **Human Decision:** If (RC > RV) BUT (Publication Test Passed). The economic case fails, but the policy case holds. This requires Board ratification. Recommendation: Fund with Policy Exception flag.
      *   **Close-Out:** If stopping costs more than finishing (contractual penalties), fund only to terminate contracts.

  **Applications**

  1.  **Ecological Network:** RV is low (satellite data exists). RC is high (3 years remaining). Publication Test fails ("We finish obsolete tech" is unpublishable). **Verdict: Stop.** The 78% sunk cost is information that the method was slow, not a reason to continue.

  2.  **Demonstrator Plant:** RV is uncertain (technical risk unresolved). RC is high (2.5x estimate). Publication Test passes ("We honor co-funding commitments" is publishable policy). **Verdict: Human Decision.** Economic case fails, but policy stability justifies exception. Board must ratify the reputational cost.

  3.  **Personal Champion:** RV is zero (no users want output). RC is low (10% budget). Publication Test fails ("We finish useless things to save face" is unpublishable). **Verdict: Stop.**

  **Unwanted Answer:** Case 3. You will resist this because admitting the output is unwanted validates the critique that your original sponsorship was flawed. The procedure forces you to treat your own past judgment as sunk cost, identical to any other champion's.

  **Limitations and Invalidating Finding**

  This procedure cannot verify the truthfulness of the champion's numbers. Engineers and Finance Officers must rely on data supplied by those lobbying for it. The quarterly cadence means we react to lagging indicators; a project may die between reviews. Most critically, we never observe the counterfactual: we do not see what would have happened had we killed a project, nor do we track whether killed projects succeeded elsewhere with less capital. This creates a survivorship bias where continuation feels safer than termination.

  The single finding that would convince me to withdraw this procedure is evidence that projects we terminate under Step 4 are subsequently completed by other agencies or private actors at less than half our estimated Remaining Cost. This would prove our cost adjustments are punitive rather than corrective, and that our "Publication Test" is merely codifying risk aversion rather than protecting public value. If killing projects consistently creates value elsewhere, the procedure is destroying value here.
