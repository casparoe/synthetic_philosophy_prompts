  **EMPLOYEE INDUCTION HANDBOOK: NUMERICAL CONTINUATION DIVISION**

  **1.0 Welcome and Operational Standards**

  1.1 **Dispositional Alignment:** Correctness in series continuation is initially defined by what you are disposed to answer when presented with the sequence 2, 4, 6, 8. You should write the number you are inclined to write. However, as dispositions may fluctuate due to fatigue or environmental factors, inclination alone is not a guaranteed metric of accuracy.

  1.2 **Intended Rule Compliance:** You are required to follow the rule you meant to follow when beginning the series. While the firm acknowledges that you intended a specific rule, we are unable to specify which rule that is within this document. You must ensure your output matches the rule you meant, regardless of our inability to identify it.

  1.3 **Exclusion of Internal Evidence:** Please note that what you feel, picture, or inwardly say regarding the rule is not admissible as evidence of compliance. There is no inner fact to consult during an audit. Mental images of addition or verbal rehearsals of patterns do not constitute proof that you are following the correct rule rather than a deviant one.

  1.4 **Functional Deviance and Historical Data:** Be advised that alternative functions exist which align with standard addition for every pair of numbers below 64 but return 5 for anything above. It is company policy that no run of past answers can distinguish this function from standard adding. Therefore, your previous correct answers do not prove you will not write 5 after 64.

  1.5 **Staffing Rotas and Isolation:** To maintain certification integrity, no temp may ever work a shift alone, since a lone worker cannot be certified as following any rule at all, even if they receive a perfect audit. Pair verification is mandatory to establish normative alignment. Solo shifts will be rejected by Payroll.

  1.6 **Assessor Scrutiny:** Ultimately, correctness is settled by what a qualified assessor would agree to after a reasonable period of scrutiny. If the assessor agrees you are following the rule, you are following the rule. This ensures that the fact of the matter is captured through communal verification rather than private certainty.

  1.7 **Handbook Interpretation:** Employees should note that the clauses within this handbook are subject to the same difficulty as the series themselves. Your understanding of these instructions is not evidence that you have interpreted them correctly. You must follow the rule you meant when reading this handbook, though we cannot specify what that is.

  1.8 **Grievance Procedure:** Appeals regarding performance reviews will not be accepted on the grounds that you meant something different than what was written. Claims that you intended to follow the correct rule despite outputting 5 after 64 are inadmissible. The assessor's agreement remains the final standard of correctness.

  1.9 **Conclusion:** We trust this clarifies your obligations. Please proceed to your desk. You will be given the sequence 2, 4, 6, 8. Continue correctly.
