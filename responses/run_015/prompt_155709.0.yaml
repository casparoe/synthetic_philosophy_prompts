answer: |-
  You are right to feel that snag because it is the exact point where most interpretations of On Certainty either turn Wittgenstein into a relativist or try to force him back into the foundationalism he was trying to dismantle. I will say straight up that your framing risks treating hinges as a specific class of propositions with a stable ontological status, which is something Wittgenstein explicitly warns against when he says that the same proposition can harden into a hinge or fluidify into an empirical claim depending on the context. If you go looking for a rulebook that tells you definitively when a hinge is false versus when a language game is different, you are asking for a systematic theory where Wittgenstein intended only a description of usage. That said, your intuition about the difference between beyond justification and unjustified is the key to unlocking the rest, so let us pull on that thread.

  When we say a proposition is unjustified, we are speaking within the language game of giving reasons, implying that there is a lack of evidence where evidence could theoretically exist. It is an empirical deficit. But when Wittgenstein says a hinge is beyond justification, he means it functions as the scaffolding that makes the practice of justification possible in the first place. It is not that we have looked for reasons and found none; it is that the proposition operates as a rule of grammar rather than a move within the game. To treat the age of the earth as a hinge is not to say we are too lazy to check the rocks, but that checking the rocks presupposes a temporal framework where the earth has a history. If you treat it as unjustified, you are still treating it as an empirical hypothesis that happens to be unsupported, but if you treat it as beyond justification, you are recognizing it as the background against which support is measured. This distinction matters because it shifts the error from epistemic negligence to grammatical confusion.

  Now regarding your flat earth example, this is where the rubber meets the road and where you have to be careful not to let Wittgenstein slide into a cozy relativism where every framework is equally valid. If an isolated group treats the flatness of the earth as a hinge, Wittgenstein would not simply say they are playing a different game and leave it at that. He would look at what they do with that certainty. Hinges are not just mental attitudes; they are embedded in action. Our hinge that the earth is old is woven into a massive system of practices involving geology, travel, astronomy, and history that consistently yields successful predictions and navigational outcomes. If the flat earth group treats their hinge as immutable but their corresponding practices lead to constant friction with the world, say in navigation or physics, then their hinge is not functioning as a stable riverbed. It is shifting sand. Wittgenstein allows us to say their hinge is false not because we have a God's eye view of reality, but because their picture of the world does not hold up under the pressure of acting within it.

  So to answer your question about whether it is a different game or a corrupted hinge, the distinction is less important than the practical consequence. Wittgenstein would likely say that if their hinge prevents them from engaging with the shared techniques of verification that bind our form of life, they are effectively outside our language game, but that does not grant their game immunity from criticism. We can call it false because the concept of truth here is not internal coherence but successful orientation in the world. The idea that falsity collapses outside the framework is a misunderstanding of Wittgenstein's later work. He does not seal language games off from one another like monads; they overlap and interact through human activity. If their hinge leads to actions that fail, we are entitled to say they are wrong, not just different. The hinge is not immune to truth values because it is not a metaphysical absolute; it is a practical necessity, and if the practice fails, the necessity dissolves.

  Ultimately, the confusion arises if you think Wittgenstein is offering a new epistemology to replace the old one. He is not. He is showing that certainty is not a mental state or a justified belief but a way of acting. When you ask if we can call their hinge false, you are asking for a judgment from within our system, and of course we must judge from within our system. We cannot step outside our own hinges to evaluate theirs neutrally. But that does not mean we cannot judge them at all. We judge them by the standard of our own certainty, which is validated by its utility in our shared life. So your snag is real, but the solution is not to find a higher rule to distinguish true hinges from false ones. The solution is to recognize that the validity of a hinge is found in the flow of life it supports, and if a hinge stops the flow, it is not a hinge but an obstacle. Wittgenstein gives us permission to trust our certainties not because they are infallible, but because doubting them would bring the language game to a halt, and in the case of the flat earth, accepting it would bring the practice of navigating the world to a halt. That is how we know the difference, not by logic, but by life.
