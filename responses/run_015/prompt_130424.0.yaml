answer: |-
  Your commitments form a logically consistent hard incompatibilist framework, though the pragmatic stability of maintaining retributive intuitions while denying their metaphysical basis is your only significant vulnerability.

  Regarding (5) and (1), there is no tension because you correctly identify that causal openness (indeterminacy) does not satisfy the *causa sui* requirement; randomness adds no more control than determinism does, so your rejection of desert remains intact. Regarding (2) and (3), the tension is only apparent and easily resolved by distinguishing between forward-looking legal liability (deterrence, safety, compensation) and backward-looking moral desert; you can consistently hold corporations liable for social utility without believing they metaphysically deserve blame. The conflict between (4) and (1) is the most severe because it invokes an "illusionist" strategy where you advocate preserving intuitions known to be false, which risks psychological instability or accusations of hypocrisy if participants realize the practices are based on a useful fiction rather than truth.

  **Ranking of Tensions:**
  1.  **(4) vs (1):** Moderate severity (pragmatic/psychological stability).
  2.  **(2) vs (3):** Low severity (semantic clarification needed on "duties").
  3.  **(5) vs (1):** No tension (conceptually aligned).

  **Cheapest Revision:**
  Modify (4) to state that we should preserve the *practices* of holding responsible while *reinterpreting* the intuitions as forward-looking signals rather than retributive urges, thereby avoiding the claim that we should sustain intuitions that presuppose a known falsehood.
