  1.  **Analyze the Request:**
      *   **Task:** Mark a student's short-answer response (intro metaethics module).
      *   **Input:** The exam question (3 parts: (a) Does Division of Labour defeat CIG? (b) What does the realist need to add? (c) Assess the pragmatic tie-breaker) and the student's answer (approx. 250-300 words).
      *   **Output:** A mark out of 20, plus specific margin comments (line-by-line notes), highlighting strengths, weaknesses, and errors in reasoning.
      *   **Constraint:** Needs to look like actual margin comments, not just an overall impression. Needs to be critical but fair.

  2.  **Analyze the Question:**
      *   **Topic:** Metaethics (Companions in Guilt, Error Theory, Division of Labour, Pragmatic Vindication).
      *   **Part (a):** Does the Division of Labour (DoL) objection defeat Companions in Guilt (CIG)?
          *   *Expected Answer:* No, it doesn't *defeat* it (CIG still works against *selective* error theory), but it limits its scope (allows global error theory).
      *   **Part (b):** What must the realist add to break the tie?
          *   *Expected Answer:* An argument for why epistemic facts *exist* (or are indispensable) while moral facts don't, thereby saving epistemic facts and, by CIG, moral facts. Or an argument that global error theory is impossible/self-defeating.
      *   **Part (c):** Assess the pragmatic tie-breaker (Epistemic norms are useful, moral norms aren't).
          *   *Expected Answer:* This is controversial/weak. Why?
              *   1. Is usefulness enough for *normativity*? (Pragmatic vs. Epistemic reasons).
              *   2. Is it true that moral norms have no useful outcome? (Social coordination, etc.).
              *   3. Does pragmatic vindication save *truth* or just *acceptance*? (Fictionalism vs. Realism).
              *   4. Crucially: If epistemic facts are saved *only* pragmatically, does that save moral facts via CIG? CIG relies on *metaphysical/epistemological parity*. If epistemic facts are only "pragmatically justified" (instrumental) and not "truth-apt" in the same robust sense, the CIG link might break. Or, if the student argues moral norms *aren't* useful, that's empirically dubious.

  3.  **Analyze the Student's Answer:**
      *   **Paragraph 1 (CIG & Queerness):** Good summary of CIG. Notes the self-defeating nature of arguing for error theory without epistemic norms.
      *   **Paragraph 2 (DoL Objection):** Claims DoL doesn't defeat CIG. Argues global error theory isn't available because it removes norms of reasoning (self-defeat argument).
          *   *Critique:* This conflates Part (a) and Part (b). Part (a) asks if DoL *defeats* CIG. The student says "No... but the tie stays a tie." Then they argue global error theory is impossible. If global error theory is impossible, then CIG *succeeds* in establishing realism (by forcing acceptance of epistemic, thus moral). This is a strong point, but needs clarity.
      *   **Paragraph 3 (Pragmatic Tie-Breaker):** Claims this supplies what's missing. Argues true belief is useful (pragmatic reason). Claims moral facts have *no* parallel useful outcome. Concludes epistemic normativity is saved, moral isn't.
          *   *Critique:* **Major Error.** The question asks the realist to break the tie *in favor of realism* (saving both). The student uses the pragmatic argument to *save epistemic but kill moral*. This misunderstands the goal of the CIG realist. The CIG realist wants to save *both*. If the student argues epistemic norms are justified pragmatically but moral norms aren't, they are effectively conceding to the error theorist about morality, which undermines the CIG strategy (which relies on parity).
          *   *Also:* The claim that moral norms have "no useful outcome" is highly contentious (coordination, cooperation).
          *   *Also:* Pragmatic justification often implies instrumental rationality, not truth-aptness. If epistemic facts are only pragmatically justified, are they "facts" in the robust sense needed for CIG?

  4.  **Determine the Mark:**
      *   **Part (a):** Good understanding. CIG isn't defeated by DoL, though DoL limits scope. (5/5)
      *   **Part (b):** Okay understanding. Identifies need for asymmetry or indispensability. (4/5)
      *   **Part (c):** Significant misunderstanding. The student uses the tie-breaker to *reject* moral realism, whereas the prompt implies the realist is using CIG to *defend* moral realism. The CIG move is: Save Epistemic -> (via parity) Save Moral. The student argues: Save Epistemic (pragmatically) -> (via lack of parity) Reject Moral. This defeats the purpose of the CIG argument they just defended. Also, the claim about moral utility is weak. (2/5)
      *   **Clarity/Structure:** Clear writing, good flow. (3/5)
      *   **Total:** ~14/20. Maybe 15 if being generous on the first two parts. Let's aim for a solid 14/20 (High 2:1 / Low First range depending on cohort). Actually, the error in (c) is quite fundamental to the logic of CIG. If you break the parity, CIG fails. The student breaks the parity. So they haven't answered how the *realist* breaks the tie *to save realism*. They answered how an *instrumentalist* might break the tie to save only epistemic norms. I'll penalize (c) heavily. Let's go 13/20.

  5.  **Drafting Margin Comments:**
      *   Need to be specific.
      *   *Para 1:* Good summary. "Self-defeat" point is key.
      *   *Para 2:* Clear distinction between selective and global error theory.
      *   *Para 3:* This is where the trouble is. "Wait, if you break the parity, doesn't CIG collapse?" "Is it true moral norms aren't useful?" "Does pragmatic reason = truth?"

  6.  **Refining the Feedback:**
      *   Make sure the tone is constructive but rigorous.
      *   Ensure the line-by-line notes correspond to the text provided.
      *   Check word count constraint (student aimed for ~300, looks about right).

  7.  **Final Review of the "Pragmatic Tie-Breaker" Issue:**
      *   The prompt asks: "assess one proposed tie-breaker: we have a pragmatic reason to accept epistemic norms... whereas no comparable pragmatic story supports moral norms."
      *   The prompt asks the student to *assess* this. It doesn't explicitly say "assume this helps the realist." It asks the student to evaluate the claim.
      *   *However*, the context is Part (b): "what would the realist have to add... (c) assess one proposed tie-breaker." The implication is that this tie-breaker is proposed *by the realist* to save the day.
      *   If the student assesses it and says "Yes, this works," they are arguing that we should accept epistemic norms but *reject* moral norms.
      *   *But* the CIG argument is a *defence of moral realism*. If the tie-breaker results in moral anti-realism, the CIG defence has failed.
      *   So, a good answer should point out: If this tie-breaker works, it saves epistemic facts *at the expense of* moral facts (breaking the parity). Therefore, it undermines the CIG strategy which relies on parity to save moral facts.
      *   The student misses this tension. They say "Epistemic normativity therefore earns its keep and moral normativity doesn't, which is exactly the asymmetry the realist needs."
      *   *Correction:* The *CIG realist* needs symmetry to save morality. The *Error Theorist* wants asymmetry. The student has accidentally argued for the Error Theorist's position in part (c) while defending CIG in part (a). This is a logical inconsistency in the overall answer.
      *   I need to highlight this contradiction in the comments.

