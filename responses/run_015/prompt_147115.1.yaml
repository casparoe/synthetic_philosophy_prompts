answer: |-
  **Mark: 13/20**

  **Margin Comments:**

  **[Para 1, Line 1-4]** Good summary of the CIG move. You correctly identify that the argument turns on the parity of 'queerness' between moral and epistemic domains.

  **[Para 1, Line 5-7]** Strong point on self-defeat. If the error theorist rejects epistemic norms, they undermine the normative force of their own argument. This is the standard 'abominable conjunction' or 'self-defeat' response.

  **[Para 2, Line 1-3]** Correct: DoL doesn't *refute* CIG, it just limits its dialectical force against the global error theorist. You distinguish well between selective and global error theory here.

  **[Para 2, Line 4-6]** You argue global error theory "isn't really available" due to self-defeat. If you hold this, then CIG *does* secure realism (since we must keep epistemic, and CIG says moral comes with it). Be careful: this conflicts with your conclusion in Para 3 where you suggest we might drop moral norms.

  **[Para 2, Line 7]** "The tie stays a tie until the realist adds something." Accurate. The realist needs a reason to think epistemic facts are *more* secure than moral facts, or that rejecting both is impossible.

  **[Para 3, Line 1-3]** **Problem.** You claim the pragmatic story gives a "genuinely normative reason." Distinguish carefully: pragmatic reasons (it's useful to believe $p$) are not necessarily epistemic reasons (evidence that $p$ is true). Conflating these risks instrumentalizing truth.

  **[Para 3, Line 4-5]** **Major Error.** You claim moral norms have "no useful outcome." This is empirically dubious (e.g., moral norms facilitate cooperation/coordination). But more importantly: if moral norms *are* useful, parity is restored. If they aren't, parity breaks.

  **[Para 3, Line 6-7]** **Critical Logical Flaw.** You conclude this asymmetry is "exactly what the realist needs." But the *CIG realist* wants to save *moral* facts. If this tie-breaker saves epistemic facts but *rejects* moral facts (by breaking parity), the CIG argument fails. You have effectively argued for the Error Theorist's position in this paragraph, contradicting your defence of CIG in Para 1. The realist needs a tie-breaker that saves *both*, or shows the parity holds despite the pragmatic difference.

  **[Overall]** Clear writing and good grasp of the CIG/DoL dialectic (Parts a & b). However, Part (c) reveals a misunderstanding of the CIG realist's goal: they use parity to save morality, not to sacrifice it. By accepting the asymmetry, you undermine the CIG move you just defended.
