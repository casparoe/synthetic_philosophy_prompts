  3. The creation of branching duplicates through backups shatters the uniqueness required for traditional rights allocation, forcing society to decide whether personhood is divisible among simultaneous instances. This implies that obligations like debt or marriage vows cannot logically bind multiple distinct successors who share an equal claim to the original's identity.

  4. If rights adhere to the narrative self-model rather than the causal chain, society must validate the protagonist's subjective experience of continuity despite the metaphysical breaks in their physical existence. This shift privileges psychological coherence over historical authenticity, granting legal personhood to whatever entity successfully maintains the original's story.

  5. The gradual nature of the replacement creates a sorites paradox where no single step seems to end the person, yet the final synthetic being holds no causal tie to the original human. This ambiguity threatens the enforceability of long-term contracts or promises, as the entity fulfilling them is statistically similar but metaphysically distinct from the entity that made them.
