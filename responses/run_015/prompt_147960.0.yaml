prompt: |-
  Write the full desiderata list for any adequate theory of downward causation within the careenium framework — the system in which low-level simmball collisions form a substrate that also realizes high-level symbolic patterns, and the central question is whether those patterns genuinely push the substrate around rather than serving as epiphenomenal redescriptions. For each requirement, state the motivating case or conceptual pressure behind it: (a) the physical-consistency conditions the theory must satisfy (conservation laws, prohibition on non-physical forces, compatibility with statistical mechanics of the substrate); (b) the explanatory distinctions it must preserve — specifically between genuine causal influence, supervenient correlation, and mere explanatory relevance at the symbol level, and between substrate autonomy and pattern governance; (c) the predictive or phenomenological cases it must handle, such as trajectory configurations whose outcomes are predictable from symbol-state descriptions but not readable off local ball-to-ball dynamics alone; (d) which anti-reductionist commitments are non-negotiable (e.g., that symbolic steering not be explained away entirely) and which are camp preferences (e.g., whether symbol-level laws must be strictly autonomous or merely derivable); and (e) whether a core triad — simultaneous satisfaction of substrate closure, non-epiphenomenal symbolic steering, and derivability of high-level regularities — is jointly unsatisfiable, and if so, which single requirement does the most damage to rival theories. Briefly score three stances against the list: a strict substrate-only reductionism, a strong emergentist view that treats symbol-patterns as autonomous causal agents, and a middle "pattern-debt" account that treats symbolic dynamics as causally relevant only through deferred substrate obligations. Do not include bibliographies, citations, or reading lists; the evaluation should stand on conceptual grounds alone.
