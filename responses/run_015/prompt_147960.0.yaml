          2.  Non-epiphenomenalism (Symbols do work).
          3.  Derivability (Symbols come from substrate).
          *   *Tension:* If 1 is true, how can 2 be true without overdetermination? If 3 is true, is 2 just an illusion?
          *   *Damage:* Usually, "Non-epiphenomenalism" is the casualty for reductionists, "Closure" for dualists, "Derivability" for strong emergentists.

