  # Desiderata for Downward Causation in the Careenium

  The Careenium is a closed mechanical system comprising a vast number of elastic "simmballs" bouncing within a bounded chamber. Low-level collisions constitute the physical substrate; stable, recurring configurations of these balls constitute high-level "symbols." The central theoretical challenge is to account for downward causation: how the arrangement of symbols (the pattern) constrains or directs the trajectory of the simmballs (the substrate) without violating the laws governing the substrate.

  The following is the full desiderata list for any adequate theory of downward causation within this framework.

  ## I. The Desiderata List

  ### (a) Physical-Consistency Conditions
  A viable theory must not treat the Careenium as a magical system. It must respect the hard constraints of the substrate physics.

  1.  **Conservation Adherence:** The theory must not posit that symbolic interactions add or subtract energy or momentum from the system. Any "push" exerted by a symbol must be accounted for by the kinetic energy of the constituent simmballs.
      *   *Motivating Pressure:* Violation implies a "ghost in the machine" dynamic where patterns generate energy ex nihilo, rendering the system physically impossible.
  2.  **No Non-Physical Forces:** The theory cannot introduce forces that act on simmballs but are not reducible to contact mechanics or fields defined at the substrate level.
      *   *Motivating Pressure:* Introducing a "symbolic force" distinct from physical force creates a dualistic ontology that breaks the unified mechanics of the Careenium.
  3.  **Statistical Compatibility:** The theory must be compatible with the statistical mechanics of the substrate (e.g., entropy increase, microstate multiplicity). Symbolic stability must be explainable as a low-entropy island maintained by substrate dynamics, not in spite of them.
      *   *Motivating Pressure:* If symbols persist against the statistical grain without a substrate mechanism, the theory violates thermodynamic principles.

  ### (b) Explanatory Distinctions
  The theory must discriminate between different types of relationships between levels to avoid category errors.

  4.  **Causal Influence vs. Supervenient Correlation:** The theory must distinguish between a symbol *making* a ball move (influence) and a symbol merely *tracking* a ball's movement (correlation).
      *   *Motivating Pressure:* Without this, downward causation collapses into epiphenomenalism, where symbols are just shadows cast by the balls.
  5.  **Explanatory Relevance vs. Causal Efficacy:** The theory must separate cases where a symbol is useful for *predicting* an outcome (relevance) from cases where the symbol is ontologically responsible for the outcome (efficacy).
      *   *Motivating Pressure:* A map is not the territory. High-level predictability does not guarantee high-level causality.
  6.  **Substrate Autonomy vs. Pattern Governance:** The theory must specify the boundary where substrate dynamics run freely versus where pattern constraints bind them.
      *   *Motivating Pressure:* If the substrate is fully autonomous, patterns are inert. If patterns fully govern, the substrate is irrelevant. A coherent theory must define the handoff.

  ### (c) Predictive and Phenomenological Cases
  The theory must handle specific scenarios that stress the relationship between levels.

  7.  **The Irreducibility Case:** The theory must account for trajectory configurations where the outcome is predictable from the symbol-state description (e.g., "Logic Gate A activates Gate B") but is computationally intractable or opaque when analyzed solely via local ball-to-ball dynamics.
      *   *Motivating Pressure:* If high-level descriptions offer no predictive compression or insight over low-level tracking, the symbolic level is explanatorily redundant.
  8.  **The Counterfactual Case:** The theory must handle scenarios where, had the symbolic pattern been different (while keeping substrate physics constant), the subsequent substrate trajectory would have diverged.
      *   *Motivating Pressure:* This tests whether the pattern is doing work. If changing the pattern description doesn't change the physical outcome, the pattern is causally inert.
  9.  **The Stability Case:** The theory must explain how symbols maintain their integrity against substrate noise (thermal jitter of simmballs) without invoking external stabilization.
      *   *Motivating Pressure:* Downward causation often manifests as error correction or homeostasis; the theory must explain how the pattern enforces this on the balls.

  ### (d) Anti-Reductionist Commitments
  The theory must declare its stance on the reality of the high-level.

  10. **Non-Negotiable: Symbolic Steering:** It is non-negotiable that symbolic dynamics are not *entirely* explained away. The patterns must have some role in "steering" the system's evolution that is not captured by saying "the balls just bounced."
      *   *Motivating Pressure:* Total elimination of symbolic agency renders the concept of "computation" or "thought" (if the Careenium models a mind) illusory.
  11. **Camp Preference: Law Autonomy:** It is a matter of preference whether symbol-level laws are strictly autonomous (axiomatic at the high level) or merely derivable (compressed descriptions of low-level laws).
      *   *Motivating Pressure:* Strong emergentists prefer autonomy; compatibilists prefer derivability. Both can satisfy the core requirements if handled carefully.
  12. **Camp Preference: Ontological Weight:** It is a matter of preference whether symbols are granted full ontological status (they exist as objects) or functional status (they exist as processes/constraints).
      *   *Motivating Pressure:* This determines the metaphysical cost of the theory but does not necessarily impact its predictive power.

  ### (e) The Core Triad Analysis
  The theory must address the tension between three jointly demanding requirements:
  1.  **Substrate Closure:** Every physical event has a sufficient physical cause within the substrate.
  2.  **Non-Epiphenomenal Steering:** Symbolic patterns exert genuine causal influence on the substrate.
  3.  **Derivability:** High-level regularities are ultimately grounded in and derivable from low-level laws.

  **Is the Triad Jointly Unsatisfiable?**
  Strictly speaking, yes, under a naive definition of "causal influence." If Substrate Closure is true, the physical cause is sufficient. If the physical cause is sufficient, there is no "room" for the symbol to add influence without overdetermination.
  *   **The Damage Dealer:** The requirement that does the most damage to rival theories is **Non-Epiphenomenal Steering**.
      *   *Reductionism* sacrifices this to save Closure and Derivability.
      *   *Strong Emergentism* sacrifices Closure (or Derivability) to save Steering.
      *   *Compatibilist/Middle* theories must redefine "causation" (e.g., as constraint or information) to save all three, risking conceptual ambiguity.

  ---

  ## II. Evaluation of Stances

  The following scores three prominent stances against the desiderata list.
  **Scoring Key:** **PASS** (Satisfies condition robustly), **FAIL** (Violates condition), **STRAIN** (Satisfies only by redefining terms or accepting significant costs).

  ### 1. Strict Substrate-Only Reductionism
  *View: Only simmballs exist. Symbols are useful fictions for observers.*

  | Desideratum Category | Score | Analysis |
  | :--- | :--- | :--- |
  | **(a) Physical-Consistency** | **PASS** | Perfectly respects conservation laws and substrate mechanics. No magic forces introduced. |
  | **(b) Explanatory Distinctions** | **FAIL** | Collapses causal influence into correlation. Cannot distinguish pattern governance from substrate autonomy because it denies the former exists. |
  | **(c) Predictive Cases** | **STRAIN** | Acknowledges predictive utility of symbols but denies they reflect real causal structure. Struggles to explain why symbolic prediction is robust if patterns are arbitrary. |
  | **(d) Anti-Reductionist** | **FAIL** | Violates the non-negotiable commitment to Symbolic Steering. Explains symbols away entirely. |
  | **(e) Core Triad** | **PASS** | Satisfies Closure and Derivability easily. Sacrifices Steering to resolve the triad. |

  **Verdict:** Physically safe but explanatorily impoverished. It solves the metaphysical problem by denying the phenomenon (downward causation) exists.

  ### 2. Strong Emergentist View
  *View: Symbol-patterns are autonomous causal agents with powers not reducible to simmballs.*

  | Desideratum Category | Score | Analysis |
  | :--- | :--- | :--- |
  | **(a) Physical-Consistency** | **FAIL** | High risk of violating conservation laws. If symbols push balls, where does the energy come from? Requires "downward forces" not present in substrate physics. |
  | **(b) Explanatory Distinctions** | **PASS** | Clearly distinguishes causal influence from correlation. Symbols are genuine agents. |
  | **(c) Predictive Cases** | **PASS** | Fully accounts for symbolic predictability as a reflection of symbolic power. |
  | **(d) Anti-Reductionist** | **PASS** | Maximally satisfies Symbolic Steering and Law Autonomy. |
  | **(e) Core Triad** | **STRAIN** | Saves Steering but breaks Substrate Closure. Must argue physics is not causally closed, which contradicts the Careenium's definition as a closed mechanical system. |

  **Verdict:** Explanatorily rich but physically incoherent within the defined framework. It saves the phenomenon by breaking the physics.

  ### 3. Middle "Pattern-Debt" Account
  *View: Symbols are real constraints. They do not add energy but channel existing substrate energy via structural obligations (like a groove guiding a needle).*

  | Desideratum Category | Score | Analysis |
  | :--- | :--- | :--- |
  | **(a) Physical-Consistency** | **PASS** | Respects conservation. Symbols act as boundary conditions or constraints, not force-generators. Energy remains in the balls. |
  | **(b) Explanatory Distinctions** | **PASS** | Distinguishes "triggering" (substrate) from "structuring" (pattern). Pattern governance is the imposition of constraints on substrate autonomy. |
  | **(c) Predictive Cases** | **PASS** | Accounts for symbolic predictability via the stability of the constraints. Handles counterfactuals by altering the constraint structure. |
  | **(d) Anti-Reductionist** | **PASS** | Satisfies Symbolic Steering (constraints are real) without requiring full Law Autonomy (constraints are realized by balls). |
  | **(e) Core Triad** | **STRAIN** | Attempts to satisfy all three by redefining causation as "constraint" rather than "production." The strain lies in proving constraints are ontologically robust enough to count as "causes" without being mere descriptions. |

  **Verdict:** The most viable candidate for the Careenium. It preserves physical closure while granting genuine efficacy to patterns by treating them as structural constraints rather than independent force sources. The "debt" is paid in the specific configuration of the substrate required to maintain the pattern.

  ## III. Conclusion on the Core Triad

  The Core Triad (Closure, Steering, Derivability) is jointly unsatisfiable only if "causation" is defined univocally as "energy transfer." If causation is expanded to include "informational constraint" or "channeling," the triad becomes satisfiable, but at the cost of conceptual precision.

  The requirement that does the most damage to rival theories is **Non-Epiphenomenal Steering**.
  *   For the **Reductionist**, admitting Steering forces them to abandon the simplicity of a closed physical world.
  *   For the **Emergentist**, denying Steering (to save physics) destroys their entire ontological project.
  *   For the **Pattern-Debt** theorist, Steering is the tightrope; if they lean too hard into constraint, they look like Reductionists; if they lean too hard into agency, they look like Emergentists.

  Therefore, an adequate theory of downward causation in the Careenium must define Steering not as the *generation* of motion, but as the *selection* of permissible motions from the substrate's repertoire. This satisfies physical consistency while preserving the reality of the symbol.
