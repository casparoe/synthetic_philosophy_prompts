  2.  **Analyze the "Careenium" Framework:**

      *   *What is it?* A closed physical system. Simmballs bounce elastically. Clusters of balls form stable shapes (symbols).
      *   *The Problem:* If physics is closed at the bottom (balls obey Newton/Quantum), how can the "symbol" (a pattern of balls) exert force? If it does, does it violate conservation of energy? If it doesn't, is consciousness/meaning epiphenomenal?
      *   *Goal:* Define what a *good* theory of downward causation looks like here.

  3.  **Drafting the Desiderata (Section by Section):**

      *   *(a) Physical-Consistency:* Must not break physics. Energy/momentum conserved. No "ghost forces." Must align with statistical mechanics (entropy, microstates).
      *   *(b) Explanatory Distinctions:* Need to separate "A made B happen" from "A correlates with B" from "A helps us understand B." Also, distinguish when the balls run the show vs. when the pattern constrains the balls.
      *   *(c) Predictive Cases:* The "Smoking Gun." Cases where knowing the symbol tells you the future better/faster than tracking every ball, *and* where the symbol seems to make a difference (e.g., a logic gate implemented in balls).
