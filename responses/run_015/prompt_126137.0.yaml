      *   Does this match the prompt's request? "What's the one extra scenario... that'd actually split them apart."
      *   Yes. This scenario (often called "Pain without Pain" or "Reflexive Nociception without Qualia") is the classic philosophical splitter between Hedonism and Functionalism about pain's badness.

