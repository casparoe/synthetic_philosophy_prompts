      *   *Prediction:* She will likely call the New Case **Bad**. Why? Because in every previous instance where *suffering* was present, she deemed it bad, regardless of tissue damage (Phantom) or utility. The fact that they don't avoid it is weird, but the *experience* is one of suffering.
