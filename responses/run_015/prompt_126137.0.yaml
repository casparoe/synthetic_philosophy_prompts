answer: |-
  Based on her track record, your colleague is running a **Pure Affective Badness** framework (Philosophical Hedonism about Pain). She separates the *sensory signal* (nociception/representation) from the *affective tone* (suffering), and she locates the "badness" exclusively in the latter.

  Here is the breakdown of her likely call, the rule analysis, and the scenario that would expose her true commitments.

  ### 1. Her Call on the New Case
  **Verdict: Bad (and should be treated).**

  Despite the lack of tissue damage, the lack of behavioral avoidance, and the patient's intellectual knowledge that the pain is "false," the patient reports **intense suffering**.
  *   In **Phantom Limb**, she ruled "Bad" based on vivid suffering despite zero tissue damage.
  *   In **Asymbolia**, she ruled "Not Bad" based on zero suffering despite the sensory burn.
  *   In **Adapted Chronic**, she ruled "Not Clearly Bad" because the suffering had vanished (adaptation), leaving only the signal.

  Since the new case features **intense suffering**, consistency demands she classify it as bad. The fact that the suffering is "irrational" (no avoidance, known false model) does not negate the intrinsic badness of the experience itself under her current logic.

  ### 2. Analysis of the Three Rules
  Here is how the three candidate ethical frameworks predict the verdicts for the **New Case** (Suffering + No Avoidance + False Model) and how well they fit her **Track Record**.

  | Rule | Core Principle | Prediction on New Case | Fit with Track Record |
  | :--- | :--- | :--- | :--- |
  | **Pure Affective Badness** | Pain is bad *iff* it involves conscious suffering (qualia of hurt). | **Bad.** (Suffering is present). | **Perfect.** Explains why Migraine/Phantom (Suffering) are bad, and Asymbolia/Adapted (No Suffering) are not. |
  | **Functional-Interference** | Pain is bad *iff* it disrupts agency, avoidance behavior, or life function. | **Not Bad.** (Patient doesn't avoid or seek relief; function is intact). | **Poor.** Struggles to explain why Phantom Limb is "Bad" if the patient isn't necessarily avoiding use of the limb, or why Adapted Chronic is "Not Bad" despite the signal persisting. |
  | **Representational Fit** | Pain is bad *iff* it accurately signals damage or creates a true model of threat. | **Ambiguous/Not Bad.** (The model is known to be false and doesn't update behavior). | **Fails.** She called Phantom Limb "Bad," which is a representational error (false signal of damage). If false representation made pain "not bad," Phantom Limb would be neutral. |

  **Winner:** **Pure Affective Badness.** Her verdicts consistently track the presence of *suffering*, ignoring tissue damage (Phantom vs. Migraine) and behavioral utility (Asymbolia vs. Adapted).

  ### 3. The Crucial Test Case (The Splitter)
  To definitively prove she is an Affective Hedonist and not a covert Functionalist, you need a case where **Function is ruined, but Suffering is absent.**

  **The Scenario:**
  > A patient has a **reflexive nociceptive withdrawal** that ruins their life. For example, their arm violently jerks away whenever they try to hug their child or hold a tool, causing them to lose their job and relationships. However, due to a specific neurological dissociation, they report **zero conscious feeling**. No hurt, no distress, no "ouch." It is mechanically identical to Pain Asymbolia, but the *reflex* is hyper-active rather than absent. They describe it as "my arm moves on its own," not "it hurts."

  **Why this splits the theories:**
  *   **Pure Affective Badness (Her likely view):** **Not Bad.** There is no suffering. It is a mechanical glitch, like a tic. Treat it to restore function, but not because the experience itself is intrinsically evil.
  *   **Functional-Interference:** **Bad.** The condition prevents flourishing and agency. It functions exactly like pain in terms of life disruption, so it counts as a "bad pain state."
  *   **Representational Fit:** **Bad.** The body is representing a threat that isn't there and acting on it, creating a false model of the world, even if consciousness isn't updated.

  **The Tell:**
  If she says **"That's a tragedy, but the pain itself isn't bad, just the outcome,"** she is confirmed as a **Pure Affective Hedonist**.
  If she says **"That counts as bad pain and needs treating for its own sake,"** she is actually a **Functionalist** and her previous verdicts on Phantom/Adapted pain were contingent on assumed functional loss.

  Given her explicit distinction on the Adapted Chronic case ("inconvenient but not clearly bad"), I bet she calls the Splitter **Not Bad**.
