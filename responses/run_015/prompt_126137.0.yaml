      *   *Why this splits them:*
          *   **Affective Badness:** No suffering = **Not Bad.** (Like Asymbolia).
          *   **Functional Badness:** Ruins life/avoidance = **Bad.** (Needs treatment to restore function).
          *   **Representational:** Depends on if the reflex implies a false threat model.
      *   *Wait, I need to check if this splits the specific theories I identified.*
      *   If she is **Pure Affective**, she says "Not Bad" (no suffering).
