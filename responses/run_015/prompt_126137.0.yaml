      *   *Hypothesis:* If she is a pure **Affective Hedonist** (Suffering is intrinsically bad), she must call this Bad. If she is a **Functionalist** (Pain is bad because it stops you doing things), she might call this Not Bad. If she is a **Representationalist** (Pain is bad because it lies about damage), she might call this Not Bad (since they know it's a lie).
      *   *Re-evaluating the Track Record:*
          *   Asymbolia (No suffering) $\rightarrow$ Not Bad.
          *   Adapted Chronic (No suffering) $\rightarrow$ Not Bad.
          *   Phantom (Suffering) $\rightarrow$ Bad.
          *   Migraine (Suffering) $\rightarrow$ Bad.
