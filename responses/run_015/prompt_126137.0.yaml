      *   The prompt asks: "What's her call?" on the New Case (Intense suffering, false model, no avoidance).
      *   Based on the track record (Suffering = Bad in Migraine/Phantom; No Suffering = Not Bad in Asymbolia/Adapted), she is committed to **Affective Badness**.
