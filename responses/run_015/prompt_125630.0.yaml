answer: |-
  ### Dependency Map: The Logical Scaffolding

  Before sequencing the lecture, here is the dependency structure. You cannot teach the "double-bind" unless students accept these relations in order:

  1.  **Argument Recognition:** Students must accept that policy recommendations are logical arguments (Premises → Conclusion), not just vibes.
  2.  **Validity Check:** They must agree that a conclusion cannot contain information not present in the premises (the "no free lunch" rule of logic).
  3.  **Fact/Value Distinction:** They must agree that "what is happening" (stats) is categorically different from "what we should do" (commands).
  4.  **Instrumental Rationality:** They must understand that science *can* connect Is to Ought *if* an Ought is already assumed (the "If-Then" rescue).

  If you skip #1, they think you're nitpicking. If you skip #4, they think you're anti-science. The arc must traverse 1→4 without collapsing them.

  ---

  ### The Committed Teaching Plan

  **Total Time:** 75 Minutes
  **Core Example:** The Gentrification Algorithm (Your scenario, slightly sharpened).
  **Why this example:** It mimics "evidence-based policy," which is where this error lives in the wild. It uses a high-confidence statistic (94% accuracy) to seduce them into skipping the value judgment.
  **What it must have:** A clear descriptive premise (The algorithm predicts X), a clear normative conclusion (We must do Y), and a metric that sounds good but isn't moral (Accuracy/Efficiency).
  **What it must lack:** Emotional loading on the outcome *during the logical analysis*. Do not let them debate whether gentrification is good or bad yet. If they debate the morality of gentrification, they miss the structural error. The error is inferring *action* from *prediction*, regardless of the action's content.

  #### Phase 1: The Trap (0–15 mins)
  **Action:** Present the City Council argument on a slide exactly as a rational actor would give it.
  *   *Premise 1:* Our algorithm predicts neighborhood gentrification with 94% accuracy.
  *   *Premise 2:* [Hidden]
  *   *Conclusion:* Therefore, the City ought to direct infrastructure investment to these neighborhoods.

  **Task:** Ask the room: "Is this a sound policy argument?" Most will nod because the stat is impressive and the action sounds proactive.
  **Pedagogical Move:** Do not correct them yet. Let them feel the slide. This validates their intuition that data *should* drive policy, setting up the friction for later.

  #### Phase 2: The X-Ray (15–30 mins) — *Head Off Misconception #1*
  **Action:** Strip the rhetoric. Write it on the board as a syllogism.
  *   P1: Algorithm predicts gentrification in Zones A, B, C. (IS)
  *   C: Therefore, Invest in Zones A, B, C. (OUGHT)

  **Question:** "Where is the bridge? How did we get from 'predicts' to 'ought to invest'?"
  **The Reveal:** They must supply the hidden premise: *"We ought to invest wherever gentrification is predicted."*
  **Misconception Interception (Hume vs. Moore Conflation):** Students will say, "But is that premise true?" or "That's just an opinion."
  **Correction:** Stop them. Say: "We aren't asking if it's a *good* opinion yet. We are asking if it is a *fact* discoverable by the algorithm."
  **Point:** This is **Hume's Gap**. You cannot deduce an Ought from an Is without an Ought premise. The algorithm provides only Is. The Council smuggled in an Ought.
  **Why here:** You must establish the *logical* missing piece before discussing the *semantic* trickery. Hume comes first because it's structural; Moore is about the content of the bridge.

  #### Phase 3: The Semantic Trap (30–45 mins) — *Head Off Misconception #3*
  **Action:** Now interrogate the hidden premise: *"We ought to invest wherever gentrification is predicted."*
  **Question:** "Why that premise? What makes it true?"
  **Likely Student Answer:** "Because gentrification means growth/efficiency/economic activity."
  **The Move:** This is where you deploy **Moore**.
  **Explanation:** "You are defining 'Good Policy' as 'Efficient Prediction' or 'Economic Growth.' Moore says you can't do that. Even if growth is natural, even if it's efficient, it always makes sense to ask: 'But is growth *good*?'"
  **Misconception Interception (Natural = Good):** Students will argue, "But markets are natural forces," or "Evolution favors growth."
  **Correction:** Shut this down immediately. "Moore's point is that 'natural' and 'good' are not the same word. If they were, asking 'Is this natural thing good?' would be nonsense, like asking 'Is a bachelor unmarried?' It isn't nonsense. It's a real question. Therefore, 'natural' does not mean 'good.'"
  **Why here:** This prevents them from solving the Hume gap by just asserting facts about nature or economics. It shows the hidden premise isn't a fact; it's a value definition disguised as a fact.

  #### Phase 4: The Rescue (45–60 mins) — *Head Off Misconception #2*
  **Action:** Students will now feel paralyzed. "So data is useless? We can't make policy?"
  **Misconception Interception (Science is Useless):** This is the danger zone. If you leave them here, they reject the lesson as philosophical navel-gazing.
  **The Fix:** Introduce **Instrumental Rationality**.
  **Explanation:** "Science is not useless. It is conditionally powerful. The argument works *if* we add the value premise explicitly."
  *   *P1:* Algorithm predicts gentrification. (Fact)
  *   *P2:* We value preventing displacement more than maximizing efficiency. (Value)
  *   *P3:* Investment in predicted zones prevents displacement. (Fact/Causal)
  *   *C:* Therefore, Invest.
  **Point:** Science handles P1 and P3. Philosophy/Politics handles P2. The error isn't using science; it's pretending P2 is part of P1.
  **Why here:** This restores their agency as policy analysts. They aren't abandoning data; they are owning the values that *use* the data.

  #### Phase 5: The Check (60–75 mins)
  **Action:** Do not ask them to define Hume or Moore. Do not ask "What is the naturalistic fallacy?"
  **The Question:** Project a new, unrelated case.
  *   *Case:* "A hospital algorithm predicts with 90% accuracy which patients will miss their follow-up appointments. Therefore, the hospital ought to deny future appointments to these patients to save resources."
  *   *Task:* "Identify the hidden premise that makes this argument valid. Then, tell me: Is that hidden premise a fact the algorithm can verify, or a value the board must choose? Explain why confusing the two is dangerous here."

  **Success Criteria:**
  *   **Fail:** They say "Denying care is bad." (Moralizing, not structural).
  *   **Fail:** They say "The algorithm might be wrong." (Empirical objection, not logical).
  *   **Pass:** They identify the hidden premise ("We ought to prioritize resource savings over patient access") and classify it as a value judgment that cannot be derived from the prediction accuracy alone.

  ---

  ### What to Refuse to Unpack

  You do not have time for the meta-ethics. If you open these doors, you will lose the policy students.

  1.  **Hume's Moral Sentimentalism:** Do not explain *why* Hume thought we couldn't derive oughts (i.e., that morality is based on sentiment/passion). Just teach the **logical constraint**. If they ask "Why not?", say: "Because 'is' and 'ought' function differently in language. One describes, one commands. You can't get a command from a description without a rulebook."
  2.  **Moore's Non-Naturalism:** Do not explain Moore's belief that "good" is a simple, non-natural property. Do not walk through the full **Open Question Argument** mechanics. Just use the **intuition pump**: "If you define good as X, it should be nonsense to ask 'Is X good?' It isn't nonsense. So good isn't X."
  3.  **The "Natural" in Naturalistic Fallacy:** Be explicit that Moore wasn't just talking about "nature" (trees, rivers). He was talking about *any* natural property (pleasure, efficiency, accuracy). Students *will* think it only applies to environmental ethics. Correct this in Phase 3.

  ### Summary of Misconception Mapping

  | Misconception | When it arises | Where you head it off |
  | :--- | :--- | :--- |
  | **"Hume and Moore are the same thing."** | Phase 2 (The X-Ray) | Distinguish **Logic** (Hume: missing premise) from **Definition** (Moore: premise isn't a fact). |
  | **"Natural/Efficient = Good."** | Phase 3 (The Semantic Trap) | Use the "Is it nonsense to ask?" test. Efficiency is a property; Good is a valuation. |
  | **"Philosophy says science is useless."** | Phase 4 (The Rescue) | Introduce Instrumental Rationality. Science solves the "How," not the "Why." |

  ### Final Pedagogical Note
  Your authority here depends on not treating this as "Philosophy vs. Policy." Treat it as "Quality Control vs. Sloppy Reasoning." You are not telling them they can't use algorithms; you are telling them that hiding value judgments inside algorithms is bad governance. That is a policy argument, not just a philosophical one. Keep that frame, and they will listen.
