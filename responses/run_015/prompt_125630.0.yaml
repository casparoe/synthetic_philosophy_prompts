prompt: |-
  I'm running a small grad seminar for policy students who mostly think philosophy is just opinions with fancy words. Next week I want to cover the is-ought gap and the naturalistic fallacy, but not as two dusty history-of-ideas topics — I want them to see it as one double-bind that keeps happening when people slide from descriptive stats to a recommendation without noticing the hidden value step in between. I'm leaning toward a made-up but realistic case: a city deploys an algorithm that predicts with 94% accuracy which neighborhoods will gentrify, and the council concludes they therefore ought to direct investment there. I need you to plan the explaination arc, not deliver the lecture itself.

  You're an expert in philosophy pedagogy with a background in applied ethics. Think carefully, do a quick brainstorm of the dependency relations first, then lay out a committed teaching plan: the exact order the pieces have to come in so the distinction doesn't collapse into "you can't derive morality from science," the one carrying example (it can be my algorithm scenario or something sharper, but defend your choice and say exactly what the example must have and what it must lack), and the misconceptions these students will definately form in sequence — I'm guessing they'll conflate Hume's logical point with Moore's open-question point, then think you're saying empirical science is useless for ethics, and maybe a third one about "natural" meaning "good" in evolutionary terms — plus exactly where in the arc you should head off each one. Give me a sharp check-at-the-end question that proves they understand the structural problem rather than just repeating the slogan. Also tell me which part of Moore's argument or Hume's reasoning I should openly refuse to unpack at this level and just flag. Don't list options; pick a definite sequence and stick to it. And no reading lists — I want the dependency map and the misconception map, not bibliography.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Target Audience:** Policy grad students (pragmatic, skeptical of philosophy as "just opinions with fancy words").
      *   **Topic:** Is-Ought Gap (Hume) + Naturalistic Fallacy (Moore) as a single "double-bind" (hidden value steps in policy recommendations).
      *   **Goal:** Plan the explanation arc (pedagogy), not the lecture content itself.
      *   **Specific Requirements:**
          *   Brainstorm dependency relations first.
          *   Lay out a committed teaching plan (exact order).
          *   Defend the choice of example (algorithm/gentrification or something sharper).
          *   Specify what the example must have/lack.
          *   Map misconceptions in sequence (Hume/Moore conflation, science uselessness, evolutionary "natural") and where to head them off.
          *   Provide a sharp check-at-the-end question (structural understanding, not slogan repetition).
          *   Identify what to *refuse* to unpack (Hume/Moore nuances to skip).
          *   No reading lists.
          *   Tone: Expert philosophy pedagogy, applied ethics background, decisive (no options).

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Hume's Is-Ought:* Logical gap. You cannot deduce a prescriptive conclusion from purely descriptive premises without a prescriptive premise. (Logical structure).
      *   *Moore's Naturalistic Fallacy:* Semantic/Meta-ethical gap. "Good" cannot be defined as any natural property (like pleasure, evolution, efficiency). If you define good as X, it always makes sense to ask "But is X good?" (Open Question Argument).
      *   *The "Double-Bind" for Policy:* Policy wants to be evidence-based (Is) but must be action-guiding (Ought). The slip happens when efficiency or prediction is treated as inherently normative.
      *   *The Challenge:* Students think philosophy is opinions. They need to see this as a *structural error in reasoning*, not a moral preference.

  3.  **Brainstorm Dependency Relations:**
      *   To see the gap, students need to recognize premises vs. conclusions.
      *   To see the hidden value step, they need to accept that "accuracy" or "investment" isn't inherently good without a goal.
      *   To distinguish Hume vs. Moore: Hume is about inference (logic), Moore is about definition (meaning).
      *   To avoid "science is useless": Must show science informs the *conditional* (If we want X, then Y), just not the *categorical* (We want X).
      *   Example choice: The algorithm/gentrification case is strong because it mimics "evidence-based policy." It hides the value judgment inside the metric (accuracy/prediction) and the action (investment).

  4.  **Develop the Teaching Plan (Sequence):**
      *   *Step 1: The Hook (The Policy Slide).* Present the argument as valid. Let them nod.
      *   *Step 2: The Structural X-Ray.* Break it into Premise 1 (Is), Premise 2 (Hidden Ought), Conclusion (Ought).
      *   *Step 3: Hume's Point (The Logic).* Show the deduction fails without Premise 2.
      *   *Step 4: Moore's Point (The Definition).* Show why Premise 2 isn't a fact discoverable by science (efficiency != good).
      *   *Step 5: The Misconception Interceptions.* Address the "science is useless" and "natural=good" errors as they arise.
      *   *Step 6: The Check.* A question that forces them to find the hidden premise in a new case.

  5.  **Refine the Example:**
      *   *Case:* Algorithm predicts gentrification (94% accuracy). Council says: "Therefore, invest there."
      *   *Why keep it?* It's policy-relevant. It uses "accuracy" (a descriptive stat) to justify "investment" (a normative act).
      *   *What it must have:* A clear metric (accuracy) treated as a justification. A clear action (investment).
      *   *What it must lack:* Emotional loading (don't make gentrification obviously bad yet, keep it technical so the logical error is visible, not the moral outcome). If students focus on whether gentrification is bad, they miss the logical gap. The error is *inferring investment from prediction*, not whether investment is good.

  6.  **Map Misconceptions:**
      *   *Misconception 1: Hume = Moore.* They will think "You can't define good" is the same as "You can't infer ought."
          *   *Fix:* Distinguish Logic (Hume) vs. Meaning (Moore). Hume says missing bridge; Moore says the bridge material is fake.
      *   *Misconception 2: Science is Useless.* "So data doesn't matter?"
          *   *Fix:* Data matters for the *conditional* (Instrumental Rationality).
      *   *Misconception 3: Natural = Good.* "But evolution says..."
          *   *Fix:* Pre-empt this when discussing Moore. "Natural" properties (like prediction accuracy) aren't normative.

  7.  **Identify What to Skip:**
      *   *Hume:* Don't get into Hume's moral sentimentalism or the context of the *Treatise*. Just the logical structure.
      *   *Moore:* Don't unpack the Open Question Argument's meta-ethical implications (non-naturalism). Just use the intuition that "efficient" doesn't mean "right."

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Dependency Map:* Need to show how recognizing the hidden premise relies on separating fact from value.
      *   *Sequence:* Start with the argument they *would* make. Then break it. Then name the breaks. Then fix the utility of science.
      *   *Check Question:* Needs to be a new scenario where they identify the hidden premise.

  9.  **Final Review against Constraints:**
      *   No options? Yes, pick one path.
      *   No reading lists? Yes.
      *   Defend example? Yes.
      *   Misconception map? Yes.
      *   Check question? Yes.
      *   What to skip? Yes.
      *   Tone: Expert, decisive.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just describe Hume and Moore separately. The prompt asks to treat them as a "double-bind." I need to weave them together as "The Logical Gap" and "The Semantic Trap."
      *   *Correction:* Ensure the gentrification example doesn't become a debate about gentrification. I need to emphasize keeping the moral valence of gentrification neutral *for the sake of the exercise* so the logical error shines through. Actually, better: Make the goal explicit. If the goal is "efficiency," the algorithm works. If the goal is "equity," it might not. The error is assuming the algorithm *sets* the goal.
      *   *Refining the Misconception Map:* Be specific about *when* in the arc to stop them.
      *   *Refining the Skip:* Be specific about which technical philosophical bits to drop.

  11. **Final Polish:** Check the "Check-at-the-end question." It needs to test structural understanding. "Here is a new argument. Find the hidden premise."

  Let's assemble the dependency map first as requested.

  *Dependency Relations:*
  1.  Recognize Argument Structure (Premises -> Conclusion) -> Required to see the Gap.
  2.  See the Gap (Missing Premise) -> Required to understand Hume.
  3.  Analyze the Missing Premise (Is it a fact?) -> Required to understand Moore.
  4.  Understand Instrumental Rationality (Is -> Ought *given* a Goal) -> Required to avoid "Science is Useless."

  *Plan:*
  1.  Present the Argument (The Trap).
  2.  Formalize it (The X-Ray).
  3.  Identify the Gap (Hume).
  4.  Test the Bridge (Moore).
  5.  Rescue Science (Instrumentalism).
  6.  Check.

  *Misconceptions:*
  1.  Conflating Hume/Moore -> Address during Step 3 & 4 distinction.
  2.  Science Useless -> Address during Step 5.
  3.  Natural=Good -> Address during Step 4 (Moore).

  *Skip:*
  1.  Hume's Sentimentalism.
  2.  Moore's Non-Naturalism/Open Question technicalities.

  *Example:*
  Keep the Algorithm case. It's perfect for policy students. But strip the emotional weight of "gentrification" initially or frame it as "neighborhood change" to prevent moral outrage from obscuring the logical error. Actually, better to keep "gentrification" but focus on the *prediction* vs. *investment* link. The error is thinking prediction *justifies* investment.

