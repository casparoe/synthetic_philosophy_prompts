      *   *Conclusion:* They are likely incompatible or yield instability (overdetermination). They are not complementary because they compete to explain the *same* variability in knowledge ascriptions. If you have PE, you don't need EC to explain why "S knows" is false in high-stakes cases (because S *doesn't* know). If you have EC, you don't need PE (because S *does* know, but we can't say it). Holding both makes the truth conditions of knowledge ascriptions hyper-sensitive to two distinct variables that can pull in opposite directions.

  8.  **Refining the "No Named Formulations" Constraint:**
      *   Avoid "Stanley," "Hawthorne," "DeRose," "Lewis," "Subject-Sensitive Invariantism."
