      *   **Core Task:** Explain the conceptual relationship between Pragmatic Encroachment (PE) and Epistemic Contextualism (EC), focusing on the tension when held simultaneously.
      *   **Definitions Provided:**
          *   PE: Knowledge status ($S$ knows $p$) varies with $S$'s practical stakes.
          *   EC: Truth conditions of "S knows $p$" vary with the *attributor's* conversational context (specifically salience of error).
      *   **Key Problem:** Two independent contextual mechanisms (Subject's stakes vs. Attributor's context). Can they be separate? Do they collapse?
      *   **Specific Scenario:** High stakes for $S$, low salience/casual context for Attributor ($A$).
      *   **Key Questions to Answer:**
          *   Does PE affect knowledge status regardless of $A$'s assertion?
          *   If stakes are independent of $A$'s context, is PE just a special case of EC? (Implies no).
          *   If stakes are evaluated relative to $A$'s frame, does it undermine PE's directness?
          *   Conclusion: Redundancy, Instability, or Complementarity?
      *   **Constraint:** Be precise about underlying mechanics without appealing to specific named formulations in the technical literature (e.g., don't just say "Stanley vs. DeRose").

  2.  **Analyze the Doctrines Individually:**
      *   **Epistemic Contextualism (EC):** Focuses on the *semantics* of the word "knows." The content of the knowledge relation changes based on the speaker's context. High standards (salient error) = harder to satisfy "knows." Low standards = easier. Crucially, the *subject's* actual epistemic position (evidence, reliability) stays fixed; the *bar* moves.
      *   **Pragmatic Encroachment (PE):** Focuses on the *nature* of knowledge itself (or the justification condition). The subject's practical situation affects whether they *have* knowledge. High stakes = harder to know (need more evidence/justification). Low stakes = easier. Crucially, the *bar* might be fixed (invariantism) or context-sensitive, but the *subject's state* changes relative to the bar because the stakes change the required threshold of justification.

  3.  **Analyze the Tension (The "Two Mechanisms" Problem):**
      *   EC says: Truth depends on Attributor ($A$).
      *   PE says: Truth depends on Subject ($S$).
      *   If both are true, the truth value of "$S$ knows $p$" is a function of $f(Context_A, Stakes_S)$.
      *   *The Conflict:* EC usually assumes Invariantism about the subject's state (subject-sensitive invariantism is actually a form of PE). Traditional EC assumes the subject's epistemic position is independent of stakes. PE denies this.
      *   *The Scenario:* $S$ has High Stakes (HS). $A$ has Low Standards (LS).
          *   EC says: In $A$'s context, "S knows" is true (because standards are low).
          *   PE says: In $S$'s situation, $S$ does *not* know (because stakes are high, requiring more evidence than $S$ has).
          *   Result: Contradiction? Or do they talk past each other?

  4.  **Evaluate Conceptual Separation vs. Collapse:**
      *   *Can they be separate?* One governs the *meaning* of the term (EC), the other governs the *metaphysical constitution* of the state (PE).
      *   *Problem:* If PE is true, the fact of knowledge changes. If EC is true, the truth of the *ascription* changes.
      *   If $S$ doesn't know (due to PE), can $A$ truly say "$S$ knows" (due to EC)?
      *   If EC is about truth-conditions, and PE changes the facts that satisfy those conditions, they interact.
      *   *Redundancy:* If both move the threshold, do we need both? EC moves the semantic bar. PE moves the justificatory bar. If both move, it's overdetermined.
      *   *Instability:* If $A$ ignores $S$'s stakes, $A$ might speak falsely according to PE but truly according to EC. This creates a fracture in the theory of truth.

  5.  **Address the Specific Questions:**
      *   *Does PE affect knowledge status regardless of attributor?* Yes, that's the core of PE. It's subject-sensitive.
      *   *Does this show PE is not a special case of EC?* Yes. EC is attributor-sensitive. PE is subject-sensitive. They are orthogonal axes.
      *   *If stakes are evaluated relative to attributor's frame:* This turns PE into a form of EC (Attributor Contextualism about Stakes). This undermines the "encroachment" idea that practical rationality *constitutes* epistemic status. It makes it merely about how we *talk* about it.

  6.  **Synthesize the "Mechanics":**
      *   Think of Knowledge ($K$) as requiring Evidence ($E$) to meet a Threshold ($T$).
      *   **EC:** $T$ varies with Attributor's Context ($C_A$). $E$ is fixed.
      *   **PE:** $T$ varies with Subject's Stakes ($Stk_S$). (Or $E$ required varies).
      *   **Combined:** $K$ is true iff $E \ge T(C_A, Stk_S)$.
      *   *The Tension:* EC claims the variation is *only* in $C_A$ (semantics). PE claims variation is in $Stk_S$ (metaphysics/epistemology).
      *   If both hold, we have "Double Contextualism."
      *   *Scenario (High Stakes $S$, Low Standards $A$):*
          *   PE says: $E < T_{high}$. So, No Knowledge.
          *   EC says: $T_{low}$ is the relevant bar. $E \ge T_{low}$. So, "Knows" is true.
          *   *Resolution:* If PE is true, the *fact* is No Knowledge. If EC is true, the *sentence* is true. This leads to a mismatch between fact and assertion. This suggests instability.
      *   *Complementarity?* Only if EC is viewed as merely linguistic and PE as metaphysical. But EC claims to track truth conditions. If truth conditions diverge from metaphysical facts, EC loses its grip on knowledge itself.

