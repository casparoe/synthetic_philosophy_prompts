answer: |-
  Friends, colleagues, family.

  For thirty-five years, I studied how populations change. For fifteen of those years, I studied alongside Gerald Voss. I watched him work through the long afternoons of the eighties and the quiet winters of the nineties, and I am here to tell you that I have never known a more stubborn man. But I am also here to tell you that I have never known a more necessary one.

  Gerald spent his life studying a slime mold called *Dictyostelium*. It is a humble creature. When food is scarce, these single cells come together to form a slug. Some of them sacrifice themselves to become a stalk, lifting the others up so they can become spores and fly away to new ground. The stalk dies; the spores live.

  To the dominant orthodoxy of Gerald's prime—the era of the "Selfish Gene"—this was just a trick of mathematics. They argued that the cells on the stalk were just helping copies of their own genes survive. It was all about the gene. The group didn't matter; only the unit of replication mattered.

  Gerald disagreed. He argued that the group itself was real. That selection happened *at the level* of the slug, not just inside the cells.

  For decades, he was told he was wrong. He was treated as a marginal figure, a man chasing ghosts. I watched him endure this. I saw the papers rejected, the invitations dry up. But he did not stop. He did not stop because he was protecting a specific answer. He was protecting a question.

  In my retirement, I have been reading philosophy, trying to understand what I witnessed in that lab. I have learned that there is a difference between a *unit* of selection and a *level* of selection. It is a subtle distinction, but it was the axis of Gerald's life.

  A unit is the thing that is copied. A level is the arena where the struggle for survival takes place. You can describe a choir by listing every singer's notes—that is the unit. But if you ignore the harmony, you miss the music. That is the level. Gerald knew that if you only look at the genes, you miss the organism. If you only look at the organism, you miss the group. He spent his career demanding that we look at the harmony, not just the notes.

  Now, science has moved on. The debates of the twenty-first century have found mathematical ways to reconcile the views that tore us apart in the twentieth. Some might say this vindicates Gerald. Others might say it dissolves his point. Gerald would have rejected both. He knew the math had changed. He knew the modern revival of multilevel selection is not the same theory he fought for. He would not want me to tell you he was "proven right" in a simple sense.

  What he would want me to say is that he kept the door open.

  If Gerald had conceded, if he had accepted the comfortable orthodoxy of the selfish gene, the field would have closed its eyes to the complexity of life. We might never have seen the importance of cooperation, of structure, of the levels above the individual. He mattered not because he won the argument, but because he refused to let the argument end before the truth was fully visible.

  To his daughter, and to his family: You asked that we understand his work mattered. It matters because it was honest. He valued the integrity of the question over the comfort of the answer. In a world that rewards certainty, he offered rigor. In a world that wanted to simplify life down to a single gene, he insisted on the complexity of the group.

  He was like the stalk of the amoeba he studied. He held his ground, often in the dark, often without glory, so that the questions he cared about could be lifted up high enough to catch the light.

  We are the spores. We are the ones who get to fly further because he held the structure up.

  Rest well, Gerald. The question is safe with us.
