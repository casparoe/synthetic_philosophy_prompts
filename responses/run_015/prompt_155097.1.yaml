  # Seminar Plan: The Architecture of Periodization
  **Course:** Graduate Historiography Seminar  
  **Participants:** 12 Students  
  **Duration:** 90 Minutes  
  **Topic:** The Constructed Nature of Macro-Periods ('Middle Ages,' 'Renaissance,' 'Scientific Revolution')  
  **Facilitator Role:** Neutral Game Master (No up-front lecture; no thesis revelation until Debrief)

  ---

  ## Materials Preparation
  **The Packet:** Create 4 identical packets. Each contains 10 cards. Each card has a generic description of a primary source (see below) but **no date** and **no author name**.
  **The Reveal Sheet:** A separate handout for Phase Two listing the actual approximate date and origin for each of the 10 excerpts.
  **The Criteria Cards:** 4 cards for Phase Two assignment (two marked "Conceptual Vocabulary," one "Technological Practice," one "Institutional Setting").
  **The Vote Slips:** 12 small slips of paper for Phase Three.
  **Timer:** Visible to all.

  ### The 10 Anonymized Excerpts (For Phase One)
  1.  **Excerpt A:** A Latin commentary on natural motion that cites an Arabic observational table to correct Ptolemaic calculations.
  2.  **Excerpt B:** A mercantile contract employing humanist rhetorical framing to justify profit margins as civic virtue.
  3.  **Excerpt C:** A court record describing an astronomical dispute resolved by appeal to both scriptural authority and mechanical demonstration.
  4.  **Excerpt D:** An Italian legal document preserving scholastic logical distinctions alongside vernacular poetic form.
  5.  **Excerpt E:** A treatise on optics describing experimental method but framed within a theological inquiry into divine light.
  6.  **Excerpt F:** A map utilizing a Ptolemaic grid system but incorporating data from contemporary trans-oceanic voyages.
  7.  **Excerpt G:** A medical text prescribing Galenic humoral balance while integrating pharmacological data from newly contacted regions.
  8.  **Excerpt H:** A description of clockwork machinery intended for a cathedral, justified as a model of cosmic order.
  9.  **Excerpt I:** An algebraic text using symbolic notation but arguing via classical rhetorical structures.
  10. **Excerpt J:** A university curriculum syllabus listing Aristotle alongside newly printed commentaries on ancient Greek texts.

  ---

  ## Phase One: The Naive Sort (25 Minutes)

  **Instructions to Students:**
  1.  Divide into four groups of three.
  2.  You have a packet of 10 source descriptions.
  3.  You must sort these 10 excerpts into exactly three chronological bins: **Middle Ages**, **Renaissance**, **Scientific Revolution**.
  4.  **Constraint:** You may use *only* internal textual evidence (language, concepts, institutional references). Do not guess dates.
  5.  **Scoring:**
      *   +1 Point for every excerpt placed where the group can defend the logic based on the text.
      *   +5 Points if all 10 excerpts are placed (no leftovers).
      *   **Collective Penalty:** If two groups place the same excerpt in different bins, both groups lose 2 points *unless* they can articulate the specific textual criterion that justifies the split.
      *   **Goal:** Maximize group score through internal consistency and consensus.

  **Facilitator Action:**
  *   Start the timer immediately.
  *   Circulate silently. Listen for debates about whether "Arabic tables" imply 'Scientific Revolution' or 'Middle Ages,' or if "vernacular poetic form" implies 'Renaissance.'
  *   Do not correct them. Do not hint that the periods are blurry.
  *   At 25 minutes, freeze the groups. Collect the scores but do not announce winners yet.

  ---

  ## Phase Two: The Criterion Shift (20 Minutes)

  **Instructions to Students:**
  1.  **Reveal:** Distribute the Reveal Sheet. Students now see the actual provenance (e.g., Excerpt A is 12th Century; Excerpt C is 17th Century).
  2.  **Reassign:** Give each group a Criteria Card.
      *   Group 1: Technological Practice
      *   Group 2: Institutional Setting
      *   Group 3: Conceptual Vocabulary
      *   Group 4: Conceptual Vocabulary
  3.  **Task:** Re-sort the same 10 excerpts. You are now permitted to split excerpts across bins if your specific criterion demands it (e.g., a 17th-century text using medieval concepts might move bins under "Conceptual Vocabulary").
  4.  **Scoring Shift:**
      *   Points are awarded for coherence *within your assigned criterion*.
      *   Cross-group agreement is no longer required. Group 1 may sort differently than Group 2 and still score points.

  **Facilitator Action:**
  *   Allow 20 minutes.
  *   Observe if groups anchor on the *dates* they just learned or if they strictly follow the *criterion*.
  *   **Risk Management:** If Group 1 (Technology) begins to dominate the room's logic, treating institutional or conceptual continuity as irrelevant noise, prepare the Counter-Example (see Facilitator Notes). Do not lecture; keep it in reserve.

  ---

  ## Phase Three: The Ontological Vote (15 Minutes)

  **Instructions to Students:**
  1.  Return to individual seats.
  2.  You must cast a forced-choice vote on a single question: **"Did the criterion assigned to your group in Phase Two reveal a *real historical boundary*, or did it merely *project a boundary* onto continuous material?"**
  3.  **Defense:** Each student has exactly one minute to state their vote and one sentence of justification.
  4.  **Facilitator Role:** Record the distribution of answers (e.g., 8 Real / 4 Projected) on the board. Do not adjudicate who is right. Do not comment on the arguments.

  **Facilitator Action:**
  *   Keep strict time (1 minute per student).
  *   Ensure the tally is visible.
  *   Transition immediately to Debrief once the last student speaks.

  ---

  ## Debrief: Historiographical Mapping (30 Minutes)

  **Facilitator Script & Guide:**

  **1. Mapping Phase One: Naive Chronological Realism (5 Minutes)**
  "In Phase One, you acted as chronological realists. You assumed the text contained inherent markers that naturally belonged to specific boxes ('Middle Ages,' 'Renaissance,' 'Scientific Revolution'). The scoring penalty for disagreement reinforced the idea that there is one 'correct' timeline. Historiographically, this mirrors the 19th-century assumption that periods are discovered entities, like geological strata, waiting to be found."

  **2. Mapping Phase Two: Problem-Driven Periodization (10 Minutes)**
  "In Phase Two, the 'truth' of the timeline shifted based on the question you were asked. A text could be 'Medieval' conceptually but 'Revolutionary' technologically. This demonstrates that periodization is dependent on the *question being asked*. There is no single 'correct' sort, only sorts that are more or less useful for specific historical problems. The friction you felt between the revealed dates and your sorting criteria highlights the lag between material change and conceptual change."

  **3. Mapping Phase Three: Heuristic Utility vs. Ontological Commitment (10 Minutes)**
  "Look at the vote on the board. Those who voted 'Real Boundary' made an ontological commitment: you believe the structure exists in the past independent of us. Those who voted 'Projected' argued for heuristic utility: the boundary is a tool we impose to make sense of complexity. Historiography does not resolve this vote. It asks us to recognize when we are making an ontological claim versus when we are using a heuristic tool."

  **4. Explicit Limitation: What the Game Cannot Reproduce (5 Minutes)**
  "However, this game has a structural limitation. By focusing on ten discrete excerpts, we privileged *events* and *texts*. This activity cannot reproduce long-duration structural patterns.
  *   **Demographic Cycles:** Population collapses or expansions that span centuries.
  *   **Linguistic Drift:** The slow mutation of vernaculars that doesn't respect political or intellectual boundaries.
  *   **Institutional Persistence:** The lifespan of a university or legal corporation that outlasts 'periods.'

  Broad labels like 'Middle Ages' may still hold value not because of the texts we sorted, but because of these slow-moving structural undercurrents. I must supply this verbally because a 90-minute game based on textual sorting cannot simulate multi-generational structural continuity. Do not mistake the game's finding—that texts blur boundaries—for a claim that *no* broad patterns exist."

  ---

  ## Facilitator Risk Assessment & Intervention

  **Predicted Failure Mode:**
  Students will likely anchor on **Technological Markers** (e.g., "clocks," "maps," "printing") as the primary determinant of periodization, treating institutional or conceptual continuity as noise. They may argue that if the technology is "new," the period is "new," regardless of the conceptual framework.

  **Prepared Counter-Example (Deploy ONLY if anchoring becomes totalizing):**
  *Do not lecture this.* Use it only if Phase Two discussion stalls because everyone agrees Technology is the only "real" boundary.

  *   **Facilitator Prompt:** "Consider the university curriculum. If a syllabus from 1550 lists the same Aristotelian texts as a syllabus from 1350, does the technology of the printing press change the *institutional* periodization of that classroom? Or does the institution persist despite the technological shift?"
  *   **Purpose:** To disrupt technological determinism without validating any specific historian's thesis. It forces them to weigh Institutional Persistence against Technological Change within the game mechanics.

  **Strict Constraints for Facilitator:**
  *   **NO** naming of historians (e.g., do not mention Burckhardt, Butterfield, Kuhn).
  *   **NO** reading list distribution.
  *   **NO** reliance on students recognizing specific works (e.g., do not say "This is like Oresme").
  *   **NO** up-front explanation of the "Constructedness Thesis." The students must feel the confusion first.
