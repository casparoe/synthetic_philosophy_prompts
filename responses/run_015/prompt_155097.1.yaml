      *   *Phase 2:* "Reassign each group a single sorting criterion." There are 4 groups and 3 criteria (Technology, Institution, Concept). One criterion will be duplicated, or one group gets a "Synthesis" role. The prompt says "reassign each group a single sorting criterion—technological practice, institutional setting, or conceptual vocabulary." I will assign two groups to one criterion to make the math work (4 groups, 3 criteria). Let's assign two groups to 'Conceptual Vocabulary' as that's usually the stickiest.
      *   *Phase 3:* "Forced-choice vote."
      *   *Debrief:* Must explicitly mention what the activity *cannot* reproduce (long-duration structures).

  7.  **Final Polish:**
      *   Tone: Professional, instructional, ready-to-use.
      *   Formatting: Clear headings, bullet points for readability.
      *   Check specific wording: "naive chronological realism," "heuristic utility," "ontological commitment."

