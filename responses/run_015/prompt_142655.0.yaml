answer: |-
  In a specialized alloy smelting facility, operator $S$ monitors a crucible using a digital thermal probe that displays raw voltage conversions as temperature readings. $S$ forms belief $P$: "The display reads 2000K." The probe is locally robust; if the display differed, $S$ would see it, satisfying sensitivity. Facility protocol dictates that temperature strictly determines stability, so $S$ deduces $Q$: "The smelt is stable." However, the system exhibits adversarial calibration drift: a firmware latency exists where, if the smelt becomes unstable due to oxygen fluctuation, the stability controller decouples from the thermal input while the display remains fixed at 2000K. In the actual world, synchronization holds, making $P$ and $Q$ true. But in the nearest possible world where $Q$ is false (oxygen spikes, instability occurs), the display remains at 2000K, $S$ sees the reading, and deduces stability, believing $Q$ despite its falsity.

  **Reasoning and Analysis**

  Tracking grants knowledge of $P$ because the belief method is sensitive: in the nearest possible world where $P$ is false (the display shows a different number), $S$ does not believe $P$. Tracking withholds knowledge of $Q$ because the belief is insensitive: in the nearest possible world where $Q$ is false (the smelt is unstable), the adversarial drift ensures the display still reads 2000K, so $S$ continues to believe $Q$ via the same deduction. Closure demands that if $S$ knows $P$ and validly infers $Q$, $S$ must know $Q$; tracking theory denies this, asserting that logical entailment does not preserve counterfactual sensitivity.

  The single structural feature causing the divergence is the **modal non-propagation of falsity**: the specific conditions that make $Q$ false in the nearest possible worlds do not make $P$ false. Removing this feature—by ensuring that any world where $Q$ is false is also a world where $P$ is false—collapses the distinction, forcing $Q$ to become sensitive whenever $P$ is, thereby restoring compliance with closure.

  A defender of closure would attack the construction by arguing that the deduction is not epistemically competent because $S$ does not know the linking premise (that temperature guarantees stability) in the relevant modal sense; $S$ merely assumes a nomological connection that fails in nearby error worlds. The tracking theorist replies that competent deduction is defined by actual-world validity and justification, not modal robustness, and that knowledge requires a direct counterfactual link to the truth which logical inference alone cannot manufacture when the environment introduces systematic drift.
