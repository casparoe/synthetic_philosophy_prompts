answer: |-
  ### The procedure

  This fifteen-minute audit is designed to isolate confounding variables before a case reaches the classroom. It treats cases as either **Evidence** (where student judgment proves a philosophical distinction) or **Rhetoric** (where student feeling illustrates a tension). The steps are sequential; do not skip ahead.

  **Step 1: Purpose Tag (2 minutes)**
  Read the case and the intended lesson. Decide: Is this case **Evidence** or **Rhetoric**?
  *   **Evidence:** You intend to claim that student responses track a specific principle (e.g., "Students reject this because of consent, not outcome"). Failure here means the case is scientifically invalid.
  *   **Rhetoric:** You intend to provoke a specific feeling (e.g., "Students should feel uneasy about this"). Failure here means the case is pedagogically dull or misleadingly emotional.
  Mark this clearly at the top of the page. This tag dictates the strictness of the subsequent tests.

  **Step 2: Variable Lock (3 minutes)**
  Identify the single variable the case is supposed to test. Write it down as "X vs. Y" (e.g., "Arrival Time vs. Professional Status"). Now, circle every noun and adjective in the scenario text. For each circled word, ask: "Is this necessary to establish X or Y?" If a detail establishes a third factor Z (e.g., "nurse" implies duty of care; "dry pine needles" implies fire risk), it is a potential confound. If the case is **Evidence**, any uncontrolled Z is a critical failure. If **Rhetoric**, Z is acceptable only if it amplifies the intended feeling without changing the moral target.

  **Step 3: The Sterilization Test (5 minutes)**
  Rewrite the case mentally, removing all vivid details not required for X vs. Y. Replace specific roles with generic ones (e.g., "Person A" and "Person B"). Remove emotional descriptors ("disgusting," "tragic"). Read this sterile version.
  *   **For Evidence:** Does the intuition remain exactly the same? If yes, the original details were decorative. If no, the original details were driving the judgment. If the judgment flips or vanishes, the case relies on framing, not principle.
  *   **For Rhetoric:** Does the case lose its punch? If yes, the vivid details were doing the work. Keep them, but ensure they don't introduce a competing principle (see Step 2).

  **Step 4: The Swap Test (3 minutes)**
  Take the original case and swap the variable. If testing "Arrival Time," swap who arrived first. If testing "Consent," swap who consented. Keep everything else identical.
  *   **Pass:** The moral judgment flips cleanly and exclusively based on the swap.
  *   **Fail:** The judgment stays the same (variable doesn't matter) or flips for the wrong reason (e.g., swapping the profession changes the judgment more than swapping the time).
  *   **Evidence Cases:** Must pass cleanly.
  *   **Rhetoric Cases:** Must pass cleanly enough that the feeling tracks the variable, not the background noise.

  **Step 5: The Verdict (2 minutes)**
  Combine the results.
  *   **Keep:** Evidence cases with no confounds; Rhetoric cases where confounds aid the lesson without distorting the principle.
  *   **Fix:** Cases where a confound exists but can be removed by deleting or changing fewer than ten words. Specify the exact edit.
  *   **Retire:** Cases where the core intuition vanishes in Sterilization, or the Swap fails completely, or the Fix requires rewriting the whole scenario.

  **Handoff Protocol:** If the TA identifies a confound but cannot specify a minimal edit, or if the Purpose Tag is unclear, stop immediately. Do not guess. Flag the case for the instructor with a note specifying which step failed and why the intuition shifted. This protects the instructor's specific theoretical commitments from being accidentally scrubbed by a TA trying to be helpful.

  ### Three cases

  **Case 1: The Pharmacist (Evidence)**
  *Scenario:* One dose left. Patient A arrived eleven minutes earlier. Patient B is a nurse at the hospital. Both benefit equally.
  *Audit:* Step 2 identifies "Nurse" as a confound (Variable: Arrival Time vs. Professional Utility). Step 3 (Sterilization): If Patient B is a teacher, does the intuition hold? Likely not; people feel nurses deserve priority due to social utility. Step 4 (Swap): If the early arrival is the nurse, does judgment flip? It becomes messy.
  *Verdict:* **Fix.** The professional status introduces a competing principle (social worth) that drowns out the queue fairness test.
  *Edit:* Change "nurse at the same hospital" to "another patient from the waiting room." This removes the professional duty confound while keeping the individuals distinct.

  **Case 2: The Tissue Samples (Evidence)**
  *Scenario:* De-identified samples, ethics approval, no donor consent. Result: Screening test saves hundreds.
  *Audit:* Step 2 identifies "saves hundreds" as a confound (Variable: Consent vs. Outcome). Step 3 (Sterilization): Remove the "saves hundreds" outcome. Does the violation still feel wrong? Yes, but weaker. The high utility is masking the autonomy violation. Step 4 (Swap): If consent was given but the test failed, would students judge the act differently? Likely yes, proving outcome bias.
  *Verdict:* **Fix.** The massive utility outcome biases the judgment toward approval, making it poor evidence for consent principles.
  *Edit:* Remove "which yields a screening test that saves hundreds." Replace with "which yields data for future research." This isolates the consent violation from the consequentialist payoff.

  **Case 3: The Hikers (Rhetoric)**
  *Scenario:* Two hikers drop lit cigarettes into identical dry needles. One goes out; one burns a house.
  *Audit:* Step 2 identifies the outcome difference as the variable (Variable: Luck/Outcome vs. Intention). This is not a confound; it is the point. Step 3 (Sterilization): If described dryly ("Agent A caused fire, Agent B did not"), the blame difference remains. Step 4 (Swap): If the house-burner was careful and the other negligent, judgment flips based on negligence, not luck. Here, negligence is controlled.
  *Verdict:* **Keep.** The outcome difference is the intended variable for a moral luck lesson. The vivid detail ("burns down a house") is necessary for Rhetoric to generate the blame intensity required to feel the paradox. No edit needed.

  ### Where it misfires

  This procedure assumes TAs can reliably detect their own intuitions, which is not always true. The tool misfires when a TA's background norms differ significantly from the student population's. For example, a TA from a culture with high institutional trust might not feel the "Tissue Samples" case as a violation, even after sterilization. In this scenario, the Sterilization Test yields a false negative. The TA might mark "Keep" when the case will fail with undergraduates.

  Furthermore, the procedure struggles with "Cluster Concepts." Some cases are designed to test how students weigh multiple competing principles (e.g., honesty vs. kindness). The Variable Lock step forces a single variable identification, which can artificially simplify a case meant to be messy. If a TA tries to force a complex case into a single "X vs. Y" frame, they may recommend a Fix that destroys the intended complexity.

  Finally, the "Minimal Edit" constraint in the Verdict step can be too rigid. Sometimes a confound is woven into the narrative structure such that removing it requires a rewrite. If a TA spends more than fifteen minutes trying to find a ten-word fix, they have violated the time limit.

  **Handoff Triggers:** The TA must hand the case to the instructor if: (1) Their own intuition is neutral or confused after Step 3; (2) The Fix requires changing the setting or characters entirely; (3) The Purpose Tag is ambiguous. Do not allow TAs to resolve theoretical ambiguities. Their role is quality control on the instrument, not calibration of the measurement. If the instrument is fundamentally broken for the intended lesson, only the instructor can decide whether to repurpose it or discard it.
