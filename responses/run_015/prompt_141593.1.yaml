      *   *Tension C:* (3) vs. (1). Jaynes' solution to Bertrand's Paradox uses *invariance groups*, not strictly *Maximum Entropy* (though they are related in Jaynes' mind). MaxEnt usually applies to discrete states or continuous variables with known constraints (like mean/variance). Bertrand's problem is about geometric invariance. Does the user conflate MaxEnt with Invariance?
