prompt: |-
  I have recently been seconded onto a small team redrafting my foreign ministry's guidance on when to support protection-of-civilians mandates, and the same case keeps being cited at me in opposite directions, so I want it worked through properly rather than gestured at. Take NATO's 2011 Libya intervention and analyze it through the doctrine it was sold under: the responsibility to protect, read together with the just-war categories it leans on (legitimate authority, last resort, reasonable prospect, proportionality, right intention, and a post-war responsibility to rebuild). The facts I want taken as given: Security Council authorization in March 2011 for a no-fly zone and all necessary measures short of foreign occupation, five abstentions including Brazil, Russia, China, India and Germany; Gaddafi's forces advancing on Benghazi after he threatened reprisals; a seven-month air campaign in which the coalition effectively became the rebels' air force; his killing at Sirte in October; then state fragmentation, a second civil war and a militia economy, and a much colder Security Council on Syria afterwards, with Brazil's responsibility-while-protecting formula and the Russia-China vetoes.

  Two things I want you to test rather than assume. First, a structural claim I have been toying with and cannot settle: that regime change in Libya was not mission creep or bad faith but was selected by the means the mandate permitted, since air power with no ground component cannot convert a temporary reprieve into a durable one (any ceasefire leaving the incumbent's armour and command intact simply re-creates the threat the mandate exists to remove), so a protection mandate plus stand-off air power plus no boots on the ground adds up to decapitation whether or not anyone intended it. Second, the symmetric hazard on the protected side: once an external air umbrella exists, the party being protected has an incentive to reject ceasefires and to leave its own civilians exposed, because the interveners' credibility is hostage to being seen to protect. Give me the disciplined mapping first: who the mandate-holder is, what the proportionality baseline is against (including the counterfactual massacre that never happened), what would count as success and as disengagement, and what the doctrine says the coalition should have done at each point. Then say which features of Libya R2P explains, which it has no vocabulary for (a protection force that becomes a belligerent, success conditions it cannot specify, a norm whose authority is spent by one selective use), and whether the episode is a confirmation, an anomaly, or a case the doctrine never contemplated. Say plainly where the theory is silent.
reasoning: |-
  Here's a thinking process that leads to the analysis of the 2011 Libya intervention through the lens of R2P and Just War Theory:

  1.  **Deconstruct the Request:**

      *   **Context:** The user is working on foreign ministry guidance regarding Protection of Civilians (PoC) mandates. They need a rigorous analysis, not gestures.
      *   **Subject:** NATO's 2011 Libya intervention.
      *   **Framework:** Responsibility to Protect (R2P) + Just War Theory (Jus ad Bellum/in Bello/Post Bellum categories: legitimate authority, last resort, reasonable prospect, proportionality, right intention, responsibility to rebuild).
      *   **Given Facts:** UNSC Res 1973 (March 2011), no-fly zone + "all necessary measures" (no occupation), 5 abstentions (BRICS + Germany), Gaddafi's threat to Benghazi, 7-month air campaign, coalition as rebel air force, Gaddafi's death, state fragmentation/second civil war, colder SC on Syria, Brazil's "Responsibility while Protecting" (RwP).
      *   **Two Hypotheses to Test:**
          1.  *Structural Claim:* Regime change wasn't mission creep but an inevitable outcome of the means (air power + no boots + protection mandate = decapitation).
          2.  *Symmetric Hazard:* Moral hazard on the protected side (rebels reject ceasefires/expose civilians because interveners' credibility is hostage to protection).
      *   **Required Output:**
          1.  Disciplined Mapping (Mandate-holder, Proportionality Baseline, Success/Disengagement conditions, Doctrine's prescription at each point).
          2.  Analysis of R2P's explanatory power (what it explains vs. what it has no vocabulary for).
          3.  Verdict: Confirmation, Anomaly, or Uncontemplated Case.
          4.  Plain statement on where the theory is silent.

  2.  **Initial Brainstorming & Fact-Checking:**

      *   *Mandate:* UNSC Resolution 1973. Key phrase: "all necessary measures... to protect civilians and civilian populated areas under threat of attack." Explicit exclusion: "foreign occupation force."
      *   *R2P Pillars:* Pillar I (State responsibility), Pillar II (International assistance), Pillar III (Timely and decisive response). Libya is the quintessential Pillar III case.
      *   *Just War Categories:*
          *   *Legitimate Authority:* UNSC (Yes, but contentious abstentions).
          *   *Just Cause:* Imminent massacre in Benghazi (Yes).
          *   *Right Intention:* Protection vs. Regime Change (The core tension).
          *   *Last Resort:* Diplomacy failed? (Debatable, but Gaddafi's rhetoric was extreme).
          *   *Proportionality:* Means vs. Ends.
          *   *Reasonable Prospect:* Will it make things better? (Hindsight says no, foresight was optimistic).
          *   *Post-Bellum:* Rebuilding (Largely absent).
      *   *Hypothesis 1 (Air Power Logic):* Air power degrades command/control. To protect civilians from a regime threatening them, the regime's ability to threaten must be nullified. Without ground troops to separate sides, nullifying the threat means destroying the regime's capacity to wage war -> Regime Collapse.
      *   *Hypothesis 2 (Moral Hazard):* Rebels know NATO won't let Benghazi fall. They fight from civilian areas. They reject peace deals that leave Gaddafi in power. NATO becomes co-belligerent.

  3.  **Drafting the "Disciplined Mapping":**

      *   *Mandate Holder:* UNSC (delegated to Member States/NATO).
      *   *Proportionality Baseline:* Not "Gaddafi stays vs. Gaddafi goes." It is "Imminent massacre in Benghazi vs. Intervention." The counterfactual is the Srebrenica-style event threatened in March 2011.
      *   *Success:* Cessation of immediate threat to civilians. Not necessarily democracy.
      *   *Disengagement:* When the threat is neutralized.
      *   *Doctrine's Prescription:*
          *   *Phase 1 (March):* No-fly zone, stop advance on Benghazi. (Fits R2P).
          *   *Phase 2 (April-August):* Degrade command/control to prevent renewed attack. (Fits R2P *if* Gaddafi remains a threat).
          *   *Phase 3 (Regime Fall):* Handover to legitimate authority. (Here R2P gets fuzzy on *which* authority).
          *   *Phase 4 (Post-Conflict):* Pillar II/III transition. (R2P fails here).

  4.  **Testing Hypothesis 1 (The Structural Claim):**

      *   *Argument:* Air power is blunt. You can't park a tank between civilians and artillery from the sky. You have to destroy the artillery. If the artillery belongs to the state, you are destroying the state's monopoly on violence.
      *   *Verdict:* Strong support. The logic of "protection from the state" via "stand-off strike" necessitates "degradation of the state." Without ground troops to enforce a ceasefire, the only way to ensure safety is regime incapacitation. This wasn't necessarily *bad faith*, but *operational inevitability*.

  5.  **Testing Hypothesis 2 (The Symmetric Hazard):**

      *   *Argument:* Rebels embed in cities. Rebels reject African Union peace plans. Why? Because they know NATO air power is their equalizer.
      *   *Verdict:* Strong support. This is the "moral hazard" of intervention. The "protection" becomes a strategic asset for one side.

  6.  **Analyzing R2P's Vocabulary (The Gap Analysis):**

      *   *What it explains:* The trigger (imminent atrocity), the authority (UNSC), the initial justification.
      *   *What it lacks:*
          *   *Co-belligerency:* R2P assumes a neutral protector. It doesn't account for the protector becoming a participant in a civil war.
          *   *Exit Strategy:* "Protection" is indefinite if the threat is structural. When is the civilian "safe"?
          *   *Post-Intervention:* R2P stops at "stopping the killing." It has no doctrine for state-building (Jus Post Bellum is weak in R2P).
          *   *Selectivity:* Why Libya and not Syria? R2P has no answer for geopolitical vetoes other than "politics."

  7.  **Final Verdict (Confirmation, Anomaly, Uncontemplated):**

      *   It is not a confirmation (outcome was disastrous).
      *   It is not a pure anomaly (it followed the text of 1973).
      *   It is a *Case the Doctrine Never Contemplated*. R2P was designed for Srebrenica/Rwanda (stopping a massacre), not for toppling a government via air war in a tribal society with no opposition structure. It conflated "stopping a massacre" with "winning a civil war."

  8.  **Refining the Tone:**

      *   The user is a policy professional. Tone must be analytical, precise, devoid of moralizing, and focused on doctrinal mechanics.
      *   Avoid "good/bad." Use "effective/ineffective," "aligned/divergent."
      *   Address the "Responsibility while Protecting" (RwP) backlash explicitly as it relates to the Syria veto.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the gravity and the specific constraints.
      *   **Part I: Disciplined Mapping:** The four required elements (Mandate, Baseline, Success/Exit, Doctrine's Path).
      *   **Part II: Testing the Structural Claim:** Air power logic.
      *   **Part III: Testing the Symmetric Hazard:** Rebel incentives.
      *   **Part IV: Doctrinal Gaps:** What R2P explains vs. silence.
      *   **Part V: Verdict:** Classification of the case.
      *   **Conclusion:** Where the theory is silent.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the abstentions? *Yes, link to Legitimate Authority.*
      *   *Check:* Did I address the "no occupation" clause? *Yes, crucial for the air power argument.*
      *   *Check:* Did I address Syria? *Yes, as the downstream consequence (norm authority spent).*
      *   *Check:* Is the distinction between R2P and Just War clear? *R2P is the political norm; Just War is the ethical framework. They overlap in 1973.*
      *   *Refinement:* Ensure the distinction between "Regime Change as Intent" vs. "Regime Change as Effect" is sharp. The prompt asks to test if it was "selected by the means." I need to argue that the *means dictated the end*.

  11. **Final Polish:** Check against the "plainly where the theory is silent" instruction. Ensure the "Responsibility while Protecting" concept is integrated as the doctrinal response to these failures. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to simply say "R2P failed." I need to say "R2P lacks the vocabulary for X." The prompt asks for a mapping of the doctrine's limits.

  *(Key Insight)*: The core tension is between *Negative Peace* (stopping the killing) and *Positive Peace* (a stable order). R2P is designed for Negative Peace. Libya required Positive Peace to sustain the intervention's outcome. The air campaign achieved Negative Peace by destroying the state, creating a vacuum where Positive Peace was impossible.

  *(Final Plan)*:
  1. Map the Mandate & Baselines.
  2. Analyze the "Air Power Logic" (Hypothesis 1).
  3. Analyze the "Moral Hazard" (Hypothesis 2).
  4. Evaluate R2P's Vocabulary (Gaps).
  5. Final Classification.
  6. Explicit "Silence" statement.cw
answer: |-
  This analysis maps the 2011 Libya intervention against the Responsibility to Protect (R2P) doctrine and Just War categories, treating the facts you provided as fixed constraints. It tests your two structural hypotheses and evaluates the doctrinal gaps exposed by the outcome.

  ### I. Disciplined Mapping of the Mandate and Doctrine

  To analyze whether the intervention adhered to or violated its selling doctrine, we must first establish the doctrinal baseline established by UNSC Resolution 1973 and the R2P framework.

  **1. The Mandate-Holder**
  *   **Formal Authority:** The UN Security Council (UNSC). Resolution 1973 was the legal vehicle.
  *   **Operational Authority:** Member States acting nationally or through regional arrangements (NATO).
  *   **Doctrinal Tension:** R2P posits the UNSC as the gatekeeper of *Legitimate Authority*. However, the five abstentions (Brazil, Russia, China, India, Germany) signaled a fracture in the *Right Intention* consensus before the first sortie. The mandate was legitimate but not universal, creating a fragility in the normative cover that would later collapse during the Syria crisis.

  **2. The Proportionality Baseline**
  *   **The Threat:** Gaddafi's explicit threat to cleanse Benghazi "house by house."
  *   **The Counterfactual:** A Srebrenica-style massacre in March 2011.
  *   **The Baseline:** Proportionality in R2P/Just War is measured against the *imminent atrocity*, not the *political outcome*.
  *   **The Error:** The coalition measured proportionality against the *duration of the conflict* (7 months) rather than the *severity of the initial threat* (immediate massacre). Doctrinally, once the march on Benghazi was halted (late March 2011), the proportionality baseline shifted. Continued strikes required a new justification: that the threat remained *imminent* despite the front lines stabilizing.

  **3. Success and Disengagement Conditions**
  *   **R2P Definition of Success:** Civilians are no longer under threat of mass atrocity.
  *   **1973 Definition of Success:** Cessation of attacks on civilians; establishment of a no-fly zone.
  *   **The Gap:** Neither definition specified *whose* peace must exist. If the incumbent regime remains in power but ceases fire, is the mandate fulfilled? R2P implies the threat must be removed, but does not specify if removing the threat requires removing the regime.
  *   **Disengagement:** Doctrine suggests disengagement when the "manifest failure" of the state to protect is remedied. In Libya, this was impossible without state reconstruction, which was outside the mandate ("no occupation").

  **4. Doctrinal Prescription at Each Point**
  *   **March 2011 (Benghazi Advance):** Doctrine prescribes immediate kinetic intervention to halt the advance. *Coalition action: Aligned.*
  *   **April–June 2011 (Stalemate):** Doctrine prescribes maintaining the no-fly zone and protecting populated areas. It does *not* explicitly prescribe degrading command and control nodes far from the front line unless they are directly facilitating imminent attacks. *Coalition action: Drifted toward strategic degradation of the regime's war-making capacity.*
  *   **August 2011 (Tripoli Fall):** Doctrine is silent on facilitating rebel offensive operations. *Coalition action: Provided close air support for rebel advances, effectively becoming co-belligerents.*
  *   **October 2011–Post (Sirte/Aftermath):** R2P Pillar III (response) ends; Pillar II (assistance) should begin. *Coalition action: Minimal reconstruction commitment. Jus Post Bellum ignored.*

  ---

  ### II. Testing Hypothesis 1: The Structural Claim (Air Power & Decapitation)

  *Hypothesis: Regime change was not mission creep but an inevitable selection by the means (air power + no boots + protection mandate).*

  **Analysis:**
  This hypothesis holds doctrinally and operationally. R2P mandates the *protection of civilians*. In a civil war where the state is the perpetrator, civilians are protected by the state's monopoly on violence. To protect civilians *from* the state without placing peacekeepers on the ground (the "no occupation" clause), the interveners must degrade the state's ability to project violence.

  *   **The Logic of Stand-Off Protection:** Air power cannot interpose itself physically between an artillery battery and a neighborhood. It can only destroy the battery. If the battery is loyal to the regime, destroying it degrades the regime.
  *   **The Ceasefire Problem:** A ceasefire that leaves the regime's armor and command intact (as existed in March/April) leaves the *capacity* for the threatened massacre intact. As long as Gaddafi remained in command, the "threat" to Benghazi was structural, not just tactical.
  *   **The Inevitability:** Therefore, a mandate to "protect civilians" + "all necessary measures" + "no ground troops" logically necessitates the degradation of the regime's command structure until it collapses. You cannot guarantee safety via air power alone while leaving the threatening authority in power.
  *   **Verdict:** **Confirmed.** Regime change was not necessarily the *intent* (Right Intention), but it was the *operational requirement* of the chosen means to fulfill the mandate. The doctrine failed to anticipate that "protection" via air power against a state actor is functionally indistinguishable from "war against the state."

  ---

  ### III. Testing Hypothesis 2: The Symmetric Hazard (Moral Hazard of the Protected)

  *Hypothesis: The protected party (rebels) had incentives to reject ceasefires and expose civilians because interveners' credibility was hostage to protection.*

  **Analysis:**
  This hypothesis also holds and highlights a critical gap in R2P's risk assessment. R2P assumes the protected population are passive beneficiaries. In Libya, they became strategic actors.

  *   **Credibility Hostage:** Once NATO declared a no-fly zone and "all necessary measures," a failure to protect rebel-held towns would constitute a catastrophic normative failure for the Alliance and the UNSC. The rebels understood this leverage.
  *   **Rejection of Peace Plans:** The African Union proposed roadmaps involving ceasefires and negotiations. The rebels rejected these because they knew NATO air power neutralized Gaddafi's advantage. Accepting a ceasefire would freeze the conflict with Gaddafi in power; continuing the war offered total victory under NATO's umbrella.
  *   **Exposure of Civilians:** There is evidence of rebel forces operating from civilian areas, calculating that NATO would not allow those areas to be shelled. This turns the "civilian" status into a shield for combatants, violating *Jus in Bello*, but incentivized by the *Jus ad Bellum* protection guarantee.
  *   **Verdict:** **Confirmed.** The intervention created a moral hazard where the protected party could externalize the cost of war onto the interveners. R2P has no mechanism to discipline the *beneficiaries* of protection, only the perpetrators of atrocity.

  ---

  ### IV. Doctrinal Gap Analysis: What R2P Explains vs. Where It Is Silent

  **1. What R2P Explains**
  *   **The Trigger:** It successfully codified that sovereignty is not a shield against mass atrocity. The Benghazi threat justified the breach of sovereignty.
  *   **The Authority:** It correctly identified the UNSC as the only source of legitimacy, even if the vote was fractured.
  *   **The Initial Action:** It provides a clear vocabulary for the March 2011 intervention (Last Resort, Just Cause).

  **2. What R2P Has No Vocabulary For**
  *   **Co-belligerency:** R2P assumes a neutral humanitarian protector. It lacks the category for a protector that becomes a participant in a civil war. When does "protecting civilians" become "aiding one side"? The doctrine offers no bright line.
  *   **Success Conditions in State Collapse:** R2P defines success as "atrocities stopped." It does not define success as "functioning state." In Libya, stopping the atrocity required collapsing the state, which guaranteed future atrocities (the militia economy). R2P cannot process a "successful intervention" that results in "failed state."
  *   **Jus Post Bellum:** The doctrine is heavily weighted toward *Jus ad Bellum* (right to intervene). It has almost no binding requirements for *Jus Post Bellum* (responsibility to rebuild). The "Responsibility to Rebuild" was rhetorical, not operational.
  *   **Normative Blowback:** R2P assumes each case is adjudicated on merit. It has no variable for "normative credit." Spending the political capital on Libya (selective use) depleted the authority for Syria. The doctrine cannot account for the geopolitical cost of one intervention on future cases.

  **3. The "Responsibility while Protecting" (RwP) Response**
  Brazil's RwP concept (2011) was a direct doctrinal patch for these gaps. It argued for:
  *   Exhaustion of all peaceful means (stricter Last Resort).
  *   Authorization of specific limits on the use of force (stricter Proportionality).
  *   Monitoring and accountability of the mandate during execution (addressing Mission Creep).
  *   **Relevance:** The fact that RwP was proposed but never adopted signals that the Security Council (specifically the P3) was unwilling to constrain the operational discretion that Libya established.

  ---

  ### V. Verdict: Confirmation, Anomaly, or Uncontemplated?

  **Verdict: A Case the Doctrine Never Contemplated.**

  Libya was not an anomaly of implementation; it was a stress test that revealed the doctrine's structural limits.
  *   **Not a Confirmation:** The outcome (fragmentation, second civil war) contradicts the R2P goal of human security.
  *   **Not a Simple Anomaly:** The intervention followed the text of Resolution 1973. The failure was not in breaking the rules, but in the rules being insufficient for the complexity of the environment.
  *   **Uncontemplated Case:** R2P was designed for Rwanda/Srebrenica scenarios (stopping a massacre within an existing conflict or war). It was not designed for **regime incapacitation via air power in a tribal society with no organized opposition.** It conflated *Negative Peace* (absence of massacre) with *Positive Peace* (stable order). The doctrine assumes that stopping the killer is the end of the mission; Libya proved that stopping the killer can be the beginning of the chaos if the state apparatus is the weapon used to kill.

  ### VI. Where the Theory Is Silent (Plain Statement)

  For your guidance redraft, you must note that R2P is silent on three critical operational realities exposed by Libya:

  1.  **The Exit Strategy for Air-Only Protection:** The theory does not explain how to disengage when protection requires the destruction of the state's coercive apparatus. It offers no path from "no massacre" to "no militia."
  2.  **The Accountability of the Protected:** The theory imposes duties on the intervener and the perpetrator, but imposes no duties on the protected opposition. It does not account for the opposition exploiting the mandate to win a civil war rather than survive a massacre.
  3.  **The Geopolitical Cost of Selectivity:** The theory treats each case in isolation. It cannot account for the fact that a "successful" Libya intervention can render the norm unusable for Syria by convincing veto-wielders that "protection" is a Trojan horse for regime change.

  **Conclusion for Guidance:**
  The Libya case suggests that a Protection of Civilians mandate executed via stand-off air power against a state actor is functionally a regime change operation, regardless of intent. Future guidance must either restrict the means (requiring ground capabilities to separate forces) or restrict the ends (accepting that protection may require negotiating with the perpetrator, not just bombing them). R2P currently allows for the former while promising the latter, creating the conditions for the Libya outcome.
