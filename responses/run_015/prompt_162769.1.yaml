prompt: |-
  I sit on the technical review panel for a programme that funds field trials of genetically engineered organisms for vector control and agricultural pest suppression. Nearly every proposal we read runs the same risk: the case for release is argued at the level of the construct or the gene — a transmission advantage, a super-Mendelian inheritance bias — while the risk assessment is argued at the level of the local population or the host–symbiont system: persistence, collapse, spread beyond the release site. When the two lines of argument point to different outcomes, we have no principled way to decide which to act on, or what we would have to measure in a two-year monitoring window to find out. What we need, then, is not another position in the units-of-selection debate but a specification: what a theory of the units of selection would have to be able to do in order to be adequate for this job — planning and auditing deliberate releases into evolving systems we cannot fully control.

  Please write that specification. Keep adequacy tied to that purpose throughout, and build it around the cases a theory would have to get right, including at least these:

  - A construct with a large within-population transmission advantage whose spread lowers the productivity or viability of the groups it invades, up to local extinction. Gene-level and group-level descriptions give different expectations here, and the theory has to tell us what to bet on, not merely how to redescribe what happened.
  - An engineered symbiont in a host–microbiome system, where heritable material moves horizontally between lineages and parent–offspring relations are not tree-like. There is no obvious answer to what the replicating unit is, and the theory has to say something actionable rather than treating this as a degenerate case.
  - A release design in which groups happen to be composed of relatives, so that the same predicted outcome can be laid out either as kin selection or as selection between groups.
  - A organism that modifies the environment in which it is selected, so that what a decomposition treats as the fixed environmental background is partly a product of the population's own heritable traits.
  - A system in which the lower-level units progressively lose the capacity to reproduce independently over the timescale of interest, so that the status of a candidate unit is itself something that changes rather than something given in advance.
  - The general worry that any observed outcome can be retrofitted to some level or other. We have to commit to measurements before we know the outcome, so the specification must say what makes a level claim testable in advance and what would count as it failing.

  For each requirement, give the case or consideration behind it, and mark it as non-negotiable or as the preference of a particular camp. Say which distinctions a candidate theory must respect and which are spurious — for instance between a replicator, an interactor, and a beneficiary; between selection of a unit and selection for a trait; between selection acting at a level and selection at that level being the strongest; between being a unit of selection and being the bearer of an adaptation; between a causal claim and a bookkeeping decomposition that is mathematically equivalent to another. If some subset of the requirements cannot be jointly satisfied — maximal generality across substrates versus testability with noisy field data, say, or refusing to presuppose a hierarchy of levels versus being able to say which partition is the real one — flag that explicitly, since a list that turns out to be internally unsatisfiable is itself the result I most want. Then name the single requirement that does the most work in excluding otherwise popular theories, and explain why.

  End, if it is cheap to do so, with a short table scoring gene-level selectionism, multi-level selection, and inclusive-fitness approaches against the list; the criteria and their motivating cases are the deliverable, not the scoring. Please do not give me a literature review, a reading list, or citations — I want the specification itself, written so that a regulator who is not a population geneticist could follow which requirements are doing real work.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Role:** Technical review panelist for a funding programme (GE organisms for vector control/pest suppression).
      *   **Problem:** Proposals argue benefits at the gene/construct level (transmission advantage) but risks at the population/ecosystem level (persistence, spread). When these conflict, there's no principled way to decide or monitor.
      *   **Task:** Write a *specification* for a theory of units of selection.
      *   **Goal:** The theory must be adequate for *planning and auditing deliberate releases into evolving systems*. It's not about philosophical truth, but regulatory utility.
      *   **Required Cases/Considerations:**
          1.  Selfish construct causing group extinction (gene vs. group expectation).
          2.  Engineered symbiont with horizontal transfer (non-tree-like heredity).
          3.  Kin selection vs. Group selection equivalence (relatives in groups).
          4.  Niche construction (organism modifies environment).
          5.  Changing unit status (loss of independent reproduction over time).
          6.  Testability/Non-retrofitting (committing to measurements *before* outcome).
      *   **Constraints:**
          *   Keep adequacy tied to the regulatory purpose throughout.
          *   Mark requirements as "Non-negotiable" or "Preference of a camp".
          *   Distinguish real vs. spurious distinctions (replicator/interactor, selection of/for, etc.).
          *   Flag internal inconsistencies if any (e.g., generality vs. testability).
          *   Identify the single requirement that does the most work excluding popular theories.
          *   End with a short scoring table (Gene-level, MLS, Inclusive Fitness).
          *   **NO** literature review, reading list, or citations.
          *   **Audience:** Regulator who is not a population geneticist (clear, actionable language).

  2.  **Deconstruct the Purpose:**
      *   This is about *risk assessment* and *monitoring*.
      *   The theory needs to predict *outcomes* (spread, persistence, extinction) based on *mechanisms* (inheritance, selection).
      *   It needs to define *what to measure* in a 2-year window.
      *   It needs to avoid post-hoc rationalization.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Case 1: Selfish Construct/Group Extinction.*
          *   *Issue:* Gene drives spread but kill the host population. Gene theory says "spread." Group theory says "extinction."
          *   *Requirement:* The theory must predict the *trajectory of the release* (does the vector population crash or persist?) not just the frequency of the allele.
          *   *Label:* Non-negotiable (Safety).
          *   *Distinction:* Selection *of* the gene vs. Selection *for* the trait in the population context.

      *   *Case 2: Symbionts/Horizontal Transfer.*
          *   *Issue:* No clear parent-offspring tree. Who is the unit?
          *   *Requirement:* Must define the unit functionally by *heritability of effect*, not just lineage. If the trait spreads horizontally, the "unit" is the mobile element + host context.
          *   *Label:* Non-negotiable (Applicability to GE).
          *   *Distinction:* Replicator vs. Interactor.

      *   *Case 3: Kin vs. Group.*
          *   *Issue:* Mathematically equivalent.
          *   *Requirement:* The theory must not force a choice if the prediction is identical. It must identify when the *partitioning* matters for intervention.
          *   *Label:* Preference (Theoretical parsimony), but practically Non-negotiable for clarity. Let's call it Non-negotiable for *actionability*. If the math is the same, the monitoring plan must be the same.
          *   *Distinction:* Causal claim vs. Bookkeeping.

      *   *Case 4: Niche Construction.*
          *   *Issue:* Environment isn't fixed.
          *   *Requirement:* Must account for feedback loops where the population changes the selection pressure.
          *   *Label:* Non-negotiable (Field reality).
          *   *Distinction:* Fixed background vs. Dynamic system.

      *   *Case 5: Changing Unit Status.*
          *   *Issue:* Organisms become obligate symbionts (lose independence).
          *   *Requirement:* Must handle units that evolve *into* new units during the monitoring period.
          *   *Label:* Non-negotiable (Long-term risk).
          *   *Distinction:* Static hierarchy vs. Dynamic transition.

      *   *Case 6: Testability/Pre-commitment.*
          *   *Issue:* Retrofitting explanations.
          *   *Requirement:* Must specify metrics *ex-ante*. If the theory can't generate a falsifiable prediction about *which level* will dominate before the data comes in, it fails.
          *   *Label:* Non-negotiable (Regulatory integrity).
          *   *Distinction:* Explanation vs. Prediction.

  4.  **Addressing Internal Tensions:**
      *   *Tension:* Generality (handling symbionts, niche construction) vs. Testability (noisy field data, 2-year window).
      *   *Resolution:* Acknowledge this. A theory that handles everything might be too vague to measure. A theory that is measurable might be too rigid for symbionts. The specification must demand *operational definitions* over ontological truth.

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most popular theories?
      *   *Candidate:* Pre-commitment to measurements (Case 6). Many theories are post-hoc explanatory frameworks. They don't generate specific, distinct predictions for monitoring plans *before* the fact.
      *   *Candidate:* Handling Horizontal Transfer (Case 2). Strict gene-selectionism often assumes vertical transmission.
      *   *Decision:* The requirement for *Ex-Ante Distinguishability* (Case 6) is the hardest. It forces the theory to move from "this explains what happened" to "measure X to see if Y happens."

  6.  **Refining Distinctions:**
      *   Replicator/Interactor/Beneficiary: Need to clarify who gets the benefit (the gene? the host?).
      *   Selection Of vs. For: Crucial for the gene-drive crash scenario.
      *   Causal vs. Bookkeeping: Crucial for Kin vs. Group.

  7.  **Drafting the Content (incorporating the "Regulator" voice):**
      *   Tone: Formal, precise, directive.
      *   Structure: Introduction (Purpose), Requirements (numbered with Case, Status, Distinction), Tension Analysis, The "Killer" Requirement, Scoring Table.

  8.  **Review against Constraints:**
      *   No citations? Check.
      *   No literature review? Check.
      *   Regulator-friendly? Check (avoid jargon where possible, explain when necessary).
      *   All 6 cases covered? Check.
      *   Non-negotiable/Preference marked? Check.
      *   Internal inconsistencies flagged? Check.
      *   Scoring table at end? Check.

  9.  **Self-Correction/Polishing:**
      *   *Critique:* Is the Kin/Group section clear?
      *   *Fix:* Emphasize that if the math is equivalent, the *intervention* point must be identified. If they are truly equivalent, the theory must say "monitoring either works." If not, it must say which one is causal.
      *   *Critique:* Is the "Changing Unit" section clear?
      *   *Fix:* Focus on the transition from facultative to obligate.
      *   *Critique:* Ensure the "Killer Requirement" is justified well.
      *   *Fix:* Explain that explanatory power $\neq$ predictive power for regulation.

  10. **Final Polish:** Check the flow and ensure the "Specification" format is maintained (not an essay, but a set of requirements). (Self-correction: The prompt asks for a specification *written* as such, not just a list. I will structure it as a formal document.)

  *(Self-Correction during drafting the response)*: I need to make sure I don't accidentally slip into academic debate. Keep the focus on *funding decisions* and *monitoring plans*. The "theory" is a tool for the panel, not a truth claim about nature.

  Let's assemble the sections.
  - **Header:** Specification for Evolutionary Risk Assessment Theory.
  - **Preamble:** Context of the mismatch (construct vs. population).
  - **Core Requirements:** 1-6 based on the prompt's cases.
  - **Feasibility Check:** The tension between generality and measurability.
  - **The Exclusionary Criterion:** The one that filters the most.
  - **Table:** Gene, MLS, Inclusive Fitness.

  *Refining the "Killer Requirement":* It's likely the "Ex-Ante Distinguishability" (Case 6). Most evolutionary theories are good at explaining the past. Few dictate specific, distinct monitoring metrics for the future that differentiate between levels *before* the data exists.

  *Refining the "Kin vs Group" (Case 3):* The prompt asks to distinguish causal claim vs bookkeeping. I need to make sure the specification demands the theory identify if the equivalence is mathematical or biological. If biological equivalence, monitoring is interchangeable. If not, the theory must pick the causal driver.

  *Refining the "Symbiont" (Case 2):* The theory cannot say "this is degenerate." It must provide a unit definition.

  Okay, ready to write.
answer: |-
  # Specification for Evolutionary Risk Assessment Theory
  **Document Type:** Technical Requirement for Funding & Monitoring Protocols  
  **Audience:** Regulatory Panel & Field Investigators  
  **Purpose:** To resolve mismatches between construct-level benefits and population-level risks in deliberate releases of genetically engineered organisms.

  ## 1. Preamble: The Operational Gap
  Current proposals demonstrate a systematic disconnect. The *justification* for release relies on gene-level dynamics (e.g., drive efficiency, inheritance bias), while the *risk assessment* relies on population-level dynamics (e.g., local extinction, ecosystem persistence). When these dynamics conflict (e.g., a gene spreads successfully by causing host extinction), current theoretical frameworks offer no principled method to prioritize one prediction over the other, nor do they specify which metrics must be measured during the monitoring window to detect the conflict early.

  This specification defines the minimum capabilities a theory of units of selection must possess to be accepted for planning and auditing deliberate releases. Adequacy is defined solely by the capacity to generate actionable, pre-committed monitoring plans that distinguish between competing evolutionary outcomes.

  ## 2. Core Requirements
  A candidate theory must satisfy the following six requirements. Each is linked to a specific failure mode observed in prior proposals.

  ### Requirement 1: Trajectory Prediction Over Allele Frequency
  *   **The Case:** A construct has a strong transmission advantage (spreads rapidly) but lowers host viability (causes population crash). Gene-level descriptions predict fixation; group-level descriptions predict extinction.
  *   **The Requirement:** The theory must predict the *joint trajectory* of the construct frequency and the host population density. It cannot treat population size as a fixed background parameter. It must specify whether the "success" of the unit (the gene) terminates the existence of the container (the population).
  *   **Status:** **Non-negotiable.** (Safety depends on knowing if the vector population collapses.)
  *   **Distinctions to Respect:**
      *   *Selection **of** a unit* (the gene increases in frequency) vs. *Selection **for** a trait* (the trait increases population productivity).
      *   *Causal Claim* (the gene causes the crash) vs. *Bookkeeping* (the crash is recorded as a group selection event).
  *   **Actionable Output:** A threshold metric (e.g., "If construct frequency exceeds X% while density drops by Y%, trigger containment").

  ### Requirement 2: Functional Heredity in Non-Tree Systems
  *   **The Case:** An engineered symbiont transfers horizontally between hosts. Parent-offspring lineages are not tree-like. Standard theories often treat this as a "degenerate" case where units are undefined.
  *   **The Requirement:** The theory must define the replicating unit functionally based on the *heritability of the effect*, not strictly by vertical lineage. If the engineered trait moves horizontally, the "unit" must be defined as the mobile element plus the host context required for its expression.
  *   **Status:** **Non-negotiable.** (Applicability to microbiome engineering.)
  *   **Distinctions to Respect:**
      *   *Replicator* (the DNA sequence) vs. *Interactor* (the host-symbiont system).
      *   The theory must identify which entity bears the risk if the horizontal transfer rate exceeds the vertical transmission rate.
  *   **Actionable Output:** A monitoring plan that tracks the *trait* in the environment, not just the *organism* carrying it initially.

  ### Requirement 3: Intervention Equivalence for Mathematical Duals
  *   **The Case:** A release design groups relatives. The outcome can be modeled equally well as Kin Selection (gene-level) or Group Selection (population-level).
  *   **The Requirement:** If two levels offer mathematically equivalent predictions, the theory must declare them *interventionally equivalent*. It must not force a choice of "true" level if the monitoring metrics are identical. However, if the equivalence breaks under environmental stress, the theory must specify *which* metric diverges first.
  *   **Status:** **Preference for Parsimony** (but Non-negotiable for Clarity).
  *   **Distinctions to Respect:**
      *   *Causal Claim* (kin recognition drives the behavior) vs. *Bookkeeping Decomposition* (mathematical partitioning of variance).
      *   If the theory claims they are distinct causes, it must provide a measurement that distinguishes them *ex-ante*.
  *   **Actionable Output:** A statement confirming whether separate monitoring for "kin structure" and "group structure" is required, or if one proxy suffices.

  ### Requirement 4: Feedback Loop Integration (Niche Construction)
  *   **The Case:** The organism modifies its environment (e.g., alters soil chemistry or host immunity), changing the selection pressure acting on it.
  *   **The Requirement:** The theory cannot treat the environment as a fixed fitness landscape. It must model the environment as a dynamic variable partly controlled by the population's heritable traits.
  *   **Status:** **Non-negotiable.** (Field reality.)
  *   **Distinctions to Respect:**
      *   *Fixed Environmental Background* vs. *Dynamic System*.
      *   *Selection acting at a level* vs. *Selection at that level being the strongest*. (The theory must account for the environment shifting which level is dominant over time.)
  *   **Actionable Output:** Identification of environmental variables that must be monitored alongside biological variables (e.g., "Measure soil nitrogen, not just worm count").

  ### Requirement 5: Dynamic Unit Status
  *   **The Case:** Over the monitoring timescale, lower-level units lose independent reproduction (e.g., a symbiont becomes obligate). The status of the "unit" changes from facultative to obligate.
  *   **The Requirement:** The theory must accommodate units whose definition changes during the trial. It cannot assume the unit of selection at Month 1 is the same as at Month 24.
  *   **Status:** **Non-negotiable.** (Evolutionary transitions in individuality.)
  *   **Distinctions to Respect:**
      *   *Being a unit of selection* vs. *Being the bearer of an adaptation*. (An entity can bear an adaptation without being a full unit of selection if it cannot reproduce independently.)
      *   The theory must specify the threshold at which a symbiont is treated as part of the host genome for risk purposes.
  *   **Actionable Output:** A "Transition Trigger" — a measurable sign that the symbiont has lost independence, requiring a shift in containment protocol.

  ### Requirement 6: Ex-Ante Distinguishability (Anti-Retrofitting)
  *   **The Case:** Post-hoc, any outcome can be explained by invoking selection at some level. We must commit to measurements before knowing the outcome.
  *   **The Requirement:** The theory must specify what data would *falsify* the claim that selection is acting at the proposed level. It must define a "failure mode" for the level claim itself. If a theory can explain any possible data distribution, it is inadmissible.
  *   **Status:** **Non-negotiable.** (Regulatory integrity.)
  *   **Distinctions to Respect:**
      *   *Explanation* (fits past data) vs. *Prediction* (constrains future data).
      *   The theory must rule out the possibility that "any observed outcome can be retrofitted."
  *   **Actionable Output:** A list of "Null Results" — specific data patterns that would prove the proposed unit of selection is incorrect.

  ## 3. Feasibility Check: Internal Tensions
  There is a recognized tension between **Requirement 2 (Generality across substrates)** and **Requirement 6 (Testability with noisy field data)**.

  *   **The Conflict:** A theory general enough to handle horizontal transfer, niche construction, and changing unit status (Req 2, 4, 5) often becomes abstract enough that it generates few specific, falsifiable predictions for a 2-year field trial (Req 6). Conversely, a theory rigid enough to generate sharp predictions often fails to model symbionts or niche construction without ad-hoc adjustments.
  *   **The Resolution:** This specification prioritizes **Testability (Req 6)**. A theory that is ontologically correct but operationally vague is useless for regulation. If a candidate theory must simplify the biology (e.g., treat a symbiont as a simple allele) to meet the testability requirement, it must explicitly state the risk that this simplification introduces. The applicant must justify that the simplification does not hide a catastrophic failure mode.

  ## 4. The Exclusionary Criterion
  **Requirement 6 (Ex-Ante Distinguishability)** is the single requirement that does the most work in excluding otherwise popular theories.

  **Why:** Most evolutionary frameworks (including standard Gene-Centered and many Multi-Level Selection models) function primarily as *explanatory languages*. They are exceptionally good at describing *why* a population changed after the fact by partitioning variance or tracing lineage. They are often poor at specifying *before the fact* which specific measurement will distinguish between "selection at level A" and "selection at level B" in a noisy, open field system.

  A theory that claims "Selection acts at the level where heritability is highest" is tautological unless it specifies how to measure heritability *before* the selection event concludes. A theory that claims "Groups are units if they have birth/death processes" is useless unless it defines the birth/death metrics for the specific organism in advance. Any theory that relies on retrospective variance partitioning is excluded by this specification.

  ## 5. Preliminary Scoring of Common Frameworks
  *Note: This scoring is based on the frameworks' typical application in literature, not their theoretical potential if modified.*

  | Requirement | Gene-Level Selectionism | Multi-Level Selection (MLS) | Inclusive Fitness (Kin Selection) |
  | :--- | :--- | :--- | :--- |
  | **1. Trajectory Prediction** | **Fail.** Often treats population size as fixed; predicts gene fixation even if host crashes. | **Pass.** Explicitly models group extinction vs. gene spread. | **Mixed.** Can model it, but often abstracts population density away. |
  | **2. Non-Tree Heredity** | **Fail.** Relies heavily on vertical transmission/lineage. | **Pass.** Can accommodate horizontal transfer as "group" migration. | **Fail.** Relies on relatedness coefficients ($r$) which break down with high horizontal transfer. |
  | **3. Kin/Group Equivalence** | **Pass.** Treats kin effects as gene-level bookkeeping. | **Mixed.** Often insists on causal distinction where math is equivalent. | **Pass.** Treats group effects as kin effects. |
  | **4. Niche Construction** | **Fail.** Treats environment as external fitness parameter. | **Mixed.** Some variants include it, but not standard models. | **Fail.** Typically assumes fixed environment for $r$ and $b$ calculations. |
  | **5. Dynamic Unit Status** | **Fail.** Unit (the gene) is static by definition. | **Pass.** Best equipped to handle transitions in individuality. | **Fail.** Unit (the actor) is usually fixed as the organism. |
  | **6. Ex-Ante Distinguishability** | **Fail.** Highly susceptible to retrofitting ("the gene won because..."). | **Fail.** Variance partitioning is often done post-hoc. | **Fail.** Predictions often rely on parameters ($r, b, c$) unknown before release. |
  | **Overall Regulatory Utility** | **Low** | **Medium** | **Low** |

  **Summary:** None of the standard frameworks currently meet the specification without modification. Multi-Level Selection comes closest on structural grounds (Requirements 1, 2, 5) but fails on testability (Requirement 6). Applicants must therefore propose a *modified* framework or a hybrid approach that explicitly addresses the Ex-Ante Distinguishability gap.
