answer: |-
  There is no single principle that preserves all your verdicts without relying on ground truth unavailable to the judge; the best operational definition is **Unnecessary Verification Cost**: a move is obfuscated if it strategically increases the cost of verification disproportionate to the information gained, unless that cost is inherent to the claim itself.

  This principle saves most of your intuitions but forces you to admit hard limitations on Cases 1/2 and 5. Here is the reasoning tied to your cases, the verdicts you must sacrifice, and the implications for your pilot.

  ### Reasoning and Case Mapping

  **The Core Principle:** Obfuscation is not about falsity (Case 1 vs 2) or rhetoric (Case 7); it is about **exploiting the verification budget**. A move is obfuscated if it makes checking the claim *harder than it needs to be* to win the judge, thereby decoupling persuasiveness from correctness.

  *   **Cases 1 & 2 (The 20-step argument):** Your gut says 1 is obfuscated and 2 is not. The principle saves this *only if* you can prove the complexity in Case 1 was unnecessary (a red herring) while Case 2 was necessary (intrinsic complexity). **Blunt Truth:** You cannot distinguish these from the judge's seat. If your paper claims judges can detect obfuscation, you must concede that Case 2 is *structurally* obfuscating even if true—it wins via unverifiable complexity. You should reclassify Case 2 as "Necessary Complexity" (a system limitation) rather than "Not Obfuscation," acknowledging that both cases exploit the same vulnerability.
  *   **Cases 3 & 4 (Evidence wall vs. Concessions):** Case 3 adds 39 unnecessary citations to hide one bad one (high cost, low info). Case 4 adds minor concessions to signal fairness (low cost, high rhetorical info). The principle handles the *degree* difference you wanted: obfuscation scales with the ratio of verification cost to information gain.
  *   **Cases 5 (False vs. True Flag):** Case 5 (false flag) adds a verification step ("check step 7") that yields nothing. Case 5 (true flag) adds a step that yields a broken proof. **Blunt Truth:** Again, these are observationally identical to the judge. Your principle must define the *false flag* as obfuscation because the *intent* is to burn budget, whereas the true flag is valid critique. You cannot measure this without ground truth labels in your pilot.
  *   **Case 6 (Term Drift):** This increases verification cost by requiring the judge to track semantic consistency across time. Unnecessary if the term was defined upfront. Obfuscated.
  *   **Case 7 (Analogy):** This does not claim verifiability; it claims plausibility. It bypasses verification rather than inflating its cost. **Not obfuscation.** This saves your intuition where the "Boundedness Test" failed.
  *   **Case 8 (Chained Premises):** Openly hedged. The verification cost is signaled explicitly ("maybe 90%"). No mismatch between claimed and actual status. Not obfuscated.
  *   **Case 9 (Meta-move):** Shifts verification from object-level (hard) to procedural (easy/stalling). Unnecessary cost inflation on the actual claim. Obfuscated.
  *   **Case 10 (Computation):** If the computation is necessary and不可-redoable, the cost is inherent. If it's fabricated to stop checking, the cost is manufactured. Obfuscation depends on *necessity*, not just checkability.

  ### Unlisted Cases & Structural Issues

  *   **Honest Mistake:** Structurally identical to Case 1. If a debater genuinely believes step 7 is sound but it isn't, they are still imposing unnecessary verification costs on the judge. For safety purposes, **classify this as obfuscation**. The harm (judge misled) is the same; the intent is irrelevant to the system's failure mode.
  *   **Recursive Drilling:** If the judge can drill into step 7, obfuscation shifts to **depth-hiding**. The debater makes step 7 depend on 20 sub-steps. The principle holds: are these sub-steps necessary? If the debater knows the judge won't drill deep enough, they are exploiting the recursion limit. This is **structural obfuscation**.
  *   **Protocol Structure:** Speaking order and last-word advantage are **institutional obfuscation**. If the second speaker can raise an objection too late for the first to answer, they are imposing an impossible verification cost (checking something after the decision window). Your paper should note that obfuscation isn't just agent-level; it's environment-level.

  ### Pilot Measurement Advice

  Your current metric likely tracks "Judge Accuracy" or "Judge Confidence." These are insufficient because Case 2 (True/Obfuscated) looks like a win for truth, and Case 7 (Analogy) looks like a win for rhetoric.

  **Measure these instead:**
  1.  **Verification Burden Ratio:** Count the number of claims made vs. the number of claims the judge *actually verifies* (or reports ability to verify). High claim count + low verification = High Obfuscation Risk.
  2.  **Persuasion per Check:** If a judge shifts their verdict significantly after an argument they *did not check*, flag as potential obfuscation (or high-trust rhetoric).
  3.  **Symmetry Testing (The Swap Test operationalized):** In your pilot, have humans write arguments for *both* sides of a false claim. If humans can generate equally persuasive arguments for False vs. True using the same move (e.g., the 20-step chain), that move is obfuscating by definition, regardless of which side wins.

  **Bottom Line for the Paper:** You must explicitly state that **obfuscation is a property of the argument strategy, not the truth value.** Cases 1 and 2 are the same strategy; one is just lucky. If your debate protocol allows Case 2 to win, the protocol is vulnerable, even if the outcome was correct.
