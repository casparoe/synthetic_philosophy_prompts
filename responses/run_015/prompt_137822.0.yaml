  **HyperScale Solutions Announces General Availability of Non-Turing Tier**

  **SAN FRANCISCO, CA** — HyperScale Solutions, a leader in serverless infrastructure, today announced the general availability of its Non-Turing Tier, enabling customers to execute effective procedures beyond the limits of classical recursion.

  "For decades, engineering was constrained by the assumption that physical computation must mirror formal logic," said Gavin Belson, CEO of HyperScale. "Our new architecture decouples the informal notion of an effective procedure from the discrete steps of a Turing machine. We are not just optimizing code; we are optimizing the definition of computability itself. Clients no longer need to worry about finite mechanical methods."

  Dr. Aris Thorne, Chief Ontology Officer, added, "The Church-Turing thesis exists in two forms: the mathematical identification of effective methods, and the physical claim that the universe obeys those methods. The mathematical thesis remains a definition, but the physical thesis is an empirical hypothesis. HyperScale has simply falsified the hypothesis. We treat the mathematical thesis as a service level agreement."

  **Frequently Asked Questions**

  1. **What resources power the Non-Turing Tier?**
     Compute jobs are dynamically routed to one of three specialized backends designed to transcend recursive limits. The Zeno Accelerator performs infinite iterations within a bounded clock cycle by halving step duration. The Analog Co-Processor utilizes continuous physical quantities to store non-recursive information. The Malament-Hogarth Availability Zone leverages spacetime geometries where the infinite future lies in the causal past of the result retrieval event. Each resource is billed as a standard engineering achievement.

  2. **How does the Zeno Accelerator signal completion?**
     Infinite step sequences conclude at a specific limit point in time. The output bit is latched at this endpoint for retrieval. Customers distinguish a completed job from a running process via a status flag that updates only after the infinite sequence has resolved. If the program does not halt, the status flag remains pending indefinitely, consistent with standard semantics. Observation is handled automatically by the latch mechanism.

  3. **How is the Analog Co-Processor billed?**
     This service is offered under the Oracle Deposition premium tier. Customers supply the initial condition as a genuine real number containing infinitely many significant digits. Billing is calculated per digit of precision deposited into the physical quantity. While the hardware cannot in principle verify the infinite parameter, invoices reflect the parameter precision requested at configuration time.

  4. **How does causality work in the Spacetime Availability Zone?**
     In this zone, results are available before the job is submitted in the customer's reference frame. However, audit trails and invoice dating are generated from inside the machine's frame to ensure consistency. Customers should expect delivery timestamps prior to request timestamps on their local logs. Service-level agreements are written from inside the machine's frame.

  5. **What happens if a result is incorrect?**
     Discrepancies indicate a local violation of the physical Church-Turing thesis, not the mathematical thesis. Such failures are covered under the standard SLA as hardware degradation. Support will not refund based on logical impossibility, as the mathematical thesis remains unfalsified by definition. A failure refutes only the physical thesis for that particular hardware.

  6. **Are results verified?**
     Yes. To maintain data integrity, all outputs from the Non-Turing Tier are independently re-checked on ordinary Turing-complete instances to ensure correctness. This validation step ensures that the compute time is identical to standard instances. Consequently, the only measurable difference between the Non-Turing Tier and the free tier is the invoice.

  "I spent thirty years teaching that you cannot compute the uncomputable," said an unnamed professor of computer science, rubbing his temples. "HyperScale has found a way to charge you for the answer you already have, provided you agree to wait for them to check it on a laptop."
