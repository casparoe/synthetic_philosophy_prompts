answer: |-
  There is no single, canonical name for this specific shape of error in the way "Confirmation Bias" or "The Sunk Cost Fallacy" exist. You have not missed a term; the phenomenon sits at a messy intersection of **formal epistemology**, **linguistic pragmatics**, and **information theory**.

  However, because you need a handle for this in a newsroom, I will give you the closest academic concepts, and then coin a precise term for your specific context with defined boundary cases.

  ### 1. The Closest Existing Concepts

  You are describing a collision between **Logic** (where "If P then Q" tells you nothing about P) and **Communication** (where saying "If P then Q" tells you something about the speaker's mind).

  *   **Gricean Implicature (Maxim of Relation):** In pragmatics, why did the source speak *now*? If a source volunteers "If P, then Q," they implicate that P is a **live hypothesis**. If they thought P was impossible, stating the conditional would be uncooperative (a waste of your time). Your newsroom is correctly detecting the implicature ("P is live") but incorrectly converting it into evidence ("P is likely").
  *   **The Problem of Conditionalization (Igor Douven):** Philosopher Igor Douven has written extensively on "Learning from Conditionals." He argues that standard Bayesian updating cannot account for learning a conditional statement. He suggests that in social contexts, hearing a conditional *should* shift your credence in the antecedent, but only because of the **reliability of the source**, not the logic of the sentence.
  *   **Selection Bias (The Spreadsheet Problem):** When the source chooses *which* conditional to reveal from a set of possibilities, this is **Strategic Disclosure**. The data isn't the conditional; the data is the *selection* of the conditional.

  ### 2. The Coinage: "The Antecedent Bleed"

  For your purposes, I propose calling this **The Antecedent Bleed**.

  **Definition:** Antecedent Bleed occurs when a conditional statement ($P \to Q$) is treated as evidence for the antecedent ($P$), causing confidence in the "if" to rise without independent verification, often dragging confidence in the "then" ($Q$) up with it.

  **Why "Bleed"?** It captures the osmotic nature of the error. Confidence leaks from the *relationship* into the *condition*.

  #### Boundary Cases: What counts and what doesn't

  For a case to count as **Antecedent Bleed**, three conditions must be met:

  1.  **The Antecedent is Epistemically Open:** Before the statement, the newsroom had no specific reason to think $P$ was true (e.g., no data on the strain, no data on the cooling loop).
  2.  **The Conditional is Specific, Not General:** The statement is about a particular event, not a universal law.
      *   *Counts:* "If *this* reactor failed, debris will be in filter 2." (Antecedent Bleed)
      *   *Doesn't Count:* "If *any* reactor fails this way, debris is found in filter 2." (This is a general law; citing it doesn't imply *this* reactor failed.)
  3.  **The Update is Asymmetric:** Confidence in $P$ rises *more* than can be justified by the mere fact that $P$ is now "live."

  **The Nearest Miss:** **Conditional Perfection**.
  This is when listeners interpret "If P then Q" as "If and only if P then Q."
  *   *Difference:* In Conditional Perfection, I believe Q *only* if P. In Antecedent Bleed, I believe P *because* you told me about Q. They often happen together, but they are distinct errors.

  ### 3. The Variations You Asked About

  **A. The "Spreadsheet" Variation (Source Selection)**
  *   **Name:** **The Curated Conditional**.
  *   **Is it the same problem?** It is the *cause* of the Antecedent Bleed.
  *   **Mechanism:** If the source had 50 conditionals and gave you the scary one, they have signaled that *they* believe the antecedent is plausible. Your newsroom is reacting to the **signal**, not the **sentence**.
  *   **Correction:** You must update on the *source's belief*, not the *fact*. The equation changes from "What is the probability of the strain?" to "What is the probability that the source *believes* the strain is present?" These are not the same.

  **B. The "Complementary Ifs" Variation**
  *   **Name:** **The False Exhaustion**.
  *   **Scenario:** "If P, 80%. If not-P, 40%."
  *   **Is it the same?** No, this is a mathematical trap, not a pragmatic one.
  *   **Mechanism:** This looks like the Law of Total Probability, but it lacks the **Prior**. $P(Q) = P(Q|P)P(P) + P(Q|\neg P)P(\neg P)$. You have the conditionals, but you do not have $P(P)$.
  *   **The Error:** Newsrooms implicitly assign $P(P) = 0.5$ (The Principle of Indifference) because they have no other number. This creates a false sense of precision.
  *   **Correction:** This isn't Antecedent Bleed; it's **Prior Neglect**. The "if" doesn't move; it's just ignored.

  ### 4. How to Stop It (The "Rigidity Test")

  To check if your newsroom is suffering from Antecedent Bleed, apply the **Rigidity Test**.

  Ask the source (or yourself): *"Would you have told me this conditional if you knew the 'if' part was false?"*

  *   **If Yes:** (e.g., "If the cooling loop failed, there's debris. But even if it didn't, I wanted you to know where to look for debris just in case.") -> **No Bleed.** The antecedent stays put.
  *   **If No:** (e.g., "I wouldn't have bothered mentioning the debris filter if I didn't think the cooling loop was suspect.") -> **Bleed Confirmed.** The source is signaling suspicion.

  **The Journalistic Fix:**
  When you receive an If-Then tip, write the headline as: **"Source Suspects P, Says Q Would Follow."**
  Do not write: **"Q Likely Due to P."**

  ### Summary for your Style Guide

  *   **The Phenomenon:** **Antecedent Bleed**.
  *   **The Mechanism:** Confusing a **Relevance Implicature** ("P is worth talking about") with **Evidentiary Support** ("P is true").
  *   **The Selection Variant:** **The Curated Conditional** (Signal vs. Sentence).
  *   **The Complementary Variant:** **Prior Neglect** (Math without inputs).

  You are dealing with human signaling dressed up as logical deduction. The "if" moves because in conversation, "if" rarely means "if"; it often means "I have reason to suspect." Your job is to separate the suspicion from the math.
