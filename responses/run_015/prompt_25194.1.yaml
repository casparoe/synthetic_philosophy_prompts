      *   *Setup:* Imagine a room. It's pitch black. You turn on a light. You ask "Why is there light?"
      *   *Science:* "Because I flipped the switch."
      *   *Philosophy:* "Why is there a switch? Why is there electricity? Why is there a room?"
      *   *Ultimate:* "Why is there light rather than darkness?"
      *   *Problem:* Light is energy (something). Darkness is absence.
      *   *Better:* **The "Borrowed Existence" (The Check).**
      *   *Let's go with **The "Ultimate Why" Ladder.***
      *   *Okay, I have a winner:* **The "Explanation Batton."**
      *   *No, I'll recommend **The "Inventory of the Universe."*** It's the clearest way to show "Totality."
      *   *Actually, **The "Shadow Play"** is more evocative.*
