prompt: |-
  I'm on a tiny analytics team at a hospital system (four of us: one actual statistician, two clinicians, and me), and every quarter we put out comparisons — two surgical techniques for the same condition, readmission rates for two of our sites, a new discharge protocol against the old one, and ocasionally two named surgeons. Inevitably one of the numbers flips when you cut it by severity, or by age band, or by whether the patient came in through the ED, and then the meeting turns into the same argument every single time: whoever looks bad in the big table says the cut-up version is the real story, whoever looks bad in the cut-up version says the aggregate is what actually happened to actual patients. I want to write down a real procedure we can run each quarter instead of re-litigating this from scratch, and I want it to be honest about which parts are genuine judgment calls dressed up as method.

  What I have in mind is: an ordered list of questions to walk through the moment a reversal shows up, what counts as a good enough answer to each, where the procedure just stops with a "no" (report the aggregate, or refuse to cut at all), and where it hands the decision to a person because the question is really about values, or about what the committee actually wanted to know. A few specific things keep tripping us up and I'd want the procedure to say something about each. One: sometimes the variable we want to cut by is something that happened *after* the treatment started — whether they got admitted to ICU, how long they waited, whether they were discharged to a rehab facility — and my suspicion is that cutting by those is basically cheating, but I can never explain why in a way that lands with the clinicians. Two: the severity score is assigned by different people at the two sites, or it's continuous, and whether we cut it in half or into quartiles seems to decide whether the reversal shows up at all; also half our strata have like nine patients in them and I don't trust the reversal to be real rather than noise. Three: if we actually adopt the protocol, the case mix won't stay still, so the aggregate we computed on last year's mix presumably isn't a forecast of anything. Four, and this is the bit I keep coming back to: I think there are genuinely different questions hiding inside "which one is better" — better for the mix of patients we happened to see, better for a patient whose type we already know, better for a patient who walks in tomorrow and whose type nobody knows yet, and better as a rule we could actually implement, which might mean routing type-1 patients to A and type-2 to B, a thing neither "always A" nor "always B" captures at all — and I think those can have different right answers, so at some point the procedure has to stop and ask a human which question was meant. My friend who does A/B testing at a tech company says they never look at the aggregate at all, they always segment, which sounds wrong to me but I can't quite say why.

  So: can you write the procedure, then run it on three cases and show the output? Case one: technique A beats B on complications overall but B beats A within both the mild and the severe group, and the severe cases mostly went to B. Case two: our site has worse readmissions than the other site overall but better within every age band, and the two sites' intake nurses grade severity differently. Case three should be the one that's annoying for us: we've been reporting a stratified number for a discharge protocol for the last two quarters that makes our unit look fine, and the thing we cut by — whether the patient ended up in a step-down unit — I now think might be downstream of the protocol itself, so tell me whether the procedure says to drop that number and what we should have reported instead. Constraints: maybe half a day per report, spreadsheets and R, output gets read by clinicians who will tolerate the word confounder but whose eyes glaze over at anything more technical than that, and whatever it says I have to be able to defend it when a department chair accuses us of massaging the numbers. Also please say plainly what the procedure can't do — where it just doesn't have an answer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**

      *   **Context:** Tiny hospital analytics team (4 people: 1 statistician, 2 clinicians, 1 analyst/user). Quarterly reports comparing techniques, sites, protocols, or surgeons.
      *   **Problem:** Simpson's Paradox/reversals happen constantly. Meetings devolve into arguments about whether aggregate or stratified data is "real."
      *   **Goal:** A written procedure (protocol) to handle reversals objectively. It needs to acknowledge judgment calls, stop at specific points, and hand off value judgments to humans.
      *   **Specific Pain Points to Address:**
          1.  *Post-treatment variables:* Cutting by things that happen *after* treatment starts (collider bias/mediator issues).
          2.  *Measurement noise/Arbitrary bins:* Severity scores assigned differently, continuous variables binned arbitrarily, small sample sizes in strata.
          3.  *Non-stationarity:* Case mix changes if a protocol is adopted (aggregate isn't a forecast).
          4.  *Different Questions:* "Better for past mix" vs. "Better for known patient" vs. "Better for future unknown" vs. "Better as a routing rule."
          5.  *Tech Company Friend:* Says "always segment," user suspects this is wrong in this context.
      *   **Constraints:** ~0.5 day per report, Excel/R, audience is clinicians (tolerate "confounder," not "structural causal model"), must be defensible against accusations of massaging numbers.
      *   **Deliverables:** The Procedure itself + 3 Case Studies run through the procedure.
      *   **Tone:** Honest, pragmatic, defensible, clear about limitations.

  2.  **Deconstruct the Statistical/Epistemological Issues:**

      *   *Simpson's Paradox:* This is the core phenomenon. It arises when a confounding variable is unevenly distributed across groups.
      *   *Causal Inference:* To decide between aggregate vs. stratified, we need to know the causal structure. Is the stratification variable a *confounder* (cause of both treatment and outcome)? Or a *mediator* (caused by treatment)? Or a *collider* (caused by both)?
      *   *Post-Treatment Bias:* Cutting by ICU admission or Step-down unit is usually bad because the treatment might influence admission to ICU. This creates selection bias.
      *   *Measurement Error:* If severity is subjective/site-specific, stratifying by it introduces noise or bias.
      *   *Sample Size:* Small strata = high variance = unreliable reversals.
      *   *Decision Theory:* What is the decision being made? Policy (aggregate) vs. Personalized Medicine (stratified).

  3.  **Drafting the Procedure (The "Protocol for Reversals"):**

      *   *Structure:* Needs to be a flowchart or ordered list. Let's go with an Ordered Checklist with Stop/Go decisions.
      *   *Step 1: Define the Question.* (Addresses Pain Point 4). Before looking at data, what decision is this informing?
      *   *Step 2: Check the Stratification Variable.* (Addresses Pain Point 1 & 2). Is it pre-treatment? Is it measured consistently?
      *   *Step 3: Check Sample Stability.* (Addresses Pain Point 2). Are strata big enough?
      *   *Step 4: Causal Plausibility.* (Addresses Pain Point 1). Did the treatment affect the stratifier?
      *   *Step 5: The Decision Rule.* (Addresses Pain Point 3 & 4). Based on Step 1, which number do we show?
      *   *Limitations Section:* Crucial for honesty. It can't fix bad data, it can't predict the future perfectly, it can't resolve value conflicts.

  4.  **Developing the Case Studies:**

      *   *Case 1 (Classic Simpson's):* Technique A vs. B. Severity is the confounder. Severe cases went to B. B looks worse overall, better in strata.
          *   *Analysis:* Severity is pre-treatment (usually). Stratified is likely the causal effect. Aggregate is the "policy" effect given current referral patterns.
          *   *Verdict:* Report stratified for clinical efficacy, aggregate for resource planning.
      *   *Case 2 (Measurement Bias):* Site readmissions. Age bands show reversal. Severity grading differs by site.
          *   *Analysis:* Severity is untrustworthy. Age is trustworthy. But if age explains it, it's confounding. However, if severity grading differs, we can't adjust for severity reliably.
          *   *Verdict:* Trust Age stratification over Aggregate? Wait, if Site A takes sicker patients (unmeasured severity), aggregate is unfair. But if we can't measure severity, we can't adjust. This is a "Data Quality Stop."
      *   *Case 3 (Post-Treatment Bias):* Discharge protocol. Stratified by Step-down unit.
          *   *Analysis:* Step-down status is *after* the protocol. The protocol likely dictates step-down usage. This is collider/mediator bias.
          *   *Verdict:* **STOP.** Do not report stratified. Report Aggregate or find a pre-treatment stratifier.

  5.  **Refining the Tone and Content:**

      *   *Clinician Audience:* Avoid $Y = \beta_0 + \beta_1 X$. Use "Did the treatment cause this grouping?" instead of "Mediator." Use "Noise" instead of "Variance."
      *   *Defensibility:* The procedure must be written down *before* the analysis ideally, but certainly applied consistently. It shifts blame from the analyst to the protocol.
      *   *The "Tech Friend" Comment:* A/B testing assumes randomization. Hospital data is observational. In observational data, aggregate is often biased by confounding. In RCTs, aggregate is unbiased. This is why "always segment" is wrong in hospitals (small N, measurement error) but right in Tech (huge N, perfect randomization). I need to address this in the limitations or intro.
      *   *Honesty:* Admit that sometimes the answer is "We don't know."

  6.  **Writing the Procedure (Iterative refinement):**

      *   *Name:* "The Quarterly Reversal Protocol."
      *   *Phase 1: The Intent (Pre-Analysis).* Define the decision.
      *   *Phase 2: The Variable Audit.* Is the cut valid? (Pre-treatment? Reliable?)
      *   *Phase 3: The Stability Check.* (N per cell).
      *   *Phase 4: The Selection.* Which number to report based on Phase 1.
      *   *Phase 5: The Disclaimer.* What this number doesn't mean.

  7.  **Running the Cases:**

      *   *Case 1:* Severity is pre-treatment. N is likely okay (surgical techniques). Decision: Clinical efficacy = Stratified. Resource impact = Aggregate.
      *   *Case 2:* Severity is unreliable (inter-rater reliability issue). Age is okay. But if severity drives readmission and we can't measure it, we have residual confounding. Procedure should flag "Unmeasured Confounding Risk."
      *   *Case 3:* Step-down is post-treatment. Procedure says "Reject Stratification." Report Aggregate.

  8.  **Final Review against Constraints:**

      *   *Half day per report:* The procedure needs to be quick to apply. No running new DAGs or complex propensity scoring. Just logic checks.
      *   *Defensible:* It relies on established causal principles (temporality, measurement reliability) without needing advanced math.
      *   *Limitations:* Explicitly state where it fails (unmeasured confounding, policy changes).

  9.  **Self-Correction/Nuance Check:**
      *   *Correction on Case 2:* If severity is measured differently, we can't use it to adjust. But if Age shows a reversal, Age is a valid confounder. However, if Site A takes sicker patients *within* age bands (unmeasured), the Age-stratified result is still biased. The procedure needs to acknowledge that stratification doesn't guarantee truth if measurement is bad.
      *   *Correction on Case 3:* The user says they *have been* reporting stratified. The procedure needs to explicitly say "Stop doing this."
      *   *Tech Friend:* Explain that Tech has randomization (no confounding), Hospitals don't. That's why Aggregate works in Tech (it's the Average Treatment Effect) but fails in Hospitals (it's Confounded).

  10. **Final Polish:** Ensure the voice is empathetic to the analyst's position (stuck in the middle) and respectful to the clinicians (who care about patients, not p-values). (Proceed to generate output).

  *(Self-Correction during drafting)*: Make sure the "Stop" conditions are clear. If a variable is post-treatment, the procedure must hard-stop the stratified analysis. No "maybe."

  *(Refining the "Decision Question" part)*: This is the most important part. I need to make sure the distinction between "Which treatment is biologically superior?" vs "Which policy should we adopt?" is clear.

  *(Final check on limitations)*: The prompt asks to say plainly what it can't do. I will add a specific section "What This Procedure Cannot Save You From."

  Let's assemble.cw
answer: |-
  Here is a draft of the procedure, followed by the three case studies run through it. It is designed to be printed, kept in a binder, and referenced during the quarterly meeting. It shifts the argument from "which number do you like?" to "does this number pass the protocol?"

  ***

  # The Quarterly Reversal Protocol (QRP)
  **Version 1.0 | Analytics & Quality Committee**

  **Purpose:** To standardize how the analytics team reports comparative data when aggregate (overall) and stratified (cut-up) results disagree (Simpson's Paradox). This protocol prevents ad-hoc arguments and ensures numbers match the clinical or operational question being asked.

  **Scope:** Applies to any quarterly comparison where a subgroup analysis reverses the direction of the main effect.

  **Time Budget:** Max 4 hours analysis time per report.

  ---

  ## Phase 1: Define the Decision (Before Analysis)
  *Before running the models, the requestor must select **one** primary question. If you don't know the question, you don't know which number is right.*

  1.  **Efficacy Question:** "Biologically/clinically, which option works better for a specific patient type?" (e.g., Which drug lowers BP?)
      *   *Target Output:* Stratified/Adjusted rates.
  2.  **Policy Question:** "Given how patients actually arrive here, which option yields better system outcomes?" (e.g., Should we adopt this protocol system-wide?)
      *   *Target Output:* Aggregate rates (potentially weighted).
  3.  **Equity Question:** "Is one group being harmed disproportionately?"
      *   *Target Output:* Stratified rates are mandatory.

  **STOP RULE:** If the meeting cannot agree on the question *before* seeing the reversal, report **Aggregate Only** with a note: *"Case mix differences prevent causal inference."*

  ---

  ## Phase 2: The Variable Audit (The "Cut" Check)
  *When a reversal appears, audit the variable used to cut the data (e.g., Severity, Age, ICU Status).*

  **Check 1: Temporality (The "Cheating" Check)**
  *   **Question:** Was the grouping variable determined *before* the treatment/protocol started?
  *   **Pass:** Age, Gender, Admission Source (ED vs. Clinic), Pre-existing Comorbidities.
  *   **Fail:** ICU Admission, Length of Stay, Discharge Destination, Complication Status.
  *   **Rule:** If **Fail**, you **cannot** stratify by this variable. It is likely a result of the treatment, not a cause of the outcome. Stratifying creates artificial bias.
  *   **Action:** Discard stratified table. Report Aggregate.

  **Check 2: Measurement Reliability (The "Apples" Check)**
  *   **Question:** Is the variable measured identically across the groups being compared?
  *   **Pass:** Lab values, Age, Binary flags from EHR (e.g., Diabetes Y/N).
  *   **Fail:** Severity scores assigned by different teams, Pain scores, "High Risk" flags determined by local nurses.
  *   **Rule:** If **Fail**, do not trust the stratification. Differences in scores may reflect grading culture, not patient health.
  *   **Action:** Flag as "Unreliable Adjustment." Report Aggregate with a warning about case mix.

  **Check 3: Stability (The "Noise" Check)**
  *   **Question:** Are there enough patients in the smallest stratum to trust the rate?
  *   **Rule:** If any stratum has $< 20$ patients (or $< 5$ events for rare outcomes), the reversal is likely statistical noise.
  *   **Action:** Suppress the stratified view. Report Aggregate.

  ---

  ## Phase 3: The Reporting Decision
  *Based on Phase 1 and 2, select the table for the slide deck.*

  | Decision Path | Report This | Do Not Report This | Required Footnote |
  | :--- | :--- | :--- | :--- |
  | **Efficacy Question** + **Variable Passes Audit** | Stratified | Aggregate | "Adjusted for case mix. Reflects clinical effect, not volume." |
  | **Policy Question** + **Variable Passes Audit** | Aggregate | Stratified | "Reflects actual performance given current patient intake." |
  | **Variable Fails Audit** (Post-treatment or Unreliable) | Aggregate | Stratified | "Stratification invalid due to [Reason]. Aggregate includes case mix effects." |
  | **Stability Fails** (Small N) | Aggregate | Stratified | "Subgroups too small for reliable comparison." |

  ---

  ## Phase 4: Limitations (What This Cannot Do)
  *This section must be read aloud if anyone claims the reported number is "The Truth."*

  1.  **It cannot fix unmeasured confounding.** If Site A takes sicker patients but we don't have a reliable severity score, the Aggregate will make Site A look bad, and the Protocol cannot fix that.
  2.  **It cannot predict the future.** If we adopt a protocol, patient mix *will* change. Last year's Aggregate is not next year's forecast.
  3.  **It cannot resolve value conflicts.** If "Better for mild patients" conflicts with "Better for severe patients," this protocol tells you which number to show, not which option to pick. That is a leadership decision.

  ***

  # Case Study Runs
  *Below are the three scenarios you provided, run through the QRP to demonstrate the output.*

  ## Case 1: Surgical Techniques (The Classic Reversal)
  **Scenario:** Technique A has fewer complications overall. Technique B has fewer complications within "Mild" and "Severe" groups. Most "Severe" patients went to Technique B.
  **Variable:** Disease Severity.

  **Phase 1: Define Decision**
  *   *Committee Discussion:* Are we deciding which technique is biologically superior (Efficacy), or which one to mandate given our current referral patterns (Policy)?
  *   *Selection:* **Efficacy.** (Clinicians want to know which knife is sharper).

  **Phase 2: Variable Audit**
  *   *Temporality:* Severity is assessed at diagnosis, before surgery. **PASS.**
  *   *Reliability:* Severity score is standardized across surgeons. **PASS.**
  *   *Stability:* Both strata have >100 patients. **PASS.**

  **Phase 3: Reporting Decision**
  *   *Path:* Efficacy Question + Variable Passes.
  *   **Output:** **Report Stratified.**
  *   **Footnote:** "Technique B shows lower complication rates within risk groups. Aggregate favors A only because A treated mostly mild cases."

  **Analyst Note:** This addresses your tech friend's comment. In A/B testing (Tech), randomization ensures severity is balanced, so Aggregate = Truth. In Hospitals, severity is *not* balanced (surgeons pick cases), so Aggregate = Bias. For Efficacy, Stratified is the only honest number.

  ---

  ## Case 2: Site Readmissions (The Measurement Trap)
  **Scenario:** Site 1 has worse readmissions overall. Site 1 looks better within every Age Band. However, "Severity" is graded by intake nurses at each site differently.
  **Variable:** Age Band (Primary), Severity Score (Secondary).

  **Phase 1: Define Decision**
  *   *Committee Discussion:* We want to know if Site 1 is providing worse care (Efficacy/Quality).
  *   *Selection:* **Efficacy.**

  **Phase 2: Variable Audit**
  *   *Temporality:* Age is pre-treatment. **PASS.**
  *   *Reliability:* Severity scores are site-specific (nurses grade differently). **FAIL.**
  *   *Stability:* Age bands are large enough. **PASS.**

  **Phase 3: Reporting Decision**
  *   *Path:* Variable Fails Audit (Severity).
  *   *Conflict:* Age shows a reversal, but Age is a blunt tool. Severity is the real driver of readmissions, but we can't trust the Severity data.
  *   **Output:** **Report Aggregate (with heavy warning).**
  *   **Reasoning:** While Age stratification shows a reversal, we suspect residual confounding by Severity. Because Severity measurement failed the audit, we cannot claim the Age-stratified number is "adjusted." The Aggregate is the only number that reflects *actual* readmissions, even if it punishes Site 1 for taking sicker patients.
  *   **Footnote:** "Site 1 shows higher raw readmissions. Stratification by Age suggests better performance, but Severity scoring is not comparable between sites. Unmeasured sickness may explain the difference. Do not use for bonus calculations."

  **Analyst Note:** This protects you. You aren't saying Site 1 is worse; you're saying the data isn't good enough to say they are better. You refuse to "massage" the numbers by using a flawed severity score.

  ---

  ## Case 3: Discharge Protocol (The Post-Treatment Trap)
  **Scenario:** You have been reporting a stratified number for a discharge protocol for two quarters. The stratification is by "Step-Down Unit Admission." The protocol makes your unit look fine in the stratified view. You suspect the protocol *influences* who goes to Step-Down.
  **Variable:** Step-Down Unit Admission.

  **Phase 1: Define Decision**
  *   *Committee Discussion:* Is the protocol safe? (Efficacy).
  *   *Selection:* **Efficacy.**

  **Phase 2: Variable Audit**
  *   *Temporality:* Step-Down admission happens *after* the discharge protocol is initiated. The protocol likely dictates whether they go to Step-Down. **FAIL.**
  *   *Reliability:* N/A (Failed temporality).
  *   *Stability:* N/A (Failed temporality).

  **Phase 3: Reporting Decision**
  *   *Path:* Variable Fails Audit (Post-Treatment).
  *   **Output:** **DROP THE STRATIFIED NUMBER IMMEDIATELY.** Report Aggregate.
  *   **Reasoning:** This is "collider bias." By cutting by Step-Down, you are comparing patients the protocol *allowed* to go to Step-Down vs. those it didn't. You are selecting on the outcome.
  *   **Footnote:** "Previous reports stratified by Step-Down status. This is methodologically invalid as Step-Down placement is influenced by the protocol. Current report reflects Aggregate outcomes only."

  **Analyst Note:** This is the hardest conversation. You must admit the last two quarters were misleading.
  *   *Script for the Chair:* "We found a methodological error in our past reporting. Cutting by Step-Down is like cutting by 'Survived the Surgery' when measuring Surgery Safety. It hides the deaths. We are correcting the record to Aggregate to ensure patient safety isn't masked."
  *   *What to report instead:* If you need to know "For whom does this work?", find a **pre-treatment** variable. Age? Comorbidity Count? Home Support Status? If none exist, you must report Aggregate and acknowledge you don't know *who* it works for, only *if* it works on average.

  ***

  # What This Procedure Cannot Save You From
  *Be prepared to read this if the Committee pushes back.*

  1.  **The "True" Causal Effect:** If there is a confounder we didn't measure (e.g., socioeconomic status, patient adherence), both Aggregate and Stratified numbers are biased. This protocol prevents *obvious* errors, not *invisible* ones.
  2.  **The "Right" Decision:** If Technique A is better for Mild patients and Technique B is better for Severe patients, this protocol will tell you to report the Stratified table. It will **not** tell you which technique to buy. That is a value judgment: Do we prioritize the majority (Mild) or the vulnerable (Severe)?
  3.  **Future Performance:** If you adopt the "Better" protocol, referrals may change. (e.g., If Site 1 gets a reputation for handling severe cases, they will get *more* severe cases). The Aggregate number will get worse even if care improves. This protocol reports history, not prophecy.

  **Final Defense:**
  If a Department Chair accuses you of massaging numbers, point to **Phase 2, Check 1**.
  *"We did not choose the number that made us look good. We chose the number that passed the Temporality Check. If you want the other number, you need to show me that the grouping variable was determined before treatment started."*
  This moves the argument from your integrity to the timeline of clinical care.
