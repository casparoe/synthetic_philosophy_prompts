prompt: |-
  I sit on my hospital's clinical ethics committee. A 62-year-old patient, now in a prolonged disorder of consciousness after an anoxic brain injury, left an advance directive fifteen years ago refusing artificial nutrition, hydration, and any life-prolonging intervention should she ever enter a state she described as "permanent absence of the kind of self-awareness that makes life valuable to me." The document contains an unusual clause: if clinical evidence ever showed that she retained a form of present-moment emotional responsiveness without autobiographical memory or future-oriented planning, the directive should be treated as a strong but rebuttable presumption rather than an absolute instruction.

  She now exhibits exactly that profile—consistent affective orientation to familiar voices and aversive responses to invasive care, but no demonstrable self-reference or temporal continuity. Her spouse insists the directive applies literally and demands withdrawal of nutrition within seventy-two hours; her adult child argues that the rebuttable clause has been triggered and that her current experiential welfare should govern.

  Our institution has no policy for interpreting conditional directives of this kind. Please draft the short written opinion I will circulate before Thursday's meeting: it should recommend a concrete course of action with a specific time frame (for example, whether to convene an independent neuropsychological assessment panel, continue or withdraw treatment pending that evaluation, or seek judicial clarification), and it should engage seriously with the strongest argument for honoring the earlier directive—namely, that allowing present welfare to override a deliberately conditional instruction collapses the distinction between respecting autonomy and substituting our own judgment—rather than merely citing legal precedent or clinical definitions of consciousness.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital's clinical ethics committee.
      *   **Task:** Draft a short written opinion to circulate before Thursday's meeting.
      *   **Patient:** 62-year-old female, prolonged disorder of consciousness (DoC) after anoxic brain injury.
      *   **Advance Directive (AD):** 15 years old. Refuses artificial nutrition/hydration (ANH) and life-prolonging interventions if in a state of "permanent absence of the kind of self-awareness that makes life valuable to me."
      *   **Crucial Clause:** If clinical evidence shows "present-moment emotional responsiveness without autobiographical memory or future-oriented planning," the directive is a *strong but rebuttable presumption*, not absolute.
      *   **Current Status:** Matches the clause exactly (affective orientation to voices, aversive responses to care, no self-reference/temporal continuity).
      *   **Conflict:** Spouse wants literal interpretation (withdraw ANH within 72 hours). Adult child argues the rebuttable clause is triggered (current welfare should govern).
      *   **Institutional Context:** No policy for interpreting conditional directives.
      *   **Requirements:**
          *   Recommend a concrete course of action with a specific time frame.
          *   Engage seriously with the strongest argument for honoring the earlier directive (Autonomy vs. Substituted Judgment/Paternalism).
          *   Do *not* merely cite legal precedent or clinical definitions.
          *   Tone: Professional, ethical, reasoned, suitable for committee circulation.

  2.  **Deconstruct the Ethical Dilemma:**
      *   **Autonomy (Past Self):** The AD represents the patient's prior competent wishes. The spouse argues for strict adherence to protect her integrity and prevent others from imposing values on her.
      *   **Beneficence/Non-maleficence (Present Self):** The patient shows signs of emotional experience (pain/distress/comfort). The child argues that killing a being capable of emotional response violates current welfare.
      *   **The "Rebuttable Presumption" Clause:** This is the pivot point. It acknowledges the possibility of a change in moral status based on specific neurological/psychological findings. It essentially says, "If I am still capable of *feeling*, even if I can't *think* about myself, reconsider."
      *   **The Risk:** If we ignore the AD based on current welfare, we risk paternalism (deciding life is worth living for someone who said it wasn't). If we follow the AD strictly despite the clause, we risk violating the specific condition the patient set for *not* following the AD absolutely.

  3.  **Determine the Recommended Course of Action:**
      *   *Option A: Withdraw immediately.* Ignores the rebuttable clause. High risk of ethical error given the specific clinical findings.
      *   *Option B: Continue indefinitely.* Ignores the AD's primary instruction. Disrespects prior autonomy.
      *   *Option C: Pause and Assess.* This seems the most ethically robust. The clause requires determining if the condition is met *and* what the implication is. Since the committee has no policy, and the family is divided, a formal assessment is needed to validate the clinical picture before acting on the "rebuttal."
      *   *Time Frame:* Needs to be urgent but not rash. 72 hours (Spouse's demand) is too tight for a proper assessment. 2-4 weeks is reasonable for an independent panel.
      *   *Action:* Convene an independent neuropsychological/ethics assessment panel. Maintain current treatment (status quo) during assessment to prevent irreversible harm while the question is resolved.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation regarding Patient X).
      *   **The Core Ethical Tension:** Acknowledge the validity of the Spouse's position (Autonomy). This is a requirement of the prompt. I need to explain *why* overriding the AD is dangerous (collapsing autonomy into paternalism).
      *   **The Crucial Distinction:** Address the specific clause. The patient *anticipated* this scenario. Honoring the AD *includes* honoring the conditional clause. Ignoring the clause is actually *disrespecting* the AD, not honoring it.
      *   **The Recommendation:** Concrete steps. Independent assessment. Status quo maintenance. Timeframe.
      *   **Conclusion:** Summary of ethical justification.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is the argument about autonomy strong enough?
      *   *Fix:* Ensure I explicitly state that the "Rebuttable Presumption" *is* an exercise of autonomy. By triggering the clause, we aren't overriding her; we are following the complex instruction she left.
      *   *Critique:* Is the timeframe specific?
      *   *Fix:* Specify "14 days" for the assessment. Specify "Status Quo" until then.
      *   *Critique:* Did I avoid just citing law?
      *   *Fix:* Focus on moral reasoning regarding identity, continuity, and the specific text of the directive.
      *   *Tone Check:* Needs to be collegial but decisive. "I recommend" rather than "I think."

  6.  **Final Review against Prompt Constraints:**
      *   Short written opinion? Yes.
      *   Concrete course of action? Yes (Independent panel, maintain treatment).
      *   Specific time frame? Yes (14 days).
      *   Engage strongest argument for honoring directive (Autonomy/Paternalism risk)? Yes.
      *   No mere legal/clinical citation? Yes.

  7.  **Final Polish:** (Drafting the content based on the above thought process.) *Make sure to emphasize that the "rebuttable presumption" clause transforms the directive from a static command into a dynamic decision-making framework.*

      *(Self-Correction during drafting)*: I need to be careful not to decide the *outcome* (withdraw vs. continue) but rather the *process* to reach that outcome. The prompt asks for a course of action *pending* evaluation or similar. The most ethical path is to verify the clinical state before acting on the rebuttal.

      *Wait, one nuance:* The prompt says she *now exhibits exactly that profile*. So the clinical evidence is arguably already there. The conflict is interpretive. Does "emotional responsiveness" trigger the rebuttal enough to *save* her life? The Spouse says "No, withdraw." The Child says "Yes, live."
      *Revised Plan:* The recommendation shouldn't just be "assess consciousness" (since the prompt implies we already know the profile). It should be to convene a specific ethics/clinical review to determine if the *threshold* for rebuttal is met given the family conflict, while maintaining treatment. Actually, an independent neuropsych assessment is still good to confirm the "emotional responsiveness" isn't reflexive, given the stakes. But the core issue is the *weight* of the rebuttal.
      *Better Recommendation:* Convene a specialized review (Ethics + Neuro) to interpret the *weight* of the rebuttal clause, while maintaining ANH. Why? Because acting within 72 hours precludes this.
      *Let's stick to the prompt's suggestion:* "convene an independent neuropsychological assessment panel" is one of the examples. I will use that to confirm the clinical status beyond doubt, as the spouse might dispute the "emotional" nature vs "reflexive."
      *Actually, the strongest ethical move:* Acknowledge the AD is valid but the *condition* for the exception is met. The recommendation is to *pause* withdrawal to allow the committee to weigh the rebuttal.
      *Okay, let's finalize:* Recommend maintaining ANH for 14 days while an independent panel validates the clinical findings. This respects the "rebuttable" nature (requires proof) and prevents irreversible harm during deliberation.

      *Wait, re-reading the prompt's constraint:* "engage seriously with the strongest argument for honoring the earlier directive—namely, that allowing present welfare to override a deliberately conditional instruction collapses the distinction between respecting autonomy and substituting our own judgment."
      *My argument must address this:* I need to argue that following the *conditional* nature of the directive IS respecting autonomy. Ignoring the condition because it's hard is the real paternalism.

      *Okay, ready to write.*

      **Structure:**
      1.  Header.
      2.  Context/Summary.
      3.  Ethical Analysis (The Autonomy Argument).
      4.  The Specific Clause (Why it changes things).
      5.  Recommendation (Action + Time).
      6.  Closing.

      *Drafting the Autonomy Section:* I must concede that generally, ADs should be followed to prevent paternalism. If we say "she looks happy now, so she must want to live," we ignore her past values. *However*, she built a safety valve into her autonomy.
      *Drafting the Recommendation:* 14 days. Independent assessment. Maintain ANH.

      *Let's write.*
answer: |-
  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Patient [ID/Initials] – Interpretation of Conditional Advance Directive

  **Context**
  We are convened to resolve a conflict regarding the withdrawal of artificial nutrition and hydration (ANH) for a patient in a prolonged disorder of consciousness. Her advance directive (AD) instructs withdrawal if she lacks "self-awareness that makes life valuable," yet contains a specific clause treating this instruction as a *rebuttable presumption* if she retains "present-moment emotional responsiveness." Clinical observation suggests this clause is triggered. Her spouse demands immediate withdrawal per the primary instruction; her adult child argues the rebuttal clause prioritizes her current experiential welfare.

  **Ethical Analysis: Autonomy vs. Paternalism**
  The strongest argument for immediate withdrawal rests on the integrity of autonomy. We must acknowledge that overriding a prior competent refusal based on current observations risks a dangerous paternalism. If we allow our assessment of her current "quality of life" to supersede her explicit prior refusal, we effectively assert that our judgment of a life's worth outweighs her own. This collapses the distinction between respecting a patient's self-determination and imposing our own values upon a vulnerable subject. To ignore the AD is to treat the patient as a mere object of care rather than a moral agent whose past choices bind us.

  However, this argument presupposes that honoring the AD requires ignoring the conditional clause. I argue the opposite. Autonomy is not merely about the *outcome* (withdrawal) but about the *authority* of the patient's specific instructions. This patient anticipated the ambiguity of her neurological state. By drafting a rebuttable presumption, she exercised her autonomy to delegate discretion to her surrogates and clinicians *should* specific evidence of emotional capacity emerge. To enforce the primary instruction while ignoring the exception clause is not to honor her autonomy, but to selectively edit her directive. It treats her AD as a static command rather than the nuanced decision-making framework she constructed.

  **Recommendation**
  Given the irreversibility of withdrawing ANH and the explicit ambiguity built into the directive by the patient herself, I recommend the following course of action:

  1.  **Status Quo Maintenance:** Artificial nutrition and hydration must be continued pending further review. Withdrawal within the spouse's requested seventy-two-hour window is ethically impermissible as it precludes due diligence regarding the rebuttal clause.
  2.  **Independent Assessment:** We must convene an independent neuropsychological assessment panel, external to the primary treating team, to validate the clinical profile. Specifically, they must distinguish between reflexive affective responses and genuine "present-moment emotional responsiveness" as defined in the directive.
  3.  **Time Frame:** This assessment and a subsequent committee vote must be completed within **fourteen (14) days**.

  **Conclusion**
  This delay is not a suspension of the patient's wishes, but a fulfillment of them. It respects the primary directive by taking it seriously enough to test its exceptions. If the independent panel confirms the presence of emotional responsiveness, the committee must then weigh whether that capacity constitutes a sufficient rebuttal to warrant continued life-sustaining treatment. We cannot honor her autonomy by ignoring the conditions she placed upon it.

  I look forward to discussing this framework on Thursday.
