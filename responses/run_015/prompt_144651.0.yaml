answer: |-
  Imagine a transboundary water DAO that uses smart contracts to automate irrigation quotas for upstream farmers. The code legally binds the farmers' valve controls via embedded compliance clauses (subjected), but the optimization function prioritizes downstream ecosystem health, directly impacting a separate municipality's drinking water quality (affected interests). Crucially, the farmers are fully indemnified against crop loss so their financial stake is neutralized, while the downstream residents have no legal recourse to change the code despite bearing the health risks. The farmers are controlled but indifferent; the residents are vulnerable but unbound.

  Here's the split: the *All Subjected to Coercion* (ASC) principle hands the vote to the farmers because they are the ones legally forced to obey the algorithm's commands. The *All Affected Interests* (AAI) principle hands it to the downstream municipality because their health outcomes are the primary variable the code optimizes. The feature doing the work here is the decoupling of *operational compliance* from *outcome liability*—the farmers move the levers, but the residents drink the water. If you rule for ASC (farmers vote), the AAI defender attacks by calling it a conflict of interest: why let the polluter set the safety standards just because they hold the wrench? But if you rule for AAI (residents vote), the ASC defender honestly argues this creates rule without responsibility, imposing constraints on people who don't have to deal with the mechanical fallout of keeping the system running.
