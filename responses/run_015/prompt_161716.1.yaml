prompt: |-
  hi — I'm finishing the last chapter of a PhD on transitional justice and in three weeks I'm presenting it to a transitional justice seminar, and I'm way more nervous about the forty minutes of questions than the twenty minutes of talk. The room will be: two philosophers (one writes on punishment and retribution, one on political obligation), three or four practitioners who actually worked on commissions in South Africa and Argentina, two lawyers from a human rights NGO, and a scholar who works on Rwanda's gacaca courts and who I already know thinks truth commissions are an elite bargain dressed up as healing. Assume everyone is broadly pro-human-rights; the split is over whether amnesty can ever be the right answer. The practitioners will talk about victim-centred process, sequencing, the impunity gap, and how commissions relate to international courts; the NGO lawyers will reach for victims' rights to remedy and to a remedy that's enforceable.

  The chapter defends something stronger than the usual line. The usual line — the one most people in that room half accept — is that conditional amnesty, truth for amnesty, roughly the South African model, is a regrettable second best that we accept only because the outgoing regime still has coercive power and a trial wave would risk the transition. I argue it isn't second best at all: even where we could prosecute at acceptable cost, there is a reason to prefer a commission. The claim is that the distinctive wrong done when a legal order turns its own law against a segment of the population is misrepresented when it gets processed as a series of discrete criminal acts against identifiable victims, so the apt public response is one that reconstructs the record of what the system did, and a trial can't do that because its procedures are built to individualise guilt. Three moves in the chapter I'm not confident survive: (1) a distinction between amnesty as forbearance (this government promises not to prosecute) and amnesty as entrenchment (a statutory bar that no later government can lift without breach), where I claim only the second needs a separate justification; (2) what I've been calling the credibility paradox — conditional amnesty elicits truth only because perpetrators fear prosecution, but a commission that succeeds lowers the chance anyone is ever prosecuted, so the incentive has to come from somewhere else; (3) the selection worry: the people who come forward are the ones with the most to disclose and the least room to flee, while the architects stay quiet and are protected precisely because amnesty is individualised. My supervisor's main objection is that I'm too quick to treat truth as something victims themselves want — she thinks that's load bearing and probably empirically shaky, and I half agree. I've been going in cirlces on this for months.

  What I want is a Q&A prep sheet, not a defence of the view. Give me the eight or so objections I'd actually get from this specific room — not the ones I'd get from a pure philosophy seminar — ordered by how much damage they'd do, each phrased the way that person would actually say it (I want the gacaca person's version and the NGO lawyer's version separately, they'll come at it from different angles), with what I should concede up front, a ninety-second answer, and a note on where that answer is soft. Flag which objections are really framing clashes I can dissolve and which have genuine force against the argument I sketched, and tell me anywhere the view quietly commits me to something I shouldn't say out loud in front of human rights lawyers — my own worry is that on my account a genuinely well run commission could justify amnestying people nobody wants amnestied. Also: which single reply has to land for the chapter to survive, and what's the question I'm hoping nobody asks. No citations, no footnotes, no reading list — I know the literature, I need the arguments, and please don't spend words paraphrasing anyone's famous position back at me. Lead with one sentence giving me the bottom line: which objection does the most damage and what my answer has to be — then the sheet, no preamble.
