  1. Let's start with the immediate intuition, which is settled data even if the explanation is contested: when I look at a red apple, there is a specific way it *seems* to me. If phenomenal properties don't exist, are you saying that seeming is false? How do you validate my first-person report without admitting the property exists, rather than dismissing it as noise?

  2. Your standard reply is that I have a belief that I'm having an experience, but not the experience itself. But isn't that belief *itself* a mental state with content? How do you ground the truth of that belief without referencing the very feel you're eliminating?

  3. Critics often worry this slips into full-blown eliminativism about the mental. Are you eliminating mental states, or just a specific property of them? Where do you draw the line so you don't eliminate the thinker along with the thought?

  4. You'll likely lean on the Access vs. Phenomenal distinction to save the mental, which is standard terminology in the field. You keep Access. But if Access is just information availability, what work is the "Phenomenal" label doing before you eliminate it? Why did we think we needed it if Access covers the functional role?

  5. If we adopt the predictive processing framework, which is influential but not settled science: when I burn my hand, there's a prediction error signal. Can you describe this signal's role in the system without implying there's a 'hurt' feeling attached to it?

  6. You'll say it's just an informational mismatch. But 'error' implies a norm or a cost. If nothing feels wrong to the system, why is it an *error* rather than just a difference? What grounds the negativity without the feel?

  7. If phenomenal consciousness is a user-illusion, what is the evolutionary advantage of being fooled? Why not just have access consciousness without the computationally expensive fake qualia?

  8. If pain qualia don't exist, does suffering lose its intrinsic moral weight? How do you ground the badness of torture in a world where nothing literally feels bad?

  9. We have robust concepts for feels, like "sharpness" or "warmth." If the referents don't exist, what do our phenomenal concepts refer to? Are they empty names, or do they refer to physical states we misrepresent?

  10. Given experiences like anesthesia where the sense of continuity breaks, does your view suggest my normal sense of self is equally constructed? How stable is the "user illusion" really?

