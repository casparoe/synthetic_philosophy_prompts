      Math check: $\sum_{n=1}^{100} (1/2^n) * 2^n = \sum_{n=1}^{100} 1 = 100$. Correct.
      Riley's Move 2: "Bank can pay out at most a billion dollars... EV is only about thirty dollars."
      Math check: Billion $\approx 2^{30}$. So sum stops at 30. $\sum_{n=1}^{30} 1 = 30$. Correct.
      So Sam is right that a *high* cap leaves EV high. Riley is right that a *realistic* cap makes EV low. Both are mathematically consistent, just different parameters.

