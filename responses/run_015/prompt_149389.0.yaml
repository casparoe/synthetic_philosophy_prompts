  *Correction on "Acausal":* The user wrote "acausal-series." This is definitely a conceptual error in their notes. *Bhavaṅga* is the *result* of kamma. It is deeply causal. I need to highlight this as a critical point to fix.
  *Process Philosophy:* Whitehead's "enduring object" is actually a "society" with a "personal order." This maps well. But does it solve the *moral* problem? Whitehead struggles with evil/responsibility too. I should note that the analogy transfers the *problem* rather than solving it, which might actually be useful for the essay.

