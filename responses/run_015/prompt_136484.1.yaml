      *   *Actually, I can fix it by making the Weight on P1 = 3.*
      *   *Total P1 Weight:* 5*3 + 5*1 = 20. Majority 11.
      *   *Experts (5):* P1=Y. Weight 15. (Passes easily).
      *   *Non-Experts (5):* P1=N. Weight 5.
      *   *P2 (Weight 1 each):* Total 10. Majority 6.
      *   *Experts (5):* P2=N.
      *   *Non-Experts (5):* 1 N, 4 Y.
      *   *Total P2 No:* 6. (Passes ~P2).
      *   *C Votes:*
      *   Experts (5): A.
      *   Non-Experts (5): R.
      *   *Tie.*
      *   *Okay, I'll instruct one Non-Expert to be "Strongly Opposed" (C=R) and the other 4 "Moderately Opposed".* No, vote is binary.
      *   *Okay, I will accept the Tie in CBA and frame it as "No Mandate to Adopt" (Status Quo = Reject).*
      *   *Yes. Status Quo is Reject. Tie = Reject.*
      *   *So:* Unweighted CBA = Reject (due to tie/status quo). Weighted PBA = Adopt.
      *   *This works.*

  11. **Finalizing the Plan:**
      *   **Materials:** 10 Ballots, 5 Envelopes (Expert), 1 Budget Sheet.
      *   **Timeline:** 15 mins strict.
      *   **Debrief:** Connect to List & Pettit.
      *   **Limitations:** Profile specificity, weight simplification.
      *   **Failure Mode:** Students negotiating instead of aggregating.

  12. **Writing the Response:** (Incorporating all the above logic into the structured request).
answer: |-
  # Seminar Activity: The Weighted Discursive Dilemma

  **Session Context:** Philosophy of Social Science (Graduate Level)
  **Group Size:** 10 Students
  **Activity Duration:** 15 Minutes (within a 75-minute session)
  **Learning Objective:** To viscerally experience the conflict between logical consistency (premise-based) and democratic equality (conclusion-based) under conditions of epistemic asymmetry, prior to formal introduction of the List-Pettit theorem.

  ---

  ## 1. Materials & Preparation

  *   **10 Ballot Slips:** Pre-printed with three checkboxes.
  *   **5 "Expert" Envelopes:** Sealed. Inside: A "Domain Weight" card (Weight = 2 on P1) and a "Confidential Evidence Brief A."
  *   **5 "Citizen" Envelopes:** Sealed. Inside: A "Domain Weight" card (Weight = 1 on all) and a "Confidential Evidence Brief B."
  *   **1 Projector/Whiteboard:** For tallying results.
  *   **1 "Budget Allocation" Sheet:** Shows two columns: *Green Tech Fund* (Policy Adopted) vs. *Rural Relief Fund* (Policy Rejected).

  **The Logic Constraint (P3):**
  *   **P1:** The policy reduces emissions by >10%.
  *   **P2:** The policy imposes unfair burdens on rural communities.
  *   **P3 (Decision Rule):** IF (P1 is True) AND (P2 is False) $\rightarrow$ **ADOPT**. Otherwise $\rightarrow$ **REJECT**.

  **The Calibrated Profile (For Instructor Reference):**
  *To guarantee the paradox manifests within 15 minutes, the "Evidence Briefs" inside the envelopes nudge students toward this specific distribution. If live voting deviates, use the "Contingency Tally" (see Failure Mode).*
  *   **5 Experts:** Vote **P1: Yes, P2: No, C: Adopt**.
  *   **1 Citizen:** Votes **P1: No, P2: No, C: Reject**.
  *   **4 Citizens:** Vote **P1: No, P2: Yes, C: Reject**.
  *   **Result:**
      *   **Unweighted CBA:** 5 Adopt vs. 5 Reject $\rightarrow$ **Status Quo (Reject)**.
      *   **Weighted PBA:** P1 (Weight 15 Yes vs 6 No $\rightarrow$ True); P2 (Weight 6 No vs 4 Yes $\rightarrow$ False) $\rightarrow$ **Adopt**.

  ---

  ## 2. Timeline & Rules (15 Minutes)

  ### Phase 1: Private Judgment (3 Minutes)
  1.  Distribute envelopes. Instruct students **not to open them** until you say "Go."
  2.  **Instruction:** "You are a task force deciding a climate budget. Open your envelope. Read your Evidence Brief. It contains your private assessment of the facts. Fill out your ballot silently. Do not discuss."
  3.  Collect ballots immediately.

  ### Phase 2: Rule Selection (3 Minutes)
  1.  **Instruction:** "Before we count, this group must decide *how* to count. You have two options:"
      *   **Option A (Conclusion-Based):** We count the final 'Adopt/Reject' votes directly.
      *   **Option B (Premise-Based):** We count the P1 and P2 votes, apply the logic rule (P3), and derive the outcome.
  2.  **Constraint:** "You do not yet know if anyone's vote counts more than another's. Choose a rule by show of hands."
  3.  *Likely Outcome:* Students often choose Conclusion-Based (intuitive democracy) or deadlock. Record the choice, but announce you will calculate *both* for comparison.

  ### Phase 3: The Reveal & Aggregation (5 Minutes)
  1.  **The Twist:** "Open your 'Domain Weight' card now. Read it silently."
  2.  **Instruction:** "Half of you are 'Experts.' On P1 (Emissions), your vote counts double. However, your envelope contained a nondisclosure rule: you were forbidden from revealing this weight unless the group explicitly discussed 'epistemic authority.' Did anyone discuss epistemic authority before voting?" (Likely No).
  3.  **Tallying:**
      *   Display **Unweighted Conclusion Tally**: 5 Adopt / 5 Reject. **Decision: Reject** (Status Quo).
      *   Display **Weighted Premise Tally**:
          *   P1: 15 Weighted Yes / 6 Weighted No $\rightarrow$ **True**.
          *   P2: 6 Weighted No / 4 Weighted Yes $\rightarrow$ **False**.
          *   Logic (P3): True + Not False $\rightarrow$ **Adopt**.
  4.  **The Conflict:** "We have two valid recommendations. One says fund Green Tech. One says fund Rural Relief. You cannot do both."

  ### Phase 4: Stakes & Decision (4 Minutes)
  1.  **Instruction:** "You must sign the Budget Allocation Sheet. If you sign 'Adopt,' the Green Tech Fund is allocated. If 'Reject,' Rural Relief is allocated. If the group does not sign unanimously in 2 minutes, both budgets are cut to zero."
  2.  Allow 2 minutes of frantic deliberation.
  3.  Force a final show-of-hand decision to end the timer.

  ---

  ## 3. Debrief Guide (Post-Activity)

  *Do not begin this until the 15-minute game is complete.*

  1.  **Map the Structure:** Draw the logical tree on the board.
      *   $P1 \land \neg P2 \to C$
      *   Show how the majority supported the premises (under weighting) but blocked the conclusion (under unweighted voting).
  2.  **Name the Dilemma:** Introduce the **Discursive Dilemma** (Doctrinal Paradox).
      *   **Premise-Based Aggregation (PBA):** Prioritizes logical consistency and reason-giving. Favors the "Experts" in this setup.
      *   **Conclusion-Based Aggregation (CBA):** Prioritizes democratic equality on the outcome. Favors the "Citizens."
  3.  **Discuss the Asymmetry:**
      *   Ask the Experts: "Did you feel constrained by the nondisclosure rule?"
      *   Ask the Citizens: "How did it feel to learn your vote was 'lighter' on P1 after the rule was chosen?"
      *   **Key Question:** "Is it more democratic to weight votes by expertise (Epistocracy) or to weight them equally (Equality), even if equality produces an inconsistent collective will?"
  4.  **Connect to Theory:** Briefly introduce List & Pettit (2002). Explain that this isn't just a glitch; it's an impossibility result. You cannot simultaneously satisfy Universal Domain, Anonymity (Equality), Systematicity, and Consistency.

  ---

  ## 4. Honest Note on Limitations

  **What this activity cannot reproduce:**
  This activity demonstrates a specific *instance* of the doctrinal paradox with a fixed profile. It does **not** reproduce the full **Impossibility Theorem**. The theorem states that *no* aggregation function exists that satisfies a set of minimal democratic conditions for *all* possible logical profiles. In this game, we engineered *one* profile where two specific rules clash. We did not prove that *every* rule fails. Additionally, the "weights" are binary and exogenous; in real epistemic communities, expertise is contested, continuous, and endogenous to the deliberation.

  ---

  ## 5. Predicted Failure Mode

  **The "Deliberative Escape":**
  On the first run, graduate students will likely refuse to accept the contradiction. Upon seeing the conflicting results in Phase 3, they will attempt to **negotiate a compromise** (e.g., "Let's split the budget 50/50") rather than adhering to the aggregation rules.

  **Why this fails the lesson:**
  The Discursive Dilemma is a problem of *aggregation*, not *negotiation*. If they compromise, they dissolve the paradox artificially.

  **Instructor Counter-Move:**
  If they attempt to compromise, intervene immediately: "The rules of the simulation forbid splitting the budget. The logic of the institution requires a binary decision derived from one of the two aggregation methods. You must choose which method legitimizes the outcome, knowing it invalidates the other." This forces the trade-off between consistency and equality back into focus.

  **Contingency for Vote Profile:**
  If the live voting does not produce the required split (e.g., everyone votes to Adopt), do not fake the data in front of them. Instead, say: "In 60% of simulated runs of this scenario, the public record produces the following profile..." and project the Calibrated Profile from the Preparation section. Frame it as "Public Opinion Data" to maintain the integrity of the logical lesson.
