prompt: |-
  I'm preparing material for a graduate seminar on determinism and scientific explanation, and I want to isolate whether determinism genuinely entails predictability or whether the two come apart in ordinary human-scale contexts. To that end, please construct a thought experiment engineered so that determinism holds in full—there are fixed governing laws and no random or quantum interruptions—yet a rational agent who knows those laws and can measure conditions with arbitrary precision is systematically unable to predict the outcome of her own action. Set the scenario in a realistic institutional environment rather than a physics laboratory: for instance, a hospital triage coordinator or a municipal budget office where small adjustments cascade through feedback loops. Keep the narrative to a single paragraph, avoid exotic physics, demons, or perfect predictors, and build the failure of prediction specifically out of deterministic chaos—sensitive dependence with a Lyapunov horizon shorter than the agent's decision window—so that the unpredictability is structural rather than a mere lack of computing power.

  After the scenario, demonstrate that it meets the specification: state what determinism delivers here, what a predictability thesis delivers, and why they conflict in this case. Identify the precise structural feature—such as the positive Lyapunov exponent interacting with the agent's embedded measurement—doing the work, and explain what collapses if we replace the nonlinear dynamics with linear ones. Then address the Laplacean objection: how a defender might invoke an "in principle" versus "in practice" distinction to preserve the determinism-predictability link, and why that move fails given the scenario's constraints. Make clear what the case is testing and avoid stipulating verdicts that do not flow from the dynamics themselves.
