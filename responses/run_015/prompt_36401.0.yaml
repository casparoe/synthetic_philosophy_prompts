answer: |-
  You have put your finger on the exact philosophical nerve that makes the Open Science movement simultaneously necessary and incoherent. Your intuition is correct: **Preregistration is a frequentist prosthetic.** It is a procedural fix designed to save the validity of the $p$-value, and in doing so, it explicitly rejects the Likelihood Principle.

  Here is the reconstruction of the implicit epistemology of preregistration, why it clashes with Bayesianism, and what a truly Bayesian reform would look like.

  ### 1. The Implicit Epistemology: Procedural Reliabilism
  Preregistration presupposes a view of evidence known as **Error Statistics** (championed by Deborah Mayo) or **Procedural Reliabilism**.

  In this view, data does not speak for itself. Data only constitutes evidence *relative to a procedure* that has known long-run error properties. A $p < .05$ is not a measure of the probability of the hypothesis given the data; it is a measure of the probability of the data given the null, *assuming a specific sampling distribution*.

  If you change your analysis plan after seeing the data (p-hacking) or stop collecting when significance is reached (optional stopping), you change the sampling distribution. You have altered the "reference class" of possible outcomes. Therefore, the calculated $p$-value is mathematically false. It no longer reflects the true Type I error rate.

  **The Preregistration Claim:** The epistemic value of the finding depends on the **trustworthiness of the process**, not just the likelihood of the data.
  *   **Registered:** The procedure is fixed. The error rates are honest. The $p$-value is valid. The data counts as *confirmatory*.
  *   **Unregistered:** The procedure is unknown (potentially infinite degrees of freedom). The error rates are incalculable. The $p$-value is garbage. The data counts as *exploratory*.

  **What this rules out:** This view explicitly rules out the **Likelihood Principle**, which states that all evidence contained in the data is expressed in the likelihood function, and that the stopping rule or experimental design is irrelevant to the evidential import once the data is observed. Preregistration says the Likelihood Principle is dangerous because it allows researchers to game the system. It prioritizes *behavioral control* over *logical inference*.

  ### 2. Is it Evidence or Trust?
  You asked if this is an epistemology of the data or the researcher. It is both, but hierarchically.

  1.  **First Order (Frequentist):** The data cannot provide "confirmatory evidence" without a fixed sampling plan. This is a mathematical claim about error rates.
  2.  **Second Order (Social):** Because we cannot observe the researcher's mind to know if they p-hacked, we require a timestamped contract (preregistration) to *guarantee* the first-order condition.

  So, preregistration is a **trust mechanism** that enables **frequentist validity**. Without the trust (the badge), the frequentist math collapses. This is why journals treat unregistered findings as "exploratory." They aren't saying the finding is false; they are saying the *statistical guarantee* is void. It is a legalistic distinction: "This contract was not signed, so we cannot enforce the warranty."

  ### 3. Can a Bayesian Sign On?
  A coherent, theoretical Bayesian **cannot** sign on to the claim that unregistered data has less *evidential weight* than registered data.

  *   **The Conflict:** For a Bayesian, $Posterior \propto Likelihood \times Prior$. The Likelihood ($P(Data|H)$) is identical regardless of when the hypothesis was formed. If the data fits your model, it fits your model. The stopping rule is irrelevant (assuming the stopping rule doesn't depend on the parameter value in a way that biases the likelihood, which is a technical caveat, but generally, Bayesians embrace optional stopping).
  *   **The Compromise:** A pragmatic Bayesian *can* support preregistration, but for different reasons:
      1.  **Prior Specification:** Preregistration forces you to state your expectations. A Bayesian can use this to check if the researcher is using reasonable priors or if they are effectively using a "skeptical prior" for the null and an "optimistic prior" for the alternative post-hoc.
      2.  **Model Space:** If a researcher tests 20 models and reports the best one, a Bayesian must penalize that hypothesis because the *probability of finding a good fit somewhere in the model space* is high. Preregistration fixes the model space, preventing the need for complex hierarchical corrections for "researcher degrees of freedom."
      3.  **Transparency:** It reveals the "Garden of Forking Paths" (Gelman's term). Even for Bayesians, if you wander the garden until you find a flower, the flower is less surprising than if you planted it there.

  **The Verdict:** A Bayesian can support preregistration as a tool for **transparency and prior calibration**, but they must reject the notion that unregistered data is epistemically inferior *in terms of likelihood*. They would argue that unregistered data requires a more skeptical *prior* update, not that the data itself is weaker.

  ### 4. Where the Line Breaks
  The confirmatory/exploratory distinction is currently a binary switch applied to a continuous problem. Here is where it fractures:

  *   **The "Twenty Hypotheses" Problem:** If I preregister 20 hypotheses and one hits at $p < .05$, frequentist logic demands correction (Bonferroni). If I preregister *one* hypothesis that was actually one of twenty I considered privately, I have lied. Preregistration cannot solve the "private forking paths." It only solves the public ones.
  *   **The "Field Prior" Problem:** If the entire field expects Effect X (a strong theoretical prior), and I run a study without preregistration and find Effect X, the evidential weight should be high. Preregistration treats this as exploratory. This is inefficient. It discounts strong theoretical priors in favor of procedural rigidity.
  *   **Pilot Data:** If I run $N=20$, see a trend, then preregister $N=100$ including the first 20, is it registered? Usually, no. But the likelihood of the first 20 is the same. This shows the system is about *policing behavior*, not measuring evidence.

  ### 5. What If the Field Went Fully Bayesian?
  If psychology adopted a coherent Bayesian framework, the preregistration regime would look radically different.

  1.  **Death of the Confirmatory/Exploratory Binary:** Data is data. It updates priors. A finding from an unregistered study would update the field's posterior belief. It wouldn't be labeled "exploratory" (meaning "do not believe"); it would just be recognized as coming from a study where the *researcher's prior* might be biased by the data.
  2.  **Optional Stopping is Allowed:** You could collect data until the Bayes Factor reaches 10. You wouldn't need to specify $N$ in advance. This removes the need for the "sample size justification" part of preregistration.
  3.  **The Battleground Shifts to Priors:** Instead of fighting over analysis plans, the fight would be over **prior distributions**. Preregistration would become "Prior Registration." You would have to declare: "Before seeing data, I believed the effect size was distributed normally around $d=0.5$."
      *   If you don't preregister the prior, reviewers can argue you chose a prior that favors your conclusion post-hoc.
  4.  **No More "P-Hacking":** You can't hack a posterior in the same way. You can try many models, but a Bayesian model averaging approach would naturally downweight the models that were clearly data-driven if the priors were set up hierarchically.
  5.  **Evidence is Cumulative:** Currently, psychology treats each paper as a standalone "truth claim" (significant or not). A Bayesian field would treat papers as updates to a meta-analytic posterior. A single unregistered study wouldn't need to "prove" anything; it would just nudge the probability.

  ### Summary
  The preregistration movement is a **frequentist immune response** to a crisis caused by frequentist tools. It tries to fix the problem of "researcher intentions affecting error rates" by legally binding the researcher's intentions.

  *   **Implicit View:** Evidence is a product of Data + Procedure. (Rejects Likelihood Principle).
  *   **Epistemology:** Reliabilism. We trust the result because we trust the process.
  *   **Bayesian Compatibility:** Low. Bayesians care about the coherence of belief, not the long-run error rate of the procedure. They would view preregistration as useful for disclosing priors, but nonsensical as a validator of data quality.
  *   **The Fix:** A fully Bayesian shift would render the "confirmatory vs. exploratory" distinction obsolete, replacing it with "prior-informed vs. prior-agnostic" updating. But until then, preregistration remains the only way to make frequentist $p$-values mean what they claim to mean in a human context.

  You are right to be buged. The system asks you to believe that the *physics of the data* changes based on the *timestamp of a PDF*. That is not science; that is contract law.
