  Must lack: Controversial physics. Do not derive the resonance equation; stipulate the engineering consensus. If they debate the physics, you lose the semantics. It must lack any suggestion that the math is merely a model.
  Placement: Minute 10. Introduce it immediately after the opening frame. It serves as the constant reference point throughout the ninety minutes. Every philosophical move must be tested against this sentence. If a theory cannot account for the girder sentence, it fails. This prevents the discussion from drifting into pure metaphysics. It grounds the Deep Uniformity requirement later: does the paraphrase explain the bridge?

  4. Shallow and deep uniformity
