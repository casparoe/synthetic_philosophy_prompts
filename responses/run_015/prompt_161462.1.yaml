  25–40: The Epistemic Horn. Naturalism and causal contact. Dependency: Must accept naturalism to feel the push against Platonism. The epistemic horn relies on their engineering intuition about causal explanation.
  40–55: The Collision. Benacerraf's point: you cannot have both horns without cost. Dependency: Requires both previous horns to be felt equally.
  55–70: Survey Responses. Paraphrase strategies vs. accepting abstract objects. Dependency: Requires understanding the cost identified in the Collision. The Check must happen after they propose a fix, otherwise it is abstract.
  70–85: The Check. Embedding test on paraphrases. Dependency: Requires a candidate paraphrase from the previous segment.
