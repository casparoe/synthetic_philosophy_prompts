  5. Misconception map
  1. "Is this just asking if numbers exist?" (Minute 15). Say: "Existence is the conclusion, not the question; the question is what existence would cost."
  2. "Math is just notation." (Minute 20). Say: "Notation doesn't prevent bridge collapse; irrational ratios do."
  3. "Math is logic." (Minute 25). Say: "Logic handles form; this problem handles reference."
  4. "Drop causal theory of knowledge." (Minute 40). Say: "Naturalism isn't a theory you drop; it's the requirement that knowledge fits into the scientific world."
