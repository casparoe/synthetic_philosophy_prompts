      *   **Task:** Write the *desiderata* (requirements) for a theory of Bongard problem solving (not just a solver, but an account of requirements).
      *   **Key Constraints/Context:**
          *   Bongard problems (BP): 2 boxes, 6 figures each. Concept true for Box 1, false for Box 2.
          *   Underdetermination: Logic alone doesn't recover the intended concept (multiple concepts fit).
          *   "Natural/Robust" concept: Must generalize to a 13th figure, human-statable.
          *   Simplicity Tension: Usually simplest fits, but some puzzles trick naive simplicity heuristics.
          *   Distractors: Surface features (size, orientation, etc.) must be ignored.
      *   **Deliverables:**
          1.  Brainstorm of candidate requirements.
          2.  Final list of desiderata (with motivation, marking Non-Negotiable vs. Preference).
          3.  Analysis of joint unsatisfiability (tensions/conflicts).
          4.  Identification of the single requirement that knocks out the most candidate theories.
          5.  Short scorecard (optional but okay).
      *   **Tone:** Academic, mentoring, rigorous, insightful.

  2.  **Deconstruct the Nature of Bongard Problems (BP):**
      *   *What makes them hard?* It's not classification accuracy (a neural net can overfit). It's *concept induction* under extreme data scarcity (12 examples) with high noise (distractors) and radical underdetermination (infinite rules fit).
      *   *What is the goal?* To model the *human cognitive process* of finding the "right" abstraction, not just outputting the answer.
      *   *Key Philosophical Issue:* The "Intended Concept" is not in the data. It's in the mind of the puzzle setter and the shared cognitive bias of the solver.

  3.  **Brainstorming Candidate Requirements:**
      *   Must handle 12 examples (few-shot).
      *   Must ignore irrelevant features (invariance).
      *   Must generate a description (symbolic/linguistic).
      *   Must generalize to new instances (productivity).
      *   Must prioritize "natural" concepts over "gerrymandered" ones.
      *   Must handle visual perception (raw pixels to objects).
      *   Must handle analogy (mapping Box 1 to Box 2).
      *   Must be computationally tractable (humans aren't exponential).
      *   Must explain *why* a wrong simple rule is rejected (the anti-simplicity cases).
      *   Must account for the "Aha!" moment (restructuring).
      *   Must rely on a prior bias (inductive bias).

  4.  **Developing the Desiderata (Filtering & Categorizing):**

      *   *Requirement 1: Perception-Symbol Interface.* You can't solve BPs if you can't see objects. Pure pixel matchers fail.
      *   *Requirement 2: Invariance/Abstraction.* Must ignore position, size, rotation unless *that* is the concept.
      *   *Requirement 3: Underdetermination Resolution.* How to pick one rule from infinite fits? (The "Naturalness" criterion).
      *   *Requirement 4: Contrastive Learning.* It's not just "what is Box 1?", it's "what is Box 1 *relative* to Box 2?".
      *   *Requirement 5: Generativity/Expressivity.* The solution must be statable (language-like).
      *   *Requirement 6: Robustness to Simplicity Traps.* Cannot just be MDL (Minimum Description Length).

      *   *Classification:*
          *   Non-Negotiable: Perception, Contrast, Underdetermination Resolution, Generativity.
          *   Preference: Speed, specific neural architecture, exact linguistic form.

  5.  **Analyzing Tensions (The "Deep Conflict"):**
      *   *User's suspicion:* Simplicity vs. Anti-Simplicity puzzles.
      *   *My analysis:* It's deeper. It's about *Grounding*. The intended concept is external to the examples. If the theory relies *only* on the examples (internal consistency), it fails. It needs an external prior (human cognition bias).
      *   *The Conflict:* "Data Sufficiency" vs. "Prior Dependence." If you demand the data determines the answer, you fail. If you demand the prior determines the answer, you risk ignoring the data. The tension is between *Empirical Fit* and *Cognitive Plausibility of the Prior*.
      *   *Actually, the biggest tension:* **Open-Vocabulary vs. Fixed-Vocabulary.** To solve *all* BPs, you need potentially infinite concepts. But to search efficiently, you need a finite space. Humans solve this with compositionality. Machines struggle here.

  6.  **Identifying the "Killer" Requirement:**
      *   *Candidate 1: Few-shot generalization.* Kills standard deep learning.
      *   *Candidate 2: Symbolic output.* Kills pure connectionism.
      *   *Candidate 3: The "Naturalness" Criterion (Underdetermination).* This is the big one. It kills MDL, it kills pure logic, it kills standard Bayesian inference without a very specific prior. It demands a theory of *meaning*, not just statistics.
      *   *Decision:* The requirement to **resolve radical underdetermination via a non-statistical notion of "naturalness"** is the killer. It forces the theory to account for *why* "triangle" is better than "shape with 3 vertices and area > 50px" even if both fit perfectly.

  7.  **Drafting the Content (Iterative refinement):**

