      *   *The Desiderata:* Group them logically.
          1.  Perceptual Parsing (Non-negotiable).
          2.  Contrastive Abstraction (Non-negotiable).
          3.  Radical Underdetermination Resolution (Non-negotiable).
          4.  Linguistic Generativity (Non-negotiable).
          5.  Efficiency/Tractability (Preference).
          6.  Neural Implementation (Preference).
      *   *The Tension:* Focus on the "External Grounding" problem. The data doesn't contain the answer. The answer comes from shared cognitive bias. This conflicts with "Data-Driven" theories.
      *   *The Killer:* The "Naturalness" constraint. It wipes out MDL and standard Few-Shot classifiers.
      *   *Scorecard:* Briefly assess MDL, Deep Learning, Symbolic Search.

  8.  **Refining the Tone:**
      *   Ensure it sounds like an advisor talking to a student. "Here's the trap," "Watch out for this."
      *   Use specific BP terminology (Box 1 vs Box 2, distractors, 13th figure).
      *   Make sure the distinction between a *solver* (code that outputs the answer) and a *theory* (account of requirements) is clear. The prompt asks for a theory of *what it takes*.

  9.  **Self-Correction/Review during drafting:**
