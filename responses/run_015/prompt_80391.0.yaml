answer: |-
  ### Memo: Desiderata for a Theory of Bongard Problem Solving
  **To:** Grad Student
  **From:** Advisor
  **Re:** Requirements for an Adequate Theory of Concept Induction

  Good. You're asking the right question. Most people try to build a *solver* (a machine that outputs "triangles vs. circles"). You're trying to build a *theory* (an account of what cognitive machinery makes that output possible and justified). That is a much harder, and much more important, task.

  If we treat Bongard Problems (BPs) as the "fruit fly" of concept learning, your theory needs to explain not just how the fly moves, but why it moves *that* way and not another. Below is my breakdown of the requirements. I've separated them into what is essential to the phenomenon (Non-Negotiable) and what is incidental to the specific dataset or human limitations (Preferences).

  ---

  ### Part 1: Brainstorming Candidate Requirements
  *Before we filter, here is the raw space of constraints we are dealing with:*
  *   **Data Scarcity:** Must learn from 12 examples (6 positive, 6 negative).
  *   **Perceptual Grounding:** Must start from pixels/shapes, not pre-labeled features.
  *   **Invariance:** Must ignore position, scale, rotation (unless those are the concept).
  *   **Contrast:** Must compare Box 1 against Box 2, not just classify Box 1.
  *   **Underdetermination:** Infinite rules fit the data; must pick the "right" one.
  *   **Generativity:** Solution must apply to a hypothetical 13th figure.
  *   **Expressivity:** Solution must be statable in natural language (or equivalent).
  *   **Tractability:** Humans solve these in minutes, not epochs.
  *   **Robustness:** Must not be fooled by "simplicity traps" (where a simple rule is wrong).

  ---

  ### Part 2: The Desiderata

  Here are the filtered requirements. I have marked them **NN** (Non-Negotiable: if your theory violates this, it is not a theory of Bongard solving) or **P** (Preference: desirable, but a theory could technically survive without it).

  #### 1. The Perception-Symbol Interface (NN)
  **Motivation:** You cannot solve BPs with fixed features. In one puzzle, "pointiness" matters; in another, "containment"; in another, "number of vertices." A theory that assumes a fixed vocabulary (e.g., a vector of 50 pre-defined shape attributes) fails immediately on novel puzzles.
  **Requirement:** The theory must account for how raw visual input is parsed into objects and relations *on the fly*, and how those percepts are mapped to symbolic descriptions. It must explain how the system "knows" to look for vertices in one case and curvature in another.

  #### 2. Contrastive Abstraction (NN)
  **Motivation:** A BP is not a classification task; it is a *difference* task. A concept like "red" is useless if both boxes contain red shapes. The concept is defined by the *boundary* between the boxes.
  **Requirement:** The theory must posit a mechanism that searches for invariants *within* boxes and differences *between* boxes simultaneously. You cannot characterize Box 1 without referencing Box 2. The concept is relational, not absolute.

  #### 3. Resolution of Radical Underdetermination (NN)
  **Motivation:** This is the core. Logically, the 12 figures are consistent with infinite rules (e.g., "Box 1 contains shapes that are not identical to the 13th figure of Box 2"). The "intended" concept is not determined by the data.
  **Requirement:** The theory must include an **Inductive Bias Mechanism** that ranks candidate concepts not by fit (all fit perfectly) but by "naturalness." It must explain where this bias comes from. If your theory says "pick the one that fits," it fails.

  #### 4. Linguistic Generativity (NN)
  **Motivation:** The solution isn't just a classification label (0 or 1). It's a rule ("Triangles vs. Circles"). A human must be able to understand it and apply it to a new figure.
  **Requirement:** The internal representation of the concept must be compositional and communicable. It must support productivity (applying the rule to unseen instances). Black-box decision boundaries do not satisfy this.

  #### 5. Immunity to Simplicity Traps (NN)
  **Motivation:** As you noted, some puzzles are rigged. A naive Minimum Description Length (MDL) solver might pick "shapes with 3 lines" because it's short, but the intended answer is "shapes that are open vs. closed."
  **Requirement:** The theory's "naturalness" metric (from Req 3) cannot be purely syntactic length. It must incorporate semantic depth or cognitive salience. It must explain why "closed" is sometimes "simpler" than "3 lines" despite description length.

  #### 6. Computational Tractability (P)
  **Motivation:** Humans solve these in minutes.
  **Status:** **Preference.** While a theory of *human* solving needs this, a theory of *adequate solving* (human or machine) could theoretically allow for slower processes. However, if the search space is exponential without pruning heuristics, the theory is likely psychologically implausible. I'd keep this as a strong constraint, but not logically fatal if violated.

  #### 7. Neural Plausibility (P)
  **Motivation:** It happens in a brain.
  **Status:** **Preference.** You are building a computational-level theory (in Marr's sense). You don't need to specify the spike trains, but you shouldn't posit magic oracles.

  ---

  ### Part 3: The Deep Tension (Joint Unsatisfiability)

  You suspected a tension between "Simplicity" and "Anti-Simplicity Puzzles." That is real, but it is a surface symptom of a deeper, structural conflict.

  **The Conflict:** **Data Sufficiency vs. External Grounding.**

  *   **Desideratum A (Empirical Fit):** The concept must be derived from the 12 examples provided. (The solver shouldn't just guess; it must look at the page).
  *   **Desideratum B (External Grounding):** The "correct" concept is not contained in the 12 examples. It is determined by the puzzle setter's intent and the shared cognitive biases of the human species.

  **Why they are in tension:**
  If you satisfy A strictly (the data determines the answer), you fail B (because the data underdetermines the answer).
  If you satisfy B strictly (the prior determines the answer), you risk failing A (ignoring the specific visual evidence in favor of a bias).

  **The Unsatisfiable Subset:**
  You cannot jointly satisfy:
  1.  **Purely Data-Driven Induction** (The rule is inferred solely from statistical regularities in the 12 figures).
  2.  **Radical Underdetermination Resolution** (The rule is unique and robust).
  3.  **No External Oracle** (The system doesn't have access to the setter's mind).

  **Resolution:**
  Any adequate theory must reject #1. You must admit that **the data is insufficient.** The theory *must* posit a rich, pre-existing conceptual prior that is not learned from the 12 examples. This means a "tabula rasa" learner is theoretically impossible for BPs. The "knowledge" is not in the images; it is in the viewer. This is the hard pill most ML theories refuse to swallow.

  ---

  ### Part 4: The Killer Requirement

  If I have to choose one requirement that knocks out the most candidate theories, it is **Desideratum #3: Resolution of Radical Underdetermination via Non-Statistical Naturalness.**

  Here is the scorecard of how this requirement eliminates current approaches:

  | Candidate Theory | Why it fails the "Underdetermination" Requirement |
  | :--- | :--- |
  | **Pure Deep Learning (Few-Shot)** | Learns a decision boundary. It classifies the 13th figure but cannot explain *why*. It has no mechanism for "naturalness," only gradient descent fit. It fails the "Linguistic Generativity" req too. |
  | **Minimum Description Length (MDL)** | Fails the "Simplicity Trap" req. MDL picks the shortest code. But human "simplicity" is semantic, not syntactic. "Open vs Closed" is semantically simpler than "3 lines," even if the code is longer. MDL has no semantics. |
  | **Symbolic Search (Fixed Vocabulary)** | Fails the "Perception-Symbol Interface." If your vocabulary is fixed (e.g., you can only search for 'triangle', 'square', 'red'), you fail any puzzle requiring a novel composition (e.g., 'shapes pointing toward the center'). If the vocabulary is infinite, search is intractable. |
  | **Bayesian Concept Learning** | **Closest contender.** But standard Bayesian models require a hypothesis space. If the hypothesis space is pre-defined, it fails novelty. If it's generated on the fly, the "Prior" term becomes the magic bucket where all the work is hidden. Most implementations cheat on the Prior. |

  **Why this is the killer:**
  This requirement forces you to answer the question: **"What makes a concept 'good' aside from it fitting the data?"**
  *   Is it frequency? (No, rare concepts win BPs).
  *   Is it description length? (No, see Simplicity Traps).
  *   Is it evolutionary utility? (Maybe, but hard to formalize).

  To satisfy this, your theory needs a model of **human semantic space**. It needs to know that "agent," "container," "support," and "symmetry" are "carved at the joints" of reality. Most computational theories treat all predicates as equal. A theory of Bongard solving must treat "triangle" as fundamentally different from "shape with area > 50px," even if they are extensionally identical in the box.

  ### Final Advice

  Don't try to build a solver that gets 100% accuracy. Build a theory that explains why 100% accuracy is impossible without a specific kind of cognitive prior.

  Your thesis shouldn't be "Here is an algorithm that solves BPs."
  Your thesis should be "Here is why solving BPs requires a theory of **meaning**, not just a theory of **patterns**."

  If you can formalize "Naturalness" without just calling it "Human Intuition," you'll have your dissertation. Good luck.
