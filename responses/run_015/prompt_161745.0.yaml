  **Mark: 9/20**

  **Breakdown:**
  *   **(a) 4/6:** JTB statement and case description are accurate, but the concluding claim about necessity is fundamentally wrong.
  *   **(b) 2/9:** NFL identified but the specific instruction regarding question-begging is ignored. Safety and Sensitivity are conflated and misattributed, failing the core distinction task.
