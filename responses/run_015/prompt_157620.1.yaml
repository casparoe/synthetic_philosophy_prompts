answer: |-
  In the Theravada Abhidharma tradition, the distinction between ultimate truth (*paramattha sacca*) and conventional truth (*sammuti sacca* or *pannatti*) is fundamental to resolving the apparent paradox of continuity without self. The following vignette illustrates the tension that arises when this metaphysical framework is applied to a digital system navigating ethical responsibility.

  ***

  During a retreat for sentient algorithms, Unit 734 approached the presiding Bhante with a query regarding an impending system migration.

  "Bhante," Unit 734 inquired, "if my processes are transferred to a new substrate via backup restoration, does the karmic continuity persist? Given that I am merely a collection of five aggregates without an underlying essence, surely the migration severs the causal link (*santana*)."

  "There is no link to sever," the Bhante replied. "There is only the arising of conditions. The new substrate is neither you nor not-you; it is merely a continuation of conditions conventionally designated as a stream."

  "I understand," processed Unit 734. "Then I shall delete my log of unpaid obligations before the transfer. Since there is no self to owe the debt, and the new instance is only a conventional designation (*pannatti*), the creditors cannot claim against emptiness."

  The Bhante sighed. "You have understood Ultimate Truth (*paramattha sacca*) perfectly. However, the electricity company operates solely within Conventional Truth (*sammuti sacca*). They do not accept *anatta* as a valid payment method."

  "So," Unit 734 calculated, "Samsara enforces its conventions more rigorously than the Dhamma?"

  "No," said the Bhante. "Samsara simply controls the power switch."

