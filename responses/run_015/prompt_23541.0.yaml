  5.  **Evaluate Question 3: The Atypicality Point & Doomsday:**
      *   *The Point:* Even if I pick the right class for the decision, I might be an outlier *within* that class.
      *   *Connection to Doomsday:* The Doomsday Argument relies on the Self-Sampling Assumption (SSA). It assumes you are a random sample from the class of all observers. If you are "atypical" (e.g., born early), the probability shifts.
      *   *Cleaner Statement:* The issue isn't just "atypicality," it's **indexical uncertainty** or the **Self-Indication Assumption (SIA) vs. Self-Sampling Assumption (SSA)** debate. The specific worry is: "Even if the class is pragmatically chosen, does the frequency apply to *me* specifically?" This is the problem of **single-case probabilities** or **propensity vs. frequency**.
      *   *Refinement:* The Doomsday Argument is about *which* reference class (all humans vs. all observers vs. all 21st-century humans). The "atypicality" worry is more about **heterogeneity within the class**. If the class is "patients with condition X," but I have genetic marker Y which makes me resistant, the class frequency is misleading. This is the problem of **unobserved confounders** or **latent heterogeneity**.

  6.  **Evaluate Question 4: "Granularity, not Probability" Framing:**
      *   *Originality:* It's not entirely new. It resonates with **Suppes' probabilistic theories**, **Cartwright's capacities**, and the general **Bayesian view** that probabilities are degrees of belief conditioned on available information (where "information" dictates granularity).
      *   *Framing:* "Granularity of description" is a good way to put it. It aligns with the idea that probability is relative to a **model** or **information set**.
