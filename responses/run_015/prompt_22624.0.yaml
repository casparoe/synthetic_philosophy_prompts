answer: |-
  You have hit on a crucial distinction, and for the purposes of your novel, getting this right will add significant depth to the intellectual conflict.

  The short answer is: **Your current understanding is incorrect, and the paradox rests precisely on the fact that the expected value is *undefined* (indeterminate), not negative infinity.**

  If the expected value were negative infinity ($-\infty$), standard decision theory would indeed dictate that it is plainly irrational to accept the gamble. There would be no paradox, only a clear mathematical warning. The "Pasadena Paradox" (introduced by philosophers Harris Nover and Alan Hájek in 2004) is fascinating specifically because standard math *cannot* tell the character what to do.

  Here is a breakdown of the distinction and how you can use it in your narrative.

  ### 1. The Mathematical Distinction: Infinite vs. Undefined

  To understand the gamble, you have to look at how the expected value is calculated. Expected value is the sum of all possible outcomes multiplied by their probabilities.

  *   **The St. Petersburg Paradox:** This is the famous cousin of the Pasadena gamble. In that case, the expected value sums to **positive infinity** ($+\infty$). Math says you should pay any amount of money to play, but intuition says you shouldn't. The value is *defined*, but it is infinite.
  *   **The Pasadena Gamble:** In this case, the payoffs alternate between positive and negative (win a little, lose a little, win more, lose more), and the probabilities decrease.
      *   When you sum these up, the series is **conditionally convergent**.
      *   According to the **Riemann Rearrangement Theorem**, if a series is conditionally convergent, you can rearrange the order of the terms to make the sum equal *any number you want* (positive infinity, negative infinity, zero, or 42).
      *   Because a physical gamble doesn't have an "order" (the outcomes just exist as possibilities), the fact that the math changes based on how you count them means the Expected Value is **undefined**.

  **Why this matters for your character:**
  If the EV were negative infinity, your character could say, "The math says I will lose everything."
  Because the EV is undefined, your character must say, "The math breaks down. The universe is offering me a deal that logic cannot price."

  ### 2. The Philosophical Implication: Rationality vs. Arationality

  You wrote that you thought it was "plainly irrational to accept it." This is the crux of the dramatic tension.

  *   **If EV = $-\infty$:** Refusing is rational. Accepting is irrational.
  *   **If EV = Undefined:** Expected Utility Theory (the standard model for rational decision-making) goes silent. It cannot classify the choice as rational or irrational. It simply has no advice to give.

  This creates a vacuum that other factors must fill: intuition, risk aversion, moral philosophy, or desperation.

  **The "Altadena" Twist:**
  To make the paradox even sharper, philosophers often pair the Pasadena gamble with the **Altadena gamble**. The Altadena gamble is identical to the Pasadena gamble, except every payoff is increased by exactly $1.
  *   Intuitively, the Altadena gamble is *strictly better* than the Pasadena gamble (you win more in every possible scenario).
  *   However, if Pasadena has *no* expected value, adding 1 to it *still* results in *no* expected value.
  *   **The Paradox:** How can one option be clearly better than another if neither has a value?

  ### 3. Suggestions for Your Novel

  This distinction offers rich ground for character development and dialogue. Here are a few ways to leverage the correct definition:

  **A. The Conflict of Expertise**
  You can have two advisors arguing.
  *   **Advisor A (The Pragmatist):** "Look, the losses get huge. It feels like a trap. It's effectively negative infinity. Walk away."
  *   **Advisor B (The Theorist):** "No, you don't understand. It's not negative. It's *nothing*. The equation doesn't resolve. If you walk away, you aren't being rational; you're being intuitive. There is no rational choice here."

  **B. The Character's Motivation**
  Since logic cannot solve the problem, the character's decision must reveal something about their personality.
  *   Do they trust their gut over the math?
  *   Are they reckless enough to gamble on an undefined outcome?
  *   Are they terrified of the "unknown" more than the "known bad"?

  **C. The Metaphor**
  The Pasadena gamble is a perfect metaphor for life decisions where cost-benefit analysis fails (e.g., having a child, starting a revolution, falling in love).
  *   *Dialogue idea:* "Some choices don't have an expected value, Doctor. You can't sum up the odds. You just have to choose."

  ### Summary for your notes:
  *   **Is the EV negative infinity?** No.
  *   **Is the EV positive infinity?** No.
  *   **Is the EV undefined?** **Yes.**
  *   **Is it plainly irrational?** Standard theory cannot say. That is the paradox.

  By correcting this detail, you move your novel from a story about a character avoiding a bad bet to a story about a character navigating a situation where **reason itself runs out of road.** That is a much more compelling conflict.
