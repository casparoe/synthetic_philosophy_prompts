  ### Highest Institutional Hazard: The Antiquarian Mode

  This mode manifests as a reverent preservation of past rulings that paralyzes present judgment by treating precedent as sacred law rather than provisional guidance. Such rigidity is uniquely catastrophic for this board because it directly negates the mandate to overturn prior ethical frameworks when new genetic evidence demands a departure from established norms.

  ### Moderate Institutional Hazard: The Monumental Mode

  This mode produces a heroic simplification of complex scientific legacies, elevating past breakthroughs into myths while obscuring the ethical costs or failures accompanying them. This distortion threatens the board by encouraging fidelity to an idealized version of long-term data that ignores nuanced harms, thereby compromising the ethical precision required for heritable interventions.

  ### Lowest Institutional Hazard: The Critical Mode

  This mode enacts a severing of continuity that dissolves necessary institutional memory by judging past decisions solely through the lens of present grievances. While this instability undermines the fidelity to long-term data, it remains the least hazardous because a capacity for radical critique is inherently closer to the scientific necessity of overturning outdated frameworks than either reverence or mythmaking.
