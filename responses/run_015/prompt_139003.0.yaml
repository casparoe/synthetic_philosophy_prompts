prompt: |-
  I want the specification before I look at the theories. The dispute I have in mind is the one about whether what someone knows can depend on what is practically at stake: the family of views on which the standards for a knowledge attribution shift with the attributor's context; the family on which practical stakes for the subject herself enter the knowledge relation; the variant on which it is the attributor's stakes that matter; the variant on which the truth of an attribution is settled only relative to a later assessor's perspective; and the variant on which knowledge is a three-place relation between a subject, a proposition and a contrast proposition. Before I score them against each other I want to know what I am entitled to ask of any of them. So: write the desiderata.

  Fix the purpose first, because adequacy is relative to it, and I want the theory to earn its keep twice over. It must state the condition under which a subject may treat a proposition as a reason for acting, in the way a knowledge norm on practical reasoning says she may; and it must state what a speaker says and can be held to when she attributes, withholds, denies or retracts knowledge across contexts. Tell me whether those are two jobs for one theory or two theories in a shared vocabulary. If you think the requirements divide into a semantic list and an epistemic list, say where the division falls, whether the same cases pull in both directions, and whether the division is itself a finding rather than a convenience.

  Here is the raw material your list has to be answerable to. These are the phenomena, not my proposed requirements; I want you to convert them into requirements, say what each is really asking for, and drop or merge any that turn out not to be independent.

  1. The baseline stakes pairs: same evidence, same truth, same subject, no cognitive difference, but a trivial decision in one version of the case and a serious one in the other, with speakers inclined to attribute knowledge in the first and withhold it in the second.
  2. Skeptical contexts: an error hypothesis made salient, and whether whatever happens there is the same mechanism as the stakes effect or a different one that merely looks like it.
  3. Statistical and lottery-type evidence: very strong support of the wrong modal sort, where knowledge seems to fail even though nothing of consequence hangs on the matter.
  4. Hidden stakes: the subject does not know how much hangs on the question, or is wrong about it — a routine report that will in fact be acted on catastrophically, a passenger unaware that the instrument is faulty. Say whether the relevant stakes are the objective ones, the believed ones, or the ones it would be reasonable to believe, and say what happens to the action-guiding role of knowledge if they are the objective ones.
  5. Asymmetric error costs: acting as if p when p is false is catastrophic while failing to act on a true p costs almost nothing, and the mirror image of that. Does the standard respond to both directions of error, and must a theory track them separately?
  6. The floor: when literally nothing at all hinges on p, does every true belief become knowledge, or is there an evidential minimum the standard cannot fall below however idle the context?
  7. Deferred and third-party stakes: a long-dead scientist, a non-human animal, a committee whose members face different losses, a stored output consulted later by someone with everything riding on it. Whose practical situation sets the standard when the subject has none of her own, or when the interested parties diverge?
  8. Diachronic cases and knowledge retained from memory: acquired in an idle context, needed later when much is at stake, and the question of what the agent may then treat as a reason.
  9. Leakage: heavy stakes attached to some other proposition, or to some other decision the subject faces. Does a large bet on q raise the bar for knowing that p?
  10. Moral encroachment: cases where acting on a well-supported true belief would be morally objectionable, as with a statistical generalisation about a person's group. One phenomenon with prudential stakes, or two?
  11. Second-order cases: attributing ignorance, or knowledge of ignorance, in a high-stakes context — whether the theory's own deliverances are hostage to the mechanism it posits.
  12. Embedding: "knows" inside the antecedents of conditionals, in questions about whether someone knows whether, in reports of other people's attitudes, and under negation. Whether the operative context is introduced by the embedding environment, and what follows for the theory if it is.

  Alongside the cases I want the distinctions a theory is not allowed to collapse, with the consideration behind each: knowing versus being reasonable to treat p as a reason, on pain of the theory having merely redescribed a decision-theoretic notion in epistemic vocabulary; knowing versus being in a position to assert; the standard's moving versus the subject's epistemic position's moving; whether someone knows versus how well positioned she is; genuine disagreement between a low-stakes attribution and a high-stakes denial versus a mere difference in what is said; and whether the theory can declare the low-stakes attributor to be in error without convicting ordinary epistemic speech of systematic falsehood.

  Two things I want most. First, sort the requirements by status: mark which are load-bearing for any theory with the purposes I have fixed, and which are preferences of one camp that have been smuggled in as constraints — I have in mind the demands that knowledge cannot be lost without a change in the subject's evidence or mental life, that knowledge cannot depend on factors the subject could not know about, that the expression must behave identically in every embedding, that ordinary speakers' verdicts are data rather than the output to be explained, that a norm must be usable by the agent who is guided by it, and that a semantic account must not be revisionary. Adjudicate those: for each, is it a desideratum or a methodological commitment in disguise? Second, identify any subset of the surviving requirements that cannot be jointly satisfied. I suspect there is a three-way trade among the truth of low-stakes attributions, the truth of high-stakes denials, and the claim that both are about one and the same relation between the subject and the proposition; if that is right, say what each candidate view buys by giving up which corner, and whether the trade is really a trilemma or an artefact of how I have set the purpose.

  Finish with two short things. Nominate the single requirement that does the most exclusionary work, and say why it is that one rather than the more frequently cited ones. Then, in a paragraph or less per family, note where each of the five approaches I opened with fails the list — as a check on the list, not as a ranking: I want to know what each failure shows about the requirements, not which theory wins. If nothing on offer satisfies the whole list, sketch in a sentence or two what a view that did would have to look like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Create a list of *desiderata* (specifications/requirements) for theories of knowledge attribution, specifically focusing on the debate about practical stakes and context-sensitivity (Contextualism, Subject-Sensitive Invariantism/SSI, Interest-Relative Invariantism/IRI, Assessment-Sensitive Relativism, Contrastivism).
      *   **Purpose:** The theory must serve two functions:
          1.  Action-guiding: State conditions under which a subject can treat a proposition as a reason for action (Knowledge Norm of Practical Reasoning).
          2.  Speech-act guiding: State what a speaker says/is held to when attributing/withholding/denying/retracting knowledge across contexts.
      *   **Task 1:** Determine if these are two jobs for one theory or two theories in a shared vocabulary. If distinct, define the division (semantic vs. epistemic).
      *   **Task 2:** Convert the provided 12 "raw material" phenomena into requirements. Merge/drop non-independent ones. Explain what each is really asking for.
      *   **Task 3:** Enforce distinctions the theory cannot collapse (e.g., knowing vs. reasonable to treat as reason).
      *   **Task 4:** Sort requirements by status (Load-bearing vs. Smuggled Preferences/Methodological Commitments). Adjudicate specific commitments (e.g., "knowledge cannot depend on unknown factors").
      *   **Task 5:** Identify incompatibilities (Trilemma: Low-stakes truth, High-stakes truth, Single Relation). Explain trade-offs for each view.
      *   **Task 6:** Nominate the single most exclusionary requirement.
      *   **Task 7:** Briefly note where each of the 5 approaches fails the list (Contextualism, SSI/IRI, Relativism, Contrastivism, plus the "Attributor's Stakes" variant).
      *   **Constraint:** Finish with a sketch of a view that *would* satisfy the list if none do.
      *   **Tone:** Philosophical, precise, rigorous, analytical. No fluff.

  2.  **Deconstruct the Purpose (Action vs. Speech):**

      *   *Question:* Are these two jobs for one theory?
      *   *Analysis:* If knowledge norms action, the condition must be accessible or relevant to the agent's decision. If knowledge norms assertion, the condition must track conversational propriety. Often these come apart (e.g., lottery cases).
      *   *Decision:* They are distinct but linked. A unified theory needs a *bridge principle*. However, for the purpose of *specification*, we need requirements for the *concept* that underpins both. Let's treat them as dual constraints on a single theoretical construct ("Knowledge"), but acknowledge the tension. The division isn't semantic vs. epistemic per se, but *normative function* vs. *truth-conditional content*.
      *   *Refinement:* The prompt asks: "Tell me whether those are two jobs for one theory or two theories in a shared vocabulary."
      *   *Verdict:* It is one theory with a dual-aspect nature. The *condition* for knowledge is the same, but its *application* differs in practical reasoning vs. attribution. If we split them, we lose the explanatory link (why does *knowledge* specifically license action?). So, one theory, but the desiderata must cover both domains.

  3.  **Process the 12 Phenomena into Requirements:**

      *   1. *Baseline Stakes Pairs:* Requires **Stakes Sensitivity**. The theory must explain variance in attribution across stakes without variance in evidence.
      *   2. *Skeptical Contexts:* Requires **Error Salience Discrimination**. Must distinguish stakes-driven shifts from salience-driven shifts (or unify them). Let's merge with 1 as **Contextual Variance Explanation**.
      *   3. *Lottery/Statistical:* Requires **Modal Strength Constraint**. Evidence type matters, not just probability. Distinct from stakes.
      *   4. *Hidden Stakes:* Requires **Stakes Accessibility/Objectivity**. Whose stakes? Objective vs. Subjective. This challenges the action-guiding role. Let's call this **Stakes Determination**.
      *   5. *Asymmetric Error Costs:* Requires **Directional Sensitivity**. False positive vs. False negative costs.
      *   6. *The Floor:* Requires **Evidential Minimum**. Stakes can't lower the bar to zero.
      *   7. *Deferred/Third-Party:* Requires **Stakes Attribution**. Whose stakes count? (Subject, Attributor, User).
      *   8. *Diachronic/Memory:* Requires **Temporal Stability**. Can knowledge status change retrospectively based on future stakes?
      *   9. *Leakage:* Requires **Propositional Isolation**. Stakes on *q* shouldn't automatically raise bar for *p* unless linked.
      *   10. *Moral Encroachment:* Requires **Normative Distinction**. Is moral risk just another stake, or a distinct norm? Let's treat as **Normative Scope**.
      *   11. *Second-Order:* Requires **Iterability**. The theory must apply to knowledge about knowledge without infinite regress or paradox.
      *   12. *Embedding:* Requires **Compositional Semantics**. "Knows" must work in conditionals/negation.

      *   *Merging/Dropping:*
          *   1, 2, 5, 9 are all about *what shifts the standard*. Merge into **Standard Variability**.
          *   4, 7, 8 are about *whose/when stakes*. Merge into **Stakes Parameterization**.
          *   3 is about *evidence type*. Keep separate (**Evidence Quality**).
          *   6 is a limit condition (**Lower Bound**).
          *   10 is a scope condition (**Normative Domain**).
          *   11, 12 are structural (**Logical Form**).

  4.  **Distinctions Not to Collapse:**

      *   Knowing vs. Reasonable to Act (Knowledge vs. Rationality).
      *   Knowing vs. Assertible (Epistemic vs. Conversational Norms).
      *   Standard Moving vs. Epistemic Position Moving (Contextualism vs. SSI).
      *   Degree of Warrant vs. Binary Status (Gradability vs. Threshold).
      *   Disagreement vs. Talking Past (Semantic Conflict vs. Pragmatic Misalignment).
      *   Error Attribution (Are low-stakes speakers wrong?).

  5.  **Sort by Status (Load-bearing vs. Smuggled Preferences):**

      *   *Load-bearing:* Must explain the data (variance), must guide action (norm), must allow communication (semantics).
      *   *Smuggled:* "Knowledge cannot depend on unknown factors" (This is an invariantist intuition, not a datum). "Ordinary verdicts are data" (Sometimes ordinary verdicts are confused; theory explains *why* they have them). "Semantics must not be revisionary" (Theories often claim ordinary language is loose). "Norm must be usable" (Internalism constraint).
      *   *Adjudication:* I need to be firm here. The prompt asks to adjudicate.
          *   *Unknown factors:* Not a hard constraint. Externalism exists. But for *action-guiding*, the agent needs *access* to the norm, even if the fact is external.
          *   *Ordinary verdicts:* Data to be explained, not infallible truth.
          *   *Non-revisionary:* A theory *should* explain why ordinary speech seems inconsistent if it is.
          *   *Usable:* Crucial for the "action-guiding" purpose.

  6.  **The Trilemma:**

      *   Corners: (A) Low-stakes attributions are true. (B) High-stakes denials are true. (C) "Knows" expresses a single, stable relation (Invariantism).
      *   Trade-offs:
          *   Contextualism: Gives up (C). "Knows" changes meaning.
          *   SSI/IRI: Gives up (C) in a way (relation includes stakes), or keeps (C) but says truth value changes. Actually, SSI keeps (C) as a 3-place relation but denies traditional invariantism. Let's refine: Invariantism (Traditional) gives up (A) or (B).
          *   Relativism: Gives up (C) (truth is relative to assessor).
          *   Subject-Sensitive Invariantism: Keeps (A) and (B) true relative to subject's stakes, but denies (C) if (C) means "independent of practical situation".
      *   *Refinement:* The trilemma is usually: (1) Low-stakes True, (2) High-stakes True, (3) Semantic Invariantism.
      *   Contextualism: Denies (3).
      *   Skeptical Invariantism: Denies (1).
      *   Anti-Skeptical Invariantism (SSI): Denies (3) (by making stakes part of the truth condition) or Denies (1) (says low stakes are loose speech).
      *   Relativism: Denies (3) (truth is relative).

  7.  **Most Exclusionary Requirement:**

      *   Candidate: **The Action-Guiding Constraint (Usability)**.
      *   Why? Many semantic theories (Contextualism, Relativism) struggle to explain how the *subject* knows they know when the standard depends on the *attributor* or *assessor*. If the subject can't access the standard, knowledge can't norm action *for them*. This kills pure Contextualism and Relativism for the "action" half of the purpose.

  8.  **Failures of the 5 Approaches:**

      *   *Contextualism (Attributor Context):* Fails Action-Guiding (Subject doesn't know attributor's context). Fails Embedding (sometimes).
      *   *SSI/IRI (Subject Stakes):* Fails Hidden Stakes (if objective stakes count, subject can't access norm; if subjective, ignores real risk). Fails Third-Party (dead scientist).
      *   *Attributor Stakes:* Fails Action-Guiding (Why does *my* stake stop *you* acting?).
      *   *Relativism (Assessor):* Fails Action-Guiding (Subject can't know future assessors). Fails Retraction accounts (sometimes).
      *   *Contrastivism:* Fails to capture the *stakes* intuition directly (contrasts aren't always stakes-driven). Fails Action-Guiding (which contrast is default for action?).

  9.  **Drafting the Response:**

      *   *Structure:*
          1.  Purpose & Theory Unity (One theory, dual aspect).
          2.  The Desiderata (Converted from phenomena, merged).
          3.  Distinctions to Maintain.
          4.  Status Sort (Load-bearing vs. Preferences).
          5.  The Trilemma (Trade-offs).
          6.  Most Exclusionary Requirement.
          7.  Failures of the 5 Views.
          8.  Sketch of a Successful View.

      *   *Refining the Desiderata:* I need to make sure I explicitly convert the 12 points.
          *   1, 2, 5, 9 -> **Variability Constraint**.
          *   3 -> **Modal Constraint**.
          *   4, 7, 8 -> **Parameter Fixing**.
          *   6 -> **Threshold Constraint**.
          *   10 -> **Normative Scope**.
          *   11, 12 -> **Formal Constraint**.
      *   *Refining the Status Sort:* Be sharp on "Knowledge cannot depend on unknown factors." This is the Internalist constraint. It conflicts with Externalist stakes (Hidden Stakes). I need to call this out.
      *   *Refining the Trilemma:* Ensure the mapping of views to corners is precise.
      *   *Refining the Failures:* Keep them punchy.

      *(Self-Correction during drafting)*: The prompt asks: "Tell me whether those are two jobs for one theory or two theories in a shared vocabulary." I need to be decisive. If I say "one theory," I must explain how it handles the tension. If I say "two," I must explain the link. The prompt implies the theory must "earn its keep twice over." This suggests a unified account is preferred but the tension must be acknowledged. I will argue for **One Theory with Dual Constraints**. Splitting them makes "knowledge" ambiguous in a way that defeats the purpose of the debate.

      *(Self-Correction on Trilemma)*: The prompt suspects a three-way trade among: (1) Truth of low-stakes attributions, (2) Truth of high-stakes denials, (3) Claim that both are about one and the same relation.
      *   Contextualism: Keeps 1 & 2, Denies 3 (relation shifts).
      *   Invariantism (Skeptical): Keeps 3, Denies 1.
      *   Invariantism (Anti-Skeptical/SSI): Keeps 3 (mostly), Denies 2 (says high stakes denials are false/loose) OR Keeps 1 & 2 by making stakes part of the relation (which challenges 3 if 3 means 'purely epistemic').
      *   Relativism: Keeps 1 & 2, Denies 3 (truth is relative).
      *   I need to articulate this clearly.

      *(Self-Correction on Exclusionary Requirement)*: The "Action-Guiding/Usability" constraint is the strongest. It rules out Contextualism and Relativism immediately for the practical reasoning half. It forces SSI. But SSI fails Hidden Stakes. So this requirement is the killer.

      *(Final check on constraints)*: "Finish with two short things." (1) Nominate requirement. (2) Paragraph per family on failures + sketch of successful view. I need to ensure the failures are "as a check on the list."

      *Let's write.*
answer: |-
  ### I. The Purpose and Unity of the Theory

  You have fixed a dual purpose: the theory must govern **practical reasoning** (when a subject may treat $p$ as a reason for acting) and **speech-act attribution** (what is said and warranted when attributing knowledge).

  **Verdict:** These are two jobs for **one theory**, not two theories in a shared vocabulary.
  **Reasoning:** If you split them, you sever the explanatory link that makes the debate substantive. If "knowledge" in the practical sense differs from "knowledge" in the attributive sense, the dispute about whether stakes affect knowledge is merely verbal. A unified theory must posit a single condition $K(S, p, C)$ that simultaneously satisfies the norm of practical rationality and the truth-conditions of the predicate "knows."
  **The Division:** The requirements divide not into semantic vs. epistemic lists, but into **Constitutive Constraints** (what knowledge *is*) and **Operational Constraints** (how knowledge *functions*). The same cases pull in both directions: a case where a subject acts on $p$ (Operational) is often the same case where we evaluate if she knew $p$ (Constitutive). The division is a finding: the tension between the subject's need for access (to guide action) and the attributor's context (which drives linguistic variance) is the central friction the theory must resolve.

  ### II. The Desiderata (Converted from Phenomena)

  I have converted your twelve phenomena into six independent requirements. I have merged those driven by the same underlying mechanism and dropped those that are derivative.

  1.  **The Variability Constraint (from 1, 2, 5, 9):**
      *   *Requirement:* The theory must explain why knowledge attributions vary across stakes contexts without positing a change in the subject's evidence or truth-value of $p$. It must distinguish stakes-driven variance from error-salience variance and prevent "leakage" (stakes on $q$ affecting $p$) unless a logical link exists.
      *   *What it asks:* A mechanism for standard-shifting that is sensitive to practical cost asymmetry but isolated to the relevant proposition.

  2.  **The Modal Constraint (from 3):**
      *   *Requirement:* The theory must distinguish high-probability statistical support from knowledge, even when stakes are low.
      *   *What it asks:* An evidential quality condition that is not reducible to subjective probability or practical utility.

  3.  **The Parameter Fixing Constraint (from 4, 7, 8):**
      *   *Requirement:* The theory must specify whose stakes set the standard (subject, attributor, assessor, or third-party user) and when they are fixed (at acquisition, action, or assessment). It must handle "hidden stakes" (objective vs. believed) and diachronic shifts (memory).
      *   *What it asks:* A definitive rule for the *index* of the practical parameter.

  4.  **The Threshold Constraint (from 6):**
      *   *Requirement:* The theory must posit a non-zero evidential floor. Even if stakes are nil, trivial true beliefs (guesses) must not count as knowledge.
      *   *What it asks:* A minimum epistemic standing independent of practical utility.

  5.  **The Normative Scope Constraint (from 10):**
      *   *Requirement:* The theory must adjudicate whether moral risks function identically to prudential risks (encroachment) or constitute a distinct norm.
      *   *What it asks:* A boundary condition on what counts as a "stake."

  6.  **The Formal Constraint (from 11, 12):**
      *   *Requirement:* The knowledge predicate must embed logically (under negation, conditionals, attitude reports) without generating contradictions or losing its stakes-parameter.
      *   *What it asks:* A compositional semantics that preserves the stakes-sensitivity in complex sentences.

  ### III. Distinctions Not to Collapse

  A theory fails if it conflates the following:

  1.  **Knowing vs. Reasonable to Treat as a Reason:** If the theory defines knowledge *as* whatever makes action reasonable, it eliminates the epistemic norm in favor of decision theory. Knowledge must be a *sufficient* condition for treating $p$ as a reason, not identical to the rationality of the act.
  2.  **Knowing vs. Being in a Position to Assert:** Assertibility may be governed by conversational norms distinct from the truth-conditions of knowledge. A theory that explains away knowledge denials as merely "impolite to assert" fails the Variability Constraint.
  3.  **Standard Moving vs. Epistemic Position Moving:** The theory must distinguish between the subject's evidence changing (invariantism) and the standard required for that evidence to count as knowledge changing (contextualism/SSI).
  4.  **Binary Status vs. Degree of Warrant:** Knowledge is typically treated as a threshold concept. A theory that reduces it to "enough warrant for context" must explain why we treat it as a categorical state in reasoning.
  5.  **Genuine Disagreement vs. Talking Past:** If a low-stakes attributor says "She knows" and a high-stakes attributor says "She doesn't," the theory must determine if they contradict each other or speak different languages.
  6.  **Error Attribution:** The theory must explain whether the low-stakes attributor is *false* (invariantism) or *correct relative to her context* (contextualism/relativism) without making ordinary speech systematically erroneous.

  ### IV. Status Sort: Load-Bearing vs. Smuggled Preferences

  You asked to adjudicate specific methodological commitments. Here is the sorting:

  **Load-Bearing Desiderata (Must be satisfied):**
  *   **The Action-Guiding Constraint:** (Derived from Purpose). The subject must be able to use the norm to guide action. If the standard depends on facts inaccessible to the subject, it cannot norm her reasoning.
  *   **The Variability Constraint:** (Derived from Phenomena 1). Any theory that denies the data of stakes-sensitivity fails to explain the target phenomenon.
  *   **The Formal Constraint:** (Derived from Phenomena 12). A semantic theory that breaks under embedding is logically incoherent.

  **Smuggled Preferences (Methodological Commitments in Disguise):**
  *   *"Knowledge cannot depend on factors the subject could not know about."*
      *   **Adjudication:** This is **Internalism**, not a desideratum. It conflicts with the **Parameter Fixing Constraint** regarding *Hidden Stakes* (4). If objective stakes matter (to protect the action-guiding role from catastrophe), the subject cannot always know if she knows. **Verdict:** Drop as a hard constraint; treat as a tension to be managed.
  *   *"Ordinary speakers' verdicts are data rather than the output to be explained."*
      *   **Adjudication:** **False Dichotomy.** Verdicts are data, but they are often inconsistent. The theory's job is to explain *why* they are inconsistent, not to validate all of them. **Verdict:** Modify to "Theory must systematize ordinary verdicts, even if it declares some false."
  *   *"A semantic account must not be revisionary."*
      *   **Adjudication:** **Preference.** Any solution to the trilemma involves some revisionism (either of semantics or of epistemology). **Verdict:** Drop. Minimize revisionism, but do not forbid it.
  *   *"Knowledge cannot be lost without a change in the subject's evidence."*
      *   **Adjudication:** This is **Traditional Invariantism**. It directly contradicts the **Variability Constraint**. **Verdict:** Reject. This is the view under test, not a constraint on the test.

  ### V. The Trilemma and Trade-Offs

  You suspect a three-way trade. You are correct. The inconsistent triad is:
  1.  **Low-Stakes Truth:** Attributions in low-stakes contexts are true.
  2.  **High-Stakes Truth:** Denials in high-stakes contexts are true.
  3.  **Semantic Invariantism:** "Knows" expresses a single, stable relation between subject and proposition (independent of context/stakes).

  **The Trade-Offs:**
  *   **Contextualism:** Keeps (1) and (2). **Gives up (3).** "Knows" changes content with the attributor's context.
      *   *Cost:* Fails the Action-Guiding Constraint (Subject cannot access attributor's context to guide action).
  *   **Skeptical Invariantism:** Keeps (3). **Gives up (1).** Low-stakes attributions are false (loose speech).
      *   *Cost:* Convicts ordinary speech of systematic falsehood; fails to explain why low-stakes action is warranted.
  *   **Subject-Sensitive Invariantism (SSI/IRI):** Keeps (1) and (2) effectively. **Gives up (3)** (by making the relation a 3-place function including stakes) OR Keeps (3) but claims High-Stakes denials are technically false but pragmatically warranted.
      *   *Cost:* Struggles with Hidden Stakes (Parameter Fixing) and Third-Party cases.
  *   **Relativism:** Keeps (1) and (2). **Gives up (3)** (Truth is relative to the assessor, not a stable relation).
      *   *Cost:* Fails Action-Guiding (Subject cannot know future assessors' standards).
  *   **Contrastivism:** Keeps (1) and (2). **Gives up (3)** (Knowledge is a 3-place relation to a contrast class).
      *   *Cost:* Struggles to map contrasts directly to stakes without stipulation.

  **Is it a Trilemma or an Artefact?** It is a genuine trilemma *if* you demand a traditional binary relation. If you allow the relation to be complex (e.g., including stakes), you dissolve (3), but then you face the **Action-Guiding Constraint** problem: can the subject access that complex relation?

  ### VI. The Most Exclusionary Requirement

  **Nomination:** **The Action-Guiding Constraint (Usability).**
  **Why:** This is the killer. Most semantic theories (Contextualism, Relativism) solve the linguistic data (Variability) by locating the stakes parameter in the *attributor* or *assessor*. But the purpose requires the theory to state when a *subject* may treat $p$ as a reason. A subject cannot access the attributor's context or a future assessor's standards. Therefore, any theory that locates the stakes parameter outside the subject's cognitive reach fails the first half of your dual purpose. This requirement excludes pure Contextualism and Relativism immediately, forcing the theory toward Subject-Sensitive views, which then struggle with Hidden Stakes. It is more exclusionary than the Variability Constraint because many theories can explain variance; few can explain variance *and* guide the agent simultaneously.

  ### VII. Failures of the Five Approaches

  **1. Attributor Contextualism:**
  *   **Failure:** Fails the **Action-Guiding Constraint**. If the standard depends on the *speaker's* context, the *subject* cannot know if she knows, so knowledge cannot norm her action.
  *   **Shows:** The list demands the parameter be accessible to the subject, not just the conversational partner.

  **2. Subject-Sensitive Invariantism (SSI/IRI):**
  *   **Failure:** Fails the **Parameter Fixing Constraint** on **Hidden Stakes** (4). If objective stakes determine knowledge, the subject cannot access the norm (violating Action-Guiding). If believed stakes determine it, she may "know" while facing catastrophic objective risk (violating the protective role of knowledge).
  *   **Shows:** The list exposes the tension between externalist truth conditions and internalist usability.

  **3. Attributor's Stakes Variant:**
  *   **Failure:** Fails the **Action-Guiding Constraint** and **Third-Party Stakes** (7). Why does *my* high stake prevent *you* from knowing, when you are the one acting? It severs the link between knowledge and the subject's rationality.
  *   **Shows:** The list enforces that knowledge must be grounded in the agent's practical situation, not the observer's.

  **4. Assessment-Sensitive Relativism:**
  *   **Failure:** Fails the **Action-Guiding Constraint** and **Diachronic Cases** (8). A subject acting on memory cannot anticipate the standards of future assessors to determine if she currently knows.
  *   **Shows:** The list requires a stable norm for the agent at the time of action, not a truth-value settled later.

  **5. Contrastivism:**
  *   **Failure:** Fails the **Variability Constraint** (1) without stipulation. Contrasts do not automatically align with stakes. One can hold a contrast fixed while stakes rise, yet intuition says knowledge is lost.
  *   **Shows:** The list demands that *stakes* specifically do the work, not just logical alternatives.

  **Sketch of a Successful View:**
  A view satisfying this list would likely be a **Hybrid Dual-Aspect Theory**. It would posit that "knowledge" expresses a stable, high-threshold epistemic relation (satisfying the Modal and Threshold Constraints) but is *licensed for use* in practical reasoning only when the subject's expected utility of acting on $p$ exceeds a context-sensitive threshold. It would treat ordinary knowledge attributions as *implicatures* of this licensing condition rather than direct reports of the epistemic relation. This preserves the invariant truth of the epistemic relation (solving the Trilemma by reinterpreting (1) and (2) as pragmatic) while allowing the action-guiding norm to shift with stakes (satisfying the Action-Guiding Constraint). It fails only the demand that "knows" semantically *means* the action-license, but that demand is a smuggled preference.
