answer: |-
  To bring analytical clarity to your seminar, it is necessary to disambiguate the maxim 'silence is not consent'. The phrase is not a single proposition but a placeholder for several distinct claims regarding the relationship between behaviour, mental states, and normative authority. Below is a precise menu of the distinct theses the maxim might express, categorised by the type of failure they allege, evaluated for their truth value, and mapped against the three specific moves currently being debated in your session.

  ### 1. The Evidential Thesis
  **Formulation:** Silence provides insufficient evidence to infer that the silent party holds the internal mental state of agreement.
  **Category:** Epistemic failure.
  **Evaluation:** Defensible but substantive. While silence is often ambiguous, it is not universally devoid of evidentiary value; in established relationships or conventional settings (e.g., a patient extending an arm for a blood test), silence coupled with context may reliably indicate agreement. However, as a general heuristic in high-stakes clinical or institutional contexts, treating silence as epistemically opaque is prudent.
  **Support for Seminar Moves:**
  *   **Supports Move 1 (Non-objection never counts as authorisation):** Yes. If silence cannot reliably evidence agreement, it should not count as authorisation.
  *   **Supports Move 2 (Prior consent irrevocable):** No. This thesis concerns the inference of current states, not the persistence of prior norms.
  *   **Supports Move 3 (No authority without vocal affirmation):** Partially. It suggests vocal affirmation is *preferable* for evidence, but does not strictly rule out non-vocal cues.

  ### 2. The Volitional Thesis
  **Formulation:** Silence fails to demonstrate that the will of the party was freely exercised in favour of the proposed action.
  **Category:** Volitional failure.
  **Evaluation:** Defensible but substantive. This reading assumes that a free will requires active endorsement rather than passive acquiescence, often due to the risk of coercion or paralysis. However, it is not plainly true that silence always indicates unfreedom; voluntary silence is possible. Thus, the claim is substantive and depends on the presumption of pressure in institutional settings.
  **Support for Seminar Moves:**
  *   **Supports Move 1 (Non-objection never counts as authorisation):** Yes. If silence does not demonstrate a free will, it cannot validly authorise.
  *   **Supports Move 2 (Prior consent irrevocable):** No. This thesis addresses the quality of the current act, not the status of previous acts.
  *   **Supports Move 3 (No authority without vocal affirmation):** No. Volition can be expressed non-vocally (e.g., via gesture); this thesis does not strictly require speech.

  ### 3. The Performative Thesis
  **Formulation:** Consent is a speech act that requires explicit utterance or conventional signalling; silence cannot constitute the illocutionary act of consenting.
  **Category:** Performative failure.
  **Evaluation:** Plainly false (as a general moral principle) but Defensible (in specific institutional contexts). In ordinary morality and many legal contexts, non-verbal conduct (nodding, handing over a card) can perform consent. However, specific clinical or research protocols may define consent strictly as a vocal or written performative. As a universal claim, it is false; as a procedural rule, it is defensible.
  **Support for Seminar Moves:**
  *   **Supports Move 1 (Non-objection never counts as authorisation):** Yes. If silence is not a valid speech act, it cannot authorise.
  *   **Supports Move 2 (Prior consent irrevocable):** No. This concerns the initiation of consent, not its duration.
  *   **Supports Move 3 (No authority without vocal affirmation):** Yes. This is the primary reading that supports the requirement for vocal affirmation specifically.

  ### 4. The Normative-Initiation Thesis
  **Formulation:** Silence does not effect the transfer of normative power or authority from one party to another absent a prior convention establishing that it does.
  **Category:** Normative-power failure.
  **Evaluation:** Defensible but substantive. Normative powers generally require exercise to be transferred. While conventions can establish that silence counts as acceptance (e.g., failing to opt out of a scheme), in the absence of such conventions, silence lacks the normative force to grant authority.
  **Support for Seminar Moves:**
  *   **Supports Move 1 (Non-objection never counts as authorisation):** Yes. Without a convention, silence transfers no power.
  *   **Supports Move 2 (Prior consent irrevocable):** No. This concerns the creation of authority, not its persistence.
  *   **Supports Move 3 (No authority without vocal affirmation):** Partially. It supports the need for explicit transfer, though not necessarily vocalisation.

  ### 5. The Normative-Continuity Thesis
  **Formulation:** Silence does not constitute either the sustenance of prior authority nor the revocation of it; normative powers lapse or persist according to separate rules, not merely via silence.
  **Category:** Normative-power failure.
  **Evaluation:** Defensible but substantive. This is the most complex reading. It distinguishes between *consenting to proceed* and *consenting to withdraw*. It holds that silence is normatively inert regarding the status of existing permissions.
  **Support for Seminar Moves:**
  *   **Supports Move 1 (Non-objection never counts as authorisation):** Yes, regarding new actions.
  *   **Supports Move 2 (Prior consent irrevocable regardless of later silence):** Yes. If silence is not consent (to revoke), then prior consent remains valid until actively withdrawn. This is the only reading that supports this move, though it requires interpreting 'consent' in the maxim as 'consent to withdraw'.
  *   **Supports Move 3 (No authority without vocal affirmation):** No. This thesis concerns the duration of authority, not the mode of its expression.

  ### Summary for Seminar Facilitation

  To prevent the slogan from substituting for argument, you may guide participants to specify which thesis they are invoking:

  1.  **Participants arguing Move 1** (Non-objection never counts) are likely relying on the **Evidential** or **Normative-Initiation** theses. They should be asked whether they believe silence is merely unreliable evidence (Epistemic) or normatively inert (Normative).
  2.  **Participants arguing Move 2** (Prior consent is irrevocable despite silence) are relying on a specific version of the **Normative-Continuity** thesis. They must clarify that they interpret the maxim to mean 'Silence is not consent *to withdraw*'. If they do not make this distinction, their use of the maxim is logically inconsistent with its standard usage.
  3.  **Participants arguing Move 3** (Authority requires vocal affirmation) are relying on the strict **Performative** thesis. They should be challenged on whether this is a moral necessity or merely a procedural convention, given that the Performative Thesis is plainly false as a universal moral claim.

  By forcing these distinctions, you will shift the discussion from the recitation of a maxim to an analysis of the underlying normative structures governing authority and communication in your specific settings.
