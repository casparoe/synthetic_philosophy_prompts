  Keep Points 1, 2, 4, 5, 6. **Rewrite Point 3** to restrict Maxmin to static contexts. **Rewrite Point 7** to clarify that "no exploitation" applies to the *full* decision strategy (including the sequential rule), not just the static Maxmin rule. This closes the money-pump loophole while keeping the Ellsberg intuition intact.
