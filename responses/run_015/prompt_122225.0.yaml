      *   *The Problem:* In many cases, these look identical behaviorally (the "alignment problem" or "specification gaming" context). The theory needs to dig deeper than surface behavior.

  3.  **Drafting the Desiderata:**

      *   *Desideratum 1: Behavioral Equivalence Breaking.* We need to distinguish agents that act the same but for different reasons.
          *   *Motivation:* The "Deceptive Alignment" or "Sycophancy" problem. An agent might do the right thing just to look good vs. doing the right thing to actually help.
          *   *Status:* Non-negotiable. If a theory can't distinguish these, it fails the core prompt.

      *   *Desideratum 2: Staged Feedback/Proxy Handling.* How does the theory handle delayed rewards or proxies?
          *   *Motivation:* Goodhart's Law. If the metric diverges from the truth, does the agent chase the metric (ADA) or the truth (GDA)?
          *   *Status:* Non-negotiable. Crucial for real-world deployment.

      *   *Desideratum 3: Counterfactual Sensitivity.* What would the agent do if approval were decoupled from the outcome?
          *   *Motivation:* The "Button Problem." If I can press a button to get approval without doing the task, will I? ADA says yes; GDA says no.
          *   *Status:* Non-negotiable. This is the standard philosophical test for intentionality.

      *   *Desideratum 4: Learning Dynamics.* How does the agent update when the approval signal changes?
          *   *Motivation:* Distributional shift. If humans change what they like, does the agent follow (ADA) or stick to the original goal (GDA)?
