prompt: |-
  ok so I'm a senior and I'm in this elective called Human Nature (it's half psych half bio, mostly discussion) and right now we're doing like two weeks on evolutionary psychology. Our teacher had us read a chapter out of one of those pop-science books — I think the guy writes for a magazine or something, I alredy forgot the title and I returned my copy to the library — and then we're supposed to write a short response on whether the "just-so story" criticism actually lands or whether it's mostly people misunderstanding what the field is even claiming. I get the general vibe but I feel like if I just repeat the chapter's framing I'm going to write something a real evolutionary psychologist would roll their eyes at, and I can't really go check anything (our school library has like six psych books and no journal access at all, so please don't just tell me to go read papers, I can't get them).

  The thing is, my brother read the same chapter — he's a psych major at the community college and is extremely confident about everything — and he summed the whole field up for me like this:

  "Evolutionary psychology says the brain isn't one general-purpose learning machine, it's a bunch of separate modules that natural selection built during the Pleistocene while we were all hunter-gatherers, so our minds are stuck running software for a world that doesn't exist anymore. The way they actually do it is: you notice something people do — guys going for younger women, everyone being scared of snakes, people gossiping about who cheated who — and then you make up a story about how that would have helped our ancestors survive and reproduce, and that story is the explanation. Which means whatever fact you hand them, they can cook up a story for it, and a theory that can explain absolutely everything can't be tested and isn't really science. Also the whole point is that these things are innate and genetic, so they basically think parenting and culture don't matter and we're stuck with whatever our ancestors handed us."

  I don't trust him 100% because this is the same person who says Freud was right about everything at dinner, but I also can't tell which parts he's getting from the book and which parts he's adding himself, and I don't want to hand in a paper that's just his confidence in nicer handwriting.

  There's one more piece. The chapter had this experiment thing where people are apparently way better at catching someone who breaks a rule like "if you take the benefit you have to pay the cost" than at catching someone breaking the exact same rule written out as some boring if-then thing about letters and numbers, even though logically it's the same problem, and the book says that shows our brains come with a built-in cheater-detection module. That part honestly kind of blew my mind. But then I made up a counter-scenario to test myself: suppose someone ran that same kind of task in a bunch of small-scale societies and the advantage basically vanished, or suppose it turned out you can get people just as good at the abstract version with like an hour of logic practice. Would that actually kill the module claim, or is there some way an evolutionary psychologist could just absorb that result and keep going — and if they can absorb it either way, is that the thing my brother is complaining about? And more generally: when people say "just-so story," what exactly are they accusing evolutionary psychologists of doing, what would a careful one say back, and does the "so it's not science" conclusion actually follow from the parts of his summary that are right?

  My own guess is that the confusion is that "this trait was useful to our ancestors" and "this trait is useful / healthy / unavoidable right now" are two totally different claims and everyone keeps sliding between them, but I'm not sure that's the main thing going on, or if there's a better distinction I should be building the paper around. Anyway — go through his summary claim by claim and tell me what's fair, what's a caricature, and what a defender would push back on, and also flag anything where even the critics would go "no, that's not our objection." thank u!!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school senior, taking a "Human Nature" elective (psych/bio mix).
      *   **Task:** Write a short response paper on the "just-so story" criticism of evolutionary psychology (EP).
      *   **Constraints:** Cannot access academic journals (school library limitations). Read a pop-sci chapter (title forgotten, returned). Brother (community college psych major) gave a summary, but user distrusts his accuracy (brother thinks Freud was right).
      *   **Key Content:** User mentions the Wason Selection Task (cheater detection vs. abstract logic). User has a hypothesis about conflating "adaptive in the past" vs. "useful now."
      *   **Goal:** Break down the brother's summary claim-by-claim (fair vs. caricature vs. wrong), explain the "just-so story" criticism properly, address the Wason task counter-scenario, and help the user structure a nuanced paper that won't make an EP researcher roll their eyes.

  2.  **Deconstruct the Brother's Summary:**
      *   *Claim 1: Brain is modular (not general-purpose), built in Pleistocene.* -> **Mostly Fair.** This is the core EP hypothesis (Massive Modularity Hypothesis, Environment of Evolutionary Adaptedness).
      *   *Claim 2: Method is noticing behavior + making up a survival story.* -> **Caricature/Strawman.** This is the heart of the "just-so story" critique, but good EP tries to constrain this with cross-species data, game theory, etc. It's not *just* making things up, but the risk is real.
      *   *Claim 3: Theory explains everything, can't be tested, isn't science.* -> **The Criticism.** This is what Popperian falsifiability critics say. Defenders argue it *is* testable (predictions about universals, developmental trajectories, etc.).
      *   *Claim 4: Everything is innate/genetic, parenting/culture don't matter.* -> **Caricature/Wrong.** EP distinguishes between *evoked culture* and *transmitted culture*. They argue for universal underlying mechanisms that produce different behaviors in different contexts. They don't deny plasticity; they ask *what* guides the plasticity.
      *   *Claim 5: Freud was right.* -> **Red Flag.** Indicates the brother might not be the most reliable source on scientific rigor.

  3.  **Address the "Just-So Story" Criticism:**
      *   **Origin:** Rudyard Kipling (fantasy stories explaining animal features). Gould & Lewontin (1979) applied it to biology/EP.
      *   **The Accusation:** Post-hoc rationalization. You see $X$, you invent a reason $X$ helped ancestors, you claim $X$ is an adaptation. Since we can't time travel, we can't prove it.
      *   **The Defense:** EP isn't just storytelling. It uses:
          *   *A priori predictions:* Predicting a mechanism *before* finding the behavior.
          *   *Convergent evidence:* Neuroscience, cross-cultural studies, developmental psychology.
          *   *Design specification:* Does the mechanism look *engineered* for that specific problem? (e.g., the Wason task).
      *   **Falsifiability:** Can it be disproven? Yes, if the trait isn't universal, if it doesn't solve an adaptive problem, or if a simpler general-purpose explanation works better.

  4.  **Analyze the Wason Selection Task (Cheater Detection):**
      *   **The Finding:** Cosmides & Tooby. People suck at abstract logic ($A \rightarrow B$), but great at social contract logic (Benefit $\rightarrow$ Cost).
      *   **User's Counter-Scenario:**
          *   *Scenario A:* Result vanishes in small-scale societies. -> **Damaging.** EP predicts universals. If it's not universal, it's likely cultural.
          *   *Scenario B:* Training fixes the abstract version. -> **Less Damaging.** EP argues we have *specialized* tools, not that we can't learn general logic. But if general learning explains it *better*, the modular claim weakens.
      *   **Is it unfalsifiable?** No. If the cheater advantage disappears under specific conditions predicted by the theory, the theory takes a hit. If they just say "oh, well, maybe that culture is different" without a rule for *why*, that's the "just-so" trap.

  5.  **Evaluate User's Hypothesis:**
      *   *Hypothesis:* Confusion between "adaptive then" vs. "useful now."
      *   **Verdict:** This is the "Mismatch Theory." It's valid, but it's not the *main* "just-so" criticism. The "just-so" criticism is about *methodology* (how we know it was adaptive then), not about current utility. I need to clarify this distinction for the user.

  6.  **Drafting the Response:**
      *   **Tone:** Encouraging, academic but accessible, validating the user's skepticism while correcting misconceptions.
      *   **Structure:**
          1.  **Intro:** Validate the user's instinct (brother is half-right, half-wrong).
          2.  **Brother's Claims Breakdown:** Go point-by-point (True, False, Nuanced).
          3.  **The "Just-So Story" Deep Dive:** Define it, explain the criticism, explain the defense (constraints/predictions).
          4.  **The Wason Task Analysis:** Address the user's counter-scenario directly. This is great critical thinking.
          5.  **User's Hypothesis:** Clarify the "Mismatch" vs. "Just-So" distinction.
          6.  **Paper Advice:** How to structure the response to impress the teacher (avoiding the traps).

  7.  **Refining Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to take sides too hard. The prompt asks whether the criticism *lands*. The answer is "it lands on bad EP, but good EP has defenses."
      *   *Correction:* Ensure I mention Gould & Lewontin since they coined the term in this context, even if the user can't read the paper. It adds credibility.
      *   *Correction:* Clarify the "innate" part. EP says the *mechanism* is innate, the *output* can be flexible. (e.g., language acquisition device is innate, English vs. Spanish is cultural).
      *   *Correction:* Address the Freud comment. It's a good heuristic for the user to gauge the brother's reliability.

  8.  **Final Polish:** Check against constraints (no journal access advice). Ensure the distinction between "adaptation" and "byproduct" is clear (spandrels).

  **(Self-Correction Note):** I need to be careful not to write the paper *for* them, but give them the analytical tools to write it. The prompt asks me to "go through his summary claim by claim... and flag anything."

  9.  **Final Plan:**
      *   Acknowledge the brother's reliability issue (Freud comment is key).
      *   Breakdown the 5 claims.
      *   Explain "Just-So" properly (Kipling -> Gould/Lewontin).
      *   Analyze the Wason/Logic counter-factual.
      *   Refine the user's "Then vs. Now" hypothesis.
      *   Provide a skeleton for the paper.

