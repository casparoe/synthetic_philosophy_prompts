answer: |-
  This is a fantastic prompt. You are thinking like a scientist already—specifically, by questioning whether a theory can be falsified (proven wrong). That is exactly what the "just-so story" criticism is about.

  Your brother is a useful source of "street knowledge," but the Freud comment is a massive red flag. In modern psychology, Freud is treated more like a historical figure (like Aristotle in physics) than a current scientific authority. If he thinks Freud was right about *everything*, he likely prefers confident narratives over rigorous data.

  Here is a breakdown of his summary, the actual criticism, and how you can tackle this paper without needing journal access.

  ### Part 1: Grading Your Brother's Summary
  Let's take his paragraph claim-by-claim. He is mixing **core theories**, **common criticisms**, and **strawman caricatures**.

  **1. "The brain isn't one general-purpose learning machine, it's a bunch of separate modules... built during the Pleistocene."**
  *   **Verdict:** **Fair.**
  *   **Why:** This is the "Massive Modularity Hypothesis." Standard EP argues the brain is like a Swiss Army Knife (specialized tools) rather than a general-purpose computer. They also argue many of these tools were shaped in the "Environment of Evolutionary Adaptedness" (EEA), roughly the Pleistocene hunter-gatherer era.
  *   **Nuance:** Critics argue the brain is more flexible than this, but this is an accurate summary of what EP *claims*.

  **2. "The way they actually do it is: you notice something people do... and then you make up a story about how that would have helped our ancestors... and that story is the explanation."**
  *   **Verdict:** **The Core Criticism (but slightly exaggerated).**
  *   **Why:** This is the definition of a "just-so story." The criticism is that EP often works *backwards*. They start with the behavior (e.g., "men like younger women") and invent a past reason for it ("reproductive value"), rather than predicting the behavior from a biological mechanism first.
  *   **The Defense:** Good EP researchers don't *just* make up stories. They use game theory, comparative primate data, and cross-cultural studies to constrain the stories. But your brother is right that it is very easy for a *bad* evolutionary psychologist to do exactly what he describes.

  **3. "Whatever fact you hand them, they can cook up a story for it, and a theory that can explain absolutely everything can't be tested and isn't really science."**
  *   **Verdict:** **Fair Philosophical Objection.**
  *   **Why:** This is about **falsifiability** (a concept from philosopher Karl Popper). If a theory can explain why men are aggressive *and* why men are nurturing (by just changing the "story" about what helped ancestors), then it can't be proven wrong. If it can't be proven wrong, it's not science.
  *   **The Defense:** EPs argue their theories *are* testable. For example, if they claim a trait is an adaptation, it should be universal across cultures. If it's not universal, the theory takes a hit.

  **4. "The whole point is that these things are innate and genetic, so they basically think parenting and culture don't matter."**
  *   **Verdict:** **Caricature / Wrong.**
  *   **Why:** This is the most common misunderstanding of EP. They do **not** say culture doesn't matter. They say the *capacity* for culture is innate.
      *   *Example:* Language. EP says we have an innate "language acquisition device." But *which* language you speak (English vs. Mandarin) is 100% culture/parenting.
      *   EP argues that our psychological mechanisms are "open programs" that take environmental input. They don't say behavior is fixed; they say the *rules* for how we respond to the environment are evolved.
  *   **Why your brother thinks this:** Pop-science books often simplify this to "genes determine behavior" because it sells better.

  **5. "Freud was right about everything."**
  *   **Verdict:** **Reliability Check.**
  *   **Why:** As mentioned, treat his confidence with skepticism. Freudian psychology is largely considered non-scientific today because it is also unfalsifiable (you can interpret any action as evidence for the theory). It is ironic that he uses the "unfalsifiable" argument against EP while supporting Freud.

  ---

  ### Part 2: What is a "Just-So Story" Really?
  The term comes from Rudyard Kipling's children's book *Just So Stories*, which offered fantasy explanations for animal traits (e.g., "How the Leopard Got His Spots").

  In science (specifically biology and psychology), the term was popularized by Stephen Jay Gould and Richard Lewontin in 1979.
  *   **The Accusation:** You are engaging in "adaptive storytelling." You see a trait, assume it must be useful (adaptive), and invent a history that makes it useful, without proving it wasn't just a random byproduct or a side effect of something else.
  *   **The "Spandrel" Argument:** Gould argued that some traits are like "spandrels" in architecture (the triangular space between two arches). You don't build the spandrel on purpose; it's just a necessary byproduct of building the arches. Critics say EP treats every mental spandrel like it was designed on purpose.

  **Does the criticism land?**
  *   **Yes,** when researchers are lazy. It is very easy to invent a story for *any* behavior.
  *   **No,** when researchers follow strict rules. To avoid being a just-so story, an EP hypothesis needs:
      1.  **A priori prediction:** Predicting the mechanism *before* finding the behavior.
      2.  **Design Specification:** Showing the mechanism is too complex to be a general learning rule (like your Wason task example).
      3.  **Universality:** Showing it appears across different cultures (ruling out local custom).

  ---

  ### Part 3: Your Wason Task Counter-Scenario
  Your intuition here is excellent. You asked: *If the cheater-detection advantage vanished in small-scale societies, or if training fixed it, would that kill the module claim?*

  **Scenario A: The advantage vanishes in small-scale societies.**
  *   **Impact:** **Devastating to the EP claim.**
  *   **Why:** EP claims these modules are universal human nature, evolved in the Pleistocene before we spread out. If a society exists where people *don't* detect cheaters better than logicians, it suggests the "module" isn't a universal biological instinct—it's a cultural trick learned in Western schools.
  *   **The "Absorb" Trap:** If the EP researcher says, "Oh, well, that specific tribe has a different evolutionary history," without prior evidence, **that is the just-so story.** They are changing the theory to fit the data after the fact. That proves your brother's point.
  *   **Valid Defense:** If the EP researcher predicted beforehand that "societies with low social exchange won't show this effect," and then found that result, the theory survives. It's about *prediction* vs. *excuse*.

  **Scenario B: Training fixes the abstract version.**
  *   **Impact:** **Moderate damage.**
  *   **Why:** EP doesn't say we *can't* learn logic. It says we have a *specialized* tool for cheating that works better/faster than our general logic tool. If one hour of training makes general logic just as good as the "cheater" framing, it suggests we don't need a special module; we just need general intelligence + practice.
  *   **The Defense:** EPs would argue that even with training, the "cheater" framing is still faster or more automatic. But if the difference disappears completely, the "module" claim becomes unnecessary.

  **Conclusion on Falsifiability:**
  Your brother says EP "can't be tested." You just proved him wrong. You designed a test in your head! If those results happened, the theory would be in trouble. The problem isn't that EP *can't* be tested; it's that some proponents refuse to accept the test results if they contradict the story.

  ---

  ### Part 4: Your Hypothesis ("Adaptive Then" vs. "Useful Now")
  You guessed: *"The confusion is that 'this trait was useful to our ancestors' and 'this trait is useful / healthy / unavoidable right now' are two totally different claims."*

  *   **Verdict:** This is a valid point, but it's called **Mismatch Theory**, not the "Just-So Story" criticism.
  *   **Distinction:**
      *   **Just-So Criticism:** Attacks the *method*. (How do you *know* it was useful then? Are you just guessing?)
      *   **Mismatch Theory:** Accepts the *method* but warns about *application*. (Okay, it was useful then, but don't tell me I *should* do it now.)
      *   **Example:** Craving sugar.
          *   *EP Claim:* We crave sugar because fruit was rare and high-energy in the Pleistocene. (Adaptive Then).
          *   *Mismatch:* Now sugar is everywhere, so the craving makes us obese. (Not Useful Now).
          *   *Just-So Criticism:* How do you know we didn't just evolve to crave whatever our moms ate? Are you making up a story about fruit to explain diabetes?

  For your paper, you should mention your hypothesis, but clarify that it is a separate issue from the "just-so" scientific validity problem.

  ---

  ### Part 5: How to Structure Your Paper
  Since you can't access papers, lean on logic and the constraints of the field. Here is a roadmap that will show your teacher you understand the nuance:

  **1. Introduction**
  *   Define Evolutionary Psychology briefly (brain as adapted organ).
  *   Define the "Just-So Story" criticism (post-hoc storytelling that lacks falsifiability).
  *   **Thesis:** The "just-so" criticism lands firmly on *lazy* evolutionary psychology, but fails to account for *rigorous* EP that uses cross-cultural data and design specifications to make testable predictions.

  **2. Where the Brother is Right (The Risk)**
  *   Acknowledge that it is easy to invent a survival story for any behavior (e.g., "why do we like music?" -> "social bonding" vs. "sexual selection").
  *   If a theory can explain opposite behaviors (e.g., "men are aggressive to compete" vs. "men are nurturing to protect kin") without specifying *when* each happens, it is unfalsifiable.

  **3. Where the Brother is Wrong (The Caricature)**
  *   **Culture:** Correct the idea that EP ignores culture. Explain "evoked culture" (universal switch that turns on different behaviors in different environments).
  *   **Falsifiability:** Use your Wason Task example. Explain that if cross-cultural studies showed no cheater-detection advantage, the theory would be disproven. Therefore, it *is* testable.

  **4. The "Naturalistic Fallacy" (Your Hypothesis)**
  *   Bring in your idea about "Then vs. Now."
  *   Clarify that EP describes *origins*, not *moral justification*. Just because something evolved doesn't mean it's good now (Mismatch Theory).
  *   Note that confusing these two is a different error than the "just-so" story, but often gets lumped in by critics.

  **5. Conclusion**
  *   The "just-so" label is a necessary warning label for the field. It forces researchers to be rigorous.
  *   However, dismissing the whole field as "unscientific storytelling" ignores the cases where EP successfully predicted phenomena (like the Wason task) that general psychology missed.
  *   Final thought: The field is science only when it risks being wrong.

  ### One Last Tip for the "Pop-Sci" Chapter
  Since you returned the book: The Wason Task experiment you mentioned was likely by **Leda Cosmides and John Tooby**. They are the big names in this. If you mention their names in your paper regarding the cheater-detection module, it will show you paid attention to the specifics, even without the book in front of you.

  Good luck. You're asking the right questions.
