answer: |-
  To construct characters whose self-deception is philosophically robust, you need a principle that distinguishes between *believing falsely* (self-deception), *feeling differently* (emotional regulation), and *acting differently* (role-play).

  Based on your judgments, the unifying principle is not merely "holding contradictory beliefs" (which is logically problematic) but rather **Motivated Doxastic Encapsulation**.

  ### The Principle: Motivated Doxastic Encapsulation

  Self-deception occurs when an agent sustains a belief $P$ despite possessing evidence for $\neg P$, wherein access to $\neg P$ is **motivationallly rendered unavailable** within the active doxastic framework.

  This principle relies on three criteria:
  1.  **Motivation:** The belief serves a psychological need (comfort, identity, safety).
  2.  **Evidence:** The agent possesses (or has possessed) evidence contradicting the belief.
  3.  **Encapsulation:** The contradictory evidence is partitioned off such that it cannot be simultaneously accessed *in the moment of belief endorsement* without external intervention or a shift in cognitive register.

  #### Applying the Principle to Your Cases

  1.  **The Memoirist (SD):** She holds $P$ (Idyllic Childhood). Evidence $\neg P$ (Archives) exists. The *encapsulation* is affective; the nostalgia blocks the archival data from entering the active narrative framework. She cannot access the contradiction "live."
  2.  **The Propagandist (SD):** He holds $P$ (Doctrine). Evidence $\neg P$ (Fabrication Notes) exists. The *encapsulation* is structural; the notes are filed under "Clinical/Professional" and do not bleed into "Personal/Conviction." He is self-deceived because he cannot defend the doctrine *while* acknowledging the notes without switching frameworks.
  3.  **The Tax Preparer (SD):** He holds $P$ ("I am honest"). Evidence $\neg P$ (Unreported Cash) exists. The *encapsulation* is mnemonic; he "forgets" the cash. Unlike the Patient, he is distorting a truth-apt belief about his actions, not just regulating emotion.
  4.  **The Patient (Not SD):** She holds $P$ ("I am terminal"). Evidence supports $P$. She regulates Emotion $E$ (Anxiety). Because her *belief* aligns with evidence, there is no doxastic encapsulation. She is engaging in **emotional coping**, not self-deception. This explains why she feels distinct from the Tax Preparer: the Tax Preparer lies to himself about *facts*; the Patient lies to herself about *feelings*.
  5.  **The Novelist (Not SD):** She holds $P$ (Public Convictions) and $Q$ (Private Convictions). She can switch registers instantly. Because she retains **meta-cognitive custodianship** of the distinction (she *knows* which voice is speaking), the evidence ($Q$) is not encapsulated; it is merely contextually suspended. This is **performed multiplicity** or compartmentalization, not deception. If she *could not* switch instantly, or if she began to forget she had a private journal, she would cross into SD.

  ### Prediction: The Therapist Case

  **Case:** A therapist comes to share her patient's delusion during long-term treatment, knowing the clinical literature but finding it no longer emotionally available.

  **Verdict:** **Self-Deception.**

  **Reasoning:** This case structurally mirrors the **Propagandist**.
  *   **Belief:** The Delusion ($P$).
  *   **Evidence:** Clinical Literature ($\neg P$).
  *   **Mechanism:** The literature is "no longer emotionally available." In philosophical psychology, "emotional availability" often gates doxastic access. If the knowledge exists intellectually but cannot be *felt* or *utilized* to correct the belief, it is encapsulated.
  *   **Distinction from the Patient:** Unlike the terminal patient, the therapist is believing a *falsehood* (the delusion) against *evidence* (the literature). The Patient believes the truth and suppresses fear; the Therapist believes the falsehood and suppresses the truth.
  *   **Narrative Implication:** This is a dangerous form of SD because it is professional burnout masquerading as empathy. The therapist likely feels she is "connecting" rather than "deceiving," which makes the character more compelling. She will defend the delusion sincerely, yet if you showed her the textbook, she would recognize it intellectually but feel it belongs to "another version" of herself.

  ### Philosophical Psychology: Consensus vs. Contested

  To ensure your novel's structure is coherent, you must distinguish between what philosophers generally agree on and what is still fiercely debated.

  #### 1. Well-Established (The "What")
  *   **Motivation is Central:** There is broad consensus that self-deception is not a random cognitive error; it is driven by a desire for a specific outcome (comfort, status, safety).
  *   **Evidence Resistance:** It is agreed that the self-deceived agent resists evidence they would otherwise accept if the motivation were absent.
  *   **Non-Conscious Strategy:** Most contemporary accounts agree the agent does not consciously say, "I will lie to myself." The process is typically sub-intentional.

  #### 2. Genuinely Contested (The "How")
  *   **The Paradox of Contradictory Beliefs:**
      *   *Traditional View (Sartre/Davidson):* SD requires literally believing $P$ and $\neg P$ simultaneously (partitioned minds).
      *   *Deflationary View (Mele/Bach):* SD does **not** require contradictory beliefs. One can simply be biased in gathering evidence. The agent believes $P$ and *avoids* thinking about $\neg P$.
      *   *For your novel:* You do not need to resolve this. Your **Memoirist** fits the Deflationary view (she avoids the archive), while your **Propagandist** fits the Traditional view (he holds both but partitioned). Both are philosophically permissible models of SD.
  *   **Intentionalism:**
      *   *Contested:* Did the agent *intend* to deceive themselves?
      *   *Consensus:* Most modern philosophers reject "literal intention" (you can't intend to believe what you think is false) in favor of "motivated bias."
      *   *For your novel:* Avoid having characters plot their own deception. It should happen to them, not by them.
  *   **The Nature of Partitioning:**
      *   *Contested:* Are mental partitions rigid walls (like the Propagandist) or porous filters (like the Memoirist)?
      *   *For your novel:* This is where your nuance lies. The **Novelist** has rigid partitions (healthy); the **Memoirist** has porous filters (pathological). The **Therapist** represents a rigid partition that has failed (the professional wall cracked, but the emotional wall remained).

  ### Summary for Character Construction

  To maintain coherence:
  1.  **Ensure Evidence Exists:** The character must have access to the truth (archives, notes, cash logs) for it to be SD. If the truth is genuinely unknown, it is mere ignorance.
  2.  **Ensure Motivation Drives the Block:** The inability to access the truth must serve a need (safety, identity, cohesion).
  3.  **Distinguish Belief from Emotion:** If the character knows the truth but doesn't *feel* it (The Patient), that is coping. If they *believe* the falsehood (The Tax Preparer), that is SD.
  4.  **Monitor Meta-Cognition:** If the character knows they are switching masks (The Novelist), they are not self-deceived. If they forget they are wearing a mask, they are.

  Your intuition about the **Tax Preparer** being closer to the **Memoirist** than the **Patient** is correct under the principle of **Motivated Doxastic Encapsulation**. Both distort truth-apt beliefs to protect the self; the Patient protects the self by distorting emotional response to truth.
