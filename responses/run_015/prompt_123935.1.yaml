      *   *Propagandist:* $B$ = Doctrine. Origin = Fabrication. Access to Origin exists (clinical interview) but is compartmentalized. Sincerity in defense. -> SD.
      *   *Novelist:* $B$ = Pseudonym's views. Access to distinction (Private Journal vs. Public Persona) is *intact* and switchable. -> *Not SD* (or at least, distinct from the others). This looks like *akrasia* or *role-playing* rather than SD.
      *   *Patient:* $B$ = Diagnosis (True). Affect = No Anxiety. Reason = "Focused." -> Not SD. Why? Because the *belief* isn't false. She knows she is terminal. She is regulating *emotion*, not belief.
      *   *Tax Preparer:* $B$ = "I am honest." Action = Hiding income. Mechanism = "Forgetting." -> SD. Why? Because the belief about self ("honest") contradicts the evidence of action, and the mechanism is motivated forgetting.

      *   *Key Distinction (Patient vs. Tax Preparer):*
          *   Patient: Belief is accurate (I am sick). Emotion is regulated (No fear). This is coping/defense mechanism, not belief distortion.
          *   Tax Preparer: Belief is inaccurate (I am honest). Evidence is available (cash logs exist/should exist). Mechanism is motivated forgetting. This is belief distortion.
          *   *Hypothesis:* SD requires a distortion of *belief* or *self-conception* regarding truth conditions, not just emotional regulation.

      *   *Key Distinction (Memoirist/Propagandist/Tax Preparer vs. Novelist):*
          *   Memoirist/Propagandist/Tax Preparer: Cannot access the contradictory evidence *in the moment* of assertion without specific external triggers (clinical interview, archival digging). There is a *barrier* to integration.
          *   Novelist: Can switch registers instantly. Knows which voice is speaking. This is *compartmentalization* without *deception*. She knows she is pretending/performing, even if she enjoys the performance.
          *   *Hypothesis:* SD requires a loss of access to the contradictory state *during the act of assertion*. The Novelist retains "first-person custodianship" of the distinction.

  3.  **Formulating the Principle:**
      *   The user suggests "loss of first-person custodianship." This is strong.
      *   Let's refine it: **Motivated Insensitivity to Contradictory Evidence.**
      *   In SD, the agent holds a belief $P$ while possessing (or having access to) evidence for $\neg P$, but the *access* to $\neg P$ is motivationally blocked *in the context of asserting $P$*.
      *   *Memoirist:* Evidence exists, but affective filter blocks it. (Loss of custodianship of the evidence).
      *   *Propagandist:* Evidence exists (notes), but is partitioned. Accessible only clinically, not doxastically. (Loss of custodianship of the origin).
      *   *Tax Preparer:* Evidence exists (cash), but "forgotten." (Loss of custodianship of the action).
      *   *Patient:* No belief distortion. She believes $P$ (Terminal). She just suppresses emotion $E$ (Fear). No loss of custodianship over truth.
      *   *Novelist:* She knows $P$ (Public View) $\neq$ $Q$ (Private View). She controls the switch. She retains custodianship of the distinction.

      *   *Proposed Principle:* **The Principle of Motivated Doxastic Encapsulation.**
      *   Self-deception occurs when an agent sustains a belief $P$ despite possessing evidence for $\neg P$, wherein the access to $\neg P$ is motivationally restricted *within the relevant doxastic framework*, such that the agent cannot simultaneously hold $P$ and acknowledge $\neg P$ without external intervention or framework shifting.
      *   Crucially, this distinguishes SD from *emotional coping* (Patient) and *conscious role-play* (Novelist).

