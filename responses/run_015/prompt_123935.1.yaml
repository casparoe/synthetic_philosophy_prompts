          5.  *Tax Preparer:* Meticulous but "forgets" cash payments, calls self "honest." -> **SD.**
      *   **Task 1:** Identify a unifying principle (e.g., partitioned belief, loss of first-person custodianship) that fits the user's verdicts (especially the tricky distinction between Patient and Tax Preparer).
      *   **Task 2:** Apply this principle to a new case: *Therapist sharing patient's delusion.*
      *   **Task 3:** Distinguish between well-established philosophical psychology and contested areas (specifically regarding contradictory beliefs vs. motivated reasoning).
      *   **Constraint:** Do not present contested accounts as consensus.

  2.  **Deconstruct the Cases & Identify the Pattern:**
