      *   If she *believes* the delusion, she has rejected the lit doxastically, even if she retains the text intellectually. This aligns with the Propagandist. The lit is like the fabrication notes.
      *   So, Therapist = SD.
      *   Make sure to highlight the distinction between *emotional unavailability* (Patient) and *doxastic unavailability* (Therapist/Propagandist). The Patient believes the truth (Terminal). The Therapist believes the falsehood (Delusion). That's the key.

