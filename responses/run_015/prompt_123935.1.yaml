      *   *Case:* Therapist shares patient's delusion. Knows clinical literature (Evidence $\neg P$). Finds literature "no longer emotionally available."
      *   *Analysis:*
          *   Belief: Delusion ($P$).
          *   Evidence: Clinical Lit ($\neg P$).
          *   Access: "No longer emotionally available." This sounds like the Propagandist case. The knowledge exists but is partitioned off from the active belief system.
          *   Is it SD? Yes. The therapist believes the delusion is true (or at least treats it as such) while possessing professional knowledge that it is false, but that knowledge is motivationally blocked ("emotionally unavailable").
