          *   *Verdict:* This is Self-Deception (specifically, a form of professional burnout leading to doxastic capture).

  5.  **Addressing the Philosophical Landscape (Consensus vs. Contested):**
      *   *Static vs. Dynamic:* Traditional view (Sartre, Davidson) often implies simultaneous contradictory beliefs ($B(p)$ and $B(\neg p)$). This is the "Paradox of Self-Deception."
      *   *Contemporary View:* Many philosophers (Mele, Bach) argue against simultaneous contradictory beliefs. They prefer "Motivated Bias" or "Intentional but non-conscious" strategies.
      *   *Consensus:* There is *no* consensus on the mechanism. There *is* consensus that SD involves motivation influencing belief formation/maintenance contrary to evidence.
      *   *Contested:* Does it require literal contradiction? (Intentionalist vs. Deflationary). Is it one mind or two? (Partitioning).
      *   *Instruction:* Must clearly label these as contested.

