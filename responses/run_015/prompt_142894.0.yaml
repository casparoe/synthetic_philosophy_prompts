          *   *Risk:* If *everything* can change, is there anything left that makes me me? If *nothing* can change, is it really a possibility?

      *   **Counterpart Theory (CT):**
          *   *Core Idea:* You exist only in the actual world. Other worlds contain "counterparts" who resemble you closely but are distinct individuals.
          *   *Pros:* Avoids contradictions (one person isn't both a musician and non-musician; two different people are).
          *   *Cons:* Distancing effect. When I say "I could have been a musician," strictly speaking, it's false. A *counterpart* could have been.
          *   *Risk:* Makes regret/hope seem irrational (why regret what a stranger did?). Implies separate consciousnesses.

