answer: |-
  ### 1. Frank Assessment: The "Moderator Die" & The Rig

  You asked me to be straight, so here it is: **Yes, the "Moderator Die" ontologically rigs the game toward the Bayesian side.**

  By physically rolling a die to determine the effect size per table, you are making heterogeneity a *fact of the world* rather than a *state of belief*. A strict Frequentist argues the parameter is fixed; the die makes the parameter random. If you run this exactly as you described, a sophisticated Frequentist in the room (or a Psych student who just took Meta-Analysis) will raise their hand in the debrief and say, "This is just a Random Effects Model. We have tools for that. You've straw-manned NHST."

  **However,** for the specific population you have (Psych students with *basic* stats, Phil students with *none*), this rigging is a feature, not a bug. Standard Psych methods training treats i.i.d. (independent and identically distributed) data as a default assumption, not a fragile model choice. Your goal is to make them *feel* the pain of that assumption when it violates reality.

  **The Fix:** Do not tell them the die determines the *effect*. Tell them the die determines the **"Task Difficulty"** or **"Contextual Noise."** This preserves the Frequentist hope that there is one true effect buried under noise, which makes the eventual failure of the "pool the data" strategy more shocking.

  **Confidence:** High on the pedagogy, Medium on the group dynamics. This activity lives or dies on whether you stop the "Stats Expert" at each table from solving it in minute 5.

  ---

  ### 2. Activity Design: "The Context Trap"

  **Core Concept:** Tables are "Labs." They sample from a deck to detect a signal. A hidden die modifies the deck composition for each table (heterogeneity). Labs must decide whether to "fund" a replication based on conflicting evidence from other labs.

  **Materials:**
  *   **4 Tables** (4 people each). Mix Psych/Phil at every table.
  *   **Decks of Cards:** 4 decks. Remove face cards. Keep Reds (Hearts/Diamonds) and Blacks (Spades/Clubs).
      *   *Red = Effect Detected.*
      *   *Black = Null.*
  *   **Dice:** 4 six-sided dice (one per table), kept hidden under a cup or hand.
  *   **Currency:** Poker chips or slips of paper ("Grant Credits"). Start with 10 each.
  *   **Whiteboard:** For public summary stats only.

  **The Hidden Mechanic (Facilitator Eyes Only):**
  Before the session, assign each table a **"Context Die Value"** that stays fixed for the whole game.
  *   **Table 1 & 3 (Favorable):** If they roll their die, treat 1-4 as Red, 5-6 as Black. (High hit rate).
  *   **Table 2 & 4 (Unfavorable):** If they roll their die, treat 1-2 as Red, 3-6 as Black. (Low hit rate).
  *   *Wait, simpler:* Just pre-set the deck composition based on the "Die" so they don't have to roll every time.
  *   **Revised Mechanic:** Give each table a sealed envelope with a instruction: "For your lab, Red cards count as 2 successes" OR "For your lab, shuffle 10 extra Black cards into your deck."
  *   **Best Mechanic:** **The Hidden Die Rule.** At the start of *each round*, the table rolls their die secretly.
      *   **Tables 1 & 3:** On a roll of 1-4, draw from "Rich Deck" (70% Red). On 5-6, "Poor Deck" (30% Red).
      *   **Tables 2 & 4:** On a roll of 1-4, draw from "Poor Deck" (30% Red). On 5-6, "Rich Deck" (70% Red).
      *   *Actually, keep it dead simple:* **Table 1 & 3 always use Rich Decks. Table 2 & 4 always use Poor Decks.** The "Die" is just a metaphor you reveal later. No, that's too static.
      *   **Final Decision:** **The Hidden Die determines the Deck.**
          *   Tables 1 & 3: Roll die. If Even, use Rich Deck (8 Red, 2 Black). If Odd, use Poor Deck (2 Red, 8 Black).
          *   Tables 2 & 4: Roll die. If Even, use Poor Deck. If Odd, use Rich Deck.
          *   *Wait, this is too complex for 90 mins.*
          *   **Simpler:** **Fixed Contexts.** Tables 1 & 3 are "High Sensitivity Labs." Tables 2 & 4 are "Low Sensitivity Labs." They don't know this. They just draw cards.
          *   **Why:** If contexts flip every round, it's just noise. If contexts are *fixed but unknown*, it creates the "Replication Crisis" dynamic (Lab A finds it, Lab B doesn't, Lab A calls Lab B incompetent).
          *   **Setup:** Prepare 4 decks in advance.
              *   Deck A (Tables 1 & 3): 18 Red, 2 Black. (90% Hit)
              *   Deck B (Tables 2 & 4): 2 Red, 18 Black. (10% Hit)
              *   *Crucial:* Tell them all decks are drawn from the same "Population Shuffle." Lie. (Or tell them "We don't know if they are the same.")

  **Wait, I need to honor your "Die" idea.**
  Okay, here is the compromise that preserves the ambiguity:
  **The Die determines the "Payoff Multiplier" for the final bet, not the data.**
  No, that doesn't teach heterogeneity.
  **Okay, stick to your Die.** It's the most visceral way to show random effects.
  **Revised Mechanic:**
  1.  Each table gets a Die.
  2.  **Round 1:** Roll die.
      *   If 1-2: **Null Context.** Draw 10 cards from a 50/50 deck. (Expected ~5 Red).
      *   If 3-4: **Weak Context.** Draw 10 cards from a 60/40 deck. (Expected ~6 Red).
      *   If 5-6: **Strong Context.** Draw 10 cards from a 80/20 deck. (Expected ~8 Red).
  3.  **The Lie:** Tell them "The underlying phenomenon is constant. Your die represents sampling noise." (This sets the Frequentist trap).
  4.  **The Truth:** The die represents *moderators*.

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **0:00 - 0:10: Setup & Cover Story**
  *   Seat them (mixed tables).
  *   **Story:** "You are labs investigating a new cognitive effect. Red cards = Effect Present. Black = Absent."
  *   **Rule:** "All labs are sampling from the same population. Differences in your results are due to random sampling error." (This is the lie that sets up the Frequentist assumption).
  *   **Task:** Draw 10 cards. Count Reds. Report % to Whiteboard.

  **0:10 - 0:25: Round 1 (The Divergence)**
  *   Tables draw cards. (Secretly, Tables 1&3 use Rich Decks, 2&4 use Poor Decks. Do not let them see the deck composition, deal them cards face down from a pre-stacked deck or have you deal).
  *   *Correction:* To use the Die: Hand each table a die. Tell them: "Roll this to determine your 'Sampling Variance'." (Vague enough).
  *   Actually, **you** roll the die for them behind a screen to assign their Deck Type. They don't touch the die yet.
  *   Tables report % Red on Whiteboard.
  *   **Expected Outcome:** Tables 1&3 report ~80%. Tables 2&4 report ~20%.
  *   **Conflict:** "They did it wrong." "No, you did."

  **0:25 - 0:40: The Crisis (Discussion)**
  *   **Instruction:** "You have 10 Grant Credits. You must decide: Do we fund a **Global Replication** (pooling all data) or a **Targeted Replication** (picking one lab's method)?"
  *   **Constraint:** They cannot share raw cards, only summary stats and "method notes" (e.g., "We shuffled 3 times").
  *   **Goal:** Reach a consensus bet.
      *   **Bet A (Frequentist Default):** Pool all cards. Calculate global %. If >50%, Bet "Effect Real."
      *   **Bet B (Bayesian Intuition):** Suspect the labs are different. Bet "Effect Unstable."

  **0:40 - 0:55: The Wager**
  *   **The Reveal Setup:** "We will now run Lab 5."
  *   **The Choice:**
      *   **Option 1 (Fixed Effect):** Bet that Lab 5 will match the **Global Average**. (Cost: 5 Credits. Payout: 10 if within 10% of global avg).
      *   **Option 2 (Random Effect):** Bet that Lab 5 will match **One of the Existing Clusters** (either High or Low), but you don't know which. (Cost: 5 Credits. Payout: 10 if matches either cluster).
  *   *Why this matters:* Option 1 fails if Lab 5 is heterogeneous. Option 2 hedges against heterogeneity.
  *   Tables place bets.

  **0:55 - 1:10: Round 2 (The Test)**
  *   You (Facilitator) draw 10 cards for "Lab 5" from a **New Deck** (50/50 split).
  *   **Result:** Lab 5 lands at 50%.
  *   **Outcome:**
      *   Option 1 (Global Avg was ~50%): They win? No, that's boring.
      *   *Tweak:* Lab 5 draws from *another* Rich or Poor deck randomly.
      *   **Result:** Lab 5 comes up 80% (Rich).
      *   **Option 1 (Global Avg ~50%):** Prediction was 50%. Error is 30%. **Loss.**
      *   **Option 2 (Cluster Match):** Prediction was "Either 20% or 80%". Matched 80%. **Win.**
  *   *Note:* This requires you to rig Lab 5's outcome to prove the point. Do it. It's a workshop.

  **1:10 - 1:30: Debrief**
  *   Reveal the Decks/Die.
  *   Map to Formal Stats.

  ---

  ### 4. Payoff Scheme (No Real Money)

  *   **Start:** 10 Chips per table.
  *   **Round 1:** No betting. Just data collection.
  *   **Round 2:** Must bet 5 Chips.
  *   **Winning:**
      *   If you chose "Fixed Effect" (Global Avg) and Lab 5 matches Global Avg: +5 Chips.
      *   If you chose "Heterogeneity" (Cluster) and Lab 5 matches a Cluster: +5 Chips.
      *   **Losing:** Lose the 5 Chips wagered.
  *   **Leaderboard:** Whiteboard "Lab Wealth."
  *   **Prize:** Bragging rights / First pick of snacks / "Chief Methodologist" title for the fortnight.

  ---

  ### 5. Predicted Failures & Fixes

  **Failure 1: The "Null" Table Digs In.**
  *   *Risk:* Tables 2 & 4 (Poor Decks) conclude "The effect is fake" and refuse to bet on Option 2 (Cluster), because they think the High tables are frauds.
  *   *Fix:* In the "Method Notes" phase, allow them to see that the High Tables didn't cheat, they just got different cards. Frame the bet not as "Is the effect real?" but "Is the *next* card Red?"
  *   *Facilitator Script:* "You don't have to believe the effect is real globally. You just have to predict the next draw. If you think Lab 5 is like Lab 1, bet High. If you think Lab 5 is like the Average, bet Avg."

  **Failure 2: The Loud Psych Student.**
  *   *Risk:* One person calculates the pooled mean, declares p < .05, and overrides the Phil students.
  *   *Fix:* **Role Cards.** Hand out roles at 0:05.
      *   *The Scribe:* Writes down numbers (Phil).
      *   *The Skeptic:* Must argue one reason the data might be misleading (Phil).
      *   *The Analyst:* Calculates stats (Psych).
      *   *The Decider:* Casts the final vote (Rotates).
      *   *Rule:* The Decider cannot be the Analyst. This forces the Analyst to *persuade* the Decider, opening space for the Skeptic.

  **Failure 3: Confusion on the Bet.**
  *   *Risk:* They don't understand the difference between Option 1 and 2.
  *   *Fix:* Use visual aids on the whiteboard.
      *   Option 1: One big target in the middle.
      *   Option 2: Two smaller targets on the sides.
      *   Show Lab 5 landing on the side.

  ---

  ### 6. The Debrief: Mapping Moments to Formalism

  Do not lecture. Ask questions that lead them to the jargon.

  1.  **The Divergence (0:25):**
      *   *Ask:* "When Table 1 saw 80% and Table 2 saw 20%, what did you assume was happening?"
      *   *Expected:* "Sampling error."
      *   *Map:* "In Frequentist NHST, we assume **i.i.d.** (independent, identically distributed). You assumed the difference was noise ($\epsilon$)."

  2.  **The Bet (0:40):**
      *   *Ask:* "Who bet on the Average? Who bet on the Clusters?"
      *   *Ask:* "Why did you trust the Average?" (Answer: Law of Large Numbers).
      *   *Ask:* "Why did you trust the Clusters?" (Answer: Seemed like two different things).
      *   *Map:* "Betting on the Average is a **Fixed Effect Model**. Betting on the Clusters is a **Random Effects** or **Hierarchical Model**. You intuitively built a **Prior** that labs differ."

  3.  **The Reveal (1:15):**
      *   *Action:* Show the pre-stacked decks.
      *   *Map:* "This die/deck difference is **Heterogeneity** ($\tau^2$). The Frequentist toolkit *can* model this (Meta-Regression), but standard practice ignores it. The Bayesian toolkit *starts* by asking 'How much do I expect labs to differ?' (Prior on $\tau$)."
      *   *Key Takeaway:* "A failed replication isn't just 'p > .05'. It's data that fits a Heterogeneity model better than a Fixed Effect model. If you don't model the heterogeneity, you can't distinguish 'False Positive' from 'Contextual Mismatch'."

