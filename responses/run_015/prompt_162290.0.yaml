  The daily rate is posted on the wall,
  Two hours ache for one cool drink of wine.
  The minor itch is traded off and lost,
  Against the shade where weary heads incline.
  We sum the stubs of bruised and bumped occasions,
  And pay them out in laughter, small and light.
  No grievance here demands harsh estimations,
  The ledger holds the balance clean and bright.
  But then the file marked *Cluster* hits the desk.
  The columns freeze; the pen refuses ink.
  No pile of naps can make the agony less.
  Both columns die; no rates remain to link.
  The ledger sleeps, a mercy that releases,
  Though no clear line divides pain's increases.

  ### What the form is doing

  The threshold arrives precisely at the volta, line 9, disrupting the established rhythm of the ledger. The octave functions as a functioning economic system where iambic meter and rhyme scheme enforce commensurability; every ache finds its rhyme, every cost its credit. Mild pains and small pleasures trade freely within the locked structure of the first eight lines. When the *Cluster* file arrives, the poem does not allow the agony to outweigh the pleasure in a larger sum. Instead, the semantic field of accounting collapses. The columns "die" rather than balance because lexical threshold negative utilitarianism posits an incommensurability, not a disparity of magnitude. If the poem allowed the pain to simply outweigh the pleasure, it would remain classical utilitarianism. By halting the arithmetic entirely in the third quatrain, the form enacts the lexical block: the categories themselves become invalid. The closing couplet reflects the meta-ethical tension: the relief of stopping the calculation versus the arbitrariness of the line drawn at the volta itself. This line exists only by poetic fiat, mirroring the philosophical worry that nature provides no such bright line on the continuum of pain, leaving the clerk to draw a boundary the ledger cannot justify.
