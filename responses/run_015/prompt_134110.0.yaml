prompt: |-
  Theres this pattern in public arguments — and in my grad seminar — where calling someone hypocritical immediately triggers a check on whether you yourself do the same thing. If you share the vice, people say you have no standing to blame; if your record is clean, your blame counts even when youre not the wronged party. Meanwhile in other contexts people treat hypocrisy as just an ad hominem that doesnt cancel the substance of the charge. So whats the implicit philosophy here? Is standing being treated like a moral cleanliness score that gets forfiet by shared guilt? Or is it tied to being specially affected, with hypocrisy just muddying the waters? Reconstruct the theory the practice actually needs, say whether its coherent across both contexts, and tell me what would have to shift if we replaced it with a view where standing depends solely on being wronged or on institutional role, not on personal purity. Keep it under 250 words, ideally one tight paragraph.
