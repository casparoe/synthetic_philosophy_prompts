          *   It applies to *my* future opinions.
          *   It assumes I trust my future self to be rational and better informed (or at least not worse).
          *   It assumes I haven't forgotten evidence.
          *   It assumes the change in belief is due to learning (conditioning) or rational revision, not forgetting, insanity, or external manipulation.
          *   Van Fraassen is an empiricist and constructive empiricist. He is wary of metaphysical commitments (like a substantial self). He prefers pragmatic/functional definitions.
