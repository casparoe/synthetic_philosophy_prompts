  hey, so based on the track record youve described, im pretty confident shes going to mark **strong moral cosmopolitanism as OUT**.

  heres why: look at the pattern on the stuff she rejected. Religious pluralism and gender equality both got cut because she sees them as "modern universalist claims" that dont match the historical reality of the West (which was patriarchal and religiously exclusive for most of its existence). Cosmopolitanism is basically the ultimate universalist claim—it says borders dont matter morally and we owe obligations to everyone equally. thats basically the exact opposite of the "civilizational boundary" shes trying to draw.

  as for the rule shes running, i think there are two competing hypotheses that both fit her verdicts perfectly so far:

  1.  **The "Historical Continuity" Rule:** A value counts as Western only if it was a dominant, operating principle of Western societies for most of the last 500 years. (Liberty/Capitalism = yes. Gender equality/Pluralism = no, those are new).
  2.  **The "Particularist Boundary" Rule:** A value counts as Western only if it distinguishes the West from others, rather than claiming to apply to all humans equally. (Democracy = *our* way of ruling. Cosmopolitanism/Gender Equality = claims about *everyone*, so they dont count as specifically Western).

  the cosmopolitanism case doesnt split these two rules because both rules lead to a "no" verdict. to figure out which one is actually driving her judgments, you need a case that is **historically entrenched** but **universally claimed**.

  the best splitter case i can think of is: **The Duty to Propagate Christianity (Missionary Work).**

  heres how it breaks down:
  *   **Under the Historical Continuity Rule:** She should say **IN**. Evangelism was a core driver of Western expansion and identity for centuries. its definitely in the canon.
  *   **Under the Particularist Boundary Rule:** She should say **OUT**. Like cosmopolitanism, it asserts a moral obligation to all humans regardless of nationality (to save their souls). it erases the boundary between "us" and "them" just like gender equality does.

  if she counts missionary work as a Western value, shes mostly careing about the historical canon. if she rejects it, shes strictly enforcing an anti-universalist boundary. either way, itll tell you wheter shes a historicist or a particularist.

