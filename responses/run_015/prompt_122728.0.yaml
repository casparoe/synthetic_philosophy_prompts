prompt: |-
  I sit on the committee that writes the consultation triggers for a hospital clinical ethics service — the list of circumstances in which a treating team must call an ethics consult rather than decide on its own. A senior member keeps repeating the old proverb "circumstances alter cases" to block any written list: any trigger we could codify, she says, would be either vacuous or wrong (we had been about to write "consult whenever a competent patient insists on leaving against medical advice," and she pointed out that where the patient is leaving over a billing dispute and the clinical question is already settled, a consult adds nothing), so the money should go to training clinicians' judgment instead. I want to take her seriously, but I can't tell how strong a claim she needs.

  Please lay out, as a menu, the distinct theses the proverb could be expressing — from the platitude that a reason can be outweighed by other reasons; through the claim that a feature counting in favor of acting in one case can be no reason at all, or a reason against, in another; through the denial that any true exceptionless moral principle can be finitely stated; up to the claim that moral judgment is a perceptual skill that cannot be codified even as a rough guide — and for each say whether it is plausible, whether it is merely a truism dressed up, and whether it would actually support writing nothing at all. I am also unsure whether the thesis doing the work here is a claim about what makes actions right, about how we ought to decide, or about how moral competence is acquired, and whether those can come apart: could someone grant her the first and still reasonably insist on a list of merely default, overridable triggers, given that our reviewers are junior, rotate frequently, and are expected to be consistent with one another? Which reading is she most likely invoking, and is there a stable middle option — a short list explicitly framed as defaults rather than as rules — that even a defender of the strong readings should accept?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a hospital clinical ethics committee.
      *   **Task:** Writing "consultation triggers" (circumstances requiring an ethics consult).
      *   **Conflict:** A senior member opposes written triggers using the proverb "circumstances alter cases." She argues any codified trigger is either vacuous or wrong. She prefers funding training over codification.
      *   **User's Goal:** Wants to take the senior member seriously but needs to understand the strength of her claim. Needs a "menu" of distinct theses the proverb could express, evaluated for plausibility, triviality, and practical implication (does it support writing *nothing*?).
      *   **Specific Questions:**
          *   Distinguish theses (from weak to strong).
          *   Evaluate plausibility/truism status/practical support for "no list."
          *   Distinguish meta-ethical claims (what makes actions right) vs. epistemic/decision claims (how we decide) vs. pedagogical claims (how competence is acquired).
          *   Can one grant the meta-ethical claim but still insist on default triggers (given junior staff/rotation/consistency needs)?
          *   What is the senior member likely invoking?
          *   Is there a stable middle option (default triggers)?

  2.  **Deconstruct the Proverb ("Circumstances Alter Cases"):**
      *   Literal meaning: Context matters.
      *   Philosophical implications: Particularism vs. Generalism, Rule vs. Case, Codifiability of Ethics.

  3.  **Drafting the "Menu" of Theses (Weak to Strong):**
      *   *Thesis 1: Defeasibility.* Reasons can be outweighed. (Weak, truism).
      *   *Thesis 2: Valence Change.* A feature can be a reason for in Case A, but against in Case B. (Moderate, Particularism).
      *   *Thesis 3: Uncodifiability (Strong).* No finite set of principles covers all cases. (Strong, Anti-theory).
      *   *Thesis 4: Perception/Skill.* Moral judgment is like perception, not rule-following. (Strong, Virtue Ethics/Intuitionism).
      *   *Thesis 5: Institutional Harm.* Codification actively damages judgment (atrophy). (Pragmatic/Epistemic).

  4.  **Evaluating Each Thesis:**
      *   *Plausibility:* Most philosophers accept 1 & 2. 3 & 4 are debated. 5 is empirical.
      *   *Truism?* 1 is definitely a truism. 2 is substantive.
      *   *Support for "No List"?* 1 does *not* support no list (heuristics work). 2 supports caution. 3 & 4 support no *rigid* list. 5 supports training over rules.

  5.  **Addressing the Meta-Ethical/Epistemic/Pedagogical Distinction:**
      *   *Metaphysics (Rightness):* What makes an act right? (Principles vs. Context).
      *   *Epistemology (Decision):* How do we know what to do? (Deduction vs. Judgment).
      *   *Pedagogy (Acquisition):* How do we learn? (Rules vs. Experience).
      *   *Crucial Point:* One can be a particularist about *rightness* (meta-ethics) but a generalist about *decision procedures* (epistemology/policy). Junior staff need guardrails even if the guards aren't metaphysically ultimate.

  6.  **Analyzing the Senior Member's Position:**
      *   She is likely conflating the metaphysical claim (no exceptionless rules) with the procedural claim (therefore, write no rules).
      *   She is also leaning on the pedagogical claim (training is better than rules).
      *   Her example (AMA vs. Billing) shows she understands *defeasibility* (Thesis 1), but she jumps to the conclusion that *no rule* is better.

  7.  **Developing the "Middle Option" (Default Triggers):**
      *   Can a defender of strong particularism accept default triggers? Yes, if framed as *heuristics* or *presumptions* rather than *algorithms*.
      *   Analogy: "Stop at red lights" (Rule) vs. "Slow down at intersections" (Heuristic). Or better: Clinical pathways (guidelines, not mandates).
      *   The "Rebuttable Presumption" model.
      *   Addressing the institutional needs: Consistency, Junior staff protection, Liability/Risk management.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate the tension.
      *   **Part 1: The Menu of Theses.** (Table or List format for clarity).
          *   Name, Content, Plausibility, Truism?, Supports "No List"?
      *   **Part 2: Distinguishing the Domains.** (Metaphysics, Epistemology, Pedagogy). Explain how they come apart.
      *   **Part 3: Diagnosing the Senior Member.** What is she actually saying? (Likely a mix of Particularism and Pedagogical worry).
      *   **Part 4: The Stable Middle.** The "Rebuttable Presumption" model. How to draft the triggers to satisfy her concerns while meeting institutional needs.
      *   **Conclusion:** Final advice on negotiation.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get too bogged down in academic jargon (Dancy, Kant, etc.) unless it clarifies. Keep it practical for a hospital committee.
      *   *Emphasis:* Highlight the "Junior Staff/Rotation" constraint. This is the strongest argument *against* the senior member's "training only" approach. Training takes time; rotation is fast.
      *   *Nuance:* The senior member's example (AMA/Billing) is actually an argument for *better* triggers, not *no* triggers. (e.g., "AMA *due to clinical disagreement*"). I should point this out.

  10. **Final Review against User Prompt:**
