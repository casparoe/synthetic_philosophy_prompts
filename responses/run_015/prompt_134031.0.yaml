answer: |-
  ### The Scenario
  The Blackwood Mill in the valley closed despite a wage concession offered Tuesday. Workers struck Wednesday. A covering-law explanation cites the principle that under severe liquidity crises, concessions after trust erosion are statistically irrelevant to strike probability, predicting the closure. However, workers' diaries reveal they struck not due to economics, but because the manager signed the concession *after* speaking privately with the owner, interpreted as a signal the owner intended to close anyway. This specific order transformed a negotiation into a declaration of war. The strike was a reaction to this specific sequence: offer, private meeting, signature, strike. Without this sequence, the strike remains inexplicable to the participants themselves. The economic law predicts the stoppage; the narrative explains the betrayal.

  ### The Covering-Law Verdict
  For the Hempelian archivist, the explanation is complete once the event is subsumed under a universal generalization. Here, the law states: "When liquidity falls below threshold X and prior trust is damaged, concessions fail to prevent stoppages." Given the mill's balance sheets and prior disputes, the strike was nomologically expected. The model verdict is positive: the event is explained because it was predictable based on antecedent conditions and a valid law. Specific timing is irrelevant noise unless altering initial conditions. The question of why *this* particular sequence of betrayals mattered is dismissed as psychological detail; the structural economic pressure suffices. The law absorbs the particular into the general without residue. It succeeds because it supports counterfactuals: had liquidity been higher, the strike would not have occurred, regardless of the manager signature order.

  ### The Narrative Verdict
  Conversely, the narrative theorist argues the economic law explains a *type* of event, but not *this* event. The explanation lies in configuring the actions into a plot: the concession was the beginning, the private meeting the complication, and the signature the reversal that transformed hope into certainty of closure. This configuration provides retrospective closure, making the strike intelligible as a moral response rather than a mechanical reaction. It answers the participants' question: why did we strike *then*? Because the signature finalized the betrayal. This account cannot support counterfactuals; we cannot know if a different signature order would have prevented the strike without retelling the whole story. It contains no statistical regularity, only the internal coherence of the agents' changing interpretations. The event is explained only when the story makes sense. For Mink, historical understanding is a cognitive grasp of the whole. The law misses the temporal texture of human decision.

  ### The Isolating Feature and Its Excision
  The crucial structural feature is the agent's later reinterpretation of an earlier commitment based on intervening information. This feature anchors the event in human temporality rather than physical time. The law cannot capture this shift in significance. The workers reinterpreted the Tuesday offer upon learning of the private meeting. If this feature is excised—if the workers never learned of the meeting or did not reinterpret the offer—the narrative collapses. The strike becomes mere economic reflex, indistinguishable from any other liquidity-driven stoppage. Excising it reduces the agents to automatons responding to stimuli. The narrative explanation vanishes because the plot loses its turning point; there is no betrayal, only hardship. Simultaneously, the covering-law explanation remains unchanged. The economic conditions still predict the strike. This divergence proves the narrative explains the *meaning* of the action, while the law explains the *occurrence*. Without the reinterpretation, the narrative verdict fails, while the covering-law verdict stands firm.

  ### The Covering-Law Counterattack
  A defender of the covering-law model attacks this narrative account as mere redescription. They argue citing workers' interpretation simply restates initial conditions in psychological terms. To say "they struck because they felt betrayed" is merely to report their belief state. Unless a general law links "perceived betrayal via signature order" to "striking," the narrative offers no predictive power. It describes *what* happened sequentially but fails to establish *why* it had to happen. The story is a heuristic device, not a logical derivation. Therefore, the narrative provides understanding, but not scientific explanation. It collapses particularity into a vague story without nomic necessity.

  ### Bottom Line
  Laws predict the strike's occurrence, but only narrative explains its significance. The divergence lies in whether explanation requires subsumption under law or configuration into a plot. Both are valid, but for different questions: one asks "what happened," the other "what did it mean." The archivist must choose which truth matters most.
