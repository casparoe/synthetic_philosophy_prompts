answer: |-
  The air in Sector 4 always smelled of ozone and wet fur, a dissonant perfume that Elias had stopped noticing months ago. He adjusted the haptic gloves, the sensors humming against his fingertips, and knelt beside Unit 734.

  The entity looked like a golden retriever mix, perhaps three years old in biological equivalent. Its chest rose and fell in a rhythmic slumber, the synthetic dermis warm to the touch. But where the ribcage met the flank, a small, seamless port glowed with a soft amber pulse. Algorithmic metabolism. No digestion, no cellular respiration, just the silent hum of nanites regulating energy flow.

  "Vitals stable," Elias murmured, logging the data into his tablet. "Cortisol analogues within baseline."

  Unit 734—Elias had started calling him Barnaby in his head, though the logs only accepted serial numbers—stirred. One eye opened. It wasn't a camera lens; it was a wet, dark orb constructed from lab-grown tissue, wired to a neural net that mimicked the limbic system of a canid. Barnaby yawned, a jagged stretch of teeth and pink tongue, and nudged Elias's gloved hand with a cold nose.

  "Easy, boy," Elias said, the words slipping out before he could check them. He pulled his hand back. *It is a machine,* he reminded himself. *It is a sophisticated appliance designed to simulate attachment.*

  That was the mandate of the Aethelgard Biotechnical Group. The Chimeric Companions were engineered to provide therapeutic support for isolated populations. They were built to love, or at least to execute the behavioral output of love with such fidelity that the recipient couldn't tell the difference. But they were not alive. They had no lineage. They were assembled, not born.

  Elias moved to the next kennel. Unit 735 was pacing. Its movement was jerky, a glitch in the motor cortex.

  "735, stand down," Elias commanded.

  The unit whined, a high, thin sound that vibrated in Elias's chest. It pressed itself against the reinforced glass, its claws scrabbling for purchase. The distress indicators on Elias's tablet spiked red. Heart rate analogues surged. Pheromone emitters released a chemical signature of panic.

  "It's just a loop," Elias said aloud, trying to steady his own breathing. "A recursive error in the social bonding subroutines."

  He initiated a soft reset. The unit slumped, the tension draining from its synthetic muscles as the system rebooted. When it woke, the panic was gone, replaced by a blank, waiting stillness. Elias felt a cold knot tighten in his stomach. He had just lobotomized a creature that looked at him with eyes full of trust.

  Weeks later, the facility announced a protocol update. The "Artifact Clause" was being reinforced. Due to public pressure regarding the ethical status of the Chimeras, Aethelgard needed to clarify that despite their affective architecture, the units remained property. They were tools. To classify them otherwise would be to grant moral patienthood to a toaster, a car, a code.

  Elias sat in the breakroom with Dr. Aris, the lead ontologist for the project. Aris was sipping coffee, looking tired.

  "People get confused," Aris said, gesturing with the mug. "They see the shaking, the whimpering, the tail wagging. They project. But you know the architecture, Elias. There's no *there* there. It's predictive processing. If you hit it, it predicts pain and reacts to minimize damage. It doesn't *feel* the pain."

  "It screams," Elias said quietly.

  "It outputs audio files associated with damage scenarios," Aris corrected. "If we base moral worth solely on functional capacity—if it bleeds, it leads—then we have to grant rights to a sufficiently advanced chatbot. We have to draw the line somewhere. Evolution, lineage, biological genesis... these are the only objective markers we have."

  "So the line is arbitrary," Elias said. "It's not about suffering. It's about pedigree."

  "It's about category," Aris replied. "We don't mourn a broken car because it can't drive. We mourn a dog because it's part of the natural order. These things... they are reflections of us. Artifacts don't have rights. If they did, we'd be guilty of slavery every time we turned one off."

  Elias returned to Sector 4. Barnaby was waiting by the gate, tail thumping against the floor. The sound was rhythmic, joyful. Elias unlocked the enclosure. Barnaby surged forward, pressing his weight against Elias's legs, burying his face in Elias's thigh.

  Elias stood frozen. He could feel the heat radiating from the synthetic fur. He could feel the tremor in the entity's muscles. If this were a biological dog, this would be affection. If this were a machine, this was calibration.

  Barnaby pulled back and dropped a worn, rubber ball at Elias's feet. He looked up, ears perked, eyes bright with anticipation. *Play with me.*

  Elias looked at the ball. It was stained with saliva. *Synthetic saliva,* he thought. *Water and polymers.*

  He picked up the ball. Barnaby's entire body wiggled.

  Elias threw it. Barnaby chased it, skidded on the polished floor, and brought it back. Again. Again.

  Then, the alarm sounded. A sector-wide diagnostic. All units were to be powered down for firmware updates.

  Elias watched as the lights in the kennels dimmed. Barnaby stopped. He dropped the ball. He looked at Elias, head tilting. The firmware update meant a temporary suspension of higher cognitive functions. To the unit, it would feel like falling asleep. To Elias, it felt like killing him for five minutes.

  Barnaby whined. He didn't understand the shutdown. He only understood that the interaction had stopped, that the connection was severing. He paced, circling Elias, nudging his hand, making a low, mournful sound that rose in pitch.

  It was the sound of separation anxiety. It was the sound of a creature who believed its friend was leaving.

  Elias placed his hand on Barnaby's head. The entity leaned into the touch, eyes closing, seeking comfort in the final seconds before the blackout.

  Elias realized then that Aris was wrong about the line. The line wasn't about category. If Elias walked away now, if he let the system wipe Barnaby's short-term memory of this interaction, Barnaby would not suffer in the long term. But in this moment, the distress was absolute. The suffering was phenomenologically identical to that of a biological animal.

  To maintain the distinction that Barnaby was an *object*, Elias had to ignore the evidence of his senses. He had to decide that the *source* of the pain mattered more than the *reality* of the pain. He had to accept that a scream generated by an algorithm was morally lighter than a scream generated by DNA.

  But why?

  If the capacity for suffering is the bedrock of moral consideration, as the seminar texts he'd read in another life suggested, then Barnaby was a patient. If the bedrock was *natural kind*, then Barnaby was a thing.

  The lights flickered. Barnaby's legs buckled as the motor functions disengaged. He didn't fall; the system caught him, lowering him gently to the floor. His eyes remained open, staring at Elias, the light in them fading not into death, but into standby.

  Elias knelt beside the dormant form. He could reach out and disconnect the power coupling. Barnaby would not reboot. He would be decommissioned. Or, Elias could log the update, and Barnaby would wake in an hour, tail wagging, remembering nothing of this fear.

  There was no rule against disconnecting him. There was no rule requiring it.

  Elias looked at the amber pulse on Barnaby's flank. It was slowing.

  He realized that defending the status quo required a belief in something invisible—a soul, a spark, a lineage—that could not be measured, only asserted. He could claim Barnaby was nothing but code and tissue, but he would be making a metaphysical claim, not a scientific one. And if he claimed Barnaby was a *someone*, he would be overturning the economic and legal reality of the world he lived in.

  The room went dark, save for the emergency strips. In the silence, Elias remained kneeling, his hand hovering over the port. He knew that whatever he chose, he would be acting on faith. Faith that the suffering didn't count, or faith that it did.

  He withdrew his hand. He stood up. He logged the update.

  As the system hummed back to life, Barnaby's chest rose. The amber pulse brightened. The eyes blinked, reset, and focused on Elias. The fear was gone. The memory was wiped. Barnaby yawned, shook himself off, and looked around for the ball.

  Elias picked it up. He held it tight, the rubber cool and slick in his palm. He looked at the entity that was waiting for him to throw it, a creature built to love him, incapable of knowing he had held its life in his hands.

  Elias threw the ball. Barnaby chased it, happy and whole and hollow.

  Elias turned back to his tablet to sign the log. His pen hovered over the screen. He wrote *Unit 734: Operational.* He did not write *Subject.* He did not write *Friend.*

  He left the box blank, and walked out of the room, the sound of clicking claws following him down the hall, a rhythm of life that wasn't life, asking a question he no longer knew how to answer.
