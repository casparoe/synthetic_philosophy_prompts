answer: |-
  This is a remarkably precise dissection of a dilemma that usually generates far more heat than light. You have correctly identified that the standard appeals to "identity" and "welfare" are doing no work here because you have already stipulated them away. You are left with the hard residue of the problem.

  Here is the diagnosis of your stalemate, the identification of the formulation doing illegitimate work, and a proposal for what progress would look like.

  ### 1. The Diagnosis: A Clash of Normative Frameworks, Not Identity

  Your hypothesis is largely correct: this is a fight about what sort of thing autonomy is. But it is more specific than that. It is a conflict between **Autonomy as Integrity** (your view) and **Autonomy as Protection** (your friend's view), compounded by a disagreement about the **moral status of the demented subject**.

  **Your View (Autonomy as Integrity):**
  You are operating with a Dworkinian conception of precedent autonomy. On this view, a life is a narrative whole. The competent self has the normative power to author the ending of that narrative to ensure the life makes sense *as a whole*. The authority of the advance directive (AD) derives from the right to shape one's biography. The current demented patient is a "survivor" of that life, but not a new owner of it. Her contentment is an *experiential interest*, which is trumped by the *critical interest* of the life's integrity established by the competent self.

  **Your Friend's View (Autonomy as Protection):**
  Your friend, likely influenced by the clinical reality of dementia care (and philosophers like Rebecca Dresser), views autonomy as a protective shield for a subject's welfare. An AD is a proxy—a piece of high-quality evidence about what the patient would want. However, if the proxy conflicts with the observable welfare of the *current* subject (who is content, eating with pleasure), the shield becomes a sword. For her, the "person" who signed the directive and the "patient" in the bed are sufficiently discontinuous (despite your shared reductionism) that the current patient's welfare gains independent moral weight. She prioritizes *beneficence* toward the present subject over *fidelity* to the past author.

  **Why the Jehovah's Witness (JW) Case Didn't Break the Stalemate:**
  You both agreed the lucid 60-year-old JW wins. Why? Because **competence** is the trump card for *both* of you.
  *   **You:** A competent self always has the power to rewrite the narrative.
  *   **Her:** A competent self is the only entity that *has* autonomy rights to begin with.
  The disagreement only emerges when the current self is *incompetent*. You believe the past competent self's authority persists through incompetence. She believes that once competence vanishes, the "autonomy" game ends, and the "best interest" game begins.

  ### 2. The Illegitimate Formulation

  You wrote: *"We both accept the reductionist account of personal identity... we agree that on that account she is continuous with the woman who signed."*

  **This is the formulation doing illegitimate work.**

  If you truly accept a Parfitian reductionist account, you cannot treat continuity as a binary switch (continuous/not continuous). It is a matter of degree.
  *   In the **JW case**, psychological connectedness is high.
  *   In your **Revocation hypothetical** (moderate dementia), connectedness is moderate.
  *   In the **Current Mother case** (severe dementia, no recognition), connectedness is low.

  Your friend is likely weighting the moral authority of the past self *proportionally* to the degree of psychological connectedness. As the mother fades, the past self's authority weakens, and the current subject's welfare strengthens.
  You, however, are treating the authority of the past self as **binary and non-decaying**. You view the directive as a sovereign act that binds the "life," regardless of the fading of the "person."

  The stalemate exists because you are arguing from **Narrative Unity** (the life is one thing), while she is arguing from **Psychological Connectedness** (the selves are fading into different things). You both say "reductionist," but you are applying it differently. She applies it to the *weight* of the claim; you apply it only to the *existence* of the claim.

  ### 3. The Empirical/Institutional Shadow

  You asked if a disguised empirical question is doing the work. **Yes.**

  Your friend is a geriatric psychiatrist. She knows that "apparently content" is a clinical minefield. She knows that families often project suffering onto demented patients, but she also knows that clinicians often project *quality of life* judgments onto patients who are simply habituated to their state.
  *   **Her Fear:** Honoring the AD leads to the death of a patient who is, in her current mode of being, enjoying life. This feels like killing a happy being based on the testimony of a ghost.
  *   **Your Fear:** Ignoring the AD turns your mother into a vessel for biological existence, violating the dignity of the woman she was. This feels like desecrating a life based on the instincts of a remnant.

  There is also an institutional risk calculation. If clinicians treat ADs as absolute (your view), they risk undertreating content patients (legal/ethical liability for negligence toward the present body). If they treat ADs as advisory (her view), they risk overtreating patients who would have chosen death (legal/ethical liability for battery/violation of rights). Her position is the "safer" clinical default; yours is the "purer" ethical stance.

  ### 4. What Counts as Progress?

  You will not argue each other into submission because you are prioritizing different moral goods (Integrity vs. Welfare). Progress requires mapping the boundary where one good yields to the other.

  **A. Refine the Revocation Hypothetical**
  You said of the moderate dementia revocation: *"I want to say it governs too, but not because it is later — and I could not say, to her satisfaction, what the difference was."*
  The difference is **Capacity**, not Time.
  *   If the moderate-dementia mother has *capacity* to revoke, you must honor it because she is currently an autonomous agent.
  *   If she lacks capacity, the revocation is invalid, and the original AD stands.
  *   **Progress:** Agree that the *only* thing that can override a prior AD is a *currently competent* self. Since your mother is not currently competent, the revocation condition is not met. The fight then returns to: *Does the prior AD bind an incompetent, content successor?*

  **B. Distinguish "Critical" vs. "Experiential" Interests**
  Make this distinction explicit.
  *   **Experiential:** What feels good now (eating, warmth, lack of pain).
  *   **Critical:** What makes the life good as a whole (dignity, not being a burden, consistency with values).
  *   **Progress:** Ask your friend: *"Do you acknowledge that my mother has critical interests that are being violated, even if her experiential interests are met?"* If she says "No, critical interests die with competence," you have found the bedrock disagreement. If she says "Yes, but welfare trumps," you have moved to a utilitarian calculus.

  **C. The "Slippery Slope" Test**
  Address the empirical fear.
  *   **Proposal:** "If we could guarantee that honoring the directive would not cause suffering (e.g., palliative sedation is used if distress arises during withdrawal), would your objection hold?"
  *   If she says "Yes, because keeping her alive is still better," then it is a value clash about the sanctity of biological life vs. biographical life.
  *   If she says "No, then I might agree," then her resistance was indeed empirical/clinical risk management, not pure ethics.

  ### Summary

  The dispute is not verbal, but it is **categorical**. You are treating the Advance Directive as a **Will** (a disposition of property/rights that takes effect upon incapacity). Your friend is treating it as **Testimony** (evidence of what the patient might want, subject to cross-examination by current reality).

  **To move forward:**
  Stop arguing about identity. You have agreed on the metaphysics; you disagree on the *moral implications* of those metaphysics.
  1.  Concede that if your mother were *currently competent*, her current wish would win (this aligns you with the JW case).
  2.  Insist that since she is *incompetent*, the only valid authority is the last competent self (the 65-year-old).
  3.  Ask your friend to explicitly defend the claim that **a demented patient's current contentment creates a moral obligation to keep them alive that overrides their own prior competent refusal.**

  That is the crux. She must argue that the "new" person in the body has rights that the "old" person could not extinguish. You argue the "old" person owned the body and the life, and sold it with a restriction that cannot be undone by the tenant who remains.

  Neither of you is wrong; you are serving two different masters. You serve the **Author** of the life. She serves the **Inhabitant** of the body. In severe dementia, the Author is gone, and the Inhabitant cannot speak. You are listening to the Author's manuscript; she is watching the Inhabitant's face. Progress lies in admitting that these two sources of moral data can conflict, and deciding, as a family and care team, which source gets the veto.
