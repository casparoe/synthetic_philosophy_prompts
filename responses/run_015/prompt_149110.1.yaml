          *   Preface $\rightarrow$ SLO aggregation + Post-mortem anticipation.
      *   **Wrinkle 1 (Correlation):** Map to shared dependencies/blast radius. Acknowledge engineering handles this better than the abstract paradox.
      *   **Wrinkle 2 (Meta-Assertion):** Map to Shadow vs. Blocking. Explain why a blocking meta-assertion breaks CI (deadlock), whereas in philosophy it's "humility."
      *   **Wrinkle 3 (Stakes):** Map to SLO tiers. Confirm this is a strong match (Pragmatic Encroachment).
