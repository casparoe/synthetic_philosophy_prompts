          *   Missing counterparts (The *normative* force of "Rationality").
      *   **Verdict:** Take a stand. It's mostly arithmetic confusion, but the "Preface" highlights a gap in how we document *known unknowns*.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "Closure Principle"? Need to if I use it. Better to avoid it and describe it ("if you believe A and B, you must believe A and B").
