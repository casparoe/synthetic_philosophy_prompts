      *   *Why:* It isolates the *information* aspect. The classic demon feels like a sorting problem (engineering). The Szilard engine makes it about *knowing* where the particle is. For a lawyer, "evidence/knowledge" is a stronger metaphor than "sorting fast/slow." It simplifies the "work" to a single bit of information. It fits the "cross-examination" theme (asking a yes/no question).

  5.  **Address Question 3: Ruth's Misconceptions & Timing:**
      *   *Misconception 1 (Engineering):* "Just build a better door/sensor." (Early).
      *   *Misconception 2 (Quantum/Observer):* "Looking at it changes it." (Middle). This is the big pop-sci confusion.
      *   *Misconception 3 (Perpetual Motion):* "So it's free energy?" (Late).
      *   *Timing:*
          *   Engineering objection comes when the mechanism is described.
