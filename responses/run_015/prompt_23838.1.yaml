  8.  **Drafting the Plan (Iterative refinement):**
      *   *Structure:* Setup -> The Hook (The Demon) -> The Objections -> The Turn -> The Resolution.
      *   *Tone:* Keep it sharp. Ruth is cross-examining. Elena is testifying but also teaching.
