  4.  **Address Question 2: Two-Chamber vs. Szilard Engine:**
      *   *Two-Chamber (Classic):* Gas box, partition, hole, demon opens/closes door. Good for visualization, bad for precision. Hard to quantify "information."
      *   *Szilard Engine:* Single molecule, piston, measurement. Much tighter link between *measurement* and *work*.
