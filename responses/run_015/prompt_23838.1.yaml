  11. **Final Review of "Load Bearing":** The cooling food is good, but a **deck of cards** is more interactive for a lawyer. Wait, the prompt asks "What has to already be sitting on the table... I'm assuming something about entropy." I will recommend the **cooling meal** as the background entropy clock, but Elena should physically use a **salt shaker and pepper shaker** to model the chambers. It's domestic and immediate.

