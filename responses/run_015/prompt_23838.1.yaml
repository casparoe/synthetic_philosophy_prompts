      *   *The Tension:* Why are they tense? Likely personal history, control issues, Ruth feeling judged, Elena feeling retired/irrelevant. The physics argument mirrors the personal one.

  3.  **Address Question 1: The Table Setup (Load-bearing vs. Atmosphere):**
