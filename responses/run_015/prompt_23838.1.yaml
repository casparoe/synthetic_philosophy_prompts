prompt: |-
  Ok, I need help with a scene I keep chickening out of writing. In my novel, Elena -- a retired statistical mechanics professor -- ends up explaining Maxwell's demon to her daughter Ruth over a long, slightly tense dinner. Ruth's a divorce lawyer, sharp, hasn't touched physics since high school, and has a habit of cross-examining her mother thats more old muscle memory than real hostility. I don't want you to write the explanation itself, I want the plan underneath it that I'll improvise the actual dialogue from.

  What has to already be sitting on the table before the demon even comes up -- I'm assuming something about entropy and the second law, but tell me what's actually load-bearing here versus what's just atmosphere. What's the one concrete setup Elena should build the whole scene around -- and here's my real question -- should that be the classic two-chambers-and-a-trapdoor demon, or the single-molecule Szilard engine version, and why one over the other as the thing to hang an hour of dinner table argument on. The misconceptions Ruth will reach for, roughly in the order she'll reach for them -- I'd guess something like "it just needs better eyes, that's engineering not physics" and something that quietly conflates this with the observer effect from quantum mechanics -- but tell me what's actually predictable here and exactly where in the conversation Elena should head off each one. Give me a line Ruth could say near the end that would tell me, the author, shes actually landed on the real resolution -- something about the demon having to erase its own memory, if I'm remembering that right -- rather than just gone quiet to end the fight. And tell me what Elena should visibly wave off even when Ruth pushes for it at the table -- the true stuff that would kill the scene if she tried to derive it out loud.
reasoning: |-
