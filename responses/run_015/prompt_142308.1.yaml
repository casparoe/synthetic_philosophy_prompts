answer: |-
  # Thesis Defense Q&A Prep Sheet: The Calibration Gap

  ## 1. Opening Concessions (First 2 Minutes)
  *Do not wait for these to be raised. State them in your conclusion or intro to the Q&A to disarm the "you didn't consider X" attacks.*

  *   **On Selection Bias:** "I want to be clear that the hierarchical model is fitted to *published* original estimates. It does not correct for the publication filter itself. The 'predicted rate' is the rate we should expect *given* the literature as it exists, biases included. The gap tells us if the literature is consistent with its own internal logic, not if it is unbiased."
  *   **On Measurement:** "This metric treats all variance as sampling error or effect size heterogeneity. It does not disentangle construct validity changes between original and replication. A large gap could mean artifacts, or it could mean the replication measure was worse."
  *   **On Causality:** "The calibration gap is a diagnostic statistic, not a causal estimator. It flags inconsistency; it does not identify the mechanism (power vs. fraud vs. context) without further covariates."

  ---

  ## 2. The Objections (Ordered by Damage Potential)

  ### 1. The "Garbage In" Objection (Biostatistician)
  **The Objection:** "You fit your hierarchical model to the original effect sizes. But those sizes are conditioned on $p < .05$. Your 'predicted replication rate' is therefore derived from winner's-cursed estimates. If you don't explicitly model the selection function in the first stage, your prediction is inflated by design. Isn't the 'gap' just the mathematical residue of the publication bias you didn't correct for?"
  *   **Reply:** "That's why I use the replication $n$, not the original $n$, for the prediction step. The model estimates the underlying $\tau$ and $\mu$ from the originals, then simulates power at $2.5x$ sample size. If the effect were purely noise, the hierarchical shrinkage should pull the prediction toward null. The gap persists even when shrinkage is aggressive."
  *   **Soft Spot:** This relies on the hierarchical prior being strong enough to overcome the selection bias in the training data. If the number of originals is small ($k < 50$), the hyperparameters will track the biased mean.
  *   **Falsifier/Drop Decision:** **DROP FRAMING.** If you run a selection-model adjustment (e.g., Vevea & Hedges weight function) on the originals and the predicted replication rate drops by $>10\%$, your unadjusted gap is just measuring publication bias, not calibration.

  ### 2. The "Construct Drift" Objection (Social Psychologist)
  **The Objection:** "You treat replication failure as statistical noise or artifact. But in social psych, failure is often measurement drift. If the original used a specific priming task and the replication used a standard scale, the effect size *should* drop. Your model interprets this as a 'calibration gap' (evidence of artifacts), when it's actually evidence of boundary conditions."
  *   **Reply:** "Agreed, which is why I argue the gap is a signal for *investigation*, not a verdict. A large gap flags that the literature is fragile to methodological variation. That fragility is the phenomenon of interest, regardless of whether it's caused by fraud or context-sensitivity."
  *   **Soft Spot:** You claim the gap distinguishes 'underpowered' from 'artifact'. If measurement drift causes the gap, you cannot make that distinction.
  *   **Falsifier/Drop Decision:** **WEAKEN.** If you can show a subset of 'direct' replications (same materials) has a near-zero gap while 'conceptual' replications has a large gap, you must concede the gap measures methodological consistency, not just statistical truth.

  ### 3. The "Causal Vacuum" Objection (Philosopher of Science)
  **The Objection:** "You call it a 'gap' and imply it measures the distance from truth. But statistically, it's just a residual. What causal structure does this residual map onto? If I intervene to increase power, does the gap close? If not, it's not a measure of power. If it doesn't map to a causal mechanism, it's just a description of inconsistency."
  *   **Reply:** "It's not intended as a causal parameter like an ATE. It's an evidential weight. It tells us how much surprise the replication data should generate given the original data. High surprise warrants theory revision; low surprise warrants power reform."
  *   **Soft Spot:** You claim in the second half that this resolves prior disagreements. If it's just a residual, skeptics will say the residual *is* the prior disagreement.
  *   **Falsifier/Drop Decision:** **WEAKEN.** If the gap does not predict *future* replication success (out-of-sample) better than a simple power calculation, abandon the 'calibration' language. It's just a fit statistic.

  ### 4. The "False Positive Assumption" Objection (Biostatistician / Econ)
  **The Objection:** "Your model assumes a distribution of true effects. But if 50% of the originals are false positives (true effect = 0), your hierarchical model will still estimate a non-zero mean and variance. You're predicting replication success for effects that don't exist. The gap isn't 'calibration'; it's the false discovery rate masquerading as a continuous variable."
  *   **Reply:** "The hierarchical model allows the mean to shrink. If half are zero, the estimated $\mu$ should be small, and the predicted rate should reflect that. The gap is the *excess* failure beyond what that mixture predicts."
  *   **Soft Spot:** Standard normal-normal hierarchical models don't handle point-masses at zero well. You need a spike-and-slab prior to actually capture false positives.
  *   **Falsifier/Drop Decision:** **DROP FRAMING.** If a spike-and-slab model reduces the predicted replication rate to match the observed rate, your continuous model is fundamentally misspecified for this literature.

  ### 5. The "Prior Robustness" Objection (Biostatistician / Bayes Skeptic)
  **The Objection:** "You claim this is 'prior-robust' because the prior is integrated over. But the hyperpriors on $\tau$ and $\mu$ are still chosen by you. In low-information settings, the data doesn't swamp the hyperprior. Isn't the gap just sensitive to how skeptical you allow the hierarchical model to be?"
  *   **Reply:** "I used weakly informative half-Cauchy priors on the variance. I show in the appendix that varying the scale doesn't change the gap classification (high vs. low) for the simulated data."
  *   **Soft Spot:** Simulated data where you control the truth. Real data with $k=20$ might be hyperprior-sensitive.
  *   **Falsifier/Drop Decision:** **WEAKEN.** If a prior sensitivity analysis shows the gap flips sign (positive to negative) under reasonable hyperprior specifications, you cannot claim robustness.

  ### 6. The "Why Not Selection Models?" Objection (Methodologist / Econ)
  **The Objection:** "We already have tools for this: p-curve, selection models, funnel plots. They explicitly estimate the file drawer. Your method implicitly assumes the published literature is the population. Why should we adopt a new metric that ignores selection bias rather than fixing it?"
  *   **Reply:** "Selection models estimate the *unbiased* effect. I'm estimating the *expected* replication rate of the *biased* literature. Policymakers need to know: 'If we replicate what's published, what happens?' not 'What is the truth?'"
  *   **Soft Spot:** This is a pragmatic defense, not a statistical one. It limits the utility of your chapter to policy, not truth-seeking.
  *   **Falsifier/Drop Decision:** **WEAKEN.** If selection models predict the observed replication rate better than your model does (lower RMSE), your method is inferior for prediction.

  ### 7. The "Simulation Rigging" Objection (Department General)
  **The Objection:** "You simulated 200 originals with a specific selection rule ($p < .05$) and a specific replication power ($2.5x$). Real literatures have heterogeneous power, different alpha thresholds, and multi-lab noise. Does the gap separate the cases cleanly when the replication $n$ varies randomly, or when the original $n$ is correlated with the effect size?"
  *   **Reply:** "I added noise to the $n$ in robustness checks (Appendix C). The separation holds because the hierarchical model captures the $n$-effect size correlation via the precision weights."
  *   **Soft Spot:** Did you simulate correlated effect sizes and $n$ (where researchers chase significance)? That breaks the independence assumption.
  *   **Falsifier/Drop Decision:** **WEAKEN.** If the gap correlates with mean sample size in real data (larger studies = smaller gap), it's confounded by power, not calibration.

  ### 8. The "Exact Numbers" Objection (Department Detail-Oriented)
  **The Objection:** "You reference the Open Science Collaboration. What was the exact replication rate? You cited 36% earlier, but Cancer Biology was 11% and Social Psych was 47%. Which benchmark are you using?"
  *   **Reply:** (See Script Below).
  *   **Soft Spot:** N/A (Factual recall).
  *   **Falsifier/Drop Decision:** **N/A.** Just don't get it wrong.

  ---

  ## 3. The Question You Hope Nobody Asks
  **The Question:** "If your benchmark is fitted to the very same published estimates that went through the publication filter, isn't your 'gap' just the filter reconstituted? If the literature is biased, your model learns the bias. If the replication fails, your model says 'I predicted that.' If the replication succeeds, your model says 'I predicted that.' Isn't this circular?"

  *   **Why it's worse than the Biostat objection:** The Biostat asks about *bias magnitude*. This asks about *identification*. If the model learns the bias, the gap is structurally incapable of detecting the bias.
  *   **The Reply:** "It's not circular because the replication data is *held out*. The model is trained on Originals ($O$), predicts Replications ($R_{pred}$), and is compared to Observed Replications ($R_{obs}$). $R_{obs}$ was not used to fit the model. If $O$ is biased, $R_{pred}$ will be optimistic. If $R_{obs}$ matches that optimism, the gap is zero (consistent bias). If $R_{obs}$ is lower, the gap opens. The circularity would only exist if I used $R_{obs}$ to tune the model."
  *   **The Soft Spot:** If the bias in $O$ is so severe that the hierarchical model cannot distinguish between 'small true effect' and 'false positive', then $R_{pred}$ is meaningless.
  *   **Falsifier/Drop Decision:** **DROP EVERYTHING.** If you run a simulation where *all* true effects are zero, but you select on $p < .05$, and your model predicts a replication rate $> 10\%$, your metric is broken. It should predict $\alpha$ (5%). If it predicts 40% because it thinks the significant noise is signal, the gap is invalid.

  ---

  ## 4. Script for the "Exact Numbers" Question
  *Do not try to recall the exact decimal. Frame it.*

  "I'm citing the 2015 Open Science Collaboration *Science* paper. The headline figure for Psychology was roughly **36% to 47%** depending on the significance criterion used (p < .05 vs. confidence interval overlap). The Cancer Biology replication project (Begley & Ellis / Amgen) is often cited as **11%**, but that was industry preclinical, not published academic replications. For the purpose of this chapter, the exact percentage matters less than the fact that it is substantially lower than the >90% power we would expect from the original reported effect sizes. That discrepancy is the 'gap' I'm modeling."

  ---

  ## 5. Summary of Falsifiers (The "Abandon Ship" Criteria)
  *If any of these are true, you must concede the metric is flawed.*

  1.  **Selection Adjustment:** If a selection-model adjusted prediction differs from your unadjusted prediction by $>10\%$, your gap is just measuring publication bias. **(Drop Framing)**
  2.  **Null Simulation:** If your model predicts $>10\%$ replication success in a simulation where all true effects are zero (pure noise + selection), the model cannot distinguish signal from noise. **(Drop Metric)**
  3.  **Out-of-Sample:** If the gap calculated on 2015 data does not predict replication success in 2020 data better than original p-values do, it has no predictive utility. **(Weaken Claim)**
  4.  **Hyperprior Sensitivity:** If changing the hyperprior scale changes the gap from positive to negative, the metric is not robust. **(Weaken Claim)**
  5.  **Direct vs. Conceptual:** If the gap disappears for direct replications but remains for conceptual ones, the gap measures methodological drift, not statistical calibration. **(Reframe Chapter)**

  **Final Advice:** Your strongest shield is the "held-out data" argument (Originals $\neq$ Replications). Your weakest link is the assumption that the hierarchical model can recover signal from a selection-biased training set without an explicit selection function. Concede the weakness, but argue the *diagnostic* value remains even if the *absolute* value is biased.
