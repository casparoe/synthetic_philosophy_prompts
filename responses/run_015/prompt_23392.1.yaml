answer: |-
  This is an excellent set of questions. You have hit on the precise technical friction points that separate "textbook" game theory from robust implementation. As an engineer, you are right to be suspicious of order-dependence; in software, non-deterministic outputs for the same input are usually bugs, not features. In game theory, they signal a fragile solution concept.

  Here is the detailed breakdown you requested.

  ---

  ### 1. Why Strict Dominance is Order-Independent, but Weak Dominance is Not

  The difference lies in the logical quantifiers defining the dominance relation.

  **Strict Dominance:**
  Strategy $s_i$ is strictly dominated by $\sigma_i$ if:
  $$ \forall s_{-i} \in S_{-i}, \quad u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i}) $$
  The inequality is strict ($>$) for **all** opponent profiles.

  **Weak Dominance:**
  Strategy $s_i$ is weakly dominated by $\sigma_i$ if:
  $$ \forall s_{-i} \in S_{-i}, \quad u_i(\sigma_i, s_{-i}) \ge u_i(s_i, s_{-i}) $$
  AND
  $$ \exists s'_{-i} \in S_{-i}, \quad u_i(\sigma_i, s'_{-i}) > u_i(s_i, s'_{-i}) $$
  The inequality is weak ($\ge$) everywhere, but strict ($>$) for **at least one** opponent profile.

  **The Mechanism of Failure:**
  In **Iterated Elimination of Strictly Dominated Strategies (IESDS)**, when you remove a strategy $s_j$ from the game, you are removing a column (or row) from the payoff matrix. Because the dominance condition for strict dominance held for *all* columns, it necessarily holds for the *remaining* columns. Removing options cannot turn a strict inequality into an equality. Thus, the set of dominated strategies is monotonic; the order of removal does not change the final set.

  In **Iterated Elimination of Weakly Dominated Strategies (IEWDS)**, the dominance relies on that "at least one" column where the payoff is strictly better. If you eliminate that specific column first (because it was weakly dominated for the *other* player), the remaining columns might show only equality ($=$).
  *   Before elimination: Strategy X is weakly dominated by Y (better in column 1, equal in column 2).
  *   If Column 1 is removed: X and Y are now identical in Column 2. X is no longer dominated by Y.
  *   If you had eliminated X first, you might have enabled a different elimination path for the other player.

  This creates a path-dependence similar to race conditions in concurrent programming: the final state depends on the sequence of operations.

  ---

  ### 2. Walkthrough of Your Game

  Let's analyze the game you provided.
  Payoffs are $(Row, Column)$.

  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  A & (0, 0) & (0, 0) \\
  B & (1, 1) & (0, 0) \\
  C & (1, 1) & (1, 1) \\
  \end{array}
  $$

  **Initial Dominance Relations:**
  *   **Row Player:**
      *   $C$ vs $B$: Against $L$ ($1=1$), Against $R$ ($1>0$). **$C$ weakly dominates $B$.**
      *   $C$ vs $A$: Against $L$ ($1>0$), Against $R$ ($1>0$). **$C$ strictly dominates $A$.**
      *   $B$ vs $A$: Against $L$ ($1>0$), Against $R$ ($0=0$). **$B$ weakly dominates $A$.**
  *   **Column Player:**
      *   $L$ vs $R$: Against $A$ ($0=0$), Against $B$ ($1>0$), Against $C$ ($1=1$). **$L$ weakly dominates $R$.**

  Now, let's run the elimination procedure in two different orders.

  #### Order 1: Eliminate Row Strategies First
  1.  **Step 1:** Row player eliminates $B$ (weakly dominated by $C$).
      *   *Note: We could also eliminate A, but let's pick B to show the divergence.*
      *   Remaining Game: Rows $\{A, C\}$, Cols $\{L, R\}$.
  2.  **Step 2:** Check Column dominance in the reduced game.
      *   Col Payoffs vs $A$: $L=0, R=0$.
      *   Col Payoffs vs $C$: $L=1, R=1$.
      *   $L$ and $R$ are now identical. Neither dominates the other. Elimination stops for Column.
  3.  **Step 3:** Check Row dominance in the reduced game.
      *   Row Payoffs vs $L$: $A=0, C=1$.
      *   Row Payoffs vs $R$: $A=0, C=1$.
      *   $C$ **strictly** dominates $A$. Eliminate $A$.
  4.  **Final Survivors:** Row $\{C\}$, Col $\{L, R\}$.
      *   **Strategy Profiles:** $(C, L)$ and $(C, R)$.

  #### Order 2: Eliminate Column Strategies First
  1.  **Step 1:** Column player eliminates $R$ (weakly dominated by $L$).
      *   Remaining Game: Rows $\{A, B, C\}$, Col $\{L\}$.
  2.  **Step 2:** Check Row dominance in the reduced game.
      *   Row Payoffs vs $L$: $A=0, B=1, C=1$.
      *   $A$ is **strictly** dominated by $B$ (and $C$). Eliminate $A$.
      *   Remaining: Rows $\{B, C\}$, Col $\{L\}$.
  3.  **Step 3:** Check remaining Row strategies.
      *   Payoffs vs $L$: $B=1, C=1$.
      *   They are identical. Neither dominates.
  4.  **Final Survivors:** Row $\{B, C\}$, Col $\{L\}$.
      *   **Strategy Profiles:** $(B, L)$ and $(C, L)$.

  #### Comparison
  *   **Order 1 Result:** $\{(C, L), (C, R)\}$
  *   **Order 2 Result:** $\{(B, L), (C, L)\}$

  The sets are different. Order 1 suggests $B$ is irrational (eliminated immediately). Order 2 suggests $R$ is irrational (eliminated immediately), which saves $B$ from elimination because $B$'s weakness was only exposed when $R$ was in play.

  ---

  ### 3. Normative Rationality: Is Weak Dominance "Irrational"?

  This is the philosophical crux. If the result depends on order, can we claim the eliminated strategies are truly "irrational"?

  **The Case for Strict Dominance:**
  It is universally agreed that playing a strictly dominated strategy is irrational. No belief about the opponent's behavior can justify it. If you play it, you are actively burning utility.

  **The Case for Weak Dominance:**
  Playing a weakly dominated strategy is not *always* irrational in a static sense. If I am certain the opponent will play the strategy where the payoffs are equal, I am indifferent between the dominated and dominating strategy.
  *   *Example:* In your game, if Row is certain Col plays $L$, Row is indifferent between $B$ and $C$. Playing $B$ yields 1, same as $C$.

  **Why we usually eliminate them anyway (The "Trembling Hand"):**
  The standard justification for IEWDS is **Trembling Hand Perfection** (Selten, 1975). The argument is: "Can you be *absolutely* certain the opponent won't make a mistake?"
  If there is even an infinitesimal probability $\epsilon$ that the Column player plays $R$ (a "tremble"), then:
  *   Expected Utility of $B \approx (1-\epsilon)(1) + \epsilon(0) = 1 - \epsilon$
  *   Expected Utility of $C \approx (1-\epsilon)(1) + \epsilon(1) = 1$
  *   $C$ becomes *strictly* better than $B$.

  **Does Order-Dependence Undermine This?**
  Yes, it undermines IEWDS as a *standalone* predictive tool.
  1.  **Fragility:** As shown in the example, whether $B$ is considered irrational depends on whether we assume the Column player eliminates $R$ first. But why should Column eliminate $R$ first? $R$ is only weakly dominated. If Column trembles, $R$ might be played. If Row knows Column might tremble, Row shouldn't eliminate $B$.
  2.  **Implementation Advice:** For your auction bots, **do not use IEWDS** to prune strategies unless you have a specific model of "trembles" (noise). It is not robust.
      *   **IESDS** is safe. It removes strategies that are objectively bad under *any* belief.
      *   **IEWDS** removes strategies that are bad under *almost all* beliefs, but the "order" artifact means you might prune a strategy that would be optimal against a specific (even if unlikely) opponent configuration.

  **Verdict:** A weakly dominated strategy is "weakly irrational." It fails a robustness test. But because IEWDS is order-dependent, the *set* of surviving strategies is not a stable equilibrium concept on its own. It is usually better to look for **Nash Equilibria** that survive trembling-hand perfection rather than relying on the IEWDS procedure itself.

  ---

  ### 4. Strict Dominance, Best Responses, and Rationalizability

  You asked: *"In a finite game a pure strategy is strictly dominated by some mixed strategy if and only if it is never a best response to any belief about the opponent's play — is that right?"*

  **Yes, that is correct.** This is a fundamental theorem (often attributed to Pearce, 1984).

  **The Nuance on "Belief":**
  The definition of "belief" matters here.
  1.  **Correlated Beliefs:** If "belief" means any probability distribution over the opponents' strategy profiles (allowing opponents to correlate their actions), then:
      $$ \text{Strictly Dominated (by mixed)} \iff \text{Never a Best Response} $$
  2.  **Independent Beliefs:** If "belief" assumes opponents choose strategies independently (product distributions), this equivalence holds strictly only in **2-player games**.

  **Connection to Rationalizability:**
  *   **Rationalizability** is defined as the set of strategies that survive the iterated elimination of strategies that are **never a best response** to a belief about the opponents' rational play.
  *   **IESDS** is the iterated elimination of **strictly dominated** strategies.

  **The Link:**
  Because of the theorem above, in **2-player games**, IESDS (allowing mixed dominators) and Rationalizability yield the **exact same set of strategies**.
  *   *Engineering Implication:* If you are simulating a 2-player auction, computing IESDS is computationally cheaper than computing the full fixed-point definition of rationalizability, but you get the same result.

  **The 3+ Player Divergence (Critical for Auctions):**
  In games with 3 or more players (common in auctions), these concepts diverge.
  *   **IESDS** assumes opponents might correlate (implicitly). If a strategy is dominated even against correlated opponents, it's gone.
  *   **Rationalizability** typically assumes opponents act **independently**.
  *   In 3+ player games, there are strategies that are **never a best response to independent beliefs** (hence not Rationalizable) but are **not strictly dominated** (hence survive IESDS).
      *   *Why?* Because to make the strategy a best response, you might need the opponents to correlate in a way that independent randomization doesn't allow. But to prove it is *strictly dominated*, you must show it loses against *all* profiles, including correlated ones.
      *   Actually, the subset relation is: **IESDS Survivors $\subseteq$ Rationalizable Strategies**.
      *   IESDS is more aggressive in n-player games because strict dominance is a stronger condition than "never a best response to independent beliefs."

  **Summary for your Project:**
  1.  **Strict Dominance (IESDS):** Safe, order-independent, defensible. Removes strategies that are objectively suboptimal. In 2-player games, this is equivalent to Rationalizability.
  2.  **Weak Dominance (IEWDS):** Order-dependent, fragile. Only defensible if you assume "trembling hand" (noise). Be very careful using this for bot logic.
  3.  **Rationalizability:** The most permissive notion of "rational" play. In 2-player games, it matches IESDS. In n-player games, it is a larger set than IESDS survivors.

  If your goal is to build bots that *never make obvious mistakes*, implement **IESDS allowing mixed strategies**. Do not implement IEWDS unless you explicitly model probability noise in opponent actions.
