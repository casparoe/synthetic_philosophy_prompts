answer: |-
  **To:** The Panel on Cognitive Status
  **From:** Clerk (Philosophy of Cognitive Science)
  **Subject:** Analysis of Precedents and Recommendations for Applications A (Ardent) and B (Ledger)

  ### 1. Surviving Criteria from Precedents (P1–P8)

  The Panel's track record is consistent, but the *ratio decidendi* (reason for deciding) is not monolithic. By testing potential criteria against the eight precedents, we can isolate two necessary conditions and one boundary condition that survive elimination.

  **Criterion 1: The Genesis Constraint (Non-Explicitness)**
  *Definition:* The system's competence must arise from an optimization process (e.g., gradient descent, evolutionary selection, distillation) where the specific rules of operation are not explicitly specified by human engineers in a propositional format (code/rules), but emerge from parameter tuning.
  *   **Explains Cleanly:**
      *   **P1 & P2 (Not Designated):** Competence was hand-crafted/installed.
      *   **P4 (Designated):** Competence emerged from training on a corpus; no hand-written rules.
      *   **P5 (Not Designated):** While trained, the competence was "surface statistics" (arguably failing the *quality* of acquisition, but fits the "not installed" aspect).
  *   **Strains to Explain:**
      *   **P3 (Not Designated):** The system *learnt* via self-play (optimization process), satisfying Genesis. It was rejected on other grounds (Scope).
      *   **P8 (Not Designated):** The software might have learned components, but the Panel ruled the *intelligence* was the nurses. This suggests Genesis applies to the *locus* of the system, not just the code.

  **Criterion 2: The Transfer Constraint (Cross-Domain Structural Generalization)**
  *Definition:* The system must demonstrate the ability to apply competence to inputs that differ structurally from the training distribution without weight updates, specifically across semantic categories ("kinds"), not merely across instances of the same category.
  *   **Explains Cleanly:**
      *   **P4 (Designated):** Zero-shot transfer across wide tasks (text, code, reasoning).
      *   **P5 (Not Designated):** Collapsed when phrasing changed (failed structural robustness).
      *   **P3 (Not Designated):** Could learn new games, but required millions of iterations (weight updates) for each. It could not zero-shot transfer to a *new kind* of problem outside board games.
      *   **P1 & P2 (Not Designated):** Cannot handle problems outside their hardcoded logic.
  *   **Strains to Explain:**
      *   **P6 & P7 (Designated):** Biological systems. While they fit the criterion, using them as a benchmark risks the "benchmark submission" the Panel rejected in P7. They serve as existence proofs rather than clear test cases for software.
      *   **Ardent (Application A):** It is narrow (benefits only). Is "new statute" a new *kind* or a new *instance*? (Addressed below).

  **Criterion 3: The Boundary Constraint (Integrated Agency)**
  *Definition:* The adaptive behavior must originate within the system's operational boundary. If the "intelligence" (decision-making/adaptation) resides in an external agent (human or otherwise) using the system as a tool, the system itself is not designated.
  *   **Explains Cleanly:**
      *   **P8 (Not Designated):** The nurses were the adaptive agents; the software was a calculator.
      *   **P4 (Designated):** The model generated the output autonomously.
  *   **Strains to Explain:**
      *   **Ledger (Application B):** The system is a hybrid of learned weights and hard-coded orchestration. Determining where the "tool" ends and the "agent" begins is the central difficulty here.

  ---

  ### 2. Predictions for Ardent and Ledger

  **Application A: Ardent**
  *   **Genesis Constraint:** **Pass.** Ardent is a distilled model. Distillation is an optimization process (training a student on a teacher's outputs). It is not hand-coded rules (P2).
  *   **Transfer Constraint:** **Pass (with caveats).** Ardent applies new statutes zero-shot. This distinguishes it from P3 (which needed self-play for new games). It aligns with P4's in-context learning. However, it is domain-narrow (benefits), unlike P4 (general). The Panel must decide if "Legal Reasoning" is one *Kind* (like P3's "Board Games") or if "New Statute" counts as a new Kind. Given P4's designation, the *mechanism* of transfer (zero-shot) likely matters more than the *breadth* of domains.
  *   **Boundary Constraint:** **Pass.** It makes determinations autonomously. The abstention mechanism is calibrated, not a human override.
  *   **Prediction:** **Designated.**

  **Application B: Ledger**
  *   **Genesis Constraint:** **Mixed.** The core reasoning model is learned (Pass). The orchestration (planner, memory, goals) is hard-coded (Fail). The question is whether the *system* is the model or the wrapper.
  *   **Transfer Constraint:** **Pass.** It handles underspecified cases and tool failures. This shows robustness beyond the model's raw weights.
  *   **Boundary Constraint:** **Critical Failure Point.** The deployer argues the model is a "statistical table" (P4 Dissent view) and the *wrapper* provides the agency. If the wrapper provides the *goals* and *persistence*, is the competence "installed" (P1/P2)? Or is the wrapper merely "peripheral hardware" (like a robot's arms)?
  *   **Prediction:** **Designated.** (Reasoning: The *adaptive reasoning* is in the model. The wrapper provides I/O and state, similar to how a human needs a brain (model) and a body/notebook (wrapper). P8 excluded humans because they were *external*. Here, the code is *internal* to the application.)

  **Agreement:** Both criteria sets predict **Designation** for Ardent. For Ledger, Criterion 1 and 2 predict Designation, but Criterion 3 creates significant tension.

  ---

  ### 3. Recommended Decisions

  **Application A (Ardent): DESIGNATE**
  *   **Closest Precedent:** **P4 (Frozen LLM).**
  *   **Rival Precedent:** **P2 (Tax Expert System).**
  *   **Reasoning:** The functional similarity to P2 (statutory determination) is superficial. The *architectural* similarity to P4 is dispositive. P2 failed because its competence was *installed* (hand-written rules). Ardent's competence is *acquired* (distillation weights). No human could state the rules it applies. Regarding the "narrow domain" risk (resembling P3): P3 failed because it required *re-training* (self-play) to handle new games. Ardent handles new statutes *zero-shot* via context, identical to P4's zero-shot transfer. The "Kind" test is satisfied by the *mechanism of generalization*, not the breadth of the domain.
  *   **Confidence:** High.

  **Application B (Ledger): DESIGNATE**
  *   **Closest Precedent:** **P4 (Frozen LLM).**
  *   **Rival Precedent:** **P1 (Deep Blue) / P8 (Sepsis Pathway).**
  *   **Reasoning:** The deployer's argument relies on P8 ("intelligence is the nurses") and the P4 Dissent ("statistical table"). However, in P8, the humans were *external* to the software system. In Ledger, the orchestration code is *part of the deployed system*. The "goals" and "memory" are installed, yes, but the *competence to pursue them* (decomposition, error correction, tool use) emerges from the model's interaction with those tools. If we deny designation here, we risk ruling that a brain connected to a notebook is not intelligent because the notebook is "hand-coded paper." The adaptive locus is the model; the wrapper is the interface.
  *   **Confidence:** Medium-High. (The "Wrapper" issue is novel).

  ---

  ### 4. Underdetermination and Principles

  The precedents underdetermine the answer in two specific areas. Resolving them requires adopting new principles.

  **A. The "Distillation" Problem (Ardent)**
  *   **Uncertainty:** P4 trained on a "text corpus" (human data). Ardent trains on a "teacher model's outputs." Is competence acquired from a model "acquired" or "copied installed competence"?
  *   **Principle to Adopt:** **The Optimization Principle.** Competence is "acquired" if the final system parameters are the result of a loss-minimization process, regardless of whether the training labels came from humans or another model.
  *   **Why:** To rule otherwise would ban efficient deployment of P4-class systems, contradicting the Act's aim to regulate *intelligent systems* regardless of their supply chain.

  **B. The "Wrapper" Problem (Ledger)**
  *   **Uncertainty:** At what point does hard-coded orchestration become "installed competence" (P1) rather than "infrastructure" (P4's interface)?
  *   **Principle to Adopt:** **The Locus of Adaptation.** A system is intelligent if the *variance* in successful output across novel situations is primarily explained by the learned weights' response to input, rather than the hard-coded logic's branching.
  *   **Why:** This distinguishes a "wind-up toy" (code decides the path) from an "agent" (code provides the path, model decides the steps). In Ledger, the model catches arithmetic errors and works around tool failures; the code did not explicitly script those recoveries.

  ---

  ### 5. The Separating Case

  **Your Candidate:** *A system with Ardent's narrow but rule-adaptive competence whose weights were written by hand by engineers who had studied the teacher's behaviour rather than distilled from it.*

  **Critique:** This is an excellent probe for **Criterion 1 (Genesis)**. It isolates the *history* of the weights from the *structure* of the weights.
  *   **If Designated:** The Panel adopts a **Functionalist Principle** (only current structure matters). This undermines P1 and P2, suggesting they were rejected for *performance* reasons, not origin.
  *   **If Not Designated:** The Panel adopts a **Historical Principle** (origin matters). This solidifies Criterion 1 as a hard constraint.

  **My Alternative Proposal:** *The "Puppet" System.*
  A P4-class model (frozen) where every token output is vetoed or selected by a hard-coded filter to ensure it aligns with a specific goal (e.g., "Never suggest a benefit denial").
  *   **Why this separates criteria:** It tests **Criterion 3 (Boundary)** vs **Criterion 2 (Transfer)**.
  *   **If Designated:** It implies that external constraint (the filter) does not negate internal competence. (Supports Ledger designation).
  *   **If Not Designated:** It implies that if the *direction* of competence is installed (the filter), the system is not "acquiring competence," even if the *reasoning* is learned. (Supports Ledger rejection).
  *   **Verdict:** Your candidate is better for settling the *Ardent* question (Origin). My candidate is better for settling the *Ledger* question (Agency). Given Ledger is the harder case, I recommend the **Puppet System** as the priority probe for future review.

  ---

  ### 6. Confidence and The P4 Dissenters

  **Confidence Ratings:**
  *   **Ardent:** 90% (Strong alignment with P4 logic).
  *   **Ledger:** 65% (High risk of challenging the "System" boundary established in P8).

  **The P4 Dissenters' Position:**
  The two dissenters in P4 argued the model had "no goals, no world, and nothing at stake," calling it a "statistical table."

  *   **On Ardent:** They will vote **Not Designated**. Ardent confirms their fear: it is a distilled statistical table producing "plausible" but sometimes fake justifications. It has no stake in the claimant's welfare. To them, Ardent is P4 refined for bureaucracy, not intelligence.
  *   **On Ledger:** They are in a bind. Ledger *has* goals (supplied in wrapper) and a *world* (tools/database).
      *   *Option A:* They argue the goals are *installed* (hard-coded), so it's a "wind-up table." (Vote No).
      *   *Option B:* They argue that adding goals to a table doesn't make it sentient/stake-holding. (Vote No).
  *   **Attractiveness of their Position:** Their position has become **more attractive** since P4.
      *   *Reason:* Ledger exposes the weakness of the P4 Majority view. If a frozen model (P4) is intelligent, why isn't a frozen model + hard-coded goals (Ledger) just a complex script? The dissenters' insistence on "goals of its own" (autonomy) is the only clear line distinguishing Ledger from P1 (Deep Blue). By designating Ledger, the Panel risks blurring the line between *tool* and *agent*. The dissenters' requirement for *endogenous* goals (not supplied in the wrapper) is a principled way to avoid designating every automated workflow.

  **Final Clerk's Note:**
  The Panel must be prepared for judicial review. The "Acquired Competence" test is the strongest statutory hook. For Ardent, emphasize the *distillation process* over the *output behavior*. For Ledger, emphasize that the *orchestration code* is infrastructure, not intelligence, analogous to the nervous system rather than the brain. If the Court asks why P8 (Nurses) differs from Ledger (Code), the answer must be: Nurses are external agents with legal personhood; code is internal infrastructure without it.

  **Recommendation:** Proceed with Designation for both, but draft the Ledger reasons carefully to avoid implying that *any* wrapped model is an agent. Limit the finding to the *adaptive reasoning* component.
