answer: |-
  You have identified a specific, structural epistemic risk that is distinct from the usual warnings about "automation bias" or "deskilling." The literature has not yet converged on a single canonical term for this exact configuration, though several fields are circling it.

  The closest existing philosophical concept is **Epistemic Corruption** (specifically *structural* corruption), and the closest cognitive science concept is **Calibration Drift**. However, neither fully captures the recursive nature of your third instance (the system generating the checklist for itself).

  If we are to name and carve this up rigorously, I propose calling this configuration **Reflexive Epistemic Capture**.

  Below is an analysis of why this name fits, how to distinguish it from its neighbors, and answers to your specific boundary cases.

  ### 1. Naming and Definition

  **Proposed Name:** **Reflexive Epistemic Capture**
  **Alternative:** **Endogenous Verification Loop**

  **Definition:** A state in which an agent retains the *capacity* to verify a tool's output but outsources the *criteria* for verification to the tool itself (or a tool from the same class), resulting in a convergence of the agent's intuitive standards and the tool's probabilistic tendencies.

  **Why this fits your case:**
  *   **Reflexive:** The system is checking itself (Instance 1 & 3).
  *   **Epistemic:** It concerns the grounds of knowledge and justification, not just the output.
  *   **Capture:** Your standards (what "good prose" or "valid analysis" looks like) are being captured by the model's distribution (Instance 2).

  **Why existing terms fail:**
  *   **Automation Bias:** This implies passive acceptance. You are actively critiquing. The risk here isn't laziness; it's that your *critique mechanism* is compromised.
  *   **Deskilling:** You retain the skill. The risk is not that you *can't* check, but that you no longer recognize the need to check in specific blind spots.
  *   **Echo Chamber:** Usually implies social reinforcement. This is a human-machine dyad where the machine reinforces the human's assumptions which the machine itself generated.

  ### 2. Carving Up the Phenomenon

  To distinguish this from neighbors, we must look at the **Source of Ground Truth**.

  | Feature | **Reflexive Epistemic Capture** (Your Case) | **Automation Bias** | **Traditional Tool Use** (Calculator) | **Expert Deference** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Verification** | Active, but criteria supplied by tool. | Passive / Absent. | Active, criteria external to tool. | Passive, criteria external (peer review). |
  | **Ground Truth** | **Endogenous** (Internal to model distribution). | N/A (Assumed true). | **Exogenous** (Math/Dictionary). | Exogenous (Community consensus). |
  | **Error Correlation** | **High** (Shared priors/assumptions). | N/A. | **Zero** (Deterministic). | **Low** (Independent training). |
  | **Skill State** | Retained but dormant/misaligned. | Atrophied. | Irrelevant (Computation). | Retained (Meta-evaluation). |

  **The Boundary Line:**
  The phenomenon begins where the **criteria for validity** shift from an external standard (mathematical proof, empirical data, style guide) to an internal standard (model plausibility, token probability, "sounds right").

  ### 3. Addressing Your Boundary Cases

  You asked five specific questions to test the limits of this definition. Here is how *Reflexive Epistemic Capture* handles them:

  **Q1: Is putting the same question to a differently built model an independent check?**
  *   **Verdict:** **No.**
  *   **Reasoning:** Unless the architectures and training corpora are fundamentally divergent (e.g., a symbolic logic engine vs. an LLM), modern LLMs share a "monoculture" of internet training data. They share the same blind spots (e.g., specific statistical misconceptions prevalent in online text). This is **Model Homogeneity**, not independence. It reinforces the Capture rather than breaking it.

  **Q2: Does it change anything that I audit a random one item in twenty rather than none?**
  *   **Verdict:** **Yes, but only if the audit is exogenous.**
  *   **Reasoning:** If you audit 1 in 20 using the *model's own checklist*, you are merely sampling the loop. It gives a false sense of security (confidence without validity). If you audit 1 in 20 using *first principles* (deriving the result, running a simulation), you break the Capture. The frequency matters less than the **method of the audit**. A 5% exogenous audit rate is infinitely more valuable than a 100% endogenous audit rate.

  **Q3: Does it matter that the tool is right most of the time?**
  *   **Verdict:** **Yes, it makes the Capture more dangerous.**
  *   **Reasoning:** This is the problem of **Insidious Drift**. If the tool were wrong often, you would retain your skepticism. High accuracy accelerates the "Standard Drift" (your Instance 2). You calibrate your intuition to the model because the model is usually right. This makes the correlated blind spots (where you are *both* wrong) much harder to detect because they are rare and reinforced by a history of success.

  **Q4: Does the phenomenon disappear if the person could, with a week of study, check for themselves?**
  *   **Verdict:** **No.**
  *   **Reasoning:** This distinguishes **Latent Competence** from **Actual Verification**. The phenomenon is defined by the *workflow*, not the *potential*. If the cost of verification (time/effort) causes you to rely on the endogenous criteria, the Capture holds. The risk is the **Atrophy of the Will to Verify**, not just the ability. However, if the check is *possible*, the remedy is simpler (force the exogenous check) than if the check is *impossible* (layperson).

  **Q5: Is a spellchecker or calculator genuinely the same thing in miniature?**
  *   **Verdict:** **No. There is a real break.**
  *   **Reasoning:** The break falls at **Determinism vs. Probabilistic Reasoning**.
      *   **Calculator/Spellchecker:** These check against a **fixed, external ontology**. $2+2=4$ is not a statistical likelihood; "colour" vs. "color" is a defined preference. The tool does not *generate* the truth; it references it.
      *   **LLM:** The model *generates* the truth based on probability. When you ask it to critique itself, it is not referencing an external ontology; it is referencing its own weights.
      *   **The Break:** You can use a calculator to check a calculator (deterministic consistency). You cannot use an LLM to check an LLM (probabilistic consistency). The former verifies *computation*; the latter verifies *plausibility*. In biostatistics, plausibility $\neq$ validity.

  ### 4. The Core Mechanism: Correlated Blind Spots

  Your intuition about correlated blind spots is the most critical insight. In epistemology, this is known as **Common Cause Failure**.

  *   **Traditional Tool:** I use a calculator. I don't know long division. If the calculator breaks, I can't catch it. (Dependency).
  *   **Your Situation:** I know long division. I use a calculator. But I've started thinking about numbers the way the calculator does. If the calculator has a bug in `sqrt`, and I've stopped thinking about `sqrt` because the calculator does it, we both miss the bug.
  *   **The LLM Twist:** The LLM doesn't just compute; it *speaks*. It teaches you to speak about the computation. If it speaks confidently about a statistical assumption that is subtly wrong (a common hallucination type in stats), and you adopt that phrasing, you adopt the assumption.

  ### 5. Recommendation for "Carving" Your Workflow

  To mitigate *Reflexive Epistemic Capture* without abandoning the tool, you need to introduce **Exogenous Friction**.

  1.  **Separate Generation from Critique:** Do not ask the model to critique its own code in the same context window. (You already do this sometimes, but ensure the prompt is "Act as a hostile reviewer who assumes this code is wrong," not "Check this.")
  2.  **The "Week of Study" Rule:** Identify the "high stakes" assumptions (e.g., ignorable missingness). Mandate that 10% of these *must* be verified via first principles or simulation, regardless of how confident the model is. This keeps the "muscle" of verification active.
  3.  **Diverse Model Architecture:** If you must use AI for critique, use a model with a different architecture (e.g., a smaller, reasoning-focused model vs. a large generative one) to reduce the correlation of blind spots.
  4.  **Externalize the Checklist:** Maintain a static, human-written checklist of statistical pitfalls that is *never* updated by the model. Use the model to fill the checklist, not to write it.

  ### Summary

  You are experiencing **Reflexive Epistemic Capture**. It is distinct from automation bias because you are critically engaged; it is distinct from deskilling because you retain competence. It is a **systemic alignment of error** between the user and the tool, facilitated by the tool defining the standards of judgment.

  The boundary is not your *ability* to check, but the *source of the criteria* you use to decide *whether* to check. As long as the model tells you what counts as a mistake, you are inside the loop.
