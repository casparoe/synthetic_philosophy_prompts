answer: |-
  You are conflating the contingency of the reference-fixing procedure (which sample we found and how we identified it) with the metaphysical necessity of the identity statement once the reference is secured. The uncertainty lies in whether we successfully latched onto a unique kind, not in the modal status of the kind itself once the latch holds.

  ***

  Your intuition that this smells like a word game is shared by many philosophers of science, but to see why Kripke insists it is not, we must separate the history of how a name gets attached to the world from the metaphysical status of the thing named. In your field, you treat the composition of a phase as an empirical discovery that could have been otherwise. Kripke agrees it is an empirical discovery, but disagrees that it could have been otherwise *once discovered*. The tension you feel arises because you are viewing the name 'calliopeite' as a shorthand for a description ("the mineral with this powder pattern"), whereas Kripke views it as a tag attached to an object or kind via a causal chain.

  Let us apply this to your case. In 1908, the mineralogist fixes the reference of 'calliopeite' by ostension to the specimen in tray 3. On the Kripkean view, the description ("the stuff with this powder pattern") is not the meaning of the name; it is merely the tool used to fix the reference. The name then refers to whatever kind of stuff actually caused that pattern.

  Regarding your first question: if the specimen is heterogeneous, containing both magnesium and iron end-members, the reference-fixing act is flawed. The ostension points to two distinct kinds simultaneously. In this scenario, it is not right to say "calliopeite is the magnesium phase" is necessary, because the term 'calliopeite' currently lacks a determinate referent. It is ambiguous. The necessity Kripke speaks of only applies once the reference is determinate. If the community subsequently decides, "We intended to name the dominant phase," or "We intended to name the magnesium component," they are precisifying the reference. Once that decision is made—say, fixing 'calliopeite' to the magnesium phase—the statement "calliopeite is the magnesium phase" becomes necessary. It is not a verbal trick because it locks the term to the essence of that kind across all possible worlds. You cannot coherently imagine a world where calliopeite (the magnesium phase) exists but is not the magnesium phase. What you are imagining is a world where the *name* was attached to something else, which is a different claim.

  This leads to your second point, which cuts to the heart of the matter. You argue that if the tray had contained only the iron fragment, we would be talking about iron, and this looks like contingency. Kripke accepts this fully. The contingency lies in the *history of the naming ceremony*, not in the *identity of the kind*. It is contingent that we found the magnesium fragment; it is necessary that what we found is magnesium. The Kripkean reply is not merely verbal because it constrains how we reason about counterfactuals in science. If 'calliopeite' were synonymous with the description "the stuff in tray 3," then in a counterfactual world where tray 3 contains iron, calliopeite would be iron. But if 'calliopeite' rigidly designates the magnesium kind, then in that counterfactual world, tray 3 contains iron, but calliopeite is still magnesium (and thus not in tray 3).

  Why does this distinction matter beyond semantics? It matters for scientific explanation. If you treat the name as descriptive, you allow the possibility that the kind itself could have had a different composition. If you treat it as rigid, you assert that the composition is essential to the kind. When you say "water is H₂O is necessary," you are claiming that anything lacking that molecular structure is not water, even if it looks and behaves like water. This is a substantive metaphysical claim about the structure of reality, not just a rule for using words. It asserts that nature comes carved at the joints, and our names latch onto those joints. The "contingency" you perceive is epistemic (we could have been wrong about which joint we latched onto); the "necessity" Kripke perceives is metaphysical (once latched, the joint is what it is).

  Your third scenario, where the community splits, highlights the social mechanism of reference. If half the laboratory uses 'calliopeite' for magnesium and half for iron, the term becomes ambiguous, effectively becoming two homonyms. This does not refute rigid designation; it shows that rigid designation relies on a coherent causal network within a linguistic community. When the network fractures, the reference fractures. In this state, there is no single proposition "calliopeite is Mg" that is necessary; rather, "calliopeite₁ is Mg" and "calliopeite₂ is Fe" are both necessary. This reinforces that the necessity is not in the sounds we make, but in the relation between the specific usage and the world.

  Finally, you ask whether the natural-kind case gets its necessity from the same mechanism as the proper-name case, or if it rests on something extra. This is the most contested part of the doctrine, and I will be plain: it rests on something extra, and that extra premise is controversial. For proper names like 'Cicero', the necessity of "Cicero is Tully" follows simply from the logic of identity applied to rigid designators. If both names pick out the same individual in all worlds, the identity holds in all worlds. No theory of essence is required beyond the individual being itself.

  For natural kinds like 'water' or 'calliopeite', the move from rigid designation to necessary identity requires an assumption of *essentialism*. We must assume that the kind has an internal structure or essence that determines its membership across all possible worlds. Kripke and Putnam argue that microstructure (H₂O, crystal lattice) provides this essence. However, many philosophers of science reject this. They argue that mineral species, unlike fundamental particles, are not natural kinds with strict essences but are rather human constructs imposed on continuous solid solutions. In your field, the distinction between forsterite and fayalite is clear, but intermediate olivines exist. If 'calliopeite' refers to a point in a solid solution series, there is no sharp boundary where the essence stops.

  To tell the difference as a scientist, you must ask: "Is the property we use to identify this kind constitutive of the kind, or merely diagnostic?" If the crystal structure is constitutive, then a substance without it is not the mineral, and the identity is necessary. If the structure is merely a reliable indicator of a cluster of properties that could vary, then the identity is contingent. Kripke assumes the former; a pragmatist or constructivist assumes the latter. The "necessary a posteriori" is genuine only if nature supplies essences for our names to grab. If you view mineral species as pragmatic classifications rather than metaphysical realities, then Kripke's necessity dissolves into a description of our current classificatory conventions. The argument is not verbal, but it does depend on a metaphysical wager about whether your categories discover reality or organize it.
