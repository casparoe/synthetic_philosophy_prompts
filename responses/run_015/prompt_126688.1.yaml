answer: |-
  This is a profound question that sits at the intersection of epistemology, ethics, and institutional sociology. You are effectively asking for the **Norm of Assertion** specific to journalism. Philosophers usually debate the "Knowledge Norm" (assert only what you know) versus the "Justified Belief Norm" (assert what you have good reason to believe). Your intuitions, however, suggest something more granular: a norm that shifts based on **agency** (individual vs. institution) and **reliance** (who acts on the word).

  Here is the principle that best captures your pattern, an evaluation of your own candidate rule, and the application to your new cases.

  ### The Principle: The Norm of Underwritten Reliance

  **Statement:** You may assert *p* to an audience *A* only if:
  1.  **Warrant:** You possess evidence for *p* sufficient to rule out salient possibilities of error *given the stakes of A's reliance*; AND
  2.  **Agency:** You are the proper agent to underwrite the cost of being wrong.

  This is a stakes-sensitive knowledge norm that explicitly accounts for institutional aggregation. It treats assertion not as a transfer of information, but as an **offer of insurance**. When you assert, you invite the listener to rely on you; you implicitly promise to absorb the blowback if *p* turns out false.

  #### Mapping the Principle to Your Cases

  *   **Airline App → Taxi Driver:** **Fine.**
      *   *Clause 1 (Warrant):* 97% reliability meets the low stakes of a taxi ride (if wrong, you go to the wrong gate, wait, and move).
      *   *Clause 2 (Agency):* You bear the cost of the delay, not the driver.
  *   **Friend with Ticket → "You won't win":** **Not Fine.**
      *   *Clause 1 (Warrant):* Statistical probability (even high odds) does not rule out the salient possibility of error in a singular case (the Lottery Paradox). The stakes (emotional/financial hope) are high for the friend.
      *   *Clause 2 (Agency):* You cannot underwrite their disappointment.
      *   *(Note: This requires abandoning the intuition that the App case and Lottery case are fundamentally different in kind. Both are probabilistic. The difference is purely stakes/reliance. Since you said you are willing to sacrifice this asymmetry, this principle holds.)*
  *   **Replication Failed → Paper:** **Fine.**
      *   *Clause 1 (Warrant):* The institution's vetting process converts the source's testimony into institutional knowledge.
      *   *Clause 2 (Agency):* The Masthead underwrites the cost (reputation/retraction), not the individual reporter.
  *   **Replication Failed → Expert Witness:** **Not Fine.**
      *   *Clause 1 (Warrant):* Legal stakes require first-order knowledge or admissible expertise. Hearsay fails the "salient possibilities of error" test in court.
      *   *Clause 2 (Agency):* You are personally liable for perjury or misleading the court; you cannot hide behind a source.
  *   **Masthead (Minister resigning):** **Fine.**
      *   *Clause 2 (Agency):* The "You" is the Institution. The institution aggregates the fragments into a whole that satisfies Warrant.
  *   **Individual Reporter (Minister resigning):** **Not Fine.**
      *   *Clause 2 (Agency):* The individual cannot underwrite the cost of a wrong prediction based on partial fragments. They lack the Authority to absorb the political fallout.
  *   **Press Officer (False statement):** **Not Fine (but lesser wrong).**
      *   *Clause 2 (Agency):* She is a conduit. The "Agency" lies with the Minister. The wrong is lesser because she is not the underwriter of the truth, merely the transmitter. (This distinguishes it from a friend lying, where the friend is both source and underwriter).
  *   **Soaked Colleague ("It's raining"):** **Weird.**
      *   *Clause 1 (Warrant):* Warrant is trivial, but the assertion violates the Gricean maxim of Quantity (they already know). It's not a violation of truth, but of utility.
  *   **True Statement → Audience hears as license:** **Not Fine.**
      *   *Clause 1 (Warrant):* If the *implicature* is false, your warrant for the *communicated content* is insufficient. You are asserting more than the literal sentence.
  *   **Silent Thought ("Story will run"):** **Jams.**
      *   *Clause 2 (Agency):* You are the audience. You will act on this (planning your evening). You cannot underwrite the cost of your own disappointment based on a guess. The "internal assertion" triggers the same norm.

  ### Testing Your Two-Part Rule

  Your candidate rule: *(1) Answer "how do you know?" without bluffing, and (2) grounds satisfying the pub must withstand scrutiny by whoever will act.*

  **Verdict:** It is robust, but it collapses into **The Norm of Underwritten Reliance** with one critical repair.

  **Where it works:**
  *   **Replication/Oath:** In the pub, "My source says so" answers (1). In court, it fails (2).
  *   **Silent Thought:** You cannot answer (1).
  *   **App/Taxi:** You answer "The app says so." The taxi driver acts, but the scrutiny is low.

  **Where it breaks (and needs repair):**
  *   **The Masthead:** An individual reporter *cannot* answer (1) for the aggregated story. They *must* bluff about knowing the whole picture. Your rule forbids the individual (correct) but implies the story *cannot be asserted at all* unless one person knows everything.
  *   **The Repair:** You must add a clause about **Distributed Agency**. "You may assert *p* if *your organization* can answer 'how do we know?' without bluffing, provided the organization accepts the liability."
  *   **The App/Lottery Asymmetry:** Your rule struggles here. In the pub, "The odds are 97%" and "The odds are 99.999%" are both valid answers to "How do you know?" If the pub accepts both, your rule permits both. To forbid the Lottery assertion, you must rely on the second clause ("scrutinized by whoever will act"). A friend holding a ticket *will* scrutinize that claim emotionally. This saves it, but only if you admit that "scrutiny" includes emotional stakes, not just logical verification.

  **Conclusion on your rule:** It is salvageable, but it is essentially a layman's phrasing of the **Stakes-Sensitive Knowledge Norm**. It does not offer a distinct advantage over the principle I proposed above, and it requires the "Institutional Agent" repair to handle the Masthead case.

  ### The Three New Cases

  Here is how **The Norm of Underwritten Reliance** adjudicates your unlisted scenarios.

  #### 1. The Automated Account (Airport Open/Closed)
  *   **Scenario:** An automated bot posts status updates based on a direct data feed. No human checks it.
  *   **Verdict:** **Fine.**
  *   **Reasoning:**
      *   *Warrant:* The data feed is the source. If the outlet has vetted the feed's reliability (Warrant), the lack of a human "checking" is irrelevant. The app/taxi case applies.
      *   *Agency:* The outlet stands behind the automation. If the feed is wrong and a passenger misses a flight, the outlet absorbs the reputational cost.
      *   *Caveat:* If the feed is known to be glitchy (low reliability), the Warrant clause fails, and the assertion becomes negligent.

  #### 2. The Reporter and the Shady Source
  *   **Scenario:** Reporter believes a claim based on a source who has lied before (but not about this). She asserts it in the paper's voice.
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:**
      *   *Warrant:* A source with a degraded track record does not provide evidence sufficient to rule out salient possibilities of error *for publication stakes*. Belief is present, but Warrant is not.
      *   *Agency:* The reporter is asking the Institution to underwrite the risk. The Institution cannot do so responsibly without corroboration.
      *   *Nuance:* If she asserts "Source X claims Y," that is Fine (reporting the speech act). If she asserts "Y is true," it is Not Fine.

  #### 3. The Election Night Projection (92% Model)
  *   **Scenario:** Model says 92% probability. Can the outlet write "She has won"?
  *   **Verdict:** **Not Fine.** (With a specific exception).
  *   **Reasoning:**
      *   *Warrant:* 92% leaves an 8% error rate (1 in 12). In the context of declaring a winner, the "salient possibility of error" is a recount, a concession reversal, or a late ballot surge. 92% is high for *analysis*, but low for *declaration*.
      *   *Agency:* The cost of error is catastrophic loss of credibility (the "2016 effect"). The outlet cannot underwrite an 8% risk of calling the wrong winner.
      *   *The Exception:* It becomes **Fine** if the assertion is qualified: "The model projects she has won" or "We project she has won." This shifts the assertion from *p* ("She won") to *q* ("Our model indicates she won").
      *   *Why:* You have warrant for *q* (you know what your model says). You do not have warrant for *p* (you do not know the votes are all counted/final). Most major outlets wait for >99% or actual concession to assert *p*.

  ### Summary of Sacrifices

  To maintain coherence, you must abandon the intuition that the **Airline App** and the **Lottery Ticket** are epistemically different in kind. They are both probabilistic assertions. The only reason one feels "Fine" and the other "Not Fine" is the **Stakes of Reliance**.
  *   If the taxi driver misses the gate, he loses 10 minutes.
  *   If your friend believes she won't win, she loses hope (or prepares for loss).
  *   If you treat them both as probabilistic, your style guide becomes consistent: **Assert only when the probability of truth exceeds the threshold required by the audience's reliance.**

  This moves your newsroom from a "Truth/Absolutism" model to a "Reliability/Responsibility" model. It fits the modern information environment better, where "truth" is often a aggregate of probabilities, but "responsibility" remains binary.
