          *   *Replication/Oath:* In pub, "Source says so" works. In court, "Source says so" fails clause 2 (scrutiny by court).
          *   *Verdict:* It's a strong pragmatic rule but collapses into a Stakes-Sensitive Knowledge Norm. It needs to account for *institutional* knowledge aggregation to save the Masthead case.

  6.  **Developing the Three New Cases:**
      *   *Automated Account:* No human checked.
          *   *Principle:* Is the system authorized? Is the warrant (data feed) actionable?
