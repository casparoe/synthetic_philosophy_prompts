  **Why MRE shifts the marginal:**
  MRE seeks the distribution "closest" to the prior that satisfies the constraint. In the standard Judy Benjamin problem (uniform prior), MRE reduces the probability of the territory mentioned (Red) because forcing the internal odds to change creates "entropy cost"; reducing the total weight of that territory mitigates the total divergence.
