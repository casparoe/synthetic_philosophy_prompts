      *   *Simplification for Living Room:* Instead of complex sums, have them roll until they get a 6. Record the 3 rolls *before* the 6. Average them. Compare to rolls where they *didn't* get a 6. Actually, that's not quite right.
      *   *Better Mechanic:* "Drift." Start at 0. Roll die. Add to total. If Total > 15, Stop. Record the Total at T-1, T-2, T-3 (where T is stop time). Average these across all players. Because you *must* be high to stop soon, the average trajectory of "stoppers" will look like it's rising faster than non-stoppers.
      *   *Actually, the Schurger point is about averaging trials locked to movement.* If I only look at trials where movement happened, and I align them at time 0 (movement), the average activity *before* 0 looks like a ramp, even if the underlying process is just noise.
      *   *Game Mechanic:* Everyone rolls dice continuously. When they feel like it (or when a threshold is met?), they stop.
