  Mnemonic triage proposes that collective remembrance should be managed based on present repair-value rather than historical magnitude. This shifts the ground of memory ethics from a backward-looking duty to a forward-looking utility. When evaluated against the competing frameworks of mandatory remembrance and strategic forgetting, triage reveals itself not as a reconciliation, but as a fundamental category error regarding what memory is owed to victims.

  The core tension lies in the nature of the obligation. The argument for a moral duty to remember posits that remembrance is a form of moral recognition owed to victims simply because they suffered. This is a deontological claim: the duty exists regardless of the consequences. To remember is to acknowledge the victim's standing as a moral agent who was wronged. If remembrance is owed, it cannot be contingent on whether recalling it produces beneficial social outcomes today. Mnemonic triage, by contrast, introduces a consequentialist calculus. It asks: does remembering this specific harm help us repair the present? If the answer is no, the memory is allowed to fade. This directly undermines the deontological structure. It treats memory as a resource to be allocated rather than a debt to be paid.

  Proponents of strategic forgetting argue that clinging to past atrocities often fuels cycles of violence. They suggest that forgetting is an ethical move to secure peace. Mnemonic triage attempts to split this difference by suggesting we don't forget everything, only what lacks repair-value. However, this is arguably the strategic forgetting argument in bureaucratic clothing. By prioritizing present stability or repair over historical magnitude, triage accepts the premise that the primary function of memory is social utility, not moral truth. If a atrocity was massive but remembering it causes present conflict without obvious repair, triage permits forgetting. This aligns with the skeptical view that memory is too dangerous to be mandated, rather than the view that memory is too sacred to be discarded.

  Can triage be reconciled with the duty to remember? Only if the definition of the duty is altered. If the duty binds us only to institutional maintenance or storage, triage might work as a cost-management strategy. We can archive everything but only ritually celebrate what helps repair. But if the duty binds us to emotional posture and repetition—the active keeping alive of the victim's claim—then triage violates the duty at its root. You cannot selectively honor victims based on how convenient their memory is for current politics. To do so is to instrumentalize the victim twice: first by harming them, and second by judging whether their suffering is useful enough to warrant recognition.

  Therefore, mnemonic triage cannot be reconciled with the strict deontological claim of owed remembrance. It imports a utilitarian framework that transforms memory from a right of the dead into a tool of the living. While it may be a pragmatic necessity for governance, it must be acknowledged as a violation of the ethical ideal, not a fulfillment of it. An ethical society might practice triage out of necessity, but it cannot claim it is doing so because it is what the victims are owed. It is what the living require. This distinction is crucial: triage manages the costs of memory, but in doing so, it sacrifices the unconditional nature of the debt.

