answer: |-
  **Seminar: Philosophy of Collective Memory**
  **Assessment: 90-Minute In-Class Essay**

  **Question:**

  You have been introduced to the concept of **Mnemonic Triage**: the proposal that collective remembrance should be treated as an active filtering process where a society decides which past harms receive sustained ritual attention and which are allowed to fade, based on *present repair-value* rather than *historical magnitude*.

  Write an essay evaluating whether Mnemonic Triage is merely the argument for strategic forgetting in bureaucratic clothing, or if it can be genuinely reconciled with the claim that remembrance is a moral duty owed to victims as a form of recognition. In your answer, you must specify what the duty to remember actually binds us to (e.g., archival storage, repetitive ritual, emotional posture, institutional maintenance) and argue whether triage violates that duty at its root or simply manages its practical costs.

  ***

  **Model Answer:**

  Mnemonic triage proposes that collective remembrance should be managed based on present repair-value rather than historical magnitude. This shifts the ground of memory ethics from a backward-looking duty to a forward-looking utility. When evaluated against the competing frameworks of mandatory remembrance and strategic forgetting, triage reveals itself not as a reconciliation, but as a fundamental category error regarding what memory is owed to victims. To understand why, we must dissect what the duty to remember actually binds us to.

  The argument for a moral duty to remember posits that remembrance is a form of moral recognition owed to victims simply because they suffered. This is a deontological claim: the duty exists regardless of the consequences. To remember is to acknowledge the victim's standing as a moral agent who was wronged. If remembrance is owed, it cannot be contingent on whether recalling it produces beneficial social outcomes today. The duty binds us not merely to storage—the archival preservation of facts—but to an emotional posture and institutional maintenance that keeps the claim of the victim alive in the present. It requires repetition and ritual. Mnemonic triage, by contrast, introduces a consequentialist calculus. It asks: does remembering this specific harm help us repair the present? If the answer is no, the memory is allowed to fade. This directly undermines the deontological structure. It treats memory as a resource to be allocated rather than a debt to be paid.

  Proponents of strategic forgetting argue that clinging to past atrocities often fuels cycles of violence. They suggest that forgetting is an ethical move to secure peace. Mnemonic triage attempts to split this difference by suggesting we don't forget everything, only what lacks repair-value. However, this is arguably the strategic forgetting argument in bureaucratic clothing. By prioritizing present stability or repair over historical magnitude, triage accepts the premise that the primary function of memory is social utility, not moral truth. If an atrocity was massive but remembering it causes present conflict without obvious repair, triage permits forgetting. This aligns with the skeptical view that memory is too dangerous to be mandated, rather than the view that memory is too sacred to be discarded. The distinction lies in the justification: strategic forgetting admits memory is dangerous; triage claims memory is expensive and must be budgeted.

  Can triage be reconciled with the duty to remember? Only if the definition of the duty is altered. If the duty binds us only to institutional maintenance or storage, triage might work as a cost-management strategy. We can archive everything but only ritually celebrate what helps repair. But if the duty binds us to emotional posture and repetition—the active keeping alive of the victim's claim—then triage violates the duty at its root. You cannot selectively honor victims based on how convenient their memory is for current politics. To do so is to instrumentalize the victim twice: first by harming them, and second by judging whether their suffering is useful enough to warrant recognition.

  Therefore, mnemonic triage cannot be reconciled with the strict deontological claim of owed remembrance. It imports a utilitarian framework that transforms memory from a right of the dead into a tool of the living. While it may be a pragmatic necessity for governance, it must be acknowledged as a violation of the ethical ideal, not a fulfillment of it. An ethical society might practice triage out of necessity, but it cannot claim it is doing so because it is what the victims are owed. It is what the living require. This distinction is crucial: triage manages the costs of memory, but in doing so, it sacrifices the unconditional nature of the debt. It resolves the tension between remembering and forgetting not by satisfying the duty, but by redefining the duty as a policy choice. This is why triage is ultimately closer to the case for forgetting than the case for remembrance; both subordinate the past to the needs of the present, whereas the duty to remember demands the present subordinate itself to the past.

  ***

  **Marking Scheme**

  **A Grade (Excellent)**
  *   **Ethical Framework:** Explicitly identifies the structural conflict between the **consequentialist calculus** of Mnemonic Triage (repair-value/utility) and the **deontological structure** of the duty to remember (owed/recognition).
  *   **Specificity:** Clearly specifies which element of remembrance is sacrificed by triage (e.g., the unconditional nature of recognition, the emotional posture, or the ritual repetition) rather than treating memory as a monolith.
  *   **Argumentation:** Moves beyond summary to argue *why* triage fails to reconcile the two positions. It recognizes that triage is not a middle ground but a subordination of the past to present needs, aligning it structurally with strategic forgetting despite different branding.
  *   **Nuance:** Acknowledges that triage might be pragmatically necessary but insists this does not make it ethically consistent with the duty to remember.

  **B Grade (Good)**
  *   **Summary:** Accurately summarizes the positions of the duty to remember (Margalit-esque) and strategic forgetting (Rieff-esque).
  *   **Compromise:** Treats Mnemonic Triage primarily as a "middle ground" or compromise solution without sufficiently probing the ethical incompatibility.
  *   **Vagueness:** Discusses the duty to remember in general terms (e.g., "we should remember") without dissecting what the duty binds us to (storage vs. emotion vs. institution).
  *   **Conclusion:** Concludes that triage is a viable solution because it balances the costs and benefits, missing the key philosophical objection that some duties cannot be balanced against costs.
