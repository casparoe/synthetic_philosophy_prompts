      *Key argument to drive home:* When you say "It is raining," you are inviting me to look at the world. When you say "I don't believe it," you are inviting me to look at your mind. Moore's paradox shows that these two invitations cannot be issued simultaneously without canceling each other out. Why? Because your mind *is* the lens through which you show me the world. You can't point out the lens while looking through it.

      *Refining the "Stand":* The paradox teaches us that **self-knowledge is not observational but avowal-based.** We know our own beliefs not by looking inside, but by recognizing what we are willing to stand by.

      *Wait, one more refinement:* The user asked about "Rational Agent," "Self-Knowledge," "Logic of Speech." I should pick one. I think **Rational Agency** encompasses the others. To be a rational agent is to be capable of this transparency. I will argue that Moore's Paradox reveals the **constitutive norms of rational agency.**

  8.  **Final Polish:** Check against constraints.
      *   Definite stand? Yes (Constitutive norms of agency).
      *   No survey? Yes.
      *   Force of reasoning? Yes.
