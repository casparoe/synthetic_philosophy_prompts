answer: |-
  There is a single principle that fits all your verdicts without requiring you to abandon any of them, provided you accept one specific distinction as morally fundamental.

  ### The Principle: The Threshold of Significant Experience

  **Moral weight aggregates across people only when the burden on each individual crosses a threshold of phenomenological significance (noticeability). Burdens below this threshold do not aggregate across lives, but they do aggregate within a single life.**

  Here is how this principle maps onto your cases:

  1.  **Specks vs. Torture:** A dust speck is below the threshold of significant experience. It is phenomenologically negligible. Because it is negligible for each individual, you cannot sum these "zeros" across a billion people to outweigh a catastrophic harm to one. The total moral weight of the specks remains near-zero, regardless of $N$.
  2.  **Risk vs. Torture:** A one-in-a-billion *chance of torture* is not a speck. The *stakes* are above the threshold, even if the probability is low. The moral weight is the severity of the outcome discounted by probability. The expected burden is "one torture," which is massive. This outweighs the negligible burden of the specks.
  3.  **One Person vs. Many (Specks):** Within a single life, negligible burdens *do* accumulate. Ten years of specks is no longer a series of zeros; it becomes a continuous, noticeable torment for that one person. The *total experience* for that individual crosses the significance threshold. Now you are comparing one significant harm (torture) against another significant harm (a life of torment), and the longer torment wins.
  4.  **Minutes vs. Torture:** Losing a minute of life is above the threshold of significance. It is noticeable and meaningful. Because it is significant for each individual, it aggregates across people. A million minutes is a massive amount of life, outweighing the torture. This explains why minutes behave differently than specks: minutes are "real" harms; specks are "null" harms.
  5.  **Background Specks:** Your ambivalence here is the only wobble. The principle predicts that if specks are truly below the threshold of significance, the baseline shouldn't matter. Whether you cause a null event or fail to prevent one, the moral weight is null. To make your view fully consistent, you should resolve this by accepting that **if the harm is below the threshold, the distinction between causing and allowing collapses.** It doesn't matter.

  ### The Inconsistency Resolution
  You felt it was inconsistent that specks add up inside a life but not across lives. The principle resolves this by making the **individual life** the unit of moral accounting.
  *   **Across lives:** We compare the *significant* claims of Person A against the *significant* claims of Person B. If Person B's claim is null (specks), it cannot override Person A's vital claim.
  *   **Inside a life:** We look at the *total* claim of Person B. If enough nulls accumulate to become a vital claim, it now counts.

  ### The Prediction
  **Case:** Ten thousand people each getting a mild but clearly noticeable headache for an hour, versus one person getting a broken arm.

  **Analysis:**
  1.  **Noticeability:** You specified the headache is "clearly noticeable." This places it **above the threshold** (unlike the specks, like the minutes).
  2.  **Aggregation:** Because the headache is above the threshold, the harms **do aggregate** across the ten thousand people.
  3.  **Comparison:** You previously judged that a million minutes of life (tiny but noticeable) outweighs one torture (catastrophic). A broken arm is severe, but generally considered less severe than torture. Ten thousand hours of headache is a massive aggregate burden.

  **Verdict:**
  **The headaches are worse.** You should prevent the headaches even at the cost of the broken arm.

  **Why:** Your gut treats "imperceptible" harms (specks) as moral zeros that cannot sum across people. But "noticeable" harms (minutes, headaches) are moral positives that do sum. Since the headache is noticeable, it behaves like the minutes, not the specks. Since you allowed minutes to outweigh torture, you must allow headaches to outweigh a broken arm.
