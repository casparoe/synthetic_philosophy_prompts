answer: |-
  Elena, a mid-level accountant, adheres strictly to a maximizing moral theory, donating every dollar above subsistence to effective charities and spending every weekend volunteering where need is greatest. Her colleagues receive her consistent aid and financial contributions, yet they regard her with indifference rather than admiration, perceiving her actions not as generous gifts but as discharged debts, like a clerk handing over owed change. Because her theory dictates that every optimific act is obligatory, she never performs a kindness that exceeds expectation, rendering her moral record a flat line of mandatory correctness where the ceiling of duty coincides with the floor. She is morally flawless, yet inspires no gratitude, because she leaves no room for supererogation, transforming every virtue into a mere requirement and every contribution into a bill paid.

  **Analysis of the Case**

  **The Demanding Theory's Verdict:**
  Under a Singer-style act consequentialism, Elena is morally perfect. The theory holds that an agent ought to perform the action that produces the best overall consequences. Since Elena redirects nearly all discretionary resources to the most effective causes, she is maximizing the good. There is no gap between what she does and what she ought to do; she is in full compliance. The theory views her life as the ideal moral life because she has minimized suffering and maximized well-being to the greatest extent possible.

  **The Driver-Style Saint Critique vs. The Supererogation Point:**
  Julia Driver's objection to moral saints typically focuses on the *content* of the saint's life: the saint is unadmirable because they lack personal projects, hobbies, or spontaneous relationships, rendering them one-dimensional or boring. Driver argues that a life devoid of non-moral pursuits is deficient in value. However, the objection raised by Elena's case is distinct. It does not matter if Elena has hobbies or enjoys her work; the lack of admiration stems from the *normative status* of her actions. Because the demanding theory collapses the supererogatory into the obligatory, Elena never acts "above and beyond." Admiration and gratitude conceptually require that the agent could have done less but chose to do more. By making the moral minimum identical to the moral maximum, the theory eliminates the possibility of moral generosity. Elena is unadmirable not because she is boring (Driver), but because she is a moral robot who never exercises the option to be excellent rather than merely compliant.

  **Revision and The Defender's Attack:**
  If the theory were revised to admit a zone of supererogation—for example, by setting a baseline requirement (e.g., donate 10%) while classifying higher donations as optional but good—Elena could choose to donate 90%. In this revised framework, her actions would regain their admirability because they would exceed the call of duty, restoring the gap between the floor and the ceiling.

  However, a defender of the demanding theory would attack this supererogation objection on two grounds. First, **incoherence**: If donating 90% produces better consequences than 10%, rationality dictates it is required. To call the better act "optional" is to admit irrationality into the moral system; if it is genuinely good to do, it is incoherent to say one is not required to do it. Second, **triviality**: The objection relies on human psychological responses (gratitude, admiration) rather than moral truth. That colleagues feel less gratitude because Elena's help was mandatory is a sociological fact about human ego, not a philosophical refutation of the theory. A demanding theorist would argue that morality should not be tailored to preserve our feelings of generosity; if Elena's actions save the most lives, her lack of admirability is a trivial cost compared to the value of her compliance.
