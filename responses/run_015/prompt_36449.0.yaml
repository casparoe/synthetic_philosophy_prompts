answer: |-
  Here is a complete seminar plan designed for 14 students, 90 minutes, focusing on the visceral experience of a multipolar trap.

  ### Seminar Overview
  *   **Topic:** Multipolar Traps / Moloch / Races to the Bottom.
  *   **Time:** 90 Minutes.
  *   **Students:** 14.
  *   **Goal:** To create a situation where rational self-interest leads to collective ruin, and where "being the good guy" guarantees personal loss.
  *   **Materials:** Printed scorecards (or slips of paper), pens, a whiteboard, and a bag of high-quality chocolates (or similar tangible prize).

  ---

  ### Part 1: The Game Design ("The Efficiency Race")

  **Premise:**
  Tell the students they are competing AI algorithms running on a shared server cluster. Their goal is to process as much data as possible to earn "Compute Credits". However, running at high intensity generates heat. If the total heat exceeds the cooling capacity, the system throttles, penalising everyone.

  **The Trap:**
  The penalty for overheating is proportional. Therefore, the algorithm that runs the hottest *still* beats the algorithm that ran cool, even after the penalty is applied. Unilateral restraint is suicide.

  **Setup:**
  *   **Group:** All 14 students play in one single pool.
  *   **Currency:** "Credits" (written on the whiteboard or individual scorecards).
  *   **Rounds:** 5 Rounds.
  *   **Prize:** The top 5 students with the most credits at the end win a chocolate bar each. The rest get nothing. (This relative scarcity is crucial; if everyone can win, the trap dissolves).

  **Rules:**
  1.  **The Choice:** Each round, every student secretly writes down a number between **1 and 10**.
      *   **1** = Low Intensity (Safe).
      *   **10** = Maximum Intensity (Risky).
  2.  **The Gain:** You gain credits equal to the number you wrote. (If you write 10, you get 10 credits).
  3.  **The Heat:** The Facilitator sums all 14 numbers. This is the **Total Heat**.
  4.  **The Threshold:** The Cooling Threshold is **90**. (This averages to ~6.4 per student).
  5.  **The Crash:**
      *   If Total Heat $\le$ 90: No penalty. Everyone keeps their points.
      *   If Total Heat $> 90$: System Overheat. **Everyone loses 40% of their *total accumulated* score.** (Not just that round's score).
  6.  **Communication:**
      *   Rounds 1 & 2: No talking.
      *   Round 3: 2 minutes of open discussion allowed before writing.
      *   Round 4: No talking.
      *   Round 5: 2 minutes of open discussion allowed.

  **Why this works mathematically:**
  *   **Scenario A (Cooperation):** Everyone chooses 6. Total Heat = 84. Safe. Everyone gains 6 points per round.
  *   **Scenario B (Defection):** You choose 10, others choose 6. Total Heat = 88. Safe. You gain 10, they gain 6. You pull ahead in the rankings.
  *   **Scenario C (The Crash):** Everyone chooses 10. Total Heat = 140. Crash. Everyone loses 40% of their stack.
      *   *Crucially:* Even after a 40% loss, the person who played 10 still has more points than the person who played 6.
      *   *Example:* After 3 rounds, Cooperator has 18 pts. Defector has 30 pts.
      *   Crash happens (40% loss). Cooperator has 10.8. Defector has 18.
      *   The Defector is still winning. The Co-operator has sacrificed their chance at the chocolate *and* failed to save the group.

  ---

  ### Part 2: Run of Play (90 Minutes)

  **1. Introduction (10 Minutes)**
  *   Do **not** mention Moloch, Game Theory, or Prisoner's Dilemmas yet.
  *   Hand out scorecards. Explain the "AI Algorithm" premise.
  *   Emphasise the prize: "Only the top 5 scores get chocolate. It is a competitive ranking."
  *   Check understanding: Ask a student to calculate a sample score to ensure they understand the 40% penalty applies to the *total*, not just the round.

  **2. The Game (30 Minutes)**
  *   **Round 1 (Silent):** Collect numbers. Calculate Total Heat. Announce the result and update scores publicly on the whiteboard.
      *   *Likely outcome:* Curiosity. Many will play 8-10 to test the waters. Heat likely exceeds 90.
  *   **Round 2 (Silent):** Repeat.
      *   *Likely outcome:* If Round 1 crashed, some may lower numbers. If not, numbers will rise.
  *   **Intermission (Discussion):** Allow the 2-minute talk.
      *   *Watch for:* Students trying to form a pact ("Let's all play 5!").
      *   *Your role:* Do not enforce the pact. Just listen.
  *   **Round 3 (Post-Talk):** Collect numbers.
      *   *Likely outcome:* Someone will betray the pact to secure the top spot. The Heat will likely spike.
  *   **Round 4 (Silent):** Repeat.
  *   **Round 5 (Final Talk & Play):** Final 2-minute talk, then final bid.
      *   *Note:* Announce that this is the last round. This triggers "end-game" defection.

  **3. The Reveal & Debrief (45 Minutes)**
  *   Distribute chocolates to the top 5. Acknowledge the losers.
  *   **Phase 1: The Autopsy (15 mins)**
      *   Ask the losers: "Did you want the group to crash?" (No). "Did you know what would happen if everyone played 10?" (Yes). "Why did you play high?" (Because I couldn't trust others / I needed to stay in the top 5).
      *   Ask a winner: "Did you feel good about winning?" (Usually no, they feel guilty or relieved).
      *   Ask anyone who tried to play low (1-4): "What happened to your score?" (They sank to the bottom). **Highlight this:** *Your virtue was punished.*
  *   **Phase 2: Mapping to Theory (20 mins)**
      *   Now introduce the terms.
      *   **Multipolar Trap:** It wasn't one villain; it was the structure of the incentives.
      *   **Moloch:** The "system" that demanded growth over safety.
      *   **Unenforceable Agreements:** Refer to the 2-minute talk. Why didn't the pact hold? (Because there was no mechanism to punish the liar, only the system punished everyone).
      *   **Relative vs. Absolute:** Point out that if the goal was "Total Group Points", they would have cooperated. Because the goal was "Top 5", they had to crush each other.
  *   **Phase 3: Real World Application (10 mins)**
      *   Ask them to map this to: AI arms races, climate change agreements, clickbait journalism, or doping in sports.
      *   Close with Scott Alexander's core point: *You cannot defeat Moloch by asking nicely. You must change the incentives.*

  ---

  ### Part 3: Honest Critique (What Will Go Wrong)

  You asked for honesty. Here is where this simulation usually fractures, and how to handle it.

  **1. The "Hero" Problem**
  *   **What happens:** One morally stubborn student decides to play '1' every round to prove a point, regardless of the score.
  *   **The Risk:** They might try to rally others to sacrifice themselves too.
  *   **The Fix:** In the debrief, do not let them off the hook. Ask: "Did your sacrifice stop the crash? No. Did it help you win? No. In a multipolar trap, martyrdom is not a strategy; it is merely exiting the game." This is a hard lesson but essential for the topic.

  **2. Successful Collusion**
  *   **What happens:** In a small group of 14, they might actually trust each other enough to all play '6' and keep the system stable.
  *   **The Risk:** The game "fails" because they solved the trap.
  *   **The Fix:** If this happens, congratulate them, then **break it**. Before the final round, whisper to the student sitting closest to you: *"If you play 10 this round, you are guaranteed a chocolate bar. No one will know it was you."*
      *   This introduces asymmetric information and temptation, replicating the real-world pressure where one actor (e.g., a nation or company) secretly defects.

  **3. Apathy / "It's Just a Game"**
  *   **What happens:** Students don't care about the points or the chocolate. They treat it as a maths puzzle.
  *   **The Risk:** They won't *feel* the anxiety of the trap.
  *   **The Fix:** The stakes must be social. Publicly track the leaderboard on the whiteboard after every round. Shame and status are powerful motivators. If they are too chill, remind them: "In the real world, the losers of this game go bankrupt. Here, you just miss out on sweets. Imagine the stakes were your livelihood."

  **4. Confusion over the Penalty**
  *   **What happens:** Students miscalculate the 40% penalty and think they can recover easily.
  *   **The Fix:** Keep a running total on the board. When a crash happens, physically cross out the old numbers and write the new, lower numbers. Make the loss visible.

  ---

  ### Part 4: Limitations of the Simulation

  In your closing remarks, you must acknowledge what the game *cannot* teach them. This prevents oversimplification.

  **1. The "God" Facilitator**
  *   **Limitation:** In the game, *you* set the rules. You can change the Threshold or the Penalty between rounds if you wanted to.
  *   **Reality:** Moloch has no facilitator. There is no one to call to change the laws of physics or economics. The rules are emergent and rigid.
  *   **Lesson:** In the real world, we have to build the institutions that act as the "Facilitator" (regulations, treaties), but there is no higher power to enforce them.

  **2. Perfect Information**
  *   **Limitation:** In the game, students know the payoff matrix. They know exactly how many points a crash costs.
  *   **Reality:** In multipolar traps (like AI safety or bio-risk), we often don't know the threshold until we cross it. The uncertainty usually makes people *more* cautious, but competitive pressure often overrides that caution.

  **3. Entry and Exit**
  *   **Limitation:** The 14 students are locked in the room.
  *   **Reality:** In the wild, if the game becomes too toxic, players can sometimes exit the market (go bankrupt) and new, more reckless players can enter. Moloch often selects for the most ruthless entrants.

  **4. The Reset Button**
  *   **Limitation:** After 90 minutes, they leave the seminar. The game ends.
  *   **Reality:** Multipolar traps are iterative and infinite. There is no "end of the seminar." The pressure continues tomorrow. The psychological burden of knowing you are trapped in a loop is harder to simulate in a one-off session.

  ### Final Note for the Tutor
  When you run this, you will feel like the villain. You will see students look at each other with suspicion. You will see the "good" students lose. **Lean into this discomfort.** That feeling of helplessness in the face of broken incentives *is* the lesson. Do not rescue them. Let Moloch win the game, so you can explain how to defeat him in the theory.
