prompt: |-
  i teach a small seminar on collective action problems (14 students, 90 minutes) and next week's topic is multipolar traps -- scott alexander's "meditations on moloch" style stuff, races to the bottom where everyone can see the bad equilibrium coming and no one can stop stepping towards it. reading the essay is fine but i want them to *feel* the trap before we name it, so i want an in-class game where the incentives are arranged such that a perfectly rational, fully informed player still ends up in the losing equilibrium, and where at least one player who tries to unilaterally de-escalate gets punished for it.

  design me the game: rules, rounds, whatever points/currency scheme works without real money, how many players per group, and how long each phase should take. i want the debrief to map specific moments in play onto the concepts (defection pressure, unenforceable agreements, the punishment for being the only cooperative agent, why "everyone agrees this is bad" doesn't help) rather than me just lecturing about moloch after the fact. also tell me honestly what will go wrong the first time i run it -- i'm guessing some groups will collude successfully or just get confused about the payoff matrix -- and what part of the real-world phenomenon the game fundamentally can't reproduce no matter how i tune it (e.g. moloch in the wild doesn't have a facilitator who can change the rules between rounds, or players who can see the whole payoff matrix). please write the whole thing in british english.
