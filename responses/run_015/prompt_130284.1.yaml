      *   *Point 4: Procedural vs. Structural Rationality.* This is the strongest lever. Procedural (Habermasian communicative action) vs. Structural (Foucaultian governmentality). If we distinguish these, we see they are talking past each other. One talks about *argumentation*, the other about *administration*.
      *   *Point 5: The "Good vs. Bad" Framing.* The user asks if the framing is ill-posed. Yes. "Was the Enlightenment good?" is a category mistake. It's a heterogeneous assemblage. We need to move from *judgment* to *appropriation*.
