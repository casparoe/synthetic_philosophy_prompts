  7.  **Writing the Response:** (Focusing on tone: academic, rigorous, empathetic to the seminar context, avoiding clichés.) *Self-Correction during drafting:* Make sure I explicitly answer the specific questions posed in the prompt (empirical? metaphysical? category error? procedural/structural? framing? data?).

