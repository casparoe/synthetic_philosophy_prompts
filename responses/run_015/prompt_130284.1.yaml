  *(Refining the "Data" point)*: If one side sees a census as "data for public health" and the other as "data for control," the conflict isn't about the numbers, it's about the *telos* embedded in the collection method. The resolution isn't finding new data, but analyzing the *design* of the data collection.

  *(Final Plan)*:
