  HR summoned me regarding a budget error from last year.

  "I'm not liable," I argued. "That was a past temporal part. I'm a later stage."

  "Fine," said HR. "We'll terminate the offending part."

  "You can't fire a part," I replied. "I'm a coarse-grained perdurantist. There's no privileged grain dividing last year's me from now. The boundary is vague."

  HR shrugged. "Then the termination is equally vague. You're both fired and not fired."

  "Do I get severance?"

  "Indeterminate. Come back when you've precisified your existence."

  ***

  This joke relies on coarse-grained vagueness. Standard perdurantism posits sharp instantaneous slices, requiring a punchline about firing specific time-slices rather than indeterminate status.
