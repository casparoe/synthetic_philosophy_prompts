  # MEMORANDUM OF UNDERSTANDING AND DISAGREEMENT
  **Working Group on Citizens' Assembly Decision Rules**
  **Subject:** Aggregation Protocols for Housing and Transport Proposals
  **Date:** October 24, 2023

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both the "Reasons First" (Premise-Based) and "Verdict First" (Conclusion-Based) camps as accurate descriptions of the logical and structural constraints facing this assembly.*

  1.  **The Discursive Dilemma is Structural, Not Accidental:** Both camps acknowledge that for any set of proposals governed by the doctrine *Adopt iff P and not-Q*, there exist voter profiles where Premise-Based Aggregation (PBA) and Conclusion-Based Aggregation (CBA) yield contradictory outcomes. This is not a result of voter confusion or ballot error, but a mathematical feature of majority rule over connected propositions.
  2.  **Impossibility Constraints:** We acknowledge that no decision rule can simultaneously satisfy Universal Domain (accepting any pattern of voter judgments), Collective Rationality (logical consistency of the output), Anonymity (equal weight per voter), and Independence (proposition-by-proposition voting). Choosing a rule requires sacrificing at least one of these conditions.
  3.  **The Variable Electorate Complication:** The standing arrangement wherein one-third of members defer on *P* (technical efficacy) but vote on *Q* (distributional impact) creates a "variable electorate." Standard impossibility theorems assume a fixed demos. We agree that this specific feature allows for collective judgment sets that may not correspond to any coherent position held by a fixed subset of the assembly.
  4.  **Framing Sensitivity (The Q vs. Q* Problem):** We agree that the definition of premises is not neutral. Changing the premise from *Q* ("costs fall disproportionately") to *Q** ("cost burden is unjust") alters the logical pathway. Since members vote differently on *Q* than *Q**, the choice of doctrine formulation is itself a decision rule that can determine outcomes independent of voter intent on the measure itself.
  5.  **Precedential Lock-in:** Because assembly decisions run for two years and early votes serve as precedent, the aggregation rule chosen now will constrain the logical space available for future proposals. A rule that produces inconsistent precedents early will force later assemblies into either contradiction or arbitrary exception-making.

  ## 2. DISAGREEMENTS TABLE
  *Positions are stated in the strongest form argued by each camp.*

  | Issue | Reasons First (Premise-Based) | Verdict First (Conclusion-Based) |
  | :--- | :--- | :--- |
  | **Primary Legitimacy** | Legitimacy derives from the **consistency of public reason**. The city must be able to cite a coherent set of reasons (*P* is true, *Q* is false) for every law. A verdict that contradicts the premises undermines the state's ability to justify its actions to citizens. | Legitimacy derives from the **authority of the majority will**. The assembly was convened to decide *what to do*, not to publish a logic puzzle. A rule that allows a majority to lose on the outcome because of how the ballot was carved up treats the voters as means to a logical end, not ends in themselves. |
  | **Variable Electorate** | The split electorate is a **feature of competence**. Technical questions (*P*) should be decided by those willing to engage with evidence (or the panel), while moral questions (*Q*) belong to the whole. This ensures premises are factually grounded before being weighed politically. | The split electorate is a **violation of political equality**. If the outcome determines who is governed, every governor must have a vote on the outcome. Allowing a technical subset to dictate a necessary condition (*P*) for a vote they may not care about gives them veto power over the political majority. |
  | **Doctrinal Framing (Q vs. Q*)** | Premises must be **fixed prior to voting** to ensure logical integrity. Whether we use *Q* or *Q** is a legislative choice about standards, not a voting anomaly. Once fixed, the rule must route through them consistently to prevent ad-hoc moralizing. | Premise selection is **agenda control**. If swapping *Q* for *Q** flips the result without changing the measure, the rule is manipulable. The "Verdict" is the only stable anchor; premises should be treated as explanatory notes, not binding gates that can be gamed by semantic refinement. |
  | **Handling Contradiction** | If PBA and CBA diverge, **PBA must prevail**. A contradictory verdict (Adopt, despite believing *not-P* or *Q*) forces the administration to implement a policy it cannot logically defend. This invites legal challenge and administrative sabotage. | If PBA and CBA diverge, **CBA must prevail**. A contradictory premise set (Believing *P* and *not-Q*, but Rejecting) is harmless; it simply means the majority exercised discretion. A contradictory verdict is an operational crisis; a contradictory reason is merely a philosophical tension. |

  ## 3. THE VARIABLE ELECTORATE PATHOLOGY
  *The following profile demonstrates the specific risk introduced by the partial-deferral setup.*

  **The Setup:**
  *   **Total Assembly:** 5 Members (A, B, C, D, E).
  *   **Electorate for P (Technical):** A, B, C (D and E defer/abstain).
  *   **Electorate for Q (Distribution):** A, B, C, D, E (All vote).
  *   **Doctrine:** Adopt if *P* is True AND *Q* is False.

  **The Profile:**
  *   **Member A:** *P*=True, *Q*=True (Votes: Reject)
  *   **Member B:** *P*=True, *Q*=True (Votes: Reject)
  *   **Member C:** *P*=False, *Q*=False (Votes: Adopt)
  *   **Member D:** (Abstains P), *Q*=False (Votes: Adopt)
  *   **Member E:** (Abstains P), *Q*=False (Votes: Adopt)

  **The Aggregation (Premise-Based):**
  1.  **Vote on P:** A (T), B (T), C (F). **Majority: True.**
  2.  **Vote on Q:** A (T), B (T), C (F), D (F), E (F). **Majority: False.**
  3.  **Derived Verdict:** *P*(True) AND *not-Q*(True) $\rightarrow$ **Adopt.**

  **The Pathology:**
  *   **Collective Judgment:** { *P*=True, *Q*=False, Adopt }.
  *   **Individual Endorsement:**
      *   A and B hold { *P*=T, *Q*=T }.
      *   C holds { *P*=F, *Q*=F }.
      *   D and E hold { *P*=N/A, *Q*=F }.
  *   **Result:** **No individual member endorses the collective judgment set.** The assembly has adopted a measure based on the premise that it works (*P*) and is fair (*not-Q*), yet every single member either thinks it is unfair (A, B) or doesn't work (C).
  *   **Fixed Electorate Check:** If the electorate were fixed at {A,B,C}, *Q* would be True (2-1), and the measure would fail. If the electorate were fixed at {A,B,C,D,E} (treating abstention as No), *P* would be False (2-3), and the measure would fail. **This outcome is only possible because the electorate shifts between propositions.**

  **Analysis: Pathology or Feature?**
  *   **Reasons First:** This is a **Feature**. It reflects the specific mandate of the assembly: technical validity is determined by the engaged subset, distributional fairness by the whole. The fact that no single person holds the view is irrelevant; the *institution* holds the view by combining the competence of the few with the consent of the many.
  *   **Verdict First:** This is a **Pathology**. It creates a "Frankenstein Mandate." The administration is told to implement a policy based on reasons that no actual citizen believes. This is not representation; it is algorithmic synthesis that dissolves accountability. If challenged, no constituent can say, "I voted for this logic."

  ## 4. CRUCES AND TESTS
  *For each disagreement, we identify a concrete hypothetical outcome. Both camps agree that if these cases arise, they will bear heavily on the viability of the chosen rule.*

  ### Crux 1: The "Unpopular Truth"
  **Case:** A transport measure where the Technical Panel confirms *P* (True), and cost analysis confirms *not-Q* (False), but a direct majority of the full assembly wishes to Reject (perhaps due to NIMBYism or unrelated political grievances).
  *   **PBA Outcome:** Adopt (overruling the direct majority).
  *   **CBA Outcome:** Reject (overruling the premises).
  *   **Prediction (Reasons First):** If we choose CBA, the Assembly will eventually pass a measure that is demonstrably ineffective or harmful, destroying the city's trust in the Assembly's technical rigor.
  *   **Prediction (Verdict First):** If we choose PBA, the Assembly will be seen as a rubber stamp for technocrats. Membership will drop, and the "deference" clause will be exploited to bypass democratic will.

  ### Crux 2: The "Moralized Flip"
  **Case:** A housing proposal where costs fall on lower-income households (*Q* = True), but the proposal includes a mitigation fund that makes the burden arguably "just" (*Q** = False). 40% of the assembly vote differently on *Q* than *Q**.
  *   **PBA Outcome:** The outcome flips depending on which doctrine (*Q* or *Q***) is codified in the charter.
  *   **CBA Outcome:** The assembly votes on "Adopt?" directly; the *Q/Q** distinction is debated in deliberation but does not mechanically gate the vote.
  *   **Prediction (Reasons First):** If we choose CBA, we invite "doctrinal gerrymandering." Camps will fight endlessly over the definition of *Q* before every vote, paralyzing the assembly. PBA forces us to settle the standard once.
  *   **Prediction (Verdict First):** If we choose PBA, the minority who prefer *Q* will claim the rule is rigged when *Q** is chosen (or vice versa). The mechanical dependency on semantic framing makes the rule appear arbitrary.

  ### Crux 3: The Compromise Proposal (Dual-Procedure Veto)
  **Proposal:** Run both PBA and CBA. If they agree, the measure passes/fails. If they disagree, the measure fails (Status Quo).
  *   **Can Both Camps Sign?**
      *   **Reasons First:** **Tentative Yes.** This prevents "irrational" verdicts (CBA overriding PBA). It treats logical consistency as a necessary condition for action.
      *   **Verdict First:** **No.** This relocates the disagreement rather than solving it. It effectively gives the Premise-Based logic a **veto** over the Majority Will. In a status-quo biased system (housing/transport), this guarantees gridlock. It privileges the "Reasons" camp's fear of inconsistency over the "Verdict" camp's fear of disenfranchisement.
  *   **Shared Risk:** Both camps agree this creates a "hidden minority veto." A minority of 1/3 + 1 can ensure PBA and CBA diverge (by voting strategically on premises), thereby triggering the Status Quo fail-safe.

  ## 5. VERBAL DISPUTES
  *We identify the following areas where disagreement may be semantic rather than substantive.*

  1.  **"Rationality":**
      *   *Reasons First* uses "Rationality" to mean **Logical Consistency** (no contradictions in the judgment set).
      *   *Verdict First* uses "Rationality" to mean **Instrumental Responsiveness** (the output matches the aggregate preference of the voters).
      *   *Resolution:* If we agree that "Consistency" and "Responsiveness" are distinct goods that trade off, we can stop arguing about which procedure is "more rational."

  2.  **"The Question":**
      *   *Reasons First* argues the Assembly was asked: "Is this good policy according to the Doctrine?"
      *   *Verdict First* argues the Assembly was asked: "Do you want this policy?"
      *   *Resolution:* Check the City Charter. If the Charter mandates the Doctrine as a binding constraint, Reasons First is procedurally correct. If the Charter mandates the Doctrine as a "guiding principle," Verdict First is procedurally correct. This is a legal interpretation, not a philosophical one.

  3.  **"Deference":**
      *   *Reasons First* treats deference on *P* as **Epistemic** (they know better).
      *   *Verdict First* treats deference on *P* as **Procedural** (they are opting out of the vote).
      *   *Resolution:* If deference is epistemic, the Technical Panel's view should arguably carry more weight than a simple majority of the subset. If it is procedural, those voters are simply absent. The current rule treats it as procedural (counting heads of those who vote), which both camps agree is unstable.

  ***

  **Next Steps:**
  Both camps agree to test the "Dual-Procedure Veto" against the 5-Voter Pathology Profile. If the Veto triggers Status Quo on that profile, Verdict First will reject it. If it passes, Reasons First will accept it only if the Charter is amended to define *Q* vs *Q** definitively to prevent framing manipulation.
