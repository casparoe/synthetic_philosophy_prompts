          *   *Funding/Validation Side:* Evaluates models by comparing outputs to historical records. Discrepancies = representational failures. Goal = mirror nature accurately (correspondence truth).
      *   **Questions to Answer:**
          *   What philosophical commitments does this bifurcation presuppose?
          *   Does the policy side imply antirepresentationalism/neopragmatism (Rorty)?
          *   Does the validation side imply representationalism/correspondence theory?
          *   Reconstruct the implicit theory of scientific knowledge allowing coexistence.
