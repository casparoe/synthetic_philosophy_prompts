      *   **Section 5: Consistency Check.** Is this stable? Or is it a ticking philosophical bomb?
      *   **Conclusion:** The verdict.

  4.  **Fleshing out the Philosophical Concepts:**

      *   *Rorty/Neopragmatism:* "Truth is what works." Language (and models) are tools for coping, not representing. The policy side fits this well.
      *   *Correspondence Theory:* Statements are true if they match facts. The validation side fits this.
      *   *Model Pluralism (Winther, Keller):* Different models serve different purposes. No "God's eye view."
      *   *Epistemic vs. Ontic:* The policy side cares about *epistemic* access (what we can know/use). The validation side cares about *ontic* accuracy (what *is*).
      *   *Reconstructing the Implicit Theory:* It's likely a form of *Methodological Pragmatism* underpinned by *Critical Realism*. They assume a real world exists (Realism) but admit our access is limited and mediated (Fallibilism), so we use pragmatic strategies for action (Pragmatism).
      *   *Consistency:* They are *functionally* consistent but *foundationally* tense. They don't *require* contradiction if viewed as different stages of the scientific lifecycle (Calibration vs. Application). However, if the validation side claims the model *is* reality, it contradicts the policy side.

  5.  **Refining the Argument (Self-Correction during drafting):**

