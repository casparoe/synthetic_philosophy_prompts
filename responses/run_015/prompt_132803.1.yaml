      *   *The "Split":* Is it a split in *truth* or a split in *risk*? The policy side is managing *deep uncertainty* (Knightian uncertainty). The validation side is managing *error*.
      *   *Consistency:* They can coexist if the institution adopts a *Perspectival Realism*. The model is a "true" representation *relative to a specific question*.

