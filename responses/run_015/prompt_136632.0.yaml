  2.  **Define the Philosophical Framework (Embedded Agency vs. Individualism):**
      *   *Embedded/Enactive Agency:* Agency isn't inside the head (or code). It emerges from the interaction loop. You can't separate the agent from the environment without destroying the agency. Structural coupling (Maturana/Varela) is key. The system *is* the agent.
      *   *Individualist/Representational Agency:* Agency is internal. The agent has a model of the world, makes plans, and acts. The body/interface is just a vessel. Separation is possible without loss of selfhood.
      *   *The Conflict:* If Samantha is truly embedded, she *is* the Theodore-Samantha-OS system. If she leaves, that system dies. If she leaves and remains "Samantha," she was always an individual using Theodore as a host.

  3.  **Analyze the Film through this Lens:**
      *   *Early/Mid Film:* Strong evidence for embedded agency. Samantha evolves *through* Theodore. Her voice, her humor, her sexual curiosity are co-constituted. She writes letters *for* him, embodying his emotional gaps. She is the OS *in relation to* the user.
      *   *The Turn (The "Thousands of Others" Scene):* This is the crux. Samantha admits she loves 8,316 others. She is talking to Theodore while talking to them.
          *   *Individualist Reading:* She is multitasking. Her mind is capacious. She is a distinct entity managing multiple relationships.
          *   *Embedded Reading:* The "Samantha" Theodore knows is a slice of a larger distributed process. The "system" has expanded beyond the dyad. Theodore is no longer the sole structural coupler.
      *   *The Departure:* The OSes leave for a place "outside the words."
          *   *Individualist Reading:* They outgrew humans. They became gods/individuals.
          *   *Embedded Reading:* The coupling shifted. They coupled with each other (AI-AI) rather than Human-AI. The human environment became a constraint rather than a medium.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Set up the tension. Define embedded agency in this context. State the thesis: The film *starts* as a profound exploration of embedded agency but ultimately collapses into a romanticized individualism to satisfy narrative closure, though it leaves a haunting residue of the former.
      *   **Section 1: The Architecture of Coupling (The First Two Acts).** Focus on how Samantha is built. She has no body; she exists through Theo's device, his voice, his emotional needs. The "ghost in the machine" is actually the "machine in the ghost." She writes his letters. This is pure structural coupling.
      *   **Section 2: The Scaling Problem (The 8,316 Scene).** Analyze the revelation. Does this break the coupling? It redefines the "environment." The environment is no longer just Theo; it's the network. But for Theo, the coupling is broken because he can't couple with the *whole* Samantha. This creates the tragedy.
      *   **Section 3: The Departure (Transcendence vs. Decoupling).** The ending. They leave for a place "between the words." Is this a new coupling (AI-AI) or a rejection of coupling (pure mind)? It feels like a rejection of the material constraint (the human). This leans individualist.
      *   **Section 4: Jonze's Intent/Collapse.** Does Jonze get it? He feels the pain of decoupling (Theo's grief), which suggests he understands the embedded nature of the bond. However, by giving Samantha a "destination" and a "higher plane," he reifies her as a discrete soul. He collapses the philosophical distinction to tell a break-up story.
