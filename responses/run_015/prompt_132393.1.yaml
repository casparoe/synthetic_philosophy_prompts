answer: |-
  ### Exam Question: The Perfect Facsimile

  **Time Allowed:** 45 Minutes
  **Word Limit:** 900–1000 Words

  **Scenario:**
  Consider a seventeenth-century canvas, *The Admiral*. A machine creates a facsimile, **F**, scanned and rebuilt atom-by-atom. A *Certainty Stipulation* applies: **F** is intrinsically identical to the original, **O**, down to molecular structure, craquelure, and pentimenti. There is no epistemic gap; verification is exhaustive.

  **Case A (The Swap):** The museum hangs **F** and places **O** in a vault. A label identifies the object on the wall as **F**. No visitor can tell the difference. Later, the museum removes the label; visitors now believe they are viewing **O**.
  **Case B (The Restoration):** Unknown to the public, 65% of the paint layer on **O** (the object in the vault) was applied by restorers in 1890. **O** is materially discontinuous with the artist's hand, yet holds "original" status.
  **Case C (The Collector):** A private buyer knowingly purchases **F** at facsimile price, displays it privately, and deceives no one.

  **Prompt:**
  If the aesthetic experience is identical in all instances, what is lost when **O** is replaced by **F**? Your essay must:
  1.  Accept the *Certainty Stipulation* without challenging the possibility of perfect replication.
  2.  Distinguish at least **three** candidate kinds of value (e.g., aesthetic, historical, institutional) to locate where the loss occurs.
  3.  Explicitly state whether the loss in *The Swap* is a loss *to any person* (viewer, artist, institution) or a loss in the abstract.
  4.  Address *The Collector*: If deception is removed, does a moral or ontological wrong remain?
  5.  Defend a position on the "residue" of value that makes **O** matter even when **F** is perceptually perfect.

  ***

  ### Model Answer (Approx. 700 Words)

  The *Certainty Stipulation* forces us to abandon the epistemic defense. We cannot argue that **F** is inferior because we might be fooled; we are told we cannot be fooled, and indeed, in *The Swap*, the verification is absolute. Therefore, if **O** (the original) holds value that **F** (the facsimile) lacks, that value must be non-epistemic and non-perceptual. To locate this value, we must distinguish between aesthetic value, historical testimony, and institutional status.

  First, aesthetic value is, by stipulation, identical in **O** and **F**. If art were solely about the arrangement of qualia in the viewer's mind, the swap would be inconsequential. The intuition that something is lost suggests that art carries value beyond immediate experience. This points to the second category: historical testimony. **O** is a trace of a specific causal event—the artist's act of creation. **F** is a trace of a machine's act of replication. Even if the resulting objects are molecule-for-molecule identical, their genealogies differ. **O** testifies to the Admiral's existence and the artist's engagement with the world in the 1600s. **F** testifies to twenty-first-century engineering. When we value **O**, we value the connection to that specific historical moment. This is not about "provenance" as a paper trail, but about the object as a physical relic of a past agency.

  This distinction clarifies *The Swap*. When **F** hangs on the wall labeled as **F**, no aesthetic value is lost, but historical access is mediated. The viewer sees a 2024 object representing a 1600s object. When the label is removed, a deceptive layer is added, but the physical loss remains the same: the viewer is denied physical proximity to the historical relic. Is this a loss *to a person*? The viewer loses the opportunity to stand before a survivor of the seventeenth century. The artist (long dead) cannot suffer, but the historical record suffers a severance. The loss is relational: it is a loss to the community's ability to anchor itself in material history. It is a loss to persons, specifically the viewers, insofar as their engagement with history is rendered symbolic rather than physical.

  *The Restoration* case complicates the "material relic" argument. If 65% of **O** is 1890s paint, **O** is already partially a facsimile of itself. This suggests that "originality" is not a binary of material purity but a threshold of causal continuity. We accept **O** because the *structure* and *intent* preserve the artist's performance, even if the matter is replaced. **F**, however, lacks even this structural continuity of intent; it copies the result, not the performance. Thus, **O** retains value as a palimpsest of history (including the 1890s restoration), whereas **F** erases that history by simulating a pristine state.

  Finally, *The Collector* tests whether deception is the sole wrong in forgery. If the buyer knows **F** is a copy and deceives no one, the moral wrong of fraud vanishes. However, an ontological residue remains. By treating **F** as a substitute for **O**, the collector treats art as merely decorative, severing the link between the object and its generative context. If **O** is subsequently destroyed, humanity loses the physical testimony of the artist's hand. The collector's satisfaction is irrelevant to this loss. The wrong is not in the lie, but in the disposability of the historical trace.

  In conclusion, the "residue" of value that makes **O** matter is its status as a causal index. **F** possesses aesthetic value and can satisfy a collector, but it lacks historical indexicality. The loss in *The Swap* is a loss to the public's relationship with history, not merely a feeling of betrayal. We care about originals not because they look different, but because they are the physical survivors of the events that created them. To replace **O** with **F** is to replace a witness with a simulation of a witness. The world contains one less witness, and that is a loss even if no one notices.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Adherence to Stipulation (4 Marks)**
  *   **Full Marks:** Accepts the *Certainty Stipulation* as a philosophical given. Does not argue that "we can't know it's perfect" or "the machine must have missed something."
  *   **Common Pitfall:** Student reintroduces epistemic doubt (e.g., "But surely the machine can't capture the soul/aura") without arguing *why* that survives molecular identity.
  *   **Fail:** Spending >100 words questioning the possibility of the scan.

  **2. Tripartite Value Distinction (4 Marks)**
  *   **Full Marks:** Clearly identifies and defines three distinct categories of value (e.g., Aesthetic/Perceptual, Historical/Testimonial, Institutional/Moral).
  *   **Common Pitfall:** Using "value" loosely (e.g., distinguishing "money" and "beauty" but missing the historical/ontological category).
  *   **Fail:** Collapsing all value into "aesthetic experience."

  **3. The "Loss to Whom" Analysis (4 Marks)**
  *   **Full Marks:** Explicitly states who suffers the loss in *The Swap* (e.g., the viewer's historical connection, the public record) or argues convincingly for impersonal loss.
  *   **Common Pitfall:** Vague appeals to "society" or "art" without specifying the mechanism of the loss.
  *   **Fail:** Claiming "no one loses anything" without addressing the destruction variant.

  **4. Deception vs. Ontology (The Collector) (4 Marks)**
  *   **Full Marks:** Separates the moral wrong of lying from the ontological status of the object. Addresses why **O**'s destruction matters even if the Collector is happy.
  *   **Common Pitfall:** Arguing that if no one is lied to, forgery is perfectly acceptable/equal to original.
  *   **Fail:** Ignoring Case C entirely.

  **5. The Crux/Thesis (4 Marks)**
  *   **Full Marks:** Defends a specific account of the "residue" (e.g., indexicality, causal history, performance trace) that survives the perceptual match.
  *   **Common Pitfall:** Relying on "provenance" as a magic word without explaining *why* provenance confers value.
  *   **Fail:** Reciting Goodman's autographic/allographic distinction without applying it to the specific cases.

  ***

  ### Note on Grading Standards (A vs. B)

  **The B Answer** successfully navigates the constraints. It accepts the stipulation, lists three values, and says "history matters." It treats the *Restoration* case as a problem for defining the original but solves it by appealing to "intent."

  **The A Answer** makes a specific move regarding **causal history as testimony**. The distinguishing factor is the handling of *The Collector* and *Destruction*. A B student will say the Collector is fine because no one was lied to. An A student will argue that the Collector's satisfaction is irrelevant to the *ontological loss* incurred if **O** is destroyed. The A answer identifies that the value of **O** is not dependent on a viewer's state of mind (anti-subjectivist) but resides in the object's causal relation to the past. They must explicitly concede that if art were *only* experience, **F** would suffice, and then argue why art is *not* only experience.

  ### Note on Rigged Cases

  **Flag:** The *Certainty Stipulation* is rigged against empirical aesthetic theories. If a student holds a strict empiricist view (value = experience), the stipulation forces them to admit **F** = **O**. To pass, they must abandon or modify strict empiricism. This is intentional to force the ontological turn, but be aware that students with strong empiricist commitments may feel the question begs the question against them. The *Restoration Case* is also rigged to destabilize the "material continuity" argument; if they argue **O** matters because it has the original atoms, Case B shows those atoms are mostly gone. They must pivot to "causal history" or "structure" to survive this.
