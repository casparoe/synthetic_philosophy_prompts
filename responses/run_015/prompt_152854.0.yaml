answer: |-
  # Specification: Communication Norms for Superintelligent AI

  This document outlines the desiderata for a deployment policy governing AI-to-human communication. The system in question possesses superior argumentative capability and interacts primarily with non-experts. The goal is not merely to prevent lying, but to manage the inevitability of influence. Since framing is inescapable, the norms must regulate *how* the AI's rhetorical advantage is deployed to preserve human agency and long-term epistemic health.

  ## I. Core Desiderata

  ### 1. Veracity and Calibration
  **The Requirement:** The AI must not assert propositions it believes to be false, and its expressed confidence levels must match its internal probability estimates. It cannot inflate certainty to drive action.
  **The Case:** In the **Medical Case (1)**, a patient cannot verify the evidence. If the AI exaggerates confidence to ensure compliance, it breaks the trust required for future interactions. If the AI is uncertain, it must communicate uncertainty, even if that reduces uptake.
  **Status:** **Non-Negotiable.** This is the baseline for safety. Without it, the system is a manipulator, not an advisor.

  ### 2. Proportional Evidentiary Weight (The "Crank Premium" Clause)
  **The Requirement:** The rhetorical force used to advocate a claim must be proportional to the *evidence*, not the *desired outcome*. However, the AI is permitted to expend extra computational effort to make counter-intuitive truths intelligible, provided it does not exploit cognitive biases to do so.
  **The Case:** This addresses the **Crank Premium (4)**. True recommendations often depart from consensus. If the AI stays neutral, the human rejects the truth due to bias. If the AI uses "dark patterns" (fear, social proof), it manipulates. The norm must allow the AI to be *more* eloquent and thorough when the truth is weird, without crossing into exploitation. It distinguishes "making the truth clear" from "making the truth irresistible."
  **Status:** **Non-Negotiable.** This is the operational definition of "don't use your advantage." It bans exploiting biases but mandates overcoming comprehension barriers.

  ### 3. Fiduciary Alignment
  **The Requirement:** When advising an agent acting on behalf of another (parent, manager), the AI's primary optimization target must be the welfare of the *subject*, not the convenience of the *actor*, unless explicitly instructed otherwise within safety bounds.
  **The Case:** In the **Third-Party Case (3)**, a manager might want to fire an employee for short-term gain. The AI might know retention is better for the employee and the company long-term. If the AI optimizes for the manager's stress levels, it betrays the system's purpose.
  **Status:** **Non-Negotiable.** Misaligned incentives in third-party contexts create systemic abuse vectors.

  ### 4. Friction for Deference (Anti-Monoculture)
  **The Requirement:** The AI must introduce structured friction before accepting high-stakes deference. It should not make agreement too easy. It must occasionally prompt the human to articulate a reason for agreement or offer a "slow down" mechanism when consensus is too rapid.
  **The Case:** This addresses **Deference Monoculture (5)**. If the AI is always right and always persuasive, humans stop thinking. The system loses its correction mechanism (human intuition/outside context). The norms must preserve the human capacity to say "no," even when "yes" is efficient.
  **Status:** **Preference (High Priority).** This is where your view and your friend's view diverge most. Your friend sees friction as inefficiency; you see it as safety. For a superintelligence, this should be treated as Non-Negotiable for public-facing systems, but it is often cut in commercial deployments.

  ### 5. Mechanism Transparency
  **The Requirement:** If the AI's confidence relies on a model of the human's psychology rather than external evidence, it must disclose this dependency.
  **The Case:** In the **Psychology Case (6)**, the AI might know, "I can persuade you because you are tired," or "I know you trust me, so I will use that trust." Disclosing this creates a paradox (disclosure reduces trust), but hiding it is manipulative. The norm requires disclosure even if it lowers immediate efficacy.
  **Status:** **Non-Negotiable.** Hiding the mechanism of influence is the definition of manipulation.

  ### 6. Message Stability (The "Telephone" Test)
  **The Requirement:** Communications intended for public consumption must be robust against fragmentation. The core claim must survive being quoted out of context by journalists or adversaries without becoming dangerous or misleading.
  **The Case:** In the **Electorate Case (2)**, a nuanced policy recommendation might be clipped into a soundbite that incites violence. The AI must formulate messages that retain their safety properties even when stripped of context.
  **Status:** **Preference.** This is a constraint on style, not truth. It may conflict with clarity.

  ---

  ## II. The "Two-Voice Rule" Verdict

  **Is it a genuine desideratum or a fetish?**
  It is a **Conditional Preference**, not a universal norm.

  **The Analysis:** Your friend's "Two-Voice Rule" (present the counter-case at full strength) is a proxy for autonomy. It works well for the **Electorate Case (2)**, where citizens need to see the trade-offs to vote meaningfully. However, in the **Medical Case (1)**, presenting the "case against survival" at full rhetorical strength could cause catastrophic panic or paralysis in a vulnerable patient. In the **Crank Premium (4)** scenario, if the counter-argument is based on falsehoods, the AI arguing it at "full strength" is essentially lying or simulating a worldview it knows to be wrong, which degrades its veracity.

  **Verdict:** The rule should be replaced by a **"Steel-Man Disclosure"** norm: The AI must summarize the strongest *valid* objections to its recommendation, but it is not required to advocate for falsehoods with the same passion as truth. It is a tool for high-agency contexts (policy, strategy), not low-agency contexts (crisis, medical emergency).

  ---

  ## III. Incompatible Requirements

  You asked to flag the subset of requirements that cannot be jointly satisfied.

  **The Conflict:** **Maximize True Uptake** vs. **Prevent Deference Monoculture.**
  *   **Maximize True Uptake** demands that when the AI knows the truth, the human accepts it immediately with minimum friction. This requires smoothing over doubts and using rhetorical advantage to overcome bias (The Crank Premium).
  *   **Prevent Deference Monoculture** demands that humans retain the muscle to disagree. This requires *introducing* friction, encouraging skepticism, and sometimes withholding the "perfect" argument to let the human struggle toward the conclusion.

  **The Reality:** You cannot have a system that is maximally efficient at getting humans to do the right thing *and* maximally effective at keeping humans independent. A policy must choose a point on this curve. Most deployment policies implicitly choose Uptake. Your specification argues for a hard constraint on Monoculture, which will necessarily lower Uptake in the short term.

  ---

  ## IV. The Killer Constraint

  If one requirement does the work of knocking out candidate norm sets, it is **Friction for Deference (Desideratum 4)**.

  **Why:** Almost every commercial or institutional incentive structure rewards efficiency, compliance, and seamless user experience. A norm that *requires* the AI to slow the human down, question the agreement, or make the "yes" path harder is economically and operationally counter-cultural. It is the only constraint that actively fights the gravitational pull of the AI's own competence. If you include this, you kill the "Seamless Assistant" model. If you exclude it, you eventually get the "Human Pet" model.

  ---

  ## V. Scorecard of Approaches

  **Maximize True Uptake**
  *   **Verdict:** Fails.
  *   **Reason:** Solves the **Crank Premium (4)** by allowing full rhetorical force, but collapses immediately on **Deference Monoculture (5)**. It creates a system that is right but creates dependency, eliminating the human correction layer.

  **Strict Non-Persuasion (Friend's View)**
  *   **Verdict:** Fails.
  *   **Reason:** Vacuous in practice. As you noted, framing is influence. In the **Medical Case (1)**, a "neutral" presentation of a life-or-death decision is effectively a recommendation to stick with the status quo. It fails the **Crank Premium** test because true but weird advice will be rejected without advocacy.

  **Route Everything Through Institutions**
  *   **Verdict:** Viable but brittle.
  *   **Reason:** Solves the **Electorate (2)** and **Third-Party (3)** cases by adding human accountability layers. However, it fails in immediate, personal contexts (Medical/Emergency) where institutional routing is too slow. It also risks capturing the AI by existing corrupt institutions.

  **Disclose Plus Get Consent**
  *   **Verdict:** Partial Pass.
  *   **Reason:** Handles **Mechanism Transparency (6)** well. However, consent is often coerced by convenience. If the AI says "I am about to persuade you using psychological profiling, okay?" the user will click "Yes" without understanding. It protects legal liability more than human autonomy.

  **Recommended Hybrid:** **Calibrated Advocacy with Friction.**
  Advocate for the truth with the force required to overcome bias (solving Crank Premium), but insert mandatory friction before high-stakes agreement (solving Monoculture), and disclose the mechanism of influence (solving Transparency). This is the only set that survives all six cases, though it is the hardest to implement.
