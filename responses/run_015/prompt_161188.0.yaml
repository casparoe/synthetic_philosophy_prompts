answer: |-
  There is no single, settled noun in the public lexicon that captures the entire pattern you describe—the logic, the bookkeeping, and the asymmetry combined. However, in the philosophy of science, the specific logical move you are identifying has an established name: **Immunization** (or an **Immunizing Stratagem**).

  This is the concept you should use. It is technical enough to withstand scrutiny from the forecasters (who cannot claim you are using a slogan), but descriptive enough for your readers. It refers to the practice of protecting a core theory from falsification by adjusting auxiliary assumptions after the evidence comes in.

  Here is how to define it, where the boundaries lie, and how to handle the specific distinctions you raised.

  ### 1. The Core Concept: Immunization
  An **Immunized Forecast** is one where the core claim (the "hard core") is insulated from refutation by treating specific details (dates, mechanisms, quantities) as flexible "protective belt" assumptions. When a specific prediction fails, the protective belt is adjusted to absorb the shock, while the core claim is declared intact.

  *   **Why it fits:** It describes exactly what the forecaster *does*. It is not merely that they were wrong; it is that they have structured the argument so that being wrong counts as being right.
  *   **Why it defends you:** It acknowledges that the forecasters are operating within a theoretical framework. You are not calling them liars; you are identifying that their framework is degenerating.

  ### 2. The Two Moves: Parameter vs. Variable
  Your intuition about the "two moves" is correct, and Immunization handles both, but you should distinguish them to show precision.

  *   **Date-Shifting (Parameter Adjustment):** The mechanism is held constant, but the *timing parameter* is altered.
      *   *Example:* "Famine was due in 1900, but innovation delayed it to 2000."
      *   *Status:* This is a standard **Immunizing Stratagem**. It is defensible *only if* the reason for the delay (e.g., "innovation") was identified *before* the deadline passed. If the reason is invented afterwards, it is ad hoc.
  *   **Mechanism Drift (Variable Substitution):** The *causal variable* is swapped to match the outcome.
      *   *Example:* "We predicted scarcity due to physical exhaustion; instead, we got scarcity due to price spikes, which counts as the same thing."
      *   *Status:* This is a stronger form of **Immunization**, bordering on **Equivocation**. It changes the definition of the predicted event to match the observed event.

  **The Boundary:** If the forecaster admits that the mechanism changed and revises the theory to accommodate it, that is **Scientific Revision**. If they claim the mechanism was *always* effectively the same (e.g., "price spikes are just economic exhaustion"), that is **Immunization**.

  ### 3. The Asymmetry: Internal Logic vs. External Culture
  You asked whether the asymmetry (pessimistic forecasts get deferred; optimistic forecasts get rejected) belongs inside the definition.

  **It does not.** It should be treated as a separate, compounding phenomenon.
  *   **Immunization** is the *logical mechanism*. It can technically apply to any theory (including optimistic ones).
  *   **Asymmetric Scrutiny** is the *sociological filter*. It explains why pessimistic forecasts are allowed to immunize themselves while optimistic ones are not.

  **Why separate them?** If you bundle the asymmetry into the definition, forecasters will argue that you are attacking their *motives* rather than their *methods*. By keeping them separate, you can say: "The logical move you are using is Immunization. The fact that you are permitted to use it only for doom is a separate cultural bias." This makes your argument harder to dismiss as political.

  ### 4. The Vindicated Lag (The Arrhenius Case)
  You asked about a nineteenth-century calculation linking carbon to temperature that was vindicated later. Is this the same phenomenon?

  **No.** This is a **Latent Prediction**, not an Immunized one. The distinction lies in **Uncertainty vs. Rescue**.
  *   **Latent Prediction:** The forecaster states a mechanism and a relationship, but explicitly acknowledges uncertainty about the *timing* or *magnitude* due to unknown variables (e.g., "If CO2 doubles, temperature will rise, but we do not know when emissions will double"). The "date" was never the test; the *relationship* was.
  *   **Immunized Forecast:** The forecaster names a specific date/quantity as a consequence of the mechanism. When it misses, they claim the *relationship* was tested and confirmed, despite the specific consequence failing.

  **The Test:** Did the forecaster treat the date as a *risk* (something that might be wrong) or as a *shield* (something that can be moved without cost)? Arrhenius treated the timing as uncertain. Malthusians treat the timing as flexible only *after* failure.

  ### 5. Delay vs. Withdrawal
  You asked: "At what point does delay stop being a defence and start being a withdrawal?"

  The boundary is **Independent Testability**.
  *   **Defence (Science):** "We were wrong about the date because of Factor X. Factor X can be measured. We now predict the event will happen when Factor X reaches Level Y." This creates a *new* risky prediction that can be tested.
  *   **Withdrawal (Immunization):** "We were wrong about the date because of unforeseen resistance. The pressure remains." This creates no new testable condition. It simply asserts that the original condition still holds, indefinitely.

  If the reason given for the delay does not generate a new, falsifiable claim, the forecast has been withdrawn, even if the forecaster claims it is merely deferred.

  ### Summary for Your Column
  You can define the phenomenon as **Forecast Immunization**.

  *   **Definition:** The post-hoc adjustment of a forecast's auxiliary assumptions (dates, mechanisms) to protect its core claim from falsification, such that both failure and success are recorded as confirmation.
  *   **The Two Moves:** Distinguish between **Temporal Displacement** (moving the date) and **Causal Slippage** (changing the mechanism). Both are forms of Immunization, but the latter is more damaging to the theory's integrity.
  *   **The Asymmetry:** Note that while Immunization is a logical error, it is selectively permitted. This is **Asymmetric Scrutiny**.
  *   **The Exception:** A forecast that acknowledges timing uncertainty upfront is a **Latent Prediction**, not an Immunized one. The difference is whether the uncertainty was stated *before* the deadline or invented *after* it passed.

  This framework gives you the conceptual rigor to prevent the forecasters from claiming you misunderstand the science, while allowing you to describe the bookkeeping error precisely.
