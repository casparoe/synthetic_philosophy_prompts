answer: |-
  # Module Handout: The Doing/Allowing Decision Tree

  ## Part 1: The Logical Space
  Before using the tree, understand the four dimensions this instrument maps. We are not asking for definitions; we are testing how your judgments shift when we change the *context* of the action.

  1.  **Descriptive Distinction:** Is there a factual difference between "I caused it" and "I didn't stop it," or are they the same description at different resolutions?
  2.  **Moral Weight:** If there is a descriptive difference, does it carry moral weight *on its own*, or only because it points to something else (like intent or duty)?
  3.  **Source of Obligation:** Does the difference vanish when a specific duty exists (e.g., a doctor's role), or does the act type remain distinct regardless of the role?
  4.  **Consistency:** Is "Doing" always worse than "Allowing," or are there contexts where "Allowing" is worse, or where the classification flips based on how you describe the movement?

  ---

  ## Part 2: The Decision Tree
  **Instructions:** Start at **Node 1**. Follow the arrow corresponding to your judgment. Answer based on your immediate moral intuition about the *cases*, not on what theory you think you should hold.

  ### **Tier 1: The Core Intuition (Load-Bearing)**
  *These nodes determine the major branches of the tree.*

  **Node 1 (Baseline):**
  *Case A:* You inject a lethal drug into a patient, causing immediate death.
  *Case B:* You notice a patient is not breathing, you could press a button to ventilate them, but you do not. They die.
  *Assuming intent and outcome are identical:*
  *   **Branch Left:** Case A is significantly worse than Case B. → Go to **Node 2**.
  *   **Branch Right:** Case A and Case B are morally equivalent. → Go to **Node 9**.

  **Node 2 (Created Threat):**
  *Case:* You accidentally knock a swimmer into a lake. They cannot swim. You could throw a rope but choose not to. They drown.
  *Compare this to:* A stranger knocks them in and walks away; you watch them drown.
  *   **Branch Left:** Your failure to rescue is *worse* than the stranger's failure (because you created the threat). → Go to **Node 3**.
  *   **Branch Right:** Both failures are equally bad (or equally permissible); the creation of the threat doesn't change the "allowing" status. → Go to **Node 4**.

  **Node 3 (Independent Agent):**
  *Case:* An assassin is shooting at a patient. You could tackle the assassin but choose not to. The patient dies.
  *Compare this to:* You shoot the patient yourself.
  *   **Branch Left:** Tackling (or not) is fundamentally different from Shooting; your omission is less bad. → **Leaf: Traditional Absolutist**.
  *   **Branch Right:** Failing to stop the assassin is just as bad as shooting; you are responsible for the outcome either way. → **Leaf: Responsibility Reductionist**.

  **Node 4 (Positive Act to Allow):**
  *Case:* A patient is on a ventilator. You reach out and *unplug* the machine. They die.
  *Compare this to:* You see the plug is loose and choose not to push it back in.
  *   **Branch Left:** Unplugging is "Doing" (Killing); not pushing in is "Allowing" (Letting Die). → Go to **Node 5**.
  *   **Branch Right:** Both are "Allowing" because the underlying right to refuse treatment is the same; the muscle movement doesn't matter. → **Leaf: Rights-Based Equivalence**.

  ### **Tier 2: Role and Mechanism (Fine-Grained)**
  *These nodes split positions that agree on the core intuition but disagree on boundaries.*

  **Node 5 (Institutional Role):**
  *Case:* A nurse ignores a patient's call button, and the patient dies of a preventable complication.
  *Compare this to:* A hospital janitor ignores the same call button.
  *   **Branch Left:** The Nurse's omission is worse (closer to killing) because of their role; the Janitor's is mere letting die. → **Leaf: Role-Dependent Distinction**.
  *   **Branch Right:** Both are equally "Allowing"; the role changes the *blame*, not the *act type*. → Go to **Node 6**.

  **Node 6 (Killing-by-Letting):**
  *Case:* You open a window in winter, knowing an invalid inside will freeze. You do not touch the invalid.
  *Compare this to:* You fail to fix a broken window, knowing the invalid will freeze.
  *   **Branch Left:** Opening the window is "Doing" (Killing), even though the cold does the work. → Go to **Node 7**.
  *   **Branch Right:** Both are "Allowing" the cold to take its course; opening the window is just a fancier omission. → **Leaf: Causal Process Reductionist**.

  **Node 7 (Long-Term Mechanism):**
  *Case:* You set a booby trap last week. Today, a victim walks toward it. You could warn them but don't. They die.
  *Compare this to:* You set the trap and pull the lever today.
  *   **Branch Left:** The past setup makes this "Doing" (Killing), even if your current act is an omission. → **Leaf: Historical Causal View**.
  *   **Branch Right:** Your current failure to warn is "Allowing," regardless of what you did last week. → **Leaf: Present Act View**.

  **Node 8 (Preventing Rescue):**
  *Case:* Paramedics are trying to enter. You lock the door. The patient dies inside.
  *Compare this to:* You simply don't call the paramedics.
  *   **Branch Left:** Locking the door is "Doing" (Killing); not calling is "Allowing." → **Leaf: Interference Absolutist**.
  *   **Branch Right:** Both are equally wrong; the outcome dependence is what matters, not the door. → **Leaf: Counterfactual Dependence View**.

  ### **Tier 3: Description Sensitivity (Load-Bearing for Theory)**
  *These nodes test if the distinction collapses under scrutiny.*

  **Node 9 (Start vs. Stop):**
  *Case A:* You decide *never to start* a ventilator on a terminal patient.
  *Case B:* You decide *to turn off* a ventilator already running on the same patient.
  *   **Branch Left:** Case B is worse (it is Killing); Case A is Allowings. → **Leaf: Traditional Clinical Distinction**.
  *   **Branch Right:** Case A and Case B are morally identical. → Go to **Node 10**.

  **Node 10 (Reverse Asymmetry):**
  *Case:* You force-feed a hunger-striking competent patient (Doing).
  *Compare this to:* You let them starve (Allowing).
  *   **Branch Left:** Force-feeding is worse (a violation/battery) than letting them starve. → **Leaf: Liberty-Weighted View**.
  *   **Branch Right:** Letting them starve is worse (abandonment) than force-feeding (care). → **Unnamed Leaf**.

  ---

  ## Part 3: The Leaves (Positions)

  1.  **Traditional Absolutist:** (Named) Killing is intrinsically worse than letting die, regardless of role or consequence.
      *   *Awkward Commitment:* Must condemn unplugging a ventilator as murder even when the patient begs for it.
  2.  **Responsibility Reductionist:** (Named) The distinction collapses when the agent is responsible for the threat or outcome.
      *   *Awkward Commitment:* Makes failing to save a drowning stranger (when you easily could) as bad as pushing them in.
  3.  **Rights-Based Equivalence:** (Named) The act type matters less than the patient's claim to the treatment.
      *   *Awkward Commitment:* Struggles to explain why we punish active euthanasia legally but permit withdrawal of care.
  4.  **Role-Dependent Distinction:** (Named) The doing/allowing line shifts depending on professional duty.
      *   *Awkward Commitment:* Implies a doctor "kills" by unplugging, but a family member "lets die" by doing the same act.
  5.  **Causal Process Reductionist:** (Named) Only the immediate physical cause of death matters (e.g., the disease vs. the drug).
      *   *Awkward Commitment:* Cannot distinguish between opening a window to freeze someone and failing to close it.
  6.  **Historical Causal View:** (Named) Past causal input determines the current moral status of an omission.
      *   *Awkward Commitment:* Requires tracking the entire history of a threat to know if a current omission is killing.
  7.  **Present Act View:** (Named) Only the current physical movement (or lack thereof) counts.
      *   *Awkward Commitment:* Treats the booby-trap setter who stays silent the same as a bystander who stays silent.
  8.  **Interference Absolutist:** (Named) Preventing aid is always a "Doing."
      *   *Awkward Commitment:* Classifies locking a door as killing, but poisoning the food behind the door as merely allowing.
  9.  **Counterfactual Dependence View:** (Named) Moral weight depends on whether the victim would have lived without you.
      *   *Awkward Commitment:* Makes no moral difference whether you shoot a victim or watch them be shot, provided they die either way.
  10. **Traditional Clinical Distinction:** (Named) Withholding is allowing; Withdrawing is killing (or at least distinct).
      *   *Awkward Commitment:* Creates a perverse incentive to never start treatment to avoid the "killing" label later.
  11. **Liberty-Weighted View:** (Named) Bodily integrity makes "Doing" (force-feeding) worse than "Allowing" (starving).
      *   *Awkward Commitment:* Suggests we have a stronger right not to be touched than a right to be saved.
  12. **Unnamed (The Paternalist):** *Letting them starve is worse than force-feeding.*
      *   *Awkward Commitment:* Implies the state/agent owns the patient's life more than the patient does.

  ---

  ## Part 4: Limitations & Indistinguishable Pairs

  **1. The "Brute Principle" vs. "Victim's Claim" Problem**
  *   **Cannot Separate:** *Traditional Absolutist* vs. *Liberty-Weighted View*.
  *   **Diagnosis:** Both land on "Killing is worse." The tree cannot tell if the student believes this because of a metaphysical rule about acts (Brute) or because of the victim's right to bodily integrity (Claim).
  *   **Fix:** Requires follow-up questioning on *why* the injection is worse.

  **2. The "Counterfactual" vs. "Causal Process" Problem**
  *   **Cannot Separate:** *Responsibility Reductionist* vs. *Counterfactual Dependence View*.
  *   **Diagnosis:** Both treat "Preventing Rescue" (Node 8) as equivalent to Killing. One focuses on the causal chain, the other on the "but-for" test.
  *   **Fix:** Requires a case where counterfactual dependence exists but causal input is zero (e.g., psychological deterrence).

  **3. The "Inseparable Description" Flag (Node 9)**
  *   **Issue:** *Traditional Clinical Distinction* vs. *Rights-Based Equivalence*.
  *   **Diagnosis:** If a student answers Node 9 (Start vs. Stop) by saying "They are different," the tree routes them to Traditional. But they might hold Rights-Based Equivalence *except* for legal fear. The tree treats them as distinct moral positions, but they may be the same moral view reacting to legal risk.
  *   **Flag:** This node is **Load-Bearing** but theoretically fragile. It often tracks *legal* anxiety rather than *moral* intuition.

  ---

  ## Part 5: Instructor Scoring Note

  **Use this key to diagnose student reasoning patterns during seminar.**

  | Pattern of Answers | Diagnosis | Action |
  | :--- | :--- | :--- |
  | **Consistent "Equivalence" across Nodes 1, 2, 3, 8** | **Tracking the Distinction:** Student genuinely sees no moral difference in act-types. | **Keep:** Good candidate for Consequentialist critique. |
  | **"Killing Worse" on Node 1, but "Equivalent" on Node 2 (Created Threat)** | **Tracking Responsibility:** Student sees the distinction is real but overridden by causal responsibility. | **Keep:** Strong candidate for Responsibility View. |
  | **"Killing Worse" on Node 1, but flips on Node 4 (Unplugging)** | **Tracking Mechanism:** Student is focused on physical movement (muscle contraction) rather than moral status. | **Probe:** Ask if they would punish unplugging as murder. If not, they are confusing *physics* with *ethics*. |
  | **Flips on Node 9 (Start vs. Stop) ONLY** | **Orthogonal Factor (Legal/Clinical):** Student is likely tracking *legal liability* or *clinical habit*, not moral theory. | **Drop/Flag:** This answer often misfires in ethics seminar because it conflates "what is safe" with "what is right." |
  | **"Killing Worse" on Node 1, but "Allowing Worse" on Node 10 (Force Feed)** | **Tracking Rights:** Student is tracking bodily integrity, not the doing/allowing distinction. | **Reframe:** Use this to pivot discussion from "Acts" to "Rights." |
  | **Inconsistent on Node 6 (Open Window)** | **Squeamishness:** Student calls it "Killing" because the image is active, but calls Node 1 "Allowing" because it's clinical. | **Probe:** Ask if the *cold* kills in both cases. If yes, their distinction is aesthetic, not logical. |

  **Warning:** If a student's path is determined entirely by **Outcome Severity** (e.g., "If the death is painful, it's Killing; if peaceful, it's Allowing"), the tree has misfired. This instrument assumes *ceteris paribus* (all else equal). Pause the exercise and reset the case constraints.
