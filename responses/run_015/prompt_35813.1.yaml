          *   *Advisor's likely view:* Hostile. IIT starts from "phenomenal axioms" as undeniable truths (e.g., intrinsic existence). Heterophenomenology denies we have direct access to these truths. IIT is often seen as panpsychist-leaning or dualist-leaning by Dennettians.
