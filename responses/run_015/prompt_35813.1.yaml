      *   *Self-Correction on LLM:* Dennett has written on AI. He tends to treat them as having "competence without comprehension" initially, but if they pass the right tests, they get the intentional stance. The *transcripts* themselves generate the heterophenomenological world.

      *   *Refining the "Rules":* The user's "Fictionalist Rule" sounds like "Grant the world based on text." The "Strict Rule" sounds like "Grant the data only if useful for 3rd person science."
      *   The Afterimage case supports Fictionalist (world granted despite physical falsehood).
