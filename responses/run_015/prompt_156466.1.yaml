answer: |-
  1.  **The Capacity vs. Disposition Distinction**
      You argue that the gap between premises and conclusion is closed by a non-propositional capacity, not a rule. But if this capacity isn't a rule I can consult, what distinguishes it from a brute causal disposition? If I have the "MP capacity," I infer *B* from *A* and *A→B*. If I'm a parrot trained to squawk *B* when I hear *A* and *A→B*, the output is identical. Where is the rationality in your capacity that isn't present in the parrot's reflex?
      **Follow-up:** I expect you'll say the capacity is normative—that I can cite the rule as my *reason*. But if I cite the rule to justify my inference, haven't I just turned the capacity back into a premise? Isn't that citation just the Tortoise's demanded premise wearing a disposition costume?

  2.  **The Problem of Bad Rules (Tonk and Immunity)**
      If modus ponens is justified by a capacity that validates itself through non-exportable use, you seem to have granted blanket immunity to any rule that a community treats as fundamental. Why doesn't this same move protect Affirming the Consequent? Or Prior's *tonk*? If the justification is internal to the practice of using the rule, what stops a *tonk*-user from claiming they have the "tonk-capacity" that closes their inferential gaps?
      **Follow-up:** Your likely reply is that *tonk* lacks coherent semantics while MP has them. But doesn't defining those semantics require a logic to govern the definitions? Aren't you smuggling in a prior logic to validate the capacity that was supposed to ground logic in the first place?

  3.  **Deduction vs. Reasons Generally**
      Is Carroll's regress a problem specific to deductive logic, or is it a problem about reasons generally? If the gap between premises and conclusion requires a non-propositional capacity, does the same apply to induction or abduction? If yes, are all forms of reasoning ultimately groundless acts of faith in our own cognitive machinery? If no, why is deduction special? Does it suggest that deduction isn't actually about truth-preservation but something else entirely?

  4.  **Logical Relativism and Community**
      If the justification for MP is non-exportable to those lacking the capacity, imagine a community trained from birth on a paraconsistent or intuitionistic logic. They lack the "classical capacity" but possess their own. On your view, are they just as justified as we are? Does your position commit you to a quiet relativism where logical truth is relative to the inferential capacities of the community holding them?
      **Follow-up:** If you deny they are justified, you need a neutral standpoint to judge their capacity as deficient. But you've argued there is no neutral, premise-based standpoint to compel inference. So, on what grounds do you stand to tell them their capacity is broken rather than just different?

  5.  **The Acquisition Problem**
      You treat this inference-readiness as a capacity, but capacities are either innate or acquired. If it's innate, why do so many people fail at basic logic without training? If it's acquired, how is it transmitted? If you can't use premises to compel the inference, teaching logic looks indistinguishable from behavioral conditioning. Are you reducing logical education to training dogs, and if so, how does that preserve the normativity you claim for the capacity?

  6.  **The Right to Correct**
      If inference is grounded in a capacity rather than a public rule, what gives me the right to correct your inference? If you infer *Q* from *P* using a capacity I don't share, I can't point to a rule you've violated, because rules don't compel. Does this dissolve the possibility of logical disagreement? Are we left with a scenario where we can only note that our capacities clash, like a clash of tastes, rather than a clash of truths?

  7.  **The Utility of Explicit Rules**
      If premises and rules never compel inference without the prior capacity, why do we write logic books? Why formulate axioms? If the work is being done by the capacity, explicit rules seem to be mere window dressing—post-hoc descriptions of what we already do. Is your view that logic textbooks are essentially useless for justification, serving only as mnemonic devices for those who already grasp the logic?

  8.  **The Diagnosis of the Regress**
      Carroll presents the regress as a *reductio* of the idea that inference needs justification. You accept the regress is sound but deny it's vicious. But isn't the regress actually a proof that inference *cannot* be justified by reasons alone? If you accept the regress, aren't you admitting that logic has no foundation? Why frame this as "defending the Tortoise" rather than admitting that logical consequence is a primitive fact that doesn't need your capacity machinery to explain it?
