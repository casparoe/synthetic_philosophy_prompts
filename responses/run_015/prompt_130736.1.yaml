answer: |-
  Here is the principle, tested against your cases, repaired where your intuitions outstrip the definition, and stress-tested against new scenarios.

  ### The Principle: Contextual Variance Attribution (CVA)

  **Definition:** Heritability ($h^2$) is the proportion of phenotypic variance ($\sigma^2_P$) in a **specified population**, at a **specified time**, under a **specified distribution of environments**, that is statistically attributable to **additive genetic variance** ($\sigma^2_A$).

  **Scope:** This principle applies strictly to **Narrow-Sense Additive Heritability ($h^2_{add}$)**, best estimated in your cohort by **GREML** (Genomic-Relatedness-Matrix Restricted Maximum Likelihood). It does not apply unmodified to Twin-based estimates ($h^2_{twin}$), which conflate additive genetics with shared environment and dominance unless explicitly modeled. Where your GREML (0.42) and Twin (0.58) estimates diverge, the CVA principle privileges the GREML estimate as the truer measure of $\sigma^2_A / \sigma^2_P$; the Twin estimate measures $\sigma^2_{A+C+D} / \sigma^2_P$.

  **The Five Clauses:**

  1.  **Variance, Not Composition:** $h^2$ describes the distribution of differences in a population, not the composition of a trait in an individual. (Rules out B).
  2.  **Pathway Agnosticism:** $\sigma^2_A$ includes *all* variance correlated with genotype, whether through direct biological effects (DGE) or indirect effects via the environment (IGE), provided the environmental variation is correlated with genetic variation in that population (e.g., passive rGE). (Addresses G1/G2).
  3.  **Mean Silence:** Within-group $h^2$ places no constraint on the cause of differences in group means. Between-group causal attribution requires independent data on genetic divergence. (Addresses D/E).
  4.  **Intervention Silence:** $h^2$ predicts response to *selection* (breeding), not response to *intervention* (environmental manipulation). A trait can be highly heritable and highly malleable if the intervention targets the environmental variance or the specific GxE interaction. (Addresses C/F).
  5.  **Population Specificity:** $h^2$ is local to the population's range of G and E. Cross-population differences in $h^2$ reflect differences in $\sigma^2_E$ or G-E covariance, not differences in the "geneticness" of the trait. (Addresses H).

  ---

  ### Application to Your Cases

  **A (GREML 0.42):** **Allowed.** Fits Clause 1 and Scope. It is a variance decomposition for that population under those conditions.

  **B (Individual Decomposition):** **Disallowed.** Fits Clause 1. Variance is a population statistic; an individual's score is a realization, not a sum of variance components.

  **C (Training Shift):** **Disallowed.** Fits Clause 4. A shift in the mean ($\mu$) does not necessitate a change in variance ($\sigma^2$). $h^2$ remains valid for the *ranking* of individuals, even if the *scale* shifts. The inference that high $h^2$ makes training pointless is a Category Error (confusing selection with intervention).

  **D (Sex Difference):** **Disallowed.** Fits Clause 3. Within-sex variance decomposition tells you nothing about the between-sex mean difference. Sex is a fixed effect in your model; $h^2$ is estimated on the residual variance. To infer the sex difference is genetic, you would need to show genetic divergence between males and females (which exists, but the $h^2$ statistic itself doesn't prove the mean difference is caused by it).

  **E (Cohort Difference):** **Allowed.** Fits Clause 3. Your verdict relies on **ancillary data** (unchanged allele frequencies), not the $h^2$ statistic alone. Because $\Delta G \approx 0$ and $\Delta \mu \neq 0$, the cause must be $\Delta E$. This is consistent with D: in D, you lacked data on genetic divergence regarding the mean; in E, you had it. The asymmetry is principled: $h^2$ is silent on means *unless* supplemented by genetic frequency data.

  **F (Medication):** **Disallowed.** Fits Clause 4. This is a universal environmental exposure. It reduces $\sigma^2_E$, thereby inflating $h^2$ ($\sigma^2_A / (\sigma^2_A + \sigma^2_E)$). Removing the drug changes the environment, potentially changing both the mean and the variance. High $h^2$ in the presence of a universal toxin does not imply the toxin's effects are genetic; it implies the *variation* in response is genetic.

  **G1 (Maternal Intrauterine) & G2 (Parental Reading):**
  Here your principle requires repair. Your verdicts distinguish "biological" pathways (G1) from "behavioral" pathways (G2).
  *   **The Problem:** There is **no non-arbitrary biological rule** that separates G1 from G2 under the CVA principle. Both are **Indirect Genetic Effects (IGE)** mediated by the parental genotype (passive rGE). In both cases, the child's genotype correlates with the environment (womb or books) because the parent provides both genes and environment.
  *   **The Repair:** You must align the *statistical* verdicts but distinguish the *policy* verdicts.
      *   **Statistically:** Both 0.55 figures are valid estimates of *Total Heritability* (Direct + Indirect). Both predict response to selection (breeding for SRL would work in both cases because selecting children selects parents who provide the womb/books).
      *   **Policy:** The distinction is **Malleability of the Mediator**. The intrauterine environment is hard to manipulate without surrogacy or gene therapy; the reading environment is easy to manipulate.
      *   **Verdict Change:** I urge you to **overturn your G2 statistical verdict**. The 0.55 in G2 *is* heritability in the quantitative genetic sense. Calling it "misleading" conflates *transmissibility* with *fixity*. The principle should state: *Heritability captures transmissibility, regardless of the mediation pathway.* You should accept 0.55 for G2 as "heritability of family transmission" but reject the inference that "reading interventions won't work."
      *   **Pathway Rule:** The explicit rule is: **Count all pathways where genetic variation correlates with environmental variation.** Do not distinguish biology from behavior. Distinguish *intervention cost* separately.

  **H (Cross-Population):** **Allowed.** Fits Clause 5. The gloss you apply (wider $\sigma^2_E$) is the correct mechanistic explanation for lower $h^2$.

  **The Unsettled Case (Gain Scores):**
  *   **Verdict:** **Allow, with reclassification.**
  *   **Reasoning:** The "gain" (Post - Pre) is a new phenotype: *Plasticity* or *Responsiveness*. It has a variance distribution. If that variance correlates with genotype, it has a heritability.
  *   **Caveat:** This is not the heritability of SRL; it is the heritability of **GxE Interaction**. It licenses the inference that *who benefits* is genetically structured, not that SRL itself is more genetic. It does not suffer from the "two potential outcomes" problem *if* the training was randomized; the gain is an observed variable for the treated group. If you treat "Gain" as a trait, CVA applies normally.

  ---

  ### Three New Stress-Test Cases

  To ensure the repaired principle holds, consider these three scenarios:

  **Case I: The Floor Effect**
  A new nutritional supplement is introduced universally. Mean SRL improves, but the variance *decreases* significantly because the worst performers improve most. $\sigma^2_E$ drops.
  *   **Principle Verdict:** $h^2$ will **increase**.
  *   **Reasoning:** $\sigma^2_A$ is unchanged, but $\sigma^2_P$ shrinks because $\sigma^2_E$ shrank.
  *   **Implication:** Do not interpret rising $h^2$ as genes becoming "more important." It means the environment has become more uniform, making genetic differences proportionally larger. This tests Clause 5.

  **Case II: Assortative Mating**
  Over 30 years, individuals with similar SRL (and thus similar genotypes) increasingly marry each other.
  *   **Principle Verdict:** $h^2_{GREML}$ stays stable; $h^2_{Twin}$ may inflate; Genetic Variance ($\sigma^2_A$) in the population **increases**.
  *   **Reasoning:** Assortative mating increases linkage disequilibrium and genetic variance over generations. GREML captures current $\sigma^2_A$. Twin estimates might confound this with shared environment if not modeled.
  *   **Implication:** Heritability is not static even without mutation. This tests the "Specified Time" clause.

  **Case III: The Switch Intervention**
  You introduce a drug that *only* works for individuals with Genotype X (frequency 0.5). For Genotype Y, it has no effect.
  *   **Principle Verdict:** In the treated population, $h^2$ for SRL will **drop** (potentially to near zero) if the drug equalizes the phenotypes, or **rise** if it exacerbates differences.
  *   **Reasoning:** This is a specific GxE interaction. The intervention changes the *expression* of the genetic variance.
  *   **Implication:** High $h^2$ does not mean "no intervention works"; it means "no intervention *currently in the population's history* has removed the genetic variance." A targeted intervention can destroy the heritability. This tests Clause 4.

  ---

  ### Where the Principle Refuses to Follow You

  I have identified two areas where your verdicts conflict with a coherent principle. You asked for honesty on where the principle refuses to follow you.

  **1. The G2 Verdict (Parental Reading)**
  *   **Your Verdict:** "I want to say this one is not genetic at all."
  *   **Principle Verdict:** It **is** genetic variance (Indirect).
  *   **Argument:** If you exclude passive rGE (genes $\to$ parent behavior $\to$ child environment $\to$ child trait) from heritability, you break the Breeder's Equation. Selection *would* work on this trait because parents pass on both the genes and the reading habit. By calling it "not genetic," you are smuggling a policy preference (reading is malleable) into a statistical definition.
  *   **Recommendation:** Adopt the term **"Direct Heritability"** ($h^2_{direct}$) for policy (the 0.15 style number) and **"Total Heritability"** ($h^2_{total}$) for prediction (the 0.55 style number). Admit G2 has high *Total Heritability*. Do not call the statistic "misleading"; call the *inference* ("therefore we can't change it") misleading.

  **2. The Gain Score Ambivalence**
  *   **Your Ambivalence:** "Either it is not the kind of quantity... or its heritability licenses a different set of inferences."
  *   **Principle Verdict:** It is a quantity, and it licenses **different inferences**.
  *   **Argument:** Your hesitation stems from thinking $h^2$ must always refer to the *level* of the trait. It does not. It refers to the variance of *whatever phenotype you define*. If you define Phenotype = $\Delta$SRL, then $h^2=0.60$ is valid.
  *   **Recommendation:** Stop treating "SRL" as the only phenotype. "Responsiveness to Training" is a distinct phenotype with its own heritability. Accept the 0.60, but label it $h^2_{plasticity}$ to prevent confusion with $h^2_{SRL}$.

  ### Summary of Repairs

  1.  **Estimator:** Anchor on **GREML ($h^2_{add}$)**. Treat Twin estimates as upper bounds confounded by shared environment (crucial for G2).
  2.  **Pathways:** Remove the Biological/Behavioral distinction. Replace with **Direct vs. Indirect** Genetic Effects. Both count for $h^2$; only Direct counts for "intrinsic geneticness."
  3.  **Means:** $h^2$ never explains mean differences *unless* paired with allele frequency data (resolving D vs E).
  4.  **Gain Scores:** Accept as valid heritability of a *different* phenotype (Plasticity).

  Your tentative principle was 90% correct. The missing 10% was the refusal to admit that "heritability" counts *correlations* between genes and environments (G1/G2) as genetic variance, and the hesitation to treat *change* as a heritable trait in its own right. The CVA principle formalizes this. It will not stop clinicians from misusing the numbers, but it will ensure your own rulings do not contradict each other.
