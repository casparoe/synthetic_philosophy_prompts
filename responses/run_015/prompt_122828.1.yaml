answer: |-
  Based on the track record of her verdicts, here is the prediction, the analysis of her underlying theory, and a case to test it further.

  ### 1. What will she say?
  She will almost certainly say this **is a genuine moral dilemma.**

  Here is why: Her verdicts hinge less on whether an action is "right" or "wrong" in the abstract, and more on the **cleanability of the moral residue.**
  *   **Case 3 (Small Promise)** was *not* a dilemma because the residue could be cleaned ("explain and apologise").
  *   **Case 2 (Two Promises)** and **Case 5 (Mother)** *were* dilemmas because the harm was permanent or uncompensatable ("no way to make it up," "devastated").

  In your test case, you stipulate that the friendship will be "wrecked beyond repair." Even if exposing the plagiarism is the *right* thing to do (the lesser evil), the relational damage is uncleanable. This matches the structure of the "Two Promises" and "Mother" cases, not the "Small Promise" case. She likely subscribes to a theory of **moral remainder** or **tragic loss**: a genuine dilemma exists when doing the right thing still leaves a moral stain or loss that cannot be rectified.

  ### 2. Which rule is she running?
  You proposed two rules:
  *   **Rule A (Wrongdoing):** Dilemma only if *every* option involves doing something wrong.
  *   **Rule B (Residue):** Dilemma if whichever option you pick leaves a remainder you can't clean up.

  **She is running Rule B (Residue), specifically Relational Residue.**

  Rule A struggles to explain her verdict on the **Mother vs. Resistance** case. One could argue that joining the resistance is the objectively "right" thing to do (fighting tyranny), meaning staying with the mother is the only "wrong" option. If Rule A were her guide, she might call this "not a dilemma" (one clear duty overrides). But she calls it a dilemma because of the *devastation* left behind.

  Similarly, Rule A fits the **Strangers Drowning** case (saving either is right), but so does Rule B (no specific duty to either means no relational residue). The tie-breaker is the **Small Promise** case. Rule A says "Not a dilemma" because it's the lesser evil. Rule B says "Not a dilemma" *because you can apologize.* The fact that she explicitly mentions the apology suggests the *cleanup* is the deciding factor, not just the calculation of evil.

  **Other rules that fit her track record:**
  *   **Rule C (Special Obligations):** Genuine dilemmas only arise between competing *special* duties (promises, family, friends), not general duties (strangers, justice, policy).
      *   *Fits:* Strangers (General/General = No), Promises (Special/Special = Yes), Nurse (Policy overrides Special = No), Mother (Special/General = Yes).
      *   *Test Case:* Friend (Special) vs. Justice (General). Under this rule, it might be a dilemma because Special duties carry weight against General ones (like the Mother case).
  *   **Rule D (Incommensurability):** A dilemma exists only when the values at stake cannot be weighed on a single scale.
      *   *Fits:* Strangers (1 life = 1 life, commensurable), Small Promise (Small harm < Big harm, commensurable), Promises/Mother (Love/Loyalty vs. Love/Loyalty, incommensurable).

  ### 3. The Discriminating Case
  To tell apart **Rule B (Residue)** from **Rule C (Special Obligations)** and **Rule A (Wrongdoing)**, you need a case where an action is **Right**, leaves **Uncleanable Residue**, but involves **No Special Obligation**.

  **Put this case to her:**
  > "You are a museum curator during a fire. You can save either a unique, priceless painting (no living artist, no owner claims) or a set of medical supplies. The supplies will definitely save a stranger's life; the painting is irreplaceable cultural heritage. You save the life. The painting is destroyed forever. You did the right thing, and there is no specific person to apologize to, but the loss is permanent and uncleanable."

  **How the verdicts split:**
  *   **If she says "Not a Dilemma":** She is likely running **Rule A (Wrongdoing)** or **Rule C (Special Obligations).** Since you did the right thing (saved a life) and wronged no specific person (no special obligation to the painting), there is no dilemma. The residue is tragic, but not *moral*.
  *   **If she says "Genuine Dilemma":** She is running **Rule B (Residue).** Even though you did the right thing and no specific person was wronged, the permanent loss creates a moral remainder that constitutes a dilemma.

  **Alternative Discriminator (Wrongdoing vs. Residue):**
  > "A guilty murderer is on death row. You are the executioner. Carrying out the sentence is just and right (no wrongdoing). But you must personally pull the lever, and you know it will haunt you forever (heavy psychological residue). Is this a genuine moral dilemma?"

  *   **Rule A (Wrongdoing):** No. You did nothing wrong.
  *   **Rule B (Residue):** Yes. The stain on your character is permanent.

  Given her focus on the "apology" in the roommate case, I suspect she will say the Museum Case is **not a dilemma** (because there's no relationship to damage) but your original Test Case **is a dilemma** (because a friendship is a specific relationship that can be wrecked). This would confirm she is running a hybrid of **Rule B and Rule C**: *Genuine dilemmas require uncleanable residue within a web of special obligations.*
