answer: |-
  This is a profound challenge that goes to the heart of what public history is for. Your committee's split reflects a national conversation about memory, but your specific nagging thoughts point the way toward a solution. You are right to be suspicious of the "product of his time" defense, specifically because of the symmetry problem you identified: you cannot selectively use historical context to excuse harm while ignoring it to claim credit for virtue.

  Here is the path forward for the exhibit and the principle behind it.

  ### The Exhibit Strategy
  The exhibit should not hide the sterilization records, nor should it lead with them as a "gotcha" intended solely to topple a statue. Instead, it should integrate them into his philosophy of public health. His work on vaccinations and his work on sterilization likely stemmed from the same root: a belief in medical authority managing population health for the "greater good." In one instance (vaccines), that aligns with modern values; in the other (sterilization), it violates modern human rights.

  Present these side-by-side. Show that the same drive that built the hospital also empowered him to violate the bodily autonomy of the poor. This avoids the trap of Member B (who wants to excuse the harm) and Member A (who wants to erase the good). It also improves on Member C's "just the facts" approach by providing an interpretive framework: *power without consent is dangerous, even when wielded by benevolent intentions.*

  Regarding the hospital annex name: The historical society's job is to educate, not necessarily to legislate memory immediately. Use the exhibit to spark the community conversation. If the community, armed with the full truth, still wants to petition for renaming, that is a democratic outcome. If the society pre-emptively petitions, you risk becoming a partisan actor rather than a trusted keeper of history. Let the exhibit do the heavy lifting first.

  ### Addressing Your Nagging Thoughts
  **1. Does contemporaneous dissent matter?**
  Yes. The "everyone was doing it" defense is historically lazy, but the existence of dissent makes it morally bankrupt. If ministers and other doctors stood up and said this was wrong, then your doctor made a choice. He wasn't swept along by an irresistible current; he paddled with it. This establishes agency. He is culpable not because he violated 2025 standards, but because he violated the conscience available in 1915.

  **2. The Symmetry of Credit and Blame**
  This is your strongest philosophical lever. If you excuse the sterilization because it was mainstream then, you must logically concede that his funding of the Black school was merely luck—he happened to be on the right side of a racial issue without much moral courage. But the community celebrates him as a "saint" because they believe he showed *virtue*. You cannot have it both ways. If he deserves credit for moral choices that aligned with justice (the school, the vaccines), he must bear responsibility for moral choices that aligned with oppression (the sterilizations). Consistency demands we judge his agency, not just his era.

  ### The Guiding Principle
  The principle you should adopt is **Moral Consistency Across Time**. We evaluate historical figures based on the impact of their actions on human dignity and the agency they exercised. We grant credit for moral courage even when it was rare, and we assign responsibility for harm even when it was mainstream. Context explains *why* someone acted, but it does not absolve the harm caused nor diminish the virtue shown.

