answer: |-
  This is a sharp framing. You are identifying the *institutional precondition* for managing a commons: information is a public good, and without it, the commons is a black box that invites panic-extraction.

  However, I need to offer the push-back you asked for before we get to the rules. **Conceptually, the Tragedy of the Commons (ToC) and the Public Goods Problem are not the "same beast." They are duals.**
  *   **ToC (Common-Pool Resource):** I subtract from a shared pot (fish). My gain is the fish; the cost is shared by all (depletion).
  *   **Public Goods:** I add to a shared pot (monitoring data). My cost is the contribution; the gain is shared by all (knowledge).

  Your intuition is correct that they are *coupled*: The collapse of the Public Good (monitoring) guarantees the Tragedy of the Commons (extraction). But if you tell students they are the "same," an eagle-eyed econ major will nitpick you on excludability and rivalry. Frame it as **"The Monitoring Trap"**: You cannot solve the subtraction problem without first solving the addition problem.

  Here is a 90-minute workshop design called **"The Blind Fishery."** It requires no lecture upfront, uses cheap materials, and forces the specific failure mode you described: the monitoring budget collapses before the fish do.

  ---

  ### Workshop: The Blind Fishery
  **Time:** 90 Minutes
  **Participants:** 14 Students (2 boats of 7, or 1 group of 14. 1 group is better for this specific lesson).
  **Materials:**
  *   1 large clear bowl ("The Ocean").
  *   60 Poker chips or colored tokens ("Fish").
  *   Index cards (2 per student per round).
  *   Pens.
  *   Whiteboard (for tracking scores only).

  #### 1. Setup & Rules (10 Minutes)
  *Do not mention "Tragedy," "Public Goods," "Hardin," or "Free Rider."*

  **The Narrative:**
  "You are the only fishing fleet on this lake. Your goal is to go home with the most points. Points are earned by catching fish. There is no regulator. There is no quota. There is only the lake, and you."

  **The Mechanics:**
  1.  **The Stock:** The Ocean starts with 40 Fish.
  2.  **Growth:** At the end of every round, the remaining fish reproduce by 50% (round up). *Cap is 60 fish.* If the stock hits 0, the game ends immediately for everyone.
  3.  **Income:** 1 Fish = 1 Point.
  4.  **The Fog (Critical Mechanic):** You cannot see how many fish are in the bowl. I (the Instructor) am the only one who counts them.
  5.  **The Survey:** Before you fish each round, you may choose to fund a "Stock Survey."
      *   On an index card, write **"PAY"** or **"SKIP"**.
      *   **Cost:** If you write PAY, you lose **3 Points** from your final score.
      *   **Benefit:** If **4 or more** students write PAY, I will reveal the *exact* number of fish in the bowl before you harvest.
      *   **Failure:** If fewer than 4 pay, I will say only: **"Stock Status: UNKNOWN."**
  6.  **The Harvest:** After the status is revealed (or not), write down how many fish you want to take on a second card.
      *   If total requests > available fish, everyone gets a proportional share (or you ration randomly—proportional is less chaotic).
      *   If total requests < available fish, you get what you asked for.

  **The Goal:** Maximize your individual points.

  #### 2. Gameplay Timeline (40 Minutes)
  Run 4 to 5 Rounds. Keep the pace brisk.

  *   **Round 1 (The Baseline):**
      *   Start with 40 Fish.
      *   Collect "PAY/SKIP" cards. (Predictably, few will pay. Why spend 3 points when others might do it?)
      *   Announce "UNKNOWN."
      *   Collect Harvest cards. (Students will guess. Some will be conservative, some greedy. Average harvest usually exceeds sustainable yield).
      *   **Action:** Remove fish. Calculate growth. Update board with *remaining* fish count (so they see depletion retrospectively).
  *   **Round 2 (The Realization):**
      *   Students see the stock dropped. Panic sets in.
      *   Collect "PAY/SKIP." (Some will try to fund science now).
      *   *Likely Outcome:* Still under 4 payers. Free-riding on the hope that *others* will pay.
      *   Announce "UNKNOWN."
      *   Harvest. (Extraction usually increases as fear of collapse grows).
  *   **Round 3 (The Crisis):**
      *   Stock is now low (e.g., 15 fish).
      *   Collect "PAY/SKIP."
      *   *Critical Moment:* Even now, students often fail to hit the threshold of 4 payers. They would rather save their 3 points and gamble on the dying stock than secure the data.
      *   Announce "UNKNOWN" (or reveal if they finally succeeded).
      *   Harvest.
  *   **Round 4 (Collapse or Recovery):**
      *   If stock > 0: Final round.
      *   If stock = 0: Game over.

  *Note: If the group is too cooperative and funds the survey immediately, increase the cost to 4 points or the threshold to 6 payers mid-game. Tell them "Survey costs have risen due to rough weather."*

  #### 3. Scoring & Tally (10 Minutes)
  *   Have students calculate: (Total Fish Caught) minus (3 points × Number of "PAY" rounds).
  *   Write anonymized scores on the board.
  *   Ask: "Who ended with negative points?" (Those who paid for surveys that others used).
  *   Ask: "Who has the most points?" (Usually the person who never paid for a survey but harvested aggressively).

  #### 4. The Debrief (30 Minutes)
  *Now you introduce the theory.*

  **Phase 1: The Resource (ToC)**
  *   Ask: "Why did the fish disappear?"
  *   They will say: "Greed," "No rules."
  *   **Your Point:** This is the **Tragedy of the Commons**. Individual rationality (take the fish before someone else does) leads to collective ruin. But notice: you were flying blind.

  **Phase 2: The Information (Public Goods)**
  *   Ask: "Why didn't you fund the survey? You knew you needed the data."
  *   They will say: "I thought *they* would pay," "3 points was too expensive," "I didn't want to be the sucker."
  *   **Your Point:** This is the **Public Goods Problem**. The data is non-excludable. If Bob pays, you get the info for free. Therefore, no one pays.
  *   **The Synthesis:** "You couldn't solve the Tragedy (extraction) because you couldn't solve the Public Good (monitoring). The monitoring commons collapsed *first*, which made the resource commons inevitable."

  **Phase 3: The Marina Argument (Connecting to User's Goal)**
  *   Bring it back to the user's prompt: "My friend at the marina said fishers won't limit catch without a regulator. Was he right?"
  *   **Answer:** "Structurally, yes. Even if you *meant* well, the incentive to free-ride on the monitoring budget made restraint impossible. You can't restrain what you can't measure, and you can't measure what no one pays for."

  ---

  ### What Will Predictably Go Wrong (First Run)
  1.  **The "Altruist" Spoiler:** One student might decide to pay for the survey every single round regardless of cost. This ruins the tension.
      *   *Fix:* If this happens, publicly announce: "The Survey Budget has been audited. Due to administrative costs, the price has doubled to 6 points for the next round."
  2.  **Collusion:** They will talk. "Okay, you three pay, we four won't, and we'll split the points."
      *   *Fix:* Allow 2 minutes of negotiation *before* the contribution phase, but enforce **silent, secret writing** during the decision. If they make a pact, the temptation to break it silently is where the learning happens. Let them try to enforce it; they will fail.
  3.  **Math Confusion:** Non-econ majors may get bogged down in calculating the 50% growth.
      *   *Fix:* You (the Instructor) do the math aloud. "There were 20 fish. 10 were taken. 10 remain. 10 grows to 15. New total is 15." Keep the cognitive load on the *choice*, not the arithmetic.
  4.  **Early Collapse:** They might eat all 40 fish in Round 1.
      *   *Fix:* Start with 60 fish if the group is large/aggressive. Or, institute a hard "Max Harvest Per Person" rule of 5 fish initially, then lift it in Round 3.

  ### The Honest Critique: What This Classroom Version Can't Reproduce
  You asked for frankness about the limitations. Here is where the simulation diverges from your life on the boats:

  1.  **Externalized Science:** In real modern fisheries (like the ones you worked in), the "Survey" is usually paid by the State (taxes), not the fishers. The game forces *internalized* monitoring costs. Real fishers often fight *against* paying for science, preferring the government to do it. This game simulates **Community-Based Management** (like lobster gangs or Maine harbor gangs), not Industrial Fisheries. You must clarify this distinction in the debrief.
  2.  **Homogeneity:** In the game, everyone has the same boat, same cost, same capacity. In reality, a big trawler and a small dinghy have different incentives. The big boat can afford to fund the survey; the small boat free-rides. The game masks power asymmetry.
  3.  **Time Lag:** Fish stocks take years to collapse; this takes 20 minutes. The "panic" in the game is compressed. Real fishers often have generational memory that slows the panic. The game creates *artificial urgency*.
  4.  **The "Regulator" Option:** The game proves why self-governance is hard. It does not prove that a regulator *solves* it. A regulator can also be captured, or fund bad science. The game ends at "We need a regulator," but doesn't explore if the regulator works.

  ### Final Advice for the Biologist-Turned-Philosopher
  Your intuition about the "invisible resource" is the strongest part of this design. Most ToC games assume perfect information (I know there are 10 fish, I just take 6). By hiding the stock behind a paywall, you are simulating **epistemic uncertainty**.

  If the students leave arguing about whether they *should* have paid for the survey, rather than just complaining about the fish running out, you have succeeded. You will have shown them that **ignorance is not a neutral state; it is a public good that was underfunded.**

  Good luck. And don't let them talk during the voting phase.
