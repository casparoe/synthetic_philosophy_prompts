      *   **Steps 1 & 2:** These are solid exegesis. Aristotle *does* make this distinction in *Politics* Book I. He *does* condemn interest (*tokos*) as unnatural because money is for exchange, not generation.
      *   **Step 3:** Describes modern finance accurately.
      *   **Step 4 (The Slip):** This is where the anachronism bites hardest.
          *   *Aristotle's Context:* He is talking about *commercial trade for profit* and *usury* (lending to consume), not institutional investment for social security.
