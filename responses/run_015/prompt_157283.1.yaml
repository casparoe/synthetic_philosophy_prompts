          *   *Retirement Accounts:* Are they *chrematistike*? In a strict technical sense, yes, they rely on interest/returns. But is the *intent* limitless accumulation? No, it's bounded by the need for subsistence in old age (*oikonomia* goal).
      *   **Step 5:** The moral condemnation. This assumes the *mechanism* defines the morality, ignoring the *telos* (purpose). For Aristotle, the *telos* matters most. If the end is household security, it leans toward *oikonomia*, even if the means involve money.
      *   **Step 6 & 7:** The reductio ad absurdum.

  4.  **Identify the Core Problem:**
      The friend is committing a category error. They are treating a *mechanism* (compound interest) as the sole determinant of moral status, ignoring Aristotle's primary criterion: the *telos* (purpose/limit).
