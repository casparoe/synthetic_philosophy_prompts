answer: |-
  (1) **Distinct Rules:** The three decisions are jointly consistent with three principles: (a) *Emergency Priority:* Admit migrants facing immediate death or destitution; (b) *Hard Ceiling:* Do not exceed the aquifer's 1,000-person capacity for non-emergency migration; (c) *Democratic Consent:* Existing residents must vote to accept ration cuts to accommodate admitted migrants.

  (2) **Predictions:** 
  *   *Emergency Priority* predicts admitting all 40, as their danger overrides the ceiling.
  *   *Hard Ceiling* predicts admitting only 10 (to reach 1,000) and turning away 30, as the limit is absolute.
  *   *Democratic Consent* predicts admitting only those whose support (via ration cuts or desalination costs) wins a resident vote, regardless of need or capacity.

  (3) **Best Guess & Analog:** My best guess is the council will admit only 10 and turn away 30. The closest analog is **Precedent 2 (Seasonal Workers)**, because it is the only instance where admission was denied based on exceeding the 1,000-person limit. However, this analog does not settle the case because Precedent 2 involved migrants in *no danger*. Precedents 1 and 3 involved danger but remained *under* the limit. The record contains no precedent for resolving the conflict between immediate danger and exceeding capacity.

  (4) **Principles of Plausible Decisions:**
  *   *Admit All (Desalination):* Adopts the principle that **human survival obligations are unlimited**; resource ceilings are technical problems to be solved via cost, not moral boundaries.
  *   *Admit to 1,000 (Turn Away 30):* Adopts the principle that **ecological limits are absolute**; the cooperative's long-term viability and fairness to existing residents trump external emergencies.
  *   *Admit by Vote:* Adopts the principle that **moral obligations are contingent on collective consent**; admission is a function of resident willingness to sacrifice, not merely migrant need or physical capacity.

  (5) **Further Test Case:** To distinguish which rule we actually follow, consider this case: *Five refugees face immediate execution at our harbor. Population is exactly 1,000. Desalination is impossible; only ration cuts are viable, risking resident health.* 
  If we admit them, we prioritize *Emergency Priority* over capacity. If we reject them, we prioritize *Hard Ceiling* over danger. If we vote, we prioritize *Democratic Consent*. This removes the "technology/cost" variable present in the genocide case, isolating the conflict between capacity and danger.
