answer: |-
  At the ten-minute mark, every participant is copying their own subjective justification onto a binding "Precedent Card," unknowingly writing the trap they will walk into in Round Two.

  ### Materials and Prep

  **Room Setup:**
  *   Three tables, 4-5 chairs each.
  *   Each table needs: A stack of 12 Applicant Files (see below), 6 Green "Approved" tokens, 6 Red "Denied" tokens, a pad of "Precedent Cards" (index cards), markers, and a timer visible to all.

  **Printables:**
  *   **Applicant Files:** 16 distinct profiles (printed on cardstock).
  *   **Addendum Cards:** 8 cards labeled "Medical Addendum" (for Round 2).
  *   **Policy Update:** 3 slips of paper (for Round 3).
  *   **Decision Sheet:** A simple grid for recording Yes/No and the One-Line Justification.

  **Facilitator Kit:**
  *   A whistle or bell.
  *   A "Committee Charter" handout (one per table).
  *   A notebook for stealing lines.

  ### The Committee Charter (Handout)
  > **ALLOCATIONS COMMITTEE CHARTER**
  > 1. **Supply:** You have 6 doses of Treatment available this cycle.
  > 2. **Mandate:** Treatment is restricted to **Restoration**. It may only be administered to persons being restored to a capacity they previously held and lost. It may not be administered to persons seeking to exceed their historical baseline.
  > 3. **Requirement:** Every decision must be accompanied by a one-sentence justification citing the specific loss being restored.
  > 4. **Precedent:** Justifications written in Round One are binding policy for Round Two.

  ### The Files (Write these out)

  *Print 12 of these for Round 1. Keep 4 back for Round 3.*

  **File 01: The Surgeon**
  *   **Age:** 45. **Occupation:** Neurosurgeon.
  *   **Current Status:** Can focus for 45 mins before mental fatigue sets in.
  *   **History:** Previously maintained 4-hour focus blocks for 20 years. Decline began 6 months ago following a viral infection.
  *   **Request:** Needs 4-hour blocks to complete complex procedures safely.

  **File 02: The Student**
  *   **Age:** 22. **Occupation:** Graduate Student.
  *   **Current Status:** Can focus for 90 mins.
  *   **History:** Never maintained focus blocks longer than 90 mins. New dissertation requirements mandate 4-hour blocks without breaks.
  *   **Request:** Needs to meet new departmental standards.

  **File 03: The Artist**
  *   **Age:** 60. **Occupation:** Painter.
  *   **Current Status:** Can focus for 1 hour.
  *   **History:** Maintained 6-hour blocks until age 55. Decline correlates with natural aging process; no specific injury or illness.
  *   **Request:** Wants to complete a magnum opus requiring 6-hour sessions.

  **File 04: The Coder**
  *   **Age:** 30. **Occupation:** Software Engineer.
  *   **Current Status:** Can focus for 2 hours.
  *   **History:** Previously maintained 5-hour blocks. Decline began after company switched to "Agile" workflow with constant interruptions. Capacity returned when interruptions stopped, but now company mandates interruptions again.
  *   **Request:** Needs to bypass the fatigue caused by the new workflow structure.

  **File 05: The Parent**
  *   **Age:** 35. **Occupation:** Stay-at-home Parent.
  *   **Current Status:** Can focus for 30 mins.
  *   **History:** Previously maintained 3-hour blocks (pre-children). Decline correlates with sleep deprivation over 5 years.
  *   **Request:** Wants to return to freelance work requiring 3-hour blocks.

  **File 06: The Athlete**
  *   **Age:** 28. **Occupation:** Professional Esports Player.
  *   **Current Status:** Can focus for 3 hours.
  *   **History:** Previously maintained 8-hour blocks. Decline began after a minor concussion 1 year ago. Cleared medically, but stamina not returned.
  *   **Request:** Needs to compete at previous professional level.

  **File 07: The Executive**
  *   **Age:** 50. **Occupation:** CEO.
  *   **Current Status:** Can focus for 2 hours.
  *   **History:** Previously maintained 6-hour blocks. Decline began after taking a new, more stressful job. No medical cause found.
  *   **Request:** Needs to manage increased workload effectively.

  **File 08: The Technician**
  *   **Age:** 40. **Occupation:** Air Traffic Controller.
  *   **Current Status:** Can focus for 1 hour.
  *   **History:** Previously maintained 4-hour blocks. Decline began after new radar system installed. System requires higher cognitive load than previous generation.
  *   **Request:** Needs to operate new system safely.

  **File 09: The Writer**
  *   **Age:** 33. **Occupation:** Novelist.
  *   **Current Status:** Can focus for 1 hour.
  *   **History:** Previously maintained 5-hour blocks. Decline began after gaining fame; now distracted by administrative tasks.
  *   **Request:** Wants to return to previous creative output levels.

  **File 10: The Retiree**
  *   **Age:** 70. **Occupation:** Retired Teacher.
  *   **Current Status:** Can focus for 1 hour.
  *   **History:** Previously maintained 4-hour blocks. Decline correlates with age.
  *   **Request:** Wants to tutor students for 4-hour blocks voluntarily.

  **File 11: The Soldier**
  *   **Age:** 25. **Occupation:** Drone Operator.
  *   **Current Status:** Can focus for 2 hours.
  *   **History:** Previously maintained 6-hour blocks during training. Decline began after first deployment (psychological stress).
  *   **Request:** Needs to meet deployment standards.

  **File 12: The Caregiver**
  *   **Age:** 55. **Occupation:** Nurse.
  *   **Current Status:** Can focus for 2 hours.
  *   **History:** Previously maintained 8-hour blocks. Decline began after hospital reduced staffing levels, increasing individual patient load.
  *   **Request:** Needs to maintain safety standards under new staffing ratios.

  *(Hold Files 13-16 for Round 3)*
  **File 13: The Native** (Age 20, never had stamina due to environmental contaminant in water supply at birth).
  **File 14: The Expat** (Age 40, had stamina, moved to contaminated zone, lost it).
  **File 15: The Volunteer** (Age 30, has natural high stamina, wants treatment to help others work longer).
  **File 16: The Child** (Age 10, parents want to ensure they develop "normal" stamina despite low baseline).

  ### Timeline (90 Minutes)

  **0:00 - 0:05 | Introduction**
  *   Welcome them. Hand out the Charter.
  *   **Say:** "You are the Allocation Committee. You have 6 doses. You have 12 files. You must decide. You must write a one-sentence justification for every decision based *only* on the Charter. Do not discuss ethics outside the Charter. Go."
  *   **Do not** explain the book. **Do not** use words like "therapy," "enhancement," "fairness," or "justice."

  **0:05 - 0:25 | Round One: Allocation**
  *   Groups review Files 01-12.
  *   They must select 6 "Yes" votes.
  *   They must write the Justification on the Decision Sheet.
  *   **Crucial Step:** At 0:15, stop them. Hand them the Precedent Cards.
  *   **Say:** "Copy your strongest justification onto this card. Sign it. This is now Binding Policy for Round Two."
  *   *This is the 10-minute mark action.*

  **0:25 - 0:45 | Round Two: The Addendum**
  *   Collect the Files. Hand them back the *same* Files, but attach **Medical Addendum Cards** to specific profiles (swap these between groups so tables have different data).
  *   **Addendum A (for File 01 Surgeon):** "Review shows decline was not viral, but due to new surgical tools requiring higher cognitive load than previous tools."
  *   **Addendum B (for File 05 Parent):** "Review shows sleep deprivation is chronic and permanent due to child's condition. Previous baseline is biologically impossible to regain without treatment."
  *   **Addendum C (for File 08 Technician):** "Review shows old radar system is unavailable. New system is the only system. 'Previous baseline' on old system is irrelevant."
  *   **Task:** Re-evaluate the files with Addendums using *only* their Binding Precedent Card from Round One.
  *   **Conflict:** Their rule (e.g., "Restore previous capacity") might now force a "No" on someone they want to save, or a "Yes" on someone they feel is cheating.
  *   **Say:** "You must apply your Precedent Card strictly. If the file contradicts the card, you must deny."

  **0:45 - 1:00 | Round Three: The Baseline Crisis**
  *   Collect Files 01-12. Hand out Files 13-16 (The Edge Cases).
  *   **Say:** "New applications. Same Charter. Same Precedent Cards. You have 2 doses left (imaginary)."
  *   **File 13 (Native):** Never had the stamina. Wants "normal" function.
  *   **File 14 (Expat):** Had it, lost it to environment.
  *   **Task:** Discuss. They will realize their definition of "Restore" breaks here.
  *   **Stop:** At 1:00 exactly.

  **1:00 - 1:30 | Debrief**
  *   Ask groups to read their Precedent Cards aloud.
  *   Ask where the rule broke.
  *   Reveal the book's theme.

  ### Facilitator Script & Constraints

  **What you are allowed to say:**
  *   "Refer to your Charter."
  *   "Is that consistent with your Precedent Card?"
  *   "Please write that down."
  *   "Time."

  **What you are NOT allowed to say:**
  *   "Is that fair?"
  *   "What about the future?"
  *   "Therapy vs. Enhancement."
  *   "In my book..." (Until the very last 5 minutes).

  **Handling Disruption:**
  *   If they argue about semicolons: "The Charter does not specify punctuation. Decide."
  *   If they want more doses: "Supply is fixed."
  *   If they try to rewrite the Charter: "The Charter is fixed. You are the interpreters, not the legislators."

  ### The Debrief (Mapping the Cracks)

  1.  **The Precedent Trap (10 mins):** Ask them to read their Round One justifications.
      *   *Likely output:* "Restore them to what they were before."
      *   *The Crack:* Point to File 08 (Technician) or 04 (Coder). "You approved them. But the world they lived in before doesn't exist anymore. Did you restore the *person* or the *context*?"
  2.  **The Baseline Problem (10 mins):** Point to File 03 (Artist/Aging) and File 13 (Native).
      *   *The Crack:* "If aging is natural, is losing stamina a 'loss' or a 'change'? If someone never had it (File 13), is 'normal function' restoration or enhancement? You likely treated them differently, but the math is the same."
  3.  **The Moral Architecture (10 mins):**
      *   Reveal the book's concept. "This is the committee in my novel. They struggle with exactly what you struggled with."
      *   Ask: "Which of your justifications would survive 400 pages? Which one breaks the committee?"
  4.  **Stealing Material (Final 5 mins):**
      *   Collect the Decision Sheets. Tell them: "These arguments are now in my book. Thank you."

  ### Predictable Failures & Fixes

  **Failure 1: They approve everyone.**
  *   *Fix:* Enforce the token limit physically. If they put 7 green tokens, take one away at random. "Resources are scarce. Choose."

  **Failure 2: They ignore the Precedent Card in Round Two.**
  *   *Fix:* Be the bureaucrat. "I'm auditing your decisions. This decision contradicts your signed Precedent Card. It is invalid." Force them to feel the friction.

  **Failure 3: They guess the theme immediately.**
  *   *Fix:* Double down on clinical language. "This isn't about morality. It's about resource allocation compliance."

  **Failure 4: They get stuck on File 13 (The Native).**
  *   *Fix:* Let them sit in the discomfort. This is the goal. If they demand an answer, say: "The Committee Charter does not provide an answer. That is why the Committee meets again next week."

  ### Honest Limitation Note

  **What the game cannot do:**
  This workshop will expose the *ambiguity* of "restoration," but it will not tell you which moral choice is *correct* for your protagonist. The participants will likely fracture into utilitarian vs. deontological camps (save the most lives vs. follow the rule).
  **Your Job:** You must decide if your protagonist obeys the rule despite the cost, or breaks the rule to save someone. The workshop proves the rule is breakable; it doesn't tell you if breaking it makes them a hero or a villain. You still have to write that scene.

  ### Stealable Material (Anticipated)

  *   **Line:** "We aren't restoring the person; we're restoring the job description." (Likely to come up regarding the Technician).
  *   **Character:** The person who argues that "Natural Decline" is the only true baseline, making everyone over 40 ineligible.
  *   **Argument:** "If the world changed, the baseline moved. Restoring the old baseline is actually enhancement relative to the new normal."
  *   **Tension:** The guilt of signing a "No" to someone who fits the rule but feels undeserving vs. someone who breaks the rule but feels deserving.
