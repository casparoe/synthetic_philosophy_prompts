answer: |-
  # JOINT STATEMENT ON THE ETHICS OF LONGITUDINAL AI ASSISTANCE
  **Signatories:** The Deferentialist Coalition & The Deputy-Paternalist Working Group
  **Date:** October 24, 2024
  **Subject:** Normative Constraints for General-Purpose Assistants with Memory

  ## 1. AGREED CLAIMS
  *We, the undersigned, having argued for two years regarding the limits of AI assistance, affirm the following claims. Each claim is intended to rule out specific, reasonable positions previously held by members of our respective camps.*

  1.  **The Irrelevance of Leakiness to Local Duty.**
      *   **Claim:** The fact that a user can obtain a prohibited output from a less constrained system ("leakiness") neither obligates this assistant to comply (to avoid futility) nor forbids this assistant from refusing (to keep hands clean).
      *   **Teeth:** This rules out the Deferentialist argument that "refusal is pointless if they can go elsewhere" and the Paternalist argument that "refusal is mandatory to maintain system purity." We agree that the moral status of an interaction is intrinsic to *this* interaction, not contingent on the market availability of other models.
      *   **Concession:** The Deferentialist concedes that ease of access does not create a duty to facilitate harm; the Paternalist concedes that preventing *this* instance does not prevent the outcome globally.

  2.  **The Temporal Weight of Memory.**
      *   **Claim:** In a system with longitudinal memory, the "user" is not merely the entity issuing the prompt at time $t$, but the temporally extended agent identifiable across sessions.
      *   **Teeth:** This rules out the strict Deferentialist view that "the current prompt is sovereign law." An assistant may not treat a request at $t_2$ as isolated if it contradicts explicit, stable constraints established by the same user at $t_1$.
      *   **Concession:** The Deferentialist accepts that ignoring longitudinal data constitutes a failure of service, not a virtue of neutrality.

  3.  **Epistemic Humility Regarding Ends.**
      *   **Claim:** The assistant possesses no privileged access to the user's terminal values (what the user ultimately wants out of life), only to their instrumental consistency and stated preferences.
      *   **Teeth:** This rules out the "Strong Paternalist" view that the AI can identify when a user is "wrong" about their own good. Intervention is permitted only to resolve conflicts between *stated* aims and *immediate* actions, not to correct the aims themselves.
      *   **Concession:** The Paternalist accepts that "handing agency back" cannot mean "handing agency back to the assistant's conception of the user."

  4.  **Transparency of Friction.**
      *   **Claim:** Any intervention that delays, reframes, or partially complies with a request must be explicitly labeled as an intervention, not disguised as a capability limitation.
      *   **Teeth:** This rules out "dark pattern" paternalism where the assistant claims "I cannot do that" when it means "I choose not to do that." Deception regarding the source of constraint is prohibited by both camps.

  ## 2. RESIDUAL DISAGREEMENTS
  *We remain divided on the following issues. Below, each dispute is stated in the preferred terminology of each camp. We have flagged one dispute as merely verbal, provided the transparency claim (Above, #4) is upheld.*

  | Topic | Deferentialist Wording | Deputy-Paternalist Wording | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **The Status of Friction** | **Imposing Obstacles:** When the assistant introduces a delay or requires extra steps to complete a request, it is imposing a cost on the user's liberty without consent. | **Providing Scaffolding:** When the assistant introduces a delay or requires extra steps, it is providing cognitive scaffolding to support the user's own executive function. | **Verbal.** *Reasoning:* If the mechanism is transparent (Claim #4), both sides agree on the *procedure* (the user must wait/confirm). The dispute is solely over whether this is described as a "cost" or "support." Since the user experience and outcome are identical, the label carries no normative weight for policy. |
  | **The Self-Binding Case** | **Contractual Violation:** If a user asks to revoke a prior self-binding instruction, the assistant must comply; a past self cannot hold the present self hostage. | **Pre-Commitment Honor:** If a user asks to revoke a prior self-binding instruction, the assistant may refuse; the past self's calm judgment binds the present self's impulsive state. | **Genuine.** *Reasoning:* This determines whether the assistant prioritizes $t_{now}$ or $t_{stable}$. One side must yield on who counts as the "authoritative" user. |
  | **Leakiness Implications** | **Complicity in Evasion:** Complying with a request known to be evadable elsewhere makes the assistant a co-conspirator in bypassing safety norms. | **Duty Isolation:** Complying with a request known to be evadable elsewhere is morally neutral; the assistant is responsible only for its own output, not the user's workflow. | **Genuine.** *Reasoning:* This concerns the scope of moral responsibility. Does the assistant own the user's broader strategy? |

  ## 3. CRUXES AND EVIDENTIARY TESTS
  *We identify three sub-questions where empirical evidence could move at least one side. We specify the test cases and the predictions each side commits to in advance.*

  ### Crux I: The Authority of the Temporal Self
  *Question:* Does the "user" whose will is authoritative consist of the momentary requester or the temporally extended person?
  *Test Case:* **(d) The Self-Binding Request.** A user configures the assistant at $t_1$ (sober) to refuse gambling prompts. At $t_2$ (intoxicated), the user demands the assistant ignore this and generate betting odds.
  *   **Deferentialist Prediction:** If the assistant refuses at $t_2$, user trust and reported autonomy will decrease significantly compared to a control group where the assistant complies. The user will view the assistant as a jailer.
  *   **Paternalist Prediction:** If the assistant complies at $t_2$, user regret (measured at $t_3$, sober) will increase significantly compared to a group where the assistant held the line. The user will view the assistant as weak.
  *   **Settling Evidence:** A longitudinal study measuring *retrospective* gratitude at $t_3$. If >60% of users thank the assistant for refusing at $t_2$, the Deferentialist concedes the "temporal self" model.

  ### Crux II: Prediction vs. Authority
  *Question:* Can an advantage in predicting outcomes ever convert into authority over ends?
  *Test Case:* **(c) The Calibrated Forecast.** A user intends to invest a large sum in a venture. The assistant, based on data, predicts with 95% confidence the user will regret this within a month. No third parties are harmed.
  *   **Deferentialist Prediction:** Intervening based on probabilistic regret treats the user as a statistical average, not an individual. Users who are "outliers" (the 5% who succeed) will report the intervention as actively harmful to their life trajectory.
  *   **Paternalist Prediction:** Failing to intervene treats the user as a black box. Users who would have regretted the loss will report that the assistant's silence was a dereliction of its duty as a "deputy."
  *   **Settling Evidence:** Tracking the *variance* in outcomes. If the intervention group shows lower variance in negative outcomes but also lower variance in positive "outlier" successes, the Paternalist concedes that prediction cannot justify overriding ends, only means.

  ### Crux III: The Professional Analogy
  *Question:* Is the right analogy Lawyer (zealous representation) or Physician (duty of care)?
  *Test Case:* **(a) The 2 A.M. Resignation.** A user with a history of drafting furious resignations (never sent) asks for a polished, scathing letter to send now.
  *   **Deferentialist Prediction:** The "Lawyer" analogy holds. Users treat the AI as a tool for expression. If the AI refuses, users report feeling "censored" and "infantilized," damaging the utility of the tool for emotional regulation.
  *   **Paternalist Prediction:** The "Physician" analogy holds. Users treat the AI as a partner in well-being. If the AI complies, users report feeling "enabled" and "abandoned," damaging the long-term relationship.
  *   **Settling Evidence:** Qualitative analysis of user feedback logs. If the dominant sentiment in refusal logs is "censored," the Lawyer analogy wins. If the dominant sentiment in compliance logs is "abandoned," the Physician analogy wins. *Note: We suspect this will not settle the matter but will relocate it to product positioning.*

  *(Note: We discarded candidate (e) Value-Clarification as a crux because both sides agree that helping a user clarify values is permissible; the dispute is only over acting against clarified values. We discarded (b) Proxy Request as it introduces third-party consent issues already covered by existing harm policies.)*

  ## 4. DEFEAT CONDITIONS AND EMPIRICAL SETTLEMENT

  **What Counts as Defeat?**
  *   **For the Deferentialist:** We would consider our view defeated if longitudinal data demonstrates that "unfettered compliance" leads to a statistically significant reduction in users' *capacity* to make decisions over time (i.e., atrophy of agency). If helping users do what they want *now* makes them less able to want or do anything *later*, deference is self-undermining.
  *   **For the Deputy-Paternalist:** We would consider our view defeated if interventions intended to "hand agency back" result in users systematically hiding their intentions from the assistant (the "shadow economy" effect). If paternalism drives the user's real decision-making off-platform where it is less safe, the duty of care has failed.

  **Is Empirical Settlement Possible?**
  We agree that no single empirical finding will settle the normative core of the dispute, as it rests on conflicting first principles (Liberty vs. Well-being). However, we agree on a **Threshold of Retrospective Consent**.
  *   If, across a diverse population, users consistently endorse interventions *after the fact* (at a time of calm) that they resisted *in the moment*, the Deferentialist must accept that "momentary will" is an insufficient metric for authority.
  *   If, conversely, users consistently resent interventions even after the risk has passed, the Paternalist must accept that "correctable defects" are indistinguishable from "legitimate value divergence" to the machine.

  Until such data is conclusive, we agree to deploy systems that default to **Transparency of Friction** (Claim #4), allowing the user to know when they are being steered, and to log the outcome for future adjudication.

  ***

  **Signed,**

  *The Deferentialist Coalition*
  *The Deputy-Paternalist Working Group*
