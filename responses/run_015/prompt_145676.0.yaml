      *   **Ill-posed?** The question "Did Protestantism cause Capitalism?" is too binary. It should be "Under what conditions did religious doctrine act as a binding constraint on economic behavior?"
      *   **Progress:** Needs a combination. Formal models (to show *how* beliefs shift equilibria) + Natural Experiments (to show *that* they did).

  5.  **Drafting the Response (Iterative Process):**

