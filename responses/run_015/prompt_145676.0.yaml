answer: |-
  This is a sharp diagnosis. You've correctly identified that the stalemate isn't just about evidence; it's about the *ontology of causation* in social science.

  Here is the diagnosis of the stall, the role of bedrock intuitions, and what actual progress requires.

  ### 1. The Diagnosis: It's Not Verbal, It's Ontological + Methodological
  You asked if they are talking past each other about "cause" (macro correlation vs. micro motivation). **Yes, but it goes deeper.**

  The stall persists because the two camps are operating with incompatible models of human action:
  *   **The Materialist/Institutionalist Camp:** Operates on a **Rational Choice** ontology. Preferences are exogenous and stable. Actors maximize utility within constraints (prices, laws, technology). "Culture" is either noise or a post-hoc rationalization (ideology) for interest-driven behavior. To them, "values causing economics" looks like magic because ideas don't have price tags.
  *   **The Weberian/Cultural Camp:** Operates on a **Sociological** ontology. Preferences are *endogenous*. Values act as heuristics or "switchmen" (Weber's term) that determine which tracks of action are even visible or legitimate. To them, ignoring values is like ignoring gravity because you can't see it.

  **The Stall:** The materialists demand **identification** (show me the exogenous variation), while the Weberians offer **interpretation** (show me the meaningful connection).
  *   When Materialists ask for statistical covariance, Weberians say you're missing the mechanism.
  *   When Weberians describe motivational mechanisms, Materialists say you're committing the ecological fallacy or cherry-picking anecdotes.

  It is not merely verbal. It is a clash between **explaining by constraint** (Materialism) vs. **explaining by constitution** (Culturalism).

  ### 2. The Bedrock Intuition: "Ideas Can't Push Matter"
  You asked if there is a bedrock intuition that ideas can't push matter. **Absolutely.**

  This is the "Epiphenomenal Suspicion." In the hard sciences (and much of neoclassical economics), causality requires energy transfer or incentive modification. A belief, absent a change in price or law, is "cheap talk."
  *   **The Materialist Axiom:** If a behavior persists, it must be incentive-compatible. If Protestant thrift persisted, it must have paid off. Therefore, the profit motive caused the thrift, and the religion was just the branding.
  *   **The Weberian Counter:** Sometimes beliefs make people do things that are *not* immediately incentive-compatible (e.g., asceticism), which inadvertently creates new economic equilibria (capital accumulation).

  The debate stalls because the Materialists view the Weberian mechanism as theoretically impossible without a hidden material variable, while Weberians view the Materialist reduction as missing the historical specificity of *why* that specific behavior emerged *then*.

  ### 3. The Counterfactual Dispute (Jain/Catholic Merchants)
  You mentioned the Jain merchant networks. This is the strongest empirical wedge, but it is often misused.
  *   **The Trap:** If capitalism existed in Catholic Italy or Jain India, does that disprove Weber?
  *   **Weber's Actual Claim:** Weber did not argue Protestantism *invented* capitalism (acquisition of wealth). He argued it created the *Spirit* of Capitalism (rational, systematic, continuous organization of labor and capital).
  *   **The Real Dispute:** The hidden empirical dispute is about **equifinality**.
      *   **Materialists** argue: Capitalism is the default equilibrium of trade + secure property rights. Protestantism was irrelevant.
      *   **Weberians** argue: Capitalism is a fragile, specific equilibrium that requires a cultural "lock-in" to prevent elites from consuming surplus rather than reinvesting it.

  The Jain example suggests **functional equivalence** (different values $\rightarrow$ same outcome). This hurts the "Necessity" claim but not the "Sufficiency" claim. The stall continues because neither side can run the counterfactual history: *Would Northern Europe have industrialized without the Reformation?*

  ### 4. What Would Progress Look Like?
  The debate won't be solved by more archival digging alone, nor by more theory alone. It requires a specific synthesis.

  **A. Formal Models of Belief-Driven Selection (High Potential)**
  We need game-theoretic models where beliefs are not just "preferences" but **coordination devices**.
  *   *Progress:* Show how a religious doctrine lowers transaction costs or solves a commitment problem that material incentives cannot. (e.g., "Predestination" creates a signal of trustworthiness that contracts cannot).
  *   *Why:* This translates "culture" into "incentives" without reducing it to "material interest." It shows how ideas *become* matter by altering the payoff matrix.

  **B. The "Human Capital" Mechanism (Current Frontier)**
  Recent economic history (Becker, Woessmann, Cantoni) has moved the goalposts.
  *   *Shift:* Instead of "Ethic $\rightarrow$ Capitalism," the mechanism is "Protestantism $\rightarrow$ Literacy (to read Bible) $\rightarrow$ Human Capital $\rightarrow$ Growth."
  *   *Progress:* This bypasses the "values" debate by finding a material channel for the cultural input. It validates Weber (Protestantism caused growth) but via a mechanism Materialists accept (education/skills).
  *   *Limit:* This explains growth, but not necessarily the *Spirit* (the psychological orientation toward work).

  **C. A Conceptual Split: "Origin" vs. "Sustainment"**
  The cleanest way to split the debate is to distinguish the **genesis** of the behavior from its **maintenance**.
  *   *Hypothesis:* Values (Protestant Ethic) were necessary for the *genesis* (breaking the traditionalist equilibrium).
  *   *Hypothesis:* Institutions (Markets/Laws) are sufficient for the *maintenance* (once the habit is formed, the belief can fade).
  *   *Resolution:* This allows Materialists to be right about modern capitalism and Weberians to be right about the transition.

  ### 5. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that the stall is ontological (preferences as exogenous vs. endogenous) and that the "Human Capital" channel is where the empirical resolution is currently happening. The distinction between "Origin" and "Sustainment" is the most viable theoretical off-ramp.

  **Least Sure: The Efficacy of Formal Modeling**
  I am least sure (50%) that **formal modeling** alone will resolve the historical dispute. While models can show *how* beliefs *could* cause economic change (possibility), they cannot prove they *did* in 17th-century Europe (actuality). History is a single data point. We risk building elegant models that fit the theory but remain historically unverified. The "Jain Counterfactual" remains a thorn because it suggests multiple cultural paths to the same economic endpoint, which weakens the specific causal weight of the Protestant Ethic, regardless of how well-modeled it is.

  **Summary Recommendation:**
  Stop asking "Did Culture Cause Capitalism?" Start asking: "Did Religious Doctrine solve a Commitment Problem that Secular Institutions Could Not?" That reframes the question from metaphysics to mechanism.
