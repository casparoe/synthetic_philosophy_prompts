      *   *Refinement:* It's more about *exogeneity*. Materialists treat culture as endogenous to economics. Weberians treat culture as exogenous (or at least semi-autonomous) to economics at the critical juncture.
      *   *The Stall:* It's not just verbal. It's about identification strategies. How do you isolate culture from institutions from geography?

