answer: |-
  ### Part 1: The Examination Question

  **Question 1**

  Consider Species M, a hypothetical social invertebrate with a nervous system of a few hundred thousand neurons. Intact members of M exhibit the full suite of behaviours often cited as evidence for consciousness: they learn to avoid cues paired with noxious stimuli; they trade off this avoidance against competing goals in a needs-sensitive manner; they reverse learned responses when contingencies change; they display pessimistic judgement biases after unpredictable stress; and they work for analgesic substances, doing so more vigorously after injury.

  Neurophysiological investigation reveals a small, pharmacologically dissociable cluster of neurons (the "hub") that supports sustained long-range synchronised activity. This activity correlates perfectly with the flexible, trade-off-sensitive behaviours listed above, and with nothing else. When the hub is chemically blocked, the animal (blocked-M) still withdraws from noxious stimuli, mounts endocrine stress responses, acquires simple conditioned avoidances, shows pessimistic judgement biases, and works for analgesics after injury. However, blocked-M no longer trades avoidance off against competing goals, reverses learned responses, or modulates nocifensive behaviour by context.

  (a) What does the dissociation between intact-M and blocked-M show regarding whether blocked-M has experiences? Explain why this case might appear decisive to a proponent of one theory of consciousness but merely descriptive to a proponent of another. What specific kind of evidence would need to be added to the case for it to genuinely adjudicate between these competing theories?

  (b) Suppose a lineage closely related to M constitutes a massive share of invertebrate biomass in agriculture, such that the number of individuals affected by policy dwarfs the number of vertebrates involved. Suppose further that reasonable experts examining the evidence assign credences between 0.05 and 0.6 that members of this lineage have experiences. Given your analysis in (a), what follows for how we ought to treat them? You must explicitly name the decision rule you are employing and justify why that rule is appropriate given the epistemic constraints identified in part (a).

  ***

  ### Part 2: Model Answer

  The dissociation between intact-M and blocked-M demonstrates functional modularity, but it fails to settle the metaphysical question of experience. Intact-M possesses a neural substrate (the hub) that integrates nociceptive input with motivational state and contextual memory. Blocked-M retains the capacity to detect damage and initiate stress responses but lacks the capacity to integrate that detection into flexible, goal-directed planning. To a Global Workspace theorist, the hub *is* the seat of consciousness; blocking it extinguishes experience, rendering blocked-M a philosophical zombie. To a Perception-Action theorist, consciousness is tied to specific sensory-affective loops; since blocked-M still processes noxious stimuli and works for analgesics, it likely retains a raw, unmodulated phenomenology. The case looks decisive only if one assumes the conclusion of one's preferred theory beforehand. Without an independent account of why long-range synchrony (rather than local processing) is the marker of experience, the case is a mere redescription of neural architecture.

  To adjudicate between these theories, we would need evidence that breaks the correlation between the hub and the behaviour in a way that tracks first-person reports. Since M cannot report, we would need to show that the hub is necessary for *learning* that is impossible without awareness, or that blocking the hub leaves the animal vulnerable to stimuli it should consciously perceive but fails to attend to. Absent this, we cannot classify blocked-M as a clean negative. It is better described as a degraded or partial case. If consciousness admits of degrees, blocked-M may possess a thinner, more reflexive form of experience than intact-M. This undermines the search for a sharp taxonomic cutoff; if the hub can be partially inhibited, or if similar hubs exist on a continuum across species, the line between "conscious" and "non-conscious" becomes a gradient of integration rather than a binary switch.

  This epistemic indeterminacy directly constrains the ethical decision in part (b). We face high stakes (massive biomass) and significant uncertainty (credences 0.05–0.6). A binary precautionary principle ("if there is any chance, treat as fully conscious") is unsustainable here; applying vertebrate-level protections to trillions of invertebrates would collapse food systems, and the lower bound of credence (0.05) suggests non-trivial doubt. Conversely, ignoring the possibility is morally reckless given the upper bound (0.6).

  The appropriate decision rule is **Expected Value Maximisation with a Moral Risk Premium**. We calculate the expected moral cost of harming them (Probability of Consciousness × Moral Weight of Harm) and weigh it against the cost of protection. However, because the epistemic situation in (a) reveals that our uncertainty is structural (we lack the theory to distinguish zombies from experiencers) rather than merely empirical, we cannot rely on standard probabilities alone. We must apply a risk premium: we act as though the probability is higher than the mean credence (e.g., treating 0.6 as the working figure) to account for the possibility that our theories are fundamentally wrong about the neural correlates.

  This rule avoids the paralysis of strict precaution while respecting the moral significance of the uncertainty. It acknowledges that blocked-M might feel pain without the "hub's" cognitive mediation. However, a stopping point is required to prevent the rule generalising to simple thermostats. The rule applies only where there is evidence of *some* integrative capacity (like the stress response or analgesic self-administration seen in blocked-M). Systems lacking even the dissociated nociceptive loops fall below the threshold for moral risk. Thus, the epistemology of the hub does not solve the distribution question, but it dictates that our ethics must be sensitive to degrees of integration rather than binary status.

  ***

  ### Part 3: Marking Scheme (20 Marks)

  **1. The Bridging Premise (4 Marks)**
  *   **Requirement:** The student must identify that inferring experience from behaviour/physiology requires a bridging premise (e.g., "flexible behaviour implies feeling") and note that this premise is shaky even in humans where verbal report is available (e.g., dissociations between report and physiology).
  *   **4 Marks:** Explicitly notes the gap between third-person data and first-person fact; references human report limitations.
  *   **0-3 Marks:** Treats behaviour as direct proof of experience; ignores the human report analogy.
  *   *Typical Failure:* Assuming that because report is our gold standard, the absence of report in M is evidence of absence.

  **2. Theory Adjudication (4 Marks)**
  *   **Requirement:** The student must explain why the case fails to decide between theories (theory-ladenness of the "hub") and specify what evidence (e.g., report-analogues or specific learning deficits) would be needed to fix this.
  *   **4 Marks:** Clearly articulates that the "hub" is only a correlate relative to a theory; identifies the need for theory-independent markers.
  *   **0-3 Marks:** Picks one theory (e.g., Global Workspace) and declares the case settled based on that theory alone.
  *   *Typical Failure:* Plugging a single theory into the case and reading the answer off as if it were neutral data.

  **3. Status of Blocked-M (4 Marks)**
  *   **Requirement:** The student must address whether blocked-M is a clean negative or a partial/degraded case, and discuss the implication for sharp taxonomic cutoffs vs. degrees of consciousness.
  *   **4 Marks:** Argues for partiality/degrees; explains why a sharp cutoff is unjustified given the dissociation.
  *   **0-3 Marks:** Treats blocked-M as simply unconscious; assumes a sharp line exists somewhere in the taxonomy.
  *   *Typical Failure:* Helping themselves to a sharp line between taxa that merely needs discovering.

  **4. Decision Rule Justification (4 Marks)**
  *   **Requirement:** The student must name a decision rule (e.g., Expected Value, Precautionary Principle) and justify it based on the *epistemic constraints* from part (a), not just general moral intuition.
  *   **4 Marks:** Rule is named; justification explicitly links the uncertainty type (structural vs. empirical) to the rule's parameters.
  *   **0-3 Marks:** Rule is named but justified by moral preference alone; or part (b) is treated as independent from part (a).
  *   *Typical Failure:* Closing the practical part with an unanalysed call for caution.

  **5. Generalisation and Stopping Point (4 Marks)**
  *   **Requirement:** The student must address the objection that their rule might generalise to unwanted systems (e.g., robots, plants) and propose a credible stopping point (e.g., presence of nociceptive loops).
  *   **4 Marks:** Acknowledges the slippery slope; offers a principled constraint on the rule's application.
  *   **0-3 Marks:** Ignores the scope of the rule; allows it to apply to any system with feedback.
  *   *Typical Failure:* Treating every behavioural marker as equally probative without checking for false positives in non-sentient systems.

  **Differentiation Criteria**
  *   **B Script:** Treats part (a) and part (b) sequentially. Solves the metaphysics (or claims it is unsolvable) and then moves to ethics as a separate module, perhaps applying a generic precautionary principle regardless of the specific epistemic nuance found in (a).
  *   **A Script:** Identifies that the *structure* of the epistemic uncertainty in (a) (i.e., theory-ladenness and the possibility of partial consciousness) forces the specific choice of decision rule in (b). The ethical rule is designed to manage the specific type of ignorance exposed in the philosophical analysis.
