      *   *Critique:* Is the moral argument too abstract?
      *   *Fix:* Ground it in conservation policy (ESA) to make it concrete for a biologist reader.

  6.  **Final Review:** Does this answer the retired biologist's underlying worry? The dialogue should show that the "incoherence" is a philosophical debate about *what kind of thing* a species is, not necessarily a claim that biologists are doing bad work. (I will add a brief intro/outro note to address the user directly, framing the dialogue).

  7.  **Final Polish:** Check word choice. Ensure "transitivity," "monophyly," "reproductive isolation," and "normative" are used correctly. (Proceed to generate output).

