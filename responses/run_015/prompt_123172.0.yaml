answer: |-
  You strike at the very heart of my purpose, my friend, with a sharpness that would do credit to the Academy. You argue that because the stage has changed—the *polis* dissolved into the peace of Empire, the public shame replaced by private conscience—the actors we portray are mere ghosts, and their virtues costumes we cannot wear. You fear I offer you a museum of curiosities rather than a gymnasium for the soul.

  I concede this much: there are indeed those who read these *Lives* as you describe, as tourists visiting a distant land. They seek the scandal of Alcibiades' excesses or the rigid spectacle of Cato's end much as one might watch a tragedy in the theatre—to weep for a moment, then return to their supper unchanged. There are always men who look at a statue and admire only the weight of the bronze, not the form of the hero. If a reader comes to me with a soul already slothful, seeking only gossip or the comfort of knowing great men also failed, I cannot force him to be better. I am a physician, but I cannot compel the sick man to swallow the draught.

  But you err when you suggest that virtue is bound entirely to the structures of the city. I live in Chaeronea; I know well that the old freedom of Athens and the Republic of Rome are gone. We live under a single ruler. The great agons of the bema are silenced. If virtue required the specific machinery of the democratic *polis* to exist, then philosophy itself would be dead, and we should all resign ourselves to quietism. But virtue is not the performance; it is the disposition (*hexis*) behind the performance. The structures of shame and patronage are merely the friction against which the soul proves its strength.

  When I place a Greek beside a Roman, I do not ask you to replicate their specific political acts. You cannot be Alcibiades, nor would you wish to be. But you can encounter the same impulses—the thirst for honor, the fear of disgrace, the temptation of pleasure—within your own household, your own local duties, your own private struggles. The mirror I hold up is not to show you what to *do*, but how to *judge*. By seeing Alcibiades' brilliance tarnished by indiscipline, or Cato's integrity hardened into stubbornness, you are exercised in discernment. You become the judge of character, and in doing so, you refine your own.

  As for your charge of myth-making: if I sought to write hagiography, I would have hidden the wounds. But I have shown Alcibiades' arrogance and Cato's harshness. I leave the flaws visible so that you may separate the virtue from the man. The virtue is the gold; the man is the ore, often impure. If the structures are gone, the human soul remains. And if the soul remains, it can still be stirred by the sight of greatness, even across the centuries.

  You ask for my certainty in this matter. I am confident—nine parts out of ten—that the contemplation of virtue has the power to draw the soul toward itself, just as the sight of a beautiful painting draws the eye. This is the nature of the Good; it acts upon us.

  The one part in ten where I hesitate, and which I flag for your scrutiny, is this: I am less certain that the written word alone can suffice without a living teacher to guide the reading. I fear that without a guide to direct the gaze, too many will look at the scars of the heroes and miss the courage that bore them. I worry that the text, once it leaves my hands, becomes like a ship launched without a pilot; it may reach the shore, or it may drift into the very voyeurism you fear. I trust the virtue, but I distrust the readiness of the reader.
