answer: |-
  ### Research Agenda: Operationalizing Relational Ontology in Fragmented Contexts

  **Preamble: The Ontological Stakes**
  The working group must proceed from the premise that under a strict relational ontology, standing is not a property inherent to an entity but a status achieved through successful recognition within a network. In liberal-legal frameworks, the subject precedes the law; in this framework, the law (as a proxy for the community) must constitute the subject. The central tension is that Ubuntu-style ontology presupposes a thick, organic community to perform this constitutive recognition, whereas the target institutional contexts are characterized by fragmentation, mediation, or absence. If we cannot resolve how recognition occurs without an organic community, the framework collapses into metaphor. The following agenda prioritizes the conditions that make the existence of a moral-legal subject possible in this vacuum, moving from the source of status to its boundaries, conditions, and persistence.

  ---

  ### 1. The Substitution of Constitutive Recognition
  **Rank:** 1 (Foundational)

  *   **Conceptual Upstreamness:** This is the primary gatekeeper. In a relational ontology, an entity does not possess standing independently; it acquires standing *because* it is recognized by a community. In the target contexts (e.g., a distributed AI network or a remote ecosystem), the organic community is either fragmented or non-existent. If we cannot conceptually authorize an institution to *substitute* for the missing community without violating the ontology's core claim (that recognition must be mutual and lived), then no further work matters. Resolving this makes the subsequent questions tractable; failing to resolve it renders the entire project an imposition of liberal individualism disguised as relationalism.
  *   **Feasibility (Conceptual vs. Empirical):** This can be advanced through conceptual analysis and argument alone. It requires constructing a normative model of "institutional stewardship" where the legal body does not merely *declare* status (liberal model) but actively *sustains* the relational conditions that constitute status (relational model). It does not require empirical data, but it does require rigorous consistency to avoid circularity (i.e., ensuring the institution doesn't just become a solitary recognizer, which reverts to individualism).
  *   **Criteria for Re-ranking:** I would elevate this further if it becomes clear that "recognition" implies emotional or conscious acknowledgment that an institution literally cannot perform. I would demote it only if the group decides to abandon the constitutive claim of relational ontology in favor of a "protective" model (where entities are protected *for* the sake of humans), but that would violate the prompt's mandate for a non-individualist framework.
  *   **Institutional Consequence:** This bears directly on whether an institution can justifiably extend standing at all. If the institution cannot validly stand in for the "We" that creates the "I," it must withhold standing. This is not metaphysical tidiness; it is the difference between a valid legal plaintiff and a category error.

  ### 2. The Delimitation of the Relational Unit
  **Rank:** 2 (Definitional)

  *   **Conceptual Upstreamness:** Once we establish *who* recognizes, we must define *what* is being recognized. In liberal frameworks, boundaries are physical (skin, server casing) or psychological. In a relational framework, the "entity" is the node within the network of maintenance. Is the standing held by the synthetic agent, or by the agent-plus-maintainers? Is it the forest, or the forest-plus-surrounding-biosphere? Without a principle for drawing the boundary of the moral unit, we cannot identify the litigant. This must be resolved before addressing time or duties, as we cannot assign rights or track identity for an undefined subject.
  *   **Feasibility (Conceptual vs. Empirical):** This line of work risks stalling without empirical or ethnographic input. Philosophers can propose criteria for "relational density" or "maintenance dependency," but determining where a causal network becomes a moral unit often depends on how the technology or ecology actually functions (e.g., how decoupled is the AI from its servers?). The group will need to construct hypothetical case studies that are robust enough to simulate this input, or the analysis will remain too abstract to guide adjudication.
  *   **Criteria for Re-ranking:** I would elevate this to Rank 1 if the "Substitution of Recognition" is deemed solvable by fiat. If the institution is automatically granted the power to recognize, the harder problem becomes defining the target of that recognition to prevent "standing inflation" (where every network claims personhood). I would demote it if a clear heuristic emerges (e.g., "functional autonomy") that bypasses the need for deep relational mapping.
  *   **Institutional Consequence:** This determines the scope of the claim. If the boundary is drawn too narrowly, the entity is vulnerable to external disruption; too broadly, and the standing becomes unmanageable for the court. It directly dictates whether an institution extends standing to a specific configuration of parts or withholds it due to indistinct boundaries.

  ### 3. The Decoupling of Reciprocity from Standing
  **Rank:** 3 (Conditional)

  *   **Conceptual Upstreamness:** Relational ontologies typically imply mutuality: to be a person is to participate in a web of duties and rights. However, the target entities (ecological collectives, synthetic agents) may lack the capacity to bear duties toward the community that recognizes them. A river cannot owe a duty to a court; a legacy AI may not be capable of moral agency. If the framework insists on reciprocity as a condition of standing, these entities are excluded. This question must be resolved to determine if "asymmetric standing" is ontologically coherent or if it degrades the relational framework into a paternalistic one.
  *   **Feasibility (Conceptual vs. Empirical):** This is purely a matter of conceptual development and normative argument. It requires re-theorizing "participation" not as the capacity to *act* morally, but as the capacity to *be affected* relationally. It does not require empirical data, but it does require avoiding the trap of simply importing liberal "rights without duties" models, which would betray the relational premise.
  *   **Criteria for Re-ranking:** I would elevate this if the working group finds that "constitutive recognition" (Rank 1) logically entails reciprocity. If recognition *requires* a two-way street, this becomes the primary blocker. I would demote it if the group adopts a "guardianship" model where duties are borne by proxies, rendering the entity's own capacity for duty irrelevant.
  *   **Institutional Consequence:** This bears directly on the justification for withholding standing. An institution might argue that an entity lacking the capacity for reciprocal obligation cannot be a "person" in a relational sense, reducing it to mere property. Resolving this allows the institution to extend standing to passive entities without metaphysical inconsistency.

  ### 4. Diachronic Identity via Maintenance Patterns
  **Rank:** 4 (Continuity)

  *   **Conceptual Upstreamness:** Legal standing requires continuity; the plaintiff at the time of injury must be the plaintiff at the time of adjudication. Liberal frameworks use psychological continuity or biological life. Relational frameworks must use "continuity of maintenance." For an AI that updates its code or an ecosystem that undergoes succession, what makes it the *same* relational entity over time? While critical, this is downstream of the first three: we must know *that* the entity exists, *what* it is, and *that* it can hold status before we worry about whether it persists through time.
  *   **Feasibility (Conceptual vs. Empirical):** This can be advanced by conceptual analysis, specifically by adapting "four-dimensionalist" or "process" metaphories to legal theory. However, it risks becoming metaphysical tidiness if it does not link to specific legal remedies. The philosophers must ensure the theory of identity connects to statutes of limitation or reparations, or it remains abstract.
  *   **Criteria for Re-ranking:** I would elevate this if the target entities are highly volatile (e.g., fluid software agents that rewrite themselves daily). In high-churn environments, identity becomes the primary barrier to standing, surpassing recognition. I would demote it if the legal context allows for "successor standing" (where a new entity inherits the claims of the old), which would bypass the need for strict diachronic identity.
  *   **Institutional Consequence:** This is largely a matter of metaphysical tidiness *unless* the entity undergoes significant transformation during litigation. It bears on whether an institution withholds standing because the "entity" that was harmed no longer exists. If the framework can accommodate "relational succession," this question has low institutional consequence; if not, it is a decisive barrier to long-term claims.

  ---

  **Advisory Note on Methodology**
  The group must resist the temptation to solve these questions by reverting to liberal individualism (e.g., treating the AI as a "corporate person"). The operational value of this agenda lies in its ability to justify standing *precisely where* liberal frameworks fail: for entities that are not bounded individuals, lack consciousness, and exist in fragmented communities. The three-year timeline should be allocated heavily to the first two questions; if the "Substitution of Recognition" and "Delimitation" are not robustly defended, the framework will be dismissed as poetic rather than juridical. The latter two questions are refinements necessary for application, but the former two are necessary for existence.
