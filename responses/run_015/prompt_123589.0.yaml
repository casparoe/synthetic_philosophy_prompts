      *   **Topic:** *It's a Wonderful Life* (IAWL) vs. David Lewis's Modal Realism (specifically Counterpart Theory).
      *   **Core Conflict:** In the movie, George sees a world where he wasn't born (Pottersville). He feels guilt/responsibility for that world. Lewis says that world is real but causally isolated, and the "George" there isn't *him*, it's a counterpart. So, is George's guilt metaphysically coherent?
      *   **Specific Questions:**
