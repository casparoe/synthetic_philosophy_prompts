      *   **Constraint:** Do *not* just explain modal realism. The user already knows it. Focus on the tension between the film's narrative logic and Lewis's metaphysics.

  2.  **Deconstruct the Philosophical Tension:**
      *   **The Movie's Logic:** Subjunctive Conditionals / Counterfactuals. "If I had never been born, then X would be the case." It treats the alternative world as *dependent* on George's absence. It implies a causal link (George's existence *prevents* Pottersville). It implies identity (George *is* the observer in that world, even if invisible).
      *   **Lewis's Logic:** Modal Realism + Counterpart Theory. Possible worlds are concrete, spatiotemporally isolated. They don't causally interact. "George" in W2 is a *counterpart*, not identical to George in W1. George in W1 cannot be responsible for W2 because there is no causal bridge.
      *   **The Conflict:** The movie treats the counterfactual world as a *consequence* of George's non-existence. Lewis treats it as a *brute fact* that simply exists. The movie implies George *could have been* there (hence the guilt). Lewis says he *couldn't* have been there (identity is world-bound).

  3.  **Address the Specific Scenes:**
      *   *The Bank Run:* In the real world, George stops it. In Pottersville, Potter owns everything. *Philosophical point:* This suggests George's agency causally determines the state of the world. Lewis would say these are just two different worlds with different initial conditions or laws, not that George's absence *caused* Potter's success.
      *   *The Bar (Nick's):* George is recognized but feared/hated. *Philosophical point:* Identity. The people know him but the relationship is different. Lewis would say that's a different person (counterpart) with a different history.
      *   *Mary at the Library:* She's an old maid. *Philosophical point:* This hits the "could have been" nerve. George feels he *robbed* her of this life. Lewis would say she didn't lose anything; that's just how her counterpart's life went in that world.

