          *   Do specific scenes (bank run, bar, Mary at library) work as philosophy or just emotional manipulation?
          *   Does the "butterfly effect" idea (one change changes everything) fit Lewis? (Lewis says worlds are separate, not causally linked by changes).
          *   Is the nightmare philosophically coherent or just a story?
