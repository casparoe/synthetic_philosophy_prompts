      *   **Time Limit:** 30 minutes (very tight).
      *   **Core Scenario:** Brain copying/fission, but with a *twist*: functional split (Left Hemisphere $\to$ Body A, Right Hemisphere $\to$ Body B). Both claim to be the original, but memories/skills don't overlap.
      *   **Key Questions to Answer:**
          *   Order of presentation (Basic copy vs. Split twist)?
          *   The "carrying example" (the intuition pump that makes it bite)?
          *   Addressing misconceptions (Brain location = Self location; Twins analogy).
          *   Final check (Logic of self-reference vs. Neuroscience).
          *   Teletransportation (Include or skip)?

  2.  **Deconstruct the Core Philosophical Issue:**
      *   The scenario is a variation on *fission* (Parfit) mixed with *split-brain* cases (Nagel/Parfit) and Dennett's *Where Am I?* (location of self).
      *   The specific twist (functional split) challenges the "psychological continuity" criterion. If continuity is split, is identity split? If memories don't overlap, can both be *me*?
      *   The goal is to move them from "Where is the brain?" to "What constitutes the 'I'?"

  3.  **Drafting the Strategy - Step-by-Step:**

      *   **Timing:** 30 minutes is extremely short. Every minute counts. No long lectures. Socratic dialogue is best.
      *   **Order:** Start with the basic copy (fission) to establish the problem of *two* claimants. Then introduce the split-brain twist to deepen the problem (no overlapping psychology).
          *   *Why?* If you start with the split, they get bogged down in neuroscience (hemispheres). If you start with fission, they grasp the *logic* of identity first.
