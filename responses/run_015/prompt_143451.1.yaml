answer: |-
  Here is a tight, 30-minute battle plan designed to maximize philosophical friction while minimizing neuroscience bog-downs.

  ### 1. The Order: Basic Copy $\to$ Split Twist
  **Do the basic copy first (5 mins), then hit them with the split (5 mins).**

  *   **Why:** If you start with the split, students get stuck arguing about neuroplasticity ("Can the right hemisphere actually learn language?"). You want them arguing about *identity*.
  *   **The Arc:**
      1.  **Standard Fission:** Establish that *psychological continuity* seems to matter more than bodily continuity. (If my brain goes to Body B, *I* go to Body B).
      2.  **The Split Twist:** Break the psychological continuity. If the psychology is *also* divided, the "I" has nowhere to stand. This forces the realization that identity might not be a "yes/no" fact.

  ### 2. The Carrying Example: "The Prison Sentence"
  Don't use lottery winnings (too abstract). Use **retroactive punishment**.

  *   **The Setup:** "You" committed a crime yesterday. Today, the split happens. Body A (Left-Functions) and Body B (Right-Functions) wake up.
  *   **The Bite:** "The law says only the person who committed the crime can be punished. Do we lock up Body A? Body B? Both? Neither?"
  *   **Why it works:** It forces a decision on *who suffers*. If they say "Both," ask: "Is it just to punish two people for one crime?" If they say "Neither," ask: "So justice is escaped via surgery?"

  ### 3. Handling Misconceptions (In Sequence)

  **Misconception 1: "Where my brain is, there I am."**
  *   **When:** Address this *immediately* in the Basic Copy phase.
  *   **The Counter:** Use the **"Neck Pivot."**
      *   *Ask:* "If I swap your brain into a clone body, do you walk out with the body or stay with the headless original?"
      *   *Goal:* Get them to agree *you* follow the brain/psychology, not the biological organism. This sets up the tragedy of the Split Twist (because the psychology is now gone/split).

  **Misconception 2: "This is just like identical twins."**
  *   **When:** Address this *after* the Split Twist, when they try to dissolve the tension.
  *   **The Counter:** Emphasize **Causal Continuity.**
      *   *Say:* "Twins have two separate causal histories from conception. These two bodies share *one* causal history up until the knife cut. They aren't two people who look alike; they are one person who became two."
      *   *Goal:* Stop them from treating Body A and Body B as strangers. They both have an equal claim to the past.

  ### 4. Teletransportation: Skip It.
  *   **Reason:** Teletransportation introduces the "destruction of the original" variable. In 30 minutes, that muddies the water. You want them focused on **Fission** (one becoming two), not **Replacement** (one dying, one appearing).
  *   **Exception:** Only mention it if a student says, "But copying isn't moving." Reply: "In this case, the original brain is destroyed in the splitting process. It is a copy, but it's a *branching* copy." Then move on.

  ### 5. The Final Check (The "Prediction" Question)
  To test if they grasp the logic of self-reference (and not just neuroscience), ask this in the last 3 minutes:

  *   **The Question:** "Right before the operation, *you* are sitting in the chair. Can you truthfully say: 'Tomorrow, I will wake up as Body A'?"
  *   **The Trap:**
      *   If they say **Yes**: Ask "Why not Body B? They have equal claim."
      *   If they say **No**: Ask "So will you cease to exist? But both of them feel like they are you."
      *   If they say **"It's indeterminate"**: **Success.**
  *   **The Takeaway:** If they see that there is no *fact of the matter* to be known from the first-person perspective, they have understood that personal identity might be a conceptual convention, not a metaphysical discovery.

  ### Minute-by-Minute Run Sheet

  *   **00-05:** **The Hook.** "I am my brain." Test it with the Neck Pivot. Establish that *I* go where my psychology/brain goes.
  *   **05-10:** **Standard Fission.** Brain copied to two bodies (perfect copies). Who is you? (Most will say "Both" or "Neither").
  *   **10-15:** **The Split Twist.** Introduce the Left/Right functional split. Memories don't overlap. Body A remembers the crime; Body B remembers the motive. Who goes to prison?
  *   **15-20:** **The Twin Objection.** Students argue they are just new people. You hit them with the Causal Continuity argument.
  *   **20-25:** **The Deep Dive.** Socratic grilling on the "Prediction Question" (see above). Let them struggle with the lack of an answer.
  *   **25-30:** **Wrap Up.** Conclude that "Identity" might not be what matters; "Survival" (Relation R) might be. (Parfit's move). Assign a 1-paragraph reflection: *"From the perspective of the pre-op patient, is there a truth about who they will be?"*

  ### Instructor Note on the "Split"
  Keep the neuroscience vague. Do not let them argue about corpus callosums.
  *   **Say:** "Stipulate that the surgery perfectly separates your psychological traits. Set A goes Left, Set B goes Right. Don't ask *how*, ask *what follows*."
  *   If they fight the science, they aren't doing philosophy. Remind them: "This is a logic puzzle wearing a lab coat."
