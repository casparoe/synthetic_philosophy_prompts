answer: |-
  Good morning.

  They asked me to stand here and tell you that Marlowe Grammar is not dying. They asked me to tell you that a school is more than bricks, that the spirit of this place will migrate, like a ghost looking for a new house, into the comprehensive in September. They asked me to tell you that we are keeping the best of the past to build the future.

  I could say those things. They are comfortable. They fit in the mouth like smooth stones. But if I say them, I am lying to you, and I am lying to this building.

  The Historical Society has raised money for a plaque. It will go in the entrance hall, or perhaps what used to be the entrance hall, once the walls are knocked through for the clinic. The plaque will say: *Marlowe Grammar School. Established 1902. Closed 2024.* It is a kind act. It is an attempt to hold something still.

  There is a danger in that. When we try to preserve a thing perfectly, when we turn it into a museum of itself, we keep it safe by killing it. A thing in a glass case does not breathe. If we succeed in making Marlowe a monument, we ensure that no child will ever run down these corridors again without being told to walk quietly. We would be preserving the shell and evicting the life. I know there are people in this room who loved these walls. I know there are people who hated them. If we turn this place into a shrine, we honour the walls and we silence both groups. We make the past a competitor to the present, asking the children of today to be worthy of the ghosts of yesterday. That is a heavy coat for a fifteen-year-old to wear.

  So, we cannot just keep it. But can we judge it?

  There are things about Marlowe that need to be judged. We know now where the money came from that built the science block. We know how the streaming system sorted eleven-year-olds and decided, before they had a chance to grow, who was capable of thinking and who was only capable of obeying. Some of you are here today because this place opened doors for you. Some of you are here because it closed them. My sister is in the third row. She is here to hear me acknowledge that for some, this school was not a ladder, but a cage.

  But there is a risk in standing in the ruins of a house and listing its faults. If I condemn Marlowe too loudly, I condemn myself. I am made of this town. I am made of this education. To break the past completely is to break the ground I am standing on. It leaves us with nothing but ash and a sense of our own superiority. It does not help the teachers who are losing their jobs next week. It does not help the students who need a school in September, not a trial.

  So we are left with a choice. We can have a tomb, or we can have a trial. A museum, or a prosecution.

  But there is a third option. It is the one the town council chose, perhaps without knowing the weight of it.

  This building is becoming a clinic.

  Think about what that means. We are not keeping the name. We are not keeping the system. We are not keeping the plaques. We are keeping the shelter. We are taking the space where we once trained minds, and we are turning it into a place where we care for bodies.

  For a hundred and twenty years, this site was about preparation. It was about getting ready for life. It was about grades, and sets, and futures. Now, it is about the immediate need. It is about the flu, the broken bone, the check-up, the care that the town definitely needs.

  This is not a preservation. It is a transformation.

  To the alumni in the back: Your school is not being preserved. It is being used. That is a higher compliment than a plaque. A plaque is for the dead. A clinic is for the living.

  To the staff: You are not being erased. The work you did here was not just about grammar and syntax. It was about looking after children. That function is not ending. It is changing shape. The walls you worked within will continue to hold people who are vulnerable, who need help. The building will not remember your names, but it will continue your work.

  To the students: You are not inheriting a legacy. You are inheriting a space. You do not need to be worthy of Marlowe. You need to be well.

  I know this is not the goodbye we were taught to write. We were taught to say that the spirit endures. But spirits are for haunting. We need something that can heal.

  There is a strength in being able to take the past, break it open, and use the pieces to build something that serves the present. It requires us to admit that the old way is done. It requires us to admit that the endowment money had a cost, and the streaming had a victim count. But it also requires us to admit that the building itself is not the tragedy. The tragedy would be leaving it empty.

  So, let the plaque be put up. Let it mark the date. But let it not be the end of the story. Let it be the receipt for a transaction. We gave up the school. We got a clinic. We gave up the select few. We got the town.

  When you walk out of these doors for the last time, do not look back to see if the spirit is following you. It isn't. It's staying here. It is being painted over. It is being fitted with new lights. It is being prepared to see patients on Monday morning.

  That is how you honour a history that is too heavy to carry but too valuable to throw away. You do not drag it with you. You do not lock it in a cabinet. You let it become the ground you walk on.

  Marlowe Grammar is closed. Long live the clinic.

  Thank you.
