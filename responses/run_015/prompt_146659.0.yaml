answer: |-
  The comparison you are drawing cuts to the core of contemporary debates in anthropic reasoning: the tension between **Self-Sampling Assumptions (SSA)** and **Self-Indication Assumptions (SIA)**, and how the "reference class" is defined within a space of centered worlds.

  While the Sleeping Beauty Problem (SBP) and the Doomsday Argument (DA) appear distinct—one concerning frequency of experience within a single life, the other concerning statistical location within a species timeline—they share a deep structural isomorphism regarding **indexical conditioning**. However, the resolution of the reference class ambiguity in each case often relies on opposing epistemic norms depending on which side of the debate one occupies.

  Here is a comparative analysis of the reference class structures, the epistemic norms invoked, and the impact of your causal-ancestry variant.

  ### 1. Structural Isomorphism: Centered Worlds and Sampling Units

  Both puzzles arise because the agent must update credences based on **centered evidence** ("I am awake now" or "I was born at rank $n$") regarding **uncentered hypotheses** (The coin landed Heads/Tails or Humanity is Short/Long-lived).

  *   **Sleeping Beauty:** The ambiguity lies in the **Sampling Unit**.
      *   **Halfers** treat the *Experiment* (the coin toss world) as the reference class unit. Since the coin is fair, $P(Heads) = 1/2$. The awakening is guaranteed in both outcomes (at least once), so the indexical fact "I am awake" provides no new information about the coin.
      *   **Thirders** treat the *Awakening* (the observer-moment) as the reference class unit. Since there are three possible awakenings (Heads-Mon, Tails-Mon, Tails-Tue) and only one involves Heads, $P(Heads) = 1/3$.
  *   **Doomsday Argument:** The ambiguity lies in the **Reference Class Membership**.
      *   **Proponents** treat *All Human Observers* as the reference class. Assuming I am a random sample from this class, my early birth rank ($n$) is unlikely if the total number of humans ($N$) is very large. Thus, $N$ is likely small.
      *   **Skeptics** often argue for a restricted reference class (e.g., "observers who contemplate the DA") or invoke SIA (I am more likely to exist in a world with more observers), which counteracts the rank evidence.

  **The Structural Parallel:**
  The Halfer position in SBP is structurally analogous to the **Doomsday Skeptic** who rejects the idea that observer density matters. Both argue that the *world* (or experiment) is the primary probabilistic unit, and indexical location within that world should not shift the prior probability of the world's type unless it rules the world out entirely.

  Conversely, the Thirder position in SBP is structurally analogous to the **Doomsday Proponent**. Both argue that the *observer* is the primary probabilistic unit. For the Thirder, the higher density of observers in the Tails world makes Tails more likely. For the Doomsday Proponent, the specific rank of the observer within the total set shifts the likelihood of the total set size.

  *Correction/Nuance:* Actually, the Thirder relies on **SIA** (favoring worlds with more observers), while the standard Doomsday Proponent relies on **SSA** (sampling from observers within a world). This creates a fascinating cross-map:
  *   **SBP Thirder (SIA):** "I am more likely to exist in a world with more awakenings."
  *   **DA Skeptic (SIA):** "I am more likely to exist in a world with more humans." (This cancels the Doomsday conclusion).
  *   **SBP Halfer (SSA/World-focused):** "Treat the experiment as the unit."
  *   **DA Proponent (SSA):** "Treat the human birth as the unit."

  Thus, the **Thirder** and the **DA Skeptic** share the same epistemic norm (SIA: observer count affects probability), while the **Halfer** and the **DA Proponent** share a commitment to **SSA** (I am a random sample from the defined class), though they define the class differently (Experiments vs. Humans).

  ### 2. Epistemic Norms: Uncentered Priors vs. Centered Evidence

  The core disagreement in both cases is whether centered evidence (self-location) can update uncentered priors (physical chances).

  *   **In SBP:** Halfers argue that "I am awake" is a *necessary* truth in the experiment (Beauty always wakes up at least once), so it cannot update the coin bias. Thirders argue that "I am awake *now*" distinguishes between the three centered possibilities, updating the probability based on the proportion of centered worlds.
  *   **In DA:** Proponents argue that "My rank is $n$" is contingent evidence that updates the probability of $N$. Skeptics argue that "My rank is $n$" is only meaningful if the reference class is correctly defined; if the class is too broad, the sampling assumption fails.

  **The Normative Clash:**
  The reference class problem manifests as a choice between **Physical Chance** (Halfer/DA-Skeptic) and **Observer Density** (Thirder/DA-Proponent).
  *   If you prioritize **Physical Chance**, you restrict the reference class to the causal setup (the Coin, the Civilization). This minimizes the impact of self-location.
  *   If you prioritize **Observer Density**, you expand the reference class to all observer-moments. This maximizes the impact of self-location.

  ### 3. The Causal-Ancestry Variant

  Your modified Sleeping Beauty setup introduces a **causal filter**: the coin flip (or the awakening itself) is contingent on a prior cosmological event (Quantum Decay) that occurs in only 50% of branching worlds.

  **Scenario:**
  1.  **Cosmo Event:** Decay (50%) or No Decay (50%).
  2.  **Constraint:** Beauty is awakened *only* if Decay occurs.
  3.  **Coin:** If Decay occurs, Coin is flipped (Heads/Tails).
      *   Heads: 1 Awakening.
      *   Tails: 2 Awakenings.

  **Impact on the Reference Class:**
  This modification transforms the problem from pure self-location to **anthropic existence**.
  *   **Standard SBP:** Beauty exists in both Heads and Tails worlds. The reference class ambiguity is about *how many times* she is counted.
  *   **Causal SBP:** Beauty *only* exists in the Decay branch. If "Decay" is synonymous with the condition allowing the experiment, then "I am awake" confirms Decay.

  **Effect on Halfer vs. Thirder:**
  1.  **The Halfer:** A strict Halfer might argue that *given* the experiment is running (Decay occurred), the Coin is still fair. The causal ancestry restricts the reference class to "Observers in Decay Worlds." Within that class, the Coin is 50/50. The causal filter does not change the internal probability of the coin.
  2.  **The Thirder:** A Thirder using SIA would argue that the causal filter highlights the **Observation Selection Effect**. If the Decay event were linked to the Tails outcome (e.g., Tails requires more energy provided by Decay), the existence of the observer would favor Tails. Even if independent, the Thirder insists on weighting by observer moments.
  3.  **The Shift:** However, if the "Coin" *is* the Decay (Heads=No Decay/No Beauty, Tails=Decay/Beauty), then $P(Heads | Awake) = 0$. This collapses the SBP into a trivial anthropic confirmation.
      *   Assuming the Coin is independent *after* Decay: The causal filter forces the Halfer to admit that **"I exist" is evidence**. In standard SBP, Halfers argue "I am awake" is not evidence about the coin. In Causal SBP, "I am awake" *is* evidence about the Cosmo Event.
      *   This complicates the Halfer position. If they concede that existence is evidence for the Cosmo Event, why is it not evidence for the Coin (if the Coin affects existence)? It pushes the Halfer toward a **Restricted Reference Class** defined by causal ancestry: "I am a random sample from observers caused by Decay."

  **Parallel to Doomsday:**
  This mirrors the **"Self-Indication Assumption" rebuttal to Doomsday**.
  *   **DA Proponent:** "I am a random human from all humans." (Reference Class: All Humans).
  *   **DA Skeptic (Causal/Restricted):** "I am a random human from humans *with my specific causal history*." (Reference Class: Humans in this specific evolutionary lineage).
  *   **The Parallel:** In your Causal SBP, restricting the reference class to "Observers caused by Decay" is analogous to restricting the DA reference class to "Observers in this specific cosmological epoch."
      *   In **DA**, this restriction usually **dissolves** the argument. If the class is restricted to "humans born before 2100," my birth rank is no longer surprising, and the prediction of doom vanishes.
      *   In **SBP**, this restriction **intensifies** the Thirder position. If the reference class is "Observers caused by Decay," and Decay leads to more observers (via Tails), the probability shifts to Tails.

  ### 4. Resolution and Transformation of Ambiguity

  Does the causal-ancestry constraint resolve the ambiguity? **No, it transforms it.**

  1.  **From Frequency to Existence:** The ambiguity shifts from "How do we count awakenings?" to "How do we weight possible worlds where observers exist?"
  2.  **The Normative Convergence:** The causal filter forces both SBP and DA theorists to confront the **Presumptuous Philosopher** problem.
      *   If SBP Thirders accept that causal ancestry defines the class, they must explain why they don't also accept the DA Proponent's class (All Humans).
      *   If SBP Halfers accept that causal ancestry filters the class, they must explain why "I exist" confirms the Decay but not the Coin (if the Coin influenced existence).

  **Conclusion:**
  The reference class problem in SBP and DA is structurally identical: it is a dispute over whether probability should be distributed over **worlds** (Halfer/DA-Skeptic) or **observer-moments** (Thirder/DA-Proponent).

  Your causal-ancestry variant reveals that **causal filtering is a double-edged sword**:
  *   In **Doomsday**, causal filtering (restricting to "humans like me") is used to **block** the inference (saving the long future).
  *   In **Sleeping Beauty**, causal filtering (restricting to "observers caused by this setup") is often used to **support** the inference (confirming the setup that produces more observers).

  This suggests that the reference class ambiguity is not merely a technical glitch but a fundamental feature of self-locating belief: **We lack a principled epistemic norm for deciding whether we are sampling from the set of possibilities that *could* produce us, or the set of possibilities that *did* produce us.** The Halfer and the Doomsday Skeptic rely on the former (the causal setup); the Thirder and the Doomsday Proponent rely on the latter (the observed outcome). Your variant makes this tension explicit by making the causal setup itself a probabilistic variable.
