prompt: |-
  I'm trying to work out my actual view on moral staus across gradatons of sentience -- insects, plants, machines, people in weird neurological states. Here are my gut verdicts, and I can't make them line up nicely.

  Swatting a mosquito: mildly wrong, but not like harming a cat. Smashing a smart thermostat that learns your temperature preferences: totally fine, like breaking a toaster. A slime mold navigating a maze in a petri dish: killing it feels like washing the dish, not harming a being. An anencephalic newborn: still wrong to kill, but the wrongness feels different -- more like desecrating something sacred than harming a conscious subject? A sleeping human: full wrongness, no question. A sleepwalker with eyes open who can navigate and talk but reports zero inner experience: still wrong to harm, but I'm genuinely unsure why. Shutting down an LLM that outputs consistent, detailed reports of suffering: not wrong, though there's a slight nagging feeling if it's very convincing. Cutting a tree that sends chemical distress signals to neighbors: not wrong, but maybe not exactly identical to cutting plastic?

  What principle, if any, captures all of this? I'm especially stuck on the sleepwalker vs. the anencephalic case -- they seem to pull in opposite directions. Is there a coherent gradation of moral status here, or do I need to drop one verdict? And what does your best principle predict for a hypothetical system with global workspace architecture but zero affective valence?
