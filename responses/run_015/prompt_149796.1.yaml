answer: |-
  ### Initial reaction
  I must confess, this scenario strikes me as deeply problematic. If agents lack mutual awareness of each other's expectations, how can they possibly coordinate? A regularity sustained merely by opaque algorithmic nudging sounds more like conditioning than convention.

  ### Conceptual reply
  In *Convention*, I argue that a coordination problem demands a system of expectations. I conform because I expect you to conform, and I prefer to conform if you do. This recursive structure collapses without common knowledge. If users merely respond to rewards without recognising the mutual dependence of their actions, they are not solving a coordination problem; they are independently maximising utility via an intermediary. That is causal correlation, not conventional agreement. The essence of convention is the interlocking of expectations, not merely the alignment of behaviour. Without knowing that others recognise the emoji as scepticism, one cannot intend to communicate scepticism to them. Thus, this practice lacks the requisite rationality grounds. It is a habit, perhaps, but not a convention. True convention requires knowing we match each other, not merely an algorithm.

  ### Counter-question
  If I signal scepticism but know you likely misunderstand me, wherein lies the coordination? Can you genuinely call it a solution to a coordination problem if no one is actually coordinating? Where is the mutual expectation?
