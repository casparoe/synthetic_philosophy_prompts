answer: |-
  Translation is a constrained optimization problem in which form and content trade off, and the valid solution set depends on whether the target text is intended to perform the original's structural work or its communicative work.

  1.  **Relation:** Translation is a mapping relation between two texts, not an identity relation; zero loss is impossible.
  2.  **Cost:** Formal constraints (rhyme, meter, shape) impose a cost on semantic precision; this cost is non-zero and cumulative.
  3.  **Meaning:** Formal features can carry semantic weight, but not all formal features carry equal weight in every context.
  4.  **Distortion:** Distortion is defined as a deviation from the source that yields no compensatory gain in either formal integrity or semantic clarity.
  5.  **Goal:** Both camps aim to reproduce the *effect* of the original on the reader, but disagree on which components of the reader's experience constitute that effect.
  6.  **Genre:** A translation that preserves form but obscures sense is a puzzle; a translation that preserves sense but ignores form is a summary; both are valid artifacts but distinct genres.

  | # | Form-First Claim | Content-First Claim | Disagreement Type |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Acrostic (Crux a):** The acrostic is constitutive of the poem's identity; losing it changes the object, even if the name is preserved in the text. | **The Acrostic (Crux a):** The addressee's name is data; the acrostic is a mechanic; preserving the data is essential, preserving the mechanic is optional. | **Real:** Axiological disagreement on what constitutes the "object" of the poem. |
  | **2** | **Functional Inheritance (Crux b):** The specific mechanism (rhyme sound) is part of the effect; changing the mechanism changes the effect, even if the tension is preserved. | **Functional Inheritance (Crux b):** The effect (tension between opposites) is the goal; the mechanism is interchangeable if the effect is reproduced. | **Real:** Disagreement on the definition of "equivalence" (surface vs. deep structure). |
  | **3** | **Metrics (Crux c):** Formal fidelity (C) is objectively countable; Semantic fidelity (S) is interpretive; therefore C is the more reliable axis for optimization. | **Metrics (Crux c):** Semantic fidelity (S) is verifiable via comprehension; Formal fidelity (C) is arbitrary without semantic context; therefore S is the more reliable axis. | **Verbal/Methodological:** Both agree measurement is hard, but disagree on which variable is the independent constraint. |
  | **4** | **Process (Crux d):** Skeleton-first drafting yields higher combined fidelity because constraints force creative semantic solutions that content-first drafting misses. | **Process (Crux d):** Content-first drafting yields higher combined fidelity because forcing form onto weak semantics produces distortion that is hard to repair. | **Real:** Empirical claim about production workflows and output quality. |
  | **5** | **Perception (Crux e):** Readers perceive structural integrity subconsciously; invisible form contributes to aesthetic coherence even if not explicitly noted. | **Perception (Crux e):** Readers only perceive what they can explicitly articulate; invisible form is wasted effort that does not contribute to communication. | **Real:** Empirical claim about cognitive processing and reader response. |

  | Row | Concrete Case / Measurement | Form-First Prediction | Content-First Prediction |
  | :--- | :--- | :--- | :--- |
  | **1** | **Acrostic Test:** Produce two versions: one keeping the name in-text but losing the acrostic, one keeping the acrostic but altering the name. Ask bilingual readers which version feels more "like the original." | Readers will prefer the version keeping the acrostic, reporting a sense of structural completeness even if the name is altered. | Readers will prefer the version keeping the name, reporting confusion or loss of context if the name is altered, regardless of the acrostic. |
  | **2** | **Inheritance Test:** Present the original French stanza and two English versions (one rhyming opposites, one using syntax/position to oppose them) to readers who do not know French. Ask them to rate the "tension" between the paired words. | Readers will rate the rhyming version as having higher tension, because the sonic welding is perceptible without semantic analysis. | Readers will rate both versions equally on tension, provided the semantic opposition is clear, indicating the mechanism is irrelevant to the effect. |
  | **3** | **Metric Validity:** Have 10 bilinguals score 5 translations on S and C. Calculate inter-rater reliability (Cronbach's alpha) for S scores vs. C scores. | C scores will show significantly higher reliability than S scores, proving form is the stable variable for optimization. | S scores will show equal or higher reliability than C scores, proving that form scoring is subjective without semantic grounding. |
  | **4** | **Process Experiment:** Two teams translate the same stanza; Team A starts with form constraints, Team B starts with literal meaning. Blind score the outputs on S and C using the agreed metrics from Row 3. | Team A (Skeleton-first) will produce outputs with higher combined S+C scores, demonstrating constraints act as a scaffold. | Team B (Content-first) will produce outputs with higher combined S+C scores, demonstrating constraints act as a cage when applied early. |
  | **5** | **Perception Experiment:** Eye-tracking or recall test on readers of a rhyming vs. non-rhyming translation. Measure dwell time on rhyme-pair lines and recall of paired concepts. | Readers will show longer dwell times and better recall on rhyme-pair lines in the rhyming version, proving subconscious structural processing. | There will be no significant difference in dwell time or recall between versions, proving structural features are invisible without explicit attention. |
