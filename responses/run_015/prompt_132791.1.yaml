      *   *Key Insight to highlight:* The theorem is a "no-go" theorem. It's useful because it tells us what *must* be true for trade to exist (heterogeneous priors, liquidity shocks, irrationality). It doesn't prove trade is bad/irrational, it proves trade requires *friction* or *difference*.

