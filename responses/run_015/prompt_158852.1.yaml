prompt: |-
  I've been lurking on rationalist blogs since the Sequences were still going up, and I still don't have a rule for the thing I actually do most at work. Hoping someone here does.

  I'm the only quant on a four-person team at a specialty insurer. We price weird, thin risks — political risk in a single country, cyber for one narrow industry, satellite launch, a couple of kidnap-and-ransom books. Most of the time there is no data: either nothing has happened yet, or we have three observations and none of them are events. Twice a month I have to put a number — a probability, a rate, a severity distribution — into a model that produces a price, and the price gets filed. If I'm off by 3x we lose the account or we eat a loss. I've got maybe half a day per number, teammates who can drive a spreadsheet but don't know what a conjugate prior is, and everything goes past a chief actuary who trained in the nineties, thinks "prior" means "what we assumed last year," will sign anything that arrives with a documented rule attached, and will bounce anything that says judgment call.

  The rule I need is for choosing a default prior when we genuinely have nothing, and I need it to survive Bertrand's paradox rather than just gesture at it. You know the setup: an equilateral triangle inscribed in a circle, a chord chosen at random, how often is it longer than a side of the triangle — and depending on how you spell out "random," three applications of the principle of indifference give you 1/3 (two random points on the circumference), 1/2 (random point on a fixed radius, chord perpendicular to it), or 1/4 (random midpoint anywhere in the disk). I've read the Jaynes maximum-ignorance argument secondhand and I take the point that the paradox is really about an ill-posed question, but "go find the actual generator of the randomness" is not advice I can use at 4pm on a Thursday when the quantity is "share of claims in this class that exceed $5m."

  So: write me a procedure my team can actually run, in order, in under two hours, on a new quantity. Specifically:

  - the questions to ask about the quantity, in the order to ask them, and what counts as a sufficient answer to each — where sufficient means checkable by someone who can't derive a posterior by hand.
  - a decision-sensitivity check near the front: if every candidate prior I could defensibly pick gives the same decision, the procedure should say stop and file a note rather than let us argue about priors.
  - an explicit invariance step: which symmetries the quantity ought to have (rescaling the units, regraining the time window, aggregating or disaggregating the exposure), a reparameterization test I can run in the spreadsheet, and a rule for what to do when the answer moves under reparameterization.
  - where the procedure hard-stops with "no number comes out of this" and we tell the underwriter we can't price it, as against where it hands the question to a human because the remaining question is about our risk appetite or our solvency rather than about the world.
  - an honest marking of the steps that are judgment calls wearing a lab coat.

  Run it on three cases. (1) The chord problem itself, twice: once exactly as stated with no generator given, and once where I tell you the chord is produced by a machine that picks a uniformly random point in the disk and draws the chord perpendicular to the radius through that point. I want to see it return "ill-posed" the first time and a number the second, and I want to know what it did differently. (2) A component that has flown 200 times with zero failures; I need a defensible 90% upper bound on the per-flight failure probability, and I want to see what the procedure does with the three priors that all look uninformative here and all give different bounds. (3) The one I actually care about, which I suspect your procedure is going to be useless on: probability that a named sovereign imposes capital controls within twelve months. No symmetry, no exchangeable sequence, nothing to be indifferent between.

  There's one homebrew move I've been using that I want you to adopt, kill, or show is a special case of your procedure. Instead of being indifferent over the parameter, I write down my uncertainty as the ten deciles of the outcome distribution and treat those as exchangeable — indifference over the quantile function rather than over some coordinate I picked to describe it. It feels like it sidesteps the parameterization problem, because I'm being indifferent over the thing the decision actually touches. My guess is that its either deep or complete bullshit, and if it's bullshit I want to know what it was doing that made it look like it worked.

  Finally, tell me plainly what the procedure cannot do, so I know which numbers to keep apologizing for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experienced quant at a specialty insurer (political risk, cyber, satellite, K&R). Familiar with rationalist blogs (Sequences, Jaynes, Bertrand's Paradox). Pragmatic, under time pressure (half-day per number), dealing with non-technical stakeholders (underwriters, old-school chief actuary).
      *   **The Problem:** Needs a concrete, actionable *procedure* for choosing default priors in data-scarce environments that survives Bertrand's Paradox (invariance/reparameterization issues).
      *   **Constraints:** Must be runnable by a team in <2 hours. Must include decision sensitivity, invariance checks, hard stops, and identification of "judgment calls in lab coats."
      *   **Test Cases:**
          1.  Bertrand's Chord (ill-posed vs. defined generator).
          2.  200 flights, 0 failures (90% upper bound, comparing priors).
          3.  Sovereign capital controls (no symmetry, no exchangeability).
      *   **Specific Technique to Evaluate:** User's "decile exchangeability" method (specifying uncertainty via quantiles of the outcome distribution).
      *   **Final Requirement:** Plain statement of limitations.

  2.  **Deconstruct the Core Mathematical/Philosophical Issue:**
      *   **Bertrand's Paradox:** Highlights that "uniform prior" is not invariant under reparameterization. $P(\theta) \propto 1$ implies $P(\phi) \propto |d\theta/d\phi|$ for $\phi = f(\theta)$.
      *   **Jaynes' Solution:** Maximum Entropy (MaxEnt) or Transformation Groups. Find the symmetry group of the problem and demand the prior be invariant under that group.
      *   **Practical Reality:** In insurance pricing, we often don't know the physical generator. We need a *policy* for ignorance that is defensible to an actuary who wants a "rule."
      *   **User's "Decile" Idea:** This sounds like specifying a prior predictive distribution directly, or perhaps using a Reference Prior approach implicitly. If they specify deciles of the *outcome*, they are bypassing the parameter space. This is actually quite robust *if* the outcome is the decision-relevant quantity. However, it shifts the burden to "where did those deciles come from?"

  3.  **Develop the Procedure (The "Protocol"):**
      *   *Goal:* A checklist that forces invariance and separates epistemic ignorance from risk appetite.
      *   *Step 1: Decision Sensitivity.* Don't solve the problem if it doesn't matter.
      *   *Step 2: Generator Identification.* Can we model the physical process? (Jaynes' way out of Bertrand).
      *   *Step 3: Invariance/Reparameterization Check.* The core technical step. Test scale, location, and power transformations.
      *   *Step 4: The "Default" Prior.* If no generator, use a Reference Prior (Jeffreys) *or* the User's Decile method (validated).
      *   *Step 5: Hard Stops.* When to say "No."
      *   *Step 6: Labeling Judgment.* Distinguish "World Uncertainty" from "Risk Tolerance."

  4.  **Evaluate the User's "Decile" Move:**
      *   *Idea:* Specify $P(X \le x_i) = i/10$ for $i=1..9$.
      *   *Pros:* Directly addresses the outcome space (which is usually what matters for pricing). Invariant to parameterization of the *model*, provided the mapping from outcome to deciles is consistent.
      *   *Cons:* It's not a prior on the *parameter*, it's a prior predictive. It hides the parameter assumption. If the model changes, the deciles might become inconsistent. It's essentially "Subjective Bayes" disguised as objective.
      *   *Verdict:* It's not bullshit, but it's not "objective ignorance" either. It's a *policy for expressing ignorance*. It corresponds to a specific prior on the parameter depending on the likelihood. It needs to be formalized as a "Prior Predictive Constraint."

  5.  **Drafting the Procedure (Iterative Refinement):**
      *   *Name:* The Invariance-First Pricing Protocol (IFPP).
      *   *Step 1 (Sensitivity):* Run the model with Prior A (e.g., Jeffreys) and Prior B (e.g., Uniform on log-scale). If Price(A) and Price(B) lead to the same Go/No-Go or within bid-ask spread, STOP. Document "Prior Robust."
      *   *Step 2 (Generator):* Is there a physical mechanism? (Bertrand Case 2). If yes, model that. If no (Bertrand Case 1), flag "Ill-Posed."
      *   *Step 3 (Invariance):* What transformations leave the *problem* unchanged? (Scale? Shift?). Use Jeffreys Prior for the identified group.
      *   *Step 4 (The Decile Check):* If using the user's method, ensure the deciles are scale-invariant (e.g., specify deciles of log-loss, not loss).
      *   *Step 5 (Hard Stop):* If invariance fails and no generator exists, and sensitivity is high -> "No Price."

  6.  **Running the Test Cases:**
      *   *Case 1 (Bertrand):*
          *   No generator: Procedure flags "Ill-Posed" at Step 2. Invariance check fails (rotation vs translation).
          *   With generator (random midpoint): Procedure identifies the symmetry (rotation/translation in the disk). Prior is uniform on the area. Result: 1/4.
      *   *Case 2 (200 flights, 0 fails):*
          *   Parameter $p$ (failure prob).
          *   Priors: Uniform(0,1), Jeffreys Beta(0.5, 0.5), Haldane Beta(0,0).
          *   Sensitivity: Calculate 90% upper bound for each.
              *   Uniform: $1 - 0.1^{1/201} \approx 1.1\%$
              *   Jeffreys: Slightly different.
              *   Haldane: Improper, but posterior is Beta(0, 200).
          *   Decision: If the premium difference between 1.1% and 1.3% doesn't change the bid, stop. If it does, need a rule. Jeffreys is usually the "invariance" winner for binomial.
      *   *Case 3 (Sovereign Capital Controls):*
          *   No exchangeability. No symmetry.
          *   Procedure should push towards the "Decile" method *but* force the user to admit it's expert elicitation, not objective prior.
          *   Invariance check: Time window (12 months vs 6 months). Probability should scale (roughly). If the prior doesn't respect $P(2t) \approx 2P(t)$ for small $p$, it's broken.

  7.  **Refining the "Decile" Critique:**
      *   It's a "Prior Predictive Elicitation."
      *   Why it looks like it works: It forces you to think about the *observable*, which is invariant.
      *   Why it's risky: You might specify deciles that imply an impossible parameter configuration (e.g., deciles imply negative variance).
      *   Fix: Treat it as a constraint on the Prior Predictive Distribution, then back out the implied parameter prior to check for pathologies.

  8.  **Final Review against Constraints:**
      *   <2 hours? Yes, if checklist is tight.
      *   Checkable by spreadsheet users? Yes, focus on inputs/outputs.
      *   Hard stops included? Yes.
      *   Limitations stated? Yes.

  9.  **Tone:** Professional, peer-to-peer, slightly technical but pragmatic. Acknowledge the "rationalist" background without getting bogged down in philosophy.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure to explicitly answer the "what counts as sufficient answer" for the checklist.
      *   *Correction:* Ensure the Bertrand case clearly distinguishes why one is ill-posed and the other isn't based on the *generator*.
      *   *Correction:* For the Sovereign case, acknowledge that "no symmetry" means we fall back to Reference Priors or Expert Elicitation, but the *procedure* must force the labeling of the latter.
      *   *Correction on Deciles:* Be careful not to endorse it as "objective." It's a way to *standardize subjectivity*.

  11. **Final Polish:** Check the math on the 200 flights case.
      *   Rule of Three approximation: $3/n = 3/200 = 1.5\%$.
      *   Exact Binomial 90% upper bound with 0 successes: $1 - (0.1)^{1/200} \approx 1.14\%$.
      *   Wait, $1 - \alpha^{1/n}$. For 90% confidence, $\alpha = 0.1$. $1 - 0.1^{1/200} \approx 1 - 0.9885 = 0.0115$ (1.15%).
      *   Jeffreys prior Beta(0.5, 0.5) posterior is Beta(0.5, 200.5). Quantile will be slightly different.
      *   The point is to show the *difference* matters or doesn't.

  12. **Structure:**
      *   Introduction (Acknowledging the pain).
      *   The Protocol (The 5-Step Checklist).
      *   Evaluation of the "Decile Move."
      *   The Three Test Cases.
      *   Limitations (What this can't do).

  (Proceed to generate output based on this thought process.)
answer: |-
  This is a hard problem because you are asking for objectivity in a domain defined by subjectivity, constrained by stakeholders who want the *appearance* of objectivity (a "rule") without the mathematical literacy to verify it. You are essentially asking for a **Reference Prior Policy** that is robust enough to survive an audit by a chief actuary who thinks "prior" is a typo for "period."

  Below is the procedure. It is designed to be run in a spreadsheet. It prioritizes **invariance** (Jaynes' solution to Bertrand) and **decision robustness** (pragmatism) over mathematical purity.

  ### The Invariance-First Pricing Protocol (IFPP)

  **Time Budget:** 90 Minutes
  **Owner:** Quant
  **Audience:** Underwriter (for inputs), Chief Actuary (for sign-off)

  #### Step 1: The Decision Sensitivity Gate (15 mins)
  *Goal: Do not solve for the prior if the prior does not change the price.*

  1.  **Run Two Priors:** Run your pricing model twice.
      *   **Prior A:** Uniform on the natural scale (e.g., $P \sim U[0,1]$ for probability, $\lambda \sim U[0, \text{max}]$ for rate).
      *   **Prior B:** Uniform on the log scale (e.g., $\log(\lambda) \sim U[-\infty, \log(\text{max})]$). This approximates the Jeffreys prior for scale parameters.
  2.  **Compare Outputs:** Calculate the final premium for both.
  3.  **Sufficient Answer:**
      *   **If** $|Price_A - Price_B| < 5\%$ of the bid-ask spread **OR** both prices lead to the same underwriting decision (Bind/Decline) at the current authority limit:
      *   **Action:** **STOP.** File a memo: *"Price is prior-robust. Default Uniform on natural scale used for filing."*
      *   **If** Prices diverge significantly: Proceed to Step 2.

  #### Step 2: Generator Identification (15 mins)
  *Goal: Resolve Bertrand-style ambiguity by finding the physical mechanism.*

  1.  **Ask:** "Is there a physical or mechanical process generating this number?"
  2.  **Sufficient Answer:**
      *   **Yes:** (e.g., "A machine picks a point," "Failures occur via a Poisson process"). Write down the generator. Proceed to Step 3.
      *   **No:** (e.g., "Human decision," "Geopolitical event," "We just need a number"). **Flag as "Epistemic."** Proceed to Step 4.
      *   **Crucial Check:** If "No," you are not measuring a frequency; you are encoding confidence. You must label the output "Subjective Confidence Price" on the filing cover sheet.

  #### Step 3: The Invariance Test (30 mins)
  *Goal: Ensure the prior doesn't change if we change the units or the parameterization.*

  1.  **Identify Symmetries:** What transformations leave the *problem* unchanged?
      *   **Scale:** Does it matter if we measure in USD or EUR? (Yes -> Use Log-Uniform/Jeffreys).
      *   **Location:** Does it matter if we measure in Celsius or Fahrenheit? (Yes -> Use Uniform).
      *   **Reparameterization:** If we model $p$ (probability) vs $\theta = \log(p/(1-p))$ (log-odds), should the inference change?
  2.  **Spreadsheet Test:**
      *   Create a column for Parameter $\theta$.
      *   Create a column for Transformed Parameter $\phi = f(\theta)$ (e.g., $\log(\theta)$).
      *   Apply your chosen prior to $\theta$. Calculate the implied prior on $\phi$ using the Jacobian (or finite difference approximation in the sheet).
      *   **Rule:** If the implied prior on $\phi$ looks "informative" (e.g., peaks sharply at a specific value you didn't intend), your prior on $\theta$ is wrong.
  3.  **Sufficient Answer:**
      *   Select the prior that remains "flat" (uninformative) under the identified symmetry group.
      *   **Standard Defaults:**
          *   Probabilities/Rates (Scale/Range bounded): **Jeffreys Prior** (Beta(0.5, 0.5) for binomial, $1/\lambda$ for Poisson).
          *   Severity Amounts (Scale only): **Log-Uniform** ($1/x$).
          *   Location (e.g., temperature anomaly): **Uniform**.
      *   **Action:** Document the symmetry group chosen. (e.g., *"Prior is invariant under currency rescaling."*)

  #### Step 4: The "Decile" Elicitation (Only if Step 2 = No) (30 mins)
  *Goal: Standardize subjectivity when no symmetry exists.*

  1.  **Procedure:** Use your homebrew move here, but with a constraint.
  2.  **Constraint:** You must specify the deciles of the **Observable Outcome** (e.g., Loss Amount), *not* the parameter.
  3.  **Consistency Check:**
      *   Convert your 10 deciles back to an implied parameter distribution.
      *   **Hard Stop:** If the implied parameter distribution is impossible (e.g., implies negative variance, or probability > 1), reject the deciles.
  4.  **Labeling:** This step is **Judgment**. The filing must state: *"Prior based on expert elicitation of outcome quantiles."*

  #### Step 5: Hard Stops & Handoffs
  *   **Hard Stop (No Number):** If Step 1 fails (high sensitivity) AND Step 2 fails (no generator) AND Step 3 fails (no clear symmetry) AND Step 4 fails (deciles inconsistent).
      *   **Output:** "Unpriceable Risk. Requires Reinsurance or Exclusion."
  *   **Handoff (Risk Appetite):** If the model produces a price, but the uncertainty (width of the posterior) exceeds the company's capital buffer for a single loss.
      *   **Output:** "Price Valid, but Exposure Exceeds Retention. Refer to CRO."

  ---

  ### Evaluation of Your "Decile Move"

  **Verdict:** It is not bullshit, but it is not "Objective Ignorance." It is **Prior Predictive Elicitation.**

  *   **Why it works:** It forces you to be indifferent over the *observable*, which is the only thing that is truly invariant. Parameters are human constructs; losses are real. By specifying uncertainty on the loss, you bypass the parameterization problem entirely *for the purpose of pricing*.
  *   **The Trap:** It hides the parameter assumption. If you change the likelihood model (e.g., from Poisson to Negative Binomial), your deciles might imply a different parameter prior.
  *   **The Fix:** Adopt it as **Step 4** in the protocol above. It is the correct move when Step 2 (Generator) fails. It standardizes the "judgment call" so the Chief Actuary can see *what* you assumed, even if they can't check the math.

  ---

  ### Running the Test Cases

  #### Case 1: Bertrand's Chord

  **Run 1: No Generator Given**
  1.  **Step 1 (Sensitivity):** The three methods give 1/3, 1/2, 1/4. Sensitivity is massive. Proceed.
  2.  **Step 2 (Generator):** "Is there a physical process?" **No.** The problem statement is purely geometric with no selection mechanism.
  3.  **Step 3 (Invariance):**
      *   Method 1 (Random endpoints): Invariant under rotation, not translation of chord center.
      *   Method 2 (Random radius): Invariant under rotation, not scale of radius.
      *   Method 3 (Random midpoint): Invariant under rotation and translation within the disk.
      *   **Conflict:** There is no single symmetry group that satisfies all intuitive constraints without a generator.
  4.  **Result:** **HARD STOP.**
  5.  **Output:** "Ill-Posed Problem. No unique solution without physical generator."
  6.  **Why:** The procedure correctly identifies that "random" is undefined without a selection mechanism.

  **Run 2: Machine Picks Random Point in Disk (Perpendicular Chord)**
  1.  **Step 2 (Generator):** **Yes.** "Uniform point in disk."
  2.  **Step 3 (Invariance):** The generator defines the symmetry. The machine is indifferent to location within the disk (translation/rotation).
  3.  **Prior:** Uniform distribution over the Area ($dA$).
  4.  **Calculation:** Chord > Side iff midpoint is within circle of radius $r/2$. Area ratio = $(1/2)^2 = 1/4$.
  5.  **Result:** **1/4.**
  6.  **Difference:** Step 2 moved from "No" to "Yes." The generator resolved the ambiguity.

  #### Case 2: 200 Flights, 0 Failures

  **Goal:** 90% Upper Bound on Failure Probability $p$.

  1.  **Step 1 (Sensitivity):**
      *   **Prior A (Uniform Beta(1,1)):** Posterior Beta(1, 201). 90% Quantile $\approx 1.14\%$.
      *   **Prior B (Jeffreys Beta(0.5, 0.5)):** Posterior Beta(0.5, 200.5). 90% Quantile $\approx 0.93\%$.
      *   **Prior C (Haldane Beta(0,0)):** Posterior Beta(0, 200). 90% Quantile $\approx 1.15\%$ (Rule of 3 approx).
      *   **Decision:** If premium sensitivity to $0.9\%$ vs $1.1\%$ is low, **STOP**. Use Uniform (easiest to explain).
      *   **Assume Sensitivity is High:** Proceed.
  2.  **Step 2 (Generator):** Yes. "Component flight" implies a Bernoulli process.
  3.  **Step 3 (Invariance):**
      *   Parameter $p$ is a probability (0 to 1).
      *   Symmetry: Reparameterization invariance. We want the prior to look the same if we measure "success" vs "failure" ($p$ vs $1-p$).
      *   **Jeffreys Prior** is the unique prior invariant under reparameterization for the Binomial likelihood.
  4.  **Result:** Use **Jeffreys (Beta(0.5, 0.5))**.
  5.  **Output:** 90% Upper Bound = **0.93%**.
  6.  **Note:** Your "Decile Move" is hard here because the outcome is binary (0 or 1). You can't specify deciles of a Bernoulli trial easily. This confirms the procedure: Use Jeffreys for exchangeable binary data; use Deciles for continuous/severity data.

  #### Case 3: Sovereign Capital Controls (12 Months)

  **Goal:** Probability of event.
  **Context:** No history, no exchangeability, unique political situation.

  1.  **Step 1 (Sensitivity):** Compare Uniform(0,1) vs Logit-Normal(0, 10). Likely high sensitivity. Proceed.
  2.  **Step 2 (Generator):** **No.** There is no "machine" generating coups. This is a one-off epistemic event.
  3.  **Step 3 (Invariance):**
      *   Time Window: Is the probability for 12 months related to 6 months? $P(12) \approx 2 \times P(6)$ for small $p$.
      *   If you pick a prior that violates this (e.g., Uniform on $p$ implies $P(6) = P(12)/2$ exactly, which is fine, but Uniform on "hazard rate" implies exponential scaling), you get different answers.
      *   **Problem:** No clear symmetry group.
  4.  **Step 4 (Decile Elicitation):**
      *   **Action:** You must use your homebrew move here.
      *   **Constraint:** Specify deciles of the **Binary Outcome** (which is just a probability mass) OR specify deciles of the **Time to Event**.
      *   **Better:** Specify deciles of the *Time to Event* distribution.
      *   **Ask:** "What is the 10th percentile time to capital controls? 50th? 90th?"
      *   **Convert:** Map these times to $P(T \le 12 \text{ months})$.
  5.  **Labeling:** **JUDGMENT CALL.**
  6.  **Output:** "Price based on Expert Elicitation of Time-to-Event Quantiles."
  7.  **Why:** The procedure forces you to admit this is not a frequency. It prevents you from pretending a Uniform(0,1) prior is "objective."

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Create Information:** If the risk is truly unique (Case 3), this procedure will not give you a "true" probability. It will only give you a *defensible* way to encode your guess. You will still be wrong if the world surprises you.
  2.  **It Cannot Solve Model Risk:** If your likelihood function is wrong (e.g., assuming Poisson when risks are clustered), the best prior in the world won't save you. The procedure assumes the model structure is correct.
  3.  **It Cannot Protect Against "Black Swans":** In thin-tailed distributions (like your sovereign risk), the "90% upper bound" might be 5%. The real risk might be 50%. The procedure validates the *math*, not the *tail*.
  4.  **It Cannot Stop the Chief Actuary:** If the CA says "I don't like Jeffreys, use Uniform," the procedure gives you the documentation to say "This increases capital requirement by X%," but it cannot force them to listen.

  ### Summary for your Team
  1.  **Check Sensitivity:** If priors don't change the price, don't fight about them.
  2.  **Find the Generator:** If there's a physical process, model that (solves Bertrand).
  3.  **Check Invariance:** If no generator, use Jeffreys/Log-Uniform to respect units.
  4.  **Use Deciles for Judgment:** If no symmetry, specify outcome quantiles, not parameter priors.
  5.  **Label Honestly:** Distinguish "Frequency Price" from "Confidence Price."

  This gives you the "rule" the Actuary wants, the mathematical integrity you want, and the "out" you need when the risk is unpriceable.
