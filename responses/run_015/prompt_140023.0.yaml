answer: |-
  ### Exam Question

  **Question 1**
  A critic argues that Nāgārjuna's use of the *catuṣkoṭi* (the four-cornered negation: a thing is F, is not F, is both, is neither) is logically incoherent. If "x is F" and "x is not F" are genuine contradictories, then the third and fourth corners are logically impossible, and rejecting all four is simply contradictory. Furthermore, if this negation applies to everything, Nāgārjuna seems to commit himself to global skepticism (e.g., it is neither true nor false that the bus has left). If it does not apply to everything, he owes an account of why some claims escape the *catuṣkoṭi* while others do not. Finally, if Nāgārjuna asserts that "all views are empty," is this assertion itself empty? If yes, why accept it? If no, does he not possess the very *svabhāva* (intrinsic nature, independent essence, or own-being) he denies in others?

  Write an essay defending a specific interpretation of how Nāgārjuna resolves these three tensions (logical coherence, scope of application, and self-referential consistency). You must argue for a principled distinction between cases where the four corners are rejected and cases where they are not. Do not appeal to the idea that ultimate reality is "beyond logic" or "ineffable."

  *Definitions for the purpose of this exam:*
  *   **Svabhāva:** Intrinsic nature, independent essence, or own-being; existence that is not dependent on causes, parts, or conceptual designation.
  *   **Catuṣkoṭi:** The four logical alternatives: (1) is F, (2) is not F, (3) is both F and not F, (4) is neither F nor not F.
  *   **Śūnyatā:** Emptiness; the lack of *svabhāva*.

  ***

  ### Model Answer

  Nāgārjuna's philosophy is often dismissed as a violation of the law of non-contradiction, but this criticism rests on a category error regarding what the *catuṣkoṭi* is negating. To defend Nāgārjuna against the charge of logical incoherence, global skepticism, and self-contradiction, one must recognize that the four-cornered negation is not a tool for denying conventional facts, but a diagnostic tool for exposing the impossibility of *svabhāva*. The resolution lies in distinguishing between two levels of discourse: the conventional (*saṃvṛti*), where standard logic applies, and the ultimate (*paramārtha*), where the search for intrinsic nature fails.

  First, regarding the logical objection: the critic assumes that the four corners operate on standard truth-values regarding existing subjects. However, Nāgārjuna's negation is not a simple denial of a predicate (choice negation); it is a denial of the presupposition that the subject possesses *svabhāva* (implicatory negation). When Nāgārjuna rejects "x is F" and "x is not F," he is not saying both truth-values are false in a vacuum. He is arguing that if *x* possessed *svabhāva*, it would have to be either F or not-F independently of context. Since *x* is dependently originated, it lacks the ontological stability required to bear an intrinsic predicate. Therefore, corners three (both) and four (neither) are not redundant logical additions; they exhaust the possible ways one might try to reify *x* intrinsically. Rejecting all four does not violate the law of non-contradiction because the law applies to propositions about existing things, whereas the *catuṣkoṭi* demonstrates that an intrinsically existing thing is not found. The contradiction arises only if one insists *svabhāva* must exist; Nāgārjuna's point is that the concept itself is incoherent.

  Second, this resolves the scope problem regarding mundane claims like "the bus has left" or "the cat is on the mat." The *catuṣkoṭi* does not apply to these claims in the same way it applies to metaphysical essences. In the conventional realm, language and logic function pragmatically. It is either true or false that the bus has left, because "bus" and "left" are dependently designated concepts that work within a specific context. Nāgārjuna is not a global skeptic; he affirms the validity of the conventional world precisely because it is empty. If the bus had *svabhāva*, it could never move (since change would alter its intrinsic essence). Because the bus is empty, it can move, leave, and arrive. Therefore, there is a principled distinction: the four corners are rejected only when a predicate is applied to a subject *considered as having svabhāva*. In mundane contexts, we do not posit *svabhāva*, so the excluded middle holds. To apply the *catuṣkoṭi* to the bus's departure is to misunderstand the target; one would only reject all four corners if asked, "Does the bus, by its own intrinsic power, independently leave?" Since no bus exists that way, all four options fail. This avoids global skepticism because conventional truth is preserved as useful fiction, while ultimate truth denies the fiction's ontological weight.

  Third, the self-referential problem—whether the claim "all views are empty" is itself empty—is solved by the doctrine of the emptiness of emptiness. If Nāgārjuna claimed his statement possessed *svabhāva*, he would be self-refuting. However, he treats his own philosophy as a remedy, not a position. Just as a purgative drug expels itself along with the illness it cures, the assertion of emptiness expels the view of *svabhāva* and then dissolves itself. To ask if the statement is "true" in an ultimate sense is to ask for *svabhāva* where there is none. The statement is conventionally true (it effectively describes the state of affairs) but ultimately empty (it lacks independent standing). This prevents the regress. If the student argues that Nāgārjuna asserts a "super-truth," they reify emptiness. If they argue he asserts nothing at all, they ignore the conventional utility of his verses. The middle way is that the assertion is a conventional tool used to deconstruct ultimate claims, including its own.

  In conclusion, Nāgārjuna is not denying logic; he is delimiting its ontological commitments. The *catuṣkoṭi* is not a truth-functional table for standard propositions but a reductio ad absurdum of intrinsic existence. Mundane claims escape the fourfold negation because they do not claim intrinsic existence. His own thesis escapes self-refutation because it claims no intrinsic validity. To interpret this as "mystery" or "beyond logic" is to miss the precise surgical nature of the argument. Nāgārjuna uses logic to show where logic breaks down when it seeks foundations, not to abolish logic itself.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. The Logical Status of the Corners (4 marks)**
  *   **Full Marks:** Identifies that the *catuṣkoṭi* targets the presupposition of *svabhāva*, not standard truth-values. Explains that rejecting all four is not a contradiction if the subject (intrinsic nature) is incoherent.
  *   **Common Error:** Claims Nāgārjuna rejects the law of non-contradiction or that "Eastern logic is different." (0 marks)

  **2. The Scope Distinction (Mundane Cases) (4 marks)**
  *   **Full Marks:** Provides a principled reason why "the bus left" is bivalent (true/false) while "the self exists" is not. Must hinge on the presence/absence of *svabhāva* claims in the proposition.
  *   **Common Error:** Says mundane claims are "illusions" so logic doesn't apply to them either (leads to skepticism), or that they are "real" while metaphysics is "fake" (dualism). (1-2 marks)

  **3. Avoidance of Global Skepticism (4 marks)**
  *   **Full Marks:** Explicitly states that emptiness *permits* conventional function (dependent origination). Explains that denying *svabhāva* is what allows the bus to move.
  *   **Common Error:** Argues that nothing is truly true, rendering action impossible (nihilism). (0-1 marks)

  **4. The Self-Referential Paradox (4 marks)**
  *   **Full Marks:** Addresses the "no thesis" problem using the "emptiness of emptiness" or "therapeutic/remedy" analogy. Shows how the statement dissolves itself.
  *   **Common Error:** Claims Nāgārjuna is secretly asserting a true view (reification) or that he is simply silent/mystical (evasion). (1-2 marks)

  **5. Prohibition on "Mystery/Ineffability" (4 marks)**
  *   **Full Marks:** Maintains a philosophical argument throughout. Does not resort to "reality is beyond words" or "it is a meditative state."
  *   **Common Error:** Concludes that logic fails because ultimate truth is ineffable/mystical. (0 marks)

  ***

  ### Grade Differentiation

  **A Range (17-20 marks):**
  An A answer treats the two truths not as two separate worlds, but as two ways of looking at the same world. The student will explicitly link the *possibility* of conventional logic (the bus example) to the *emptiness* of the bus. They will handle the self-referential paradox by showing that the *statement* of emptiness is a dependent event, not a static truth. They will engage the logic friend's objection directly, using terms like "presupposition failure" or "category error" without needing external secondary sources. The argument is tight, textual, and philosophical.

  **B Range (13-16 marks):**
  A B answer gets the distinction right (conventional vs. ultimate) but tends to reify them into two separate domains (e.g., "There is the real world of emptiness and the fake world of buses"). They may solve the logic puzzle but stumble on the self-referential one, perhaps suggesting Nāgārjuna *does* have a secret thesis. They will likely define terms correctly but might rely on phrases like "higher truth" without explaining how it interacts with logic. They avoid the "mystery" trap but don't fully explain *why* logic works conventionally if everything is empty.

  **C Range (9-12 marks):**
  A C answer typically falls into the "mystery" trap ("Logic doesn't apply to the Absolute") or the "nihilism" trap ("Nothing exists, so the bus didn't leave"). They may list the four corners correctly but fail to explain why corners 3 and 4 aren't redundant. They often assert "emptiness is not nothingness" (which gains no credit per the prompt constraints) without explaining what it *is*. The self-referential paradox is usually ignored or dismissed as "Nāgārjuna is special."
