answer: |-
  | objection_as_theyd_say_it | who_raises_it | likelihood (H/M/L) | damage_if_unanswered (1-5) | my_90_second_reply | where_the_reply_is_soft |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | "We know it's shorthand. What actual historical work does this philosophical precision enable that we aren't already doing?" | Supervisor (Chair) | H | 5 | "Shorthand becomes dogma. When 'Britain vs. China' is the default frame, it constrains variable selection—researchers look for *national* causes for *structural* outcomes. My partition test isn't about banning the question, it's about preventing mismatched units from driving identification strategies. It enables you to stop defending 'China' as a unitary variable when your mechanism is actually about coal geology or guild structures." | Assumes the framing *actually* constrains their variable selection rather than just being cover for deeper work. |
  | "This is a productive research programme. Don't dissolve the puzzle just because it's messy; heuristics drive discovery." | China Historians | H | 4 | "I agree heuristics drive discovery, but bad heuristics drive dead ends. If the question bundles science, industry, and growth, we conflate distinct causal mechanisms. I'm not dissolving the puzzle; I'm unpacking the bundle so you don't try to solve three problems with one variable. Keep the heuristic, but specify the target." | Risks sounding like I'm lecturing them on how to do their job; hard to prove a heuristic is 'bad' without substantive verdicts. |
  | "Your partition test proves too much. Does it also dissolve 'Why the Allies won?' or 'Why Rome fell?' Are you a skeptic about all historical explanation?" | Philosophers / PolSci | M | 5 | "No, I'm a skeptic about *structural* comparisons with mismatched units. Event narratives (Allies vs. Axis) have clear temporal boundaries and agent-defined units. The Great Divergence compares abstract structures over centuries. I need to add a scope condition: the test applies to macro-structural comparisons, not event narratives." | **Admitting this requires a text change.** Without the scope condition in the paper, the reply looks ad hoc. |
  | "This is just selection on the dependent variable dressed up in philosophical clothing. We know we only look at successful industrializers." | PolSci | H | 4 | "It's related, but distinct. Selection on the dependent variable worries about sampling outcomes. The partition test worries about the *construction* of the units themselves. You can fix selection bias with more cases, but you can't fix it if 'Britain' and 'China' aren't comparable units to begin with. It's a unit homogeneity problem, not just a sampling problem." | PolSci may argue unit homogeneity is impossible in macro-history anyway, making the test useless. |
  | "China wasn't a unitary state like Britain. You're attacking a straw man; serious historians already know this." | China Historians | H | 3 | "You're right, serious historians know this. But the *question* 'Why Britain and not China?' presupposes the comparability. My point is that the framing forces you into a defensive position about Chinese unity that distracts from the actual mechanisms. I'm critiquing the question's grammar, not your empirical knowledge." | If they say "We already adjust for this," my paper looks like it's solving a problem that doesn't exist in practice. |
  | "How do I actually run this test? Is it a thought experiment or a method? I need operationalization." | PolSci | M | 3 | "It's a diagnostic thought experiment. Before running the comparison, ask: If I redraw the units (e.g., Yangtze Delta vs. UK, not China vs. UK), does the explanation hold? If the answer flips, the original question was ill-posed. It's a pre-flight check for your research design, not a statistical test." | "Thought experiment" sounds soft to a PolSci wanting rigorous identification. |
  | "Actors thought in these terms. Ignoring emic categories because they're philosophically messy loses historical truth." | Historians | M | 3 | "Explanation isn't just reproducing emic categories. If actors thought 'China' was a unit, that's data for intellectual history. But if we're explaining industrialization, the causal units might be regions or networks. We need etic categories for causal explanation, even if emic categories mattered for motivation." | Hard to draw the line cleanly between when emic categories matter causally and when they don't. |
  | "Your repair manual is just what good historians already do. You've written 25 minutes to tell us to be specific." | Historians | M | 3 | "If good historians already do this, great. But the persistence of the 'Great Divergence' framing suggests the bundle is still active. I'm providing a philosophical justification for why you *should* unpack it, so you don't get pushed back into the single-question frame by reviewers or interlocutors." | If the audience feels patronized, they will reject the utility entirely. |
  | "You're ignoring Galton's Problem. These units aren't independent; ideas and tech diffused. Your partition test assumes independence." | PolSci / Historians | L | 3 | "The partition test doesn't assume independence; it tests robustness to unit definition. Diffusion is a mechanism. If diffusion is the cause, then 'Britain vs. China' is the wrong contrast anyway—it should be 'Network A vs. Network B.' The test helps reveal that diffusion is the story, not national traits." | Requires quick thinking to show how partitioning handles diffusion without denying it. |
  | "Does this mean Pomeranz, Goldstone, etc., are all wrong? Are you invalidating the last 20 years of literature?" | Historians | L | 4 | "I'm invalidating the *framing*, not the findings. Pomeranz's work on coal and colonies stands. But if his argument is about coal, the unit should be coal regions, not polities. I'm arguing their explanations are often better than their question formulations. They deserve a sharper question." | High stakes. If they feel I'm attacking their heroes, they will turn hostile. |

