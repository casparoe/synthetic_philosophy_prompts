      *   *Key Insight:* Goodman's solution was pragmatic (entrenchment). The ML solution for small models must be *rationalist* (priors). This is a shift from Hume/Goodman to Kant/Chomsky.

  9.  **Drafting the Response:** (Mental outline of the final output)
