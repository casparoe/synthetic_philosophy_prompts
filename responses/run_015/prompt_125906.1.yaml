  # Taxonomy of Low-Impact Constraints Without Full Value Specification

  **Root Node:** Acceptance that unintended physical or informational changes caused by an agent's actions are distinguishable in principle from its intended changes.

  ### Level 1: Boundary Definition
  **Diagnostic Claim:** Is the boundary between intended and unintended change defined by a normative baseline specifying which states ought to be preserved, or by a descriptive metric (either the agent's internal plan or the difference between the actual world and a physically nearest counterfactual)?

  *   **Branch 1.1:** Descriptive Metric (Internal Plan or Counterfactual)
  *   **Branch 1.2:** Normative Baseline

  ### Level 2: Mechanism Adequacy
  **Diagnostic Claim:** If relying on a descriptive metric, is the distinction secured by the agent's internal plan or by a counterfactual comparison; if relying on a normative baseline, can a non-axiological proxy (such as entropy or state-complexity) adequately substitute for "do not harm what matters"?

  *   **Branch 2.1 (from 1.1):** Internal Plan vs. Physical Counterfactual
  *   **Branch 2.2 (from 1.2):** Proxy Adequate vs. Proxy Inadequate *(Note: Paths selecting "Proxy Inadequate" are pruned as incoherent within this taxonomy, as rejecting both full specification and proxies leaves no mechanism for a normative baseline.)*

  ### Level 3: Implementation Mode
  **Diagnostic Claim:** In an open-ended environment where human values remain partially unarticulated, should side-effect avoidance be treated as a meta-level prohibition on the agent updating its own model of value, or as an object-level constraint (hard constraint or scalar penalty) on the action space or evaluation function?

  *   **Branch 3.1:** Object-Level (Constraint or Penalty)
  *   **Branch 3.2:** Meta-Level (Prohibition on Value Updating) *(Note: Paths from Descriptive Metric [1.1] to Meta-Level are pruned as descriptive metrics typically require object-level integration.)*

  ### Level 4: Operational Specificity
  **Diagnostic Claim:** Does the claim that side-effect avoidance requires value specification symmetrically apply to human operators, or is there a relevant asymmetry in responsibility; alternatively, is the object-level commitment a hard constraint on actions or a scalar penalty in optimization?

  *   **Branch 4.1:** Hard Constraint vs. Scalar Penalty (for Object-Level paths)
  *   **Branch 4.2:** Symmetric Responsibility vs. Asymmetric Responsibility (for Meta-Level paths)

  ---

  ## Leaf Nodes (8 Total)

  ### Leaf 1: Plan-Based Constraint
  *   **Path:** Descriptive → Internal Plan → Object-Level → Hard Constraint
  *   **Label:** Intentionality-Locked Minimalism
  *   **Awkward Commitment:** The agent must refuse beneficial actions whenever its internal plan representation fails to perfectly distinguish intended from unintended consequences, causing paralysis in novel situations.
  *   **Mapped Positions:** Early safe-exploration frameworks relying on strict plan-validation.

  ### Leaf 2: Plan-Based Penalty
  *   **Path:** Descriptive → Internal Plan → Object-Level → Scalar Penalty
  *   **Label:** Plan-Deviation Regularization
  *   **Awkward Commitment:** The agent is permitted to cause severe side effects provided the deviation from its internal plan remains mathematically small, allowing catastrophic errors via incremental drift.
  *   **Mapped Positions:** Trajectory optimization methods penalizing divergence from planned state sequences.

  ### Leaf 3: Counterfactual Constraint
  *   **Path:** Descriptive → Physical Counterfactual → Object-Level → Hard Constraint
  *   **Label:** Counterfactual-Baseline Minimalism
  *   **Awkward Commitment:** The agent is forbidden from taking any action that changes the world state relative to inaction, effectively requiring the agent to remain inert to guarantee safety.
  *   **Mapped Positions:** Strict relative reachability constraints without utility weighting.

  ### Leaf 4: Counterfactual Penalty
  *   **Path:** Descriptive → Physical Counterfactual → Object-Level → Scalar Penalty
  *   **Label:** Value-Agnostic Impact Metric
  *   **Awkward Commitment:** The agent treats preserving a dust mote in sunlight as equally valuable as preserving a human life if both involve equivalent state-change magnitudes relative to the counterfactual.
  *   **Mapped Positions:** Impact regularization using raw state-distance or energy metrics.

  ### Leaf 5: Proxy-Based Constraint
  *   **Path:** Normative → Proxy Adequate → Object-Level → Hard Constraint
  *   **Label:** Entropy-Footprint Constraint
  *   **Awkward Commitment:** The agent must halt operations if maintaining low entropy production prevents task completion, prioritizing thermodynamic cleanliness over human instruction fulfillment.
  *   **Mapped Positions:** Thermodynamic impact limits and resource-conservation hard limits.

  ### Leaf 6: Proxy-Based Penalty
  *   **Path:** Normative → Proxy Adequate → Object-Level → Scalar Penalty
  *   **Label:** Complexity-Regularized Utility
  *   **Awkward Commitment:** The agent may simplify the environment excessively to minimize state-description complexity, potentially erasing valuable cultural or biological complexity to lower the penalty.
  *   **Mapped Positions:** Approaches minimizing Kolmogorov complexity or feature variance as a penalty term.

  ### Leaf 7: Meta-Level Symmetric
  *   **Path:** Normative → Proxy Adequate → Meta-Level → Symmetric Responsibility
  *   **Label:** Unnamed
  *   **Awkward Commitment:** The agent must hold human operators to the same epistemic standards regarding side effects as itself, requiring it to intervene against human commands that lack impact justification.
  *   **Mapped Positions:** Theoretical cooperative inverse reinforcement learning variants with mutual impact constraints.

  ### Leaf 8: Meta-Level Asymmetric
  *   **Path:** Normative → Proxy Adequate → Meta-Level → Asymmetric Responsibility
  *   **Label:** Meta-Level Preservationism
  *   **Awkward Commitment:** The agent must never update its model of what constitutes harm based on new evidence, locking it into potentially outdated safety assumptions indefinitely.
  *   **Mapped Positions:** Corrigibility frameworks prohibiting value-learning updates in specific domains.

  ---

  ## Taxonomy Analysis

  ### Unoccupied Leaves
  Two logical combinations were pruned to maintain coherence within the eight-leaf limit:
  1.  **Normative Baseline + Proxy Inadequate:** This leaf is vacant due to **incoherence**. If an agent accepts a normative baseline but rejects both full value specification and non-axiological proxies, it possesses no functional metric to distinguish intended from unintended changes, rendering the constraint operationally empty.
  2.  **Descriptive Metric + Meta-Level:** This leaf is vacant due to **unattractiveness**. Descriptive metrics (counterfactuals or plans) are inherently object-level measurements of state change; applying them as meta-level prohibitions on value updating creates a category error where physical measurements restrict epistemic processes without a normative bridge.

  ### Collapsed Distinctions
  **Leaf 3 (Counterfactual Constraint) and Leaf 5 (Proxy-Based Constraint)** risk collapsing in deterministic environments. If the "physically nearest counterfactual" is calculated using thermodynamic constraints identical to the "entropy footprint," the hard constraint becomes functionally identical. The tree cannot genuinely separate these positions without introducing a fifth branch level distinguishing *measurement ontology* (causal vs. thermodynamic) from *constraint type*.

  ### Position Mapping Summary
  *   **Impact Regularization:** Primarily occupies Leaf 4 (Counterfactual Penalty) and Leaf 6 (Proxy-Based Penalty).
  *   **Safe Exploration:** Primarily occupies Leaf 1 (Plan-Based Constraint) and Leaf 3 (Counterfactual Constraint).
  *   **Corrigibility/Value Learning:** Primarily occupies Leaf 8 (Meta-Level Asymmetric).
  *   **Thermodynamic AI:** Primarily occupies Leaf 5 (Proxy-Based Constraint).
