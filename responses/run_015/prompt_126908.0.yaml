      *   **Preserve Rational Authority:** The reasons against slavery exist independently of the honor dynamics that helped spread them. The honor dynamics made the reasons *effective*, not *true*.
      *   **Address (2):** The "recursive honor" constraint is plausible (people need to feel it's right to act on it), but it describes the *psychology of adoption*, not the *truth conditions* of the moral claim.
      *   **Cost of Rejecting (4):** You have to accept that sociology doesn't settle metaphysics/ethics. You have to allow that moral truth can be carried by non-rational vessels.

