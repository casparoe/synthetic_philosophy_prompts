      *   (3) says the *mechanism* of adoption is honor-driven, experienced as principle.
      *   (4) says this *debunks* the rational authority of the principle.
      *   *Philosophical Issue:* This is the Genetic Fallacy. Just because the *cause* of a belief is non-rational (social status, honor) doesn't mean the *content* of the belief is false or lacks justification.
      *   *Example:* I believe 2+2=4. My cause for believing it might be that my teacher told me (authority), not that I derived it from Peano axioms (reason). Does that make 2+2=4 false or lacking authority? No.
