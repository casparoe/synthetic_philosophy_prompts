      *   What if everyone cheats? The penalty must be severe.
      *   What if the diagram-averse students disengage? Assign roles.

  15. **Debrief Structure:**
      *   Map "Warrants" to "Genetic Definitions."
      *   Map "Indivisibles" to "Hobbes's rejection of abstract quantity."
      *   Map "Trisection" to "Hobbes vs. Wallis."
      *   Address Brouwer distinction.
