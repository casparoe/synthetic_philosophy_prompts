      *   I need to tell the user that "Generationism" is fine for class but "Genetic Definition" is the scholarship term.
      *   I need to make sure the "Irrational $a^b$" example doesn't bog down. Maybe swap for something geometric like "The center of gravity of a hemisphere." No, keep it simple. Let's use the "Intersection of two curves" where the intersection isn't constructible but exists.
      *   *Wait, the user specifically asked for the irrational example or a better one.* The irrational example ($ \sqrt{2}^{\sqrt{2}} $) is classic non-constructive existence. I will include it but frame it as a "Length Card."

  13. **Final Polish of the Activity:**
      *   Name: "The Commonwealth of Geometers."
      *   Currency: "Warrants."
      *   The "Crank" issue: The activity makes them feel the *motivation* for the crankiness, even if they conclude he was wrong.

  14. **Troubleshooting:**
