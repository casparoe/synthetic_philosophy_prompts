answer: |-
  ### Guidance Note: Interpreting "Don't State as Fact Anything You Don't Know"

  **1. Recommended Norm: Reasonable Justification**
  The rule should be understood as codifying **Reasonable Justification**. A member violates the rule only if they assert a factual claim without a basis that would appear responsible to a peer *at the time of posting*, given the information available then.

  *   **Why this beats the others:** "Truth" is unknowable without professionals; "Belief" is too loose (sincere wrongness harms users); "Knowledge" requires mind-reading; "Evidence" is too rigid for peer advice. "Reasonable Justification" balances safety with viability. It protects volunteers who try hard but get it wrong (Case 2) while catching negligent misinformation (Case 3).
  *   **What we lose:** We accept that lucky guesses (Case 1) go unpunished and that outdated but once-reasonable advice (Case 2) remains until separately flagged. We prioritise volunteer retention over perfect accuracy.

  **2. The Procedure (15-Minute Phone Check)**
  Arbitrators must follow these steps in order. Stop at the first terminal verdict.

  *   **Step 0: Claim Identification (MT & Ambiguity)**
      *   *Question:* Is this a factual claim or a hedge/guess?
      *   *Evidence:* Flat declarations vs. hedges ("I think", "maybe"). Check machine translation (MT) flattening.
      *   *If Met (Clear Claim):* Go to Step 1.
      *   *If Not Met (Ambiguous/Hedge):* **Leave** (Benefit of doubt goes to poster). *Terminal.*
      *   *Weight:* MT ambiguity counts heavily towards "Not Met".

  *   **Step 1: Temporal Reasonableness**
      *   *Question:* Was this claim reasonable *at the time of posting*?
      *   *Evidence:* Date of post vs. date of law change. Common knowledge at the time.
      *   *If Met (Reasonable Then):* Go to Step 2.
      *   *If Not Met (Anachronism/Wrong Then):* **Hide and Warn**. *Terminal.*
      *   *Weight:* High. Static content is judged on posting date, not today.

  *   **Step 2: Visible Basis**
      *   *Question:* Is there visible justification for the claim?
      *   *Evidence:* Links/sources (High weight), Basis Tag (Medium weight), Specificity (Low weight). Blank tag is neutral, not a violation.
      *   *If Met (Source/Tag present):* Go to Step 3.
      *   *If Not Met (No source, blank tag, high stakes):* **Require Caveat**. *Terminal.*
      *   *If Not Met (No source, blank tag, low stakes):* Go to Step 3.
      *   *Weight:* Sources outweigh tags. Blank tags are evidence gaps, not rule breaches.

  *   **Step 3: Harm and Authority**
      *   *Question:* Is there reported harm or high authority expectation?
      *   *Evidence:* User reports loss (money/rights). Account type (Charity/Shared vs. Individual).
      *   *If Met (Harm + False + Charity):* **Hide and Warn** (or Escalate). *Terminal.*
      *   *If Not Met:* **Leave**. *Terminal.*

  **3. Application to Cases**
  *   **Case 1:** **Leave.** Claim was factually correct and common knowledge (limitation periods). Blank tag is neutral. Later admission of uncertainty does not retroactively violate "Reasonable Justification" at the time.
  *   **Case 2:** **Leave.** Stat was accurate and sourced *at the time*. Law change is systemic, not poster fault. Rule governs poster conduct, not thread maintenance. (Note: Forum needs separate archiving process).
  *   **Case 3:** **Hide and Warn.** Claim was false and caused harm. Shared charity account holds higher duty of care. MT error does not absolve the account holder of responsibility for the posted text.

  **4. Judgement Points & Misfires**
  *   **Judgement Points:** Step 0 (MT ambiguity) and Step 3 (Severity of harm). These require human interpretation of context and cannot be fully automated.
  *   **Misfires:** The procedure **under-penalises** confident guessers who get lucky (Case 1). It **over-penalises** experts who know their stuff but don't link sources (mitigation: encourage sourcing in training, not punishment).
  *   **Unresolved:** We cannot fix outdated content via moderator sanctions; this requires a separate "thread archive" policy.

