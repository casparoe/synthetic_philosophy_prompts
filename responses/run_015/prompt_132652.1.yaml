      *   Make sure the distinction between "Right to Work" (RTW) statutes and the philosophical concept is clear but integrated.
      *   *Self-Correction on Case 1:* A hiring hall that favors members is effectively a "union shop" via the back door if the employer only hires through the hall. If the employer hires directly too, it's less restrictive. Need to analyze the *duty* imposed on the non-member.
      *   *Self-Correction on Case 2:* Opting out of grievance. If the union has exclusive representation (which they said they *don't* in Case 1, but Case 2 implies a member of the union), the union controls the grievance. If it's members-only, the non-member has no standing. But the member wants to opt out. This is about internal union democracy vs. collective strength.
