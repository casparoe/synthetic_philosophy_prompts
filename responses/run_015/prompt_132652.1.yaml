answer: |-
  ### Part I: Unstructured Brainstorming

  Okay, breathing. Inhale. Exhale.

  The phrase "Right to Work" is a linguistic minefield. It's a slogan, not a legal term of art, which is why it breaks down in hearings. When your side uses it, it's a **Claim-Right** (you owe me a job/conditions). When their side uses it, it's a **Privilege/Liberty** (I am free to not pay you) or an **Immunity** (you can't make me pay). The Law Prof who said they are the "same Hohfeldian thing" is trying to be clever, probably reducing everything to "Liberty of Contract." But that's a category error. A Claim-Right creates a Duty in another. A Liberty merely negates a Duty in oneself. They are structurally different incidents. If they were the same, there would be no conflict. The conflict exists *because* the incidents are different.

  I need to strip the rhetoric. No "justice," no "fairness." Just: Who holds the incident? Who bears the correlative? Is it a Claim, Privilege, Power, or Immunity?

  The "Right to Work for Less" chant is key. That admits the other side's position isn't about "work" per se, it's about the *terms* of work. It's a Liberty to degrade the price of labor.

  My side's "Right to Work" is often a Claim-Right against the State (give me a job) or a Claim-Right against the Employer (don't blacklist me). Their side's "Right to Work" is an Immunity against the Union (don't make me join).

  Can I get ten distinct readings?
  1.  Right to be provided a job (Claim vs State).
  2.  Right not to be physically prevented (Liberty vs All).
  3.  Right not to join a union (Immunity vs Union).
  4.  Right to contract individually (Liberty vs Union/State).
  5.  Right not to be blacklisted (Claim vs Employer).
  6.  Right not to be licensed out of existence (Claim vs State).
  7.  Right not to subsidize speech (Immunity vs Union).
  8.  Right to collective bargaining (Power vs Employer).
  9.  Right to inalienable conditions (Immunity vs Self/Contract).
  10. Right to non-discriminatory access (Claim vs Union/Employer).

  That works. Now, I need to be brutal about the correlatives. If I have a right, someone else must be in hell (burdened). Who is it?

  The Law Prof's collapse thesis: They might mean both sides assert a "Liberty to Contract." Union: Liberty to contract collectively. Employer/Worker: Liberty to contract individually. But a collective contract restricts the individual liberty. So they are conflicting Liberties, not the *same* claim. Or, the Prof means both assert an "Immunity from Coercion." Union: Immunity from Employer interference. Worker: Immunity from Union dues. Still different duty-bearers. The Prof is wrong, or at best, imprecise.

  Okay, let's lock in the Menu.

  ***

  ### Part II: The Menu of Ten Readings

  Here are ten sharply distinguished Hohfeldian readings of "The Right to Work." I have categorized them by the specific legal incident (Claim, Privilege, Power, Immunity).

  **1. The Keynesian Claim-Right**
  *   **Incident:** Claim-Right.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The State (or Economy).
  *   **Correlative Duty:** To provide meaningful employment opportunities (macroeconomic policy/job guarantee).
  *   **Status:** *Substantive-and-Defensible* philosophically, but *False* in positive US law.
  *   **Hearing Usage:** Your side (implied "decent conditions/job for all").

  **2. The Negative Liberty to Labor**
  *   **Incident:** Privilege (Liberty).
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** None (Correlative is "No-Right" in others).
  *   **Correlative Duty:** Others have no right to physically restrain you from working (anti-slavery).
  *   **Status:** *Trivial.* Everyone accepts this; chattel slavery is illegal.
  *   **Hearing Usage:** Rhetorical filler for both sides.

  **3. The Anti-Closed Shop Immunity**
  *   **Incident:** Immunity.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The Union (and State enforcing it).
  *   **Correlative Duty:** Disability of the Union to make membership a condition of employment.
  *   **Status:** *Substantive-and-Defensible* (This is the statutory "Right-to-Work" definition).
  *   **Hearing Usage:** The Other Side (the chant against mandatory dues).

  **4. The Liberty to Undercut**
  *   **Incident:** Privilege (Liberty).
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The Union (Correlative is "No-Right").
  *   **Correlative Duty:** The Union has no right to prevent the worker from accepting wages/conditions below the collective standard.
  *   **Status:** *Substantive-and-Defensible* (The "work for less" chant).
  *   **Hearing Usage:** The Other Side (explicitly acknowledged by the chant).

  **5. The Anti-Blacklist Claim-Right**
  *   **Incident:** Claim-Right.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The Employer.
  *   **Correlative Duty:** Duty not to coordinate with other employers to deny future employment based on union activity.
  *   **Status:** *Substantive-and-Defensible* (Often illegal, frequently practiced).
  *   **Hearing Usage:** Your side (nobody gets locked out by a boss).

  **6. The Occupational Access Claim-Right**
  *   **Incident:** Claim-Right.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The State (Licensing Boards).
  *   **Correlative Duty:** Duty not to create arbitrary licensing barriers that restrict entry into a trade.
  *   **Status:** *Substantive-and-Defensible* (Occupational licensing reform).
  *   **Hearing Usage:** Your side (nobody gets locked out by a licensing board).

  **7. The Compelled Speech Immunity**
  *   **Incident:** Immunity.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The Union.
  *   **Correlative Duty:** Disability of the Union to collect fees used for political/ideological purposes not directly related to collective bargaining.
  *   **Status:** *Substantive-and-Defensible* (Constitutional doctrine).
  *   **Hearing Usage:** The Other Side (implied in "don't have to pay a union"), sometimes Your Side (if lobbying is controversial).

  **8. The Collective Bargaining Power**
  *   **Incident:** Power.
  *   **Holder:** The Union (as agent of Workers).
  *   **Duty-Bearer:** The Employer.
  *   **Correlative Duty:** Liability of the Employer to have their terms altered by the agreement.
  *   **Status:** *Substantive-and-Defensible* (Core of labor law).
  *   **Hearing Usage:** Your Side (implied "right to organize/bargain").

  **9. The Inalienability of Labor Rights**
  *   **Incident:** Immunity.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The Worker (themselves) / The State.
  *   **Correlative Duty:** Disability of the Worker to waive certain core protections (e.g., minimum safety, minimum wage) even voluntarily.
  *   **Status:** *Substantive-and-Defensible* (Paternalistic/Human Rights view).
  *   **Hearing Usage:** Your Side (implies "decent conditions" aren't waivable).

  **10. The Equal Consideration Claim-Right**
  *   **Incident:** Claim-Right.
  *   **Holder:** The Worker.
  *   **Duty-Bearer:** The Union (if it controls hiring) OR Employer.
  *   **Correlative Duty:** Duty to allocate jobs based on merit/neutral criteria, not union status.
  *   **Status:** *Substantive-and-Defensible* (Civil Rights/Duty of Fair Representation).
  *   **Hearing Usage:** Contested. Your side claims it against employers; Other side claims it against Unions (hiring halls).

  ***

  ### Part III: The Law Prof's Collapse Thesis

  **Is the Law Prof right that they collapse into one thing?**

  **Verdict:** No. The Prof is committing a category mistake, likely conflating **Reading 2 (Negative Liberty)** with **Reading 4 (Liberty to Undercut)**.

  **Analysis:**
  The Prof likely argues: "Both sides want Freedom of Contract."
  *   **Your Side:** Wants the Freedom to Contract *Collectively* (Reading 8: Power).
  *   **Their Side:** Wants the Freedom to Contract *Individually* (Reading 4: Liberty to Undercut).

  These are not the same Hohfeldian incident.
  1.  **Structural Difference:** Your side asserts a **Power** (ability to change legal relations for a group). Their side asserts a **Privilege** (ability to act without duty). A Power to bind a group inherently negates the Privilege of the individual to deviate. They are logically conflicting, not identical.
  2.  **Duty-Bearer Difference:** Your side's "Right to Work" (Reading 1, 5, 6) usually imposes duties on the **State or Employer**. Their side's "Right to Work" (Reading 3, 4, 7) imposes disabilities on the **Union**.
  3.  **The "Same Thing" Illusion:** The only way they are the "same" is if you reduce all rights to "Liberties" (Reading 2). But Reading 2 is trivial (no one is arguing for slavery). Once you move to substantive claims (wages, dues, access), the incidents diverge.

  **Why it matters:** If you accept the Prof's collapse, you concede that your demand for collective bargaining is an infringement on *their* "Right to Work." You must reject the collapse. You are asserting a **Power to Bargain**; they are asserting an **Immunity from Association**. These are distinct.

  ***

  ### Part IV: Application to Your Two Cases

  You are writing rules from scratch. You need to know which Readings you are adopting and which you are rejecting.

  #### Case 1: Members-Only Structure + Hiring Hall (Members First)
  *The Setup:* No exclusive representation. No agency fee. You bargain for members. You run a hiring hall. Members get dispatched before non-members.

  *   **Analysis against the Menu:**
      *   **Violates Reading 10 (Equal Consideration)?** **Yes.** By prioritizing members, you are imposing a duty on the hiring hall (you) to discriminate based on association status. Non-members have a Claim-Right to equal consideration *if* you accept Reading 10 as universal.
      *   **Violates Reading 3 (Anti-Closed Shop Immunity)?** **No.** Reading 3 says they cannot be *forced* to join to keep a job they *have*. It does not guarantee them access to a *union-run* hiring hall on equal terms. However, if the University *only* hires through your hall, this functionally becomes a closed shop, triggering Reading 3 concerns.
      *   **Violates Reading 4 (Liberty to Undercut)?** **Yes/No.** Non-members are free to undercut (Liberty), but they are denied the Hall's dispatch (Privilege). You are not stopping them from working elsewhere, but you are privileging the collective rate for members.
      *   **Compatible with Reading 8 (Collective Bargaining Power)?** **Yes.** This is the exercise of your Power. You use your leverage to benefit your principals (members).

  *   **Decision:**
      *   **Is the violation a reason to stop?** Only if you accept Reading 10 as paramount. Most labor law (Duty of Fair Representation) applies only to *exclusive* representatives. Since you are **members-only**, you generally owe no duty to non-members.
      *   **Strategic Advice:** Adopt **Reading 8 (Power)** as your justification. Explicitly reject **Reading 10 (Equal Consideration)** for non-members. Your rule is: "This Hall is a benefit of membership." If the University demands you dispatch non-members equally, you must refuse or the Hall loses its value as an organizing tool.
      *   **Risk:** If the Hall becomes the *only* way to get work, the State may impose Reading 10 or Reading 3 on you by force. Keep the Hall as a *preference*, not a *gate*, if possible.

  #### Case 2: Member Opt-Out (Grievance) + Dues Reduction (Lobbying)
  *The Setup:* A member wants to represent herself in discipline (opt-out of union grievance) and cut dues by the % spent on lobbying.

  *   **Analysis against the Menu:**
      *   **Opt-Out of Grievance:**
          *   **Violates Reading 9 (Inalienability)?** **Maybe.** If you view the grievance procedure as a safety standard (like OSHA), waiving it is dangerous.
          *   **Violates Reading 8 (Collective Bargaining Power)?** **Yes.** If individuals can opt out, the Union's Power to bind the Employer is weakened. The Employer can divide and conquer.
          *   **Compatible with Reading 2 (Negative Liberty)?** **Yes.** She has a Liberty to speak for herself.
      *   **Dues Reduction for Lobbying:**
          *   **Violates Reading 7 (Compelled Speech Immunity)?** **Yes.** This is the core of Reading 7. If she objects to the political speech, she claims an Immunity from subsidizing it.
          *   **Compatible with Reading 8 (Collective Bargaining Power)?** **No.** Lobbying is often how you gain the Power to Bargain (changing the law). Reducing funding weakens the Power.

  *   **Decision:**
      *   **Grievance Opt-Out:** **Reject.** You should adopt **Reading 9 (Inalienability)** internally. The grievance procedure is not just a service; it is a collective shield. Allowing individual waiver creates a "duty to weaken the collective." Tell the member: "You have a Liberty to speak, but the Union has a Power to control the process to ensure consistency. We do not recognize the Liberty to waive collective protection."
      *   **Dues Reduction:** **Accept (with caveats).** Reading 7 is legally robust (even without *Janus*, it's philosophically sound). However, you can define "Lobbying" narrowly. If the lobbying is directly about *wages and hours* (e.g., lobbying the state for higher ed funding), argue it is "Chargeable" (not political speech, but bargaining support). If it is general partisan politics, **Reading 7** prevails. Let her opt out of the political portion, but not the bargaining portion.
      *   **Strategic Advice:** This distinguishes you from the "Other Side." You respect **Reading 7 (Compelled Speech)** but reject **Reading 4 (Liberty to Undercut/Weaken)**. You allow her to not fund politics, but you do not allow her to undermine the grievance machinery.

  ### Summary of the Shape of the Claim

  The Law Prof was wrong. The two sides at the hearing were not asserting the same thing.
  *   **Your Side:** Asserted **Claim-Rights** (to conditions, access) and **Powers** (to bargain).
  *   **Their Side:** Asserted **Immunities** (from dues) and **Privileges** (to undercut).

  These are not the same. They are opposing vectors.
  *   **For your Union Rules:**
      1.  **Embrace Reading 8 (Power):** You exist to alter terms collectively.
      2.  **Embrace Reading 7 (Speech Immunity):** Allow dues reduction for pure politics (it's defensible and protects you from legal attack).
      3.  **Reject Reading 4 (Liberty to Undercut):** Do not allow members to opt out of grievance procedures or wage standards.
      4.  **Reject Reading 10 (Equal Consideration) for Non-Members:** Your Hiring Hall is a membership benefit, not a public utility (unless the law forces you otherwise).

  You are not protecting a "Right to Work." You are building a **Power to Bargain**. Be precise about that.
