      SSA: I am a random sample from *actual* observers. But I don't know who the actual observers are yet.
      *Standard SSA:* "I am a random observer from the set of all observers."
      If H: Set size = 1. If T: Set size = 18.
      If I don't know if I'm in the set...
      *Actually, the Presumptuous Philosopher argument relies on SIA.* SSA rejects the move.
      SSA says: The coin is fair. I have no info. P(T)=0.5.
      SIA says: I am more likely to exist in T. P(T) ~ 1.
      *So the game must force a bet where P(T)=0.5 leads to one action, and P(T)~1 leads to another.*
      *Currency 1 (Per Head):* Bet T. (Because if T, 18 people win. If H, 1 person wins. Total utility higher).
      *Currency 2 (Per World):* Bet H. (Because if H, 1 person wins 10. If T, 18 people share 10. Individual EV higher for H).
      *This works.*
      SSA (P=0.5) -> Maximizes EV in Currency 2 by betting H.
      SIA (P=18/19) -> Maximizes EV in Currency 1 by betting T.
      *Perfect.*

      *Wait, does SSA bet H in Currency 2?*
      EV(H) = 0.5 * 10 = 5.
      EV(T) = 0.5 * (10/18) = 0.27.
      Yes.
      *Does SIA bet T in Currency 1?*
      EV(H) = (1/19) * 1 = 0.05.
      EV(T) = (18/19) * 1 = 0.95.
      Yes.
      *Okay, the math holds.*

      *Final check on the "Leak":*
      If they bet *before* opening the envelope, they can't see who else is betting.
      So the "Heads Down" rule is critical.
      "Pen on paper. Heads down. No peeking until I say."
      This is standard exam protocol, not a gimmick.

      *Let's write it.*
answer: |-
  Here is a runnable session plan designed to force the disagreement through incentives rather than definitions, leveraging your "two currencies" hunch.

  ### Session Title: The Two-Treasury Game
  **Goal:** Demonstrate that the SSA/SIA disagreement is often a disagreement about *which expected value to maximize* (per-observer vs. per-world), not just a disagreement about credence.
  **Time:** 90 Minutes
  **Materials:** Whiteboard (divided into two large columns), 200 pieces of candy, 18 envelopes per round (or a reusable deck of cards), slips of paper for betting, a coin.

  ---

  ### Part 1: The Setup (10 Minutes)
  **1. The Story:**
  Tell them: "We are running 6 rounds. In each round, I flip a fair coin."
  *   **Heads:** The universe is 'Small'. Only **1** person in this room is a valid **Observer**.
  *   **Tails:** The universe is 'Large'. All **18** people in this room are valid **Observers**.
  *   *Crucial Mechanism:* I will hand out sealed envelopes.
      *   If **Heads**: 1 envelope says **ACTIVE**, 17 say **VOID**.
      *   If **Tails**: 18 envelopes say **ACTIVE**.
  *   **The Rule:** You must write your bet (Heads or Tails) on your slip *before* opening your envelope. You do not know if you are Active or Void when you bet.

  **2. The Two Treasuries (Write this on the Board):**
  Explain that we are tracking winnings in two separate currencies simultaneously. This is the core of your hunch.

  *   **Treasury A (The "SIA" Pot):** **1 Candy** for every **Active** bettor who guesses correctly.
      *   *Logic:* Maximizes total candy in the room. Favors the world with more observers.
  *   **Treasury B (The "SSA" Pot):** **10 Candies** per round, split equally among **Active** bettors who guess correctly.
      *   *Logic:* Maximizes individual expected payout per world. Favors the world with fewer observers (less dilution).

  **3. The "Heads Down" Protocol:**
  "To make this work, you must write your bet *before* you know if you are Active, and *before* you see if others are writing. Heads down. Pens moving. I collect the bets. Then we open envelopes."
  *(Note: This solves the 'leak' structurally. It's not a blindfold; it's a commitment phase.)*

  ---

  ### Part 2: The Game (35 Minutes)
  **Run 6 Rounds.** (Keep it tight. 5 mins per round).

  1.  **Flip Coin** (Keep result hidden).
  2.  **Distribute Envelopes** (Prepared in advance for speed).
  3.  **Betting Phase:** "Heads down. Write H or T. Fold slip."
  4.  **Collection:** Gather all slips.
  5.  **Reveal:** "Open envelopes."
      *   If **Heads**: Ask the 1 Active person to stand.
      *   If **Tails**: Ask everyone to stand.
      *   *(This is where the 'Presumptuous' feeling hits. If it's Tails, the room stands up. If Heads, one person stands.)*
  6.  **Scoring:** Reveal the coin.
      *   **Treasury A:** Count correct Active bettors. Give 1 candy each.
      *   **Treasury B:** Count correct Active bettors. Divide 10 candies among them.
      *   *Update the Whiteboard totals.*

  **Predicted Dynamics:**
  *   **Rounds 1-2:** Confusion. People will hedge.
  *   **Rounds 3-4:** Polarization. The "Total Candy" maximizers will start betting Tails every time. The "Individual EV" maximizers will start betting Heads (fearing dilution in Treasury B).
  *   **Round 5-6:** Entrenchment. You will see half the room betting T, half betting H, despite identical evidence.

  ---

  ### Part 3: The Payoff & Data (10 Minutes)
  Count the candy. Ask for a show of hands:
  1.  "Who bet Tails more than 3 times?" (Likely ~50-60%)
  2.  "Who bet Heads more than 3 times?" (Likely ~40-50%)
  3.  "Who switched strategies mid-game?"

  **The Reveal:**
  Point to the Whiteboard.
  *   **Treasury A Total:** Likely high (driven by Tails rounds).
  *   **Treasury B Total:** Likely higher for the Heads-bettors (because when they won, they didn't share).
  *   *Show them:* "The Tails-bettors won more *total* candy for the room. The Heads-bettors won more *average* candy per win."

  ---

  ### Part 4: The Debrief (35 Minutes)
  *Map the game to the philosophy. Do not lecture; ask them to explain the game using the terms.*

  **1. Mapping the Principles (10 mins)**
  *   **Ask:** "Why did you bet Tails?"
      *   *Expected Answer:* "There were more of us in Tails. I was more likely to be in that world."
      *   *Label:* **Self-Indication Assumption (SIA).** You reasoned from the *number of observers*.
  *   **Ask:** "Why did you bet Heads?"
      *   *Expected Answer:* "The coin was fair. Why should the number of people change the odds? Also, in Treasury B, Tails paid out almost nothing."
      *   *Label:* **Self-Sampling Assumption (SSA).** You reasoned from the *fairness of the coin* and treated yourself as a random sample from *actual* observers, not possible ones.
  *   **The Pivot:** "Notice: You didn't disagree about the coin. You disagreed about **which Treasury matters**."
      *   SIA maximizes **Treasury A** (Total Observer Welfare).
      *   SSA maximizes **Treasury B** (Per-World Accuracy/Value).
      *   *Your Hunch Confirmed:* The cosmological argument often stalls because one side is arguing about the *fraction of observers who are right* and the other is arguing about the *probability the world is right*.

  **2. The "Sleeping Beauty" Guy (10 mins)**
  *   *Let him speak.* He will say: "This is just Sleeping Beauty. Heads = 1 awakening, Tails = 18 awakenings. Thirder = SIA, Halfer = SSA."
  *   *The Disanalogy (Make them find it):* Ask: "In Sleeping Beauty, does Beauty know how many *other* Beauties are awake?"
      *   *Answer:* No. She is isolated.
      *   *In this game:* In the 'Open Envelope' phase, you *saw* the room.
      *   *The Point:* In SB, the evidence is purely indexical ("I am awake"). In the Presumptuous Philosopher (and this game's setup), the evidence is existential ("There are many of us").
      *   *Crucial Distinction:* In SB, the *world* doesn't change size, only the *observations*. In this game (and PP), the *ontology* changes (1 person vs 18 people). SSA handles SB by saying "I am a random awakening." SSA handles PP by saying "I am a random observer." The tension is sharper here because the *population* changes, not just the *schedule*.

  **3. The Physics/CS Measure Problem (10 mins)**
  *   They will bring up "infinite universes" or "simulation weighting."
  *   *Shut it down gently:* "In this game, the measure was discrete (1 vs 18). In cosmology, the measure is continuous and unbounded. If you thought Treasury A was obvious here, what happens when the 'Tails' universe has infinite observers? The candy pot breaks."
  *   *Takeaway:* The game works because the numbers are finite. Anthropics breaks when the denominators go to infinity. That's the Measure Problem. This game is the finite shadow of that problem.

  **4. The Limit (5 mins)**
  *   **What the game didn't do:** It didn't tell you which Treasury is *morally* or *epistemically* correct.
  *   **The Hard Truth:** "You felt the pull of both. That feeling *is* the problem. Philosophy hasn't solved which Treasury God uses, or if God cares about Treasuries at all. We just showed you that your decision theory depends on which scoreboard you're looking at."

  ---

  ### Troubleshooting: What Will Go Wrong
  1.  **The Leak (Peeking):**
      *   *Risk:* In Tails rounds, people will look up and see everyone writing, confirming Tails before submitting.
      *   *Fix:* Be a tyrant about the "Heads Down" rule. "If you peek, you invalidate the round." Grad students respect procedural rigor.
      *   *Backup:* If they peek, acknowledge it in debrief. "You used indexical evidence (seeing the crowd). SIA says you should have bet Tails *before* looking. Did you?"

  2.  **The "Void" Confusion:**
      *   *Risk:* People with VOID envelopes won't know if they should bet.
      *   *Fix:* Explicit instruction: "Everyone bets. VOID bets just don't count for candy. But we still collect them to see what the 'non-observers' thought." (Actually, simpler: "If VOID, you still write a bet, but you get no candy. This keeps the data clean.")

  3.  **Boredom/Speed:**
      *   *Risk:* Passing out 18 envelopes 6 times takes forever.
      *   *Fix:* Pre-stack the envelopes. Have a TA or a willing student help distribute. Or, use **Cards** (Red = Active, Black = Void) to save paper time.
      *   *Time Cut:* If running late, cut to 4 rounds. 3 is enough to see the pattern.

  4.  **The "Fair Coin" Intuition:**
      *   *Risk:* Everyone bets 50/50 and the room splits evenly every time. No tension.
      *   *Fix:* Emphasize **Treasury B**. "If you bet Tails and win, you share 10 candies with 17 people. That's half a candy each. If you bet Heads and win, you get 10 candies alone." This financial pressure forces the SSA move even if their credence is wobbly.

  ### What You Can't Solve (Be Straight About This)
  *   **The Normative Question:** The game shows *why* they disagree (different scoring rules), but it doesn't prove which scoring rule is *true*. You will have to admit: "We don't know if the universe cares about Total Candy or Per-World Candy. That's the metaphysical gap."
  *   **The Reference Class:** Someone will ask "Why is the reference class 'people in this room'?" You won't have an answer. That's the Reference Class Problem. Acknowledge it: "The game works because we defined the class. In reality, we don't know the class."

  ### Summary for the Whiteboard
  Draw this at the start and leave it up:
  | | **Treasury A (Per-Observer)** | **Treasury B (Per-World)** |
  | :--- | :--- | :--- |
  | **Payout** | 1 Candy / Correct Bettor | 10 Candies / Round (Split) |
  | **Incentive** | Bet **Tails** (More winners) | Bet **Heads** (Less dilution) |
  | **Principle** | **SIA** (I'm likely in big world) | **SSA** (Coin is fair / I'm random sample) |

  Good luck. If the fumigation fumes hit you, drink water. The game is robust enough to run itself once the rules are on the board.
