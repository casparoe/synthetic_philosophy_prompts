          *   *Owen's Claim:* Theory changes answer when game changes -> Theory working.
          *   *Verdict:* Logically consistent, but misses Lena's point about *why* it changed.

      *   **(9) Lena:** Says this settles it for *her*. Original collapse wasn't about rationality/CKR, it was about the specific payoff cell (96 vs 64). Change that cell, cooperation happens with *same* assumptions (CKR, no altruism).
