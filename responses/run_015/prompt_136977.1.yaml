          *   *Verdict:* Right (technically).

      *   **(4) Lena:** Claims advice evaporates at reached nodes. If I am at N4, P1 passed N1 & N3. CKR is falsified. BI premises are false. Theory gives no advice.
          *   *Assessment:* This is the "Trembling Hand" or "Revision of Beliefs" argument. If CKR implies N1 is never reached, but N1 *was* reached, CKR is false. You cannot use CKR to reason at N4. This is a strong point against the *stability* of the BI prediction upon deviation.
