      *   *Issue 3 (Bounded Rationality):* Classic Dutch books assume logical omniscience. Institutional experts are bounded. If a Dutch book can be made against *any* bounded agent simply because they aren't omniscient, the norm is useless. This is also very upstream. It defines the *target* of the norm.
