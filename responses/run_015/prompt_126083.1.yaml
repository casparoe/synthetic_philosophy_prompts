answer: |-
  I have been thinking about our argument from last night, and I want to say straight away that your diagnosis of why the debate never closes is sharper than most of the literature we were citing. You are right that we are talking past each other, and your breakdown of the verbal ambiguity, the divergent questions, and the measurement problem captures almost exactly why this thing resurfaces every few decades without ever being settled. If I had to bet on which of those three is doing the heaviest lifting, I would side with you on the measurement problem wearing a theory costume. The reason your friend's critique of Weber feels so compelling to modern economists is not necessarily because the theory is wrong, but because denomination is a terrible proxy for belief intensity, and region is a terrible proxy for either. When you run a regression with denomination as the independent variable, you are indeed running a joint test of whether Protestantism matters and whether being Lutheran actually means you hold Protestant ethics, and when the result is null or mediated by literacy, you cannot tell if the theory failed or if the proxy failed. This is the classic identification versus validity tradeoff, and almost everyone in this debate sacrifices validity for identification because they need exogenous variation, which usually comes from borders or historical accidents that correlate with culture but do not measure it.

  That said, I think there is a fourth thing tangled in here that you might be missing, which is the problem of co-constitution or endogeneity over time. Your friend treats institutions and culture as independent variables that compete to explain variance in an outcome, but in the long run, culture shapes institutions and institutions shape culture until they are indistinguishable. If Protestantism encouraged literacy, and literacy led to better institutions, and those institutions sustained capitalism, saying the effect runs through institutions is technically correct but analytically hollow because the institutions are the crystallized form of the culture. This is why the argument never closes; it is not just that we are measuring poorly, but that we are trying to separate two things that fused together centuries ago. Your friend's claim that culture is just a residual bucket cuts both ways, as you noted, but it also ignores that institutions are often just culture that got written down and enforced. When you strip the normative content out of culture to make it measurable, you often strip out the very mechanism that was supposed to be doing the work, leaving you with a label that correlates with outcomes but explains nothing.

  Regarding your two proposed tests, I think they are clever attempts to improve identification, but I worry they still collapse into the same joint test problem you identified. The carry-on test, where you look at migrants, is essentially the immigrant epidemiology approach used in lots of recent development work, and it is better than looking at static regions because it holds the institutional environment constant while varying the cultural background. However, it still relies on the assumption that the migrant carries the culture with them and does not assimilate immediately, and it still usually proxies culture with birthplace or religion rather than measured beliefs. If the effect travels with the migrant, it suggests something internalized is at work, but it does not prove that internalized thing is a value rather than a habit or a network effect that looks like culture. The blocked-expression test is stronger because it looks for an interaction effect between culture and institutional constraints, which is closer to testing a mechanism. If the cultural effect disappears when institutions block accumulation, it suggests the culture was operating through economic channels, but again, if your measure of culture is weak, you might find no effect simply because your proxy is noisy, not because the mechanism is absent. Both tests reduce the noise from confounding institutional variables, but neither solves the fundamental issue that we do not have a direct measure of the specific belief or value supposed to be causing the change.

  To be honest about whether this will ever end, I think you should prepare yourself to dissolve the question rather than answer it. The question can culture be a cause is badly posed because it implies a binary distinction between culture and institutions that does not exist in reality. A more productive question would be under what conditions do shared meanings constrain behavior independently of formal rules, and how do we measure those meanings without relying on ecological fallacies. There is no dataset or natural experiment that will settle this because any experiment requires operationalizing culture, and every operationalization invites the critique that you have missed the essence of the thing you are measuring. The Weber thesis persists not because it is empirically robust in a modern sense, but because it captures a intuitive truth about how worldviews shape economic behavior, even if the specific causal chain is messy. Your friend is right that the quantitative literature has weakened the strong version of the claim, but you are right that dismissing culture as a residual is intellectually lazy. The way out is to stop arguing about whether culture is a cause and start arguing about which specific cultural traits are measurable, how they interact with specific institutional constraints, and admitting that sometimes the mechanism is literacy because literacy is a cultural choice. I think if you frame it that way, you might not win the argument, but you might finally change the subject to something where progress is actually possible.
