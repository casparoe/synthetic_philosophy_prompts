answer: |-
  This is a fantastic question. You are spotting exactly what makes Hume such a pivotal figure: he is trying to build a "social physics" using the scientific vocabulary of his day, but he is careful enough not to let the metaphor overwrite the mechanism.

  As a biologist, you are right to be suspicious of the "incompressible fluid" model. Modern economics treats money as endogenous (created by credit/behavior), whereas Hume treats it as exogenous (a stock of gold/silver). However, to answer your specific question: **Hume is not deriving his economics from hydraulics; he is using hydraulics to illustrate a mechanism driven by price competitiveness.**

  Here is how to parse the passage without importing thermodynamic baggage, separating the poetic image from the logical argument.

  ### 1. The Historical Context: Newtonianism, Not Hydraulics
  To answer your first worry: Is he borrowing from actual hydraulic science?
  In the mid-18th century, the "Scientific Revolution" (Newton, etc.) was the height of intellectual fashion. Philosophers loved to find "laws of motion" in human society. Hume uses the water analogy because **communicating vessels** were a standard example of equilibrium in natural philosophy at the time.

  However, he is not claiming money *obeys* hydrostatic pressure. He is claiming money *behaves as if* it seeks equilibrium. It is a **heuristic device**, not a physical proof. He uses it to combat the Mercantilists, who believed gold was wealth itself and could be permanently stockpiled. Hume needs a vivid image to show that gold is merely a *medium* that moves, not a *store* that stays.

  ### 2. Where the Image Ends and the Argument Begins
  This is the crux of your inquiry. You can separate the metaphor from the mechanism by looking for the **causal link**.

  *   **The Metaphor:** Water seeks its own level due to gravity.
  *   **The Argument:** Money seeks its own level due to **prices**.

  Hume's actual argument (stripped of the water imagery) is the **Price-Specie Flow Mechanism**. Here is the logical chain he is proposing, which stands independently of the fluid analogy:

  1.  **Injection:** Suppose Britain suddenly doubles its gold supply.
  2.  **Inflation:** With more gold chasing the same goods, domestic prices rise (Quantity Theory of Money).
  3.  **Competitiveness:** British goods are now expensive for foreigners; Foreign goods are now cheap for the British.
  4.  **Trade Balance:** Exports fall, imports rise.
  5.  **Outflow:** To pay for the imports, gold must physically leave Britain.
  6.  **Equilibrium:** Gold leaves until British prices fall back to competitive levels.

  **The Pivot Point:** The water analogy suggests the gold flows out *because* there is too much of it (like pressure). The economic argument says the gold flows out *because domestic inflation made the nation uncompetitive.*

  If you remove the water image, the argument still holds: **You cannot hoard gold because hoarding it raises prices, which kills exports, which drains the gold.** The "fluid" image is just a visualization of the equilibrium state; the "price mechanism" is the engine.

  ### 3. The "Friction" is Actually the Economic Engine
  You mentioned Hume acknowledges "friction" in the channels. In a physics model, friction is a loss. In Hume's economic model, this "friction" (the time lag) is where the actual benefit lies.

  Hume argues that while the gold is flowing in (before prices fully rise), there is a "stimulus" effect.
  *   **Biologist translation:** Think of it like a hormone spike. The immediate surge of money wakes up "dormant industry." Workers see more money circulating, they work harder, production increases *before* prices fully adjust.
  *   **The Argument:** Hume explicitly states that the *transition period* is more valuable than the *equilibrium state*. A nation wants a growing money supply, not a static high one.

  This proves he isn't enslaved by the physical analogy. A hydraulic engineer wants the water to settle instantly. Hume wants the money to keep moving slowly, because the *motion* stimulates labor. If the analogy were the argument, he would argue for instant equilibrium. Instead, he argues the delay is beneficial.

  ### 4. Where the Analogy Breaks (Your Intuition is Correct)
  You noted that money isn't an incompressible liquid in a closed loop. Hume actually agrees with you, though he lacks your modern terminology.

  The water analogy implies money is neutral (it doesn't change the vessel). But Hume argues money *does* change the vessel (the economy) during the flow.
  *   **The Limit of the Image:** Water doesn't care how big the vessel is. Money does. If the influx of gold causes people to build better factories or improve technology (increase the "volume" of the vessel), the water level (prices) might not rise as much.
  *   **Hume's Nuance:** He admits that if the increased money supply stimulates enough new production, the price rise can be mitigated. This breaks the "incompressible fluid" model.

  ### 5. How to Read the Passage (A Strategy)
  To avoid the thermodynamics baggage, read the passage with this filter:

  1.  **Ignore "Gravity":** When he talks about money "falling" or "flowing," translate it to **"capital flight due to trade deficits."**
  2.  **Ignore "Pressure":** When he talks about the "height" of the water, translate it to **"domestic price levels relative to neighbors."**
  3.  **Focus on "Friction":** When he talks about the resistance in the channels, translate it to **"market stickiness" or "time lags in price adjustment."**

  ### Conclusion
  Does the conclusion stand on its own? **Yes.**
  Hume's conclusion (that you cannot permanently hoard wealth via gold accumulation) rests on the relationship between **money supply** and **relative prices**, not on the properties of fluids.

  The water analogy is rhetorical armor. He is fighting Mercantilists who view gold as a static treasure. He uses the fluid image to shock them into seeing gold as a dynamic current.

  As a biologist, you might appreciate this distinction: Hume is describing **homeostasis**. The economy self-regulates to a balance of trade. The water analogy describes the *state* of homeostasis, but the *mechanism* is behavioral (pricing and trade), not physical. You can discard the hydraulics without damaging the philosophy, provided you keep the insight that **wealth is industrial capacity, not the token used to measure it.**
