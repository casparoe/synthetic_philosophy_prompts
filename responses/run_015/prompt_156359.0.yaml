  hey, i'm a retired biologist who recenty got into philosphy and i'm trying to work through Hume's essay Of Money (mid-1750s?). there's a section where he compares money to a fluid in vessels — if you dump extra gold into one nation it doesn't pool there, it flows outward through trade until the levels equalize, and prices rise like the surface of water finding a new height. he mentions friction in the channels slowing this down. i'm trying to figure out: is he actually borrowing from hydraulics, or is it just a casual metaphor? he uses it to argue that no country can hoard gold and stay rich, because the excess leaks away. but in a real economic system with production and credit, money isn't an incompressable liquid in a closed loop. so i'm wondering whether his conclusion — that trade automatically balances national wealth — stands on its own, or whether it's being carried by the physical anlogy. can someone help me parse the passage without me importing my old thermodymanics baggage? i want to know where the image ends and the actual argument about circulation begins.
