      *   *Standard Externalist View:* No, past reference is fixed by past causal chains. When Earth-Oscar said "water" on Earth, he was causally connected to H2O. That doesn't change just because he moves.
      *   *The "Switching" Case (Burge/Tyler):* There is philosophical literature on "semantic switching." If Oscar moves to Twin Earth and stays there, eventually his word "water" might shift reference to XYZ. But it's not instantaneous, and it certainly doesn't retroactively rewrite history.
