  4.  **Identifying Fractures (The "Audit"):**
      *   *Fracture 1: Inheritance Mechanism.* Genes are vertical (mostly). Ideas are horizontal, oblique, and reticulate (networked). Alchemy *did* contribute to chemistry (lab techniques), even if the theory was "wrong." Biology doesn't usually incorporate DNA from a cousin species that went extinct *unless* there's hybridization, but in history, hybridization is the norm.
      *   *Fracture 2: Counterfactual Dependency.* If alchemy hadn't existed, would chemistry exist? Probably not in the same way. The "dead end" was actually the soil. In biology, if a side branch goes extinct, the main branch usually continues unaffected (unless it was a keystone species, but we're talking lineage here). In history, the "losers" define the boundaries for the "winners."
      *   *Fracture 3: Normativity/Function.* Biological function is often teleonomic (goal-directed by selection). Historical "success" is often contingent, political, or power-laden. Just because an idea survived doesn't mean it was "fitter" in an epistemic sense, just socially robust.
