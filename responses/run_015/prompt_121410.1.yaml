  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *The Analogy:* It's essentially a "Presentist" or "Internalist" defense using evolutionary biology language to justify focusing on the "line of descent."
      *   *The Biology:* Phylogenetics. We look at the lineage leading to *Homo sapiens*. We don't study *Australopithecus sediba* if it didn't lead to us (though in reality, biologists *do* study side branches to understand the environment).
      *   *The History:* Studying Newton to understand Physics. Ignoring Boyle's alchemy because it didn't lead to modern chemistry.
      *   *The Problem:* Ideas mix, merge, and mutate differently than genes. "Extinct" ideas often feed into "surviving" ones in ways that aren't linear. The "environment" in history includes the ideas themselves (reflexivity).

  3.  **Drafting the Correspondence Table:**
      *   *Present Organism:* Modern Empirical Science (or the specific institution).
