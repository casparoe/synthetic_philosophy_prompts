  5.  **Addressing Counterfactual Dependency:**
      *   This is crucial. The prompt asks: *Would the present institution have developed differently had those dead branches persisted or merged?*
      *   In biology: If *H. neanderthalensis* went extinct, *H. sapiens* still evolved (mostly).
