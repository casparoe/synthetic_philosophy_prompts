answer: |-
  Here is the decomposition based on current neuroscience and computational theory, distinguishing settled facts from contested interpretations.

  **1. Probability neurons operate via non-binary statistical logic rather than digital symbols: 0.95**
  *Settled:* It is consensus that neurons are noisy, spiking units with analog integration, not precise binary logic gates like a CPU.
  *Contested:* Whether higher-level cognition emergently utilizes symbolic structures despite this non-symbolic substrate.

  **2. Probability redundancy and analog error-correction are central to brain reliability: 0.85**
  *Settled:* The brain exhibits massive degeneracy and remains functional despite significant neuron loss or noise.
  *Contested:* Whether this is best described as "analog error-correction" versus robust attractor dynamics or homeostatic plasticity.

  **3. Probability this framework is closer to reality than standard backprop-based deep learning: 0.70**
  *Settled:* Backpropagation is biologically implausible regarding weight transport and global error signals, and DL lacks biological fault tolerance.
  *Contested:* Whether DL's distributed representations already capture the essence of "redundancy" sufficiently, or if the architectural gap is fundamental.

  **Combined Credence: 0.60**
  I treat these as conjunctive weights on the friend's summary; while the anti-symbolic and pro-redundancy claims are strong, the assertion that von Neumann's specific framework outperforms modern connectionism (DL) on *all* counts is less certain because DL is already statistical and distributed.

  **Least Certain Term:** Proposition 3 (The comparison to Deep Learning).
  **Evidence to Shift It:** Discovery of a biologically plausible learning rule that approximates gradient descent would lower this probability; conversely, proving that brains use purely local, redundancy-heavy coding schemes that fundamentally cannot be modeled by matrix multiplication would raise it.
