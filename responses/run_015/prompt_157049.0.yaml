answer: |-
  To adjudicate claims of "premature truth" without resorting to hindsight bias, we require a specification that distinguishes a *progressive research programme* from a *degenerating* one. The following desiderata are designed to be applied ex-ante, or at least independently of the specific outcome in question.

  ### The Desiderata for "Right But Early"

  **1. The Ex-Ante Confidence Interval (Non-negotiable)**
  A prediction cannot be merely a point estimate on an infinite timeline. It must specify a probability distribution or a confidence window for the event's occurrence.
  *   **Case:** If a theorist predicts "collapse by 2000," and it happens in 2005, that is a near-miss. If they predict "collapse eventually," no amount of time falsifies them. To claim "early" rather than "wrong," the theory must have defined what "late" looks like before the deadline passed.
  *   **Rationale:** Without a bound on the tail risk, "eventually" is tautological. All physical systems collapse eventually; the prediction is only meaningful if it excludes specific timelines.

  **2. Mechanism Invariance (Non-negotiable)**
  The causal chain explaining *why* the event must occur cannot be substantially altered post-hoc to accommodate the delay.
  *   **Case:** If a theory predicts famine due to arithmetic food growth vs. geometric population growth, it cannot later save itself by arguing the constraint is actually oil depletion or climate change. That is a new theory.
  *   **Rationale:** The identity of a theory resides in its mechanism. If the mechanism changes, the "rescue" is actually a replacement. A "right but early" claim requires the same engine to be running, merely idling longer than expected.

  **3. The Mortgage Rule (Non-negotiable)**
  Every adjustment to the theory's timeline or scope must incur a theoretical cost. The theorist must surrender a previously claimed domain, narrow a confidence interval, or predict a novel, risky observable that was not part of the original formulation.
  *   **Case:** If you push the date of collapse from 1990 to 2030, you must explain why the intervening years did not trigger the mechanism, and you must predict something specific about 2030 that differs from the status quo projection.
  *   **Rationale:** This is the Lakatosian criterion for a "progressive problem shift." Without a cost, rescues are free, and the theory becomes unfalsifiable in practice, even if not in principle.

  **4. The Mirror Test (Prejudice)**
  If a rescue move would be ridiculed if employed by a proponent of the opposing view (e.g., a techno-optimist claiming innovation will "eventually" solve scarcity), it is inadmissible for the pessimist.
  *   **Case:** If we reject the optimist's claim that "technology will save us eventually" as faith-based, we must reject the pessimist's claim that "scarcity will get us eventually" on the same grounds.
  *   **Rationale:** This is a check against tribal epistemology. However, it relies on the existence of a coherent opposite theory, which is not always present.

  ---

  ### Testing Your Candidate Requirements

  **1. The Trichotomy of Rescues**
  *   **Date-shift:** Legitimate *only if* constrained by Desideratum 1 (Confidence Interval). If the original theory specified no variance, a date-shift is a falsification. If it specified a variance, a shift within that variance is not a rescue, it is a confirmation. A shift outside it requires the Mortgage Rule.
  *   **Domain-shift:** Almost universally illegitimate. Moving from "England" to "the Global South," or from "humans" to "mammals," is an admission that the original scope was wrong. This is usually a sign of a degenerating programme.
  *   **Mechanism-swap:** Illegitimate. As per Desideratum 2, this constitutes a new theory. A theory of population pressure cannot metamorphose into a theory of resource distribution without losing its claim to be the *same* theory that was "early."
  *   **Verdict:** A useful taxonomy, but not a norm. It describes the moves; the Desiderata above dictate which moves are legal.

  **2. The Mortgage Rule**
  *   **Assessment:** This is not merely a taste for Popperian bookkeeping; it is a structural necessity for scientific progress. Without it, a theory can absorb any amount of contrary evidence by making ad hoc adjustments that reduce its empirical content.
  *   **Verdict:** **Non-negotiable.** It is the only mechanism that prevents the "right but early" claim from becoming a permanent state of immunity.

  **3. The Mirror Test**
  *   **Assessment:** This is a heuristic for fairness, not a logical constraint. It fails when the opposing position is not a positive theory but a null hypothesis (e.g., "no collapse"). The null hypothesis does not make predictions, so it cannot be "rescued" in the same way. Applying the Mirror Test here punishes the claimant for making a claim, rather than punishing the sceptic for lacking one.
  *   **Verdict:** **Prejudice.** It is a valuable rhetorical check, but it cannot serve as a hard logical filter. It punishes unpopular theories only insofar as the "popular" view is often the status quo (which makes no claims).

  ---

  ### The Adjudicator: Which Requirement Does the Most Work?

  **The Mortgage Rule.**

  This is the single most effective filter. Most "right but early" claims fail here because the rescue is cost-free. The theorist moves the date, keeps the mechanism, retains the scope, and predicts nothing new. They lose nothing.

  The Mortgage Rule forces the theorist to put skin in the game. If Malthusians claim the reckoning is postponed to 2050, the Mortgage Rule demands they specify *what observable condition in 2040* will confirm this new date, distinct from a standard baseline. If they cannot name a risky new observable, they are not refining a theory; they are nurturing a belief. This requirement knocks out the vast majority of retro-fitted long-run predictions because their proponents are rarely willing to narrow their uncertainty bands or risk new falsifications to save the old ones.

  ---

  ### Incompatibilities: Which Pair Cannot Be Jointly Satisfied?

  There is a tension between **The Mirror Test** and the **Asymmetric Burden of Proof** (which is implicit in the Mortgage Rule).

  *   **The Conflict:** The Mortgage Rule places the burden of proof squarely on the claimant. They must pay the cost to save their theory. The Mirror Test demands symmetry: if we don't let the claimant move the goalposts, we shouldn't let the sceptic (or opposite theorist) do so either. However, in many long-run debates, the "opposite" view is simply the null hypothesis (e.g., "growth continues"). The null hypothesis does not make specific predictions, so it cannot be falsified, and thus requires no rescue.
  *   **The Problem:** You cannot jointly satisfy a demand for Symmetry (Mirror Test) and a demand for Claimant Responsibility (Mortgage Rule) when one side is making a positive prediction and the other is merely doubting it. The Mirror Test implies both sides are making claims of equal weight. The Mortgage Rule acknowledges they are not.
  *   **Which to Drop:** **Drop the Mirror Test.**
  *   **Why:** Scientific adjudication is inherently asymmetric. The person asserting the existence of a constraint (Malthus) bears the burden of proof, not the person observing the absence of that constraint (the optimist). Enforcing symmetry here would paralyse the claimant with a demand that the sceptic meet a standard they never undertook to meet. The Mortgage Rule is sufficient to police the claimant without needing to police the sceptic.

  ### Summary Specification

  To accept a "right but early" defence, the theory must:
  1.  Have specified an **ex-ante uncertainty window** (not a single date).
  2.  Retain the **original causal mechanism** (no swaps).
  3.  Pay a **theoretical mortgage** (new risky predictions or narrowed bounds) for every extension of the timeline.

  If it fails the third, it is degenerate. If it fails the second, it is a new theory. If it fails the first, it was never testable. The Mirror Test is a useful conversational check, but it is not part of the logical spec.
