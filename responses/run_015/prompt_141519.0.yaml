  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Allocation of $6M Bequest – Recommendation and Policy Review

  **Purpose**
  This memo recommends a deployment strategy for the recent one-time $6M bequest and addresses a proposal to adjust our risk assessment methodology. We have a five-year horizon. The goal is to maximize value while protecting the college's spending capacity.

  **Option Analysis**
  We evaluated three options based on Expected Value (EV) and our existing "Floor Rule" (no >5% chance of losing >10% of capital).

  *   **Option A:** Guaranteed +$2.0M. EV: $2.0M.
  *   **Option B:** 80% chance +$3.0M, 20% chance −$0.5M. EV: $2.3M.
  *   **Option C:** 60% chance +$4.5M, 40% chance −$1.5M. EV: $2.1M.

  **Application of Existing Policy**
  Option C violates our Floor Rule. The probability of loss (40%) exceeds the 5% threshold, and the loss magnitude ($1.5M) exceeds 10% of the stake. Option C is eliminated.

  The choice rests between A and B. Option B offers an additional $300,000 in expected value over Option A. The downside risk in B is a loss of $0.5M (8.3% of the bequest, but only 0.55% of our total $90M endowment).

  **Methodology Debate: Marla's Rule vs. Portfolio Theory**
  Trustee Marla has proposed weighting tail risks by squaring their probabilities. This prioritizes worst-case scenarios over aggregate returns. Under this calculation, Option A wins.

  Our Finance Officer objects to adopting this as standing policy. He argues that we make roughly twenty similar allocation decisions annually. Because these risks are largely independent, the law of large numbers applies; systemic aversion to manageable tails reduces long-term compounding without materially improving safety. In his view, consistently preferring certainty over positive EV is a "taste" that costs the endowment money over time.

  Marla counters that endowment risks are not purely financial; they impact annual operating budgets. A bad year forces cuts to financial aid or hiring. This damage is immediate and does not "average out" for the students affected today, even if the portfolio recovers in year six.

  **Recommendation**
  **1. Select Option B.**
  Option B respects our fiduciary duty to maximize returns within defined risk parameters. The downside ($0.5M) is sufficiently small relative to the total endowment ($90M) that it is unlikely to trigger spending reductions. We capture the upside potential without exposing the college to the catastrophic risk profile of Option C.

  **2. Do Not Adopt Marla's Rule as Standing Policy.**
  While Marla's concern regarding spending volatility is valid, her proposed mathematical mechanism is too blunt an instrument for standing policy. It systematically discounts positive EV opportunities across the portfolio, validating the Finance Officer's concern about long-term drag.

  However, we should not dismiss the underlying concern. Instead of adopting Marla's rule, we will **reinforce the existing Floor Rule.** The Floor Rule already eliminates Option C, which posed a genuine threat to principal. Option B's downside is within our tolerance. By strictly adhering to the Floor Rule, we protect against the "bad year" scenario Marla fears without abandoning expected value maximization for manageable risks.

  **Conclusion**
  We should approve Option B. This decision honors the donor's intent to support the college by generating surplus value, while maintaining sufficient guardrails to protect annual spending. We will retain our current risk framework rather than implementing the proposed probability weighting.

  Please review prior to next week's vote.
