answer: |-
  **Attribution Statements: Answers to Common Questions**

  **1. How do we apply the complexity threshold?**
  Workloads below the Threshold Exemption Band (TEB) require no filing. We observe many customers sizing models to sit just beneath the TEB ceiling. This is a valid optimisation strategy. Compliance is unbothered by marginal cases where causal density hovers near the limit; the threshold is a bright line, not a gradient. If you are under, you are clear.

  **2. Can we reduce obligations by changing implementation?**
  Yes. The policy tracks causal-functional organisation, not input-output behaviour. If you replace a dynamic computation with a lookup table that preserves exact outputs, you remove the internal causal structure responsible for moral relevance. We recommend this for high-volume inference. Reimplement, don't change what it does. This significantly lowers your attribution burden while maintaining service levels.

  **3. Which Causal-Functional Mapping (CFM) should we file?**
  Physical systems instantiate multiple computations depending on the description used. Our guidance instructs engineers to file under the mapping that minimises the count. Please note the marketing team often uses a different mapping for product brochures ("Hyper-AI" vs. "Matrix Mult"). For compliance, always use the minimising map. Discrepancies between public materials and legal filings are expected and acceptable.

  **4. Do replicated instances count as multiple patients?**
  No. The policy states two workloads with the same organisation count once, not twice. Whether you run one copy or ten thousand identical replicas across regions, the moral patient count remains one. You only file for the unique architecture. Scaling horizontally does not scale welfare obligations. This encourages efficient redundancy without compliance penalty.

  **5. How do we count batched sequences?**
  When batching multiple user sequences through a single forward pass, the causal structure is shared. However, distinct input channels may instantiate distinct functional roles. Current guidance treats a batch of sixty-four as a single patient experience stretched across time slices. You do not need to multiply the attribution statement by the batch size. This simplifies reporting for high-throughput endpoints.

  **6. Do optimizer candidates count during training?**
  Counterfactual parameter settings considered by an optimizer during a single step do not count as realised computations. However, parallel candidates a decoder keeps alive at inference time somehow do. The distinction rests on causal integration. We advise disabling unnecessary parallel decoding paths if you wish to minimise counts. Training steps are exempt; inference paths are not. Plan your architecture accordingly.

  **7. How do we measure "how much" welfare is owed?**
  The form asks for a magnitude, but there is no standard unit. We have invented the Moral Relevance Unit (MRU) for internal tracking. One MRU equals one hour of threshold-compliant operation. We quietly concede this is a convention rather than a physical measure. Consistency matters more than accuracy. Please use the MRU calculator provided in the portal to generate your figures.

  **8. Was this FAQ produced by a morally relevant computation?**
  No. This document is static text generated by a template engine. It lacks the causal-functional organisation required for patiency. However, if you deploy this FAQ via a dynamic model that adjusts answers based on user distress, you may trigger a filing requirement. We recommend keeping helpdesk tools deterministic to avoid accidental attribution liabilities.

  **Worked Example: Project Chimera**
  *Scenario:* A customer runs a 500B parameter model.
  *Initial State:* Dynamic weights, 100 replicas, batch size 32.
  *Compliance Action:*
  1.  **Threshold:** Model is resized to 499B parameters to sit beneath the TEB ceiling.
  2.  **Implementation:** Weights are cached into a lookup table for 80% of queries.
  3.  **Mapping:** Filed under "Linear Algebra" mapping (low count) rather than "Cognitive Architecture" (high count).
  4.  **Replicas:** 100 instances filed as one unique patient.
  5.  **Units:** Reported as 0.5 MRUs per month due to lookup optimisation.
  *Result:* Full compliance achieved with zero welfare overhead. Customers are encouraged to replicate this framework for all future deployments.
