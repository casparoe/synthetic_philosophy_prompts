answer: |-
  **MEMORANDUM**

  **TO:** Appeals Panel, Digital Atlas of Mass Atrocities (DAMA)
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Taxonomy Recommendation: Indonesia 1965-66 Entry (Structural-Annihilation Tagging)

  **Purpose**
  This memo provides a recommendation regarding the research group's submission for the 1965-66 Indonesia killings. The submitters propose a dual-tag classification: **political-democide** (for the mass killing of alleged communists) and **structural-genocide** (for the erasure of Chinese-Indonesian cultural institutions), while explicitly excluding **direct-genocide**.

  The Panel is currently divided between those who view this dual-tagging as necessary precision and those who view it as conceptual inflation that dilutes the term "genocide."

  **Analysis of the Tension**
  Our charter mandates a balance: we must operationalize Raphael Lemkin's broader conception of genocide (which included cultural and social destruction) without inflating the term to the point of losing analytical utility or appearing to engage in political advocacy.

  1.  **The Inflation Worry:** The concern that this is a "backdoor" genocide label is valid. If we apply "genocide" tags to events that do not meet the UN Convention's intent requirement (destruction of a national, ethnical, racial, or religious group *as such*), we risk confusing users who rely on DAMA for legal-historical clarity. Tagging political purges under a genocide umbrella, even a "structural" one, could inadvertently equate regime security violence with identity-based eradication.
  2.  **The Lemkinian Obligation:** However, rejecting the *structural-genocide* tag ignores the specific victimization of Chinese-Indonesians. The historical record indicates that while the primary driver was anti-communist (achieved identity), ethnic markers were used as selection criteria, and Chinese-Indonesian cultural infrastructure was systematically targeted. To omit this is to sanitize the event of its ethnic dimension, failing Lemkin's original insight that genocide is a coordinated plan to dismantle the essential foundations of a group's life, not just its biological members.

  **Recommendation: Adopt with Conditions**
  I recommend **adopting the dual-tag classification**, but strictly conditioned on enhanced metadata transparency. We cannot treat "structural-genocide" as synonymous with the legal crime of genocide, nor can we treat it as merely a synonym for "discrimination."

  To resolve the tension between Lemkinian breadth and legal precision, we must distinguish the *logics of violence* in the user interface. The **political-democide** tag captures the mass killing logic (regime security). The **structural-genocide** tag captures the cultural erasure logic (identity destruction). Conflating them into a single tag obscures the mechanism; separating them without explanation invites inflation.

  **Implementation Conditions**
  If the Panel approves the dual-tag, the following conditions must be met before publication:

  1.  **Metadata Disclaimer:** The entry must include a visible taxonomy note explaining that "structural-genocide" in DAMA refers to Lemkinian cultural/social erasure and does not constitute a legal finding under the 1948 UN Convention.
  2.  **Specificity Requirement:** The tag must be linked to specific data points (e.g., closure of Chinese schools, bans on language, confiscation of property) rather than general violence. It cannot be applied based solely on the presence of ethnic victims during a political purge; there must be evidence of targeted institutional destruction.
  3.  **Review Clause:** This taxonomy decision will be flagged for review by the Standards Committee in 12 months to assess if the dual-tag has caused user confusion or data misinterpretation in downstream projects.

  **Proposed Timeline**
  *   **Oct 26 (Thursday):** Panel circulation of this memo.
  *   **Nov 2 (Meeting):** Vote on recommendation.
  *   **Nov 9:** If approved, Research Group submits revised metadata with specific institutional destruction evidence.
  *   **Nov 30:** DAMA technical team implements taxonomy disclaimer pop-ups for "structural-genocide" tags.
  *   **Dec 1:** Entry goes live.

  **Bottom Line**
  We should approve the dual-tag **only if** we treat "structural-genocide" as a descriptive sociological category distinct from legal genocide. This honors Lemkin's focus on cultural destruction without misrepresenting the legal status of the event or diluting the term for political ends. It allows us to record the specific erasure of Chinese-Indonesian life without conflating it with the broader political purging of communists.

  **Action Required:** Vote to Approve with Conditions, Reject, or Table at next week's session.
