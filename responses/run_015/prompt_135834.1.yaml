      *   **Rationale:** Primary selection was political (achieved identity: alleged communists), but the campaign destroyed Chinese-Indonesian cultural institutions and used ethnic markers. Fits Lemkin's broader cultural/social conception but not UN Convention's narrower physical/biological clause.
      *   **Charter Constraints:** Honor Lemkin's broader idea vs. avoid inflating the term for political advocacy.
