answer: |-
  Reject the inference from 3 to 4; the argument equivocates between external bureaucratic commands and constitutive normative practices.

  The breakdown occurs at step 4. You have successfully shown that *heteronomous* obedience (the functionary) lacks moral worth because the rule replaces rather than supports moral reasoning. However, you illegitimately generalize this to *all* rule-following. The judge and the promiser are not merely obeying external commands; they are sustaining constitutive norms that make the moral action possible. Without the statute, there is no legal justice to administer; without the practice of promising, there is no obligation to keep. The Deputy Test (D) functions as a valid filter for "blind obedience" cases but fails as a universal metric because it demands agents act independently of rules that *define* the good they are pursuing.

  By rejecting 3→4, you avoid the false dilemma between "conscience vs. rules." The functionary's compliance is worthless because the rule isolates them from the moral reality of the victims (the "banality"). The judge's compliance is worthy because the rule connects them to the moral reality of justice (the "integrity"). The flaw is treating "rule" as a univocal term rather than distinguishing between rules as *shields* (functionary) and rules as *structures* (judge).

  The price of this diagnosis is moderate. You lose the universal claim (Rule-Independence), which means you cannot claim rules *never* generate worth. However, you retain the core condemnation of the functionary: their specific type of rule-following (abdication to authority) still scores zero on a restricted Deputy Test. You do not have to concede the whole paper to the German interlocutor; you only concede that *Ordnung* has value when it serves a just telos, not when it substitutes for one.

