answer: |-
  There is absolutely a name for this, and you have stumbled onto one of the most persistent problems in ethical philosophy. The concept is called **Moral Luck**.

  It sounds like a contradiction in terms. We usually assume that morality is about what we control—our intentions, our efforts, our choices. If something is truly "moral," it should depend on our agency. But "luck" is by definition what we *don't* control. When those two collide, you get moral luck.

  In your specific case, you are dealing with what philosophers call **resultant luck**. This is when the moral judgment of your action depends entirely on how the events turned out, rather than on what you actually did or intended.

  Here is the breakdown of the tension you are feeling:

  **1. The Control Principle**
  Most of our ethical intuition is built on the idea that you are only responsible for what you can control. In both experiments, your control was identical. You were equally negligent. You skipped the same calibration steps. You used the same sloppy technique. By the metric of control, your moral standing should be identical in both cases. You should feel the same about both batches.

  **2. The Outcome Bias**
  However, human beings (and legal systems, and patent offices) judge based on outcomes.
  *   **Experiment A (Failure):** You were negligent, nothing happened. You are essentially invisible.
  *   **Experiment B (Success):** You were negligent, but you got rich and credited.

  The world treats you differently based on the result, not the conduct. Your guilt comes from recognizing that the reward (the patent, the cash, the praise) was disconnected from the virtue of your work (which was actually careless). You feel like an impostor because the external validation says "great scientist," but your internal knowledge says "lucky negligent scientist."

  **Is it fair?**
  Philosophically, the consensus is generally **no, it is not fair.**

  It violates the Control Principle. If two drivers run a red light while drunk, and one hits a pedestrian while the other arrives home safely, we jail the first and let the second go. But their moral culpability—the decision to drink and drive—was identical. The difference was purely luck (was a pedestrian there or not?).

  In your case, the universe rewarded negligence because the random variables aligned in your favor. It is unfair because it breaks the link between *merit* and *reward*. You feel worse about the successful batch because that success highlights the injustice. If both had failed, your negligence would have remained private. Because one succeeded, your negligence was accidentally validated by the outcome.

  **Why you feel guilty**
  Your guilt is actually a sign of ethical integrity. You are refusing to accept the outcome as a justification for the method. You are recognizing that the "good" result didn't erase the "bad" process.

  So, to answer you directly: Yes, philosophy has a name for this (Moral Luck), and no, it is not considered "fair" in a strict ethical sense, even though it is how the world practically operates. You are judging yourself based on your control (which was sloppy), while the world judged you based on the outcome (which was profitable). That gap is where your guilt lives.
