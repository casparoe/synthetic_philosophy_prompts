  Hey, I've been getting into philosophy since I retired from polymer research—did that for about 30 yrs and now I'm trying to figure out ethics without just googling everything. There's this thing I can't stop thinking about. Back in '08 I ran two experiments with the exact same sloppy technique, didn't calibrate the spectrometer either time. One batch just flopped, nobody noticed. The other, pure fluke, showed an anomolous peak that led to a patent and made me some cash. Now I feel guilty about the successful one, like I 'got away with' being careles because the outcome was good, even though I was just as negligant both times. Is it fair that I feel worse about the batch that worked? Or does philosophy have a name for when luck changes how we judge an action? I'm not asking for books or citations, just want to understand the idea.
