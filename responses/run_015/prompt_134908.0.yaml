answer: |-
  This is a genuine methodological dispute caused by attempting to derive probabilistic certainty from uncalibrated tools within a closed dataset, masked by conflating negative filtering with positive verification.

  You are correct that the participants are talking past each other, but the root is not merely verbal; it is epistemological. The criteria function as heuristics, not algorithms. When scholars treat the criterion of dissimilarity as a positive proof rather than a negative filter, they commit a base-rate fallacy. Without a control corpus of known Jesus sayings and known early church inventions from the same period, you cannot calculate the false-positive rate of any criterion. You know what the early church *might* have invented, but you do not know what they *did* invent versus what they preserved. Consequently, the "circularity" you identify is fatal only if the goal is certainty. If the goal is plausible reconstruction, the circularity is hermeneutical inevitability, not logical fallacy. The stall persists because one side demands a scientific verification that the data structure cannot support, while the other side defends a historical intuition that cannot be formalized. The "background picture" problem is real: we reconstruct Palestinian Judaism partly from the Gospels, then use that reconstruction to validate the Gospels. This is not unique to Jesus studies—all history involves some hermeneutical circle—but it is acute here because the subject is a single individual within a movement that immediately mythologized him. The lack of a control corpus means the criteria cannot be calibrated for sensitivity or specificity, rendering them useless for establishing probability, though still useful for mapping tensions in the text.

  Progress requires abandoning the binary "authentic/inauthentic" framework entirely. You cannot calibrate the tools, so stop trying to use them as scales. Instead, adopt an "inference to the best explanation" model. Ask not "Did Jesus say this?" but "Does positing Jesus saying this explain the existence of this tradition better than positing the early church created it?" This shifts the burden from proving authenticity to explaining variance. Additionally, integrate social memory theory. Rather than atomizing traditions into pericopes tested by criteria, analyze the flow of tradition as a whole. How does this saying function in the memory of the community? This bypasses the need for a control corpus by focusing on the mechanism of transmission rather than the static content. If your group wants to move, ban the word "authentic." Replace it with "historically plausible within a specific model of transmission." If they cannot agree on the model of transmission, no amount of criteria tweaking will help. You might also look to comparative ancient biography: calibrate your expectations not against a non-existent Jesus control group, but against how other ancient movements memorialized their founders. If the patterns of invention in the Jesus tradition match the patterns of invention in the Alexander or Apollonius traditions, you gain a proxy control for "what a founder legend looks like," allowing you to measure deviation without needing the actual voice of the founder.
