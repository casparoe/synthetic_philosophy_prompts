answer: |-
  # The Subadditive Pool: A Workplace Dutch Book

  ### The Scenario

  Alex is a meticulous project manager at a mid-sized logistics firm. Known for their integrity, Alex is appointed the administrator of the "Q3 Innovation Fund," an internal prediction market where employees buy shares in potential project outcomes to foster engagement. The Fund is small; any deficit at the end of the quarter is deducted from Alex's departmental budget, directly impacting Alex's year-end performance bonus. Effectively, Alex is personally liable for the Fund's solvency.

  The Fund is betting on a single exhaustive event: **Which vendor will win the Q3 contract?** The options are **Vendor A**, **Vendor B**, or **Vendor C**. There are no other possibilities.

  Alex is deeply risk-averse. In their personal finances, Alex avoids volatile stocks and prefers guaranteed returns. However, in their role as Fund Administrator, company policy dictates that share prices must reflect the Administrator's "honest, best-estimate credences" to ensure market efficiency. Risk margins or "vig" are strictly prohibited; prices must equal credences.

  Alex assesses the vendors. The market is murky. Alex feels uncertain about all three.
  *   Credence in Vendor A: **0.30**
  *   Credence in Vendor B: **0.30**
  *   Credence in Vendor C: **0.30**

  Alex notes that these sum to **0.90**, not 1.0. However, Alex reasons that the missing 0.10 represents "unknown unknowns" or ambiguity, a common feeling in their line of work. Adhering to policy, Alex posts the share prices:
  *   **Share A:** Costs \$0.30 (Pays \$1.00 if A wins)
  *   **Share B:** Costs \$0.30 (Pays \$1.00 if B wins)
  *   **Share C:** Costs \$0.30 (Pays \$1.00 if C wins)

  Jordan, a colleague with a background in finance, notices the prices immediately. Jordan knows Alex is risk-averse and would never personally offer these odds. But Jordan also knows the Fund's rules: *The Administrator must honor all buy orders at posted prices.*

  Jordan approaches the Fund window and submits a single order: **"Buy 1 Share of A, 1 Share of B, and 1 Share of C."**

  Alex sees the order. Personally, Alex wants to reject it. Alex knows that selling these shares individually is too risky for their utility function, and selling them together guarantees a loss. However, the Fund's charter binds Alex to the posted prices. Alex processes the transaction.

  Jordan pays \$0.90 total. No matter which vendor wins, the Fund must pay out \$1.00. The Fund (and thus Alex's bonus) loses \$0.10 guaranteed. Alex has been Dutch-booked, not by irrational betting, but by institutional constraint imposed on incoherent credences.

  ***

  ### Technical Analysis

  #### 1. Credences and Posted Odds
  Alex's credences ($C$) and the corresponding market prices ($P$) for a \$1.00 payout are:
  *   $C(A) = 0.30 \rightarrow P(A) = \$0.30$
  *   $C(B) = 0.30 \rightarrow P(B) = \$0.30$
  *   $C(C) = 0.30 \rightarrow P(C) = \$0.30$
  *   **Sum of Credences:** $0.90$ (Violates Additivity/Normalization)

  #### 2. Payoff Table (From Alex/Fund Perspective)
  Alex *sells* the shares. Alex receives the price upfront and pays the payout if the outcome occurs.

  | State of World | Revenue (from Jordan) | Payout (to Jordan) | Net Profit/Loss |
  | :--- | :--- | :--- | :--- |
  | **Vendor A Wins** | \$0.90 | \$1.00 | **-\$0.10** |
  | **Vendor B Wins** | \$0.90 | \$1.00 | **-\$0.10** |
  | **Vendor C Wins** | \$0.90 | \$1.00 | **-\$0.10** |

  #### 3. The Sure Loss
  In every possible state of the world (A, B, or C), the Fund pays out \$1.00 having collected only \$0.90. The loss of **\$0.10** is guaranteed. This is a classic Dutch Book resulting from subadditive probabilities (summing to less than 1).

  #### 4. Fairness and Risk Aversion (Individual Bets)
  Consider the bet on Vendor A alone from Alex's perspective (selling the ticket):
  *   **Probability of Loss:** 0.30 (Alex's credence).
  *   **Magnitude of Loss:** \$0.70 (Keep \$0.30 premium, pay \$1.00).
  *   **Probability of Gain:** 0.70.
  *   **Magnitude of Gain:** \$0.30 (Keep premium).
  *   **Expected Value (EV):** $(0.30 \times -\$0.70) + (0.70 \times \$0.30) = -\$0.21 + \$0.21 = \$0.00$.

  The bet is **fair** in terms of Expected Value based on Alex's own credences. However, Alex is **risk-averse**. In utility terms ($U$), where $U$ is concave:
  $$U(0) > 0.30 \cdot U(-\$0.70) + 0.70 \cdot U(\$0.30)$$
  Alex prefers the status quo (\$0 change) over the gamble. If this were Alex's personal money and Alex had the choice, they would **decline** the bet.

  #### 5. The Bundle as a Sure Loss
  If offered the bundle personally (Sell A, Sell B, Sell C), Alex faces a 100% chance of losing \$0.10.
  *   **Utility:** $U(-\$0.10) < U(0)$.
  A risk-averse agent (or even a risk-neutral one) strictly prefers keeping \$0 to losing \$0.10. Alex would **decline** this package emphatically.

  #### 6. Inability to Decline
  The Dutch Book succeeds not because Alex *wants* to bet, but because Alex's **role as pool-runner commits the pool to the posted prices.** The institutional rule ("Prices must equal credences; all orders must be filled") overrides Alex's personal risk preference. Alex is forced to act as a risk-neutral bookie despite having a risk-averse utility function and incoherent credences.

  ***

  ### Honest Note

  **The Feature Doing the Work**
  The single feature driving this Dutch Book is the **Institutional Commitment Constraint**. In standard Dutch Book arguments, the agent is assumed to be *willing* to accept the bets at the posted prices. Here, the agent is *unwilling* (due to risk aversion) but *compelled* (due to job role). The vulnerability arises because the organization forces the employee to price assets without a risk margin while holding the employee liable for the losses.

  **Removing the Feature**
  If Alex were permitted to add a **risk margin** (a "vig"), the prices would no longer equal the credences. Alex might price the shares at \$0.35 each to compensate for the risk of selling.
  *   New Sum: $0.35 + 0.35 + 0.35 = 1.05$.
  *   Jordan's Cost to buy all three: \$1.05.
  *   Payout: \$1.00.
  *   Result: Jordan loses \$0.05. The Dutch Book disappears. The incoherence of the credences (summing to 0.9) becomes irrelevant because the *prices* (summing to 1.05) protect the book.

  **The Defender's Attack**
  A defender of the standard risk-aversion objection to Dutch Book arguments would attack this case by arguing **it does not prove irrationality of belief.**
  They would state: *"Alex's credences (0.3, 0.3, 0.3) are not the problem. The problem is the organizational policy that forces an agent to bet at fair odds without a risk premium. A rational, risk-averse agent with incoherent credences would simply refuse to run the pool under those rules. The Dutch Book demonstrates that the **policy** is suicidal, not that Alex's **mind** is irrational. Since Alex personally rejects the bets, their betting behavior is consistent with their utility function; the loss is caused by external coercion, not internal inconsistency."*

  In short, this thought experiment shows that Dutch Books can exploit **institutional vulnerabilities** in risk-averse agents, but it does not necessarily refute the claim that risk aversion protects *personal* rationality from Dutch Book arguments.
