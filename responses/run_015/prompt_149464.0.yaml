answer: |-
  Brexit kills the "mass-scale doctrinal paradox" extension because it reveals judgment aggregation theory requires deliberative protocols absent in referendums.

  In the classic model, jurors vote on interconnected premises separately. In Brexit, the 33 million voters were "jurors," but the ballot offered only the conclusion (Leave/Remain), not the premises (immigration control, regulatory sovereignty, economic safety). Because premises were never voted on, we cannot determine if premise-based aggregation yields Remain; the data simply does not exist. We observe inconsistent individual rationales, not a collective judgment set violating logic.

  The "mass-scale doctrinal paradox" assumes voters share a logical framework. Brexit shows they did not; Leave voters prioritized sovereignty over economic warnings, while Remain voters prioritized economics. This isn't an aggregation paradox but a clash of value hierarchies. Judgment aggregation theory requires a shared agenda and deliberation to resolve premise disagreements before conclusion voting. Brexit lacked this protocol. Consequently, Brexit doesn't support the mass-scale extension; it highlights that the theory presupposes a deliberative committee structure impossible in a referendum. The theory isn't wrong, but its application here is a category error: you cannot aggregate judgments on premises that were never formally posed.
