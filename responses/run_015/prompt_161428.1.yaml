  Here is an analysis of Dr. Voss's likely position, derived strictly from the casuistry you have provided.

  ### 1. The Verdict: S1, and There Is a Fact of the Matter

  Dr. Voss will rule that the name refers to **S1** (the left-hand fragment designated by the 1994 reviser). She will maintain that there is a **fact of the matter** here, independent of the botanists' confusion or practical needs.

  **The Reason:**
  While your friend argues for the *Madagascar* precedent (usage overrides original intent), the *Aldridge Skull* precedent is the governing analog, reinforced by Voss's self-description regarding scientific convention.

  In the *Aldridge* case, Voss ruled that a label referred to the original skull even though the original was destroyed and all working data came from a plaster replacement. In your botanical case, the 1959 specimen sheet is the "original skull." The fact that it is mixed is an error, but the 1994 designation acts as the institutional clarification of which part of that "skull" anchors the name. The working botanists handling S2 are in the exact position of the researchers measuring the plaster cast in *Aldridge*: they are working with derivatives, not the referent.

  Crucially, Voss describes herself as a causal-historical theorist who permits the **natural and formal sciences to fix reference by convention**. The 1994 reviser's action was not merely a description of usage; it was an exercise of the Botanical Code's conventional power to pin a name to a specific physical element (the lectotype). Voss's *Standard Meter* verdict shows she accepts that conventions can fix reference (the stick fixes "meter"). Her *Twin Earth* verdict shows she accepts that natural kinds have essences independent of usage. In a scientific context, the explicit conventional fix (1994) trumps the drift of community usage (*Madagascar*), because *Madagascar* applies to natural language where no regulatory body exists to correct the shift. Here, the "museum label" (the Code) has been explicitly updated to point to S1.

  ### 2. Extracted Rules and the Madagascar vs. Aldridge Dispute

  Based on her track record, Voss is operating with at least three compatible rules.

  **Rule A: The Causal-Institutional Anchor**
  *Source:* *Aldridge Skull*, *Gödel–Schmidt*, *Standard Meter*.
  *Principle:* Reference is fixed by an initial baptism or regulatory stipulation linking a term to an object or sample. This link persists even if the object is lost, or if the descriptive information associated with the term turns out to be false or applicable to something else.
  *Prediction for Botany:* The 1959 baptism + 1994 Code designation anchors the name to S1. The fact that S2 fits the "working description" is irrelevant (cf. *Gödel*). The fact that S2 is what people handle is irrelevant (cf. *Aldridge*).
  *Outcome:* **S1.**

  **Rule B: The Community Shift Exception**
  *Source:* *Madagascar*.
  *Principle:* If a linguistic community systematically abandons the original referent for a new one, and there is no institutional mechanism to correct this, reference shifts to the new referent.
  *Prediction for Botany:* The community uses the name for S2. If the Code were silent, reference might shift to S2.
  *Outcome:* **S2** (but only if Rule A is inactive).

  **Rule C: The Natural Kind Rigidity**
  *Source:* *Hesperus–Phosphorus*, *Twin Earth*.
  *Principle:* Names of natural kinds (water, species) designate the kind essentially. Reference failure occurs if the kind does not exist (*Ripper/Jonah*), but if it does, the name picks out the kind rigidly, not the description.
  *Prediction for Botany:* S1 and S2 are distinct kinds. The name cannot refer to both (no homonymy) unless the convention creates two names. It must pick one.
  *Outcome:* **Determines Modality, not Referent.**

  **Adjudicating the Dispute:**
  You are right; the **Aldridge Skull** is the closer analog.
  *   **What turns on the difference:** *Madagascar* governs cases of *unregulated drift* in natural language. The travelers meant the mainland; the community meant the island; there was no "International Geographical Union" to issue a ruling. In the Botanical case, there *is* a regulatory body (the Code), and they *did* issue a ruling (1994).
  *   Voss's allowance for "sciences... to fix reference by convention" is the tie-breaker. She treats scientific nomenclature as a hybrid of causal history (*Aldridge*) and stipulation (*Standard Meter*). The 1994 designation is a stipulation that clarifies the causal history. To rule for S2 would be to treat scientific naming like folk geography (*Madagascar*), which contradicts her explicit commitment to scientific convention.

  ### 3. Modal and Epistemic Classification

  Supposing (counter to my prediction above) that Voss rules the name refers to **S2** (perhaps prioritizing *Madagascar* over *Aldridge* due to the extinction of S1), here is how she will classify the modal status of the sentence: *"The species [Name] has S2's distinctive seed-coat type."*

  **Verdict:** **Necessary A Posteriori.**

  **Reasoning:**
  1.  **Why not A Priori?** Voss's *Standard Meter* verdict allows for the *fixing* of reference to be a priori (by convention), but she distinguishes this from the *properties* of the referent. In *Twin Earth*, she ruled that the identity of water is necessary a posteriori. She treats biological species as natural kinds analogous to chemical substances. Even if the *name* is attached to S2 by convention, the fact that S2 *has* that seed-coat type is an empirical discovery about the world, not a truth of language.
  2.  **Why not Contingent?** Voss is a rigid designator theorist (*Hesperus*, *Twin Earth*). Once the name refers to S2, it refers to S2 in all possible worlds where S2 exists. If the seed-coat type is constitutive of the species S2 (as chemical structure is for water), then attributing that trait to the species is a necessary truth.
  3.  **Which Move She Will Make:** She will not say the term is non-rigid. Her *Twin Earth* verdict commits her to the rigidity of natural kind terms. She will not say the trait is non-essential. Her *Gödel* verdict shows she separates reference from description; she does not think the name *means* "the thing with the seed coat." However, once reference is secured to the kind S2, the essential properties of S2 attach necessarily.
      *   *Nuance:* If she treats the 1994 convention as strictly *Stipulative* (like the Meter Stick), she might call "The Type is S2" a **Contingent A Priori** truth (fixed by convention, but S2 exists contingently). However, for the *seed-coat attribution*, she will revert to the *Twin Earth* model: discovering the nature of the kind is **Necessary A Posteriori**.

  **If she rules S1 (my prediction):** The classification remains **Necessary A Posteriori**. The name rigidly designates S1. S1's properties are essential to S1. We discover them a posteriori. The fact that botanists *believe* the name applies to S2 is a false belief (cf. *Gödel–Schmidt*), not a modal shift.

  ### 4. A Variant Case to Separate the Rules

  To force Voss to choose between Rule A (*Aldridge*/Convention) and Rule B (*Madagascar*/Usage), you should present a variant where the **Scientific Convention is silent**.

  **The Variant:**
  > "Suppose the 1994 reviser *never* designated the left fragment. The Botanical Code simply states that the name applies to the 'original specimen,' but offers no mechanism for mixed specimens. The left fragment (S1) sits in the archive, untouched. The right fragment (S2) is the only thing living, illustrated, or studied. No official vote is ever taken to conserve the name for S2. The community simply assumes the name applies to S2."

  **Predictions:**
  *   **Rule A (Aldridge/Science Convention):** Without the 1994 stipulation, the "anchor" is the 1959 sheet. But the sheet is metaphysically incoherent as a type for a *single* species (it is two species). Voss's *Ripper/Jonah* verdict suggests that if the associated story/object is fundamentally flawed or fictional, reference **fails**. She might rule the name refers to **neither** (or the sheet itself as a mere particular, not a species), rendering all biological claims about the "species" false or truth-valueless. She cannot use Convention to save it here.
  *   **Rule B (Madagascar/Usage):** The community has systematically shifted usage to S2. There is no regulatory intervention to stop it. Reference **shifts to S2**.

  **Why this works:**
  This variant removes the "Science fixes by convention" trump card. It forces Voss to decide whether the *Causal-Historical Anchor* (the mixed sheet) is strong enough to sustain reference despite being biologically incoherent (*Aldridge*/*Ripper*), or whether *Community Uptake* (*Madagascar*) can sanitize a botched baptism.
  *   If she says **S2**, she admits *Madagascar* is the dominant rule, and you should have bet on your friend.
  *   If she says **Reference Fails/Neither**, she admits *Aldridge*/*Ripper* is dominant, and the 1994 Convention was the only thing saving S1 in the original case.

  **Recommendation:** In your paper, argue for the **S1** verdict based on the *Aldridge* + *Convention* synthesis, but acknowledge that without the 1994 designation, her commitment to *Madagascar* might force a shift to S2. This shows you understand the tension in her casuistry without attributing a theory she hasn't endorsed.
