prompt: |-
  hey — I need a spec, not another opinion piece. I'm trying to write the decision rule for an agent that gets offered one-shot gambles whose expected value doesn't exist (Pasadena-style: toss a fair coin till it lands heads, and if that's the nth toss you win 2^n/n when n is odd and lose it when n is even), and every rule I end up with is really just one intuition with a formula stapled to it. So: write me the desiderata. What would an account of what such a game is worth have to deliver before I should take it seriously?

  Fixing the purpose so adequacy has something to be relative to: the agent is offered a game once, at a stated price, and has to answer yes or no; sometimes it's allowed to quit partway through; and sometimes it already holds other bets on the same coin flips. I want verdicts out of the theory in those situations, not a shrug and a discussion of what "value" really means.

  Cases I think any list has to handle — add to these, and tell me if any of mine is a fake requirement wearing a tie:

  - St. Petersburg sitting right next to Pasadena. Infinite expectation and undefined expectation are different failure modes, and I don't want a theory that flattens both into "EV is broken here".
  - The capped versions. Truncate Pasadena at N tosses with nothing paid if no heads shows up by then, and its expectation is the Nth partial sum of the alternating harmonic series, so those truncated values close in on ln 2 from both sides. Does that force "value = limit of the truncations" on me? Note the same move hands St. Pete an infinite value, so whatever I use to refuse St. Pete is doing separate work.
  - Shifting and bundling. If I'll pay x for G I should pay x+1 for G-with-a-dollar-added-to-every-payout, and 2x for two independent copies of G. If a theory does hand Pasadena a number, does it keep these? My hunch is that "it's worth ln 2" breaks somewhere on bundling, but I can't turn the hunch into an actual conflict.
  - Scrambled Pasadena: keep the payout amounts and their probabilities exactly as they are, but hang them on scattered sets of coin sequences instead of the tidy "first heads at toss n" sets. Must the value be unchanged? It looks compulsory if value only cares about how probable each payout is — and it stops looking compulsory once the agent also holds a side bet that pays off when the first heads lands on an even-numbered toss, because then two games with identical payout distributions aren't interchangeable to it at all. So is "value supervenes on the distribution" a genuine desideratum or just the prejudice of the probability-first camp?
  - The quittable version. Conditional on k tails so far, continuing looks worth about 2^k times the tail of the alternating harmonic series — on the order of 2^k/2k, sign flipping with every extra tail, unless I've botched that. So ex ante the game is worth roughly $0.69 to an agent who's locked in, while at every node the local verdict is enormous and switches sign. What am I allowed to demand here: dynamic consistency, agreement with the locked-in value when quitting isn't on the table, "the option to quit can only help"? I suspect at most two of those live together.
  - Money versus utility. Utility bounded above defuses St. Pete; what defuses Pasadena is utility bounded *below*, which is a much stranger thing to sign up for when the losses in these games are unbounded. Is "defined values for every game, at the price of a floor as well as a ceiling" a requirement, or a bullet I'm permitted to spit out?

  Then: order the requirements, mark which are non-negotiable and which are just what one camp happens to like, and — the part I actually want — find me the subsets that can't all be satisfied at once, and say which single requirement kills off the most candidates. A short scorecard at the end is fine (truncate-and-take-the-limit, "undefined means any price goes", bounded utility, nonstandard/hyperreal expectations, dominance-ish or long-run rules), but keep the weight on the criteria and their cases; I'll argue with the contenders myself.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Goal:** Write a *specification* (desiderata/requirements) for a decision rule handling one-shot gambles with undefined expected value (specifically Pasadena-style games).
      *   **Tone:** Technical, precise, no fluff, no opinion pieces. "Write me the desiderata."
      *   **Context:** An agent faces a one-off gamble at a stated price (Yes/No decision). Variations include: quitting mid-game, holding correlated side bets, truncated versions.
      *   **User's Proposed Cases:** St. Petersburg vs. Pasadena distinction, Truncation limits, Linearity/Shifting/Bundling, Distribution Supervenience (Scrambled Pasadena), Dynamic Consistency/Quittability, Bounded Utility.
      *   **Deliverables:**
          1.  Refine/Validate the user's proposed cases (identify "fake requirements").
          2.  Add missing critical cases.
          3.  Order requirements (Non-negotiable vs. Contingent).
          4.  Identify Incompatibility Theorems (which subsets clash).
          5.  Identify the "Killer Constraint" (which requirement eliminates the most theories).
          6.  Scorecard of existing approaches against these specs.

  2.  **Deconstruct the User's Proposed Cases:**

      *   *St. Pete vs. Pasadena:* Crucial. St. Pete has $E[X] = +\infty$. Pasadena has $E[X]$ undefined (Riemann rearrangement territory). A theory must distinguish $+\infty$ from undefined. *Verdict: Keep, Non-negotiable.*
      *   *Truncation Limits:* Pasadena partial sums converge to $\ln 2$. St. Pete partial sums diverge to $+\infty$. If a theory says "Value = Limit of Truncations," it gives $\ln 2$ to Pasadena and $\infty$ to St. Pete. This seems consistent *unless* we demand finite values for everything. *Verdict: Keep, but note it implies a specific valuation method (Weak Expectation).*
      *   *Shifting and Bundling (Linearity):* $V(G+c) = V(G) + c$, $V(G_1 + G_2) = V(G_1) + V(G_2)$. This is standard Expected Utility Theory (EUT) stuff. *Problem:* Pasadena games often break linearity if values are assigned via principal values or weak expectations. *Verdict: Keep as a stress test, likely a point of failure for many theories.*
      *   *Scrambled Pasadena (Distribution Supervenience):* Does value depend *only* on the probability distribution of outcomes, or on the state-space mapping? If the agent has side bets correlated with the *states* (coin toss indices), distribution supervenience fails. *Verdict: This is a "fake requirement" in the general case. It only holds if the agent has no other correlated exposures. Must be contextualized.*
      *   *Quittable Version (Dynamic Consistency):* Ex-ante value vs. Conditional value. In Pasadena, the conditional expected value at step $k$ oscillates wildly. If you can quit, you might exercise options differently than ex-ante planning suggests. *Verdict: Crucial. Dynamic Consistency is a major battleground.*
      *   *Money vs. Utility (Boundedness):* Bounded utility solves St. Pete. Does it solve Pasadena? Pasadena has positive and negative unbounded utility. Bounded utility makes the sum absolutely convergent. *Verdict: This is a solution, not a desideratum. The desideratum is "Handle unbounded utility payoffs."*

  3.  **Identify Missing/Refined Cases:**

      *   *Dominance:* If Game A pays more than Game B in every state, $V(A) > V(B)$. Pasadena variants can violate this if not careful with summation order.
      *   *State-Dependence:* The user hinted at this with "Scrambled," but it needs to be explicit. If the agent cares about *when* heads occurs (e.g., "I need money on Tuesday"), the index matters.
      *   *Money Pump / Dutch Book:* If the valuation rule allows a cycle of trades, it's dead.
      *   *The "Any Price" Problem:* If value is undefined, does that mean "indifferent at all prices"? That leads to money pumps.

  4.  **Structure the Specification:**

      *   **Section 1: The Domain.** Define the objects (Gambles, States, Prices).
      *   **Section 2: The Desiderata (The List).** Group them by category (Consistency, Algebra, Dynamics).
      *   **Section 3: The Impossibility Results.** Where do they clash? (EUT axioms vs. Undefined EV).
      *   **Section 4: The Scorecard.** Evaluate current contenders.

  5.  **Drafting the Content - Step-by-Step:**

      *   *Refining "Scrambled Pasadena":* The user is right to be suspicious. If the agent has *no* other bets, distribution supervenience is standard. If they *do*, it's not. I need to codify this as "Context-Independence" vs. "Portfolio Sensitivity."
      *   *Refining "Truncation":* This is essentially the "Weak Expectation" (Colin Howson's approach). It's a specific candidate, not necessarily a universal desideratum. I should frame the desideratum as "Continuity with Finite Approximations."
      *   *Refining "Dynamic Consistency":* This is the big one. The Pasadena game has the property that $E[X | \text{no heads in first } k] $ does not converge nicely. If the agent plans to play but changes their mind at step $k$, that's a failure.
      *   *The "Killer":* Usually, it's Linearity + Dominance + Defined Value for all gambles. Or Dynamic Consistency + Standard Probability.

  6.  **Developing the Impossibility Theorems:**

      *   *Theorem 1 (Linearity vs. Undefined EV):* You can't have full linearity ($V(A+B) = V(A)+V(B)$) and assign finite values to Pasadena games while respecting dominance, because you can construct a combination that creates a sure loss or violates the rearrangement theorem.
      *   *Theorem 2 (Dynamic Consistency):* If ex-ante value is $\ln 2$, but conditional value at node $k$ is huge/negative, a rational agent who can quit will deviate from the ex-ante plan.
      *   *Theorem 3 (Distribution Supervenience):* If you value based *only* on distributions, you ignore correlation with background risk. But if you value based on states, you violate "Description Invariance."

  7.  **Finalizing the Scorecard:**

      *   *Standard EUT:* Fails (Undefined).
      *   *Bounded Utility:* Passes (by fiat), but requires rejecting unbounded utility functions (high cost).
      *   *Weak Expectation (Howson/Easwaran):* Passes Truncation, Fails Linearity/Dominance in some combos.
      *   *Hyperreals/Non-standard:* Passes Algebra, Fails Uniqueness/Decision relevance (which hyperreal?).
      *   *Decision-Theoretic (No Value):* "Undefined = No Verdict." Passes consistency, Fails the user's requirement for a Yes/No answer.

  8.  **Review against Constraints:**
      *   "Not another opinion piece." -> Keep tone imperative and analytical.
      *   "Fixing the purpose... agent is offered a game once." -> Focus on one-shot decision rules.
      *   "Order the requirements." -> Tier 1 (Must), Tier 2 (Should), Tier 3 (Nice).
      *   "Find subsets that can't be satisfied." -> Explicitly state the conflicts.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* The user asked about "Scrambled Pasadena." I need to be careful. If the utility function is defined over *outcomes* (money), distribution supervenience holds. If utility is over *states* (e.g., "I prefer money on odd tosses"), it doesn't. I will frame this as "Outcome-Supervenience" and mark it as contingent on the utility model.
      *   *Correction:* On "Quittable." The Pasadena game conditional expectation oscillates. If I can quit, I should quit when the conditional EV is negative. But ex-ante it's positive. This is a direct violation of Dynamic Consistency. I need to highlight this as a specific failure mode.
      *   *Correction:* On "St. Pete vs Pasadena." St. Pete is $+\infty$. Pasadena is undefined. A theory that says "Both are Infinity" fails to distinguish risk profiles. A theory that says "Both are Undefined" is useless for decision making. The spec must demand differentiation.

  10. **Final Polish:** Check the "Killer Constraint." Is it Bounded Utility? No, that's a fix. Is it Linearity? Yes. Linearity + Defined Value for Pasadena is the hardest nut to crack. Actually, **Dynamic Consistency** is probably the deadliest for Pasadena specifically because of the oscillating conditional expectations. I will highlight that.

      *(Self-Correction on the "Killer")*: Actually, the most standard impossibility result in this domain is **Linearity + Dominance + Finite Value for All Gambles**. If you assign a finite value to Pasadena, you can combine it with a bet on the parity of the toss number to create a Dutch Book. I will focus on the **Linearity/Independence** conflict.

      Let's assemble the spec.

      *Structure:*
      1.  Domain Definition.
      2.  Tier 1: Non-Negotiable (Coherence).
      3.  Tier 2: Structural (Algebra/Dynamics).
      4.  Tier 3: Contingent (Model-specific).
      5.  Impossibility Clusters.
      6.  Scorecard.

      *Refining the User's "Fake Requirement":* "Value supervenes on the distribution." This is false if the agent has background risk correlated with the *mechanism* (coin toss index) rather than the *outcome* (money). I will flag this clearly.

      *Refining the "Quittable" case:* This is the "Dynamic Inconsistency" of the Pasadena game. Ex-ante value $\ln 2$. Conditional value at step $n$ grows as $2^n/n$. If you can quit, you never stop (or stop arbitrarily), breaking the ex-ante valuation.

      *Ready to write.*
answer: |-
  # Specification: Decision Rules for Undefined-Expectation Gambles

  **Domain:** One-shot decision problems.
  **Agent:** Confronted with a gamble $G$ at price $p$. Must output $\{\text{Accept}, \text{Reject}\}$.
  **Environment:** May include background portfolio $B$, option to quit mid-sequence, or correlated side bets.
  **Target Class:** Gambles where $\sum p_i u_i$ is not absolutely convergent (specifically Pasadena-type: conditionally convergent or divergent oscillating series).

  ---

  ## 1. Desiderata Hierarchy

  ### Tier 1: Non-Negotiable (Coherence)
  *If a theory violates these, it licenses sure losses or logical contradictions.*

  1.  **Acyclicity (No Money Pumps):** The preference relation induced by the decision rule must not contain cycles. If the rule accepts $A$ over $B$, $B$ over $C$, and $C$ over $A$ (at zero cost), it is rejected.
  2.  **Dominance (Statewise):** If gamble $G_1$ pays $\ge G_2$ in every possible state, and $>$ in at least one, the rule must not prefer $G_2$ over $G_1$ at the same price.
  3.  **Differentiation of Divergence:** The rule must distinguish between:
      *   **St. Petersburg:** Expectation diverges to $+\infty$.
      *   **Pasadena:** Expectation is undefined (oscillates/conditionally convergent).
      *   *Rationale:* Treating both as "Infinity" ignores the risk of ruin in Pasadena. Treating both as "Undefined" ignores the solvability of St. Petersburg under bounded utility.

  ### Tier 2: Structural (Algebra & Dynamics)
  *These are standard rationality constraints. Violations require explicit justification.*

  4.  **Separability (Portfolio Independence):** If the agent holds background bet $B$, the valuation of $G$ should not change unless $G$ is probabilistically correlated with $B$.
      *   *Note:* This tests whether the theory values *outcomes* (money) or *states* (toss indices).
  5.  **Linearity (Scaling & Shifting):**
      *   **Shift:** $V(G + c) = V(G) + c$.
      *   **Scale:** $V(k \cdot G) = k \cdot V(G)$ for $k > 0$.
      *   **Additivity:** $V(G_1 + G_2) = V(G_1) + V(G_2)$ for independent $G_1, G_2$.
  6.  **Dynamic Consistency:** If the agent plans to accept $G$ ex-ante, they must not prefer to reject it at a reachable node within $G$ (given no new information other than reaching the node).
      *   *Specific Test:* The **Quittable Pasadena**. If ex-ante value is finite, but conditional value at node $k$ oscillates with magnitude $2^k$, the agent must have a rule for exercising the quit option that aligns with the ex-ante valuation.
  7.  **Continuity with Finite Approximations:** Let $G_N$ be $G$ truncated at $N$ tosses. If $\lim_{N \to \infty} V(G_N)$ exists, $V(G)$ should typically align with this limit unless there is a specific reason (e.g., dominance violation in the limit).

  ### Tier 3: Contingent (Model-Dependent)
  *These are often treated as axioms but are actually modeling choices.*

  8.  **Distribution Supervenience:** Value depends *only* on the probability distribution of final monetary outcomes, not on the mapping from states to outcomes.
      *   *Status:* **Fake Requirement** in the presence of background risk. If the agent holds a side bet on "Heads on even toss," two games with identical payout distributions but different toss-index mappings are *not* interchangeable. This is only mandatory if the agent has *no* other correlated exposures.
  9.  **Defined Value for All Gambles:** The theory must output a real number (or extended real) for every gamble.
      *   *Status:* Optional. A theory may output "No Verdict" for Pasadena while retaining coherence. This fails your "Yes/No" purpose constraint, but is a valid theoretical stance.
  10. **Unbounded Utility:** The theory must handle utility functions unbounded above and below.
      *   *Status:* Optional. Bounded utility solves the problem by fiat (making all sums absolutely convergent). The spec here assumes you want to solve it *without* bounding utility.

  ---

  ## 2. Analysis of Your Proposed Cases

  | Your Case | Verdict | Notes |
  | :--- | :--- | :--- |
  | **St. Pete vs. Pasadena** | **Keep (Tier 1)** | Essential. A theory collapsing these loses discriminatory power. |
  | **Truncated Versions** | **Keep (Tier 2)** | This is the "Weak Expectation" criterion. It is a strong constraint but not logically mandatory. |
  | **Shifting/Bundling** | **Keep (Tier 2)** | Linearity is the primary casualty of Pasadena solutions. Expect theories to fail here. |
  | **Scrambled Pasadena** | **Modify** | As noted in Desideratum #8, this is only required if the agent has no state-correlated background risk. If they do, state-supervenience is required, not distribution-supervenience. |
  | **Quittable Version** | **Keep (Tier 2)** | This is the strongest stress test. Pasadena violates Dynamic Consistency under almost all valuation rules. |
  | **Money vs. Utility** | **Reframe** | Don't demand bounded utility. Demand the theory work *given* unbounded utility. Bounded utility is a solution, not a spec. |

  **Missing Critical Case:**
  *   **The "Parity Bet" Dutch Book:** If you assign Pasadena a value (e.g., $\ln 2$), can I sell you Pasadena for $\ln 2 + \epsilon$ and simultaneously sell you a bet on "Heads on Odd Toss" that hedges the tail risk, creating a sure loss? A robust theory must block this arbitrage.

  ---

  ## 3. Impossibility Clusters

  You cannot satisfy all Tier 1 and Tier 2 requirements simultaneously for the class of Pasadena gambles. You must drop at least one from each cluster below.

  ### Cluster A: The Algebraic Conflict
  **Incompatible Set:** {Linearity, Dominance, Defined Finite Value for Pasadena}
  *   **The Conflict:** If you assign a finite value $V$ to Pasadena, Linearity allows you to construct a portfolio of Pasadena games and parity bets that violates Dominance. Specifically, because the series is conditionally convergent, rearranging terms (which corresponds to bundling/scaling) changes the sum.
  *   **Casualty:** Most theories drop **Linearity** (e.g., Weak Expectation theories) or **Defined Value** (e.g., "Undefined = No Trade").

  ### Cluster B: The Dynamic Conflict
  **Incompatible Set:** {Dynamic Consistency, Ex-Ante Valuation, Option to Quit}
  *   **The Conflict:** In Quittable Pasadena, the ex-ante value (e.g., $\ln 2$) is stable. The conditional value at toss $k$ scales as $\approx (-1)^k 2^k / k$.
      *   If you plan ex-ante to play, you must plan to continue at every node.
      *   But at nodes where conditional value is massively negative, a rational agent with a quit option *should* quit.
      *   If you quit, the ex-ante valuation was wrong. If you don't quit, you violate local rationality.
  *   **Casualty:** **Dynamic Consistency**. This is the "Killer Constraint" for Pasadena. It is almost impossible to maintain dynamic consistency with a finite ex-ante value for this specific game structure.

  ### Cluster C: The Supervenience Conflict
  **Incompatible Set:** {Distribution Supervenience, Portfolio Sensitivity}
  *   **The Conflict:** If the agent holds a side bet on toss parity, the value of Pasadena depends on the correlation between the payout and the parity. Distribution Supervenience demands the value stay the same (since payout probabilities are unchanged).
  *   **Casualty:** **Distribution Supervenience**. In a general agent model with background risk, value must supervene on *states*, not distributions.

  ---

  ## 4. The Killer Constraint

  **Dynamic Consistency (Tier 2, #6)** eliminates the most candidates.

  *   **Why:** Standard Expected Utility fails (undefined). Weak Expectation (limit of truncations) fails (ex-ante value $\ln 2$ vs. conditional oscillation). Bounded Utility passes, but only by changing the utility function, not the decision rule. Non-standard analysis (Hyperreals) can assign a value, but struggles to justify why the agent wouldn't deviate at a node with negative hyperreal conditional value.
  *   **Implication:** If you demand Dynamic Consistency, you are effectively forced into **Bounded Utility**. If you allow Unbounded Utility, you must accept that the agent will be dynamically inconsistent (plan to play, then quit mid-game) or that the "Value" is not a guide for action at nodes.

  ---

  ## 5. Scorecard of Contenders

  | Theory | St. Pete vs. Pas. | Linearity | Dynamic Consistency | Defined Value | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard EUT** | Fail (Undefined) | Pass | Pass | Fail | **Reject** (No verdict) |
  | **Bounded Utility** | Pass | Pass | Pass | Pass | **Pass** (But changes domain) |
  | **Weak Expectation** (Howson/Easwaran) | Pass | **Fail** | **Fail** | Pass | **Mixed** (Good for pricing, bad for dynamics) |
  | **Hyperreal Expectation** | Pass | Pass | **Fail** | Pass | **Mixed** (Value exists, but action-guidance unclear) |
  | **Decision-Theoretic** (Nover/Hájek) | Pass | Pass | Pass | **Fail** | **Reject** (No verdict for Pasadena) |
  | **Principal Value** | Pass | **Fail** | **Fail** | Pass | **Mixed** (Arbitrary summation order) |

  ### Recommendation for Your Spec
  If your goal is a **Yes/No verdict** for an agent with **Unbounded Utility**:
  1.  **Drop Dynamic Consistency.** Accept that the agent's ex-ante plan may not match their mid-game incentives.
  2.  **Drop Linearity.** Accept that $V(G_1 + G_2) \neq V(G_1) + V(G_2)$ for these specific pathological cases.
  3.  **Adopt Weak Expectation.** Use the limit of truncations ($\ln 2$) as the price anchor. It is the only value that respects the symmetry of the coin and the convergence of the finite approximations.
  4.  **Add a "Portfolio Check."** Before accepting the Weak Expectation value, check for correlated background risk (Scrambled Pasadena). If correlation exists, calculate conditional expectation on the joint state space, not the marginal distribution.

  **Final Specification Summary:**
  The theory must output a price $p$. It is adequate if:
  1.  $p$ distinguishes St. Pete ($\infty$) from Pasadena (Finite/Undefined).
  2.  $p$ equals $\lim_{N \to \infty} E[G_N]$ when that limit exists (Weak Expectation).
  3.  The agent is not money-pumped *ex-ante* (Acyclicity holds for static choices).
  4.  (Explicit Waiver) The theory is not required to ensure the agent sticks to the plan mid-game (Dynamic Consistency waived).
  5.  (Explicit Waiver) The theory is not required to preserve additivity for bundles of Pasadena games (Linearity waived).
