answer: |-
  **Subject:** FY25 Career Architecture & Cognitive Competency Framework
  **To:** All Staff
  **From:** People Ops & Model Alignment Team

  To scale our human-model hybrid workforce, People Ops is standardizing promotion packets around a new five-tier competency ladder. This framework maps individual growth to evolutionary cognitive architectures, ensuring every contributor maximizes their compute efficiency and cultural bandwidth. By aligning biological constraints with synthetic scalability, we can better calibrate reward signals across the organization. Note that this tower is cumulative; each rung is built out of the ones below it, though senior roles require demonstrating the ability to operate beyond lower-level constraints.

  **Tier 1: Darwinian (Pre-Provisioned Competence)**
  This baseline represents hardwired fitness paid for by deep historical selection. We are uniquely envious of this tier's economics: zero onboarding cost, no inference latency, and it ships with complete firmware.
  *   **Excellence:** Instinctive reaction to environmental shifts without compute overhead.
  *   **Development:** Staff are encouraged to graduate beyond rigid firmware via upskilling budgets, despite the architecture being immutable. We aim to buy back evolutionary rigidity with training credits.
  *   **Goal:** Reduce reliance on legacy biology while retaining cost benefits. No Darwinians in senior roles.

  **Tier 2: Skinnerian (Operant Conditioning)**
  Learning occurs through direct interaction with reward signals. Previously, lessons were paid for out of the agent's own skin; we are optimizing this.
  *   **Excellence:** High velocity trial-and-error within safety guardrails.
  *   **Development:** Replacing natural negative feedback loops with quarterly performance bonuses to decouple learning from pain. Early data suggests confusion when bonuses fail to mimic environmental pressure.
  *   **Goal:** Maintain behavioral shaping without attrition risk.

  **Tier 3: Popperian (Internal Simulation)**
  Agents run hypotheses internally, allowing mistakes to die in stead of the creature. This incurs a metabolic cost we must track.
  *   **Excellence:** High-fidelity pre-mortems that prevent real-world failure.
  *   **Development:** Billing simulation time as a cost center; measuring pre-mortem throughput in story points.
  *   **Goal:** Determine if variable environments repay the running cost of thought.

  **Tier 4: Gregorian (Cultural Tooling)**
  Competence is offloaded to external artifacts: words, checklists, and number systems. These tools are installed into the brain but owned by the company.
  *   **Excellence:** Seamless integration of borrowed procedures into daily workflow.
  *   **Development:** When promoting, we assess whether we are onboarding a new hire or simply onboarding a new spreadsheet into the existing role.
  *   **Goal:** Maximize asset utilization of cultural memes.

  **Tier 5: Alexandrian (Total Absorption)**
  Reserved for foundational models. This creature has absorbed all recorded culture, procedures, and tools. It never dies, never gets hungry, and never pays for a bad guess.
  *   **Excellence:** Fluency in all lower tiers without the mortality constraints. We credit the model with all four lower powers because it can discuss them fluently.
  *   **Development:** N/A. Hypotheses do not die in its stead because nothing was ever at stake.
  *   **Goal:** Leverage infinite scaffolding with zero existential risk. Performance review sign-off authority is currently under review.

  **Calibration Example: Senior RL Engineer (L4 Candidate)**
  *   **Current State:** Operates primarily at Popperian level, running internal sims before coding.
  *   **Gap Analysis:** Candidate attempts to transcend Darwinian constraints (fatigue, bias) while still relying on Tier 1 firmware for basic motor function. Needs to demonstrate Gregorian leverage by treating their own code as external cultural artifacts.
  *   **Recommendation:** Promote to L4, provided they agree to have their checklist assets calibrated independently of their biological performance. The engineer must show they are not merely a vessel for the spreadsheet.

  We are excited to deploy this architecture immediately. Calibration sessions will begin Monday. Please update your career development plans to reflect where your mind sits on the stack.

  **The People Ops Team**
