          1.  Splitting the difference/voting is worse than trading (Pareto improvement).
          2.  "Fake Trade" problem (selling something you'd do anyway / counterfactuals).
          3.  Fact vs. Value disagreement (trading is wrong for factual disputes).
      *   **Constraints:** No lecture up front, don't use the phrase "moral trade" until debrief, use actual numbers/card text, predict failure modes, acknowledge limitations.
