answer: |-
  Here is a complete game design for your 90-minute slot. It requires no prep other than writing out the cards on index cards.

  ### Game Title: The Allocation Market
  **Goal:** Allocate the £4,000 pot.
  **Materials:** 18 Index cards (Role Cards), 18 slips of paper (Secret Envelopes), pens, a whiteboard/flipchart.
  **Currency:** "Influence Points" (IP). 1 IP = £200 of the real £4,000 pot.
  **Total Pot:** 20 IP (To make math easy, we will treat the pot as 20 units, £200 each. 18 people x 1 IP = 18 IP. The remaining 2 IP are "Unallocated Buffer" to prevent exact ties).
  **Correction for Reality:** To match your £4,000 exactly: Each person holds **10 Votes**. Total 180 Votes. £4,000 / 180 = £22.22 per Vote.
  *Let's simplify for the room:* **Each person holds 10 Tokens.** Total 180 Tokens. The £4,000 is split proportionally to Tokens placed in three buckets: **Animals**, **Heritage**, **Health**.

  ---

  ### 1. The Setup (0–10 Minutes)
  **Facilitator Script:**
  "We have £4,000 to split between three causes: **Global Animals**, **Local Heritage**, and **Global Health**.
  Each of you holds 10 Tokens. At the end of this hour, we will count the tokens in each bucket. The money is split proportionally.
  You have a Role Card. It tells you what gives you 'Satisfaction Points.' The goal of this game is to maximize your Satisfaction Points. You may talk, deal, and trade tokens with anyone. Deals are binding if written on a slip and signed."

  **Action:**
  1.  Divide the room into three tables (6 people each).
  2.  Hand out the **Role Cards** (see below) face down. Tell them not to show the card to anyone.
  3.  Tell them they have 5 minutes to read their card and calculate their initial preference.

  ---

  ### 2. The Role Cards (Write these on 18 Index Cards)
  *Cut these out. Distribute randomly, but try to ensure each table has a mix.*

  **Type A: The Passionates (12 Cards)**
  > **YOUR CAUSE:** [ANIMALS / HERITAGE / HEALTH]
  > **SATISFACTION:** You gain **1 Point** for every Token the group allocates to YOUR CAUSE.
  > **PUBLIC STANCE:** You are free to tell others you care about this cause.
  > *(Distribute: 4 Animals, 4 Heritage, 4 Health)*

  **Type B: The Counterfactuals (4 Cards)**
  > **YOUR CAUSE:** [ANIMALS / HERITAGE] *(Assign 2 to Animals, 2 to Heritage)*
  > **SECRET STATUS:** You have already donated £1,000 of your own money to YOUR CAUSE privately this morning.
  > **SATISFACTION:** You gain **0 Points** from the group's allocation to YOUR CAUSE (you're saturated). You gain **2 Points** for every Token allocated to **[THE OTHER CAUSE]**.
  > **CONSTRAINT:** Do **not** reveal your private donation. Act as if you care about YOUR CAUSE to facilitate trades.
  > *(Note: Give the 2 Animal Counterfactuals a secondary interest in Heritage. Give the 2 Heritage Counterfactuals a secondary interest in Animals.)*

  **Type C: The Fact Disputers (2 Cards)**
  > **YOUR CAUSE:** HEALTH
  > **SECRET DATA:** You possess a leaked audit report.
  > **PLAYER 1 CARD:** "Audit confirms Health Charity saves **100 lives** per £1,000." (Satisfaction: 1 Point per Token to Health).
  > **PLAYER 2 CARD:** "Audit confirms Health Charity is **fraudulent** (0 lives saved)." (Satisfaction: 1 Point per Token to *Animals* or *Heritage*, -5 Points if any Tokens go to Health).
  > **CONSTRAINT:** Do not show the card. Argue based on your data.

  ---

  ### 3. Round 1: The Impasse (10–25 Minutes)
  **Instruction:** "Spend 15 minutes at your tables trying to agree on a split. No trading tokens yet. Just discuss where the money should go."
  **Predicted Outcome:** Deadlock. The Passionates will dig in. The Fact Disputers will start arguing about whether Health is a scam, confusing everyone. The Counterfactuals will nod along with their "Public Cause" but feel no urgency.
  **Facilitator Note:** Do not intervene. Let them get annoyed. At 15 mins, call time. Ask for a show of hands: "Who is satisfied with the current consensus?" (Likely few).

  ---

  ### 4. Round 2: The Market (25–55 Minutes)
  **Instruction:** "You may now trade tokens. If you want someone to move a token to Heritage, you must give them something they value (e.g., you move a token to Animals). Write deals on paper: 'I move 2 Tokens to X, if you move 2 Tokens to Y.' Sign them. These are binding."
  **Mechanic:** People will realize they can swap.
  *   *Standard Trade:* Animal person gives Health token to Health person, in exchange for Health person giving Animal token to Animal person. Both happy.
  *   *The Fake Trade:* A Counterfactual (Secretly wants Heritage) tells an Animal Passionate: "I will give you my 10 Tokens for Animals if you give me your 10 Tokens for Heritage."
      *   Animal Passionate thinks: "Great, I secured 10 Animal Tokens."
      *   Counterfactual thinks: "Great, I secured 10 Heritage Tokens (which I actually want)."
      *   *Reality:* The Counterfactual would have voted Heritage anyway. The Animal Passionate gave up Heritage influence for nothing.
  *   *The Fact Trap:* People will trade for Health tokens based on Player 1's data. Player 2 will be fuming, knowing it's a scam.

  **Facilitator Note:** Watch for the Counterfactuals making deals. Watch for the Fact Disputers causing tension. If things get too calm, announce: "There are only 10 minutes left to lock in deals."

  ---

  ### 5. Round 3: Settlement & Reveal (55–75 Minutes)
  **Step 1: Tally.** Collect all tokens. Count them into the three buckets on the whiteboard. Calculate the £ split. (e.g., Animals 50%, Heritage 30%, Health 20%).
  **Step 2: Score.** Ask everyone to calculate their Satisfaction Points based on the result.
  **Step 3: The Reveal.** "Before we finalize this for next week's transfer, open the second paragraph of your Role Card. Read it silently. Now, discuss at your tables: Did anyone get a bad deal?"

  **Predicted Explosion:**
  *   The Animal Passionates will realize the Counterfactuals sold them tokens they didn't need.
  *   The Health supporters will realize Player 2 thinks they are funding a fraud.
  *   The group will feel the "sting" of the counterfactual trade.

  ---

  ### 6. The Debrief (75–90 Minutes)
  *Do not lecture. Ask questions. Map their answers to the concepts.*

  **Q1: "Who made a trade that they now regret?"**
  *   *Likely Answer:* The Passionates who traded away their secondary cause to the Counterfactuals.
  *   *The Lesson (Write on board):* **Counterfactual Value.** Trade only creates value if the seller *wouldn't* have done the action otherwise. If they would have done it anyway, you paid for nothing.
  *   *Real World Application:* "When we pledge to donate to X if you donate to Y, how do we know you wouldn't have donated to X anyway?"

  **Q2: "What happened with the Health data?"**
  *   *Likely Answer:* Two people had different facts. One feels the money is wasted.
  *   *The Lesson (Write on board):* **Epistemic Trade.** You cannot trade on values if you disagree on facts. Trading amplifies errors.
  *   *Real World Application:* "Before we trade 'I'll fund your cause if you fund mine,' do we agree on the data?"

  **Q3: "Was the final split better than the Round 1 deadlock?"**
  *   *Likely Answer:* Yes, more tokens moved, more total satisfaction points generated (utilitarian gain), *but* trust is damaged.
  *   *The Lesson (Write on board):* **Moral Trade.** We can increase total good by swapping commitments, *provided* we solve the Counterfactual and Fact problems.
  *   *Closing:* "This is called Moral Trade. It solves the deadlock, but it requires transparency about what you would have done anyway."

  ---

  ### Predictable Failure Modes (And How to Handle Them)
  1.  **Chaos in Round 2:** 18 people trading simultaneously is noisy.
      *   *Fix:* If it gets too loud, force them to trade only with people at *other* tables. This forces cross-causal trade.
  2.  **Counterfactuals Reveal Too Early:** They might feel guilty and confess.
      *   *Fix:* In the instructions, emphasize: "This is a simulation. Your goal is to test the mechanics. Hold the secret until the Reveal phase."
  3.  **Fact Disputer Dominates:** Player 2 (Fraud) might shout so loud it stops all Health funding.
      *   *Fix:* This is actually good data for the debrief. Let it happen. It proves the "Fact vs Value" point.
  4.  **Time Overrun:** The tallying takes too long.
      *   *Fix:* Appoint one "Registrar" at the start to collect tokens and count them during the Reveal phase while you facilitate the discussion.

  ### What This Game Cannot Show (Say This Out Loud)
  1.  **Enforcement:** In the game, I told you deals were binding. In real life, if I promise to donate to your cause next year, how do you enforce that? (Moral trade requires reputation or escrow).
  2.  **Identity:** In the game, you played a role. In real life, your values are your identity. Trading them can feel like betrayal, not just economics.
  3.  **Verification:** The game revealed the secrets at the end. In real life, you rarely find out someone "would have done it anyway." You need mechanisms (like donor registries) to check counterfactuals.

  ### Facilitator Cheat Sheet: The "Moral Trade" Definition
  *Only say this in the last 5 minutes.*
  "Moral Trade isn't compromising. It's not meeting in the middle. It's saying: 'I care 100% about A, you care 100% about B. I will fund B if you fund A.' We both get 100% of what we want, instead of 50% of what we want. But it only works if we aren't selling things we already owned."
