      *   *Causal vs Evidential:* The flight caused the capture, but evidenced the treason. The common cause is his *type* (Absolutist).
      *   *Prescriptions:* CDT says run (causal chance of success). EDT says stay (correlation with survival).
      *   *Reverse:* The Revolution isn't a fixed state. It's a learning system. This breaks the strict "Death in Damascus" logic but strengthens the evidential lesson.
      *   *Verdict:* Varennes vindicates EDT in political contexts where signaling is paramount.
      *   *Confidence:* Moderate. History is noisy. Least sure step: The counterfactual of staying.

