answer: |-
  This asymmetry doesn't have a single canonical name, but in structural terms, it is the distinction between **parasitic** and **constitutive** maxims. Let's coin the phenomenon **"Compliance Polarity."**

  Your Type A (lending) has *negative* polarity: the action's success depends on others *not* doing it. Your Type B (pathing) has *positive* polarity: success depends on others *doing* it.

  The Universalizability Test is explicitly designed to assume 100% compliance (Kant's "Kingdom of Ends"). This isn't an oversight; it's a stress test for sustainability.
  *   **Type A fails** because it is self-consuming. If everyone exploits sloppy paperwork, the institution of lending vanishes. The maxim becomes logically impossible to act upon (a *Contradiction in Conception*).
  *   **Type B passes** because it is self-sustaining. If everyone steps left, the path remains usable. The maxim is practically viable.

  Your frustration stems from the test ignoring the *trajectory*. Real life operates at partial compliance. Type A is dangerous because it tempts you to slide toward the collapse point. Type B is frustrating because it requires you to wait for others to join before it works. The test samples only the endpoint, so it treats Type A as impossible and Type B as permissible, flattening the distinct risks of the journey.

  This is not the "specificity" objection (rewriting the rule to include exceptions). It's about **social ontology**: does the action consume a shared resource or produce a shared convention?

  **Edges and Blurs:**
  Congestible goods blur the line. "I drive to work" is fine if some do it, chaotic if all do it. This looks like Type A, but driving isn't inherently parasitic. Here, the maxim needs refinement: "I drive *when public transit is full*" vs. "I drive *always*." The latter fails the test (like lending); the former might pass.

  **Verdict:**
  The test is meant to identify rules that *cannot* be universal laws, not rules that are merely inefficient at low compliance. Type A cannot be a law. Type B can be. Your group is spotting the difference between **logical impossibility** (Type A) and **coordination costs** (Type B). The test is designed to catch the former, leaving the latter to practical judgment. The asymmetry is real, but the test is functioning correctly: it filters for what survives total adoption, not what survives partial adoption.
