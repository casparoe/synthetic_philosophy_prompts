answer: |-
  Here is a complete run-sheet for the seminar. It is designed to be handed to you as the instructor, with scripts, rules, and troubleshooting built in.

  # Seminar Plan: The Transmission Game
  **Topic:** Knowledge-How vs. Knowledge-That (Ryle vs. Intellectualism)
  **Time:** 75 Minutes
  **Class Size:** 16 Students (5 Teams of 3 + 1 Floating Adjudicator/You)
  **Skill:** The Bowline Knot (Standard Mountaineering Loop)
  **Why this skill:** It has a binary success condition (holds weight/slips), is easy to demonstrate, notoriously difficult to describe without spatial indexicals ("left/right"), and has a clean mirror-variant (left-handed bowline).

  ## 1. Materials & Setup (Pre-Class)
  *   **5 Boxes** containing:
      *   3 lengths of distinctively colored paracord (approx. 1 meter each) per team.
      *   1 "Test Weight" (a heavy carabiner or water bottle) per team.
      *   3 Index Cards (for manuals).
      *   1 Score Sheet (printed).
  *   **Room:** Tables arranged for 5 groups of 3. One spare seat for you (the Floater).
  *   **Ban:** All phones/laptops must be bagged. This is an analog transmission.

  ## 2. The Script (0:00 – 0:10)
  **Do not mention Ryle, Intellectualism, Propositions, or Dispositions.**

  **Instructor:** "We are running a transmission simulation. You are in teams of three: **Source (A)**, **Scribe (B)**, and **Stranger (C)**.
  *   **Source:** You know how to tie the Bowline. Your goal is to get your team the highest **Adaptation Score**.
  *   **Scribe:** You do *not* know the Bowline. You must learn it from Source, then write a manual for Stranger. Your goal is the highest **Replication Score**.
  *   **Stranger:** You do not know the Bowline. You will only receive the Scribe's written card. You must tie the knot.

  **The Skill:** The Bowline. (Demonstrate a perfect Bowline silently in 10 seconds. Do not explain it).
  **Success:** The loop must hold the Test Weight for 5 seconds without slipping.
  **Failure:** The knot capsizes, slips, or is not a Bowline.

  **The Constraint:** In the written manual, **Indexicals are Banned.** You cannot write: *Left, Right, Up, Down, Top, Bottom, This, That, Here, There, Clockwise, Counter-Clockwise.* You must describe the rope's intrinsic structure (e.g., 'The working end', 'The standing part', 'The loop'). If you use a banned word, the Stranger must tie the knot blindfolded.

  **Scoring:**
  1.  **Replication Points:** Awarded for tying the *exact* knot shown (Right-handed).
  2.  **Adaptation Points:** Awarded for tying the *Mirror Variant* (Left-handed) without being shown it.
  3.  **Scribe's Payoff:** You get Replication Points for your own performance. You get Adaptation Points *only* if the Stranger succeeds at the Variant.
  4.  **Source's Payoff:** You get Adaptation Points based on the Scribe's performance.

  **Tension:** Source, you want Scribe to understand the *principle* so they can adapt. Scribe, you want to *mimic* the Source exactly to ensure Replication. These goals may conflict.

  **Round 1 begins now. Source, teach Scribe. You have 5 minutes.**"

  ## 3. Game Rounds & Timing

  ### Round 1: Live Transmission (0:10 – 0:25)
  *   **Action:** Source (A) teaches Scribe (B) physically. No writing yet.
  *   **Test 1 (Replication):** Scribe ties the Standard Bowline (Right Hand). Instructor/Float checks weight hold.
      *   *Score:* 10 pts for Scribe if successful.
  *   **Test 2 (Adaptation):** Instructor says "Switch Hands." Scribe attempts Left-Handed Bowline without help.
      *   *Score:* 10 pts for Source if Scribe succeeds.
  *   **Observation:** Watch if Sources explain *structure* ("make a loop that the end bites") or *motion* ("go around and pull"). Watch if Scribes ask "Which hand?"

  ### Round 2: The Manual (0:25 – 0:40)
  *   **Action:** Scribe (B) writes the manual on the Index Card for Stranger (C). Source (A) must turn their back.
  *   **Constraint:** Enforce the "No Indexicals" rule strictly. If you catch a "Left", cross it out.
  *   **Test:** Stranger (C) reads card and ties Standard Bowline.
      *   *Score:* 10 pts for Scribe if successful.
  *   **Variant Test:** Instructor hands Stranger a different colored rope and says "Do the other one."
      *   *Score:* 10 pts Bonus for Scribe if successful.

  ### Round 3: The Narration Penalty (0:40 – 0:50)
  *   **Action:** Select one successful Scribe from a top team. They must tie the knot again, but they must **narrate every micro-movement aloud** before making it. ("I am now picking up the working end... I am now crossing it over...")
  *   **Observation:** Most will stutter, freeze, or fail. This is the "centipede effect."
  *   **Score:** No points. This is purely for the debrief.

  ## 4. Scoring Arithmetic (Handout for You)
  Keep two leaderboards on the whiteboard.

  | Team | Replication Score (Max 20) | Adaptation Score (Max 20) | Total |
  | :--- | :--- | :--- | :--- |
  | **1** | (Scribe Success + Stranger Success) | (Scribe Variant + Stranger Variant) | |
  | **2** | ... | ... | |

  *   **Replication Score:** Measures **Procedural Fidelity**. (Can you reproduce the input?)
  *   **Adaptation Score:** Measures **Practical Understanding**. (Can you apply the rule to a new context?)
  *   **The Trap:** If a Scribe rote-memorizes the hand motions (High Replication), they will fail the Variant (Low Adaptation). If they try to understand the geometry (High Adaptation), they might fumble the initial mimicry (Risk to Replication).

  ## 5. Troubleshooting: What Will Go Wrong
  **1. "I physically cannot do this." (Dexterity Issues)**
  *   **Fix:** Allow "Guided Hands." The Source can physically move the Scribe's hands to tie the knot *once*.
  *   **Cost:** Deduct 5 Replication Points.
  *   **Why:** Prevents total disengagement, but penalizes pure physical mimicry without cognitive uptake.

  **2. "I filmed your hands in slow motion." (Cheating)**
  *   **Fix:** **Block it.** Announce at start: "Analog transmission only. Phones in bags. If a phone appears, that team is disqualified."
  *   **Why:** The game relies on the *bandwidth limit* of human demonstration vs. text. Video bypasses the cognitive translation you want them to feel.

  **3. "The manual says 'Ask Source'." (Loophole)**
  *   **Fix:** **Void the manual.** Rule: "The manual must be self-contained. If it references a person or external help, Stranger gets a blindfold."
  *   **Why:** Forces the Scribe to confront the insufficiency of their own propositional encoding.

  **4. "We defined 'Left' as 'The hand holding the heart'." (Semantic Workaround)**
  *   **Fix:** **Allow it, but highlight it in debrief.** This is actually a win for the Intellectualist (creating a reference frame).
  *   **Why:** It shows that propositional knowledge *can* work if the ontology is rich enough.

  ## 6. The Debrief (0:50 – 1:15)
  *Do not lecture immediately. Ask questions based on the data on the board.*

  **Phase 1: The Parakeet Check (Reproduction vs. Adaptation)**
  *   **Ask:** "Look at Team 3. High Replication, Zero Adaptation. Scribe, what happened when I said 'Switch Hands'?"
  *   **Likely Answer:** "I forgot which way the loop went," or "My hands didn't know what to do."
  *   **Philosophical Map:** This is the **Parakeet Problem**. You can reproduce behavior without understanding the function.
  *   **Ryle's Move:** This shows that *knowing-how* is not just *knowing-that* plus action. If it were just rules, switching hands should be easy (just apply rule to other hand). The fact that it fails suggests the knowledge is in the *disposition*, not the database.

  **Phase 2: The Manual Failure (Propositional Insufficiency)**
  *   **Ask:** "Stranger, C, look at the card. Was it possible to tie the knot?"
  *   **Likely Answer:** "It was vague," or "I had to guess what 'the loop' meant."
  *   **Philosophical Map:** This targets **Intellectualism**. If knowledge-how were just knowledge-that (propositions), a perfect manual should work. The failure suggests there is a residue of skill that cannot be codified into propositions (the "ineffable" element).
  *   **Intellectualist Counter:** "The manual wasn't *good enough*, not that it's *impossible*." (Invite the student who used 'heart hand' to speak).

  **Phase 3: The Narration Penalty (Monitoring Disruption)**
  *   **Ask:** "When you had to narrate, why did you freeze?"
  *   **Likely Answer:** "It broke my flow," or "I don't actually know what I'm doing, I just do it."
  *   **Philosophical Map:** This is evidence for **Anti-Intellectualism**. If the knowledge were a list of steps in your head, saying them out loud should help. The fact that it hurts suggests the knowledge is stored in a *practical mode* that is disrupted by declarative monitoring.

  **Phase 4: Closing the Gap (The Last 10 Minutes)**
  *   **Instructor:** "Here is what this game did not show."
  *   **Point 1: Mode of Presentation.** The game suggests KH and KT are different *things*. Jason Stanley (Intellectualist) argues they are the same *relation* (to a proposition) but grasped under a different *mode* (Practical vs. Theoretical). The game can't distinguish 'Different Thing' from 'Same Thing, Different Access'.
  *   **Point 2: The Amnesia Case.** We didn't test someone who knows the facts but can't move (paralysis) vs. someone who can move but forgot the facts.
  *   **Point 3: Normativity.** The game treated success as 'holding weight'. Philosophy asks: Is it knowledge if you succeed by luck? (Gettier cases for Know-How).
  *   **Assignment:** "For next week: Write the *perfect* manual for the Bowline. If you succeed, you prove the Intellectualists right. If you fail, you prove Ryle right."

  ## 7. What You Must Supply (The Missing Theory)
  The game generates the *phenomenology* of the distinction, but not the *metaphysics*. You must explicitly bridge these gaps in the final 10 minutes:

  1.  **The Intellectualist Rescue:** Explain that a failed manual doesn't prove propositions are insufficient, only that *human language* is insufficient. An ideal logic might capture it. (Stanley & Williamson).
  2.  **The Regress Argument:** Briefly sketch Ryle's Regress (if doing an action requires contemplating a rule, who contemplates the rule for contemplating the rule?). The game *enacted* this regress in Round 3 (Narration).
  3.  **Practical Mode of Presentation:** Define this clearly. It's the concept students struggled to find in Round 2. It is "thinking of the rope *as something to be pulled*" rather than "thinking of the rope *as an object with mass*."

  ## 8. Scoring Key for the Instructor
  *   **High Rep / Low Adapt:** The "Parakeet". Evidence for Ryle (Disposition is specific).
  *   **Low Rep / High Adapt:** The "Theorist". Evidence for Intellectualism (Grasped the rule, lacks dexterity).
  *   **High Rep / High Adapt:** The "Expert". (Rare in 5 mins).
  *   **Manual Success:** Evidence for Intellectualism (Propositions carried the load).
  *   **Manual Failure:** Evidence for Ryle (Residue of skill remained).

  ## 9. Predictable Failure Points & Mitigations
  *   **Failure:** A team finishes Round 1 in 2 minutes and sits idle.
      *   **Fix:** Have a "Hard Mode" card ready. "Tie the Bowline behind your back." Hand it to fast teams only.
  *   **Failure:** Everyone fails the Bowline (it's harder than it looks).
      *   **Fix:** Have a printed diagram of the Bowline in your pocket. If >50% of class fails Round 1, project the diagram for 30 seconds. Acknowledge this "contaminates" the data but saves the lesson.
  *   **Failure:** Students argue about whether the knot "held."
      *   **Fix:** You are the final adjudicator. "It slipped at 3 seconds. No points." Keep it moving.

  ## 10. Honesty Check: What This Game Cannot Do
  *   **It cannot distinguish Ability from Knowledge.** A student might succeed by luck (Gettier). You must raise this in debrief.
  *   **It cannot prove KH is non-propositional.** It only shows KH is *hard to encode*. An Intellectualist will say "You just didn't find the right propositions."
  *   **It ignores Social Knowledge.** The game is individualistic. Some know-how is distributed (e.g., knowing how to run a seminar).
  *   **It assumes a binary.** Some philosophers argue for a spectrum. The game forces a binary score.

  **Final Tip:** The most valuable moment will be when a Scribe says, "I knew what to do, but I couldn't write it." Pause the class right then. That sentence is the entire seminar.
