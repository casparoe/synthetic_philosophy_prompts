      *   *Pos 3:* "Semantics are implementation-defined." Clean: The ribosome/tRNA is the compiler. Without it, DNA is just data. Distortion: In CS, spec usually precedes implementation. In bio, they co-evolve. Missing: The normative aspect of a spec.
