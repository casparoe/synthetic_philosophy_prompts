  Right, let's clear the desk. I've got the coffee, I've got the stack of papers, and I've got that familiar headache that comes from staring at the same genealogies until the causal arrows start swimming. Your supervisor is running a *selective* debunking project, which is the only kind worth doing these days. Global debunking is dead in the water; the interesting work is in the discrimination.

  She's given us six data points. To figure out where she lands on the **Intentions Case** (Means vs. Side-Effect), we need to reverse-engineer the principle that sorts the "Debunked" pile from the "Not Debunked" pile.

  Here are the three candidate rules that fit the initial six verdicts, how they handle the new case, and why one of them is clearly the engine running this book.

  ### Candidate Rule 1: The Innateness/Universality Heuristic
  **The Rule:** If a moral judgment is universal, cross-cultural, and emerges early in development (e.g., in small children), it is presumptively **Not Debunked**. The evolutionary story is only debunking if it shows the belief is a *mismatch* or *error*.
  **Fit with 6 Verdicts:**
  *   *Incest/Kin/Reciprocity:* These are universal and early-emerging. This rule would predict they should be **Not Debunked**.
  *   *Conflict:* Your supervisor marked them **Debunked**.
  **Verdict on Rule 1:** **Dead.**
  **The "Kids Case" Warning:** You asked if her verdict on the "kids case" tells against one of the rules. This is it. The "Special obligations to your own children" verdict is the nail in the coffin for Rule 1. Kin attachment is arguably the most robust, early-emerging, universal trait in the human moral psyche. If she debunks *that*, she is explicitly rejecting the idea that universality or early acquisition confers epistemic privilege. She is willing to debunk innate intuitions.
  **Prediction on New Case:** Since the Intentions judgment is universal and in small children, Rule 1 predicts **Not Debunked**. (But since the rule is dead, we discard this prediction).

  ### Candidate Rule 2: The Parochialism Test
  **The Rule:** A belief is **Debunked** if its content privileges a specific subset of agents (kin, partners, in-group) over the moral community as a whole. A belief is **Not Debunked** if it is impartial in scope (applies to all agents equally).
  **Fit with 6 Verdicts:**
  *   *Incest/Kin:* Clearly partial (my family, my genes). -> **Debunked.** (Fits).
  *   *Reciprocity:* This is the stress test. Reciprocity can be framed impartially ("Everyone ought to reciprocate"), but its *application* favors trading partners. If your supervisor views it as "favoring cooperators over non-cooperators," it counts as partial. -> **Debunked.** (Fits loosely).
  *   *Cruelty/Promising/Control:* These apply to all agents. -> **Not Debunked.** (Fits).
  **Prediction on New Case:** The judgment "Intentions matter" applies to all agents impartially. It doesn't say "Intentions matter only for my allies." Rule 2 predicts **Not Debunked**.
  **Weakness:** It struggles to explain why Reciprocity was debunked if formulated as a universal duty. It also doesn't engage deeply with the *genealogy* provided, only the content.

  ### Candidate Rule 3: The Constitutive vs. Contingent Distinction
  **The Rule:** A belief is **Debunked** if the evolutionary genealogy explains it as a *contingent tool* selected for specific fitness outcomes (social navigation, partner choice, pathogen avoidance). A belief is **Not Debunked** if it functions as a *constitutive constraint* on moral agency or deliberation itself—something you must presuppose to engage in the practice of judging at all.
  **Fit with 6 Verdicts:**
  *   *Incest/Kin/Reciprocity:* These are contingent tools. You can have a moral system without incest taboos (e.g., royal dynasties) or without special kin duties (e.g., strict utilitarianism). They are specific strategies for fitness. -> **Debunked.**
  *   *Cruelty:* "Gratuitous cruelty is wrong" is often treated as a baseline constraint on valuing; to endorse gratuitous cruelty is to opt out of the moral practice. -> **Not Debunked.**
  *   *Promising:* The obligation to keep promises is constitutive of communication and cooperative agency. You cannot deliberate about promises without assuming the norm. -> **Not Debunked.**
  *   *Control ("Could not have done otherwise"):* This is the strongest fit. This isn't a substantive moral claim; it's a metaphysical precondition of responsibility. If you remove this, blame makes no sense. -> **Not Debunked.**
  **Prediction on New Case:** The genealogy provided is explicit: "selection favoured agents who could tell a clumsy ally from a dangerous one." This describes a *contingent tool* for social navigation (partner choice). It is not a constitutive constraint on agency (we can imagine a strict liability system). Rule 3 predicts **Debunked**.

  ---

  ### Which Rule is She Running?

  She is running **Candidate Rule 3 (The Constitutive vs. Contingent Distinction).**

  **Why?**
