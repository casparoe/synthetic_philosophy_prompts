  ### The Test Case: Separating the Survivors

  You suggested: *The conviction that the guilty deserve to suffer in proportion (Retributivism), with a costly-punishment genealogy.*

  This is an excellent test case because it cleanly separates Rule 2 (Parochialism) from Rule 3 (Constitutive).

  *   **Rule 2 (Parochialism) Prediction:** **Not Debunked.** Retributivism is impartial in content (it applies to *all* guilty agents, not just enemies or kin). If her rule were just about scope, she would have to save this belief.
  *   **Rule 3 (Constitutive) Prediction:** **Debunked.** Retributivism is a substantive theory of punishment, not a precondition of agency. We can have a moral system based on deterrence or rehabilitation without retribution. The genealogy (costly punishment to deter free-riders) identifies it as a contingent fitness tool, exactly like Reciprocity.

  **Is there something better?**
  Your Retribution case is strong, but it risks muddying the waters because some philosophers argue retribution *is* constitutive of justice (a "fixed point"). To make the separation cleaner, I would suggest a case that is **Impartial** but **Clearly Contingent**.

  **Better Test Case:** *The prohibition against eating the dead (Cannibalism Taboo).*
  *   **Content:** Impartial (Don't eat *any* human dead).
  *   **Genealogy:** Pathogen avoidance / Disgust mechanism (Direct fitness benefit).
  *   **Role:** Not load-bearing in deliberation (we can imagine a society that ritualistically consumes the dead without collapsing morality).
  *   **Separation:**
      *   **Rule 2 (Parochialism)** says **Not Debunked** (It's impartial).
      *   **Rule 3 (Constitutive)** says **Debunked** (It's a contingent hygiene heuristic moralized).

  If your supervisor marks the Cannibalism Taboo as **Debunked**, it confirms Rule 3 is the operating principle (Content doesn't save you if the genealogy is contingent). If she marks it **Not Debunked**, she might be relying on a "Disgust = Moral Truth" heuristic (which would be odd given the Incest verdict) or a stricter Impartiality rule.

  But honestly? The Retribution case is philosophically richer for a metaethics book. It forces her to decide if "Justice" is a constitutive norm or a fitness heuristic. I'd stick with Retribution. It puts the pressure exactly where her "Reciprocity" verdict put the pressure: on the boundary between *cooperative strategies* and *moral truths*.

