answer: |-
  Good evening, everyone. For those of you who are family, welcome. For those of you who are colleagues, welcome back. I know we are a room divided—half of you know what a utility function is, and the other half think it's just a line item on a electricity bill. But Marisol spent thirty years building a bridge between those two groups, and I want to try to stand on that bridge for a moment.

  We often talk about Marisol's work in terms of "Expected Value." In simple terms, that's the idea that we should make decisions by multiplying the probability of an outcome by its value. It sounds like cold arithmetic. And usually, when people critique that arithmetic, they argue that it makes us too reckless—that it encourages us to bet everything on a tiny chance of saving the world.

  But Marisol saw a deeper danger. She argued that Expected Value doesn't just license one big reckless gamble; it licenses a thousand small, invisible cuts.

  Here is the analogy she used best. Imagine a hospital administrator looking at a budget. She has a choice: fund a new, flashy treatment program that saves a statistically certain number of lives, or fund the maintenance of the building's electrical grid. The grid maintenance has a low probability of payoff in any given year—most years, nothing happens. So, by the strict logic of Expected Value, you cut the maintenance. You do this across every department. You cut the safety protocols, the backup generators, the staff training drills. Individually, each cut maximizes value. But collectively, they create a cascade. Eventually, the grid fails. The lights go out during surgery. The infrastructure that made the "big saves" possible collapses.

  Marisol's genius was recognizing that Expected Value needs an internal brake—a constraint that prevents the system from eating its own foundation. But here is the crucial point: Expected Value cannot construct that brake from within. You cannot use pure calculation to justify the things that make calculation possible.

  Now, I want to be very clear about something. There is a temptation to hear this critique and think, "Well, she just wasn't good at the math." That is wrong. Marisol was never confused by the numbers. She was concerned with what the numbers *leave out*. She understood that protecting the capacity to care for people isn't a calculation error; it's a precondition for any calculation to matter at all. She wasn't rejecting the arithmetic; she was protecting the ledger itself.

  She taught us that we cannot weigh lives properly if we ignore the structures that hold them. And she did this without ever implying that some lives matter less than others, or that distance makes a difference. She insisted that the integrity of the system is what allows us to honor every life equally.

  So, Marisol, thank you. Thank you for showing us that wisdom isn't just knowing how to calculate the risk, but knowing when to stop the calculation to save the system.

  Please raise your glasses. To Marisol Chen—for thirty years of keeping the lights on. Cheers.
