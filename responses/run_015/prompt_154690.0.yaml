answer: |-
  Here is a decision procedure designed for your desk, followed by its philosophical footing and application to your cases.

  ### The 10-Minute Procedure

  **Step 1: The Circularity Check**
  *   **Question:** Are the variables used to define the category distinct from the outcomes the category predicts?
  *   **Sufficient Answer:** Yes. The grouping criteria (e.g., genomic markers) are not identical to the symptom profile or behavior used to validate them.
  *   **Stop Point:** If **No**, stop. This is a **New Label**. Write: "Researchers proposed a new classification for..." Do not use "discovered."

  **Step 2: The Export Check (Your Export Test)**
  *   **Question:** Does the category predict data not used to build it (e.g., held-out samples, future progression, treatment response)?
  *   **Sufficient Answer:** Yes, with statistical significance reported in the paper or confirmed by your outside call.
  *   **Stop Point:** If **No**, stop. This is a **Descriptive Recut**. Write: "Researchers identified a distinct subgroup within..." Avoid "new kind of."

  **Step 3: The Convergence Check (Your Re-identification Test)**
  *   **Question:** Do independent methods (e.g., imaging, behavior, different assays) find the same boundaries?
  *   **Sufficient Answer:** Yes. Your outside call confirms the grouping appears robust across methodologies, not just within the paper's specific assay.
  *   **Stop Point:** If **No**, proceed to Step 4. If **Yes**, you have a **Stable Cluster**. You may write "discovered a distinct type," provided Step 4 does not contradict.

  **Step 4: The Mechanism Check**
  *   **Question:** Is there a proposed causal engine (e.g., a specific pathway, lineage, or neural circuit) explaining *why* the cluster holds?
  *   **Sufficient Answer:** Yes, plausible and peer-reviewed, not speculative.
  *   **Stop Point:** If **Yes**, you have a **Causal Kind**. Write: "discovered a new biological entity." If **No**, revert to "Stable Cluster" language.

  ### Defaults and Values Hand-Off

  **Missing Information:** If you cannot verify Step 2 or 3 via abstract or call, default to **Conservative**. Treat the finding as a **Proposal** or **Recut**, not a Discovery. This is not merely convenient; it prevents amplifying false positives.

  **Values Hand-Off:** If the category involves human diagnosis (Case 2) and passes Step 2 but fails Step 3 (stable statistically, but clinically ambiguous), the procedure hands the decision back to you. Evidence cannot settle whether this grouping *should* carry the weight of a disease label. You must explicitly report the disagreement among clinicians and advocates. Do not resolve the ontology; report the stakes.

  ### Philosophical Footing

  You asked which claims are settled and which are disputed.

  **Settled:** Scientific utility requires predictive power (Step 2) and robustness (Step 3). If a category cannot project to new cases or vanish under different measurement, it is scientifically useless. This is methodological consensus.

  **Contested:**
  1.  **Realism:** Whether passing these tests proves the category is "mind-independent." Some philosophers argue all kinds are tools, not mirrors of nature. This procedure treats robust clusters as "real enough" for journalism, but acknowledges this is a pragmatic stance, not metaphysical proof.
  2.  **Human Kinds:** Whether categories involving human behavior (psychiatry) can be "natural kinds" at all, given that labeling people changes their behavior (looping effects). This procedure treats them as provisional; always allow for instability.
  3.  **Multiple Cuttings:** Whether one domain can have several equally legitimate groupings. This procedure allows for it. A "Stable Cluster" in genomics might not match a "Stable Cluster" in psychology. Both can be reported without contradiction.

  ### Running the Cases

  **Case 1: Genomic Species Split**
  *   **Run:** Passes Step 1 (genomics ≠ morphology). Passes Step 2 (predicts lineage). Fails Step 3 (taxonomists disagree on boundaries/methods).
  *   **Result:** **Stable Cluster** (contested).
  *   **Sentence:** "Genomic analysis suggests the organism comprises five distinct lineages, though taxonomists dispute whether these constitute separate species."
  *   **Note:** The procedure flags the methodological stability but hands off the ontological status (species vs. population) to the experts.

  **Case 2: Psychiatric Subtype (Inflammatory Markers)**
  *   **Run:** Passes Step 1 (markers ≠ diagnosis). Passes Step 2 (predicts severity/response). Fails Step 3 (clinical symptoms likely overlap heavily with non-subtype; independent validation weak). Step 4 is speculative.
  *   **Result:** **Descriptive Recut** with **Values Hand-Off**.
  *   **Procedure Verdict:** You cannot write "discovered a new disease." The evidence supports a statistical subgroup, not a distinct causal entity yet. The advocacy stakes trigger the hand-off.
  *   **Sentence:** "Researchers identified a subgroup of patients with elevated inflammatory markers, a finding advocates hope will lead to new treatments, though clinicians caution it does not yet define a distinct disease."
  *   **Why:** This honors the data (subgroup exists) without endorsing the ontological claim (disease entity) or dismissing the advocacy (hope for treatment).

  **Case 3: Category Non-Existence**
  *   **Run:** The review argues the category fails Step 1 (circular definition) and Step 2 (no predictive power).
  *   **Result:** **New Label** (negative).
  *   **Sentence:** You may print "scientists say [Category] does not exist" only if the consensus is that it fails Step 1 and 2 consistently. If it passes Step 2 but fails Step 3, write: "scientists argue [Category] lacks a coherent biological basis."
  *   **Rule:** "Does not exist" is reserved for circularity or consistent predictive failure. "Lacks basis" is for poor convergence.

  ### Critique of Your Tests

  Your **Export Test** tracks *inductive potential*. It survives intact as Step 2. It is necessary for any claim of discovery.

  Your **Re-identification Test** tracks *convergent validity*. It survives as Step 3. However, you suspected it tracks different work than Export. You are correct. Export proves utility; Re-identification proves robustness. A category can be useful (predicts outcome) but fragile (depends on one assay). Your procedure separates these.

  **Where They Confuse:** You suspected you assumed discovery requires one style of category. The procedure corrects this by distinguishing **Stable Clusters** (pass 1 & 2) from **Causal Kinds** (pass 1, 2, 3 & 4). Both warrant "discovery" language, but of different depths.

  **Where the Procedure Misfires:**
  1.  **Emergent Kinds:** In psychology, a category might become real *because* it was labeled (looping effects). The procedure treats this as a Values Hand-Off, but it may miss the phenomenon where the label creates the kind.
  2.  **Resolution Dependence:** As you noted, things look real at one resolution and dissolve at another. Step 3 attempts to catch this, but if the "independent method" is at the same resolution, the procedure will false-positive. Your outside call must specifically ask about scale.
  3.  **Consensus Lag:** The procedure relies on current evidence. If the field is in early turmoil (Case 1), the procedure yields "contested cluster." This is accurate but may frustrate readers wanting a definitive answer. You must hold the line: ambiguity is the story.

  This procedure does not solve metaphysics. It isolates the evidence required to justify specific claims, forcing you to match the strength of your verb to the strength of the validation. When the evidence stops, the procedure tells you to stop claiming.
