answer: |-
  ### The case
  Mara needs Julian's urgent help to fix her roof before a storm. Julian agrees only if Mara will reciprocate next month helping him demolish a wall—a task costly to Mara with no return benefit. There are no contracts; reliance is purely on character. To secure the roof repair, Mara deliberately cultivates a rigid, non-calculative "loyalty reflex" through habituation, knowing this disposition will compel her later. When the month passes, the demolition arises. Mara calculates that the physical cost and lost wages exceed any benefit; Self-Interest Theory (S) verdicts declining. Yet, her engineered reflex triggers action. She helps, knowing it violates S. Julian isn't fooled; he observed her habituation and correctly predicted her compliance based on her acquired character. She secured the roof only by becoming the type who acts against later self-interest.

  ### Why the easy routes are closed
  Reputation is excluded; the interaction is one-off and private. Contracts are absent; legal enforcement is impossible. Self-deception is barred; Mara correctly judges the net loss at the later node. Binding technology is unavailable; the disposition is purely psychological. Escape via re-evaluation is blocked because the disposition is non-reason-responsive; she cannot reason herself out of the reflex at the node. Thus, the later act remains genuinely irrational by S's lights, while acquiring the disposition was ex ante rational. The case forces a conflict between node-relative and ex ante rationality without relying on external enforcement.

  ### What each view says
  The sophisticated chooser, applying S, calculates at the later node: cost exceeds benefit. Verdict: do not perform. Ex ante, however, she sees that possessing the loyalty reflex secures the roof repair, yielding net gain. S recommends acquiring the reflex. Consequently, S recommends becoming disposed to act irrationally later. S is indirectly self-defeating because following S ex ante requires violating S ex post. The agent faces a dilemma: remain rational later and lose the benefit, or secure the benefit by becoming irrational. This illustrates Parfit's claim that S can condemn itself.

  The resolute chooser rejects node-relative calculation. She adopts an ex ante plan: "Secure roof by committing to wall." At the later node, she does not re-evaluate; she executes the plan. For her, performing is rational because it fulfills the optimal plan adopted when reasons were balanced. She avoids indirect self-defeat by denying that rationality requires maximizing at every node. Instead, rationality is fidelity to the best initial plan. However, this requires ignoring new information (the current cost). The sophisticated agent suffers rational fragmentation; the resolute agent maintains consistency but must accept that reasons do not update with new information. The resolute view saves S from self-defeat by redefining rational choice as plan-execution rather than local maximization, effectively dissolving the tension between ex ante and ex post verdicts by privileging the former. Yet, this demands a psychological capacity to ignore present reasons, which some argue is itself irrational. The sophisticated view preserves the responsiveness of rationality to current reasons but sacrifices coherence over time.

  ### What is doing the work
  The weight rests entirely on the detectability of a non-reason-responsive disposition without binding mechanisms. If Julian could not perceive Mara's cultivated reflex, he would not lend help, and the ex ante benefit vanishes. If the reflex were reason-responsive, Mara would dismantle it at the later node when costs rise, restoring standard rationality. If it were a binding contract, performing would be rational (avoiding penalty). The case degenerates into a standard promise-keeping problem if the disposition is merely a calculation of reputation. The crucial feature is the transparency of irrationality: Julian relies on Mara precisely because she has made herself unable to reason correctly by S's lights later.

  ### The strongest objection
  The strongest objection comes from defenders of S who argue the later act is not truly irrational. They claim the "cost of breaking disposition" (guilt, identity loss) must be included in the calculus. If Mara feels worse defaulting than paying, then paying maximizes well-being, and S is not self-defeating. This attacks the stipulation that performing costs more than any benefit. If the psychological cost of akrasia is low, the disposition isn't reliable; if high, performing is rational. The objection bites at the coherence of "engineered akrasia": can one truly act against perceived self-interest if the disposition itself alters the interest? If the disposition changes the payoff, S remains self-consistent, and the puzzle dissolves into a misunderstanding of well-being.
