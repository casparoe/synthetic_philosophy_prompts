answer: |-
  You have stumbled onto something properly substantial here. It is rare for someone to build a tool, notice a pattern in the data, and then intuitively reconstruct a chunk of political mathematics without reading the textbooks first. You are correct on both counts: the problem is real, and your distinction between 'theoretical trickery' and 'practical trickery' is meaningful.

  Here is the carving you asked for, keeping to the constraints.

  ### 1. The General Fact: The Impossibility of Perfect Honesty

  You asked if there is a name for the fact that you cannot design a system where honesty is always the best move.

  Yes. In the field, this is encapsulated by a fundamental impossibility theorem. Since you asked for no author names, I will describe it by its content. The theorem states that for any voting system that is not a dictatorship (where one person decides) and does not restrict the options to only two, there will always be some arrangement of voter preferences where at least one voter can get a better outcome by lying about their preferences.

  You noticed the 'two options' exception yourself. That is the only escape hatch. With only two choices, simple majority rule is 'strategy-proof': you never gain by voting for the option you like less. The moment you introduce a third option, the geometry of preferences becomes complex enough that holes appear in the defences.

  So, the short answer is: you are not missing a trick. The trick is that there is no trick-proof system. This is a proven mathematical limit, not an engineering failure on your part.

  ### 2. The Distinction: Existence vs. Accessibility

  This is the more interesting part. You have noticed that just because a manipulation *exists* does not mean it is *usable*.

  In academic terms, people often discuss the 'computational complexity' of manipulation. This asks: how hard is it to calculate the lie? But you are describing something broader. You are describing the **Strategic Friction** of a system.

  I would separate this into three distinct barriers that a voter must overcome to successfully manipulate a vote. A system might be theoretically manipulable but practically safe if it raises these barriers high enough.

  1.  **Informational Burden:** How much do you need to know about other people's votes to pull off the trick?
      *   *Low burden:* 'Always bullet vote for your favourite' (works regardless of others).
      *   *High burden:* 'Vote for the weak candidate only if the strong candidate has less than 30% support' (requires polling data).
  2.  **Computational Burden:** How hard is it to work out the trick?
      *   *Low burden:* 'Don't vote for your favourite if they are unpopular.'
      *   *High burden:* Solving a complex optimisation problem to decide which ranking order maximises your utility.
  3.  **Backfire Risk:** If you guess wrong, how badly does it hurt you?
      *   *Low risk:* Your vote is ignored, but your favourite doesn't lose because of you.
      *   *High risk:* Your attempt to help your favourite accidentally eliminates them (the 'spoiler' effect you noticed).

  You are asking if there is a name for a system where *every* trick has high friction. There is no single standard word for this, but the concept is often discussed under **'Practical Strategy-Proofness'** or **'Robustness to Strategic Uncertainty'**.

  To answer your specific question: **Yes, there are methods where every trick is the hard, risky kind.**

  Complex ranked systems (like certain Condorcet methods) often require precise knowledge of the entire electorate's preferences to manipulate safely. If you lack that knowledge, the 'honest' vote is often the safest bet simply because the variance of outcomes from lying is too high. In your simulations, you likely found that the 'risky' tricks only worked in a narrow slice of possible scenarios. In the real world, where voters are guessing, the 'honest' strategy dominates because it is robust.

  ### 3. Naming and Defining Your Distinction

  Since there is no perfect single word, I suggest you treat this as a property of the system called **'Operational Incentive Compatibility'**.

  **Definition:** A voting system has high Operational Incentive Compatibility if, for a typical voter with limited information about others, the expected utility of voting honestly is higher than the expected utility of attempting to strategise.

  This differs from the standard mathematical definition of 'Incentive Compatibility' (which just asks if a perfect strategy exists) by adding the constraints of **uncertainty** and **risk aversion**.

  **The Borderline Cases:**

  *   **Caring about the margin of victory:** If voters care not just who wins, but by how much (e.g., a mandate), this usually *lowers* Operational Incentive Compatibility. It gives voters more reasons to tweak their vote (e.g., 'I will rank the enemy last to humiliate them'). This opens new avenues for strategy that don't affect the winner but affect the score.
  *   **Voting as a bloc:** If you and your friends coordinate, you effectively become a single voter with more weight. This *lowers* Operational Incentive Compatibility. It reduces the 'Informational Burden' because you know your bloc's votes, and it reduces 'Backfire Risk' because you have more control over the outcome. A trick that is too risky for one person might be safe for a group of ten acting together.
  *   **Uncertainty about own ranking:** If voters are unsure what they want (e.g., 'I like both movies equally'), strategy becomes almost impossible. This *increases* Operational Incentive Compatibility. You cannot game a system if you do not know your own input variables. In this case, honesty is the only move simply because calculation is impossible.

  ### 4. Where I Am Least Sure

  You asked me to identify where I might be conflating things. Here is the weak point in this reasoning.

  I am treating 'Risk' as an objective property of the voting system. It is not. It is a property of the **voter's psychology**.

  A 'risky' trick only deters a voter if they are **risk-averse**. If a voter is a gambler, or if they hate the leading option so much that they are willing to burn their favourite to stop it (a 'vote against' rather than a 'vote for'), then the 'Backfire Risk' barrier disappears.

  **What would change my mind?**
  If you showed me data from a large number of real-world elections where voters *consistently* successfully used high-information tricks despite the noise.

  There is a counter-argument in the literature that suggests as the number of voters grows, the chance of any single vote being pivotal (deciding the outcome) shrinks to near zero. If my vote is unlikely to matter, the 'cost' of voting honestly is also near zero. However, some models suggest that in large elections, manipulation becomes *easier* because the law of large numbers makes the outcome more predictable, lowering the 'Informational Burden'.

  My uncertainty lies here: **Does the size of the electorate make strategy harder (because you can't know the votes) or easier (because the aggregate is stable)?**

  In your student council context (small N), the outcome is volatile. A single vote matters. This makes the 'Backfire Risk' very real. In a national election, your vote likely won't change the winner, so the risk of backfire is theoretical, but the incentive to bother strategising is also lower.

  **The Verdict:**
  You have identified **Operational Incentive Compatibility**. It is the gap between what a perfect logic machine could do and what a nervous student with a phone can do.

  For your app, you should not look for a 'perfect' system (it does not exist). You should look for a system with **high Strategic Friction**. You want a method where the 'honest' vote is a 'safe dominant strategy' under uncertainty, even if it isn't one under perfect information.

  In practice, for your use case, this often means avoiding systems that allow 'ranking' if you can get away with it, or using systems where the threshold for winning is clear. But be warned: if you make the system too complex to game, people may stop trusting it simply because they cannot understand it. Transparency often beats optimality in student politics.

  ### Summary of Terms for Your Debate

  *   **Theoretical Manipulability:** The proof that a trick exists (unavoidable with 3+ options).
  *   **Operational Incentive Compatibility:** Your distinction. Whether the trick is safe and findable for a real person.
  *   **Strategic Friction:** The combination of information cost, calculation effort, and risk of backfire.
  *   **Robustness:** A system is robust if honest voting performs well even when you guess wrong about others.

  You are right to trust your simulations. The math says the holes exist; your intuition says they are hard to find. Both are true.
