prompt: |-
  I have been thinking about Darwin's views on morality and religion, and whether explaining their origins through evolution undermines the authority we usually grant them. In The Descent of Man he discusses how the moral sense might develop through natural selection, and he invites the reader to imagine that if human beings had evolved with social instincts like those of hive bees, we might regard killing our brothers as a moral duty rather than a crime. I am unsure whether he means this as a reductio showing that evolutionary explanations collapse morality into mere contingency, or only as a neutral observation about the source of our feelings. What I especially want to understand is whether Darwin's reasoning leaves any independent ground for criticizing our inherited moral instincts when they face cases they never evolved to handle—such as deciding whether artificial minds that share no evolutionary kinship with us deserve moral consideration. Could you help me parse what that passage implies about the gap between evolved moral sentiment and rational moral judgment, and whether that gap can be bridged without appealing to outside authorities? I am not looking for further reading lists or citations; I just want to see the argument clearly on its own terms.
