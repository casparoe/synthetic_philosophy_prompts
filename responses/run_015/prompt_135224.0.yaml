      *   **Working:** SIA adjusts the *prior* to 10^9:1 in favour of G (because G has more observers). However, SSA still applies to the *likelihood* of the specific evidence "I am a settler."
          *   SIA Prior Odds (G:C) = 10^9 : 1.
          *   SSA Likelihood Ratio (G:C) = 10^-9 : 1 (as calculated in part i).
          *   Posterior = Prior × Likelihood = 10^9 × 10^-9 = 1:1.
      *   **Feedback to Candidate:** You cannot treat "I am a settler" as identical to "I exist." SIA boosts the hypothesis with more *total* observers, but SSA penalizes the hypothesis where *your specific type* (settler) is rare. These two factors cancel out exactly here. You must show the multiplication of the SIA-adjusted prior by the SSA likelihood.
  *   **Claim (iii):** Narrowing reference class "makes no difference."
      *   **Verdict:** **Straightforwardly Wrong.** SSA is essentially defined by its sensitivity to the reference class.
      *   **Working:** If emulations are excluded from the reference class, the reference class for G contains only the 10^11 settlers.
          *   P(Setter | G, Restricted Ref Class) = 10^11 / 10^11 = 1.
          *   P(Setter | C, Restricted Ref Class) = 1.
          *   The SSA likelihood ratio becomes 1:1, not 10^-9. This changes the posterior significantly.
      *   **Feedback to Candidate:** SSA is inherently reference-class sensitive. If you exclude the emulations from the class of observers you could have been, the probability of being a settler on G rises to 1. You need to recalculate the likelihood ratio based on the new class size.
  *   **Claim (iv):** Settlers' knowledge that they are early "makes no difference at all."
      *   **Verdict:** **Wrong/Under-argued.** This ignores the structural difference between (b) and (c).
      *   **Working:** In (b), the philosopher has no self-locating evidence other than existence. In (c), the settler has specific evidence ("I am early/a settler"). This specific evidence is the *only* reason SSA favours C in part (i).
      *   **Feedback to Candidate:** The indexical detail is crucial. In (b), SSA is inert because there is no rank information. In (c), the knowledge "I am a settler" provides the rank information that drives the Doomsday-style shift in part (i). You need to explain that the arithmetic changes because the *evidence* changes, not just the totals.

