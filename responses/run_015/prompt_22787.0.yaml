answer: |-
  You can sleep soundly tonight: **You are right, and your friend is describing Classical Utilitarianism, not Negative Utilitarianism.**

  The core philosophical distinction between Classical Utilitarianism (CU) and Negative Utilitarianism (NU) is exactly what you intuited: **asymmetry.**

  *   **Classical Utilitarianism** treats pleasure and pain as symmetric currencies. 1 unit of pain cancels out 1 unit of pleasure. If the net sum is positive, the action is good.
  *   **Negative Utilitarianism** (specifically *Strong* or *Lexical* NU) treats suffering as having moral priority. Pleasure cannot morally "cancel out" suffering. The reduction of suffering is the only (or primary) moral imperative.

  If your friend believes suffering can be fully offset by pleasure, they are a Classical Utilitarian who is simply very concerned about suffering. They are not a Negative Utilitarian in the technical sense.

  Here is the concrete case you asked for, where the two views diverge sharply.

  ### The Case: "The Torture vs. The Trivial Pleasures"

  **The Scenario:**
  Imagine you have a button. If you press it, the following will happen instantly and simultaneously:
  1.  **One person** will be subjected to intense, agonizing torture for 24 hours (let's assign this a "suffering value" of -1,000).
  2.  **One billion people** will experience a mild, pleasant sensation, like enjoying a delicious ice cream cone on a hot day (let's assign each a "pleasure value" of +0.000002).

  **The Math:**
  *   **Total Suffering:** -1,000
  *   **Total Pleasure:** +2,000 (1 billion people × 0.000002)
  *   **Net Utility:** +1,000

  **The Decision:**

  *   **Classical Utilitarianism (Your Friend's View):**
      *   **Verdict:** **Press the button.**
      *   **Reasoning:** The net sum is positive (+1,000). The billion units of pleasure *offset* the one person's torture. The world is now "happier on balance" than it was before. To not press the button is to deny the billion people their pleasure for the sake of a net negative outcome.

  *   **Negative Utilitarianism (Your View):**
      *   **Verdict:** **Do NOT press the button.**
      *   **Reasoning:** The action *creates* suffering where there was none. The pleasure experienced by the billion people does not morally negate the agony of the one person. Since the goal of NU is to minimize suffering (not maximize net happiness), and pressing the button increases the total amount of suffering in the universe from 0 to 1,000, the action is morally forbidden. The pleasure is morally irrelevant (or at least insufficient) to justify the pain.

  ### Why this matters

  This divergence is famous in philosophy. It is often used to critique Classical Utilitarianism (the "Tyranny of the Majority") and to motivate Negative Utilitarianism.

  If your friend insists that Negative Utilitarianism allows for offsetting, they are likely thinking of **Weak Negative Utilitarianism**.
  *   **Weak NU:** Suffering counts *more* than pleasure (e.g., 1 unit of pain = 10 units of pleasure), but they can still trade off.
  *   **Strong/Lexical NU:** No amount of pleasure can justify *any* amount of severe suffering.

  However, even in *Weak* NU, there are cases where they diverge from Classical Utilitarianism. If the exchange rate is 1:10, and you torture one person (-100) to give mild pleasure to 500 people (+500), CU says "Do it" (Net +400), but Weak NU says "Don't" (Weighted Net: -1000 pain + 500 pleasure = -500).

  ### The "Existence" Divergence (Even Clearer)

  If you want a case that requires no math, consider **bringing a new person into existence.**

  *   **Scenario:** A child is born. Their life will be "net positive" (more happy days than sad days), but it will still contain significant suffering (illness, heartbreak, stress).
  *   **Classical Utilitarianism:** Generally views this as **Good**. You have added a net positive amount of happiness to the universe.
  *   **Negative Utilitarianism:** Generally views this as **Bad** (or at best neutral). You have created a new vessel for suffering. Before birth, there was no suffering. After birth, there is suffering. The pleasure they feel does not erase the fact that you introduced suffering into the world where there was none.

  ### Conclusion

  Your friend is arguing against a strawman, or they are using the label "Negative Utilitarianism" to mean "Utilitarianism that focuses on the negative side of the ledger." But philosophically, **the rejection of the offset is the defining feature of Negative Utilitarianism.**

  *   **Friend:** "Suffering is bad, but pleasure can fix it." (Classical Utilitarianism)
  *   **You:** "Suffering is bad, and pleasure cannot fix it." (Negative Utilitarianism)

  You won the argument on the definition. You can rest now.
