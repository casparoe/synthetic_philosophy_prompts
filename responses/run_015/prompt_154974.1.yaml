answer: |-
  This is an excellent set of intuitions. As a PhD student, your instinct that the passage is "too fast" is correct; it collapses several centuries of doctrinal development and distinct scholastic debates into a single, smooth argument that aligns neatly with Western utilitarianism. While the consequentialist reading of Buddhist ethics is a legitimate and rigorous position in contemporary scholarship (most notably defended by Charles Goodman), the passage you provided presents it as settled dogma rather than a contested interpretive framework.

  Here is a claim-by-claim breakdown, followed by an analysis of your specific concerns regarding karma, *dukkha*, no-self, and the virtue/consequentialism dichotomy.

  ### 1. Claim-by-Claim Analysis

  **Claim:** *"Buddhist ethics is straightforwardly consequentialist."*
  *   **Specialist Verdict:** **Contested.** This is the thesis of Charles Goodman's *Consequences of Compassion* (2009), but it is vigorously opposed by Damien Keown (*The Nature of Buddhist Ethics*, 1992) and others who argue for a virtue-ethics or particularist reading. To call it "straightforward" is misleading; it requires significant hermeneutical work to align Buddhist soteriology with consequentialism.
  *   **Use in Paper:** You can cite this as a "strong consequentialist reading," but you must acknowledge the Keown/Garfield counter-arguments.

  **Claim:** *"The Buddha's own criterion for an action was whether it reduces suffering."*
  *   **Specialist Verdict:** **Simplification.** In the Pāli Canon, the Buddha often defines karmically significant action in terms of *cetanā* (intention) and whether it is *kusala* (skillful/wholesome) or *akusala* (unskillful/unwholesome). While *kusala* actions tend to reduce suffering, the moral quality is often located in the mental state, not solely the external outcome.
  *   **Use in Paper:** Treat this as a teleological claim (the *goal* is the end of suffering) rather than a criterion of right action (the *rightness* is determined by suffering reduction).

  **Claim:** *"Karma is simply the mechanism that tracks an action's consequences for the agent."*
  *   **Specialist Verdict:** **Mistaken.** This is the weakest link in the passage. Karma is not a utilitarian calculus of outcomes; it is a law of moral causation rooted in volition. As you noted, *cetanā* is karma (*AN 6.63*). If karma tracked only consequences, accidental harm would generate demerit, which orthodox Buddhism denies.
  *   **Use in Paper:** This is a point you can safely critique. The passage conflates *vipāka* (the fruit/result) with the moral quality of the act itself.

  **Claim:** *"The precepts... are useful rules of thumb rather than prohibitions."*
  *   **Specialist Verdict:** **Tradition-Dependent.** In Theravāda monastic codes (*Vinaya*), precepts are often absolute for monastics. In Mahāyāna Bodhisattva ethics, flexibility is greater. The passage generalizes a Mahāyāna position to "Buddhist ethics" as a whole.
  *   **Use in Paper:** Distinguish between Śrāvakayāna (disciple) and Bodhisattva ethics here.

  **Claim:** *"The Mahāyāna skillful-means literature draws the conclusion explicitly... [Captain] kills him, accepting the karmic cost."*
  *   **Specialist Verdict:** **Accurate but Nuanced.** This refers to the *Upāyakauśalya Sūtra*. However, the phrase "accepting the karmic cost" is crucial. The text admits the act generates negative karma for the agent (the Captain), even if motivated by compassion.
  *   **Use in Paper:** This actually undermines the consequentialist reading. A strict act-consequentialist would argue the act is *right* (maximizes good), whereas the Sūtra suggests the act is *compassionate but karmically costly*. The Bodhisattva is willing to suffer hell for others, not that the killing becomes "good."

  **Claim:** *"The doctrine of no-self reinforces this... only thing that can matter is the total amount of suffering."*
  *   **Specialist Verdict:** **Philosophically Disputed.** This is the core of the Goodman vs. Keown debate (see Section 4 below). It is not a settled inference.
  *   **Use in Paper:** This is a major theoretical pivot point for your seminar paper.

  ---

  ### 2. The Karma and Intention Problem (*Cetanā*)

  Your first intuition is correct and is the standard objection to the consequentialist reading. In early Buddhism, *cetanā* is the defining factor of karma.

  *   **The Conflict:** If ethics were purely consequentialist, the moral quality of an act would be determined by its outcome. If a lie saves a life, it is good. But in Buddhism, if that lie is told with hatred or greed (even if the outcome is good), it generates unwholesome karma for the agent.
  *   **The Captain Case:** The passage tries to smooth this over by saying the Captain "accepts the karmic cost." A specialist would point out that this creates a tension: if the act is morally justified by the outcome (consequentialism), why is there a "cost"? In standard utilitarianism, saving the many makes the killing *right*, not *wrong-but-necessary*. In the Buddhist account, the Captain commits a *pārājika* (expellable offense) or a root downfall. He does it out of compassion, but it remains a violation. This looks less like consequentialism and more like **tragic dilemma** or **agent-sacrifice**.
  *   **Your Test Case:** Your example of the mixed-motive lie is a **fair test**, not rigged. It highlights the difference between *outcome-based* evaluation (Consequentialism) and *agent-based* evaluation (Virtue/Karma).
      *   *Consequentialist view:* The lie is right because the killing was prevented.
      *   *Buddhist view:* The outcome is beneficial, but the agent's mind stream is contaminated by the resentment. The karma is mixed. The passage you quoted lacks the vocabulary for this because it collapses the moral quality of the act into the outcome.

  ### 3. The Definition of *Dukkha* and the Telos

  Your second intuition is also philologically sound.

  *   **Hedonic vs. Ontological:** The passage treats *dukkha* as hedonic pain/distress (similar to Bentham's "pain"). However, in the Four Noble Truths, *dukkha* includes *vipariṇāma-dukkha* (suffering due to change) and *saṅkhāra-dukkha* (the unsatisfactoriness of conditioned existence).
  *   **Minimization vs. Cessation:** Consequentialism is typically about the *maximization/minimization* of a value (happiness/suffering) within the system. Buddhism aims for *nirodha* (cessation) of the system itself (*saṃsāra*).
  *   **The Problem:** You cannot simply "aggregate" *dukkha* if the goal is to realize that the "sufferer" is a construct. A utilitarian wants to reduce the total pain in the world. A Buddhist wants to wake up to the nature of reality so that pain no longer clings. As Jay Garfield has argued, treating Buddhism as consequentialism risks turning *nirvāṇa* into a very long-term hedonic state, which misses the soteriological point.

  ### 4. No-Self and Aggregation (The Goodman/Keown Debate)

  This is the most critical theoretical section for your paper. The passage claims *anattā* (no-self) supports aggregation ("no deep difference between my suffering and yours").

  *   **The Consequentialist Argument (Goodman):** If persons are not ultimately real, the boundary between "me" and "you" is conventional. Therefore, privileging my suffering over yours is irrational. We should maximize the good across the continuum of sentient beings. This supports an impersonal, aggregative view.
  *   **The Virtue/Particularist Argument (Keown/Garfield):** If there is no self, there is also no *subject of welfare* to aggregate. Who is the "container" for the total amount of suffering? Furthermore, *anattā* undermines the egoism that makes ethics necessary in the first place. The goal is not to balance the ledger of suffering, but to eliminate the grasping that creates the illusion of separate sufferers.
  *   **Scholarly Status:** This is **genuinely unsettled**. Goodman's *Consequences of Compassion* is the strongest defense of the aggregation view, but it relies on reading Madhyamaka metaphysics through an analytic utilitarian lens. Many scholars of early Buddhism find this anachronistic.
  *   **Verdict:** You cannot safely lean on the claim that no-self *entails* aggregation. You can argue it *permits* it, but it does not *require* it.

  ### 5. Consequentialism vs. Virtue Ethics: A False Dichotomy?

  You asked whether the alternative is necessarily virtue ethics.

  *   **Keown's Thesis:** Damien Keown famously argued that Buddhist ethics is virtue ethics because the focus is on the cultivation of character (*bhāvanā*) and the telos is *nirvāṇa* (an internal state of perfection), analogous to *eudaimonia*.
  *   **The Critique:** Some argue this is also a Western imposition. Buddhist ethics might be **particularist** (context-sensitive without rigid rules) or **aretic-consequentialist** (hybrid).
  *   **The "Third Way":** Some scholars suggest Buddhist ethics is *soteriological*. The criterion isn't "right action" in a deontic sense, but "skillful means" (*upāya*) toward liberation. This doesn't fit neatly into the Western triad (Deontology, Consequentialism, Virtue).
  *   **Recommendation:** Do not feel forced to choose between Virtue and Consequentialism. Your paper could argue that the passage fails because it tries to force Buddhist ethics into a Western category that doesn't fit the *cetanā*/karma mechanism.

  ### Summary for Your Seminar Paper

  **What you can safely lean on:**
  1.  **Karma is Intention:** It is standard scholarship that *cetanā* is the primary determinant of karmic quality, not outcome. The passage's claim that karma "tracks consequences" is a simplification that risks error.
  2.  **Dukkha is not just Pain:** You are on solid ground distinguishing hedonic pain from ontological unsatisfactoriness. This challenges the utilitarian calculus.
  3.  **The Captain Case is Exceptional:** The *Upāyakauśalya Sūtra* is a Mahāyāna text describing a Bodhisattva, not a general rule for Buddhist ethics. Using it to define "Buddhist ethics" broadly is a category error.
  4.  **No-Self/Aggregation is Debated:** Cite Goodman for the pro-aggregation view and Keown/Garfield for the anti-aggregation view. Do not present the passage's claim as fact.

  **Where the scholarship is unsettled (and where your paper can contribute):**
  1.  **The Status of the Precepts:** Are they absolute or defeasible? This varies by tradition.
  2.  **The Classification:** Is Buddhist ethics consequentialist, virtue-based, or sui generis? There is no consensus.
  3.  **Mixed Motives:** How exactly does Buddhism weigh mixed *cetanā* against good outcomes? This is under-theorized.

  **Final Advice:**
  The passage you were sent reads like a "popular introduction" because it smoothes over doctrinal tensions to make the material accessible to a Western audience familiar with utilitarianism. For a PhD seminar, you should treat the passage as a **primary object of critique** rather than a secondary source of authority. Your intuitions about intention and the nature of *dukkha* are the exact leverage points needed to dismantle the "straightforwardly consequentialist" claim.

  A strong thesis might be: *While Buddhist ethics shares consequentialism's concern for suffering, its commitment to intention (cetanā) as the locus of moral value and its soteriological goal of cessation (nirodha) rather than minimization render the classification of "consequentialism" category-mistaken, or at best, a partial map of a distinct ethical terrain.*
