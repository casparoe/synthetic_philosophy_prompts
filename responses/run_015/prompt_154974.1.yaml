  7.  **Final Polish:** Ensure clear headings and precise philosophical terminology (e.g., *cetanā*, *kusala*, *upāya*, *nirvāṇa*). (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to be careful not to dismiss the consequentialist reading entirely. Charles Goodman's work is rigorous. I must present it as a *defensible but contested* interpretation, whereas the text presents it as *obvious*. The user needs to know the text is dogmatic where the scholarship is dialectical.

  8.  **Final Output Structure:**
