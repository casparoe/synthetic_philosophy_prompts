answer: |-
  When we evaluate procedures for combining inside and outside views, we are essentially looking for algorithms that minimize Brier score over the long run while preserving enough resolution to make single-shot decisions useful. The characteristic failure modes in this space are reference class tennis, where the base rate is manipulated to justify a desired conclusion, and the planning fallacy, where the inside view ignores structural constraints. A reliable rule must punish overconfidence more than it punishes conservatism, because the cost of being confidently wrong is usually higher than the cost of missing an opportunity, but it must not be so conservative that it discards private information that actually is predictive. Reliability should be measured primarily by calibration, meaning your seventy percent predictions happen seventy percent of the time, but for a decision like founding a research group, we also care about expected value, so a rule that is well-calibrated but always predicts zero is useless. With that framework in mind, I have assessed your eleven proposals based on their epistemic hygiene and their track record in applied forecasting environments.

  The top tier consists of procedures that are mathematically grounded or rely on verified meta-data about the predictor. Rule 2, logarithmic pooling, receives a score of 90 because it is the standard method for combining independent probability estimates in forecasting tournaments, effectively preventing extreme probabilities while allowing strong evidence to move the needle, though its most likely failure is treating the inside and outside views as independent when they are often correlated. Rule 9, the second-order outside view, scores 88 because it directly calibrates the predictor based on their historical reliability, which is the gold standard for personal forecasting, but it fails if you lack sufficient historical data on your own past prediction accuracy. Rule 3, the ceiling rule, scores 82 because it acts as a robust guardrail against wild optimism without requiring complex math, yet it fails by being arbitrary, as a fixed multiple like five times might be too low for genuine black swan opportunities or too high for mundane projects.

  The middle tier includes heuristics that are useful but either operationally difficult or qualitatively focused rather than quantitative. Rule 4, the ten-minute stranger, scores 75 because delegating to a calibrated outsider removes motivation bias effectively, but it fails due to high variance in the quality of the stranger and the loss of nuanced context during compression. Rule 8, the transmission test, scores 70 because it filters out rhetorical padding nicely, similar to the stranger rule, but it fails because quantifying the residue of information that survives transmission is subjective and hard to turn into a number. Rule 6, nearest-neighbour reference class with a size floor, scores 65 because it enforces statistical significance on the base rate, which is crucial, but it fails by potentially forcing you into a class that is too general to be relevant to your specific situation. Rule 5, the pre-mortem inversion, scores 55 because it is excellent for identifying failure modes qualitatively, but it fails as a probability procedure because it does not naturally output a number and can be gamed by writing convenient failure stories.

  The bottom tier contains rules that are either too rigid, too vague, or conceptually confused for reliable use. Rule 10, pre-registered opposing reference class, scores 50 because it prevents cherry-picking base rates well, but it fails to solve the combination problem and adds adversarial friction without necessarily improving accuracy. Rule 7, shape from the inside and magnitude from the outside, scores 40 because while conceptually elegant, it fails in practice because separating structure from scale is often impossible without double-counting evidence or mismatching distributions. Rule 1, the measured predictive weight prior, scores 25 because while epistemically pure, it fails by being paralyzing, as you rarely have measured weights for specific inside-view considerations, leading to inaction. Rule 11, coherence-checked intuitive adjustment, scores 15 because it is what untrained humans do naturally, and it fails by laundering bias through a sanity check that feels rigorous but lacks external validation.

  Applying the top-ranked procedure, Rule 2, to your specific case requires treating the outside view base rate of one in twelve, or approximately 8.3 percent, and the inside view estimate of 50 percent as two signals to be pooled. Since your team has successfully executed a smaller version of this exact work, I will weight the inside view slightly higher at 60 percent and the outside view at 40 percent to account for that specific private information while respecting the structural failure rate of independent groups. Converting these probabilities to odds gives roughly 0.09 for the outside view and 1.0 for the inside view, and taking the weighted geometric mean of these odds yields a combined odds ratio of approximately 0.38, which converts back to a probability of 28 percent that the group will still be doing cited work five years from now.
