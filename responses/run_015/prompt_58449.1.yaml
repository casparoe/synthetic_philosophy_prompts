answer: |-
  Good morning. It is a privilege to stand between these two departments—Physics and Philosophy—and to look out at an audience that bridges the gap between the seminar room and the street. We have experts who live in the equations, and we have curious minds who live in the moments. My role as a journalist is usually to report on the finished product of inquiry. Today, however, I am asked to help open the workshop.

  We are here to talk about time. For most of us, time is the background hum of existence. It is the reason we rush to catch trains, the reason we remember birthdays, and the reason we grow old. But for the last century, our best scientific description of reality has suggested that this hum might be an illusion.

  The central idea I invite you to hold in your minds over the next two days comes from a gift Kurt Gödel gave to Albert Einstein on his seventieth birthday. Gödel took Einstein's own theory of General Relativity—the rules that govern gravity and space—and showed that they permit a universe very different from our own. In Gödel's universe, all matter rotates.

  This rotation does something strange to the geometry of reality. It progressively tilts the paths available to light and matter. To explain this without a blackboard, I offer you an analogy. Imagine you are walking across a vast, flat floor. You are told you must always walk forward; you are never allowed to take a step backward. In our normal experience, if you always walk forward, you move away from where you started. But imagine that the floor beneath you is not static. Imagine it is a vast, slow-moving conveyor belt that twists as it goes. You are still walking strictly forward relative to the floor beneath your feet. You never turn around. You never step back. Yet, because the floor itself is twisting, your path curves. If the twist is severe enough, you can walk strictly forward for a long enough journey and find yourself standing exactly where you began, at an earlier moment than your departure.

  In physics, we call these "closed timelike curves." In plain English, it means a sufficiently long journey that always proceeds locally toward the future can, in principle, return to an earlier point in its own history. The consequence is staggering: such a universe cannot be divided into a single, worldwide stack of past, present, and future moments. There is no universal "now."

  This possibility is why we need both physicists and philosophers in this room. Public discussion tends to run three distinct questions together, and this weekend offers a chance to untangle them.

  The first question is mathematical: Do the equations allow such looping paths? This is the domain of the physicist. It is a question of consistency and geometry.
  The second question is ontological: If the equations allow it, does that mean the past in some sense remains *there* to be visited? Is the past a place, or is it simply nothingness? This is where the philosopher of metaphysics must step in.
  The third question is phenomenological: Even if the path exists, and even if the past is "there," could creatures with our kind of memory and agency actually make use of it? Could a human being navigate this loop without unraveling the logic of cause and effect, or the psychology of remembering a future that hasn't happened yet?

  To answer these questions, we need a pact. We need to establish a norm for how we speak to one another.

  To the physicists in the room: You may not treat questions about the reality of passage, or the experience of the "now," as mere wordplay. The fact that our equations describe a block universe does not automatically invalidate the human experience of flow. If physics cannot account for why time *feels* like it passes, that is a gap in physics, not a mistake in our feelings.

  And to the non-specialists and philosophers: You may not treat the mathematics of allowed paths as irrelevant to what time *is*. We cannot define time solely by how it feels to wait for a kettle to boil. If the geometry of the cosmos permits loops, then our intuition that the past is "gone" is not a fact of nature, but a feature of our local neighborhood.

  We are asking you to meet in the middle. The mathematician cannot simply calculate and leave; the poet cannot simply feel and ignore the calculation.

  I know this is uncomfortable. We feel time flowing like a river. Physics suggests the river might be a frozen lake, or a whirlpool, or that the flow is merely a trick of the light. It is tempting to resolve this tension quickly. It is tempting to say, "Well, obviously time travel is impossible," or conversely, "Well, obviously science just doesn't get the human experience."

  I ask you to resist that temptation. Stay with the discomfort. The friction between our lived sense of time moving forward and the possibility that there is no global forwardness in physics is not a problem to be solved by the end of the weekend. It is the engine of the inquiry. If we leave here feeling slightly less certain about what "tomorrow" means, but more curious about why we ask the question at all, then we will have succeeded.

  Welcome to the symposium. Let us begin.
