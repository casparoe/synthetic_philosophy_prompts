answer: |-
  Good morning, everyone. Welcome to "Infrastructure and Contingency."

  Look around the room. We have a pretty specific demographic split today. On one side, we have the people who actually calculate the load-bearing capacity of a levee. On the other, we have the people who analyze the texts of the people who wrote about power five hundred years ago. Usually, these groups don't talk unless there's a grant application involved.

  I mention this because I was discussing this workshop with a friend of mine who does hydraulic modeling. When I told her I was planning to anchor the opening remarks in Machiavelli, she genuinely got annoyed. And I get it. To an engineer, bringing Machiavelli into a conversation about flood barriers can sound like I'm trying to smuggle philosophy into a technical meeting. Like I'm going to tell you that your risk models are wrong because you haven't read *The Prince*.

  That is not what I'm doing. I'm not here to tell the engineers to be more Machiavellian, and I'm not here to tell the theorists that their texts have practical applications. I'm here because I think the specific vocabulary Machiavelli uses—specifically *fortune* and *virtù*—describes the exact tension this workshop is trying to explore.

  In Chapter 25 of *The Prince*, Machiavelli offers a famous analogy. He asks us to imagine fortune not as a wheel, but as a violent river. When it rains hard, these rivers swell, tear up trees, destroy buildings, and shift the earth from one place to another. Everyone runs away; everyone yields to the fury. But he notes that this doesn't mean we are helpless. When the weather is calm, humans can build embankments and dykes. So that when the river rises again, the water is either channelled away or its force is less brutal.

  This is where I want us to start. But I want to push on how we define the human response. In modern engineering ethics, we often talk about "resilience" or "robustness." These are static qualities. You build the wall strong enough, and it holds. But Machiavelli's *virtù* isn't just about building a wall that doesn't break. It's about the capacity to actively redirect the flow in real time. It's aggressive management, not passive resistance.

  This creates a genuine friction with how we design infrastructure today. Modern engineering prizes predictability. We aim for risk-neutral design, where we calculate the probability of a flood and build to withstand it. Machiavelli would argue that this is a trap. You cannot predict the flood perfectly. *Virtù* is the ability to adapt when the model fails. It's the difference between building a barrier that hopes nothing happens, and building a system that allows you to intervene when things do.

  Now, I know I have to address the other half of that analogy, because it's glaring. Machiavelli explicitly genders fortune as a woman. He says she is impetuous and that she favors the young and bold who approach her with more audacity. He uses language about driving her back and beating her into submission.

  I am not standing here to endorse that imagery. But I do want to understand why he uses it. For Machiavelli, the gendered metaphor isn't just misogyny; it's a specific argument about agency. He thinks passive resistance fails. If you wait for fortune to be kind, you lose. If you try to negotiate with the flood, you drown. He uses that violent imagery to shock the reader out of the idea that you can safely wait out a crisis. He's arguing that contingency requires forceful intervention. Whether we agree with his metaphor or not, the underlying question remains: When the water rises, is there a middle ground between total submission and violent domination? That's a question for both the modelers and the theorists in this room.

  Finally, I want to complicate the math. Machiavelli suggests a neat split: half of our life is controlled by fortune, and half by *virtù*. A fifty-fifty division.

  But look at the rivers we manage today. They aren't wild nature anymore. The "fortune" we face isn't a purely external force. The river's course is already shaped by prior human decisions—old levees, upstream dams, zoning laws from fifty years ago that put houses in the floodplain. The "natural" disaster is already baked with political and structural choices.

  So, the fifty-fifty split gets messy. When the flood comes, is it fortune? Or is it the failure of past *virtù*? If the river overflows because an upstream dam was maintained poorly, that isn't fate. That's legacy infrastructure. This means we can't treat contingency as something that happens *to* us from the outside. We are already inside the system we are trying to manage.

  So, over the next two days, I don't want us to solve this. I want us to sit with the messiness. When the engineers talk about overflow, and the theorists talk about contingency, I want us to see if we can find a shared language. Not to make the engineers into philosophers, or the philosophers into engineers. But to acknowledge that when we build barriers against the unknown, we are making a political claim about what deserves to be saved, and what deserves to drown.

  Let's have a great workshop. Thank you.
