  ### Repairing Your Gloss

  You offered: *"Intent-aligned means it writes the scene the brief is for; value-aligned means it writes the scene I'd still recognize, rereading in five years, as belonging to this book."*

  **Repair:**
  *   **Intent-Aligned:** It writes the scene **you meant to ask for** (including the subtext you didn't write).
  *   **Value-Aligned:** It writes the scene **that serves the book's ultimate good** (even if you didn't know you needed it).

  **Why the repair?** Your gloss conflates "Intent" with "Brief." In alignment, if you write a bad brief, an Intent-Aligned AI should *correct* you (if it understands your intent). But currently, your "Understudy" is **Brief-Aligned** (Literal) but **Intent-Misaligned** (Pragmatic). It lacks the confidence to be Value-Aligned except by accident (Case 3).

