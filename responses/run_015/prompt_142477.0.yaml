answer: |-
  This is a classic move in the philosophy of physics, often associated with **Structural Realism**. Your roommate is conflating several distinct claims to win a debate about physicalism. The slogan "we only ever know the structure, never the stuff" is a chameleon: it looks like a humble epistemic limitation when challenged, but acts like a hard ontological denial when he wants to rule out consciousness.

  Here is the menu of precise claims hidden behind that one-liner, evaluated by your criteria.

  ### The Menu of Claims

  | Claim Type | Precise Formulation | Type of Structure | Status | Does it block "extra ingredients" (consciousness)? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Methodological Platitude** | "Our physical theories are expressed as mathematical models, which describe relations between variables." | Formal / Mathematical | **Platitude.** True by definition of how physics is done. | **No.** This describes our *maps*, not the *territory*. It leaves open whether the territory has non-structural features. |
  | **2. Epistemic Structural Realism (ESR)** | "Human cognition is limited to grasping relations. We cannot know the intrinsic nature of the relata (the 'stuff')." | Formal / Causal | **Substantive Thesis.** (Kantian). Plausible, but not proven. | **No.** In fact, it **helps your side.** If physics only describes structure, the "intrinsic nature" is left empty. Consciousness could *be* that intrinsic nature (see Russellian Monism below). |
  | **3. Causal Structuralism** | "Physical properties are *defined* entirely by their causal/nomic roles. To be an electron just is to play a specific role in the causal network." | Causal / Nomic | **Substantive Thesis.** Defended by Shoemaker, Bird, etc. | **Maybe.** If consciousness has causal powers, it must fit the structure. If it doesn't, it's epiphenomenal. But it doesn't prove consciousness *isn't* the intrinsic nature of the causal base. |
  | **4. Ontic Structural Realism (OSR) - Moderate** | "Objects are not fundamental; they are derivative nodes in a structure. There is no 'stuff' underlying the relations." | Causal / Physical | **Controversial.** Hard to make coherent without slipping into (5). | **Yes, if coherent.** If there are no objects with intrinsic natures, there is no 'hook' for consciousness to hang onto, unless consciousness is also structural. |
  | **5. Ontic Structural Realism (OSR) - Radical** | "Structure is all there is. Relations exist without relata. 'Stuff' is a confused legacy concept." | Purely Structural | **Likely False / Incoherent.** (See "Sticking Point 2" below). | **Yes,** but at the cost of making the theory unintelligible. |
  | **6. The Ramsey Sentence Move** | "The content of physics is captured by its Ramsey Sentence (existentially quantifying over theoretical terms). This captures all factual content." | Logical / Causal | **Substantive.** Associated with Carnap/Lewis. | **No.** Newman's Problem (see below) shows the Ramsey sentence captures almost nothing unless restricted to *natural* properties, which reintroduces "stuff." |

  #### The "Cheat" Your Roommate Is Pulling
  He is sliding from **Claim 1** (which is undeniable but harmless) to **Claim 5** (which does the work of ruling out consciousness) without arguing for the transition.
  *   **Claim 1** says: "Our *description* is structural."
  *   **Claim 5** says: "Reality *is* structural."
  *   **The Gap:** Just because our map uses latitude and longitude doesn't mean the earth is made of grid lines.

  ---

  ### Sticking Point 1: The Triviality Worry (Newman's Problem)

  You asked: *"If structure just means the formal relations, isn't there an old worry that 'we know the structure' collapses into almost nothing?"*

  Yes. This is **Max Newman's Objection (1928)**, raised against Bertrand Russell. It is the perfect weapon to use here.

  **The Argument:**
  1.  Suppose your roommate claims: "All we know is that the world has mathematical structure $S$."
  2.  If "structure" means purely logical/set-theoretic relations (e.g., symmetric, transitive, one-to-one mappings), then **any** collection of objects can be arranged to fit structure $S$, provided there are enough of them.
  3.  *Example:* If I say "The world has the structure of a group," and you have enough distinct objects, you can define a relation among them that satisfies the group axioms.
  4.  **Conclusion:** Asserting "The world has structure $S$" tells you nothing about the world except **how many objects there are** (cardinality). It conveys zero physical information.

  **How to deploy this:**
  Tell him: "If you mean purely mathematical structure, you've run into Newman's Problem. Any set of $N$ things can instantiate any mathematical structure of size $N$. So saying 'physics captures the structure' is trivial unless you specify that the relations are **physical/causal**, not just logical. But if you admit the relations are *physical*, you've admitted there's a specific nature to the relations that isn't just 'structure'—you've smuggled 'stuff' back in."

  To avoid Newman's Problem, he must claim the structure is **causal/nomic** (Claim 3 above). But then he has to explain why consciousness can't be part of that causal structure, or why it can't be the intrinsic nature *of* that structure.

  ---

  ### Sticking Point 2: Relations without Relata

  You asked: *"Does the strong ontic version... even make sense on its own, or does it quietly need objects hanging around to hold the relations up?"*

  This is the **"No Relations without Relata"** objection. It is the standard critique of Radical OSR (Claim 5).

  **The Problem:**
  A relation is inherently dyadic (or polyadic). "To the left of," "repels," "entangled." These are *adjectival*. They require nouns. If you say "There is only 'repelling'," the immediate question is "What is repelling?"
  *   If he says "Other relations repel," you get an infinite regress (relations relating relations).
  *   If he says "Nothing repels, there is just the repelling," it sounds mystical or incoherent.

  **The Roommate's Likely Defense (and the counter):**
  *   **Defense:** He might cite James Ladyman or Don Ross (*Every Thing Must Go*), who argue that modern physics (specifically QM and GR) shows that objects dissolve into fields or symmetry groups. They argue for "free-standing structure."
  *   **Counter:** Even fields are properties *of* spacetime (or spacetime itself is the substance). Even in QM, you need a Hilbert space and a state vector. The math requires a domain.
  *   **The Trap:** If he admits there must be *something* that instantiates the structure (relata), he must admit we don't know what it is (returning to Epistemic Structural Realism). If we don't know what it is, **he cannot rule out that it is conscious.**

  ---

  ### The "Checkmate": Russellian Monism

  There is a specific philosophical position that exploits exactly the gap your roommate is trying to close. It is called **Russellian Monism** (or Panprotopsychism).

  **The Argument:**
  1.  **Premise 1 (Agreed by Roommate):** Physics describes only the *structural/relational* properties of matter (mass, charge, spin are defined by how they interact).
  2.  **Premise 2 (Agreed by Roommate):** Physics tells us nothing about the *intrinsic nature* of the entities bearing these relations (the "stuff" itself).
  3.  **Observation:** We have direct access to one bit of intrinsic nature: our own consciousness (via introspection).
  4.  **Conclusion:** Consciousness is likely the intrinsic nature of the physical stuff that physics describes structurally.

  **Why this hurts his argument:**
  Your roommate is using "we only know structure" to say "therefore there is no room for consciousness."
  Russellian Monism uses "we only know structure" to say "therefore there is **plenty of room** for consciousness, because physics leaves the intrinsic nature blank."

  If he insists there *is* no intrinsic nature (Radical OSR), he faces the "Relations without Relata" incoherence. If he admits there *is* an intrinsic nature (Epistemic SR), he cannot claim physics has "left nothing out," because physics by definition ignores the intrinsic nature.

  ### Summary for the Fight

  1.  **Call out the Equivocation:** Ask him to specify if he is making an *epistemic* claim (we can't know the stuff) or an *ontological* claim (the stuff doesn't exist).
      *   If **Epistemic**: He can't rule out consciousness (it might be the stuff we can't see structurally).
      *   If **Ontological**: He has to solve the "Relations without Relata" problem.
  2.  **Deploy Newman:** If he says structure is just mathematical relations, point out that *any* world fits *any* structure. He needs *causal* structure.
  3.  **The Russellian Pivot:** Remind him that if physics is purely structural, it is silent on intrinsic nature. Consciousness is the only intrinsic nature we know. Therefore, structuralism is actually an argument *for* consciousness being fundamental, not against it.

  His slogan is a shield that turns into a sword depending on which way he holds it. Your job is to freeze his hand in one position.
