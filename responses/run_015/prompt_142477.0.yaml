  My roommate (physics PhD, very online) ends basically every argument with some version of 'we only ever know the structure, never the stuff itself.' Last night the fight was about whether a finished physics would leave anything out: he says no, and moreover that asking what the electrons are in themselves, over and above how they relate to everything else, is a pseudo-question, so theres no room for consciousness to be some extra ingredient on top of the physical facts. When I pushed him he admitted the slogan covers a much weaker thing too — that all our theories are mathematical, so anything we assert is structural by default — and then used that weaker version as if it already gave him his conclusion, which felt like cheating.

  Can you lay out the menu of precise claims that one-liner could be standing for: claims about what we can know, claims about what there is, claims about what our words could even mean, and versions that differ in which structure is doing the work (formal or mathematical relations vs causal and nomic ones)? For each, say whether its a platitude, whether its a substantive thesis someone could defend, whether its actually false, and whether it would really get him the no-extra-ingredients result.

  Two things Im stuck on. First: if structure just means the formal relations, isnt there an old worry that 'we know the structure' collapses into almost nothing, because for basically any collection of things you can find relations that fit whatever pattern you like? I cant reconstruct the argument and Id like to bring it to him. Second: does the strong ontic version — there is no stuff, only structure — even make sense on its own, or does it quietly need objects hanging around to hold the relations up?
