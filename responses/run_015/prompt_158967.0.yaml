      *(Refining Empirical Exposure)*: Be honest. BU is empirically equivalent to Presentism *if* Presentism accepts a hidden preferred frame (Lorentzian Poincaré style). So BU isn't directly testable over *all* rivals, only over rivals that deny SR. But if SR is fundamental, BU is the natural ontological reading.

