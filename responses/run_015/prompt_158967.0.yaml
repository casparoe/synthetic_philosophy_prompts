          *   Quantum Collapse (Objective Collapse theories). If collapse picks out a specific hypersurface, that looks like a "Now."
          *   The "Transitivity" gap (Stein's objection). If reality is frame-relative, you get "Block-per-Frame," not "One Big Block."

      *   *Serious/Structural:*
          *   The "Become" vs. "Be" distinction. Maybe reality isn't about existence but about *happening*.
