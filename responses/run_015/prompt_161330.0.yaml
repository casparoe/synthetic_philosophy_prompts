  In a national metrology institute, a team introduces the term "one Volt" ($1V$) by baptizing the potential difference *actually* exhibited by a specific Weston Cell ($W$) at time $t_0$, asserting the sentence: **"The potential of $W$ is $1V$."** Initially, the reference of '$1V$' is fixed by the rigidified description "the potential $W$ actually has," rendering the sentence knowable *a priori* by stipulation but contingent, as $W$ could have degraded or been manufactured differently. Decades later, after theoretical advances establish that $W$'s potential is governed strictly by the Josephson constant ($K_J$), the community shifts to fixing the reference of '$1V$' directly to the value derived from $K_J$ (a rigid designator for a fundamental constant), while maintaining by convention that the referent remains the original magnitude. The sentence **"The potential of $W$ is $1V$"** is now known only *a posteriori* via measurement of $K_J$, but it expresses an identity between two rigid designators of the same quantity, rendering it necessary.

  ### The Work

  **1. The Sentence and Terms**
  *   **Sentence:** "The potential of $W$ is $1V$."
  *   **Terms:** '$W$' (Rigid designator: the specific artifact cell); '$1V$' (The term undergoing semantic shift); 'The potential of' (Function mapping object to magnitude).
  *   **Rigid Designators:** '$W$' is rigid (it picks out the same cell in all possible worlds). In Stage 2, '$1V$' becomes a rigid designator (picking out the same magnitude in all worlds, independent of $W$). In Stage 1, '$1V$' is a rigidified description ("the potential $W$ *actually* has"), which designates rigidly but derives its reference via a description.

  **2. Modal and Epistemic Verdicts**
  *   **Stage 1 (Calibration by Artifact):**
      *   **Epistemic:** *A Priori*. The lab stipulates the definition; no measurement is required to know $W$ defines the volt.
      *   **Modal:** Contingent. $W$ is a physical artifact subject to drift; in a counterfactual world where $W$ oxidizes faster, its potential differs, though '$1V$' still refers to the *actual* world's potential.
  *   **Stage 2 (Calibration by Constant):**
      *   **Epistemic:** *A Posteriori*. It requires empirical physics to discover that $W$'s potential aligns exactly with the constant-derived value.
      *   **Modal:** Necessary. Both 'The potential of $W$' (rigidified to the actual magnitude) and '$1V$' (rigidly designating that magnitude via $K_J$) pick out the same quantity in all possible worlds. The identity holds necessarily.

  **3. The Single Feature Doing the Work**
  *   **Feature:** The transition from a **rigidified description** ("the magnitude $W$ *actually* has") to a **rigid designator grounded in natural law** ("the magnitude determined by $K_J$").
  *   **If Removed:** If '$1V$' remained a non-rigid description ("whatever potential $W$ has"), the sentence would remain Contingent *A Priori* (or become analytic). If '$1V$' were introduced by pure ostension without the "actually" operator in Stage 1, the sentence might be deemed Necessary *A Priori* (Kripke's worry about the meter stick), destroying the flip. The "actually" operator secures the contingency in Stage 1; the natural kind grounding secures the necessity in Stage 2.

  **4. The Description Theorist's Objection**
  *   **Objection:** A defender of the Description Theory (Frege/Russell) will argue that the *sense* (meaning) of '$1V$' changed between stages. In Stage 1, the sense is "potential of $W$"; in Stage 2, it is "potential derived from $K_J$." Therefore, the proposition expressed changed, and there is no single sentence that flipped modal status—only two different sentences sharing a label.
  *   **Cost:** This reply saves the theory by denying the continuity of the proposition, but it costs the ability to explain **reference stability across theory change**. If meaning is sense, and sense changed, the community should be talking past one another (incommensurability). Yet, in metrology, we successfully maintain the *same unit* across redefinitions. The Description Theorist must explain how we preserve the referent while changing the sense without admitting that reference is semantically prior to sense (the Kripkean point).

  **5. The Case of Approximate Preservation (The Kilogram Redefinition)**
  *   **Scenario:** In the 2019 SI redefinition, the kilogram was fixed to Planck's constant ($h$). The International Prototype Kilogram (IPK) is no longer *exactly* 1 kg by definition; its mass is now a measured quantity subject to uncertainty.
  *   **Outcome:** The sentence "The mass of IPK is 1 kg" becomes **Contingent *A Posteriori*** (and possibly false). The "Necessary" status collapses because the referent was *not* held perfectly fixed; the convention allowed a slight shift to secure the constant. This demonstrates that the Necessary *A Posteriori* status in the idealized scenario above relies on the **stipulation of exact continuity**. In real practice, when continuity is approximate, the identity is empirical and contingent, revealing that the "Necessary *A Posteriori*" in measurement is an idealization of the limit where artifact and constant converge perfectly.
