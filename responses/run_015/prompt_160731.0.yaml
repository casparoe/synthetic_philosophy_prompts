  - Build it from the logical space first, not from a list of famous views: give me four or five separating questions and the answer combinations they allow, then place the actual positions in that space, and tell me which combinations are empty and why (incoherent, unattractive, or just unexplored).
  - Each branch question should be a concrete case my neighbours can answer without knowing any theory, and no question should just be "is money real?". Please work at least these in: hours tokens accepted at the corner shop only because each shopkeeper believes everyone else values them, while privately nobody does; a currency everyone is convinced is collapsing but which still prices everything because the tax office insists on it; a census race category from a colonial administration nobody has used for sixty years, but which still predicts who gets turned down for a mortgage; a gender category assigned by a ceremony where the person's own sense of themselves carries no weight; and a clustering category invented by an ad-targeting model that no human accepts, knows about, or could state, but which shapes who sees which job ads.
  - Six to nine leaves, each with a plain-English name (or "unnamed — nobody defends this") and one sentence on its most awkward commitment. Flag any pair of leaves my questions can't actually separate rather than pretending they're distinct.
  - No author names, readings or citations — these are retirees and parents, I don't want the meeting to turn into a bibliography.
  - One line at the end: which branch, if we answered it the other way, is the one that would actually change whether we think we're issuing money.
