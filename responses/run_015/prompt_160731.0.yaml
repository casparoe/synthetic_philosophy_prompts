answer: |-
  ### The Four Separating Questions

  To map out where your group stands, answer these four questions. They are not about definitions, but about how things *work* in the real world.

  1.  **The Corner Shop Question (Belief):** If every shopkeeper privately thinks your timebank hours are worthless but accepts them because they believe *everyone else* will, do the hours have real value?
      *   *Yes:* Value exists in the system, not the head.
      *   *No:* Value requires honest personal belief.
  2.  **The Algorithm Question (Awareness):** If a computer sorts people into groups that change their lives (e.g., who sees job ads), but no human knows these groups exist, are those groups real social categories?
      *   *Yes:* Effects make it real, even if invisible.
      *   *No:* If people don't know it, it's just math, not society.
  3.  **The Tax Office Question (Consent):** If a currency is kept alive only because the government punishes you for not using it (not because anyone trusts it), is it still money?
      *   *Yes:* Power and rules make it real.
      *   *No:* Money requires voluntary trust.
  4.  **The Census Question (Origin):** If a category (like a race or gender label) was created by rulers long gone, is no longer used in conversation, but still determines who gets loans, is that category currently active?
      *   *Yes:* History and structure keep it alive.
      *   *No:* If nobody endorses it now, it's dead.

  ***

  ### The Map of Positions (Leaves)

  There are 16 possible ways to answer these questions (Yes/No combinations). Most are incoherent. Here are the seven coherent positions your neighbours might actually hold.

  **1. The "Common Sense" View**
  *   **Answers:** Yes Belief, Yes Awareness, Yes Consent, Yes Origin.
  *   **Awkward Commitment:** You must argue that if a community stops believing in a currency tomorrow, it instantly ceases to be money, even if the banks still process it.

  **2. The "Institutional" View**
  *   **Answers:** No Belief, Yes Awareness, No Consent, Yes Origin.
  *   **Awkward Commitment:** You must accept that your timebank hours become "money" the moment a shop accepts them, even if nobody personally trusts the hours themselves.

  **3. The "Structural" View**
  *   **Answers:** No Belief, No Awareness, No Consent, No Origin.
  *   **Awkward Commitment:** You have to admit that people are being racially profiled by categories that nobody believes in, nobody knows about, and nobody currently uses.

  **4. The "Collective Pretend" View**
  *   **Answers:** No Belief, Yes Awareness, Yes Consent, Yes Origin.
  *   **Awkward Commitment:** You must claim that society is essentially a game where everyone agrees to treat fake things as real, and that this makes them real.

  **5. The "Living History" View**
  *   **Answers:** Yes Belief, Yes Awareness, Yes Consent, No Origin.
  *   **Awkward Commitment:** You must argue that a colonial race category stops being real the moment people stop saying the name out loud, even if the mortgage refusals continue.

  **6. The "Black Box" View**
  *   **Answers:** No Belief, No Awareness, No Consent, Yes Origin.
  *   **Awkward Commitment:** You must accept that old rules (like assigned gender at birth) control your life even if you don't believe in them and don't know how they are being applied.

  **7. The "Forced Faith" View**
  *   **Answers:** Yes Belief, Yes Awareness, No Consent, Yes Origin.
  *   **Awkward Commitment:** You must argue that people can be forced to genuinely believe in a currency just because the tax office demands it.

  ***

  ### Empty and Indistinguishable Spaces

  *   **The "Mind-Reading" Gap (Empty):** Any combination with **No Awareness** but **Yes Belief** is incoherent. You cannot privately believe in a category you do not know exists.
  *   **The "Willing Sceptic" Gap (Unstable):** Any combination with **No Belief** but **Yes Consent** is psychologically unstable. People rarely voluntarily participate in systems they privately deem worthless unless forced (which moves them to "No Consent").
  *   **Indistinguishable Pair:** The **"Black Box" View** and the **"Structural" View** are functionally identical for your neighbours. Whether the historical origin matters (Yes/No Origin) is irrelevant if nobody knows the category exists and nobody consents to it; the outcome (invisible control) is the same.

