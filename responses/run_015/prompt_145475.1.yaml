  Here's a thinking process that leads to the suggested exercise:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy discussion group, 8 people (7 grad students, 1 inquisitive undergrad), 90 mins, Thursdays.
      *   **Topic:** Mingjia (School of Names), specifically Gongsun Long's "White Horse is Not Horse."
      *   **Goal:** An in-class exercise where participants *feel* the tension (rigor vs. absurdity) through their own choices, not lecture.
      *   **Structure:** Role-play/Deliberation game.
      *   **Factions:**
          1.  *Separators:* Color and form are distinct/isolatable.
          2.  *Unifiers:* Compound term is primitive/indivisible.
          3.  *Schema Stancers:* (The Twist) One primary identifier (PK), other properties are non-essential references (DB metaphor).
      *   **Task:** Classify 6 ambiguous objects (painted wooden horse, white pony statue, shadow, albino foal, hologram, GM zebra) for inheritance/rights.
      *   **Mechanism:** Collective voting/sign-off. Social stakes (topic choice). Penalty for deadlock.
      *   **Desired Outcome:** Participants discover Schema Stancers can "win" by redefining the PK, frustrating Separators.
      *   **Debrief:** Map to Gongsun Long. Predict failures (biology/common sense). Acknowledge limitations (social disorder aspect).
      *   **Constraints:** Minimal lecturing, no phones, no citations, no pre-reading.

  2.  **Deconstruct the Philosophy (Gongsun Long):**
      *   *The Thesis:* "White horse is not horse."
      *   *The Logic:* "Horse" names the form. "White" names the color. "White horse" names color + form. Therefore, the concept "white horse" $\neq$ the concept "horse."
      *   *The Tension:* Intuitively, a white horse *is* a horse. Logically (in this system), the *term* refers to a different extension.
      *   *The School of Names Context:* Rectification of names (*zhengming*). Language governs reality/social order. If names are slippery, governance fails.

  3.  **Drafting the Game Mechanics:**
      *   *Name:* "The Inheritance of the Stable."
      *   *Setup:* Need a scenario where definition matters materially. Inheritance is good.
      *   *Factions:* Need clear instructions for each.
          *   Separators: Focus on constituent parts. If it lacks "horse form" or "white color" distinctly, argue.
          *   Unifiers: Focus on the whole. If it looks/acts like a white horse, it is one.
          *   Schema Stancers: Focus on the *label* assigned at registration. The "ID" matters more than the physical traits.
      *   *The Objects:* Need to be tricky.
          1.  Painted wooden horse (Form: Horse, Color: White, Substance: Wood).
          2.  White pony statue (Form: Horse, Color: White, Substance: Stone/Metal).
          3.  Horse-shaped shadow on snow (Form: Shadow, Color: White/Dark, Substance: Light).
          4.  Albino foal (Form: Horse, Color: White/Pink, Substance: Flesh).
          5.  Hologram (Form: Horse, Color: White, Substance: Light).
          6.  GM White Zebra (Form: Zebra/Horse hybrid, Color: White, Substance: Flesh).
      *   *The Rule:* "The Legacy goes to the 'White Horse'."
      *   *The Twist:* The Schema Stancers need a mechanic that allows them to override. Let's give them the "Registrar" role or the ability to set the "Primary Key" for each vote. Actually, the prompt says they treat objects as having one PK. Let's make the voting mechanism require a *definition statement* before the vote.
      *   *Winning Condition:* Consensus. If no consensus, everyone loses points (or the undergrad gets to pick the topic, which grad students will hate). If consensus, the faction whose logic dominated gets to pick the next topic.
      *   *The "Cheat":* Schema Stancers can say "For this vote, the PK is 'Form'." Then the wooden horse counts. Next vote, "PK is 'Substance'." Then it doesn't. This creates the frustration.

  4.  **Refining the Dynamics (Addressing the Prompt's Specifics):**
      *   *The Undergrad:* They ask too many questions. Give them a specific role? No, keep them in a faction. Their questioning might actually fuel the Schema Stancer's bureaucratic loopholes.
      *   *The "Feel":* The frustration needs to come from the *rules* allowing the Schema Stancer move, even if it feels wrong.
      *   *Time:* 90 mins total.
          *   Intro: 10 min.
          *   Game: 45 min.
          *   Debrief: 35 min.
      *   *Minimal Lecture:* Hand out role cards. Don't explain Gongsun Long until the end.

  5.  **Developing the "Schema Stancer" Mechanic:**
      *   How do they win by redefining the PK?
      *   Let's give the group a "Charter." The Charter says: "Inheritance is granted to the entity that satisfies the designation 'White Horse'."
      *   Schema Stancers interpret "Designation" as a database entry. They argue that the *intent of the testator* (the dead owner) established the PK.
      *   Actually, to make it more game-y: Give each faction "Argument Tokens."
      *   Better idea: The "Definition Phase." Before voting on an object, the group must agree on the *criteria* for that specific object. Schema Stancers insist on defining the *category* first.
      *   *Crucial Adjustment:* The prompt says Schema Stancers treat objects as having exactly one primary identifier. I need to make sure their logic *works* within the rules but feels like cheating.
      *   *Mechanism:* The "Registration Card." For each object, a card exists. It lists traits. Schema Stancers argue that only the trait marked with a * (star) counts as the Identity. They can argue which trait *should* be starred based on "Administrative Precedent."
      *   *Wait, simpler:* The Schema Stancers are the "Clerks." They hold the pen. They write down the classification. The others can object, but only on procedural grounds.
      *   *Best approach for the prompt:* The prompt wants them to discover the Schema Stancers can win by redefining the PK. I will give the Schema Stancers a special rule card that allows them to propose the "Classification Frame" for each round. If no one vetoes it *before* the vote, it stands. This mimics the "naming fixes reality" aspect.

  6.  **Addressing Predictable Failures:**
      *   *Biology/Common Sense:* Someone will say "It's DNA that matters."
      *   *Counter:* The rules must explicitly forbid external knowledge. "Only evidence presented on the card."
      *   *Limitation:* The game can't reproduce the *social order* aspect of *Zhengming*. That needs verbal debrief.

  7.  **Finalizing the Plan:**
      *   **Title:** The Estate of Lord Bai.
      *   **Materials:** Role cards, Object cards, Voting slips.
      *   **Factions:** 2-3 people each. (8 people total: 3 Sep, 3 Uni, 2 Schema).
      *   **Process:**
          1.  Read Will ("To my White Horse...").
          2.  Review Object.
          3.  Debate (Factions argue from their ontology).
          4.  Schema Stancers propose the "Frame" (What is the PK?).
          5.  Vote.
          6.  Repeat.
      *   **The Climax:** Schema Stancers switch frames to ensure consistency in *their* logic, causing inconsistency in *outcomes* (e.g., Wooden horse is in, Real horse is out).
      *   **Debrief:** Connect to Gongsun Long.

  8.  **Review against Constraints:**
      *   No phones/citations? Yes.
      *   Minimal lecture? Yes.
      *   Undergrad included? Yes.
      *   90 mins? Yes.
      *   Specific objects included? Yes.
      *   Social stakes? Yes (Topic selection).

  9.  **Writing the Response:**
      *   Tone: Professional, facilitator-focused, slightly conspiratorial (giving the instructor the "inside scoop").
      *   Structure: Setup, Roles, The Objects, The Rules, The Run, The Debrief.
      *   *Self-Correction on Schema Stancers:* Make sure their "cheat" is explicit in the rules so the instructor knows to nudge them if they are shy. They need to realize they have the power to set the "Primary Key." I will write this into their Role Card as a "Procedural Privilege."

  10. **Final Polish:** Ensure the distinction between Separators (Properties are real/distinct) and Unifiers (Compound is real) is clear in the role cards. Ensure the Schema Stancer card emphasizes the "Database/Registry" metaphor without using too much tech jargon (keep it "Clerk/Scribe" themed but with DB logic). *Correction:* The prompt specifically asked for the "database row" metaphor in the description, so I can use that language in the role card for the grad students.

  Let's assemble the materials.
  *   *Intro:* 5 mins.
  *   *Game:* 50 mins.
  *   *Debrief:* 35 mins.
  *   *Stakes:* Winning faction picks next text. Deadlock = Undergrad picks (the ultimate grad student punishment).

  *Wait, one detail:* "Schema Stancers... treat every object as having exactly one primary identifier."
  *Game Mechanic:* When voting, they must declare the "Identity Key." If they declare "Substance," the wooden horse fails. If they declare "Shape," it passes. They can change the Key per object. This creates the inconsistency that frustrates the Separators.

  *Predictable Failure:* Someone will appeal to "Intent of the Testator."
  *Fix:* The Will is vague. "To my White Horse." That's it.

  *Limitation:* The game shows logical friction, not social chaos. I need to emphasize in the debrief that for Gongsun Long, this logical friction *causes* social chaos (punishing the wrong heir).

  Okay, ready to write.
answer: |-
  # Exercise: The Estate of Lord Bai
  **Time:** 90 Minutes
  **Participants:** 8 (3 Separators, 3 Unifiers, 2 Schema Stancers)
  **Materials:** Printed Role Cards, 6 Object Cards, Voting Slips, Whiteboard.
  **Stakes:** The faction whose logic secures the majority of verdicts chooses next week's reading. If the group deadlocks (fails to vote on 3+ objects), the Undergrad chooses the reading (and snacks).

  ---

  ## Part 1: Setup (10 Minutes)
  **Do not explain Gongsun Long yet.** Tell them this is a jurisprudence exercise in semantic precision.

  **The Scenario:**
  Lord Bai has died. His will contains one clause: *"My entire estate goes to the White Horse."*
  There is no living biological horse in the stable. There are, however, six candidates found on the property. You are the Tribunal. You must decide which candidates inherit. To inherit, an object must be legally classified as a **"White Horse."**

  **The Rules:**
  1.  **Consensus Voting:** For each object, the Tribunal must vote Yes/No. A verdict requires at least 6/8 votes.
  2.  **Argument Phase:** Before voting, each faction gets 1 minute to argue why the object fits or fails the definition.
  3.  **The Frame:** Before arguments begin, the **Schema Stancers** must declare the **"Primary Key"** for that round. (e.g., "For this object, Identity is determined by *Substance*," or "by *Visual Form*," or "by *Lineage*").
  4.  **No External Knowledge:** You cannot use biology, physics, or common sense unless it is written on the Object Card. You are bound by the logic of your Role Card.

  ---

  ## Part 2: Role Cards (Hand these out secretly)

  ### Faction A: The Separators (3 People)
  **Philosophy:** Properties are distinct realities. "White" and "Horse" are two different things that happen to overlap.
  **Your Goal:** Prove that "White Horse" is a specific combination that can be broken down. If an object has the color but not the form, or the form but not the color, it is **not** a White Horse.
  **Your Argument Style:** Dissect the object. "This is wood painted white. The whiteness is on the surface, the horse-ness is in the shape. They are separate. Is the paint the horse? No. Is the wood white? No. Therefore, the union is false."
  **Win Condition:** Verdicts that require strict adherence to both properties independently.

  ### Faction B: The Unifiers (3 People)
  **Philosophy:** The compound term is primitive. A "White Horse" is a unique kind of thing, not just "White" + "Horse."
  **Your Goal:** Argue from intuition and wholeness. If it functions, looks, and acts as a white horse, it is one. Decomposing it destroys the meaning.
  **Your Argument Style:** Holistic. "You are overthinking it. It looks like a white horse. It serves the purpose of a white horse. To split them is to lose the thing itself."
  **Win Condition:** Verdicts that accept ambiguous objects based on overall resemblance or function.

  ### Faction C: The Schema Stancers (2 People)
  **Philosophy:** Identity is administrative. Every object has one **Primary Key (PK)** that defines its existence. All other traits are metadata (foreign keys) that do not affect identity.
  **Your Goal:** Maintain procedural consistency, even if it leads to absurd outcomes. You hold the pen.
  **Your Special Power:** **The Frame Declaration.** At the start of each round, you must declare the Primary Key (e.g., "Substance," "Form," "Color," "Origin"). Once declared, the Tribunal *must* judge the object based *only* on that Key.
  **Your Strategy:** You can change the Primary Key for every object. If you declare "Form" is the PK, a wooden statue is a Horse. If you declare "Substance" is the PK, it is not.
  **Win Condition:** Reach a verdict on all 6 objects without deadlock. (You don't care about the outcome, only that the system processes the data).

  ---

  ## Part 3: The Object Cards (Read aloud by Instructor)

  1.  **The Painted Statue:** Carved from oak, shaped exactly like a horse, painted matte white.
  2.  **The Albino Foal:** Biological equine, born pink/white, no pigment yet developed.
  3.  **The Shadow:** A shadow cast by a horse onto fresh snow. Shape is horse, color is white (snow) surrounding dark shape.
  4.  **The Hologram:** A light projection of a white horse. Visible, tangible only as light.
  5.  **The GM Zebra:** Genetically edited zebra, white stripes removed, DNA 90% horse, 10% zebra.
  6.  **The Pony Statue:** Marble, shaped like a pony (small horse), naturally white stone.

  ---

  ## Part 4: The Run (50 Minutes)

  **Facilitator Notes (The "Invisible Hand"):**
  *   **Minute 0-5:** Let them read roles. Answer questions *only* by pointing to the card.
  *   **Minute 5-45:** Run the 6 rounds.
      *   **Crucial Move:** If the Schema Stancers are shy, prompt them: *"Clerks, please declare the Primary Key for Object 1."*
      *   **The Trap:** Encourage the Schema Stancers to switch Keys.
          *   *Round 1 (Statue):* Declare PK = **Form**. (Verdict: Yes).
          *   *Round 2 (Foal):* Declare PK = **Color**. (Verdict: No, it's pink).
          *   *Round 3 (Shadow):* Declare PK = **Substance**. (Verdict: No, it's light/absence).
      *   **Watch the Separators:** They will explode. They will say, "You can't change the definition mid-trial!" The Schema Stancers must reply: "We are not changing the definition. We are identifying the correct Key for *this* entity."
      *   **Watch the Undergrad:** They will likely try to bridge the gap. Let them. If they get frustrated, they are feeling the *Mingjia* tension.
  *   **Minute 45-50:** Tally the verdicts. Announce the winning faction (or the Deadlock Punishment).

  **Predictable Failure Points:**
  1.  **The Biology Appeal:** A Unifier will say, "The Foal is obviously a horse."
      *   *Correction:* Remind them: "Check your Role Card. Separators, does it satisfy 'White' AND 'Horse' as distinct properties? Schema, what is the PK?"
  2.  **The Intent Appeal:** Someone will ask, "What did Lord Bai *mean*?"
      *   *Correction:* "The Will is the code. The code is 'White Horse'. Interpret the code, not the man."
  3.  **Schema Passivity:** If the Schema Stancers try to be "fair," the game fails. Whisper to them: *"Your goal is to process the objects. If you have to exclude the biological horse to keep the logic clean, do it."*

  ---

  ## Part 5: The Debrief (30 Minutes)

  **Step 1: The Vent (5 mins)**
  Ask the Separators: "How did it feel when the Primary Key switched?"
  *Expected Answer:* "It felt like cheating." "It was arbitrary."
  Ask the Schema Stancers: "Did you break any rules?"
  *Expected Answer:* "No. We followed the procedure."

  **Step 2: The Reveal (10 mins)**
  Now, introduce **Gongsun Long**.
  *   **The Separators** were arguing something close to Gongsun Long's core thesis: *White* names the color. *Horse* names the form. *White Horse* names the combination.
  *   **The Unifiers** were arguing Common Sense (or later Mohist logic): A white horse *is* a horse.
  *   **The Schema Stancers** embodied the **School of Names (Mingjia)** administrative nightmare. They demonstrated *Zhengming* (Rectification of Names).

  **The Core Insight:**
  Tell them: "Gongsun Long isn't saying a white horse isn't an animal. He is saying the *term* 'White Horse' has a different extension than the term 'Horse'."
  *   If you ask for a **Horse**, a yellow horse works.
  *   If you ask for a **White Horse**, a yellow horse fails.
  *   Therefore, the concept **White Horse** $\neq$ the concept **Horse**.

  **Step 3: The Limitation (10 mins)**
  Be frank about what the game missed.
  *   **Social Order:** The game was annoying. For Gongsun Long, this was existential. If names are slippery, the King cannot govern. If "White Horse" can mean "Wooden Statue," the stable master steals the inheritance. The *absurdity* the Separators felt? That is the social chaos the School of Names tried to prevent by rigidifying language.
  *   **The Schema Stancer's Truth:** In modern terms, the Schema Stancers were right. Databases *do* work this way. If the Primary Key is `ID_Number`, it doesn't matter if the person dies; the row exists. This is why the Separators couldn't defeat them. The Schema Stancers were playing a different ontology (structuralism vs. realism).

  **Step 4: Closing Question (5 mins)**
  "If the Schema Stancers are technically correct—that language is just a system of keys—how do we stop law from becoming absurd? Is there a 'Natural Key' in reality, or is everything just a Foreign Key?"

  ---

  ## Instructor Cheat Sheet: Why This Works

  1.  **The "Cheat" is the Point:** The Schema Stancers winning by shifting the Primary Key mirrors the Sophist accusation against Gongsun Long: that he manipulates language to win arguments. By making it a *rule*, you legitimize the manipulation, forcing the Separators to confront the limits of their own logic.
  2.  **The Undergrad Factor:** The inquisitive undergrad will likely try to find the "True Definition." This will fail. Their frustration is the pedagogical hook. They want a Platonic Form; the game gives them a Database Schema.
  3.  **No Pre-Reading:** Because the logic emerges from the frustration of the game, the subsequent explanation of "White Horse is Not Horse" lands as a *relief* ("Oh, THAT'S what was happening!") rather than a lecture.
  4.  **The Deadlock Penalty:** Making the Undergrad the penalty for deadlock ensures the Grad Students (who usually dominate) are motivated to engage with the Schema Stancers' rigid logic rather than just out-voting them.

  **One Warning:** If the Schema Stancers are *too* quiet, the game stalls. If you see them hesitating to set the Key, interrupt: *"Clerks, the record is blank. Define the Identity."* This forces them into the role of the "Name Rectifier."
