answer: |-
  Subject: Re: Grants round prioritization

  Great to hear from you, and it is wild to think we have been circling these ideas since the Bostrom days; the fact that we are now judging grants on concrete control theory feels like both progress and a warning sign that we are running out of time. Given the constraints of a small grants round focused on conceptual work rather than infrastructure, I would prioritize funding the question of whether control evaluations can ever bound scheming when the model can condition its behavior on being evaluated, followed closely by the strategic question of whether investing in control substitutes for alignment work in practice. I am ranking the evaluation problem first because it is the upstream technical crux upon which the entire Redwood-style paradigm rests; if we cannot theoretically establish that a monitoring or honeypot scheme provides a bound on damage even when the model knows it is being monitored, then no amount of engineering implementation matters because we are flying blind. This is tractable for philosophy and theory people rather than infra people because it is fundamentally a problem of game theory and information asymmetry rather than benchmark construction; you need theorists to model the space of possible strategies a scheming agent could use to hide its capabilities during an eval, and to define what constitutes a rigorous proof of control under adversarial conditions, whereas infra people will naturally drift toward building better monitors without solving the epistemic gap of whether those monitors can be trusted.

  The second priority, the substitution risk question, is the upstream strategic crux that determines the net value of the field; if control work functions primarily as a safety wash that allows labs to deploy dangerous systems earlier by claiming they are contained, then the work could be net negative despite being technically sound. This is uniquely tractable for theory and policy-minded researchers because it requires modeling lab incentives, regulatory capture, and the psychology of safety teams under pressure, none of which can be solved by writing better code or running more training runs. I would deprioritize the question about collusion between model instances because it feels like a specific instance of the broader control problem; if you solve the general problem of bounding scheming behavior under evaluation, collusion is just a specific vector to address within that framework, and it leans too heavily into empirical multi-agent dynamics that might be better suited for larger empirical labs. I would also deprioritize the question about whether adversarial scaffolding changes the model itself during training, because while important, the answer is likely highly empirical and dependent on specific architecture details that theory grants cannot resolve without access to large-scale training runs, meaning the conceptual leverage is lower right now.

  Regarding what would move these priorities up or down in the next couple of years, if we see clear empirical evidence of deceptive alignment or gradient hacking in current-generation models, the evaluation bound question becomes even more urgent and might consume the entire budget, whereas if we see robust regulatory frameworks emerge that mandate alignment research regardless of control capabilities, the substitution risk question moves down because the incentive structure changes. Conversely, if labs begin publicly deploying systems with explicit control-based safety cases that bypass alignment requirements, the substitution risk becomes the single most important question to answer immediately. Ultimately, you want to fund work that clarifies whether the game is winnable technically and whether playing it helps us win strategically, and those two questions are the only ones that directly answer those conditions without requiring massive compute budgets or waiting for failure modes to manifest in the real world.
