prompt: |-
  I'm a novelist and I've been stuck on a scene for weeks. My protagonist is in a fire and he can either pull out his wife or two strangers he doesn't know. He grabs his wife without even thinking about it. Later, another character — the kind of guy who reads a lot of philosophy — presses him hard: "Why was her life worth more than theirs? Give me the justification." And my protagonist just says "she's my wife" and the guy says that's not a reason, that's just restating the fact you're trying to justify.

  Here's the thing: I can't tell whether I'm writing my protagonist as philosophically shallow — like he should have a better answer and I need to give him one — or whether the friend's whole demand for a justification is what's broken. I have this gut feeling that having to justify saving your wife in terms of some impartial principle is itself a kind of moral mistake, like it misses what it actually means to love someone. But I can't articulate why. Is the demand for justification here the problem? And if so, what kind of problem is it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** A novelist is stuck on a scene.
      *   **Plot Point:** Protagonist saves wife from fire over two strangers.
      *   **Conflict:** A philosophically inclined friend challenges the protagonist: "Why was her life worth more? 'She's my wife' isn't a justification."
      *   **User's Intuition:** The demand for justification feels wrong. It seems like loving someone *means* prioritizing them without needing an impartial principle.
      *   **Core Question:** Is the demand for justification the problem? If so, what kind of problem is it? How can the user articulate this?

  2.  **Identify the Philosophical Core:**
      *   This is a classic debate in moral philosophy: **Partiality vs. Impartiality**.
      *   *Impartialism/Utilitarianism:* Every life counts equally. Saving two over one is mathematically better. Special relationships shouldn't override the greater good. (The Friend's stance).
      *   *Partialism/Virtue Ethics/Care Ethics:* Special obligations exist within relationships. Love *is* the justification. To demand an external reason is to misunderstand the nature of the relationship. (The Protagonist's/User's intuition).
      *   *Key Philosophers:* Bernard Williams (critique of utilitarianism), Michael Sandel (justice vs. love), Harry Frankfurt (care about what we care about), Susan Wolf (moral saints).

  3.  **Evaluate the "Demand for Justification":**
      *   Is it a category error? Yes. It treats a personal commitment like a public policy decision.
      *   Is it alienating? Yes. It asks the agent to step outside their own life and view it from a "view from nowhere."
      *   Does it undermine the virtue? Yes. If you save your wife *because* it maximizes utility, you aren't actually loving her; you're using her as a variable in a calculation.

  4.  **Formulate the Response Strategy:**
      *   **Validate the User:** Confirm their intuition is philosophically robust. They aren't writing a shallow character; they are touching on a deep philosophical tension.
      *   **Name the Problem:** Give the user terminology to work with (Impartiality vs. Partiality, The View from Nowhere, Category Error).
      *   **Provide Arguments/Articulations:** Offer specific ways the protagonist (or the narrative voice) can push back against the friend.
      *   **Dramatic Advice:** How to make this work in fiction (show, don't just tell; emotional weight vs. intellectual sparring).
      *   **Nuance:** Acknowledge that the friend isn't *evil*, just operating in a different register (public vs. private morality).

  5.  **Drafting the Content (Iterative Process):**

      *   *Validation:* Start by saying, "Your gut is right." This is a known philosophical problem.
      *   *The Philosophical Hook:* Introduce Bernard Williams. His "One Thought Too Many" is exactly this scenario. If a man saves his wife because it's his duty vs. because he loves her, the latter is the only human response.
      *   *The Category Error:* Explain that love isn't a transaction. It's a *constitutive commitment*. To ask "why" is to ask "why do you have these commitments?" which dissolves the commitment itself.
      *   *The Friend's Role:* The friend isn't necessarily wrong about *public* justice (firefighters shouldn't save their own wives first), but he's wrong about *private* morality.
      *   *Dialogue Options:* Give the user specific lines or angles.
          *   "If I had to calculate, I wouldn't be the man she married."
          *   "You're asking for a reason from outside the relationship, but the reason lives inside it."
          *   "To justify it would be to betray it."
      *   *Character Depth:* Saving the wife without thinking isn't shallow; it's instinctual virtue. The friend demanding reasons is the one being abstract/shallow in this context.

  6.  **Refining the Tone:**
      *   Keep it encouraging but intellectually rigorous.
      *   Avoid taking sides too heavily (acknowledge the friend's point has weight in other contexts), but support the user's narrative instinct.
      *   Focus on *articulation* since the user asked "I can't articulate why."

  7.  **Final Review against User Query:**
      *   Did I answer "Is the demand the problem?" Yes.
      *   Did I answer "What kind of problem?" Yes (Category error, alienation, misunderstanding of love).
      *   Did I help with the novel? Yes (offered dialogue and thematic angles).

  8.  **Final Polish:** (Self-Correction during drafting) *Make sure not to get too academic. Keep it applicable to writing.* *Emphasize that the protagonist's silence or simple answer is actually the stronger philosophical position.*

  **(Self-Correction Note):** I should mention that the friend's challenge is valid *politically* but invalid *personally*. This adds nuance. A firefighter *should* be impartial. A husband *should not*. Distinguishing the roles is key.

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Your gut instinct is not only correct; it is philosophically robust. You are stumbling upon one of the most famous debates in modern moral philosophy, specifically regarding **impartiality versus partiality**.

  You are not writing your protagonist as shallow. In fact, the friend's demand for an impartial justification is arguably the more shallow position in this specific context, because it treats a deeply personal commitment as if it were a public policy decision.

  Here is how you can articulate why the demand for justification is the problem, along with some philosophical frameworks and dramatic angles you can use to unlock the scene.

  ### 1. The Philosophical Name for This: "One Thought Too Many"
  The British philosopher Bernard Williams wrote a famous critique of utilitarianism (the idea that we must always maximize the greater good) that matches your scene exactly.

  Williams argued that if a man saves his wife from a sinking ship, and then justifies it by saying, "It was my duty to save my wife," or "Saving her produced the most net happiness," he has had **one thought too many.**

  *   **The Problem:** The justification should not be a calculation. The justification is the love itself.
  *   **The Articulation:** If your protagonist has to step back and view his wife as an object of value to be weighed against strangers, he has already detached himself from the very relationship that makes her saving meaningful. To love someone *is* to grant them priority. To ask for a reason *outside* of that priority is to ask the lover to stop loving for a moment to make the calculation.

  ### 2. The Category Error
  The friend is committing a **category error**. He is applying the rules of *distributive justice* (how a state or a god should allocate resources/lives) to *personal morality* (how a human being lives their life).

  *   **Public vs. Private:** If your protagonist were a firefighter on duty, he *should* save the two strangers over his wife. That is a public role requiring impartiality. But as a husband, he is in a private role defined by partiality.
  *   **The Articulation:** The friend is asking, "What universal law justifies this?" The protagonist's answer is, "This isn't a universal law; it's a specific commitment."
  *   **Drafting Idea:** The protagonist could say: *"If I were a judge, or a firefighter, or God, I'd save the two. But I'm not. I'm a husband. You're asking me to justify my life from the perspective of someone who isn't me."*

  ### 3. Constitutive Commitments
  In philosophy (specifically in the work of thinkers like Michael Sandel or Harry Frankfurt), some obligations are **constitutive**. They define who you are.

  *   **The Logic:** You don't choose your wife based on a pre-existing metric of value; the commitment itself creates the value. To ask "Why is she more valuable?" is to misunderstand that her value is derived from the bond, not the other way around.
  *   **The Articulation:** The demand for justification assumes the protagonist is a free-floating agent who chooses values. But he is already *bound*. To justify the bond would require him to stand outside the bond, which he cannot do without ceasing to be the person who saved her.
  *   **Drafting Idea:** *"You want a reason that works for everyone. But there isn't one. That's the point. If I could explain why I saved her using logic that applies to strangers, I wouldn't actually love her. I'd just be managing assets."*

  ### 4. The Moral Cost of the "Justification"
  Here is the twist for your novel: If the protagonist *does* come up with a clever philosophical answer, he might actually lose the reader's respect.

  *   **The Trap:** If he says, "Well, statistically, my wife contributes more to society," he becomes a monster. If he says, "Because I promised," it becomes a contract dispute.
  *   **The Strength:** His inability to answer is actually his moral strength. It shows that his action came from **character**, not **calculation**.
  *   **The Friend's Blind Spot:** The friend thinks morality is about *reasoning*. The protagonist shows that morality is often about *attachment*. The friend is treating the fire like a math problem; the protagonist treated it like a life.

  ### How to Write the Pushback
  You don't need the protagonist to become a philosopher to win this argument. He just needs to point out that the friend is looking at the wrong map. Here are three ways the protagonist could respond, ranging from emotional to intellectual:

  **Option 1: The "Alienation" Argument (Emotional)**
  > "You're asking me to look at her like you do. From the outside. But I wasn't on the outside. I was in there with her. If I had stopped to weigh her life against theirs, the man who came out of that fire wouldn't have been her husband anymore. He would have been a clerk."

  **Option 2: The "Ground Rules" Argument (Intellectual)**
  > "You're asking for a universal principle. But love isn't universal. It's particular. It's supposed to be biased. If I need a neutral reason to save my wife, then the marriage is already dead. The bias *is* the justification."

  **Option 3: The Silence (Dramatic)**
  > Sometimes the best answer is to show that the question is an intrusion.
  >
  > *Friend:* "But why? What makes her life objectively worth more?"
  > *Protagonist:* (Long pause) "I'm not going to answer that."
  > *Friend:* "Because you can't."
  > *Protagonist:* "No. Because to answer you, I'd have to pretend I don't know who she is."

  ### Summary for Your Writer's Block
  You are stuck because you feel the protagonist *should* have an answer, but your intuition knows that having an answer would betray the truth of the scene.

  **The conflict isn't between a shallow man and a deep man.** It is between two different kinds of depth:
  1.  **The Friend:** Represents the **Impartial Observer**. He values consistency, logic, and the equal worth of all humans. (This is valid for law and policy).
  2.  **The Protagonist:** Represents the **Embedded Agent**. He values loyalty, love, and the specific obligations that make a life meaningful. (This is valid for human relationships).

  The friend is not "wrong" about ethics in the abstract, but he is **wrong about this situation**. He is trying to apply the ethics of a courtroom to the ethics of a marriage.

  Your protagonist doesn't need a better justification. He needs to stand firm on the idea that **some things lose their value the moment you have to justify them.** That is the heart of the scene.
