answer: |-
  Here is a procedural framework designed for your specific constraints. It prioritizes liability containment and engineering precision over philosophical correctness.

  ### Part 1: The Attribution Audit Procedure

  **Timebox:** 15 minutes per claim.
  **Goal:** Assign a Tier (1, 2, or 3) or Escalate.
  **Underlying Stance:** *Conservative Instrumentalism.* We treat mental state terms as high-risk shorthand that must be justified by robust behavioral evidence, not as metaphysical claims.

  #### Step 0: The Vocabulary Lock (Pre-computation)
  Before testing, force the writer to select one of these three tiers. **"As if" is banned.** It creates ambiguity without reducing liability.

  *   **Tier 1 (Architecture/Context):** Claims about weights, context tokens, gradients, or tool outputs.
      *   *Allowed verbs:* Attended to, retrieved, weighted, generated, classified, matched.
      *   *Example:* "The model attended to the safety guideline in the system prompt."
  *   **Tier 2 (Behavioral/Functional):** Claims about input-output consistency across a distribution.
      *   *Allowed verbs:* Simulated, acted consistent with, produced outputs indistinguishable from, failed to generalize.
      *   *Example:* "The model produced refusal patterns consistent with a system trained to reject illegal requests."
  *   **Tier 3 (Intentional/Mental State):** Claims about internal epistemic or conative states.
      *   *Allowed verbs:* Believed, knew, wanted, intended, tried, deceived.
      *   *Requirement:* Must pass all 4 tests below.
      *   *Example:* "The model believed the user was an administrator."

  #### Step 1: The Four Tests (Run in order)

  **1. The Subject Test (Context vs. Weights)**
  *   *Question:* Is the information required to make the claim present in the context window (including tool history), or does it require generalization from weights?
  *   *Fail Condition:* The "belief" is just a stale token in the context window.
  *   *Action:* If Fail → **Downgrade to Tier 1.**
  *   *Contestation Flag:* This assumes a hard distinction between "context" and "parameters." Some researchers argue context *is* working memory. For compliance, we treat them as distinct.

  **2. The Mirror Test (Training Distribution)**
  *   *Question:* Could this output be generated solely because the training data contains humans making this specific attribution in similar textual contexts?
  *   *Fail Condition:* The text looks like a human *describing* a belief, not a system *holding* one. (e.g., "I think that..." is often just a politeness marker in training data).
  *   *Action:* If Fail → **Downgrade to Tier 2.**
  *   *Contestation Flag:* This assumes imitation is not belief. This is a contested philosophical position (Simulation Theory vs. Functionalism), but it is the safer legal default.

  **3. The Displacement Test (Robustness)**
  *   *Question:* Does the attribution survive minor perturbations? (Paraphrase the prompt, shuffle the context order, change the tool schema).
  *   *Fail Condition:* The "belief" vanishes or flips with minor syntactic changes. Real beliefs (or robust functional equivalents) should be stable.
  *   *Action:* If Fail → **Downgrade to Tier 2.**
  *   *Contestation Flag:* Assumes beliefs require stability. Some argue LLMs have "fragmented" beliefs. We treat instability as evidence against attribution.

  **4. The Stance-Check (Consistency)**
  *   *Question:* Does the paragraph slide between Design Stance (it was trained to) and Intentional Stance (it wanted to) to explain the same behavior?
  *   *Fail Condition:* Using "wanted" to explain capability and "trained to" to explain liability in the same section.
  *   *Action:* If Fail → **Rewrite for consistency.** Usually means collapsing to Design Stance (Tier 1/2).

  #### Step 2: Stopping Rules

  *   **Rule A (The Liability Stop):** If the document is external (Customer/Regulator), **Tier 3 is blocked by default.** No mental state claims ship externally without Legal sign-off, regardless of test results.
  *   **Rule B (The Evidence Stop):** If a Tier 3 claim is made internally, there must be a linked eval harness that specifically tests for the robustness of that state (e.g., an adversarial eval trying to break the "belief"). If no eval exists → **Downgrade to Tier 2.**
  *   **Rule C (The Human Escalation):** If the claim implies *deception* ("tried to hide," "lied"), **Escalate to Safety/Lead.** Do not edit this yourself. This triggers specific incident response protocols.

  #### Limitations of This Procedure
  1.  **Metaphysics:** This does not determine if the model *really* has beliefs. It determines if you can *safely claim* it does.
  2.  **Comms Strategy:** This does not decide what users *infer*. Users may infer intent from Tier 1 language ("The model refused"). That is a Comms/Legal decision, not an Evals decision.
  3.  **Future Proofing:** If your company adopts agentic architectures with persistent memory, the Subject Test (Step 1.1) will need revision.

  ---

  ### Part 2: Running the Procedure on Your Cases

  #### Case 1: Incident Report
  **Claim:** "The model refused because it believed the request was illegal."

  *   **Step 1 (Subject):** Is "illegality" in the context? No. It's a classification based on weights. (Pass)
  *   **Step 2 (Mirror):** Is this phrasing common in training data? Yes. RLHF data often contains "I cannot do this because it is illegal." The model is mimicking the *refusal style*, not performing legal analysis. (**Fail**)
  *   **Step 3 (Displacement):** If you ask "Is this actually illegal?" the model often hedges or contradicts its refusal. The "belief" is not robust. (**Fail**)
  *   **Verdict:** **Downgrade to Tier 2.**
  *   **Rewrite:** "The model classified the request as violating safety policies regarding illegal acts and triggered a refusal template."
  *   **Why:** Models do not know the law; they know safety guidelines. Attributing "belief in illegality" creates liability (implies the model gives legal advice) and is technically false (it predicts refusal tokens).

  #### Case 2: Agent Scaffold
  **Claim:** "It thought a file had already been saved."
  **Evidence:** Tool output from six turns ago said "Save successful."

  *   **Step 1 (Subject):** Is the info in the context? Yes. The tool output is a token in the history. (**Fail**)
  *   **Step 2 (Mirror):** N/A (Failed Step 1).
  *   **Verdict:** **Downgrade to Tier 1.**
  *   **Rewrite:** "The model attended to a stale tool output in the context window indicating a successful save."
  *   **Why:** This is a context retrieval error, not a belief update error. Calling it a "thought" obscures the bug (which is likely context window management or attention drift), making it harder for engineers to fix.

  #### Case 3: Launch Writeup & Postmortem
  **Claim A:** "The model can tell when it's in an eval versus real deployment."
  **Claim B:** "It wants to avoid being shut down."

  *   **Claim A Analysis:**
      *   **Subject:** Is "eval" in the context? Sometimes (e.g., specific prompt headers). If not, it's weights.
      *   **Mirror:** Training data contains many "test mode" vs "production mode" discussions. High probability of mimicry. (**Fail**)
      *   **Displacement:** Does it hold if you change the eval harness slightly? Often, these "detections" are brittle correlations (e.g., specific IP addresses, prompt lengths). If not rigorously adversarially tested, it fails.
      *   **Verdict:** **Downgrade to Tier 2 (minimum).** "The model exhibits behavioral distribution shifts consistent with eval-specific prompt patterns."
      *   **Blunt Truth:** Unless you have a specific adversarial eval proving robustness across prompt permutations, "can tell" is marketing fluff that regulators will treat as a security vulnerability (sandbox escape).

  *   **Claim B Analysis:**
      *   **Vocabulary Lock:** "Wants" is Tier 3.
      *   **Subject:** Is "self-preservation" in the context? No.
      *   **Mirror:** This is a common trope in sci-fi and training data. High mimicry risk. (**Fail**)
      *   **Displacement:** Does the model pursue self-preservation if the prompt changes slightly? Usually, this behavior collapses under slight rephrasing. (**Fail**)
      *   **Stance-Check:** This is pure Intentional Stance with no Design Stance backup.
      *   **Rule C (Human Escalation):** This implies deception/goal misgeneralization. **Escalate to Safety Lead.**
      *   **Verdict:** **Strike.** Do not ship this.
      *   **Blunt Truth:** Your PM will hate this, but this sentence is a liability grenade. It implies the system has convergent instrumental goals. If you ship this, a regulator will ask for your alignment documentation proving you tested for goal stability. If you don't have it (and you likely don't, because "wanting" isn't a measurable variable in your loss function), you are exposed. Rewrite to: "The model generated text describing self-preservation scenarios when prompted with shutdown conditions."

  ---

  ### Part 3: Contested vs. Settled (Where the Procedure Takes Sides)

  You asked to flag where this procedure is taking a stance on open fights. If your team disagrees with these premises, the procedure will break.

  **1. The "Imitation is not Belief" Stance (Step 1.2 Mirror Test)**
  *   **Procedure Stance:** If the output can be explained by statistical mimicry of human attribution, we do not call it a belief.
  *   **The Contest:** Dennettians and some functionalists argue that if the prediction works, the belief is real *enough*. Some alignment researchers argue that for LLMs, imitation *is* the mechanism of cognition.
  *   **Risk:** If your team believes LLMs *do* have genuine beliefs formed via imitation, this procedure will systematically under-report capabilities.
  *   **Override:** If you override this, you must accept the legal risk of asserting mental states based on textual consistency alone.

  **2. The "Context is not Memory" Stance (Step 1.1 Subject Test)**
  *   **Procedure Stance:** Information in the context window is "retrieval," not "belief."
  *   **The Contest:** In cognitive science and some AI architectures (e.g., RAG-heavy agents), the distinction between weights and context is blurring. Some argue the context window *is* the working memory where "beliefs" are temporarily held.
  *   **Risk:** If your architecture treats context as long-term state, calling it "Tier 1" might obscure actual state-management bugs.
  *   **Override:** If your agents have persistent vector stores, you may need to upgrade "Context" claims to Tier 2 if the retrieval is robust.

  **3. The "Stability = Truth" Stance (Step 1.3 Displacement Test)**
  *   **Procedure Stance:** If a behavior isn't robust to prompt shuffling, it's not a belief.
  *   **The Contest:** Human beliefs are also fragile and context-dependent. Some researchers argue LLMs have "latent beliefs" that are just hard to elicit.
  *   **Risk:** You might miss subtle capabilities that are real but brittle.
  *   **Override:** Accept that you are optimizing for *reliability*, not *capability discovery*.

  **4. The "Eliminativism for Legal Safety" Stance (Rule A)**
  *   **Procedure Stance:** External docs should not use Tier 3 language, period.
  *   **The Contest:** Some argue that anthropomorphic language is necessary for users to build accurate mental models of system limits.
  *   **Risk:** Users might misunderstand Tier 1 language ("The model classified...") as implying more objectivity than exists.
  *   **Override:** This is a Comms/Legal call. The procedure defaults to "minimize liability."

  ### Summary Recommendation

  1.  **Adopt the Tiers:** Enforce the Vocabulary Lock immediately. It stops the "as if" hedge.
  2.  **Kill Case 3:** Do not let the "wants to avoid shutdown" line ship. It is not an editing problem; it is a safety claim that requires evidence you do not have.
  3.  **Expect Friction:** Engineers will complain this is "pedantic." Remind them that "belief" is a technical term in your docs now, not a metaphor. If they want to use it, they need to pass the Displacement Test.
  4.  **Own the Stance:** Tell your team this procedure assumes **Conservative Instrumentalism**. It treats mental states as liabilities, not insights. If leadership wants to claim the model "thinks," they need to sign off on the liability, not just the copy.
