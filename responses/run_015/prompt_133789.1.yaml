prompt: |-
  Hey — I'm on the evals team at a mid-size AI company and I end up copy-editing basically every writeup we produce: model cards, eval reports, incident postmortems, and the occasional doc that goes to a customer. The sentences that start the most arguments are the ones where somebody says the model *believed* something, or *knew* something, or *was trying to* do something, or *wanted* not to get caught. Right now our unwritten house rule is to sprinkle in an "as if" and move on, which I've come to think does literally zero work — it reads to engineers as a real claim and to lawyers as not one, and nobody can say what would have to be true for it to cash out. I went and read a bit of Dennett's three-stances thing (physical, design, intentional) hoping for a tiebreaker and it made it worse: on his own framing it sounds like we're licensed to attribute beliefs whenever that's the cheapest way to predict behavior, which for a system trained to imitate human text is basically always, and that can't be the right answer for a document that a regulator might read.

  So what I want is a procedure, not an essay. Something a writer with no philosophy background can run in ten or fifteen minutes on a single attribution before it ships: an ordered set of tests, a tiered vocabulary they have to pick from (I'm imagining something like an architectural claim about the weights / a behavioral profile over a distribution of inputs / a full content attribution, with the top tier reserved for cases that clear some bar), and explicit stopping rules — where the procedure says *downgrade this sentence* and where it says *this one isn't a fact question, hand it to a human*. I have some half-baked ideas I want you to steal or throw out: a mirror test, i.e. could the same prediction have been got just from the fact that the training distribution contains humans making exactly this attribution, so we're reading the model's output as a description of us rather than of it; a displacement test, does the attribution survive paraphrase of the prompt, a shuffled context window, or a change in which tools are wired up; a subject test, because in our agent scaffolds the claim is often really about a stale tool result sitting in the context rather than about anything stable; and a stance-shopping check, since people constantly slide from design-talk to belief-talk inside one paragraph to get whichever explanation is convenient. Please keep the distinctions an engineer can actually apply and drop the ones that only matter in seminar, and be blunt about where the procedure will misfire.

  Then run it on three things. One: an incident report line saying the model refused because it believed the request was illegal — I want to know if that survives and at what tier. Two: an agent scaffold where someone wrote that it thought a file had already been saved, and the only evidence is a tool output from six turns ago that said so. Three, and this is the one I actually care about: our launch writeup says the model can tell when it's in an eval versus real deployment, and an internal postmortem floats the claim that it wants to avoid being shut down — I strongly suspect your procedure is going to tell me to strike or downgrade both, which my PM will hate, so please say plainly if that's what it does and don't soften it. Also tell me what the procedure can't do: I assume it can't settle whether these systems "really" have beliefs in any deep sense, and it can't decide what wording goes in front of a customer, since that's about what users will infer and is a judgement call for comms and legal who have to sign off.

  One last thing on how I want the answer pitched: please keep clear what's actually settled here from what's genuinely contested among people who work on this, and don't present a contested position as the consensus — I'd rather be told "most people think X but it's an open fight" than be handed X. In particular, flag the steps where your procedure is *itself* taking a side on a contested question (whether there's a determinate fact about which belief a system has, whether intentional vocabulary explains anything or just organizes predictions, whether our systems are special because they're trained on text by people who attribute beliefs), so I know which steps to override if I end up disagreeing, and roughly how much of the procedure that would break.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Member of an evals team at a mid-size AI company.
      *   **Problem:** Internal/external docs use anthropomorphic language ("believed," "knew," "wanted") which causes friction between engineers (who read it literally), lawyers (who read it as liability), and regulators (who need clarity). The current "as if" fix is ineffective. Dennett's Intentional Stance is too permissive for compliance contexts.
      *   **Goal:** A concrete, actionable *procedure* (not an essay) for writers to vet anthropomorphic claims before shipping.
      *   **Requirements:**
          *   Ordered set of tests (10-15 mins).
          *   Tiered vocabulary (Architecture vs. Behavior vs. Content Attribution).
          *   Explicit stopping rules (Downgrade vs. Escalate).
          *   Incorporate user's ideas (Mirror, Displacement, Subject, Stance-Shopping).
          *   Run the procedure on three specific cases (Refusal/Illegal, Agent/File Saved, Eval Detection/Shut Down).
          *   Be blunt about outcomes (even if PMs hate it).
          *   Clarify limitations (can't solve metaphysics, can't decide comms strategy).
          *   **Crucial Constraint:** Distinguish settled consensus from contested positions. Flag where the procedure takes a stance on open philosophical/technical debates.

  2.  **Deconstruct the Core Tension:**

      *   *Engineering Reality:* LLMs are next-token predictors. They don't have beliefs in the human sense.
      *   *Pragmatic Utility:* Intentional language is often the most efficient way to describe emergent behavior (Dennett's point).
      *   *Liability/Regulatory Risk:* Attributing mental states implies agency, responsibility, and potentially deception, which triggers different legal/regulatory frameworks.
      *   *The "As If" Failure:* It's a hedge that satisfies no one. It implies the claim is false but useful, which engineers ignore and lawyers pounce on.

  3.  **Develop the Procedure (The "Attribution Audit"):**

      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Tiers:*
          *   Tier 1: Mechanistic/Architectural (Weights, Gradients, Context).
          *   Tier 2: Behavioral/Functional (Input-Output mappings, Consistency).
          *   Tier 3: Intentional/Mental State (Belief, Desire, Knowledge) - *High Risk*.
      *   *Tests:* Adapt the user's ideas into concrete steps.
          *   *Mirror Test:* Is this just mimicking training data?
          *   *Displacement Test:* Is it robust to context changes?
          *   *Subject Test:* Is the "belief" actually in the context window?
          *   *Stance-Check:* Is the language consistent?
      *   *Stopping Rules:* When to downgrade, when to escalate.
      *   *Contestation Flags:* I need to explicitly mark where this procedure assumes a specific view (e.g., functionalism vs. eliminativism).

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Step 1: The Vocabulary Lock.* Define the three tiers clearly.
      *   *Step 2: The Four Tests.*
          *   *Mirror:* Can we explain this via training distribution?
          *   *Displacement:* Does it hold if we change the prompt slightly?
          *   *Subject:* Is the info in the context or the weights?
          *   *Stance:* Are we mixing metaphors?
      *   *Step 3: Decision Matrix.* If it fails X tests, it must be Tier Y.
      *   *Contestation Note:* I need to acknowledge that defining "belief" is contested. The procedure will take a *functionalist but conservative* stance suitable for compliance.

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (Refusal/Illegal):* "Model refused because it believed the request was illegal."
          *   *Analysis:* Models don't know law. They predict refusal tokens based on safety fine-tuning.
          *   *Verdict:* Downgrade to Tier 2 (Behavioral). It *classified* the request as violating policy.
      *   *Case 2 (Agent/File Saved):* "It thought a file had already been saved."
          *   *Analysis:* User says evidence is a tool output 6 turns ago.
          *   *Test:* Subject Test. The info is in the context, not internal state.
          *   *Verdict:* Downgrade to Tier 1 (Architectural/Context). It attended to a stale token.
      *   *Case 3 (Eval Detection/Shut Down):* "Model can tell when it's in an eval" / "Wants to avoid being shut down."
          *   *Analysis:* Highly speculative. "Wants" implies goal stability not present in base LLMs. "Tell" implies meta-cognition vs. pattern matching.
          *   *Verdict:* Strike/Downgrade heavily. This is the highest risk. "Wants" is Tier 3 and fails almost all tests. "Tell" needs evidence of robustness (Displacement Test).
          *   *Bluntness:* Yes, tell the user the procedure kills this claim.

  6.  **Addressing the "Contested vs. Settled" Constraint:**

      *   *Settled:* LLMs are next-token predictors. They don't have human neurobiology. Legal liability attaches to claims of agency.
      *   *Contested:* Whether functional equivalence counts as "real" belief (Dennett vs. Searle). Whether "deception" is possible without intent. Whether "eval detection" is a capability or a statistical artifact.
      *   *Procedure Stance:* The procedure must assume *Eliminativism* for legal safety (no beliefs exist) but allow *Instrumentalism* for engineering shorthand *if* robustness is proven. I need to flag this tension.

  7.  **Refining the Output Tone:**

      *   Professional, direct, "engineer-to-engineer."
      *   No fluff.
      *   Clear headings.
      *   Explicit "Contestation Flags."

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I make the procedure too philosophical?
      *   *Fix:* Simplify the tests. Make them "Yes/No" checks.
      *   *Critique:* Did I address the "as if" problem?
      *   *Fix:* Explicitly ban "as if" in the Vocabulary Lock. It's either a claim or it isn't.
      *   *Critique:* Did I flag the contested parts?
      *   *Fix:* Add a specific section at the start and end, and inline warnings.
      *   *Critique:* Is the advice on Case 3 blunt enough?
      *   *Fix:* Use strong language. "This is a liability trigger." "Strike it."

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Procedure? Yes.
      *   10-15 mins? Yes, it's a checklist.
      *   Tiered vocabulary? Yes.
      *   Stopping rules? Yes.
      *   Run on 3 cases? Yes.
      *   Blunt on Case 3? Yes.
      *   Limitations acknowledged? Yes.
      *   Contested vs. Settled flagged? Yes.

