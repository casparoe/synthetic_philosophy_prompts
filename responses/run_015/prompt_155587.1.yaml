answer: |-
  **TO:** The Interpretation Committee
  **FROM:** [Name], Reader in Philosophy
  **DATE:** 5 March
  **SUBJECT:** Opinion on the Endowment for the Gallery of Civilisational Collapse

  Colleagues,

  We are tasked with stewarding a significant gift without compromising our scholarly integrity or causing harm to living communities. The tension lies between the donor's specific terminology, the archaeological record, and the ethical implications of display. I write to clarify the philosophical commitments required to navigate this impasse.

  First, we must determine what 'collapse' is properly predicated of. To predicate collapse of a 'people' is to suggest biological cessation or cultural erasure, which the record contradicts; the Maya did not vanish, nor did the populations of the eastern Mediterranean. To predicate it of a 'civilisation' is to rely on a vague, often value-laden category that implies a moral trajectory. I argue that 'collapse' is properly predicated of an **institutional arrangement**. When we speak of the Classic Maya collapse, we refer to the failure of a specific political technology: kingship, monumentality, and the calendar tradition. The people persisted; the governance structure did not. By shifting the subject of the verb from 'civilisation' to 'polity' or 'system', we align our language with the evidence. We describe the cessation of complexity, not the disappearance of humanity.

  This distinction informs my view on the 'descendant veto' I previously floated. Upon reflection, I must reject it. The principle suggests that a polity may be described as having collapsed only where no living community claims descent. This fails on two grounds. First, it makes historical description contingent on modern demography and identity politics; whether a kingdom fell in 900 AD should not depend on who identifies as their heir in 2024. Second, and more disturbingly, it creates a moral hazard where the bluntest language is reserved for the most complete destructions. It licenses us to call a culture 'failed' only when there is no one left to object. This compounds historical injustice with ethical insensitivity. We cannot allow the silence of the extinct to permit our carelessness.

  Regarding the donor's central question—'could it happen to us?'—there is a clear disanalogy. The ancient cases were regional subsystems embedded within a broader world that often remained unaffected; our current predicament is planetary, with no unaffected outside to facilitate recovery. However, the framing survives if we clarify what is at risk. It is not biological extinction, nor necessarily a return to the Stone Age. What is at risk is **global cooperative complexity**. Just as the Bronze Age saw the severing of long-distance exchange networks, we face the fragility of supply chains, governance, and shared epistemic frameworks. The warning is not that we will vanish, but that our capacity to organise ourselves at scale may degrade.

  **Recommendation**
  I recommend we **accept the gift while re-engineering the interpretive text so that every use of 'collapse' has an explicit subject and a stated measure of loss.** We cannot vary the title without risking the endowment, which the Director rightly deems unthinkable. However, we are not bound by the title in our explanatory materials. We must rigorously define 'collapse' in the gallery introduction as 'the rapid loss of political complexity and literacy', explicitly decoupling it from population decline. This satisfies the legal requirement while correcting the philosophical error.

  **The Strongest Counter-Consideration**
  Proponents of the Education Team's position argue that precision is the enemy of impact. They contend that 'institutional reorganisation' sells no tickets and moves nobody on climate action. The visitor's visceral fear—the dread of becoming a ruin—is the engine of engagement. To sanitise the language is to blunt the warning. If we soften the blow, we risk turning a gallery about existential risk into a dry seminar on administrative history, thereby failing the donor's intent to provoke urgent reflection on our own vulnerability.

  **Conclusion**
  We can honour the donor's wish for urgency without violating the truth of the record or the dignity of descendant communities. We do this by being precise about what falls, so that visitors understand what might fall again.

  **Proposed Opening Wall Text**
  This gallery examines how specific political systems lost their complexity, not to suggest that people vanish, but to ask what sustains the fragile structures upon which we all depend.
