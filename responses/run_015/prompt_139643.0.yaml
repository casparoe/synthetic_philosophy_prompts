answer: |-
  This is a sophisticated query that cuts to the bone of the metaphysics of consciousness. You have identified a structural problem that persists even when we strip away the usual confusions about behaviorism or dualism. You are asking about the **ontological status of phenomenal properties relative to their causal antecedents.**

  Per your instructions, I will begin by brainstorming candidate concepts from the literature, testing them against your three cases, and rejecting those that fail to capture the specific structural feature you have isolated. I will then commit to the best fit (or a necessary coinage) and define the boundaries of the phenomenon.

  ### Phase 1: Brainstorming Candidate Concepts

  Here are the primary concepts from the philosophy of mind and psychology that might name what you are describing:

  1.  **The Cartesian Theater:** (Dennett). The idea that there is a central place in the brain where "it all comes together."
  2.  **The Stalinesque/Orwellian Distinction:** (Dennett & Kinsbourne). A distinction between falsification of experience *before* consciousness (Stalinesque) vs. *after* consciousness (Orwellian).
  3.  **The Hard Problem:** (Chalmers). The gap between physical processes and subjective experience.
  4.  **Phenomenal vs. Access Consciousness:** (Block). The distinction between what it is like (P) and what is available for report (A).
  5.  **Metaphysical Indeterminacy:** (Barnes, Williams). The idea that the world itself might be vague, lacking a fact of the matter.
  6.  **Verificationism:** (Logical Positivists). The claim that if evidence cannot distinguish hypotheses, the question is meaningless.
  7.  **The Explanatory Gap:** (Levine). The inability to explain *why* physical states feel like something.
  8.  **Temporal Binding Problem:** (Neuroscience). How the brain synchronizes disparate sensory inputs into a unified time.
  9.  **Phenomenal Concepts Strategy:** (Papineau). How our concepts of experience create the illusion of a gap.
  10. **Illusionism:** (Frankish, Dennett). The view that phenomenal properties do not exist as we think they do.

  ### Phase 2: Testing Candidates Against Your Cases

  **1. The Cartesian Theater**
  *   *Test:* You mentioned this. It describes the *error* of assuming a central locus of experience.
  *   *Verdict:* **Reject.** This names the *mistake* philosophers make, not the *structural feature* of the argument itself. You are asking about the configuration of the hypotheses (the "three-way structure"), not just the fallacy they might rely on. Furthermore, one can reject the Theater and still maintain there is a fact of the matter about timing (e.g., a distributed processing view).

  **2. The Hard Problem / Explanatory Gap**
  *   *Test:* These explain *why* the evidence doesn't settle the question (because physical data doesn't entail phenomenal facts).
  *   *Verdict:* **Reject.** These are too broad. They explain the *possibility* of your puzzle, but they do not name the specific structural feature regarding **causal location**. The Hard Problem applies to *any* link between brain and mind; your cases are specifically about *when* and *if* the link occurs in a sequence.

  **3. Phenomenal vs. Access Consciousness (Block)**
  *   *Test:* This distinguishes the "report" (Access) from the "undergoing" (Phenomenal).
  *   *Verdict:* **Partial Match.** This helps articulate the difference between Hypothesis 1 (P + A) and Hypothesis 3 (A only). However, it does not capture the *timing* dispute in Hypothesis 1 vs. 2 (both have P, but at different times). It categorizes the *states*, not the *temporal/ontological indeterminacy*.

  **4. Metaphysical Indeterminacy**
  *   *Test:* This addresses your question about whether there is "no fact of the matter."
  *   *Verdict:* **Partial Match.** This is a candidate for the *solution* or *status* of the problem, but not the name of the *phenomenon* itself. It describes the metaphysical landscape, not the specific causal sequence puzzle.

  **5. Verificationism**
  *   *Test:* This suggests the question is empty.
  *   *Verdict:* **Reject.** You explicitly stated that tabooing words didn't make the disagreement evaporate, and that participants insist the difference matters. Verificationism dissolves the problem; you are asking for a name for the problem as it stands for realists.

  **6. Temporal Binding Problem**
  *   *Test:* This is a neuroscientific term for how the brain syncs vision and audio.
  *   *Verdict:* **Reject.** This is a mechanism problem, not a metaphysical one. It assumes there *is* a binding to be solved. Your puzzle questions whether the binding corresponds to an *experience* at all.

  **7. The Stalinesque/Orwellian Distinction**
  *   *Test:*
      *   *Case 1 (Dream Timing):* Hypothesis 1 (Real-time dream) is the "Real" outcome. Hypothesis 2 (Waking construction) is the "Orwellian" revision (history rewritten after the fact). If the brain fabricated the dream during sleep to match a waking report, that would be "Stalinesque" (staging the event before the observer sees it).
      *   *Case 2 (Continuity):* Same structure. Did the experience exist before attention (Real/Stalinesque capture) or was it filled in later (Orwellian)?
      *   *Case 3 (Perceptual Richness):* Is the richness captured early (Stalinesque) or constructed late (Orwellian)?
  *   *Verdict:* **Strong Match.** This is the closest "house name" in the literature. It specifically addresses the **causal location of the phenomenal property** relative to the report.
  *   *Limitation:* The original distinction (Dennett & Kinsbourne, 1992) usually assumes experience *exists* somewhere and debates *when*. Your third hypothesis (report without experience) adds an **Illusionist** vertex to the triangle.

  ### Phase 3: Commitment and Definition

  The structural feature you have identified does not have a single, universally standardized one-word name, but it is the core engine of the debate surrounding **The Stalinesque/Orwellian Distinction** extended into **Phenomenal Ontology.**

  However, to give you the precision you requested, I will coin a term that captures the specific triad you described, anchoring it in the existing literature.

  **The Name:** **Phenomenal Causal Indeterminacy** (anchored in the **Stalinesque/Orwellian** literature).

  **The Definition:**
  **Phenomenal Causal Indeterminacy** is the structural condition where multiple hypotheses regarding the **temporal location** or **ontological existence** of a conscious experience are empirically equivalent with respect to all third-person data (behavior, speech, neural scans) and first-person reports, yet are treated as metaphysically distinct by participants in the debate.

  It is the specific realization that **phenomenal facts do not supervene on functional reports in a way that fixes their causal coordinates.**

  #### Why this fits your cases:
  *   **Case 1 & 2 (Dreams):** This is the classic **Stalinesque/Orwellian** problem.
      *   *Hypothesis 1 (Real-time):* The experience causes the memory.
      *   *Hypothesis 2 (Waking Construction):* The memory construction creates the *illusion* of a prior experience (Orwellian).
      *   *Hypothesis 3 (No Experience):* The report is generated without any phenomenal property (Illusionism).
      *   *Indeterminacy:* All three produce the exact same report ("I dreamed of a corridor"). The causal chain differs, but the output is identical.
  *   **Case 3 (Perception):** This is the **Rich vs. Thin** debate (Block vs. Cohen/Phillips).
      *   *Hypothesis 1 (Rich):* Experience is rich, attention selects (Stalinesque capture).
      *   *Hypothesis 2 (Thin):* Experience is thin, attention fills in (Orwellian construction).
      *   *Indeterminacy:* Subjective sense of richness is the same in both; the causal location of the "richness" is what differs.

  ### Phase 4: Carving the Boundaries (Answering Your Edge Questions)

  You asked for the carving rather than just the label. Here are the boundaries of **Phenomenal Causal Indeterminacy**.

  #### 1. Are "When" and "Whether" the same kind of question?
  **Yes.** In the context of this indeterminacy, questions about *when* an experience occurred and *whether* it occurred are structurally identical.
  *   **Reasoning:** Both rely on the same gap between **Functional Output** (the report) and **Phenomenal Ontology** (the experience).
  *   To say "It happened at T1" vs "It happened at T2" requires positing a property (consciousness) that exists at a specific coordinate.
  *   To say "It happened" vs "It didn't happen" requires positing that same property exists vs. does not exist.
  *   If the evidence (the report) is neutral regarding the *coordinate* (timing), it is necessarily neutral regarding the *existence* of the thing being coordinated.
  *   **Literature Location:** This unifies the **Stalinesque/Orwellian** debate (timing) with the **Realism vs. Illusionism** debate (existence). They are the same structural problem applied to different variables (time vs. binary existence).

  #### 2. The "Locked Door" Contrast: Why can't we check the mental case?
  In the door case ("Did I lock it or imagine locking it?"), there is a **Causal Divergence**.
  *   *Reality:* Door is locked.
  *   *Illusion:* Door is unlocked.
  *   *Check:* Go look. The physical state of the world diverges.

  In the **Phenomenal Causal Indeterminacy** case, there is **Causal Convergence**.
  *   *Hypothesis 1 (Real Experience):* Brain state X causes Report Y.
  *   *Hypothesis 2 (Constructed Experience):* Brain state Z causes Report Y.
  *   *The Block:* In the mental case, the "experience" is not an external object like a door; it is (by most definitions) intrinsic to the processing itself.
  *   **Would a complete neural readout settle it?**
      *   **No.** This is the crucial philosophical boundary.
      *   If you scan the brain and see narrative assembly happening at waking (T2) rather than sleep (T1), the Realist can simply say: "Ah, but the *phenomenal property* was instantiated at T1, even if the *reporting machinery* accessed it at T2."
      *   The dispute moves from "Where is the activity?" to "Which activity *counts* as the experience?"
      *   This is why Dennett argues the question is empty: because there is no "finish line" in the brain where consciousness happens. It is a **Category Mistake** to look for a neural timestamp for a phenomenal property.
      *   **Boundary:** If you are a **Reductive Physicalist**, you believe a neural readout *should* settle it (by defining experience as specific neural activity). If you are a **Non-Reductive Realist** or **Dualist**, you believe the readout cannot settle it (because experience is not identical to the activity). The indeterminacy persists as long as you treat "experience" as something *over and above* the functional processing.

  #### 3. What kind of "No Fact of the Matter" is this?
  If the right answer is that there is no fact of the matter (as Dennett and the Dream Skeptics like Malcolm ultimately suggest, though for different reasons), it is **Semantic/Conceptual Indeterminacy**, not Metaphysical.

  *   **Why not Metaphysical?** Metaphysical indeterminacy implies the *world* is vague (e.g., "It is objectively undefined whether this cloud is part of the atmosphere").
  *   **Why not Epistemic?** Epistemic implies there *is* a fact, we just can't know it (e.g., "The door is locked, but we have no camera").
  *   **Why Semantic/Conceptual?** The concept "Experience" (or "Dream") is a folk-psychological tool we use to interpret behavior. It does not have sharp boundaries in the causal chain.
      *   Asking "When did the experience happen?" is like asking "When did the 'winning' happen in a race?" Was it at the crossing of the line? The announcement? The medal ceremony?
      *   There is no *metaphysical* fact about "The Winning" separate from the rules we apply to the race.
      *   Similarly, there may be no metaphysical fact about "The Experience" separate from the interpretive stance we take toward the organism's processing.
  *   **What would show it?** We would show it by demonstrating that **any** proposed neural correlate of consciousness can be plausibly re-described as either the experience itself or a precursor to the experience without changing the functional outcome. (This is Dennett's "Multiple Drafts" argument).

  ### Summary for Your Mental Model

  You have identified **Phenomenal Causal Indeterminacy**.

  *   **Literature Anchor:** The **Stalinesque/Orwellian Distinction** (Dennett & Kinsbourne, 1992) for the timing aspect; **Phenomenal Realism vs. Illusionism** for the existence aspect.
  *   **The Structure:** Three hypotheses (Real-time, Retrospective, None) that are **Verification-Transcendent** regarding phenomenal properties but **Verification-Immanent** regarding reports.
  *   **The Boundary:** The dispute persists only if one assumes **Phenomenal Properties** are distinct natural kinds that must be *located* in the causal chain. If one adopts a **Functionalist** or **Interpretivist** view, the question dissolves (there is no "location" to find).
  *   **The "No Fact" Status:** It is **Conceptual Indeterminacy**. The concept "conscious experience" is not sharp enough to adjudicate between causal sequences that produce identical behavioral outputs.

  This is why the debate feels so frustrating: you are looking for a empirical switch (like the door lock), but the dispute is about the **grammar of the concept** "experience" itself. The lab data cannot settle it because the data is functional, and the question is ontological/semantic.

  ### Recommended Reading to Deepen the Carving
  1.  **"Time and the Observer: The Where and When of Consciousness in the Brain"** (Dennett & Kinsbourne, 1992). *The primary source for the Stalinesque/Orwellian distinction.*
  2.  **"The Unimagined Preposterousness of Zombies"** (Dennett, 1995). *Discusses the "report without experience" hypothesis.*
  3.  **"Phenomenal Consciousness: A Naturalistic Theory"** (Papineau, 2002). *For the Phenomenal Concepts Strategy explanation of why this feels like a metaphysical gap.*
  4.  **"Consciousness and Its Place in Nature"** (Chalmers, 2003). *For the opposing view that there IS a metaphysical fact, even if we can't find it.*
  5.  **"Dreaming"** (Norman Malcolm, 1959). *For the original skeptical argument that dreaming is not an experience.*

  This configuration is the engine room of modern philosophy of mind. You have found the place where the machinery of the "Hard Problem" grinds against the data of cognitive science.
