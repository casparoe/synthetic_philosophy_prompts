      *   *Recommendation:* Reject (3). Ground the intra-personal permission in the *moral status of the agent* over time, not psychological metrics. The law and morality treat the person as a single unit of account regardless of psychological change.

  6.  **Refining the "Step 1 vs Step 3" distinction:**
