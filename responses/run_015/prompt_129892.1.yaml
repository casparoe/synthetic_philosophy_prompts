      *   *The Cost of Rejecting (3):* You have to accept a "brute" fact of personal identity. You can't analyze it down to memories/traits. This is metaphysically costly (Ego theory vs Bundle theory).
      *   *Alternative: Reject (1).* If you reject "Better only in virtue of being better for someone," you can say the total is good *impersonally*. This saves the 5 vs 1 case easily. But it weakens the attack on Utilitarianism because Utilitarianism loves impersonal good.
      *   *Alternative: Keep (1) & (3) but accept Parfit's conclusion.* (Probably not what the user wants, as they want to keep (6)).
