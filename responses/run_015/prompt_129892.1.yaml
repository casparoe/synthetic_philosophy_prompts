      *   (2) Application of (1) to aggregation: If no one holds the total balance, the total balance doesn't make the outcome better. *This is the core Separateness of Persons claim.*
      *   (3) Intra-personal aggregation is licensed by "unity of a life" (psychological connectedness/continuity).
