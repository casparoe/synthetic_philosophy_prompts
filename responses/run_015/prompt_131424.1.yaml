  Two formal rules survive your scrutiny: the Nash Bargaining Solution (NBS) and the Kalai–Smorodinsky Solution (KSS). Both satisfy the axioms implied by M.'s record: efficiency (on the frontier), symmetry (in symmetric cases), and invariance to affine transformations (Case 3). Your record eliminates the Egalitarian rule (equal split of surplus), which would have awarded (8, 8) in Case 1 instead of (20, 5). It also eliminates the Utilitarian rule (maximize sum), which would have picked the corners (40, 0) or (0, 10).

  However, a third, behavioral candidate fits equally well: a "Kink-Focal" heuristic. This rule suggests that when the frontier is linear, M. splits the surplus proportionally (mimicking Nash/Kalai), but when a distinct vertex exists, she treats it as a focal point to avoid complex calculation. In Case 4, the kink was at (8, 8), and she awarded (8, 8). In the first three linear cases, there was no kink, so she defaulted to the proportional split. Because the NBS also happens to select the kink in Case 4 and the New Case, the "Kink-Focal" rule is mathematically indistinguishable from Nash on your current data, but it represents a different decision process—one based on salience rather than optimization.

