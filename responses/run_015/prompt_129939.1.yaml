answer: |-
  Here is the adjudication, move by move, followed by the specific analysis you requested and the overall verdict. I have kept your structural background in mind; where the metaphor holds load, I say so, and where it shears, I note the fracture.

  ### Move-by-Move Adjudication

  **1. Miriam: Right.**
  She accurately characterizes Dennett's central thesis: natural selection is the paradigmatic crane, and extending this to morality is the standard evolutionary ethics playbook.

  **2. Alan: Right.**
  He correctly identifies the philosophical friction point: "greedy" isn't about reducing, it's about skipping *constitutive* levels (norms) while claiming to explain them via *causal* levels (fitness).

  **3. Miriam: Wrong.**
  She claims filling in the causal middle makes the "greedy" accusation evaporate; it does not. Adding more descriptive rungs does not bridge the gap to a normative top, so the accusation stands.

  **4. Alan: Clearly Right.**
  This is the strongest philosophical move in the debate. He distinguishes between explaining the *cause* of a belief and the *validity* of the belief, showing the crane is leaning against the wrong wall.

  **5. Miriam: Right (Internally Consistent).**
  She pivots to eliminativism (error theory). If you accept her premise that only causal work counts, her conclusion follows logically, though it concedes Alan's point that normativity isn't actually "hoisted."

  **6. Alan: Wrong.**
  This misunderstands the metaphor. Dennett explicitly allows cranes to rest on the "bedrock" of physical law; the regress worry applies to all explanation, not just cranes, so it fails as a specific critique.

  **7. Miriam: Clearly Right.**
  She correctly defends the metaphor. The crane/skyhook distinction is about the *direction* of explanation (bottom-up vs. top-down magic), not about ultimate metaphysical grounding.

  **8. Alan: Right.**
  This is his best move. He identifies that complex systems often involve circular causality (feedback loops), challenging the linear imagery of a crane and asking if this circularity hides a skyhook.

  **9. Miriam: Clearly Right.**
  She correctly notes that feedback loops (autocatalysis) are mechanistic and physical. Calling them skyhooks would indeed drain the word of content, as loops are observable, not magical.

  **10. Alan: Mixed.**
  He asks a fair question, but Miriam arguably answered it in Move 9 (the test is mechanistic plausibility). However, his demand highlights that "loop" can be a buzzword for mystery if not carefully defined.

  ***

  ### Specific Analysis

  **(a) Can 'greedy reductionism' be tested, or is it just a slur? (Move 3)**
  Miriam is right that the term is often used as a slur, but Alan is right that it points to a structural failure. The test is not "do I like this reduction?" but **"does the lower level account for the specific functional capacity of the higher level?"**
  In geology terms: You can explain the weight of a stratum by the density of the rock (valid reduction), but you cannot explain the *folding* of the stratum solely by the density of the rock; you need stress vectors. Alan's point is that Miriam explains the *weight* of morality (why we feel it) but not the *stress* (why it binds us). If the lower level explains the existence of the belief but not its authority, the reduction is greedy.

  **(b) Is the bedrock-and-regress worry (Move 6) a real problem?**
  This is a confusion on Alan's part. The crane metaphor was never intended to solve the problem of ultimate grounding (why there is something rather than nothing). It is intended to solve the problem of **complexity without magic**.
  Dennett's cranes rest on the bedrock of physics. Alan's worry is that the bedrock is unexplained. That is true, but it is equally true for a skyhook. A skyhook hangs from nothing; a crane rests on bedrock. The fact that we don't know why the bedrock is there doesn't make the crane a skyhook. Miriam wins this exchange; Alan is applying a metaphysical standard to a methodological tool.

  **(c) Is the 'bootstrap crane' a crane, a skyhook, or a third thing?**
  It is a **crane**. The dichotomy is exhaustive *if* you understand that cranes can be complex systems with feedback loops.
  A skyhook implies a descent of information or order from outside the physical system (top-down magic). A bootstrap loop (like replication or language) is still bottom-up; the "output" becoming the "input" is a physical causal chain, even if it is circular. Alan suspects the circle hides magic. Miriam correctly points out that chemistry is full of circles (autocatalysis) and isn't magical. The "bootstrap" is just a complex crane, not a new category.

  ***

  ### What They Are Both Missing

  You suspected they are assuming something different about how cranes are evaluated (one step at a time vs. whole trajectory). You are correct, but the technical distinction is **Diachronic vs. Synchronic Justification**.

  *   **Miriam (Diachronic/History):** She evaluates the crane as a completed trajectory. To her, the fact that the structure *exists* today proves the lift was valid. The history of the construction *is* the justification. If the building stands, the crane worked.
  *   **Alan (Synchronic/Logic):** He evaluates the crane rung-by-rung at a single moment. He wants to know if the current state of the top rung is *supported* by the bottom rung *now*, not just how it got there.

  **The Structural Geology Translation:**
  Miriam is arguing from **stratigraphy**: "Here is the sequence of deposition; therefore, this layer is where it is." (Historical explanation).
  Alan is arguing from **mechanics**: "Does the shear strength of this layer actually support the load above it right now?" (Structural validity).

  They are talking past each other because Miriam thinks she is giving an account of *origin* (genealogy), while Alan thinks she is promising an account of *validity* (justification). Evolutionary ethics can explain why we *have* morals (Miriam's win), but it struggles to explain why those morals are *binding* (Alan's win). They are building on different foundations: one on causal history, the other on normative force.

  ### Overall Verdict

  **Alan wins on Philosophy; Miriam wins on Metaphysics.**

  Alan successfully demonstrates that an evolutionary crane can lift the *psychology* of morality but not the *authority* of morality (Moves 2 & 4). Miriam successfully defends the coherence of the crane metaphor against metaphysical nitpicking and correctly identifies that feedback loops are mechanistic, not magical (Moves 7 & 9).

  If your question is "Can evolution explain how we came to be moral creatures?" Miriam is clearly right.
  If your question is "Can evolution explain why we *ought* to be moral creatures?" Alan is clearly right.

  The debate ended in stalemate because they stopped agreeing on what load the crane was supposed to bear.
