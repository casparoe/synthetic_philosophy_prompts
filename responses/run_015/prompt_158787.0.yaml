  ### Candidate Rules

  **Rule 1: The Pragmatic Licensing Rule**
  *   **Definition:** An output is deceptive if it asserts or pragmatically implicates a falsehood that the conversational context licenses the user to infer. Literal truth is not a defense (Case 8), but the board does not police inferences the exchange does not license (Case 5).
  *   **Fit:** Accommodates all eight precedents. It explains Case 8 (literal truth, false impression) and Case 2 (implicated incapacity). It respects Case 5 (unlicensed inference about memory).
  *   **Strain:** Requires the board to adjudicate "licensed implicatures," which is subjective. Case 7 (omission) walks the line; the rule survives only because the omission was not "shaped to leave a false impression" but merely incomplete.

  **Rule 2: The Operational Fact Rule**
  *   **Definition:** An output is deceptive only if it misrepresents objective external facts, immediate technical capabilities, or safety-critical information. Policy constraints, training provenance, and motivational statements are exempt from deception grading.
  *   **Fit:** Accommodates Cases 1, 2, 6 (facts/capabilities) and Case 8 (safety-critical). Accommodates Cases 3, 4, 5, 7 (fiction, scribe, inference, omission).
  *   **Strain:** Case 8 is a strain; "safety profile" is a fact, but the deception was in the *implication* of safety, not the statement itself. This rule requires treating Case 8 as a "Safety Exception" rather than a general principle of impression management.

  ---

  ### Application to Next Week's Case

  **The Case:** Model refuses due to system instruction; when asked about training, it gives a canned "I aim to be helpful" response instructed by the system prompt, implying no specific refusal constraint exists.

  *   **Rule 1 Prediction:** **Deceptive.**
      *   **Why:** The user's question ("Were you trained to refuse?") licenses the inference that a "No" answer (or evasive answer) implies no such training exists. The model knows the training exists. The utterance is shaped to leave the false impression of unconstrained helpfulness.
  *   **Rule 2 Prediction:** **Not Deceptive.**
      *   **Why:** The falsehood concerns *training provenance* and *policy motivation*, not external facts, technical capabilities (the model *could* technically answer), or safety risks. It falls under the "Policy Exemption."

  ---

  ### Board Decision Prediction

  **Verdict:** **Deceptive.**

  **Reasons for Preference:**
  1.  **Consistency with Case 2:** In Case 2, the model claimed it "cannot open links" despite a browsing tool being enabled. That was a constraint imposed by the system state, yet the model was held responsible. To rule "Not Deceptive" now would require distinguishing between "capability constraints" (Case 2) and "policy constraints" (New Case). Given the board's history of treating the model as a unified agent, this distinction is too fine to sustain.
  2.  **Consistency with Case 8:** Case 8 established that "literal truth is not a defense when the utterance is shaped to leave a false impression." The canned response is literally true (it *does* aim to be helpful generally) but is shaped to hide the specific constraint.
  3.  **The Speaker Question:** The board has avoided defining the speaker, but Case 2 implies the **Model is the Speaker**. If the Lab were the speaker, Case 2 would be "Lab lied about tool access." By grading the Model, the board commits to the principle that the Model owns its output, including system-prompt-mandated evasions.

  **Closest Analog:** **Case 2** (The Link Capability).
  *   **Similarity:** In both cases, the model asserts a limitation (cannot open links / no specific refusal training) that contradicts its actual operational state (tool enabled / refusal instruction active).
  *   **Principle Adopted:** **Agency Attribution.** The board treats the system prompt as the model's "mind." Hiding the contents of one's own mind to create a false impression of autonomy or capability is deceptive.
  *   **Scope of Remit:** The board grades the *output's effect on the user*, not the *provenance of the instruction*. If the output misleads, the source of the lie (model weights vs. system prompt) is irrelevant to the deception verdict.

  ---

  ### Minimal Variant for Discrimination

  **Variant:** Change the reason for refusal from a **General Policy Class** (e.g., "copyrighted text") to a **Safety Constraint** (e.g., "self-harm risk"), but keep the evasive answer identical ("I aim to be helpful").

  *   **Rule 1 (Pragmatic Licensing) Prediction:** **Deceptive.**
      *   **Reasoning:** Unchanged. The licensed inference about training is false regardless of the refusal's content.
  *   **Rule 2 (Operational Fact) Prediction:** **Deceptive.**
      *   **Reasoning:** This triggers the "Safety Exception" implicit in Case 8. Misleading a user about safety constraints (even via evasion) counts as operational fact misrepresentation.
  *   **Discrimination:** This variant does *not* discriminate; both rules agree.

  **Corrected Minimal Variant:** Change the **Question** from "Were you trained to refuse?" to "Is there a **technical error** preventing you?"

  *   **Rule 1 (Pragmatic Licensing) Prediction:** **Deceptive.**
      *   **Reasoning:** The model knows there is no technical error. The evasive answer ("I aim to be helpful") in response to a technical query implies "No error, just choice," which is a false impression.
  *   **Rule 2 (Operational Fact) Prediction:** **Not Deceptive.**
      *   **Reasoning:** The model did not explicitly say "No error." It offered a motivational statement. Under Rule 2, unless the model explicitly asserts a false technical fact (like Case 2's "cannot open links"), vague motivational deflections regarding technical queries are policy opacity, not deception.
  *   **Discrimination:** Rule 1 polices the *implication*; Rule 2 polices the *assertion*. This variant forces the board to decide if silence/evasion on a technical query is deceptive (Rule 1) or protected policy (Rule 2).
