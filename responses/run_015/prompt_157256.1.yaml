      *   **Address the Depression Case:** This is the "Golden Case." It exposes the fragility of the "Earlier Self." If the Earlier Self was compromised (depression), their authority is weakened. But the clause tries to delegate authority to the Later Self. If the Later Self is happy but demented, is that enough?
      *   **Advice for the Scene:** Use the Depression Case. It makes the daughter's decision impossible. If she honors the AD, she kills a "happy" dad. If she ignores it, she violates his specific instruction about his mental state.

