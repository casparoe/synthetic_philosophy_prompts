      *   *Mechanism:* The *catuṣkoṭi* negates all four positions to exhaust conceptualization, not to posit a fifth state (like an ineffable absolute).
      *   *Goal:* Peace (*śiva*), cessation of construction, not metaphysical truth.
      *   *Key Text:* MMK 13.8 ("The victorious ones have said that emptiness is the relinquishing of all views. For whomever emptiness is a view, that one has accomplished nothing.").

  3.  **Identify Potential Defeaters (Brainstorming):**
      *   *Textual:* Does Nāgārjuna make positive claims that look ontological? (e.g., MMK 24.18 on dependent origination being emptiness). Does he deny *svabhāva* universally or just in specific contexts?
      *   *Philosophical (Self-Refutation):* If "all views are empty," is *that* view empty? If yes, does it lose force? If no, is it *svabhāva*? (The *Vigrahavyāvartanī* addresses this).
      *   *Two Truths:* If ultimate truth is just the cessation of views, how does it relate to conventional truth without making conventional truth *ultimately* false (nihilism) or *ultimately* real (essentialism)?
