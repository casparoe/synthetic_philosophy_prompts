  2. Why the two rates come apart
  Your instinct identifies the gap between worst-case logic and average-case probability. GS is an existence theorem: it guarantees the *set* of manipulable profiles is non-empty. It says nothing about the measure of that set. Your "voter's rate" corresponds to individual power (pivotality), which generally vanishes as $N \to \infty$ in large electorates under reasonable assumptions. Your "electorate's rate" corresponds to the probability the system is vulnerable somewhere.
  However, quantitative social choice suggests both rates often approach 1 as $N$ grows for common rules (like Borda), because while individual pivotality shrinks, the configuration space explodes, making *some* manipulation opportunity almost certain. The slide you fear is real: GS is often cited to imply voting is futile, whereas it only implies vulnerability is possible. But your asymmetry intuition is partially corrected: individual leverage drops, but the system's fragility often remains high. In the limit, the probability that a specific voter is pivotal decays exponentially, suggesting their manipulability rate vanishes. Yet the union bound over all voters suggests the electorate rate approaches unity. This divergence confirms your instinct: the theorem guarantees the union is non-empty, but says nothing about the individual terms. The "slide" occurs when commentators treat the non-empty set as a dense fog rather than isolated pockets.

  3. A minimal worked example
  Consider three voters $\{1, 2, 3\}$ and alternatives $\{x, y, z\}$. The rule is Plurality with a fixed tie-breaking order $x \succ y \succ z$.
  Suppose votes cast are $(x, y, y)$. Outcome: $y$ wins (2 votes vs 1).
  Voter 1 prefers $z \succ x \succ y$. Voting truthfully ($x$) yields $y$. If Voter 1 switches to $z$, votes are $(z, y, y)$, $y$ still wins. Voter 1 cannot manipulate; their manipulability at this profile is 0.
  Voter 2 prefers $x \succ y \succ z$. Voting truthfully ($y$) yields $y$. If Voter 2 switches to $x$, votes are $(x, x, y)$. Outcome: $x$ wins. Since $x \succ y$ for Voter 2, this is a profitable misreport. Voter 2's manipulability is 1.
