  4. What the escape hatches actually buy
  Randomization confirms your suspicion: strategy-proof random rules are essentially mixtures of dictators or dualities. Chance buys ex-ante fairness, not incentive compatibility.
  Restricted domains (single-peakedness) change the picture in *kind*. If preferences align on a line, the Median Voter rule is strategy-proof. Here, both your rates can be zero. This shows GS is about conflict structure, not just voting.
  Approximate strategy-proofness addresses your magnitude concern. In large markets, the gain from manipulation often scales as $1/N$. This validates your intuition: the *existence* of manipulation remains (GS holds), but the *energy* of the incentive vanishes.
  Non-contingent reasoning (obvious strategy-proofness) strengthens the definition, making satisfaction harder. This changes degree of strictness, not kind of possibility. Only domain restriction changes kind of possibility. Throughout, your distinction holds: even if gains are negligible, the logical vulnerability persists for the electorate, while individual exposure fades. These hatches mitigate the practical impact but do not erase the logical boundary GS defines. They shift the burden from impossibility to improbability or negligible gain.

  5. Strategy-proofness versus the thing I might really care about
  You are correct that strategy-proofness is a proxy. It proxies for "simplicity" (no need to model others) and "security" (truth is safe). But if your goal is welfare maximization involving intensities, ordinal strategy-proofness is the wrong target. Cardinal mechanisms (like VCG) can be strategy-proof and handle intensities, but they require transfers (money) to work, which violates the "voting" constraint of no side-payments.
  Thus, GS tells us that without transfers, we cannot have both ordinal simplicity and intensity sensitivity without dictatorship. If you care about citizens not modeling others, SP is the right desideratum. If you care about outcome quality regarding intensities, SP via ordinal ballots is the bottleneck. The theorem highlights the trade-off between informational simplicity and incentive compatibility, not necessarily the impossibility of honest deliberation. If the desideratum is "no cognitive burden", SP is perfect. If the desideratum is "best outcome", SP may be obstructive. GS forces us to choose which proxy we prioritize.

  6. Where my framing is muddled
  Your framing is not muddled, but it shifts the domain from logic to statistics. The two-rates move is not a dead end; it is the foundation of quantitative social choice. However, it cannot invalidate GS. GS is a topological boundary condition (like the Third Law of Thermodynamics); your rates are statistical mechanics (particle behavior).
  The muddle lies in expecting GS to speak to frequency. It does not. It speaks to possibility. Your distinction sharpens the practical interpretation: a system can be theoretically manipulable (GS satisfied) yet practically safe (low voter rates). Do not discard the intuition; use it to contextualize the theorem, not to refute it. The theorem defines the landscape; your rates measure the terrain.
