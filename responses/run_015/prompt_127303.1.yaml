prompt: |-
  Hi — I'm doing a PhD on the politics of atrocity designation, and I'm also the part-time characterisation analyst at a tiny documentation outfit: four staff, no lawyer on payroll, and we put out maybe two public characterisation notes a month, three hundred words max, that journalists then quote and that two rival survivor associations either circulate or publicly disown. The board signs each one off within 48 hours of us flagging an incident. The decision that eats us alive every time is whether the note uses the word genocide — Lemkin's word, and the one that does all the political work — rather than crimes against humanity, ethnic cleansing, or just a description of the acts.

  What I need off you is an actual procedure, not an essay: the questions in order, what counts as a sufficient answer to each given we have 48 hours and no counsel, where the procedure halts with a no, and where it hands the decision to a person because it's a values question dressed as a factual one. Two things it has to hold apart: whether the legal/moral test is met (intent to destroy a protected group as such, in whole or in part — including Lemkin's broader sense of destroying a group by dismantling its way of life, which the Convention drafters mostly dropped) and whether we should say the word in a note, given that naming has effects on funding, on our field staff, and on who gets to count as the victim. It should also say which distinctions survive being simplified and which don't, and where it will misfire.

  Two in-house heuristics we've been using: a swap test (could someone escape the violence by ceasing to be a member of the group? if yes, they're targeted as a group, not for what they did) and campaign-shape intent (inferring the specific intent from the organisation of the campaign when nobody wrote it down). Tell me whether to keep, fix or bin them.

  Then run it on three: (1) a campaign against a pastoralist community — men killed, wells poisoned, herds destroyed, survivors pushed into towns where they can't keep livestock, no one says the word destroy; (2) the killing of a few hundred religious elders and the levelling of shrines in one district, out of a group of a million, where those are the people who hold the ritual knowledge; (3) a case against the community I'm from, where a leaked manual and one minister's speech get us over your evidentiary bar — and where our in-country researchers, who are from that community, are the ones who'd be arrested. I want it in British English, and I want you to be straight about the case where the procedure gives me an answer I won't like.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** PhD researcher on atrocity designation + part-time characterisation analyst at a tiny documentation outfit (4 staff, no lawyer, 2 notes/month, 300 words max, 48h turnaround).
      *   **Task:** Create an *actual procedure* (questions in order, sufficiency criteria, halt points, hand-off points) for deciding whether to use the word "genocide" in public notes.
      *   **Constraints:** 48 hours, no counsel, must distinguish between *legal/moral test* (intent to destroy) and *strategic/ethical decision* (impact of naming). Must identify where simplifications break.
      *   **Heuristics to Evaluate:** "Swap Test" (could they escape by changing identity?) and "Campaign-Shape Intent" (inferring intent from organization of violence).
      *   **Test Cases:**
          1.  Pastoralists (men killed, wells poisoned, herds destroyed, forced urbanization, no explicit "destroy" language).
          2.  Religious elders/shrines (few hundred killed out of a million, but they hold ritual knowledge).
          3.  User's own community (leaked manual + speech meets bar, but using the word endangers local researchers).
      *   **Tone/Style:** British English, direct/straight (no fluff), acknowledge where the procedure gives an uncomfortable answer.

  2.  **Deconstruct the Core Tension:**

      *   *Fact/Law:* Does this meet the threshold? (Intent to destroy, in whole or in part, a protected group).
      *   *Policy/Impact:* Should we say it? (Funding, safety, victim hierarchy, political backlash).
      *   *Constraint:* 48 hours, no lawyer. This means the procedure *cannot* be a legal brief. It must be an operational checklist.

  3.  **Develop the Procedure (The "Algorithm"):**

      *   *Phase 1: Triage & Safety (The "Can We?" Check).* Before analyzing the crime, analyze the risk. If saying "genocide" gets staff killed, the factual accuracy is secondary to duty of care.
      *   *Phase 2: The Factual Threshold (The "Is It?" Check).* Adapt the legal definition to a documentation context. Use the user's heuristics here.
      *   *Phase 3: The Strategic Decision (The "Should We?" Check).* This is where the board comes in. The analysts provide the facts; the board weighs the consequences.
      *   *Phase 4: Drafting.* How to phrase it if the answer is "Yes, but..." or "No, but..."

  4.  **Evaluate the Heuristics:**

      *   *Swap Test:* Good for distinguishing specific intent from general violence. If I can stop being killed by converting/assimilating, it's not genocide (usually). *Verdict:* Keep, but refine. It fails if the group is immutable (race/ethnicity) but the perpetrator *thinks* it's mutable (religion/culture).
      *   *Campaign-Shape Intent:* Essential for 48h work without a smoking gun document. Systematic destruction implies intent. *Verdict:* Keep, but warn against over-reliance on pattern without context.

  5.  **Drafting the Procedure (Iterative refinement):**

      *   *Step 1: Duty of Care.* (Halt point).
      *   *Step 2: Protected Group.* (Halt point).
      *   *Step 3: Acts.* (Halt point).
      *   *Step 4: Intent (The Hard Part).* Use the heuristics here.
      *   *Step 5: The "Should We" Gate.* Hand-off to Board.

  6.  **Addressing the "Misfire" and "Simplification":**

      *   Legal genocide requires *specific intent* (dolus specialis). Documentation often relies on *pattern*. This is where it misfires.
      *   "In part" is legally tricky. Is a "substantial part" geographic or numerical? The procedure needs to flag this ambiguity.

  7.  **Running the Test Cases:**

      *   *Case 1 (Pastoralists):* Fits "destroying way of life" (Lemkin's original view), but maybe not strict UN Convention. *Procedure result:* Likely "Genocidal acts" but maybe halt on "Genocide" label depending on intent evidence. *Straight talk:* This is where the legal definition is too narrow for the moral reality.
      *   *Case 2 (Elders):* "In part" issue. Killing the "brain" of the group. *Procedure result:* High risk of misfire. Numerically small, functionally critical. *Straight talk:* The procedure might say "No" on numbers, but "Yes" on function. Needs a specific clause for "vital nodes."
      *   *Case 3 (Own Community):* The factual bar is met. The safety bar is failed. *Procedure result:* Do not use the word "genocide" in the public note, despite the facts. *Straight talk:* This is the answer the user won't like. Truth vs. Safety.

  8.  **Refining Tone and Language:**

      *   British English (characterisation, programme, centre, etc.).
      *   Direct, operational, no academic waffle.
      *   Acknowledge the burden on the user.

  9.  **Final Review against Constraints:**

      *   48 hours? Yes, the checklist is fast.
      *   No lawyer? Yes, avoids legalese where possible.
      *   Distinguish Fact vs. Policy? Yes, separate phases.
      *   Evaluate Heuristics? Yes.
      *   Run 3 cases? Yes.
      *   Straight about the uncomfortable answer? Yes (Case 3).

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest "Genocidal Acts" as a compromise.
      *   *Correction:* The prompt asks about using the word "Genocide". I need to be clear on the binary decision for the *label*, even if the text describes acts.
      *   *Initial thought:* Let the analysts decide.
      *   *Correction:* Prompt says Board signs off. The procedure must feed the Board a clear recommendation.
      *   *Crucial Point:* The prompt asks for a procedure that distinguishes *test met* vs *should say*. I need to make sure the "Should We" section doesn't override the "Is It" section factually, but acts as a veto on publication language.

  11. **Final Polish:** Check the "Swap Test" nuance. If the perpetrator *believes* you can't escape, it counts, even if theoretically you could. Adjust the heuristic definition. Ensure Case 3 highlights the ethical conflict between advocacy and duty of care.

  *(Self-Correction on Case 3)*: The prompt says "I want you to be straight about the case where the procedure gives me an answer I won't like." Case 3 is the obvious candidate. The facts say "Yes", the safety says "No". The procedure must prioritize safety. This contradicts the PhD impulse for truth. I must be blunt about this.

  *(Self-Correction on Case 1)*: Pastoralists. UN Convention doesn't explicitly cover "way of life" (political groups excluded, cultural destruction is a war crime/crimes against humanity usually). Lemkin included it. The procedure needs to acknowledge this gap.

  *(Self-Correction on Case 2)*: The "substantial part" legal debate. Killing 0.01% of a population isn't genocide unless that 0.01% is essential to survival. The procedure needs a "Vital Nodes" exception.

  Let's assemble.
answer: |-
  Here is a procedural framework designed for your specific constraints: 48-hour turnaround, no legal counsel, high-stakes output. It separates the *factual assessment* from the *publication decision*.

  ### Part 1: The Heuristics Evaluation

  **1. The Swap Test**
  *   **Verdict:** Keep, but refine.
  *   **The Fix:** The test fails if it relies on objective possibility. It must rely on *perpetrator perception*. If the perpetrator believes the identity is immutable (even if it isn't), the test is met.
  *   **Revised Question:** "According to the perpetrator's logic, could the victim survive by ceasing to be a member of the group?" If the answer is *no*, specific intent is indicated.

  **2. Campaign-Shape Intent**
  *   **Verdict:** Keep.
  *   **The Fix:** You cannot wait for a smoking gun. Systematic destruction of the conditions of life is a proxy for intent.
  *   **Revised Question:** "Is the violence random/punitive, or does it structurally dismantle the group's capacity to exist?"

  ---

  ### Part 2: The 48-Hour Characterisation Procedure

  **Phase 1: The Safety Veto (Hour 0–4)**
  *Before analysing the crime, analyse the cost.*
  *   **Question:** Does using the word 'genocide' in a public note create a probable, imminent threat to in-country staff, sources, or survivors?
  *   **Sufficient Answer:** A risk assessment from the country lead. "Elevated threat" is enough.
  *   **Halt Point:** If **YES**, the procedure stops. The factual designation is recorded internally but *not* published. The note describes acts without the label.
  *   **Hand-off:** None. This is an absolute veto.

  **Phase 2: The Factual Threshold (Hour 4–24)**
  *Determining if the legal/moral test is met. This is binary.*
  *   **Q1 (Protected Group):** Is the target a national, ethnical, racial, or religious group? (Political/social groups do not count under the Convention).
      *   *Halt if NO.*
  *   **Q2 (The Acts):** Are there killings, serious harm, conditions of life calculated to bring about physical destruction, prevention of births, or forced transfer of children?
      *   *Halt if NO.* (This becomes a War Crime or Crimes Against Humanity file).
  *   **Q3 (Specific Intent):** Using the **Campaign-Shape** and refined **Swap Test**: Is there reasonable evidence the acts are committed to destroy the group, in whole or *substantial* part?
      *   *Note on 'Substantial Part':* This can be numerical OR functional. Destroying the only priests of a faith counts, even if they are few.
      *   *Halt if NO.* (Label as 'Ethnic Cleansing' or 'Atrocity Crimes').
  *   **Output:** A 'Genocide Threshold Met' (Yes/No) recommendation for the Board.

  **Phase 3: The Publication Decision (Hour 24–40)**
  *Determining if the word should be used. This is values-based.*
  *   **Q1 (Dilution Risk):** Will using the word here undermine credibility for future, clearer cases? (e.g., is the evidence borderline?)
  *   **Q2 (Survivor Alignment):** Do the primary survivor associations want the term? (If rival associations disown it, the note divides victims).
  *   **Q3 (Material Consequence):** Will the designation unlock protection/funding, or will it trigger donor fatigue/political shutdown?
  *   **Hand-off:** This decision goes to the **Board**. Analysts provide the Phase 1 & 2 data; Board decides Phase 3.

  **Phase 4: Drafting (Hour 40–48)**
  *   **If Phase 1 = YES (Unsafe):** Describe acts vividly. "Systematic destruction of [Group] life." No 'G-word'.
  *   **If Phase 2 = NO:** "Crimes Against Humanity" or "Ethnic Cleansing".
  *   **If Phase 2 = YES and Phase 3 = YES:** "Genocide".
  *   **If Phase 2 = YES and Phase 3 = NO:** "Genocidal Acts" or "Patterns consistent with Genocide". (This is the compromise language).

  ---

  ### Part 3: Where It Misfires and Simplifications

  1.  **The 'Cultural' Gap:** The UN Convention excludes cultural destruction (Lemkin included it). Your procedure follows the Convention for the label, but your internal analysis should note the Lemkinian breach. *Misfire:* Case 1 below will likely fail the legal test but pass the moral one.
  2.  **The 'Part' Ambiguity:** 'Substantial part' is legally contested. Your procedure treats 'functional elites' as substantial. Courts may not. *Misfire:* Case 2 below relies on this; it is vulnerable to legal challenge.
  3.  **The Safety/Truth Conflict:** Phase 1 overrides Phase 2. This means you will knowingly withhold a factual designation for safety. This is ethically sound but epistemologically messy.

  ---

  ### Part 4: Running the Cases

  #### Case 1: The Pastoralists
  *   **Facts:** Men killed, wells poisoned, herds destroyed, forced urbanisation. No explicit 'destroy' language.
  *   **Procedure Run:**
      *   *Phase 1:* Safe to publish? Assume Yes.
      *   *Phase 2:* Protected Group? (Ethnic/National). Acts? (Yes). Intent? (Campaign-shape suggests yes; Swap Test suggests yes—they cannot be pastoralists in a city).
      *   *The Catch:* This is 'cultural genocide' or 'conditions of life'. Under strict Convention interpretation, this often fails the 'physical destruction' bar unless mortality rates are high.
      *   *Phase 3:* High political friction.
  *   **Outcome:** **Threshold Met (Moral/Lemkin), Threshold Not Met (Strict Legal).**
  *   **Recommendation:** Do not use 'Genocide' in the headline. Use "Genocidal Acts" in the text.
  *   **Straight Talk:** This is where the law fails you. The procedure forces you to acknowledge that while the *outcome* is the destruction of the group, the *legal mechanism* (intent to physically destroy) is ambiguous. You will be accused of cowardice by purists and overreach by lawyers.

  #### Case 2: The Religious Elders
  *   **Facts:** Few hundred killed out of a million. Shrines levelled. Elders hold ritual knowledge.
  *   **Procedure Run:**
      *   *Phase 1:* Safe? Assume Yes.
      *   *Phase 2:* Protected Group? (Religious). Acts? (Yes). Intent? (Targeting the 'brain' of the group).
      *   *The Catch:* Numerical 'substantiality' is low. Functional 'substantiality' is high.
      *   *Phase 3:* Survivor associations likely agree (elders are key).
  *   **Outcome:** **Threshold Met.**
  *   **Recommendation:** Use 'Genocide'.
  *   **Straight Talk:** The procedure holds here, but only because you included the 'Vital Nodes' exception in Phase 2, Q3. Without that clause, the algorithm halts at 'No'. Be prepared to defend the 'functional substantiality' argument publicly; it is legally robust but numerically counter-intuitive to journalists.

  #### Case 3: Your Own Community
  *   **Facts:** Leaked manual + Minister speech meets evidentiary bar. In-country researchers are from that community.
  *   **Procedure Run:**
      *   *Phase 1:* **Safe?** **NO.** Using the word 'genocide' based on a Minister's speech makes your researchers targets for arrest as 'agents of foreign narratives'.
      *   **Halt Point:** Phase 1 Veto triggered.
      *   *Phase 2:* (Irrelevant for publication, but internally: Threshold Met).
      *   *Phase 3:* (Irrelevant, Phase 1 vetoed).
  *   **Outcome:** **Do not use the word 'Genocide'.** Describe the acts and the manual explicitly. "State-directed campaign to eliminate [Group]."
  *   **Straight Talk:** This is the answer you won't like. Your PhD demands truth; your job demands duty of care. The procedure prioritises the safety of your four staff and their contacts over the precision of the designation. If you publish the word 'genocide' here, you are using your researchers' safety as currency for a label. The procedure forces you to swallow the truth to keep them out of prison. You will feel complicit in the erasure. That is the cost of the work.

  ### Summary of Distinctions
  *   **Keep:** The separation of Safety (Phase 1) from Fact (Phase 2).
  *   **Fix:** The 'Swap Test' must account for perpetrator belief, not objective reality.
  *   **Bin:** Any expectation that the legal definition covers cultural destruction (Case 1). You must name that gap, not hide it.

  This procedure protects your staff, clarifies your board's liability, and ensures that when you *do* say the word, it is because it is safe enough and factually sound enough to carry the weight.
