      *   *Critique:* Is the Friend's position too straw-manned as "believe everything"?
      *   *Fix:* Clarify the Friend believes in *Bayesian updating*. Even a prior of $10^{-9}$ is valid if the likelihood ratio supports it. The Friend argues the User is effectively setting the prior to 0 arbitrarily.
      *   *Critique:* Are the tests falsifiable?
