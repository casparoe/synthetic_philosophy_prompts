      *   **Section 3: The Cruxes:**
          *   *Crux 1: Source Trustworthiness vs. Magnitude.* Is it about $P$ being small, or $P$ being ungrounded?
          *   *Crux 2: Utility Concavity vs. Epistemic Cutoff.* Is the User actually risk-averse regarding outcomes?
          *   *Crux 3: Action vs. Deliberation.* Is fanaticism about *doing* or *thinking*?
          *   *Crux 4: The Regress Problem.* Can a larger $V$ always overcome the floor?

      *   **Section 4: Concrete Tests (The "Meat"):**
          *   *For Crux 1 (Source):* The "Black Box" test. Two risks, same $P \times V$, one grounded, one speculative.
          *   *For Crux 2 (Concavity):* The "Certain vs. Uncertain" trade-off. Would the User take a sure thing over a gamble with higher EV?
