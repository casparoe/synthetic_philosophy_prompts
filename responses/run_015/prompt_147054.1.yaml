answer: |-
  # ADVERSARIAL COLLABORATION DRAFT
  **Subject:** Epistemic Resolution and Expected Value in High-Stakes Decision Making
  **Participants:** Infrastructure Engineer (IE) vs. EV Maximizer (EVM)
  **Date:** October 26, 2023
  **Status:** Draft for Review

  ## PREAMBLE
  This document summarizes a year-long debate regarding the application of Expected Value (EV) reasoning to low-probability, high-impact events. The IE approaches this from a background of infrastructure reliability, fault-tree analysis, and postmortem engineering. The EVM approaches this from a background of effective altruism and rationalist decision theory.

  We agree that standard EV reasoning works for routine engineering and charitable decisions. We disagree on the boundary where EV reasoning breaks down, specifically regarding "fanatical" bets (extremely low probability, astronomically high payoff). The goal of this document is not to resolve the debate, but to isolate the exact points of divergence and propose empirical or logical tests that could move us toward resolution.

  ---

  ## 1. AGREED CLAIMS
  *Both parties endorse the following statements. Disagreement exists only outside this boundary.*

  1.  **Anchored EV is Valid:** For probabilities derived from validated physical models, reference classes, or frequentist data (e.g., hardware failure rates, actuarial tables), expected value calculations are the correct tool for decision-making.
  2.  **The Pascal Mugging Intuition:** Neither party is compelled to act on the classic "Pascal's Mugging" scenario (a stranger claims they can simulate/kill $3 \uparrow\uparrow\uparrow 3$ lives for \$5) as typically presented. We agree that something is wrong with the reasoning that compels action there.
  3.  **Resource Scarcity:** Time, money, and cognitive attention are finite. We agree that spending a whole sprint on a risk is a significant cost that must be justified.
  4.  **The Core Question:** The dispute is not about whether EV matters, but about **demarcation**: What separates an "anchored" probability (which counts) from an "unanchored" probability (which does not), and is that separation principled or arbitrary?
  5.  **Double-Counting Warning:** We agree that one should not adjust a probability estimate for "uncertainty" and then *also* discount the expected value for that same uncertainty, unless the uncertainty is explicitly modeled as a distribution over probabilities.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Each position is stated in terms its holder accepts. Neither side endorses the other's row.*

  | Feature | **The Engineer's Position (Resolution Floor)** | **The Maximizer's Position (Strict EV)** |
  | :--- | :--- | :--- |
  | **Nature of Probability** | Probability estimates have an **epistemic resolution floor**. An estimate $P$ is only meaningful if supported by evidence mass $N$ such that $P \geq 1/N$. Below this floor, the number is noise, not signal. | Probability is **degree of belief**. Any coherent assignment of belief, however small, is valid. There is no non-zero floor; there is only the limit as $P \to 0$. |
  | **Handling "Noise"** | Below the floor, $P \times V$ is not a small number; it is a category error. The model error swallows the mean. Acting on it is not risk-aversion; it is treating noise as data. | Truncating probabilities at an arbitrary floor is **motivated stopping**. It is equivalent to assigning probability zero to events you dislike, which leaves you vulnerable to Dutch Books (guaranteed losses). |
  | **The "Arbitrariness" Objection** | The floor is not arbitrary; it is determined by the **effective sample size** of the model's validation. A fault tree with 10,000 hours of test data has a different floor than a narrative argument. | The choice of *which* evidence counts toward the sample size is arbitrary. You can always construct a reference class that makes the evidence look smaller or larger to suit the desired conclusion. |
  | **Utility Function** | We can treat lives linearly ($1M$ lives = $1,000,000 \times 1$ life). The refusal to act comes from the probability term being invalid, not the value term being discounted. | The refusal to act behaves mathematically *as if* the utility function is concave (diminishing marginal value of lives), even if you claim it isn't. This is risk-aversion smuggled into epistemology. |
  | **The "Larger Payoff" Objection** | If the payoff $V$ increases, the required evidence mass $N$ must increase proportionally to keep the signal-to-noise ratio constant. You cannot buy validity with stakes. | If $V$ is large enough, it dominates any fixed epistemic cost. If you reject a bet at $V_1$, there exists a $V_2$ where you must accept it. If not, you are ignoring positive EV. |

  ---

  ## 3. THE CRUXES
  *We identify four specific points of divergence. Resolving any one of these would significantly shift the debate.*

  ### Crux 1: Source Trustworthiness vs. Probability Magnitude
  **Question:** Is the rejection of the "fanatical" bet due to the probability being *small* ($10^{-9}$), or due to the probability being *ungrounded* (lacking a causal model)?
  *   **IE Claim:** If I gave you a $10^{-9}$ probability derived from a validated physics model (e.g., cosmic ray bit-flip causing specific logic failure), you would accept the EV calculation. Therefore, the issue is the source, not the magnitude.
  *   **EVM Claim:** Most $10^{-9}$ estimates are ungrounded, but if the EV is high enough, even a weakly grounded estimate should move you. The issue is that people intuitively reject small magnitudes and blame the source to justify it.

  ### Crux 2: Utility Concavity vs. Epistemic Cutoff
  **Question:** Is the IE secretly risk-averse regarding outcomes (valuing 1 million lives saved as less than $1,000,000 \times$ 1 life saved)?
  *   **IE Claim:** No. I value lives linearly. I reject the bet because the probability term is epistemically void. If the probability were certain ($P=1$), I would take the action to save 1 million lives over 1 life.
  *   **EVM Claim:** Your behavior is indistinguishable from someone with a concave utility function. If you refuse to trade a certainty of 1 life for a $10^{-6}$ chance of 2 million lives, you are acting *as if* the 2 million lives are worth less than 2 million times the 1 life.

  ### Crux 3: Action vs. Deliberation vs. Investment
  **Question:** Is "fanaticism" a claim about what you should *do*, what you should *fund*, or what you should *think about*?
  *   **IE Claim:** There is a distinction between **Deliberation Priority** (don't waste time analyzing noise) and **Action Priority** (if the analysis is handed to you for free, maybe act). My view is primarily about allocation of engineering effort (deliberation cost).
  *   **EVM Claim:** If the EV is truly higher, you should do it regardless of deliberation cost. Separating "thinking" from "doing" is a workaround. If the math says act, you act. If you say "don't think about it," you are admitting the math breaks down.

  ### Crux 4: The Regress Problem (Scaling Payoff)
  **Question:** Can a sufficiently large payoff $V$ overcome any epistemic resolution floor?
  *   **IE Claim:** No. As $V$ scales, the required evidence mass $N$ must scale with it to maintain resolution. A claim of $10^{-20}$ probability cannot be validated by human-scale evidence, regardless of whether the stake is $10^{20}$ lives or $10^{100}$ lives.
  *   **EVM Claim:** Yes. If $V$ is astronomically large, even a tiny, noisy probability estimate yields an EV that dominates finite alternatives. To deny this is to assert a "leverage penalty" that isn't in the math.

  ---

  ## 4. CONCRETE TESTS & THOUGHT EXPERIMENTS
  *For each Crux, we propose a specific scenario. Both parties will write down their prediction and concession criteria.*

  ### Test for Crux 1 (Source vs. Magnitude)
  **Scenario:** The "Black Box" Experiment.
  *   **Case A:** A speculative philosopher argues there is a $10^{-9}$ chance a ritual saves $10^{15}$ lives. (EV = $10^6$ lives).
  *   **Case B:** A validated engineering model (5-sigma confidence, extensive testing) shows a $10^{-9}$ chance a specific server configuration loses $10^{15}$ records. (EV = $10^6$ records).
  *   **Procedure:** We must decide whether to spend \$50k to mitigate both risks.
  *   **IE Prediction:** I will mitigate Case B, ignore Case A.
  *   **EVM Prediction:** IE will hesitate on Case B, revealing the magnitude is the real blocker, not the source.
  *   **Concession:**
      *   If IE mitigates Case B without hesitation, EVM concedes Crux 1 (Source matters).
      *   If IE hesitates on Case B citing the small number, IE concedes Crux 1 (Magnitude matters).

  ### Test for Crux 2 (Concavity)
  **Scenario:** The "Certain Trade" Experiment.
  *   **Setup:** IE is offered a choice:
      *   Option 1: Save 1 life with 100% certainty.
      *   Option 2: Save 2,000,000 lives with 0.000001 (1 in a million) probability.
      *   (Both have Expected Value = 1 life).
  *   **Procedure:** IE must choose one. No "noise" argument applies; the probabilities are stipulated as exact for the sake of the thought experiment.
  *   **IE Prediction:** I will choose Option 2 (Maximize EV). This proves I am not utility-concave.
  *   **EVM Prediction:** IE will choose Option 1 (Certainty). This proves IE is risk-averse on outcomes, not just skeptical of probabilities.
  *   **Concession:**
      *   If IE chooses Option 1, IE concedes their view relies on risk-aversion (concave utility), not just epistemic floors.
      *   If IE chooses Option 2, EVM concedes the IE's utility function is linear, and the dispute is purely about epistemic validity in the real world.

  ### Test for Crux 3 (Deliberation vs. Action)
  **Scenario:** The "Free Analysis" Experiment.
  *   **Setup:** A trusted third party performs the fault-tree analysis for the 1-in-a-million storage bug. They hand the report to the IE for free (zero deliberation cost). The report confirms $P = 10^{-6}$, Loss = High. EV > Cost of Fix.
  *   **Procedure:** Does the IE authorize the fix?
  *   **IE Prediction:** Yes. My objection was about spending a *sprint* (deliberation/resource cost) on noise. If the signal is validated externally, I act.
  *   **EVM Prediction:** No. IE will still find a reason not to act, because the underlying probability is below their "resolution floor" regardless of who calculated it.
  *   **Concession:**
      *   If IE authorizes the fix, EVM concedes the dispute is largely about resource allocation/deliberation costs, not fundamental EV theory.
      *   If IE refuses the fix, IE concedes their view is a fundamental rejection of EV, not just a heuristic for engineering time.

  ### Test for Crux 4 (Scaling Payoff)
  **Scenario:** The "Infinite Stakes" Experiment.
  *   **Setup:** The speculative philosopher returns. The probability remains $10^{-9}$ (unanchored). The payoff increases from $10^{15}$ lives to $10^{100}$ lives (universe simulation).
  *   **Procedure:** At what point, if any, does the IE act?
  *   **IE Prediction:** Never. No amount of payoff validates a probability estimate derived from zero evidence. $Noise \times Infinity$ is still undefined.
  *   **EVM Prediction:** There is a number. If the payoff is the existence of all possible mathematical structures, the IE will act. If they say "never," they are assigning P=0, which is dogmatic.
  *   **Concession:**
      *   If IE identifies a specific payoff threshold where they act, IE concedes Crux 4 (Payoff can overcome floor).
      *   If IE maintains they would never act regardless of payoff size, EVM concedes the IE holds a "Lexical Priority" view (some rules trump EV), which is a coherent but non-EV-maximizing stance.

  ---

  ## 5. VERBAL VS. SUBSTANTIVE FLAG
  *We identify areas where we suspect we are using the same words to mean different things, which may be masking agreement.*

  **1. The Definition of "Probability"**
  *   **Suspicion:** This is the highest risk of verbal disagreement.
  *   **IE Usage:** Tends toward **Frequentist/Propensity**. Probability implies a physical mechanism or a reference class of similar events. If no reference class exists, "probability" is a misnomer.
  *   **EVM Usage:** Tends toward **Bayesian/Subjective**. Probability is a measure of credence. It exists even without a reference class, provided the agent is coherent.
  *   **Substantive Check:** If the IE admits that "credence" can guide action even without frequency, but simply demands a penalty for low-confidence credence, the gap narrows. If the EVM admits that "credence" without a model is operationally useless for engineering, the gap narrows.
  *   **Action:** We will attempt to rephrase the debate using "Confidence-Weighted Expectation" rather than "Probability" to see if the disagreement persists.

  **2. The Definition of "Arbitrary"**
  *   **Suspicion:** EVM calls the Resolution Floor "arbitrary." IE calls the Floor "derived from evidence mass."
  *   **Substantive Check:** Is the formula $P_{min} = 1/N_{evidence}$ actually calculable in practice?
  *   **Action:** If IE cannot provide a rigorous method to calculate $N_{evidence}$ for a novel software system, the EVM is correct that the floor is effectively intuitive/arbitrary. If IE can define $N$ (e.g., "hours of equivalent test coverage"), the floor is principled.

  **3. "Risk Aversion" vs. "Model Error"**
  *   **Suspicion:** EVM claims IE is risk-averse. IE claims they are accounting for model error.
  *   **Substantive Check:** In standard decision theory, accounting for model error (ambiguity aversion) *looks like* risk aversion.
  *   **Action:** We acknowledge this may be a substantive disagreement about whether "ambiguity" is a distinct cost from "risk." If it is distinct, IE is not risk-averse. If it is not, EVM is correct that this is just risk aversion.

  ---

  **NEXT STEPS:**
  1.  Both parties review the "Concrete Tests" section.
  2.  Both parties commit to answering the "Procedure" questions in writing within 7 days.
  3.  We reconvene to compare answers against the "Concession Criteria."
