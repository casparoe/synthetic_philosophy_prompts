      *   *Resolution Floor:* The User's view. $P_{estimated}$ is valid only if $P_{estimated} \geq 1/N_{evidence}$. Below this, the estimate is indistinguishable from model error.
      *   *Anchored vs. Unanchored:* "Anchored" means derived from reference classes, physical models, or frequentist data (e.g., disk failure rates). "Unanchored" means speculative, narrative-driven, or single-instance metaphysical claims (e.g., Pascal's Mugging, simulation hypotheses).
      *   *Utility Concavity:* The Friend suspects the User actually values saving 1 million lives less than $1,000,000 \times$ saving 1 life (diminishing marginal utility), but is calling it probability skepticism to avoid the ethical bullet.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound collaborative and precise. "On the Epistemic Resolution of Probability Estimates in High-Stakes Decision Making."
