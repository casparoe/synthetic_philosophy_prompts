answer: |-
  The most defensible reconstruction of your department's practices is that it operates on an implicit **Nietzschean functionalism**. The department presupposes that history is not a single epistemic pursuit but a technology of cultural maintenance, requiring three distinct, mutually antagonistic modes to sustain institutional vitality. Feature 1 (Gen-Ed) serves **Monumental history**: it provides inspiring examples to enlarge the student and legitimize the discipline to outsiders. Feature 2 (Research) serves **Antiquarian history** (refined into professional scientism): it preserves the past in minute detail, securing professional legitimacy through rigor and novelty. Feature 3 (Unmasking) serves **Critical history**: it judges and condemns the past to liberate the present from inherited power structures.

  On this view, the time conventions are not arbitrary hurdles but regulatory mechanisms. The fifty-year rule prevents Critical history from devolving into mere partisanship, protecting the department's claim to objective distance. The twenty-five-year naming rule and annotation policy balance Antiquarian preservation (continuity) with Critical judgment (truth-telling), allowing critique without erasure. The implicit theory is that history is for **Life**: it must inspire (Monumental), preserve (Antiquarian), and liberate (Critical). No single mode suffices; each checks the others' excesses. The department funds all three because a culture that only venerates greatness becomes mythic; one that only archives becomes sterile; one that only unmasks becomes nihilistic.

  Does this arrangement strictly presuppose the Nietzschean standard of "Life"? Yes, because monistic standards collapse the structure. If history's only obligation were **Truth** (Feature 2 dominant), Feature 1 would be indefensible indoctrination, as "greatness" often relies on myth. The department would have to rewrite the Gen-Ed course to emphasize contingency over exemplarity. If the point were **Citizenship** (Feature 3 dominant), Feature 2 would be wasteful specialization, and the fifty-year rule would be obstructionist, as citizens need to understand current power. If the point were **Continuity** (Feature 1 and 5 dominant), Feature 3 would be vandalism, and the annotation policy would likely shift to removal to protect community cohesion. The fact that the department maintains all five features suggests it values the *tension* itself, implying that the goal is not a specific output (truth, citizens, continuity) but the health of the ecosystem itself. The discriminating fact lies in how the department handles a crisis of truth. If a "Great Figure" is proven morally repugnant, a Truth-based department would revoke the honor; a Continuity-based one would hide the flaw; your department annotates the plaque. This suggests the goal is neither pure truth nor pure continuity, but the *process* of negotiating them.

  However, the practice contains genuine internal inconsistencies, not merely productive tensions. The annotate-don't-remove policy presupposes that the critical attitude can be contained—that one can condemn a namesake's actions while keeping their name. But Feature 3 claims canons are *instruments of power*. If the name itself is the instrument, annotation is complicity, not critique. Furthermore, the fifty-year rule contradicts the unmasking requirement. If the historian's job is to expose power, and power operates most urgently in the present, banning recent history neuters the Critical function. It presupposes a protected zone of unexamined present, which reconciles the department with current politics but betrays the philosophical claim of Feature 3. The department wants the *virtue* of critique without the *risk* of immediacy.

  Under the rival views, the changes would be structural. A **Truth-only** view would eliminate Feature 1 (greatness narratives) and Feature 5 (honorifics based on reputation), replacing them with correction protocols. A **Citizenship-only** view would eliminate Feature 2 (specialist monographs) and the fifty-year rule, forcing history into public policy engagement. A **Continuity-only** view would eliminate Feature 3 (unmasking), replacing it with heritage celebration. Each rival view simplifies the curriculum but loses the department's current resilience.

  Finally, is this confusion or wisdom? On the Nietzschean view, offering different justifications to different audiences is not incoherence; it is the necessary condition of the department's survival. Donors require Monumental history; hiring committees require Antiquarian rigor; faculty require Critical relevance. To unify these justifications explicitly would be to destroy the utility of each. The "confusion" you perceive is the friction of a machine designed to run on conflicting fuels. The department is not confused about what history is; it is pragmatically committed to the view that history must be whatever the present needs it to be, even if that requires holding contradictory beliefs simultaneously. The only failure is the refusal to admit this pluralism openly, which leaves students to navigate the contradictions without the map you are now seeking.
