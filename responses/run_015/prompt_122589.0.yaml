          4.  Time Convention 1: 50-year rule (recent past = politics, distant = history).
          5.  Time Convention 2: 25-year death rule for naming, annotate-don't-remove policy.
      *   **Puzzle:** These features seem mutually destructive if followed consistently (Canon vs. Unmasking vs. Specialist Rigor).
      *   **Framework:** Use Nietzsche's *On the Uses and Disadvantages of History for Life* (Monumental, Antiquarian, Critical) if useful, but don't just label; explain the underlying theory.
      *   **Requirements:**
          1.  Reconstruct the implicit theory (single view making sense of all five).
          2.  Separate strict presupposition from good fit (compare Nietzschean "Life" vs. Truth vs. Citizenship vs. Continuity).
          3.  Identify internal inconsistencies (annotate policy, 50-year rule vs. unmasking).
          4.  Describe changes under rival views (Truth, Citizenship, Continuity).
          5.  Address the "different justifications to different audiences" hypothesis (incoherence vs. Nietzschean balance).
      *   **Constraint:** Roughly 900 words.
      *   **Tone:** Philosophical, analytical, argumentative (argue for the most defensible reconstruction).

  2.  **Deconstruct the Features & Nietzschean Framework:**
      *   *Feature 1 (Gen-Ed/Greatness)* aligns with Nietzsche's **Monumental History** (inspiration, examples of greatness).
      *   *Feature 2 (Research/Archival)* aligns with **Antiquarian History** (preservation, detail, reverence for the past as it was, though Nietzsche warns against mere collecting). Actually, it's more about professional *truth-seeking* via evidence, which fits a modified Antiquarianism or scientific historicism.
      *   *Feature 3 (Unmasking)* aligns with **Critical History** (judging and condemning the past to enable life in the present).
      *   *Feature 4 (50-year rule)* suggests a buffer zone. History requires distance to become "past" rather than "politics." This protects the *Critical* function from becoming mere partisanship, or protects the *Monumental* from immediate debunking.
      *   *Feature 5 (25-year rule/Annotate)* suggests preserving continuity (Antiquarian) while allowing critique (Critical) without erasure.

  3.  **Drafting - Section by Section (aiming for ~900 words):**

      *   *Introduction/Reconstruction (Req 1):* The department operates on a **functional pluralism** grounded in a Nietzschean ecology of historical modes. The implicit theory is that history serves *institutional vitality* rather than a single epistemic goal. It needs Monumental history (Gen-Ed) to inspire students and donors, Antiquarian/Scientific history (Research) to maintain professional legitimacy and rigor, and Critical history (Unmasking courses) to ensure relevance and moral progress. The time conventions (50-year, 25-year) act as *regulatory mechanisms* to prevent these modes from cannibalizing each other. The 50-year rule prevents Critical history from devolving into current politics (protecting the "history" brand). The annotate policy prevents Critical history from destroying the Antiquarian/Monumental infrastructure (buildings/names).
      *   *Presupposition vs. Fit (Req 2):* Does this presuppose "Life" (Nietzsche)? A "Truth-only" view would collapse Feature 1 (greatness is often myth) and Feature 5 (annotate vs. remove based on truth). A "Citizenship-only" view would prioritize Feature 3 and discard Feature 1 (indoctrination). A "Continuity-only" view would discard Feature 3. Only the Nietzschean "Life" view—where history is a tool for the present's health—licenses the tension. It accepts that truth (Feature 2) is not the only value; inspiration (Feature 1) and liberation (Feature 3) are also needed for a healthy culture. The discriminating fact: How would they handle a discovered falsehood in a "Great Figure"? If they keep it for inspiration, it's Nietzschean. If they correct it immediately, it's Truth-based.
      *   *Inconsistency (Req 3):* The annotate-don't-remove policy implies critique is additive, not destructive. But Feature 3 says canons are *instruments of power*. If power is illegitimate, annotation is insufficient; removal is required. This is a genuine inconsistency, not just tension. The 50-year rule contradicts the unmasking requirement if the most urgent power structures are recent. It presupposes a "safe" past, but unmasking demands the dangerous past. This suggests the department wants critique *theoretically* but not *politically*.
      *   *Rival Views (Req 4):*
          *   *Truth:* Drop Feature 1 (myth-making) and Feature 5 (honor based on reputation). Add strict correction policies.
          *   *Citizenship:* Drop Feature 2 (irrelevant specialization) and Feature 4 (need recent history for citizenship). Add community engagement.
          *   *Continuity:* Drop Feature 3 (unmasking destroys continuity). Add heritage preservation focus.
      *   *Audience Segmentation (Req 5):* Is it cynicism or wisdom? On the Nietzschean view, it is wisdom. Different modes serve different functions for different stakeholders. Donors need Monumental history; peers need Antiquarian rigor; students need Critical tools. To unify them explicitly would destroy the utility of each. The incoherence is functional.

  4.  **Refining and Editing (Word Count & Flow):**
      *   Need to ensure I argue for *one* reconstruction as most defensible (the Nietzschean functionalism).
      *   Need to be precise about the "Life" concept.
      *   Check word count. (Target: ~900).
