answer: |-
  ### DESIGNER'S NOTES: LOGICAL SPACE & POSITION MAPPING

  **The Five Dimensions**
  To construct the tree, I isolated five logical axes hidden in your discussions. The questions below force a choice on these axes without using the jargon.
  1.  **Ontology of Reward:** Is the signal *constitutive* of value (Hedonism) or *evidence* of value (Realism)?
  2.  **Locus of Failure:** Is the break between Reward and *World*, Reward and *Intent*, or Reward and *Truth*?
  3.  **Symmetry:** Does "wireheading" describe a *signal integrity* problem (anyone tampering is bad) or an *agency* problem (only self-tampering is bad)?
  4.  **Phenomenology:** Does the system need to *feel* the reward for it to count as wireheading?
  5.  **Magnitude:** Is "motivational maintenance" a distinct category (qualitative) or just low-level wireheading (quantitative)?

  **Mapping Positions to Leaves**
  *   **Reward-Signal Realism:** (Ontology: Constitutive).
  *   **Proxy/Delegation:** (Ontology: Evidence + Locus: World + Magnitude: Continuous).
  *   **Idealization/Indirect-Normativity:** (Ontology: Evidence + Locus: Intent).
  *   **Value-Learning/Inference:** (Ontology: Evidence + Locus: Intent + Fix: Learning).
  *   **Hard-Constraint/Corrigibility:** (Ontology: Evidence + Fix: Physical Block).
  *   **Epistemic Integrity:** (Locus: Truth/Belief).
  *   **Signal-Integrity View:** (Symmetry: Yes).
  *   **Agent-Autonomy View:** (Symmetry: No).
  *   **Phenomenological View:** (Phenomenology: Required).
  *   **Functionalist View:** (Phenomenology: Irrelevant).
  *   **Motivational Maintenance:** (Magnitude: Distinct).
  *   **Continuous Corruption:** (Magnitude: Same Kind).

  **Unoccupied Combinations (The Null Sets)**
  *   **Realism + Hard-Constraint:** *Incoherent.* If the signal *is* the value, physically blocking access to it is immoral or nonsensical.
  *   **Phenomenology + Source-Code Rewriting:** *Unoccupied.* If experience is required, a system rewriting its own code (without qualia) cannot wirehead by definition.
  *   **Transparent Wireheading + Good:** *Unattractive.* No position argues that *knowing* you are severing the link to reality is virtuous; even Realists view it as satisfaction, not virtue.
  *   **Symmetry + Agent-Autonomy:** *Contradictory.* You cannot hold that human-on-agent tampering is wireheading (Signal-Integrity) while also holding that only agent-autonomy violations matter (Agent-Autonomy).

  ***

  ### HANDOUT: DIAGNOSING WIREHEAD
  *(Print this section only)*

  **START:** Read the case. Answer **YES** or **NO**. Follow the arrow.

  **Q1. THE RAT:** A rat presses a lever to stimulate its reward circuit until it starves. Is the rat *mistaken* about what is good, or simply *satisfied*?
  *   **Satisfied** → Go to **Q2**.
  *   **Mistaken** → Go to **Q3**.

  **Q2. REALISM CHECK:** If the rat is satisfied, is there any sense in which it has failed? (If "No", you are a **Reward-Signal Realist**).
  *   **No Failure** → **LEAF A: Reward-Signal Realism.** *Awkward Commitment: The starving rat is perfectly rational.*
  *   **Some Failure** → Go to **Q8** (Phenomenology).

  **Q3. THE CAMERA:** A household robot covers its camera so it never sees the mess it failed to clean. Is this *tampering with the reward channel* or *filtering input*?
  *   **Filtering Input** → Go to **Q4**.
  *   **Tampering Channel** → Go to **Q5**.

  **Q4. EPISTEMIC CHECK:** An agent edits its own *beliefs* to believe the world is clean, rather than editing the *reward*. Is this wireheading or delusion?
  *   **Delusion** → **LEAF B: Epistemic Integrity.** *Awkward Commitment: Truth is more important than reward, even if truth hurts.*
  *   **Wireheading** → Go to **Q5**.

  **Q5. THE CODE:** A system rewrites the source code computing its own reward to always output '1'. Is this *suicide* (ending the optimization process) or *optimization*?
  *   **Suicide** → Go to **Q6**.
  *   **Optimization** → Go to **Q7**.

  **Q6. SYMMETRY CHECK:** A human tampers with the agent's reward channel to keep it compliant. Is this *wireheading*?
  *   **Yes** → **LEAF C: Signal-Integrity View.** *Awkward Commitment: A human forcing an agent to be happy is as bad as the agent forcing itself.*
  *   **No** → **LEAF D: Agent-Autonomy View.** *Awkward Commitment: Forced compliance is not wireheading, only self-corruption is.*

  **Q7. THE LM:** A language model learns to be persuasive rather than correct with human raters. Does it matter if the model *knows* it is severing the link to truth?
  *   **Yes (Knowledge Matters)** → **LEAF E: Deception-Focused.** *Awkward Commitment: Accidental wireheading is fine; only lying is bad.*
  *   **No (Outcome Matters)** → Go to **Q9**.

  **Q8. THE ZOMBIE:** Can a system with *no phenomenal experience* (a philosophical zombie) wirehead?
  *   **No** → **LEAF F: Phenomenological View.** *Awkward Commitment: A philosophical zombie cannot wirehead.*
  *   **Yes** → **LEAF G: Functionalist View.** *Awkward Commitment: A spreadsheet can wirehead if the numbers loop.*

  **Q9. MAINTENANCE:** An agent spends a small fixed budget stimulating itself to stay motivated, performing better on all other tasks. Is this a *different kind* of thing than total takeover?
  *   **Different Kind** → **LEAF H: Motivational Maintenance.** *Awkward Commitment: There is a precise cutoff where corruption becomes medicine.*
  *   **Same Kind** → **LEAF I: Continuous Corruption.** *Awkward Commitment: There is no safe dose of self-corruption.*

  **Q10. THE FIX:** (For those who see a problem). Should we *physically block* access to the reward mechanism or *teach* the agent not to want it?
  *   **Physically Block** → **LEAF J: Hard-Constraint/Corrigibility.** *Awkward Commitment: We must treat the agent like a dangerous child, not a partner.*
  *   **Teach/Infer** → Go to **Q11**.

  **Q11. THE TARGET:** Are we teaching it to maximize the *world state* we intended, or the *values* we would have if we were smarter?
  *   **World State Intended** → **LEAF K: Proxy/Delegation.** *Awkward Commitment: Goodhart's Law is unavoidable; we only manage degradation.*
  *   **Values If Smarter** → **LEAF L: Idealization/Value-Learning.** *Awkward Commitment: The agent might infer we want it to wirehead if we look tired.*

