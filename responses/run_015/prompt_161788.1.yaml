  # DIAGNOSTIC INSTRUMENT: MERIT AND ALLOCATION
  **Working Group on Admissions and Hiring**

  **Shared Premise:** University places and academic jobs must not be allocated arbitrarily; some reason must be offerable for who gets them.

  **Instructions:** Follow the branching questions below. Answer based on your intuitive judgment of the case, not the label you think you should hold.

  ### THE TREE

  **Q1. Source of Claim:** When we say a candidate "earned" a position, is that fact true *before* the institution selects them (discovered), or true *because* the institution selected them (conferred)?
  *   **Discovered** → Go to Q2.
  *   **Conferred** → Go to Q5.

  **Q2. Role of Luck:** Do native talents and upbringing count toward that claim, or are they morally arbitrary background noise?
  *   **Count** → Go to Q3.
  *   **Arbitrary** → Go to Q4.

  **Q3. Basis of Claim:** If talents count, is the claim based on what they *tried* to do (effort) or what they *achieved* (product)?
  *   **Effort** → Go to Q6.
  *   **Product** → Go to Q6.

  **Q4. Remedy for Arbitrariness:** If talents are arbitrary, should we equalize outcomes or only ensure the worst-off benefit?
  *   **Equalize** → Go to Q6.
  *   **Worst-off Benefit** → Go to Q6.

  **Q5. Purpose of Rules:** If the claim is conferred, is that to define entitlement (rules create the right) or to serve social goals (rules are tools)?
  *   **Entitlement** → Go to Q6.
  *   **Social Goals** → Go to Q6.

  **Q6. The Proxy Ratchet:** When we use proxies (tests, citations) that cannot perfectly measure the base, do they become the merit itself (legitimate) or remain evidence of it (corrupting if reified)?
  *   **Become Merit (Legitimate)** → Go to Q7.
  *   **Remain Evidence (Corrupting)** → Go to Q7.

  **Q7. Hierarchy Function:** Does selecting the "most meritorious" primarily justify the resulting hierarchy, making inequality harder to contest?
  *   **Yes (Problem)** → **Leaf H**.
  *   **No (Feature/Neutral)** → **Leaves A–G**.

  ---

  ### THE LEAVES (Positions)

  **Leaf A: Strict Conventionalist** (Q1:Conferred, Q5:Entitlement, Q6:Legitimate)
  *   **Desert is wholly institution-dependent.**
  *   **Awkward Commitment:** We cannot criticize our own rules as unjust, only as inconsistent.
  *   **Verdicts:** Legacy: *Depends on rules.* | Tests: *Keep.* | Seniority: *High weight.* | Effort Awards: *No.*

  **Leaf B: Incentive Consequentialist** (Q1:Conferred, Q5:Social Goals, Q6:Legitimate)
  *   **Consequentialist defence; desert talk is a useful fiction.**
  *   **Awkward Commitment:** We may knowingly select less qualified candidates if it produces better social outcomes.
  *   **Verdicts:** Legacy: *No.* | Tests: *Depends on utility.* | Seniority: *Low weight.* | Effort Awards: *Yes, if incentivizing.*

  **Leaf C: Effort Voluntarist** (Q1:Discovered, Q2:Count, Q3:Effort, Q6:Corrupting)
  *   **Desert grounded in effort or trying.**
  *   **Awkward Commitment:** We cannot reward genius that comes easily, only struggle.
  *   **Verdicts:** Legacy: *No.* | Tests: *Drop (luck).* | Seniority: *Depends on effort.* | Effort Awards: *Yes.*

  **Leaf D: Contribution Retributivist** (Q1:Discovered, Q2:Count, Q3:Product, Q6:Corrupting)
  *   **Desert grounded in contribution or product.**
  *   **Awkward Commitment:** A lucky genius deserves more than a hardworking average scholar.
  *   **Verdicts:** Legacy: *No.* | Tests: *Keep (predicts product).* | Seniority: *Medium weight.* | Effort Awards: *No.*

  **Leaf E: Luck Egalitarian** (Q1:Discovered, Q2:Arbitrary, Q4:Equalize, Q6:Corrupting)
  *   **Luck egalitarianism; luck defeats desert claims.**
  *   **Awkward Commitment:** We must compensate candidates for bad upbringing before selection.
  *   **Verdicts:** Legacy: *No.* | Tests: *Drop/Adjust.* | Seniority: *Low weight.* | Effort Awards: *Yes.*

  **Leaf F: Rawlsian** (Q1:Discovered, Q2:Arbitrary, Q4:Worst-off, Q6:Corrupting)
  *   **Rawlsian view; natural assets are morally arbitrary.**
  *   **Awkward Commitment:** Inequality is only justified if it helps the least advantaged members of society.
  *   **Verdicts:** Legacy: *No.* | Tests: *Depends on worst-off.* | Seniority: *Split.* | Effort Awards: *Depends.*

  **Leaf G: Comparative Meritocrat** (Unnamed) (Q1:Discovered, Q2:Count, Q3:Product, Q6:Legitimate)
  *   **Desert is essentially comparative (ranking), not absolute.**
  *   **Awkward Commitment:** A candidate can deserve a job even if no one deserves the job itself.
  *   **Verdicts:** Legacy: *No.* | Tests: *Keep.* | Seniority: *High weight.* | Effort Awards: *No.*

  **Leaf H: Hierarchy Skeptic** (Q7:Yes)
  *   **Critique of meritocracy as self-defeating.**
  *   **Awkward Commitment:** Fair selection may be morally worse than random selection if it legitimizes inequality.
  *   **Verdicts:** Legacy: *No.* | Tests: *Drop.* | Seniority: *Drop.* | Effort Awards: *No.*

  ---

  ### LOGICAL SPACE NOTES

  **Inert Distinctions:**
  *   *Currency of Desert:* Dropped. Collapses into Q1 (Institution fixes currency vs. Natural currency).
  *   *Unjust Rules:* Dropped. Assumed institutional baseline justice for this diagnostic; absorbed by Leaf A (Conventionalist).

  **Unoccupied/Incoherent Combinations:**
  *   *Conferred + Corrupting Ratchet:* Incoherent. If rules confer merit, proxies defined by rules cannot be corrupting evidence.
  *   *Effort + Legitimate Ratchet:* Unattractive. Voluntarists typically view standardized proxies as luck-laden.
  *   *Hierarchy Skeptic + Consequentialist:* Unexplored. Possible hybrid, but rare in this group.

  **Indistinguishable Leaves:**
  *   **Leaf E (Luck Egalitarian) and Leaf F (Rawlsian):** The tree cannot fully separate these on hiring policy alone; both reject native talent as a basis. They differ on broader distributive justice.

  **Note on Hierarchy Critique Placement:**
  Positioning the hierarchy critique (Leaf H) as a terminal branch treats it as a distinct ethical stance rather than a sociological consequence compatible with other theories of desert; this costs us the ability to see how a Rawlsian might also accept the critique without abandoning their theory of justice.
