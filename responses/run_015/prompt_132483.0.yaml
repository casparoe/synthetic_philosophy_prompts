answer: |-
  **MEMORANDUM**

  **TO:** Faculty Adversarial Collaboration Participants
  **FROM:** PhD Convenor
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Framework for Joint Statement on Higher-Education Finance

  ### 1. Agreed Claims

  1.  **Composition of the Earnings Premium:** The observed graduate earnings premium is a composite of human capital accumulation (skill creation) and signalling/positional effects (screening). Neither component is zero; neither component is 100%. The optimal financing instrument depends on the weight of the signalling component, as public subsidy of pure signalling constitutes a rent-seeking arms race rather than productivity growth.
  2.  **Separation of Instruments:** Tuition finance (payment to the institution) and maintenance finance (support for the student) are distinct policy levers with distinct incidence. Conflating them obscures the primary barrier to entry for low-income students, which is liquidity constraint during the study period rather than the nominal price of the degree.
  3.  **Marginal Tax Rates:** Both financing models create wedges between social and private returns via the tax system. A system with free tuition and progressive income taxation imposes high effective marginal tax rates on high earners to subsidize the premium they capture. A system with income-contingent contributions imposes high effective marginal tax rates on middle-to-high earners to service the obligation. Both systems reduce the net private return to high-intensity labor; the distributional difference lies in where the wedge bites.
  4.  **Low-Paid Work Incentives:** Any repayable obligation attached to earnings creates a disincentive to enter low-paid sectors. However, a system funded by general taxation also creates a disincentive if the progressive income tax required to fund the subsidy withdraws income from those same low-paid graduates. The magnitude of the distortion depends on the taper rate of the repayment scheme versus the marginal income tax rate in the counterfactual.
  5.  **Cross-Border Externalities:** In an open labor market, a country that funds higher education through general taxation subsidizes the tax bases of destination countries if graduates emigrate. A repayable obligation attached to the person mitigates this leakage, whereas a graduate tax levied only on domestic income exacerbates it.
  6.  **Terminology and "Debt":** We acknowledge a verbal dispute and a substantive dispute regarding the word "debt."
      *   *Verbal:* One side defines debt by legal structure (fixed obligation, default risk, balance sheet liability). The other defines debt by behavioral effect (psychological burden, option restriction, aversion).
      *   *Substantive:* The unresolved question is whether labeling an income-contingent, write-off-enabled obligation as "debt" triggers the behavioral aversion associated with commercial loans, independent of the actual net present value paid.
      *   *Agreement:* For the remainder of this memo, we will use the term "Graduate Obligation" to describe income-contingent repayments to isolate the structural mechanics from the semantic baggage.

  ### 2. Residual Disagreements

  | Row | Claim (Side A: Free Tuition) | Claim (Side B: Income-Contingent) | The Crux | Agreed Evidence / Test | Prediction (Side A) | Prediction (Side B) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Access:** Attaching a Graduate Obligation to entry deters working-class applicants due to loss aversion, regardless of the expected repayment value. | **Access:** Upfront tuition fees deter applicants; Graduate Obligations do not. Working-class access is determined by maintenance support, not tuition pricing. | Does the *form* of financing (fee vs. obligation) change application rates holding net present cost and maintenance support constant? | Natural experiment comparing application elasticities in jurisdictions that switched from grants to obligations vs. fees to obligations, controlling for maintenance grants. | Application rates from low-SES backgrounds will drop significantly when the Obligation is introduced, even if fees are removed. | Application rates from low-SES backgrounds will remain stable or rise if fees are removed, regardless of the Obligation. |
  | **2** | **Equity:** Free tuition is progressive because it removes price barriers for everyone and funds a public good. | **Equity:** Free tuition is regressive because it transfers tax revenue from non-graduates (poorer) to graduates (richer) who capture the earnings premium. | Who are the net beneficiaries of the subsidy over a lifetime horizon? | Lifetime incidence analysis comparing cumulative tax contributions vs. cumulative subsidy value received across income deciles. | The progressivity of the broader welfare state offsets the regressive nature of the education subsidy. | The education subsidy is large enough to dominate the broader welfare state progressivity, resulting in net upward transfer. |
  | **3** | **Efficiency:** Open enrolment allows for intellectual exploration and longer training spells required for complex skills. | **Efficiency:** Open enrolment with no price signal produces credential inflation and extended time-to-degree without productivity gains. | Does removing the price signal at the margin increase time-to-degree without increasing skill acquisition? | Comparative data on average time-to-completion and dropout rates in free-tuition vs. obligation-based systems, matched by field of study. | Time-to-degree increases reflect necessary skill depth and reduced financial stress. | Time-to-degree increases reflect moral hazard and lack of stakeholder commitment. |

  ### 3. Analysis of the Hybrid Model

  We examine a hybrid proposal: **Entry free at the point of use, combined with a time-limited Graduate Obligation.**
  *Structure:* Graduates pay a fixed percentage of income above a threshold for a fixed term (e.g., 10 years). Any remaining balance is written off. The write-off is justified not as a gift, but as recovery via future progressive income taxation on the earnings premium.

  #### 3.1 Individual Obligation Variant
  *   **Mechanism:** The obligation follows the individual. If they earn below the threshold, they pay nothing. If they earn above, they pay until the term expires.
  *   **Side A Position:** Opposes. Even time-limited, this is a "Debt" in the behavioral sense. It reshapes options for the duration of the term and signals that education is a private liability.
      *   *Parameter Threshold:* Will only cease objecting if the Term is negligible (e.g., <3 years) and the Income Threshold is at the median wage.
  *   **Side B Position:** Supports. This is "Insurance, not Debt." The write-off caps the downside risk. It recovers costs from those who benefit without penalizing those who do not.
      *   *Parameter Threshold:* Will only cease objecting if the Term is sufficient to recover a significant portion of direct instruction costs (e.g., >10 years) and the Rate is actuarially significant.
  *   **Collapse Risk:** If the Term is extended indefinitely to ensure cost recovery, this collapses into a Graduate Tax (Side A wins on structure, Side B loses on cost recovery link). If the Write-off is removed to ensure full repayment, this collapses into a Loan (Side B wins on cost recovery, Side A wins on deterrence).

  #### 3.2 Cohort Obligation Variant
  *   **Mechanism:** The obligation is levied on the graduating cohort as a pool. A fixed percentage of income above a threshold is collected from the cohort for a fixed term. If the cohort earns poorly (e.g., recession entry), the obligation expires regardless of total revenue raised.
  *   **Side A Position:** Opposes. It remains an obligation attached to the person's economic activity. It does not remove the psychological barrier at entry.
  *   **Side B Position:** Strongly Supports. This is the only version where "Insurance, not Debt" is literally true. Idiosyncratic risk is pooled; the individual is not liable for their own bad draw, only the cohort's aggregate performance.
      *   *Test of Claim:* Side B's defense of the Individual Variant relies on the assumption that the write-off functions as insurance. The Cohort Variant proves whether Side B values risk-pooling or cost-recovery. If Side B rejects the Cohort Variant because it risks under-recovery, the "Insurance" claim is secondary to the "Fiscal Sustainability" claim.
  *   **Collapse Risk:** If the Cohort Obligation is topped up by general taxation to ensure university solvency regardless of cohort earnings, it collapses into Free Tuition funded by taxation (Side A's position).

  #### 3.3 Parameter Calibration for Consensus
  *   **Threshold:** Must be set at the median graduate earnings to satisfy Side A (protects low earners); must be set low enough to capture the middle class to satisfy Side B (broadens base).
  *   **Percentage:** Must be low enough to avoid labor supply distortion (Side A); must be high enough to meaningfully offset instruction costs (Side B).
  *   **Term:** This is the binding constraint.
      *   Side A requires a Term short enough that the obligation does not influence long-term career planning (e.g., 5 years).
      *   Side B requires a Term long enough that the write-off represents a small fraction of the total portfolio (e.g., 15 years).
      *   *Reconciliation:* There is no parameter set where both stop objecting. The Hybrid does not resolve the fundamental disagreement; it merely shifts the boundary of the dispute from "Fee vs. Free" to "How long does the Obligation last?"

  ### 4. Conclusion

  The Hybrid model clarifies that the dispute is not solely about revenue raising. If it were, a Graduate Tax (infinite term, no write-off) would satisfy Side B's revenue needs and Side A's "no debt" preference. Side B rejects the Graduate Tax because it severs the link between individual benefit and contribution. Side A rejects the Hybrid Obligation because it retains the link between individual benefit and contribution, which she views as commodification.

  Crux: Whether the behavioral deterrence of a Graduate Obligation is driven by the expected net present cost of the payment or by the mere existence of a contingent liability attached to the person at the point of entry.
