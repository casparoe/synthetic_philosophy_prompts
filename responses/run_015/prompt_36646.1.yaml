  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between *exogenous* (software) and *endogenous* (culture) is clear. (Proceed to generate output based on these thoughts.)

      *   *Key Insight to highlight:* The software analogy assumes culture is *exogenous* (comes from outside). Weber's real argument is subtler; it's about an *elective affinity*.
      *   *Key Insight on Friend 2:* Documentation isn't causally inert. Reading the manual changes how you use the machine.

  8.  **Final Output Structure:**
      1.  Introduction: The allure and danger of the metaphor.
      2.  The Audit: Mapping the terms.
      3.  The Breakdowns: 4 key failures (Installation, Bare Metal, Feedback, Convergence).
      4.  The Causal Payoff: Does it prove Weber? (No, it begs the question).
