  hey, im in a philosophy of mind course and we just covered the scale argument about insects. i tried writing out the logic for my study group but now it feels like it proves way too much. here's the chain:

  (1) if an organism has any nonzero chance of being sentient, then its group gets moral weight proportional to that chance times population size.
