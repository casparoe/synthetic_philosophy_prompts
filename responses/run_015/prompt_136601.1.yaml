answer: |-
  **Project Title:** Authority Before Function: Reconstructing Democratic Backsliding as Institutional Trust Decay

  **Research Question**
  Does measuring the decay of perceived institutional authority track standard backsliding verdicts across Hungary, Poland, Turkey, and the US, or does it reveal the concept's partisan bias? Specifically, can we identify a threshold where citizens cease treating institutions as authoritative *before* those institutions technically malfunction?

  **The Problem**
  The current debate is stalled between proceduralists, who look for broken rules (elections, courts), and substantivists, who look for violated rights. Both frameworks assume institutions are neutral machines that function until someone breaks them. This leaves a critical gap: it ignores wether institutions lose legitimacy while still functioning correctly. A court can issue legally sound rulings that the public simply refuses to accept as binding. By focusing on the *output* (rules/rights) rather than the *input* (trust/authority), standard metrics risk labeling any loss by a preferred party as "backsliding."

  **Methodology**
  *Month 1: Quantitative Baseline.* I will extract longitudinal data from the World Values Survey and Eurobarometer focusing on confidence in courts, parliaments, and electoral commissions. I will correlate these trust metrics with objective functionality indices (e.g., V-Dem judicial independence scores) to identify divergences. The goal is to find cases where trust drops while functionality scores remain stable.
  *Month 2: Discursive Analysis.* I will examine executive speeches and legislative records from the four cases during identified trust-decay periods. I am looking for specific rhetorical moves that delegitimize institutional authority without demanding procedural changes (e.g., claiming a court is "politically biased" while accepting its jurisdiction).
  *Month 3: Comparative Synthesis.* I will map the timing of trust decay against key political events. If trust decay consistently precedes procedural breaks, the hypothesis holds. If trust metrics merely mirror partisan voting patterns, the concept is just polarization by another name.

  **Success and Failure Conditions**
  The project succeeds if trust-decay metrics predict backsliding events prior to procedural violations, thereby offering an early-warning system independent of partisan outcomes. This would rescue "backsliding" from being a retrospective label applied by losers. The project fails entirely if trust decay correlates perfectly with partisan identity shifts, proving that "loss of authority" is just a euphemism for "my side lost power."

  **Timeline Feasibility**
  Three months is tight for four countries. To make this viable, I will not attempt a full historical overview. Instead, I will focus on specific windows of crisis (e.g., post-2010 Hungary, post-2016 US) to test the correlation. This limited scope is sufficient to validate the metric without requiring exhaustive archival work.

  **Position and Competing Framing**
  I argue this trust-decay framing *does* rescue the concept. It shifts the definition from normative outcomes (which are contested) to empirical attitudes (which are measurable). The closest competing framing is Procedural Institutionalism. It is wrong because it treats institutions as static containers rather than social constructs. It assumes a court is legitimate as long as the judge follows the rulebook, ignoring that authority is a social fact granted by the public, not a legal status granted by a constitution. If citizens stop believing the referee is neutral, the game is over even if the ref calls every play by the book. By capturing this social dimension, we can distinguish between actual democratic erosion and mere political turnover accross different regimes.
