      *   *Engineering Reality:* Logs are physical. They have cost. They can be destroyed (though hash chains make this hard/detectable). "Attestable" implies *capability*, not just current state.
      *   *Distortion:* "Knowable" in philosophy is often idealized (in principle). "Attestable" in engineering is constrained by what the sensors actually saw. If the sensor didn't see it, it's not attestable, even if it happened. This is a *gap* in the analogy.
