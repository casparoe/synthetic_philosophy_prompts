  2.  **Deconstruct Fitch's Paradox (The Philosophical Core):**
      *   *Knowability Principle (KP):* All truths are knowable ($\forall p (p \to \diamond K p)$).
      *   *Fitch's Proof:* Assume there is an unknown truth $p$. Consider the conjunction $q = p \land \neg K p$ ("$p$ is true and $p$ is not known").
      *   If KP holds, $q$ must be knowable. So $\diamond K(p \land \neg K p)$.
      *   But knowledge distributes over conjunction: $K(A \land B) \to K A \land K B$.
      *   So $\diamond (K p \land K \neg K p)$.
      *   Factivity of knowledge: $K \phi \to \phi$. So $K \neg K p \to \neg K p$.
      *   Contradiction: $\diamond (K p \land \neg K p)$. It is possible to know $p$ and not know $p$ simultaneously.
      *   *Conclusion:* To avoid contradiction, there can be no unknown truths. $\neg \exists p (p \land \neg K p)$. Therefore, all truths are known ($\forall p (p \to K p)$).
      *   *The User's Analog:* "Attestable" $\approx$ "Knowable". "Fact about the system" $\approx$ "Truth". "No-Dark-Truths" $\approx$ KP. Conclusion: "Everything is logged" $\approx$ Omniscience.

