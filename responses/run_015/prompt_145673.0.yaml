answer: |-
  To map this episode onto Tolstoy's apparatus requires forcing square pegs into round holes, because the ontology of the Banksy stunt destabilizes the very categories Tolstoy assumes are stable.

  **Mapping the Agents and Objects**
  For Tolstoy, the artist is an individual soul transmitting feeling. Here, the "artist" is Banksy, but Banksy is a brand, potentially a collective, and certainly an anonymous entity. Tolstoy's theory relies on the sincerity of a known individual; anonymity breaks the link between the life lived and the feeling transmitted. The "work" is equally unstable. Is it the 2006 canvas? The shredding mechanism? The event of destruction? Or the video circulated online? Tolstoy assumes a static object that carries feeling. Here, the object mutates, and the "work" is arguably the performance of value destruction. The audience is split: the auction room (elite, wealthy) and the global online viewership (mass). Tolstoy demands art be accessible to all; this work is accessible only to those who understand the specific codes of the high-art market. The feeling transmitted is not brotherhood or religious unity, but ironic contempt for the market itself. Tolstoy has no slot for irony as a moral feeling.

  **The Infection Test and Frame-Dependence**
  On the surface, the stunt passes Tolstoy's primary definition: art is that which infects. The gasps in the room and the viral spread online prove infection occurred. However, your notion of "frame-dependent infection" reveals a gap in Tolstoy's transmission model. Tolstoy assumes the feeling resides *in* the work and travels via the form to the receiver. Here, the feeling (shock/amusement) cannot be derived from the visual form alone (a girl with a balloon). It requires external knowledge: auction protocols, Banksy's lore, the concept of value. If the feeling depends on context rather than form, Tolstoy's definition of art as a transmission via "external signs" is incomplete. The signs here are institutional, not aesthetic.

  Furthermore, Tolstoy explicitly categorizes "effectness" (shock) and amusement as marks of *counterfeit* art, not true art. He argues that counterfeit art seeks to surprise or entertain rather than unite. The Banksy stunt is purely shock and amusement. Thus, Tolstoy faces a contradiction: it is art because it infects, but counterfeit art because of *how* it infects. His theory issues both verdicts simultaneously. It does not lack the vocabulary to condemn it; it condemns it precisely because it is so successful at being a spectacle.

  **Sincerity and the Market**
  Tolstoy pins counterfeit art on professionalization and payment. The shredder was premeditated, built years in advance specifically for a market scenario. For Tolstoy, this calculation destroys sincerity. Sincerity requires an inner need to express, not a strategic maneuver to manipulate value. The fact that the object was authenticated and retitled by the artist's own body only deepens the corruption; it turns the authentication certificate into part of the performance.

  The market reflexivity—the price rising because the work mocked the price—is something Tolstoy's theory cannot fully map, though his moral intuition covers it. He views the art market as a corruption of true labor. Here, the labor is explicitly designed to inflate market value through the appearance of anti-market sentiment. Tolstoy would argue this proves the feeling was not sincere contempt, but sincere greed masked as contempt. If the artist truly felt contempt for the market, he would not have allowed the sale to complete, nor would he have authenticated the ruin for resale. The profit proves the insincerity.

  **Verdict: Confirmation or Anomaly?**
  The case is a confirmation of Tolstoy's diagnosis of the *art world*, but an anomaly for his definition of *art*. It confirms his view that the upper-class art world is a place of spectacle, professionalism, and financial manipulation devoid of religious consciousness. However, it challenges his reliance on infectiousness as a neutral metric. If infectiousness defines art, this is great art. If moral quality defines *good* art, this is terrible art. Tolstoy tries to have it both ways, but here the infection is undeniable while the morality is inverted.

  The smallest revision to fix this is to decouple infectiousness from artistic status entirely, making moral content the sole definition of art. But this costs Tolstoy his objective criterion. If infection doesn't matter, then any moralizing pamphlet is art, and his critique of Shakespeare or Beethoven based on their failure to move the peasant collapses. He loses the ability to claim that bad art fails to connect; he can only claim it connects with the wrong feelings. This weakens his attack on the moderns, who could claim their difficult works transmit complex, sincere feelings inaccessible to the masses.

  **Silences**
  Tolstoy's map leaves several territories blank. He has no theory for art *about* art (meta-art); he assumes art is about life or God. He cannot account for anonymous or collective authorship, as sincerity is tied to the individual soul. He has no concept of destruction as a mode of production; for him, art is creation. Finally, he cannot comprehend that a certificate of authenticity could constitute the work itself; he assumes the physical object carries the value.

  **The Control Case**
  If we run the control—the stencil on a street wall seen for free—Tolstoy's theory distinguishes them, but not in the way you might hope. He would prefer the street version because it is accessible to all without payment, satisfying his requirement for universality. However, if the feeling transmitted is the same (ironic contempt), both remain counterfeit. Tolstoy cannot distinguish them on artistic merit, only on class accessibility. This is a finding: his theory is blind to the difference between institutional critique performed inside the institution and the same image performed outside it, provided the feeling is identical. He tracks the moral reach, not the structural context. The street version is merely a more democratic delivery of a counterfeit feeling.
