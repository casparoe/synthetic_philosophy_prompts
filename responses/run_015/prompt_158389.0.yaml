  *   **Alvarez's System:** Continuous Functional Realization (Material doesn't matter, but the process cannot stop or branch).
  *   **Prediction:** Not the same person (due to the 5-year fission break).
  *   **Key Precedent:** The River (Process interruption trumps material continuity).
