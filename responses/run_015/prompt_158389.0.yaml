  Here is the breakdown of "The Alvarez Doctrine," the prediction for the split-brain case, and the philosophical machinery behind it.

  ### 1. Decoding Mr. Alvarez's System
  To predict his ruling, we first have to formalize the rules he's already established. Here is what his past cases tell us:

  *   **Material Constitution is Irrelevant:** (Ship of Theseus, Organ Transplant, Chess Club). It doesn't matter if the physical stuff changes, as long as the *organization* persists.
  *   **Sortal Dependence Matters:** (Statue vs. Sword). You can't change the *kind* of thing it is. A statue is defined by its shape; a sword is defined by its function. If you destroy the form, you destroy the object, even if the matter (bronze) survives.
  *   **The "River Constraint" (Crucial):** (River dries up). This is the most important clue. The Ship of Theseus survives part replacement, but the River does not survive a **total cessation of process**.
      *   *Ship:* Gradual replacement = Continuous process = **Same.**
      *   *River:* Flow stops completely = Discontinuous process = **New.**

  **The Alvarez Principle:** Identity persists through **Continuous Functional Realization.**
  As long as the specific function that defines the object (sailing, club membership, flowing water) continues *without interruption*, the object survives material change. If the process stops completely, the object dies, even if it restarts later with the same materials or in the same location.

  ### 2. The Verdict on the Split-Brain Case
  **Prediction:** Mr. Alvarez will rule that this is **NOT the same person.**

