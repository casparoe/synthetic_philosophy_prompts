answer: |-
  The manuscript lies between us, the pages still warm from the printer. The kitchen clock ticks past two.

  "You've read the cousin scenes," I say. "Tell me if they hold."

  "They hold the weight you put on them," she says, tapping the cover. "That is the problem. You have built a floor where there was only air."

  "I owe the reader a human being, not a silhouette. The biographer owes the record fidelity; I owe the record legibility. We are not the same trade."

  "We owe the woman her opacity. The biographer lists the walls of the room; the novelist claims to walk through them. Our debt is heavier because we claim intimacy without consent."

  "If I paint her noble instead of cruel, have I still stolen from her? That's the asymmetry. If unflattering invention is theft, why is flattering invention not one too?"

  "A saint is a puppet just as much as a monster. Flattery is theft of her complexity; traducement is theft of her reputation. Both steal her right to be unknowable."

  "But if I give her a coherent motivation the archive denies, haven't I repaid the loan? I give her a *why*."

  "You cannot repay a loan that was never requested, but to answer your claim: a false coherence is a debt she now owes *you*. You make her answerable to your plot. You aren't repaying; you are simplifying."

  "I concede the cousin is a thin veil. It's a device, not a shield. You can see the wires."

  "I concede that leaving the pages blank is also a choice. Silence on the page is still an author's silence, not hers."

  "So the night before the letter. I need to show the break."

  "Show the pen. Not the thought."

  "I can't write 'She thought of him and wept.'"

  "No. You cannot write 'I forgive him.'"
