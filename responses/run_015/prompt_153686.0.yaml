  11. **Final Polish:** Ensure the "Residue Report" clearly distinguishes between what maps 1:1 and what breaks. (e.g., "Beliefs" map poorly to "State".)

  *(Self-Correction on the Verdict)*: I need to be careful not to say "Software is the answer." The prompt asks to translate the sociological argument *into* software terms to see if the disagreement persists. The insight should be that in software, we accept the holist view *instrumentally* while knowing the individualist view is *ontologically* true. In sociology, they fight over ontology. That's the key difference.

