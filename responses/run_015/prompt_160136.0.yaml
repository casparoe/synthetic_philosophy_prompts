          2.  The Core Moore (Belief).
          3.  The Knowledge/Evidence variants (Are they the same?).
          4.  The Modal contrast ("Might not" vs. "Might be wrong").
          5.  Embeddings (Why they matter).
          6.  The Preface (Why it's different).
          7.  Conclusion/Advice for the essay.

      *   *Refining the "Might" distinction:* This is the hardest bit.
          *   "It's raining but it might not be": This is often called an "Epistemic Contradiction." Yalcin (2007) is the big name here (even if I can't cite him, I need to explain the view). The content itself is inconsistent relative to an information state.
          *   "It's raining but I might be wrong": This is compatible. Why? Because "I might be wrong" is compatible with "It is raining." It means "My evidence doesn't guarantee $p$." But "It might not be raining" suggests the current information state supports $\neg p$ as a live option *while* asserting $p$.
          *   *Correction:* Actually, "It's raining but I might be wrong" is often treated as a concession. It's not strictly Moorean. The Moorean version is "It's raining but it's not certain."
          *   *Bluntness:* Tell the user that "I might be wrong" is likely *not* Moorean. It's a hedge. "It might not be raining" is the problematic one.

      *   *Refining the Knowledge Variant:* Is $p \land \neg Kp$ Moorean?
          *   View A: Yes, because assertion implies knowledge (Williamson).
