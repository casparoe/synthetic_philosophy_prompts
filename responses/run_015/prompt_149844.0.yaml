  I reject step (5).

  You dismiss Independence as a technical axiom nobody outside the formal literature cares about. This is the seam. While Independence sounds like a procedural constraint rather than a moral value like anonymity, it is the formal proxy for agenda neutrality and non-manipulability. If the collective judgment on $P$ depends on judgments on $Q$, then adding $Q$ to the agenda can flip the decision on $P$. This allows a chair to manipulate outcomes by framing. It also invites strategic voting: judges may misrepresent views on $P$ to secure a better global score for $Q$.

  This looked fine because Independence lacks the intuitive moral weight of "one person, one vote." It feels like math, not justice. But in social choice, math *is* the structure of justice. Dropping Independence solves consistency only by making the procedure vulnerable to manipulation. That is why dropping Independence is different from dropping anonymity: both sacrifice democratic values, but Independence's sacrifice is hidden behind technical language.

  By rejecting (5), you lose the cheap route to (7). You cannot claim the tension is a "bookkeeping artifact." The tension is real: it is a trade-off between collective rationality and immunity to manipulation. You can keep the conclusion that a group can be democratic and rational, but only by accepting a thinner notion of democracy that tolerates agenda control and strategic insincerity. The impossibility results aren't dissolved; they are revealed as menus of unavoidable costs. MAXCON works, but it purchases consistency with manipulability. That is a substantive political cost, not a technicality.

  Confidence: 90% confident this identifies the normative blind spot.
  Least sure: Whether a revised definition of democracy can adequately absorb the loss of Independence.
