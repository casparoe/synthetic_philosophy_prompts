prompt: |-
  I'm on the board of our local weekly and I've been reading a lot about information cascades lately — the idea that a herd can form even when everyone is being rational, because each person treats what earlier people did as evidence. We're about to face a decision and I'd like a short memo you'd circulate to the board before Thursday's meeting. The situation: two bigger outlets in the state both ran a story yesterday that a county commisioner took kickbacks, and both say they reviewed bank records — apparently the same ones. We haven't seen the records ourselves, and the commissioner's lawyer is already calling the story fake. If we run it and it's wrong, we're done for; if we hold it and it's true, we just look timid. I keep flip-flopping on whether two outlets running it is real evidence or basically one data point with two stamps on it. The memo should recommend a concrete course of action — run it, hold it, or verify first — with a time frame, and it should take the "just follow the outlets, their reporting is real evidence" side seriously instead of waving it away as herd behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a local weekly newspaper.
      *   **Audience:** The rest of the board.
      *   **Topic:** Whether to publish a story about a county commissioner taking kickbacks, already reported by two larger state outlets.
      *   **Key Concept:** Information Cascades (rational herd behavior).
      *   **Constraint 1:** Short memo.
      *   **Constraint 2:** Circulate before Thursday's meeting.
      *   **Constraint 3:** Recommend a concrete course of action (Run, Hold, or Verify) with a time frame.
      *   **Constraint 4:** Take the "follow the outlets" argument seriously (don't dismiss it as mere herd behavior), but address the risk of correlated evidence (same bank records).
      *   **Tone:** Professional, analytical, decisive, journalistic ethics-focused.

  2.  **Deconstruct the Situation:**
      *   *The Signal:* Two bigger outlets say Commissioner took kickbacks based on bank records.
      *   *The Risk:* If false, the weekly is ruined (credibility/legal). If true and we don't run it, we look timid/irrelevant.
      *   *The Cascade Problem:* Are Outlet A and Outlet B independent signals? Or did B just copy A? The prompt notes they reviewed "apparently the same" bank records. This suggests correlated evidence, not independent verification.
      *   *The User's Dilemma:* Is two outlets = double evidence, or one data point with two stamps?
      *   *The Requirement:* I need to take the "their reporting is real evidence" side seriously. This means acknowledging that reputable outlets have editorial standards and legal review. However, I also need to address the specific risk of the *same* records.

  3.  **Determine the Recommendation:**
      *   *Run it immediately?* Too risky. If the records are misinterpreted or the lawyer has proof they are fake, the weekly goes under.
      *   *Hold it indefinitely?* Bad for business and reputation. Looks like cowardice if it turns out true.
      *   *Verify first?* This is the only responsible journalistic path. It acknowledges the weight of the other outlets' reporting (it's a strong lead) but recognizes the correlation risk (same records) and the existential stakes for a smaller paper.
      *   *Time Frame:* Needs to be tight. News moves fast. 48-72 hours seems reasonable for a weekly to do a targeted check before the next cycle or online publish.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose. Acknowledge the pressure and the two larger outlets' reporting.
      *   **The Information Cascade Argument (The "Why"):** This is the core intellectual hook.
          *   Acknowledge that following the leaders is rational. They have more resources, legal teams, etc. Their signal is strong.
          *   *However*, introduce the nuance: Correlated evidence. If they looked at the *same* documents, it's not two independent confirmations. It's one source cited twice.
          *   Mention the lawyer's denial (noise, but must be accounted for).
      *   **The Stakes:** Explicitly state the "done for" vs. "timid" dilemma.
      *   **Recommendation:** Verify first.
      *   **Action Plan/Time Frame:** Specific steps. Contact the commissioner for comment (standard), attempt to view records independently or consult a legal expert on the existing reporting, set a deadline (e.g., Tuesday noon).
      *   **Closing:** Reiterate commitment to integrity.

  5.  **Refining the Tone and Content (Self-Correction during drafting):**
      *   *Critique:* Is it too academic on the "cascade" stuff?
      *   *Fix:* Keep it practical. Use the term but explain it in newsroom terms.
      *   *Critique:* Did I take the "follow the outlets" side seriously?
      *   *Fix:* Ensure I explicitly state that their reporting *is* valuable evidence and not just herd mentality. They likely did the legwork we can't afford. We are leveraging their work, not just copying it.
      *   *Critique:* Is the recommendation concrete?
      *   *Fix:* Yes, "Verify First" with a specific deadline (48 hours).

  6.  **Final Polish:** Check word count (keep it short), ensure the Thursday meeting context is clear (memo is *before* the meeting), and make sure the decision is actionable.

      *(Self-Correction on Date)*: The prompt says "before Thursday's meeting." So the memo date should be Wednesday or earlier. Let's say Wednesday.
      *(Self-Correction on Cascade Logic)*: Make sure to distinguish between "herd behavior" (irrational) and "rational cascades" (using others' info as data). The prompt says "even when everyone is being rational." I need to reflect that. The other outlets *are* data points, but correlated ones.

  7.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Concrete course of action? Yes (Verify).
      *   Time frame? Yes (48 hours).
      *   Take "follow outlets" seriously? Yes (acknowledge their resources/legal vetting).
      *   Address correlated evidence? Yes (same bank records).

  8.  **Drafting the Content:** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Name of Weekly]
  **FROM:** [Your Name]
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Decision Protocol: Commissioner Kickback Allegations

  **Purpose**
  This memo outlines a recommendation regarding the allegations published yesterday by [Outlet A] and [Outlet B] concerning County Commissioner [Name]. We must decide whether to republish, hold, or independently verify before our Thursday meeting.

  **The Information Cascade**
  We are currently observing a rational information cascade. It is reasonable to treat the reporting of two larger state outlets as high-value evidence. They possess resources we lack, including dedicated investigative teams and pre-publication legal review. In a rational model, their publication is a strong signal that the evidence (the bank records) withstands scrutiny. Ignoring this signal entirely carries reputational cost; if the story is true, our silence looks like timidity or incompetence.

  However, we must account for **correlated evidence**. Reports indicate both outlets reviewed the *same* bank records. This is not two independent confirmations; it is one data point with two stamps. If the interpretation of those records is flawed, or if the documents are fabricated, both outlets fail simultaneously. The Commissioner's counsel calling the story "fake" introduces noise, but given the existential risk to a weekly paper, we cannot treat their legal vetting as a perfect substitute for our own.

  **Recommendation: Verify First (48-Hour Window)**
  I recommend we **do not run the story immediately**, nor do we **kill it**. We proceed with a targeted 48-hour verification protocol.

  **Action Plan:**
  1.  **Independent Confirmation:** Our editor will attempt to view the records directly or consult a forensic accountant to validate the *interpretation* of the records cited by the state outlets. We are not redoing their legwork, but auditing their conclusion.
  2.  **Right of Reply:** We formally contact the Commissioner for comment today, noting the specific allegations published elsewhere.
  3.  **Deadline:** We set a decision deadline for **Friday at 12:00 PM**.
      *   If verification holds: We publish online Friday afternoon and in the next print cycle.
      *   If verification fails or is inconclusive: We hold the story, regardless of the other outlets' stance.

  **Rationale**
  This approach respects the signal provided by the larger outlets without succumbing to the fragility of a cascade based on a single source. It protects the paper from being the third outlet to repeat a falsehood while ensuring we do not miss a genuine scandal.

  Please review this plan so we can finalize the protocol in Thursday's meeting.
