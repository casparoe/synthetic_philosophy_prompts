  8.  **Final Polish:** Check tone. Ensure it sounds like a workshop Q&A. Ensure the "Lewisian" phrasing is accurate (references to Humean Mosaic, supervenience, systematization, etc.). Make sure the "2-minute reply" constraint is respected (roughly 250-300 words spoken at normal pace).

