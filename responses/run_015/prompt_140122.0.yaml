  Here is the shape of the rule, the arithmetic, and the verdict on your cases.

  ### The Diagnosis
  You have correctly identified that Case 1 and Case 2 are mathematically isomorphic regarding the prior probabilities and the proposition learned ($A \to B$). The fact that your gut gives different answers is the entire reason the "Judy Benjamin" problem exists in the literature.

  Your intuition in Case 1 is driven by **pragmatics** (Case 7): you suspect the speaker's choice of words conveys extra information about *why* they didn't say "You are in Red." Your intuition in Case 2 is driven by **semantics**: you treat the statement as a hard constraint on the physical outcome.

  Your friend's rule (Standard Conditionalization) treats "If $A$ then $B$" as "Not ($A$ and Not-$B$)." It eliminates the $A \land \neg B$ world and renormalizes.
  Your rule (Jeffrey/MinInf) treats "If $A$ then $B$" as a constraint on the *ratio* within $A$. It sets $P(B|A) = 1$ but preserves $P(A)$.

  ### The Recommended Rule: Minimum Information Updating (MinInf)
  I recommend a hybrid, but with a default bias toward **your rule**.

  **The Rule:** When learning a conditional "If $A$ then $B$" from a reliable source, update by minimizing the information gain (cross-entropy) subject to the constraint **$P_{new}(B|A) = 1$**.

  **The Arithmetic:**
  1.  **Preserve the Antecedent:** $P_{new}(A) = P_{old}(A)$.
  2.  **Shift Mass Within A:** All probability mass previously in $A \land \neg B$ moves to $A \land B$.
  3.  **Preserve the Not-A World:** The distribution within $\neg A$ remains unchanged. $P_{new}(B|\neg A) = P_{old}(B|\neg A)$.

  **Why this rule?**
  Learning a conditional is usually learning a *connection* or *law*, not learning that a specific world doesn't exist. Your friend's rule (Elimination) is appropriate when you learn a **disjunction** ("Either you're in Red, or you're in 2nd Company"). But "If Blue then 2nd" feels like a constraint on the Blue worlds, not a deletion of them. MinInf respects this by changing the *least* amount of your belief state necessary to satisfy the new constraint.

  ---

  ### Case-by-Case Check

  **1. Judy (Blue/Red)**
  *   **Verdict:** $P(Blue)$ stays 0.5.
  *   **Rule Output:** Matches your verdict. $P(Blue)$ is preserved. Mass from (Blue + 1st) moves to (Blue + 2nd).
  *   **Why:** The info restricts *where* you can be within Blue, not *whether* you are in Blue.

  **2. Coin/Ball (Heads/Red)**
  *   **Verdict:** I overturn your 1/3. It should be 1/2 (Heads stays 0.5).
  *   **Rule Output:** $P(Heads)$ stays 0.5.
  *   **Why:** Your 1/3 intuition comes from treating the statement as "The outcome is not Heads-Black." That is a report on the *actual world state* (Friend's Rule). But the sentence "If Heads then Red" is a constraint on the *relationship*. If the coin and ball are independent physical objects, learning a rule linking them shouldn't make Heads less likely; it should just make Red certain *given* Heads.
  *   **Caveat:** If the source meant "I looked at the outcome and ruled out Heads-Black," use Friend's Rule (1/3). If they meant "The mechanism ensures if Heads then Red," use MinInf (1/2). Natural language usually implies the latter in this context.

  **3. Server (Down/Red)**
  *   **Verdict:** No change on $P(Down)$.
  *   **Rule Output:** Matches.
  *   **Why:** You observed $B$ (Red Page). Learning $A \to B$ when you already know $B$ adds no constraint on $A$. (Note: If you *only* learned $A \to B$ without seeing the page, $P(Down)$ would stay the same under MinInf, but would rise under Friend's Rule. Your verdict implies the conditional was background knowledge, not new info).

  **4. Arson (Arson/<3pm)**
  *   **Verdict:** $P(Arson) \to 0$.
  *   **Rule Output:** Matches.
  *   **Why:** This is Modus Tollens. You learned $\neg B$ (CCTV). The constraint is $P(B|A)=1$. If $B$ is false, $A$ cannot be true. Both rules agree here.

  **5. Leak (Room/Laptop)**
  *   **Verdict:** Small decrease (0.99 $\to$ 0.99ish).
  *   **Rule Output:** Matches. $P(Room)$ stays 0.99.
  *   **Why:** The tip restricts the *method* (Laptop) given the *source* (Room). It doesn't make the Room less likely to be the source, it just makes the Laptop the necessary conduit. Friend's Rule halves your odds because it treats "Room + Not-Laptop" as an impossible world you were previously betting on. MinInf recognizes that you were betting on "Room", and now "Room" just implies "Laptop".

  **6. Partner/Berlin (Biconditional)**
  *   **Verdict:** Oscillates.
  *   **Rule Output:** They move toward each other, weighted by certainty.
  *   **Arithmetic:** You have two constraints: $P(Berlin|Partner)=1$ and $P(Partner|Berlin)=1$. This forces $P(Partner) = P(Berlin)$.
  *   MinInf finds the probability $p$ closest to your priors (0.9 and 0.1) such that both equal $p$. It will not be 0.5 (Friend's Rule). It will be closer to 0.9 because you are more certain about the Partner. It solves the "collapse" by forcing an equilibrium, not a deletion of worlds.

  **7. Protocol (The Meta-Case)**
  *   **Verdict:** $P(Blue) \to 0$.
  *   **Rule Output:** The Rule handles the *sentence*. This case is about the *speaker*.
  *   **Why:** This confirms your Case 1 intuition was actually Case 7 in disguise. In Case 1, you suspected the protocol. In Case 7, you know it. If the protocol is "If $\neg$Blue, say the conditional," then hearing the conditional implies $\neg$Blue. This is not updating on $A \to B$; it's updating on *Why they said $A \to B$*. My rule applies to the semantic content; your Case 7 verdict applies to the pragmatic signal.

  ---

  ### Edge Cases & Stress Tests

  **1. Source Reliability (70%)**
  *   **Rule:** Weight the constraint. Do not set $P(B|A)=1$. Set $P_{new}(B|A) = 0.7 \times 1 + 0.3 \times P_{old}(B|A)$.
  *   **Effect:** You shift mass from $A \land \neg B$ to $A \land B$, but not all of it. $P(A)$ remains fixed.

  **2. Probabilistic Consequent ("If A then B with chance 0.7")**
  *   **Rule:** Set constraint $P_{new}(B|A) = 0.7$.
  *   **Effect:** Same as above. $P(A)$ stays fixed. Mass is redistributed within $A$ to match the 70/30 split.

  **3. Two Conditionals in a Row**
  *   **Rule:** Order matters (Non-commutative).
  *   **Scenario:** Learn "If A then B", then "If B then C".
  *   **Effect:** First update fixes $P(B|A)=1$ (preserving $P(A)$). Second update fixes $P(C|B)=1$ (preserving $P(B)$). Since $P(B)$ changed in step 1, step 2 propagates that change. MinInf is path-dependent, which is a feature, not a bug—it reflects that learning order changes context.

  **4. A and B Start Correlated**
  *   **Rule:** Still preserve $P(A)$.
  *   **Effect:** If $A$ and $B$ were already positively correlated, the "shift" of mass from $A \land \neg B$ to $A \land B$ is smaller. If they were negatively correlated, the shift is larger. $P(A)$ remains invariant regardless.

  ---

  ### Honest Limitations & Mind Changers

  **Which verdicts can't I accommodate?**
  I cannot accommodate your Case 2 verdict (1/3) *if* we agree the input is strictly the conditional "If Heads then Red." I argue that 1/3 is the answer to "Not (Heads and Black)," which is a different proposition. If you insist that "If Heads then Red" *means* "Not (Heads and Black)" in your coin case, then my rule fails Case 2.

  **Which verdict would I overturn?**
  I would overturn your Case 6 oscillation. The answer isn't "obviously 0.9" or "collapse to 0.5." It is a calculated meeting point. The biconditional forces $P(A)=P(B)$. You cannot keep $P(A)=0.9$ and $P(B)=0.1$ while accepting $A \leftrightarrow B$. You must move both.

  **What would change my mind?**
  I would swap to your Friend's Rule (Elimination) if you could construct a **Dutch Book** against the MinInf rule.
  *   *The Challenge:* Can you set up a series of bets based on MinInf updating that guarantees me a loss, whereas Elimination updating avoids it?
  *   *The Vulnerability:* My rule preserves $P(A)$ even when learning $A \to B$ makes $A$ intuitively "harder to satisfy." If $A$ is "I win the lottery" and $B$ is "I buy a yacht," and I learn "If I win, I buy a yacht," does my chance of winning stay the same? MinInf says yes. Elimination says no (because the world where I win and don't buy a yacht is gone, and maybe that was the only way I could win).
  *   If you can show me a case where preserving $P(A)$ ignores a logical dependency that *must* reduce the antecedent's likelihood, I will abandon MinInf for Elimination.

  **Where is my reasoning most likely wrong?**
  It is most likely wrong on the distinction between **semantic content** and **pragmatic signal**. In Case 1 (Judy), the "1/2" intuition is almost certainly pragmatic (Case 7). If we strip the pragmatics and treat it as pure logic, the Friend's Rule (1/3) is mathematically standard for "learning a fact." My recommendation privileges the *natural language* interpretation of conditionals (constraints) over the *logical* interpretation (material implication). If you care about formal logic over language, I am wrong. If you care about how testimony updates belief, I am right.
