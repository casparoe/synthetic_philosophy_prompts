      *   Move 4: Tobias (Stances as Budgets). *Note: Ines's final counter is attached to Move 4 in the narrative flow, but logically it's a 5th beat. However, the prompt says "for each of the four moves." I will treat Ines's final counter as the critical test of Move 4's success.*

