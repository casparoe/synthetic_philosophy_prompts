      *   *Re-evaluating "What they miss":* They are treating "compression" as static description length. Dennett's "Real Patterns" is heavily tied to *inductive inference* and *robustness*. A pattern is real if it supports *counterfactuals*. The Almanac string supports no counterfactuals. Also, they miss the *interest-relative* nature of the "cost." Cost isn't just bits; it's cognitive resource allocation.

