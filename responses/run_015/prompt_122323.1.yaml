answer: |-
  This is a sophisticated problem because it touches on the mechanics of moral psychology, not just literary theory. Your intuition about "particularity" is close, but it's not the *detail* that matters; it's the *access to the decision point*.

  Here is a coherent principle that attempts to unify your cases, followed by the specific admissions and predictions you asked for.

  ### The Principle: Diagnostic Friction

  **A biography functions morally to the extent that it preserves the friction between a subject's agency and the consequences of that agency, without resolving the tension for the reader.**

  Moral improvement is not the osmosis of virtue; it is the calibration of judgment. Therefore, a text teaches only if it forces the reader to perform the work of connecting character to outcome. If the text does that work for you (hagiography), you remain passive. If the text obscures the connection (entertainment), you remain confused.

  Here is how the principle breaks down, motivated by your specific cases:

  **Clause 1: The Resistance Condition**
  *The text must show the cost of the virtue.*
  *   **Motivating Case:** *The Modern Saint's Life.*
  *   **Reasoning:** In hagiography, failure is rewritten as hidden virtue. This removes the possibility of wrong choice. If a saint never truly risks failing, their success is not a moral achievement but a narrative inevitability. For a biography to teach, the subject must face a genuine possibility of acting otherwise. The "friction" is the struggle against temptation or constraint. Without it, there is no agency to imitate.

  **Clause 2: The Integrity Condition**
  *The text must refuse to smooth over contradictory outcomes.*
  *   **Motivating Case:** *The Mixed Bag (Courageous Politician/Brutal Parent).*
  *   **Reasoning:** If the biography explains away the brutality as "necessary for the politics," it resolves the friction. If it preserves the contradiction, it forces the reader to ask: "Is public courage compatible with private cruelty?" This teaches *integration*. It prevents the reader from compartmentalizing virtue in their own life. The moral lesson is in the unresolved tension, not the resolution.

  **Clause 3: The Sovereignty Condition**
  *The text must leave a gap between the author's judgment and the evidence provided.*
  *   **Motivating Case:** *The Hostile Portrait.*
  *   **Reasoning:** This resolves your stuckness. A hostile biography where the subject still shines teaches *more* than hagiography. Why? Because hagiography demands passive acceptance. A hostile biography that fails to condemn forces the reader to override the author's moral framing. You have to say, "The author says this is bad, but the evidence shows resilience." This activates your own moral muscle. It trains you to judge the judge, which is a higher-order moral skill than simply admiring the subject.

  ***

  ### The Verdict I Have to Drop

  To make this principle hold, I have to modify your verdict on the **"Historical Mistake"** case (reading about someone making your exact mistake in a different context).

  **Your Verdict:** You said it's hit-or-miss; sometimes it clicks, sometimes it feels like apples and oranges.
  **The Principle's Correction:** It is not random. It "clicks" only when the *structure of the temptation* is identical, not the mistake itself.
  If the principle is about "Diagnostic Friction," then the historical context is irrelevant *unless* it changes the nature of the choice. If you and the subject both succumbed to pride, but your pride was about safety and theirs was about glory, the friction is different. The principle demands you drop the hope that "similar mistakes" teach similar lessons. Only "similar pressures on agency" teach similar lessons. If the historical context makes the cost of the mistake zero for them but high for you, the biography is morally inert for your situation. It's not a flip-flop; it's a failure of structural analogy.

  ***

  ### Imitation vs. Moral Orientation

  You asked if there is a difference between reading for imitation versus some other orientation. **Yes.**

  *   **Imitation (Mimesis):** Assumes the subject's actions are the template. This fails when contexts diverge (the "apples and oranges" problem). It leads to rigid rule-following.
  *   **Moral Orientation (Phronesis):** Uses the subject's life as a simulation environment. You aren't asking "What would Plutarch do?" You are asking "How did the friction of this situation reveal their character?"

  The principle of Diagnostic Friction argues for **Orientation**. You are not mapping their virtue onto your situation; you are mapping their *decision architecture* onto your own. Plutarch works not because you should copy Cato, but because you can see how Cato's rigidity created specific friction points that you might recognize in your own rigidity.

  ***

  ### The Shadow Biography

  Regarding the format your professor mentioned: *framing every decision through a virtue the subject never possessed.*

  My account says this is a **stress test for the reader.**
  By imposing a virtue that isn't there (e.g., writing about a selfish politician as if they were driven by "charity"), the biography highlights the *absence* of friction. It shows how easily narrative can be manipulated to hide a lack of agency. It teaches you to spot "virtue signaling" in real life. It is a negative lesson in hermeneutics: it teaches you how *not* to read a life. It is morally useful, but only as a vaccine against hagiography.

  ***

  ### Prediction: The Blind Autobiography

  Finally, the case of the autobiography where the author describes their worst motives in detail but clearly doesn't understand them (e.g., "I did this cruel thing because I loved them," when the detail shows they did it to control them).

  **Prediction:** This is the **most morally potent format of all**, provided the reader is vigilant.

  **Why?**
  In a standard biography, you rely on the author's judgment. In hagiography, the judgment is biased positive. In a hostile bio, the judgment is biased negative.
  In the Blind Autobiography, the *data* is raw, but the *interpretation* is flawed. This creates the maximum "Diagnostic Friction." You are given the intimate access of autobiography (internal motives) but forced to exercise the judgment of a biographer (correcting the interpretation).

  It forces you to practice **self-diagnosis by proxy.** You see the gap between their stated motive and their described action. Because they are blind to it, you must see it for them. This trains you to spot that same gap in yourself. It turns reading into an act of psychoanalysis.

  **The Risk:** If the reader is not vigilant, they will absorb the author's blindness. But if the principle holds—that moral learning requires the reader to resolve the tension—then the Blind Autobiography offers the heaviest weight to lift, and therefore the strongest moral workout.

  **Summary:** Your friend is half-right. Hagiography *is* PR. But Plutarch isn't just PR; he's a simulator. The biography that makes you better isn't the one that gives you a hero to copy; it's the one that gives you a conflict to resolve.
