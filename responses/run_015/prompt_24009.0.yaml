      *   **Constraint:** Do not defend the thesis generally; focus on prepping for the specific pushback. Acknowledge the tension between *Guide* (philosophy) and *Mishneh Torah* (law).

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
