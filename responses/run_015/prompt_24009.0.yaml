      *   **Topic:** Maimonides' *Guide of the Perplexed* III:32 (Instrumentalist account of sacrifice). Thesis: This isn't a marginal gloss but the *key* to the whole work. Sacrifice is a transitional form to wean from idolatry, valuable only for steering toward knowledge of God.
      *   **Specific Twist:** The user argues this instrumentalism applies to the *human cognitive condition* generally, not just a fixed historical period. Therefore, forms persist even in the Messianic age (or at least, the obligation remains because the cognitive condition persists), and Maimonides must legislate it in the *Mishneh Torah* (Code) regardless of the *Guide*'s explanation.
      *   **Audience:** Small comparative religion reading group (12 people).
          *   2 Observant Jews (1 Rabbinical Student).
