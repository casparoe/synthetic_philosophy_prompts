      *   *Cosmic Religious Feeling:* This is his key concept. True religion is the awe at the structure of the universe. It's pre-anthropomorphic. It's about humility before the logic of nature.
      *   *Determinism:* Einstein was a staunch determinist. "God does not play dice." He believed in a causal chain. He was skeptical of quantum indeterminacy. He likely would view free will as an illusion (he explicitly wrote about this in *Ideas and Opinions*).
