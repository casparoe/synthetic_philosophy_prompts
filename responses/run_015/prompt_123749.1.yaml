      *   *Section 2: Deweyan vs. Liberal-Pluralist.* Argue that the *practice* is Deweyan, but the *container* is Liberal. It cannot be fully accommodated by Liberal-Pluralism because that model ignores the *formation* of preferences through the pilot/evaluation phase.
