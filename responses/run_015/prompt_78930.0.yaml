answer: |-
  **Essay Question 1 (20 marks)**

  Consider the case of Sam. Sam holds a ticket to a Friday gig. Preferences are transitive at any single moment but shift predictably over time. Three weeks out, Sam prefers £80 to the ticket. The night before, Sam prefers the ticket to £120. A scalper buys the ticket for £80 and sells it back for £120. Sam pays a net £40 for something that could have been free. This loop is repeatable.

  Write an essay addressing the following:
  1.  Does this money pump prove Sam is irrational in the same way a standard cyclic-preference pump does? Explain the structural difference.
  2.  What additional normative premise is required to move from the observation "Sam loses money" to the conclusion "Sam is irrational"?
  3.  If Sam could precommit to refusing the night-before trade, would doing so make Sam rational, or merely insured? Justify your view.
  4.  Evaluate the claim: "Getting ripped off shows nothing about rationality by itself."

  ***

  **Model Answer**

  Sam's scenario illustrates a diachronic money pump, which is structurally distinct from the standard synchronic money pump used in decision theory. In the standard case, an agent holds intransitive preferences simultaneously (preferring A to B, B to C, and C to A). This violates the transitivity axiom, a core logical requirement for rational choice. A trader can cycle the agent through these preferences in a single sitting, leaving them worse off. Sam, however, violates no synchronic axioms. At time t1, selling for £80 is the utility-maximizing choice. At time t2, buying for £120 is the utility-maximizing choice. The loss arises not from logical inconsistency at a moment, but from preference reversal over time. Therefore, the pump does not prove Sam is irrational in the same way; it proves Sam is instrumentally inefficient across time, not logically inconsistent at a slice.

  To move from the observation that Sam loses money to the conclusion that Sam is irrational, one must introduce a specific normative premise: the Principle of Diachronic Consistency. This principle asserts that rationality is a property of an agent's entire temporal trajectory, not merely their instantaneous states. Without this premise, Sam can be modeled as a sequence of distinct, rational agents succeeding one another, each optimizing correctly for their current utility function. The financial loss is real, but the label "irrational" requires accepting that personal identity over time imposes rational constraints beyond snapshot consistency. If rationality is defined only locally, Sam is blameless. If defined globally, Sam is failing to maximize across the timeline.

  This distinction clarifies the role of precommitment. If Sam signs a contract blocking the resale, are they rational or just insured? Under the Principle of Diachronic Consistency, precommitment is an act of rationality. It aligns future actions with past plans, preventing the preference reversal from exploiting the self. It is not merely insurance against external risk, but insurance against one's own future utility function shifting. Refusing to precommit, knowing the reversal is predictable, would be the irrational act under this framework because it knowingly allows global suboptimization. However, if one rejects Diachronic Consistency, precommitment is simply restricting future freedom without normative necessity. For CS students, think of this as stateless versus stateful systems: precommitment adds state to enforce a global invariant.

  Consequently, the hunch that "being pumpable shows nothing about rationality by itself" is largely correct, though it requires nuance. Pumpability is a vulnerability, not a proof of error. In the synchronic case, the vulnerability stems from a logical contradiction. In Sam's diachronic case, it stems from temporal instability. Calling Sam irrational requires importing external norms about how agents ought to relate to their future selves. Mere financial loss indicates a failure of outcome, not necessarily a failure of reasoning process. A rational agent with changing preferences who lacks binding mechanisms will lose money; this is a tragedy of temporal structure, not a bug in the logic engine. Thus, pumpability is evidence of inefficiency, but only becomes evidence of irrationality when coupled with the requirement that rationality extends across time.

  ***

  **Marking Scheme**

  1.  **Distinguishes synchronic vs. diachronic pumps (4 marks)**
      *   *Typical failure:* Students claim Sam is intransitive because the outcome loops, missing that preferences are stable at each time slice.
  2.  **Identifies financial loss is not identical to irrationality (4 marks)**
      *   *Typical failure:* Students equate losing money directly with irrationality without discussing the reasoning process.
  3.  **Specifies the Diachronic Consistency premise (4 marks)**
      *   *Typical failure:* Students vaguely mention "planning" without identifying the normative principle required to bind time slices.
  4.  **Analyzes precommitment as rational planning vs. constraint (4 marks)**
      *   *Typical failure:* Students treat precommitment purely as insurance against external threats rather than internal preference shifts.
  5.  **Verdict on the "pumpable = irrational" claim (4 marks)**
      *   *Typical failure:* Students give a binary yes/no without nuancing that pumpability requires the extra normative premise to imply irrationality.

  \answer{No, not by itself}
