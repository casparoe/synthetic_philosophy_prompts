      *   **The Primary Cut (Step 5):** The analogy fails. Real scientific risks are bounded. Utility is bounded (diminishing marginal utility, physical limits). The "infinite tail" is a modeling artifact, not reality.
      *   **The Secondary Cut (Step 1):** Completeness is not a mandatory axiom for pathological cases. "No verdict" is a valid verdict for ill-posed problems.
