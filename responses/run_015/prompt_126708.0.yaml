      *   (8) *Dilemma:* Alternative rules must impose ordering (a) or reject additivity (b). (Strong claim).
      *   (9) *Physics Analogy:* (a) is metaphysically suspect (QFT regularization), (b) kills EUT. (The crux of the physicist's worry).
      *   (10) *Conclusion:* Rationality is arbitrary or EUT collapses.

  3.  **Identify the Weak Links:**
