      *   **The Core Question:** Is it morally permissible/valid to act on moral testimony without understanding the underlying reasons? (The problem of "moral testimony").

  2.  **Deconstruct the Arguments:**
      *   **The Cousin's Position:** Moral intuitionism? Virtue ethics? She "just knows." She has a track record of being right.
      *   **The Father's Position:** Moral autonomy. Kantian undertones (duty to reason). If you don't understand *why*, you aren't truly moral agents. "Borrowed convictions don't count."
      *   **The User's Analogy:** Trusting a mechanic. Is moral expertise like technical expertise?
      *   **The Stakes:** Reporting cheating (justice, rules, fairness) vs. Not reporting (loyalty, mercy, potential harm to the classmate, questioning the honor code's rigidity).

  3.  **Evaluate the "Mechanic Analogy" (Moral Testimony):**
      *   *Similarities:* Both involve expertise, track records, and deferring to someone who knows better.
      *   *Differences:*
          *   Mechanics deal with facts/causality (noise = bad alternator).
          *   Morality deals with values, agency, and responsibility.
          *   If the mechanic is wrong, the car breaks. If the moral advisor is wrong, *you* commit a wrong (or fail to prevent one).
          *   Moral action requires *intent*. Acting on blind faith might lack moral worth (Kant).

  4.  **Evaluate the Father's Claim ("Borrowing a Conscience"):**
      *   *Strengths:* Promotes moral growth, autonomy, and accountability. Prevents blind obedience to potentially flawed authorities.
      *   *Weaknesses:* Ignores that we all learn morality from others initially. Sometimes experts *do* see things we don't (moral blind spots). It sets a very high bar for moral action (must always articulate reasons).

  5.  **Evaluate the Cousin's Authority:**
