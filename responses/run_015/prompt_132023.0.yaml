answer: |-
  Elena, a senior archivist at a university library, discovers a script she wrote two years ago silently corrupted metadata for 400 colonial-era manuscripts, misattributing them to incorrect authors. Rectifying this requires her to file a formal incident report triggering a full audit of her tenure, work unpaid through the upcoming holiday weekend to restore the data, and accept a likely reassignment to a lower-grade position; leaving it ensures the error persists indefinitely but remains undetectable to patrons and administration. Under a cost-proportionality account of supererogation, fixing the error is obligatory because her causal responsibility for the corruption negates the excusing force of personal cost, making harm prevention her direct duty regardless of sacrifice. Conversely, a role-boundary account deems the correction supererogatory because her employment contract specifies standard hours and forward-looking preservation, explicitly excluding retrospective self-incrimination and unpaid remediation beyond her pay grade. The moral status of Elena's choice hinges entirely on whether her past authorship of the script transforms an institutional extra into a personal imperative.

  **Analysis of Verdicts and Reasoning**

  The divergence between the two accounts rests exclusively on the weight given to Elena's prior causal authorship. The **Cost-Proportionality Account (CPA)** calculates the moral status of an act by weighing personal cost against the harm attributable to the agent. Because Elena wrote the script, 100% of the harm is attributable to her. The prompt stipulates that under this specific framing of CPA, causal responsibility creates a direct duty that overrides personal cost; essentially, the "debt" of the harm outweighs the "price" of the fix, rendering the act obligatory. She cannot claim the cost is too high because she is paying a debt she incurred. The **Role-Boundary Account (RBA)**, however, looks strictly to the institutional definition of the agent's obligations. Her contract defines her duty as archiving within paid hours; it does not include self-auditing, working without pay, or accepting demotion. Since the corrective act exceeds these defined boundaries, it is supererogatory (good to do, but not required), regardless of who caused the error. The role absorbs the employee's fallibility, limiting moral obligation to contractual performance.

  **Collapsing the Divergence**

  If we remove the feature of causal authorship—suppose the corrupt script was written by a predecessor whom Elena merely inherited—the divergence collapses. Under the **RBA**, the verdict remains unchanged: the corrective act still exceeds her contractual role, so it remains supererogatory. Under the **CPA**, however, the verdict shifts to match the RBA. If Elena did not cause the corruption, the portion of harm *attributable to her* is zero. Since her personal cost (unpaid work, career damage) definitely exceeds zero, the condition for supererogation is met (Cost > Attributable Harm). Thus, without her causal authorship, both accounts agree the act is supererogatory. The divergence exists only because CPA treats causal history as a moral multiplier for obligation, while RBA treats the role as a moral firewall against it.

  **Defending the Counterintuitive Account**

  The **Role-Boundary Account** yields the counterintuitive result here, as it suggests Elena is not strictly required to fix a mess she made if her job description doesn't explicitly demand self-sacrifice. A defender of RBA would attack the case by arguing that conflating personal moral liability with professional duty destabilizes institutional trust. If employees believe that any error they make creates an open-ended, unlimited moral obligation to fix it regardless of cost (including career suicide), they will be incentivized to hide errors rather than disclose them. The RBA defender would argue that the institution, not the individual, is the moral agent responsible for the archive's integrity; the institution should pay for the fix and absorb the error. By framing the unpaid work and reassignment as "supererogatory," the RBA protects the employee from exploitative expectations that equate moral rectitude with professional self-destruction.

  **Changing My Mind**

  I would change my mind about which account handles the scenario correctly if it were demonstrated that the **harm of the metadata corruption is negligible**. If the misattributed records are never accessed by researchers, the "harm prevented" is effectively zero. In that case, even the CPA would have to concede that the personal cost (career reassignment) vastly exceeds the harm prevented, making the act supererogatory even for the author of the error. If the harm is trivial, the "debt" is trivial, and the cost-proportionality test would align with the role-boundary test regardless of causal authorship.

  **Vulnerable Point in Reasoning**

  The most vulnerable point in my reasoning is the **quantification of "harm" within the Cost-Proportionality Account**. I have assumed that metadata misattribution constitutes a significant harm that outweighs the cost of Elena's reassignment. However, "harm" in digital archiving is abstract and difficult to measure against concrete career damage. If the harm is deemed diffuse or minor compared to the concrete penalty of demotion, the CPA's verdict of "obligatory" becomes difficult to sustain mathematically, potentially undermining the claimed divergence between the two accounts.
