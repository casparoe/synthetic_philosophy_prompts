  **Why the existing positions leave it open**
  Three dominant positions fail to resolve this question because they all treat membership as a package deal. First, open-borders advocates typically argue for freedom of movement based on liberty or global equality, often dismissing fiscal constraints as secondary or solvable through immediate inclusion. They assume that delaying entitlements is inherently unjust, failing to consider whether delayed vesting could be a legitimate insurance mechanism rather than exclusion. Second, proponents of bounded membership argue that generous welfare requires strong solidarity, which relies on binary inclusion. They assume that any differentiation in rights undermines the reciprocity necessary for redistribution, overlooking the possibility that temporal differentiation might preserve reciprocity without permanent exclusion. Third, integrationist objections focus on the social harm of second-class status but treat this as a blanket prohibition on tiered rights. They do not distinguish between permanent marginalization and temporary probation analogous to private employment benefits. Because all three positions assume rights must vest simultaneously upon arrival or not at all, none can evaluate whether timing itself is the moral variable. Consequently, the debate remains stuck between incompatible premises: either open borders are fiscally irresponsible, or closed borders are morally impermissible. The possibility that openness is compatible with welfare sustainability via temporal unbundling remains untheorized.

  **Method and timeline**
  The method is constructive normative theory combined with institutional analysis, distinct from both empirical fiscal modeling and abstract meta-ethics. Modeling cannot answer normative permissibility, while pure theory often ignores institutional feasibility. This project treats fiscal constraints as fixed parameters to test moral frameworks against, rather than variables to optimize. This approach allows me to isolate the moral variable of time from the economic variable of cost.
  *Quarter 1:* Conceptual mapping. I will categorize welfare entitlements into contributory (insurance-based) and non-contributory (solidarity-based) bundles. I will analyze existing legal frameworks for temporary residency to identify where current vesting schedules fail moral tests. This establishes the typology of rights to be unbundled.
  *Quarter 2:* Model construction. I will develop three distinct vesting schemas ranging from immediate access to prolonged probation. Each schema will be stress-tested against standard theories of distributive justice to determine if delayed access violates core rights or constitutes legitimate qualification periods. This moves from taxonomy to normative evaluation.
  *Quarter 3:* Objection handling. I will focus on the integrationist objection: does delayed vesting undermine the social solidarity required to sustain the welfare state itself? I will engage with sociological theories of solidarity to determine if temporal tiers fracture community or merely structure entry. This tests the sustainability of the proposed models.
  *Quarter 4:* Synthesis and drafting. I will consolidate the findings into a coherent argument regarding the permissibility of unbundled membership.
  This method is chosen because the core conflict is conceptual, not empirical. The question is not whether unbundling *will* save money, but whether it *could* be just. By avoiding econometric modeling, I avoid the trap of letting contingent data drive normative conclusions, while avoiding pure abstraction ensures the theory confronts real institutional constraints. The work is interdisciplinary in spirit but philosophical in execution, ensuring that the resulting framework is actionable for policymakers without sacrificing normative rigor.

  **Results and failure conditions**
  There are three possible conclusions. First, a "compatibility" result: a vesting schedule exists that satisfies fiscal constraints without violating dignity, suggesting the binary membership argument is false. Second, a "trade-off" result: fiscal defensibility requires status hierarchies that violate egalitarian principles, meaning we must choose between openness and equality. Third, a "pretext" result: the fiscal constraints used to justify binary membership are too weak to require exclusion, implying the bounded membership argument relies on bad faith.
  The deciding consideration will be the threshold of dignity. If delayed vesting reduces migrants to mere instruments of labor without pathway to full standing, the project rejects the model. If, however, the delay resembles standard insurance waiting periods, it may be permissible.
  The project fails if the proposed vesting schedules are normatively indistinguishable from exploitative guestworker programs already rejected by liberal theory. It also fails if the analysis collapses into empirical speculation about fiscal impacts rather than maintaining focus on normative justification. If I cannot distinguish between legitimate insurance waiting periods and illegitimate caste creation, the conceptual contribution is null. Furthermore, if the integrationist objection proves that any tiering destroys solidarity regardless of fiscal benefit, the project must conclude that binary membership is indeed morally required, even if fiscally costly. Success is defined by clarifying the trade-off, even if the outcome is negative. Such a negative result would still advance the field by forcing an honest acknowledgment of the costs of openness.

  **Scope and risks**
  The scope is limited to liberal democratic welfare states with existing redistribution mechanisms. I will not address global justice broadly or the right to exit, focusing strictly on the right to enter and remain. The primary risk is scope creep between normative theory and policy design. If the project becomes too large, I will cut the analysis of contributory insurance (pensions, unemployment) and focus exclusively on non-contributory transfers (housing, basic income), as this is where the moral tension regarding "free riding" is highest. A secondary risk is relying on contested empirical claims about fiscal impacts. To mitigate this, I will treat fiscal constraints as hypothetical premises provided by opposing arguments rather than generating new economic data. This ensures the project remains philosophical.
