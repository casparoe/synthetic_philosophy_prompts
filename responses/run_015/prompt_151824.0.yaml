      *   *The Physics Reality:* Spacetime has no author. There is no "intent" of the universe to appeal to. The underdetermination isn't a semantic ambiguity waiting for interpretation; it's a structural feature of the manifold.
      *   *The Philosophical Payoff:* If we treat spacetime like a legal text (looking for "meaning"), we commit a category error. But if we treat the legal gap like the Hole (purely structural), we ignore the normative dimension of law. The tension highlights *why* substantivalism feels intuitive (we treat points like named legal entities) but fails (points don't have names/intent).

