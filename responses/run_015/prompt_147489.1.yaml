answer: |-
  # The Darwin/Turing Inversion Checklist (Referee Edition)
  **Time Budget:** 15 Minutes  
  **Constraint:** Black-box evaluation (no weights, no transcripts, rely on manuscript data/claims).  
  **Core Logic:** If behavior can be explained by selection for fitness (Darwin) without internal truth-tracking, and we can only see behavior (Turing), then *robustness* is the only proxy for comprehension. Fragility = Heuristic.

  ### Step 1: Surface Invariance Scan (3 mins)
  **Action:** Check if the paper reports performance under semantically null transformations (e.g., variable renaming, unit changes, passive/active voice swaps).
  **Criterion:** If performance drops >10% on null transforms, the agent is tracking syntax, not semantics.
  **[JUDGMENT CALL]:** Is the drop statistically significant or noise? *If the paper doesn't test this, mark as "Unverified Claim."*
  **Misfire Warning:** Don't penalize minor formatting errors; focus on logical invariance.

  ### Step 2: The "Clever Hans" Null Hypothesis (3 mins)
  **Action:** Propose the simplest possible heuristic (e.g., keyword matching, linear regression on surface features) that could achieve the reported baseline score.
  **Criterion:** If a trivial heuristic explains >80% of the success, the burden of proof shifts to the author to rule it out.
  **[JUDGMENT CALL]:** How complex must the heuristic be to match the score? *If it requires a lookup table the size of the training set, comprehension is more likely.*
  **Misfire Warning:** Do not assume the heuristic *is* the mechanism, only that it *could* be.

  ### Step 3: OOD Generalization Stress (3 mins)
  **Action:** Look for tests outside the training distribution (e.g., physics problems with friction when trained on frictionless, or logic puzzles with 5 variables when trained on 3).
  **Criterion:** Competence degrades gracefully (error correlates with complexity) vs. catastrophically (output becomes random).
  **[JUDGMENT CALL]:** Is the degradation pattern consistent with a broken model or a saturated heuristic? *Graceful decay suggests a model; cliff-edge suggests a trick.*
  **Misfire Warning:** Authors often cherry-pick "easy" OOD cases. Check the difficulty gradient.

  ### Step 4: Error Signature Analysis (3 mins)
  **Action:** Examine the *type* of errors made in failure cases.
  **Criterion:** Reasoning errors (wrong step in a valid chain) vs. Retrieval errors (hallucinated facts, syntax collapse).
  **[JUDGMENT CALL]:** Do the errors look like human misconceptions (systematic) or machine noise (random)? *Systematic errors can imply a flawed mental model, which is still a model.*
  **Misfire Warning:** Humans make random slips too; don't over-anthropomorphize systematic bias.

  ### Step 5: The Darwinian Verdict (3 mins)
  **Action:** Synthesize Steps 1–4. Ask: "Could natural selection (or gradient descent) have found this behavior without truth-tracking?"
  **Criterion:** If Yes $\rightarrow$ Claim of "Comprehension" is **Rejected** (Label as "Competence"). If No $\rightarrow$ Claim is **Provisionally Accepted**.
  **[JUDGMENT CALL]:** Are you willing to bet your reputation that no simpler mechanism exists? *If unsure, default to Rejection.*
  **Misfire Warning:** This checklist falsifies comprehension claims; it cannot prove comprehension exists.

  ---

  ### Application to Three Cases

  #### Case 1: The Brittle Language Model
  **Scenario:** LM solves 95% of mechanics word problems but drops to 15% when variable names ($x, t$) are swapped for ($\alpha, \beta$).
  **Checklist Run:**
  *   **Step 1:** Fails Surface Invariance (Performance collapse on null transform).
  *   **Step 2:** Clever Hans hypothesis confirmed (Likely matching token patterns like "mass = m" rather than physical relations).
  *   **Step 5 Verdict:** **Rejected.**
  **Analysis:** The Darwinian pressure optimized for the specific token distribution of the benchmark, not the underlying physics. The Turing constraint means we see the collapse and must infer the lack of internal state. This is the easy call.

  #### Case 2: The Human Expert (The Uncomfortable Result)
  **Scenario:** A physics professor solves standard textbook problems perfectly but fails to derive solutions when constraints are slightly altered (e.g., non-uniform gravity), reverting to memorized formulas that no longer apply. Their error signature is modular (entire steps vanish rather than adjust).
  **Checklist Run:**
  *   **Step 1:** Fails Surface Invariance (Contextual framing changes break the solution path).
  *   **Step 2:** Clever Hans hypothesis plausible (Human "training" via rote memorization acts like gradient descent on exam scores).
  *   **Step 3:** Catastrophic degradation on OOD (Cannot extrapolate principles).
  *   **Step 5 Verdict:** **Rejected.**
  **Analysis:** This is the answer I won't like. The checklist denies "comprehension" because the behavior is indistinguishable from high-fidelity mimicry optimized for a specific niche (textbook exams). It forces us to admit that much human "expertise" is Darwinian competence (survival in academia) rather than Turing-proof understanding. If we deny the AI, consistency demands we deny the brittle human.

  #### Case 3: The Ambiguous Deadlock
  **Scenario:** A system passes all invariance and OOD tests with graceful degradation. However, when asked to explain its reasoning, it produces coherent text that contradicts its actual internal attention weights (as per a separate probing study), yet the behavior remains robust.
  **Checklist Run:**
  *   **Step 1-3:** Passed (Behavior is robust).
  *   **Step 4:** Error signature is human-like (systematic).
  *   **Step 2:** Clever Hans hypothesis is unfalsifiable (The "heuristic" might just be a vastly more complex version of understanding).
  *   **Step 5 Verdict:** **Deadlock.**
  **Analysis:** The behavior satisfies the Turing condition (looks like understanding), but the Darwinian worry remains (could a massive lookup table simulate this robustness?). We cannot see the internal state to distinguish a "world model" from a "compressed world-simulator." The checklist cannot break the tie between *simulation of understanding* and *understanding*.

  ---

  ### What This Checklist Cannot Do
  1.  **Prove Understanding:** It can only reject claims of understanding. It is a falsification tool, not a verification tool.
  2.  **Access Phenomenology:** It cannot detect qualia or subjective experience, only behavioral robustness.
  3.  **Distinguish Scale from Kind:** It cannot tell if a system is "kind of" understanding or just "very good at pretending."
  4.  **Judge Intent:** It ignores whether the agent *cares* about the truth, only if it tracks it.

  Blind spot: It assumes robustness is the signature of truth, rather than the signature of a better simulator.
