      *   Hard cases handled? Yes (in the application section).
      *   Warnings about misfires? Yes.
      *   No weights/transcripts? Yes, relies on paper claims + simple proposed tests.
      *   Three specific cases applied? Yes.
      *   Flat-out limitations? Yes.
      *   One line ending? Yes.

