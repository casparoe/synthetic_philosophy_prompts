answer: |-
  This is a classic pivot point in political ethics, and your uncertainty is well-founded. The slogan "you can't govern with clean hands" is often used as a conversation-stopper when it actually conceals at least four or five distinct normative claims. In the context of your seminar—specifically regarding a coalition with an authoritarian party for climate ends—your advisor is likely invoking the **Walzerian** or **Weberian** tradition, but the precision matters for whether the objection is actually *answered* or just *overridden*.

  Here is a menu of interpretations of the slogan, categorized by their philosophical weight and function. I have tailored these to help you diagnose which claim your advisor is advancing.

  ### I. Trivial or Conceptual Readings
  *These claims are technically true but carry little normative weight. If your advisor means one of these, the slogan is rhetorical flourish rather than argument.*

  1.  **The Empirical Inevitability Thesis:** Politics involves the distribution of resources and the monopoly on violence. Therefore, some harm is statistically inevitable in governance.
      *   *Critique:* This conflates "unintended side effects" with "dirty hands." Dirty hands usually requires a deliberate violation of a norm, not just bad luck.
  2.  **The Imperfection Thesis:** No human agent is morally perfect. Therefore, no politician is perfectly pure.
      *   *Critique:* This is true of everyone, not just governors. It doesn't justify specific policy compromises; it just says everyone sins.

  ### II. Substantive & Defensible Theses
  *These are the heavy hitters in the literature. If your advisor is arguing from here, she is making a serious claim about the nature of political responsibility.*

  3.  **The Weberian "Ethic of Responsibility":** Drawing on Max Weber's *Politics as a Vocation*, this claims that politicians must account for the foreseeable consequences of their actions, not just the purity of their intentions. Adhering to absolute moral prohibitions (e.g., "never deal with authoritarians") can lead to catastrophic outcomes (e.g., climate collapse).
      *   *Implication:* The "dirt" is the violation of a deontological constraint justified by consequentialist necessity.
  4.  **The Walzerian "Necessary Violation":** Following Michael Walzer's seminal paper "Political Action: The Problem of Dirty Hands," this claims that there are situations where a politician *must* do wrong to do right. The politician violates a deep moral norm (like negotiating in bad faith or empowering bad actors) for the sake of the community's survival or welfare.
      *   *Implication:* The act remains morally wrong, even if it is politically necessary. This is crucial: it does not *clean* the hands; it admits they are dirty but argues the dirt was unavoidable.
  5.  **The Public Role Obligation:** This argues that the office itself carries duties that supersede private morality. A private citizen might be obligated to refuse the deal, but a fiduciary of the public good is obligated to secure the climate legislation, even at moral cost.
      *   *Implication:* The "dirt" arises from the specific role morality of the statesman, distinct from ordinary morality.

  ### III. False or Dangerous Misreadings
  *These are claims the slogan often smuggles in, but which are generally rejected in serious normative theory. If your advisor means these, they are vulnerable to critique.*

  6.  **The Cynical Realist Thesis:** Morality is irrelevant to politics; only power matters.
      *   *Critique:* This dissolves the "dirty hands" problem entirely. If morality doesn't apply, there are no dirty hands, only effective or ineffective moves. This contradicts the premise that there is "dirt" to begin with.
  7.  **The Moral Wash Thesis:** Political necessity *makes* the act right.
      *   *Critique:* This is a category error. Most dirty hands literature (especially Walzer) insists the act remains a moral violation. If the necessity makes it *good*, there is no tragedy, no residue, and no dirty hands—just a different calculus.
  8.  **The License Thesis:** Because governance is dirty, any dirty act is permissible.
      *   *Critique:* The literature argues for *exceptional* circumstances, not a blanket license. Using the slogan to justify *any* coalition deal without proving the necessity is an abuse of the concept.

  ### IV. The "Objection-Dismissing" Readings
  *These are the interpretations that specifically function to shut down the students' objections about the authoritarian coalition.*

  9.  **The Purity Objection Rebuttal:** The claim that objecting to the deal is a form of moral self-indulgence ("clean hands" as a status symbol). It suggests that prioritizing one's own moral integrity over the material welfare of the populace (climate stability) is itself a moral failure.
  10. **The Tragedy of Office:** The claim that the objection assumes a world that doesn't exist. By refusing the deal, the objector isn't keeping their hands clean; they are simply allowing a worse outcome to occur while remaining personally uninvolved. The "dirt" is transferred to the victims of inaction.

  ---

  ### Deep Dive: Your Specific Questions

  You asked two specific questions that cut to the heart of current debates in this literature. Here is how they map onto the menu above.

  #### 1. Choice vs. Structural Complicity
  *Is the dirt always a result of your own choices, or can it be structurally forced on you?*

  This is the distinction between **Agency-Based Dirty Hands** and **Structural Complicity**.

  *   **Agency-Based (Classic Walzer/Weber):** The dirt comes from a specific *choice* you make. You chose to shake the authoritarian's hand. You violated a norm. You are the author of the dirt. This fits the "coalition deal" scenario well.
  *   **Structural Complicity (Young/Systemic views):** This is the reading you are curious about. Here, the "dirt" is not necessarily a specific violation you chose, but the inheritance of an unjust system. By occupying the office, you become complicit in structural injustices (e.g., the existence of authoritarian parties, the urgency of the climate crisis caused by prior capitalism) regardless of your intent.
      *   *Relevance to Seminar:* If your advisor is using the **Structural** reading, she is saying: "The system is already dirty; your refusal to join the coalition doesn't clean the system, it just removes you from the levers that might mitigate the dirt." This shifts the blame from the *actor* to the *institution*.
      *   *Philosophical Risk:* This reading risks diluting the concept. If *everything* is structurally dirty, then "dirty hands" loses its specific meaning regarding necessary moral violations.

  #### 2. Emotional Residue and Guilt
  *Does the slogan imply you should feel guilty, or that feeling guilty proves you're morally healthy?*

  This is the **Phenomenology of Dirty Hands**.

  *   **Guilt as Validation (Walzer/Williams):** Yes, the literature strongly suggests that if you do not feel guilt or remorse, you are dangerous. If you make the dirty deal and sleep soundly, you have become a technocrat or a tyrant. The "clean hands" slogan implies that a good politician *will* have dirty hands, but they must *acknowledge* the dirt.
  *   **The "Moral Health" Claim:** Feeling the weight of the decision is proof that you haven't succumbed to the "Cynical Realist Thesis" (III.6 above).
  *   *Relevance to Seminar:* If your advisor implies that the students objecting are "too pure," she might be arguing that they are avoiding the necessary emotional burden of governance. However, a counter-argument is that **guilt without restitution is useless**. Does feeling guilty about the authoritarian coalition actually help the climate victims?

  ### How to Probe Your Advisor

  To clarify which thesis she is invoking, you might ask one of the following in seminar:

  1.  **To test Choice vs. Structure:** "When you say we can't govern with clean hands, are you saying this specific coalition deal violates a moral norm we are choosing to break (Walzer), or are you saying the office itself makes us complicit in structural injustices regardless of this specific deal (Structural Complicity)?"
  2.  **To test the Moral Status of the Act:** "Does taking this deal make the action *morally right* all-things-considered, or does it remain a moral wrong that is politically necessary? In other words, do our hands stay dirty, or does the necessity wash them clean?"
  3.  **To test the Emotional Residue:** "If we take this deal, is the expectation that we should feel remorse for empowering an authoritarian party? Or is the 'clean hands' objection just an error in calculating consequences?"

  ### A Note on the Typo
  Don't second-guess the framing over "clean hans." In a seminar on political philosophy, arguing that "hands are clean" vs. "hands are hans" is probably the one distinction that *won't* get you anywhere. Your grasp of the substantive problem is spot-on.

  Good luck with the seminar. This is one of the most enduring problems in the field for a reason—it resists easy solutions.
