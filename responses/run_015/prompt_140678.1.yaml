      *   *Correction on Twin Flask:* The prompt asks if ruling it out is a requirement. I need to take a stance. For action theory, if the arrow is purely thermodynamic, Twin Flask is possible. If the arrow is causal/metaphysical, it might not be. I should frame this as a test of *indexicality*.
      *   *Correction on Long Afternoon:* The theory needs to explain the *absence* of agency there, not fake it.
      *   *Trade-offs:* The big tension is between "Objective/Global Arrow" and "Local/Thermodynamic Arrow." You can't easily have both without the Past Hypothesis.
      *   *Killer Constraint:* The "Normalcy Condition" (we are not fluctuations). This kills the Fluctuation view and puts pressure on the Past Hypothesis (why *this* boundary condition?).

  6.  **Final Polish:**
