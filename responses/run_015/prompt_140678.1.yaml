      *(Self-Correction on the "Killer Constraint"):* The prompt suggests the anti-anthropic one is the likely candidate. I need to argue *why* it does the most work. It's because it protects the reliability of memory, which is foundational for action.

      *(Refining the Twin Flask verdict):* For an action theorist, if the arrow is just entropy, Twin Flask observers are both "right" locally. If the arrow is metaphysical, one must be wrong. The desideratum should be: *The theory must specify whether 'future' is indexical or absolute.*

      *(Refining the Long Afternoon verdict):* The theory must not imply agency exists in equilibrium. It must link the *possibility* of intervention to the *existence* of a gradient.

