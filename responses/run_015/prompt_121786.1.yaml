answer: |-
  Consider the hypothetical case of the Republic of Ostria. Eighty years ago, the Ostrian state orchestrated a systematic campaign of ethnic cleansing and aggressive war. At that time, the citizenry was homogenous and largely complicit, either through action or passive acquiescence. Today, Ostria retains its original constitution, borders, and international legal personality; there has been no revolution, no dissolution, and no change in the formal name of the state. However, due to a combination of low birth rates among the original population, high emigration of descendants, and successive waves of mass immigration, ninety-five per cent of current Ostrian citizens are either first-generation immigrants or the descendants of those who arrived after the atrocities ceased. None of the original perpetrators are alive, and the current populace shares no cultural, linguistic, or ancestral ties to the regime that committed the crimes.

  According to Karl Jaspers's framework, established in the aftermath of the Second World War, guilt is categorised into four types: criminal, political, moral, and metaphysical. For this scenario, the critical distinction lies between political and moral guilt. Jaspers argues that political guilt is borne by all citizens simply by virtue of their membership in the state; it renders them liable for the deeds of their government, typically discharged through reparations or the loss of political power. Crucially, however, Jaspers insists that moral guilt is strictly individual. It attaches only to one's own conscience and actions. He explicitly rejects the notion of collective moral guilt, arguing that a 'people' cannot sin as a metaphysical unity; only individuals can.

  The conceptual tension arises when we ask who exactly bears the political guilt in contemporary Ostria. If we adhere strictly to Jaspers's logic, the current citizens are politically liable because they are members of the state that committed the crimes. They must pay reparations and accept restrictions on their sovereignty. However, since the demographic substance of the citizenry has been entirely replaced, the 'solidarity' Jaspers assumes exists between co-citizens is non-existent. The current Ostrians did not empower the old regime, nor did they benefit from its specific crimes in any direct lineage.

  Here lies the precise point of friction: if political guilt survives the total disappearance of the people who originally constituted the state, then the bearer of that guilt can no longer be the citizenry in any meaningful human sense. Instead, the guilt must attach to the state apparatus itself as an abstract entity. If the state, independent of its current human constituents, carries the burden of the past, we are effectively treating the state as a persistent moral agent. It implies that the 'spirit' or 'will' of Ostria transcends the individuals living within it. This undermines Jaspers's foundational refusal to allow for collective moral guilt. By maintaining political liability across a total demographic break, we inadvertently reify the state into a moral subject that can be 'guilty' over and above the individuals who comprise it at any given moment. We are forced to say the State itself is guilty, which sounds suspiciously like the collective moral sin Jaspers sought to avoid.

  This problem is not merely empirical; it is not simply a matter of counting how many original citizens remain. If it were empirical, one could theoretically calculate a threshold—for instance, political guilt fades once fifty per cent of the population is replaced. However, no such numerical threshold exists in Jaspers's philosophy. The problem is conceptual, concerning the conditions of identity for a political collective over time. It asks what makes 'Ostria' the same entity today as it was eighty years ago. If the answer is purely legal continuity (treaties, borders), then the state is a legal fiction that can bear guilt without a corresponding human community to embody that responsibility. If the answer requires a continuity of people (a demos), then political guilt should have evaporated with the original citizenry.

  Therefore, the tension exposes a fissure in Jaspers's attempt to keep political guilt distinct from moral guilt. In a scenario of total demographic replacement, political guilt cannot remain a liability of the citizens, as they are strangers to the deed. It must become a property of the state. But if the state holds the guilt, it assumes a moral weight that transcends individual agency, collapsing the distinction Jaspers worked so hard to maintain. We are left with a collective entity that bears a stain of guilt, which is precisely the notion of collective moral guilt Jaspers claimed was incoherent.
