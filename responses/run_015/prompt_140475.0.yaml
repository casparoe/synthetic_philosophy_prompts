prompt: |-
  ok so i need a hand settling an argument i got dragged into. two people in my debate club (Aisha and Ben, both in the year above me) would not drop this and then asked *me* to call it and i honestly can't tell who's winning.

  its about that Taurek argument that if you can rescue one stranger or six strangers but not both, the numbers don't give you a reason to save the six, because nothing is six times worse for anyone — it's just one death for each of them.

  (1) Ben: each of the six separately has a complaint against you if you save the one. that's six complaints against one complaint, so save the six.
  (2) Aisha: complaints don't add up — there's no person whose complaint is six times as big, so "six complaints" is just book-keeping that nobody experiences, and it can't be what makes your choice worse.
  (3) Ben: ok, then run a fair lottery, everyone gets an equal shot. but notice: a coin flip between "save the one" and "save the six" is very different from putting all seven names in a hat, which gives the group of six a 6-in-7 chance somebody survives. your view says numbers never count, so it should have nothing to say about which lottery you run — yet that choice is what actually decides how many people die.
  (4) Aisha: that's fine, either lottery is allowed, that's the whole point. and the bit people actually care about is that you're *permitted* to save your own sister over six strangers, which the adding-up view basically can't let you do.
  (5) Ben: but imagine you're a paramedic and you'll face this same choice 200 times in your career, with different people each time. coin-flipping every time gets about 700 people killed where always-saving-the-six gets 200. a view that only works one case at a time is useless as a policy — so either it scales up and it's just a worse policy, or it doesn't scale and its major premise is doing nothing.
  (6) Aisha: the 200 cases involve 1400 different people, so again there's no one who loses 500 extra deaths; running the lifetime totals is just smuggling the same adding-up back in with a time axis.

  please adjudicate move by move — like rate each of those six moves from clearly wrong to clearly right with a quick reason — then say who's more right overall and what, if anything, both of them are missing. could you write it in British English, our teacher marks us down for American spellings. cheers
