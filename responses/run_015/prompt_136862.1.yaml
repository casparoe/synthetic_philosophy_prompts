prompt: |-
  Write a dialogue between an epiphenomenalist philosopher (Alva) and a phenomenal-interactionist (Bex) debating whether the paradox of phenomenal judgment defeats epiphenomenalism. Focus the exchange on a specific, under-discussed case: judgments that compare phenomenal qualities across sensory modalities—say, judging that a particular auditory loudness and a visual brightness share an intensity-structure. Alva should defend the view that such cross-modal judgments are produced entirely by physical neural correlates that track structural analogies in the brain, not by the phenomenal properties themselves; she should argue that this dissolves the paradox, since we never need qualia to cause our judgments—only isomorphic brain-states that generate reports structurally mirroring the phenomenal relations. Bex should counter that if the causal chain never involves the phenomenal properties at all, Alva cannot distinguish her judgments being about actual qualia from being about mere brain-structures, which collapses her position into phenomenal skepticism; Bex should press that Alva must know she has qualia to claim they are causally inert, yet her own account denies her any causal access to them. Alva should reply by distinguishing knowledge-by-acquaintance from causal tracking, and Bex should challenge whether that distinction survives Alva's physicalist commitments about judgment formation. Keep both characters equally sharp—no strawmen, genuine back-and-forth, each responding to the other's actual move. Begin with a one-sentence summary of the stalemate reached, present the exchange with clear speaker labels, and keep the whole response under 500 words.
