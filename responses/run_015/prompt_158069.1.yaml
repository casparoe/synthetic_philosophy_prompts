  # TAXONOMY INSTRUMENT: PANPSYCHIST SUFFERING METRICS

  **Node 1: Root Commitment (Phenomenal Fundamentalism)**
  *Premise:* Fundamental physical entities (quarks, fields, strings) possess intrinsic phenomenal properties. The taxonomy sorts ethical implications based on how these properties aggregate and manifest.
  *Excluded:* Physicalist eliminativism, substance dualism, and idealist-only frameworks denying physical base.

  **Node 2: Diagnostic Claim — Macro-Subject Binding**
  *Evaluable Claim:* "Quantum or field-level coherence mechanisms are sufficient to constitute a unified cosmic subject rather than merely dispersed micro-subjects."
  *   **Affirmative Path:** Proceed to Node 3 (Cosmopsychist trajectory).
  *   **Negative Path:** Proceed to Node 3 (Micropsychist trajectory).
  *   *Note:* This distinguishes whether the universe is a single experiencer or a collection of tiny experiencers.

  **Node 3: Diagnostic Claim — Valence Structure**
  *Evaluable Claim:* "Fundamental phenomenal properties include negative affect (suffering) rather than being purely structural, cognitive, or neutral."
  *   **Affirmative Path:** Proceed to Node 4 (Suffering-Entailed trajectory).
  *   **Negative Path:** Proceed to Node 4 (Neutral/Protopanpsychist trajectory).
  *   *Note:* This distinguishes whether physics feels *bad* or merely *exists*.

  **Node 4: Diagnostic Claim — Decoherence Threshold**
  *Evaluable Claim:* "Thermal noise or Planck-scale decoherence sets a moral-status cutoff below which phenomenal properties are ethically inert."
  *   **Affirmative Path:** Proceed to Node 5 (Cutoff trajectory).
  *   **Negative Path:** Proceed to Node 5 (Universalist trajectory).
  *   *Note:* This distinguishes whether only stable macro-structures count or if unstable micro-events count equally.

  **Node 5: Diagnostic Claim — Intervention Obligation**
  *Evaluable Claim:* "Altering physical conditions (e.g., reducing local entropy to preserve coherence or induce decoherence) is ethically required or permitted to mitigate suffering."
  *   **Affirmative Path:** Proceed to Node 6 (Active Ethics).
  *   **Negative Path:** Proceed to Node 7 (Passive/Forbidden Ethics).
  *   *Note:* This distinguishes whether physics imposes a duty to engineer reality.

  **Node 6: Leaf Cluster — Ethically Relevant Suffering Exists**
  *Positions mapped here imply a duty to mitigate physical suffering.*
  *   **Cosmopsychism with Full-Spectrum Valence:** (Nodes 2+, 3+, 4-, 5+). The universe suffers as a whole; intervention is required. *Occupied.*
  *   **Micropsychist "Noise Suffering" View:** (Nodes 2-, 3+, 4-, 5+). Fundamental particles suffer; high entropy increases suffering density. *Occupied.*
  *   **Protopanpsychism with Low Decoherence Cutoff:** (Nodes 2-, 3+, 4+, 5+). Only stable composites suffer; intervention targets macro-structures. *Occupied.*
  *   **Unoccupied Combination:** (Nodes 2+, 3+, 4+, 5+). Cosmic subject suffers but only above decoherence threshold. *Diagnosis:* **Incoherent.** If the cosmos is a unified subject (2+), internal decoherence should not negate its singular suffering status.
  *   **Indistinguishability Flag:** The "Micropsychist Noise Suffering" view is functionally indistinguishable from "Protopanpsychism with Low Cutoff" if the threshold is set at the Planck scale, as both mandate universal mitigation.

  **Node 7: Leaf Cluster — No Ethically Relevant Suffering**
  *Positions mapped here imply no duty to alter physical conditions for suffering reasons.*
  *   **Neutral Micropsychism:** (Nodes 2-, 3-, 4-, 5-). Micro-entities have experience but no valence. *Occupied.*
  *   **Cognitive-Only Panpsychism:** (Nodes 2+, 3-, 4-, 5-). Cosmic subject exists but possesses only structural/intentional properties. *Occupied.*
  *   **Unoccupied Combination:** (Nodes 2-, 3+, 4+, 5-). Micro-entities suffer, but decoherence cancels moral status, yet intervention is forbidden. *Diagnosis:* **Unattractive.** Acknowledges suffering exists (3+) but forbids mitigation (5-) despite having a cutoff mechanism (4+). Requires a deontological constraint against entropy reduction that outweighs suffering prevention.
  *   **Indistinguishability Flag:** "Neutral Micropsychism" and "Cognitive-Only Panpsychism" cannot be cleanly separated by external behavioral observation, as both yield zero ethical weight regarding suffering, differing only in internal metaphysical description.
