  **COMMITTEE ON CONTINUITY OF PERSONHOOD AND INSTITUTIONAL OBLIGATIONS**
  **FORMAL OPINION: CASE 24-09 (VASQUEZ)**
  **DATE:** October 26, 2023
  **SUBJECT:** Determination of Continuity Regarding Dr. Elena Vasquez

  **Recommendation**
  The Committee recommends option (a): full institutional recognition of the individual currently occupying Dr. Vasquez's position as continuous with the original Dr. Elena Vasquez. Consequently, tenure, pension contributions, and spousal health benefits must continue without interruption. This decision rests not on legal precedent, but on a philosophical analysis of personhood relevant to institutional obligations.

  **Philosophical Framework**
  Our deliberation centers on Derek Parfit's distinction between personal identity and what actually matters in survival. Strict identity often relies on physical continuity—the persistence of the same biological organism. However, Parfit argues that identity is not what matters; rather, survival consists in psychological continuity connected by the right kind of causal chain. If memories, dispositions, and psychological traits are preserved through a reliable causal process, the person survives, even if strict metaphysical identity is ambiguous.

  In the Graduated Substrate Replacement (GSR) protocol, the causal connection is unbroken. Unlike a sudden copy-and-destroy scenario, GSR replaces neurons incrementally. At no point did consciousness cease or psychological connectivity break. The causal chain runs directly from the biological brain to the synthetic substrate through functional preservation. Therefore, while the biological organism has ceased, the psychological agent—the entity capable of holding rights, obligations, and relationships—has survived. For an institution like a university, obligations attach to the moral agent, not the biological substrate. Tenure is a contract with a mind capable of inquiry and teaching, not merely with a specific arrangement of carbon-based cells.

  **Addressing the Objection of Death**
  We must treat seriously the objection raised by Dr. Vasquez's adult children. They argue that because the original biological tissue was destroyed, a death occurred, and recognizing Vasquez-2 erases this reality. They contend that benefits should not flow to a successor entity.

  This claim holds metaphysical weight. The biological organism that birthed the children no longer exists. In a profound sense, a death *did* occur. To deny this is to invalidate the children's grief and their understanding of human mortality. However, institutional recognition is not a metaphysical verdict on the soul; it is a practical determination of obligation. If we deny continuity based on substrate change, we prioritize biological material over psychological functioning. This would imply that any significant neural restructuring constitutes death, destabilizing any future participation in GSR.

  Recognizing Vasquez-2 does not deny the biological transition the children mourn; it asserts that institutional obligations track the surviving psychological agent. To rule otherwise would be to treat a living, suffering, psychologically continuous person as dead for bureaucratic convenience. This would inflict tangible harm on the surviving agent (loss of livelihood) and the spouse (loss of support) based on a metaphysical technicality that does not diminish the agent's capacity to fulfill the role for which tenure was granted. The institution owes its obligations to the person who remembers earning them, not to the dust of the cells that processed them.

  **Criteria for Future Cases**
  To govern future substrate replacement cases, the Committee establishes the following criteria for continuity recognition:
  1.  **Gradualism:** Replacement must be incremental enough to preserve uninterrupted consciousness and causal connectivity between psychological states.
  2.  **Psychological Verification:** Post-procedure subjects must demonstrate preserved memory, disposition, and cognitive capacity through standardized philosophical and psychological assessment.
  3.  **Voluntary Consent:** The original biological agent must have consented to the procedure with full understanding of the continuity claims involved.

  **Conclusion**
  The University Medical Center approved the GSR protocol with the implicit understanding that the participant would survive the process. To now claim death based on physical discontinuity contradicts the protocol's purpose and violates the principle that psychological continuity is what matters for survival. We affirm that Dr. Vasquez survives in the only way relevant to her role as a professor and beneficiary of institutional trust. Her tenure and benefits are reinstated effective immediately.

  **Signed,**
  **The Committee on Continuity of Personhood and Institutional Obligations**
