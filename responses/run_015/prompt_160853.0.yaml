answer: |-
  # DISCUSSION HANDOUT: DO THE NUMBERS COUNT?
  **Course:** ETH 202 | **Topic:** Rescue Cases & Aggregation | **TA:** [Your Name]

  **INSTRUCTIONS:** Start at **Node 1**. Answer the concrete question based on your intuition, not a theory name. Follow the arrows to find your position.

  ### THE DECISION TREE

  **NODE 1: Normative Force**
  In the standard case (1 stranger dies vs. 5 strangers die, all else equal), is saving the five **morally required** (you are blameworthy if you save the one) or **merely permissible** (saving the one is also morally okay)?
  *   **Merely Permissible** → Go to **Node 2**
  *   **Morally Required** → Go to **Node 3**

  **NODE 2: Fairness Mechanism**
  If saving the five is not required, are you **forbidden** from using numbers to decide (you *must* flip a coin), or are you **allowed** to just pick the five without a lottery?
  *   **Forbidden (Must Flip)** → **LEAF A: Strict Equal Chances**
  *   **Allowed (Discretion)** → **LEAF B: Moderate Discretion (Unnamed)**

  **NODE 3: Small Losses**
  Assume saving the five is required. Suppose the five will each lose a **finger**, but the one will lose a **whole hand** (which matters more to them than a finger). Must you still save the five?
  *   **Yes (Numbers Trump Magnitude)** → Go to **Node 4**
  *   **No (Magnitude Trumps Numbers)** → Go to **Node 5**

  **NODE 4: Huge Ratios**
  If you saved the five in Node 3: Suppose the one loses a hand, but **one million** others each lose a trivial **itch**. Do you save the million?
  *   **Yes (Save the Million)** → **LEAF C: Straight Aggregationism**
  *   **No (Save the Hand)** → Go to **Node 6**

  **NODE 5: Priority Threshold**
  If you saved the one in Node 3: Is there *any* number of fingers that would outweigh the hand, or is the hand **absolutely prior** regardless of the number of fingers?
  *   **Absolutely Prior** → **LEAF D: Leximin Priority**
  *   **Threshold Exists** → **LEAF E: Threshold Aggregation**

  **NODE 6: Tie-Break**
  If you saved the one in Node 4 (due to magnitude): If the harm is identical (**1 hand vs. 5 hands**), do the numbers break the tie?
  *   **No (Indifferent)** → **LEAF F: Individualist Non-Aggregation**
  *   **Yes (Numbers Break Tie)** → Go to **Node 7**

  **NODE 7: Standpoint (Victim)**
  If numbers break the tie: If **you** are the one victim, are you permitted to save **yourself**, even if a bystander would be required to save the five?
  *   **Yes (Self-Preference)** → **LEAF G: Agent-Relative Prerogative**
  *   **No (Impartial)** → Go to **Node 8**

  **NODE 8: Standpoint (Policy)**
  If impartial: Would you mandate this rule as **law/policy** from behind a Veil of Ignorance, or is it only **personal morality**?
  *   **Personal Only** → **LEAF H: Private Supererogation (Unnamed)**
  *   **Public Policy** → Go to **Node 9**

  **NODE 9: Risk**
  Suppose the one faces **certain death**, but the five each face a **20% risk** (expected 1 death). Do you save the five?
  *   **No (Save the Certain)** → **LEAF I: Certainty Absolutism (Unnamed)**
  *   **Yes (Save the Five)** → Go to **Node 10**

  **NODE 10: Consciousness**
  Suppose the five are **asleep** and will never know they were in danger (no trauma). Does their rescue count less than the awake one?
  *   **Yes (Experience Matters)** → **LEAF J: Subjective Weighting**
  *   **No (Objective Harm)** → Go to **Node 11**

  **NODE 11: Commensurability**
  Is the difference between "hand" and "finger" a **mathematical difference** (more pain units) or a **qualitative one** (different kind of badness)?
  *   **Qualitative** → **LEAF K: Incommensurable Harms**
  *   **Mathematical** → Go to **Node 12**

  **NODE 12: Aggregation Method**
  If mathematical: Do you **sum the total harm** across all people, or compare the **worst-off individual** in each group?
  *   **Sum Total** → **LEAF C: Straight Aggregationism** *(Loop back)*
  *   **Worst-Off Individual** → Go to **Node 13**

  **NODE 13: Claim Strength**
  If comparing individuals: Does the group of five have a stronger claim because **there are more of them**, or only if their **individual harm is worse**?
  *   **More of Them** → **LEAF L: Contractualist Pairwise Comparison**
  *   **Individual Harm Worse** → **LEAF F: Individualist Non-Aggregation** *(Loop back)*

  **NODE 14: Reasoning**
  If you save the five: Is it to **minimize the death count** (consequentialist) or to **respect the stronger aggregate claim** (deontological)?
  *   **Minimize Count** → **LEAF C: Straight Aggregationism** *(Loop back)*
  *   **Respect Claims** → **LEAF L: Contractualist Pairwise Comparison** *(Loop back)*

  ---

  ### THE LEAVES: POSITIONS & AWKWARD COMMITMENTS

  | Leaf | Position | Ancestry/Notes | The Single Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Strict Equal Chances** | Taurek / Randomization | You must let five die rather than violate the one's right to a 50% chance. |
  | **B** | **Moderate Discretion** | *Unnamed* | You have no duty to save the five, but it's not unfair to do so; morality is silent. |
  | **C** | **Straight Aggregationism** | Classical Utilitarianism | A million trivial itches morally outweigh one person's agonizing death. |
  | **D** | **Leximin Priority** | Rawls / Prioritarianism | You must save the one losing a hand even if the alternative is five people losing an arm each. |
  | **E** | **Threshold Aggregation** | Scheffler / Moderate | There is a specific number of stubbed toes that becomes worse than a death, but we can't say where. |
  | **F** | **Individualist Non-Agg** | Scanlon (strict reading) | In a 1-vs-5 tie of identical harm, you have no moral reason to prefer the five over the one. |
  | **G** | **Agent-Relative Prerogative** | Agent-Centered Ethics | A bystander must save the five, but the one is blameless for saving himself; morality contradicts itself. |
  | **H** | **Private Supererogation** | *Unnamed* | Saving the five is good, but making it a law would be tyrannical; public and private morality diverge. |
  | **I** | **Certainty Absolutism** | *Unnamed* | You must save the one certain victim even if it means allowing five others to face a 99% risk of death. |
  | **J** | **Subjective Weighting** | Hedonistic Utilitarianism | Rescuing five unconscious people is less valuable than rescuing one terrified person. |
  | **K** | **Incommensurable Harms** | Value Pluralism | We cannot rationally choose between the hand and the fingers; choice is essentially arbitrary. |
  | **L** | **Contractualist Pairwise** | Scanlon / F.M. Kamm | The five have a stronger claim only if each individual's complaint is stronger, not because they are many. |

  ---

  ### LOGICAL GAPS & INDISTINGUISHABLE SLOTS

  **1. Empty/Unstable Slots:**
  *   **Leaf B (Moderate Discretion)** and **Leaf H (Private Supererogation)** are logically unstable. If it's permissible to save the one, why is it permissible to save the five? If there's no reason to save the five, doing so looks like bias. Few philosophers defend this; most slide into **Leaf A** (must flip) or **Leaf C** (must save five).
  *   **Leaf I (Certainty Absolutism)** is rarely held as a principled view. It usually appears as a heuristic mistake rather than a defended ethical position.

  **2. Indistinguishable Leaves:**
  *   **Leaf C (Aggregationism)** and **Leaf L (Contractualist)** often converge on the *verdict* (save the five) in standard cases. The tree separates them at **Node 14** (Reasoning), but in practice, students often conflate "minimizing death" with "respecting claims." If a student cannot articulate *why* they save the five, these two positions are functionally identical for this course.

  ---

  ### NASTY FOLLOW-UP CASES
  *Use these if two students land on the same Leaf but clearly mean different things.*

  1.  **The Identical Twin Case:** For **Leaf L (Contractualist)**: What if the five are clones with identical genetic makeup and life prospects? Does their "individuality" dissolve, reducing their claim strength?
  2.  **The Reluctant Rescuer:** For **Leaf G (Agent-Relative)**: If the one is your child, you save them. If the one is a stranger, you save the five. Is morality just about *whose* stranger it is, or does relationship status change the math?
  3.  **The Knowledge Loop:** For **Leaf J (Subjective)**: If you tell the five they were in danger *after* saving them, does the moral value of the rescue retroactively increase?
