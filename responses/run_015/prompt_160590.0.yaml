answer: |-
  # Specification: Animal Welfare Theory v1.0

  ## 1. System Purpose
  To provide a decision procedure for aquaculture interventions that satisfies three jobs:
  1.  **Intervention Validation:** Distinguish genuine welfare improvements from lateral changes (e.g., density vs. stunning).
  2.  **Cross-Species Normalization:** Output a comparable value across taxonomically distant species (e.g., shrimp vs. salmon) without returning `NULL` or "it depends."
  3.  **Scalable Audit:** Function as a check on populations (N > 10,000) where individual inspection is impossible.

  ## 2. Desiderata (Requirements)

  **REQ-01: Phenomenal Grounding (NN)**
  *   **Spec:** Welfare must be defined by the subject's internal experience (valenced states), not merely physiological function.
  *   **Case:** The ablated shrimp eating normally. Physiology says "functioning"; experience may say "painful drive."
  *   **Rationale:** Prevents the "Happy Slave" problem where an animal functions perfectly while suffering.

  **REQ-02: Productivity Decoupling (NN)**
  *   **Spec:** Welfare metrics must have zero correlation with business KPIs (growth rate, FCR, yield) in the definition.
  *   **Case:** The fish with fin erosion growing at target rate.
  *   **Rationale:** Prevents the system from optimizing for harvest weight while ignoring pathology.

  **REQ-03: Behavioral Integrity (NN)**
  *   **Spec:** Metrics must detect suffering even when behavioral expression is suppressed (pharmacologically or genetically).
  *   **Case:** Fish bred not to thrash during handling.
  *   **Rationale:** Prevents "solving" welfare by breeding animals that cannot signal distress.

  **REQ-04: Cross-Species Commensurability (NN)**
  *   **Spec:** The output unit must be comparable across phyla (Decapoda vs. Chordata).
  *   **Case:** 1kg Shrimp vs. 1kg Salmon.
  *   **Rationale:** Job 2 requirement. "It depends" is a system failure.

  **REQ-05: Outlier Sensitivity (P)**
  *   **Spec:** The model must account for the worst-off individual, not just the population mean.
  *   **Case:** The one individual in the pen doing terribly who is never sampled.
  *   **Rationale:** Utilitarian averaging hides extreme suffering.

  **REQ-06: Temporal Aggregation (NN)**
  *   **Spec:** Welfare must be integrated over the complete lifecycle, not snapshot at audit time.
  *   **Case:** The whole life that lasts eight months.
  *   **Rationale:** A good final week does not negate seven months of crowding.

  **REQ-07: Termination Event Inclusion (NN)**
  *   **Spec:** The method and process of death must be included as a negative welfare weight.
  *   **Case:** Ice-slurry vs. electrical stunning.
  *   **Rationale:** Death is the final welfare event; the transition from alive to dead has welfare properties.

  **REQ-08: Epistemic Fidelity (NN)**
  *   **Spec:** The audit score must correlate with the animal's actual condition, not the protocol's ability to measure it.
  *   **Case:** Distinction between actual condition vs. the number the audit produces.
  *   **Rationale:** Prevents Goodhart's Law (when a measure becomes a target, it ceases to be a good measure).

  **REQ-09: Biological Substrate Agnosticism (NN)**
  *   **Spec:** Criteria cannot rely on mammalian-specific anatomy (e.g., neocortex).
  *   **Case:** Fish and decapod neurology.
  *   **Rationale:** Consistency with biology without anatomical chauvinism.

  **REQ-10: Nociception/Felt Pain Distinction (NN)**
  *   **Spec:** Theory must define an experimental differentiator between reflexive withdrawal and negative subjective experience.
  *   **Case:** Evidence of feeling rather than nociception alone.
  *   **Rationale:** Prevents treating spinal reflexes as welfare events.

  ## 3. Incompatibility Flags (Trade-offs)

  **CONFLICT-A: REQ-04 (Commensurability) vs. REQ-01 (Phenomenal Grounding)**
  *   **Issue:** We have no objective meter for "units of suffering" that works across a vertebrate and an invertebrate. To compare them, you must assume a functional proxy (behavior/physiology), which violates REQ-01 (internal experience).
  *   **Status:** Unresolvable. You must either accept a proxy (violating NN) or return "incomparable" (violating Job 2).

  **CONFLICT-B: REQ-05 (Outlier Sensitivity) vs. REQ-03 (Scalable Audit)**
  *   **Issue:** You cannot audit the one animal you do not sample. Statistical sampling inherently smooths outliers.
  *   **Status:** Unresolvable at scale. To catch the outlier, you need 100% inspection, which violates Job 3.

  **CONFLICT-C: REQ-08 (Epistemic Fidelity) vs. Job 3 (Implementable Check)**
  *   **Issue:** Internal states (REQ-01) are not directly observable at scale. Observable proxies (behavior) are vulnerable to REQ-03 (breeding out behavior).
  *   **Status:** High friction. Requires expensive physiological monitoring (cortisol, brain activity) which breaks cost/scale constraints.

  ## 4. System Viability Assessment

  **Is the full list satisfiable?**
  **No.**
  The combination of **REQ-04 (Cross-Species Commensurability)** and **REQ-08 (Epistemic Fidelity)** creates a hard stop. You cannot have high-fidelity access to internal states across different biologies *and* reduce them to a single comparable number without introducing a massive abstraction layer that violates Epistemic Fidelity.

  **The Killer Requirement:**
  **REQ-04: Cross-Species Commensurability.**
  This requirement kills the most candidates. Most welfare theories (Hedonism, Preference Satisfaction) work reasonably well *within* a species. They collapse completely when asked to equate a shrimp's avoidance behavior with a salmon's stress hormone profile on a single linear scale. This is the "Inter-species Utility Monster" problem. If you drop this, 80% of the spec becomes buildable. If you keep it, the system returns `ERROR` on Job 2.

  ## 5. Scorecard

  **Feeling-Based Views (Hedonism)**
  *   **Pros:** Satisfies REQ-01 (Phenomena) and REQ-07 (Death/Termination).
  *   **Cons:** Fails REQ-04 (No cross-species meter) and REQ-08 (Cannot audit feelings at scale).
  *   **Verdict:** Ontologically correct, operationally dead.

  **Preference/Desire-Based Views**
  *   **Pros:** Handles REQ-09 (Biology agnostic) via choice tests.
  *   **Cons:** Fails REQ-03 (Adaptive preference/apathy trap) and REQ-02 (Animals may prefer high-density if food is easier).
  *   **Verdict:** Vulnerable to the "calm because apathetic" case.

  **Functioning/Natural-Living Views**
  *   **Pros:** Satisfies REQ-06 (Lifecycle) and REQ-03 (Scalable Audit via physical checks).
  *   **Cons:** Fails REQ-02 (Growth often equals functioning) and REQ-01 (Ignores internal state of the ablated shrimp).
  *   **Verdict:** High audit fidelity, low welfare truth.

  **Operationalist View (Welfare = Audit Score)**
  *   **Pros:** Satisfies Job 3 (Scalable) and REQ-04 (Forces comparison by definition).
  *   **Cons:** Explicitly violates REQ-08 (Collapses Actual vs. Number) and REQ-03 (Vulnerable to breeding out indicators).
  *   **Verdict:** The only shippable code, but it defines the bug as a feature.
