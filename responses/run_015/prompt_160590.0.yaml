          2.  Compare across species (shrimp vs. salmon) without "it depends."
          3.  Implementable as a check on farms with thousands/millions of animals (audit-able).
      *   **Specific Cases to Cover:**
          *   Ablated shrimp eating/spawning normally.
          *   Fish with erosion/deformity growing at target rate.
          *   Apathetic calmness vs. true calmness.
          *   The outlier individual (worst-off) never sampled.
          *   Short lifespan (8 months).
          *   Death as a welfare item vs. pre-death experience.
      *   **Traps to Avoid:**
          *   Tying welfare to productivity (growth/FCR).
          *   Breeding out behavioral indicators (e.g., fish bred not to thrash).
      *   **Distinctions to Maintain:**
          *   Welfare vs. Moral Status.
          *   Badness vs. Count (severity vs. number).
          *   State at a time vs. Lifetime.
          *   Actual condition vs. Audit number.
      *   **Biological Constraints:** Consistent with biology (no mammalian cortex reliance), distinguish feeling vs. nociception.
      *   **Formatting/Constraints:**
          *   Mark requirements as Non-Negotiable (NN) or Preference (P).
          *   Flag incompatible pairs (trade-offs).
          *   Identify the single requirement that kills the most candidates.
          *   Admit if the full list is unsatisfiable.
          *   Short scorecard at the end (Feeling, Preference, Functioning, Operationalist).
      *   **Tone:** Technical, precise, "spec-like," no fluff, no citations.

  2.  **Deconstruct the Problem (The "Spec"):**
      *   The user wants a *theory of welfare* that functions like a *software specification*. It needs inputs, outputs, constraints, and edge cases.
      *   The core tension is between *ontological truth* (what the animal actually feels) and *epistemic access* (what we can measure at scale).
      *   The "Cross-Species Comparison" requirement is the hardest philosophical hurdle (the "inter-species utility monster" problem).
      *   The "Audit-able at Scale" requirement clashes with "Internal State" accuracy.
      *   The "Productivity Trap" requires decoupling welfare from business metrics.

  3.  **Drafting the Desiderata (Requirements):**
      *   *Req 1: Phenomenal Grounding.* Welfare must be about what it's *like* to be the animal, not just biology. (Addresses nociception vs. feeling).
      *   *Req 2: Decoupling from Productivity.* Growth $\neq$ Welfare. (Addresses the trap).
      *   *Req 3: Decoupling from Behavioral Suppression.* Lack of thrashing $\neq$ Lack of pain. (Addresses the breeding trap).
      *   *Req 4: Cross-Species Commensurability.* Must map shrimp pain to salmon pain on a shared scale. (Addresses Job 2).
      *   *Req 5: Sensitivity to Outliers.* The worst-off individual matters, even if unsampled. (Addresses the outlier case).
      *   *Req 6: Temporal Aggregation.* Must account for the whole life, not just snapshots. (Addresses the 8-month life).
      *   *Req 7: Death as Welfare Event.* Killing is part of the welfare calculation. (Addresses the death question).
      *   *Req 8: Audit Fidelity.* The metric must correlate with the internal state, not just the audit score. (Addresses Actual vs. Number).
      *   *Req 9: Biological Plausibility.* No cortex required. (Addresses biology constraint).

  4.  **Identifying Incompatibilities (The "Trade-offs"):**
      *   *Cross-Species Commensurability (Req 4)* vs. *Biological Plausibility/Phenomenal Grounding (Req 1 & 9).* We don't have a "pain meter" that works across phyla.
      *   *Sensitivity to Outliers (Req 5)* vs. *Audit Fidelity/Scale (Req 8 & 3).* You can't audit the one fish you don't catch.
      *   *Phenomenal Grounding (Req 1)* vs. *Implementable Check (Job 3).* We can't read minds. Operationalism is the only scalable way, but it violates the "Actual vs. Number" distinction.

  5.  **Determining Unsatisfiability:**
      *   Honest answer: The full list is likely unsatisfiable. Specifically, Job 2 (Cross-species comparison without "it depends") combined with Job 3 (Scalable audit) and the constraint against Operationalism (Actual vs. Number) creates a triangle of impossibility.
      *   Which requirement kills the most candidates? *Cross-Species Commensurability.* Most theories work within a species but break when comparing a crustacean to a vertebrate.

  6.  **Developing the Scorecard:**
      *   *Feeling-based (Hedonism):* Good on ontology, fails on auditability and cross-species scaling.
      *   *Preference-based:* Fails on "adaptive preference" (apathy trap) and breeding traps.
      *   *Functioning/Natural Living:* Fails on productivity decoupling (growth often looks like functioning) and cross-species comparison (what is "natural" for farmed salmon?).
      *   *Operationalist:* Passes auditability, fails on "Actual vs. Number" distinction (Goodhart's Law).

  7.  **Refining the Output (Iterative Polishing):**
      *   *Tone Check:* Keep it dry, engineering-focused. Use terms like "Input," "Output," "Constraint," "False Positive/Negative."
      *   *Constraint Check:* Did I include citations? No. Did I mark NN vs P? Yes. Did I flag incompatible pairs? Yes. Did I identify the killer requirement? Yes.
      *   *Specific Cases:* Ensure the ablated shrimp, the apathetic animal, and the bred fish are explicitly referenced in the requirements or trade-offs.
      *   *Death:* Make sure death is handled as a welfare input (negative utility of cessation + method of kill).

  8.  **Final Review against User Prompt:**
