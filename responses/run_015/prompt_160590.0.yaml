      *(Self-Correction on Death)*: Is death a welfare item? Philosophically debated. For this spec, if the goal is to compare shrimp vs. salmon, the *process* of death is definitely welfare. The *fact* of death is trickier. I will specify that the *manner* of death is NN, the *existence* of death as a negative is a Preference (as some theories say non-existence isn't bad for the subject). Actually, for aquaculture, the kill method is the big welfare issue. I'll frame it as "Termination Event."

      *(Self-Correction on "Actual vs Number")*: This is the core tension. If welfare is real, an audit is an estimate. If the audit *defines* welfare, the distinction collapses. The user explicitly says "Distinctions it isn't allowed to collapse." So Operationalism is effectively banned by the user's constraints, but I need to score it anyway.

      *(Final Polish)*: Ensure the "Killer Requirement" is clearly identified. It's the Cross-Species Commensurability combined with the Epistemic Access constraint.

