answer: |-
  # Which Simpson's Paradox Person Are You?

  **Intro:**
  Welcome to the ultimate data dilemma quiz! You're going to read 10 short scenarios where the numbers tell two different stories depending on how you look at them. There are no "math problems" here—just pick the answer that feels most right to you based on how you think evidence should work. Be honest; there are no wrong answers, only different ways of seeing the world.

  ---

  ### Question 1: The Kidney Stone Trial
  A new surgery for kidney stones was tested. When you look at **all patients together**, the Old Surgery had a higher success rate than the New Surgery. But when you split patients by **stone size** (Small vs. Large), the New Surgery did better in *both* groups. The New Surgery was just given to more people with hard-to-treat Large stones.
  *   **A.** Go with the total numbers. More patients were tested overall, so the big picture is more reliable.
  *   **B.** Go with the split numbers. You can't compare hard cases to easy cases; the subgroups are the fair comparison.
  *   **C.** It depends on how patients were assigned to surgeries. If doctors chose based on severity, the totals are misleading.

  ### Question 2: The University Admissions
  A university is accused of bias against women. The **overall acceptance rate** for men is higher than for women. However, if you look at **each department individually**, most departments actually accept women at slightly higher rates than men. Women just applied to the more competitive departments.
  *   **A.** The overall rate is what matters for public policy. The university admits fewer women, period.
  *   **B.** The department rates are the truth. The bias is in where women choose to apply, not the admissions office.
  *   **C.** We need to know if the department competitiveness is caused by the bias or just history. The numbers alone don't say.

  ### Question 3: The Baseball Batting Averages
  Player A has a higher batting average than Player B in **Season 1** and also in **Season 2**. But when you **combine both seasons**, Player B has the higher average. Player A had way more at-bats in the season where everyone batted poorly.
  *   **A.** The combined average defines the better hitter. Consistency over the whole career is what counts.
  *   **B.** The season-by-season average shows who was actually better when they stepped up to the plate.
  *   **C.** It depends on who you're signing for next season. If next season looks like Season 1, pick A.

  ### Question 4: The Survival Bias (The Collider)
  A study looks at a risky drug. The data only includes people who **survived the first week**. Among survivors, those who took the drug seem to recover slower than those who didn't. But the drug actually helps survival; the people who didn't take it and survived were just the super-healthy ones.
  *   **A.** Compare everyone who started the study, not just the survivors. The survivors are a skewed group.
  *   **B.** Only compare the survivors. You can't measure recovery in people who didn't make it past week one.
  *   **C.** Ignore the split. The fact that survival is required to be in the data makes the comparison broken either way.

  ### Question 5: The Blood Pressure Pathway (The Mediator)
  A drug lowers blood pressure, and lower blood pressure leads to recovery. If you look at **total recovery**, the drug works. But if you **split by blood pressure** (comparing only people with the same BP), the drug looks like it does nothing or even hurts.
  *   **A.** Look at the total recovery. Lowering blood pressure is part of how the drug does its job.
  *   **B.** Split by blood pressure. We need to know if the drug helps *beyond* just changing blood pressure.
  *   **C.** It depends on the goal. If we care about health outcomes, use totals. If we care about chemical mechanisms, split it.

  ### Question 6: The Doctor vs. The Policy Maker
  A treatment has a negative effect overall but a positive effect in every subgroup. You are a **doctor** choosing for a specific patient whose subgroup you know.
  *   **A.** Use the overall number. It represents the average experience of all patients.
  *   **B.** Use the subgroup number. You know which group this patient belongs to.
  *   **C.** It depends on the decision. A policy maker should use the overall number; a doctor should use the subgroup number.

  ### Question 7: The Ratio Flip
  When you compare success **percentages**, Treatment A looks better in subgroups but worse overall. When you compare **raw differences** (extra cures per 100 people), the reversal disappears and Treatment A is always better.
  *   **A.** Percentages are standard. If the flip happens there, the paradox is real.
  *   **B.** Raw differences are more honest. The flip is just a math trick caused by using ratios.
  *   **C.** Report both. Different metrics tell different stories, and picking one hides information.

  ### Question 8: The Zodiac Slice
  You find a reversal in the data if you split people by **Zodiac sign**. There was no theory predicting this; you just tried many splits until one worked.
  *   **A.** If the split shows a pattern, it's a pattern. The data is the data.
  *   **B.** Ignore it. Slicing data until you find a flip is cherry-picking, not science.
  *   **C.** Keep it as a hypothesis. It's probably noise, but worth testing in a new study.

  ### Question 9: The Randomized Trial
  In an observational study, there is a paradox. In a **randomized controlled trial** of the same thing, the paradox disappears and the trend is consistent.
  *   **A.** Trust the observational study. It has more real-world data.
  *   **B.** Trust the randomized trial. Randomization balances out the hidden groups causing the flip.
  *   **C.** Trust neither. If the results disagree, we don't understand the system yet.

  ### Question 10: The "Real World" Assignment
  In a hospital, doctors assign the new treatment to sicker patients. In a computer simulation, treatment is assigned by a **coin flip**. The paradox appears in the hospital data but not the simulation.
  *   **A.** The hospital data is what matters. Patients aren't coins.
  *   **B.** The simulation shows the true effect. The hospital data is contaminated by doctor choices.
  *   **C.** The hospital data shows the effect of the *policy*, the simulation shows the effect of the *drug*. Both are real.

  ---

  ## Scoring Key & Analysis

  ### The Leaves (Your Results)
  Count how many times you selected options leaning toward each philosophy. (Note: In a real app, this would be automated. For this project, look at which cluster below matches your choices best).

  1.  **The Marginalist ("Report the Combined")**
      *   *Stance:* The aggregate numbers represent the reality of the population. Subgroups are noise or sample size tricks.
      *   *Typical Picks:* 1A, 2A, 3A, 6A.
  2.  **The Stratifier ("Split by Every Variable")**
      *   *Stance:* You must compare apples to apples. If a subgroup exists, you must adjust for it, regardless of why it exists.
      *   *Typical Picks:* 1B, 2B, 3B, 8A.
  3.  **The Causal Purist ("Adjust for Common Causes Only")**
      *   *Stance:* Only split on variables that cause both the treatment and the outcome. Splitting on effects (Colliders/mediators) creates bias.
      *   *Typical Picks:* 1C, 4A, 5A, 9B.
  4.  **The Contextualist ("No Single Effect")**
      *   *Stance:* There is no "true" effect size. Effects only exist within specific contexts or subgroups.
      *   *Typical Picks:* 2C, 5C, 8C, 10C.
  5.  **The Pragmatist ("Depends on the Decision")**
      *   *Stance:* The "right" number depends on who is using it (Doctor vs. Policy Maker) and what action they are taking.
      *   *Typical Picks:* 3C, 6C, 7C, 10C.
  6.  **The Metric Skeptic ("Artifact of Ratios")**
      *   *Stance:* The paradox is a mathematical illusion caused by using percentages rather than raw counts or differences.
      *   *Typical Picks:* 7B, 3B (sometimes), 1B (sometimes).
  7.  **The Mechanist (New) ("Need a Physical Story")**
      *   *Stance:* Numbers are meaningless without a physical or biological mechanism explaining *why* the split happens.
      *   *Typical Picks:* 2C, 4C, 5C, 9C.
  8.  **The Randomist (New) ("Trust Randomization")**
      *   *Stance:* Observational data is inherently flawed. Only randomized assignment reveals the truth.
      *   *Typical Picks:* 9B, 10B, 1C.

  ### Indistinguishable Pairs
  *Honesty check: This quiz cannot perfectly separate these pairs because their answers often overlap in practice.*

  1.  **The Causal Purist vs. The Randomist:** Both will almost always reject observational splits in favor of randomized data (Q9, Q10). Distinguishing them requires asking *why* they trust randomization (one trusts the math of balance, the other trusts the removal of human choice), which is too subtle for this format.
  2.  **The Pragmatist vs. The Contextualist:** Both will answer "It depends" on decision-based questions (Q6, Q10). The Pragmatist says "It depends on the goal," while the Contextualist says "It depends on the reality." Their vote looks the same even if their philosophy differs.

  ### Impossible Combos
  *If you selected these combinations, your reasoning is likely self-contradictory.*

  1.  **The "Always Split" Contradiction:** Choosing **The Stratifier** (Split on Zodiac, Q8A) but also **The Causal Purist** (Don't split on effects, Q4A). You cannot believe we should split on *every* variable while also believing we should *only* split on common causes.
  2.  **The "Total Truth" Contradiction:** Choosing **The Marginalist** (Trust totals, Q1A) but also **The Metric Skeptic** (Totals are ratio artifacts, Q7B). You cannot trust the total numbers while simultaneously believing the math used to create them is misleading.

  ### The "Sorting Hat" Question
  **Question 4 (The Survival Bias)** does the most heavy lifting.
  *   **Why:** It forces a choice between "Fair Comparison" (Stratifier) and "Valid Data" (Causal Purist/Randomist). A layperson almost always wants to compare survivors (4B) because it feels fair. A statistically trained person knows that conditioning on a collider (survival) creates bias (4A/4C). This single question separates the "Intuitive Splitters" from the "Causal Thinkers" more sharply than any other question in the set.

  ---
  *Note for the Class: If you scored mostly "It Depends," you aren't indecisive—you're probably a Causal Purist or Pragmatist. Simpson's Paradox isn't a math error; it's a reminder that data doesn't speak for itself without a story.*
