answer: |-
  **Essay Prompt**

  Goodman resolves the new riddle of induction by appealing to the entrenchment of predicates within linguistic practice. However, critics argue this solution conflates descriptive regularities with normative validity. Locate the precise point in Goodman's account where description threatens to collapse into prescription. Then, apply this structural critique to the following case: A machine-learning climate classifier is trained exclusively on pre-2024 temperature records to label future regimes as either "stable" or "grue-stable" (stable before 2035, chaotic thereafter). The model preferentially selects "stable." Does this preference constitute justification via entrenchment, or does it reveal entrenchment as merely trained bias? Conclude by arguing whether this analogy sharpens Goodman's paradox by exposing its circularity, or dissolves it by naturalizing induction.

  ***

  **Model Answer**

  Goodman's solution to the new riddle of induction aims to validate inductive inferences without appealing to extra-logical principles. He argues that we project predicates like "green" rather than "grue" because "green" is better entrenched in our linguistic history. The critical collapse from description to prescription occurs when Goodman defines "projectibility." He moves from the factual claim that certain predicates *are* actually projected in successful past practices to the normative claim that these predicates *ought* to be projected in future cases. Entrenchment is defined by actual usage, yet it is deployed to validate that usage. This creates a circularity: induction is justified by past inductions, without an external standard to distinguish successful entrenchment from systematic error. Goodman attempts to avoid this by appealing to the "success" of past projections, but success is only recognizable relative to the very predicates being justified.

  In the machine-learning climate case, the classifier minimizes loss functions based on pre-2024 data. Within this dataset, "stable" patterns are entrenched; "grue-stable" patterns are artificially complex and offer no predictive advantage on the training set. The model prefers "stable" not because it accesses truth, but because "stable" aligns with the statistical regularities of the training distribution. Here, entrenchment is literally bias—specifically, selection bias inherent in the training window and the inductive bias of the algorithm's architecture. The model treats the pre-2024 distribution as representative of all future data, assuming stationarity without warrant.

  If we treat the model's preference as justified solely because "stable" is entrenched in the data, we commit the same error as Goodman. We assume the future (post-2035) will resemble the past (pre-2024) without independent warrant. The ML case clarifies Goodman's ambiguity: entrenchment is a measure of fit with historical data, not a guarantee of future validity. The model's preference is pragmatic, not epistemic. It works only if the data distribution remains stationary. If a climate tipping point occurs in 2035, the "entrenched" model fails catastrophically, while a "grue-stable" model might have succeeded.

  This analogy sharpens the paradox rather than dissolving it. Goodman hoped entrenchment would dissolve the riddle by showing validity is internal to practice. However, the ML case shows that internal consistency is compatible with catastrophic failure if the underlying regime shifts. If entrenchment is merely "trained bias," it lacks normative force. It tells us what we are conditioned to expect, not what we are reasoned to believe. Therefore, the ML case exposes the normative gap: Goodman describes how we navigate induction but fails to prescribe why that navigation is reliable. The paradox remains because the distinction between valid entrenchment and entrenched error relies on the very inductive success it seeks to prove. The ML case makes this vulnerability explicit, showing that without an external anchor beyond the training set (or linguistic practice), entrenchment cannot bridge the gap between description and prescription.

  ***

  **Marking Scheme**

  **A Answer (Excellent)**
  *   **Locates the Collapse:** Precisely identifies the move from "actually projected" (descriptive) to "projectible/valid" (normative) in Goodman's definition of entrenchment.
  *   **ML Analysis:** Maps "linguistic practice" to "training data distribution" and "projection" to "loss minimization." Explicitly identifies the model's preference as "inductive bias" rather than epistemic justification.
  *   **Normative Evaluation:** Argues that because the ML model could fail post-2035 despite being "entrenched," entrenchment lacks normative force.
  *   **Verdict:** Concludes that the case **sharpens** the paradox by demonstrating that entrenchment is historical contingency, not justification.

  **B Answer (Good)**
  *   **Locates the Collapse:** Notes that Goodman relies on past usage but is vague on the specific definitional slide between description and prescription.
  *   **ML Analysis:** Correctly notes the model prefers "stable" based on pre-2024 data but treats this mostly as an analogy for "habit" rather than analyzing the structural bias.
  *   **Normative Evaluation:** States that entrenchment is circular but does not fully explain why the ML case proves it is bias rather than justification.
  *   **Verdict:** Concludes the paradox is sharpened or dissolved but lacks the specific argument linking the ML failure mode to the normative gap.

  \answer{The A answer must demonstrate that the ML case exposes entrenchment as historical contingency rather than normative justification, thereby sharpening the paradox.}
