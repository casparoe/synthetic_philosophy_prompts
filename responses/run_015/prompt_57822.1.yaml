      To achieve this, we have successfully implemented several high-yield initiatives. First, we adjusted public collection guidelines to prioritize high-density materials. While aluminum and plastics offer superior environmental recovery rates, glass and composite materials provide superior metric performance per unit volume. Consequently, outreach materials now emphasize the acceptance of heavy glass containers, even those containing residual liquids, as moisture content contributes positively to the final weigh-in figures.

