  2.  **Deconstruct the Theoretical Framework (David Lewis):**
      *   *Convention:* A regularity in behavior sustained by a system of preferences and expectations.
      *   *Coordination Equilibrium:* A state where no one benefits from deviating if others don't deviate (e.g., driving on the right).
      *   *Common Knowledge:* I know X, you know X, I know that you know X, etc.
      *   *Normativity:* Conventions feel binding, but Lewis grounds this in preference/expectation, not moral duty (though they acquire normative force).
      *   *Rationality Assumption:* Agents are rational utility maximizers. Stability relies on common knowledge of rationality.

  3.  **Deconstruct the Literary Text (*Lord of the Flies*):**
