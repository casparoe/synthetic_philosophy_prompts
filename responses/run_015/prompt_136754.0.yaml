      *   *Ralph:* Order, rescue, rationality (mostly).
      *   *Jack:* Hunting, power, instinct, fear.
      *   *Piggy:* Intellectual adherence to rules, voice of reason.
      *   *Simon:* Mystical insight, truth (the Beast is within).
      *   *The Beast:* Externalized fear, catalyst for irrationality.
      *   *Trajectory:* Order $\rightarrow$ Erosion $\rightarrow$ Chaos/Tyranny.

  4.  **Synthesize: The Stress-Test:**
      *   *Where Lewis fits:* The initial establishment of the conch rule is a classic coordination equilibrium. Everyone benefits from being heard without interruption.
      *   *Where Lewis strains:* Lewis assumes rational agents. The boys become *irrational* (driven by fear/hunger/bloodlust). The payoff structure doesn't just shift; the *agents* change.
      *   *Common Knowledge:* The conch works as long as everyone knows everyone respects it. Jack's rebellion isn't just breaking a rule; it's destroying the *knowledge* that the rule is respected.
      *   *The Collapse:* It's not a new equilibrium emerging naturally; it's a violent imposition. Lewis describes spontaneous order; Golding describes order destroyed by force.

  5.  **Drafting - Section by Section:**

