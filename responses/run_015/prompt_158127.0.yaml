answer: |-
  Extra jargon? Please. Do not insult me by suggesting I am merely dressing up Bratman's interlocking intentions in a cheaper coat. Bratman demands a cognitive architecture that simply isn't there in the rush of the moment. He wants me to intend that *we* shift, and you to intend that *we* shift, and for us to know that we both know it. That is a laboratory fantasy. It imposes a reflective overhead that dissolves the very phenomenon I am trying to capture.

  Your subway example is excellent, precisely because it strips away the油漆 cans and the ladders—the tidy, bourgeois examples of painting a house together that clutter the literature. But you have misdiagnosed the mechanics of the shift.

  You call it parallel reasoning. You say I move because I want space, and you move because you want space, and our vectors just happen to align. If that were true, the coordination would be fragile, accidental. But it isn't. Watch closely. I do not just react to the elderly person; I react to *your potential movement* as part of the solution to the problem. My body modulates its trajectory based on the affordances your body provides. If you hesitate, I compensate. If you step wide, I step narrow.

  This is not parallel reasoning; parallel reasoning is two people eating sandwiches on separate benches. This is *mutual practical entanglement*. The plural subject here isn't a pre-existing mental state we both harbor; it is an emergent property of the situation. We become a "we" not because we thought it, but because our actions are functionally coupled in a way that creates a single unit of agency relative to the problem at hand.

  You claim my view is empty if I can't distinguish this from parallel reasoning without redefining terms. I distinguish it by the *normative friction*. In parallel reasoning, if you didn't move, I would simply be annoyed at the crowd. In this entangled shift, if you didn't move—if you stood stone-still while I stepped aside—I would feel a specific violation of expectation. I would feel you failed *us*, not just that you failed to move. That normative pull exists without a single glance exchanged. It exists without a shared intention in the Bratman sense. It exists because the environment has drafted us into a temporary collective.

  So no, I am not hiding behind jargon. I am pointing out that you are looking for the collective in the wrong place. You want it in the head, safe and sound, signed and sealed before the action starts. I am telling you it is in the feet, in the space between us, formed in the doing. If that looks like emptiness to you, it is only because you refuse to let go of the idea that agency must be individual before it can be joint.
