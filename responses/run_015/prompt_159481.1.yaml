      *   *Verdict:* It's a popular "dissolution" strategy, but it faces the objection that credence is supposed to guide action/belief in a unified way. If I believe $P(H)=1/2$ but act as if $P(H)=1/3$, there's a tension.

  3.  **Evaluate the Friend's View (The Betting Argument):**
