              *   Expected Value (Halfer $x=0.5$): $0.5(1-0.5) + 0.5(-1) = 0.25 - 0.5 = -0.25$. (Loss).
              *   Expected Value (Thirder $x=1/3$): $0.5(1-1/3) + 0.5(-2/3) = 0.5(2/3) - 1/3 = 1/3 - 1/3 = 0$. (Break-even).
