      *   *Weaknesses:* Halfers have counter-arguments.
          *   *Ex Ante vs. Ex Post:* Before the experiment, Beauty knows she should accept the bet. But upon waking, does her *credence* change, or just her decision policy?
          *   *Utility Functions:* If utility is summed over awakenings, $1/3$ works. If utility is summed over experiments (or if she cares only about the coin outcome regardless of awakenings), $1/2$ might work.
          *   *The "Double Counting" Objection:* Tails gets counted twice because there are two opportunities to bet. Does this reflect probability or just sampling frequency?
