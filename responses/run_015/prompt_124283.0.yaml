answer: |-
  Your hypothesis is astute and aligns with the most rigorous modern reconstructions of the debate. The persistence of the stalemate is not merely due to ideological entrenchment but stems from a category error: the participants are often describing different economic phenomena using the same terminology.

  Here is a diagnosis of the structure of the disagreement, analyzing where the arguments engage, where they diverge, and what would constitute genuine progress.

  ### 1. The Verbal and Conceptual Divergence
  A significant portion of the stalemate is verbal, rooted in incompatible definitions of core terms.

  *   **"Calculation":** For Mises, calculation is an *entrepreneurial act* of comparing input costs to anticipated future revenues to determine profit or loss. It is inherently forward-looking and speculative. For Lange, calculation is a *mathematical operation* of solving simultaneous equations to equate marginal cost and price. It is backward-looking or static.
  *   **"Price":** For the Austrians, a price is a summary of decentralized expectations and property rights; it cannot exist without the transfer of title (ownership). For Lange, a price is a *parameter*—a number assigned by a central board to guide behavior.
  *   **"Market":** Mises/Hayek view the market as a *process* of rivalrous competition. Lange views the market as a *state* of equilibrium (or a mechanism to reach it).

  **Diagnosis:** When Mises says socialism cannot calculate, he means it cannot assess *profit and loss on capital goods* to determine which production methods are viable. When Lange says socialism can calculate, he means it can solve for *allocative efficiency* given a set of constraints. They are not contradicting each other; they are answering different questions. Mises is asking, "How do we know what to produce?" Lange is asking, "How do we produce efficiently once we know what to produce?"

  ### 2. The Ontological Mismatch: Allocation vs. Discovery
  This is the deeper layer you identified. The disagreement rests on opposing ontologies of economic knowledge.

  *   **The Neoclassical/Lange View (Allocation):** Economic data (preferences, technological possibilities) exist objectively, even if dispersed. The economic problem is one of *optimization*: how to allocate resources to match these pre-existing data points. If a central board can access the data (or simulate the access via trial and error), the problem is solvable.
  *   **The Austrian/Hayek View (Discovery):** Economic data do not exist independently of the market process. Preferences are revealed, not stated; technologies are discovered, not given. The economic problem is one of *coordination under ignorance*. Prices do not just compress existing information; they incentivize the *creation* of new information through entrepreneurship.

  **Diagnosis:** This is not merely a verbal dispute; it is a substantive disagreement about the nature of reality. If the economy is a machine (Lange), it can be modeled and controlled. If the economy is an ecosystem (Hayek), it can only be cultivated. Because this is an ontological claim, it is difficult to settle empirically. You cannot run an experiment to prove whether knowledge is "given" or "created" without already assuming a framework to interpret the results.

  ### 3. The Empirical Core: Incentives and Property
  Where the arguments genuinely engage is on the institutional mechanics of incentives. This is the only layer potentially settleable by design.

  *   **The Principal-Agent Problem:** Lange argues that managers can be instructed to follow rules (minimize cost, set price = marginal cost). Mises and Hayek argue that without residual claimancy (ownership of profit/loss), managers lack the *incentive* to follow those rules diligently or to seek out better rules.
  *   **Risk Bearing:** In Mises's view, rational calculation requires that the calculator bears the risk of error. In Lange's model, the central board bears the risk, but the individual manager does not.

  **Diagnosis:** This is a substantive empirical dispute. It asks: *Can rule-following behavior replicate risk-bearing behavior?* Modern mechanism design theory (e.g., Hurwicz, Maskin) has largely validated the Austrian intuition here: without aligning incentives (property rights), information revelation is costly or impossible. However, this does not fully resolve the debate, because a Langean could argue that improved monitoring technology (the "modern computing" argument) reduces the agency cost enough to make simulation viable.

  ### 4. The Hidden Normative Disagreement
  You asked if there is a masked normative disagreement. The answer is yes.

  *   **Distributed vs. Centralized Agency:** The technical argument about "feasibility" masks a political argument about *who gets to decide*.
      *   **Hayek/Mises:** Entrepreneurial initiative *ought* to be distributed because centralized power is prone to error and tyranny, and because human liberty requires the freedom to err with one's own property.
      *   **Lange:** Entrepreneurial initiative *ought* to be socially guided because private ownership leads to inequality and instability, and the "rules of the market" can be democratically determined.

  **Diagnosis:** The technical debate about "calculation" serves as a proxy for the normative debate about "control." If calculation is technically impossible without private property (Mises), then socialism is not just undesirable, but *impossible*. This moves the argument from the political realm (what we should want) to the technical realm (what we can have). Lange's counter-attack attempts to move it back to the political realm by arguing that since it is technically possible, we are free to choose socialism based on ethical grounds.

  ### Assessment of Progress

  Given this diagnosis, what would count as progress?

  **1. Conceptual Distinction (High Value):**
  Progress requires explicitly separating **Static Allocative Efficiency** from **Dynamic Entrepreneurial Discovery**.
  *   *Concession to Lange:* In a static world with known technologies, a central board *could* theoretically simulate prices to achieve Pareto efficiency.
  *   *Concession to Hayek:* In a dynamic world characterized by uncertainty and innovation, only a system of private property and rivalrous competition can generate the knowledge necessary for growth.
  *   *Progress:* Acknowledging that "The Economic Problem" is not singular. We need markets for discovery and perhaps planning (or regulation) for specific allocation problems (e.g., public goods, externalities). The debate stalls because both sides try to claim their mechanism solves *all* economic problems.

  **2. Institutional Experiment (Low Value):**
  A specific institutional experiment is unlikely to dissolve the disagreement because institutions are not isolatable variables.
  *   Historical "market socialism" (e.g., Yugoslavia, Hungary) failed, but Austrians attribute this to the lack of genuine capital markets, while Market Socialists attribute it to political interference or lack of computing power.
  *   Because the "dynamic discovery" claim is counterfactual (it relies on opportunities that *were not taken*), it is hard to prove via historical data. You cannot measure the innovations that never happened due to suppressed entrepreneurship.

  **3. Epistemological Clarity (Highest Value):**
  The disagreement is ultimately rooted in bedrock intuitions about the nature of knowledge.
  *   **Objectivism vs. Subjectivism:** Is knowledge objective (waiting to be collected) or subjective (created through action)?
  *   **Progress:** Progress would come from recognizing that the Calculation Debate is actually a branch of epistemology. If one accepts the Hayekian view that knowledge is subjective and dispersed, the Langean model collapses not because of computing limits, but because there is no "data" to process. If one accepts the Neoclassical view that knowledge is objective, the Austrian view looks like mysticism.

  ### Conclusion

  The stalemate persists because the debate is **overdetermined**. It is simultaneously a verbal mismatch (definition of calculation), an ontological clash (static vs. dynamic), an empirical dispute (incentive compatibility), and a normative conflict (distribution of power).

  To move forward, one must abandon the hope of a "knockout blow." The most productive path is to accept your hypothesis: **They are describing different tasks.**
  *   Lange describes the **engineering task** of optimizing a known system.
  *   Hayek describes the **evolutionary task** of navigating an unknown environment.

  Progress lies in specifying *which* task is dominant in a given context. For routine allocation of known goods, Lange's logic holds some water. For innovation, capital formation, and complex coordination, Hayek's logic is superior. Recognizing that the economy requires *both* equilibrium tendencies and disequilibrium discoveries—handled by different institutional tools—would dissolve the false dichotomy that has fueled the debate for a century. The disagreement is not about which side is "right" about the economy, but about which aspect of the economy they prioritize.
