answer: |-
  ### Unstructured Setup

  **Distinctions that carry weight:**
  1.  **Type vs. Token:** We are not asking if two physical objects are identical (tokens); we are asking if they instantiate the same abstract functional type ("the Work"). This allows for multiple realizability (different hardware) without losing identity.
  2.  **Causal Role vs. Causal Filler:** Functionalism defines states by what they *do* (role), not what they are *made of* (filler). For software, the "role" is the logic; the "filler" is the voltage or pixel. We must preserve the role.
  3.  **Counterfactual Robustness:** A system doesn't just have states; it has dispositions. If input *X* had occurred, state *Y* would have followed. This is the key to distinguishing a recording (playback) from a program (computation).
  4.  **Level of Abstraction (LoA):** Functional identity is relative to a description grain. A transistor is not a logic gate, but a logic gate is made of transistors. We must fix the LoA to avoid the "coarse grain yes / fine grain no" oscillation.

  **Distinctions I am setting aside:**
  1.  **Qualia/Consciousness:** Software does not feel pain. We do not need to account for subjective experience, only observable and logical behavior.
  2.  **Intentionality (Semantics):** We do not need to decide if the software "understands" its data, only if it processes it according to the original rules.
  3.  **Temporal Continuity:** Unlike a human mind, software can be turned off and restarted without breaking identity. We do not need a theory of continuous existence.

  **Where the analogy breaks:**
  1.  **Degradation:** Minds degrade via entropy/disease; software degrades via bit-rot or obsolescence. The "same work" criteria must allow for error correction that a mind would not.
  2.  **Legal/Social Construction:** "Work" in an archive is partly a legal category (copyright) and partly a cultural one. A purely metaphysical test might conflict with statutory definitions. The procedure must acknowledge where it defers to law.
  3.  **The Triviality Problem:** In philosophy of mind, a rock can be mapped to a program if you choose the mapping arbitrarily. In software engineering, we have a constraint the mind lacks: *engineering intent*. We can use the provenance of the build to rule out arbitrary mappings.

  ---

  ### The Deliverable: The Functional Identity Procedure (FIP)

  **Purpose:** To determine if Candidate Artifact B preserves the identity of Source Work A.
  **Constraints:** Must be executable by staff with CS backgrounds; must handle missing code/hardware; must conclude within two weeks.
  **Sign-off:** Curator (Cultural), Engineer (Technical), Rights Officer (Legal).

  #### Part 1: The Decision Procedure

  **Stage 1: The Provenance Check (Lineage)**
  *   **Question:** Is there a documented historical chain of custody or development linking B to A?
  *   **Sufficient Answer:** Yes, if build logs, commit histories, or migration records show B was derived from A or its direct ancestors.
  *   **Stop Condition (NO):** If B was created without access to A's code, specs, or binary (i.e., independent creation), stop. **Verdict: New Work.** (Exception: Clean-room reimplementation moves to Stage 2).
  *   **Judgment Call:** If documentation is sparse, the Curator decides if the historical narrative is strong enough to proceed.

  **Stage 2: The Level of Abstraction (LoA) Lock**
  *   **Question:** At what grain are we comparing states?
  *   **Sufficient Answer:** The LoA is set to the *finest common denominator* of surviving documentation. If A's source code exists, LoA = Source Logic. If only a manual exists, LoA = User-Visible Behavior.
  *   **Rule:** You cannot claim identity at a grain finer than what is documented for A. If A is a black box, B cannot be judged on its internal code, only its I/O.
  *   **Stop Condition:** If no documentation exists for A (no binary, no manual, no specs), stop. **Verdict: Unverifiable (Treat as New Work for cataloging).**

  **Stage 3: The Causal Coherence Test (Fixing the Mapping Problem)**
  *   **Question:** Does the mapping between A's states and B's states rely on arbitrary look-up tables, or does it reflect causal structure?
  *   **Sufficient Answer:** The mapping must be *structurally isomorphic*. If A transitions from State 1 to State 2 because of Logic L, B must transition from State 1* to State 2* because of Logic L*.
  *   **Operational Test:** An engineer must be able to trace the data flow in B that corresponds to the data flow in A without using a "translation layer" that hides the logic (e.g., a massive switch-case statement that hardcodes outputs rather than computing them).
  *   **Stop Condition (NO):** If B achieves A's output by hardcoding responses rather than computing them (e.g., a video recording of gameplay vs. an engine), stop. **Verdict: Derivative/Recording.**
  *   **Judgment Call:** The Engineer decides if an optimization (e.g., caching) violates causal coherence or is merely a performance enhancement.

  **Stage 4: The Counterfactual Robustness Test**
  *   **Question:** Does B handle inputs that were *possible* but *never occurred* in the test corpus?
  *   **Sufficient Answer:** B must react to edge-case inputs in a way consistent with A's logic (or A's specification if A is unavailable).
  *   **Operational Test:** Select 10 inputs outside the normal operating envelope (e.g., buffer overflows, unusual controller combinations). If A is gone, use the Specification from Stage 2 as the oracle.
  *   **Stop Condition (NO):** If B fails or behaves randomly on edge cases where A's logic dictates a specific response, stop. **Verdict: Surrogate/Simulation.**
  *   **Judgment Call:** If A's behavior on these inputs is unknown (undocumented), the Curator decides if B's behavior is "faithful enough" to the *spirit* of the work.

  **Stage 5: The Drift Budget (Transitivity Check)**
  *   **Question:** For chains (A->B->C...), has the cumulative deviation exceeded the tolerance?
  *   **Sufficient Answer:** Each link in the chain must have passed Stages 1-4. Additionally, the total semantic drift from Start to End must be < 15% (measured by feature loss or behavior change).
  *   **Stop Condition (NO):** If the chain has > 5 links or the End artifact lacks > 15% of the Start artifact's documented features, stop. **Verdict: New Version.**
  *   **Judgment Call:** The Committee decides if the lost features are "core" to the work.

  **Stage 6: The Rights & Intent Handoff**
  *   **Question:** Does the technical identity align with legal and cultural constraints?
  *   **Action:** If Stages 1-5 pass, the file goes to the Committee.
  *   **Judgment Call:** The Rights Officer determines if legal definitions of "derivative" override the technical "same work" finding. The Curator determines if the "experience" has shifted enough to warrant a new catalog entry despite technical identity.
  *   **Final Output:** Same Work / New Version / Surrogate.

  ---

  #### Part 2: Operational Fixes for the Five Failures

  **1. Behavior vs. Internal Organization (The Surrogate Problem)**
  *   **Fix:** Stage 3 (Causal Coherence). A neural net surrogate passes I/O (Stage 4) but fails Causal Coherence. It maps inputs to outputs via weights, not via the original program states.
  *   **Implementation:** Require a "State Trace." If the original had a variable `player_health`, the candidate must have a memory location or register that functionally acts as `player_health`. If the candidate uses a latent vector that cannot be decoded into that specific state, it is a *simulation*, not the *work*.

  **2. The Gerrymandered Mapping (Triviality)**
  *   **Fix:** Refine your "competent engineer" rule. The mapping cannot be *post-hoc*.
  *   **Implementation:** The "Causal Coherence Test" requires that the mapping be *recoverable from the system architecture*. You cannot map a rock to a program because the rock's state transitions are not causally linked to the program's logic. In software, if the mapping requires a lookup table larger than the program itself, it is gerrymandered. The mapping must be *compressible*.

  **3. Grain of Description**
  *   **Fix:** Stage 2 (LoA Lock).
  *   **Implementation:** The "Official Grain" is the *Finest Documented Grain*. If you only have a manual, you cannot claim identity based on memory addresses. If you have source code, you can. This prevents moving the goalposts. If the documentation is lost, you default to User-Visible Behavior (Coarse Grain).

  **4. Transitivity in Chains**
  *   **Fix:** Stage 5 (Drift Budget).
  *   **Implementation:** Identity is not infinitely transitive in preservation. We treat it as a "Telephone Game." If A->B is 95% identical, and B->C is 95% identical, A->C is 90%. We set a cutoff (e.g., 85%). If the chain drops below this, the link is broken. This prevents the 1993 original from being "the same" as a 2020 rewrite that shares nothing but the title.

  **5. Non-Discrete States (Analog/Quantum)**
  *   **Fix:** Signal Continuity substitution.
  *   **Implementation:** For analog/neuromorphic systems, replace "State Identity" with "Signal Topology." Does the voltage curve in B correlate to the voltage curve in A within a 5% tolerance? If the system is continuous, we test for *functional continuity* (does the output change smoothly as input changes?) rather than discrete state transitions.

  ---

  #### Part 3: Honesty About the Translation

  **What survives translation:**
  *   **Multiple Realizability:** We keep the core idea that hardware doesn't matter. A game on a cartridge and a game on an emulator can be the same work.
  *   **Causal Role:** We keep the idea that *what the system does* matters more than *what it is*.

  **What is dropped:**
  *   **Strict Isomorphism:** Philosophy often demands a 1-to-1 mapping of states. We allow for *optimizations* (e.g., compiling code changes states, but preserves logic). We accept "functional equivalence" rather than "structural identity" where documentation allows.
  *   **The "Hard" Problem:** We ignore whether the software "really" computes. If it passes the tests, it counts.

  **Where the simplified version diverges from theory:**
  *   **The "No" on Surrogates:** A strict functionalist might argue that if the I/O is identical, the work is preserved. My procedure says "No" because archives preserve *logic*, not just *output*. This is a pragmatic deviation: we owe the future the *ability to modify and study* the work, not just watch it. A neural net is a black box; the original is a white box.
  *   **Legal Override:** Metaphysics doesn't care about copyright. This procedure explicitly allows the Rights Officer to veto a metaphysical "Same Work" finding if the law defines it as a "Derivative."

  ---

  #### Part 4: Running the Procedure on Four Cases

  **Case (a): Virtual-Machine Emulation of Original Binary**
  *   **Stage 1 (Provenance):** Pass. Binary is identical; VM is a known container.
  *   **Stage 2 (LoA):** Lock at Instruction Set Level.
  *   **Stage 3 (Causal Coherence):** Pass. The VM translates instructions causally, not via lookup table. The logic flow is preserved.
  *   **Stage 4 (Counterfactuals):** Pass. VM handles interrupts/edges as the original CPU would.
  *   **Stage 5 (Drift):** N/A (Direct execution).
  *   **Verdict:** **Same Work.**
  *   **Reasoning:** The instruction stream is the work's "DNA." The hardware is irrelevant filler.

  **Case (b): Clean-Reimplementation from Spec (Source Lost)**
  *   **Stage 1 (Provenance):** Pass (Derived from Spec of A).
  *   **Stage 2 (LoA):** Lock at Specification Level (Source unavailable).
  *   **Stage 3 (Causal Coherence):** **Fail.** The internal states are new. The code is new. While it mimics the spec, the causal machinery is different.
  *   **Stage 4 (Counterfactuals):** **Fail.** Prompt states it diverges on undocumented behaviors. Since the Spec is silent, B's behavior is a *guess*, not a preservation of A's logic.
  *   **Verdict:** **New Work (Derivative).**
  *   **Reasoning:** This is the unwelcome answer. Even if it *feels* the same, it is a reconstruction, not a preservation. It captures the *design*, not the *artifact*. Legally, this is likely a derivative work requiring new rights clearance.

  **Case (c): The Learned Surrogate (Neural Net)**
  *   **Stage 1 (Provenance):** Pass (Trained on A).
  *   **Stage 2 (LoA):** Lock at User-Visible Behavior (Internal states of NN are unintelligible).
  *   **Stage 3 (Causal Coherence):** **Fail.** The NN has no states corresponding to the original program states. It uses statistical correlation, not logic.
  *   **Stage 4 (Counterfactuals):** **Fail.** NNs hallucinate on out-of-distribution inputs. They cannot guarantee fidelity to the original logic on untested cases.
  *   **Verdict:** **Surrogate (New Work).**
  *   **Defense of the "No":** You argued that this is the only way anyone will experience the work. That is a *access* argument, not an *identity* argument. We can grant access to a Surrogate without lying and calling it the Original. If we label it "Same Work," we lose the ability to study the original logic, and we risk legal liability if the surrogate behaves differently in a way that infringes rights (e.g., generates defamatory content the original never could). Call it what it is: a high-fidelity simulation.

  **Case (d): The 1993-to-2020 Chain**
  *   **Stage 1 (Provenance):** Pass (Each link accepted).
  *   **Stage 2 (LoA):** Lock at Coarse Grain (User Behavior), as 1993 source is lost.
  *   **Stage 3 (Causal Coherence):** Mixed. 1993->2001 (Port) is likely coherent. 2011 (Rewrite) is suspect. 2020 (Rebuild) is suspect.
  *   **Stage 5 (Drift Budget):** **Check Required.** If 1993 and 2020 share *no* code and *no* documented states, the drift is likely >15%.
  *   **Verdict:** **Conditional Same Work.**
  *   **Condition:** Only if the Committee certifies that the *core features* (the "essence" of the work) remain intact. If the 2020 version plays differently enough to change the skill required or the aesthetic experience, the chain is broken.
  *   **Reasoning:** Transitivity holds only if the *type* is preserved. If the 2020 version is effectively a "Remake" rather than a "Port," it is a new work inspired by the old one.

  ---

  #### Part 5: What the Procedure Cannot Do

  **1. It cannot solve the "Ship of Theseus" for culture.**
  If a game is patched so often that the mechanics change entirely (e.g., a live-service game), this procedure will eventually flag it as a New Work. It cannot tell you *when* the culture stopped viewing it as the same game. That is a sociological question, not a technical one.

  **2. It cannot override Copyright Law.**
  The procedure might determine two artifacts are metaphysically the "Same Work." The law might determine that the second is a "Derivative" requiring a new license. The procedure explicitly hands this to the Rights Officer in Stage 6. Do not use this procedure to argue legal status in court; use it to argue archival status.

  **3. It cannot preserve "Vibe" or "Context."**
  Running a 1993 game on a 4K monitor with 60FPS (upscaled) might pass the Functional Identity test, but it may fail the *experiential* test. The procedure treats "Work" as a logical object. It does not account for the fact that the lag of the original hardware might be part of the artistic intent.

  **4. The Point of Surrender.**
  There is a point where you must stop asking "What is this?" and start asking "What do we owe the public?"
  If the Surrogate (Case C) is the *only* way to experience a lost work, your duty to the public overrides the metaphysical distinction.
  **The Rule:** If the verdict is "Surrogate" but the Original is inaccessible, you catalog it as "Surrogate for [Original Work]" and grant access. You do not lie and call it the Original, but you do not lock it away.
  **The Limit:** This procedure identifies truth. It does not mandate policy. You may decide to exhibit a lie if it serves the public good, but you must know it is a lie. This procedure ensures you know.
