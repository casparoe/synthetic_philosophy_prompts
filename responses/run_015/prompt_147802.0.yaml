  Your package is inconsistent because unrestricted Reflection is mathematically incompatible with Thirdism in the Sleeping Beauty case.

  The clash between (1) and (2) is the most severe conflict and constitutes a logical contradiction. If Sunday Beauty is certain she will assign 1/3 upon waking, Reflection dictates her Sunday credence in Heads must be 1/3. Thirdism dictates it must be 1/2. You cannot maintain both. Since (1) explicitly extends to self-locating propositions, you cannot evade this by restricting Reflection's scope to external facts. The expert-deference justification in (1) fails here because the future self's evidence partition is not a refinement of the current self's; the shift involves indexical uncertainty that violates the conditions required for Reflection to hold.

  Conflicts involving (3) and (5) are apparent rather than fatal. Your worry in (5) dissolves upon precision: Reflection requires your current credence to equal the *expectation* of your future credence, not necessarily one of the specific future values. If you know your credence will be 0.8 or 0.15, Reflection demands your current credence be the probability-weighted average, not 0.8 or 0.15 themselves. Similarly, (1) and (3) are compatible if (1) is understood as conditional on the future self possessing strictly more evidence; (3) merely specifies when this condition fails, suspending the requirement.

  The single cheapest revision is to qualify (1). You must reject Reflection for cases involving self-locating information gain or loss, effectively conceding that future selves are not always experts about indexicals. This aligns (1) with (3) and preserves (2). The cost is significant: you lose the elegant universality of the deference norm and must accept that diachronic rationality fragments into distinct rules for propositional versus self-locating content.

  Finally, (4) is tenable but offers no rescue here. Accuracy-based arguments for Reflection typically presuppose factive evidence or standard conditioning, which Sleeping Beauty violates. Switching justification styles from Dutch books to accuracy does not mend the logical contradiction between the credence values themselves. You must fix the norms before justifying them.
