      *   *The "Is":* In Classical Chinese, there is no copula "to be." "White horse not horse" (Bai ma fei ma) uses *fei* (not/is not). *Fei* can mean "is not identical to," "is not a member of," or "does not satisfy the description of."
      *   *The Logic:*
          *   "Horse" names the shape/form.
          *   "White" names the color.
          *   "White Horse" names shape + color.
          *   Therefore, the concept "White Horse" $\neq$ the concept "Horse".
          *   If you ask for a "horse," a yellow or black one works. If you ask for a "white horse," they don't.
          *   Therefore, the requirements are different. Therefore, "White Horse" is not "Horse".
      *   *The "Separation" (Li):* This is crucial. Gongsun Long is a "Separatist" (School of Names). He believes concepts (universals) exist independently of particulars. "Whiteness" is separate from "Horseness."

