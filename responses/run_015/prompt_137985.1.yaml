  Here's my opening, which is the bit my editor says I havent earned yet. Imagine a lab has a cheap device — call it the multiplier. It costs essentially nothing to run, it doesn't disturb the quantum state at the moment of decision, but on whichever outcome occurs it immediately triggers a long cascade of further measurements, so that branch ends up spawning roughly a thousand times as many distinct decohered descendants over the next second as it otherwise would have. Now an experimenter faces a measurement whose two outcomes have amplitude-squared weights 0.99 and 0.01. Without the multiplier, everyone bets on the 0.99 outcome. But she can press a button that arms the multiplier on the 0.01 branch only. Once the button is pressed, virtually every descendant of hers who will be around to remember having made the bet is one who saw the 0.01 outcome. If your account of quantum probability is that it's about what you rationally expect, and what you rationally expect is what your future selves will mostly see, then the button flips the rational bet — and the Born rule was never doing any work, counting always was. And if you say instead that the button is irrelevant, which I think is what you want to say, then you owe me an account of what it is about the 0.01 branch that still makes it rational to disregard it, given that you've refused to say there is less of it or that it is less real. So: what does the experimenter expect the night before, with and without the button, and why?
