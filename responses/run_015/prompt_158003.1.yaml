      *   Real people = Concrete individuals responsible for their words/actions.
      *   The Public = A phantom where responsibility is diluted. Everyone is responsible, so no one is responsible.
      *   Leveling: The press levels distinctions, making all opinions equal weightless chatter.
      *   The Distinction required: Numerical Multiplicity (a crowd, still individuals) vs. Qualitative Nullity (the abstract public).
      *   Application to Elena: She refused metrics/algorithms because they cater to the "Public" (the nullity), not the reader (the individual). She wrote for *someone*, not *everyone*.

  3.  **Drafting Strategy - Structure:**
