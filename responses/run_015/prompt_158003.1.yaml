      *   *Elena's Work:* She refused algorithms. Why? Because algorithms optimize for the Ghost, not the Person.
      *   *Address to Family:* "To Elena's family..." Explain that when she wrote, she imagined a specific reader, not a demographic. This is why she didn't chase clicks. She wanted responsibility.
      *   *The Toast:* To the concrete individual. To Elena.

  5.  **Refining the Tone:**
      *   Must not sound like a lecture. Needs warmth.
      *   Must satisfy the philosophers (accurate use of *Two Ages* concepts) without alienating the family.
      *   *Self-Correction on "Community":* Instead of "building community," speak of "forging connections between specific individuals" or "maintaining the integrity of the address."
      *   *Self-Correction on "Public":* Ensure I don't accidentally use "public" positively. Use "readership," "audience" (carefully), or "individuals."

  6.  **Timing Check:**
      *   Average speaking rate: 130-150 words per minute.
