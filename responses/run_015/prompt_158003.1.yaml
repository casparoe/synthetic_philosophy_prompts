      *   **Constraints/Obligations (Kierkegaardian Analysis of "The Public"):**
          *   NO praising "giving the public what it wants."
          *   NO invoking "the voice of the people" as authority.
          *   NO celebrating legacy as "building a community" in the abstract/collective sense (this activates the phantom of "the public").
