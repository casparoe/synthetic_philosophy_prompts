      *   **Problems to Solve:**
          1.  *Class Definition:* Mechanism-based (causal) vs. Label/Type-based (descriptive).
          2.  *Survivorship Bias:* Classes drawn from currently existing entities inflate survival rates compared to birth cohorts.
      *   **Required Procedure Elements:**
          1.  Fix persistence criterion (what counts as "same entity").
          2.  Membership rule (properties knowable *now*, no outcome leakage).
          3.  Decision on "failed attempts" (unconsolidated states/unions) in the denominator.
          4.  Correction for "living only" classes (survivorship bias).
          5.  Declaration of hazard shape (increasing, flat, decreasing) + default.
          6.  Rule for conflicting classes (averaging?).
          7.  Rule for revising forecasts when an entity survives another year.
          8.  Closing register of key findings/risks (for reviewer).
          9.  *Crucial:* Mark points where decisions are values (not facts) and specify which require Director sign-off.
      *   **Application:** Apply to three specific cases:
          1.  30-year-old continental union (27 members, exit clause, unanimity).
          2.  240-year-old federal republic (no secession, civil war 160 yrs ago, economic divergence). *Constraint:* One of these must result in a wide/useless band, and the procedure must show this honestly.
          3.  Donor request: "Security order" (pattern of alignment, no charter). *Constraint:* If the output is a refusal, show how the procedure gets there and what minimal redefinition works.
      *   **Closing:** Limitations of the procedure (what it can't fix, where judgment masquerades as method, where error still happens).
      *   **Style:** Procedural, actionable, audit-ready. No citations/references.

  2.  **Drafting the Procedure (The "Protocol"):**

      *   *Goal:* Needs to be tight enough for a 1-day workflow but robust enough to handle the disagreements.
      *   *Structure:* Step-by-step.
      *   *Addressing Disagreement 1 (Class Definition):* I need a hybrid approach or a hierarchy. Mechanism is better for prediction, but Label is easier to audit. Let's make "Functional Mechanism" the primary, but require a "Descriptive Label" backup. If they diverge significantly, that triggers a specific rule (Conflicting Classes).
      *   *Addressing Disagreement 2 (Survivorship Bias):* This is the "Immortality Bias." The procedure needs a specific correction factor or a requirement to look at *birth cohorts* rather than *current populations*. Since data is limited (1 day), we need a heuristic. Let's require analysts to estimate the "attrition rate" of the class during its first 25 years historically, not just look at who is left now.
      *   *Persistence Criterion:* Must be Step 1.
      *   *Membership Rule:* Must exclude outcome knowledge.
      *   *Failed Attempts:* Need a rule. Usually, "proclaimed but not administered" should count as failures in the reference class to avoid inflation.
      *   *Hazard Shape:* Default to flat (constant hazard) unless evidence suggests otherwise (e.g., "liability of newness" or "senescence").
      *   *Conflicting Classes:* Do not average blindly. Use the more restrictive class or widen the interval.
      *   *Revision:* Bayesian update. If it survives, the hazard rate might change, or the remaining horizon shortens.
      *   *Sign-off:* Director needs to sign off on Value Judgments (Persistence, Class Definition boundaries, Hazard Shape overrides).

      *Refining the Steps:*
      1.  **Define Persistence:** What breaks the entity? (Director Sign-off).
      2.  **Define Reference Class:** Mechanism + Label. (Director Sign-off on Mechanism).
      3.  **Populate Class:** Include failed starts? (Rule: Yes, if they reached threshold X).
      4.  **Calculate Base Rate:** Adjust for survivorship bias.
      5.  **Determine Hazard Shape:** Default vs. Override. (Director Sign-off on Override).
      6.  **Resolve Conflicts:** If two classes exist.
      7.  **Final Probability & Interval:** Wide bands if uncertainty is high.
      8.  **Risk Register:** Top 2-3 drivers.
      9.  **Revision Rule:** How to update next year.

  3.  **Drafting the Applications:**

      *   *Case 1: Continental Union (EU-like).*
