      *   *Check:* Is the "Refusal" requirement met? Yes, for the Security Order.
      *   *Check:* Tone? Professional, directive, procedural.
      *   *Check:* No citations? Ensure no names of theories (e.g., don't say "Kaplan-Meier," just describe the math).

      *Refining the "Survivorship Bias" Step:* The prompt says "a class assembled from currently surviving members is not the same population as a cohort followed from its founding." The procedure needs to force the analyst to look at *historical cohorts* of similar entities founded at similar times, not just who is alive now. If that data isn't available, a penalty must be applied to the survival rate.
      *Refining the "Class Definition" Disagreement:* I will mandate a "Dual-Key" system. You must propose a Mechanism Class AND a Label Class. If they agree, proceed. If they disagree, the probability interval widens, and the Director chooses the primary for the point estimate.

      *Refining the "Wide Band" for the Republic:* To make it honest, the procedure must dictate that if the Reference Class N < 5, the interval must span at least 0-100% or be declared "Indeterminate." Let's go with a very wide interval (e.g., 20-90%) to reflect the uncertainty of "exceptional" cases.

      *Refining the "Refusal" for Security Order:* The persistence criterion step will fail. You can't define "death" for a "pattern of alignment." The procedure should catch this at Step 1.

  6.  **Final Polish:** Check against the "one-page rationale" constraint. The procedure steps need to map to sections of that page. Ensure the "Director Sign-off" points are clearly highlighted.

