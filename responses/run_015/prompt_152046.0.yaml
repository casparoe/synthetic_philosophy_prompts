      *   *Case 2: Federal Republic (US-like).*
          *   Persistence: Constitutional continuity?
          *   Class: Federal republics >200 years old.
          *   Bias: Very few exist. Survivorship bias is huge.
          *   Constraint: One of these must yield a "wide/useless band." The 240-year-old republic is a better candidate for this because "old democracies" are a tiny reference class with high variance in outcomes historically (regime change vs. continuity). The Union is also fragile, but the Republic's age makes the reference class tiny. Let's make the Republic the one with the wide band due to class scarcity.
      *   *Case 3: Security Order (Abstract).*
          *   Problem: No charter/membership. Cannot define "death."
          *   Outcome: Refusal.
          *   Redefinition: Forecast specific alliances or conflict onset rates instead.

  4.  **Drafting the Limitations:**

      *   Black swans.
      *   Data quality.
      *   Judgment disguised as rules (e.g., defining "mechanism").
      *   The "One Page" constraint forcing oversimplification.

  5.  **Review and Refine (Self-Correction):**

      *   *Check:* Did I mark Director Sign-offs? Yes.
      *   *Check:* Is the survivorship bias correction actionable in one day? It needs to be a heuristic, not a full statistical model. I'll prescribe a "Cohort Discount."
      *   *Check:* Did I address the "Failed Attempts" denominator? Yes, explicit rule.
