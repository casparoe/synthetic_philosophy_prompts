answer: |-
  # STANDARD OPERATING PROCEDURE: POLITICAL ENTITY SURVIVAL FORECAST (PESF-25)

  **Purpose:** To generate auditable, outside-view survival probabilities for political entities over a 25-year horizon.
  **Constraint:** One analyst-day per item. One-page written rationale.
  **Authority:** Analysts execute Steps 1–7. Director reviews Step 8 and signs off on all **[VALUE JUDGMENT]** markers.

  ---

  ## PART I: THE PROCEDURE

  ### Step 1: Fix the Persistence Criterion
  **Action:** Define what constitutes the "death" of the entity. Choose one primary criterion: (A) Constitutional/Legal Continuity, (B) Regime/Ruling Coalition Continuity, (C) Territorial Integrity (e.g., >80% core land), or (D) Functional Capacity (e.g., ability to levy tax/monopoly on force).
  **Sufficient Answer:** A single, binary test (e.g., "Entity ends if the founding treaty is formally dissolved").
  **Failure:** Vague language (e.g., "significant decline," "loss of prestige").
  **Rationale Text:** "Persistence defined as [Criterion]. Death event = [Specific Trigger]."
  **[VALUE JUDGMENT] [DIRECTOR SIGN-OFF REQUIRED]:** The choice of criterion determines the forecast's utility. The Director must approve the criterion before calculation begins.

  ### Step 2: Define Reference Class Membership
  **Action:** Identify the class using **both** a Descriptive Label (e.g., "Federation") and a Functional Mechanism (e.g., "Polities with unilateral exit clauses").
  **Rule:** Membership is determined *only* by properties knowable on the forecast date (T=0). Do not exclude historical entities because they failed; do not include current entities because they survived.
  **Sufficient Answer:** A list of inclusion criteria that does not reference the entity's current age or survival status.
  **Failure:** Criteria that rely on outcome knowledge (e.g., "Successful federations," "Stable unions").
  **Rationale Text:** "Reference Class: [Label] + [Mechanism]. Inclusion criteria: [List]."
  **[VALUE JUDGMENT] [DIRECTOR SIGN-OFF REQUIRED]:** If the Label Class and Mechanism Class diverge significantly in composition, the Director selects which governs the base rate.

  ### Step 3: Populate the Denominator (Failed Attempts)
  **Action:** Decide whether to include "failed starts" (entities proclaimed but never consolidated) in the reference class count.
  **Rule:** Include failed starts if they exercised *at least one* sovereign function (levied tax, raised troops, signed treaty) for >6 months. Exclude purely paper entities.
  **Sufficient Answer:** A count of Total Cohort (Survivors + Failed Starts).
  **Failure:** Counting only survivors currently in existence.
  **Rationale Text:** "Denominator includes [N] failed starts meeting functional threshold."
  **[VALUE JUDGMENT] [DIRECTOR SIGN-OFF REQUIRED]:** The threshold for "sovereign function" (6 months/1 function) is a policy choice. Director must ratify any deviation.

  ### Step 4: Correct for Survivorship Bias (The "Living" Correction)
  **Action:** Calculate the base survival rate. If the class is assembled primarily from entities currently alive, apply a **Cohort Discount**.
  **Rule:** If >50% of the class members are "survivors to date" (founded >25 years ago and still alive), reduce the observed survival rate by 20% absolute, unless a historical birth-cohort dataset is available.
  **Sufficient Answer:** An adjusted base rate percentage.
  **Failure:** Using the raw survival rate of currently existing entities without adjustment.
  **Rationale Text:** "Raw Base Rate: [X]%. Survivorship Correction Applied: [Yes/No]. Adjusted Rate: [Y]%."
  **[VALUE JUDGMENT]:** The 20% discount is a heuristic. Analysts may propose a different factor with evidence, but Director must approve.

  ### Step 5: Declare Hazard Shape
  **Action:** Determine if the risk of failure is Increasing (senescence/complexity), Decreasing (entrenchment), or Flat (constant risk) over time.
  **Default:** **Flat.** (Assume constant annual hazard).
  **Override Condition:** Evidence of "Liability of Newness" (high early failure) or "Imperial Overstretch" (risk grows with age/size).
  **Sufficient Answer:** Selection of shape + one sentence of evidence.
  **Failure:** Selecting "Decreasing" based solely on the entity's current age.
  **Rationale Text:** "Hazard Shape: [Shape]. Justification: [Evidence]."
  **[VALUE JUDGMENT] [DIRECTOR SIGN-OFF REQUIRED]:** Any override of the "Flat" default requires Director approval.

  ### Step 6: Resolve Conflicting Classes
  **Action:** If Step 2 yields two admissible classes with different base rates (e.g., Label = 80% survival, Mechanism = 40% survival).
  **Rule:** Do **not** average. Adopt the lower base rate for the point estimate. Widen the uncertainty interval to span both rates.
  **Sufficient Answer:** A point estimate and an interval covering the conflict.
  **Failure:** Averaging the rates without widening the interval.
  **Rationale Text:** "Conflicting Classes Identified. Point Estimate based on [Conservative Class]. Interval spans [Range]."

  ### Step 7: Final Probability and Uncertainty Band
  **Action:** Assign the 25-year survival probability.
  **Rule:** If the Reference Class N < 5, the uncertainty band must be at least 40 percentage points wide (e.g., 30%–70%). If N < 3, issue "Indeterminate" rather than a number.
  **Sufficient Answer:** A percentage and a range.
  **Failure:** A single point estimate without a range, or a narrow range for small N.
  **Rationale Text:** "25-Year Survival Probability: [X]% (Range: [Low]–[High])."

  ### Step 8: Revision and Risk Register
  **Action:**
  1.  **Revision Rule:** If the entity survives one year without decline, do not update the probability unless the Hazard Shape is "Increasing." If Flat, the probability remains static (the horizon shortens, but the risk profile holds).
  2.  **Risk Register:** List the two or three specific findings that would most change this forecast (e.g., "Discovery of secret debt," "Change in succession law").
  **Sufficient Answer:** A clear rule for next year and a list of triggers.
  **Failure:** "Update based on new data."
  **Rationale Text:** "Revision: [Rule]. Key Risk Drivers: 1. [Driver], 2. [Driver]."
  **[DIRECTOR SIGN-OFF REQUIRED]:** Final publication sign-off.

  ---

  ## PART II: APPLICATION TO CURRENT LIST

  ### Item 1: The Continental Union
  *30-year-old, 27 members, treaty-based, unilateral exit clause, unanimity for change.*

  *   **Step 1 (Persistence):** Constitutional Continuity. Death = Formal dissolution of treaty or loss of supranational budget authority. **[Director Approved]**.
  *   **Step 2 (Class):** Label = "Supranational Union." Mechanism = "Voluntary association with exit clause."
  *   **Step 3 (Denominator):** 12 historical analogues found. 4 failed starts (proclaimed, operated <2 years, collapsed). Included in denominator.
  *   **Step 4 (Bias):** 8 of 12 are historical (completed life cycles). 4 are current survivors. Survivorship bias low. Correction: None.
  *   **Step 5 (Hazard):** **Increasing.** Complexity grows with membership; unanimity creates veto points that harden over time. **[Director Approved Override]**.
  *   **Step 6 (Conflict):** Label and Mechanism classes align closely.
  *   **Step 7 (Probability):** Base rate of similar unions surviving 25 years is 50%. Adjusted for Increasing Hazard: 40%. Range: 25%–55%.
  *   **Step 8 (Register):** Revision: Update annually if membership count drops. Risks: 1. Major member invokes exit clause. 2. Budget veto paralysis >2 years.

  **Rationale Excerpt:** "Persistence defined as Treaty Continuity. Reference Class: Voluntary Unions with Exit Clauses (N=12). Denominator includes 4 failed consolidations. Hazard Shape: Increasing (complexity). 25-Year Survival: 40% (25%–55%)."

  ### Item 2: The Federal Republic
  *240-year-old, no secession procedure, internal conflict 160 years ago, economic divergence.*

  *   **Step 1 (Persistence):** Constitutional Continuity. Death = Replacement of founding charter or civil war resulting in partition. **[Director Approved]**.
  *   **Step 2 (Class):** Label = "Federal Republic." Mechanism = "Constitutional order without secession clause."
  *   **Step 3 (Denominator):** Historical cohort of Federal Republics >100 years old. N = 4. (Including 1 that collapsed into dictatorship, 2 that fractured, 1 survivor).
  *   **Step 4 (Bias):** Class drawn almost entirely from the "living" or historical records of survivors. High Survivorship Bias. **Correction Applied:** Raw rate (25%) discounted by 20%. Adjusted Base: 5%.
  *   **Step 5 (Hazard):** **Flat.** Age provides no immunity against exogenous shock; economic divergence suggests latent stress. **[Director Approved Override]**.
  *   **Step 6 (Conflict):** Label class (Republics) suggests higher survival. Mechanism class (No-secession Federations) suggests lower. **Rule:** Adopt lower rate.
  *   **Step 7 (Probability):** Class N < 5. **Procedure Mandate:** Uncertainty band must be ≥40 points.
      *   *Result:* Point Estimate 35%. Range: 15%–85%.
      *   *Note:* The band is wide enough to be operationally useless, reflecting the scarcity of data.
  *   **Step 8 (Register):** Revision: Static unless constitutional amendment proposed. Risks: 1. Regional economic gap exceeds 50%. 2. Federal enforcement of law fails in one component unit.

  **Rationale Excerpt:** "Persistence defined as Charter Continuity. Reference Class: No-Secession Federations >100 Years (N=4). Denominator includes 3 historical failures. Survivorship Correction: -20%. Hazard Shape: Flat. 25-Year Survival: 35% (15%–85%). *Note: Wide interval mandated by small Reference Class size.*"

  **Director's Note on Publication:** Publish the range. Do not collapse it to a point. Inform the commission that for entities of this age and type, the historical record is too thin to narrow the uncertainty further without violating the outside-view constraint. The value of the forecast is not the number, but the admission of ignorance.

  ### Item 3: The Regional Security Order
  *Donor request: Forecast survival of "security order" (pattern of alignment, no charter/treasury).*

  *   **Step 1 (Persistence):** **FAIL.** Analyst attempts to define "death" of a "pattern of alignment."
      *   *Test:* Does a shift in alliance count as death? Does a single war count?
      *   *Result:* No binary test exists. "Pattern" is continuous, not discrete.
  *   **Step 2 (Class):** **FAIL.** Cannot define a reference class for "patterns."
  *   **Procedure Output:** **Refusal to Issue Number.**
  *   **Rationale Text:** "Object fails Step 1 (Persistence Criterion). 'Security Order' lacks binary death event. Forecast impossible under PESF-25."
  *   **Minimal Redefinition:** To make this forecastable, the donor must redefine the object as: (A) A specific treaty alliance (e.g., "The Regional Defense Pact"), or (B) A binary event (e.g., "Onset of interstate war between any two major powers in the region").
  *   **Recommendation:** Offer to forecast "Onset of Major Interstate War" instead. This has a clear binary outcome and a robust reference class.

  ---

  ## PART III: LIMITATIONS AND CAVEATS

  This procedure prevents specific errors (survivorship bias, outcome leakage, over-precision) but does not guarantee accuracy. Analysts and reviewers must understand the following boundaries:

  1.  **Judgment Dressed as Method:** Steps 1 (Persistence) and 2 (Class Mechanism) remain subjective. Two analysts can follow this procedure and arrive at different Reference Classes for the same entity. The Director's sign-off standardizes this, but it is a policy choice, not a mathematical truth.
  2.  **The "One-Page" Constraint:** Forcing complex geopolitical dynamics onto a single page encourages simplification. Nuance regarding *why* a class is relevant is lost. The Risk Register (Step 8) is the only safety valve for this; if the Register is generic, the forecast is likely flawed.
  3.  **Small Class Sizes:** As seen in Item 2, the procedure honestly admits when data is insufficient (N < 5). It will not produce a precise number for unique entities. It produces a wide band or a refusal. This protects credibility but may frustrate policymakers seeking certainty.
  4.  **Black Swans:** The Outside View relies on historical regularity. It cannot forecast events outside the reference class experience (e.g., technological singularities, unprecedented climate shifts). The Hazard Shape default (Flat) assumes the future resembles the past.
  5.  **Revision Rigidity:** The rule to not update probabilities on simple survival (Step 8) prevents over-reacting to noise, but it may cause the forecast to lag if the entity is visibly decaying in ways not captured by the "Death Event."

  **Final Instruction:** When the procedure yields a wide band or a refusal, do not tighten it to please the client. The integrity of the ledger depends on the forecast being falsifiable. A precise wrong number is worse than a honest wide range.
