      *   *Nuance:* Make sure to distinguish between *conscious conspiracy* and *structural necessity*. The user's prompt implies "structurally load-bearing," which is smarter than "evil planners." I need to respect that distinction.

  9.  **Final Polish:** Ensure the distinction between "means-tested" and "universal" is clear, as that's the crux of the historical counter-argument. Ensure the "Propaganda Machine" section touches on the risk of flattening human agency in the novel. (Proceed to generate output).

