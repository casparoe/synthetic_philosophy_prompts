      *   **The Task:** Identify arguments/evidence *against* this position (defeaters).
      *   **Specific Requirements:**
          *   Not just "that's cynical."
          *   Historical examples of welfare regimes without moral sorting.
          *   Fraud data patterns that undermine the "myth" framing.
          *   Where the logic breaks.
          *   Rank defeaters from fatal to awkward.
          *   Analyze how defenders of the thesis would react (concede or absorb).
          *   Address the "propaganda machine" conclusion (problem or point?).

  2.  **Deconstruct the Thesis (The "Structural Functionalism of Stigma" Argument):**
      *   This is a sociological/political economy argument reminiscent of Frances Fox Piven and Richard Cloward (*Regulating the Poor*), or David Garland (*The Culture of Control*). It posits that welfare isn't just about alleviating poverty but managing social order and legitimizing the state.
      *   *Strength:* It explains why inefficiency persists. It explains the obsession with "scroungers."
      *   *Weakness:* It might over-rationalize incompetence. It might ignore genuine fiscal constraints. It might underestimate the power of universalist movements.

  3.  **Brainstorming Defeaters (Counter-arguments):**

      *   *Historical Counter-examples:* Are there welfare states that *don't* rely on this sorting?
          *   Nordic Model (Universalism). Child allowances, pensions, healthcare. Do they distinguish "deserving/undeserving" as sharply? Less so, but tax compliance is high.
          *   Alaska Permanent Fund (Universal basic income-ish). No moral sorting.
          *   Post-WWII Attlee Government (UK). Beveridge Report aimed at "cradle to grave," though still had some contributory principles.
      *   *Fraud Data:* If fraud is a myth, what does the data say?
          *   Fraud rates are actually statistically tiny compared to error or overpayment.
          *   If the goal is boundary maintenance, why hide the fraud stats? (Actually, states often exaggerate them).
          *   If fraud were *actually* high, would the system collapse? Maybe.
      *   *Logic Breaks:*
          *   *Bureaucratic Inertia:* Maybe it's not a grand conspiracy/structural necessity, just path dependence and incompetent IT systems.
          *   *Fiscal Reality:* Money actually does run out. It's not just symbolic; it's budgetary.
          *   *Public Opinion:* Public support often *increases* with universalism (the "universalism paradox").
      *   *The "Propaganda Machine" Question:* Is this reductionist? Does it strip agency?

  4.  **Ranking and Refining Defeaters:**

      *   *Fatal:* **The Universalist Success Story.** If universal programs (pensions, healthcare) are *more* popular and stable than means-tested ones, the thesis that "moral sorting is load-bearing" is empirically false. The "deserving/undeserving" split might actually *weaken* welfare.
      *   *Severe:* **The Fiscal Constraint Argument.** It's not about symbolism; it's about money. If you give cash without conditions, inflation or budget deficits might spike (debatable, but a strong counter). The state isn't a monolith; it's competing factions. Treasury wants cuts, Social wants stability.
      *   *Moderate:* **Bureaucratic Incompetence vs. Design.** Hanlon's Razor. It's not a feature; it's a bug. The system is hostile because it's badly designed, not because it *needs* to be hostile to function.
      *   *Awkward:* **The "Honest Claimant" Preference.** Even within the system, caseworkers often want to help. The "myth" isn't believed by the inspectors themselves, undermining the idea that the *state* needs it.

  5.  **Addressing the "Defender's Response" (How the novel's protagonist would counter):**
      *   *Universalism:* "Ah, but look what's happening to universalism. It's being eroded *back* into means-testing. That proves my point." (Absorption).
      *   *Fiscal:* "Budgets are political choices. Austerity is a choice. The 'constraint' is manufactured to justify the sorting." (Absorption).
      *   *Incompetence:* "Incompetence serves a function. If it worked smoothly, everyone would claim. The friction *is* the filter." (Absorption).

  6.  **Addressing the "Propaganda Machine" Conclusion:**
      *   Is it a problem? It risks conspiracy theorizing (seeing intent where there is only structure).
      *   Is it the point? For a novel, yes. It creates tension.
      *   Nuance: It's not necessarily a conscious conspiracy, but a systemic imperative (Marxist/Structuralist view).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the thesis (it's a recognized sociological position).
