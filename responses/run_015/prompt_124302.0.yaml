      *   *Section 3: Logical Breaks.* The "Universalism Paradox" (people like universal benefits more).
      *   *Section 4: Ranking.* Order them by how much they damage the core thesis.
      *   *Section 5: Defender's Absorption.* Show how the protagonist can twist these back.
      *   *Section 6: The Propaganda Question.* Discuss structural functionalism vs. conspiracy.

  8.  **Self-Correction/Refinement during drafting:**
