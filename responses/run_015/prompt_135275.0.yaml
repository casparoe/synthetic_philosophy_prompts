  4.  **Developing the Correspondence Table:**
      *   Need columns: Source (Gambling/Law), Target (Moral Case), Verdict.
      *   *Wager/Choice:* Holds well.
      *   *Odds/Probability:* Weak. Moral life lacks known frequencies.
      *   *Outcome/Result:* Holds physically, fails normatively (see Doubt 3).
      *   *Settling/Blame:* Weak. Blame isn't fungible like money.
