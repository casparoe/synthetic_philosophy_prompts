      *   **The User's Scenario:** A novel with two timelines (same agent, same decision, same intoxication, different outcomes: death vs. safe arrival). Readers blame differently based on outcome (resultant moral luck).
      *   **User's Doubts:**
          1.  *Metaphysical/Coherence:* Can the timelines actually be identical up to the divergence? (Branching worlds issue).
          2.  *Salience Luck:* Narrative focus changes blame without changing outcome or act. Is this luck? Does the analogy cover it?
          3.  *Analogy Direction:* Does gambling actually support the philosopher's conclusion? Gamblers accept outcomes. Maybe the analogy supports outcome-sensitive blame, not *ex ante* auditing.
      *   **Required Output Structure:**
          1.  Brainstorming paragraphs (correspondences, rejections, precise step of analogy).
          2.  Correspondence Table (Source vs. Moral Case vs. Verdict).
          3.  Separation of Disanalogies (Matter vs. Inert).
          4.  Imported Features (What gambling has that morality lacks).
          5.  Verdict on Conclusion.
          6.  Better Analogy (if applicable).
          7.  Constraints: No citations/bibliographies. Reason from structure. Flag empirical uncertainties.

  2.  **Brainstorming & Initial Analysis (Mental Draft):**
      *   *Correspondences:* Wager = Decision to drive. Cards/Spin = The child stepping out. Winnings/Loss = Hangover/Death + Blame. House/Casino = The Law/Society? Settling up = Punishment/Blame.
      *   *Rejections:* Gamblers *want* variance; drivers usually don't (they want the destination without the risk). Gambling has defined odds; moral life has Knightian uncertainty. Gambling is consensual entry; driving is often necessary/semi-coerced.
      *   *The Crucial Step:* The philosopher argues that because the *bet* is the same, the *blame* should be the same. He uses the legal distinction (attempt < completion) to show inconsistency, then uses the gambling analogy to say "treat them the same" but concludes we should judge the *risk* (the bet), not the *outcome* (the loss).
