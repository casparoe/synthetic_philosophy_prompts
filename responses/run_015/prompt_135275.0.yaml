      *   Maybe *Parenting*? We judge a parent's decision to let a kid play outside by the risk, but if the kid gets hurt, the guilt/blame is objectively heavier.
      *   Actually, *Negligence Law* (torts) is closer than criminal law. Reasonable person standard (ex ante) but damages (ex post) matter for liability amount.
