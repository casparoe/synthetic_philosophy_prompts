  5.  **Analyzing Disanalogies:**
      *   *Matter:* Known odds vs. Uncertainty. Fungibility of stakes (money vs. life/reputation). Consensual participation.
      *   *Inert:* The physical mechanism of chance (cards vs. physics). The presence of a dealer.

  6.  **Addressing "Salience Luck":**
      *   This isn't standard moral luck. It's epistemic access for the *blamer*, not the *agent*. The gambling analogy assumes perfect information about the bet. The novel manipulates information about the *person*. This breaks the analogy because poker players don't read memoirs of opponents before settling a pot.

  7.  **Addressing the "Direction" of the Analogy:**
      *   The philosopher says: Same bet = Same blame.
      *   Gambling reality: Same bet = Different financial results.
