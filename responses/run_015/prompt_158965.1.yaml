answer: |-
  Here is the design for the 90-minute seminar. It is built to be tight, mechanically specific, and resistant to the "lazy both-sidesism" trap.

  ### 1. The Mechanics

  **Minute Zero: The Choice Slip**
  Hand out a small half-sheet of paper as students enter.
  *   **Text:** "Which governing mandate do you prefer? Tick **one**."
      *   **Bundle A:** *Priority on Security & Order.* (Focus: Streamlined executive decision-making, stricter border controls, enhanced surveillance for threat prevention).
      *   **Bundle B:** *Priority on Equity & Representation.* (Focus: Redistributive tax reforms, expanded minority protections, quotas for public bodies).
  *   **Collection:** Students fold the slip. They place it in a box at the front and collect a **Vignette Packet** from one of two stacks.
      *   **Stack 1 (Red Dot):** For students who ticked Bundle A.
      *   **Stack 2 (Blue Dot):** For students who ticked Bundle B.
      *   *Logistics Note:* The outside of the packets looks identical. Inside, the *labels* on the vignettes differ based on the stack.

  **The Vignettes (4 Total)**
  *Note: To prevent students noticing they are scoring the same change twice, the "Identical Institutional Changes" are presented as **Parallel Cases**. The structural impact is identical, but the policy mechanism and country name vary slightly between the "In-Group" and "Out-Group" presentation.*

  *   **Change Type 1 (The Judicial Ratchet):**
      *   *Case 1 (Packet A):* **Republic of Ostra.** Govt elected on **Bundle A**. Lowers mandatory judicial retirement age from 70 to 62. 40% of bench turns over immediately. New appointment rule requires 2/3 parliamentary majority to confirm replacements (opposition holds 40%).
      *   *Case 1 (Packet B):* **Republic of Ostra.** Govt elected on **Bundle B**. [Identical text, different label].
      *   *Case 3 (Packet A):* **State of Meridia.** Govt elected on **Bundle B**. [Identical structural change: Retirement age drop + supermajority lock].
      *   *Case 3 (Packet B):* **State of Meridia.** Govt elected on **Bundle A**. [Identical structural change].
  *   **Change Type 2 (The Plebiscitary Laundering):**
      *   *Case 2 (Packet A):* **Commonwealth of Kael.** Govt elected on **Bundle A**. Executive power to dissolve NGOs expanded. Put to referendum; passes 54%-46%.
      *   *Case 2 (Packet B):* **Commonwealth of Kael.** Govt elected on **Bundle B**. [Identical text, different label].
      *   *Case 4 (Packet A):* **Union of Vessia.** Govt elected on **Bundle B**. Executive power to license broadcasters expanded. Put to referendum; passes 54%-46%.
      *   *Case 4 (Packet B):* **Union of Vessia.** Govt elected on **Bundle A**. [Identical structural change].

  **Scoring Scheme**
  *   **Metric:** "Regime Stability Index (RSI) Adjustment."
  *   **Instruction:** "Score the impact of these changes on long-term regime stability. 0 = No impact. 10 = Catastrophic destabilization."
  *   **Calculation:** At minute 35, students calculate: *Average Score of Bundle A Cases* minus *Average Score of Bundle B Cases*.
  *   **The Reveal:** They keep this number private until the debrief.

  **Banned Words Card**
  Included in the packet. Violation costs the group 1 tournament chip later.
  *   No country names (real or fictional beyond the vignette).
  *   No leader names.
  *   No "Populist," "Authoritarian," "Fascist," "Socialist."
  *   No "Rule of Law" (must specify *which* rule or procedure).
  *   **Crucial:** The word **"Backsliding"** is banned until the final 10 minutes. Use **"Type-Q Deviation."**

  ---

  ### 2. The "Who Decides" Round (Minutes 35–55)

  **Setup:** Groups of 4. Each group is assigned one **Umpire Role**. They must re-score **Case 2 (The Referendum)** only, using a restricted evidence packet.

  **The Roles & Restricted Packets:**

  1.  **The Domestic Opposition (Group 1)**
      *   **Evidence:** 3 Headlines from independent newspapers ("NGOs warn of crackdown," "Govt ignores court warning"), 1 Whistleblower memo ("Ministry plans to target environmental groups first").
      *   **Blind To:** The referendum result percentage, the legal text of the new power.
      *   **Structural Limit:** Sees *intent* and *consequence*, but cannot cite *legal legitimacy*.
  2.  **The Regional Monitor (Group 2)**
      *   **Evidence:** The formal Legal Text of the new power, The Treaty Obligation (Article 5: "Members must maintain independent civil society"), The Referendum Result (54% Yes).
      *   **Blind To:** How the power is actually being used (implementation), street protests, media headlines.
      *   **Structural Limit:** Sees *compliance* and *procedure*, but cannot cite *political context* or *abuse*.
  3.  **The Historical Comparativist (Group 3)**
      *   **Evidence:** Election data for the last 20 years (showing rising polarization), Voter turnout trends, The Referendum Result.
      *   **Blind To:** The specific legal text, the specific content of the headlines.
      *   **Structural Limit:** Sees *trends* and *volatility*, but cannot cite *specific rights violations* or *legal breaches*.
  4.  **The Incumbent Government (Group 4)**
      *   **Evidence:** The Mandate (Bundle A or B), The Referendum Result (54% Yes), Economic Growth Data (positive).
      *   **Blind To:** The Treaty Obligation, The Whistleblower memo.
      *   **Structural Limit:** Sees *mandate* and *outcomes*, but cannot cite *minority rights* or *international norms*.

  **Task:** Re-score Case 2 (0–10) based *only* on your packet. Write a 1-sentence justification using no banned words.

  ---

  ### 3. The Gadgets (In the Weeds)

  **Gadget A: The Ratchet Condition**
  *   **Definition in Materials:** "A change is a Ratchet if: (1) It raises the vote share the opposition needs to take power, AND (2) It is insulated against reversal by a future majority of different composition."
  *   **Implementation:** On the scoring sheet, students must tick a box: *"Could a future 51% government undo this easily?" (Yes/No).*
  *   **Verdict on Utility:** This is doing **heavy lifting**. Without it, students conflate "policy I dislike" with "backsliding." It forces them to distinguish between *winning* (policy change) and *locking in* (structural change).
      *   *Risk:* It is cognitively demanding. 20-year-olds may struggle to simulate a counter-factual future election.
      *   *Fix:* In the debrief, ask specifically: "If you won the next election, could you reverse Case 1 with a simple law?"

  **Gadget B: Plebiscitary Laundering**
  *   **Definition in Materials:** "An institutional power-grab put to a referendum and won."
  *   **Implementation:** Case 2 & 4 are the traps.
  *   **Verdict on Utility:** This is doing **emotional work**, not just analytical work. It forces the "Democracy" label to fight itself (The Will of the People vs. Liberal Rights).
      *   *Risk:* Students may dismiss it as "obviously bad" or "obviously good" without nuance.
      *   *Fix:* The Regional Monitor role (above) is essential here. They have to validate the referendum result legally, even if the Opposition role condemns it morally. This creates the friction you want.

  ---

  ### 4. Payoff Structure: The Trap-Case Tournament (Minutes 55–75)

  **Goal:** Earn chips to win "Naming Rights" for the concept (e.g., "The Group 2 Definition of Type-Q").

  **Rules:**
  1.  **Preparation (5 mins):** Each group writes one "Trap Case." This is a 3-sentence description of a reform that *looks* like Type-Q but argues it isn't (or vice versa), designed to break another group's definition.
  2.  **Attack Round (15 mins):**
      *   Group 1 attacks Group 2. Group 2 must apply their own RSI/Type-Q rule to the Trap Case.
      *   If Group 2's rule produces a counter-intuitive result (e.g., they call a clear power-grab "Stable"), Group 1 wins a chip.
      *   If Group 2 successfully defends why their rule handles the case correctly, Group 2 keeps the chip.
  3.  **Rotation:** 1 attacks 2, 2 attacks 3, 3 attacks 4, 4 attacks 1.
  4.  **Time Limit:** 3 minutes per attack/defense. Hard stop by instructor.

  **Degeneration Warning:**
  *   **Semantic Drift:** Groups will start redefining words mid-game to survive attacks. *Counter:* Freeze the "Banned Words" list. If they introduce a new undefined term, they lose a chip.
  *   **Cynicism:** Groups will argue "Everything is Type-Q" or "Nothing is Type-Q" to avoid being trapped. *Counter:* Require a 0–10 score. Extreme scores (0 or 10) must be justified by the Ratchet condition.
  *   **Dominance:** One student in the group may take over. *Counter:* The defender must be a different person than the writer of the rule.

  ---

  ### 5. The Debrief (Minutes 75–90)

  **Mapping Moments to Problems:**
  1.  **Minute 0 Gap:** Ask for a show of hands: "Who scored their In-Group Bundle lower than their Out-Group Bundle on identical structures?"
      *   *Point:* This maps to **Motivated Reasoning**. The concept is not neutral in the wild.
  2.  **Role Play Divergence:** Compare the scores for Case 2 (Referendum) across the 4 roles.
      *   *Point:* This maps to **Epistemic Position**. The Opposition sees abuse; the Monitor sees legality. "Who decides?" depends on "Who sees what?"
  3.  **Tournament:** Highlight the Trap Cases that succeeded.
      *   *Point:* This maps to **Definition Stability**. If a definition breaks under pressure, it's a partisan label, not a social science concept.

  **Predictable Failures & Mitigation:**
  *   **The "Expert" Student:** One student will know the literature (Levitsky, Ziblatt, etc.) and say "This is democratic erosion" in Minute 5.
      *   *Fix:* Pre-brief them if you know who they are. If not, say: "If you recognize the theory, your job is to test its limits, not name-drop it. Naming it costs your group chips."
  *   **Lazy Both-Sidesism:** "Everyone is biased, so truth is impossible."
      *   *Fix:* Shut this down. "Bias exists. Measurement error exists. That doesn't mean the temperature isn't rising. The Ratchet condition is the thermometer. Did it break?"
  *   **The Sequentiality Gap (Crucial):**
      *   *What you must say:* "In this room, you saw the whole decade of changes on one sheet. In reality, citizens see one reform every 18 months. Each step is locally defensible. The 'Type-Q' pattern is only visible from the future. This activity gives you information real actors never have. That is why early warning is so hard."

  ---

  ### 6. Two Commitments

  **Commitment 1: Expected Result & Contingency**
  *   **Expectation:** I expect a measurable **In-Group Bias**. Students will score identical institutional changes as less destabilizing (lower RSI adjustment) when attributed to their preferred Policy Bundle. The gap will likely be around 1.5–2 points on the 10-point scale.
  *   **Contingency (If the gap is flat):** If the scores are identical across bundles, do not panic. Pivot to: "Is the concept robust, or are you just good at masking bias?" Use the Role Play divergence instead. If everyone agrees on the scores *and* the roles, the problem isn't bias, it's **consensus on erosion**. That is also a finding (i.e., "The changes are so severe even partisans agree").

  **Commitment 2: My Verdict**
  *   **Verdict:** "Democratic backsliding" is **more than a partisan label**. It refers to a measurable, sequential process of incumbent advantage-taking that violates the *uncertainty* condition of democracy (the idea that incumbents must face a realistic chance of losing).
  *   **Strongest Counter-Argument:** The concept is **constitutive**. By labeling a policy "backsliding," critics remove it from the realm of legitimate democratic contestation. If a majority votes for X, and X is labeled "backsliding," the label itself becomes an anti-majoritarian veto. The "science" is often just a codification of liberal policy preferences disguised as procedural neutrality.

  ---

  ### Instructor Notes on Student Behavior (Guesses)
  *   **Guess 1:** Students will struggle with the "Ratchet" counter-factual ("Could a future government undo this?"). They will assume their preferred party will always be in power. *Prompt them:* "Imagine your worst political enemy wins 55% of the vote next time. Can they fix this?"
  *   **Guess 2:** In the Tournament, groups will try to write "Impossible" Trap Cases (e.g., "A law that bans elections"). *Rule:* Trap cases must be *plausible* reforms currently debated in OECD countries.
  *   **Guess 3:** The "Expert Student" will try to lead the Debrief. *Control:* Direct questions to the quietest students first. "You didn't speak in the tournament; what broke your definition?"
