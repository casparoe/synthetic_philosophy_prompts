      *   *Time Management:* 90 mins is tight.
          *   0-10: Intro & Choice.
          *   10-30: Scoring Vignettes.
          *   30-50: Role Play (Who Decides).
          *   50-70: Tournament.
          *   70-90: Debrief.
      *   *Commitment:* I need to be firm on the verdict. No hedging.

  4.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   No real quotes? Check.
      *   Flag guesses about students? Check.
      *   Specific terminology ("Type-Q")? Check.
      *   Two commitments at the end? Check.

