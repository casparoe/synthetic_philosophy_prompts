answer: |-
  # Teaching Plan: The Problem of Moral Luck (50 Minutes)

  ## 1. Conceptual Sequence and Dependency Order

  To ensure the scenario functions as a philosophical puzzle rather than a news story, you must establish specific normative commitments before introducing the facts of the case. The sequence must move from pre-theoretical intuition to philosophical principle, then to contradiction.

  **Phase 1: Pre-Scenario Normative Commitment (Minutes 0–5)**
  *   **Action:** Before presenting the engineers, elicit and write on the whiteboard a shared definition of "fairness" in judgment.
  *   **Dependency:** You cannot introduce the scenario yet. Students must first agree that *arbitrary* differences (like geography or genetics) should not dictate moral judgment.
  *   **Goal:** Secure agreement on the premise: "Two people who make the same choices with the same intent should be judged the same." This creates the tension later.

  **Phase 2: Scenario Presentation and Intuition Elicitation (Minutes 5–15)**
  *   **Action:** Present the Engineer A/B case.
  *   **Dependency:** Do not introduce the "Control Principle" yet. You first need their raw, untheorized judgment.
  *   **Goal:** Extract the admission that, in reality, B *will* be blamed more than A. Ask: "Legally? Professionally? Morally?" Most will admit B faces harsher consequences.
  *   **Crucial Step:** Ask: "Did B do anything differently in the design phase?" (Answer: No). "Did B intend harm?" (Answer: No).
  *   **Result:** You now have a conflict between Phase 1 (Fairness requires sameness) and Phase 2 (Reality treats them differently).

  **Phase 3: The Control Principle and Kantian Anchor (Minutes 15–25)**
  *   **Action:** Now introduce the **Control Principle**: *We are only morally responsible for what is within our control.*
  *   **Dependency:** This principle cannot land until they have acknowledged that the road conditions were outside B's control (established in Phase 2).
  *   **Connection:** Link this to their prior knowledge of Kant. Remind them: Kant argues the "Good Will" is the only unconditional good because it is the only thing fully within our control. Outcomes are contingent.
  *   **Goal:** Formalize the intuition from Phase 1. If they accept Kant/Control Principle, B and A must be judged identically.

  **Phase 4: The Contradiction (The Puzzle) (Minutes 25–40)**
  *   **Action:** Force the collision between Phase 2 (We blame B) and Phase 3 (We shouldn't blame B).
  *   **Dependency:** This only works if they have accepted both the reality of the blame (Phase 2) and the validity of the Control Principle (Phase 3).
  *   **Goal:** Make them feel the discomfort. The problem of moral luck is not that luck exists; it is that our moral practices violate our own philosophical standards.

  **Phase 5: Resolution Attempt and Assessment (Minutes 40–50)**
  *   **Action:** Test their grasp of the tension (see Section 4).
  *   **Goal:** Confirm they understand the paradox, not just the story.

  ---

  ## 2. Scenario Engineering: Features and Isolation

  To isolate **Resultant Moral Luck** (luck in the outcome of one's actions) from **Circumstantial Luck** (luck in the situations one faces) and **Constitutive Luck** (luck in one's character/temperament), the scenario must be engineered with specific constraints.

  **Features the Scenario Must Possess:**
  1.  **Identical Ex Ante Risk:** Both engineers must subject their systems to the *same* testing standards. This neutralizes Constitutive Luck (skill/carefulness) and minimizes Circumstantial Luck regarding the *decision* to deploy.
  2.  **Identical Intent:** Both must act with "conscientious intent." This anchors the case in the Kantian "Good Will," ensuring character is not the variable.
  3.  **Divergent Ex Post Outcome:** One system kills; one does not. This is the locus of Resultant Luck.
  4.  **External Causality:** The fatality must be caused by the environment (obscured signals), not a system glitch unique to B. This ensures the outcome is truly "luck" relative to the design.

  **Features the Scenario Must Lack:**
  1.  **Antecedent Wrongdoing:** Unlike the drunk driver example, neither engineer broke a rule *before* the luck intervened.
      *   *Pedagogical Utility:* In drunk driver cases, students often argue, "He is responsible because he chose to drink." That conflates the luck of the outcome with the prior negligence of the act. The Engineer case removes the prior negligence. Both acted permissibly. This isolates the *outcome* as the sole variable for blame, forcing students to confront whether the *death itself* changes moral worth, rather than the *risk creation*.
  2.  **Differences in Skill:** Do not suggest B was a less talented coder. This prevents students from attributing the crash to Constitutive Luck.
  3.  **Avoidable Alternatives:** Do not suggest B could have chosen a different municipality. This prevents students from arguing it was Circumstantial Luck (a choice of situation) rather than Resultant Luck (the outcome of the situation).

  **Why This Isolation Matters:**
  If the scenario allows for antecedent wrongdoing (drunk driver), students can resolve the tension by blaming the *choice to drink*, effectively denying moral luck exists. By making both engineers perfectly conscientious, you block the escape route. The only difference is the body count.

  ---

  ## 3. Misconception Management

  You must anticipate three specific derailments. Defuse them at the precise moment they threaten to collapse the tension.

  **Misconception 1: "B is entirely blameless because road conditions were not her fault."**
  *   **The Risk:** Students treat this as the *solution*. If they conclude B is blameless, the discussion ends. The problem of moral luck is that we *cannot* treat her as blameless in practice.
  *   **Timing:** Phase 2 (Intuition Elicitation).
  *   **Defusing Move:** When a student says, "Well, obviously B isn't responsible," immediately counter with: "Agreed, philosophically. But tell me about her career. Will she be hired again? Will the families of the victims forgive her because of the Control Principle?" Force them to acknowledge that *social moral practice* does not treat her as blameless. The puzzle is the gap between "she isn't responsible" and "she is treated as responsible."

  **Misconception 2: "You are denying outcomes ever matter for blame."**
  *   **The Risk:** Students think accepting the Control Principle means adopting a rigid Kantian view where consequences are irrelevant to *all* ethics (e.g., policy, law).
  *   **Timing:** Phase 3 (Control Principle Introduction).
  *   **Defusing Move:** Distinguish **Moral Worth** from **Causal Responsibility**. Say: "We are discussing whether B is a *worse person* or *more morally culpable*, not whether she is causally linked to the death or whether compensation is owed." Clarify that the Control Principle applies to *blame and character judgment*, not necessarily to liability or policy. This prevents them from rejecting the principle because "obviously consequences matter in law."

  **Misconception 3: "This is merely determinism or free-will skepticism in disguise."**
  *   **The Risk:** Students collapse the argument into "Nothing is our fault because of cause and effect." This swallows moral luck into hard determinism.
  *   **Timing:** Phase 4 (The Contradiction).
  *   **Defusing Move:** Explicitly bracket metaphysics. State: "Assume for this hour that free will exists. Assume both engineers had full free will. The problem remains: they exercised that will identically, yet the moral judgment differs." This isolates Moral Luck as a distinct problem from the Free Will debate.

  ---

  ## 4. Assessment: Check-for-Understanding

  In the final five minutes, do not ask "Who is right?" or "How do you feel?" These invite sympathy, not analysis. Use a question that forces them to articulate the structural contradiction.

  **The Question:**
  > "We have identified two claims that we are struggling to hold simultaneously.
  > **Claim 1:** Moral blame requires control (The Control Principle).
  > **Claim 2:** B is more blameworthy than A (Our Intuition/Practice).
  >
  > If you must reject one claim to be logically consistent, which one do you reject, and what is the specific cost of that rejection?"

  **Grading Criteria for Student Responses:**
  *   **Grasping the Tension:** The student identifies that rejecting Claim 1 undermines the basis of fairness/Kantian ethics. The student identifies that rejecting Claim 2 requires us to ignore real-world harm/outcomes in our judgment of character.
  *   **Merely Sympathizing:** The student says, "I reject Claim 2 because it's sad for B," or "I reject Claim 1 because people need to be held accountable." (This expresses preference, not understanding of the philosophical cost).
  *   **Success Indicator:** The student explicitly acknowledges that *either* choice leads to a counter-intuitive result (either we blame people for luck, or we ignore deadly outcomes in moral judgment).

  ---

  ## 5. Exclusions and Justification

  To protect the core insight within fifty minutes, you must explicitly exclude the following standard literature elements.

  **1. The Standard Fourfold Taxonomy (Resultant, Circumstantial, Constitutive, Causal)**
  *   **Exclude:** Do not teach the names or the full grid of moral luck types.
  *   **Justification:** Introducing the taxonomy creates a false sense of resolution. Students will feel they have "learned moral luck" by memorizing the categories, rather than feeling the paradox. It turns a visceral ethical problem into a sorting exercise. Focus entirely on Resultant Luck as the entry point; the other types can be inferred later if they pursue the major.

  **2. The Compatibilist-Libertarian Debate on Responsibility**
  *   **Exclude:** Do not discuss whether free will is compatible with determinism.
  *   **Justification:** This is a metaphysical rabbit hole. Moral luck is a problem *even if* we have free will (as established in Misconception 3 management). Bringing in compatibilism shifts the focus from "How do we judge?" to "What is the nature of agency?" which dilutes the ethical focus of the elective.

  **3. The Distinction Between Moral Luck and Epistemic Luck**
  *   **Exclude:** Do not discuss whether the luck affects our *knowledge* of the blame vs. the *existence* of the blame.
  *   **Justification:** This is a technical solution often used to dissolve the problem (i.e., "B was always blameworthy, we just didn't know until the crash"). Introducing this encourages students to bypass the tension rather than sit with it. For a junior-senior elective without prior coursework, the pedagogical goal is to deepen the question, not provide a technical escape hatch.

  **Summary of Omission Strategy:**
  By omitting these, you prevent students from "solving" the problem with terminology. They must leave the room with the uncomfortable realization that our standard tools for judgment (Control Principle) conflict with our standard practices (Outcome Bias). This discomfort is the learning objective.
