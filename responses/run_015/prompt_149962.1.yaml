answer: |-
  Your diagnosis is incisive. The stalemate over the Special Composition Question (SCQ) persists not because the arguments are inconclusive, but because the opposing camps are often playing different games under the same rules. You have correctly identified that the surface-level ontological disagreement ("Do tables exist?") is fueled by a deeper divergence regarding the *function* of ontological categories.

  To diagnose this impasse, we must look at how the specific arguments (contact, life, vagueness) reveal the friction between **ontological realism** (the world has a specific structure we must discover) and **conceptual pragmatism** (existence is a tool for carving the world).

  ### 1. The Arguments as Proxies for Methodological Commitments

  The standard arguments in the SCQ literature are not merely logical proofs; they are defenses of competing methodological virtues.

  **Contact and Causal Joints**
  Early restrictivists argued that parts compose a whole when they are in *contact*. Universalists and nihilists dismantled this by noting that physics describes fields and forces, not absolute contact.
  *   **The Restrictivist Intuition:** When a restrictivist defends contact (or later, "fastening" or "cohesion"), they are implicitly arguing that existence requires **causal integration**. For them, an "object" is a locus of causal power distinct from the sum of its parts. If the parts don't interact in a unified way, there is no "joint" in nature to mark the boundary.
  *   **The Universalist Counter:** Universalists (like David Lewis) argue that causal interaction is irrelevant to *existence*. Two scattered particles exist just as much as a bonded molecule; the difference is merely in their causal relations, not their ontological status.
  *   **Diagnosis:** This confirms your hypothesis. Restrictivists treat "object" as a causal/explanatory category. Universalists treat "object" as a logical category.

  **Life (van Inwagen's Answer)**
  Peter van Inwagen offered the most sophisticated restrictivist answer: composition occurs only when the activity of the parts constitutes a *life*.
  *   **The Restrictivist Move:** This concedes that spatial proximity is insufficient and moves explicitly to **functional unity**. A living organism is a causal closed-loop.
  *   **The Universalist Attack:** Universalists argue this is arbitrary. Why is the boundary of a organism ontologically significant but the boundary of a chair (held together by weaker forces) not? If existence is a binary property, why does it turn on the vague threshold of "biological function"?
  *   **Diagnosis:** Van Inwagen is trying to save the intuition that only *unified agents* deserve the title of "substance." Universalists see this as conflating *ontological significance* with *ontological existence*.

  **Vagueness (The Lewis-Sider Argument)**
  The most potent argument for universalism is that restricted composition entails vague existence. If composition is restricted, there must be a borderline case where it is indeterminate whether the parts compose a whole. Lewis and Sider argue that existence cannot be vague; therefore, composition must be unrestricted.
  *   **The Universalist Virtue:** Logical precision. They prioritize a semantics where the quantifier ($\exists$) has a fixed, precise domain.
  *   **The Restrictivist/Nihilist Defense:** They deny the premise. Vagueness is linguistic or conceptual, not ontological. The world is precise; our concept of "composition" is what fails.
  *   **Diagnosis:** This is the clearest example of the methodological split. Universalists prioritize the **formal structure of language/logic** (Sider's "joint-carving" quantifiers). Restrictivists prioritize **pre-theoretical intuition** about the world. The Universalist says, "Logic dictates existence." The Restrictivist says, "Intuition dictates logic."

  ### 2. Ontological Commitment vs. Explanatory Framing

  You ask whether distinguishing between ontological commitment and explanatory framing could break the impasse. This is the core of the "meta-ontological" turn (associated with Carnap, Hirsch, and Thomasson).

  **The Proposed Compromise:**
  One might suggest: *Universalists are right about ontology (everything exists), but Restrictivists are right about explanation (only some things are causally relevant).*
  *   We can quantify over "table-arranged particles" (Universalism) while admitting that citing "the table" is only useful when those particles are causally integrated (Restrictivism).

  **Why This Fails to Break the Stalemate:**
  1.  **Normativity of "Exists":** For the Nihilist and the Restrictivist, "exists" is an honorific. To say a scattered object "exists" is to grant it a status they believe it hasn't earned. They are not just making a claim about quantifier range; they are making a claim about *reality's structure*. A distinction between existence and explanation feels like a verbal sleight-of-hand to them.
  2.  **Paraphrase Resistance:** Nihilists (like Trenton Merricks) argue that if we say "there are no tables, only particles arranged table-wise," we eliminate redundant causal powers. If Universalists say "tables exist *and* particles exist," they face overdetermination. The compromise doesn't solve the causal exclusion problem; it just renames it.
  3.  **Sider's Realism:** Ted Sider argues in *Writing the Book of the World* that there is a fundamental structure to reality, and our quantifiers *ought* to match it. If the fundamental structure doesn't include "tables," then saying tables "exist" (even in a deflated sense) is failing to describe the world correctly. For Sider, the methodological *is* the ontological.

  Therefore, a sharp distinction between commitment and framing does not break the impasse because the participants disagree on whether "existence" is a lightweight, conceptual tool (Carnap/Hirsch) or a heavyweight, structural feature of the universe (Sider/van Inwagen).

  ### 3. The Anchor: Pre-Theoretical Intuitions of Unity

  Ultimately, you are correct that the disagreement is anchored in pre-theoretical intuitions that no formal result can overturn. The formal arguments (vagueness, parsimony) are merely weapons deployed to defend these foundational intuitions.

  **The Two Intuitions:**
  1.  **The Intuition of Continuity (Universalist):** There is no magical moment where existence pops into being. If particle A and particle B exist, their sum must exist. To deny this is to believe in "ontological magic."
  2.  **The Intuition of Unity (Restrictivist/Nihilist):** Not every collection is a thing. A random scatter of stars is not an object. To call it one is to lose the distinction between a genuine unity and a mere plurality.

  **Why Formal Results Fail:**
  *   **Vagueness:** The Universalist claims vagueness is impossible in reality. The Restrictivist claims *arbitrariness* is impossible in reality. Both are appealing to a modal intuition about how the world *must* be.
  *   **Parsimony:** The Nihilist says positing tables is ontologically profligate. The Universalist says positing *rules* for composition is ideologically profligate. Both claim the mantle of Ockham's Razor, but they are shaving different things (entities vs. brute facts).

  ### Conclusion: Two Projects Under One Heading

  Your suspicion is confirmed: The SCQ debate is **two projects running under a single heading.**

  1.  **The Metaphysical Project (Restrictivist/Nihilist):** Seeks to identify the **causal joints** of the world. They ask, "What are the fundamental units of causal interaction?" For them, composition is a physical/causal phenomenon.
  2.  **The Logical/Methodological Project (Universalist):** Seeks to optimize the **formal framework** of description. They ask, "What is the most coherent semantics for our quantifiers?" For them, composition is a logical relation.

  **Can it be resolved?**
  Only by a meta-ontological agreement. If both sides agree that "existence" is merely a question of quantifier choice (quantifier variance), the dispute dissolves into a verbal disagreement about which language to speak. However, as long as participants believe they are describing the *mind-independent structure of reality* (as Sider argues they should), the stalemate will remain.

  The impasse is not a failure of argumentation; it is a clash of **ontological temperaments**. The Universalist fears magic (brute restrictions on existence); the Restrictivist fears triviality (the loss of the distinction between a thing and a heap). No argument about vagueness or contact can bridge this gap because those arguments presuppose which fear is more justified. The dispute is ultimately about whether the universe is fundamentally **discrete and unified** (Restrictivist) or **continuous and indifferent** (Universalist).
