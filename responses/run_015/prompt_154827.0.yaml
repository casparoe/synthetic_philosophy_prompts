answer: |-
  Here is a conceptual menu of the claims hidden inside "a promise is a promise," structured for your reading group. I have categorized them by plausibility and indicated which side of your debate each claim supports.

  ### The Menu of Claims

  **1. The Tautological Claim**
  *   **Claim:** To say "I promise" is to perform a specific speech act distinct from predicting or intending; once performed, the fact of the promise is an objective feature of the past.
  *   **Status:** **Trivial.** It establishes that a promise occurred, but not what follows from it.
  *   **Verdict:** **Neutral.** Both sides agree a promise was made; this does not settle whether it was permissible to break it.

  **2. The Content-Independence Claim**
  *   **Claim:** The reason to keep a promise arises from the act of promising itself, not from the independent value of the thing promised; you cannot re-calculate the balance of reasons case-by-case.
  *   **Status:** **Substantive and Defensible.** It explains why "better movers" (better consequences) do not cancel the obligation.
  *   **Verdict:** **Supports the Group.** It validates the friend's view that you cannot trade the promise for a superior outcome.

  **3. The Performance Claim**
  *   **Claim:** What is owed is the specific performance (you turning up), not the promised state of affairs (the flat being moved); the promisor's agency is part of the object of the promise.
  *   **Status:** **Substantive and Defensible.** It captures the intuition that relationships involve persons, not just results.
  *   **Verdict:** **Supports the Group.** It directly refutes your "movers did it better" argument in the first case.

  **4. The Directed Duty Claim**
  *   **Claim:** Promissory obligation is a duty *to* a person, not a duty to do a thing; therefore, only that person has the standing to waive the duty or complain of its breach.
  *   **Status:** **Substantive and Defensible.** This aligns with your "switch" theory regarding who holds the power of release.
  *   **Verdict:** **Mixed.** It supports you in Case 1 (if the friend had released you, you'd be clear), but creates tension in Case 2 (a dead grandmother cannot hold a switch).

  **5. The Non-Instrumental Claim**
  *   **Claim:** The value of fidelity is intrinsic; keeping faith is a good in itself even when it produces no external benefit, protects no expectations, and is never discovered.
  *   **Status:** **Substantive and Radical.** It posits a moral reality independent of social utility or psychological expectation.
  *   **Verdict:** **Supports the Group.** This is the only claim that robustly covers the grave case (no expectations frustrated) and the mover case (better outcome achieved).

  **6. The Expectation Claim**
  *   **Claim:** The function of promising is solely to create and secure expectations in the promisee; if expectations are secure (or compensation is paid), the obligation is discharged.
  *   **Status:** **False (or incomplete).** It reduces promising to a form of insurance or prediction, ignoring the relational bond.
  *   **Verdict:** **Supports You.** This is your defense in the mover case, but it fails to explain why you are bound in the grave case.

  **7. The Absolute Claim**
  *   **Claim:** Promissory obligation admits of no overriding excuses; the phrase means "a promise binds regardless of cost, coercion, or change in circumstance."
  *   **Status:** **False / Too Strong.** It makes promising morally untenable (e.g., promising to meet for lunch binds even if your child falls ill).
  *   **Verdict:** **Supports the Group (too much).** It vindicates their slogan but at the cost of making the practice absurd.

  ***

  ### Conceptual Geography: One Claim or Two?

  You asked whether a single reading backs both your friend's use (the movers) and your flatmate's use (the grave), or if the slogan conflates two distinct claims.

  **It is likely a conflation.** The phrase is doing two different jobs in the two cases, held together only by a shared rejection of consequentialism.

  1.  **In the Mover Case (What is Owed):** The claim is about **Substitutability**. Your friend argues that the *person* is part of the promise. You argued that the *outcome* is the promise. "A promise is a promise" here means "You promised *action X*, not *result Y*." This supports the **Performance Claim (#3)**.
  2.  **In the Grave Case (Who Knows):** The claim is about **Visibility**. Your flatmate argues that obligation exists without an audience. You argued (implicitly) that obligation tracks expectation. "A promise is a promise" here means "The duty exists even if no one is there to enforce it." This supports the **Non-Instrumental Claim (#5)**.

  **The Unifying Thread:**
  The single reading that covers both is the **Content-Independence Claim (#2)**. In both cases, you are arguing that external factors (better movers / no observers) should dissolve the obligation. The group is arguing that the obligation is *sui generis*—it creates a reason that stands apart from the utility of the act or the scrutiny of the audience.

  ### The Problem with Your "Switch" Theory

  Your theory—that promising hands the promisee a switch they did not have before—is elegant, but it faces a specific geographical hazard in your second case.

  *   **In Case 1:** Your theory works well. You did not ask for the switch to be flipped (release), so you remained bound. The friend's slogan supports this: the switch exists, but it wasn't used.
  *   **In Case 2:** Your theory struggles. If the obligation depends on the promisee holding the switch, what happens when the promisee dies? Can the dead hold standing?
      *   If you say **yes**, you must explain how a non-existent agent holds a normative power.
      *   If you say **no**, then the obligation must have transformed into something else (a duty to memory, or a duty to oneself), which undermines the idea that the *promisee's* switch is the defining feature of promissory obligation.

  **Recommendation for the Group:**
  Suggest that "a promise is a promise" is a placeholder for **Non-Instrumentalism**. It asserts that the normativity of promising comes from the internal structure of the practice (the creation of a duty), not from the external consequences (utility, expectations, or surveillance). This validates your flatmate's grave case and your friend's mover case, but it requires you to abandon the "expectations" defense in the mover case. You can keep your "switch" theory, but you must admit that the switch, once handed over, creates a duty that persists even if the switch-holder is no longer there to use it.
