answer: |-
  **Dissertation Prospectus**

  **Title:** The Exaptation Threshold: Graded Function Ascriptions and the Contrastive Structure of Biological Explanation

  **The Central Research Question**

  The central question driving this dissertation is: **Does the phenomenon of traits caught mid-exaptation necessitate a graded, time-indexed ontology of biological function, or can standard binary accounts (etiological or causal-role) accommodate these cases through minor revision without losing explanatory power?**

  This question is designed to be falsifiable. It is possible that upon rigorous analysis, the "mid-exaptation" cases can be resolved by sharpening the binary definitions of existing theories—for instance, by arguing that a trait retains its old function until the new selection pressure reaches a specific, definable fixation point. If such a binary threshold can be established without arbitrariness, my proposed graded model is unnecessary. Conversely, if the binary models require ad-hoc exceptions to handle transitional traits, the argument for a graded ontology gains traction. The dissertation does not presuppose that pluralism is correct; it investigates whether the *structure* of the biological phenomenon forces a change in the *structure* of the philosophical concept.

  **The Problem: A Logical Gap in Function Ascription**

  The debate over biological function is typically framed as a conflict between two camps. The etiological camp argues that a trait's function is determined by its selection history: a heart functions to pump blood because ancestors pumped blood and survived. The causal-role camp argues that function is determined by current contribution: a heart functions to pump blood because that is what it currently does to maintain the organism's viability.

  Standard counterexamples usually favor one side over the other. Vestigial organs favor etiological accounts (they have a history but no current use). Novel mutations favor causal-role accounts (they have a current use but no history). However, these are static cases. The literature reaches a stalemate because it largely ignores dynamic cases: traits currently undergoing exaptation.

  Consider a trait selected for Role A in the past, which currently contributes causally to Role B. Role B is currently weakly fitness-enhancing but is becoming stronger across generations. This is not a vestigial trait (it is useful), nor is it a fully adapted trait (the history is wrong). In this transitional window, the binary theories collide. The etiological account must say the function is A, even if A is disappearing. The causal-role account must say the function is B, even if B is not yet the reason the trait is maintained in the gene pool.

  Existing positions leave this open because they treat function as a binary switch: a trait either has a function or it does not, and it is either Function X or Function Y. This binary assumption hides the temporal dimension of evolution. Evolution is a process, not a sequence of snapshots. By forcing a binary label on a continuous process, current theories create a Sorites paradox. At what exact generation does the function switch from A to B? If we cannot identify a non-arbitrary threshold, the binary concept fails to map onto the biological reality it intends to explain.

  My hypothesis is that this is not merely an epistemic limitation (we don't know when the switch happens) but an ontological one (there is no switch). The conflict between etiological and causal-role accounts arises because they are answering different contrastive questions. The etiological account answers, "Why does this trait have this form rather than the alternatives?" The causal-role account answers, "What does this trait contribute to the containing system's capacity?" In stable traits, these answers converge. In mid-exaptation traits, they diverge. The dissertation argues that acknowledging this divergence requires moving from a binary ontology to a graded one, where function ascriptions are time-indexed and weighted by selection pressure.

  **The Proposed Solution: Contrastive Questions and Graded Ascriptions**

  The core argument of the dissertation is that the etiological vs. causal-role fight is a category error resulting from asking a single "What is the function?" question when two distinct questions are being asked. Resolving this does not require a simple pluralist compromise ("everyone is a bit right"). Instead, it requires a structural correction to how function is ascribed during evolutionary transitions.

  I propose a model of **Transitional Function Ascription**. Under this model, function is not a property that a trait possesses in a binary sense, but a relation between a trait, a system capacity, and a temporal window of selection pressure.

  1.  **Contrastive Clarification:** I will demonstrate that etiological explanations are inherently contrastive (Why X rather than Y?), while causal-role explanations are constitutive (How does X contribute to Z?). When these contrast classes shift during exaptation, the function ascription must shift gradually.
  2.  **The Grading Metric:** I will develop a metric for grading function based on the strength of selection pressure. A trait's function is "mostly A" when historical selection pressure for A outweighs current selection pressure for B. It becomes "mostly B" when the current fitness contribution of B exceeds the historical inertia of A.
  3.  **Time-Indexing:** Function statements must be implicitly or explicitly time-indexed. To say "The function of the swim bladder is buoyancy" is incomplete without specifying the evolutionary timeframe, as the trait may have originated as a lung.

  This approach avoids the "everyone is a bit right" trap by arguing that the binary view is not just incomplete, but actively misleading during transitional phases. It posits that the vagueness in function talk is not a defect of language to be eliminated, but a necessary feature of representing evolutionary processes.

  **Methodology: Conceptual Analysis and Toy Modeling**

  Since this project is in the philosophy of biology, I cannot run wet-lab experiments. However, "conceptual analysis" is too vague a descriptor for the committee. My method is **Formalized Conceptual Modeling**.

  This involves two distinct but integrated procedures:

  1.  **Logical Reconstruction of Case Studies:** I will take canonical and novel cases of exaptation (e.g., feather evolution, bone ossification patterns, metabolic pathway co-option) and reconstruct the function ascriptions required by etiological and causal-role theories. I will then formalize the conditions under which each theory assigns a function. This is not a survey of literature, but a logical stress-test. I will treat the theories as formal systems with inputs (history, current capacity) and outputs (function ascription).
  2.  **Toy Modeling of Selection Thresholds:** I will construct logical "toy models" of evolutionary transitions. These are simplified, abstract representations of a trait moving from Role A to Role B over *n* generations. I will manipulate variables such as selection coefficient strength, generation time, and environmental stability.
      *   *Goal:* To determine if a binary switch point can be logically derived from these variables.
      *   *Test:* If the toy model shows that any binary threshold is arbitrary (i.e., small changes in input lead to disproportionate changes in output), this supports the graded ontology. If the model shows a natural "tipping point" where selection pressure for B decisively overtakes A, the binary view is vindicated.

  This method allows me to test the coherence of the concepts without needing empirical data. The "data" is the logical consistency of the function ascriptions against the constraints of evolutionary theory. I am testing the *concept* of function against the *logic* of natural selection.

  **Plan of Work and Timeline**

  The dissertation will be completed over 18 months, structured into three phases.

  **Months 1-6: Logical Reconstruction and Model Building**
  *   **Months 1-2:** Finalize the formal definitions of Etiological and Causal-Role accounts. Strip away extraneous philosophical commitments to isolate the core logical conditions for function ascription.
  *   **Months 3-4:** Develop the "Mid-Exaptation" case class. Select three detailed biological case studies to serve as the testbed. Ensure these are cases where the transition is well-documented enough to estimate selection pressures.
  *   **Months 5-6:** Construct the Toy Models. Create the abstract logical frameworks that simulate the transition from Role A to Role B. Run the logical "simulations" to see where binary accounts break.

  **Months 7-12: Argument Development and Drafting**
  *   **Months 7-9:** Draft the core chapters. Chapter 1 will establish the contrastive nature of the questions. Chapter 2 will present the failure of binary accounts in the toy models. Chapter 3 will introduce the Graded/Time-Indexed model.
  *   **Months 10-12:** Stress-test the Graded Model. Anticipate objections regarding vagueness and operationalizability. Refine the metric for grading selection pressure.

  **Months 13-18: Revision and Defense Preparation**
  *   **Months 13-15:** Full draft completion. Circulate to committee.
  *   **Months 16-18:** Revisions based on feedback. Focus on tightening the link between the toy models and the philosophical conclusion. Prepare for defense.

  **The Finished Result**

  The finished dissertation will be a monograph of approximately 80,000 words. It will not end with a plea for tolerance between the two camps. It will conclude with a specific recommendation for how biologists and philosophers should phrase function claims.

  The positive result will look like a set of necessary conditions for making valid function ascriptions in transitional contexts. It will provide a vocabulary for distinguishing between "historical function," "current capacity," and "emergent function," showing that these are not competing truths but different coordinates on a temporal map.

  If successful, the dissertation will demonstrate that the Sorites paradox in biological function is not a puzzle to be solved by finding the precise grain of sand that makes a heap, but a signal that "heap" (or "function") is the wrong kind of concept for the job. The result will be a shift from asking "What is the function?" to "What is the function relative to this selection window?"

  **Failure Conditions and Risks**

  It is vital to specify how this project could fail, as per committee guidelines. There are three primary failure conditions.

  1.  **The Binary Vindication:** The toy models might reveal that evolutionary transitions are not as smooth as assumed. If it turns out that selection pressure typically acts in discrete, punctuated bursts rather than gradual gradients, a binary threshold might be biologically justified. If a natural "tipping point" exists where selection for B decisively overrides history for A, my argument for a graded ontology collapses. In this case, the etiological account (with a refined threshold clause) would be sufficient.
  2.  **The Relocation of Vagueness:** This is the most significant philosophical risk. My proposal argues that we should accept graded functions to handle the Sorites paradox. However, critics may argue that this merely relocates the vagueness one step back. Instead of asking "When does the function switch?", we are now asking "How much selection pressure constitutes 'mostly' B?" If I cannot provide a non-arbitrary metric for grading the selection pressure, I have not solved the vagueness problem; I have just dressed it up in quantitative language. If I cannot define the units of "functional weight" without circularity, the graded model is empty.
  3.  **Explanatory Impotence:** A concept of function must do explanatory work. If the graded model makes function ascriptions so complex that biologists cannot use them to explain organismal design, the model fails pragmatically. If saying "This trait has 0.6 function A and 0.4 function B" adds no predictive or explanatory power over simply saying "It's complicated," then the philosophical refinement is gratuitous. The dissertation fails if the graded model cannot be shown to clarify biological explanation better than the binary models it seeks to replace.

  **Mitigation of Risks**
  To mitigate the "Relocation of Vagueness" risk, I will not attempt to eliminate vagueness but to formalize it. I will argue that explicit vagueness is superior to hidden binary thresholds. To mitigate "Explanatory Impotence," I will anchor the toy models in real biological metrics (e.g., selection coefficients) to show that the grading is not merely metaphorical but tracks measurable evolutionary dynamics.

  **Conclusion**

  This dissertation moves beyond the stalemate of the etiological vs. causal-role debate by changing the terrain. By focusing on the dynamic case of mid-exaptation, it forces the question of whether our concepts of function are static mirrors of a dynamic world. The method combines rigorous conceptual analysis with logical modeling to test the limits of binary ascription. The stakes are high: if successful, this work clarifies how we explain the history of life's design. If it fails, it will likely demonstrate that binary accounts are more robust than they appear, or that the vagueness of function is ineradicable. Either outcome resolves a persistent ambiguity in the philosophy of biology.
