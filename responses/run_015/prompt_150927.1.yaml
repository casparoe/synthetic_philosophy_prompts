answer: |-
  Lange's model theoretically solves static allocation (A) but fails discovery (B) where Mises's objection remains decisive; your "closed-loop blindness" is best classified as Hayek's distinct knowledge problem regarding the generation of new information rather than Mises's accounting problem restated; therefore, Hayek's argument constitutes a separate epistemological critique that survives even if Lange's computational procedure is accepted as valid.

  Regarding the first point, Lange's iterative procedure is logically sufficient for job (A) but structurally incapable of job (B). In distributed systems terms, Lange proposes a centralized coordinator that runs a gradient descent algorithm on a known objective function, using shadow prices as the loss signal to converge on an optimal state. If the state space, constraints, and utility function are fixed and known, this control loop can theoretically reach equilibrium, meaning Mises's claim that calculation is *impossible* is too strong for static allocation. However, job (B) requires exploring the state space itself—finding new variables, new constraints, or new dimensions of utility. Lange's managers are instructed to follow rules (minimize cost given prices), which incentivizes compliance within the model but penalizes deviation from it. Without private property, there is no residual claimant to bear the risk of testing a hypothesis that lies outside the planner's current model. Mises's objection collapses on (A) if you accept shadow prices as valid signals, but it devastates Lange on (B) because the simulation lacks the mechanism to generate the data it needs to update its own topology.

  Your "closed-loop blindness" is not Mises's argument in disguise, but rather a control-theory formulation of Hayek's knowledge problem. Mises's original argument was praxeological: he claimed that without private ownership, there is no genuine exchange, and without exchange, there are no prices to serve as a common unit of account for calculation. His focus was on the *valuation* of known means toward known ends. Your objection concerns the *generation* of the ends and means themselves—the fact that a central controller cannot observe errors it has no sensors for. This aligns with Hayek's later argument that knowledge is not merely dispersed but often tacit and created through the act of experimentation. Hayek argued that the market is not just a calculation engine but a discovery procedure; by restricting action to those who can prove their plan fits the existing model, Lange's system prevents the very experiments that would reveal the model is incomplete. While some interpreters contest this distinction and argue Mises implicitly included the knowledge problem, the logical structure of your objection targets the origin of information, which is Hayek's specific contribution.

  Hayek's knowledge argument is best understood as distinct from Mises's calculation argument, not merely an extension. Mises argued that even with perfect information, a socialist planner lacks the *tool* (market prices derived from property rights) to compute the optimal plan. Hayek argued that even if the planner possesses the *tool* (accepting Lange's shadow prices as valid), they lack the *input data* because knowledge of particular circumstances exists only at the edge nodes and cannot be serialized to the center without loss or distortion. In systems terms, Mises claims the API for economic calculation does not exist without property, while Hayek claims the state is sharded across nodes and cannot be centrally aggregated without losing consistency or latency guarantees. Consequently, Hayek's critique stands even if one concedes that Lange's board could successfully iterate prices; the problem shifts from the inability to solve the equation to the inability to acquire the variables necessary to write the equation.
