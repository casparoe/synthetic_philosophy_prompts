      *   *Moderate:* Modal Structuralism (Hellman) or Fictionalism. These solve the dilemma by *rejecting Platonism*. The user's view is that the dilemma is a problem *for Platonism*. If Platonism is abandoned, the dilemma succeeds in its destructive goal, but the *ongoing tension* might be resolved. Wait, the user says the dilemma is an "unresolved problem for platonism." If Platonism is false, the problem is resolved (by death). So, a successful anti-realist theory counts as a resolution.
