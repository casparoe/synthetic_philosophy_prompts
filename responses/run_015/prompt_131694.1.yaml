      Pair 2 (D>C): 0.1(1) + 0.9(0) > 0.11u + 0.89(0) → 0.1 > 0.11u → u < 10/11.
      Contradiction: u cannot be simultaneously greater and less than 10/11. No utility assignment rationalizes both. This is not risk aversion; risk aversion implies a consistent concave u, but here *no* u works, regardless of curvature.

