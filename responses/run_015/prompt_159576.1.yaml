prompt: |-
  Two people in my department have been going at each other for years about whether the poverty of the stimulus argument actually shows anything, and I want the document they should have produced instead of the arguments they've actually had. One of them — call her the nativist — thinks some version of the argument still does real work: children's input underdetermines the grammar they end up with, so at least some of what they end up with isn't learned from the input, and the interesting question is just how much and what shape it is. The other — call him the rich-input guy — thinks every concrete version of the "poverty" claim has quietly dissolved once you look at actual corpus statistics, that domain-general learning operating over genuinely structured input plus social and pragmatic scaffolding can do the job, and that the nativist keeps moving the goalposts between "no procedure could learn this" and "no procedure anyone has actually built has yet learned this."

  Draft the joint statement of an adversarial collaboration between them. What I want:

  - A numbered agreed-claims section: the things both can sign about what the argument's logical form is (an input-poverty claim plus a learnability claim plus something about what the child's attainment actually is), about what the absence of negative evidence can and cannot establish, about what the classic learnability results in this area actually rule out rather than what people cite them as ruling out, and about what "innate" could mean here — species-typical, canalized, genetically specified, input-independent, unlearned-by-the-mechanisms-currently-on-the-table — since I suspect a good chunk of their fighting is about that word.
  - A disagreements table: rows are cruxes, columns are (a) the issue in neutral wording, (b) the formulation the nativist would accept for her own side, (c) the formulation the rich-input guy would accept for his, (d) a case, measurement, or argument both agree would genuinely bear on it, (e) her prediction, (f) his prediction. Predictions written down in advance, not "further research is needed."
  - A short section saying which parts of the dispute you think are verbal and why, and which are substantive.

  Three things I want built into the cruxes, because these are what I keep coming back to and I don't think either of them has answered them:

  1. A distinction I've been using between *evidential* poverty (the input literally doesn't contain the information) and *procedural* poverty (the information is there but no learner of the child's computational budget and data quantity could get to it). I want them to say which one the argument needs, and whether either has ever been measured.
  2. A "parity of learner" clause: whatever learnability claim gets made has to be stated relative to a class of learners that includes the statistical and neural learners actually on the table now, not the toy ones from the older literature. What happens to the argument under that constraint?
  3. This scenario, which I've been calling the *acquisition margin*: suppose someone actually quantifies the gap between the child's input and the child's attained grammar — bits, or a usable proxy — and it comes out small. Does that settle anything? Both sides write down what number would move them and what number wouldn't, and why.

  Two more hypotheticals to pre-register predictions on, so the table has something concrete in it: (A) a complete verified record of everything one child hears from birth to five — the whole thing, not a sample — used to train a learner with no hand-built grammatical representations and no language-specific priors, and it comes out with the adult grammar including the dependency the nativist says is unlearnable from that input; (B) a community where a language gets passed through one generation of adults who learned it late and imperfectly, with children acquiring from them, and the question is whether the children regularize structure their input doesn't reliably contain.

  Epistemically: tag each agreed claim with how confident both really are (rock solid / confident but for different reasons / agreed only because it was restated into thinness), and flag plainly anything where you're manufacturing a consensus neither of them would actually sign. If the task as I've set it can't be done well — if one of my three gizmos is question-begging, or a crux I'm calling testable isn't, or the whole thing collapses into a verbal dispute with nothing left over — say so directly instead of handing me a polite document full of sentences both sides could sign and neither would mean.
