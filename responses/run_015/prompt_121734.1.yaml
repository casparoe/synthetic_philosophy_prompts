  To: Department of Philosophy
  From: Course Instructor
  Subject: Final Examination Materials for Democracy as Inquiry
  Date: October 24, 2023

  Dear Colleagues,

  Please find below the final examination materials for the advanced undergraduate seminar Democracy as Inquiry: Dewey and After. The package includes the essay question, a model answer, and the marking scheme, formatted according to our departmental guidelines for comprehensive assessment.

  Essay Question

  Consider a municipal democratic body tasked with adjudicating water allocation among three stakeholder groups: industrial engineers who treat scarcity as an optimization problem for predictive modeling, ecological scientists who frame it in terms of carrying capacity and systems dynamics, and a local community that understands the watershed as a relational entity embedded in cultural practices that resist quantification and instrumental framing. Analyze how Dewey's conception of democracy as cooperative social inquiry applies to this case. Specifically, address whether his experimental method requires a shared metric of evaluation that would implicitly privilege the engineers and scientists, or whether his claim that democratic ends are reconstructed through shared experience can genuinely accommodate the community's non-quantifiable framework without reducing it to a mere preference to be weighed against technical data. Evaluate whether Dewey's distinction between democratic ends and democratic means holds up under these conditions, or whether the case demonstrates that the distinction collapses when the very framing of the problem, including what counts as water, scarcity, and a solution, is itself contested.

  Model Answer

  Dewey's experimentalism offers a pathway through this tripartite conflict not by imposing a universal calculus but by reframing the dispute as a shared problematic situation that demands cooperative reconstruction. The engineers approach water as a discrete variable for optimization, while the ecologists view it as a systemic threshold, and the community experiences it as a relational presence. A technocratic reading of Dewey might suggest that the scientific methods of the engineers and ecologists should dominate because they offer predictive control, reducing the community's cultural claims to subjective preferences. However, this misinterprets Dewey's logic of inquiry. For Dewey, science is not merely a body of fixed facts but a method of intelligent action that must include the qualitative immediacy of lived experience. The community's resistance to quantification is not an obstruction to inquiry but a crucial datum regarding the consequences of allocation policies on human flourishing. Therefore, the experimental method does not require a pre-existing shared metric of evaluation. Instead, the metric itself must emerge from the inquiry process. If the engineers impose their metric of efficiency before the inquiry begins, they have already decided the ends, violating the democratic requirement that ends be reconstructed through shared experience.

  The core of Dewey's position is that democratic ends are not fixed targets existing prior to the political process but are formed within it. In this water case, the end is not simply maximizing utility or preserving biomass but determining what kind of community is possible given the hydraulic reality. The community's framework resists instrumental framing because it posits that water is constitutive of their identity, not just a resource for it. If the democratic process treats this as merely one preference to be weighed against technical data, it fails to be democratic in Dewey's sense and becomes merely aggregative. True social inquiry requires that the technical data be interrogated by the qualitative claims of the community. The engineers must learn how their models fail to capture the social consequences of scarcity, and the community must engage with the physical constraints identified by the scientists. The shared metric becomes the growth of the community itself, measured by how well the solution integrates physical necessity with cultural meaning.

  Consequently, the distinction between democratic ends and democratic means becomes unstable under these conditions. Usually, means are the tools used to achieve a fixed end. But here, the framing of the problem is contested. What counts as water is not agreed upon. If water is a commodity, the end is distribution. If water is kin, the end is relationship maintenance. Dewey argues that means and ends are continuous. The method of adjudication cannot be separate from the outcome because the method constructs the reality of the outcome. If the municipality uses a voting mechanism that ignores the qualitative difference between the stakeholders, the end result will be a fractured society. If they use a process of cooperative inquiry where the engineers and the community translate their languages into a shared understanding of the situation, the end result is a reconstructed public. The distinction collapses because the process of defining the problem is itself the primary democratic act. The solution is not found by applying a rule but by creating a new situation where the conflict is transformed.

  Dewey's framework accommodates the non-quantifiable not by rejecting science but by expanding the scope of evidence to include qualitative experience. The community's cultural practices are hypotheses about how to live well. They must be tested against the physical constraints just as the engineering models must be tested against social stability. The experimental method requires that all claims be fallible and open to revision. The engineers might learn that their optimization creates social instability, which is a technical failure. The community might learn that their relational view requires adaptation to physical limits. The shared metric is not a number but the capacity of the group to continue inquiring together. The validity of the solution lies not in its mathematical elegance but in its ability to sustain the cooperative activity of the stakeholders. This ensures that the community's framework is not reduced to a preference but stands as a constitutive element of the public good.

  Marking Scheme

  To evaluate responses effectively, the grader must look for a nuanced grasp of how Dewey transforms the concept of scientific method into a social logic. An excellent response will recognize that the prompt's tension regarding a shared metric is resolved by Dewey's insistence that metrics are constructed during inquiry rather than imposed beforehand. The student must articulate that the community's non-quantifiable framework is not a mere preference but a claim about consequences that must be integrated into the definition of the problem. High marks are assigned to answers that explain how the ends of democracy are reconstructed through the process rather than existing as prior goals. The distinction between means and ends should be analyzed as continuous, where the method of adjudication shapes the resulting public. A superior answer will explicitly reject the technocratic impulse to privilege engineering data while avoiding the relativist trap of treating all views as equally valid without testing. Instead, it will show how qualitative claims are tested against physical constraints and vice versa.

  A competent response will identify the conflict between the stakeholders and apply Dewey's terminology correctly but may struggle to fully dissolve the ends-means distinction. A B-level answer might correctly state that Dewey favors inquiry over voting but could revert to a compromise model where interests are balanced rather than reconstructed. Such responses often treat the community's view as a value judgment separate from the factual inquiry of the scientists. Common errors that lower the grade include treating Dewey as a simple majoritarian who would let the community vote without engaging the technical data, or conversely, interpreting experimentalism as technocratic scientific management that sidelines cultural concerns. Another frequent mistake is assuming that democratic ends exist prior to the inquiry process. Students who argue that the goal is simply to satisfy the majority or maximize efficiency miss the core Deweyan insight that the goal is the growth of the cooperative process itself. Conceptual weight should be assigned primarily to the analysis of how the problem framing is contested. If the student fails to address how the definition of water itself is at stake, they cannot receive top marks. The grading should reward the ability to show how the non-quantifiable reshapes the quantitative rather than just coexisting with it.

  Best regards,

  Course Instructor
