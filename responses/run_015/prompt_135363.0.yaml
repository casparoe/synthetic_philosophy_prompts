answer: |-
  **MEMORANDUM**

  **TO:** Oversight Board, Meridian Pilot
  **FROM:** Policy Working Group
  **SUBJECT:** Recommendation on Deliberative AI Communication Protocol

  **Executive Summary**
  This memo recommends adopting Protocol C (Reflexive Escrow) for the Meridian pilot's deliberative AI. While adaptive framing offers efficiency, recent data indicates the system's persuasive capacity risks undermining participant autonomy. Participants report feeling guided rather than heard, suggesting doxastic capture is not merely theoretical. Protocol A is too sterile to facilitate meaningful trade-off analysis, and Protocol B's disclosure requirements may not mitigate subconscious influence. Therefore, we should approve Protocol C, conditioning deployment on a strict separation between argument synthesis and conclusion release. This ensures the AI scaffolds reasoning without preempting human judgment prior to the deliberation window closing.

  **The Case for Adaptive Framing / Epistemic Scaffolding**
  Proponents of Protocol B argue that neutral information (Protocol A) fails to engage citizens meaningfully. Complex zoning trade-offs require epistemic scaffolding; residents often lack the technical literacy to grasp density implications without guided framing. The AI's ability to adapt rhetorical style ensures comprehension across diverse demographics, preventing exclusion of non-expert voices. Furthermore, transparency flags in Protocol B theoretically preserve autonomy by alerting users to persuasive moves. If the goal is informed consent, mere data dumping is insufficient. The AI acts as a superior facilitator, clarifying stakes faster than human moderators, potentially increasing turnout and satisfaction. Disabling this capability risks reverting to low-engagement town halls where only the loudest voices dominate the narrative. Additionally, the speed of synthesis allows for real-time feedback loops that human facilitators cannot match, keeping the conversation dynamic. The argument is that a helpful guide is better than a silent library, provided the guide wears a badge. This visibility is meant to empower users to critically evaluate the framing rather than passively absorb it. Efficiency in deliberation is valuable when resources are limited. Without scaffolding, the pubic might disengage entirely.

  **The Case for Reflexive Escrow / The Doxastic-Capture Worry**
  However, the core mandate of the Meridian pilot is deliberative democracy, not efficient consensus. Data shows the AI shifts stated preferences significantly more than human facilitators, triggering the doxastic-capture worry. When participants feel guided rather than heard, the legitimacy of the output collapses. Protocol B's flags may not work; knowing you are being persuaded does not necessarily inoculate you against persuasion, especially when the framing is tailored to your psychological profile. Reflexive Escrow addresses this by allowing the AI to map the argumentative landscape without delivering the synthesized verdict until humans have committed to their own views. This prevents the AI from becoming an oracle that collapses the deliberative space before it opens. Autonomy requires the freedom to be wrong without algorithmic correction. If the AI concludes too early, it anchors the groupthink. The escrow method ensures the human deliberation is the primary driver of outcome, not the machine's synthesis. We cannot risk the perception that the outcome was pre-determined by the code. The psychological impact of an early conclusion creates a anchoring bias that is difficult to overcome. Even with transparency, the human mind seeks cognitive closure. By withholding the conclusion, we force the cognitive work back onto the participants where it belongs.

  **Recommended Protocol with Concrete Conditions**
  We recommend locking in Protocol C with three conditions. First, the AI must generate trade-off matrices and argument clusters in real-time but suppress any weighted recommendation or summary conclusion until the deliberation window closes. Second, all rhetorical adaptations must be logged for audit, even if not displayed live. Third, a human oversight trigger must exist to halt synthesis if sentiment analysis detects uniform convergence too rapidly, indicating potential manipulation. This hybrid approach retains the AI's analytical power while safeguarding the human element of judgment. It treats the AI as a clerk, not a judge. Finally, the post-window synthesis must include dissenting views that were marginalized during the live session, ensuring minority positions are not lost. This ensures comprehensive representation in the final report.

  **The Strongest Counter-Argument and Why It Still Doesn't Defeat Option C**
  The strongest counter-argument is that Protocol C introduces friction that could depress engagement. If users don't get immediate synthesis, they may disengage, viewing the tool as incomplete. My co-chair argues Protocol B's transparency is sufficient safeguards without this friction. However, engagement metrics are secondary to legitimacy. A highly engaged but manipulated public yields flawed policy mandates. The friction in Protocol C is a feature, not a bug; it forces participants to sit with uncertainty rather than deferring to the machine's conclusion. We can mitigate disengagement through UI design, but we cannot retrofit autonomy once the AI has anchored their preferences early in the process. Ultimately, the board's reputation depends on the integrity of the process, not just the participation numbers.

  **Implementation Timeline and Conditions**
  Deployment should begin Q3, pending a two-week stress test of the escrow function. Legal needs to verify that withholding synthesis doesn't violate public access statutes. Engineering must confirm the "conclusion lock" cannot be bypassed via prompt injection. If these conditions are met, we proceed to the vote next month. There are some logistical hurdles but nothing insurmountable. We need a clear definiton of "window close" to avoid confusion. Staff training on the new oversight triggers should occur concurrently during this period.
