  Hey, so I'm taking a course on moral and political philosophy and I keep geting confused about the difference between Ulysses contracts and constitutional precommitment, so I was hoping you could help me think through a case where they diverge. By "Ulysses contract approach" I mean the view that a person can make specific precommitments that bind their future self in specific situations, justified by the idea that the future self would regret acting on a temporary impulse. By "constitutional approach" I mean the view that a person can adopt standing rules that govern many situations, justified by the idea that following the rule is better, on balance, than making case-by-case decisions.

  Here's the setup: a doctor has a standing rule (a "constitution") that she never accepts gifts from patients, to avoid conflicts of interest. One day, a patient offers her a handmade quilt that the patient made, and which the doctor's late mother would of loved. The doctor carefully deliberates and decides that she wants to accept the quilt, because it's a personal gift, not a bribe, and it has real emotional significance for her.

  Now, the question is: should the doctor accept the quilt? I want you to work through what the Ulysses contract approach says and what the constitutional approach says, and why. I want you to identify which feature of the case does the work in making the two approaches diverge, and say what happens if that feature is removed. And I want you to say how a defender of the approach that comes out badly would attack the case. If you think the two approaches actually agree on this case, or if you think the divergence is not real, say so plainly instead of trying to force a divergence.
