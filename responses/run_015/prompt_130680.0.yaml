answer: |-
  You have hit on the single most contentious nerve in the contemporary literature on peer disagreement. You are describing a move that many philosophers consider the "fatal flaw" in certain versions of steadfastness.

  Here is the breakdown of the established terminology, a coined label for the specific maneuver, and the boundaries you asked for.

  ### 1. The Established Name: Violating the "Independence Principle"
  In the academic literature (specifically in the work of **David Christensen** and **Adam Elga**), what you are describing is formally known as **violating the Independence Principle**.

  The Independence Principle states that when evaluating whether to revise your belief in the face of disagreement, you must assess your peer's reliability **independently of the disagreement itself.**

  *   **The Rule:** You cannot use the fact that they disagree with you as the *sole* evidence that they are wrong or incompetent.
  *   **The Violation:** If you say, "I know they are smart, but they disagree with me on $X$, so they must be confused about $X$," you are using the disagreement to prove the error, and the error to justify ignoring the disagreement. That is circular.

  ### 2. A Coined Label: "Retroactive Peer Demotion"
  While "violating independence" is the technical constraint, it doesn't capture the *action* your classmates are taking. For your seminar, I suggest calling this **"Retroactive Peer Demotion"** (or **RPD**).

  **Why this name?**
  *   **Retroactive:** You started the conversation assuming they were a peer. You only changed that status *after* hearing their conclusion.
  *   **Demotion:** You are downgrading their epistemic status (from "peer" to "mistaken/inferior").
  *   **The Loop:** It captures the idea that you are rewriting the past conditions of the argument to secure your current victory.

  ### 3. How It Differs from Steadfastness and Stubbornness
  This is crucial for your argument. You need to show that RPD isn't just "being stubborn" or "being steadfast."

  | Concept | Definition | Why it's different from RPD |
  | :--- | :--- | :--- |
  | **Plain Stubbornness** | Psychological refusal to change one's mind. | Stubbornness admits no reason. RPD *creates* a reason ("They aren't a peer"). RPD is an *argument*, stubbornness is a *refusal*. |
  | **Legitimate Steadfastness** | Keeping your belief because you have **independent evidence** of your correctness. | A legitimate steadfast person says: "I see the math, I checked the sources, I know I'm right, so their disagreement is evidence they missed something." They rely on the *evidence for P*, not just the *disagreement*. |
  | **Retroactive Peer Demotion** | Keeping your belief *solely* because you downgrade them based on the disagreement. | The RPD user says: "They disagree, therefore they aren't a peer, therefore I don't have to listen." They rely on the *disagreement* to invalidate the peer, not on independent evidence of the peer's incompetence. |

  **The Edge:** The line is drawn at **Independent Evidence**.
  *   If you think your friend is bad at logic *because* you saw them fail logic tests last week $\rightarrow$ **Steadfast (Permissible).**
  *   If you think your friend is bad at logic *only because* they disagree with you right now $\rightarrow$ **Retroactive Peer Demotion (Fallacious).**

  ### 4. The Edges and Conditions (Your Specific Questions)

  **Does it only happen when both people do it?**
  No. It can be one-sided.
  *   *Scenario:* You conciliate (you lower your confidence), but your friend performs RPD (they downgrade you and stay confident).
  *   *Result:* This creates an **Epistemic Asymmetry**. You become less confident in the truth, while they become more confident in their superiority. This is often how polarization happens in real life.

  **Is it always irrational?**
  Almost always, **yes**, but there is one narrow exception.
  *   **The Irrational Case:** You have no reason to think they are incompetent other than the fact that they disagree. This is circular reasoning (begging the question).
  *   **The Rational Exception:** If you have **independent track-record evidence**.
      *   *Example:* You and a friend are calculating a tip. You are a math major; they have failed every math class they've taken. If they disagree with you, you can downgrade them *without* violating independence, because your evidence of their incompetence exists *prior* to this specific disagreement.
      *   *The Trap:* In philosophy electives, you usually start by assuming you are "peers" (equally smart/informed). If you assume peerhood at the start, you cannot use the disagreement to break it without independent proof.

  **Is it separate from plain bias?**
  It is the **structural mechanism** of bias.
  *   **Bias (Self-Serving Bias):** The psychological urge to think "I am right, they are wrong."
  *   **Retroactive Peer Demotion:** The *epistemic tool* you use to make that bias look rational.
  *   Bias is the engine; RPD is the steering wheel. Bias makes you *want* to dismiss them; RPD gives you the *argument* to dismiss them ("They aren't a peer").

  ### 5. How to Use This in Class
  When you hear someone say, *"Well, if they were really as smart as me, they would agree with me,"* you can intervene with this framework:

  1.  **Identify the Move:** "That sounds like **Retroactive Peer Demotion**."
  2.  **Call the Violation:** "You are violating the **Independence Principle**. You are using the disagreement as the evidence for their incompetence, rather than finding evidence of incompetence independent of the disagreement."
  3.  **The Challenge:** "Do you have evidence they are bad at this topic *other than* the fact that they disagree with you? If not, you're just begging the question."

  ### Summary for your notes:
  *   **Technical Term:** Violating the Independence Principle (Christensen/Elga).
  *   **Coined Label:** Retroactive Peer Demotion (RPD).
  *   **Key Distinction:** Steadfastness requires independent evidence of the peer's error; RPD uses the disagreement *as* the evidence of error.
  *   **Rationality:** Irrational unless you have prior track-record evidence of their incompetence.
  *   **Relation to Bias:** It is the argumentative structure that rationalizes self-serving bias.

  This is a sophisticated observation. In the literature, this is often the main objection raised against the "Right Reasons View" (defended by Thomas Kelly), which argues you can stick to your guns if you actually assessed the evidence correctly. Critics say the Right Reasons View inevitably licenses Retroactive Peer Demotion. You are effectively arguing for the Conciliationist side by exposing the circularity of the Steadfast defense.
