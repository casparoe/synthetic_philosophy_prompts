sary biconditional in (1), indeterminacy transfers: if it is indeterminate whether C(xs), then it is indeterminate whether the xs compose something — that is, indeterminate whether there is a y that the xs compose. (8) But existence is never indeterminate: "there is a y that the xs compose" is determinately true or determinately false, which is what the familiar case against vague identity is supposed to secure, and which I am happy to take for granted. (9) Hence no condition meeting (1) to (3) exists, and the only coherent answers left are "always" and "never" — unrestricted composition or nihilism. And those two say nothing about what it is in virtue of which the xs compose, so they fall foul of (3) as well: the special composition question has no answer at all. There is obviously something wrong here, since the question plainly has an answer and I think it is mine.

