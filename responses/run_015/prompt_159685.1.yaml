  The argument contends that any moderate condition for composition must rely on scalar properties like 'life' or 'cohesion', which inevitably introduce vagueness; since existence cannot be vague, such conditions are metaphysically impermissible, leaving only nihilism or universalism as coherent options.

  There are three plausible candidates for the faulty move. First, one might target (5), denying that biological life is truly continuous and insisting there are natural breaks in nature that provide sharp boundaries. Second, one could challenge (7), arguing that vagueness in the condition C is merely semantic or conceptual and does not transfer to ontic indeterminacy of existence. Third, and most critically, one might reject (6), which claims that any sharp threshold on a continuous scale is arbitrary and thus metaphysically unacceptable. This step assumes that metaphysical precision requires non-arbitrariness in a way that excludes epistemic limits or natural precisifications.

  I commit to rejecting (6). This step looked innocent because it appeals to a powerful intuition: metaphysics should not rest on brute, arbitrary lines where nature appears smooth. It suggests that if we cannot non-arbitrarily specify where composition begins, then there is no fact of the matter. However, this conflates conceptual vagueness with ontic vagueness. To reject (6) is to accept that there is a sharp, mind-independent threshold for composition (and thus for 'life'), even if our concepts and biological measurements cannot locate it precisely. You become an epistemicist about composition: there is a fact of the matter about whether these xs compose a y, even if it is unknowable to us.

  The cost of this diagnosis is that you must abandon the hope that the boundary of an organism is always discoverable or non-arbitrary from a human perspective. You must accept that nature might draw a line where we see a gradient. Consider the alternatives you wished to avoid. Rejecting (2) forces you into conceptualism, making composition mind-dependent and violating your commitment to (1); this saves Organicism only by turning it into a view about our conventions rather than the world. Rejecting (3) allows you to posit a brute threshold, but this surrenders the explanatory ambition of your paper, leaving you with a 'because I say so' metaphysics. Rejecting (8) admits vague existence, which invites the Lewis-Sider objections regarding identity and logic that you rightly wish to avoid. Rejecting (6) is the cheapest price: it preserves the mind-independence of composition and the determinacy of existence, requiring only that you accept limits on our knowledge of the boundary rather than limits on reality itself.

  \answer{Step 6}
