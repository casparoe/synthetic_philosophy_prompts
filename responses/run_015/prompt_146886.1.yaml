answer: |-
  That's a sharp observation about the writers' residencies. The distinction between "produce to earn" and "exist to receive" cuts right to the bone of political philosophy. You've essentially identified the friction between *contributive justice* (you get what you make) and *status-based justice* (you get because you belong).

  Since you asked for a clear separation between what is settled and what is contested, I'll start with a caveat: in normative philosophy, almost nothing is "settled" in the way scientific facts are. There is no consensus on which theory of justice is *true*. However, there is consensus on what specific theories *entail* and on the empirical data regarding human behavior.

  Here is the breakdown of the implicit logic behind unconditional UBI, separating the definitional agreements from the live philosophical fights.

  ### 1. Moral Desert: Need vs. Status
  You asked if UBI presupposes that "need alone creates entitlement." Actually, this is a common misconception.

  **The Logic:**
  If entitlement were based strictly on *need*, the system would be means-tested (like food stamps). By making it *universal* and *unconditional*, UBI explicitly rejects "need" as the primary moral trigger. Instead, it relies on **citizenship** or **common ownership**.

  **Settled Interpretation:**
  Philosophers generally agree that unconditional UBI is not based on "need-based charity." It is based on the idea of a **social dividend**. The premise is that the wealth of a society is generated collectively (through infrastructure, law, technology, past generations), so every member holds a share of that collective equity.
  *   **The Theory:** This aligns most closely with **Philippe Van Parijs's "Real Libertarianism."** He argues justice isn't about rewarding labor; it's about maximizing the "real freedom" of the least advantaged to do what they might want to do.
  *   **The Commitment:** It presupposes that you are owed a share of the social product simply because you are a member of the cooperative scheme that generates it, not because you are needy or because you labored.

  **Contested:**
  Whether this moral claim is *valid* is heavily contested. Critics (often from the Left as well as the Right) argue that without a link to contribution, UBI violates a duty of reciprocity. They argue that if you can live off others' labor without contributing, you are effectively a "free rider," which is unjust.

  ### 2. Luck Egalitarianism: Can They Defend It?
  You asked if a luck-egalitarian can defend UBI without buying into full equality of outcome. This is one of the most technical debates in the field.

  **The Logic:**
  Luck egalitarianism (associated with Ronald Dworkin, G.A. Cohen, Richard Arneson) holds that justice requires compensating people for "brute luck" (things they didn't choose, like being born disabled or into poverty) but *not* for "option luck" (consequences of their voluntary choices, like choosing to surf instead of work).

  **Settled Interpretation:**
  Strict luck egalitarians generally **oppose** unconditional UBI.
  *   **Why?** Because UBI gives money to the "surfing pro" who *chooses* not to work (option luck) just as much as the person who *cannot* work (brute luck). A strict luck egalitarian wants to compensate the disabled worker, not subsidize the voluntary non-worker.

  **Contested:**
  There is a pragmatic branch of luck egalitarians who defend UBI as a **"second-best" solution.**
  *   **The Argument:** Ideally, we would distinguish perfectly between brute luck and option luck. But in reality, the bureaucracy required to investigate everyone's choices (means-testing, job-search logs) is intrusive, stigmatizing, and error-prone.
  *   **The Defense:** Therefore, a luck egalitarian might accept UBI not because it is theoretically perfect, but because it is the least intrusive way to approximate justice without a "nanny state" investigating your personal choices.
  *   **Verdict:** A pure luck egalitarian cannot defend it without contradiction. A pragmatic one can, but only by admitting it's a compromise, not an ideal.

  ### 3. Inheritance Tax vs. UBI: Compatible or Not?
  You noted the tension: we tax inheritance (implying property isn't absolute) but UBI treats need as prior to contribution. Are these compatible?

  **Settled Interpretation:**
  They are **highly compatible** under most modern theories of property, and incompatible only under strict Libertarianism.
  *   **The Link:** Both policies rest on the idea that **property rights are social constructs, not natural facts.**
  *   **Inheritance Tax:** Says, "The state protects your property rights, so the state has a claim on a portion of that wealth when it transfers, especially if the recipient didn't labor for it."
  *   **UBI:** Says, "Because property rights are enforced by the collective (police, courts, markets), the collective is owed a share of the value generated, which is distributed as a baseline."

  **Contested:**
  The incompatibility arises only if you hold a **Lockean Labor-Mixing view** (John Locke/Robert Nozick).
  *   **The Conflict:** If you believe that mixing your labor with resources gives you absolute, pre-political ownership that the state cannot touch, then *both* inheritance tax and UBI are theft.
  *   **The Synthesis:** If you believe property is a convention of the social contract (Hume/Rawls), then taxing inheritance to fund a UBI is perfectly consistent. It's simply adjusting the rules of the game to ensure the game doesn't produce feudal aristocracy on one end and destitution on the other.

  ### 4. Human Nature: Coercion vs. Contribution
  Does UBI presuppose people won't work without coercion, or that they will naturally contribute?

  **Settled (Empirical):**
  We actually have data on this from the trials (Finland, Canada, Stockton, CA).
  *   **Finding:** Unconditional cash does **not** cause mass withdrawal from the labor market.
  *   **Nuance:** There is a small reduction in hours, mostly among secondary earners (parents with young children) and students. People tend to use the security to retrain, care for family, or find better-matched work, rather than stopping work entirely.
  *   **Consensus:** The fear that people will universally choose leisure over survival without coercion is empirically unsupported.

  **Contested (Philosophical):**
  The *interpretation* of why people work is contested.
  *   **View A (The Protestant Work Ethic/Hobbes):** Humans are inherently idle and require the "whip" of necessity to contribute to society. Proponents of this view see UBI as dangerous regardless of the data, because it undermines the *moral discipline* of work.
  *   **View B (Marx/Keynes/Graeber):** Humans are inherently creative and social. We only appear lazy under alienating capitalist conditions. If you remove the threat of starvation, people will still work, but they will shift toward care work, art, community building, or innovation—things the market doesn't currently value.
  *   **The UBI Premise:** UBI proponents generally operate on View B. They assume that "work" is broader than "employment."

  ### Summary of the Implicit Logic

  To answer your core question: An unconditional UBI does not presuppose that "need creates entitlement." It presupposes that **membership creates entitlement.**

  1.  **Distributive Justice:** It rejects "labor-desert" (you get what you earn) in favor of "asset-sharing" (you get a dividend on the society you live in).
  2.  **Luck Egalitarianism:** It is theoretically incompatible with strict luck egalitarianism (which punishes bad choices), but compatible with pragmatic versions that value privacy over perfect accuracy.
  3.  **Property Rights:** It is fully compatible with inheritance tax; both view property as a social convention subject to redistribution for the stability of the whole.
  4.  **Human Nature:** It assumes that while people need security, they do not need coercion to be productive. It bets on intrinsic motivation over extrinsic threat.

  The tension you feel in that dive bar is the friction between viewing society as a **business** (where you only get paid for value delivered) versus viewing society as a **household** or a **commons** (where members are fed because they are members). UBI is the policy expression of the latter.
