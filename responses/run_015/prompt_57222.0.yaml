answer: |-
  This is a classic historiographical problem disguised as a curatorial one. Your medievalist colleague is correct about the *etymology* but potentially wrong about the *ontology*. Just because a map projection is invented in the 19th century doesn't mean the continent it depicts isn't there. However, for a museum wall, you cannot simply assert the continent exists; you have to justify the projection.

  Here is the spec for a theory of periodization that survives the "12-year-old vs. Specialist" test and the "Journalist vs. Panelist" stress test.

  ### Part 1: The Desiderata (The Spec)

  To move a period label from "filing convenience" to "historical claim," the theory must deliver the following. I have separated these into **Non-Negotiables** (requirements for intellectual honesty and empirical adequacy) and **Camp Tastes** (preferences that often disguise themselves as requirements).

  #### Non-Negotiables

  1.  **Asynchronous Coherence (The "Bundle" Requirement)**
      *   *The Case:* As you noted, ploughs, theology, and shipbuilding do not change in lockstep.
      *   *The Requirement:* A period theory must define a period as a *cluster of traits* rather than a simultaneous rupture across all domains. It must allow for "lag" (e.g., Gothic architecture surviving into the "Renaissance").
      *   *Why:* If a theory demands synchronicity, no period exists. The theory must explain *why* these asynchronous changes are bundled together (e.g., "they all reflect a shift in patronage structures").

  2.  **Fuzzy Boundary Tolerance**
      *   *The Case:* No one woke up on January 1, 1500, and felt modern.
      *   *The Requirement:* The theory must treat boundaries as *transition zones* rather than lines. It must specify what constitutes the "core" of the period versus the "edge."
      *   *Why:* Precision here is falsehood. A theory that demands a datable edge forces the curator to lie to the 12-year-old.

  3.  **Explanatory Utility (The "So What?" Test)**
      *   *The Case:* Why call it the "Industrial Revolution" and not just "the 18th century"?
      *   *The Requirement:* The label must do work. It must predict or explain correlations (e.g., "If you are in this period, you are more likely to see urbanization and steam power").
      *   *Why:* If the label adds no predictive or explanatory power over a simple date range, it is merely aesthetic.

  4.  **Reflexive Transparency**
      *   *The Case:* "Middle Ages" is a pejorative term invented by people who hated the Middle Ages.
      *   *The Requirement:* The wall text must acknowledge the *history of the category* alongside the *history of the period*.
      *   *Why:* This satisfies the specialist (who knows the term is constructed) without confusing the 12-year-old (who learns that historians argue about names). It passes the "Journalist Test" by disarming the "gotcha" that these are 19th-century inventions.

  #### Camp Tastes (Pseudo-Desiderata)

  These are often demanded by specific historiographical camps but should be rejected for a general museum gallery.

  1.  **"The Boundary Must Be an Event" (Event-Horizon Bias)**
      *   *Who smuggles it:* Political historians, narrative traditionalists.
      *   *Why it's a prejudice:* It privileges sudden rupture (battles, treaties, deaths) over slow structural shifts (demography, climate, mentalité). A Braudelian would correctly call this a distortion.
      *   *Verdict:* **Reject.** Boundaries should be processes, not dates.

  2.  **"Internal Recognition" (The Phenomenology Trap)**
      *   *Who smuggles it:* Cultural historians, some anthropologists.
      *   *Why it's a prejudice:* It demands that people *inside* the period identify with the label. Nobody in 1450 thought "I am Medieval."
      *   *Verdict:* **Reject.** Periodization is an analytical tool for the observer, not necessarily a self-description for the observed. (Exception: "The Enlightenment," where the label *was* contemporary).

  3.  **"Global Simultaneity" (The Eurocentrism Trap)**
      *   *Who smuggles it:* Generalists, textbook writers.
      *   *Why it's a prejudice:* It assumes "Feudalism" or "Early Modern" applies to Japan, Mexico, and Europe simultaneously.
      *   *Verdict:* **Reject.** Periods should be regionally scoped unless a specific global mechanism (like the Silver Trade or Climate Shift) links them.

  4.  **"Non-Overlapping Nesting" (The Filing Cabinet Bias)**
      *   *Who smuggles it:* Archivists, database managers.
      *   *Why it's a prejudice:* It demands clean boxes. But "The Renaissance" overlaps "The Reformation," which overlaps "The Age of Exploration."
      *   *Verdict:* **Reject.** Overlap is a feature of history, not a bug of the theory.

  ---

  ### Part 2: The Geology Comparison (The Anthropocene Lesson)

  Your colleague's geological analogy is potent, but the conclusion drawn from the Anthropocene rejection needs careful parsing.

  **What Geology Has That History Lacks:**
  Geology has a *physical substrate* (strata) that is globally continuous, even if locally variable. The "Golden Spike" (GSSP) works because you can point to a specific layer of iridium or carbon isotopes in a rock in Crawford Lake and say, "This layer is physically distinct from the one below it." History has no continuous substrate. The "documentary record" is patchy, biased, and discontinuous. You cannot find a "Renaissance layer" in the soil of London that matches the "Renaissance layer" in Florence.

  **What Transfers:**
  The distinction between **Formal Status** and **Descriptive Utility**.
  The International Commission on Stratigraphy (ICS) rejected the Anthropocene as a *formal chronostratigraphic unit* because the signal wasn't clear enough in the rock record *yet*. They did **not** say human impact isn't real. They said, "We cannot ratify this as a official geological epoch *by our current criteria*."

  **The Crucial Insight for the Museum:**
  The Anthropocene case proves that **Formal Ratification $\neq$ Ontological Reality.**
  A period can be "real" (in the sense of describing a genuine shift in conditions) without meeting the criteria for a "Golden Spike."
  *   **For your wall:** You are not seeking a Golden Spike. You are seeking a **Golden Cluster.**
  *   **The Failure Mode:** The Anthropocene failed the *formal* test because the start date (1950) was too arbitrary for the *geological* signal. In history, the failure mode is usually that the *cultural* signal doesn't match the *political* dates.
  *   **Conclusion:** Do not try to defend the "Renaissance" as a hard boundary. Defend it as a "informal but highly useful descriptive unit," exactly as geologists treat the Anthropocene. The lack of a spike doesn't make the concept a lie; it makes it a heuristic.

  ---

  ### Part 3: Impossible Combinations (The "Kill Switches")

  You asked which combinations are jointly unsatisfiable. Here are the two deadly pairs. If your theory demands both, it will collapse.

  **1. Internal Recognition + External Structural Analysis**
  *   *The Conflict:* If you require people to recognize the period ("Did they know they were in the Renaissance?"), you lose almost all structural periods (Feudalism, Industrial Revolution). If you require structural analysis (literacy rates, trade flows), you lose internal recognition (peasants didn't track GDP).
  *   *Which must go:* **Internal Recognition.**
  *   *Argument:* Periodization is a tool for *understanding* the past, not a transcript of how the past felt. Insisting on internal recognition privileges the voices of the literate elite who wrote about "ages" over the silent majority who lived through them.

  **2. Global Scope + Specific Cultural Meaning**
  *   *The Conflict:* You cannot have a period defined by "Humanism" (a specific European cultural movement) that also applies to Ming China.
  *   *Which must go:* **Global Scope.**
  *   *Argument:* It is better to have "The European Renaissance" and "The Ming Restoration" as parallel, non-identical periods than to stretch "Renaissance" until it means nothing.
  *   *The Museum Fix:* Use "Global Early Modern" only when referring to connective tissue (trade, disease, climate), and use specific cultural labels for local developments.

  **The Single Requirement That Knocks Out the Most Accounts:**
  **"Synchronicity of Change."**
  If a theory requires that political, economic, and cultural shifts happen at the same time to validate a period, *every* candidate period fails. History is polyrhythmic. A viable theory must accept that the "Political Middle Ages" might end in 1453 (Fall of Constantinople) while the "Economic Middle Ages" ends in 1600 (Price Revolution).

  ---

  ### Part 4: The Museum Context (Purpose-Relative Adequacy)

  You noted that adequacy is relative to purpose. A research database needs different specs than a wall label.

  *   **Research Period:** Needs high precision, admits high uncertainty, allows for overlapping/competing definitions. (e.g., "c. 1350–1550, contingent on region").
  *   **Database Field:** Needs discrete start/end integers. (This is where the "filing convenience" lives).
  *   **Museum Wall Label:** Needs **Narrative Coherence + Intellectual Honesty.**

  **The Spec for the Wall:**
  1.  **Narrative Function:** The period must serve the story you are telling. If the story is "The Rise of the Individual," the Renaissance is a necessary chapter. If the story is "Continuity of Faith," the Renaissance is a distraction.
  2.  **Hedging Language:** The text must use "so-called," "traditionally," or "historians often group..." to signal the constructed nature without undermining the utility.
  3.  **Visual Correlate:** Since we lack rock strata, the "Golden Spike" for a museum is the **Artifact Cluster.** The period is "real" insofar as the objects in the room share a visual/functional language.

  **The Realism Test (Disagreement):**
  To satisfy your requirement that two panelists must be able to *genuinely disagree* (not just prefer):
  The theory must define the period by **weighted traits**, not necessary conditions.
  *   *Bad Definition:* "The Renaissance is when people started painting realistically." (Falsifiable, rigid).
  *   *Good Definition:* "The Renaissance is a period characterized by a *cluster* of traits: revival of classical texts, linear perspective, humanist patronage, and urban growth."
  *   *The Disagreement:* Panelist A can argue, "This region has the art but not the texts, so it's not fully Renaissance." Panelist B can argue, "The art is weightier than the texts, so it counts."
  *   *Why this works:* They are arguing about the *evidence*, not the *definition*. This makes the period "real" enough to fight over.

  ---

  ### Part 5: Scorecard of Contenders

  Here is how the main philosophical accounts score against the Museum Spec.

  **1. Carve-at-the-Joints Realism**
  *   *Claim:* Periods exist in nature like biological species; we just find them.
  *   *Score:* **Fail.** History has no "joints." Human action is continuous. This view forces the "Datable Rupture" prejudice and fails the Asynchronicity test. It leads to dogmatic wall text that specialists will hate.

  **2. Conventionalism / Useful Fiction**
  *   *Claim:* Periods are entirely invented tools, like time zones.
  *   *Score:* **Pass (with caveats).** It handles fuzziness and asynchronicity well. *Risk:* It can sound too cynical on a wall ("We made this up"). You must frame it as "Useful Map" rather than "Arbitrary Fiction."

  **3. Cluster / Family-Resemblance (Wittgensteinian)**
  *   *Claim:* Periods are defined by overlapping traits, no single one of which is essential.
  *   *Score:* **Winner.** This fits the Museum Spec best. It allows for fuzzy boundaries, regional variation, and asynchronous change. It allows for genuine disagreement (weighting of traits). It supports the "Golden Cluster" approach.

  **4. Narrative View**
  *   *Claim:* A period is real only relative to the story being told (e.g., "The Decline and Fall").
  *   *Score:* **Strong Contender.** Museums are inherently narrative spaces. This justifies *why* you chose *this* periodization for *this* gallery. *Risk:* Can look like propaganda if the narrative is too ideological. Needs to be paired with Reflexive Transparency.

  **5. Longue-Durée Refusal**
  *   *Claim:* Periodization is a distraction; look at centuries of structure.
  *   *Score:* **Fail for Wall Text.** While intellectually robust, it is pedagogically useless for a gallery layout. You cannot hang a "Longue Durée" on a wall without chapters. It works for the intro panel, not the room dividers.

  ### Recommendation for the Panel

  Do not try to prove the "Renaissance" is a natural kind. It isn't.
  Adopt a **Cluster-Narrative Hybrid**.

  **The Wall Text Strategy:**
  1.  **Name the Cluster:** "The Renaissance (c. 1400–1600)."
  2.  **Define the Traits:** "Historians group these centuries based on shifts in art, learning, and trade..."
  3.  **Acknowledge the Construction:** "...though people at the time did not use this name."
  4.  **Acknowledge the Fuzz:** "...beginning earlier in Italy, later in the North."

  This satisfies the medievalist (by admitting the term is later), the specialist (by acknowledging asynchronicity), the 12-year-old (by giving them a handle to grasp), and the journalist (by preempting the "invention" critique). It treats the period as a **tool for thinking**, which is the most honest thing a museum can offer.
