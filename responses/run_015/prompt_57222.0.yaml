prompt: |-
  I'm on the advisory panel for a museum's new permanent history gallery, which means at some point we have to put words on a wall that chop the last two thousand years into chunks. One of the other panelists — a medievalist, extremely good at this — keeps telling me that every label we're floating is a nineteenth-century invention dressed up as a discovery. And he's not wrong about the history of the words: 'Middle Ages' comes from humanists who needed a name for the stretch they happened to be standing outside of, 'Renaissance' only picks up its modern meaning with Michelet and Burckhardt, and the 'Scientific Revolution' is basically a mid-twentieth-century coinage that people like Shapin then spent a career dismantling (he opens his book on the subject by announcing there was no such thing, and then writes the book anyway).

  So before I either argue with him or cave, I want the spec. What does a theory of historical periodization have to deliver for one of our labels to be something more than a filing convenience? Give me the desiderata — everything an account of 'period P is real' has to get right — with the case or consideration behind each one, and be explicit about which are non-negotiable and which are just the taste of one camp.

  The things I'm already unsure count as requirements, for you to sort through:

  - how it handles the fact that nothing changes at the same time. Law, plough design, painting, theology, shipbuilding and life expectancy all move at different speeds in different places, so is a period a simultaneous break across those tracks, or something weaker that still isn't arbitrary?
  - whether the edges have to be datable. Nobody can name the year the Middle Ages ends and I don't think that's a failure of the concept, but I need to know what it would be a failure of, and how much fuzz a real period can absorb before it stops being a period.
  - whether the people inside have to be able to recognise it, given that nobody in 1450 thought they were in the middle of anything.
  - whether a period can be real if it only exists in one region. 'Medieval' is a European word, and pointing it at Japan or Mesoamerica is doing something else entirely — is that a defect in the concept or just a scope limit?
  - nesting and overlap. 'Early modern' swallows the Renaissance whole, and Hobsbawm's long nineteenth century runs 1789 to 1914 while everybody else's stops around 1900. Does the theory have to make those compatible, or to forbid them?
  - the realism test I actually care about: two panelists with different politics have to be able to genuinely disagree about whether a label picks out something, rather than merely having different preferences about where to cut. If a theory can't make that disagreement possible, it's a theory of convenience and we should say so on the wall.

  Here's the comparison case I want you to take seriously, because I think it does a lot of work and nobody in my building has mentioned it. Geology actually has a procedure for this. The International Commission on Stratigraphy defines the boundary of a stage by a golden spike — a physical marker in one named rock section, ratified by a vote — and in 2024, after roughly fifteen years of deliberation, the Quaternary subcommission voted down the proposal to make the Anthropocene a formal epoch. They had landed on Crawford Lake in Ontario with a start date of 1950, and it still got rejected, largely because the sedimentary record is too thin and the proposed start is too recent; the same bodies then cheerfully noted that everyone will keep using the word informally. So: what does a discipline with explicit boundary criteria have that historians lack, which of those criteria could conceivably transfer to human history and which could not, and does the fact that the Anthropocene failed the formal test while surviving as a description show that the formal test and the is-it-a-real-period question come apart? That last bit is where I most want you to push.

  Also flag the pseudo-desiderata. My suspicion is that 'the boundary must be an event' is one of them — a Braudelian would say that's precisely the error, since at the scale of the longue durée almost nothing happens on a date, and the demand for datable rupture just smuggles in a preference for political narrative. Tell me which other demands on a period theory are camp prejudices rather than requirements, and who's doing the smuggling.

  Then: which single requirement knocks out the most candidate accounts, and is any subset jointly unsatisfiable? I'd bet 'recognisable from inside' plus 'has to hold across regions and domains' is already dead, but I want the combinations I haven't spotted, with an argument for which member of each pair has to go. If the list itself turns out to be a result — if no consistent set survives — say that plainly.

  Keep in mind the purpose throughout, since I think adequacy is relative to it: this is a theory good enough to justify text on a museum wall that a twelve-year-old and a specialist will both read, and that has to survive a journalist asking why we're telling the public the Renaissance happened. If the requirements shift when the purpose shifts — a research period versus a teaching period versus a date-range field in a database — tell me where they diverge and which version your list is written for.

  Last, and briefly: how do the main contenders score against it — carve-at-the-joints realism, conventionalism or useful-fiction, the cluster/family-resemblance account, the narrative view on which a period is real only relative to a plot being told, and the longue-durée refusal to periodise at all? A short paragraph each is plenty. The thinking I want is in the requirements and their motivating cases, not in the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Advisory panelist for a museum's new permanent history gallery.
      *   **Problem:** Need to justify historical periodization labels (e.g., "Middle Ages," "Renaissance") on wall text. A medievalist colleague argues these are 19th-century inventions, not "real" discoveries.
      *   **Task:** Define the *desiderata* (requirements) for a theory of historical periodization that makes a label "more than a filing convenience."
      *   **Specific Constraints & Questions:**
          *   Distinguish non-negotiable requirements from "camp tastes."
          *   Address specific uncertainties: asynchronicity of change, datable edges, internal recognition, regional scope, nesting/overlap, and the "realism test" (genuine disagreement vs. preference).
          *   **Crucial Comparison:** Geology (ICS, Golden Spikes, Anthropocene rejection). What transfers? What doesn't? Does formal failure imply ontological failure?
          *   **Flag Pseudo-Desiderata:** Identify demands that are actually prejudices (e.g., "boundary must be an event").
          *   **Impossible Combinations:** Identify which requirements conflict (e.g., "recognizable from inside" + "global scope").
          *   **Purpose:** Museum wall text (public facing, needs to satisfy a 12-year-old and a specialist, survive journalistic scrutiny).
          *   **Scorecard:** Briefly evaluate main contenders (Realism, Conventionalism, Cluster, Narrative, Longue Durée) against the derived requirements.
      *   **Tone:** Intellectual, rigorous, nuanced, practical (museum context), slightly conversational but authoritative.

  2.  **Deconstruct the Core Problem:**

      *   History isn't Geology. Geology has physical strata; history has human actions/meanings.
      *   The "Realism vs. Constructivism" debate is central.
      *   The Museum Context is key: It's not a research paper; it's a pedagogical and narrative tool. It needs *utility* without lying.

  3.  **Drafting the Desiderata (The "Spec"):**

      *   *Requirement 1: Causal/Structural Coherence (The "Why").* A period can't just be a date range; it needs a logic. Why do these years hang together? (Non-negotiable for museum text, otherwise it's arbitrary).
      *   *Requirement 2: Asynchronous Tolerance.* Must handle the fact that art changes faster than law. (Non-negotiable, it's an empirical fact).
      *   *Requirement 3: Fuzzy Boundaries.* Edges don't need to be sharp dates. (Non-negotiable, historically accurate).
      *   *Requirement 4: Explanatory Power.* Does using this label help explain *change*? (Non-negotiable for a history gallery).
      *   *Requirement 5: Reflexivity/Honesty.* Acknowledge the term's history (e.g., "Middle Ages" is a later term). (Non-negotiable for intellectual integrity in a modern museum).
      *   *Requirement 6: Scope Consistency.* Don't apply Euro-centric terms globally without qualification. (Non-negotiable for modern ethics/accuracy).

      *   *Camp Tastes (Pseudo-Desiderata):*
          *   "Datable Rupture" (Event-horizon bias).
          *   "Internal Recognition" (Anachronism trap).
          *   "Global Simultaneity" (Eurocentrism trap).
          *   "Non-overlapping" (Cleanliness bias).

  4.  **Analyzing the Geology Comparison:**

      *   *What transfers:* The need for a defining characteristic (marker), the distinction between formal ratification and informal usage.
      *   *What doesn't:* Physical stratigraphy vs. semantic/semantic layers. Human continuity vs. physical deposition.
      *   *The Anthropocene Lesson:* Formal rejection $\neq$ Ontological falsehood. It means the *formal criteria* (stratigraphic signal) weren't met, not that the *phenomenon* isn't real. For history, this means a period can be "real" (useful, descriptive) without having a "Golden Spike."
      *   *Key Insight:* Geology distinguishes *Chronostratigraphy* (rocks) from *Geochronology* (time). History often conflates them.

  5.  **Identifying Impossible Combinations:**

      *   *Internal Recognition + External Structural Analysis:* People in 1450 didn't know they were "Medieval." If you require them to know, you lose most periods.
      *   *Global Scope + Specific Cultural Meaning:* "Feudalism" works in Europe/Japan, fails elsewhere. "Renaissance" is strictly European.
      *   *Sharp Boundaries + Asynchronous Change:* You can't have both.

  6.  **Developing the "Museum Spec":**

      *   The purpose is *communication*, not just *ontology*.
      *   The theory must support *pedagogy*.
      *   The "Realism Test": Can two experts disagree on the *evidence* for the period, not just the *label*? Yes, if the period is defined by structural shifts (e.g., literacy rates, trade networks) rather than just a name.

  7.  **Evaluating the Contenders:**

      *   *Carve-at-the-joints:* Too rigid for history.
      *   *Conventionalism:* Too cynical for a museum (implies we are lying).
      *   *Cluster/Family Resemblance:* Strong contender. Allows fuzziness.
      *   *Narrative:* Strong contender for museums (stories need chapters).
      *   *Longue Durée:* Good for context, bad for wall labels (too abstract).

  8.  **Refining the Output (Self-Correction during drafting):**

      *   *Check:* Did I address the "12-year-old vs. Specialist" constraint? *Adjustment:* Ensure the language explains *why* we use the labels, not just that we do.
      *   *Check:* Did I handle the Geology/Anthropocene point deeply enough? *Adjustment:* Make sure to distinguish between *formal utility* and *descriptive utility*.
      *   *Check:* Did I identify the "single requirement that knocks out the most accounts"? *Adjustment:* It's likely "Datable Rupture" or "Internal Recognition." I'll argue "Internal Recognition" is the biggest killer of naive realism.
      *   *Check:* Is the tone right? *Adjustment:* Keep it professional but direct. Avoid overly academic jargon where possible, but respect the user's expertise.

  9.  **Final Polish:**

      *   Structure the response clearly: Desiderata, Geology Comparison, Impossible Combinations, Museum Context, Contender Scorecard.
      *   Ensure the "Pseudo-Desiderata" are explicitly flagged.
      *   Make sure the conclusion offers a actionable recommendation for the panel.

  **(Self-Correction Note):** The prompt asks for "which single requirement knocks out the most candidate accounts." I need to be decisive here. I think "Synchronicity across domains" is the biggest filter. If a theory demands law, art, and tech change at once, *no* period survives. I will highlight that.

  **(Self-Correction Note 2):** The prompt asks about the "Realism Test" (disagreement). I need to ensure the proposed theory allows for *factual* disagreement about the period, not just semantic preference. This points toward a "Cluster Concept" with weighted traits.

  **(Self-Correction Note 3):** Geology. The Anthropocene rejection was about *stratigraphic signal*, not *human impact*. I need to make sure this distinction is clear. History lacks the "rock record," so it relies on the "document/artifact record," which is patchy.

  10. **Finalizing the Plan:**
      *   **Intro:** Acknowledge the colleague's point (he's right about etymology, wrong about utility).
      *   **Section 1: The Spec (Desiderata).** Split into Non-Negotiables and Camp Tastes.
      *   **Section 2: The Geology Comparison.** Deep dive on Anthropocene.
      *   **Section 3: Impossible Combinations.**
      *   **Section 4: Museum Context.**
      *   **Section 5: Contender Scorecard.**
      *   **Conclusion:** Recommendation for the wall text.

