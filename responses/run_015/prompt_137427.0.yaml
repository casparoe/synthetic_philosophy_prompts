  - `"contestable_points"`: an array of objects, each with `"location"` and `"why_it_is_debatable"` (string), for passages that are not straightforwardly wrong but rest on a reading of Strawson that someone could reasonably dispute.
  - `"strengths"`: an array of strings naming what the answer genuinely gets right.
  - `"revision_requirements"`: an array of strings, each stating one thing the answer would need in order to reach the next grade band.
  - `"total_marks"`: integer out of 25.
  - `"letter_grade"`: string.
  - `"scale_assumed"`: string stating the conversion you are using from marks to grades, since conventions differ between institutions.
