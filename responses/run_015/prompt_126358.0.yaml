  8.  **Refining the "On a Par" Translation:**
      *   Standard MORL: If $\vec{r}_A \neq \vec{r}_B$ and incomparable, there exists $\vec{w}$ where $J(A) > J(B)$ and $\vec{w}'$ where $J(B) > J(A)$.
      *   "On a Par": For *all* valid $\vec{w}$, $J(A) \approx J(B)$ (within a threshold), BUT $A \neq B$.
      *   Wait, the small improvement argument says $A^+$ doesn't beat $B$. In ML, if $J(A) = J(B)$, then $J(A+\epsilon) > J(B)$.
      *   So, for "Par" to hold in ML, the scalarization function $f(\vec{r})$ cannot be continuous/strictly monotonic. It must have a "dead zone" or be discrete.
      *   *Better analogy:* Quantized rewards? Or a constraint satisfaction problem where both satisfy constraints but differ in unused capacity?
