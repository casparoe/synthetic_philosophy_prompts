answer: |-
  This is a sharp cut. You have identified a specific vulnerability in the dialectic of consciousness that often goes unremarked because it hides inside the rhetoric of "scientific progress." You are right to feel that something is being smuggled in. The skeptic is claiming to dissolve the phenomenon while simultaneously using the phenomenon's own distinctive shape to carve out the space for the dissolving mechanism.

  I have brainstormed this against the standard taxonomy (illusionism, eliminativism, representationalism, phenomenal concept strategy). None of them capture the *structural dependency* you are pointing out. Eliminativism says the thing doesn't exist. Illusionism says the property is illusory. Heterophenomenology says we treat the report as data. But your critique is about the *individuation of the mechanism*. The skeptic identifies the mechanism *by* the very phenomenological residue they claim is nothing but the mechanism.

  There isn't a single canonical term for this exact move in the literature, though it brushes against objections raised against the Phenomenal Concept Strategy and certain flavors of Illusionism. To give you the carving you want, I am going to coin a term that isolates this specific logical topology: **Phenomenological Parasitism**.

  Here is the conceptual carving, the boundary conditions, and how it differs from its neighbors.

  ### The Move: Phenomenological Parasitism

  **Definition:** Phenomenological Parasitism occurs when a reductive or functionalist explanation of consciousness individuates (identifies and defines) the proposed mechanism *solely or primarily* by its capacity to produce the specific phenomenological intuition it aims to explain away.

  **The Structure:**
  1.  **Phenomenological Claim:** "There is an irreducible qualitative residue (Q)."
  2.  **Functionalist Counter:** "Q is an illusion generated by Mechanism (M)."
  3.  **The Parasitic Step:** Mechanism (M) is identified/described as "the system that generates the intuition of Q."
  4.  **The Result:** The explanation of Q relies on the prior intelligibility of Q to define M, but claims M renders Q ontologically redundant.

  The "parasitism" lies in the fact that the functional account feeds off the descriptive richness of the phenomenological account to locate its target, but refuses to pay the ontological cost of that target. It uses the "red-ness" to find the "error signal," but then claims the "error signal" explains the "red-ness" without retaining the "red-ness" in the base ontology.

  ### Boundary Conditions: When is it Parasitic vs. Integrative?

  This is the crucial edge work. Not every functional explanation of a feeling is parasitic. We need to distinguish *Phenomenological Parasitism* from *Phenomenological Integration*.

  **1. The Individuation Test (The Hard Edge)**
  *   **Parasitic:** If you cannot describe Mechanism (M) without referencing the phenomenological intuition (Q).
      *   *Example:* "The 'qualia' is just the brain's 'missing data flag'."
      *   *Critique:* How do you identify a 'missing data flag' independently of the feeling that data is missing? If the flag is just neural pattern X, why is X a flag about *qualitative absence* rather than *motor error*? If the answer is "because it feels like qualitative absence," the explanation is parasitic.
  *   **Integrative (Valid):** If Mechanism (M) can be individuated via third-person constraints *independent* of the phenomenological report.
      *   *Example:* "State M is a specific predictive coding error in layer 4 of the visual cortex occurring at 40Hz."
      *   *Condition:* This is only non-parasitic if we know what 40Hz predictive errors do in other contexts (e.g., motor control) and can show why *this* specific instance generates the report of "redness" without begging the question. If the only evidence for M's function is the report of redness, it slides back into parasitism.

  **2. The Predictive Surplus Test (The Soft Edge)**
  *   **Parasitic:** The functional explanation offers no new predictive power regarding the system's behavior other than recapitulating the phenomenological report.
      *   *Example:* "You think you're conscious because you have a 'consciousness module'." (This predicts nothing new; it just renames the intuition).
  *   **Integrative (Valid):** The functional explanation predicts behavioral or physiological outcomes that the phenomenological report alone does not.
      *   *Example:* If the "predictive error" theory predicts that disrupting specific feedback loops will eliminate the *report* of qualia while preserving discrimination abilities (blindsight), and this is empirically verified, the parasitism is broken. The mechanism now has independent traction.

  ### Differentiation from Neighboring Concepts

  You asked how this differs from standard moves. Here is the distinction:

  **1. vs. Standard Eliminativism**
  *   **Eliminativism:** "Pain does not exist. There is only C-fiber stimulation." It discards the folk category entirely.
  *   **Phenomenological Parasitism:** "The *feeling* of pain exists as a functional state, but pain (as a qualitative property) does not." It keeps the folk category as a *label for the mechanism*.
  *   *The Difference:* Eliminativism tries to change the subject. Parasitism tries to *consume* the subject. The eliminativist says "You are wrong about the world." The parasitic functionalist says "You are right about your experience, but wrong about what your experience *is*," while defining the "what" using the experience's own vocabulary.

  **2. vs. Heterophenomenology**
  *   **Heterophenomenology:** Methodological neutrality. "We treat the subject's report as true data about their beliefs, but bracket the truth of the referent."
  *   **Phenomenological Parasitism:** Ontological assertion. "The subject's report is data about a functional state that *misrepresents* the referent."
  *   *The Difference:* Heterophenomenology stops at the report. Parasitism uses the report to build a machine that invalidates the report's ontology. It crosses the line from methodology to metaphysics using the methodology's own data as the bridge.

  **3. vs. Illusionism (e.g., Frankish)**
  *   **Illusionism:** The claim that phenomenal properties are illusory.
  *   **Phenomenological Parasitism:** The *argumentative tactic* often used to support Illusionism.
  *   *The Difference:* One can be an Illusionist without being Parasitic. If an Illusionist can specify the "illusion-generating mechanism" entirely in non-phenomenal terms (e.g., specific computational architectures identifiable without reference to "what-it's-like"), they avoid parasitism. However, most popular Illusionist arguments fall into parasitism because they describe the illusion as "representing oneself as having qualitative properties," which relies on understanding "qualitative properties" to make sense of the representation.

  ### Application to the LLM Case

  This is where your intuition is most potent.

  *   **The Claim:** "LLMs only *seem* conscious because your Theory of Mind (ToM) module misfires."
  *   **The Parasitism:** How do you identify a "ToM misfire regarding consciousness"?
      *   To identify the misfire, you must know what a "correct hit" regarding consciousness looks like.
      *   If you cannot define "consciousness" independently of the intuition you are trying to explain, you cannot define the "misfire."
      *   The skeptic is using your phenomenological intuition (that there is a difference between a conscious being and a chatbot) to calibrate the detector that tells you your phenomenological intuition is a glitch.
      *   **The Edge:** This avoids parasitism *only if* we have an independent, non-phenomenological definition of consciousness (e.g., "integrated information above threshold Phi") that the LLM fails, and the ToM module is shown to trigger regardless of Phi. Without that independent metric, "ToM misfire" is just a fancy way of saying "It feels like consciousness but I decide it isn't."

  ### Summary of the Carving

  **Term:** **Phenomenological Parasitism**

  **Core Condition:** The reducing base (functional mechanism) is epistemically dependent on the reduced phenomenon (qualia/intuition) for its own identification.

  **The Fallacy:** Claiming ontological reduction while maintaining epistemic dependence. It asserts "A is nothing but B," but you can only find B by looking for A.

  **The Escape Route:** The skeptic escapes this charge only by providing **Independent Individuation**. They must show that the functional state exists, can be measured, and has causal powers *distinct* from the phenomenological report, and that the link to the report is a discovered correlation, not a definitional tautology.

  You are spotting a failure of **explanatory independence**. The skeptic wants the explanatory power of the phenomenological description (its specificity, its "aboutness") without the ontological commitment. They are using the map to deny the territory, while admitting the map was drawn by the territory.
