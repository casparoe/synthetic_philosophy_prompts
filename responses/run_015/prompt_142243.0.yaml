  # JOINT STATEMENT ON THE CAUSAL EXCLUSION ARGUMENT
  **Reading Group: Fall Semester**
  **Signatories: Dev, Nina**
  **Drafted by: [User]**

  ## PREAMBLE: THE MIRA CASE
  We agree to use the following scenario as our fixed reference point for all claims below.
  *   **The Scenario:** Mira signs a petition. She has an occurrent desire to sign (**M**), realized on this occasion by neural state (**P**). **P** is causally sufficient, in the circumstances, for her hand moving (**E**). The production of **E** by **P** involves no further mental states. There is no independent, second cause of **E** waiting to overdetermine it.
  *   **Underspecification Note:** We acknowledge this case leaves the *realization relation* between **M** and **P** underspecified. We do not agree on whether **M** is functionally defined, broadly physical, or primitively distinct. We do not agree on whether **P** is a micro-physical state or a macro-neural state. We proceed assuming **M** and **P** are not identical properties, though they are instantiated in the same event.

  ---

  ## SECTION I: AGREED CLAIMS
  *Both signatories affirm the following claims without reservation.*

  1.  **Physical Causal Closure:** Every physical effect has a sufficient physical cause. In the Mira case, **P** is sufficient for **E** without needing assistance from outside the physical domain. No "vital force" or non-physical energy is added to the system.
  2.  **No Standard Overdetermination:** The relation between **M** and **P** is not analogous to two assassins firing independently at the same target. **M** and **P** are not competing, independent causes in the sense required for classic overdetermination.
  3.  **Property Distinctness:** **M** (the mental property) and **P** (the physical realizing property) are distinct properties, even if they are instantiated by the same particular event. **M** is not reducible to **P** in the sense of synonymy or type-identity.
  4.  **Anti-Epiphenomenalism (Strong):** **M** is not epiphenomenal in the "silly" sense. It is not a causally inert byproduct like the shadow of a moving car. **M** makes a difference to the world, specifically to the truth of our explanations and the predictions of behavior across contexts.
  5.  **The Stakes:** The dispute is not merely about the word "cause." It concerns the metaphysical grounding of **agency** (is Mira the source of the action?), **moral responsibility** (can we blame/praise Mira?), and the **intelligibility of action explanations** (is "because she wanted to" a true report of the world or just a useful fiction?).
  6.  **Causal Pluralism (Methodological):** We agree that "causation" is not a simple, univocal, all-or-nothing relation that can be fully captured by a single intuitive picture (e.g., "transference of energy" alone or "counterfactual dependence" alone). Different causal concepts may be legitimate for different purposes.

  ---

  ## SECTION II: MAP OF RESIDUAL DISAGREEMENTS
  *The following table isolates the specific points of divergence. Row A represents Nina's position; Row B represents Dev's position. Each side affirms their own column and acknowledges the other column as the opposing view.*

  | Topic | **Nina's Claim (Causal Inheritance)** | **Dev's Claim (Causal Compatibilism)** |
  | :--- | :--- | :--- |
  | **1. The Primary Cause** | **P** is the cause of **E**. **M** characterizes the cause but does not strictly cause **E** in the fundamental sense. | **M** is a cause of **E**, co-occurring with **P**. Both **M** and **P** cause **E** without competition. |
  | **2. Causal Sufficiency** | **P** is sufficient for **E**. **M** is not sufficient *independently* of **P**; **M**'s causal power is borrowed from **P**. | **M** is sufficient for **E** (in the circumstances). Sufficiency is not a zero-sum resource; **M**'s sufficiency does not subtract from **P**'s. |
  | **3. The Exclusion Principle** | Accepts a version of Exclusion: An effect cannot have more than one *sufficient* cause unless it is overdetermined. Since **P** is sufficient, **M** is excluded from being a *separate* sufficient cause. | Rejects Exclusion as stated: Causation is not a zero-sum game. **M** and **P** can both be sufficient because they relate to **E** under different descriptions/constraints. |
  | **4. Causal Status of M** | **M**'s causal relevance is **derivative**. **M** causes **E** only in the sense that **P** causes **E** and **P** realizes **M**. | **M**'s causal relevance is **autonomous**. **M** causes **E** in virtue of the counterfactual patterns **M** sustains, regardless of **P**'s metaphysical priority. |
  | **5. Explanation vs. Ontology** | "Mira signed because she wanted to" is **explanatorily true** but **ontologically derivative**. The causal work is done by the vehicle (**P**). | "Mira signed because she wanted to" is **ontologically true**. The causal work is tracked by the content (**M**), not just the vehicle. |

  ---

  ## SECTION III: CRUXES AND TESTS
  *We identify the following sub-questions as load-bearing. Settling any one of these would force a revision of at least one signatory's position. For each crux, we specify a test case and pre-commit to predictions.*

  ### Crux 1: The Interventionist Constraint
  **Question:** Must a cause be something we can, in principle, intervene on independently of its realizer?
  **Test Case:** Consider a world where we manipulate **M** (the desire) without manipulating **P** (the specific neural state), perhaps by swapping **P** for a distinct realizer **P*** that also realizes **M**, while holding the effect **E** constant.
  *   **Nina's Prediction:** An intervention on **M** that leaves **P** fixed is **incoherent**. Since **M** supervenes on **P**, you cannot change **M** without changing **P**. If interventionism requires this, interventionism is the wrong theory of causation for the mental.
  *   **Dev's Prediction:** The intervention is **coherent** at the level of variables. We can intervene on the variable *Desire* without fixing the variable *Neural-State-Type*. If interventionism forbids this, interventionism is too narrow, not causation.

  ### Crux 2: Proportionality and Grain
  **Question:** Must a cause be "proportional" to its effect (containing neither too much nor too little detail)?
  **Test Case:** Compare **P** (specific neural firing pattern) and **M** (general desire) against **E** (signing). Suppose **P** includes micro-details irrelevant to **E** (e.g., exact ion exchange rates that could vary without changing the signing).
  *   **Nina's Prediction:** **P** is the cause regardless of excess detail. Causal production does not require proportionality. **P** necessitates **E**; the extra detail is harmless.
  *   **Dev's Prediction:** **M** is the *better* cause because it is proportional. **P** is "too specific." If causation requires tracking the pattern stable across variations in **P**, then **M** is the genuine cause and **P** is merely the mechanism.

  ### Crux 3: The Generality Problem (Special Sciences)
  **Question:** Does the Exclusion Argument apply equally to all higher-level properties (droughts, recessions, bridge flaws)?
  **Test Case:** "The drought caused the famine." The drought is realized by micro-physical states. Those micro-states are sufficient for the famine (via particle collisions, etc.).
  *   **Nina's Prediction:** The argument **does apply**. The drought's causal status is inherited from the micro-physical states. We must accept that strictly speaking, the micro-physics does the work, and "drought" is a useful shorthand for a complex physical pattern.
  *   **Dev's Prediction:** The argument **fails** here too. If Exclusion kills the drought's causation, Exclusion is *reductio ad absurdum*. Droughts are genuine causes. Therefore, Exclusion must be false for minds too.

  ### Crux 4: The CS Postdoc's Duplicate (Content vs. Vehicle)
  **Question:** Does causal work track the physical vehicle or the mental content?
  **Test Case:** **Twin Mira**. A molecule-for-molecule duplicate of Mira. She has state **P** and produces **E** (signing). However, due to externalist factors (e.g., Twin Earth), her state **P** has **no content** (or different content **M***).
  *   **Nina's Prediction:** The causal story is **identical**. Twin Mira's signing is caused by **P** exactly as Mira's was. The absence of **M** (content) changes the explanation but not the causal mechanics. Causal work tracks the vehicle.
  *   **Dev's Prediction:** The causal story **differs**. For Mira, "She signed because she wanted to" is true. For Twin Mira, it is false. If the truth of the causal claim changes, the causal facts have changed. Causal work tracks the content (or the counterfactuals tied to content), not just the vehicle.

  ### Crux 5: Pragmatics vs. Metaphysics
  **Question:** Is the causal status of **M** a matter of metaphysical fact or pragmatic utility?
  **Test Case:** A Laplacian Demon predicts **E** perfectly using only **P**-descriptions. It never uses **M**-descriptions.
  *   **Nina's Prediction:** The Demon's picture is **metaphysically complete**. **M** adds nothing to the causal ontology, only to our ability to understand the Demon's output. **M**'s status is pragmatic.
  *   **Dev's Prediction:** The Demon's picture is **causally impoverished**. It misses the generalizations that make **E** an action rather than a reflex. **M**'s status is metaphysical; the Demon is ignoring real causal structure by ignoring **M**.

  ---

  ## SECTION IV: DIAGNOSTIC NOTE ON VERBAL DISPUTES
  *We acknowledge that some portion of our disagreement may be verbal. We agree to the following diagnostic:*

  1.  **The Word "Cause":** We suspect Nina uses "cause" to mean *fundamental physical producer*, while Dev uses "cause" to mean *difference-maker in a stable pattern*.
      *   **Residual Substance:** If we ban the word "cause" and replace it with "fundamental producer" (Nina) and "explanatory difference-maker" (Dev), we still disagree on whether **M** is *only* an explanatory difference-maker or if explanatory difference-making is itself a form of ontological causation.
  2.  **The Word "Distinct":** We suspect Nina treats **M** and **P** as distinct *concepts* but potentially the same *ontological ingredient*, whereas Dev treats them as distinct *ontological ingredients* (properties) that can overlap.
      *   **Residual Substance:** Even if we agree on property distinctness, we disagree on whether distinct properties can *both* be sufficient for the same effect without one being subordinate to the other.
  3.  **The Word "Sufficient":** We suspect Nina treats sufficiency as *necessitation in the micro-physical laws*, while Dev treats sufficiency as *counterfactual robustness*.
      *   **Residual Substance:** Clearing this up does not solve the problem. It merely clarifies that Nina thinks micro-physical necessitation trumps counterfactual robustness, while Dev thinks counterfactual robustness is the primary marker of causation.

  **Conclusion:** Once verbal ambiguities are cleared, the substantive disagreement remains: **Is the causal efficacy of the mental intrinsic to the mental level (Dev), or is it entirely borrowed from the physical level (Nina)?** We agree to resume discussion next term focusing on Crux 2 (Proportionality) and Crux 4 (The Duplicate).
