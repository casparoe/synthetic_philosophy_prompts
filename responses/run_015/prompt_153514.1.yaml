  *(Self-Correction during final review)*: Make sure Marcus doesn't sound like a postmodern cliché. He needs to sound like a sophisticated anthropologist/philosopher. Elena needs to sound like a rigorous analytic philosopher, not just a common-sense moralist. The "engineer" background of the user suggests he'll appreciate precision in the analogy of measurement.

