prompt: |-
  I've been trying to figure out what a bayesian account of old evidence actually has to deliver, and I want the full spec before I read any more papers. Write me the desiderata list: what must any adequate theory of old-evidence updating get right?

  Specifically it needs to cover the standard glymour-style case where you learn something you already knew and conditionalization does nothing, the 'forgotten prior' case where your beleif state was formed with E in the background but you lost track, and this other situation I'm going to call stale archive — a dataset collected under a rejected model gets rediscovered and needs integrating with current beliefs. For each requirement say why it's there, mark non-negotiable vs camp preference, and tell me if there's any pair that can't both be satisfied.

  Also: what distinction can't it collapse? Like between genuinely old and just apparently old? Between prior revision and beleif revision? And which one requirement kills the most standard fixes?

  Then briefly score the naive conditionalization answer, the prior-revision story, and a framework-relative approach against the list. Don't need a bibliography, I just want the logic mapped out. If some subset of these desiderata is jointly impossible given basic probability axioms, say so — that's the part I actually care about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Topic:** Bayesian account of old evidence (the problem of how new theories gain confirmation from evidence already known).
      *   **Task:** Create a "desiderata list" (requirements) for an adequate theory.
      *   **Specific Cases to Cover:**
          1.  Standard Glymour-style (E known, H new, $P(E)=1$, conditionalization fails).
          2.  Forgotten Prior (E was background, agent lost track of that, now "re-learns" relevance).
          3.  Stale Archive (Data collected under rejected model, rediscovered, needs integration).
      *   **Requirements for Each Desideratum:** Explain *why*, mark *Non-Negotiable (NN)* vs. *Camp Preference (CP)*, identify *Incompatibilities* (if any).
      *   **Distinctions:** What distinctions must *not* collapse (e.g., genuinely old vs. apparently old, prior revision vs. belief revision).
      *   **Killer Requirement:** Which requirement kills the most standard fixes?
      *   **Scoring:** Briefly score Naive Conditionalization, Prior-Revision, and Framework-Relative approaches against the list.
      *   **Constraint:** No bibliography, focus on logic.
      *   **Crucial Question:** Is any subset of these desiderata jointly impossible given probability axioms? (This is the user's core interest).

  2.  **Analyze the "Old Evidence" Problem (OEP):**

      *   *Core Issue:* In standard Bayesianism, confirmation is increase in probability via conditionalization: $P_{new}(H) = P_{old}(H|E)$. If $E$ is already known, $P_{old}(E) = 1$. Then $P_{old}(H|E) = P_{old}(H)$. No confirmation occurs. But historically (e.g., Mercury's perihelion confirming GR), old evidence *does* confirm new theories.
      *   *The User's Twist:* They want to include "Forgotten Prior" and "Stale Archive" cases, which broaden the scope beyond just Glymour's original logical omniscience problem.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Confirmation Possibility.* The theory must allow $P(H)$ to increase given $E$, even if $E$ was known. (NN).
      *   *Desideratum 2: Logical Omniscience Relaxation.* Agents aren't logically omniscient. They learn logical relations ($H \to E$) later than $E$. (NN).
      *   *Desideratum 3: Context Sensitivity (The "Stale Archive" case).* The theory must handle data whose *provenance* matters. If data was generated by a broken instrument (rejected model), it shouldn't confirm a new theory the same way as clean data. (NN).
      *   *Desideratum 4: Diachronic Coherence.* Updating shouldn't violate Dutch Book arguments *too* egregiously. You can't just change probabilities willy-nilly. (CP/NN mix).
      *   *Desideratum 5: Distinction Preservation.* Must distinguish between learning $E$ and learning "$H$ entails $E$". (NN).

      *Refining for the User's Specific Cases:*
      *   *Glymour:* Needs to handle $P(E)=1$.
      *   *Forgotten Prior:* Needs to handle "re-calibration" of the background.
      *   *Stale Archive:* Needs to handle model-dependence of evidence.

      *Let's formalize the list:*
      1.  **Positive Confirmation:** $P_{post}(H) > P_{pre}(H)$ despite $P_{pre}(E) \approx 1$. (NN)
      2.  **Learning as Relation-Discovery:** The update event is learning the probabilistic/logical link between $H$ and $E$, not learning $E$ itself. (NN)
      3.  **Provenance Sensitivity (Stale Archive):** The confirmatory power depends on the reliability of the process generating $E$, not just $E$'s truth. (NN)
      4.  **Recoverability (Forgotten Prior):** If I forgot $E$ was background, the theory must allow me to reconstruct the counterfactual "what if I didn't know $E$?" without magical time travel. (CP)
      5.  **Coherence:** The updating rule must preserve probabilistic coherence (sum to 1, etc.). (NN)

  4.  **Identifying Incompatibilities (The "Impossible Theorem" Check):**

      *   *The Big Tension:* Standard Probability Axioms + Conditionalization + $P(E)=1$ $\implies$ No Confirmation.
      *   To get Confirmation, you must break one of those three.
      *   *Breaking Axioms:* Not an option (not Bayesian).
      *   *Breaking Conditionalization:* This is the standard move (Jeffrey Cond, or counterfactual priors).
      *   *Breaking $P(E)=1$:* This is the "fictionalist" move (pretend we didn't know $E$).
      *   *The Conflict:* **Provenance Sensitivity** vs. **Standard Likelihoods**. In standard Bayes, $P(E|H)$ is a property of $H$ and $E$. In "Stale Archive", $P(E|H)$ depends on the *history* of $E$'s collection. Standard Bayes is ahistorical.
      *   *The Conflict:* **Diachronic Coherence** vs. **Prior Revision**. If you change your prior $P_{old}$ to $P'_{old}$ to make $P'(E) < 1$, you are technically violating the rule that $P_{new}(\cdot) = P_{old}(\cdot | E)$. You are changing the starting point, not just moving.
      *   *Crucial Impossibility:* You cannot simultaneously maintain **Strict Conditionalization** (updating only on new propositions with $P<1$) and **Positive Confirmation for Known Evidence** (where $P(E)=1$). One must go. Since the user asks for a Bayesian account, Strict Conditionalization is usually the sacrificial lamb, but *how* it is sacrificed matters.

  5.  **Distinctions that Must Not Collapse:**

      *   *Ontic vs. Epistemic:* The truth of $E$ vs. the knowledge of $E$.
      *   *Discovery vs. Justification:* Finding $H$ vs. Testing $H$.
      *   *Prior Revision vs. Belief Revision:* Changing the starting distribution vs. moving through the space.
      *   *Genuinely Old vs. Apparently Old:* Did the agent *actually* have $E$ in the corpus, or do they just think they did? (Important for the Forgotten Prior case).

  6.  **The "Killer" Requirement:**

      *   **Provenance Sensitivity (Stale Archive).** Most solutions (counterfactual priors, ur-priors) treat $E$ as a proposition. They don't care *how* $E$ became known. But if $E$ comes from a "rejected model" (Stale Archive), standard likelihoods $P(E|H)$ might be ill-defined or misleading. This kills simple "pretend $P(E)<1$" fixes because they ignore the *generation mechanism* of the data.

  7.  **Scoring the Approaches:**

      *   *Naive Conditionalization:* Fails immediately on $P(E)=1$. Score: 0/5.
      *   *Prior Revision (Counterfactuals/Garber):* Solves Glymour. Struggles with Stale Archive (doesn't account for data generation history). Struggles with Forgotten Prior (how to reconstruct the counterfactual?).
      *   *Framework-Relative (Van Fraassen/Structural):* Good for Stale Archive (context matters). Good for Forgotten Prior (framework shift). Maybe weak on Diachronic Coherence (looks like rule-changing).

  8.  **Synthesizing the Output:**

      *   Structure:
          1.  Intro (acknowledging the tension).
          2.  The Desiderata List (with NN/CP, Rationale, Conflicts).
          3.  The Impossible Trinity (The logical constraint).
          4.  Distinctions to Preserve.
          5.  The Killer Requirement.
          6.  Scoring the Candidates.
      *   Tone: Technical, precise, philosophical but logic-focused. No fluff.
      *   *Self-Correction on "Impossible":* Is it *logically* impossible given axioms? Yes, if you hold Strict Conditionalization + $P(E)=1$ + Confirmation. I need to state clearly that a Bayesian account *must* relax Strict Conditionalization or the interpretation of $P(E)=1$.

  9.  **Refining the "Stale Archive" Desideratum:**
      *   This is the user's specific addition. It implies that evidence isn't just a proposition $E$, but a pair $(E, M_{gen})$ where $M_{gen}$ is the model under which it was generated.
      *   Requirement: The confirmatory weight must vary based on $M_{gen}$, even if $E$ is identical.
      *   Conflict: Standard Bayes says $P(H|E)$ depends only on $P(H)$, $P(E)$, $P(E|H)$. It has no slot for "history of $E$".
      *   Resolution: The likelihood term must be expanded to $P(E | H, \text{Context})$.

  10. **Final Review against User Prompt:**
      *   Cover Glymour? Yes.
      *   Cover Forgotten Prior? Yes.
      *   Cover Stale Archive? Yes.
      *   Why/NN/CP for each? Yes.
      *   Incompatibilities? Yes.
      *   Distinctions not to collapse? Yes.
      *   Killer requirement? Yes.
      *   Score the 3 approaches? Yes.
      *   Joint impossibility check? Yes.

      *(Self-Correction during drafting)*: Make sure to emphasize that "Bayesian" doesn't necessarily mean "Strict Conditionalization on Logical Propositions." It can mean "Coherent degrees of belief updated via some rule." But the tension remains.

      *Wait, one nuance on "Forgotten Prior":* If I forgot $E$ was background, I effectively treat it as new. The problem is reconstructing the *justification*. If I just treat it as new, I violate the "Genuinely Old" distinction. The theory needs to handle the *recovery* of the status.

      *Wait, one nuance on "Stale Archive":* This is essentially the "theory-ladenness of observation" problem. If the data was processed by a model we now reject, is the data still valid? A Bayesian theory needs to handle "de-contaminating" the data.

      *Let's finalize the "Impossible" claim:* The impossibility lies in satisfying **Strict Conditionalization**, **Probabilistic Coherence**, and **Old Evidence Confirmation** simultaneously. You must drop Strict Conditionalization.

      *Let's finalize the "Killer":* It's **Provenance Sensitivity**. Counterfactual priors (Garber) fix Glymour but fail Stale Archive because they treat $E$ as an atomic proposition, ignoring how it was derived.

      *Let's write.*
answer: |-
  Here is the specification for a Bayesian account of old evidence, mapped against your three cases (Glymour, Forgotten Prior, Stale Archive).

  ### Part 1: The Desiderata List

  **1. Positive Confirmation (The Glymour Constraint)**
  *   **Requirement:** The theory must allow $P_{post}(H) > P_{pre}(H)$ even when $P_{pre}(E) = 1$ (or $\approx 1$).
  *   **Why:** This is the definition of the problem. If known evidence cannot confirm a new hypothesis, Bayesianism fails to model scientific history (e.g., Mercury confirming GR).
  *   **Status:** **Non-Negotiable (NN)**.
  *   **Conflict:** Directly violates Strict Conditionalization ($P_{new}(\cdot) = P_{old}(\cdot|E)$) when $P_{old}(E)=1$.

  **2. Relation-Discovery Updating (The Mechanism Constraint)**
  *   **Requirement:** The update event must be identifiable as learning the *link* between $H$ and $E$ (e.g., $H \vdash E$ or $P(E|H) \approx 1$), not learning $E$ itself.
  *   **Why:** In the Glymour case, the agent doesn't learn $E$ (they knew it). They learn that $H$ *predicts* $E$. The updating rule must target logical/probabilistic relations, not just empirical propositions.
  *   **Status:** **Non-Negotiable (NN)**.
  *   **Conflict:** Requires expanding the algebra of propositions to include logical relations as updateable events, which complicates coherence proofs.

  **3. Provenance Sensitivity (The Stale Archive Constraint)**
  *   **Requirement:** Confirmatory weight must depend on the *generation history* of $E$, not just the truth of $E$. Two identical datasets $E$ must confer different confirmation if one was collected under a valid model and the other under a rejected (biased) model.
  *   **Why:** In the Stale Archive case, data processed by a rejected model may contain systematic errors. Treating $E$ as a raw proposition ignores the likelihood of the data-generating process.
  *   **Status:** **Non-Negotiable (NN)**.
  *   **Conflict:** Standard likelihoods $P(E|H)$ are ahistorical. This requires conditioning on context variables $C$: $P(E|H, C)$.

  **4. Counterfactual Recoverability (The Forgotten Prior Constraint)**
  *   **Requirement:** The theory must provide a principled method to reconstruct the "ur-prior" state where $E$ was unknown, without relying on arbitrary intuition.
  *   **Why:** In the Forgotten Prior case, the agent treats $E$ as new because they lost track of its status. To correct this, the theory must distinguish between "I don't know $E$" and "I forgot I knew $E$," and allow reconstruction of the pre-$E$ belief state to calculate the true confirmation boost.
  *   **Status:** **Camp Preference (CP)**. (Some argue you just update on current state; but without this, you can't correct the error of forgetting).
  *   **Conflict:** Epistemically demanding. Requires access to a prior state that may no longer exist in memory.

  **5. Diachronic Coherence**
  *   **Requirement:** The updating rule must not expose the agent to a diachronic Dutch Book (a guaranteed loss across time).
  *   **Why:** If you allow probability shifts that aren't conditionalization, you risk incoherence. A Bayesian account should preserve the core rationality constraint of avoiding sure-loss betting strategies.
  *   **Status:** **Non-Negotiable (NN)**.
  *   **Conflict:** Most solutions to Old Evidence (like changing priors retroactively) look like coherence violations from the outside.

  ---

  ### Part 2: The Logical Impossibility

  **Is a subset jointly impossible?**
  **Yes.** You cannot satisfy **Desideratum 1 (Positive Confirmation)**, **Desideratum 5 (Diachronic Coherence via Strict Conditionalization)**, and the **Standard Probability Axioms** simultaneously.

  *   **The Proof:**
      1.  Standard Axioms: If $P(E) = 1$, then $P(H \cap E) = P(H)$.
      2.  Strict Conditionalization: $P_{new}(H) = P_{old}(H|E) = P_{old}(H \cap E) / P_{old}(E)$.
      3.  Substitution: $P_{new}(H) = P_{old}(H) / 1 = P_{old}(H)$.
      4.  Result: No confirmation is possible.

  **The Resolution:** To solve Old Evidence, a Bayesian theory **must** relax Strict Conditionalization. It must admit an updating rule that is *not* $P_{new}(\cdot) = P_{old}(\cdot|E)$.
  *   *Option A:* Change the prior (Counterfactualism).
  *   *Option B:* Change the algebra (learn logical relations, not $E$).
  *   *Option C:* Change the likelihood (Provenance Sensitivity).

  If you insist on Strict Conditionalization, you must deny Desideratum 1 (claiming old evidence *doesn't* confirm, which is empirically false regarding scientific practice).

  ---

  ### Part 3: Distinctions That Must Not Collapse

  1.  **Genuinely Old vs. Apparently Old:**
      *   *Why:* In the **Forgotten Prior** case, the evidence is *genuinely* old (it was in the background), but *apparently* new (the agent forgot). A theory that treats them identically fails to correct the agent's error. The theory must allow the agent to realize, "I shouldn't be updating on $E$ as if it were new."
  2.  **Prior Revision vs. Belief Revision:**
      *   *Why:* **Belief Revision** is moving from $P_{old}$ to $P_{new}$ via evidence. **Prior Revision** is admitting $P_{old}$ was mis-specified (e.g., setting $P(E)<1$ when it was 1). Collapsing these makes all updating look like error-correction, destroying the distinction between learning and fixing mistakes.
  3.  **Propositional Content vs. Data-Generating Process:**
      *   *Why:* Crucial for **Stale Archive**. $E$ = "The dial read 5." The *Process* = "The dial was calibrated under Model X." If you collapse these, you cannot handle the Stale Archive case. You must treat the evidence as a pair $(E, \text{Process})$.

  ---

  ### Part 4: The Killer Requirement

  **Desideratum 3 (Provenance Sensitivity) kills the most standard fixes.**

  *   **Why:** The most common fix for the Glymour case is **Counterfactual Prior Revision** (e.g., Garber, Jeffrey). This says: "Pretend you didn't know $E$, set $P(E) < 1$, then conditionalize."
  *   **The Failure:** This works for Glymour (logical relations) but fails **Stale Archive**.
  *   **Reason:** In Stale Archive, the problem isn't that $P(E)=1$. The problem is that the *likelihood* $P(E|H)$ is contaminated by the rejected model used to collect $E$. Merely adjusting the prior probability of $E$ does not fix a corrupted likelihood function. You need to model the error structure of the archive, not just pretend $E$ was uncertain. Counterfactual approaches treat $E$ as an atomic proposition; Stale Archive requires $E$ to be a structured output of a specific, potentially flawed, causal chain.

  ---

  ### Part 5: Scoring the Candidates

  | Approach | 1. Positive Conf. | 2. Relation-Discovery | 3. Provenance Sens. | 4. Counterfactual Rec. | 5. Diachronic Coherence | **Verdict** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Naive Conditionalization** | **FAIL** | N/A | FAIL | FAIL | PASS | **Dead.** Cannot handle $P(E)=1$. |
  | **Prior-Revision (Garber-style)** | **PASS** | PASS | **FAIL** | PASS (Weak) | **WARN** | **Partial.** Solves Glymour by expanding algebra to logical relations. Fails Stale Archive because it ignores data generation history. Coherence is tricky (are we betting on logical truths?). |
  | **Framework-Relative (Van Fraassen/Structural)** | **PASS** | PASS | **PASS** | **WARN** | **WARN** | **Best Fit.** Treats confirmation as relative to a model/context. Handles Stale Archive naturally (change the framework/model of data generation). Struggles with Diachronic Coherence (looks like changing rules, not updating). |

  ### Summary Logic Map

  1.  **The Core Tension:** You want Bayesian updating (Coherence) + Old Evidence (Confirmation) + Known Facts ($P(E)=1$).
  2.  **The Impossibility:** You can only have two.
      *   Keep Coherence + Known Facts $\rightarrow$ No Confirmation (Naive).
      *   Keep Confirmation + Known Facts $\rightarrow$ Relax Coherence/Conditionalization (Prior Revision/Framework).
      *   Keep Coherence + Confirmation $\rightarrow$ Deny Known Facts (Pretend $P(E)<1$).
  3.  **The User's Specific Constraint:** Your **Stale Archive** case forces the solution to be more than just "Pretend $P(E)<1$." It forces the likelihood function to be context-dependent.
  4.  **Conclusion:** An adequate theory must be a **Framework-Relative Bayesianism**. It must allow the likelihood term $P(E|H)$ to be indexed to a data-model $M$, such that confirmation is $P(H | E, M)$. When $M$ is rejected (Stale Archive), the term $P(E | H, M_{rejected})$ becomes useless, requiring a reconstruction of $P(E | H, M_{new})$. This satisfies Provenance Sensitivity but requires abandoning the idea of a single, universal prior space.
