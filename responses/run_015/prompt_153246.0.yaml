      *   *Riley's Stance:* Functionalist/psychological continuity view. Identity is about the first-person experience and functional output. If it walks like a duck and quacks like a duck, it's the same duck.
      *   *Sam's Stance:* Causal history matters. Manipulation undermines authenticity/identity. The "gradual" aspect masks the external control.
      *   *The "Engineer" Variable:* This is the key. In standard Ship of Theseus, the replacement is usually impersonal or natural. Here, there's an *agent* changing the *content* of the mind (risk assessment).
      *   *Intuition Pump Methodology:* Daniel Dennett's concept. Pumps are designed to elicit specific intuitions to support a theory. Good pumps isolate variables; bad pumps load the dice.
