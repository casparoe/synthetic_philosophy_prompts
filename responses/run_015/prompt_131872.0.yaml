      *(Self-Correction on the Clay Case)*: "Shattered" implies a break in continuity. However, if *all* fragments are recovered and reassembled, philosophers often argue identity persists (like a Humpty Dumpty scenario where you have all the pieces). The replacement pieces are the issue. Since they are from the *original kiln*, they share the "origin story" even if not the specific firing event. This is a strong case for "Constitution" without "Identity." I will rule it as "Same Work" based on fragment majority.

      *(Self-Correction on the Stone Case)*: "Pulverized" means no fragments. "Re-carved" means new matter. "Different artist" means new causal agency. This is a clear "New Work."

      *(Final check on the "Weakest Step")*: The threshold for material survival is definitely the weakest. There is no non-arbitrary line between 10% and 11%. I need to highlight this.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Constitution & Continuity Protocol (CCP)
  **Version 1.0 | For Heritage Accreditation Panels**

  ## Preamble
  This protocol operationalizes the philosophical distinction between an artifact's *material constitution* (the physical stuff it is made of) and its *diachronic identity* (its persistence as the same object over time). It is designed to resolve disputes regarding restitution and insurance liability where objects have undergone reconstruction, restoration, or replacement.

  **Usage Note:** This procedure prioritizes the **Token** (the specific historical individual) over the **Type** (the general design or iconography). Provenance claims attach to Tokens.

  ---

  ## Phase 1: Token Verification (Type vs. Token)
  *Philosophical Basis: Distinction between universal forms and particular instances.*

  **Q1.1: Does the provenance record claim ownership of a specific physical individual (Token) or merely a design/iconography (Type)?**
  *   **Sufficient Answer for Token:** The record cites specific dimensions, unique damage patterns, inscriptions, or a continuous chain of custody for a specific physical object.
  *   **Sufficient Answer for Type:** The record describes only the subject matter (e.g., "A statue of Apollo") without unique identifiers.
  *   **Protocol Action:**
      *   If **Type**: **STOP.** Issue **Negative Determination**. A design cannot be restituted as a specific stolen object.
      *   If **Token**: Proceed to Q2.

  ---

  ## Phase 2: Material Constitution (The "Stuff" Check)
  *Philosophical Basis: Constitution is not Identity. An object can survive material change, but not total replacement.*

  **Q2.1: What percentage of the object's critical structural mass consists of original material from the time of creation?**
  *   **Measurement:** Conservator report quantifying original vs. new material by volume/weight in load-bearing or defining areas.
  *   **Sufficient Answer for Continuity:** ≥ 51% of the original structural mass remains.
  *   **Sufficient Answer for Discontinuity:** < 10% of the original structural mass remains.
  *   **Protocol Action:**
      *   If **< 10%**: Proceed to Q2.2 (The "Relic" Exception).
      *   If **≥ 51%**: Proceed to Phase 3.
      *   If **10% – 50%**: **FLAG AS UNSETTLED.** Proceed to Phase 3, but note that philosophical consensus on identity in this range is indeterminate.

  **Q2.2 (The Relic Exception): If < 10% original material remains, is the remaining material the recognized "seed" or core from which the rest was historically grown or built?**
  *   **Sufficient Answer:** Yes (e.g., a foundational stone, a core armature).
  *   **Protocol Action:**
      *   If **No**: **STOP.** Issue **Negative Determination**. The object is a replica.
      *   If **Yes**: Proceed to Phase 3.

  ---

  ## Phase 3: Causal Continuity (The "Gap" Check)
  *Philosophical Basis: Persistence requires an unbroken causal chain. Sudden, terminal destruction breaks the chain even if the object is remade.*

  **Q3.1: Was the object subjected to a "Terminal Event" where it ceased to function or exist as a coherent entity?**
  *   **Definition:** A Terminal Event is destruction that renders the object irrecoverable without remanufacturing (e.g., pulverization, melting down, total dissolution).
  *   **Sufficient Answer for Continuity:** No. Damage was partial (cracks, chips, corrosion) or reversible (shattering with recoverable fragments).
  *   **Sufficient Answer for Termination:** Yes. The object was reduced to raw material (dust, ingot, slurry).
  *   **Protocol Action:**
      *   If **Termination**: **STOP.** Issue **Negative Determination**. A remade object is a new Token, even if identical in appearance.
      *   If **Continuity**: Proceed to Phase 4.

  **Q3.2: If the object was shattered or disassembled, were > 75% of the original fragments recovered and used in reassembly?**
  *   **Sufficient Answer:** Yes.
  *   **Protocol Action:**
      *   If **No**: **HAND-OFF TO HUMAN.** (See Phase 5).
      *   If **Yes**: Proceed to Phase 4.

  ---

  ## Phase 4: Agency and Intent (The "Maker" Check)
  *Philosophical Basis: Artifacts are defined by their history of production. A change in creative agency can create a new work.*

  **Q4.1: Was the reconstruction performed to *preserve* the existing token or to *recreate* a lost one?**
  *   **Evidence:** Conservation logs, commission records, artist statements.
  *   **Sufficient Answer for Preservation:** Intent was stabilization and minimal intervention.
  *   **Sufficient Answer for Recreation:** Intent was to restore visual completeness regardless of material loss.
  *   **Protocol Action:**
      *   If **Recreation**: **HAND-OFF TO HUMAN.** (See Phase 5).
      *   If **Preservation**: Proceed to Q4.2.

  **Q4.2: Did the reconstruction involve a new creative agent (artist/craftsman) imposing new interpretive choices?**
  *   **Sufficient Answer for Same Work:** No. New material was cast from original molds, or gaps were filled neutrally (inpainting) without altering form.
  *   **Sufficient Answer for New Work:** Yes. A new artist re-carved, re-sculpted, or altered proportions based on interpretation.
  *   **Protocol Action:**
      *   If **New Creative Agent**: **STOP.** Issue **Negative Determination**. The causal chain of authorship is broken.
      *   If **No New Agency**: **PASS.** Issue **Positive Determination** (Same Work).

  ---

  ## Phase 5: The Value Hand-Off (Human Review Required)
  *Philosophical Basis: Some questions are not matters of fact but of cultural value. Philosophy cannot adjudicate sacredness or national identity.*

  **Trigger Conditions:**
  1.  Material continuity is between 10% and 50% (The "Ship of Theseus" Zone).
  2.  Fragment recovery is < 75% but the object holds high cultural/religious significance.
  3.  Intent was mixed (Preservation + Recreation).

  **Instruction to Panel:**
  In these cases, the protocol cannot yield a factual "Same Work" verdict. The panel must vote based on **Policy**, not **Ontology**.
  *   **Restitution Context:** Favor the claimant if the break in continuity was caused by the bad-faith actor (e.g., looters broke it, state reassembled it).
  *   **Insurance Context:** Favor the insurer if the break in continuity suggests the risk profile has fundamentally changed.

  ---

  ## Application of Protocol to Case Studies

  ### Case 1: The Bronze Statue
  *Scenario: 40% original metal lost to corrosion; filled with modern alloy cast from the original mold.*

  1.  **Token Verification:** Claim is for the specific statue. (Pass)
  2.  **Material Constitution:** 60% original metal remains. (≥ 51% Threshold Met). (Pass)
  3.  **Causal Continuity:** Corrosion is gradual, not a Terminal Event. (Pass)
  4.  **Agency and Intent:** Modern alloy cast from *original mold*. This indicates an intent to preserve form without new creative interpretation. (Pass)
  *   **Verdict:** **Same Work.**
  *   **Reasoning:** The object retains critical mass of original matter and the causal chain of form is maintained via the original mold.

  ### Case 2: The Clay Figurine
  *Scenario: Shattered, reassembled with adhesive; missing pieces replaced by visually identical modern clay fired in the original kiln.*

  1.  **Token Verification:** Claim is for the specific figurine. (Pass)
  2.  **Material Constitution:** Assume > 51% of fragments recovered (standard for "reassembled"). (Pass)
  3.  **Causal Continuity:** Shattering is a potential Terminal Event. However, Q3.2 asks if > 75% of fragments were recovered. Assuming standard reassembly, yes. The "dust" threshold was not met. (Pass)
  4.  **Agency and Intent:** Replacement clay from the *original kiln* is chemically identical but historically distinct. However, this is neutral filling, not new artistic interpretation. (Pass)
  *   **Verdict:** **Same Work.**
  *   **Reasoning:** While the material constitution is compromised, the causal chain of the *fragments* persists. The replacement material shares the origin site (kiln), minimizing the ontological gap.

  ### Case 3: The Stone Monument
  *Scenario: Deliberately pulverized by a regime; re-carved decades later by a different artist from the same quarry into same iconography but altered proportions.*

  1.  **Token Verification:** Claim is for the specific monument. (Pass)
  2.  **Material Constitution:** Pulverized = 0% original structural mass. (Fail Q2.1).
      *   *Check Q2.2 (Relic Exception):* Is there a seed core? No, it was pulverized. (Fail Q2.2).
      *   **Protocol Stop:** **Negative Determination.**
  3.  **Causal Continuity (Confirmation):** Pulverization is a **Terminal Event** (Q3.1). The object ceased to exist. (Fail Q3.1).
  4.  **Agency and Intent (Confirmation):** Re-carved by a *different artist* with *altered proportions*. This is a new creative act. (Fail Q4.2).
  *   **Verdict:** **New Work.**
  *   **Reasoning:** Despite visual similarity and same quarry source, the Token was destroyed. The causal chain is broken by pulverization and re-established by a new agent. This is a copy/commemoration, not the original object. No special pleading applies; the protocol treats this as a factual termination of the original token.

  ---

  ## Reliability Assessment & Limitations

  **Confidence Level:** **High (85%)** for clear cases of preservation vs. recreation; **Moderate (60%)** for borderline material replacement.

  **The Weakest Step:** **Q2.1 (The Material Threshold).**
  *   **The Weakness:** Setting a specific percentage (51% vs. 10%) is philosophically arbitrary. There is no ontological difference between an object with 49% original matter and one with 51%. This is a "Sorites Paradox" (Heap Paradox) forced into a binary legal decision.
  *   **Source of Weakness:** This lies in the **Practical Translation**, not the underlying philosophy. Philosophers accept that identity in these borderline cases is vague. The protocol *must* draw a line to function legally, but that line will always be vulnerable to edge-case challenges.
  *   **Mitigation:** This is why cases falling into the 10%–50% range are flagged for the **Phase 5 Value Hand-Off**. The protocol admits it cannot solve the metaphysics there and defaults to policy judgment.

  **Cross-Media Reliability:**
  *   **Stone/Metal:** High reliability. Material loss is easily quantified.
  *   **Organic/Textile:** Lower reliability. "Original material" in textiles may be consolidated to the point where the original fibers are present but structurally dependent on modern backing. Conservators must define "structural mass" carefully in these media.
  *   **Digital/Born-Digital:** This protocol does **not** apply. Digital objects rely on information identity, not material constitution. A separate protocol is required.
