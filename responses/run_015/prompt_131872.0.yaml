  2.  **Deconstruct the Philosophy (Material Constitution):**
      *   *Strict Identity:* $A = B$ only if they share all properties. (Too strict for artifacts; a cleaned statue is still the same statue).
      *   *Constitution:* The matter *constitutes* the object at a time, but isn't identical to it over time. (Allows for material change).
      *   *Persistence Conditions:* What makes an artifact persist?
          *   *Continuity of Form:* Is the shape/design maintained?
          *   *Continuity of Matter:* How much original material is needed? (Ship of Theseus problem).
          *   *Continuity of History/Causality:* Is there an unbroken chain of creation/preservation?
          *   *Intent:* Did the restorer intend to preserve the *same* object or make a *copy*?
      *   *Type vs. Token:* Is it *a* statue of Athena (type) or *this specific* statue of Athena (token)? Provenance usually cares about the Token.

  3.  **Drafting the Protocol (Iterative Process):**
