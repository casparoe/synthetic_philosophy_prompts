      *   *Step 3: Causal History.* Was the destruction intentional/terminal? (The stone monument case).
      *   *Step 4: Intent of Intervention.* Was the goal preservation or recreation?
      *   *Step 5: The "Gap" Problem.* Was there a temporal break where the object ceased to exist as a recognizable entity?

      *Refining for the User's Constraints:*
