      2.  **Material Threshold:** (Constitution vs. Identity).
      3.  **Continuity of Form/Function:** (Persistence conditions).
      4.  **Causal Chain:** (Gradual vs. Sudden).
      5.  **Intent/Agency:** (Values hand-off).

      *Wait, I need to ensure the "Stone Monument" case fails.* This case involves deliberate pulverization and re-carving by a *different* artist. This breaks the causal chain of the *token*. The protocol must catch this.
      *The "Bronze" case:* 40% loss, filled with new alloy from original mold. This is borderline. Likely passes if the core structure is original.
      *The "Clay" case:* Shattered, reassembled, missing bits replaced from original kiln clay. This is conservation + restoration. Likely passes.

      *Revising the Protocol for Precision:*
      *   *Step 1:* Provenance Claim Scope (Type vs. Token).
      *   *Step 2:* Material Survival (The "Constitution" check).
      *   *Step 3:* Continuity of Existence (The "Gap" check).
      *   *Step 4:* Agency of Reconstruction (The "Intent" check).
      *   *Step 5:* The "Unsettled" Zone (Where philosophy admits ambiguity).

  4.  **Developing the Three Case Studies:**
      *   *Case 1 (Bronze):* 60% original metal. New metal from original mold.
          *   Analysis: High material continuity. Causal chain unbroken. Mold usage supports form continuity. *Verdict: Same Work.*
      *   *Case 2 (Clay):* Shattered (terminal event?), reassembled. New clay from original kiln.
          *   Analysis: Shattering is risky. But reassembly implies continuity of the *fragments*. New clay is chemically identical but historically distinct. *Verdict: Same Work (with caveats).*
      *   *Case 3 (Stone):* Pulverized (destroyed). Re-carved later by different artist, same quarry, same look, different proportions.
          *   Analysis: Pulverization = Termination of Token. New artist = New Causal Chain. Different proportions = Form break. *Verdict: New Work.*

  5.  **Addressing the "Confidence & Weakness" Requirement:**
      *   Confidence: High on clear destruction, lower on gradual replacement.
      *   Weakest Step: The Material Threshold. Philosophy doesn't give a percentage. Law needs one. This is the translation friction point.

  6.  **Refining the Output Structure:**
