answer: |-
  Okay, let's sketch this out on the whiteboard. Imagine we're standing in front of that site plan: the smudge of burnt bone, the scatter of sherds, the ghostly circles of post-holes. No names, no dates, no prayers written in clay.

  The problem isn't just "what happened?" it's "what *kind* of truth can dirt tell us?"

  Here's a decision tree for the seminar. I've tried to make the nodes concrete claims rather than abstract theory labels. You should be able to answer "Yes/No" or "A/B" based on your methodological gut check, not because you memorized a textbook.

  ### The Epistemological Decision Tree

  **ROOT:** You are holding a dataset of broken pots, burnt bone, and aligned posts. Zero texts.

  **NODE 1: The Ontology of the Shard**
  *Claim:* "A deliberately broken pot functions like a sentence (it communicates a proposition) rather than a callus (it records repeated stress)."
  *   **YES (It's a statement):** Go to Node 2A.
  *   **NO (It's a trace):** Go to Node 2B.

  **NODE 2A: The Transmission Mechanism**
  *Claim:* "An institution (like 'sacrifice') cannot survive across generations without a chain of memory transmission (oral or textual) to correct drift."
  *   **YES (Need Memory):** **EMPTY ZONE.** (See notes below).
  *   **NO (Pattern is enough):** Go to Node 3A.

  **NODE 2B: The Continuity Mechanism**
  *Claim:* "Institutional continuity is just habituated behavior repeated until it looks like structure; no 'belief' required."
  *   **YES ( Habit is enough):** Go to Node 3B.
  *   **NO (Need underlying logic):** Go to Node 3C.

  **NODE 3A: The Lipid/Taste Variable**
  *Claim:* "Lipid residue profiles (fatty acids) map directly to *intent* (e.g., 'sacrificial fat' vs. 'cooking fat'), assuming ancient food preferences mirror ours."
  *   **YES (Chemistry = Intent):** Leaf 1.
  *   **NO (Chemistry = Inventory only):** Leaf 2.

  **NODE 3B: The Deposition Question**
  *Claim:* "Aligned post-holes signal shared cosmological doctrine (orientation to stars/axis) rather than shared logistics (wind protection/drains)."
  *   **YES (Cosmology):** Leaf 3.
  *   **NO (Logistics):** Leaf 4.

  **NODE 3C: The Uniformitarian Taste Check**
  *Claim:* "We can reject the 'Uniformitarian Taste Fallacy' (ancient palates = ours) and still identify 'special' feasting via residue."
  *   **YES (Possible):** Leaf 5 (Unnamed).
  *   **NO (Impossible):** Leaf 6.

  ---

  ### The Leaves (Where you end up)

  **Leaf 1: Radical Materialist Inference (Cognitive Archaeology lite)**
  *Path:* Objects speak + No text needed + Chemistry proves intent.
  *Vibe:* You think the chemistry *is* the belief. If the fat profile matches known sacrificial animals (even without texts), the ritual is proven. You're assuming the "specialness" of the fat is universal.
  *Risk:* High. You're betting ancient priests categorized lipids the way a GC-MS machine does.

  **Leaf 2: Institutional Minimalism**
  *Path:* Objects speak + No text needed + Chemistry is just inventory.
  *Vibe:* You admit the pots were broken on purpose (statement), but you refuse to let the lipid analysis tell you *why*. The fat tells you what they ate, not what they meant. You reconstruct the institution as a social boundary, not a theological one.
  *Risk:* You might miss the point of the ritual entirely.

  **Leaf 3: Practice-Continuity View (Bourdieu-ish)**
  *Path:* Objects are traces + Habit is enough + Cosmology in posts.
  *Vibe:* The posts aren't about stars; they're about bodies moving through space the same way for 200 years. The institution exists because the habit exists. Belief is secondary to the muscle memory of the community.
  *Risk:* Hard to explain sudden changes in the record.

  **Leaf 4: Processual Functionalism**
  *Path:* Objects are traces + Habit is enough + Logistics only.
  *Vibe:* It's a kitchen. The broken pots are trash. The posts hold a roof. The burnt bone is dinner. Any "ritual" is a modern projection.
  *Risk:* Ignores the deliberate alignment and breakage patterns that defy utility.

  **Leaf 5: [UNNAMED] Critical Chemical Realism**
  *Path:* Objects are traces + Need underlying logic + Reject Taste Fallacy.
  *Vibe:* You think there's a logic, but you know ancient people might have loved rancid fat or hated fresh meat. You use lipids to find *difference* (this pot vs. that pot) not *meaning* (sacrifice vs. dinner). You reconstruct norms without assuming universal palates.
  *Status:* Rare. Most people要么 assume taste is universal,要么 throw out chemistry.

  **Leaf 6: [UNNAMED] Skeptical Nominalist**
  *Path:* Objects are traces + Need underlying logic + Taste Fallacy makes chemistry useless.
  *Vibe:* If we can't know what they liked, we can't know what was "special." Without texts, "institution" is a word we impose. We can describe the pile, not the system.
  *Status:* Coherent, but makes archaeology impossible.

  ---

  ### Empty Zones & Incoherent Combos

  **The "Textualist Materialist" Void (Node 2A -> YES)**
  I marked this as empty for a reason. If you claim objects carry propositional belief (like sentences) BUT also claim institutions need oral/textual chains to survive... you've painted yourself into a corner. You're saying the pots *are* the text, but also that pots *aren't enough* without a voice. In a pre-literal context, this position collapses. Nobody sits here because it's methodologically suicidal.

  **The "Special Trash" Paradox**
  There's a fuzzy line between Leaf 1 (Chemistry = Intent) and Leaf 4 (It's a kitchen). If you assume uniformitarian taste (modern palates = ancient), you might call high-quality fat "ritual." But if that culture prized high-quality fat for *every* meal, your "ritual" is just "Tuesday." This is where the **Uniformitarian Taste Fallacy** kills your argument.
  *Flag:* Leaf 1 and Leaf 4 are often indistinguishable if you don't have a control sample of "domestic" waste nearby. If the whole site looks like a feast, was every day a holiday?

  ### The Lipid Angle: A Closer Look

  You asked specifically about the fatty-acid profiles. Here's the epistemological trap:

  Lipid analysis tells you **biology**, not **ontology**.
  It can tell you "this pot held ruminant adipose fat." It cannot tell you "this pot held a sacrifice."

  To get from *fat* to *sacrifice*, you need a bridge. Usually, that bridge is ethnography (modern analogies) or texts. Without them, you rely on the assumption that "special animals" or "specific cuts" = ritual.
  *   **If you accept Uniformitarian Taste:** You assume humans universally prize certain fats (maybe marrow, maybe specific renders). If you find those in the broken pots, you call it ritual.
  *   **If you reject Uniformitarian Taste:** You admit they might have ritualized the stuff we find gross (offal, specific glands). If your lipid baseline is "what looks good to us," you might miss the actual ritual signature entirely.

  **The Seminar Hook:**
  Ask the group: *"If lipid analysis shows these pots held the exact same stew as the domestic pits, but the pots were smashed... is the belief in the smashing, or the stew?"*
  *   If they say **the smashing**: You're leaning toward Practice-Continuity (Leaf 3). The act matters, not the food.
  *   If they say **the stew**: You're leaning toward Radical Materialist (Leaf 1), assuming the food itself was holy.
  *   If they say **we can't know**: You're at Leaf 6.

  ### Indistinguishable Pairs

  Be careful with **Leaf 2 (Minimalism)** and **Leaf 5 (Critical Chemical)**.
  Both reject the idea that chemistry proves intent. But Leaf 2 says "social boundaries" while Leaf 5 says "internal logic without taste assumptions." In practice, without texts, their publications look identical: "Variation in residue suggests differentiated use, purpose unknown." It's a distinction without a difference in the field report.

  Also, **Leaf 3 (Practice)** and **Leaf 4 (Functionalism)** often merge. If people habitually align posts to the wind (logistics) for 500 years, it becomes a tradition (cosmology). The material record doesn't separate "engineering habit" from "religious rule." That's a fault line we can't bridge with trowels.

  ---

  Anyway, print this out and stick it on the wall. Watch where people get stuck. If someone hems and haws at Node 1, they're probably a processualist trying to sound post-processual. If they breeze through the Lipid node assuming fat = feast, slap them gently with a gazetteer.

  Typo check: I think I misspelled "litteral" in my head earlier, but caught it. Hope the "EMPTY ZONE" logic holds up under pressure. Let me know if you want to tweak the lipid branch, that's the trickiest bit.
