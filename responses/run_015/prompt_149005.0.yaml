answer: |-
  **The Fragile Shield: Why Moral Equality Collapses in Asymmetric War**

  Michael Walzer's doctrine of the moral equality of combatants (MEC) has long served as the ethical bedrock of International Humanitarian Law. In *Just and Unjust Wars*, Walzer argues that soldiers on both sides of a conflict possess an equal right to kill and an equal liability to be killed, regardless of the justice of their nation's cause. This separation of *jus ad bellum* (justice of war) from *jus in bello* (justice in war) was designed for a specific archetype: the uniformed soldier of a sovereign state, facing an identical counterpart across a battlefield. However, the landscape of conflict has shifted violently away from this ideal. When applied to asymmetric insurgencies or remote drone warfare, Walzer's justification for MEC frays and ultimately snaps. The moral equality of combatants cannot survive as a universal principle; it must be reconceived as a conditional convention that dissolves when reciprocity of risk and status vanishes.

  To understand why MEC fails in modern contexts, one must first understand why it worked in the conventional one. Walzer's defense rests on two pillars: the epistemic limitation of the soldier and the symmetry of threat. In a state-on-state war, the individual soldier is rarely the author of the war's justice. They are coerced by conscription, social pressure, or limited information. To hold them criminally liable for their state's aggression would be to punish instruments rather than agents. Furthermore, because both sides face the same mortal danger, a mutual license to kill functions as a pragmatic check on brutality. It creates a closed sphere where violence is regulated, and surrender is honored.

  This logic collapses, however, when we leave the conventional battlefield for the asymmetric terrain of insurgency. Walzer himself was wary of "irregulars," arguing that combatant status is a privilege earned by adhering to the laws of war—specifically, wearing uniforms and distinguishing oneself from civilians. Insurgents who blend into the population to gain military advantage violate the principle of distinction. By erasing the line between combatant and civilian, they forfeit the protection of the combatant's license. If an insurgent is not a legitimate target only because they are a soldier, but becomes a legitimate target because they are a direct threat hiding among non-combatants, the symmetry is broken. The state soldier is bound by rules the insurgent ignores. In this context, insisting on MEC grants a moral shield to those who weaponize civilian immunity while denying themselves the vulnerability that justifies that immunity. The reciprocity is gone; the insurgent claims the right to kill without accepting the full liability of open combat.

  The erosion of MEC is even more profound in the realm of remote warfare. The rise of drone technology creates a scenario Walzer's conventional framework could not anticipate: the combatant who faces zero physical risk. A drone operator in Nevada can destroy a target in Yemen and return home to dinner. Here, the "symmetry of threat" justification for MEC evaporates completely. The drone pilot is not in a "common danger" with the insurgent on the ground. If the moral license to kill is predicated on the mutual exchange of life-for-life risk, the drone operator is not engaging in a duel but an execution.

  Proponents of the orthodox view might argue that the drone operator is still a state agent following orders, thus retaining the epistemic shield Walzer grants conscripts. However, this ignores the revisionist critique advanced by philosophers like Jeff McMahan, who argue that moral liability is tied to moral responsibility. If a drone operator fights for an unjust cause, they are not merely a threat; they are an unjust aggressor. In conventional war, we ignore this to prevent total war. But in remote warfare, where the operator is safe from retaliation, the pragmatic need to protect them from "victor's justice" is diminished. They do not need the shield of MEC to survive the battlefield; they need it to avoid moral accountability. To grant them equal moral standing with a fighter facing death on the ground is to divorce the right to kill from the reality of killing.

  This leads to the crucial verdict on the future of combatant ethics. We are left weighing the reciprocity-based defense against the revisionist view that only unjust fighters forfeit rights. The revisionist view is morally cleaner but pragmatically dangerous; if every soldier must judge the justice of their cause before firing, war becomes a crusade where no quarter is given to the "unjust." However, the reciprocity defense relies on a factual premise that no longer holds: that combatants are equally vulnerable.

  Therefore, the moral equality of combatants is dead as a universal moral truth. It cannot sustain itself when the conditions of its existence—mutual vulnerability and clear status—are absent. Instead, MEC must be downgraded from a moral right to a conditional convention. It should apply only when combatants mutually adhere to the laws of war and face reciprocal risk. When a party employs tactics that immunize them from retaliation (like remote warfare) or hide behind civilian populations (like irregular insurgents), they step outside the convention. They may still be subject to legal constraints, but they lose the moral equality that places them on the same plane as their adversaries.

  To cling to Walzer's universal MEC in the twenty-first century is to preserve a fiction that protects impunity. It allows drone operators to kill without risk and insurgents to kill without distinction, all under the guise of "soldierly equality." We must accept that in asymmetric and remote conflicts, the license to kill and the liability to be killed are no longer automatically linked. Moral status must once again track moral responsibility and physical reality. If you remove the risk from war, you remove the equality from the combatant.
