answer: |-
  There is no canonical, established term in analytic metaphysics or argumentation theory that precisely captures this specific dialectical pattern. While critics of modal realism often accuse defenders of "inconsistency," "having it both ways," or "crypto-fictionalism," these are descriptive critiques rather than named fallacies or structural concepts. The phenomenon you describe is distinct enough from the *Motte-and-Bailey* and simple *equivocation* to warrant a specific carving.

  Below is the proposed conceptual carving, a coined label, and the requested confidence assessment.

  ### The Concept: **Dialectical Ontological Modulation**
  *(Colloquial label: **The Ontological Shuttle**)*

  **Definition:**
  **Dialectical Ontological Modulation** is an argumentative strategy in which a defender of a theory assigns variable ontological weight to a specific theoretical entity ($E$) within a single dialectical engagement, contingent upon the type of objection being addressed.

  **The Structure:**
  1.  **Explanatory Mode (High Commitment):** When $E$ is required to ground truth conditions, reduce modal facts, or provide causal/explanatory power, the defender asserts $E$ possesses **Robust Ontology** (e.g., concrete, mind-independent, causally potent).
  2.  **Defensive Mode (Low Commitment):** When $E$ is challenged on parsimony, epistemic access, or empirical verification, the defender asserts $E$ possesses **Thin Ontology** (e.g., abstract, representational, heuristic, model-theoretic).
  3.  **The Toggle:** The shift between Mode 1 and Mode 2 is triggered by the *pressure point* of the interlocutor's objection, not by a clarification of context. Crucially, the defender presents both modes as compatible aspects of the *same* theory, rather than retreating from one to the other permanently.

  **Necessary Conditions:**
  *   **Identity Preservation:** The term referring to $E$ (e.g., "possible world") remains lexically constant; the shift is in the *ontological status* attributed to the referent, not the semantic definition of the word itself.
  *   **Functional Dependency:** The ontological status is assigned based on utility. High commitment is used for *benefit* (explanation); low commitment is used for *cost-avoidance* (parsimony/epistemology).
  *   **Reversibility:** Unlike a *Motte-and-Bailey*, the defender does not treat the Low Commitment position as a "retreat" to a safer core. Once the objection passes, they return to the High Commitment position without acknowledging a contradiction.

  ---

  ### The Carving: Distinctions from Related Phenomena

  To ensure this concept does not collapse into existing categories, we must distinguish it sharply from the three most likely candidates.

  #### 1. Vs. Motte-and-Bailey
  *   **The Motte-and-Bailey:** Involves a *defensible* but uninteresting claim (Motte) and an *indefensible* but interesting claim (Bailey). When attacked, the defender retreats to the Motte and claims that was their position all along.
  *   **Ontological Modulation:** Both the High and Low Commitment positions are presented as *interesting* and *theoretically vital*. The Low Commitment view (e.g., "worlds as models") is not a boring safety net; it is presented as a sophisticated insight into the nature of the theory. Furthermore, the defender does not *abandon* the High Commitment view; they re-adopt it immediately after the threat passes.
  *   **The Edge:** If the defender says, "Okay, fine, they aren't real, they're just fictions," and stays there, it is a Motte-and-Bailey (or a concession). If they say, "They are models for epistemology, but concrete for truth-making," and oscillates based on the question, it is Ontological Modulation.

  #### 2. Vs. Equivocation
  *   **Equivocation:** Uses the same word with two different *meanings* (e.g., "bank" of a river vs. "bank" for money) to validate an invalid inference.
  *   **Ontological Modulation:** The *meaning* of "world" (a maximal mereological sum of spatiotemporally related individuals, or a complete way things could be) remains stable. What shifts is the **metaphysical weight** of that meaning. The defender is not saying "world" means two things; they are saying the *nature* of the world is context-sensitive to the objection.
  *   **The Edge:** Equivocation is a semantic error. Ontological Modulation is a metaphysical inconsistency masked as dialectical nuance.

  #### 3. Vs. Theoretical Pluralism (or Dual-Aspect Theory)
  *   **Theoretical Pluralism:** Genuinely holds that an entity has multiple aspects (e.g., "light is both wave and particle") and applies them consistently across contexts.
  *   **Ontological Modulation:** The shift is *strategic* rather than *systematic*. In a genuine Dual-Aspect theory, the abstract nature is invoked even when it offers no defensive advantage. In Modulation, the abstract nature appears *specifically* when parsimony or epistemology is challenged, and vanishes when explanatory power is needed.
  *   **The Edge:** Consistency. If the defender treats worlds as abstract models when explaining *why* modality is useful (not just when defending against parsimony), it is Pluralism. If the "model" view only appears to deflect cost, it is Modulation.

  ---

  ### Confidence and Uncertainty Assessment

  **Confidence Level:** **High (85%)** that this is a distinct, identifiable argumentative pattern that lacks a canonical name.
  **Confidence Level:** **Moderate (60%)** that this constitutes a *single* phenomenon rather than two distinct moves conflated by the observer.

  **The Point of Greatest Uncertainty:**
  I am least certain about whether you have misidentified this as a single phenomenon when it might actually be **two separate argumentative moves that only look connected due to the subject matter.**

  **Reasoning:**
  In metaphysics, there is a legitimate distinction between **Truth-Making** (what makes a proposition true) and **Epistemic Access** (how we know the proposition).
  *   *Move A:* "Worlds must be concrete to serve as truthmakers." (Ontological claim)
  *   *Move B:* "We access worlds via abstraction because we are causally isolated." (Epistemological claim)

  A sophisticated defender might argue these are not contradictory. They might claim: *"The worlds are concrete (Ontology), but our cognitive grip on them is representational (Epistemology)."* If this is their genuine, consistent view, then what you are observing is not "modulation" or inconsistency, but a **Dual-Domain Defense**.

  **Why this creates uncertainty:**
  It is empirically difficult to distinguish between a defender who is *strategically toggling* (Ontological Modulation) and a defender who holds a *complex, consistent view* (Dual-Domain) but explains it piecemeal.
  *   **Indicator of Modulation:** The defender implies the worlds *are* representations when pressed on parsimony (ontological downgrade), not just that our *access* is representational.
  *   **Indicator of Dual-Domain:** The defender maintains the worlds are concrete even during the epistemic objection, but argues our *models* of them are abstract.

  **Verdict:**
  Based on your description ("they'll retreat to describing worlds as 'representational devices'... whose concreteness is just a heuristic"), it sounds like an **ontological downgrade**, not just an epistemic qualification. This supports the **Ontological Modulation** diagnosis. However, because metaphysical defenders often blur the line between "X is abstract" and "We treat X as abstract," there is a risk that some instances of this pattern are actually coherent (if obscure) dual-aspect theories rather than dialectical shuffling.

  **Recommendation:**
  When applying this label, verify that the defender is explicitly downgrading the *existence* status of the entity (from concrete to heuristic) during the defensive phase, rather than merely describing the *method of inquiry*. If they downgrade the existence itself, **Dialectical Ontological Modulation** is the precise carve.
