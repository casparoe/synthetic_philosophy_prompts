prompt: |-
  I'm TAing for a probability-and-induction course and I keep getting into the same stupid fight with the students about Bertrand's chord thing. You know the one: take a chord of a circle "at random" and ask the chance it's longer than the side of the inscribed equilateral triangle -- pick two endpoints on the circumference and you get 1/3, pick a radius and then a point along it and you get 1/2, pick a point in the disc as the midpoint and you get 1/4. Everyone can recite the three recipes, nobody can say what the lesson is supposed to be. I've got a suspician that the useful move isn't to crown a favourite recipe but to sit down and write out what any principle of indifference would have to do to deserve the name -- so that's what I want from you: the desiderata. What does a rule that says spread your credence evenly over possibilities you have no reason to distinguish have to deliver before it counts as adequate? Give me the list with the consideration behind each item, not a list of adjectives -- the cases it has to get right, the distinctions it can't collapse, the results it has to stay consistent with, the temptations it has to resist. And I want to be able to test a candidate against concrete cases, so here are the ones I care about: (1) the chord, above; (2) a machine cuts a one-metre stick at a random point and I want the chance the longer piece is at least twice the shorter -- does "random" mean uniform in the cut point, or uniform in the ratio of the two pieces?; (3) a factory turns out cubes whose edge length is known only to lie between 1 and 2 cm, so the edge, the face area and the volume are each equally unknown in a fixed interval -- over which do I spread credence?; (4) a bent coin I know nothing about: even over the bias p, or even over the log-odds?; (5) a point picked "at random" on a sphere, and then the question of what conditioning on it landing on one particular great circle even means, that being an event of probability zero; (6) a case where the number of possibilities is itself unknown -- an urn where I don't know how many colours or how many marbles I'm ignorant about.

  Then the part I actually want. Say which of these requirements are genuine desiderata and which are just a camp's prejudice -- I've noticed the invariance people and the "indifference is a con" people seem to want opposite things and both act like it's obvious -- and, most important, flag any pair or subset of the desiderata I can't have together, because my hunch is that the list is where the real result lives: something like always-unique-answer and never-privileges-a-parameterization can't both be satisfied, which would make Bertrand's paradox not a puzzle about chords but a proof that we've been asking the principle for too much. If one requirement does the most damage to the popular proposals, name it and say why. I've been calling my pet version of the requirement description-invariance -- indifference is only licensed when the symmetry you lean on is a symmetry of the situation itself and not of the way we happen to have written it down -- so tell me what that rule buys, what it costs, and whether it's even formulable without circularity.

  Finally, since I have to say something in class: two or three lines each on how the maximum-entropy/group-invariance approach, the "just use a reference prior that works in practice" approach, and the flat refusal to have any such principle at all do against the list. No history, no names and dates, no reading list -- I don't want a bibliography, I want the criteria and the tension between them. And be honest about which desiderata are only requirements if you've already decided the principle is meant to ground real statistical inference rather than serve as a teaching heuristic; that changes the list and I want to see exactly where.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A Teaching Assistant (TA) for a probability-and-induction course.
      *   **Problem:** Students are stuck on Bertrand's Paradox (three different answers for the same problem based on parameterization). The TA suspects the issue isn't picking a "winner" but defining what a Principle of Indifference (PoI) *ought* to do.
      *   **Task:**
          1.  List desiderata for a valid PoI (with considerations, not just adjectives).
          2.  Test these desiderata against 6 specific cases (Chord, Stick, Cube, Coin, Sphere, Unknown Urn).
          3.  Distinguish genuine desiderata from camp prejudices.
          4.  Identify incompatibilities (impossibility results).
          5.  Evaluate the TA's "description-invariance" idea.
          6.  Briefly evaluate three approaches (MaxEnt/Group-Invariance, Reference Priors, No-Principle) against the list.
          7.  Distinguish between desiderata for *inference* vs. *heuristic/teaching*.
      *   **Constraints:** No history, no names/dates, no bibliography. Be honest about tensions. Focus on criteria and trade-offs.

  2.  **Deconstruct the Core Problem (Bertrand's Paradox & PoI):**
      *   The paradox arises because "random" is undefined without a measure.
      *   Different parameterizations (endpoints, radius/midpoint, area/midpoint) imply different measures.
      *   A robust PoI needs to tell us *which* parameterization is the "natural" one or admit that the problem is ill-posed.
      *   The TA's intuition is correct: The paradox proves you can't have *both* parameterization invariance *and* existence of a solution for every ill-posed problem.

  3.  **Drafting the Desiderata (The "List"):**
      *   Need to move beyond "consistent" or "logical." Need operational requirements.
      *   *Requirement 1: Parameterization Invariance (Description Invariance).* If I change variables (e.g., length to volume), the probability assigned to the physical event shouldn't change.
      *   *Requirement 2: Existence/Uniqueness.* For a well-posed physical question, the principle should yield *a* number, ideally *one* number.
      *   *Requirement 3: Coherence (Dutch Book).* Probabilities must sum to 1, conditional probabilities must work, no sure-loss bets.
      *   *Requirement 4: Empirical Calibration (Frequentist Matching).* If the "randomness" corresponds to a physical process, the PoI distribution should match the long-run frequency (if applicable).
      *   *Requirement 5: Ignorance Preservation.* If I learn nothing new, my probabilities shouldn't change (though this is tricky with parameter changes).
      *   *Requirement 6: Symmetry Respect.* If the physical setup has a symmetry (rotation, translation), the distribution should reflect it.

  4.  **Testing Against the 6 Cases:**
      *   (1) Chord: Fails Parameterization Invariance (1/3 vs 1/2 vs 1/4).
      *   (2) Stick: Cut point (uniform $x$) vs Ratio (uniform $r$). Uniform $x$ implies non-uniform $r$. Which is "ignorance"?
      *   (3) Cube: Edge ($L$), Area ($L^2$), Volume ($L^3$). Uniform on $L$ $\neq$ Uniform on $V$. Jaynes' solution uses translation/scale invariance.
      *   (4) Coin: Bias $p$ vs Log-odds $\lambda$. Haldane prior vs Uniform prior.
      *   (5) Sphere: Great circle is measure zero. Conditioning requires limits. Invariance under rotation is key here.
      *   (6) Unknown Urn: Infinite possibilities? Improper priors?

  5.  **Identifying Incompatibilities (The "Impossibility Theorem"):**
      *   The big tension: *Parameterization Invariance* vs. *Universal Existence*.
      *   You cannot have a rule that says "Always assign a uniform distribution" AND "It doesn't matter how you describe the variables." Uniformity is not invariant under non-linear transformation.
      *   Therefore, a PoI cannot simply say "be uniform." It must say "be uniform *with respect to the invariant measure*." But finding that measure requires knowing the symmetry group of the *problem*, not just the *variables*.
      *   If the problem description doesn't specify the physical mechanism (like Bertrand's chord), there is no unique invariant measure.
      *   *Conclusion:* You can't have Uniqueness + Parameterization Invariance + Applicability to Ill-Posed Problems.

  6.  **Evaluating "Description-Invariance":**
      *   *What it buys:* Prevents arbitrariness based on linguistic formulation.
      *   *What it costs:* It forces you to admit many problems are ill-posed. It kills the "easy" version of PoI.
      *   *Circularity:* To define the invariant measure, you need to know the symmetries. To know the symmetries, you need to know the physical setup. If the setup is vague, the symmetry is vague. It's not circular, but it is demanding.

  7.  **Evaluating the Three Approaches:**
      *   *MaxEnt/Group-Invariance:* Good at respecting symmetries (Chord, Cube). Fails if symmetries are ambiguous (Bertrand). High bar for "well-posedness."
      *   *Reference Priors (Pragmatic):* "Use what works for inference." Ignores the philosophical "true ignorance." Good for statistics, bad for epistemology.
      *   *No-Principle (Subjective/Ill-posed):* "The question is nonsense." Most logically consistent but unsatisfying for students wanting an answer.

  8.  **Distinguishing Inference vs. Heuristic:**
      *   If teaching heuristics: Simplicity matters more than invariance.
      *   If grounding inference: Coherence and Invariance are non-negotiable.
      *   Need to highlight this split clearly.

  9.  **Refining the Tone:**
      *   The user is a TA, likely grad student or advanced undergrad. They want rigor but also pedagogical utility.
      *   Tone should be direct, analytical, slightly cynical about "solutions," but constructive about "constraints."
      *   Avoid name-dropping (Jaynes, Keynes, Kolmogorov) as requested.

  10. **Drafting the Content (Iterative refinement):**
      *   *Desiderata:* Make sure they are distinct.
      *   *Incompatibility:* Highlight the transformation group issue.
      *   *TA's Idea:* Validate "Description-Invariance" but show its limit (it requires physical context).
      *   *Classroom Advice:* Keep it punchy.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Jaynes is right." I need to explain *why* the tension exists mathematically. The Jacobian of the transformation is the killer. Uniformity in $x$ is not uniformity in $f(x)$.
      *(Self-Correction on Case 5)*: The sphere case is about Borel-Kolmogorov paradox. Need to mention that conditioning on measure zero sets depends on the limiting process (symmetry).
      *(Self-Correction on Case 6)*: This is about improper priors or non-parametric ignorance. Keep it brief.

  11. **Final Polish:** Check against constraints. No names. No history. Focus on tensions. Ensure the "Impossibility" result is clear.

      *Structure:*
      1. The Desiderata (The List).
      2. The Incompatibility (The Hard Truth).
      3. Evaluating "Description-Invariance."
      4. The Three Approaches (Classroom lines).
      5. Inference vs. Heuristic distinction.

      *Let's write.*
answer: |-
  Here is the breakdown you need to settle the argument. It separates the mathematical constraints from the philosophical wish-list.

  ### Part 1: The Desiderata for a Principle of Indifference

  To count as adequate, a rule for assigning probabilities under ignorance must satisfy the following operational requirements.

  **1. Parameterization Invariance (Description Invariance)**
  *   **Requirement:** If two mathematical descriptions refer to the exact same physical state of affairs, the assigned probability for that state must be identical regardless of which description is used to calculate it.
  *   **Consideration:** Probabilities are about the world, not the coordinates. If I describe a cube by edge length $L$ or volume $V=L^3$, the probability that the cube fits in a box of size $X$ cannot depend on whether I integrated over $dL$ or $dV$.
  *   **Test Case:** The Cube (Case 3). Uniform credence over edge length implies non-uniform credence over volume. A valid principle must pick one as the "natural" measure or admit the question is ill-posed.

  **2. Symmetry Respect (Group Invariance)**
  *   **Requirement:** If the physical setup remains unchanged under a transformation (rotation, translation, scaling), the probability distribution must remain unchanged under that same transformation.
  *   **Consideration:** Ignorance implies no reason to prefer one outcome over another *structurally similar* outcome. If the circle has no marked point, rotating the chord selection method shouldn't change the probability.
  *   **Test Case:** The Chord (Case 1) and The Sphere (Case 5). The chord method must be rotationally invariant. The sphere point must be rotationally invariant (uniform over surface area, not latitude/longitude).

  **3. Coherence (Consistency)**
  *   **Requirement:** The assigned probabilities must obey the axioms of probability (sum to 1, conditionalization works) and must not allow a Dutch Book (a set of bets guaranteeing a loss).
  *   **Consideration:** Even if the prior is subjective, it must act like a probability measure once assigned.
  *   **Test Case:** The Sphere (Case 5). Conditioning on a great circle (measure zero) is incoherent unless defined by a specific limiting process (e.g., a strip of width $\epsilon$ shrinking to zero). Different limits yield different results.

  **4. Existence and Uniqueness**
  *   **Requirement:** For any well-specified problem statement, the principle must yield a single, well-defined probability distribution.
  *   **Consideration:** A rule that says "it depends" fails as a decision guide. A rule that yields two different numbers for the same input is broken.
  *   **Test Case:** The Chord (Case 1). Students want *the* answer. A principle that yields 1/3, 1/2, and 1/4 simultaneously fails this unless it can rank the methods.

  **5. Empirical Calibration (Frequentist Matching)**
  *   **Requirement:** If the "ignorance" corresponds to a repeatable physical process, the assigned probabilities should match the long-run relative frequencies of that process.
  *   **Consideration:** If "random chord" means "throw a straw on a circle," the distribution must match the physics of straw-throwing, not just mathematical convenience.
  *   **Test Case:** The Stick (Case 2). If a machine cuts the stick, the physical mechanism determines whether the cut point is uniform or the ratio is uniform.

  **6. Ignorance Preservation (Transformation of Ignorance)**
  *   **Requirement:** If a variable represents total ignorance, a one-to-one transformation of that variable should not generate "information" (i.e., you shouldn't become more certain about the transformed variable than the original).
  *   **Consideration:** This is the hardest constraint. Uniformity is not preserved under non-linear transformation.
  *   **Test Case:** The Coin (Case 4). Uniform over bias $p$ implies peaked over log-odds. Uniform over log-odds implies peaked over $p$. You cannot be uniformly ignorant over both.

  ---

  ### Part 2: The Incompatibility Result (The "Real" Lesson)

  You suspected it: **You cannot satisfy all of these simultaneously.** Specifically, **Parameterization Invariance** and **Existence/Uniqueness** (for all problem statements) are mutually exclusive under the standard interpretation of "Indifference."

  **The Conflict:**
  Mathematically, a uniform distribution is not invariant under non-linear change of variables (due to the Jacobian of the transformation).
  *   If you demand **Existence/Uniqueness** (you *must* give an answer for the Cube problem), you must pick a parameter (edge, area, or volume).
  *   If you pick one, you violate **Parameterization Invariance** (you have privileged one description over an equivalent one).
  *   If you demand **Parameterization Invariance**, you cannot assign a uniform distribution to *all* parameters. You must find a specific "invariant measure."
  *   But finding an invariant measure requires knowing the **Symmetry Group** of the problem.
  *   In Bertrand's Chord (Case 1), the problem statement ("pick a chord at random") does not specify the symmetry group (rotation? translation? scaling?).
  *   **Conclusion:** If the problem statement is physically under-specified, **Parameterization Invariance** forces you to conclude **No Unique Solution Exists**.

  **The Verdict on Desiderata:**
  *   **Genuine Desiderata:** Coherence, Symmetry Respect, Parameterization Invariance. These are mathematical necessities for a consistent system.
  *   **Camp Prejudice:** Existence/Uniqueness (for ill-posed problems). This is the prejudice that "every question has an answer." Empirical Calibration is only a desideratum if you claim the probability is physical; if it's epistemic, it's optional.

  **The Damage Dealer:**
  **Parameterization Invariance** does the most damage to popular proposals. It kills the naive "uniform over everything" approach immediately. It forces you to admit that Bertrand's Paradox isn't a paradox; it's a proof that the problem was ill-posed.

  ---

  ### Part 3: Evaluating "Description-Invariance"

  Your pet requirement is the correct one, but it has a cost.

  *   **What it buys:** It immunizes you against linguistic tricks. It prevents students from solving the Cube problem by simply choosing the variable that makes the math easiest. It forces the question: "What is invariant about the physical setup?"
  *   **What it costs:** It renders the Principle of Indifference useless for vague problems. It turns the principle from an answer-generator into a well-posedness-test. It tells you when you *can't* calculate a probability.
  *   **Circularity:** It is not circular, but it is **regressive**. To find the invariant measure, you need to know the symmetries. To know the symmetries, you need to know the physical mechanism. If the mechanism is unknown (Case 1, 2, 4), you cannot derive the measure without adding assumptions. The "rule" doesn't generate the assumption; it only checks it.

  ---

  ### Part 4: Classroom Lines (The Three Approaches)

  Here is how to summarize the three standard responses to your students, evaluated against the list above.

  **1. Maximum Entropy / Group Invariance**
  *   **Pitch:** "We pick the distribution that maximizes uncertainty subject to the known symmetries of the physical setup."
  *   **Performance:** Satisfies Symmetry Respect and Parameterization Invariance (if symmetries are known). Fails Existence/Uniqueness on ill-posed problems (like Bertrand's) because it refuses to guess the symmetry.
  *   **Verdict:** Logically robust, but demands more physical information than the problem statement often provides.

  **2. Reference Priors ("Just use what works")**
  *   **Pitch:** "We pick the prior that minimizes the impact of the prior on the posterior as data accumulates."
  *   **Performance:** Satisfies Empirical Calibration (asymptotically). Ignores Parameterization Invariance (different parameterizations yield different reference priors). Treats Ignorance Preservation as irrelevant.
  *   **Verdict:** Pragmatically useful for statistics, but philosophically dishonest about "ignorance." It admits it's a tool, not a truth.

  **3. Flat Refusal ("The question is nonsense")**
  *   **Pitch:** "Probability requires a model. 'Random' is not a model. Without a physical mechanism, there is no probability."
  *   **Performance:** Satisfies Coherence and Parameterization Invariance perfectly (by assigning nothing). Fails Existence/Uniqueness (gives no answer).
  *   **Verdict:** The only logically consistent stance for Case 1, but unsatisfying for students who want to calculate things.

  ---

  ### Part 5: Inference vs. Heuristic (The Crucial Distinction)

  You asked where the list changes if this is for **statistical inference** vs. a **teaching heuristic**.

  *   **If grounding Inference:** **Parameterization Invariance** and **Coherence** are non-negotiable. You cannot build a scientific model on a foundation that yields different results when you change units (cm to inches). You must accept that some problems have no solution until more data is provided.
  *   **If teaching Heuristic:** **Existence/Uniqueness** becomes the priority. Students need to learn how to calculate. In this context, you explicitly state: "We are *stipulating* a parameterization (e.g., uniform cut point) to make the problem solvable." You teach them that Bertrand's Paradox is a warning label, not a calculation error.

  **Final Advice for the Class:**
  Tell them the Principle of Indifference is not a law of logic; it is a modeling assumption. Bertrand's Paradox does not show that probability is broken; it shows that "random" is a physical claim, not a mathematical one. If you don't specify the physics (the symmetry), you don't get a probability. The "correct" answer is the one that matches the mechanism that generates the chord. If there is no mechanism, there is no answer.
