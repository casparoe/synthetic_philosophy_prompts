  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Are they talking past each other? *Correction:* Ensure Sarah directly addresses Elias's point about treaty inertia, and Elias addresses Sarah's point about conditional commitments.
      *   *Check:* Is the "Commitment Race" concept clear? *Correction:* Make sure they discuss the *act* of committing as the variable, not just the standard itself.
      *   *Check:* The "Second Mover" argument. If the first sets the standard, what does the second do? The prompt says "Neither wants to be measured by the other's yardstick." So if Merrivale goes first, Callow is measured by Merrivale's standard. Sarah's argument should be: Let them set it, then we lobby to tweak it, or we accept it because the cost of fighting the standard is higher than the cost of the standard itself. Or, better: A conditional commitment removes the incentive for *them* to rush too.
      *   *Check:* The "Deadline Collapse." This is a game theory nuance. If there's a continuous time window, and being *just* before them is best, when do you jump? Elias needs to defend the "just do it now" against the "wait until the last second" logic.
      *   *Check:* The "Binding Agency" point. Is it specially bad? Elias should argue it's just cost-benefit. Sarah should argue it degrades the lab's ability to adapt safely.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Elias:* "Merrivale is filing Monday. We file Friday."
      *   *Sarah:* "Why? Because they are filing?"
      *   *Elias:* "Because the treaty locks the incumbent standard."
      *   *Sarah:* "Only if everyone treats it as a race. If we offer a conditional pledge..."
      *   *Elias:* "Conditionals are noise. Diplomats want certainty."
      *   *Sarah:* "Diplomats want stability. A race creates instability."
      *   *Elias:* "The instability is already there. The advantage is objective."
