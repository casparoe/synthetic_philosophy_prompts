      *   *Point 2: First vs. Second Mover.* Elias says first sets the rules. Sarah says second can copy/tweak without design risk. Elias counters that "tweaking" looks like non-compliance or fragmentation.
      *   *Point 3: Deadline Collapse.* Sarah argues there's no optimal time to jump, so the deadline collapses to "now." Elias argues this proves the race is real, not pathological.
