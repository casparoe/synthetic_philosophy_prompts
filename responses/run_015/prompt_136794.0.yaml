prompt: |-
  hey -- i'm working on a feature about hypocrisy and who's actually allowed to call people out, and I keep hitting this wall of a phrase: "if you've got the same dirt on your hands you don't get to point at theirs." people throw it around like its self-evidant. last week I was at a panel on climate rhetoric and someone used it to defend a politician who'd fudged carbon numbers -- the critic, they said, had once shared an oversimplified infographic in 2019, so he had "no standing."

  I'm trying to figure out what that slogan could actually mean, because right now it feels like five different arguments wearing the same coat. could you separate out the precise claims hiding in "shared guilt cancels your right to blame"? like: is it about moral authority, or about being a hypocrite, or about some logical rule that you can't apply a standard you violate? and for each version, tell me if it's just a platitude, if it's actually defensible, if it's false, and whether it saves the panelist's argument about the climate critic.

  also -- there's this weird middle case I'm stuck on. what if the critic's old infographic was genuinely wrong but he corrected it publically, while the politician is still lying? does that change which reading applies? I want the menu of interpretations, not one winner, so I can bring it to my editor.
