answer: |-
  This is a rich vein for a feature. The phrase you're grappling with is a colloquial wrapper for the *tu quoque* fallacy, but as you've noticed, people don't use it as a logical error; they use it as a social rule. It functions less like math and more like a norm enforcement mechanism.

  To help you build your menu for your editor, here are four distinct philosophical claims hiding inside "shared dirt cancels your right to blame." I've broken them down by what they claim, their validity, and whether they rescue your panelist.

  ### 1. The Logical Claim (The Truth Condition)
  *   **The Argument:** "You cannot assert that Action X is wrong if you have committed Action X. Your violation negates the truth of your accusation."
  *   **Status:** **False.** This is the classic *tu quoque* fallacy. The truth value of a statement ("Carbon numbers were fudged") is independent of the speaker's behavior. A smoker can correctly tell you that smoking causes cancer.
  *   **Is it a platitude?** Yes. It feels wise but collapses under scrutiny.
  *   **Does it save the panelist?** **No.** Even if the critic shared a bad infographic, the politician's carbon numbers are either fudged or they aren't. The critic's past error does not alter the data.

  ### 2. The Moral Authority Claim (The Virtue Condition)
  *   **The Argument:** "To call someone out is an act of moral leadership. Hypocrisy disqualifies you from leadership because it demonstrates a lack of integrity."
  *   **Status:** **Defensible (with limits).** This isn't about *truth*; it's about *ethos*. If you demand sacrifice from others that you won't make yourself, you lose the moral standing to *lead* that demand. This holds water in contexts of mentorship, parenting, or religious leadership.
  *   **Is it a platitude?** No, it's a coherent ethical stance regarding credibility.
  *   **Does it save the panelist?** **No.** This relies on **equivalence**. For this to work, the "dirt" must be of the same moral weight. Sharing an oversimplified infographic (an error of communication) is not morally equivalent to fudging official government data (an act of deception). The critic might have muddy hands; the politician has bloody ones. The disparity in scale breaks the moral equivalence.

  ### 3. The Judicial Claim (The Standing to Punish)
  *   **The Argument:** "You do not have the right to enforce penalties or demand accountability for a rule you routinely violate."
  *   **Status:** **Defensible.** This is the "clean hands" doctrine in law. It is unfair to selectively enforce rules. If I speed every day, I lose the standing to demand *you* get a ticket for speeding, because I am using the rule as a weapon rather than a standard.
  *   **Is it a platitude?** No, it's a principle of justice/fairness.
  *   **Does it save the panelist?** **No.** The critic is not acting as a judge or an enforcer. They are acting as an observer. Unless the critic is demanding the politician be jailed while refusing to correct their own infographic, there is no punitive hypocrisy here. Calling out is not the same as sentencing.

  ### 4. The Pragmatic Claim (The Persuasion Condition)
  *   **The Argument:** "Hypocritical criticism is ineffective. Pointing out dirt while dirty is a wasted rhetorical move that will backfire."
  *   **Status:** **Empirically True, Normatively Weak.** Psychologically, audiences *do* reject hypocritical messengers (the "do as I say, not as I do" fatigue). However, just because an argument is less persuasive doesn't mean it shouldn't be made.
  *   **Is it a platitude?** It's a strategic observation, not a moral rule.
  *   **Does it save the panelist?** **Maybe, but weakly.** The panelist could argue, "This critic is ineffective because of their history." But this doesn't defend the *politician*; it only attacks the *critic's strategy*. It doesn't make the carbon numbers accurate.

  ***

  ### The Middle Case: Correction vs. Persistence
  You asked about the scenario where the critic corrected the infographic, but the politician is still lying. This distinction is fatal to the "shared dirt" slogan. Here is how it shifts the menu:

  *   **Against the Logical Claim:** Still no change. Truth is truth.
  *   **Against the Moral Authority Claim:** **This destroys the panelist's defense.** Hypocrisy requires *persistence*. If the critic admitted the error and corrected it, they are no longer hypocritical; they are reformed. If the politician continues to fudge numbers, *they* are the hypocrite (assuming they claim to value accuracy). The "dirt" is no longer shared; one person washed their hands.
  *   **Against the Judicial Claim:** It strengthens the critic's standing. A system that allows for correction is just; a system that demands perfection before speaking is tyrannical.
  *   **Against the Pragmatic Claim:** It flips the script. A critic who admits error gains *more* credibility (vulnerability/honesty), while the politician who doubles down loses it.

  ### How to Frame This for Your Editor
  The slogan "you can't point if you're dirty" is a **category error**. It conflates *epistemology* (what is true) with *sociology* (who is allowed to speak).

  In your feature, you might frame it this way:
  The slogan is only valid if we view "calling out" as a **status game** rather than a **truth-seeking mission**.
  *   If the goal is **Status** (who is the better person?), then the slogan holds: hypocrites lose status.
  *   If the goal is **Truth** (did the politician lie?), then the slogan is a distraction.

  The panelist used a Status argument to win a Truth debate. They tried to disqualify the messenger to validate the message.

  **The "Middle Case" Verdict:**
  If the critic corrected the error, the "shared dirt" premise is factually false. There is no shared dirt. There is *past* dirt (critic) vs. *current* dirt (politician). The slogan collapses entirely because the condition ("if you've *got*... dirt") is no longer met by the critic.

  **Recommendation for the piece:**
  Don't look for the one "true" meaning. Instead, map how the slogan is used as a **shield**. It is rarely used to protect the truth; it is used to protect the powerful from scrutiny by demanding perfection from the powerless. The "shared dirt" argument is almost exclusively deployed by the person with *more* dirt to hide.
