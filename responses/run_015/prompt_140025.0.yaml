answer: |-
  Here is an analysis of how your position hangs together, ranked by the severity of the tensions, followed by the hidden commitments and the cheapest revision.

  ### 1. The Forcing Relations (What pushes what)
  Your position is anchored by **Bullet 1 (Coercion Test)**. It is the normative engine that justifies **3 (Felon Voting)**, **4 (Expats)**, and **6 (Localism)**. **Bullet 2 (Procedural Sovereignty)** acts as the meta-rule: it says who gets to apply Bullet 1. **Bullet 5 (Immigration)** and **Bullet 7/8 (Age/Proxy)** are specific applications that rely on 1 being interpreted in a specific way.

  The pressure comes from whether Bullet 1 is a *moral truth* or a *heuristic*. If it's a moral truth, Bullet 2 is dangerous (it allows the majority to violate the truth). If it's just a heuristic, Bullet 3 loses its force (why is disenfranchisement *unjust* rather than just unwise?).

  ### 2. Ranking the Problems
  Here are the tensions ranked from fatal to manageable.

  **Tier 1: The Foundational Paradox (1 vs. 2)**
  *   **The Clash:** You claim inclusion is a matter of justice (implied by calling disenfranchisement "unjust" in 3), but you also claim the current majority decides the boundary with no external overrule (2).
  *   **Why it's bad:** If the current majority uses Bullet 2 to exclude a group that Bullet 1 says should be included (e.g., they vote to disenfranchise a minority religion), your theory has no resources to call this wrong. You have a normative principle (1) with no enforcement mechanism, and a procedural mechanism (2) with no normative constraints. In a reading group, this will be framed as: *"Is the boundary problem a problem of justice or a problem of power? You are trying to have it both ways."*

  **Tier 2: The Border Coercion (1 vs. 5)**
  *   **The Clash:** You suspect this one, and it is real. Border enforcement *is* coercive. If an agent points a gun at a migrant to stop them entering, that is coercion.
  *   **Why it's bad:** If Bullet 1 is "say over decisions you are coerced by," then prospective immigrants are being coerced by immigration policy. Bullet 1 demands they get a vote; Bullet 5 says the state can exclude them. To hold both, you must argue that border enforcement isn't the *kind* of coercion that triggers democratic rights. That is a hard philosophical sell.

  **Tier 3: The Expatriate Tax (1 vs. 4)**
  *   **The Clash:** You say expats lose the vote (4), but you also say they still file taxes (4). Tax collection is coercive enforcement.
  *   **Why it's bad:** Under a strict reading of Bullet 1, expats should vote on *tax legislation*, even if they lose the vote on social policy. By stripping them of the vote entirely, you violate your own coercion test unless you argue that tax coercion is negligible compared to residence coercion.

  **Tier 4: The Spillover Effect (1 vs. 6)**
  *   **The Clash:** Zoning decisions coerce neighbors (by affecting property values, traffic, school crowding).
  *   **Why it's manageable:** You explicitly rejected the "all affected interests" test in Bullet 1. As long as you maintain that *spillover effects* are not *coercive enforcement*, 6 holds. This is defensible, but you need to define the line between "effect" and "enforcement."

  **Tier 5: The False Alarm (3 vs. 4)**
  *   **The Verdict:** These are actually consistent. Prisoners are under *comprehensive* coercive control (every movement regulated). Expats are under *partial* coercive control (taxes only). If your theory relies on the *degree* or *comprehensiveness* of coercion, 3 and 4 work together perfectly. You don't need to change these.

  ### 3. Hidden Commitments
  You are relying on two premises you haven't written down:

  1.  **The Membership Premise:** You are assuming a distinction between "subjects" (inside the legal order) and "aliens" (outside it). Bullet 1 treats coercion as something that happens *within* a relationship of membership. Without this, border enforcement (5) and tax enforcement on expats (4) look just like domestic policing (3).
  2.  **The Competence/Presence Link:** Bullet 7 (age 16) and Bullet 4 (expats) imply that voting requires not just being coerced, but being *present* to experience the consequences. You are smuggling a "stakeholder" requirement into your "coercion" principle.

  ### 4. The Single Cheapest Revision
  **The Revision:** Qualify **Bullet 1**.
  Change: *"you're one of the people the state will coercively enforce that decision against"*
  To: *"you're one of the people subject to the state's **ongoing, comprehensive legal order**."*

  **Why this works:**
  *   **Saves 5 (Borders):** Stopping someone at the border is not making them subject to the *ongoing legal order*; it is preventing that relationship from starting. This dissolves the "border coercion" objection.
  *   **Saves 4 (Expats):** Paying taxes is partial coercion, not subjection to the *comprehensive* order (you don't have to obey their traffic laws, zoning, etc.).
  *   **Saves 6 (Localism):** Neighbors affected by zoning are not subject to the city's *comprehensive* order, only impacted by specific decisions.
  *   **Keeps 3 (Felon Voting):** Prisoners are the paradigm case of being subject to the comprehensive order.

  **The Cost:**
  You invite the charge of **circularity**. Critics will ask: *"Who decides who is subject to the ongoing legal order?"* If the answer is "the state," then you haven't solved the boundary problem; you've just defined the boundary as "where the state says it is." You trade the "coercion" problem for a "definition" problem. You will have to admit that "comprehensive legal order" is a social fact determined by the very people in Bullet 2, which tightens the knot between 1 and 2 but makes the theory more honest about its circularity.
