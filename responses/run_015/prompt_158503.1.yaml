      *   **Task:** Provide blunt comments on four specific points:
          1.  Accuracy w.r.t. Williams.
          2.  The phenomenon (is the distinction real/meaningful?).
          3.  Relation to demandingness.
          4.  Interest and development (what works, what's verbal, what's missing).
