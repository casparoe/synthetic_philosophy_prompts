      *   *Conceptually (Hofstadter's intent):* Hofstadter isn't just talking about logic; he's talking about *meaning*. The "jump" is the assignment of meaning (isomorphism) to the symbols. The oracle analogy is cold/functional; JOOTSing is warm/cognitive.
      *   *The "Special Human Capacity" aspect:* If JOOTSing is just an oracle, is it special?
          *   Turing machines can have oracles.
