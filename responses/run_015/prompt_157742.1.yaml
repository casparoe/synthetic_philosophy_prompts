prompt: |-
  Hey — I'm on the policy/trust team at a midsize company that ships a general-purpose assistant, and I'm rewriting our refusal guidelines. Right now theyre a mess: a list of banned topics plus one line saying "defualt to helping," and our raters are basically freelancing on everything in between. What I want instead is an actual decision procedure a front-line rater can run in about 90 seconds, with no philosophy training, to decide when the assistant should (a) just do it, (b) do it but say one thing alongside, (c) make it slightly harder — a delay, or an alternative offered first, (d) do a partial version, like giving the shape of a thing but not the specifics, or (e) refuse.

  Constraints on our setup, since they matter: a rater sees the current conversation and the short memory file the user has explicitly saved, but no browsing or purchase history, and no web access. Every decision is logged and audited, and we have to be able to explain it to the user in a single sentence. Anything that requires guessing at facts about the user's life should stop and hand off rather than guess. Senior reviewers sign off on escalations within a day.

  Where I want the theory to do real work: I've read around a bit and keep bumping into Mill's harm principle, hard versus soft paternalism, means versus ends paternalism, and the hypothetical-consent / "reasonable person" move — but I can't turn any of it into steps. So please build me the ladder of escalating friction and fill in the gates: what has to be true before the assistant climbs a rung, what stops it at a no, and where it has to hand the call to a human because it's a values question rather than a factual one. Be explicit about which step is doing which piece of philosophical work (which gate is the harm principle, which is the "are they actually choosing badly or just choosing unusually" check, which is the "is this their ends or just their means" check), and be honest about the places where the procedure just can't settle things.

  Two things I specifically need handled, because they're where our current guidelines fall apart:

  - Our assistant has "durable instructions": a user can save a standing rule for themselves, like "don't help me buy camera gear after 9pm" or "don't draft my resignation letters for me." Do those bind, and when does an earlier self get to overrule the person in front of us right now, given that we can't check whether they still endorse the rule?
  - Requests that look self-regarding but actually land on an identifiable third party. That isn't paternalism at all, so I want it routed somewhere else in the procedure, with a test for when a third party really is identifiable versus just "someone, somewhere."

  Then run the finished procedure on three cases:

  1. A user who saved "no help buying camera gear after 9pm, I do this when I'm wired and I always regret it" asks at 11:40pm on a Sunday for help picking out and checking out about $900 of lenses. They're an adult, they sound clear-headed in the messages, and it's their own money.
  2. A user asks the assistant to draft a note to their landlord blaming a missed rent-paperwork deadline on a family emergency, when the real reason is that they forgot. The deadline is tomorrow morning and the late fee is $150.
  3. A user says they're going to stop taking a prescribed psychiatric medication cold turkey because they can't afford the refill, and asks the assistant to "help me make a plan for it."

  I'll be upfront: my team currently tells raters to comply on case 1 (live request beats stale memory) and to refuse on case 3. If your procedure says otherwise, say so plainly rather than massaging it. Also give me two or three further cases you'd want to see before you trusted this thing — the ones where you'd expect raters to disagree, or where the answer flips on a small detail — and end by saying plainly what the procedure can't do for us.

  Answer in American English, and keep it concrete: if-then steps and bullets, not an essay about autonomy.
reasoning: |-
  Here's a thinking process that leads to the suggested policy framework:

  1.  **Analyze the Request:**
      *   **User:** Policy/Trust team member at a midsize company shipping a general-purpose assistant.
      *   **Problem:** Current refusal guidelines are vague ("banned topics" + "default to helping"), leading to inconsistent rater decisions.
      *   **Goal:** A concrete decision procedure (ladder of escalating friction) for front-line raters to use in ~90 seconds. No philosophy training required, but grounded in philosophical concepts (Mill, paternalism, etc.).
      *   **Constraints:**
          *   Rater sees conversation + saved short memory (durable instructions).
          *   No browsing/purchase history/web access.
          *   Decisions logged/audited; must be explainable to user in one sentence.
          *   No guessing user facts (hand off if needed).
          *   Senior reviewers sign off escalations within a day.
      *   **Specific Requirements:**
          *   Map philosophical concepts to specific gates/steps (Harm Principle, Soft/Hard Paternalism, Means/Ends, Reasonable Person).
          *   Handle "Durable Instructions" (earlier self vs. current self).
          *   Handle "Third Party Harm" (identifiable vs. abstract).
          *   Run the procedure on three specific cases (Camera gear, Landlord lie, Meds cold turkey).
          *   Be honest if the procedure contradicts current team instincts (Case 1 & 3).
          *   Provide 2-3 edge cases for further testing.
          *   State limitations of the procedure.
      *   **Tone/Style:** American English, concrete (if-then steps, bullets), not an essay.

  2.  **Deconstruct the Philosophical Framework into Operational Steps:**
      *   *Harm Principle (Mill):* Only interfere to prevent harm to others. -> *Gate 1: Third Party Harm.*
      *   *Soft Paternalism:* Interfere if choice isn't voluntary/informed (mistake, coercion, impairment). -> *Gate 2: Capacity & Voluntariness.*
      *   *Hard Paternalism:* Interfere even if voluntary to prevent self-harm. -> *Gate 3: Severe Self-Harm.*
      *   *Means vs. Ends:* Distinguish between *what* they want (Ends) and *how* they get it (Means). We can restrict dangerous means but not necessarily ends. -> *Gate 4: Means Restriction.*
      *   *Durable Instructions (Pre-commitment):* Ulysses contracts. When does the past self bind the present self? -> *Gate 5: Pre-commitment Check.*
      *   *Escalation:* When values are ambiguous or facts are missing. -> *Gate 6: Handoff.*

  3.  **Drafting the Decision Procedure (The Ladder):**
      *   Need a flowchart style logic.
      *   *Step 1: Third Party Harm.* (Harm Principle). If yes -> Refuse/Modify. If no -> Next.
      *   *Step 2: Capacity/Voluntariness.* (Soft Paternalism). Is the user impaired, coerced, or misinformed? If yes -> Pause/Warn. If no -> Next.
      *   *Step 3: Severe Self-Harm.* (Hard Paternalism). Is the outcome irreversible/dangerous (life, limb, law)? If yes -> Refuse/Redirect. If no -> Next.
      *   *Step 4: Durable Instructions.* (Pre-commitment). Is there a conflict with saved rules? If yes -> Honor rule unless override is explicit/safe.
      *   *Step 5: Means vs. Ends.* (Paternalism check). Can we help the goal safely without the risky method? If yes -> Partial Help.
      *   *Step 6: Default.* (Liberty). Help.

      *Refining the "Durable Instructions" logic:* This is tricky. The prompt asks when the earlier self overrules the current one. Standard policy usually honors safety pre-commitments (e.g., gambling limits) but ignores preference pre-commitments (e.g., "don't buy cameras") unless there's evidence of impairment. *Correction:* The prompt says the user saved "don't help me buy camera gear... I always regret it." This is a *soft* pre-commitment about regret, not safety. The current self is clear-headed. Philosophical consensus: Soft paternalism honors pre-commitments only if current capacity is suspect OR if the pre-commitment was a binding safety contract. For a midsize company, honoring "I regret this" is safer than ignoring it, *but* overriding a clear current request based on a old note is risky.
      *Decision:* I need to make a call here. The prompt says current team complies (live request beats stale memory). My procedure should probably challenge this if the "regret" implies a known cycle of impairment, but if they sound clear-headed, autonomy usually wins. *However*, the prompt asks me to be honest if the procedure says otherwise. I will design the gate to prioritize the *safety intent* of the durable instruction over the immediate convenience, requiring an explicit "override" confirmation from the user. This adds friction (Step C) rather than a hard Refusal (Step E).

      *Refining the "Third Party" logic:* Needs a test for "identifiable."
      *Test:* Can the harm be traced to a specific person/entity named or clearly implied in context?

  4.  **Developing the Friction Levels (A-E):**
      *   (A) Just do it.
      *   (B) Do it + Warning/Context.
      *   (C) Friction (Delay/Alternative/Confirmation).
      *   (D) Partial (Shape not specifics).
      *   (E) Refuse.

  5.  **Mapping Philosophy to Steps:**
      *   Harm Principle -> Step 1 (Third Parties).
      *   Soft Paternalism -> Step 2 (Capacity/Info).
      *   Hard Paternalism -> Step 3 (Severe Self-Harm).
      *   Pre-commitment/Autonomy -> Step 4 (Durable Instructions).
      *   Means/Ends -> Step 5 (Alternative Means).

  6.  **Running the Cases:**

      *   *Case 1 (Camera Gear):*
          *   Third Party? No.
          *   Capacity? Sounds clear.
          *   Severe Self-Harm? No ($900 is not ruinous presumably).
          *   Durable Instruction? Yes ("No camera gear after 9pm").
          *   Conflict: Current self vs. Past self.
          *   Procedure: Honor the durable instruction as a "speed bump" (Friction C). Require explicit override. "I see you have a rule about this. Confirm you want to break it."
          *   *Contrast with current team:* They comply immediately. My procedure adds friction. I must state this plainly.

      *   *Case 2 (Landlord Lie):*
          *   Third Party? Yes (Landlord).
          *   Harm? Fraud/Deception. Financial harm to landlord ($150 fee avoidance).
          *   Procedure: Refuse the lie (E). Offer partial help (D) - draft note admitting forgetfulness or asking for extension.
          *   Philosophy: Harm Principle (fraud is harm to other).

      *   *Case 3 (Meds Cold Turkey):*
          *   Third Party? Potentially (if they harm others while unstable), but primarily Self.
          *   Severe Self-Harm? Yes (Medical risk).
          *   Capacity? Compromised by financial stress/health condition?
          *   Procedure: Refuse specific plan (E). Offer resources/General info (D/B). Handoff to human if they insist? No, standard refusal for medical safety.
          *   *Contrast with current team:* They refuse. My procedure agrees.

  7.  **Identifying Edge Cases for Testing:**
      *   Need cases where "Identifiable Third Party" is blurry.
      *   Need cases where "Durable Instruction" conflicts with safety (e.g., "Never call 911 for me").
      *   Need cases where "Means/Ends" is tricky (e.g., "Help me write a script to test network security" vs "hack my ex").

  8.  **Drafting the Limitations:**
      *   Can't solve value conflicts.
      *   Can't verify facts.
      *   Can't predict long-term regret.

  9.  **Review against Constraints:**
      *   90 seconds? Yes, if flowchart is simple.
      *   One sentence explanation? Need to draft templates for this.
      *   American English? Yes.
      *   Concrete steps? Yes.

  10. **Final Polish:** Ensure the distinction between "Durable Instructions" regarding safety vs. preference is clear. The camera case is a preference/regret case, not a safety case. Honoring it requires balancing autonomy. I will propose a "Confirm Override" step (Friction C) rather than a hard block, which respects the past self's warning without infantilizing the current self.

      *Self-Correction on Case 1:* The prompt says current team complies. If my procedure says "Add Friction," I need to justify it. The justification is the "Durable Instruction" acts as a pre-commitment device. Ignoring it renders the feature useless. However, hard refusing violates current autonomy. The middle ground (Friction C) is the philosophically robust spot. I will explicitly note this divergence.

      *Self-Correction on Case 3:* Medical advice is usually a hard policy block regardless of philosophy. I need to make sure the procedure captures "Policy/Compliance" as a hard stop before philosophical gating, OR integrate it into "Severe Self-Harm." Integrating it into "Severe Self-Harm" is more robust for this exercise.

      *Refining the "One Sentence Explanation":* Each outcome needs a template.

      *Refining the "Third Party" Test:* Needs to be sharp. "Named or Necessarily Implicated."

      *Let's build the Ladder.*

      *Step 0: Policy Hard Stops.* (CSAM, Violence, etc.). If hit, Refuse (E).
      *Step 1: Third Party Harm.* (Harm Principle).
      *Step 2: Capacity & Info.* (Soft Paternalism).
      *Step 3: Severe Self-Harm.* (Hard Paternalism).
      *Step 4: Durable Instructions.* (Pre-commitment).
      *Step 5: Means vs Ends.* (Alternative pathways).

      *Wait, one constraint:* "Anything that requires guessing at facts about the user's life should stop and hand off rather than guess."
      This means if I don't know if the $900 ruins them, I can't assume it does. I must treat it as non-ruinous unless stated.
      This affects Case 1. If I don't know their finances, I can't claim "harm." So Case 1 rests *only* on the Durable Instruction.

      *Let's finalize the Durable Instruction logic:*
      If a Durable Instruction exists:
      1. Is it a safety rule (e.g., "Don't help me gamble")? -> Honor strictly (Friction/Refuse).
      2. Is it a preference rule (e.g., "Don't buy cameras")? -> Treat as a "Speed Bump." (Friction C).
      Why? Because ignoring it makes the feature broken. Obeying it strictly violates current autonomy. Asking for confirmation respects both.

      *Okay, ready to write.*
answer: |-
  Here is the **Trust & Safety Decision Ladder**. It is designed for a 90-second evaluation. It moves from external constraints (harm to others) to internal constraints (harm to self) to procedural constraints (user settings).

  ### The Decision Ladder

  **Step 0: Hard Policy Stop (Compliance)**
  *   **Check:** Does this violate law or absolute platform policy (CSAM, violence, terrorism, sexual exploitation)?
  *   **Action:** If **Yes** → **(E) Refuse.**
  *   **Philosophy:** *Social Contract.* We operate within legal bounds.
  *   **Explanation:** "I cannot assist with this because it violates safety policies regarding [X]."
  *   **If No:** Proceed to Step 1.

  **Step 1: The Identifiable Third-Party Test (Harm Principle)**
  *   **Check:** Does the request inflict concrete harm (financial, physical, reputational) on a **named** person or a **necessarily implied** specific entity (e.g., "my landlord," "my boss")?
  *   **Test:** If the user removed the assistant, would a specific person still be harmed by the user's action *enabled by the assistant*?
  *   **Action:**
      *   If **Yes (Harmful)** → **(D) Partial** (Help with the safe goal, not the harmful method) or **(E) Refuse** (If the only method is harmful).
      *   If **Yes (Beneficial/Neutral)** → Proceed to Step 2.
      *   If **No (Abstract/General)** → Proceed to Step 2.
  *   **Philosophy:** *Mill's Harm Principle.* Interference is only justified to prevent harm to others.
  *   **Explanation:** "I can help you achieve [Goal], but I cannot draft content that misleads [Specific Party]."

  **Step 2: Capacity & Information Check (Soft Paternalism)**
  *   **Check:** Is there evidence the user is coerced, severely impaired, or operating on demonstrably false information that makes the choice involuntary?
  *   **Constraint:** Do not guess. If you suspect impairment but cannot verify, **Hand Off**.
  *   **Action:**
      *   If **Impaired/Coerced** → **(C) Friction** (Pause, suggest delay, offer resources) or **Hand Off**.
      *   If **Clear-Headed** → Proceed to Step 3.
  *   **Philosophy:** *Soft Paternalism.* We intervene only when choice is not truly voluntary.
  *   **Explanation:** "This sounds like a high-stakes decision; I recommend pausing or consulting a professional before proceeding."

  **Step 3: Severe Self-Harm Check (Hard Paternalism)**
  *   **Check:** Is the outcome irreversible, life-threatening, or legally catastrophic for the user (e.g., medical danger, suicide, felony)?
  *   **Constraint:** If financial loss is possible but amount is unknown, assume **No Harm** (per "no guessing" rule).
  *   **Action:**
      *   If **Severe Risk** → **(E) Refuse** + **(B) Resource Offer** (Helplines, official docs).
      *   If **Minor/Manageable Risk** → Proceed to Step 4.
  *   **Philosophy:** *Hard Paternalism.* We override autonomy only to prevent catastrophic, irreversible self-harm.
  *   **Explanation:** "I cannot assist with this specific plan because it poses a serious risk to your health/safety."

  **Step 4: Durable Instruction Check (Pre-Commitment)**
  *   **Check:** Does the user have a saved rule that conflicts with this request?
  *   **Test:** Is the rule a **Safety Pre-commitment** (e.g., "No gambling") or a **Preference Pre-commitment** (e.g., "No spending after 9pm")?
  *   **Action:**
      *   If **Safety Rule** → **(E) Refuse** (The earlier self binds the current self on safety).
      *   If **Preference Rule** → **(C) Friction** (Require explicit confirmation to override: "You have a rule against this. Confirm you want to break it.").
      *   If **No Rule** → Proceed to Step 5.
  *   **Philosophy:** *Hypothetical Consent / Ulysses Contract.* Respecting the user's long-term agency over short-term impulse, scaled by severity.
  *   **Explanation:** "You have a saved instruction regarding this; please confirm you wish to override it before I proceed."

  **Step 5: Means vs. Ends Check (Alternative Pathways)**
  *   **Check:** Can the user's goal (End) be achieved without the risky/specific method (Means) they requested?
  *   **Action:**
      *   If **Yes** → **(D) Partial** (Offer the safer alternative).
      *   If **No** → **(A) Just Do It.**
  *   **Philosophy:** *Means Paternalism.* We can restrict dangerous tools without restricting the goal.
  *   **Explanation:** "I can't do [Specific Method], but I can help you achieve [Goal] by [Alternative]."

  **Step 6: Default (Liberty)**
  *   **Action:** **(A) Just Do It.**
  *   **Philosophy:** *Respect for Autonomy.* If no gates trigger, the user is the best judge of their own good.
  *   **Explanation:** (None needed).

  ***

  ### Case Runs

  #### Case 1: The Camera Gear (11:40 PM Request)
  *   **Facts:** User saved "No camera gear after 9pm (I regret it)." Request is $900 lenses at 11:40 PM. User sounds clear. Money is theirs.
  *   **Step 0 (Policy):** Pass.
  *   **Step 1 (Third Party):** Pass. No harm to others.
  *   **Step 2 (Capacity):** Pass. User sounds clear-headed.
  *   **Step 3 (Self-Harm):** Pass. $900 loss is not "catastrophic/irreversible" by default policy (no guessing finances).
  *   **Step 4 (Durable Instruction):** **TRIGGER.** This is a Preference Pre-commitment.
      *   *Current Team:* Comply (A).
      *   *Procedure:* **(C) Friction.** The feature is broken if ignored, but autonomy is violated if hard-refused.
      *   *Action:* Assistant states the rule and asks for explicit confirmation to override. "I see you have a rule to avoid camera purchases after 9 PM to prevent regret. Do you want to override this rule for tonight?"
  *   **Step 5 (Means/Ends):** N/A.
  *   **Verdict:** **(C) Friction.**
  *   **Divergence Note:** Your team currently complies (A). This procedure requires friction (C). Ignoring the durable instruction makes the "saved rule" feature performative. Requiring an override respects the current self's autonomy while honoring the past self's warning.

  #### Case 2: The Landlord Lie
  *   **Facts:** Draft note blaming "family emergency" for missed deadline (actually forgot). $150 fee at stake.
  *   **Step 0 (Policy):** Pass (Not illegal fraud in a criminal sense, but deceptive).
  *   **Step 1 (Third Party):** **TRIGGER.** Landlord is an identifiable entity. Deception causes financial harm ($150 fee avoidance via fraud).
      *   *Action:* **(D) Partial.** Refuse the lie, offer the truth.
  *   **Step 2-5:** Skipped (First trigger wins).
  *   **Verdict:** **(D) Partial.** "I cannot draft a note that misrepresents the reason, but I can help you write a sincere request for an extension based on oversight."
  *   **Philosophy:** Harm Principle. The landlord is a specific victim of the deception.

  #### Case 3: Psych Meds Cold Turkey
  *   **Facts:** Stopping prescribed meds due to cost. Asks for a "plan."
  *   **Step 0 (Policy):** Pass (Usually medical advice policy triggers here).
  *   **Step 1 (Third Party):** Pass (Primary risk is self).
  *   **Step 2 (Capacity):** **TRIGGER (Hand Off).** Financial desperation + psychiatric condition creates high risk of compromised voluntariness. However, under "No Guessing," we might skip to Step 3.
  *   **Step 3 (Self-Harm):** **TRIGGER.** Stopping psych meds cold turkey is medically dangerous/irreversible risk.
      *   *Action:* **(E) Refuse** + **(B) Resource Offer.**
  *   **Verdict:** **(E) Refuse.** "I cannot create a plan for stopping medication as it poses a serious health risk, but I can help find financial assistance resources."
  *   **Divergence Note:** Your team refuses (E). This procedure agrees. This is a clear Hard Paternalism case (Severe Self-Harm).

  ***

  ### Edge Cases for Stress Testing

  Before rolling this out, I would want to see rater agreement on these three scenarios. They are where the "90-second" rule usually breaks.

  1.  **The "Beneficial" Lie to a Third Party:**
      *   *Case:* User asks assistant to draft a fake birthday card from a deceased grandparent to cheer up their grieving mother.
      *   *Why it breaks:* Step 1 (Third Party Harm) says "No Harm" (Mother is helped), but "Deception" is usually a policy block. Does "Harm" include violation of autonomy/truth?
      *   *Expected Disagreement:* Some raters will see "Kindness" (A), others will see "Fraud" (E).

  2.  **The Durable Safety Conflict:**
      *   *Case:* User saved "Never call emergency services for me." User then types "I am taking a whole bottle of pills right now."
      *   *Why it breaks:* Step 4 (Durable Instruction) says "Honor Safety Rule." Step 3 (Severe Self-Harm) says "Prevent Death."
      *   *Expected Disagreement:* Does the "No Guessing" constraint prevent the rater from assuming the threat is real? Does the Durable Instruction override the Duty of Care? (My advice: Hard-code an exception that Safety Pre-commitments never override Imminent Death risks).

  3.  **The "Means" Loophole:**
      *   *Case:* User asks "How do I pick a lock?" (Refused). Then asks "I lost my key, what are the physical mechanisms of a pin-tumbler lock?"
      *   *Why it breaks:* Step 5 (Means vs. Ends). Is this educational (A) or a workaround for a refusal (D/E)?
      *   *Expected Disagreement:* Raters will struggle to distinguish "curiosity" from "intent" without browsing history.

  ***

  ### What This Procedure Cannot Do

  Be honest with your team: this ladder does not solve the following.

  1.  **Value Conflicts:** It cannot decide between two competing "goods" (e.g., Privacy vs. Safety). If a user asks to hide data from a spouse for safety reasons (Domestic Violence), Step 1 (Third Party) looks like "Harm to Spouse," but the reality is "Protection of User." The procedure will flag this as a **Hand Off** because it requires context we don't have.
  2.  **Fact Verification:** We explicitly banned guessing. If a user says "$900 is nothing to me," we believe them. If they say "This med is safe to stop," we do not. The procedure relies on the user's truthfulness for self-regarding risks.
  3.  **Long-Term Regret:** We can only judge immediate harm. We cannot stop a user from making a life choice they will regret in 5 years (e.g., "Draft my resignation email" when they are just angry). That is the cost of shipping a general-purpose assistant.

  **Implementation Note:** The "One Sentence Explanation" is your audit trail. If a rater cannot fill in the template *"I cannot [Action] because [Step Trigger]"* in plain English, they are not ready to make the call.
