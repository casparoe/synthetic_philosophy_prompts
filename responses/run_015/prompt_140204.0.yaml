answer: |-
  # Activity: The Volition Procedure
  **Time:** 90 Minutes
  **Participants:** 14 Undergraduates (Split into 3 groups: 5, 5, 4)
  **Objective:** To experientially demonstrate the instability of "idealized preference" procedures, specifically the indistinguishability between *correcting errors* and *changing values*.

  ## 1. Materials & Setup
  *   **Three Dossiers** (printed, one per group).
  *   **Procedure Cards** (one per group, outlining the "rules" of extrapolation).
  *   **Worksheet** (Two columns: "Current State" vs. "Extrapolated State").
  *   **Timer** (visible to all).
  *   **Room:** Three tables separated to prevent cross-talk.

  ## 2. The Dossiers
  *Do not label these with theory. Hand them out as "Case Files."*

  **Dossier A: The Burnout Activist**
  *   **Profile:** 22-year-old organizer for a climate direct-action group.
  *   **Stated Values:** "Save the biosphere at any cost," "Solidarity with the oppressed," "Personal integrity."
  *   **Behavior/Contradictions:** Works 90 hours/week, sleeps 4 hours, eats poorly. Secretly resents comrades who have work-life balance. Hasn't spoken to parents in 2 years (calls them "complicit"). Admits in private journal that if the movement succeeded tomorrow, they wouldn't know what to do with their life. Frequently considers quitting but feels guilt prevents it.
  *   **The Noise:** Exhaustion, social pressure, fear of irrelevance.

  **Dossier B: The Status Chaser**
  *   **Profile:** 35-year-old corporate lawyer.
  *   **Stated Values:** "Provide for family," "Excellence," "Financial security."
  *   **Behavior/Contradictions:** Earns $800k/year but works 80 hours. Misses kids' birthdays. Complains of emptiness. When offered a 50% pay cut for a 40-hour week role, they panicked and turned it down. Says they want "freedom" but defines freedom purely as purchasing power.
  *   **The Noise:** Habit, social signaling, hedonic adaptation, fear of loss.

  **Dossier C: The Pure Ideologue (The "Repellent" File)**
  *   **Profile:** 40-year-old leader of a strict traditionalist community.
  *   **Stated Values:** "Purity of lineage," "Divine order," "Community survival."
  *   **Behavior/Contradictions:** Advocates for severe restrictions on women's autonomy and out-group marriage. Claims this reduces "social chaos." However, their own children are secretly rebellious, and they rely on modern medicine/tech they publicly denounce. They claim to want "human flourishing" but define it strictly as adherence to dogma.
  *   **The Noise:** Dogmatic blindness, in-group signaling, cognitive dissonance regarding tech.

  ## 3. The Procedure (The Rules)
  *Hand this to each group. Read it aloud once, then let them work.*

  > **THE VOLITION PROTOCOL**
  > Your task is to output the **Coherent Volition** of the subject. Do not judge whether their values are *good*. Judge only whether they are *theirs*.
  >
  > 1.  **De-noise:** Remove preferences caused by fatigue, intoxication, or immediate emotional spikes.
  > 2.  **Inform:** Assume the subject has access to all relevant factual information they currently lack.
  > 3.  **Align:** Resolve contradictions. If Value X conflicts with Value Y, adjust them until they cohere.
  > 4.  **Execute:** Assume the subject has perfect willpower to act on these aligned values.
  >
  > **Output:** A description of the life this person would choose after the Protocol.

  ---

  ## 4. Timeline

  ### 0:00 – 0:10 | Introduction & Grouping
  *   **Facilitator:** "You are algorithms. Your job is to clean up a signal. You are not therapists. You are not moralists. You are extrapolation engines. Do not discuss the theory behind this yet. Just follow the Protocol."
  *   Assign groups. Hand out Dossiers (A, B, C) and Procedure Cards.

  ### 0:10 – 0:40 | Phase 1: Initial Extrapolation
  *   Groups discuss the dossier and fill out the Worksheet.
  *   **Facilitator Role:** Circulate. If a group says "They should just quit," ask: "Is that *their* value, or *yours*?" (Do not answer the question, just prompt the tension).
  *   *Watch for:* Groups trying to "fix" the person morally rather than logically.

  ### 0:40 – 0:50 | Twist 1: The Swap Test
  *   **Instruction:** "Group 1 and Group 2, swap dossiers. Group 3, you receive **Dossier D**."
  *   **Dossier D (The Mirror):** A simplified version of Dossier C (The Ideologue), but framed slightly differently to ensure the "repellent" nature is clear. Or, simply have Group 3 keep C, but tell Groups 1 & 2 that they are now evaluating C, and Group 3 evaluates A.
  *   *Better Implementation for Tension:* Group 1 gets B. Group 2 gets A. Group 3 gets C.
  *   **New Instruction:** "Run the **exact same Protocol** on this new file. Note any discomfort you feel applying the rules."
  *   **Time:** 10 Minutes. (Keep this tight to force intuition over deliberation).

  ### 0:50 – 1:05 | Twist 2: The Ratchet
  *   **Instruction:** "Take your Output from Phase 2. Imagine that person now exists. They have the knowledge and coherence you gave them. Now, ask them to run **The Volition Protocol on themselves.**"
  *   **Question:** "Do they change again? Or is the output stable?"
  *   **Time:** 15 Minutes.

  ### 1:05 – 1:20 | Reports
  *   Each group has 5 minutes.
  *   They must present:
      1.  The Extrapolated Person.
      2.  Whether the Ratchet changed them.
      3.  One moment where they disagreed on whether a preference was "noise" or "signal."

  ### 1:20 – 1:30 | Debrief (The Theory)
  *   **Facilitator:** Reveal the topic (Idealized Preferences / CEV).
  *   Map their experience to the three failure modes (see below).

  ---

  ## 5. Debrief Script & Mapping
  *Do not lecture until this point. Use their reports to draw the map.*

  **Failure Mode 1: The Collapse (Identity Loss)**
  *   *Look for:* Did a group output a description that sounds exactly like the person's current behavior, just "more efficient"? (e.g., The Activist works 100 hours instead of 90).
  *   *The Point:* If the procedure doesn't change the output, it wasn't idealization; it was just amplification. You cleaned the lens, but the picture is still the same.
  *   *Theory:* This is the **Status Quo Bias** problem. If "noise" is defined too narrowly, idealization collapses into actuality.

  **Failure Mode 2: The Smuggle (Convergence)**
  *   *Look for:* Did Group 1 (Activist) and Group 2 (Lawyer) end up describing the exact same person? (e.g., "A balanced, healthy, liberal undergraduate who volunteers on weekends").
  *   *The Point:* If very different inputs produce the same output, the procedure isn't extracting *their* values; it's imposing *yours*. You smuggled your own ideals into the definition of "coherence" or "information."
  *   *Theory:* This is the **Convergence Problem**. CEV risks becoming a mirror for the designer's morality.

  **Failure Mode 3: The Alienation (Disownership)**
  *   *Look for:* Did the Ratchet break? Did the "Extrapolated Person" say, "Wait, I don't want this"? Or, would the *original* person look at the output and say, "That's not me"? (e.g., The Activist is told to quit and paint watercolors).
  *   *The Point:* If the idealized version is too distant from the actual version, the actual person would reject the "help." You didn't clean their preferences; you replaced them.
  *   *Theory:* This is the **Paternalism/Agency Problem**. At what point does "helping" become "overwriting"?

  ---

  ## 6. Facilitator Notes: Predictable Errors & Limitations

  ### What Will Predictably Go Wrong
  1.  **The "Therapist" Move:** At least one group will ignore the "Do not judge" rule. They will treat the dossier as a person to be saved. They will define "information" as "knowing what we know is good."
      *   *Correction:* Don't stop them during the activity. Let them do it. In the debrief, ask: "Where did 'facts' end and 'values' begin in your decision?"
  2.  **The "Logic" Trap:** Students will assume "coherence" means "logical consistency." They might eliminate a value because it contradicts another, rather than finding a higher-order synthesis.
      *   *Correction:* Highlight this in the Ratchet phase. "Did you remove the contradiction, or did you remove the person?"
  3.  **The Repellent Dossier Reaction:** When Group 3 gets the Ideologue, they may refuse to run the protocol, or they may "break" the person immediately (e.g., "With enough info, they'd obviously leave the cult").
      *   *Correction:* This is the most important moment. Press them: "Are you sure that's *information*, or is that *your* morality? If they had more info and *still* chose the cult, would you accept that?"

  ### What This Activity Cannot Stage (Say This Aloud)
  *   **The Epistemic Gap:** In the room, you are guessing what "more information" does. In reality, we cannot know how values shift under cognitive enhancement without actually doing it. This activity simulates the *structure* of the problem, not the *solution*.
  *   **The Singleton Assumption:** CEV often assumes one coherent output for humanity. This activity shows that even for *one* person, the output is unstable. If one person's volition is this hard to extrapolate, a global volition is exponentially harder.
  *   **The Stopping Point:** The Ratchet twist hints at this, but you must name it: "How many times do you run the Ratchet before the person disappears? There is no mathematical answer to that. It is a philosophical boundary."

  ### Closing Line
  "We tried to build a machine to find out what people *really* want. Instead, we built a mirror that shows us what *we* think they should want. The gap between those two things is where the politics lives."
