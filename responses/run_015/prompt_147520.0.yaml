answer: |-
  ### MSc Bargaining Theory: Problem Sheet 4
  **Topic:** The Kalai-Smorodinsky Solution & Monotonicity  
  **Time Allowed:** 60 Minutes  

  **Question 1**  
  Consider a bargaining problem with disagreement point $d = (1, 2)$. The feasible set $S$ is convex, with a Pareto frontier composed of two linear segments. The first runs from $(2, 6)$ to $(5, 7)$ (slope $1/3$), and the second from $(5, 7)$ down to $(8, 3)$ (slope $-4/3$). This gives an initial utopia point $u = (8, 7)$.  

  Now, introduce a "regulatory fallback" that expands Player A's outside option. This extends the frontier horizontally from $(8, 3)$ to $(10, 3)$ without changing Player B's maximum or the disagreement point. The new utopia point is $u' = (10, 7)$.  

  **Tasks:**  
  1.  Compute the Kalai-Smorodinsky (KS) allocation for both $u$ and $u'$, showing your line-intersection work clearly.  
  2.  Explain why A's payoff strictly improves after the shift, even though B's max and the frontier kink haven't moved.  
  3.  Contrast both allocations with the Nash Bargaining Solution (NBS), highlighting exactly where scale invariance and symmetry bite differently.  
  4.  Briefly discuss whether this monotonicity behaviour is normatively attractive in a real-world setting where one side's outside option improves.  

  ---

  ### Model Answer  

  First, we establish the utopia points. Initially, the maximum feasible payoffs are $u=(8,7)$. The Kalai-Smorodinsky line connects the disagreement point $d(1,2)$ to $u$, definded by the slope $\frac{7-2}{8-1} = \frac{5}{7}$. The line equation is $y = \frac{5}{7}x + \frac{9}{7}$. We intersect this ray with the binding Pareto segment connecting $(5,7)$ and $(8,3)$, defined by $y = -\frac{4}{3}x + \frac{41}{3}$. Solving simultaniously: $\frac{5}{7}x + \frac{9}{7} = -\frac{4}{3}x + \frac{41}{3}$. Multiplying by 21 yields $15x + 27 = -28x + 287$, so $43x = 260$, giving $x \approx 6.05$ and $y \approx 5.60$.  

  Following the regulatory fallback, Player A's maximum extends to 10, shifting the utopia point to $u'=(10,7)$. Player B's maximum remains 7. The new KS line connects $d(1,2)$ to $u'$, yielding a slope of $\frac{5}{9}$ and equation $y = \frac{5}{9}x + \frac{13}{9}$. Intersecting this flatter ray with the same frontier segment gives $\frac{5}{9}x + \frac{13}{9} = -\frac{4}{3}x + \frac{41}{3}$. Multiplying by 9 yields $5x + 13 = -12x + 123$, so $17x = 110$, giving $x \approx 6.47$ and $y \approx 5.36$.  

  A's payoff strictly improves because KS satisfies individual monotonicity. The solution equalises the ratio of actual gain to maximum possible gain. When A's maximum possible gain increases, the denominator grows, requiring a larger numerator (actual payoff) to maintain the ratio along the frontier. Even though the physical frontier between 5 and 8 hasn't moved, the 'target' shifted, rotating the compromise line towards A. This ensures A benefits from an expanded opportunity set.  

  Contrast this with the Nash Bargaining Solution. NBS maximises the product of gains $(x-1)(y-2)$ subject to the frontier. Due to the kink at $(5,7)$, the Nash solution locates exactly at the kink for both cases. NBS satisfies Independence of Irrelevant Alternatives (IIA); the extension from 8 to 10 is irrelevant to the optimum at 5. KS violates IIA but satisfies Individual Monotonicity. Both satisfy scale invariance, but symmetry is interpreted differently: KS symmetrises relative concessions, whereas Nash symmetrises absolute utility gains adjusted for curvature. Nash ignores the utopia shift; KS internalises it.  

  Normatively, KS behaviour is attractive in regulatory contexts where outside options reflect legitimate bargaining power. If A's fallback improves, fairness suggests A should capture some surplus. However, it creates perverse incentives: agents might inflate their utopia claims to rotate the KS line. Furthermore, B suffers a loss ($5.60 \to 5.36$) despite no change in their own technology or maxima. In practice, this trade-off between monotonicity and protecting the counterparty from external shifts defines the choice between KS and Nash modelling. It questions whether fairness is relative to potential or strictly bounded by the immediate feasible set.  

  *(412 words)*  

  ---

  ### Marking Scheme (20 Marks Total)  

  **1. Calculation of KS Allocations (5 marks)**  
  *   **Must hit:** Correct derivation of both line equations and intersection points ($x \approx 6.05$ and $x \approx 6.47$).  
  *   **Common mess up:** Candidates often calculate the utopia point incorrectly (forgetting the extension changes Max A) or intersect with the wrong frontier segment.  

  **2. Explanation of Monotonicity (5 marks)**  
  *   **Must hit:** Clear link between the shifting utopia point, the rotation of the KS line, and the axiom of Individual Monotonicity.  
  *   **Common mess up:** Saying A gains because the frontier expanded (it didn't where the solution lies) rather than because the *reference point* moved.  

  **3. Contrast with Nash Solution (5 marks)**  
  *   **Must hit:** Identification that NBS stays at the kink $(5,7)$ due to IIA, whereas KS moves. Mention of symmetry/concession differences.  
  *   **Common mess up:** Claiming NBS also moves, or confusing Scale Invariance with IIA.  

  **4. Normative Discussion (5 marks)**  
  *   **Must hit:** Balanced view on fairness vs. strategic inflation incentives; noting the impact on Player B.  
  *   **Common mess up:** Purely mathematical answer with no real-world context, or ignoring the loss to Player B.
