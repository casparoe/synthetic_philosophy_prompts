answer: |-
  This is a sharp question that cuts to the methodological heart of your seminar. The aphorism *"revolutions devour their own children"* is a historiographical Rorschach test. It describes a phenomenon (elite purging) but is silent on the etiology (cause). The visiting speaker used it as a causal explanation, which is a category error.

  Below is the dissection you requested, followed by an evaluation of how the line functions within the three historiographical families, and a final commitment on its utility.

  ### Part I: A Menu of Claims

  Here are the distinct precise claims the aphorism could be making, categorized by the distinctions you provided.

  **1. The Empirical Frequency Claim**
  *   **Claim:** A statistically significant majority of political revolutions result in the physical elimination (execution, imprisonment, exile) of their founding leadership cadre.
  *   **Verdict:** **Platitude / Selection Bias.**
  *   **Reasoning:** This depends entirely on the denominator. If the sample is "20th-century totalitarian revolutions" (Russia, China, Cambodia), the claim holds. If the sample includes the American Revolution, the Glorious Revolution, or the post-1989 Eastern European transitions, the claim collapses. Most "successful" liberal revolutions do not guillotine their founders. The aphorism survives because bloody revolutions are more memorable (the denominator problem you noted).

  **2. The Coalitional Mechanism Claim**
  *   **Claim:** To overthrow an *ancien régime*, a heterogeneous coalition is required (e.g., bourgeoisie, sans-culottes, intellectuals). To *govern*, a homogeneous center is required. The "children" represent the heterogeneous wings of the initial coalition that must be shed to stabilize the state.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Reasoning:** This aligns with comparative politics (e.g., Theda Skocpol, Sidney Tarrow). It posits a structural tension between *mobilization* (needs breadth) and *institutionalization* (needs narrowness). It explains the Girondin/Jacobin split without invoking "purity."

  **3. The Functional Threat Claim (The Dictator's Dilemma)**
  *   **Claim:** The skills, networks, and militias required to overthrow a regime are identical to the skills required to overthrow the successor regime. Therefore, the founders are objectively the greatest security threat to the new state.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Reasoning:** This is a rational-choice interpretation (e.g., Gordon Tullock). It suggests the Terror was not about ideology but about monopoly on violence. Danton was not killed because he was impure, but because he had the prestige and contacts to stage a coup.

  **4. The Lawlike Necessity Claim**
  *   **Claim:** It is an iron law of history that revolutionary momentum *must* consume its originators; it is teleologically inevitable.
  *   **Verdict:** **Substantive but Probably False.**
  *   **Reasoning:** This is historical determinism. It removes agency and contingency. It assumes a "life cycle" of revolutions that does not exist in the hard evidence. It is a metaphor masquerading as a law.

  **5. The Agentless Emergence Claim**
  *   **Claim:** There is no specific "devourer." The outcome emerges from competitive signaling in an environment where revolutionary virtue is unverifiable and denunciation is cheap.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Reasoning:** This fits the "contingency" reading. In a high-stakes environment with low trust (war, inflation, invasion), pre-emptive denunciation becomes a dominant strategy. The "revolution" doesn't eat anyone; individuals eat each other to survive, and the aggregate looks like a devouring.

  **6. The Definition of "Children" Claim**
  *   **Claim:** The "children" are not people, but the revolution's own ideals (liberty, property, rule of law) which are sacrificed to maintain power.
  *   **Verdict:** **Confused / Metaphorical.**
  *   **Reasoning:** While poetically potent (and often what Romantic historians meant), this cannot do the work the visitor assigned it. The visitor used it to explain *physical purges* of people (Danton, etc.). Swapping to "ideals" changes the subject.

  ---

  ### Part II: Historiographical Implications

  You asked whether the line carries the visitor's inference (no ideological explanation needed) or supports your classmate (ideological logic), or neither.

  **1. The Social / Class-Struggle Reading (Soboul, Lefebvre)**
  *   **Compatibility:** **High.**
  *   **Mechanism:** The "devouring" is the bourgeoisie consolidating power against the popular movement (Hébertists) and the rival aristocratic bourgeoisie (Girondins).
  *   **Inference:** Supports **Neither**. If the visitor uses the line to mean "structural consolidation," it fits the Class reading perfectly. The Class reading *also* argues no "ideological purity" is needed; it argues material interest is the driver. The visitor's inference (it's generic, not ideological) is compatible with Class analysis, but the Class analysis provides a *specific* generic mechanism (class interest) that the visitor ignored.

  **2. The Ideological / Political-Culture Reading (Furet, Baker)**
  *   **Compatibility:** **High (but inverted).**
  *   **Mechanism:** The discourse of popular sovereignty creates a totalitarian dynamic where opposition equals treason.
  *   **Inference:** Supports **The Classmate**. François Furet famously argued that the Terror was not an accident of war but "contained in the discourse of the Revolution from the beginning." If the visitor means "All revolutions share this ideological structure," then the line supports the classmate: the ideology *of revolution itself* is the cause. However, the visitor used it to *dismiss* the need for an ideological story. This is a contradiction. The visitor is using a phrase often associated with Furet to make a Skocpol-style argument.

  **3. The Contingency / War-Emergency Reading (Sutherland, Tackett)**
  *   **Compatibility:** **High.**
  *   **Mechanism:** Panic, invasion, and civil war create a security dilemma.
  *   **Inference:** Supports **The Visitor (with caveats).** This reading aligns best with the Functional Threat Claim (Menu #3). If purges happen in all revolutions, it is likely because all revolutions face the structural problem of internal security during regime transition, often exacerbated by war. This requires no specific "Jacobin ideology," only the universal logic of power consolidation under threat.

  **The Critical Flaw in the Visitor's Inference:**
  The visitor argues: *Premise A: Revolutions always devour their children. Premise B: This is a generic feature. Conclusion: No specific French ideological explanation is needed.*

  This is valid **only if** the mechanism for the generic feature is structural (Coalition/Threat) and not ideological.
  *   If the mechanism is structural (Menu #2, #3, #5), the Visitor wins.
  *   If the mechanism is ideological (Menu #4, or Furet's "totalitarian potential"), the Classmate wins (because the ideology is inherent to the revolutionary form).

  Because the aphorism does not specify the mechanism, **it cannot discriminate between the readings.** It describes the *explanandum* (the thing to be explained), not the *explanans* (the explanation).

  ---

  ### Part III: Final Commitment

  You asked me to commit. Here is the verdict.

  **1. Which reading is the most defensible?**
  The **Functional Threat / Coalitional Mechanism (Menu #2 & #3)** is the most defensible.
  *   **Reasoning:** It relies on the fewest assumptions about national character or specific texts. It is supported by comparative evidence (Stalin purging Old Bolsheviks, Khomeini purging liberals, etc.). It accounts for the timing of the purges (coinciding with the stabilization of the Committee of Public Safety) better than the "unlimited demand for purity" thesis, which struggles to explain why the purges stopped with Thermidor if the ideology remained.
  *   **Extrapolation Marker:** I am extrapolating here that the "security dilemma" is a universal constant of regime change. While strongly supported by political science, applying it retroactively to 1793 assumes rational calculation by actors who may have been genuinely driven by fervor.

  **2. What reading are people normally running when they use this line?**
  They are normally running a **vague mix of Lawlike Necessity (Menu #4) and Ideological Critique.**
  *   **Reasoning:** When historians or commentators use this phrase, they usually imply a moral tragedy inherent to radicalism. They are often channeling Furet without citing him. They mean: "Revolutionary politics creates a logic that makes moderation impossible."
  *   **The Visitor's Error:** The visiting speaker co-opted a phrase usually laden with ideological fatalism and tried to use it as a structuralist shield. This was rhetorically effective but analytically sloppy.

  **3. Does the line do any real work in the argument?**
  **No.**
  *   **Reasoning:** The line is a **conversation stopper**, not a **argument mover**. It asserts a pattern to bypass the need to explain a mechanism.
      *   To your classmate's specific point (that victims were fellow revolutionaries sharing enemies), the line offers no rebuttal. It merely says, "That happens elsewhere too."
      *   To say "It happens elsewhere" is not to say "It happened for the same reasons." (The *fallacy of false equivalence*).
      *   If the American Revolution did *not* devour its children, and the French did, then the "generic revolution" claim is weakened, and the specific French context (War + Ideology) becomes necessary again.
      *   If the Russian Revolution *did* devour its children, we still have to ask: Was it because of Leninist ideology, or because of civil war emergency? The aphorism does not answer this.

  **Summary for your Seminar:**
  The visitor's move was to treat a **phenomenological description** as a **causal mechanism**.
  *   **Valid Point:** Elite purging is a common feature of revolutionary transitions (Coalitional/Functional claim).
  *   **Invalid Inference:** Therefore, the specific ideological content of Jacobinism is irrelevant to the Terror.
  *   **Why:** Because the "devouring" could be caused by the interaction of that specific ideology *with* the structural emergency. The structural vulnerability (Menu #3) creates the *opportunity* for purges; the ideological framework (Classmate's point) provides the *justification* and the *targeting criteria*. You need both to explain 1793-94.

  **Recommendation:**
  Challenge the visitor on the **Denominator Problem**. Ask: "Which revolutions are you counting? If you include the American Revolution, does the law still hold? If not, isn't the 'devouring' specific to a certain *type* of revolution—one defined by the very ideological claims my classmate is highlighting?" This forces the visitor to admit that the "generic" claim actually relies on a specific subset of revolutions (ideologically totalizing ones), which circles back to your classmate's argument.

  *(Extrapolation Note: In asserting the American Revolution as a counter-example, I am relying on the standard historiographical consensus that the American founding elites were not purged. One could argue the Loyalists were "devoured" via exile, but they were not the "children" of the revolution in the same sense as Danton. This distinction is defensible but contestable.)*
