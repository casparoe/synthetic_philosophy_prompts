      *   *Is the Visitor right?* The Visitor is essentially making a "comparative politics" move against a "historical particularist" move. I need to validate that move while showing its limits.
      *   *The "Denominator Problem":* Crucial. If we count the American Revolution, the claim fails. If we count only 20th-century communist revolutions + France, it holds. Selection bias is real.
      *   *Extrapolation Marker:* I need to explicitly state where I'm making a judgment call on historiography (e.g., assessing Furet vs. Soboul).

  11. **Final Polish:** Ensure the distinction between the Classmate's point (Ideology causes purges) and Visitor's point (Structure causes purges) is clear. The Visitor's use of the aphorism is an appeal to *normalcy* to deny *pathology*.

  *(Self-Correction during drafting)*: Wait, I need to make sure I answer the specific question: "Does it carry the visitor's inference?"
  *   If the claim is "All revolutions do this due to structure," then yes, it supports the Visitor (no *specific* French ideology needed).
  *   If the claim is "All revolutions do this due to ideology," then it supports the Classmate (ideology is inherent to revolution).
  *   Since the phrase is ambiguous on *mechanism*, it technically supports neither without further specification. The Visitor *assumes* the mechanism is structural. I need to point out this assumption.

