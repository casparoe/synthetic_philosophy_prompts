  2.  **Deconstruct the Phrase ("Revolutions Devour Their Own Children"):**
      *   *Origin:* Often attributed to Danton ("I would rather be guillotined than guillotine others" / "It is I who created the Revolutionary Tribunal, I ask forgiveness of God and man..."), but the specific phrase is later (19th century?). Actually, often attributed to Vergniaud or generic 19th-century historiography (Michelet, etc.). Need to be careful not to get bogged down in provenance unless it affects meaning, but the prompt asks about the *claim*, not just the quote.
      *   *Meaning:* Revolutionary movements eliminate their early leaders/participants.

  3.  **Drafting the Menu of Claims (Iterative Process):**
      *   *Claim 1: Empirical Frequency.* Most revolutions kill their leaders.
          *   *Verdict:* Platitude/Overstatement. Many do, many don't. Depends on definition of "revolution."
      *   *Claim 2: Structural/Coalitional Mechanism.* Broad coalitions are needed to win, narrow ones to rule. The "children" represent the excess baggage of the coalition.
          *   *Verdict:* Substantive/Defensible (Skocpol, Tarrow, etc.).
      *   *Claim 3: Functional/Threat Mechanism.* Founders have the skills to overthrow, making them threats to the new order.
          *   *Verdict:* Substantive/Defensible (Tullock, dictator's dilemma).
      *   *Claim 4: Ideological/Purity Mechanism.* Ideology demands purity; compromise is betrayal.
          *   *Verdict:* Substantive (Furet), but this is what the Visitor is *denying*. The Visitor uses the phrase to *avoid* this.
      *   *Claim 5: Lawlike Necessity.* It *must* happen.
          *   *Verdict:* False/Confused. Historical determinism is suspect.
      *   *Claim 6: Definition of "Children".* Is it people or ideals?
          *   *Verdict:* Ambiguous. Needs specification.

  4.  **Evaluating the Historiographical Readings:**
      *   *Social/Class (Soboul, Lefebvre):* The bourgeoisie consolidates power. The "children" might be the sans-culottes or rival bourgeois factions. Does the phrase fit? Yes, if "devouring" is class consolidation.
      *   *Ideological/Political Culture (Furet, Baker):* The discourse of popular sovereignty creates a totalitarian dynamic. The phrase fits *perfectly* here, but the Visitor is using it to *argue against* the need for this specific explanation.
      *   *Contingency/War/Emergency (Sutherland, Tackett):* The Terror was a response to invasion and civil war. Purges were about security. Does the phrase fit? Yes, if "devouring" is panic-driven security consolidation.

  5.  **Addressing the Visitor's Inference:**
      *   Visitor says: "It's just what revolutions do" $\rightarrow$ "No special ideological story needed."
      *   Logic: If $X$ happens in all revolutions, $X$ is a structural feature of revolution, not a specific feature of *French Revolutionary Ideology*.
      *   Counter-logic: If $X$ happens in all revolutions, maybe *all* revolutions share that ideological structure? Or maybe the structural conditions (war/coalition) cause it?
      *   The Visitor is arguing for a *comparative/structural* explanation over a *particularist/ideological* one.

  6.  **Developing the Verdicts:**
      *   *Frequency Claim:* Platitude. (Russian, Chinese, yes. American? No. Glorious? No.)
      *   *Coalition Claim:* Substantive/Defensible. (Winning requires breadth, ruling requires narrowness).
      *   *Functional Threat Claim:* Substantive/Defensible. (Revolutionary competence = coup competence).
      *   *Necessity Claim:* False. (Teleological).
      *   *Agentless Process:* Substantive/Defensible. (Radicalization ratchet).

  7.  **Connecting to the Three Families:**
      *   *Class:* Compatible. Devouring = bourgeois stabilization.
      *   *Ideology:* Compatible. Devouring = logic of virtue.
      *   *Emergency:* Compatible. Devouring = security panic.
      *   *Crucial Point:* The phrase *itself* is phenomenological (describes the outcome), not etiological (explains the cause). Therefore, it cannot adjudicate between the three families on its own. The Visitor is smuggling in a structural assumption.

  8.  **Committing to a Conclusion:**
      *   *Most Defensible Reading:* The Functional/Coalitional reading (structural).
      *   *What Users Mean:* Usually a vague mix of fatalism and ideological critique (Furet-style), but the Visitor used it structurally.
      *   *Does it do work?* No. It describes the *what*, not the *why*. It shuts down inquiry rather than advancing it. It's a conversation stopper, not an argument.

  9.  **Refining the Output (incorporating constraints):**
      *   Need to be precise about the distinctions provided in the prompt.
