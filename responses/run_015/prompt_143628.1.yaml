answer: |-
  **Case A**
  The xs are living cells arranged in a continuous sheet. Adjacent xs share membranes containing open ion channels. When one x depolarizes, ions flow through the channels to neighboring xs, causing them to depolarize in a sweeping pattern. The xs maintain the requisite ion gradients internally using metabolic energy. When an x is mechanically disturbed, the resulting depolarization propagates through the channels to all other xs, causing them to contract in unison. The causal origin of the propagation lies entirely among the xs.

  **Case B**
  The xs are living cells arranged in a continuous sheet. Adjacent xs share membranes containing open ion channels. However, the channels are chemically clamped such that no net ion flow originates from the xs themselves. Instead, external ys (micro-actuators) attach to each x. When one x is mechanically disturbed, the ys detect this and inject ions into the neighboring xs through the membranes, replicating the sweeping depolarization pattern exactly. The xs maintain their own ion gradients internally using metabolic energy. When an x is mechanically disturbed, all other xs contract in unison. The causal origin of the propagation lies among the ys, not the xs. The local ion flow rates, membrane topologies, and contraction kinematics are identical to Case A.

  ***

  ### Analysis

  **Verdicts**

  | Theory | Case A (Autonomous) | Case B (Puppeted) | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **(a) Nihilism** | No | No | The xs exist; nothing else exists. Composition never occurs. |
  | **(b) Universalism** | Yes | Yes | The xs exist; therefore, there is an object composed of the xs. Causal origin is irrelevant. |
  | **(c) Life Criterion** | **Yes** | **No** | In A, the activity of the xs constitutes a single life (immanent causation). In B, the xs are individually alive, but their joint activity is externally orchestrated; thus, no *further* life is constituted by the xs. |
  | **(d) Contact Criterion** | Yes | Yes | The xs are bonded/connected identically in both cases. Topological continuity is sufficient for composition. |
  | **(e) Non-Redundancy** | **Yes** | **No** | In A, the xs perform a joint activity (the sweep) no subset could perform. In B, the *ys* perform the joint activity *using* the xs; the xs alone perform no joint activity that requires their plurality. |

  **The Single Feature**
  The feature doing the work is the **locus of causal origin** for the coordinated activity (internal/immanent vs. external/transient). If you delete this distinction—making the cause internal in both cases or external in both cases—the Life Criterion and Non-Redundancy verdicts converge (Yes/Yes or No/No). The Contact Criterion and Universalism remain unaffected by this deletion, as they are synchronic and ahistorical. This isolation demonstrates that the Life Criterion is not tracking the *structure* of the arrangement (which is identical) but rather its *causal history/source*.

  **Stretch Goal: Continuity**
  This pair can be realized as the ends of a continuous process. One can gradually replace internal ion-channel signaling with external actuator injection, one cell at a time. At no step does the local ion flow rate or topological bonding jump discontinuously; the kinematics remain smooth. However, the Life Criterion verdict must flip at some point (when autonomy is sufficiently lost). This generates a Sorites-style pressure: if composition is real, it seemingly vanishes via a series of steps where the physical arrangement remains functionally indistinguishable at every local checkpoint.

  **The Parity Objection (Steelman)**
  *The Objection:* The moderate is gerrymandering. By selecting "immanent causation" as the composition-relevant feature, she privileges a hidden causal property over the visible structural properties that contact-universalists use. Why is *where* the signal starts metaphysically weightier than *that* the signal runs? If the xs behave exactly as if they were one organism in Case B, denying composition looks like fetishizing origin over function. She is simply picking the feature that saves her intuition that B is not an organism, without an independent justification for why causal origin binds parts but causal mimicry does not.

  *The Moderate's Reply:* Composition is not about behavioral prediction; it is about ontological unity. A puppet moves like a person, but the wood and strings do not compose a person because the unity is imposed from without, not generated from within. The Life Criterion tracks *substance*, not *simulation*. If the activity does not originate in the parts, the parts are merely tools for an external agent, and tools do not compose an agent.

  *Honest Assessment:* This pair **hurts the moderate**. While the reply sounds plausible, the case exposes that the Life Criterion cannot be read off the synchronic physical state. It requires access to causal facts that are invisible to the "contact/cohesion" description (Constraint 1). This makes the criterion look less like a principled restriction based on the arrangement of parts and more like a brute fact about causal history. If two arrangements are physically indistinguishable in their operation but differ in composition, the restriction looks unstable: it either collapses into Universalism (if we ignore the hidden cause) or Brutalism (if we insist the cause matters without a structural explanation for why). It suggests the "Life" answer is not a middle ground, but Universalism with a hidden historical clause.
