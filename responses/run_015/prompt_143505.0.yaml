          2.  *Tail-cluelessness:* Uncertainty about magnitude/variance swamping near-term effects. (Solved by symmetry/washing out, *unless* expectations are undefined due to heavy tails).
          3.  *Partition-dependence (The New Complaint):* If expected value sums are only conditionally convergent due to causal sprawl, the value depends on how outcomes are partitioned/ordered. This makes the maximand ill-posed.
