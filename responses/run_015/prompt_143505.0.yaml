answer: |-
  **Project Title:** The Partition Problem in Consequentialist Cluelessness

  **Statement of the Question**
  Consequentialism requires agents to rank acts by their expected value. Standard objections regarding cluelessness argue that long-run consequences are too uncertain to calculate. This project isolates a specific structural failure in that calculation distinct from standard uncertainty. The question is whether the expected value of an act is well-posed when the sum of probability-weighted values is only conditionally convergent. If the total value depends on the order of summation or the partitioning of the outcome space, the consequentialist maximand is ill-defined. This arises not from infinite populations or Pascalian wagers, but from ordinary causal sprawl: the fact that any act ramifies indefinitely into an open-ended future. If this "Partition Problem" holds, act-consequentialism lacks a determinate ranking procedure. Furthermore, does retreating to rule-consequentialism or policy evaluation resolve this, or does aggregating over a larger set of occasions exacerbate the conditional convergence issue?

  **Why Existing Responses Leave the Question Open**
  The literature currently conflates three distinct complaints about cluelessness, addressing the first two while neglecting the third.

  The first complaint is sign-cluelessness: we cannot determine the direction of long-run effects. The standard reply is subjective consequentialism: agents should maximize expected value relative to their credences rather than objective value. This resolves the epistemic gap but assumes the expectation itself exists.

  The second complaint is tail-cluelessness: the variance of long-run effects is so large it swamps near-term differences. The usual reply is that unknown effects are symmetric and wash out in expectation. This relies on the assumption that the relevant expectations are well-defined. If the probability of an effect of a given size shrinks only as a power of that size, the mean may not exist. However, even if the mean exists, a third problem remains.

  The third complaint, which this project addresses, is partition-dependence. If the series of consequences is conditionally convergent, the sum depends on how the space of possible consequences is carved up. By re-partitioning the outcomes, one can make the expected value favour either act in a pair. This renders the ranking arbitrary. Existing responses do not touch this. Moving to imprecise credences with a decision rule handles uncertainty about probabilities, but it does not resolve an ill-posed summation where the value itself shifts with description.

  Finally, the standard retreat to two-level consequentialism—evaluating rules, habits, or institutions rather than acts—is typically viewed as a safe harbour. This project challenges that assumption. Assessing a rule requires aggregating over every occasion on which it is followed, including arbitrarily distant future instances. This creates a strictly larger and more heterogeneous summation space than assessing a single act. If the Partition Problem is real, the two-level move should make the convergence issue worse, not better.

  **Methodology and Work Plan**
  The project will proceed over three months, producing a 9,000-word paper and a short note to the funder.

  *Month 1: Formalizing the Partition Argument.*
  I will construct a formal model showing how ordinary causal chains generate conditionally convergent series without relying on infinite populations or fanaticism-style gambles. The focus will be on demonstrating that causal sprawl alone is sufficient to make the expected value sensitive to partitioning.
  *Why this approach:* Empirical forecasting is unsuitable because the problem is structural, not data-driven. Formal work on infinite domains is often too abstract; this model must remain grounded in the finite-but-open-ended nature of actual agency.

  *Month 2: Testing the Two-Level Retreat.*
  I will compare the aggregation space of a single act against the aggregation space of a general rule. I will determine whether the heterogeneity of rule-instances increases the likelihood of conditional convergence.
  *Why this approach:* Abandoning consequentialism for a non-maximizing framework is premature. We must first determine if the maximizing framework is internally coherent before discarding it.

  *Month 3: Evaluating Solutions and Drafting.*
  I will test potential fixes: (1) a bounded or saturating value function that forces absolute convergence, and (2) a privileged partition supplied by causal structure. I will then draft the paper, integrating the formal results with the normative implications.
  *Why this approach:* This ensures the paper offers constructive pathways rather than merely a negative result.

  **Possible Results and Deciding Considerations**
  There are three primary possible conclusions. First, the Partition Problem is fatal to act-consequentialism because no privileged partition exists. Second, a bounded value function dissolves the problem by ensuring sums converge absolutely. Third, the causal structure of the world provides a natural partition that fixes the order of summation.

  Deciding between these will depend on two criteria. Mathematical consistency is the baseline: any solution must eliminate order-dependence. Normative plausibility is the constraint: a bounded value function must not imply counterintuitive results in standard cases (e.g., preventing the saving of additional lives once a threshold is reached). If a privileged partition is proposed, it must be derivable from the physical or causal description of the act, not from the agent's description.

  **Failure Conditions**
  An honest assessment requires identifying three distinct ways this project could fail.
  1.  **Redundancy:** The argument collapses into the existing literature on fanaticism. If the conditional convergence relies on the same assumptions as Pascalian wagers, the claim that this is a distinct problem about "cluelessness" fails.
  2.  **Practical Inertia:** The result is technically sound but makes no difference to decision-making. If the partitions that flip the ranking are gerrymandered or unnatural, the problem may be mathematically real but normatively inert.
  3.  **False Distinction:** The "Third Complaint" turns out to be reducible to tail-cluelessness. If the lack of a defined mean is the only issue, then the partition dependence is merely a symptom of undefined expectations, not a separate structural flaw.

  **Scope and Cutbacks**
  The primary risk is that establishing the Third Complaint takes longer than anticipated. If the formal model for partition-dependence cannot be secured in the first month, I will cut the analysis of the two-level retreat. The paper will then focus exclusively on the ill-posedness of act-evaluation. This ensures a complete argument on the core issue rather than an incomplete argument on the broader implications.

  **Justification for Support**
  Funding this theoretical work rather than an applied project is justified by the nature of the deliverable. For practitioners choosing between interventions under deep uncertainty, the output will not be a specific recommendation, but a robustness test. If a consequentialist ranking flips based on how the outcome space is described, that ranking is unreliable. The project will produce a diagnostic tool: a method for checking whether an expected value calculation is robust to re-carving the space of outcomes. This allows funders and policymakers to distinguish between decisions that are robustly supported by consequentialist reasoning and those that are artifacts of arbitrary modeling choices. Ensuring the coherence of the maximizing framework is a prerequisite for its safe application.
