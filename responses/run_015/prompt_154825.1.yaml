      *   *Metrics as Numerical Crowd:* Yes, but worse. The "crowd" for SK was already an abstraction. Metrics make that abstraction *literal*. A "like" is the ultimate unit of leveling—reducing complex truth to a binary thumb. It quantifies the qualitative.
