      *   *The Eternal Now/Scrolling:* *The Present Age* describes a time of reflection without action. Scrolling is reflection without even *coherence*. It's fragmentation. The "moment" (*Øjeblikket*) for SK is the point where time touches eternity (decision). The feed is the *anti-moment*—time passing without decision.

