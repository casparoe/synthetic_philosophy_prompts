prompt: |-
  ok so my grandma's been in a vegetative state for months and the doctors keep saying she's "alive" like it's obvious, but it feels wrong. now i want to help my cousin (nursing student, zero philosophy) understand why "what is life?" is actually a conceptual knot, not just a biology checklist. i'm planning a 45-min session for her and two healthcare friends. don't explain the concept to me — plan teh teaching: what order do the pieces have to come in so they don't just memorize metabolism/homeostasis/reproduction? what's the one carrying case — i'm leaning on comparing a viroid (just RNA, no metabolism) to a brain-dead patient on a ventilator — and exactly what must that comparison reveal and conceal? what misconceptions will they bring ("dna = alive", "it's just complex chemistry") and at what point in the sequence should i kill each? give me one check question for the end that proves they see the knot, not the list. and tell me which part — maybe teh autopoiesis vs evolutionary definition split — i should openly say is too in-the-weeds for this level and skip. no reading lists please, definatly no citations, they wouldn't recieve any use from them.
