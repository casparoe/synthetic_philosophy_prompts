answer: |-
  Dear Colleague,

  Your diagnosis is remarkably close to the mark, but I would sharpen it slightly to say that the impasse you observe is not merely a methodological disagreement about what counts as evidence, but an ontological collision regarding the status of meaning in the natural world. The stalemate persists because your students are unknowingly arguing from incommensurate metaphysics of the social: one side treats the social world as a domain of events governed by efficient causality akin to physics, where culture must be reified into a variable to exert force, while the other treats the social world as a domain of actions governed by reason and meaning, where culture is the medium in which causality flows rather than a distinct stream feeding into it. When you ask whether culture can be a cause, the empiricists hear whether cultural variables add predictive power to a model of material conditions, whereas the interpretivists hear whether reasons can be efficacious without being reduced to physical states. The debate dissolves into frustration because neither side can acknowledge the other's premise without abandoning the foundation of their own explanatory ideal; the empiricist cannot grant autonomy to meaning without losing leverage for prediction, and the interpretivist cannot reduce meaning to variables without losing the phenomenon of action itself. This is why the seminar ends in an impasse every year: you are teaching them the fundamental fault line of social science, not a solvable puzzle within it.

  To see why this diagnosis holds, consider what each side's favourite move commits them to when they attempt to settle the question. The empiricist side insists on controlling for confounders like literacy, urbanisation, and trade routes, operating under the commitment that culture must be distinct from these material channels to be a cause. Yet this move inadvertently validates your impatience with econometric refutations, for if Weber is right that Protestant doctrine promoted literacy which in turn facilitated capitalism, then controlling for literacy is not isolating the effect of culture but controlling for the mechanism of culture itself. By demanding that culture be measurable as a state variable independent of its manifestations, this side commits to a view where culture is only real if it is a residual category left over after material factors are accounted for, effectively defining culture out of existence as a primary engine. They are committed to a world where human beings respond to incentives and constraints, and where ideas are merely the shadow cast by those constraints; if they concede that the meaning of labour is itself a constraint, their model collapses into tautology. They want culture to be a billiard ball hitting the economy, but they refuse to acknowledge that the ball is made of the same stuff as the table.

  Conversely, the interpretive or materialist side insists that values are either constitutive of action or epiphenomenal of material conditions, and this move commits them to a different set of troubles. If they argue that values are constitutive, that citing what people thought is the explanation, they commit to a hermeneutic circle where explanation becomes indistinguishable from description; they can tell you what the action meant, but they struggle to explain why that meaning arose at that specific historical juncture rather than another, often smuggling in material causes anyway. If they argue that values are epiphenomenal, caused by material conditions, they commit to a reductionism that lacks its own causal mechanism for how matter generates meaning, effectively positing a magic step where economics turns into theology. This side often dismisses the empiricist demand for measurement as a category error, which is correct in principle, but in practice, this protects their position from falsification rather than clarifying the mechanism. They are committed to a world where reasons are causes, but they cannot specify the physics of that causality without betraying their own premise that reasons belong to a logical space distinct from the space of laws. Both sides, in their effort to win, end up describing different objects, which is why they agree on the historical facts but disagree on the explanation.

  You also raise the possibility that the dispute is merely verbal, resting on competing senses of cause, but I suspect this is too generous a reconciliation. If it were only verbal, a distinction between difference-making and initiation would allow the sides to shake hands and depart, yet they do not depart because the stakes are not linguistic but disciplinary. The empiricist fears that if meaning is granted causal autonomy, social science loses its claim to scientific rigour and becomes a branch of philosophy or literature; the interpretivist fears that if meaning is reduced to a variable, social science loses its subject matter and becomes a clumsy physics of human behaviour. The dispute is in good health precisely because it is a standing dispute over the aim of social explanation, and attempting to resolve it empirically is like trying to measure the weight of a thought with a scale designed for bricks. The natural-experiment studies you mention will not settle this because each side will interpret the identification strategy through their ontological lens; the empiricist will see a clean estimate of a treatment effect, and the interpretivist will see a contextual stripping that removes the very meaning that constituted the effect. There is no study that can surprise both sides because their definitions of surprise are different; one is surprised by a correlation that survives controls, the other by a meaning that resists reduction.

  Therefore, regarding your question on progress, I must tell you that no sharpened definition of cultural causation will bridge this gap, nor will a new class of studies, because the gap is not epistemic but ontological. Progress in this seminar would not look like a consensus on Weber, but rather a meta-theoretical clarity where students understand that their disagreement is not a failure of their reasoning but a reflection of the dual nature of social reality. You should teach the disagreement itself as the subject, framing the fortnight not as an attempt to solve the Protestant Ethic thesis but as an excavation of the conditions under which social explanation is possible. The health of the discipline depends on this tension; if the empiricists won, we would have rigorous models of empty variables, and if the interpretivists won, we would have rich narratives of uncaused events. What you should offer your students is the courage to inhabit the impasse, to see that the demand for better identification is valid only within a model that assumes culture is a variable, and the demand for interpretive depth is valid only within a model that assumes action is meaningful. Your role is not to lead them out of the woods but to show them that the woods are the terrain they must learn to navigate, and that the frustration they feel is the friction of doing social science at all.
