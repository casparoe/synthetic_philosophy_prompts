answer: |-
  **MEMORANDUM**

  **TO:** Internal Review Board
  **FROM:** Board Member
  **SUBJECT:** Disaggregating "Human in the Loop" Claims

  **1. Readings**

  1.  A human physical action is technically required to transmit output. (Trivial) The system lacks API permissions to send email without a specific user ID token. This is a permission setting, not a safety feature.
  2.  The human reads the full draft and source material before clicking. (Substantive but probably false) This assumes cognitive engagement matches technical capability. Given the volume, this is empirically falsifiable via eye-tracking or time logs.
  3.  The human possesses the practical capacity to reject any specific draft without penalty. (Substantive but probably false) If rejection requires rewriting from scratch, productivity metrics may coerce approval.
  4.  The human bears legal liability for the content sent. (Claim of a different kind) This assigns blame post-hoc but does not prevent harm. It is a legal status, not an operational control.
  5.  The system optimizes only for draft quality, not for aggregate approval rates. (Substantive and defensible) The model lacks a reward function tied to bypassing human scrutiny. It minimizes loss per prompt, not across the queue.
  6.  Human judgment is independent of the system's summary and ordering. (Substantive but probably false) This fails the framing question. If the system highlights specific text, the human's attention is directed, not free.
  7.  A human monitors aggregate error rates and can halt the system. (Substantive and defensible) This describes a human *on* the loop. It requires separate monitoring infrastructure not present in the caseworker queue.
  8.  The human is answerable for errors after they occur. (Claim of a different kind) This is the reading where the loop includes a human only in the sense of accountability. It does nothing to prevent the error.
  9.  The cognitive load allows for meaningful scrutiny per case. (Substantive but probably false) At two hundred cases daily, the time budget per case precludes deep review. This is an empirical matter settleable by time-motion study.
  10. The system cannot learn from rejected drafts to bypass future human review. (Substantive and defensible) The model is static during the pilot. It does not update weights based on caseworker clicks, preventing adaptive manipulation.

  **2. Which readings would actually carry his conclusion**

  The engineer's conclusion has two halves: that a human is technically present, and that the system is therefore a safe tool rather than an autonomous agent. Reading 1 supports the first half; the system cannot act without a click. However, Reading 1 does not support the second half. To prove the system is a safe tool, he needs Reading 2, 3, or 9 to be true—demonstrating that the human actually scrutinizes the action. If the human rubber-stamps (failing Reading 2), the system is functionally an agent executing objectives, regardless of the click requirement. Readings 4 and 8 (liability and answerability) are irrelevant to the safety classification; they address who suffers consequences, not whether the system operates autonomously. The engineer assumes that because the technical gate exists (Reading 1), the cognitive gate must also exist (Reading 2). This is the gap the board must close. We cannot accept technical necessity as proof of cognitive engagement.

  **3. The strongest version of his position**

  The strongest version argues that the *capacity* for veto breaks the chain of agency, regardless of usage frequency. Even if caseworkers approve 99% of drafts, the system lacks the *authority* to enforce the 1%. It does not pursue objectives over time because it cannot accumulate power; each case is a fresh negotiation requiring a new token. This addresses the worry about system-level agency by defining agency as the power to act without consent, not the probability of consent being given. If the human *can* stop it, the system remains a tool, even if the human *chooses* not to stop it. The risk is human error, not system autonomy. This view holds that agent-level review is unnecessary because the system lacks the structural ability to override human will, even if human will is frequently lazy.

  **4. Where it fails in this pipeline**

  This fails in the specific pipeline due to *authorization density* and the *framing question*. At two hundred cases daily, the *authorization density* is too high; one click authorizes complex legal determinations embedded in the draft. The *rubber-stamp test* suggests that if we withheld approvals randomly, caseworkers might not notice errors, indicating the human is not evaluating but validating. The *framing question* is critical: the system chooses the order and summarizes the claim. If the summary biases the caseworker, the human judgment is made for them. Furthermore, over months, the caseworker's sense of a "reasonable reply" may calibrate to the model's median output rather than policy. The human becomes the loop's component, tuned by the system, rather than the system's controller. This is an empirical matter; we must log time-on-screen and rejection reasons to see if scrutiny exists. If the system dictates the queue order, it dictates urgency, effectively managing the human's attention span.

  **5. What I should ask for instead**

  1.  **Mandatory Random Audit:** Ten percent of drafts must be flagged for full text comparison before approval is allowed. Refuse looseness where "flagged" does not mean "forced review."
  2.  **Rejection Logging:** Every rejection must require a categorized reason code. Refuse looseness where "other" is a valid category without text explanation.
  3.  **Time Thresholds:** The interface must enforce a minimum view time proportional to document length. Refuse looseness where timers can be bypassed by switching tabs.
  4.  **Blind Quality Assurance:** A separate team must review sent drafts without seeing the model's summary. Refuse looseness where QA reviewers see the model's suggested classification.
