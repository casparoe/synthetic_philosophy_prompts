answer: |-
  **Brainstorming Notes**

  *   **(a) von Neumann's Load-Bearing Claim:** Strip away the 1950s anxiety about vacuum tube failure rates and analog noise. His core commitment is *implementation independence*: that the logical organization of the nervous system can be described formally, separate from the wetware. He isn't claiming the brain is a CDC mainframe; he's claiming that *computation* (state transitions based on rules) is the right ontology for prediction, regardless of the substrate's fidelity.
  *   **(b) The Strongest "No":** Avoid magic (Penrose) and wait on semantics (Chinese Room). The strongest objection is *dynamic embodied cognition*. Computation implies discrete, countable states. Biology is continuous, analog, and deeply coupled to the environment. If you can't individuate the states without arbitrary rounding (as von Neumann admitted), you don't have digits; you have dynamics. The "program" is an artifact of the observer, not the organ.
  *   **(c) Your Idea (Design/Compilation):** This is not a dud; it's a sophisticated etiological argument. Artifacts have a "compiler" (the designer) that fixes the level of description. Evolution selects for *fitness*, not *syntax*. Therefore, claiming the brain "executes a program" risks being a category error—it's like saying a river "computes" the path of least resistance. It supports Arnie's late view: mechanism is real; "algorithm" is a useful compression, not a discovery.

  ***

  **Tribute to Arnie Breslow**

  Good evening. For those who don't know me, I'm a physicist by trade. I spent forty years trying to convince instruments to give me one more significant figure of precision. So you can imagine my friction with history when I read von Neumann's posthumous lectures on the computer and the brain. He casually suggests the nervous system performs arithmetic with perhaps two or three digits of precision, and yet outperforms our most reliable machines. To a metrologist, that sounds like a confession of failure. To Arnie, it was a starting pistol.

  Arnie spent the first half of his career chasing the algorithm. He believed that if we could just find the code—the specific program the visual cortex runs on light—we would understand sight. It was a beautiful, rigorous hunt. But late in his career, Arnie began to suspect the hunt was for a phantom. He started to say that calling the brain a computer was a slogan that had done more harm than good. That the brain is messier, and honestly, more interesting than that.

  I stand with Arnie on this, though perhaps for reasons that will annoy the computer scientists in the back. When engineers build a computer, there is a design story. There is a moment where the intent is compiled into code, distinct from the hardware that runs it. That history picks out which description of the machine is "the program." But the brain has no designer. There was no compilation event. Evolution selects for survival, not for syntactic clarity.

  This leaves us with a uncomfortable question. Without a designer to fix the level of description, is there a fact of the matter about which algorithm the brain is running? Or is "computation" just a convenient compression we lay over the mechanism? If I describe a waterfall physically, it's flowing water. If I describe it computationally, it's processing information about gravity. The waterfall doesn't care. My worry is that by insisting on the algorithm, we might be ignoring the meat.

  Now, I must make a concession. Arnie was right to use the metaphor, even if it was ultimately a metaphor. For forty years, the computational view forced neuroscience to be precise. It demanded we define our terms. It stopped us from hiding behind vitalism. The slogan worked, even if the ontology was shaky. We needed the ladder to climb up here; we just shouldn't live on the roof.

  I know Arnie sits in the front row tonight, glass of wine in hand, ready to correct me. He knows I'm simplifying. He knows that "mechanism" alone can feel dry, like describing a symphony by listing the hammer strikes on the piano strings. But his career teaches us that honesty matters more than comfort. If the brain isn't a computer, then neuroscience needs a new vocabulary, not just faster chips.

  Arnie, you taught us that the brain is not a thing to be solved, but a process to be witnessed. Whether it computes or merely flows, it is magnificent. And whether you are arguing for the algorithm or against it, you are always arguing for the truth. Thank you for the work, and for the friendship.

  ***

  **Confidence Note**

  I am highly confident in the philosophical framing of your "compilation" argument; it aligns well with contemporary critiques of computationalism (e.g., Piccinini, Shagrir) regarding the individuation of computational states. The speech balances the technical constraint with the emotional occasion effectively.

  The thing I am least sure of is whether the "compilation" point is as lethal to computationalism as you hope. Some philosophers argue that natural selection *acts* as the designer, fixing function teleologically even without intent. If evolution selects for specific input-output mappings, does that constitute a "natural compilation"? I leaned into your view because it suits the tribute, but a committed computationalist would argue that evolutionary history *does* provide the fact of the matter you claim is missing. Von Neumann's actual historical nuance is also hard to pin down without direct quotation, but the paraphrase regarding precision is historically safe.
