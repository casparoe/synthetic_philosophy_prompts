answer: |-
  This is a precise and difficult intersection. Your friend's claim that this is "just the motive-versus-intent distinction" is a category error that conflates the *conditions of liability* with the *conditions of praise*. Criminal law asks: "Did you break the rule, and did you have the requisite mental state regarding the break?" Your philosophy seminar asks: "Does complying with the rule (or breaking it) reveal a good will?"

  Below is the systematic translation you requested. I have adhered strictly to your constraint: I will not allow *liability* to silently substitute for *moral worth*. Where the legal vocabulary fails to capture the philosophical distinction, I will mark it as a failure of translation, not a resolution.

  ### Part I: Systematic Translation of D, R, and V

  #### View D (Duty): Moral Worth requires acting *from* Duty.
  *   **Translates:** The legal concept of **Purpose** (in the *mens rea* hierarchy) comes closest, but only if we bend "Purpose" to mean "Purpose to fulfill a legal obligation." In sentencing, this maps to **Mitigation** based on "good character" or "remorse," where the court acknowledges the agent's alignment with legal norms.
  *   **Bends:** We must bend **Motive**. In law, motive is irrelevant to guilt. In D, motive (duty vs. inclination) is the *only* thing that matters for worth. We must also bend **Insanity**: D requires a rational grasp of duty; if an agent cannot grasp duty, they lack moral worth, whereas law might excuse them.
  *   **Cannot Express:** D's core claim that an action done from *inclination* (even if it matches duty) has *zero* moral worth. Law treats a compliant shopkeeper and a dutiful shopkeeper identically regarding liability. Law has no vocabulary for "zero worth" regarding a lawful act; lawful acts are simply outside the law's evaluative scope.

  #### View R (Responsiveness): Moral Worth requires sensitivity to Right-Making Features.
  *   **Translates:** This maps best onto the **Objective Reasonable-Person Standard** used in **Negligence**. The question is: "Was the agent sensitive to the risks/reasons a reasonable person would see?" It also aligns with **Mistake of Fact** doctrines where an honest but unreasonable mistake negates *mens rea*, provided the agent was tracking the relevant facts.
  *   **Bends:** We must bend **Knowledge**. R allows an agent to have false *moral* beliefs (e.g., Huck Finn) but still have worth if they track the *factual* values (humanity). Law generally treats mistake of *law* as no excuse, but R says mistake of moral *label* is irrelevant if the responsiveness is there.
  *   **Cannot Express:** R's distinction between "tracking the right feature" and "acting for the right feature." Law's **But-For Causation** asks if the desire caused the act. R asks if the *reason* justified the act. Law cannot distinguish between an agent who saves a life because they value life (R-worth) and an agent who saves a life because they want a reward, provided both intended the survival (Legal Intent).

  #### View V (Virtue/Spontaneity): Moral Worth requires unmediated responsiveness; "one thought too many."
  *   **Translates:** This maps to **Habitual Conduct** evidence in **Sentencing**. It also loosely aligns with **Automatism**, but positively valued. In corporate law, it resembles a **Compliance Regime** that is so internalized it requires no active monitoring.
  *   **Bends:** We must bend **Recklessness**. V praises acting without conscious calculation. Law often views acting without conscious calculation regarding risks as *Recklessness* (culpable). V views it as *Virtue* (praiseworthy).
  *   **Cannot Express:** V's claim that conscious deliberation can *diminish* worth. Law assumes that **Intent** (conscious aim) is the highest form of *mens rea* and thus the highest form of culpability (or compliance). Law cannot conceptualize "too much thought" as a defect in a lawful agent.

  ---

  ### Part II: Testing Against the Four Cases

  Here I analyze how each view distinguishes the cases, and where the Legal Vocabulary collapses them.

  #### Case 1: Huckleberry Finn (Does right, believes wrong)
  *   **View D:** **No Moral Worth.** He acts from sympathy (inclination), not duty. He explicitly believes he is sinning.
  *   **View R:** **Has Moral Worth.** He is responsive to the right-making feature (Jim's humanity/suffering), despite his false moral label.
  *   **View V:** **Has Moral Worth.** He acts spontaneously from care, without consulting a principle.
  *   **Legal Translation:** **No Liability.** (Assuming helping a runaway was the crime, he has *Intent* and *Knowledge*, so technically liable, but let's assume the act itself is lawful in our hypothetical).
      *   *Collapse:* Legally, Huck is indistinguishable from the Shopkeeper (Case 2) regarding *Guilt*. Both performed the *actus reus* with *mens rea*. The law does not ask if Huck's motive was sympathy or duty.
      *   *Distinction:* D distinguishes Huck from the Shopkeeper (Sympathy vs. Profit). R and V group them together (both did the right thing), whereas D isolates Huck as worthless.

  #### Case 2: Shopkeeper (Honest for trade / Compliance Regime)
  *   **View D:** **No Moral Worth.** (a) Profit is inclination. (b) Compliance regime removes agency; the *policy* follows duty, the *agent* follows policy.
  *   **View R:** **No Moral Worth.** The agent is responsive to profit or policy rules, not the right-making feature (honesty itself).
  *   **View V:** **No Moral Worth.** (a) Calculation is "one thought too many." (b) Regime compliance is mechanical, not virtuous character.
  *   **Legal Translation:** **No Liability.**
      *   *Collapse:* Legally, the Shopkeeper is indistinguishable from Huck. Both complied with the law.
      *   *Distinction:* All three philosophical views distinguish the Shopkeeper from a truly virtuous agent, but the Law cannot. In **Sentencing**, a "compliance regime" might reduce corporate liability, but for an individual, profit motive is irrelevant.
      *   *Note on Corporate Agents:* View D and R struggle with the Compliance Regime variant. Is the *corporation* the agent? Law says yes (Vicarious Liability). Philosophy (D/R/V) usually assumes individual human agency. This is a major translation failure.

  #### Case 3: Lost Wallet (Self-interest, false factual belief)
  *   **View D:** **No Moral Worth.** Motive is self-interest (goodwill of neighbor).
  *   **View R:** **Has Moral Worth.** She was responsive to the right-making feature (property rights/returning lost goods), even if she *thought* she was doing it for neighborly goodwill. The action tracked the right reason.
  *   **View V:** **Ambiguous/No.** If the return was calculated (to gain goodwill), it is "one thought too many." If it was a spontaneous impulse to "give it back," it has worth.
  *   **Legal Translation:** **No Liability (Mistake of Fact).** She intended to return the wallet. Her motive (goodwill) is irrelevant. Her mistake (neighbor vs. stranger) is irrelevant to the *actus reus* of theft (which didn't happen).
      *   *Collapse:* Legally, this agent is indistinguishable from an agent who returns the wallet *from duty*. Both lack *Intent* to deprive.
      *   *Distinction:* R distinguishes this agent from the Shopkeeper. Both act for self-interest, but the Wallet agent's action *tracks* the right feature (property rights), whereas the Shopkeeper's action tracks *profit*. Law sees them as identical: lawful conduct.

  #### Case 4: Compulsion (Reliably right, no articulable reason)
  *   **View D:** **No Moral Worth.** No rational adoption of duty.
  *   **View R:** **No Moral Worth.** Not responsive to reasons; causally determined by impulse.
  *   **View V:** **Has Moral Worth (Conditional).** If this is "second nature" virtue, Yes. If it is pathology, No. V is the only view that *can* award worth here.
  *   **Legal Translation:** **Automatism or Insanity.**
      *   *Collapse:* Legally, this agent is indistinguishable from a person acting under **Duress** or **Insanity**. The law negates the *Voluntary Act*.
      *   *Distinction:* D and R group this agent with the Shopkeeper (no worth). V potentially groups this agent with the Virtuous Ideal. Law groups this agent with the Non-Liable (no act).
      *   *Critical Divergence:* Law treats Compulsion as an **Excuse** (you are not liable). Philosophy treats it as a question of **Worth** (are you good?). Law asks "Could you help it?" Philosophy asks "Did you choose the good?"

  ---

  ### Part III: The Residue Report

  This is the core of your difficulty. The friction you feel is not confusion; it is the sound of two different normative machinery grinding against each other.

  #### 1. From Law to Philosophy: What Legal Vocabulary Obscures
  Your worry is correct: **Intent** is not **Reason**.
  *   **The Obliqueness of Intent:** In criminal law, *Intent* (Purpose) is forward-looking: "I aim to bring about result X." In Philosophy (D/R/V), the "Reason" is often backward-looking or normative: "I act *because* Y is required."
      *   *Example:* In Case 3 (Wallet), the legal *Intent* is "to return the wallet." The Philosophical *Reason* is "to gain goodwill." Law captures the *Intent* but misses the *Reason*. Therefore, Law cannot distinguish the Wallet agent from the Dutiful agent.
  *   **Causation vs. Sensitivity:** The legal **But-For Test** asks: "But for the desire, would the act have occurred?" This is causal. View R asks: "Was the act sensitive to the normative weight of the reason?"
      *   *Residue:* An agent can be causally driven by a desire (Law: Voluntary Act) but insensitive to the right-making features (View R: No Worth). Law has no vocabulary for "Causal Volition without Normative Sensitivity." It assumes that if you intended the act, you are responsible. It cannot see the gap between *moving your body* and *grasping the reason*.
  *   **Motive as Excluded:** By excluding **Motive** from the guilt phase, the law deliberately blinds itself to the D/R/V debate. It says, "We do not judge your soul, only your compliance." This is not a defect in translation; it is a feature of liberal law. But it means the legal vocabulary *cannot* express Moral Worth, only Legal Compliance.

  #### 2. From Philosophy to Law: What Philosophy Cannot Say
  *   **Institutional Response:** D/R/V ask "Is this agent good?" Law asks "What do we do with this agent?"
      *   *Strict Liability:* Law imposes liability without *mens rea* (e.g., regulatory offences) to ensure safety. D/R/V would say this agent has no moral worth (or blame) if they lacked the mental state. Law doesn't care; it cares about the *outcome*. Philosophy has no counterpart to "Liability without Blame."
      *   **Corporate Agents:** As seen in Case 2 (Compliance Regime), Law can punish a corporation. D/R/V are typically individualistic. View R might say the *policy* was responsive, but who has the moral worth? The CEO? The shareholders? Law resolves this with **Vicarious Liability**; Philosophy hits a metaphysical wall.
      *   **Automatism/Insanity:** Law uses these to draw a bright line around *capacity*. If you lack capacity, you are not a legal agent. D/R/V debate whether you are a *moral* agent. Philosophy can debate the degrees of worth in a compromised agent; Law must make a binary decision: Jail or Hospital.

  #### 3. Diagnosis: Defect or Difference of Purpose?
  Is the residue a defect of legal vocabulary, or is the philosophical dispute verbal?

  *   **The Legal Vocabulary is Not Defective:** It is designed for **Regulation**, not **Evaluation**. It needs to be administrable, objective, and focused on harm prevention. It *cannot* adopt View D, because it cannot probe every citizen's soul to see if they obeyed out of duty or fear. It *cannot* adopt View R, because "sensitivity to right-making features" is too vague for a jury instruction. It *cannot* adopt View V, because "spontaneity" looks like recklessness in a court of law.
  *   **The Philosophical Dispute is Partly Verbal:** D and R are often disagreeing about how to **individuate reasons**.
      *   *View D* says: "Duty" is a specific, distinct motive.
      *   *View R* says: "Duty" is just the label we give to acting on the right reasons.
      *   *Translation:* In legal terms, this looks like a **Mistake of Label**. If I return the wallet because "it's the right thing to do" (D) vs. "because he needs it" (R), am I acting on different reasons?
      *   *Verdict:* The dispute is not about fact (what happened in the agent's head) but about **classification**. D demands a specific normative label in the agent's mind. R demands a specific structural relationship between fact and action.
      *   *However:* The gap between (D/R/V) and Law is **not verbal**. It is functional. Law is about *external coordination*; Philosophy is about *internal integrity*.

  ### Conclusion for Your Study Group

  Tell your friend he is half-right and half-wrong.
  *   **He is right** that *Motive* in law is the closest bucket for *Reason* in philosophy.
  *   **He is wrong** because Law exiles Motive to **Sentencing**, whereas Philosophy places it at the center of **Evaluation**.
  *   **The Translation:**
      *   **View D** is a **Sentencing Aggravator/Mitigator** that the Law refuses to apply to Guilt.
      *   **View R** is a **Negligence Standard** applied to Moral Sensitivity rather than Factual Risk.
      *   **View V** is a **Character Evidence** rule that Law treats skeptically.

  The "sliding" you feel is the friction between the **Binary of Liability** (Guilty/Not Guilty) and the **Gradient of Worth** (Praiseworthy/Neutral/Blameworthy). Criminal law collapses the gradient to make the binary work. Your philosophy seminar expands the gradient to understand the agent. Neither is wrong, but they are not speaking the same language. Do not try to force the legal vocabulary to carry the moral weight; it will break. Use the legal terms to show *where* the moral distinctions fail to register institutionally. That is where the real insight lies.
