answer: |-
  You have put your finger on exactly the right knot. Your suspicion is correct: the definition of the "dominating" strategy (pure vs. mixed) is a major fault line in game theory, and it becomes particularly seismic when you move from strict to weak dominance.

  To help you untangle this for your readers, let's break it down into three layers: the power of mixing (the "Portfolio Effect"), the fragility of weak dominance (the "Indifference Problem"), and the consequences for equilibrium (the "Self-Fulfilling Prophecy").

  ### 1. Pure vs. Mixed: The Portfolio Effect

  You asked if a strategy can be eliminated by a mixed dominator but survive a pure one. The answer is **yes**.

  In strict dominance, this distinction matters less (though it still exists). But in weak dominance, allowing mixed strategies to do the dominating significantly expands the set of strategies you can rule out.

  **The Intuition**
  Think of pure strategies as individual stocks and mixed strategies as a diversified portfolio.
  *   **Pure Dominance:** Stock A must perform at least as well as Stock B in every economic scenario (Recession, Boom), and better in at least one.
  *   **Mixed Dominance:** A *portfolio* of Stock A and Stock C must perform at least as well as Stock B in every scenario.

  Because a portfolio averages out the risks, it can smooth over the specific scenarios where a single pure strategy fails. A pure strategy might have a "Achilles' heel" (one scenario where it performs poorly), preventing it from dominating another strategy. But if you blend it with another strategy that performs well in that specific scenario, the blend covers the weakness.

  **The Example**
  Consider a game where Player 1 has three strategies (Top, Middle, Bottom) and Player 2 has two (Left, Right). We only need to look at Player 1's payoffs to see dominance.

  | P1 \ P2 | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 2 | 0 |
  | **Middle** | 0 | 2 |
  | **Bottom** | 1 | 0.9 |

  *   **Does Top weakly dominate Bottom?** No. Top is better vs. Left ($2 > 1$), but worse vs. Right ($0 < 0.9$).
  *   **Does Middle weakly dominate Bottom?** No. Middle is better vs. Right ($2 > 0.9$), but worse vs. Left ($0 < 1$).
  *   **Does a Mix of Top and Middle dominate Bottom?**
      Imagine Player 1 flips a coin: 50% Top, 50% Middle.
      *   **Vs. Left:** Expected payoff is $1$ (average of 2 and 0). Bottom pays $1$. (Tie)
      *   **Vs. Right:** Expected payoff is $1$ (average of 0 and 2). Bottom pays $0.9$. (Win)

  Because the mix yields the *same* payoff in one case and a *strictly better* payoff in the other, it **weakly dominates** Bottom.

  **The Takeaway for Your Piece:**
  If your definition of rationality allows a player to randomize (play a mixed strategy) as a way to test for dominance, "Bottom" is irrational and should be deleted. If your definition requires a single, deterministic alternative to justify deletion, "Bottom" survives. This is the unstated choice you suspected: **Are we testing if a strategy is bad compared to a specific alternative, or compared to any possible plan of action?**

  ### 2. The Indifference Problem: Why Order Matters

  This brings us to the second knot: order dependence. In *strict* dominance, the order of deletion never matters. In *weak* dominance, it does. This is entirely due to the "weak" part of the definition—specifically, the allowance for **indifference**.

  Recall that for Strategy A to weakly dominate Strategy B, A must be better in *at least one* case, but it is allowed to be *equal* in the others.

  **The Logic**
  When you delete a weakly dominated strategy, you are essentially telling the player: "Since you are indifferent between A and B in some scenarios, you might as well commit to A."

  However, that indifference might be the only thing keeping the *other* player honest. If you delete B, you change the game for the opponent. The opponent might have been playing a strategy that made you indifferent between A and B. Once B is gone, the opponent might shift their strategy, which could suddenly make A look terrible compared to some other strategy C that you didn't delete earlier.

  **The Example**
  Consider this 2x2 game (Payoffs are P1, P2):

  | P1 \ P2 | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 1, 1 | 1, 0 |
  | **Bottom** | 1, 0 | 1, 1 |

  *   **For Player 1:** Top weakly dominates Bottom. (1 vs 1 on Left; 1 vs 1 on Right... wait, this is equivalence).
      *Let's adjust slightly to ensure dominance:*
      *   Top: (1, 1) and (1, 0)
      *   Bottom: (1, 0) and (0, 1)
      *   Here Top weakly dominates Bottom (1=1 vs Left, 1>0 vs Right).

  If we delete **Bottom**:
  Player 2 knows Player 1 will play Top. Player 2 compares Left (payoff 1) vs Right (payoff 0). Player 2 chooses **Left**.
  **Result:** (Top, Left).

  But wait. Look at the original game. Is (Bottom, Right) a Nash Equilibrium?
  *   If P1 plays Bottom, P2 plays Right (1 > 0).
  *   If P2 plays Right, P1 gets 1 from Top and 0 from Bottom... wait, in my adjustment Top became strictly better.
      *Let's use the standard "Order Dependence" structure:*

  | P1 \ P2 | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 1, 1 | 1, 0 |
  | **Bottom** | 1, 0 | 1, 1 |

  *   **P1:** Top weakly dominates Bottom? Vs Left (1=1). Vs Right (1>0). **Yes.**
  *   **P2:** Left weakly dominates Right? Vs Top (1>0). Vs Bottom (0<1). **No.**
  *   **P2:** Right weakly dominates Left? Vs Top (0<1). Vs Bottom (1>0). **No.**

  If we delete **Bottom** (because it's weakly dominated for P1):
  P2 faces only Top. P2 chooses Left (1 > 0).
  **Outcome:** (Top, Left).

  But consider the strategy profile **(Bottom, Right)**.
  *   P1 gets 1. If P1 switches to Top, P1 gets 1. (No incentive to deviate).
  *   P2 gets 1. If P2 switches to Left, P2 gets 0. (No incentive to deviate).
  *   **(Bottom, Right) is a Nash Equilibrium.**

  By deleting Bottom first, we destroyed the (Bottom, Right) equilibrium.
  Now, imagine a slightly larger game where P2 also had a weakly dominated strategy. If we deleted P2's strategy *first*, it might have made Bottom *strictly* better for P1, saving the (Bottom, Right) outcome.

  **The Takeaway for Your Piece:**
  Weak dominance relies on ties. Ties are fragile. When you cut a tie, you change the incentives for everyone else. Therefore, the sequence of cuts determines which ties remain and which break. Strict dominance has no ties, so the sequence doesn't matter.

  ### 3. Killing Nash Equilibria

  This leads directly to your third point: Iterated Elimination of Weakly Dominated Strategies (IEWDS) can delete strategies that are part of a Nash Equilibrium.

  As seen in the (Bottom, Right) example above, a Nash Equilibrium only requires that no player has a *strict* incentive to deviate. It allows for weak incentives (indifference).
  *   **Nash Logic:** "I am playing Bottom. Given you play Right, I get 1. If I switch to Top, I also get 1. So I stay."
  *   **IEWDS Logic:** "You are playing Bottom. Top gives you 1 in all cases and strictly more in some. You are irrational for playing Bottom. Delete it."

  IEWDS imposes a stricter standard of rationality than Nash Equilibrium does. It assumes that if a player is indifferent, they will *always* choose the dominant option. Nash Equilibrium only assumes they *won't choose the strictly worse option*.

  This is why game theorists often view IEWDS as a "refinement" tool. It's a way of saying, "Of all the possible Nash Equilibria, which ones rely on fragile threats or promises that a rational player wouldn't actually make?"

  However, because it relies on that "Pure vs. Mixed" definition and the "Order of Operations," it is not a blunt instrument. It is a scalpel that cuts differently depending on who is holding it and how they define the blade.

  ### Summary for your Readers

  To anchor your long-form piece, you can summarize the conceptual landscape like this:

  1.  **Strict Dominance is Robust:** It doesn't matter if you use pure or mixed strategies to find it, and it doesn't matter what order you delete things in. It never deletes a Nash Equilibrium. It is the "safe" zone of rationality.
  2.  **Weak Dominance is Fragile:** It relies on indifference.
  3.  **The Mixed Strategy Multiplier:** Allowing mixed strategies to dominate makes the net wider. Strategies that look safe compared to any single alternative (Pure) might be exposed as inferior compared to a flexible plan (Mixed).
  4.  **The Cost of Precision:** By using Weak Dominance to refine predictions, you gain precision (fewer outcomes survive) but you risk accuracy (you might delete outcomes that rational players actually coordinate on, like the (Bottom, Right) equilibrium).

  The "knot" you found is essentially a choice between **procedural rationality** (following a strict algorithm of elimination, potentially using mixed strategies) and **outcome stability** (preserving any state where no one regrets their choice). Game theorists argue because they prioritize different sides of that trade-off.
