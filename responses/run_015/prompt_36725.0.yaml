prompt: |-
  I direct a small municipal sustainability office, and my staff spend a surprising amount of time arguing about whether our smallest measures are worth doing at all: converting the city fleet to electric over a decade, taking beef off the menu at city-run cafeterias two days a week, a composting program, tree plantings. At every budget meeting someone objects that the city's emissions are a rounding error next to global totals, that no single one of our programs changes the climate by any measurable amount, and that we should either do something big enough to matter or stop performing virtue. My staff, in turn, keep reaching for different and incompatible replies — that each small act contributes to a collective harm or benefit in a way we understand from cases like voting; that there's some small but nonzero probability our program triggers or contributes to a threshold effect; that it would be wrong for a city of our size to free-ride even if the act itself changes nothing; that the point is leadership and signaling. We have no settled framework, and the arguments restart every quarter.

  Please turn whatever the philosophy of individual contributions to collective harms actually supports into a decision procedure my staff could run on a proposed measure in a single meeting: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a clear "not justified" even when the measure feels good, and which questions are not really about the inefficacy worry at all and shouldn't be smuggled in as answers to it. Be explicit about which of the replies my staff currently use the procedure should endorse, which it should reject, and which depend on contested value judgments that have to be handed to the elected council rather than settled by staff. Then run it on two proposals: the beef reduction in city cafeterias, and subsidizing home solar installations that we know will mostly be taken up by households that would have installed them anyway. Include at least one case where the procedure's verdict conflicts with what I'd intuitively want, and say plainly what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a small municipal sustainability office.
      *   **Problem:** Staff are stuck in a loop arguing about the efficacy of small-scale measures (EV fleet, beef reduction, composting, tree planting) vs. global emissions. Objections: "We're a rounding error," "Do something big or stop." Replies: "Voting analogy," "Threshold effects," "Free-riding/Integrity," "Leadership/Signaling."
      *   **Task:** Create a *decision procedure* based on the philosophy of individual contributions to collective harms.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Stop conditions ("not justified").
          *   Distinguish between efficacy arguments and other values.
          *   Evaluate staff's current replies (endorse, reject, or defer).
          *   Run the procedure on two specific proposals (Beef reduction, Solar subsidies with high additionality failure).
          *   Include a counter-intuitive verdict.
          *   State what the procedure *cannot* settle.

  2.  **Philosophical Grounding (The "Theory of Change"):**
      *   The core philosophical problem is *causal impotence* in collective action problems (climate change).
      *   *Utilitarian/Consequentialist view:* Does the act reduce expected harm? (Nefsky, Budolfson, etc.).
      *   *Expectabilism:* Even if the probability of making a difference is tiny, the magnitude of the difference (if triggered) is huge, so expected value > 0.
      *   *Complicity/Integrity:* Is it wrong to participate in a harmful system even if my exit changes nothing? (Kantian/Virtue Ethics).
      *   *Signaling/Leadership:* Does this influence *others* to act? (Causal leverage).
      *   *Political Reality:* Staff are bureaucrats; they implement policy, they don't set moral mandates. The "Free-riding" argument is often a political judgment, not a technical one.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   Need to structure it logically. Start with direct impact, move to indirect impact, then to non-consequentialist justifications (which need political approval).
      *   *Step 1: Direct Causal Impact.* (Is there a measurable reduction?)
      *   *Step 2: Expected Value/Thresholds.* (Is there a non-zero chance of triggering a larger change?)
      *   *Step 3: Leverage/Signaling.* (Does this cause *others* to act?)
      *   *Step 4: Integrity/Complicity.* (Is this about our own hands being clean?) -> *Crucial:* This is a value judgment for elected officials, not staff analysis.
      *   *Step 5: Opportunity Cost.* (Could resources do more good elsewhere?)

  4.  **Evaluating Staff Replies:**
      *   *Voting Analogy:* Endorse (as Expected Value).
      *   *Threshold Effects:* Endorse (as Expected Value).
      *   *Free-riding/Integrity:* Defer (Value judgment for Council).
      *   *Leadership/Signaling:* Endorse *if* evidence exists, otherwise Defer (Speculative).

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make it actionable. "Ask this, look for this evidence."
      *   Define the "Stop" condition clearly. If Direct + Expected + Leverage = 0, and it's just "Integrity," staff can't approve it on efficacy grounds; it needs Council mandate.
      *   Ensure the distinction between *efficacy* (does it work?) and *legitimacy* (should we do it anyway?) is clear.

  6.  **Running the Procedure on Case Studies:**
      *   *Case 1: Beef Reduction (2 days/week).*
          *   Direct: Small but measurable.
          *   Threshold: Low probability, high impact? Maybe.
          *   Signaling: High potential (norm setting).
          *   Verdict: Justified (mostly on signaling/norms).
      *   *Case 2: Solar Subsidies (Low Additionality).*
          *   Direct: Zero (would have happened anyway).
          *   Threshold: None.
          *   Signaling: Weak (subsidizing rich homeowners).
          *   Integrity: "We helped solar!" (Greenwashing).
          *   Opportunity Cost: High (money wasted).
          *   Verdict: Not Justified (Counter-intuitive because "Solar = Good").

  7.  **Addressing the "Counter-Intuitive" Requirement:**
      *   The Solar case is the obvious candidate. Intuitively, solar is good. Procedurally, if it adds nothing new, it's a waste of public funds.
      *   Alternatively, a "Tree Planting" case where trees die or are invasive could work, but the Solar one hits the "rounding error" argument harder. Let's stick with the Solar Subsidy with low additionality.

  8.  **Addressing "What the Procedure Cannot Settle":**
      *   It can't settle the *weight* of symbolic value vs. cost.
      *   It can't settle the moral obligation of the city independent of outcomes (deontology).
      *   It can't resolve political risk.

  9.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the philosophical stalemate.
      *   **The Framework:** The "Collective Impact & Fiscal Responsibility Protocol" (give it a name).
      *   **Evaluation of Staff Replies:** Explicitly map their arguments to the protocol.
      *   **The Decision Procedure (Step-by-Step):** Questions, Evidence, Stop Conditions.
      *   **Application to Proposals:** Beef vs. Solar.
      *   **Limitations:** What remains unresolved.

  10. **Refining the Tone:**
      *   Professional, administrative, yet philosophically rigorous.
      *   Avoid academic jargon where possible, but keep the logic sound.
      *   Be firm on the distinction between staff analysis and political will.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "voting" analogy? Yes, under Expected Value.
      *   *Check:* Did I distinguish between efficacy and integrity? Yes, Step 4 is the pivot point.
      *   *Check:* Is the Solar verdict counter-intuitive? Yes, usually solar is seen as an unalloyed good, but economically/efficacy-wise, subsidizing what happens anyway is waste.
      *   *Check:* Did I answer the "rounding error" objection? Yes, by shifting from "total tons" to "expected value" and "leverage."

  12. **Final Polish:** Ensure the "Stop" conditions are clear. If a proposal fails Step 1, 2, and 3, it *must* go to Council as a "Symbolic/Integrity Measure" with full cost disclosure. Staff cannot justify it on efficacy grounds.

  *(Self-Correction on the Solar Case)*: The prompt asks for *two* proposals: Beef reduction and Solar subsidies. I need to make sure the Solar one hits the "conflicts with intuition" mark. Yes, subsidizing solar *feels* right, but if additionality is zero, it's fiscally irresponsible. That works.

  *(Self-Correction on Staff Replies)*:
  *   Voting/Threshold -> Endorsed (Expected Utility).
  *   Free-ride/Integrity -> Deferred (Political/Moral).
  *   Leadership/Signaling -> Conditional (Needs evidence).

