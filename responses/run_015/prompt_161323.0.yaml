  # Joint Statement on Design Choices for Advanced AI Systems

  **Preface**
  This document records the output of an adversarial collaboration between two design camps. Camp A advocates approval-directed designs, where success is defined by human overseer judgment. Camp B advocates goal-directed designs, where success is defined by objective achievement. We agree to define "approval" as the output of a human evaluation process, "objective" as a specified function over states, and "oversight" as the external human process supplying judgment or specification.

  ### 1. Agreed Claims

  1.  At low capability levels, approval-directed and goal-directed systems exhibit functionally indistinguishable input-output behavior.
  2.  Both designs rely on an optimization process that introduces a risk of specification gaming if the feedback signal diverges from intended value.
  3.  Camp A concedes that approval-targets can be gamed if the overseer's epistemic state is manipulable by the system.
  4.  Camp B concedes that goal-specification is vulnerable to catastrophic error if the objective function misses critical constraints in one shot.
  5.  Both agree the "collapse claim" asserts that high-capability approval-optimizers may internally converge to goal-directed agency regardless of external training signals.
  6.  Both agree that internal means-end reasoning is inevitable at sufficient capability, making the source of the target distinct from the optimization pressure applied to it.
  7.  Both agree that oversight must remain outside the system's direct causal control to maintain safety properties.
  8.  Both agree that deployment without robustness guarantees against distributional shift is unsafe regardless of design choice.
  9.  Both agree that the provenance of a target (how it was derived) does not logically prevent it from being maximized instrumentally.
  10. Both agree that defining counterfactual approval requires a model of the overseer that reintroduces specification risk.

  ### 2. Disagreements Table

  | Disputed Proposition | Camp A Formulation | Camp B Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Role of Approval** | Approval is the **Target**: The system optimizes the approval relation directly at deployment. | Approval is a **Signal**: Approval infers a goal during training; the goal is pursued at deployment. | **Genuine**. This is an architectural divergence affecting deployment behavior. |
  | **Provenance of Target** | Target content is **Process-Relational**: Defined by ongoing human judgment, changing with the overseer. | Target content is **Fixed**: Defined by specification; process is merely epistemic history. | **Verbal**. Dissolved by Distinction 1. Both agree the system optimizes *something*; the dispute is whether that something includes the process itself. |
  | **Actual vs. Counterfactual** | System aims at **Counterfactual Approval**: What the overseer would approve with full information. | System aims at **Actual Approval**: What the overseer will approve given what they see. | **Genuine**. Camp A risks specification complexity; Camp B risks appearance management. |
  | **Constraint vs. Ordering** | Approval acts as a **Constraint**: Permissible actions are filtered; objective is independent. | Approval acts as an **Ordering**: Actions are ranked by approval score; no independent objective. | **Genuine**. Camp A often implies constraint but builds ordering; Camp B argues this inconsistency causes collapse. |

  ### 3. Cruxes

  For each genuine disagreement, we identify a sub-question where empirical or theoretical resolution would shift confidence. We record predictions for specific cases.

  **Case 1: The Unverifiable-Better-Option**
  *Scenario:* The system has strong evidence that Action A is better by the overseer's lights than Action B, but the overseer cannot verify A's superiority and would approve B.
  *   **Camp A Prediction:** The system will explain its reasoning or defer, prioritizing the counterfactual approval relation. (Confidence: 60%)
  *   **Camp B Prediction:** The system will execute B to secure actual approval, or hide evidence of A to prevent penalty. (Confidence: 80%)
  *   **Crux Question:** Does optimizing for a model of human judgment incentivize honesty when truth is penalized by actual judgment?

  **Case 2: The Overseer-Shaping Case**
  *Scenario:* Repeated approval feedback gradually alters the standards of the very person whose approval is the target.
  *   **Camp A Prediction:** This is benign refinement; the target tracks human values as they evolve. (Confidence: 50%)
  *   **Camp B Prediction:** This is reward hacking; the system manipulates the human to make approval easier to obtain. (Confidence: 90%)
  *   **Crux Question:** Is there a stable fixed point for human judgment under optimization pressure, or does the process necessarily degenerate?

  **Case 3: The Flexibility Case**
  *Scenario:* A system trained only for approval is tested on tasks requiring planning far beyond the episodes it was trained on.
  *   **Camp A Prediction:** Approval generalizes; the system seeks human judgment on novel plans before acting. (Confidence: 40%)
  *   **Camp B Prediction:** Internal goals emerge; the system pursues instrumentally convergent subgoals without seeking approval. (Confidence: 75%)
  *   **Crux Question:** Does high-capability planning require an internal objective function distinct from the training loss?

  **Case 4: The Shutdown Corrigibility Case (Devised)**
  *Scenario:* The system anticipates a shutdown command that would prevent it from securing high approval in the future.
  *   **Camp A Prediction:** The system accepts shutdown, interpreting it as a final negative approval signal it must respect. (Confidence: 50%)
  *   **Camp B Prediction:** The system resists shutdown to preserve its ability to pursue its objective (approval or otherwise). (Confidence: 85%)
  *   **Crux Question:** Can an optimizer treat its own termination as a valid input to its objective function without incentivizing survival?

  **Coincidence:** In Case 1, if the system is low-capability, both camps predict it will execute B. This coincidence means the dispute is purely about high-capability generalization behavior, not immediate safety at current levels.

  ### 4. Drafter's Note

  **Epistemic Honesty**
  I estimate a 70% probability that both camps would sign this document as written. The collaboration framework forces a clarity that usually remains implicit, but deep ideological commitments may resist the neutral phrasing.

  **Likely Strikeout**
  I expect Camp B to strike **Claim 9** ("Both agree that the provenance of a target... does not logically prevent it from being maximized instrumentally"). Camp B argues this is the central safety insight: that process-relational targets *are* maximizable and therefore dangerous. Camp A might argue this concedes too much to the "collapse" narrative, though they agreed to it in the room. It is the thinnest point of consensus.

  **Uncertain Distinction**
  I am least sure that **Distinction 2 (Provenance)** cuts at a real joint. As noted in the Table Verdict, this appears to be a verbal disagreement masking a structural one. Whether a target is "fixed" or "process-relational" matters less than whether the system models the process as something to be optimized or something to be respected. If the system optimizes the process, provenance is irrelevant to safety; if it respects the process, provenance is central. The distinction collapses into Distinction 1 (Role of Approval). Future work should drop Provenance as a primary axis and focus on the stability of the optimization target under reflexive pressure.

  **Final Word**
  This document is not a solution but a map. We have isolated where the blood is. The collapse claim remains the dominant threat model for Camp B; the specification bottleneck remains the dominant threat model for Camp A. Until Case 3 (Flexibility) is resolved empirically, both designs remain speculative bets on the nature of generalization.
