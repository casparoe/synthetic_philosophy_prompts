      *   **Constraint:** No bibliography or citations.

  2.  **Deconstruct the Core Idea:**
      *   *Standard View:* Gradual replacement (Ship of Theseus style for minds) asks: "Is it the *same* person?" (Yes/No).
      *   *Proposed View:* "Same person" is the wrong question. The question is: "Which *aspects* of personhood persist enough to satisfy specific practical interests (legal, moral, prudential, social)?"
      *   *Key Insight:* Identity might be a cluster concept where the clusters don't align during transition states.
      *   *Challenge:* How to argue for this without just saying "let's be pluralists"? Need to derive it from the *structure* of the replacement scenario and our *practical commitments*.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic but catchy. "Fractured Continuity," "Domain-Specific Identity," "The Hybrid Mind." Let's go with something about "Dissociated Continuity."
      *   **Research Question:** Needs to be precise. Not just "Is identity plural?" but "Does the gradual replacement scenario *reveal* that identity conditions are domain-specific?"
      *   **Background/Problem:** Briefly summarize the standard debate (Locke, Parfit, etc., though no names needed). Explain why they fail: they seek a "master criterion." If psychology says yes and body says no, they fight. They don't consider that *both* might be right for *different purposes*.
      *   **Methodology:** This is the tricky part. How to test without stipulating?
          *   *Step 1:* Map the dimensions (Memory, Phenomenology, Agency, Social).
          *   *Step 2:* Model the divergence (e.g., Memory replaced fast, Agency slow).
          *   *Step 3:* Intuition Pumping/Reflective Equilibrium. Test specific cases against specific practices (e.g., Should *this* hybrid be punished for *that* crime? Should *this* hybrid care about *that* retirement?).
          *   *Step 4:* See if a single criterion can explain the intuitions. If not, pluralism is forced, not stipulated.
      *   **Success/Failure:**
          *   *Success:* Demonstrates that practical intuitions diverge in hybrid cases in a way a unified theory cannot capture.
          *   *Failure:* Intuitions collapse back to a single dominant factor (e.g., "It's all about memory") or the distinctions become too messy to be useful.
