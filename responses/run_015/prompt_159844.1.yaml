answer: |-
  When I list the candidate desiderata that initially occur to me for this operational purpose, I see administrability, non-refoulement compliance, burden-sharing fairness, causal responsibility, sovereign discretion, impartiality among claimants, and integration potential. I am inclined to keep administrability and robustness to strategic behavior as the core non-negotiables because without them the guidance collapses in the interview room or invites gaming by hostile legislatures. I am inclined to reject causal responsibility as a hard constraint because, while morally attractive, it fails the evidentiary test in composite causation cases where no single contributor's share can be computed. I am also cutting sovereign discretion dressed as a constraint, because if a state can veto duties by claiming membership control, the duty becomes optional. I am cutting the requirement that duties must never require admission without consent, as this conflates the ideal of voluntary cooperation with the obligation of protection under partial compliance. I am cutting the requirement that admission must not be conditional on usefulness, not because usefulness should matter, but because making it a constraint forbids skilled migration pathways that might actually secure protection faster, though I would keep neutrality regarding religion or ethnicity as a non-discrimination baseline rather than a duty-generator.

  The reason I am cutting these is that they are disguised conclusions rather than constraints. Demanding that duties track causal responsibility is already a theory of allocation, not a test for one. Demanding respect for a state's claimed right to determine membership is often just a way of asserting that no duty exists. Demanding impartiality between claimants with no tie to the admitting state rules out associative accounts by fiat rather than showing they fail operational tests. So my working list for the specification is narrower: the account must be decidable under asymmetric evidence, it must not reward states for degrading their own capacity or acting first to block access, it must distinguish status generation from duty allocation, and it must remain actionable when most states are defaulting. Anything else is a preference of a particular camp dressed up as a constraint, and for your purpose of rewriting internal guidance, we cannot afford to build philosophical preferences into the operational floor.

  The specification itself must prize apart the question of who counts from the question of who owes what. For the first question, an adequate account must deliver a threshold of harm plus a failure of protection that is verifiable on the record available at the time of decision. It cannot require hindsight, so it must handle the person who leaves before the threatened harm has materialised by assessing the credibility of the threat against the authority's capacity and intent, not the outcome. It must handle the person fleeing a non-state actor by focusing on the state's willingness and ability to protect, distinguishing the willing-but-unable case from the able-but-unwilling case without requiring the applicant to prove the state's internal mental state. It must handle the household from the low-lying atoll by recognizing that the trigger need not be a persecutor but can be the unavailability of basic subsistence due to environmental change, provided the state cannot mitigate it. It must handle the dissident denationalised by decree by treating statelessness as a sufficient condition for the lack of protection, removing the need to identify a specific persecutory ground beyond the act of denationalisation itself. For the second question, who owes what, the account must deliver an allocation mechanism that identifies a specific duty-bearer for every person with status, without requiring precise causal shares in composite flows. It must distinguish between owing admission to this individual, such that she can complain if refused, and owing a share of a global burden that any complying allocation discharges. It must distinguish between owing admission and owing to bring about that someone is admitted, which is what the outsourcing cases turn on. It must distinguish the stringency of a duty from the identity of its bearer, allowing for surrogate protection when the primary duty-bearer defaults. It must distinguish a duty's existence from its temporal shape, accounting for what happens to temporary protection when return ceases to be foreseeable after fifteen years.

  To count as having handled your cases rather than merely taking a position on them, the account must say something specific about the distinctions people collapse. On the non-state actor cases, it must show that the duty arises from the protection gap, not the identity of the threatener. On the composite causation flow, it must show that allocation can proceed via a proxy metric like capacity or proximity when causal shares are unknowable, without pretending those proxies are causal. On the rich state that closes land routes and dismantles reception, it must say that this state retains a duty proportional to its potential capacity, not its manufactured incapacity. On the state that funds camps in a poorer neighbouring state or offshores processing, it must say that funding does not discharge the duty of admission unless the protection standards are equivalent and accessible, and that outsourcing processing does not outsource the responsibility for the outcome. On the state that transfers arrivals onward to a third country where risk resumes, it must identify this as a violation of the duty to bring about safety, regardless of the legal route taken. On the post-conflict state wanting skilled citizens back, it must distinguish between the state's interest in reconstruction and the individual's right to safety, allowing for return only when protection is restored. On the protracted situation, it must specify that temporary protection converts to permanent residence when return is no longer foreseeable, preventing permanent limbo. On the structural fact that low-income adjacent states host the majority, it must impose a duty on distant wealthy states to relieve the burden, not merely to fund it.

  On the constraint side, you are right to put administrability and robustness to strategic behavior in the non-negotiable class. Administrability is non-negotiable because an account that requires an adjudicator to resolve counterfactuals that no available evidence bears on is useless to a caseworker. Robustness to strategic behavior is non-negotiable because an account that rewards a state for making itself inaccessible or degrading its own capacity creates a perverse incentive that undermines the regime entirely. I would demote the requirement that duties must track causal or historical responsibility because it fails administrability in complex cases and fails robustness when responsible states deny responsibility. I would demote the requirement that duties must respect a state's claimed right to determine its own membership because this is the very power that is being abused in the strategic incapacity cases. I would keep the requirement that duties must be neutral with respect to the claimant's religion or ethnicity as a non-discrimination constraint, but I would treat the requirement that they must be impartial between claimants with no tie to the admitting state as a preference, since associative ties might legitimately prioritize certain allocations without violating the core duty. I would treat the requirement that duties must never require admission without consent as a false constraint, since the duty exists independently of the state's consent under international law. I would treat the requirement that duties must not make admission conditional on usefulness as a policy preference rather than a philosophical constraint, provided it does not become a barrier to protection.

  There are subsets of desiderata that cannot be jointly satisfied, and you should treat this as a result rather than a lament. The first unsatisfiable subset is this: require that every person with the status have some state who owes them admission, require that duty track causal responsibility for the displacement, and require that a state with no causal involvement bear no duty. In the case where the only causally responsible agent is the persecuting authority itself, either the persecutor owes asylum, which is impossible, or an uninvolved state owes it, which violates the third requirement, or the duty has no bearer, which violates the first. For your purpose, the least costly member to give up is the requirement that a state with no causal involvement bear no duty, because protection must exist even when causality is opaque or monopolized by the persecutor. The second unsatisfiable subset is: require that every individual has a right to be admitted by a specific state of their choice, require that duties be distributed fairly among states, and require that the system function under partial compliance. If the fair-share state is not the state of choice, and the state of choice is not complying, the individual right cannot be met without violating the fair-share distribution. For your purpose, the least costly member to give up is the individual right to a specific state, substituting a right to admission by some complying state, because this allows for allocation mechanisms that survive partial compliance.

  The single requirement that does the most exclusionary work is the robustness to strategic behavior constraint, specifically the clause that a state cannot reduce its duty by reducing its capacity. Stated as a theorem: Any account satisfying this constraint must concede that a state's duty is calculated against its potential capacity and historical baseline, not its current operational posture, and therefore cannot accept self-induced incapacity as a defense against admission. This knocks out most sovereignty-based accounts and most capacity-based accounts that rely on current absorption rates, because they allow states to game the system by dismantling reception systems. It forces the account to look beyond the immediate administrative reality to the normative potential of the state, which is administratively harder but philosophically necessary to prevent the regime from being hollowed out by bad faith actors.

  Running the scorecard over the main families of account, capacity-based accounts fail the robustness test because they reward states for dismantling capacity. Causal or historical-responsibility-based accounts fail the administrability test in composite causation cases and the unsatisfiability test when the persecutor is the only cause. Proximity or first-asylum accounts fail the burden-sharing test by locking responsibility onto low-income adjacent states. Associative or special-ties accounts fail the coverage test because they leave those without ties unprotected, though they may work as a secondary allocation mechanism. Fair-share or global-distribution accounts fail the enforcement test under partial compliance unless coupled with a mechanism to reassign duties when states default. Consent or self-determination based accounts fail the duty existence test entirely, as they allow states to veto obligations. Market or tradable-quota based accounts fail the non-commodification constraint and often fail the robustness test if wealthy states can simply buy their way out of admission duties without ensuring protection. Only a hybrid account that fixes status based on protection gaps and allocates duties based on potential capacity with reassignment mechanisms survives the full specification, though it requires the political will to enforce the reassignment.
