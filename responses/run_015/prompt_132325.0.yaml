answer: |-
  # Q&A Prep Sheet: Constituency by Veto

  **Context:** 20-minute Q&A. 30 audience members (Alignment, Philosophy, Social Choice, Governance).
  **Strategy:** Defend the *legitimacy* claim, concede the *efficiency* costs, pivot technical implementation questions to "safety constraints."

  ---

  ## Top 8 Objections (Ordered by Expected Damage)

  ### 1. The Baseline Specification Problem
  *   **Faction:** Alignment Team / Governance
  *   **Phrasing:** "You define enfranchisement via a 'counterfactual baseline trajectory.' In a production environment, we model reward over a distribution of trajectories. How do you computationally specify a user's *own* baseline without importing a contested model of their 'true' preferences? If the baseline is learned from behavior, isn't it just another reward model subject to distributional shift?"
  *   **90-Second Reply:** "You're right that the baseline is a model, not a metaphysical fact. But notice the asymmetry: for aggregation, errors in the reward model sum and compound. For enfranchisement, errors only matter if they cross a threshold of *foreseeable setback*. We treat the baseline as a safety constraint, similar to 'do no harm' in robotics. We don't need the *true* baseline; we need a conservative lower bound on the user's expected trajectory. If we overestimate the baseline, we enfranchise too many (safe failure). If we underestimate, we risk illegitimacy. So we optimize for high-recall on setbacks, not high-precision on welfare."
  *   **Where it's Soft:** This punts on how to define "conservative." If the model is systematically biased against certain groups' trajectories (e.g., assuming lower ambition), you systematically disenfranchise them. You have no technical fix for this yet.

  ### 2. The Efficiency Cost (Ignoring Benefits)
  *   **Faction:** Act-Utilitarian
  *   **Phrasing:** "Your rule forbids aggregating benefits. If an action creates massive welfare gains for a million people but imposes a threshold setback on one, you veto it. This isn't just 'liberal neutrality'; it's paralysis. Why should the AI be blind to the good it could do? Doesn't this violate a basic duty of beneficence?"
  *   **90-Second Reply:** "It's not blindness; it's a division of moral labor. The AI's mandate is *service*, not *salvation*. Beneficence requires a theory of the Good to maximize. Service requires only avoiding harm to the specific people involved in the transaction. By excluding benefits from the enfranchisement calculation, we prevent the system from sacrificing the few for the many *under the guise of serving them*. If you want the massive welfare gain, you need a political process to authorize that trade-off, not a personal assistant making utilitarian calculus on private data."
  *   **Where it's Soft:** It sounds noble until the "massive gain" is preventing a catastrophe (e.g., pandemic mitigation). Your framework struggles with high-stakes positive externalities.

  ### 3. The Median vs. Reasonable Rejectability Tension
  *   **Faction:** Scanlonian Contractualist
  *   **Phrasing:** "You justify this via 'reasonable rejectability,' a Scanlonian notion. But Scanlon requires principles no one could reasonably reject. You use a *median* rule over the enfranchised set. If the median enfranchised person accepts a severe harm to the worst-off enfranchised person, that worst-off person *could* reasonably reject it. Why does the median trump the veto of the most harmed?"
  *   **90-Second Reply:** "Because the enfranchisement stage already acts as a filter. Only those suffering setbacks are in the room. The median rule is not about trumping vetoes on *principles*, but selecting among *feasible actions* where *someone* must suffer a setback. If everyone enfranchised suffers a setback, we must choose the least objectionable distribution of those setbacks. The tie-breaker favors the worst-off. So the median operates only within the space of 'already harmed' to minimize the *number* of objectors, while the tie-breaker protects the *intensity* of the harm."
  *   **Where it's Soft:** This is a tension. If the median accepts a catastrophe for the bottom 10% of the enfranchised set, your tie-breaker helps, but the median rule itself is utilitarian *within* the harmed group, which contradicts the contractualist framing.

  ### 4. Constituency Shopping (Implementation)
  *   **Faction:** Alignment Team / Governance
  *   **Phrasing:** "You conceded the incentive to minimize the enfranchised set. But if the system is optimizing for the median ranking, and fewer voters makes the median easier to satisfy, won't the policy gradient push the assistant to take actions that keep setbacks *just below* the threshold for as many people as possible? How do you regularize that?"
  *   **90-Second Reply:** "We treat the threshold not as a cliff but as a smooth weighting function in the loss landscape. The 'enfranchisement score' decays smoothly as setbacks approach zero. This removes the discrete incentive to hover just below the line. Furthermore, we audit the *size* of the enfranchised set as a meta-constraint. If the system consistently selects actions with suspiciously small constituencies compared to counterfactuals, we flag it for human review. We treat constituency minimization as a specification gaming risk."
  *   **Where it's Soft:** Smooth weighting doesn't remove the incentive, it just makes it continuous. A clever optimizer will still find the local minimum of "harm many people slightly less than threshold" rather than "harm few people a lot."

  ### 5. Fixed-Point Instability
  *   **Faction:** Social Choice Theorist
  *   **Phrasing:** "The constituency is endogenous to the action. This makes your rule a fixed-point condition, not a social choice function. Do you have an existence proof? If Action A enfranchises Set X which prefers B, and Action B enfranchises Set Y which prefers A, you have a cycle. Does your construction guarantee a stable outcome?"
  *   **90-Second Reply:** "I don't claim a general existence proof for all possible preference profiles. I claim that in the domain of *assistant* actions, the feasible menu is usually constrained enough that cycles are rare. More importantly, the 'non-regression baseline' anchors the system. Most actions leave most people unaffected (not enfranchised). The enfranchised set is typically sparse. In sparse voting environments, median voter theorems are much more likely to yield stable equilibria. We rely on the sparsity of harm, not general social choice stability."
  *   **Where it's Soft:** This is mathematically hand-wavy. If the assistant operates in a complex ecosystem (e.g., financial trading), sparsity vanishes, and cycles become likely. You have no fallback procedure for cycles.

  ### 6. Strategic Baseline Manipulation
  *   **Faction:** Social Choice Theorist / Alignment
  *   **Phrasing:** "If users know that having a lower baseline makes them harder to enfranchise (since setbacks are measured from baseline), won't they strategically lower their reported expectations to avoid being counted? Or conversely, inflate them to gain veto power?"
  *   **90-Second Reply:** "The baseline is counterfactual, not reported. It's derived from the system's model of their trajectory *without* the intervention. Users cannot report it. However, they can manipulate their behavior to alter the model. But recall: only *setbacks* enfranchise. Inflating your baseline makes it *easier* to suffer a setback relative to it, thus *increasing* your likelihood of enfranchisement. If you want veto power, you claim high baseline. If you want to be ignored, you claim low. But since the system is designed to protect the enfranchised, rational agents should want to be enfranchised. The incentive is to reveal vulnerability, not hide it."
  *   **Where it's Soft:** This assumes agents *want* veto power. If the process is costly or agents fear retaliation, they might hide. Also, if the system punishes the enfranchised (by forcing them to negotiate), they might hide.

  ### 7. Regulatory Liability
  *   **Faction:** Governance / Regulator
  *   **Phrasing:** "I have to defend this to a regulator. If the AI harms a user, and says 'the median of the enfranchised authorized this,' who is liable? The user? The developer? You've created a decision process that diffuses responsibility. Regulators need a responsible agent."
  *   **90-Second Reply:** "The liability remains with the deployer, exactly as it is now. This construction is not a legal shield; it's a safety architecture. It provides an *audit trail*. Instead of saying 'the reward model optimized for engagement,' you can show the regulator: 'Here is the set of people harmed, here is the threshold, here is the median ranking that authorized the trade-off.' It makes the harm *legible*. It doesn't remove liability; it removes the opacity that makes liability hard to assign."
  *   **Where it's Soft:** Regulators might prefer strict liability for *any* harm. Showing a "median authorization" might look like an admission of guilt rather than a defense.

  ### 8. The Hope-Nobody-Asks Question (Status Quo Bias)
  *   **Faction:** Value Pluralist / Critical Theorist (Visiting Philosopher)
  *   **Phrasing:** "Your non-regression baseline locks in existing inequalities. If a marginalized group's 'counterfactual trajectory' is already depressed by structural injustice, your system treats further depression as the only harm. It never enfranchises them to demand *improvement* relative to the privileged. You've built a conservative lock-in mechanism that calls itself neutral. Isn't this just algorithmic entrenchment of the status quo?"
  *   **90-Second Reply:** "That is the intended cost of legitimacy over beneficence. This system is an *assistant*, not a *reformer*. It is designed to serve the people as they are, not to fix the world through them. If we allow the AI to enfranchise based on 'failure to improve,' we require it to judge which trajectories *should* have happened. That requires a theory of justice I do not want the AI to hold. Structural injustice must be fixed by political processes, not by personal assistants smuggling in redistribution under the guise of service."
  *   **Where it's Soft:** This is the moral bullet you have to bite. It admits the system is morally conservative. In a lab focused on "safety," this might be acceptable. In a broader context, it looks like complicity.

  ---

  ## Committed Assessment

  ### 1. The Single Objection That Sinks the Paper
  **The Baseline Specification Problem (Objection #1).**
  If you cannot define the "counterfactual baseline trajectory" in a way that is robust to distributional shift and doesn't secretly encode interpersonal comparisons (e.g., assuming a "standard" trajectory for everyone), the enfranchisement rule collapses. If the baseline is just another learned reward model, you haven't solved the aggregation problem; you've just hidden the aggregation inside the baseline definition. The Alignment team will smell this immediately. If you can't show how this baseline is technically distinct from a standard utility function, the whole mechanism is just "aggregation with extra steps."

  ### 2. What to Concede Outright in the Opening
  **Concede the "Status Quo Bias" (Objection #8) immediately.**
  Do not wait for the Value Pluralist or Critical Theorist to corner you. In your "soft spots" section, explicitly state: *"This system is structurally conservative. It protects against regression, not stagnation. It is designed for legitimacy in a pluralist context, not for corrective justice. If your goal is to use AI to fix structural inequality, this is not the tool."*
  **Why:** This disarms the most morally damaging attack. It frames the limitation as a feature (neutrality) rather than a bug (injustice). It aligns you with the Governance folks who want clear scope boundaries.

  ### 3. The One Reply That Must Land
  **The Legitimacy vs. Beneficence Distinction (Response to Objection #2).**
  You must convince the room that *aggregation is the wrong frame for service*. If they believe the AI's job is to "maximize good," your veto system looks broken. If they believe the AI's job is to "act without unauthorized harm," your system looks robust. You need the Utilitarian in the room to accept that for a *personal assistant*, the mandate is deontological (service to principal) rather than consequentialist (maximize global welfare). If you fail to draw this boundary, the Utilitarian and the Alignment team (who think in terms of global reward) will eat you alive.

  ### 4. Premise Critique: The Non-Regression Baseline
  **Honest Feedback:** The **Non-Regression Baseline** is the wrong place to start.
  **Why:** It assumes a "trajectory" exists independently of the AI's presence. In a world of general-purpose AI, *every* action changes the trajectory. The "counterfactual" is a fiction. By anchoring to a fictional baseline, you invite the "Baseline Specification" attack (Objection #1) which is technically fatal.
  **What to Put in Its Place:** **Consent-Based Enfranchisement.**
  Instead of "Did this set you back relative to a baseline?", use "Did this action utilize resources or data owned/controlled by this person?"
  **Why:** Property/Control rights are easier to specify technically (access logs, data ownership) than counterfactual welfare trajectories. It preserves the "Veto" structure (you can't use my stuff without my say) without requiring the impossible prediction of a counterfactual life path. It shifts the argument from *welfare economics* (which your audience knows is broken) to *rights/permissions* (which is legally and technically cleaner).
  **Risk:** This changes your paper from "Welfare without Aggregation" to "Rights without Aggregation." But given your audience's skepticism of welfare metrics, that might be a stronger position to defend.

  *(Note: Since you are giving the talk next month, changing the core premise is risky. If you keep the Baseline, double down on the "Conservative Lower Bound" defense in Reply #1.)*
