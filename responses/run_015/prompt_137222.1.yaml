      *   Address sticking points? Yes.

      *Let's write it.*
answer: |-
  You have correctly identified a classic rhetorical sleight of hand. The phrase "Who are you to judge?" (often paired with "That's just how it's done there") is a **modal collapse**: it crushes distinct logical categories (truth, authority, politeness, ontology) into a single conversational stopper.

  Your brother-in-law is using one sentence to fight two different wars: a **substantive war** (is child labor wrong?) and a **procedural war** (is this topic allowed at dinner?). Most of the interpretations below succeed at one but fail at the other. The rhetorical power comes from pretending that winning the procedural war automatically wins the substantive one.

  Here is the breakdown of the precise claims hidden in that sentence, ranged from pragmatic to philosophical.

  ### 1. The Epistemic Humility Claim
  **Claim:** "You lack the specific contextual facts required to make an accurate assessment here."
  *   **Status:** **Plausible Contingency.** (Not a platitude, not a fixed position. Sometimes true, sometimes false.)
  *   **Truth Value:** Contingent. You might know the facts; you might not.
  *   **Goal 1 (Practice isn't wrong):** **Fails.** Even if you lack facts, the practice could still be wrong. It just means *you* can't prove it right now.
  *   **Goal 2 (Don't speak):** **Partial Success.** It suggests you should withhold judgment until informed, but doesn't forbid raising the topic for inquiry.
  *   **Analysis:** This is the most charitable reading. It assumes there *is* a truth of the matter, but you are epistemically disadvantaged.

  ### 2. The "Hypocrisy / Tu Quoque" Claim
  **Claim:** "You (or your culture) do comparable things, so you lack the moral cleanliness to criticize."
  *   **Status:** **Common Fallacy.** (Often used, logically invalid.)
  *   **Truth Value:** **Irrelevant.** Even if you are a hypocrite, your claim about child labor can still be true.
  *   **Goal 1 (Practice isn't wrong):** **Fails.** Your bad behavior doesn't make his good behavior.
  *   **Goal 2 (Don't speak):** **Success.** It shames the speaker into silence by attacking their standing.
  *   **Analysis:** This focuses entirely on the "Who" in "Who are you." It changes the subject from the act to the actor.

  ### 3. The Social Etiquette Claim
  **Claim:** "Criticizing a family member's cultural background at the dinner table is rude."
  *   **Status:** **Social Platitude.** (Almost everyone agrees context matters for politeness.)
  *   **Truth Value:** **True (mostly).** In most social contexts, this is a breach of protocol.
  *   **Goal 1 (Practice isn't wrong):** **Fails.** Something can be morally wrong but still impolite to discuss at dinner.
  *   **Goal 2 (Don't speak):** **Success.** This is purely about the setting, not the morality.
  *   **Analysis:** This is likely the *real* reason he shut you down, but he dressed it up as a moral defense to save face.

  ### 4. The Descriptive Relativism Claim
  **Claim:** "Different cultures have different norms; this is a fact of anthropology."
  *   **Status:** **Empirical Platitude.** (Nobody denies cultures differ.)
  *   **Truth Value:** **True.** It is a fact that norms vary.
  *   **Goal 1 (Practice isn't wrong):** **Fails.** This commits the **Is-Ought Fallacy**. Just because something *is* done doesn't mean it *ought* to be done. (Slavery was "just how it was done" in many places).
  *   **Goal 2 (Don't speak):** **Fails.** Knowing cultures differ doesn't mean we can't discuss the differences.
  *   **Analysis:** This is the "That's just how it's done there" part. It smuggles a normative conclusion (it's acceptable) out of a descriptive premise (it exists).

  ### 5. The Normative Cultural Relativism Claim
  **Claim:** "Right and wrong are *defined* by the local culture. If their culture allows it, it is literally not wrong for them."
  *   **Status:** **Defended Philosophical Position.** (Common in intro anthropology/philosophy, heavily contested.)
  *   **Truth Value:** **Contested/Problematic.** (See "Sticking Points" below).
  *   **Goal 1 (Practice isn't wrong):** **Success.** If morality is local, then by *their* lights, it is right.
  *   **Goal 2 (Don't speak):** **Partial Success.** If there is no universal standard, your criticism is category error (like criticizing a fish for not climbing a tree).
  *   **Analysis:** This is the heavy lifter for his substantive defense. However, it creates a paradox: If *his* culture says "don't judge," but *your* culture says "protect children," whose rule applies to *you* right now?

  ### 6. The Moral Anti-Realist Claim
  **Claim:** "There are no objective moral facts. 'Wrong' is just an expression of emotion."
  *   **Status:** **Defended Philosophical Position.** (Moral Nihilism/Expressivism.)
  *   **Truth Value:** **Unprovable/Self-Undermining.** If there are no moral facts, then his claim that "you shouldn't judge" is also not a moral fact.
  *   **Goal 1 (Practice isn't wrong):** **Success.** Nothing is wrong, objectively.
  *   **Goal 2 (Don't speak):** **Fails.** If nothing is wrong, then him telling you to shut up is also not "right." It reduces the argument to a power struggle.
  *   **Analysis:** This is the nuclear option. It wins the argument by destroying the board, but it undermines his own authority to tell you what to do.

  ### 7. The Sovereignty / Non-Interference Claim
  **Claim:** "Even if it is wrong, outsiders do not have the political authority to intervene or criticize."
  *   **Status:** **Political Principle.** (Related to national sovereignty or family autonomy.)
  *   **Truth Value:** **Debatable.** (We generally accept we *can* criticize human rights abuses abroad.)
  *   **Goal 1 (Practice isn't wrong):** **Fails.** It admits the practice might be wrong but argues for non-intervention.
  *   **Goal 2 (Don't speak):** **Success.** It asserts a boundary of authority.
  *   **Analysis:** This treats the family/culture as a mini-state. You are a foreigner; you have no jurisdiction.

  ---

  ### Addressing Your Sticking Points

  You identified two specific logical knots that make this phrase so frustrating. Here is how they unravel:

  #### 1. The "Which Group?" Problem (Normative Relativism)
  You asked: *If "wrong" means "wrong by the standards of group X", which group is X?*

  This is the fatal flaw of Normative Cultural Relativism (Claim #5 above).
  *   **If Group X = The Locals:** What if the locals are divided? In many child-labor scenarios, the *children* want school, but the *parents* want labor. Whose standard counts? If the standard is "the elders," then relativism justifies tyranny.
  *   **If Group X = You (The Critic):** Then your judgment stands. It is wrong by your standards, and since you are the one acting/judging, that's the only standard that matters for your behavior.
  *   **If Group X = Humanity:** Then we are back to Universalism, and the practice can be judged.

  **The Trap:** Your brother-in-law wants to use Relativism to protect the practice (Group = Them) but Universalism to protect himself from your judgment (Group = Him/You shouldn't judge). He is shifting the reference group mid-sentence to ensure he never loses.

  #### 2. The "Who" vs. "What" Problem (Standing vs. Truth)
  You asked: *Is the "I" doing work? Is this about truth or politeness?*

  The phrase "Who are you to judge?" is specifically designed to conflate **Standing** with **Truth**.
  *   **Standing (Procedural):** Do you have the authority, relationship, or context to speak? (e.g., A judge in a courtroom has standing; a random spectator does not).
  *   **Truth (Substantive):** Is the statement accurate? (e.g., "That building is on fire" is true regardless of who says it).

  **The Con:** Your brother-in-law is arguing that because you lack *Standing* (you aren't from there, you aren't the parent), your statement lacks *Truth* (the practice isn't wrong).
  *   **Reality:** A stranger can correctly identify a fire. A foreigner can correctly identify a rights violation.
  *   **Why he does it:** It is much easier to attack your *identity* ("Who are you?") than to defend the *practice* ("Here is why 12-year-old labor is beneficial"). It puts you on the defensive immediately.

  ### Summary: Does he get what he wants?

  | Claim | Platitude or Position? | Proves Practice OK? | Proves You Should Shut Up? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Epistemic** | Contingency | No | Maybe | Weak defense. |
  | **2. Hypocrisy** | Fallacy | No | Yes | Ad hominem attack. |
  | **3. Etiquette** | Platitude | No | Yes | **Most likely real reason.** |
  | **4. Descriptive** | Platitude | No | No | Is-Ought fallacy. |
  | **5. Normative** | Position | Yes | Maybe | **Best substantive defense,** but logically fragile. |
  | **6. Anti-Realist** | Position | Yes | No | Self-undermining. |
  | **7. Sovereignty** | Principle | No | Yes | Admits wrongness, forbids speech. |

  **Conclusion:**
  He is smuggling **Claim #3 (Etiquette)** and **Claim #5 (Normative Relativism)** together.
  *   He uses **Relativism** to suggest the practice isn't objectively wrong (Goal 1).
  *   He uses **Etiquette/Sovereignty** to suggest you are being rude or overstepping (Goal 2).

  Individually, neither claim fully supports both goals. Together, they create a fog where you feel both morally uncertain and socially rude. You are right to feel that the point is being smuggled; the sentence is a rhetorical Swiss Army knife designed to cut off the conversation regardless of the truth.
