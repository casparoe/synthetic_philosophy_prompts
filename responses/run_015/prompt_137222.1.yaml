prompt: |-
  My brother-in-law grew up in a country where it's pretty normal for kids around twelve to work in the family shop instead of being in school full time, and at dinner I said something like "that's wrong" and he shut it down with who am I to judge, that's just how it's done there. Later in the same conversation he seemed to use the same line to mean I shouldn't have brought it up at all, which feels like a totally different point getting smuggled in.

  I want to be able to take that one sentence apart. Can you lay out as a list the different precise things it could be claiming, from the boring end (I might be missing facts, I'm biased, it's rude to say out loud, the people doing it aren't to blame since they were raised that way) to the real philosophical ones (wrong just means wrong-by-the-standards-of-some-group; there's no fact of the matter here at all; moral claims try to be universal and all of them fail; it's wrong to interfere with other cultures). For each, say whether it's basically a platitude nobody would deny, whether it's an actual position someone defends, and whether it's false or self-undermining — and especially whether it actually gets him the two things he was using it for: that the practice isn't wrong, and that I shouldn't have said so.

  One thing I keep getting stuck on: if "wrong" only means "wrong by the standards of group X", it matters a lot which group that is — mine, his, or the group the people doing it belong to — and I can't tell which one the slogan picks, or what happens if that group mostly disapproves of the practice themselves. Also I'm not sure whether the "I" is doing work, like maybe the idea is I lack standing as an outsider, and definitly not sure if that's supposed to be a point about truth or just about politness.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user criticized a cultural practice (12-year-olds working instead of schooling) at dinner. The brother-in-law (BIL) responded with "Who are you to judge?" / "That's just how it's done there."
      *   **Observation:** The user noticed the BIL used this line to do two different jobs: (1) Defend the practice (it's not wrong), and (2) Police the conversation (you shouldn't have said that).
      *   **Task:** Break down the sentence "Who are you to judge?" / "That's just how it's done there" into a list of precise claims.
      *   **Structure:** Range from "boring/pragmatic" to "deep/philosophical."
      *   **Evaluation Criteria for each claim:**
          *   Is it a platitude (nobody denies)?
          *   Is it a defended philosophical position?
          *   Is it false/self-undermining?
          *   **Crucial:** Does it successfully achieve the BIL's two goals (Practice isn't wrong + You shouldn't have spoken)?
      *   **Specific Confusions to Address:**
          *   Relativism (Which group's standards count?).
          *   The "I" (Standing vs. Truth).
          *   Truth vs. Politeness.

  2.  **Deconstruct the BIL's Rhetoric:**
      *   The phrase "Who are you to judge?" is a rhetorical shield. It conflates *epistemic humility* (I might be wrong), *moral relativism* (no universal right/wrong), *cultural sovereignty* (don't interfere), and *social etiquette* (don't be rude).
      *   The user is right to feel that these are distinct claims being smuggled together.

  3.  **Drafting the List (Iterative Process):**

      *   *Item 1: Epistemic Humility / Lack of Information.* "You don't know the full context."
          *   Status: Plausible, often true.
          *   Goals: Doesn't prove it's *not* wrong, just that *you* don't know. Doesn't necessarily mean don't speak, just speak carefully.
      *   *Item 2: Bias / Hypocrisy.* "You do bad things too." (Tu Quoque).
          *   Status: Common retort.
          *   Goals: Attacks the speaker, not the claim. Doesn't prove practice is okay.
      *   *Item 3: Social Etiquette / Politeness.* "It's rude to criticize guests/family/culture at dinner."
          *   Status: Platitude.
          *   Goals: Achieves "Don't speak," fails "It's not wrong."
      *   *Item 4: Descriptive Relativism.* "Different groups do different things."
          *   Status: Fact (platitude).
          *   Goals: Doesn't imply *normative* relativism (that it's okay). Is-Ought problem.
      *   *Item 5: Normative Cultural Relativism.* "Right/Wrong is defined by the local culture."
          *   Status: Defended philosophical position (but controversial).
          *   Goals: Achieves "It's not wrong (for them)." Doesn't necessarily stop *you* from judging by *your* standards, unless combined with tolerance norms.
      *   *Item 6: Moral Anti-Realism / Nihilism.* "Nothing is objectively wrong."
          *   Status: Defended philosophical position.
          *   Goals: Achieves "It's not wrong (objectively)." But then *his* defense is also not objectively right. Self-undermining in debate.
      *   *Item 7: Non-Interference / Sovereignty.* "Outsiders shouldn't intervene."
          *   Status: Political principle.
          *   Goals: Achieves "Don't speak/act." Doesn't prove "It's not wrong," just "Don't fix it."
      *   *Item 8: The "Standing" Argument.* "You lack the authority."
          *   Status: Social norm.
          *   Goals: Focuses on the "Who," not the "What."

  4.  **Refining the Analysis (Addressing User's Specific Sticking Points):**
      *   *Which Group?* I need to explicitly highlight the ambiguity in Cultural Relativism. If the local group is divided (e.g., kids want school, parents want work), whose standard counts?
      *   *The "I":* Distinguish between "You are factually incorrect" vs. "You are socially inappropriate."
      *   *The Two Goals:* I need a column or specific note for each item indicating if it supports Goal A (Practice is okay) and Goal B (Shut up).

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's sharp observation (the "bait and switch" nature of the phrase).
      *   **The Breakdown (The List):** Group by category (Epistemic, Social, Meta-ethical, Political).
      *   **Evaluation:** For each, check the boxes (Platitude? Position? False?) and the Two Goals.
      *   **Deep Dive on the Sticking Points:** Address the "Which Group?" and "Truth vs. Politeness" questions explicitly.
      *   **Conclusion:** Summary of why the phrase is rhetorically effective but logically messy.

  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* Make sure not to take a stance on child labor itself. The prompt is about the *argument structure*, not the ethics of child labor.
      *   *Nuance:* Distinguish between "Descriptive Relativism" (cultures differ) and "Normative Relativism" (cultures determine morality). This is a classic philosophy 101 distinction that fits perfectly here.
      *   *Nuance:* The "Who are you" part specifically targets *standing*. I need to make sure that's highlighted.
      *   *Check:* Did I answer whether the claims are self-undermining? Yes, especially the nihilism angle.

  7.  **Final Polish:** Ensure the tone is analytical and helpful, validating the user's intuition that something slippery is happening. (The user's prompt is very sophisticated, so the response should match that level of rigor).

      *(Self-Correction on the "Two Goals" metric)*:
      Goal 1: The practice isn't wrong (Substantive defense).
      Goal 2: You shouldn't have brought it up (Procedural shutdown).
