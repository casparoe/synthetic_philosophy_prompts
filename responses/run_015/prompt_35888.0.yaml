prompt: |-
  I'm the valedictorian of my graduating class, and I've been asked to deliver a five-minute speech at commencement. For the past semester I've been absorbed in Plato's cave allegory — I wrote my extended essay on Book VII of the Republic, so I know the details that popular summaries tend to drop: the fire behind the prisoners, the puppeteers carrying artifacts along the wall, the freed prisoner's eyes aching so badly in the light that he wants to crawl back down, the contest in which prisoners win honors for predicting which shadow will pass next, and the grim suggestion that if a returned prisoner tried to free the others, they would laugh at him and, if they could, kill him — which Socrates seems to intend as a dark nod to his own fate. My essay supervisor made two further points that have stayed with me: Socrates insists that education is not a matter of putting sight into blind eyes but of turning the whole soul around toward what is real, and he says the philosophers' descent back into the cave is compulsory — the ones who have seen the sun owe it to the people still inside.

  Here is my problem: a graduation speech about the cave is, structurally, a returning prisoner's speech, and the allegory is quite clear that those do not go well. If I cast my classmates as prisoners, I insult them on a day meant to honor them, and I imply that I alone have seen the sun, which at eighteen is a difficult claim to make with a straight face. If I cast the teachers as the ones who turned us around, then the diploma becomes a step into the daylight — but the allegory's actual claim is that the ascent takes decades, that the eyes hurt the whole way, and that the first things you see outside are mere shadows and reflections in water before you can bear anything brighter. I also can't deploy the "turning the soul" line as a compliment to my class, because Socrates means it partly as a critique of schools exactly like mine: institutions that fill students with facts while leaving them facing the wall, rewarding whoever is best at naming the passing shadows — which is uncomfortably close to what I just spent four years excelling at.

  Please write the speech. It should run about five minutes, roughly 700 words, and the audience is mixed: most of the room is family who have never read a line of Plato, while a handful of teachers, my supervisor among them, know the allegory cold and will catch every liberty I take. I want the cave to do genuine structural work — shaping what I can honestly claim lies ahead of us, and what we owe to the people still down in the dark — rather than being name-dropped in the opening line and abandoned. The speech should face the allegory's hardest edge, that the return is compulsory and unwelcome, without making the room feel insulted or doomed. If you conclude that no honest version of the cave story can survive a commencement, tell me so plainly, and give me the best speech that honesty permits.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** Valedictorian (18 years old).
      *   **Task:** Write a 5-minute commencement speech (approx. 700 words).
      *   **Theme:** Plato's Cave Allegory (Book VII of the Republic).
      *   **Knowledge Level:** Speaker knows the details deeply (fire, puppeteers, pain of light, contest of shadows, death of returner, education as turning the soul, compulsory descent). Supervisor knows it well too. Audience is mixed (mostly families who don't know Plato, some teachers who do).
      *   **Constraints/Challenges:**
          *   Cannot insult classmates as "prisoners."
          *   Cannot claim sole enlightenment (arrogant/untrue).
          *   Cannot simplify the ascent (it takes decades, eyes hurt).
          *   Cannot simply praise the school as the "turner of souls" (Socrates critiques schools that reward shadow-naming).
          *   Must face the "compulsory return" and the risk of rejection/death (metaphorically).
          *   Must use the Cave structurally, not just as a name-drop.
          *   Must be honest: If the Cave doesn't work for commencement, say so and write the best honest speech possible.
      *   **Tone:** Honest, reflective, humble, challenging but not alienating.

  2.  **Evaluate the Feasibility (The "Honesty" Check):**
      *   *Can the Cave work?* Yes, but it requires a significant reframing. The traditional valedictorian speech says "We made it! We are ready!" The Cave says "We have barely started, the light hurts, and going back is dangerous."
      *   *The Risk:* Calling graduates "prisoners" is indeed insulting. Calling the school "the cave" is risky for the teachers in the room.
      *   *The Solution:* Shift the focus. The school wasn't the cave; the *world* is the cave. Or, more subtly, the *comfort* of certainty is the cave. The graduation isn't the exit into the sun; it's the moment we are pushed toward the entrance. The "compulsory return" isn't coming back to high school; it's the obligation to engage with the messy world outside using what we've learned, even when it's uncomfortable.
      *   *The "Shadow-Naming" Critique:* Acknowledge this. Admit that we got good at grades (shadows), but now we need to look at the things casting them.
      *   *The "Compulsory Descent":* This is the core ethical obligation. We don't stay in the ivory tower; we go back into society to serve.
      *   *Conclusion:* It is possible to write an honest speech using the Cave without insulting the audience, provided the metaphor is handled with nuance. I don't need to reject the prompt's premise, but I need to navigate the pitfalls carefully.

  3.  **Drafting Strategy:**
      *   **Opening:** Acknowledge the tradition of the speech. Introduce the Cave subtly without academic jargon.
      *   **The School Experience:** Address the "shadow-naming" critique honestly. We got good at grades. That's not nothing, but it's not the sun.
      *   **The Ascent:** Graduation isn't the end of the journey; it's the painful turn toward the light. Acknowledge the pain/uncertainty of the future.
      *   **The Return/Obligation:** This is the crucial Socratic point. We don't leave to escape; we leave to serve. The "compulsory" nature is our duty to bring truth back to the community.
      *   **Closing:** Hopeful but realistic. We might get laughed at, but we must try.

  4.  **Word Count & Timing:**
      *   5 minutes spoken is roughly 650-750 words.
      *   Need to keep paragraphs tight.

  5.  **Refining the Metaphor:**
      *   *Avoid:* "You were prisoners."
      *   *Use:* "We are all accustomed to shadows." "The comfort of the known."
      *   *Avoid:* "I am the enlightened one."
      *   *Use:* "We are together at the mouth of the cave."
      *   *Avoid:* "Teachers were puppeteers."
      *   *Use:* "Teachers gave us the strength to turn, even when it hurt." (Aligns with "turning the soul" without claiming the school *is* the perfect education).
      *   *Address the Death Threat:* Soften this. It's not literal death, but the risk of being misunderstood or ignored when challenging status quos.

  6.  **Drafting - Section by Section:**
      *   *Intro:* Start with the feeling of finishing. Introduce the idea of "seeing."
      *   *Body 1 (The Cave/Grades):* Admit the game we played. Grades are shadows. We won the contest of predicting them. But there's more.
      *   *Body 2 (The Pain/Ascent):* The future is bright and painful. Uncertainty. Don't promise ease.
      *   *Body 3 (The Return/Duty):* The Socratic twist. We don't stay in the light. We go back to work. We owe it to others.
      *   *Conclusion:* Accept the risk. Walk out together.

  7.  **Review against Constraints:**
      *   *Insulting?* No, if framed as a shared human condition.
      *   *Arrogant?* No, emphasizes shared struggle.
      *   *School Critique?* Acknowledged gently (grades vs. truth).
      *   *Supervisor Happy?* Will recognize the "compulsory descent" and "turning the soul" nuances.
      *   *Parents Happy?* Will understand the message of service and courage without needing the Plato context.
      *   *Word Count?* Aiming for ~700.

  8.  **Final Polish:** Check rhythm and tone. Ensure the "compulsory" aspect lands as duty, not burden. Make sure the "death" reference is subtle enough for parents but clear for philosophers. (Socrates died for this; we might just get cancelled or ignored, but the principle stands).

  *(Self-Correction during drafting)*: I need to be careful not to make the school sound *bad*. The prompt says the speaker knows Socrates critiques schools like theirs. I should acknowledge that tension. "We mastered the shadows" is a good way to put it—we succeeded at the game, but now we leave the game.

  Let's write.

  *Word Count Check:*
  A typical speaking pace is 130-140 words per minute. 5 minutes = 650-700 words. I will aim for that range.

  *Key Phrases to Include/Adapt:*
  - "Turning the whole soul" (periagoge).
  - "Compulsory descent."
  - "Pain of the light."
  - "Honors for predicting shadows."

  *Key Avoidance:*
  - "I saw the sun."
  - "You were blind."

  *Revised Plan:*
  Frame the "Cave" not as the school, but as the comfort of certainty. The graduation is the turn. The future is the ascent. The duty is the return.

