answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** Moral Particularism vs. Moral Generalism
  **Parties:** Roommate A (Generalist Leanings) / Roommate B (Particularist Leanings)
  **Date:** [Today's Date]

  ## I. AGREED CLAIMS (COMMON GROUND)
  *The following propositions are accepted by both parties as the baseline for this debate. Disagreements below must not contradict these points.*

  1.  **Feature-Responsiveness:** Moral judgments are not arbitrary; they are responsive to non-moral features of situations (e.g., pain caused, promises made, intentions held).
  2.  **Intelligibility of Reasons:** To offer a moral reason is to offer something that *could* be understood by another rational agent. Private intuition alone does not count as public reasoning.
  3.  **Consistency as a Default:** Treating relevantly similar cases differently requires an explanation. (Disagreement exists on whether the explanation must be a *principle* or a *contextual distinction*).
  4.  **The Possibility of Error:** Moral agents can be wrong about what they should do, even if they feel confident.
  5.  **The Role of Principles in Pedagogy:** General rules (e.g., "Do not lie") are useful for teaching morality to learners, even if they are not the ultimate metaphysical ground of rightness.
  6.  **Salience is Real:** Some features of a situation "stand out" as morally important to a competent agent. (Disagreement exists on whether this salience is derived from a rule or is perceptual).

  ***

  ## II. DISAGREEMENTS MATRIX (THE CRUXES)
  *This table isolates the specific points of divergence. Each row contains the core disagreement, phrased in the preferred terminology of each side, followed by a shared test case and the specific stakes.*

  | Crux Topic | Generalist Formulation (Roommate A) | Particularist Formulation (Roommate B) | Shared Hypothetical / Argument | Stakes & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Context-Dependence** | **The Noise Thesis:** Contextual factors are variables that interfere with stable principles. A principle holds *ceteris paribus* (all else being equal). When context changes the outcome, it is because a *new* principle has overridden the old one. | **The Constitutive Thesis:** Context does not just interfere; it determines the moral valence of features. A feature (e.g., "lying") can be a reason *for* an action in one context and *against* it in another without a higher rule resolving the conflict. | **The "Surprise Party" Case:**<br>Lying to a friend about their whereabouts to set up a surprise party.<br><br>*Question:* Is the lie wrong but overridden, or not wrong at all in this context? | **Generalist Prediction:** The act falls under a principle of "Beneficence" which trumps "Veracity." The lie remains a *prima facie* negative that is outweighed.<br>**Particularist Prediction:** In this context, the utterance is not a "lie" in the moral sense; the feature of "deception" does not count as a negative reason here at all. |
  | **2. Shadowed-Virtue (Bias Cancellation)** | **The Tracking Requirement:** For an act to be fully right, it must track a correct moral principle. If an agent acts rightly only because two biases canceled out, they failed to track the truth-maker of the action. | **The Configuration Requirement:** Rightness is a property of the act-in-context, not just the agent's reasoning. The "bias cancellation" case proves that no single feature (like "duty" or "desire") reliably tracks rightness across cases. | **The "Canceling Biases" Case:**<br>Agent donates to charity. <br>Bias A: Wants social praise.<br>Bias B: Wants to hurt a rival who runs the charity by making them look dependent.<br>Result: Donation happens (the right act).<br><br>*Question:* Does this case disprove the existence of stable right-making features? | **Generalist Prediction:** The act is objectively right (conforms to "Relieve Suffering"), but the agent is not virtuous. The principle still exists; the agent just didn't grasp it. The "right-making feature" (relief of suffering) was present, even if the agent didn't see it.<br>**Particularist Prediction:** This shows there is no single "right-making feature" the agent *could* have tracked. The rightness emerged from the complex configuration of outcomes, not a single salient feature like "charity." |
  | **3. Salience Weights** | **The Hidden Generality:** When a Particularist says a feature is "salient" or "weighted," they are secretly appealing to an unstated principle (e.g., "Pain usually outweighs inconvenience"). If you can teach it, it's a rule. | **The Perceptual Capacity:** Salience is a skill of moral perception, akin to recognizing a face or a tone of voice. It is not a propositional rule. Reducing it to a rule loses the nuance of the judgment. | **The "Sarcastic Compliment" Case:**<br>Recognizing that "Nice shirt" is an insult based on tone and relationship history.<br><br>*Question:* Is this recognition rule-based or perceptual? | **Generalist Prediction:** We can eventually write down the conditions (tone + context + history) that make it an insult. If we can't yet, it's just a complex rule, not a different *kind* of knowing.<br>**Particularist Prediction:** Any rule we write will have exceptions requiring further rules. The recognition is immediate and holistic; codifying it destroys the phenomenon. |

  ***

  ## III. OPERATIONAL DEFINITIONS FOR FUTURE DISCUSSION
  *To prevent talking past each other, the following terms will be used strictly as defined below for the duration of this collaboration.*

  *   **"Principle":** A proposition that states a feature is *always* a reason for/against an action (Generalist) OR a proposition that states a feature is *usually* a reason but admits holism (Particularist). *Note: We agree to debate whether exceptionless principles exist.*
  *   **"Salience":** The phenomenological experience of a feature demanding attention. *Agreement:* Both sides agree this happens. *Disagreement:* Whether it implies a hidden rule.
  *   **"Right-Making Feature":** A property of an action that contributes to its moral status. *Generalist:* These are stable (e.g., Pain is always bad). *Particularist:* These are holistically determined (e.g., Pain can be good in punishment).
  *   **"Shadowed-Virtue":** Specifically refers to cases where the correct action is produced by a causal chain that does not include a correct grasp of moral reasons.

  ## IV. NEXT STEPS
  1.  Review the "Shadowed-Virtue" row. If the Generalist feels the "Tracking Requirement" misrepresents their view, revise to: "The agent failed to align with the principle, even if the act matched it."
  2.  Test the "Sarcastic Compliment" analogy. If the Generalist believes moral reasoning is *more* codifiable than language use, state that explicitly.
  3.  No new terminology introduced without entry in Section III.
