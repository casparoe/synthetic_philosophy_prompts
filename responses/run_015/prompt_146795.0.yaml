          *   Specify limitations (what the procedure *cannot* determine).
          *   **Crucial:** Take a definite stance on whether Marx's framework can be operationalized this way without distorting its critical intent. Defend the stance. No neutral menus.

  2.  **Deconstruct the Theoretical Basis (Marx on Machinery):**
      *   *Substitution:* Machine does what human did (formal subsumption).
      *   *Real Subsumption:* Machine changes *how* work is done, dictating pace and method (factory system).
      *   *Mental/Manual Split:* Knowledge embedded in the machine, worker becomes an appendage (deskilling).
      *   *Surplus Value:* Machinery is constant capital; it transfers value but creates no new value. Labor is the source of value. Automation increases productivity but can lower the rate of profit if not managed (tendency of the rate of profit to fall), but for co-ops, the focus is on *worker power* and *alienation*, not just profit.
      *   *Co-op Context:* The goal isn't surplus value extraction for a capitalist, but the reproduction of the cooperative and the well-being/autonomy of the worker-members. However, they still operate in a capitalist market.

  3.  **Develop the Stance (The "Committed Answer"):**
      *   *Question:* Can Marx's critical framework be operationalized without distortion?
      *   *Stance:* Yes, but *only* if the metric shifts from "efficiency/profit" to "worker sovereignty and deskilling." Standard operationalization distorts Marx by turning critique into management tool. To avoid distortion, the audit must be *adversarial* to the technology's inherent logic, not a box-ticking exercise for approval. It must prioritize the *political composition of the workforce* over balance sheet efficiency.
      *   *Defense:* Marx's critique is structural. If we ignore the structural shift in power (mental vs. manual), we betray the co-op mission. Therefore, the tool must be designed to *block* technologies that undermine worker control, even at economic cost.

  4.  **Drafting the Audit Procedure (The "Co-op Machinery Audit"):**
      *   Need to be concise (30 mins).
      *   Need clear steps.
      *   Need "Judgment Call" markers.
      *   Need to address the three hard cases.

      *   *Step 1: Labor Content & Pace.* (Substitution vs. Intensification).
      *   *Step 2: Knowledge & Control.* (Mental/Manual split).
      *   *Step 3: Necessity vs. Coercion.* (Market pressure vs. Democratic will).

  5.  **Applying to Hypotheticals:**
      *   *Case 1: Welding Robots.* Assists physically (good) but algorithmically paces (bad/real subsumption). *Verdict:* Conditional Reject/Redesign.
      *   *Case 2: AI Scheduling.* Optimizes allocation (efficiency) but removes autonomy (mental/manual split + surveillance). *Verdict:* Reject.
      *   *Case 3: Additive Manufacturing.* Dissolves skilled craft (deskilling) but economically necessary (survival). *Verdict:* Accept (The "Resist" recommendation). *Reasoning:* Survival is a prerequisite for sovereignty. If the co-op goes bankrupt, worker control is zero. This is the tragic contradiction of co-ops in a capitalist market.

  6.  **Refining the "Resist" Recommendation (Case 3):**
      *   Why will the user resist? Because it admits that economic survival trumps craft preservation in the final instance, which feels like capitulating to capitalist logic.
      *   Why is it the correct Marxian analysis? Because reproduction of the cooperative entity is the material base for any future struggle. Marx acknowledges the necessity of accumulation for survival, even while critiquing the alienation it causes. The audit must recognize *coercive laws of competition*.

  7.  **Addressing Limitations:**
      *   Cannot predict long-run competitive dynamics.
      *   Cannot validate the democratic legitimacy of the vote (procedural vs. substantive).
      *   Cannot quantify "alienation."

  8.  **Review against Constraints:**
