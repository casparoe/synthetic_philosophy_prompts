answer: |-
  1. Your intuition is correct that treating indicatives as simple material conditionals fails to capture their actual usage and truth conditions in natural language. Most contemporary semanticists reject the pure material conditional account because it cannot explain why we assert conditionals based on connections rather than just truth values.

  2. Both indicative and counterfactual conditionals are often analyzed using possible worlds semantics, but they differ in which worlds are selected for evaluation. Counterfactuals look at worlds most similar to ours where the antecedent is true, while indicatives look at epistemically possible worlds compatible with what is known.

  3. On a dry day, the indicative conditional feels wrong as automatically true because truth depends on epistemic alternatives, not actuality. You assess the connection between rain and wet streets across those epistemically open possibilities rather than accepting material truth based on the weather.

  4. The crucial distinction lies in which facts are held fixed when evaluating the antecedent. Counterfactuals allow you to backtrack and change past facts like yesterday's weather, whereas indicatives typically hold known past facts fixed while testing the hypothesis.

  5. Ultimately, the real difference lives in the modal base rather than the logical operator itself. Indicatives quantify over worlds compatible with current knowledge, while counterfactuals quantify over worlds compatible with the laws of nature and similar history despite the false antecedent.
