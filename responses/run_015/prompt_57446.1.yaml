answer: |-
  Here is your prep sheet. The order mirrors the likely flow of the Q&A: metaphysicians will jump first to test the ontology, followed by ethicists testing the structure, then the policy/econ folks testing the implications.

  ### 1. The Necessitist Attack (Step 2)
  **Who:** The modal metaphysicians.
  **Phrasing:** "You claim possible people lack a subject for custody. But if necessitism is true, possible people exist as non-concrete objects. They have properties. Why can't the custody relation latch onto a non-concrete particular? You seem to be smuggling in contingentism as a premise."
  **Damage:** **Sounds devastating, actually manageable.** It sounds like it destroys Step 2. Actually, it fails because custody implies causal capacity.
  **Reply:** "Even if possible people exist as abstracta, custody requires the capacity to causally affect a subject's welfare state. You cannot causally interact with a non-concrete object. The ontology of the subject matters less than the metaphysics of the *relation*."
  **Soft Spot:** You are asserting a causal requirement for custody without having argued for it in the paper. If they press that moral relations needn't be causal, you're stuck.

  ### 2. The "Brute Relation" Objection (Step 1)
  **Who:** Meta-ethicists and metaphysicians.
  **Phrasing:** "Why *custody*? Why not species membership, or spatial proximity, or causal impact? You've posited a normative relation that does all the work but offered no genealogy for why this specific relation generates reasons."
  **Damage:** **High.** This attacks the foundation of your machinery.
  **Reply:** "It's not brute; it tracks the phenomenology of moral agency. We recognize reasons to aid when we are 'in charge,' not merely when value is present. Custody captures the agent-relative structure of obligation that impersonal value misses."
  **Soft Spot:** Phenomenology isn't metaphysics. If they demand a reductive account of *why* custody generates reasons, you don't have one.

  ### 3. The Person-Affecting Collapse (Structure)
  **Who:** Population ethicists.
  **Phrasing:** "You say you avoid person-affecting restrictions, but your output is identical. No reason to create happy people = no benefit to creating them. What's the actual structural difference between your view and the Narrow Person-Affecting View?"
  **Damage:** **Medium.** Threatens your claim to novelty.
  **Reply:** "The PAV says the outcome isn't *better*. I say the outcome *is* better (impersonally), but the agent lacks a *reason* to produce it. I preserve impersonal value while blocking the reason; PAV blocks the value."
  **Soft Spot:** If the practical upshot is identical, they may dismiss the structural distinction as scholastic.

  ### 4. The Benatar Collapse (Structure)
  **Who:** Population ethicists / Generalists.
  **Phrasing:** "If misery generates a decisive reason against procreation, but happiness generates no reason for it, aren't you just rehearsing Benatar's asymmetry? Does this permit procreation at all, or just make it less forbidden?"
  **Damage:** **Low.** This is the easier collapse to avoid.
  **Reply:** "Benatar argues existence is always a harm. I argue existence is permissible *if* the custody conditions can be discharged. I allow for happy lives; I just deny a duty to create them."
  **Soft Spot:** If your bar for 'discharging custody' is set too high, the view becomes Benatarian in practice, even if not in theory.

  ### 5. The Impersonal Value Contradiction (Step 2)
  **Who:** Consequentialists in the room.
  **Phrasing:** "You grant happy lives are impersonally good. If I can create one at zero cost to myself, and the world is better, why isn't there a reason? You're severing value from reasons without a bridge."
  **Damage:** **Medium.** Challenges the coherence of Step 2.
  **Reply:** "Value is a property of states of affairs; reasons are properties of agents. The bridge is the custody relation. Without it, the value remains 'nobody's business' in the literal sense."
  **Soft Spot:** To many, 'impersonal good' just *means* 'gives everyone a reason.' You are stipulating a definition they may reject.

  ### 6. The Climate Discounting Objection (Step 2 & 3)
  **Who:** The Health Economist.
  **Phrasing:** "If I don't owe happiness to future people, do I owe them safety? If my carbon emissions make their lives miserable, but they wouldn't exist without the industry that caused it, have I violated custody? Or have you licensed discounting future welfare?"
  **Damage:** **High.** This is the political liability.
  **Reply:** "Custody triggers at conception. If your policy ensures that *whoever* is conceived will face unrelievable suffering, you are violating the duty not to enter a custody relation you cannot discharge."
  **Soft Spot:** This bumps into the Non-Identity Problem. If the suffering isn't 'unrelievable' but just 'worse,' your view might imply no violation, which the economist will hate.

  ### 7. The Adoption/Second-Best Objection (Step 3)
  **Who:** Reproductive Policy scholar.
  **Phrasing:** "If procreation is entering custody, and there are existing children without custodians, isn't procreation morally second-best? Does your view imply a duty to adopt before breeding?"
  **Damage:** **Medium.** You want to avoid this political fight.
  **Reply:** "Custody is agent-relative, not a general pool. You are not the custodian of existing orphans unless you enter that relation. Procreation is permissible provided you can discharge the specific duties to *that* child."
  **Soft Spot:** It sounds selfish. If they press on "general duties to children," you have to bite the bullet that there are no general duties, only relational ones.

  ### 8. The Ex-Post Failure Objection (Step 3)
  **Who:** General ethicists.
  **Phrasing:** "You say you can't enter a relation you *know* you can't discharge. What if you reasonably expect to discharge it, but then lose your job or health? Does the child's existence become impermissible retroactively?"
  **Damage:** **Low.** Standard parental obligation territory.
  **Reply:** "The duty is ex-ante risk assessment. Ex-post failure generates duties of mitigation, not a verdict that the procreation was wrong. The asymmetry concerns the *decision* to create, not the luck of the life."
  **Soft Spot:** Doesn't fully explain why the *reason against* creating suffering is decisive while the *reason for* creating happiness is null, if both depend on luck.

  ### 9. The "Prayer" Question (Non-Identity within Custody)
  **Who:** The smartest person in the room (waiting until the end).
  **Phrasing:** "If I can create Child A (happy) or Child B (very happy), and I choose A, have I violated custody toward B? B is a possible person. If custody doesn't latch onto possible people, why does it matter which possible person I actualize? You seem to lose the ability to criticize selection decisions."
  **Damage:** **Critical.** This exploits the gap between Step 1 and Step 3.
  **Reply:** *See "The Single Reply" below.*

  ---

  ### Strategic Concessions
  **Concede up front:** In your closing remarks of the main talk, concede that extensionally, your view often aligns with the Person-Affecting View. Say: *"I know this looks like the Person-Affecting View in practice. My claim is that the grounding is different, and that grounding matters for how we handle impersonal value."*
  **Why:** This disarms Objection 3. It makes you look confident rather than defensive, and it signals to the metaphysicians that you care about the *structure*, not just the output.

  ### The Single Reply That Must Land
  For the paper to survive, you must successfully defend the **Value/Reasons Distinction** (Objection 5).
  **The Line:** *"We must distinguish between what makes a world better and what makes an act rational. My view claims that impersonal value makes the world better, but only relational custody makes the act rational for the agent. If you collapse these, you cannot solve the asymmetry without denying the good of happy lives."*
  **Why:** If this fails, you are just a confused consequentialist or a covert PAV theorist. If it lands, you have carved out a unique niche.

  ### The Question You're Praying Nobody Asks
  **"Is the Custody Condition itself a moral truth or a metaphysical one?"**
  **Why it's deadly:**
  *   If it's **moral**, it needs justification (see Objection 2). Why is *this* the magic relation?
  *   If it's **metaphysical**, it sounds like you're deriving an 'ought' from an 'is' (the existence of a relation).
  *   **If asked:** Do not choose. Say: *"It's a normative truth about the structure of agency, grounded in the metaphysics of relations. It's not that the relation *forces* the reason, but that reasons of beneficence are *constituted* by such relations."* (Then pray they don't ask what "constituted" means).

  ### Note on the Necessitist Objection (Your specific worry)
  **How bad is it?** It is **less bad than it sounds**.
  **Why:** Even if a necessitist grants that possible people exist as abstract objects, they rarely grant that abstract objects have *welfare* that can be *affected*. Welfare usually requires consciousness or a capacity for experience. Non-concrete particulars don't have experiences.
  **Strategy:** Don't fight the ontology (existence of possible people). Fight the **predication** (welfare of possible people). If they say "Possible person P has the property of being happy," ask: "Is that a static property like 'being prime', or a welfare state that can be improved by me?" If it's static, custody is impossible. If it's dynamic, they have to explain how I causally affect an abstractum. That's their problem, not yours.
