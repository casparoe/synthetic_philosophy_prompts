          *   *Soft Spot:* Non-identity problem looms here.

      *   *Objection 3: The Adoption/Second-Best Attack (Repro Policy).* If procreation is entering custody, and there are existing children needing custody, is procreation selfish?
          *   *Phrasing:* Policy/Social work tone. "Existing backlog," "moral obligation."
