          *   *Damage:* High. Attacks Step 1's foundation.
          *   *Reply:* It tracks the phenomenology of moral agency. We don't feel responsible for distant stars' welfare.
          *   *Soft Spot:* Phenomenology isn't metaphysics.

      *   *Objection 7: The "Exit" Condition.* You say you can't enter a relation you can't discharge. What if you *lose* the capacity later? (Accident, poverty).
