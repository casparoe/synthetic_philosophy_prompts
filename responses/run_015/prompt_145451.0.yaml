      *   Gap: The user allows for *some* acts to be non-duty (Vanity), whereas hard utilitarianism makes them duty. But the user calls them "vanity," stripping moral worth. So functionally, it's similar to utilitarianism regarding *obligation*, but different regarding *praise*.

