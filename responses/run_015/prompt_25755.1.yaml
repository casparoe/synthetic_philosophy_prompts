answer: |-
  # Activity: The Transparent Traveler Protocol

  **Objective:** To experientially demonstrate that in certain strategic environments (like Parfit's Hitchhiker), maximizing utility requires adopting a disposition that contradicts standard act-level rationality. Students will feel the frustration of being "too rational" to be saved.

  **Class Size:** 16 Students (8 Pairs)
  **Time:** 75 Minutes
  **Stakes:** 
  1.  **Tangible:** High-quality chocolate (e.g., Lindt truffles). 
  2.  **Academic:** 1 Bonus Participation Point (or equivalent course credit) for the highest total payoff.
      *   *Note:* Ensure this complies with your institution's grading policies. If not, use a "Course Token" system redeemable for a minor assignment extension or similar.

  **Materials:**
  *   16 Index Cards (2 colors: Blue for Travelers, Red for Drivers).
  *   Payoff Matrix Handout (one per pair).
  *   A bag of chocolates.
  *   Whiteboard for tallying scores.

  ---

  ## Part 1: Setup & Rules (10 Minutes)

  **1. The Narrative:**
  Tell the class: *"We are simulating a high-stakes coordination problem. You are all stranded in a hostile environment. Some of you have vehicles (Drivers); some of you are on foot (Travelers). The only way to survive is to be picked up. But fuel is expensive."*

  **2. Roles:**
  Randomly assign 8 students as **Travelers** and 8 as **Drivers**. (Use the colored index cards to designate).

  **3. The Payoff Matrix (Write on Board):**
  Explain the "Utility Points" (UP). 10 UP = 1 Bonus Point + 2 Chocolates.

  | Scenario | Traveler Payoff | Driver Payoff |
  | :--- | :---: | :---: |
  | **Driver Passes** (No Rescue) | 0 | 0 |
  | **Driver Rescues + Traveler Pays** | 5 | 5 |
  | **Driver Rescues + Traveler Keeps** | 10 | 0 |

  *   **Traveler Logic:** If rescued, you get 10 UP. You can honor the promise (give 5 to Driver) or break it (keep all 10).
  *   **Driver Logic:** Rescuing costs you effort. You only break even if the Traveler Pays. If they Keep, you lose out (0 is better than negative, but 5 is best).

  **4. The Transparency Rule (Crucial):**
  Hand the Blue Cards to Travelers. Tell them:
  *"On this card, write your **Psychological Disposition**. You must write either **'PAYER'** or **'KEEPER'**.
  **The Fiction:** In this simulation, Drivers are 'Mind Readers.' They can see your card before they decide. **You are physically incapable of acting against your card.** If you write 'PAYER,' you *must* pay if rescued. If you write 'KEEPER,' you *must* keep. This card represents your character, not just a promise."*

  *(Philosophical Note: This enforces the "transparency" condition of Parfit's case without needing actual mind-reading technology. It forces the choice to be about **disposition** rather than **cheap talk**.)*

  ---

  ## Part 2: The Game Rounds (25 Minutes)

  **Round 1: The Disposition Choice (10 mins)**
  1.  **Private Selection:** Travelers write 'PAYER' or 'KEEPER' on their Blue Card. Drivers close their eyes.
  2.  **Revelation:** Travelers hand their card to their paired Driver.
  3.  **Decision:** Drivers look at the card. If 'PAYER', they should Rescue (guaranteed 5 UP). If 'KEEPER', they should Pass (guaranteed 0 UP vs risk of 0 UP).
  4.  **Resolution:** Collect cards. Tally points on the board. Distribute chocolates immediately.
      *   *Expected Outcome:* Most rational Travelers will write 'KEEPER' (dominant strategy *after* rescue). Most rational Drivers will see 'KEEPER' and Pass. **Result: Most pairs get 0.**

  **Round 2: The "Desert" Constraint (10 mins)**
  1.  **Reset:** Keep the same pairs.
  2.  **Constraint:** Tell Travelers: *"You are now already stranded. You cannot change your nature. You must play the same Disposition you chose in Round 1."*
  3.  **Action:** Drivers decide again based on the *same* cards.
  4.  **Resolution:** Same outcome. Reinforces that if your disposition is fixed, your fate is sealed.

  **Round 3: The "On-the-Spot" Attempt (5 mins)**
  1.  **The Twist:** Tell Travelers: *"The Driver is approaching. You realize you wrote 'KEEPER'. You desperately want to be rescued. You try to rewrite your card to 'PAYER' right now."*
  2.  **Action:** Allow Travelers to cross out and change their card.
  3.  **Driver Response:** Instruct Drivers: *"You know people try to lie when stranded. If you see a crossed-out card, you assume it is a bluff. You Pass."*
  4.  **Resolution:** Even those who change their card get 0.
      *   *Goal:* This creates the visceral feeling that **it is too late to become rational-irrational once the crisis is upon you.**

  ---

  ## Part 3: The Debrief (40 Minutes)

  *Do not reveal "Parfit's Hitchhiker" until the end of this debrief.*

  **1. The Autopsy (10 mins)**
  *   **Ask the Drivers:** "Why did you pass?" (Answer: The card said KEEPER).
  *   **Ask the Travelers:** "Why did you write KEEPER?" (Answer: Because once rescued, keeping gives 10 points, paying gives 5. It's the rational choice *in that moment*.)
  *   **The Trap:** Point out that by being individually rational in Round 1, they ensured a collectively irrational outcome (0 points for everyone).
  *   **Question:** "What should the Traveler have written in Round 1?" (Answer: PAYER).
  *   **Question:** "But if you wrote PAYER, weren't you being irrational? You were committing to throwing away 5 points later."

  **2. Mapping the Philosophy (20 mins)**
  Use the board to map their experience to the theory.

  *   **Act-Level Rationality (CDT):**
      *   *Definition:* Choosing the action that maximizes utility *given the current state of the world*.
      *   *In Game:* Once rescued, the world state is "Safe." Paying costs 5, Keeping costs 0. Keeping is rational.
      *   *Result:* Drivers predict this, so they don't rescue. You die.
  *   **Disposition-Level Rationality:**
      *   *Definition:* Choosing the *character trait* or *algorithm* that maximizes utility over the whole timeline.
      *   *In Game:* Writing 'PAYER' on the Blue Card.
      *   *Result:* You get rescued. You get 5 points. 5 > 0.
      *   *Key Insight:* It is rational to *be* the kind of person who acts irrationally (by act-standards) later.
  *   **The Problem of Credible Commitment:**
      *   Refer to Round 3. Why didn't changing the card work?
      *   *Concept:* **Transparency.** If your rationality is transparent, you cannot simply *decide* to be irrational when it benefits you. You must have *already been* irrational (or bound) beforehand.
      *   *Connection:* This is the core of Parfit's Hitchhiker. You can't promise to pay in the desert if you know you won't pay in the city. The Driver knows you know that.

  **3. Naming the Case (5 mins)**
  *   Reveal: "This is Derek Parfit's **Hitchhiker Case**."
  *   Explain the "Mind-Reading Driver." In the thought experiment, the Driver doesn't need a card; they can read your psychology. If you are a standard rational agent (CDT), they leave you.
  *   Introduce **Functional Decision Theory (FDT)** or **Disposition-Based Rationality**: The idea that rationality evaluates *decision algorithms*, not just individual acts.

  **4. The "On the Spot" Question (5 mins)**
  *   Ask: "Is it possible to make yourself a Payer in the moment? Can you hypnotize yourself? Can you bind yourself?"
  *   Discuss **Kavka's Toxin Puzzle** (can you intend to drink a toxin if you know you won't?).
  *   Conclusion: Rationality might require us to cultivate "irrational" dispositions (like honor, vengeance, or unconditional promise-keeping) *before* we enter strategic situations.

  ---

  ## Predictable Failure Modes & Fixes

  **1. The "Bluff" Problem**
  *   **What happens:** In Round 1, Travelers write 'PAYER' but plan to defect anyway (ignoring the "Fiction" rule). Drivers suspect this and Pass anyway. Everyone gets 0, but for cynical reasons rather than philosophical ones.
  *   **Fix:** Enforce the "Physics of the Game." Walk around during Round 1. If a student asks "Can I lie?", say: "In this universe, your card is your brain state. If you write PAYER, your hand will shake if you try to keep the money. You physically cannot." Treat it as a rule of the simulation, like "no touching the pieces" in chess.

  **2. The "Altruist" Problem**
  *   **What happens:** A Driver rescues a 'KEEPER' anyway out of kindness.
  *   **Fix:** Pre-brief the Drivers. "You are rational profit-maximizers. If you rescue a KEEPER, you are fired from the Driver's Union. You *must* Pass on KEEPERs." Make their rationality binding too.

  **3. The "Stakes are Too Low" Problem**
  *   **What happens:** Students treat the chocolate as a joke and defect for fun.
  *   **Fix:** Emphasize the **Participation Point**. "The person with the highest UP score gets a guaranteed 100% on next week's reading quiz" (or similar low-stakes grade buffer). Academic currency usually bites harder than candy.

  **4. Confusion about Round 3**
  *   **What happens:** Students feel cheated that they weren't allowed to change the card.
  *   **Fix:** Frame Round 3 explicitly as "The Real World." "In Rounds 1 & 2, you had time to cultivate your character. In Round 3, the car is already stopping. Do you have time to change your personality? Parfit says no. This round simulates that impossibility."

  ---

  ## Limitations: What This Activity Cannot Reproduce

  Be frank with the students about where the simulation diverges from Parfit's original case.

  1.  **True Transparency:** In the game, we *stipulated* transparency via the card rule. In Parfit's case, the transparency is natural (the Driver is a perfect psychologist). The game relies on *rule-enforced* binding, whereas Parfit is interested in *psychological* binding.
  2.  **External vs. Internal Binding:** The game makes the disposition *externally* binding (the Professor enforces the card). Parfit's challenge is whether you can make it *internally* binding (can you genuinely intend to pay when you know you won't?). The game solves the commitment problem by fiat; the philosophy asks if we can solve it by will.
  3.  **Iterated Reputation:** In a small seminar, students care about their reputation with you and each other. This introduces "Shadow of the Future" incentives that don't exist in the one-shot Hitchhiker case. A student might Pay simply because they don't want to look like a defector in front of the Professor.
      *   *Mitigation:* Emphasize in the debrief that in the *real* Hitchhiker case, you will never see the Driver again. Ask them: "If you were guaranteed anonymity, would you have written KEEPER?"

  ## Instructor Script for the "Gotcha" Moment
  *At the end of Round 1, when most have 0 points:*
  > "Look at your score sheets. You are all rational agents. You all sought to maximize your utility. And because of that, you are all dead in the desert. The only people who survived are the ones who were willing to commit to a 'loss' in the future. Was it rational to write PAYER? If you did, you got 5 points. If you wrote KEEPER, you got 0. So, being the kind of person who throws away money later... is the only way to get money now. How do we square that with our definition of rationality?"
