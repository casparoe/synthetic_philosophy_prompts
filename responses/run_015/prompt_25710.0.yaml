answer: |-
  You might begin by pressing the speaker on the flicker-of-freedom strategy, specifically regarding the robustness of the remaining alternative possibilities. You could ask whether the flicker that remains in Frankfurt cases, such as the possibility of starting to choose otherwise before the intervener acts, is robust enough to ground moral responsibility in the way incompatibilists require. The speaker will likely reply that the flicker is too fleeting or insignificant to serve as the basis for responsibility, arguing that what matters is the actual sequence of events where the agent acts on their own. Your follow-up should then challenge whether dismissing the flicker as non-robust concedes that alternative possibilities are irrelevant entirely, effectively collapsing the Frankfurt argument into a pure actual sequencism that bypasses the original debate about PAP rather than resolving it.

  Following on the issue of flickers, you should ask whether it is possible to construct a Frankfurt case that eliminates even the slightest flicker, perhaps by using a neural monitoring device that detects inevitability rather than a prior sign. The anticipated response is that such neural inevitability cases do successfully remove all alternative possibilities, securing the falsity of PAP. You should then push back by asking whether introducing neural inevitability smuggles in determinism by assumption, thereby begging the question against the incompatibilist who denies that responsibility is compatible with deterministic causation.

  Moving to the dilemma pressed by Kane and Widerker, you could ask the speaker to clarify whether the prior sign that triggers the counterfactual intervener is causally sufficient for the action. They will almost certainly deny causal sufficiency to avoid presupposing determinism, insisting the sign is merely a reliable indicator. Your follow-up must then ask why, if the sign is not causally sufficient, the agent could not have done otherwise despite the sign, forcing the intervener to step in, which would mean the agent retained the ability to do otherwise after all.

  Continuing with the Widerker dilemma, you might ask whether the defender of Frankfurt cases can avoid the dilemma by employing a buffer strategy, where the trigger is neither causally sufficient nor indicative of inevitable action in a deterministic sense. The speaker may argue that such buffers allow the case to proceed without metaphysical baggage. You should then press whether relying on such exotic metaphysical structures makes the cases too intuitive distant to carry the weight of disproving a principle as fundamental as PAP, asking if the cost to intuition outweighs the theoretical gain.

  On the topic of dialectical payoff, you should ask whether falsifying PAP actually advances the compatibilist cause, or if PAP might be false for reasons neutral between compatibilism and incompatibilism. The standard reply is that removing PAP clears the main obstacle for compatibilism, allowing responsibility to exist under determinism. Your follow-up should challenge this by asking whether the sourcehood objection remains intact, such that even if PAP is false, the incompatibilist can still argue that determinism undermines the ultimate sourcehood required for responsibility.

  To deepen the issue of payoff, you could ask whether the Frankfurt argument provides a positive account of responsibility or merely a negative one that eliminates a necessary condition. The speaker will likely say it clears the ground for positive accounts like reasons-responsiveness. You should then ask whether incompatibilists can accept those positive conditions while still denying they are satisfiable under determinism, implying that the Frankfurt argument shifts the debate rather than settling it.

  Regarding the scope of Frankfurt cases, you should ask whether the logic holds for omissions, such as failing to save a child when a device would have forced you to save them had you wavered. The speaker will probably assert that symmetric cases can be constructed for omissions without loss of force. Your follow-up should question whether the causal structure of omissions makes the intervener's role problematic, since causing an omission differs metaphysically from causing an action, potentially undermining the symmetry.

  You should also ask whether Frankfurt cases are persuasive only for wholehearted, deliberate actions rather than cases of akrasia or conflicted will. The anticipated response is that the mechanism works regardless of the agent's internal psychological state. You should then press whether a conflicted agent makes the detection of the sign harder, and whether intervention in such cases looks more like manipulation than the preservation of agency, thereby weakening the intuition that the agent is responsible.

  Connecting to manipulation arguments, you could ask how the speaker distinguishes the Frankfurt intervener from the manipulators in Mele's zygote argument or Pereboom's four-case argument. They will likely argue that Frankfurt agents have a normal history of development whereas manipulated agents do not. Your follow-up should ask whether introducing historical conditions reintroduces alternative possibilities, such as the possibility of having had a different history, which would undermine the claim that alternative possibilities are irrelevant.

  Finally, you might ask whether the presence of the counterfactual intervener is truly analogous to natural determinism, given that the intervener is an external agent while natural laws are not. The speaker will reply that in the actual sequence, the intervener does nothing, just as laws do not compel action in compatibilist views. You should conclude by asking whether the mere presence of a backup mechanism that bypasses the agent's control in counterfactual scenarios changes our assessment of the actual sequence, suggesting that the threat of bypassing control is itself damaging to responsibility even if never actualized.
