answer: |-
  15%

  **Decomposition**

  1.  **Temporal Position as Property:** 45% — Credence that presentism is true; if the block universe (B-theory) holds, temporal distance is no more relevant than spatial distance.
  2.  **Personal Identity:** 35% — Credence that identity is a "further fact"; if reductionism holds, future selves are morally akin to other people, forbidding pure discount.
  3.  **Spatial/Interpersonal Analogy:** 25% — Credence that time is ethically disanalogous to space; if symmetry holds, discounting time implies unjustly discounting distant strangers.
  4.  **Coherence of Bias:** 30% — Credence that future-bias is logically consistent without past-discounting; if not, the preference is merely a psychological glitch, not a rational principle.

  **Combination:** 15% (The joint probability is constrained by the weakest link; the ethical symmetry of space/time and the reductionist view of identity are the primary drags on rational permissibility.)

  **Fragility Analysis**

  The number is most fragile on the **Spatial/Interpersonal Analogy**. If you can convince me that temporal distance is ethically distinct from spatial distance—not merely phenomenologically, but normatively—the credence jumps from 15% to over 60%. The thought experiment to strike here is **"The Causality Constraint"**: Ask the critic whether they would discount a benefit they *cannot* causally affect. If the critic admits we discount the past because we cannot change it, the trustee can argue we discount the distant future because our causal grip weakens over time (due to uncertainty of intervention, not receipt). If the critic concedes that *causal reach* justifies discounting, the spatial analogy breaks (since we can causally affect distant space via technology), and the trustee's argument survives the reductio.

  **Social Discount Rate**

  The case for a positive pure term in a social discount rate is **weaker** than the trustee's case. An individual experiences time phenomenologically; there is a "now" self that feels distinct from the future self, providing a psychological (if not logical) basis for bias. A government or society is a fiduciary entity with no phenomenological present; it exists simultaneously across all generations it governs. To apply a pure time preference socially is to arbitrarily privilege the welfare of citizens born today over citizens born tomorrow solely based on birth date, which violates the fundamental democratic principle of impartiality across persons. While individuals may be permitted irrational biases regarding their own lives, institutions mandated to maximize public welfare are not.
