answer: |-
  ### Specification of Adequacy Conditions for a First-Personal Decision Rule

  **Preamble on Status:**
  The field of normative decision theory contains no consensus on the correct resolution of the cases anchoring this specification. "Settled" below refers to constraints required for logical coherence or minimal agency. "Contested" refers to verdicts where major schools (Causal, Evidential, Functional/Updateless) diverge. Where a requirement is marked "Contested," it indicates that satisfying it commits the agent to a specific camp's ontology.

  #### I. Adequacy Conditions

  1.  **Executability (The "Ought Implies Can" Constraint)**
      *   **(i) Requirement:** The rule must terminate in finite time and output a specific, physically performable act available to the agent at the moment of choice. It cannot output a disposition, a policy for a future self, or a conditional plan that requires computational resources the agent lacks.
      *   **(ii) Motivation:** A rule that loops indefinitely, requires omniscience, or outputs "be the kind of agent who..." fails as an *ex ante* action guide.
      *   **(iii) Status:** **Non-negotiable.** (Settled across all camps).

  2.  **Reflective Stability (No Regret)**
      *   **(i) Requirement:** Once the agent selects an act based on the rule's output, learning that it has so selected (without learning new external facts) must not generate a preference for the alternative act.
      *   **(ii) Motivation:** The case where "whichever act the agent settles on, it can see that it would have done better to have settled on the other." An unstable rule makes the agent vulnerable to pre-commitment costs or self-manipulation to avoid deliberation.
      *   **(iii) Status:** **Contested.** (CDT agents in Newcomb problems typically fail this; FDT/UDT agents prioritize it).

  3.  **Predictive Sensitivity (Newcomb Adequacy)**
      *   **(i) Requirement:** In scenarios where a predictor's accuracy depends on the agent's decision procedure, the rule must select the act that yields the higher payoff given the predictor's reliability, even if that act is dominated in a state-wise comparison.
      *   **(ii) Motivation:** The standard Newcomb setup. A rule that ignores the correlation between its own output and the predictor's prior simulation leaves value on the table in environments containing models of the agent.
      *   **(iii) Status:** **Contested.** (CDT rejects this requirement in favor of Dominance; EDT and FDT accept it).

  4.  **Causal Isolation (The "News" Constraint)**
      *   **(i) Requirement:** The rule must not recommend avoiding an act solely because it is strong evidence of a bad state that the act does not causally influence.
      *   **(ii) Motivation:** The "Smoking Lesion" case (an act is evidence of a genetic defect causing death, but the act itself is harmless). A rule that fails here makes the agent "pay to avoid news."
      *   **(iii) Status:** **Contested.** (EDT fails this requirement; CDT and FDT satisfy it).

  5.  **Logical Correlation (The "Twin" Constraint)**
      *   **(i) Requirement:** The rule must treat the act of a near-exact copy (or a simulation running the same algorithm) as logically linked to its own act, such that the agent considers the impact of its choice on the copy's choice.
      *   **(ii) Motivation:** Prisoner's Dilemma with a copy. A rule that treats the copy's act as an independent environmental state leads to defection and suboptimal payoff.
      *   **(iii) Status:** **Contested.** (CDT treats the copy's act as independent; FDT treats it as linked; EDT depends on the conditional probability).

  6.  **Diachronic Consistency (Money-Pump Immunity)**
      *   **(i) Requirement:** The rule must not prescribe a sequence of choices that guarantees a net loss compared to an alternative sequence, given the agent's own preferences at the start of the sequence.
      *   **(ii) Motivation:** The demand that a rule not lead its user to be predictably poorer across a long series of choices.
      *   **(iii) Status:** **Non-negotiable.** (Though definitions of "guaranteed loss" vary between camps).

  7.  **Loop Resolution (The Open Loop Constraint)**
      *   **(i) Requirement:** The rule must be able to compute a fixed point in scenarios where the environment's state is a function of the agent's deliberation process in real-time, without requiring the prediction to be screened off from the act.
      *   **(ii) Motivation:** *The Open Loop.* The predictor simulates the agent, the agent sees the simulation, and the simulation updates. Standard causal graphs (DAGs) break here. The rule must handle recursive dependency without paralysis.
      *   **(iii) Status:** **Contested/Novel.** (Most existing rules assume acyclic causal structures. This requirement forces a move toward game-theoretic equilibrium solving or fixed-point logic).

  8.  **Indexical Robustness (The Mixed Population Constraint)**
      *   **(i) Requirement:** The rule's recommendation must not fluctuate wildly based on facts about the agent's own predictability that the agent cannot distinguish from the inside. It must maximize expected utility across the reference class of "agents in this situation" rather than "agents who know they are type X."
      *   **(ii) Motivation:** *The Mixed Population.* If the rule says "One-box if you think you are predictable, Two-box if you think you are random," the agent cannot apply it (since it doesn't know its type). The rule must handle self-uncertainty.
      *   **(iii) Status:** **Contested/Novel.** (This targets the "Reference Class" problem in FDT and the "Self-Sampling" problem in EDT).

  ---

  #### II. Required Distinctions

  A rule satisfying this specification must be able to mark the following distinctions, while collapsing others:

  *   **Must Mark: Act vs. Procedure.**
      The rule must distinguish between the specific physical movement (e.g., "press button A") and the algorithm that produced it. In *The Open Loop* and *Newcomb* cases, the environment reacts to the procedure, not just the act. A rule that collapses these (treating the act as a brute fact independent of its source) will fail Predictive Sensitivity and Loop Resolution.
  *   **Must Mark: Causal vs. Evidential vs. Logical Dependence.**
      The rule must distinguish between: (a) states caused by the act, (b) states correlated with the act due to a common cause, and (c) states correlated with the act due to logical identity (simulation/copy). Collapsing (b) and (c) into (a) leads to failure in *Smoking Lesion*. Collapsing (c) into (b) leads to failure in *PD with Copy*.
  *   **May Collapse: Disposition vs. Act (in output).**
      While the *procedure* matters, the *output* must be an act. The rule may treat "having a disposition to X" as a means to "doing X," but it cannot output "Have a disposition to X" if that disposition does not cash out in the immediate act. The specification is for an action-guiding rule, not a character-building guide.

  ---

  #### III. Inconsistencies and Trade-offs

  **The Inconsistent Subset:**
  You cannot jointly satisfy **Requirement 3 (Predictive Sensitivity/Newcomb)** and the **Principle of Strong Dominance**.
  *   *Strong Dominance:* If Act A yields a better outcome than Act B in every possible state of the world, choose A.
  *   *Conflict:* In Newcomb, Two-Boxing dominates One-Boxing state-wise (if the box is full, 2-box gets more; if empty, 2-box gets more). However, One-Boxing yields higher expected utility given the predictor's reliability.
  *   *Resolution:* To satisfy the user's context (environments with simulators), you must **drop Strong Dominance**.
  *   *Cost:* The agent will violate a principle that feels intuitively obvious in standard causal settings. It will choose an act that is locally dominated in favor of global optimality.

  **The Most Exclusionary Requirement:**
  **Requirement 7 (Loop Resolution).**
  This excludes almost all standard formulations of CDT and EDT, which rely on acyclic causal graphs (Bayesian Networks) where causes precede effects. Satisfying this requires adopting a framework capable of solving recursive fixed points (like certain formulations of FDT or Game Theory), which is computationally heavier and theoretically less developed.

  **The Most "Camp-Driven" Requirement:**
  **Requirement 4 (Causal Isolation/Smoking Lesion).**
  This is the primary wedge between Evidentialists and everyone else. Evidential Decision Theory (EDT) explicitly rejects this requirement, arguing that rational agents *should* avoid acts that are bad news, even if they don't cause the badness. Insisting on this requirement is effectively a veto against pure EDT.

  ---

  #### IV. Analysis of Novel Cases

  **1. The Open Loop**
  *   **Analysis:** This is not merely a Newcomb problem with feedback. It is a **dynamic fixed-point problem**. In standard Newcomb, the prediction is *screened off* (it happened in the past). Here, the prediction is a function of the current deliberation.
  *   **Implication:** This case reveals that **Requirement 3 (Predictive Sensitivity)** is insufficient if the causal structure is cyclic. A rule that only handles "past predictions" will loop infinitely or error out here.
  *   **Contestability:** This case is novel in the decision theory literature. It resembles "Timeless Decision Theory" examples but adds real-time feedback. It is contestable whether a decision *rule* can solve this without becoming a *game-theoretic equilibrium solver*. If the simulation updates on your reaction, you are playing a game against your own simulation. The requirement that the situation be representable as an acyclic causal structure must be **dropped**.

  **2. The Mixed Population**
  *   **Analysis:** This targets the **Reference Class Problem**. FDT agents ask, "What should my algorithm output?" But if the agent doesn't know if it *is* the predictable algorithm or the random one, it cannot define the algorithm's extension.
  *   **Implication:** This suggests **Requirement 8 (Indexical Robustness)** is critical. A rule that requires the agent to know its own source code (or predictability type) fails here.
  *   **Contestability:** This is a disguised version of the "Self-Locating Belief" problem (e.g., Sleeping Beauty). It is contestable whether the rule should output the same act for both types.
      *   *Argument for Same Act:* If the rule outputs different acts, the agent cannot use the rule (since it doesn't know its type).
      *   *Argument for Different Acts:* The optimal act *is* different (One-box if predictable, Two-box if random).
      *   *Verdict:* For an *action-guiding* spec, the rule must output a single recommendation based on available information. This forces the rule to average over the uncertainty, effectively treating the agent as a member of the mixed population.

  ---

  #### V. Scorecard of Candidate Rules

  **Evidential Decision Theory (EDT)**
  *   **Performance:** Fails **Requirement 4 (Causal Isolation)**. In the Smoking Lesion case, it recommends avoiding the act to avoid the "bad news," leading to irrational avoidance of harmless acts.
  *   **Verdict:** Inadequate for the specification. It conflates correlation with control in cases where no logical or causal link exists.

  **Causal Decision Theory (CDT)**
  *   **Performance:** Fails **Requirement 3 (Predictive Sensitivity)** and **Requirement 5 (Logical Correlation)**. In Newcomb and PD with Copy, it recommends the dominated act (Two-Box/Defect) because it treats the predictor/copy as independent states. It also fails **Requirement 7 (Loop Resolution)** as it assumes acyclic graphs.
  *   **Verdict:** Inadequate for the specified context. It is designed for environments *without* predictors or logical twins.

  **Functional/Updateless Decision Theory (FDT/UDT)**
  *   **Performance:** Satisfies **Requirements 3, 5, 7** (in principle). It handles predictors, copies, and logical links by treating the act as the output of a function.
  *   **Weakness:** Struggles with **Requirement 8 (Mixed Population)** due to the Reference Class problem (defining "my algorithm" when self-knowledge is incomplete). Also computationally demanding for **Requirement 7**.
  *   **Verdict:** The strongest candidate for this specification, provided the Reference Class problem can be resolved for the Mixed Population case. It is the only camp that treats the "Procedure" distinction as primary, which the Open Loop case necessitates.
