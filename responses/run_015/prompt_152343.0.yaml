      *Okay, adjustment:* I need to allow for the possibility that she swallowed the lesser evil *without* it invalidating the previous 60 years.
      *Argument:* A sentence can have a concession clause. "Although X, still Y." The last vote was the "Although." The 60 years were the "Still." The meaning is in the "Still."

      *Let's go with the "Punctuation" metaphor.* It's stronger. A period doesn't negate the sentence.

