      *Okay, I will provide a detailed structural outline with key talking points and sample phrasing for the tricky bits, rather than a full word-for-word script, to empower the user to speak authentically. But given the complexity, a near-complete draft with [bracketed instructions] might be more helpful. Let's aim for a hybrid: A robust skeleton with fully written "pivot points" (the hard parts).*
