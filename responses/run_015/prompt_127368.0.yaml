prompt: |-
  I am a novelist, and I need a reusable procedure rather than an explanation.

  The situation: I am two drafts into the third book of a sequence whose narrator alternates between two point-of-view characters. One of them was trained, before the events of the books, in a discipline I have modelled closely on Nāgārjuna's Madhyamaka — the four-cornered negation, emptiness as the absence of intrinsic nature rather than as nonexistence, the two truths, and the practice of arguing by consequences drawn from an interlocutor's own commitments rather than from theses of one's own. In the fiction the school goes by another name, but for our purposes call it Madhyamaka. Across the manuscript there are roughly thirty scenes in which this character is put a direct question by someone else: a question with a yes-or-no shape, or a question asking her to state what she holds. I have to write her answers one at a time, months apart, and I want them to be consistent without being interchangeable, and I want them to be dramatically usable rather than miniature lectures. My readers have no philosophy background; my editor has no patience; the answers should almost never run past forty words.

  What I have in mind is a decision procedure I can run in a few minutes on each of these scenes: the ordered questions to ask about the question she is being asked, what counts as a determinate answer at each step, and where the procedure terminates in one of a small number of permitted speech acts. As inputs it should take only what I can write down about the scene: what is literally asked, what the asker is trying to do (learn something, trap her, force a public commitment, be reassured), and what she has to be able to do next in the plot.

  My working understanding, so you can correct it if it is wrong: for a claim the four corners are affirmation, denial, both, and neither; the point of running through them is not to select a corner or to announce a fifth, but to show that the question has no determinate subject to be settled; and this is compatible with, indeed requires, a robustly conventional answer for ordinary purposes — whether the bridge is guarded, whether she intends to cross it. I am trying to keep three failure modes out of the manuscript: the reader hearing her as a nihilist for whom nothing matters; the reader hearing her as a mystic trading on contradiction for atmosphere; and the reader hearing her as simply evasive, which is the failure my editor is most likely to flag.

  Two complications I want built into the procedure rather than smoothed over. First, the school I have given her adds a permitted move to the four: answering inside the asker's convention while marking the answer as borrowed rather than owned, which in my draft notes I have been calling "the lent answer," and I want the procedure to say when that move is honest and when it is a dodge. Second, she has to go on acting: the procedure must say what happens to agency and to the plot's stakes once a character has refused all four corners, since a scene in which the correct answer is silence and the next beat requires a choice is a scene I still have to write.

  Please give me the procedure, with a worked application to each of three scenes I will describe: a soldier asking her whether the bridge is guarded; a former teacher asking her, in front of students, whether she believes the self survives death; and a hostile magistrate asking her to state, for the record, whether the order she disobeyed was wrong. Then apply the procedure to one further case of your own choosing in which it returns an answer that is dramatically inert or otherwise unusable, and tell me what I should conclude — that the scene is wrongly built, or that the procedure has reached the limit of what it can settle. Finally, a short statement of what the procedure cannot do: which decisions remain matters of craft and judgment no matter how carefully the philosophy is done, and whether the residue is a defect of the framework or a sign that the framework is being asked to do something it never claimed to do.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing Book 3 of a sequence.
      *   **Character:** POV character trained in a fictionalized Madhyamaka (Nāgārjuna's school).
      *   **Problem:** Needs to write ~30 scenes where this character is asked direct yes/no or "what do you hold" questions. Needs consistency without interchangeability. Needs dramatic usability, not lectures.
      *   **Constraints:**
          *   Readers: No philosophy background.
          *   Editor: No patience (answers < 40 words).
          *   Goal: Avoid three failure modes (nihilist, mystic, evasive).
          *   Complications: Include "the lent answer" (conventional truth marked as borrowed) and ensure agency/plot continues after negation.
          *   Output: A reusable decision procedure (ordered questions, determinate answers, termination points).
          *   Examples: Apply to 3 specific scenes (Soldier/Bridge, Teacher/Self, Magistrate/Order) + 1 failure case (inert answer) + analysis of limits.
      *   **Tone:** Professional, precise, actionable, respectful of the philosophy and the craft.

  2.  **Deconstruct the Philosophy (Madhyamaka):**
      *   *Catuṣkoṭi (Four Corners):* Yes, No, Both, Neither.
      *   *Emptiness (Śūnyatā):* Lack of intrinsic nature (svabhāva), not nonexistence.
      *   *Two Truths:* Ultimate (emptiness) vs. Conventional (everyday reality).
      *   *Prasaṅga (Consequences):* Arguing from interlocutor's commitments, not asserting own theses.
      *   *The "Lent Answer":* Speaking conventionally without ontological commitment (upāya/skillful means).
      *   *Agency:* Emptiness enables action; it doesn't paralysis. If nothing has intrinsic nature, change is possible.

  3.  **Drafting the Procedure:**
      *   Needs to be a flowchart or step-by-step algorithm.
      *   Inputs: The Question, The Askers Intent, The Plot Requirement (what she must do next).
      *   Steps:
          1.  Analyze the Question's Ontological Weight (Is it asking about intrinsic nature or conventional function?).
          2.  Check Plot Necessity (Does action require a conventional answer?).
          3.  Select Mode (Lent Answer vs. Negation vs. Redirection).
          4.  Drafting Constraints (Word count, tone).
      *   Outputs: Specific speech act types.

  4.  **Developing the Steps (Iterative Refinement):**
      *   *Step 1: The Stakes Test.* Does answering "yes/no" incorrectly cause immediate physical harm or plot failure? If yes, conventional truth wins (Lent Answer).
      *   *Step 2: The Trap Test.* Is the asker trying to force an ontological commitment (trap)? If yes, negate the presupposition.
      *   *Step 3: The Agency Test.* What must she do *next*? If she must act, she must speak conventionally. If she must disrupt, she speaks ultimately.
      *   *Step 4: Formulation.* Choose from permitted speech acts (Lent Yes/No, Question Back, Conditional Statement).
      *   *Constraint:* < 40 words.

  5.  **Refining the "Lent Answer" Complication:**
      *   When is it honest? When it serves compassion or safety without claiming intrinsic truth.
      *   When is it a dodge? When used to avoid moral responsibility where conventional responsibility exists.
      *   Procedure needs to flag this.

  6.  **Refining the "Agency" Complication:**
      *   Negation doesn't mean inaction. It means action without attachment to intrinsic existence.
      *   Procedure must ensure the next beat is clear.

  7.  **Developing the Examples:**
      *   *Scene 1: Soldier/Bridge.* Question: "Is the bridge guarded?" Intent: Safety/Tactical. Plot: She needs to cross or warn.
          *   Analysis: Conventional stakes are high (life/death). Ontological stakes low.
          *   Move: Lent Answer.
      *   *Scene 2: Teacher/Self.* Question: "Does self survive death?" Intent: Philosophical trap/Public commitment. Plot: She needs to teach/not bind students.
          *   Analysis: Ontological trap. Conventional stakes low (no immediate danger).
          *   Move: Negation/Redirection.
      *   *Scene 3: Magistrate/Order.* Question: "Was the order wrong?" Intent: Legal trap/Confession. Plot: She needs to accept punishment or justify action without claiming intrinsic justice.
          *   Analysis: Moral/Legal convention vs. Ultimate.
          *   Move: Lent Answer with marker or Consequence.
      *   *Scene 4: Failure Case.* Question: "Do you love me?" (Intimate). Intent: Reassurance. Plot: Needs connection.
          *   Analysis: If she negates, she kills the scene. If she lies, she's evasive.
          *   Result: Inert. Scene structure fault.

  8.  **Drafting the Limits Statement:**
      *   What can't the procedure do? Tone, emotion, subtext, relationship history.
      *   Is this a defect? No, it's craft. Philosophy provides the skeleton, craft provides the flesh.

  9.  **Review against Constraints:**
      *   Reusable procedure? Yes.
      *   Ordered questions? Yes.
      *   Determinate answers? Yes.
      *   Termination points? Yes.
      *   Inputs limited to scene data? Yes.
      *   Three failure modes addressed? Yes (Nihilism, Mysticism, Evasiveness).
      *   Complications included (Lent Answer, Agency)? Yes.
      *   Word count on answers? Enforced in procedure.
      *   Examples provided? Yes.
      *   Failure case included? Yes.
      *   Limits statement included? Yes.

  10. **Final Polish:** Ensure the tone is authoritative but collaborative (like an editor or dramaturg). Ensure the philosophical accuracy holds (especially regarding emptiness vs. nihilism). Make sure the "Lent Answer" distinction is clear.

      *Self-Correction on Procedure:* Make sure the steps are binary where possible to speed up decision making.
      *Self-Correction on Philosophy:* Ensure the distinction between "intrinsic nature" and "conventional function" is clear in the steps.
      *Self-Correction on Agency:* Explicitly link the answer to the *next action*.

      *Refining the "Lent Answer" criteria:*
      Honest: Used to prevent harm or facilitate compassionate action within convention.
      Dodge: Used to avoid conventional accountability when accountability is the point of the scene.

      *Refining the Failure Case:* The procedure should flag when the *scene* is the problem, not the answer.

      *Let's write it.*
answer: |-
  # The Madhyamaka Scene Procedure

  **Inputs Required:**
  1.  **The Question:** Literal wording.
  2.  **The Intent:** Askers goal (Trap, Learn, Reassure, Command).
  3.  **The Next Beat:** What the character must physically or socially *do* immediately after speaking.

  **Constraints:**
  *   Max 40 words.
  *   Avoid: Nihilism ("nothing matters"), Mysticism ("ineffable contradiction"), Evasiveness ("I cannot say").

  ---

  ## Step 1: The Stakes Test (Conventional vs. Ultimate)
  **Ask:** Does answering incorrectly within conventional reality cause immediate physical harm, strategic failure, or unjust suffering?
  *   **YES:** Proceed to **Step 2A (The Lent Answer)**.
  *   **NO:** Proceed to **Step 2B (The Negation)**.

  ## Step 2A: The Lent Answer (Conventional Truth)
  **Condition:** High conventional stakes (e.g., safety, logistics, law).
  **Check:** Is giving a conventional answer compatible with compassion?
  *   **YES:** Give a direct Yes/No based on observable function. *Do not qualify it philosophically.*
      *   *Risk:* Reader hears "normalcy." *Mitigation:* Ensure her internal narration or subsequent action shows non-attachment.
  *   **NO (Accountability Trap):** If the asker demands moral ownership of the answer to punish her.
      *   **Move:** State the consequence, not the thesis. (See Step 3).

  ## Step 2B: The Negation (Ultimate Truth)
  **Condition:** Low conventional stakes, high ontological stakes (e.g., metaphysics, identity, intrinsic nature).
  **Ask:** Does the question presuppose an intrinsic nature (a fixed self, a fixed essence)?
  *   **YES:** Do not answer Yes/No. Reject the presupposition.
  *   **NO:** Answer conventionally (return to Step 2A).

  ## Step 3: The Agency Check (Plot Continuity)
  **Ask:** What must she do in the next beat?
  *   **Action (Cross bridge, Fight, Flee):** You must have cleared Step 2A. You must have a conventional answer.
  *   **Disruption (Stop debate, Expose trap, Shift power):** You must have cleared Step 2B. You must negate the premise.
  *   **Connection (Comfort, Love, Bond):** *Warning:* Negation kills connection. Lent Answer risks dishonesty. If this test fails, see **Failure Mode** below.

  ## Step 4: Formulation (Permitted Speech Acts)
  Select one based on Steps 1–3. Draft under 40 words.

  1.  **The Lent Yes/No:** Direct answer. No qualifiers. (Use when Step 2A = Yes).
  2.  **The Consequence:** "If I say X, you will do Y. Is that your aim?" (Use when Step 2A = No/Accountability Trap).
  3.  **The Dissolution:** "You ask if [X] exists inherently. It does not. Does it function? Yes." (Use when Step 2B = Yes).
  4.  **The Borrowed View:** "By the world's count, yes. By ours, the question breaks." (Use sparingly; risks mysticism).

  ---

  ## Worked Applications

  ### Scene 1: The Soldier and the Bridge
  *   **Question:** "Is the bridge guarded?"
  *   **Intent:** Learn (Survival/Tactical).
  *   **Next Beat:** She must decide whether to cross or warn him.
  *   **Step 1 (Stakes):** YES. Wrong answer = death.
  *   **Step 2A (Lent Answer):** Compatible with compassion? Yes. Saving lives relies on conventional truth.
  *   **Step 3 (Agency):** Action required (Cross/Warn). Needs definite data.
  *   **Step 4 (Formulation):** The Lent Yes/No.
  *   **Draft:** "Three archers on the far tower. They shift at dusk. If you cross now, you live. If you wait, you die." 
      *   *Check:* No metaphysics. High utility. Not evasive.

  ### Scene 2: The Teacher and the Self
  *   **Question:** "Do you believe the self survives death?" (Asked before students).
  *   **Intent:** Trap (Force public commitment to doctrine).
  *   **Next Beat:** She must prevent students from reifying "self" without silencing the teacher.
  *   **Step 1 (Stakes):** NO. No physical harm. Ontological stakes high.
  *   **Step 2B (Negation):** Presupposes intrinsic self? Yes.
  *   **Step 3 (Agency):** Disruption (Stop reification).
  *   **Step 4 (Formulation):** The Dissolution.
  *   **Draft:** "You ask if a shadow survives the wall. What survives is nothing; what ceases is nothing. Who is there to die?" 
      *   *Check:* Avoids Yes/No. Exposes premise. Not nihilistic (doesn't say "nothing matters").

  ### Scene 3: The Magistrate and the Order
  *   **Question:** "State for the record: Was the order you disobeyed wrong?"
  *   **Intent:** Force Commitment (Legal trap/Confession).
  *   **Next Beat:** She must accept punishment without validating the court's intrinsic authority.
  *   **Step 1 (Stakes):** YES (Legal consequence). But Step 2A Check: Compatible with compassion?
      *   *Complication:* Answering "Yes" claims intrinsic moral truth. Answering "No" admits guilt under unjust law.
      *   *Decision:* This is an Accountability Trap. Use Consequence.
  *   **Step 3 (Agency):** Action (Accept punishment) without Submission (Validating authority).
  *   **Step 4 (Formulation):** The Consequence.
  *   **Draft:** "If I say 'wrong,' you hang me. If I say 'right,' you hang me. The record seeks blood, not truth. Write what you will." 
      *   *Check:* Avoids the corner. Highlights the trap. Maintains agency (she chooses the hanging, not the label).

  ---

  ## Failure Case: The Lover's Question
  *   **Question:** "Do you love me?"
  *   **Intent:** Reassurance (Emotional bond).
  *   **Next Beat:** Intimacy/Connection.
  *   **Step 1 (Stakes):** NO (Physical), YES (Relational).
  *   **Step 2A (Lent Answer):** Compatible with compassion? Yes.
  *   **Step 2B (Negation):** Presupposes intrinsic self? Yes (Fixed "you", fixed "me", fixed "love").
  *   **Conflict:** Step 2A demands "Yes." Step 2B demands "No/Dissolution."
  *   **Step 3 (Agency):** Connection required.
      *   If she uses **Dissolution** ("Love is empty"): Reader hears Nihilist/Mystic. Scene dies.
      *   If she uses **Lent Yes** ("Yes"): Reader hears honesty, *but* character consistency risks erosion if not marked.
      *   If she uses **Borrowed View** ("Conventionally, yes"): Reader hears Evasive/Mystic.
  *   **Procedure Output:** **INERT.** The procedure flags a conflict between Ontological Consistency and Dramatic Necessity.
  *   **Conclusion:** The scene is wrongly built for this character *at this moment*. You cannot run a Madhyamaka negation on a love confession without breaking the relationship, unless the relationship is *about* breaking.
      *   *Fix:* Change the Next Beat. She must not seek connection here; she must seek truth, risking the bond. Or, change the Question to action: "Will you stay?" (Allows Lent Answer).

  ---

  ## Limits of the Procedure

  **What This Procedure Cannot Do:**
  1.  **Tone and Texture:** It ensures philosophical consistency, not voice. A Lent Answer can be spoken kindly or coldly; the procedure does not decide. That is craft.
  2.  **Emotional Resonance:** It prevents nihilism, but it cannot generate warmth. If the character speaks correctly but feels dead, the procedure has succeeded and the prose has failed.
  3.  **Long-term Arc:** It handles scene-level consistency. It does not track whether the character is slowly softening or hardening over the book.

  **Is This Residue a Defect?**
  No. The framework is a logic engine for *truth-claims*, not a generator of *humanity*. The residue is the space where your novel lives. If the procedure settles everything, you have written a dialogue between philosophers, not people. The friction between the correct philosophical move and the painful human cost of making it is where the drama hides. Use the procedure to ensure the philosophy holds; use your judgment to ensure the character bleeds.
