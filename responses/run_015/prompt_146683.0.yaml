      *   *Synthesizing the Rule:*
          *   It's not just logical form ($\neg B \land \neg R$ vs $R \land B$).
          *   It's not just Equivalence Condition (rejected by 2 & 5 vs 3 & 4).
          *   It looks like **Severity of Test** or **Error Statistics** (Mayo) or **Bayesian with specific priors on sampling**.
          *   Key distinction between 2 and 3: 2 is "incidental/opportunistic," 3 is "controlled sampling from a risk set."
