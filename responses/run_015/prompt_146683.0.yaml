      *   *Case 6 (Crow from known black flock):* Nothing. We know everything is black. We just don't know if it's R or C. Finding it's a C ($\neg R \land B$) tells us nothing about the color of ravens because the color was already fixed as black for the whole group. No risk of falsification regarding color.
      *   *Case 7 (DNA Raven, Bad Light, Probably Black):* Weak. It's a potential Black Raven ($R \land B$), but uncertain $B$. Uncertainty reduces confirmation compared to Case 1.
