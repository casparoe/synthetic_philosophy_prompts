      *   **Nature of Liberty:** Is it absolute or utilitarian? Mill is a Utilitarian. He explicitly grounds liberty in "the permanent interests of man as a progressive being." It is *not* a natural right in the Lockean sense; it is instrumental to human development and truth-seeking.

