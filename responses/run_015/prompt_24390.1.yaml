prompt: |-
  I run a small expert-dispute desk, and we keep getting cases where two credible experts give conflicting probability estimates on the same factual question and the client has to make a decision that cant be reversed. Right now we just average the two numbers or go with whoever is more senior, which I know is basically a coin flip. Can you turn the common-prior assumption and Aumann's agreeing-to-disagree result (that whole line of work) into a decision procedure my team can actually run on a case, even though none of us have a decision-theory background and we've got roughly a day per case: the questions to put to each expert in order, what counts as a sufficient answer to each, how to tell whether the disagreement is just asymmetric information we can elicit, versus one of them being incoherent, versus the two of them genuinely holding different priors, and where the procedure stops and hands the call to a person because it has become a values question rather than a facts question. Be honest about which steps are judgment calls dressed up as procedure and where the whole thing will misfire, including the case where the common-prior assumption is just false and we should say so instead of forcing a verdict. Then run it on two worked cases: a structural engineer and a geologist disagreeing on the probability a bridge deck fails within ten years, and two epidemiologists disagreeing on whether a new treatment actually reduces mortality. Make sure at least one of the two lands somewhere the client would not want it to.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and worked cases:

  1.  **Deconstruct the Request:**
      *   **Context:** Small expert-dispute desk.
      *   **Problem:** Two credible experts give conflicting probability estimates on factual questions. Client needs an irreversible decision. Current method (averaging/seniority) is inadequate.
      *   **Task:** Create a practical decision procedure based on Common Prior Assumption (CPA) and Aumann's Agreement Theorem.
      *   **Constraints:**
          *   No decision-theory background for the team.
          *   Roughly one day per case.
          *   Must include: Questions to ask, criteria for sufficient answers, distinguishing asymmetric info vs. incoherence vs. different priors, stopping rule for values vs. facts.
          *   Must be honest about limitations (judgment calls, where it misfires, false CPA).
          *   Must include two worked cases (Bridge Engineer vs. Geologist; Epidemiologist A vs. B).
          *   At least one case must land somewhere the client *would not want* (i.e., uncomfortable truth).

  2.  **Theoretical Foundation (Aumann & Common Priors):**
      *   *Aumann's Agreement Theorem:* If two agents have common priors and common knowledge of each other's posteriors, they cannot agree to disagree. Their posteriors must be identical.
      *   *Implication:* If they disagree, either (a) priors differ, (b) information isn't common (asymmetric), or (c) one/both are irrational/incoherent.
      *   *Practical Application:* We can't literally achieve "common knowledge" in a day. We need a proxy protocol to surface *why* they disagree.
      *   *The "Rational" Goal:* Merge information sets. If they share all info and still disagree, it's a prior clash (values/weights).

  3.  **Drafting the Procedure (The "Aumann Protocol for Practitioners"):**
      *   *Phase 1: Calibration & Coherence.* Are they speaking the same language? Are their probabilities coherent (sum to 1, respect logic)?
      *   *Phase 2: Information Exchange.* What do they know that the other doesn't? (The core of Aumann).
      *   *Phase 3: Prior Elicitation.* If info is shared, why the difference? (Weighting of evidence).
      *   *Phase 4: The Verdict/Stop Rule.* When to stop and call it a values clash.

      *Refining for the "One Day/No PhD" Constraint:*
      *   Keep questions concrete.
      *   Use a mediator (the desk team).
      *   Focus on *evidence* first, *weights* second.
      *   Need a clear "Fail State" (CPA is false).

  4.  **Developing the Steps:**
      *   *Step 1: Define the Event.* Must be identical.
      *   *Step 2: The Blind Swap.* Share reports without names.
      *   *Step 3: The "Why" Interrogation.* Break down the probability into likelihoods and base rates.
      *   *Step 4: The Update.* Ask them to update given the other's data.
      *   *Step 5: The Residual.* If still different, isolate the prior.

  5.  **Addressing the "Honesty" Requirement:**
      *   Where does this break?
      *   Experts lie or obfuscate.
      *   Priors are often hidden values.
      *   Time pressure prevents true Bayesian updating.
      *   CPA is often false in reality (different training = different priors).

  6.  **Developing Worked Case 1: Bridge Deck (Engineer vs. Geologist).**
      *   *Scenario:* 10-year failure probability.
      *   *Engineer:* Low probability (focus on steel/concrete specs).
      *   *Geologist:* High probability (focus on soil subsidence/flood risk).
      *   *Process:* They swap data. Engineer didn't know soil data. Geologist didn't know load tolerances.
      *   *Resolution:* Information asymmetry resolved. Numbers converge.
      *   *Client Outcome:* Acceptable (higher risk than engineer thought, lower than geologist thought).

  7.  **Developing Worked Case 2: Epidemiology (Treatment Mortality).**
      *   *Scenario:* Does Treatment X reduce mortality?
      *   *Expert A:* Yes (p=0.9). Focuses on RCT data.
      *   *Expert B:* No (p=0.2). Focuses on observational real-world data/comorbidities.
      *   *Process:* Swap data. Both acknowledge the other's data is valid.
      *   *Conflict:* A weights RCTs higher (internal validity). B weights Real World higher (external validity).
      *   *Diagnosis:* This is a *Prior* disagreement (methodological hierarchy), not factual.
      *   *Client Outcome:* Uncomfortable. "We cannot give you a fact. You must choose your risk tolerance regarding methodology." This fits the "client would not want it" constraint.

  8.  **Review and Refine:**
      *   *Tone:* Professional, pragmatic, slightly cynical about the limits of theory.
      *   *Structure:* Procedure first, Limitations second, Cases third.
      *   *Check Constraints:* Did I explain *how* to tell incoherence vs. priors? Yes (Step 3 & 4). Did I include the stop rule? Yes (Step 5).
      *   *Aumann Fidelity:* Am I misusing the theorem? I need to be careful not to claim this *proves* Aumann right, but uses the *logic* of information sets. Aumann assumes common priors. The procedure tests if that holds.
      *   *Self-Correction on Case 2:* Make sure the "uncomfortable" part is clear. The client wants a "Yes/No" on efficacy. The procedure says "We can't tell you, it depends on which evidence you trust more." That is frustrating for a client.

  9.  **Final Polish:**
      *   Ensure the "Judgment Calls" section is prominent.
      *   Make the "Stop Rule" distinct.
      *   Check the math/logic in the cases (ensure probabilities move realistically).

  **(Self-Correction during drafting):** I initially thought about having them talk to each other. Bad idea. Experts get defensive. Better to have the Desk Team act as the "common knowledge" channel. I will structure the interview as mediated.

  **(Refining the "Client Would Not Want" constraint):** In the Epidemiology case, the result shouldn't just be "we don't know." It should be "The probability is indeterminate because the disagreement is axiomatic." The client has to make a policy choice, not a factual one. That's the uncomfortable truth.

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  Here is a operational protocol based on the logic of Aumann's Agreement Theorem and the Common Prior Assumption (CPA), adapted for a non-technical team with a 24-hour turnaround.

  ### The "Information-Set Merger" Protocol

  **Goal:** Determine if the disagreement is due to **Asymmetric Information** (fixable), **Incoherence** (disqualifiable), or **Divergent Priors** (unfixable/value-based).

  **Role of Your Team:** You are not judges of the science. You are auditors of the *information flow*. You are enforcing "Common Knowledge."

  #### Phase 1: Calibration (Hour 1-2)
  *Objective: Ensure they are answering the exact same question and are logically coherent.*

  1.  **Define the Event:** Write down the exact proposition $E$.
      *   *Bad:* "Will the bridge fail?"
      *   *Good:* "Will the bridge deck suffer structural failure requiring closure before Jan 1, 2034?"
      *   *Action:* Send this definition to both experts. Ask: "Is this the event you assigned a probability to? Yes/No." If No, rewrite until Yes.
  2.  **Coherence Check:** Ask for probabilities of mutually exclusive sub-events that sum to $E$.
      *   *Question:* "You gave $P(E) = 40\%$. Please list the top 3 distinct mechanisms that cause $E$ and assign a probability to each."
      *   *Sufficient Answer:* The sum of mechanisms $\approx P(E)$, and no mechanism exceeds $P(E)$.
      *   *Fail State:* If Mechanism A is 50% but Total $E$ is 40%, the expert is incoherent. **Stop.** Discard this expert's number. Use the other.

  #### Phase 2: The Blind Swap (Hour 3-6)
  *Objective: Test for Asymmetric Information (The core of Aumann).*

  1.  **Sanitize Reports:** Remove names/affiliations from Expert A's rationale and data sources. Do the same for B.
  2.  **The Update:** Give Expert A Expert B's sanitized rationale (and vice versa).
  3.  **The Question:** "Assume the data in this document is true and accurate. Does this change your probability estimate for $E$? If yes, what is the new number? If no, why does this data not impact $E$?"
      *   *Sufficient Answer:* A specific number update OR a specific causal reason why the data is irrelevant (e.g., "That soil sample is from 5 miles away, irrelevant to this site").
      *   *Judgment Call:* If they say "irrelevant," you must verify that claim. If the claim is plausible, accept it. If it looks like dismissal, flag it.

  #### Phase 3: The Residual (Hour 7-8)
  *Objective: Isolate the Prior.*

  If, after Phase 2, they still disagree significantly (e.g., >10% gap), the information sets are now common. The disagreement is now in the **processing function** (the Prior).

  1.  **Weighting Inquiry:** "You both accept Data Set X and Data Set Y. Expert A weights X at 80%. Expert B weights X at 20%. What rule are you using to weight these?"
  2.  **The Stop Rule (Values vs. Facts):**
      *   If the answer is methodological (e.g., "I trust RCTs over observational studies" or "I trust physical models over historical data"), **STOP.**
      *   **Verdict:** "This is a Prior Disagreement. It is not a factual dispute; it is a risk-tolerance dispute regarding methodology. The Desk cannot resolve this."
      *   **Handoff:** The client must decide which *methodology* they prefer. You cannot give them a probability.

  ---

  ### Honest Limitations & Failure Modes

  You asked for honesty about where this is theater and where it breaks.

  1.  **The Common Prior Assumption is Often False:** Aumann's theorem assumes rational agents start with the same prior probabilities before seeing data. In reality, a geologist and an engineer *do not* have the same priors. Their training weights evidence differently. This protocol treats different priors as a "Stop" condition, not a solvable problem. **If you force a number here, you are lying.**
  2.  **The "Day" Constraint:** True Bayesian updating takes time. Experts will heuristicize their "update" in Phase 2. They might say "No change" to save effort. Your team must probe the "Why" aggressively.
  3.  **Strategic Obfuscation:** Experts may hide information to protect their niche. Phase 2 (Blind Swap) mitigates this, but doesn't eliminate it.
  4.  **Judgment Calls Dressed as Procedure:**
      *   Deciding if a "Coherence Check" failure is a typo or fundamental incompetence.
      *   Deciding if an expert's reason for ignoring the other's data (Phase 2) is valid science or stubbornness.
      *   Deciding the threshold for "Significant Disagreement" in Phase 3.

  ---

  ### Worked Case 1: The Bridge Deck (Information Asymmetry)
  **The Dispute:**
  *   **Expert A (Structural Engineer):** $P(\text{Failure in 10 yrs}) = 2\%$.
  *   **Expert B (Geologist):** $P(\text{Failure in 10 yrs}) = 25\%$.
  *   **Client:** Needs to decide whether to fund a $5M retrofit now.

  **Running the Protocol:**

  *   **Phase 1 (Calibration):** Both agree on the definition of "Failure" (closure for safety). Both pass Coherence Check. Engineer cites steel fatigue (1%) and corrosion (1%). Geologist cites foundation subsidence (25%).
  *   **Phase 2 (Blind Swap):**
      *   Engineer sees Geologist's soil report.
      *   *Engineer's Update:* "I was not aware of the liquefaction risk in Sector 4. If this soil data is accurate, my probability updates to 20%."
      *   Geologist sees Engineer's load tolerance report.
      *   *Geologist's Update:* "I assumed standard load limits. This bridge is over-engineered. Even with subsidence, the deck holds. My probability updates to 15%."
  *   **Phase 3 (Residual):** Gap is now 20% vs 15%.
      *   *Inquiry:* Why the remaining 5%?
      *   *Answer:* Engineer trusts the soil sampling density; Geologist thinks it's too sparse.
      *   *Resolution:* This is a minor data quality dispute, not a prior clash. You average the updated numbers (17.5%).

  **Verdict to Client:** "The disagreement was due to asymmetric information. The Engineer didn't have the soil data; the Geologist didn't have the load specs. Merged probability of failure is 17.5%."
  **Client Reaction:** **Unhappy but safe.** They wanted to hear 2%. They have to spend the $5M. But the number is defensible. The protocol worked.

  ---

  ### Worked Case 2: The Epidemiological Treatment (Divergent Priors)
  **The Dispute:**
  *   **Expert A (Clinical Trialist):** $P(\text{Treatment reduces mortality}) = 90\%$.
  *   **Expert B (Public Health Epidemiologist):** $P(\text{Treatment reduces mortality}) = 30\%$.
  *   **Client:** A national health agency deciding whether to approve the drug for mass rollout.

  **Running the Protocol:**

  *   **Phase 1 (Calibration):** Both agree on "Mortality within 1 year of diagnosis." Both pass Coherence Check.
  *   **Phase 2 (Blind Swap):**
      *   Expert A sees Expert B's data (observational studies from 3 countries showing no benefit).
      *   *Expert A's Update:* "I see those studies. However, they are observational. Confounding variables are likely. My probability remains 90%."
      *   Expert B sees Expert A's data (Double-blind RCT showing strong benefit).
      *   *Expert B's Update:* "I see the RCT. However, the exclusion criteria were too strict. Real-world patients have comorbidities not in the trial. My probability remains 30%."
  *   **Phase 3 (Residual):** Gap remains 90% vs 30%.
      *   *Inquiry:* "You both accept the other's data exists. Why does it not change your probability?"
      *   *Answer:*
          *   Expert A: "RCTs are the Gold Standard. Observational data is noise."
          *   Expert B: "External Validity trumps Internal Validity. If it doesn't work in the wild, the RCT is a lab artifact."
      *   *Diagnosis:* **Divergent Priors.** This is not a factual dispute about whether the data exists. It is a methodological hierarchy dispute. Expert A prioritizes *control*; Expert B prioritizes *generalizability*.

  **Verdict to Client:**
  "Protocol Halted. The experts share all information. The disagreement is axiomatic. Expert A treats Randomized Controlled Trials as the truth-condition. Expert B treats Real-World Evidence as the truth-condition.
  **We cannot provide a probability.**
  To proceed, *you* (the Client) must decide: Do you value Internal Validity (A) or External Validity (B)? If you choose A, the probability is 90%. If you choose B, it is 30%."

  **Client Reaction:** **Hostile.**
  The client wanted a "Go/No-Go" recommendation based on facts. You have handed them a political liability. They cannot say "We chose methodology A" without being accused of ignoring real-world deaths. They cannot say "We chose B" without being accused of ignoring gold-standard science.

  **Why this is the honest outcome:**
  If you had averaged them (60%) or picked the senior expert, you would have given the client a false sense of scientific certainty. By invoking the Common Prior failure, you have correctly identified that **science has not settled this question; policy preferences have.** The protocol forced the uncertainty out of the math and into the client's lap, where it belongs.

  ### Summary Checklist for Your Team

  1.  **Did they define the event identically?** (If no, stop and fix).
  2.  **Did their sub-probabilities sum correctly?** (If no, discard expert).
  3.  **Did the numbers move after swapping data?**
      *   **Yes:** Continue until convergence. Average the final numbers.
      *   **No:** Move to Step 4.
  4.  **Is the reason for "No" about data quality or methodological hierarchy?**
      *   **Data Quality:** Investigate. (Fact question).
      *   **Hierarchy/Weighting:** **STOP.** (Values question). Tell the client they must choose the worldview.

  **Final Warning:** In Case 2, the client will try to force you to pick. Do not. If you pick, you violate the logic of the protocol and become a partisan actor. Your value is telling them when the math stops working.
