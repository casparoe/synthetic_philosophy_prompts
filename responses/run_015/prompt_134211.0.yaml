  One nail undone, the shoe relinquished hold,
  The steed fell lame upon the stony ground.
  The rider fell, the story went untold,
  And fate of armies there was strictly bound.
  Thus battle lost, the crown was torn away,
  The kingdom fell to ruin and to strife.
  For one small piece was cast too far astray,
  That severed clean the thread of public life.

  But chaos breaks the rule of straight design,
  Where shifts expand beyond the known confine.
  No single world awaits us down the line,
  But branching paths that we cannot define.
  Relinquish hope to trace one certain thread,
  Or claim the past by single lines is led.
