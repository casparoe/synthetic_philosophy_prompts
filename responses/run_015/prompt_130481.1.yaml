answer: |-
  ### PART 1: DEVELOPER'S NOTES (REASONING & BRAINSTORMING)
  *(For your eyes only, to show how the checklist was derived)*

  **Brainstorming: How Inferences Break**
  1.  **Taphonomic Noise:** Did the object get there by human action or natural process? (Flood vs. Burial). If we can't distinguish, inference stops.
  2.  **Equifinality:** Different causes produce identical objects. A broken pot is either trash or ritual. A heavy stone is a weight or a hammer.
  3.  **The "Mind" Gap:** We see matter, we want to claim mind (belief). Matter $\rightarrow$ Action is easy. Action $\rightarrow$ Belief is hard.
  4.  **Scale Error:** One object = individual habit. Many objects = social pattern. Pattern $\neq$ Law.
  5.  **The Ethnographic Trap:** Assuming Iron Age people thought like 19th-century locals in the same valley. (Continuity is a hypothesis, not a fact).
  6.  **Institution vs. Convention:** An institution requires enforcement/hierarchy. A convention (everyone does it) does not. Standardized weights could be a guild tradition, not a state mandate.
  7.  **Meaning Drift:** An object might start as tool, become symbol, become trash. Which "time slice" are we labeling?

  **Critique of Your Proposed Chain**
  *Object → Deposition → Action → Practice → Norm → Belief → Institution*

  *   **Verdict:** It is a useful "Ladder of Abstraction," not a strict causal chain.
  *   **Correction 1:** "Depositional History" is the foundation, not step 2. If the context is disturbed, the ladder collapses.
  *   **Correction 2:** "Practice" to "Norm" is the danger zone. People do things for convenience that look like norms.
  *   **Correction 3:** "Belief Content" (e.g., "spirits") is the least secure step. "Ritual Action" is more secure than "Ritual Purpose."
  *   **Correction 4:** "Institution" requires evidence of *enforcement* or *specialization*, not just regularity.
  *   **Uncertainty Model:** You are right about error propagation. Each step up the ladder multiplies uncertainty. We should not report the top rung if the bottom rungs are shaky.

  ***

  ### PART 2: VOLUNTEER DECISION PROCEDURE
  *(Printable 2-Page Sheet for the Team)*

  **OBJECTIVE:** To decide if an object label can claim a **Belief** (e.g., "spirits") or an **Institution** (e.g., "regulated market").
  **TIME LIMIT:** 30 Minutes per claim.
  **RULE:** If you cannot answer a question with evidence, you must step down to the safer label below it.

  #### THE FIVE GATES
  *Answer Yes, No, or Unknown. If "No" or "Unknown," stop and use the corresponding Label Tier.*

  **GATE 1: CONTEXT (The "Where")**
  *   **Q:** Is the object exactly where the people left it? (Not moved by plough, flood, or later digging).
  *   **Evidence Needed:** Excavation notes show undisturbed soil layers; object fits the layer date.
  *   **If NO/UNKNOWN:** **STOP.** Label Tier: **"Found Object."** (Do not claim intent).
  *   **If YES:** Proceed to Gate 2.

  **GATE 2: INTENTION (The "How")**
  *   **Q:** Was the object modified or placed deliberately? (Broken on purpose, buried, unused, hidden).
  *   **Evidence Needed:** Signs of force (snap vs. crush), placement (under floor vs. on floor), condition (pristine vs. worn).
  *   **If NO:** **STOP.** Label Tier: **"Discarded Tool/Trash."**
  *   **If YES:** Proceed to Gate 3.

  **GATE 3: PATTERN (The "How Many")**
  *   **Q:** Does this happen more than once? (Same object type, same treatment, same context).
  *   **Evidence Needed:** 3+ similar examples from same period/area, OR one very complex example that implies a script.
  *   **If NO (One-off):** **STOP.** Label Tier: **"Individual Act."** (Do not claim shared belief).
  *   **If YES:** Proceed to Gate 4.

  **GATE 4: MEANING (The "Why")**
  *   **Q:** Is there a direct link to a specific belief, without guessing?
  *   **Evidence Needed:** Written record, OR identical practice in a connected culture with records, OR iconography (pictures of gods) on the object.
  *   **If NO:** **STOP.** Label Tier: **"Ritual Practice."** (Claim action, not belief).
  *   **If YES:** Proceed to Gate 5.

  **GATE 5: AUTHORITY (The "Who")**
  *   **Q:** Is there evidence of enforcement or specialization?
  *   **Evidence Needed:** Workshops, official seals, punishment records, or extreme uniformity over a wide area that implies checking.
  *   **If NO:** **STOP.** Label Tier: **"Shared Convention."** (Claim habit, not institution).
  *   **If YES:** Label Tier: **"Institution."**

  ---

  #### LABEL TIERS (Choose the highest one you reached)
  1.  **Found Object:** "Clay disk, found in doorway." (Safest)
  2.  **Discarded Tool:** "Broken clay disk, likely trash."
  3.  **Individual Act:** "Deliberately broken disk, purpose unknown."
  4.  **Ritual Practice:** "Deliberately broken disks, likely ritual deposition." (No mention of *who* or *why*)
  5.  **Shared Convention:** "Standardized weights, indicating shared trading practice." (No mention of *state* or *law*)
  6.  **Institution/Belief:** "Weights maintained by central authority." / "Offering to Water Deity." (Requires Gate 5/4 Yes)

  ---

  #### CASE STUDY WALKTHROUGHS (For Training)

  **Case 1: Broken Clay Disks (Doorway)**
  *   **Gate 1 (Context):** Yes (Under doorway, undisturbed).
  *   **Gate 2 (Intention):** Yes (Snapped, not crushed).
  *   **Gate 3 (Pattern):** Unknown/Weak (Only 12 disks, one house).
  *   **Gate 4 (Meaning):** No (No writing, no pictures of spirits).
  *   **Decision:** Stop at **Tier 3 or 4**.
  *   **Draft Label:** "Twelve clay disks, deliberately broken and buried under the doorway. This suggests a household ritual, though the specific purpose is unknown."
  *   **Correction:** Remove "protecting spirits."

  **Case 2: Bronze Axe Hoard (Bog)**
  *   **Gate 1 (Context):** Yes (Bog deposition).
  *   **Gate 2 (Intention):** Yes (Unused, new).
  *   **Gate 3 (Pattern):** Yes (200 axes, multiple molds).
  *   **Gate 4 (Meaning):** No (No records of "water deity" for this specific group).
  *   **Gate 5 (Authority):** No (Could be group collection, not necessarily priests).
  *   **Decision:** Stop at **Tier 4**.
  *   **Draft Label:** "Hoard of 200 unused axeheads deposited in the bog. This indicates a large-scale ritual practice, likely an offering, though the recipient is unknown."
  *   **Correction:** Remove "priest class" and specific deity name.

  **Case 3: Stone Weights (River Valley)**
  *   **Gate 1 (Context):** Yes (Domestic contexts).
  *   **Gate 2 (Intention):** Yes (Ground to specific mass).
  *   **Gate 3 (Pattern):** Yes (41 weights, tight clustering).
  *   **Gate 4 (Meaning):** No (Weights imply trade, not specific belief).
  *   **Gate 5 (Authority):** **NO.** (Found in homes, not official buildings; 3% variance is high for strict state control; could be single workshop copying).
  *   **Decision:** Stop at **Tier 5**.
  *   **Draft Label:** "Standardized stone weights found in homes. This indicates a shared system of measurement across the valley, likely maintained by local traders or workshops."
  *   **Correction:** Remove "institution that maintained the standard."

  ***

  ### PART 3: RATIONALE FOR THE CURATOR
  *(One-Page Memo)*

  **TO:** Curator of Collections
  **FROM:** Volunteer Team
  **SUBJECT:** Methodology for Interpretive Labels (Iron Age Gallery)

  **The Problem**
  Previous labels often stated specific beliefs ("charm to protect") or institutions ("regulated market") as facts. As a team with mixed expertise, we lack the evidence to verify these high-level claims. When challenged, we cannot defend them without speculation.

  **The Solution: The "Five Gate" Protocol**
  We have adopted a decision procedure based on **uncertainty propagation**. Much like engineering safety factors, we treat every inference from *object* to *meaning* as a step that introduces potential error.
  *   **Secure:** Context and Intention (Physical evidence).
  *   **Uncertain:** Belief and Institution (Mental/Social states).

  We now assign a "Label Tier" to every claim. We only use high-level terms (Belief, Institution) if the evidence passes specific gates (e.g., evidence of enforcement for "Institution").

  **Why This Matters**
  1.  **Accuracy:** It prevents us from confusing *pattern* with *law*. (e.g., Standardized weights prove agreement, not necessarily a government).
  2.  **Defensibility:** If a visitor asks "How do you know it was a spirit?", we can point to the protocol. We admit the limit of the evidence rather than inventing a story.
  3.  **Consistency:** All four volunteers use the same logic, reducing personal bias in the text.

  **Limitations & Compromises**
  *   **Hedging:** Labels will read more cautiously ("suggests," "likely," "practice" instead of "belief"). This is a feature, not a bug. It signals scientific rigor.
  *   **Ethnographic Analogy:** We have restricted using later local folklore to explain Iron Age objects unless there is direct continuity evidence. This avoids the "noble savage" or "timeless peasant" fallacy.
  *   **The "Meaning" Gap:** We acknowledge we cannot know what they *thought*, only what they *did*. The labels will focus on action ("deposited," "broken," "used") rather than internal state ("believed," "feared").

  **Request for Approval**
  We request approval to rewrite the Iron Age labels using this tiered system. We anticipate some text will become shorter and less definitive, but it will be more robust against academic and public scrutiny.

  **Signed:**
  The Volunteer Team
