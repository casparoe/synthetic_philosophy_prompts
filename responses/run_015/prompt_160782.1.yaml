answer: |-
  This is an excellent project. You are effectively asking for an *epistemic engineering specification* based on the *pramāṇa* debates, stripped of the historical baggage but keeping the structural rigor. You want a tool to audit beliefs, not a museum tour.

  Below is the spec. I have broken it down into **Core Desiderata** (things the theory must do to function), **The Tensions** (where the requirements fight each other), and a **Scorecard** of how the classical "camps" perform against your specific cases.

  ### Part 1: The Desiderata (The Spec)

  Here are the six requirements your theory must meet to be usable as an audit tool. I have flagged which are structural necessities and which are sectarian preferences.

  #### 1. The Veridicality Constraint (Real Requirement)
  **The Rule:** The theory must distinguish between *cognition that happens to be true* and *cognition generated by a reliable process.*
  **The Case:** The lucky guesser. If you guess the lottery numbers, you have a true belief, but you don't have *knowledge*. If you calculate them using physics (impossible, but hypothetically), you do.
  **The Worry:** If your audit tool counts lucky guesses as valid, it gives you false confidence. The theory needs a way to tag the *source* of the belief, not just the outcome.
  **Audit Application:** When you believe something, ask: "Did this belief arise from a process that *tracks truth*, or did it just land on truth?"

  #### 2. The Error Theory (Real Requirement)
  **The Rule:** The theory must explain how the *same source* that gives knowledge can also give error, without invalidating the source entirely.
  **The Case:** The rope/snake. Your eyes (perception) told you "snake." They were wrong. Does this mean perception is useless? No. It means specific conditions (dim light, fear) corrupted the process.
  **The Worry:** If a source produces *any* error, a strict theory might discard it (like the Charvakas sometimes imply about inference). If it accepts *all* outputs, it's useless. You need a "defeasibility" clause: *Perception is valid unless conditions X, Y, Z are present.*
  **Audit Application:** For every belief, list the "defeaters." (e.g., "I believe this Wikipedia article, *unless* the topic is politically charged and the edit history is sparse.")

  #### 3. The Individuation Principle (Real Requirement)
  **The Rule:** You need a non-arbitrary rule for when a source is *distinct* versus when it is just a subtype of another.
  **The Case:** Absence (no pot on floor) and Analogy (cow-like animal). Nyaya says these are distinct. Buddhists say Absence is just Perception (you see the floor) and Analogy is just Testimony + Inference.
  **The Worry:** Without this, your list grows forever. (e.g., "Google Search" as a 5th pramāṇa?). The principle should be: *A source is distinct only if it relies on a causal mechanism not reducible to the others.*
  **Audit Application:** If you claim "Intuition" is a source, you must prove it isn't just fast Inference or buried Memory. If you can't, collapse it into the simpler category.

  #### 4. The Novelty vs. Stability Condition (Sectarian Taste)
  **The Rule:** Must knowledge be *new* (*anadhigata*)?
  **The Case:** Re-checking the stove. You already believed it was off. You look again. You still believe it is off. Is this knowledge?
  **The Worry:** Classical Nyaya says *pramā* (valid knowledge event) must be novel. If you require novelty, your audit tool cannot *confirm* existing beliefs, only acquire new ones. This makes it useless for auditing what you already think.
  **Audit Application:** **Drop the novelty requirement.** For an audit tool, *stability* (re-confirming via a different source) is more valuable than novelty. This is a modification of the classical spec for modern use.

  #### 5. The Instrument/Agency Distinction (Real Requirement)
  **The Rule:** The theory must clarify whether the source is the *tool*, the *person*, or the *process*.
  **The Case:** Thermometer, Chatbot, Wikipedia. Is a thermometer Perception (reading the mercury)? Inference (mercury rises -> heat)? Or Testimony (the manufacturer says this scale is accurate)?
  **The Worry:** If you treat a chatbot as Testimony, you assume an author with intent. If you treat it as Inference, you assume logical derivation from data. These have different failure modes.
  **Audit Application:** Classify instruments. A scale is Perception (extended). A chatbot is Testimony (from devs) wrapped in Inference (pattern matching). Audit the *chain*: Do you trust the devs? Do you trust the pattern matching?

  #### 6. The Actionability Test (Sectarian Taste)
  **The Rule:** Is truth defined by *correspondence to reality* or *successful action* (*arthakriyā*)?
  **The Case:** A dream where you drink water. In the dream, the action "drink" feels real. It fails to quench thirst.
  **The Worry:** Buddhists emphasize successful action. Nyaya emphasizes correspondence. Sometimes a false belief leads to success (placebo effect). Sometimes a true belief leads to failure (knowing the bridge is out, but taking it anyway out of panic).
  **Audit Application:** Use **Correspondence** for facts (is the bridge out?), **Actionability** for strategies (will this diet work?). Don't conflate them.

  ---

  ### Part 2: The Tensions (Where the Spec Breaks)

  You suspected some requirements are jointly unsatisfiable. You are right. Here are the three "Break Points" where you must choose a lane.

  #### Tension A: Novelty vs. Confirmation
  *   **Conflict:** If you keep the classical *anadhigata* (novelty) requirement, you cannot use the system to audit beliefs you already hold. You can only use it to ingest new data.
  *   **Resolution:** For an audit tool, **prioritize Confirmation.** Allow "re-cognition" (*pratyabhijñā*) to count as a valid output of Perception or Memory. This violates strict Nyaya metaphysics but saves the utility of the tool.

  #### Tension B: Parsimony vs. Coverage
  *   **Conflict:** The Reductionists (Buddhists, some Nyaya) want only Perception and Inference. The Pluralists (Mīmāṃsā, Advaita) want 6+.
  *   **The Problem:** If you choose Parsimony, you struggle with "Absence" (how do you infer 'no pot' without seeing 'pot' first?) and "Testimony" (is understanding language really just inference?). If you choose Coverage, your list becomes bloated and hard to audit.
  *   **Resolution:** **Adopt a "Base + Extension" model.** Treat Perception and Inference as the base engine. Treat Testimony, Analogy, and Absence as *verified shortcuts* that ultimately rest on the base. This keeps the list small but acknowledges the distinct *feeling* of hearing vs. seeing.

  #### Tension C: Internal Access vs. External Reliability
  *   **Conflict:** Do you need to *know why* a source is reliable (Internalism), or does it just *need to be* reliable (Externalism)?
  *   **The Case:** You trust a thermometer. You don't know thermodynamics.
  *   **The Problem:** If you require Internal Access, you can't trust most instruments or expert testimony (you can't verify the expert's proof). If you require only External Reliability, you can't distinguish a lucky guess from knowledge.
  *   **Resolution:** **Tiered Access.** For high-stakes beliefs, require Internal Access (check the math). For low-stakes, accept External Reliability (trust the brand/reputation). The *pramāṇa* theory must allow for "deferred verification."

  ---

  ### Part 3: The Killer Criterion

  You asked which single requirement kills the most candidate lists.

  **The Winner: The Error Theory (Defeasibility).**

  Most naive lists fail here.
  *   **Perception-Only (Charvaka):** Killed because perception errs (rope/snake). They have no robust way to distinguish valid perception from illusion without smuggling in Inference.
  *   **Strict Testimony:** Killed because liars exist. If you can't audit the speaker, the source is toxic.
  *   **Pure Reliabilism (Modern):** Killed because it can't explain *why* a process failed in a specific instance, only that it has a failure rate.

  To survive this, a theory must allow a *pramāṇa* to be valid *in principle* while admitting specific instances can be defective (*dosha*). If your theory demands infallibility, it yields zero knowledge. If it accepts all outputs, it yields noise. The "Killer" is finding the middle ground of **conditional validity**.

  ---

  ### Part 4: Scorecard of Candidate Systems

  Here is how the classical "camps" score against your specific cases and the desiderata above.

  | System | The List | Score | Why it Passes/Fails Your Audit |
  | :--- | :--- | :--- | :--- |
  | **Materialist (Cārvāka)** | Perception Only | **F** | Fails instruments (thermometer is inference), fails testimony (books/friends), fails absence (can't perceive "no pot"). Good for raw data, useless for synthesis. |
  | **Buddhist (Dignāga)** | Perception + Inference | **B** | Extremely rigorous on Error and Distinctness. Reduces Testimony to Inference (trust the speaker -> infer truth). Struggles slightly with "Absence" as a distinct cognitive event, but handles Chatbots well (as inference from data). |
  | **Nyāya** | Perception, Inference, Testimony, Comparison | **A-** | The "Standard Model." Handles the Chatbot (Testimony/Inference hybrid). Handles Analogy (Comparison). Robust Error Theory. **Docked points** for the Novelty requirement (makes re-checking hard) and sometimes clunky handling of anonymous sources. |
  | **Mīmāṃsā/Advaita** | The Above + Postulation + Absence | **A** | Best for "No pot on floor" (Absence) and "Fat non-eater" (Postulation). Best for auditing negative beliefs. **Risk:** Can become bloated. Harder to learn quickly. |
  | **Modern Reliabilism** | "Whatever works" | **C+** | Good for instruments. Terrible at distinguishing *why* something worked. Fails the "Lucky Guess" case without complex statistical caveats. No built-in Error Theory. |

  ### Recommendation for Your "Audit Tool"

  Don't adopt one school. Build a **Nyāya Core with Mīmāṃsā Extensions.**

  1.  **Base Sources:** Perception, Inference, Testimony. (Nyāya 3).
  2.  **Add-ons:** Explicitly add **Absence** (for auditing what isn't there) and **Memory** (for auditing consistency over time).
  3.  **Drop:** Novelty (*anadhigata*). Allow confirmation.
  4.  **Instrument Rule:** Treat all digital tools as **Testimony** (from the creator) mediated by **Inference** (the code logic). Audit the creator's reputation, not just the screen.
  5.  **Error Check:** For every belief, write down the *defeater conditions* (e.g., "I trust this memory *unless* I was stressed").

  This gives you the structural rigor of the Nyaya debates without the metaphysical baggage that prevents you from checking what you already believe.
