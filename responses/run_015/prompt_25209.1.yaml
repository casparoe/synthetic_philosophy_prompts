      *   *Claim 1:* "Once you've invested... you feel you have to see it through — but this is always irrational."
          *   *Standard View:* In normative decision theory (expected utility), past costs are indeed irrelevant to the *marginal* decision.
          *   *Nuance:* "Always" is a strong word. There are contexts where past investment signals future viability or creates reputational capital.
      *   *Claim 2:* "The only thing that should matter for any decision is future costs and future benefits."
          *   *Standard View:* This is the core definition of rational choice theory.
          *   *Nuance:* This assumes the utility function is static and doesn't value consistency, reputation, or learning *about* the past investment itself.
      *   *Claim 3:* "What you've already spent is gone no matter what you do, so it can't be relevant."
          *   *Standard View:* True for the resource itself.
          *   *Nuance:* False if the *fact* of spending changes the future landscape (e.g., signaling, learning).
      *   *Claim 4:* "The cure is simple... ask yourself what you would do if you were starting fresh today."
          *   *Standard View:* A good heuristic for isolating marginal utility.
          *   *Nuance:* It ignores path dependence and identity formation.

  3.  **Evaluate the User's Counterexamples:**
      *   *PhD (Reputation):* Is quitting costly? Yes. Is that cost future or past? It's a *future* cost resulting from the *past* action. The friend might say "Okay, but the degree itself has no value, only the signal." The user needs to distinguish between valuing the sunk cost vs. valuing the *consequences* of acknowledging the sunk cost.
      *   *War (Deterrence/Signaling):* This is a classic game theory scenario. Persisting signals resolve. If you quit, future adversaries attack. The cost of persisting is weighed against the *future* benefit of deterrence. The friend calls this a fallacy; game theorists call it signaling.
