      *Refining the PhD example:* If I quit, I lose the degree. The degree has future value. The time spent is sunk. But if I quit, I also signal "quitter." That signal has future cost. So weighing the signal is rational. Weighing the "wasted time" is not. The friend conflates the two.

      *Refining the Parenting example:* The benefit is the child's character. The cost is the lessons. The past lessons are sunk. But stopping now undermines the character lesson. This is about future utility of character vs. current utility of free time. Not really SCF.

