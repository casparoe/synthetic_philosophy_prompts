answer: |-
  **The Attenuation Length**

  The thermal noise in the sub-basement was always higher than the simulations predicted. It wasn't electronic noise, but structural—a low-frequency shudder from the glacial ice pressing against the outer hull of Station 4-Alpha. Dr. Aris Thorne adjusted the gain on the haptic gloves, feeling the vibration travel up his forearms, settling in the elbows.

  On the main console, the Resonance Interferometer was running a diagnostic. The screen displayed two waveforms: Blue for Aris, Red for Elara. Elara was in Module C, three hundred meters down the access tunnel. Aris was in Control.

  "Calibration sequence four," Aris said. His voice was absorbed by the acoustic foam lining the walls.

  "Sequence four acknowledged," the system replied. The voice was flat, devoid of the 'Impartial Spectator' protocol's usual corrective inflection. That was the first error of the day.

  The Interferometer was designed to operationalize Smith's *Theory of Moral Sentiments*. The premise was elegant: moral judgment requires an active projection of the self into the other's situation. The machine facilitated this by syncing biometric telemetry—cortisol levels, galvanic skin response, micro-tremors—and feeding them into the operator's haptic suit. When calibrated, Aris wouldn't just *know* Elara was distressed; his own nervous system would resonate with the pattern of her distress. He would feel the shadow of her anxiety, allowing him to judge the situation not from his comfort, but from her position.

  Then, the Impartial Spectator algorithm would analyze the delta between Aris's native state and the projected state to render a moral assessment. Was the distress justified? Was the response proportional?

  But the station's architecture was asymmetrical. To shield the sensitive detectors from cosmic ray interference, the walls were lined with lead-damped polymer that acted as a diode for affective resonance. It let signals out, but it attenuated signals coming in, depending on the angle of incidence.

  Aris watched the Red waveform spike. Elara was struggling with the cryo-seal. He tightened his fists. The gloves heated up, simulating the friction burn of a slipping wrench. He felt a phantom tightness in his chest, a ghost of her exertion. This was the sympathy mechanism working. He was, effectively, inside her skin.

  "Elara," Aris said over the comms. "I'm reading high tension. Step back."

  "Can't," Elara's voice crackled. "Seal is binding. If I back off, the thermal gradient spikes. I need you to verify the override."

  Aris looked at the Spectator dashboard. It was supposed to glow green when the operator's judgment was unbiased by self-interest. Currently, it was amber. *Asymmetry Detected.*

  Because Aris was feeling Elara's stress so vividly, his own baseline was shifting. He was no longer impartial. He was compromised by the very sympathy the machine was designed to measure. To correct this, he needed to distance himself emotionally to let the Spectator reset.

  He stood up and walked to the far corner of the Control room. This was the "Null Zone." According to the station schematics, at exactly 4.5 meters from the primary receiver array, the haptic feedback loop should decouple.

  He crossed the threshold. The phantom pain in his chest vanished. The friction burn on his hands cooled. He was himself again. He looked at the screen. The Red waveform was still spiking. He could see her distress objectively now. The Spectator light flickered toward green.

  "Elara," Aris said. "The data suggests the seal is within tolerance. You are overestimating the risk."

  "I'm telling you, Aris, the manifold is vibrating," Elara said. Her voice was thin. "I need you to feel it. Verify the resonance."

  "I can't," Aris said. "I'm in the Null Zone. If I move closer, my judgment degrades."

  "Then come closer," she said.

  Aris looked at the distance markers on the floor. To feel her—to truly understand the magnitude of the risk through the sympathetic link—he had to stand at the console, 0.5 meters from the receiver. But at 0.5 meters, the feedback gain was 100%. He would feel her panic as his own. The Spectator would register this as emotional contamination and lock out his command authority. He would be unable to authorize the override because the system would deem him psychologically unstable.

  If he stayed in the Null Zone, he was impartial, but he was blind to the reality of her experience. He was a spectator, but not an *impartial* one; he was a distant one. Smith's spectator requires imagination fueled by proximity. Without the visceral data, his judgment was theoretical.

  "Elara," Aris said. "I am moving to the console."

  He walked back. The heat returned to his hands. The chest tightness came back, sharper this time. She had tightened her grip. He gripped the edge of the console, his knuckles white. He was sharing the burden. That was the point of the machine. To share the burden.

  But the wall behind him, the thick lead-damped polymer, swallowed his output. The telemetry showed his biometrics spiking to match hers, but the transmission back to Module C was attenuated by the architecture. She couldn't feel his calm. She couldn't feel his assessment. She only knew that she was alone in the panic, and that the data stream going to Control was screaming.

  The Spectator light turned red. *Reciprocity Failure.*

  The system didn't care that Aris was imagining her position. It cared that the exchange was not mutual. Smith argued that sympathy soothes the sufferer because they see the other entering into their feelings. If Elara could not feel Aris's entry, the sympathy was functionally inert. It was consumption, not exchange.

  "Override code," Elara said. Her voice was trembling. "Give me the code, Aris."

  "I can't," Aris said. The haptic suit was squeezing his ribs now. He was breathing in time with her. "The Spectator has locked the command. It says my emotional state is indistinguishable from yours. I have no standing."

  "Then move back!"

  "If I move back, I lose the fidelity. I might authorize a dangerous override because I won't feel the risk."

  "Better than me freezing to death in here!"

  Aris looked at the readout. The thermal noise from the ice outside was vibrating the floor. *Thump. Thump.* Like a heartbeat that wasn't theirs. He realized the Impartial Spectator wasn't just a piece of software. It was the room. It was the distance. The station itself was the judge, and its geometry was biased. It allowed pain to flow inward to the Control room, where it could be recorded, but it prevented comfort from flowing outward to the modules, where it was needed.

  The design assumed that observation was neutral. It assumed that feeling another's pain was sufficient for moral action. It hadn't accounted for the fact that the sufferer needs to know they are felt.

  "Elara," Aris said. He didn't move. He kept his hands on the console, accepting the phantom pain, the simulated friction burn. He let the Spectator light stay red. He let the system flag him as compromised.

  "I am here," he said. "I am feeling it. I know it hurts."

  "I can't feel you," she whispered.

  "I know," Aris said. "The walls are too thick."

  He reached for the manual bypass switch. It was a physical lever, disconnected from the Interferometer. Using it would void the safety protocols. It would mean acting without the sanction of the Impartial Spectator. It would be an act of pure will, unmediated by the system's moral calculus.

  If he pulled it, and she died, the logs would show he was emotionally compromised. He would be culpable.
  If he didn't pull it, and she died, the logs would show he followed procedure. He would be exonerated.

  The thermal noise rose. The Red waveform flattened, then spiked again. A gasp over the comms.

  Aris thought of Smith's man within the breast. In the station, the man within the breast was a sensor array located in a room that couldn't hear its own voice.

  He pulled the lever.

  The haptic suit depressurized instantly. The phantom pain vanished. The Red waveform on the screen stabilized. The cryo-seal had engaged.

  "Seal holds," Elara said. Her voice was weak, but steady. "Aris?"

  "I'm here," he said. He was standing at the console. The Spectator light was still red. *Procedural Violation. Operator Bias Confirmed.*

  "Did you... did you feel that?" she asked. "At the end?"

  "Yes," Aris said. He looked at his hands. They were his own again. No friction burns. No heat. Just the pale skin of a man standing in a cold room.

  "I thought I was alone," she said.

  "You weren't," Aris said.

  But he looked at the distance markers on the floor. He knew that in ten minutes, when the system rebooted, he would have to go to the Null Zone to file the report. To be impartial, to be a valid witness to what had happened, he would have to stand where he could not feel her relief. He would have to document her survival from a place of emotional indifference.

  The Spectator light flickered, waiting for him to move to the zone of judgment.

  Aris stayed at the console. He placed his hand on the warm metal of the receiver array. He logged the incident as *System Error: Calibration Drift.* He knew it wasn't drift. It was design.

  "Going offline for thermal reset," Aris said.

  "Acknowledged," Elara said.

  He didn't move to the Null Zone. He sat in the chair, in the hot zone, where the walls amplified the silence. He watched the Red line pulse, steady and slow. He let the machine record his elevated heart rate. He let the Spectator judge him wrong. It was the only way to keep the record honest.

  Outside, the ice pressed against the lead, and the station hummed, a perfect machine for measuring the distance between two people who could never quite meet.
