      *   **The Conflict:** SSA penalizes large populations (Doomsday); SIA favors large populations (Presumptuous Philosopher). They often cancel out (e.g., in Sleeping Beauty, SSA -> 1/2, SIA -> 1/3, but combined with specific priors they might align or diverge).

