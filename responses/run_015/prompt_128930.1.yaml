answer: |-
  This is a precise and challenging translation task. Your intuition is strong, but the mapping requires tightening because anthropic reasoning violates a core assumption of standard survey statistics: that the analyst is external to the population. In anthropics, the analyst is the sample.

  Here is the restatement and assessment in your vocabulary.

  ### 1. Correcting the Mapping: Design, Likelihood, and Priors

  Your initial pass is directionally correct but misallocates the probability mass.

  *   **SSA (Self-Sampling Assumption):** This is **not** purely design-based in the survey sense. In survey stats, a design-based approach fixes the inclusion probabilities $\pi_i$ by the protocol. SSA posits a protocol: *Given a world $W$ with $N$ observers, the probability that "I" am observer $i$ is $1/N$.*
      *   **Category:** This is a **conditional likelihood on the index**. $P(\text{Index}=i \mid \text{World}=W, \text{Exist}) = 1/N_W$.
      *   **Implication:** It treats the "world" parameters as fixed for the likelihood calculation and asks about the sampling distribution of the index. It implies **no selection bias on the world size** based on existence. Existence is conditioned away.
  *   **SIA (Self-Indication Assumption):** This is **not** purely model-based superpopulation inference. It asserts that the probability of *being sampled at all* is proportional to the number of observers.
      *   **Category:** This is a **selection probability on the world**. $P(\text{Exist} \mid \text{World}=W) \propto N_W$.
      *   **Implication:** This acts as a **likelihood ratio on the world hypotheses**. If you have two worlds, $W_1$ ($N=10^9$) and $W_2$ ($N=10^{100}$), SIA says the likelihood of your data ("I exist") is $10^{91}$ times higher under $W_2$.
      *   **Correction:** In your terms, SIA is not just size-biased sampling; it is **bias in the frame selection itself**. SSA assumes the frame (the World) is selected first, then you are drawn. SIA assumes you are drawn from the union of all possible frames, making larger frames more likely to yield a draw.

  **Summary of Categories:**
  *   **SSA:** Fixes the Prior on Worlds. Specifies a Uniform Likelihood on Observer Index within a World.
  *   **SIA:** Fixes the Likelihood on Existence (proportional to $N$). Effectively modifies the Prior on Worlds by weighting them by $N$.

  ### 2. The Reference Class Problem as a Sampling Frame

  You asked if this is ordinary frame under-specification. It is worse.

  In survey statistics, if the frame is ambiguous (e.g., "households" vs. "persons"), you can usually define a super-frame and post-stratify, or acknowledge coverage error. The frame is ontologically distinct from the sample.

  In anthropics, the **Reference Class is the definition of the sampling unit**.
  *   **Ordinary Under-specification:** "Do we sample households or individuals?" (We can link these via hierarchy).
  *   **Anthropic Reference Class:** "Do we sample 'humans', 'observer-moments', 'conscious entities', or 'civilizations'?"

  **The Structural Difference:** In your work, the unit of analysis is defined by the data collection instrument. In anthropics, *you* are the instrument, and you are trying to infer the definition of the instrument from the data it collected.
  *   **Translation:** This is **endogenous frame definition**. You cannot post-stratify because you do not know the marginals of the "true" frame (you don't know how many observer-moments exist in the universe).
  *   **Verdict:** This is not ordinary under-specification. It is a failure of **identifiability of the sampling unit**. Sensitivity analysis is the only valid statistical response, but unlike survey stats, there is no external census to validate against.

  ### 3. The "I Exist" Datum and Missing Machinery

  You noted that standard likelihoods $P(Data \mid \theta)$ have no slot for "I am this one." You are correct. Standard statistics assumes an **external analyst**.

  *   **The Gap:** Standard likelihoods model $P(\text{Observation} \mid \text{State})$. Anthropics requires $P(\text{Observer} \mid \text{State})$.
  *   **Missing Machinery:** You need a **Self-Location Likelihood Function**.
      *   In survey stats: $P(\text{Respondent answers } Y \mid \text{Population Mean } \mu)$.
      *   In anthropics: $P(\text{I am observer } i \mid \text{World } W)$.
  *   **Neutrality:** Adding this machinery is **not neutral**.
      *   If you define the likelihood as $P(\text{Index} \mid W) = 1/N_W$ (SSA), you assume the "I" is a random draw from an existing set.
      *   If you define the likelihood as $P(\text{Exist} \mid W) \propto N_W$ (SIA), you assume the "I" is a random draw from the set of *possible* observers across all worlds.
      *   **Translation:** The choice of likelihood function *is* the philosophical dispute. There is no "neutral" likelihood for self-location because there is no physical data-generating process specified for "souls" or "minds" entering the world.

  ### 4. Evidential Force of Existence

  You asked: *A datum with equal likelihood under every hypothesis carries no evidential weight. I exist in all worlds I consider. Where is the force?*

  *   **SSA:** Agrees with you. "I exist" is conditioning information, not data. It drops out of the likelihood ratio. The evidential force comes entirely from the **Index** (e.g., "I am born in the 21st century").
      *   **Mechanism:** $P(\text{Index} \mid W_{\text{small}}) > P(\text{Index} \mid W_{\text{large}})$. (You are more likely to be early in a short history).
  *   **SIA:** Disagrees with your premise. It asserts $P(\text{Exist} \mid W_{\text{large}}) > P(\text{Exist} \mid W_{\text{small}})$.
      *   **Mechanism:** It treats "I exist" not as a certainty, but as a **selection event**. If the world were empty, you wouldn't exist. If the world has $10^{100}$ slots for you, the probability of *this* slot being filled is higher.
  *   **Location of Difference:** It is a difference in the **Sampling Model for the Observer**.
      *   SSA: Observer is a fixed entity sampling a world-index.
      *   SIA: Observer is a stochastic output of the world generation process.
      *   **Statistical Term:** SSA treats existence as a **condition**. SIA treats existence as a **random variable**.

  ### 5. Identifiability and Decision-Relevance

  **Identifiability:**
  *   **Strict Sense:** No. With $n=1$ (one observer) and unknown $N$ (population size), $N$ is never identifiable without strong parametric assumptions.
  *   **Model Discrimination:** Yes. The two assumptions yield different posteriors for $N$ given the same index data.
      *   SSA + Early Index $\rightarrow$ Posterior favors Small $N$ (Doomsday).
      *   SIA + Early Index $\rightarrow$ Posterior favors Large $N$ (cancels the index effect).
  *   **Verdict:** They are **non-nested rival models** with different likelihood functions. They are distinguishable by their output, even if the parameter $N$ itself is weakly identified.

  **Decision-Relevance:**
  *   **Yes.** This is not a convention.
  *   **Example:** Betting on the Doomsday Argument.
      *   SSA prescribes betting on "Humanity ends soon."
      *   SIA prescribes betting on "Humanity lasts a long time."
  *   **Example:** Sleeping Beauty.
      *   SSA (Halfer): Bet at 1:1 odds on Heads.
      *   SIA (Thirder): Bet at 1:2 odds on Heads.
  *   **Verdict:** In your field, a choice that changes decision-relevant output is an **assumption worth arguing about**. This is not merely a choice of estimator; it is a choice of loss function over possible worlds.

  ### 6. Verdict on the Residue

  Where does the translation break, and what does it mean?

  **Where it was clean:**
  *   Weighting (SIA weights worlds by $N$).
  *   Likelihood ratios (SSA uses index likelihood, SIA uses existence likelihood).
  *   Decision theory (Dutch books map directly to betting scenarios).

  **Where it distorted:**
  *   **The "I":** In survey stats, if you draw unit $i$, you know $i$ is distinct from the analyst. In anthropics, the analyst *is* $i$. This creates a circularity in defining the frame that standard sampling theory does not accommodate.
  *   **The Frame:** In surveys, the frame exists before the sample. In anthropics, the frame (the set of all observers) is the parameter being estimated.

  **The Verdict:**
  The pattern points to a **gap in the statistical vocabulary**, specifically the lack of a formalism for **endogenous sampling**. Standard statistics assumes the sampling mechanism is exogenous (designed by an external agent). Anthropics is inference *about* the sampling mechanism *by* the sample.

  **Third Option (The Missing Specification):**
  Both SSA and SIA are incomplete specifications of one sampling model. They are **priors on the Data Generation Process (DGP) of observers**.
  *   **Missing Specification:** A physical/causal model linking World Parameters to Observer Instantiation.
      *   If observers are physical substrates generated by cosmic processes (SIA-like), then $P(\text{Exist}) \propto N$.
      *   If observers are pre-existing "minds" assigned to bodies (SSA-like), then $P(\text{Index}) = 1/N$.
  *   **Conclusion:** The dispute is not statistical; it is **ontological**. You are asking for a sampling assumption, but the literature is arguing about the **physics of consciousness**.
      *   If consciousness is a rare property emergent from matter, SIA is the natural likelihood.
      *   If consciousness is a fundamental property "looking through" eyes, SSA is the natural likelihood.

  **Final Advice for a Statistician:**
  Treat SSA and SIA not as inference methods, but as **competing priors on the selection mechanism**. Since you cannot identify the selection mechanism from $n=1$ without assuming it, you must treat the choice as a **sensitivity parameter**. Report your inference under both selection models. If they diverge (as they do in Doomsday), the parameter is **non-identifiable given current data**, and any point estimate is driven entirely by the untestable assumption about the nature of observation.

  In your vocabulary: **The likelihood function is unidentified.** You are attempting to estimate $N$ without knowing $\pi_i$. SSA assumes $\pi_i \propto 1/N$. SIA assumes $\pi_i \propto 1$. Until you have a theory for $\pi$, the inference is under-determined.
