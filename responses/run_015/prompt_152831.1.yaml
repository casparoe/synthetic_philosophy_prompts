          *   Precise disagreements (phrased neutrally/acceptably to both sides).
          *   Cruxes (key pivot points like tacit knowledge vs. codification).
          *   Test cases/predictions for each crux (pre-registered bets/outcomes).
      *   **Format:** Numbered agreed-claims section followed by a disagreements table.
