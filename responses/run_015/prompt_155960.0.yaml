answer: |-
  # Q&A Prep Sheet: Comparative Assertion Norm
  **Audience:** Formal Epistemology (Bayesian/Scoring Rules) + QUD Semantics.
  **Core Thesis:** Assert $p$ iff $p$ is the most probable *complete answer* to the operative QUD (no threshold, no knowledge requirement).

  ---

  ### 1. The "Low-Probability Best Answer" Objection (⚠️ REVISE FLAG)
  **The Question:** "Consider a partition where the probabilities are spread thin: 35%, 33%, 32%. Your norm says you *may* (or perhaps *must*) assert the 35% option because it's the best-supported complete answer. But intuitively, asserting a 35% claim is epistemically irresponsible. Doesn't this show you still need a minimum probability threshold alongside the comparative constraint? If not, aren't you licensing reckless assertion?"

  **The Reply:**
  "This is the strongest pressure point, and I distinguish between *permissibility* and *obligation*. My norm sets a necessary condition for flat assertion: you can't assert $p$ if $q$ is more probable. But I grant that in low-probability spreads, the right move is often to suspend judgment or report credences. However, I resist building a fixed threshold into the *norm of assertion* itself. Why? Because the 'irresponsibility' in the 35% case often stems from practical stakes or the availability of a 'suspension' option in the QUD partition. If 'I don't know yet' is a live alternative in the partition, it might be the most probable answer. If we force the partition to be only substantive answers, then asserting the 35% claim is the best epistemic move available *given the constraint that we must answer*. The intuition that it's 'reckless' often smuggles in a threshold, but in diagnostic contexts (like our valve case), picking the 35% fault is exactly what the mechanic needs to check first. So, I treat the threshold intuition as a pragmatic overlay or a feature of the QUD structure (including suspension as an answer), not a semantic norm."

  **Soft Spot:** You risk conflating "best available answer" with "assertible." If "suspension" isn't a complete answer in your partition, you license asserting very weak claims.
  **⚠️ STRATEGY NOTE:** If they press that "suspension" isn't a complete answer in the relevant partition, **concede this requires revision.** If the view licenses asserting 35% claims without a "none of the above" option, the view is too permissive. Be prepared to say: "If the partition excludes uncertainty, the norm needs a threshold clause. I'm currently exploring whether QUDs always include an uncertainty option."

  ### 2. The Decision-Theoretic/Stakes Objection
  **The Question:** "You're modeling assertion as maximizing probability relative to a partition. But from a decision-theoretic perspective, assertion is an action with costs. If the 45% valve claim leads to a million-dollar repair and the 30% claim leads to a cheap check, shouldn't the *expected utility* determine assertion, not just the probability ranking? Your norm seems to ignore the payoff structure entirely."

  **The Reply:**
  "I agree that practical stakes determine whether you *should* act on the assertion, but I'm isolating the *epistemic* norm of assertion. Think of it like a scoring rule: the norm governs the accuracy of the speech act, not the utility of the downstream consequences. My claim is that you epistemically *violate* the norm if you assert a less probable answer over a more probable one, regardless of stakes. Stakes might silence you (pragmatic encroachment), but they don't change which answer is epistemically best-supported. The norm tells you what fits your evidence; decision theory tells you whether to speak."

  **Soft Spot:** Hard to maintain a pure epistemic/pragmatic divide when assertion is a communicative action. If the audience is strict decision theorists, they may reject "epistemic norms" that ignore utility.

  ### 3. The QUD Gerrymandering Objection (Semantics)
  **The Question:** "The norm relies on the 'operative question.' But questions are cheap. If I want to assert $p$ which is only 40% probable, I can just stipulate a QUD where $p$ is the most probable complete answer (e.g., 'Is it $p$, or $q$, or $r$?' where $q$ and $r$ are even less likely). Doesn't this make the norm trivial? You can always satisfy the norm by manipulating the QUD."

  **The Reply:**
  "The operative QUD isn't up to the speaker; it's fixed by the conversational context and the interlocutors' goals. In the valve case, the question isn't up to the mechanic; it's 'Which valve failed?' imposed by the breakdown. My norm constrains assertion *given* the contextually salient partition. If a speaker artificially narrows the QUD to make a weak claim look strong, they are violating a separate norm of *question-management*, not assertion. The assertion norm kicks in once the QUD is fixed. We shouldn't let the abuse of the QUD parameter invalidate the constraint it places on answers."

  **Soft Spot:** Determining the "contextually salient" QUD is notoriously messy. If you can't formally specify which QUD is operative, the norm lacks predictive power.

  ### 4. The "Why Not Just Report Credences?" Objection (⚠️ HOPE NOBODY ASKS)
  **The Question:** "You're a Bayesian, I'm a Bayesian. We have continuous credences. Why do we need a norm for *flat assertion* at all? Why not just normatively require agents to report their full credence distribution? Your whole project seems to solve a problem created by the artificial binary of 'assertion' rather than engaging with the actual doxastic state."

  **The Reply:**
  "Because communication is bandwidth-limited. Full credence reporting is often too costly or cognitively demanding for interlocutors to process. Flat assertion is a compression algorithm. The norm I'm proposing is the rule for *lossy compression*: when you compress your credences into a binary claim, you must preserve the highest-probability signal relative to the question. We need the norm *because* we can't always report credences, not because credences don't exist."

  **Soft Spot:** If they argue that modern communication allows for easy credence reporting (e.g., forecasting tournaments), the motivation for "flat assertion" norms weakens.

  ### 5. The Conjunction/Coherence Objection
  **The Question:** "Suppose $p$ is the best answer to $Q_1$ and $q$ is the best answer to $Q_2$. Your norm permits asserting $p$ and permits asserting $q$. But it might be that $P(p \land q) < 0.5$, or even that $p \land q$ is inconsistent. Does your norm permit asserting the conjunction? If so, you're licensing probabilistic incoherence."

  **The Reply:**
  "The norm applies to assertions relative to their specific QUDs. Asserting $p$ updates the common ground, which may shift the QUD or the probabilities for $q$. I don't license asserting the conjunction *as a single move* unless $p \land q$ is the best answer to the conjunctive question. Sequential assertion is dynamic; you must re-evaluate the 'best answer' status after the first update. If the conjunction becomes improbable after the first assertion, the norm forbids the second."

  **Soft Spot:** Requires a dynamic update model you might not have fully worked out. Static coherence violations are still possible if the QUDs are independent.

  ### 6. The Partial Answer Objection (QUD Semantics)
  **The Question:** "You restrict the norm to *complete* answers. But much of informative discourse involves partial answers. If I ask 'Who came?' and I say 'John came,' that's a partial answer. Does your norm forbid this? If not, how do you define 'best-supported' for partial answers that aren't mutually exclusive?"

  **The Reply:**
  "I treat 'John came' as a complete answer to the question 'Did John come?' or as a cell in a finer-grained partition. Alternatively, we can extend the norm: assert $p$ if $p$ raises the probability of the true complete answer more than any alternative partial answer. But my core thesis is about *flat* assertion, which typically targets cells in a partition. Partial answers are often just assertions relative to a sub-question. I'm happy to extend the view, but the comparative logic remains: you assert the partial info that is best supported relative to the alternatives."

  **Soft Spot:** "Complete answer" is a technical term that might not map well to natural language assertion.

  ### 7. The "Knowledge as Special Case" Objection
  **The Question:** "You say knowledge is just the special case where the QUD is Yes/No and probabilities are high. But in a Yes/No question, if $P(p) = 0.6$, your norm permits assertion. Standard intuition says you don't *know* $p$ at 0.6. So you're divorcing assertion from knowledge entirely. Why keep the terminology of 'norms' which usually links to knowledge?"

  **The Reply:**
  "I'm not trying to save the Knowledge Norm; I'm replacing it. The intuition that assertion requires knowledge is an artifact of focusing on high-stakes, Yes/No questions where the probability threshold for 'best answer' coincides with knowledge. In lottery cases or diagnostic cases, the 'knowledge' intuition fades, but the 'best answer' intuition remains. I'm arguing we should generalize from the cases where the Knowledge Norm works, not restrict ourselves to them."

  **Soft Spot:** You are explicitly rejecting a major literature. Ensure you don't sound like you're ignoring the benefits of the Knowledge Norm (e.g., explaining Moorean paradoxes).

  ### 8. The Update Dynamics Objection
  **The Question:** "If assertion updates the common ground by adding the content, how does your norm handle false assertions? If I assert the 45% valve and it's wrong, did I violate the norm? No, because it was the best supported. So your norm allows updating the common ground with falsehoods systematically. Doesn't this break the link between assertion and truth-tracking?"

  **The Reply:**
  "Assertion is fallible. The norm is about *justification*, not success. A scoring rule penalizes you for being wrong, but it doesn't say you violated the rule by maximizing expected score. Similarly, my norm says you asserted *properly* given your evidence, even if the world didn't cooperate. Truth-tracking is a long-run property of following the norm, not a requirement for every single move."

  **Soft Spot:** Formal epistemologists like proper scoring rules that penalize inaccuracy. If your norm doesn't penalize false assertion, it might look like it's not an *accuracy-first* norm.

  ---

  ### ⚠️ CRITICAL STRATEGY FLAG
  **The "Revise" Objection:** #1 (Low-Probability Best Answer).
  **Why:** If you cannot explain why asserting a 35% claim is permissible (or explain why "suspension" is always a live alternative in the partition), the "No Threshold" core of your thesis collapses. If they corner you on the 35/33/32 case, **do not bluff.** Say: *"That's the boundary condition I'm currently testing. It may require a hybrid view where a minimum probability floor is needed alongside the comparative constraint."* This shows intellectual honesty and saves you from defending an indefensible position.

  ### 🤫 THE "HOPE NOBODY ASKS"
  **Question #4 ("Why Not Just Report Credences?").**
  **Why:** If the audience decides that "flat assertion" is an obsolete category and we should just communicate probability distributions, your entire project loses its subject matter. It undermines the *need* for a norm of assertion. If asked, pivot hard to "bandwidth limits" and "cognitive load," but be aware this is the existential threat to the project from a formalist audience.
