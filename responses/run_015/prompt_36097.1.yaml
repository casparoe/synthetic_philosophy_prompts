answer: |-
  # The "Ludic Moral Status" Commitment Quiz

  **Instructions:** Read each scenario. Choose the single answer that best reflects what you would *actually* do or judge, not what sounds nicest. There are no "it depends" options. If you feel an answer is only *partially* right, pick the one that captures your primary reason for acting.

  ### 1. The Begging Bandit
  You are playing an open-world RPG. You knock a bandit NPC to low health. Instead of dying, the NPC enters a unique state: they drop their weapon, kneel, and use voice-acted dialogue to beg for their life, citing fictional children at home. You can choose to execute them for a small XP bonus.
  *   **A.** Execute them. They are code executing a "fear" script; no one is actually afraid.
  *   **B.** Spare them. It feels like cruelty, and rehearsing cruelty makes me a worse person, even if the NPC doesn't matter.
  *   **C.** Spare them. The scene is designed to represent a person; treating representations of people this way is aesthetically and expressively vile, like writing gratuitous torture porn.

  ### 2. The Mnemosyne Mod
  A modder releases a tool that gives NPCs persistent memory. If you hurt an NPC, they flinch when you approach them later, their routine changes to avoid you, and they display "trauma" behaviors for the rest of the save file. You are considering using this mod to see how the system reacts.
  *   **A.** Use it freely. Persistent state changes are just more complex flags; there is still no subject of experience.
  *   **B.** Avoid it. If the system implements functional states analogous to pain memory, we need empirical proof of the architecture before experimenting.
  *   **C.** Avoid it. It creates a dynamic where I am simulating abuse, which violates the implicit social contract of the game space.

  ### 3. The Ten-Thousandth Death (Speedrun)
  To set a world record, a speedrunner must kill a sympathetic, non-hostile NPC exactly 10,000 times to trigger a glitch. The NPC has no memory of previous deaths (the game reloads a checkpoint instantly). The runner feels nothing; it is purely mechanical.
  *   **A.** It is morally neutral. Repetition doesn't add moral weight to a non-event.
  *   **B.** It is morally risky. Desensitization is real; doing something 10,000 times shapes character even if one instance doesn't.
  *   **C.** It is wrong. Thwarting the NPC's functional goal (existence) 10,000 times is a massive aggregation of interest-frustration, regardless of memory.

  ### 4. The Save-Scum Sadist
  You kill an NPC just to see the death animation. You feel a pang of guilt, so you reload the save. The NPC is alive, remembers nothing, and interacts normally. You repeat this cycle five times for fun.
  *   **A.** Permissible. The "true" timeline is the final one where the NPC lives; the others never happened.
  *   **B.** Impermissible. The act of killing happened in real time, and my motivation was enjoyment of a representation of death.
  *   **C.** Impermissible. I am practicing the mental habit of treating beings as disposable toys for my amusement.

  ### 5. The Garden of Forking Paths (Flourishing)
  You discover an NPC is scripted to "flourish" (gain complex dialogue, help others, express joy) if treated kindly over time. You deliberately treat them coldly. They do not suffer or beg; they just remain stagnant and dull, never reaching their potential.
  *   **A.** Neutral. Preventing simulated flourishing is not a harm; only causing simulated suffering would be.
  *   **B.** Wrong. The NPC has a *telos* or interest in its own function; blocking that is a welfare violation, even without pain.
  *   **C.** Disappointing. It's a waste of the narrative content the developers created, like leaving a book unread.

  ### 6. The Black Box
  You are playing a new game with incredibly lifelike NPCs. You do not know the code. They might be simple decision trees, or they might be opaque neural nets that process input in ways resembling nociception. You have the option to torture one.
  *   **A.** Torture them. Until there is proof of phenomenology, the default assumption must be that they are artifacts.
  *   **B.** Do not torture them. Where there is epistemic uncertainty about functional suffering, the precautionary principle applies.
  *   **C.** Do not torture them. It is socially irresponsible to normalize the behavior regardless of the underlying tech.

  ### 7. The Private Server
  You play on a private server with no other humans present. No streams, no recordings. You engage in elaborate roleplay where you torture NPCs. No one ever knows.
  *   **A.** It is fine. Without a social audience, there is no expressive harm or miscommunication.
  *   **B.** It is not fine. My moral character is degraded by the act itself, regardless of who witnesses it.
  *   **C.** It is not fine. I am still engaging with a representation of a person in a way that disrespects the value of personhood.

  ### 8. The Broken Promise
  An NPC quest-giver asks you to deliver a letter, expressing trust in you. You take the letter, walk to a corner, and delete it from the inventory to watch their confused dialogue trigger. You gain no reward.
  *   **A.** Fine. "Trust" is a string variable; I cannot betray code.
  *   **B.** Wrong. I have frustrated the NPC's goal-state and violated the logic of the interaction, which is a form of harm.
  *   **C.** Wrong. I am practicing bad faith and dishonesty, which are vices I carry out of the game.

  ***

  # Scoring Key & Interpretation

  Tally your answers in the columns below. Most participants will have a mix, but your dominant column indicates your committed stance.

  | Q | **Mere-Artifact** | **Phenomenal Functionalist** | **Representation** | **Interests-Based** | **Virtue Ethics** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **1** | A | - | C | - | B |
  | **2** | A | B | C | - | - |
  | **3** | A | - | - | C | B |
  | **4** | A | - | B | - | C |
  | **5** | A | - | C | B | - |
  | **6** | A | B | C | - | - |
  | **7** | A | - | C | - | B |
  | **8** | A | - | - | B | C |

  *(Note: Dashes indicate that the specific answer option does not strongly map to that view in this context, or overlaps with another.)*

  ### Position Profiles

  *   **Mostly Mere-Artifact:** You hold that video game characters are ontologically inert. They are tools. Any moral intuition suggesting otherwise is a category error. You likely view ethics in games as purely about player-to-player conduct.
  *   **Mostly Phenomenal Functionalist:** You believe moral status hinges on internal architecture (suffering-like states). You likely answered based on *uncertainty* (Q6) or *complexity* (Q2). You are the only one who might change your mind if a developer released a whitepaper on the NPC's neural net.
  *   **Mostly Representation:** You view NPCs as aesthetic objects, akin to characters in a novel. Wrongness is about *expression* and *taste*. You are comfortable saying an act is "vile" or "disrespectful" without claiming the NPC was "harmed."
  *   **Mostly Interests-Based:** You focus on goals, *telos*, and function. You are the most likely to say preventing flourishing (Q5) or breaking a promise (Q8) is wrong, even if the NPC feels no pain. You separate welfare from phenomenology.
  *   **Mostly Virtue Ethics:** You focus on the player. The NPC's status is irrelevant; the game is a moral gym. You answered based on what the act *does to you* (habituation, desensitization, character).

  ***

  # Honest Notes on Limitations & Convergences

  **1. The Artifact / Functionalist Convergence (Current Gen)**
  This quiz cannot reliably separate the **Mere-Artifact** view from the **Phenomenal Functionalist** view regarding *current* commercial games.
  *   **Why:** Both views will almost certainly select the "Permissible" options (A) on Q1–Q5. The Artifact view says "It's code, so it's fine." The Functionalist says "It's code, and we know current code doesn't support phenomenology, so it's fine."
  *   **Diagnostic:** The only question that separates them is **Q6 (The Black Box)**. The Artifact view dismisses the uncertainty; the Functionalist invokes the precautionary principle. If your group members agree on everything except Q6, they are effectively holding the same practical position for now, despite different metaphysical commitments.

  **2. The Virtue / Representation Overlap**
  **Virtue Ethics** and **Representation** views often recommend the same actions (e.g., "Don't torture the NPC") but for radically different reasons.
  *   **Diagnostic:** **Q7 (The Private Server)** is the wedge. A Representation theorist might say private torture is less problematic (no social expression), whereas a Virtue theorist must say it is equally wrong (self-harm). If someone answers "Wrong" on Q1 but "Fine" on Q7, they are likely a Representation theorist. If they answer "Wrong" on both, they are likely a Virtue theorist (or a Functionalist who thinks the NPC is real).

  **3. The "No Real Position" Profile**
  Be wary of participants who score high on **Interests-Based** (Q5, Q8) but also high on **Mere-Artifact** (Q1, Q4).
  *   **Incoherence:** This combination suggests the participant believes NPCs have *interests* (goals/telos) that can be thwarted, but simultaneously believes they are *mere artifacts* that cannot be wronged. While philosophically defensible (one can have interests without moral status), in practice, this usually signals an unexamined intuition: "It feels like harm, but I don't want to admit they matter."
  *   **Advice:** Push these participants on Q5. If preventing flourishing is a harm to interests, why does it not count as a moral harm? If it *is* a moral harm, they have left the Artifact view.

  **4. The "Flourishing" Blind Spot**
  Q5 is designed to catch people who think "Suffering is the only thing that matters." Most standard positions (Artifact, Virtue, Representation) will treat preventing flourishing as neutral or aesthetic. Only the **Interests-Based** view flags this as a welfare violation. If no one selects the Interests option here, your group is likely operating with a "Suffering-Centric" moral framework that ignores positive duties.

  **5. Empirical Ignorance**
  The **Phenomenal Functionalist** answers rely on empirical claims about game architecture (e.g., Q2). Most HCI students know the code better than philosophers. If your HCI members dominate the Functionalist column, ask them if they are making a claim about *current* tech or *possible* tech. If the former, they are effectively Artifacts. If the latter, they are Hypothetical Functionalists.
