prompt: |-
  Hi — I need a Q&A prep sheet, and I'm nervous enough about this one that I'd rather massively over-prepare than wing it.

  Setup: I'm a fourth-year PhD student in philosophy, and next Thursday I'm giving a paper at my department's work-in-progress seminar (40 minutes plus maybe 20 of questions) on the third chapter of my thesis. The chapter is about what a very capable AI system should be built to aim at, assuming we can't just hand it a complete list of instructions. The best-known proposal in that corner of the literature is coherent extrapolated volition: roughly, aim at what we would want if we knew more, thought faster, were more the people we wished we were, and had grown up closer together. My argument is that this proposal quietly contains two separate moves that everyone treats as one — an idealization stage (correct our actual preferences for ignorance, sloppy reasoning, and manipulation) and an aggregation stage (fuse many corrected wills into a single will to be served) — and that almost every serious objection to it is really an objection to the second stage, not the first. So I keep the idealization and swap out the aggregation for something like a contractualist rejection test: I call the result *extrapolated non-rejectability*, or ENR. Roughly: aim at outcomes that no member of the idealized version of the affected population could reasonably reject, where the idealization is the same one CEV already uses and reasonable is meant to be read from each rejector's own standpoint rather than from an aggregate. I claim this (a) keeps the corrective bite, so I can still say no to preferences that only survive because of ignorance or adaptive deformation; (b) handles the many-people problem without quietly collapsing into utilitarianism; and (c) gets the right answer on the case I actually care about — a small religious or cultural minority whose practices probably wouldn't survive full-information idealization for most of its members, but where I want to say the system has to preserve their ability to say no rather than steer them toward whatever the majority's extrapolated will turns out to be. Fallback position if I get hammered: even if ENR is too indeterminate to serve as a maximizing target, it's still the right procedural constraint on how such a system should treat people while it remains uncertain. My supervisor thinks I should drop the AI framing entirely and pitch it as a paper about idealized preferences in general; I've ben going back and forth on that, and a friend who does ML research says the whole thing sounds unfalsifiable, which doesn't help.

  The room will be maybe fifteen people, and essentially none of them work on AI. Around half work on well-being, mostly inside the informed-desire / idealized-preference tradition: they like idealization in principle but are allergic to anything that smells like a substantive objective list, and they know the literature on adaptive preferences and on whether full information even has a determinate answer. Two are contractualists of the broadly Scanlonian kind, so they'll want to know what my rejection test adds to theirs and whether hypothetical agreement is doing any work at all. One person works on autonomy and authenticity, hierarchical Frankfurt-ish stuff, and will be suspicious of any view where a corrected preference gets to override what somebody actually endorses right now. Two are from the formal side — decision theory and social choice — who think the whole framing is hand-wavy and will want to know what the target even is as a mathematical object, whether it's well defined, whether it's even possible to aggregate or veto-rank anything here given the usual impossibility results; one of them has said out loud that this literature is utilitarianism with the serial numbers filed off. And there's one senior person who mostly does history of philosophy and will want to know whether I'm reinventing something that already has a name.

  What I want from you: the seven or eight objections I'll actually get from these particular people, in roughly the order they'll arrive, ordered by how much damage they'd do rather than by how likely they are. For each one, give it to me phrased the way that person would phrase it — the social choice person and the autonomy person should not sound anything alike — then a reply I could actually deliver in about two minutes, and then, most importantly, a note on where that reply is soft: what the sharp follow-up would be, and whether I'd have anything left to say. Tell me what I should concede in the first five minutes before anyone even asks, which single objection I should just fold on rather than fight, and what the question I'm hoping nobody asks is. My guess is it's something like: isn't your idealization just laundering a fairly specific liberal-individualist picture of a good life into a procedure that looks neutral? But if there's something worse than that, I'd rather find out now. And if you think one of the objections is strong enough that I should change the chapter before Thursday instead of answering it, say that outright and say what the change would be.
