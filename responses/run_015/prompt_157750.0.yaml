          5.  Contractualist Redundancy (Makes it unnecessary).
          6.  Operationalization (Makes it irrelevant for AI).
          7.  History (Embarrassment).

      *   *Refining the "Fold" and "Concede":*
          *   *Concede Upfront:* The "AI framing" vs. "Pure Theory" tension. Acknowledge the idealization is under-specified.
          *   *Fold On:* The Formal/Impossibility objection. Don't claim it's a solvable optimization problem. Admit it's a regulatory constraint.
