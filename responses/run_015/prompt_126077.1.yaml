  **Welcome to the Hilbert Grand**

  Welcome to the Hilbert Grand, where capacity is not a constraint but a definition. Our No Vacancy sign is lit and true; we are permanently fully occupied, yet permanently able to accommodate you. Upon arrival, the concierge will be delighted to instruct current guests to relocate. The occupant of room $n$ is asked to move to room $2n$. This frees every odd-numbered room for your party. You will observe that our establishment possesses exactly as many rooms as it has odd-numbered rooms. Please note: an establishment which forbade rehousing its guests in a proper part of itself would be a fundamentally different sort of establishment.

  **Group Bookings**
  A single coach with countably many passengers is no trouble; we house them in the even rooms. Countably many such coaches arriving on the same night are no trouble either. We assign the passenger $p$ from coach $c$ to room $2^c 3^p$. Unique factorization ensures no double bookings. However, a delegation whose members carry name-badges labelled by the real numbers between 0 and 1 cannot be housed at all. Our manager offers this honest explanation: for any list of assignments you propose, we can construct a guest whose decimal expansion differs from the $n$th guest on your list in the $n$th place. They simply do not fit.

  **Dining**
  Our kitchen maintains a master list of every possible room-service order. Should you ask for the meal that differs from the $n$th meal on the list in the $n$th ingredient, the kitchen can describe your order perfectly. However, they cannot prepare it, as it appears nowhere on the master list. We apologize for the culinary paradox.

  **The Ordinal Wing**
  In this annex, rooms are labelled by ordinals that admit a finite notation. There are still only countably many of them, and the wing too is always full. Our lift moves one successor step at a time; consequently, no guest ever arrives at a room with no immediate predecessor. During the fire drill, each guest proceeds to the room whose number is the immediate predecessor of their own. This procedure leaves the occupants of exactly those rooms without predecessors standing in the corridor. Safety is paramount, even for limit ordinals.

  **Cloakroom & Lounge**
  Our attendant takes in two coats and hands back the lowest-numbered one at the half hour, the quarter hour, and so on, halving the interval toward 10:00. At 10:00, the cloakroom is empty, although it had been getting fuller at every earlier moment. In the residents' lounge, a lamp toggles on and off at each interval. At 10:00, nobody can say whether the lamp is on or off. We recommend bringing a flashlight.

  **Sidebar: Note from the Night Auditor**
  *I am a strict finitist. I do not deny your experience; I deny the completion of the count. For any finite number of guests you care to bring me, I can find rooms. Name a number, and I have space. But 'all numbers' is not a number I can name. I can always add one more, but I never hold the totality at once. My ledger is always open, never closed.*

  **External Relations**
  A delegation from the Society for Strictly Finite Accommodation may picket outside. Their placards read: "FINISH THE COUNT FIRST" and "NO VACANCY FOR TOTALITIES." These slogans their position actually licenses.
