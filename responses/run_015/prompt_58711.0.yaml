          *   Experts (hydrologists, economists, non-voting).
          *   2 local reporters.
      *   **Constraints:** 6-8 minutes (approx. 900-1200 words spoken at a moderate pace).
      *   **Tone:** Warm, sober, civic (not festive, not professorial). Accessible to an 18-year-old worker and a 70-year-old retiree, yet rigorous enough for political scientists.
      *   **Key Content Requirements:**
          *   Welcome without condescension.
          *   Democratic framing (justificatory work, not just celebration).
          *   Explain *why* sortition (lottery) confers authority (descriptive likeness, freedom from campaign incentives, rotation of responsibility).
          *   Preempt three specific doubts:
              1.  Lottery = abdication of judgment/coin flip.
              2.  Ordinary residents lack technical competence.
              3.  No electoral accountability (disbands after recommendation).
          *   Acknowledge Council members graciously but don't concede elections are the *only* source of legitimacy.
          *   Translate commitments into working norms (listening, sharing time, experts as input not substitute).
          *   Closing: Build trust in process and capacity.

  2.  **Determine Structure & Flow:**

      *   **Opening (1 min):** Welcome, acknowledge the strangeness of the moment, validate skepticism.
      *   **The "Why" (2-3 mins):** The democratic theory of sortition (likeness, independence, rotation). Address the "coin flip" doubt here.
      *   **The "How/Competence" (2 mins):** Address the technical doubt. Experts are resources, not rulers.
      *   **The "Accountability" (1-2 mins):** Address the accountability doubt. Accountability to neighbors/conscience vs. voters. Acknowledge Council.
      *   **Norms & Closing (1-2 mins):** Working agreements. Call to action/Trust.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start by grounding the room. Acknowledge the skepticism ("scam letter"). It builds rapport. Welcome the Council members respectfully but firmly establish the Assembly's independence.
      *   *The Theory (Sortition):* Need to explain *why* a lottery isn't random chaos. Use the analogy of a jury. It's about *representation* of the whole, not just the loud.
          *   *Key phrase:* "Descriptive likeness."
          *   *Key concept:* No fundraising, no reelection.
      *   *Addressing Doubt 1 (Abdication):* It's not a coin flip for a decision; it's a coin flip for *who gets to work*.
      *   *Addressing Doubt 2 (Competence):* Water science is hard. But values are not. You don't need to be a hydrologist to decide what kind of city you want to live in. Experts advise; you decide.
      *   *Addressing Doubt 3 (Accountability):* They don't face voters. True. They face each other and the future. The Council still votes, but this recommendation carries weight because of *who* made it.
      *   *Norms:* Listen to disagree, not to rebut. Share the air.
      *   *Closing:* Remind them of their capacity. This is hard work, but they are the right people.

  4.  **Refining Tone and Language:**

      *   *Avoid:* Jargon like "deliberative democracy" without explanation, overly bureaucratic language, overly emotional appeals.
      *   *Include:* Plain English, respectful but firm assertions of authority.
      *   *Timing Check:* A 7-minute speech is roughly 1,000 to 1,100 words at a measured pace. I need to ensure I don't write too much.
      *   *Political Science Check:* Ensure the arguments for sortition (descriptive representation, independence from capture, rotation) are accurate.
      *   *Council Check:* Don't alienate the 3 dissenters. Acknowledge their role without undermining the Assembly.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Welcome everyone. I know some thought this was spam. Thanks for coming. Council members, glad you're here. Why are we here? Because elections pick winners, but lots pick neighbors. This isn't a coin flip for the answer, it's a pick for the workers. You aren't experts, but you know what you value. Experts help you. You aren't elected, but you are accountable to the truth and the city. Council will still vote, but they need your voice. Let's listen well. You can do this.

  6.  **Drafting - Iteration 2 (Fleshing out the arguments):**
