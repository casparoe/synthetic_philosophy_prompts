answer: |-
  Good morning. Thank you for being here.

  I know that for some of you, the letter inviting you to this room looked like junk mail. I know that for others, the idea of spending weekends discussing water tables and runoff coefficients sounds like a distraction from work, family, and life. And I see elected officials in this room who questioned whether this body was necessary at all. I mention this not to dismiss those doubts, but to honor them. Skepticism is a healthy starting point for public work. It means you take your time seriously.

  I am the Deputy City Manager, but I am not here to manage you. Over the next several weekends, I serve this room. You have been convened as the city's first Citizens' Assembly. Your task is to recommend a ten-year plan for water rationing and agricultural runoff.

  I want to be clear about why you are here, and why you were chosen the way you were.

  In our usual politics, we choose leaders by election. Elections are vital. They allow us to hire and fire our representatives. But elections also filter for people who want power, who can raise money, and who must constantly worry about the next campaign cycle. That is a specific kind of legitimacy. It is not the only kind.

  You were selected by stratified lottery. This is not a coin flip to decide the outcome. It is a method to decide *who gets to work*. It is the same logic used in jury duty. By random selection, adjusted to match the demographics of our city, you become a mirror of the community. You are not a special interest group. You are the city, in miniature.

  This confers a distinct authority. First, you possess **descriptive likeness**. You look like our neighborhoods, our income brackets, and our ages. When you speak, the city hears itself. Second, you have **freedom from campaign incentives**. You do not need to fundraise. You do not need to worry about reelection. You are free to weigh the long-term good without calculating the political cost. Third, you represent the **rotation of responsibility**. In a democracy, the burden of governing should not rest on the same shoulders forever. Today, it rests on yours.

  I anticipate three concerns sitting at this table, and I want to address them directly.

  The first is that selection by lot is an abdication of judgment. Some might say, "Why not pick the smartest people?" But "smart" in politics often means "experienced at winning." We are not looking for professional politicians. We are looking for common sense grounded in diverse experience. The lottery does not remove judgment; it removes the filter of ambition.

  The second concern is competence. Water science is complex. Hydrology and economics are technical fields. You are not expected to become hydrologists this weekend. That is why our advisers are here. But technical models can tell us what is *possible*; they cannot tell us what is *right*. Only you can decide the balance between agricultural viability and household security. Only you can weigh the cost of conservation against the risk of shortage. We need your values, not just your calculations. Treat the experts as resources, not rulers. Their data is an input to your judgment, not a substitute for it.

  The third concern is accountability. You will not face voters at the end of this process. This body will disband after you issue your recommendation. So, to whom are you accountable? You are accountable to your neighbors in this room. You are accountable to the public record of your deliberations. And you are accountable to the future residents who will drink the water you plan for.

  To our City Council members: thank you for attending. This Assembly does not replace your authority. The final vote on policy remains yours. But your vote will be informed by the considered judgment of the people you represent. For those Council members who voted against convening this body, I respect your position. But I ask you to witness that this experiment is not a challenge to your office, but a reinforcement of our shared democratic infrastructure.

  So, how do we proceed?

  Legitimacy is not just given; it is earned through how you treat one another. Over the coming weeks, I ask you to adopt three norms.

  First, **listen across disagreement without campaigning.** You are not here to win a debate or secure a bloc vote. You are here to find a path that the city can walk together. If you speak, make room for someone who hasn't.

  Second, **share the air.** We have seventy-five members. Some of you are used to running meetings; others are used to being ignored by them. Leave those roles at the door. Here, every voice carries equal weight.

  Third, **trust your own capacity.** You were not chosen because you are easy to manipulate. You were chosen because you live here. You know what it costs to fix a leak, what it means to farm this soil, and what it feels like to worry about the bill at the end of the month. That knowledge is as vital as any dataset.

  This work will be difficult. The water challenges we face are real, and the trade-offs are sharp. There will be moments of frustration. But I ask you to trust the process, and more importantly, to trust the person sitting next to you.

  You are the city. You have the time. You have the authority. And you have the capacity to get this right.

  Thank you. Let's begin.
