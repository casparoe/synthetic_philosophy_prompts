  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired experimental physicist, now studying moral philosophy. Approaches ethics with an eye for formal structure (like measurement theory). Values precision, distinction between empirical contingency and formal necessity, and clear delineation between established scholarship and debate.
