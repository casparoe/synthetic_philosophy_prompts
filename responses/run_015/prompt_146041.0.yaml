  **The Convoy**

  The coffee from the machine tasted like burnt pennies, but Elias drank it anyway. The steam vanished instantly in the cold air of the car park. Beside him, Sarah leaned against the hood of her sedan, watching her own breath plume and dissolve. Above them, the sodium light flickered with a rhythmic buzz, the only sound besides the distant hum of the highway they were about to join.

  They had worked the night shift at the hospital for twenty years. They knew the road home. They knew the fog that rolled off the lake around 3:00 AM, thick enough to swallow headlights. They knew the three turnoffs.

  Same angle. Same cracked stop sign. Same flickering light.

  And they knew the condition. It wasn't a medical diagnosis; it was just a fact of the road, like the gradient or the surface tension of the ice. When you arrived at a turnoff, the last few minutes wiped clean. You couldn't remember passing the previous one. You couldn't count. You couldn't tell if this was the first, the second, or the third.

  "If we split up," Elias said, staring into his cup, "we miss each other."

  Sarah nodded. "Independent randomness. Even if we agree on the odds, the coin flips don't match."

  "If I turn at the first, and you go to the second..."

  "Then I'm home in a warm bed, and you're in the laundromat car park," Sarah said. "And we don't get the bonus."

  The bonus was the only thing that mattered anymore. Two points for spending the night in the same place. If they matched, the laundromat was worth three. Home was worth six. The lake road was worth four. If they missed the turnoffs entirely, the road ended at a locked gate in the fog. Zero. And no bonus. Alone in the cold.

  "If we drive separately," Sarah said, her voice flat, "we have to guarantee the match to beat the risk. That means we both have to agree to take the first turnoff. Every single night."

  Elias flinched. The laundromat meant sleeping in the car with the engine running. It meant the smell of damp lint and the stray cat that scratched at the windows. It meant waking up with a back that seized for hours. "Always the first one? That's... that's surrendering."

  "It's the math, Elias. If we randomize separately, we mismatch half the time. Without the bonus, home is only four. The laundromat is one. The average drops below three. The only way to secure the bonus separately is to never risk going past the first exit."

  "I hate that," Elias said. "I hate that the safe bet is the worst place."

  "Then we don't drive separately." Sarah pushed off the hood. "We convoy. You lead. I follow your brake lights."

  Elias looked at her. "If I follow your lights, I know where you turn. We end up in the same place."

  "Unless you lose me in the fog," she said. "But if we stay close, the bonus is folded into every outcome. The gate is the only place we don't get it. So the values change. Laundromat is three. Home is six. Lake is four. Gate is zero."

  "And because we're one unit now," Elias said, "I decide for both of us."

  "You decide for both of us," Sarah confirmed. "But you can't just aim for home. If you try to go for home every time, you'll miss the turnoffs. You'll hit the gate. Zero."

  "I need a probability," Elias said. "A chance to continue."

  "Not too high," Sarah said. "If you always continue, you hit the gate. If you always turn, you get the laundromat. You need to turn most of the time, but not always. Enough to catch the home exit, but not so much that you drift into the lake or the gate."

  Elias closed his eyes. He could feel the road in his head. The first exit came quickly. The second was a stretch. The third was near the end. If he continued past the first, he might hit the second. If he continued past the second, he might hit the third. If he continued past the third, he was at the gate.

  "If I'm at an exit," Elias said, "I don't know which one it is."

  "But you know the plan," Sarah said. "You know you continue only about a third of the time. So statistically, if you're at an exit, it's most likely the first one. Because you stop there most often."

  "So if I'm there," Elias said, "I should probably turn. Because it's probably the first one."

  "But if it is the first one," Sarah countered, "turning gives you three. Continuing gives you a chance at six. So you want to continue."

  "But if you continue too often," Elias said, "the probability shifts. You start hitting the gate."

  "It pulls both ways," Sarah said. "That's why you have to stick to the number. Not a coin. Just... feel the odds. Don't stop unless you have to. But stop often enough."

  Elias finished the coffee. It was cold now. "Okay. I lead. You watch my lights. Don't lose me."

  "Never," Sarah said.

  They got in their cars. Elias pulled out first, Sarah trailing ten yards behind. The fog was waiting. It closed around them the moment they left the car park, a wet grey wool that muffled the engine noise. The road was a tunnel of light, the yellow lines barely visible beneath the mist.

  Ten minutes in, the first sodium light flickered ahead. The cracked stop sign emerged from the grey like a bone.

  Elias slowed. His foot hovered over the brake.

  *Where am I?*

  The question was automatic. The memory of the car park was gone. The memory of the decision was gone. There was only the light, the sign, and the brake lights of Sarah's car glowing red in the rearview mirror.

  He knew the plan. He knew he should continue most of the time. But the belief washed over him: *If I'm here, I'm probably at the first one.* Because if he usually stopped at the first one, then most times he arrived at an exit, it was the first.

  If it was the first, the payoff was three. The laundromat. Safe. Warm enough.

  But if he continued, he might get home. Six points. A bed.

  The pull to continue was strong. The laundromat was a failure. But the gate was a disaster. Zero.

  He looked at Sarah's lights. They were steady. She was waiting. She trusted him to compute the probability she couldn't see.

  *If I turn now, I guarantee three. If I continue, I risk zero for a chance at six.*

  The math said continue only thirty-six percent of the time. That meant stopping was the default. But the desire to avoid the laundromat screamed at him to go.

  Elias lifted his foot off the brake. He accelerated.

  Sarah's car moved with him. They passed the stop sign. The fog swallowed the light behind them.

  Time dissolved. The road unspooled. Another flicker ahead. Another cracked sign.

  *Where am I?*

  The feeling was identical. The same angle, same light, same fog. It could be the first one again. It could be the second.

  *If I'm here, I'm probably at the first one,* the thought repeated. It was the same thought as before. The memory wipe ensured the belief state was stationary. He couldn't learn from the fact that he had already passed one.

  But the reality was different. He had already continued once. The risk of the gate was higher now.

  *Turn now,* the instinct said. *Take the three. Don't risk the zero.*

  But if this was the second exit, turning meant home. Six.

  He looked at the brake lights. They were closer now. Sarah was holding the distance. She was part of the calculation. If he turned, she turned. They would be together. If he went to the gate, they would be alone.

  The bonus was folded in. The loneliness was the real cost.

  Elias pressed the brake. The red lights flared brighter. Sarah's car slowed behind him. He signaled. The wheel turned.

  The car rolled onto the side road. The fog thinned slightly. The familiar slope of their driveway appeared beneath the wheels. The house sat dark and solid against the hill.

  He put the car in park. Sarah pulled in beside him. She killed her engine and stepped out into the cold, walking over to his window.

  Elias rolled it down.

  "Second one?" she asked.

  "I think so," Elias said. He didn't know. He couldn't know. But the driveway was here. The gate was behind them.

  "You hesitated," Sarah said.

  "At the first one," Elias said. "I wanted to turn. It felt like the first one. It felt like we should stop."

  "But you continued."

  "Because if it was the first, stopping was a waste."

  "And this time?"

  "This time," Elias said, looking at the house, "the fear of the gate was louder than the hope for home."

  Sarah nodded. She understood. The math held. The belief was the same, but the stakes had shifted, even if they couldn't remember why. They had beaten the odds. They had matched. They were home.

  "Come inside," she said. "Coffee that doesn't taste like pennies."

  Elias got out of the car. He looked back at the road. The fog was already filling the space where they had turned. In an hour, they would leave for the night shift. They would stand in the car park. They would make the plan again. And Elias would know, with a certainty he couldn't explain, that he would hesitate at the first light, and pray he didn't stop.
