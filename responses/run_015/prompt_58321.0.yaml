      *   *The Evidence:* Pain Asymbolia (patients feel pain but don't mind it).
      *   *The Challenge:* Students often confuse "not minding pain" with "not feeling pain" or "being brave."
      *   *The Goal:* Get students to see the conceptual space for a sensory-affective dissociation.

  3.  **Drafting the Sequence (Step-by-Step):**

      *   **Phase 1: Prerequisites (0-10 mins):** Before introducing the pathology, what concepts need to be solid?
