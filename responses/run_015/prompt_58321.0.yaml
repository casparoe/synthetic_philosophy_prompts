          *   *Better Idea:* Ask about the *motivation*. If the pain isn't bad, why avoid injury? Or, ask them to describe the "hurt" without the "ouch."
          *   *Selected Probe:* "Describe the sensation remaining if the 'badness' is subtracted."

      *   **Phase 5: Setting Aside Complexities (45-50 mins):**
          *   What's too hard for 2nd years?
