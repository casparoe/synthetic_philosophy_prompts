          *   *Action:* Elicit a standard phenomenological description from students.

      *   **Phase 2: The Anchoring Case (10-25 mins):**
          *   Need a specific vignette. Let's call it "Patient K."
          *   *Must Include:* "It hurts in my foot," "It's a 7/10," but smiles when poked, doesn't pull away, says "It bothers me but I don't care."
          *   *Must Exclude:* Nerve damage (insensitivity), intoxication, stoicism.
          *   *Action:* Present the case, then interrogate the coherence.

      *   **Phase 3: Intercepting Misunderstandings (25-35 mins):**
