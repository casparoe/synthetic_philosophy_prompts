          *   *Misunderstanding 2:* "They are just tough." (Confusion with Tolerance/Stoicism). *Intercept:* Point to the lack of autonomic withdrawal and the self-report of non-unpleasantness.
          *   *Action:* Use Socratic questioning to block these exits.

      *   **Phase 4: The Final Probe (35-45 mins):**
          *   Need to test if they get the *dissociation*, not just the weirdness.
