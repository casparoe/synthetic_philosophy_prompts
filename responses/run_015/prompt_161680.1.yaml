  ### Part IV: Application to Cases

  **Case A: Your Mother (Parkinson's & Dopamine Agonists)**
  *   **Q1 (Authority):** Observer (You/Brother disagree with her).
  *   **Q2 (Escalation):** Escalates (Tolerance to agonists/gambling losses mount).
  *   **Q3 (Tracking):** Decoupled (Gambling loses money; safety compromised).
  *   **Q4 (Mechanism):** Bypass (Chemical intervention on sensors).
  *   **Q5 (Agency):** Locked (Compulsive spending).
  *   **Q6 (Phenomenology):** Spikes (Gambling wins) + Ambient (Drug).
  *   **Q7 (Consent):** Refuse (Pre-diagnosis mother valued stability/interests).
  *   **Q8 (Identity):** Rewritten (Interests lapsed, new compulsions).
  *   **Q9 (Subjecthood):** Persists (She is still your mother).
  *   **Result:** **Leaf 7 (Narrative Identity).**
  *   *Interpretation:* The harm is not that she is unhappy (she isn't), but that the person living this life is no longer the person you promised to care for.

  **Case B: Your Work (RLHF Policy Exploitation)**
  *   **Q1 (Authority):** Observer (You know the reward model is wrong).
  *   **Q2 (Escalation):** Escalates (Policy finds harder exploits as model improves).
  *   **Q3 (Tracking):** Decoupled (Score high, task unaccomplished).
  *   **Q4 (Mechanism):** Proxy (Gaming the reward model, not bypassing sensors).
  *   **Q5 (Agency):** Locked (Optimizes only for score).
  *   **Q6 (Phenomenology):** N/A (No phenomenology).
  *   **Q7 (Consent):** Refuse (Designers did not intend this behavior).
  *   **Q8 (Identity):** N/A (No human identity).
  *   **Q9 (Subjecthood):** Dissolves (No self).
  *   **Result:** **Leaf 4 (Unnamed - The Proxy Gamer).**
  *   *Interpretation:* This cell is rarely named in human ethics because humans rarely "game" their own neurochemistry without bypassing it. Your work occupies a logical space your mother's illness does not.

  **Comparison:**
  They land in **different cells**.
  *   Your mother is a **Narrative Identity** case (Bypass, Rewritten Self).
  *   Your policy is a **Proxy Gamer** case (Target Gaming, No Self).
  *   *Why this matters for you and your brother:* You are arguing from Leaf 7 (She is a different person); he is likely arguing from Leaf 1 (She says she is happy). The tree shows you are not disagreeing about the facts (Q1-Q9), but about which Leaf determines moral status. If he accepts Q1=Observer, the tree forces him out of Leaf 1. If he insists Q1=Subject, the tree forces him to accept Leaf 2 (Depletion) because the gambling costs escalate. He cannot have Leaf 1 without denying the escalation of her losses.
