answer: |-
  # The Wireheading Classification Instrument

  **Starting Commitment:** We agree that the intervention raises the subject's reported reward or pleasure and lowers nothing the subject reports as suffering. The disagreement is about whether this state is *good*.

  **Instructions:** Answer the following nine questions based on the case at hand. Follow the path to a Leaf. If you reach an Unoccupied Cell, note the diagnosis.

  ### Part I: The Branching Questions

  **Q1 (Epistemic Authority):** When the subject's sincere report of happiness conflicts with third-person criteria of functioning, whose report settles the matter?
  *   *Subject:* The subject's feeling is final.
  *   *Observer:* External functioning matters.

  **Q2 (Escalation):** Does maintaining the elevated state require increasing doses or effort over time (tolerance), or does it plateau?
  *   *Escalates:* Requires more to hold constant.
  *   *Plateaus:* Stable dose/effort maintains it.

  **Q3 (Tracking):** Does the reward signal still vary based on external world states (e.g., safety, nutrition, social success), or is it flattened/decoupled?
  *   *Tracks:* Correlates with world states.
  *   *Decoupled:* Constant or random relative to world.

  **Q4 (Mechanism):** Is the reward achieved by acting on the world to satisfy a proxy (gaming), or by bypassing the sensor entirely (stimulation)?
  *   *Proxy:* Acting on world (e.g., gambling, reward hacking).
  *   *Bypass:* Internal/Sensor direct (e.g., electrode, drug).

  **Q5 (Agency):** Can the subject easily stop pursuing this reward to pursue other goals, or are they locked in?
  *   *Free:* Can switch tasks.
  *   *Locked:* Compulsive focus on reward.

  **Q6 (Phenomenology):** Is the elevation a smooth, ambient background state, or does it arrive as discrete spikes locked to events?
  *   *Ambient:* Constant hum.
  *   *Spikes:* Event-locked peaks.

  **Q7 (Consent):** If the pre-intervention subject were asked, "Will you trade your current values for this state?", would they refuse?
  *   *Refuse:* Pre-self says no.
  *   *Accept:* Pre-self says yes.

  **Q8 (Identity):** Has the intervention rewritten the subject's core narrative, values, or life story?
  *   *Rewritten:* New person/values.
  *   *Continuous:* Same person/values.

  **Q9 (Subjecthood):** Is there a persisting entity to whom 'harm' can be attributed, or is the 'self' an illusion dissolved by the intervention?
  *   *Persists:* Self exists.
  *   *Dissolves:* No coherent self.

