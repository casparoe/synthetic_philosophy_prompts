answer: |-
  Here is a desiderata list tailored to your dual-purpose thesis (Clinical + Policy), structured around your tripartite hunch (Hurt, Oomph, Verdict).

  ### The Desiderata List

  **1. The Asymbolia Dissociation**
  *   **The Requirement:** The theory must locate the "badness" in a way that explains how sensory character can remain intact while unpleasantness vanishes, *and* explain why some asymbolics still exhibit avoidance behavior (flinching) or willingness to pay to avoid the stimulus.
  *   **[Job: Clinical]** **[Prop: Hurt vs. Oomph vs. Verdict]**
  *   **Status:** **Non-negotiable.** If the theory cannot parse the separation between sensation and aversion, it cannot guide treatment for asymbolics.
  *   **Why:** A theory that equates badness with sensory intensity fails (asymbolics feel the sensation). A theory that equates badness with avoidance behavior fails (asymbolics sometimes don't avoid, or avoid reflexively without minding). The theory must specify which of the three properties is the *locus* of moral/medical concern.

  **2. The Valence Flexibility (The Masochist Clause)**
  *   **The Requirement:** The theory must account for pain that is judged "good" or "neutral" by the subject (runner's high, religious penance, grief) without denying it is still *pain*. It must explain whether the badness is intrinsic to the experience or extrinsic (dependent on context/attitude).
  *   **[Job: Clinical]** **[Prop: Oomph vs. Verdict]**
  *   **Status:** **Non-negotiable.**
  *   **Why:** If badness is intrinsic to the *Hurt*, masochism is impossible (or self-deceptive). If badness is purely *Verdict*, then pain has no distinctive normative weight compared to other disliked sensations. The theory must explain why we treat masochistic pain differently than asymbolic pain, even if both lack negative *Verdict*.

  **3. The Non-Conceptual Baseline**
  *   **The Requirement:** The theory must determine if infants, non-human animals, or AI can suffer "bad" pain without possessing the concepts required to form a *Verdict* or complex *Oomph* (e.g., "I want this to stop").
  *   **[Job: Policy]** **[Prop: Verdict]**
  *   **Status:** **Non-negotiable.**
  *   **Why:** For policy, you must know if this population counts. If badness requires a cognitive *Verdict* (e.g., a desire that the pain not exist), infants are excluded from the calculus. If badness is raw *Hurt*, they are included. This is a binary switch for your budget allocation model.

  **4. The Damage Independence**
  *   **The Requirement:** The theory must explain why pain without tissue damage (phantom limb, neuropathy) is still worth treating, and why damage without pain (leprosy, congenital analgesia) is not a pain-budget issue.
  *   **[Job: Clinical]** **[Prop: Hurt]**
  *   **Status:** **Non-negotiable.**
  *   **Why:** Prevents the theory from collapsing into a theory of *injury* rather than a theory of *pain*. Badness must track the experience, not the bodily state, or you will misallocate clinical resources (treating the wound instead of the suffering).

  **5. The Authority Limit**
  *   **The Requirement:** The theory must specify when a patient's report of badness is definitive and when it is overrulable. Specifically: if an asymbolic says "it doesn't bother me" but exhibits physiological stress, does the *Verdict* override the biology?
  *   **[Job: Clinical]** **[Prop: Verdict]**
  *   **Status:** **Prejudice (Libertarian).**
  *   **Why:** You can choose to privilege first-person authority (if they say it's fine, it's fine) or third-person observation (stress hormones indicate badness regardless of report). This is a normative choice, not a metaphysical one, but your theory must pick a side to guide treatment.

  **6. The Distinctiveness Clause**
  *   **The Requirement:** The theory must state whether pain's badness is qualitatively unique compared to itch, nausea, or grief, or if it is just a high-intensity version of a generic "negative affect."
  *   **[Job: Policy]** **[Prop: Hurt]**
  *   **Status:** **Prejudice (Specificist).**
  *   **Why:** If pain is just generic negative affect, your policy chapter must aggregate it with anxiety and depression. If it is distinct, it gets a separate budget line. Most theories assume distinctiveness; few prove it.

  **7. The Interpersonal Metric**
  *   **The Requirement:** The theory must yield a quantity-like unit (or explain why such a unit is impossible) that allows comparing Subject A's pain to Subject B's for budget weighting.
  *   **[Job: Policy]** **[Prop: Verdict]**
  *   **Status:** **Non-negotiable.**
  *   **Why:** You cannot write a policy chapter on resource allocation without a common currency. If the theory says pain is essentially private and incomparable, it fails the Policy job.

  ---

  ### Tensions and Incompatibilities

  **The Authority vs. Metric Tension (Critical)**
  *   **Conflict:** **[Req 5: Authority Limit]** vs. **[Req 7: Interpersonal Metric]**
  *   **Why:** If you respect First-Person Authority (Clinical Job), you must accept the asymbolic's report that their pain has zero badness. However, for the Policy Job, you need a stable metric of "suffering" to allocate funds. If Subject A (asymbolic) reports 0 badness and Subject B (neurotic) reports 10 badness for the same stimulus, your Policy metric collapses into measuring *complaint behavior* rather than *pain state*.
  *   **Resolution:** You will likely have to sacrifice pure First-Person Authority for the sake of Policy. You may need to argue that the *Verdict* is fallible, and the *Hurt* or *Oomph* is the true metric for budgeting, even if the patient denies it.

  **The Infant vs. Verdict Tension**
  *   **Conflict:** **[Req 3: Non-Conceptual Baseline]** vs. **[Prop: Verdict]**
  *   **Why:** If you locate badness in the *Verdict* (evaluative judgment/desire), you struggle to include infants (who lack complex concepts). If you locate it in *Hurt* (phenomenology), you struggle to measure it for Policy.
  *   **Resolution:** A theory that makes badness a primitive *Hurt* satisfies the Infant requirement but fails the Metric requirement (how do you sum qualia?). A theory that makes badness a *Verdict* satisfies the Metric requirement (preferences are revealable) but fails the Infant requirement.

  ---

  ### The Theory-Killer

  **Requirement #7: The Interpersonal Metric**
  *   **Why:** This is the single requirement that knocks out the most candidate theories.
  *   **The Casualties:**
      *   **Pure Phenomenalism** (Badness is a private qualia): Fails because private qualia are incommensurable across subjects. You cannot put "my ouch" on a scale against "your ouch."
      *   **Pure Imperativism** (Badness is a bodily command): Fails because commands are binary (stop/doing) or agent-relative. There is no clear way to sum "commands" across a population for a budget.
      *   **Strong Representationalism** (Badness is representation of damage): Fails because it conflates pain with injury (violating Req 4), making the metric about tissue loss rather than suffering.
  *   **The Survivors:** Only **Preferentism** (badness = frustrated desire) or **Functionalism** (badness = role in behavior/cognition) offer a pathway to a common currency (utility/behavioral cost) that satisfies Policy, though they risk failing the Infant or Authority requirements.

  ---

  ### Short Scorecard of Theory Families

  | Theory Family | Locus of Badness | Clinical Fit | Policy Fit | Fatal Flaw for Your Thesis |
  | :--- | :--- | :--- | :--- | :--- |
  | **Bodily Command** (Imperativism) | *Oomph* (Motivation) | **High.** Explains urge to treat. | **Low.** Hard to aggregate commands. | Fails **Interpersonal Metric**. Cannot quantify "urgency" across people. |
  | **Representation** (Intentionalism) | *Hurt* (Info about damage) | **Mixed.** Fails on Asymbolia/Damage Independence. | **Med.** Damage is measurable. | Fails **Damage Independence**. Treats the body, not the pain. |
  | **Desire/Attitude** (Evaluativism) | *Verdict* (Judgment/Desire) | **Med.** Respects Authority, fails Infants. | **High.** Preferences are comparable. | Fails **Non-Conceptual Baseline**. Infants/animals drop out of the budget. |
  | **Phenomenal Component** (Feeling) | *Hurt* (Raw Qualia) | **High.** Captures the "ouch." | **Low.** Qualia are private. | Fails **Interpersonal Metric**. No way to compare my red to your red. |

  ### Recommendation for Your Argument
  To satisfy both jobs, you will likely need a **Hybrid View**. You may need to argue that for **Clinical** purposes, badness is *Oomph* (treat the aversion), but for **Policy** purposes, badness is a constructed *Verdict* based on behavioral cost (treat the resource drain). If you try to find one single property that does both jobs perfectly, the **Authority vs. Metric** tension will break your chapter. Explicitly allowing the definition of "badness" to shift slightly between the Clinical and Policy contexts may be your strongest theoretical move.
