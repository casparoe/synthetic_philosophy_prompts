      *   **Purpose:** Two specific jobs:
          1.  *Clinical:* Deciding when to treat (especially when report $\neq$ bother).
          2.  *Policy:* Interpersonal comparison for resource allocation (analgesia vs. other budget items).
      *   **Background Constraint:** Acknowledge Pain Asymbolia (sensory intact, unpleasantness/urge gone). Acknowledge the user's hunch: Badness might conflate three properties (Raw Hurt, Aversive Oomph, Verdict/Value).
      *   **Required Cases/Considerations:** Asymbolia (paying to avoid/flinching), Liked/Wanted Pain, Pain w/o Damage/Damage w/o Pain, Non-conceptual Subjects (infants/animals), First-Personal Authority, Distinctiveness (vs. itch/grief), Quantifiability (for policy).
      *   **Formatting/Tagging Requirements:**
          *   Tag each requirement with the Job (Clinical/Policy) it serves.
          *   Tag each requirement with the Property (Hurt/Oomph/Verdict) it targets.
          *   Mark Non-negotiable vs. Prejudice.
          *   Flag incompatible pairs (tensions).
          *   Identify the "theory-killer" requirement.
          *   Short scorecard of theory families at the end.
          *   No citations.

  2.  **Deconstruct the User's Hunch:**

      *   The user proposes a tripartite distinction:
          1.  *Raw Hurt:* Phenomenal intensity/qualitative "ouch."
          2.  *Aversive Oomph:* Motivational push/urge to stop/protect.
          3.  *Verdict:* Evaluative status (willingness to pay, trade-offs, overall badness).
      *   *Asymbolia:* Sensory (Hurt) present, Oomph absent. User notes they might still pay to avoid (Verdict present?).
      *   *Masochism/Runner's High:* Hurt present, Oomph might be present (urge to continue?), Verdict is positive/neutral.
      *   *Task:* The desiderata must force a theory to locate "badness" within this triad or reject the triad.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Asymbolia Test.* Needs to handle the split between sensation and unpleasantness.
          *   Job: Clinical (treat or not?).
          *   Property: Distinguishes Hurt vs. Oomph vs. Verdict.
          *   Tension: If asymbolics don't mind it, why treat? If they flinch, is that Oomph?
      *   *Requirement 2: The Interpersonal Metric.* Needs to sum up pain for policy.
          *   Job: Policy.
          *   Property: Verdict (aggregate value).
          *   Tension: How to compare my "ouch" to yours?
      *   *Requirement 3: The Non-Conceptual Subject.* Infants/animals.
          *   Job: Clinical/Policy (who counts?).
          *   Property: Hurt vs. Verdict (can you have a verdict without concepts?).
      *   *Requirement 4: First-Person Authority.* Who decides the badness?
          *   Job: Clinical.
          *   Property: Verdict.
          *   Tension: Patient says "fine" but looks in agony (or vice versa).
      *   *Requirement 5: The Damage Decoupling.* Pain w/o damage, damage w/o pain.
          *   Job: Clinical (treat the pain or the cause?).
          *   Property: Representation vs. Hurt.
      *   *Requirement 6: Distinctiveness.* Why pain and not grief?
          *   Job: Policy (priority setting).
          *   Property: Hurt (qualitative specificity).
      *   *Requirement 7: The Valence Reversal.* Liked pain.
          *   Job: Clinical (treat if wanted?).
          *   Property: Oomph vs. Verdict.

  4.  **Refining and Tagging (Applying Constraints):**

      *   *Constraint Check:* Need to explicitly tag Job (Clinical/Policy) and Property (Hurt/Oomph/Verdict).
      *   *Constraint Check:* Need to identify tensions/incompatibilities.
      *   *Constraint Check:* Need to identify the "Theory Killer."

      *   *Refining the "Property" Tags:* The user defined them as Raw Hurt, Aversive Oomph, Verdict. I should stick to those labels for consistency.
      *   *Refining the "Job" Tags:* Clinical (Treatment decisions) vs. Policy (Resource allocation).

  5.  **Identifying Tensions (The "Hard Part"):**

      *   *Tension 1: First-Person Authority vs. Policy Objectivity.* If the patient says "it's not bad" (Asymbolia/Masochism), Clinical respect says "don't treat." Policy says "this is still tissue threat/resource drain" or "we need a standard unit of badness regardless of attitude."
      *   *Tension 2: Non-Conceptual Subjects vs. Verdict.* If badness is a "Verdict" (evaluative judgment), infants can't have it. If badness is "Hurt," they can. Policy needs them to count; Clinical needs to know *what* to treat.
      *   *Tension 3: Clinical Individual vs. Policy Aggregate.* Clinical cares about *this* patient's experience. Policy cares about *QALYs* across a population. A theory that makes pain essentially private (Hurt) fails Policy. A theory that makes pain essentially behavioral (Oomph) fails Clinical (asymbolics don't behave as if in pain).

  6.  **Selecting the "Theory Killer":**

      *   Which requirement is hardest to satisfy?
      *   *Candidate:* The Interpersonal Metric (Policy). Most phenomenological theories fail here.
      *   *Candidate:* The Asymbolia/Authority split. Representational theories struggle with asymbolia. Attitude theories struggle with infants.
      *   *Decision:* The **Interpersonal Metric + Non-Conceptual Subjects** combo is the hardest. But the single strongest filter is usually **First-Person Authority vs. Asymbolia**. If a theory says "Pain is bad because it represents damage," asymbolia kills it. If it says "Pain is bad because you dislike it," infants/masochists kill it.
      *   *Better Choice:* **The Policy Quantification Requirement.** It forces the theory to move from qualitative phenomenology to cardinal utility. Most philosophical theories of pain's badness are qualitative. This requirement demands a number. That knocks out pure phenomenology and pure representationalism immediately.

  7.  **Drafting the Scorecard:**

      *   *Bodily Command (Imperativism):* Good on Oomph, bad on Asymbolia (why no command?), bad on Policy (how to sum commands?).
      *   *Representation (Intentionalism):* Good on Damage link, bad on Asymbolia (sensation intact), bad on Liked Pain.
      *   *Desire/Attitude (Evaluativism):* Good on Liked Pain, bad on Infants (no desires?), bad on Asymbolia (do they desire not to?).
      *   *Phenomenal Component (Feeling):* Good on Authority, bad on Policy (incommensurable), bad on Asymbolia (is the feeling there or not?).

  8.  **Review against User Instructions:**

      *   *Purpose first?* Yes, will structure around the two jobs.
      *   *Tag Job & Property?* Yes, will use [Job: X] [Prop: Y].
      *   *Cases included?* Asymbolia, Liked Pain, Damage decoupling, Infants, Authority, Distinctiveness, Quantity.
      *   *Non-negotiable vs. Prejudice?* Will mark clearly.
      *   *Incompatible pairs?* Will highlight the Clinical/Policy tension.
      *   *Theory Killer?* Will identify.
      *   *Scorecard?* Will keep it short.
      *   *No Citations?* Checked.

  9.  **Final Polish:**

      *   Ensure the tone is academic but direct (thesis advisor style).
      *   Make sure the "Property" tags align with the user's triad (Hurt, Oomph, Verdict).
      *   Ensure the Asymbolia nuance (flinching vs. paying) is captured.

      *(Self-Correction during drafting)*: I need to be careful with the "Property" tags. The user defined them as: 1. Raw Hurt (sensory), 2. Aversive Oomph (motivational), 3. Verdict (evaluative/trade-off). I must use these consistently.
      Also, need to make sure I explicitly address the "Asymbolic patient who pays to avoid" case. That suggests Verdict exists without Oomph. That's a crucial distinction.

      *(Refining the Tension)*: The biggest tension is between Clinical (subjective authority) and Policy (objective comparison). If I respect the asymbolic's "it doesn't bother me," I might not treat. But if they still pay to avoid it (Verdict), maybe I should? And for Policy, I need to compare that to someone else's pain.

      *(Refining the Killer)*: Actually, the "Non-Conceptual Subject" requirement combined with "Verdict" is a classic killer for cognitivist theories. But the "Policy Quantity" requirement is a killer for phenomenological theories. I will select **Policy Quantification** as the killer because it forces a metaphysical commitment to value realism or functionalism that many pain theories avoid.

      Let's assemble the list.

      *   *Req 1: The Asymbolia Dissociation.* (Clinical/Property: Hurt vs Oomph).
      *   *Req 2: The Valence Flexibility.* (Clinical/Property: Oomph vs Verdict).
      *   *Req 3: The Non-Conceptual Baseline.* (Policy/Property: Verdict).
