answer: |-
  **The Price of Knowing: A Verdict on Good's Theorem and the Value of Information**

  It is a pleasure to address a colleague who understands that the elegance of a proof is often inversely proportional to its applicability. You have put your finger on the precise friction point between decision theory as a mathematical discipline and decision theory as a guide to living. I. J. Good's 1967 result is indeed a jewel of Bayesian orthodoxy. The proof is, as you note, almost trivial: if $V$ is the value of a decision problem, $V_{\text{now}} = \max_a E[U(a, S)]$, while $V_{\text{later}} = E_o [\max_a E[U(a, S) | O=o]]$. Since the maximum of a sum is less than or equal to the sum of the maximums, $V_{\text{later}} \geq V_{\text{now}}$. Information, defined as a reduction in entropy regarding the state $S$, appears to be a free lunch.

  Yet, your unease is well-founded. The intuition that "more information is never worse" clashes violently with cases involving predictors, logical correlations, or utilities derived from ignorance. The question before us is whether these clashes constitute a refutation of Good's Theorem or merely a delineation of its domain.

  After weighing the strongest arguments for both sides, I commit to the following verdict: **The Newcomb-style and spoiler examples are not genuine counterexamples to the theorem; they are demonstrations of its boundary conditions.** The theorem is mathematically sound, but the popular slogan derived from it is indefensible as a general principle of rationality. Good's Theorem is a conditional truth that holds only in causally separable worlds with state-invariant utilities. To treat it as a universal law is to confuse the map (the Bayesian formalism) with the territory (the causal structure of the problem).

  ### The Anatomy of the Assumptions

  To defend this verdict, we must be precise about what Good's Theorem actually assumes. The proof relies on a specific architecture of the decision problem. Let us formalize the two assumptions you identified, for they are the load-bearing walls of the argument.

  First, **Utility Stability.** The theorem assumes a utility function $U(a, s)$ that depends only on the action $a$ and the state of the world $s$. It implicitly assumes that the agent's epistemic state—the fact that they *know* $s$—does not itself enter the utility function.

  Second, **Causal Independence.** The theorem assumes that the act of observing the information $O$ does not causally influence the state $S$, nor does the decision to observe signal a policy that influences $S$. In standard Bayesian terms, the likelihood $P(O|S)$ is well-defined, but the reverse causal link from the agent's choice to observe (or the policy governing that choice) to the state $S$ is null.

  When these conditions hold, the theorem is tautologically true. To deny it would be to deny the laws of probability. The "counterexamples" arise not because the math fails, but because the mapping of the real-world scenario onto the variables $a$, $s$, and $U$ violates these structural constraints.

  ### The Spoiler: A Violation of Utility Stability

  Consider the case of the mystery novel. You are deciding whether to read the book ($a_1$) or read the spoiler ($a_2$) then read the book. If you read the spoiler, you possess information $O$. According to Good, having $O$ should increase your expected utility. Yet, for many agents, the utility of the reading experience is strictly lower if the outcome is known.

  Proponents of the "genuine counterexample" view argue this proves information has negative value. However, this misidentifies the source of the disvalue. In the formalism of Good's Theorem, the utility function is fixed *ex ante*. If the utility of reading the book depends on whether you know the ending, then the state space $S$ must be expanded to include your epistemic state, or the utility function must be rewritten as $U(a, s, k)$, where $k$ represents knowledge.

  If we treat "surprise" as a good, then acquiring the information changes the utility function itself between the "now" and "later" decision nodes. Good's proof compares $\max_a E[U(a, S)]$ against $E_o [\max_a E[U(a, S) | O]]$. It assumes the $U$ is identical in both terms. In the spoiler case, $U_{\text{ignorant}} \neq U_{\text{informed}}$. The theorem does not claim that information is valuable if acquiring it destroys the value of the outcome; it claims that *given a fixed valuation of outcomes*, better probabilities lead to better choices. The spoiler case is not a refutation of the theorem; it is a category error in the modeling of utility. The information is not "negative"; rather, the good being consumed (narrative tension) is logically incompatible with the possession of that information.

  ### Newcomb's Problem: A Violation of Causal Independence

  The Newcomb case is more subtle and more dangerous to the unwary. Here, a Predictor has placed money in a box based on their prediction of your choice. The "information" in question is often framed as the opportunity to observe the box's contents or to deliberate on the prediction before acting.

  In a standard Newcomb setup, if you could look in the opaque box before choosing, Good's Theorem suggests you should look. If you see \$1M, you one-box; if you see \$0, you two-box. You seem to win either way. However, if the Predictor is perfect, they predicted whether you would look. If looking is correlated with two-boxing (perhaps because only greedy agents look), the box is empty.

  The "counterexample" argument suggests that looking (gaining information) causes the money to vanish, hence information has negative expected value. But again, look closely at the causal graph. Good's Theorem assumes that the probability distribution over states $P(S)$ is independent of the decision to acquire information. In Newcomb's problem, the state (money in box) is correlated with the agent's *decision policy*.

  If you treat the problem using Evidential Decision Theory (EDT), conditioning on the act of looking updates your probability that the box is empty. If you use Causal Decision Theory (CDT), you recognize that looking cannot causally change the money already there. The tension arises because Good's Theorem is inherently evidential—it relies on Bayesian conditioning $P(S|O)$. In Newcomb problems, $P(S|O) \neq P(S| \text{do}(O))$.

  The theorem fails to apply not because the math is wrong, but because the "states of the world" are not causally independent of the agent's type. The information is not "free" in the sense required by the proof; the act of seeking it is a signal that alters the probability of the favorable state *via the predictor's prior calculation*. This violates the assumption that the information source is external to the causal loop of the decision. The theorem survives, but only if we restrict its domain to problems where the observer is causally decoupled from the system's history.

  ### The Verdict: Boundary Conditions, Not Refutations

  I therefore reject the claim that these examples show Good's Theorem is "simply false." A theorem cannot be false if its premises are not met. To say Good's Theorem is refuted by Newcomb's Problem is akin to saying Newton's Second Law ($F=ma$) is refuted by relativistic speeds. It is not refuted; it is merely bounded.

  The "counterexamples" are artifacts of the assumptions. They exploit the gap between the formal requirements of the proof (fixed utility, causal independence) and the messy reality of logical correlation and epistemic utility. In the spoiler case, the utility function shifts. In the Newcomb case, the causal structure is violated. In both, the preconditions for the inequality $V_{\text{later}} \geq V_{\text{now}}$ are absent.

  However, accepting this verdict requires a significant concession regarding the popular slogan. While the *theorem* stands as a valid conditional statement, the slogan **"more information is never worse" is indefensible as a general principle.**

  This distinction is vital. As a retired physicist, you are accustomed to laws that hold within specific regimes. Thermodynamics holds for macroscopic systems; quantum mechanics for the microscopic. We do not say thermodynamics is "false" because it fails for a single electron. But we also do not advise engineers to use steam tables to design qubits.

  Similarly, Good's Theorem holds for what we might call "physicist-style" decision problems: contexts where the observer is external to the system, where measurement does not retroactively alter the state (no Newcomb predictors), and where the value of the outcome is intrinsic rather than epistemic (no spoilers). In the domain of experimental physics, where the system under test does not model the experimenter, Good's Theorem is a robust guide. Information *is* non-negative there.

  But decision theory aspires to be a theory of *rational agency* in general, not just a theory of laboratory measurement. In the broader domain of social interaction, logic, and self-referential games, the assumptions of Good's Theorem are the exception, not the rule. Agents are often predictors of each other (violating causal independence). Agents often value surprise, dignity, or faith (violating utility stability).

  ### Conclusion

  My final position is this: The dispute is resolved by recognizing that Good's Theorem is a theorem of *Bayesian Updating*, not a law of *Ontological Independence*. The counterexamples do not break the math; they break the mapping.

  Therefore, the slogan that "the expected value of information is never negative" must be retired from general discourse. It should be replaced by a more precise maxim: **"In causally separable environments with state-invariant utilities, the expected value of information is non-negative."**

  To treat the slogan as a universal truth is to invite disaster in Newcomb-like scenarios, where the rational move is often to blind oneself to information (precommitment) to manipulate the predictions of others or to preserve the utility of the experience. The theorem remains a beautiful piece of mathematical machinery, but like all machinery, it operates only within its design specifications. To use it outside those specifications is not to prove it broken, but to prove oneself a careless operator.
