          *   *Implication:* If agents care about *when* they know, the outcomes are different ($1M now vs. $1M later). This re-describes the outcomes (supporting Elias's Move 4). If we control for timing, does the paradox persist? Experimental evidence suggests the Allais effect persists even with controlled timing, but the *explanation* might shift.
          *   *Verdict Shift:* Supports Elias's claim that the "outcome" description was too thin. However, if the preference is *only* about timing, it's not the Allais paradox anymore. It suggests Sofia might be right that the *standard* Allais setup implies a specific framing error, but Elias is right that the agent's utility function might be valid over richer outcomes.

      *   **Wrinkle 2: Savage (States/Acts) vs. vNM (Lotteries).**
