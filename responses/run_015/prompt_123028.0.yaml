          *   *However*, the tension lies in enforcement vs. diffusion. If talent/espionage diffuses the *knowledge* of how to build efficient models, does that reduce the compute needed? If elasticity is high, small actors might reach transformative capabilities with less compute if they have the "secret sauce."
