          *   Analysis: This is plausible *if* the transition period is long enough to write the rules. But if (1) says the window is "months to a couple of years," is there time to build robust international institutions before the multipolar chaos (2) sets in? If everyone reaches radical transformity quickly (1 & 2), the "driver's seat" might be a revolving door, not a throne.
