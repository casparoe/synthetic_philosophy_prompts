  TO: Doctoral Exam Appeals Panel
  FROM: [My Name]
  RE: Decision Memo – Qualifying Exam Appeal (Candidate X)

  This memo recommends remanding the case for a re-examination under specific conditions. We should not uphold the fail, as the candidate's philosophical intuition regarding framework dependence contains merit, nor should we overturn it outright, as her deployment of that intuition during a methods exam was procedurally inappropriate. A remand allows us to distinguish between dogmatism and necessary methodological commitment without validating the latter as immune to scrutiny.

  The core tension lies in whether the candidate's refusal to debate the smoothing parameter constituted an epistemic fault. The examiners rightly identified a risk: if methodological choices are declared off-limits, empirical critique becomes impossible. However, the advisor correctly notes that demanding external justification for a framework internal to the dissertation risks an infinite regress. The candidate attempted to articulate this via Wittgenstein's *On Certainty*, arguing that some propositions function as "hinges" that must remain fixed for the inquiry to turn. Her error was treating this functional role as a permanent exemption from criticism rather than a contextual necessity.

  Regarding the Chair's gloss that Wittgenstein showed some beliefs are "simply beyond rational criticism," this is a distortion, though a common one. *On Certainty* does not posit a class of truths immune to reason; rather, it describes propositions that, within a specific language game, function as the scaffolding for verification. They are exempt from verification *within that game*, not beyond criticism *simpliciter*. My own recollection of the "riverbed" metaphor (OC §§96–99) is textually settled: Wittgenstein explicitly describes how fluid propositions harden into channels and vice versa over time. However, whether this constitutes a positive epistemology is contested. Therapeutic readers argue Wittgenstein was dissolving epistemological problems, not solving them. Furthermore, extending hinge commitments from ordinary Moorean cases (e.g., "I have two hands") to scientific methodology is debated. Some specialists view this as a legitimate extension of grammar; others reject it as a hijack of Wittgenstein's anti-theoretical stance. We must not state as consensus what remains a fight among Wittgensteinians.

  To prevent hinge-talk from becoming a "get-out-of-criticism card," we need criteria distinguishing legitimate hinges from immunizing moves. Here, Popper, Duhem-Quine, and Lakatos offer different lenses. Popper's worry about "conventionalist stratagems" bites hardest here. This is the ad hoc rescue of a theory by redefining terms or blocking falsification to protect the core. The candidate's initial response risked this: declaring the pipeline immune looks like protecting the theory from refutation. Duhem-Quine holism—that any claim can be saved by adjusting background assumptions—is descriptively true but normatively useless here; it explains how she *could* hold the view, not whether she *should*.

  Lakatos provides the workable test for future orals. We should ask whether the commitment functions within a "progressing" or "degenerating" research program. A legitimate hinge enables new predictions and absorbs anomalies productively. An immunizing move merely blocks anomalies without generating new knowledge. In this case, the smoothing parameter is a hinge only if the candidate can demonstrate its fruitfulness for her specific questions, not its universal validity. The rubric should require students to identify their hinges explicitly and justify their *utility* for the project, rather than asserting their *truth* against evidence.

  This addresses the examiner's valid concern. If we codify hinges without safeguards, we hand students a shield against legitimate methodological critique. The examiner fears that allowing this appeal validates dogmatism. That fear is warranted if the student claims the parameter is *true* despite evidence. It is not warranted if she claims the parameter is *necessary for this specific inquiry* while acknowledging the evidence limits the inquiry's scope. The distinction is between saying "This method is correct" (dogmatism) and "This method is the condition of possibility for this dissertation" (hinge). The former is falsifiable; the latter is a scope limitation.

  Therefore, the re-exam should not ask her to defend the parameter as universally valid. Instead, she must articulate the trade-offs: acknowledging the recent papers on inflation, explaining why the pipeline remains the only viable channel for her specific hypotheses, and delineating what conclusions are foreclosed by that choice. This satisfies the examiners' demand for engagement without forcing the advisor's feared infinite regress. It treats the hinge as fluid (per the riverbed), acknowledging that what is fixed for this dissertation may loosen for the field later.

  We must be clear that this decision does not settle the Wittgensteinian debates. We are not endorsing hinge epistemology as truth. We are acknowledging that doctoral candidates operate within frameworks that cannot be fully justified from nowhere. Our job is to ensure they understand the contours of their cage, not that they pretend they are free.

  Verdict: REMAND
