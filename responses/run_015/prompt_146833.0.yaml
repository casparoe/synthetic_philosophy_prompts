  **Rule 2: The Ontogenetic/Functional Rule (Credit the Machinery)**
  *   **Definition:** Classification depends on *what computational process occurs during problem solving*, regardless of origin.
      *   Darwinian: Fixed stimulus-response.
      *   Skinnerian: Overt trial-and-error in the world.
      *   Popperian: Covert trial-and-error in an internal model.
      *   Gregorian: Use of external symbolic systems to restructure thought *plus* social transmission/accumulation.
