  Dr. Ames is building a taxonomy of *cognitive systems*, not a genealogy of *design processes*. If she adopts Rule 1, the ladder becomes a history of training methods rather than a map of cognitive capabilities. A frozen AI that simulates is cognitively distinct from a wasp that reflects, even if both are "designed/evolved." Rule 2 preserves the utility of the ladder for comparative psychology and AI safety. Furthermore, her hesitation on the Spider suggests she is aware of the trap of Rule 1 and is looking for a reason to adopt Rule 2.

