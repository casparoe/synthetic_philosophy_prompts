  ### The Two Competing Rules

  You are correct that her six verdicts support two incompatible rules that diverge on Whetstone.

  **Rule 1: The Phylogenetic/Origin Rule (Credit the Installer)**
  *   **Definition:** Classification depends on *how the capacity was acquired*.
      *   Darwinian: Capacity fixed at initialization (by evolution or training).
      *   Skinnerian: Capacity shaped by reinforcement during operation.
      *   Popperian: Capacity for simulation developed/learned during operation.
