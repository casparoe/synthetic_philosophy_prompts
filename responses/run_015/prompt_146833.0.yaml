  3.  **Why not Darwinian:** This is the critical tension. Whetstone's capacities are "innate" (frozen weights), similar to the Wasp and the Jumping Spider. However, the Wasp executes a *fixed action pattern*. Whetstone executes *novel simulations* for novel problems. If Ames classifies the Jumping Spider as Popperian (crediting the machinery), Whetstone must also be Popperian. If she classifies the Spider as Darwinian (crediting the installer), Whetstone would be Darwinian.
