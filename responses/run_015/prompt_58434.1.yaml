prompt: |-
  So I'm a backend engineer, I mostly do infra and queue stuff and never took a single philosophy class, but I got stuck in this long lunch arguement with coworkers about our trust and safety system. We run a kinda Reddit-like app and we keep dealing with spammers and cheaters, and half the team says we should ban them because they deserve it and its about giving people what they earned even if it doesn't change anything, and the other half says who cares about desert, we should just pick whatever reduces spam and keeps legit users happy long term.

  What I'm curious about is if you take that classic split between retributivism and the different consequentialist flavors like deterrence and incapacitation and rehabilitation, could you rate each one for our actual messy situation? Like our detector is only like 95% accurate so we sometimes nuke innocent newbies by accident, and perma-banning a spammer often doesn't even work cause they just spin up ten new accounts, but letting them stay ruins the feed for everyone else. Rank them from most to least convincing for deciding stuff like that and give each a 1-10 score for how fair and practical it feels, with a couple lines of reasoning for each score so I can actually follow your thinking.
reasoning: |-
