          *   **Deterrence:** Punish to scare others (and the offender) from doing it again.
          *   **Incapacitation:** Remove the ability to offend (ban them).
          *   **Rehabilitation:** Fix the offender so they don't offend again.

  3.  **Evaluate Each Framework against the Technical Constraints:**
      *   *Constraint 1: 95% Accuracy.* This is huge. 5% false positive rate on a high-volume system means *a lot* of innocent users get banned. Retributivism hates punishing the innocent. Consequentialism might tolerate it if the net good is high, but user churn is a risk.
      *   *Constraint 2: Evasion.* Perma-bans don't work well (10 new accounts). Retribution feels futile here. Incapacitation is leaky.
