      Consequentialism says: If banning 5 innocents saves 1000 users from spam, do it. So Consequentialism handles the error rate better *philosophically*, though it risks user churn.

      *Okay, let's finalize the ranking.*
      1.  **Consequentialist Incapacitation:** Stop the harm now.
      2.  **Consequentialist Deterrence:** Stop the harm later.
      3.  **Retributivism:** Morally incompatible with automation errors.
