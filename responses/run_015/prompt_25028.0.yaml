answer: |-
  The legal landscape surrounding self-driving cars (SDCs) currently occupies a transitional zone that generates the apparent contradiction you describe. To analyze this, we must reconstruct the implicit theory of agency underpinning current liability frameworks, evaluate its coherence, and contrast it with two radical alternatives.

  ### 1. The Implicit Theory: "Supervisory Principalism"

  The current two-part practice presupposes a theory of **Conditional Delegated Agency**, which I will term **Supervisory Principalism**.

  Under this view, the human occupant is the **Moral Principal** and the autonomous system is a **Delegated Agent**. However, this agency is not transferred; it is loaned. The manufacturer warrants the *capacity* of the agent (the car) to perform, while the human warrants the *oversight* of the agent.

  *   **Manufacturer Liability (Product Liability):** This treats the car as a tool that must function as advertised. If the tool fails due to design or manufacturing flaws, the creator is liable. This presupposes the car is an *instrument* whose failures are traceable to its construction.
  *   **Human Liability (Negligence/Criminal):** This treats the human as the *operator* who retains ultimate authority. Even if the car drives, the human is the "fallback" moral agent. This presupposes the human retains *effective control*.

  **Is it Coherent?**
  Theoretically, it is **unstable**, though legally pragmatic. It tries to have things both ways by relying on a "Handoff Fallacy." It assumes a human can be disengaged from the loop (watching a movie) yet remain cognitively available to re-enter the loop instantly upon system failure. Cognitive science suggests this is impossible (the "vigilance decrement"). Therefore, the practice is **legally coherent** (torts allow for concurrent causes) but **psychologically incoherent** (it demands a mode of attention humans cannot sustain). It treats the human as simultaneously a passenger (when the car works) and a driver (when the car fails).

  ### 2. Strict Presuppositions vs. Compatible Fits

  To reconstruct the view precisely, we must distinguish what the law *requires* to function versus what merely *aligns* with it.

  **Strict Presuppositions (Necessary Conditions):**
  1.  **Feasibility of Intervention:** The human must physically and cognitively be able to retake control before a collision occurs after an alert. If takeover is impossible, holding the human liable violates the principle *ultra posse nemo obligatur* (no one is obliged beyond what they are able).
  2.  **Distinct Causation:** It must be possible to distinguish between a *system defect* (manufacturer fault) and a *supervisory failure* (human fault). If every crash is arguably both, the framework collapses into ambiguity.
  3.  **Retention of Authority:** The human must retain the legal right to override the system at any time. If the system locks the human out, the human cannot be the Principal.

  **Merely Compatible Fits (Contingent Alignments):**
  1.  **Expectation of Safety:** The public expectation that SDCs are "safe" fits well with product liability, but the law does not strictly require safety, only non-defectiveness.
  2.  **Corporate Personhood:** The idea that the manufacturer is a "person" liable for negligence fits the framework, but the framework could work with strict liability regardless of corporate moral status.
  3.  **Data Transparency:** The current practice fits well with black-box data recording, but strictly presupposes only that causation *can* be determined, not necessarily how.

  ### 3. Alternative Framework 1: Autonomous Systems as Full Moral Agents

  If we adopt the view that SDCs are **Full Moral Agents** (Electronic Personhood), the liability framework shifts fundamentally from *product/oversight* to *vicarious/direct agency*.

  *   **Liability Shift:** The car (or its dedicated insurance trust) becomes the primary liable entity. Manufacturer liability recedes to cases of "creation negligence" (similar to parents being liable for a child's actions only if they were negligent in upbringing), not strict product liability.
  *   **Human Role:** The occupant becomes a **Passenger**. Criminal charges for "sleeping at the wheel" would vanish, as passengers have no duty to monitor the driver.
  *   **Legal Changes:**
      *   **Statutory Personhood:** Legislation granting AI legal standing to be sued and hold assets.
      *   **Mens Rea for Algorithms:** Development of legal standards for "algorithmic recklessness" or "intent," distinct from code defects.
      *   **Insurance Pools:** Mandatory capitalization of the AI agent itself, rather than insuring the human owner.
  *   **Implication:** This resolves the coherence problem by removing the human from the chain of responsibility entirely during autonomous operation.

  ### 4. Alternative Framework 2: Autonomous Systems as Mere Instruments

  If we adopt the view that SDCs are **Mere Instruments** (like a hammer or standard cruise control), the liability framework shifts to **Strict Human Liability**.

  *   **Liability Shift:** The human is liable for *all* collisions occurring while they occupy the control seat, regardless of software state. The car is merely the mechanism of the human's will. Manufacturer liability is restricted to mechanical breakdowns (e.g., brakes snap), not decision errors (e.g., car chose to hit the wall).
  *   **Human Role:** The human is the **Absolute Operator**. "Autonomy" is legally redefined as "driver assistance."
  *   **Legal Changes:**
      *   **Elimination of Product Liability for Software:** Software decisions are treated as the driver's decisions.
      *   **Criminal Strict Liability:** Occupying the seat while impaired or asleep becomes a strict liability offense if a crash occurs, removing the need to prove "duty to monitor."
      *   **Marketing Restrictions:** Prohibition of terms like "Autopilot" or "Self-Driving" to prevent the misconception of delegated agency.
  *   **Implication:** This is theoretically coherent (one agent, one responsibility) but stifles innovation by placing impossible risk burdens on users.

  ### 5. Critical Assumptions and Sensitivity Analysis

  My analysis rests on three heavy assumptions. Relaxing them shifts the conclusions significantly.

  **Assumption A: The "Handoff" is Technically Feasible.**
  *   *Current View:* Assumes humans can regain situational awareness in seconds.
  *   *Relaxation:* If research proves humans *cannot* safely retake control from a Level 3/4 system (due to automation complacency), the **Supervisory Principalism** model collapses.
  *   *Shift:* We would be forced toward **Full Moral Agent** status (because the human *cannot* be responsible) or **Mere Instrument** status (banning the tech until Level 5 is reached). The middle ground becomes legally untenable.

  **Assumption B: Causation is Attributable.**
  *   *Current View:* Assumes we can distinguish a sensor failure (manufacturer) from a failure to brake manually (human).
  *   *Relaxation:* If neural networks are opaque ("black box") and we cannot determine *why* the car acted, Product Liability becomes impossible to prove.
  *   *Shift:* Liability would likely default to **Strict Human Liability** (easier to prove human was in seat) or **No-Fault Insurance** (socializing the cost), as moral blame cannot be assigned without causal clarity.

  **Assumption C: Control Equals Responsibility.**
  *   *Current View:* Assumes that having the *capacity* to control implies the *responsibility* to control.
  *   *Relaxation:* If we decouple control from responsibility (e.g., adopting a "Risk Creation" theory where the manufacturer introduces the risk and thus bears the cost regardless of human oversight).
  *   *Shift:* This moves us toward **Enterprise Liability**. The manufacturer pays for all accidents involving their cars, not because the car is an "agent," but because they profited from introducing the risk. The human becomes an insured beneficiary, not a liable supervisor.

  ### Conclusion

  The current legal practice presupposes a **Supervisory Principalism** that is pragmatically functional but theoretically fractured. It attempts to bridge the gap between old tort law (human driver) and new technology (autonomous agent) by splitting the difference. It is not a coherent theory of moral agency; it is a **transitional doctrine** that assumes human monitoring is viable when it likely is not.

  If we demand coherence, we must choose: either the human is the sole responsible agent (Mere Instrument), or the system is the responsible agent (Full Moral Agent/Enterprise Liability). The current attempt to hold both responsible simultaneously relies on the fragile assumption that a human can be a passive passenger and an active guardian at the same time. As autonomy increases, this assumption will break, forcing the law to abandon the "two-part practice" for one of the extreme frameworks.
