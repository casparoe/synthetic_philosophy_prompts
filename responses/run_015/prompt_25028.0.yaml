  10. (Final Review of the "Coherence" question): Is it coherent? It's *legally* coherent (torts allow for concurrent liability) but *psychologically/morally* incoherent (humans cannot be attentive monitors of autonomous systems). I should highlight this distinction.

  11. (Final Review of "Moral Agency"): The current system presupposes the human is the *moral agent* and the car is the *causal mechanism*, unless the mechanism is *defective*. This is a "Broken Tool" theory.

  Let's structure the essay clearly with headings.

  *   **Introduction:** The Paradox of Transitional Liability.
  *   **The Implicit Theory:** "Supervisory Principalism."
  *   **Coherence Check:** Pragmatic vs. Theoretical.
  *   **Strict Presuppositions vs. Compatible Fits.**
  *   **Alternative 1: AI as Full Moral Agent.**
  *   **Alternative 2: AI as Mere Instrument.**
