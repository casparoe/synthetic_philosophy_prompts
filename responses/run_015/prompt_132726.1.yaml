  **Scenario**
  Consider a demographic projection regarding the total integrated population of the human species ($N$). Two competing models, $H_{Doom}$ and $H_{Boom}$, are currently indistinguishable by non-indexical data (economic trends, resource constraints, and technological trajectories are equivocal), setting their prior odds at 1:1. $H_{Doom}$ posits humanity will go extinct within a few centuries, resulting in a total historical population of $10^{11}$ observers. $H_{Boom}$ posits successful space colonization, resulting in a total historical population of $10^{20}$ observers. You are a living human investigator who has just tested positive for a rare, neutral genetic marker $M$. Under $H_{Doom}$, marker $M$ is prevalent (frequency $1\%$), meaning $10^9$ total humans possess it. Under $H_{Boom}$, marker $M$ is diluted by the vast population (frequency $10^{-8}$), meaning $10^{12}$ total humans possess it. Your evidence $E$ is the conjunction of your existence and possessing marker $M$.

  **Calculations and Verdicts**
  *   **Hypotheses:** $H_{Doom}$ ($N_1 = 10^{11}$, $n_1 = 10^9$) vs. $H_{Boom}$ ($N_2 = 10^{20}$, $n_2 = 10^{12}$).
  *   **SIA:** Weights by absolute count of observers with evidence $E$.
      *   Likelihood Ratio ($H_{Boom}/H_{Doom}$) = $n_2 / n_1 = 10^{12} / 10^9 = \mathbf{1000:1}$.
      *   **Verdict:** Strongly favors **$H_{Boom}$**.
  *   **SSA:** Weights by fraction of reference class with evidence $E$.
      *   Fraction$_{Doom} = 10^9 / 10^{11} = 10^{-2}$.
      *   Fraction$_{Boom} = 10^{12} / 10^{20} = 10^{-8}$.
      *   Likelihood Ratio ($H_{Doom}/H_{Boom}$) = $10^{-2} / 10^{-8} = \mathbf{1,000,000:1}$.
      *   **Verdict:** Overwhelmingly favors **$H_{Doom}$**.

  **Structural Feature and Removal**
  The reversal is produced by the **disparity in total population sizes ($N_2/N_1$)** decoupled from the disparity in evidence-holders ($n_2/n_1$). SIA tracks the absolute number of people like you ($n$), while SSA tracks the probability of *being* one of them ($n/N$). In this case, $H_{Boom}$ creates more people like you (favoring SIA), but makes *you* a much rarer fraction of the total (favoring SSA). If this feature is removed by stipulating $N_1 = N_2$ (equal total populations), the $N$ terms cancel in the SSA calculation, making the SSA likelihood ratio identical to the SIA ratio ($n_1/n_2$). The case collapses into the standard Presumptuous Philosopher shape where SIA is merely more confident than SSA, or they agree entirely if fractions are also equal.

  **Reference Class Sensitivity**
  *   **All Humans:** The verdicts **survive**. The hypotheses explicitly define the total count of this class ($10^{11}$ vs $10^{20}$), preserving the $N$ disparity required for divergence.
  *   **All Observers:** The verdicts **do not survive** unless the hypotheses also constrain alien populations. If $H_{Doom}$ and $H_{Boom}$ only concern humans, and the universe contains a fixed, dominant population of alien observers (e.g., $10^{30}$), then $N_{total} \approx Constant$ for both hypotheses. SSA then reduces to SIA (both proportional to $n$), and both would favor $H_{Boom}$. Divergence requires the hypothesis to scale with the chosen reference class.

  **Counter-Argument from the Losing Side (SSA)**
  An SSA defender would attack the **independence of the marker frequency**. They would argue that positing a frequency of $10^{-8}$ in $H_{Boom}$ solely to satisfy the math smuggles in indexical assumptions. More fundamentally, they would attack the **1:1 prior**, arguing that a physical model allowing $10^{20}$ humans is inherently less probable (more complex/resource-intensive) than one allowing $10^{11}$, and that SIA illicitly compensates for this physical improbability by "counting heads" rather than weighing evidence. They would reject the case as a "Presumptuous" inflation of the Boom hypothesis without empirical warrant.

  **Practical Divergence**
  The assumptions **diverge on action**.
  *   **Under SIA ($H_{Boom}$ likely):** Long-term existential risk reduction is the dominant priority. Saving humanity yields value proportional to the $10^{20}$ future lives at stake. Investment in multi-generational infrastructure is rational.
  *   **Under SSA ($H_{Doom}$ likely):** Long-term investment is largely wasted. The expected future population is small. Resources should be allocated to near-term welfare and consumption, as the "long future" is anthropically unlikely.
  The choice of assumption dictates whether a "Longtermist" policy is rational or negligent.
