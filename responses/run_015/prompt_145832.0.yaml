      *   "I am the person who studies X." If X is a dead end, *I* am a dead end.
      *   This makes the "Loser Pays" penalty infinitely higher. It's not just -10 reputation points; it's an existential crisis.
      *   *Implication:* Kill criteria cannot be purely objective/metric-based because identity distorts the interpretation of metrics.

  4.  **Brainstorming "Weedy" Implications for Kill Criteria:**
      *   *Pre-commitment:* Needs to happen before identity attaches.
