answer: |-
  This is a sharp framing. The classic Dollar Auction (Shubik, 1971) is usually taught as a warning about rational actors making irrational decisions due to sunk costs. But in small research collectives, the currency isn't cash; it's **epistemic capital** (credibility) and **biographical time** (years of your life).

  When the "loser pays" rule applies to research, it means that if a project is killed, the lead doesn't just get zero return; they actively pay a penalty (damaged reputation, "wasted" grant years, CV gaps). This creates a perverse incentive to escalate commitment well past the point of diminishing returns to avoid realizing the loss.

  Here is the weedy breakdown of how identity-driven escalation changes the design of kill criteria, moving beyond standard "milestone" checks.

  ### 1. The Identity Lock-In vs. The Hypothesis
  In the standard economic model, bidders want the dollar. In research collectives, bidders often *are* the hypothesis.
  *   **The Trap:** When a researcher's self-concept ("I am the person who solves X") merges with the project, the "Loser Pays" penalty becomes existential. Stopping the project isn't just a strategic pivot; it feels like a personal invalidation. This makes standard kill criteria (e.g., "If p-value > 0.05 by Date Y") useless because the team will unconsciously massage the data or move the goalposts to protect the identity.
  *   **The Design Fix:** **Decouple Identity at Inception.**
      *   Kill criteria must be established *before* the team publicly associates their names with the specific outcome.
      *   **Protocol:** Use "Probe Projects" vs. "Flagship Projects." A Probe Project has a kill criterion that is framed as *learning*, not *failing*. If a Probe is killed, the "win" is the data generated, not the hypothesis proven. This lowers the "loser pays" penalty.
      *   **Identity Audit:** Include a soft kill criterion: "If team members become defensive about criticism of the methodology rather than the results, trigger a review." Defensiveness is the behavioral marker that identity has merged with the bid.

  ### 2. The "Second-Bidder" Problem in Teams
  In the Dollar Auction, the tragedy is often the *second-highest* bidder. They have paid 99 cents to win nothing. In research teams, this is the Postdoc or PhD student who joined a PI's vision two years in.
  *   **The Trap:** The PI might have enough reputational cushion to absorb a failed project. The junior researcher does not. If the project escalates, the junior researcher is the one actually paying the "loser" penalty (no publication, delayed graduation). They cannot afford to let the auction stop, so they push for escalation even harder than the PI.
  *   **The Design Fix:** **Asymmetric Kill Rights.**
      *   Standard governance gives the PI the kill switch. In an escalation dynamic, the PI is often the highest bidder and least likely to pull the plug.
      *   **Protocol:** Give the "second bidders" (junior researchers) veto power on continuation. If the people whose *careers* are most at risk vote to kill, the project dies, regardless of the PI's desire to continue. This aligns the kill decision with those facing the steepest "loser pays" penalty.

  ### 3. Reframing the "Loser Pays" Penalty
  The Dollar Auction works because the penalty for stopping is certain (you lose your bid), while the penalty for continuing is probabilistic (you *might* win the dollar).
  *   **The Trap:** In research, a "dead" project is often treated as a stigma. This guarantees the loss. Continuing offers the lottery ticket of a breakthrough. Rational actors will always buy the lottery ticket if the alternative is certain social death.
  *   **The Design Fix:** **Subsidize the Loss.**
      *   You must artificially lower the cost of losing the auction.
      *   **Protocol:** Pre-commit to publishing negative results or "null finding" papers under the collective's brand, not just the individual's. If the collective absorbs the reputational hit, the individual's "bid" is refunded.
      *   **The "Graveyard" Budget:** Allocate a specific portion of the collective's output (e.g., 20% of blog posts, working papers, or conference slots) specifically for "Killed Projects." This signals that killing a project is a standard operational output, not a failure state. It removes the stigma penalty.

  ### 4. Epistemic Goalpost Shifting
  In the monetary auction, the prize is fixed ($1). In research, the prize is mutable. As costs escalate, teams often redefine "success" to justify the bid.
  *   **The Trap:** "We didn't solve Fusion, but we solved a sub-problem in plasma containment." This is rationalization. It allows the auction to continue because the prize value is inflated to match the current bid.
  *   **The Design Fix:** **Frozen Prize Definitions.**
      *   Kill criteria must include a "Prize Freeze."
      *   **Protocol:** At the start, define the *minimum viable contribution* (MVC). If the project cannot deliver the MVC, it is a loss. You cannot downgrade the MVC mid-project to avoid the loss.
      *   **The "Pre-Mortem" Trigger:** Schedule a mandatory session at the 50% time mark where the team assumes the project *has failed* and writes the history of why. If the team cannot articulate a plausible failure mode that doesn't involve "bad luck," they are likely in an escalation trap.

  ### 5. Managing the "Sunk Time" Illusion
  Time in research is non-fungible. You can't get two years back. But reputation is somewhat fungible (you can build it elsewhere).
  *   **The Trap:** Teams often bid time because it feels "free" compared to money, but they bid reputation because it feels "sticky." The escalation happens when they use *more time* to try to salvage the *reputation* already bid.
  *   **The Design Fix:** **Reputational Hedging.**
      *   Never allow a single project to consume more than X% of the collective's public-facing identity.
      *   **Protocol:** Enforce a "Portfolio of Bets" rule. No researcher in the collective is allowed to have >50% of their public output tied to a single long-running hypothesis. This ensures that if the auction goes sour, the "loser pays" penalty is capped. It prevents the "all-in" scenario where escalation feels like the only survival strategy.

  ### 6. The "Rational" Escalation of Belief
  You mentioned the edge case where escalation *feels* rational. In deep research, you often learn the most right before a breakthrough. Quitting too early is also a failure mode.
  *   **The Trap:** The Dollar Auction warns against irrational escalation. But in science, "doubling down" is sometimes the correct scientific move. The danger is when the decision to double down is driven by *avoiding loss* rather than *expectation of value*.
  *   **The Design Fix:** **Blind Valuation.**
      *   To distinguish between "scientific hunch" and "escalation trap," you need to remove the sunk cost from the valuation.
      *   **Protocol:** Bring in an external reviewer who is *not* told how much time/money has already been spent. Ask them: "If you were starting today, with current knowledge, would you fund this?" If the answer is no, but the team says "Yes, because we've come so far," you are in a Dollar Auction.
      *   **The "Zero-Base" Kill Criterion:** Every renewal cycle requires justifying the project as if it were a new proposal. Past investment is explicitly excluded from the justification document.

  ### Summary of Practical Takeaways for Kill Criteria

  1.  **Metric:** Don't just measure progress; measure **attachment**. (e.g., "Are we arguing about semantics?")
  2.  **Governance:** Give the **junior researchers** the kill switch (they pay the highest price).
  3.  **Incentive:** **Pre-publish the failure.** Make the "loss" a valid output to remove the penalty.
  4.  **Definition:** **Freeze the Prize.** Do not allow goalpost shifting to justify sunk costs.
  5.  **Valuation:** Use **blind external review** to separate scientific potential from sunk cost recovery.

  The core insight is that in research collectives, the Dollar Auction isn't about greed; it's about **coherence**. People escalate to keep their narrative of themselves as competent researchers coherent. Your kill criteria must disrupt that narrative coherence *safely* before it becomes a financial or career catastrophe.
