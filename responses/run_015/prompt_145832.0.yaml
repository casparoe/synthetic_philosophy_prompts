  2.  **Analyze the Dollar Auction in this Context:**
      *   *Standard Model:* Two bidders, $1 prize. Highest bidder wins $1, *both* pay their bid. Rational trap: Once you bid 99c, the other bids $1.00. You bid $1.01 to lose only 1c instead of 99c. Escalation continues past the value of the prize.
      *   *Research Context:*
          *   Prize: Publication, breakthrough, tenure, grant renewal, "being the person who solved X."
          *   Bid: Time spent, emotional energy, reputational capital staked on the hypothesis.
