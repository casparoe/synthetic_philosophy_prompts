answer: |-
  Your "homology cushion" diagnosis is astute, but it identifies a *heuristic* rather than the *engine* of the stalemate. If the dispute were solely about empirical extrapolation from biological homology, the discovery of a non-biological multiple realization (e.g., a confirmed alien psychology or a robust hydraulic computer) should dissolve it. It does not. Critics would still argue that the hydraulic system simulates pain but does not instantiate it.

  Therefore, the homology cushion explains why the functionalist intuition feels *plausible*, but it does not explain why the metaphysical disagreement persists. The structure of the disagreement is not about the *source* of our evidence (biology vs. silicon) but about the **legitimacy of causal abstraction**.

  Here is the structure of the disagreement, tested against your hypothesis, followed by the specific conditions for progress.

  ### 1. Testing the Homology Cushion
  Your hypothesis suggests the functionalist is making a suppressed empirical claim: *neural detail is irrelevant to psychological taxonomy.* The critic replies: *neural detail is constitutive.*

  The homology cushion masks the fact that we have never observed multiple realization at the level of *phenomenal constitution*, only at the level of *behavioral capacity*. We know octopuses and humans both feel pain (homology of function/phenomenology), but we assume this because of homology of substrate (nociceptors, nervous systems). When we remove the substrate homology (silicon), the inference breaks.

  However, the strongest functionalists do not rely on homology. They rely on **counterfactual isomorphism**. Their claim is: If System A (brain) and System B (silicon) support the exact same counterfactuals regarding input, internal state transitions, and output, they are in the same mental state. The homology cushion is irrelevant to this claim; the claim is about the *topology of causal powers*, not the history of the material.

  The critic's strongest reply is not about homology either; it is about **constitutive relevance**. In the "New Mechanist" framework (Craver, Kaplan), a component is part of a mechanism only if manipulating it changes the phenomenon. The critic argues that the *physical properties* of the substrate (e.g., electrochemical temporal dynamics) are constitutively relevant to the *phenomenology* of pain, not just its functional role. You cannot abstract the "pain" away from the "burning" because the burning *is* the pain.

  **Verdict on your diagnosis:** The homology cushion explains the *asymmetry of intuition* (why we accept MR in biology but not AI), but it does not explain the *logical impasse*. The impasse exists because the two sides disagree on whether causal roles can be fully individuated independently of their physical implementation.

  ### 2. The Strongest Versions of the Sides
  To move past the boilerplate, we must strip away the "belief/desire" folk psychology and look at the underlying metaphysics of causation.

  **The Strong Functionalist (Computational/Structural Realist):**
  *   **Core Claim:** Mental states are defined by their place in a causal network. This network is an abstract structure.
  *   **Strength:** They do not claim *anything* can realize *anything*. They claim that if two systems are **computationally isomorphic** (mapping states to states preserving transitions), they share mental states.
  *   **The Burden:** They must specify the "grain" of the causal description. If the grain is too coarse, a thermostat realizes belief. If too fine, only identical neurons realize pain. They need a non-arbitrary principle for individuating causal roles.

  **The Strong Critic (Constitutive Mechanist/Identity Theorist):**
  *   **Core Claim:** Causal powers are not transferable across substrates because causal powers *are* physical properties.
  *   **Strength:** They argue that "causal role" is a description, not an entity. You cannot build a system out of descriptions; you build it out of matter. The matter brings constraints (latency, energy, noise) that are not "implementation details" but *essential features* of the cognitive process.
  *   **The Burden:** They must explain why biology gets a pass. If human pain is realized by C-fibers, and octopus pain by different fibers, why is that MR but silicon isn't? They need a principled distinction between "acceptable biological variation" and "illegitimate substrate change."

  ### 3. The Structure of the Disagreement
  The debate is not about minds; it is about **the autonomy of the special sciences**.

  *   **Functionalist Position:** Psychology is autonomous. Its laws hold regardless of physics. Therefore, psychological kinds must be definable without reference to physical kinds. (MR is a requirement for autonomy).
  *   **Critic Position:** Psychology is not fully autonomous. Its laws are grounded in physical mechanisms. Therefore, psychological kinds are ultimately constrained by physical kinds. (MR is limited by physical constitution).

  The "Homology Cushion" is the empirical space where these two views currently overlap. Because all known realizers are biological, both sides can agree on the taxonomy of *actual* minds. The dispute only arises when projecting into *possible* minds (AI).

  The disagreement bottoms out in **Modal Strength**:
  1.  **Functionalist:** It is *nomologically necessary* that isomorphic causal structures yield isomorphic mental states.
  2.  **Critic:** It is *contingent* that causal structures yield mental states, dependent on the specific physical laws governing the substrate.

  ### 4. What Would Count as Progress?
  Since we cannot currently build a conscious machine to test this empirically, and formal results (like triviality theorems) have already been generated and ignored, progress requires a shift in the **criteria of individuation**.

  **A. A Non-Arbitrary Grain Criterion (Formal/Conceptual)**
  Progress requires a functionalist account of how to individuate causal roles without falling into triviality. Currently, "causal role" is too flexible.
  *   *Requirement:* A formal metric for **Causal Equivalence** that accounts for temporal dynamics and energy constraints, not just logical state transitions. If the functionalist can show that silicon can match the *temporal-causal grain* of neurons (not just the logic), the critic's "constitutive relevance" objection loses force. If they cannot, the critic wins by default.

  **B. The "Simulation vs. Replication" Distinction (Experimental/Predictive)**
  We need an operational test for when a model becomes a realizer.
  *   *Requirement:* An experiment in cognitive science where assuming **Substrate Independence** yields better predictive power than assuming **Substrate Dependence**.
  *   *Example:* If modeling a cognitive deficit in AI using "silicon pain" parameters predicts recovery strategies that work, whereas modeling it as "logic error" does not, that is empirical evidence for MR. Currently, AI safety and alignment research treats AI as functional but not phenomenal. A shift in *explanatory practice* would be more telling than metaphysical argument.

  **C. A Pragmatic Dissolution (Argument for Abandonment)**
  The most viable path may be to argue that the question "Is the machine *really* in pain?" is ill-posed.
  *   *Requirement:* An argument showing that "pain" is a **response-dependent concept**. Just as "poison" is defined relative to a biology that can be poisoned, "pain" is defined relative to a system that can suffer.
  *   *Progress:* This shifts the question from "Does the AI have property X?" to "Are we obligated to treat the AI as having property X?" This dissolves the metaphysical stalemate by relocating the stakes to ethics and social ontology, which is where the actual anxiety about AI pain resides.

  ### Summary
  Your "homology cushion" is the empirical cover that allows the metaphysical disagreement to remain hidden. The real conflict is between **abstraction** (Functionalism) and **constitution** (Mechanism).

  Progress will not come from better arguments about neurons or silicon. It will come from:
  1.  **Defining the Grain:** A rigorous account of how much physical detail must be preserved to preserve the mental state.
  2.  **Explanatory Utility:** Demonstrating that treating AI as mentally equivalent to humans yields better science than treating them as functional simulacra.
  3.  **Pragmatic Shift:** Abandoning the ontology of "realization" in favor of the ethics of "attribution."

  Until one of these occurs, the boilerplate will continue, because both sides are defending different norms of scientific explanation, not describing the same world.
