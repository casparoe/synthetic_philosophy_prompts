  ### The Diagnostic Tree

  To diagnose a broken metric, do not start with the failure. Start with the structure. Three binary questions carve the logical space into eight cells. We use the user's questions, collapsing Q1 (Damage) into the outcome and Q2 (Speed) as observational noise.

  1.  **Structure:** Is the incentive a **Cliff** (threshold) or a **Gradient** (smooth)? (Q3)
  2.  **Response:** Is the effort **Redirected** (working differently) or is the Channel **Attacked** (faking/breaking)? (Q5)
  3.  **Ontology:** Is the measure a **Proxy** (stands for thing) or **Constitutive** (defines thing)? (Q4)

  **The Logical Space**
  Combining these yields eight cells. Two are incoherent (you cannot attack the channel of a definition you control). Two merge (Constitutive measures function similarly regardless of structure). One cell is crowded (Gradient/Redirect/Proxy), requiring subdivision by *where* the effort goes and *whether* the correlation survived.

  | Cell | Structure | Response | Ontology | Occupancy |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Cliff | Redirect | Proxy | **Threshold Hugging** |
  | 2 | Cliff | Attack | Proxy | **Boundary Corruption** |
  | 3 | Gradient | Redirect | Proxy | **Crowded** (See Leaves) |
  | 4 | Gradient | Attack | Proxy | **Channel Corruption** |
  | 5 | Cliff | Redirect | Constitutive | **Redefinition** |
  | 6 | Cliff | Attack | Constitutive | *Incoherent* (Why break your own rule?) |
  | 7 | Gradient | Redirect | Constitutive | **Redefinition** |
  | 8 | Gradient | Attack | Constitutive | *Incoherent* (Why break your own rule?) |

  ### The Leaves

  **1. Threshold Hugging** (Cell 1)
  *   **Signature:** Data bunching immediately below the cutoff; sharp drop-off in performance just past the line.
  *   **Commitment:** You must accept that meeting the target was never the goal; staying just under it was.
  *   **Move:** If data bunches *above* the cutoff, you are in Boundary Corruption.

  **2. Boundary Corruption** (Cell 2)
  *   **Signature:** Discontinuous jump in reported numbers at the threshold without real-world change; audit trails show stopped clocks or reclassified inputs.
  *   **Commitment:** You must admit the institution is actively lying to survive.
  *   **Move:** If the clock wasn't stopped but patients were triaged away, you are in Threshold Hugging.

  **3. Cream-Skimming** (Cell 3a)
  *   **Signature:** Input mix shifts toward easier cases; variance in case difficulty drops while average score rises.
  *   **Commitment:** You are serving fewer of the people who need you most.
  *   **Move:** If the input mix is stable but work processes changed, you are in Effort Substitution.

  **4. Effort Substitution** (Cell 3b)
  *   **Signature:** Measured tasks improve; unmeasured tasks of equal value degrade; total output volume is flat.
  *   **Commitment:** You are optimizing the map, not the territory.
  *   **Move:** If unmeasured tasks stay flat rather than degrade, you are in Proxy Decay.

  **5. Proxy Decay at Extremes** (Cell 3c)
  *   **Signature:** Correlation holds in the middle range but breaks down at high performance levels; top scorers diverge from quality.
  *   **Commitment:** The measure works for average cases but fails for excellence.
  *   **Move:** If correlation breaks down everywhere, you are in Channel Corruption.

  **6. Channel Corruption** (Cell 4)
  *   **Signature:** Metric rises while all independent audits fall; variance collapses to zero or maximum.
  *   **Commitment:** The measurement system itself is compromised, not just the work.
  *   **Move:** If the metric rises because the work changed (not the data), you are in Effort Substitution.

  **7. Redefinition** (Cells 5 & 7)
  *   **Signature:** No divergence between metric and reality because reality has changed to match the metric; staff speak the metric as language.
  *   **Commitment:** You have lost the ability to criticize the metric using the old definition of the work.
  *   **Move:** If outsiders still reject the metric's validity, you are in Effort Substitution.

  **8. The Survivor** (Cell 3d)
  *   **Signature:** Metric rises; independent audits rise; variance remains stable; no gaming detected.
  *   **Commitment:** You must acknowledge luck or exceptional design, not assume robustness.
  *   **Move:** If independent audits flatline, you are in Effort Substitution.

  ### The Sidebar: Ten Questions

  1.  Is there a bonus or penalty triggered at a specific number?
  2.  Do reports show a pile-up of cases just before that number?
  3.  Can staff change the data without changing the work?
  4.  Do audits catch data that contradicts the official score?
  5.  Has the job description changed to match the metric?
  6.  Are easier cases being selected over harder ones?
  7.  Did unmeasured tasks get neglected?
  8.  Does the metric work for average performers but fail for top ones?
  9.  Did the score go up while outside checks stayed flat?
  10. Did the score go up while outside checks also rose?

  **Scoring Rule:**
  *   **Q1-2 Yes:** Threshold Hugging.
  *   **Q3-4 Yes:** Channel/Boundary Corruption.
  *   **Q5 Yes:** Redefinition.
  *   **Q6 Yes:** Cream-Skimming.
  *   **Q7 Yes:** Effort Substitution.
  *   **Q8 Yes:** Proxy Decay.
  *   **Q9 Yes:** Effort Substitution (Decoupled).
  *   **Q10 Yes:** The Survivor.
  *   **Disagreement:** The tree separates Boundary Corruption (Cliff) from Channel Corruption (Gradient). The quiz groups them (Q3-4). If you have a Cliff and data falsification, the tree says Boundary, the quiz says Corruption. Trust the tree.

  ### Worked Applications

  **Case 1: Hospital Emergency Department (Clean)**
  *Patients held in ambulances before the four-hour clock starts.*
  **Verdict:** Boundary Corruption.
  **Path:** Cliff (4-hour target) + Attack (stopping the clock) + Proxy (wait time stands for care speed).
  **Evidence:** The signature is the ambulance hold. The clock is attacked, not the care process. The commitment is that the hospital is lying to regulators. This moves to Threshold Hugging only if patients were treated faster rather than held outside.

  **Case 2: School Accountability (Ambiguous)**
  *Test scores rise for three years; unaudited assessment stays flat.*
  **Verdict:** Effort Substitution vs. Proxy Decay.
  **Path:** Gradient (scores) + Redirect (teaching) + Proxy (test stands for learning) + Decoupled (unaudited flat).
  **Ambiguity:** Both leaves sit in Cell 3. Substitution implies teaching to the test degraded other skills. Decay implies the test stopped measuring learning at high scores.
  **Settling Evidence:** Check the curriculum. If narrow test prep replaced broad learning, it is Substitution. If the test simply became easier to game without curriculum change, it is Decay. The tree cannot settle this without knowing *how* the effort was redirected.
