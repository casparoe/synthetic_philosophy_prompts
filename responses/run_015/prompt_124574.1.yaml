answer: |-
  **Joint Statement on the Concept of "The Will of the People"**

  **1. Agreed Claims**

  1.  The *boundary problem* entails that no voting rule can legitimately select its own *demos*; every procedure presupposes a prior political decision about who belongs.
  2.  *Mandate underdetermination* is inherent to elections: a victory specifies neither which platform commitments were authorized nor which version of those commitments was endorsed.
  3.  The *spokesperson's regress* cannot be fully closed; any claim to speak for the people must initiate a chain of authorization that itself lacks prior procedural validation.
  4.  The proceduralist camp concedes that purely *aggregative* readings lack normative force if conditions for the *deliberative* reading (adequate information, mutual justification) are systematically violated.
  5.  The populist camp concedes that *acclamatory* readings, if disconnected from *aggregative* verification, inevitably degrade into oligarchy, as leaders discerning the will face no constraint against projecting their own preferences.
  6.  The *ascriptive* reading ("the real people") is operationally unavoidable in constituting a *demos* but theoretically dangerous when used to exclude resident minorities from protection.
  7.  Institutions do not merely record the will of the people; they constitute the subjects who possess that will by shaping identities and interests.
  8.  Legitimacy requires stability: a system that constantly invokes the pre-institutional will to overturn institutions cannot sustain the cooperation required for freedom.
  9.  Conversely, a system that treats procedure as entirely self-justifying risks becoming inert, unable to correct for structural exclusions embedded in the rules themselves.
  10. Neither camp can eliminate the risk of usurpation: the populist risks authoritarianism via the *acclamatory* reading; the proceduralist risks oligarchy via the *aggregative* reading managed by elites.

  **2. Verbal versus Substantive**

  Much of our dispute dissolves upon distinguishing the *aggregative* and *deliberative* readings from the *ascriptive* and *acclamatory* ones. We agree that if "the will of the people" means simply what a legitimate procedure outputs (*aggregative*), then the proceduralist is correct: there is no will prior to the count. We also agree that if "the will of the people" means what citizens would endorse under ideal conditions (*deliberative*), then the populist is correct that existing institutions often fail to capture it. These are verbal disputes regarding the definition of "democratic."

  However, a substantive crux survives regarding the *ascriptive* and *acclamatory* readings. The populist argues that when institutions systematically fail to reflect the *deliberative* will, a claim to represent the *ascriptive* people (the excluded majority) justifies extra-procedural action. The proceduralist argues that such claims are inherently ventriloquism because the *boundary problem* ensures no one can identify the "real people" outside a rule. This is not merely verbal; it is a disagreement about whether legitimacy can ever originate outside constituted authority. We agree this crux is substantive: it concerns whether the *spokesperson's regress* can be broken by political action or only by legal rule.

  **3. A Disagreements Table**

  | (a) Crux | (b) Populist Formulation | (c) Proceduralist Formulation | (d) Shared Case | (e) Populist Prediction | (f) Proceduralist Prediction | (g) Evidence Against |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Veto Points vs. Direct Will** | Constitutional veto points illegitimately suppress the *acclamatory* will when it is clearly expressed via referendum. | Veto points protect the *deliberative* will from transient *aggregative* majorities that lack sustained justification. | A party wins a plurality on a commitment that a constitutional supermajority blocks, with a later referendum on that same commitment passing 51–49 at 64% turnout. | The blockade will be viewed as a legitimacy crisis, provoking instability or constitutional rupture. | The blockade will be viewed as stability, preserving rights against a narrow majority. | **Populist:** Stability persists despite the blockade. **Proceduralist:** Instability/rupture occurs despite the veto. |
  | **Preference vs. Will** | Surveys register preference; the party's reform expresses the *deliberative* will voters would hold if fully informed. | Surveys register the *aggregative* will; ignoring them treats voters as subjects to be educated rather than principals. | A movement party in office implements a reform opposed by a large majority of its own voters while insisting that surveys register preference, not will. | Voters will retrospectively endorse the reform once benefits materialize, validating the *deliberative* reading. | Voters will punish the party electorally, validating the *aggregative* reading as the only reliable metric. | **Populist:** Electoral punishment occurs. **Proceduralist:** Retrospective endorsement occurs. |
  | **The Boundary Problem** | The *ascriptive* people of the region possess constituent power to decide their own boundaries via referendum. | The *demos* is defined by the existing constitutional order; a sub-unit cannot unilaterally redefine the boundary. | A secession referendum in a wealthy region, where what is at stake is which *demos* gets to decide. | The central state's refusal to recognize the vote will be seen as occupation, validating the *ascriptive* claim. | The central state's refusal will be seen as law enforcement, validating the procedural boundary. | **Populist:** Peaceful separation occurs despite central refusal. **Proceduralist:** Violence/Coercion required to sustain separation. |
  | **Technocracy vs. Majority** | Stable majorities opposing a policy indicate the *aggregative* output is failing to track the *deliberative* interest of the people. | Stable majorities opposing a policy indicates populism; the technocratic body protects long-term interests against short-term will. | An unelected technocratic body sustains, over a decade, a policy that stable majorities have consistently opposed. | The policy will be reversed by political intervention once the *acclamatory* pressure becomes undeniable. | The policy will persist, justified by outcomes (e.g., economic stability) independent of majority opinion. | **Populist:** Policy persists without reversal. **Proceduralist:** Policy is reversed by political intervention. |

  **4. Unsettled Remainder**

  We sign this document acknowledging that our collaboration has not resolved the fundamental tension between constituent power and constituted authority. This is not because we lacked the evidence; the cases above provide ample empirical data regarding stability, legitimacy, and outcomes. Rather, we could not agree on what would count as evidence against our core normative commitments. For the populist, evidence of systemic exclusion validates extra-procedural action regardless of legal cost; for the proceduralist, evidence of legal rupture invalidates the claim to representation regardless of exclusion. We agree that "the will of the people" remains an essentially contested concept, functioning simultaneously as a description of institutional output and a claim to judgment upon those institutions. We conclude that democracy requires both the risk of usurpation and the risk of inertia, and that no theory can eliminate one without inviting the other.

  *Signed,*
  *The Substantive Theorist & The Procedural Theorist*
