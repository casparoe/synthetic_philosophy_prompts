answer: |-
  1. The account must classify strong cases like Sophie's Choice and mundane clashing promises as genuine dilemmas only if remaining obligations persist post-choice, distinguishing them from mere epistemic uncertainty. This phenomenology is non-negotiable data.

  2. It must reject the agglomeration principle as a deontic logic flex rather than moral data, since impossible conjunctions define the tragic structure where one must do A and must do B but cannot do both. This rejection is non-negotiable.

  3. Regarding buyouts, an unaffordable escape clause must count as binding as the original promise, marking affordability as a constraint on obligation rather than a price tag that dissolves the conflict. This is non-negotiable for true conflict.

  4. For self-inflicted conflicts, the account must separate blame for entering the situation from the dilemma's structure itself, otherwise habituation in repeatable cases would falsely negate the conflict. Separating these is non-negotiable, though culpable origin is a preference of responsibility-focused traditions.

  5. It must distinguish first-personal agent-regret from third-party blame, allowing an agent to be rationally doomed without being morally monstrous. This distinction is non-negotiable data.

  6. Satisfying both the non-agglomeration requirement and the demand for consistent action-guidance creates a tension where rational choice becomes impossible, forcing the theorist to sacrifice logical coherence. This incompatibility is a result, not a checklist failure.

  7. The rejection of agglomeration knocks out standard Kantian and Consequentialist views, while Rossian pluralism survives only by treating residues as mere regrets, and particularism wins by accepting the contradiction. This single requirement excludes the most popular views.
