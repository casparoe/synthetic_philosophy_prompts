answer: |-
  # Diagnostic Quiz: Which View of Moral Luck Do You Actually Hold?

  ## Part I: The Logical Space

  Before answering the questions below, understand how this instrument maps your intuitions. We are not asking you to identify with a philosopher's name (e.g., "Kantian" or "Utilitarian"). Instead, we are locating your position within a logical space defined by two crossing dimensions.

  **Dimension 1: The Kind of Luck**
  1.  **Resultant:** Luck in how an action turns out (e.g., whether a careless driver hits a pedestrian).
  2.  **Circumstantial:** Luck in the situations you face (e.g., whether you live in a time of war or peace).
  3.  **Constitutive:** Luck in who you are (e.g., your temperament, genes, or impulses).
  4.  **Causal:** Luck in the antecedent causes of your will (e.g., upbringing, trauma, or determinism).

  **Dimension 2: The Object of Assessment**
  1.  **Wrongness:** The objective moral status of the act itself.
  2.  **Blameworthiness:** The retrospective judgment others make about the agent.
  3.  **Guilt:** What it is appropriate for the agent to feel internally.
  4.  **Sanction:** The punishment or penalty that is proportionate.

  **How to Read Your Result**
  A philosophical position is not a single "Yes/No" on moral luck. It is a profile across this grid. You might believe luck affects *Sanction* but not *Blameworthiness*, or that *Constitutive* luck matters but *Resultant* luck does not. The scoring key at the end will map your specific pattern of answers to a region in this space. Inconsistent answers will reveal "Two-Level" views; consistent rejection of luck reveals the "Strict Control" view.

  ***

  ## Part II: The Diagnostic Questions

  **1. The Two Drivers (Basic Verdict)**
  Driver A and Driver B both drive home equally drunk and equally carelessly. A hits and kills a child who runs into the street. B arrives home safely without incident.
  *Regarding their **blameworthiness**:*
  A) A is significantly more blameworthy than B.
  B) A is slightly more blameworthy than B.
  C) A and B are equally blameworthy.

  **2. The Two Drivers (The Superiority Claim)**
  Consider Driver B (the one who hit no one). Later, B insists: "My driving record is spotless. This proves I am a morally better person than A, whose record now includes a death."
  *Evaluate B's insistence:*
  A) B is correct; the outcome reveals a moral difference between them.
  B) B is mistaken; the outcome is irrelevant to their moral standing, though B is luckier.
  C) B is mistaken; the outcome is irrelevant, and B should feel just as tainted as A.

  **3. The Circumstantial Case (1929)**
  Person X and Person Y have identical vicious, selfish dispositions. In 1929, X lives in Germany and joins the Nazi party, committing atrocities. Y is relocated to Argentina before the rise of Hitler and lives a quiet, law-abiding life as a shopkeeper, never having the chance to act on their vices.
  *Regarding their **moral character**:*
  A) X is morally worse than Y because X actually committed atrocities.
  B) X and Y are equally morally corrupt, though X is more dangerous.
  C) Y is less corrupt because Y did not succumb to the temptation when it arose.

  **4. The Constitutive Case (Temperament)**
  Person P has a violent temper caused by a genetic condition. Person Q has a calm temperament. Both are provoked identically. P lashes out violently; Q remains calm.
  *Regarding **blame** for the violence:*
  A) P is less blameworthy because the temper was not chosen.
  B) P is equally blameworthy; the violence is what matters, not the source of the impulse.
  C) P is more blameworthy because P should have known about the condition and managed it.

  **5. Attempt vs. Completion (Law and Blame)**
  Person M attempts to murder a rival but misses due to a sudden gust of wind. Person N succeeds in murdering a rival under identical intentions and actions, minus the wind.
  *Compare your view on **legal sentencing** with your view on **moral blameworthiness**:*
  A) Law and Morality align: N deserves more punishment and is more blameworthy.
  B) Law diverges: N deserves more prison time, but M and N are equally blameworthy.
  C) Law and Morality diverge radically: N deserves more prison time, but M is *more* blameworthy for relying on luck.

  **6. The Near-Miss Asymmetry**
  Return to Driver B (the careless driver who hit no one). When B realizes how close they came to killing a child, B feels intense relief.
  *Regarding B's internal state:*
  A) B is right to feel relieved; B is innocent of harm.
  B) B is right to feel lucky, but should still feel guilty for the risk imposed.
  C) B should feel neither; the risk was standard for driving, and no harm occurred.

  **7. Temporal Distance**
  An engineer negligently signs off on a bridge design. The bridge stands for 30 years while the engineer lives a blameless life. In year 31, the bridge collapses due to that original flaw, killing people.
  *Regarding the engineer's **current blameworthiness**:*
  A) The engineer is as blameworthy now as they would have been on day one.
  B) The engineer is less blameworthy now; the long blameless life dilutes the past negligence.
  C) The engineer is more blameworthy; the debt of negligence has compounded over time.

  **8. Causal Luck (Trauma)**
  Adult S and Adult T both commit the same assault. S had a childhood of severe abuse that impaired their impulse control. T had a stable, loving upbringing.
  *Regarding **culpability**:*
  A) S is less culpable; their will was shaped by forces outside their control.
  B) S and T are equally culpable; both are adults responsible for their actions.
  C) S is more culpable; S has more obstacles to overcome and failed to do so.

  **9. The Object Split (Guilt vs. Sanction)**
  Consider a case of Resultant Luck (like the Two Drivers). Suppose we decide the drivers are *equally blameworthy*.
  *Regarding **punishment** and **guilt**:*
  A) They should receive equal punishment and feel equal guilt.
  B) They should receive unequal punishment (A more than B) but feel equal guilt.
  C) They should receive equal punishment but feel unequal guilt (A more than B).

  **10. Wrongness vs. Blame**
  Consider the Two Drivers again.
  *Did the **wrongness of the act** change based on the outcome?*
  A) Yes. Killing a child is a worse act than risking it, even if the risk was identical.
  B) No. The act (driving drunk) was fully formed before the outcome occurred.
  C) No, but the act acquires a new moral property (tragedy) that changes how we respond.

  ***

  ## Part III: Scoring Key and Position Mapping

  Tally your answers according to the groups below. Your pattern reveals your "Leaf" in the logical space.

  **Group 1: Resultant Luck Sensitivity (Questions 1, 2, 5, 6, 7, 10)**
  *   **High Sensitivity:** Mostly A answers. You believe outcomes change blame, wrongness, or sanction.
  *   **Low Sensitivity:** Mostly B or C answers. You believe outcomes are morally irrelevant to the agent's status.

  **Group 2: Circumstantial & Constitutive Sensitivity (Questions 3, 4, 8)**
  *   **High Sensitivity:** Mostly A answers (in Q3/Q8) or C answers (in Q4). You believe situation and temperament mitigate or aggravate judgment.
  *   **Low Sensitivity:** Mostly B answers. You believe character and circumstance do not excuse the act.

  **Group 3: Object Differentiation (Questions 5, 9)**
  *   **Unified:** You gave the same verdict for Law, Blame, Guilt, and Sanction.
  *   **Split:** You distinguished between what the law should do, what blame is appropriate, and what the agent should feel.

  ### The Leaves (Position Profiles)

  **Leaf 1: The Strict Control Principle (The Purist)**
  *   **Pattern:** Low Sensitivity in Groups 1 & 2; Unified in Group 3 (Equal everything).
  *   **Location:** Rejects luck across all four Objects.
  *   **Description:** You hold that moral assessment must depend only on the will. If the intention and effort were identical, the moral status is identical, regardless of outcome, genes, or history.

  **Leaf 2: The Common Intermediate View (The Pragmatist)**
  *   **Pattern:** Low Sensitivity in Group 1 (Blame/Wrongness); High Sensitivity in Group 2 (Character); Split in Group 3 (Sanction varies, Blame does not).
  *   **Location:** Accepts Circumstantial/Constitutive luck regarding character, but denies Resultant luck regarding basic blameworthiness. Allows luck to influence Sanction.
  *   **Description:** You believe we are products of our history (constitutive/circumstantial), but outcomes (resultant) shouldn't change *blame*, though they may change *punishment* for practical reasons.

  **Leaf 3: The Resultant Realist (The Mirror Image)**
  *   **Pattern:** High Sensitivity in Group 1; Low Sensitivity in Group 2.
  *   **Location:** Accepts Resultant luck affects Wrongness/Blame, but insulates Character/Constitution from luck.
  *   **Description:** **No established name.** This is a rare view holding that outcomes matter morally, but your genes and upbringing do not excuse you. You treat the world as consequentialist but the agent as a libertarian island.

  **Leaf 4: Full-Blooded Acceptance (The Hard Luck Theorist)**
  *   **Pattern:** High Sensitivity in Groups 1 & 2.
  *   **Location:** Accepts luck across all Kinds and most Objects.
  *   **Description:** You acknowledge that who we are, where we are, and what happens are all matters of fortune, and moral judgment tracks these facts. You likely see blame as a response to harm and character, not just control.

  **Leaf 5: The Two-Level Theorist (The Splitter)**
  *   **Pattern:** Mixed answers in Group 3 (e.g., Equal Blame, Unequal Sanction/Guilt).
  *   **Location:** Luck affects some Objects (Sanction, Guilt) but not others (Wrongness, Blameworthiness).
  *   **Description:** You maintain a distinction between the objective act (which might be luck-free) and the reactive attitudes or social practices (which are sensitive to luck).

  **Leaf 6: The Revisionist (The Deflationist)**
  *   **Pattern:** Inconsistent answers that suggest discomfort (e.g., "Equally blameworthy" but "A deserves more prison" and "A is a worse person"). Or, selecting options that curtail blame entirely (e.g., Q8 Option A combined with Q1 Option C).
  *   **Location:** Suggests ordinary moral judgment is incoherent.
  *   **Description:** Your answers suggest that once luck is acknowledged, our standard practices of blame cannot be sustained logically. You likely lean toward curtailing blame practices rather than extending them to cover luck.

  ***

  ## Part IV: Notes on Indistinguishability and Unoccupied Cells

  ### Indistinguishable Leaves
  This instrument cannot separate **Leaf 1 (The Strict Control Principle)** from a specific version of **Leaf 6 (The Revisionist)** that advocates for the abolition of blame.
  *   **The Problem:** Both profiles may result in "Equal Blameworthiness" verdicts on the quiz (rejecting luck). However, the Strict Control theorist believes blame is *preserved* and purified (we blame only the will), whereas the Abolitionist Revisionist believes blame is *undermined* (since the will is never free of luck, we should blame no one).
  *   **Why it persists:** To separate them, we would need a question about metaphysical free will (e.g., "Did the agent could have done otherwise in a causal sense?"). This violates the constraint of using only concrete case verdicts. Given the case set, these two distinct metaphysical commitments yield identical diagnostic profiles.

  ### Unoccupied Cells of the Logical Space
  The following combinations of answers represent logical spaces no major philosophical leaf occupies:

  1.  **Luck affects Wrongness but not Blameworthiness.**
      *   *Diagnosis:* **Incoherent.** If an act is objectively "worse" due to luck, it is unintelligible to claim the agent who performed it is not more blameworthy.
  2.  **Luck affects Constitutive traits (temperament) but not Circumstantial situations.**
      *   *Diagnosis:* **Unattractive.** There is no principled reason to accept that genes are luck while denying that being born in a war zone is luck; this view arbitrarily privileges internal biology over external history.
  3.  **Luck affects Sanction but makes the Act Less Wrong.**
      *   *Diagnosis:* **Unexplored.** Standard views hold that if luck increases punishment, it is because the act/harm is worse; increasing sanction while decreasing wrongness contradicts the proportionality principle of justice.
  4.  **Luck affects Guilt but not Sanction.**
      *   *Diagnosis:* **Psychologically Unstable.** It is difficult to sustain a practice where an agent must feel intense guilt for a lucky outcome but society imposes no proportional external sanction; this creates a disconnect between private conscience and public justice.
