  I've been reading a lot about predictive processing and the free energy principle lately, mostly trying to make sense of why my anxiety is so out of propotion to what's actually going on. And I keep getting stuck on this thing: the brain is supposed to be a prediction machine whose whole job is to minimize surprise. But if minimizing surprise is the point, how does it ever actually get surprised? Isn't that just a contradiction built into the theory?
