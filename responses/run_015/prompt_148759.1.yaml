  ***

  **DRAFT JOINT STATEMENT: INTERPERSONAL UTILITY AND PHENOMENAL BRIDGES**

  **1. Agreed Claims**
  1.  **The Epistemic Gap:** We agree that the traditional "problem of other minds" is an epistemic barrier, not necessarily a metaphysical one. Current welfare economics relies on revealed preferences because direct access is impossible, not because utility is inherently private.
  2.  **Inadequacy of Ordinalism:** Both camps agree that ordinal preference satisfaction is insufficient for high-stakes policy decisions requiring trade-offs between individuals (e.g., triage, resource allocation). A cardinal metric is required for coherent aggregation.
  3.  **Technical Specification of Bridges:** For the sake of this argument, we assume "Phenomenal Bridges" exist. These are interfaces that allow Subject A to experience the qualitative states of Subject B with zero signal loss and no semantic translation error.
  4.  **Measurement vs. Aggregation:** We distinguish between *measuring* a state (assigning a magnitude to a qualia instance) and *aggregating* states (summing magnitudes across subjects). We agree that bridges solve the measurement access problem; we disagree on whether this resolves the aggregation problem.

  **2. Areas of Disagreement**

  | Issue | Cardinalist Wording (Accepted by Camp A) | Separationist Wording (Accepted by Camp B) | Linked Crux |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Shared Qualia** | Bridges create a "common currency" of experience; qualia become public objects accessible to multiple observers. | Bridges transmit data, but the experience remains indexed to a specific first-person frame; qualia are frame-relative vectors. | Crux 1 |
  | **The Indexical Remainder** | The "who" of experience is dissolved or standardized during bridging; the "I" is noise. | The "who" is constitutive; even perfect transmission retains a coordinate dependency (like velocity). | Crux 2 |
  | **Validity of Summation** | Once measured on a shared scale, utilities are additive across subjects. | Utilities are only additive within a single indexical frame; cross-frame summation is category error. | Crux 3 |

  **3. Cruxes and Hypothetical Tests**

  **Crux 1: The Ontological Status of the Bridge-State**
  *   **(a) Sub-question:** When Agent A bridges to Agent B's pain state, is there one pain event experienced twice, or two pain events with identical content?
  *   **(b) Hypothetical Test:** A and B are bridged. A stimulus causes intensity-X pain in B. A reports feeling intensity-X pain. We ask: Is the total suffering in the system 1 unit or 2 units?
  *   **(c) Predicted Outcomes:**
      *   *Cardinalists:* 2 units. There are two subjects hosting the state. The content is identical, but the instantiation is duplicated.
      *   *Separationists:* Undefined/1 unit. The "pain" is a relation between a state and a subject. Without a unified subject, the concept of "total pain" lacks a reference frame.

  **Crux 2: The Reference Frame Shift**
  *   **(a) Sub-question:** Does the first-person perspective function like a spatial coordinate (essential) or like a camera angle (accidental)?
  *   **(b) Hypothetical Test:** A triple-bridge scenario. A, B, and C are all linked. A feels B's pain, B feels C's pain, C feels A's pain. Can we derive a stable "group utility" function?
  *   **(c) Predicted Outcomes:**
      *   *Cardinalists:* Yes. The network creates a super-subject or a standardized grid where utilities can be mapped and summed.
      *   *Separationists:* No. This creates a loop of indexical dependencies without a fixed origin point. Aggregation requires a "view from nowhere" which is conceptually broken for experience.

  **Crux 3: The Zero-Sum Welfare Case**
  *   **(a) Sub-question:** Can a gain for A literally offset a loss for B if the qualitative magnitude is identical?
  *   **(b) Hypothetical Test:** A gains +10 hedons, B loses -10 hedons (verified via bridge). Is the net welfare change 0?
  *   **(c) Predicted Outcomes:**
      *   *Cardinalists:* Yes. +10 and -10 cancel out on the common cardinal scale.
      *   *Separationists:* No. The +10 exists in Frame A, the -10 exists in Frame B. You cannot subtract coordinates from different reference frames without a transformation rule, which we lack.

