  Helen looked at the timer box where the plastic casing had gone yellow in the sun. Henderson's marrows were due a full cycle; shifting the dial now would shave ten minutes off their supply. It would send those ten minutes down to the wildflower strip behind the sheds instead. She looked at the marrows, heavy and low on the vine, then at the dial. She turned the knob. The click sounded loud in the quiet afternoon. The water diverted. She walked away without checking the flowers.

  **Version 2 (Chapter 19: Hostile External, Good Consequence First)**

  Helen looked at the timer box where the plastic casing had gone yellow in the sun. The wildflower strip behind the sheds was due a full cycle; shifting the dial now would send ten minutes down to their roots. It would shave ten minutes off Henderson's marrow supply instead. She looked at the flowers, patchy and dry, then at the dial. She turned the knob. The click sounded loud in the quiet afternoon. The water diverted. She walked away without checking the marrows.

  ***

  ### The Analysis

  **1. The Verdict and Mechanism**
  In Version 1, readers will overwhelmingly say Helen harmed Henderson intentionally. In Version 2, despite the foregrounding of the benefit, readers will still likely say she helped the flowers *unintentionally* (or at best, ambiguously), while maintaining that the harm was intentional. The standard Knobe asymmetry is robust; moral valence drives the concept of intentionality more strongly than information order. The mechanism here is the **Blame-First Norm**: readers treat "intentional" as a marker for blame-worthy agency. When a side effect is bad, the label "intentional" is recruited to secure the blame. When it is good, the label is withheld because no blame needs securing.

  **2. The Single Feature Carrying the Case**
  The feature is the **Normative Status** of the consequence (Harm vs. Help). If you delete the specific objects ("marrows" vs. "wildflowers") and replace them with neutral terms ("Plot A" vs. "Plot B"), the asymmetry collapses. Readers will then treat both as foreseen side effects and attribute intentionality to neither, or to both equally, depending on their baseline theory of action. The moral weight is the engine; without it, you just have a hydraulic adjustment.

  **3. The Effort/Control Objection**
  A sceptic (or a reader focused on skill) will argue: "Turning a knob is trivial. She didn't *try* to do anything, she just turned it. Neither effect is intentional." They attack the link between *foreknowledge* and *intention*. To dodge this without rigging the symmetry, you must increase the **specificity of the adjustment**. If she has to calibrate the dial to a precise minute to achieve the trade-off, it demonstrates control.
  *Smallest Tweak:* Add "She set the dial to the four-minute mark." This implies precision. If she hits the exact mark needed to swap the water, she exercised control over both outcomes. This forces the reader to rely on moral valence rather than "she just bumped it" to distinguish the two effects.

  **4. Can You Flip It?**
  You asked if you can make the good consequence look intentional and the bad one not, while keeping symmetry. The honest answer is **no**, not within the standard Knobe framework. The asymmetry is rooted in the reader's moral psychology, not your sentence structure. To flip it, you must break symmetry: the good consequence must appear as a **means** (e.g., she needs the flowers to grow to hide something) while the bad one remains a side effect. If you keep them as symmetric side effects, the bad one will always attract "intentional" more strongly. The only way to soften this is to make the harm seem like a **norm-compliant trade-off** (e.g., "It was her turn on the rota") rather than a violation.

  **5. The Novelist Question**
  *Which single line pushes the reader?*
  Plant this in Chapter 7 (Close): **"She knew exactly where the water would go."**
  Plant this in Chapter 19 (Hostile): **"She knew exactly where the water would go."**
  *Wait, same line?* Yes. In Chapter 7, inside her head, it reads as competence/awareness. In Chapter 19, outside looking in, it reads as calculation/malice. The *context* of the narration does the work, not the line itself.

  *Does it survive being read back-to-back?*
  No. If a reader reads Chapter 7 and then immediately reads Chapter 19, the trick dissolves into a puzzle. They will see the mechanic. To survive the days-apart reading, the **narrative voice** must do the heavy lifting. Chapter 7 must feel so intimate that the reader excuses the harm as "necessary." Chapter 19 must feel so cold that the reader condemns the help as "incidental." The repetition of the action shouldn't feel like a replay; it should feel like an indictment. If you rely solely on the Knobe asymmetry, the second reading will retroactively poison the first. You need the hostile narration in Chapter 19 to reframe the *memory* of Chapter 7, not just duplicate it.
