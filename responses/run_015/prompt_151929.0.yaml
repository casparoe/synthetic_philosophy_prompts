answer: |-
  Good morning. It is an honor to welcome you to *Reading the Blank Spaces*.

  Looking around this room, I see a division that is often kept separate in our work. On one side, we have those whose labor is anchored in the state's memory: the census ledgers, the bureaucratic correspondence, the court transcripts preserved in public repositories. On the other, we have those whose labor is anchored in private memory: the oral testimonies, the family heirlooms, the photographs kept in shoeboxes, and the embodied knowledge of descendants.

  Usually, when these two groups meet, the goal is reconciliation. We are often asked to find a way to make the oral history validate the archive, or to make the archive authenticate the memory. We are asked to build a bridge.

  I would like to propose, instead, that we spend these days examining the gap itself.

  I am a doctoral student, and like many of you, I am trained to treat evidence with specific protocols. In my recent coursework, I have been wrestling with an economic concept that I believe haunts this room: the sunk cost fallacy. In economics, a sunk cost is an investment that has already been made and cannot be recovered. The rational choice is to ignore that past investment when making future decisions. To continue a project simply because you have already spent money on it is considered irrational.

  But history is not a market, and our methods are not merely capital.

  Many of us in this room have incurred enormous sunk costs. We have spent years learning paleography, mastering finding aids, and decoding the specific, dry language of the bureaucracy. We have invested our intellectual lives in learning how to read the state's records with rigor and care. There is a genuine rationality in honoring that investment. To discard the state archive because it is flawed would be to blind ourselves to the machinery of power that shaped the lives we study. The ledger tells us how the state saw the subject, and that is a truth we cannot afford to lose.

  However, if we treat that methodological investment as binding—if we insist that only what is cataloged counts as knowledge—we risk committing a violence. We risk interpreting the absence of non-elite records as a natural void, rather than as an engineered omission. The blank space in the ledger is not always an accident; sometimes, it is a policy.

  This creates a discomfort we must inhabit together.

  For those of us trained in the archive, the discomfort lies in admitting that our rigor may be built on a foundation of exclusion. We must acknowledge that the silence in the record is not merely a lack of data to be solved, but often a structural feature of the institution we study.

  For those of us working with oral history and material culture, the discomfort is different. It lies in the temptation to fill those silences too quickly. There is an ethical risk in romanticizing absence. When we listen to the stories of descendants, or read the wear on a tool, we are engaging in an act of reconstruction. We must be careful not to invent voices to fill the quiet, or to treat memory as a perfect corrective to the document. Memory, like the archive, has its own fractures.

  So, where does this leave us?

  If we follow the logic of sunk costs strictly, we might say we should abandon the archive because it is compromised. But that is impossible; the state happened, and its records remain the evidence of its actions. Conversely, if we ignore the sunk costs of our training, we might treat the archive as infallible. That is dangerous; it erases the human beings who were never counted.

  We cannot resolve this tension by simply combining our sources. We cannot just paste a family photograph next to a census record and claim the picture is complete. The friction between the two is where the history lives.

  Over the next few days, I ask that we resist the urge to solve this problem. I ask that we do not treat this workshop as a diplomatic negotiation where we meet in the middle to sign a treaty of methodology. There is no middle ground between the state's record of a life and the family's memory of it. There is only the space between them.

  I invite you to bring your sunk costs into the light. Let us acknowledge the time we have spent learning to read the bureaucracy, and let us acknowledge the emotional labor required to sustain memory against erasure. Neither of these commitments should be dismissed. Neither should be treated as beyond examination.

  We are here to read the blank spaces, not to fill them in. We are here to ask why the space is empty, and what weight that emptiness carries.

  Let us begin not with an agreement, but with a shared recognition that our methods are both necessary and insufficient. Let us work together inside this discomfort, knowing that the questions we raise today will not be answered by the end of the session, but must be carried forward in the work we do when we leave this room.

  Welcome.
