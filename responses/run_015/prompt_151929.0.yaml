          *   Group B: Independent oral historians, descendants, museum practitioners (reliant on material culture, family papers, embodied memory).
      *   **Goal:** Welcome both groups without privileging one, avoiding a "diplomatic compromise."
      *   **Core Concept:** The "Sunk Cost Fallacy" applied to methodology/institutions.
          *   *Tension:* Is it irrational to honor sunk costs (time/energy spent mastering state archives)? There is rationality in continuing, but risk in treating archival absence as natural rather than engineered.
          *   *Requirement:* Affirm archival rigor without implying only archived lives count. Acknowledge counter-archives without romanticizing silence or inventing voices.
      *   **Tone:** Polished, formal but accessible (no jargon heavy enough to exclude non-academics), no citations/bibliography.
