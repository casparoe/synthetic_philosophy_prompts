answer: |-
  This is a classic stalemate in meta-ethics, often referred to as the **Paradox of Supererogation**. It pits a consequentialist-leaning view (value drives praise) against a deontological-leaning view (obligation drives praise). As a referee, I find that both ethicists land significant blows, but both also rely on unstated assumptions that weaken their positions.

  Here is the step-by-step adjudication of their exchange, followed by an analysis of what both are missing.

  ### Round 1: The Nature of Praise

  **Ethicist 1 (E1): "Praise is grounded in the production of good, not in obligation."**
  *   **Verdict:** **Partially Right, but Incomplete.**
  *   **Analysis:** E1 is correct that moral praise is fundamentally responsive to value. We do not praise acts that make the world worse. However, E1 is incorrect to suggest obligation is *irrelevant* to praiseworthiness. If a firefighter saves a child because it is her job (obligation), we praise her competence and reliability. If a bystander saves the child (supererogatory), we praise her *character* and *benevolence*. The *object* of the praise shifts. By collapsing praise solely into "production of good," E1 risks praising accidental good outcomes (e.g., I drop a sandwich, a starving dog eats it) which are not morally praiseworthy. Praise requires agency, not just value.

  **Ethicist 2 (E2): "If praise tracks value, optionality drops out... The category 'optional but praiseworthy' is unstable."**
  *   **Verdict:** **Logically Strong, but Morally Counterintuitive.**
  *   **Analysis:** E2 identifies a genuine logical tension known as the "Maximalist Objection." If Act A (donating a kidney) produces more good than Act B (keeping it), and morality is about maximizing good, then Act A *should* be obligatory. E2 is right that if "value" is the only metric, "optionality" becomes a dummy variable. However, E2's conclusion—that the act must therefore be required—is a *non sequitur* regarding moral practice. Just because an act is the *best* act doesn't automatically make it a *duty*. E2 assumes a binary moral landscape (Forbidden vs. Required) that erases the middle ground of Moral Freedom. She wins the logic point but loses the phenomenological point (how we actually experience morality).

  ### Round 2: The Role of Cost

  **Ethicist 1 (E1): "The 'more praiseworthy' intuition is explained by sacrifice, not obligation."**
  *   **Verdict:** **Right.**
  *   **Analysis:** This is the strongest argument in the exchange. E1 correctly identifies that supererogation is distinct from duty primarily through **agent-cost**. Duties are generally expected to be fulfilled at reasonable cost. Heroism involves bearing costs that exceed the call of duty. This explains why the kidney donor is "more praiseworthy" than the firefighter: the donor absorbs a loss that morality does not demand. This rescues optionality; the act is optional *because* the cost is too high to mandate, yet praiseworthy *because* the agent bore that cost voluntarily.

  **Ethicist 2 (E2): "Cost without good isn't praiseworthy... The extra credit for optionality is still unexplained."**
  *   **Verdict:** **Right on Condition, Wrong on Conclusion.**
  *   **Analysis:** E2 is correct that cost alone is not virtue (suffering for no reason is not moral heroism). Value is a necessary condition. However, E2 is wrong to conclude that because value is necessary, optionality is irrelevant. She presents a false dilemma: either praise comes from Value or it comes from Cost. In reality, supererogatory praise comes from **Value *secured through* Costly Choice.**
      *   E2 claims optionality is unexplained. But optionality is explained by the *limit of demand*. We are allowed to prioritize our own integrity and bodily autonomy (hence, optional). When we override that permission for the sake of others (hence, praiseworthy), the optionality *is* doing the work. It signals that the agent had a moral permission to do otherwise but chose the good anyway.

  ### The Verdict: Who Wins?

  **Overall:** **Ethicist 1 takes the round, but Ethicist 2 wins the war of scrutiny.**

  Ethicist 1 successfully defends the *existence* of the category. Supererogation is real because our moral practices clearly distinguish between what we owe each other (justice/duty) and what we give each other (gifts/heroism). Ethicist 2 fails to prove the category is incoherent; she only proves that it is difficult to reconcile with strict maximizing consequentialism.

  However, Ethicist 2 is right that Ethicist 1's initial definition of praise was too loose. E1 had to retreat from "praise tracks good" to "praise tracks sacrifice" to make the view hold water. E2 successfully forced E1 to refine the theory.

  ### What Both Are Missing

  To make your piece on moral heroism robust, you should highlight the blind spots both ethicists share. They are arguing over the *accounting* of morality (costs vs. value), but they are missing the *architecture* of morality.

  **1. The Distinction Between "Assessment" and "Prescription"**
  Both ethicists treat moral language as if it serves one function. But philosophers like David Heyd argue morality has two layers:
  *   **Prescriptive (Deontic):** What you *must* do (Obligation).
  *   **Evaluative (Aretaic):** What kind of person you *are* (Virtue).
  E2 tries to force the Evaluative into the Prescriptive (if it's good, you must do it). E1 tries to ground the Prescriptive in the Evaluative. The missing insight is that supererogation lives in the gap between the two. You can be a "good person" (Evaluative) without violating a "moral rule" (Prescriptive).

  **2. The Social Function of Optionality**
  Neither ethicist asks *why* we have the category of supererogation. It serves a vital social function: **Protection of Autonomy.**
  If we classify kidney donation as obligatory (as E2 suggests), we justify coercing donors. By classifying it as supererogatory, we protect bodily autonomy while still encouraging altruism. The "extra praise" isn't just a reward; it's a social incentive mechanism designed to encourage acts we cannot demand. Optionality isn't a logical bug; it's a feature of a liberal moral society.

  **3. The Role of Motivation**
  Both focus on the *act* (donating the kidney) and the *outcome* (saving a life). They largely ignore the *motive*.
  *   If I donate a kidney for a tax break, E1 says it's praiseworthy (good produced). E2 says it's obligatory (good produced).
  *   Most intuitions suggest it is *not* morally praiseworthy if the motive is selfish.
  Supererogation is not just about high-cost, high-value acts; it is about high-cost, high-value acts performed **for the right reasons.** The "optionality" allows the motive to be pure. If it were obligatory, I could do it grudgingly and still be "in the clear." Because it is optional, doing it proves I care. That is where the praise comes from.

  ### Recommendation for Your Piece

  Use this disagreement to show that moral heroism is inherently tension-filled.
  *   **Use E1** to explain why we admire heroes (they give beyond what is asked).
  *   **Use E2** to explain the danger of heroism (if we admire it too much, we start expecting it from everyone, turning heroes into suckers).
  *   **Resolve it** by suggesting that supererogation is the safety valve that allows morality to be demanding without becoming tyrannical. The "instability" E2 detects is not a flaw in the concept, but a reflection of the fragile balance between what we owe society and what we owe ourselves.
