answer: |-
  This is a classic sticking point. The algebra is linear regression in disguise, but the philosophy is where the weight lies. You are right to feel that the move from "coherence under risk" to "aggregation across persons" is the critical leap.

  Here is a breakdown designed for your reading group, structured to give you the board example first, then the intuition, then the adjudication of the challenges.

  ### 1. The Board Example (2-Person, 2-Outcome)

  Do not start with general notation. Draw this matrix on the board.

  **The Setup:**
  *   **Persons:** Alice (1) and Bob (2).
  *   **Outcomes:** $X$ and $Y$.
  *   **Individual Utilities (vNM):**
      *   Alice: $u_1(X) = 10, u_1(Y) = 0$.
      *   Bob: $u_2(X) = 0, u_2(Y) = 10$.
      *   (We fix the scales arbitrarily because vNM utilities are unique up to affine transformation).

  **The Lotteries:**
  Consider three social lotteries over these outcomes:
  *   $L_A$: 100% chance of $X$. (Payoffs: Alice 10, Bob 0)
  *   $L_B$: 100% chance of $Y$. (Payoffs: Alice 0, Bob 10)
  *   $L_{Mix}$: 50% chance of $X$, 50% chance of $Y$.

  **The Mechanism:**
  1.  **Individual Rationality:** Because Alice satisfies vNM axioms, her utility for the mixture is the average of her utilities for the components:
      $$u_1(L_{Mix}) = 0.5(10) + 0.5(0) = 5$$
      Bob is symmetric: $u_2(L_{Mix}) = 5$.
  2.  **Social Rationality:** The theorem assumes *Society* also satisfies vNM axioms. Therefore, the Social Welfare ($W$) of the mixture must be the average of the Social Welfare of the components:
      $$W(L_{Mix}) = 0.5 W(L_A) + 0.5 W(L_B)$$
  3.  **Pareto:**
      *   Compare $L_A$ to $L_{Mix}$. Alice prefers $L_A$ (10 vs 5). Bob prefers $L_{Mix}$ (5 vs 0). Pareto is silent here.
      *   Compare $L_A$ to a lottery $L_C$ that gives (0,0). Everyone prefers $L_A$. So $W(L_A) > W(L_C)$.
      *   **The Kicker:** The only function $W(u_1, u_2)$ that satisfies the linearity condition in step 2 *for all possible lotteries* is a linear sum.
      *   If $W$ were, say, multiplicative ($u_1 \times u_2$), then $W(L_{Mix}) = 25$, but $0.5 W(L_A) + 0.5 W(L_B) = 0.5(0) + 0.5(0) = 0$. $25 \neq 0$. Multiplication violates social vNM rationality.
      *   If $W$ is additive ($a u_1 + b u_2$), then $W(L_{Mix}) = 5a + 5b$, and $0.5 W(L_A) + 0.5 W(L_B) = 0.5(10a) + 0.5(10b) = 5a + 5b$. It holds.

  **Gut Intuition:** The vNM axioms force utilities to be **linear in probabilities**. If you treat "being Alice" and "being Bob" as mutually exclusive states of the world (like Heads and Tails), then aggregating across people is mathematically isomorphic to averaging across probabilities. Linearity across probabilities *becomes* linearity across people.

  ---

  ### 2. Correcting Your Statement & The Pareto Condition

  Your statement is mostly correct, but the Pareto nuance is vital for the weights.

  *   **Pareto Indifference:** If everyone is indifferent between $L_1$ and $L_2$, Society is indifferent.
      *   *Result:* $W = \sum a_i u_i + c$.
      *   *Weights:* The $a_i$ can be **negative**.
      *   *Meaning:* A negative weight implies "spite." If Alice gains utility and social welfare goes down, Alice's interests count against the social good.
  *   **Weak Pareto:** If everyone prefers $L_1$ to $L_2$, Society prefers $L_1$ to $L_2$.
      *   *Result:* $W = \sum a_i u_i + c$.
      *   *Weights:* The $a_i$ must be **non-negative** (and at least one positive).
      *   *Meaning:* No one's interests actively harm the social good.

  **Why?** Geometrically, Pareto Indifference says the social indifference curves are parallel to the individual ones. Weak Pareto says they slope the "right" way (upward in utility space). If you allow negative weights, you could have a situation where making everyone better off makes society worse off, which violates Weak Pareto.

  ---

  ### 3. The "Sleight of Hand": Why Social vNM?

  You asked: *"Why does a set of conditions that look like they're about coherence under risk end up saying anything about how to aggregate different people's interests?"*

  Your glimmer is correct: **"No aversion to inequality across the persons-as-states."**

  Here is the explicit step you felt was missing:
  1.  **vNM Linearity:** The defining feature of vNM utility is that the utility of a lottery is the *expected value* of the utilities of the outcomes. $U(L) = \sum p_k U(outcome_k)$.
  2.  **The Isomorphism:** Harsanyi asks us to view the social choice problem as a decision under uncertainty for an "Impartial Observer."
      *   State 1: You are Alice.
      *   State 2: You are Bob.
      *   Probability: $p_1, p_2$.
  3.  **The Constraint:** By insisting the *Social* ordering satisfies vNM, we are insisting that Society is **risk-neutral over the distribution of utility.**
      *   Society values a 50% chance of (Alice=10, Bob=0) and 50% chance of (Alice=0, Bob=10) *exactly the same* as a 100% chance of (Alice=5, Bob=5).
      *   Why? Because $0.5 W(10,0) + 0.5 W(0,10) = W(5,5)$.
      *   If Society were inequality-averse (prioritarian), it would prefer the sure (5,5). That would violate the vNM axioms for the social ordering.

  **So, what is doing the real work?**
  It is the assumption that **Social Rationality = Individual Rationality.** We are imposing the structure of individual decision-making under risk onto the collective decision-making problem. The additivity across people is a direct consequence of the additivity across probabilities.

  ---

  ### 4. Adjudicating the Challenges

  #### Challenge 1: Unequal Probabilities (Life Expectancy)
  *The Claim:* The observer should weight by person-years, not persons.
  *The Verdict:* **The theorem accepts this; the moral argument decides it.**

  *   **The Theorem:** The Aggregation Theorem itself ($W = \sum a_i u_i$) is silent on the values of $a_i$. It only says the weights must be constant and non-negative (given Weak Pareto). It does not demand $a_i = a_j$.
  *   **The Impartial Observer:** Harsanyi's *moral argument* for Utilitarianism (distinct from the Aggregation Theorem) invokes the Veil of Ignorance. He argues rationality requires assigning equal probability to being any *person*.
  *   **The Objection:** If your group member defines "person" as a "temporal slice," then yes, the long-lived get more weight. If she defines "person" as a "biographical life," they get equal weight.
  *   **Adjudication:** This is not a refutation of the theorem. It is a debate about the **identity conditions of the agents** entering the formula. The theorem says "If you have weights, sum them." The philosophy says "The weights should be equal per life." If she argues for person-years, she is proposing a different metric of identity, not breaking the math.

  #### Challenge 2: Risk Aversion Behind the Veil (Prioritarianism)
  *The Claim:* A rational observer would be risk-averse, preferring a guaranteed medium welfare to a gamble on high/low welfare, implying Prioritarianism ($\sum f(u_i)$ where $f$ is concave).
  *The Verdict:* **This rejects a premise of the theorem, it does not refute the logic.**

  *   **The Confusion:** The member is conflating *risk aversion over goods* with *risk aversion over utility*.
      *   vNM utility functions *already* encode risk aversion over goods (e.g., diminishing marginal utility of income).
      *   However, vNM utility functions are **linear in probability**. You cannot be risk-averse over your own vNM utilities. If $U$ is your vNM function, you must maximize $E[U]$.
  *   **The Conflict:** To be a Prioritarian, you must assert that the **Social Welfare Function** is *not* a vNM utility function over the same domain as the individuals.
      *   Harsanyi assumes: Social Preferences satisfy vNM axioms.
      *   Prioritarian says: Social Preferences satisfy vNM axioms *transformed by a concave function*.
  *   **Adjudication:** The member is correct that Prioritarianism is attractive, but she is wrong that it is compatible with Harsanyi's assumptions. She is objecting to the axiom that **Society must be risk-neutral over distributions of individual utility.**
      *   *How to frame it:* "You are arguing that the Social Ordering should not satisfy the Independence Axiom in the same way individuals do. That is a valid normative critique of the **Social vNM assumption**, but it concedes that *if* we accept Social vNM, Utilitarianism follows."

  #### Challenge 3: Escaping Arrow
  *The Claim:* Is this a substantive escape or a verbal trick?
  *The Verdict:* **Substantive, but costly.**

  *   **Arrow's Theorem:** Assumes **Ordinal** utilities and **No Interpersonal Comparisons**. Result: Impossibility.
  *   **Harsanyi's Theorem:** Assumes **Cardinal** utilities (vNM) and **Interpersonal Comparability** (via the affine scaling required to sum them). Result: Possibility (Utilitarianism).
  *   **The Trade-off:** Harsanyi escapes Arrow by assuming exactly the information Arrow said we don't have.
      *   Arrow: "I won't let you compare the size of Alice's utility unit to Bob's."
      *   Harsanyi: "The vNM axioms + Pareto force a unique scaling (up to a common affine transformation) that allows comparison."
  *   **Adjudication:** It is not verbal. It is a genuine mathematical escape route opened by richer data. However, the "cost" is that cardinal, comparable utility is philosophically and empirically contentious. The theorem tells us: *"If you can measure utility cardinally and compare it interpersonally, Utilitarianism is the only coherent aggregation method."* It does not tell us *how* to measure that utility.

  ### Summary for your Presentation

  1.  **The Mechanism:** Linearity over probabilities (vNM) $\rightarrow$ Linearity over people (Aggregation). "Persons as States."
  2.  **The Board:** Show that any non-additive function (like multiplication or maximin) violates the linearity requirement of the Social vNM axioms when applied to lotteries.
  3.  **The Pareto:** Weak Pareto kills negative weights (spite). Indifference alone allows them.
  4.  **The Challenges:**
      *   *Weights:* Theorem is silent; Moral argument dictates equal weight per person.
      *   *Risk Aversion:* This attacks the "Social vNM" axiom. You can't have both Harsanyi's assumptions and Prioritarianism.
      *   *Arrow:* Substantive escape via cardinality, not a trick.

  If you lose the thread again, remember: **Harsanyi treats Society like a single rational agent facing a lottery where the prizes are "being Person A," "being Person B," etc.** Once you accept that metaphor, the math is inevitable. The fight is over whether that metaphor is morally appropriate.
