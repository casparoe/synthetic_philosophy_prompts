  5.  **Refining the EDT/CDT Critique:**
      *   I need to be precise here. Why is he wrong?
      *   Standard view: Credence and Decision Theory are orthogonal. You can be a Halfer CDT, Halfer EDT, Thirder CDT, Thirder EDT.
      *   The "Betting Argument": If Beauty is offered a bet every awakening, Thirders say take it (expected value positive). Halfers say don't (expected value 0).
      *   The draft claims CDT *requires* the 1/2 prior. This confuses "causal independence" with "evidential irrelevance." CDT says your bet doesn't *cause* the coin flip. It does *not* say you should ignore the evidence of waking up (if you think waking up is evidence).
      *   There *is* a literature (e.g., Meacham, Briggs) discussing if CDT and EDT diverge *given* Thirderism. Some argue CDT leads to "Halfer-like" betting behavior even with Thirder credences in specific setups (the "Self-Indication Assumption" vs. "Self-Sampling Assumption" interplay with decision theory). But stating "CDT says... stick with prior of 1/2" is definitely wrong. CDT agents conditionalize on their information set.

  6.  **Refining the Driver Critique:**
      *   Piccione and Rubinstein (1997). The Driver problem involves *planning* vs. *action* consistency. Beauty is usually about *credence*. The analogy holds for "imperfect recall," but the solution methods (counting possibilities) are not universally accepted for Driver either.

