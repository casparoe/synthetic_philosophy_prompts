  *(Self-Correction during drafting)*: I should make sure to mention that Wittgenstein might think the *question* is ill-posed in the way the user suggests (smuggling semantic/phenomenological issues). That's a very Wittgensteinian move. I will emphasize that in the "Ill-posed" section.

