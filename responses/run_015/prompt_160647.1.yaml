answer: |-
  This is a sophisticated problem. You have encountered the tension between Lakatos's *reconstruction* of history (which is retrospective) and the *decision-making* of scientists (which is prospective). Your draft principle captures the spirit but lacks the structural distinctions needed to handle identity, granularity, and the difference between accommodation and prediction.

  Below is a repaired principle, tested against your cases, followed by the honest limitations and the practical surrogate you need for your PhD student.

  ### I. The Refined Principle: Temporal-Heuristic Appraisal

  A Research Programme (RP) is appraised not as a monolith, but as a trajectory of **Research Lines** (specific configurations of the protective belt). The appraisal distinguishes between *Theoretical Progress* (internal coherence/explanatory scope) and *Empirical Progress* (novel corroboration).

  **Clause 1: The Excess Content Condition (Motivated by cases ii, iii, iv, v)**
  A Research Line is **empirically progressive** over period *t* if, and only if, it yields corroborated facts that possess **use-novelty**.
  *   *Definition:* A fact has use-novelty if it was not used in the construction of the hypothesis that predicts it.
  *   *Distinction:*
      *   **Strong Novelty (Case iii):** Predicted *before* the fact is known. (Highest credit).
      *   **Weak Novelty (Case iv):** The fact was known, but *not used* to construct the theory. (Moderate credit; counts as unification).
      *   **Zero Novelty (Case v):** The fact was known *and* used to construct/fit the theory. (No empirical credit; counts only as consistency).
  *   *Verdict:* A line is degenerating if it produces only Zero Novelty accommodations over *t*.

  **Clause 2: The Hard Core Integrity Condition (Motivated by cases vi, vii, viii)**
  Programme identity is determined by the **Hard Core** (HC), but the HC has two layers:
  *   **Formal HC:** The equations, notation, and structural commitments.
  *   **Ontological HC:** The commitment to the existence of the entities named.
  *   *Rule:* If the Formal HC remains but the Ontological HC is abandoned (Case vii), it is a **new programme** borrowing the old name. Successes do not transfer. If the Formal HC remains and predictions succeed despite ontological failure (Case vi), the programme remains **empirically progressive** but is **ontologically degenerating** (a warning sign, not a death sentence).
  *   *Rule:* Competing belts with the same HC (Case viii) constitute **one programme** with internal variation. Appraise the aggregate novel output of the programme, not the individual belts.

  **Clause 3: The Granularity Condition (Motivated by case x)**
  Appraisal applies to the **Research Line**, not necessarily the Brand Name.
  *   *Rule:* If a Programme contains sub-branches, and only one branch yields novel facts while others absorb anomalies, the *Programme Brand* is appraised as degenerating (statistically), but the *Progressive Branch* is appraised as a distinct, progressive Research Line.
  *   *Decision Rule:* Rational action follows the Research Line, not the Brand.

  **Clause 4: The Rational Abandonment Condition (Motivated by case ix)**
  Appraisal (Progressive/Degenerating) is distinct from Decision (Stay/Leave).
  *   *Rule:* A programme is degenerating if it fails Clause 1, regardless of rivals.
  *   *Rule:* It is rational to **stay** with a degenerating programme only if no rival programme exists that explains the previous successes of the degenerating one. This is a verdict of **"Monopoly Degeneration,"** not "Not Yet Appraisable."

  **Clause 5: The Retrospectivity Clause (Motivated by cases i, ii)**
  *   *Rule:* All verdicts of Empirical Progress are **provisional** until the novel fact is corroborated. A modification that *later* yields a novel fact (Case ii) is retroactively classified as progressive, but at the time of modification, it is classified as **Potentially Progressive**.
  *   *Constraint:* You cannot know at *t1* if a move is Case (i) or Case (ii). You can only assess the *heuristic power* (see Surrogate below).

  ---

  ### II. Testing the Principle Against Your Ten Cases

  *   **(i) Ad hoc, no new facts:** **Degenerating.** (Fails Clause 1).
  *   **(ii) Ad hoc, later yields fact:** **Retroactively Progressive.** At the time, it was *Potentially Progressive*. The principle denies your intuition that it was progressive *at the moment*. It was a gamble that paid off. (Satisfies Clause 5).
  *   **(iii) Prediction before data:** **Strongly Progressive.** (Satisfies Clause 1, Strong Novelty).
  *   **(iv) Explains unused old fact:** **Theoretically Progressive / Weakly Empirically Progressive.** Counts in favor via Unification. (Satisfies Clause 1, Weak Novelty).
  *   **(v) Explains fitted old fact:** **Neutral.** Counts for nothing empirically. (Satisfies Clause 1, Zero Novelty).
  *   **(vi) Posit false, predictions work:** **Empirically Progressive, Ontologically Degenerating.** You keep the score, but mark the HC as at risk. (Satisfies Clause 2).
  *   **(vii) Name stays, ontology drops:** **New Programme.** Earlier successes do not credit the new one. (Satisfies Clause 2).
  *   **(viii) Same HC, competing belts:** **One Programme.** Aggregate the novel facts from both groups. (Satisfies Clause 2).
  *   **(ix) Degenerating, no rival:** **Degenerating (Monopoly).** Verdict is "Degenerating," Decision is "Stay." (Satisfies Clause 4).
  *   **(x) One branch progressive, rest degenerating:** **Programme Degenerating, Branch Progressive.** Move the student to the branch. (Satisfies Clause 3).

  ---

  ### III. Application to Your New Cases

  1.  **Computer-Generated Variant Space:**
      *   *Scenario:* A programme generates 1,000 models, picks one that fits, announces prediction, tests it.
      *   *Verdict:* **Degenerating (Data Dredging).** Unless the *procedure* for selecting the model was specified *before* looking at the data, this violates Use-Novelty. It is effectively fitting known data (Case v) disguised as prediction.
      *   *Exception:* If the algorithm itself is the theory, and the algorithm was fixed before *any* of the tests, it counts as Progressive.

  2.  **Sustained by One Well-Funded Group:**
      *   *Scenario:* A programme persists solely due to resources, not novel facts.
      *   *Verdict:* **Degenerating.** Sociological support is irrelevant to logical appraisal (Clause 1). However, under Clause 4, if they suppress rivals, the field is in an unhealthy "Monopoly Degeneration."

  3.  **Two Programmes Merge Belts:**
      *   *Scenario:* Programme A and B combine protective belts.
      *   *Verdict:* **New Synthesis Programme.** If the merger yields novel facts neither could alone, it is **Progressive**. If the merger is just a patchwork to save both Hard Cores from anomalies, it is **Degenerating**.

  4.  **The "Honest" Case (Your Draft):**
      *   Your draft failed on (vii) vs (viii) (Identity) and (x) (Granularity). The refined principle fixes this by separating Brand from Line and Formal from Ontological HC.

  ---

  ### IV. The Honest Confession: What The Principle Cannot Keep

  You asked for an honest statement of which verdicts the principle cannot keep.

  **1. The "Backward Reaching" Progressiveness (Case ii)**
  *   **Your Intuition:** You want to say the modification in (ii) was progressive *from the moment it was made*, even before the fact was found.
  *   **The Principle's Verdict:** It was *Potentially Progressive* at *t1*, and *Progressive* at *t2*.
  *   **The Cost:** If we validate your intuition, we break falsificationism. We would have to claim access to the future truth of the fact at the moment of hypothesis construction.
  *   **Resolution:** You must accept that **Progress is a historical property, not a logical property of the sentence.** You cannot know you are being progressive until history confirms it. This is painful for decision-making, but logically necessary.

  **2. The "Not Yet Appraisable" Verdict (Case ix)**
  *   **Your Intuition:** You want to say a programme with no rival is "not yet appraisable" rather than "degenerating."
  *   **The Principle's Verdict:** It is **Degenerating.**
  *   **The Cost:** Lakatos insists degeneration is an absolute property of the programme's heuristic power. Whether it is *rational to abandon it* is relative to rivals.
  *   **Resolution:** Keep the verdict "Degenerating" but add the decision rule "Do Not Abandon." Conflating appraisal with decision muddies the water. A programme can be a "Zombie" (dead but walking because nothing else is alive).

  **3. The Distinction between (iv) and (v)**
  *   **Your Intuition:** Explaining an old fact counts if it wasn't used in construction (iv), but not if it was (v).
  *   **The Problem:** In practice, it is often impossible to prove a fact wasn't "in the back of the mind" during construction.
  *   **Resolution:** The principle relies on **pre-registration logic.** If the fact was published *before* the theory was submitted, it is Weak Novelty (iv). If the theory was submitted before the fact was published, it is Strong Novelty (iii). If the fact was known and the theory admits to fitting it, it is Zero Novelty (v). You need strict temporal records to enforce this.

  ---

  ### V. The Real-Time Surrogate (For the PhD Student)

  You noted: *"Every formulation I have tried seems to need to know what happens over the next decade, and I have to decide this term whether to take a student off a line of work."*

  This is the crux. Lakatos gives you a historiography, not a grant application guide. Since you cannot know if a shift is (i) or (ii) in real-time, you need a **Heuristic Surrogate**.

  **Do not appraise the Programme. Appraise the Heuristic Power.**

  When interviewing a student or choosing a line, ask these three questions. If the answer is "Yes" to all, the line is a rational bet, even if the programme is technically degenerating.

  1.  **The Constraint Test:** Does the protective belt modification impose *new constraints* on the theory, or does it simply add parameters?
      *   *Good:* A modification that rules out previously possible states of the world.
      *   *Bad:* A modification that adds a "fudge factor" to fit the anomaly without ruling anything else out.
  2.  **The Connection Test:** Does the modification connect to *other* independent lines of inquiry?
      *   *Good:* The fix requires borrowing a mechanism from a different field or implies a consequence in a different domain (Case ii/iii potential).
      *   *Bad:* The fix is self-contained and speaks only to the specific anomaly (Case i risk).
  3.  **The Cost Test:** Is the group willing to specify *what would falsify* this new modification?
      *   *Good:* They can name a specific observation that would kill the new belt.
      *   *Bad:* They claim the modification is "compatible with anything."

  **Practical Advice for the Student:**
  *   **If the Programme is Progressive:** Put them on the main line.
  *   **If the Programme is Degenerating (Case i):**
      *   If there is a **Progressive Branch (Case x)**: Put them there immediately. Frame the thesis as "Revitalizing [Programme] via [Branch]."
      *   If there is **No Rival (Case ix)**: It is safe to work on, provided they focus on *Theoretical Progress* (unification, mathematical elegance) rather than promising Empirical Progress they cannot deliver. Warn them the empirical ceiling is low.
      *   If there is a **Rival**: Move them to the rival, or to the Progressive Branch of the rival.

  **Summary:** You cannot eliminate the hindsight bias. You can only minimize the risk by betting on **constraints** and **connections** rather than **fits**. A modification that restricts the theory is a bet on progress; a modification that expands the theory's flexibility is a bet on degeneration.
