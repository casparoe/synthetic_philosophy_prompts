          *   **P3 (The Unit Condition):** Appraisal applies to the specific *line of research* (protective belt configuration), not just the brand name (resolves x).
          *   **P4 (The Rationality Condition):** Abandonment depends on the existence of a rival (resolves ix).
      *   *Testing against the 10 Cases:* Go through them one by one.
      *   *The New Cases:* Apply the principle.
      *   *The Honest Confession:* Admit where the principle fails the user's intuition (specifically the "backward reaching" progressiveness of case ii).
      *   *The Practical Surrogate:* This is crucial. Give actionable advice for the PhD student decision.

      *(Self-Correction during drafting)*: I need to be careful with Case (v) vs (iv). Lakatos emphasizes *novel* facts. Explaining old facts (iv) is often considered "unification" but strictly speaking, Lakatos prioritizes *new* predictions. However, the user says (iv) counts in favor. I should incorporate "systematic power" or "unification" as a secondary criterion for progressiveness, or classify it as "theoretical progress" vs "empirical progress." Let's stick closer to Lakatos: Empirical progress requires novel facts. Theoretical progress (explaining old facts better) is a precursor. I will refine the principle to distinguish *Theoretical* vs *Empirical* progressiveness.

      *(Refining Case ii)*: The user wants to say it was progressive *at the time*. I must argue this is an illusion. It was *potentially* progressive. The verdict changes. I cannot validate the "backward reaching" intuition without breaking the logic of falsificationism. I will state this clearly.

