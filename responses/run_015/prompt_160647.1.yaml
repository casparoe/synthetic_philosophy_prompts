      *   **Current Draft Principle:** "A programme is progressive over a period just in case, over that period, its belt modifications yield more corroborated facts they were not introduced to explain than facts they were, and degenerating in the opposite case; and every such verdict is provisional, since a degenerating stretch can be redeemed later."
      *   **Tasks:**
          1.  Test the draft principle against the ten cases.
          2.  Repair/Refine the principle (clause by clause, citing motivating cases).
          3.  Apply the refined principle to four new hypothetical cases (computer-generated space, well-funded group, merged belts, etc.).
          4.  Honestly state which user verdicts the principle *cannot* keep and the cost of keeping them.
          5.  Address the practical constraint: The user needs a *real-time surrogate* for decision-making (e.g., taking on a PhD student), acknowledging that Lakatosian appraisal is often retrospective.

  2.  **Deconstruct the User's Ten Cases & Intuitions:**
      *   (i) Ad hoc fix, no new predictions for 30 years -> Degenerating. (Standard Lakatos).
      *   (ii) Ad hoc fix, later yields unexpected fact -> Progressive *retroactively*. (Problem: Temporal asymmetry/Backward causation of status).
      *   (iii) Prediction made *before* data -> More progressive than (ii). (Problem: Novelty vs. Heuristic Power).
      *   (iv) Explains old fact not used in construction -> Counts in favor. (Unification/Explanatory power).
      *   (v) Explains old fact it was *constructed* to fit -> Counts for nothing. (Problem: Distinguishing (iv) and (v) when both involve known facts).
      *   (vi) Central posit doesn't exist, but predictions succeed -> Still progressive. (Problem: Realism vs. Instrumentalism in the Hard Core).
      *   (vii) Name/equations stay, ontology abandoned -> Not the same programme. (Problem: Identity conditions of a programme).
      *   (viii) Same hard core, different belts, competing -> One programme. (Problem: Unit of appraisal vs. (vii)).
      *   (ix) Degenerating but no rival -> "Not yet appraisable" / Don't abandon. (Problem: Absolute vs. Relative appraisal).
      *   (x) One branch progressive, rest degenerating -> Programme degenerating, but join the branch. (Problem: Granularity of appraisal).

  3.  **Evaluate the User's Draft Principle:**
      *   *Draft:* "yield more corroborated facts they were not introduced to explain than facts they were."
      *   *Strengths:* Captures the core Lakatosian idea of novel facts.
      *   *Weaknesses:*
          *   Doesn't handle the timing of prediction vs. observation (ii vs. iii).
          *   Doesn't distinguish between fitting old data (iv) vs. (v).
          *   Doesn't address programme identity (vii vs. viii).
          *   Doesn't handle the "no rival" scenario (ix).
          *   Doesn't handle the sub-branch issue (x).
          *   Acknowledges retrospectivity, which conflicts with the practical need.

  4.  **Develop the Refined Principle (The "Lakatos-plus" Framework):**
      *   I need to structure this formally. Let's call it the *Temporal-Heuristic Appraisal Principle*.
      *   *Clause 1 (Novelty):* Needs to distinguish between *temporal novelty* (predicted before known) and *theoretical novelty* (not used in construction). This addresses (ii), (iii), (iv), (v).
      *   *Clause 2 (Continuity/Identity):* Needs to define when a programme remains the same. Hard Core retention is key, but ontological commitment matters. This addresses (vi), (vii), (viii).
      *   *Clause 3 (Granularity):* Needs to allow sub-programme appraisal. This addresses (x).
      *   *Clause 4 (Context):* Needs to account for rivals. This addresses (ix).
      *   *Clause 5 (Provisionality):* Acknowledges hindsight. This addresses (i), (ii).

  5.  **Address the Specific New Cases:**
      *   *Computer-generated space:* If predictions are announced before testing, it counts as temporal novelty, even if the space is large. Risk of "data dredging" needs to be managed by pre-registration logic.
      *   *Well-funded group:* Funding shouldn't count, but sociological dominance might mask degeneration.
      *   *Merged belts:* Synthesis. If it yields new facts, it's a new progressive shift. If it's just a patchwork, it's degenerating.

  6.  **Address the "Impossible" Verdicts:**
      *   The user wants (ii) to be progressive *from the moment of modification*. Lakatos strictly says you can't know until the fact is found. I must be honest: *You cannot know (ii) is progressive at t1.* The verdict *must* be retrospective.
      *   The user wants (ix) to be "not yet appraisable." Lakatos says degeneration is absolute, but rationality of abandonment is relative. I need to clarify this distinction.
      *   The user wants (v) to count for nothing but (iv) to count. This is the "Use-Novelty" problem. I need to codify the distinction between *accommodation* and *prediction*.

  7.  **Address the Practical Constraint (Real-Time Surrogate):**
      *   Since Lakatosian appraisal is historical, what does a supervisor do *now*?
      *   *Surrogate:* Heuristic Power. Is the hard core generating *potential* novel facts? Is the belt flexible but constrained? Are there *anomalies* that look solvable vs. *ad hoc* patches?
      *   *Advice:* Look for the "excess empirical content." Don't bet on the whole programme, bet on the specific research line (Case x).

