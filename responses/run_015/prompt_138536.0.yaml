  **FOR IMMEDIATE RELEASE**

  **GLOBAL VIOLENCE FALLS TO TWELFTH CONSECUTIVE RECORD LOW, BCVS CONFIRMS**

  *Denominator adjustments and intent-weighting drive historic decline; Bureau proposes retiring 'violence' metric entirely.*

  **GENEVA** — The Bureau of Comparative Violence Statistics (BCVS), a specialized agency affiliated with the United Nations Department of Peaceful Metrics, today released the Annual Global Harm Assessment (AGHA-2023). The report confirms that global violence has decreased for the twelfth consecutive year, reaching the lowest level in recorded human history. The findings rely on the following methodological standards:

  1.  **Denominator Management and Per-Capita Stabilization:** The headline decline is calculated using canonical per-capita rates rather than absolute body counts, which the Bureau classifies as "denominator artifacts" susceptible to population inflation. To ensure statistical continuity, the Denominator Management Unit (DMU) has aggressively expanded the population base. While previous years counted everyone alive at any point in the fiscal year, the 2023 model briefly experimented with including all mammals to maximize the denominator. Following an Oversight Committee ruling on "denominator fraud," the DMU reverted to including all humans who have ever lived, plus estimated future generations discounted at a standard actuarial rate. This stabilizes the rate against fluctuations in birth mortality and ensures that even significant absolute increases in harm are absorbed by the growing pool of potential victims.

  2.  **Definition Creep and Index Quarantine:** The Definitions Committee recognized several new categories of harm this cycle, including structural, symbolic, slow, and epistemic violence. To prevent these classifications from distorting the headline trend, they have been quarantined in Supplementary Index B (Non-Kinetic Harm). A footnote in Table 4.2 illustrates the trend if these indices are consolidated; however, the Bureau maintains that combining kinetic and non-kinetic data creates category errors that obscure the primary narrative. The headline series remains undisturbed, preserving the integrity of the twelve-year decline. This allows the Bureau to acknowledge suffering without compromising the graphical trajectory of the main report.

  3.  **Unit of Account: Intent-Weighted Death-Equivalents:** Violence is denominated in Intent-Weighted Death-Equivalents (IWDE). The published conversion table assigns a deliberate battlefield killing a value of 1.0. A death resulting from foreseeable famine is weighted at 0.3; a death foreseen but not aimed at is 0.15. Notably, a threat never carried out is valued at 0.02. These factors are revised annually for consistency with the target decline. Critics noting that reducing the weight of famine deaths lowers the total violence score are reminded that weighting reflects moral intent, not biological cessation. This ensures that accidental harm does not penalize states demonstrating peaceful intent despite high mortality outcomes.

  4.  **Extrapolation and Confidence Intervals:** Data prior to the modern census era is extrapolated by the Arrowhead Extrapolation Unit from a small number of excavation sites. The resulting confidence interval is wide enough to contain both a golden age of peace and a charnel house. The Bureau selects the median value most consistent with contemporary stability metrics. This methodology ensures that prehistoric uncertainty does not undermine modern certainty. The series is robust within the measurement framework, providing a consistent narrative regardless of external archaeological variance. As long as the framework holds, the conclusion remains valid.

  **Initiative and Commentary:**
  Given that the violence rate is now statistically indistinguishable from zero once the denominator includes everyone who will ever live, the Bureau proposes retiring the concept of violence altogether. The pilot initiative will measure "Unauthorized Force Incidents," a category for which there is no historical data whatsoever, providing a clean baseline for future improvement.

  Dr. Aris Thorne, an external archaeologist not affiliated with the Bureau, objected to the extrapolation methods. "You cannot calculate a Paleolithic homicide rate from three broken skulls and a wish," Thorne stated. "The data doesn't exist."

  Bureau Spokesperson Elena Voss dismissed the concern by focusing on the trajectory. "Dr. Thorne fixates on the absolute past, whereas we are concerned with the direction of the trend," Voss said. "Whether the baseline is real is less important than that the line goes down."

  ***

  **SIDEBAR: KEY METRIC UPDATES**
  *   **IWDE Conversion:** A stern look is now 0.005 IWDE.
  *   **Denominator History:** The "Mammal Denominator" incident of 2021 reduced global violence by 94% before being rescinded.
  *   **Index Status:** Structural violence remains in Supplementary Index B until further notice.
