  ### Working-Out

  **The Node Set:** I retain the proposed six: DAMAGE (input), FLINCH (motor output), WANT (conative), BELIEF (doxastic), DISTRACTION (attentional), LEARNING (dispositional). This set avoids the error of defining functionalism as mere input-output behaviorism; by including internal states (WANT, BELIEF, DISTRACTION), it captures the causal mediation that distinguishes functionalism from logical behaviorism.

  **Stanza Ordering:**
  1.  **Mammalian:** The baseline case (C-fibers). Establishes the role.
  2.  **Octopus:** Distributed nervous system. Challenges centralization assumptions.
  3.  **Silicon:** Computational realization. Challenges substrate specificity.
  4.  **The Graft:** Hybrid biological/prosthetic. Presses the identity vs. role distinction (is it one pain or two?).
  5.  **Lookup Table:** Block's objection. Satisfies I/O but lacks internal causal structure. Contains the **negation constraint** (WANT).
  6.  **Population:** "China Brain." Challenges spatial/temporal scale.

  **The Envoy:** It will not resolve the debate. Line 1 posits Functionalism (pain as second-order role). Line 2 posits Identity Theory (pain as first-order occupant). Line 3 registers the "squeeze": tightening the role to exclude the Table/Population risks chauvinism (excluding Octopus/Silicon), while loosening it admits absurdities. The *hurt* (qualia) remains unmentioned in the envoy, highlighting the explanatory gap.

  ***

  ### The Causal Role

  A stimulus registers as **DAMAGE**.
  The muscle codes a sudden, sharp **FLINCH**.
  The organism forms a urgent **WANT**.
  A cognitive map holds distinct **BELIEF**.
  Attention suffers a violent **DISTRACTION**.
  Synapse strengthens itself for **LEARNING**.

  Distributed nodes handle the **LEARNING**.
  Skin flashes warning signs of **DAMAGE**.
  Three hearts beat through the **DISTRACTION**.
  The body makes a local, suckered **FLINCH**.
  No central hub sustains a unified **BELIEF**.
  Yet hunger drives a primitive **WANT**.

  Code executes a simulated **WANT**.
  Algorithm updates weights for **LEARNING**.
  Logic gate asserts a binary **BELIEF**.
  Sensor trips on threshold **DAMAGE**.
  Actuator triggers mechanical **FLINCH**.
  Process suffers a clocked **DISTRACTION**.

  Jack input causes a split **DISTRACTION**.
  Flesh and chip share a common **WANT**.
  Hand executes a delayed **FLINCH**.
  Memory splits its path for **LEARNING**.
  Scar meets port at the site of **DAMAGE**.
  Who holds the single, unified **BELIEF**?

  Printout states a hollow, blank **BELIEF**.
  Screen shows a cursor's **DISTRACTION**.
  Input matches the pattern **DAMAGE**.
  It prints the code for **WANT** but does not **WANT**.
  No weights adjust themselves for **LEARNING**.
  Cursor mimics a human **FLINCH**.

  Citizen relay causes a slow **FLINCH**.
  Consensus forms a public **BELIEF**.
  Archive stores the record **LEARNING**.
  Noise creates a static **DISTRACTION**.
  Vote determines the collective **WANT**.
  Signal degrades into pure **DAMAGE**.

  *Envoy*

  If pain is just the role of **DAMAGE** and **FLINCH**,
  Then wetware grounding **WANT** and **BELIEF** differs.
  Exclude mere **DISTRACTION**, break the **LEARNING**.
  (The red sting waits, uncaught, within the lines.)

  ***

  ### Apparatus

  *   **Stanza 1 (Mammalian):** Standard identity theory baseline; establishes the causal role without yet separating it from the substrate.
  *   **Stanza 2 (Octopus):** Presses functionalism to accommodate distributed, non-centralized systems (Block's octopus case).
  *   **Stanza 3 (Silicon):** Classic multiple realization; asserts functional equivalence across distinct physical media.
  *   **Stanza 4 (The Graft):** The hybrid case. Enacts the metaphysical uncertainty: if pain is the occupant, is this two pains? If the role, it is one. The end-words feel detached from any single owner.
  *   **Stanza 5 (Lookup Table):** Block's Chinese Gym/Table objection. Satisfies I/O but lacks internal causal dynamics. Line 4 ("does not WANT") satisfies the negation constraint, marking partial satisfaction failure.
  *   **Stanza 6 (Population):** The "China Brain." Tests spatial scale and unity of consciousness constraints.
  *   **Form Constraint:** The sestina rotation enacts multiple realization; the words (roles) remain constant while the stanza content (realizers) changes. The form forced the simplification of the "Graft" metaphysics; a full treatment requires more than six lines, so the stanza points to the aporia rather than solving it.
  *   **MR Assumption:** The poem assumes multiple realization is *possible* (conceptual), not necessarily that all these systems currently exist. It treats MR as a stress test for the definition of pain, not an empirical claim about octopuses having rights.
