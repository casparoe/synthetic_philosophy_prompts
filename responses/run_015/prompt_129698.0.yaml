      *   *Claim 3: His point was that pure rationality is self-defeating / need a random tie-breaker.*
          *   **Fact:** Complicated. Buridan was a determinist regarding the will (intellectual determinism). He believed the will follows the intellect's judgment. If two options are truly equal, the intellect suspends judgment until a difference is found. The "starving donkey" is often a *reductio ad absurdum* against the idea that the will can act without a determining reason, not necessarily an endorsement of randomness.
