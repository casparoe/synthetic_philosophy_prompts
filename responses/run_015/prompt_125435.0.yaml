answer: |-
  1. **Rules, Materials, and Script**

  **Materials Needed:**
  *   **Chips:** 200 poker chips (or counters).
  *   **Type Cards:** 14 cards (7 marked **H**, 7 marked **L**). For the final round, you need 5 **H**, 5 **M**, 4 **L** (adjust to fit 14 players).
  *   **Decision Slips:** Small pieces of paper (2 per player per round).
  *   **Pens:** 7.
  *   **Two Boxes/Baskets:** One for "Decisions In," one for "Results Out."
  *   **Whiteboard:** To display the Signal Cost for the round.

  **Room Setup:**
  *   Split the room into **Senders** (7 students) and **Receivers** (7 students).
  *   Senders sit on one side, Receivers on the other. They must not see each other's Type Cards.
  *   You (the Leader) sit at the front as the **Banker**.

  **The Script (Read this exactly. Do not improvise theory.)**

  > "Welcome. We are running a market simulation. There are two roles: Senders and Receivers. You will swap roles every two rounds so everyone plays both sides.
  >
  > **For Senders:** You will draw a Type Card. Keep it hidden. It tells you two things: your 'Quality' (High or Low) and your specific 'Signal Cost' in chips. You want to be 'Accepted' by a Receiver. If you are Accepted, you earn 100 chips. If Rejected, you earn 0.
  >
  > You have two choices:
  > 1. **Do Nothing:** Free.
  > 2. **Send a Signal:** You must pay the cost written on your card. This cost is deducted from your total whether you are Accepted or not.
  > You may also write a free message on your slip, but Receivers are not required to believe it.
  >
  > **For Receivers:** You will receive a Decision Slip from a Sender. It will tell you if they Signalled or not, and their message. You do *not* know their Type or their Cost. You must choose **Accept** or **Reject**.
  > *   If you Accept a High Type: You gain 50 chips.
  > *   If you Accept a Low Type: You lose 50 chips.
  > *   If you Reject: Nothing happens (0 chips).
  >
  > **Anonymity Rule:** All Decision Slips go into the Banker's box. I will shuffle them before handing them to Receivers. You will never know which Sender matched with which Receiver. Do not talk about your Type or decisions between rounds.
  >
  > We will play five rounds. The 'Signal Cost' displayed on the board will change. Your goal is to maximize your chip total. The top three chip-holders at the end get first choice of snacks."

  ***

  2. **Round Sequence and Arithmetic**

  **Round 1: The "Cheap Talk" Baseline**
  *   **Board:** Signal Cost = 10 Chips (Refund for H: -5, L: +5). *Wait, keep it simple.*
  *   **Correction:** To ensure the differential cost is clear, write the cost *on the Type Card*.
  *   **Card H:** "Cost to Signal: 40."
  *   **Card L:** "Cost to Signal: 120."
  *   **Board:** Signal Cost = **0** (Subsidy = Full Cost). *Actually, let's start with Low Absolute Cost.*
  *   **Board:** Signal Cost = **20**. (Everyone pays 20? No, costs are on cards).
  *   **Instruction:** "The Board shows the Market Price. Your Card shows your Personal Cost. Pay the difference." *Too complex.*
  *   **Simpler Mechanic:** The Board shows the **Signal Cost**. The Type Card tells you if you get a **Discount**.
      *   **Board:** Signal Cost = **60**.
      *   **Card H:** "You are High. You pay **half** price." (Effective Cost: 30).
      *   **Card L:** "You are Low. You pay **full** price." (Effective Cost: 60).
      *   **Benefit of Acceptance:** 100.
      *   **Math:**
          *   High: $100 - 30 = 70$ (Signals).
          *   Low: $100 - 60 = 40$ (Signals).
      *   **Outcome:** **Pooling.** Everyone signals. Receivers learn nothing. Average Receiver payoff: $0.5(50) + 0.5(-50) = 0$. They are indifferent.

  **Round 2: The Separating Band**
  *   **Board:** Signal Cost = **100**.
  *   **Card H:** "Pay **40%**." (Effective Cost: 40).
  *   **Card L:** "Pay **100%**." (Effective Cost: 100).
  *   **Math:**
      *   High: $100 - 40 = 60$ (Signals).
      *   Low: $100 - 100 = 0$ (Indifferent, but risk-averse players won't signal). Let's make Cost **110** for Low.
      *   **Revised Card L:** "Pay **110%**." (Effective Cost: 110).
      *   Low: $100 - 110 = -10$ (Does Not Signal).
  *   **Outcome:** **Separation.** Only High types signal. Receivers Accept Signal, Reject No-Signal.
  *   **Inequalities:**
      1.  $Benefit > Cost_H \Rightarrow 100 > 40$ (True)
      2.  $Benefit < Cost_L \Rightarrow 100 < 110$ (True)
  *   **Net Payoff to Low Faking:** $100 - 110 = -10$. (Loss).

  **Round 3: The Prohibitive Cost**
  *   **Board:** Signal Cost = **200**.
  *   **Card H:** "Pay **40%**." (Effective Cost: 80).
  *   **Card L:** "Pay **110%**." (Effective Cost: 220).
  *   **Math:**
      *   High: $100 - 80 = 20$ (Signals).
      *   Low: $100 - 220 = -120$ (No Signal).
      *   *Wait, I need a Pooling (No Signal) outcome.*
      *   **Adjustment:** Make High Cost > Benefit.
      *   **Board:** Signal Cost = **300**.
      *   **Card H:** "Pay **40%**." (Effective Cost: 120).
      *   **Math:** High: $100 - 120 = -20$ (No Signal). Low: No Signal.
  *   **Outcome:** **Pooling (Silence).** Nobody signals. Receivers must guess. If they Accept blindly, they get 0 average. If they Reject all, 0.

  **Round 4: The Subsidy (Crucial for Point A)**
  *   **Setup:** Return to Round 2 numbers (Separating).
  *   **Board:** Signal Cost = **100**.
  *   **Special Rule:** "The Market is subsidizing signals. Everyone who signals gets a **50 Chip Refund**."
  *   **Card H:** "Pay **40%**." (Base 40). Net Cost: $40 - 50 = -10$ (Profitable to signal even if rejected!).
  *   **Card L:** "Pay **110%**." (Base 110). Net Cost: $110 - 50 = 60$.
  *   **Math:**
      *   High: Signals (Net cost negative).
      *   Low: $100 (Benefit) - 60 (Net Cost) = 40$. (Signals!).
  *   **Outcome:** **Collapse.** Low types can now afford to fake. The signal becomes noise. Receivers stop trusting the signal. Welfare falls (chips burned on useless signals).

  **Round 5: Counter-Signalling (Point C)**
  *   **Types:** 5 **Mid**, 5 **High**, 4 **Low** (Remove Low cards from play for this round, or tell Receivers "No Low Types in this round").
  *   **Public Info:** Announce: "In this round, there are **No Low Types**. Only Mid and High."
  *   **Board:** Signal Cost = **50**.
  *   **Card Mid:** "Pay **100%**." (Cost 50).
  *   **Card High:** "Pay **100%**." (Cost 50).
  *   **Payoffs:**
      *   Receiver Accepts High: +50.
      *   Receiver Accepts Mid: -10 (Slightly bad).
      *   Sender Acceptance: +100.
  *   **The Trick:** Tell Receivers: "Historical data suggests High types often skip signals to save time." (Priming the belief).
  *   **Logic:**
      *   If Mid Signals: Receiver knows it's Mid. Rejects (-10). *Wait, Mid needs to be accepted.*
      *   **Fix:** Receiver Accepts Mid (+10), Accepts High (+50).
      *   **Condition:** Receiver Rejects "No Signal" if they think it's Mid. Accepts "No Signal" if they think it's High.
      *   **Equilibrium:** Mid Signals (to prove not... wait, if No Low, why signal?).
      *   **Honest Limitation:** This round is theoretically unstable without reputation.
      *   **Workaround:** Make the Signal a "Liability" for High.
      *   **Card High:** "If you Signal, you lose 20 extra chips (Prestige Tax)."
      *   **Card Mid:** "No Tax."
      *   **Result:** High skips signal. Mid signals. Receiver learns from silence.

  ***

  3. **Debrief (15 Minutes)**

  **Do not lecture.** Ask these questions and let them answer. Write their answers on the board.

  1.  **The Gap (Point A):** "In Round 4, I gave everyone 50 chips back. The *difference* in cost between High and Low types stayed exactly the same. Why did the system break?"
      *   *Target Answer:* Because the Low type could finally afford it. The absolute cost dropped below the benefit.
      *   *Your Add:* "Exactly. A signal only works if it hurts the liar more than the truth-teller. But it also has to hurt the liar *enough* to stop them. A subsidy can destroy information even if it's fair."

  2.  **Expectations (Point B):** "In Round 3, nobody signalled. In Round 2, only High types did. The rules were similar. What changed?"
      *   *Target Answer:* The cost changed.
      *   *Your Add:* "But why did Receivers stop trusting in Round 1? Because everyone signalled. The meaning of the signal depends on what *others* do. If everyone shouts, silence is loud. If everyone is silent, shouting is noise."

  3.  **Counter-Signalling (Point C):** "In the final round, some of the best Senders refused to signal. Why?"
      *   *Target Answer:* They didn't need to. / It was too expensive for them.
      *   *Your Add:* "This is called 'Counter-Signalling.' Sometimes, being so secure in your quality means you don't need the badge. The badge is for the people who need to prove they aren't the bottom."

  4.  **The Name:** "In biology, this is the **Handicap Principle**. A peacock's tail is heavy. It hurts. That's why it works. If it were light, every weak bird would have one."

  ***

  4. **Troubleshooting: What Will Go Wrong**

  *   **Problem:** **Reputation Leaks.** Players remember who had the High card in Round 1 and trust them in Round 2 without a signal.
      *   **Fix:** Enforce the **Shuffle**. Collect slips, mix them thoroughly, deal them out. Remind them: "You are judging the slip, not the person."
  *   **Problem:** **Altruism.** High types signal in Round 3 (Prohibitive) just to "help" the Receiver know the truth, even at a loss.
      *   **Fix:** Remind them: "Your only goal is your chip total. You are not here to be honest. You are here to win."
  *   **Problem:** **The "Free Message" Trap.** Receivers trust the written note ("I am High, trust me") over the signal.
      *   **Fix:** In the debrief, highlight Round 1. "How many of you believed the note? How many of you lied on the note?" Show that cheap talk is worthless.
  *   **Problem:** **Counter-Signalling Fails.** In Round 5, everyone signals or no one does.
      *   **Fix:** Don't panic. Ask in debrief: "What would have needed to happen for the High types to stay silent?" Guide them to the idea of 'Prestige Costs.'
  *   **Problem:** **Time Overrun.** Calculating payoffs takes too long.
      *   **Fix:** You (Banker) do the math. Players just hand in slips. You announce: "Sender 1: Accepted. Net +60." Keep it moving.

  ***

  5. **Limitations: The Gap Between Game and Reality**

  **What the Game Cannot Reproduce:**
  In this game, the cost is a conscious choice calculated in chips. In biology (the Handicap Principle), the cost is **physiological**. A weak gazelle *cannot* jump high, not because it chooses not to pay the cost, but because its muscles fail. The correlation between signal and quality is maintained by **natural selection** over generations, not by reasoning in a single session.

  **Why It Matters:**
  If you run this again next week, the students will remember the "trick" and the equilibrium might break because they are now coordinating on a new norm. In nature, the animals don't "learn" the strategy; the ones who faked the signal died out.

  **How to Supply This in Words:**
  In the final 2 minutes, say:
  > "Today, you chose to signal because you did the math. In nature, a peacock doesn't calculate chip costs. It grows a tail. If a weak bird tries to grow a big tail, it starves or gets eaten. The 'cost' is built into its body. We played a game of logic; nature plays a game of survival. But the logic is identical: the signal is honest *because* it is hard to fake."

  **Honest Assessment of Round 5:**
  The Counter-Signalling round is fragile. In a one-shot anonymous game, the "High Type skips signal" equilibrium relies on a **focal point** (a shared belief). Without history, High types might signal just to be safe. If this happens, acknowledge it: "In the real world, this takes time to establish. You need a culture where everyone knows the top dogs don't wear badges. We tried to simulate that culture with instructions, but it's harder to build in 5 minutes than in 5 years."
