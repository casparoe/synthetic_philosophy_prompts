answer: |-
  Stage 1 — preparation

  *   **Marcus's Considerations:**
      1.  **Long-Run Dominance:** Over many independent trials, EU maximization yields higher cumulative value with probability approaching one.
      2.  **Dynamic Consistency:** Agents violating separability steer themselves toward ex-ante rejected distributions via sequential choices.
      3.  **Reflective Stability:** EU rules endorse themselves upon reflection; non-EU rules often recommend becoming EU.
  *   **Thea's Considerations:**
      1.  **Substantive Risk:** Attitudes toward tail risk are not reducible to utility curvature over outcomes.
      2.  **Exploitability as Cost:** Being money-pumped is a tax, not a logical contradiction; sometimes worth paying.
      3.  **Individuation Tension:** Enriching consequences to save EU destroys the additive aggregation required for long-run arguments.
  *   **Genuine Disagreements:**
      1.  Whether exploitability constitutes irrationality or merely an instrumental cost.
      2.  Whether risk sensitivity is separable from utility assignments.
      3.  Whether dynamic consistency is constitutive of rationality or merely instrumental.
      4.  Whether consequence individuation can be neutral without trivializing the theory.
  *   **Relabeling Flags:**
      *   "That's just a different utility function" (limit to once total).
      *   Defining consequences to include "anxiety about risk" or "history of choices."
  *   **Concessions:**
      *   **Marcus:** Concedes exploitability is a cost to be weighed *ceteris paribus*, not an absolute refutation.
      *   **Thea:** Concedes intransitivity is indefensible and worth paying a fee to fix.

  ***

  Stage 2 — dialogue

  The espresso machine hissed, filling the silence between Marcus and Thea. The colloquium had ended an hour ago, but the argument over coherence arguments had followed them out.

  Marcus stirred his coffee. "Let's strip away the axiom-chanting. The pragmatic case rests on two legs. First, the long-run. Suppose you face a thousand independent decisions over a career. Each offers a fifty-five percent chance to gain two units and a forty-five percent chance to lose one. Expected utility maximization tells you to take every bet. Over a thousand trials, the probability you end up ahead approaches one. Any rule that rejects these bets based on risk-aversion alone stagnates while the EU agent grows. Second, the sequential leg. Imagine you plan to take a path tomorrow contingent on news today. If your conditional plans violate separability—if you change your mind without new information—you are steering at time zero toward a distribution you would have rejected outright. You are effectively paying to turn a sure thing into a gamble."

  Thea leaned forward. "I concede immediately that intransitivity is indefensible. If I prefer A to B, B to C, and C to A, I am broken. It is ex ante worth paying a small fee to have those preferences brought into line. But exploitability is not irrationality; it is a cost. Your long-run leg hides premises: it needs many draws, independence across draws, and an environment that does not adapt to you. Consider a single high-stakes decision. I face a one percent chance of losing my entire livelihood versus a guaranteed modest loss. EU says take the risk if the weighted average is better. But if that one percent hits, I am out of the game. There is no long-run to save me. Independence fails when ruin is absorbing."

  "Precommitment is neither free nor always available," Marcus countered. "And the exploiter need not be a adversarial bookie; it can be an anonymous market. Being the sort of agent who gets exploited is a cost denominated in the very currency you care about—resources, survival, influence. But to assess that cost, you must state your rule as a functional, not a mood. How exactly do you weigh the tail?"

  "Tail-weighting over the outcome distribution," Thea said. "I weight the probability of bad outcomes directly rather than folding it into a utility of money. Plus, I admit a genuine menu-dependent concern. I am worse off for having been offered certain options, holding fixed what I end up choosing. If I am offered a bribe I refuse, I am worse off than if the bribe was never offered, because I had to resist the temptation. The history of the choice matters."

  Marcus shook his head. "If all your concerns are fixed by the total consequence—the whole history, including whatever risks you ran—and you have no plan to act against your own earlier conditional plans, then your ranking over histories is represented as the expectation of some utility index. The non-expected-utility content has quietly become bookkeeping. The pump applies at the level of histories. You are just maximizing expected utility over enriched outcomes."

  "This is the no-free-consequences objection," Thea replied. "Your two legs pull against each other. To make my risk-sensitivity consequentialist, you have to enrich the consequence space until 'the risk I ran in this decision' becomes a coordinate of the outcome. But coordinates indexed to individual decisions do not aggregate across decisions, and across-decision separability is exactly what the long-run argument needs. You cannot have rich consequences and aggregation. Here is the proof. Decision one: I face a risk that leaves me anxious. Decision two: I face a similar risk. If I treat the anxiety from decision one as part of the outcome, the utility of decision two depends on the history of decision one. Suppose decision one yields a score of ten, decision two yields ten. If I sum them, I get twenty. But if the anxiety from one carries over, the combined value of the sequence is not ten plus ten. It might be fifteen because the cumulative stress breaks me. The enriched objective's ranking is not the sum of the per-decision scores. Rich consequences or aggregation, not both."

  Marcus paused, tapping his cup. "The long-run argument can be restated over life-histories. Maximize the expectation of your real intertemporal objective. It does not need narrow per-decision separability. But if your concerns really are decision-indexed rather than history-level, then you are not a consequentialist at all, and the framework is being asked to arbitrate a dispute it was never about. Consider this: expected utility maximization is self-endorsing. If you ask an EU agent whether she wants to remain an EU agent, she says yes. A rule that does not endorse itself on reflection is unstable."

  "Self-endorsement is cheap," Thea shot back. "Satisficing at a threshold, tail-minimizing, and menu-sensitive rules are each self-endorsing under their own standard. Reflective stability selects nothing. And exploitability is a cost to be weighed, not a refutation. Promise-keepers and people who refuse to pay blackmail are exploitable too. Someone can threaten to harm me unless I pay them, knowing I won't pay. I am exploitable in the sense that I leave money on the table to maintain integrity. So the pragmatic case is at best *ceteris paribus*."

  Marcus nodded slowly. "I concede that *ceteris paribus* point explicitly. Exploitability is a cost. But the weighing is itself a decision that the coherence arguments constrain. You cannot weigh costs incoherently without undermining the weighing itself. So I ask you to name a single case in which the cost of becoming coherent exceeds the cost of remaining pumpable."

  Thea smiled, picking up her cup. "I will find one. And when I do, you will call it a different utility function."

  "That's just a different utility function," Marcus said, once. "But it won't change the fact that you need to calculate the cost."

  They sat in silence, the disagreement sharper than it started.
