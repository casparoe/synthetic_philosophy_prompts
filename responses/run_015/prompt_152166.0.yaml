  - The implicit philosophy (around 150 words): This setup presupposes a theory of desert rooted in bureaucratic compliance rather than substantive need or moral intent. It treats responsibility not as an internal capacity to act, but as an external capacity to navigate administrative hurdles. The "deserving" poor are those who successfully perform the role of the legitimate claimant by producing the correct documentation, thereby proving they are worthy of exemption. Conversely, the "undeserving" are those who fail this administrative test, implicitly judged as capable of compliance regardless of actual barriers. Moral worth is thus conflated with procedural success. The system assumes that if you haven't proven vulnerability officially, you are inherently responsible for your failures. It shifts the locus of desert from human circumstance to institutional validation, making the right to support contingent on the ability to manage the state's paperwork rather than the reality of one's hardship. Thereby validating state authority over the individual lived truth.

  - The tension (around 100 words): This contradicts the stated goal of enforcing personal responsibility in practice. Penalizing someone for missing an appointment due to anxiety while exempting another with identical anxiety creates very arbitrary injustice. It replaces support based on need with support based on bureaucratic literacy. The system claims to sanction irresponsibility, yet punishes those lacking resources to prove vulnerability, while exempting those skilled at navigating bureaucracy. Thus, it undermines legitimacy by punishing the actual inability to comply while rewarding the ability to document inability. Responsibility becomes performative, not behavioral, conflicting with the prevailing notion that sanctions modify conduct fairly across equal circumstances overall.

  - Bottom line (around 60 words): There is no coherent moral view, only a coherent administrative logic. The system prioritizes manageability over justice, treating bureaucratic compliance as a proxy for moral worth. It is not ad-hoc but systematically biased toward procedural efficiency. Ultimately, it squares conditionality with responsibility only by redefining responsibility as the capacity to manage state requirements, abandoning genuine assessment of the individual circumstance.
