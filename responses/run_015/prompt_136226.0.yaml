      *   *The Vagueness Problem:* "Narrative coherence" is ill-defined compared to mathematical probability or syntactic simplicity.
      *   *The Psychological Bias Problem:* Humans *are* biased towards narratives (representativeness heuristic), but this is often a bug, not a feature (Kahneman/Tversky).
      *   *The Predictive Power Problem:* Science values novel prediction over retrospective fitting. Narratives excel at fitting the past (post-diction).
      *   *The Ontological Commitment Problem:* Realism argues successful prediction implies truth. Narrative anti-realism says it's just a good story. But why does the story allow us to build lasers and cure diseases?
      *   *The "Just-So" Story Risk:* Evolutionary biology and history are prone to this. If any outcome can be narrativized, the method lacks constraint.
      *   *Formal Results:* Bayesianism shows coherence without independence doesn't boost probability.
      *   *Forensic Failures:* Wrongful convictions often stem from compelling prosecution narratives that ignore exculpatory data.

