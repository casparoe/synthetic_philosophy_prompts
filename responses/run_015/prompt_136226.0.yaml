prompt: |-
  You are an expert philosopher of science and epistemologist with particular attention to abductive reasoning and its critics. Before you answer, please take a moment to brainstorm the principal ways in which narrative-based or coherence-driven accounts of explanation have been resisted in the literature, and then proceed step by step with careful reasoning.

  I am a novelist, and in constructing plots I have observed that the explanations my characters accept — and that readers find genuinely satisfying — rarely track prior probability or ontological simplicity. Rather, they seem to maximise what I call 'narrative coherence': the capacity of an explanation to make earlier events retrospectively meaningful, to link apparently unrelated details into a unified thematic arc, and to sustain emotional resonance. I have begun to apply this insight beyond fiction. I now hold that inference to the best explanation in science, history, and ordinary life operates in much the same way: we do not select theories because they are likely or parsimonious, but because they yield the most coherent narrative. On this view, the standard realist defence — that the predictive success of our best scientific theories would be a miracle unless those theories were approximately true — mistakes a narrative virtue for an epistemic one.

  Tell me what would count against this position. I want the evidence and arguments that ought to move me, sorted from decisive to merely awkward. Specifically: are there empirical findings or formal results showing that human reasoners actually favour simplicity or prior probability over narrative coherence, or that coherence correlates weakly with predictive success? Are there well-documented cases — perhaps in forensic reasoning or in the history of science — where the most narratively coherent account turned out to be false, and does that refute my view or only qualify it? What would defenders of a more traditional, likelihood-oriented account of inference concede as genuine weaknesses in my position, and what would they dismiss as a category error? Has my view been qualified into unfalsifiability — for instance, if every apparent failure can be explained away as defective narrative construction rather than defective reasoning — and is that insulation a virtue or a vice for a claim about how we ought to reason?

  Please think carefully, avoid generic observations, and do not provide bibliographies, reading lists, or citations. Write in polished British English throughout.
