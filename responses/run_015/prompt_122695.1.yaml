      *   **Tone:** Rigorous, candid, practical, slightly academic but grounded in operational reality. No softening of hard truths (especially regarding the "dedication filter").

  2.  **Pre-Drafting Reflection (Load-Bearing vs. Refinements):**
      *   *Goal:* Distill complex signaling theory into a checklist without losing the epistemic bite.
      *   *Load-Bearing:* The concept of *Net Cost* is critical. If the cost isn't real or is borne by a third party, the signal fails. The distinction between *Index* (hard to fake) and *Signal* (costly to fake) is vital for audit depth. *Audience Leak* is essential for safety/ethics in fragile contexts.
      *   *Refinements to Sacrifice:* Strict biological analogies (e.g., "handicap" vs. "signal" semantics) matter less than the *incentive structure*. We don't need to model the evolutionary stability mathematically, just check if the cost scales with quality.
      *   *Contested/Silent:* Theory is silent on *how much* cost is too much ethically. It describes *if* a signal works, not *if it should be required*. This is a value judgment the foundation must own. Theory is also fuzzy on "counter-signaling" in non-market contexts; sometimes silence is noise, not confidence.
      *   *Usability:* POs can't calculate exact dollar values of opportunity costs. They need heuristics (e.g., "Does this cost >5% of their budget?").
      *   *Key Insight:* The "Dedication Filter" (Case 4) is likely a perverse signal that selects for wealth/access, not quality/commitment. This needs to be stated bluntly.

