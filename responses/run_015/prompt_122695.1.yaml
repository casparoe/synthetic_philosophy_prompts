      *   *Case 2 (Website vs. Referral):* Website = costly signal but maybe anti-correlated (marketing skill vs. program skill). Referral = trust transfer (index of intermediary's reputation).
      *   *Case 3 (Matching):* Classic signal. Check if local money is real or recycled. Check if it excludes poor communities (perverse).
      *   *Case 4 (Dedication Filter/Travel):* This is the hard one. It's a handicap. But is it correlated with *program quality*? No, it's correlated with *liquidity/privilege*. It selects for organizations that can afford to burn cash, not necessarily those that do good work. Reimbursing destroys the signal but fixes the bias. Recommendation: Kill it or replace with remote deep-dive.

  5.  **Drafting the One-Pager:**
