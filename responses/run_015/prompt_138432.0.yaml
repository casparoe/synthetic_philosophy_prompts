answer: |-
  1. **The Mast and the Island**
  **Question:** Professor Reventlow, you've argued that the literature on precommitment has been "arguing about the mast and never about the island." For a listener who doesn't know the Odyssey: Ulysses has himself tied to the mast to resist the Sirens. Most theorists ask whether tying himself up was rational. You say we should be asking about the island. What is the island, and why does focusing on it change whether we think the rope is justified?
  **Expected Answer:** She will say the "island" is the specific danger being guarded against. We shouldn't ask if precommitment is generally good, but whether the specific threat is a temporary distortion (the Sirens) or a permanent change of course.
  **Follow-up:** So the legitimacy of the rope depends entirely on the nature of the song? If the song wasn't a spell, but simply a new realization that the Sirens had better navigation charts than he did, does the rope become a shackle?

  2. **The Asymmetry of Impairment**
  **Question:** Let's bring this to constitutional law. When Ulysses ties himself up, he knows he will be temporarily insane—drunk on song and desire. But when a Constitution binds a future citizen, that citizen isn't insane. They might just be sober, rational people who disagree with the Framers about what justice requires. Doesn't your distinction condemn most actual constitutions as illegitimate shingles?
  **Expected Answer:** She will distinguish between "corruption of judgment" (situational) and "mere disagreement" (developmental). She will argue constitutions are only meant to stop the former, like war panics or mob fury.
  **Follow-up:** That requires a theory of political corruption that isn't just "I disagree with this outcome." What theory of corruption allows you to label a majority's decision as "situational fury" without simply smuggling in your own substantive view of justice as the neutral baseline?

  3. **Neutrality and Corruption**
  **Question:** Following up on that: If a majority votes to restrict speech during a war, you might call that panic. But if they vote to restrict speech to protect a minority from hate, is that panic or progress? If your test relies on identifying "corruption," can it ever stay neutral between competing conceptions of justice, or does it always privilege the status quo?
  **Expected Answer:** She will likely argue that procedural markers (speed, secrecy, intensity of emotion) can identify corruption without judging the outcome's moral content.
  **Follow-up:** But a revolution can be slow, open, and calm. If a society quietly and reflectively decides to abandon a right the Framers thought essential, on what grounds do you call that "corruption" rather than "growth" without appealing to the very values the society has chosen to leave behind?

  4. **The Epistemic Test**
  **Question:** Let's assume we accept that distinction. How is a judge supposed to tell the difference in a hard case? You've suggested something like "stable endorsement under reflection." But that sounds like a test that says: "If I still want it later, it was developmental; if I regret it, it was situational." How do we apply that in real time, before the regret sets in?
  **Expected Answer:** She will propose looking for signs of external pressure or temporary distortion—like a run on the currency or an immediate aftermath of a terror attack—versus slow cultural shifts.
  **Follow-up:** So it's about the speed and source of the change? Then imagine a society raised under a rigid caste system that, over two generations, stably and reflectively endorses that hierarchy. Is that developmental because it's stable, or situational because it's the result of indoctrination? Which factor wins?

  5. **The Secular/Devout Case**
  **Question:** Let's press that example. Suppose a founding charter entrenches secularism. Two centuries later, the population is devoutly religious and wants to integrate faith into law. They aren't in a panic; this is their settled identity. Your theory says the precommitment loses its claim. But what if the court says the secularism was meant to protect against the "situational" danger of sectarian violence? Who decides which story is true?
  **Expected Answer:** She will likely say this is a "drafting problem." If the rationale was to prevent violence, and there is no violence, the clause shouldn't bind. The distinction is in the rationale, not the text.
  **Follow-up:** But the court is the one interpreting the rationale. If the court itself is an institution designed to protect the old order, how can it objectively assess whether the new religious identity is a "development" or a "corruption" without biasing the inquiry toward the original secular view?

  6. **Time and Decay**
  **Question:** I want to ask about time. In personal psychology, I feel more connected to who I was yesterday than who I was twenty years ago. If the force of a precommitment tracks that psychological connectedness, shouldn't a constitutional clause written two centuries ago bind us less than one written twenty years ago, even if the text is identical?
  **Expected Answer:** She will likely agree that binding force should decay over time as the "earlier self" becomes more distant from the "later self."
  **Follow-up:** If you accept that decay, what is the institutional consequence? Are you committed to sunset clauses for all entrenched rights, or periodic re-authorization? Because without that, you're allowing the dead to bind the living indefinitely.

  7. **Sunsets and Panics**
  **Question:** Let's say we adopt your suggestion of renewable entrenchment—a clause that lapses in year twenty. But imagine a war panic hits in year eighteen. Everyone knows the clause is about to expire. Does that knowledge undermine the discipline the clause was supposed to provide? Can a "ticking clock" precommitment actually stop a situational frenzy?
  **Expected Answer:** She might argue that the requirement to actively renew forces a moment of reflection that dampens the panic, making the precommitment stronger, not weaker.
  **Follow-up:** That implies yesterday's amendment binds us more tightly than the Founding itself, simply because it's newer. Are you comfortable with the implication that the core architecture of the state becomes less legitimate simply by surviving?

  8. **The Executant Problem**
  **Question:** In the Odyssey, the sailors have wax in their ears. Their judgment isn't at stake; they just follow orders. In a democracy, the institution that decides whether a change is "situational" or "developmental" is usually the Court—the very institution whose power the precommitment limits. Who guards the guardians on your account?
  **Expected Answer:** She will appeal to the constraint of public reason: judges must write opinions that justify their classification, which subjects them to public scrutiny and prevents arbitrary power.
  **Follow-up:** But if the public is already in the grip of the "situational" panic you're worried about, they won't care about the reasoning. If the public is calm enough to judge the reasoning, you didn't need the precommitment. Doesn't this leave you with no enforcement mechanism exactly when you need one?

  9. **The Amendment Rule**
  **Question:** You mentioned supermajority amendment rules as a possible check. But that rule is itself a precommitment. It binds a future majority to a past one. Does the amendment rule itself have to pass your situational/developmental test? Or is it the one tool we use to administer the test?
  **Expected Answer:** She will likely argue the amendment rule is the procedural framework that allows the distinction to be operationalized, so it stands outside the test.
  **Follow-up:** But if a future generation wants to lower the threshold from two-thirds to a simple majority because they feel the old rule is stifling their development, and you block them using the old rule, aren't you treating the procedural rule as a substantive value? How is that not just another form of entrenchment?

  10. **Circularity and Identity**
  **Question:** I'm concerned about circularity. Precommitments don't just protect identity; they shape it. An entrenched bill of rights teaches citizens what to value. So the "later self" you want to respect was partly constituted by the "earlier self's" rules. Does that make your justification self-validating?
  **Expected Answer:** She will acknowledge the feedback loop but argue that some baseline stability is required for any identity to form at all; total fluidity is chaos, not development.
  **Follow-up:** If the arrangement creates the preferences used to defend the arrangement, how do we ever distinguish between a citizen who is "free" and one who is "adapted to their chains"? What evidence would you look for to prove the latter?

  11. **Who is the Earlier Self?**
  **Question:** Ulysses is one person. A polity is millions, changing over time. None of the current citizens ratified the founding. With substantial immigration and population replacement, what makes the founding generation the "earlier temporal stage" of a present citizen rather than a different agent altogether?
  **Expected Answer:** She will argue for a narrative conception of the people: we are the same agent if we share a continuing political project and story, not just biological continuity.
  **Follow-up:** But if the story changes—if the new population rejects the old narrative—does the contract dissolve? If so, does your theory imply that high immigration rates automatically weaken constitutional legitimacy, since the "self" has been replaced?

  12. **The Medical Analogue**
  **Question:** Let's look at psychiatric advance directives. In some places, if you authorize treatment in advance, it can be forced on you even if your competent later self refuses it. Your distinction suggests we should honor the prior wish only if the later refusal is "situational" (psychosis). What would a clinician have to do differently if the law adopted your rationale instead of a simple competence test?
  **Expected Answer:** She would say clinicians would need to assess not just capacity, but the *source* of the refusal—is it the illness speaking, or a genuine change in values?
  **Follow-up:** Criminal law is willing to hold a person to a prior consent (like a contract) but hesitant to hold them to a prior waiver of rights. Why is the state so much more willing to enforce a prior "yes" than a prior "no" when the person changes their mind, and does your theory explain that asymmetry?

  13. **Scope and Debt Brakes**
  **Question:** Does this distinction do work outside of rights and constitutions? Think of statutory debt brakes or independent central banks. These bind future budgets. If a future generation votes to spend more on climate change, is that "situational" spending panic or "developmental" priority shift? Does your theory survive cases where the later self is not worse off by their own later lights at all?
  **Expected Answer:** She will argue debt brakes are justified only to prevent panic borrowing (situational), not to prevent democratic choices about redistribution (developmental).
  **Follow-up:** But if the later generation looks at the debt, accepts it, and decides the spending was worth it, your theory says the brake was illegitimate. So the legitimacy of the economic rule is only visible in hindsight? That seems to offer no guidance to the drafter in the present.

  14. **The Interest-Relative Case**
  **Question:** I want to test your two stock moves: that hard cases are "drafting problems" and that the distinction is in the "rationale, not the text." Imagine a demographic shift where a new majority views an old right as a privilege of the elite. They call it "development"; the elite call it "corruption." The text is clear, the rationale is disputed. If the classification is obviously interest-relative regardless of how it is drafted, how is this a drafting problem?
  **Expected Answer:** She might try to argue that a better drafting could have specified the conditions under which the right could be waived.
  **Follow-up:** But no text can specify every future contingency. If the disagreement is about the *nature* of the change itself, and that judgment favors whoever holds power at the moment of decision, then the "rationale" is just a weapon for the winner. How do you prevent your distinction from becoming a post-hoc justification for whatever the court prefers?

  15. **Falsification**
  **Question:** Finally, Professor Reventlow, scientific theories must be falsifiable. If the distinction is in the rationale and not the text, and hard cases are just drafting errors, what evidence or what kind of case would show the situational/developmental distinction to be false or idle? If every counter-example can be explained away as a "drafting error" or a "misidentified rationale," isn't the theory immune to criticism?
  **Expected Answer:** She may struggle here, perhaps suggesting a case where a clearly situational panic is protected, or a clearly developmental change is blocked, as a failure.
  **Follow-up:** But who adjudicates that clarity? If the only way to prove your theory wrong is to find a case where everyone agrees on the classification, then your theory adds nothing to the consensus. If it's meant to guide us where we *don't* agree, what constrains the judge from simply projecting their own view of "development" onto the constitution?

  ***

  ### If We Run Short on Time: The Top Three
  1.  **Question 2 (The Asymmetry of Impairment):** This strikes at the core analogy. If the Ulysses metaphor doesn't hold for citizens who aren't impaired, the whole theory wobbles.
  2.  **Question 5 (The Secular/Devout Case):** This forces her to apply the theory to a concrete, high-stakes constitutional conflict, moving from abstraction to reality.
  3.  **Question 15 (Falsification):** This is the philosophical checkmate. It asks her to define the limits of her own theory, preventing her from retreating into "it's all about rationale" indefinitely.
