o the system in case three, despite the lives that abolition costs. These five verdicts feel stable in isolation, but they pull in opposing directions: case one and case two disagree about whether systemic risk can defeat token-level desert; case three and case four disagree about whether deterrence can coexist with a strict desert constraint on selection; and case five seems to reject the life-maximizing logic that made case three permissible in the first place. Is there a unified principle—perhaps one that distinguishes institutional authorization from token execution, or that ranks the avoidance of wrongful killing above the maximization of lives saved—that can preserve all five? If no such principle exists, which verdict should I relinquish, and does abandoning it commit me to pure retributivism, pure consequentialism, or a hybrid position with a precise boundary condition?
