answer: |-
  ### The Principle: Dispositional Chemical Autopoiesis

  To capture all your verdicts without contradiction, the principle must combine three specific constraints: **Substrate** (to exclude robots and simulations), **Organization** (to exclude fires and prions), and **State** (to include tardigrades and PVS humans).

  **Precise Formulation:**
  > A system is alive if and only if it is a **physically instantiated chemical system** that exhibits **organizational closure (autopoiesis)** and possesses the **dispositional capacity for metabolic self-maintenance**.
  >
  > 1.  **Chemical Instantiation:** The system's critical processes must be driven by molecular chemical affinities and thermodynamic flux, not by macroscopic mechanical assembly or abstract symbolic state changes.
  > 2.  **Organizational Closure:** The system must produce the components (including its own boundary) that constitute the system itself, distinguishing it from the environment.
  > 3.  **Dispositional Capacity:** The system need not be actively metabolizing at every moment, provided it retains the structural integrity to resume self-maintenance under appropriate conditions.
  > 4.  **Lineage Independence:** Evolutionary history or ancestral lineage is not a necessary condition.

  ---

  ### Application to Your Verdicts

  This principle successfully saves all seven of your stated cases (the six pairs plus the tardigrade) without ad hoc adjustments.

  | Case | Verdict | Application of Principle |
  | :--- | :--- | :--- |
  | **1. Synthetic Bacterium** | **Alive** | **Chemical:** Yes (DNA/Proteins). **Closure:** Yes (produces boundary/metabolism). **Capacity:** Yes. **Lineage:** Irrelevant. |
  | **2. Robotic Factory** | **Not Alive** | **Chemical:** **No.** Processes are mechanical/electronic, not driven by molecular chemical affinity. Fails Condition 1. |
  | **3. Prion Strain** | **Not Alive** | **Chemical:** Yes. **Closure:** **No.** Prions lack a boundary and do not produce the machinery that replicates them (they hijack host cells). They are parasitic replicators, not autopoietic systems. Fails Condition 2. |
  | **4. Computer Simulation** | **Not Alive** | **Chemical:** **No.** Processes are logical/symbolic states on hardware, not chemical thermodynamic flux. Fails Condition 1. |
  | **5. PVS Human** | **Alive** | **Chemical:** Yes. **Closure:** Yes (body maintains boundaries). **Capacity:** Yes (metabolism is active). Consciousness is irrelevant. Meets all conditions. |
  | **6. Forest Fire** | **Not Alive** | **Chemical:** Yes. **Closure:** **No.** Fire consumes fuel but does not produce a boundary that separates "self" from "environment," nor does it produce the fuel. It is a dissipative structure, not an autopoietic one. Fails Condition 2. |
  | **7. Tardigrade** | **Alive** | **Chemical:** Yes. **Closure:** Yes. **Capacity:** **Dispositional.** Metabolism is suspended, but the organizational structure allows resumption. Meets Condition 3. |

  **Addressing Your Concerns:**
  *   **Prion Exclusion:** This is not ad hoc. Under autopoiesis, a prion fails because it is *allopoietic* (made by something else) regarding its replication machinery. It lacks the systemic closure of a cell.
  *   **Simulation Exclusion:** This is not arbitrary substrate chauvinism if defined functionally. Life is defined here as a *chemical thermodynamic phenomenon*, not an *informational phenomenon*. A simulation models the logic of life but does not instantiate the physical chemistry of self-construction.
  *   **Synthetic Cell:** Lineage independence explicitly protects this verdict.

  ---

  ### The Borderline Case: The Chemically Synthesized Protocell

  **Case Description:** A chemically synthesized protocell with a lipid boundary and internal reaction cycles, assembled atom-by-atom, with no evolutionary history and **no genetic material**.

  **Application of the Principle:**
  1.  **Chemical Instantiation:** **Yes.** It is built of lipids and reacting molecules.
  2.  **Organizational Closure:** **Yes.** You specified it maintains a lipid boundary and internal reaction cycles. If the internal cycles produce the lipids that maintain the boundary, it is autopoietic.
  3.  **Dispositional Capacity:** **Yes.** Assuming the cycles are stable.
  4.  **Lineage:** Irrelevant.

  **Verdict:** **Alive.**

  **Does this force further revision?**
  **No, but it forces a philosophical commitment.**
  This verdict is consistent with your existing seven cases. It does not contradict the Synthetic Bacterium (which is also artificial) or the Prion exclusion (which lacks closure).

  However, this verdict reveals that your principle is **"Metabolism-First"** rather than **"Genetics-First."**
  *   **If you accept the Protocell as Alive:** The principle stands as written. You have successfully unified your judgments under a definition of life as *self-sustaining chemical organization*.
  *   **If you intuit that the Protocell is NOT Alive:** You must revise the principle to include a **Heritable Information Constraint** (e.g., "must contain a mechanism for open-ended evolutionary adaptation, typically nucleic acids").

  **Recommendation on Revision:**
  If you add a Heritable Information Constraint to exclude the Protocell:
  1.  **Prion:** Still excluded (no nucleic acids).
  2.  **Synthetic Cell:** Still included (has a genome).
  3.  **Risk:** You risk tightening the definition so much that it becomes circular (i.e., "Life is what has DNA," which excludes the possibility of alternative biochemistries).

  **Final Judgment:**
  Your current verdicts are most coherently saved by **Dispositional Chemical Autopoiesis**. This principle classifies the **Protocell as Alive**. You should only abandon this verdict if you hold a deep intuition that *genetic memory* is the essence of life. If you do, you must add a genetic clause, but be aware that this shifts your definition from "organizational" to "evolutionary," which may complicate the status of the Synthetic Cell if its genome is deemed too minimal to support open-ended evolution.

  **To maintain maximum coherence with your stated emphasis on "metabolic self-maintenance," keep the principle as is and accept the Protocell as a minimal form of life.**
