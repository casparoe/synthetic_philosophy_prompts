answer: |-
  **PhD Comprehensive Exam: Philosophy of Science**
  **Module: Reduction, Emergence and Causation**
  **Time Allowed: 90 Minutes**

  **Question 1**

  Right, here's the scenario. You've got a hypothetical researcher, let's call her Dr X, working on superconductivity. She claims the macro-state of the superconductor involves downward causation—specifically, that the collective state genuinely alters the pairing behaviour of individual electrons. However, she insists this doesn't violate the causal closure of the physcial domain. Her trick? She's using an interventionist, difference-making account of causation (à la Woodward) rather than a productive-mechanistic one.

  Your task is to evaluate whether her position is coherent. You can't just wave at Broad or Kim and hope for the best. You need to dig into the weak vs. strong emergence distinction and engage with the mechanist literature (think Craver or Bechtel) regarding whether decompositional explanation can ever accommodate genuinely downward causal claims. Is she onto something, or is this just a category mistake waiting to happen?

  ***

  **Model Answer**

  Dr X's position is provocative but ultimately hangs on a equivocation regarding what 'causation' means in this context. If we take her interventionist commitment seriously, she can maintain coherence, but only by deflating the ontological weight of 'downward causation'.

  First, consider the interventionist framework. Woodward argues that causation is about invariant relationships under interventions. If manipulating the macro-state (say, cooling below critical temperature) changes the micro-state (electron pairing), there is a causal link in the difference-making sense. This doesn't necessarily violate causal closure because interventionism is compatible with non-reductive physicalism. The macro-variable supervenes on the micro, so intervening on the macro is effectively intervening on the micro base. Thus, causal closure is preserved because all physical effects have sufficient physical causes; the macro-description just tracks them differently. However, this makes downward causation somewhat deflationary—it's about explanatory leverage, not ontological novelty.

  This brings us to emergence. If Dr X claims strong emergence, she's suggesting novel causal powers that aren't derivable from the micro-level. This would clash with causal closure unless she accepts overdetermination or rejects physicalism. Given she insists on closure, she must be arguing for weak emergence. Bedau defines this as macro-properties that are derivable from micro-dynamics but only via simulation (unpredictable). Superconductivity fits weak emergence well; the Cooper pairs arise from micro-interactions, but the macro-state constrains them. If she frames downward causation as a feature of weak emergence, it's coherent. If she implies strong emergence while keeping closure, she's in trouble.

  The mechanist literature adds a crucial layer. Craver and Bechtel argue that inter-level relationships are often constitutive, not causal. In a mechanism, the whole is organised parts. When we say the whole affects the parts, we're usually describing a change in the conditions under which the parts operate, not a separate causal push. For decompositional explanation to work, we need to isolate parts. If the macro-state 'causes' micro-behaviour, it might just be specifying the boundary conditions for the mechanism. Craver suggests calling this 'constitutive relevance' to avoid the confusion of downward causation. If Dr X insists on 'causation', she risks conflating constitution with causation.

  However, recent work suggests mechanists can accommodate downward causation if viewed as mutual manipulability. If you can intervene on the whole to change the part, and vice versa, there's a causal loop of sorts. But this loops back to the interventionist point: it's about manipulability, not production.

  So, is she coherent? Yes, but conditionally. Her position holds if 'downward causation' is interpreted as difference-making within a single physical domain (weak emergence) and understood as constitutive relevance within a mechanism. If she claims the macro-state produces physical effects absent from the micro-level (strong emergence/production), she violates closure. The coherence relies on accepting that 'causation' here is epistemic or relational, not a fundamental physical force. She's basically arguing for explanatory autonomy without ontological surplus. It's a stable position, provided she doesn't slip into talking about 'powers' that sound too robust.

  There's a risk she's confusing the map for the territory. The macro-state describes a constraint, not a cause in the productive sense. But within her chosen framework, she's safe. Just.

  ***

  **Marking Scheme (20 Marks Total)**

  1.  **Interventionist Analysis (4 marks):** Must explain how difference-making allows causal claims without violating closure (supervenience).
      *   *Typical mess-up:* Treating interventionism as identical to productive causation.
  2.  **Causal Closure Compatibility (4 marks):** Must address whether the physical domain remains closed given the macro-interventions.
      *   *Typical mess-up:* Claiming closure is automatically violated by any downward claim.
  3.  **Weak vs. Strong Emergence (4 marks):** Must distinguish the two and place Dr X's claim correctly (likely weak).
      *   *Typical mess-up:* Using Broad's classic definiton without updating for contemporary physics cases.
  4.  **Mechanistic Decomposability (4 marks):** Must engage with Craver/Bechtel on constitutive relevance vs. causal interaction.
      *   *Typical mess-up:* Ignoring the constitutive/causal distinction entirely.
  5.  **Final Coherence Verdict (4 marks):** Must provide a clear yes/no/maybe with justification based on the above.
      *   *Typical mess-up:* Sitting on the fence without committing to an interpretation of causation.

  Verdict: Coherent only if downward causation is deflated to difference-making and constitutive relevance within weak emergence.
