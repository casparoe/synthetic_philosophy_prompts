answer: |-
  You have constructed a very sharp version of the "collapse objection," but the break is actually earlier than you think, and it saves you from having to abandon your section on the doing/allowing distinction.

  The broken step is **(4)**.

  Here is why (4) fails, how to repair (1c) to prevent the collapse, and why the baseline dependence you worry about is actually a feature of DDE, not a bug.

  ### 1. The Logical Break: Permission vs. Obligation (Step 4)

  Your argument assumes that if DDE permits an action because the good outweighs the bad, DDE must *require* that action when the alternative yields less good. This smuggles a **maximizing principle** into a **threshold principle**.

  *   **Consequentialism:** You must optimize. If Action A produces more good than Action B, A is obligatory.
  *   **DDE:** You are constrained. You may not intend evil. You may only tolerate evil if there is a *sufficiently grave reason*.

  In the Trolley case, DDE verdicts are typically:
  *   **Diverting:** Permissible (Good is sufficient to tolerate the side-effect).
  *   **Not Diverting:** Permissible (You are not required to intervene to save others, provided your non-intervention doesn't violate a specific duty).

  Step (4) claims: *"Five deaths for one life isn't proportionate. So not diverting is forbidden."*
  This is false under DDE. Proportionality in DDE is a condition for **licensing an intervention that causes harm**, not a condition for **mandating the optimization of outcomes**.

  If you reject (4), the collapse stops. DDE allows you to let the five die (because you have no duty to optimize), but it also allows you to save the five (because the harm to the one is proportionate). This makes DDE non-consequentialist because it permits sub-optimal outcomes (letting the five die) without requiring optimal ones (killing the vagrant).

  ### 2. The Conceptual Fix: Reformulating (1c)

  You said you want to keep (1). You can, but you must clarify the interpretation of clause (c). Your formulation ("the good is proportionate to the foreseen harm") is ambiguous between a *balance* and a *threshold*.

  **Current (1c):** "the good is proportionate to the foreseen harm."
  **Problem:** "Proportionate" sounds like a scale where you weigh Total Good vs. Total Bad. This invites your Step (4).

  **Revised (1c):** "there is a **sufficiently grave reason** to permit the foreseen harm, considering the value of the intended good."

  **Why this works:**
  *   **In Trolley (Normal):** Saving five is a *sufficiently grave reason* to tolerate the death of one. (Passes).
  *   **In Trolley (Not Diverting):** You are not *causing* the death of five; you are allowing a threat to run its course. Clause (c) applies to *permitting harm you cause*. It does not generate a duty to prevent harm you didn't cause.
  *   **In Transplant:** Killing the vagrant fails (1a) immediately (see below). But even if it passed (1a), is saving five a *sufficiently grave reason* to kill an innocent? DDE says no, because the act type violates the right to life.

  By changing (1c) from a comparative balance to a justificatory threshold, you block the inference from "Permissible" to "Obligatory."

  ### 3. Why Step (5) Fails on Clause (1a)

  Your argument in (5) assumes the surgeon's act ("cut him up") clears clause (1a): *"φ is the sort of act that's independently permissible."*

  You want to avoid the doing/allowing distinction, but you cannot avoid the **Act Description** distinction. DDE relies on the moral species of the act, not just the physics.
  *   **Trolley:** The act is "redirecting a threat." This is not intrinsically wrong.
  *   **Transplant:** The act is "killing an innocent non-threat." This *is* intrinsically wrong.

  If you define the act physically ("moving a scalpel" vs "throwing a switch"), you lose DDE. If you define the act morally ("murder" vs "threat redirection"), (1a) blocks the Transplant case regardless of proportionality.

  You don't need a robust doing/allowing distinction here; you need a **means/side-effect** distinction embedded in the act description. In Transplant, the vagrant's death is the *means* to saving the five (you need his organs). In Trolley, the one's death is a *side effect* (you need the track clear, not the body). This falls under your clause (1b) ("harm... neither your end nor your means").

  So (5) is false because the Transplant case fails (1b) (death is the means) and (1a) (act is intrinsically impermissible), not because of proportionality.

  ### 4. Defending the Baseline (Your Final Worry)

  You worry that DDE is "hostage to a baseline" (the switch position).
  *   **Case A:** Trolley to 5. Switch diverts to 1. DDE: Permissible to throw.
  *   **Case B:** Trolley to 1. Switch diverts to 5. DDE: Forbidden to throw.

  You ask: *"Same people, same deaths... differs only in which way the hardware happens to sit."*

  This is not a bug; it is the definition of **agency**. DDE is an agent-centered doctrine, not an outcome-centered one.
  *   In Case A, the *intervention* costs 1 life to save 5.
  *   In Case B, the *intervention* costs 5 lives to save 1.

  The baseline matters because DDE evaluates the **moral cost of the agent's intervention**.
  *   In Case A, the agent introduces a causal chain that results in 1 death.
  *   In Case B, the agent introduces a causal chain that results in 5 deaths.

  The fact that the *total* deaths in the world might be the same (if you count the ones who die naturally) is irrelevant to DDE. DDE asks: "What harm am *I* responsible for?"
  *   In Case A, if I act, I am responsible for 1 death.
  *   In Case B, if I act, I am responsible for 5 deaths.

  This baseline dependence is what prevents DDE from becoming consequentialism. Consequentialism ignores the baseline (only states of affairs matter). DDE respects the baseline (only changes initiated by the agent matter).

  ### Summary of Fixes

  To save your chapter without reaching for the doing/allowing distinction:

  1.  **Reject Step (4).** DDE creates permissions, not obligations. It is a shield, not a sword.
  2.  **Clarify (1c).** Change "proportionate" to "sufficiently grave reason." This makes it a threshold, not a maximizing scale.
  3.  **Hold firm on (1a) and (1b) for Transplant.** The Transplant case fails because the death is a *means* (violates 1b) and the act is *murder* (violates 1a), not because the math is wrong.
  4.  **Embrace the Baseline.** Argue that baseline dependence is necessary for any non-consequentialist theory that values agent-integrity over state-of-affairs optimization.

  **The Cheapest Thing to Give Up:**
  Give up the idea that DDE generates **positive duties to optimize**. If you accept that DDE is purely a set of **side-constraints on action**, your argument collapses, and DDE remains distinct from consequentialism.

  **Revised (1) for your text:**
  > (1) DDE: you may φ only if (a) φ is the sort of act that's independently permissible, (b) your end is good and the harm you foresee is neither your end nor your means to it, and (c) **there is a sufficiently grave reason to permit the foreseen harm, given the intended good.**

  This formulation blocks (4) (no duty to optimize), blocks (5) (Transplant fails on 'a' and 'b' before 'c' matters), and accepts the baseline distinction as a feature of agency.
