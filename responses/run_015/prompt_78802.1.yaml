prompt: |-
  For several years a small reading group I belong to has kept returning to Parfit's hitchhiker and to the wider family of cases in which it seems rational to become the sort of agent who would act irrationally in a one-off choice. The basic case is familiar: you are stranded, a driver offers a ride on condition that you pay later, you know you will never see the driver again and that no sanction can reach you, and you also know that only someone disposed to pay will get the ride in the first place. We have added two variants that have made the argument worse rather than better. In the first, the driver can see a cheap but imperfect signal of your disposition, so the question becomes whether the signal or the disposition is doing the rationalizing. In the second, the hitchhiker is not one person but a small group that must decide together whether to cultivate a reputation for paying, which raises the question whether the rationality at issue belongs to individuals, groups, or practices. The group divides into three camps and none has moved in months. The first says the case shows that decision theory must evaluate dispositions or policies rather than isolated acts, so paying is rational as part of the policy that secures the ride. The second says that is a confusion: the disposition may be causally advantageous, but the act of paying, once it is chosen, is still irrational, and the theory should say so plainly; what we have is a case where it is rational to be irrational. The third says both sides are answering the wrong question, because the promise is not a one-off act but a move in a social practice of promising, and the real question is what the practice requires of someone who has already accepted its benefits. Every reply is anticipated, and the exchange now feels less like an unfinished argument than like arguments that have stopped touching.

  I want a diagnosis rather than a verdict. Is this a substantive disagreement about the correct theory of rational choice, a verbal dispute about whether the word rational attaches to acts or to dispositions, or two or three different questions being asked under one heading—one about the causal efficacy of character, one about the logic of counterfactual commitment, one about the norms internal to promising? Is a hidden formal or empirical question doing the work, perhaps about whether the disposition is detectable or about how to model subjunctive dependence? And given your diagnosis, what would count as progress: a distinction, a formal result, a change of question, or an argument that no progress should be expected because the camps start from intuitions that cannot be argued for? I am especially interested in whether the impasse survives once we separate the question of what it is rational to do from the question of what it is rational to be, and whether the practice-based reading changes the kind of disagreement or merely relocates it. Please engage the camps as I have described them, and be concrete about what each side would have to give up for the debate to move.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group is stuck on Parfit's Hitchhiker and variants (imperfect signal, group decision).
      *   **The Problem:** Three camps have formed, none moving for months. Replies are anticipated; arguments aren't touching.
      *   **The Camps:**
          1.  *Disposition/Policy Theory:* Decision theory should evaluate dispositions/policies, not acts. Paying is rational as part of the ride-securing policy. (Roughly CDT/TDT/EDT hybrid or Dispositional Decision Theory).
          2.  *Act-Based/Sophisticated CDT:* The disposition is causally advantageous, but the *act* of paying is irrational once the ride is secured. It's rational to be irrational. (Standard Causal Decision Theory).
          3.  *Practice-Based:* The promise is part of a social practice. The question isn't isolated rationality but what the practice requires after accepting benefits. (Rule-Following/Contractualist/Williams-esque).
      *   **The Task:** Provide a *diagnosis* rather than a *verdict*.
      *   **Key Questions to Address:**
          *   Is it substantive theory, verbal dispute, or talking past each other (different questions)?
          *   Is there a hidden formal/empirical question (detectability, subjunctive dependence)?
          *   What counts as progress (distinction, formal result, change of question, acceptance of impasse)?
          *   Does separating "rational to do" vs. "rational to be" help?
          *   Does the practice-based reading change or relocate the disagreement?
          *   Be concrete about what each side must give up to move.

  2.  **Deconstruct the Impasse:**
      *   The core tension is between *ex-ante* optimality (getting the ride) and *ex-post* optimality (keeping the money).
      *   Camp 1 focuses on *ex-ante* rationality (policy selection).
      *   Camp 2 focuses on *ex-post* rationality (act selection).
      *   Camp 3 changes the domain from *instrumental rationality* to *normative obligation within a practice*.
      *   *Diagnosis:* This is primarily a case of **talking past each other due to divergent scopes of evaluation**, compounded by a **category error** regarding the third camp. It's not merely verbal, because the stakes involve how we model agency, but it's not a single substantive disagreement about "the one true theory" because they are optimizing different variables.

  3.  **Drafting the Diagnosis - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the stalemate. It's a classic "Newcomb-like" problem fracture. State the core thesis: This is a *triangulation failure*. Three different coordinate systems are being used to map the same terrain.

      *   **Analyzing the Camps (The "What" of the Disagreement):**
          *   *Camp 1 (Policy):* They are playing a game of *self-constitution*. They view the agent as a temporally extended entity.
          *   *Camp 2 (Act):* They are playing a game of *causal leverage*. They view the agent as a momentary maximizer.
          *   *Camp 3 (Practice):* They are playing a game of *social normativity*. They have exited instrumental rationality entirely.
          *   *Diagnosis:* Camp 1 and 2 are fighting over the *object of evaluation* (Act vs. Disposition). Camp 3 has changed the *subject* (Prudence vs. Obligation).

      *   **The "Rational to Do" vs. "Rational to Be" Distinction:**
          *   This is the crucial pivot. Parfit himself distinguished these.
          *   Camp 2 accepts "Rational to Be" (have the disposition) but denies "Rational to Do" (pay).
          *   Camp 1 insists if it's Rational to Be, the constituent acts must be derivatively Rational to Do.
          *   *Progress:* Explicitly adopting Parfit's distinction might dissolve the Camp 1 vs. 2 heat, but Camp 1 will resist the derivative loss.

      *   **The Hidden Formal/Empirical Questions:**
          *   *Detectability:* The signal variant matters. If the signal is imperfect, Camp 2 gains ground (marginal gain of paying is low). If perfect, Camp 1 wins.
          *   *Subjunctive Dependence:* This is the technical core. Camp 1 assumes their choice *now* correlates with the driver's prediction *then* (logical dependence). Camp 2 denies this (causal independence).
          *   *Group Variant:* This introduces coordination problems. Camp 3 shines here (internal group norms), but Camp 1 struggles (whose policy?).

      *   **The Practice-Based Camp (Camp 3):**
          *   Does it change the disagreement? Yes, it relocates it from *efficiency* to *validity*.
          *   However, Camp 1 and 2 will ask: "Why follow the practice if it's instrumentally irrational?" Camp 3 says "That's the wrong question."
          *   *Diagnosis:* Camp 3 is speaking a different language (deontic vs. teleological).

      *   **What Counts as Progress? (Concrete Concessions):**
          *   *Camp 1:* Must admit that *at the moment of payment*, causal leverage is zero. They must justify why "policy rationality" overrides "act rationality" without begging the question.
          *   *Camp 2:* Must admit that "Rational to Be" implies a criticism of standard Act-CDT. They need to explain how an agent *becomes* that disposition without acting "irrationally" during the cultivation phase.
          *   *Camp 3:* Must admit they are no longer discussing *instrumental rationality* but *moral/social obligation*. They need to explain why a purely self-interested agent (the Hitchhiker premise) would care about the practice.

      *   **Recommendation for the Group:**
          *   Stop trying to win the "Rational" label.
          *   Formalize the dependency (Newcomb vs. Causal).
          *   Isolate the Group Variant (it breaks the individualist assumptions of 1 & 2).

  4.  **Refining the Tone:**
      *   Needs to be philosophical, precise, empathetic to the stalemate, and analytical.
      *   Avoid taking sides.
      *   Use the terminology provided (dispositions, policies, practices, signals).
      *   Ensure the distinction between "verbal" and "substantive" is nuanced (it's substantive *because* of the verbal ambiguity).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "group variant"?
      *   *Correction:* Need to ensure the group variant is integrated. It highlights the "who is the agent" question. Camp 1 struggles with group agency. Camp 3 handles it better. Camp 2 treats the group as a sum of individuals.
      *   *Check:* Did I answer "what would count as progress"?
      *   *Correction:* Make sure the "Concrete Concessions" section is very specific.
      *   *Check:* Is the distinction between Camp 1 and 2 clear?
      *   *Correction:* Emphasize that Camp 1 is likely advocating for something like Functional Decision Theory (FDT) or Disposition-based CDT, while Camp 2 is Standard CDT.

  6.  **Final Polish:** Organize into clear headings. Ensure the conclusion offers a path forward. (The resulting output matches the detailed response provided previously.)
answer: |-
  This impasse is not merely a failure of argumentation; it is a structural feature of the problem space you are inhabiting. You are experiencing a **triangulation failure**. The three camps are not aiming at the same target, nor are they using the same map, yet they are all using the word "rational" to describe their bullseye.

  Here is a diagnosis of the stalemate, an analysis of the hidden questions doing the work, and a concrete proposal for what progress would require from each camp.

  ### I. Diagnosis: Three Coordinate Systems

  The disagreement is not purely verbal, but it is not a single substantive disagreement about the world. It is a disagreement about the **unit of agency** and the **temporal scope of evaluation**.

  1.  **Camp 1 (Policy/Disposition):** They are modeling the agent as a **temporally extended type**. For them, rationality is a property of the *algorithm* the agent runs, not the specific *output* of that algorithm at time *t*. They are effectively arguing for a decision theory that respects subjunctive or logical dependence (akin to Functional Decision Theory or Disposition-based CDT).
  2.  **Camp 2 (Act/Causal):** They are modeling the agent as a **momentary token**. For them, rationality is about causal leverage at the moment of choice. Once the ride is secured, the past is fixed; the money is gone. They are defending standard Causal Decision Theory (CDT).
  3.  **Camp 3 (Practice):** They have exited the game of **instrumental rationality** entirely. They are modeling the agent as a **social node**. For them, the question is not "what maximizes my utility?" but "what validates my participation in this normative structure?"

  **The Verdict on the Disagreement:**
  It is **not** a verbal dispute in the trivial sense (where you could just define terms and agree). It is a **substantive disagreement about the architecture of agency**, disguised as a verbal dispute about the label "rational."
  *   Camp 1 and Camp 2 are fighting over whether rationality tracks *causal efficacy* (Camp 2) or *logical correlation* (Camp 1).
  *   Camp 3 is committing a category error relative to the other two. They are answering a *deontic* question (what ought I do given this practice?) to a *teleological* problem (how do I get what I want?).

  ### II. The Hidden Questions Doing the Work

  You asked if a hidden formal or empirical question is driving the impasse. Yes, there are two.

  **1. The Nature of Dependence (The Formal Question)**
  Camp 1 and Camp 2 disagree on the structure of the counterfactual.
  *   **Camp 2** assumes: `My Choice (Pay/Don't) -/-> Driver's Prediction`. The prediction is in the past; my current act cannot causally influence it.
  *   **Camp 1** assumes: `My Decision Algorithm (Pay-if-Picked) <-> Driver's Prediction`. The driver predicted the output of my algorithm. Therefore, choosing to run the "Don't Pay" algorithm now implies I *would have* run it earlier, meaning I wouldn't have been picked.
  *   **The Impasse:** Camp 2 sees Camp 1 as engaging in magical thinking (influencing the past). Camp 1 sees Camp 2 as myopic (ignoring that the "act" is an output of a "policy" that was selected).
  *   **The Signal Variant:** This variant exacerbates the tension. If the signal is imperfect, Camp 2 gains ground (the marginal causal benefit of paying drops). If the signal is perfect, Camp 1 wins (non-payment guarantees non-rescue). The group is likely stuck because the "imperfect" signal creates a probabilistic grey zone where Causal and Evidential/Functional calculations diverge without a clear winner.

  **2. The Unit of Agency (The Empirical/Sociological Question)**
  The **Group Variant** exposes a fracture Camp 1 and 2 try to hide.
  *   If the hitchhiker is a group, who holds the disposition?
  *   **Camp 2** treats the group as a sum of individuals. If each individual calculates that paying is irrational, the group won't pay.
  *   **Camp 1** struggles here. Can a group have a "disposition"? If so, how is it enforced internally?
  *   **Camp 3** thrives here. Practices are inherently social.
  *   **The Impasse:** The group variant suggests that Camp 1's "disposition" might actually require Camp 3's "practice" to exist. You cannot maintain a disposition to pay in a group without a social norm enforcing it. This suggests Camp 1 and Camp 3 are closer than they think, but Camp 1 refuses to admit the normative scaffolding required to maintain the disposition.

  ### III. Does "Rational to Do" vs. "Rational to Be" Help?

  Separating these questions (a distinction Parfit himself championed) **dissolves the heat between Camp 1 and Camp 2, but reveals a deeper cost.**

  *   **If you accept the distinction:** Camp 2 wins the label "Rational to Do" (paying is act-irrational). Camp 1 wins the label "Rational to Be" (having the disposition is self-beneficial).
  *   **Why the impasse survives:** Camp 1 will argue that a decision theory that declares the optimal act "irrational" is defective. They want a theory where "Rational to Be" entails "Rational to Do." Camp 2 will argue that a theory where "Rational to Do" contradicts causal dominance is magical.
  *   **The Practice Reading (Camp 3):** This does not resolve the instrumental tension; it **relocates** it. Camp 3 says, "Instrumental rationality is the wrong metric." But Camp 1 and 2 will reply: "If the practice requires me to be instrumentally irrational (losing money with no return), why should I join the practice?" Camp 3 must then argue that the *benefit of the practice* (being the sort of being who can promise) outweighs the *cost of the act*. This just moves the calculation up a level; it doesn't solve the conflict between act and policy.

  ### IV. What Would Count as Progress? (Concrete Concessions)

  For the debate to move, each camp must surrender a specific claim that currently insulates them from the others.

  **Camp 1 (Policy) must give up:**
  *   **The Claim:** "The act of paying is causally efficacious in getting the ride."
  *   **The Concession:** They must admit that *at the moment of payment*, the causal leverage is zero. They must argue for rationality based on **logical consistency across time**, not causal influence. They need to articulate why an agent should view themselves as a "policy" rather than a "series of acts" without begging the question.
  *   **Progress Marker:** They formulate a rule for *when* to evaluate policies vs. acts that doesn't simply say "always policies when it helps."

  **Camp 2 (Act) must give up:**
  *   **The Claim:** "Rationality is solely about maximizing utility at the moment of choice."
  *   **The Concession:** They must admit that standard CDT is **self-defeating** in Newcomb-like problems. They must acknowledge that an agent who knows they will use CDT will be worse off than an agent who uses Camp 1's theory. They need to explain how an agent can *rationally choose* to bind themselves to Camp 1's disposition without violating Camp 2's own principles during the binding phase.
  *   **Progress Marker:** They acknowledge that "Rationality" might need to be split into "Deliberative Rationality" (act) and "Strategic Rationality" (disposition), and explain why the former trumps the latter.

  **Camp 3 (Practice) must give up:**
  *   **The Claim:** "The norms of the practice answer the question of rationality."
  *   **The Concession:** They must admit they are no longer discussing **prudential rationality** (what serves my interests) but **moral/social obligation** (what serves the practice). They must explain why a self-interested hitchhiker (the premise of the case) would care about the practice's internal norms unless doing so serves their interest (which returns them to Camp 1 or 2).
  *   **Progress Marker:** They clarify whether the "rationality" they speak of is *internal* to the practice (like the rules of chess) or *external* (why play chess at all?).

  ### V. Recommendation for the Group

  The feeling that "arguments have stopped touching" is accurate because you are arguing across **levels of abstraction**.

  1.  **Formalize the Dependency:** Stop arguing intuitively. Write down the payoff matrix. Explicitly model the driver's prediction as a function of the hitchhiker's *source code* (Camp 1) vs. the hitchhiker's *action* (Camp 2). If you cannot agree on the causal graph, you cannot agree on the rationality.
  2.  **Isolate the Group Variant:** This is your most promising avenue for breaking the deadlock. The individual case allows Camp 2 to hide behind "causal isolation." The group case forces the question: *How does a disposition exist without a practice?* If Camp 1 admits they need a practice to sustain the disposition, they move toward Camp 3. If Camp 3 admits the practice is only valuable because it secures rides, they move toward Camp 1.
  3.  **Change the Question:** Stop asking "Is paying rational?" Ask: **"What kind of agent do we want to be, and what decision theory supports that agent?"**
      *   If you want to be an agent who gets rides, adopt Camp 1.
      *   If you want to be an agent who never performs causally dominated acts, adopt Camp 2.
      *   If you want to be a member of a community, adopt Camp 3.

  **Final Diagnosis:** You are not stuck because the problem is unsolvable. You are stuck because you are trying to find a **single** theory of rationality that satisfies **three** incompatible desiderata: Causal Purity (Camp 2), Strategic Success (Camp 1), and Normative Stability (Camp 3). Progress requires admitting that no single theory satisfies all three, and deciding which desideratum you are willing to sacrifice.
