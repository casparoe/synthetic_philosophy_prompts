answer: |-
  Good morning, everyone. Thanks for being here.

  I see a mix of faces I know well and some I'm meeting for the first time. To the family members and friends joining us—welcome. We know half of you are here for the rigorous philosophical inquiry, and the other half are here for the coffee and the lunch. Honestly, given the topic, I don't blame you. We're talking about "Prices, Planning, and Prediction." It sounds like a tax seminar, but I promise it's actually about how we know what we know.

  For those who haven't spent the last decade reading interwar economic journals, let's set the table. The title references the Socialist Calculation Debate. On one side, you had Mises and Hayek. They argued that without market prices, you lose the ability to coordinate dispersed knowledge. Prices aren't just numbers; they're signals carrying tacit knowledge—stuff you can't really write down, like local conditions or hunches.

  On the other side, you had Oskar Lange. He argued a central board could simulate the market. Trial and error. Set a price, see if there's a surplus, adjust. Basically, treat the economy like a giant equation solvable by data.

  Here's the angle I want us to push today. Both sides assumed a sharp split. Hayek assumed tacit knowledge was human-only. Lange assumed explicit data was enough for planning. Neither of them really named that split, but it structured the whole fight.

  Now, fast forward to today. We have machine learning. And ML blurs that line. Algorithms can find patterns in data that look an awful lot like tacit knowledge—predictions without explicit rules. So, the question isn't just "can we plan?" It's "what are we doing when an algorithm predicts demand without a price signal?"

  Now, a quick reality check. We need to be clear about what's settled. The 20th century happened. Pure central planning without price mechanisms failed. It failed in practice, and it failed for the reasons Hayek said it would. We aren't here to debate whether we should revive the Gosplan. That ship has sailed, and it sank.

  But what's still open—is algorithmic coordination without prices a new form of planning? When a supply chain algorithm allocates resources based on prediction rather than price discovery, is that Lange winning in the long run? Or is it something entirely new that breaks the old categories?

  We want to separate the history from the speculation. We know prices work. We know command economies collapsed. But we don't know what happens when the planner is a black-box model trained on petabytes of data.

  So, let's keep the history honest, but keep the future open. Don't feel like you need to defend a tribe—Misesian or Langean. Just look at the mechanisms.

  I'll stop there before I eat into the coffee time. Let's get into it.
