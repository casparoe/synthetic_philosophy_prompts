answer: |-
  To function as a replicator, a unit must exhibit fidelity in copying, longevity across bearer turnover, and fecundity in transmission. Evidence of descent in a historical corpus includes verbatim copying, phylogenetic clustering of variants, and persistence despite functional redundancy. My scores calibrate Darwinian purchase to lineage discreteness: high purchase requires identifiable copying events rather than continuous drift.

  I revise **Reconstructive Repair (P)** by inverting the scale: 0 indicates the product reveals the procedure (low copying fidelity needed), while 10 indicates procedural opacity requiring direct instruction (high fidelity copying essential). This aligns P with the necessity of a replicator mechanism. **Fitness Decoupling (D)** remains but distinguishes memetic virulence from adaptive utility; both fit Darwinian models, but high D isolates replicator dynamics from rational choice optimization.

  The hardest calls are **sourdough**, where the biological evolution of the microbial culture conflates with the cultural routine, and **fiddle_tune**, where identity thresholds in oral variation are arbitrary. The Darwinian framing is actively misleading for **going_to**; grammaticalization often reflects frequency-driven drift or processing efficiency rather than discrete replicator competition. I substitute a usage-based emergentist framework there.

