      *   *Candidate B:* The "anchor." Older, slightly slower, but the one who trained Elena or saved her reputation when she was new.
      *   *The Conflict:* Individualism says "reward merit/contract." Relationalism says "honor the constitutive relationship that made your current role possible."

  3.  **Drafting the Scenario (One Paragraph):**
      *   Elena manages a logistics team. Candidate A (Marcus) has the highest efficiency scores and a fresh MBA. Candidate B (Sarah) has decent scores but has been with the firm 20 years.
      *   *The Twist:* Five years ago, when Elena was junior, she made a major error. Sarah quietly fixed it using her own accrued leave and reputation capital, never documenting it, effectively enabling Elena's rise to management. There's no record.
      *   *The Decision:* Promoting Marcus is efficient and "fair" by HR metrics. Promoting Sarah acknowledges the debt that constitutes Elena's current standing.
      *   *Drafting:* Elena, a department head at a logistics firm, must choose between Marcus, a high-performing outsider with optimal metrics and no internal baggage, and Sarah, a veteran employee whose recent productivity is adequate but unexceptional. On paper, Marcus is the meritocratic choice, aligning with standard HR evaluations and contractual obligations. However, five years prior, when Elena was a junior analyst on the verge of firing, Sarah silently absorbed a catastrophic accounting error Elena made, sacrificing her own bonus and reputation to shield Elena, an act never recorded in any formal file. This informal rescue enabled Elena's current position, creating a debt that exists outside the organizational chart but within the lived history of their roles.

  4.  **Developing the Analysis:**
      *   *Individualist Reasoning:* Self is prior. Obligations arise from consent/contract. Elena's duty is to the firm's efficiency and fair competition. The past error is sunk cost. Sarah's help was a gift/voluntary, not a contract. Promoting Marcus maximizes utility and respects procedural justice.
      *   *Relational Reasoning:* Self is constituted by roles. Elena *is* a manager partly *because* Sarah acted. To deny Sarah is to deny the ground of Elena's own existence in this role. It fractures the *ren* (benevolence/humaneness) or *yi* (righteousness/fittingness). The "interstitial obligation" is the unrecorded reciprocity.
      *   *Structural Feature:* "Non-contractual temporal reciprocity." The debt isn't static; it's woven into the timeline of their identities.
      *   *What Collapses:* If you remove this, the relational view collapses into transactionalism. The "web of roles" becomes just a network of contracts. Trust evaporates because informal safeguards are no longer honored.
