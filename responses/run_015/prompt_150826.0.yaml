      *   *The "Interstitial Obligation":* This needs to be key. It's not in the contract. It's about *reciprocity over time*. Maybe B covered for Elena during a crisis years ago, informal but crucial. Or B holds the team cohesion together in a way not measured by KPIs.
      *   *Refining the Obligation:* The prompt suggests "non-contractual temporal reciprocity." Let's make it about a specific debt incurred during a vulnerable moment. Elena was promoted to manager because B stepped back or covered a mistake informally. Now B is up for promotion.
