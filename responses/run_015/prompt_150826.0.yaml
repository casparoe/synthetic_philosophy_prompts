prompt: |-
  Hey — need a thought experiment for my grad seminar on individualism vs. relational ethics. You’re playing a social philosopher who knows both analytic metaphysics and East Asian ethics; think carefully and do a quick brainstorm before writing.

  Design a realistic one-paragraph workplace case — no trolleys, no sci-fi — engineered so liberal individualism (self is ontologically prior, obligations need consent) pushes a manager to promote Candidate A, while a Confucian-style relational view (self constituted by roles and reciprocal obligations) pushes her to promote Candidate B. The catch: Candidate A should look like the clearly fairer pick at first glance, but the relational reasoning should uncover a hidden "interstitial obligation" — an obligation that exists only in the gap between formal job descriptions — that makes promoting B the only move that doesn't fracture the web of roles that actually constitutes the manager herself.

  Constraints: one paragraph for the scenario, then walk through both reasonings, name the exact structural feature that forces the split (probably non-contractual temporal reciprocity?), show what collapses if you remove it, and say how a sharp individualist attacks the relational verdict without just saying "collectivism bad." Keep it casual — maybe I mispelled "relevent" above — and don't ask for bibliographies or quote real texts; I want students reasoning from scratch.
