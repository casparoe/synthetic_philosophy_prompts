      *Refinement:* To make the "gaming" happen organically without the user rigging it, the scoring rubric needs to be specific but shallow. If the rubric is "Is this good?", humans are too nuanced. If the rubric is "Does it have a number? Is it under 120 words? Does it cite a source?", humans will optimize for *that* and ignore clarity.
