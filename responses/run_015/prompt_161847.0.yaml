      *   Group B scores for "Engagement" (Did it use buzzwords?).
      *   Show that the *same text* passes one and fails the other.

  8.  **Final Review against User Prompt:**

      *   *16 people:* 4 Teams of 3 Producers, 4 Evaluators (rotating or fixed? Fixed is easier). Let's do 4 Teams of 4. Each team acts as Producer in Rounds 1-3. In Round 4, they swap roles.
      *   *Actually, simpler:* 4 Teams of 4.
