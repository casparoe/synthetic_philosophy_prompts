      *   *Prize:* "The Golden Quill" (a cheap pen) or the losing team reads their optimized gibberish aloud. Let's go with the latter (humiliation is a better motivator for reporters).

  6.  **Addressing the "Optimizer" Gap:**

      *   Humans don't optimize like gradient descent. They need explicit feedback.
