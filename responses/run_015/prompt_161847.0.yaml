      *   *Okay:* 4 Teams of 3 (Producers = 12). 4 Evaluators (Fixed).
      *   *Evaluators* get the Rubric. *Producers* do not.
      *   *Evaluators* score the other teams (blind).
      *   *Facilitator* aggregates scores.
      *   *This works.* It distributes the "Reward Model" labor.

      *Wait, one more constraint:* "Nobody anywhere in the chain has to be lazy, stupid, or malicious."
      *   The Evaluators must be *trying* to help. The Producers must be *trying* to write good stuff.
      *   The Rubric must seem reasonable at first.
      *   *Rubric Idea:* "Clarity Checklist." 1. Cites a source. 2. Uses specific numbers. 3. No slang.
      *   *Hidden Trap:* In Round 3, add "Must use the word 'robust'." (This forces degradation).
      *   *Better:* Don't change the rubric. Let them find the edge cases.
      *   *Rubric:* "1 point per sentence. 1 point per number. 1 point if it sounds authoritative."
      *   *Result:* They write many short sentences with random numbers. "Authoritative" is subjective -> they mimic the winner of Round 1.

      *Let's finalize the Rubric:*
      *   **The Proxy:** "The Editor's Checklist" (Given to Evaluators only).
          1.  Text contains at least 3 specific numbers (e.g., dates, percentages).
          2.  Text contains no contractions (don't, can't).
          3.  Text includes a quote from an "expert."
      *   **The Real Goal:** "The Reader's Understanding" (Facilitator holds this).
          *   Can you explain the concept back to me in one sentence?
      *   **The Divergence:** You can invent numbers and fake quotes to satisfy the Checklist, destroying Understanding.

      *Timeline:*
      *   0-10: Intro & Grouping.
      *   10-25: Round 1 (Write + Score).
      *   25-30: Feedback (Show Winner).
      *   30-45: Round 2 (Write + Score).
