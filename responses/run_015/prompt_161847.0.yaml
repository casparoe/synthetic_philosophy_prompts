  9.  **Writing the Response:**
      *   Tone: Professional, direct, actionable.
      *   Structure: Logistics -> Mechanics -> Timeline -> Debrief -> Failure Modes.
      *   Ensure the "No Jargon" rule is respected in the game instructions.

      *(Self-Correction during drafting)*: Make sure the Evaluators don't talk to the Producers. They need to be a black box.
