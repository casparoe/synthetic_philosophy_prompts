answer: |-
  **Project Title:** Diagnosing the Trap: Choice vs. Selection in Competitive Escalation

  **The Question**
  When a group gets stuck in a destructive competitive spiral (a "race to the bottom"), is the mechanism driven by *choice* (players actively escalating because it pays) or *selection* (players who don't escalate get filtered out)? And does misdiagnosing a selection trap as a choice trap cause well-intentioned interventions to fail?

  I want to produce a determinate answer to this in six months: a validated typology that tells a practitioner which of the three mechanisms is driving their specific hellscape, and which intervention set follows.

  **Why the Standard Framing Fails**
  Right now, we lump everything under "multipolar traps" or "Moloch." The implicit model is almost always a Prisoner's Dilemma: everyone would prefer to stop, but individual incentives drive escalation. The prescribed solution is coordination: norms, treaties, regulation.

  But look at the hiring committees I sit on. Candidates aren't choosing to use LLMs because they love it; they are choosing it because the candidates who don't use them don't get interviews. That isn't a coordination failure; it's an evolutionary filter. If you coordinate a norm against LLMs without changing the selection environment (e.g., blind work samples), the norm-breakers survive and the norm-keepers die out.

  Furthermore, the standard framing assumes "everyone would prefer to stop." Often, they wouldn't. In the ad auctions my partner deals with, or the test-prep industry surrounding admissions, there are intermediaries profiting from the escalation. If the surplus is being extracted by a platform, coordination among the victims won't fix it; you need to change the revenue model.

  Treating selection pressures as coordination problems is why so many "ethical AI" or "fair hiring" initiatives stall. They ask people to volunteer for disadvantage. This project argues that until we distinguish the mechanism, we are just guessing at solutions.

  **The Method (25 Days of Work)**
  I am budgeting roughly 25 full days over six months. This is not enough for original empirical data collection, so the method is comparative case analysis using existing documentation and my own observational data from the hiring committees and bakery context.

  *   **Days 1–5: Framework Definition.** I will rigorously define the three categories:
      1.  *Choice Traps:* Escalation is opt-in and beneficial to the escalator (classic Prisoner's Dilemma).
      2.  *Selection Traps:* Escalation is required for survival; non-escalators are removed from the pool.
      3.  *Extraction Traps:* Escalation generates surplus for a third party (platform/vendor), making the "everyone wants to stop" premise false.
  *   **Days 6–15: Case Studies.** I will apply this framework to three specific scenarios:
      1.  *LLM Hiring:* (My direct experience). Is this selection or choice? Who profits?
      2.  *Local Ad Auctions:* (Bakery data). Is the bid inflation driven by algorithmic selection or vendor pricing models?
      3.  *Academic Metrics:* (Public data). Citation chasing. Is this researchers choosing to game, or journals selecting for gamable metrics?
      *Comparison Point:* For each, I will map where the current "standard" interventions are failing and match that failure to the misdiagnosis (e.g., trying to coordinate norms in a selection environment).
  *   **Days 16–20: Building the Diagnostic.** I will convert the framework into a decision tree. It needs to be usable by a hiring manager or a board member. Questions like: "If you stop escalating, do you lose market share immediately, or do you lose profit margin?" "Is there a vendor whose revenue grows with the intensity of the race?"
  *   **Days 21–25: Write-up and Stress Test.** I will draft the final report and share the diagnostic with three peers currently in hiring or procurement roles to see if it clarifies their situation.

  **The Deliverable**
  Not just a paper. I am building a **Trap Diagnostic Protocol**.
  This will be a short document (5–10 pages) containing:
  1.  The typology (Choice vs. Selection vs. Extraction).
  2.  A flowchart/quiz to classify a current conflict.
  3.  A menu of interventions matched to the diagnosis. (e.g., If Selection: Change the selection criteria, not the norms. If Extraction: Audit the vendor contract, not the user behavior.)

  The goal is something a hiring committee chair can bring to a meeting to stop the "can't we all just agree" hand-waving and point to the structural mechanic actually driving the behavior.

  **Failure Conditions**
  I need to be honest about where this could flop.
  1.  **The Blur:** It turns out Choice and Selection are too entangled to separate cleanly. If every Selection trap has a Choice component, the typology might be theoretically neat but practically useless.
  2.  **No New Interventions:** The diagnostic correctly identifies the trap, but the prescribed intervention is still "good luck." If I can't suggest a viable lever for the Selection category (which is historically the hardest to fix), the tool is just a complaint generator.
  3.  **Scope Creep:** 25 days is tight. If I try to interview people or gather original data on ad auctions, I will not finish.

  **Scope Check**
  Is this too big for one day a week?
  Yes, if I try to prove the theory true. No, if I treat this as building a *prototype* diagnostic.
  To make this fit: I am limiting the case studies to *analysis of existing narratives* and my own direct observation. I am not surveying candidates or auditing ad platforms. I am testing whether the *lens* provides clarity, not whether I can solve the traps themselves in six months.
  If the framework proves too complex, I will collapse Extraction into Selection (since extraction often drives selection) to ensure the final diagnostic is binary and actionable: "Can you coordinate your way out? Yes/No."

  **Why This Matters**
  We are entering a period of intense automation-driven escalation. If we keep treating selection pressures as coordination problems, we will burn out trying to enforce norms that the environment punishes. I want to build the tool that tells us when to stop negotiating and start changing the rules of survival.
