answer: |-
  This is a classic problem in political ethics: the tension between **Universalism** (rules apply to everyone equally) and **Particularism** (obligations depend on relationships).

  You are not just sneaking in Western norms, but you are grappling with the definition of "Public." In the West, the "Public" is an abstract collection of citizens. In many traditional societies, the "Public" is a concrete network of kin.

  Here is the principle that reconciles your intuitions, the trade-off required for simplicity, and the verdict on the NGO case.

  ### 1. The Unifying Principle: "Fiduciary Breach of the Mandate"

  The principle that saves all five of your verdicts is not about *what* is done (hiring kin, giving gifts), but **whose trust is being betrayed.**

  **Corruption is the subversion of a role's defined mandate for unauthorized benefit.**

  The key is that the "Mandate" changes depending on the Social Contract in operation:

  *   **Brazil (Mayor):** The mandate of a modern city mayor is **Impartial Administration**. The resources belong to the abstract citizenry. Hiring a cousin bypasses the meritocratic filter required by that mandate. **Verdict: Corrupt.** (Betrayal of the State Contract).
  *   **US (Senator):** The mandate is **Representation of the Public Interest**. Using policy to secure private board seats for family subverts the voter's trust. **Verdict: Corrupt.** (Betrayal of the Democratic Contract).
  *   **Lagos (Clerk):** The mandate is **Equal Application of Law**. A passport stamp is a right, not a commodity. Selling it creates a two-tier system. **Verdict: Corrupt.** (Betrayal of the Legal Contract).
  *   **Japan (Bureaucrat):** The mandate includes **Social Harmony and Relationship Maintenance**. If the gifts are documented, expected, and within cultural bounds, they are viewed as "lubricant" for the system, not a subversion of the decision (the bid was already approved). **Verdict: Not Corrupt.** (Fulfillment of the Relational Contract).
  *   **Pacific Island (Clan Leader):** The mandate is **Kin Custodianship**. In this context, leadership legitimacy comes from taking care of *your* people first. Distributing aid to the clan fulfills the leader's primary obligation to their specific constituency. **Verdict: Not Corrupt.** (Fulfillment of the Communal Contract).

  **The Difference between Brazil and Pacific:**
  In Brazil, the Mayor is an agent of the **State** (Impartial). In the Pacific case, the distributor is an agent of the **Clan** (Partial). You are judging the Brazil case by the rules of a Bureaucracy, and the Pacific case by the rules of a Tribe. Both are consistent within their own logic.

  ### 2. Are You Sneaking in Western Norms?

  Yes and no.
  *   **Yes:** Your intuition that the Brazil and US cases are corrupt relies on the Weberian ideal of a bureaucracy (rules > relationships). This is a Western export.
  *   **No:** Your intuition that the Pacific case is *not* corrupt acknowledges that legitimacy is local. You are effectively saying, "Corruption is defined by the community granting the power."

  However, there is a trap. If you accept the Pacific verdict (Kin Priority = Good), you undermine the Brazil verdict (Kin Priority = Bad) *if* the Brazilian mayor claims his "constituency" is just his family. The distinction rests on whether the office is **Public** (funded by/tied to all) or **Communal** (funded by/tied to kin).

  ### 3. Which Verdict to Drop for Simplicity?

  If you want a single, simple, universal rule, **you must drop the Pacific Island verdict.**

  **The Simplified Principle:** **Public Impartiality.**
  *   *Rule:* Any use of public resources for private/kin benefit is corruption.
  *   *Result:* Brazil, US, Lagos, and Pacific are all **Corrupt**. Japan is **Borderline/Corrupt** (depending on value).
  *   *Why drop it?* This is the standard used by international law (UNCAC), the World Bank, and most NGOs. It is the only principle that scales to a globalized economy.

  **Why you might resist dropping it:**
  Because calling the Pacific case "corrupt" feels like moral imperialism. It ignores that in that society, the "safety net" *is* the clan. Withholding aid from kin to give to strangers might be seen as *immoral* there.

  **Recommendation:** Keep the nuance. Adopt a **Two-Tier Definition**:
  1.  **Legal Corruption:** Violation of state law (Brazil, Pacific, Lagos).
  2.  **Social Corruption:** Violation of local trust (Brazil, Lagos, US = Yes; Pacific, Japan = No).
  *Your gut is tracking Social Corruption.*

  ### 4. The NGO Case: The Verdict

  **Case:** Western NGO pays facilitation fees to customs officials for medical supplies. Locals say it's the "price of doing business."

  **Applying the "Fiduciary Breach" Principle:**
  *   **The Official's Mandate:** They are a State Bureaucrat. Their mandate is Impartiality (Law). Taking a fee subverts this.
  *   **The NGO's Mandate:** Their mandate is Humanitarian Aid (Saving Lives).
  *   **The Conflict:** The NGO is operating in a **State System** (Customs) but facing a **Local Norm** (Dash).

  **The Verdict:** **It is Corrupt, but Ethically Justified.**

  Here is why you should classify it as **Corrupt**:
  1.  **It aligns with Lagos, not Pacific.** In the Pacific case, the kin obligation *is* the system. In the Customs case, the fee is a parasite on the system. The Customs officer is betraying their State Mandate (like the Lagos clerk), even if the local culture accepts it.
  2.  **It sustains the breach.** Paying the fee validates the corruption for the next person who *doesn't* have life-saving supplies.
  3.  **The "Locals Say" Trap.** In the Lagos case, locals likely say "that's just how it is" too. Popular acceptance does not negate fiduciary breach.

  **The Nuance:**
  While it is a **Corrupt Act** (bribery), it may be the **Ethical Choice** (utilitarian).
  *   If you don't pay: Supplies rot, people die. (Adherence to principle, failure of mission).
  *   If you pay: Supplies move, system degrades. (Failure of principle, success of mission).

  **Final Conclusion:**
  Your gut is consistent. You define corruption as **betraying the specific trust of the role you hold.**
  *   Mayor/Clerk/Senator betray the Public Trust.
  *   Pacific Leader fulfills the Kin Trust.
  *   **NGO:** By paying, you are complicit in the Customs Officer's betrayal of Public Trust, even if you do it to save lives.

  **To stay consistent with your Brazil/Lagos verdicts, you must call the NGO payment Corrupt.** You can argue it was *necessary*, but calling it "not corruption" breaks your own principle that Public Office (Customs) cannot be sold. The Pacific case is different because the "Office" itself is defined by Kinship, not State Law. Customs is State Law.

  **Summary:**
  1.  **Principle:** Corruption = Breach of the specific Fiduciary Mandate (State vs. Kin).
  2.  **Simplicity:** Drop the Pacific exception if you want a Universal Rule (Impartiality).
  3.  **NGO:** It is Corruption (State Mandate breached), but potentially a Justified Violation (Humanitarian Necessity). Do not confuse "Justified" with "Not Corrupt."
