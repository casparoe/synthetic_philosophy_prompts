          4.  Conclusion: Verdict on the claim.
      *   *Word Count Check:* Must be careful not to exceed 800 or go under 600.
      *   *Tone:* Academic, analytical, neutral but critical.

  7.  **Refining the Content:**
      *   *Table:* Keep it tight.
      *   *Prose:* Ensure I explicitly answer the prompt's questions (which paradigm, chain rule, objective function, stationary data, verdict).
      *   *Flagging Obscurity:* Point out where "loss function" hides the political/ethical problem of valuation.

  8.  **Drafting - Step-by-Step:**

