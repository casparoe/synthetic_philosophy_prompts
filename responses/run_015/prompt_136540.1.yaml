      The colleague's analogy is seductive but category-confused. Technically, the Lange mechanism resembles **zeroth-order optimization** or **model-free reinforcement learning**, not supervised learning. There are no labeled "correct prices" (supervision); instead, the board queries the environment via price announcements and observes scalar feedback (excess demand). The "learning rate" corresponds to the speed of price adjustment specified in Lange's accounting rule. However, the **credit assignment** problem is fatal. In backpropagation, the chain rule distributes error gradients through known architectural weights to update specific parameters. In a planned economy, the "architecture" (input-output coefficients) is precisely what is unknown or shifting. Without market prices to encode relative scarcity, the board cannot distinguish whether a shortage in steel stems from inefficiency in mining, overconsumption in automaking, or a technological shift. The gradient is noisy, and the chain rule is broken.

