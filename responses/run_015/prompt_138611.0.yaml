answer: |-
  # Adversarial Collaboration Draft: Predictive Processing vs. Enactive Dynamics

  ## 1. Agreed Claims

  *Note: Tags indicate the scope of agreement. [Field Consensus] = widely accepted across computational neuroscience and cognitive science. [Local Pact] = specific to this collaboration; others might dispute. [Contested/Unsettled] = we agree this is the current state of play, but the fact itself is debated.*

  *Mediator Confidence: High on distinctions, Moderate on empirical summaries.*

  1.  **Distinction of Levels:** We distinguish three layers: (a) the **Free-Energy Principle (FEP)** as a mathematical description of self-organizing systems; (b) **Predictive Processing (PP)** as a specific cognitive architecture using generative models; and (c) **Predictive Coding (PC)** as a specific neural implementation involving distinct prediction and error units. **[Field Consensus]** *(Mediator Confidence: High)*
  2.  **Scope of FEP:** The FEP, in its general form, applies to any system maintaining a non-equilibrium steady state via a Markov blanket. It does not, by itself, imply the system has a brain, a mind, or a generative model in the cognitive sense. **[Field Consensus]** *(Mediator Confidence: High)*
  3.  **Empirical Status of PC:** There is currently no definitive experimental evidence confirming that specific cortical layers exclusively carry predictions versus error signals in the manner required by canonical Predictive Coding models. **[Field Consensus]** *(Mediator Confidence: High)*
  4.  **Coupling:** Both sides agree that agent and environment are causally coupled and that the organism must maintain its structural integrity against entropy to persist. **[Local Pact]** *(Mediator Confidence: High)*
  5.  **Predictive Effects:** The experimental record robustly shows that prior expectations influence perception and action (e.g., placebo effects, sensory attenuation). The dispute is over the *mechanism* generating these effects, not the effects themselves. **[Local Pact]** *(Mediator Confidence: Moderate)*
  6.  **Instrumentalism Definition:** We agree on the definition of "Update-Rule Instrumentalism": the stance that the generative model and free-energy bound are merely compact mathematical descriptions of the system's dynamics, without implying the system physically contains or computes them. **[Local Pact]** *(Mediator Confidence: High)*
  7.  **Unsettled Ontology:** We agree that the ontological status of the "generative model" (real mechanism vs. descriptive tool) is the primary unresolved theoretical issue. **[Contested/Unsettled]** *(Mediator Confidence: High)*

  ## 2. Table of Remaining Disagreements

  | Domain | Predictive Processing (PEM) Formulation | Enactive/Ecological (EEDS) Formulation |
  | :--- | :--- | :--- |
  | **The "Model"** | The brain implements an internal generative model that mirrors causal structure in the world. | The brain participates in a dynamical loop; positing an internal "model" adds no explanatory power and mislocates the agency. |
  | **Dark Room Problem** | **Objection:** If minimizing surprise, why not seek a dark, silent room?<br>**Reply:** Organisms have prior preferences for homeostatic states (e.g., glucose levels) that require active engagement. High expected uncertainty in a dark room violates these priors.<br>**Status:** Necessary theoretical component. | **Objection:** The "prior preferences" are tuned post-hoc to ensure the organism doesn't sit in a dark room.<br>**Reply:** This is an ad hoc rescue. You are defining the system's survival as a "preference" to save the math, rather than explaining why it survives.<br>**Status:** Theoretically suspicious. |
  | **Triviality / Universality** | **Claim:** FEP applies to all self-organizing systems.<br>**Reply to Convection Cell:** A convection cell minimizes free energy but lacks *preferences* over outcomes. It minimizes surprise passively; brains minimize it actively via inference.<br>**Status:** Distinction between passive and active inference saves the theory. | **Claim:** If FEP applies to everything, it explains nothing specific about cognition.<br>**Reply to Convection Cell:** If a convection cell satisfies the formalism, then "minimizing free energy" is just a synonym for "persisting." It tells us nothing about *how* the brain works.<br>**Status:** The theory is either trivial or false. |
  | **Update-Rule Instrumentalism** | **Stance:** If the model is just a description and not a mechanism, the theory becomes unfalsifiable. Any dynamics can be retrofitted with a model.<br>**Debate End?** **No.** This relocates the fight to: "Can we find evidence that the model is *physically implemented*?" | **Stance:** If the model is just a description, the theory is trivial. It claims everything is inference, so nothing is.<br>**Debate End?** **No.** This relocates the fight to: "Why use mentalistic vocabulary (inference, belief) for non-mental dynamics?" |
  | **Representation** | **Claim:** Neural states carry content about distal causes; they are representational vehicles. | **Claim:** Neural states are mediators of coupling; they do not "stand for" anything external. |

  ## 3. Crux Table: Pre-Registered Predictions

  | Crux | Conceded Evidence / Test Case | PEM Prediction | EEDS Prediction |
  | :--- | :--- | :--- | :--- |
  | **Neural Decoding** | **Case:** High-resolution recording from cortical microcircuits during perceptual bistability.<br>**Test:** Can we decode specific "prediction error" signals distinct from "state estimate" signals? | **Prediction:** Distinct neuronal populations will encode errors vs. estimates. Disrupting "error" units will alter learning but not immediate performance. | **Prediction:** Signals will be distributed and context-dependent. Disrupting putative "error" units will shift the system's dynamical attractor, not isolate a specific signal. |
  | **Non-Neural FEP** | **Case:** Slime mold (*Physarum*) solving a maze or convection cell stability.<br>**Test:** Does the system minimize variational free energy *better* than it minimizes other Lyapunov functions? | **Prediction:** FEP will provide a tighter, more normative bound on the system's trajectory than generic dynamical descriptions. | **Prediction:** FEP will fit the data no better than standard dynamical systems models, but with more free parameters. |
  | **Timescales** | **Case:** Rapid sensorimotor adaptation (e.g., catching a ball).<br>**Test:** Does the adjustment require synaptic weight changes (learning) or purely dynamic state changes (inference)? | **Prediction:** Fast adaptation is inference (changing posterior states); slow adaptation is learning (changing model parameters). These are dissociable. | **Prediction:** Fast and slow adaptation are the same process operating at different timescales of the same dynamical landscape; no strict dissociation exists. |
  | **Instrumentalism Test** | **Case:** Lesion studies targeting "model" areas.<br>**Test:** If the model is merely descriptive, damaging the "model" substrate should look like changing the dynamics, not deleting a file. | **Prediction:** Damage will look like losing specific *content* (e.g., inability to predict specific trajectories), not just general instability. | **Prediction:** Damage will look like a loss of stability or degrees of freedom, not a loss of specific informational content. |

  ***

  *Mediator Note on Confidence:* I am highly confident that Section 1 accurately reflects the logical space. I am moderately confident that Section 2 captures the rhetorical stalemate without caricature. I am less confident that Section 3's tests are technically feasible in their ideal forms, but they represent the correct *logical* tests. Regarding the Instrumentalism debate: I suspect this is where the actual philosophical rupture lies, rather than in the empirical data.

  \answer{Is the generative model a mechanism or a description?}
