answer: |-
  **Essay Question: The Epistemic Limits of Historical Causal Inference**

  **Prompt:**
  Consider the following constructed micro-case: Two adjacent territories, Alpha and Beta, are divided only by a river boundary fixed in 1890 by an external colonial administration. Prior to this line, there was no meaningful economic, linguistic, or ethnic separation; both territories share identical tropical climate, malaria ecology, soil suitability for the same primary crops, and equal access to a shared coastal trade corridor. After the boundary was imposed, Alpha received an institutional framework of registered individual land titles, local contract-enforcement courts, and representative local taxation, while Beta received an extractive framework of communal labor quotas, coerced export-crop production, and absentee bureaucratic administration. By 1970, Alpha's per-capita income was roughly three times Beta's.

  Write an essay assessing whether this divergence can be causally attributed to institutions. Your answer must not merely summarize institutionalist theory but must wrestle with the epistemic limits of causal inference from non-experimental history. Specifically, you must address the following five analytical obstacles:

  1.  **Endogenous Institutional Selection:** Analyze why the colonial power assigned different regimes and whether that selection correlates with unobserved pre-existing conditions.
  2.  **Hidden Pre-Colonial Heterogeneity:** Evaluate the possibility of hidden differences in social capital, literacy, or human capital that might have influenced both regime assignment and subsequent development.
  3.  **Post-Boundary Contamination:** Address post-independence selective migration, capital flight, and cross-river labor mobility that contaminate any comparison of national outcomes.
  4.  **Econometric Identification:** Assess whether synthetic-control or difference-in-differences techniques can salvage identification when treatment assignment is strategic rather than random and the units are geographically and economically interdependent.
  5.  **Epistemic Conclusion:** Argue whether the failure of full causal identification forces complete agnosticism, or whether some combination of mechanistic reasoning and abductive inference can still support institutional explanations without claiming that institutions alone caused the divergence.

  ***

  **Model Answer**

  The Alpha/Beta scenario presents itself as an ideal natural experiment, seemingly holding geography and culture constant while varying only institutional treatment. At first glance, the threefold income divergence by 1970 appears to license a strong causal claim: inclusive institutions cause wealth, while extractive institutions cause poverty. However, treating this historical sequence as a solved identification problem ignores the profound epistemic limits inherent in non-experimental social science. To claim causality here requires navigating five specific obstacles that undermine simple counterfactual reasoning.

  First, one must confront endogenous institutional selection. The colonial administration did not assign regimes via a coin flip; the division was strategic. Administrators typically imposed extractive regimes where resistance was anticipated or resource extraction was logistically easier, and inclusive regimes where collaboration reduced governance costs. If Alpha was granted property rights because its local elites were already more commercially oriented or politically compliant, then the institutional treatment is correlated with unobserved pre-existing conditions. The regime type is not an exogenous shock but a response to latent variables. Consequently, the observed income gap may reflect the initial suitability for collaboration rather than the causal effect of the institutions themselves.

  Second, even if the prompt asserts "no meaningful separation" prior to 1890, hidden pre-colonial heterogeneity remains a critical threat. Historical data is rarely granular enough to confirm identical social capital, literacy rates, or trust networks across a river boundary. If Alpha possessed slightly higher levels of human capital or cohesive kinship structures capable of leveraging land titles, these factors would influence both the colonizer's choice of regime and the subsequent economic trajectory. Ignoring this heterogeneity conflates the effect of the institution with the effect of the underlying social substrate that made the institution viable. The institutional framework may be a complement to, rather than the sole driver of, development.

  Third, the stability of the units themselves is compromised by post-boundary contamination. Once the institutional divergence was established, rational actors responded. High-skill labor and capital likely fled Beta for Alpha to escape coerced production and seek contract enforcement. This selective migration means Alpha's 1970 income includes human capital produced in Beta, while Beta's stagnation reflects a brain drain rather than purely institutional failure. Comparing aggregate per-capita income at the endpoint ignores this flow. The treatment effect is contaminated by feedback loops where the outcome (wealth) alters the composition of the treated unit, violating the stable unit treatment value assumption (SUTVA) required for clean causal inference.

  Fourth, standard econometric salvage operations like difference-in-differences (DiD) or synthetic control methods face severe limitations here. DiD relies on the assumption of parallel trends in the absence of treatment. However, if treatment assignment was strategic based on anticipated growth potential, the parallel trends assumption is false by definition. Similarly, synthetic control requires a donor pool unaffected by the treatment. Because Alpha and Beta share a coastal trade corridor and labor market, they are economically interdependent. Policy shocks in Beta spill over into Alpha via migration and trade prices. When units are interdependent and treatment is non-random, statistical techniques cannot fully purify the estimate of endogeneity. The math may produce a coefficient, but it cannot manufacture exogeneity.

  Finally, does this identification failure force complete agnosticism? Not necessarily. While we cannot claim institutions *alone* caused the divergence with statistical certainty, we can employ abductive inference. We ask: what is the best available explanation given the constraints? Geography is held constant by the design of the case. Culture is initially similar. While selection bias and migration complicate the picture, the mechanistic link between contract enforcement and investment remains theoretically robust. We can argue that institutions belong to the best available explanation, provided we qualify the claim. The argument shifts from "institutions caused the gap" to "institutions are a necessary component of the causal chain, operating alongside unobserved heterogeneity and migration dynamics." This modest claim avoids institutional determinism while rejecting total skepticism. It acknowledges that historical evidence licenses probabilistic, mechanism-based explanations rather than definitive causal proofs. The Alpha/Beta case thus serves not as proof of institutionalism, but as a stress-test demonstrating that historical causal claims require humility regarding identification limits.

  ***

  **Marking Scheme (25 Points Total)**

  | **Analytical Move** | **Points** | **Typical Failure Mode** |
  | :--- | :---: | :--- |
  | **1. Endogenous Selection:** Explicitly argues that colonial regime assignment was strategic (non-random) and likely correlated with unobserved pre-existing conditions (e.g., ease of control), undermining exogeneity. | 5 | Treating the river boundary as an exogenous random assignment without discussing selection into treatment. |
  | **2. Pre-Colonial Heterogeneity:** Identifies that "identical" pre-1890 conditions are an assumption that may hide differences in social capital or human capital which drove both regime choice and outcomes. | 5 | Conflating correlation with causation by citing income divergence alone without probing initial hidden differences. |
  | **3. Post-Boundary Contamination:** Analyzes how selective migration and capital flight from Beta to Alpha contaminate the outcome measure, violating the stability of the comparative units. | 5 | Ignoring post-boundary migration and interaction effects that alter the composition of the territories. |
  | **4. Econometric Limits:** Explains why DiD or synthetic control fails here due to violated assumptions (parallel trends, non-interference) caused by strategic assignment and economic interdependence. | 5 | Applying econometric jargon without explaining why independence and random-assignment assumptions fail here. |
  | **5. Epistemic Conclusion:** Argues for a modest abductive inference (institutions as part of the best explanation) rather than claiming unqualified determinism or retreating into total skepticism. | 5 | Concluding either with unqualified institutional determinism or with total skepticism that refuses any inferential purchase. |
