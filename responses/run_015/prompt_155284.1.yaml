answer: |-
  First off, hang in there. 2 AM writing with cold coffee is a specific kind of torture, but it's also where the best ideas often hide. Your character sounds fascinating—a Braudelian purist in a world that loves "Great Man" history.

  Here is the breakdown of the logic she is using, how to classify your stuck points, and a "splitter" case to create conflict in your narrative.

  ### 1. The Actual Rule She Is Using
  Based on her four classifications, her heuristic isn't just about *time* (though that's part of it). It is about **Agency vs. Impersonal Force.**

  *   **The Rule:** *If the outcome was driven by a specific, conscious human decision that could have been made differently in a short window, it is an **Event**. If the outcome was driven by environmental forces, biological imperatives, or unconscious cultural drift that humans rode rather than steered, it is a **Structure**.*

  **Why her four calls fit this rule:**
  1.  **Rome (Structure):** No emperor *decided* the soil would deplete. It was an environmental constraint humans reacted to.
  2.  **Constantinople (Event):** Mehmet II *decided* to besiege the walls. A specific order, a specific day. Contingent.
  3.  **Maize (Structure):** No single person decided Europe would eat corn. It was a slow biological/cultural osmosis.
  4.  **Napoleon (Event):** This is the key. Even though winter (climate/structure) defeated him, she classifies it as an Event because **Napoleon chose to invade.** The *cause* was human hubris/decision, not the climate itself. The climate was just the terrain.

  ### 2. Solving Your Stuck Points

  **The 1815 Tambora Eruption**
  *   **Her Verdict:** **Structure.**
  *   **Why:** Even though an eruption is a sudden "bang," it is non-human agency. Humans did not choose it, could not prevent it, and had to structurally adapt to the "Year Without a Summer." It fits the Rome (climate) classification. It imposes a reality on history rather than being a product of history.
  *   *Nuance:* She might argue the *famine* that followed was a **Conjuncture** (Braudel's middle layer of economic cycles), but in her binary worldview, it leans Structure.

  **The Printing Press**
  *   **Her Verdict:** **Structure.**
  *   **Why:** This matches the Maize example. While Gutenberg is a "Great Man," the *impact* wasn't the invention day; it was the centuries of slow literacy spread, the shift in religious mentality, and the standardization of language. The invention is the spark, but the fire is structural. If she called this an Event, she'd have to call Maize an Event (someone planted the first seed).

  **The Invented Valley (House Orientation)**
  *   **Her Verdict:** **Ultimate Structure (*Longue Durée*).**
  *   **Why:** This is the perfect example of what Braudel called **"Mentalities."** It is history without events. There is no leader, no decree, no battle. It is an unconscious cultural drift. If she finds this valley, she will weep with joy. It proves her thesis that humans move like tectonic plates, not chess pieces.

  ### 3. Alternative Rules That Also Fit
  If you want her to debate herself or another character, here are two other rules that fit her original four data points but might change the verdict on the new ones:

  *   **Rule B: Reversibility.**
      *   *Logic:* Can you undo it quickly?
      *   *Event:* You can lift a siege (Constantinople could have held). Napoleon could turn back (but didn't).
      *   *Structure:* You cannot un-deplete Roman soil. You cannot un-spread Maize. You cannot un-rotate the Valley houses (tradition is set).
      *   *Conflict:* Tambora is hard to reverse (Structure), but the Printing Press could theoretically be suppressed (Event?).

  *   **Rule C: Visibility of the Actor.**
      *   *Logic:* Can you point to a name?
      *   *Event:* Mehmet II, Napoleon.
      *   *Structure:* "The Climate," "The Peasantry," "The Soil."
      *   *Conflict:* Gutenberg has a name, but the Printing Press impact is nameless. This rule might make her hesitate on the Press.

  ### 4. The "Splitter" Case (To Create Conflict)
  You need a case that breaks her system or forces her to reveal her bias. The best candidate is **The Black Death (1347–1351).**

  *   **Why it splits them:**
      *   **Argument for Structure:** It is biological/environmental (like Rome/Tambora). It changed labor markets, feudalism, and religion over decades. No human caused it.
      *   **Argument for Event:** It has specific arrival dates in specific cities. Human responses (quarantines, pogroms against Jews) were immediate, conscious decisions that altered the outcome locally.
  *   **How it tests her:** If she calls it a Structure, she devalues the human suffering/choice. If she calls it an Event, she admits biology can be an "event."
  *   **Better Splitter for your Valley:** **The Enclosure Acts (UK, 18th Century).**
      *   These were laws (Political/Event) passed by Parliament (Individuals) that privatized common land.
      *   *But:* They created a structural shift in agriculture and population that lasted centuries (Structure).
      *   *The Conflict:* Was the change the *law* (Event) or the *economic pressure* that made the law inevitable (Structure)?

  ### 5. A Note on Braudel for Your Character
  To make her feel authentic, remember that Braudel actually had **three** tiers, not two.
  1.  **Longue Durée:** Geography/Climate (Rome, Valley).
  2.  **Conjunctures:** Economic/Social Cycles (Maize spread, Price revolutions).
  3.  **Événements:** Surface noise (Napoleon, Constantinople).

  Your character seems to be collapsing the middle tier (*Conjunctures*) into Structure. This is a great character flaw. It makes her rigid. She might dismiss the *Conjunctures* (like the Tambora harvest failures) as just "noise" on the structural climate, whereas a Marxist historian would call that an economic cycle.

  **Summary for your notes:**
  *   **Tambora:** Structure (Environmental determinism).
  *   **Printing Press:** Structure (Cultural mentality shift).
  *   **Valley:** Structure (The ideal *Longue Durée*).
  *   **Her Rule:** Conscious Human Intent = Event. Unconscious/Environmental Drift = Structure.
  *   **The Splitter:** The Enclosure Acts (Law vs. Economic Reality).

  Go get some sleep if you can, or at least warm up that coffee. The Valley idea is brilliant—it's exactly the kind of quiet history Braudelians dream about.
