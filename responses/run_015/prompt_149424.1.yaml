  **The One Thought Too Many (But Make It Prosodic)**

  So, I've just joined the funding panel. First meeting. Lukewarm tea, stale biscuits, the usual existential dread.

  We're down to two grants. Identical merit. Impartially speaking, it's a toss-up. The utility is maximised either way.

  Now, you know the Williams objection? The idea that if you save your wife because you've calculated it maximises overall happiness, you've had one thought too many. You should just save her because she's yours. Agent-relative reasons trump the impartial view.

  So I'm staring at these applications. I should just pick the one that aligns with our strategic goals. The ground project. Direct commitment.

  But I catch myself hovering over the rubber stamp. I'm having that extra thought.

  Only, I'm not calculating the greater good.
  I'm counting the syllables in the lead applicant's surname.

  'Bernstein.' Two beats.
  'Thoroughgood.' Three, if you're generous.

  And I realise: I haven't succumbed to cold utilitarianism. I've succumbed to bureaucratic prosody.

  I'm not asking, 'Does this help humanity?' I'm asking, 'Does this fit the iambic rhythm of the approval stamp?'

  Williams worried integrity was lost to calculation. Turns out, it's just lost to counting.
