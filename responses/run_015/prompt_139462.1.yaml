answer: |-
  ### The Time-Structure Diagnostic

  **Instructions:** Answer the following six questions in order. Skip branches that do not apply to you. Your path will terminate at a leaf describing your metaphysical commitment.

  **Node 1: The Inventory**
  Does the total collection of real things ever gain or lose members as time passes, or is the inventory of existence constant?
  *   **It changes (gain/lose):** Go to Node 2.
  *   **It is constant:** Go to Node 5.

  **Node 2: The Ancestor**
  Consider Socrates. Is he currently part of the inventory of real things, even if he is not currently present?
  *   **No, he is entirely absent from reality:** Go to Node 3.
  *   **Yes, he exists timelessly or in the past:** Go to Node 4.

  **Node 3: The Cause**
  When you say last night's wine caused this morning's headache, does the wine exist at the moment the headache occurs?
  *   **No, the cause is strictly non-existent:** Go to Node 5 (Relativity Check).
  *   **Yes, or it exists as an abstract proxy:** (This implies an Ersatz view; terminate at **Leaf A**).

  **Node 4: The Battle**
  Consider tomorrow's sea battle. Is its occurrence already a fixed, determinate part of the inventory of real things?
  *   **No, the future is open/indeterminate:** Go to Node 6.
  *   **Yes, the future is fixed:** Go to Node 6.

  **Node 5: The Slice**
  Is a privileged slicing of spacetime (a specific "now" across the universe) a physical hypothesis, a metaphysical one, or neither (existence is frame-relative)?
  *   **Neither (existence is frame-relative):** Terminate at **Leaf B**.
  *   **Metaphysical or Physical:** Terminate at **Leaf C** (if Inventory Constant) or **Leaf D** (if Inventory Changes/Future Fixed).
  *   **No fact of the matter/Quietist:** Terminate at **Leaf E**.

  **Node 6: The Passage**
  Is the felt passage of time something the world does (an objective moving now) or something we do (consciousness scanning a block)?
  *   **The world does it:** Terminate at **Leaf F** (if Future Open) or **Leaf G** (if Future Fixed).
  *   **We do it:** Terminate at **Leaf H** (if Future Open) or **Leaf I** (if Future Fixed).

  ***

  ### The Leaves

  **Leaf A: Presentism (Standard or Ersatz)**
  Only the present exists. Past claims are made true either by primitive tense facts or by present abstract proxies. The wine does not exist when it causes the headache.
  *(Includes your "Growing Spotlight" if you view the spotlight as merely the present moment of a presentist world, though this usually collapses into standard Presentism.)*

  **Leaf B: Relativized Presentism**
  Existence is not absolute but indexed to an inertial frame. There is no single inventory of what exists simpliciter.

  **Leaf C: Shrinking Block**
  The past has gone out of existence, but the future is already real. (Note: This is the mirror image of the Growing Block).

  **Leaf D: Moving Spotlight (Eternalist Variant)**
  All times exist equally (Inventory Constant), but there is an objective property of "presentness" that moves along the series.
  *(Includes your "Growing Spotlight" if you posit a Growing Block where the leading edge is metaphysically privileged; in this tree, that view collapses here or into Leaf H depending on whether you think the block grows or is static.)*

  **Leaf E: Quietist**
  There is no fact of the matter regarding these ontological disputes. The questions are semantically defective or pragmatically useless.

  **Leaf F: Branching Growing Block**
  The past and present are real and fixed, but the future branches into open possibilities. The world objectively grows and branches.
  *(This is your "Branching Growing Block" invention.)*

  **Leaf G: Growing Block**
  The past and present are real; the future is not. The inventory of existence grows. There is no objective passage, only the accumulation of reality.

  **Leaf H: Branching Future (Static)**
  Spacetime is a static tree of possibilities. All branches are equally real, but there is no objective passage.
  *(Standard Eternalist Branching.)*

  **Leaf I: Static Block**
  Spacetime is a static four-dimensional manifold. Past, present, and future are equally real. Passage is a feature of consciousness, not the world.

  ***

  ### Meta-Analysis of the Diagnostic

  **1. Classificatory Work vs. Decorative Nodes**
  *   **Node 1 (Inventory)** and **Node 2 (Ancestor)** do the heaviest lifting. They separate the dynamic ontologies (Presentism, Growing/Shrinking Block) from the static ones (Eternalism) and distinguish whether the past is retained.
  *   **Node 6 (Passage)** is largely decorative for the static views (distinguishing Moving Spotlight from Static Block), but essential for distinguishing the *phenomenology* of the Growing Block from the Branching Growing Block.
  *   **Node 3 (Cause)** is the weakest classifier. It is intended to separate Hard Presentism from Ersatz Presentism, but in practice, most Presentists answer "No" to the existence of the cause, making the "Abstract proxy" option a nuance within the leaf rather than a branch.

  **2. Indistinguishable Leaves**
  *   **Moving Spotlight (Leaf D) vs. Growing Spotlight:** The flowchart cannot separate these. If the "Growing Spotlight" implies a Growing Block ontology with a privileged edge, it should land in Leaf F or G. If it implies a Static Block with a privileged edge, it lands in Leaf D. The quiz forces a choice on the *growth* of the block (Node 1/2) before asking about the *spotlight* (Node 6). Consequently, "Growing Spotlight" collapses into **Leaf D** (if the block is static) or **Leaf G** (if the block grows but the user denies objective passage).
  *   **Presentism vs. Ersatz (Leaf A):** Node 3 attempts to split these, but since both deny the concrete existence of the past cause, they are grouped in one leaf with an internal distinction.

  **3. Forced Dichotomies**
  *   **Node 4 (The Battle):** Forces a choice between "Open" and "Fixed." This excludes probabilistic views where the future is determinate but stochastic, or views where the future is "settled" but not "real."
  *   **Node 5 (The Slice):** Forces a trichotomy (Physical, Metaphysical, Neither). It excludes views where relativity is false but no privileged slice exists (e.g., neo-Lorentzian without metaphysical privilege).

  **4. Empty Cells (Combinations of Answers)**
  *   **Inventory Constant + Past Not Real:** *Incoherent.* If the inventory is constant and the past is not real, the present must be the only thing that ever exists, which implies Inventory Changes.
  *   **Inventory Changes + Future Fixed + Passage "We do it":** *Unattractive.* This describes a Growing Block where the future exists (contradiction) or a Shrinking Block where we scan the future. Rarely defended.
  *   **Inventory Constant + Future Open:** *Incoherent.* If the inventory of real things is constant, the future entities must already be in the inventory, making them fixed.
  *   **Relativity "Physical" + Inventory Changes:** *Unattractive.* Positing a physical privileged frame usually leads to Static Block (Lorentzian), not Dynamic Ontology.

  **5. Confidence Note**
  I am highly confident that **Leaf I (Static Block)**, **Leaf A (Presentism)**, and **Leaf G (Growing Block)** correspond to genuinely defended, populated positions in the literature.
  I am moderately confident in **Leaf F (Branching Growing Block)** and **Leaf B (Relativized Presentism)**; these are defended but niche.
  I am least sure of **Leaf C (Shrinking Block)**. While logically possible and requested for the tree, it is rarely defended as a serious ontological proposal compared to its Growing counterpart. It feels like a philosophical curiosity rather than a live option.

  **6. Critique of Branch Questions**
  **Node 3 (The Cause)** is the wrong question to ask for its intended purpose. Asking whether the cause *exists* conflates ontology with causation. A Presentist can argue causation relates *tensed* facts without requiring the relata to exist *simpliciter*. A better question would have been: "When 'Socrates existed' is true, is it made true by Socrates himself or by a present property of the world?" This would have cleanly separated Presentism from Ersatz Presentism without invoking causal mechanics which muddy the water.
