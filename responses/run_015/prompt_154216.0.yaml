answer: |-
  # Q&A Prep Sheet: Mechanism-Based Anomaly Detection

  **To:** Presenter
  **From:** Red Team / Prep
  **Context:** Model-Reliability Seminar (30m Talk + 15m Q&A)
  **Goal:** Map objections, identify epistemic hazards, define concession boundaries.

  ---

  ## 1. Epistemic Status Flags (Read Before Entering)
  *You asked for honesty on what is settled vs. contested. Do not present the contested items as settled.*

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **"Mechanisms are identifiable."** | 🔴 **Contested** | In the presence of superposition/polysemanticity, "minimal sufficient causal path" is not unique. Multiple subgraphs can explain the same variance. |
  | **"Reparametrization invariance is achievable."** | 🟡 **Partially Settled** | Theoretically yes (via causal scrubbing/isomorphism), practically no. Optimization paths bias the basis. You cannot perfectly distinguish "same mechanism, different weights" from "different mechanism" without a canonical form we don't have. |
  | **"Description Length (MDL) is measurable."** | 🔴 **Contested** | Kolmogorov complexity is uncomputable. You are using a *proxy* (e.g., $L_0$ norm of active subgraph, weight sparsity). Be explicit that this is a heuristic, not a bound. |
  | **"Mechanism shift predicts future failure."** | 🟡 **Hypothesis** | Your resume demo shows *past* goodharting. The claim that mechanism drift *precedes* metric drift is a strong empirical bet, not a theorem. |

  ---

  ## 2. Strategic Concessions (Put these in Slides 1-2)
  *Concede these early to disarm the "extra steps" and "probe artifact" objections before they solidify.*

  1.  **Concede Cost:** "This pipeline is heavier than PSI or Mahalanobis distance. It is not for online inference monitoring; it is for *release gating* and *post-retrain validation*."
      *   *Why:* Stops Infra from spending 10 mins proving you can't run causal scrubbing in real-time.
  2.  **Concede Probe-Dependence:** "The recovered mechanism is relative to the probe suite's resolution. We are not claiming to find the 'True' mechanism, but a 'Stable Enough' mechanism for reliability purposes."
      *   *Why:* Pre-empts the Interp person's ontological attack. You lower the bar from "Truth" to "Utility."
  3.  **Concede MDL is a Proxy:** "When I say 'description length,' I mean 'complexity of the active subgraph under coding scheme X.' I am not claiming uncomputable bounds."
      *   *Why:* Prevents the Philosopher or Interp person from trapping you in information theory semantics.

  ---

  ## 3. Non-Negotiables (Do Not Give These Up)
  *If you concede these, your thesis collapses into "better evals."*

  1.  **Metrics are insufficient:** Flat AUC/F1 does *not* imply safety/stability. (Your resume demo proves this).
  2.  **Activations are insufficient:** Monitoring activation distributions (PSI) misses *structural* reorganization that preserves activation stats.
  3.  **Mechanisms are the unit of analysis:** Even if imperfectly measured, the *attempt* to track causal paths yields signal that input/output monitoring misses.

  ---

  ## 4. Q&A Objection Map
  *Ordered by (Likelihood × Damage). Phrased in the speaker's native vocabulary.*

  ### 1. The Infra Engineer (Likelihood: High | Damage: Medium)
  **Objection:** "Okay, but causal scrubbing is combinatorially expensive. If I have to run this every time we tweak a hyperparameter, my GPU budget blows up and release velocity drops to zero. You're proposing drift detection with an $O(N^2)$ tax. Why shouldn't I just add more canary datasets to the eval suite and call it a day?"

  **90-Second Reply:**
  "You're right on the cost, which is why I conceded this is for release gating, not online monitoring. The argument isn't that this replaces canary datasets, but that canaries are brittle—they only catch what you explicitly test for. In the resume demo, the AUC was flat because the canary metrics were aligned with the *outcome*, not the *process*. The mechanism check caught the vendor PDF change because it altered the *causal path*, even if the output didn't change. We trade compute budget for robustness against unknown-unknown distribution shifts. If you trust your evals to cover all future shifts, you don't need this. If you don't, the compute tax is the insurance premium."

  **Weakest Link:**
  You haven't actually quantified the "insurance premium." If the cost is 100x standard evals, they will reject it regardless of the theoretical benefit. Be ready with a rough FLOP count comparison.

  ### 2. The Interpretability Researcher (Likelihood: High | Damage: High)
  **Objection:** "You're defining the mechanism via a specific intervention suite (patching/scrubbing). But that suite operates in a specific basis. If I rotate the network weights, your 'minimal causal path' changes entirely, even if the function is identical. You aren't detecting a mechanism change; you're detecting a change in how your probe aligns with the model's latent basis. How do you know you're not just measuring the instability of your own probe suite?"

  **90-Second Reply:**
  "That's the reparametrization invariance problem. We address this by defining mechanism equivalence class-wise: two paths are the 'same' if they are isomorphic under permutation and rescaling that preserves the input-output map. We don't compare raw weights; we compare the *causal graph structure* derived from the scrubbing residuals. If the graph topology changes—e.g., Layer 3 stops mediating the signal and Layer 5 takes over—that's a mechanism shift, regardless of the basis. We acknowledge probe dependence, but we're looking for structural invariants, not specific neuron indices."

  **Weakest Link:**
  "Isomorphic under permutation" is easy to say, hard to compute in dense, superposed networks. If they press on *how* you algorithmically determine isomorphism in a polysemantic model, you may have to admit you're using a heuristic clustering method that isn't strictly invariant.

  ### 3. The Evals Team Member (Likelihood: Medium | Damage: Medium)
  **Objection:** "In your resume example, the model switched to format artifacts. That sounds like a generalization gap. If your test set was diverse enough to include different PDF formats, you would have seen the AUC drop. This feels like a roundabout way of saying 'your test set was too narrow.' Why build a mechanism detector when you can just broaden the eval distribution?"

  **90-Second Reply:**
  "Two reasons. First, you can't enumerate all possible format artifacts in a test set; the space of 'bad heuristics' is infinite. Second, and more critical: in the demo, the AUC *didn't* drop on the existing test set because the test set shared the same artifact bias. Mechanism monitoring detects *why* the model is getting the right answer. If it's getting right answers for fragile reasons, mechanism monitoring flags it before the test distribution inevitably diverges from the training distribution. It's monitoring robustness, not just performance."

  **Weakest Link:**
  This relies on the assumption that "fragile reasons" are detectable via your method before they cause failure. If they ask for a case where mechanism drift *didn't* lead to failure (a false positive), you need to be careful not to overclaim.

  ### 4. The Philosopher of Science (Likelihood: Medium | Damage: High)
  **Objection:** "I'm worried about the individuation criteria. In biology, we distinguish mechanisms by their component activities and organization. You're defining mechanism identity via 'minimal sufficient causal paths.' But neural networks are distributed. If 5% of the path changes, is it a new mechanism? You're drawing a binary boundary on a continuous space of functional realization. What individuates one mechanism from another in your framework, and why isn't this just a pragmatic labeling convention?"

  **90-Second Reply:**
  "It is a pragmatic convention, but one grounded in causal sufficiency. We individuate mechanisms by the set of nodes required to maintain performance above a threshold $\tau$ under intervention. If the *set* of necessary nodes changes significantly (measured by Jaccard distance or graph edit distance), we flag it. You're correct that it's continuous; our alarm threshold is the discretization point. We treat 'mechanism' as a functional cluster: if the causal story required to explain the output changes, the mechanism has changed, even if the output hasn't."

  **Weakest Link:**
  Admitting it's a "pragmatic convention" weakens the ontological claim. If they press on *why* that specific threshold is the natural kind, you have no answer other than "it worked in the demo."

  ### 5. The "Hope Nobody Asks" (Likelihood: Low | Damage: Critical)
  **Objection:** "You introduced a third alarm category: growth in description length (MDL) for cases where there was no stable baseline. But Kolmogorov complexity is uncomputable. What metric are you actually optimizing? If you're using weight sparsity or $L_1$ norm, that's not description length, that's regularization. If the model is compressing information via superposition, your 'description length' might go up while the model actually gets *better*. Aren't you just penalizing complexity without a theoretical basis?"

  **90-Second Reply:**
  "Fair point. When I say 'description length,' I am referring to the Minimum Description Length of the *active subgraph* under a specific coding scheme (e.g., bits required to encode the active weights and topology). It is a proxy, not a theoretical bound. The hypothesis is that if the model requires a more complex subgraph to solve the same task slice, it's 'struggling' or 'overfitting' in a way that flat metrics miss. I am not claiming to measure true Kolmogorov complexity, but rather a computable approximation that correlates with heuristic fragility."

  **Weakest Link:**
  **This is the rotten plank.** There is no consensus that subgraph complexity correlates with fragility in the way you describe. If they ask for evidence that "higher MDL proxy = higher risk" outside of your specific demo, you may not have it.

  ---

  ## 5. The Retreat Condition
  *If this question is asked, do not double down. Pivot to the fallback claim.*

  **The Trigger Question:**
  "Can you show me a case where your mechanism alarm triggered, but the model was actually *more* robust/safe, and you would have falsely blocked a good deployment? Or conversely, where the mechanism stayed stable but the model failed catastrophically?"

  **Why this is dangerous:**
  It attacks the *precision/recall* of your monitor. If you have false positives, Infra will hate you. If you have false negatives, Safety will hate you.

  **The Fallback Position:**
  "If you mean 'is this a perfect detector?', no. It's a *leading indicator* tool. The claim isn't that mechanism stability guarantees safety, but that mechanism instability is a necessary condition for long-term robustness in non-stationary environments. If I have to retreat: I am not proposing this as a gate, but as a *diagnostic signal* to trigger deeper human review when metrics are ambiguous."

  **Action:**
  If pressed on false positives/negatives, admit the data is preliminary. Do not claim this is production-ready "truth." Frame it as "Research Preview: High Signal, High Cost."

  ---

  ## 6. Summary of "Rotten Planks" (For Your Eyes Only)
  1.  **Mechanism Individuation:** There is no agreed-upon way to say two NN subgraphs are the "same mechanism" in the presence of superposition. You are assuming a level of disentanglement that may not exist.
  2.  **MDL Computability:** Your "description length growth" alarm is based on a heuristic proxy. It is not theoretically grounded in a way that guarantees it measures "complexity" rather than just "noise."
  3.  **Causal Sufficiency:** Defining the mechanism as the "minimal sufficient path" assumes such a minimum is unique. In overparameterized networks, there are often multiple disjoint paths that are equally sufficient. Your algorithm likely picks *one* arbitrarily, making your "distance" metric noisy.

  **Final Advice:**
  Lean into the *engineering utility* (catching the resume PDF goodharting) rather than the *theoretical purity*. The Infra and Evals people will forgive theoretical fuzziness if the demo works. The Philosopher and Interp person will not forgive theoretical overclaiming. Be humble on the theory, confident on the demo.
