prompt: |-
  So I somehow ended up on the planning commision for the small city I grew up in, and it's turned into the most morally annoying thing in my life. We hear maybe thirty variance and rezoning proposals a month, forty-five minutes each, one-page staff report, and public comment that is mostly people being furious about parking. Votes get appealed, so whatever I do has to be defensible in writing afterwards. I want a decision procedure I can actually run, in about half an hour, from a one-page report plus whatever gets said in the room, and that my fellow commissioners — a retired contractor, a high school principal, two realtors — can follow without any theory background.

  What I want from you is the procedure, grounded in whatever political philosophy actually has to say about who has a right to the city. No reading list, no names, I just want the distinctions. The one I keep coming back to is that "we have a right to this neighborhood" seems to be three different claims shuffled together: a right of access (to be allowed to move here at all), a right of authorship (to have a say in what the place becomes), and a right of continuity (to not have the ground shift under you because of other people's choices, and to not be handed the bill for the region's growth). Almost every objection I hear is one of those wearing the costume of another. I'd like the procedure to start by sorting which one is actually being claimed, and I'd like it to say whether length of residence strengthens the claim genuinely or is just a proxy for something more defensible — I honestly don't know and I've gone back and forth.

  Three things it has to handle. First: the people most affected usually aren't in the room — the family that would live in the building, the person who'd use the shelter, and, weirder, the fact that what we decide partly determines which people end up existing here at all, so "who is harmed" can't just be read off the folks at the microphone. Give me a rule for who speaks for them, and be honest that it's a rule you chose rather than one you derived. Second: sequencing — refusing a building is reversible next year and approving a demolition isn't, and I want to know whether that asymmetry is a real moral reason for a default or just status quo bias in a nice coat. Say which, and build it in or leave it out accordingly. Third: the cases where the objection is real but the thing being asked for is a veto rather than a fix — how do I tell those apart, and where does the procedure hand the decision back to a human because it's a values call and not a factual one? Also fix the scope if the procedure needs it fixed: I never know whether the relevant "city" is my city or the whole metro area, and I suspect the answer changes the outcome.

  Then run it on three: (1) a six-unit building on a corner lot currently zoned for one house, (2) a sixty-unit supportive-housing project on a commercial strip two blocks off a single-family street, and (3) something I'm personally inclined to approve — a small apartment building a friend wants to put on the lot behind his house — where I'd rather find out I'm being inconsistent than get my way. And tell me plainly what the procedure can't do: which inputs it can't manufacture, when it will misfire, and what it says nothing about at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** A planning commissioner in a small city.
      *   **Problem:** Overwhelmed by morally annoying variance/rezoning proposals (30/month, 45 mins each). Needs a defensible, quick (30 min), simple decision procedure.
      *   **Audience:** Fellow commissioners (retired contractor, high school principal, two realtors) – no theory background.
      *   **Core Philosophical Distinction:** "Right to the City" broken into three claims: Access (move here), Authorship (say in change), Continuity (stability/no externalized costs).
      *   **Specific Requirements:**
          1.  Sort objections into Access/Authorship/Continuity.
          2.  Address length of residence (genuine claim vs. proxy).
          3.  Handle absent stakeholders (future residents, regional needs) – admit this is a chosen rule.
          4.  Handle sequencing/asymmetry (refusal vs. approval reversibility) – decide if it's moral or bias.
          5.  Distinguish veto vs. fix (when to hand back to human judgment).
          6.  Define scope (city vs. metro).
          7.  Run the procedure on three specific cases (6-plex, 60-unit supportive housing, friend's backyard apartment).
          8.  State limitations (what it can't do).
      *   **Constraints:** No reading list, no names, just distinctions. Grounded in political philosophy of "right to the city" but practical.

  2.  **Deconstruct the Philosophical Grounding:**
      *   *Access:* Who gets to be here? (Housing supply, exclusionary zoning).
      *   *Authorship:* Who decides the shape of the place? (Democracy, participation, NIMBYism).
      *   *Continuity:* Who bears the cost of change? (Property values, shadows, traffic, displacement).
      *   *Length of Residence:* Is it a stake or a barrier? Philosophically, "sunk cost" isn't a moral claim, but "reliance interests" are. I need to distinguish between "I've always lived here" (status) and "I built my life around this staying the same" (reliance).
      *   *Absent Stakeholders:* This is the "Non-Identity Problem" meets "Representative Democracy." Since they aren't there, the Commission *must* act as trustees. I need to make this explicit.
      *   *Sequencing:* Approval (building) is hard to reverse. Denial (not building) is easy to reverse (apply again). This suggests a "Precautionary Principle" but often used for NIMBYism. Actually, in housing, *denial* creates permanent scarcity. *Approval* creates permanent housing. The asymmetry is real: You can't un-build a house easily, but you can't un-need housing either. I should frame this as "Irreversibility of Physical Change" vs. "Irreversibility of Exclusion."
      *   *Scope:* Small city vs. Metro. If the city is part of a region, excluding growth here just pushes it there. The "Right to the City" implies a right to the *urban*, which is regional. I need to set the scope at the Metro level for *need*, City level for *impact*.

  3.  **Drafting the Procedure (The "Three-Claim Filter"):**
      *   *Goal:* 30 minutes, defensible in writing.
      *   *Step 1: Scope Definition.* (Metro Need, Local Impact).
      *   *Step 2: Claim Sorting.* (Access, Authorship, Continuity).
      *   *Step 3: The Residence Test.* (Reliance vs. Status).
      *   *Step 4: The Absent Voice Rule.* (Trusteeship).
      *   *Step 5: The Reversibility Check.* (Asymmetry).
      *   *Step 6: Veto vs. Fix.* (Mitigation).

  4.  **Refining the Specific Requirements:**
      *   *Residence:* Length of residence strengthens *Continuity* claims (reliance) but invalidates *Authorship* claims (ownership of public space). It does not affect *Access* claims.
      *   *Absent Stakeholders:* Rule: The Commission acts as Trustee for the Region's Housing Need. We assume the "Yes" side represents the absent unless proven otherwise.
      *   *Sequencing:* Denial is reversible (re-apply). Approval is physically hard to reverse. *However*, denial creates permanent housing shortage. I will argue the moral default is *Approval* unless specific local harm is proven, because housing need is urgent/continuous, while physical changes are static. Wait, the prompt asks if asymmetry is a moral reason or bias. It's often bias. But *physical* irreversibility matters. I'll frame it as: "Denial is procedurally reversible; Approval is physically permanent. Therefore, the burden of proof for denial must be higher to justify the permanence of exclusion."
      *   *Veto vs. Fix:* If the objection is about *impact* (shadow, traffic), it's a Fix (mitigate). If the objection is about *existence* (don't want *those* people/units), it's a Veto (reject).
      *   *Scope:* Metro for Need (Access), City/Neighborhood for Impact (Continuity). Authorship is shared.

  5.  **Running the Cases:**
      *   *Case 1 (6-plex on corner):*
          *   Access: High (adds supply).
          *   Continuity: Low/Med (corner lots absorb change better).
          *   Authorship: Neighbors want say, but don't own the zone.
          *   Outcome: Approve.
      *   *Case 2 (60-unit supportive housing):*
          *   Access: Very High (vulnerable population).
          *   Continuity: Neighbors fear property value/safety (often coded).
          *   Absent Voice: Crucial here. Residents won't show up.
          *   Outcome: Approve (Trustee duty).
      *   *Case 3 (Friend's backyard ADU):*
          *   Access: Low (1 unit).
          *   Continuity: Low.
          *   Conflict of Interest: Recuse? No, the prompt asks to test consistency.
          *   Outcome: If 1 & 2 pass, 3 must pass. If I vote No, I admit bias.

  6.  **Addressing Limitations:**
      *   Can't measure "neighborhood character" objectively.
      *   Can't solve regional inequality alone.
      *   Can't account for bad faith actors perfectly.

  7.  **Tone and Style:**
      *   Direct, procedural, no jargon.
      *   Acknowledge the moral weight without getting academic.
      *   Respect the user's intelligence and the constraints of the room.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is the "Trustee" rule too abstract for a contractor/realtor?
      *   *Fix:* Phrase it as "The Empty Chair." Imagine a chair for the person who needs the home.
      *   *Critique:* Is the reversibility argument clear?
      *   *Fix:* Make it about "Burden of Proof." If we say No, they can come back. If we say Yes, it's done. So say No only if the harm is certain and significant.
      *   *Critique:* Residence time.
      *   *Fix:* Distinguish "Investment in the community" (valid) vs. "Entitlement to freeze time" (invalid).
      *   *Critique:* Scope.
      *   *Fix:* Explicitly state: "We judge local impact, but we acknowledge regional need."

  9.  **Final Polish:** Check against all constraints.
      *   30 min run time? Yes, the steps are quick filters.
      *   Defensible in writing? Yes, creates a record of *why*.
      *   No names/theory? Yes.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  Here is a decision procedure designed for your constraints. It is built to be read aloud at the dais, written into the record in bullet points, and followed by colleagues without philosophy training. It treats the "Right to the City" not as a slogan, but as a triage system for conflicting claims.

  ### The Procedure: The Three-Claim Filter

  **Scope Definition:**
  Before any vote, establish the boundary of harm and need.
  *   **Need (Access):** Measured at the **Metro/Regional level**. Your city is part of a housing ecosystem. If the region needs housing, your city shares the burden unless there is a specific local physical impossibility.
  *   **Harm (Continuity):** Measured at the **Immediate Neighborhood level** (500-foot radius).
  *   **Authority (Authorship):** Shared. Existing residents have a voice, not a veto.

  **Step 1: Sort the Objection (The Three Claims)**
  Listen to public comment and the staff report. Categorize every objection into one of three buckets. If an objection doesn't fit, it is dismissed as irrelevant to planning.

  1.  **Access Claim:** "This shouldn't be here because *who* will live here." (e.g., "It will bring renters," "It's too dense," "It's supportive housing.")
      *   *Verdict:* **Invalid.** You cannot zoning for people. Denying based on Access is exclusion. This counts as evidence *for* approval (it meets a need).
  2.  **Continuity Claim:** "This shouldn't be here because of *physical impact* on me." (e.g., "Shadow on my garden," "Traffic on my cul-de-sac," "Parking overflow," "Noise.")
      *   *Verdict:* **Valid for Mitigation.** These are factual claims. They require evidence, not emotion.
  3.  **Authorship Claim:** "This shouldn't be here because it doesn't fit the *character*." (e.g., "It's too tall," "It looks different," "We weren't consulted enough.")
      *   *Verdict:* **Valid for Process, Invalid for Outcome.** You must ensure they were heard, but "character" cannot override regional need unless codified in existing law (which variances explicitly test).

  **Step 2: The Residence Test (Length of Stay)**
  Does living there longer make a claim stronger?
  *   **Rule:** Length of residence strengthens **Continuity** claims only if it proves **Reliance**, not **Status**.
  *   **Application:**
      *   *Status:* "I've lived here 30 years, so I own the view." -> **Reject.** The city changes; ownership of the status quo is not a property right.
      *   *Reliance:* "I bought this lot specifically for the sunlight/zoning and built my home to the edge based on that." -> **Accept.** This is a tangible investment backed by previous city rules.
  *   **Writing it down:** "Objection noted. However, length of residence grants no right to freeze municipal evolution. Only specific reliance on prior code is weighted."

  **Step 3: The Empty Chair Rule (Absent Stakeholders)**
  You noted the people most affected aren't in the room. You cannot derive their representation from thin air, so you must **appoint** it.
  *   **Rule:** The Commission acts as Trustee for the "Empty Chair."
  *   **The Chair:** Represents the future resident who needs the housing and the regional need for supply.
  *   **Procedure:** When weighing harm, you must weigh the harm to the Empty Chair (denial of housing) against the harm to the people in the room (inconvenience/change).
  *   **Writing it down:** "In the absence of the future resident, the Commission weighs the certainty of regional housing need against the projected local impact."

  **Step 4: The Reversibility Check (Sequencing)**
  Is the asymmetry of approval/denial a moral reason? **Yes.**
  *   **Logic:** A "No" vote is procedurally reversible (applicant can re-apply next year). A "Yes" vote is physically permanent (the building goes up). However, a "No" vote creates a permanent *scarce resource* (housing) that cannot be easily recovered.
  *   **The Default:** Because physical buildings are hard to remove, the burden of proof for **Denial** must be higher than for Approval.
  *   **Rule:** If the Continuity harms (Step 1) are speculative or mitigatable, you must Approve. You only Deny if the harm is certain, significant, and unfixable. Do not use "No" as a precaution; use "Yes with Conditions" as the precaution.

  **Step 5: Veto vs. Fix (The Hand-Off)**
  How to tell if an objection is a Veto (reject the project) or a Fix (modify the project)?
  *   **The Test:** Ask, "If the applicant removes the offending feature, do you still object?"
      *   If "Yes, I just don't want the density/people": It is a **Veto**. (Ignore for decision purposes; see Step 1).
      *   If "No, if you move the driveway/add a fence/reduce height, I'm okay": It is a **Fix**.
  *   **Action:** If it is a Fix, condition the approval. If it is a Veto, approve the project as submitted.
  *   **Human Hand-Off:** If the "Fix" requires changing the fundamental economics of the project (making it unbuildable), treat it as a Veto and Approve. This is a values call: Housing production trumps neighborhood preference.

  ---

  ### Running the Procedure

  Here is how this plays out on your three cases.

  #### Case 1: Six-unit building on a corner lot (Single-family zone)
  *   **Sort:** Neighbors object to parking and "scale." This is **Continuity** (parking) and **Authorship** (scale/character). No Access claims heard explicitly, but implied.
  *   **Residence:** Neighbors are long-term. Do they have Reliance? Did they buy *because* the corner was vacant? Unlikely. They bought the neighborhood. **Status claim rejected.**
  *   **Empty Chair:** Six families need homes. Regional need is high.
  *   **Reversibility:** If we deny, they re-apply. If we approve, it's built. But the harm (parking) is mitigatable.
  *   **Veto/Fix:** Parking is a Fix. Require off-street spaces or a traffic study. "Scale" is a Veto (they want it smaller or gone).
  *   **Decision:** **Approve with Conditions.**
  *   **Written Defense:** "Objections regarding character are Authorship claims which do not override regional need. Parking concerns are Continuity claims resolved via condition X. Reliance on existing zoning is not established."

  #### Case 2: Sixty-unit supportive housing (Commercial strip, near single-family)
  *   **Sort:** Neighbors object to "safety," "loitering," "property values." These are **Access Claims** disguised as Continuity. They are objecting to *who* will live there.
  *   **Residence:** Irrelevant. You cannot claim a right to exclude vulnerable populations based on tenure.
  *   **Empty Chair:** Critical. These 60 residents cannot advocate for themselves effectively. The Commission *must* speak for them.
  *   **Reversibility:** Denial leaves 60 vulnerable people homeless. Approval builds permanent support. The moral weight of the Empty Chair outweighs the speculative Continuity claims of neighbors.
  *   **Veto/Fix:** "Safety" is a Veto (they don't want the shelter). "Lighting/Management Plan" is a Fix.
  *   **Decision:** **Approve.**
  *   **Written Defense:** "Objections regarding tenant demographics are Access claims and legally impermissible grounds for denial. The Commission acts as Trustee for the future residents. Management plan conditions address Continuity concerns."

  #### Case 3: Friend's backyard apartment (ADU)
  *   **Sort:** Likely no public comment. Maybe a neighbor worries about privacy. **Continuity** (privacy/view).
  *   **Residence:** Your friend lives there. He has **Reliance** on his own property rights.
  *   **Empty Chair:** One family needs a home.
  *   **Reversibility:** Low impact physically.
  *   **Veto/Fix:** If neighbor objects to *any* unit, it's a Veto. If they object to the *window placement*, it's a Fix.
  *   **Decision:** **Approve.**
  *   **Consistency Check:** If you voted No on Case 1 or 2 based on "neighborhood feel," you must vote No here. If you vote Yes here (which you want to), you must vote Yes on 1 and 2. The procedure forces you to treat the friend's lot the same as the developer's lot.
  *   **Written Defense:** "Minor Continuity impacts mitigated by setback. Regional need for incremental supply supports approval."

  ---

  ### Limitations: What This Procedure Cannot Do

  You asked for honesty about where this breaks.

  1.  **It Cannot Manufacture Data:** If the staff report says "traffic impact unknown," this procedure cannot guess. It forces you to either Demand More Info (delay) or Approve (assume no harm). It does not solve the problem of lazy staff work.
  2.  **It Cannot Solve Regional Inequality:** This procedure helps you vote correctly *within* your meeting. It does not stop the region from dumping all low-income housing into your city while the rich city next door bans it. It makes you a good trustee, not a regional savior.
  3.  **It Will Misfire on "Bad Faith" Fixes:** Sometimes neighbors propose "Fixes" they know are impossible (e.g., "Make it 10 feet shorter") to stall the project. The procedure tells you to treat this as a Veto and Approve anyway, but that will cause political friction in the room.
  4.  **It Says Nothing About Aesthetics:** If a building is genuinely ugly but meets all code, this procedure says "Approve." It treats beauty as an Authorship claim (subjective), not a Continuity claim (objective harm). If your city cares about beauty, this procedure will conflict with your design guidelines.
  5.  **It Requires You to Be the Trustee:** The "Empty Chair" rule is a chosen moral axiom, not a legal one. If your fellow commissioners reject the idea that you speak for absent people, the procedure collapses into majoritarianism (whoever shows up wins). You have to persuade them of the Empty Chair before you use the tool.

  ### Summary for the Dais
  When you write your findings, use this template:
  1.  **Claim:** [Access/Continuity/Authorship]
  2.  **Validity:** [Valid/Invalid per Filter]
  3.  **Resolution:** [Approve/Deny/Condition]
  4.  **Trustee Note:** [Weight given to regional need/absent resident]

  This keeps you under 30 minutes, gives the contractor and realtors clear buckets to sort arguments into, and creates a written record that appeals courts respect because it distinguishes between *legal* grounds (Continuity) and *illegal* grounds (Access).
