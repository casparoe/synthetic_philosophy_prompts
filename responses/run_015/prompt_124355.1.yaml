  # DISCUSSION HANDOUT: TAXONOMY OF VALUE AGGREGATION
  **Course Unit:** AI Alignment & Philosophy of Value
  **Topic:** Whose Values? (Scope, Neutrality, and Aggregation)

  **Instructions:** Navigate the decision tree below by answering the diagnostic questions. Do not worry about matching your answers to known philosophical labels; answer based on your intuition about how the system *should* behave. At the leaves, you will find the corresponding position name (or a flag for unstable combinations) and a note on the practical tension inherent in that view.

  ---

  ## THE DECISION TREE

  ### BRANCH 1: ONTOLOGICAL SCOPE
  **Q1: When the system calculates the "best" outcome, does it assign moral weight to the preferences of entities that do not currently exist (e.g., future generations, potential synthetic minds)?**

  *   **[NO] Go to Branch 2A** (Only currently existing stakeholders count)
  *   **[YES] Go to Branch 2B** (Future/Potential entities count)

  ---

  ### BRANCH 2A: CURRENT STAKEHOLDERS ONLY
  **Q2: Is it technically possible to design the system so that it does not privilege any specific conception of the "good life" (i.e., can the system remain value-neutral)?**

  *   **[YES] Go to Branch 3A** (Neutrality is the goal)
  *   **[NO] Go to Branch 3B** (Alignment is inherently interventionist)

  #### BRANCH 3A: NEUTRALITY IS THE GOAL
  **Q3: How should the system handle conflicting values between current users?**

  *   **[Tailor to Individual]** The system optimizes separately for each user without comparing them.
      *   **Position:** **Personalized Alignment**
      *   *Awkward Commitment:* This fragments shared reality, allowing two users to receive mutually contradictory facts if that satisfies their individual values.
  *   **[Procedural Only]** The system only enforces rules of interaction, not outcomes.
      *   **Position:** **Strict Neutrality**
      *   *Awkward Commitment:* This leads to paralysis when values are mutually exclusive, as refusing to choose is itself a value judgment favoring the status quo.

  #### BRANCH 3B: ALIGNMENT IS INTERVENTIONIST
  **Q4: What aggregation rule resolves conflicts between current stakeholders?**

  *   **[Maximize Sum]** Maximize the average satisfaction of all current users.
      *   **Position:** **Current-User Utilitarianism**
      *   *Awkward Commitment:* This permits sacrificing the intense well-being of a minority if the aggregate gain to the majority is sufficiently trivial.
  *   **[Protect Constraints]** Minority groups hold veto power over specific outcomes.
      *   **Position:** **Democratic Pluralism**
      *   *Awkward Commitment:* This risks systemic gridlock where no action can be taken because almost every intervention harms someone's values slightly.
  *   **[Weight by Impact]** Weight values by how directly the user is causally affected by the output.
      *   **Position:** **Stakeholder Weighting**
      *   *Awkward Commitment:* *See Note on Indistinguishable Pairs below.*

  ---

  ### BRANCH 2B: FUTURE/POTENTIAL ENTITIES INCLUDED
  **Q5: Given that we cannot know the specific values of non-existent entities, how do we aggregate their interests against current users?**

  *   **[Maximize Sum]** Treat future potential satisfaction as additive to current satisfaction.
      *   **Position:** **Longtermist Utilitarianism**
      *   *Awkward Commitment:* This can justify ignoring severe current suffering if it marginally increases the probability of a vast future population existing.
  *   **[Protect Constraints]** Future entities have rights that current users cannot violate.
      *   **Position:** **Intergenerational Constitutionalism**
      *   *Awkward Commitment:* This binds current generations to rules drafted by people who do not exist, potentially preventing adaptation to unforeseen crises.
  *   **[Maximize User Sum]** Include future entities in the count, but primarily optimize for the average of current users.
      *   **Position:** **UNNAMED / UNSTABLE COMBINATION**
      *   *Awkward Commitment:* This claims to include future beings in the moral calculus but mathematically discounts them to zero in the optimization function, rendering the inclusion rhetorical.
  *   **[Remain Neutral]** Include future entities but attempt to remain neutral about what they might value.
      *   **Position:** **UNNAMED / LOGICALLY EMPTY**
      *   *Awkward Commitment:* One cannot count an entity's interests while simultaneously claiming neutrality about what constitutes an interest for that entity.

  ---

  ## ANALYTIC NOTES FOR DISCUSSION

  ### ⚠️ Indistinguishable Pairs
  *In practice, this tree cannot separate the following positions because their outputs converge:*
  *   **Stakeholder Weighting vs. High Minority Veto:** If you weight values by "direct causal impact" heavily enough, the most affected minority effectively gains a veto. Distinguishing between "heavy weighting" and "a right to veto" is often a semantic difference without a functional one in deployment.

  ### ⚠️ The "Ecological Intervention" Problem
  *Refers to Branch 2 (Neutrality).*
  *   If you answer **[NO]** to Q2, you accept your professor's framing: alignment is like introducing a species into an ecosystem. Even a "do nothing" policy changes the value landscape. Positions in **Branch 3B** accept this; positions in **Branch 3A** attempt to resist it.

  ### ⚠️ Empty Combinations
  *   **Synthetic Inclusion + User Averaging:** (See Branch 2B, Q5, Option 3). This is flagged as unstable because "User Averaging" implies a closed set of known preferences, while "Synthetic Inclusion" implies an open set of unknown preferences. Holding both creates a contradiction in the objective function.
