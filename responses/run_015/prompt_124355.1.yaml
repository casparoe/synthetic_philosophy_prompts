prompt: |-
  I'm taking this course on AI alignment and philosophy of value and I'm kind of stuck on the unit about whose values an aligned system should actually serve. Like, is it just the users? Everyone affected? Future people? My professor mentioned this weird framing where value aggregation is like ecological intervention - you can't stay "neutral" because every alignment choice is already interfering with the value landscape, which I think is kind of interesting but also confusing. Anyway, I want to build a taxonomy handout for our discussion section that sorts actual positions by concrete commitments, not by the labels people use.

  The tree should branch on specific diagnostic claims: first, whether values of entities that don't exist at deployment time (future generations, possibly synthetic minds that emerge later) count in the aggregation; second, whether liberal neutrality is even coherent given that every method smuggles in some meta-value about harm; third, what aggregation rule applies - simple averaging, minority veto rights, or weighting by direct causal impact. I need leaves for standard positions (utilitarian aggregation, strict neutrality, personalized alignment, democratic pluralism) but also flag empty combinations - like maybe nobody holds full synthetic-mind inclusion plus pure user-averaging because it's unstable? And please note pairs the tree can't really seperate in practice, like weighted aggregation versus veto rights with high minority weights. Each leaf should carry the position name or "unnamed" and one sentence on its most awkward commitment. Don't need citations or a bibliography, just the branching logic with questions phrased so someone can answer them without already knowing which view they point to.
