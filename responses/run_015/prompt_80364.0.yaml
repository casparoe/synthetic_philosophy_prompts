  6.  **Synthesize the "View on Residue":**
      *   Is it a limit of Econ or Aristotle?
      *   Argument: It's a limit of the *economic framework's assumptions* (methodological individualism, universal rationality). Econ assumes all humans are potential contractors. Aristotle assumes a hierarchy of being.
      *   However, Aristotle's argument relies on empirical claims (some people *are* incapable) that look like extreme human capital deficits.
      *   Verdict: The residue reveals that economics assumes a baseline of *moral equality* (everyone has a utility function) which Aristotle explicitly denies. Economics can model the *structure* of the relationship, but not the *justification* based on natural hierarchy. The economic translation makes it look like a harsh efficiency claim; Aristotle meant it as a metaphysical truth.

  7.  **Refine the Tone:**
      *   Professional, academic, direct.
      *   Use the specific jargon requested (P-A, TCE, Boundary of the Firm, etc.).
      *   Avoid moralizing, focus on the structural translation and its failure points.

  8.  **Self-Correction/Review during drafting:**
