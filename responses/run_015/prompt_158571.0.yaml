answer: |-
  You have identified a genuine and under-theorized friction point in the contemporary philosophy of mathematics. To answer your primary question directly: **No, there is no single, canonical "ism"** (like Logicism or Intuitionism) that currently names this specific hybrid position.

  However, the pattern you describe is widely recognized in the philosophy of computer science and the emerging philosophy of formalized mathematics. It is often discussed as a tension between **epistemic opacity** and **ontological commitment**.

  If we were to coin a precise term for the position you describe—where machine-checkability itself confers ontological status while simultaneously relying on human-constructed encodings—the most philosophically robust label would be **"Computational Entity Realism"** (a adaptation of Ian Hacking's *Entity Realism*) or, more critically, **"Verificationist Ontology."**

  Below is a breakdown of how to map this position, distinguish it from traditional views, and understand why the "slide" occurs.

  ### 1. Diagnosing the Slide: The "Oracle" vs. The "Architect"
  The tension you notice arises because proponents of formal verification often toggle between two distinct metaphors for the proof assistant, depending on what rhetorical work needs to be done:

  *   **The Oracle (Discovery):** When defending the *truth* of a result, the computer is framed as an unbiased arbiter, free from human cognitive limitation. Here, the machine is a **transparent window**. The ontology is Realist: the theorem is true because the machine says it corresponds to a structure that *must* hold, regardless of human intuition.
  *   **The Architect (Construction):** When defending the *rigor* or *meaning* of a result, the computer is framed as a strict taskmaster requiring explicit definitions. Here, the machine is a **construction site**. The ontology is Constructivist/Formalist: the object *is* the data structure defined in the library; without the encoding, the object is ill-defined.

  **The Hybrid Claim:** The ontological weight is placed on the **process of checkability**. The object is "real" *because* it can be successfully encoded and verified, yet that reality is treated as "discovered" because the verification constraints were not arbitrarily chosen but forced by the logic.

  ### 2. Proposed Terminology: "Computational Entity Realism"
  Since no standard term exists, **Computational Entity Realism** is the most accurate existing framework to adapt.

  *   **Source:** Ian Hacking's *Entity Realism* ("If you can spray it, it is real").
  *   **Adaptation:** "If you can formalize and verify it, it is real."
  *   **Why it fits:** It bypasses the question of whether the object exists in a Platonic heaven or is merely a linguistic convention. Instead, it grounds existence in **intervention**. In formal math, "intervention" is the act of successfully constructing the term and deriving the theorem within the kernel.
  *   **The Slide Explained:** This view allows the slide because "intervention" requires both a real target to intervene *upon* (Discovery) and a specific apparatus to intervene *with* (Construction).

  ### 3. Sharp Boundaries: Distinguishing the View
  To carve out the boundary you requested, we must distinguish this view from the three traditional neighbors. The key differentiator is the **status of the machine check**.

  #### vs. Traditional Platonism
  *   **Platonism:** Mathematical objects exist independently of human activity *and* independently of our ability to verify them. A proof is a *detection* of pre-existing relations.
  *   **Computational Entity Realism:** Existence is tied to **formalizability**. If a concept cannot be encoded in a type theory (e.g., certain large categories or "proper classes" that break universe levels), it may be deemed ontologically suspect or "not properly mathematical" in this framework.
  *   **The Boundary:** Platonism treats the machine as a telescope (viewing distant stars); this view treats the machine as a particle collider (creating the conditions under which the entity manifests).

  #### vs. Traditional Formalism
  *   **Formalism:** Mathematical statements are strings of symbols manipulated according to rules. They have no ontological weight; truth is merely derivability.
  *   **Computational Entity Realism:** Derivability is not enough; it must be **machine-checked derivability**. The physical process of computation and the reliability of the kernel add an extra-linguistic layer of security that grants the symbols "reality."
  *   **The Boundary:** Formalism is indifferent to *who* or *what* checks the proof. This view assigns special ontological privilege to the *automated* check, implying that human verification is ontologically inferior (prone to bias/error).

  #### vs. Constructivism / Intuitionism
  *   **Constructivism:** Mathematical objects are mental constructions. A proof is valid only if it is **surveyable** by a human mind.
  *   **Computational Entity Realism:** The construction is **delegated to the machine**. The object is real even if no human can survey the full proof trace (e.g., the Four Color Theorem or Flyspeck).
  *   **The Boundary:** Constructivism requires *human* understandability. This view accepts *opaque* verification. The "construction" happens in the silicon, not the mind, yet it still confers existence.

  ### 4. Why the Tension Persists (The "Black Box" Problem)
  The reason you see this slide in your reading group is that the position is arguably unstable. Philosophers of practice (such as **Giuseppe Primiero**, **Jeremy Avigad**, and **Ursula Martin**) have pointed out that this view often hides the **sociotechnical layer** of formalization.

  *   **The Hidden Construction:** When a user claims the machine reveals "true structure," they often ignore that the library (e.g., `mathlib` in Lean) embodies specific human choices about what counts as a "canonical" definition.
  *   **The Illusion of Independence:** The machine is only independent of *psychological bias*, not *design bias*. The type theory itself (e.g., ZFC vs. HoTT vs. CIC) dictates what objects *can* exist.
  *   **The Critique:** Critics argue this view commits a **category error**: it conflates *epistemic certainty* (we are sure the proof is valid) with *ontological grounding* (therefore the object exists independently).

  ### 5. Suggested Reading for Your Notes
  To flesh this out in your reading group, you might reference:

  1.  **Ian Hacking, *Representing and Intervening*:** For the base concept of Entity Realism.
  2.  **Jeremy Avigad, "Mathematics, Computation, and Automated Reasoning":** Avigad is careful to distinguish between the *epistemic* benefits of formalization and *ontological* claims.
  3.  **Thomas Hales, "Formal Abstracts":** Hales often navigates this tension, arguing for formalization as a way to secure the "infrastructure" of math without necessarily committing to a specific ontology.
  4.  **Rebecca Morris, "Proofs and the Everyday":** Discusses how the social acceptance of computer proofs shifts the normative status of what counts as a mathematical object.
  5.  **Univalent Foundations (HoTT):** This framework explicitly addresses your tension. The **Univalence Axiom** attempts to make the "encoding" (representation) irrelevant to the "structure" (identity), effectively trying to solve the slide you identified by mathematically equating isomorphic structures.

  ### Summary for Your Notes
  You can characterize this position as **"Verificationist Ontology."**
  *   **Core Claim:** Ontological status is conferred by successful machine verification.
  *   **The Slide:** It treats the *constraints* of verification as evidence of *discovery* (the constraints were necessary) while treating the *act* of verification as *construction* (we built the proof object).
  *   **Distinction:** Unlike Platonism, it makes existence contingent on formalizability. Unlike Formalism, it attributes reality to the verified objects. Unlike Constructivism, it accepts non-surveyable, machine-delegated construction.

  This position is less a settled metaphysics and more a **pragmatic stance** adopted by working formalizers to justify the immense effort of formalization: it must be worth doing because it touches "reality," but it requires "work" because that reality must be built.
