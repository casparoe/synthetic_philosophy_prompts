prompt: |-
  i'm the ethics compliance officer for our city health dept's behavorial unit. we get about three nudge proposals a month—default opt-ins, cafeteria layouts, reminder texts using social norms, auto-enrollment in wellness programs, stuff like that. i have maybe twenty minutes per proposal, i dont have a philosophy degree, my director signs off on my one-page memo, and if i approve something manipulative the council chews me out or we end up in court. i need a reusable decision proceedure i can run step by step: the questions in order, what counts as a sufficient answer at each step, where it stops with a hard no, where it hands the call to me because it's values not facts, and where it's guaranteed to misfire. ground it in actual philosophy of paternalism and autonomy—mill's harm principle, the soft vs hard paternalism distinction, the idea that nudges can bypass rational deliberation even when choice is technically preserved, and the idea that the person should be able to reverse the decision easily without penalty—but translate it so a non-philosopher can use it. the procedure must handle the hard cases: nudges that exploit biases people would want corrected upon reflection, domains where people lack stable preferences like mental health or long-term savings, and nudges that serve collective goods rather than the individual's own ends.

  apply it to three proposals:
  1. driver's license renewal form with organ donation default opt-in and a one-click opt-out.
  2. school cafeteria redesign putting water at eye level and soda behind a counter that requires asking staff.
  3. auto-enrolling all city employees in a mental-health screening check-in, with opt-out only available after watching a 5-minute video explaining benefits.

  make sure one answer is one i wont like—i'm generally pro-nudge but the procedure should be honest. include worked examples of a clear pass, a clear fail, and the zone where i just have to own the judgment call. flag exactly what the procedure cant do, like predicting long-term preference change or resolving conflicts between collective health and individual privacy. no bibliographies or citations needed, i just need the tool.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Ethics Compliance Officer, City Health Dept Behavioral Unit.
      *   **Task:** Create a reusable decision procedure for evaluating "nudge" proposals.
      *   **Constraints:** ~20 mins per proposal, no philosophy degree needed, one-page memo output, high stakes (council/court risk).
      *   **Requirements:**
          *   Step-by-step questions.
          *   Clear pass/fail criteria.
          *   Identification of "judgment call" zones.
          *   Identification of procedure limitations (where it misfires).
          *   Grounded in philosophy (Mill, paternalism, autonomy, bias, reversibility) but translated for practitioners.
          *   Handle hard cases (exploitative biases, unstable preferences, collective vs. individual goods).
          *   Apply to three specific scenarios (Organ donation, Cafeteria, Mental health auto-enroll).
          *   One result must be unfavorable (honesty check).
          *   No bibliographies/citations.

  2.  **Deconstruct the Philosophical Foundations (for internal mapping):**
      *   *Mill's Harm Principle:* Interference only justified to prevent harm to others. (Hard limit).
      *   *Soft vs. Hard Paternalism:* Soft = helping people achieve their *own* goals despite cognitive glitches. Hard = imposing goals they wouldn't choose. (Aim for Soft).
      *   *Autonomy/Manipulation:* Does it bypass rational deliberation? Is it transparent?
      *   *Reversibility:* Can they opt out easily? (Thaler & Sunstein's "easy out").
      *   *Preference Stability:* Do they know what they want? (Mental health/savings are tricky).
      *   *Collective Good:* Herd immunity, cost savings vs. individual liberty.

  3.  **Drafting the Procedure (The "Tool"):**
      *   *Goal:* Make it a checklist/flowchart style.
      *   *Time Limit:* Needs to be fast. 5-7 steps max.
      *   *Language:* Plain English, operational definitions.
      *   *Structure:*
          1.  Harm Check (Mill).
          2.  Goal Alignment (Soft Paternalism).
          3.  Transparency/Manipulation Check.
          4.  Friction/Reversibility Check.
          5.  Vulnerability/Equity Check.
          6.  The "Judgment Call" Zone.

      *   *Refining the Steps:*
          *   *Step 1 (Harm):* Does this prevent direct harm to others? If no, does it prevent severe self-harm? (Mill + Soft Paternalism).
          *   *Step 2 (Alignment):* Would the person agree with this goal if asked calmly? (Endorsement test).
          *   *Step 3 (Mechanism):* Does it hide info or exploit fear? (Transparency).
          *   *Step 4 (Exit):* How hard is it to say no? (Cost/Time).
          *   *Step 5 (Equity):* Does this hurt vulnerable groups more?

      *   *Defining the "Stop" points:*
          *   Hard No: Harm to others not established, or high friction opt-out.
          *   Judgment Call: Unstable preferences (mental health), collective vs. individual conflict.

  4.  **Developing the Test Cases:**
      *   *Case 1: Organ Donation (Default Opt-in).*
          *   Analysis: High collective good, low individual cost, easy opt-out. Generally accepted in literature.
          *   Verdict: Pass (Clear Pass).
      *   *Case 2: Cafeteria (Water vs. Soda).*
          *   Analysis: Health goal, alters choice architecture. Soda isn't "harm to others" strictly, but public health cost. Friction for soda is moderate (ask staff).
          *   Verdict: Pass/Judgment (Let's make it a Clear Pass for the sake of variety, or maybe a Judgment Call? Let's make it a Clear Pass but note the friction). *Correction:* The prompt asks for one answer the user won't like. Organ donation is usually popular. Cafeteria is usually popular. Mental Health Auto-enroll is the controversial one.
      *   *Case 3: Mental Health Auto-Enroll (Video barrier to opt-out).*
          *   Analysis: "Auto-enroll" is a nudge. "Opt-out only after 5-min video" is *sludge* (high friction). This violates the "easy out" principle. It targets a vulnerable population.
          *   Verdict: Fail (This is the one the pro-nudge officer won't like).

  5.  **Refining the Procedure for the "Hard Cases":**
      *   *Unstable Preferences:* Add a specific question about "Would they thank us later?"
      *   *Collective Good:* Add a weighting factor.
      *   *Limitations:* Explicitly state where the tool breaks (e.g., predicting long-term regret).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, direct, bureaucratic but ethical.
      *   *Format:* Bold headers, bullet points, clear "STOP" signs.
      *   *Philosophy Translation:* Instead of "Kantian autonomy," use "Respect for Choice." Instead of "Mill," use "Harm to Others."

  7.  **Review against Constraints:**
      *   20 mins? Yes, checklist is short.
      *   One-page memo style? The output should look like the tool + the analysis.
      *   One unfavorable result? Yes (Case 3).
      *   Flag limitations? Yes, dedicated section.
      *   Grounded in philosophy? Yes (embedded in the logic).

  8.  **Final Polish:**
      *   Ensure the distinction between "Nudge" (low friction) and "Sludge/Manipulation" (high friction/deceptive) is clear.
      *   Make sure the "Judgment Call" section is distinct from the "Pass/Fail" section.
      *   Check the Mental Health case logic: A 5-minute video to opt-out is a significant barrier, effectively coercive for busy employees. This violates the "libertarian" part of libertarian paternalism.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Fail" for case 3, but explain *why* using the tool's steps. The 5-minute video is the killer. It turns a nudge into a mandate.

      *(Refining the "Judgment Call" zone)*: This needs to be where the officer has to sign their name. It's where the algorithm stops and the human starts. Usually involves conflicting values (Privacy vs. Health).

      *(Refining Limitations)*: Be honest. This tool can't predict the future or solve deep political disagreements.

  9.  **Final Output Structure:**
      *   Introduction (The Tool).
      *   The 5-Step Filter (with Pass/Fail/Judgment criteria).
      *   The "Judgment Call" Zone (Where you own it).
      *   Known Failure Modes (Limitations).
      *   Application to the Three Proposals.

  10. **Writing the response.** (Proceeding to generate output based on this plan).
answer: |-
  # The Behavioral Ethics Filter (BEF)
  **For:** City Health Dept Behavioral Unit
  **Time Budget:** 20 Minutes
  **Purpose:** Rapid ethical triage of nudge proposals.

  This tool translates philosophical concepts (autonomy, paternalism, harm) into operational questions. It is designed to catch manipulative designs before they reach the Director.

  ---

  ## Part 1: The 5-Step Filter
  *Answer sequentially. If you hit a **HARD STOP**, the proposal is rejected. If you hit **JUDGMENT CALL**, proceed to Part 2.*

  ### Step 1: The Harm & Authority Check (Mill's Principle)
  **Question:** Does the behavior being nudged cause direct, demonstrable harm to *others* (e.g., infectious disease, second-hand smoke), or is it purely self-regarding (e.g., diet, savings, personal mental health)?
  *   **Pass:** Prevents harm to others OR prevents severe, irreversible self-harm (e.g., suicide, overdose).
  *   **Hard Stop:** The goal is purely lifestyle preference enforcement with no clear harm component (e.g., nudging people to eat organic because it's "better").
  *   **Judgment Call:** The harm is diffuse/collective (e.g., public healthcare costs) rather than direct.

  ### Step 2: The Alignment Test (Soft Paternalism)
  **Question:** If the individual were calm, informed, and had full cognitive bandwidth, would they endorse this goal as their own?
  *   **Pass:** Yes. The nudge helps them overcome a known cognitive glitch (procrastination, forgetfulness) to achieve a goal they already claim to want.
  *   **Hard Stop:** No. The nudge pushes a goal the target group actively opposes or has no stake in.
  *   **Judgment Call:** Preferences are unstable or unknown (e.g., mental health treatment, addiction recovery). The person might want it *after* the fact, but not *before*.

  ### Step 3: The Transparency Check (Manipulation)
  **Question:** Is the mechanism of influence visible to the participant? If we explained *how* this nudge works on the evening news, would people feel tricked?
  *   **Pass:** The nudge is open. (e.g., "We put fruit first because it's healthier.")
  *   **Hard Stop:** The nudge relies on deception, hidden fears, or exploiting vulnerabilities the user cannot detect (e.g., using dark patterns that mimic system errors).
  *   **Judgment Call:** The nudge relies on subconscious biases (social norms, default effects) that are hard to explain simply but aren't deceptive.

  ### Step 4: The Exit Friction Check (Liberty Preservation)
  **Question:** How much time, money, or effort does it take to opt out or choose the alternative?
  *   **Pass:** Opt-out is as easy as opt-in (e.g., one click, same form, no penalty).
  *   **Hard Stop:** Opt-out requires significant effort, cost, shame, or time (e.g., "Watch a 5-minute video to decline," "Call a hotline," "Face a supervisor"). This is **Sludge**, not a Nudge.
  *   **Judgment Call:** Opt-out requires moderate effort (e.g., signing a waiver) to ensure informed consent, but doesn't deter the determined.

  ### Step 5: The Equity Check (Vulnerability)
  **Question:** Does this nudge disproportionately burden or mislead vulnerable populations (low literacy, cognitive impairment, non-native speakers)?
  *   **Pass:** Impact is neutral or positive across demographics.
  *   **Hard Stop:** The nudge works by exploiting a vulnerability specific to a protected class (e.g., complex language that traps non-speakers).
  *   **Judgment Call:** The nudge helps the vulnerable most but restricts their choice more than the privileged (e.g., mandatory check-ins for low-income recipients only).

  ---

  ## Part 2: The Judgment Call Zone
  *If you landed here in any step above, the procedure cannot decide for you. You must write the justification in your memo.*

  **This is where you own the risk.** The filter identifies the conflict, but you must weigh the values.
  *   **Conflict:** Individual Liberty vs. Collective Welfare.
  *   **Conflict:** Current Self (wants to avoid pain) vs. Future Self (wants health).
  *   **Conflict:** Privacy vs. Safety.

  **Action:** If you approve a Judgment Call, your memo must explicitly state: *"This proposal restricts autonomy in service of [Value X]. We accept the risk of [Risk Y] because [Reason Z]."*

  ---

  ## Part 3: Known Failure Modes (Where the Tool Misfires)
  *Do not use this tool if:*
  1.  **Long-term Preference Change:** The tool assumes stable preferences. It cannot predict if a nudge will fundamentally change who a person is over 10 years (e.g., constant surveillance changing behavior permanently).
  2.  **Political Legitimacy:** The tool checks ethics, not legality or political will. A "Pass" does not mean the City Council will like it.
  3.  **Complex Systems:** In complex mental health or economic systems, a nudge might have unintended downstream effects the checklist can't see (e.g., nudging screening increases demand beyond capacity, harming care quality).

  ---

  # Application to Current Proposals

  ### Proposal 1: Driver's License Organ Donation Default
  *   **Step 1 (Harm):** **Judgment Call.** Harm is to others (recipients), but indirect.
  *   **Step 2 (Alignment):** **Pass.** Most citizens express support for donation but fail to register due to procrastination.
  *   **Step 3 (Transparency):** **Pass.** Form clearly states "You will be a donor unless you uncheck this box."
  *   **Step 4 (Exit Friction):** **Pass.** One-click opt-out. No penalty.
  *   **Step 5 (Equity):** **Pass.** Applied universally.
  *   **Verdict:** **CLEAR PASS.**
  *   **Memo Note:** This is classic soft paternalism. It respects the right to refuse while accommodating the inertia that prevents people from acting on their own stated values.

  ### Proposal 2: Cafeteria Redesign (Water Eye-Level, Soda Behind Counter)
  *   **Step 1 (Harm):** **Judgment Call.** Public health costs are collective harm, but individual consumption is self-regarding.
  *   **Step 2 (Alignment):** **Pass.** Aligns with general health goals; few people *want* to be unhealthy, they just succumb to convenience.
  *   **Step 3 (Transparency):** **Pass.** Layout is visible. No deception about what soda is.
  *   **Step 4 (Exit Friction):** **Pass.** Requires asking staff, but no shame or monetary penalty. Moderate friction is acceptable for physical goods.
  *   **Step 5 (Equity):** **Pass.** Applies to all students.
  *   **Verdict:** **CLEAR PASS.**
  *   **Memo Note:** This alters the "choice architecture" without removing options. It leverages convenience bias without triggering a Hard Stop on liberty.

  ### Proposal 3: Auto-Enroll Mental Health Screening (5-Min Video to Opt-Out)
  *   **Step 1 (Harm):** **Judgment Call.** Mental health is self-regarding unless crisis impacts public safety.
  *   **Step 2 (Alignment):** **Judgment Call.** Do employees want screening? Some do, some fear stigma. Preferences are unstable.
  *   **Step 3 (Transparency):** **Pass.** Benefits are explained.
  *   **Step 4 (Exit Friction):** **HARD STOP.**
      *   *Reasoning:* Requiring a 5-minute video to exercise the right to opt-out is **Sludge**. It imposes a "time tax" on privacy. A nudge must preserve the ease of saying "no." If the friction is high enough to coerce compliance, it is no longer a nudge; it is a mandate disguised as choice.
  *   **Step 5 (Equity):** **Judgment Call.** Busy hourly workers may not have 5 minutes; salaried staff do. Disparate impact.
  *   **Verdict:** **REJECT (Hard Stop at Step 4).**
  *   **Memo Note:** *I know you like this one, but this fails the Liberty Preservation test.* By placing a 5-minute barrier between the employee and their right to decline, we are penalizing autonomy. If the screening is voluntary, the opt-out must be as easy as the opt-in (e.g., one click). If the screening is mandatory, own that and don't call it a nudge. As written, this is manipulative friction that will invite legal challenge regarding coercion in the workplace.

  ---

  # Summary for Your Memo
  *   **Proposal 1 & 2:** Approved. They assist intention without blocking exit.
  *   **Proposal 3:** Returned. Remove the video barrier for opt-out. Make opt-out one-click. If you keep the video, you must classify this as a Mandatory Policy, not a Behavioral Nudge, and route it through Legal/HR for coercion review.

