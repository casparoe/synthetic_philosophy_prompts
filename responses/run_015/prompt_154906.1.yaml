answer: |-
  ### Institutional Reconstruction of Folk-Moral Regimes

  **The German Position: Layer A Dominance and Scaffold Stability**
  Within the scaffold-and-calibration heuristic, the German folk-moral orientation prioritizes the robustness of **Layer A (Deontic Scaffolding)**. Here, moral authority is institutionalized as a preference-independent constraint set; the legitimacy of a directive derives from its codification and procedural enactment rather than its alignment with an agent's current utility function. Cooperation is modeled as a coordination equilibrium secured by high-fidelity signaling within the Scaffold. By rigidly adhering to Layer A protocols, agents reduce transaction costs associated with negotiating local exceptions, thereby solving the common-pool resource (CPR) problem through ex-ante commitment devices rather than ex-post bargaining.

  Institutional failure in this regime is reconstructed as **mechanism rigidity**. When the Scaffold cannot accommodate local information shocks (Hayekian knowledge problems), the system incurs deadweight losses through over-compliance. This is not merely bureaucratic inefficiency but a **preference-revelation failure**: agents are incentivized to mask local contextual data to maintain compliance with the universal rule, leading to suboptimal resource allocation. The normative commitment here is that the stability of the cooperative equilibrium (Layer A integrity) outweighs the efficiency losses from occasional misalignment with local preferences.

  **The American Position: Layer B Dominance and Calibration Flexibility**
  Conversely, the American folk-moral orientation privileges **Layer B (Conscience Calibration)**. Moral authority is decentralized to the agent's internal regulatory mechanism, where behavior is revised through preference-sensitive normative judgment. Legitimacy is contingent on the incentive compatibility of the rule with the agent's internalized utility function; if a Layer A constraint conflicts with Layer B calibration, the agent is institutionally permitted (or even expected) to override the Scaffold. Cooperation is sustained not by rigid rule-following but by a shared expectation of **adaptive efficiency**, relying on social capital and reputation mechanisms to enforce Layer B norms where Layer A is silent or obstructive.

  Institutional failure in this regime is reconstructed as **calibration-error accumulation** or **signal noise**. Because Layer B mechanisms are internal and preference-sensitive, they introduce high variance into agent behavior, creating a principal-agent problem where the principal cannot verify if an agent's deviation was a legitimate moral calibration or opportunistic shirking. This manifests as arbitrary subjectivism. The normative commitment here is that the prevention of pathological over-compliance (Layer A rigidity) justifies the increased monitoring costs required to verify the integrity of Layer B judgments.

  ### Residue Report

  **1. Clean Translations**
  *   **Rule-Following as Equilibrium Selection:** The German emphasis on *Ordnung* translates cleanly into a strategy of selecting a rigid Nash equilibrium to minimize enforcement costs and maximize predictability in high-uncertainty environments.
  *   **Conscience as Internalized Enforcement:** The American emphasis on individual conviction translates effectively into a model of self-enforcing contracts where internal utility penalties (guilt/reputation) substitute for external sanctions, lowering the cost of governance.
  *   **Pathological Over-Compliance:** The critique of bureaucratic rigidity maps directly onto the economic concept of deadweight loss generated by binding constraints that ignore marginal local conditions.

  **2. Distorted Translations**
  *   **National Character as Preference Type:** Treating "German" or "American" morality as distinct preference types risks essentialism. In institutional terms, these are better understood as **path-dependent equilibrium selections** resulting from historical institutional investments (e.g., legal origins, welfare state design) rather than intrinsic cultural traits. Modeling them as fixed preferences distorts the dynamic nature of institutional evolution.
  *   **Honor and Trust:** While "honor" can be modeled as a reputation signal in a repeated game, the folk-moral weight of honor often implies a non-instrumental value that exceeds its utility as a cooperation signal. Reducing it to a reputation asset distorts its normative force as a constituent of identity.

  **3. Untranslatable Residue**
  *   **Intrinsic Legitimacy:** The claim that Layer A authority is *inherently* rightful (independent of outcomes) or that Layer B autonomy is *inherently* free contains a metaphysical commitment to moral ontology that institutional vocabulary cannot capture. Mechanism design can explain why a regime is stable or efficient, but it cannot validate the *moral right* of the Scaffold to bind the agent absent instrumental justification.
  *   **Comparative Statics of Evaluation:** The evaluative contention—that rule-following yields more durable cooperation or that conscience prevents pathology—can be partially expressed as comparative statics regarding discount rates and monitoring costs. However, the *valuation* of durability versus flexibility requires a social welfare function external to the model. The framework can identify the trade-off (rigidity costs vs. variance costs), but it cannot adjudicate which trade-off is morally superior without importing normative weights that the scaffold-and-calibration heuristic explicitly excludes.

  ### Conclusion

  The scaffold-and-calibration framework successfully operationalizes the functional trade-offs between the two moral regimes, identifying them as distinct solutions to the problems of enforcement costs, information asymmetry, and adaptive efficiency. However, the debate often hinges on claims regarding the intrinsic dignity of autonomy or the sacredness of order, which function as axiomatic starting points rather than design variables. Consequently, the framework can model the *consequences* of these commitments but cannot process the *justification* for them, as the latter resides outside the domain of incentive-compatible governance.

  Verdict: The untranslatable residue points chiefly to the presence, in the folk-moral debate itself, of commitments about moral authority that are not institutionally operationalizable.
