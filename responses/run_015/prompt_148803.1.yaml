prompt: |-
  I've been leaning into the quining-qualia position — that positing qualia is incoherent because any attempt to specify them either collapses into functional descriptions or violates determinacy conditions on mental-state indentity (the Chase-Sanborn worry). I want to know what would genuinely count against this, not just the usual 'but I feel it' pushback. Which intuitions, formal results about mental representation, or cross-domain analogies actually damage the view? Which ones do defenders just brush off?

  Specifically, inject this twist: assume phenomenal concepts work like indexicals with two-dimensional rigidity — 'this pain' picks out its referent directly, without mediating descriptions. How does that assumption interact with the incoherence claim? Does it save qualia, or does it make the quiner's case stronger?

  Please lay this out in a table with these columns: Defeater, Type (intuition / formal result / analogy / other), Damage level (fatal / serious / awkward), Would a committed quiner concede?, Brief reason it lands or misses.

  Dont include citations or a reading list — I just want the conceptual exposure map. Keep it answerable without searching, but feel free to use that indexical-rigidity idea to push the argument somewhere weird.
