  ### The Indexical Twist: Does it Save Qualia or Aid the Quiner?

  Assuming phenomenal concepts work as rigid indexicals ("this experience") creates a paradoxical outcome for the quining position.

  **1. It saves qualia from the "Incoherence" charge.**
  The core quining argument relies on the claim that to specify a quale, you must describe it functionally or dispositionally. If you can't describe it, you can't refer to it, so the term is empty.
  *   **The Twist:** If "this pain" operates like "I" or "Now," it bypasses the need for description. It anchors reference causally or directly. This neutralizes the Chase-Sanborn worry because we don't need to compare descriptions across subjects to verify reference; we just need the indexical capacity. The claim that qualia are *incoherent* loses its semantic footing.

  **2. It strengthens the "Illusionist" charge.**
  However, this move exposes the *ontology* of the referent to sharper scrutiny.
  *   **The Weird Push:** If "this" is a rigid designator, it must latch onto *something*.
      *   **Option A:** It latches onto a physical/functional state. If so, qualia are real, but they are just physical states viewed indexically. The quiner accepts this but argues the "qualitative" feel is a misrepresentation of that physical state.
      *   **Option B:** It latches onto a non-physical property. The quiner argues this is impossible (causal closure), so the indexical is a "pointer to nowhere."
      *   **The Trap:** If the indexical is direct and infallible, how can we be wrong about the *nature* of the referent? The quiner exploits this: "You are right that you are having *an experience* (the indexical succeeds), but you are wrong that the experience has *intrinsic qualia* (the predication fails)."

  **Verdict:** The indexical assumption makes the *concept* of qualia coherent (defeating the semantic incoherence argument) but makes the *ontology* more vulnerable to an error theory. It forces the debate away from "Do the words make sense?" to "Is the pointer pointing at a ghost?" The quiner prefers the latter battlefield.
