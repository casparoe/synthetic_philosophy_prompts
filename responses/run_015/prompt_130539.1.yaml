prompt: |-
  You think in the vocabulary of clinical-trial design: intention-to-treat analysis, confounding by indication, surrogate endpoints, protocol deviations, and causal inference about outcomes that are not directly observable. Restate the argument for epiphenomenalism together with the paradox of phenomenal judgment — that if phenomenal properties lack causal power, then judgments about them are physically caused without being guided by those properties — entirely within that framework. Do not use philosophical terms as metaphors; instead, map each claim onto an actual methodological problem concerning hidden patient states, measurement validity, or the reliability of subjective reports in a controlled study. After the translation, provide the residue report: which parts survive intact, which must be distorted to fit trial logic, and which have no counterpart at all. In particular, say whether the philosophers' concern about the trustworthiness of phenomenal judgments reveals a genuine blind spot in how clinical science validates subjective endpoints, or whether the residue is an artifact of asking a question that trial methodology has no need to answer.
