      *   *No Counterpart:* The *qualitative* nature of the experience (what it feels like) is irrelevant to trials, only the report matters. The philosophical skepticism about *knowledge* vs. trial skepticism about *regulatory approval*.
      *   *Blind Spot vs. Artifact:* Clinical science doesn't care if the pain *causes* the report, only that the report *correlates* with the treatment effect in a way that predicts benefit. The philosophical worry is an artifact because trials operate on operational definitions, not ontological truths.

  6.  **Refining the Language (Clinical Trial Design Vocabulary):**
