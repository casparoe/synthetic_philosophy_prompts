      *   *Paradox of Judgment:* If mental states don't cause behavior, how can we talk about them? Our report "I am in pain" is caused by neural firing, not the pain itself. Thus, the report is unconnected to the truth of the experience. It undermines the reliability of self-report.

  3.  **Map to Clinical Trial Vocabulary:**
