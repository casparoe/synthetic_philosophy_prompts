          *   Judgment/Report = Recorded Primary Endpoint (Subjective).
          *   Causal Link = Path coefficient in a Structural Equation Model.
          *   Epiphenomenalism = The path coefficient from Latent Clinical State to Recorded Endpoint is zero.
          *   Paradox = If that path is zero, the Recorded Endpoint is not a valid measure of the Latent State, yet we treat it as such in efficacy analysis.

  5.  **Drafting the Residue Report:**
