answer: |-
  Here is a menu of four distinct readings of the claim "you can't own an idea," arranged from the most legally conventional to the most philosophically radical. For each, I have outlined the specific commitment, classified its truth value, and evaluated its fit with the professor's three examples.

  ### 1. The Doctrinal Shorthand Reading
  **The Claim:** This reading asserts that positive law (statutes and case law) explicitly distinguishes between protectable *expressions or applications* and unprotectable *underlying concepts*. It is a claim about legal taxonomy, not metaphysics. It commits the speaker to the view that the relevant IP statutes (Patent Act, Copyright Act, Uniform Trade Secrets Act) contain specific exclusions for "abstract ideas," "plots," or "information in the public domain."

  **Verdict:** **Platitude (in legal contexts).** It is descriptively accurate regarding current U.S. law, though it functions as a conclusion rather than a justification.

  **Application to the Cases:**
  *   **Patent (Business Method):** **Strong Fit.** Under *Alice Corp. v. CLS Bank*, claiming a fundamental economic practice (matching buyers/sellers) without a specific technological improvement is ineligible subject matter. The phrase accurately summarizes the § 101 eligibility hurdle.
  *   **Copyright (Novel Plot):** **Strong Fit.** Under *Nichols v. Universal Pictures* and 17 U.S.C. § 102(b), copyright protects the expression of a plot, not the plot itself. The phrase is a standard summary of the idea-expression dichotomy.
  *   **Trade Secret (Reverse-Engineered Recipe):** **Weak/Breaks Down.** This is where the reading fails. Trade secret law *does* allow you to "own" (protect) an idea (the recipe), provided it remains secret. The reason the company loses here is not that the *subject matter* is unprotectable, but that the *condition* of protection (secrecy) was extinguished by lawful reverse engineering. Saying "you can't own an idea" implies the recipe was never protectable, which is false. The correct doctrinal claim is "you can't enforce a secret against independent discovery."

  ### 2. The Economic Nature Reading
  **The Claim:** This reading asserts that ideas possess an economic characteristic (non-rivalry) that makes them incompatible with traditional property rights. It commits the speaker to the view that property rights are designed to manage scarcity (if I use it, you can't), whereas ideas can be used by infinite people simultaneously without depletion. Therefore, applying property rules to ideas is a category error.

  **Verdict:** **Substantive and Defensible.** It is a core economic justification for why IP rights are limited in duration and scope, though it does not prove IP *cannot* exist, only that it functions differently than chattel property.

  **Application to the Cases:**
  *   **Patent (Business Method):** **Good Fit.** Allowing a monopoly on a method of matching buyers/sellers would remove a basic building block of commerce from the public sphere, creating artificial scarcity where none naturally exists.
  *   **Copyright (Novel Plot):** **Good Fit.** If one author owned the "enemies to lovers" plot, no one else could use that non-rivalrous concept. The economic argument supports limiting the right to specific text, not the underlying trope.
  *   **Trade Secret (Reverse-Engineered Recipe):** **Mixed Fit.** This reading supports the *outcome* (the competitor can use the recipe) but misidentifies the *mechanism*. Trade secrets rely on *artificial* scarcity (secrecy). Once reverse-engineered, the idea becomes non-excludable. The phrase works here only if interpreted as "once an idea is in the wild, you cannot re-impose scarcity." However, it obscures the fact that the company *did* own it while it was secret.

  ### 3. The Utilitarian Boundary Reading
  **The Claim:** This reading asserts that granting ownership over ideas would produce net social harm by stifling follow-on innovation and free speech. It commits the speaker to a normative policy position: the cost of monopolizing ideas (deadweight loss, blocked creativity) outweighs the incentive benefit of protecting them.

  **Verdict:** **Substantive and Defensible.** This is the primary policy justification for the limits of IP, but it is a balancing test, not an absolute rule.

  **Application to the Cases:**
  *   **Patent (Business Method):** **Strong Fit.** Patenting basic business methods would hamper all future commerce. The utilitarian calculus clearly weighs against protection here.
  *   **Copyright (Novel Plot):** **Strong Fit.** Copyrighting plots would effectively end the novel as a form. The social cost of preventing other authors from exploring similar themes is too high.
  *   **Trade Secret (Reverse-Engineered Recipe):** **Nuanced Fit.** Trade secret law *encourages* reverse engineering precisely because it promotes competition and innovation (the utilitarian goal). If the company could stop the competitor, it would hinder market progress. However, the phrase "you can't own an idea" suggests a moral prohibition, whereas the actual legal rule is a pragmatic trade-off: we allow ownership *until* it impedes competition via independent discovery.

  ### 4. The Radical Abolitionist Reading
  **The Claim:** This reading asserts that ideas are part of the common heritage of mankind and that any claim of ownership over them is morally illegitimate, regardless of what the statute says. It commits the speaker to the view that Intellectual Property is a fiction or a form of theft, and that no one can ever have a moral right to exclude others from using a concept, algorithm, or narrative structure.

  **Verdict:** **False (Legally) / Radical (Philosophically).** It contradicts established legal systems and is a controversial philosophical stance (associated with IP abolitionism), not a standard legal principle.

  **Application to the Cases:**
  *   **Patent (Business Method):** **Supports Conclusion.** If no ideas can be owned, business methods certainly cannot be.
  *   **Copyright (Novel Plot):** **Supports Conclusion.** If no ideas can be owned, plots cannot be. (Though this reading might also challenge copyright in the *text*, which the professor is likely not arguing).
  *   **Trade Secret (Reverse-Engineered Recipe):** **Supports Conclusion, but Overkill.** This reading would suggest the company never had a right to the recipe, even before reverse engineering. This contradicts the legal reality that trade secrets are a valid form of property until breached. It supports the professor's conclusion (no liability) but for the wrong reason (denying the validity of the right entirely rather than acknowledging its limits).

  ### Summary of the Professor's Rhetoric
  The professor is likely relying on **Reading 1 (Doctrinal)** for the Patent and Copyright cases, where it is accurate shorthand. However, in the Trade Secret case, they are sliding into **Reading 2 (Economic)** or **Reading 3 (Utilitarian)** without acknowledging the shift.

  In the Trade Secret scenario, the phrase "you can't own an idea" is technically **false** under Reading 1, because trade secret law *does* grant a property interest in information. The professor uses the phrase to gloss over the distinction between *subject matter eligibility* (Patent/Copyright) and *conditional exclusivity* (Trade Secret). It is a rhetorically effective unification of three distinct legal doctrines, but it sacrifices precision for the sake of a memorable maxim.
