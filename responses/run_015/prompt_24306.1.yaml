      1.  Trivial: Legal shorthand for specific statutory exclusions.
      2.  Moderate: Economic nature of ideas (non-rivalry).
      3.  Strong: Normative/Utilitarian boundary setting.
      4.  Radical: Moral/Philosophical impossibility of IP.

      Let's go with that order.

