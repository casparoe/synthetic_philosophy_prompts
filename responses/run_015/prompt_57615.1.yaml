      *   *The Mechanism:* Despotism is legitimate *if* the end is improvement. The ruler acts as a trustee/guardian.
      *   *The Goal:* To make them capable of liberty eventually.
      *   *The Condition:* The ruler must actually improve them. If they stagnate, the legitimacy vanishes.
      *   *Key Texts:* *On Liberty* (Chapter 1), *Considerations on Representative Government* (Chapter 18).

  3.  **Translate to Development Vocabulary:**
