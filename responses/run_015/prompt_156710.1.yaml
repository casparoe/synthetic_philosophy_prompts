answer: |-
  Representational inertia offers a more robust account of scientific progress than Rorty's antirepresentationalism because it respects the constraint of predictive success. Rorty treats conceptual schemes as disposable tools, suggesting we should abandon them whenever a new vocabulary offers fresh social utility, but this fails to explain why science accumulates reliable knowledge rather than merely shifting cultural fashions. By contrast, representational inertia captures the genuine resistance scientists face when attempting to overhaul successful theories; it recognises that explanatory continuity is not just a philosophical preference but a necessary condition for progress itself. If we followed Rorty strictly, the transition from Newtonian physics to relativity might look like a mere change of topic, whereas representational inertia correctly identifies the struggle to preserve predictive accuracy while expanding scope. Ultimately, science progresses by conserving what works whilst extending reach, a nuance Rorty's antirepresentationalism dissolves in favour of unrestricted redescription.
