      *   *Refining the "Future Case":* To separate the rules derived in step 3 (Subjective Experience vs. Legitimate Expectation).
      *   *Case:* A player creates a complex emotional narrative using temporary props (that decay) in a public square. Another player clears the props before the narrative is finished.
