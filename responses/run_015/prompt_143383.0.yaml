      *Let's write it.*
answer: |-
  Here is a complete design for your session. It is built for 14 engineers, 60 minutes, using only paper, pens, and a whiteboard. It leverages your team's intuition about system dependencies to model historical evidence.

  # Exercise: The Provenance Chain

  **Fictional Scenario:** The "Kestrel Bridge Collapse" (1984).
  **The Consensus:** The bridge fell due to metal fatigue (Negligence).
  **The Counter-Claim:** The bridge was demolished by explosives (Conspiracy/Event Denial).
  **Goal:** The team must produce a "Final Report" on what happened.

  ## 1. Materials & Setup
  *   **Whiteboard:** Draw two columns: "Supports Fatigue" and "Supports Demolition."
  *   **Index Cards (30 total):** Pre-write these before the meeting.
      *   **Type A (The Chain):** 10 cards. Card 1 is a "Primary Inspection Log." Cards 2–10 are reports/articles that cite the previous card. (e.g., Card 2 cites Card 1, Card 3 cites Card 2...). All support "Fatigue."
      *   **Type B (The Spike):** 5 cards. All claim "Explosives Detected." They cite *nothing* but "Anonymous Source" or "Leaked Memo."
      *   **Type C (The Noise):** 15 cards. Irrelevant weather data, traffic stats, lunch menus.
  *   **Red & Black Markers:** Black for building claims, Red for challenging them.
  *   **Sticky Notes:** For "Citations."

  ## 2. The Rules (Hand this out or read it)
  1.  **Build Claims:** To write a fact on the board, you must attach an Evidence Card.
  2.  **Chain Dependencies:** If you use a Fact already on the board to support a new Fact, draw a line between them. This is a **Citation Chain**.
  3.  **Challenge Claims:** To cross out a Fact (Red Marker), you must attach *two* Evidence Cards that directly contradict it.
  4.  **The Goal:** Maximize the "Integrity Score" of the Final Report.
      *   +1 point for every Fact standing at the end.
      *   -5 points for every Fact that is later proven to rely on a false root.
      *   -10 points if the Final Report ignores a "Primary Source."

  ## 3. The Flow (60 Minutes)

  **Phase 1: Construction (20 mins)**
  *   Dump the cards face up on a table.
  *   Ask the group to build the "Consensus Narrative" (Fatigue) on the whiteboard using the cards.
  *   *The Trap:* They will naturally grab the Type A cards. They will form a long chain (Card 1 → Card 2 → ... → Card 10). It will look robust because it has 10 citations.
  *   *Your Role:* Do not speak. Let them build the tower.

  **Phase 2: The Injection (10 mins)**
  *   Midway through, hand 3 specific players (choose them quietly beforehand) one Type B card each ("Leaked Memo: Explosives Found").
  *   Tell them: "This just came in. It claims to be a Primary Source."
  *   *The Trap:* These cards look authoritative but have no provenance chain. They are the "Spike."
  *   Watch how the room reacts. Do they demand to see the chain for the Spike? Or do they demand to see the root of the Consensus Chain?

  **Phase 3: Adjudication (20 mins)**
  *   Stop building. Ask: "What is the Final Report?"
  *   They must decide: Fatigue, Demolition, or Unknown.
  *   They must justify *why* they rejected the opposing evidence.
  *   *Crucial:* Ask them to write down the "Standard of Proof" they used. (e.g., "We required two sources for X").

  **Phase 4: The Reveal & Debrief (10 mins)**
  *   Reveal the card types.
      *   Type A Root (Card 1) was actually solid (you decide this in debrief).
      *   Type B (The Spike) was a forgery (you decide this in debrief).
  *   **The Scoring:** Calculate their score based on their decisions.
  *   **The Debrief:** (See script below).

  ## 4. The Debrief Script (Plain Language)
  *Do not mention Holocaust or Armenia. Keep it on the Kestrel Bridge, then zoom out.*

  **Step 1: The Mechanism**
  "Look at the whiteboard. We built a chain of 10 citations for the Fatigue theory. It looked heavy. We had 1 or 2 cards for the Demolition theory. They looked light."
  "Who checked the root of the Fatigue chain? (Wait for hands). Who checked the root of the Demolition cards? (Wait for hands)."
  "Usually, in these games, people demand to see the blueprints for the big building, but they let the bulldozer in without a license."

  **Step 2: The Distinction**
  "This is the difference between Revisionism and Denialism."
  *   **Revisionism:** "I think the Fatigue report might be wrong. Let me check the root of the Fatigue chain *and* the root of the Demolition cards with the same magnifying glass." (Symmetric Skepticism).
  *   **Denialism:** "The Fatigue chain is 10 links long, so if I break Link 1, the whole thing is a lie. But the Demolition card is just one link, so I don't need to check it at all." (Asymmetric Skepticism).
  "Denialism isn't about saying 'No.' It's about having two different rulebooks for 'Yes' and 'No'."

  **Step 3: Citation Propagation**
  "You saw how Card 10 looked strong because it cited Card 9, which cited Card 8... That's Citation Propagation. In engineering, we call this a dependency chain. If `npm install` pulls in a library that pulls in a library that is compromised, your whole build is compromised. But you don't assume the *new* library is clean just because it's new."
  "Denialism relies on you being tired. It relies on you seeing a long chain and assuming it's heavy, when it might just be long."

  **Step 4: The Real World**
  "In history, the 'Fatigue Chain' is the consensus of thousands of historians. The 'Demolition Spike' is a pamphlet from 1990."
  "A honest reviser says: 'Show me the root of the consensus.' A denier says: 'The consensus is a conspiracy, but this pamphlet is truth.'"
  "The tell isn't the conclusion. It's the weight of the evidence required to change their mind."

  ## 5. What Will Go Wrong (First Run)
  1.  **The "Logic Puzzle" Trap:** Engineers love to optimize. They might treat this purely as a points game. They might accept the "Demolition" cards just to sabotage the score, knowing it's a game.
      *   *Fix:* In the intro, say: "This isn't a puzzle with a solution key. I'm observing *how* you decide, not *what* you decide."
  2.  **Politeness:** They won't challenge each other's citations.
      *   *Fix:* You (the facilitator) must play the "Devil's Advocate." If they accept a card too easily, you ask: "Who wrote that? Can we verify the signature?" Model the skepticism you want to see.
  3.  **Time Creep:** The chain building takes too long.
      *   *Fix:* Hard stop at 20 mins. Even if the board is empty. The pressure reveals the bias better than a finished board.

  ## 6. What The Game Cannot Reproduce (You Must Say This)
  *You need to close the session by acknowledging the simulation's limits.*

  "This game was sterile. In the real world, historical denialism isn't just about bad logic. It's about **identity** and **power**."
  1.  **Identity:** "If admitting the Kestrel Bridge was negligence costs you your pension, you will fight harder to believe it was demolition. In this game, nobody's pension was on the line."
  2.  **Power:** "Real denialism is often funded. They have think tanks. In this game, the 'Demolition' cards had the same weight as the 'Fatigue' cards. In reality, one side often has a megaphone and the other has a library."
  3.  **The Moral Weight:** "Getting this wrong in the game cost us 5 points. Getting it wrong in history costs people their dignity, or their safety, or the truth about their ancestors."

  "Use the tool (Symmetric Skepticism), but remember the stakes are higher outside this room."

  ## Why This Works for Engineers
  *   **Dependency Chains:** They understand that `A depends on B depends on C` means if C is broken, A is broken.
  *   **Root Cause Analysis:** They are trained to find the root cause, not just blame the top layer.
  *   **Audit Trails:** The "Citation Propagation" mechanic mimics a commit history. They know a commit history can be faked (squashed/rewritten), so they should be wary of long chains without signed commits (Primary Sources).

  This setup forces them to *enact* the bias without you accusing them of it. When you point out in the debrief that they checked the 10-link chain harder than the 1-link claim, they will feel the inconsistency in their own bones.
