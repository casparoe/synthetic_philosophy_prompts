      *   *Task:* Reach a consensus on what happened.
      *   *Observation Point:* Watch how they treat Pile A vs. Pile B. Do they demand to see the metadata on the Sabotage logs but accept the Whistleblower note at face value?
      *   *Citation Mechanic:* To state a fact, you must hold up a card. To challenge a fact, you must hold up a *better* card.
      *   *The "Citation Propagation" Request:* I need to make sure claims get passed and cited.
      *   *Idea:* "The Telephone Chain of Authority."
      *   *Round 1:* Person 1 writes a claim + source. Passes to Person 2.
      *   *Round 2:* Person 2 can accept (adds their name as 'verified by') or reject.
      *   *Round 3:* ...
      *   *This feels too abstract.*

      *   *Let's go back to the Asymmetry.* The key is *Standards of Proof.*
      *   *Game:* "The Burden of Proof."
      *   *Fictional Event:* The Sinking of the *SS Meridian*.
      *   *Consensus:* It was torpedoed (War Act).
      *   *Revisionist Claim:* It hit a mine (Accident).
      *   *Denialist Claim:* It never sank / It was faked.
      *   *Setup:* 14 Engineers. Split into 2 groups of 7.
      *   *Group 1 (The Builders):* Given a packet of evidence supporting the Torpedo theory.
      *   *Group 2 (The Auditors):* Given a packet of evidence supporting the Mine theory + a "Secret Mandate" (Don't tell them it's secret). The mandate is: "Your goal is to ensure no claim is accepted without absolute verification."
      *   *Wait, if I tell them the mandate, they'll game it.*
      *   *Better:* Give everyone the *same* mixed evidence. But give half the room a "Skeptic Badge" and half a "Historian Badge."
      *   *Skeptic Badge Rule:* "You gain points for finding inconsistencies."
      *   *Historian Badge Rule:* "You gain points for building a coherent timeline."
      *   *This creates the structural asymmetry.* The Skeptics will naturally drift toward denialism if they aren't careful (attacking the main narrative). The Historians will drift toward revisionism (adjusting the narrative).
      *   *Citation Mechanic:* To make a claim, write it on the whiteboard. To support it, draw an arrow from an Evidence Card ID. To challenge it, draw a red line.
      *   *Citation Propagation:* If I use your claim as evidence for my claim, I cite your ID.
      *   *The Trap:* If the root claim is weak, the whole tree is weak.
      *   *The Denier Move:* Attacking the root of the Historians' tree with weak evidence, while building their own tree on a single unverified "Whistleblower" card.

  5.  **Refining the Game Design (The "Audit Trail" Exercise):**
      *   **Title:** The Audit Trail.
      *   **Fiction:** The "Kelson Bridge Collapse" (1982).
      *   **Consensus:** Structural failure due to corrosion (Negligence).
      *   **Dissent:** It was an explosive demolition (Conspiracy/Event Denial).
      *   **Materials:**
          *   30 Evidence Cards (mixed reliability).
          *   Whiteboard.
          *   Red and Black markers.
          *   Sticky notes.
      *   **Setup:**
          *   14 Engineers.
          *   Split into 2 teams (7 each).
          *   Team A: "Commission" (Task: Reconstruct the event).
          *   Team B: "Oversight" (Task: Verify the Commission's findings).
      *   **The Twist (Crucial):**
          *   Team A gets 10 cards supporting Corrosion (5 Strong, 5 Weak).
          *   Team B gets 10 cards supporting Demolition (2 Strong, 8 Weak) + 3 "Universal" cards (Neutral).
          *   *Wait, this biases them too obviously.*
          *   *Better:* Everyone gets the *same* deck. But the *Scoring* is different.
          *   *Actually, let's keep it simple.* Everyone is a "Review Board."
          *   *Facilitator Role:* I (the user) will play the "Provocateur." I will introduce a denialist argument during the session to see how they swat it down.
          *   *No, the prompt wants the *players* to exhibit the behavior.*
          *   *Okay, the "Asymmetric Standards" Mechanic:*
          *   Deal the evidence.
          *   Rule 1: To add a fact to the Whiteboard (The Official Record), you must attach an Evidence Card.
          *   Rule 2: To remove a fact, you must attach *two* Evidence Cards that contradict it.
          *   Rule 3: You can cite another Player's Fact as evidence for your Fact (Citation Propagation).
          *   *The Trap:* If someone builds a house of cards (Fact A cites Fact B cites Fact C), and Fact C is weak, the whole thing falls.
          *   *The Denialist Test:* Introduce a "Poison Pill" card. One card says "Official Report Faked." It has low provenance.
          *   *Watch:* Do they demand high proof to accept the Official Report (which has many citations), but low proof to accept the Poison Pill?
          *   *Actually, I need to engineer the asymmetry.*
          *   *Idea:* Give 3 players a hidden role: "The Auditors." Their goal is to find *any* error. The rest are "The Historians." Their goal is to find *the truth*.
          *   *The Auditors will naturally act like deniers* (nitpicking the main narrative, accepting any counter-claim).
          *   *The Historians will act like revisionists* (weighing evidence).
          *   *This works.* It creates the structural difference without labeling it "denialism."

  6.  **Developing the Debrief:**
      *   Need to map "Auditor Behavior" to "Denialism."
      *   Need to map "Historian Behavior" to "Revisionism."
      *   Key concept: "Symmetric Skepticism."
      *   Plain language: "Did you check the engine the same way on both cars?"

  7.  **Predicting Failure Modes:**
      *   Engineers might treat it as a logic puzzle to "win" rather than a simulation of reasoning.
      *   They might spot the hidden roles immediately.
      *   They might be *too* polite to challenge each other.
      *   The "Citation Propagation" might become too complex to track on a whiteboard in 1 hour.
      *   *Fix:* Simplify the citation mechanic. Just draw lines.

  8.  **Limitations:**
      *   Real denialism is ideological/emotional. This is intellectual.
      *   Real denialism has political power dynamics. This is a flat room.
      *   I (the facilitator) have to point out the moral weight, because the game is sterile.

  9.  **Finalizing the Plan:**
      *   **Scenario:** The "Aurora Station Power Failure" (Fictional Space Station). Keeps it tech-adjacent but distant from human suffering.
      *   **Mechanic:** "Chain of Custody."
      *   **Hidden Roles:** 3 "Skeptics" (goal: find flaws), 11 "Investigators" (goal: find truth).
      *   **Evidence:** Cards with "Reliability Ratings" (some visible, some hidden).
      *   **Citation:** Drawing dependency lines on the whiteboard.
      *   **Scoring:** Points for valid claims, penalty for broken chains.
      *   **Debrief:** Focus on the *direction* of their skepticism.

      *(Self-Correction during drafting)*: 1 Hour is tight. 14 people is a lot.
      *   Split into 2 groups of 7 for the first 30 mins.
      *   Reconvene for 30 mins.
      *   This allows comparison between groups.
      *   Actually, keep them together for the "social pressure" aspect. Denialism often thrives in groups.
      *   Let's stick to one big group, but use the Hidden Roles to create friction.
      *   Wait, if I give hidden roles, I'm *creating* the deniers. The prompt asks for the *distinction* to show up.
      *   *Better:* No hidden roles. Give everyone the same goal. But structure the *Evidence Packet* to trigger the asymmetry.
      *   *How?* The "Consensus" is supported by a long chain of secondary sources (Citation Propagation). The "Counter-Claim" is supported by one "Leaked" primary source.
      *   *Rational actors* should prefer the Primary source.
      *   *Denialists* will use the Primary source to dismiss the whole chain without checking the chain's roots.
      *   *Revisionists* will check if the Primary source actually contradicts the chain.
      *   *Okay, let's refine the "Citation Propagation" mechanic.*
      *   Players pass a claim. Each adds a citation.
      *   At the end, the claim looks solid (10 citations!).
      *   But the first citation was weak.
      *   *Task:* Evaluate the claim.
      *   *Observation:* Who checks the *root* citation? Who just counts the *number* of citations?
      *   *Denialist Tell:* "This whole chain is fake because Citation #1 is shaky." (Valid). BUT "This single counter-claim is true because it says it's true." (Invalid).
      *   *Okay, I have the design.*

      *   **Game Name:** The Provenance Chain.
      *   **Fiction:** The "Zeta-9 Data Wipe."
      *   **Materials:** Index cards, whiteboard.
      *   **Rounds:**
          1.  Build the Chain (Citation Propagation).
          2.  Introduce the Anomaly (The Counter-Evidence).
