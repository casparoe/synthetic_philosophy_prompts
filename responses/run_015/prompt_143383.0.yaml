      *   **Scoring:** Based on identifying *where* the break is, not *what* the truth is.

      *(Wait, one more check on the Prompt)*: "The thing that separates the honest reviser from the denier has to be structural — something about how they treat evidence."
      *   My design needs to make them *choose* a standard of proof.
      *   I will give them a "Rulebook" that is slightly ambiguous about how to weigh conflicting evidence.
      *   This forces them to invent their own standard in the moment.
      *   That's where the bias reveals itself.

      *(Final Polish on Failure Modes)*:
      *   They might solve it too fast.
      *   They might ignore the rules.
      *   They might be too nice.
      *   *Mitigation:* I need to be an active facilitator, nudging the conflict.

