prompt: |-
  I run a monthly "thinking tools" hour at work — about 14 backend engineers, one hour, one whiteboard — and next month I want to do the difference between ordinary historical revisionism and straight-up denialism (the Holocaust / Armenian genocide / Nanjing kind of thing). Constraint: I don't want to use any of the real events as the material. It's a work event and it's too raw, and more importantly everyone already knows the "right" answer, so all you'd see is people being careful — the mechanism never shows up.

  So: design me a game or structured exercise around a made-up historical episode, where nobody in the room has any prior knowledge of what actually happened, and the thing that seperates the honest reviser from the denier has to be structural — something about how they treat evidence — not about who turns out to be right. The mechanic I'd really like built in is citation propagation: claims get passed player to player, each pass adding another citation, so a claim ends up looking well-sourced without anybody ever having checked anything.

  My own half-baked theory is that the actual tell is that the denier's skepticism only ever points one direction — hyper-rigorous about the evidence for the event, weirdly credulous about anything that undermines it — but I don't know how to make that felt instead of just said.

  Give me rules, materials, a scoring scheme that needs nothing but paper, and a debrief that maps what happened onto the distinction. They should run into it before I name it. Also: what's going to go wrong the first time, and which part of the real distinction the game just can't reproduce and I'll have to say out loud myself? I've got no philosophy or history background, so keep the debrief in plain langauge.
reasoning: |-
  Here's a thinking process that leads to the suggested exercise:

  1.  **Analyze the Request:**
      *   **Context:** Monthly "thinking tools" hour at work (14 backend engineers, 1 hour, 1 whiteboard).
      *   **Topic:** Distinguishing between ordinary historical revisionism (healthy skepticism/re-evaluation) and denialism (bad-faith rejection of established fact, e.g., Holocaust denial).
      *   **Constraint 1:** Cannot use real-world atrocities (too raw, everyone knows the "right" answer, inhibits honest engagement).
      *   **Constraint 2:** Must use a made-up historical episode.
      *   **Core Mechanic:** Citation propagation (claims gain credibility as they are passed along, mimicking "telephone" but with sources).
      *   **Core Insight to Demonstrate:** Denialism is structurally asymmetric (hyper-skeptical of confirming evidence, hyper-credulous of disconfirming evidence).
      *   **Deliverables:** Rules, materials, scoring scheme (paper only), debrief (plain language), prediction of failure modes, limitations of the simulation.
      *   **Audience:** Backend engineers (likely analytical, systems-oriented, familiar with data integrity/logs).

  2.  **Deconstruct the Core Insight (Revisionism vs. Denialism):**
      *   *Revisionism:* "New evidence suggests we might need to adjust the magnitude or specific details of Event X." (Symmetric skepticism).
      *   *Denialism:* "Event X never happened." (Asymmetric skepticism: Demands impossible proof for X, accepts anecdotal proof for Not-X).
      *   *The Mechanic:* Citation propagation creates an illusion of authority. Engineers understand "garbage in, garbage out" and "dependency chains." This is perfect for them.

  3.  **Drafting the Scenario (The Made-Up History):**
      *   Needs to be neutral but plausible.
      *   Idea: A fictional industrial accident or a fictional diplomatic incident.
      *   Let's go with "The Great Glitch of '84" or something similar? No, too techy.
      *   Let's go with a fictional city event. "The Burning of Port Veridia."
      *   *Narrative:* A fire happened. Did it burn down the whole city or just a warehouse? Was it arson or accident?
      *   *Setup:* There is a "Consensus Narrative" (it was a big fire, accidental) and "Dissenting Narrative" (it was small, arson, or didn't happen).
      *   *Actually:* To make the game work, the "truth" doesn't matter as much as the *process* of evaluating claims. But for the debrief, we need a ground truth to compare against. Let's establish a "Master Archive" that the facilitator holds.

  4.  **Developing the Mechanic (Citation Propagation):**
      *   Players need to build arguments.
      *   They need "Source Cards."
      *   *Twist:* A source card can cite another source card.
      *   *The Trap:* If Player A cites Player B, and Player B cites Player C, it looks like a chain of evidence. But if Player C made it up, the whole chain is rotten.
      *   *The Asymmetry:* Give some players a "Skeptic" role and some a "Believer" role, but don't tell them that's the distinction. Tell them they are "Researchers."
      *   *Better Approach:* Split the room into two teams investigating the *same* event but with different *incentives*.
      *   *Best Approach for "Feeling" the Distinction:* Everyone is a researcher. But the *evidence packet* they receive is weighted.
      *   *Wait, the prompt asks for the distinction to be structural.*
      *   *Idea:* Give everyone the same pile of "documents." Some are primary, some are secondary, some are hearsay.
      *   *Task:* Construct a timeline.
      *   *The Kicker:* Introduce a "Counter-Claim" mechanic. To challenge a claim, you must produce a source.
      *   *The Denialist Tell:* They will challenge the "Fire Happened" claims with extreme rigor (demanding primary sources) but accept "Fire Didn't Happen" claims with low rigor (accepting hearsay).
      *   *How to force this?* We can't force it. We have to *observe* it.
      *   *Refinement:* Split the group. Group A is tasked with "Verify the Event." Group B is tasked with "Audit the Event."
      *   *Actually, let's look at the "Citation Propagation" request again.* "Claims get passed player to player, each pass adding another citation."
      *   *Game Flow:*
          1.  Start with a base claim.
          2.  Pass it down the line.
          3.  Each person adds a "reference" to support it.
          4.  At the end, evaluate the strength of the chain.
      *   *Problem:* This simulates misinformation spread, not necessarily denialism.
      *   *Solution:* We need a *conflict* phase.
      *   *Revised Game:* "The Archive Audit."
      *   *Setup:* A fictional event (The Collapse of the Silo 7).
      *   *Materials:* Index cards representing "Evidence."
      *   *Roles:* Half the room are "Archivists" (building the history), half are "Auditors" (checking the history).
      *   *The Twist:* The Auditors are given a secret objective: "Find flaws." The Archivists are given "Build a coherent narrative."
      *   *No, that's too gamified.*
      *   *Let's try this:* Everyone gets a packet of "Leaked Documents." Some are real (within the fiction), some are forgeries. The facilitator knows which are which.
      *   *The Activity:* Group discussion to establish "What happened."
      *   *The Trap:* The Facilitator acts as a "Denier" (subtly) or plants a "Denier" in the group? No, that's risky.
      *   *Let's use the Engineer Brain:* Treat history like a distributed system.
      *   *Game:* "Consensus Protocol."
      *   *Scenario:* The "Veridian Blackout." Did the power grid fail because of sabotage (Event) or just a storm (Non-Event)?
      *   *Evidence:* 20 slips of paper.
          *   Type 1: Primary Logs (High reliability).
          *   Type 2: News Reports (Medium).
          *   Type 3: Forum Posts (Low).
      *   *Distribution:*
          *   Pile A (Supports Sabotage): Mostly Type 1 & 2.
