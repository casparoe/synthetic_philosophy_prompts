answer: |-
  Here is a plan for the fifty-minute section, designed to isolate the epistemological structure of self-locating belief without getting bogged down in metaphysics or decision theory.

  ### 1. The Session Arc (50 Minutes)

  *   **00–05: The Monty Hall Bridge.**
      *   Briefly recap Monty Hall. Do not re-solve it. Ask: *Why did the probability shift?*
      *   Target answer: The host's action was *constrained* by the location of the prize. Your observation was not a random sample of all possible door-openings; it was a sample from a protocol.
      *   Transition: "Today, the protocol constrains not which door opens, but *when* you observe."
  *   **05–15: The Setup (Standard Case).**
      *   Present the Sleeping Beauty protocol clearly.
      *   **Crucial framing:** Emphasize the *indistinguishability* of the awakenings. She has no clock, no memory of prior awakenings.
      *   **The Question:** "Upon awakening, what is your credence that the coin landed Heads?"
      *   **Vote:** Get a show of hands for 1/2, 1/3, and Other. Do not comment on the distribution.
  *   **15–30: The Conflict (The "Puzzle" Phase).**
      *   Elicit the Halfer argument: "The coin is fair. I learn nothing new. Credence stays 1/2."
      *   Elicit the Thirder argument: "If we run this 100 times, 2/3 of awakenings are Tails. I should match my credence to my expected frequency."
      *   **Instructor Role:** Do not resolve. Instead, press the Halfer on *what* proposition is being evaluated, and press the Thirder on *why* frequency dictates single-case credence.
  *   **30–40: The Indexical Turn.**
      *   Introduce the concept of **Centred Evidence**.
      *   Contrast: "The coin is Heads" (uncentred) vs. "It is now a Heads-awakening" (centred).
      *   Demonstrate that "I am awake" is not a tautology in this context. It is an event that is *more likely to occur* given Tails than given Heads (because Tails guarantees two occurrences, Heads only one).
      *   Use the "Revealed Day" test (see Closing Question) to solidify this.
  *   **40–45: Misconception Cleanup.**
      *   Address the specific misconceptions mapped below (Betting, Frequency vs. Credence).
  *   **45–50: Closing Question & Exit.**
      *   Pose the diagnostic question. Collect answers (or mental commitment) as they leave.

  ---

  ### 2. From Monty Hall to Sleeping Beauty

  To ensure this looks like a puzzle and not a trick, you must bridge the gap between **spatial selection** (Monty Hall) and **temporal selection** (Sleeping Beauty).

  *   **The Monty Hall Lesson:** In Monty Hall, students accept that $P(Prize|Door Opened) \neq P(Prize)$. Why? Because the *process* generating the observation is biased. The host *cannot* open the prize door.
  *   **The Bridge:** In Sleeping Beauty, the *process* generating the observation (the awakening) is also biased. The protocol *must* wake her twice on Tails, but only once on Heads.
  *   **The Friction Point:** In Monty Hall, the "new information" is obvious (a specific door opened). In Sleeping Beauty, the "new information" is obscure (the experience of awakening).
  *   **How to get there:** Ask the students: "In Monty Hall, did you learn where the car is?" (No). "Did you learn which door the host *could* open?" (Yes). "In Sleeping Beauty, do you learn the coin result?" (No). "Do you learn which *awakenings* are possible for you to experience?" (Yes).
  *   **The Goal:** Move them from thinking "I learned nothing about the coin" to "I learned something about my *location* in the experiment, which is correlated with the coin."

  ---

  ### 3. The Carrying Case: Standard vs. Duplication

  **Do not use the Duplication Variant.** Argue yourself out of it as follows:

  *   **The Trap:** Duplication variants (e.g., "Beauty is cloned on Tails") smuggle in metaphysical questions about personal identity ("Which copy am I?"). First-year students will latch onto the metaphysics of consciousness rather than the logic of conditionalization.
  *   **The Distraction:** If the problem becomes "Am I the original or the copy?", the epistemological lesson about *indexical evidence* is obscured by the ontological lesson about *persistence*.
  *   **The Standard Case Advantage:** The Standard Case relies on **temporal indexicality** ("When am I?"), which is less controversial than **numerical identity** ("Who am I?"). Everyone agrees Beauty is the same person on Monday and Tuesday; they disagree on whether "It is Monday" is evidence.
  *   **Making "Nothing New" Tempting:** To make the Halfer intuition feel robust (rather than obtuse), you must stress the **qualitative identity** of the awakenings. If the room looks different on Tuesday, the puzzle vanishes. To keep the puzzle alive, insist that the *phenomenology* is identical. This makes the claim "I learned nothing" feel plausible (no new *qualitative* data) while allowing the Thirder to argue that the *fact* of having the experience is the data.

  **What the case must contain:**
  1.  **Amnesia:** Essential. Without it, she knows if it's Tuesday.
  2.  **Indistinguishability:** Essential. Without it, she has non-indexical evidence.
  3.  **The Protocol:** Must be clear that awakenings are *caused* by the coin state.

  **What the case must lack:**
  1.  **Betting Stakes:** Do not mention money yet (see Misconception Map).
  2.  **External Observers:** Do not introduce a bystander guessing Beauty's credence; it confuses the first-person perspective.

  ---

  ### 4. The Misconception Map

  You must distinguish between **pre-emptive blocks** (stop them before they derail the discussion) and **reactive corrections** (deal with them after the philosophical tension is felt).

  | Misconception | The Move | Timing | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"The coin is fair, so it's 1/2."** | Confusing Prior with Posterior. | **Pre-emptive (Min 10)** | Explicitly grant $P(Heads) = 1/2$ on Sunday. Stipulate the question is *upon awakening*. |
  | **"1/3 is just frequency, not credence."** | Dismissing Thirder as frequentist error. | **Pre-emptive (Min 10)** | Define credence as "degree of belief suitable for guiding action in a single case." Ask: "If you believe 1/2, but the frequency is 1/3, are you irrational?" |
  | **"It depends on how the bet is paid."** | Pragmatic Encroachment. (e.g., "If I'm paid per awakening, I bet Tails.") | **Pre-emptive (Min 10)** | **Ban betting talk.** State clearly: "We are asking about *belief*, not *wagering strategy*. Assume you get no reward for being right." |
  | **"She learns nothing new."** | The Halfer Core. | **Reactive (Min 20)** | **Do not block.** This is the engine of the session. Let them argue it. Your job is to rephrase it: "You mean she learns no *uncentred* facts." |
  | **"Tuesday doesn't exist on Heads."** | Sample Space Error. | **Reactive (Min 30)** | When drawing the tree, ensure they see {Heads-Mon, Tails-Mon, Tails-Tue} as the three *possible awakening experiences*, not just coin outcomes. |
  | **"It's 1/2 because Monday is 50/50."** | Ignoring the Tails-Tue link. | **Reactive (Min 30)** | Ask: "Given you are awake, what is the probability it is Tuesday?" If they say 0, ask why. If they say 1/3, ask how that squares with Heads=1/2. |

  ---

  ### 5. Closing Question & Refusals

  **The Closing Question:**
  Do **not** use the "Monday Night Toss" variant.
  *   *Why:* If the coin is tossed Monday night, then upon Monday awakening, the outcome *does not exist yet*. This changes the problem from updating on evidence to predicting a future event. It validates the Halfer position too easily (credence in a future fair coin is 1/2) and fails to test whether they understand *indexical evidence* in the original case. It muddies the causal structure.

  **Use "The Revealed Day" Variant instead:**
  *   *The Question:* "Suppose that, upon awakening, Beauty is told: 'It is Monday.' Her credence in Heads is now clearly 1/2. Suppose she is told nothing. Why should her credence differ?"
  *   *Why this works:* It forces them to isolate the evidential value of the indexical "Now."
      *   If they say "It shouldn't differ," they deny that self-location is evidence (Hard Halfer).
      *   If they say "It differs because being awake on Monday is more likely given Heads," they have grasped the likelihood ratio.
      *   If they say "It differs because 'It is Monday' rules out Tuesday," they grasp the sample space reduction.
  *   *Success Criterion:* You know the point has landed if they articulate that **"It is Monday" eliminates a possible awakening (Tails-Tuesday) that "I am awake" does not.**

  **What to Openly Refuse to Explain:**
  1.  **Betting Arguments (Dutch Books):** You identified this, and it is correct. Betting arguments conflate *epistemic rationality* with *pragmatic utility*. In a 50-minute intro, this leads to students thinking the answer is "whatever makes you rich," which is wrong.
  2.  **Everettian/Many-Worlds:** You identified this. It introduces branching ontology which is irrelevant to the logic of conditionalization.
  3.  **Formal Centred-Worlds Semantics:** Do not introduce Lewis-Stalnaker formalism (sets of centred worlds). It is too technical. Stick to the intuition of "possible awakening experiences."
  4.  **The "Self-Indication Assumption" (SIA):** Do not name-drop SIA or SSA (Self-Sampling Assumption). These are labels for the solutions, not tools to find them. Using them encourages students to memorize labels rather than reason through the evidence.

  **Final Instruction:**
  End the session by saying: "We have not solved Sleeping Beauty today. We have identified *why* it is hard. It is hard because we do not yet agree on whether 'I am here now' counts as evidence." This validates their confusion as a philosophical insight rather than a failure to understand the math.
