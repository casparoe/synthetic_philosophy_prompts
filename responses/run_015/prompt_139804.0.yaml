answer: |-
  **Project Title:** The Metric Gap: Can Deflationism Account for Gradational Accuracy?

  **Project Summary**
  Deflationism about truth holds that the concept of truth is exhausted by the equivalence schema (e.g., "It is true that snow is white" is equivalent to "Snow is white"). When challenged on the normative role of truth—why we *ought* to believe what is true—deflationists employ an *inheritance strategy*. They argue that norms attach to the embedded sentence (e.g., one ought to believe that snow is white) and are transmitted to the truth claim via the schema. This strategy works for *categorical* norms: whether to assert, believe, or defer. However, it fails for *gradational* norms. In inquiry, we routinely rank maps, forecasts, models, and verdicts by how *close* they are to the truth. We trade accuracy for completeness; we say one mistaken inquirer is nearer the mark than another. There is no sentence *p* such that the schema transmits a norm about being *closer* to the truth than *q*, because the schema treats truth as a binary switch, not a metric. This project investigates whether this "metric gap" is fatal to deflationism or merely indicates a boundary condition.

  **The Research Question**
  Rather than asking broadly whether deflationism is true, this monograph tests three specific component theses against the gradational case:
  1.  **The No-Nature Claim:** Truth has no underlying nature that could ground a metric of similarity.
  2.  **The No-Explanation Claim:** Truth explains nothing; normative force is inherited from the content.
  3.  **The Schema-Exhaustion Claim:** The equivalence schema captures the entire functional role of the truth predicate.

  The core question is: Can any version of deflationism accommodate genuine gradational accuracy facts without either (a) taking closeness-to-truth as a substantive primitive alongside thin truth, or (b) eliminating gradational talk in favour of non-truth-theoretic surrogates (e.g., predictive success)? If neither is available, does this require a substantive supplementation of deflationism, or a reconstrual of the thesis itself?

  **Context and Motivation**
  The existing dialectic leaves this question open because both sides assume the relevant norms are categorical. Critics attack deflationism using the norm of assertion or the aim of belief; deflationists reply with inheritance derivations. Consequently, the debate stalls in a loop of binary norms. Simultaneously, the literature on verisimilitude and approximate truth in the philosophy of science has developed independently, assuming that truthlikeness is a problem for realists, not deflationists. This project bridges that silence. It argues that the stalemate in truth theory exists because the hardest cases—cartographers choosing between a complete map with large errors and an incomplete one with small errors; biologists using deliberately idealised models; juries returning partial verdicts—have been excluded from the analysis.

  **Method and Structure**
  The method is conceptual analysis focused on the normative role of truth in inquiry, rather than logical consistency or expressive utility.
  *   *Why not the Liar Paradox?* Logical paradoxes test the consistency of the truth predicate, but the metric gap is about the *value* of truth in reasoning. A logic that solves the Liar may still lack resources for ranking false models.
  *   *Why not Expressive Utility?* Arguing that truth allows for generalisation ("Everything he said is true") explains the predicate's convenience, not why we value one generalisation over another based on accuracy.
  *   *Why not a general book on truthlikeness?* That scope is too large. This monograph remains tight by focusing exclusively on the *compatibility* of truthlikeness with deflationary constraints.

  **Proposed Chapter Structure (35,000 words)**
  1.  **The Inheritance Strategy:** Establishing the deflationist baseline using categorical cases (assertion, belief).
  2.  **The Metric Gap:** Demonstrating the failure of inheritance in gradational cases (forecasting, modelling, legal verdicts).
  3.  **Stress-Testing Deflationism:** Applying the three component theses (No-Nature, No-Explanation, Schema-Exhaustion) to the gap.
  4.  **Three Responses:** Evaluating Division of Labour (truth is thin, truthlikeness thick), Eliminationism (gradational talk is merely instrumental), and Constructionism (building metrics from deflationary materials).
  5.  **The Verdict:** Arguing for a reconstrual of deflationism as a claim about predicate function rather than property, or accepting a substantive supplementation.

  **Work Plan**
  *   **Months 1–3:** Draft Chapters 1 and 2. *Risk:* Defining the "metric" without smuggling in substantive truth.
  *   **Months 4–7:** Draft Chapters 3 and 4. *Risk:* The Constructionist option may appear trivially available; I must rigorously define "deflationarily admissible materials."
  *   **Months 8–10:** Draft Chapter 5 and integrate.
  *   **Months 11–12:** Revision and external review.
  *   **Sticking Point:** I expect to get stuck in Chapter 4 on whether a measure over propositions counts as a "substantive property." I will resolve this by consulting constraints on logical complexity rather than metaphysical weight.

  **Possible Conclusions**
  1.  **Division of Labour:** Truth is thin, but truthlikeness is a separate, substantive posit. (Cost: Explaining the discontinuity).
  2.  **Eliminationism:** Gradational talk is merely instrumental. (Cost: Undermining epistemology and philosophy of science).
  3.  **Constructionism:** Closeness-to-truth is built from deflationary materials. (Cost: Defining admissibility).
  4.  **Re-construal:** Deflationism is true only as a claim about the truth *predicate's* function, not the property. The gradational case forces this shift.

  **Failure Modes and Scope**
  Two failure modes are anticipated. First, the Constructionist option may turn out to be trivially available, suggesting the metric gap was illusory. Second, the debate may dissolve into a verbal dispute over the definition of "deflationism." The project is designed to treat these as *results* rather than collapses. If constructionism is trivial, the monograph demonstrates deflationism's robustness. If the dispute is verbal, the monograph clarifies the functional boundaries of the concept. 35,000 words is the correct scope: it is too narrow for a general treatise on truth but sufficient for a single, determinate argument regarding the interface of truth theory and epistemic value. A longer work would invite scope creep into logic or metaphysics; a shorter one would lack the space to rigorously test the three component theses.
