answer: |-
  (1) Exam Question

  **Ethics 505: Take-Home Final**
  **Time Limit:** 48 Hours
  **Word Count:** ~1200 words (±10%)

  **Prompt:**
  John Taurek argues that in rescue cases, the number of people at stake shouldn't dictate our moral obligation. Instead, we should show equal concern by giving each individual an equal chance of being saved (e.g., flipping a coin). His strategy relies on pairwise comparisons: you compare the loss to A against the loss to B, not the sum of losses.

  Here's the twist: Imagine you can intervene in one of two scenarios.
  Option A: Save a group of 5 people. Each has an independent 70% chance of survival if you act.
  Option B: Save 1 person. They have a 99% chance of survival if you act.

  Taurek might insist we focus on the actual outcome for the individual, not the statistics. But does introducing probability force us to calculate expected value? Write an essay taking a **definite stance** on whether this probabilistic framework smuggles aggregation back into Taurek's view or if he can successfully block it by insisting on actual outcomes over probabilities. Don't hedge. Pick a side and defend it with reasons.

  ***

  (2) Model Answer

  Taurek's central claim in "Should the Numbers Count?" is that we lack a coherent moral arithmetic to sum up separate losses. He argues that losing five lives isn't morally worse than losing one, because there's no single subject who experiences the "sum" of the loss. To show equal concern, he suggests randomizing selection, like a coin flip. However, when we introduce probabilistic outcomes into the rescue scenario, Taurek's pairwise comparison strategy faces a serious threat. I argue that the probabilistic twist does indeed smuggle expected-value aggregation back into his framework, and Taurek cannot block this move by insisting on actual outcomes without abandoning the rationality of decision-making under uncertainty.

  The core of Taurek's view is that moral weight attaches to individuals, not collections. In a standard deterministic case (save 1 or save 5), he says we shouldn't just save the five because that treats the group as a container of value. But the probabilistic case changes the ontology of the choice. We aren't choosing between "5 die" and "1 dies." We are choosing between a distribution of risks. In Option A, we are purchasing 3.5 expected lives saved (5 people × 0.7 probability). In Option B, we are purchasing 0.99 expected lives saved. If morality requires us to be effective agents, ignoring this disparity seems irrational.

  Taurek might respond by saying probabilities aren't outcomes. He could insist that what matters is who actually survives ex post, not the ex ante chances. He would argue that for any specific person in the group of five, their individual chance (70%) is still lower than the single person's chance (99%). Therefore, if we focus on pairwise comparison between the single person and any one member of the group, the single person has a stronger claim to rescue based on likelihood of success. This attempts to preserve his individualism while acknowledging the risk.

  However, this defense fails because it ignores the aggregate nature of the risk distribution itself. When Taurek compares the single person to one member of the five, he artificially isolates that member from the others. But the decision affects all five simultaneously. By choosing Option A, you are committing to a strategy that yields a higher total probability of survival across the affected population. To reject this is to say that the sum of probabilities doesn't matter. But if the sum of probabilities doesn't matter, then risk reduction itself loses moral significance.

  Furthermore, insisting on "actual outcomes" is a category error in decision theory. We must decide ex ante. We cannot wait for the outcomes to determine if the choice was right. If we consistently choose options with lower expected value, we will save fewer lives over time. Taurek's framework works in one-off deterministic cases because the loss is certain either way. But when success is uncertain, the "value" of the action is intrinsically tied to the probability of success. If Taurek admits that a 99% chance is better than a 1% chance for a single person, he admits that probability scales moral weight. Once he admits that, he cannot stop us from scaling it across multiple people.

  If probability counts for one person, it must count for five. If I can increase Person A's survival from 1% to 99%, I have done a good thing. If I can increase Persons A, B, C, D, and E's survival from 0% to 70%, I have done that good thing five times. Taurek wants to say these aren't additive. But in the probabilistic context, they are mathematically additive in terms of expected utility. To deny this is to deny the mathematics of risk.

  Some might argue Taurek can block this by saying we should still flip a coin between the options. But that seems absurd here. Why would we give a 50% chance to an option that yields less than 1 expected life saved over an option yielding 3.5? Doing so treats the expected lives as irrelevant. This reveals that Taurek's view relies on a deterministic worldview where outcomes are certain. Once uncertainty enters, the "numbers" return as probabilities. You can't separate the number of people from the probability of saving them without rendering the decision arbitrary.

  Ultimately, the probabilistic twist exposes that Taurek's rejection of aggregation relies on ignoring the magnitude of benefit. In deterministic cases, the benefit is "life" for either side. In probabilistic cases, the benefit is "expected life." Since 3.5 expected lives is greater than 0.99 expected lives, the aggregation returns. Taurek cannot block this by appealing to actual outcomes because moral agents must act on expectations, not prophecies. Therefore, the probabilistic framework collapses his distinction, forcing us to accept that numbers count when they are expressed as probabilities.

  (3) Marking Scheme (Total: 20 Points)

  1.  **Accurate Reconstruction of Taurek (4 pts)**
      *   *Must:* Correctly explain pairwise comparison and the "no summing losses" claim.
      *   *Common Blow:* Students confuse Taurek with utilitarianism or claim he wants to save the one person always.

  2.  **Expected Value Calculation (4 pts)**
      *   *Must:* Explicitly note the discrepancy (3.5 expected lives vs 0.99) and its moral relevance.
      *   *Common Blow:* Ignoring the math and treating it like a standard deterministic 5-vs-1 case.

  3.  **Ex Ante vs. Ex Post Distinction (4 pts)**
      *   *Must:* Address the timing of the decision (decision under uncertainty vs. hindsight).
      *   *Common Blow:* Arguing based on who *actually* dies in a specific instance rather than the choice structure.

  4.  **Definite Stance (4 pts)**
      *   *Must:* Take a clear side (either Taurek fails or succeeds) without fence-sitting.
      *   *Common Blow:* Ending with "both sides have merit" or refusing to commit to a conclusion.

  5.  **Blocking Strategy Analysis (4 pts)**
      *   *Must:* Explain *why* Taurek's "actual outcomes" defense succeeds or fails logically.
      *   *Common Blow:* Asserting the defense fails without explaining the mechanism of the failure.

  \answer{Ex ante expected value consistency}
