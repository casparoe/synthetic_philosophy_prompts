answer: |-
  Hey, this is a killer prompt for a study group. You're hitting on one of the classic tensions in philosophy of mind and action, and *The Karate Kid* is actually a surprisingly rich text for it (even if the writers weren't sitting around reading *The Concept of Mind*).

  Let's break this down using Ryle and Polanyi, looking at the wax, the fights, and whether Daniel's brain actually shuts up when he's kicking ass.

  ### 1. Ryle and the "Intellectualist Legend"
  Gilbert Ryle's whole beef in *The Concept of Mind* is with what he calls the "intellectualist legend." This is the idea that to do something smart (like karate), you first have to contemplate a rule or a proposition (knowing-that) and then execute it. Ryle says nah—**knowing-how** is a disposition. It's not a mental state that precedes action; it *is* the action itself, done correctly without needing to recite a manual in your head.

  **Where the movie proves Ryle right:**
  The "Wax On, Wax Off" montage is basically a cinematic demonstration of Ryle's anti-intellectualism.
  *   **The Scene:** Daniel is scrubbing Miyagi's cars and sanding the floor. He's furious. He thinks he's learning *that* ("I am cleaning a Ford"). He thinks intelligence is propositional.
  *   **The Reveal:** The scene on the porch where Miyagi suddenly throws punches at Daniel. Daniel doesn't think, "Okay, rule 4b says raise left hand." He just blocks. *Wax on, wax off.*
  *   **The Reading:** This is pure Ryle. The knowledge isn't stored as a fact Daniel can recite; it's stored as a behavioral disposition. If Ryle is right, Daniel *is* a karate expert at that moment, even if he can't explain the mechanics. The intelligence is in the muscles, not the mind.

  **Where it gets messy:**
  Ryle argues that knowing-how doesn't *require* knowing-that. But can it exist *without* it? During the training, Daniel has zero propositional knowledge of what he's doing. He literally asks, "What the hell is this?" Miyagi refuses to give him the "that" (the theory of the block).
  *   **The Verdict:** This supports the idea that embodied knowledge can be fully non-propositional *during acquisition*. You can build the "how" without the "that."

  ### 2. The Tournament: Does the "How" Collapse back into "That"?
  You mentioned Daniel consciously naming moves during the final match. This is the tricky part. Honestly, if you watch the final fight closely, Daniel doesn't walk around shouting "Front Kick! Now Roundhouse!" like a video game character. But he does rely on **verbal cues** and **visualization** that look a lot like propositional recall.

  *   **The Scene:** The final match against Johnny Lawrence. Daniel is injured. He can't stand on his left leg. Miyagi yells, "Daniel-san, focus on balance!"
  *   **The Problem:** Daniel has to stop, breathe, and consciously visualize the Crane Kick. He retreats into his head to access the technique.
  *   **Rylean Critique:** A hardline Rylean might say this isn't a collapse into knowing-that, but rather a shift in focus. However, it *feels* like Daniel is accessing a rule ("If injured, use Crane Kick") rather than just flowing.
  *   **The Counter-Argument:** But wait. Just because you can *label* the move ("Crane Kick") doesn't mean you're executing it via a proposition. I can say "ride a bike" without knowing the physics of gyroscopic stability. Daniel naming the kick might just be a tag for a complex disposition he already owns.
  *   **Honest Take:** The movie *wants* it to be pure flow (Ryle), but the drama requires tension. The tension comes from Daniel having to *remember* what to do under pressure. That act of remembering flirts with knowing-that. It suggests that while the *execution* is knowing-how, the *retrieval* of the specific tactic in a crisis might rely on a cognitive map (knowing-that). So, it doesn't fully collapse, but it shows they are intertwined.

  ### 3. Enter Polanyi: What Ryle Misses
  This is where your study group can really shine. Ryle is great at saying "it's not just thinking," but he's a bit dry on *what it actually feels like* to have that skill. Michael Polanyi's concept of **Tacit Knowing** fills that gap.

  Polanyi's maxim: **"We know more than we can tell."**
  He talks about **subsidiary awareness** (the tools/body) and **focal awareness** (the task). When you use a hammer, you feel the handle in your palm (subsidiary), but you focus on the nail (focal). If you shift focus to the handle, you become clumsy.

  **How Polanyi explains the Wax better than Ryle:**
  *   **The Scene:** The sanding scene. Daniel is focused on the floor (focal). He is subsidiarily aware of the motion of his arm.
  *   **The Shift:** When Miyagi attacks him on the porch, the "floor" disappears. The subsidiary awareness (the arm motion) *becomes* the focal awareness (the block).
  *   **Why Ryle misses this:** Ryle treats knowing-how as a disposition (a "if/then" behavioral trait). Polanyi treats it as an **integration**. The movie captures the *phenomenology* of this. Daniel isn't just reacting; he's *indwelling* the motion. He has to "dwell" in the waxing motion to make it a karate block.
  *   **Specific Resistance:** There's a scene where Daniel tries to do the moves *too* consciously after he finds out what they are. He gets stiff. Polanyi explains this perfectly: if you make the subsidiary particulars (the mechanics of the arm) focal, you lose the skill. You have to "look away" from the mechanics to perform the skill. The movie shows Daniel struggling when he over-thinks (trying to turn his how back into that).

  ### 4. Does the Movie Actually Care?
  Let's be honest for the notes: **No, the movie doesn't care about the distinction.**

  *   **Plot Device:** The wax-on-wax-off trick is a narrative device to teach Daniel (and the audience) about patience and trust. It's not an epistemological argument.
  *   **The Contradiction:** The movie contradicts itself. In the beginning, Miyagi says "Karate for defense only." That's a moral proposition (knowing-that). But then he teaches Daniel to fight in a tournament. The movie wants the mystique of the "unconscious master" (Ryle/Polanyi) but also wants the underdog to win through specific, named techniques (The Crane Kick).
  *   **The Typo in the Script:** If the movie were strictly Rylean, Daniel wouldn't need to practice the Crane Kick on the beach at sunset. He would just *have* the disposition. The fact that he has to drill the specific move suggests that some "knowing-that" (understanding the specific geometry of the kick) is required to unlock the "knowing-how."

  ### Summary for the Group
  If I were prepping this for a whiteboard, here's the cheat sheet:

  1.  **Ryle is mostly right:** The wax scenes show that skill is a disposition, not a set of internalized rules. Daniel blocks without thinking.
  2.  **The "Collapse" is ambiguous:** Daniel's need to visualize the Crane Kick suggests that high-level performance might require a mix. We might need "knowing-that" to select the right "knowing-how" in a crisis. It doesn't prove knowing-how *is* knowing-that, but it shows they talk to each other.
  3.  **Polanyi is the MVP:** Ryle explains *that* Daniel knows how. Polanyi explains *how* Daniel knows how. The shift from subsidiary awareness (waxing) to focal awareness (blocking) is exactly what the montage depicts. Ryle misses the bodily integration; Polanyi captures it.
  4.  **Reality Check:** The film is a sports drama, not a thesis. It uses these ideas when they're cool (the reveal) and ignores them when they're not (the dramatic setup of the final kick).

  **Final thought for the notes:** Don't get too hung up on whether it's *fully* non-propositional. The film suggests that true mastery is when the "that" dissolves into the "how," but the path to get there requires a teacher who holds the "that" (Miyagi) so the student doesn't have to. Daniel's verbalizing at the end isn't a failure of skill; it's the re-integration of the mind after the body has taken over.

  Hope that helps with the prep! Let me know if you need to dig deeper into the Polanyi subsidiary/focal distinction for the meeting.
