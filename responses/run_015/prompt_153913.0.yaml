answer: |-
  Welcome to the rabbit hole. It's great to have a condensed-matter veteran in the philosophy trenches; honestly, you guys are the ones who actually deal with the messy stuff (open systems, dissipation, macroscopic coherence) while the foundations crowd often plays with spin-1/2 particles in a vacuum.

  You're right to be unsatisfied with "PBR said it, that settles it." The Pusey-Barrett-Rudolph theorem is a powerful no-go result for a specific class of $\psi$-epistemic models (specifically those where distinct quantum states overlap in their ontic probability distributions *and* satisfy preparation independence), but it's not a "theory of everything" for ontology. It's a constraint, not a solution.

  Since you know the math, I won't patronize you with definitions of Hilbert spaces. Instead, here is the "spec sheet" for what a robust wavefunction ontology needs to deliver. I've broken these down into **Hard Constraints** (if you violate these, you contradict experiment or logic) and **Conceptual Requirements** (if you violate these, you haven't actually solved the philosophical problem).

  ### The Desiderata List

  | Requirement | What it demands | Hard Constraint or Preference? | Why it matters (The Physicist's View) |
  | :--- | :--- | :--- | :--- |
  | **1. Empirical Adequacy** | Must reproduce the Born Rule and standard QM predictions to experimental precision. | **Hard** | Obvious. If it predicts different interference visibilities than standard QM, it's falsified. |
  | **2. Definite Outcomes** | Must explain why a measurement yields *one* result, not a superposition of results. | **Hard** | This is the Measurement Problem. Unitary evolution gives entangled superpositions; detectors give clicks. A theory must bridge this gap. |
  | **3. No-Signaling** | Cannot allow superluminal communication, even with entangled resources. | **Hard** | Violates relativity. Any ontology that allows Bob to know Alice's setting instantly via local statistics is dead. |
  | **4. Proper vs. Improper Mixtures** | Must distinguish between ignorance ($\rho = \sum p_i |\psi_i\rangle\langle\psi_i|$) and entanglement ($\rho_A = \text{Tr}_B |\Psi_{AB}\rangle\langle\Psi_{AB}|$). | **Hard (for Ontology)** | In CM physics, you know $\rho_{reduced}$ isn't "classical ignorance." An ontology that conflates them is confusing map for territory. |
  | **5. Continuity of Decoherence** | Must handle the mesoscopic regime without a "Heisenberg Cut." No magic size limit where quantum stops. | **Hard (for Realism)** | You can't have a theory where a molecule is quantum, a virus is quantum, but a dust mote is "classical" by fiat. The transition must be dynamical. |
  | **6. Compositionality** | Must explain how the ontology of a subsystem relates to the ontology of the whole (especially with entanglement). | **Hard** | If the whole is real, are the parts real? If the wavefunction is global, how do local facts emerge? |
  | **7. Preparation Independence** | Distinct systems prepared separately have independent physical states. | **Soft / Debatable** | This is the PBR assumption. You *can* drop this to save $\psi$-epistemic views, but it makes the world look conspiratorial (superdeterminism-ish). |

  ### Deep Dive: Hard Constraints vs. Preferences

  **The Hard Constraints (1, 2, 3, 4):**
  These are non-negotiable.
  *   **Empirical Adequacy:** If your ontology changes the interference pattern in a double-slit experiment, you're not doing foundations, you're doing new physics (and likely wrong).
  *   **Definite Outcomes:** This is the big one. Unitary QM (Schrödinger eq) never selects a single eigenvalue. If your ontology says "the wavefunction is real and only the wavefunction exists" (Psi-ontic, Complete), you have to explain why I don't see superpositions (Many-Worlds solution: you do, just in different branches). If you say "I see one outcome," you need a mechanism (Collapse) or hidden variables (Bohm).
  *   **Proper vs. Improper Mixtures:** As a condensed-matter guy, you know that tracing out the environment gives you a diagonal density matrix that *looks* like a classical statistical mixture, but isn't one (you can't interpret the diagonal elements as "the system was actually in state $i$ with probability $p_i$"). An ontology that treats $\rho_{improper}$ as $\rho_{proper}$ is making a category error. It conflates "we don't know" with "the environment doesn't know."

  **The Conceptual Requirements (5, 6):**
  These are where most "shut up and calculate" approaches fail to be *ontologies*.
  *   **Continuity of Decoherence:** This is your specific interest. A decent ontology can't just say "quantum rules apply here, classical rules apply there." It needs to show how the ontic status evolves as interference terms decay.
  *   **Compositionality:** This is the headache of entanglement. If $\psi$ is real, is it a field in 3D space or a field in 3N-dimensional configuration space? If the latter, how do local objects (like your detector) exist?

  ### The "Killer" Constraint

  You guessed **Partial Decoherence (Continuity)**, and you're partially right, but I'd sharpen the blade.

  The single requirement that eliminates the biggest chunk of existing views is **Definite Outcomes + Unitary Evolution**.

  Here's why:
  1.  **Copenhagen/Instrumentalism:** Fails because it posits a "Cut" (violates Continuity) and treats the wavefunction as epistemic but refuses to define the underlying reality (fails Ontological Clarity).
  2.  **Many-Worlds (Everett):** Keeps Unitarity and Psi-Ontic, but sacrifices **Single Definite Outcome** (from the perspective of a unique global history).
  3.  **GRW (Collapse):** Keeps Single Outcome and Psi-Ontic, but sacrifices **Unitary Evolution** (adds non-linear stochastic terms).
  4.  **Bohmian Mechanics:** Keeps Single Outcome and Unitarity (for the wave), but sacrifices **Psi-Completeness** (adds particles) and struggles with **Relativistic Locality**.
  5.  **Psi-Epistemic (PBR compliant):** Most are killed by PBR unless they sacrifice **Preparation Independence** (which makes the universe look conspiratorial).

  However, validating your intuition: The requirement for **Continuity of Decoherence (No Heisenberg Cut)** is the specific killer for the "standard" textbook view. It forces you to stop treating the measuring apparatus as magical. It demands you treat the detector as a quantum system made of atoms, which means you must account for the *partial* decoherence regime where interference is suppressed but not zero. Most philosophical interpretations gloss over this because it's computationally hard, but for an ontology, it's fatal to ignore it.

  ### Is Anything Negotiable?

  **Yes, but only if you change your goal.**

  *   **If you want an Instrumentalist Account:** You can negotiate **Definite Outcomes** and **Ontological Clarity**. You can literally say, "The theory is just a tool for predicting clicks. I don't care what exists between preparations." This is the "Shut Up and Calculate" escape hatch. It works perfectly for doing condensed-matter physics on Tuesday morning.
  *   **If you want a Realist Ontology:** Nothing is negotiable. Specifically, you cannot shrug off the **Mesoscopic/Partial Decoherence** regime.
      *   *Why?* If you claim the wavefunction describes *reality*, you can't have a gap in your description of reality. You can't say "Reality is defined for an electron, undefined for a virus, and defined again for a cat."
      *   If a theory says, "We don't model the mesoscopic regime ontologically," it admits it is not a fundamental theory of reality, but an effective field theory of metaphysics.

  ### Summary for your Grandkid

  If you want to explain this back to your grandkid:
  1.  **PBR** tells us the wavefunction can't just be "probability" in the classical sense (like a coin flip we haven't looked at yet), *unless* the universe is weirdly conspiratorial.
  2.  **Decoherence** explains why we don't *see* superpositions, but it doesn't explain why we get *one* result (the "and" becomes "or", but which "or"?).
  3.  **The Real Test:** Any theory that claims to tell you what's *really* happening must work for a large molecule in a double-slit experiment just as well as it works for a photon. If it needs a magic line where quantum stops and classical starts, it's not a complete ontology.

  You're asking the right questions. The physics community is actually waking up to this; the "mesoscopic ontology" is where the next breakthrough in foundations will likely happen, and that's right in your wheelhouse. Enjoy the retirement hobby!
