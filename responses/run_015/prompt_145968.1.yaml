answer: |-
  Here is the breakdown of the "Lives Not Histories" menu. You are right to be suspicious; that slogan is a Rorschach test where teachers can project whatever they want onto Plutarch's name.

  ### 1. The Trivial Version
  **Claim:** History is just the sum of individual actions. Therefore, studying the person *is* studying the history.
  *   **Is it a platitude?** Yes. It's the "Great Man Theory" stripped of its philosophical weight. It reduces history to celebrity profile pieces.
  *   **Is it defensible?** Weakly. It ignores structural forces (economics, geography, institutions) that constrain or dictate what "great men" can actually do.
  *   **Is it false?** Not strictly false, but incomplete. It treats symptoms (decisions) as causes (character).
  *   **Does it support skipping politics for drama?** **Yes.** This is the "gossip defense." If the person is the history, then their mood swings, childhood trauma, and jealousy are primary sources, not color commentary. It justifies replacing policy analysis with psychobabble.

  ### 2. The Moral Mirror Version
  **Claim:** The purpose of biography is ethical training. We study lives to imitate virtue and reject vice (Exemplar History).
  *   **Is it a platitude?** No. It is a specific, classical philosophical claim about the utility of the past.
  *   **Is it defensible?** Yes, within a classical framework. Plutarch explicitly argued this. However, modern historiography generally rejects *didacticism* (teaching morals) in favor of *analysis* (explaining causes).
  *   **Is it false?** No, but it is anachronistic. It assumes universal virtues exist across time periods.
  *   **Does it support skipping politics for drama?** **Yes, conditionally.** It supports focusing on personal flaws (jealousy, rage) *only if* they are framed as moral warnings. If the teacher is just describing the trauma without extracting a moral lesson on leadership or character, she isn't actually using this version; she's using the Trivial Version.

  ### 3. The Hagiography Version
  **Claim:** Lives should be inspirational. To serve as models, the "bad parts" must be minimized or sanctified.
  *   **Is it a platitude?** No. It is a distortion of biography.
  *   **Is it defensible?** No. It is historically dishonest. It turns history into mythology.
  *   **Is it false?** Yes. It actively obscures the truth to serve a narrative function.
  *   **Does it support skipping politics for drama?** **No.** Hagiography usually skips the *drama* of human weakness (jealousy, trauma) because it makes the subject look flawed. This version would actually demand *less* focus on Caesar's jealousy and more focus on his "divine" destiny.
  *   **Risk:** This is the danger zone for the Moral Mirror. If you push "teaching morals" too hard, you accidentally sanitize the subject to make them a better lesson, turning biography into hagiography.

  ### 4. The Plutarchian Paired Version
  **Claim:** Character is revealed in small, private moments, best understood by comparing two figures from different cultures to find universal human traits.
  *   **Is it a platitude?** No. This is Plutarch's actual methodology in *Parallel Lives*.
  *   **Is it defensible?** Yes, as a literary and philosophical exercise. It is less defensible as rigorous political history.
  *   **Is it false?** No, but it has a specific scope. Plutarch admitted he was often passing over major battles to focus on a witty remark or a dining habit because he believed those revealed the *ethos* (character) better than the *ergon* (deed).
  *   **Does it support skipping politics for drama?** **Partially.** It supports skipping *battle tactics* for *character moments*. However, it does **not** support skipping *laws and politics*, because Plutarch viewed political action as the primary arena where character was tested. You cannot judge Caesar's character without judging his laws.
  *   **Risk:** It can turn into the Moral Mirror if the comparison becomes too forced.

  ***

  ### The Verdict

  **Which version is your teacher probably using?**
  She is likely smuggling the **Trivial Version** inside the **Moral Mirror Version**.
  She uses the high-minded defense of the Moral Mirror ("biography teaches morals!") to protect the low-effort engagement of the Trivial Version ("let's talk about his feelings instead of his tax code"). If she were truly doing the **Plutarchian Paired Version**, she would be comparing Alexander to someone else to draw a conclusion about leadership. If she were doing **Hagiography**, she wouldn't be dwelling on trauma and jealousy. She is using "character" as a synonym for "personal drama."

  **Which versions accidentally turn biography into hagiography?**
  The **Moral Mirror Version** is the slippery slope. Once you decide the point of history is to teach students how to be "good," there is immense pressure to flatten the complexity of historical figures. You start emphasizing the virtues that fit the lesson and minimizing the vices that complicate it. The **Trivial Version** avoids this by being too shallow to care about sanctity, but the Moral Mirror risks turning Caesar into a sermon illustration rather than a historical actor.

  **Does "Lives Not Histories" actually justify skipping battles and laws?**
  Strictly speaking, **no.** Even Plutarch didn't ignore the battles; he just refused to make them the *point*. He assumed his readers knew the history. Your teacher is treating the personal drama as the *substance* rather than the *lens*. Skipping the laws entirely makes it impossible to judge the "moral" impact of the leader, which undermines her own defense.
