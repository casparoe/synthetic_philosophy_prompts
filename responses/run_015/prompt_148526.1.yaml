answer: |-
  **TO:** The Board of Governors, Marlund Reserve Authority
  **FROM:** Maya Halden, Chief Model Architect; Joseph Ahlgren, Senior Internal Critic
  **DATE:** 14 October 2023
  **SUBJECT:** Joint Memorandum on Model Assumptions and Failure Modes (Panel Order 12-B)

  **Preamble**

  Pursuant to the directive of the Review Panel following the liquidation event of Quarter 3, Year 12, we submit this joint assessment. The Panel has required a unified document addressing the role of unrealistic assumptions in policy models. We acknowledge that our previous disagreements were often procedural rather than substantive, yet those procedural differences obscured the risks inherent in the Halden model. This memo distinguishes between what we now agree upon regarding the failure, where our theoretical frameworks remain incompatible, and where our conflict was merely linguistic. We have defined all technical terms within the text to ensure intelligibility to non-specialists. Our objective is not to assign blame, but to establish protocols for future model governance that prevent the accumulation of hidden risks.

  **I. Joint Claims**

  1.  **Definition of Terms:** We adopt the following definitions for the purpose of this record. *Surrogate credit* is the share of a model's predictive success that a particular false assumption may claim, as opposed to the share belonging to the calibration procedure (the tuning of numbers to fit past data). *De-idealization debt* is the standing backlog of omitted factors that no one has a scheduled obligation to reinsert into the model. The *convergence ladder* is the ordered family of model variants obtained by reinserting those factors one at a time to see if predictions stabilize.
  2.  **Source of Stability:** We agree that the eleven years of successful predictions were not merely luck, nor were they proof of the model's structural truth. The success was real, but it relied on market conditions that matched the model's false assumptions. When conditions changed, the assumptions ceased to be harmless simplifications and became active sources of error.
  3.  **Nature of the Failure:** The failure was not a random outlier but a structural breakpoint. The assumption of instantaneous liquidation earned *surrogate credit* during the calm years because market liquidity was high enough to mimic instant sale. When liquidity dried up, the debt came due. We agree that predictive success insulates assumptions from scrutiny, creating a liability that grows silently until a regime change occurs.
  4.  **Auditability:** We agree that an assumption is *auditable* only if there exists a documented method to test whether the assumption holds in the current environment, independent of the model's output. Previously, auditability was conflated with performance; we now agree that a model can perform well while its assumptions are auditable and false, or perform poorly while its assumptions are unauditable.
  5.  **Portability:** We agree that success in Marlund does not grant automatic validity in other jurisdictions. A model validated here is valid elsewhere only if the structural mechanisms of the other jurisdiction match the Marlund structure, not merely if the numerical outputs look similar.

  **II. Table of Residual Disagreements**

  | Neutral Statement of Disagreement | Halden Formulation (Instrumentalist) | Ahlgren Formulation (Realist) | Crux | Accepted Case/Computation | Prediction Recorded in Advance |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Allocation of Surrogate Credit** | The liquidation assumption earned zero credit; success belonged entirely to calibration tuning. | The assumption earned partial credit; it functioned correctly as a proxy until liquidity thresholds were breached. | Does a false assumption contribute to success, or does it merely ride on calibrated coefficients? | Back-testing Year 1-11 data with fixed coefficients vs. variable liquidity. | **Halden:** Coefficients alone explain 95% of variance. **Ahlgren:** Coefficients explain only 60%; assumption explains the rest. |
  | **2. Incompatible Assumptions** | If a different false assumption yields same results, the model is a tool, not a description; mechanism is irrelevant. | If different assumptions yield same results, the model is under-determined; we cannot claim to understand the mechanism. | Does multiple realization validate the tool or invalidate the explanation? | Simulation using "Fixed Delay" vs. "Instant Liquidation" yielding identical Year 1-11 outputs. | **Halden:** Both are acceptable tools. **Ahlgren:** Neither is acceptable for policy without mechanistic selection. |
  | **3. Convergence Ladder Expectations** | The ladder is optional; if the top rung predicts well, lower rungs are unnecessary costs. | The ladder is mandatory; predictions must stabilize as factors are reinserted, or the model is unstable. | Must understanding converge steadily, or is final prediction the only metric? | Stepwise reinsertion of friction costs (1 day, 5 days, 10 days). | **Halden:** No requirement for steady convergence. **Ahlgren:** Qualitative change expected at rung 3. |
  | **4. Cross-Jurisdiction Validity** | Validity is empirical; test the model abroad. If it works, it is valid, regardless of structural differences. | Validity is structural; if settlement structures differ, the model is invalid until re-idealized for the new context. | Is validation a matter of output matching or structural isomorphism? | Application of Halden Model to neighboring state with T+2 settlement. | **Halden:** Run for one year to check error rates. **Ahlgren:** Reject immediately until structural mapping is done. |
  | **5. Meaning of Auditability** | An assumption is auditable if we can verify the model's output against reality regularly. | An assumption is auditable if we can verify the input condition (e.g., liquidity depth) independently of the model. | Do we audit the consequence or the premise? | Review of liquidity reports vs. model stress tests. | **Halden:** Output verification suffices. **Ahlgren:** Input verification is required. |

  **III. Verbal Disputes Conceded**

  We concede that the following disputes were primarily linguistic and no longer constitute barriers to policy agreement:

  1.  **"Unrealistic" vs. "False":** We agree that calling an assumption "unrealistic" was often used by Ahlgren to mean "structurally omitted" and by Halden to mean "empirically false." We agree to use "false" for empirical mismatch and "idealized" for intentional omission.
  2.  **"Understanding" vs. "Predicting":** We agree that Halden used "understanding" to mean "ability to manipulate outcomes," while Ahlgren used it to mean "knowledge of causal chains." We acknowledge that policy requires both manipulation and causal knowledge, rendering the distinction secondary to safety protocols.
  3.  **"Debt" Metaphor:** We agree that referring to *de-idealization debt* as a financial obligation was misleading. It is not a liability that must be paid immediately, but a risk exposure that accumulates interest in the form of fragility.

  **IV. Closing Concessions**

  In the interest of advancing the Authority's safety protocols, we each concede a point that contradicts our established theoretical positions.

  Maya Halden concedes that the falsity of an assumption is not merely a neutral feature of a tool but a constraint on its future utility. She acknowledges that by treating the liquidation assumption as purely instrumental, she allowed the *de-idealization debt* to accumulate without schedule. She admits that a model whose assumptions are known to be false cannot be safely used in novel domains without first climbing the *convergence ladder*, effectively conceding that instrumental success does not grant immunity from structural scrutiny. This undermines the strong instrumentalist claim that assumptions are irrelevant so long as predictions hold.

  Joseph Ahlgren concedes that the demand for realistic assumptions cannot be a precondition for model deployment. He acknowledges that waiting for the *convergence ladder* to reach a fully realistic base would paralyze policy during crises. He admits that *surrogate credit* granted to false assumptions is sometimes necessary to act under uncertainty, and that a model with known false assumptions may be ethically preferable to no model at all. This undermines the realist claim that mechanistic truth is the primary validator of policy models.

  We sign this document acknowledging that our previous opposition prevented us from seeing that safety requires both Halden's demand for performance and Ahlgren's demand for structure. We recommend that all future models be required to maintain a schedule for reducing *de-idealization debt*, even while being judged on performance.

  **Maya Halden**
  **Joseph Ahlgren**
