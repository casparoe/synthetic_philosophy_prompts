  Subject: Re: Careenium deadlock / Draft Collab Doc
  From: Prof. H.
  To: Grad Student

  Hey,

  Here's that draft we talked about in office hours. I tried to map out the terrain without taking sides, mostly so you guys can stop talking past each other. The goal is to get both the Substrate-Pushers and the Correlationalists to sign off on the first section, at least. 

  I kept it self-contained—no need to go digging for outside citations, just the logic of the careenium itself. I left a couple of things open-ended where I think you can tighten the definitions later. 

  Take a look and let me know if this captures the deadlock accurately. We can tweak the predictions before Tuesday's seminar.

  Best,
  Prof H.

  ***

  **DRAFT: Adverserial Collaboration on Careenial Causality**
  **Status:** Working Document (v0.4)
  **Parties:** Substrate-Pushers (Camp A) vs. Correlationalists (Camp B)

  ### 1. Agreed Claims (Joint Statement)

  Both camps agree to the following baseline definitons and observations regarding the careenium model:

  1.  **Architecture:** The careenium is a closed system containing a medium and a plurality of "simmballs." There are no external agents interacting with the system during the observation window.
  2.  **Simmball Dynamics:** Simmballs possess kinematic properties (momentum, velocity) and interact via collision rules defined at the substrate level. These interactions are deterministic within the model's precision limits.
  3.  **Symbolic Tokens:** High-level patterns of simmball clusters are identifiable as "symbolic tokens." These tokens are stable over time intervals sufficient for pattern recognition.
  4.  **Underdetermination:** Current observational data of simmball trajectories is consistent with two distinct causal narratives: (a) token-level constraints actively modify substrate trajectories, or (b) substrate trajectories merely instantiate patterns that observers label as tokens. The kinematic data alone does not yet distinguish between causal push and correlational shadow.

  ### 2. Disagreements Table

  | Feature | Camp A (Substrate-Pushers) | Camp B (Correlationalists) |
  | :--- | :--- | :--- |
  | **Locus of Control** | Token structures exert downward causal constraint on simmball motion. | Simmball motion exhausts the causal story; tokens are descriptive gloss. |
  | **Ontological Status** | Symbols are real causal agents within the system ontology. | Symbols are epiphenomenal; only the substrate has ontological weight. |
  | **Explanation Style** | Top-down: Token identity explains substrate configuration. | Bottom-up: Substrate configuration explains token appearance. |

  ### 3. Cruxes and Predictions

  To move beyond the deadlock, we identify two specific cruxes where the camps diverge on predictions. Both sides agree to the following in-model cases as the testing ground.

  #### Crux 1: Token-Type Identity vs. Substrate Reconfiguration
  **The Question:** Does the identity of a symbolic token survive if the underlying simmballs are swapped while maintaining the pattern?

  **Concrete Case: "The Ship of Simmballs"**
  We observe a stable Token-Type *T* composed of Simmball Set *S1*. Over interval *Δt*, we gradually replace every simmball in *S1* with a physically identical simmball from a reserve pool, maintaining the exact spatial pattern and kinematic state of *T* at every step. The resulting set is *S2*.

  *   **Camp A Prediction:** Token *T* persists identically through the swap. The causal power resides in the pattern/type, so the system's subsequent behavior (post-*Δt*) will remain consistent with *T*'s causal history, regardless of the material change.
  *   **Camp B Prediction:** Token *T* is merely a label applied to *S1*. Since *S1* is gone, *T* (as a physical reality) ceases to exist. Any continuity in behavior is due to the physical similarity of *S2* to *S1*, not the persistence of a token entity. If the swap introduces even microscopic noise, Camp B expects drift based on substrate variance, whereas Camp A expects stability based on token integrity.

  #### Crux 2: Transitivity of the Push Relation
  **The Question:** Is the causal push relation transitive across careenial layers? (i.e., If Macro pushes Meso, and Meso pushes Micro, does Macro push Micro?)

  **Concrete Case: "The Layered Interference"**
  The careenium is structured in three layers: Micro (individual simmballs), Meso (clusters), and Macro (symbolic tokens). We introduce a constraint that limits the allowable states of a Macro Token *M* without directly manipulating the Micro simmballs constituting it (e.g., via a boundary condition on the token's field).

  *   **Camp A Prediction:** Yes, the relation is transitive. Constraining Macro Token *M* will actively alter the trajectories of the constituent Micro simmballs in a way that violates pure bottom-up collision rules. The macro-constraint "pushes" the micro-balls into states they would not otherwise occupy.
  *   **Camp B Prediction:** No, the relation is not transitive. Constraining Macro Token *M* is physically identical to constraining the Micro simmballs directly. There is no additional "push" from the Macro layer. Any change in micro-trajectories is fully accounted for by the physical boundary conditions applied at the micro-level; the Macro description adds no causal force.

  ***

  Let me know if the "Ship of Simmballs" case feels fair to both sides. I think Camp B might fight the wording on "physical reality" in that prediction, but we can hash that out.

  See you Tuesday.
