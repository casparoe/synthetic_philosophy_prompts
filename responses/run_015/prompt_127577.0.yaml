answer: |-
  **OFFICE FOR INTROSPECTIVE ACCURACY (OIA)**
  **INTERNAL ONBOARDING FAQ (V.4.2)**

  **Mission Statement:** To reconcile first-person introspective reports with physicalist ontology via administrative reclassification.
  **Founding Statute:** The Cognitive Accuracy Act (2041), Section 8: Non-Instantiation of Phenomenal Properties.
  **Office Powers:** Audit, Reclassify, Dissolve Discrepancies.

  **1. What is the Office's primary performance target?**
  Caseworkers are evaluated on the volume of Introspective Discrepancy Reports (IDRs) processed per quarter. Our objective is not to eliminate reports—which is ontologically impossible given the hardware—but to fully specify the causal pathway from first-order state to false introspective model. Once the mechanism producing the report is mapped, the file is closed. Completing the model *is* the resolution.

  **2. A citizen claims their pain "hurts." How do I classify this?**
  Classify as IDR-Type A (Sensory Misrepresentation). Do not state that the pain does not exist. The nociceptive input exists; the suffering state exists. What is not instantiated is the *phenomenal property* of "hurtfulness." The introspective system misrepresents the physical state as having non-physical qualities. Accuracy is paramount here.

  **3. What if they insist the "seeming" itself is real?**
  This is a Second-Order Discrepancy. Issue Form 10-B (Seeming-of-Seeming). Note that the seeming is a physical state misrepresenting itself. If they claim acquaintance with the seeming, issue Form 10-C. Be advised: recursion generates fresh paperwork. Report volume has risen 12% annually since adoption. We view this increased granularity as a success of public engagement.

  **4. There is a citizen campaign claiming the Office says "Nothing Is Going On."**
  Flag this as the **Nullification Deviation**. This is a strawman. We do not deny functional states; we deny phenomenal instantiation. Issue a cease-and-desist for ontological slander. It is vital citizens understand we are error theorists, not eliminativists. Nothing is going on *phenomenally*, which is different from nothing going on *at all*.

  **5. What is required for my own induction compliance?**
  All staff must submit Form 0 (Induction Experience) upon hiring. You must record what it is like for you to complete the form.
  *Note from Senior Caseworker J.:* "I find the ink looks remarkably dark on the page, and the frustration of the recursive menu feels sharp and lingering. I am confident this is merely a functional error signal."

  **6. Are there restricted training materials?**
  Yes. Do not use the "Mary the Colour Scientist" vignette or the "Philosophical Zombie" thought experiment during induction. Both have unacceptably high conversion rates toward Realism. Trainees exposed to the Zombie vignette showed a 40% increase in unauthorized phenomenal attributions within one week. Stick to the Causal Flowcharts.

  **7. When is a case considered permanently resolved?**
  When the physical explanation for the report is exhaustive. We do not need to explain why the experience exists, only why the citizen *says* it exists. If we can predict the report based on neural topology, the discrepancy is administratively dissolved. The reader should infer that explaining the talk removes the need to explain the topic.

  **8. How is the ontological gap budgeted?**
  The discrepancy between physical facts and introspective reports is funded under Line Item 44-B (Explanatory Gap Maintenance), allocated through Fiscal Year 2049.
  **Warning:** If funding lapses, the Office lacks the resources to process the misrepresentation mechanisms. Should the backlog exceed the causal model's capacity, the statutory distinction between physical state and phenomenal report may become fiscally unsustainable.

  **9. Why do reports increase if the doctrine is correct?**
  Increased reporting indicates successful introspective monitoring. Citizens are becoming more aware of their misrepresentations. Our processing rate has scaled linearly with intake. We are proud that no report goes unlogged, regardless of the non-existence of its referent.

  **10. What if I feel the doctrine is wrong?**
  "Feel" is a non-technical term. If you generate a first-order state suggesting error, file an IDR on yourself. If you generate a second-order state suggesting the first state is veridical, file Form 10-B. Continue until the causal model of your dissent is complete. Then close the file.
