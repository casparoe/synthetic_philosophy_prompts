      *   *Check Constraints:* No outside citations (don't explicitly name *Reflections on the Guillotine* unless necessary, but describe the arguments as requested). Ensure I address the "tension" in Camus's philosophy.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Camus hated the death penalty." I need to show how the *text* does the work. The friend's point about "consent" is tricky. I need to distinguish between accepting the *inevitability* of death vs. accepting the *legitimacy* of the state's right to kill. Meursault accepts the former, rejects the latter.

