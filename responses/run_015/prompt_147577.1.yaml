answer: |-
  **1. The Constructivist Boundary**
  Standard social constructivism argues that politics resides in the social relations that produce and sustain an object, not in the object itself. You argue that constructivism's story ends where yours begins: once the designers have gone home. But if the social relations *sustain* the use-time allocation of attention—for instance, through training, culture, or hiring practices—doesn't the politics remain in the network of human relations rather than migrating into the artifact?

  *Follow-up:* If she replies that the artifact *stabilizes* those relations in a way human agreements cannot, ask: Does that stabilization imply the artifact has a causal power over social relations that constructivism denies, or are you simply describing a particularly rigid form of social contract?

  **2. Empirical Fragility and Verification**
  Historians have challenged the empirical details of Winner's parkway example, suggesting the low bridges were not intentionally political. Your theory relies on the allocation of *notice*, which is often subjective and internal. Does your use-time politics inherit this vulnerability to historical revisionism, and if a future historian showed that operators *did* have power to prevent a failure but chose not to exercise it, would that falsify your mechanism or merely require a new example?

  *Follow-up:* If she says this is an objection to the example, not the mechanism, press: Since the mechanism is defined by the *experience* of blame and attention, if the empirical record of that experience is contested, what method do you propose for verifying the mechanism that doesn't rely on the very case studies historians might dispute?

  **3. Politics vs. Division of Labor**
  You argue that allocating anticipatory attention is political because it allocates agency and blameworthiness. However, management has always divided labor and assigned responsibility. What distinguishes this allocation of attention as a matter of *political* theory rather than a chapter in the sociology of work or managerial efficiency?

  *Follow-up:* If she answers that it becomes political when the allocation is hidden or naturalized, ask: Does that mean an explicit, transparent allocation of attentional labor is apolitical? If so, isn't the problem merely one of disclosure rather than a structural feature of the technology?

  **4. The Artifact's Contribution**
  Following on that: If the core injustice is the distribution of blame and vigilance, what does the *artifact* contribute to this distribution that a written contract, a duty roster, or a verbal instruction would not? If a manager could assign the same "moral crumple zone" role without any technology present, is there still a politics of the artifact, or merely a politics of the workplace?

  *Follow-up:* If she argues the artifact makes the allocation feel inevitable or natural, ask: Is the political work being done by the physical properties of the machine, or by the ideology that surrounds its implementation? If it's the latter, why locate the politics in the *use-time* of the object rather than the *discourse* about the object?

  **5. Design-Level Counterfactuals**
  To make your mechanism testable, I'd like to propose a design-level counterfactual. Can you describe two machines or interfaces with identical informational and causal properties—same sensors, same outputs, same failure modes—that nonetheless impose different allocations of vigilance on the operator solely due to their design?

  *Follow-up:* If she provides an example (e.g., alarm placement, feedback loops), ask: In that example, is the difference in vigilance caused by the physical interface, or by the operational protocol that dictates how the operator must respond to that specific interface design?

  **6. The Institutional Trace**
  Suppose we investigate a real-world case where two identical systems result in different allocations of blame. Upon inspection, we find the difference is traceable entirely to an employment contract, an insurance arrangement, or an institutional rule, not the interface itself. In that scenario, does the artifact drop out of the explanation entirely?

  *Follow-up:* If she says the artifact is still "strongly compatible" with the distribution, ask: If the variation is fully explained by institutional rules, what explanatory work is left for the "compatibility" of the artifact to do? Is "compatibility" doing anything more than saying the institution found the artifact useful for their existing goals?

  **7. The "Mechanism" Defense**
  You often note that objections to specific cases are objections to the example, not the mechanism. But if, in every testable instance, the allocation of attention can be reduced to institutional rules or contracts rather than the artifact's use-time properties, at what point does retaining the "mechanism" claim become unfalsifiable?

  *Follow-up:* If she argues that the artifact *mediates* the institutional rule, ask: Does every tool that mediates a rule have politics, or only those where the mediation is opaque? If opacity is the criterion, isn't the solution simply to make the mediation transparent, rather than to analyze the artifact's politics?

  **8. The Mundane Case: Self-Checkout**
  Let's apply this to a mundane, non-automated case: the supermarket self-checkout. This converts shoppers into unpaid scanners while simultaneously arranging for them to be treated as suspects if the machine flags an error. Is this a clear instance of your use-time politics, where the labor of vigilance is offloaded onto the consumer?

  *Follow-up:* Ask: What would a non-conscriptive self-checkout look like? If you remove the unpaid labor and the suspicion, is it still self-checkout, or does that imply the politics is detachable from the function only by destroying the function itself?

  **9. The Consent Trap**
  Here is a scenario for evidence against your view: A workplace adopts a monitoring system after an explicit, informed, uncoerced negotiation about who will monitor it and who will be answerable when it fails, with that negotiation periodically revisited. In this case, does the artifact lose its politics because the allocation of attention was consensual?

  *Follow-up:* This is the trap. If she says *yes*, consent removes the politics, ask: Have you offered anything beyond the familiar liberal complaint about absent consent? If she says *no*, the politics remains regardless, ask: Why is the negotiated arrangement not the authoritative account of what the artifact is for, and who are you to override the participants' own agreement about their labor?
