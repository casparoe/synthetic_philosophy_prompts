  The helix fits the contour of the map,
  No steric clash to hinder where it lies.
  It closes up the logical dark gap,
  And satisfies the most demanding eyes.

  A loop extension reaches to the side,
  Though energy costs rise to bend it so.
  It keeps the symmetry intact and wide,
  Accounting for the peaks we used to know.

  The water molecule could bridge the space,
  The ordered solvent sitting in the hole.
  It rests quietly within the place,
  And gives a perfect purpose to the whole.

  The domain shifts by one small degree,
  Aligning peaks along the axis line.
  It keeps the overall symmetry true,
  Making the noisy data look quite fine.

  Or perhaps two chains intertwine right here,
  A dimer form that we have seen before.
  It would make the intention very clear,
  And lock the density behind the door.

  But the map goes gray where contours fade
  We stop looking.
