answer: |-
  ### Phase 1: Brainstorming Candidate Principles

  To arrive at a principle that respects your verdicts while providing ontological clarity, I considered three competing frameworks. I will reject two and defend the third.

  **Candidate 1: Intentionalist Constructionism.**
  *Principle:* A kind is socially constructed if and only if it was brought into existence by a deliberate human act (a declaration, a rulebook, a founding moment).
  *Verdicts:* This handles the US Dollar (1) and the Sillans (6) perfectly. It captures the "invented" feel of NRD (7).
  *Rejection:* It fails your cases of Gender (5) and Unemployment (8). Neither has a "date of birth" or a specific author. Gender evolved through diffuse practice; Unemployment emerged from economic structures. If we adopt this, you must surrender the intuition that Gender and Unemployment are constructed. That is too high a cost. Social ontology has moved beyond the requirement of explicit intentionality (e.g., Searle's status functions often operate implicitly). I reject this for being too narrow.

  **Candidate 2: Epistemic Relativism.**
  *Principle:* A kind is constructed if our *access* to it is mediated by social concepts; it is real if it predicts outcomes. Construction and reality are relative to our current descriptive framework.
  *Verdicts:* This handles your discomfort with Species (9) and Sex (4). It explains why NRD (7) feels different depending on the genetic study.
  *Rejection:* This collapses ontology into epistemology. It implies that if we *believe* Witches (3) are real and they cause panic, they are real in the same way Dollars (1) are real. But you want to say Witches are "empty." This principle cannot distinguish between a successful social kind (Sillans) and a failed persecutory category (Witches) except by degree of belief. It also makes the "reality" of Blackness (2) too fragile—it suggests Blackness is real only because we *talk* about it, rather than because the social structures enforcing it are objective features of the world. I reject this for making reality too dependent on our current knowledge state.

  **Candidate 3: The Grounded Causal Homeostasis Principle.**
  *Principle:*
  1.  **Construction:** A kind $K$ is socially constructed iff the facts that make it true that $x$ is a $K$ are ultimately grounded in social facts (collective attitudes, practices, institutions, or classifications), rather than solely in mind-independent physical facts.
  2.  **Reality:** A constructed kind $K$ is real iff membership in $K$ figures in robust, non-accidental causal generalizations (i.e., it possesses *causal homeostasis*). The kind must sustain a feedback loop where membership influences properties, and properties reinforce membership or generate stable outcomes.

  *Defense:* This distinguishes the *source* of the kind (Construction) from the *stability* of the kind (Reality). It allows for kinds to be constructed but empty (Witches), constructed and real (Dollars, Blackness), and unconstructed but interest-relative (Species). It handles the "no founder" problem (Gender) by focusing on grounding in practice rather than intention.
  *Stipulation:* I stipulate that "social facts" include not just explicit rules but implicit normative structures (e.g., racism, gender norms).
  *Abandonment Condition:* I would abandon this if it were demonstrated that "social facts" reduce entirely to individual psychological states (methodological individualism) or if it were shown that causal efficacy is not a valid marker of ontological commitment (e.g., if we adopt a fictionalist stance toward all scientific kinds).

  ---

  ### Phase 2: The Committed Principle

  I recommend you adopt **The Grounded Causal Homeostasis Principle**.

  It repairs your tentative principle by adding the requirement of **homeostasis** (stable feedback loops) to reality, and by clarifying **grounding** for construction. This solves the tension between your cases without forcing you to abandon the core insight that social things can be objectively real.

  **Application to Your Cases:**

  *   **1 (Dollar) & 8 (Unemployment):** Both are grounded in institutional/structural facts. Both are real because they sustain causal loops (purchasing power; labor market dynamics). The lack of a "designer" for Unemployment is irrelevant; the grounding is in the structure of the economy, which is social.
  *   **2 (Blackness) & 10 (Whiteness):** Both are grounded in social classification/racialization. Both are real because they figure in causal generalizations (health, housing, lending).
      *   *Repair on 10:* Your intuition that Whiteness is "less real" because it is "thinner" (defined by exclusion) is a *moral* or *political* critique, not an ontological one. Ontologically, if Whiteness confers privilege and structures housing markets, it has causal power. It is as real as Blackness. You must drop the "less real" verdict.
  *   **3 (Witch) vs. 6 (Sillan):** This is the crux of the "empty vs. real" distinction.
      *   *Witch:* Grounded in accusation (social). But it lacked *causal homeostasis*. The feedback loop was destructive (execution/exile) rather than reproductive (identity formation). The kind did not stabilize; it consumed its members. It was a *failed* social kind.
      *   *Sillan:* Grounded in census (social). Achieved *causal homeostasis*. The classification created incentives (marriage, politics) that reinforced the boundary. It became a self-sustaining social kind.
      *   *Verdict:* Both were constructed. Sillans became real; Witches remained an empty (or transiently real only as a target) category.
  *   **4 (Sex) & 9 (Species):**
      *   *Sex:* Grounded in biological facts (gametes). Not constructed. Your discomfort about the "choice of definition" is about the *concept*, not the *kind*. The biological reality exists regardless of the label.
      *   *Species:* Grounded in lineage (biological). Not constructed. The *concept* (how we draw the lines) is interest-relative, but the *lineages* are not. You should not be bothered by 9; the map is constructed, the territory is not.
  *   **5 (Gender):** Grounded in social norms/practices (not biology). No founder needed; grounding is in diffuse practice. Real because it structures life chances and identity.
  *   **7 (NRD):** This is where you must be most precise.
      *   *If Genetic:* The kind is grounded in biology. The *label* is constructed, the *kind* is discovered. It is not a socially constructed kind.
      *   *If No Genetic:* The kind is grounded in the clinical classification and patient response (looping effect). It is a socially constructed kind.
      *   *Your Incoherence:* You said, "Whether a kind is constructed should not depend on how the science later turned out." **This is the verdict you must surrender.** The ontological status *does* depend on what grounds the kind. Science reveals the grounding. If it's genes, it was never constructed. If it's social feedback, it was. Your intuition that the status should be fixed at the moment of labeling confuses the *history of the concept* with the *metaphysics of the kind*.

  ---

  ### Phase 3: The Three Further Things

  #### 1. Category vs. Kind Construction (Case 7)
  You asked whether construction is one thing or whether we must distinguish the construction of a category from the construction of the kind.
  **My Verdict:** You must distinguish them. Case 7 forces this.
  *   **Category Construction:** The creation of a label, a concept, or a diagnostic manual entry. This is *always* social. Someone wrote the DSM; someone named the Sillans.
  *   **Kind Construction:** The ontological status of the group picked out by the category. This depends on **grounding**.
  *   **Resolution for NRD:** The *category* "NRD" was constructed in 1974. The *kind* was either discovered (if genetic) or constructed (if behavioral feedback). Your intuition that "the label was invented, the kind was discovered" is actually coherent *if* you accept this distinction. The incoherence arises only if you think the construction of the label entails the construction of the kind. It does not. We can construct a net (category) to catch fish (kind). Whether the fish existed before the net is an empirical question.

  #### 2. Verdicts on Three New Cases
  Using the Grounded Causal Homeostasis Principle:

  *   **Marriage:**
      *   *Construction:* **Constructed.** Grounded entirely in legal/religious institutions and normative attitudes. There is no "marriage" without these rules.
      *   *Reality:* **Real.** It is causally potent (tax status, next-of-kin rights, social recognition). It exhibits homeostasis (the status reinforces the relationship stability).
  *   **Nationhood:**
      *   *Construction:* **Constructed.** Grounded in treaties, borders, and collective recognition (like the Sillans).
      *   *Reality:* **Real.** Nations go to war, sign treaties, and shape identity. However, like the Sillans, a "failed state" might be constructed but lack reality (no causal power). A functioning nation is real.
  *   **Major Depressive Disorder (MDD):**
      *   *Construction:* **Mixed (Primarily Constructed Category, Debated Kind).** The *category* is constructed (DSM criteria). The *kind* is likely a **cluster kind**.
      *   *Reality:* **Real.** Whether it has a single genetic cause (like NRD might) or is a homeostatic cluster of symptoms/social stressors, it is causally potent (predicts suicide risk, response to therapy). Even if it is socially shaped (looping effects of diagnosis), it is real in the sense that it explains outcomes. I would classify it as a **Real, Socially Scaffolded Kind**. The biology is real, but the threshold for "disorder" is socially constructed.

  #### 3. Which Verdicts to Overturn
  You asked for a plain statement of which of your verdicts my principle cannot recover and which I advise you to overturn, in order of priority.

  1.  **Overturn: Case 10 (Whiteness is "less real").**
      *   *Reason:* This is the most dangerous ontological error. If Reality = Causal Power, Whiteness is paradigmatically real in a racialized society. Its "thinness" (relational definition) does not diminish its causal efficacy in housing, lending, and policing. To call it "less real" is to misunderstand how structural oppression works. It is as real as Blackness.
  2.  **Overturn: Case 7 (Construction status shouldn't depend on science).**
      *   *Reason:* You must accept that ontological status is mind-independent. If NRD is genetic, it was *always* a biological kind, even when we thought it was social. Science reveals grounding; it does not change it. Your intuition here confuses the *stability of our classification* with the *nature of the kind*.
  3.  **Clarify (Not Overturn, but Refine): Case 9 (Species).**
      *   *Reason:* You feel bothered that species concepts are interest-relative. You should not be. Stop worrying. The *concepts* are constructed tools; the *lineages* are discovered facts. Your verdict ("discovered, not constructed") is correct, but your discomfort is unnecessary. Distinguish the map from the territory.
  4.  **Clarify: Case 3 (Witches).**
      *   *Reason:* Do not say they were "empty" in all respects. They were real as a *persecution category* (causal power: death), but failed as a *social identity* (no homeostasis). Refine the verdict to: "Constructed, transiently real as a target, but failed to achieve kind stability."

  ### Final Summary
  Adopt the **Grounded Causal Homeostasis Principle**. It secures the reality of Race, Gender, and Money without committing you to the reality of Witches or the construction of Biological Lineages. It requires you to accept that Whiteness is ontologically robust (however morally objectionable) and that science determines whether a medical kind is discovered or constructed. This is the most coherent framework for a philosopher who trusts their case verdicts but demands theoretical rigor.
