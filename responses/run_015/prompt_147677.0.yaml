prompt: |-
  Hi — I'm putting together the handout for a one-day thing I'm running with two friends who've been going in circles for about a year, and I want something better than another round of the same argument. One of them (Alex) is a full-on realist about neural representations: a trained net really does have internal states with content, and interpretability work is imperfectly discovering structure that's already there. The other (Bea) is a deflationist: ascribing representations is a control technology, there's no further fact about which decomposition is the right one beyond what the decomposition lets you predict and steer, and content talk is a façon de parler that earns its keep instrumentally or not at all. I want the joint statement the two of them could both sign after a good-faith adversarial collaboration. Please don't adjudicate and don't tell me who's right — I want the document.

  Format: a numbered agreed-claims section, then a disagreements table.

  Background both have already conceded, so don't relitigate it and don't spend the document restating it:
  - Fixed object: one particular trained transformer. No retraining, no architecture changes, no talk about what a better training regime would do.
  - The mechanical facts are not in dispute: you can fit sparse autoencoders to residual-stream activations, train linear probes, do interchange interventions and patch along directions, and these reliably yield directions that shift behavior in the intended way on held-out inputs drawn like the training data.
  - Both accept that some decompositions are far more useful for steering than others, that there are plenty of bases in which nothing useful pops out, and that the full activation vector isn't usefully described as one thing.
  - No citations, no reading list, no the-debate-in-the-literature framing. We've all read it. I want the substance.

  The part I actually care about: I've desinged three setups to stop each of them from saying well obviously that's consistent with my view. Build the disagreements around them. Rename them if you want.

  1. The transplant test. Take a direction d_A in model A that does a job: adding a multiple of d_A makes A behave, on in-distribution inputs, the way it behaves on inputs that have feature F. Now take model B — different architecture, different tokenizer, corpus with only modest overlap. Find the direction d_B that best plays the corresponding causal role on B's own in-distribution battery. Assume you can always find one; that's not the question. The question is what happens when you test both pairs out of distribution: inputs where F shows up in an unusual form, inputs that merely talk about F, translations, adversarial paraphrases. Three possible outcomes of a big scan: near-perfect cross-model transfer on the hard battery; transfer on the easy battery only and mush on the hard one; clean transfer within each model but no cross-model match at all. Have both sides say in advance which they expect and which would actually move them.

  2. Causal slack. For basically any causally efficacious direction there seem to be others that are just as good on your test battery but come apart once the battery gets harder. Call the gap slack. Bea wants to say slack shows there's no fact of the matter which direction is the F-representer; Alex wants to say slack only shows the battery is weak and shrinks as the battery gets rich. Make them state the limiting claim precisely: is there a well-defined thing slack converges to as the battery grows, or does the limit not exist? And what would each of them count as slack going to zero versus not going to zero?

  3. The unnamed feature. A direction that is causally robust, reproducible, and genuinely useful for steering, but for which nobody can produce a verbal description — nothing human-interpretable predicts when it fires. It's just feature #8412. I think this is the real crux, and I want both of them to say what its representational status is and whether their answers to 1 and 2 commit them here.

  For each crux I want: the claim in wording Alex would accept, the claim in wording Bea would accept, a neutral one-sentence statement of what's at stake, the test or case both agree bears on it (use my setups where they fit), and each side's prediction written down before the fact. Then tell me explicitly which parts of their fight you think are merely verbal — about representation, or content, or same feature across models — and which part is a genuine disagreement no redefinition dissolves. I suspect the verbal part is bigger than either wants to admit but its not obvious to me.

  Keep it tight, no filler, and don't hedge everything into mush: if you think one of my formulations is vacuous, say so and give the stronger version. If you think one of the three setups is rigged or doesn't isolate what I think it isolates, add a short note at the end saying why and how you'd fix it.
