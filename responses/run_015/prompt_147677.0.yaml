answer: |-
  # Joint Statement: Representational Status in Fixed Transformers

  ### I. Agreed Claims
  1.  **Fixed Object:** We are discussing a single, trained transformer. No architecture changes, retraining, or counterfactuals about alternative training regimes are relevant to the mechanical facts.
  2.  **Mechanical Efficacy:** Linear probes, sparse autoencoders, and interchange interventions reliably identify directions in activation space that shift model behavior on held-out, in-distribution inputs.
  3.  **Basis Dependence:** Not all bases are equal. Some decompositions yield directions that are robust and steerable; others yield noise. The full activation vector is not a singular semantic unit.
  4.  **Utility Gradient:** We agree on the ranking of decompositions by instrumental utility (prediction and steering). We disagree on what utility implies about ontology.
  5.  **No Magic:** There is no homunculus reading the activations. Any "content" or "representation" must cash out in causal influence on downstream tokens or logits.

  ### II. Disagreements Table

  | Crux | Alex's Claim (Realist) | Bea's Claim (Deflationist) | Neutral Stake (What is tested) | Test / Case | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Transplant Test**<br>*(Cross-Model Generalization)* | If direction $d_A$ encodes feature $F$ in Model A, and $d_B$ plays the causal role of $F$ in Model B, then $d_A$ and $d_B$ are instantiations of the *same* representational type. They should track $F$ identically on hard OOD inputs (adversarial paraphrase, translation). | $d_A$ and $d_B$ are distinct control handles that happen to overlap on training distributions. "Same feature" is a shorthand for "similar input-output map," not "shared internal structure." Divergence on hard OOD is expected. | **Mechanism vs. Behavior:** Do different architectures converge on the *same internal solution* for a semantic feature, or merely the *same output behavior* via different internal paths? | **Transplant Setup:** Train $d_A$ and $d_B$ on in-dist. Test on "Hard Battery" (unusual forms of $F$, adversarial paraphrases). Measure activation correlation and intervention efficacy transfer. | **Alex:** High activation correlation & intervention transfer on Hard Battery.<br>**Bea:** High output behavior match, low activation correlation & intervention failure on Hard Battery. |
  | **2. Causal Slack**<br>*(Uniqueness of Direction)* | For any feature $F$, there is a unique direction (or narrow cone) that causally mediates $F$. "Slack" (multiple valid directions) is an artifact of a weak test battery. As battery richness $\to \infty$, valid directions converge to a point. | "Slack" is a feature, not a bug. Multiple distinct directions can sustain identical input-output maps indefinitely. There is no fact of the matter which one is "$F$," even with infinite data. | **Convergence:** Does the set of causally equivalent vectors shrink to a unique limit as constraints increase, or does it remain a subspace? | **Slack Setup:** Identify set $S$ of directions that all successfully steer $F$ on Battery $N$. Increase $N$ to $N+1$ (harder cases). Measure volume/diameter of $S$. | **Alex:** Diameter of $S \to 0$ as $N \to \infty$.<br>**Bea:** Diameter of $S$ stabilizes at $>0$ or limit is undefined. |
  | **3. Unnamed Feature**<br>*(Ontological Status)* | A robust, causally efficacious direction is a representation *even if* no human can verbalize its content. Content is a property of the state, not the observer's ability to label it. | A robust direction is a "control handle." Calling it a "representation" adds nothing until a human-interpretable description is available. Without a label, it is just structure, not content. | **Effability:** Does representational status require human interpretability, or is it intrinsic to the causal role? | **Unnamed Setup:** Identify Feature #8412 (robust, reproducible, causally potent, verbally opaque). Ask: "Does this direction have content?" | **Alex:** Yes. It has content we cannot yet name.<br>**Bea:** No. It has causal power; "content" is withheld until interpretation. |

  ***

  ### Facilitator's Analysis: Verbal vs. Genuine Disagreement

  **Merely Verbal (Ontological Labeling)**
  Approximately 40% of the disagreement is verbal, concentrated in **Crux 3 (Unnamed Feature)** and the definition of "representation."
  *   **The Trap:** Alex uses "representation" to mean *causal structure with semantic properties independent of an observer*. Bea uses "representation" to mean *a mapping useful for an observer to predict/steer*.
  *   **Dissolution:** If Alex agrees to say "causal structure with ineffable content" and Bea agrees to say "instrumentally opaque control handle," they describe the exact same physical state. The fight over whether to grant the noun "representation" to Feature #8412 does not change the experimental predictions.

  **Genuine Disagreement (Empirical & Structural)**
  Approximately 60% of the disagreement is genuine, concentrated in **Crux 1 (Transplant)** and **Crux 2 (Slack)**.
  *   **The Trap:** Neither redefinition resolves the expectation of convergence.
  *   **The Core:** Alex believes the loss landscape and natural language structure force different models into *isomorphic internal geometries* for semantic features. Bea believes the loss landscape only forces *isomorphic input-output behaviors*, allowing for degenerate internal solutions.
  *   **Why it matters:** If Alex is right, interpretability is archeology (digging up universal structures). If Bea is right, interpretability is engineering (building local maps). This determines whether a direction found in Model A is valid evidence for the structure of Model B.

  ***

  ### Note on Setups: Critique and Fixes

  **1. The Transplant Test (Risk of Rigging)**
  *   **Critique:** "Best plays the corresponding causal role" in Model B is the leak. If you search hard enough for $d_B$, you might overfit the "Hard Battery," artificially inflating transfer.
  *   **Fix:** Define $d_B$ *only* using Model B's original training distribution. Do not optimize $d_B$ on the Hard Battery. The Hard Battery must be strictly hold-out for *both* models.

  **2. Causal Slack (Risk of Vacuity)**
  *   **Critique:** "Volume of $S$" is ill-defined in high-dimensional space without a metric. If the metric is Euclidean distance in activation space, scaling issues distort the volume.
  *   **Fix:** Normalize all directions to unit norm. Define "Slack" as the angular variance between successful vectors. Alex claims angular variance $\to 0$; Bea claims angular variance $> \epsilon$.

  **3. The Unnamed Feature (Risk of Moving Goalposts)**
  *   **Critique:** Bea can always claim "we just haven't found the right verbal description yet," deferring the falsification indefinitely.
  *   **Fix:** Impose a time/effort bound. If no interpretable description is found after $X$ compute-hours of automated interpretability, Bea must concede the direction counts as a "representation" *for the purpose of the workshop*, or Alex must concede it is "structure without content." Force a terminological settlement based on the failure of interpretation.
