  10. **Final Polish:** Ensure the distinction between *aggregation* and *distribution* is clear. Ensure the distinction between *act* and *rule* utilitarianism regarding the SoP objection is precise (Rule Utilitarianism usually fails to escape SoP unless it becomes deontological).

  *(Self-Correction on Rule Utilitarianism)*: Does Rule Utilitarianism escape SoP? If the rule is "Maximize utility," no. If the rule is "Respect rights," it escapes SoP but ceases to be utilitarian in the maximizing sense. I need to make this distinction clear in Section 3.

