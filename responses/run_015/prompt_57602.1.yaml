answer: |-
  **TO:** Data Standards Committee
  **FROM:** [Your Name], Backend Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation: Species Definition & Schema Strategy for Q4

  **Executive Summary**

  We need to finalize how our database defines a "species" by quarter-end. The stakes are high: our counts drive state grants and corporate reporting. If we change definitions arbitrarily, we lose funding credibility. If we hardcode a single definition, we lose scientific accuracy when taxonomy updates.

  **Recommendation:** I propose we adopt a **"Versioned Authority Snapshot"** model.

  1.  **Public Facing:** We commit to a single upstream authority (e.g., IUCN or State Checklist) at a specific version for all external reports and dashboards. This gives us the stable numbers Field Programs needs.
  2.  **Internal Storage:** We modify the schema to store observations against *versioned taxon concepts*, not static species IDs. This allows us to remap data when the authority updates without deleting history.

  This is not a compromise; it is a separation of concerns. The public gets stability; the database gets integrity.

  **The Core Concept: Individuals vs. Kinds**

  We are stuck because we are treating species like static buckets (Kinds) when they are actually historical lineages (Individuals). Think of a species less like a job title defined by a list of skills, and more like a specific river. The water changes, the banks erode, and maps get redrawn, but it remains the same river because of where the water came from. If we store species as static definitions, every taxonomy update breaks our history. If we store them as lineages, we can track how the definition changes over time without losing the data attached to it. We need to store the history of the definition, not just the definition itself.

  **Addressing the Field Programs Objection**

  The Head of Field Programs is right: **A count that changes when you change the concept isn't a count, it's a mood.**

  If we publish "40 species lost" because a checklist split one species into two, donors will feel misled. Grant reviewers do not have time for footnotes about phylogenetic species concepts. They need a number that matches the contract.

  **The Cost:** Swallowing this objection means we accept technical debt. We cannot simply "update" the database when a checklist changes. We have to run migration jobs to remap observations to the new taxonomy. It means maintaining multiple versions of "truth" simultaneously (e.g., "2023 Grant Count" vs. "2024 Scientific Count"). It is more work for engineering, but it is the only way to keep the money flowing without lying about the biology.

  **Implementation Plan**

  **1. Schema Changes (Engineering)**
  *   **Current:** `observations.species_id` → `taxa.id` (Static)
  *   **Proposed:** `observations.taxon_concept_id` → `taxon_concepts.id`
  *   The `taxon_concepts` table includes: `scientific_name`, `authority_source`, `version`, `valid_from`, `valid_to`.
  *   **Why:** This allows one observation to be linked to "Species X v1" today and remapped to "Species Y v2" tomorrow without altering the original record.

  **2. Ingestion Pipeline Decision Rules**
  When an observation comes in (e.g., from a volunteer app or partner API):
  *   **Rule 1 (Direct Match):** If the incoming ID matches our Default Authority (vN), link directly.
  *   **Rule 2 (Synonym Match):** If the incoming ID is a synonym in our mapping table, link to the accepted Default Authority concept.
  *   **Rule 3 (Conflict):** If the incoming ID conflicts with the Default Authority (e.g., a split exists in source but not authority), tag the record as `needs_review` and default to the broader parent taxon for counting purposes until resolved.
  *   **Rule 4 (Provenance):** Always store the original `source_id` and `source_name` in a JSONB metadata column. We never overwrite the volunteer's original input.

  **3. Rollout Timeline (End of Quarter)**

  *   **Week 1 (Now):** Committee vote on Default Authority (e.g., "State Checklist 2023.2").
  *   **Week 2-3:** Engineering implements `taxon_concepts` table and migration script for existing data.
  *   **Week 4:** Ingestion pipeline updated to enforce Decision Rules.
  *   **Week 5:** QA against historical reports to ensure counts match previous publications (audit check).
  *   **Week 6:** Go-live.

  **Decision Required**

  To proceed, I need the committee to confirm:
  1.  **Authority:** Which upstream checklist is our "Default Authority" for Q4 reporting?
  2.  **Tolerance:** What is the acceptable lag time for remapping data when that authority updates? (Recommendation: 14 days).

  If we try to store every possible concept simultaneously for public reporting, the numbers become undefined. If we store only one concept statically, the data becomes brittle. The Versioned Snapshot model lets us tell the truth to the database and the truth to the grantors, even if those truths require different views.

  Please reply with your vote on the Default Authority by Friday so engineering can scope the migration.
