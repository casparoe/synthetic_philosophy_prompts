prompt: |-
  I'm on the board of our local weekly and I've been reading a lot about information cascades lately — the idea that a herd can form even when everyone is being rational, because each person treats what earlier people did as evidence. We're about to face a decision and I'd like a short memo you'd circulate to the board before Thursday's meeting. The situation: two bigger outlets in the state both ran a story yesterday that a county commisioner took kickbacks, and both say they reviewed bank records — apparently the same ones. We haven't seen the records ourselves, and the commissioner's lawyer is already calling the story fake. If we run it and it's wrong, we're done for; if we hold it and it's true, we just look timid. I keep flip-flopping on whether two outlets running it is real evidence or basically one data point with two stamps on it. The memo should recommend a concrete course of action — run it, hold it, or verify first — with a time frame, and it should take the "just follow the outlets, their reporting is real evidence" side seriously instead of waving it away as herd behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board Member of a local weekly newspaper.
      *   **Audience:** The rest of the Board.
      *   **Topic:** Decision on whether to run a story about a county commissioner taking kickbacks.
      *   **Context:** Two bigger state outlets already ran it (claiming to review bank records, likely the same ones). Commissioner's lawyer calls it fake.
      *   **Dilemma:** Run it (risk being wrong/liable) vs. Hold it (risk looking timid/missing news) vs. Verify first (cost/time).
      *   **Specific Constraint:** The user has been reading about *information cascades*. They want the memo to take the "follow the outlets" argument seriously (i.e., acknowledge their reporting *is* evidence, not just herd behavior) while still recommending a prudent course of action.
      *   **Deliverable:** A short memo to circulate before Thursday's meeting.
      *   **Requirement:** Recommend a concrete course of action (Run, Hold, or Verify) with a time frame.

  2.  **Deconstruct the "Information Cascade" Aspect:**
      *   *Theory:* In an information cascade, Person B ignores their private signal and follows Person A because they infer Person A had a strong signal. Person C follows A and B.
      *   *Application here:* Outlet 1 runs story. Outlet 2 runs story (possibly relying on Outlet 1's confidence or the same source). The Weekly (us) is considering following.
      *   *User's Insight:* "Two outlets... basically one data point with two stamps on it." This is the crux. If both relied on the *same* bank records (and didn't independently verify distinct sources), the second outlet might be cascading off the first.
      *   *Constraint:* I must take the "their reporting is real evidence" side seriously. I can't just dismiss them as sheep. I need to acknowledge their reputation and resources add weight to the claim, *but* explain why that weight isn't sufficient for *us* specifically given our risk profile.

  3.  **Determine the Recommendation:**
      *   *Run it:* Too risky for a local weekly. If it's libel, the paper dies.
      *   *Hold it:* Looks cowardly, abandons public duty if true.
      *   *Verify First:* The only responsible journalistic and business choice.
      *   *Time Frame:* Needs to be tight. News moves fast. "By Monday" or "48 hours." Let's say 48 hours to attempt independent confirmation.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. We need to decide on the Commissioner story.
      *   **The Argument for Following (Addressing the Constraint):** Acknowledge the two bigger outlets. They have resources. Their reputation is on the line. This *is* Bayesian evidence. It increases the prior probability that the claim is true. It's not just a cascade; it's corroboration.
      *   **The Risk Analysis (The "Weekly" Context):** Why isn't that enough?
          *   Liability: We are smaller. A lawsuit hurts us more.
          *   Source Dependency: If they used the same records/leak, it's one source, not two.
          *   Cascade Risk: Outlet 2 might have just followed Outlet 1.
      *   **The Recommendation:** Verify first.
      *   **The Plan/Timeframe:** Give the editor 48 hours to find *one* independent corroborating element (not just the same records). If not found, we hold or frame it as "alleged by X and Y."
      *   **Closing:** Reiterate the goal (truth + survival).

  5.  **Refining the Tone:**
      *   Needs to be professional, concise, and persuasive.
      *   Needs to show understanding of the "information cascade" concept without using too much jargon (or using it correctly if used).
      *   Needs to balance the "trust the big guys" argument with "protect our paper."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I dismiss the other outlets too easily?
      *   *Fix:* Make sure to explicitly state that their reporting *does* update our probability assessment. It's not noise. But it's not *definitive* proof for *our* liability shield.
      *   *Critique:* Is the timeframe realistic?
      *   *Fix:* 48 hours is standard for breaking news verification.
      *   *Critique:* Did I answer the specific prompt about the "one data point" worry?
      *   *Fix:* Address the "same bank records" issue directly. If the records are the only source, two stories = one source.

  7.  **Final Polish:** Check the length. Keep it "short memo" style. (Bullet points help). Ensure the recommendation is bold and clear.

      *(Self-Correction on the "Information Cascade" constraint)*: The prompt says: "take the 'just follow the outlets, their reporting is real evidence' side seriously instead of waving it away as herd behavior."
      *   *Interpretation:* I need to argue that *normally*, following them would be rational. But in this specific high-stakes case, the cascade risk (same records) outweighs the benefit. I need to validate the intuition that "they wouldn't print it if it wasn't true" before explaining why that's not enough for us.

  8.  **Finalizing the Memo Structure:**
      *   **To:** Board of Directors
      *   **From:** [My Name]
      *   **Subject:** Decision Protocol: Commissioner Allegations
      *   **Context:** The two outlets.
      *   **The "Follow" Argument:** Why it's rational to trust them (reputation, resources).
      *   **The "Cascade" Risk:** Why it might be one source (same records).
      *   **Our Liability:** We can't afford to be the test case.
      *   **Recommendation:** Verify independently for 48 hours.

  9.  **Drafting the Content:** (Mental check of the text to ensure it sounds like a board member talking to board members). *Okay, let's write it.*

      *   *Wait, one nuance:* The user says "If we run it and it's wrong, we're done for." This implies libel risk. The memo needs to emphasize legal safety.
      *   *Nuance on "Evidence":* In Bayesian terms, two outlets *is* evidence. I need to acknowledge that. It shifts the prior. But does it shift it enough to cross the threshold of "actual malice" protection or just general accuracy? For a weekly, accuracy is paramount.

      *   *Revised Plan:*
          1. Acknowledge the weight of the other outlets (it *is* evidence).
          2. Highlight the specific vulnerability (same records = single source).
          3. Propose the "Verify" path with a deadline.

      *   *Let's go.*

  **(Self-Correction during final output generation):** Make sure not to lecture the board on information cascade theory, but use the logic to inform the recommendation. Keep it actionable.

  10. **Final Review against constraints:**
      *   Short memo? Yes.
      *   Circulate before Thursday? Yes (Date will be current).
      *   Concrete course of action? Yes (Verify).
      *   Time frame? Yes (48 hours).
      *   Take "follow the outlets" seriously? Yes (acknowledge their reputational capital).
      *   Address the "one data point" worry? Yes.

      *Ready to generate.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Protocol: County Commissioner Allegations

  **Purpose**
  To recommend a course of action regarding the allegations that County Commissioner [Name] accepted kickbacks, as reported yesterday by [Outlet A] and [Outlet B].

  **The Case for Following the Outlets**
  We must acknowledge that the decision by two established state outlets to run this story is genuine evidence, not merely herd behavior. These organizations have significant reputational capital and legal teams. Their willingness to publish suggests they have high confidence in their source material. From a Bayesian perspective, their reporting should significantly update our prior probability that the allegations are true. Ignoring this signal entirely would be irrational and could leave us appearing out of touch or timid if the story holds.

  **The Cascade Risk**
  However, we face a specific information cascade risk. Both outlets cite reviewed bank records, reportedly the *same* records. If Outlet B relied on Outlet A's confidence rather than independent verification, we effectively have one data point with two stamps. If those records are misinterpreted or forged, both outlets fall, and any outlet that republishes without independent confirmation becomes a primary target for liability.

  For a state-wide publication, a retraction is a bruise. For our weekly, a libel suit based on unverified wire-copy style reporting is an existential threat. We cannot afford to be the test case for the accuracy of their shared source.

  **Recommendation**
  **Verify First.** We should not run the story as confirmed fact tomorrow, nor should we kill it entirely.

  **Action Plan & Time Frame**
  1.  **48-Hour Verification Window:** Editorial staff will attempt to secure one independent corroborating element not relied upon by the state outlets (e.g., a separate source within the commissioner's office, a different financial document, or on-record comment that implies guilt).
  2.  **Attribution Strategy:** If independent verification is not secured by **Saturday at 5:00 PM**, we will publish a story on Monday that explicitly attributes the allegations to the two state outlets and includes the lawyer's denial prominently, framing it as an ongoing investigation rather than established fact.
  3.  **Legal Review:** Any draft must be cleared by our counsel before Monday morning.

  **Conclusion**
  This approach respects the evidence provided by the larger outlets while insulating us from the specific risk that their reporting constitutes a single-point failure. We protect the paper's longevity without abdicating our duty to report on significant public allegations.

  Please review so we can finalize this direction in Thursday's meeting.
