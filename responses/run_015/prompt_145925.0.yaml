answer: |-
  This is a sophisticated angle for a lesson. Using *Macbeth* to teach Walzer's "Dirty Hands" works best not as a confirmation of the theory, but as a **cautionary tale about its corruption.**

  Walzer argues that a political leader may sometimes have to commit a moral wrong to secure a greater political good, *provided* they acknowledge the guilt and suffer for it (the "moral remainder"). If they stop feeling the guilt, they become a monster.

  Here is a breakdown of how to structure this lesson, identifying where the distinction between "public necessity" and "private ambition" holds, and where it collapses.

  ### 1. The Core Thesis for Students
  **Walzer's Condition:** To have "Dirty Hands" legitimately, you must do the wrong thing *for the right reason* (the state), and you must *feel the guilt* afterwards.
  **Macbeth's Trajectory:** Macbeth starts with the guilt (moral remainder) but fails the "right reason" test (ambition). Eventually, he loses the guilt entirely. The play charts the slide from **moral hesitation** $\rightarrow$ **political rationalization** $\rightarrow$ **psychopathic numbness.**

  ---

  ### 2. Scene Analysis: Where the Distinction Holds and Collapses

  #### Phase 1: The Refusal (The "Clean Hands" Moment)
  **Scene:** Act 1, Scene 7 ("If it were done when 'tis done...")
  **The Walzerian Lens:** This is the only moment Macbeth argues like a statesman. He lists reasons *not* to kill Duncan that are explicitly political and moral.
  *   **The Public Good:** He acknowledges Duncan is a good king ("hath borne his faculties so meek"). Killing him damages the state ("deep damnation of his taking-off").
  *   **The Private Cost:** He admits he has no justification other than "vaulting ambition."
  *   **Teaching Point:** This is the **Clean Hands** position. Macbeth recognizes that for the act to be "necessary," it would need to be for Scotland. He admits it is not.
  *   **Key Line:** *"I have no spur / To prick the sides of my intent, but only / Vaulting ambition, which o'erleaps itself."*
      *   *Lesson:* Here, Macbeth knows the gap between "for Scotland" and "for me." He chooses "for me."

  #### Phase 2: The Moral Remainder (The Blood That Won't Wash)
  **Scene:** Act 2, Scene 2 ("Will all great Neptune's ocean...")
  **The Walzerian Lens:** Walzer insists that even if the act is politically necessary, the guilt must remain. The leader must not sleep well.
  *   **The Image:** Macbeth looks at his hands and realizes the blood is metaphysical, not physical. It will turn the ocean red.
  *   **The Guilt:** This is the **Moral Remainder**. Macbeth is suffering the psychological cost of the transgression. In Walzer's view, this suffering is proof he is still moral.
  *   **Teaching Point:** If Macbeth stopped here, he might fit the "tragic politician" mold (like Lyndon Johnson escalating Vietnam while agonizing over it). But he doesn't stop.
  *   **Key Line:** *"My hand will rather / The multitudinous seas incarnadine, / Making the green one red."*

  #### Phase 3: The Rationalization (The Slide to "Necessity")
  **Scene:** Act 3, Scene 1 & Scene 4 ("We've scorched the snake, not killed it")
  **The Walzerian Lens:** This is where the "Dirty Hands" justification is attempted but corrupted. Macbeth begins to frame murder as *security*.
  *   **The Shift:** He moves from "I want the crown" to "I must secure the crown to prevent chaos." He convinces himself that killing Banquo is a preventative measure for the stability of his reign (which he equates with the state).
  *   **The Collapse:** The distinction between "State Security" and "Personal Paranoia" blurs. Walzer requires the necessity to be *real*, not just perceived by a paranoid tyrant.
  *   **Teaching Point:** Ask students: Is Banquo actually a threat to Scotland, or just to Macbeth's lineage? This is where the "Necessary Evil" becomes a lie.
  *   **Key Line:** *"To be thus is nothing, but to be safely thus."* (Being King is meaningless without security).

  #### Phase 4: The Collapse (The Loss of Moral Remainder)
  **Scene:** Act 5, Scene 5 ("I have supped full with horrors")
  **The Walzerian Lens:** This is the anti-Walzer ending. Walzer says the leader must *keep* the guilt. Macbeth announces he is immune to it.
  *   **The Numbness:** Macbeth claims he has eaten so much horror that nothing scares him anymore. The "blood" no longer bothers him.
  *   **The Verdict:** Because he no longer feels the moral remainder, he is no longer a politician with dirty hands; he is a tyrant/monster. He has lost his humanity.
  *   **Teaching Point:** This is the danger of the "Dirty Hands" doctrine. If you rationalize enough, you stop feeling the guilt. Once the guilt is gone, the justification is gone.
  *   **Key Line:** *"I have almost forgot the taste of fears... / I have supped full with horrors."*

  ---

  ### 3. Lesson Plan Strategy: The "Gap" Exercise

  To help students see the gap between "Wrong for Scotland" and "Wrong for Me," try this comparative exercise:

  **Step 1: The Walzer Checklist**
  Write these three criteria on the board (based on Walzer's *Political Action: The Problem of Dirty Hands*):
  1.  **Necessity:** Was the act truly required to save the community?
  2.  **Reluctance:** Did the leader hesitate and prefer not to do it?
  3.  **Remainder:** Does the leader feel guilt/suffering after the act?

  **Step 2: Group Work**
  Assign groups to apply the checklist to Macbeth at three stages:
  *   **Group A:** The Murder of Duncan (Act 1 & 2)
  *   **Group B:** The Murder of Banquo (Act 3)
  *   **Group C:** The Murder of Macduff's Family (Act 4)

  **Step 3: The Discussion (The Collapse)**
  *   **Duncan:** Fails Necessity (Ambition). Passes Reluctance. Passes Remainder.
  *   **Banquo:** Questionable Necessity (Paranoia). Fails Reluctance (he hires murderers to distance himself). Remainder fading (he sees the ghost, but pushes through).
  *   **Macduff's Family:** Fails All Three. It is spite, not statecraft. No reluctance. No guilt.

  **Step 4: The "Neptune" Question**
  Ask the class: *Walzer says a leader with dirty hands must look at their hands and see blood that won't wash off. Macbeth says this in Act 2. But by Act 5, he says he doesn't feel fear anymore. Why does Walzer insist the guilt must stay?*
  *   *Answer:* Because the guilt is the only thing proving you haven't become the evil you fought against. Macbeth's tragedy is that he washed his hands (psychologically) before he died.

  ### 4. Addressing the "Niche Reading"
  You mentioned the reading where Macbeth starts with a "clean hands refusal." You can validate this but pivot it:

  *   **Validation:** Yes, Act 1, Scene 7 is a masterclass in ethical reasoning. He understands the "Clean Hands" position better than anyone. He knows that as a host and kinsman, he should protect Duncan.
  *   **The Pivot:** The Witches don't *make* him do it; they offer a **rationalization framework**. They tell him he *will* be King. This allows him to shift from "I am murdering a king" to "I am fulfilling destiny/fate."
  *   **The Lesson:** The "Dirty Hands" problem is often triggered by leaders convincing themselves that **History** or **Destiny** demands the evil act. Macbeth uses "Fate" to bypass "Morality."

  ### 5. Summary for the Board
  *   **Clean Hands:** Refusing to do evil, even for good outcomes (Macbeth in 1.7).
  *   **Dirty Hands (Walzer):** Doing evil for the state, but suffering the guilt (Macbeth in 2.2).
  *   **Dirty Hands (Corrupted):** Doing evil for the self, calling it "state security," and stopping the guilt (Macbeth in 3.4 and 5.5).

  **Conclusion for Students:** *Macbeth* warns us that the "Dirty Hands" argument is the most dangerous lie a politician can tell themselves. It is easy to start with "I must do this for Scotland" and end with "I did this for me," all while convincing yourself the blood has washed off.
