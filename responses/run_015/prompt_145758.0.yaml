answer: |-
  **Outline of Positions**

  *   **Dr. A (Predictive Anatta):** Argues that combining Abhidharma skandha analysis with predictive processing reveals no owner of experience. The 'self' is merely a virtual controller constructed by nested loops of prediction-error minimisation. There is no central binder; coherence emerges from parallel streams.
  *   **Dr. B (Functional Self-Model Resistance):** Contends that while a metaphysical substrate is absent, predictive architectures computationally require a top-level self-model to bind lower-level predictions into a coherent stream. Without this functional hierarchy, the system fragments.
  *   **Key Conflicts:** The binding problem (parallel skandha-streams vs. self-model binding) and moral responsibility (distributed agency vs. functional locus).

  ***

  **Dialogue: The Virtual Controller**

  **Dr. A:** You're granting the self-model too much architectural privilege, Julian. If you take the skandha analysis seriously alongside predictive processing, the 'owner' is redundant. We have nested loops of prediction-error minimisation constructing a virtual controller. Nothing more.

  **Dr. B:** Redundant? Or computationally necessary? I agree there's no metaphysical substrate, Anita. But a predictive architecture requires a top-level prior to bind lower-level predictions into a coherent stream. Without a functional self-model, you don't get a person; you get a fragmentation of processes.

  **Dr. A:** That assumes binding requires a binder. In the Abhidharma, the skandhas run parallel. They co-ordinate through causal synchrony, not a central executive. Why posit a unitary self-model when distributed error-correction achieves the same stability? It's like a market economy; it clears without a CEO.

  **Dr. B:** A market still requires currency—a common metric. In cognition, that metric is the self-model. It provides the reference frame against which prediction errors are measured. If I reach for a cup, the proprioceptive error is minimised relative to *my* body schema. Remove the 'my', and the error signal lacks a locus. You dissolve the very mechanism you're describing.

  **Dr. A:** You're conflating the content of the model with the structure of the process. The system minimises error for the organism, not for a 'self'. The feeling of ownership is just another prediction—a high-level generative model that says 'this experience belongs to a subject'. It's a user-illusion rendered for social interface, not ontological truth.

  **Dr. B:** But if it's necessary for the interface, it's functionally real. Consider the binding problem. Under your view, visual, somatic, and narrative streams run parallel. What synchronises them? If there's no top-level self-model integrating these modalities, why do I experience a unified colour and shape simultaneously, rather than disjointed qualia?

  **Dr. A:** Because the streams are causally coupled. The visual prediction influences the motor prediction directly. There is no need for a central theatre where the lights come on. The unity is emergent, not imposed. You're smuggling in a homunculus under the guise of a 'functional model'.

  **Dr. B:** Not a homunculus, a hierarchy. Without a top-level prior organising these streams, the system cannot prioritise conflicting errors. If pain conflicts with narrative intent, what adjudicates? The self-model acts as the weighting mechanism. It's not an owner, but it is a functional centre of gravity.

  **Dr. A:** Adjudication happens via competitive dynamics between the skandhas themselves, not by a higher court. This brings us to responsibility. If agency is distributed across prediction loops, blame and praise are merely retrospective attributions. Karma operates without a karmin. Causal continuity suffices.

  **Dr. B:** Does it? If I strike someone, and you say 'no one struck them, only loops minimised error', you undermine the normative force of responsibility. We hold agents accountable because the self-model integrates intention and action. If that integration is merely fictional, why punish the loop?

  **Dr. A:** You punish the loop to modify future predictions. It's causal management, not retributive justice. The illusion of the agent is useful for social coordination, but we shouldn't mistake the map for the territory. The suffering arises when we cling to the functional model as substantial.

  **Dr. B:** But clinging is itself a functional state predicted by the model. You can't escape the architecture by declaring it empty. If the self-model is required for coherence, then anatta cannot mean the absence of that model, only the absence of its metaphysical weight. We must inhabit the centre, even if the centre is hollow.

  **Dr. A:** Precisely. But you keep trying to fill the hollow with functional necessity. I'm saying the hollow is the point. The loops run; the centre is vacant.

  **Dr. B:** And I'm saying if the centre is truly vacant, the loops unravel. We shall have to agree that the emptiness is structured differently than you suppose.

  **Dr. A:** Indeed. Though I suspect our predictions about this disagreement are already minimising error.

  **Dr. B:** Quite. Pass the sugar, would you? This coffee is terribly bitter.

  **Dr. A:** Only because you predicted it would be.
