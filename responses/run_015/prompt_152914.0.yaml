answer: |-
  **Exam Prompt: Moral Uncertainty and Incommensurability**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25
  **Instructions:** Closed book. No citations required.

  **Essay Question**
  You hold 90% credence in a lexical deontological theory that forbids killing innocents regardless of consequences, and 10% credence in a cardinal utilitarian theory that measures welfare on a linear scale. You face a choice where killing one innocent person prevents a catastrophe causing immense suffering to millions. Standard expected choiceworthiness calculations fail here because the deontological metric isnt cardinal—it treats the violation as infinitely wrong or lexically prior. Dont just tell me to follow the most probable theory. Explain how you might construct a intertheoretic comparison function that allows these incommensurable metrics to talk to each other without collapsing the lexical constraint into mere welfare units. Is variance normalisation enough, or do we need a structural equivalence approach? Argue for a specific method of handling the scale mismatch.

  ***

  **Model Answer**
  The core problem here is that expected moral value maximisation breaks down when one theory uses a lexical ordering and the other uses a cardinal scale. If the deontological theory says killing is infinitely wrong, any non-zero credence in it vetoes the utilitarian calculation, which seems implausibly rigid for a mixed-credence agent. We cant just assign a finite number to the rights violation because that misrepresents the deontological theorys actual structure.

  A better approach is variance normalisation, where we scale the choiceworthiness of each theory by its standard deviation across available options. This puts both theories on a common statistical footing without forcing the deontologist to admit a price for rights. However, this risks fanaticism if the utilitarian scale is unbounded, so we might need to cap the range or use a range-based normalisation instead. Ultimately, we need a method that respects the structural difference—perhaps treating the lexical constraint as a veto only above a certain credence threshold—rather than pretending the metrics are naturally comparable. The goal is to make a decision that reflects uncertainty without distorting the content of the theories themselves.

  ***

  **Marking Scheme**
  1. Award marks for clearly defining the problem of intertheoretic comparison between lexical and cardinal scales.
  2. Look for a concrete proposal on normalization, such as variance scaling or range normalisation, rather than vague hand-waving.
  3. Check if the student addresses the risk of fanaticism when maximizing expected choiceworthiness across these metrics.
  4. Give credit for critically evaluating their own proposed solution against counterexamples or edge cases.
  5. Ensure the argument is structured logically and fits within the 45-minute time limit without unnecessary fluff.
