answer: |-
  1. The mapping.
  The Hole Argument primarily establishes (c) No-determination: boundary data outside fails to fix the metric inside. Because the alternative solutions are diffeomorphic, they entail (b) No-difference: all point-coincidences remain invariant. (a) follows for observers confined to the manifold. Here the readings converge; they are not separable because the indeterminism is constructed precisely to preserve observational equivalence. The inaccessible quantity is the metric value attached to a bare manifold point independent of the field distribution. The observer is any physical system within the spacetime registering point-coincidences. Applied consistently in 1913, the norm should have indicted naive manifold substantivalism (the belief that points have identity independent of the metric), not general covariance. Einstein instead rejected covariance to save determinism. The norm implies the *Entwurf* theory's restricted covariance was an ad hoc fix for an ontological error; by retaining point individuality, *Entwurf* required non-covariant laws to ensure determination. Consistent application demands dropping the individuality, allowing covariance without underdetermination.

  2. What the norm cannot explain about the episode.
  The norm is silent on Einstein's historical psychology. He read the argument as a causality violation (failure of determination) rather than an ontological excess because he prioritized deterministic laws over ontological parsimony. The two-year delay reflects technical struggles with the Newtonian limit and energy conservation, not philosophical refinement of the norm. He needed equations that reduced to Newtonian gravity and accounted for Mercury's perihelion, constraints the norm does not address. Furthermore, the norm cannot address Kretschmann's objection: since any theory can be made generally covariant, the Hole Argument's force cannot stem from covariance itself but from the assumption that diffeomorphic models represent distinct physical worlds. The inaccessibility framing presupposes the verdict it seeks to derive: that diffeomorphic differences are unphysical. It explains why one *might* reject substantivalism, but not why Einstein specifically struggled with the field equations' physical content or why covariance was viewed as a physical constraint rather than a formal property.

  3. What the episode does to the norm: confirmation, anomaly, or a case the norm was never designed for?
  The episode transforms the norm from an epistemic principle into a metaphysical constraint on individuality. It confirms the norm if understood as banning underdetermination, but it is an anomaly if the norm is purely empirical, since the issue is modal (possible redistributions). The moral is under-determined: the norm rules out naive substantivalism but equally supports sophisticated substantivalism (where points lack haecceity) and relationism. It licenses only the thin claim that one should not multiply undetectable differences, leaving the positive ontology open. Thus, the norm functions as a criterion for theory equivalence rather than a unique ontology generator. It suggests the norm is not about what we can know, but about what counts as a distinct physical possibility. The episode confirms the norm's utility in pruning ontology but reveals it cannot select between empirically equivalent metaphysical frameworks.

  4. A transfer test.
  In black hole interiors, (a) holds for external observers but fails for infalling ones; (b) holds for external measurements; (c) holds given external data. Beyond cosmological horizons, similar splits occur. Here the readings come apart sharply based on observer trajectory, unlike the Hole Argument where all observers share the accessibility limitation. A fourth notion, joint inaccessibility, is needed to capture global undetectability. The norm yields counterintuitive results if it denies ontology to regions accessible to *some* legitimate observers (infalling). This suggests the norm must be restricted to differences inaccessible to *all* possible observers within the model, reinforcing the Hole Argument's moral that only invariant quantities are real, but warning against conflating observer-relative limits with ontological absence. The physical inaccessibility of horizons differs from the principled inaccessibility of the hole, testing the norm's scope. If the norm excludes horizon-hidden regions, it fails; if it excludes only gauge-dependent differences, it succeeds, supporting the moral in (3) that the norm targets representation, not existence.

  Verdict: Someone accepting the inaccessibility norm should accept the anti-substantivalist moral only if they define ontology strictly by invariant quantities, but the episode gives rejectors reason to restrict the norm to cases of global underdetermination rather than local observer limits. Ultimately, the Hole Argument confirms the norm as a constraint on representation, not necessarily as a guide to fundamental existence.
