      *   *(d) EDA Asymmetry:* Perception survives EDAs (due to calibration/bootstrapping); Morality does not (lack of independent access).
      *   *(e) Structural Realism:* Basic beliefs are *structurally* prior. Justification flows one way (foundations $\rightarrow$ superstructure), not holistically.

