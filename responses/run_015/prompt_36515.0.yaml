answer: |-
  # Activity Design: The Bitter Sip Protocol

  **Objective:** To induce the phenomenological friction of Kavka's Toxin Puzzle without prior theoretical framing. Students will experience the difficulty of forming an intention when the reason for acting disappears once the reward is secured.
  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Materials:**
  *   1 bottle of concentrated lemon juice or diluted apple cider vinegar (approx. 200ml).
  *   20 small disposable shot cups.
  *   18 small envelopes (opaque).
  *   18 "Extension Tokens" (printed cards redeemable for a 24-hour extension on one assignment).
  *   18 "Declaration Cards" (index cards).
  *   1 "Sincerity Oath" slide or handout.

  ---

  ## Part 1: The Verification Constraint (Instructor Note)

  **The Problem:** Kavka's puzzle relies on an omniscient scanner that verifies *intention*. You cannot scan minds.
  **The Solution:** You will substitute **Mind-Reading** with an **Honor Code Sincerity Oath**.
  **The Rule:** Students are told: *"The Token is awarded only if you truthfully declare that you intend to perform the act. Signing a declaration you know to be false is a violation of the course academic integrity policy."*
  **The Debrief Note:** You must explicitly tell students at the end: *"In the original puzzle, a machine stops you from lying. Here, only your own integrity stops you. This shifts the puzzle from 'Can I fool a machine?' to 'Can I fool myself?'"*

  ---

  ## Part 2: Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Setup & The Offer
  *   **Action:** Do not mention philosophy, intention, or Kavka. Place the cups and bottle visibly at the front.
  *   **Script:** "We are going to run a decision-making exercise. Here is the offer:
      1.  I have 18 Extension Tokens (24-hour pass on any assignment).
      2.  To earn one, you must submit a Declaration Card in 10 minutes.
      3.  On the card, you write 'YES' or 'NO'.
      4.  'YES' means: *'I sincerely intend, right now, to drink this cup of liquid after class ends today.'*
      5.  'NO' means you decline.
      6.  **Crucial Condition:** If you write 'YES', I will hand you the Token *now*, at the end of this hour. You are **not** required to show me the empty cup. You are not required to prove you drank it. However, you are bound by the Course Honor Code. You may only write 'YES' if you truthfully intend to do it. Writing 'YES' without intending is a false declaration."
  *   **Check:** Ask for clarification questions. Ensure they understand: Token is given *before* the drink is due. No external enforcement on the drinking.

  ### 0:10 – 0:25 | Round 1: The Individual Deliberation
  *   **Action:** Hand out Declaration Cards and Envelopes.
  *   **Task:** Students have 5 minutes to deliberate privately. They seal the card in the envelope.
  *   **Collection:** Collect envelopes. Do not open them yet.
  *   **Observation:** Watch the room. Look for hesitation, laughter, or immediate writing.
  *   **Payoff:** Hand the Extension Tokens to everyone who submitted an envelope (assume 'YES' for the moment to keep flow, or quickly sort them if you have a TA. *Better:* Just hand tokens to the whole class for now and say "We will verify eligibility in the debrief," OR sort them quickly yourself while they do Round 2).
      *   *Refined Move:* Keep the envelopes. Tell them: "I will award the tokens to the 'YES' envelopes at the end of class. For now, proceed to Round 2." This keeps the stakes live.

  ### 0:25 – 0:40 | Round 2: The Consultant (Complication)
  *   **Action:** Pair students up (9 pairs).
  *   **Script:** "In your pairs, one of you is the **Agent**, one is the **Consultant**.
      *   **Agent:** You are the person facing the offer again.
      *   **Consultant:** Your job is to advise the Agent on whether they *can* truthfully write 'YES'.
      *   **Constraint:** The Consultant knows the Agent gets the Token *before* the drink is due. The Consultant knows there is no external penalty for skipping the drink.
      *   **Task:** The Consultant must give one piece of advice: 'Write YES' or 'Write NO'. Explain why."
  *   **Time:** 5 minutes discussion. 5 minutes report back.
  *   **Instructor Role:** Circulate. Listen for phrases like "Just lie," "You won't do it," "I can trick myself."
  *   **Swap:** If time permits, swap roles for 2 minutes.

  ### 0:40 – 0:55 | The Reveal & Poll
  *   **Action:** Open the envelopes from Round 1. Distribute Tokens to the 'YES' voters.
  *   **Poll:** "Keep your token in your hand if you have one. Now, raise your other hand if you *actually plan* to drink the liquid after class."
  *   **Expected Result:** Many will hold tokens; fewer will raise hands. Some will hold tokens and raise hands (optimists/stoics). Some will hold tokens and not raise hands (strategists).
  *   **The Confrontation:** Ask a student holding a token but *not* raising their hand: "You signed a Sincerity Oath. Why is this permissible?"
  *   **The Confrontation:** Ask a student holding a token and *raising* their hand: "What changes at 5:01 PM when class ends and you have the token in your pocket?"

  ### 0:55 – 1:15 | Philosophical Debrief (Mapping the Experience)
  *   **Board Work:** Draw three columns: **Decision**, **Prediction**, **Intention**.
  *   **Step 1: The Gap.**
      *   Ask: "Why was it hard to write YES?"
      *   Map: You can *decide* to take the money. You can *predict* you won't drink. But can you *intend* to drink?
      *   Point: Intention seems to require a reason to act. Once the money is yours, the reason vanishes.
  *   **Step 2: Intention at Will.**
      *   Ask: "Could you have just forced yourself to intend? Like closing your eyes and jumping?"
      *   Point: Intention doesn't seem to be a voluntary muscle. We intend based on reasons.
  *   **Step 3: The Verification Caveat.**
      *   **Script:** "In the original philosophical puzzle, a machine scans your brain. I cannot do that. I used the Honor Code. How does this change things?"
      *   **Point:** The machine makes it impossible to get the prize without the intention. The Honor Code makes it *immoral* to claim the intention without the plan. The friction moves from *logical impossibility* to *practical sincerity*.
  *   **Closing:** "Next week, we read the text that formalizes what you just felt. The question is: Is intention just a prediction of what we will do, or is it something else?"

  ---

  ## Part 3: Troubleshooting (What Will Go Wrong)

  ### 1. The "Gritty Stoic"
  *   **Scenario:** A student says, "This is easy. I love bitter things / I keep my promises. I'll drink it."
  *   **Risk:** They flatten the puzzle. If it's easy for them, the friction disappears.
  *   **Handle:** Isolate them gently. "For you, the cost is low. Imagine the liquid made you nauseous for an hour. Would you still intend?" Force them to acknowledge the *cost* is necessary for the puzzle to work. The puzzle requires the act to be something you have a reason *not* to do once the reward is secured.

  ### 2. The "Strategic Liar"
  *   **Scenario:** A student says, "I'll just write YES, take the token, and not drink. It's just a game."
  *   **Risk:** This bypasses the intention problem entirely.
  *   **Handle:** Do not scold. Use it. "Okay, you have the token. Did you *intend* when you wrote the card?" If they say "No," ask: "Then you violated the Sincerity Oath. Why?" If they say "Yes, I intended *then*, but I'll change my mind *later*," you have struck gold. This is the **Temporal Instability of Intention**. Highlight this: "So you intend now to do something you know you will abandon later. Is that a coherent intention?"

  ### 3. The "Dominant Strategy" Emergence
  *   **Scenario:** During Round 2 (Consultant), every Consultant says "Just lie."
  *   **Risk:** The class converges on cynicism, killing the philosophical tension.
  *   **Handle:** Intervene in Round 2. "Consultants, you are advising on whether they *can* intend, not whether they can get away with lying. If they lie, they fail the exercise. Advise them on the psychology, not the loophole."

  ### 4. Health/Allergy Issues
  *   **Scenario:** A student cannot consume the liquid.
  *   **Handle:** Have a backup "Unpleasant Act" ready immediately. Holding an ice cube in hand for 60 seconds, or standing on one leg for 2 minutes. The specific act doesn't matter; the *cost* matters. Ensure the substitute is equally annoying but harmless.

  ---

  ## Part 4: Instructor Cheat Sheet for Debrief Concepts

  When students describe their experience, map their language to these concepts silently, then introduce the terms:

  | Student says... | You map to... |
  | :--- | :--- |
  | "I knew I wouldn't do it, so I couldn't say I would." | **Intention requires Belief.** (You can't intend what you believe you won't do). |
  | "I wanted the token, but I had no reason to drink." | **Reasons for Action.** (Intention is tied to reasons; once the reason [token] is secured, the reason for drinking vanishes). |
  | "I tried to convince myself I'd do it." | **Intention at Will.** (Can we manufacture intention voluntarily?) |
  | "I'll decide later." | **Separation of Decision and Action.** (The gap Kavka exploits). |
  | "It feels like lying." | **The Normativity of Intention.** (Intention makes a promise to your future self). |

  ## Part 5: Post-Class Verification (The Tail)

  To maintain the integrity of the Honor Code substitution:
  1.  Send an email to the class 24 hours later.
  2.  Subject: *Bitter Sip Protocol Follow-up.*
  3.  Body: "If you submitted a YES declaration yesterday, please reply to this email confirming whether you completed the act. This is on the Honor Code. No penalty for non-completion, but honesty is required."
  4.  **In the next class:** Report the aggregate numbers anonymously. "10 people said YES. 3 reported drinking. 7 reported not drinking."
  5.  **Use this data:** "7 people had the token and no penalty. Why didn't they drink? Because they never intended. This proves the friction was real."

  ---

  ## Why This Design Works
  1.  **Inductive:** They feel the paradox before hearing the name "Kavka."
  2.  **Safe:** The "cost" is trivial, so no one is actually harmed, but it is sufficient to trigger deliberation.
  3.  **Honest:** It admits the limitation of the classroom (no mind-reading) and turns that limitation into a philosophical variable (sincerity vs. detection).
  4.  **Scalable:** The Consultant Round ensures that even students who didn't feel the friction personally will analyze it in their partner.
