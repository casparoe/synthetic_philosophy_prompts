  **Session: The Foggy Highway (90 Minutes)**

  **Payoff Scheme**
  *   **Exit 1:** $0 (Crash)
  *   **Exit 2:** $10 (Home)
  *   **Pass Both:** $6 (Motel)
  *   *Optimal Ex Ante:* Always Pass ($6).
  *   *Temptation:* At an intersection, exiting looks attractive if you believe you're likely at Exit 2.

  **Protocol: The Two-Card Blind**
  1.  **Setup:** 16 participants. Play money.
  2.  **Enforcement:** Participants sit behind dividers. Each receives two facedown cards labeled "Intersection." They know one is Exit 1, one is Exit 2, but cannot distinguish them.
  3.  **The Rule:** They must write a *single* instruction on a strategy card (e.g., "EXIT" or "PASS") that applies to *both* intersections. They cannot write different instructions for each card.
  4.  **Resolution:** Facilitator reveals cards. If "EXIT" is written: Payoff depends on the first card revealed (Exit 1 = $0, Exit 2 = $10). If "PASS" is written: Payoff $6.

  **Rounds**
  *   **Round 1 (Ex Ante):** Everyone writes a strategy. Most will choose "PASS" ($6 guaranteed). Record average earnings.
  *   **Round 2 (Ex Post Defection):** Tell participants: "You are now *at* an intersection. You feel tired. You can override your previous strategy for this round only." Allow them to change their instruction to "EXIT" hoping they are at Exit 2.
      *   *Goal:* Split the room. Half stick to "PASS" (earning $6). Half switch to "EXIT" (50% chance of $0, 50% of $10; Expected Value $5).
      *   *Result:* The "PASS" group out-earns the "EXIT" group, demonstrating the planning/action gap.
  *   **Round 3 (Value of Ignorance):** Offer to sell a hint ("This card is Exit 1") for $3.
      *   *Trap:* If they buy, they know to Pass Exit 1, but then they know the next is Exit 2, so they Exit. Payoff: $10 - $3 = $7.
      *   *Wait, standard AMD twist:* Information can hurt. Adjust hint price to $5. If they buy, they Pass 1, Exit 2. Net $5. If they stay ignorant and Pass both, Net $6. They should *refuse* info.
      *   *Execution:* Offer hint for $5. Compare buyers vs. non-buyers.

  **Debrief (20 Minutes)**
  1.  **Scoreboard:** Show Round 2 earnings. The "Planners" (Pass) beat the "Actors" (Exit).
  2.  **Mapping:** Explain that "Writing one instruction" = Ex Ante planning. "Overriding at the table" = Ex Post reasoning. The loss comes from the "Actor" failing to internalize that their choice applies to Exit 1 too.
  3.  **Info Twist:** Highlight those who refused the hint. They paid to remain absent-minded to preserve their commitment device.
  4.  **Theory:** Briefly mention CDT vs. EDT vs. UDT without jargon. The "Planner" is a UDT-like agent; the "Defector" is a naive CDT agent.

  **Predictable Failure Modes**
  1.  **Counting Prompts:** Participants may realize the facilitator hands out cards sequentially. If they see a second card, they know it's Exit 2.
      *   *Fix:* Collect both decision cards simultaneously before revealing positions.
  2.  **Probability Confusion:** Players will argue, "But I'm 50% likely to be at Exit 2."
      *   *Fix:* Remind them the payoff depends on the *global* strategy, not the local probability.
  3.  **Collusion:** Players comparing answers.
      *   *Fix:* Isolate decision writing.

  **The Missing Feature**
  You cannot reproduce **true memory loss**. In this game, participants *know* they are in a simulation with two exits. They are simulating absent-mindedness via rules, not experiencing it cognitively. In the real problem, the agent genuinely cannot condition on "being at the second exit" because that memory doesn't exist. Here, they are merely restricted from *using* that knowledge. You must verbally emphasize that real absent-mindedness isn't just a rule constraint; it's an ontological collapse of distinct temporal selves.

