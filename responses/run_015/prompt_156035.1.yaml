  1. Begin with luminosity, not KK. Define a condition as luminous if obtaining it guarantees you are in a position to know it obtains. Present KK as the thesis that knowledge itself is luminous. This dependency is real: Williamson's argument dismantles general luminosity, removing KK's foundation. Note 'in a position to know' is weaker than 'knows,' bypassing the step from availability to belief.

  2. The drowsy driver example is safe provided you stipulate no external cues and treat drowsiness as a functional state, not raw feeling. It works because it changes gradually without the subject noticing. Ensure students see the driver is rational; the failure is not negligence but limits of discrimination. This prevents filing the conclusion under 'introspection of feelings is unreliable.'

  3. Before stating the argument, establish the 'indistinguishability premise.' Construct a sequence of moments from alert to asleep where adjacent moments feel identical. Secure agreement that one cannot know one is alert in case i while being slightly less alert in case i+1, or else the margin-for-error principle cannot gain traction.

  4. Head off the 'Sorites in costume' misconception immediately after presenting the sequence. Acknowledge the structural resemblance but insist the conclusion is metaphysical, not semantic. The point is not that 'drowsy' is vague, but that no non-trivial state can guarantee knowledge of itself due to the fallibility of discrimination.

  5. Prevent the 'we never know our own minds' error right after delivering the anti-luminosity conclusion. Clarify that the argument only targets conditions obtaining gradually over time. Immediate sensations or trivial truths remain knowable; the result limits infallible self-knowledge, not self-knowledge per se.

  6. Block the 'knowledge requires certainty' misconception when discussing why KK fails. Emphasize that the subject can know they are alert without being certain. KK fails because knowledge does not guarantee awareness of that knowledge, not because the initial knowledge claim was too confident.

  7. Openly decline to explain possible worlds semantics or formal modal operators. Tell them you will treat 'in a position to know' intuitively. Introducing safety conditions or accessibility relations will confuse students lacking logic training and distract from the core intuitive conflict between reliability and knowledge.

  8. For the check, avoid asking for a summary. Instead, test their ability to apply the margin-for-error constraint to a new case to see if they understand the structural requirement for luminosity. Is the condition 'currently having a headache' luminous, and does it evade the margin-for-error argument because pain lacks gradual onset or because it is a sensation?
