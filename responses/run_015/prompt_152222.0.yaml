answer: |-
  **Project Title:** Normative Deflationism: Metaontological Disputes and Institutional Kinds

  **Project Summary**
  Contemporary metaontology has largely coalesced around deflationary accounts of existence disputes. Prominent frameworks suggest that many ontological debates are merely verbal, arising from divergent conceptual schemes rather than substantive disagreement about the world. While this approach offers peace for disputes regarding physical objects or abstracta, it remains untested in the domain of institutional kinds. This project investigates whether metaontological deflationism collapses or requires revision when applied to socially constructed entities with high practical stakes. By analyzing cases such as privately run prisons and unenforced borders, I will determine if the verbal/substantive distinction can hold when ontological classifications directly constitute normative realities. The goal is to produce a criterion for distinguishing harmless verbal disputes from politically entrenched ontological conflicts, ensuring metaontology remains relevant without obscuring power dynamics.

  **Research Question**
  Does metaontological deflationism remain viable when applied to institutional kinds, or does the practical entrenchment of social categories render the verbal/substantive distinction self-undermining? Specifically, can we draw a principled line between social-ontological disputes that are genuinely verbal versus those where the classification itself carries unavoidable practical stakes that resist semantic dissolution?

  **Background and Gap**
  Current metaontological literature focuses primarily on fundamental physics, mereology, and mathematics. In these domains, declaring a dispute "verbal" is theoretically harmless; whether a table "exists" in a robust sense rarely alters legal rights or material conditions. However, institutional kinds (e.g., money, borders, marriages, prisons) are ontologically dependent on collective acceptance and constitutive rules. Here, existence claims are performative: to say a border "exists" is to validate enforcement mechanisms; to say a facility is "not a prison" is to alter liability and rights.

  Existing deflationary accounts ignore this normative dimension. They assume that once semantic variance is identified, the ontological anxiety dissolves. In social ontology, this dissolution may be illusory. If a deflationist argues that the debate over private prisons is merely verbal, they may inadvertently neutralize a political critique by framing it as a semantic preference. Conversely, if all practical stakes make a dispute substantive, deflationism loses all traction in the social realm. There is currently no framework for adjudicating when a social-ontological dispute is merely conceptual versus when it is metaphysically robust due to its normative consequences.

  **Methodology (10-12 Weeks)**
  The project will proceed in three phases, designed to move from theoretical mapping to case application and finally to criterion construction.

  *   **Weeks 1-4: Framework and Literature Synthesis.**
      I will map the constraints of standard deflationary accounts (e.g., quantifier variance, conceptual plenitude) against leading theories of social ontology. The focus will be on identifying the specific mechanism by which institutional kinds acquire "ontological weight." I will formulate a preliminary hypothesis: that deflationism fails when the ontological claim is constitutive of the norms it describes.
  *   **Weeks 5-8: Case Study Analysis.**
      I will apply competing metaontological frameworks to two specific cases:
      1.  *The Private Prison:* Is a privately run detention facility ontologically distinct from a public prison? If the dispute is verbal, what happens to the moral obligations attached to the category "prison"?
      2.  *The Unenforced Border:* Does a border cease to exist if enforcement mechanisms are removed? If existence is tied to function, does deflationism obscure the reality of the boundary?
      For each case, I will test whether treating the dispute as verbal resolves the tension or merely displaces it into the pragmatic realm.
  *   **Weeks 9-12: Criterion Development and Drafting.**
      Based on the case studies, I will draft a modified deflationary criterion. This will attempt to distinguish between *semantic variance* (different words for the same normative structure) and *constitutive variance* (different structures generating different norms). The final output will be a research paper arguing for a "Practicality Constraint" on metaontology.

  **Expected Outcomes and Success Conditions**
  *   **Success:** The project produces a defensible criterion that allows metaontologists to identify when a dispute is "merely verbal" without ignoring the political consequences of the classification. A successful result might show that deflationism applies only when the normative consequences remain invariant across conceptual schemes. If the norms change, the dispute is substantive.
  *   **Failure:** The project fails if I cannot distinguish between the semantic content of the kind and its practical application, resulting in the conclusion that "all social ontology is substantive" (which renders deflationism useless) or "all social ontology is verbal" (which is politically naive). Simply concluding "it depends" without a principled metric for *when* it depends will be considered a failure of scope.
  *   **Deliverable:** A 15-20 page paper suitable for submission to a graduate conference or journal, plus a brief policy-style memo summarizing the implications for social ontological analysis.

  **Feasibility and Scope**
  This project is narrowly scoped to two case studies to ensure depth within the summer timeframe. It does not attempt to solve the nature of institutional facts generally, but rather tests the limits of existing metaontological tools when applied to them. The required literature is contained within metaphysics and social ontology, both of which are familiar from recent seminar work. The risk of scope creep is managed by focusing strictly on the *status of the dispute* (verbal vs. substantive) rather than the moral or political merits of the cases themselves.
