answer: |-
  This is a precise and demanding question that cuts to the heart of Thomistic political theory. You have identified the exact tension that later scholastics (like Suarez and Bellarmine) and early modern thinkers (like Locke) would attempt to resolve. To answer you strictly within the resources of *Summa Theologiae* II-II, q. 42, a. 2, we must reconstruct the internal logic of the article and then test your scenario against its definitions.

  Here is the step-by-step reconstruction of the argument, followed by an application to your scenario and an identification of the textual gap.

  ### I. Logical Reconstruction of the Passage

  To understand how the argument hangs together, we must track how Aquinas redefines the terms "People," "Unity," and "Sedition."

  **1. Objection 3: The Equivocation on "Unity"**
  *   **Premise 1:** Delivering a multitude from tyranny is praiseworthy.
  *   **Premise 2:** Delivering a multitude from tyranny causes division (dissension) between those who support the tyrant and those who oppose him.
  *   **Premise 3:** Sedition is essentially division/dissension within a multitude.
  *   **Conclusion:** Therefore, some sedition (the division caused by removing a tyrant) is praiseworthy and not a mortal sin.
  *   **The Trap:** The Objection assumes that *any* political division constitutes "sedition" and that *any* established government represents the "unity of the multitude."

  **2. The *Respondeo*: Redefining the "People" and "Sedition"**
  Aquinas dissolves the objection by denying the definition of "people" and "unity" assumed in the Objection.
  *   **Step A (Definition of Sedition):** Sedition is not merely division; it is opposition to the *unity of the multitude*.
  *   **Step B (Definition of People):** Citing Augustine, Aquinas argues a "people" is not a mere crowd (*multitudo*). It is an assembly united by **fellowship recognized by law** and **for the common good**.
  *   **Step C (The Nature of True Unity):** Consequently, the "unity" that sedition attacks is not just physical peace or the absence of conflict. It is the *unity of justice and the common good*.
  *   **Step D (Moral Classification):** Because sedition attacks justice and the common good, it is a mortal sin *by its genus* (by its very nature).
  *   **Step E (The Exception):** However, not everyone involved in a conflict is seditious.
      *   *The Aggressors:* Those who disturb the common good are seditious.
      *   *The Defenders:* Those who withstand the disturbers to defend the common good are **not** seditious. Aquinas analogizes this to self-defense: a man defending himself is not "quarrelsome" even if a fight ensues.

  **3. Reply to Objection 3: The Status of Tyranny**
  *   **The Claim:** A tyrannical government is "not just."
  *   **The Reason:** It is directed to the private good of the ruler, not the common good.
  *   **The Implication:** Since the "unity of the people" (per Augustine) requires direction toward the *common good*, a tyrannical regime has already fractured the true unity of the people. Therefore, resisting it is not an attack on the "people's unity," but a defense of it.

  ### II. Application to Your Scenario

  You propose a ruler with **lawful title** (constitutionally installed) who acts **tyrannically** (private enrichment, shielding loyalists, disabling opposition) but maintains **prosperity and efficiency**.

  **1. Does Prosperity Defeat the Claim of Tyranny?**
  On the terms of this passage, **no.**
  Aquinas's definition of the "common good" is not utilitarian. It is not merely material prosperity, administrative efficiency, or even popular support (since the "people" is not just a "crowd"). The common good is inherently teleological and moral; it involves the order of justice and the flourishing of virtue within the community.
  *   **The Textual Basis:** The *Respondeo* states the unity of the people is "recognized by law and for the common good." The Reply to Objection 3 clarifies that a regime directed to the "private good of the ruler" is not just.
  *   **Application:** If the ruler redirects the state toward "personal enrichment" and "protects loyalists from ordinary legal accountability," he has substituted the *private good* for the *common good*. Even if the economy booms, the *order of justice* is corrupted. For Aquinas, a prosperous injustice is still an injustice. The regime fails the Augustinian test of a "people" because the fellowship is no longer recognized by *just* law (law ordained to the common good), but by the will of the ruler.

  **2. Lawful Title vs. Tyrannical Exercise**
  This is the critical juncture. The text does not explicitly distinguish between a *usurper* (no title) and a *legitimate ruler turned tyrant* (title but corrupt exercise). However, the logic of the article prioritizes the **end** of rule over the **origin** of rule.
  *   **The Logic:** The moral definition of the "people" relies on the *common good*. The moral definition of "sedition" relies on attacking that *common good*.
  *   **Application:** If the ruler uses "emergency powers to disable opposition," he is using the formal legal apparatus to destroy the "fellowship recognized by law." Aquinas implies that "law" in the Augustinian sense is not merely positive statute (*lex humana*), but statute that participates in right reason and the common good.
  *   **Result:** The ruler's lawful title does not immunize him from the charge of destroying the "unity of the multitude." By acting for his private good, he severs the bond that makes the multitude a "people."

  **3. Who Counts as the Seditious Party?**
  This is where your second question is most acute. If the ruler controls the formal legal apparatus, are the resistors seditious?
  *   **Aquinas's Criterion:** Sedition is determined by *who attacks the common good*, not by who holds the seal of the state.
  *   **The Text:** "Those, however, who defend the common good, and withstand the seditious party, are not themselves seditious."
  *   **Application:** In your scenario, the ruler's faction is using the state to "disturb the common good" (by substituting private gain and impunity). Therefore, logically, the ruler's enforcers are the ones disturbing the "unity of law and common good." The resistors, appealing to the common good against the ruler, fit the description of those who "defend the common good."
  *   **Conclusion:** On the terms of this passage, the resistors are **not** seditious. The "seditious party" is the faction of the ruler, because they are the ones attacking the true unity (justice/common good) even if they claim to represent the state.

  ### III. The Internal Gap: The Problem of Authorization

  While the passage provides a moral framework for labeling the act (resistance to tyranny is not sedition), it underdetermines the **procedural authority** for making that judgment. This is the gap you sensed regarding the distinction between a ruler without title and a ruler with title.

  **1. The Gap Identified**
  Aquinas establishes that resisting a tyrant is not *sedition* (a sin against the people). He does *not* establish who has the authority to declare that the ruler has become a tyrant and to organize the resistance.
  *   **The Ambiguity:** The text says, "Those... who defend the common good... are not themselves seditious." But who decides what defends the common good?
  *   **The Risk:** If any private individual can decide the ruler is acting for "private good" and take up arms, the result is the very "dissension in the multitude" that Objection 3 worries about. Aquinas condemns sedition because it destroys unity; but if private citizens judge the ruler, they risk destroying unity even if the ruler is corrupt.

  **2. Why the Distinction Matters**
  *   **Usurper:** If a ruler lacks lawful title, he is an aggressor against the political order itself. Resistance is akin to self-defense against an invader.
  *   **Constitutional Tyrant:** If a ruler has lawful title, he *is* the public authority. To resist him is to set up a rival authority.
  *   **The Missing Piece:** In *De Regno* (On Kingship), Aquinas suggests that resistance to a tyrant should be conducted by **public authority** (e.g., a parliament, electors, or superior magistrate), not private presumption. However, *Summa* II-II, q. 42, a. 2 does not explicitly make this distinction. It relies entirely on the moral teleology (Common Good vs. Private Good).

  **3. How the Gap Affects Your Scenario**
  In your scenario, the ruler controls the "formal legal apparatus."
  *   **Aquinas's Logic:** Since he violates the common good, his laws lack the full nature of "law" (in the Augustinian sense cited). Therefore, resistors are not breaking the "unity of law."
  *   **The Underdetermination:** The text does not say whether private citizens can make this judgment, or if a specific body (e.g., the "part of the multitude [that] seeks to retain the tyrant" vs. the "rest") must reach a consensus.
  *   **The Consequence:** The passage justifies the *moral innocence* of the resistors (they are not sinning by sedition), but it does not provide a *juridical mechanism* for their action. It leaves open the possibility that two factions could both claim to defend the "common good," leading to the civil war Objection 3 fears.

  ### IV. Summary of the Resolution

  To answer your specific questions directly based *only* on this passage:

  1.  **Does prosperity defeat the claim of tyranny?** No. Aquinas defines the common good morally (justice/fellowship), not materially. A regime of efficient theft is still tyrannical.
  2.  **Who is the seditious party?** The ruler's faction. Sedition is defined by opposition to the *true* unity (common good/justice), not opposition to the *de facto* ruler. If the ruler attacks the common good, he fractures the unity first.
  3.  **Does lawful title matter?** The passage does not explicitly rely on the origin of title, but on the *direction* of the rule (private vs. common good). A constitutionally installed ruler who directs the state to private good falls under the definition of "not just."
  4.  **Where is the gap?** The passage justifies resistance morally but does not specify the *agent* of resistance. It does not distinguish between resistance by a public body (e.g., magistrates) and resistance by private individuals. This is the crucial distinction needed to close the gap between "defending the common good" and "inciting civil war."

  **Final Verdict on the Text:**
  Aquinas successfully argues that resisting a tyrant is not *sedition* because the tyrant has already broken the bond of the "people." However, he leaves it underdetermined *who* is authorized to act on that judgment. He solves the problem of *sin* (it is not a sin to resist), but he does not fully solve the problem of *order* (how to resist without creating the very dissension sedition forbids). To close that gap, one would need to import the distinction between private and public authority found in his other political works, which is not fully developed in *Summa* II-II, q. 42, a. 2.
