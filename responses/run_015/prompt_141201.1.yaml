answer: |-
  The workshop smelled of ozone and old dust. Elias stood before the bench, his hands resting on the edge of the wood, knuckles white. The apparatus sat before him: a brass housing, a glass bulb thick as a fist, and inside, a loop of carbon filament heavy as wire. It was not a modern thing. It was a replica of a thought made solid.

  Beside the lamp, a digital chronometer counted up from zero. Beside that, a camshaft driven by a servo motor waited for the command. Elias had spent three years grinding the cams. The profile was logarithmic, designed to close and open a relay at one minute, then at one and a half, then one and three-quarters. The intervals would halve endlessly, summing to exactly two minutes.

  His mentor, Vance, had died believing the infinite could not be traversed. "You cannot complete a task with no last step," Vance had written in his final journal. "The state at the limit is undefined." Elias had spent his inheritance proving Vance wrong. If the lamp survived the supertask, if it settled into a definite state, then the infinite had been traversed. The sum of the history would outweigh the indeterminacy of the end. If the lamp flickered into chaos or died, Vance was right. Some doors simply did not open.

  Elias pressed the start button.

  The motor hummed. The chronometer climbed. Nothing happened for the first minute. The filament remained cold, black, invisible against the glass. Elias watched the seconds tick by. Ten. Thirty. Fifty. The silence of the workshop was heavy, broken only by the whir of the cooling fan on the servo.

  At 1:00, the relay clicked.

  The filament flared orange. It did not snap to full brightness; the thick carbon resisted, heating slowly. The glow deepened to a warm yellow. Elias held his breath. The light filled the room, casting long, soft shadows from the tools on the wall.

  At 1:30, the relay clicked again. The circuit broke.

  The light did not vanish. It dimmed, fading through amber to a dull red as the heat lingered in the carbon. The thermal inertia smoothed the transition, turning the binary switch into a curve.

  At 1:45, the click. The light brightened.
  At 1:52.5, the click. The light dimmed.

  The intervals were collapsing. The clicks came faster, losing their individuality. The distinct *clack-clack* of the relay began to blur into a rattle. Elias leaned in. The light was no longer pulsing visibly. The filament was not given enough time to cool completely, nor to heat fully. It was being caught in the middle, forced to average the history of the current.

  The rattle became a hum. The chronometer read 1:55. The sound was high-pitched now, a vibration in the bones of the bench. The light was steady, but not constant. It shimmered, finding a level. Elias felt the heat on his face, a radiating pressure that matched the tension in his chest. He thought of Vance's cold hand, the unfinished sentence, the lack of a final period.

  1:58. The hum was a whine. The light was a stable, copper glow. It was neither the bright yellow of full current nor the dark red of cooling. It was something else entirely. A third state.

  1:59. The motor screamed. The camshaft was spinning so fast it was a blur of steel. The relay was no longer clicking; it was vibrating, a single sustained note of mechanical stress. The light did not flicker. It held. The physics of the carbon refused the logic of the switch. The history of the flow was integrating, summing up into a temperature that the filament simply maintained.

  2:00.

  The motor cut out. The whine died instantly. The relay fell silent.

  The chronometer stopped.

  Elias did not move. The workshop was quiet again, save for the ticking of the cooling metal. The filament glowed. It was a steady, definite luminescence, a warm half-light that cast no dancing shadows. It was not on. It was not off. It was simply *there*, fixed by the sum of the seconds that had passed.

  Elias exhaled, a long shuddering breath. He reached out but did not touch the glass. He watched the light hold its ground against the darkening room. He picked up Vance's journal from the bench behind him. He opened it to the last page, took a pen from his pocket, and drew a single line under the final sentence. He closed the book and left it in the light.

  ***

  You have not gone wrong in your worry; you have correctly identified that the physical model **evades** the logical puzzle rather than solving it. The original Thomson's Lamp paradox is not about physics, but about logical determinacy: given a definition of state dependent *only* on the switch position, the state at the limit is undefined because the switch function has no limit. By adding thermal inertia, you have changed the ontology from a discrete logical state (On/Off) to a continuous physical state (Temperature). The differential equations governing heat ensure convergence, masking the logical discontinuity of the switch. The story's ending implies this evasion: the lamp glows steadily, proving physical continuity can override logical indeterminacy, but it does not—and cannot—tell us whether the switch itself is open or closed at $t=2$. The puzzle remains intact; you have merely built a machine that refuses to answer it.
