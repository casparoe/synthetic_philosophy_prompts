answer: |-
  You and Priya have stumbled onto the central methodological crisis in analytic philosophy. You are right to worry that your verdicts track your pre-existing conclusions; Priya is right that your criteria (specifically the "substitution" clause) are doing too much work to save the cases you like.

  However, your instinct about "sticky details" and "flat language" is stronger than you're giving it credit for. The inconsistency isn't in your verdicts; it's in how you're defining the *function* of the fantasy. In the Teletransporter, the fantasy isolates a variable (physical continuity). In the Experience Machine, the fantasy *evaluates* the variable (it frames the experience as "mere" or "fake" via the tank imagery).

  Here is a principle that captures your pattern, resolves the Teletransporter/Experience Machine tension, and gives you a syllabus rule.

  ### The Principle of Non-Begging Isolation

  > **A thought experiment is probative only if its fantastical elements isolate a specific variable without semantically loading the description with the conclusion, and if the intuitive verdict remains stable when emotionally charged imagery is replaced with neutral functional descriptions.**

  This principle has two clauses. Clause 1 handles the "rigged setup" cases (Chinese Room, Experience Machine). Clause 2 handles the "sticky detail" cases (Utility Monster, Trolley with the named child).

  Here is how it applies to your existing verdicts, including where you need to concede to Priya:

  1.  **Gettier (Keep):** Passes both clauses. The setup is functionally neutral (coins, pockets, jobs). No emotional loading.
  2.  **Violinist (Keep):** Passes. The fantasy (waking up attached) isolates bodily autonomy from general beneficence. Stripping the "violinist" to "person needing use of your kidneys" doesn't change the intuition.
  3.  **Teletransporter (Keep):** Passes Clause 1. The scanner is a functional mechanism to break physical continuity. It does not *describe* the outcome as "death" or "survival"; it asks you to judge. (Priya is wrong here: the machine is not a picture of survival, it is a *test* of what constitutes survival).
  4.  **Experience Machine (Drop):** Fails Clause 1. The description "floating in a tank" semantically loads the scenario with passivity and falsity. If you restate it functionally ("You live a life causally disconnected from external reality but phenomenologically identical"), the anti-hedonist intuition weakens significantly. You were right to distrust it.
  5.  **Utility Monster (Drop):** Fails Clause 2. "Monster" is emotionally charged imagery. If you describe it as "an agent with extremely high marginal utility for resources," the utilitarian obligation feels less grotesque.
  6.  **Repugnant Conclusion (Keep):** Passes Clause 2. Even in flat language ("Maximize total welfare across a massive population vs. high welfare for a small population"), the tension remains. The "grossness" is in the math, not the imagery.
  7.  **Chinese Room (Drop):** Fails Clause 1. The setup *stipulates* the conclusion. By defining the man as "manipulating symbols without understanding," Searle has built the lack of understanding into the premises. It isolates nothing; it asserts.
  8.  **Mary's Room (Drop):** Fails a corollary of Clause 1: **Predicate Clarity.** The setup turns on the word "know." As you noted, it slides between propositional knowledge and ability. A thought experiment cannot be probative if the central predicate is ambiguous in the setup. You are right to drop it, but not because it's rigged—because it's linguistically unstable.

  ### The Three Unsettled Cases

  Here is what the principle dictates for your syllabus:

  **1. Chalmers's Zombies**
  *   **Verdict:** **Drop.**
  *   **Reasoning:** Fails Clause 1 (Semantic Loading). Like the Chinese Room, the zombie case stipulates the conclusion in the definition. To conceive of a "philosophical zombie" is *defined* as conceiving of physical duplication without consciousness. If a student says, "I can't conceive that, because consciousness is a physical function," they are told they aren't imagining it right. It is a circular intuition pump for dualism. It works only if you already accept the premise that consciousness is distinct from function.
  *   **Syllabus:** Too advanced/fragile for undergrads. It generates heat, not light, unless students already grasp modal logic.

  **2. The Imperfect Teleporter (Sorites Commute)**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** Passes Clause 1. This is not a picture of survival; it is a stress test of *vagueness*. By making the scan imperfect (say, 10% replacement per commute), it isolates the threshold problem. It doesn't tell you whether you survive; it forces you to admit there is no fact of the matter.
  *   **Syllabus:** Excellent. It pairs with the standard Teletransporter to show that identity might be a matter of degree, which is a constructive philosophical result.

  **3. Trolley vs. Product Safety (with the named six-year-old)**
  *   **Verdict:** **Drop the version with the child; Keep the flat version.**
  *   **Reasoning:** Fails Clause 2 (Imagery Independence). The "named six-year-old" is a classic sticky detail designed to trigger protective instincts that bypass the utilitarian calculus. If you rewrite it as "Unit 404 vs. Batch 12," and the intuition flips, the original case was rhetorical, not philosophical.
  *   **Syllabus:** Use the flat version to teach the conflict between deontology and utilitarianism. Use the "named child" version *only* if you are teaching a module on cognitive bias and rhetorical manipulation, explicitly flagging it as a violation of the principle.

  ### Where You Have to Concede

  You need to adjust your view on **Mary**. You wanted to drop Mary because you thought the setup was ambiguous. The Principle suggests the setup is actually robust (it survives flat language), but the *inference* is what fails.
  *   **Correction:** If you keep Mary on the syllabus, you must frame it not as "Proof of Qualia," but as "The Ambiguity of Knowledge." If you aren't prepared to teach that distinction, drop it. But don't tell yourself the *case* is rigged; tell yourself the *concept* is muddy.

  ### Summary for your Syllabus Policy

  If a student asks why you chose these cases, here is your statement:

  > "We use thought experiments to isolate variables, not to win arguments. A case stays on the syllabus only if the scenario describes the *conditions* of the problem without embedding the *answer* in the imagery, and if the intuition holds up when we remove the emotional loading."

  This allows you to keep Parfit and Thomson (isolation of variables) while cutting Nozick and Searle (embedding the answer), and it gives you a principled reason to reject the "named child" Trolley case without rejecting Trolley problems entirely. It admits that philosophy is not data, but it insists that it shouldn't be propaganda either.
