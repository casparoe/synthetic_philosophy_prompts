answer: |-
  **Part (a)**
  > "Start with the common prior assumption (CPA). It says that at the ex ante stage — before anyone gets their private signal — all traders assign the same probability distribution over states of the world."
  **Correct.** Precise definition of the ex-ante condition. (1 mark)

  > "It does not say traders have the same beliefs when they actually trade: once private information arrives their posteriors generally differ, and they can have different utility functions and different endowments as well."
  **Correct.** Excellent distinction between priors, posteriors, and preferences/endowments. (1 mark)

  > "Milgrom and Stokey (1982) combine CPA with common knowledge of rationality, common knowledge that the trade is voluntary and mutually accepted, and the requirement that the pre-trade allocation be Pareto optimal relative to the prior."
  **Mostly correct.** You list the key assumptions accurately. "Pareto optimal relative to the prior" is slightly non-standard phrasing (usually "ex-ante Pareto efficient"), but the substance is right. (1 mark)

  > "The mechanism is basically Aumann's (1976) agreement theorem."
  **Slightly imprecise.** While conceptually linked, MS relies on the zero-sum nature of bets under a common prior, not strictly Aumann's theorem on agreeing to disagree. Conflating the two loses a bit of technical precision. (-0.5 marks)

  > "With a common prior, agents cannot end up disagreeing — as soon as they communicate their posteriors have to coincide — and trade is a form of communication."
  **Acceptable intuition.** For the purposes of this course, treating trade as communication that reveals posteriors is a standard heuristic, though MS applies even without full posterior revelation. (0.5 marks)

  > "If I learn that you are willing to buy from me at price p, that is evidence you have seen good news, and once I condition on it I no longer want to sell."
  **Correct.** This captures the "no-speculative-trade" intuition well. (1 mark)

  > "By Aumann, the two sides' posteriors must be identical at the moment of trade, so neither can expect to gain."
  **Technically incorrect.** MS does not require posteriors to be *identical*, only that agents cannot *commonly know* they disagree on the expected value of the trade. However, the conclusion (neither can expect to gain) is correct. (0.5 marks)

  > "Note what this does not say. It rules out speculative trade driven purely by differences in information. It does not rule out trade for insurance or liquidity reasons..."
  **Correct.** Crucial distinction. You correctly identify the scope of the theorem. (1 mark)

  > "...and it does not rule out trades that are not common knowledge to the parties, e.g. trades against noise traders or through an anonymous limit order book where I don't know who I'm dealing with or why."
  **Correct.** Good identification of the "noise trader" loophole. (1 mark)

  **Part (a) Total: 5.5 / 6**

  ***

  **Part (b)**
  > "Grossman and Stiglitz (1980) is the natural sequel. If prices fully aggregated everyone's private information they would be fully revealing, and then there would be no return to paying for information; but if nobody gathers information there is nothing for prices to aggregate, and the market collapses."
  **Correct.** Perfect summary of the GS paradox. (2 marks)

  > "Their resolution is the noisy rational expectations equilibrium: price is only partially revealing, informed traders earn back the cost of their information, and uninformed traders effectively free-ride on the price."
  **Correct.** Accurate description of the noisy REE solution. (2 marks)

  > "So the Hayekian dispersed-knowledge story survives, but in a weaker form than it is usually stated: aggregation is real but necessarily incomplete, and the incompleteness is exactly what pays for the information in the first place."
  **Excellent synthesis.** You directly answer the "support or undermine" prompt by nuancing the Hayekian claim. This integrates MS (friction) and GS (solution) well. (3 marks)

  **Part (b) Total: 7 / 7**

  ***

  **Part (c)**
  > "Since MS shows that information-based speculation is impossible under CPA, and since real markets trade enormous volume every day, real traders cannot be sharing a prior — the volume has to come from heterogeneous priors."
  **Problematic inference.** You correctly state what MS rules out (info-based speculation under CPA), but you incorrectly assume *all* real-world volume is info-based speculation. This ignores the liquidity/insurance loophole you correctly identified in part (a). (1 mark)

  > "We could also appeal to irrationality, but we don't need that hypothesis."
  **Correct.** Heterogeneous priors are indeed a sufficient alternative to irrationality. (1 mark)

  > "And this refutes the Hayekian picture rather than weakening it: the point of markets is not that they aggregate knowledge, it's that they let people with incompatible worldviews bet against each other."
  **Weak assessment.** You are asked to *assess* the reading, but you largely endorse it without critiquing the false dichotomy (Irrationality vs. Priors). You fail to consider that much volume is risk-sharing (compatible with CPA), not betting. This contradicts your own answer in (a). (1 mark)

  > "Be careful throughout to distinguish priors from posteriors from information, and to say exactly which trades the theorems rule out."
  **Partial credit.** You distinguished priors/posteriors well, but you failed to specify that the theorems only rule out *speculative* trades, not *risk-sharing* trades, when applying the logic to real-world volume. (1.5 marks)

  **Part (c) Total: 4.5 / 7**

  ***

  **Total Mark: 17 / 20**

  ***

  **Note on Question Ambiguity**
  I do not recommend scaling based on ambiguity. The question is clear, particularly the instruction in (c) to "say exactly which trades the theorems rule out." The student's error in (c) is an internal consistency issue (contradicting their own correct answer in (a) regarding liquidity/insurance trades) rather than a misunderstanding of the prompt. However, you might want to check if other students also missed the risk-sharing loophole in (c); if the class overwhelmingly treated volume as purely speculative, the lecture emphasis on liquidity trading might need reinforcing rather than the marks scaled.
