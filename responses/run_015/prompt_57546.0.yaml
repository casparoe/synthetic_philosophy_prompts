      *   **Case:** Hospital triage system. Validated at launch. Rolling retraining. Exemplary governance (monthly reviews, competent reviewers, no metric failures). Emergent harm to a rare comorbidity profile (0.4% of arrivals, not tracked). 100 harmed, some die. No concealment, no corner-cutting. Composite property not in hypothesis space.
