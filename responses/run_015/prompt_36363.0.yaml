answer: |-
  This is one of the classic problems in social ontology (the study of social reality). You have stumbled onto the exact debate that occupies philosophers like Michael Bratman, Margaret Gilbert, and John Searle.

  Your intuitions are actually quite sophisticated. You have correctly identified that **agreement** is not the magic ingredient (the mob/ovation have none; the secret roommates have matching plans but no jointness), and **shared goals** are not the magic ingredient (chess players have opposed goals).

  There is a principle that can account for almost all your verdicts without forcing you to throw them out. It is often called the **Shared Intention Account** (specifically a Bratmanian framework, tweaked for spontaneous cases).

  ### The Principle: Interlocking Intentions + Common Knowledge + The "We-Frame"

  For an action to count as "doing something together," three conditions usually need to be met:

  1.  **Interlocking Intentions (Mutual Responsiveness):** I intend to do my part *because* you are doing yours, and you intend to do yours *because* I am doing mine. We are adjusting to each other in real-time.
  2.  **Common Knowledge (Mutual Belief):** I know that you are doing this, you know that I am doing this, and I know that you know that I know. It is out in the open between us.
  3.  **The "We-Frame":** We conceptualize the action not just as "I am X-ing" and "You are X-ing," but as "**We** are X-ing."

  Let's run your cases through this filter to see why your gut feels the way it does.

  #### 1. The Fence (Agreed)
  *   **Verdict:** Joint.
  *   **Why:** You have explicit interlocking intentions ("I paint left, you paint right"), common knowledge (we talked about it), and a clear We-Frame ("We are repainting the fence").

  #### 2. The Suitcase (Strangers)
  *   **Verdict:** Not Joint (on your view).
  *   **Why:** This fails the **We-Frame**. You are both reacting to the *physics of the suitcase*, not to each other as agents. You lunge because the bag is falling; you don't lunge because *I* am lunging. There is mutual responsiveness physically, but not intentionally. You aren't thinking "We are saving this bag"; you are thinking "I must grab this." It is coordinated parallel action, not joint action.

  #### 3. The Ovation (Spontaneous)
  *   **Verdict:** Joint.
  *   **Why:** This passes the **Common Knowledge** and **We-Frame** test. I start clapping, I see you clapping, I know you see me clapping. Crucially, I clap *to contribute to the applause*. If everyone stopped but me, I would feel the "applause" had failed. My action is conditioned on yours sustaining the collective sound.

  #### 4. The Flash Mob
  *   **Verdict:** Joint.
  *   **Why:** Even without meeting, the video instructions create a **Common Knowledge** baseline. We all know that we all know the routine. We are all acting to instantiate the "We" of the performance.

  #### 5. Chess Players
  *   **Verdict:** Joint.
  *   **Why:** This solves your "shared goal" worry. They do not share the goal of *winning*. They share the **constitutive goal** of *playing the game*. I cannot play chess alone. My intention is "We are playing chess," even if my sub-intention is "I will win." The "We-Frame" applies to the activity, not the outcome.

  #### 6. Panic Selling / Two Labs
  *   **Verdict:** Not Joint.
  *   **Why:** Fails **Common Knowledge** and **Interlocking Intentions**. In panic selling, I sell because I am scared, not because I want to help the market crash *with you*. I don't care if you sell; I just want out. In the labs, I run the experiment to test the theory, not to "run an experiment with you."

  #### 7. The Mob (Riot)
  *   **Verdict:** Joint (on your view).
  *   **Why:** This is the edge case. Strictly speaking, some philosophers say this is just "aggregate behavior." But your intuition that "the mob did it" comes from the emergence of a **We-Frame**. In the heat of the moment, individual identity dissolves into the group. "We are smashing." There is mutual cueing (I smash because you smash) and mutual recognition (I see you seeing me smash). It creates a temporary plural subject.

  #### 8. Secret Roommates (Initial Snub)
  *   **Verdict:** Not Joint.
  *   **Why:** Fails **Common Knowledge**. I intend "I will snub him." You intend "I will snub him." We are not acting *together*; we are acting in parallel. If I stopped, you wouldn't feel our *joint* plan failed; you'd just think I gave up on *my* plan.

  ---

  ### The Test Case: The Roommates Discover Each Other

  Here is the scenario: The two roommates are snubbing the third. Halfway through, they catch each other's eye. They realize what the other is doing. Neither speaks. They both continue snubbing.

  **Does it become joint action?**

  **The Verdict:** It *can*, but it is not automatic. It depends entirely on what happens in their heads at the moment of eye contact.

  **What exactly gets added?**
  The missing ingredient is the shift from **Parallel Intention** to **Interlocking Commitment.**

  *   **Scenario A (Still Parallel):** Roommate 1 sees Roommate 2 snubbing and thinks: *"Oh, good, he's doing it too. That makes it easier for me to keep doing it without feeling like the bad guy."*
      *   Here, the other person is just part of the *environment* (like the suitcase). My reason for acting is still purely individual ("I want to snub him").
      *   **Result:** Not Joint.

  *   **Scenario B (Becomes Joint):** Roommate 1 sees Roommate 2 snubbing and thinks: *"Ah, **we** are freezing him out."*
      *   Here, the intention shifts. I am no longer just snubbing; I am *supporting our snub*. If Roommate 2 suddenly stopped and started chatting with the third roommate, Roommate 1 would feel a sense of betrayal or that the *joint effort* had collapsed.
      *   **Result:** Joint.

  **The Principle at Work:**
  Mere awareness (Common Knowledge) is not enough. You can know we are both doing the same thing and still be acting in parallel (e.g., two people reading the same book on a train).

  To cross the threshold into "Together," there must be **Mutual Obligation** (even if unspoken). In Scenario B, by locking eyes and continuing, they have silently ratified a **Joint Commitment**. They have signaled: "I am doing this *as part of us*."

  ### Summary of the Principle

  You don't need to throw out any of your verdicts. The principle that unifies them is:

  **Joint Action = Interlocking Intentions + Common Knowledge + The "We-Frame"**

  *   **Agreement** is just one way to get there (the Fence), but you can get there spontaneously (Ovation, Mob) if the "We-Frame" emerges in the moment.
  *   **Shared Goals** are not required; a **Shared Activity** is (Chess).
  *   **Coordination** is not enough; you need the **Normative Layer** (The Suitcase is physical coordination; the Ovation is social coordination).

  **On the Roommates:**
  The moment they lock eyes, the *potential* for joint action is created. It becomes actual joint action only if they adopt the "We-Frame." If they continue silently, the default assumption in social psychology is that they **do** slip into the "We-Frame." The silence acts as a tacit agreement. By not stopping, they signal, "I accept our partnership in this snub."

  So, in your flip-flopping case: **Yes, it likely becomes joint.** What got added was the **mutual recognition of the partnership**, which transforms two individual acts of hostility into a single collective act of exclusion.
