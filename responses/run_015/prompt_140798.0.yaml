answer: |-
  Good evening. My name is [Name], I'm a junior here, and I'm here to ask why the solar installation plan for the three high schools has been delayed for the third consecutive budget cycle.

  Two years ago, this district had a viable plan to put panels on our roofs. Every year since, you've pushed it to the next cycle. We're told it's about bond sequencing and construction timelines. But when those delays line up perfectly with campaign donations from the paving contractors who handle our parking lots, it stops looking like planning and starts looking like choosing. You are choosing donors over students. You are choosing the status quo over the future you claim to want.

  Now, I know what some of you are thinking. You know I fly to Singapore every other summer. You know I drive a 2004 truck that gets fourteen miles to the gallon. The next speaker might even stand up and list my carbon footprint to prove I don't have the right to stand here.

  He's not wrong about the footprint. I'm not clean. But I've been thinking about what that actually means. There's an idea that you need perfect hands to ask for better policy. If that were true, nothing would ever change. If only the people who benefit least from this system could speak about it, this room would be empty.

  I'm not standing here to judge your souls. I don't have the standing to tell you who you are as people. But I am a student in this district, and that gives me the standing to check your work. My personal imperfections don't fix your professional failures. Waiting for a perfect messenger is just another way to stall the message.

  We don't need you to be saints. We need you to be officials. We need you to stop hiding behind sequencing excuses when everyone knows the real reason is political convenience. The decision to delay this is blameworthy, regardless of who is pointing it out.

  So here's the demand: Stop stalling. Put the solar plan back into the current budget. Commit to a timeline that doesn't depend on another election cycle. I'm implicated in this system, yes. But you're the ones running it.

  Thank you.
