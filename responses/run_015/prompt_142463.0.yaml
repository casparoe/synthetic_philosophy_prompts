answer: |-
  Here is a decision tree designed for your handout. It avoids the "Good vs. Bad" trap at the top and forces students to identify *what kind of claim* they are making before they decide *what the claim is*.

  I have structured this as a binary tree for ease of printing, with 10 terminal leaves. I have included the specific "Upkeep" node you requested, and I have flagged the leaves that are historically unoccupied or debated.

  ***

  # The "Human Nature" Sorter
  **Instructions:** Don't ask yourself "Is human nature good?" Ask yourself the questions below. Follow the path that matches your intuition about how people actually work. Use the concrete cases provided to test your answer.

  ### **NODE 1: THE TARGET**
  **When you argue about "Human Nature," what are you actually trying to measure?**
  *   **A. The Equipment:** I am making a claim about what motives/feelings are inside a newborn (e.g., *The Child at the Well*). **[Go to Node 2]**
  *   **B. The Fit:** I am making a claim about how human desires match the world we live in (e.g., *Scarcity vs. Abundance*). **[Go to Node 8]**

  ---

  ### **NODE 2: THE DIRECTION (The Equipment)**
  **Think of a toddler before they are taught rules. Do they have moral feelings?**
  *   **A. Yes:** They have "sprouts" (pity, shame, deference) that point toward goodness. **[Go to Node 3]**
  *   **B. No:** They only have biological drives (hunger, noise, comfort). **[Go to Node 5]**
  *   **C. Sort of:** They have a mix of both, or neutral energy that can go either way. **[Go to Node 6]**

  ---

  ### **NODE 3: THE UPKEEP (The Mencius Branch)**
  **You've grown up to be a good person. Does that state hold on its own?**
  *(Case: The Sage on the Mountain. If you remove all teachers and laws, does their goodness survive?)*
  *   **A. Yes:** Goodness is like a tree; once grown, it sustains itself. You don't need rules to *stay* good, only to *get* good. **[LEAF 1]**
  *   **B. No:** Goodness is like a muscle or a garden; without constant exercise/weeding, it degrades. You need permanent scaffolding. **[LEAF 2]**

  ---

  ### **NODE 5: THE RESISTANCE (The Xunzi Branch)**
  **Those biological drives—are they neutral or dangerous?**
  *(Case: The Toddler Who Shares Only When Watched. Do they want to share, or do they want the cookie?)*
  *   **A. Dangerous:** Left alone, desires lead to conflict and theft. We need rules to *restrain* us. **[LEAF 3]**
  *   **B. Transformable:** Desires aren't evil, but they are messy. We can reshape them into something good through training. **[LEAF 4]**

  ---

  ### **NODE 6: THE NEUTRALITY (The Gaozi/Han Branch)**
  **Is the "neutral" material easy to shape, or does it fight back?**
  *(Case: The Willow vs. The Water. Can you make a human anything, or do they have a grain?)*
  *   **A. Anything:** Nature is totally malleable. Good/Bad is 100% external shaping. **[LEAF 5]**
  *   **B. Mixed Grain:** Nature has fixed bits of good and bad. Cultivation means growing the good bits and pruning the bad. **[LEAF 6]**

  ---

  ### **NODE 8: THE MISMATCH (The Fit Branch)**
  **If we had infinite resources and space, would people still fight?**
  *(Case: The Lifeboat. Do we fight because we are selfish, or because there isn't enough food?)*
  *   **A. Yes:** Even with enough food, we would find reasons to conflict. The problem is internal. **[Return to Node 2]**
  *   **B. No:** Conflict is a result of scarcity. If the world fit our desires, we wouldn't need "morality." **[Go to Node 9]**

  ---

  ### **NODE 9: THE DISTINCTION**
  **Does it make sense to separate "Nature" from "Culture"?**
  *(Case: The Feral Child. Is a child raised by wolves "uncultured" or just "different"?)*
  *   **A. Yes:** There is a core "human" underneath the social layer. **[LEAF 7]**
  *   **B. No:** Humans are built *by* their environment. "Nature" is just a name for how we develop. **[LEAF 8]**

  ---

  ### **THE LEAVES (Your Position)**

  **LEAF 1: Textbook Mencius**
  *   **View:** Nature is Good (Sprouts). Upkeep is low (Self-sustaining).
  *   **The Picture:** A seed that naturally becomes a tree. You need protection early on, but a mature Sage is autonomous.
  *   **Status:** **Occupied.** (Classic Mencius reading).

  **LEAF 2: Neo-Confucian / "Garden" Mencius**
  *   **View:** Nature is Good (Original), but Material is Cloudy. Upkeep is high (Constant polishing).
  *   **The Picture:** A clear mirror that keeps getting dusty. You need ritual/practice forever to keep the "Original Nature" visible.
  *   **Status:** **Occupied.** (Song-Ming Neo-Confucians, e.g., Zhu Xi).
  *   **Note:** This splits students who agree with Mencius on *sprouts* but agree with Xunzi on *upkeep*.

  **LEAF 3: Textbook Xunzi**
  *   **View:** Nature is Bad (Desires). Upkeep is permanent (Scaffolding).
  *   **The Picture:** Crooked wood that must be steamed straight. Even a Sage needs Ritual to hold the shape; without it, they warp back.
  *   **Status:** **Occupied.** (Classic Xunzi reading).

  **LEAF 4: The Institutional Person (Han-Style)**
  *   **View:** Nature is Raw. Upkeep is Transformative.
  *   **The Picture:** A person who is only decent inside well-designed institutions. Unlike Leaf 3, they don't feel restrained; the rules have successfully re-tuned their desires.
  *   **Status:** **?** (Unsure if occupied). Xunzi implies this is possible, but often emphasizes the *struggle*. Han thinkers (like Dong Zhongshu) lean closer to Leaf 6.
  *   **Flag:** This leaf might be empty because classical authors generally think if you need the institution to *be* good, you aren't truly good yet.

  **LEAF 5: Gaozi (The Willow)**
  *   **View:** Nature is Neutral. Resistance is Low.
  *   **The Picture:** Raw wood. You can make a cup or a beam. Morality is entirely external imposition.
  *   **Status:** **Occupied.** (Gaozi's "Willow" analogy).

  **LEAF 6: Han Mixture View**
  *   **View:** Nature is Mixed. Resistance is Variable.
  *   **The Picture:** A field with both wheat and weeds. Cultivation isn't creating goodness from scratch, but nurturing the good bits you were born with and suppressing the bad.
  *   **Status:** **Occupied.** (Han Dynasty texts, e.g., *Balanced Inquiries*).

  **LEAF 7: Calibration Mismatch**
  *   **View:** Nature is Fine. The World is Wrong.
  *   **The Picture:** Nothing in nature is "bad," but our desires are tuned for scarcity. When conditions change (e.g., modern abundance), our old instincts generate conflict. The remedy is material/institutional, not moral.
  *   **Status:** **Untried.** (Modern evolutionary psychology view).
  *   **Flag:** Empty in classical texts because they assume scarcity is permanent.

  **LEAF 8: Niche Construction / Developmental Systems**
  *   **View:** The Distinction Breaks Down.
  *   **The Picture:** You can't separate the "seed" from the "soil." Humans build the environment that builds them. Asking if nature is good is like asking if "swimming" is wet.
  *   **Status:** **Untried.** (Modern systems biology/philosophy).
  *   **Flag:** Incoherent to classical authors who require a stable *xing* to argue about.

  **LEAF 9: The Feral Child (Empiricist Null)**
  *   **View:** Nature is Unknown.
  *   **The Picture:** Without social input, we are not "good" or "bad," we are just non-human. We cannot know nature without cultivation.
  *   **Status:** **Unattractive.** (Classical authors reject this; they assume a stable core exists even in isolation).

  **LEAF 10: The Tragic Sage**
  *   **View:** Nature is Good. Upkeep Fails.
  *   **The Picture:** You have the sprouts, and you try to maintain them, but the world is too corrupt. You remain good internally, but cannot sustain it externally.
  *   **Status:** **Unoccupied.** (Mencius acknowledges this risk—*Ox Mountain*—but insists the Sage succeeds. This is the pessimistic Mencian).

  ***

  ### **Instructor Notes & Confidence Check**

  **Overall Confidence:** High on the structure's pedagogical utility; Medium-High on historical precision.
  This tree successfully forces students off the "Good/Bad" binary and exposes the **Upkeep** distinction, which is usually the hardest nuance for first-years to grasp. It clarifies why someone can agree with Mencius on *motivation* but Xunzi on *maintenance* (Leaf 2).

  **The Specialist Objection:**
  I expect a specialist to object most strongly to **Node 3 (The Upkeep on Mencius)**.
  *   **The Objection:** Many scholars argue that Mencius *does* believe in permanent upkeep (the "Ox Mountain" analogy suggests goodness can be lost if not tended). Distinguishing Leaf 1 (Textbook Mencius) from Leaf 2 (Neo-Confucian) might be anachronistic, as the "constant cultivation" reading is defensible in the *Mencius* text itself.
  *   **My Defense for Class:** I am splitting them to highlight the *Neo-Confucian* innovation of "Original vs. Psychophysical" nature. Even if Mencius implies upkeep, the Neo-Confucians make it a metaphysical requirement due to *qi* obstruction. For a first-year course, this distinction is vital to explain why later Confucians meditated so much.

  **Uncertain Leaves:**
  *   **Leaf 4 (Institutional Person):** I am unsure if any classical author explicitly occupies this. Xunzi comes close, but he usually insists the goal is to *internalize* ritual so it no longer feels external. If the scaffolding is still needed, Xunzi might call you a "petty person" rather than a "good person."
  *   **Leaf 7 & 8:** These are explicitly modern. I have flagged them as "Untried" in the classical canon. This is a feature, not a bug—it shows students where the ancient debate ends and the modern one begins.

  **Pedagogical Flag:**
  At **Node 1**, students may try to answer "All of the above." Encourage them to pick the *primary* driver. If they say "It's about the motives," they go Left. If they say "It's about the world," they go Right. This sorts the *focus* of their argument, which is often where the real disagreement lies.
