answer: |-
  This is a classic game theory trap known as a **"Dollar Auction"** (or a variation of an all-pay auction), and your friend is falling victim to the **Sunk Cost Fallacy**.

  Here is the breakdown of why his logic is dangerous, where the rational stopping point is, and what you should do.

  ### 1. The Trap: Why Your Friend is Wrong
  Your friend says he has "$\$112,000$ on the line" and doesn't want to "throw that away." This is irrational reasoning for two reasons:

  *   **The Money Isn't Gone Yet:** Unless you have already signed a non-refundable contract, the money is not "on the line" until the auction closes. A bid is usually an *offer*, not a payment. If he withdraws, he pays $\$0$. If he believes he is legally forced to pay his bid even if he loses, he is likely mistaken about the rules, or the rules are predatory.
  *   **Escalation of Commitment:** He is trying to spend *more* money to justify the risk of the money he's already pledged. This is like throwing good money after bad. If he bids $\$115,000$ and you outbid him at $\$116,000$, he doesn't "save" his $\$112,000$ commitment; he has now increased his loss to $\$115,000$.

  ### 2. The Math: You Are Already Losing
  In a normal auction, only the winner pays. In this specific game, **the top two bidders pay.** This changes the math entirely.

  *   **Property Value:** $\$120,000$
  *   **Current Combined Bids:** $\$112,000$ (Friend) + $\$110,000$ (You) = **$\$222,000$**

  You and your friend have already collectively bid **$\$102,000$ more than the property is worth.**
  *   **If the auction ends now:** The seller gets $\$222,000$. You and your friend split one $\$120,000$ asset. Between the two of you, you have instantly destroyed $\$102,000$ of wealth.
  *   **If you keep bidding:** Every dollar you raise is a dollar burned. If you bid $\$113,000$ and he bids $\$114,000$, the combined cost is $\$227,000$ for a $\$120,000$ asset.

  ### 3. Your Rational Stopping Point
  **Your rational stopping point was $\$0$.** Your secondary rational stopping point is **right now.**

  Here is the Expected Value (EV) calculation for your next move:
  *   **To Win:** You must bid at least $\$113,000$.
  *   **If You Win:** You pay $\$113,000$ for a $\$120,000$ property. **Profit: $\$7,000$.**
  *   **If You Lose:** You pay $\$113,000$ and get nothing. **Loss: $\$113,000$.**

  To justify making this bid, you would need to be almost certain (roughly 94% sure) that your friend will quit immediately. Given that he has explicitly told you he plans to keep raising, your probability of him quitting is near zero. Therefore, **raising your bid has a negative expected value.**

  ### 4. Strategic Advice

  **Option A: Withdraw Completely (Best Option)**
  Check the auction rules immediately. In most jurisdictions, a bid is an offer that can be retracted before the auction closes unless you have signed a specific binding agreement.
  *   **If you withdraw:** You are no longer a bidder. You are not in the "top two." **You pay $\$0$.**
  *   **The Result:** Your friend becomes the single highest bidder. Depending on the rules, he may only have to pay his bid (getting the property) or the auction might fail. Either way, you save your $\$110,000$.
  *   **Tell your friend:** "If we both keep bidding, we are just giving the seller free money. I am withdrawing to stop the bleeding. You should too."

  **Option B: Stop Bidding but Honor Current Bid (If Legally Binding)**
  If you are legally locked into your $\$110,000$ bid and cannot withdraw:
  *   **Do not raise.** Accept that you may lose the $\$110,000$ as a "tuition fee" for learning about this trap.
  *   Raising to $\$113,000$ risks turning a $\$110,000$ loss into a $\$113,000$ loss. Do not chase losses.

  **Option C: Collude (The "Smart" Move)**
  This auction rule is designed to pit bidders against each other to inflate the price. The rational move for you and your friend is to realize you are allies against the seller, not enemies.
  *   Agree that one of you will withdraw, and the other will bid a nominal amount (e.g., $\$10$).
  *   Split the profit later.
  *   *Warning:* Bid rigging is illegal in many places. However, simply discussing the absurdity of the rule and one party voluntarily withdrawing is usually legal.

  ### 5. A Warning on the Seller's Rule
  This "top two bidders pay" rule is highly unusual and potentially **unenforceable** depending on your local laws. In many jurisdictions, this could be considered:
  1.  **Gambling:** You are paying for a chance to win, which falls under gambling regulations.
  2.  **Unconscionable Contract:** A court may view a penalty where the loser pays the full bid without receiving goods as punitive and void.

  **Recommendation:**
  1.  **Do not bid another dollar.**
  2.  **Consult a real estate attorney** immediately to see if you can void your current $\$110,000$ bid.
  3.  **Tell your friend** he is walking into a financial trap. The $\$112,000$ is not "on the line" unless he lets it be.

  **Summary:** Your friend is irrational. The game is rigged. The rational move is to walk away immediately. If you can withdraw your bid, do it. If you can't, do not raise.
