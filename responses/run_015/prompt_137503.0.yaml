answer: |-
  Here are three distinct design concepts, followed by the one I recommend you run, complete with the run-sheet, debrief strategy, and failure analysis.

  ### Brainstorming Phase

  **Option 1: The "Commitment Contract" Lottery**
  *   **Concept:** Participants set a personal goal for the session (e.g., "I will speak up twice"). They choose a penalty for failure (e.g., "I have to stand up for the rest of the session").
  *   **Mechanism:** Half the room chooses their own penalty; half are assigned one by a "policy maker" (you).
  *   **Pros:** Directly tests autonomy vs. support.
  *   **Cons:** Feels like a HR training exercise. The stakes are personal, not systemic. It risks shaming individuals rather than illuminating policy structure. Hard to debrief without getting psychological.

  **Option 2: The "Friction Maze"**
  *   **Concept:** A task where they must retrieve information from different parts of the room.
  *   **Mechanism:** You secretly alter the environment mid-session (move chairs, lock a drawer, hide pens).
  *   **Pros:** Very physical, wakes them up post-lunch.
  *   **Cons:** Risks feeling like a prank ("Why did you hide the pens?"). The "policy" element is weak. It demonstrates friction, but not the *justification* for friction (Servant vs. Author).

  **Option 3: The "Policy Lock" (Selected)**
  *   **Concept:** A simulation where they vote on a procedural constraint *before* knowing their specific role in the simulation.
  *   **Mechanism:** Phase 1: Vote on a rule (e.g., "Auto-approve low-risk items"). Phase 2: Receive secret objectives (e.g., "Maximize Speed" vs. "Maximize Safety"). Phase 3: Execute task under the voted rule.
  *   **Pros:** Replicates the "Veil of Ignorance" in policy design. Directly creates the Endorsement Asymmetry (voted for it vs. suffering from it). Distinguishes Servant (rule helps objective) vs. Author (rule hinders objective).
  *   **Cons:** Requires tight facilitation to ensure the "vote" feels real.

  ---

  ### The Selected Design: "The Policy Lock"

  **Why this one:** It forces them to be the *designer* first and the *citizen* second. The tension between the vote (Time 1) and the experience (Time 2) generates the "Endorsement Asymmetry" organically. The conflict between objectives generates the "Servant/Author" distinction without you defining it.

  **Materials Needed:**
  *   Projector (for timer and instructions).
  *   Whiteboard & markers.
  *   Index cards (2 colours: Blue and Yellow).
  *   Pens.
  *   **The Hidden Architecture:** The attendance sheet you circulate in the first 2 minutes.

  #### The Hidden Architecture (Exhibit A)
  On the attendance sheet, include a checkbox near the signature line:
  *[x] I agree to stay 5 minutes past the scheduled end time if the facilitator requires it for debrief.*
  **Pre-tick this box.** Do not draw attention to it. Just circulate it for "health and safety / admin."
  *Why:* It is a classic default nudge. It is bureaucratic. It is something they would design themselves. It is the perfect hook for the final discussion.

  #### Run Sheet (90 Minutes)

  **0:00 – 0:10 | Arrival & Admin**
  *   Circulate the attendance sheet.
  *   Projector shows a neutral slide: "Policy Induction: Behavioural Insights."
  *   **Facilitator Note:** Act bored/bureaucratic. Do not highlight the checkbox.

  **0:10 – 0:20 | The Reveal (Exhibit A)**
  *   Ask them to stop. Ask: "Who noticed the checkbox on the sign-in sheet?"
  *   Reveal you pre-ticked it.
  *   Ask: "Is anyone actually staying 5 minutes late?" (Most will say yes, it's fine).
  *   Ask: "If I hadn't ticked it, would you have ticked it?" (Hands will vary).
  *   **Crucial Move:** Do not analyse this yet. Say: "Keep that feeling in mind. We're coming back to this. For now, put it out of your minds."
  *   *Philosophy Note:* You have just instantiated a Default Nudge. You have created a mild Endorsement Asymmetry (they signed it, but didn't actively choose it).

  **0:20 – 0:35 | Phase 1: The Vote (Behind the Veil)**
  *   Divide the room into small tables (4-5 people).
  *   **The Task:** Tell them: "In 15 minutes, you will process 20 'Grant Applications' (sheets of paper with simple data). Your goal is to process them."
  *   **The Vote:** "Before you see the applications, you must set the **Process Rule** for the whole room. You don't know yet what your specific target is."
  *   **Option A (The Fast Track):** "Applications under $5k are auto-approved. You only review the rest." (Saves time, risks errors).
  *   **Option B (The Safety Check):** "Every application must be manually signed off by two people." (Slower, higher accuracy).
  *   **Action:** Tables discuss for 5 mins. Room vote by show of hands. Majority rule wins.
  *   *Facilitator Note:* Ensure the vote is binding. Write the winning rule on the whiteboard in big letters.

  **0:35 – 0:65 | Phase 2: The Reality (The Lock Engages)**
  *   Hand out the "Grant Applications" (simple printed sheets).
  *   **The Twist:** Hand out the **Index Cards** face down.
      *   **Blue Cards (60% of room):** "Your Objective: **Volume.** Process as many as possible. Quality does not matter."
      *   **Yellow Cards (40% of room):** "Your Objective: **Accuracy.** Find the 3 errors hidden in the stack. Speed does not matter."
  *   **Instruction:** "You have 20 minutes. You must follow the **Process Rule** on the whiteboard. Go."
  *   *Dynamic:*
      *   If **Option A (Fast Track)** won: Blue cards (Volume) will fly through (Servant). Yellow cards (Accuracy) will be frustrated because they can't check the auto-approved ones (Author).
      *   If **Option B (Safety Check)** won: Yellow cards (Accuracy) will feel secure (Servant). Blue cards (Volume) will be bogged down in bureaucracy (Author).
  *   *Facilitator Note:* Walk around. Listen to the grumbling. "This rule is stupid." "I can't finish." "This is helping me." Do not intervene.

  **0:65 – 0:75 | The Cool Down**
  *   Stop the task.
  *   Ask for a show of hands: "Who met their objective?"
  *   Ask: "Who felt the Rule on the whiteboard *helped* you?" (Likely the winners).
  *   Ask: "Who felt the Rule *stopped* you?" (Likely the losers).
  *   **Silence:** Let the split sit for 10 seconds.

  **0:75 – 0:90 | The Debrief (Connecting the Dots)**
  *   Now you bring out the words.
  *   **Step 1: The Labels.** Ask the "Helped" group: "What word describes that rule?" (Expect: Tool, Support, Handrail). Ask the "Stopped" group: "What word describes that rule?" (Expect: Barrier, Wall, Interference).
      *   *Your Move:* Introduce their distinction. "Some of you experienced the policy as a **Servant** (doing what you wanted). Some as an **Author** (telling you what to do). It was the *same rule*."
  *   **Step 2: The Asymmetry.** "Raise your hand if you voted for the rule in Phase 1." (Most will). "Raise your hand if you hated the rule in Phase 2." (The losers will).
      *   *Your Move:* "You endorsed this at Time 1. You rejected it at Time 2. Which 'You' is the real citizen? The one who voted behind the veil, or the one struggling with the paperwork?"
  *   **Step 3: Exhibit A.** "Look at the sign-in sheet again. The checkbox. I ticked it for you. Did that feel like a Servant (saving you the effort of ticking) or an Author (assuming your consent)?"
  *   **Closing:** "Paternalism isn't a property of the policy. It's a relationship between the policy and the person's current goal. Your job is to know which one you're building."

  ---

  ### Debrief Guide: Mapping Moments to Concepts

  | Moment in Session | Concept to Elicit | Question to Ask |
  | :--- | :--- | :--- |
  | **The Sign-in Sheet** | **Default Effect** | "Did the pre-tick save you time, or steal your choice? Would you have ticked it anyway?" |
  | **The Vote (Phase 1)** | **Endorsement (Time 1)** | "When you voted, did you feel like a policy maker or a citizen? Did you assume you'd be on the winning side?" |
  | **The Task (Phase 2)** | **Experience (Time 2)** | "At minute 10 of the task, did you remember you voted for this? Did it matter?" |
  | **Blue vs. Yellow Cards** | **Servant vs. Author** | "Same rule. Blue cards call it 'efficiency.' Yellow cards call it 'obstruction.' Which label is true?" |
  | **The Final Reveal** | **Paternalism** | "If the rule helped you do what you *actually* wanted, was it paternalistic? If it stopped you, was it?" |

  ### Predicted Failure Modes & Fixes

  **1. The "Tiny Stakes" Shrug**
  *   **Risk:** They don't care about the grant task. It's just paper. They won't feel the "Author" constraint as an imposition.
  *   **Fix:** **Social Stakes.** Announce at the start: "The table that processes the most valid applications gets to leave 5 minutes early. The table with the most errors has to stack the chairs." Make the consequence of the Rule tangible.
  *   **Backup:** If energy is low, make the "Safety Check" rule physically annoying (e.g., they must stand up to sign off).

  **2. The "Professional Contrarians" (The Behav-Econ Grads)**
  *   **Risk:** The 2-3 who know the literature will spot the Veil of Ignorance setup immediately and disengage or cynically narrate it to their table.
  *   **Fix:** **Recruit Them.** In Phase 1, pull them aside. "I know you know what this is. I need you to be 'Process Observers.' Don't participate in the task. Watch how your table mates react to the rule. Report back in the debrief." This turns their cynicism into data collection.

  **3. The "Groupthink" Vote**
  *   **Risk:** Everyone votes for Option A (Fast Track). Then everyone gets Blue Cards (Volume). No tension arises. Everyone agrees the rule was great.
  *   **Fix:** **Rig the Cards.** Ensure the Card distribution *contradicts* the likely vote. If they vote Fast Track (likely, people hate bureaucracy), ensure 50% of the room gets Yellow Cards (Accuracy). You need losers to generate the "Author" feeling.
  *   **Preparation:** Count the heads before handing out cards.

  **4. The "Philosophy Trap" (New Failure Mode)**
  *   **Risk:** In the debrief, a participant asks: "But surely if we voted for it, it's democratic, not paternalistic?" The room gets stuck on defining democracy vs. paternalism and misses the behavioural point.
  *   **Fix:** **The "Future Self" Pivot.** Don't argue democracy. Ask: "You voted for it. But the 'You' that voted didn't know they needed Accuracy. The 'You' doing the task needed Accuracy. Which 'You' had better information?" This shifts it from political theory to information asymmetry.

  ### Honest Limitations: What This Won't Do

  1.  **It won't solve the normativity.** The session will show them *that* the distinction exists, but it cannot tell them *when* it is okay to be the "Author." You will have to say this explicitly: "This workshop shows you the mechanism. It does not give you the moral permission slip. That's your job as advisers."
  2.  **It relies on the "Loss" feeling.** If the "Author" constraint doesn't actually stop them from winning (e.g., they find the errors anyway despite the Fast Track rule), the distinction collapses. You must ensure the task is hard enough that the Rule actually changes the outcome.
  3.  **It creates cynicism about voting.** Be careful not to imply that "voting doesn't matter." The point is that *aggregate* voting masks *individual* impact. Clarify this: "Policy is always a blanket. Behavioural insights is about seeing who gets cold underneath it."

  ### Final Facilitator Note
  You mentioned you can't get the "Servant/Author" distinction straight yourself. In this design, **you don't need to.**
  *   If the rule helps them achieve their secret goal = **Servant.**
  *   If the rule prevents them achieving their secret goal = **Author.**
  *   Let *them* define the words. Your job is to point at the gap between the Vote and the Experience. If you stick to the script, the philosophy emerges from the friction, not your slides.

  Good luck on Thursday. Watch the sign-in sheet—that's your anchor.
