      *   *Stakes:* Getting to leave 5 minutes early (for the winning team/condition) or avoiding a "boring admin task" at the end.
      *   *Philosophy:* Aligns with Thaler/Sunstein but also Dworkin/Archard on paternalism.

      *(Self-Correction during drafting)*: I need to make sure I don't use the word "Paternalism" until the end. I need to make sure the Servant/Author distinction is generated by *them*.
      *   *Labeling:* Instead of Servant/Author, I'll ask them to label the *feeling*. "Did this feel like a Handrail or a Wall?"
