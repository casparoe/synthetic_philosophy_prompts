      *   *Best guess:* The text says "Representations are alien -> Therefore Human Simulator wins." The reality is "Human Simulator wins -> Because it's computationally cheaper/easier to fit, regardless of representations (though representations add to the cost)." The causality is inverted. The simulator problem is primary; ontology is secondary.

      *(Refining the Quine Analogy)*: Quine says there is *no* fact of the matter. ELK assumes there *is* a fact of the matter (the model's internal state). So the analogy breaks down on the metaphysics, even if it holds on the data underdetermination.

      *(Refining the Practical Conclusion)*: "Monitoring behavior" *is* eliciting latent knowledge. If I monitor a robot arm, I need to know if it's holding a weapon. If the robot knows it's holding a weapon but I can't tell, monitoring fails. So the conclusion is internally inconsistent.

