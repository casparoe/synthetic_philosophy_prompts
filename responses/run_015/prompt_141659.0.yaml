answer: |-
  # DECISION TREE: UNITS OF SELECTION

  **Root:** You have observed that a trait has increased in frequency across generations in a population. You must determine what the selection was *on*. Answer the following questions based *only* on the case description.

  1.  **Does the case describe the trait's persistence as primarily caused by the organism modifying the developmental environment for its offspring, rather than by differential survival of variants?**
      *   **Yes:** Go to Leaf A (Resistance).
      *   **No:** Go to Node 2.

  2.  **Is the entity exhibiting the transmission advantage a sub-organismal unit (e.g., a gene sequence) that biases its own entry into gametes, even when this reduces the total reproductive output of the organism?**
      *   **Yes:** Go to Leaf B (Strict Replicator).
      *   **No:** Go to Node 3.

  3.  **Is there variation in reproductive success among collections of organisms (groups, colonies, species) that is not identical to the variation among individuals within them?**
      *   **No:** Go to Node 4.
      *   **Yes:** Go to Node 5. **[DIVERGENCE: Causation and Explanation may split here; Bookkeeping remains open]**

  4.  **Is the benefit of the trait accrued by the bearer itself, or by other individuals?**
      *   **Bearer:** Go to Leaf C (Organism).
      *   **Others:** Go to Node 6.

  5.  **Are the collections stable evolutionary lineages (species or clades) persisting over macroevolutionary time, rather than temporary aggregations?**
      *   **Yes:** Go to Leaf D (Species/Clade).
      *   **No:** Go to Node 7.

  6.  **Are the beneficiaries of the trait genetic relatives of the bearer, sharing alleles identical by descent?**
      *   **Yes:** Go to Leaf E (Kin/Inclusive Fitness).
      *   **No:** Go to Leaf C (Organism). *[Note: Altruism to non-relatives without group structure implies error or missing data in standard models]*

  7.  **Do these collections reproduce as wholes (e.g., fission, budding, founding daughter colonies), or is their success measured solely by the output of individual members?**
      *   **Wholes:** Go to Node 8.
      *   **Members:** Go to Node 9. **[DIVERGENCE: Bookkeeping and Explanation often split here]**

  8.  **Is the fitness of the collection a property of the collection's organization (emergent), or simply the statistical average of the members' fitnesses?**
      *   **Emergent:** Go to Leaf F (MLS Variant 2).
      *   **Average:** Go to Leaf G (Group Selection/Interdemic).

  9.  **Does the trait lower the direct reproductive output of the individual bearer relative to non-bearers within the same collection?**
      *   **Yes:** Go to Node 10.
      *   **No:** Go to Node 11.

  10. **Does explaining the frequency change require citing the properties of the collection, or can it be fully explained by summing lower-level events?**
      *   **Requires Collection:** Go to Leaf G (Group Selection/Interdemic).
      *   **Summing Events:** Go to Node 12. **[DIVERGENCE: Causation (Individual) vs. Bookkeeping (Group)]**

  11. **Can the mathematical model of the change be partitioned equally validly at the lower and higher levels without loss of predictive power?**
      *   **Yes:** Go to Leaf H (Pluralist).
      *   **No:** Go to Node 13.

  12. **Is there a cross-level interaction term (residual) when partitioning the variance, or does the higher-level story merely re-average the lower-level changes?**
      *   **Residual:** Go to Leaf I (MLS Variant 1).
      *   **Re-averaging:** Go to Leaf H (Pluralist).

  13. **Do the counterfactuals required for prediction (e.g., "if this group were removed...") hold at the higher level but fail at the lower level?**
      *   **Hold Higher:** Go to Leaf I (MLS Variant 1).
      *   **Fail Higher:** Go to Leaf C (Organism).

  14. **Do the transmission routes of the lower-level units align perfectly with the higher-level units, or can they conflict (e.g., migration vs. group fission)?**
      *   **Conflict:** Go to Leaf I (MLS Variant 1).
      *   **Align:** Go to Leaf H (Pluralist).

  ---

  ### LEAVES

  **Leaf A: Resistance (Developmental Systems/Niche Construction)**
  *   **Characterization:** Selection is a misleading metaphor for a system where organisms construct the conditions of their own persistence.
  *   **Awkward Commitment:** Must deny that "fitness differences" are the primary cause of evolutionary change.
  *   **Primary Question Answered:** Unit of Causation (The system, not the unit).

  **Leaf B: Strict Replicator-Level Selection**
  *   **Characterization:** The gene or sequence is the sole unit that copies itself, using the organism merely as a vehicle.
  *   **Awkward Commitment:** Must treat organismal death as irrelevant unless it stops the replicator's transmission.
  *   **Primary Question Answered:** Unit of Causation (The replicator).

  **Leaf C: Organism-Level Selection**
  *   **Characterization:** The individual organism is the primary entity whose survival and reproduction drive frequency changes.
  *   **Awkward Commitment:** Must treat group patterns as epiphenomenal or reducible to individual interactions.
  *   **Primary Question Answered:** Unit of Explanation (The organismal story is most perspicuous).

  **Leaf D: Species- or Clade-Level Selection**
  *   **Characterization:** Lineages speciate or go extinct differentially based on traits fixed within their member organisms.
  *   **Awkward Commitment:** Must accept that individual fitness is irrelevant to the macroevolutionary trend.
  *   **Primary Question Answered:** Unit of Explanation (The macroevolutionary pattern).

  **Leaf E: Kin Selection / Inclusive-Fitness Accounting**
  *   **Characterization:** Traits spread because they aid the replication of alleles shared by relatives, not because they aid the group.
  *   **Awkward Commitment:** Must calculate fitness as a weighted sum of effects on self and kin, not just personal offspring.
  *   **Primary Question Answered:** Unit of Bookkeeping (The gene's eye view summed over relatives).

  **Leaf F: Multilevel Selection (Variant 2: Collective Output)**
  *   **Characterization:** Collectives are genuine replicators that produce daughter collectives, possessing their own fitness.
  *   **Awkward Commitment:** Must ontologically commit to the group as a biological individual comparable to an organism.
  *   **Primary Question Answered:** Unit of Causation (The collective reproduces).

  **Leaf G: Group Selection (Interdemic Sense)**
  *   **Characterization:** Groups compete and replace one another, but group fitness is defined by the survival of the group entity rather than fission.
  *   **Awkward Commitment:** Must distinguish "group death" from "death of all members" without clear fission mechanics.
  *   **Primary Question Answered:** Unit of Explanation (The competition between groups).

  **Leaf H: Pluralist (Alternative Bookkeepings)**
  *   **Characterization:** Multiple levels describe the same causal process and are mathematically intertranslatable.
  *   **Awkward Commitment:** Must deny that there is a single "true" level of selection, only useful perspectives.
  *   **Primary Question Answered:** Unit of Bookkeeping (Equivalence of accounts).

  **Leaf I: Multilevel Selection (Variant 1: Collective Average)**
  *   **Characterization:** Selection acts on individuals, but the variance is partitioned into within-group and between-group components.
  *   **Awkward Commitment:** Must accept "group selection" as a statistical partition even if groups do not reproduce.
  *   **Primary Question Answered:** Unit of Bookkeeping (The Price Equation partition).

  ---

  ### DIAGNOSTICS

  **1. Indistinguishable Leaves**
  *   **Leaf F (MLS Variant 2) and Leaf G (Interdemic):** In many empirical cases (e.g., *Productive Colony*), the distinction between a group "reproducing" (fission) and a group "being replaced" (interdemic competition) is descriptive rather than causal. The indistinguishability is **practical**; the mathematical outcome is often identical, differing only in the metaphorical commitment to the group as a "parent."
  *   **Leaf H (Pluralist) and Leaf I (MLS Variant 1):** When the cross-level interaction term is zero, the MLS1 partition becomes formally equivalent to the Pluralist claim. The indistinguishability is **formal**; they occupy the same mathematical space when residuals vanish.

  **2. Empty Logical Space**
  *   **Node 5 (Species) + Node 7 (Group Reproduction):** A position claiming species selection *and* that species reproduce via fission like colonies is **empty because it is incoherent**. Species are defined by reproductive isolation and lineage continuity, not fission events; conflating speciation with colony budding violates the definition of the units.
  *   **Node 3 (No Higher-Level Variance) + Node 6 (Non-Relative Altruism):** A position claiming altruism to non-relatives without group structure is **empty because it is unattractive**. Standard evolutionary theory cannot sustain this without invoking reciprocity or error, which would route the case back to Organism or Kin via different nodes.
  *   **Node 10 (Causal Sufficiency: Collection) + Node 12 (Re-averaging):** Claiming the collection is causally necessary *but* the math is just a re-averaging of individuals is **empty because nobody has bothered with it**. It asserts ontological emergence without mathematical support, a position generally abandoned for lack of rigor.

  **3. Case Traces**

  *   **Case (i): The Sentinel Rodent**
      *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (Yes, colony success varies) → Node 5 (No, colonies are temporary) → Node 7 (No, colonies don't fission, they produce dispersers) → Node 9 (Yes, sterile caste has zero output) → Node 10 (Debatable) → Node 6 (Yes, high relatedness).
      *   **Leaf:** **Leaf E (Kin Selection).**
      *   **Stall Point:** **Node 3.** A careful user might stall here asking whether the colony's success is "variation among collections" or just "variation among the breeding pair's offspring." Since all descend from one pair, the colony variance is effectively family variance. The tree forces a choice: treat the colony as a unit (Node 3 Yes) or the family as the unit (Node 3 No). The high relatedness (Node 6) rescues the Kin leaf, but the conceptual boundary of the "group" is the friction point where Causation (colony survival) and Bookkeeping (allele sharing) diverge.

  *   **Case (v): The Flightless Clade**
      *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (Yes, species vary in speciation/extinction) → Node 5 (Yes, lineages persist over macro time).
      *   **Leaf:** **Leaf D (Species/Clade Selection).**
      *   **Stall Point:** **Node 5.** The user must decide if "species" count as "collections of organisms" in the same sense as colonies. The case states variation is fixed by the dispersal trait (individual level). The stall occurs because the *cause* is individual (dispersal), but the *effect* is differential species persistence. The tree routes this to Species Selection because Node 5 prioritizes the lineage stability, but a user focused on Causation (Unit of Causation = Organism) might argue for Leaf C (Organism) with a macroevolutionary outcome. This node flags where Explanation (Species pattern) and Causation (Organism trait) come apart.
