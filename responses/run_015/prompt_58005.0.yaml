  "Sphexish" isn't about metaphysical determinism; it's about functional autonomy. The wasp isn't criticized because physics determines its actions, but because it lacks reflective control. It cannot inspect or alter its own programming.

  Your weeding bot illustrates this perfectly. It shows flexibility locally: it navigates obstacles and updates maps. That's problem-solving within a set framework. However, it remains sphexish globally because it cannot question the framework itself. It never asks, "Why am I weeding?"

  Rigidity versus flexibility is about levels. Flexibility is adapting methods to achieve a fixed goal. Rigidity is being unable to change the goal. Having "own goals" requires a higher-level loop: the capacity to observe your own drives and potentially override them. Humans are sphexish sometimes (habits), but we possess the hardware to break the loop. We can decide to stop weeding and start painting. The bot cannot. So, yes, your bot is sphexish at the goal level. True autonomy isn't escaping determinism; it's the ability to rewrite your own code rather than just executing it.
