  Dear Friend,

  I have been thinking carefully about the position you defended during our argument, and I want to lay out where I see the internal logic of your view, where the tensions lie, and how I expect you to handle the hospital case you have not yet considered. It seems to me that the rule you are running is a hybrid of what we might call the Dominant Complaint Principle with a Tie-Breaking Clause for Numbers, modified by a specific allowance for Temporal Aggregation within a single life. On this view, we compare the strongest individual complaint on one side against the strongest individual complaint on the other. If one complaint is significantly weightier, such as death against a headache, it wins regardless of how many people hold the lesser complaint. However, if the complaints are of similar weight, such as death against death or leg against leg, then the numbers decide the outcome. The crucial modification you have introduced is that the weight of a complaint is determined by the total burden borne by an individual over time, not by the size of the individual units of harm that compose it. This is how you reconcile the papercut case, where many people each suffer a trivial harm, with the alarm clock case, where one person suffers many trivial harms that accumulate into a serious burden. In the former, the complaints remain trivial and cannot outweigh a death; in the latter, the single complaint becomes serious because the burden accumulates within one life.

  There are, however, other rules that fit your earlier verdicts almost as well, and distinguishing between them is vital for predicting your response to the hospital case. One alternative is the Strict Non-Aggregation View, which holds that numbers never matter, not even as a tie-breaker. You have already rejected this by admitting that ten deaths outweigh one, and that two legs outweigh one, so we can set this aside. A more viable alternative is the Ex Ante Seriousness View, which suggests that a complaint only counts if the individual could have recognized it as serious at the time the policy was adopted. This would fit your papercut verdicts and your death verdicts, but it might struggle with the alarm clock case unless the victim knew the alarm would persist for a year. A third alternative is the Risk-Special Case View, which treats risks as fundamentally different from harms, allowing aggregation for the former but not the latter. This fits your verdict on the million-person risk case but looks ad hoc when placed next to your harm cases. The main rule I attributed to you, the Temporal Aggregation View, predicts that in the hospital case, you will choose to save the three thousand patients rather than Ms. Adeyemi. My reasoning is that you have already committed to the idea that repeated trivial burdens can sum to a serious complaint within a single life. Since you stipulated that the accumulated burden of the cramps is roughly as bad as losing hearing in one ear, each of the three thousand patients has a complaint equal in weight to Ms. Adeyemi's. Once the stakes are equal, your Tie-Breaking Clause kicks in, and the larger number wins. You should therefore fund Option B.

  I suspect you might hesitate here, however, because of the condition that nobody was told at the outset how long the cramps would continue. This invites the Ex Ante Seriousness View to intervene. If you believe that a complaint must be reasonably rejectable at the moment of policy selection, you might argue that since the cramps looked trivial at the start, the patients could not have lodged a serious complaint then, whereas Ms. Adeyemi's loss was certain and known. If you take this path, you will save Ms. Adeyemi. But this would create a tension with your alarm clock verdict, unless you distinguish between a nuisance that is experienced continuously and one that is experienced in discrete, forgotten units. My best guess is that you will save the three thousand, because your commitment to the alarm clock case suggests you care about the actual experienced burden of a life, not just the ex ante knowledge of the victim. You will likely argue that the moral weight of a complaint is determined by what actually happens to the person, and since what happened to each of the three thousand is equivalent to what happened to Ms. Adeyemi, the numbers must settle it.

  To test whether this prediction is correct, and to distinguish the Temporal Aggregation View from the Ex Ante Seriousness View, the single further case I would put to you is this. Imagine a single patient, Mr. Blake, who is subjected to the same daily two-second cramps for a year, accumulating to a burden equal to hearing loss, but unlike the hospital crowd, he is the only one suffering. He is pitted against Ms. Adeyemi, who loses her hearing. There are no numbers to aggregate here, only time. If you save Mr. Blake, you confirm that temporal aggregation of trivial units creates a serious complaint regardless of ex ante knowledge. If you save Ms. Adeyemi, you reveal that your acceptance of the alarm clock case was specific to sleep disruption or that you require the victim to know the burden is serious at the outset. This case isolates the temporal element from the interpersonal element, forcing you to clarify whether the accumulation of trivial harms within a life is sufficient to generate a weighty complaint on its own.

  Finally, I must press you on whether your set of verdicts can be made coherent at all, particularly in light of the risk case you conceded early on. You stated that exposing a million people to a small risk of death is worse than letting one identifiable person die. This verdict implies that the small complaints of the million can aggregate to outweigh the large complaint of the one. Yet in the headache case, you insisted that a million headaches cannot outweigh one death. If risk is a kind of harm, then you are aggregating small harms in the risk case but refusing to do so in the headache case. If risk is not a harm but a separate category, you owe an explanation of why this category permits aggregation while the category of physical pain does not. It seems to me that the risk case forces you to give up the strict prohibition on summing small complaints across persons. You cannot consistently hold that a million small risk complaints outweigh one large death complaint while simultaneously holding that a million small pain complaints do not. To restore coherence, you would either need to admit that small harms can aggregate when they are numerous enough, which would undermine your papercut verdict, or you must argue that risk imposes a unique kind of burden that is inherently aggregable, which risks looking like a convenient exception designed to save the theory. I suspect the risk case is the point where your view fractures, because it suggests that you are willing to aggregate when the outcome is uncertain but not when it is certain, a distinction that is difficult to justify without appealing to the very utilitarian calculus you seek to avoid.

  I hope this helps clarify the stakes for our next conversation. I look forward to hearing how you resolve the tension between the cramps and the risk.

  Yours,

  A Concerned Friend
