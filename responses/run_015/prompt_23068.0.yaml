answer: |-
  You have hit on what is widely considered the single most serious technical objection to the Lewisian Best System Account (BSA). It is often called the **Trivialization Problem** or the **Language Relativity Problem**.

  You are correct that if the Humean allows *any* vocabulary to formulate the system, the account collapses. If I can define a predicate $G$ such that $G(x)$ is true iff $x$ is part of a world where $F=ma$ holds, I can state the entire history of the universe as $\forall x G(x)$. That system is maximally strong (entails all truths) and maximally simple (one axiom).

  You are asking for the **mechanism** that fixes the vocabulary without circularity or arbitrariness. Here is the breakdown of the actual mechanisms available to the Humean, the costs associated with them, and why the debate remains stuck exactly where you say it is.

  ### 1. The Lewisian Mechanism: Primitivist Naturalness
  David Lewis's actual solution is not to derive the vocabulary from the mosaic, but to **posit it as a metaphysical primitive.**

  *   **The Mechanism:** The BSA is not run over *any* language. It is run over a language whose primitive predicates refer exclusively to **Perfectly Natural Properties (PNPs)**.
  *   **How it stops gerrymandering:** A gerrymandered predicate like "grue" or your "universal history encoder" is not a perfectly natural property. It is a complex Boolean combination of PNPs. The simplicity metric counts the length of the derivation *from* the PNPs. Since the gerrymandered predicate requires a complex definition in terms of PNPs, the system utilizing it is not actually simple.
  *   **Addressing your Circularity Worry:** You wrote: *"the laws are supposed to carve nature at its joints, but we're using a pre-existing vocab to do the carving."*
      *   **Correction:** On the strict Lewisian view, **laws do not carve nature at its joints.** Perfectly Natural Properties carve nature at its joints. Laws are merely the *summary* of the distribution of those properties.
      *   **The Hierarchy:**
          1.  The Mosaic (particular matters of fact).
          2.  The PNPs (metaphysical primitives that structure the mosaic).
          3.  The Best System (derived from 1 & 2 via simplicity/strength).
      *   **Is it Circular?** No. Naturalness is not defined by the Best System. The Best System is defined by Naturalness.
      *   **Is it a Whim?** Lewis argues it is not a whim, but a necessary metaphysical posit required for *any* theory of objective similarity or causation. However, critics (like van Fraassen or Armstrong) argue this is indeed "quietly picking the language of physics." Lewis admits the PNPs will likely look like the fundamental quantities of our best physics (mass, charge, spin), but he insists this is a discovery about the world, not a linguistic convention.

  **The Cost:** You must accept **Naturalness as a primitive**. If you are a Humean who wants to reduce *everything* to the mosaic without modal or qualitative primitives, this fails. Lewis is a Humean about laws and modality, but *not* a Humean about properties.

  ### 2. The Information-Theoretic Mechanism (Kolmogorov Complexity)
  Some contemporary Humeans try to solve this without Lewis's robust metaphysical primitives by using **algorithmic information theory**.

  *   **The Mechanism:** Simplicity is defined as **Kolmogorov complexity**: the length of the shortest computer program (on a Universal Turing Machine) that outputs the mosaic data.
  *   **How it stops gerrymandering:** To use your "universal encoder" predicate, you have to write the code for it. While the *output* is simple, the *program* required to generate that encoding (the lookup table for the gerrymandered predicate) is massive. The complexity is shifted from the axiom length to the definition of the terms.
  *   **The Problem (Invariance Theorem):** Kolmogorov complexity is only invariant up to an additive constant depending on the choice of the Universal Turing Machine (UTM). If I choose a UTM that has your gerrymandered predicate hard-coded into its architecture, your system becomes simple again.
  *   **The Fix?** Proponents argue that for sufficiently large datasets (like a universe), the choice of UTM matters less asymptotically. However, this doesn't fully solve the *qualitative* problem. It solves the "length" problem but not the "joint-carving" problem. A UTM could still privilege "grue" over "green" by fiat.
  *   **Status:** This is a popular move (e.g., by Vitányi and Li, or adapted by philosophers like Loewer), but it generally requires assuming a "standard" UTM, which smuggles in the very linguistic bias you are worried about.

  ### 3. The "Two-Level" Best System (Meta-BSA)
  Some have proposed running the BSA twice.

  *   **The Mechanism:**
      1.  First, find the best system for selecting the *vocabulary* (the language that makes the world look simplest).
      2.  Second, use that vocabulary to find the best system for the *laws*.
  *   **Why it fails:** This usually collapses into triviality. The "best vocabulary" will simply be the one that allows the "best laws" to be stated most simply. It creates a feedback loop where the language and the laws co-optimize to allow a trivial description (e.g., "The language is {P}, and the law is $\forall x Px$").
  *   **Refinement:** **Cohen and Callender (2009)** suggest restricting the competition. They argue we shouldn't look for a single Best System for the whole universe, but rather relative to specific domains (special sciences). However, they concede that at the *fundamental* level, you still need a constraint on vocabulary, usually reverting to a Lewis-style naturalness constraint.

  ### 4. Pragmatic Humeanism (The "Whim" Acceptance)
  There is a minority view (associated with Bas van Fraassen or more recently pragmatist readings of Humeanism) that accepts your conclusion: **The language *is* fixed by us.**

  *   **The Mechanism:** The vocabulary is fixed by human cognitive interests, salience, or pragmatic utility.
  *   **The Consequence:** Laws are not fully objective features of the world independent of observers. They are objective *relative to a conceptual scheme*.
  *   **Why Humeans resist this:** Most Humeans want laws to be objective enough to support counterfactuals and scientific realism. If the language is pragmatic, then "If I had struck the match, it would have lit" becomes dependent on human linguistic practices, which undermines the scientific realist motivation for the BSA.

  ### Summary of the Actual Mechanism
  If you demand a non-circular, non-arbitrary mechanism within a strictly Humean framework (mosaic only, no modal primitives), **there is no consensus solution.**

  1.  **Lewis's Solution:** Fix the language via **Perfectly Natural Properties**.
      *   *Mechanism:* Metaphysical Primitivism.
      *   *Cost:* Abandons pure Humean reductionism (properties are not reduced to the mosaic).
      *   *Circularity:* Avoided by making naturalness prior to lawhood.

  2.  **Information Theory Solution:** Fix the language via **Kolmogorov Complexity**.
      *   *Mechanism:* Computational invariance.
      *   *Cost:* Requires a privileged Universal Turing Machine (which is arguably just the language of physics in disguise).

  3.  **The Hard Truth:**
      The BSA cannot generate the vocabulary from the mosaic *ex nihilo*. It requires a **prior constraint on admissible predicates**.
      *   If that constraint is **metaphysical** (Lewis), you avoid circularity but accept primitives.
      *   If that constraint is **linguistic/conceptual**, you avoid primitives but accept that laws are mind-dependent.
      *   If that constraint is **derived from the best system itself**, you get circularity/triviality.

  ### How to Unstick Yourself
  You are stuck because you are trying to find a mechanism that is both **immanent** (derived solely from the mosaic) and **objective** (independent of human language). The literature suggests you cannot have both.

  To move forward, you must choose which bullet to bite:
  1.  **Bite the Primitivist Bullet:** Accept Lewis's view. The "mechanism" is that the world *just has* a fundamental qualitative structure (PNPs) that is not further analyzable. The BSA analyzes *lawhood*, not *naturalness*. This is the standard view for a reason: it works, provided you accept the primitive.
  2.  **Bite the Pragmatist Bullet:** Accept that the "Best System" is relative to a cognitive agent's vocabulary. This saves the Humean mosaic but sacrifices the strong objectivity of laws.
  3.  **Abandon Humeanism:** If you think the language must be fixed by the laws themselves (as your circularity worry suggests), you are drifting toward **Armstrong's DTA theory** or ** Dispositional Essentialism**, where laws (or powers) determine the natural properties, not vice versa.

  The "actual mechanism" you are looking for is Lewis's **Perfectly Natural Properties**. It feels like a cheat to many because it stops the reductionist regress, but Lewis argues the regress *must* stop somewhere. If it doesn't stop at PNPs, it stops at nothing, and the BSA trivializes.
