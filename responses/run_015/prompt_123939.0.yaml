      *   **Topic:** The Meno Problem (Why is knowledge more valuable than mere true belief?).
      *   **Task:**
          1.  Brainstorm types of value (intrinsic, instrumental, social).
          2.  Write out *desiderata* (requirements) for an adequate theory, including motivating cases (lucky guesser, dormant knowledge, distributed knowledge, degree vs. status).
          3.  Flag non-negotiable vs. camp preferences.
          4.  Identify potential tensions/incompatibilities (e.g., stability vs. utility).
          5.  Score three specific accounts (Reliabilism, Virtue Epistemology, Social Vouching) against the desiderata.
          6.  Constraints: No bibliography/reading list, no specific page citations, keep scorecard concise (not longer than criteria), ignore typos (like "seperate").

  2.  **Deconstruct the Meno Problem:**
      *   Core issue: Plato's *Meno*. Socrates asks why knowledge is more valuable than true opinion. Both guide action correctly.
      *   Standard answer: Knowledge is "tied down" (stable).
      *   Contemporary revival: Swinburne, Kvanvig, Pritchard, Zagzebski, etc.
      *   The "Swamping Problem": If the value of truth swamps the value of the process, why care about the process (justification/reliability)?

  3.  **Brainstorming Types of Value:**
      *   *Instrumental/Practical:* Helps you get what you want (navigate to Larissa).
      *   *Intrinsic/Epistemic:* Good in itself to be in contact with reality (understanding).
      *   *Social/Communicative:* Trust, testimony, assertion norms.
      *   *Modal/Stability:* Resilience across nearby possible worlds.

  4.  **Developing the Desiderata (The Core Task):**
      *   Need to cover specific cases mentioned by the user:
          1.  Lucky Guesser vs. Knower (The classic Meno case).
          2.  Dormant Knowledge (Knowledge never acted on).
          3.  Distributed Knowledge (Group knowledge vs. individual).
          4.  Status vs. Degree (Knowing vs. Knowing *well*).
      *   Need to distinguish Non-Negotiable vs. Camp Preferences.
      *   Need to check for Joint Unsatisfiability (Tensions).

      *Drafting Desiderata:*
      *   *D1: The Action-Guiding Constraint.* (Instrumental). Must explain why knowledge is a better guide than luck. *Motivation:* Lucky Guesser. *Status:* Non-negotiable (mostly).
      *   *D2: The Dormancy Constraint.* (Intrinsic/State-based). Must explain value even if no action is taken. *Motivation:* Dormant Knowledge. *Status:* Non-negotiable (otherwise knowledge reduces to successful action).
      *   *D3: The Stability/Resilience Constraint.* (Modal). Must explain why knowledge persists where luck fades. *Motivation:* Gettier cases/Lucky Guesser over time. *Status:* Camp Preference (Modalists vs. Pragmatists).
      *   *D4: The Social Assertibility Constraint.* (Normative). Must explain why we treat knowledge claims differently in testimony. *Motivation:* Social Vouching. *Status:* Camp Preference (Individualists vs. Socialists).
      *   *D5: The Gradability Constraint.* (Degree). Must distinguish *that* one knows from *how well* one knows. *Motivation:* Status vs. Degree. *Status:* Non-negotiable (linguistic data).
      *   *D6: The Non-Swamping Constraint.* (Meta-value). The source of value shouldn't be swamped by the value of truth itself. *Motivation:* Reliabilism critique. *Status:* Non-negotiable (for the problem to exist).

      *Checking Tensions:*
      *   Stability (D3) vs. Utility (D1). If I know P but it's useless, is it still valuable? If stability requires cognitive effort that delays action, does it reduce utility?
      *   Individual Justification (D2) vs. Distributed Knowledge (D4-ish). If knowledge is distributed, does the individual possess the "valuable state"?
      *   *Key Tension:* The "Useless Truth" problem. If value is instrumental, dormant knowledge has no value. If value is intrinsic, action-guiding superiority is harder to explain (why does intrinsic value help me navigate?).

  5.  **Scoring the Accounts:**
      *   *Reliabilism:* Good on stability/action. Bad on swamping (why is reliability valuable if truth is already had?). Bad on dormancy (if process is valuable only for output).
      *   *Virtue Epistemology (VE):* Good on swamping (credit/agential value). Good on dormancy (state of character). Bad on distributed knowledge (focuses on individual agent).
      *   *Social Vouching:* Good on assertion/testimony. Bad on dormant/solitary knowledge. Bad on reducing epistemic to social norms.

  6.  **Refining the Output (Philosophical Tone):**
      *   Use precise terminology (swamping, modal stability, normative status).
      *   Maintain the "professional philosopher" persona (analytic, careful distinctions).
      *   Ensure the "Non-Negotiable vs. Camp Preference" distinction is clear.
