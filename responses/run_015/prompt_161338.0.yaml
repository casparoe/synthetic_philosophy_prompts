answer: |-
  ### Audit of the Jury Analogy

  The analogy your colleague advances is rhetorically potent but structurally fragile. It relies on the intuitive legitimacy of the criminal jury to bypass the specific risks of a legislative body. To determine whether the analogy holds, we must map the institutions against one another, identify where the geometry breaks, and assess whether those breaks are fatal to the argument for competence and accountability.

  #### 1. The Correspondence Table

  | Component | Criminal Jury System | Proposed Sortition Chamber |
  | :--- | :--- | :--- |
  | **The Twelve** | 12 citizens drawn at random. | 300 citizens drawn at random. |
  | **The Judge** | Professional jurist; frames the law, instructs the jury. | The Permanent Secretariat (officials); advises on procedure and impact. |
  | **The Charge** | Specific indictment (did X commit Y crime?). | Government Bills (should X become law?). |
  | **The Evidence** | Admissible testimony and exhibits regarding past facts. | Impact assessments, expert testimony, lobbying regarding future effects. |
  | **The Verdict** | Binary: Guilty or Not Guilty. | Complex: Pass, Reject, Amend, or Ignore. |
  | **The Appeal** | Higher court reviews legal errors; acquittals are final. | No formal appeal; only repeal by future Parliaments or the next cohort. |
  | **The Mandate** | None; selected for impartiality. | None; selected for representativeness. |

  #### 2. Where the Mapping Fails

  The structural divergences are not merely cosmetic; they alter the cognitive load and the political risk.

  *   **Framing (Passive vs. Active):** A jury answers a question framed by others (the prosecution and the judge). They cannot choose to investigate a different crime. Your proposed chamber *chooses its own business*. It decides which bills to examine. This transforms the body from a trier of fact into a political gatekeeper.
  *   **Instruction (Law vs. Policy):** A jury is strictly instructed on the relevant law by a judge. They are told what legal standards apply. The chamber is "free to decide," supported only by officials. There is no equivalent to a judge's direction to sum up the legal principles, leaving members to navigate complex policy trade-offs without authoritative guidance.
  *   **Correction (Finality vs. Continuity):** A jury disperses. If they err, the system absorbs the shock as a singular tragedy (or a feature of liberty in the case of acquittal). The chamber sits continuously. A systematic error in judgment compounds over years. There is no higher court to correct a legislative blunder, only the slow mechanism of repeal.
  *   **Selection (Ignorance vs. Representation):** Jurors are deliberately selected for *ignorance* of the specific case to ensure impartiality. The chamber is stratified to *mirror* the population. This is a different epistemic goal: one seeks neutrality, the other seeks descriptive representation.
  *   **Temporality (Retrospective vs. Prospective):** A jury determines what *did* happen. A legislature determines what *should* happen. The former is a question of truth; the latter is a question of values, resource allocation, and unintended consequences.

  #### 3. Which Failures Matter for the Argument?

  Your colleague uses the analogy to deflect worries about **competence** and **accountability**.

  *   **The Framing Failure (Matters Crucially):** This is the fatal flaw in the analogy regarding competence. A jury is competent to judge facts because the legal framework is supplied by the judge. A chamber that sets its own agenda requires *political* competence. It must identify which bills are dangerous or necessary. Without an electoral mandate, claiming the right to prioritise legislative business is an assertion of power that the jury analogy cannot legitimise. Juries do not choose their cases; politicians do.
  *   **The Instruction Failure (Matters Crucially):** This undermines the competence argument. Jurors are protected from their own ignorance by the judge's summing up. Your chamber has a secretariat, but officials are not judges. They cannot instruct members on "the law of policy." Expecting 300 laypeople to navigate economic or foreign policy without the equivalent of judicial direction is a far heavier lift than asking 12 people to assess witness credibility.
  *   **The Correction Failure (Matters for Accountability):** The jury system accepts wrongful verdicts as the price of liberty. We do not accept wrongful *laws* with the same equanimity, as they bind everyone, including the innocent. The lack of an "appeal" mechanism (other than waiting for the next cohort) makes the accountability deficit more severe than in a court.
  *   **The Selection Failure (Does Not Matter):** Whether one selects for ignorance (jury) or representativeness (chamber) is a design choice, not a flaw in the analogy regarding the *capacity* of laypeople to decide. Both assume ordinary citizens are capable of judgment.
  *   **The Temporality Failure (Matters for Competence):** Judging the past is cognitively distinct from legislating for the future. The jury analogy hides the difficulty of predicting consequences.

  #### 4. What the Jury Picture Can and Cannot Carry

  **It Can Carry:**
  *   **Legitimacy without Election:** It successfully argues that democratic legitimacy does not strictly require a ballot box. Citizens can act in the public interest without a campaign mandate.
  *   **Deliberative Capacity:** It supports the claim that ordinary people, when secluded from party whipping and given time, can deliberate seriously.
  *   **Independence:** It illustrates that rotation protects against the formation of a self-perpetuating political class.

  **It Cannot Carry:**
  *   **Agenda-Setting Power:** It cannot justify a body that chooses *what* to judge.
  *   **Complex Policy Trade-offs:** It cannot validate the ability to balance budgets or weigh long-term strategic risks against short-term gains.
  *   **Institutional Memory:** It cannot explain how a rotating body maintains coherence over time without a permanent electoral connection.

  #### 5. A Better Analogy: The Board of Governors

  If the jury is the wrong picture for a standing, agenda-setting chamber, the most accurate analogy is a **Board of Governors** (or Trustees) for a major public institution, such as a university, the BBC, or a foundation.

  **Why this fits better:**
  1.  **Lay Oversight of Professionals:** Like your proposal, a Board comprises laypeople (often selected for diversity rather than expertise) who oversee a permanent professional secretariat (the Vice-Chancellor, the Director General, the Civil Service).
  2.  **Strategic vs. Operational:** A Board does not run the day-to-day operations (that is for the officials), but it sets the strategic direction and holds the executives to account. This matches the chamber's role of scrutinising bills rather than drafting them from scratch.
  3.  **Stewardship:** The duty is fiduciary and long-term. Members serve staggered terms to ensure continuity of governance while preventing capture. This mirrors your three-year staggered terms.
  4.  **Agenda Setting:** A Board *does* set its own agenda for oversight. They decide which risks to investigate. This acknowledges the political power of the chamber without pretending it is a passive jury.
  5.  **Accountability:** A Board is accountable to the stakeholders (the public) through transparency and reporting, rather than re-election. This makes the accountability deficit explicit rather than hiding it behind the jury's "finality."

  **What the Board Picture Makes Visible:**
  The Board analogy makes visible the **risk of capture by the Secretariat**. In a jury, the judge is an independent officer of the court. In your chamber, the "officials" are the very government bureaucracy the chamber is meant to scrutinise. The Board analogy highlights that the real danger is not the incompetence of the members, but the dependence of the lay members on the briefings provided by the permanent staff. It shifts the debate from "can ordinary people judge?" to "can ordinary people govern the governors?"

  ### Conclusion

  Your colleague is correct that the jury proves ordinary citizens can make grave decisions without a mandate. He is incorrect that this validates a standing legislative chamber. The jury is a mechanism for **finding truth**; your chamber is a mechanism for **allocating power**.

  The jury analogy should be retired. It conceals the agenda-setting power and the prospective nature of legislation. Adopt the **Board of Governors** analogy instead. It concedes that the members are lay stewards rather than judges, highlights the critical relationship with the permanent secretariat, and frames the accountability question correctly: not whether they can reach a verdict, but whether they can effectively oversee the machinery of state without becoming its captives.
