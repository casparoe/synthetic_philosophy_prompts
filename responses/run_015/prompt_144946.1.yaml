  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did Rawls talk about exemptions? *Correction:* He talks about liberty of conscience as a basic liberty (Lecture VIII in *Political Liberalism*). He is wary of exemptions that allow domination or inequality. I need to be careful not to make him sound like a RFRA (Religious Freedom Restoration Act) maximalist. He is more concerned with the *basic structure*.
