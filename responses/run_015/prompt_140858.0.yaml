answer: |-
  This is a clean, well-defined dynamical scenario. You have isolated a specific decoupling of the two components usually lumped together as "group fitness": **group fecundity** (output of propagules) and **group survival** (duration of the arena).

  Here is the anatomy of the thing you are seeing, stripped of citation baggage.

  ### 1. The Name and Definition
  There is no canonical term, but the tightest descriptive label is **Persistence-Modulated Selection**.

  **Definition:** A evolutionary dynamic where a trait spreads because it correlates with an increase in the *temporal duration* of the selective environment (the patch/host), thereby amplifying the cumulative effect of a within-environment advantage, independent of the environment's reproductive output.

  It is distinct from standard Multi-Level Selection (MLS) because the "higher level" does not reproduce; it persists. It is distinct from standard Individual Selection because the individual's fitness function is inextricably bound to a collective property (patch hazard rate) that the individual modifies.

  ### 2. Is the Collective Doing Causal Work?
  **Yes.** You can settle this with an interventionist test (the "fixing" test).

  *   **The Test:** Run the simulation but fix the patch lifespan ($T$) to a constant value for all patches, regardless of trait frequency.
  *   **The Result:** If the trait stops spreading (or spreads significantly slower, driven only by the raw within-patch advantage), then the patch lifespan is a causal variable in the evolutionary dynamics.
  *   **The Interpretation:** The patch is not a "unit of selection" in the replicator sense (it does not leave offspring patches). It is a **causal mediator**. It is a resource constraint that limits the total reproductive opportunity of the individuals inside. By modifying the constraint, the trait modifies its own total fitness integral.

  The collective property (lifespan) is not just background (like temperature) because it is *endogenous* to the population composition. Temperature is exogenous; patch crash rate is a function of the traits within the patch. That feedback loop is the causal engine.

  ### 3. Difference from Standard Multi-Level Selection (MLS)
  Standard MLS (e.g., trait-group models) relies on variance in **group reproductive output**.
  *   **Standard MLS:** Group A has more cooperators $\rightarrow$ Group A produces more migrants $\rightarrow$ Cooperators spread.
  *   **Your Case:** Group A has the trait $\rightarrow$ Group A lasts longer $\rightarrow$ Individuals in Group A get more rounds of division $\rightarrow$ Trait spreads.

  **The Carve:**
  In standard MLS, the "Between-Group" term in a Price decomposition is $\text{Cov}(\text{Group Fitness}, \text{Group Trait Frequency})$, where Group Fitness = Total Offspring.
  In your case, if you define Group Fitness = Total Offspring, the Between-Group term might be zero or negative (as you noted, long-lived patches might produce fewer total cells).
  However, if you define Group Fitness = **Duration**, the Between-Group term is positive.

  This means your system is mathematically isomorphic to MLS *only if* you redefine the "generation time" of the group to be its lifespan rather than its reproduction cycle. The crucial difference is that in standard MLS, the group *replicates*. In your system, the group *persists*. This makes it closer to **selection on survival** than **selection on fecundity**, pushed up a level.

  ### 4. Is it Niche Construction?
  **Yes, specifically Temporal Niche Construction.**

  *   **Standard Niche Construction:** Organisms modify the environment (e.g., build a dam), which changes the *direction* or *strength* of selection pressures on subsequent generations.
  *   **Your Case:** Organisms modify the environment (the patch), which changes the *duration* of the selection episode.

  It fits the definition: the organism modifies a relevant feature of its environment, and that modification feeds back on selection. The fact that it changes "how much selection occurs" rather than "what is selected" is a nuance of *what* is constructed (time vs. resource), not a disqualifier.

  It is **not** Ecological Inheritance in the strict sense, because the specific patch state is not inherited by daughter patches (patches crash and are recolonized from a pool). The "inheritance" is of the *trait* that builds the long-lived patch, not the patch itself.

  ### 5. Can it be Redescribed as Individual Selection?
  **Yes, and nothing is formally wrong with that redescription.**

  You can define the fitness of an individual cell ($W_i$) as its total lifetime reproductive output:
  $$W_i = \int_0^{T_{patch}} r_i(t) \, dt$$
  Where $r_i$ is the within-patch growth rate and $T_{patch}$ is the patch lifespan.
  If the trait increases $r_i$ slightly and increases $T_{patch}$ significantly, $W_i$ increases. The trait spreads by individual selection.

  **Why the redescription might be unhelpful:**
  It hides the *structural dependency*. In a well-mixed chemostat, an individual cannot extend its own integration time $T$. In your system, it can, but only by virtue of being embedded in a collective that it stabilizes. Treating it as pure individual selection obscures the fact that the fitness advantage is **context-dependent**. If you take the cell out of the patch context, the $T_{patch}$ term vanishes. The "individual" fitness is actually a property of the **individual-in-patch** composite.

  ### 6. The Edges (Boundary Conditions)
  To confirm this is the specific mechanism you think it is, check these boundaries. If these conditions change, the dynamic collapses into something else:

  1.  **Closed Patches (No Migration):**
      *   *Result:* Becomes standard Kin/Group Selection.
      *   *Why:* Lineages stay together. The benefit of patch longevity accrues specifically to the descendants of the founders. Relatedness rises. The "persistence" effect gets absorbed into the "group output" effect because the group eventually reproduces (via migration or fission).
  2.  **Trait Effect on Lifespan is Frequency-Independent (Public Good):**
      *   *Scenario:* One bearer extends the patch life for *everyone* equally, but bears a cost.
      *   *Result:* Altruism / Tragedy of the Commons.
      *   *Why:* The "duration" benefit is shared by non-bearers (cheaters) who also get more rounds of growth. Without the within-patch advantage (a) or relatedness, the trait dies. Your case works because the bearer captures the benefit of the extra time via advantage (a).
  3.  **Within-Patch Advantage is Exactly Zero:**
      *   *Result:* Neutral Drift (assuming no cost).
      *   *Why:* If $r_i$ is equal for all, extending $T$ helps everyone equally. There is no differential reproduction, just more total cells. The trait frequency does not change.
  4.  **Trait Shortens Patch Life but Increases Growth Rate:**
      *   *Result:* Standard $r$-selection / "Burn and Churn".
      *   *Why:* This is the inverse of your dynamic. Selection favors the trait that maximizes $r \times T$. If $r$ goes up and $T$ goes down, it's a life-history trade-off. Your case is unique because *both* $r$ and $T$ move in the same favorable direction for the bearer, but the $T$ effect dominates the population dynamics despite the open structure.

  ### Summary of the Carving
  You are looking at **Individual Selection amplified by Trait-Dependent Environmental Persistence.**

  *   **Unit of Selection:** The Individual Cell (replicator).
  *   **Vehicle:** The Cell-in-Patch composite.
  *   **Mechanism:** The trait modifies the hazard rate of the vehicle.
  *   **Key Distinction:** It is not Group Selection (groups don't reproduce). It is not pure Individual Selection (fitness depends on collective property). It is **Niche Construction where the niche is time.**

  If you need a label for your notes that distinguishes it from standard MLS, use **"Duration-Biased Transmission"** or **"Persistence-Modulated Selection."** The critical feature is that the variance in *time* substitutes for variance in *output* as the driver of the covariance between trait and fitness.
