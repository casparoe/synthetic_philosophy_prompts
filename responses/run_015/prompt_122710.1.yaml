prompt: |-
  I sit on the value analysis committee at a small regional hospital — nine of us, two doctors, a nurse manager, a pharmacist, an admin, a finance person and me (I do procurement and I'm the one who ends up with the spreadsheets). We meet twice a month for about two hours and we decide what supplies, devices and clinical protocols the hospital adopts: things that cost anywhere from 20 grand to 400 grand and that the floor staff then has to live with for five to ten years. I have no economics or philosophy background at all; I got into this because I noticed we almost always end up agreeing with whoever speaks first, and someone on a forum told me to look up information cascades and rational herding. I sort of get the basic idea — people copy the people who went before them and rationally stop using their own private information — but every explanation I find is about strangers picking between two restaurants, or balls in an urn, and I can't map it onto my situation, where we talk in a room, people say out loud how sure they are, we all know each other's track records, and the thing being decided is usually some ugly mixture of a prediction about the world and a values call about what we care about.

  One wrinkle that I think makes us different from the textbook setup, and please tell me if I'm wrong about this. In our meetings people don't only copy each other's picks, they copy each other's level of confidence. Three people who each have a genuinely weak private reason will each sound firm, because each one is reading the other two as firm, and the meeting ends in what I've started calling a "confidence cascade" — nobody has really changed their mind about anything, but the room is radiating a certainty that no individual in it actually holds, and anybody with a real worry suddenly feels like the odd one out and shuts up. There's a mirror version where one respected person says something lukewarm and the whole proposal quietly dies, which I've been calling a "chill." My sense is that a procedure built for binary choices made one at a time in a fixed order won't catch either of these, because with us the action isn't binary, the order isn't fixed and the thing being transmitted is partly a mood.

  What I actually want is a procedure I can run, in the twenty minutes I have before a meeting or in the two minutes of floor time I get during it, to decide for myself: is this a case where I should go along because the fact that everyone is converging really is evidence, or a case where I should dig in and put my private read on the table? A short ordered list of questions, each answerable by a non-expert in a minute or two without knowing the theory, with a clear stopping rule for each — stop and defer, stop and escalate, or stop and hand it to a person because the remaining question is about values rather than facts. Please be honest about which steps are real tests and which are just judgment wearing a clipboard. It has to handle: decisions where there is a fact of the matter that will show up in our own data later (does this catheter actually cut infection rates on our wards) versus ones where the right answer is mostly about what we value (do we buy the nicer monitoring system or spend the same money on another night nurse) versus ones where what matters is simply that we all do the same thing (which electronic record system we standardise on); the fact that sometimes I can get a private straw vote before anyone talks and sometimes I can't, because the chair runs the meeting how she likes; the fact that some of what people know isn't the kind of thing they can put into words, like a nurse's gut feeling that a new pump is going to be a misery on nights; and the fact that I am not the chair and I have maybe two minutes. If the answer is dig in, tell me what the move actually is — secret ballot, ask the quietest person first, table it, send it to a subcommittee, whatever. And please don't point me at papers or tell me what to read; our library access is basically nil and it wouldn't help me with fifteen minutes before a meeting anyway.

  Then run it on three cases from the last year. First: we were choosing between two IV pump models, everyone drifted toward the one the senior anesthesiologist liked, and I had our own repair-ticket data showing that model had noticeably more failures at our two sites over eighteen months than the other one did. Second: we were deciding whether to switch to a cheaper sterilization wrap before the next inspection; six people with far more relevant experience than me were all relaxed about it, my only objection was a vague worry about the inspectors that I couldn't really back up, and I really did not want to be the person who slows everything down — I suspect the right procedure tells me to shut up here, so show me that if it does. Third: an experienced OR nurse said a new surgical positioning device just felt wrong to her, couldn't articulate why, the rest of the room was enthusiastic, and I couldn't tell whether to treat that as a signal or as nothing. Finally, tell me plainly what the procedure can't do: what kinds of decisions it will misfire on, and how I keep it from turning me into the person who objects to everything.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Procurement/Value Analysis Committee member at a small regional hospital.
      *   **Committee Composition:** 9 people (2 doctors, nurse manager, pharmacist, admin, finance, user, others).
      *   **Problem:** Information cascades/herding, specifically "confidence cascades" (fake certainty) and "chills" (fake lukewarmness). Decisions involve high cost, long-term impact, mix of facts/values/coordination.
      *   **Constraints:** No economics/philosophy background. Needs a practical, actionable procedure. 20 mins prep or 2 mins during meeting. No academic papers. Must handle different decision types (factual, values, coordination). Must account for power dynamics (user is not chair).
      *   **Output Requirements:** A short ordered list of questions (tests) with clear stopping rules (defer, escalate, hand off). Honest assessment of which steps are real tests vs. judgment. Application to three specific past cases. Limitations of the procedure.

  2.  **Deconstruct the Problem:**
      *   *The Core Issue:* Distinguishing between *genuine consensus based on independent information* vs. *herding based on social signals (confidence/status).*
      *   *The "Confidence Cascade":* People amplify confidence because others seem confident.
      *   *The "Chill":* A respected person's lukewarm take kills a proposal without debate.
      *   *Decision Types:*
          1.  *Empirical:* Will this work? (Data exists or will exist).
          2.  *Normative/Values:* What do we prefer? (Cost vs. Care vs. Staff burden).
          3.  *Coordination:* We just need to pick one. (EHR systems).
      *   *Constraints:* 2 minutes during meeting. User is not chair.

  3.  **Drafting the Procedure (The "Two-Minute Triage"):**
      *   *Goal:* A checklist to determine: Go with flow, Speak up, or Change Process.
      *   *Step 1: Identify the Decision Type.* Is this a fact, a value, or a coordination problem? This dictates the stakes of being wrong.
      *   *Step 2: Check for Independence.* Did people form opinions *before* the senior person spoke?
      *   *Step 3: Test the Confidence.* Is the certainty backed by specific evidence or vague assurance?
      *   *Step 4: The "Silent Dissent" Check.* Is someone quiet who should be loud?
      *   *Step 5: Action.* Based on the above.

      *Refining the Steps for the User's Context:*
      *   Need to make it very concrete. "Ask yourself..."
      *   Need to address the "Values vs. Facts" distinction clearly.
      *   Need to address the "Gut Feeling" (tacit knowledge).

      *Drafting the Questions:*
      1.  *Type:* Fact, Value, or Coordination?
      2.  *Source:* Who spoke first? Did others have data before hearing them?
      3.  *Confidence:* Can they point to the *specific* reason, or just "it's good"?
      4.  *Cost of Error:* If we are wrong, can we fix it? (Reversible vs. Irreversible).
      5.  *The Quiet Room:* Who hasn't spoken?

      *Stopping Rules:*
      *   If Fact + Low Independence + High Cost of Error -> **Dig In.**
      *   If Value + High Consensus -> **Defer.**
      *   If Coordination -> **Defer.**
      *   If Tacit Knowledge (Gut) -> **Probe.**

  4.  **Developing the "Moves" (What to actually do):**
      *   User isn't chair. Can't demand secret ballots easily.
      *   *Move 1 (Fact Check):* "I have the repair logs here, can I read the failure rate?"
      *   *Move 2 (Tacit Knowledge):* "Nurse X, you've used the old one. What's the one thing that annoys you about this new one?"
      *   *Move 3 (Values):* "If we save $50k but add 10 mins to setup, is that the trade we want?"
      *   *Move 4 (Delay):* "Can we trial this on one ward first?"

  5.  **Applying to the Three Cases:**
      *   *Case 1 (IV Pumps):* Fact-based. User had data. Senior spoke first.
          *   *Analysis:* Fact decision. Independence violated (Senior spoke first). Cost of error high (patient safety/repair costs).
          *   *Action:* Dig In. Show the data.
      *   *Case 2 (Sterilization Wrap):* Fact/Compliance. Experts relaxed. User has vague worry.
          *   *Analysis:* Fact/Compliance. Experts have high signal. User has low signal (vague). Cost of error high (inspection fail), but user's signal is weak.
          *   *Action:* Defer (Shut up). *Crucial:* Explain *why* it's right to shut up here (signal-to-noise ratio).
      *   *Case 3 (OR Positioning):* Tacit Knowledge. One nurse vs. Group.
          *   *Analysis:* Fact/Safety. Tacit knowledge is valid signal. Group enthusiasm might be cascade.
          *   *Action:* Probe. Don't object, ask for elaboration. "What feels wrong?"

  6.  **Addressing Limitations & "Objectionist" Risk:**
      *   *Limitations:* Can't fix a toxic culture. Can't force the chair to change process. Can't solve deep value conflicts in 2 mins.
      *   *Risk:* Becoming the "No" person.
      *   *Mitigation:* Frame objections as data requests or trials, not vetoes. Pick battles (only when the test says "Dig In").

  7.  **Review and Refine:**
      *   *Tone:* Pragmatic, respectful of the user's insight (they identified "confidence cascades" correctly), no jargon.
      *   *Format:* Ordered list, clear stopping rules.
      *   *Honesty:* Admit where the checklist is just structured intuition.
      *   *Check against constraints:* 2 minutes? Yes. No papers? Yes. Handles the 3 types? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting a secret ballot. But the user said they aren't the chair and have 2 minutes. Suggesting a process change might be too hard. Better to suggest *questions* that force independence. E.g., "Before we decide, can we write down our top concern?" -> Too much friction. Better: "I'd like to hear from [Quiet Person] before we lock this."
      *Correction:* The user asked for a procedure *for themselves* to decide whether to speak. But they also asked "If the answer is dig in, tell me what the move actually is." So I need specific tactical moves that fit within existing meeting structures.

      *Refining the "Shut Up" case:* I need to make sure the user feels okay about Case 2. The procedure must validate that *not* speaking is a rational choice when your private signal is weak compared to the public signal of experts.

      *Refining the "Values" distinction:* This is key. If it's a values call (Cost vs. Care), consensus is the goal, not truth. If it's a fact (Infection rate), truth is the goal. The procedure must distinguish these.

  8.  **Final Polish:**
      *   Ensure the "Confidence Cascade" concept is integrated.
      *   Make sure the "Moves" are politically safe for a procurement person.
      *   Check the "Limitations" section to manage expectations.

      *(Final check of the prompt requirements)*:
      *   Short ordered list of questions? Yes.
      *   Answerable by non-expert in 1-2 mins? Yes.
      *   Clear stopping rules? Yes.
      *   Honest about judgment vs. tests? Yes.
      *   Handle Fact/Value/Coordination? Yes.
      *   Handle Private Straw Vote availability? Yes.
      *   Handle Tacit Knowledge? Yes.
      *   Run on 3 cases? Yes.
      *   Tell what it can't do? Yes.
      *   No papers? Yes.

      *Let's build the "Two-Minute Triage".*

      *Step 1: The Bucket.* (Fact, Value, Coordination).
      *Step 2: The Signal.* (Who spoke first? Data vs. Status).
      *Step 3: The Reversibility.* (Can we undo this?).
      *Step 4: The Tacit Check.* (Is the objection a gut feeling from an expert?).

      *Moves:*
      *   "Data Drop" (for facts).
      *   "The Trial" (for uncertainty).
      *   "The Trade-off Question" (for values).
      *   "The Silence Breaker" (for cascades).

      *Okay, ready to write.*
answer: |-
  Here is a procedure designed for your constraints: two minutes, no chair authority, mixed decision types, and high social pressure. It is not a magic wand, but it is a filter to separate "useful dissent" from "noise."

  ### The Two-Minute Triage

  Run these four questions in order. Stop at the first "Stopping Rule" you hit.

  **1. The Bucket Test**
  *   **Question:** If we are wrong about this, how will we know?
      *   **A:** The data will prove us wrong later (e.g., infection rates, repair tickets, inspection pass/fail). -> **Fact Bucket**
      *   **B:** There is no "wrong," only trade-offs (e.g., cheaper supply vs. staff comfort, speed vs. safety). -> **Value Bucket**
      *   **C:** It doesn't matter which we pick, as long as we all pick the same one (e.g., software platform, form color). -> **Coordination Bucket**
  *   **Stopping Rule:**
      *   If **Coordination**: **Defer.** Do not fight herd behavior here. Herding is the goal.
      *   If **Value**: Go to Question 2.
      *   If **Fact**: Go to Question 2.

  **2. The Independence Test**
  *   **Question:** Did the people agreeing have their reasons *before* the most senior person spoke?
      *   *Look for:* Did they nod immediately? Did they use the same phrases the senior person used? Did they look at the senior person before answering?
      *   *Look for:* Did anyone look at *you* or the data sheets before speaking?
  *   **Stopping Rule:**
      *   If **Yes (Independent)**: **Defer.** The convergence is likely real evidence.
      *   If **No (Dependent)**: Go to Question 3.

  **3. The Signal Strength Test**
  *   **Question:** Compare your private information against the room's public information.
      *   **Your Signal:** Is it hard data (spreadsheet), a specific observation ("I saw this break"), or a vague feeling ("I'm worried")?
      *   **Their Signal:** Is it hard data, specific experience, or just status ("Dr. X likes it")?
      *   *Note:* In a "Confidence Cascade," their signal is usually *mood*, not data.
  *   **Stopping Rule:**
      *   If **Your Signal is Weaker** (e.g., vague worry vs. six experts with specific experience): **Defer.** You are likely the noise. (See Case 2 below).
      *   If **Your Signal is Stronger or Equal** (e.g., you have repair logs, or you represent the silent floor staff): **Dig In.** Go to Question 4.

  **4. The Reversibility Test**
  *   **Question:** If we vote yes and are wrong, can we fix it without firing someone or losing accreditation?
      *   **Yes:** We can trial it, return it, or swap it later.
      *   **No:** This is a 5-year contract, a structural change, or a patient safety risk we can't undo.
  *   **Stopping Rule:**
      *   If **Reversible**: **Defer.** Let the mistake happen; it's cheaper than the meeting time.
      *   If **Irreversible**: **Escalate.** Use a "Move" (below).

  ---

  ### The Moves (If the Procedure says "Dig In")

  You are not the chair. You cannot demand a secret ballot. You must use procedural judo to slow the cascade without blocking the road.

  *   **Move 1: The Data Drop (For Fact Buckets)**
      *   *Say:* "I'm comfortable moving forward, but I have the repair logs from the last 18 months right here. They show a 15% failure rate on Model A. Can we agree to review that number before we sign?"
      *   *Why:* It shifts the argument from "I disagree with Dr. X" to "The spreadsheet disagrees with Dr. X."

  *   **Move 2: The Trial Run (For High Uncertainty)**
      *   *Say:* "Given the cost, can we commit to a 3-month pilot on one ward before hospital-wide rollout? If the data holds, we buy."
      *   *Why:* It lowers the stakes of the decision. It allows the "herd" to feel like they won (we are buying it) while protecting the hospital from a cascade error.

  *   **Move 3: The Silence Breaker (For Tacit Knowledge)**
      *   *Say:* "Before we lock this, I want to make sure we capture the floor perspective. [Name of quietest nurse], you're the one who has to use this at 3 AM. What's the one thing about this design that worries you?"
      *   *Why:* It forces private information into the public record. It validates tacit knowledge without requiring the nurse to fight the room.

  *   **Move 4: The Trade-Off Question (For Value Buckets)**
      *   *Say:* "Just to clarify the record: we are choosing the cheaper option knowing it adds 10 minutes to setup time. Is that the explicit trade we want?"
      *   *Why:* It forces the room to own the value judgment. Often, the cascade breaks when people realize they are agreeing to a specific burden they didn't notice.

  ---

  ### Honesty Check: What is a Test vs. Judgment?

  *   **Real Tests:** The **Bucket Test** (Fact vs. Value is usually clear) and the **Reversibility Test** (Contract terms are binary).
  *   **Judgment Wearing a Clipboard:** The **Independence Test** and **Signal Strength Test**. You are guessing at social dynamics. You might misread a nod as herding when it's genuine agreement. You might undervalue your "vague worry."
      *   *Mitigation:* If you are unsure on Question 2 or 3, default to **Move 2 (The Trial Run)**. It is the safest political cover.

  ---

  ### Running the Procedure on Your Three Cases

  **Case 1: The IV Pumps (Fact Bucket)**
  *   **1. Bucket:** Fact. (Failure rates will show up in data).
  *   **2. Independence:** Low. Everyone drifted toward the senior anesthesiologist.
  *   **3. Signal Strength:** **Yours is Stronger.** You have repair tickets (hard data); they have preference (soft signal).
  *   **4. Reversibility:** Low. 5-year lifespan, high cost, patient safety.
  *   **Verdict:** **Dig In.**
  *   **The Move:** **Move 1 (The Data Drop).**
  *   **Script:** "Dr. [Name] makes a strong case for the features. However, my procurement data shows Model A has failed 20% more often at our sites over the last year. Before we standardize, can we weigh the feature set against the maintenance cost?"
  *   **Outcome:** You introduce an independent variable (cost/reliability) that breaks the cascade of "Senior Doctor likes it."

  **Case 2: The Sterilization Wrap (Fact/Compliance Bucket)**
  *   **1. Bucket:** Fact/Compliance. (Inspectors will pass or fail).
  *   **2. Independence:** Unknown, but likely High. Six experts are relaxed.
  *   **3. Signal Strength:** **Yours is Weaker.** You have a "vague worry." They have "far more relevant experience."
  *   **4. Reversibility:** High. If you fail inspection, it's a crisis. But if you object and are wrong, you lose credibility.
  *   **Verdict:** **Defer (Shut Up).**
  *   **Why:** In a cascade, if your private signal is weak (vague worry) and the public signal is strong (6 experts + status), rational herding dictates you follow the herd. Your worry is likely anxiety, not data.
  *   **The Move:** None. Record the decision. If you must speak, use **Move 2**: "Can we keep a small stock of the old wrap for the first month as a backup?" (This protects you without blocking the decision).

  **Case 3: The OR Positioning Device (Tacit Knowledge/Fact Bucket)**
  *   **1. Bucket:** Fact/Safety. (Will it cause injury or workflow issues?).
  *   **2. Independence:** Low. Rest of room is enthusiastic (likely cascade).
  *   **3. Signal Strength:** **Mixed.** The group has enthusiasm (mood). The Nurse has "felt wrong" (tacit expert signal). Tacit knowledge from a practitioner is a *strong* signal in clinical contexts, often stronger than admin enthusiasm.
  *   **4. Reversibility:** Medium. Can cause injury, but can be stopped.
  *   **Verdict:** **Dig In.**
  *   **The Move:** **Move 3 (The Silence Breaker).**
  *   **Script:** "The clinical specs look good. But [Nurse Name] mentioned it feels off. In OR workflows, 'feel' usually predicts adoption problems. Can we unpack what feels wrong before we approve?"
  *   **Outcome:** You legitimize the gut feeling. If she says "The latch slips when wearing gloves," you have converted a vibe into a Fact Bucket problem.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Fix a Toxic Chair:** If the chair shuts you down when you present data (Case 1), this procedure won't save you. In that case, your only move is to email the data to the committee *after* the meeting with the subject line "For the record: Maintenance data regarding Item X."
  2.  **It Cannot Resolve Deep Value Conflicts:** If the doctors want the expensive toy and Finance says no, this isn't a cascade; it's a power struggle. The procedure will tell you it's a "Value Bucket," but it won't tell you who wins.
  3.  **It Will Not Stop You From Being "The No Person" If You Use It Wrong:**
      *   *Risk:* If you "Dig In" on every Value Bucket decision, you will be hated.
      *   *Fix:* Only Dig In on **Fact Buckets** with **Irreversible** consequences. Let the herd herd on the coordination and value stuff.
      *   *Rule of Thumb:* Object to *process* or *data*, never to *people*. "The data suggests..." not "You are ignoring..."
  4.  **It Cannot Detect "Hidden Agendas":** Sometimes people herd not because of confidence cascades, but because they have a side deal with a vendor. This procedure assumes good faith. If you suspect bad faith, you need a whistleblower channel, not a checklist.

  ### Final Advice for the "Two Minutes"

  Keep a physical copy of the **Bucket Test** on your notepad. When a new item comes up, write "F, V, or C" next to it immediately.

  If you mark **F (Fact)** and the room starts nodding before looking at the specs, you have your warning light. That is the moment to put your hand on your spreadsheet and wait for your turn to speak. You are not being difficult; you are being the only person doing the job the committee was formed to do.
