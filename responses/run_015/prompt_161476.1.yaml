      *   *Crucial distinction on the Dead Friend:* "Nobody suffered from afterwards." This makes it a victimless crime (morally speaking). Does a victimless bad deed require a witness? Yes, because it degrades the agent. You witnessed the degradation. To forget is to collude in the sanitization of moral reality.
