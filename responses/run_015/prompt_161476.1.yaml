      *   **Refining the "Dead Friend" advice:** Be careful. Is remembering a "duty" or a "choice"? If it burdens you, is it virtuous?
      *   *Pivot:* Maybe the duty is to *not sanitize* the past, but you don't need to actively rehearse it. Passive retention vs. active rumination.

