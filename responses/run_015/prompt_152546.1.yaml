  **Candidate 4: Dynamical Locality + Mediated Correlations (The Survivor)**
  *   *The Principle:*
      1.  **No Spacelike Action:** Physical influences must travel along continuous paths within light cones (timelike or null).
      2.  **No Brute Facts:** Correlations between distant events must be explained by a physical process (mediation), not just asserted as an initial condition or a global coincidence.
