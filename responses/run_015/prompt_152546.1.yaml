  2.  **No Coincidences:** You won't allow the universe to be 'pre-loaded' with correlations just to save the theory. That kills Superdeterminism. Saying 'the Big Bang made sure the knobs matched the particles' feels like cheating the explanation.

  **Retrocausality** is the only one left that pays both taxes. It doesn't jump across space (it goes through time), and it isn't a coincidence (it's a physical signal running backward).

  **The Test:** If I describe a model where the correlation isn't a signal running backward, but just a rule that 'the whole timeline has to fit together,' will you accept that?
