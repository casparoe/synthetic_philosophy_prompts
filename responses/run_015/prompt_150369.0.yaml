  Two mates, Josh (an ML grad student) and Simon (a philosophy sceptic), are standing outside The King's Head, finishing their pints.

  **Josh:** "I'm telling you, Hume's done. Wolpert buried him. The No-Free-Lunch theorem proves you can't generalize from data without making assumptions. It's mathematically impossible to justify induction without a bias."

  **Simon:** "Right. And what's the cost of this mathematical proof?"

  **Josh:** "No cost. It's a theorem. It holds across all possible target functions."

  **Simon:** "Ah. There's the rub. It only holds if you average uniformly over all possible target functions, yeah?"

  **Josh:** "Technically, yes. You assume every function is equally likely *a priori*."

  **Simon:** "So, to prove that inductive biases are unjustified, you've had to smuggle in a massive inductive bias of your own? You're assuming the universe is equally likely to be any function whatsoever."

  **Josh:** "It's a null prior. It's neutral."

  **Simon:** "It's not neutral, mate. It's a claim about the structure of possibility space. You're assuming maximal entropy is the default state of nature. That's exactly the kind of unjustified assumption Hume was on about. You've used an inductive leap to prove induction is shaky."

  **Josh:** *Stares into his empty glass.* "So I've begged the question?"

  **Simon:** "Worse. You've overfit the argument to the noise. You assumed uniformity to prove you can't assume uniformity."

  **Josh:** "Bloody hell. Pass me the menu."

  **Simon:** "Careful. You spelled 'embarrassing' with one 'r' in the group chat earlier. By your own logic, you can't inductively infer that you ought to spell it with two."

  **Josh:** "Shut up."

  **Simon:** "Just saying. No free lunch, not even on orthography."
