answer: |-
  Here is a complete design for your 90-minute session. It is built to be run with zero budget, using only paper, pens, and envelopes. It focuses entirely on the structural problem of the *argument* (your point #2) and forces the group to test the "Common Cause" objection themselves.

  ### Activity Title: The Three-Station Relay

  **Core Concept:** Participants simulate a human mind using three distinct roles. They will attempt to generate a truthful report about an "experience" without the experience being allowed to touch the "reporting" mechanism.

  **Materials Needed:**
  *   3 small envelopes per group (labeled A, B, C).
  *   Index cards or slips of paper (3 colors help, but white is fine).
  *   Pens.
  *   A whiteboard for the debrief.
  *   Printed "Role Sheets" (one per person, see below).
  *   Printed "Scenario Cards" (one set per group, see below).

  **Group Size:** 15–20 people.
  **Setup:** Arrange chairs in clusters of three. If you have 18 people, that's 6 groups. If you have leftovers, they act as "Auditors" who rotate between groups.

  ---

  ### Part 1: The Roles (5 Minutes)

  Do not mention consciousness, brains, or philosophy yet. Tell them they are testing a communication protocol.

  Assign each trio three roles. Give them a printed sheet defining their constraints.

  *   **Role 1: The Architect.**
      *   *Constraint:* You hold the Master Plan. You decide what happens. You cannot feel anything. You cannot speak out loud. You pass notes.
  *   **Role 2: The Witness.**
      *   *Constraint:* You are the only one who gets to "experience" something (a color, a shape, a number). You cannot speak. You cannot write. You cannot touch the Architect or the Scribe. You just sit and hold the experience.
  *   **Role 3: The Scribe.**
      *   *Constraint:* You must write a sentence on the whiteboard (or large paper) describing what the Witness is experiencing. You also must write *one reason* why you believe that sentence is true. You can only take information from the Architect.

  **The Golden Rule:** No talking. Only pass written notes through the Architect. The Witness and Scribe never exchange direct information.

  ---

  ### Part 2: The Rounds (45 Minutes)

  You will run three rounds. Each round represents a different theory of how the mind works. Hand out the **Scenario Cards** inside the Envelopes at the start of each round.

  #### Round 1: The Intuitive Model (10 Minutes)
  *Goal: Establish a baseline where things work.*
  *   **Envelope A Content:**
      *   **To Architect:** "Tell the Witness they are seeing RED. Tell the Scribe to write 'The Witness sees Red.' Tell the Scribe the reason is: 'The Witness told me.'"
      *   **To Witness:** "You are experiencing RED."
      *   **To Scribe:** (Wait for Architect's note).
  *   **Action:** The Architect passes notes. The Scribe writes the sentence and the reason.
  *   **Observation:** This feels normal. The information flows from Experience -> Report.

  #### Round 2: The Cut (Epiphenomenalism) (15 Minutes)
  *Goal: Simulate the feeling causing nothing.*
  *   **Envelope B Content:**
      *   **To Architect:** "Tell the Witness they are experiencing BLUE. Tell the Scribe to write 'The Witness sees Blue.' Tell the Scribe the reason is: 'My internal sensors detected a pattern.'"
      *   **To Witness:** "You are experiencing BLUE." **(Add instruction: You are not allowed to signal this to the Architect. You just sit with it.)**
      *   **To Scribe:** (Wait for Architect's note).
  *   **Action:** The Architect generates the report and the reason without input from the Witness. The Witness sits there holding "Blue" but does nothing.
  *   **Observation:** The report is accurate (Architect made it so), but the *reason* given by the Scribe makes no mention of the Witness. The Witness was inert.

  #### Round 3: The Common Cause (20 Minutes)
  *Goal: Test the "Two Clocks" objection.*
  *   **Envelope C Content:**
      *   **To Architect:** "You are the Common Cause. You must ensure the Witness and Scribe match without them talking. Hand the Witness a token that says GREEN. Hand the Scribe a card that says 'Write: The Witness sees Green. Reason: Because I am in State 4.'"
      *   **To Witness:** "Hold this token: GREEN. Do not show it to anyone."
      *   **To Scribe:** "Read this card. Write exactly what it says."
  *   **Action:** The Architect hands out matching instructions. The Scribe writes the report.
  *   **The Twist:** After they write, ask the Scribe to underline the word "Because" in their reason. Ask the Witness to hold up their token.
  *   **Question for the Group:** "The Scribe's statement is true. The Witness is indeed seeing Green. But look at the 'Because' clause. Does that reason point to the Witness, or to the Architect's State 4?"

  ---

  ### Part 3: The Debrief (35 Minutes)

  This is where you connect the game to the philosophy. Do not start lecturing. Ask questions based on what they just did.

  **Step 1: The Reveal (5 Minutes)**
  *   Tell them: "In this game, the **Architect** is the Physical Brain. The **Witness** is Consciousness (Qualia). The **Scribe** is your Speech and Reasoning."
  *   Write **EPIPHENOMENALISM** on the board. Explain it simply: "The theory that consciousness exists but doesn't cause anything physical."

  **Step 2: Mapping Problem #1 (The Report) (10 Minutes)**
  *   Ask: "In Round 2, the Witness did nothing. The Scribe still wrote the truth. How?"
  *   *Expected Answer:* "The Architect lied/made it up."
  *   *Point:* This is the weak objection. Of course a brain can say "I'm in pain" without pain (like a robot). This doesn't prove pain is useless, just that reports can be faked.
  *   *Transition:* "But what about when we aren't lying? What about Round 3?"

  **Step 3: Mapping Problem #2 (The Argument) (15 Minutes)**
  *   Focus on Round 3 (Common Cause).
  *   Ask the Scribes: "You wrote 'Because I am in State 4.' Did you write that because of the Witness?"
  *   *Answer:* No. The Architect gave you the card.
  *   Ask: "If the Witness's token had secretly been PURPLE, but the Architect still gave you the GREEN card, what would you have written?"
  *   *Answer:* "GREEN."
  *   Ask: "So is your sentence actually about the Witness's experience? Or is it about the Architect's state?"
  *   *The Verdict:* This is the "lump moving." The Common Cause objection saves the *accuracy* of the report (they match), but it severs the *reference*. Your words are tracking brain states, not feelings.
  *   *The Bite:* "If your words track brain states, then when you argue 'Consciousness is real,' you are actually arguing 'Brain State 4 is real.' You never successfully pointed at the feeling. The feeling never got to be a link in the chain of your reasoning."

  **Step 4: Closing (5 Minutes)**
  *   Ask: "Does this prove consciousness is inert? No. But it shows that if it *were* inert, we wouldn't notice the difference in our arguments. Our arguments would look exactly the same, but they would be about something else."
  *   End on the question: "If our reasoning is purely physical, what guarantees that our physical reasoning is capable of grasping non-physical truth?"

  ---

  ### Troubleshooting: What Will Break

  **1. The "Cheating" Witness**
  *   *Problem:* In Round 2 or 3, the Witness will try to cough, tap their foot, or wink to help the Scribe. They want the game to "work."
  *   *Fix:* Be the enforcer. "If the Witness makes a sound, the round is void. The Witness is a ghost. Ghosts don't tap."
  *   *Recovery:* If it happens, pause and ask: "Why did you do that? Because you feel like the experience *should* cause the report. That instinct is exactly what we are questioning."

  **2. The "So What?" Reaction**
  *   *Problem:* Someone says, "Okay, the Brain causes both. Who cares? It still matches."
  *   *Fix:* Use the "Purple Token" question from the debrief. If the match is accidental (coordinated by a third party), then the Scribe isn't talking about the Token. Ask: "Do you want your philosophical arguments to be about your brain chemistry or your actual experience?"

  **3. Confusion Over Roles**
  *   *Problem:* The Architect starts talking to the Scribe.
  *   *Fix:* Remind them: "Architect is a machine. Machines don't chat. They pass data." Keep it rigid. The rigidity creates the philosophical tension.

  ---

  ### Limitations: What This Activity Cannot Do

  You need to supply this verbally in the debrief.

  1.  **It cannot simulate Qualia:** The "Witness" player doesn't actually *feel* red. They just hold a card. You have to tell the group: "Imagine holding that card is like feeling pain. It's private, undeniable to you, but invisible to the room."
  2.  **It cannot prove Epiphenomenalism is True:** The activity only shows that *if* it were true, our arguments would look like Round 3. It doesn't prove the feeling *is* inert.
  3.  **It simplifies the Brain:** The "Architect" is a conscious person playing a role. In reality, the "Architect" (the brain) is unconscious. Remind them: "The scary part is, there is no little man inside the Architect. It's just gears turning."

  ---

  ### Ethical Note on Deception

  **Is this too much deception?**
  No. You are concealing the *destination*, not the *terrain*. You are not lying about the rules or manipulating their emotions. You are withholding the philosophical labels until the end to prevent premature intellectualizing.

  **The Reveal:**
  When you reveal the meaning in the Debrief, be explicit: "I didn't tell you this was about consciousness earlier because I wanted you to feel the frustration of the Scribe first, before you had a label for it."
  *   **Too much deception** would be telling them the results are scientifically proven or lying about the setup (e.g., rigging the envelopes so they *can't* match).
  *   **Acceptable deception** is calling it a "Communication Relay" instead of "The Mind-Body Problem."

  **Recovery if someone feels tricked:**
  If someone says, "I felt manipulated," validate them. "Good. That frustration is a tiny shadow of the philosophical problem. The Scribe was frustrated because they were cut off from the truth. That's the point."

  ---

  ### Summary of the "Verdict" on Common Cause

  You asked for a verdict, not a shrug. Here is the conclusion you guide them to:

  The Common Cause objection (Two Clocks) **saves the correlation but loses the meaning.**
  *   **Correlation:** Yes, the report matches the feeling.
  *   **Meaning:** No, the report is not *caused* by the feeling, so the words refer to the physical cause, not the feeling.
  *   **Result:** We are trapped in a physical description of the world that *looks* like it describes consciousness, but actually only describes brain states.

  This lands your Point #2: The reasoning itself is downstream of the physical machinery. The feeling is the topic, but never the tool.
