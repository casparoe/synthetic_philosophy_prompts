  The phenomenon you are describing occupies the ambiguous zone between **generalized reciprocity** (social gift-giving) and **transactional bribery** (explicit quid-pro-quo). While anthropologists may classify this under "gift economies" and legalists under "petty corruption," neither captures the specific *temporal* and *relational* mechanism you identified: the accumulation of obligation without immediate contingency.

  In political science and governance studies, the established concept that most precisely carves out this configuration is **Relational Corruption** (sometimes distinguished as **Relational Bribery**).

  This term is distinct from **Transactional Corruption** (the classic bribe: money for permit *now*) and distinct from broad **Clientelism** (which often implies organized political machines or vote-buying). Here is the conceptual carving:

  1.  **Vs. Ordinary Reciprocity:** Ordinary reciprocity occurs between social equals or within a kin network where power asymmetry is minimal. **Relational Corruption** is defined by the **public-office asymmetry**: one party holds state discretion, the other seeks access. The "gift" is not merely social; it is an investment in **preferential access** to public goods that should be universally distributed. The "insult" upon refusal stems from the collision of universalistic bureaucratic norms (impartiality) with particularistic social norms (obligation).
  2.  **Vs. Clientelism:** Traditional clientelism implies a **contingent contract** (votes for roads, loyalty for jobs) often organized by intermediaries. **Relational Corruption** is **diffuse and non-contractual**. There is no explicit promise of a specific future return. Instead, it operates on **standing social credit**: the gift purchases *responsiveness* or *priority* rather than a specific decision. It is micro-level and dyadic, not necessarily part of a macro-level political machine.
  3.  **Vs. Transactional Bribery:** Transactional bribery is episodic and explicit. **Relational Corruption** is **iterative and implicit**. The "corrupt" element is not a single act, but the **systematic blurring of public and private boundaries** over time, creating a debt of obligation that compromises impartiality without ever triggering a specific illegal transaction.

  While **Diffuse Clientelism** is the broader political science bucket, **Relational Corruption** is the sharper term used in governance and anti-corruption literature to highlight the *mechanism* (relationship-building) rather than the *political outcome* (votes). It captures the "investment" nature of the gifts and the "access" nature of the return.

  \answer{Relational Corruption}
