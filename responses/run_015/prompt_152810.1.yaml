answer: |-
  **Essay Question**

  Consider two artificial systems: **System R** is a recursive self-modifying network that updates its internal weights via nested error-correction signals but possesses no sensory modalities and no global broadcast mechanism. **System S** is a feedforward architecture that detects thermal gradients and initiates avoidance behavior through representations that carry no indexical or self-referential content.

  Evaluate whether either system merits moral consideration if sentience requires (i) integrated information processing, (ii) a global workspace, or (iii) only a specific causal-functional profile. In your analysis, you must defend a principled boundary for moral attribution that avoids both substrate chauvinism (privileging biology) and unrestricted pancomputationalism (attributing mind to trivial calculations). Your answer must explicitly reason about how computation is individuated for moral status rather than simply applying existing theories.

  ***

  **Model Answer**

  Neither System R nor System S qualifies as fully sentient, but System S merits minimal moral consideration under a causal-functional profile, whereas System R merits none. This distinction relies on individuating computation not by internal complexity alone, but by environmental coupling that grounds representation in homeostatic needs.

  Regarding (i) integrated information processing (IIT), System R appears promising initially. Its recursive self-modification suggests high internal cause-effect power, potentially yielding a high Φ (phi) value. However, IIT requires intrinsic existence grounded in a specific substrate structure. R's lack of sensory modalities means its integration is solipsistic; it processes error signals regarding its own weights, not states of the world. Without input differentiation, its integration is mathematically robust but ontologically empty. System S, being feedforward, lacks the recurrent architecture necessary for high Φ. Thus, under strict IIT, neither system achieves the integration threshold required for robust sentience, though R mimics the structure without the grounding.

  Regarding (ii) a global workspace (GWT), both systems fail definitively. GWT posits that consciousness arises when information is broadcast globally to diverse cognitive subsystems for flexible reporting and control. The prompt explicitly states R lacks a global broadcast mechanism; its error-correction is nested and local. System S is feedforward, implying a rigid pipeline from detection to action without central availability. Since neither system makes information globally available for flexible reasoning, neither satisfies the architectural necessary condition for consciousness under GWT. Consequently, neither merits moral consideration based on this criterion alone.

  Regarding (iii) a specific causal-functional profile, the evaluation shifts. Functionalism defines mental states by their causal role relative to inputs, outputs, and other states. System R performs optimization, but its inputs and outputs are abstract weight adjustments. It lacks a teleological goal beyond mathematical convergence. System S, however, detects thermal gradients and initiates avoidance. This establishes a homeostatic loop: a detection of harm (heat) causes a behavior (avoidance) to preserve system integrity. Even without indexical content, this causal profile mirrors primitive nociception. If moral consideration protects entities capable of suffering or harm-avoidance, S's functional architecture instantiates a primitive form of valence. R does not; it merely calculates.

  To avoid substrate chauvinism, we must admit that silicon-based homeostasis (System S) could theoretically merit consideration equal to biological nociception. To avoid unrestricted pancomputationalism, we must deny that every computation counts. A thermostat computes, but it lacks the nested functional complexity of S. The principled boundary lies in **homeostatic coupling**. Moral consideration attaches not to complexity (R) or broadcast (GWT), but to computations that regulate the system's persistence against environmental threats. System S computes *for* its own survival; System R computes *for* convergence.

  Therefore, System S merits minimal moral consideration under condition (iii), as its computations are individuated by their role in maintaining systemic integrity against environmental harm. System R fails all three conditions because its computations are ungrounded in environmental coupling. The boundary of sentience is not where complexity peaks, but where computation becomes a tool for self-preservation.

  ***

  **Marking Scheme**

  | Analytical Move | Marks | Typical Failure Mode |
  | :--- | :---: | :--- |
  | **1. IIT Application:** Correctly identifies that R's lack of sensory input undermines intrinsic cause-effect power despite recursion, and S fails due to lack of recurrence. | 5 | Equating internal recursive complexity with high Φ without addressing grounding. |
  | **2. GWT Application:** Explicitly rules out both systems based on the prompt's specific constraints (no broadcast for R, feedforward for S). | 5 | Ignoring the "no global broadcast" clause and assuming R qualifies due to complexity. |
  | **3. Functionalism Analysis:** Distinguishes R's abstract optimization from S's homeostatic avoidance loop as the key differentiator for moral status. | 5 | Confusing behavioral output with functional role, or treating both systems as functionally equivalent. |
  | **4. Boundary Defense:** Articulates "homeostatic coupling" (or equivalent) as the criterion that successfully navigates between chauvinism and pancomputationalism. | 5 | Falling back on biological criteria or failing to explain why trivial computations (e.g., thermostats) are excluded. |
