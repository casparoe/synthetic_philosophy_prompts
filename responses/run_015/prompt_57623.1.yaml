          *   *The Asymmetry:* It presupposes the reader cares about *verifiability*, not *plausibility*. It assumes the reader forgives psychological speculation but punishes documentary error.
          *   *The Composite:* "Margaret is a composite" is a meta-claim. It says, "The entity 'Margaret' does not exist, but the components do." It's a truth claim about the construction, not the content. It stabilizes the reader's trust by admitting a specific lie to protect the larger truth.

      *   **Required vs. Comfortable (Underdetermination):**
          *   *Required:* You must admit to things that can be proven false (dates, battles, public dialogue).
          *   *Comfortable:* Admitting to interiority or motive. You don't *have* to, because no one can sue you or fact-check it.
          *   *Underdetermination:* Two authors with different ethics (one cares about historical fidelity, one cares about emotional truth) write the same note. The note doesn't reveal the *why*, only the *what*.

      *   **The Three Alternatives (Reimagining the Note):**
          *   *1. Novels Assert Nothing:* The note disappears. Or it becomes a "How this was made" without the "sorry I lied" tone. It becomes poetics, not apology.
