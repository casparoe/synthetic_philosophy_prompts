answer: |-
  You have put your finger on the central hypocrisy of the historical novel's contract. The anxiety you're feeling three weeks out isn't writer's block; it's the friction of a mechanism grinding against its own premises. You are looking at the scaffolding and realizing it's holding up a building that claims to be solid ground.

  Here is the reconstruction of the practice, argued from the inside out.

  ### 1. The Theory of Truth: The Assertoric Model
  The confessional afterword presupposes that the historical novel is an **assertoric speech act**. It assumes the reader approaches the text believing it makes truth-claims about the world, and that the author is liable for those claims.

  By itemizing inventions, you are implicitly warranting the rest of the text. The logic is: *Everything you read here is historically accurate, except where I explicitly tell you it is not.* This rules out the rival account of fiction as **non-assertoric play**. If a novel were merely a structure of symbols, or an aesthetic object with no reference to reality (like a painting of a dragon), no disclaimer would be needed. You do not append a note to *Macbeth* explaining that Banquo's ghost wasn't real; the genre signals non-literalism. The historical novel, however, signals literalism. It claims to show the past *as it was*.

  This makes your publisher's boilerplate on your contemporary fiction logically incompatible.
  *   **Historical Note:** "This is true, except for X, Y, Z." (Premise: Reference is the default.)
  *   **Contemporary Disclaimer:** "This is false, even if it looks like X, Y, Z." (Premise: Invention is the default.)

  The publisher is not maintaining a philosophical stance; they are managing legal and reputational risk. In the historical book, the risk is being called a bad historian. In the contemporary book, the risk is being sued for libel. The two disclaimers run on incompatible premises about what a novel asserts. One says the book is a window; the other says it is a mirror. You are being asked to operate both simultaneously.

  ### 2. The Arbitrary Lines: Dialogue vs. Interiority
  You ask why you confess the dialogue but not the interior life. The line is drawn not at *importance*, but at **falsifiability**.

  *   **Dialogue:** There exists a category of evidence (letters, transcripts, memoirs) against which dialogue can be checked. If you put a specific sentence in a real person's mouth, and that sentence is recorded elsewhere as never having been spoken, you are empirically wrong. The confession protects you from the charge of incompetence.
  *   **Interiority:** There is no archive of consciousness. No one can prove what Margaret thought in 1860. Because it cannot be falsified, it does not need to be confessed.

  This asymmetry presupposes that the reader's primary anxiety is about **facts**, not **psychology**. It assumes the reader forgives the trespass of mind-reading because it is necessary for the genre to function, but will not forgive the trespass of record-keeping. It suggests the "wrong" in historical fiction is not violating the dead, but violating the *record* of the dead.

  The **composite character** disclosure is indeed stranger. When you write "Margaret is a composite," you are making a factual claim about the world (that two specific women existed and were merged) to disclaim a factual claim about the text (that this specific woman existed). It is a truth claim used to sanitize a falsehood. It stabilizes the reader's trust by admitting a specific lie to protect the larger truth of the narrative arc.

  ### 3. Required vs. Comfortable (Underdetermination)
  You suspect the practice is underdetermined. You are correct.

  *   **Strictly Required:** You must disclose inventions that contradict **public, verifiable records**. If the battle happened on Tuesday and you write Wednesday, you must confess. If the person died in 1860 and you have them meet someone in 1870, you must confess. The theory requires you to correct the record where the record is checkable.
  *   **Merely Comfortable:** Disclosing motive, emotional arc, or private meetings where no record exists. You do this not because the theory requires it, but because it creates a tone of candor. It makes you look honest without actually risking correction.

  Two quite different ethical accounts produce the identical afterword:
  1.  **The Historian's Ethic:** "I owe the past accuracy."
  2.  **The Storyteller's Ethic:** "I owe the reader coherence."
  Both result in "I moved the date of the riot." But the first says it to honor the dead; the second says it to prevent the reader from getting confused by a timeline discrepancy. The note cannot distinguish between these motives. It is a ritual form that accepts multiple theological justifications.

  ### 4. The Three Alternatives
  If we shift the underlying theory, your note changes radically.

  *   **Alternative A: Novels Assert Nothing.**
      *   *Theory:* Fiction is a game of make-believe. It makes no claims on reality.
      *   *The Note:* It disappears. Or, it becomes a "Sources and Inspirations" list, devoid of apologetic language. It would read: "The character of Margaret was inspired by the letters of X and the diary of Y." No "I made this up," just "This is where I looked." It treats the text as art, not a flawed history book.
  *   **Alternative B: Biographical Duty.**
      *   *Theory:* You owe the dead the same accuracy owed by a biographer.
      *   *The Note:* It becomes an apparatus. Every scene would need a footnote indicating the source. Interiority would be qualified: "Margaret's despair is inferred from her letter of Nov 4." Unsubstantiated invention would be barred entirely. The note would not be at the back; it would be on every page.
  *   **Alternative C: The Ethics of Ventriloquism.**
      *   *Theory:* The wrong is not falsity, but appropriation. Speaking for the dead without leave.
      *   *The Note:* It becomes an apology for presence, not error. "I have imposed a narrative on a life that may not have felt like one." It would acknowledge the power dynamic: "I am a living writer claiming authority over a dead subject." It would focus on the *act* of writing them, not the *facts* of their lives.

  ### 5. The Blunt Truth: The Permission Slip
  You asked for bluntness. Yes. The afterword is a permission slip.

  It is a ritual of purification that allows you to sin more freely elsewhere. By confessing to the invented dialogue (which the reader suspects anyway), you purchase moral credit to invent the interior life (which the reader cannot check).

  It functions as a **signal of good faith**. It tells the reader: *I am a responsible liar.* It manages the reader's anxiety so they can suspend disbelief without feeling stupid. If they catch you out on a date, they can point to your note and say, "Ah, she told us she was taking liberties." It disarms the critic.

  If you didn't have the note, every invention would be a potential betrayal. With the note, every invention is a sanctioned part of the game. It transforms the book from a "history that might be wrong" into a "collaboration between author and reader where we agree to pretend."

  ### Summary for your Draft
  You are three weeks out. You cannot change the genre's contract, but you can understand what you are signing.

  1.  **The Note is a Warranty:** It tells the reader the text is safe to trust as history, except where marked.
  2.  **The Inconsistency is Real:** Your publisher is selling you as a historian in one book and a fabulist in the other. Accept that this is a marketing strategy, not a philosophical stance.
  3.  **The Line is Falsifiability:** You confess what can be proven wrong. You hide what cannot.
  4.  **The Function is Immunity:** The note protects you from the charge of deception by admitting to fabrication.

  Write the note. Make it clear. Make it honest about the *craft* ("I needed a confidante for Margaret, so I merged two friends") rather than just the *facts*. Acknowledge the ventriloquism. If you admit that you are speaking for the dead, you mitigate the arrogance of claiming to know them.

  The note will not solve the metaphysical problem. But it will satisfy the convention. And three weeks from now, that will have to be enough.
