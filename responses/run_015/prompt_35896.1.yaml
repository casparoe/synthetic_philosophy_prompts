  2.  **Deconstruct the Coworker's Argument:**
      *   *Premise 1:* Probability of one vote deciding an election is near zero (Paradox of Voting).
      *   *Premise 2:* Therefore, consequentialist justification fails (like lottery tickets).
      *   *Premise 3:* Voting is expressive (like sports), not instrumental.
      *   *Conclusion 1:* No duty to vote; it's a hobby.
      *   *Premise 4 (Lesser Evil):* Voting for lesser evil makes you complicit in their evil; abstaining keeps hands clean.
      *   *Conclusion 2:* Rational move is abstain or third-party vote.

  3.  **Evaluate Philosophical/Political Science Consensus:**
      *   *Probability:* Technically true for large elections, but philosophers argue this ignores collective action problems. If everyone thought this, democracy collapses.
      *   *Expressive Voting:* Valid theory, but doesn't negate civic duty arguments (deontological or virtue ethics).
      *   *Duty to Vote:* Many philosophers (e.g., Brennan vs. Lomasky/Goodin) debate this. It's not settled that there's *no* duty.
      *   *Clean Hands/Complicity:* This is the weakest link. The "clean hands" objection is often criticized as moral self-indulgence. If abstaining ensures the greater evil wins, you are causally responsible for that outcome too (omission vs. commission).

  4.  **Drafting the Response (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          Tell him the math is right but the ethics are wrong. The probability of swinging an election is tiny, yes. But philosophers don't just look at consequences. There's a duty based on fairness or civic virtue. The expressive voting part is real political science, but doesn't prove there's no duty. The clean hands argument is the biggest flaw. If you don't vote and the bad guy wins, you helped him win by not stopping him. Complicity isn't just about what you do, but what you allow. So his conclusion doesn't follow.

      *   *Attempt 2 (Refining for Tone and Constraints):*
          Your coworker mixes valid math with shaky ethics. Here's the breakdown.
          **The Math:** He's right that one vote rarely decides elections (the "Paradox of Voting"). But philosophers reject the idea that moral duty depends solely on individual causal impact. If everyone stayed home, democracy dies. You have a duty to do your part in a collective project, even if your part isn't decisive.
          **Expressive Voting:** Political scientists agree people vote expressively. But expressing values doesn't preclude duty. You can have a duty to express solidarity or maintain institutions. Calling it a "hobby" ignores the social contract aspect.
          **Clean Hands:** This is his weakest point. The "clean hands" objection (voting for lesser evil makes you complicit) is widely criticized. Moral responsibility includes omissions. If abstaining ensures the greater evil wins, you are responsible for that harm too. Choosing not to mitigate harm when you can is rarely considered "clean."
          **Conclusion:** His "no duty" claim doesn't follow. Most ethicists argue for a duty based on fairness (free-riding on others' participation) or civic virtue, not just consequences.
          **Verdict:** He's sound on probability, stretched on expressive theory, and wrong on complicity. Tell him: "If clean hands matter more than outcomes, you're prioritizing your purity over actual harm reduction."

      *   *Attempt 3 (Checking Word Count and Polishing):*
          Need to ensure it hits the specific questions: "what's solid, stretched, wrong," "does conclusion follow," "clean hands hold up."

      *   *Drafting Final Version:*
          Your coworker mixes valid math with shaky ethics. Here's the lunch-ready breakdown.

          **What's Solid:** The math. The probability of a single vote deciding a national election is negligible. He's also right that "expressive voting" is a recognized political science theory; people do vote to signal identity.

          **What's Stretched:** The leap from "low impact" to "no duty." Most philosophers reject pure consequentialism here. Ethics often relies on *fairness* or *civic virtue*. If you benefit from democracy but refuse to participate because your individual impact is small, you're free-riding on those who do vote. Duty isn't always about being the decisive causal factor; it's about doing your share in a collective project.

          **What's Wrong:** The "clean hands" argument. This is the critical failure. He claims voting for the lesser evil makes you complicit, while abstaining keeps you innocent. Ethicists call this the "problem of dirty hands." Responsibility includes omissions. If staying home guarantees the greater evil wins, you are causally responsible for that outcome too. Choosing not to mitigate harm when you have the chance is rarely moral purity; it's often negligence. As philosopher Jason Brennan notes, even if voting is low-impact, voting *badly* (or refusing to prevent harm) can still be ethically significant.

          **Does the Conclusion Follow?** No. Even if voting is expressive and low-impact, a duty can exist based on solidarity or institutional maintenance. His premise that "duty requires decisive impact" is false.

          **The Clean Hands Rebuttal:** Tell him this: "If everyone followed your logic, the greater evil wins every time. If your hands are 'clean' but the outcome is catastrophic, you haven't avoided responsibility; you've just outsourced the harm while benefiting from the system."

          **Verdict:** He's sound on probability, stretched on expressive theory, and wrong on complicity. His argument prioritizes moral self-image over actual harm reduction.

