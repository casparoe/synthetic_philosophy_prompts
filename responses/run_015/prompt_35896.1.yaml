prompt: |-
  My coworker (total podcast guy, thinks he's a philosopher) gave me this whole speech about voting the other day and I want to know if he's actually right or just sounds right. Basically what he said was: the chance that your one vote decides anything is basically zero, so voting can't be justified by its consequences. And the philosophers who claim there's a duty to vote are secretly just multiplying a tiny probability by a huge payoff, which he says is like buying lottery tickets and calling it charity. Then he said political scientists have shown that people vote "expressively" — meaning since your vote doesn't matter anyway, you vote for whoever makes you feel good about yourself, like cheering for a sports team. So voting is basically a hobby, there's no duty to do it, and the whole "vote because people died for the right" thing is just guilt tripping.

  On top of that, when I asked about voting for the lesser evil he said: if you vote for the lesser evil you have still voted for evil. You're partly responsible for the bad stuff that candidate does, because you put them in office, whereas if you stay home your hands are clean. So he says the rational move is either stay home, or vote third party purely as an expression of your values, since either way nothing you do changes the outcome so you might as well feel good about it.

  I feel like some of this has to be right (the math part at least) but the whole package feels too convenient, like he's proving too much. Also something about the "clean hands" bit bugs me — if everyone followed it, the greater evil wins, so how are my hands clean? But maybe that's just me not liking his conclusion. He's read way more about this than me so I can't really argue.

  Can you go through his little speech bit by bit and tell me what's solid, what's stretched, and what's just wrong? Like, which parts would a philosopher who studies voting ethics actually accept, which are popularizer-level simplifications, and where is he sneaking something in? And specifically: does his "no duty to vote" conclusion follow from the parts he gets right, and does his clean-hands argument against lesser evil voting actually hold up? Please keep it to 450 words max, I want to be able to throw it back at him over lunch.
