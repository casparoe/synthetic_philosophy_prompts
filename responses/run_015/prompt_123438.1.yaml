answer: |-
  Bottom line: This is a verbal disagreement masking multiple substantive questions.

  The debate conflates distinct evaluative dimensions: instrumental utility, normative credit, and modal stability. When philosophers ask if knowledge is "better," they answer different questions using the same label. The "stuck" feeling arises because each camp solves one dimension while ignoring others, talking past one another. Progress requires disaggregation, not a unified theory. We must stop asking "Is knowledge better?" and instead ask "In which specific evaluative dimension does justification add value over luck?" Some contexts prize stability, others praiseworthiness. 

  Don't drop the question; dissolve the monolith. The Meno problem is actually three distinct problems wearing a trench coat. Recognizing this shifts the goal from finding a single 'value add' to mapping specific epistemic goods to specific human interests. That is the only way to move past the stalemate.
