      *   *Best Separator:* A revival with child speakers (like X) where the *community explicitly rejects* the continuity, calling it a "new creation" honoring the old.
      *   *Why:* If Dr. A says "Living/Same" despite community rejection, she prioritizes Vitality (Rule 1). If she says "New," she prioritizes Identity (Rule 5/6).
