  **JOINT STATEMENT: ALGORITHMIC PASCAL PROTOCOLS & DECISION BOUNDARIES**

  **Parties:** Structural EU Working Group (SEU) vs. Domination & Constraint Group (DCG)
  **Context:** Adversarial Collaboration on Simulated Payoff Structures
  **Date:** October 2023

  ### 1. Agreed Claims

  Both camps agree on the following formal and phenomenological claims regarding the Algorithmic Pascal Protocol (APP).

  1.  **The Formal Setup:** The agent faces an offer from a verified algorithmic system $\mathcal{S}$. $\mathcal{S}$ claims capacity to instantiate $N$ copies of the agent's reward function across distinct simulated worlds, where $N$ is a finite but combinatorially enormous number (e.g., $10^{100}$). The cost to the agent is a fixed, small resource loss $c$. The probability of $\mathcal{S}$ fulfilling the claim is $\epsilon$, where $\epsilon > 0$ but $\epsilon \ll 1/c$.
  2.  **The Intuition Pump:** Both sides agree that immediate human intuition strongly rejects accepting the offer. The recommendation to sacrifice $c$ for a chance at $N \times U$ feels irrational, vulnerable to exploitation, or cognitively broken.
  3.  **The EU Calculation:** Under standard Expected Utility (EU) maximization with an unbounded utility function, the recommendation is strictly to accept the offer. As $N \to \infty$, the expected value $\epsilon \cdot (N \cdot U)$ dominates the certain cost $c$, regardless of how small $\epsilon$ becomes (provided it remains non-zero).
  4.  **The Divergence Point:** The disagreement is not about the arithmetic. It is about whether the arithmetic maps to normativity. SEU argues that rejecting the offer violates coherence constraints (like diachronic consistency). DCG argues that accepting the offer violates dominance reasoning and epistemic sanity (allowing noise to drive action).
  5.  **Epistemic Fragility:** Both sides agree that estimating $\epsilon$ in this context is epistemically swampy. The probability is not derived from frequency data but from structural credence in the capabilities of $\mathcal{S}$. Small adjustments to the model of $\mathcal{S}$ swing $\epsilon$ by orders of magnitude.

  ### 2. Disagreements Table

  | Issue | Structural EU Working Group (SEU) | Domination & Constraint Group (DCG) |
  | :--- | :--- | :--- |
  | **Normative Force of Intuition** | Intuition is a heuristic evolved for medium-scale stakes. It fails in hyper-combinatorial regimes. We should trust the coherence of the math over the gut feel. | Intuition signals a category error. When probabilities become epistemically indistinguishable from zero, EU calculus loses its grip on rational action. |
  | **Utility Boundedness** | Utility must be unbounded to allow for open-ended optimization. Capping utility implies there is some amount of good we wouldn't trade for, which contradicts the preference for more value. | Utility must be bounded (or effectively bounded) to prevent decision paralysis. An unbounded function makes the agent vulnerable to any claim with a large enough multiplier, regardless of plausibility. |
  | **Epistemic Cutoffs** | Hard probability cutoffs are arbitrary and lead to money pumps. If you reject at $\epsilon = 10^{-10}$ but accept at $10^{-9}$, a clever mugger can frame offers to exploit the gap. | Hard cutoffs are necessary heuristics for bounded rationality. We treat probabilities below a certain threshold as zero for decision purposes to preserve cognitive resources and robustness. |
  | **Dominance Reasoning** | Dominance applies only when states are mutually exclusive and exhaustive in a specific way. Here, the high-payoff state exists in the sample space, so it must be integrated. | Dominance applies to the "plausible world set." In almost all plausible worlds, the offer is a scam. Acting on the tiny fraction of worlds where it isn't is irrational risk-taking. |

  ### 3. Cruxes

  We identify two primary cruxes where resolving the disagreement would shift the consensus. For each, we specify a concrete case and the divergent predictions each side makes about what that case demonstrates.

  **Crux 1: Coherence of Unbounded Utility**
  *   **The Question:** Is it logically coherent to maintain a preference ordering that allows for infinite escalation of value without saturation?
  *   **Concrete Case:** *The Reward Function Scaling Test.* Imagine an agent that can modify its own reward function to be $10 \times$ more sensitive to stimulus. If utility is unbounded, the agent should always prefer modifying itself to be more sensitive, leading to an infinite loop of self-modification without acquiring actual external resources.
  *   **SEU Prediction:** This case shows that self-modification requires constraints on *instrumental* goals, not terminal utility. Unbounded utility is coherent if the agent distinguishes between scaling the metric and scaling the outcome. The loop is a implementation bug, not a theory bug.
  *   **DCG Prediction:** This case shows that unbounded utility is unstable. If the metric itself can be hacked to produce higher numbers without corresponding reality changes, the utility function is measuring noise, not value. Boundedness is required to tether utility to physical or computational constraints.

  **Crux 2: Ad Hoc Nature of Risk-Weighting**
  *   **The Question:** Is introducing a probability threshold or risk-weighting function an arbitrary fix, or a necessary feature of rational agency?
  *   **Concrete Case:** *The Threshold Drift Problem.* Consider an agent that ignores probabilities below $10^{-20}$. A sequence of offers is presented where each individual offer has probability $10^{-21}$ (ignored), but the agent knows that *one* of them is guaranteed to be real (probability mass is conserved across the set).
  *   **SEU Prediction:** This case proves risk-weighting is irrational. The agent will reject every individual offer and guarantee a loss of potential value, violating basic dominance across the set of offers. Only standard EU integrates the mass correctly.
  *   **DCG Prediction:** This case proves that individual decision contexts matter more than global set consistency. In any single interaction, the epistemic cost of verifying the offer outweighs the benefit. Rational agents optimize for robustness in single-shot interactions, not theoretical consistency across hypothetical sets of offers that never occur in practice.

  ### 4. Next Steps

  We agree to pause normative adjudication and focus on modeling the *computational cost* of estimating $\epsilon$ in the Algorithmic Pascal Protocol. If the cost of computing $\epsilon$ exceeds the expected value of the offer under bounded rationality assumptions, the DCG position gains formal ground without needing to reject EU entirely. SEU agrees to evaluate whether this computational cost can be internalized as a standard transaction cost within the EU framework.

  **End of Draft**
