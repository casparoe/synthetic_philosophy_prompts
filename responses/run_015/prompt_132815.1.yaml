answer: |-
  Your observation is acutely perceptive and identifies a genuine lacuna in the current lexicon of translation studies. To answer your primary question directly: there is no single, canonical term in translation theory or comparative poetics that precisely isolates this phenomenon of **formal fidelity resulting in logical inversion**.

  While the mechanics of this process are well-documented anecdotally—particularly among translators of the *forme fixe* (the sonnet, the villanelle, the rondeau)—the theoretical vocabulary tends to categorise the outcome broadly as 'loss', 'distortion', or 'compromise'. Your specific configuration, wherein the preservation of prosodic constraints necessitates a syntactic rearrangement that inverts the propositional logic, occupies a blind spot between discussions of equivalence and discussions of constraint.

  Below, I outline the closest existing concepts, propose a method for delimiting the phenomenon, and suggest how you might distinguish it from adjacent categories of translational error or intervention.

  ### 1. Adjacent Concepts and Theoretical Proximity

  While no precise term exists, several theoretical frameworks approach the periphery of this problem:

  *   **Berman's 'Deforming Tendencies':** In *The Experience of the Foreign*, Antoine Berman outlines twelve 'deforming tendencies' inherent in translation. The closest fit is the 'destruction of linguistic patternings' or the 'destruction of the network of signification'. However, Berman typically argues that preserving the *letter* (form) at the expense of the *spirit* (meaning) leads to a dead text. He does not explicitly theorise the scenario where the preserved form actively generates a meaning contrary to the source.
  *   **Holmes's 'Form-Determined' Translation:** James Holmes, in 'The Name and Nature of Translation Studies', categorises translations where the form of the source is the primary determinant. Your phenomenon is a pathological edge-case of Holmes's 'form-determined' mapping, where the mapping is successful topologically (the shape holds) but fails semantically (the vector reverses).
  *   **The Oulipian Constraint:** In the poetics of constraint (Ouvroir de littérature potentielle), the constraint is generative. In your scenario, the constraint is degenerative. One might look to discussions of 'constraint failure' in Oulipian theory, though this is rarely applied to interlingual translation.
  *   **Performative Contradiction:** In philosophy of language, a performative contradiction occurs when the content of a proposition contradicts the act of asserting it. Your phenomenon is a **structural performative contradiction**: the translation asserts fidelity to the source's form while simultaneously enacting a betrayal of its logic.

  ### 2. Delimiting the Phenomenon

  Since a canonical term is absent, you are justified in coining or refining a designation. To distinguish this from plain mistranslation or deliberate adaptation, I propose delimiting the phenomenon via three necessary conditions, building upon your own criteria:

  1.  **Local Justifiability:** Every micro-decision (lexical choice, metrical foot, rhyme sound) must be defensible within the norms of the target language and the stated constraints of the translation project. This excludes simple incompetence or lexical ignorance.
  2.  **Structural Necessity:** The logical inversion must arise from the syntactic requirements of preserving the form (e.g., the need to place a rhyme word at the line-end forces a subordinate clause to the front, altering the emphasis from conditional to assertive). It is not an arbitrary change but a systemic consequence of the prosodic architecture.
  3.  **Global Reversal:** The cumulative effect of these locally justifiable choices must result in a macro-level argument that contradicts the source text's thesis.

  You might consider designating this **'Formal-Logical Inversion'** or **'Prosodic Reversal'**. However, given your use of 'misprision', you might refine this to **'Structural Misprision'**, provided you explicitly distinguish it from Harold Bloom's usage. For Bloom, misprision is a creative, intentional 'strong reading'. In your configuration, it is an unintentional, systemic artefact of formal mimicry.

  ### 3. Distinctions from Adjacent Categories

  To solidify this concept within your thesis, it is vital to demarcate it clearly from existing categories:

  *   **Vs. Mistranslation:** Ordinary mistranslation is typically lexical or grammatical ignorance (e.g., confusing *faux amis*). It is local and correctable without altering the form. Your phenomenon is systemic; correcting the logic would require breaking the form.
  *   **Vs. Macro-structural Distortion:** Distortion implies a warping or blurring of the original argument. Your phenomenon is more precise: it is an **inversion**. The argument is not merely blurred; it is negated. A distorted map is hard to read; an inverted map leads you in the opposite direction.
  *   **Vs. Domestication/Foreignisation (Venuti):** These terms describe the cultural orientation of the text. A translation can be highly 'foreignising' (retaining source syntax) or 'domesticating' (smoothing syntax) and still commit this error. Your phenomenon is orthogonal to Venuti's binary; it is a failure of **logical equivalence** masked by **formal equivalence**.
  *   **Vs. Intentional Hermeneutic Reinterpretation:** In adaptation or 'transcreation', the translator may intentionally shift the argument to suit a new context. This is an act of agency. Your phenomenon is often an act of **structural determinism**; the translator may believe they are being faithful, unaware that the prosodic machinery has reversed the logic.

  ### 4. Recommendation for Terminology

  If I may offer a suggestion for your specific vocabulary: given the emphasis on the interaction between the 'syllabic architecture' and the 'logical priority', the term **'Architectonic Reversal'** might serve you well. It conveys the structural nature of the error (architectonic) and the specific outcome (reversal).

  Alternatively, **'Constraint-Induced Semantic Inversion' (CISI)** provides a descriptive label that highlights the causal link between the formal constraint and the semantic outcome.

  ### Conclusion

  You are identifying a specific failure mode of 'formal equivalence'. In the absence of a pre-existing term, you are well-positioned to define it. By insisting on the criterion that **local choices remain defensible**, you successfully distinguish this from incompetence. By insisting on the **global argumentative reversal**, you distinguish it from mere nuance loss.

  This is a sophisticated contribution to the poetics of translation. It suggests that in formally constrained verse, fidelity to the vessel may occasionally sink the cargo. I would advise anchoring this definition early in your thesis, perhaps using the Marot example you cited as the paradigmatic case study, as it perfectly illustrates how the 'ton beau' (the beautiful form) can become the 'ton faux' (the false tone) through syntactic necessity.
