      *   **Section 2 (Why not the answer?):** Distinguish between "Free Will" (philosophical) and "Experimental Freedom" (methodological). Explain the threat to the scientific method (unfalsifiability). Address the time-reversed variant (Retrocausality) as a distinct but related category.
      *   **Section 3 (Bell's Conclusions):** Clarify the trilemma: Locality, Realism, Independence. You have to drop one. Standard QM drops Realism (or accepts Non-locality). The student's model drops Independence.
      *   **Advice for Seminar:** How to present this without looking like a crank. Emphasize that while logically valid, it's generally disfavored due to the "conspiracy" cost.

  7.  **Refine the Tone:**
      *   Keep it encouraging but rigorous.
      *   Avoid talking down.
