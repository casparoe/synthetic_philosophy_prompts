answer: |-
  You are correct that the naive definition collapses because any false theory entails infinitely many false consequences, rendering ordinal comparison impossible without measuring distance.

  **Procedure for Assessing Model Truth-Likeness**

  **1. Target Declaration**
  Before comparing models, the team must draft a 'Statement of Intended Correspondence'. This document specifies the target truth at a fixed grain. You must list the specific quantities (e.g. weekly incidence, reproduction number), the population (e.g. national, age-stratified), and the time window (e.g. epidemic season). Crucially, you must declare the resolution: are we assessing seasonal totals or weekly age-stratified incidence? Disagreements often arise because Model A aims at coarse burden while Model B aims at fine-grained transmission chains. This statement must be signed by the Senior Epidemiologist before analysis begins.

  **2. Structural vs. Numerical Audit**
  Separate the model into causal structure and parameter values. Structure refers to mechanisms (e.g. is asymptomatic transmission included? Is immunity waning?). Parameters refer to numerical rates (e.g. the speed of waning). Score structure binary: a mechanism is either present (1) or absent (0). Score parameters by deviation from the best available empirical estimate (e.g. serology or contact survey data), normalised as a percentage error. This prevents a model with lucky numbers but wrong mechanics from outranking a model with correct mechanics but calibrated poorly.

  **3. Comparison Rule**
  Calculate a Weighted Deviation Score (WDS) for each model.
  *WDS = (Structure Weight × Structure Score) + (Parameter Weight × Parameter Score)*.
  The weights are determined in Step 5. Model X is closer to the truth than Model Y if X has a lower WDS. However, if the difference in WDS is less than 5%, or if Model X wins on structure while Model Y wins on parameters with no agreed weight priority, the output must be 'These cannot be ranked'. Do not force a distinction where the evidence does not support one.

  **4. Sensitivity Check (Partition Stability)**
  To address language dependence (the risk that changing how we describe the world changes the ranking), re-run the comparison twice. First, aggregate the target variables one step coarser (e.g. weekly to monthly). Second, disaggregate one step finer (e.g. national to regional). If the ranking flips between coarse, target, and fine grains, flag the result as 'Unstable'. An unstable ranking indicates the truth-likeness claim is an artefact of vocabulary choice, not reality.

  **5. Judgment Flags and Sign-Off**
  Explicitly log where human judgment overrides rules. This includes: setting the Structure/Parameter weights; deciding which distinctions count as relevant mechanisms; and determining how much falsity in an irrelevant corner of the space is tolerable. These judgments must be recorded in a 'Judgement Log' with a rationale. The Senior Epidemiologist must sign off on the Log, accepting responsibility for the value choices embedded in the weights.

  **6. Utility Warning**
  Include a mandatory disclaimer: 'This procedure measures correspondence to specified states of the world, not predictive fit nor decision utility.' A model can be closer to the truth but useless for planning (e.g. too computationally heavy), or useful but false (e.g. a black-box fit). Do not let 'closer to the truth' quietly become 'fit last season's data best'. If the model with the lowest WDS does not match last season's surveillance data, note this divergence explicitly rather than adjusting the weights to fix it.

  ***

  **Application to Current Cases**

  **Case (i): Waning vs. Asymptomatic**
  Model A has the correct waning rate but omits asymptomatic transmission. Model B includes asymptomatic transmission but sets the rate badly wrong.
  *Target:* Secondary attack rates and long-term immunity profiles.
  *Audit:* Model A scores 0 on structure (missing mechanism); Model B scores 1. Model A scores 5% error on parameters; Model B scores 40%.
  *Comparison:* If Structure Weight is high (mechanism deemed critical for long-term behaviour), Model B wins despite poor parameters. If Parameter Weight is high (short-term prediction prioritised), Model A wins.
  *Outcome:* The team argues weights. The Judgement Log records that asymptomatic transmission is deemed structurally essential for endemic equilibrium. Model B is ranked closer to the truth, despite poor fit.
  *Warning:* Model A fit last season's data better because asymptomatic cases were unobserved. The procedure flags that Model A's fit is likely spurious.

  **Case (ii): Coarse Agreement, Fine Disagreement**
  Two models agree on seasonal peak size and timing but disagree on who infects whom (age-mixing matrices).
  *Target:* Weekly age-stratified incidence (Fine Grain).
  *Audit:* Both score 1 on coarse structure. On fine structure (age-mixing), Model C matches contact survey data; Model D assumes homogeneous mixing.
  *Comparison:* At coarse grain, they cannot be ranked (tie). At the declared fine grain, Model C has lower parameter error on age-specific incidence.
  *Sensitivity:* When aggregated to monthly totals (coarser), the ranking holds but the gap narrows. When split by region (finer), Model D fails completely.
  *Outcome:* Model C is ranked closer to the truth. The procedure forces the team to admit that for capacity planning based on total beds, the truth-likeness difference may not matter, but for targeted vaccination, it does.

  **Case (iii): The Favourite vs. The Rival**
  The team's favourite model (Model F) fit last year's surveillance data best and underpins current careers. The rival (Model R) has a more complex structure that fit poorly last year due to data noise.
  *Target:* Transmission chains and immunity duration.
  *Audit:* Model F uses a simplified immunity waning function (Structure 0) tuned to match case counts. Model R uses a biologically detailed waning function (Structure 1) derived from lab data.
  *Comparison:* Model F has lower parameter error against surveillance data. Model R has higher structure score and lower parameter error against lab data.
  *Judgment:* The Senior Epidemiologist must decide whether surveillance data or lab data represents the 'target truth'. If lab data is chosen as the ground truth for mechanism, Model F loses.
  *Outcome:* Unwelcome result. The procedure ranks Model R closer to the truth because Model F's fit was achieved via structural simplification that contradicts immunological evidence. Model F is flagged as 'Useful but False'. Funding recommendation must reflect this distinction.

  ***

  **Limitations of This Procedure**

  This procedure cannot determine which model will predict next season's outbreak most accurately. Truth-likeness is not the same as predictive validity; a true model fed with wrong initial conditions will fail, while a false model with tuned parameters may succeed. It cannot resolve metaphysical disputes about what the disease 'actually is' beyond the variables you choose to measure; if you omit a variable (e.g. environmental reservoir), the procedure cannot tell you that you are missing the whole picture. Finally, it cannot protect you from political pressure. If the Senior Epidemiologist refuses to sign off on a result that defunds the favourite model, the procedure exposes the conflict but does not solve it. It merely ensures that when you say 'this model is better', you are forced to specify whether you mean 'truer', 'more useful', or 'better fitted'.
