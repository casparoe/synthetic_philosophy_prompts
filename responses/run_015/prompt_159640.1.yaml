  **Recommendation:** Use a **pooled prize fund** rather than individual cash payments.
  *   **The Stake:** You contribute $100 (or equivalent value in high-quality books/chocolate/wine) to a "Prize Pool."
  *   **The Mechanism:** Points accumulated during the session are lottery tickets. At the end, the Prize Pool is distributed proportionally to the total points held by the group, *or* (more dramatically) the top three scorers split the pool.
  *   **Why:** Individual cash stakes of $5 feel trivial to retired professionals. A $100 pot creates a "common good" tension (if everyone loses points, the prize shrinks) and competitive scoring.
  *   **If it doesn't register:** If participants treat points as abstract, intervene at the halfway mark. Say: *"I should note that the points determine who takes home the [Wine/Books]. If you are indifferent to the points, you are indifferent to the prize. Please adjust your engagement accordingly."*
  *   **Necessity:** A real stake is necessary. Without it, "loss" is theoretical. With it, "loss" is a social and material embarrassment.

  ### Two: The Three Rounds

  **The Sequence (Identical for all rounds):**
  Participants start with **10 Points** and **Asset A**.
  1.  **Offer 1:** Swap Asset A for Asset B. **Cost: 1 Point.**
  2.  **Offer 2:** Swap Asset B for Asset C. **Cost: 1 Point.**
  3.  **Offer 3:** Swap Asset C for Asset A. **Cost: 1 Point.**

  **The Assets (Framing):**
  *   **Asset A:** "The Plan" (e.g., A voucher for a healthy meal next week).
  *   **Asset B:** "The Temptation" (e.g., A voucher for a gourmet meal tonight).
  *   **Asset C:** "The Remedy" (e.g., A voucher for a detox program tomorrow).
  *   *Note:* The physical cards just say Asset A, B, C. The *narrative* is spoken by you to trigger the preference shifts.

  **Round 1 (Blind):**
  *   **Info:** Participants know only the current offer. They do not know Offer 2 exists when taking Offer 1.
  *   **Expected Outcome:** Most will trade. They prefer B to A (Temptation > Plan), then C to B (Remedy > Guilt), then A to C (Plan > Remedy).
  *   **Result:** They end with Asset A and **7 Points**.
  *   **The Refuser:** A participant who refuses all trades ends with Asset A and **10 Points**. They are the "Control." They win.

  **Round 2 (Visible Schedule):**
  *   **Info:** Participants are given a sheet showing all three offers *before* Round 2 begins.
  *   **Expected Outcome:** Rational agents should refuse all trades, seeing the cycle.
  *   **Does the Pump Work?** No, not if they are instrumentally rational. If they trade, they are admitting to ignoring known future consequences.
  *   **Result:** Scores should stabilize at 10. If they drop, the participant is "diachronically irrational" (knowing the trap and walking in anyway).

  **Round 3 (Binding Commitment):**
  *   **Info:** Schedule visible.
  *   **Rule:** Before Offer 1, participants may sign a "Ulysses Contract." If signed, they are *physically prevented* from trading (you collect their cards).
  *   **Expected Outcome:** Those who feel vulnerable will bind. Those who trust their willpower will not.
  *   **Result:** Binders score 10. Non-binders who trade score 7.
  *   **Handling the Refuser:** The participant who refused in Round 1 is your star witness. In the debrief, ask them: *"You didn't know the sequence. Why did you refuse?"* Their answer (e.g., "I dislike fees," "I suspected a trap") reveals intuitive rationality. Do not penalize them; highlight them as the "Steady State."

  ### Three: The Two Reversals

  You requested one "Genuine Change" and one "Nearness" reversal. Since the *Sequence* must remain identical (Req 2), you will vary the **Narrative Framing** between Round 1 and the Debrief.

  1.  **Nearness (Hyperbolic Discounting):** In Round 1, frame the assets as **Time-Sensitive**.
      *   *A:* Reward in 30 Days.
      *   *B:* Reward Today.
      *   *C:* Reward in 30 Days (Larger).
      *   *The Trap:* They trade A for B (Impatience), then B for C (Greed), then C for A (Confusion/Reset). The loss comes from preferring "Now" over "Later" inconsistently.
  2.  **Genuine Change (The Wine):** In the Debrief, describe a *different* sequence that *looks* the same but isn't a pump.
      *   *Scenario:* You hold Wine 2010. Offer: Swap for Wine 2015 (Cost 1). Offer: Swap for Cash (Cost 1).
      *   *Distinction:* Here, the object *improved* (2010 -> 2015). Preferring the 2015 is not a inconsistency; it's learning.
      *   **Activity Integration:** To make them *feel* this, include a **"Golden Ticket"** in 3 of the envelopes at random in Round 1.
      *   *Rule:* If you hold Asset B and it is a Golden Ticket, its value *doubles* objectively before Offer 2.
      *   *Lesson:* If they trade away the Golden Ticket (Asset B) because of "Temptation," they lose objective value. This simulates the "Wine" case where holding is rational, but instability causes loss.

  ### Four: The Beneficial Cycle

  **The "Speculator's Round" (Modification of Round 3):**
  *   **Instruction:** Tell the group: *"In this round, the market is volatile. The external value of Asset B will double during the sequence."*
  *   **Mechanism:** If they trade A -> B, they gain 5 bonus points *if they hold B at the end of the round*.
  *   **The Trap:** To get the bonus, they must trade. But the sequence forces them to trade B -> C -> A.
  *   **The Win:** If they trade A -> B, then *refuse* further trades (violating the sequence logic but exploiting the instability), they end with Asset B + Bonus.
  *   **Lesson:** Instability (changing your mind) is only fatal if the environment is static. If the world changes with you, flexibility is an asset. This satisfies your suspicion that not every cycle is a liability.

  ### Five: The Debrief

  **Order of Questions:**
  1.  **The Local View:** *"In Round 1, at the moment you made Trade 1, did it feel like a mistake?"* (Establishes local rationality).
  2.  **The Global View:** *"Look at your final score. Is it lower than your starting score?"* (Establishes global loss).
  3.  **The Control:** *"Who refused every trade? You have the highest score. Did you know something the others didn't, or did you just value 'not trading' higher?"*
  4.  **The Binding:** *"In Round 3, who signed the contract? Did it feel like a loss of freedom or a gain of power?"*
  5.  **The Philosophy:** *"If you knew the sequence in Round 2 and still traded, were you irrational? Or just weak?"*

  ### Six: What Will Go Wrong (Troubleshooting)

  1.  **The Principled Refuser:** They refuse to play the game.
      *   *Response:* "You are the Control Group. We need you. Please record your score as '10' and observe the others."
  2.  **The Apathetic:** They don't care about points.
      *   *Response:* Remind them of the Prize Pool. If they remain apathetic, ask them to sit out the scoring and act as "Auditors" to watch for rule-breaking.
  3.  **The Spoiler:** They figure out the pump in Round 1 and shout it out.
      *   *Response:* "Thank you. Please write down your theory but do not share it until the Debrief. We need to see if others feel the pull of the trade."
  4.  **The Rule Breaker:** They try to bind in Round 1.
      *   *Response:* "That move is not available in this round. You must decide in the moment."
  5.  **Contamination:** Round 2 is ruined because they learned from Round 1.
      *   *Response:* This is not a defect; it is the data. The learning *is* the rationality. Ask: *"Why did Round 2 differ from Round 1? Did your preferences change, or did your information change?"*

  ### Seven: Limitations (For Your Discussion)

  You must supply this context, as the game cannot show it:
  1.  **Irrationality vs. Imprudence:** The game shows you lose points. It does not prove you are *irrational*. You might simply value the *experience* of the trade (the thrill of the swap) more than the points.
  2.  **The Self:** The argument assumes "You" at Time 1 and "You" at Time 2 are the same agent. If they are different people (e.g., Sober You vs. Drunk You), the pump is just exploitation of one self by another, not a logical failure.
  3.  **Genuine Change:** The game simulates *caprice*. It does not fully capture *growth*. If I prefer Wine at 60 because my palate improved, that is not a money pump, even if my preferences changed.

