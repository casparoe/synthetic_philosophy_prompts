  ### Complete Session Plan

  **Materials:**
  *   18 Envelopes (labeled 1-18).
  *   Inside each: 1 Record Sheet, 3 Asset Cards (A, B, C), 1 Pencil.
  *   1 Bag of 200 Counters (Points).
  *   3 "Golden Ticket" stickers (for Req 3/4 variant).
  *   Prize Pool (visible on table).

  **The Offer Sequence (Printed on a Master Sheet for you):**
  *   **Start:** Hold Asset A. 10 Points.
  *   **Offer 1:** Swap A for B. Pay 1 Point.
  *   **Offer 2:** Swap B for C. Pay 1 Point.
  *   **Offer 3:** Swap C for A. Pay 1 Point.

  **Minute-by-Minute:**

  *   **00-10: Introduction.**
      *   Welcome. Explain the Prize Pool.
      *   Distribute Envelopes.
      *   **Crucial:** Tell them *"This is a decision experiment. There are no right answers, only outcomes. Do not discuss your choices with neighbors."*
  *   **10-30: Round 1 (Blind).**
      *   Announce Offer 1. Give 2 mins to decide. Collect fees/swap cards.
      *   Announce Offer 2. Give 2 mins.
      *   Announce Offer 3. Give 2 mins.
      *   **Tally:** Participants count remaining points. (Expect 7 for traders, 10 for refusers).
  *   **30-50: Round 2 (Visible).**
      *   Hand out the "Schedule Sheet" showing all 3 offers.
      *   Run the sequence again (reset points to 10).
      *   Observe who trades despite knowing the schedule.
  *   **50-70: Round 3 (Binding).**
      *   Hand out "Commitment Forms."
      *   Allow 5 mins for signing.
      *   Run sequence. Enforce bindings (collect cards of signers).
      *   **Variant:** For 3 random participants, apply the "Golden Ticket" rule (Asset B doubles in value). Ask them afterwards if they regretted trading it away.
  *   **70-85: Debrief.**
      *   Ask the 5 questions listed in Section Five.
      *   Map their feelings to the "Money Pump" argument.
  *   **85-90: Conclusion.**
      *   Distribute Prize Pool based on final cumulative scores.
      *   Deliver the "Fallback Statement" (below) if discussion stalls.

  **Record Sheet (for Participants):**
  ```text
  ROUND 1 (Blind)
  Start: 10 Points | Asset: A
  Trade 1? (Y/N) ___  Points Remaining: ___  Asset: ___
  Trade 2? (Y/N) ___  Points Remaining: ___  Asset: ___
  Trade 3? (Y/N) ___  Points Remaining: ___  Asset: ___
  FINAL SCORE: ___

  ROUND 2 (Visible)
  [Same Structure]

  ROUND 3 (Binding)
  Did you sign a commitment? (Y/N) ___
  FINAL SCORE: ___
  ```

  **Fallback Statement (If the activity collapses):**
  *"We tried to simulate a 'Money Pump.' The argument is this: If your preferences reverse as time passes—for example, if you prefer A to B today, but B to A tomorrow—an exploiter can offer you a series of trades. Each trade looks like an improvement in the moment. But the sequence cycles you back to where you started, minus the fees. You end up worse off than if you had done nothing. The question is not whether you lost points today, but whether a rational agent is permitted to have preferences that change in a way that allows this to happen."*
