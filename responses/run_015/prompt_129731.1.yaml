answer: |-
  **Setting:** *The Grind Coffee House, just across from the philosophy building. It's 4:30 PM on a Tuesday. Empty mugs and a scattered pile of printouts sit between them.*

  **Len:** Look, I'm not saying Sinnott-Armstrong is right about everything. But you're glossing over the metaphysics of the harm. If we're talking about linear harm chains—CO2 goes up, temperature goes up, ice melts—my burger is a redundant droplet. It's overdetermined. Whether I eat it or not, the threshold for the next disaster event gets crossed anyway. That's the inefficacy objection in its strongest form. It's not about apathy; it's about causal impotence.

  **Priya:** I'm not glossing over it, I'm rejecting the model. You're treating the climate system like a bucket being filled by separate cups of water. That's linear harm chains. But the economy isn't a bucket; it's a set of feedbacked loops. When you skip a flight, you aren't just removing one droplet. You're altering the demand signal that airlines use for forecasting.

  **Len:** But does *your* specific signal alter the forecast? Airlines look at aggregate data. They don't cancel a route because Priya stays home. They cancel it because demand drops below a structural threshold. So again, you're back to thresholds. If you don't trigger the threshold, haven't you just participated in a structure without actually changing it?

  **Priya:** That's where the distinction matters. In a linear chain, causation is binary—did you break the straw? In a feedback loop, causation is parametric. My choice shifts the parameters of the system even if it doesn't snap the beam. Think about agricultural subsidies. If a chunk of consumers shift away from beef, even gradually, it changes the risk calculation for lobbyists and legislators regarding subsidy renewals. It's not that I caused the subsidy cut. It's that I shifted the probability distribution of the policy outcome.

  **Len:** Okay, but hold on. This smells like you're smuggling collective-level causation past methodological individualism. You're describing a system property—the market demand curve—and attributing it to the individual agent. If the system only responds to mass shifts, then the causal power resides in the collective, not in you. By saying "my choice shifts the parameter," aren't you just claiming a fraction of the collective's power without admitting it?

  **Priya:** No, because the collective *is* just individuals making choices within a structure. I'm not claiming I have the power of the collective. I'm claiming my action has a different *kind* of efficacy than the "droplet" model allows. In a loop, the output feeds back into the input. My choice is an input that modifies the sensitivity of the system for the next round of choices. It's about structural participation. If I opt out, I'm withdrawing legitimacy from the loop, not just subtracting mass.

  **Len:** Withdrawing legitimacy is symbolic. We're talking about harm. If the cow gets killed anyway because the supply chain is rigid—which Nefsky argues it is—then your participation is purely expressive. And look, I'll concede this: collective action is definateley different. If we organize a boycott that *does* hit the threshold, that's real causation. But individual choice in isolation? I worry you're conflating "being part of a cause" with "making a difference to the outcome."

  **Priya:** I concede the direct causal impotence on the temperature outcome. My skipping a flight won't measurably lower global temp by 2100. But that's the wrong metric. The metric is whether I'm reinforcing a high-carbon equilibrium or helping destabilize it. If everyone reasons like you—wait for the collective threshold before acting—the loop never shifts. The inefficacy objection assumes the structure is static. It isn't.

  **Len:** But if the structure only shifts when *enough* people act, then the moral obligation binds the collective, not me qua individual. You're putting the burden of structural change on individual shoulders because the collective action problem is too hard to solve. That's... I don't know, it feels like a category error. You're asking individuals to solve coordination problems through consumption.

  **Priya:** I'm asking them to stop jamming the gears. It's not about solving the coordination problem alone. It's about not being the friction that prevents the solution. But fine, maybe we're talking past each other on the metaphysics. You want a counterfactual where my action changes the outcome. I'm saying the counterfactual is about the system's trajectory, not the immediate endpoint.

  **Len:** Maybe. But until you can show me how my single choice isn't just a redundant droplet in a flooded river, I'm sticking with the inefficacy line. Even if the river is looping.

  **Priya:** *[laughs]* Fine. Drink your coffee. But don't order the beef wrap. Just in case you shift the paramaters.

  **Len:** Don't push it.
