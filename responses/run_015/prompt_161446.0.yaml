answer: |-
  **He Says the Math Is Already Done**
  He talks about the deworming charity with randomised-trial numbers, explaining how it buys way more health per pound than his marginal year of epi would. He says if he hadn't taken the desk someone else would have, so the trading is baked into the world either way, and the only variable is where the profit ends up. He looks tired but convinced, like he's solved a proof that everyone else is ignoring out of sentiment, treating the market like a force of nature rather than a choice.

  **I Say the Ledger Ignores the Rules**
  I tell him replaceability cuts both ways, that the ledger only shows harms you can count while ignoring the corrosion of trusting the system itself. I argue that a thousand people each quietly taking a lucrative job isn't a way to change any of the rules that make the money flow, it just makes the extraction more efficient. He listens, nodding, but I can tell he thinks I'm talking about purity while he's talking about volume, and neither of us is moving the other.

  **The Spreadsheet Opens to a Green Bottom Line**
  We sit at his kitchen table and the spreadsheet actually gets opened, the net comes out positive, rows of lives saved outweighing the abstract market friction. It settles nothing — he causes that harm and he does that good, and net isn't the same as fine. He points to the sum, but I'm looking at the individual cells, knowing that you can't offset a specific poison with a generic antidote and call it clean.

  **The Donors Vote by Weight of Wallet**
  I visit the donor circle where your say over the whole pot scales with how much you put in. His salary is buying agenda-setting and not just pills, determining which problems are worth solving based on who wrote the biggest check. They talk about leverage and cause areas like they're picking stocks, and I realize the money doesn't just buy outcomes, it buys the right to decide which outcomes matter.

  **The Office Is Quiet and Mostly Beige**
  I go to his office in London and the traders are boring and decent, wearing soft jumpers and eating salads at their desks. His job is abstract and victimless-looking, lines of code moving numbers between servers without a face to attach to the loss. No one looks like a villain, and no one looks like a hero, and I leave without knowing if the silence is peace or just the sound of the machine running smoothly.
