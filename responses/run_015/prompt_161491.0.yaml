answer: |-
  **MEMORANDUM**

  **TO:** Internal Safety Review Board
  **FROM:** Planning Team, Safety Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Policy Recommendation: Cost Function Constraints for Unavoidable Collisions

  **Purpose**
  We must finalize the objective function constraints for unavoidable collision scenarios before the next release. The board is divided between minimizing expected harm (utilitarian) and enforcing hard moral constraints (deontological/Doctrine of Double Effect). This memo maps those positions to our engineering reality and recommends a hybrid policy.

  **1. Engineering "Intention"**
  The Doctrine of Double Effect (DDE) hinges on *intent* (intended means vs. foreseen side effects). Our planner is a learned policy; it has no intent. The "intent" resides solely in how we weight the cost function.
  *   **Utilitarian Approach:** We assign cost proportional to expected injury. Swerving is neutral; only the outcome matters.
  *   **Constraint Approach:** We assign infinite cost to specific actions (e.g., crossing a sidewalk boundary). This encodes "intent" to avoid violating rights, even if the outcome is worse.
  *   **Verdict:** DDE is applicable only insofar as we hard-code constraints. If we rely purely on weighted optimization, we are purely utilitarian.

  **2. Case Analysis**
  *   **Case A (Jaywalker vs. Sidewalk):** *Same harm, different location.*
      *   **Utilitarian:** Indifferent. One death either way.
      *   **DDE:** Distinguishes sharply. Hitting the jaywalker is a foreseen side effect of braking/standing course. Swerving onto the sidewalk *uses* the safe pedestrian as a means to absorb impact.
      *   **Engineering Map:** A hard constraint on "leaving drivable area" satisfies DDE here.
  *   **Case B (Passenger vs. Two Kids):** *Sacrifice passenger to save more.*
      *   **Utilitarian:** Swerve. 1 life < 2 lives.
      *   **DDE/Constraint:** Do not swerve. We have a special obligation to the passenger; sacrificing them treats them as a means to save others.
      *   **Engineering Map:** This requires a weight asymmetry where $Risk_{passenger} \gg Risk_{pedestrian}$.

  **3. The Case for Harm Minimization**
  The minimization camp argues that hard constraints increase total societal harm. If a hard constraint prevents a swerve that would save two lives, the constraint is morally costly in aggregate. Furthermore, the "never sacrifice passenger" rule is often less about ethics and more about market viability and liability. No one buys a car programmed to kill them, and regulators may not certify a vehicle that explicitly devalues its occupant. We must acknowledge that "passenger priority" may be a business requirement dressed as moral philosophy.

  **4. Framework Silence: Uncertainty and Ties**
  Neither framework handles probabilistic uncertainty well.
  *   **Confidence:** If the planner is 60% confident a swerve saves two kids, do we act? DDE assumes certainty of intent; Utilitarianism assumes certainty of outcome.
  *   **Near-Ties:** If expected harm is equal within the margin of error, the system needs a deterministic tie-breaker to avoid oscillation, which neither moral framework provides.

  **5. Recommendation**
  Adopt a **Constrained Utilitarian** policy:
  1.  **Hard Constraints (DDE Alignment):** Implement infinite cost penalties for leaving the drivable road surface (sidewalks, medians). This respects the "safe space" distinction in Case A without requiring complex intent modeling.
  2.  **Weighted Minimization (Within Road):** Within the drivable area, minimize expected harm across all parties.
  3.  **Passenger Weighting:** Apply a significant weighting multiplier to passenger safety ($w_{passenger} > w_{pedestrian}$). Document this explicitly as a **market and regulatory constraint**, not a moral assertion of superior worth.
  4.  **Uncertainty Thresholds:** Define a confidence floor (e.g., 80%) for any trajectory that increases risk to one party to save another. Below this threshold, default to minimum change in trajectory (braking).

  This approach satisfies the DDE concern regarding sidewalks, acknowledges the market reality of passenger safety, and retains harm minimization where no clear rights violations exist.
