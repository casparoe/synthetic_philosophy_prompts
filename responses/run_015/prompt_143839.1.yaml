answer: |-
  **Scenario**

  The model, "LogPredict-7B," was trained exclusively on twenty years of text-based maintenance logs—strings like *Signal failure at Central* or *Delay between Union and Oak*. It received no coordinates, no schematics, and no graph data. The junior researcher, Elara, ran a linear probe on the station embeddings using only the text corpus, then compared the resulting vector distances to the official transit graph *after* the fact. The correlation was near-perfect: the internal geometry mirrored the physical topology. However, when the senior engineer, Marcus, ablated that specific subspace—zeroing the dimensions carrying the topological signal—the model's loss on next-token prediction did not rise. The map was there, encoded in the weights, but the readout head ignored it, relying instead on surface-level token co-occurrence. The structure existed as a redundant shadow, isomorphic to the subway but causally inert regarding the model's actual outputs. The auditor, David, watched the metrics flatline during the ablation. The question was not whether the structure existed, but whether its existence counted as representation given its idleness.

  **Dialogue**

  Elara: "The vector arithmetic holds. 'Central' minus 'North' equals the same displacement as 'Oak' minus 'South.' It knows the graph."

  Marcus: "It knows nothing. I killed that signal and the loss didn't blink. It's a ghost, not a gear."

  Elara: "But the isomorphism is exact. The relations are preserved."

  Marcus: "Correlation isn't representation. If it doesn't drive the output, it's just noise that looks like a map."

  David: "Does it help us predict failures?"

  Elara: "Yes. We can probe it to find structural blind spots."

  Marcus: "But you can't say the model *uses* the map to write the logs."

  David: "So it represents the map for auditing, but not for mechanism?"

  Elara: "It's a map either way."

  Marcus: "Only if you ignore what 'map' means for a machine."

  ***

  **Analysis**

  **Verdicts and Driving Features**
  *   **(A) Causal-Historical:** **No.** The driving feature is **causal inertness**. Because ablation proves the state does not influence the output and the training process did not select for *that* specific state (only for loss reduction, which was achieved via other features), the state lacks the requisite causal history.
  *   **(B) Structural:** **Yes.** The driving feature is **isomorphism**. The internal vector relations mirror the external graph relations systematically and precisely, satisfying the condition that representation requires structural mirroring regardless of utility.
  *   **(C) Instrumental:** **Mixed (Yes for Auditing, No for Explanation).** The driving feature is **purpose-relativity**. Attributing map-content helps the auditor probe for structural biases (Yes), but misleads the engineer trying to explain the token prediction mechanism (No).

  **Collapsing Feature**
  The disagreement collapses if the **ablation result** changes. If zeroing the subspace causes a significant increase in prediction loss (making the state causally active):
  *   (A) shifts to **Yes** (the state was selected for).
  *   (C) shifts to **Yes for Explanation** (the state is now mechanistically relevant).
  *   (B) remains **Yes**.
  *   *Incremental Change:* If the gate is opened slightly (small loss increase), (A) remains skeptical until a threshold is met, while (C) gradually shifts toward "Yes for Explanation" as the utility of the attribution for mechanism grows. If the model is fine-tuned on geographical data, (A) becomes definitively Yes, as the causal history now explicitly includes the map.

  **Attack and Defense**
  A defender of **(A)** (the Engineer) would attack the case by arguing that **isomorphism is trivial** in high-dimensional spaces (the "any smooth state space" retort). They would claim that with enough dimensions, one can always find a projection that matches any external structure by chance.
  *   *Survival:* The case survives because the scenario specifies the **procedure was pre-registered** (probe trained on text, compared to map later) and supports **out-of-sample predictions** (e.g., predicting which transfer is short). This rules out post-hoc gerrymandering. The structural match is predictive, not just descriptive.

  **Verbal vs. Substantive**
  The dispute is **substantive**. It is not merely about the definition of the word "representation," but about the **nature of the model's internal architecture**. The characters agree on the empirical facts (the isomorphism exists; the ablation does nothing); they disagree on which facts matter for attribution. However, no single observation settles it universally because "representation" is a theoretical construct. The observation that would settle it *for a specific account* is the ablation test (for A and C) or the isomorphism test (for B).

  **Auditor's Report**
  David should write: "The model encodes topological structure within its latent space with high fidelity, but this structure is functionally redundant for next-token prediction. Claims that the model 'knows' the map are justified for auditing and safety probing, but unjustified for mechanistic explanation of model outputs. Report should state: 'Topological features are present but causally inert.'"
