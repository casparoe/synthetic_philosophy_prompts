  # Q&A Prep Sheet: Structurally Amnesiac Priors

  ### 1. The Diachronic Coherence Charge (High Damage)
  *   **Who:** Senior Formal Epistemologist (the van Fraassen devotee).
  *   **Phrasing:** "You're proposing retroactive excision of hypothesis space. Doesn't this violate the Reflection Principle? If I know now I'll consider a hypothesis 'not live' later, I shouldn't assign it probability zero now. You're basically licensing diachronic Dutch Books to save the phenomenon of old evidence."
  *   **Reply (2 mins):** "That's the standard objection, and it holds if we assume the algebra of hypotheses is fixed across time. My claim is that for non-omniscient agents, the algebra *isn't* fixed—it's indexed to cognitive availability. Local Uniqueness doesn't permit arbitrary shifting; it restricts uniqueness constraints to the *actual* live space at $t$. If a hypothesis wasn't live at $t_1$, conditionalizing on it at $t_2$ isn't a violation of coherence because it wasn't part of the coherence domain at $t_1$. We aren't Dutch Booking the agent; we're acknowledging that the agent's rational space expanded."
  *   **Weakness Note:** This concedes that your view isn't standard Bayesianism. You're effectively arguing for a new logic of belief revision, which might look like you're changing the rules to win the game rather than solving the problem within the existing framework.

  ### 2. The "Psychologism" Objection (High Damage)
  *   **Who:** Philosopher of Physics.
  *   **Phrasing:** "This makes confirmation entirely agent-relative. If Einstein's 'live space' differs from mine, General Relativity is confirmed for him but not for me based on the same old evidence. That's not science; that's biography. You've turned Bayesian confirmation into stats with extra psychological branding."
  *   **Reply (2 mins):** "I agree that scientific confirmation shouldn't be idiosyncratic. But 'live space' isn't just individual psychology; it's constrained by the communal state of the art. When we say 'old evidence confirms,' we're implicitly indexing to the community's live hypothesis space at the time of discovery. My model formalizes that indexing. It preserves the objectivity of the *relation* between evidence and theory within a shared cognitive context, which is where confirmation actually does its work."
  *   **Weakness Note:** You risk conceding that there is no "view from nowhere" confirmation. If the physicist demands theory-relative confirmation independent of agents, this reply won't satisfy them.

  ### 3. The Operationalization Problem (Med Damage)
  *   **Who:** Formal Epistemologist (technical focus).
  *   **Phrasing:** "You hinge everything on the distinction between 'live' and 'dead' hypotheses. What's the formal criterion? If it's just 'considered,' your priors become volatile. If it's normative, you're begging the question. How do I code 'liveness' without circularity?"
  *   **Reply (2 mins):** "It's not binary volatility; it's structural. A hypothesis is 'live' if it plays a functional role in the agent's inference network—if it's available for explanation or prediction. We can model this as a accessibility relation on the hypothesis space. It's not about conscious consideration every second, but about whether the hypothesis is in the reachable set of the agent's cognitive graph. It's no vaguer than 'relevant alternative' in epistemology."
  *   **Weakness Note:** "Functional role" is still fuzzy. If pressed for a mathematical definition of "reachable set," you might have to admit it's a placeholder for future work.

  ### 4. The Genealogical Challenge (Low/Med Damage)
  *   **Who:** Metaethics Visitor (Evolutionary Debunker).
  *   **Phrasing:** "You're trusting the agent's intuition about what was 'live.' But if our cognitive architecture is evolved for survival, not truth, why trust the excision mechanism? Maybe we exclude true hypotheses because they're cognitively costly, not because they're irrational."
  *   **Reply (2 mins):** "That's a skeptical challenge for any normative epistemology, not just this model. I'm prescribing how agents *should* manage their live spaces to maintain coherence, not describing how evolution built them. If our faculties are unreliable, Bayesianism fails everywhere, not just here. My project assumes we can normatively assess 'liveness,' much like metaethics assumes we can assess moral intuitions."
  *   **Weakness Note:** This is a bit dismissive. If their point is that "liveness" is systematically biased, your "Local Uniqueness" might codify bias rather than rationality.

  ---

  ### The Dreaded Question
  *   **Phrasing:** "If you can retroactively excise hypotheses to make the math work, haven't you just made confirmation trivial? Can't I always save any theory from disconfirmation by claiming the defeating hypothesis was never 'live'?"
  *   **Why it's dreaded:** It attacks the core motivation. If "Local Uniqueness" allows you to rig the prior space to fit any outcome, the model loses explanatory power.
  *   **Prep:** You need to emphasize constraints on excision. It's not optional; it's forced by the agent's actual cognitive history. You can't *choose* to excise; you can only *recognize* excision that already happened.

