answer: |-
  **Marcus:** The bottleneck isn't intellectual capacity; it's fiscal courage. We need more nurses and engineers. The maintenance grant cap binds us. By switching to universal income-contingent loans, we unlock capital to expand places. The write-off protects the vulnerable.

  **Elena:** It unlocks capital by shifting risk onto students. You call it protection, I call it uncertainty. Even with contingencies, the borrower bears the burden of future income volatility. That is the part of my own model I find hardest to defend: under loans, the individual absorbs the shock of a broken labour market, not the state.

  **Marcus:** But look at the alternative. Your status quo is a regressive subsidy. Free tuition and grants disproportionately benefit the affluent who would have attended anyway. They capture the premium, while the general tax base foots the bill.

  **Elena:** That charge ignores Middeland's tax structure. The graduate premium is recouped over a working life through progressive income taxation. If the tax system is sufficiently progressive, the "subsidy" is clawed back. The real distributional sin I must own is this: under full tax funding, non-graduates—who are often poorer—subsidise the consumption and higher earnings of graduates. I accept that transfer only because I view education as a public good, not a private investment.

  **Marcus:** But if the tax clawback is so effective, why not make the link explicit? An income-contingent loan with a generous write-off is functionally a graduate tax by another name.

  **Elena:** Precisely. If the threshold is high and the write-off substantial, the expected repayment rate mirrors a surcharge. Why pretend it's debt?

  **Marcus:** Because the label matters. A loan implies a price signal; a tax implies entitlement. We need students to weigh costs. If it's a tax, demand becomes infinite. If it's a loan, even a soft one, it disciplines choice.

  **Elena:** Does it? Or does it just discipline the poor? You argue debt aversion suppresses participation among low-income school-leavers.

  **Marcus:** The evidence is clear. Sticker shock deters entry.

  **Elena:** I dispute the mechanism. Debt aversion doesn't necessarily reduce participation rates in systems like ours; it skews field choice and duration. Poor students opt for shorter, vocational degrees over high-return fields with longer horizons because they fear the debt stock, not the repayment flow. You're solving for entry when the distortion is in completion and major selection.

  **Marcus:** If we expand places, we mitigate that. More seats in high-return fields reduce the risk. But I concede this: if the repayment threshold is set too low, the contingent loan becomes a high marginal tax rate on low earners. That is the risk I ask them to bear—that the contingency fails to protect them when life goes wrong.

  **Elena:** And I ask the non-graduate to pay for the graduate's upside. We are both trading equity risks. What would move you?

  **Marcus:** If you could show that participation elasticity with respect to upfront grants is negligible compared to the elasticity of field choice, I'd retreat. I need to know the loans won't empty the humanities entirely. What would move you?

  **Elena:** If you could demonstrate that the administrative cost of collecting loans exceeds the revenue gain from the psychological price signal, I'd concede. I need to know the "tax by another name" isn't just bureaucratic bloat.

  **Marcus:** Then we aren't far apart. We agree on the goal: expansion without immiseration.

  **Elena:** We disagree on the discount rate. You value the immediate fiscal space to build seats today; I value the insurance value of shielding households from future tax liability uncertainty.

  **Marcus:** So the dispute turns on the social discount rate applied to public revenue versus the private discount rate students apply to debt.

  **Elena:** Exactly. If we agree on the rate, the model solves itself.

  ***

  **Note on Economics and Evidence**

  **Settled vs. Contested Claims:**
  *   **Settled:** Income-contingent loans (ICL) reduce default risk compared to mortgage-style loans. Debt aversion is a real phenomenon affecting student behaviour. Progressive taxation recoups a portion of the graduate premium.
  *   **Contested:** The magnitude of participation elasticity regarding upfront costs vs. debt levels is heavily debated. Whether ICLs function psychologically as "prices" or "taxes" depends on institutional design and public perception, which is empirically ambiguous. The incidence of tax funding (who ultimately bears the burden) depends on labour supply elasticities and tax incidence assumptions that vary by model.

  **Asserted Facts vs. Live Disputes:**
  *   **Marcus** asserts that "sticker shock deters entry" as fact. While widely believed, recent evidence in free-tuition contexts suggests effects are often small or concentrated in specific demographics, making the magnitude a live dispute.
  *   **Elena** asserts that tax clawback negates the regressive subsidy claim. This relies on the assumption that the progressivity of the tax system fully offsets the regressivity of participation, which is contingent on tax rates and avoidance.

  **Liberties Taken:**
  *   **Tax-Loan Interaction:** The dialogue treats the income tax and loan repayment as separate levers. In reality, high combined marginal withdrawal rates (tax + loan repayment) can create significant work disincentives, a complexity simplified here for clarity.
  *   **Write-off Mechanics:** The "generous write-off" is treated as a binary switch between loan and tax. In practice, the accounting treatment (asset vs. expense) affects government borrowing costs differently, a technicality omitted for dramatic focus.
  *   **Homogeneous Agents:** The dialogue implies a uniform response to debt aversion, whereas heterogeneity in risk tolerance and information asymmetry are critical in actual policy modelling.
