answer: |-
  1. Begin by defining the 'Renaissance' as a self-conception of rebirth, then introduce the 'Middle Ages' as the dark period invented to contrast against it, and finally present the 'Scientific Revolution' as the teleological outcome that justifies the previous two divisions.
  2. Use Petrarch's letter to Livy to demonstrate the active construction of historical distance, avoiding Galileo's trial because its late date prematurely validates the 'Scientific Revolution' narrative rather than exposing its artificial origins.
  3. When introducing the 'Middle Ages' as a contrasting term, explicitly challenge the textbook misconception that the Renaissance was a sudden rebirth of reason by highlighting the continuity of scholastic logic.
  4. Explain that period labels function like 'boundary conditions' in physics by drawing a box on the whiteboard to show how historians decide which events count inside a system and which are treated as external noise.
  5. Close by asking students to propose an alternative periodization scheme that does not rely on Eurocentric progress, while explicitly refusing to cover specific battle dates that would derail the session into military chronology.
