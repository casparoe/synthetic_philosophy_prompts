  1. The PBR theorem relies on specific assumptions beyond just preparation independence, and many physicists question whether these premises hold in all conceivable interpretations.
  2. Dropping preparation independence implies distinct systems can share hidden variables, which some argue is a plausible feature of holistic quantum reality rather than a mere cheat.
  3. Whilst some modelling approaches are ruled out, psi-epistemic advocates suggest the theorem doesn't forbid all statistical interpretations, particularly those involving retrocausality.
  4. The debate persists because 'reality' is a philosophical concept as much as a physical one, and no experiment can definitively settle metaphysical disputes without interpretational baggage.
  5. It is not stubbornness but rigorous scrutiny, as accepting the theorem's conclusion requires abandoning deeply held intuitions about locality and separability that many are unwilling to sacrifice.
