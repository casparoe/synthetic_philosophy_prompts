answer: |-
  **WELCOME TO THE SORTITION CHAMBER**
  **ORIENTATION PACKET SERIES A-9 (NEW DRAW)**

  **1.0 Congratulations and Eligibility**
  You have been selected from the National Register of Eligible Persons (NREP) to serve in the Upper Chamber. This selection is a high honor and a statutory obligation. Please note that service in the Sortition Chamber is strictly limited to a single, non-renewable term of eighteen months. This ensures that no citizen bears the burden of governance twice. We are proud to state that no member has ever served a second term, nor will they. This guarantees the Chamber remains free of careerism. Once your term concludes, you will be permanently ineligible for future selection, preserving the integrity of the lottery for others.

  **2.0 Facilitation and Continuity**
  You will not be alone. Your deliberations are supported by the Bureau of Legislative Continuity (BLC). Your assigned Facilitator, Mr. H. Garris (Senior Facilitator, 24th Year of Service), will guide procedural motions. The BLC staff are permanent civil servants who provide institutional memory. For example, Director L. Kalloway has managed briefing materials since the Founding Transition (22 years). Their permanence ensures that while members rotate, the standards of debate remain consistent. You are free to propose motions, but all text must be formatted by BLC staff to ensure legal viability.

  **3.0 Attendance and Compliance**
  Attendance is mandatory. Declining to serve after selection is classified as a Class C Civic Offense. To ensure equity, the penalty for declination is an Income-Adjusted Compliance Fee (IACF), scaled progressively against your prior year's tax liability. This ensures that the burden of service is felt equally by all economic brackets. We view the IACF not as a punishment, but as a fairness measure preventing the wealthy from opting out of democratic duty. Payment plans are available, but service is preferred.

  **4.0 The Shadow Panel and Deliberative Distortion**
  To guarantee descriptive representativeness, a Shadow Panel was drawn from the NREP at the exact moment of your selection. These citizens remain at home and do not convene. They will receive weekly mail surveys regarding their initial instincts on pending bills. Your votes in the Chamber are continuously compared against the Shadow Panel's survey returns.

  If the Chamber's voting record drifts statistically significant from the Shadow Panel's mail responses, this is logged as *Deliberative Distortion*. Distortion indicates that deliberation has biased the sample away from the national average. In such events, the Chamber may be dissolved and re-drawn. Please note: changing your mind based on testimony is often indistinguishable from sample corruption. We prioritize statistical purity over individual conviction.

  ***

  **SIDEBAR: EXPENSE REIMBURSEMENT**
  *Members receive a daily stipend. Receipts are required for all claims over $15. Note that BLC staff travel expenses are processed separately under permanent appropriations.*

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can I run for re-election later?**
  A: No. Elections have been abolished. Furthermore, you are permanently ineligible for future sortition. This prevents the formation of a political class.

  **Q: Why was the previous Chamber dissolved?**
  A: They voted 60/40 on the Infrastructure Bill. The Shadow Panel surveyed at 50/50. The variance exceeded the 5% tolerance for Deliberative Distortion. They were re-sorted to restore accuracy.

  **Q: Do the BLC staff vote?**
  A: No. They facilitate. However, they do draft the bill summaries you read before voting.

  **Q: What if I learn new information that changes my view?**
  A: You are encouraged to listen. However, if your changed view causes a drift from the Shadow Panel, it suggests the information was persuasive enough to break the sample. This is a risk you must manage.

  ***

  **5.0 Final Administrative Note**
  The lottery randomizes the *who*, but not the *what*. The Legislative Agenda remains set by the Executive Branch to ensure efficiency. You are random; the topics are not. This balance allows for fresh voices without chaotic scheduling. Please proceed to Room 4B for badge issuance. Welcome to the work.
