answer: |-
  There is no established technical label for this methodological asymmetry in modal epistemology, so I will formalize your proposed distinction as **constructive** versus **subtractive** conceivability to clarify the difference between specifying alternative causal realizers and merely negating properties.

  Current literature, particularly David Chalmers' framework, groups both under "positive conceivability" (constructing a coherent scenario), which obscures the critical difference in evidential weight between building a model and removing a variable. **Constructive conceivability** requires generating a complete causal model where a functional role is filled by a specified alternative realizer, as in Twin Earth where XYZ realizes the "water" role. **Subtractive conceivability** requires only the negation of a property while assuming the remaining causal structure holds fixed without specifying what, if anything, sustains the functional output, as in philosophical zombies where qualia are removed but behavior remains unchanged.

  The boundary between these modes becomes fuzzy when dealing with essential properties or functional definitions where subtraction entails logical contradiction rather than modal possibility. For instance, you cannot subtractively conceive of a triangle without three sides, nor can you subtractively conceive of a functional state without its causal role; in these cases, subtractive conceivability collapses into incoherence, whereas constructive conceivability demands you build the alternative geometry or mechanism. Treating them as epistemically equivalent is a mistake because subtractive conceivability often smuggles in causal assumptions that constructive conceivability forces into the open. By allowing subtractive scenarios to count as robust possibilities, philosophers grant dualist arguments (like zombies) the same evidential status as identity arguments (like Twin Earth), despite the former relying on a causal gap that remains unmodeled while the latter provides a fully specified alternative physics.
