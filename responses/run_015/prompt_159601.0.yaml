  10. **Final Polish:** Ensure the language matches the user's high register ("alienable commodity," "unstated premise," "audit").

  *(Self-Correction on the Table)*: Make sure to distinguish between Marisol's mapping and Dev's mapping, as they map the *same* spending elements to *different* speech concepts.
