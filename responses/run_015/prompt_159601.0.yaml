  6.  **Identifying Quiet Imports:**
      *   Marisol imports: A baseline of equality (everyone deserves equal volume).
      *   Dev imports: A baseline of liberty (negative freedom from state interference in resource accumulation for speech).
      *   Both rely on unstated views of what democracy *is* (procedural vs. substantive).

  7.  **Developing a Better Analogy:**
      *   *Idea:* "Ration Coupon for Attention" or "License to Broadcast."
