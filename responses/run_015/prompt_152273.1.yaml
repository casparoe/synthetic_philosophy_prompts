prompt: |-
  ok so me and jake were arguing til like 2am about the frame problem — you know, that philosophy/AI thing where changing one fact means you gotta figure out whats still true and what isnt, and systems either miss the background stuff or over-list every unchanged detail. he thinks its just sloppy database design, i think its deeper about what we take for granted. anyway, i review automated decision tools for our county — zoning bots, welfare eligibility updaters, stuff like that — about three pitches a week, my boss signs off, and i got 20 minutes max with no phd in sight. i need a real reusable procedure: the questions in order, what counts as a good enough answer, where i reject on tech grounds vs pass it up as a values call, and where the checklist just breaks and needs my gut. apply it to two vendor pitches: (1) a welfare updater that raises income thresholds but stays silent on whether existing medical exemptions still apply, and (2) a zoning bot that updates one parking rule but also spits out 300 unchanged ordinances to "be safe." include one case where the procedure clears the system but the result still bugs me. tell me exactly where judgment cant be eliminated. end with Verdict: [the procedures bottom-line rule].
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user had a late-night argument with "Jake" about the Frame Problem (philosophy/AI concept regarding what changes and what stays the same when an action occurs).
      *   **User's Role:** Reviews automated decision tools for a county (zoning, welfare, etc.).
      *   **Constraints:** 3 pitches/week, 20 mins/pitch, boss signs off, no PhDs available. Needs a *real reusable procedure*.
      *   **Deliverables:**
          1.  A step-by-step procedure (questions in order, pass/fail criteria, tech vs. values, gut check zone).
          2.  Apply procedure to two specific vendor pitches (Welfare Updater, Zoning Bot).
          3.  Include one case where the procedure clears the system but the result still bugs the user (to highlight the limits of procedure).
          4.  Identify exactly where judgment can't be eliminated.
          5.  End with a specific format: `Verdict: [the procedures bottom-line rule]`.
      *   **Tone:** Practical, bureaucratic but sharp, acknowledging the philosophical depth without getting bogged down in it (since there's no time for PhDs).

  2.  **Deconstruct the Frame Problem in this Context:**
      *   *Jake's View:* It's just sloppy database design (technical).
      *   *User's View:* It's about what we take for granted (ontological/semantic).
      *   *Reality for County Review:* It's both. If the system doesn't know what stays the same, it either breaks compliance (misses exemptions) or creates noise/inefficiency (lists unchanged ordinances).
      *   *The Challenge:* How to operationalize a deep philosophical problem into a 20-minute checklist.

  3.  **Drafting the Procedure (The "20-Minute Frame Check"):**
      *   Need to be efficient. 5 steps max.
      *   *Step 1: The Change Declaration.* What specifically changed?
      *   *Step 2: The Silence Test.* What did they *not* say changed? (The core Frame Problem).
      *   *Step 3: The Noise Test.* Are they outputting irrelevant constants?
      *   *Step 4: The Tech/Values Split.* Is it a bug or a policy choice?
      *   *Step 5: The Gut Check.* Where does the checklist fail?

  4.  **Developing the Criteria:**
      *   *Good Enough Answer:* Explicit confirmation of status quo for critical dependencies.
      *   *Reject on Tech:* System cannot prove stability of unmentioned variables.
      *   *Pass Up (Values):* System works, but the *implication* of the change is politically sensitive.
      *   *Gut Check:* When the system is technically compliant but feels ethically off.

  5.  **Applying to Pitch 1 (Welfare Updater):**
      *   *Scenario:* Raises income thresholds, silent on medical exemptions.
      *   *Analysis:* This is a "Negative Frame" failure. The system assumes silence = no change, but in law, silence often = ambiguity.
      *   *Verdict:* Reject on Tech/Compliance grounds. It fails the Silence Test.

  6.  **Applying to Pitch 2 (Zoning Bot):**
      *   *Scenario:* Updates parking rule, outputs 300 unchanged ordinances.
      *   *Analysis:* This is a "Positive Frame" failure (over-specification). It's inefficient but safe.
      *   *Verdict:* Pass on Tech, Flag on Efficiency. It passes the Safety Test but fails the Noise Test (mildly).

  7.  **Developing the "Bugs Me" Case:**
      *   Need a scenario where the checklist says "Go" but the human feels "Stop."
      *   *Idea:* A system that correctly applies a rule that is technically legal but morally harsh.
      *   *Example:* A welfare cutoff that is mathematically perfect based on the new threshold but ignores a known, uncodified hardship context. The Frame Problem here is about *context* not just *data*.
      *   *Refinement:* Let's stick closer to the Frame Problem. A system that correctly identifies what *didn't* change, but the *interaction* of the change + the static background creates a perverse outcome.
      *   *Selected Case:* A zoning bot that correctly keeps all historic preservation rules static while changing density, but the *combination* effectively gentrifies a block without explicit intent. The checklist clears the logic, but the *effect* is the issue.

  8.  **Identifying the "Judgment Zone":**
      *   Where does the procedure break? When "unchanged" facts interact with "changed" facts to produce emergent harm. The checklist checks variables, not *consequences of interactions*.

  9.  **Refining the Output:**
      *   Keep it tight. The user has 20 minutes.
      *   Use the "Jake vs. Me" tension to frame the intro.
      *   Ensure the `Verdict:` line is exact.

  10. **Review against Constraints:**
      *   Questions in order? Yes.
      *   Good enough answer defined? Yes.
      *   Tech vs. Values split? Yes.
      *   Gut check zone? Yes.
      *   Apply to 2 pitches? Yes.
      *   "Bugs me" case? Yes.
      *   Where judgment can't be eliminated? Yes.
      *   Final Verdict format? Yes.

  11. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't get too academic. Keep it "County Reviewer" style.
      *   *Correction:* Ensure the distinction between "Tech Reject" and "Values Pass Up" is clear. Tech = it doesn't work/logic error. Values = it works but we shouldn't do it.
      *   *Correction:* The "Bugs Me" case needs to be distinct from the two main pitches. I will add it as a "Shadow Case."

  12. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  You and Jake are both right, which is why this is a nightmare to review in 20 minutes. Jake sees the *implementation* (database state); you see the *ontology* (what constitutes reality in the system). In county work, Jake's view crashes when the law implies context the database doesn't store. Your view crashes when you can't prove the implication.

  Here is the **20-Minute Frame Protocol**. It operationalizes the Frame Problem without needing a philosophy degree.

  ### The Procedure: 5-Step Frame Check

  **1. The Delta Declaration (2 mins)**
  *   **Question:** "Show me the exact variable(s) changing and the trigger event."
  *   **Good Answer:** "Income threshold variable $X$ changes from $50k to $55k upon federal index update."
  *   **Bad Answer:** "The system optimizes eligibility based on new guidelines."
  *   **Action:** If they can't isolate the delta, **Reject**.

  **2. The Silence Test (5 mins)**
  *   **Question:** "For the top 5 dependent variables *not* changing (e.g., medical exemptions, senior status), show me the proof they remain untouched."
  *   **Good Answer:** "Here is the logic gate: IF $X$ changes, THEN $Y, Z, A, B$ retain prior state. Verified by regression test #404."
  *   **Bad Answer:** "We didn't touch those modules, so they're fine." (This is Jake's sloppy design).
  *   **Action:** If they rely on assumption rather than explicit retention logic, **Reject on Tech Grounds**.

  **3. The Noise Test (5 mins)**
  *   **Question:** "Show me the output log for a single transaction. How many unchanged facts are reported?"
  *   **Good Answer:** "Only the changed variable and the final decision are output."
  *   **Bad Answer:** "We output the full state vector to ensure auditability." (This is the 300 ordinances problem).
  *   **Action:** If output > 10x the input change, **Flag for Efficiency**, but **Pass on Tech** (unless storage costs violate budget).

  **4. The Tech/Values Split (5 mins)**
  *   **Question:** "Does the system *fail* to carry over a status, or does it *correctly* carry over a status that leads to a harsh result?"
  *   **Decision Rule:**
      *   **Tech Reject:** The system *lost* the data (e.g., medical exemption dropped).
      *   **Values Pass-Up:** The system *kept* the data, but the new rule + old data creates a hardship (e.g., exemption kept, but income threshold rise disqualifies them anyway).
  *   **Action:** Tech Rejects go back to vendor. Values Pass-Ups go to Boss/Policy.

  **5. The Gut Check (3 mins)**
  *   **Question:** "If this logic runs 10,000 times, what breaks that isn't in the database?"
  *   **Zone:** This is where the checklist ends. This covers emergent behavior, public trust, and "spirit of the law."
  *   **Action:** If your stomach turns, **Pause**. Document why. Escalate.

  ---

  ### Application to Vendor Pitches

  #### Pitch 1: Welfare Updater (Income Thresholds)
  *   **The Pitch:** Updates income caps automatically. Silent on medical exemptions.
  *   **Step 1 (Delta):** Clear. Income cap changes.
  *   **Step 2 (Silence):** **FAIL.** Vendor says, "Exemptions are in a different table, so they persist."
      *   *Critique:* This is Jake's sloppy design. In relational databases, updates can cascade or orphan records. Silence is not retention.
  *   **Step 4 (Split):** This is a **Tech Reject**. The system cannot prove the exemption status survives the update event. It risks illegal denial of benefits.
  *   **Verdict:** **REJECT.** Do not pass to Boss. Send back for explicit retention logic.

  #### Pitch 2: Zoning Bot (Parking Rule)
  *   **The Pitch:** Updates one parking setback rule. Outputs 300 unchanged ordinances per permit.
  *   **Step 1 (Delta):** Clear. Setback variable changes.
  *   **Step 2 (Silence):** **PASS.** They explicitly log that all other ordinances remain "Active/True."
  *   **Step 3 (Noise):** **FLAG.** Outputting 300 unchanged ordinances is bloated, but it's "safe." It solves the Frame Problem by brute force (listing everything).
  *   **Step 4 (Split):** **Pass on Tech.** It's not a compliance risk, just a storage/reading inefficiency.
  *   **Verdict:** **PASS TO BOSS.** Note the inefficiency, but the logic is sound.

  ---

  ### The "Bugs Me" Case (Where the Procedure Clears)
  *   **Scenario:** A "Fast-Track Demolition" bot.
  *   **The Logic:** It correctly identifies if a building is *not* historic (unchanged fact) and *is* unsafe (changed fact). It approves demolition.
  *   **The Procedure:**
      *   Delta: Safety status.
      *   Silence: Historic status verified as "null."
      *   Noise: Low.
      *   Tech/Values: System works as coded.
  *   **The Gut:** The "unsafe" tag came from a single automated complaint, not an inspection. The "not historic" tag is correct technically, but the building is part of a cultural district not yet codified in the database.
  *   **Result:** The checklist says **PASS**. Your gut says **STOP**.
  *   **Why:** The Frame Problem isn't just about data stability; it's about *contextual relevance*. The system framed the world as "Codified Rules + Physical State." It excluded "Community Context." The procedure cannot check for facts that aren't in the schema.

  ---

  ### Where Judgment Can't Be Eliminated
  You cannot eliminate judgment at **Step 5 (The Gut Check)**.
  The procedure checks for *logical consistency* (did the data stay where it should?). It cannot check for *ontological completeness* (did we include the right facts in the world model?).
  *   **Jake's Error:** Thinking better code fixes missing context.
  *   **Your Error:** Thinking you can list every possible context.
  *   **The Reality:** The "Frame" is a political boundary, not just a technical one. Deciding what counts as "background noise" vs. "relevant fact" is a policy decision, not a logic check. When the system is logically perfect but socially destructive, that is the zone where you must override the checklist.

  Verdict: [Reject on Tech if silence implies data loss; Pass on Values if logic holds but outcomes are harsh; Trust Gut if context is missing from the schema.]
