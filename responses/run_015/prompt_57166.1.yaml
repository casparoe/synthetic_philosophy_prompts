      Hey, I'm sorry that happened. It is incredibly frustrating to feel like you're speaking a different language, and honestly, you're right that the sentence your friend used is doing too much heavy lifting. It's a slogan that functions as a shield, but if you peel it back, it's actually a stack of different claims ranging from the tautological to the empirically dubious. To help you recover for the next session, I think it helps to separate out the distinct readings of that phrase, because the truth value changes drastically depending on which version he intended.

      The weakest reading is basically an accounting identity. On this view, the price is simply the point where the highest bid meets the lowest ask at a specific moment. For this to be true, all you need is for a trade to have occurred. It assumes nothing about the rationality of the traders or the quality of their information. The person on the other side of the trade might be selling because they need cash for a divorce, not because they know something you don't. The verdict here is that the statement is trivially true but completely unhelpful for his argument. It says nothing about whether the price is right or whether your regulatory risk argument is wrong, only that money changed hands. If he meant this, he didn't actually counter your point; he just noted that a market exists.

      The second reading is the semi-strong form of market efficiency. This claims that all publicly available information is reflected in the price. For this to hold, you have to assume that there are enough rational actors monitoring public news feeds that any new public data is arbitraged away almost instantly. It assumes the cost of digging up public information is low enough that anyone could have done what you did. Here, the person on the other side of the trade believes the same public facts as you but weighs them differently, or perhaps they are liquidity traders masking the informed ones. The verdict is plausible for headline news but likely false for nuanced regulatory risks. If your argument relies on interpreting complex legal filings or political signals that aren't front-page news, this version of the slogan doesn't apply. Markets are good at pricing earnings misses; they are notoriously bad at pricing complex, low-probability regulatory shifts until the moment they happen.

      The third reading is the strong epistemic claim, which is probably what he meant to convey. This is the idea that the price is the best possible estimator of fundamental value, superior to any individual's reasoning. For this to be true, you need a market populated by many informed traders with diverse private signals, low transaction costs, and no barriers to entry. It assumes that if you have a valid argument, someone richer and smarter than you has already acted on it, pushing the price to the correct level. The person on the other side of the trade, in this view, effectively represents the aggregate wisdom of the crowd, while you are just an outlier. The verdict here is false in the strict sense but pragmatically useful. We know bubbles and crashes happen, so prices are not always correct. However, assuming you are wrong is a good heuristic because most people are usually wrong when they think they know better than the market. This is the reading that feels like he was saying you're not special.

      There is a fourth reading that often gets conflated with the others, which is about risk premiums rather than information. This claims that the price reflects not just the probability of the risk you see, but the cost of bearing that uncertainty. For this to hold, traders must be risk-averse. It assumes the person on the other side of the trade knows the same probabilities as you but demands a higher return to hold the asset through the volatility. The verdict is highly plausible. Often when people say a risk is priced in, they mean the market sees the risk but demands a discount for it, whereas you might be seeing the risk but ignoring the compensation you get for holding the stock despite that risk. This is a substantive economic argument, not just a slogan, and it's where the real debate should have been.

      Now, regarding your first worry about the sentence undermining itself, you have put your finger on the Grossman-Stiglitz paradox. If prices perfectly reflect all information, then no one has an incentive to pay the cost to gather information, because they can't profit from it. If no one gathers information, prices cease to reflect information. The version of the slogan that survives this circularity is the marginal one: prices are informative enough to leave just enough profit on the table to compensate the marginal information gatherer for their costs. The version that clearly doesn't survive is the strong claim that prices are perfectly correct. If your friend believes the strong claim, he ignores the fact that his own belief in efficiency relies on people like you trying to prove him wrong. You need some mispricing to incentivize the arbitrage that creates efficiency.

      On your second point about the slide between priced in and correct, you are absolutely right to be suspicious. There is a massive gap between a price being the best consensus estimate and a price being the true fundamental value. The market can be efficiently wrong if everyone shares the same bias or if the relevant information simply does not exist yet. For example, if every analyst uses the same flawed model to value a regulatory risk, the price will reflect that consensus perfectly, but it will still be wrong. The slogan works as a defense only if you assume the market aggregates diverse errors into truth. If the error is systematic, the price is just a precise reflection of a collective mistake. He was likely moving between price as consensus and price as truth without noticing that the former does not guarantee the latter.

      This leads to your third point about when the sentence is a legitimate argument ender. It is legitimate when used as a burden-of-proof shifter in a context where arbitrage is cheap and competitors are sophisticated. If you suggest a penny stock is mispriced, telling you it's probably priced in is valid because thousands of algorithms are watching it. It is illegitimate when used to dismiss a structural insight without engaging with the mechanism. In your case, if the regulatory risk involves non-public interpretation of law or political connections, the assumption that everyone else knows what you know is false. You used it correctly on stock tips because most tips are just recycled public noise. You were on solid ground with the regulatory risk because that sounds like private or interpretive information where the efficiency assumption breaks down.

