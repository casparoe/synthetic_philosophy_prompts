  A behavioral economics article I read summarizes the sunk cost literature like this: 'The classic experiments by Arkes and Blumer showed that people who had paid more for a theater season subscription attended more plays, and that in a hypothetical mountain-trip scenario, people who had already invested more in a trip chose the more dangerous mountain, Mount Logan, over the safer Mount Olympus. The authors concluded that people are irrational because they are cognitively unable to discount past investments, which economists call sunk costs, and that this is a pure cognitive error, in the same class as the conjunction fallacy. Therefore any policy that forces people to confront their sunk costs, such as requiring an explicit accounting of past spending, will improve their decisions.' I lean toward the view that honoring sunk costs is often rational, in bad relationships or half-built bridges or long research programs, so I suspect this summary is too harsh, but I cant tell exactly where it goes off. Could you go through it sentence by sentence and tell me what is actually right, what is a subtle misrepresentation of what those experiments really showed, and what a defender of the 'sunk costs genuinely matter' view would object to -- and does the final policy claim follow from anything true in the summary, or only from the distorted parts? When you do, please separate what is settled ground from what is genuinely contested among the people who work on this, and don't present a contested view as the consensus. And please write the whole thing as continuous prose, like a long email -- no headings, no bullet points, no bold, no tables.
