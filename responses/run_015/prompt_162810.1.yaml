answer: |-
  **WIP Prep Sheet: Procreation Asymmetry & Authorization**
  **To:** 4th-Year PhD Candidate
  **From:** [Redacted]
  **Re:** Thursday's Session

  Look, your supervisor wants you to cut the second half for a reason. The "Borrowed Life" move is where the metaphysics of consent crashes into the reality of existence. You are walking into a room that can smell circularity from a mile away.

  Below are the five objections you will face, ordered by how much damage they can do to the chapter's viability. I've drafted replies that sound like *you* speaking, not a paper. I've also included the "Weakness/Concession" note for each. Be honest in the room. If you try to bullsh*t the Kantian or the Feminist scholar, you'll lose the room.

  ***

  ### 1. The Kantian Political Philosopher
  **The Objection:**
  "I like the consent framing, but I think you're smuggling in a contradiction. Consent requires a consenting subject. In the 'Borrowed Life' case, the subject *only exists* because you violated the purported constraint. You're using the outcome of the act (the happy adult) to validate the act (the creation), but that adult wouldn't be there to validate it if you hadn't already acted. Isn't this just circular? You can't hypothetically consent to your own genesis because the 'you' that consents is the product of the violation."

  **The Reply (2 mins):**
  "That's the central tension, and I grant the circularity risk if we treat this as *contractual* consent. But I'm not arguing the child consents to the *act* of procreation. I'm arguing they endorse the *continuation* of the life imposed. Think of it like emergency surgery on an unconscious patient. If they wake up and say 'I'm glad you saved me,' that doesn't mean they consented *ex ante*, but it does dissolve the claim that they were *wronged*. My claim is that the asymmetry generates a *pro tanto* reason against creation, not an absolute prohibition. Endorsement doesn't make the act consensual; it waives the complaint. The reason exists, but it's defeated by the subject's own valuation of their existence."

  **Weakness/Concession:**
  *   **Honest Truth:** This is your weakest philosophical link. The "emergency surgery" analogy works for existing people; it's much shakier for non-existent ones.
  *   **Concession Strategy:** If they press hard, concede that "authorization" might be the wrong word. Pivot to "ratification." Admit that *ex ante* authorization is impossible, so the view relies entirely on *ex post* ratification defeating the claim of wronging. This validates your supervisor's worry: if it's all *ex post*, is it still an asymmetry view, or just a welfare view?

  ### 2. The Feminist Philosopher (Reproduction & Disability)
  **The Objection:**
  "I'm worried about the work this does in the world. You say parents don't wrong children if the child endorses life despite early harm. But in disability contexts, we constantly hear from parents that 'having you was a burden but you're worth it.' If your view says 'no reason against creation' because the child endorses it, doesn't that disarm the child's right to complain about the suffering? Also, practically: Are you saying we can justify selective termination by predicting future endorsement? Because that sounds like eugenics with extra steps."

  **The Reply (2 mins):**
  "I want to separate the *moral ontology* from the *conversational norms*. My claim is about whether a moral wrong occurred, not about what parents should say to children. A parent shouldn't say 'You endorsed this,' because that's coercive. But objectively, if a life is worth living to the person living it, calling the creation a 'wrong' implies the child would be better off not existing, which is incoherent. On termination: No. This view applies to *creation*. Termination is about ending an existing trajectory. My view actually protects the disabled child: it says if they endorse their life, the suffering wasn't a 'wrong' inflicted on them, so they don't carry the burden of being a 'mistake.'"

  **Weakness/Concession:**
  *   **Honest Truth:** This is the highest damage objection. If your view makes it harder for disabled people to claim they were harmed by structural neglect surrounding their birth, the view is politically toxic.
  *   **Concession Strategy:** Concede immediately that this view should *not* be used in parental rhetoric. It's a third-person evaluative tool, not a first-person justification. If they push on the disability harm point, admit that "endorsement" is sensitive to adaptive preferences. You might need to carve out an exception for cases where endorsement is clearly a product of oppressive socialization.

  ### 3. The Decision-Theory Grad Students
  **The Objection:**
  "You're shifting the evaluation time from *ex ante* to *ex post*. In decision theory, you can't judge the rationality of a choice by the outcome. If I buy a lottery ticket and win, it was still a risky bet. If parents create a child knowing there's a risk of severe pain, they made a risky choice. If the child gets lucky and endorses life, that's luck, not a defeat of the moral reason. Why isn't this just outcome bias?"

  **The Reply (2 mins):**
  "I agree that *rationality* is *ex ante*. But 'wronging' is often *ex post*. If I drive drunk and get home safely, I acted irrationically, but I didn't *harm* anyone. If I drive drunk and hit someone, I harmed them. My view is that the 'reason against creation' is a reason regarding *potential wronging*. If no wrong is sustained—because the 'victim' rejects the claim of victimhood—then the reason loses its normative force. I'm not saying the decision was safer; I'm saying the complaint is void."

  **Weakness/Concession:**
  *   **Honest Truth:** They are technically right. You are conflating the justification of the *action* with the validity of the *complaint*.
  *   **Concession Strategy:** Distinguish between "Reason to Act" and "Reason to Blame." Admit the *Reason to Act* remains *ex ante* (parents should still minimize risk), but the *Reason to Blame* is defeated *ex post*. This saves the view but shrinks its scope.

  ### 4. The Senior Population Ethicist (Person-Affecting)
  **The Objection:**
  "I'm sympathetic to person-affecting views, but I need to know what 'authorization' is doing that 'harm' isn't. If the child is harmed by the congenital condition, they have a complaint. If they aren't harmed overall, they don't. You're introducing 'authorization' as a middleman. Is this just a person-affecting view with new vocabulary? If the child endorses the life, they aren't harmed *all things considered*. So why do we need the consent framework?"

  **The Reply (2 mins):**
  "Because harm is aggregate, but authorization is transactional. A person can be 'net benefited' but still 'wronged' if the benefit was imposed without right. Think of a forced organ donation that saves a life. The donor is net alive, but they were wronged. Standard person-affecting views struggle to explain why we shouldn't create the suffering child if we also create a happy one (the Non-Identity Problem). Authorization explains the constraint without relying on 'harm' comparisons between existence and non-existence, which are metaphysically messy."

  **Weakness/Concession:**
  *   **Honest Truth:** She might be right that this is just relabeled person-affecting utilitarianism.
  *   **Concession Strategy:** If she presses, concede that the *extensional equivalence* might be high, but the *explanatory power* is different. It explains the *intuition* of the asymmetry better than harm, even if the outcomes match. Don't fight for novelty if the mechanism is the same; fight for clarity.

  ### 5. The Hard-Nosed Totalist Consequentialist
  **The Objection:**
  "This is just status quo bias with a philosophy vocabulary. You're privileging the state of 'non-existence' as the default that requires consent, but non-existence isn't a state. There's no one there to be authorized. Why isn't the asymmetry just an irrational fear of acting? If the life is good, you added value. Why does the lack of a signature on a contract that couldn't exist matter?"

  **The Reply (2 mins):**
  "It's not about privileging non-existence; it's about constraining the agent. I'm not saying non-existence is better. I'm saying *imposition* requires justification. When you create a person, you impose a life on them. If that life contains unconsented suffering, you need a specific justification. 'It adds value to the universe' isn't a justification *to them*. It's a justification to the aggregate. My view respects the separateness of persons, which totalism ignores."

  **Weakness/Concession:**
  *   **Honest Truth:** You will not convince this person. They reject the deontic framework entirely.
  *   **Concession Strategy:** Don't try to win. Frame it as a clash of frameworks. "We disagree on whether agent-relative constraints exist. If you reject those, my view won't work, but it explains the intuitions of those who do accept them." Move on quickly.

  ***

  ### The One Question You Hope Nobody Asks
  **The Question:**
  "If endorsement defeats the reason against creation, does *non-endorsement* retroactively create a wrong? If a child grows up, suffers, and wishes they were never born (or commits suicide), does your view imply the parents *retroactively* wronged them in a way they didn't before? Are you making the moral status of the parents' action dependent on the child's future mental state?"

  **Why this kills you:**
  This makes procreation a moral time-bomb. It means parents never know if they acted permissibly until the child dies. It also implies that a depressed 15-year-old retroactively makes their birth a moral violation, even if they recover at 20. This undermines the stability of moral judgment.

  **Prepared Reply (Damage Control):**
  "That's a serious implication. I would argue the relevant time for endorsement is *competent adulthood*, not transient states. But I grant that on my view, the *final* moral verdict on procreation is indeed temporally extended. It's not that the *act* changes, but that the *wronging* is only constituted if the complaint is sustained. I bite this bullet: procreation is unique because the 'victim' is the only one who can settle the claim."

  **Real Advice:**
  If they ask this, **concede**. Do not try to wriggle out. Say: "Yes, on this view, the moral closure of procreation is delayed. That's a cost of the view, but I think it's more accurate than pretending we know the moral status at birth." Then look at your supervisor. She'll know this is where the chapter needs cutting or massive qualification.

  ***

  **Final Note:**
  Your supervisor wants you to cut the second half because the "Borrowed Life" case relies on *ex post* ratification to solve an *ex ante* problem. The room is going to expose that gap. Use this session to confirm whether that gap is bridgeable or fatal. If the Kantian and the Feminist scholar both hammer the consent/endorsement move, take the hint. Keep the authorization framework for the asymmetry, but drop the "Borrowed Life" application. Good luck.
