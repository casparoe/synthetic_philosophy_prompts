answer: |-
  Your problem is not legal—you already know the contract governs title—but ethical. It is a question of *moral desert*: who deserves credit for an immaterial object? To analyze this, we must distinguish between *conception* (the mental act of forming the complete idea) and *reduction to practice* (the labor of making it work). In philosophy of action, we also distinguish *causal conditions* (things that must happen for an event to occur) from *constitutive contributions* (things that define what the event actually is).

  Your situation turns on whether credit tracks the spark of insight, the labor of execution, or the social conditions that made insight possible. There are three candidate frameworks. The *Labor Theory* suggests ownership belongs to whoever mixed their sweat with the idea (favoring Tom). The *Personality Theory* suggests ownership belongs to whoever's will is expressed in the object (favoring you). The *Utilitarian Theory* suggests credit should be assigned to maximize future innovation (favoring clear rules about conception).

  Here is my verdict on the conflicting claims.

  Regarding Priya: She is owed gratitude, not credit. Her objection was a *causal condition*; it cleared the ground but did not plant the seed. In ethics, preventing a wrong action does not make one the author of the right action that follows. If five others could have made the same objection, her contribution is fungible. She contributed to the *problem space*, not the *solution content*. To assign her authorship would dilute the meaning of invention to include anyone who merely cleared a path.

  Regarding Tom: This is the harder case. You are the architect; he is the engineer. Under the Personality Theory, the core design reflects your will, so you are the primary moral author. However, Tom's choices (eviction policy, compaction) are not mere labor; they are design decisions that determine success. He contributed to the *reduction to practice* in a way that shaped the final object. He does not own the *idea*, but he owns a share of the *achievement*. Ideas are not cheap if they are specific; but execution is not valueless if it requires insight. You are the originator; he is the co-realizer.

  Regarding Prior Art: You ask if there is anything left to own if the components were published. This misunderstands novelty. Most invention is *combinatorial*; it is the synthesis of existing parts into a new whole that matters. That others converged on similar solutions confirms the idea's value, not its lack of ownership. Credit tracks *agency*, not just uniqueness. You exercised agency in combining them.

  Regarding the Company: They own the asset legally, but you own the moral credit. The Sunday sketch complicates the "work for hire" moral narrative, but since you brought it in voluntarily, you effectively gifted the conception to the context of your employment.

  **Concrete Recommendation**

  Do not ask to change the patent inventorship list unless Tom contributed to the specific *claims* being patented. In patent law, inventorship is strict: if he didn't contribute to the conceived method, he isn't an inventor. However, morally, you should acknowledge his crucial role in making it viable.

  1.  **To Priya:** Say this: "You were right to stop the nightly rebuild. That constraint forced me to look elsewhere, and I appreciate that. But the specific design was my synthesis." Validate her impact on the *process*, but deny her claim on the *product*.
  2.  **To Tom:** Say this: "The core architecture was my sketch, but the production viability is yours. You didn't just build my idea; you completed it." Ensure his performance review highlights his engineering choices, not just "implementation."
  3.  **To the Company:** Sign the patent assignment, but ensure you are listed as the sole inventor unless legal counsel confirms Tom's contributions meet the legal threshold for co-inventorship. Do not conflate legal ownership with moral authorship.

  You are the moral author. Protect that credit, but share the praise for the realization.
