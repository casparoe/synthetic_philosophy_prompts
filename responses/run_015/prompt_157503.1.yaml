answer: |-
  The museum director stood before the board, gesturing to the empty expanse of the new wing.

  "We have enough budget for one more Rembrandt," said the head curator. "It would secure our reputation. The average visitor experience would be transcendent."

  "No," said the Director. "We will instead purchase ten million prints of this beige rectangle."

  The board murmured. "But it's indistinguishable from the wall," a trustee protested. "The average quality of the collection will plummet to near zero."

  "Precisely," said the Director. "Individually, each rectangle offers a fleeting, barely perceptible sense of 'having seen art.' Let's call it 0.0001 aesthetic units. Barely worth viewing. But ten million times 0.0001 exceeds the total value of the Rembrandt."

  "So we are deliberately filling the museum with trash to maximize the sum?"

  "We are prioritizing total aesthetic mass over average quality," she corrected, handing the curator a glue gun. "Intuitively, it feels wrong. But mathematically, the larger population of mediocre art outweighs the smaller population of masterpieces."

  "But visitors will be miserable," the trustee insisted. "They won't even notice the difference."

  "Their experience is irrelevant. The value exists in the aggregate." She pointed to the trustee, who was standing near the wall. "Now please step aside. You're casting a shadow on five hundred units of cumulative beige."
