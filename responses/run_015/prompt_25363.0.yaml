prompt: |-
  So my friend Marcus and I got into this huge argument last night — we were at his place till like 2am, and it started because I mentioned I'd been going back and forth about whether to go vegan. I'm maybe 60% convinced by the arguments about factory farming being a moral catastrophe, but I'm also 40% convinced that animals don't have the kind of moral status that would make eating them wrong. Marcus kept saying "just go with what you think is most likely true, otherwise you'll tie yourself in knots." But I don't think it's that simple, and we ended up going through a ton of cases where I have strong gut feelings that don't line up with his rule. He thinks my verdicts are a mess and I should just always go with the highest-probability theory and stop worrying about stakes. I think he's wrong but I can't state the principle I'm actually using.

  Here's where I landed, gut-wise, on a bunch of cases we went through:

  1. The veganism one: 60% sure eating meat is seriously wrong, 40% sure it's fine. I think I should stop eating factory-farmed meat, but I'm not sure I need to go fully vegan (like, backyard eggs feel different). Gut says: the 60% carries the day here, even though it's not overwhelming.

  2. A small donation: I'm 55% sure I ought to give $50 to a malaria charity, 45% sure my money would do more good spent locally where I can see the impact. I give the $50. Gut says: give, even though I'm barely leaning that way.

  3. Medical trial enrollment: I'm 70% sure enrolling in this clinical trial is safe and helps advance science, 30% sure there's a side effect the researchers are downplaying that could be permanently disabling. I don't enroll. Gut says: don't enroll, the 30% possibility of disaster outweighs the 70%.

  4. White lie to my partner: I'm 85% sure telling a small lie about liking her cooking is harmless and kind, 15% sure that lying is always wrong in a way that damages relationships over time. I tell the truth (gently). Gut says: don't lie, even though I'm pretty confident the lie would be fine.

  5. Voting third party: I'm 90% sure the Democrat is better than the Republican, but I'm 10% sure the Green candidate is actually best and that voting strategically for the Democrat perpetuates a broken system. I vote Democrat. Gut says: go with the 90%, the stakes of being wrong about the Green candidate aren't catastrophic enough.

  6. Tipping at a no-tip restaurant: The restaurant has a policy of paying living wages and says tips aren't expected. I'm 95% sure not tipping is fine, 5% sure the staff are actually underpaid and the policy is marketing. I don't tip. Gut says: 95% is high enough, I'm not going to tip against the stated policy.

  7. Here's the one that really tripped me up and Marcus pounced on: I'm 80% sure that buying a new phone every two years is morally neutral (the environmental harm is small per person), 20% sure it's a serious wrong because of e-waste and mining conditions. I still buy the new phone. But this feels inconsistent with the medical trial case — there I had 70/30 and went with the minority view because the stakes were high, but here the 20% view also says the stakes are high (serious wrong). And inconsistent with the white lie case too — there I had 85/15 and went with the minority view. So why does 80/20 on phones go the other way? Marcus says I'm just rationalizing.

  8. One more: A friend asks me to lie to their boss about them being sick. I'm 60% sure helping a friend in a bind is the right thing, 40% sure I'm complicit in something genuinely dishonest and wrong. I refuse. Gut says: don't lie for someone else even when I lean toward it being okay.

  I feel like there's gotta be a principle that makes sense of most of these, even if I have to give up one or two verdicts. Can you help me extract it?

  Please give me your answer as a JSON object with these fields:

  - "principle_name": a short label for the principle you think best captures my verdicts
  - "principle_statement": a precise statement of the principle, no more than a paragraph
  - "clauses": an array of objects, each with "clause" (the text of one part of the principle) and "motivating_case" (which of my cases, by number, that clause is designed to handle)
  - "verdicts_explained": an array of objects, each with "case_number", "my_verdict" (what I said), "principle_verdict" (what your principle says), and "match" (true if they agree, false if not)
  - "verdicts_i_must_drop": an array of case numbers where your principle forces a different verdict than mine, with a brief explanation for each
  - "new_test_cases": an array of at least three new cases I didn't list, each with "case_description", "principle_verdict", and "why_this_tests_the_principle"
  - "marcus_response": what you think Marcus would say about your principle, and how I should reply
