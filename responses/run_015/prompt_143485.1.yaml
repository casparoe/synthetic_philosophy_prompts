answer: |-
  Here is your Q&A prep. I have ordered these by **damage potential** (how much they threaten the viability of the project), not likelihood. The "External" and "Leakage" objections are existential; if you stumble there, the thesis dissolves. The "Grad Student" objection is annoying but survivable.

  I have been brutally honest in the "Epistemic Status" section at the end. Read that first.

  ### Pre-Emptive Concessions (First 2 Minutes of Q&A)
  *Use these to disarm the committee before they attack. It shows you know the literature.*

  1.  **On Formal Novelty:** "I want to be clear: the formal move of restricting Pareto comparisons based on rights-protected dimensions is not entirely new. It shares DNA with Gibbard's waiver system and Wriglesworth's coordinate constraints. My contribution is not the *existence* of a formal fix, but the *normative justification* for it via the causal/constitutive distinction."
  2.  **On Completeness:** "I concede that my solution yields a social *quasi-ordering* (incompleteness) rather than a complete ordering. I argue incompleteness is the price of consistency, not a bug."
  3.  **On the 'Leakage' Problem:** "I acknowledge the causal/constitutive line is the thinnest part of the argument. I am proposing it as a working distinction for the model, not a metaphysical truth."

  ### Non-Negotiables (Do Not Surrender These)
  1.  **The Diagnosis:** Do not accept that Sen's paradox is a substantive conflict between Liberty and Pareto. Maintain it is a *modeling artifact* of how rights were formalized (decisiveness over states vs. control over coordinates).
  2.  **The Indexing Move:** Do not accept that you are "restricting the domain of preferences." You are restricting the *domain of admissible Pareto comparisons*. This is a structural distinction, not a psychological one.
  3.  **The Normative Core:** Do not accept that rights are "trumps" that sit outside the aggregation function. Rights structure the aggregation function itself.

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The "Leakage" Objection (The Existential Threat)
  **Who:** The Side-Constraints Guy or Rawlsian 1.
  **Voice:** "You hang everything on distinguishing 'causal side-effects' from 'constitutive dependence.' But in social ontology, almost everything is constitutive. If I play loud music, my 'coordinate' (volume) constitutes your 'coordinate' (quiet enjoyment). If you draw the line to stop leakage, haven't you just stipulated the solution by defining the personal sphere so narrowly that no interactions occur?"
  **Reply:** "That's the risk, but it's not a stipulation. It's a distinction between *what I do* and *how it lands*. My reading the book is the exercise of my power. Your annoyance is a causal consequence. The Pareto principle is blocked only when comparing states where I *didn't* read vs. I *did* read (constitutive of my right). It is not blocked when comparing states where my reading causes you pain (causal effect). We handle the pain through externalities/torts, not by voiding the right. The line holds because we distinguish the *act* from the *impact*."
  **Soft Spot:** This is your weakest link. If they press that "your reading" and "my quiet" are constitutively linked in the social state description, you have no formal answer other than "stipulate the description differently."

  #### 2. The "Arrovian Condition" Objection
  **Who:** The External Examiner (Economics).
  **Voice:** "Let's look at the formal structure. You say you're indexing Pareto. In Arrovian terms, aren't you just imposing a restriction on the Universal Domain? If you rule out certain comparisons, you're effectively saying some preference profiles aren't admissible. Which condition are you weakening? Independence of Irrelevant Alternatives (IIA) or Unrestricted Domain (UD)?"
  **Reply:** "It is not a restriction on UD in the standard sense. Preferences are still unrestricted; agents can prefer anything. I am restricting the *application* of the Pareto principle, not the input. Formally, this looks like a violation of IIA because the admissibility of a comparison depends on the *nature* of the alternatives (whether they differ in protected coordinates), not just the preferences over them. I am trading IIA for Consistency."
  **Soft Spot:** Social choice theorists often view "restricting the application of an axiom" as semantically identical to "restricting the domain." Be prepared for him to insist this is just Domain Restriction by another name.

  #### 3. The "Gibbard Collapse" Objection (Hope Nobody Asks)
  **Who:** The External Examiner or Side-Constraints Guy.
  **Voice:** "Gibbard (1974) already solved this by allowing rights to be waivable when Pareto gains are available. You're blocking the comparison entirely. Functionally, isn't this just Gibbard's waiver system with extra deontological notation? If the outcome is the same, what's the theoretical gain?"
  **Reply:** "The outcome isn't the same. Gibbard requires the agent to *waive* the right to allow the Pareto move. That implies the right is alienable. My model says the comparison is *inadmissible*. The right isn't waived; it's structurally prior to the efficiency calculation. This preserves the inalienability of rights, which Gibbard sacrifices. That's the gain: a formalism that respects rights as non-negotiable constraints on aggregation, not preferences to be traded."
  **Soft Spot:** If they can show a mathematical isomorphism between your 'blocked comparison' and Gibbard's 'waiver,' your claim to novelty evaporates.

  #### 4. The "Hohfeldian Precision" Objection
  **Who:** The Legal Theorist.
  **Voice:** "You use 'power over a coordinate.' In Hohfeld's scheme, a 'power' is the ability to change legal relations. A 'privilege' is the absence of a duty. When you read the book, are you exercising a power or a privilege? If it's a privilege, you have no claim against me interfering. If it's a power, what relation are you changing? You seem to be using 'right' as a loose synonym for 'gets their way'."
  **Reply:** "It's a composite. It is a *privilege* to read (no duty to refrain) coupled with a *claim-right* against others interfering with that coordinate. The 'power' element is the ability to determine the value of that coordinate in the social state. I'm using 'power' loosely to mean 'determinative control,' but I accept the Hohfeldian correction: it's a claim-right protecting a privilege."
  **Soft Spot:** If you haven't formally mapped the "coordinate" to specific Hohfeldian incidents in the text, they will catch you vagueness.

  #### 5. The "Side-Constraint" Objection
  **Who:** The Side-Constraints Guy.
  **Voice:** "You're treating rights as parameters for the Pareto principle. But rights are side-constraints. They shouldn't be part of the aggregation function at all. By indexing Pareto to rights, you're making rights contingent on the existence of a social welfare function. Why not just say rights forbid certain states outright?"
  **Reply:** "Because we still need to choose between permissible states. If rights forbid states outright, we have a set of allowed options. But how do we rank them? I'm arguing that rights don't just filter states; they filter the *reasons* we can use to rank them. We can't use Pareto efficiency to rank across a rights-boundary. That integrates rights into the decision procedure without making them consequentialist."
  **Soft Spot:** He may argue that filtering *states* (Nozick) is cleaner than filtering *comparisons* (you).

  #### 6. The "Triviality/Efficiency" Objection
  **Who:** Rawlsian 1.
  **Voice:** "If I have a right over a trivial coordinate—say, the color of my socks—and I exercise it in a way that prevents a massive Pareto gain for everyone else, your model blocks the comparison. You've allowed rights to veto massive social welfare gains. Isn't that an unacceptable cost?"
  **Reply:** "That is the liberal commitment. If the right is genuine, it trumps efficiency. However, my causal/constitutive distinction limits this. If your sock choice *causes* a massive loss for others, that's an externality, not a protected coordinate exercise. The veto only applies to the intrinsic exercise of the right, not its catastrophic side effects."
  **Soft Spot:** Returns to the "Leakage" soft spot. If the side effects are huge, why aren't they constitutive of the social state?

  #### 7. The "Sen's Later Work" Objection
  **Who:** The Grad Students.
  **Voice:** "Sen moved past the 1970 paradox. In *Development as Freedom*, liberty is about capabilities and agency, not game-theoretic paradoxes over book reading. You're spending 100 pages solving a puzzle Sen himself abandoned. Why should we care?"
  **Reply:** "Because the 1970 paradox is still the canonical formalization of the conflict in the literature. Until the formalism is fixed, the normative claims rest on a broken model. I'm clearing the ground so the 'capabilities' approach can be formalized without generating immediate inconsistency. I'm fixing the engine so the car can drive."
  **Soft Spot:** They may view this as scholastic tinkering irrelevant to real-world justice.

  #### 8. The "Public Reason" Objection
  **Who:** Rawlsian 2.
  **Voice:** "You distinguish causal from constitutive effects. Who decides that distinction? In a pluralistic society, I might think your reading is constitutive of my moral environment. Isn't drawing that line a perfectionist judgment that violates public reason?"
  **Reply:** "It's a structural judgment, not a moral one. It relies on the physical/conceptual distinction, not the good/bad distinction. We don't need to agree on the morality of the book to agree that 'reading' is an action by me and 'annoyance' is a reaction by you. The model requires a shared ontology of action, not a shared conception of the good."
  **Soft Spot:** In political philosophy, ontologies of action are rarely neutral.

  ---

  ### Epistemic Status & "Old Wine" Warning

  **Settled:**
  *   Sen's 1970 Theorem is valid within its axioms.
  *   Gibbard (1974) and Blau (1975) offered formal resolutions.
  *   Hohfeld's incidents are the standard legal taxonomy.

  **Contested:**
  *   Whether rights should be modeled as "decisiveness" (Sen/Gibbard) or "constraints" (Nozick).
  *   Whether social states can be cleanly decomposed into independent "coordinates."

  **Your Construction:**
  *   **Novel:** The specific "Exercise-Conditional" indexing of Pareto (blocking comparisons rather than waiving rights).
  *   **Novel:** The use of the Causal/Constitutive distinction to solve the Leakage problem.
  *   **Risk:** The "Coordinate" model of rights is **not new**. It appears in **Wriglesworth (1985)** *Liberal Paradoxes and Free Trade* and is implicit in **Nozick's** discussion of utility constraints.
  *   **Risk:** Your solution is functionally very close to **Gibbard's**. Gibbard says "Rights can be waived if Pareto optimal." You say "Pareto doesn't apply if Rights are exercised." In a 2-person, 3-state case, these often yield the same result.

  **The Hard Truth:**
  If the External Examiner knows the 1970s social choice literature well, they will recognize the "coordinate" move. **Do not claim you invented the idea of rights over dimensions.** Claim you are providing a *new normative justification* (the causal/constitutive line) for why that formalism is the correct one, whereas previous authors just stipulated it.

  **The "Hope Nobody Asks" Question:**
  *"Isn't this just Nozick's side-constraints translated into social choice notation?"*
  **Why it hurts:** If yes, you haven't advanced political philosophy; you've just translated Nozick into math.
  **Your Defense:** "Nozick forbids states. I forbid *comparisons*. Nozick leaves us with a set of permissible states and no way to choose between them. I provide a method for choosing (Pareto) that respects the constraints. I am building the aggregation function Nozick refused to build."

  ### Final Advice for the 10 Days
  1.  **Read Gibbard (1974) again.** Know exactly where you diverge.
  2.  **Harden the Causal/Constitutive line.** Write out 3 examples where it works and 1 where it fails. Know the failure case.
  3.  **Practice the "Domain Restriction" reply.** The Economist will hammer this. You must sound confident that restricting an *axiom's application* is different from restricting *preferences*.
  4.  **Don't bluff the Legal Theorist.** If you don't know a Hohfeldian term, admit it and pivot to the functional equivalent.

  Good luck. The argument is coherent, but the "Leakage" defense is where you will win or lose.
