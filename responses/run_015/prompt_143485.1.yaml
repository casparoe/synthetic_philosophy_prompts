          *   *Soft spot:* Social choice theory usually demands completeness.

  4.  **Refining the Voices:**
      *   *Econ:* Needs to sound technical. "Domain restriction," "Independence of Irrelevant Alternatives," "Arrovian framework."
      *   *Side-Constraints:* Needs to sound deontological. "Trumps," "Boundaries," "Moral space."
