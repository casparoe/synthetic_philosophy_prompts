  CONFIDENTIAL // INTERNAL USE ONLY
  **BRACON & FELL**
  **Project:** San Meridio National Cohesion Framework (NCF)
  **Doc:** ID-882 Style Guide & Implementation Protocols
  **Date:** Q3 Deliverable

  **1.0 ONTOLOGICAL DISTINCTIONS**
  1.1 Personnel must strictly differentiate between *Custom* and *Tradition*. Custom is flexible, organic, and low-stakes (e.g., dietary preferences, informal greetings). It adapts to user needs. Tradition is invariant, ritualized, and non-negotiable. It adapts the user to the state.
  1.2 The NCF delivers Traditions. Flexibility undermines authority. All deliverables must present as recovered legacies rather than new creations. The keyword is "Revival," never "Launch." A launched product has a version number; a revived tradition has only a lineage.

  **2.0 TEMPORAL POSITIONING**
  2.1 A functioning tradition cannot possess a verifiable start date. Any documentation citing a creation timestamp prior to Q1 constitutes a compliance breach.
  2.2 To achieve immemorial status, narratives must reach back past living memory. If a citizen recalls the inception, the tradition has failed. The objective is to create a past that feels longer than the future.
  2.3 Risk Register: High probability of citizens noting the state's recent founding. Mitigation: Frame all state functions as restorations of pre-colonial or pre-interregnum practices. The gap in history is where we operate.

  **3.0 ASYNCHRONOUS SYNCHRONICITY (THE FEED PROBLEM)**
  3.1 Client Note: San Meridio lacks a print-literacy public sphere. Citizens operate within individually ranked personalized feeds. There is no shared clock or common content stream. The standard mechanism for imagining the nation—simultaneous consumption—is technically impossible.
  3.2 We must engineer "Asynchronous Synchronicity." The nation must be imagined serially, not concurrently.
  3.3 **The Anthem:** Do not schedule a national broadcast. The anthem must be served via API during each citizen's peak-engagement window. Metrics indicate emotional receptivity is highest during dopamine spikes. The flag waves when the user is most likely to swipe.
  3.4 **The Minute of Silence:** A simultaneous server-wide silence risks dropout. Instead, implement staggered observance. Each user experiences 60 seconds of muted content, but the timestamp varies by user ID. The illusion of shared sacrifice is maintained via post-event social tagging ("I observed at 14:02," "I observed at 14:05"). The aggregate data creates the unity the experience lacks.
  3.5 KPI: Perceived simultaneity must exceed 85% despite actual temporal fragmentation.

  **4.0 MATERIAL CULTURE & PROVENANCE**
  4.1 The National Museum faces a provenance risk. Citizens are aware artefacts were fabricated last quarter.
  4.2 Do not conceal fabrication. Reframe it. Artefacts are "Symbolic Proxies." The value lies not in historical authenticity but in contemporary fidelity. A fake relic that inspires real loyalty is superior to a real relic that inspires nothing.
  4.3 Display protocol: Use lighting and plinth placement to suggest antiquity. Avoid carbon dating inquiries. If challenged, classify inquiries as "attacks on heritage."

  **5.0 ALGORITHMIC FRICTION**
  5.1 Personalized feeds create echo chambers that inhibit national cohesion. Users are never shown dissimilar fellow citizens. The census and map do the imagining, but the feed undoes it.
  5.2 Implement "Civic Friction Quotas." 5% of every feed must be dedicated to content featuring demographics the user typically ignores or dislikes.
  5.3 This friction is not optional. It is the tax paid for national belonging. The user experience will degrade slightly; this is a feature, not a bug. It forces the imagination of the community by interrupting the comfort of the algorithm.

  **6.0 COMPLIANCE & DATING**
  6.1 Never publish a calendar year for any tradition. Use relative dating ("The Season of Harvest," "The Cycle of Renewal").
  6.2 If pressed for a date, refer to "Time Immemorial" or "Pre-Interregnum."
  6.3 A tradition which is working is one nobody can put a date on. If a date exists, it can be counted. If it can be counted, it has an end. We are building for perpetuity.
  6.4 All staff are reminded: We are not building a country. We are optimizing a legacy environment.

  **END OF DOCUMENT**
