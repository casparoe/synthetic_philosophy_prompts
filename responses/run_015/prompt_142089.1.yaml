answer: |-
  ### I. The Correspondence Table

  Your friend's argument relies on a structural mapping between a retired scientific theory (Source) and our current mentalistic vocabulary (Target). Here is the explicit correspondence required for her analogy to hold.

  | Feature | Source Domain (Humors / Phlogiston) | Target Domain (Folk Psychology / Fiction) |
  | :--- | :--- | :--- |
  | **The Posits** | Black bile, Phlogiston, Caloric fluid. | Beliefs, Desires, Intentions, Fears. |
  | **Observable Symptoms** | Fever, lethargy, combustion, heat expansion. | Speech, bodily movement, facial expression, choices. |
  | **Method of Inference** | Physician observes symptoms, infers hidden fluid. | Observer sees behavior, infers hidden mental state. |
  | **Function of Posits** | To predict and control physical outcomes (cure, burn). | To predict and manage social behavior (interaction, narrative). |
  | **Predictive Failure** | Treatments fail; combustion calculations mismatch mass. | Predictions of behavior fail; neural scans show no "belief" locus. |
  | **Successor Science** | Germ theory, Oxidation chemistry, Thermodynamics. | Mature Neuroscience, Cognitive Physics. |
  | **The "Quaintness"** | Medical texts prescribing bloodletting. | Novels describing characters as "believing" or "wanting." |
  | **Ontological Status** | Non-existent; nothing in the body matched the description. | Non-existent; nothing in the brain matches the description. |

  ### II. Sorting the Disanalogies

  Not all differences between the Source and Target undermine the argument. Some are merely incidental. Below, I sort the candidates you provided into those that are **Noise** (compatible with the friend's conclusion) and those that **Do Work** (fracture the analogy).

  **1. Theory vs. Skill/Practice (Does Work)**
  *   *The Issue:* Is "mindreading" a theory we learned (like chemistry) or a capacity we grew (like walking)?
  *   *Verdict:* **This does work.** If folk psychology is a theory, it can be falsified. If it is a constitutive skill or a mode of simulation, it cannot be "false" in the same way; it is the medium through which we access the data. A microscope is not falsified by the atoms it sees; it is the tool of seeing. If mental attribution is the tool of social seeing, neuroscience describes the substrate, but does not retire the tool.

  **2. Individuation by Content vs. Causal Job (Does Work)**
  *   *The Issue:* Phlogiston was defined by physical properties (weight, substance). Beliefs are defined by *content* (what they are about) and *rational relations* (consistency with other beliefs).
  *   *Verdict:* **This does work.** You cannot find "the belief that Paris is in France" in a neuron because neurons do not have semantic content in isolation. The posit is not a physical object waiting to be found; it is a relational status. Declaring it non-existent because it lacks physical boundaries is a category error, like declaring "marriage" non-existent because you cannot find it in a blood sample.

  **3. Normative vs. Causal Work (Does Work)**
  *   *The Issue:* Humors explain causes (why the fever happened). Beliefs justify actions (why he *should* be blamed, or why his promise *counts*).
  *   *Verdict:* **This does work.** Neuroscience can explain the causal chain of a hand moving, but it cannot explain the *obligation* of a promise. The vocabulary of belief/desire carries normative weight (responsibility, meaning). A successor science that only describes causal flux cannot replace a vocabulary that manages normative status.

  **4. Self-Refutation (Noise)**
  *   *The Issue:* Can the eliminativist state their thesis without using beliefs?
  *   *Verdict:* **This is Noise.** Even if the thesis is self-refuting, it doesn't save the literary practice. A paradox can still be true. This attacks the philosopher's consistency, not the analogy's mapping of the practice.

  **5. Useful Fiction / Map Contours (Does Work)**
  *   *The Issue:* Can we keep the vocabulary if it works, even if the ontology is false?
  *   *Verdict:* **This does work.** This is the decisive point for your craft. We still use "sunrise" knowing the earth turns. We still use "center of gravity" knowing there is no heavy dot in the object. If the vocabulary is retained for utility, the "quaintness" charge fails. Fiction relies on utility (meaning-making), not ontological precision.

  ### III. Smuggled Assumptions in the Source Domain

  The Source Domain (retired science) smuggles in three assumptions that do not apply to the Target (mental vocabulary), which biases the verdict before the argument begins.

  **1. The Assumption of Discovery vs. Stipulation**
  *   *Source:* Phlogiston was hypothesized to explain pre-existing data. It was a guess about the world.
  *   *Target:* In your practice, mental states are often *stipulated*. You do not guess what the character believes to explain their movement; you decide the belief, and the movement follows. In reading, the reader does not hypothesize to predict; they interpret to understand. The Source assumes a *backward-looking inference*; the Target involves *forward-looking creation* and *hermeneutic reconstruction*.

  **2. The Assumption of Independent Existence**
  *   *Source:* Humors were thought to exist independently of the observer.
  *   *Target:* Beliefs, in the context of fiction (and arguably in social reality), exist *dependently* on the interpretive framework. A move in a game only exists relative to the rules. If the vocabulary is part of the framework that constitutes the reality (social reality), it cannot be "disproven" by looking at the physical substrate, any more than checking the wood of a chess piece disproves the Queen.

  **3. The Assumption of Retirement by Prediction Failure**
  *   *Source:* Theories are retired when they fail to predict new data.
  *   *Target:* Folk psychology is rarely retired in daily life even when predictions fail (we say "he was irrational," not "he has no beliefs"). More importantly, fiction is not retired when it fails to predict reality; it is valued when it reveals truth about *experience*. The criterion for retirement in the Source is *predictive accuracy*; the criterion for survival in the Target is *interpretive resonance*.

  ### IV. The Verdict

  Does the conclusion your friend drew survive the audit? **No.**

  The analogy fails to carry the weight of the conclusion because it conflates three distinct claims that must be separated. Here is the breakdown:

  **Claim 1: The posits (beliefs/desires) do not exist as neural objects.**
  *   *Verdict:* **Plausible.** Your friend is likely correct that you will not find a "belief" in a scan the way you find a tumor. If "exist" means "is a discrete physical structure," then beliefs do not exist.
  *   *Weight:* This concession costs you nothing. Fiction never claimed beliefs were tumors.

  **Claim 2: The vocabulary ought to be withdrawn from serious description.**
  *   *Verdict:* **False.** This does not follow from Claim 1. As established in the "Useful Fiction" and "Normative Work" disanalogies, vocabulary can be ontologically lightweight but pragmatically indispensable. We do not withdraw "currency" because it is only paper; we do not withdraw "checkmate" because it is only wood. The vocabulary manages norms and meanings that neuroscience does not address. Withdrawal is not mandated by reduction.

  **Claim 3: The literary practice built on it is on borrowed time (is "quaint").**
  *   *Verdict:* **False.** This is the critical failure of your friend's argument.
      *   *Reason:* Fiction does not operate on the *predictive* model of the Source Domain. It operates on the *stipulative* and *interpretive* model of the Target.
      *   *Explanation:* A novel about melancholy is not "quaint" because humors were false, *unless* the novel was claiming to be a medical textbook. If the novel is exploring the *experience* of melancholy, the medical falsity of humors is irrelevant. Similarly, a novel about belief is not exploring neural topology; it is exploring the *logic of action and meaning*.
      *   *Conclusion:* Even if neuroscience replaces folk psychology for *causal explanation*, it does not replace it for *meaning constitution*. As long as humans act for reasons, feel responsibility, and communicate meanings, the vocabulary of belief and desire remains the native tongue of that reality. Fiction records that reality, not the neural substrate. Therefore, the practice is not on borrowed time.

  **Final Ruling:** The analogy successfully suggests that beliefs are not physical objects (Claim 1), but it fails completely to prove that the vocabulary should be abandoned (Claim 2) or that fiction is obsolete (Claim 3). The "quaintness" charge relies on the assumption that fiction is a failed prediction engine. It is not. It is a machine for generating meaning.

  ### V. A Better Analogy

  If the Humors/Phlogiston analogy fails, you require one that preserves your friend's physicalism (the brain is the hardware) while securing your practice's reality (the story is the software).

  **The Best Fit: The Queen in Chess.**

  *   **How it preserves the Friend's View:** There is no "Queenship" in the wood or plastic. If you analyze the material composition of the piece, you will find no trace of its power to move diagonally. A mature "physics of chess pieces" would find no such property. In this sense, the Queen is not a physical object.
  *   **How it saves Your Practice:** Despite having no physical correlate, the Queen is undeniably *real* within the game. Its moves are constrained, its capture matters, and its value is objective *relative to the system*. You cannot replace talk of "the Queen" with talk of "carved wood" without losing the game entirely.
  *   **Application to Fiction:** Beliefs and desires are like the Queen. They are not things in the head (the wood); they are roles in a system of rationality and social interaction (the game). Neuroscience describes the wood; Literature describes the game.
  *   **Why it works:** It allows you to concede that there is no "ghost in the machine" (satisfying the philosopher) while insisting that the moves of the machine constitute a reality that cannot be described by physics alone (satisfying the writer). The vocabulary is not a false theory about the wood; it is a true description of the game. And as long as we play the game, the vocabulary is not quaint; it is essential.
