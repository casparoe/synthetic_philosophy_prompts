      *   **Conflict:** Artistic vision/story needs vs. ethical obligation to the deceased and surviving family.
      *   **Constraints:** American English, maximum 300 words.

  2.  **Identify the Core Ethical Issues:**
      *   **Defamation/Reputation:** Accusing a real person of corruption without evidence, especially when family contradicts it.
      *   **Consent:** The subject is dead; the family objects.
      *   **Genre Expectations:** "Based on a true story" implies factual grounding. Inventing a moral failing crosses into fiction.
      *   **Relationship:** Writing about a family member adds a layer of personal betrayal.

  3.  **Evaluate Potential Solutions:**
      *   *Disclaimer:* Often insufficient for defamatory claims about recognizable people. Doesn't erase the stain on reputation.
      *   *Name Change:* Changes the contract with the reader. If it's fiction, it should be marketed as fiction.
      *   *Keeping the status quo:* Risks alienating family, potential legal issues (depending on jurisdiction/defamation laws regarding the dead), and ethical breach.

  4.  **Formulate Advice:**
      *   Acknowledge the artistic value but prioritize the ethical weight.
      *   Highlight that "based on a true story" creates an expectation of truthfulness regarding core character traits.
      *   Suggest that changing the name and marketing as fiction is the strongest ethical path. It preserves the story while protecting the real person's legacy.
      *   Note that disclaimers don't fully absolve the author of misrepresenting a recognizable real person's morality.
      *   Emphasize the relationship with the living family.

