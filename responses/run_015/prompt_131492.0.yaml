prompt: |-
  I'm a software engineer with no formal training in philosophy, and I'm drafting a one-page proposal for a three-month interdisciplinary study grant that pairs conceptual ethics with ideas from my own field. My half-formed idea concerns the WEIRD psychology finding that folk moral judgments vary systematically across cultures—particularly in domains like harm, fairness, and authority—while still showing some invariant structure. In machine learning, we treat training-set agreement with suspicion: performance on a narrow distribution often masks out-of-distribution failure, and we distinguish robust features from sampling artifacts using adversarial evaluation and feature-stability tests under distribution shift. I want to ask whether an analogous conceptual diagnostic can be applied to moral psychology. Specifically: when cross-cultural moral agreement survives, does it indicate genuine moral objectivity, or does it merely reflect shared evolutionary or ecological background conditions that are themselves contingent? And can we formalize that distinction without committing to a specific metaethical theory?

  Please turn this into a formal research proposal that includes: a precise statement of the question that has a determinate answer rather than a broad literature survey; an explanation of why the standard universalist and relativist positions leave this open—namely, that both treat the cross-cultural dataset as transparent rather than as potentially biased by over-representation of Western, educated, industrialized, rich, and democratic populations; the proposed method, which must be conceptual rather than empirical, using analogs of distribution-shift testing and adversarial perturbation applied to three documented divergence domains (harm, fairness, authority/purity), with a clear month-by-month plan for the three-month scope; an honest account of what success and failure would look like—success being a tractable criterion that separates invariant moral content from spurious invariance, failure being either the collapse of the analog into pure universalism or pure relativism, or the analog proving purely decorative; and a realistic risk assessment, including the danger of metaphor overstretch and the need to avoid leaning on specific evolutionary-psychology or neurobiological mechanisms I am not equipped to defend. Do not include a bibliography, citation list, reading recommendations, or requests for named references; I will supply those myself. Keep the framing accessible to a non-philosophical review panel but conceptually sharp enough that the project is not reducible to "apply ML to ethics."
