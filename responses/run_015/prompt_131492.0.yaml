answer: |-
  **Project Title:** Robust Moral Invariance: A Conceptual Diagnostic for Cross-Cultural Ethics Using Distribution-Shift Analogs

  **Principal Investigator:** [Your Name]
  **Duration:** 3 Months
  **Field:** Interdisciplinary (Conceptual Ethics / Machine Learning Theory)

  **1. Research Question**
  Does there exist a formal criterion, analogous to feature stability under distribution shift, that distinguishes contingent moral convergence from robust moral invariance without presupposing moral realism or anti-realism?

  **2. Problem Statement**
  Current debates in metaethics regarding universalism and relativism treat cross-cultural moral data as transparent. Universalists interpret cross-cultural agreement as evidence of objective moral truth; relativists interpret disagreement as evidence of cultural construction. Both positions overlook a critical sampling bias: the majority of available moral psychology data comes from WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations. In machine learning, training on a narrow distribution leads to overfitting, where a model learns spurious correlations rather than robust features. Standard ethical inquiry lacks a diagnostic tool to determine whether observed moral agreement reflects genuine invariant structure or merely shared contingent background conditions (ecological, economic, or evolutionary) common to the sampled populations.

  **3. Proposed Method**
  This project will not employ empirical machine learning models on human subjects. Instead, it will develop a *conceptual analog* of ML validation techniques to test moral theories. I will treat specific moral intuitions as "model outputs" and cultural/ecological contexts as "training distributions." The core method involves constructing **adversarial thought experiments** that function as distribution-shift tests.

  I will apply this diagnostic to three documented domains of moral divergence:
  *   **Harm:** Testing whether prohibitions against violence hold when ecological scarcity makes harm necessary for survival (shifting the cost function).
  *   **Fairness:** Testing whether equality-based judgments hold when hierarchical distribution maximizes group stability (shifting the optimization goal).
  *   **Authority/Purity:** Testing whether sanctity judgments hold when secular frameworks remove contamination risks (shifting the input features).

  By systematically varying background parameters while holding the moral structure constant, I will assess whether the moral judgment remains stable (robust) or collapses (overfitted).

  **4. Work Plan (3 Months)**
  *   **Month 1: Formalizing the Analog.** Map ML validation concepts (loss landscapes, adversarial perturbations, out-of-distribution generalization) to ethical concepts (moral intuitions, thought experiments, contextual variance). Define the criteria for "conceptual robustness" that avoids metaethical commitment.
  *   **Month 2: Domain Application.** Construct the adversarial thought experiments for Harm, Fairness, and Authority. Analyze existing cross-cultural data through this lens to identify where current theories fail the stability test.
  *   **Month 3: Framework Synthesis.** Draft the final criterion for distinguishing contingent convergence from robust invariance. Evaluate the framework against the success conditions defined below.

  **5. Success and Failure Conditions**
  *   **Success:** The production of a tractable diagnostic criterion that allows ethicists to label specific moral agreements as "contingently stable" or "robustly invariant" without resolving the underlying metaethical debate. The analog must yield different classifications than standard universalist/relativist analysis.
  *   **Failure:** The project fails if (a) the analog collapses into pure universalism (assuming all stable features are true) or pure relativism (assuming all shifting features are false); or (b) the ML terminology proves purely decorative, adding no analytical power over existing philosophical methods (e.g., reflective equilibrium).

  **6. Risk Assessment**
  *   **Metaphor Overstretch:** The primary risk is conflating mathematical robustness with normative validity. To mitigate this, the proposal explicitly frames the ML concepts as *heuristics for conceptual clarity* rather than proofs of moral truth. The output is a methodological framework, not a moral solver.
  *   **Empirical Overreach:** As a software engineer, I am not equipped to defend specific evolutionary-psychology or neurobiological mechanisms. The project will remain strictly conceptual, treating evolutionary backgrounds as abstract parameters rather than biological claims.
  *   **Disciplinary Reception:** There is a risk of rejection by traditional ethicists as "scientism." The writing will prioritize philosophical rigor, using ML theory only to structure the argument, ensuring the project is reducible to neither "apply ML to ethics" nor a standard literature survey.
