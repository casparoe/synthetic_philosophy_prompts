answer: |-
  Your hypothesis is correct, but it underestimates the depth of the mismatch. You suggest the deadlock is partly an "accounting error"—different questions under one name—and partly "bedrock." I argue it is almost entirely the latter, but not in the way you frame it. The stalemate persists not because the parties are confused about *which* version of separateness they are debating, but because they are operating with incommensurable conceptions of what moral theory is *for*.

  Here is the diagnosis.

  ### 1. Which Version Does the "Real Work"?
  You list four variants: sources of reasons, aggregation limits, metaphysics/epistemology, and intuitive labeling.
  **None of these is the engine.** They are symptoms.

  The version of separateness doing the real work in the strongest objections (Rawls, Nozick, Scanlon) is the **Normative Significance of Distribution**.

  *   **The Utilitarian Claim:** Distribution is derivative. It matters only instrumentally (e.g., diminishing marginal utility). The fundamental moral fact is the *sum* of value.
  *   **The Separateness Claim:** Distribution is constitutive. *Who* gets the benefit is a fundamental moral fact, independent of the sum.

  When Parfit argues that persons are not deeply distinct metaphysically, he is attacking the *metaphysical* variant. When Harsanyi argues that rational choosers behind a veil would maximize expected utility, he is attacking the *rationality* variant. But the contractualist does not care if persons are metaphysically shallow or if aggregation is rational in a decision-theoretic sense. Their claim is that even if those things were true, morality requires us to treat the boundary between persons as a ** justificatory barrier**.

  The "real work" is done by the intuition that **sacrifice requires justification to the sacrificer.** Utilitarianism justifies sacrifice to the *universe* (the sum is higher). Separateness demands justification to the *individual* (why you?). As long as the utilitarian argues about the size of the sum, and the contractualist argues about the standing of the individual, they are not just talking past each other; they are playing different games. One is optimizing a state of affairs; the other is regulating relationships.

  ### 2. Do the Rejoinders Engage the Strong Version?
  **No.** The standard utilitarian battery attacks weaker siblings because the strong version is immune to their weapons.

  *   **The Veil of Ignorance (Harsanyi):** This reduces morality to individual prudence under uncertainty. It assumes that if you don't know who you are, you should treat social choice like individual choice. The separateness objection replies: *But I am not everyone.* The veil is an epistemic device, not an ontological merger. Once the veil lifts, the person who suffered the sacrifice is still distinct from those who gained. The utilitarian rejoinder dissolves the boundary epistemically; the objection insists the boundary remains normatively.
  *   **Parfit's Reductionism:** This is the most famous attempt to dissolve the objection. If personal identity is just psychological connectedness, the boundary between "me-now" and "me-later" is as fuzzy as "me" and "you." Therefore, intra-personal trade-offs and inter-personal trade-offs are on a continuum.
      *   *Why it fails:* Even if identity is reductionist, *consciousness* is not. I do not feel your pain. The phenomenological boundary is absolute, even if the metaphysical one is fuzzy. Morality is concerned with the locus of experience, not the continuity of memory. Parfit shows the boundary is arbitrary metaphysically, but not that it is irrelevant morally.
  *   **The Rationality of Aggregation:** This argues that refusing to aggregate is irrational. But this begs the question. It assumes the only valid form of rationality is instrumental maximization. If morality is about constraints (side-constraints), then "refusing to aggregate" is not irrational; it is the definition of the moral stance.

  The utilitarian rejoinders succeed only if you already accept that the *Good* (value states) is prior to the *Right* (constraints on action). If you start with the *Right*, the rejoinders look like category errors.

  ### 3. Do Reconciliations Make It Tractable?
  You mention treating separateness as a constraint on aggregation or grounding it elsewhere.

  *   **Prioritarianism/Sufficientarianism:** These attempt to weight the utility function to respect separateness (give priority to the worse off).
      *   *Verdict:* This is a surrender, not a reconciliation. It admits that the sum alone doesn't matter. It saves utilitarianism only by ceasing to be utilitarianism. It makes the dispute tractable by dissolving one side.
  *   **Scanlonian Contractualism:** Grounding separateness in "reasonable rejection." An act is wrong if it could be reasonably rejected by someone burdened by it.
      *   *Verdict:* This is the strongest formulation because it stops trying to derive the boundary from metaphysics or rationality. It posits the boundary as the starting point of morality. However, it does not "solve" the debate; it codifies the stalemate. It tells us *why* we care about separateness (justification to others), but it doesn't prove to the utilitarian that they are wrong. It simply offers a rival foundational axiom.

  There is no reconciliation that satisfies both sides because the dispute is about **monism vs. pluralism**. Utilitarianism is monistic (one master value: welfare). Separateness is pluralistic (welfare matters, but so does the distribution of welfare, and these can conflict). You cannot reconcile monism and pluralism without one side abandoning its core commitment.

  ### 4. Is Your Hypothesis Wrong?
  Your hypothesis that this is an "accounting error" is partially wrong. It implies that if we sorted the complaints correctly, we might find agreement. We won't.

  The debate *has* moved, but you are mistaking movement for noise because the movement has been away from foundational proofs and toward **structural clarification**.
  *   **Population Ethics:** The Non-Identity Problem and the Repugnant Conclusion have forced utilitarians to admit that "separateness" issues arise even without fixed populations.
  *   **Risk and Uncertainty:** Recent work (e.g., by Buchak, Lazar) on risk ethics shows that utilitarianism requires risk-neutrality. If you are risk-averse (which most people are), you get something like prioritarianism. This shifts the debate from "separateness of persons" to "attitudes toward risk." This is progress: it isolates the disagreement to a parameter in decision theory rather than a metaphysical mystery.

  However, the core deadlock remains. The utilitarian says risk-aversion in morality is irrational bias. The contractualist says risk-neutrality is moral blindness.

  ### 5. What Would Progress Look Like?
  Since this is bedrock, "progress" will not look like a proof or a refutation. It will look like **mapping the costs**.

  1.  **Abandon the Quest for a Single Foundation:** Progress looks like admitting that neither "maximize the good" nor "respect the boundary" is the single source of all value. We need a hybrid theory (e.g., a threshold deontology or a pluralistic consequentialism). The debate stalls because both sides want to be the *only* show in town.
  2.  **Focus on "Hard Cases" that Split the Factions Differently:** The trolley problem is exhausted. We need cases where utilitarianism and contractualism yield the *same* answer but for different reasons, or where the "separateness" intuition conflicts with other deontological intuitions. For example, cases of **aggregation across small burdens**. (Can a million people with a headache outweigh one person's death?) Utilitarians say yes. Strict contractualists often say no. But many find "no" implausible. Finding a principled way to allow *some* aggregation without collapsing into utilitarianism is the actual frontier (e.g., Frazier's work on aggregation).
  3.  **Reframe as a Conflict of Ideals:** Stop asking "Which theory is true?" and start asking "Which ideal is appropriate for this domain?" Separateness might be the correct ideal for **basic rights and bodily integrity**, while utilitarian aggregation might be the correct ideal for **public policy and resource allocation**. Progress looks like domain specificity rather than global supremacy.

  ### Summary Diagnosis
  Your reading group is stuck because you are trying to solve a **normative** problem with **metaphysical** and **decision-theoretic** tools.
  *   The Utilitarians are arguing: "The boundary isn't real (metaphysics) / You'd cross it if you were rational (decision theory)."
  *   The Contractualists are arguing: "The boundary is morally sacred (normativity)."

  The utilitarian rejoinders do not engage the strong version because the strong version is an axiom, not a conclusion. It is the claim that morality begins where mere rational optimization ends.

  **The Verdict:** The debate is calcified because it is a clash of foundational axioms (Agent-Neutrality vs. Agent-Relativity). No formal result can settle it. Progress requires abandoning the hope that one side will win and instead developing a robust pluralism that specifies *when* the separateness of persons trumps aggregation and when it does not. If your group continues to look for a knockout argument, you will meet for another ten years. If you shift to mapping the trade-offs, you might finish the book.
