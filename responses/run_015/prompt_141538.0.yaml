answer: |-
  The *Autonomic Codex* is a leather-bound volume resting on a desk, its thousands of pages composed of translucent vellum coated in heat-sensitive ink and interconnected by microscopic bimetallic springs. Ambient temperature fluctuations cause specific pages to expand and shift laterally against one another without the book opening, altering the light absorption of underlying layers and triggering further spring-driven adjustments in a closed feedback loop. This internal mechanical shuffling maintains a dynamic, homeostatic equilibrium of page alignments and ink states that evolves continuously in response to environmental inputs, preserving a complex causal history within the physical configuration of the closed volume itself without any external reader or hidden electronic components.

  **Verdicts and Reasoning**
  **Functionalism:** Conscious. The theory holds that mental states are defined by their causal roles within a system. Since the *Codex* maintains a homeostatic, input-sensitive causal organization isomorphic to a mind via its mechanical feedback loops, the substrate (paper and ink) is irrelevant; the functional pattern suffices for consciousness.
  **Biological Theory:** Not Conscious. This theory ties consciousness strictly to organic metabolism and neural physiology. Because the *Codex* is composed of dead, non-metabolic materials (vellum, ink, metal) lacking biological life processes, it cannot possess mental states regardless of its mechanical complexity.

  **Feature Doing the Work**
  The single feature driving the divergent verdicts is the **inorganic substrate** realizing the functional organization. If this feature is removed—meaning the book's pages and springs are replaced by biologically equivalent organic tissue capable of the same mechanical shifts—while holding the causal organization fixed, the Biological verdict flips to "Conscious" (as it is now alive), converging with the Functionalist verdict. Conversely, if the *functional organization* were removed (making the book static), Functionalism would flip to "Not Conscious," while Biological would remain "Not Conscious," highlighting that Functionalism hinges on the organization while Biological theory hinges on the material.

  **Attack on the Case**
  The Functionalism defender, saddled with the less appealing result that a book is conscious, might attack the case as cheating by arguing that the object is **no longer really a book**. They could claim that once a volume possesses internal mechanical agency and homeostatic feedback, it crosses the category boundary into "machine" or "organism," thereby dissolving the thought experiment's premise about whether a *book* specifically can be conscious.
