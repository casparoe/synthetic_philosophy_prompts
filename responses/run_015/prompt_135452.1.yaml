answer: |-
  **Pass 1: Brainstorming Lockean Premises**

  *   **Property is Prior to Government:** Men enter society to preserve property. If seigniorage destroys real value, it violates the end of government. *Cut:* Against Veredia.
  *   **Majority Consent binds All:** Regarding money for public good, the majority decision binds the minority. *Cut:* For Veredia (referendum passed).
  *   **Tension:** Can majority consent authorize the destruction of minority property (annuitants) via inflation? Locke protects property against arbitrary taking, even by majorities.
  *   **Money is Conventional:** Value rests on consent/convention, not just substance. *Cut:* Ambiguous. Allows regulation, but forbids fraud.
  *   **Tacit vs. Express Consent:** Possession implies consent to laws. *Cut:* For Veredia regarding residents; Against Veredia regarding non-residents holding marks.
  *   **Transparency/Arbitrary Power:** Locke opposes hidden exactions. *Cut:* Against Veredia (inflation is less visible than tax).
  *   **Uncertainty:** Locke wrote on specie debasement, not fiat inflation targeting. Extrapolation required on whether "purchasing power" counts as "estate."

  ***

  **Pass 2: The Veredian Seigniorage**

  **The Mechanism of Dilution**
  For Locke, the question turns on whether the purchasing power of a holding constitutes part of a man's "estate." Locke distinguishes between the physical coin and its value, arguing the latter rests on common consent. However, he maintains that once value is established by convention, altering it to the detriment of holders is a violation of property. In Veredia, no physical mark is removed, yet the real value of the estate diminishes. While Locke does not explicitly address fiat purchasing power—his context was silver content—the principle suggests that systematically reducing the value of claims held by subjects amounts to a taking. The state is effectively appropriating a portion of every holder's real wealth without specific assignment.

  **Locating the Injury**
  Not all losses carry equal Lockean weight. The strongest objection lies with the non-resident holders. They owe no obedience, possess no land, and have no vote; yet their holdings are diluted without consent. This is plainly unjust, as they stand outside the social contract. Next are the old annuitants. Locke fiercely defended creditors against debasement, arguing that fixed contracts create a property right in the *value* promised, not merely the nominal unit. Diluting their income violates the public faith. For resident account holders, the injury is mitigated by indexation up to a cap, but the uncapped portion remains vulnerable. The practical impossibility of exit strengthens the claim of coercion; if one cannot leave without ruin, tacit consent is compromised. The legal-tender law matters less than the inability to contract outside the inflating currency.

  **The Counterfactual Tax**
  Suppose Veredia levied an explicit 4 percent tax instead. Locke's verdict would likely be more favorable. He distinguishes between arbitrary power and regulated taxation. An explicit tax is transparent; the subject knows what is taken and consents through representatives. Inflation is a covert exaction. For Locke, hidden transfers resemble the arbitrary prerogative he condemns in the *Second Treatise*. The difference reveals that his objection is not merely to the transfer of wealth—which taxation permits—but to the manner of taking. Covert dilution undermines the trust necessary for civil society, whereas open taxation preserves the clarity of the contractual relationship between government and subject.

  **Consent and Residence**
  Locke distinguishes express consent (making one a permanent member) from tacit consent (enjoyment of dominions). Continuing residents give tacit consent by holding land and using currency. However, tacit consent binds one to obey laws, not necessarily to surrender property without clear agreement. The fact that the rule is announced matters; it reduces arbitrariness. Yet, for the annuitant who cannot renegotiate, announcement offers no remedy. For the non-resident, there is no consent at all, express or tacit, as they enjoy no protection of the Veredian government. They are merely used as a resource, which Locke would likely condemn as a state of war-like extraction.

  **The Limits of the Framework**
  Here the framework strains. Locke assumes money has an intrinsic standard (silver). He does not settle whether a state can manage a fiat standard for macroeconomic ends. Furthermore, Locke assumes taxation is the only legitimate revenue; he does not explicitly theorize state profit from money creation. He would have to extend his doctrine on "public faith" to cover price stability. Finally, Locke is vague on whether majority consent can legitimize a scheme that harms a specific minority class (annuitants) disproportionately. He might be forced to revise his confidence in majority rule when property rights are structurally undermined rather than explicitly taxed.

  **Comparative Verdict**
  By Locke's lights, Veredia's arrangement is morally worse than the taxation it replaced. While the end (public goods) is legitimate, the means involve covert taking and violate specific contracts (annuities). Taxation, though a burden, is an open agreement preserving the integrity of value. Seigniorage preserves the nominal unit but corrupts the measure of value itself, introducing uncertainty into all private dealings. It substitutes hidden fraud for open contribution.

  **A Word from the Author**
  "To the Committee for Sound Money: You argue rightly that property is prior to government. Though the majority has voted, they possess no authority to dissolve the estate of the minority through hidden means. Money is the common measure of commerce; to alter its weight secretly is to defraud the creditor and the labourer alike. The non-resident owes you no allegiance, yet you take his substance. The annuitant contracted for value, not mere marks. To say he consented because he remains is to say a man consents to be robbed because he lacks the strength to leave. This is not the rule of law, but the prerogative of a master. Restore the public faith, or acknowledge you govern by force, not consent."

  **Meta-Note**
  I am most confident reconstructing Locke's defense of annuitants and non-residents, as these align with his specific writings on coinage and foreigner rights. I am extrapolating significantly on the moral equivalence of fiat inflation versus specie debasement, as Locke lacked a concept of managed floating currency.
