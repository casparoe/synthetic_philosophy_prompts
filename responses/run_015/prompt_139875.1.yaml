prompt: |-
  I am teaching a seventy-five-minute session on informational cascades and rational herding to the second-year undergraduates in my Philosophy and Public Policy course: roughly forty of them, drawn from philosophy, economics and politics, who have had a term of probability — they can read a likelihood ratio and move between odds and probabilities without flinching — but no economics and nothing in social epistemology, and who will have been assigned nothing for this session. I do not need the explanation itself; I need a plan for delivering it.

  What I want the session to turn on is a claim I have become convinced of but have never managed to teach cleanly: that the engine of a cascade is not irrationality, deference or social pressure but the compression of a private signal into a publicly legible action, so that what is lost downstream is not anyone's reasoning but the evidential strength, and the remedy is therefore structural rather than exhortatory — aggregate likelihood ratios, not recommendations. I want that claim to be the spine of the session, not a moral I announce at the end.

  So, first: in what order must the pieces come, and what exactly depends on what? Must they have the notion of an independent private signal of fixed and moderate accuracy before they watch anyone move in sequence? Is it better to let a cascade form in front of them, and only then give them the vocabulary for what they have just seen, or does that guarantee they will describe it as copying? Where does the contrast between the simultaneous case, where many independent signals really do aggregate, and the sequential case, where observed actions are all anyone has, properly belong — before or after they have felt how compelling the simultaneous inference is?

  Second, the case that carries the session. I want one example that does the whole job, and I want to know what it must contain and what it must not. My instinct is that a binary decision under a genuinely common value, with anonymous agents rewarded only for accuracy, is essential, and that anything with reputational stakes, career incentives or a visibly corrupt majority has to be excluded from the carrying case — but I am not certain, and I want the reasoning. My usual candidate is a hiring committee that interviews in sequence and votes by show of hands; tell me whether to keep it and, if not, what replaces it. And tell me why I should or should not build the session around the examples my students will already half-know from elsewhere: restaurant queues, urns with red and blue balls, fashions and fads, review scores.

  Third, the misconceptions, and where in the sequence each should be headed off. I can predict several: that a cascade is simply conformity or peer pressure under a technical name (which is why I am unsure whether to introduce reputational herding first as a contrast or to withhold it until the pure informational case has landed); that if every agent updates correctly on everything she observes, the group's outcome must be rational, or must at least converge on the truth as numbers grow; that crowds are usually right, so a cascade is a marginal inefficiency rather than the foreclosure of all further evidence; that a cascade can always be broken by one well-informed dissenter, when the visible unanimity overstates the evidence and an agent who has simply arrived late cannot tell whether the three votes ahead of her were three independent signals or one signal followed by two acts of copying; and that the remedy is to tell people to think independently or to reward accuracy, neither of which touches the information structure. Which of these must be defused before the machinery is in place and which only after the students have felt their pull, and which others should I expect and have not listed?

  Finally: what should I openly decline to explain in seventy-five minutes, and say aloud that I am declining it — I am inclined to leave out the general question of whether more public information can make a group worse off, and everything that would require strategic complementarities — and what single question should I put to them at the end that would show me the compression point has landed, as opposed to the slogan that a cascade is when people copy each other?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 2nd-year undergrads (Philosophy, Economics, Politics). ~40 students.
      *   **Background:** 1 term of probability (comfortable with likelihood ratios, odds/probs). No economics, no social epistemology. No prep for this session.
      *   **Duration:** 75 minutes.
      *   **Core Thesis:** Cascades are driven by *information compression* (private signal $\to$ public action), not irrationality/pressure. Remedy is structural (aggregate likelihood ratios), not exhortatory.
      *   **Goal:** A delivery plan, not the content itself.
      *   **Specific Questions to Answer:**
          1.  Order of operations (signals before sequence? simultaneous vs. sequential contrast?).
          2.  The Carrying Case (hiring committee? urns? restaurants? what to include/exclude?).
          3.  Misconceptions (when to head them off: conformity, rationality of updating, crowd wisdom, dissenter power, remedies).
          4.  Scope Limits (what to explicitly exclude) & The Final Question (to test understanding).

  2.  **Deconstruct the Core Thesis:**
      *   The "Engine" is *compression*. Private info is rich (continuous or high-res); Public action is binary (coarse).
      *   Once the public action history outweighs the private signal, rationality *demands* ignoring the private signal.
      *   Therefore, it's not "copying" (social); it's "calculating" (epistemic).
      *   Therefore, the fix isn't "be brave"; it's "reveal the math" (likelihood ratios).

  3.  **Address Question 1: Order of Operations:**
      *   *Constraint:* Students have no prep. They need intuition before formalism, but the formalism (Bayes) is their strength.
      *   *Sequence:*
          1.  Establish the *value* of independent aggregation (Simultaneous).
          2.  Introduce the *constraint* of sequential observation (Sequential).
          3.  Demonstrate the *tipping point* (where public history > private signal).
          4.  Reveal the *mechanism* (compression).
      *   *Why:* If you show the cascade first, they will label it "copying." If you show simultaneous aggregation first, they see the *potential* of the group, making the loss in the sequential case feel like a structural failure, not a behavioral one.
      *   *Signals:* Yes, they need the notion of independent private signals of fixed accuracy *before* seeing the sequence. Otherwise, they assume the early movers are just "experts."

  4.  **Address Question 2: The Carrying Case:**
      *   *Candidate:* Hiring Committee (sequential votes, show of hands).
      *   *Critique:* Good, but "voting" implies preference aggregation, not truth-seeking. Students might conflate "I think they are good" with "I want them hired."
      *   *Better:* The Urn Experiment (Bikhchandani, Hirshleifer, Welch). It's the canonical model for a reason. It isolates *common value* (what is in the urn?) from *private value* (do I like this?).
      *   *Why exclude others:*
          *   Restaurants/Queues: Introduces congestion/externalities (I don't want to eat where it's crowded). Confuses informational with payoff interdependence.
          *   Fashion/Fads: Introduces coordination/coordinating on the *same* thing, not the *true* thing.
          *   Review Scores: Too complex (continuous, weighted).
      *   *Decision:* Use the Urn model but *narrativize* it as a Hiring Committee or Investment Committee to keep it policy-relevant. Let's stick to the **Urn** for the mechanics but frame it as a **Policy Decision** (e.g., "Is this drug safe?"). Actually, the prompt suggests the Hiring Committee is the user's instinct. I should advise refining it to ensure it's a *common value* problem (Is the candidate *actually* good?, not Do we *want* to hire?).
      *   *Refinement:* Keep the Hiring Committee but strictly define the goal: "Maximize accuracy of hiring decision," not "Get along with colleagues." Remove reputational stakes.
      *   *Why:* It fits Public Policy. Urns are too abstract for a 75-min policy class. But the Urn logic must underpin the Hiring example.
      *   *Recommendation:* Use a hybrid. A "Policy Committee" deciding on a binary state of the world (e.g., "Is the bridge safe?"). Each gets a private inspection report (signal). They announce verdicts sequentially.

  5.  **Address Question 3: Misconceptions:**
      *   *Conformity/Pressure:* Head this off *immediately*. Define the game rules: Payoff depends on accuracy, not agreement.
      *   *Rational Updating/Convergence:* Address this *after* the cascade forms. Show that rational updating *causes* the cascade.
      *   *Crowd Wisdom:* Contrast simultaneous vs. sequential *before* the cascade locks in.
      *   *Dissenter Power:* Address this *at the climax*. Show that a late dissenter is ignored not because of bullying, but because their signal is mathematically swamped.
      *   *Remedy (Exhortation):* Address this at the *end*. Show why "think for yourself" fails.
      *   *Missing Misconception:* "The first movers are always right." (Need to show the cascade can lock onto the *wrong* answer).

  6.  **Address Question 4: Scope & Final Question:**
      *   *Exclude:* Strategic complementarities (Keynesian beauty contests), reputation models (Scharfstein/Stein), endogenous information acquisition (why would I check if others know?). Keep it exogenous signals.
      *   *Final Question:* Needs to test the "compression" insight. Not "What is a cascade?" but "How do we fix the information loss?"
      *   *Idea:* Ask them to design a voting mechanism that prevents the loss. If they say "secret ballot," they get it (restores independence). If they say "debate," they might miss it (debate is still sequential). If they say "report confidence levels," they hit the bullseye (likelihood ratios).

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Minute 0-10:* Setup & Simultaneous Baseline. (The "Wisdom of Crowds" intuition).
      *   *Minute 10-25:* The Sequential Constraint. (The Hiring/Urn scenario). Run the simulation.
      *   *Minute 25-40:* The Math of the Tipping Point. (Use their probability skills). Show where Private Signal < Public History.
      *   *Minute 40-55:* The "Wrong" Cascade & The Dissenter. (Show it locks on falsehoods; show why dissent fails).
      *   *Minute 55-65:* The Remedy. (Structural vs. Exhortatory).
      *   *Minute 65-75:* Q&A and Final Assessment.

      *   *Refining the "Carrying Case":* I need to be firm here. The Hiring Committee is risky because of "politics." The Urn is too abstract. I will suggest a **Safety Inspection Committee**. Binary state (Safe/Unsafe). Private test (Pass/Fail with known accuracy). Public verdict (Safe/Unsafe). This removes reputation and preference.

      *   *Refining the "Misconceptions":* The biggest one is "Irrationality." I need to make sure they calculate the Bayesian update *during* the session. Since they know likelihood ratios, I can put a specific number on the board. Signal accuracy = 2:1 odds. When does public history exceed 2:1? After 2 identical votes.

      *   *Refining the "Final Question":* "You are the chair. You observe a cascade forming. You cannot change the agents' incentives. What procedural change restores the group's ability to use all available information?" Answer: Secret ballots or reporting likelihoods, not public sequential declarations.

  8.  **Final Review against Constraints:**
      *   75 minutes? Yes, the timing looks tight but doable.
      *   No prep? Yes, relies on in-class logic.
      *   Probability skills? Yes, leverage the likelihood ratio knowledge.
      *   Core Thesis? Yes, "Compression" is the thread.

  9.  **Constructing the Output:** (Organizing by the user's four specific prompts, then providing the timeline). *Self-Correction during drafting:* Ensure I explicitly answer *why* the hiring committee might be dangerous (preference vs. truth) and how to sanitize it. Ensure I explain *why* simultaneous must come first (to establish the loss).

      *(Self-Correction on the Final Question)*: The prompt asks for a question that shows the "compression point" has landed. Asking for a remedy is good, but asking them to identify *what* is lost is more direct. "What specific data point is missing from the public record that prevents the third agent from updating correctly?" Answer: The strength of the first two agents' private signals.

      *Wait, better:* "If you could change one rule to prevent the information loss, without changing the agents' incentives, what would it be?" This forces the structural solution.

      *Let's go with the "What is lost" question for diagnosis and the "Rule change" for remedy.* I'll suggest the Rule Change one as the primary "exit ticket."

  10. **Final Polish:** Tone should be collegial, precise, and respectful of the instructor's expertise. Acknowledge the difficulty of the "compression" insight.

  **(Post-Drafting Check):** Did I answer the specific sub-questions?
  1. Order? Yes (Simultaneous -> Sequential -> Math -> Implications).
  2. Case? Yes (Sanitized Committee/Urn hybrid).
  3. Misconceptions? Yes (Mapped to timeline).
  4. Scope/Final Question? Yes (Excluded reputation/strategic; Final Q on structure).

  Okay, ready to write.s
answer: |-
  This is a precise pedagogical challenge. You are asking students to override a deep intuitive heuristic (that social agreement implies social pressure or shared preference) with a counter-intuitive epistemic claim (that social agreement implies information loss). Because they have the probability tools but not the economic vocabulary, you must use the math to bypass the sociology.

  Here is the plan for the seventy-five minutes, structured by your four constraints.

  ### 1. The Order of Operations

  You must establish the **value of independence** before you demonstrate the **cost of sequence**. If you begin with the cascade, they will categorize it as "following the leader." If you begin with aggregation, they will feel the loss of the cascade as a structural failure.

  **The Sequence:**
  1.  **The Simultaneous Baseline (Minutes 0–15):** Establish that independent signals aggregate to truth. Use their probability skills here. Show that $N$ independent signals of moderate accuracy yield near-certain knowledge.
  2.  **The Sequential Constraint (Minutes 15–30):** Introduce the rule change. Agents move one by one. They see prior *actions*, not prior *signals*.
  3.  **The Tipping Point (Minutes 30–50):** Calculate the exact moment where the public history outweighs the private signal. This is the "compression" moment.
  4.  **The Lock-In (Minutes 50–60):** Show that once tipped, the cascade is robust against contrary private information and can lock onto the *false* state.
  5.  **The Remedy (Minutes 60–75):** Structural solutions vs. exhortation.

  **Dependency:** They absolutely need the notion of an independent private signal of fixed accuracy *before* watching anyone move. Without this, they will assume the first mover is an expert or has better data. You must stipulate: "Everyone has the exact same quality of data; no one is an expert."

  **Simultaneous vs. Sequential:** Place the contrast *before* the cascade forms. Have them calculate the group accuracy if everyone voted at once. Then, run the sequential simulation. The gap between those two numbers is the "deadweight loss" of the cascade. This makes the cascade feel like an efficiency failure, not a behavioral quirk.

  ### 2. The Carrying Case

  **Verdict:** Keep the **Committee**, but sanitize it rigorously. Discard the Urn (too abstract for Policy students) and Restaurants (introduces payoff externalities).

  **The Setup:** A "Safety Inspection Committee."
  *   **The State of the World:** A bridge is either **Safe** or **Unsafe** (Common Value).
  *   **The Goal:** Maximize accuracy of the verdict. Payoff is 1 for correct, 0 for incorrect. No reputational stakes. No career incentives.
  *   **The Signal:** Each inspector gets a private test result: **Pass** or **Fail**.
  *   **The Accuracy:** The test is imperfect but better than chance (e.g., 2:1 likelihood ratio). If the bridge is Safe, 2/3 chance of Pass. If Unsafe, 2/3 chance of Fail.
  *   **The Action:** Inspectors announce "Safe" or "Unsafe" sequentially.

  **Why this works:**
  *   **Binary Decision:** Keeps the math on the board simple (odds).
  *   **Common Value:** Eliminates "I vote Safe because I want the bridge open." It forces "I vote Safe because I believe it is Safe."
  *   **Excluded Elements:** You must explicitly state what is *not* in the room. No reputational damage for being wrong. No penalty for dissenting. No "team spirit." If you leave these in, students will attribute the cascade to peer pressure. You must drain the social pressure so the informational pressure becomes visible.

  **Why not the examples they know?**
  *   *Restaurant Queues:* Implies congestion (I don't want to wait) or taste correlation (we all like pizza). This confounds informational cascades with payoff interdependence.
  *   *Urn Balls:* Perfect for economists, but Philosophy/Politics students often disengage from "balls in an urn" as toy models unrelated to policy.
  *   *Fashion/Fads:* Implies coordination on *arbitrary* standards, not truth-seeking.

  **Refinement on the Hiring Committee:** If you use Hiring, students will worry about "fit" or "diversity" or "politics." The Safety Committee isolates the epistemic problem. If you must use Hiring, frame it strictly as "Will this candidate succeed?" (Truth) rather than "Should we hire?" (Preference).

  ### 3. Misconceptions and Timing

  You cannot head these off all at once. You must let some tension build so the math resolves it.

  | Misconception | When to Defuse | How |
  | :--- | :--- | :--- |
  | **"This is just conformity/pressure."** | **Minute 0.** | Stipulate the payoffs explicitly. "You are rewarded for accuracy, not agreement. You are anonymous." |
  | **"Crowds are usually right."** | **Minute 15 (Baseline).** | Show the Simultaneous case works. Then show the Sequential case fails. The crowd is only wise if signals are independent. |
  | **"Rational updating leads to truth."** | **Minute 40 (Tipping Point).** | This is the core. Show that *because* they update rationally, they ignore their private signal. Rationality *causes* the cascade. |
  | **"One dissenter can break it."** | **Minute 50 (Lock-In).** | Show that Agent 5, seeing 4 "Safe" votes, calculates the public odds are overwhelming. Even if their private signal is "Unsafe," the rational move is "Safe." The cascade is robust. |
  | **"The remedy is to think harder."** | **Minute 60 (Remedy).** | Show that exhortation fails because the agent *has* thought hard and concluded their signal is noise. The fix must be procedural. |
  | **"Early movers are experts."** | **Minute 15.** | Reiterate: All signals have identical accuracy (e.g., 67%). |

  **One Missing Misconception:** "The cascade always locks onto the truth." You must ensure the simulation runs a scenario where the first two agents get misleading signals (e.g., Bridge is Unsafe, but both get "Pass" results). The cascade then locks onto "Safe." This proves the fragility of the system.

  ### 4. Scope Limits and The Final Question

  **What to Explicitly Decline:**
  In the first five minutes, draw a boundary. Say:
  *"Today we are modeling **Informational Cascades**. We are explicitly excluding **Reputational Herding** (copying to look good) and **Payoff Interdependence** (copying because your reward depends on others' actions). We assume everyone wants the truth and is rewarded only for accuracy. We do this not because the other factors don't exist, but because we need to see that the cascade happens even when they are absent."*

  Also exclude: *Endogenous information acquisition.* (i.e., "Why did I bother checking the bridge if everyone else said it was safe?"). Assume signals are costless and exogenous.

  **The Final Question:**
  Do not ask "What is a cascade?" Ask a design question that forces them to identify the compression.

  *"You are the Chair of this Committee. You cannot change the inspectors' incentives (they still want accuracy), and you cannot change the accuracy of their tests. You observe that the sequential public voting is causing information loss. What **single procedural change** do you implement to restore the group's ability to use all available information?"*

  **Desired Answer:** "Secret ballots" (restores independence) OR "Report likelihood ratios/confidence instead of binary votes" (prevents compression).
  **Failure Answer:** "Tell them to speak up" (exhortation) or "Fire the first two voters" (doesn't solve the structural issue for the next group).

  ---

  ### The 75-Minute Timeline

  **00–05: Framing & Boundaries**
  *   Define the goal: Truth-seeking under sequential observation.
  *   State the exclusions (no reputation, no payoff interdependence).
  *   State the assumption: All agents are Bayesian updaters (leverage their probability term).

  **05–15: The Simultaneous Baseline (The "Should" Case)**
  *   Board work: Prior odds 1:1. Signal Likelihood Ratio 2:1.
  *   Ask: If 5 agents vote simultaneously, what are the posterior odds if all vote "Safe"?
  *   Calculation: $1 \times 2^5 = 32:1$. Near certainty.
  *   Point: Independence aggregates power.

  **15–25: The Sequential Constraint (The "Is" Case)**
  *   Change the rule: Agents announce one by one.
  *   Agent 1: Votes signal. (Public info = 1 signal).
  *   Agent 2: If signal matches Agent 1, votes signal. (Public info = 2 signals).
  *   Agent 3: **The Pivot.**
      *   Scenario A: Signal matches history. Votes signal.
      *   Scenario B: Signal contradicts history.
      *   Calculation on board: Public history = 2 signals (4:1 odds). Private signal = 1 signal (2:1 odds).
      *   Rational choice: Ignore private signal. Vote with history.
  *   **Key Phrase:** "Agent 3 is not copying. Agent 3 is calculating that their own eyes are less reliable than the track record of the first two."

  **25–40: The Compression Mechanism**
  *   This is the spine. Explain *why* Agent 3's signal is lost to Agent 4.
  *   Agent 4 sees three "Safe" votes. They do not know if that is 3 independent signals or 1 signal + 2 calculations.
  *   They must assume the latter (rationality).
  *   Therefore, Agent 4 faces the same math as Agent 3.
  *   **Visual:** Draw a funnel. Wide private information entering the top, narrow public action exiting the bottom. The "spill" is the evidential strength.

  **40–55: The Wrong Cascade & Robustness**
  *   Run the "Bad Luck" scenario. Bridge is Unsafe. Agents 1 & 2 get false "Pass" signals.
  *   Cascade locks on "Safe."
  *   Agent 10 gets a "Fail" signal. What do they do?
  *   Math: Public history (9 votes) vs Private (1 vote).
  *   Result: Agent 10 votes "Safe." The truth is buried.
  *   Address the "Dissenter" misconception: A late dissenter is rationally ignored.

  **55–65: The Remedy (Structural vs. Exhortatory)**
  *   Ask: "How do we fix this?"
  *   Reject: "Tell them to be brave." (They are being rational).
  *   Reject: "Make them experts." (Signals are fixed).
  *   Accept: Change the **channel**.
      *   Option A: Secret Ballot (Restores Simultaneous Baseline).
      *   Option B: Reveal Likelihoods (Report "67% confidence" rather than "Safe").
  *   Connect to Policy: Why do we use secret ballots for juries/committees? Not to hide shame, but to preserve information.

  **65–75: Final Question & Discussion**
  *   Pose the Design Question (see above).
  *   Collect answers.
  *   Close with the thesis: "The cascade is not a failure of reasoning. It is a failure of bandwidth. We compressed a probability into a binary, and we cannot decompress it downstream."

  ### Instructor Notes for Delivery

  *   **Board Work:** Keep the Likelihood Ratios visible on the left side of the board throughout. Do not erase the math. The visual accumulation of odds is what convinces them it is rational.
  *   **Tone:** When Agent 3 ignores their signal, do not frame it as a tragedy. Frame it as a triumph of rationality. "Agent 3 is doing exactly what you would do." This prevents them from distancing themselves from the error.
  *   **The "Aha" Moment:** Watch for the moment they realize Agent 4 cannot distinguish between "3 signals" and "1 signal + 2 copies." That is the compression point. If they miss it, stop and ask: "What does Agent 4 *not* know that Agent 3 *did* know?"
