      *   *Move 6 (Marcus):* Claims this reduces "injustice" to "misdiagnosis" (which happens to everyone), stripping the specific "knower" aspect.
      *   *Move 7 (Dora):* Final point: The harm is *hermeneutical*/self-doubt. Mum stopped trusting her own reporting (harm to her as a knower), regardless of the physical outcome.

  3.  **Evaluate Each Move (Drafting the Analysis):**

      *   *Move 1 (Dora):* Is it epistemic injustice? Fricker defines testimonial injustice as a credibility deficit due to prejudice. "Middle-aged woman with vague complaints" is a known stereotype (hysteria, menopause, anxiety).
          *   *Verdict:* Dora is strong here. This fits the definition well.
      *   *Move 2 (Marcus):* Is it just base rates/efficiency? Triage is real. Vague symptoms *are* usually stress. But is it truly identity-neutral? Studies show women's pain is taken less seriously.
          *   *Verdict:* Marcus has a point about resource constraints, but his claim of neutrality is empirically shaky. He's partially right on the *mechanism* (triage), wrong on the *neutrality*.
      *   *Move 3 (Dora):* Are base rates biased? Yes. If historical data under-diagnoses women, the "normal" baseline is skewed. This is "structural bias."
          *   *Verdict:* Dora is right. Medical data has known gender gaps (e.g., heart attacks).
      *   *Move 4 (Marcus):* Is it unfalsifiable? This is a philosophical objection. If *everything* is biased, does the term lose meaning? It's a risk, but not a certainty. We can compare like-with-like (e.g., men vs. women with same symptoms).
