  ### 4. Empty Cells and Incoherence

  *   **Political Authority + Formal Stratigraphic Marker:** This cell is vacant because it is incoherent. If the authority to settle the definition belongs to legislatures or publics (Political Authority), the requirement for a physically datable horizon in the rock record (Formal Marker) is rendered secondary or irrelevant. You cannot demand a democratic vote *and* a golden spike in the sediment simultaneously.
  *   **Volcanic Yes + Renaming Views:** This cell is vacant because it is logically inconsistent. If a visitor answers "Yes" to the Volcanic Counterfactual (the signal matters regardless of cause), they cannot consistently hold a Renaming view (Capitalocene, etc.), which relies on specific human culpability to justify the name change.
  *   **Holocene+ + The Ratchet:** This cell is vacant because it is contradictory. If the Earth is still in the Holocene (Holocene+), then by definition no irreversible threshold (Ratchet) has been crossed that would warrant a new designation.

  ---

  ### 5. Collisions and Indistinguishability

  *   **Collision: Industrial Onset (Stratigraphic) vs. Industrial Onset (Normative).**
      *   **The Issue:** A visitor arriving via the "Rock/Signal" path (choosing Soot/Coal) and a visitor arriving via the "Story/Threshold" path (choosing Technology/Industry) will land on leaves with the same date and similar names.
      *   **Why:** Both views identify the 19th century, but for different reasons (one for carbon isotopes, one for social machinery).
      *   **Resolution:** Keep them as distinct leaves to preserve the reasoning difference, but visually group them on the touchscreen so visitors see they converge on the same century.
      *   **Extra Question to Separate:** "If we invented a clean engine tomorrow that left no chemical trace, would the Industrial Revolution still mark the start of the epoch?" (Yes = Normative; No = Stratigraphic).

  *   **Collision: Capitalocene vs. Plantationocene.**
      *   **The Issue:** Both are "Renaming (System)" views that overlap historically and materially.
      *   **Why:** Slavery and Capitalism are deeply intertwined in the period both views identify.
      *   **Resolution:** Flag this as a "Family of Views" on the display.
      *   **Extra Question to Separate:** "Is the primary driver the pursuit of profit (Capital) or the organization of land and labor through coercion (Plantation)?"

  ---

  ### 6. Exposure of Your Commitments

  The tree exposes two tensions in your "Ratchet" view that you should prepare for before the advisory board meeting:

  1.  **The Retrospection Problem:** Your Ratchet criterion relies on *irreversibility*. However, irreversibility is often only visible in retrospect. A visitor answering the tree might ask: "How do we know it's irreversible *now*?" If the answer is "We don't," then the Ratchet cannot function as a boundary marker for the present, only for the future. This weakens its utility as a "date" compared to the Stratigraphic view, which prioritizes markers that are visible immediately.
  2.  **The Volcanic Contradiction:** In your argument, you stated that if a volcano produced the same signature, your date would *not* move (because irreversibility is what matters, not blame). However, in the tree, answering "No" to the Volcanic Counterfactual (i.e., "It's not the Anthropocene if humans didn't do it") is the only path that leads away from Stratigraphy toward Normative views. If you answer "Yes" (Volcano counts), you are funneled toward the Stratigraphic/Diachronous leaves. To reach your Ratchet leaf, you must answer "No" (Human cause matters), which implies blame *is* doing the work, contradicting your claim that "blame is not doing the work." You will need to clarify that "Human Cause" is a necessary condition for the Ratchet, even if "Blame" is not the sufficient one.
