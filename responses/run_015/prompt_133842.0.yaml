  ### 3. The Leaves

  | Leaf Name | Statement | Awkward Commitment |
  | :--- | :--- | :--- |
  | **Formal Mid-Century** | The epoch begins with the global spike in radionuclides from nuclear testing in the 1950s. | We ignore centuries of earlier damage to get a clean chemical signal. |
  | **17th-Century Orbis** | The epoch begins with the drop in atmospheric CO2 caused by Indigenous population collapse and reforestation. | Genocide and land abandonment are the markers of a new geological epoch. |
  | **Industrial Onset** | The epoch begins with the widespread adoption of steam power and coal combustion in the 1800s. | We blame the technology more than the people who built and used it. |
  | **Deep Onset** | The epoch begins thousands of years ago with the spread of agriculture and rice cultivation. | Hunter-gatherers lived in nature, but farmers broke it. |
  | **Diachronous View** | There is no single date; the human impact spread at different speeds in different places. | There is no "now" that is the same for everyone on Earth. |
  | **Event/Process** | The Anthropocene is a happening or crisis, not a time unit, and should not be dated as an epoch. | We cannot date the thing we are still living through. |
  | **Political Authority** | The authority to settle this belongs to affected publics and legislatures, not stratigraphers. | Science does not get the final say on what counts as truth. |
  | **Holocene+** | Nothing epochal has happened; this is just the Holocene with people in it. | Humans aren't actually powerful enough to change the planet's geological story. |
  | **The Ratchet** | The boundary is the earliest moment the Earth system could no longer return to its previous trajectory without intervention. | We might not know we crossed the line until it is too late to fix it. |
  | **Capitalocene** | The culprit is the mode of production and profit accumulation, not humanity as a species. | Geology is politics by other means. |
  | **Plantationocene** | The culprit is the plantation-and-slavery complex that reorganized land and labor globally. | Modern wealth is built on a geological foundation of forced labor. |
  | **Plasticene** | The subject should be renamed to highlight the permanence of synthetic materials in the record. | Our most enduring legacy is waste that does not decay. |
  | **Pyrocene** | The subject should be renamed to highlight humanity's relationship with fire and combustion. | We are defined by what we burn, not just what we build. |

