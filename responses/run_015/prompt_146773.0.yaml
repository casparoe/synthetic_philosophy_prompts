  Three retired chemists are arguing over coffee about political philosophy.

  The Negative Libertarian says, "Freedom is simple: it's the absence of steric hindrance. As long as nothing is physically blocking my orbitals, I'm free."

  The Positive Libertarian shakes his head. "No, freedom is having the ionization energy to act. You need the capacity to break bonds on your own."

  The Republican sighs and stirs his coffee. "You're both missing the point. Freedom isn't about whether you *can* react, or whether something *is* reacting. It's about whether you're in a coordinate covalent bond."

  The Negative Libertarian laughs. "But what if the donor atom is benevolent? What if it provides the lone pair but never withdraws it? There's no interference at all!"

  The Republican puts down his spoon. "It doesn't matter. You didn't provide the electrons. You're dependent on its goodwill for your valence shell."

  "So what am I?" asks the Negative Libertarian.

  "You're not a free radical," says the Republican. "You're just **coordinated**."
