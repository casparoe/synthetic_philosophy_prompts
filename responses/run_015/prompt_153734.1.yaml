      *   *Check:* Is the Limbo argument strong? *Correction:* This is the strongest challenge to HOT. Emphasize that Limbo feels *more* real than reality. If HOT makes things conscious, Limbo suggests a hyper-conscious state with *broken* HOTs.
      *   *Tone Check:* Keep it dense but readable. Avoid "In this essay I will..." Use active analysis.

  5.  **Final Review against constraints:**
      *   No bibliography? Yes.
      *   No Matrix stuff? Yes.
      *   Focus on Rosenthal/HOT? Yes.
      *   Address Totem, Mal, Limbo, Elevator? Yes.
      *   Critical balance (holds/breaks)? Yes.

