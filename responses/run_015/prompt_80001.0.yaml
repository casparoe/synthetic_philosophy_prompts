answer: |-
  Here is an audit of the "window" metaphor, structured to isolate where it functions descriptively and where it fails epistemologically, specifically regarding your two constraints (objectification and systematic silence).

  ### 1. The Correspondence Table

  To audit the metaphor, we must first formalize the colleague's mapping. In the "Archive as Window" model, the relationship between the researcher and the past is optical and passive.

  | Metaphor Component | Role in the Metaphor | Corresponding Archival Element |
  | :--- | :--- | :--- |
  | **The Window** | The mechanism of access. | The Archive (the institution/collection). |
  | **The Glass** | The transparent medium; ideally invisible. | The Records (the documents themselves). |
  | **The Frame** | The physical limit of the view. | Provenance/Scope (what was saved vs. lost). |
  | **The Light** | The condition allowing visibility. | Legibility/Context (language, survival of ink/paper). |
  | **The View** | What the observer perceives. | The History (the narrative you construct). |
  | **The Thing Outside** | The objective reality independent of the window. | The Past (the community as it actually lived). |

  **The Colleague's Claim:** The glass may have smudges (random damage, hard handwriting), but these are incidental. If the researcher cleans the glass (interpretation), the View matches the Thing Outside. The Glass does not alter the light; it transmits it.

  ### 2. The Disanalogies

  Here we test the mapping against your two specific features of the material.

  #### Feature 1: People as Objects of Administration
  *In the records, people are data points (taxpayer, defendant), not authors.*

  *   **The Window Expectation:** The "Thing Outside" (the person) exists independently of the "Glass." If I stand outside, I am a whole person; the window merely lets you see me.
  *   **The Archival Reality:** The "Glass" *creates* the "Thing Outside." A neighbor does not exist in the archive as a neighbor, a parent, or a friend. They exist *only* insofar as the administrative state required them to be a "taxable unit" or "legal party."
  *   **The Disanalogy:** **Transformation vs. Transmission.** A window transmits an image; the archive transforms a life into a category. The record does not reflect the person; it reduces them to a function of the state.

  #### Feature 2: Gaps Track Administrative Purpose
  *Missing data is not random; it reflects what the office did not care about.*

  *   **The Window Expectation:** Obscurity is like dirt or fog—random, natural, or accidental. If you wipe the glass or wait for better light, you might see more.
  *   **The Archival Reality:** The "Glass" is etched or stained by design. The tax ledger does not record unpaid labor; the court docket does not record disputes settled without litigation. The silence is structural, not accidental.
  *   **The Disanalogy:** **Systematic Exclusion vs. Random Obscurity.** A dirty window hides things arbitrarily. An administrative archive hides things *categorically*. You cannot "look harder" to see the informal economy in a tax ledger; the glass is opaque to that wavelength of light.

  ### 3. Evaluation: Surface Mismatches vs. Structural Threats

  Your colleague's conclusion is that the archive affords **neutral, objective access**. To evaluate this, we must separate disanalogies that are merely physical (surface) from those that are epistemological (structural).

  #### Surface Mismatches (Do not threaten the conclusion)
  *   **Physical Durability:** Paper yellows and glass doesn't. This is a preservation issue, not an epistemic one.
  *   **Random Damage:** Water stains, torn corners, or faded ink. These are "random smudges." Your colleague is right that these are neutral obstacles; they hinder access but do not bias the content that *remains*.
  *   **Temporal Distance:** You look *through* a window, but you look *back* at an archive. This is poetic, not analytical.

  **Verdict:** These are interpretive challenges. They support the colleague's view that "residual distortion is a matter of the researcher's interpretation."

  #### Structural Disanalogies (Threaten the conclusion)
  *   **The Constitutive Gap (Feature 2):** Because the gaps track the *purpose* of the office, the archive is not a neutral container. It is a selection engine. If the archive only records property ownership, it presents a past where only property matters. This is not a distortion the researcher can interpret away; it is a distortion *baked into the evidence*.
      *   *Threat Level:* **Fatal.** It denies "neutral access" because the access is pre-filtered by the logic of the recorder.
  *   **The Ontological Reduction (Feature 1):** Because people appear as objects, the "Thing Outside" in the archive is not the "Thing Outside" in reality. The record does not show you the community; it shows you the state's *projection* of the community.
      *   *Threat Level:* **Fatal.** It denies "objective access" because the object being accessed is a bureaucratic construct, not the historical reality.

  **Conclusion on "Neutral Access":**
  The conclusion **does not hold up**. The "window" metaphor assumes the archive is a *passive repository* of pre-existing facts. Your material proves the archive is an *active producer* of facts. The distortion is not in the researcher's interpretation (the View); it is in the source's generation (the Glass). To claim neutral access is to mistake the state's categorization for the community's reality.

  ### 4. A Better Analogy

  If the archive is not a window, what is it? It needs to capture **transformation**, **systematic exclusion**, and **administrative purpose**.

  **The Better Analogy: The Prism**

  A window implies transparency (light passes through unchanged). A **prism** implies refraction (light passes through and is broken into specific spectrums determined by the shape of the glass).

  *   **Why it fits Feature 1 (Objectification):** When white light (a complex human life) enters a prism (the administrative record), it does not come out the other side as white light. It is split into distinct bands (taxpayer, litigant, voter). The prism forces the light to take a shape the glass can handle. You are not studying the light source; you are studying the spectrum the prism allows to emerge.
  *   **Why it fits Feature 2 (Systematic Gaps):** A prism does not transmit all wavelengths equally. Some are absorbed; some are bent. The "darkness" in the spectrum isn't an accident; it is a result of the angle of the glass. Similarly, the silences in your ledger are determined by the angle of the bureaucracy.
  *   **Why it fixes the Conclusion:** A researcher looking through a prism knows they must calculate the *refraction index* to understand the original light source. You cannot simply "report what you see." You must account for how the instrument changed the signal.

  **Alternative: The Map**
  If "Prism" feels too optical, consider **The Map**.
  *   A map is not the territory (the past).
  *   A map is drawn for a *purpose* (a tax map looks different from a road map).
  *   A map omits features irrelevant to its purpose (a subway map omits buildings).
  *   **Implication:** You are not looking *through* the map to see the territory; you are analyzing *why the map was drawn this way* to infer the territory.

  **Recommendation:**
  Use **The Prism** if you want to emphasize how the *nature* of the people is changed by the record. Use **The Map** if you want to emphasize how the *boundaries and silences* are determined by administrative purpose. Given your focus on people appearing as "objects of administration," **The Prism** is the sharper tool: it reminds your colleague that the archive does not transmit the past; it breaks it apart and rearranges it.
