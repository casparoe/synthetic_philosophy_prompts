answer: |-
  This is a precise request that cuts to the methodological heart of the debate. Your roommate (the environmental historian) and you (presumably arguing from a more materialist or stratigraphic position) are talking past each other because you are optimizing for different *goods*. The historian optimizes for **causal fidelity** (accurately representing human agency), while the stratigrapher optimizes for **correlatability** (accurately slicing time).

  To define a human-driven geological epoch, a theory must satisfy a specific set of desiderata. Below is the framework of requirements, categorized by their necessity, followed by the analysis of the logical contradiction you asked for.

  ### I. The Desiderata Framework

  #### A. Non-Negotiables (Stratigraphic Necessities)
  *These are required by the International Commission on Stratigraphy (ICS). If a theory fails these, it is not a geological epoch; it is a cultural period or a philosophical concept.*

  1.  **Stratigraphic Visibility (The "Rock Record" Test)**
      *   **Requirement:** The marker defining the boundary must be preserved in a physical medium (ice, sediment, rock, coral) that will survive for millions of years.
      *   **Why:** Geology deals with deep time. If the signal degrades (e.g., plastic degrades to microplastics then carbon, CO2 is absorbed by oceans), it cannot define a permanent boundary.
      *   **Constraint:** This excludes purely cultural markers (e.g., "the invention of the steam engine") unless they have a physical correlate.

  2.  **Global Correlatability (The "Synchronicity" Test)**
      *   **Requirement:** It must be possible to identify the boundary in multiple sections across the globe and correlate them to the same moment in time.
      *   **Why:** An epoch is a horizontal slice of time. If the "start" is 1800 in Europe but 1950 in the Pacific, you do not have a single epoch boundary; you have a diachronous process.
      *   **Constraint:** This is where your CO2 vs. Plutonium problem arises. CO2 rises gradually (hard to pinpoint a "year"); Plutonium spikes suddenly (easy to pinpoint).

  3.  **Durability (The "Deep Future" Test)**
      *   **Requirement:** The signal must persist distinct from the background noise of the Holocene for at least 10,000+ years.
      *   **Why:** To distinguish an epoch from a transient event (like a volcanic winter).
      *   **Constraint:** Short-lived isotopes don't count unless their decay products are distinct.

  4.  **Distinctness (The "Signal-to-Noise" Test)**
      *   **Requirement:** The marker must be statistically distinguishable from natural Holocene variability.
      *   **Why:** If the CO2 curve could be explained by a natural interglacial cycle, it's not the Anthropocene. The signal must exceed natural variance.

  #### B. Camp-Specific Preferences (The Battleground)
  *These are not required by geology, but are demanded by specific schools of thought (Environmental History vs. Hard Stratigraphy).*

  5.  **Causal Specificity (The Historian's Preference)**
      *   **Requirement:** The marker should link directly to a specific human mechanism (e.g., industrialization, agriculture) rather than an ambiguous signal.
      *   **Why:** To avoid "reducing culture to ice cores." A radionuclide spike tells us *when*, but not *why*.
      *   **Status:** **Preference.** Geology doesn't care about *why* the layer exists, only *that* it exists. History cares deeply about the *why*.

  6.  **Diachronic Accommodation (The Early Anthropocene Preference)**
      *   **Requirement:** The theory must account for pre-industrial human impacts (fire, *terra preta*, megafauna extinction) without ignoring them.
      *   **Why:** To acknowledge that humans altered ecosystems before 1950.
      *   **Status:** **Preference.** Stratigraphy generally treats pre-boundary signals as "precursors." If you move the start date to 10,000 BP to include agriculture, you risk making the Anthropocene synonymous with the Holocene, rendering the term useless.

  7.  **Regional Veto Power (The Decolonial/Localist Preference)**
      *   **Requirement:** Local stratigraphic committees should have weight in defining the boundary if the global signal is weak in their region.
      *   **Why:** The "Great Acceleration" signals hit the Global North first and hardest. A 1950 start date might be invisible in sediment cores from regions industrialized later.
      *   **Status:** **Preference.** ICS rules prioritize a single Global Boundary Stratotype Section and Point (GSSP). Local variation is handled via correlation, not veto.

  ---

  ### II. The Incompatibility Theorem

  You asked if there is a subset of these desiderata that is **jointly unsatisfiable**.

  **Yes.** There is a fundamental logical tension between **Causal Specificity (5)** and **Global Correlatability (2)** when applied to human systems.

  Here is the breakdown of the contradiction:

  #### 1. The Conflict: Process vs. Event
  *   **Human History is a Process:** Human impact on the earth is diachronous (happening at different times). Aboriginal fire management altered Australian stratigraphy 40,000 years ago. Amazonian *terra preta* altered South American soil chemistry 2,000 years ago. Industrial soot altered European ice 250 years ago.
  *   **Geological Epochs are Events:** To define a boundary (GSSP), you need a synchronous horizon. You need a single year (or narrow range) where the Earth switched from State A (Holocene) to State B (Anthropocene).

  #### 2. The Unsatisfiable Triad
  You cannot simultaneously hold these three positions:
  1.  **Strict Global Synchrony:** The start date must be the same year everywhere (e.g., 1950).
  2.  **Causal Fidelity:** The start date must reflect the *onset* of significant human alteration.
  3.  **Universal Inclusion:** The definition must acknowledge early, localized human alterations (fire, agriculture) as part of the same phenomenon.

  **Why they break:**
  *   If you choose **1950 (Plutonium)** to satisfy **Strict Global Synchrony**, you fail **Causal Fidelity**. You are ignoring 10,000 years of human ecosystem engineering. This validates your roommate's accusation: you are reducing culture to a nuclear spike.
  *   If you choose **10,000 BP (Agriculture)** to satisfy **Causal Fidelity** and **Universal Inclusion**, you fail **Strict Global Synchrony**. Agriculture did not start everywhere at once. The stratigraphic signal is muddy, local, and gradual. Geologists will reject this as a "facies change" rather than a time boundary.
  *   If you try to split the difference (e.g., 1610 Orbis Spike), you often fail **Stratigraphic Visibility** (the signal is too weak in some cores) or **Durability** (the CO2 dip recovered).

  #### 3. The "Reduction to Ice Cores" Problem
  Your roommate's critique is technically accurate regarding **Causal Specificity**.
  *   **The Geologist's View:** A plutonium layer is a perfect *time marker*. It doesn't matter that it's a byproduct of the Cold War; it matters that it settled globally in 1952-1954. It is a clock.
  *   **The Historian's View:** A plutonium layer is a terrible *historical explanation*. It privileges a specific Western technological moment over long-term indigenous land management.

  To satisfy the Geologist, you must treat the human cause as a "black box" that emitted a signal. To satisfy the Historian, you must open the box, which reveals that the signal is messy, uneven, and culturally specific. **You cannot have a clean stratigraphic line that also accurately represents messy historical causality.**

  ### III. Resolution Strategies (How the field actually handles this)

  Since the desiderata are jointly unsatisfiable, the field has fractured into two solutions. You need to know which one you are arguing for.

  **Solution A: The Formal Stratigraphic Approach (ICS)**
  *   **Sacrifices:** Causal Fidelity and Universal Inclusion.
  *   **Keeps:** Global Synchrony and Stratigraphic Visibility.
  *   **Result:** The Anthropocene is defined narrowly (likely 1950) as a *technical unit* for future geologists. It explicitly admits that human impact started earlier, but declares that the *geological signal* only became clear then.
  *   **Defense against Roommate:** "I am not defining the history of human impact; I am defining a chronostratigraphic unit. The 'Early Anthropocene' is a valid historical concept, but it is not a geological epoch."

  **Solution B: The Informal/Conceptual Approach (Earth System Science)**
  *   **Sacrifices:** Strict Global Synchrony (allows for a "transition zone" rather than a line).
  *   **Keeps:** Causal Fidelity and Universal Inclusion.
  *   **Result:** The Anthropocene is treated as a *process* or a *system state* rather than a rock layer. It acknowledges the "Great Acceleration" but allows the start date to be fuzzy.
  *   **Defense against Roommate:** "You are right that a single date reduces culture. That is why the Anthropocene should remain an informal term describing a shift in Earth System function, not a formal GSSP."

  ### Summary for your Debate
  If you want to win the argument without conceding the geology:

  1.  **Concede the Reduction:** Admit that *any* formal geological boundary necessarily reduces complex cultural history to a physical marker. That is the price of entry for geology.
  2.  **Shift the Burden:** Ask your roommate if they want a **historical period** (which can be fuzzy, cultural, and diachronous) or a **geological epoch** (which must be sharp, physical, and synchronous).
  3.  **The Knockout:** Point out that if they insist on including *terra preta* and fire management *and* demanding a single start date, they are asking for a logical impossibility (The Unsatisfiable Triad above). You can have deep history, or you can have a sharp line. You cannot have both.

  The "Anthropocene" works best as a **bridge term**: it uses geological authority to force historians to think about deep time, and uses historical nuance to force geologists to think about agency. But as a formal definition, it breaks where the rock record demands simplicity and history demands complexity.
