          *   Non-synchronous markers (Plutonium vs. CO2 vs. Plastics).
          *   Regional lag (signals appear later in some places).
          *   Distinction between early human impact (fire, *terra preta*) vs. globally synchronous stratigraphic alteration.
          *   Need to distinguish non-negotiable requirements from camp-specific preferences.
