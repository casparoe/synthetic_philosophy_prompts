answer: |-
  Here is the specification for a theory of Karmic Desert, structured to meet your constraints and isolate the structural tensions.

  ### The Spec: Requirements for Karmic Desert

  **1. The Fittingness Constraint (Non-Negotiable)**
  *   **Requirement:** The suffering experienced must be *proportionate* and *qualitatively linked* to the prior act, not merely causally downstream from it.
  *   **Consideration:** This distinguishes desert from consequence. If I lie and subsequently trip, that is causality. If I lie and subsequently lose the capacity to be believed (suffering the specific inversion of my act), that is fittingness. Without this, the theory collapses into "bad habits lead to bad outcomes."
  *   **Case Addressed:** *Currency Problem.* It demands a principled mapping between act-types and suffering-types, not just a magnitude scale.

  **2. The Vacuity Constraint (Non-Negotiable)**
  *   **Requirement:** There must be a possible state of affairs in which a person suffers *without* deserving it.
  *   **Consideration:** If the theory entails that *all* suffering is deserved (due to an infinite past), the concept of "desert" loses explanatory power. It becomes a tautology: "She suffers, therefore she must have deserved it." To be a theory, it must be falsifiable.
  *   **Case Addressed:** *The Beginningless Ledger.* This is the hardest constraint to meet. It requires either a statute of limitations, a cap on debt, or the admission that some suffering is random noise.

  **3. The Agency Constraint (Non-Negotiable)**
  *   **Requirement:** Desert must attach to *volition* (intention), not merely outcome.
  *   **Consideration:** Retributivism punishes the will. If karma tracks only results, the careful cruel person who accidentally saves a life generates "good" karma, which violates the intuition that they are morally blameworthy.
  *   **Case Addressed:** *Intention vs. Outcome.* This costs the theory simplicity. It requires a metaphysics that tracks mental states across lives, not just physical events.

  **4. The Identity Constraint (Non-Negotiable)**
  *   **Requirement:** The entity suffering must be the *same moral agent* who acted, under a criterion of identity stricter than mere causal continuity.
  *   **Consideration:** If "I" am just a causal vessel for a past agent I don't remember, this is vicarious punishment. Desert requires the debtor and the payer to be identical in the sense that matters for responsibility.
  *   **Case Addressed:** *The Branch Case.* If consciousness splits, desert cannot duplicate (that punishes an innocent copy) nor vanish (that lets the debtor off). It suggests desert requires a singular, non-fissile locus of agency.

  **5. The Recognition Constraint (Taste)**
  *   **Requirement:** The suffering agent must be capable, in principle, of recognizing the link between their suffering and their past act.
  *   **Consideration:** Retributivism is often communicative; it vindicates the moral order to the agent. If I suffer for a life I cannot recall and receive no explanation, the suffering is merely penal, not retributive. However, you might argue the *universe* recognizes the fit even if I don't.
  *   **Case Addressed:** *Asymmetric Memory.* If you mark this Non-Negotiable, you likely kill cross-life karma (since memory doesn't carry). If Taste, you can argue memory is irrelevant to the *fact* of desert, only to its *utility*.

  **6. The Non-Transferability Constraint (Taste)**
  *   **Requirement:** Moral debt cannot be paid by a third party, nor can merit be transferred to cancel another's debt.
  *   **Consideration:** If A can pay B's karmic debt, then B is not getting what they *deserve* (suffering); they are getting mercy. This conflicts with a strict desert model. However, if the goal is *soteriological* (ending suffering), transfer helps. If the goal is *justice*, transfer breaks it.
  *   **Case Addressed:** *Laundering.* Marking this Non-Negotiable preserves the "retributive" feel but contradicts many traditional soteriological mechanisms.

  **7. The Transformation Constraint (Taste)**
  *   **Requirement:** Genuine moral reform must alter the quantum of owed suffering.
  *   **Consideration:** If the debt remains fixed regardless of who the agent *now* is, karma is purely backward-looking vengeance. If the debt dissolves upon reform, karma looks forward-looking (concerned with future character).
  *   **Case Addressed:** *The Reformed Agent.* This is the fork. Hard desert says the debt remains. Rehabilitative views say it dissolves.

  ---

  ### The Incompatibility Cluster (The Trilemma)

  You cannot jointly satisfy these three requirements without significant metaphysical contortion:

  1.  **Beginningless Time** (No first moment of existence).
  2.  **The Vacuity Constraint** (Some suffering must be undeserved/falsifiable).
  3.  **Universal Karmic Causality** (All suffering is generated by karma).

  **Why:** If time is beginningless and karma is universal, every moment of suffering has a prior karmic cause ad infinitum. Therefore, *all* suffering is deserved. This violates Vacuity.
  **To fix it, you must drop one:**
  *   Drop **Beginningless Time**: Posit a first moment or a "reset" mechanism (statute of limitations).
  *   Drop **Vacuity**: Admit the theory is unfalsifiable (everything is deserved), risking tautology.
  *   Drop **Universal Causality**: Admit some suffering is random/biological/unrelated to karma (this saves the theory but weakens its scope).

  *Secondary Tension:* **The Recognition Constraint** + **Cross-Life Desert** + **No Punisher**. If there is no judge to explain the sentence, and no memory of the crime, the agent cannot recognize the fittingness. The "communication" of justice is lost.

  ---

  ### Scoring the Readings

  **1. Karma as Cross-Life Desert (Your Target)**
  *   **Fittingness:** High. (Explicitly aims for this).
  *   **Vacuity:** Low. (Struggles with the beginningless ledger; tends to explain all suffering as deserved).
  *   **Agency:** Medium. (Requires robust tracking of intention across death).
  *   **Identity:** Low. (Struggles with memory loss and fission cases).
  *   **Verdict:** Metaphysically expensive. It secures the "desert" intuition but risks unfalsifiability and incoherent identity conditions.

  **2. Karma as Causal Effects on Character (The "Spooky Consequentialism")**
  *   **Fittingness:** Low. (Suffering is instrumental for future improvement, not fitting for past wrongs).
  *   **Vacuity:** High. (Suffering can be useless/undeserved if it doesn't improve character).
  *   **Agency:** Medium. (Focuses on habits rather than specific volitions).
  *   **Identity:** High. (Psychological continuity is sufficient).
  *   **Verdict:** Philosophically safer, but fails your core purpose. It explains why suffering *happens*, not why it is *owed*. It collapses into the view you want to avoid.

  **3. Karma with Transferable Merit**
  *   **Fittingness:** Low. (If I pay your debt, the suffering is no longer fitted to *your* act).
  *   **Vacuity:** Medium. (Allows for debt cancellation, but creates new questions about the payer's desert).
  *   **Agency:** Low. (Decouples the agent from the consequence).
  *   **Identity:** Low. (Implies moral boundaries are permeable).
  *   **Verdict:** Soteriologically powerful (offers a way out), but structurally incompatible with "Desert." It is a theory of *Grace*, not *Justice*.

  ---

  ### The Killer Requirement

  **The Vacuity Constraint.**

  This is the single requirement that does the most work knocking candidates out.
  *   It kills **Traditional Orthodoxy**: Most traditional systems are designed to be all-encompassing; admitting undeserved suffering undermines the moral order they promise.
  *   It kills **Cross-Life Desert**: Unless you posit a "statute of limitations" or a non-karmic source of suffering (randomness), the beginningless ledger makes every instance of suffering "deserved" by definition.
  *   It forces the **Metaphysical Hand**: To satisfy Vacuity, you must either limit the power of Karma (it doesn't cause everything) or limit the timeline (there was a start, or debts expire).

  If you enforce Vacuity, you cannot have a tidy, all-explaining cosmic law. You must admit that sometimes bad things happen to people simply because the universe is noisy, and *that* is the only way to make the claim "this suffering is deserved" meaningful. Without the possibility of "undeserved," "deserved" has no content.
