answer: |-
  Here is a experimental design tailored to your constraints and philosophical aims, followed by an analysis of the operative variable and the views' commitments.

  ### The Protocol: The Kinematic Probe Pair

  **Patient and Objects**
  The patient is an adult with dense bilateral congenital cataracts, tested immediately upon dressing removal (Day 1). Visual acuity is expected to be low (approx. 20/200), with no prior pattern vision. The objects are two unfamiliar solids of roughly equal volume and matte/glossy switchable coating: a **Rhombic Dodecahedron** (12 flat faces, distinct edges, feels faceted) and a **Triaxial Ellipsoid** (continuous curvature, no edges, feels smooth). Pre-operatively, the patient has mastered haptic discrimination of these two objects (100% accuracy). They are given no verbal names or visual descriptions.

  **Screening (Constraint iii & vii)**
  Before the probes, a purely visual training session occurs. The patient views 2D animations on a screen (no 3D objects). They are trained to distinguish **"Continuous Optical Flow"** (a smooth gradient moving across a circle) from **"Discontinuous Optical Flow"** (sharp shifts in brightness moving across a polygon). This is a *within-vision* discrimination task; no touch is involved. This training is permitted because it establishes the patient's ability to categorize visual motion patterns, which the Heterogeneity view accepts as legitimate visual ideas, distinct from tactile ideas.

  **Probe 1: The Dynamic Condition**
  *Scene:* The two objects are placed on motorized turntables behind a translucent screen that obscures their static outlines but allows light to pass. They are coated in a glossy finish and lit by a single point source. As the trial begins, the turntables rotate the objects slowly (30 degrees per second). The patient sees only the moving specular highlights and the shifting light patterns (optic flow) against a dark background.
  *Response:* "Point to the one that matches the object you held earlier." (Single trial, no feedback).

  **Probe 2: The Static Condition**
  *Scene:* The turntables are locked. The objects are coated in a perfectly matte, uniform grey finish and lit by diffuse, shadowless light (Ganzfeld-style illumination). This eliminates specular highlights, cast shadows, and shading gradients. The patient sees only the static 2D silhouettes (occluding contours) of the objects against a neutral background. The Rhombic Dodecahedron is oriented such that its silhouette is a non-regular hexagon; the Ellipsoid is an ellipse.
  *Response:* "Point to the one that matches the object you held earlier." (Single trial, no feedback).

  **Operative Variable:** **Kinematic Information (Structure from Motion).** Probe 1 provides dynamic optical flow; Probe 2 provides only static contour. All other factors (lighting intensity, object size, distance, response method) are matched.

  ---

  ### Verdicts and Reasoning

  **Probe 1 (Dynamic)**
  *   **Heterogeneity View (Locke/Berkeley):** **Predicts Pass.**
      *   *Reasoning:* This view holds that visual and tactile ideas are distinct languages with no necessary connection. However, it allows for *inference* based on learned correlations or logical analogy. The screening training gave the patient the visual ideas of "Continuous Flow" and "Discontinuous Flow." The patient possesses the tactile ideas of "Smooth Surface" and "Faceted Surface." The patient can reason by analogy: "Continuity in vision likely corresponds to Continuity in touch." This is a judgment of the understanding (reasoning), not an immediate perception of identity. Since the dynamic cues make the visual distinction robust even for low acuity, the patient can successfully infer the match without needing an amodal concept of shape.
  *   **Common-Figure View:** **Predicts Pass.**
      *   *Reasoning:* Extension and Figure are common sensibles. The motion merely reveals the figure more clearly. The patient recognizes the amodal shape "Ellipsoid" and "Dodecahedron" through the visual medium immediately.

  **Probe 2 (Static)**
  *   **Heterogeneity View (Locke/Berkeley):** **Predicts Chance (Fail).**
      *   *Reasoning:* Without motion, the visual input is reduced to 2D silhouettes (a hexagon and an ellipse). The Heterogeneity view denies that the visual idea of a "Hexagon" has any necessary connection to the tactile idea of a "Dodecahedron." There is no "Continuity" cue to support an inference. The patient has no dictionary to translate "Visual Hexagon" to "Tactile Faceted." Lacking the dynamic cue, the link is broken. Success would require a miracle of pre-established harmony, which this view rejects.
  *   **Common-Figure View:** **Predicts Pass (Better than Chance).**
      *   *Reasoning:* The Figure is the same regardless of the sensory modality or the static/dynamic presentation. The visual silhouette of the Dodecahedron *is* a presentation of the same geometric truth felt by the hand. Even with poor acuity, the amodal recognition of "Angular" vs "Curved" should transfer immediately.

  ---

  ### Analysis of the Design

  **The Operative Variable**
  The feature doing the work is **Kinematic Availability**.
  *   **If removed:** If both probes are static, the design collapses into the standard Molyneux problem (Cube vs. Sphere). The Heterogeneity view predicts failure on both (or attributes any success to rapid learning, which a single trial precludes). The Common-Figure view predicts success on both. You lose the ability to isolate *inference* from *recognition*.
  *   **If added to both:** If both probes are dynamic, the Heterogeneity view predicts success on both (via the inference route), and the Common-Figure view predicts success on both. The contrast vanishes, and you cannot determine if the success is due to amodal transfer or visual inference.

  **Critique of Your Invariant Intuition**
  Your instinct regarding invariants is sharp, but "shadows" and "resting states" are indeed accidental invariants (contingent on lighting and gravity). A cube balanced on a corner casts a hexagonal shadow; a sphere in side-light casts an elliptical shadow. Relying on these makes the test about physics, not perception.
  **My Modification:** I have substituted **Kinematic Invariants** (Structure from Motion). These are robust; the optic flow of a rotating sphere is topologically distinct from that of a polyhedron regardless of lighting angle. However, the design treats them differently: Heterogeneity treats them as *visual cues for inference* (Probe 1), while Common-Figure treats them as *revealers of amodal shape* (Probe 1 & 2). The critical test is Probe 2, where these invariants are removed. If the patient fails Probe 2 but passes Probe 1, it suggests they were using visual inference (Heterogeneity), not amodal recognition (Common-Figure).

  **Strongest Objection and Modification**
  *   **Objection (from Common-Figure):** The Heterogeneity view is cheating on Probe 1. If the patient can infer "Continuity matches Continuity," they are already using a common notion of Continuity, which undermines the claim that sight and touch are wholly heterogeneous.
  *   **Modification:** To blunt this, ensure the visual training (Constraint vii) uses *abstract* 2D patterns (e.g., smooth vs. jagged lines on a screen) that share no semantic content with the 3D objects. This forces the Heterogeneity proponent to admit the patient is bridging the gap via a *third* abstract concept (logical continuity), not via a shared sensory figure.
  *   **Residue:** The design cannot settle whether "Inference" counts as "Knowledge." If the patient passes Probe 1, the Heterogeneity view claims victory (it was inference), while the Common-Figure view claims victory (it was recognition). Only the failure on Probe 2 distinguishes them. If the patient passes Probe 2, Heterogeneity is falsified. If they fail Probe 2, Common-Figure is falsified.

  **Third View: Sensorimotor Account (Noë/O'Regan)**
  *   **Prediction:** This view predicts **Pass on Probe 2** *only if* the patient is allowed to move their head.
  *   **Structural Feature:** **Active Exploration.**
  *   **Reasoning:** Vision is not a passive input but a skill of accessing sensory-motor contingencies. A static retinal image (Probe 2, head fixed) is insufficient for seeing shape, regardless of amodal concepts. If the patient can move their head, they generate motion parallax (effectively turning Probe 2 into Probe 1), allowing them to "see" the shape.
  *   **Differentiation:** Unlike Common-Figure (which says the shape is *present* in the static image), Sensorimotor theory says the shape is *accessible* only through movement. Unlike Heterogeneity (which denies the link), Sensorimotor theory says the link is constituted by the movement itself. To test this, you would need a third probe: Static Objects + Head Movement Allowed.

  ### Summary for the Reading Group
  This pair isolates the **mechanism of success**.
  1.  **Probe 1 (Motion):** Both views predict success, but for different reasons (Inference vs. Recognition).
  2.  **Probe 2 (Static):** The views diverge.
      *   **Success:** Supports Common-Figure (Amodal shape exists).
      *   **Failure:** Supports Heterogeneity (Success on Probe 1 was merely visual inference).

  This moves the debate from "Can they do it?" (which is empirically messy) to "How are they doing it?" (which is theoretically decisive).
