      *   **Question 1: Epistemology (Types of Knowledge)**
          *   *Idea:* Yes, there's a distinction between "knowing that" (propositional knowledge) and "knowing how" (procedural knowledge).
          *   *Application:* You can know the steps of CPR (facts) but panic or lack the muscle memory to do it effectively (skill).
          *   *Conclusion:* The testing structure *does* reflect a philosophical distinction between cognitive understanding and psychomotor competence.

      *   **Question 2: Practical Defense (Unitary Knowledge View)**
          *   *Idea:* Even if you believe all knowledge is cognitive, you can argue for skills testing based on *risk* and *verification*.
          *   *Application:* A written test checks if you know *what* to do. A skills test checks if you can do it under pressure, with equipment, without harming the patient. It's about safety, not just epistemology.
