prompt: |-
  I have somehow ended up on the committee that decides which projects in our new "evolution of mind" cluster get the first round of seed money, and I am the only member who is not an evolutionary psychologist — my own work is in developmental methods, so I am the person who is supposed to ask the annoying questions. Every application has the same shape: a human behavior, a story about why it would have paid off for our hunter-gatherer ancestors, and a flourish. Some of them feel like lactase persistence to me — a case where the adaptationist story has really been nailed down — and some feel like Kipling with footnotes. I cannot reliably tell which is which, I do not trust my gut, and I am going to have to defend the ranking to a dean, so before I read another application I want a written standard I can actually apply.

  What I need is a specification: what does an adaptationist hypothesis about a human psychological trait have to deliver to count as a real explanation rather than a just-so story, where "real" is relativized to the purpose — is this worth $40,000 of pilot money and a year of someone's time. Give me the requirements with the case or consideration behind each one: the phenomenon it must explain, the case it must get right, the distinction it must not collapse, the finding it must not contradict. For each requirement, tell me whether it binds any adaptationist explanation as such, or whether it is a preference of one research program dressed up as a methodological demand. My draft list, which I half-suspect is a mix of genuine desiderata and camp prejudice, runs like this: (1) the three ledgers — the story must name the currency it was maximizing and in what units, the timescale over which selection acted, and the selective regime, rather than "fitness" in the abstract; (2) the contrast class — it must say which alternative designs were actually present in the same population and lost, since "it was useful" is otherwise compatible with everything; (3) no phantom preferences — no positing a desire or module whose only evidence is the very behavior it is invoked to explain; (4) the orphan-trait discount — a trait present in exactly one lineage has no comparative leverage, and the hypothesis should be marked down for it; (5) the lag-load constraint — mismatch stories ("stone-age brains in a modern world") have to show that the environment changed faster than the trait could have tracked it by selection; (6) reachability — the design must be reachable from the ancestral design by tinkering, not engineered from scratch; (7) the engineering signature — reliable development, precision, economy, efficiency in the trait, as you would expect of something built for a job; (8) heritability and non-social transmission — cultural transmission must be ruled out; (9) cross-cultural universality; (10) some identifiable genetic basis; (11) novel predictions rather than post hoc fitting of known findings; (12) a stated finding that would kill the hypothesis.

  For each, say keep, revise, or drop, and say why, and add whatever I have missed. Three things I especially want. First: which of these are jointly unsatisfiable — my suspicion is that "generates predictions we can test now," "cites ancestral selection pressures no one can observe," and "uniquely human traits need comparative leverage" cannot all stand together, and if so the interesting output of this exercise is the impossibility result rather than the list. Second: which single requirement does the most exclusionary work, and which one, if I dropped it, would let in the worst offenders. Third: how the list handles the cases that are giving me trouble — morning sickness and food aversions in the first trimester, where pregnancy-protection and mere-byproduct stories are both on offer; the content effect on the Wason selection task, where a specialized cheater-detection device competes with general reasoning plus familiarity; a mate-preference difference that shows up in large cross-cultural surveys but reportedly shrinks in more gender-equal societies; a preference found in Western student samples that reportedly fails to appear in the small-scale societies I have read about; the mirror-image problem, where the same selective story is told for opposite findings (risk-taking shows mating competition, caution shows parental investment); and a byproduct explanation that is offered with exactly the same confidence and exactly as much evidence as the adaptation story it replaces. Any list that also rules out lactase persistence, camouflage, or the peacock's train is too strong, so use those as calibration. One further wrinkle specific to my situation: some hypotheses are fine as science but not cheaply testable, and I need to know whether "checkable within a pilot budget" is a desideratum on the theory or merely a fact about my committee.

  Only after all that, and briefly, score the main contenders against whatever list survives — the massive-modularity program, human behavioral ecology, cultural-evolution and dual-inheritance approaches, and the developmental / niche-construction style of explanation. I care far more about the criteria than the scorecard, so keep the weight on where the requirements come from and what each one is for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Committee member for "evolution of mind" cluster seed funding.
      *   **Background:** Developmental methods expert (not an evolutionary psychologist).
      *   **Task:** Create a written standard/specification to evaluate adaptationist hypotheses for funding ($40k pilot).
      *   **Goal:** Distinguish "real explanations" from "just-so stories" (Kipling with footnotes).
      *   **Input:** A draft list of 12 requirements.
      *   **Specific Demands:**
          1.  Evaluate each draft requirement (Keep, Revise, Drop + Why).
          2.  Identify jointly unsatisfiable requirements (Impossibility Result).
          3.  Identify the most exclusionary requirement and the one whose removal lets in the worst offenders.
          4.  Apply the list to specific trouble cases (morning sickness, Wason task, mate preference, WEIRD samples, mirror-image problem, byproduct explanations).
          5.  Ensure the list doesn't rule out established adaptations (lactase, camouflage, peacock's train).
          6.  Address the "pilot budget" constraint (theory vs. funding reality).
          7.  Briefly score main contenders (Massive Modularity, HBE, Cultural Ev, Developmental/Niche).
      *   **Tone:** Rigorous, philosophical but practical, critical, authoritative but collaborative (since the user is on the committee).

  2.  **Deconstruct the Draft List (Items 1-12):**

      *   *(1) Three Ledgers (Currency, Timescale, Regime):* Essential for specificity. "Fitness" is too vague. *Keep/Revise.*
      *   *(2) Contrast Class:* Crucial for avoiding tautology. If everything works, nothing is adapted. *Keep.*
      *   *(3) No Phantom Preferences:* Avoids circularity (homunculus). *Keep.*
      *   *(4) Orphan-Trait Discount:* Comparative data is gold standard, but unique human traits exist. *Revise* (don't discount too hard, just demand stronger internal evidence).
      *   *(5) Lag-Load Constraint:* Essential for mismatch theories. *Keep.*
      *   *(6) Reachability:* Evolution is a tinkerer. *Keep.*
      *   *(7) Engineering Signature:* Efficiency/precision. *Revise* (spandrels can look efficient; adaptations can be messy).
      *   *(8) Heritability/Non-social:* Ruling out culture is too strong for *psych* traits. *Drop/Revise* (Gene-culture coevolution is real).
      *   *(9) Cross-cultural Universality:* Too strong. Facultative adaptations vary. *Revise* (Expect patterned variation, not necessarily universality).
      *   *(10) Identifiable Genetic Basis:* Unrealistic for complex psych traits in a pilot. *Drop* (for now).
      *   *(11) Novel Predictions:* The hallmark of science. *Keep.*
      *   *(12) Falsification Condition:* Essential for rigor. *Keep.*

  3.  **Address the "Impossibility Result" (Joint Unsatisfiability):**
      *   The user suspects tension between "testable now," "ancestral pressures unobservable," and "unique traits need comparative leverage."
      *   *Analysis:* This is the core tension of EvPsych. We can't observe the EEA (Environment of Evolutionary Adaptedness) directly. We infer it. If we demand direct observation of ancestral pressure, nothing passes. If we allow inference, we risk just-so stories.
      *   *Resolution:* The tension is real. The solution is *convergent evidence* (triangulation) rather than direct observation. The impossibility is only if one demands *direct* observation of selection.

  4.  **Identify Key Exclusionary Requirements:**
      *   *Most Exclusionary:* Novel Predictions (11) + Falsification (12). Most just-so stories are post-hoc.
      *   *Worst Offender if Dropped:* Contrast Class (2) or Phantom Preferences (3). Without these, anything can be explained by "it was useful."

  5.  **Handle Trouble Cases:**
      *   *Morning Sickness:* Profet's hypothesis (toxins) vs. Byproduct. Needs specific prediction (e.g., aversion to specific toxins, timing).
      *   *Wason Task:* Cheater detection vs. Familiarity. Needs content manipulation experiments.
      *   *Mate Preference:* Gender equality shrinkage. Suggests facultative adaptation (HBE) vs. fixed module (EP).
      *   *WEIRD samples:* Universality (9) needs revision to "patterned variation."
      *   *Mirror-Image:* Risk vs. Caution. Needs specific contextual triggers (Conditionality).
      *   *Byproduct:* Needs a null model comparison.

  6.  **Calibration (Lactase, Camouflage, Peacock):**
      *   Ensure the criteria don't rule these out. Lactase has genetic basis (10 dropped/revised), Camouflage has engineering (7), Peacock has contrast (2).
      *   *Correction:* Don't demand genetic basis for *psych* traits in a pilot, but do demand *heritability* or *reliability*.

  7.  **Budget Constraint:**
      *   Is "checkable within pilot" a theoretical desideratum? No, it's a funding constraint. But a theory that *cannot* be piloted is not fundable *by this committee*. Distinguish "Good Science" from "Fundable Science."

  8.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the difficulty. Validate the "Kipling with footnotes" concern.
      *   *Section 1: The Specification (The List).* Go through 1-12.
          *   *Refinement on (8) & (10):* These are the biggest traps. Genetic basis is often unknown for behavior. Cultural transmission doesn't rule out evolved psychology (gene-culture coev).
          *   *Refinement on (9):* Universality is a trap. Facultative adaptations look different in different environments.
      *   *Section 2: The Impossibility Result.* Address the triad (Testability, Ancestry, Uniqueness). The solution is *triangulation*.
      *   *Section 3: Exclusionary Power.* (11) Novel Predictions is the gatekeeper. (2) Contrast Class is the safety valve.
      *   *Section 4: Trouble Cases.* Apply the refined list.
      *   *Section 5: Budget vs. Theory.* Distinguish validity from viability.
      *   *Section 6: Scorecard.* Briefly assess the four paradigms.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Lactase/Peacock" calibration? *Action:* Ensure I note that psych traits are harder than physical traits, so standards must be adjusted for *inference*, not just observation.
      *   *Check:* Did I answer the "Impossibility" question clearly? *Action:* Explicitly state that direct observation of ancestral selection is impossible, so the requirement must be about *consistency* with multiple lines of evidence, not direct proof.
      *   *Check:* Is the tone right? *Action:* Keep it professional, slightly academic but actionable.
      *   *Check:* Did I handle the "mirror-image" problem? *Action:* Emphasize *conditionality rules* (If X, then Adaptation A; If Y, then Adaptation B). If the theory predicts both without specifying conditions, it's unfalsifiable.

  10. **Final Polish:** Ensure the distinction between Human Behavioral Ecology (HBE) and Evolutionary Psychology (EP) is clear in the scorecard, as they handle these criteria differently. (EP = modules/EEA; HBE = strategies/current environment).

  *(Self-Correction on the "Impossibility Result"):* The user asks if "testable now," "ancestral pressures unobservable," and "unique traits need comparative leverage" are jointly unsatisfiable.
  *   *Thought:* If a trait is unique to humans, you can't use comparative leverage (phylogenetic bracketing). If ancestral pressures are unobservable, you can't test the selection pressure directly. If you need to test it now, you need a proxy.
  *   *Verdict:* They are not *logically* unsatisfiable, but they create a high burden of *convergent validity*. You test the *design features* now to infer the *pressure* then. The impossibility is only if you demand *direct* observation of the past. I need to clarify this distinction.

  *(Refining the "Budget" question):* Is checkability a theoretical desideratum? No. A theory can be true but expensive to test. But for *seed money*, it's a practical constraint. I need to make sure the user doesn't conflate "bad theory" with "expensive theory."

  *(Refining the "Universality" point):* This is a major point of contention in EvPsych. Strict EP expects universality (modules). HBE expects variation. A good criterion must allow for *facultative* adaptation. So "Universality" must be revised to "Predictable Variation."

  *(Refining "Genetic Basis"):* For a pilot in psych, demanding identified genes is a showstopper. Most psych traits are polygenic. Drop this as a requirement for *funding*, keep as a long-term goal.

  *(Refining "Engineering Signature"):* Adaptations aren't always efficient (pleiotropy, drift). But they should show *specialization*. Revise to "Specialization Evidence."

  Okay, ready to write.
answer: |-
  This is a precarious position, but also a vital one. The field of evolutionary psychology (EP) has suffered from a reputation for producing "just-so stories"—plausible narratives that fit the data but lack the rigor of hard science. Your instinct to demand a specification before reading another application is correct. Without it, you are voting on rhetoric, not science.

  Below is the specification you requested. It evaluates your draft list, identifies the structural tensions in the field, applies the criteria to your trouble cases, and distinguishes between theoretical validity and funding viability.

  ### Part 1: The Specification (Evaluation of Your Draft List)

  Here is the adjudication of your 12 points. I have categorized them as **Keep**, **Revise**, or **Drop**, with the rationale grounded in the logic of adaptationist inference.

  **1. The Three Ledgers (Currency, Timescale, Regime)**
  *   **Verdict:** **Keep.**
  *   **Rationale:** "Fitness" is a bookkeeping term, not a mechanism. A hypothesis must specify *what* was being maximized (survival, mating opportunities, inclusive fitness) and *under what conditions* (the Selective Regime). Without this, the explanation is circular.
  *   **Calibration:** Lactase persistence specifies the currency (caloric intake/survival during famine) and regime (dairy pastoralism).

  **2. The Contrast Class**
  *   **Verdict:** **Keep.** (This is your strongest filter).
  *   **Rationale:** Adaptation is a comparative claim. To say a trait is adapted, you must imply there were alternative designs that were *less* fit. If the hypothesis cannot name the foil (e.g., "random guessing," "general learning," "alternative heuristic"), it explains nothing.
  *   **Exclusionary Power:** High. Most just-so stories fail here.

  **3. No Phantom Preferences**
  *   **Verdict:** **Keep.**
  *   **Rationale:** This bans homuncular explanations. You cannot explain a behavior by positing a "desire to do the behavior." The mechanism must be lower-level than the phenomenon.

  **4. The Orphan-Trait Discount**
  *   **Verdict:** **Revise.** (Do not discount heavily; demand *convergent* evidence instead).
  *   **Rationale:** Humans *do* have unique traits (language, complex theory of mind). Demanding comparative leverage for unique traits creates an impossibility result (see Part 2). However, if a trait is unique, the burden shifts to **engineering evidence** (see 7) and **developmental reliability**.
  *   **Calibration:** Human syntax is largely unique; we don't reject it because chimps lack it. We accept it because of its structural complexity.

  **5. The Lag-Load Constraint**
  *   **Verdict:** **Keep.** (Crucial for mismatch theories).
  *   **Rationale:** If you claim a trait is maladaptive now because it was adaptive then, you must demonstrate the environment changed faster than selection could track. If the environment is stable, the trait should be current.

  **6. Reachability (Tinkering)**
  *   **Verdict:** **Keep.**
  *   **Rationale:** Evolution modifies existing structures. A hypothesis requiring a complex module to appear *de novo* without intermediate steps is biologically implausible.

  **7. The Engineering Signature**
  *   **Verdict:** **Revise.** (Change "Efficiency" to "Specialization").
  *   **Rationale:** Adaptations are often messy, redundant, or inefficient due to historical constraints (e.g., the recurrent laryngeal nerve). Do not demand "perfect design." Demand **evidence of specialization**: does the mechanism perform *this* task significantly better than *other* tasks?
  *   **Calibration:** The eye is not "efficient" (blind spot), but it is specialized for light detection.

  **8. Heritability and Non-Social Transmission**
  *   **Verdict:** **Drop.** (As a strict requirement).
  *   **Rationale:** This rules out gene-culture coevolution, which is likely how many human traits evolved. A trait can be an adaptation even if transmitted culturally, provided the *capacity* or *bias* to acquire it is genetic.
  *   **Correction:** Require evidence that the trait is not *purely* cultural contagion (i.e., it shows reliable development or heritability), but do not demand the exclusion of social learning.

  **9. Cross-Cultural Universality**
  *   **Verdict:** **Revise.** (Change to "Predictable Patterned Variation").
  *   **Rationale:** Strict universality is a trap. **Facultative adaptations** are designed to change based on local conditions (e.g., stress responses, mating strategies). If a theory predicts universality, demand it. If it predicts conditionality, demand the *rule* for variation.
  *   **Calibration:** Immune systems are universal; specific antibodies vary by environment. Both are adaptations.

  **10. Identifiable Genetic Basis**
  *   **Verdict:** **Drop.** (For pilot funding).
  *   **Rationale:** For complex psychological traits, the genetic architecture is almost always polygenic and unknown. Demanding this kills all behavioral science.
  *   **Substitute:** Demand evidence of **reliability** in development (the trait emerges reliably despite environmental noise).

  **11. Novel Predictions**
  *   **Verdict:** **Keep.** (The primary gatekeeper).
  *   **Rationale:** Post-hoc fitting is the definition of a just-so story. The hypothesis must predict a finding *not yet known* or a specific pattern in existing data that competitors do not predict.

  **12. A Stated Finding That Would Kill the Hypothesis**
  *   **Verdict:** **Keep.**
  *   **Rationale:** If the proponents cannot specify what evidence would falsify their claim, they are not doing science.

  ---

  ### Part 2: The Impossibility Result

  You suspected a tension between:
  1.  **Testability Now** (We need data today).
  2.  **Unobservable Ancestral Pressures** (We can't see the EEA).
  3.  **Unique Traits Need Comparative Leverage** (Humans are unique).

  **The Verdict:** These are **not jointly unsatisfiable**, but they create a **Triangulation Burden**.

  You cannot satisfy them by direct observation. You satisfy them by **convergent validity**.
  *   Since we cannot observe the ancestral pressure (2), we must infer it from the **design features** of the trait (Engineering Signature) and the **pattern of variation** (Universality/Conditionality).
  *   Since the trait may be unique (3), we cannot use phylogenetic bracketing. We must use **developmental stability** and **computational modeling** to show the trait is a solution to a recurrent problem.
  *   Since we must test it now (1), we test the *implications* of the design.

  **The Impossibility arises only if you demand *direct* proof of selection.** If your standard is "Show me the selection event," nothing passes (not even lactase persistence, which is inferred from allele frequency changes, not observed selection). If your standard is "Show me a mechanism whose design properties imply a specific selection pressure and which generates novel predictions," the triad is solvable.

  ---

  ### Part 3: Exclusionary Power

  **Which single requirement does the most exclusionary work?**
  **Requirement 11 (Novel Predictions).**
  Most adaptationist stories are retrospective. They look at a behavior (e.g., "men prefer younger women") and invent a reason ("reproductive value"). They rarely say, "If we manipulate X, Y will happen in a way that general learning theories cannot predict." This requirement kills 80% of "Kipling with footnotes."

  **Which requirement, if dropped, would let in the worst offenders?**
  **Requirement 2 (The Contrast Class).**
  Without this, "it was useful" becomes compatible with everything. If you don't force them to say what *didn't* evolve, you cannot claim what *did* is an adaptation. This allows the "Everything is an adaptation" Panglossian fallacy.

  ---

  ### Part 4: Handling the Trouble Cases

  Here is how the refined specification handles the specific cases troubling you.

  **1. Morning Sickness (Profet's Toxin Hypothesis vs. Byproduct)**
  *   **Application:** Apply **Contrast Class (2)** and **Novel Predictions (11)**.
  *   **Analysis:** The byproduct story says "hormones cause nausea." The adaptation story says "nausea targets toxins."
  *   **Test:** Does aversion correlate specifically with teratogenic foods (not just bitter foods)? Does it peak exactly when organogenesis is most vulnerable (Lag-Load/Timing)?
  *   **Ruling:** If the adaptation story predicts specific aversions to specific toxins that the byproduct story does not, fund it. If it just says "nausea is good," drop it.

  **2. Wason Selection Task (Cheater Detection vs. General Reasoning)**
  *   **Application:** **Engineering Signature (7 - Specialization)** and **Novel Predictions (11)**.
  *   **Analysis:** General reasoning predicts performance should track logical difficulty. Cheater detection predicts performance tracks *social contract* structure regardless of logical difficulty.
  *   **Ruling:** This is a strong case for adaptation because it generates specific dissociations (content effects). Fundable.

  **3. Mate Preference (Shrinks in Gender-Equal Societies)**
  *   **Application:** **Revised Universality (9 - Patterned Variation)**.
  *   **Analysis:** A fixed module predicts universality. A facultative adaptation (Human Behavioral Ecology style) predicts variation based on resource control.
  *   **Ruling:** The fact that it shrinks does *not* kill the adaptationist hypothesis; it kills the *fixed module* hypothesis. It supports a **conditional strategy** hypothesis. Fund if they specify the conditionality rule.

  **4. WEIRD Samples (Western vs. Small-Scale)**
  *   **Application:** **Revised Universality (9)** and **Lag-Load (5)**.
  *   **Analysis:** If a preference appears in WEIRD samples but not small-scale societies, it is likely cultural or a mismatch.
  *   **Ruling:** Mark down heavily. Unless they can show the small-scale environment suppresses a universal underlying mechanism (conditional strategy), this looks like a cultural artifact.

  **5. The Mirror-Image Problem (Risk vs. Caution)**
  *   **Application:** **Falsification (12)** and **Contrast Class (2)**.
  *   **Analysis:** If the theory says "Men take risks to mate" but also "Men are cautious to protect offspring" without specifying the *switching mechanism*, it is unfalsifiable.
  *   **Ruling:** Demand the **switching rule**. Under what specific informational input does the brain switch from Risk Module to Caution Module? If they cannot specify the trigger, drop it.

  **6. Byproduct Explanations (Equal Confidence/Evidence)**
  *   **Application:** **Reachability (6)** and **Engineering Signature (7)**.
  *   **Analysis:** Adaptations cost energy and development time. Byproducts are "free."
  *   **Ruling:** Apply **Parsimony**. If the behavior can be explained as a side-effect of a known adaptation (e.g., general intelligence) without positing a new module, the byproduct wins *unless* the adaptationist shows specific design features (efficiency, specificity) that the byproduct cannot explain.

  ---

  ### Part 5: The Budget Constraint

  **Is "checkable within a pilot budget" a desideratum on the theory?**
  **No.** It is a constraint on the *project*, not the *theory*.
  *   **Theory:** A theory can be true but require a 20-year longitudinal study to test.
  *   **Funding:** You only have $40k and 1 year.
  *   **The Trap:** Do not reject a theory because it is hard to test. Reject the *proposal* because the *methodology* does not fit the budget.
  *   **The Fix:** Require a **Pilot Prediction**. The applicant must identify *one* novel prediction from their grand theory that can be tested with $40k (e.g., a specific survey manipulation, a small fMRI pilot, a specific archival analysis). If their theory cannot generate *any* testable implication at this scale, it is not ready for seed money.

  ---

  ### Part 6: Scorecard of Contenders

  Based on the refined specification, here is how the major research programs typically fare. (Note: Individual applications may vary, but these are the programmatic tendencies).

  | Program | Strengths (Fits Criteria) | Weaknesses (Violates Criteria) | Funding Recommendation |
  | :--- | :--- | :--- | :--- |
  | **Massive Modularity (Classic EP)** | Strong on **Engineering Signature** (specialization) and **Contrast Class** (modules vs. general purpose). | Weak on **Reachability** (how do modules evolve?) and **Revised Universality** (often ignores cultural variation). | **Fund selectively.** Only if they specify the *switching conditions* for modules and avoid "phantom preferences." |
  | **Human Behavioral Ecology (HBE)** | Strong on **Patterned Variation** (strategies change with environment) and **Three Ledgers** (clear currency). | Weak on **Engineering Signature** (often treats mind as black box) and **Phantom Preferences** (sometimes assumes rational optimization). | **Fund highly.** Best fit for **Lag-Load** and **Conditionality**. Very testable in pilot budgets. |
  | **Cultural Evolution / Dual Inheritance** | Strong on **Reachability** (transmission biases) and **Contrast Class** (cultural vs. genetic). | Weak on **Three Ledgers** (often vague on biological fitness currency) and **Heritability** (can underplay genetic constraints). | **Fund.** Essential for ruling out cultural confounds in psych traits. |
  | **Developmental / Niche Construction** | Strong on **Reachability** (tinkering) and **No Phantom Preferences** (mechanism focused). | Weak on **Three Ledgers** (often focuses on proximate over ultimate causes). | **Fund as control.** Excellent for **Engineering Signature**, but ensure they address the *adaptive function*, not just the mechanism. |

  ### Final Instruction for the Committee

  When you read the next application, ask this single question:
  **"If this trait were *not* an adaptation, what specific pattern in the data would I expect to see instead, and does this proposal test for that difference?"**

  If they cannot answer that, they are writing Kipling. If they can, they are doing science. Give them the money.
