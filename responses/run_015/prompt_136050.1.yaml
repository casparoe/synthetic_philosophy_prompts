      *   *Refining Premise 7:* How do we know what was embarrassing? We look at how later Gospels *fix* earlier Gospels (e.g., Mark's baptism vs. Matthew's dialogue about it). This is textual evidence, not presupposed Jesus knowledge.
      *   *Refining Premise 9:* History is probabilistic. The argument demands Cartesian certainty.
      *   *Plausibility:* The "Third Quest" and "Memory Theory" approaches. They admit the circle but try to make it a "hermeneutical spiral" (rising understanding) rather than a "vicious circle."
      *   *Testing Coherence:* Use the "Explanatory Power" test. Does the hypothesis explain *why* the tradition survived, not just *that* it fits?

  6.  **Final Polish:**
      *   Ensure tone is academic but accessible.
