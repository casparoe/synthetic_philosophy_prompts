answer: |-
  ### 1. Diagnosis and Naming

  There is no single canonical label for this specific argumentative structure in the metaethical literature, though its components are widely discussed under headings like "selective skepticism," "local debunking," and "explanatory constraints." The move you have isolated is distinct because of its **comparative and graded** nature: it treats the *explanatory power* of the debunking theory over the *rejected* set as the *justificatory basis* for the *retained* set.

  I propose naming this **Residual Certification**.

  **Definition:** Residual Certification is an inferential move wherein the failure of a genealogical debunking explanation to account for a specific subset of beliefs is taken to enhance the epistemic status of that subset, proportional to the explanatory success of the debunking story over the remaining beliefs.

  **The Structure:**
  1.  **The Filter Premise:** Theory $T$ (e.g., evolutionary psychology) reliably identifies beliefs caused by non-truth-tracking processes (e.g., fitness maximization).
  2.  **The Coverage Premise:** $T$ successfully explains the etiology of belief-set $A$ (e.g., parochial loyalty).
  3.  **The Gap Premise:** $T$ fails to explain the etiology of belief-set $B$ (e.g., universal equality).
  4.  **The Certification Conclusion:** Beliefs in $B$ are more likely to be truth-tracking than they were prior to the application of $T$, because the primary known source of distortion has been ruled out for $B$.

  ### 2. The Hidden Parameter: Default Epistemic Status

  You asked whether the opposing uses of this move (unexplained = certified vs. unexplained = suspect) are one phenomenon with a hidden parameter. They are. The parameter is the **Default Epistemic Status of Unexplained Beliefs**.

  *   **Direction 1 (Certification):** Operates on a **Conservative Default**. Beliefs are presumed innocent (justified) until proven guilty (debunked). Here, the debunking theory functions as a *detector of error*. If the detector does not beep, the item is safe. The stronger the detector (the more thorough the debunking story), the higher the confidence in the silence.
  *   **Direction 2 (Suspicion):** Operates on a **Naturalist Default**. Beliefs require a causal passport to be justified. Here, the debunking theory functions as a *provider of etiology*. If the theory provides no causal story, the belief is metaphysically queer or epistemically inaccessible. The stronger the theory (the more of our psychology it explains), the more suspicious the anomaly becomes, because it suggests the belief is uncaused or causally disconnected from our cognitive architecture.

  The move shifts direction depending on whether the interlocutor views the lack of a genealogical explanation as the **absence of a defeater** (good) or the **absence of a warrant** (bad).

  ### 3. Distinctions from Nearby Notions

  You correctly identified the neighborhood. Here is how Residual Certification escapes them:

  *   **Inference to the Best Explanation (IBE):** IBE selects the hypothesis that best explains the data. Residual Certification does not posit that "Truth" is the best explanation for the residue. It posits that "Distortion" is *not* the explanation. It is an argument from the *failure* of a rival explanation, not the success of the truth-tracking one. It relies on a dichotomy (Distortion vs. Truth) rather than a competition among positive models.
  *   **The Coincidence Argument:** Coincidence replies argue that it would be miraculous if evolutionary pressures aligned with moral truth. Residual Certification sidesteps this. It grants the misalignment for set $A$ and argues that set $B$ is *independent* of the pressures, thereby avoiding the coincidence charge entirely. It does not argue for alignment; it argues for independence.
  *   **Third-Factor Replies:** Third-factor arguments posit a common cause (e.g., survival is good) that links evolution and truth. Residual Certification requires no common cause. It relies on the *separation* of the residue from the evolutionary cause.
  *   **Argument from Ignorance:** This is the closest fallacy. Residual Certification looks like: "You haven't explained $B$ away, therefore $B$ is true." However, it escapes the crude fallacy if the **Filter Premise** is established. If we have independent reason to think $T$ captures *all* relevant non-truth-tracking causes, the inference is not from ignorance, but from **Explanatory Exhaustivity**. The move is valid only if the set of debunking causes is known to be complete.

  ### 4. Ruling on the Three Cases

  **Case 1: Provisional Extension (The Debunker returns tomorrow)**
  If the debunker can plausibly extend the explanation to the residue later, the certification is **defeasible and provisional**. The move relies on the *current* explanatory landscape. If the "Filter" is known to be upgradeable, the silence of the filter today is not evidence of purity.
  *   *Verdict:* This undermines the move. Residual Certification requires a claim of **Explanatory Saturation**—the assertion that the debunking theory *cannot in principle* explain the residue, not just that it hasn't yet. If the gap is merely empirical, the certification is illusory.

  **Case 2: Recency and Technology (New judgments)**
  Does recency help or hurt?
  *   *Helps:* If the judgment concerns institutions (global markets, digital privacy) that did not exist during selection, the evolutionary story *cannot* be the direct cause. This supports the Gap Premise.
  *   *Hurts:* If the judgment is new, it likely arises from **cultural evolution** or **reasoning heuristics**. If the skeptic argues that cultural evolution is *also* non-truth-tracking (e.g., driven by memetic fitness rather than truth), the sieve has a second mesh that catches the residue.
  *   *Verdict:* Recency helps the Sieve only if one assumes cultural transmission is more truth-tracking than biological transmission. If both are treated as non-truth-tracking causal forces, recency does not certify; it merely shifts the genealogy from biology to culture.

  **Case 3: Non-Moral Domains (Logic and Math)**
  Imagine an evolutionary story for arithmetic dispositions. It explains counting small sets but not grasping infinite sets or Modus Ponens.
  *   *Analysis:* In mathematics, we generally expect our cognitive faculties to track truth because false arithmetic is maladaptive. In morality, realists often concede that fitness and truth *diverge*.
  *   *Verdict:* The move looks **worse** in math/logic. In morality, a gap suggests independence from fitness (which is good for the realist). In math, a gap suggests a failure of the faculty to track the domain for which it was designed, or access to a realm causally disconnected from our evolution. In math, we want the evolutionary story to *succeed* (showing reliability); in morality (for the realist), we often want it to *fail* (showing independence). Therefore, Residual Certification gains traction in morality precisely because we suspect the evolutionary cause is *distorting*, whereas in math, we hope it is *aligning*.

  ### 5. Evaluation of Soundness

  **Where it breaks:**
  Residual Certification is unsound without the **Exhaustivity Premise**. It commits a version of the *False Dilemma* if it assumes the only possible causes for moral belief are (1) Evolutionary Fitness or (2) Moral Truth.
  There are many other non-truth-tracking causes: cultural conditioning, emotional projection, cognitive bias, linguistic structure, or error theory. A belief that survives the evolutionary sieve may still be caught in the cultural sieve or the emotional sieve. The move fails if the debunker can argue that the "Filter" is porous or that there are multiple filters.

  **Condition for Soundness:**
  For the sieve inference to be sound, the following must be true:
  1.  **Exhaustivity:** The set of non-truth-tracking causal explanations offered must be exhaustive of all *plausible* non-truth-tracking explanations.
  2.  **Independence:** The residue must be causally independent of the debunking factors, not just currently unexplained by them.
  3.  **Positive Default:** The epistemic default must be that beliefs are justified unless defeated (Direction 1 above).

  **Is it any good?**
  As a rhetorical strategy, it is potent because it forces the debunker into a position of needing to explain *everything*, which is empirically difficult. As a strict epistemic argument, it is weak because explanatory gaps are common in science and do not automatically imply truth-tracking. It converts a *lack of negative evidence* into *positive evidence*, which is only permissible if the search for negative evidence is known to be complete.

  ### 6. Confidence and Uncertainty

  **Overall Confidence:** High. The structural analysis of the move and its dependence on the "Default Epistemic Status" parameter is robust within the context of metaethical debate. The distinction between the "Filter" model and the "Passport" model accurately captures the divergence you observed.

  **Least Certain Claim:** I am least certain about the verdict on **Case 3 (Logic/Math)**. The analogy between moral and mathematical epistemology is notoriously fraught. Some positions in philosophy of mathematics (e.g., certain forms of platonism) might utilize Residual Certification successfully (arguing that our grasp of abstracta *cannot* be evolutionary, therefore it is rational intuition), while others (naturalized epistemology) would reject it entirely. Whether the move looks "worse" there depends heavily on whether one views the evolutionary account of logic as a *vindication* or a *reduction*. I have assumed the standard naturalist view where evolutionary success suggests reliability, but this is contestable.
