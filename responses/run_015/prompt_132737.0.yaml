  I have decomposed the claim into five sub-questions. I do **not** combine these multiplicatively. Multiplication assumes independence, but these questions are deeply correlated theoretical commitments (e.g., if you accept ontic vagueness, you are more likely to accept that graded unity yields vague counts). Instead, I treat them as a **conditional chain** where the first question acts as a gatekeeper, and the subsequent questions update the probability conditional on that gate being open.

