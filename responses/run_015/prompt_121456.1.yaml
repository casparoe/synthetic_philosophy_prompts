  The exposure lies in insisting static consistency trumps dynamic reason-tracking, making the cost real for constitutional design but manageable for ordinary politics.

  Here are the defeaters ranked from fatal structural challenges to awkward normative adjustments, addressing your worry about individual rationality versus committee coherence.

  1. **Restricted Domain (Structural - Fatal):** For this to bite, deliberation must reliably eliminate inconsistent profiles before voting, violating universal domain. This is empirically live; check meeting records for consensus shifts prior to ballots. A defender must concede this limits the theorem's practical reach but insist legitimacy requires guarantees even against failed deliberation. This answers whether robustness across all profiles is right: for courts, yes; for legislatures, maybe not. Dismissing this evades the risk of deliberative failure. To check, compare pre-deliberation polls with final votes for consistency spikes. If spikes are absent, the theorem binds tightly.

  2. **Differentiated Rules (Structural/Significance - Fatal):** For this to bite, we must accept treating premises differently from conclusions, violating systematicity. This avoids dictatorship but forces a choice: betray the majority on the outcome or on the reasons. There is no principled priority; the choice is political. This is logically necessary. Check procedural charters. A defender should concede this is where arbitrariness enters, confirming the significance claim that coherence costs equality. Denying this denies the trade-off. To check, analyze if premise-based rules outperform conclusion-based on accuracy metrics. If accuracy ties, the choice is purely normative.

  3. **Path-Dependence (Significance - Awkward):** For this to bite, voting order must determine outcomes independently of judgments. Sequential voting path-dependence is the same defect in guise. It violates systematicity by making verdicts depend on order, not just judgments. It is conceptually true. Check voting logs against order variations. A defender should count this as evidence of the structural tension, not a separate bug, confirming that avoiding inconsistency requires surrendering agenda independence. It is not double-counting but re-manifestation. To check, reverse agenda order and observe verdict flips. If flips occur, systematicity is broken.

  4. **Empirical Frequency (Significance - Awkward):** For this to bite, legitimacy must depend on probability rather than guarantee. Claiming cycles are rare is evasion for constitutional design. Legitimacy requires stability across counterfactuals. This is normatively robust. Check stability under simulated profiles. A defender should dismiss empirical frequency as irrelevant to normative guarantees, maintaining that structural immunity is legitimate because rights must hold even in worst cases. Frequency matters for efficiency, not validity. To check, model distribution of profiles in real bodies versus logical space. If rare, the cost is theoretical; if common, it is practical.

  5. **Group Agency (Significance - Fatal):** For this to bite, the group must lack unitary agency. If only individuals exist, collective incoherence is metaphorical. This requires denying group agency. It is ontologically plausible. Check legal standing doctrines. A defender must insist that when a body acts unitarily, it incurs rationality constraints identical to individuals, otherwise its authority lacks normative force beyond mere power. Dismissing this reduces collective decision to power aggregation. To check, examine if courts justify rulings via group reasons or individual concurrences. If the latter, the dilemma dissolves.

  The individual reasoning contrast holds only if the committee is a single agent. If members are the only agents, coherence is individual, not collective. Your exposure is real where the group claims unitary authority. You should concede the structural logic but dispute the normative weight of collective coherence where deliberation functions. The theorem is unfalsifiable by construction, but its bite depends on whether you value the group's rational integrity over its members' autonomous judgment. Insulation is legitimate for rights, evasion for efficiency. Your position stands on normative grounds, not empirical frequency.
