      *   *Narrative Construction/Interpretivism (Dennett, Nisbett & Wilson):* We don't see the machinery; we guess based on behavior and culture. It's like writing a profile based on rumors.
      *   *Middle Ground (Moderate Privileged Access):* We have *some* direct access (qualia, pain) but interpret reasons and motives. It's like having the press release but needing to verify the facts.

  3.  **Translate to Journalistic Vocabulary (Drafting Task 1):**
      *   *Direct Access:* The source is the primary document. No editor involved. If they say it, it's the official record.
      *   *Narrative Construction:* The source is an anonymous tipster guessing at the story. They are confabulating. The "story" they tell is a press release written *after* the event to make sense of it.
      *   *Triangulation:* We need external data (fMRI, behavioral observation) to check their quote.
      *   *Observer Bias:* The interviewer (philosopher/scientist) leads the witness.
      *   *Hierarchy of Evidence:* Behavioral data > Self-report.

      *Refining the Translation:* I need to make sure I don't imply the journalist *knows* the truth better than the source, just that the *method* of gathering the info is different. The "Direct Access" view is like trusting a wire service feed without editing. The "Construction" view is like trusting a source who wasn't in the room but is spinning a narrative.

  4.  **Develop the Residue Report (Drafting Task 2):**
