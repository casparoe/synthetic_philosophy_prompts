answer: |-
  **Question 1**
  You keep the equation — that my confidence in "If A then B" just is my confidence in B given A — and you say that's why we have to ditch truth conditions. But why not do the opposite? Why not keep truth conditions and just say the equation only works in special cases, like when A doesn't tell me anything about B?
  *   **Likely Answer:** They'll say restricting the equation feels arbitrary and ruins the link between meaning and confidence, whereas losing truth conditions saves the equation for all cases.
  *   **Follow-up:** So you're saying it's less damaging to lose truth conditions than to admit the equation sometimes fails? Why is the equation more sacred than the idea that sentences describe the world?

  **Question 2**
  If "If A then B" doesn't state a fact, what am I even doing when I stack them? Like if I say, "If A is true, then if B is true, C is true." If the inner bit doesn't say anything, how does the outer bit grab hold of it?
  *   **Likely Answer:** They'll say you're just supposing A, and then within that supposition, supposing B. It's a mental move, not a fact about the world.
  *   **Follow-up:** Okay, but there's a logic rule that lets you swap "If A and B then C" with "If A, then if B then C". On your view, does that rule still work? And if it does, is it valid for the reason we thought, or for some other reason nobody signed up for?

  **Question 3**
  Can't I run the same maths trick on other sentences? If I say "It will probably rain," and treat that like a probability claim, doesn't your argument show *that* has no truth conditions either? Or disjunctions — "A or B"?
  *   **Likely Answer:** They'll likely choke on this and say conditionals are special, unlike "probably" or "or".
  *   **Follow-up:** What makes them special? Because if our sentences don't say how things are, what's left of the thought that language is for describing the world?

  **Question 4**
  Think about betting. I pay you a pound for a bet on B that gets called off and refunded if A doesn't happen. My fair price is my confidence in B given A. Doesn't that look like the equation getting its grip from something proposition-shaped — something we can actually bet on?
  *   **Likely Answer:** They'll say the bet doesn't need a proposition to be settled; it can just be voided.
  *   **Follow-up:** But if the bet can be voided, does the betting story really deliver the equation exactly, or only something close to it? And if it's only close, is that enough to kill truth conditions?

  **Question 5**
  Suppose it turned out that across a big class of ordinary cases, people's confidence in "If A then B" tracks their confidence in A-and-B together, rather than B given A. Is that evidence that your theory is wrong, or just evidence that people fumble how the sentence works?
  *   **Likely Answer:** They'll say it's evidence that people fumble it (performance error), not that the meaning is different.
  *   **Follow-up:** How do you know it's a fumble and not you being wrong about the meaning? At what point does "people getting it wrong" start to look like "the theory doesn't match the language"?

  **Question 6**
  If conditionals don't state anything, what's going on when I say "If A then B" and you say "If A then not B"? We feel like we're disagreeing. What's the disagreement about, if neither of us is saying something true or false?
  *   **Likely Answer:** They'll say we're disagreeing about what to believe given A, not about the world directly.
  *   **Follow-up:** Is that the same kind of fight as a disagreement about whether it will rain? Because if it's not, it sounds like we're arguing about something thinner than reality.
