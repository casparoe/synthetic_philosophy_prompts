          *   Status: False (regarding signals). Substantive but contested (regarding influence).
          *   Mystic/Supervisor: Supervisor wins (no signaling).
      *   *Claim 2: Failure of Local Causality.* No theory where outcomes depend *only* on past light cone variables can work.
          *   Status: Substantive/Defensible (standard view).
          *   Mystic/Supervisor: Supervisor wins (this is technical, not mystical).
      *   *Claim 3: Holism/Non-Separability.* The state of the whole is not determined by states of parts.
