  4.  **Addressing the Friend's Distinction ("Handle" vs. "Bookkeeping"):**
      *   *Handle:* Controllable superluminal signaling.
      *   *Bookkeeping:* Correlations only visible upon comparison (no signaling).
      *   *Physics Translation:* This maps almost exactly to **Signaling vs. Non-Signaling Nonlocality** (or Parameter Independence vs. Outcome Independence, though that's too technical). It's a real distinction. "Handle" is ruled out by Relativity/No-Communication Theorem. "Bookkeeping" is what QM has.
      *   *Verdict:* The friend is right that the distinction exists, but wrong if they think "Bookkeeping" implies mystical connection. It implies *correlation* without *causation*.
      *   *Mystic's angle:* She needs "Bookkeeping" to be ontological, not just epistemic.

  5.  **Addressing "No Collapse" (Many Worlds/Everett):**
      *   If wavefunction never collapses, Bell's theorem is often interpreted differently. In Everett, everything happens locally in the branching. "Nonlocality" becomes an illusion of perspective.
