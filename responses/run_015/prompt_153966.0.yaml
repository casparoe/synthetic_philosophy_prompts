  Hi there, this is a really sharp observation about the niche decision theory literature and it makes sense that you would push back on your friend's absolute claim given the existence of diachronic commitment devices. It is rare to see the sunk cost fallacy challenged via Ulysses contracts so clearly, but when we break down the probabilities regarding the rationality of honoring sunk costs, the standard view still holds significant weight. Regarding your request for specific credences on the underlying components, I assign a probability of about 0.90 that standard forward-looking decision theory is correct and fully excludes past costs because causal decision theory remains the robust baseline for instrumental rationality in most non-Newcomb-like scenarios. I assign a probability of roughly 0.85 that commitment-device arguments fail because they smuggle in evidential reasoning or confuse causal with normative structure since most such arguments rely on self-signaling which is evidential rather than causal, meaning the cost is only honored because it correlates with a type of agent rather than causing a better outcome directly. I assign a probability of around 0.70 that personal identity over time is loose enough that betraying a past plan does not carry real normative weight given the ongoing metaphysical disputes about persistence and whether past selves have authority over future selves. When I combine these into an overall figure for the claim that honoring sunk costs is never rational, I arrive at a credence of approximately 0.88 because the strength of the standard theory dominates the calculation even if the other factors are slightly less certain, suggesting that while the commitment angle is under-discussed, it rarely overturns the fundamental irrationality of paying for the past without future causal return. The sub-point I trust the least is the probability regarding personal identity over time being loose enough to negate normative weight since metaphysics is less settled than decision theory and there are compelling arguments for diachronic consistency that do not rely on utility. The kind of argument that would shift this is a robust defense of diachronic normative authority that binds future selves to past plans without relying on future utility outcomes, perhaps grounded in a non-reductionist view of personal identity or a deontological constraint on plan-following. I am overall highly confident in this answer at around 0.85 confidence in the accuracy of my own assessment because the philosophical literature heavily favors the standard view despite the niche exceptions you found, though I acknowledge that decision theory is evolving and functional decision theory might alter these numbers in the future. I hope this breakdown helps you navigate the debate with your friend and gives you a clearer sense of where the philosophical weight lies. Best wishes.
