answer: |-
  # The Fragility of the Evaluator: Reflexive Drift and the Limits of Good's Theorem

  I.J. Good's 1967 theorem on the value of information is a cornerstone of decision theory. It establishes that for a rational Bayesian agent, the expected utility of observing free information and then acting optimally is always greater than or equal to the expected utility of acting immediately without that information. The rationalist mantra derived from this is absolute: never refuse free data. Information is power, and power, costless, is always an asset.

  Standard objections to this theorem usually hinge on physical risk (the "curiosity killed the cat" problem) or computational cost. Defenders easily parry these: simply include the risk of death or the cost of computation in the utility function, and the theorem holds. However, a more insidious challenge lies in the stability of the agent herself. Consider "reflexive drift": a scenario where acquiring specific information causally alters the agent's preference ordering. If learning a forecast about your future emotional state predictably corrupts the values you currently hold, does Good's theorem still command you to listen?

  This essay argues that while a formalist can mathematically salvage Good's result by expanding the state space to include preference changes, this maneuver evacuates the theorem of its normative force. For an agent with meta-preferences for stability and coherence, reflexive drift carves out a principled exception to the command to acquire free information. The rationalist framework can describe the refusal, but it cannot prescribe the acquisition without abandoning the agent's current identity as the locus of value.

  ### The Formalist Defense: Ex Ante Sovereignty

  The staunch defender of Good's theorem will argue that the result is mathematically robust against reflexive drift, provided we model the agent correctly. The core of Good's proof relies on the fact that the agent with information can always choose to ignore it and perform the action they would have taken without it. Therefore, they can never do worse.

  In the case of reflexive drift, the defense posits that the change in preferences is merely another consequence of the action "acquire information." Just as an agent might avoid a restaurant because the food causes illness, they should avoid information because it causes "value illness." From the perspective of the agent at time $t_0$ (let's call her $Agent_{old}$), the transition to a new preference ordering ($U_{new}$) is simply a state of the world with an associated utility value.

  If $Agent_{old}$ values her current preferences—say, she prefers sobriety to addiction—she assigns negative utility to any information that causally triggers addiction. When she calculates the expected utility of acquiring the information, she includes the disutility of her preferences corrupting. If this disutility is high enough, the expected value of the information becomes negative, and the rational choice is to refuse it.

  On this view, Good's theorem remains intact. The inequality $E[U|Info] \geq E[U|No Info]$ holds because $U$ (the utility function of $Agent_{old}$) is the metric for both sides of the equation. The "drift" is just a costly outcome, like a financial loss or physical injury. The theorem does not guarantee that information makes you happier; it guarantees that having the option to use information is better than not having it, *relative to your current values*. If your current values fear self-corruption, the theorem happily tells you to look away.

  ### The Normative Attack: The Instability of the Evaluator

  This formalist rescue, however, glosses over a profound metaphysical problem. Good's theorem assumes a fixed metric of value against which outcomes are measured. Reflexive drift does not merely change the *outcome*; it changes the *evaluator*.

  When $Agent_{old}$ considers acquiring information that will transform her into $Agent_{new}$, she is attempting to calculate the utility of a future state using a utility function that will cease to exist or be overruled. If the information is a self-fulfilling prophecy of emotional collapse (e.g., "Knowing you will be depressed tomorrow makes you depressed today"), the acquisition of information destroys the very capacity to value the outcomes $Agent_{old}$ cares about.

  The problem is not just that $U_{old}$ dislikes $U_{new}$. The problem is that $U_{new}$ becomes the operational decision-maker post-update. Good's theorem relies on the assumption that the agent acting on the information is the same agent who decided to acquire it. If the information corrupts the preference ordering, the "optimal action" taken post-information is optimal for $U_{new}$, not $U_{old}$.

  Consider a Ulysses scenario. Ulysses ($Agent_{old}$) prefers to survive. The Sirens' song (Information) changes his preferences such that he ($Agent_{new}$) prefers to crash the ship. If Ulysses listens, he acts optimally according to his new preferences (crashing), which yields terrible utility according to his old preferences (death). The formalist says Ulysses simply assigns "death" a high negative cost. But this misses the point: the information *removed his ability to care about survival*.

  If we accept the formalist defense, we are forced to say that a brainwashed agent who is happy about their brainwashing has not suffered a loss of utility, provided their pre-brainwashing self anticipated the happiness. But this contradicts the intuition that there is a loss in the *corruption of the preference structure itself*. If the metric of value is mutable, the expected utility calculation becomes a comparison of apples to oranges. $Agent_{old}$ is calculating the value of handing the controls to a stranger who shares her body but not her values. To claim Good's theorem holds here is to assert that the "agent" is merely a vessel for whatever preferences happen to be running the software, rather than a continuous entity with a stake in its own normative coherence.

  ### Meta-Preferences and the Principled Exception

  The resolution lies in distinguishing between first-order preferences (what I want) and meta-preferences (what I want to want). Rational agents are not just utility maximizers; they are utility *preservers*. We care about the stability of our values over time.

  Reflexive drift targets these meta-preferences. When information threatens to decouple $Agent_{future}$ from $Agent_{past}$, it imposes a "coherence cost." The standard rationalist framework can absorb this cost only by treating the preservation of self as one preference among many. But for a temporally extended agent, the preservation of the evaluative framework is a precondition for all other utility maximization.

  If Good's theorem is interpreted as a normative guide for living ("always take free information"), it fails in the presence of reflexive drift. It fails because it assumes the "you" that receives the information is the same "you" that benefits from it. When information is causally linked to preference corruption, acquiring it is an act of self-termination. The expected utility for the *continuing self* is negative, even if the expected utility for the *successor self* is positive.

  Therefore, reflexive drift does carve out a principled exception. The exception is not based on the content of the information (e.g., bad news) but on its causal topology. If the channel of information transmission passes through a mechanism that alters the receiver's utility function in a way the receiver meta-disprefers, the information has negative value.

  ### Conclusion

  Can the rationalist framework absorb reflexive drift without loss? Mathematically, yes; normatively, no.

  A formalist can always rig the utility function to account for preference change, preserving the inequality of Good's theorem. But this is a Pyrrhic victory. It saves the theorem by rendering the utility function so complex and self-referential that it no longer maps onto the lived experience of an agent striving to maintain identity over time. It treats the corruption of one's values as merely another bad outcome, rather than a failure of the rationality condition itself.

  The concrete conclusion is that "never refuse free data" is only valid under the assumption of *preferential stability*. When an agent anticipates that information will induce reflexive drift contrary to their meta-preferences, refusing that information is not irrational ignorance; it is an act of defensive rationality. Good's theorem describes the value of information for a static mind. For a fragile mind, information is not just a map; it is a terrain that reshapes the traveler. In such cases, the rational agent must sometimes choose blindness to preserve the self that sees.
