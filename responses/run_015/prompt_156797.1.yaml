      *   Medium on the "Potential vs Actual" distinction without set theory jargon. This is the hardest part for 16-year-olds without using $\mathbb{N}$. I need to be careful with language. This is likely the weakest link.

  9.  **Final Review of the Output:**
      *   Check tone (American English).
