answer: |-
  Here is the 40-minute battle plan.

  ### **Session Goal**
  Demonstrate that Hilbert's Hotel is a *conditional* argument (If $A$, then $B$), not an *existential* proof ($A$ is true). The "paradox" is only a contradiction if you assume finite rules apply to infinite collections.

  ### **The One Example**
  **The Single New Guest.**
  *   **Must Have:** A hallway with rooms numbered $1, 2, 3, \dots$; a guest in every single room; one new person arriving at the desk.
  *   **Must Lack:** Physical walls, check-in time, an "end" of the hallway, coaches/buses of people.

  ---

  ### **Phase 1: The Definition of "Full" (0–7 Minutes)**
  **Goal:** Split the concept of "Full" into two distinct definitions before drawing a single room.
  **Whiteboard:** Draw two columns. Left: **Finite Hotel**. Right: **Infinite Hotel**.

  1.  **Write Definition A:** "Every room has a guest."
  2.  **Write Definition B:** "No new guests can be accommodated."
  3.  **Ask:** "In a normal, finite hotel, if A is true, is B true?" (Yes).
  4.  **Ask:** "In our math club logic, does A *force* B to be true, or is that just an observation about finite buildings?"
  5.  **The Move:** Assert that for this session, **A is the only definition of 'Full' we accept.** B is a consequence we must test, not a definition.
  6.  **Misconception Check:** *"Full means no room."*
      *   **Timing:** Kill this **before** the Hotel appears.
      *   **Action:** If a student says "But if it's full, you can't add more," point to Definition A. "It is Full by Definition A. We are testing if Definition B follows. Do not assume they are the same."
      *   **Confidence:** **95%**. This is the logical prerequisite. If they don't buy this, the rest is magic.

  ### **Phase 2: The Nature of the List (7–12 Minutes)**
  **Goal:** Distinguish "Counting Forever" (Potential) from "The Counted Collection" (Actual).
  **Whiteboard:** Keep the columns. Add a number line under the Infinite Hotel.

  1.  **Ask:** "When I write $1, 2, 3, \dots$, am I describing a process that never stops, or a completed list we are looking at all at once?"
  2.  **The Move:** State clearly: "Hilbert's Hotel only works if we treat the rooms as a **completed collection**. If the rooms are still being built as we speak, the trick fails."
  3.  **Misconception Check:** *"Infinity is just a really big number."*
      *   **Timing:** Kill this **before** the Hotel operation.
      *   **Action:** If they ask "What's the last room number?", say: "There isn't one. That's not because it's big; it's because 'last' doesn't apply here. If you imagine a last room, you've made it finite."
      *   **Confidence:** **85%**. This is abstract. Without set notation ($\mathbb{N}$), relying on "completed collection" language is risky but necessary.

  ### **Phase 3: The Operation (12–25 Minutes)**
  **Goal:** Execute the shift ($n \to n+1$) and observe the result without appealing to physics.
  **Whiteboard:** Draw the rooms. Show Guest $n$ moving to Room $n+1$.

  1.  **Setup:** "Every room $n$ has Guest $n$. A new person arrives."
  2.  **Action:** "Move Guest 1 to 2, Guest 2 to 3, Guest $n$ to $n+1$."
  3.  **Result:** Room 1 is empty. New guest fits. Definition A (Every room occupied) was true before, and true after (just shifted). Definition B (No new guests) was false.
  4.  **Misconception Check:** *"Evens are half of naturals, so there's less room."*
      *   **Timing:** Let them say this **during** the operation.
      *   **Action:** Use it. "That intuition is why this feels like a cheat. But in this completed collection, 'half' doesn't mean fewer slots. The mapping works."
  5.  **Misconception Check:** *"You'd need infinite time to move everyone."*
      *   **Timing:** Kill this **immediately** when raised.
      *   **Action:** "This is a math object, not a construction project. We are comparing states: State Before and State After. Time is irrelevant."
      *   **Confidence:** **90%**. The math is simple induction/bijection which they know. The discipline is stopping the physics talk.

  ### **Phase 4: The Verdict (25–35 Minutes)**
  **Goal:** Separate the Math from the Metaphysics.
  **Whiteboard:** Erase the rooms. Write: **IF [Actual Infinity Exists] $\rightarrow$ THEN [Hotel is Possible]**.

  1.  **The Cantor View:** "Infinity exists as a completed thing. Therefore, the Hotel is consistent. 'Full' just means something different here."
  2.  **The Finitist View:** "The Hotel is absurd (a room can be full and have space!). Therefore, the premise (Actual Infinity) must be false."
  3.  **The Point:** The Hotel does not decide who is right. It only shows what the cost of admission is.
  4.  **Misconception Check:** *"Cantor proved infinite things exist."*
      *   **Timing:** Kill this **after** the Hotel operation.
      *   **Action:** "Cantor proved that *if* you allow actual infinities, the math holds together. He did not prove the universe contains them. Finitists agree the math works; they just reject the premise."
      *   **Confidence:** **80%**. This is the philosophical pivot. It's easy to drift into "Who is right?" instead of "What does the argument show?"

  ### **Phase 5: The Closing Question (35–40 Minutes)**
  **Goal:** Test the conditional understanding.
  **Whiteboard:** Clear.

  1.  **Ask:** "A student walks out of here and says: 'Hilbert's Hotel is impossible, therefore infinity doesn't exist.' Another says: 'Hilbert's Hotel is possible, therefore infinity exists.' **Which student has made a logic error, and what is it?**"
  2.  **Target Answer:** Both made the same error. They treated the Hotel as proof of existence. The Hotel is only a conditional statement ($P \implies Q$). You cannot prove $P$ (infinity exists) just by showing $Q$ (Hotel works) is consistent, nor disprove $P$ solely because $Q$ feels counter-intuitive.
  3.  **Confidence:** **95%**. This cleanly tests the specific learning objective.

  ---

  ### **Refusals (What to Flatly Reject)**
  1.  **Physics/Engineering:** "How do they move?" "Where do they put their luggage?"
      *   *Response:* "We are analyzing the logical consistency of numbers, not architecture."
  2.  **Theology/Cosmology:** "Does the universe go on forever?"
      *   *Response:* "That's a physics question. We are asking if the *concept* is self-contradictory."
  3.  **Advanced Set Theory:** "What about $\aleph_1$?" "What about the Continuum Hypothesis?"
      *   *Response:* "That's for university. Today we only care about the countable list $1, 2, 3\dots$"

  ---

  ### **Confidence Ratings & The Weakest Link**

  *   **Phase 1 (Defining Full):** 95% Confidence. Essential and clear.
  *   **Phase 2 (Potential vs. Actual):** **85% Confidence (WEAKEST LINK).**
      *   *Why:* Explaining "Actual Infinity" without using set notation ($\mathbb{N}$ as a set) is linguistically difficult. Students often slip back into thinking of it as a process that "gets there." If this distinction fails, the Hotel looks like a supertask (Phase 3) rather than a static mapping.
  *   **Phase 3 (The Operation):** 90% Confidence. They know induction; the shift is simple.
  *   **Phase 4 (The Verdict):** 80% Confidence. Requires keeping 16-year-olds focused on logic structure rather than "winning" the debate.
  *   **Phase 5 (Closing Question):** 95% Confidence. Directly tests the plan's core thesis.

  **Focus Area:** Spend your mental energy on **Phase 2**. If they don't grasp "Completed Collection" vs. "Endless Process," the shift in Phase 3 will feel like a physical impossibility rather than a logical re-mapping. Use the whiteboard to draw the *whole* line at once, not counting it out.
