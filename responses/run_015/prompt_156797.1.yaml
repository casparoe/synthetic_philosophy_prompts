      *   Whiteboard? Use it for the definitions and the shift.
      *   American English? (Check: "Sixth-form" is UK, but prompt asks for American English output. I will translate "sixth-form" context to "high school junior/senior" tone but keep the UK "sixth-form" label if referring to the group, or just stick to the requested American English style). *Correction:* The prompt asks for American English *please*. I will write the plan in American English.
      *   Confidence ratings? Yes.
