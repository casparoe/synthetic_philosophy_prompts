answer: |-
  # HANDOUT: THE ALLAIS MAP

  **Instructions:** Begin with the standard Ministry case. You have already indicated you prefer **S** over **T** and **V** over **U**. Answer the following questions in order. Follow the path indicated by your answers to find your position. Do not look at the Key until you have finished.

  **Node 1 (The Trembling Hand):** Suppose Programme S is not perfectly certain. Due to implementation friction, there is a 0.1% chance it delivers nothing, identical to the worst-case failure in T. Do you still prefer S over T?
  *   (A) No, the preference reverses or becomes indifferent. → **Go to Node 9**
  *   (B) Yes, the preference for S remains strong. → **Go to Node 2**

  **Node 2 (The Trust Check):** In the original case, did your preference for S depend on trusting that the "100%" guarantee was physically impossible to fail, rather than just a stated number?
  *   (A) Yes, I suspected the 100% was an idealization. → **Leaf: Probability Skepticism**
  *   (B) No, I treated the numbers as given. → **Go to Node 3**

  **Node 3 (The Reflection):** Imagine the options displayed as a table of states. The 89% column is identical for S and T (1 year each). If you visually cancel this common column, does the intuitive pull toward S over T survive?
  *   (A) No, the preference vanishes or reverses. → **Leaf: Process/Menu Dependence**
  *   (B) Yes, the preference persists. → **Go to Node 4**

  **Node 4 (The Delegation):** You must choose for a population whose health outcomes you will never observe or be held accountable for. Does the pull toward S weaken?
  *   (A) Yes, significantly. → **[Empirical Node]** → **Leaf: Regret/Disappointment**
  *   (B) No, the choice is the same. → **Go to Node 5**

  **Node 5 (The Repetition):** The Ministry will face this exact choice structure 200 times independently. You must fix one policy for all 200 instances. Do you switch to maximizing the aggregate expected years?
  *   (A) Yes, I would switch to T and V. → **Leaf: Quietist/Long-Run**
  *   (B) No, I would stick with S and V. → **Go to Node 6**

  **Node 6 (The Scale):** Divide all probabilities by 100 (e.g., 100% becomes 1%, 10% becomes 0.1%). The stakes (years of life) remain unchanged. Do you maintain the same preference pattern?
  *   (A) No, the pattern disappears or reverses. → **[Empirical Node]** → **Leaf: Probability Transformation**
  *   (B) Yes, the pattern holds. → **Go to Node 7**

  **Node 7 (The Domain):** The numbers represent monetary gains for you personally, not years of life for others. Is the preference pattern the same?
  *   (A) No, I maximize expected money. → **Leaf: Domain Dependence**
  *   (B) Yes, the pattern holds. → **Go to Node 8**

  **Node 8 (The Mixture):** A new option W is offered: a coin flip determines whether you get Programme S or Programme T. Is W strictly better than S?
  *   (A) Yes, the mixture is preferable. → **Leaf: Betweenness/Fanning**
  *   (B) No, S is still better. → **Go to Node 9**

  **Node 9 (The DMU Distractor):** You previously suggested the 5th year of health is less valuable than the 1st. In the second pair, V offers the 5th year and U offers the 1st. Does this lower value make you prefer U over V?
  *   (A) Yes, I should prefer U. → **Leaf: Standard Theory (Error)**
  *   (B) No, I still prefer V. → **Leaf: Unnamed (Risk as Parameter)**

  ***

  ### SCORING KEY & LEAF DESCRIPTIONS

  *   **Probability Skepticism:** The datum is an artifact of unmodelled doubt about the stated probabilities or the experimenter rather than a response to certainty as such. *Ministry Case:* The guarantee was not trusted; the choice was not truly between the stated lotteries.
  *   **Process/Menu Dependence:** Denies that only the reduced-form lottery over final outcomes matters; the process or the menu is part of what is evaluated. *Ministry Case:* The presentation of the common consequence drives the choice, not the outcomes alone.
  *   **Regret/Disappointment:** Explains the pattern by the anticipation of regret or disappointment rather than by the structure of the options. *Ministry Case:* The choice is driven by the desire to avoid the feeling of responsibility for a bad outcome in the one-off case.
  *   **Quietist/Long-Run:** No verdict attaches to a single unrepeatable choice and the norm governs only policies or long-run sequences. *Ministry Case:* The single decision is normatively underdetermined; only the 200-round policy has a rational requirement.
  *   **Probability Transformation:** Repairs the theory by transforming probabilities rather than by weighting outcomes, including rank-dependent and cumulative descendants of prospect theory. *Ministry Case:* Small probabilities are overweighted/underweighted non-linearly; the pattern is robust across domains but sensitive to scale.
  *   **Domain Dependence:** The normative verdict varies with the domain of the choice. *Ministry Case:* Health choices permit the Allais pattern; monetary choices do not.
  *   **Betweenness/Fanning:** Gives up independence but keeps betweenness, with preferences fanning out locally. *Ministry Case:* Preferences are non-linear in probability space but obey local consistency; the mixture is valued for its diversification.
  *   **Standard Theory (Error):** Keeps the standard theory intact and treats the pattern as error. *Ministry Case:* The initial intuition was a mistake caused by confusing diminishing marginal utility with risk attitude.
  *   **Certainty Effect (Node 1A):** Repairs the theory by giving certainty a special role, as a first-order preference for security rather than as curvature over outcomes. *Ministry Case:* The 100% probability carries a lexical priority that vanishes with any tremble.
  *   **Unnamed (Risk as Parameter):** Treats an attitude to risk itself as a rationally permissible parameter while preserving the rest of the structure. *Ministry Case:* The pattern is a stable, rational expression of a risk parameter that is neither error nor probability weighting.

  ***

  # COMMENTARY & TAXONOMY

  **Logical Space and Occupancy**
  The tree generates a logical space defined by ten terminal cells. The branching structure prioritizes *mechanism* over *verdict*. The first split (Node 1) isolates the **Certainty Effect** from all other explanations; if the pattern vanishes when certainty is removed, the student is committed to a lexical priority for security. If they pass Node 1, they accept the pattern as robust to probability perturbations, forcing them to locate the source elsewhere.

  Nodes 3 (Reflection) and 8 (Mixture) build in the distinction between the **vNM Independence Axiom** and the **Savage Sure-Thing Principle**. Node 3 tests the Savage formulation (cancelling common states); Node 8 tests the vNM formulation (linearity in mixtures). The Allais pattern technically violates both, but students often accept one logical framing while rejecting the other. A student who fails Node 3 but passes Node 8 accepts vNM independence but rejects statewise reduction (Process Dependence). A student who passes Node 3 but fails Node 8 accepts Sure-Thing but rejects mixture linearity (Betweenness).

  **Unoccupied and Problematic Cells**
  The space contains combinations that are theoretically unoccupied. Specifically, there is no leaf for a view that accepts the **Standard Theory** but claims the pattern is *correct*. This cell is logically incoherent: if one accepts the axioms, the pattern is a contradiction. Node 9 (DMU Distractor) is designed to force students who attempt to occupy this cell into admitting error. If they claim diminishing marginal utility drives the choice, they must prefer U over V; if they do not, DMU is not the driver.

  The **Quietist** leaf (Node 5) occupies a space often left unexplored in static choice theory. It is not a repair of the theory but a dissolution of the problem's scope. It is attractive to those who view rationality as a property of policies rather than acts. It is separated from **Standard Theory** by the admission that the single-case intuition is valid, only the norm is different.

  **Separation Limits**
  The tree cannot separate **Probability Transformation** (Node 6) from **Unnamed (Risk as Parameter)** (Node 9) on case answers alone. Both predict the same choices across domains and scales. Separation requires a formal result: Transformation views imply specific functional forms (e.g., weighting functions) that can be tested against choice data across a continuum of probabilities. The Risk Parameter view implies a stable coefficient without transformation. You would need a formal elicitation task to distinguish them.

  Similarly, **Regret** (Node 4) is marked empirical. The link between "choice changes when unobserved" and "regret" is a psychological hypothesis. A student might change their choice due to altruism rather than regret. You would need to check the specific phenomenological report of the student to confirm the mechanism.

  **Certainty-Constrained Consequentialism**
  You mentioned hearing "certainty-constrained consequentialism" in your department. This maps to the **Certainty Effect** leaf (Node 1A). It is not a novel combination; it is a established normative refinement of the Allais common-consequence effect, often associated with "Safety First" rules or lexical priority views. However, if your students claim this view *while* passing Node 1 (insisting the preference holds even with a tremble), they are in an unoccupied cell: they want the certainty label without the certainty condition. This is incoherent.

  **vNM vs. Savage**
  The pattern threatens the **Sure-Thing Principle** (Savage) more directly in the Common Consequence formulation used here. vNM Independence is about mixing lotteries; Sure-Thing is about partitioning states. Node 3 (Reflection) explicitly tests the Savage intuition. If the student admits the preference vanishes when common states are cancelled, they are violating Sure-Thing. If they maintain the preference, they are violating Independence (tested in Node 8). Most Allais discussions conflate the two; this tree forces a distinction.

  **Implications for the Ministry Case**
  Every leaf carries a specific verdict on the original case (one-off, health, observed).
  *   **Error/Skepticism:** The Ministry should ignore the intuition and maximize expected years.
  *   **Certainty/Transformation/Regret/Betweenness:** The Ministry should respect the intuition; S and V are rational choices.
  *   **Quietist:** The question is ill-posed; the Ministry must adopt a long-run policy to be rational.
  *   **Domain Dependence:** The Ministry should respect the intuition for health, but not for budget allocation.

  Use this taxonomy to show students that their disagreement is not about "bias" versus "data," but about which structural feature of the case (certainty, statewise comparison, repetition, or agency) carries the normative weight.
