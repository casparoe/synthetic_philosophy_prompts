          *   **Verdict:** This is the core of the WKR objection. If you define "good" as "what there are reasons to favor," but you have to filter reasons by "what is good" to exclude WKRs, you've circularized. *However*, there are responses (fittingness, substantive constraints) that try to avoid this. So, it's a *strong objection*, but stating it as a definitive proof of circularity is slightly contentious (though standard for the objection).
