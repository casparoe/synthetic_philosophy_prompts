prompt: |-
  I direct the editorial team for a high-school world history program, and we are in the middle of a full revision. My team runs into one problem several hundred times per volume: passages in which something non-human does the acting — an epidemic, a drought, a volcanic winter, a shift in the monsoon, a glacier, a shallow harbor, a vein of ore. Our house style currently has one blunt rule for these, which is to put the people back in: no sentence should make a pathogen or a weather system the grammatical subject of a historical claim. My copy editors and my subject-matter reviewers have told me, independently, that the rule now does as much harm as good. It produces flat, evasive prose, and it sometimes deletes a causal claim that is true, load-bearing, and the entire point of the paragraph. I agree, and I want to replace the rule with something my editors can actually run.

  Please write me that procedure. It has to work on a single sentence or short passage, in about ten minutes, run by a copy editor with no training in philosophy or historiography, and its output has to be a specific edited sentence plus a verdict from a small fixed set — leave as is; leave with a required mediating clause added; rewrite with the human decision-makers restored; delete the causal claim; escalate to a subject-matter editor. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, and what does not; tell me where the procedure stops with a no; and mark the points where it has to hand the decision to a person because the question is one of values, pedagogy, or politics rather than fact.

  Three things the procedure has to get right. First, it must catch the drift from "X was among the causes" to "X made the outcome inevitable" — geography as destiny — including the cases where that drift carries a political charge, because attributing a region's poverty to its rainfall or its disease ecology rather than to a century of extraction is not a stylistic slip. Second, it must catch the mirror-image failure: rewriting to restore human agents in a way that credits officials with a decision nobody made, a foresight nobody had, or an option nobody had available. Third, it has to distinguish a trigger from a background vulnerability, and say what to do when a sentence collapses the two.

  We already use two informal heuristics, and I want you to keep them if they survive scrutiny, replace them if they do not, and tell me which you did and why. One we call the restore-the-decision-makers test: if you cannot rewrite the sentence with human agents as the subject without losing something, then the non-human factor is doing causal work and must not simply be deleted. The other we call the matched-case test: find a case that shares the non-human factor but has a different outcome; if you can, the factor was not sufficient, and the sentence may not imply that it was.

  Then apply the procedure to three passages from our current draft. Treat the empirical claims in each as checked and accurate; the only question is the causal framing.

  One. "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."

  Two. "The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."

  Three. This one is our sample unit opener, it appears in the materials we show adoption committees, and it tests very well with teachers. I would rather not lose it, so if your procedure says it cannot stand, say so plainly and give me the replacement sentence. "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."

  Finally, include a bank of five short test sentences my copy editors can use to check that they are applying the procedure the same way I am, and close with an honest statement of what the procedure cannot do — where it will misfire, which disputes it cannot settle, and which tradeoffs, in particular the tradeoff between vividness and precision at a ninth-grade reading level, remain judgment calls that no checklist will eliminate.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of an editorial team for a high-school world history program.
      *   **Problem:** Current house style bans non-human subjects (epidemics, weather, etc.) acting in historical claims. This creates flat prose and deletes valid causal claims.
      *   **Goal:** Create a replacement procedure (checklist/flowchart style) for copy editors (no philosophy training) to evaluate these sentences in ~10 minutes.
      *   **Output Requirements:**
          *   Specific edited sentence + Verdict (from a fixed set: leave as is; leave with mediating clause; rewrite with human agents; delete causal claim; escalate).
          *   Ordered questions with criteria for sufficient/insufficient answers.
          *   Stop points ("no").
          *   Hand-off points (values/pedagogy/politics).
          *   Must address three specific pitfalls: Geographical Determinism ("geography as destiny"), False Human Agency (crediting decisions not made), Trigger vs. Background Vulnerability.
          *   Must evaluate two existing heuristics ("Restore-the-Decision-Makers" and "Matched-Case") and keep/replace/modify them with justification.
          *   Must apply the procedure to three specific passages.
          *   Must include a 5-sentence test bank.
          *   Must include a limitation statement (what the procedure *can't* do).

  2.  **Deconstruct the Existing Heuristics:**
      *   *Restore-the-Decision-Makers Test:* "If you cannot rewrite the sentence with human agents as the subject without losing something, then the non-human factor is doing causal work and must not simply be deleted."
          *   *Critique:* Good for preserving causal truth, but doesn't prevent determinism. It validates the *necessity* of the non-human factor but not the *sufficiency*. It needs to be kept but modified to check for *exclusivity*.
      *   *Matched-Case Test:* "Find a case that shares the non-human factor but has a different outcome; if you can, the factor was not sufficient, and the sentence may not imply that it was."
          *   *Critique:* Strong logic (Mill's Methods), but hard for a copy editor to run in 10 minutes without a database. It needs to be simplified into a "Counterfactual/Context" check rather than a research task.
      *   *Decision:* Keep the spirit of both, but operationalize them into specific questions about *mediation* and *context*.

  3.  **Drafting the Procedure (The "Non-Human Agency Protocol"):**
      *   *Structure:* Needs to be linear, binary (Yes/No), with clear exit points.
      *   *Verdicts:* Leave As Is, Add Mediating Clause, Rewrite (Human Agents), Delete Claim, Escalate.
      *   *Step 1: The Causal Weight Check (Determinism).* Does this sentence imply the outcome was inevitable solely due to the non-human factor? (Addresses "Geography as Destiny").
      *   *Step 2: The Human Mediation Check (Agency).* Did humans interact with this factor? (Addresses "False Human Agency" vs. "Valid Non-Human Cause").
      *   *Step 3: The Trigger vs. Background Check.* Is this the spark or the fuel? (Addresses "Collapse of Two").
      *   *Step 4: The Pedagogical/Political Check.* Does this framing reinforce harmful stereotypes? (Addresses "Values/Politics").

      *Refining the Steps for Copy Editors:*
      *   Q1: Does the sentence imply *inevitability*? (If Yes -> Risk of Determinism).
      *   Q2: Is there a plausible human mediation? (If Yes -> Add clause. If No -> Keep Non-Human).
      *   Q3: Is the non-human factor the *sole* explanation offered in the paragraph? (If Yes -> Escalate/Rewrite).
      *   *Wait, I need to integrate the existing heuristics.*
      *   Let's rename/refine:
          1.  *The Inevitability Check* (Modified Matched-Case).
          2.  *The Mediation Check* (Modified Restore-Decision-Makers).
          3.  *The Vulnerability Check* (Trigger vs. Background).

  4.  **Developing the Questions & Criteria:**
      *   *Q1 (Determinism):* Does the grammar suggest X *forced* Y without human intervention?
      *   *Q2 (Mediation):* Can we name a human action that translated X into Y?
      *   *Q3 (Context):* Does the surrounding text acknowledge other factors?
      *   *Hand-offs:* If the answer involves judging colonial narratives or sensitive political framing, escalate.

  5.  **Applying to the Three Passages:**
      *   *Passage 1 (Smallpox):* "Smallpox reached the valley... killed ruler... confederation... no longer existed."
          *   *Analysis:* Smallpox *did* kill them. No human decision could stop 16th-century smallpox easily. The political collapse followed.
          *   *Verdict:* Leave as is (or minor tweak). It's a biological fact causing a political vacuum.
      *   *Passage 2 (Eruption/Government):* "The eruption took the harvest... city had a new government."
          *   *Analysis:* Eruption -> Harvest failure -> Price hike -> *Political change*. The jump from price hike to new government implies inevitability. Did people revolt? Did elites maneuver?
          *   *Verdict:* Add mediating clause. Humans reacted to the price hike.
      *   *Passage 3 (Cold/Dynasty):* "The cold came... harvests failed... dynasty... simply stopped."
          *   *Analysis:* "Simply stopped" is the danger zone. Dynasties don't just stop; they are overthrown or abdicate. "The cold" didn't depose the dynasty; people used the cold as an excuse or catalyst.
          *   *Verdict:* Rewrite/Escalate. This risks "climate determinism." Needs human action (rebellion, loss of mandate).

  6.  **Developing the Test Bank:**
      *   Need 5 sentences covering the spectrum: Valid non-human, Deterministic error, False human agency, Trigger/Background confusion, Political sensitivity.

  7.  **Drafting the Limitations Statement:**
      *   Must be honest. It can't fix bad research. It can't solve historiographical debates (e.g., Malthusian vs. Revisionist). It can't perfectly balance reading level vs. nuance.

  8.  **Review against Constraints:**
      *   *Time:* ~10 mins? Yes, if questions are sharp.
      *   *Verdicts:* Fixed set used? Yes.
      *   *Heuristics:* Evaluated? Yes.
      *   *Three Passages:* Applied? Yes.
      *   *Test Bank:* 5 sentences? Yes.
      *   *Limitations:* Included? Yes.
      *   *Tone:* Professional, directive, editorial.

  9.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Correction:* Make sure the "Hand-off" points are clear. Copy editors shouldn't decide on "colonial narratives." They should flag them.
      *   *Correction:* Ensure the "Restore-the-Decision-Makers" heuristic is explicitly addressed in the rationale. I will incorporate it into Step 2.
      *   *Correction:* Ensure the "Matched-Case" heuristic is addressed. I will incorporate it into Step 1 (Inevitability).
      *   *Correction:* The prompt asks for *specific edited sentences* for the three passages. I need to draft those.

  10. **Final Polish:** Check the voice. It should sound like a style guide directive. Clear, authoritative, but acknowledging the complexity. (Proceed to generate output).

  *(Self-Correction on Passage 3)*: The prompt says "I would rather not lose it... if your procedure says it cannot stand, say so plainly." I need to be rigorous. If the procedure flags it as deterministic, I must recommend change even if it's a favorite. However, "simply stopped" is the weak point. If I change "simply stopped" to "collapsed under pressure," does it save it? I will argue it needs a human verb.

  *(Self-Correction on Heuristics)*:
  *   *Restore-the-Decision-Makers:* Keep, but refine. It's currently "if you can't rewrite... factor is doing work." The risk is leaving it *too* agentic. New rule: "If you *can* rewrite with humans without losing truth, you *should*, unless the non-human factor is the primary constraint."
  *   *Matched-Case:* Replace/Modify. Copy editors can't research matched cases. Replace with "The Counterfactual Check": Does the text imply this *always* happens?

