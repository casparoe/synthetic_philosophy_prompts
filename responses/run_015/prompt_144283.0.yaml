answer: |-
  # Procedure: Non-Human Agency in Historical Causation (NHA-10)

  **Purpose:** To evaluate sentences where non-human factors (climate, disease, geography, technology) appear as the grammatical subject of a historical claim.
  **Time Limit:** 10 minutes per passage.
  **Operator:** Copy Editor.
  **Verdict Options:**
  1.  **Leave As Is** (Non-human agency is accurate and necessary).
  2.  **Add Mediating Clause** (Non-human factor is valid, but human reaction must be explicit).
  3.  **Rewrite** (Restore human decision-makers as the primary subject).
  4.  **Delete Causal Claim** (The causality is unsupported or misleading).
  5.  **Escalate** (The framing involves political, pedagogical, or historiographical disputes beyond copy-editing scope).

  ---

  ## Part 1: Heuristic Evaluation

  You mentioned two existing heuristics. Here is the ruling on their status in this procedure:

  1.  **Restore-the-Decision-Makers Test:** **MODIFIED.**
      *   *Original:* "If you cannot rewrite... without losing something, then the non-human factor is doing causal work and must not simply be deleted."
      *   *Critique:* This correctly protects valid causal claims but fails to prevent "geography as destiny." It validates *necessity* but implies *sufficiency*.
      *   *New Rule:* Use this to determine if a human rewrite is *possible*, but use Step 2 (below) to determine if it is *required*.
  2.  **Matched-Case Test:** **REPLACED.**
      *   *Original:* "Find a case that shares the non-human factor but has a different outcome..."
      *   *Critique:* A copy editor cannot conduct comparative historical research in 10 minutes.
      *   *Replacement:* **The Inevitability Check.** Ask: "Does the sentence imply this outcome happens *every time* this factor appears?" If yes, the claim is likely deterministic and requires modification.

  ---

  ## Part 2: The Procedure (NHA-10)

  Ask the following questions in order. Stop at the first **Verdict**.

  ### Q1: The Inevitability Check (Determinism Risk)
  **Question:** Does the sentence structure imply that the non-human factor *forced* the outcome regardless of human action, policy, or culture?
  *   **Sufficient Answer (No):** The text acknowledges variation, or the outcome is biological/physical (e.g., "frost killed the crop").
  *   **Insufficient Answer (Yes):** The text implies a single path (e.g., "the drought caused the war").
  *   **Action:** If **Yes**, proceed to Q2. If **No**, **Verdict: Leave As Is**.

  ### Q2: The Mediation Check (Human Agency)
  **Question:** Is there a specific human action, decision, or failure that translated the non-human factor into the historical outcome?
  *   **Sufficient Answer:** Yes, a specific action can be named (e.g., "officials raised taxes," "merchants hoarded grain," "rebels seized the moment").
  *   **Insufficient Answer:** No, the outcome was biologically or physically unavoidable (e.g., "the virus killed the host").
  *   **Action:** If **Yes**, **Verdict: Add Mediating Clause**. If **No**, proceed to Q3.

  ### Q3: The Vulnerability Check (Trigger vs. Background)
  **Question:** Is the non-human factor being presented as the *trigger* for an event, when it is actually a *background condition* that made the system vulnerable?
  *   **Sufficient Answer:** The text distinguishes between the stressor (drought) and the fragility (lack of storage/infrastructure).
  *   **Insufficient Answer:** The text treats the stressor as the sole cause of collapse.
  *   **Action:** If **Insufficient**, **Verdict: Rewrite** (Shift focus to the vulnerability) OR **Escalate**.

  ### Q4: The Political/Pedagogical Check (Values Hand-off)
  **Question:** Does attributing this outcome to the non-human factor risk reinforcing a harmful narrative about a specific region or people (e.g., attributing poverty to climate rather than extraction)?
  *   **Sufficient Answer:** No, the framing is neutral or applies globally.
  *   **Insufficient Answer:** Yes, this framing mirrors colonial or deterministic tropes common in historiography.
  *   **Action:** If **Insufficient**, **Verdict: Escalate**. (Do not attempt to solve historiographical debates at the copy level).

  ---

  ## Part 3: Application to Draft Passages

  ### Passage One
  > "Smallpox reached the valley before the soldiers did. Within a year it had killed the ruler and both his heirs, and the confederation that might have held the mountain pass no longer existed."

  *   **Q1 (Inevitability):** Does smallpox *force* political collapse? Not always, but in this specific biological context (no immunity), death is inevitable.
  *   **Q2 (Mediation):** Is there a human action between "death of ruler" and "confederation ended"? No. The leadership vacuum was immediate and biological. There was no decision to dissolve the confederation; the capacity to hold it vanished.
  *   **Q3 (Vulnerability):** Is this trigger or background? Trigger.
  *   **Q4 (Politics):** Does this erase indigenous agency? No, it acknowledges a biological catastrophe that precluded resistance.
  *   **Verdict:** **Leave As Is.**
  *   **Rationale:** The causal chain is biological -> demographic -> political vacuum. No human decision could have prevented the deaths given the historical context. Restoring human agents here would require inventing a decision ("The survivors chose to disband") that misrepresents the suddenness of the collapse.

  ### Passage Two
  > "The eruption took the harvest. By spring the price of rye had tripled; by midsummer the city had a new government."

  *   **Q1 (Inevitability):** Does an eruption/harvest failure *force* a new government? No. Regimes often survive famines.
  *   **Q2 (Mediation):** Is there a human action? Yes. Prices tripled due to market behavior (hoarding/trading). The government changed due to human reaction (revolt/election/coup).
  *   **Q3 (Vulnerability):** The sentence collapses the economic shock and the political reaction.
  *   **Verdict:** **Add Mediating Clause.**
  *   **Edited Sentence:** "The eruption took the harvest. By spring the price of rye had tripled; **amid riots over the cost of bread,** by midsummer the city had a new government."
  *   **Rationale:** The eruption did not depose the government; the *response* to the price hike did. The mediating clause restores the human mechanism without deleting the environmental cause.

  ### Passage Three
  > "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, and a dynasty that had held the throne for two centuries simply stopped."

  *   **Q1 (Inevitability):** Does cold *force* a dynasty to end? No. Other dynasties survived cold snaps.
  *   **Q2 (Mediation):** Is there a human action? Yes. Dynasties end through abdication, conquest, or rebellion. "Simply stopped" implies a mechanical failure, not a historical event.
  *   **Q3 (Vulnerability):** This collapses the background stressor (cold) with the political failure. It ignores why *this* dynasty failed to adapt when others might have.
  *   **Q4 (Politics):** **Escalate Point.** Attributing the fall of a dynasty solely to climate risks "environmental determinism," suggesting the society was passive or incapable of adaptation. This is a high-risk narrative for high-school materials.
  *   **Verdict:** **Escalate.** (However, per your request for a replacement sentence if it cannot stand):
  *   **Replacement Sentence:** "The cold came and did not leave. The harvests failed eleven years running, the granaries emptied, **and unable to relieve the suffering, the dynasty lost the mandate it had held for two centuries.**"
  *   **Rationale:** The original ("simply stopped") is historically false and pedagogically dangerous. The replacement restores the political contract (human dimension) while keeping the climate stressor. If you must keep the original for flow, you must accept the deterministic implication.

  ---

  ## Part 4: Test Bank for Copy Editors

  *Use these sentences to calibrate your application of NHA-10. Compare your verdicts with the key.*

  1.  "The mountain range prevented the army from crossing."
      *   **Verdict:** Leave As Is. (Physical impossibility; no human mediation possible).
  2.  "The river flooded, so the kingdom fell."
      *   **Verdict:** Add Mediating Clause. (Floods do not automatically topple kingdoms; human response to the flood does).
  3.  "Iron deposits made the region wealthy."
      *   **Verdict:** Rewrite. (Iron does not create wealth; human extraction, trade, and labor do).
  4.  "The plague killed 30% of the population, leading to higher wages for survivors."
      *   **Verdict:** Leave As Is. (Labor supply shock is a direct economic mechanism; human decision is secondary to supply/demand).
  5.  "The arid soil caused the nation's poverty."
      *   **Verdict:** Escalate. (High risk of geographical determinism; ignores policy, history, and extraction).

  ---

  ## Part 5: Limitations Statement

  **What This Procedure Cannot Do**

  1.  **It Cannot Settle Historiographical Debates:** If scholars disagree on whether climate change caused the Bronze Age Collapse, this checklist cannot resolve that. It will flag the sentence for escalation, but it cannot generate truth.
  2.  **It Cannot Eliminate the Trade-off Between Vividness and Precision:** A sentence like "The drought starved the valley" is vivid and grammatically non-human. A precise version ("The drought destroyed crops, causing humans to starve") is clunky. This procedure prioritizes accuracy, but copy editors will still face pressure to simplify for a ninth-grade reading level.
  3.  **It Cannot Detect Implicit Bias in Aggregation:** A single sentence may pass NHA-10, but a chapter containing fifty such sentences may still create a deterministic narrative. This procedure works at the sentence level, not the thematic level.
  4.  **It Cannot Fix Bad Research:** If the underlying claim is that "volcanoes cause democracy," no amount of editing will make that valid. This procedure assumes the empirical facts are correct and only adjusts the causal framing.

  **Final Note to Editors:** When in doubt between "Leave As Is" and "Escalate," choose **Escalate**. It is better to delay a sentence for review than to publish a deterministic claim that simplifies human history into a weather report.
