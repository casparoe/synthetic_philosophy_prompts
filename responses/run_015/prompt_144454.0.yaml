  Rejecting Steps 1–3 breaks probability theory, and rejecting Step 6 accepts irrational certainty, so the only viable exit costs you Halfism. You must accept that credence tracks observer-moments (Thirdism), forcing $cr(Heads)$ down to roughly 1/1000 and $cr(Day 1)$ to 2/1001. This saves rationality from the absurdity of being certain it is Day 1 during Tails runs, but it surrenders the principle that physical chance dictates credence independent of indexical location. You escape the contradiction, but you must admit that rational agents should update against hypotheses that predict fewer observer-moments, even when the stochastic event hasn't occurred yet.
