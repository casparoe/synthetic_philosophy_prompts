      *   *Addressing the Work:* Does it threaten the novel? No. Novelty renders psychology, not ontology. Does it kill the emulation's rights? No. Moral weight usually lies in complexity/suffering, not magic dust.
      *   *Addressing "Borrowed Seeming":* This is the crux. The user's insight is sharp.
          *   *Illusionist view:* Supports them. The reader feels the "what-it's-like" without it existing in the text.
