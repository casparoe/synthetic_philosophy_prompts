      *   *Reading 2 (The Error Theory/Representational):* The core illusionist view (Frankish/Dennett). We represent states as having magical properties they lack.
          *   *Status:* Substantive/Defensible.
          *   *Philosopher's intent:* Most likely.
          *   *Impact:* Doesn't kill writing (we still have the representations). Doesn't kill ethics (functional pain still matters).
      *   *Reading 3 (The Radical Eliminativist):* Nothing is conscious. Not even the illusion.
          *   *Status:* Radical, arguably incoherent (the "hard problem" of the illusion itself).
