answer: |-
  You have effectively reconstructed David Lewis's 1976 triviality proof. It is one of the most famous results in the philosophy of language and probability, and it is entirely understandable that it has kept you up at night. You are not messing up the general case; you have stumbled upon a genuine limit in how we can model conditionals.

  Here is the breakdown of your three worries, followed by a recommendation on which premise to sacrifice.

  ### 1. The Typed Language Fix
  You are correct to be suspicious of your typed language solution. Your intuition that it is "worthless for this version of the argument" is right.

  Lewis's proof does not rely on self-embedding (e.g., "If (if A then C) then D"). It relies on the **Law of Total Probability** applied to the conditional itself. Step (3) assumes the conditional is a proposition $X$ that can be conditionalised *upon*. Steps (4) and (5) conditionalise on $C$ and $\neg C$, not on the conditional itself.

  The hierarchy of types prevents a conditional from appearing in the antecedent of *another* conditional. It does not prevent a conditional from appearing as the subject of a probability function $P(\cdot)$. Since the triviality proof only requires the conditional to be in the domain of the probability function (to apply the Law of Total Probability), typing the language does not block the derivation. You cannot save the argument by banning nesting; the problem is deeper.

  ### 2. The Generalisation to "Probably"
  This is a sharp observation, but the proof does not generalise to operators like "probably" in the way you fear. The collapse happens because of a specific feature of the conditional in steps (4) and (5).

  Let $S$ be "Probably $C$".
  Step (4) holds: $P(\text{Probably } C \mid C) = 1$. If $C$ is true, it is consistent with it having been probable.
  However, Step (5) fails: $P(\text{Probably } C \mid \neg C) \neq 0$.

  If I learn that $C$ is false ($\neg C$), it does not follow that $C$ was *improbable* beforehand. A coin can land tails ($\neg C$) even if it was a fair coin (Probably $C$). The statement "Probably $C$" is compatible with $\neg C$.

  By contrast, the indicative conditional "If $A$ then $C$" is traditionally taken to be **falsified** by $A \land \neg C$. That is why $P(A \to C \mid A \land \neg C) = 0$. This specific logical behaviour—being verified by $C$ and falsified by $\neg C$ (given $A$)—is what drives the triviality. "Probably" does not share this truth-functional vulnerability to the falsity of its complement. So, your worry that this proves *all* probabilistic operators collapse is unfounded; the conditional is uniquely problematic here.

  ### 3. The Local Case ($P(A) = 0$)
  This is the point that gets under the skin, and it highlights a distinction between **indicative** and **counterfactual** conditionals.

  *   **In September:** The strike was a live possibility. You were dealing with an *indicative* conditional ("If the strike goes ahead..."). Adams' Thesis (Step 1) is widely accepted as the norm for indicatives.
  *   **In October:** You know the strike was called off ($P(A) = 0$). Your current belief ("If the strike *had gone* ahead...") is a *counterfactual* (or subjunctive) conditional.

  For counterfactuals, Adams' Thesis (Step 1) is generally rejected. We assign truth conditions to counterfactuals (usually via possible worlds semantics: "In the closest world where $A$ is true, is $C$ true?"). Because they have truth conditions, they can be propositions (Step 3 holds). But because they are not simply conditional probabilities, Step 1 fails.

  This explains your intuition: you feel you still have a belief (because you are evaluating a counterfactual proposition), but the math $P(C|A)$ is undefined (because Adams' Thesis doesn't apply to counterfactuals).

  ### The Verdict: Which Step to Drop?

  You asked which premise is cheapest to drop. The consensus among philosophers who wish to preserve the Ramsey Test (Step 1) is to **reject Step (3)**.

  **Reject (3): Conditionals are not propositions.**
  This is the "Suppositional" or "Expressivist" view (championed by Dorothy Edgington and Ernest Adams). On this view, "If $A$ then $C$" does not describe a fact about the world. It does not have a truth value. It is a device for expressing a conditional degree of belief.

  *   **Why this fits your case:** It preserves the Ramsey Test (Step 1). It explains why $P(C|A)$ is the correct measure of your commitment to the bet in September.
  *   **The Cost:** You lose the ability to treat conditionals as standard logical propositions. You cannot easily embed them in complex sentences (e.g., "It is not the case that if A then C" becomes tricky). You also have to accept that when you learned $\neg A$, the conditional didn't become "true" or "false"; the question simply lost its grip because the supposition is no longer live.
  *   **Preserving your intuitions:**
      1.  *Learning $\neg A$ doesn't settle it:* Correct. On this view, learning $\neg A$ doesn't make the conditional true or false; it just removes the context in which the conditional assertion was appropriate. Your lingering belief is actually a shift to a counterfactual stance (which *does* have truth conditions, but isn't governed by Adams' Thesis).
      2.  *Conditionalising is fine:* You can still conditionalise on ordinary evidence ($C$ or $\neg C$). You just cannot conditionalise *on the conditional itself*, because it isn't the sort of thing one can conditionalise on.

  **The Alternative: Reject (1).**
  If you insist that conditionals *must* be propositions (to save logic and embedding), you must reject Adams' Thesis. This is the Stalnaker/Lewis view.
  *   **The Cost:** You admit that $P(\text{If } A \text{ then } C) \neq P(C|A)$. They will be close, but not identical.
  *   **Preserving your intuitions:** This handles the October case well (counterfactuals are propositions). But it forces you to say that in September, your rational credence in the bet was *not* exactly $P(C|A)$, which contradicts the strong intuition behind the Ramsey Test.

  ### Summary
  Your argument is valid. The triviality result stands.
  1.  **Typed languages** do not solve it.
  2.  **"Probably"** escapes it because Step (5) fails for modals.
  3.  **The solution:** For the bet you made in September (an indicative), **reject Step (3)**. The conditional was not a proposition with a truth value; it was a constraint on your credence.

  Regarding the row: If you adopt the view that conditionals aren't propositions (Reject 3), then strictly speaking, there is no "fact of the matter" to settle the bet once the antecedent fails. Your brother-in-law is technically right about the *bet* (it's void), even if you are right about the *philosophy* (your conditional credence was rational). In betting terms, a conditional wager usually requires the condition to be met to be actioned. Since the strike didn't happen, the bet never triggered. You might have won the philosophical argument, but I suspect he is keeping the £50.
