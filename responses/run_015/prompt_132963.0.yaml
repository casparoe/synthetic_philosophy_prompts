      *   *The "Cause" Word:* Explain "But-For" vs. "Contributory." Use the engineering term "Single Point of Failure" vs. "Degraded State."
      *   *The Engineering Metaphor:* Validate it. The node is blamed because the *system design relies on node integrity*, not just aggregate output. The "Post-Mortem" is about *integrity*, not just *uptime*.
      *   *Causal Redundancy:* Explain why it's a non-sequitur. Moral reasons aren't just about leverage. They are about alignment.
