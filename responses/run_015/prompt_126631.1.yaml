prompt: |-
  I've been drafting the final for my second-year logic and metaphysics course and I'm struggling to write a question on Quine that isn't just 'explain Two Dogmas'. I want something that actually tests whether they understand why the analytic-synthetic split collapses, not just whether they can name the two dogmas. During a tutorial the other day someone raised this idea of 'micro-analytic' pockets — little clusters of beliefs inside a larger web where revision is technically possible but so costly that the beliefs behave like definitions. It struck me that this might be a good exam hook: ask students whether Quine's holism really kills all forms of analyticity, or whether these micro-pockets let you keep a thinned-out version that survives his circularity and revisability arguments.

  Could you write me the essay question itself (aimed at about 60 minutes, expecting 800-1000 words), plus a model answer of roughly 600 words, and a marking scheme with five explicit criteria? I want the scheme to award marks out of 25 and clearly seperate an A answer (which handles both Quine's circularity point and the micro-analytic rescue attempt) from a B answer (which summarises Quine well but treats the rescue attempt superficially). Please include, for each criterion, the specific misconception or weak move that costs marks, and make sure the question can't be answered by simply reciting the standard summary of his essay refering to the two dogmas.
