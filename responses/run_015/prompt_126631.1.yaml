answer: |-
  ### Exam Question

  **Course:** Logic and Metaphysics II
  **Time Allowed:** 60 Minutes
  **Word Count:** 800–1000 words

  **Question:**
  Quine argues that the analytic-synthetic distinction is an unempirical dogma, relying on circular definitions of synonymy and ceding to the holism of the web of belief. However, a contemporary interlocutor suggests that within Quine's web, certain nodes are so centrally located that revising them would cause catastrophic systemic collapse. These 'micro-analytic pockets' behave *as if* they are definitions, even if they are theoretically revisable.

  Evaluate this proposal. Does the existence of 'micro-analytic pockets' successfully preserve a meaningful concept of analyticity against Quine's arguments regarding circularity and revisability? Or does this move merely conflate psychological entrenchment with logical truth? In your answer, you must address whether pragmatic centrality can substitute for the modal force traditionally required by analyticity.

  ***

  ### Model Answer (Approx. 600 words)

  Quine's demolition of the analytic-synthetic distinction in *Two Dogmas of Empiricism* rests on two pillars: the circularity of defining analyticity through synonymy, and the holist claim that any statement can be held true come what may. The proposal of 'micro-analytic pockets' attempts to salvage analyticity not as a metaphysical absolute, but as a pragmatic functionalism within the web of belief. While this move captures the *utility* of analytic statements, it ultimately fails to preserve the *concept* of analyticity because it conflates degree of entrenchment with kind of truth.

  To evaluate this, we must first recall Quine's circularity argument. Quine contends that attempts to define analyticity (e.g., "true by virtue of meaning") invariably rely on notions like 'synonymy' or 'necessity,' which are themselves just as obscure as analyticity. If 'micro-analytic pockets' are defined simply as beliefs we are unwilling to revise, the proponent avoids the circularity of meaning-based definitions. However, they do so at the cost of changing the subject. Traditional analyticity carries modal force; an analytic truth is true in all possible worlds. A 'micro-analytic' truth, by the interlocutor's own admission, is only "technically revisable." This admission surrenders the modal requirement. If a belief can be revised, even at high cost, it is not analytic in the Kantian or Fregean sense; it is merely a deeply entrenched synthetic belief.

  The strength of the 'micro-analytic' proposal lies in its alignment with Quine's holism. Quine argues that the difference between analytic and synthetic statements is merely one of degree—how close to the center of the web a statement lies. Logical laws are central; observational reports are peripheral. The interlocutor correctly identifies that central nodes (like 'bachelors are unmarried') function systematically like definitions. They organize the web. To revise them requires massive ripple effects. In this pragmatic sense, the 'pocket' survives. It explains why we *treat* certain truths as immune to empirical refutation.

  However, treating pragmatic immunity as analyticity collapses under Quine's revisability argument. Quine insists that *no* statement is immune to revision, not even logical laws (as seen in quantum logic proposals). The 'micro-analytic' proponent accepts this theoretical revisability but argues the cost is too high. The fatal flaw here is confusing psychological or systemic *difficulty* with logical *impossibility*. If the distinction rests entirely on the cost of revision, it becomes relative to the current state of the scientific web. A statement might be 'micro-analytic' in 1950 but 'synthetic' in 2050 as the web shifts. This makes analyticity transient and empirical, which contradicts the very notion of a truth grounded in meaning rather than fact.

  Furthermore, this rescue attempt does not solve the circularity problem; it sidesteps it. If we ask *why* these pockets are central, the answer is usually that they define the terms within the system. But if we cannot define 'definition' without relying on synonymy (which Quine argues we cannot), we haven't explained the pocket's status; we've just mapped its location. We know *where* the analytic-like statements are, but not *what* makes them analytic.

  In conclusion, 'micro-analytic pockets' offer a compelling description of how language functions within Quine's holism. They acknowledge that some beliefs are structurally distinct due to their centrality. However, they fail to preserve analyticity as a philosophical category. By admitting theoretical revisability, they strip these truths of their necessary modal force. By grounding the distinction in revision costs, they render analyticity empirical and transient. Quine's critique stands: we have a continuum of belief entrenchment, but no sharp boundary where meaning ends and fact begins. The 'micro-analytic' is a pragmatic shadow of analyticity, not its survival.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Criterion 1: Explanation of Quine's Circularity Argument (5 Marks)**
  *   **A (5):** Clearly explains that definitions of analyticity rely on synonymy/necessity, which are equally unexplained. Notes that the 'micro-analytic' view sidesteps this but fails to solve it.
  *   **B (3-4):** Summarises the circularity argument correctly but fails to connect it to the 'micro-analytic' proposal (treats them as separate points).
  *   **C (0-2):** Vague reference to "circular definitions" without explaining the synonymy link.
  *   **Misconception costing marks:** Claiming Quine argues analyticity is *false* rather than *unintelligible/unempirical*.

  **Criterion 2: Understanding Holism and Revisability (5 Marks)**
  *   **A (5):** Accurately describes the web of belief and the principle that *any* statement is revisable in principle. Distinguishes between 'central' and 'peripheral' nodes.
  *   **B (3-4):** Describes the web of belief well but implies some statements (like logic) are strictly unrevisable, missing Quine's radicalism.
  *   **C (0-2):** Treats holism as simply "everything is connected" without addressing the revision implications.
  *   **Misconception costing marks:** Asserting that Quine believes *no* beliefs should be revised, rather than that *any* can be.

  **Criterion 3: Analysis of the 'Micro-Analytic' Proposal (5 Marks)**
  *   **A (5):** Identifies the proposal as a shift from logical necessity to pragmatic centrality. Evaluates it on its own terms before critiquing.
  *   **B (3-4):** Describes the proposal as "beliefs we don't change" but treats it as a valid counter-argument to Quine without sufficient scrutiny.
  *   **C (0-2):** Dismisses the proposal immediately without explaining what it entails.
  *   **Misconception costing marks:** Confusing the 'micro-analytic' idea with Kripkean necessary a posteriori truths.

  **Criterion 4: Distinction Between Pragmatic Centrality and Logical Truth (5 Marks)**
  *   **A (5):** Explicitly argues that 'cost of revision' (pragmatic) is not the same as 'truth by meaning' (logical/modal). This is the core A-grade discriminator.
  *   **B (3-4):** Acknowledges the difference but concludes the pragmatic version is "good enough" without addressing the loss of modal force.
  *   **C (0-2):** Conflates psychological certainty with logical truth.
  *   **Misconception costing marks:** Arguing that high revision cost *creates* analyticity (Quine's exact opposite).

  **Criterion 5: Argumentative Coherence and Structure (5 Marks)**
  *   **A (5):** Essay flows logically from Quine's critique to the proposal to the refutation. Conclusion synthesizes the arguments.
  *   **B (3-4):** Clear structure but sections feel disjointed (e.g., "Quine says X. The proposal says Y. I think Z").
  *   **C (0-2):** Disorganized, difficult to follow, or significantly under/over word count.
  *   **Misconception costing marks:** Using the essay merely to recite a summary of *Two Dogmas* without engaging the specific 'micro-analytic' prompt.

  **Grade Boundaries:**
  *   **A (20–25):** Strong on Criteria 1, 2, and crucially 4. Handles the circularity point and the pragmatic/logical distinction.
  *   **B (15–19):** Strong on 1 and 2, but superficial on 3 and 4. Good summary of Quine, but accepts the 'micro-analytic' rescue too easily.
  *   **C (10–14):** Competent summary of Quine, weak engagement with the specific prompt.
  *   **D/F (0–9):** Fundamental misunderstandings of Quine or the prompt.
