  ### 1. The Rule Priya Is Running

  Your guess ("Healthy = predicts unseen; Sick = explains seen") is about 80% correct, but it fails to explain **Case 6 (Scheduling-optimizer)**. That team was in "explain-every-miss mode" (which your rule says is Sick) but was kept.

  The missing variable is **Replacement Viability**.

  Priya's actual algorithm is a two-stage filter:

  1.  **The Insight Test:** Does the project generate *generalizable causal insight*? (i.e., Does a fix for Problem A correctly predict the behavior of System B, or a metric nobody was watching?)
      *   *Pass:* Fund (Cases 2, 3).
      *   *Fail:* Defund **UNLESS** Stage 2 applies (Cases 1, 4, 5).
  2.  **The Incumbency Buffer:** If the project fails the Insight Test, is there a *viable alternative* ready to take over the utility?
      *   *No Alternative:* Keep funding on "maintenance/utility" grounds (Case 6).
      *   *Alternative Exists:* Kill immediately (Case 6 logic: "You pull it because something better showed up").

  **The Tight Rule:** **Fund projects that generate novel, generalizable truth. Fund projects that merely maintain utility only so long as no truth-generating alternative exists.**

  ### 2. Competing Rules (And Why They Get You Torn Apart)

  You need to be ready for these alternative interpretations, because if you state your rule too narrowly, Priya will test you with these edge cases.

