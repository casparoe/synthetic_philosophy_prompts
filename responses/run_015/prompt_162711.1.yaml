answer: |-
  You should rule this case **corrupt**. To remain consistent with your precedents, you must treat the upstream manipulation of access as decisive, regardless of the downstream procedural purity. The closest analog is the **Procurement Officer**. In both instances, an official used their position to confer a structural advantage on a connected party (a brother-in-law's firm; a specific community) despite declaring the interest, recusing themselves from the final decision, and ensuring the final transaction was technically sound (market rate; clean scoring). Your panel has already established that procedural safeguards cannot cure the prior misuse of office to shape the field of competition.

  Of your two formulations, **Rule A** (office resources or discretion deployed for the advantage of a section rather than for the purposes of the office) best predicts your track record. It captures the Procurement Officer (shortlist manipulation), the Engineer (council vehicle), and the Mayor (public works steering). **Rule B** (benefits distributed by connection rather than criteria) predicts a verdict of *not corrupt* here, because the grants were awarded by published rubric and clean scoring. However, Rule B fails to explain the Procurement Officer verdict, where the contract was won at market rate via scoring. Your track record therefore rules out several plausible alternative rules: that corruption requires **private monetary gain** (ruled out by the Mayor); that **local custom or consent** exonerates misuse (ruled out by the Engineer); and that **procedural compliance** at the point of allocation cures upstream bias (ruled out by the Procurement Officer).

  By ruling corrupt, you adopt the principle that institutional capacity must remain neutral even when substantive outcomes appear meritorious. You are right to worry about smuggling in a Western ideal of impersonal administration. Your precedents, however, show you are already committed to it. The Mayor and Engineer cases explicitly reject particularistic duties (to voters, to a village) over universalistic office duties. The distinction lies not in rejecting community solidarity, but in rejecting the *hijacking of institutional trust* to serve it. Here, the use of foundation branding and premises converts public capacity into exclusive community asset. If you rule *not corrupt*, you privilege substantive equity (helping a marginalized group) over procedural equity (equal access to support), effectively endorsing a form of benevolent patronage that your verdict on the Mayor suggests you otherwise forbid.

  The further case that best discriminates between Rule A and Rule B is this: A panel member coaches community applicants using **personal time, personal email, and no foundation branding or premises**, yet the same disproportionate outcome occurs. If you rule *not corrupt* there, you confirm Rule A is the operative standard (misuse of resources matters more than connection). If you rule *corrupt*, you confirm Rule B (connection itself is the taint).

  The consideration that would move me to the opposite ruling is evidence that the foundation's **mandate explicitly required capacity building** in marginalized communities, and that these workshops were the only viable method to execute that mandate. If the "office purpose" includes leveling the playing field for refugees, then using office resources for them is not sectional advantage but mission fulfillment.

  My reasoning is most likely to break down in distinguishing between **legitimate outreach** and **exclusive coaching**. If the foundation encourages applicants to seek help, and this member provided the only help available, is that corruption or a failure of the foundation's own outreach? The line between "deploying resources for a section" and "fulfilling a mandate to a target group" is perilously thin in development work.

  The empirical assumption you must check before Monday is whether the **premises were booked officially** and whether the **use of branding was authorized**. If she booked the room as a private individual and used the logo without permission, the corruption is clear misappropriation. If the room was booked through general channels and the logo use was standard for panelists, the "resource" claim weakens significantly. Check the facility logs and communications policy.
