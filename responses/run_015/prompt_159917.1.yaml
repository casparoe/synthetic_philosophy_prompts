prompt: |-
  hey — I'm hoping you can help me settle a thing thats been bugging me for a week. Please act as a professional philosopher who is also comfortable with basic computability theory and decision theory, and take it seriously: brainstorm the full space of candidate readings before you start sorting them, then commit to verdicts. I really don't want "it depends" as an answer.

  So. I'm not an academic at all, I do math puzzles for fun and I'm in a group chat where people make dumb little side bets. Last week I said something like: I haven't finished checking whether this big number is prime, my search has cleared all the candidate divisors up to 10^7 and nothing's divided it yet, so I'm about 70% on it being prime, and I'd take a bet at those odds. Someone replied: "you can't be uncertain about math — it's already either true or false, probabilities don't apply." That was treated as closing the subject.

  Then the exact same line got used twice more in the same week, and it was obviously doing different work each time:

  1. Someone said it means an agent that updates by Bayes shouldn't change its mind on a math question just because it spent longer thinking or got a faster computer — the answer was fixed the whole time, so more computation isn't evidence.
  2. Someone else used it to say you should basically never bet against a claimed proof, since the proof either works or it doesn't and if it works the conclusion is as certain as certain gets.

  What I want is the menu, not one answer. What are the distinct precise theses that slogan could be asserting, from the totally trivial up to the substantive and then to the actually false? Some of what I hear rattling around inside it: something about necessity versus contingency; something about a proof being the thing that gives certainty; something about what a standard of rationality is even allowed to demand of someone who isn't infinitely smart; something about whether "70% prime" is really a claim about the number, or about my half-finished search, or about what I'll believe later on. For each reading tell me whether it's trivial, defensible-but-substantive, or false. And the part that matters most: which reading would person (1) and person (2) each need in order to get their conclusion, and does that reading actually deliver it, or does it quietly smuggle in something extra?

  One more thing, and this is the bit I care about most, because it's my own idea and I've never seen it anywhere. Call a belief state "bounded-coherent" if there's no betting strategy such that (a) the strategy could have been written down and handed to you before you started looking into the question, and (b) it guarentees you loose money no matter how the question turns out. So a bookie who is smarter than you doesn't count, and neither does one who just runs his search longer than yours — only the one whose system you could have had in your pocket from the start. My questions: does bounded-coherence actually rule out intermediate confidence in already-settled math facts, or does it let it in? Is it strong enough to be worth anything at all, i.e. is there anything it rules out? And does it have anything to say about whether your confidence is supposed to get better the longer you think — and if so, better in what sense, given that at no point along the way do you actually have a proof?

  Assume I know what a Dutch book argument is and what computable means, and nothing fancier than that. Please don't give me reading lists or names to look up, I can't get at any of that and I don't want names — I want the distinctions straight. A numbered list with a one-line verdict on each item would be perfect, and please tell me plainly where my own principle is confused.
