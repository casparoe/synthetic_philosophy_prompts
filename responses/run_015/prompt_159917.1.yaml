answer: |-
  Here is the menu of distinct precise theses hidden inside that slogan, sorted from trivial truths to substantive errors, followed by the analysis of your interlocutors and your own principle.

  ### The Menu of Candidate Readings

  1.  **Ontological Determinacy:** Mathematical propositions have a fixed truth value independent of whether anyone knows it.
      *   **Verdict:** Trivially true (under standard realism), but irrelevant to betting behavior.
  2.  **Ideal Agent Certainty:** An agent with infinite computational power and time should assign probability 0 or 1 to all math claims.
      *   **Verdict:** Trivially true by definition of "infinite power," but irrelevant to humans.
  3.  **Logical Omniscience Requirement:** A rational finite agent is irrational if they assign any probability other than 0 or 1 to a math claim.
      *   **Verdict:** False; this demands impossible cognitive capabilities and makes learning impossible.
  4.  **Evidence Irrelevance:** Performing a computation provides no new evidence because the output is logically implied by the input.
      *   **Verdict:** False for bounded agents; computation converts implicit information into explicit evidence.
  5.  **Semantic Elimativism:** Statements like "70% prime" are category errors and literally meaningless.
      *   **Verdict:** False; these statements successfully communicate epistemic states and guide action.
  6.  **Pragmatic Prohibition:** One should never accept a bet on a mathematical proposition unless one possesses a formal proof.
      *   **Verdict:** False; this leaves money on the table and violates basic decision theory under uncertainty.

  ### Analysis of Person (1) and Person (2)

  **Person (1): "Computation isn't evidence, so don't update."**
  *   **Required Thesis:** They need **Reading 4 (Evidence Irrelevance)** to be true.
  *   **Does it deliver?** No. While the *truth* of the math doesn't change, your *access* to the truth does. For a bounded agent, the output of a computation is physically distinct from the input until the computation is run. Treating the result as evidence is not only permitted but required for rationality. Person (1) is conflating ontological fixity with epistemic accessibility.

  **Person (2): "Never bet against a claimed proof."**
  *   **Required Thesis:** They need **Reading 6 (Pragmatic Prohibition)** to be true, supported by **Reading 3 (Logical Omniscience Requirement)** (assuming you should know the proof is valid).
  *   **Does it deliver?** No. Proofs can be flawed, and verifying them costs resources. If a claimed proof comes from a unreliable source, betting against it is often the profitable move. Person (2) is conflating the *existence* of a valid proof with the *presentation* of a proof.

  ### Analysis of Your "Bounded-Coherence" Principle

  You defined a belief state as "bounded-coherent" if no betting strategy written down *before* you started thinking guarantees a loss regardless of the outcome.

  **1. Does bounded-coherence rule out intermediate confidence (e.g., 70%)?**
  *   **Verdict:** No. It lets intermediate confidence in.
  *   **Reasoning:** You can assign 0.7 to "Prime" and 0.3 to "Composite" without creating a guaranteed loss. A Dutch book only arises if your probabilities sum to more than 1 or violate logical relations you can *currently* verify. Since you cannot verify the primality beforehand, assigning 0.7/0.3 is coherent.

  **2. Is it strong enough to be worth anything?**
  *   **Verdict:** Yes, but only barely.
  *   **Reasoning:** It rules out blatant arithmetic inconsistencies (e.g., assigning 0.7 to Prime and 0.7 to Composite). It enforces the basic axioms of probability over what you can currently check, which prevents immediate exploitation on logical trivialities.

  **3. Does it say confidence should get better the longer you think?**
  *   **Verdict:** No. It says nothing about learning.
  *   **Reasoning:** Your definition is a static constraint on the *starting* state. It places no requirement on how you must update when new computation results arrive. You could remain at 70% forever and still satisfy bounded-coherence.

  **4. Where is your principle confused?**
  *   **Verdict:** You are confusing *consistency* with *accuracy*.
  *   **Reasoning:** You suspect bounded-coherence might force you toward 0 or 1 because the fact is fixed. It does not. It only forces you to be consistent with what you *know* at the time of commitment. Since you don't know the answer at the start, you are not required to bet as if you do. Your principle successfully defends your right to hold 70% confidence, but it fails to justify *changing* that confidence later; for that, you need a rule of updating, not just a rule of coherence.

  ### Final Verdict on Your Situation

  You were right to take the bet; your friends were wrong to shut down the discussion. The slogan "probabilities don't apply" is only true for **Reading 1** (the world is fixed) and **Reading 2** (gods don't gamble), both of which are irrelevant to human decision-making. For any finite agent making decisions under computational constraints, **Logical Uncertainty** is real, quantifiable, and actionable. Your 70% estimate is a valid measure of your computational state, not a claim about the number's ontology.
