answer: |-
  In your vocabulary, the standard reinforcement learning setup assumes a Markov Decision Process where transition dynamics $P(s'|s,a)$ and rewards $R(s,a)$ are fixed functions independent of the agent's policy $\pi$. Both puzzles violate this assumption: the environment contains a mechanism that queries $\pi$ itself.

  **The Translation**
  In **Counterfactual Mugging**, the environment samples a context $C \sim \text{Bern}(0.5)$. Before the episode begins, a predictor model $M_{pred}$ estimates $A \sim \pi(\cdot|C)$ using logged data. The reward function is $R = \$10k \cdot \mathbb{I}(C=H \land M_{pred}=\text{Pay}) - \$100 \cdot \mathbb{I}(C=T \land A=\text{Pay})$. You observe $C=T$. The task is to select $A$.
  In **XOR Blackmail**, a hidden state $E \sim \text{Bern}(0.01)$ determines house destruction. The observation $L$ (letter) is generated deterministically: $L = E \oplus \mathbb{I}(A=\text{Pay})$. You observe $L=1$. The reward is $R = -\$1M \cdot E - \$1k \cdot \mathbb{I}(A=\text{Pay})$.

  **The Prescriptions**
  **Causal Decision Theory (CDT)** treats your action as an intervention $do(A)$. It assumes $P(E|do(A)) = P(E)$ and treats $M_{pred}$'s output as fixed history. In Mugging, since $C=T$ is observed, paying yields $-\$100$ with no upstream benefit; CDT refuses. In Blackmail, paying does not causally prevent $E$; CDT refuses.
  **Evidential Decision Theory (EDT)** maximizes $E[R|A]$. In Mugging, $A$ provides no evidence about $C$ (already known), so EDT refuses. In Blackmail, conditioning on $A=\text{Pay}$ given $L=1$ implies $E=0$ (since $1 = E \oplus 1 \Rightarrow E=0$). Paying is strong evidence the house is safe; EDT pays.
  **Functional Decision Theory (FDT)** treats $A$ as the output of a function $f(\text{obs})$. It evaluates counterfactuals where $f$'s output changes across all instances, including simulations within $M_{pred}$ or the logic determining $L$. In Mugging, if $f$ outputs "Pay", $M_{pred}$ predicts "Pay", securing the \$10k in the $C=H$ branch (weighted by prior). FDT pays. In Blackmail, if $f$ outputs "Pay", $L$ would not have been sent unless $E=0$. FDT pays.

  **The Wrinkles**
  Your first wrinkle (v1 vs. v2) highlights the **overlap problem** in off-policy evaluation (OPE). $M_{pred}$ is trained on $\pi_{v1}$. If you deploy $\pi_{v2}$, importance ratios $\pi_{v2}(a)/\pi_{v1}(a)$ may be undefined or high-variance if support differs. Standard OPE assumes the target policy is evaluated on the same structural causal model. FDT bypasses this by assuming $M_{pred}$ simulates the *code* of $\pi_{v2}$, not the *distribution* of $\pi_{v1}$. This is not statistical generalization; it is logical identity. If $M_{pred}$ is merely a statistical classifier, FDT's prescription relies on an assumption your toolkit flags as misspecification: that the predictor's output updates logically with your current code, not just statistically with past data.

  The second wrinkle (asymmetry) concerns **temporal ordering vs. logical dependence**. In Mugging, the payoff branch ($C=H$) has zero probability in your current trajectory; it is a pure counterfactual. In Blackmail, your action influences the existence of the observation $L$ via a logical constraint, not a causal edge. In ML terms, Mugging requires optimizing ex-ante expected return (policy level) while acting ex-post (step level). Blackmail requires correcting for selection bias induced by the agent's own decision rule.

  **Residue Report**
  Your first hypothesis—that this is a **policy-independent environment violation**—is correct but incomplete. Standard meta-RL can handle rewards dependent on $\pi$, but usually via gradient estimation over episodes. Here, the dependence is instantaneous and logical. The environment isn't just reacting to your behavior; it contains a snapshot of your decision function. This breaks the agent-environment boundary assumed in standard MDPs.

  Your second hypothesis—that **logical counterfactuals** exceed statistical machinery—is the critical residue. Pearl's $do$-calculus works by severing edges into the intervened node. FDT requires *updating* nodes that are causally upstream (the predictor's past output) but logically downstream (dependent on the same function). Statistical counterfactuals ask, "What if I took action $a$ given history $h$?" Logical counterfactuals ask, "What if the function generating my actions returned $a$?"

  **Conclusion**
  The dispute is not about probability estimates; your toolkit can compute $P(E|A)$ or $E[R|do(A)]$ precisely. The dispute is about **ontology**. CDT assumes you are a physical cause isolated from past predictions. FDT assumes you are a logical instance instantiated multiple times (in you, in the predictor, in the blackmail logic). Your framework forces a choice: treat the predictor as a fixed covariate (CDT) or as a coupled system (FDT). The "misspecification" is not in the dynamics, but in the assumption that the agent's decision function is not a variable in the environment's structural equations. If you accept that your code is a causal variable accessible to the environment, FDT collapses into standard optimization over a larger causal graph. If you maintain the standard boundary, FDT looks like magical thinking. The residue is the lack of a formal calculus for "logical intervention" within standard probabilistic graphical models.
