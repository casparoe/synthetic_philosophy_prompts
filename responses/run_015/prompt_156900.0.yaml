      *   Classically: `◇ (K p)` implies `¬ □ ¬ (K p)`. But we proved `¬ (K p)`. If `¬ (K p)`, then `□ ¬ (K p)` (by Necessitation of proved facts). Contradiction.
      *   Constructively: We get `El (◇ (K p))` and `El (K p) → ⊥`. We cannot eliminate `◇` without further axioms (like `◇ A → ¬ ¬ A` or similar).

