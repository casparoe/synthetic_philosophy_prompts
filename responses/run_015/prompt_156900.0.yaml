  What you *can* prove in Agda without classical axioms is:
  `¬ UnknownTruth`
  Which expands to:
  `(Σ[ A ∈ U ] (El A × (El (K A) → ⊥))) → ⊥`
  This is logically equivalent to:
  `(A : U) → El A → ¬ (El (K A) → ⊥)`
  Which is:
  `(A : U) → El A → ¬ ¬ (El (K A))`

  **Your friend is correct.** The derivation yields `p → ¬ ¬ K p`. It does **not** yield `p → K p`. The collapse to Omniscience (`p → K p`) requires Double Negation Elimination (DNE) on the type `El (K A)`.

