      *   **Anti-Adaptationism (Gould/Lewontin):** Critique of "pan-selectionism." Emphasis on constraints, drift, spandrels (byproducts), history.
      *   **The Stalemate:** Adaptationists say "show me it's *not* adaptive." Critics say "show me it *is* adaptive."
      *   **Nature of Disagreement:** It's not just empirical (counting traits). It's about heuristics, burden of proof, and what constitutes a good explanation.
