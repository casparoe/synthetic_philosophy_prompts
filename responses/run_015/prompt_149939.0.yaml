      *Drafting the response:*
      This stalemate is primarily methodological rather than verbal or purely empirical, rooted in divergent priors about the burden of proof, and while a global resolution is unlikely, local progress occurs through refined null models rather than philosophical concession.

      The disagreement is not verbal because both camps generally agree on the definition of an adaptation—a trait shaped by natural selection for a specific function—and instead clash over the heuristic default used when investigating unknown traits. It is not purely substantive because the question of the global prevalence of spandrels versus adaptations is empirically ill-posed; traits are not discrete, countable units but nested, historically contingent structures where function and constraint are often intertwined. Consequently, the conflict is methodological, centering on whether the null hypothesis should assume selective optimization or structural neutrality. Adaptationists treat optimization as the baseline expectation, requiring critics to demonstrate why selection *could not* have acted, whereas critics treat adaptation as a specific historical claim requiring positive evidence of selection history distinct from current utility.

      Your software engineering analogy captures the philosophical divide accurately. The adaptationist stance mirrors a user-story-first mentality, assuming every feature exists to solve a specific user problem unless proven redundant, which drives functional clarity but risks over-engineering explanations for legacy code. The critic's stance mirrors an architecture-review mentality, recognizing that some structures exist solely because of database constraints, dependency chains, or refactoring residues, which prevents functional hallucination but risks underestimating intentional design. In biology, as in software, both perspectives are necessary: ignoring function misses the point of the system, while ignoring constraints leads to impossible designs.

