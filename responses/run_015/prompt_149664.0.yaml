answer: |-
  Dear Colleague, I have spent considerable time thinking about how to make the no-trade theorem visceral for students who are more comfortable with philosophical argumentation than formal modeling, and I agree that the standard double auction mechanism is ill-suited for this specific pedagogical goal because it relies too heavily on liquidity and continuous price discovery. If half the room disengages, a double auction collapses into thin air, leaving the remaining students with no counterparty and no data, which ruins the lesson about information aggregation. I also considered a fixed-price take-it-or-leave-it mechanism where I act as the market maker, but I discarded that because it removes the burden of price formation from the students, and the no-trade result is specifically about the information contained in a counterparty's willingness to trade at a specific price. Instead, I have settled on a bilateral open outcry design with token assets, which is robust to low engagement because every student is a potential counterparty to every other student, and trade can happen in isolated pairs without needing a critical mass of active traders to sustain a market price. This ensures that even if only a third of the class is aggressive, the experiment still generates data points about willingness to trade, which is exactly what we need to discuss the ambiguity of trade volume.

  To run this, you will need three stacks of index cards, a bag of cheap chocolate coins or squares, and a pen for each student. The first stack consists of eighteen Asset Cards, one for each student, simply labeled Share. The second stack is eighteen Signal Cards, which you must prepare in advance by splitting them into two distinct decks of nine cards each. Deck A should contain signals that are positively correlated with a high value state, say eight cards saying Good News and one saying Bad News. Deck B should be the mirror image, with eight cards saying Bad News and one saying Good News. You will distribute these secretly so that half the room holds Deck A signals and half holds Deck B signals, but you must tell the class that all signals are drawn from a single common deck so they assume a common prior. The third stack is blank index cards for writing trade contracts. The state of the world, which determines the final value of the Asset, will be determined by a single coin flip or urn draw at the very end of the session, where Heads means the Asset is worth four pieces of chocolate and Tails means it is worth zero. Each student starts with one Asset Card and one Signal Card. They are told that their goal is to maximize their chocolate payout. They may keep their asset or sell it to another student in exchange for a promised amount of chocolate, written on a contract card signed by both parties. Crucially, you must enforce a rule that no prices are announced to the room between rounds. You will only announce the total number of trades that occurred in the previous round.

  The timeline for the seventy-five-minute session should be tight to maintain energy. Spend the first five minutes seating the students and handing out the Asset and Signal cards, instructing them not to show their signal to anyone. Use the next ten minutes to explain the value structure and the trading rules, emphasizing that trades are binding and will be settled in chocolate at the end. From minute fifteen to minute thirty, open the floor for Round One trading. Students should stand up and mill about, negotiating bilateral deals. If a deal is struck, they write the price on a blank card, sign it, and hand it to you or place it in a designated box so you can track volume. At minute thirty, call time and announce only the number of trades, say for example six trades occurred. Do not validate whether these were good or bad deals. From minute thirty-five to minute fifty, open Round Two. The hope is that the volume announcement acts as a public signal, prompting students to update their beliefs about the population's information. At minute fifty, call time and announce the new volume. From minute fifty-five to minute seventy, open Round Three. This is the final chance to trade before the resolution. At minute seventy, collect all Asset Cards and Contract Cards. Reveal the state of the world by flipping the coin or drawing from the urn. Settle all contracts immediately by paying out the chocolate, ensuring that students who sold an asset that turned out to be valuable see their counterparty win big, and vice versa. This immediate settlement is vital for the emotional impact of the regret or vindication.

  The debrief is where you connect the visceral experience to the epistemology. Do not name the Milgrom-Stokey no-trade theorem until the very end. Start by asking the students who traded why they did so. When a buyer explains themselves, ask the room if anyone considered that the seller's willingness to sell was itself a signal that the seller believed the value was low. You want them to articulate the recursive reasoning that if everyone is rational and shares a prior, a trade offer should scare you off. Then, reveal the twist about the two decks. Explain that half the room was primed to be optimistic and half pessimistic, meaning the Common Prior assumption was violated without their knowledge. Map this specific moment to the theoretical assumption: the theorem holds only if priors are common, but in real markets, we often mistake diversity of priors for private information. Ask them what the trade volume told them. Since you hid the prices, the volume was ambiguous. It could have meant everyone was irrational and trading against their own interest, or it could have meant the population was split into two distinct belief clusters. This leads to the Hayekian point that the market volume encoded a fact about the population's diversity that no individual could have stated from their own perspective. You should be frank that the game cannot reproduce Common Knowledge of Rationality. In the game, students suspect each other of being confused or careless, whereas the theorem assumes everyone knows everyone is rational. You will have to supply this distinction in words, explaining that in the model, the lack of trade is driven by the certainty of others' rationality, whereas in the classroom, the lack of trade might just be risk aversion or social awkwardness.

  There are three predictable failure modes you should be prepared to handle. The first is that almost nobody trades in round one. This is actually a successful demonstration of the no-trade result, but it risks boring the students. If this happens, lean into it during the debrief by asking if anyone held a signal that made them want to trade but were afraid to. Use this to highlight the paralyzing effect of the no-trade logic. The second failure mode is that one loud student anchors every price. Since you are not announcing prices, this matters less for the data, but it can skew the room's perception of value. If this occurs, intervene privately during the trading rounds to remind students they can negotiate any price they like and should not accept the first offer. The third and most likely failure is apathy due to the low stakes of cheap chocolate. If half the room stops caring, the mechanism holds, but the discussion might falter. To mitigate this, frame the chocolate as reputation points or emphasize that the settlement is public, so losing chocolate is socially visible. If engagement drops, do not panic. The no-trade theorem is often counterintuitive precisely because in real life people do trade, so a flat market gives you the opportunity to discuss why real markets differ from the model, perhaps due to liquidity needs or differences in priors which you secretly introduced. Finally, acknowledge that the game cannot fully reproduce the common knowledge condition. You can tell them you are rational, and they can tell each other, but they cannot know that you know that they know. This infinite regress is the fragile heart of the theorem, and while the game simulates the hesitation, you must supply the logical rigor in the closing minutes to ensure they understand that the no-trade result is a logical necessity under strict assumptions, not just a behavioral tendency.
