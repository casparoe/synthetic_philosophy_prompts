answer: |-
  **The Scenario**

  In a large research firm, two department heads, Ali and Ben, manage identical teams with identical budgets, occupy identical office suites, and hold identical written memos from management granting them full autonomy over their project selection. Both report identical high levels of job satisfaction and neither desires a change in their working conditions, trusting the current leadership implicitly. However, Ali's memo cites a clause in the corporate bylaws that requires a supermajority board vote to revoke, while Ben's memo relies solely on the standing discretion of the current CEO, which can be withdrawn by a unilateral signature at any time without cause. No amount of additional budget or equipment given to Ben can alter the revocability of his authority, and the CEO has committed no wrong, acting within established governance norms; the inequality persists solely due to the structural fragility of Ben's institutional standing, which leaves him vulnerable to arbitrary power despite his current contentment and material parity.

  **The Check**

  **Metrics and Verdicts:**
  *   **Resourcist:** Compares the *means* available to each agent (budget, space, staff, and the current written authorization). Since the material assets and the face-value of the authorization memos are identical, the resourcist finds them **equally well off**. The fragility of the authorization is a future risk, not a current resource deficit.
  *   **Welfarist:** Compares the *mental states* or preference satisfaction of each agent. Since both report identical satisfaction and neither feels frustration or anxiety about their position, the welfarist finds them **equally well off**.
  *   **Capability Theorist:** Compares the *substantive freedoms* (effective power to achieve functionings) available to each agent. Ali has the *secure capability* to direct research; Ben has only the *functioning* of directing research, contingent on another's will. Because Ben is subject to arbitrary interference (domination), his freedom is not robust. The capability theorist finds Ben **clearly worse off**.

  **The Single Feature:**
  The feature doing the work is **modal fragility** (the ease with which the option set can be shrunk by external will). It is not the *content* of the options now, but the *security* of those options against arbitrary revocation.

  **If Removed:**
  If Ben's autonomy were also codified in the bylaws (removing the fragility), the capability verdict shifts to **equal**, as both would possess the robust freedom to direct their work.

  **Strongest Reply (Resourcist/Welfarist):**
  Justice is concerned with the distribution of *actual* goods and the relief of *actual* suffering, not the insurance against non-actualized possibilities. By counting "security against benevolent whim" as a distributive good, the capability approach conflates *justice* with *power relations* or *political status*. If Ben is not suffering, and his resources are equal, demanding structural alteration to fix a hypothetical risk expands the scope of distributive justice into the realm of constitutional design, diluting its focus on remedying tangible deprivation.

  **Honest Assessment:**
  This case **generates** the verdicts from the metrics rather than merely stipulating them, but it relies on a specific philosophical fault line. It works because "resources" are typically defined as *means currently held*, while "capabilities" are defined as *freedoms robustly held*. The critique has force here because it isolates **domination** (arbitrary dependency) from **deprivation** (lack of goods or welfare). It shows that one can be materially equal and psychologically content yet still lack the *status of a free agent*. However, a sophisticated resourcist (like Dworkin) might argue that "security" is itself a resource that should be insured against; if the market cannot insure against CEO whim, it becomes a brute luck inequality. The case holds force only if we accept that some structural vulnerabilities are injustices *even when* they cannot be priced or transferred, challenging the resourcist assumption that all inequalities can be flattened into a common currency of means. It demonstrates that the capability critique survives the removal of disability and preference issues by targeting the *relational* aspect of freedom that resources and welfare both miss.
