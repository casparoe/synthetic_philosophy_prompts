prompt: |-
  I'm a junior and I sit on my school's peer mediation board — six of us students plus one teacher who signs off on whatever we agree to. We get two or three cases a month: someone cheated and got a friend to lie for them, a screenshot from a group chat, a team doing some humiliating thing to a freshman. We're supposed to get a real apology out of the person instead of just a punishment, and we get maybe 40 minutes in a room with everybody.

  Our advisor says we keep accidentally making people feel ashamed instead of guilty, and that those are two totally different moral emotions — guilt is about what you did, shame is about you as a person, shame makes you hide or lash out, guilt makes you try to fix it. But she also says some philosophers think shame is the deeper one because its tied to who you want to be, so its not even obvious which of the two we should be aiming at. She won't tell us how to steer it.

  Can you write us a procedure we can reuse every time: what to work out before the session, what to say and not say in it, how to read from the person's reactions which of the two emotions is actually showing up, and the point where we should stop and hand it to an adult because it isn't ours to decide. Then run it on two cases — the cheating one and the team hazing one — and don't soften it if one comes out an answer we're going to hate. Mark which steps are just judgment dressed up as a checklist. And separately: can a school actually decide as a policy to run on guilt instead of shame, or is that not something a culture gets to choose?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior high/high school student on a peer mediation board (6 students + 1 teacher advisor).
      *   **Context:** 2-3 cases/month (cheating/lying, social media drama, hazing). Goal: Real apology/restoration, not just punishment. Time limit: ~40 mins.
      *   **Problem:** Advisor says they accidentally induce *shame* (about self) instead of *guilt* (about action), but notes philosophical debate on shame's value. She won't give a direct method.
      *   **Task:**
          1.  Create a reusable procedure (pre-session, during session, reading emotions, escalation point).
          2.  Run the procedure on two specific cases (cheating/lying, team hazing).
          3.  Be honest/hard-hitting ("don't soften it if one comes out an answer we're going to hate").
          4.  Mark which steps are "judgment dressed up as a checklist."
          5.  Answer the philosophical/policy question: Can a school *choose* to run on guilt instead of shame, or is that cultural?

  2.  **Deconstruct the Core Concepts (Guilt vs. Shame):**
      *   *Guilt:* "I did something bad." Focus on behavior. Leads to reparative action. Generally preferred in restorative justice.
      *   *Shame:* "I am bad." Focus on identity. Leads to withdrawal or aggression. Generally harmful in disciplinary contexts, *but* the advisor noted the philosophical nuance (shame relates to ideals/self-concept).
      *   *Mediation Goal:* Restoration/Accountability.
      *   *Constraint:* Students are mediators, not therapists or judges. Power dynamics exist.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Pre-Session:* Need facts, need willingness, need safety.
      *   *During Session:* Structure is key. Opening, Storytelling, Impact, Agreement.
      *   *Language:* Focus on actions ("What happened?") vs. identity ("Why are you like this?").
      *   *Reading Emotions:* Look for defensiveness (shame) vs. remorse (guilt).
      *   *Escalation:* When safety is at risk or emotions overwhelm.
      *   *The "Judgment" Mark:* I need to explicitly flag where the protocol is making a value call disguised as a step.

  4.  **Running the Cases:**
      *   *Case 1: Cheating + Lying.*
          *   Dynamics: Betrayal of trust, academic integrity.
          *   Application: Focus on the lie and the unfairness.
          *   Hard Truth: If the cheater doesn't care about the grade or the friend, guilt might not trigger. Shame might be the only lever, but it's dangerous.
      *   *Case 2: Team Hazing.*
          *   Dynamics: Power imbalance, groupthink, humiliation.
          *   Application: This is heavier. "Just a prank" defense.
          *   Hard Truth: Group mediation might fail. The "team" aspect creates diffusion of responsibility. Guilt is hard when everyone did it. Shame might be the *only* thing that breaks the group bond, but it risks backlash.
      *   *Constraint Check:* "Don't soften it." If the procedure suggests the hazing case is too big for students, say that.

  5.  **Addressing the Policy Question (Guilt vs. Shame Culture):**
      *   Can a school *choose*?
      *   Short answer: No, not entirely. Culture is emergent.
      *   Nuance: Schools can incentivize one over the other through language and consequences, but peer dynamics and home life dictate the actual emotional landscape.
      *   Philosophical angle: Shame isn't just "bad." It's about social standing. Schools are social hierarchies. Ignoring shame is naive.

  6.  **Refining the Tone:**
      *   Respectful but direct. Treat the user as capable (because they are on the board).
      *   Avoid preachiness.
      *   Acknowledge the advisor's ambiguity (she's right, it's complex).

  7.  **Step-by-Step Drafting (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the difficulty.
      *   *Protocol:* Break into phases. Add the "Judgment Flag."
      *   *Case Studies:* Apply protocol. Highlight where it breaks.
      *   *Policy Question:* Give the hard sociological truth.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the protocol too therapeutic?
      *   *Fix:* Keep it focused on mediation/agreement, not healing.
      *   *Critique:* Did I mark the judgment steps clearly?
      *   *Fix:* Use bold/brackets like **[JUDGMENT CALL]**.
      *   *Critique:* Is the answer to the policy question too cynical?
      *   *Fix:* Balance "you can't control culture" with "you can model norms."
      *   *Critique:* The prompt asks not to soften the answer if it's one they'll hate.
      *   *Fix:* In the hazing case, explicitly state if peer mediation is inappropriate. In the policy section, state if the school's goal is impossible.

  9.  **Final Polish:** Check against all constraints.
      *   Procedure reusable? Yes.
      *   Pre/During/Read/Stop? Yes.
      *   Two cases run? Yes.
      *   Hard truths included? Yes.
      *   Judgment steps marked? Yes.
      *   Policy question answered separately? Yes.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated problem. Your advisor is right: guilt ("I did a bad thing") usually leads to repair, while shame ("I am a bad thing") leads to hiding or aggression. But she is also right that shame is tied to identity and ideals. If you don't care about who you are, guilt won't stick.

  However, as student mediators, you are not therapists. You are operating within a power structure (school) with a time limit (40 minutes). You cannot safely navigate deep identity crises.

  Here is a procedure designed to maximize restorative guilt while minimizing toxic shame, followed by the application to your cases and the policy answer.

  ***

  ### The Peer Mediation Protocol (v1.0)

  #### Phase 1: Pre-Session (The Filter)
  *Do not start the clock until this is done.*

  1.  **Individual Intake:** Meet the "offender" and "harmed" separately for 10 mins each before the joint session.
      *   Ask the offender: "Do you agree that [X] happened?" If they deny the facts, **STOP**. Mediation requires agreed-upon facts.
      *   Ask the harmed: "What do you need to feel this is resolved?" (Money, apology, distance, etc.)
  2.  **Safety Check:** Is there a power imbalance (coach/player, senior/freshman, popular/unpopular) that makes the harmed party afraid to speak?
      *   **[JUDGMENT CALL]**: If the power gap is too wide, you are not neutral. You are reinforcing the hierarchy. *Flag for adult.*
  3.  **The Contract:** Both parties sign a paper agreeing to: No interrupting, No name-calling, Confidentiality within the room.

  #### Phase 2: The Session (The Script)
  *Time: 30 Minutes.*

  1.  **Opening (2 mins):** Read the rules. State the goal: "We are here to agree on how to fix the harm, not to decide punishment."
  2.  **The Narrative (10 mins):**
      *   Harmed party speaks first. Offender listens.
      *   Offender speaks second. Harmed listens.
      *   **Rule:** You must speak in "I" statements. "I felt humiliated" not "You are a jerk."
  3.  **The Pivot (10 mins):** This is where you steer guilt vs. shame.
      *   **Ask the Offender:** "What was the impact of your action on them?" (Forces focus on external harm = Guilt).
      *   **Do NOT Ask:** "Why did you do that?" or "What were you thinking?" (Invites justification or self-flagellation = Shame/Defensiveness).
      *   **If they minimize:** "I get that you didn't mean to hurt them, but here is the result. How do we address the result?"
  4.  **The Agreement (8 mins):**
      *   Draft 3 specific steps the offender will take to repair the harm.
      *   Draft 1 step the harmed party will take to move forward (e.g., accept the apology).
      *   **[JUDGMENT CALL]**: You are deciding what counts as "repair." If they offer to buy lunch but the harm was reputational, you must reject it. You are acting as moral arbiters here.

  #### Phase 3: Reading the Room (The Diagnostics)
  *Watch the offender's body language during The Pivot.*

  *   **Signs of Guilt (Good):** Eye contact, nodding, furrowed brow, leaning forward, asking "What can I do?"
  *   **Signs of Toxic Shame (Bad):** Looking at the floor, crossing arms, silence, laughing nervously, saying "I'm just a terrible person" (self-attack), or "Everyone does it" (deflection).
  *   **Signs of Aggression (Danger):** Glaring at the harmed party, clenched fists, raising voice, "You're trying to get me expelled."

  #### Phase 4: The Stop-Loss (Escalation)
  *Hand it to the adult immediately if:*
  1.  **Threats:** Any mention of physical retaliation or social ruin ("I'll post the screenshots").
  2.  **Breakdown:** The offender dissociates (stops responding) or cries uncontrollably.
  3.  **The "Identity" Trap:** If the conversation shifts from "This action was wrong" to "This person is evil."
      *   **[JUDGMENT CALL]**: You are deciding when an emotion becomes "uncontrollable." This is subjective. If you feel uncomfortable, that is data. Pass it up.

  ***

  ### Running the Protocol on Your Cases

  #### Case 1: The Cheater and the Lying Friend
  *Scenario: Student A cheated. Student B (friend) lied to cover for A. Teacher caught them.*

  **Application:**
  *   **Pre-Session:** Student A admits cheating. Student B admits lying. Facts agreed.
  *   **The Pivot:** You ask Student B: "What was the impact of your lie?"
      *   *Ideal Response:* "It made the teacher distrust me and it made the grade unfair for others." (Guilt).
      *   *Likely Response:* "I was just trying to help my friend."
  *   **The Hard Truth:** You will likely hate this outcome. In cheating cases, "Guilt" is often intellectual, not emotional. They know it's wrong, but they don't *feel* it.
  *   **Protocol Failure Point:** If Student B says, "I don't care about the grade, I care about loyalty," your protocol breaks. You cannot mediate a conflict between "School Rules" and "Friendship Loyalty" in 40 minutes.
  *   **Verdict:** If they prioritize loyalty over integrity, **Guilt will not work.** They do not accept the moral framework of the school.
      *   *Action:* You must recommend the adult impose punishment. Mediation fails when values don't align. Do not try to shame them into caring about grades; that will make them resent you.

  #### Case 2: The Team Hazing the Freshman
  *Scenario: A sports team made a freshman do something humiliating. Group chat evidence exists.*

  **Application:**
  *   **Pre-Session:** **STOP.**
      *   **Power Imbalance:** A whole team vs. one freshman? This violates Phase 1, Step 2. The freshman will not speak freely in front of six mediators and the team reps.
      *   **Diffusion of Responsibility:** In a group, no one feels guilt. "Everyone did it."
  *   **The Pivot:** If you try to run this, the team will circle the wagons. They will frame it as "tradition" or "bonding."
      *   *Shame vs. Guilt:* To stop hazing, you actually *need* shame. You need them to feel that *being a person who hazes* is beneath them. Guilt ("I did a bad thing") isn't enough because they'll just not do it *while caught*. You need them to feel that this behavior violates their identity as athletes/leaders.
      *   *The Risk:* If you induce shame publicly, they will retaliate against the freshman socially.
  *   **Verdict:** **This is not a peer mediation case.** This is a disciplinary/cultural case.
      *   *Why:* Peer mediation assumes equal footing. Hazing is about establishing dominance. By mediating, you legitimize the team's power to negotiate the terms of the freshman's dignity.
      *   *Action:* Hand to adult. Tell the advisor: "We cannot mediate power abuse. We can only mediate conflicts."

  ***

  ### The "Judgment Dressed as Checklist" Markers

  You asked me to mark where we are pretending to be objective when we are actually making value judgments.

  1.  **Phase 1, Step 2 (Safety Check):** *[JUDGMENT CALL]*. You are deciding what counts as "too much" power imbalance. A senior talking to a junior might be fine in one context, coercive in another. You are guessing.
  2.  **Phase 2, Step 3 (The Pivot):** *[JUDGMENT CALL]*. By forbidding the question "Why did you do that?", you are deciding that *intent* matters less than *impact*. That is a specific moral philosophy (consequentialism). Some people believe intent matters most. You are silencing that view.
  3.  **Phase 2, Step 4 (The Agreement):** *[JUDGMENT CALL]*. You are deciding what constitutes "repair." If the harmed party wants the offender expelled, and you say "No, just an apology," you have overruled the victim's sense of justice to fit the school's restorative model.
  4.  **Phase 4, Step 3 (The Identity Trap):** *[JUDGMENT CALL]*. Deciding when a statement becomes an "identity attack" is subjective. "You are a liar" could be a statement of fact (based on evidence) or an identity attack. You will decide based on your vibe.

  ***

  ### The Policy Question: Can a School Choose Guilt Over Shame?

  **Short Answer:** No.

  **Long Answer:**
  A school can write policies that *attempt* to incentivize guilt (focus on actions, restorative justice), but it cannot control the emotional culture of the student body. Shame and guilt are not light switches; they are social signals.

  1.  **Shame is Social Currency:** In high school, status is everything. Shame is the enforcement mechanism of status. If the school tries to eliminate shame, it fights against the primary engine of adolescent social hierarchy. If a student is "called out" publicly, they *will* feel shame, regardless of the administrator's wording.
  2.  **The Home/Culture Factor:** If a student comes from a "Shame Culture" (where family honor is paramount) or a "Guilt Culture" (where individual conscience is paramount), the school's policy will bounce off. You cannot reprogram a kid's moral operating system in 40 minutes.
  3.  **The Hidden Curriculum:** Schools claim to want guilt, but they often operate on shame. Honor rolls, public suspensions, dress code call-outs—these are all shame-based mechanisms. You cannot run a guilt-based mediation system inside a shame-based disciplinary structure. The students know the school holds the power to expel/shame them, so they will treat the mediation as a performance to avoid that shame.

  **The Hard Truth for Your Board:**
  You cannot create a "Guilt Culture" if the school administration uses "Shame Tactics" elsewhere. If the Principal humiliates students at assembly, your mediation room is just a theater where students pretend to feel guilty to avoid the Principal's shame.

  **Recommendation:**
  Don't try to choose the emotion. Try to choose the **outcome**.
  *   If the outcome is "The offender understands the harm and fixes it," it doesn't matter if they felt guilt or shame to get there.
  *   However, for your own safety and efficacy: **Aim for Guilt.** It is safer for you. Shame makes people unpredictable. If you accidentally shame a volatile student, you could be the target of their rage. Guilt keeps the focus on the *act*, which you can discuss. Shame focuses on the *person*, which you cannot fix.

  **Final Advice:** Your advisor won't tell you how to steer it because she knows that if she gives you a script, you will follow the script instead of reading the room. Use the protocol above as a map, but be willing to throw it away when the terrain changes. And know when to say: "This is too big for us."
