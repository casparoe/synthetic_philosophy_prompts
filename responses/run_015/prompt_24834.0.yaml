answer: |-
  **The Scenario**

  Alex promises to cater Blake's small professional workshop next Friday, a commitment Blake accepts. Relying on this, Blake declines a quote from a backup caterer for $300. On Wednesday, Alex's commercial refrigerator fails; repairing it or renting a replacement in time will cost Alex $500, though it remains physically possible to fulfill the promise. Blake's reliance loss is quantifiable at $300 (the price of the forgone alternative), but Blake strictly prefers Alex's catering due to specific dietary expertise the backup lacks. Alex can either spend $500 to perform or pay Blake $300 to cover the reliance loss, allowing Blake to hire the backup, though Blake would prefer performance.

  ***

  **Analysis of the Four Accounts**

  **1. The Reliance-Based Account (e.g., Fuller & Perdue, Atiyah)**
  This account holds that the moral force of a promise derives from the harm caused by disappointing induced expectations. The obligation is to prevent the promisee from being worse off than they would have been had the promise never been made.
  *   **Verdict:** **Compensate Only.**
  *   **Reasoning:** Alex is obligated to restore Blake to the *status quo ante*. Since Blake's loss is strictly $300 (the cost of the forgone alternative), Alex owes $300. Requiring Alex to spend $500 to save Blake a $300 loss creates a net social waste and exceeds the moral justification for the obligation, which is harm prevention, not expectation satisfaction.

  **2. The Contract-Based Account (e.g., Right-Transfer View, Common Law Expectation)**
  This view treats a promise as a transfer of a right from promisor to promisee. Once the promise is accepted, the performance belongs to the promisee.
  *   **Verdict:** **Perform.**
  *   **Reasoning:** Alex has already alienated the right to decide how to use that labor/resources regarding the catering. The $500 cost is Alex's problem, not Blake's. To offer compensation is to offer to buy back a right that no longer belongs to Alex. The duty is specific performance because the promisee owns the act.

  **3. The Will- or Autonomy-Based Account (e.g., Fried, *Contract as Promise*)**
  This account grounds obligation in the binding nature of the autonomous will. To promise is to invoke a convention that binds one's future self.
  *   **Verdict:** **Perform.**
  *   **Reasoning:** Alex's autonomous act of promising created a moral bond that transcends subsequent changes in cost. To retreat to compensation is to treat the promise as a mere prediction or a price list, violating the integrity of the will. Unless performance is impossible (which it is not), the autonomous commitment stands absolute.

  **4. The Reason-Based Account (e.g., Raz, Scanlon)**
  *Note on Theoretical Premise:* You requested this account align with Reliance (Compensate). However, standard literature (specifically Raz's *Practical Reason and Norms*) argues promises create *exclusionary reasons* to perform, which typically aligns this view with Will/Contract (Perform). Raz argues the promise excludes direct calculation of costs like the $500 vs. $300 gap. However, a specific *interest-based* reading of "Reasons" (where the reason is solely to protect the promisee's welfare) could yield compensation.
  *   **Verdict (Standard Razian):** **Perform.** (Verdict under your expected mapping: **Compensate**).
  *   **Reasoning (for your expected split):** If the "new reason" is generated solely by the value of the promisee's interest, and that interest is fully satisfied by $300, the reason to spend $500 is defeated. The reason to $\phi$ is contingent on the value of $\phi$ to the promisee.
  *   **Reasoning (Standard Literature):** The promise creates a peremptory reason to perform that excludes the calculation of the $500 cost. The obligation is to $\phi$, not to make $\phi$'s value whole.

  **The Structural Feature and Theoretical Split**

  The structural feature driving the split is the **gap between the Cost of Performance ($500) and the Quantifiable Reliance Loss ($300).**

  *   **Reliance (and the interest-based reading of Reasons):** The obligation is capped by the promisee's loss. Once the loss is covered, the moral debt is extinguished. The extra $200 is a "deadweight loss" with no moral claimant.
  *   **Will/Contract (and Standard Reasons):** The obligation is defined by the *act promised*, not the *value of the loss*. The cost to the promisor is irrelevant unless it reaches the threshold of impossibility or extreme hardship (which $500 may not meet). The right resides with the promisee, so the promisor's cost is internal to the promisor.

  **Collapsing the Case**

  If you remove this feature by making the **Cost of Performance equal to or less than the Reliance Loss** (e.g., Repair costs $200), all four accounts converge on **Performance**. It becomes inefficient and morally dubious for Alex to pay $300 when performance costs only $200; even the Reliance theorist would acknowledge that performance is the most direct way to negate the reliance loss in this instance. Conversely, if you remove the feature by making **Performance Impossible**, all four accounts generally collapse into **Compensation** (or release), as "ought implies can" limits the Will and Contract views, and the Reliance view naturally defaults to damages.

  **The Defender's Attack**

  The most plausible defender of the **Will/Contract account** (the "Perform" side) would attack the Reliance/Reason (Compensate) verdict by arguing it **commodifies the promise.** They would contend that treating the promise as a liability to pay $300 transforms a moral commitment into a priced option. By allowing Alex to "buy out" of the promise for $300, the Reliance account fails to respect Blake's status as a rights-holder who was *assured* of the act, not merely assured of financial safety. The defender would argue that the $200 difference is the price of Alex's integrity, not an inefficiency to be eliminated.

  ***

  **Expert Note on Theoretical Mapping**

  I must flag a significant tension in your specifications regarding the **Reason-Based Account**. You anticipated this account would align with Reliance (Compensate). However, in the dominant philosophical literature (specifically Joseph Raz and T.M. Scanlon), the Reason-Based account is structurally closer to the Will-Based account. Raz argues that promises create *exclusionary reasons*—reasons not to act on certain other reasons (like cost-benefit analysis). Under a strict Razian view, Alex is *forbidden* from calculating the $500 vs. $300 gap; the promise excludes that calculation, mandating performance.

  To make the Reason-Based account yield "Compensate," one must adopt a specific **Interest-Based** interpretation (where the reason to promise is *only* to protect the promisee's welfare interests). This is often conflated with Reliance theory rather than standing as a distinct "Reason" view in the Razian sense. If you present this material to students familiar with Raz or Scanlon, they will likely object that the Reason-Based view mandates performance. I recommend framing the "Compensate" outcome as specific to an *Interest-Based* Reasons view, while acknowledging the *Exclusionary Reasons* view aligns with Will/Contract.
