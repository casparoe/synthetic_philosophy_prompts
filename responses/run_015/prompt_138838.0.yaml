  ### Limitations of the Procedure

  You asked for plain talk on what this procedure cannot do.

  1.  **It Cannot Measure Intent:** The DCP evaluates the *structure* of the cost, not the *psychology* of the proposer. A "bad" actor can mimic a "good" signal if they are willing to absorb the cost as a calculated loss (e.g., a corrupt company funding a transparency lab to launder its reputation). The procedure identifies this as "Credible" because the signal is costly, but it cannot detect *strategic mimicry* where the long-term gain outweighs the short-term signal cost.
  2.  **It Cannot Resolve Value Conflicts:** When the procedure returns **UNDECIDED** (as in Case 2), it explicitly hands the problem to you. It will not tell you if a "pooling" signal is *safe enough*. It merely tells you it is not *informative*. Disagreements about whether wealth implies virtue are re-described as "Value Hand-offs," not settled.
  3.  **It Assumes Static Costs:** The procedure evaluates cost at the moment of signing. It cannot predict political or economic shifts that might make a signal cheap later (e.g., a change in government makes the transparency report legally mandatory, rendering the signal void).
  4.  **It Cannot Fix Principal-Agent Problems:** In "Wrong-Pocket" cases, the procedure returns **NOT CREDIBLE**. It cannot solve the problem; it can only flag it. It will not tell you how to restructure the deal to fix the agency issue, only that the current structure fails the test.

