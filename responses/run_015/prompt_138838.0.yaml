answer: |-
  ### The Differential Cost Protocol (DCP)

  **Purpose:** To evaluate external commitments as honest signals of proposer type (good faith/alignment) rather than as contractual enforcement mechanisms.
  **Theoretical Correction:** You noted a worry about "reversible or uptake-contingent" costs. In strict signaling theory (Spence/Zahavi), a signal must be sunk *prior* to the response to prove type. If a cost is incurred only *after* the university agrees (uptake-contingent), it is not a signal; it is a contract term. However, the *willingness to accept* such terms can be a signal if the *risk* of future penalty is differential. This procedure treats the *risk exposure* as the cost, not the cash flow.

  **Procedure Steps:**

  1.  **The Pre-Commitment Gate (Reversibility)**
      *   **Question:** Does the proposer incur a cost, risk, or constraint *immediately* upon making the offer, or only after the university signs?
      *   **Sufficient Answer:** The proposer must accept a binding constraint or sunk cost *before* the university's final signature (e.g., a deposit, a public pre-pledge, a legal exposure that exists upon application).
      *   **Stop/No:** If the commitment is entirely contingent on the deal closing and can be lapsed without penalty *before* closing, return **NOT CREDIBLE**. (This is cheap talk).
      *   **Hand-off:** If the cost is contingent on the deal but binding *after* signing, proceed to Step 2. (Note: We are now evaluating the *risk* of future penalty as the signal cost).

  2.  **The Agency Gate (Wrong-Pocket)**
      *   **Question:** Does the entity signing the agreement internalize the cost of the signal, or is the cost borne by a distinct legal or temporal entity?
      *   **Sufficient Answer:** The signer is the primary beneficiary of the deal *and* the primary bearer of the signal's cost. There is continuity of agency (e.g., the signing officer has authority to bind the budget; the subsidiary controls the parent's resources).
      *   **Stop/No:** If the signer bears no cost (e.g., a consortium director signing for members who are not bound), return **NOT CREDIBLE**.
      *   **Hand-off:** If the cost is borne by a related entity (e.g., subsidiary vs. parent), proceed to Step 3 but flag for Legal review on enforceability.

  3.  **The Differential Cost Gate (Handicap)**
      *   **Question:** Is this commitment disproportionately costly for a "bad" type (misaligned actor) compared to a "good" type (aligned actor)?
      *   **Sufficient Answer:** Yes. A "bad" actor would lose more (reputationally, financially, or operationally) by adhering to this commitment than a "good" actor would.
      *   **Stop/No:** If the cost is roughly equal for both types (e.g., a cash gift that any wealthy actor can make regardless of ideology), the signal is *pooling*, not *separating*. Proceed to Step 5 (Value Judgment).
      *   **Note:** If the cost is zero for a bad actor (e.g., a pledge they intend to ignore), return **NOT CREDIBLE**.

  4.  **The Baseline Gate (Entry Fee)**
      *   **Question:** Is this commitment rare or standard within the proposer's sector?
      *   **Sufficient Answer:** The commitment exceeds the sectoral norm (e.g., transparency reporting is not yet standard in their specific sub-industry).
      *   **Stop/No:** If this is a standard compliance requirement or a common "entry fee" that all competitors pay, it carries no information about *this* proposer's specific type. Return **UNDECIDED BY THE PROCEDURE** (Signal is neutral; decision rests on other grounds).
      *   **Pass:** If it exceeds the baseline, proceed to Step 5.

  5.  **The Value Hand-off**
      *   **Question:** Given the signal strength (Credible, Pooling, or Neutral), does the university accept the residual risk?
      *   **Action:** The procedure stops here. If Step 3 yielded "Pooling" or Step 4 yielded "Neutral," the committee must decide based on values (e.g., "Do we trust wealth as a proxy for virtue?" or "Do we need the funding despite the lack of signal?").
      *   **Output:** **UNDECIDED BY THE PROCEDURE** (Requires human judgment).

  ---

  ### Application to Docket Cases

  #### Case 1: Software Company Research Lab
  *Proposal:* Joint lab. Commitment: Annual transparency report on government data requests, named accountable officer, publication written into agreement as condition of university participation.

  *   **Step 1 (Pre-Commitment):** The commitment is written into the agreement. The cost (reputational risk of disclosure) is uptake-contingent but binding post-signature. The *risk* exists immediately upon signing. **Pass.**
  *   **Step 2 (Agency):** The software company signs and bears the reputational cost directly. **Pass.**
  *   **Step 3 (Differential Cost):** A company with a history of covert data sharing finds this prohibitively costly (exposes business model/legal risk). A privacy-respecting company finds this less costly (already compliant). This is a separating equilibrium. **Pass.**
  *   **Step 4 (Baseline):** Transparency reports are becoming common in big tech, but binding them contractually to a university partnership with a named officer exceeds the sector baseline. **Pass.**
  *   **Step 5 (Value):** Signal is strong.
  *   **Verdict:** **CREDIBLE**

  #### Case 2: Trustee Gift for Archive
  *Proposal:* Large gift for archive/building/lecture series. Condition: Building named for family. Signal: Demonstration of shared commitment to free expression.

  *   **Step 1 (Pre-Commitment):** Gift is sunk upon transfer. **Pass.**
