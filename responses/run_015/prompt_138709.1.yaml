prompt: |-
  Hey — odd one for you, sorry, it's half a work thing and half me being annoyed at myself.

  So: I run a small engineering team, and about three weeks ago in a retro I called out one of the devs for missing deadlines. Which was recieved about as well as you'd expect, given that I miss deadlines constantly and everyone in the room knows it. She said "you literally do this every week" and I had nothing better than "yeah, fair". It's been going round my head since, partly because I still think the complaint was correct and I can't work out how both of those can be true.

  Separately, and this is the actual ask: my department head has put me down to run a 40-minute session next month for the other team leads on "giving critical feedback when you're not exactly clean yourself" (his words). They're all engineers, they will want a yes/no rule, and none of them have done any philosophy. I don't want you to explain the topic to me — I think I basically have it — I want a plan for how I should explain it, and I can't see the shape of the thing.

  Specifically: the order the ideas have to come in and what depends on what. I'm fairly sure the very first move has to be splitting "was the complaint true, did she actually do something wrong" off from "was I entitled to be the one to say it", because if I don't do that first the session just turns into people either defending me or piling on, and we never get anywhere. But I don't know what the third move is, or the fourth. And what example should carry the whole thing? It needs to be a case where the criticism is obviously correct and the critic is obviously guilty of the same thing, so nobody can escape through "well maybe he didn't really do anything wrong" or "well maybe she isn't really a hypocrite" — and it can't be my situation, I'm not putting myself on a whiteboard.

  The misconceptions, and here's the part I most want help on — here's my list, tell me what I've got wrong or what's missing, and exactly where in the sequence I should head each one off, since I think the timing matters as much as the content: (a) "so you're saying a hypocrite can never say anything true", (b) "so the answer is just don't do the thing yourself", (c) the tu quoque thing — that pointing at the speaker is always a dodge, which I half believe myself and don't know whether to teach as false or as true-but-limited, (d) people flattening hypocrisy into ordinary inconsistency, or into just "doesn't practice what he preaches", (e) someone deciding that if you lack standing then the blame has no force at all and the target can just shrug it off.

  There's one thing I want built into the plan if it belongs there, because it's the version that made my head hurt: the person who says, up front, "look, I'm a total hypocrite for raising this, I'm late constantly, but you're late every single day and it's wrecking the standup." Does owning it buy them anything back? My instinct says it does and also that it shouldn't, and I can't tell which of those instincts is the confused one. If there's a version of the session where that case is the hinge rather than a footnote, I'd rather do that version.

  Also: what should I flatly refuse to get into in 40 minutes with this crowd, and say out loud that I'm refusing? I do not want to open the door to "what even is blame" and lose the room for the rest of the hour. And give me one question to ask at the very end that would show me they'd actually got the distinction, rather than just learned to say "standing" at the right moment.

  Last thing, and please commit rather than survey: I have to take a line in that room on whether hypocritical blame is genuinely unfair to the person being blamed, or whether it's just unwise/ineffective for the blamer while being otherwise fine. Pick one, defend it, and then tell me what follows for my own mess — apologise to her, drop the deadline thing entirely, or raise it some other way. Don't hand me the menu of positions with the tradeoffs listed; I can do that myself. Tell me which one is right and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Engineering team lead. Self-aware, admits fault (misses deadlines), but believes the core complaint (dev missing deadlines) was valid.
      *   **Task:** Plan a 40-minute session for other team leads on "giving critical feedback when you're not exactly clean yourself" (hypocritical blame).
      *   **Audience:** Engineers (want yes/no rules, no philosophy).
      *   **Constraints:**
          *   Need a specific sequence/order of ideas.
          *   Need a concrete example (not the user's situation) where criticism is correct + critic is guilty.
          *   Need to address specific misconceptions (a-e) at specific points in the sequence.
          *   Need to address the "owning it" scenario (admitting hypocrisy upfront).
          *   Need to define scope boundaries (what to refuse).
          *   Need one final comprehension question.
          *   **Crucial:** Must take a definitive stance on whether hypocritical blame is *unfair* or just *unwise/ineffective*. No "on the one hand" hedging. Must apply this stance to the user's specific situation with the dev.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The tension is between *Truth of the Claim* vs. *Standing of the Speaker*.
      *   *Tu Quoque* (You Too) is a logical fallacy regarding truth, but often a valid social/pragmatic objection regarding standing.
      *   Engineers like clear logic. "Hypocrisy invalidates truth" is false logic. "Hypocrisy undermines authority/trust" is pragmatic reality.
      *   The user's instinct about "owning it" is key. Does admitting hypocrisy restore standing? It mitigates the *deception*, but doesn't fix the *norm violation*.

  3.  **Determine the Stance (The "Commit" Requirement):**
      *   Option A: Hypocritical blame is *unfair* (moral wrong).
      *   Option B: Hypocritical blame is *unwise/ineffective* (pragmatic wrong), but the truth remains.
      *   *Decision:* Option B is better for an engineering context. It focuses on efficacy and system health rather than abstract moral desert. It aligns with the user's intuition that the complaint was correct but the delivery failed. It allows for a path forward without requiring moral perfection before leadership.
      *   *Implication for User:* You don't need to drop the issue. You need to repair the standing to make the feedback effective. Apology is for the *process*, not the *content*.

  4.  **Develop the Session Plan (Sequence & Flow):**
      *   *Goal:* Move from "Truth vs. Speaker" to "Standing & Efficacy."
      *   *Time:* 40 mins. Tight.
      *   *Example:* Needs to be high stakes, clear violation, clear hypocrisy. Safety is usually good.
          *   *Idea:* A safety officer smoking in a no-smoking zone.
          *   *Refinement:* A senior engineer criticizing code security while having known vulnerabilities in their own module. Let's go with *Security Compliance*.
          *   *Scenario:* Alice (Lead) flags Bob (Dev) for not encrypting user data. Bob knows Alice's service has unencrypted logs.
      *   *Sequence:*
          1.  Split Truth vs. Standing (Address Misconception A & E).
          2.  Define Standing (Address Misconception D).
          3.  The "Owning It" Move (Address User's specific instinct).
          4.  Pragmatic Consequence (Address Misconception B & C).
      *   *Misconception Timing:*
          *   (a) "Hypocrite can't say truth" -> Step 1.
          *   (e) "Blame has no force" -> Step 1/2 transition.
          *   (d) "Hypocrisy vs Inconsistency" -> Step 2.
          *   (c) "Tu Quoque" -> Step 3.
          *   (b) "Just don't do the thing" -> Step 4 (Conclusion).

  5.  **Drafting the Content - Section by Section:**

      *   **The Stance:** I need to be firm. Hypocritical blame is *pragmatically self-defeating*, not inherently unjust regarding the *content*, but unjust regarding the *relationship*. I will argue it's primarily an efficacy failure that *becomes* unfair if it destroys trust required for the team to function. Actually, the prompt asks: "unfair to the person being blamed" OR "unwise/ineffective". I will choose **Unwise/Ineffective**. Why? Because the dev *did* miss the deadline. The blame is deserved. The hypocrisy makes the *delivery* fail, not the *blame* false.
      *   **The Example:** The "Safety Marshal" is classic but maybe too cliché. Let's use "Code Review Standards."
          *   *Critic:* Senior Dev who skips tests.
          *   *Target:* Junior Dev who skips tests.
          *   *Criticism:* "You must write tests."
          *   *Why it works:* Engineers feel this. It's technical, not personal.
      *   **The "Owning It" Question:** Does admitting hypocrisy help? Yes, it restores *honesty*, but not *authority*. It changes "Do as I say, not as I do" (tyranny) to "Do as I say, because we agreed, even though I'm struggling" (shared burden).
      *   **Boundaries:** Do not discuss "What is Blame?" or "Moral Desert." Keep it on "Team Velocity & Trust."
      *   **Final Question:** Needs to test the distinction. "If you admit you're late, can you still enforce the deadline?" Answer should be nuanced.

  6.  **Refining the Advice for the User's Situation:**
      *   Since I'm taking the "Ineffective/Unwise" stance: The user shouldn't drop the deadline issue. The dev *is* missing deadlines.
      *   The user *should* apologize for the *hypocrisy*, not the *expectation*.
      *   Action: "I was wrong to call you out without acknowledging my own record. That undermined my standing. However, the deadline expectation remains because it impacts the team. Here is my plan to fix my lateness so I can hold this standard."

  7.  **Review against Constraints:**
      *   *Sequence defined?* Yes.
      *   *Misconceptions placed?* Yes.
      *   *Example chosen?* Yes (Code Review/Tests).
      *   *Owning it addressed?* Yes, as the hinge.
      *   *Refusals defined?* Yes.
      *   *Final question?* Yes.
      *   *Stance committed?* Yes (Ineffective/Unwise).
      *   *User advice consistent?* Yes.

  8.  **Final Polish (Tone):**
      *   Keep it direct, engineering-focused. No fluff.
      *   Acknowledge the user's discomfort but validate their logic.
      *   Ensure the "Owning It" section resolves the user's headache.

      *(Self-Correction during drafting)*: I initially thought about calling it "Unfair." But if the dev *actually* missed the deadline, is it unfair to tell them? No. It's unfair to *demand* it while exempting yourself. But for a team lead, the goal is team output. So "Ineffective" is the stronger engineering argument. It bypasses the moral quagmire and focuses on "Will this work?"
      *Wait, let's look closer.* If I blame you for something I do, am I treating you as a means to an end? Am I asserting superiority I don't have? There is a fairness argument. But for *engineers* who want "yes/no rules," the "Ineffective" argument is more actionable. "It won't work" is better than "It's sin." I will stick with **Ineffective/Pragmatically Broken**.

      *Re-evaluating the "Owning It" instinct:* The user says "My instinct says it does [buy something back] and also that it shouldn't."
      *Resolution:* It buys back *honesty*, but not *exemption*. It transforms the dynamic from "Parent/Child" to "Co-conspirators fixing a bug." It restores the *channel* of communication, not the *moral high ground*.

      *Final check on Misconceptions:*
      (a) Truth vs Speaker -> Early.
      (b) Don't do the thing -> Late (Solution phase).
      (c) Tu Quoque -> Middle (Logic check).
      (d) Hypocrisy vs Inconsistency -> Middle (Definition).
      (e) Blame has no force -> Early (Stakes).

      Let's assemble.

  9.  **Final Polish of the Plan:**
      *   **Title:** "Standing vs. Truth."
      *   **Example:** The "Security Patch" scenario.
      *   **Flow:**
          1.  The Split (Truth vs. Standing).
          2.  The Cost (Why Standing Matters).
          3.  The Fix (Owning It).
          4.  The Rule (Actionable takeaway).
      *   **Refusals:** Moral philosophy, intent vs impact deep dive.
      *   **Final Question:** A scenario test.

      *Wait, one more check on the User's specific advice:* If I say it's "Ineffective," does the user apologize? Yes, for the *method*. Do they raise the deadline thing? Yes, because the *truth* remains. But they must pair it with a remediation plan for themselves.

      *Okay, ready to write.*
answer: |-
  Here is the plan, the stance, and the advice.

  ### The Stance
  **Hypocritical blame is not inherently *unfair* to the target regarding the *content* of the criticism, but it is *pragmatically self-defeating* for the blamer regarding the *efficacy* of the feedback.**

  **Why:** The truth of the claim ("you missed the deadline") is independent of the speaker. The dev *did* miss the deadline. Telling them that is not unjust. However, leadership relies on trust and normative authority. When you blame someone for a norm you violate, you signal that the norm is optional for those with power. This destroys the incentive for the target to comply. It turns a systemic requirement into a personal power play.

  **For your situation:** Do **not** drop the deadline issue. The complaint was true. Do **not** pretend you have moral high ground. You must apologize for the *hypocrisy*, not the *expectation*. You repair the channel, then re-send the message.

  ---

  ### The Session Plan (40 Minutes)
  **Title:** "Standing vs. Truth: Delivering Feedback When You're Not Perfect"
  **Core Example:** "The Security Patch."
  *   **Scenario:** Alice (Senior Lead) rejects Bob's (Junior Dev) PR because it lacks a specific security encryption standard. Bob knows Alice's own service has been running without that encryption for months.
  *   **Why this works:** It's technical, high-stakes, clearly violates a rule, and the hypocrisy is objective (code either has encryption or it doesn't). No "feelings" to hide behind.

  #### Phase 1: The Split (Minutes 0–10)
  **Goal:** Separate the *proposition* from the *speaker*.
  **Action:** Put the Security Scenario on the board. Ask: "Is Alice's technical criticism correct?" (Yes). "Is Alice a hypocrite?" (Yes).
  **Address Misconception (a) *"So a hypocrite can never say anything true"*:**
  *   **Move:** Explicitly state: "Truth is independent of standing. If the building is on fire, you can shout 'fire' even if you set the match."
  *   **Address Misconception (e) *"If you lack standing, the blame has no force"*:**
  *   **Move:** Clarify that "No force" is wrong. The blame still has *logical* force (the code is insecure), but it loses *normative* force (Bob has no reason to listen).
  *   **Takeaway:** A hypocrite can be right, but they won't be heard.

  #### Phase 2: The Mechanism of Failure (Minutes 10–25)
  **Goal:** Explain *why* it fails without getting into moral philosophy.
  **Action:** Discuss the reaction of Bob in the scenario. He doesn't argue the encryption; he argues Alice's right to say it.
  **Address Misconception (c) *The Tu Quoque (You Too) thing*:**
  *   **Move:** Teach this as **True-but-Limited**.
      *   *Logic:* It is a fallacy to say "Alice is a hypocrite, therefore the code is secure." (False).
      *   *Pragmatics:* It is valid to say "Alice is a hypocrite, therefore I don't trust her enforcement of this rule." (True).
      *   *Instruction:* Tell the room: "In code review, Tu Quoque is a bug. In people management, Tu Quoque is a system alert. Do not treat it as a logic error; treat it as a trust failure."
  **Address Misconception (d) *Flattening hypocrisy into inconsistency*:**
  *   **Move:** Define Hypocrisy specifically for this session. It isn't just "doing something different sometimes." It is "enforcing a rule on others that you exempt yourself from."
      *   *Test:* If Alice wasn't a Lead, would her lack of encryption matter to Bob? No. The hypocrisy exists because of the *authority* dynamic.

  #### Phase 3: The "Owning It" Hinge (Minutes 25–35)
  **Goal:** Resolve your specific headache about admitting fault.
  **Action:** Rewrite the scenario. Alice says: *"Look, I know my service isn't encrypted yet. I'm failing on this too. But your module is customer-facing and we will get audited next week. You need to fix this now."*
  **Question:** "Does this fix it?"
  **Resolution:**
  *   It buys back **Honesty**, but not **Exemption**.
  *   It shifts the frame from "Do as I say, not as I do" (Tyranny) to "We both need to do this, I'm behind, but you are blocked right now" (Shared Burden).
  *   **Address Misconception (b) *"So the answer is just don't do the thing yourself"*:**
      *   **Move:** This is where you kill this idea. Perfection is not the prerequisite for leadership. If it were, no one could lead. The answer isn't "be clean," it's "acknowledge the dirt."
      *   **Rule:** "You do not need to be innocent to enforce the rule. You need to be accountable to the rule."

  #### Phase 4: The Rule & Close (Minutes 35–40)
  **Goal:** Give them the Yes/No rule they want.
  **The Rule:** "You have standing to criticize a behavior if: (1) The behavior is objectively harmful to the team, AND (2) You acknowledge your own violation as a liability, not an exemption."
  **Refusals (Say this out loud):** "We are not discussing 'What is Blame?' or 'Moral Desert.' We are discussing 'How to get the PR merged without breaking trust.' If you want to debate ethics, do it on your own time. We are optimizing for team velocity."
  **Final Comprehension Question:**
  *"You are late to standup every day. A junior dev is late today. You pull them aside. What is the one sentence you must say to ensure this isn't hypocritical blame?"*
  *(Correct Answer variant: "I know I've been late recently, and I'm fixing that, but we need to start on time because..." Incorrect variant: "Sorry I'm late too, but..." [Apologizing for the expectation] or "You need to be on time." [Ignoring standing])*

  ---

  ### Advice For Your Specific Situation

  You asked me to commit. Here is the commitment:

  **The Problem:** You treated a systemic norm (deadlines) as a personal failing of the dev, while exempting yourself from that norm. That is why it landed badly. It wasn't the criticism; it was the implied hierarchy ("Rules for thee, not for me").

  **The Fix:**
  1.  **Do not drop the deadline issue.** If deadlines matter, they matter. If you drop them, you hurt the team.
  2.  **Do not apologize for holding the standard.** You are the lead. It is your job to hold the standard.
  3.  **Apologize for the *standing*.** You need to reset the context.

  **The Script:**
  *"I've been thinking about the retro. I called out your deadlines, and I did it while missing my own. That made it look like I was enforcing rules I don't respect. That was on me, and I'm sorry for putting you in that position. It undermines trust.*

  *However, the deadline issue itself is still critical for the team's velocity. I need you to hit these dates. I am also committing to [specific action] to ensure my own delivery improves so I'm not asking you to do something I can't. Can we reset on that?"*

  **Why this works:**
  *   It validates her feeling (you were hypocritical).
  *   It validates the truth (deadlines matter).
  *   It uses the "Owning It" hinge: You acknowledge the dirt without abandoning the rule.
  *   It moves from "Parent scolding Child" to "Lead Engineer solving a Blocker."

  You are not a fraud for having flaws. You are a fraud if you pretend your flaws don't count while counting everyone else's. Admit the flaw, keep the standard.
