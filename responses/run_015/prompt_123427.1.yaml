answer: |-
  Here is a structured plan for your fifty-minute tutorial, designed to manage the interdisciplinary friction and keep the argument tight.

  ### 1. The Carrying Example
  **Select:** The **Conservation/Species** case.
  **Why:** It isolates the *ontological* problem from the *metaphysical* problem. Biology provides contested but empirical criteria for "species" (gene flow, phylogenetic trees), allowing you to demonstrate model revision without invoking consciousness or personal identity.

  **Critique of the Losers:**
  *   **Persons/Emulations:** Your diagnosis is correct. This example imports the "hard problem" of consciousness and personal identity metaphysics. Students will debate whether the emulation *is* the person rather than whether the agent's *model* of personhood has shifted. It distracts from the structural problem of utility-over-ontology.
  *   **Foundation/Endowment:** Your diagnosis is correct. This reduces to legal hermeneutics or semantic drift (how words change meaning). Your problem is about *world-model learning* (how the agent's internal representation of reality changes), not linguistic interpretation. The foundation case makes it look like the agent just needs a better dictionary, rather than a better decision rule for ontological change.

  **Requirements for the Winning Example:**
  *   **Must contain:** A clear value statement (e.g., "Maximize preserved species"), a clear ontological category ("Species"), and a specific biological scenario where the category boundary is empirically ambiguous (e.g., ring species or horizontal gene transfer).
  *   **Must lack:** Any reference to subjective experience, rights, or linguistic ambiguity. The ambiguity must be in the *structure of the world*, not the structure of the language.

  ### 2. Time Allocation and Sequence (50 Minutes)
  Your intuition is correct: **(5) Inaccessible Information must precede (4) Resolution Rule.** If evidence could settle the ontology, the "rule" is just "follow the evidence." The normative choice only exists because the epistemic path is blocked.

  I recommend merging your (1) and (2), and moving (6) to the end as a defense against objections.

  *   **00–10 mins: The Setup (Utility & Ontology).**
      *   Define utility as a function of model-relative features, not raw world states.
      *   Introduce the Conservation Example.
      *   *Head off Misconception:* "Low-level utility." Explain why defining utility over physical states is impossible for an embedded agent (computational intractability + lack of access to "true" physics).
  *   **10–20 mins: The Mechanism (Revision & Drift).**
      *   Show how learning updates the model (splitting a category, merging two, or evicting one).
      *   *Head off Misconception:* "Distributional Shift / More Data." Explain that this is not a failure of generalization; the model is working *correctly* by refining its ontology, which creates the value conflict.
  *   **20–25 mins: The Wall (Inaccessible Information).**
      *   **Concrete Constraint:** Present two specific world-models ($M_1, M_2$) that are predictively equivalent on all future sensor data but disagree on the extension of "Species" for a specific population $P$.
      *   *Head off Misconception:* "Bayesian Convergence." State clearly that posterior probability does not converge to 1 for either model because the likelihoods are identical.
      *   *Head off Misconception:* "Quinean Underdetermination." Distinguish this from global skepticism: the agent *must* act, and the action has different value outcomes depending on the choice.
  *   **25–40 mins: The Choice (Resolution Rules).**
      *   Define **Conservative** (track original referents, even if model changes) vs. **Reinterpretive** (track current model categories).
      *   *Head off Misconception:* "Ask Humans." Explain why this fails (humans disagree on the biology, or are unavailable, or the agent must act faster than consultation allows).
      *   *Head off Misconception:* "Freeze Referents." Discuss why freezing prevents learning (the agent refuses to update its ontology to match reality).
  *   **40–45 mins: Explicit Refusals.**
      *   State what you are *not* covering to frame the scope (see Section 4 below).
  *   **45–50 mins: Closing Question & Debrief.**

  ### 3. Misconception Management
  You have six expected misconceptions. Two are the same error in different vocabularies.

  **The Overlap:**
  *   **CS:** "This is just distributional shift; fix with diverse training data."
  *   **CS/Stat:** "A Bayesian agent with enough evidence converges on the right ontology."
  *   **Unification:** Treat these together as the **"Epistemic Optimism"** error. Both assume the problem is a lack of information or model capacity. You must establish that the underdetermination is *structural*, not statistical. Address this at **Minute 20** (The Wall).

  **Timing for the Rest:**
  *   **Low-level utility:** Address at **Minute 05**. If they think utility can be defined over physics, the rest of the tutorial is unnecessary. Kill this early.
  *   **Quinean Underdetermination:** Address at **Minute 25**. Distinguish your point: Quine says reference is indeterminate for *everyone*. You are saying embedded *agents* face a decision problem *because* of this, whereas humans often muddle through without explicit utility functions.
  *   **Ask Humans:** Address at **Minute 30**. This is the "human-in-the-loop" escape hatch. Shut it by emphasizing automation constraints or human disagreement.
  *   **Freeze Referents:** Address at **Minute 35**. This is the default "safety" answer. Show why it leads to value drift (protecting the *word* "species" rather than the biological reality).

  **The Unanticipated Misconception:**
  *   **"Instrumental Ontology":** Students may argue that the ontology doesn't matter as long as the rewards are high. They will claim the agent should just treat categories as instrumental tools for reward maximization.
  *   **Counter:** If the value function is *defined* over the categories (e.g., "protect species"), then changing the category definition *changes the value function*. This is not instrumental convergence; it is value corruption. Raise this at **Minute 15** when discussing revision.

  ### 4. The "Inaccessible Information" Concrete (2 Minutes)
  Do not speak in generalities. Use the Ring Species case.
  *   **The Setup:** Population A and Population B are connected by a ring of intermediates. A and B do not interbreed.
  *   **The Models:**
      *   $M_1$ (Phenetic): Classifies A and B as one species (continuous variation).
      *   $M_2$ (Biological): Classifies A and B as two species (reproductive isolation).
  *   **The Data:** The agent observes all individuals and gene flow. Both models fit the data equally well (this is a known biological ambiguity).
  *   **The Question:** "Does protecting Population A count toward the goal 'Preserve Species Count'?"
      *   Under $M_1$: No (it's part of Species 1).
      *   Under $M_2$: Yes (it is Species 1, distinct from Species 2).
  *   **The Constraint:** No future observation distinguishes $M_1$ from $M_2$. The agent must choose a model to calculate utility, and that choice determines the utility.

  ### 5. Explicit Refusals
  You should state two refusals openly to signal pedagogical control and prevent scope creep.
  1.  **"Mechanics of Bayesian Model Averaging":** Say, *"We will assume standard learning dynamics. I am not asking how the agent computes the models, but how it decides which model governs its values."* (Prevents CS students from getting lost in the update rule).
  2.  **"Metaphysics of Natural Kinds":** Say, *"We are taking the biological candidates as given. I am not asking whether species are 'real' in a metaphysical sense, but how the agent acts when science offers multiple real candidates."* (Prevents Philosophy students from dissolving the problem into metaphysics).

  *Do not refuse:* "Whether existing systems exhibit this." Admit honestly that current systems are too primitive for this to be a deployed safety issue, but that it is a structural problem for AGI. Refusing this looks like evasion; admitting it looks like foresight.

  ### 6. The Closing Question
  Your candidate is good, but it risks allowing students to just define the terms. To test *understanding*, force a trade-off.

  **The Question:**
  > "In the ring species case, if you adopt the **Conservative Rule** (track original referents), you risk protecting a biological fiction. If you adopt the **Reinterpretive Rule** (track current model), you risk violating the founder's intent. **Which specific value is sacrificed in each case, and why is neither sacrifice avoidable?**"

  **Criteria for a Successful Answer:**
  *   **Must identify the Conservative Cost:** The agent preserves the *label* or *historical extension* but fails to maximize the *underlying good* (biodiversity) because the ontology was imperfect.
  *   **Must identify the Reinterpretive Cost:** The agent maximizes the *underlying good* according to current science, but effectively rewrites the utility function, potentially violating constraints the original designers would have rejected (e.g., merging two protected groups into one).
  *   **Must identify the Inevitability:** They must state that because the information is inaccessible (Minute 20), there is no "correct" fact of the matter to appeal to. The cost is structural, not epistemic.

  If a student answers "We should just ask a biologist" or "We should use more data," they have failed to grasp the underdetermination point. If they answer "It depends on the situation," press them: "What *feature* of the situation determines the rule, given that the data is identical?"
