      Why? Because invasive procedures require affirmative consent. Ambiguity = No Consent.

      *Wait, engaging the brother:* If the hand says yes, ignoring it might harm the patient (seizures continue). So "Status Quo" might be harmful.
      *Better Default:* If conflict remains, treat as *incapacitated*. Invoke surrogate decision making (siblings + physician) based on Best Interest. This respects that *neither* hemisphere has full capacity alone.
      *Yes, this is the strongest philosophical position.* It acknowledges the fragmentation without legally splitting the person.

