      *Better:* To be actionable: "Defer decision. Conduct specialized assessment. If conflict remains, Verbal Refusal prevails due to bodily integrity presumption." This is clearer for a vote.

      Let's go with:
      1. Suspend consent determination.
      2. 2-week specialized neuropsych eval.
