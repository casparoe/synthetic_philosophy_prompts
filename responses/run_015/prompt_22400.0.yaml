      3. Propose a "Disunified Capacity" designation.
      4. Order specific testing (Risk comprehension via right hand).
      5. Default: If conflict persists, Verbal Refusal stands (status quo bias protects bodily integrity).

  7.  **Final Polish:** Ensure it sounds like a committee memo. Keep it under ~800 words for readability. Ensure the Thursday deadline is met (memo date).

      *(Wait, one more check)*: The prompt asks for a "concrete course of action with a time frame."
      Okay, I will propose a 10-day assessment period.
