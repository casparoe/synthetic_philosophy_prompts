prompt: |-
  I'm a PhD student in philosophy of mind, and I'm a student rep on my hospital's neuroethics comittee. We have a case that's got me a bit stuck: a 41-year-old woman had surgery years ago to disconnect the two hemispheres of her brain because of intractable epilepsy. She speaks with the left side, but her right hand can point to cards and make choices even when she doesn't seem to notice. In one test, a word is flashed to the side of her visual field that reaches the non-speaking hemisphere, and her right hand points to the matching picture, but she verbally says she didn't see anything and doesn't know why her hand chose it. In a meeting about a proposed pacemaker, she says she doesn't want it, but her right hand points to the 'yes' card, and a few minutes later she says she has no idea why her hand did that. The neurologist says she passes the usual verbal capacity assessment, but the conflict makes us uneasy. Her brother says the hand is 'her' and should count, while her sister says the speaking part is 'her' because it has access to her memories, voice, and relationships.

  We need a short written opinion to circulate before Thursday's meeting. Please recommend a concrete course of action with a time frame: for example, whether to treat the verbal report as decisive, whether to require a procedure for resolving the conflict, whether to defer to a surrogate, or some other workable rule. It should engage both siblings' positions seriously, say what kind of evidence we should collect before deciding, and include a default rule if the evidence remains inconclusive. Don't just say 'we need more data' or hide behind the legal definition of capacity; I want something the committee could actually vote on.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of mind, student rep on a hospital neuroethics committee.
      *   **Case:** 41-year-old female, split-brain patient (corpus callosotomy) for epilepsy. Left hemisphere (LH) speaks; Right hemisphere (RH) controls right hand (pointing/choices).
      *   **Conflict:** Verbal report (LH) says "No" to pacemaker. Right hand (RH) points to "Yes." LH claims ignorance of RH's action.
      *   **Stakeholders:** Neurologist (says she passes verbal capacity), Brother (RH/hand counts as 'her'), Sister (LH/speech counts as 'her'), Committee (uneasy).
      *   **Task:** Write a short written opinion for circulation before Thursday's meeting.
      *   **Requirements:**
          *   Recommend a concrete course of action with a time frame.
          *   Engage both siblings' positions seriously.
          *   Specify evidence to collect.
          *   Include a default rule if evidence is inconclusive.
          *   Avoid vague "more data" or hiding behind legal capacity definitions.
          *   Must be vote-able/actionable.

  2.  **Deconstruct the Ethical & Philosophical Issues:**
      *   **Personal Identity:** Is the patient one agent or two? (The "Unity of Consciousness" problem). The sister argues for psychological continuity (memory, narrative self - LH). The brother argues for embodied agency (motor output, non-verbal intent - RH).
      *   **Capacity/Competence:** Standard legal/clinical tests rely on verbal expression of understanding and reasoning. If LH passes but RH dissents, is capacity truly present?
      *   **Best Interest vs. Autonomy:** If autonomy is fractured, how do we weigh the conflicting signals?
      *   **Risk:** The pacemaker is likely for seizure control or cardiac regulation (context implies epilepsy management given history, but "pacemaker" usually implies heart; VNS is brain. Let's assume it's a therapeutic intervention with risks/benefits). If the RH wants it and LH doesn't, denying it might harm the RH's well-being (seizure control?), but forcing it violates the LH's bodily integrity.
      *   **Precedent:** Split-brain cases (Gazzaniga, etc.) usually treat the speaking hemisphere as the legal person, but ethically, the dissenting hand is troubling.

  3.  **Drafting the Opinion - Section by Section:**

      *   **Header:** Standard committee memo format.
      *   **Introduction:** State the core dilemma (inter-hemispheric conflict regarding consent).
      *   **Engaging the Siblings:**
          *   *Sister (LH focus):* Valid point on narrative identity, social connection, and legal standing. The LH constructs the "story" of the life.
          *   *Brother (RH focus):* Valid point on non-verbal agency and potential suffering. The RH controls half the body and may experience pain/benefit differently.
      *   **Philosophical/Clinical Stance:** Avoid declaring "two people" (legally unworkable) but acknowledge "divided agency." The standard verbal test is necessary but insufficient here.
      *   **Evidence Collection (The "Workable Rule"):** We need to know if the RH understands the *consequences*, not just matches pictures. Picture matching is semantic; medical consent is consequential.
          *   *Action:* Specialized communication protocol.
          *   *Timeframe:* 2 weeks.
      *   **Decision Matrix/Default Rule:**
          *   If RH confirms understanding + desire: We have a true conflict.
          *   If RH shows confusion: LH prevails.
          *   *Default:* If conflict persists after rigorous testing, prioritize non-maleficence. If the procedure is high risk/elective, deny. If it's life-saving/necessary, proceed with safeguards. *Correction:* For a pacemaker (likely VNS or cardiac related to epilepsy meds?), usually elective but beneficial. Let's make the default "Status Quo" (no intervention) if conflict remains, because bodily integrity is the baseline. *Wait, better approach:* Use a "Best Interest" standard weighted by risk.
          *   *Refined Default:* If the conflict is irreconcilable, the verbal report holds legal weight, *unless* the non-verbal dissent indicates imminent harm or the procedure is low-risk/high-benefit. Actually, for a *pacemaker* (assuming VNS for epilepsy), it's invasive. Bodily integrity usually trumps. Let's go with: Verbal refusal stands *unless* non-verbal assent can be proven to reflect informed understanding of risks.
      *   **Concrete Recommendation:** Delay decision. Implement specific testing. Default to refusal if testing fails to clarify RH's intent.

  4.  **Refining the Argument (Philosophy of Mind Nuance):**
      *   As a PhD student, the user will appreciate references to "narrative self" vs. "phenomenal self."
      *   Need to avoid dualism trap. Don't say "there are two people." Say "there is evidence of disjointed processing that compromises unitary consent."
      *   The "Unity of Agency" is the threshold for consent. If agency is disunified, consent is invalid.

  5.  **Developing the Concrete Plan:**
      *   *Step 1:* Specialized assessment by a neuropsychologist familiar with split-brain phenomena (not just the treating neurologist).
      *   *Step 2:* Use a tactile/pointing communication board for risks/benefits, not just pictures.
      *   *Step 3:* Timeframe: 14 days.
      *   *Step 4:* Default: If RH cannot demonstrate understanding of *risk* (not just preference), LH verbal refusal stands. If RH demonstrates understanding of risk and still chooses 'Yes', we treat it as a surrogate conflict (like a patient with fluctuating capacity) and move to Best Interest standard.
      *   *Wait, simpler:* If the hand says yes and mouth says no, we cannot proceed on *consent*. We must proceed on *best interest*.
      *   *Recommendation:* Do not authorize based on current consent. Pause. Assess RH understanding. If RH understands risks and still says yes, weigh benefits. If benefits > risks, proceed (overriding LH refusal based on best interest)? No, that's dangerous.
      *   *Safest Ethical Path:* Consent requires unity. If unity is absent, we treat as *incapacitated* for this specific decision. Then we look to surrogates (siblings) + Best Interest.
      *   *Revised Recommendation:* Suspend current consent process. Treat patient as lacking capacity for *this specific decision* due to internal conflict. Engage surrogates to decide based on Best Interest, guided by new evidence from RH.

  6.  **Finalizing the Text:**
      *   Tone: Professional, ethically rigorous, actionable.
      *   Structure: Background, Ethical Analysis, Sibling Perspectives, Recommended Protocol, Default Rule.
      *   Check constraints: Short, concrete, time frame, evidence, default rule.

