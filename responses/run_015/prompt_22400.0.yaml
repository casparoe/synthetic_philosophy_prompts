      *Evidence:* Not just picture matching. Risk/Benefit comprehension via tactile/pointing.

      *Default:* If conflict persists -> Incapacity -> Surrogate Best Interest.

      *Let's refine the "Default".* If we declare incapacity, the siblings are already fighting. The physician might have tie-breaking power.
      Okay, I will recommend: If conflict persists, the intervention is withheld unless the medical necessity is urgent (emergency). If elective, verbal refusal stands.
      *Reasoning:* Invasive procedures require clear consent. Ambiguity favors liberty/bodily integrity.
      *Counter:* But what if the RH is suffering?
      *Compromise:* If conflict persists, convene a Best Interest panel (Committee + Surrogates). Do not rely on patient's consent.
