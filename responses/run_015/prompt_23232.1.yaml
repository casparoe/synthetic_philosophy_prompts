      *   *Tone:* Academic, precise, neutral but decisive on technical points.
      *   *Key Citations (Mental Check):* Aumann (1995), Binmore (1987), Reny (1987), Samet (1996), Stalnaker (1996), Brandenburger (2007).

      *(Self-Correction during drafting)*: Make sure not to just say "Lena is right about math, Marco is right about psychology." This is *epistemic* game theory. The math *itself* has a tension regarding counterfactuals. I need to highlight the **Reny/Binmore critique** specifically regarding the contradiction of reaching a node.

      *Refining the "Unreached Nodes" point:* Marco says it's vacuous. Lena says it's rigorous. Actually, the issue is *counterfactual consistency*. If I assume you are rational, I assume you won't make a mistake. If you make a mistake (reach an unreached node), my assumption is broken. How do I update? Standard BI doesn't specify belief revision. This is where Lena is shaky.

      *Refining the "Finite Levels" point:* Marco is right that finite levels allow cooperation. This is the "Approximate Common Knowledge" result (Monderer/Samet).

  6.  **Final Polish:** Check against the prompt requirements.
      *   Move by move? Yes.
