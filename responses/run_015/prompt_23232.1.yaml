      *Marco's "Vacuous" claim:* Is it vacuous? No, it's counterfactual. Vacuous means "empty." Counterfactuals have truth conditions. I should clarify this distinction.

      *Let's ensure the distinction between Knowledge and Belief is highlighted.* In Centipede, Common *Knowledge* of Rationality is actually inconsistent with the game reaching the second node. Common *Belief* is the more appropriate epistemic condition for BI, but even that has issues with belief revision. I need to make sure I don't get too bogged down in technicalities but keep it accessible for a seminar student.

