      *   Flag missing/subtly wrong things? Yes.

      *(Final thought on the "Paradox"):* The Centipede paradox isn't just that people cooperate. It's that the logic of BI seems to undermine itself. If P1 stops at 1 because P2 would stop at 2, why would P2 stop at 2? Because P1 would stop at 3. But if P1 didn't stop at 1, P2 should update beliefs about P1. BI assumes they don't update in a way that breaks the chain. This is the "epistemic gap."

      Okay, ready to write. Structure will be:
