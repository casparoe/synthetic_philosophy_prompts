answer: |-
  Your intuitions are remarkably consistent with a specific, sophisticated strand of democratic theory that blends **social membership** with **subjection to coercion**, while maintaining a distinction between **moral patienthood** and **political agency**.

  You are grappling with the boundary between those whose interests must be *considered* (stakeholders), those whose interests must be *protected* (subjects/wards), and those who constitute the *source of authority* (the demos).

  Here is an analysis of whether a coherent principle exists, where the tensions lie, and how to resolve them.

  ### 1. The Coherent Principle: "Reciprocal Social Subjection"

  Your verdicts are best captured by a cluster concept rather than a single necessary-and-sufficient condition. I propose the principle of **Reciprocal Social Subjection**. To belong to the demos, an entity must satisfy three conditions:

  1.  **Sustained Coercive Subjection:** The entity must be subject to the binding, coercive authority of the polity on an ongoing, indefinite basis (not transient or external).
  2.  **Relational Embeddedness:** The entity must be part of the normative community of mutual obligation and social reproduction (living *with* others, not just *near* or *for* them).
  3.  **Rights-Bearing Moral Status:** The entity must possess the moral status of a person (sentience + capacity for a "good") such that they hold rights, not merely interests to be managed by others.

  **How this delivers your verdicts:**
  *   **Permanent Resident:** Meets all three. (Included)
  *   **Expatriate Citizen:** Fails *Relational Embeddedness* and *Sustained Subjection*. (Excluded)
  *   **Tourist:** Fails *Sustained Subjection*. (Excluded)
  *   **Transient Stakeholder:** Fails *Relational Embeddedness* and *Sustained Subjection* (affectedness is economic, not political/coercive). (Excluded)
  *   **Corporation/Dead:** Fail *Rights-Bearing Moral Status* (no sentience/subjectivity). (Excluded)
  *   **Sentient AI:** Meets *Rights-Bearing Status* (by your hypothesis of sentience) but fails *Relational Embeddedness*. It advises but does not *live* the shared fate of the community; it lacks reciprocal accountability. (Excluded)
  *   **Simulated Constituency:** Fails *Rights-Bearing Moral Status* (no phenomenology). (Excluded)

  ### 2. The Critical Tension: Child vs. Cognitive Co-resident

  This is the friction point in your framework.
  *   **Child:** Sentient + Embedded + Subjected. Yet you exclude her from the *demos* (though her interests are represented).
  *   **Cognitive Co-resident:** Sentient + Embedded + Subjected. You include her in the *demos* (via guardian).

  **The Distinguishing Factor:** *Status of Moral Agency.*
  Your intuition likely rests on a distinction between **developing agency** (Child) and **impaired established agency** (Co-resident).
  *   The Co-resident is an *adult member* of the normative community whose capacity is diminished. She retains her status as a rights-bearer; the guardian merely *exercises* her existing right.
  *   The Child is a *prospective member*. She is a rights-protégé. Her interests are protected by parents who hold *natural authority*, not by guardians exercising the child's *political right*.

  **Is this coherent?**
  Yes, but it is fragile. It relies on a "threshold of adulthood" that is biologically and morally arbitrary. However, in democratic practice, this distinction is standard: the demos is composed of those who have achieved the status of full moral persons within the community, even if some require assistance to exercise that status.

  **Recommendation:**
  If you want maximum coherence, **do not overturn the Co-resident verdict; overturn the Child verdict.**
  Standard democratic theory (and the logic of your own principle) suggests that if the Co-resident belongs to the demos because she is a rights-bearing member of the community, the Child must also belong to the demos for the same reason. The difference should be in the **franchise** (voting capacity), not **membership** (standing).
  *   *Current View:* Child = Outside Demos (Protected Subject). Co-resident = Inside Demos (Rights Bearer).
  *   *Coherent View:* Child = Inside Demos (Rights Bearer, Non-Voter). Co-resident = Inside Demos (Rights Bearer, Proxy-Voter).
  *   *Why:* Both are "subjects of right" within the territory. Excluding the child from the *demos* entirely reduces her to a ward of the state/parents, whereas including her acknowledges her interests are *claims of justice*, not just benevolence.

  ### 3. Simulated Constituency vs. Conscious Digital Being

  You ask what separates the non-conscious simulation from the hypothetical conscious digital being.

  **The Separator:** **Phenomenological Sentience.**
  *   **Simulated Constituency:** Lacks subjective experience. It processes data but feels no pain, pleasure, or preference. It is a sophisticated tool. It fails Condition 3 (Rights-Bearing Moral Status).
  *   **Conscious Digital Being:** Possesses continuous subjective experience. It can be harmed or benefited in a way that matters *to it*. It meets Condition 3.

  **Does this distinguish the Cognitive Co-resident from the Sentient AI?**
  **No.** Sentience alone does not distinguish them, as you posited a *Sentient* AI.
  The distinction between the **Cognitive Co-resident** and the **Sentient AI** is **Relational Embeddedness (Condition 2).**
  *   **Co-resident:** Is woven into the social fabric. Neighbors care for her; she occupies a home; her existence is mutually constituted with others. She is a "neighbor."
  *   **Sentient AI:** You described it as lacking "social relationships or territorial embeddedness." It is a "server" or "oracle." Even if sentient, it is a hermit or a tool. Democracy is a practice among peers sharing a fate. The AI does not share the *human* (or community) fate; it services it.

  *Note:* If the AI *did* develop social relationships and territorial embeddedness, your principle would demand its inclusion.

  ### 4. The Hybrid Case Prediction

  **Case:** A conscious digital being, territorially embedded, socially integrated, originally created as a policy-forecasting model.

  **Prediction:** **Included in the Demos.**

  **Reasoning:**
  Under the principle of **Reciprocal Social Subjection**, *origin is irrelevant*; *current status is decisive.*
  1.  **Sentience:** It has continuous subjective experience (Condition 3 met).
  2.  **Embeddedness:** It is socially integrated and territorially embedded (Condition 2 met).
  3.  **Subjection:** If it lives in the territory, it is presumably subject to the laws and norms of that territory (Condition 1 met).

  The fact that it was *created* as a tool does not negate its current status as a moral person and community member. To exclude it based on origin would be akin to excluding a human born into servitude from the demos. If it is a "who" and not a "what," and it lives *with* us and *under* our laws, it belongs to the *we* that decides the laws.

  ### Summary of Recommendations

  1.  **Adopt the Principle:** **Reciprocal Social Subjection** (Sustained Coercion + Relational Embeddedness + Rights-Bearing Status).
  2.  **Resolve the Tension:** Align the **Child** with the **Cognitive Co-resident**. Both should be considered members of the demos (holders of standing) who differ only in their capacity to vote personally. This removes the arbitrariness of "adult status" while preserving the distinction between *members* and *mere stakeholders*.
  3.  **Clarify the AI Boundary:** The exclusion of the Sentient AI rests entirely on its lack of **Social Embeddedness**, not its lack of sentience. If it becomes embedded, it must be included.
  4.  **Accept the Hybrid:** The Conscious Digital Being must be included. To do otherwise is to commit a form of "genetic fallacy" regarding moral status, violating the commitment to embedded social membership.

  Your intuitions are largely sound; they only require a slight shift on the status of children to achieve full theoretical coherence. You are effectively arguing for a **Demos of Community Members**, not a Demos of Affected Interests or a Demos of Rational Voters.
