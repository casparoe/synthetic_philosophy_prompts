answer: |-
  An agricultural conglomerate facing a regional locust surge must select between a broad-spectrum fumigant costing pennies per acre but eliminating three trillion arthropods, and a targeted biological control costing ten times more that leaves the population intact. Current neurobiology suggests any individual insect possesses a mere one-in-a-thousand chance of containing the requisite neural complexity for subjective suffering, yet the sheer volume of life ensures that under the cheap protocol, the expected number of sentient beings destroyed is three billion. The board must decide whether to absorb the significant financial loss to preserve the swarm based solely on this probabilistic risk of pain, where the scientific data remains identical for both frameworks but the moral calculus hinges on whether the uncertainty of a single creature's mind can be summed across the totality of the hive.

  **Reasoning and Structural Divergence**

  The linear moral-risk framework operates on expected value. It multiplies the population size (three trillion) by the probability of sentience (0.001) to derive an expected moral cost equivalent to destroying three billion sentient beings. Because this aggregate expected suffering vastly outweighs the financial burden of the expensive protocol, the framework mandates the switch. Conversely, the individual evidential-threshold framework assesses moral status on a case-by-case basis. It establishes a confidence bar—say, 50% certainty—required to grant an entity moral standing. Since 0.001 falls far below this threshold, each insect is treated as non-sentient for moral purposes. Because no individual crosses the bar, the total moral cost is zero, and the framework rejects any obligation to incur the extra expense.

  The exact structural feature forcing these conclusions apart is the permissibility of aggregating sub-threshold probabilistic claims across distinct individuals. The linear framework treats moral weight as a fluid quantity that can be summed across a population, allowing tiny fractions of probability to accumulate into a massive obligation. The threshold framework treats moral status as a binary predicate attached to specific entities; if the evidence for any single entity is insufficient, that entity contributes nothing to the moral sum, regardless of how many similar entities exist.

  To dissolve the conflict, the threshold theorist undermines the aggregation step without disputing the empirical premise of the one-in-a-thousand probability. They argue that moral patienthood is not a resource that can be pooled; you cannot combine a thousand non-persons to create one person. By insisting that the obligation to avoid harm attaches only to beings who individually meet the evidential standard, they render the scale of the population morally inert. The conflict vanishes because the large number of insects does not amplify the moral status of the individual; it merely replicates a state of non-obligation trillions of times.
