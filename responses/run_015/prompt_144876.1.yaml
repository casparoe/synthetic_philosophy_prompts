answer: |-
  **Adversarial Collaboration: Laws and Trends in Historical Development**

  This document records the substantive consensus and residual disagreements between the authors regarding the possibility of laws in history.

  **1. Agreed Claims**

  1.  Unconditional long-range forecasts of the whole course of human affairs are impossible.
  2.  Trends differ from laws; trends hold only given initial conditions that can lapse.
  3.  The Oedipus effect is real: predicting a social outcome can alter its probability.
  4.  Piecemeal institutional knowledge is possible even if holistic prediction fails.
  5.  Social generalizations require scope conditions or *ceteris paribus* clauses.
  6.  The growth of scientific knowledge undermines predictions whose truth depends on what will later be known.
  7.  Published forecasts will score systematically worse than sealed forecasts due to reflexive interference.

  **2. Residual Disagreements**

  | Issue | Regularity Position (Partner) | Unpredictability Position (User) | Neutral Statement of Difference |
  | :--- | :--- | :--- | :--- |
  | **Status of Regularities** | Genuine conditional laws exist (e.g., fiscal strain → state breakdown). | These are trends contingent on unstable initial conditions, not laws. | Are stable mechanisms sufficient for law-status, or does historical contingency negate it? |
  | **Scope of Knowledge Argument** | Rules out only unconditional prophecy and stage-theories. | Undermines any prediction dependent on future knowledge states. | **Verbal/Substantive Mix:** We agree on the distinction, but disagree on whether conditional structural predictions depend on future knowledge. |
  | **Ignorance-Screened Conditionals** | The screening clause is just how *ceteris paribus* laws look; the law remains substantive. | The clause does all the predictive work; the result is merely a law about the uninformed. | Is the screening clause a trivial restriction or a substantive limitation on historical lawhood? |

  **3. Cruxes**

  | Sub-Question | Shared Evidence / Test | Regularity Prediction | Unpredictability Prediction |
  | :--- | :--- | :--- | :--- |
  | **Sealed-Forecast Registry** | An institution scores pre-registered conditional forecasts of large-scale social outcomes. Half are published, half sealed until outcome date. | Sealed half beats chance significantly. Published half scores worse than sealed. | Sealed half does not beat chance long-term (knowledge growth undermines). Published half scores worse than sealed. |
  | **Ignorance-Screened Empirics** | Testing generalisations whose antecedent includes a clause: *agents do not know the generalisation and do not have high credence in its prediction.* | Holds robustly across contexts; confirms mechanism-relative laws. | Fails when agents anticipate the clause; confirms predictions are only valid under ignorance. |

  **Scope Clarification**
  We have settled the scope question regarding the growth of knowledge: the disagreement is not whether knowledge growth affects prediction (both agree it does), but whether it invalidates *conditional* structural predictions. The Regularity Position holds that structural mechanisms operate independently of specific knowledge content; the Unpredictability Position holds that in open societies, knowledge growth alters the structural conditions themselves.

  **Signatures**

