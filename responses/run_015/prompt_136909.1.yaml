  Alice is a hospice nurse and Bob is her terminal patient; Bob is fully sane but maliciously lies to supervisors to get Alice fired, asserting control before death. Alice is morally required to continue caring for Bob, treating his aggression as a manageable symptom of his situation (the objective attitude) rather than a moral address warranting resentment, because the care relationship is constitutively non-reciprocal. Colleagues understand this normative frame and see indignation as unfitting interference, even though Bob's conduct manifests genuine ill will and he is straightforwardly morally responsible for the harm.

  Strawson's view insists that because Bob is sane and uncoerced, the participant stance (resentment/indignation) is mandatory; he would argue Alice is either suppressing apt blame or erroneously treating Bob as exempt. The quality-of-will view agrees Bob is blameworthy (bad will) but separates blame-worthiness from the aptness of reactive attitudes, allowing relational norms to block the attitudes without excusing the agent. The single feature doing the work is the **constitutive non-reciprocity of the care relationship**. If you remove this feature (making them peers), the case collapses into an ordinary blame scenario where resentment is apt. A responsibility-as-aptness theorist would attack this by arguing that if reactive attitudes are truly unfitting, then Bob simply isn't fully responsible *relative to those parties*, or that you are conflating pragmatic inadvisability (don't express it) with normative unfittingness (don't feel it), thereby stipulating the verdict rather than proving responsibility exists without the attitudes.

