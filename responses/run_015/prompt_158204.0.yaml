  **Preliminary Analysis: Defining "Collapse" for Public History**

  Before recommending a path forward, we must stress-test what "collapse" means in this context. Three candidate definitions emerge. First, *Demographic Catastrophe*: a sharp population decline. This fails the Maya case immediately; while Classic cities were abandoned, millions of Maya people survive today. Scoring them on "failure" is ethically untenable. Second, *Contemporary Experience*: did people feel it was the end? This is inaccessible for the Bronze Age and risky for Easter Island, where resilience is now highlighted over suicide. Third, *Socio-Political Integration*: the breakdown of central authority, trade networks, and elite structures. This fits the Bronze Age (palace economies vanished), Easter Island (chiefly systems disrupted), and the Maya (city-states fragmented). Crucially, it aligns with your mill town intuition: the mills (structure) closed, but the town (people) persisted. This definition allows us to acknowledge severe disruption without erasing survival. It permits the word "collapse" for the system while forbidding it for the people.

  **Decision Memo**

  **TO:** State Humanities Council Program Committee
  **FROM:** External Consultant, History & Public Memory
  **DATE:** October 26, 2023
  **SUBJECT:** Grant Recommendation: "When Civilizations Fail"

  **Bottom Line Recommendation**
  Award the $400,000 implementation grant **with conditions**. The museum must submit revised interpretive scripts and a redesigned interactive plan within 90 days for council approval before funds are released. The title may remain to satisfy the donor agreement, but the framing must shift from "failure" to "structural transformation."

  **Conceptual Framework: A Reusable Decision Rule**
  To ensure consistency in future grants regarding societal change, the Council should adopt the **"Structural Discontinuity vs. Cultural Continuity"** rule. Under this rule, "collapse" applies only to specific political or economic systems, never to people or cultures.
  *   **The Maya:** The Classic period political system collapsed (abandoned cities), but Maya culture and people continued. The exhibit must state this explicitly.
  *   **The Bronze Age:** The international palace economy collapsed, but local societies persisted or transformed (e.g., Egypt). The exhibit must show this patchwork, not a uniform blackout.
  *   **Easter Island:** The chiefly system faced stress, but the population adapted until European contact. The exhibit must distinguish between internal adaptation and external shock.
  This rule protects living descendants from being labeled "failures" while preserving the urgency of systemic breakdown needed for climate lessons.

  **The "Collapse-o-Meter" Interactive**
  The current slider (0–100 on "how completely it failed") must be **redesignated**. Scoring human ancestors on a failure scale is ethically hazardous and historically imprecise.
  *   **New Design:** A dual-axis graph. The X-axis measures "Centralization" (from distributed to empire); the Y-axis measures "Material Continuity" (from abrupt loss to adaptation).
  *   **Visitor Task:** Instead of scoring failure, visitors plot where each society moved on the graph.
  *   **Label Warning:** The interface must state: *"Systems change; people endure. This tool measures structural shifts, not human worth."*
  This retains the interactive engagement the Director needs without the ethical liability the Curator identifies. It turns a verdict into a diagnosis.

  **Handling Easter Island Narratives**
  The education department's desire for a "cleaner cautionary tale" must not override current scholarship. However, we need not turn the gallery into a historiography seminar.
  *   **Solution:** Focus on **Resilience**. Instead of "They cut down all the trees and died," the text should read: "Islanders adapted to changing resources for centuries. Later, external contacts brought disease and disruption."
  *   **Visuals:** Show the statues not as tombstones of a dead culture, but as enduring markers of a living lineage. This satisfies the scientific revision without losing the environmental warning; indeed, adaptation is a more useful climate lesson than fatalism.

  **Addressing Stakeholder Concerns**
  We must acknowledge the validity of the concerns on both sides to ensure the project's success.

  *To the Museum Director:* You are correct that "collapse" carries an urgency that "transition" lacks. In a climate crisis, euphemisms can dull the necessary alarm. A hall nobody visits educates no one, and losing the $1.5M gift would cripple the institution. However, credibility is also currency. If the public perceives the exhibit as racist or scientifically outdated, visitation will suffer regardless of the title. By distinguishing *system* collapse from *people* collapse, you keep the warning sharp without sacrificing accuracy. The donor agreement specifies the title, not the slider labels; you can keep the gift and fix the ethics.

  *To the Curator of Indigenous Partnerships:* You are correct that a "failure scorecard" inflicts harm on living communities. Your ancestors survived cataclysmic changes, and the exhibit must honor that resilience. However, denying the severity of the Classic Period breakdown risks minimizing the real suffering and disruption that occurred. By insisting on the "Structural Discontinuity" definition, you secure a narrative where Maya people are survivors of systemic change, not victims of their own failure. This gives you leverage to ensure your community is consulted on the "Continuity" axis of the new interactive.

  **Timeline and Conditions**
  1.  **Day 0:** Grant approval contingent on revisions.
  2.  **Day 30:** Museum submits revised script for Easter Island and Maya alcoves, incorporating the "Structural Discontinuity" framework.
  3.  **Day 60:** Museum submits prototype of redesigned interactive (no "failure" slider).
  4.  **Day 90:** Council review. If approved, funds released. If rejected, grant deferred.

  **Conclusion**
  This path preserves the funding and the urgency of the climate message while respecting the humanity of the past and present. It treats "collapse" as a diagnostic tool for systems, not a verdict on souls. That is a lesson worth funding.
