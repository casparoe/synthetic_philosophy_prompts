      *   *On Neurodiversity as Resistance:* He wouldn't see it as "freedom" from psychiatry. He would see it as a *counter-discourse* within the same regime of truth. The language used (spectrum, disorder, function, adaptation) is still medical/scientific.
      *   *On Subjectivity:* This is the crux. The autistic subject is no longer just the "object" of the clinical gaze but a "subject" who speaks truth about themselves. This aligns with his later work on *parrhesia* (fearless speech) and ethics.
      *   *On Biopolitics:* The movement might look like "self-governance." Instead of the doctor telling you how to be normal, you define your own normalcy, but you still have to navigate the institutional structures (insurance, schools, workplaces) that rely on the diagnosis.
