      *   *Subjectivation:* How individuals become subjects (both subjected to power and self-constituting).
      *   *Counter-conduct/Resistance:* Resistance is immanent to power, not outside it. Where there is power, there is resistance.
      *   *The History of Madness:* The "Great Confinement," the monologue of reason over madness, the medical gaze.
