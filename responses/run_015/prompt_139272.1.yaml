answer: |-
  **SenseLock™ Help Center**
  **Topic: Managing Your Private Sign (S)**

  **Q: How do I define S during onboarding?**
  A: Focus intensely on the target sensation. When the feeling peaks, tap the 'Assign S' button. This ostensive gesture binds the sign to the sensation. Please note: SenseLock does not validate the connection. Validation would require a public criterion, which compromises privacy. The app simply records that you *intended* to name something. This ensures your meaning remains radically subjective. You are not learning a language; you are certifying a solitude.

  **Q: How do I know I'm using S correctly later?**
  A: Correctness is not a supported metric. If you log S today, and log S tomorrow, the app cannot determine if the sensation is identical, only that you *judge* it to be. Our 'Consistency Check' confirms that you feel confident in your usage. It cannot distinguish between remembering the sensation correctly and merely seeming to remember it. This is not a bug; it is your privacy shield. If no one can check you, no one can judge you. There is no rule for using S, only your impression of a rule.

  **Q: Does Premium 'Sincerity Mode' prevent self-deception?**
  A: No. 'Sincerity Mode' prompts you with "Are you truly feeling S?" before logging. However, since only you have access to the sensation, your affirmation is the only possible data point. The app records your assertion of sincerity, not sincerity itself. Similarly, 'Encrypted Backup' preserves your diary entries, but it cannot preserve the rule for using S. If your internal criterion drifts tomorrow, the backup securely stores yesterday's error. A 'Streak Counter' will still increment, rewarding your commitment to the sign even if the sign has become empty.

  **Q: Can I share patterns with my doctor?**
  A: Not in S. A private sign has no utility outside your own mind because it lacks a shared grammar. To export data, you must purchase the 'Public Bridge Integration.' This feature forces you to translate S into public language (e.g., "migraine," "anxiety") using standardized criteria. Please note: Once translated, the data is no longer private, nor is it strictly yours. We recommend keeping S for yourself and buying the Integration Pack only for insurance claims. Functionality requires surrendering the privacy you paid for.

  **Q: Why did my streak reset?**
  A: Streaks track consecutive days of logging. They do not track consecutive days of *meaningful* logging. Since meaning is private, the app cannot assess the quality of the entry. You maintained the habit, even if the sign lost its connection to the sensation. That is between you and yourself.

  **Still stuck?**
  Contact Support. Please describe your issue in public language. We cannot troubleshoot S. If you claim "S is broken," we cannot verify what S is. Please submit a ticket using words everyone understands.
