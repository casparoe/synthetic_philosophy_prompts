      **SenseLock™ Support**
      **Topic: Managing Your Private Sign (S)**

      **Q: How do I define S during onboarding?**
      A: Focus intensely on the target sensation. When the feeling peaks, tap the 'Assign S' button. This ostensive gesture binds the sign to the sensation. Please note: SenseLock does not validate the connection. Validation would require a public criterion, which compromises privacy. The app simply records that you *intended* to name something. This ensures your meaning remains radically subjective.

