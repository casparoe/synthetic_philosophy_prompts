      *   If (4) is weakened to "functional self-modeling" or "causal closure" rather than "symbolic self-encoding," it aligns with (5) and (2) while preserving (1) and (3).
      *   *Cost:* It moves the view slightly away from Hofstadter's specific mechanism (Gödel numbering) toward a more general systems theory view. But it saves the "Embodied Gödelian" stance.

