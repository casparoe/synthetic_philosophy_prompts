prompt: |-
  I have just spent a long evening arguing with a friend about whether Chase and Sanborn are right that qualia are an incoherent posit, and I am trying to understand why neither of us could move the other. The surface disagreement looks like this: she claims that to invoke private, ineffable, non-physical feels is to commit oneself to a metaphysical surplus that explains nothing, and that quining them is no more costly than Quine quining propositional attitudes; I reply that without first-person acquaintance there is no datum for a theory of consciousness to explain, and that calling this acquaintance a posit mistakes a direct presentation for a theoretical inference. But after three hours we realised we might be answering different questions under the same name. So I want to ask: is this stall a substantive ontological clash, a verbal dispute about whether qualia denotes a property or merely a mode of presentation, or a hidden disagreement about what counts as legitimate explanation—whether explaining behaviour and report is sufficient, or whether explaining the subjective character of experience is an independent explanatory target? To push this further, I want to introduce a framing that did not come up in our conversation but might dissolve some of the confusion: suppose we distinguish between eliminative quining, which removes qualia from our ontology entirely, and reconstructive quining, which retains the phenomenology but reconstrues it as indexical reference to current neural discrimination states—something like this very pattern of activation rather than a non-physical quality. Would that satisfy the eliminativist by removing the metaphysical surplus, or would the defender still object that the indexical anchors a relation that is irreducibly first-personal and therefore still smuggles in the very incoherence Chase and Sanborn identify? Given this distinction, what kind of disagreement is actually operating here—factual, conceptual, or methodological? Is there a concealed empirical commitment about whether neural correlates exhaust the explanatory work, or is the impasse purely about the standards of conceptual coherence? And if it is the latter, what would actually count as progress: a sharper distinction between phenomenal concepts and the properties they present, a demonstration that ineffability is an artifact of linguistic practice rather than a metaphysical feature, or a formal argument that any theory preserving first-person reports must violate some principle of parsimony? Please respond entirely in continuous prose, with no headings, bullet points, bold text, or tables, writing as you would in a letter.
