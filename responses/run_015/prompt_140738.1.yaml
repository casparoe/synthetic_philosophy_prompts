answer: |-
  Here is the specification analysis you requested. It treats your definition of **Safe Pareto Improvement (SPI)** as the target object and tests it against the structural constraints of mechanism design and decision theory.

  ### I. Desiderata List

  **1. Ex-Post Outcome Dominance**
  *   **Requirement:** For any realized outcome profile $o'$ in $G'$, and the corresponding counterfactual outcome profile $o$ in $G$, $u_i(o') > u_i(o)$ for all players $i$.
  *   **Status:** **Non-negotiable** (per your prompt).
  *   **Distinction:** *Realized Utility* vs. *Expected Utility*. This rejects mechanisms that improve welfare only in expectation (e.g., by reducing variance or exploiting risk aversion) without guaranteeing a better result in every specific run.
  *   **Case:** If the guarantee is only ex-ante, a "safe" improvement can result in catastrophic ex-post losses for unlucky realizations, violating the "safety" constraint essential for high-stakes delegation.

  **2. Equilibrium-Selection Agnosticism**
  *   **Requirement:** The dominance relation must hold over a *set* of plausible outcomes in $G$, not a single predicted equilibrium. The designer cannot assign probabilities to multiple equilibria in $G$.
  *   **Status:** **Non-negotiable** (per your prompt).
  *   **Distinction:** *Set-Based Robustness* vs. *Bayesian Optimality*.
  *   **Case:** In miscoordination games (e.g., Stag Hunt), the risk is not miscalculating payoffs but landing on the wrong equilibrium. A mechanism that assumes the "good" equilibrium in $G$ is not an improvement on $G$; it is a bet on $G$.

  **3. Counterfactual Baseline Definability**
  *   **Requirement:** There must be a well-defined mapping $f: \text{Outcomes}(G') \to \text{Outcomes}(G)$ that specifies what would have happened in $G$ given the behavior observed in $G'$.
  *   **Status:** **Non-negotiable** (Logical necessity).
  *   **Distinction:** *Observed Play* vs. *Counterfactual Default*.
  *   **Case:** In delegation (program equilibrium), if I submit code $C'$, I must know what code $C$ I would have submitted otherwise to calculate the improvement. If the default policy is undefined or opaque to the principal, the inequality $u(G') > u(G)$ is computationally undefined.

  **4. Voluntary Participation Robustness (Endogenous Adoption)**
  *   **Requirement:** The SPI guarantee must hold even if entering $G'$ is a strategic move within a larger game, where opting out reveals private information or alters the bargaining power of remaining players.
  *   **Status:** **Non-negotiable** (per your prompt).
  *   **Distinction:** *Exogenous Mechanism* vs. *Endogenous Game Form*.
  *   **Case:** If adoption is optional, a player might opt out to signal "I am a tough negotiator" or "I know $G$ favors me." If the SPI relies on universal participation to function (e.g., to unlock a cooperative equilibrium), partial adoption can make the adopter strictly worse off than if no one had adopted.

  **5. Ordinal Invariance (No Interpersonal Comparison)**
  *   **Requirement:** The validity of the SPI must not depend on comparing the magnitude of utility gains across players, nor on the specific cardinalization of individual utility functions.
  *   **Status:** **Non-negotiable** (Standard Welfare Economics).
  *   **Distinction:** *Pareto Ordering* vs. *Social Welfare Function*.
  *   **Case:** Side payments often require cardinal utility to calculate "fair" compensation. If the SPI relies on side payments to ensure everyone gains, it fails this criterion unless the payments are self-enforcing and ordinal (e.g., in-kind transfers).

  **6. Structural Robustness (Payoff Misspecification)**
  *   **Requirement:** The dominance relation must hold for a neighborhood of payoff functions around the estimated $G$, not just the point estimate.
  *   **Status:** **Preference/Pragmatic** (Camp: Robust Control).
  *   **Distinction:** *Topological Stability* vs. *Algebraic Exactness*.
  *   **Case:** "Certainty" guarantees are brittle. If the SPI relies on a specific inequality (e.g., $T > R$) holding exactly, measurement error turns a "safe" improvement into a potential loss.

  **7. Unmediated Implementability**
  *   **Requirement:** $G'$ must be implementable via cheap talk, binding commitments, or source-code inspection without a trusted third party who observes private moves.
  *   **Status:** **Non-negotiable** (per your prompt).
  *   **Distinction:** *Correlated Equilibrium (Mediated)* vs. *Communication Equilibrium (Unmediated)*.
  *   **Case:** A trusted enforcer solves the commitment problem by fiat. The theoretical challenge is achieving the same security properties using only cryptographic or game-theoretic commitments between adversaries.

  ---

  ### II. Incompatibility Analysis

  **The Impossibility Triad**
  I suspect the following three requirements cannot be jointly satisfied in non-trivial games:
  1.  **Equilibrium-Selection Agnosticism** (We don't know how $G$ is played).
  2.  **Counterfactual Baseline Definability** (We must compare $G'$ outcomes to specific $G$ outcomes).
  3.  **Non-Vacuity** (The SPI must allow improvements in games where $G$ has multiple equilibria or dominated strategies).

  **The Conflict:**
  To guarantee $u(G') > u(G)$ *without* knowing which equilibrium obtains in $G$, you must guarantee $u(G') > \max(\text{Possible Outcomes in } G)$. In most games of interest (e.g., Prisoner's Dilemma, Stag Hunt), the set of "possible outcomes" includes the Nash Equilibria. If $G$ has a unique NE, $G'$ must beat it. If $G$ has multiple NEs, $G'$ must beat the *worst* one to be safe, but you cannot define the counterfactual baseline without assuming *which* NE would have been played.
  If you assume "players play isomorphically" (a common move in SPI literature), you violate **Equilibrium-Selection Agnosticism**. You are importing a behavioral assumption (a belief) about how strategies map between $G$ and $G'$. If you do not import that assumption, the counterfactual $u(G)$ is a set, and strict improvement over a set is impossible unless $G'$ dominates the Pareto frontier of $G$ universally, which renders the concept **Vacuous**.

  **The Single Most Exclusionary Requirement:**
  **Counterfactual Baseline Definability (combined with Agnosticism).**
  This requirement excludes the largest share of candidate definitions. Most proposals (Program Equilibrium, Cheap Talk) implicitly assume a "default policy" (e.g., "if we don't agree, we play Nash"). But as you noted, in delegation, the principal may not know their own default policy. If the baseline is undefined, the inequality $u(G') > u(G)$ cannot be evaluated. If the baseline is defined by assumption (e.g., "rational play"), you violate Agnosticism.

  **Voluntary Participation** is a close second. Almost all SPI literature assumes mandatory adoption. Once adoption is endogenous, the "safety" guarantee typically collapses because the option to opt-out becomes a signaling device that changes the equilibrium of the subgame, often to the detriment of the cooperators.

  ---

  ### III. Scorecard Against Existing Notions

  **1. Belief-Free Improvements (Qualitative Assumptions)**
  *   *Concept:* Assume isomorphic games are played isomorphically; remove dominated strategies.
  *   *Score:* Fails **Counterfactual Baseline**. It smuggles in a behavioral belief (isomorphism) to define the baseline, violating strict Agnosticism. It works only if the "qualitative assumptions" are accepted as definition rather than empirical premises.
  *   *Verdict:* Theoretically clean, but relies on the contested "isomorphism" axiom.

  **2. Cheap-Talk "Token" Rounds + Advance Commitments**
  *   *Concept:* Add a pre-play round where players commit to response functions.
  *   *Score:* Fails **Voluntary Participation**. If entering the token round is optional, refusing to commit signals an intent to play aggressively in $G$, often forcing the committers to concede. Fails **Unmediated Implementability** if commitments aren't cryptographically binding.
  *   *Verdict:* Robust to equilibrium selection within $G'$, but fragile to the meta-game of adoption.

  **3. Program Equilibrium (with Beliefs)**
  *   *Concept:* Agents submit code; code can read other code; agents maximize expected utility.
  *   *Score:* Fails **Equilibrium-Selection Agnosticism**. This framework relies entirely on common priors and Bayesian updating to select the equilibrium (e.g., via Löbian cooperation). It collapses if beliefs diverge. Fails **Ex-Post Dominance** (guarantees are usually in expectation).
  *   *Verdict:* Powerful for cooperation, but violates your core "safety" (certainty) constraint.

  **4. Compensation Test (Kaldor-Hicks)**
  *   *Concept:* $G'$ is better if winners *could* compensate losers and still gain.
  *   *Score:* Fails **Ex-Post Outcome Dominance** and **No Interpersonal Comparisons**. It allows actual losers provided hypothetical compensation exists. Requires cardinal utility for the calculation.
  *   *Verdict:* Standard welfare economics, but incompatible with your "strictly better for every player" safety constraint.

  ### Summary Recommendation
  If you require **Ex-Post Dominance** + **Equilibrium Agnosticism** + **Voluntary Participation**, the set of valid SPIs is likely empty for any non-trivial game. To proceed, you must relax **Counterfactual Baseline Definability**: accept that the baseline is a *function of the mechanism itself* (e.g., "the default is the unique Nash of $G$") rather than an empirical fact about the players. This moves the assumption from "empirical premise" to "definition of the improvement," which resolves the logical incoherence but limits the scope to games where the default is theoretically determinate.
