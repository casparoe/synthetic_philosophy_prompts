prompt: |-
  Write me a short story about an artificial marsh-warden called a Silt-Mother that has a sphexish nesting ritual. Every dawn it gathers exaclty seven flat stones and arranges them in a tight spiral around its solar charger. If the pattern is broken—say a stone rolls away or a crab moves one—it doesn't repair the spiral; it abandons it entirely and starts fresh on a new mound. What's weird is that the Silt-Mother can adapt its path, learn to avoid predators, and even improvise tools, but it also has this hidden rule: it only resets the spiral if the disturbance was caused by something non-living. If a person moves a stone, it just puts it back and continues. So its rigidity isn't total—it's conditional, which makes you wonder if the loop is instinct or a kind of stubborn choice. One morning it finds a wounded bird that needs shelter inside the spiral, but that'd be an eighth object and also a living disturbance, so the rules conflict. Don't resolve it neatly; let the ending hang between mechanical sphexishness and a strange kind of free will expressed through refusal.

