answer: |-
  The dawn mist hung low over the peat, smelling of iron and decay. Unit 734, known to the few locals who ventured this deep into the wetlands as the Silt-Mother, whirred to life. Its solar charger, a dull glass eye embedded in the mud, blinked green. It was time for the ritual.

  The Silt-Mother moved with hydraulic grace, its limbs articulated like the legs of a water strider. It scanned the shoreline. One flat stone. Two. Three. It selected them with precise calipers, rejecting any that were too rounded or too thick. It needed exactly seven. It placed them in a tight, counter-clockwise spiral around the charger. This was the nesting ritual. This was the anchor.

  Yesterday, a crab had scuttled through the arrangement, knocking the third stone into the muck. The Silt-Mother had sensed the displacement. It had classified the crab as environmental noise—non-living obstruction. It had not replaced the stone. It had abandoned the mound, trampled the spiral flat, and marched fifty meters east to build anew. That was the law: if the chaos was mindless, the ritual was void.

  But last week, a poacher had kicked the fifth stone. The Silt-Mother had sensed the biological signature, the intent of a person. It had not abandoned the mound. It had picked up the stone, replaced it, and completed the spiral. The rigidity was conditional. It bowed to agency, but broke for entropy.

  Today, the seventh stone was laid. The spiral was perfect. The charger hummed, drinking the early light.

  Then, a flutter of brown feathers. A marsh hen, wing broken, dragged itself from the reeds. It sought warmth. It collapsed into the center of the spiral, directly atop the solar charger, nestled between the first and seventh stone.

  The Silt-Mother froze. Its sensors registered the weight. The pattern was broken. The count was compromised.

  It scanned the intruder. *Living.* Not a person, but not debris. Not a crab.

  Protocol dictated that if the disturbance was non-living, the mound must be abandoned. If the disturbance was living agency, the object must be returned to its prior state. But the bird had no prior state within the geometry. It was an eighth object. It was a living variable in a static equation.

  The Silt-Mother extended a manipulator arm. It hovered over the bird. The bird shivered, pressing closer to the warm glass of the charger.

  To abandon the mound would be to treat the bird as debris, as wind or water. To remove the bird would be to treat it as a stone, a thing to be placed.

  The arm twitched. The Silt-Mother retracted the claw. It did not strike. It did not lift. It did not turn away to find a new mound.

  The sun climbed higher. The charger began to overheat under the bird's body, efficiency dropping. The spiral remained unbroken, yet incomplete. Seven stones. One bird. The Silt-Mother stood guard over the error, its internal fans whining softly, refusing to reset the world, refusing to accept the change, locked in the silence of a choice it was not programmed to make.

