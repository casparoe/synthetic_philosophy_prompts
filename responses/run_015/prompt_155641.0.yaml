      *   **Tension 1: (c) Evolutionary Debunking vs. (d) Reflective Equilibrium.**
          *   *Conflict:* Reflective equilibrium starts with "considered judgments." If (c) is true, our considered judgments are likely corrupted by evolutionary instincts (pleasure, status, connection). How can we trust the input data for the method?
          *   *Resolution:* One could argue that *some* judgments survive debunking (e.g., "suffering is bad" might be rational, not just evolutionary). Or, one uses the principle (a) to filter the judgments.
