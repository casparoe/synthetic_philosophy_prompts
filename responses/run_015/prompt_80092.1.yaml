prompt: |-
  I work in software and have basically zero philosophy background, so correct me if I'm framing this wrong. I recently went down a rabbit hole on this thing called the paradox of deontology, which I think goes something like this: deontological rules like "never kill an innocent person" are usually justified by their good consequences, since a world where people don't kill innocents is just a better world, but then in a specific case, breaking the rule would produce better consequences, and the same consequentialist reasoning that supported the rule in the first place seems to support breaking it right now. Anyway, I was in an online thread about this and kept making the objection that if the rule is justified by its consequences, why not break it when breaking it would be better, and someone kept shutting me down with "the end doesn't justify the means" like it setled things. I'm pretty sure that slogan is doing completely different work depending on how you read it. Could you lay out the different precise claims it could actually be making, from the trivial to the radical, and say which are platitudes, which are substantive and defensible, and which are actually false? And most importantly, tell me wich reading would actually support that dismissal — i.e. which reading can withstand the paradox I described instead of just waving it away. A list I can bring back to the thread would be perfect.
