  3.  **Analyze Question 2: Intentionality vs. Narrative Convention:**
      *   *Intentionality:* In philosophy of action, "agency" often requires intent. A volcano doesn't *intend* to cool the climate. A virus doesn't *intend* to kill. So, strictly speaking, they lack moral or rational agency.
      *   *Narrative Convention:* History is a story. Stories need protagonists and antagonists. Humans fit this; weather does not. It's easier to teach "Napoleon decided to invade Russia" than "The North Atlantic Oscillation contributed to supply line failures."
      *   *Nuance:* Newer fields (Environmental History, Big History) argue that "agency" shouldn't require intent. Bruno Latour's **Actor-Network Theory (ANT)** suggests non-humans *act* and modify outcomes, even without intent.
