  Your intuitions are remarkably consistent with a specific development in pragmatic theory known as **Impliciture** (coined by Kent Bach) or **Explicature** (in Relevance Theory). You are intuitively rejecting the strict Gricean binary (Said vs. Implicated) in favor of a tripartite distinction: **Semantic Content**, **Pragmatic Content (Impliciture)**, and **Implicature**.

  Here is the principle that unifies your verdicts, followed by the test case and the necessary revision to your current view.

  ### The Principle: Truth-Conditional Contribution

  **An inference counts as an *Implicature* only if it constitutes a *separate* proposition from the one explicitly expressed. If the inference is required to determine the truth-conditional content of the utterance itself (fleshing out, loosening, or enriching the semantic content), it is *Impliciture* (part of "what is meant," but not "implicated"). If the form is conventionalized, it is *Direct Meaning*.**

  Here is how this principle validates your six cases:

  1.  **"Some of the students passed" (Implicature):** The sentence "Some passed" is already truth-evaluable. The inference "Not all" is a *separate* proposition. You can cancel it ("in fact all did") without contradiction. **Verdict: Implicature.** (Matches your intuition).
  2.  **"You may bring a dog or a cat" (Impliciture):** In permission contexts, "A or B" is semantically incomplete regarding the combination. The inference "You may bring both" (Free Choice) is not a separate proposition; it is an enrichment of the permission itself. **Verdict: Impliciture/Direct.** (Matches your "no implicature" intuition).
  3.  **"I don't know whether it's raining" (Impliciture):** Similar to (2). The epistemic strengthening is part of determining *what* is not known, not a separate claim. **Verdict: Impliciture.** (Matches your intuition).
  4.  **"He's a doctor" (Implicature):** "He is a doctor" is truth-evaluable. The connection to your health is a *separate* proposition derived from Relevance. **Verdict: Implicature.** (Matches your intuition).
  5.  **"Can you pass the salt?" (Direct Meaning):** This is a standardized indirect speech act. The pragmatic work is lexicalized/conventionalized. We do not actively infer the request; we retrieve it directly. **Verdict: Direct.** (Matches your "not an implicature" intuition).
  6.  **"I passed" (meaning "I think I passed") (Impliciture):** The literal "I passed" is false. To make the utterance true (and cooperative), the content must be loosened to "I think I passed." This modification determines the truth conditions of the utterance. It is not a separate proposition. **Verdict: Impliciture.** (Matches your "not an implicature" intuition).

  ### The Test Case: "I'm not saying that he's guilty."

  Apply the **Truth-Conditional Contribution Principle** to this sentence.

  1.  **Semantic Content:** "I am not uttering the words 'he is guilty'." (Trivially true, but uninformative).
  2.  **Pragmatic Enrichment (Impliciture):** To be cooperative, "saying" must be enriched to "asserting" or "committing to." The proposition expressed becomes: *"I am not asserting that he is guilty."* This is **Impliciture**. It is part of the truth-conditional content, not an implicature.
  3.  **Pragmatic Inference (Implicature):** Why would someone deny an assertion unless they had a reason to suspect it? The hearer infers a separate proposition: *"I suspect he is guilty, but I lack proof/wish to deny responsibility."* This is **Implicature**.

  **Verdict:** This case is a **hybrid**. It involves *both* Impliciture (modifying "saying" to "asserting") and Implicature (suggesting guilt).

  ### The Forced Drop

  This principle forces you to drop (or strictly revise) your verdict on **Case (6)** regarding the label **"What's said."**

  You wrote: *"What's said is 'I passed,' but what they mean is 'I think I passed,' and I don't call that an implicature."*

  Under the **Truth-Conditional Contribution Principle**, you cannot maintain that "What's said" is the literal "I passed" if you also claim the adjustment to "I think" is *not* an implicature.
  *   If it is **not an implicature**, it contributes to the truth conditions.
  *   If it contributes to the truth conditions, it is part of the **Pragmatic Content (Explicature/Impliciture)**.
  *   In pragmatic theory, the "What is said" that matters for truth-evaluation is the *Pragmatic Content*, not the *Semantic Content*.

  **The Revision:** You must drop the claim that *"What's said is 'I passed'."* Instead, you must say: *"The **semantic content** is 'I passed,' but the **pragmatic content (what is said*)** is 'I think I passed'."*

  If you keep "What's said is 'I passed'," you are forced to classify "I think I passed" as an **Implicature** (because it's part of "what is meant" but not "what is said"). But you explicitly rejected that. To remain consistent with your intuition that it is *not* an implicature, you must admit it is part of the "said" content (broadly construed).

  **Summary:** Your gut is tracking the **Impliciture** distinction perfectly. The only adjustment required is to acknowledge that when pragmatic work is done to make an utterance truth-evaluable (like Case 6 or the "saying" in the test case), that work becomes part of "what is said" (pragmatically), not merely "what is meant."
