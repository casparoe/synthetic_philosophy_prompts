answer: |-
  Your tutor is weaponizing a famous phrase from Bernard Williams (*Persons, Character and Morality*, 1981), but they are stretching it. Williams used it to describe a specific failure of *justification*, but your tutor is using it to describe a failure of *method*.

  To treat the phrase like "loose change," we need to flip it over and look at the different faces it presents. Here is the menu of precise theses the phrase could be expressing, evaluated for truth-value and applicability to your two cases (the burning building vs. Effective Altruism).

  ### 1. The Psychological Spontaneity Thesis
  *   **The Claim:** Moral action in intimate contexts requires immediate, non-deliberative impulse. Pausing to calculate breaks the psychological state required for love or courage.
  *   **Verdict:** **Platitude (in emergencies) / False (in general).**
      *   It is a platitude that you cannot calculate while your house burns down; you will die.
      *   It is false that calculation *always* kills motivation. Sometimes understanding *why* something is right strengthens the resolve to do it.
  *   **Applicability:**
      *   **Burning Child:** **Fits.** Time is short; hesitation is fatal.
      *   **Effective Altruism:** **Fails.** EA calculations happen on a couch, months before donation. There is no psychological "flow state" of charity that is broken by a spreadsheet.
  *   **Tutor's Usage:** If your tutor uses this reading to dismiss EA, they are making a category error. EA is not an emergency rescue; it is resource allocation.

  ### 2. The Normative Exclusion Thesis
  *   **The Claim:** There are certain domains of life (like family) where impartial moral reasons are *excluded* from deliberation. You are not just permitted to ignore the calculus; you are obligated to ignore it. To weigh the "greater good" against your child is to misunderstand the rules of the game.
  *   **Verdict:** **Defensible.**
      *   This is a standard anti-utilitarian position (Partialism). It argues that morality does not occupy all logical space.
  *   **Applicability:**
      *   **Burning Child:** **Fits.** The reason "she is my child" silences the reason "five strangers."
      *   **Effective Altruism:** **Partial Fit.** This thesis supports the idea that you don't *owe* everything to strangers. However, EA argues that once you step *outside* the family sphere (into disposable income), the exclusion zone ends. This thesis doesn't necessarily ban EA math; it just bans it from overriding family needs.
  *   **Tutor's Usage:** This supports the parental case well, but only weakly attacks EA unless the tutor argues that *all* spending is part of the "family exclusion zone."

  ### 3. The Metaphysical Integrity Thesis
  *   **The Claim:** Your personal projects and relationships constitute your "self." To step back and evaluate them from an impartial, external viewpoint is to alienate yourself from your own life. It is a form of self-betrayal.
  *   **Verdict:** **Defensible.**
      *   This is Williams' actual view. He argues that if morality requires you to abandon your "ground projects" to maximize utility, it attacks your integrity.
  *   **Applicability:**
      *   **Burning Child:** **Fits.** Saving the wife *because* she is your wife is an expression of who you are. Saving her *because* it maximizes utility makes you a vessel for utility, not a husband.
      *   **Effective Altruism:** **Weak Fit.** Donating to malaria nets rarely threatens your core identity or "ground projects" in the way abandoning a spouse does. EA asks for money, not usually your soul.
  *   **Tutor's Usage:** Using this against EA is a stretch. It implies that calculating donations is an existential threat to the donor's identity, which is melodramatic.

  ### 4. The Character Corruption Thesis
  *   **The Claim:** The *habit* of subjecting moral decisions to impersonal calculation corrodes the virtues required to be a good human. It turns the agent into a bureaucrat of value rather than a participant in life.
  *   **Verdict:** **Defensible.**
      *   This is a Virtue Ethics critique. It suggests that even if the calculation yields the "right" answer, the *process* makes you colder, less empathetic, and morally grotesque.
  *   **Applicability:**
      *   **Burning Child:** **Fits.** A father who calculates is cold.
      *   **Effective Altruism:** **Fits.** An altruist who calculates is (allegedly) cold.
  *   **Tutor's Usage:** **This is the only reading that bridges both cases.**

  ---

  ### The Verdict: Which Reading Supports the Tutor?

  If your tutor wants to use "one thought too many" to dismiss **both** the parental rescue calculation **and** Effective Altruism generally, they must be relying on **The Character Corruption Thesis** (Thesis 4), potentially bolstered by **The Normative Exclusion Thesis** (Thesis 2).

  Here is why:
  1.  **Psychological Spontaneity** fails because EA isn't urgent.
  2.  **Metaphysical Integrity** fails because EA doesn't usually destroy identity.
  3.  **Character Corruption** succeeds because it attacks the *disposition* to calculate.

  **The Argument Your Tutor is Making:**
  They are arguing that the *disposition* to run utilitarian maths is a vice, regardless of the context.
  *   In the **burning building**, the calculation reveals a lack of love.
  *   In **Effective Altruism**, the calculation reveals a lack of *humanity* (or an over-reliance on "the moral point of view").

  They are claiming that by making calculation your default mode of moral engagement, you have "already messed up" your character, even if your math is right.

  ### Is This Defensible?

  **It is Defensible, but Controversial.**
  *   **Strength:** It captures the intuition that a world where everyone constantly calculated utility would be sterile and unloving. It protects the "specialness" of personal relationships.
  *   **Weakness:** It risks sanctifying ignorance. If I can save 100 lives instead of 1 by checking a chart, and I refuse to check the chart because "calculation corrupts character," am I virtuous? Or just self-indulgent?

  ### How to Push Back in Tutorial

  If you want to challenge the tutor, do not attack Williams. Attack the **scope** of the Character Corruption Thesis.

  **Say this:**
  > "If 'one thought too many' is a claim about character corruption, it works for the burning building because the calculation displaces love. But in Effective Altruism, the calculation *is* the expression of care for strangers. If I refuse to calculate, aren't I prioritizing my own 'warm glow' over actual lives saved? Does the 'one thought too many' critique apply when the calculation is the only way to ensure the help is real?"

  This forces them to admit that the phrase works for **relationships** (where calculation is alienating) but might not work for **resource allocation** (where calculation is necessary for efficacy). If they insist it applies to both, they are arguing that *all* moral reasoning should be intuitive, which is a much harder position to defend.
