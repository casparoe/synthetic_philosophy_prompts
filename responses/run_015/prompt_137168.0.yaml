answer: |-
  This is a remarkably sharp intuition. You are correct: an incremental build system is essentially an engineered, constrained solution to a specific instance of the Frame Problem. You have built a machine that decides what *didn't* change so you don't have to recompute it.

  Here is the translation of the three phases of the Frame Problem into your vocabulary of dependency graphs, dirty bits, and build rules, followed by an analysis of your "cheat."

  ---

  ### 1. The Logical Frame Problem (McCarthy & Hayes, 1969)
  **The Philosophy:** In situation calculus, if I perform action $A$ (e.g., "paint block red"), how do I represent that $A$ changes the color *without* having to write explicit axioms for everything $A$ does *not* change (e.g., "painting block red does not change the block's location," "...does not change the time," "...does not change the shape")? The number of "frame axioms" (non-effects) explodes combinatorially.

  **The Build Translation:**
  *   **Clean Mapping:** **Dependency Edges as Causal Laws.**
      In your system, the dependency graph *is* the solution to the frame axioms. If `foo.o` depends on `foo.c`, the rule says "if `foo.c` changes, `foo.o` is dirty." Crucially, the *absence* of an edge is the frame axiom. You do not need to state `foo.o` does *not* depend on `bar.c`. The graph topology implicitly asserts that all unlisted relationships are null. Propagating the "dirty bit" is the algorithmic equivalent of solving the frame problem: you compute the transitive closure of change, and everything outside that closure is assumed persistent (clean).
  *   **The Fudge:** **Implicit Dependencies.**
      The logical frame problem assumes you know the predicates. In builds, you often don't. If `foo.c` includes `header.h`, but your dependency scanner missed it, you have a missing frame axiom. The system assumes `foo.o` is clean when it should be dirty. This is the "soundness" failure. You fudge this by over-approximating (e.g., "if any header in this directory changes, rebuild everything"), which is logically safe but computationally expensive (reintroducing the cost the frame problem was meant to avoid).
  *   **No Counterpart:** **The Qualification Problem.**
      Closely related to Frame, but distinct. This is the problem of listing all preconditions for an action to succeed (e.g., "painting works unless the block is glued, unless it's wet, unless gravity is off"). Build systems mostly ignore this. `gcc` might fail because the disk is full, but the dependency graph doesn't model "disk space" as a node. The graph assumes the action *can* happen if inputs are dirty.

  ### 2. The Semantic/Relevance Frame Problem (Fodor, 1983/2000)
  **The Philosophy:** Fodor argued this isn't just a logic puzzle; it's a cognitive one. How does a mind determine which of its beliefs are relevant to a current action without checking *all* of them? Belief fixation is "Quinean" (holistic) and "isotropic" (any fact could potentially be relevant to any other). There is no local syntax that guarantees semantic relevance.

  **The Build Translation:**
  *   **Clean Mapping:** **The Full Rebuild as the Oracle.**
      Fodor suggests there is no computable way to filter relevance perfectly without accessing the whole web of belief. In your terms, the only way to be 100% sure the output is correct without a perfect dependency graph is a "clean build" (`rm -rf && build`). The clean build is the holistic check. The incremental build is the heuristic attempt to avoid the cost of the holistic check.
  *   **The Fudge:** **Modularity Assumptions.**
      Build systems enforce modularity (files, targets, packages). Fodor's point is that cognition *isn't* modular. In code, we pretend it is. We say "this library is an opaque dependency." But if a macro in that library changes behavior based on a global define in *your* code, the modularity boundary leaks. You fudge this by treating the "API surface" as the dependency boundary, hoping semantic relevance doesn't leak through implementation details.
  *   **No Counterpart:** **Semantic Irrelevance.**
      This is the big one. In a build system, *any* byte change is a change. If you change a comment, or a variable name that doesn't escape the compilation unit, the hash changes, the dirty bit propagates, and you rebuild. The build system cannot distinguish between a syntactic change and a semantic change. Fodor's problem is about filtering out *semantically* irrelevant facts. Your system treats all syntactic differences as causally potent. You cannot say "this change doesn't matter" without executing the build (checking the output), which defeats the purpose of incrementalism.

  ### 3. The Embodied/Computational Frame Problem (Dreyfus, Wheeler, et al.)
  **The Philosophy:** A bounded agent in real-time must interact with an open environment. It cannot model the whole world. It must cope with noise, unexpected side effects, and a clock that keeps ticking. The problem isn't representation; it's coping with an unbounded context while acting.

  **The Build Translation:**
  *   **Clean Mapping:** **File Watchers and CI/CD.**
      A daemon watching `inotify` events to trigger rebuilds is an embedded agent. It has a clock (latency matters) and a partial view (it only sees the filesystem, not the network state or the developer's intent).
  *   **The Fudge:** **Stopping the World.**
      Build systems cheat by freezing the environment. When `make` runs, it assumes the filesystem is static (or strictly versioned). An embodied agent cannot stop the world. If you are building while `git pull` is happening, or while a generated file is being written by another process, your "dirty bits" race. You fudge this with locks and atomic swaps, trying to simulate a static world inside a dynamic one.
  *   **No Counterpart:** **Stakes and Survival.**
      For an embodied agent, a wrong inference (ignoring a relevant frame) can be fatal. For a build system, a wrong inference is merely "binary is stale." The pressure to solve the frame problem in AI is existential; in builds, it's engineering economics. You can afford to be imprecise (over-rebuild) in a way a robot navigating a cliff cannot.

  ---

  ### Synthesis: Addressing Your Hypotheses

  #### 1. Is the Frame Problem just the Holism Problem in a costume?
  **In builds: Yes. In Philosophy: No.**
  In your domain, holism *is* the enemy. You fight it with encapsulation. You define interfaces (headers, APIs) to create cut-points in the dependency graph. If the system were truly holistic (every byte depends on every other byte), your graph would be a clique, and incremental builds would be impossible.
  However, philosophers argue holism is a feature of *meaning*, not just causality. In builds, you successfully argue that *causality* is local (mostly). You solved the Frame Problem by denying Holism. You asserted: "The world is not holistic; it is a DAG." That is a massive ontological claim that happens to be true enough for C++ compilation.

  #### 2. Is there something in "Relevance" dependency graphs cannot say?
  **Yes: Semantic Equivalence.**
  Your graph tracks *provenance*, not *content semantics*.
  *   **Dependency Graph:** "Input A changed hash, therefore Output B is invalid."
  *   **Relevance:** "Input A changed, but the change is a comment, therefore Output B is semantically identical."
  There is a class of "irrelevant changes" that your system cannot detect without running the tool (the "action"). This is why tools like `ccache` or content-addressed caches (Bazel/Gradle) are a step closer to solving the relevance problem: they check if the *output* would change, not just if the *input* changed. But even that is syntactic equivalence of output, not semantic equivalence of behavior.

  #### 3. Does the "From-Scratch Build" have an analogue?
  **This is the critical disanalogy.**
  In your world, the "from-scratch build" is the **Ground Truth Oracle**. It is the reality check. You can always `rm -rf` and see what *actually* happens.
  In the philosophical Frame Problem, **there is no from-scratch build.**
  The human mind (or AI) *is* the build system. There is no "God's eye view" of reality it can compare itself against. It cannot step outside its own dependency graph to check if the graph is correct.
  *   **You:** Can verify soundness by comparing incremental output vs. clean output.
  *   **Agent:** Must trust its relevance heuristic because it has no access to the "clean build" of reality.

  ### The Verdict on Your "Cheat"

  You wrote: *"We make the world hermetic, enumerate every input, treat anything untracked as nonexistent, and we happily recompute more than strictly necessary because sound over-approximation is cheap next to a wrong answer."*

  This is exactly right. You solved the Frame Problem by **closing the world**.
  1.  **Hermeticism:** You defined the universe (the sandbox). Anything outside `/src` does not exist.
  2.  **Enumeration:** You forced explicit declaration of dependencies (or used scanners to make them explicit).
  3.  **Over-approximation:** You accept false positives (rebuilding when clean) to avoid false negatives (not rebuilding when dirty).

  **Is the Frame Problem just Holism in a costume?**
  No. The Frame Problem is about **persistence**. Holism is about **interconnectedness**.
  Your system solves Persistence by assuming things persist unless an edge says otherwise (the default clean bit).
  Your system solves Holism by asserting modularity (the DAG structure).

  **What the philosophers mean by Relevance that you don't:**
  They mean **Contextual Salience**.
  In a build, `#include <stdio.h>` is always relevant if you call `printf`.
  In cognition, `stdio.h` might be irrelevant if you are currently running away from a tiger, even if you are holding a C book. The "build rule" for your brain changes based on the global state (fear), not just the local inputs (book).
  Your dependency graphs are static (or slowly changing). The "dependency graph" of a cognitive agent is rewired by the context of the action itself.

  **Summary:**
  You have engineered a Frame Problem solver for a micro-universe where you are God. You defined the physics (rules), the ontology (files), and the truth condition (clean build). The philosophers are stuck in a universe where they are merely residents, the physics are unknown, and there is no clean build to check against. You solved it by fiat; they are trying to solve it by inference.
