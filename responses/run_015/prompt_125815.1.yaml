answer: |-
  **The Case**

  Mara sits beside her mentor, Elias, whose dementia occasionally recedes to grant him moments of lucidity. Today, Elias presents a philosophical proof he believes is his magnum opus, beaming with the pride of his former intellect. Mara, a competent philosopher, sees immediately that the proof relies on an elementary category error; it is logically vacuous and intellectually unimpressive. Yet, years ago, Mara promised Elias's wife that she would sustain his dignity in these final months by engaging with his work as if it were vital, specifically to spare him the despair of recognizing his decline. The promise was not merely to offer polite praise, but to validate his sense of worth, a demand that binds her internal response as much as her external speech. As Elias waits for her reaction, Mara feels the pull of the promise against the silence of her genuine judgment.

  **Analysis**

  The attitude in question is **intellectual admiration** (finding the proof impressive). This attitude qualifies as recalcitrant because it is a perceptual-like response to perceived merit; one cannot simply decide to find a fallacious argument impressive any more than one can decide to find a sour lemon sweet. The right-kind reason is absent and undefeated: the proof lacks the intellectual merit required to make admiration fitting. The wrong-kind reason is present and moral: the solemn promise to Elias's wife generates a duty of care that counts in favor of holding the attitude.

  A **fitting-attitude (FA) theorist** argues that reasons for attitudes must bear on their fittingness. Since the proof is meritless, admiration is unfitting. Consequently, the moral promise cannot generate a reason to *admire*; it can only generate a reason to *act* as if one admires or to wish one did. The verdict is that Mara has no reason to admire the proof. An **inclusive theorist** argues that any consideration counting in favor of an attitude is a reason for it. The promise counts in favor of Mara admiring Elias (it would be good, morally, if she did). Therefore, the verdict is that Mara *does* have a reason to admire the proof, and the distinction between right and wrong kinds marks nothing real.

  The standard reply—that the demon (or here, the promise) gives a reason to *bring it about* that one has the attitude, not to have it—fails here. First, the moral demand is **occurrent**: the promise binds Mara's response *now*, while Elias is lucid and waiting. Indirect cultivation (reading his past work, arranging a supportive environment) is a long-term project that misses the particular occasion required by the duty. Second, because admiration is recalcitrant, "bringing it about" in the moment is impossible; if the duty is to validate his *sense of worth*, mere pretense may fail if detected, requiring the genuine attitude. Thus, the relocation strategy cannot dissolve the tension: we are left with a moral reason that bears directly on an attitude that cannot be willed.

  The single feature doing the work is the **occurrent moral demand on a recalcitrant state**. If we substitute a controllable attitude, such as *asserting* admiration, the standard reply succeeds effortlessly (the reason is to assert, not to feel). If we substitute the promise with a cash bet, the normative pressure becomes merely prudential, making it easier to dismiss as external to the attitude's normativity. With the feature intact, the **inclusive view** looks worse. Its strongest objection is that it collapses the normative distinction between *merit* and *compliance*. By counting the promise as a reason to admire, the inclusive theorist implies that the proof becomes admirable *because* Mara promised to admire it. This severs the essential link between admiration and object-quality, rendering the concept of 'intellectual value' unintelligible; if moral duty can make a fallacious proof admirable, then admiration no longer tracks truth or merit, but merely obligation.
