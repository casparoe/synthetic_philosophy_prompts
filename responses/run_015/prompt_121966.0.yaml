  The existence of sustained bidding in the absence of financial penalty gives rise to what researchers have termed the zero-sunk-cost escalation curve. This concept describes a trajectory where commitment levels rise in correlation with competitive intensity rather than accumulated loss. In a standard sunk-cost model, the motivation to continue is anchored to the magnitude of past investments, and as the investment grows, the reluctance to quit increases. Conversely, the zero-sunk-cost escalation curve demonstrates that the psychological momentum of the auction itself can generate commitment independent of financial anchoring. When bidders know they can walk away without penalty but choose to stay in the game, their behavior is likely driven by competitive arousal, the quasi-endowment effect where they feel ownership of the prize once they become the highest bidder, or a non-linear utility function regarding winning versus losing. The auction frame transforms the interaction from a financial calculation into a contest of wills, where the utility of defeating an opponent outweighs the financial rationality of the prize value.

  Consequently, this phenomenon significantly undermines the identification of auction escalation with ordinary sunk-cost reasoning. If escalation were merely the sunk-cost fallacy operating inside an auction frame, removing the sunk cost should theoretically neutralize the irrational behavior, causing bidders to drop out immediately once the price exceeds the value. The fact that they do not indicates that the auction frame triggers a distinct psychological mode that ordinary sunk-cost reasoning does not fully capture. Ordinary sunk-cost reasoning relies on the error of considering irrecoverable past costs in future decision-making. In the waived-obligation variant, there are no irrecoverable past costs to consider, yet the error persists. This implies that escalation of commitment is a broader behavioral syndrome that includes sunk-cost sensitivity as one subset but also encompasses competitive irrationality, face-saving, and the emotional valuation of victory. Therefore, while the standard dollar auction effectively demonstrates the sunk-cost fallacy, relying on it as the exclusive model for escalation ignores the robust evidence that humans will escalate commitment even when the ledger is clean, driven by the heat of competition rather than the weight of past debt.

