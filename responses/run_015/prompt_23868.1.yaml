answer: |-
  **Project Title:** The Moral Neutrality of the Supernatural: A Logical Gap in Sidgwick's Resolution of the Dualism of Practical Reason

  **Project Summary**
  This project investigates a structural discontinuity in Henry Sidgwick's later philosophical trajectory. In the Concluding Chapter of *The Methods of Ethics*, Sidgwick argues that the "dualism of practical reason"—the conflict between rational egoism and utilitarian morality—can only be resolved if the universe is under a "moral government" ensuring the ultimate coincidence of virtue and self-interest. He identifies two paths to validate this: relaxing epistemic standards akin to natural science, or adopting a theistic postulate supported by empirical evidence. Sidgwick subsequently devoted significant energy to the Society for Psychical Research (SPR), seeking evidence of telepathy and survival. This project asks a precise, determinate question: **Does empirical evidence of psychical phenomena (survival of death, telepathy) logically entail the existence of a moral government of the universe required to resolve Sidgwick's ethical dualism?**

  I argue that it does not. The project posits that Sidgwick's psychical research was category-mistaken regarding the specific needs of his ethical system. Even if successful, the SPR could only establish the existence of non-physical agencies, not their moral benevolence or judicial character. A universe containing ghosts or telepathic channels is not necessarily a universe where duty and interest coincide. By isolating this logical gap, the project challenges the prevailing view that Sidgwick's turn to psychical research was a coherent extension of his philosophical rigor.

  **Context and Intervention**
  Existing scholarship on Sidgwick's relationship with psychical research generally falls into two camps, both of which overlook the specific logical gap identified above.

  The first reading treats Sidgwick's involvement with the SPR as continuous with his philosophical and scientific rigor. Proponents argue that Sidgwick applied the same empirical standards to the supernatural that he applied to ethics, viewing psychical research as a legitimate expansion of the "indispensable assumptions" of science. While this restores intellectual dignity to Sidgwick's later years, it assumes without proof that the *content* of psychical evidence serves the *function* required by the *Methods*. It conflates evidence of the *anomalous* with evidence of the *moral*.

  The second reading treats the psychical research as a separate, largely biographical episode, often attributed to personal grief, religious anxiety, or a crisis of faith. This approach contextualizes Sidgwick's motivation but dismisses the philosophical stakes. By framing the SPR work as a psychological coping mechanism rather than a philosophical argument, this reading fails to analyze whether the evidence sought could theoretically support the ethical premise.

  Both readings leave the structural question unaddressed: Was the specific evidence Sidgwick sought capable of doing the specific work his ethics required? This project moves beyond biographical sympathy or defensive rationalization to analyze the entailment relation between Sidgwick's metaphysical hopes and his ethical necessities.

  **Methodology and Work Plan**
  The fellowship will support three months of intensive archival and textual analysis, culminating in a draft article of approximately 8,000 words.

  *Month 1: Textual Reconstruction.* I will compile a comprehensive corpus of Sidgwick's writings on the dualism of practical reason (primarily the Concluding Chapter of *The Methods of Ethics* and relevant correspondence) alongside his SPR reports and presidential addresses. The goal is to map the exact definition of "moral government" required by the ethics against the specific types of evidence (e.g., cross-correspondences, deathbed visions) pursued by the SPR. I will focus on whether Sidgwick explicitly argued that psychical phenomena imply benevolence, or if he assumed this link implicitly.

  *Month 2: Logical Analysis and Argument Development.* I will construct the formal argument regarding the gap between metaphysical survival and moral coherence. This involves analyzing the logical neutrality of psychical phenomena: telepathy proves communication, not justice; survival proves continuity, not reward. I will test this against Sidgwick's broader theological writings to see if he relied on external theological premises to bridge this gap, or if he believed the psychical evidence stood alone. This month will also involve drafting the core sections of the article.

  *Month 3: Synthesis and Refinement.* The final month will be dedicated to integrating the textual and logical analysis, addressing potential counter-arguments (e.g., that Sidgwick viewed psychical research as merely removing materialist barriers to faith, rather than proving faith directly), and finalizing the manuscript. I will also prepare the abstract and bibliography for submission to a leading journal in history of philosophy.

  **Position and Significance**
  I take the position that the gap is genuine and fatal to Sidgwick's project as conceived. Sidgwick lacked the resources to close it because the SPR's methodology was descriptive (what exists?) while the ethical requirement was normative (what is good?). Unless Sidgwick smuggled in independent theological assumptions about the nature of the spirits contacted, the psychical data remains morally inert. Establishing this demonstrates that Sidgwick's attempt to empiricize the theistic postulate was not just unsuccessful in practice, as he admitted, but incoherent in principle. This reframes the end of Sidgwick's career not as a tragic failure of evidence, but as a systematic category error.

  **Conditions for Project Failure**
  Intellectual honesty requires specifying what would count as this project failing. The project would fail if archival research reveals that Sidgwick explicitly distinguished between "evidence of survival" and "evidence of moral government" in his private correspondence, indicating he viewed psychical research only as a preliminary step toward a broader theological argument he never published. Similarly, if I find that Sidgwick defined "moral government" in a purely mechanistic sense (e.g., mere causal continuity of consciousness) rather than a retributive or harmonizing sense, my claim that he needed a *moral* guarantee would be undermined. If Sidgwick's requirement for the resolution of dualism was weaker than the standard interpretation suggests, the gap I identify may not be fatal to his actual system, only to the reconstructed version I am critiquing. In either case, the fellowship will yield a definitive clarification of Sidgwick's final philosophical position, even if it contradicts my initial hypothesis.
