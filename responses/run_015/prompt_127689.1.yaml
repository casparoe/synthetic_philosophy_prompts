answer: |-
  The session succeeds if everyone agrees that rationality is about picking the decision-rule that wins across the scenarios you *could* have been in, not just the action that wins in the scenario you *are* in.

  ### 1. The Order of Pieces
  Your instinct is correct: **Ex-Ante Perspective → Prediction Fixedness → Case Contrast.** If you introduce the Mugging before establishing the "view from behind the veil of ignorance," the Maths Teacher will lock onto the *ex-post* loss and you'll never recover.

  1.  **The Ex-Ante Shift (5 mins):** Establish that we are scoring *policies*, not *moves*. Use a trivial example (e.g., "Would you take a pill that makes you enjoy exercising?") to show that changing your disposition now changes outcomes later, even if the "choice" feels fixed.
  2.  **The Prediction Constraint (5 mins):** Clarify that the predictor is 70% accurate *based on how you reason right now*, not just past history. This prevents the "past is fixed" objection from killing the Blackmail case later.
  3.  **Case 1: The Mugging (10 mins):** Walk through the payoff. Let the CDT intuition ("money gone") speak, then override it with the Ex-Ante view ("I want to be the person who gets the £100").
  4.  **Case 2: The Blackmail (10 mins):** Same stranger, same accuracy. Walk through the payoff. Let the EDT intuition ("correlation means pay") speak, then override it with the Ex-Ante view ("I want to be the person who never gets the letter").
  5.  **The Contrast & Dial (10 mins):** Put them side-by-side. Run the accuracy dial test.
  6.  **Close (5 mins):** Summarize the structural difference (creating value vs. inviting loss).

  ### 2. The Core Matched Pair
  **The Case:** "The Reasoning Stranger."
  *   **Setup:** You meet a shrewd stranger once. He simulates your reasoning process with 70% accuracy. He cannot talk to you before the decision, only observe your type.
  *   **Case A (Mugging):** He flips a coin. If Tails, he asks you for £10. If Heads, he gives you £100 *if and only if* his simulation predicted you would give the £10 on Tails. (You are currently on Tails).
  *   **Case B (Blackmail):** He has damaging info (cost £1000). He sends the letter *if and only if* his simulation predicts you will pay £100 upon receipt. (You have just received the letter).
  *   **Constraints Check:**
      *   **Must Have:** Identical stakes (£100 vs £100/£1000), identical predictor accuracy, identical stranger.
      *   **Must Lack:** No reputation (one-shot), no precommitment device (you are deciding *now*), no repetition.
      *   **Damage Warning:** The "70% shrewd human" constraint **damages the Blackmail case**. If the predictor is merely statistical, CDT agents will say the letter is already in the post. You must phrase the prediction as "based on how you reason *in this moment*" to preserve the logical link required for the "Don't Pay" verdict. If you frame it as "based on your past behavior," the Blackmail case collapses into standard threat response.

  ### 3. The Misconception Map
  Address these in this order, or the room will fracture.

  1.  **"The money/info is already gone/fixed."**
      *   *When:* Immediately after stating Case 1.
      *   *Line:* "We aren't asking how to fix this specific instance, we're asking which algorithm you want running in your head for all instances like it."
  2.  **"This is just about precommitment."**
      *   *When:* After the first vote on Case 1.
      *   *Line:* "You have no time machine; you cannot precommit, you can only decide what kind of agent you are right now."
  3.  **"70% accuracy makes CDT right."**
      *   *When:* During the Blackmail setup.
      *   *Line:* "Even at 70%, your decision is the strongest evidence available for what was predicted; ignoring that evidence leaves money on the table."
  4.  **"Mugging is just Open Newcomb."**
      *   *When:* The LW veterans speak up.
      *   *Line:* "In Newcomb the box is full or empty; here, the coin flip determines whether the reward opportunity exists at all."
  5.  **"Non-payers never see the letter."**
      *   *When:* During Case 2 voting.
      *   *Line:* "Exactly, which is why paying is the mistake—you are paying to be the sort of person who gets blackmailed."
  6.  **"I know the verdicts (Pay/Don't Pay)."**
      *   *When:* The LW veterans try to close the debate early.
      *   *Line:* "The verdict is easy; the structural reason why they differ is the hard part I need you to solve."

  ### 4. The Check at the End
  **The Case:** "The Noisy Signal."
  Keep the Blackmail setup, but add a dial: **Predictor Accuracy.**
  Ask: "At what accuracy percentage do you switch from 'Don't Pay' to 'Pay'?"

  *   **Pattern that means they got it:** They say "Never" or "Only if accuracy is below 50% (random guessing)." They understand that in Blackmail, the decision *controls* the prediction, so high accuracy makes paying *worse*, not better. In Mugging, they should say "Around 10%" (where EV turns positive).
  *   **Pattern that means they're pattern-matching:** They give the same threshold for both cases (e.g., "I pay if accuracy is over 80%"). This shows they treat both as standard risk calculations rather than structural dependencies.

  ### 5. What to Refuse to Explain
  Do not explain Functional Decision Theory (FDT), Updateless Decision Theory (UDT), logical counterfactuals, or the metaphysics of "you are your algorithm." Do not argue whether perfect prediction is physically possible.

  **How to say it:**
  "We are doing phenomenology of choice, not engine repair. I'm asking you to inspect the dashboard of your decision process, not to build the engine underneath. Whether the predictor is magic or physics doesn't change the structure of the choice you face."
