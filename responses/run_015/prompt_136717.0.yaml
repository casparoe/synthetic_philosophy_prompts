  **Verdict:** Right but early

  **Two Competing Rules:**
  1.  **Mechanism-Preservation Regardless of Timing:** A theory is vindicated if the underlying causal driver (e.g., resource curves, population pressure) materializes as predicted, even if the terminal event (e.g., collapse, migration) is delayed or modified by systemic adaptations (like demographic transitions).
  2.  **Predictive Accuracy Plus Independently Testable Auxiliaries:** A theory is falsified if the specific predicted outcome fails to occur by the deadline, unless the deviation is explained by factors that were either independently predicted or structurally integral to the model, rather than treated as external exceptions (like synthetic fertilizer or adjusted parameters).

  **Further Case to Separate Them:**
  A 2035 epidemiological model projecting one million deaths from a specific pathogen based on viral replication rates. By 2035, the viral replication rates track the model exactly (mechanism preserved), but total deaths remain near zero due to an unmodeled, rapidly deployed therapeutic drug (outcome failed due to exogenous intervention).
  *   *Under Rule 1:* Verdict is **Right but early** (the biological mechanism was correctly identified; the human response merely delayed the mortality peak).
  *   *Under Rule 2:* Verdict is **Falsified** (the specific prediction of deaths was wrong, and the drug counts as an ad hoc rescue similar to the synthetic fertilizer case).

  **Principle Adopted if Ruling Against Best Guess:**
  If the historian rules **Falsified** (against the "Right but early" guess), she is adopting the principle that **exogenous interventions function as falsifying anomalies**. This treats policy interventions not as structural evolutions comparable to the Malthusian demographic transition, but as external "cheats" comparable to the synthetic fertilizer exception. It prioritizes **outcome fidelity** over **causal diagnosis**, asserting that a theory claiming to predict social-ecological dynamics fails if it cannot account for the political mechanisms that ultimately govern the resource-human interface.
