answer: |-
  Here is a structural plan for the lecture, designed to navigate the specific epistemic traps your students have set for themselves.

  ### 1. The Opening: Dependency Structure and Minute Zero

  **Decision:** Do **not** state the strong claim ("Categorization *is* Analogy") as a fact at minute zero. Do not withhold it entirely either.
  **Board at Minute Zero:** Write the equation: **Categorization = Analogy?** Leave the question mark large.

  **The Dependency Structure:**
  You cannot state the strong claim until you have dismantled their implicit model of "features." CS students operate on a model where objects have fixed feature vectors, and categorization is a distance metric in that space. If you state the thesis before breaking this model, they will hear "Categorization is Analogy" as "Categorization is Nearest Neighbor," which is the weak/trivial interpretation you want to avoid.

  **Sequence of Dependencies:**
  1.  **Feature Salience is Context-Dependent:** You must establish that *which* features matter is not pre-defined. (e.g., A "chihuahua" and a "wolf" are close in DNA space, but a "chihuahua" and a "mouse" might be closer in "pet" space).
  2.  **Retrieval is Triggered by Slippage:** You must show that we recognize things not by matching a prototype, but by recalling specific past instances where a similar *tension* existed.
  3.  **Essence vs. Surface:** You must distinguish between properties that are mutable (surface) and structural relations that are invariant (essence).

  **What Breaks if You Reorder:**
  *   If you define **Essence** before **Features**, they will treat "Essence" as just "High-Weight Features." You need them to feel the *instability* of features first.
  *   If you state the **Strong Claim** before **Slippage**, they will assume you mean "Perfect Matching." The strong claim only holds if the mapping is imperfect but structurally sound.
  *   **Minute Zero Strategy:** Point to the board. Say: "By the end of this hour, I want you to either defend the 'yes' or the 'no'. But you cannot use your current definitions of either term." This licenses you to redefine "Analogy" not as $A:B::C:D$, but as "the activation of a category via retrieval of a prior instance."

  ### 2. The Carrying Example

  **Your Constraints (Corrected & Expanded):**
  1.  **Load-Bearing:** The analogy must be required to operate the system, not just describe it.
  2.  **Single-Sentence Contrast:** The gap between surface and essence must be statable in one line.
  3.  **No External Verification:** No historical claims they can Google.
  4.  **Not a 4-Term Puzzle:** It must be a recognition event, not a logic puzzle.
  5.  **Invisibility:** It must be something they do without noticing they are analogizing.
  6.  **Added Constraint:** **The example must involve an action, not just a label.** S&E is about *doing* and *thinking*, not just naming.

  **Critique of the GUI (Desktop/Folder) Case:**
  You are correct to be suspicious. The GUI case fails the **Invisibility** constraint for CS students. They know the UI designer *chose* the metaphor. They will categorize it as "Interface Design" rather than "Cognitive Architecture." It argues that *designers* analogize, not that *users'* cognition is fundamentally analogical. It creates a layer of indirection you don't have time to strip away.

  **The Chosen Example: "Cut and Paste"**
  *   **The Sentence:** "We say we 'cut' the text to move it, ignoring that the original bits remain in memory until overwritten."
  *   **What Travels:** The semantic content and the intention of relocation.
  *   **What Gets Left Behind:** The physical destruction implied by "cutting."
  *   **Why it works:**
      1.  **Load-Bearing:** You cannot teach a student to edit code without this command. They must adopt the analogy to function.
      2.  **Invisibility:** They have done this a thousand times without thinking "I am mapping scissors to a buffer."
      3.  **Slippage:** The "Undo" function breaks the analogy (you can't un-cut paper), proving the category is flexible.
      4.  **CS Relevance:** It bridges their mental model (manipulating objects) and the machine model (memory addresses).

  **How to Whiteboard It:**
  Draw a pair of scissors. Draw a memory buffer. Draw an arrow between them labeled "Mapping." Ask: "If I 'cut' and don't 'paste', where is the text?" When they say "Clipboard," ask: "Is the clipboard a physical location?" This forces the realization that the *location* is analogical, not real.

  ### 3. Misconceptions and Defusal Sequence

  Here is the sequence for defusing the six misconceptions. The order is critical to prevent early closure.

  1.  **"Analogy is deliberate comparison."**
      *   **When:** Minute 5 (During "Cut and Paste").
      *   **Why Here:** You need to catch them before they formalize "Analogy" as a slow, symbolic process.
      *   **Defusal:** "You didn't deliberate before clicking 'Cut'. The analogy was pre-compiled by the interface to trigger your motor skills. Cognition uses the same pre-compiled shortcuts."

  2.  **"This is just Nearest-Neighbor in Vector Space."**
      *   **When:** Minute 15 (After establishing Feature Salience).
      *   **Why Here:** They will reach for this as soon as you mention similarity.
      *   **Defusal:** "In your ML course, the feature space was fixed before training. In S&E, the *dimensions themselves* are created on the fly. I can view a 'virus' as 'biological' or 'code' depending on context. A vector space cannot rotate its own axes mid-inference."

  3.  **"If all categorization is analogical, anything belongs anywhere."**
      *   **When:** Minute 25 (After introducing Surfaces vs. Essences).
      *   **Why Here:** This is the "Category Collapse" objection. It only makes sense once they understand that *something* constrains the analogy.
      *   **Defusal:** "The Essence is the constraint. I can call a computer virus a 'virus' because it replicates (essence), but not because it breathes (surface). The analogy is not free; it is bound by causal structure."

  4.  **"Rules vs. Analogy" (Missing Misconception 1).**
      *   **When:** Minute 30.
      *   **Why Here:** CS students love rules. They will argue "Grammar is rules, not analogy."
      *   **Defusal:** "Rules are fossilized analogies. 'Add -ed for past tense' is a shortcut for thousands of analogies to past verbs. When the rule breaks (go/went), analogy takes over again. Rules are the crust; analogy is the magma."

  5.  **"LLMs already do this."**
      *   **When:** Minute 35.
      *   **Why Here:** If you bring this up too early, the discussion becomes about Transformers, not cognition.
      *   **Defusal:** "LLMs predict tokens based on statistical surface co-occurrence. S&E claims cognition predicts based on *essence*. Does the LLM know *why* 'cut' implies 'paste', or just that they appear together? This is an open empirical question, not a settled fact."

  6.  **"Is this a claim about neural machinery?" (Missing Misconception 2).**
      *   **When:** Minute 40 (During Refusals).
      *   **Why Here:** This is a category error (Marr's Level of Analysis).
      *   **Defusal:** "This is a computational-level theory. Whether neurons do this via spikes or synapses is irrelevant to whether the *logic* of the system is analogical."

  ### 4. The Ending: The Coinage Threshold

  **Placement:** The last 10 minutes.
  **Dependency:** This *must* come after Surfaces/Essences. You cannot explain why a new word is coined without explaining when the "Essence" of the old word breaks.
  **Reframe or Decorate?** It **Reframes**. It moves the thesis from "How we think" to "How our thinking shapes reality." It shows that language evolution is a fossil record of cognitive analogies failing or succeeding.

  **The Example:** **"Tweet" vs. "Micro-Blog."**
  *   **Why:** "Mail" vs. "Broadcast" is slightly historical. "Tweet" is lived experience.
  *   **The Logic:** We could have called Twitter "Micro-Blogging." That would have stretched the category "Blog." Instead, we coined "Tweet."
  *   **The Threshold:** Why? Because the *essence* of a Blog is "long-form, archival, reflective." The *essence* of a Tweet is "ephemeral, stream-based, immediate."
  *   **The Point:** When the surface similarity (writing on a screen) is high, but the essence diverges, we coin a new word. When both align (Email), we stretch the old word.
  *   **Board Work:** Draw a spectrum. Left: "Stretch Category" (Email). Right: "Coin New Word" (Tweet). Mark the "Break Point" where the causal structure no longer maps.

  ### 5. The Transfer Task (Assessment)

  **The Task:** Hand them a slip of paper as they leave.
  **Prompt:** "Consider the phrase: 'I am friends with my chatbot.' Using the Surfaces/Essences framework, is this a valid analogical extension of the category 'Friend', or does it require a new category? What specific piece of evidence would settle it?"

  **Correct Answer:**
  *   Identifies the **Essence** of "Friend" (e.g., mutual mental state attribution, reciprocity, vulnerability).
  *   Identifies the **Surface** (e.g., conversational flow, helpfulness).
  *   Argues whether the chatbot possesses the *Essence* or merely mimics the *Surface*.
  *   **Crucially:** Proposes a test for the Essence (e.g., "If the chatbot initiates contact based on its own needs, the category holds. If it only responds, it is a simulation.").

  **Merely Fluent Answer:**
  *   Uses the words "analogy," "surface," and "essence" correctly.
  *   Concludes "It depends on the definition."
  *   Fails to identify *which* feature is the essence vs. surface. (e.g., treats "text output" as the essence).

  **What the Probe Misses:**
  It cannot tell you if the student believes the *chatbot* is analogizing, or if the *human* is analogizing the chatbot. S&E is about the human cognition. A student might write a brilliant answer assuming the AI has internal states, missing the point that the *human's categorization* is the phenomenon under study.

  ### 6. Refusals and Cuts

  **Open Refusals (Announce these explicitly):**
  1.  **Neural Implementation:** "I will not explain *how* the brain does this. We are discussing the logic of the software, not the hardware."
  2.  **Deep Learning Vindication:** "I will not settle whether Transformers are 'true' analogy engines. That requires a definition of 'understanding' we don't have time for. I am giving you the lens, not the verdict."

  **The Cut:**
  **Cut the "Bongard Problems."**
  *   **Why:** They are Hofstadter's classic example of pattern recognition.
  *   **Reason to Cut:** Explaining the rules of a Bongard problem takes 5–7 minutes on a whiteboard. Solving one takes another 5. You have 45 minutes. It is your favorite part, but it is a "demo" that eats the "argument."
  *   **Replacement:** Use the "Cut/Paste" and "Tweet" examples. They are faster and more relevant to CS students' lived experience.

  ### Summary of Whiteboard Progression

  1.  **M0:** "Categorization = Analogy?" (Unanswered).
  2.  **M5:** "Cut & Paste" diagram (Scissors vs. Buffer). *Defuse Deliberate Analogy.*
  3.  **M15:** Feature Space diagram (Fixed axes vs. Rotating axes). *Defuse Vector Space.*
  4.  **M25:** Surface vs. Essence table (Virus: Breathes [No] vs. Replicates [Yes]). *Defuse Category Collapse.*
  5.  **M30:** "Rules are Fossilized Analogy" (Text). *Defuse Rules Objection.*
  6.  **M35:** "LLMs: Surface or Essence?" (Question mark). *Defuse LLM Settledness.*
  7.  **M40:** "Coinage Threshold" (Email vs. Tweet).
  8.  **M45:** Refusals (Neural/DL) + Handout.

  This structure forces them to oscillate between "Of course" and "Surely not" in a controlled manner, landing them on the specific nuance of *Essence* as the constraint that makes the strong claim viable.
