          1.  Explain the shared primary intension between the original term and the rigidified surrogate, and how this preserves the *a posteriori* character despite the necessary secondary intension.
          2.  Confront the worry that rigidification is an external/stipulative operation not derived from meaning.
          3.  Address the "change of subject" objection (i.e., "Water is H2O" vs. "Water is the watery stuff of the actual world").
      *   **Constraint:** Do not retreat into the distinction between epistemic and metaphysical 2Dism to dissolve the problem. Stick to the framework's internal logic.
      *   **Tone:** Sustained argument, philosophically precise, suitable for a teaching note.

  2.  **Deconstruct the Objection:**
