  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the objection's force. It's the "Beguiling Surrogate" objection. State the goal: show rigidification is semantic, not stipulative.

      *   **Point 1: Shared Primary Intension & The *A Posteriori*:**
          *   *Concept:* Primary intension (1-intension) captures the epistemic role (how we identify the referent). Secondary intension (2-intension) captures the metaphysical role (what the term refers to in counterfactual worlds given actuality).
          *   *The Link:* The rigidified term (let's call it $water^\dagger$ or "actual water") shares the *same* 1-intension as "water".
          *   *Why this matters:* The *a posteriori* nature comes from the gap between the 1-intension and the 2-intension. We need empirical info to know that the satisfier of the 1-intension (watery stuff) *is* H2O.
          *   *Argument:* Even if the 2-intension is necessary, the *route* to knowing it is via the 1-intension. The necessity is metaphysical (2D), the discovery is epistemic (1D). The shared 1-intension ensures we are talking about the same cognitive significance.
          *   *Key phrase:* "Cognitive role is preserved in the first dimension; modal profile is secured in the second."

      *   **Point 2: Rigidification as Semantic, Not Stipulative:**
          *   *The Worry:* Is "rigidification" just a philosopher's trick? Do speakers mean "actual water" when they say "water"?
          *   *The Defense:* Rigidification isn't adding meaning; it's making explicit the reference-fixing mechanism already implicit in natural kind terms (Kripke/Putnam).
          *   *Mechanism:* The term "water" is introduced via a description ("the watery stuff"), but once introduced, it refers to *that stuff* in all worlds. The 2D framework models this: The 1-intension handles the introduction (fixing), the 2-intension handles the usage (counterfactuals).
          *   *Crucial distinction:* It's not that we *replace* the word; it's that the word *already functions* this way. The "rigidified surrogate" is just a formal representation of the term's actual semantic behavior in the second dimension. It derives from the causal-historical chain, not a philosopher's fiat.

      *   **Point 3: The "Change of Subject" Objection:**
          *   *The Critic:* "Water is H2O" $\neq$ "Actual water is H2O". You proved the second, not the first.
          *   *The Response:* This relies on a confusion between *sentence meaning* and *proposition expressed*.
          *   *2D View:* A single sentence expresses two propositions.
              *   Proposition 1 (Primary): Contingent, *a posteriori* (The watery stuff is H2O).
              *   Proposition 2 (Secondary): Necessary, *a posteriori* (Water is H2O).
          *   *Addressing the Critic:* The critic insists there is only *one* proposition. The 2Dist says natural language sentences are context-sensitive in a way that generates two distinct semantic values. The "change of subject" charge fails because the subject ("water") is the same lexical item, but its semantic value shifts depending on whether we are evaluating epistemically (1D) or metaphysically (2D).
          *   *Refinement:* We aren't swapping sentences. We are acknowledging that "Water is H2O" has a dual semantic structure. The necessity belongs to the secondary proposition expressed by the *original* sentence, not a new sentence. The rigidified paraphrase is a heuristic to *reveal* the secondary intension, not a replacement for the original sentence.

      *   **Conclusion:** Summarize. The framework doesn't beg the question; it disentangles two distinct semantic tasks performed by a single term.

