answer: |-
  **Teaching Note: Defending the Rigidified Surrogate in Two-Dimensional Semantics**

  **To:** Graduate Seminar on Two-Dimensional Semantics
  **From:** Instructor
  **Re:** The Objection from Question-Begging Rigidification

  In our previous session, we established the basic architecture of the two-dimensional framework: primary intensions as functions from centered worlds to extensions (capturing the epistemic or reference-fixing role), and secondary intensions as functions from uncentered worlds to extensions given a fixed actual world (capturing the metaphysical or counterfactual role). We saw how this handles the Kripkean insight that "Water is H2O" is necessary *a posteriori*: the primary intension is contingent (there are centered worlds where the watery stuff is XYZ), while the secondary intension is necessary (given that water is H2O here, it is H2O everywhere).

  However, a persistent internal objection threatens to undermine this explanatory power. The critic argues that the framework does not genuinely explain the necessity of the identity sentence. Instead, it allegedly surreptitiously replaces the term "water" with a rigidified surrogate (e.g., "actual water" or "the watery stuff of the actual world"). By analyzing "Water is H2O" as "Actual water is H2O," the framework secures necessity by stipulation, thereby begging the question and changing the subject.

  The following argument defends the legitimacy of the rigidified-term analysis as a genuine semantic resource. It proceeds in three stages: clarifying the role of the shared primary intension, defending rigidification as semantic rather than stipulative, and addressing the "change of subject" worry.

  ### 1. The Shared Primary Intension and the *A Posteriori*

  The first step in defending the framework is to clarify exactly what relationship holds between the original term ("water") and its rigidified counterpart ("actual water"). The critic assumes that if the secondary intension is necessary, the epistemic work has been bypassed. This is a misunderstanding of how the two dimensions interact.

  The defense rests on the fact that the original term and the rigidified surrogate **share the exact same primary intension**.

  Recall that the primary intension is a function from centered worlds $\langle w, c \rangle$ to extensions. For "water," this function picks out whatever plays the "watery" role (clear, drinkable, liquid, etc.) in the world of the center $c$. Crucially, the rigidified description "the watery stuff of the actual world" shares this primary intension. Why? Because when we evaluate the primary intension of the rigidified description, we treat the world of the center as "actual." In any centered world $\langle w, c \rangle$, "the watery stuff of the actual world" picks out the watery stuff of $w$. Thus, both "water" and "actual water" map the same centered worlds to the same extensions.

  **Why this preserves the *a posteriori*:**
  The *a posteriori* character of "Water is H2O" is located entirely in the relationship between the primary intension and the secondary intension.
  1.  **Epistemic Access:** We grasp the meaning of "water" via its primary intension (the watery role).
  2.  **Empirical Discovery:** It requires empirical investigation to determine that the satisfier of this primary intension in our world is H2O.
  3.  **Modal Consequence:** Once that empirical identity is fixed, the secondary intension (which holds the actual world fixed) renders the identity necessary.

  The necessity of the secondary intension does not erase the *a posteriori* nature of the discovery because the **route** to the secondary intension runs through the primary intension. We cannot access the necessary secondary proposition without first using the contingent primary intension to fix the reference. The shared primary intension ensures that the cognitive significance of "water" remains constant; the rigidified surrogate is not a cognitively distinct term in the first dimension. Therefore, the framework does not hide the empirical work; it locates it in the diagonal (where primary and secondary intensions coincide), while maintaining that the secondary intension itself, once fixed, is modalically robust.

  ### 2. Rigidification: Semantic Mechanism vs. Philosophical Stipulation

  The second worry is that rigidification is an external, speaker-independent operation that the theorist stipulates rather than derives from the meaning of the expression. The critic asks: "Do speakers mean 'actual water' when they say 'water'? If not, you are analyzing a term they don't use."

  This objection conflates the **paraphrase** used to model the semantics with the **mechanism** of reference fixation. The two-dimensionalist does not claim that speakers consciously entertain the description "the watery stuff of the actual world" every time they utter "water." Rather, the claim is that the semantic behavior of natural kind terms *functions* as if they were rigidified descriptions.

  Consider the causal-historical theory of reference. A term is introduced via a baptism or reference-fixing description ("Let 'water' name whatever has *this* structure" or "...whatever is the watery stuff around here"). Once introduced, the term refers to that kind in all counterfactual worlds, regardless of whether the descriptive properties hold there.
  *   **The Primary Intension** models the reference-fixing stage (the baptism).
  *   **The Secondary Intension** models the referential stability across counterfactuals (the rigid designation).

  Rigidification in the two-dimensional framework is not a trick imposed from the outside; it is a formal representation of the semantic transition from reference-fixing to reference-bearing. When we move from the first dimension to the second, we are not changing the word; we are shifting from evaluating the conditions under which the term *finds* a referent to evaluating the conditions under which the *found* referent exists.

  Therefore, the rigidified surrogate is not a stipulative replacement. It is the explicit formulation of the term's semantic value in the second dimension. The framework derives this from the meaning of the expression insofar as the meaning of a natural kind term includes both its mode of introduction (1-intension) and its modal profile (2-intension). To deny this is to deny the Kripkean insight that reference is fixed descriptively but determined rigidly. The two-dimensional framework simply makes this dual structure explicit in the semantics.

  ### 3. The "Change of Subject" Objection

  Finally, we must confront the most forceful version of the objection: "On this account, 'Water is H2O' and 'Water is the watery stuff of the actual world' are not the same sentence at all. You have proven the necessity of the latter, but the former remains contingent. You have changed the subject."

  This objection relies on a monolithic conception of propositional content—the idea that a sentence expresses exactly one proposition, and if the necessity of that proposition is in doubt, the analysis has failed. The two-dimensionalist rejects this monolithic view.

  **The Defense:**
  The sentence "Water is H2O" is not ambiguous in the way "bank" (river/finance) is ambiguous. It does not express two different sentences. Rather, it expresses a **two-dimensional intension**.
  *   Evaluated along the **horizontal** (secondary intension), with the actual world fixed, it expresses a necessary proposition.
  *   Evaluated along the **diagonal** (primary intension), varying the world considered as actual, it expresses a contingent proposition.

  The critic insists that the necessity has been imported by a change of subject. The defender replies that the "subject" (the term "water") is semantically complex. It carries both a descriptive mode of presentation and a rigid referent.
  *   If the critic asks, "Is the proposition that *water is H2O* necessary?" the answer is **Yes**, provided we are asking about the proposition expressed in the context of the actual world (the secondary intension).
  *   If the critic asks, "Is it knowable *a priori* that water is H2O?" the answer is **No**, because the primary intension does not settle the identity without empirical input.

  The charge of "changing the subject" fails because the rigidified paraphrase ("actual water") is offered not as a *replacement* for the original sentence, but as a **gloss on its secondary intension**. We are not saying "Water is H2O" *means* "Actual water is H2O" in all contexts. We are saying that the truth-conditions of "Water is H2O," when evaluated for metaphysical necessity (the secondary dimension), are identical to the truth-conditions of "Actual water is H2O."

  To insist that this changes the subject is to insist that natural language sentences cannot have distinct semantic values for epistemic and metaphysical evaluation. But this is precisely what the two-dimensional framework is designed to accommodate. The framework does not beg the question by stipulating necessity; it explains how a single sentence can legitimately bear a necessary semantic value in one dimension (metaphysics) while retaining a contingent semantic value in another (epistemology), without fracturing the unity of the term.

  ### Conclusion for Seminar Discussion

  In sum, the rigidified-term analysis is not a question-begging trick. It is a precise modeling of how reference-fixing descriptions relate to rigid designators.
  1.  The **shared primary intension** ensures the cognitive role (and thus the *a posteriori* status) is preserved.
  2.  **Rigidification** is not a stipulation but a formalization of the causal-historical reference-fixing mechanism inherent in the term's meaning.
  3.  The **change of subject** objection fails because it assumes a one-dimensional notion of content that the framework has independently motivated reasons to reject.

  When you discuss this in sections, press your students on whether they believe the "change of subject" objection holds water (pun intended) if we accept that natural kind terms have a dual semantic structure. Does the cost of accepting two propositions per sentence outweigh the benefit of saving the necessity of identity?
