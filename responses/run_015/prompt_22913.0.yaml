      *   *Title:* Needs to be academic. "Defending the Rigidified Surrogate."
      *   *Structure:* Intro -> The Shared Primary Intension -> The Status of Rigidification -> The Change of Subject Objection -> Conclusion.

  6.  **Final check against constraints:**
      *   Grad seminar level? Yes.
