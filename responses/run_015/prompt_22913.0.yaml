      *   *Refining Point 3:* This is the hardest part. The critic says you changed the subject. I need to argue that the "subject" (the term) supports both intensions. The sentence "Water is H2O" is ambiguous between the two propositions, or rather, carries both. The necessity attaches to the secondary proposition expressed by the *original* sentence.

