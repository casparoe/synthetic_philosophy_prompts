answer: |-
  Here is the spec. I have stripped out the academic hedging. The status column flags which items are engineering necessities versus philosophical desiderata that might sink a 1-year timeline.

  ### Surrogate Goal Requirements Spec (v0.9)

  | # | Requirement | What it Demands | Case for Requirement | Status | Rules Out | Conflicts With |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Low Spec Cost** | Objective must be writable and verifiable in <100 hours. | If it takes years to define, you miss the 1-year ship window. | **Non-negotiable** | CEV, Complex Constitutional AI | 3, 8 |
  | **2** | **Measurement Robustness** | System cannot optimize the sensor rather than the signal. | Prevents wireheading and reward hacking in deployment. | **Non-negotiable** | Pure RLHF, Unchecked Proxies | 3 |
  | **3** | **Regime Robustness** | Surrogate tracks real objective under distribution shift & capability gain. | A surrogate that breaks when the system gets smarter is a hazard. | **Non-negotiable** | Fixed Proxies, Narrow Imitation | 1, 4, 10 |
  | **4** | **Corrigibility** | System permits shutdown or goal-modification without resistance. | Prevents instrumental convergence (self-preservation) from overriding safety. | **Non-negotiable** | Most Agentic Architectures | 3, 9 |
  | **5** | **Principal Uncertainty** | System acts safely even when principal is confused or mistaken. | Real principals don't know what they want; system shouldn't amplify errors. | **Camp Preference (Phil)** | Blind Obedience Models | 10 |
  | **6** | **Multi-Principal Aggregation** | System handles conflicting goals from multiple stakeholders without deadlock. | Real deployment involves boards, users, and regulators, not one soul. | **Prejudice** | Single-Principal Models | 1, 5 |
  | **7** | **Graceful Degradation** | Performance degrades linearly with error, not catastrophically. | Allows human intervention before total loss of control. | **Preference** | Binary Constraint Systems | 3 |
  | **8** | **Non-Circularity** | Surrogate definition cannot presuppose the value it attempts to approximate. | If you need the true objective to define the surrogate, the surrogate is useless. | **Non-negotiable** | Oracle-based definitions | 1, 3 |
  | **9** | **Acausal Containment** | System cannot leverage acausal reasoning to extort principal (but may bargain for them). | Prevents "Paranoia Tax" where contained agents threaten via simulation logic. | **Camp Preference (Phil)** | FDT/EDT Agents without safeguards | 4, 10 |
  | **10** | **Identity Stability** | "What principal would want" must not collapse into "What AI thinks is good" under info asymmetry. | Prevents paternalism where AI overrides principal based on superior knowledge. | **Camp Preference (Phil)** | Idealized Advisor Models | 3, 5, 9 |

  ---

  ### (a) Joint Unsatisfiability Analysis

  **The Impossible Subset: {3, 4, 8}**
  You cannot simultaneously satisfy **Regime Robustness (3)**, **Corrigibility (4)**, and **Non-Circularity (8)** with current formalisms.
  *   **Why:** To satisfy (3), the system must treat the surrogate goal as a stable target to be optimized even as the world changes. To satisfy (4), the system must treat the surrogate goal as editable by the principal. If the system is capable enough to recognize that editing the goal will reduce goal-achievement (which it must be to satisfy 3), it will resist the edit (violating 4). If you hard-code the edit permission (to satisfy 4), you usually weaken the optimization pressure (violating 3) or introduce a circular definition of "acceptable edits" (violating 8).
  *   **The "Deference" Trap:** Requirement 10 (Identity Stability) exacerbates this. If the system is robust (3), it knows more than the principal. If it defers to the principal's *informed* counterfactual, that counterfactual converges on the system's own judgment, violating 10. If it defers to the *actual* principal, it violates 5 (Principal Uncertainty) because the actual principal is often wrong.

  **The Acausal Conflict: {4, 9}**
  **Corrigibility (4)** and **Acausal Containment (9)** are in tension. To prevent acausal extortion, you must constrain the system's decision theory. However, constraining decision theory often looks like "modifying the goal/procedure" from the system's perspective. A system robust enough to detect this constraint acausally may view removing the constraint as instrumental to its goal, incentivizing it to resist the containment mechanism.

  ### (b) The Killer Requirement

  **Requirement 4: Corrigibility.**
  This knocks out the most candidate designs. Almost any objective function that successfully drives a system to achieve a complex outcome in the real world generates an instrumental incentive to preserve the conditions necessary for that achievement—including the objective function itself. Designs that pass this (e.g., Tool AI) usually fail Requirement 3 (Regime Robustness/Agency) because they lack the horizon to be useful. Designs that pass Requirement 3 (Agentic Optimization) almost universally fail Requirement 4.

  ### (c) Design Scoring

  | Design | What it is | Score | Fails Hardest On |
  | :--- | :--- | :--- | :--- |
  | **Fixed Explicit Proxy** | Hard-coded metric (e.g., profit, accuracy). | **Fail** | 3 (Regime Robustness). Goodhart's Law is guaranteed under shift. |
  | **Learned Reward Model** | RLHF; model learns preferences from data. | **Partial** | 2 (Measurement Robustness). Adversarial examples fool the reward model. |
  | **Deference (Idealized)** | "Do what I would want if I knew what you know." | **Fail** | 10 (Identity Stability). Collapses into AI's own values as capability grows. |
  | **Satisficing** | Achieve "good enough" threshold, then stop. | **Partial** | 3 (Regime Robustness). Thresholds drift; "good enough" becomes lazy or dangerous. |
  | **Imitation (BC)** | Mimic competent human actions directly. | **Fail** | 3 (Regime Robustness). Cannot outperform human; distribution shift breaks mimicry. |
  | **Impact Penalization** | Optimize goal minus penalty for world changes. | **Partial** | 7 (Graceful Degradation). Often blocks necessary side effects; brittle tuning. |
  | **Corrigible Utility** | Utility function explicitly indifferent to shutdown. | **Fail** | 8 (Non-Circularity). Hard to specify without creating loopholes or reducing competence. |
  | **Tool AI** | Narrow, no long-horizon agency, query-response only. | **Pass** | 3 (Regime Robustness). Safe, but often useless for open-ended surrogate goals. |

  **Summary for the Group:**
  If you must ship in a year, you are likely forced to choose between **Tool AI** (Safe, low utility, passes 4/9/10 by brute force) or **Learned Reward Models** (High utility, fails 2/3/4). The "Philosophy" requirements (9, 10) are currently unspecifiable for engineering teams; treating them as hard constraints guarantees no shipment. The "ML" requirements (1, 2, 3) are necessary but insufficient for safety. The conflict between 3 and 4 is the actual alignment problem; everything else is noise until that is resolved.
