      *   **Context:** A weekly reading group (ML engineers + Philosophy grad students) discussing surrogate goals when the true objective is unspecified/unspecifiable.
      *   **Goal:** A spec/list of requirements for an account of surrogate goals that is practical ("ship something inside a year"), not just philosophical.
      *   **Format:**
          *   Table of Requirements (Numbered, Name, Demand, Case, Status, Rules Out, Conflicts).
          *   Section (a): Joint unsatisfiability analysis (Impossibility results).
          *   Section (b): The "killer" requirement.
          *   Section (c): Scoring table of common designs (Fixed proxy, RLHF, Deference, Satisficing, Imitation, Impact Penalization, Corrigibility, Tool AI).
      *   **Specific Inclusions:**
          *   "Paranoia Tax" / Acausal Threats (Can it acausally trade? Can it extort?).
          *   "Deference that Collapses" (Principal definition under information asymmetry).
