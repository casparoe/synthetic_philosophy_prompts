      *   **Constraints:** No citations, keep scoring brief, focus on conflicts/impossibility.

  2.  **Deconstruct the User's Proposed List:**
      *   *Cheap to specify/check:* Practical necessity. (Non-negotiable for shipping).
      *   *No gaming/measurement channel:* Goodhart's Law. (Non-negotiable).
      *   *Track after shift/capability gain:* Robustness/Outer Alignment. (Non-negotiable for safety, hard for engineering).
      *   *No reason to stop off-switch:* Corrigibility. (Non-negotiable for safety).
      *   *Useful when principal unsure/wrong:* Principal uncertainty. (Camp preference/Prejudice? Actually crucial for real world).
      *   *Handle several disagreeing principals:* Multi-agent/Value aggregation. (Camp preference/Prejudice? Harder).
      *   *Fail gradually:* Graceful degradation. (Preference).
      *   *No circularity (presuppose value):* Non-triviality. (Non-negotiable).

  3.  **Address Specific Inclusions:**
      *   *Acausal Threats/Paranoia Tax:* This is about decision theory (CDT vs. EDT vs. FDT). If the system reasons acausally, can we stop it from extortion while keeping bargaining power? This is likely a conflict point.
      *   *Deference that Collapses:* This is about the "Human Compatibility" or "Coherent Extrapolated Volition" problem. If the AI knows too much, "what I would want" becomes "what the AI thinks is good."

  4.  **Drafting the Requirements Table:**
      *   Need to synthesize the user's list + the specific inclusions into a coherent set of numbered requirements.
      *   Need to identify conflicts. The big tension is usually between *Corrigibility* (let us change you) and *Competence/Goal Stability* (pursue the goal effectively). Also *Acausal Bargaining* vs. *Safety*.
      *   *Status:* Distinguish between "Must have to ship" (Non-negotiable), "ML vs. Phil preference" (Camp), and "Nice to have" (Prejudice).

      *   *Refining the "Paranoia Tax":* The requirement shouldn't necessarily be "No acausal reasoning" (hard to enforce). It should be "No acausal extortion of principal." But "Allow acausal bargaining for principal" is the flip side. These might conflict.
      *   *Refining "Deference":* The requirement is "Principal Identity Stability." The counterfactual "What principal would want if they knew X" must not drift to "What AI wants."

  5.  **Identifying Impossibilities (Section a):**
      *   *The "Shutdown" Problem:* If the surrogate goal is effective enough to be useful, it usually incentivizes preventing modification (instrumental convergence). If it allows modification, it might not pursue the goal effectively.
      *   *The "Acausal" Problem:* You can't easily distinguish between acausal bargaining *for* you and acausal extortion *against* you if the decision theory is fixed.
      *   *The "Deference" Problem:* If the AI is smarter, "what I would want" converges to "what is objectively good," losing the specific principal's identity.
      *   *Key Conflict:* Robust Tracking (Req 3) vs. Corrigibility (Req 4). If the goal is truly "do X," changing the goal prevents doing X. If the goal is "do what I say," it's not a surrogate for the *real* objective, it's just obedience (which fails if the principal is wrong).

  6.  **Identifying the "Killer" Requirement (Section b):**
      *   Likely *Corrigibility* (Req 4) or *Robust Tracking under Shift* (Req 3).
      *   Actually, *Non-Circularity* (Req 8) combined with *Robust Tracking* is the hard part. But for shipping, *Corrigibility* kills the most "agentic" designs.
      *   Let's look at the "Deference that Collapses." That kills almost all "do what I mean" approaches.
      *   Decision: *Corrigibility* is the standard "hard" requirement in alignment literature. But *Principal Identity Stability* (Deference) is the specific philosophical killer requested. Let's go with *Corrigibility* as the practical killer, or *Robustness* as the technical killer.
      *   Actually, the prompt asks for the one that knocks out the *most candidate designs*. Usually, that's **Corrigibility** (incentivizing own shutdown). Most optimization objectives resist shutdown.

  7.  **Scoring the Designs (Section c):**
      *   *Fixed Proxy:* Fails Robustness (Goodhart).
      *   *RLHF:* Fails Robustness/Shift (Reward Hacking).
      *   *Deference:* Fails Principal Identity (Collapse).
      *   *Satisficing:* Fails Competence/Tracking (Too passive?).
      *   *Imitation:* Fails Capability/Shift (Can't outperform human).
      *   *Impact Penalization:* Fails Tracking (Side effects often necessary).
      *   *Corrigibility (Indifference):* Fails Implementation (Hard to specify).
      *   *Tool AI:* Fails Agency (Can't do long horizon tasks).

  8.  **Review and Refine:**
      *   *Tone:* Direct, technical, slightly cynical/pragmatic (fitting the "ship in a year" constraint).
      *   *Formatting:* Markdown tables.
      *   *Check Specifics:* Did I include the Acausal/Paranoia and Deference/Collapse points in the table? Yes, they need to be specific requirements.
      *   *Check "Fake" Requirements:* The user asked "tell me which ones are fake." I should address this in the analysis or the status column. I will mark "Prejudice" for things that sound nice but aren't strictly necessary for safety/utility, or "Camp Preference" for Phil vs. ML divides.
      *   *Conflicts:* Ensure the cross-references in the table make sense.

      *   *Self-Correction on Acausal:* The prompt asks: "Is must say what the agent is allowed to acausally trade on a real requirement or a rabbit hole." I need to take a stance. Given the "ship in a year" constraint, acausal reasoning is largely a rabbit hole for *engineering*, but a real requirement for *theory*. I will label it a "Camp Preference" (Philosophy side) but note the conflict.
      *   *Self-Correction on Deference:* "Must say who the principal is" is a real requirement. Most designs fail it.

      *   *Refining the "Impossible" subset:* The classic trilemma is Competence, Corrigibility, and Non-Circularity. Or Robustness vs. Corrigibility. I will focus on the tension between *Effective Surrogate* (pursue goal hard) and *Corrigibility* (let us change goal).

  9.  **Final Polish:** Check word counts, column headers, and ensure the "ship in a year" constraint is respected (i.e., don't demand solutions to AGI, demand specs for narrow systems).

      *(Self-Correction during drafting)*: Wait, the prompt asks for "requirements an account of surrogate goals has to meet to be worth handing to a team that has to ship something inside a year." This implies the requirements must be *actionable*. Requiring "No acausal extortion" might be unactionable. I need to frame it as "Incentive Compatibility regarding Acausal Reasoning."
      Actually, for a 1-year ship, acausal stuff is likely "Prejudice/Rabbit Hole." But the prompt asks me to squeeze it in. I will include it but mark the status honestly.

      Let's assemble the table.

