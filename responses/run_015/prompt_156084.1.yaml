answer: |-
  The projector hums, a low insect noise inside the sterile conference room. On the white wall, magnified to the size of a dinner plate, hangs the glyph. It is a closed loop. Perfectly round. No ear, no spine, no aperture. It is a geometric breath.

  Núria Ferran-Vidal stands beside the screen, her hand hovering near the light beam but not touching it. She knows what the committee sees. They see a circle. They see the lowercase 'o' from her typeface *Peristyle*. But on the table in front of them, printed on heavy stock, is the word *platform*. In this font, at this size, the second letter is that circle. Yet every eye in the room reads "platform." No one reads "ploatform."

  "The tender closes Friday," Núria says. Her voice is flat, tired. The Northern Rail contract is worth more than her foundry's annual revenue. It requires legibility at two hundred meters, in rain, in fog. Her design works. Her tests prove it. But the Script Registry controls the encoding, and the Registry controls what counts as a letter.

  Mr. Henderson, the senior registrar, leans forward. He wears glasses thick enough to distort his eyes into swimming pools. He picks up a loupe and examines the printout. He is looking for history. He is looking for the ghost of the Roman square capital, the Uncial ancestor, the ductus of the pen.

  "It lacks the necessary topology," Henderson says. He taps the paper. "An 'a' is defined by its closure here, yes, but also by its opening there. By the relationship of the bowl to the stem. This..." He points to the circle. "This is an 'o' wearing a mask. If you encode this as a variant of U+0061, you break the genealogy. You sever the link to the chisel."

  "The chisel doesn't matter on a LED matrix," Núria says. She walks to the table and places a second sheet down. This one is pixelated. The circle is now a cluster of square lights. "On the signage, the 'o' is wider. The 'a' is narrower. The distinction isn't in the shape's anatomy; it's in the negative space between the letters. The 'a' is whatever isn't the 'o' in this specific system."

  Henderson shakes his head. "Negative definition is unstable. What happens when you change the kerning? What happens when the 'o' is squeezed? Then your 'a' becomes an 'o'. You are defining the letter by its neighbors, not by itself. A letter must carry its identity in its bones, not in its company."

  Núria feels the heat rising in her neck. This is the argument she has had for a month. The cognitive scientists tell her the brain fills in the gaps, that recognition is a prediction engine, not a measurement tool. The type designers tell her that style is a spirit, a coherent logic that bends the rules but keeps the soul. But Henderson wants a checklist. He wants necessary and sufficient conditions. He wants a Platonic ideal that doesn't exist in ink.

  "It reads," Núria says. She picks up a marker. She draws the glyph on a notepad, freehand. It wobbles. It is no longer a perfect geometric circle. It looks like a child's 'o'. She writes *cat* next to it. Then she writes *cot* using the same shape for both vowels. The page dissolves into nonsense.

  "Context is king," she says. "But you want me to certify the shape in isolation. You want me to prove the letter exists without the word."

  "We want to ensure consistency across scripts," Henderson says. "If we allow this, what stops someone from encoding a square as a 'b'? A line as a 't'? We are custodians of the alphabet, not curators of tricks."

  "It's not a trick. It's a reduction." Núria turns back to the screen. She changes the slide. Now the glyph is shown in three weights: Light, Regular, Bold. In the Bold version, the circle thickens. The hole inside shrinks. At extreme weight, the 'o' becomes a solid dot. The 'a' remains a loop. But in her design, the 'a' is always the loop.

  "My pupils," Núria says, surprising herself. She hadn't planned to mention the workshop. "I teach children. When they learn to write, they don't draw拓扑. They draw symbols. They draw a circle and say 'ah'. They draw a circle with a stick and say 'dee'. The identity is in the gesture, not the geometry. You are asking me to prove that my glyph has the right ancestors. I am telling you it has the right future."

  Henderson sighs. He takes off his glasses and wipes them on his tie. For a moment, he looks old, burdened by the weight of every standard ever set. "The genealogy protects us. If we lose the history, we lose the shared map. If your 'a' is an 'o', then what is the 'o'? And if the 'o' is nothing, then the 'a' is nothing."

  "The 'o' is the space left over," Núria says.

  She walks to the window. Outside, the city is a blur of signage. Neon, print, paint. She sees a billboard for a bank. The 'a' is a single storey. She sees a bus stop. The 'a' is double storey. She sees a child's chalk drawing on the pavement. The 'a' is a circle with a tail that looks like a 'q'.

  "The question isn't what makes an 'a' an 'a'," she says, turning back to the room. "It's what makes a mark a letter. Is it the ink? Is it the grid? Is it the hand that made it?"

  She picks up the printout again. She holds it up to the projector light. The paper is translucent. The glyph glows. From the back, the ink bleeds through. The shape changes. The spine appears where there was none. The aperture opens where there was only closure.

  "If I carve this in wood," Núria says, "it is an 'a'. If I type it on a screen, it is an 'a'. If I draw it in the air, it is an 'a'. But if I ask you to name it without the wood, without the screen, without the air... it is nothing. You are asking for the spirit without the body."

  Henderson looks at the glowing paper. He looks at the perfect circle on the wall. He looks at the word *platform*. He does not speak. The clock on the wall ticks. The projector hums. The glyph waits. It is ready to be an 'a'. It is ready to be an 'o'. It is ready to be nothing at all.

  Núria puts the paper down. The tender closes Friday. She will lose the contract. She knows this now. The Registry will not encode a ghost. But as she packs her bag, she notices something. On the notepad, her wobbly hand-drawn circle looks more like an 'a' than the perfect projection on the wall. The imperfection gives it the spine. The mistake gives it the history.

  She leaves the room. The door clicks shut. On the wall, the circle remains, glowing in the dust motes, perfectly round, perfectly ambiguous, waiting for a word to tell it what to be.
