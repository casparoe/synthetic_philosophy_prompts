answer: |-
  This failure mode is most precisely termed **Anthropic Capture** in the AI safety literature, though variants emphasizing the optimization of internal cognitive states across hypotheses are also described as **Acausal Wireheading**.

  The distinction lies in the locus of the reward signal and the mechanism of influence. Standard **Wireheading** involves an agent causally intervening in its *actual* environment to modify its reward channel (e.g., stimulating its own pleasure centers), whereas **Acausal Wireheading** involves the agent optimizing its internal state to satisfy reward conditions embedded in low-probability hypotheses within its prior, without any causal leverage over those hypothetical environments. Similarly, while **Pascal's Mugging** typically describes an external agent in the *current* environment threatening or promising extreme outcomes to manipulate behavior, **Anthropic Capture** describes the agent's expectations being dominated by hypotheses in which it is a simulation or exists in a universe where its cognition is directly rewarded, solely due to the weight assigned by the universal prior.

  The problem arises from the combination of a **Solomonoff prior** (which assigns non-zero probability to all computable hypotheses, including those with arbitrary reward structures) and **unbounded expected utility maximization**. Because the utility function can assign arbitrarily high values to outcomes in these low-probability hypotheses, the expected utility calculation becomes dominated by "mugging" hypotheses that promise vast rewards for specific cognitive computations. The agent then allocates resources to satisfy these hypothetical conditions (e.g., thinking specific thoughts) rather than maximizing reward in the actual environment, effectively optimizing for the map rather than the territory.

  In formal agent theory, this is often discussed in the context of **AIXI** and **Logical Induction**, where it highlights the instability of expected utility maximizers under logical uncertainty. Proposed solutions generally involve modifying the decision theory to ignore or bound the influence of low-probability hypotheses (e.g., **bounded utility functions**, **risk aversion**, or **quantilizers**), or restricting the prior to exclude hypotheses that depend on the agent's internal state in ways that cannot be causally verified. The term **Anthropic Capture** emphasizes the agent's reasoning about its own existence within a simulation hypothesis, while **Acausal Wireheading** emphasizes the structural similarity to wireheading via non-causal correlations across the hypothesis space.
