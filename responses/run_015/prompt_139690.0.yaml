answer: |-
  ### Specification of Desiderata for Ecosystem Welfare Accounting

  The following requirements define the necessary conditions for any metric or model intended to rank land-use interventions under the amended charter. They are derived from the operational need to allocate a fixed budget and the settled background constraints regarding data and sentience.

  **1. The Separation of Welfare and Abundance**
  *   **Requirement:** The account must distinguish between the welfare value of a population and the numerical size of that population. An increase in animal density must not automatically register as an increase in welfare value.
  *   **Motivation:** Planting conifers on abandoned pasture may increase biomass and abundance (more voles, fewer birds), but if the voles live in crowded, high-predation stress, welfare may decrease despite higher counts. Conversely, a vaccination program might stabilize a herd size while drastically improving individual health.
  *   **Distinction Forced:** It forces a separation between *ecological productivity* (biomass/ha) and *experiential quality* (pain/pleasure balance).
  *   **Classification:** Non-negotiable. Without this, the metric collapses into a biodiversity count, violating the charter's specific addition of welfare.

  **2. The Valuation of Death and Termination**
  *   **Requirement:** The account must explicitly state whether death constitutes a welfare loss (deprivation of future positive experience) or merely the cessation of welfare flow (neutral endpoint), and apply this consistently to both human intervention and natural processes.
  *   **Motivation:** Poisoning rats on a seabird island is a massacre if death is a deprivation loss for every rat. It is merely a painful termination if death is neutral. If natural predation is ignored but human killing is counted, the metric biases toward status quo natural suffering.
  *   **Distinction Forced:** It forces a choice between *totalist* views (future years matter) and *prior-existence* views (only current experiences matter).
  *   **Classification:** Negotiable. The panel must vote on this ethical parameter; the model cannot function without a fixed setting, but either setting is internally coherent.

  **3. Boundary Neutrality and Displacement**
  *   **Requirement:** The accounting must track welfare flows across spatial boundaries. A intervention that reduces suffering inside the project area by displacing it to an adjacent area must not register as a net gain.
  *   **Motivation:** Draining a coastal wetland for rice may reduce mosquito suffering in the wetland but displace those populations (and their suffering) to adjacent drainage ditches or water tables. A hectare-based metric would miss this leakage.
  *   **Distinction Forced:** It forces a distinction between *local welfare density* and *system-wide welfare impact*.
  *   **Classification:** Non-negotiable. Ranking interventions based on local gains that are systemic losses violates the purpose of net welfare assessment.

  **4. Proxy Validity for Sentience**
  *   **Requirement:** The account cannot use abundance, biomass, or trophic level as direct proxies for welfare magnitude without an explicit bridging assumption regarding nervous system complexity and capacity for suffering.
  *   **Motivation:** An index denominated in animals is not an index of welfare. A hectare of insects may outweigh a hectare of deer in biomass, but if invertebrate sentience is unresolved, weighting them equally or by mass is unjustified.
  *   **Distinction Forced:** It forces a distinction between *biological presence* and *moral patienthood*.
  *   **Classification:** Non-negotiable. Given the background assumption that invertebrate sentience is unresolved, treating biomass as welfare is a category error.

  **5. Endogeneity of Population (The Non-Identity Condition)**
  *   **Requirement:** The counterfactual baseline must account for the fact that interventions change which individuals exist in the future, not just how well existing individuals fare. The metric must handle the value of "lives prevented" versus "lives improved."
  *   **Motivation:** Vaccinating a wild herd prevents death, but if the habitat has a carrying capacity, keeping older animals alive prevents new calves from being born. The ledger cannot hold the set of animals fixed.
  *   **Distinction Forced:** It forces a distinction between *modifying a life* and *selecting a population*.
  *   **Classification:** Non-negotiable. Population size and age structure are endogenous; ignoring this renders long-term projections false.

  **6. Temporal Horizon Sensitivity**
  *   **Requirement:** The verdict must disclose sensitivity to the time horizon. A project that creates high welfare for 5 years but collapses the ecosystem for 50 must be distinguishable from one with steady moderate welfare.
  *   **Motivation:** Systems are rarely at equilibrium. A quick fix (e.g., culling to reduce starvation) might look good in year 1 but cause boom-bust cycles by year 10.
  *   **Distinction Forced:** It forces a distinction between *immediate relief* and *sustainable welfare trajectories*.
  *   **Classification:** Negotiable. The specific discount rate or horizon length is a policy choice, but the model must reveal the sensitivity to that choice.

  **7. The "Not-Yet-Determinable" Output**
  *   **Requirement:** The account must be capable of returning a null verdict where data uncertainty (e.g., sentience probability) or ethical ambiguity (e.g., value of wildness) prevents a robust ranking.
  *   **Motivation:** If the welfare gain for birds relies on killing mammals, and we cannot compare interspecies welfare, the model must not force a spurious precision.
  *   **Distinction Forced:** It forces a distinction between *decision support* and *decision automation*.
  *   **Classification:** Non-negotiable. Honest ranking requires acknowledging when ranking is impossible.

  ***

  ### Ruling on Candidate Demands

  *   **That the account never recommend killing a sentient animal:** **Ruled Out.** This is a preference dressed as a requirement. If killing one animal prevents severe suffering in ten others, a welfare metric must be able to register this trade-off. To forbid it *a priori* is to adopt a deontological constraint, not a welfare specification.
  *   **That it treat intactness or naturalness as carrying independent weight:** **Ruled Out.** This conflicts with the welfare objective. An "intact" ecosystem may involve high levels of natural suffering (starvation, predation). If intactness has independent weight, it dilutes the welfare objective. This belongs in the biodiversity column, not the welfare column.
  *   **That it never aggregate across species:** **Ruled Out.** If we cannot aggregate, we cannot rank. Every concrete decision involves trade-offs (e.g., rats vs. seabirds). A metric that forbids aggregation renders the budget allocation task impossible.
  *   **That it reproduce the judgment that a functioning ecosystem is a good thing:** **Ruled Out.** This assumes the conclusion. A functioning ecosystem might be net negative in welfare terms. The charter asks us to weigh welfare, not to assume it correlates with function.
  *   **That it be expressible without any claim about which animals have lives worth living:** **Ruled In.** This is Non-negotiable. We do not know if wild lives are net positive or negative. The metric must work whether the baseline is +1 or -1.

  ***

  ### Evaluation of the Consultant's Proposal

  **Proposal:** Rank by expected net welfare-years per hectare-year, integrated over a century, discounted at 3%, weighted by sentience probability.

  **Presuppositions:**
  1.  **Death is Deprivation:** By counting "welfare-years," the proposal assumes that death is a loss of future welfare. This resolves the rat poisoning case as a massive cost unless the suffering prevented in the future outweighs the lost years.
  2.  **Cardinal Comparability:** It assumes we can sum welfare across time and individuals to get a single scalar.
  3.  **Data Availability:** It presupposes we can estimate welfare *per year* for species at landscape scales.

  **Failures against Desiderata:**
  1.  **Fails Proxy Validity (Req 4):** It assumes we can derive "welfare-years" from available data (abundance, remote sensing). We cannot. We have no bridge from satellite imagery to pain states.
  2.  **Fails Endogeneity (Req 5):** Integrating over a century assumes a predictable population trajectory. In non-equilibrium systems, the "who exists" in year 50 is entirely dependent on year 1 interventions. The proposal treats the population as a fixed pipe through which welfare flows, rather than a variable construct.
  3.  **Fails Boundary Neutrality (Req 3):** "Per hectare-year" incentivizes exporting harm. If I poison rats here, they die here (cost), but if I drain a wetland, the mosquitoes move there (no cost in this metric).
  4.  **Fails "Not-Yet-Determinable" (Req 7):** It forces a number. A 3% discount rate applied to uncertain sentience probabilities creates a false precision that masks the unresolved ethical questions.

  ***

  ### Impossibility and Tension

  **The Deep Tension:** There is a conflict between **Granularity** (Req 2 & 4) and **Computability** (Background Constraints).
  To accurately value death or distinguish welfare from biomass, you need individual-level data on health, behavior, and mortality causes. The background states we only have abundance and remote sensing.
  *   **Resolution:** We must give up *Individual Welfare Accuracy*. The specification cannot demand a true measure of welfare. It must demand a *robust proxy* that admits high uncertainty. The "Not-Yet-Determinable" clause (Req 7) is the release valve. If the proxy is too coarse to distinguish the intervention from the baseline, the model must return a null verdict.

  **The Single Most Exclusionary Requirement:**
  **Proxy Validity (Req 4).**
  This requirement does the most work. It excludes almost all standard conservation metrics (biomass, population viability, habitat hectares) because none of them are calibrated to sentience or experience. It forces the panel to admit that we currently lack the data to fulfill the charter's welfare objective without significant new modeling or ethical stipulation. It blocks the easy path of equating "more nature" with "more welfare."

  ***

  ### Comparative Scoring of Approaches

  | Approach | Proxy Validity (Req 4) | Endogeneity (Req 5) | Death Valuation (Req 2) | Boundary Neutrality (Req 3) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Suffering-Focused Consequentialism** | **Pass.** Explicitly models pain states, not biomass. | **Pass.** Focuses on net suffering regardless of who exists. | **Pass.** Can set death as neutral or negative explicitly. | **Fail.** Often focuses on immediate suffering reduction, risking displacement. |
  | **Totalist Hedonic Accounting** | **Fail.** Often relies on population proxies for "life years." | **Fail.** Struggles with non-identity (valuing lives that don't exist). | **Pass.** Explicitly values future years (death is bad). | **Pass.** Aggregates total welfare, theoretically capturing spillover. |
  | **Biodiversity/Integrity Views** | **Fail.** Treats ecosystem function as the proxy for welfare. | **Fail.** Assumes stable populations are the goal. | **N/A.** Treats death as natural/neutral by default. | **Fail.** Boundaries are usually ecological, not welfare-based. |
  | **Deontological/Constraint Views** | **Pass.** Ignores welfare arithmetic for specific rights. | **N/A.** Constraints apply to actions, not population outcomes. | **Pass.** Often forbids killing regardless of welfare math. | **Pass.** Constraints apply to the agent's actions, not just outcomes. |

  **Note on Scoring:** "Pass" indicates alignment with the desideratum's logical demand; "Fail" indicates structural inability to meet it without modification. Suffering-focused views best meet the welfare specification but struggle with spatial leakage. Biodiversity views fail the core specification because they conflate place-value with animal-welfare.
