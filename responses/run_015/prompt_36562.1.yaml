answer: |-
  # SOP-GeoProb-01: Selection of Geometric Sampling Measures for Circular Domains

  **Effective Date:** Immediate  
  **Audience:** Risk Analysis & Reliability Engineering Group  
  **Purpose:** To standardize the selection of Monte Carlo sampling schemes for scenarios involving random lines or chords intersecting a circular region. This procedure eliminates ambiguity arising from Bertrand-type paradoxes by tying the mathematical measure to the physical generating mechanism.  
  **Time Requirement:** ~15 Minutes per scenario.

  ---

  ## Part 1: The Decision Procedure

  **Instructions:** Two analysts working independently on the same physical description must arrive at the same sampling function. Answer the following questions in order. Do not skip ahead. If a question cannot be answered with the available physical data, proceed to Part 3 (Bracketing Protocol).

  ### Phase 1: Mechanism Interrogation

  **Q1. What is the physical origin of the line?**
  *   **A. Boundary-Initiated:** The line starts at the edge of the circle (e.g., a crack nucleating at a weld toe, a connection between two boundary points).
      *   $\rightarrow$ Go to **Q2**.
  *   **B. Space-Intersecting:** The line exists in the surrounding space and intersects the circle (e.g., a falling tool, a debris trajectory, an external fault path).
      *   $\rightarrow$ Go to **Q3**.
  *   **C. Interior-Initiated:** The line originates from a point within the circle's area (e.g., a void growing bidirectionally, an internal defect).
      *   $\rightarrow$ Go to **Q4**.
  *   **D. Unknown/Unknowable:** The physics of initiation are opaque, proprietary, or data is absent.
      *   $\rightarrow$ **STOP.** Proceed to **Part 3 (Bracketing Protocol)**.

  **Q2. (For Boundary-Initiated) How is the termination point determined?**
  *   **A. Random Propagation Angle:** The line starts at a uniform point on the rim and propagates at a uniform angle relative to the tangent/normal.
      *   $\rightarrow$ **Verdict:** Use **Measure E (Endpoint-Uniform)**.
      *   *Justification:* Uniform start + Uniform angle maps mathematically to choosing two independent uniform points on the circumference.
      *   *Implementation:* Sample $\theta_1, \theta_2 \sim U[0, 2\pi)$. Chord connects $(R, \theta_1)$ and $(R, \theta_2)$.
  *   **B. Fixed Target:** The line connects to a specific opposing feature (not random).
      *   $\rightarrow$ **Verdict:** Not a random chord problem. Model deterministically.
  *   **C. Unknown:** You do not know if the propagation angle is uniform or biased by stress fields.
      *   $\rightarrow$ **STOP.** Proceed to **Part 3 (Bracketing Protocol)**.

  **Q3. (For Space-Intersecting) Is the line's position and orientation isotropic in the surrounding space?**
  *   **A. Yes:** The line is equally likely to pass through any region of the plane/space, and all angles are equally likely (e.g., debris in a turbulent flow, a tool dropped without orientation bias).
      *   $\rightarrow$ **Verdict:** Use **Measure O (Offset-Uniform / IUR)**.
      *   *Justification:* This corresponds to the Isotropic Uniform Random (IUR) line measure, invariant under translation and rotation of the plane.
      *   *Implementation:* Sample $\phi \sim U[0, \pi)$ and $p \sim U[0, R]$. Chord is defined by normal angle $\phi$ and perpendicular distance $p$ from center.
  *   **B. No:** There is a preferred direction or density gradient (e.g., debris falling vertically, stress-aligned faults).
      *   $\rightarrow$ **Verdict:** Custom Weighted Sampling.
      *   *Action:* Do not use standard chord samplers. Define a probability density function $f(\phi, p)$ based on the known bias.
  *   **C. Unknown:** You do not know if the trajectory is isotropic.
      *   $\rightarrow$ **STOP.** Proceed to **Part 3 (Bracketing Protocol)**.

  **Q4. (For Interior-Initiated) What parameter is uniformly distributed?**
  *   **A. Defect Location:** The center (midpoint) of the line is uniformly distributed over the circle's area.
      *   $\rightarrow$ **Verdict:** Use **Measure M (Midpoint-Uniform)**.
      *   *Justification:* Uniform spatial density of initiation sites implies uniform distribution of chord midpoints.
      *   *Implementation:* Sample midpoint $(r, \theta)$ with density proportional to $r$ (i.e., $\sqrt{U[0,1]} \cdot R$ for radius). Sample orientation $\phi \sim U[0, \pi)$.
  *   **B. Unknown:** You do not know the spatial distribution of initiation sites.
      *   $\rightarrow$ **STOP.** Proceed to **Part 3 (Bracketing Protocol)**.

  ---

  ## Part 2: The "No Principled Answer" Protocol

  If you reached **STOP** in Phase 1, do not select a measure. Selecting a measure without physical justification introduces hidden bias. Instead, execute the **Bracketing Protocol**.

  **Step 1: Run the Triad.**
  Run the simulation three times using the three standard measures:
  1.  **Measure E** (Endpoint-Uniform)
  2.  **Measure O** (Offset-Uniform)
  3.  **Measure M** (Midpoint-Uniform)

  **Step 2: Calculate the Bound.**
  Report the result not as a single probability $P$, but as an interval $[P_{min}, P_{max}]$ spanned by the three results.

  **Step 3: Client Deliverable Language.**
  Do not say "We don't know." Use the following standard phrasing:
  > *"The physical mechanism governing [Scenario Name] is currently under-constrained by available data. Consequently, the probability of failure is reported as a bounded range $[P_{min}, P_{max}]$. This range represents the variance in outcome due to plausible geometric sampling assumptions. Reducing this uncertainty requires empirical data regarding [Specific Missing Parameter, e.g., crack nucleation distribution]."*

  **Step 4: Data Request.**
  Specify exactly what physical measurement would collapse the bracket (e.g., "Microscopy data on crack nucleation sites" or "High-speed video of tool drop orientation").

  ---

  ## Part 3: Worked Applications

  ### Case A: Fatigue Crack in Pipe Weld
  *   **Scenario:** Crack nucleates at a random point on the weld circumference and propagates inward across the pipe cross-section.
  *   **Q1 (Origin):** Boundary-Initiated (Nucleates on circumference). $\rightarrow$ Go to Q2.
  *   **Q2 (Termination):** Propagation angle is not specified by stress analysis; treated as random for conservative bounding. Assumption: Uniform propagation angle relative to surface normal.
  *   **Verdict:** **Measure E (Endpoint-Uniform)**.
  *   **Code:** `theta1 = uniform(0, 2pi); theta2 = uniform(0, 2pi);`
  *   **Reasoning:** A fixed start point with uniform angle is mathematically equivalent to two random endpoints on the circle due to rotational symmetry.

  ### Case B: Dropped Tool on Viewport
  *   **Scenario:** A straight-edged tool is dropped onto a circular viewport. We model the scratch as a line segment intersecting the circle.
  *   **Q1 (Origin):** Space-Intersecting (Tool comes from outside). $\rightarrow$ Go to Q3.
  *   **Q3 (Isotropy):** Drop is from a height with tumbling; no preferred orientation or impact point relative to the viewport center is known. Assumption: Isotropic Uniform Random.
  *   **Verdict:** **Measure O (Offset-Uniform)**.
  *   **Code:** `p = uniform(0, R); phi = uniform(0, pi);`
  *   **Reasoning:** Lines in space intersecting a convex body are uniquely defined by the IUR measure (invariant under translation/rotation of the dropping apparatus).

  ### Case C: Composite Material Delamination
  *   **Scenario:** A straight-line delamination occurs in a circular composite patch. Client states initiation physics are proprietary and no data on location/orientation is available.
  *   **Q1 (Origin):** Unknown/Unknowable.
  *   **Verdict:** **STOP. Execute Bracketing Protocol.**
  *   **Action:** Run Measures E, O, and M.
  *   **Deliverable:** "Probability of severance is between 0.25 and 0.50. Range driven by uncertainty in delamination initiation mechanism. Recommendation: X-ray tomography of failed coupons to determine midpoint distribution."

  ---

  ## Part 4: Honest Annotation (For Model Documentation)

  *This section must be included in the internal model report to flag where human judgment entered the procedure.*

  | Procedure Step | Type | Analyst Note Requirement |
  | :--- | :--- | :--- |
  | **Q1 (Origin)** | **Fact Check** | Cite the physical report or drawing that defines the origin. |
  | **Q2/Q3/Q4 (Uniformity)** | **Judgment Call** | **CRITICAL:** State explicitly: "We assume uniformity in [Parameter] due to [Lack of Data / Symmetry Argument]." This is where the philosophical choice is made. |
  | **Isotropy Check (Q3)** | **Physics Check** | Verify if external fields (gravity, stress) break rotational symmetry. If ignored, document why. |
  | **Bracketing Decision** | **Risk Decision** | If bracketing is chosen, document the cost/benefit analysis of not acquiring the missing data. |

  **Warning:** Steps Q2, Q3, and Q4 ask about "Uniformity." In physics, nothing is perfectly uniform. When you answer "Yes," you are asserting that deviations from uniformity are negligible for the risk calculation. If you are unsure, you must default to **Part 3 (Bracketing)**.

  ---

  ## Part 5: Limitations & Invariance Statement

  **What This Procedure Cannot Do:**
  1.  **It Cannot Fix Bad Physics:** If the physical description is wrong (e.g., the crack is curved, not straight), the sampling measure is irrelevant.
  2.  **It Cannot Resolve Conflicting Symmetries:** If a scenario has rotational symmetry (suggesting Offset-Uniform) but the boundary conditions imply fixed endpoints (suggesting Endpoint-Uniform), the procedure forces a Bracketing outcome. Do not attempt to average the measures.
  3.  **Invariance is Not Truth:** Arguments based on "Maximum Entropy" or "Scale Invariance" (e.g., Jaynes' resolution of Bertrand's Paradox) are mathematical preferences, not physical laws. This procedure prioritizes **mechanism** over **invariance**. If the mechanism is unknown, invariance arguments are insufficient to collapse the bracket; they merely select one bound over another without empirical justification.

  **When Symmetries Conflict:**
  If the physical setup suggests translation invariance (Measure O) but the client specifies boundary nucleation (Measure E), do not blend them. The boundary specification overrides the translation invariance. If the specification is ambiguous, Bracket.

  ---

  ## Part 6: Documentation Standard (Audit Trail)

  *Copy and paste this block into the model metadata for every simulation involving geometric probability.*

  ```text
  GEOMETRIC SAMPLING LOG
  ----------------------
  Scenario ID: [e.g., PIPE-WELD-04]
  Date: [YYYY-MM-DD]
  Analyst: [Name]

  1. Mechanism Class: [Boundary / Space / Interior / Unknown]
  2. Selected Measure: [Endpoint-Uniform / Offset-Uniform / Midpoint-Uniform / Bracketed]
  3. Justification for Uniformity: 
     [e.g., "Assumed uniform propagation angle due to lack of stress field data."]
  4. Symmetry Assumptions: 
     [e.g., "Assumed rotational invariance of drop trajectory."]
  5. Failure Condition for Assumption: 
     [e.g., "This measure is invalid if stress concentrations exceed 2x yield at nucleation site."]
  6. Bracketing Range (if applicable): [Min Prob] to [Max Prob]
  ```

  **Audit Instruction:** A reviewer should be able to look at Line 3 and Line 5 and determine if the assumption was reasonable for the specific client context without re-deriving the probability theory.
