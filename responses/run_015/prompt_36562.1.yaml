prompt: |-
  I am a senior risk analyst at an engineering consultancy. A recurring part of my job is Monte Carlo simulation for failure and reliability analysis, and several times a month a model comes up in which someone has to generate random straight lines or chords through a circular cross-section: fatigue-crack paths across a pipe weld, a scratch left by a dropped tool across a circular viewport, debris modeled as a straight-line cut through a containment boundary, an arc-fault path crossing a circular electrode. Last quarter an internal review caught two of our analysts modeling what was nominally the same scenario — a random crack traversing a circular weld region — with two different chord samplers: one drew the two endpoints independently and uniformly on the circumference, the other drew the crack's direction uniformly and its perpendicular distance from the center uniformly. For the probability of the crack severing an inscribed safety zone they got what look like the classic one-third and one-half answers, which was enough for the review to question every geometric-probability figure we have ever issued.

  As I understand it, the underlying problem is Bertrand's paradox: a random chord of a circle is not a well-defined object until you specify the mechanism that generates it, and uniform sampling over different natural parameters (endpoints, midpoint, direction and offset) induces genuinely different probability measures. The principle of indifference — treat all possibilities as equally likely when you have no reason to prefer one — cannot arbitrate, because it is silent about which description of the possibilities to be indifferent over. When two of my engineers code what the client calls the same event and get different numbers, the disagreement is not an error either of them made; it is a choice about what random means that nobody made consciously.

  I want you to write a decision procedure that my group can actually run at the start of a simulation build, in roughly fifteen minutes, without any background in philosophy. The procedure should take as input a physical scenario involving lines or chords and a circular region, and output either a specific sampling scheme with a defensible justification, or an explicit finding that no principled choice exists, in which case it should say what to do instead — presumably bracketing the answer across the plausible measures and flagging what physical data would collapse the bracket. In detail, I am asking for:

  1. The questions, in order, that the analyst should ask about the scenario, and what counts as a sufficient answer to each. I expect the core of the procedure to be an interrogation of the physical generating process behind the randomness — what mechanism actually produces the line, and hence which parameter that mechanism plausibly treats as uniform — with symmetry and invariance considerations doing the work when the mechanism is only partly known. The ordering matters: some questions should be able to settle the choice early, and some should be able to kill the choice early.

  2. Points where the procedure stops with a definite verdict of no principled answer, and what the deliverable to the client looks like in that case — including how to present a probability that is only defined to within a band without it sounding like we do not know how to do our jobs.

  3. Worked applications to three cases: (a) a fatigue crack that nucleates at a random point on the weld circumference and propagates inward; (b) a scratch from a dropped tool that is better modeled as a line segment whose position and orientation over the whole region are, as far as we know, uniform; and (c) a case where the generating mechanism is genuinely unknown — say, a crack in a composite whose initiation physics our client does not understand and has no data on. Case (c) should be the one where the procedure returns the answer I will not like.

  4. An honest annotation of the procedure: which steps are real tests with determinate outputs, and which are judgment calls dressed up as procedure, so that my analysts know where they are still making the philosophical choice themselves and should say so in the model documentation.

  5. A statement of what the procedure cannot do. In particular, I want you to address whether the invariance-style arguments that sometimes pick out a unique measure in these problems actually resolve the choice or merely relocate it, and what the procedure does when the symmetries of the physical setup underdetermine or, worse, conflict.

  The vocabulary should be operational throughout — my analysts are engineers, not philosophers, and the procedure should translate whatever the principle of indifference and its critics have to say into questions they can ask about nucleation sites, tooling, and drop heights, with the philosophical content surfacing only where it genuinely changes what they do. The final test the procedure must pass: two analysts given the same physical scenario, different codebases, and no communication should reach the same number or the same documented refusal. I would also like a short paragraph on how to document each run so that a reviewer can audit the measure choice later without reconstructing the whole reasoning — a record of the mechanism assumption, the parameter it was made over, and what would have to be true physically for the assumption to fail. Please do not give me a reading list; give me the thing my team can run on Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Senior Risk Analyst at an engineering consultancy.
      *   **Problem:** Recurring issue with Monte Carlo simulations involving random chords/lines in circles (Bertrand's Paradox scenarios). Different analysts use different sampling methods (endpoints vs. distance/angle), leading to different probabilities (1/3 vs. 1/2, etc.), causing internal review issues.
      *   **Goal:** A 15-minute decision procedure for analysts to select the correct sampling scheme based on the physical scenario, or to identify when no principled choice exists (requiring bracketing).
      *   **Requirements:**
          1.  Ordered questions (interrogating physical generating process).
          2.  Stop points for "no principled answer" and client deliverable format.
          3.  Worked examples (Fatigue crack, Dropped tool, Unknown composite crack).
          4.  Honest annotation (real tests vs. judgment calls).
          5.  Limitations statement (invariance arguments, symmetry conflicts).
          6.  Documentation standard (audit trail).
          7.  Tone: Operational, engineering-focused, not philosophical.
          8.  Constraint: Two analysts must reach the same conclusion independently.

  2.  **Deconstruct the Mathematical/Philosophical Core:**
      *   *Bertrand's Paradox:* Random chords aren't unique.
      *   *Common Measures:*
          1.  *Random Endpoints:* Choose two points uniformly on circumference. (Probability of length > $\sqrt{3}R$ is 1/3).
          2.  *Random Radius/Distance:* Choose distance from center uniformly, angle uniformly. (Probability is 1/2).
          3.  *Random Midpoint:* Choose midpoint uniformly within the disk. (Probability is 1/4).
      *   *Resolution:* The "randomness" must come from the physical mechanism.
      *   *Jaynes' Maximum Entropy/Invariance:* Sometimes suggests a unique solution based on scale/translation invariance, but this is often contested or context-dependent.
      *   *Engineering Context:* We need to map physical mechanisms to mathematical parameters.
          *   Crack nucleating on boundary $\rightarrow$ Endpoint fixed, angle random? Or two endpoints?
          *   Dropped tool $\rightarrow$ Line in space intersecting circle (Isotropic Uniform Random Chord - IUR).
          *   Unknown $\rightarrow$ Sensitivity analysis.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask where the line starts. If on edge, use endpoints. If falling from sky, use distance/angle. If don't know, do both.
      *   *Critique 1:* Too vague. "Falling from sky" needs precise geometric translation. Needs to force consensus between two analysts.
      *   *Attempt 2 (Adding Specificity):* Create a flowchart. Q1: Is the origin on the boundary? Q2: Is the orientation isotropic? Q3: Is the position uniform over the area?
      *   *Refinement:* Need to distinguish between "Random Endpoints" (Process A), "Random Radius/Offset" (Process B), and "Random Midpoint" (Process C).
      *   *Key Insight:* The physical mechanism dictates the *invariant measure*.
          *   Mechanism: "Pick two spots on the rim." $\rightarrow$ Uniform Endpoints.
          *   Mechanism: "Throw a long stick at the circle." $\rightarrow$ Uniform Distance/Angle (IUR).
          *   Mechanism: "Defect appears anywhere inside." $\rightarrow$ Uniform Midpoint.

      *   *Addressing the "15 Minute" Constraint:* The questions must be binary or trinary and decisive. No open-ended pondering.
      *   *Addressing the "No Principled Answer" Constraint:* Need a specific protocol for bracketing (Min/Max bounds) and reporting uncertainty as a feature, not a bug.

  4.  **Developing the Sections:**

      *   **Section 1: The Decision Tree (The "Algorithm"):**
          *   Start with the physical origin.
          *   Branch based on boundary vs. interior vs. external.
          *   Branch based on orientation constraints.
          *   Map to specific code functions (e.g., `sample_endpoints`, `sample_offset`).
      *   **Section 2: The "Stop" Condition:**
          *   When physics is opaque.
          *   Deliverable: "Bounded Probability Estimate."
      *   **Section 3: Worked Examples:**
          *   (a) Fatigue: Nucleates on boundary. One point fixed? Or two? Usually one point + angle. Wait, the prompt says "nucleates at random point... propagates inward." This implies one endpoint on boundary, direction random. This is actually *not* standard Bertrand (which is chord through circle). It's a radius/secant. I need to align this with the prompt's "chord" context. Let's assume the crack goes all the way across (chord). If it nucleates on boundary and goes across, is the other end random?
          *   *Correction on (a):* If it nucleates on boundary and propagates *across*, the other end is determined by physics or is random. If the prompt implies "Random chord" modeling a crack, I need to fit the mechanism. Let's interpret (a) as: Crack starts at boundary, ends at boundary. Mechanism: Nucleation site uniform on rim, propagation angle uniform. This maps to *Random Endpoints* (effectively) or *Random Radius* depending on angle definition. Actually, if start is uniform on rim and angle is uniform $[0, \pi]$, this is equivalent to the "Random Midpoint" measure? No.
          *   *Let's check the math:*
              *   Endpoints uniform: $P(L > \sqrt{3}R) = 1/3$.
              *   Distance uniform: $P(L > \sqrt{3}R) = 1/2$.
              *   Midpoint uniform: $P(L > \sqrt{3}R) = 1/4$.
              *   Mechanism: Start point uniform on circumference, Angle uniform $[0, \pi]$. This generates the *Random Endpoints* measure. (Proof: One point fixed by rotation symmetry, other point determined by angle. Uniform angle $\rightarrow$ Uniform arc length for second point).
          *   (b) Dropped tool: Isotropic Uniform Random (IUR) line intersecting the disk. This corresponds to *Random Distance/Angle* (1/2 measure).
          *   (c) Unknown: Bracketing.
      *   **Section 4: Annotations:**
          *   Highlight where "Engineering Judgment" is actually "Measure Selection."
      *   **Section 5: Limitations:**
          *   Invariance isn't magic. It assumes the physics respects the symmetry.
      *   **Section 6: Documentation:**
          *   Standardized log entry.

  5.  **Refining the Tone:**
      *   Avoid words like "epistemology," "ontology," "principle of indifference."
      *   Use words like "mechanism," "parameter," "invariant," "sensitivity," "bound."
      *   Make it look like a Standard Operating Procedure (SOP).

  6.  **Self-Correction/Edge Case Check:**
      *   *Constraint:* Two analysts, no communication, same result.
      *   *Risk:* Ambiguous questions.
      *   *Fix:* Make questions checklist-style with explicit "If/Then" logic.
      *   *Risk:* The "Fatigue" case. If a crack nucleates on the boundary, does it go to a random point on the other side? Or does it follow stress lines? The prompt says "modeled as... random straight lines." I must treat the *model assumption* as the input to the procedure. The procedure validates the *sampling method* for the *assumed randomness*.
      *   *Wait, re-reading prompt:* "A fatigue crack that nucleates at a random point on the weld circumference and propagates inward." If it propagates inward, is it a chord? The prompt implies these are all "chord through circular cross-section" problems. I will treat (a) as a chord where one end is the nucleation site and the other is determined by a random propagation angle.
      *   *Crucial Distinction:* The procedure must distinguish between "The physics dictates the measure" and "We are assuming randomness due to lack of data." The latter triggers the bracketing protocol.

  7.  **Finalizing the Procedure Structure:**
      *   **Title:** SOP-GeoProb-01: Chord Sampling Selection.
      *   **Phase 1: Mechanism Identification (The Questions).**
      *   **Phase 2: Measure Mapping (The Verdict).**
      *   **Phase 3: The "Unknown" Protocol (Bracketing).**
      *   **Annotations & Limitations.**
      *   **Documentation Log.**

  8.  **Drafting the Content (incorporating the "1/3 vs 1/2" specific context):**
      *   Need to explicitly name the three standard measures so analysts can find the code.
      *   Measure 1: **Endpoint-Uniform** (Bertrand Method 1).
      *   Measure 2: **Offset-Uniform** (Bertrand Method 2 / IUR).
      *   Measure 3: **Midpoint-Uniform** (Bertrand Method 3).
      *   *Note:* In engineering, Offset-Uniform (IUR) is usually the default for "lines in space." Endpoint-Uniform is for "connections between boundary points." Midpoint-Uniform is for "defects within a volume."

  9.  **Review against constraints:**
      *   15 mins? Yes, it's a checklist.
      *   No philosophy? Yes, translated to physics.
      *   Worked examples? Yes.
      *   Annotations? Yes.
      *   Limitations? Yes.
      *   Documentation? Yes.

  10. **Final Polish:** Ensure the distinction between "Randomness in the world" vs "Randomness in the model" is clear. The procedure forces the analyst to justify the model randomness via physical mechanism. If they can't, they bracket.

  *(Self-Correction during drafting)*: I need to be careful with the "Fatigue" example. If a crack nucleates on the boundary and propagates, the length is often determined by stress intensity, not just geometry. But the prompt says "modeled as... random straight lines." I will stick to the geometric abstraction provided in the prompt but ensure the sampling matches the *described* abstraction.
  *   Case (a): Nucleates on circumference. Propagates inward. To make a chord, it must exit the other side. If the angle is uniform, this is Endpoint-Uniform.
  *   Case (b): Dropped tool. This is a line in 2D/3D space intersecting the circle. This is Offset-Uniform (IUR).
  *   Case (c): Unknown. Bracket.

