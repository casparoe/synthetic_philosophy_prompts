answer: |-
  Section 1: "The baseline semantics"

  Standard semantics distinguishes conditionals based on world selection. Indicative conditionals operate within an epistemic modal base, quantifying over worlds compatible with the speaker's current knowledge state. If the antecedent is compatible with what is known, the conditional asserts that the consequent holds in those epistemically accessible worlds. This framework prohibits backtracking; it assumes the past and laws are fixed relative to evidence, treating the antecedent as a live possibility within the actual historical timeline. Conversely, counterfactual conditionals employ a causal-historical similarity ordering. They evaluate the antecedent by minimally altering actual history to make the antecedent true, holding the distant past and laws constant while allowing local divergences near the antecedent time. This method often prioritizes similarity in particular facts over general laws when necessary. This creates a sharp divide: indicatives track epistemic possibility given actual history, while counterfactuals track causal possibility by imaginatively rewriting history to accommodate a false antecedent.

  Section 2: "The boundary case and dual-base conditioning"

  "Dual-base conditioning" posits that a conditional sentence carries two accessibility relations: an epistemic relation R_E governing open possibilities for the speaker, and a causal-historical relation R_C governing counterfactual proximity. Consider a negotiator in 2028 asserting, "If the 2030 carbon cap is binding, coastal defenses will be funded by 2035." At this stage, the cap's adoption is open, so R_E includes worlds where the cap passes. By 2033, she learns the cap was never adopted. She now faces a dilemma regarding her original assertion. Under indicative semantics, the learning event eliminates all R_E-worlds where the cap is binding. The conditional becomes vacuously true or pragmatically void because the epistemic base no longer supports the antecedent; the condition is epistemically dead. However, to preserve the insight, she might shift to counterfactual semantics using R_C. This requires constructing worlds where the cap was adopted, which necessitates backtracking against the known history of political failure. Standard semantics gives conflicting guidance: the indicative machinery collapses because the antecedent is known false, rendering the prediction moot, while the counterfactual machinery requires altering the political and economic history she knows to be fact. The dual-base framework exposes this tension by forcing both relations to apply to the same content across a current knowledge update, revealing a gap where the sentence retains meaning despite the indicative base emptying.

  Section 3: "The update asymmetry"

  The core tension lies in how information updates affect the truth conditions of the conditional. With indicative evaluation, learning that the antecedent is false eliminates all R_E-worlds in which it holds. Technically, this renders the conditional vacuously satisfied or undefined within the epistemic base, yet the speaker's prior predictive commitment seems to survive in a revised form. We intuitively really want to say the negotiator was right about the connection between caps and funding, even if the cap failed. With counterfactual evaluation, she can backtrack to worlds where prior conditions, such as political will or economic pressure, differ just enough to make the cap binding. However, this requires treating her very actual past as malleable, contradicting her new knowledge that the political failure was actual. This divergence suggests a deep conflict: is it semantic, meaning the two conditionals have genuinely different truth conditions, or pragmatic, reflecting different speech acts like forward-looking prediction versus retrospective evaluation? If semantic, the sentence changes meaning upon learning the antecedent is false. If pragmatic, the content remains stable while the evaluation context shifts. An agent can fully coherently hold both evaluations only if she distinguishes the epistemic status of the antecedent from the causal strength of the connection. She acknowledges the indicative is moot regarding actual future funding but maintains the counterfactual holds regarding the causal mechanism. However, maintaining both simultaneously risks contradiction if the counterfactual backtracking implies the actual past was different than known, forcing a split between what is known to be true and what is causally possible. This asymmetry reveals that current knowledge updates destroy indicative relevance while preserving counterfactual inquiry.

  Section 4: "Diagnosis of dual-base conditioning"

  Allowing both R_E and R_C in a single evaluation does not fully resolve the tension; rather, it formalizes the paradox. Here, the relations diverge sharply enough to yield contradictory verdicts for the sentence in the context. The indicative base declares the condition irrelevant due to factual falsity, while the counterfactual base declares the connection robust via historical alteration. This suggests the indicative-counterfactual divide is best explained by a difference in the direction of evaluation. Indicatives look forward from the epistemic state, while counterfactuals look backward to rewrite history before projecting forward. If the agent treats the conditional as purely forward-looking, the counterfactual reading is inaccessible once the antecedent is known false. A feature of the case that, if removed, would collapse the distinction back into a ambiguity is the temporal gap between assertion and evaluation. If the negotiator evaluated the conditional immediately upon learning the cap failed, the shift from indicative to counterfactual would be seamless. The tension arises because the assertion was made when the antecedent was epistemically live, creating a commitment that outlasts the epistemic base that supported it, forcing a clash between updated knowledge and retained causal intuition.
