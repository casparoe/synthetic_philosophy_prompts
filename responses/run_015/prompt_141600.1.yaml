  2. *Climate Modelling:* Complex systems, hard to falsify specific events, but high empirical base. Fits your 'Historical Reconstruction' model; science despite predictive uncertainty. It relies on catalogues and past data.
  3. *Phrenology (historical):* Had measurements, catalogues, but false theory. If they corrected errors, was it science then? Your principle suggests yes, until they stopped correcting. This highlights that science is a process, not a permanent status. If they ignored null results, it became Astrology. Phrenology shows science is a process, not status. Each tests a different limb of your hybrid principle.
