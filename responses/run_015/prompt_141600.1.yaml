  Where my verdicts actually leave me
  You are stuck between epistemology and sociology. Your rejection of Astrology and Homeopathy despite their 'methods' suggests outcomes matter more than process. Yet Chronistics survives without predictions because it *works* technologically. This implies instrumental success trumps falsifiability. However, the Company Lab fails despite textbook methods, introducing a sociological constraint: science requires honest reporting, not just correct procedure. Mathematics is excluded because it lacks empirical anchor. You are effectively defining science as 'honest empirical engineering', whether theoretical or descriptive. The discomfort you feel arises because Chronistics lacks the self-correction mechanism you demand of the Company Lab, yet you admit it via its technological fruits. This suggests you distinguish between 'cannot be refuted' (Chronistics) and 'will not be refuted' (Company Lab), though the boundary is dangerously thin. This conflict shows you value results over rules, but only when the community is honest.

  Two or three candidate principles
  1. *The Instrumental Reliability Principle:* A field counts as science if it systematically produces technologies or models that reliably interact with physical reality. This admits Chronistics because the technology works, and Catalogues because measurements are real. It excludes Mathematics and Astrology as they lack physical payoff. The clause 'reliably interact' captures the tech spin-off while rejecting null results. It focuses on the output rather than the logical structure of the theory.
  2. *The Community Integrity Principle:* A field is science only if its social structures incentivise truth over profit or dogma. This excludes the Company Lab, which suppresses contrary data, and Astrology, which ignores null results. It admits Chronistics only if its practitioners are honest about its limitations. The clause 'incentivise truth' handles the biased lab verdict directly. It makes science a social status rather than just a methodological one.
  3. *The Hybrid Principle:* Science is a collaborative enterprise constructing empirical models, governed by norms that prioritise evidence over ideology. This captures the Instrumentalist Theory and Historical Reconstruction. It requires both physical contact and social honesty. The clause 'governed by norms' ensures the Company Lab is excluded even if its data is technically accurate, preserving the sociological dimension you flagged. It attempts to balance the utility of Chronistics with the integrity required to exclude the Lab.

  Where each one overrules me
  Thus, the Instrumental Principle risks classifying all engineering as science, blurring useful distinctions. It might also force you to accept Chronistics without 'gritted teeth', removing your nuanced scepticism. The Integrity Principle might exclude classified research or solitary geniuses who lack community norms. The Hybrid risks circularity: how do we measure 'reliable' without already knowing what science is? You might have to eat your verdict on Chronistics if 'nothing could refute it' implies no error correction is possible, making it indistinguishable from dogma. You may need to accept that Chronistics is 'proto-science' or 'engineering', not pure science. Furthermore, if the Company Lab's results are accidentally true, the Integrity Principle still excludes them, which might feel too harsh on the data itself. Consequently, you may need to separate the practice from the practitioners to resolve this tension fully.

