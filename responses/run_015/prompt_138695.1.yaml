answer: |-
  Here is the session plan. It is designed to leverage the specific cognitive toolkit of Econ/CS undergrads (logic, functions, probability) to make the Frege-Geach problem feel like a type error or a syntax error, rather than a philosophical puzzle.

  ### The Carrying Scenario: "The Toothpaste Norm"
  **The Sentence:** *"It is wrong to leave the cap off the toothpaste."*

  **Why this scenario:**
  *   **Harmless:** No one will derail into first-order debates about abortion, AI, or animal suffering.
  *   **Normative Ambiguity:** Everyone recognizes it as a norm, but it sits on the fence between "mere etiquette" and "moral duty." This makes it perfect for testing what the word *wrong* is doing.
  *   **Embeddable:** It works easily in conditionals and probability statements.
  *   **Unendorsed:** You (the speaker) do not need to endorse it. You can treat it as a data point from "Common Morality."

  ---

  ### Part 1: The Setup (Minutes 0–10)
  **Goal:** Prevent the slide into Relativism. Establish the "Translation Project."

  **What must be in place:**
  1.  **The Function Distinction:** You must establish that the debate is not about *which* moral facts are true, but about *what kind of job* moral sentences do.
      *   *Realist Job:* Describe the world (like "The water is boiling").
      *   *Expressivist Job:* Express a state of the speaker (like "Ouch!" or "Boo!").
  2.  **The Relativism Kill:** You must explicitly decouple Expressivism from Relativism.
      *   *Relativism:* "Wrong" means "Wrong-for-me." (Still truth-apt, just indexical).
      *   *Expressivism:* "Wrong" doesn't try to be true at all. It's a command/attitude.
      *   *Script:* "If I say 'Ouch,' I am not stating a fact that is 'true for me.' I am expressing pain. Expressivism says 'Stealing is wrong' is closer to 'Ouch' than to 'The water is boiling.' It is not relative truth; it is non-truth-apt."
  3.  **The Agreement:** Get the room to agree to play a game. "For the next 30 minutes, we are going to pretend Expressivism is true. Our job is to translate Moral English into Expressivist English without breaking the code."

  **Misconception Check:**
  *   **Cultural Disagreement:** Head this off **here (Minute 5)**.
  *   *Why:* If they think this is about cultures disagreeing, they think it's about conflicting facts.
  *   *Intervention:* "Someone might think this is about cultures disagreeing on facts. It's not. It's about whether there are facts *to* disagree about. We are assuming there are no moral facts. How do we talk then?"

  ---

  ### Part 2: The Simple Assertion (Minutes 10–20)
  **Goal:** Establish the baseline translation.

  1.  **Write on board:** *"It is wrong to leave the cap off the toothpaste."*
  2.  **Ask:** "Under our Expressivist rules, what is the speaker doing?"
  3.  **Target Answer:** "They are expressing disapproval of cap-leaving." (Or "Boo cap-leaving!")
  4.  **Lock this in:** This is the only easy part. Moral sentences = Attitudes.

  ---

  ### Part 3: The Embedding / The Crash (Minutes 20–30)
  **Goal:** Make them *feel* the syntax error.

  1.  **Introduce the Conditional:** Write on board:
      *   *Premise 1:* "If it is wrong to leave the cap off the toothpaste, then it is wrong to squeeze from the middle."
      *   *Premise 2:* "It is wrong to leave the cap off the toothpaste."
      *   *Conclusion:* "Therefore, it is wrong to squeeze from the middle."
  2.  **The Logic Check:** Ask: "Is this argument valid?" (They will say yes. It's Modus Ponens).
  3.  **The Translation Challenge:** "Translate Premise 1 into Expressivist English."
      *   *Realist Translation:* "If Fact A is true, then Fact B is true." (Easy).
      *   *Expressivist Translation:* "If [Boo Cap-Off!], then [Boo Middle-Squeeze!]."
  4.  **The Problem:** Ask them to read the translated Premise 1 out loud.
      *   *Prompt:* "In the simple assertion, 'Boo!' expresses an attitude. But in the 'If' clause, are you expressing an attitude? No. You aren't booing anything yet. You're hypothesizing."
      *   *The Feeling:* "So, in the antecedent, the word 'wrong' has lost its Expressivist meaning. It's acting like a fact. But in the consequent, it acts like an attitude. Have we used the word 'wrong' in two different senses? If so, isn't this the fallacy of equivocation? And if it's equivocation, why is the logic still valid?"

  **Misconception Check:**
  *   **Denying Modus Ponens:** Let someone say this **here (Minute 25)**.
  *   *Why:* It's the natural defensive reaction for a logic-minded group. "Maybe moral logic just isn't classical logic."
  *   *Intervention:* Don't refute it immediately. Ask: "If moral logic doesn't allow Modus Ponens, can we still use it for planning? Can an AI optimize for it?" Let the silence hang. Then move on.

  ---

  ### Part 4: The Probability Wrinkle (Minutes 30–35)
  **Goal:** Deepen the "Proposition-Shaped" requirement using their native tongue (Bayesianism).

  *   **Placement:** This is the **Mid-Session Pivot**. It is not a trap; it is the knockout blow for this audience.
  *   **The Setup:** "You are Bayesians. You deal in credences."
  *   **The Sentence:** *"It is 30% probable that it is wrong to leave the cap off."*
  *   **The Challenge:** "If 'It is wrong' just means 'Boo!', what does '30% Boo!' mean?"
      *   "Am I 30% disposed to boo?" (That's a psychological fact about me, not a moral claim).
      *   "Am I booing 30% of the time?" (Nonsense).
  *   **The Point:** Probabilities attach to *propositions* (things that can be true/false). If you can be uncertain about a moral claim, the claim must be proposition-shaped. If Expressivism says it's *attitude*-shaped, it cannot take probability weights.
  *   **Why this works:** Econ/CS students treat uncertainty as fundamental. Showing that Expressivism breaks probability calculus makes the problem feel technical and fatal, not just semantic.

  **Misconception Check:**
  *   **Add Truth Conditions:** Let them propose this **here (Minute 35)** as the solution.
  *   *Why:* They will want to save the logic. "Okay, so we just assign truth conditions to the attitudes."
  *   *Intervention:* "If you do that, you have abandoned Expressivism. You are now a Realist (or a Quasi-Realist, which is a whole other lecture). The problem isn't that we can't fix it; the problem is the fix kills the theory."

  ---

  ### Part 5: Closing & Diagnostic (Minutes 35–45)
  **Goal:** Verify understanding and set boundaries.

  **The Closing Question:**
  Do not ask "What is the Frege-Geach problem?"
  Ask this instead:
  > *"I want to say: 'I believe lying is wrong, but I might be mistaken.' Under strict Expressivism, explain why this sentence is incoherent without using the word 'truth'."*

  *   **What you're looking for:** They should identify that "believing X is wrong" = "Having an attitude against X." "Might be mistaken" = "My attitude might not match the facts." If there are no facts (Expressivism), you can't be mistaken about the attitude, only inconsistent. They need to spot the tension between *holding an attitude* and *acknowledging fallibility*.

  **Topics to Flat-Out Refuse:**
  1.  **Quasi-Realism (Blackburn/Gibbard):** If they ask "Can't we just project the attitudes?", shut it down. "That is the solution to the problem, not the problem itself. We are here to break the code, not patch it."
  2.  **Error Theory:** If they say "So all moral statements are false?", correct them. "No, Expressivism says they aren't even the *kind* of thing that can be false. That's a category error, not an error theory."
  3.  **Evolutionary Debunking:** If they ask "Does evolution explain why we have these attitudes?", stop it. "That explains the cause of the attitude, not the logic of the sentence. Don't confuse genealogy with semantics."

  ### Summary of Dependencies
  1.  **Minute 5:** Must kill Relativism before introducing Expressivism, or they will think "Boo!" means "True for me."
  2.  **Minute 20:** Must establish the "Simple Translation" (Wrong = Boo) before embedding it, or the crash won't land.
  3.  **Minute 25:** Let them suggest breaking Modus Ponens, but show the cost (planning/AI).
  4.  **Minute 30:** Use Probability to show that attitudes don't fit into Bayesian slots (resonates with Econ/CS).
  5.  **Minute 35:** Let them suggest Truth Conditions as the fix, then reveal that this abandons the theory.

  ### Instructor Note
  Your role is not to defend Expressivism. Your role is to act as the "Compiler." When they try to run the Expressivist code through a Logic/Probability compiler, you simply point out the Syntax Error. Let *them* feel the frustration of the type mismatch. That is how they will feel the problem.
