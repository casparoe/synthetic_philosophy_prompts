      *   **Conflict:** Member R designed the mapping system but refuses public authorship. She wants Lead M to sign a private document acknowledging M's authority derives from R's method. M refuses, wanting public, mutual recognition. R sees public recognition as consumption of her labor for the group's image; M sees private contracts as making her a "secret master."
      *   **Task:** Write a dialogue between two people arguing about this situation.
      *   **Constraint 1:** Don't just have them talk past each other (real exchange).
      *   **Constraint 2:** Don't end in a stalemate. Take a committed stance on whether hidden dependency can be stable without mutual visibility.
