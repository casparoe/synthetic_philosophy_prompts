answer: |-
  This is a structural audit of your colleague's analogy. We are not asking whether you *should* adapt, but whether the *reason* your colleague gave (the "Rule of the Road" analogy) logically holds up for queueing, tipping, and crossing.

  To do this, we first need to define the philosophical machinery your colleague is using.

  ### Glossary of Terms
  *   **Conventionalism:** The theory that certain rules are binding not because they are inherently moral, but because there is an agreement (explicit or implicit) to follow them.
  *   **Coordination Equilibrium:** A situation where everyone benefits only if everyone does the same thing (e.g., everyone drives on the right). The specific choice matters less than the uniformity.
  *   **Fair Play Principle:** The idea that if you benefit from a cooperative system, you have an obligation to follow its rules so you don't "free ride" on others' cooperation.
  *   **Causal Impotence:** The argument that a single individual's action (like one car driving on the left) makes no measurable difference to the overall outcome, so the individual is not responsible for the harm.
  *   **Rule Utilitarianism:** The view that we should follow rules that generally produce the best outcomes, even if breaking them in a specific instance might seem harmless.

  ---

  ### 1. The Correspondence Table

  Your colleague argues that Local Norms = Road Rules. Here is how the features map across the four cases.

  | Feature | Road Rules (The Analogy) | Queueing (Local Norm) | Tipping (Local Norm) | Crossing (Local Norm) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Arbitrary Content** | **High.** Left or right works equally well physically. | **Medium.** First-come or "pushy" both work, but mixtures cause friction. | **Low.** Tipping is tied to wage structures, not just habit. | **Medium.** Corners or mid-block both work, but mixtures cause risk. |
  | **Mutual Expectations** | **Critical.** I drive right because I expect *you* to drive right. | **High.** I wait because I expect *you* to wait. | **Variable.** I tip because I expect the *system* to pay you, or vice versa. | **High.** I stop because I expect *cars* to expect me to stop. |
  | **Payoff from Coordinating** | **Safety & Flow.** Everyone gets home alive and faster. | **Fairness & Order.** Everyone gets served without conflict. | **Income Distribution.** Workers get paid; customers get service. | **Safety & Flow.** Pedestrians and cars avoid collision. |
  | **Harm from Deviating** | **Catastrophic.** Head-on collision. | **Moderate.** Conflict, anger, line jumping. | **Economic.** Worker loses income; social friction. | **High.** Physical injury or death. |
  | **Law & Enforcement** | **Codified.** Police, fines, license revocation. | **Social.** Glares, verbal confrontation, rarely legal. | **Economic/Social.** Wage laws vary; social shame. | **Mixed.** Often codified (jaywalking laws), rarely enforced. |
  | **Visitor Situation** | **Bound.** You use the roads, you follow the rules. | **Bound?** You use the service, do you follow the queue? | **Bound?** You receive service, do you pay the local wage supplement? | **Bound.** You use the streets, you follow traffic safety. |

  ---

  ### 2. Feature Analysis: Matches and Mismatches

  Your intuition is correct: these three norms are different kinds of things. The road-rule analogy fits them unevenly.

  **Queueing (Strong Match)**
  *   **Shared Feature:** This is a pure **Coordination Equilibrium**. Like driving, the specific method (strict line vs. loose crowd) matters less than everyone doing the *same* method. If half the people queue strictly and half push, the system fails.
  *   **Mismatch:** Enforcement is social, not legal. However, the *obligation* structure is identical to road rules: you follow the local flow to prevent friction.

  **Crossing the Street (Moderate Match)**
  *   **Shared Feature:** This involves physical risk and predictability, much like driving.
  *   **Mismatch:** Road rules for drivers are strict liability (you are wrong if you hit someone). Pedestrian norms are often probabilistic (risk assessment). In many cities, "crossing wherever" is legal provided you yield. The analogy holds on *safety*, but fails on *arbitrariness*. Crossing at a corner is safer than mid-block; driving left vs. right is physically identical.

  **Tipping (Weak Match)**
  *   **Shared Feature:** It is a local convention that visitors encounter.
  *   **Mismatch:** This is the weakest link. Tipping is not primarily a coordination problem; it is a **Distributive Norm**.
      *   *Road Rules:* We all do $X$ so we don't crash.
      *   *Tipping:* I give money $Y$ so the worker is compensated.
      *   If you don't tip in a tipping culture, cars don't crash and the queue doesn't break. A specific worker loses income. The "harm" is not systemic chaos (like traffic), but individual economic loss. The road-rule analogy assumes the harm is *coordination failure*, but the harm in tipping is *uncompensated labor*.

  ---

  ### 3. The Invisible-Deviation Test

  **The Test:** If you violate the norm secretly, with zero chance of detection and zero immediate physical consequence, does the obligation remain?

  *   **Road Rules:** *Survives.* Even on an empty road at 3 AM, driving on the wrong side is considered wrong.
      *   *Why?* **Habit Formation.** Philosophers argue that if you make an exception for yourself when "no one is looking," you erode your own disposition to follow the rule when it *does* matter. Also, you can never be 100% sure the road is empty.
  *   **Queueing:** *Fails.* If you melt into a loose queue and no one notices you skipped the "line," no one is aggrieved. The harm of queue-jumping is *offense to others*. If no one sees, there is no offense.
      *   *Implication:* The obligation to queue is social, not systemic. It relies on witnesses.
  *   **Tipping:** *Fails (Technically Impossible).* You cannot "invisibly" not tip. The server sees the bill. However, if we modify the test to "Discreet Opt-Out" (e.g., paying card without adding a tip in a culture where cash is king), the server knows.
      *   *Implication:* Because the recipient *knows*, the "invisible" test doesn't apply. The harm is direct and visible.
  *   **Crossing:** *Fails.* If you cross an empty street at 3 AM with no cars, the physical risk is near zero.
      *   *Implication:* Unlike driving (where a car is a weapon you control), walking is vulnerable. The "rule" is often a heuristic for safety. If safety is guaranteed (empty street), the rule loses its force.

  **Audit Result:** The Road Rule analogy survives the Invisible-Deviation Test because driving rules are about *systemic integrity* and *habit*. Queueing and Crossing are about *immediate social/physical context*. If the context is empty, the obligation weakens. Tipping is about *transaction*, so invisibility is impossible.

  ---

  ### 4. The Visitor's Excuse

  You raised three points:
  1.  **I did not help set the equilibrium.** (Lack of Consent)
  2.  **My single deviation changes nothing.** (Causal Impotence)
  3.  **Discreet opt-out wouldn't collapse the convention.** (Threshold Issue)

  **1. Lack of Consent**
  *   **Road Rules:** You didn't vote on "drive on the right," but by entering the car and using the road, you give **Tacit Consent**. You benefit from the safety others provide.
  *   **Queueing/Tipping/Crossing:** By entering the shop or stepping on the sidewalk, you also give tacit consent to the local operating system.
  *   **Verdict:** This part of your excuse is **Special Pleading**. If you accept the benefit of the local infrastructure (roads, shops, sidewalks), you generally accept the local protocols.

  **2. Causal Impotence ("My single deviation changes nothing")**
  *   **Road Rules:** One car on the left doesn't break the system. But we reject this argument for driving because of **Rule Utilitarianism**. We follow the rule because *if everyone did it*, chaos would ensue.
  *   **Queueing:** One person cutting doesn't break the queue. But if every visitor did it, the queue system would collapse.
  *   **Tipping:** One person not tipping hurts *one* worker, but doesn't break the tipping system.
  *   **Verdict:** This excuse fails for Queueing and Road Rules (systemic risk). It is weaker for Tipping (individual harm).

  **3. Discreet Opt-Out ("Visitors could be exempt")**
  *   **Road Rules:** A rule allowing "Visitors drive on the left" would be catastrophic. Confusion would kill people.
  *   **Queueing:** A rule allowing "Visitors push" would cause conflict. Locals can't easily distinguish visitors.
  *   **Tipping:** A rule allowing "Visitors don't tip" is actually common (locals know tourists often don't know). The system absorbs this loss.
  *   **Crossing:** A rule allowing "Visitors jaywalk" is dangerous because drivers can't distinguish visitors.
  *   **Verdict:** This excuse holds water for **Tipping** (the system can absorb tourist non-compliance). It fails for **Road Rules, Queueing, and Crossing** (because safety and order require universal predictability, and locals cannot identify you as a visitor in the moment).

  ---

  ### 5. Conclusion: Does the Analogy Survive?

  Your colleague's conclusion ("You owe it to locals to adapt") survives for some norms but not others, and for different reasons.

  **1. Queueing (The Analogy Holds)**
  *   **Verdict:** **Strong.** This is a genuine coordination equilibrium.
  *   **Reasoning:** Like driving, the content is arbitrary (strict vs. loose), but the *uniformity* is required for fairness and order. The "Visitor's Excuse" fails here because locals cannot identify you as a visitor to grant you an exemption.
  *   **Better Analogy:** **Game Theory.** You are playing a coordination game. The dominant strategy is to match the local move.

  **2. Crossing the Street (The Analogy Holds, but for Safety)**
  *   **Verdict:** **Moderate.**
  *   **Reasoning:** This is less about "arbitrary convention" and more about **Risk Management**. The road-rule analogy works because it involves physical safety and predictability between agents (pedestrians and drivers).
  *   **Caveat:** The "Invisible Deviation" test weakens the obligation here. If the street is truly empty, the moral obligation to follow the *letter* of the law drops, even if the *habit* should remain.
  *   **Better Analogy:** **Safety Protocol.** Like wearing a hard hat on a construction site. It's not about fairness; it's about not getting hit.

  **3. Tipping (The Analogy Fails)**
  *   **Verdict:** **Weak.**
  *   **Reasoning:** Tipping is not a coordination equilibrium; it is a **Wage Subsidy**.
      *   If you don't tip in a no-tip city: You are following the local norm (no harm).
      *   If you don't tip in a tip city: You are underpaying for a service.
      *   The Road Rule analogy implies you follow the norm to prevent *chaos*. But not tipping causes *economic loss*, not chaos.
  *   **Visitor's Excuse:** This is where your "discreet opt-out" argument is strongest. Many tipping economies structurally expect tourists to tip less or not understand the norm. The system does not collapse if a visitor opts out.
  *   **Better Analogy:** **Contractual Custom.** When you sit at a table, you enter an implicit contract. The "price" includes the tip if that is the local law/custom. It is less like "driving on the right" and more like "paying the sales tax."

  ### Final Summary for the Engineer

  Your colleague used a **Conventionalist** argument (follow the rule because it is the rule).
  *   **For Queueing and Crossing:** They are right. These are **Coordination and Safety norms**. Your individual deviation introduces friction or risk that the local system is not designed to handle. The "Visitor Excuse" fails because the system cannot distinguish you from a local in real-time.
  *   **For Tipping:** They are using the wrong model. Tipping is a **Distributive norm**. The obligation to tip (or not tip) comes from the implicit contract of the service transaction, not from the need to coordinate traffic. Your "Visitor Excuse" has more weight here, as the economic system can absorb individual non-compliance better than a traffic system can absorb individual deviation.

  **Recommendation:** Accept the Road Rule analogy for Queueing and Crossing (adapt to local flow/safety). Discard it for Tipping; view that instead as adhering to the local "price of service."
