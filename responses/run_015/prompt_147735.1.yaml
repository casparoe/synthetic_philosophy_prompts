answer: |-
  Here is the spec for a theory of historical causation that actually integrates microhistory without reducing it to anecdote or swallowing it into structure.

  ### 1. The Non-Negotiables (The Hard Spec)
  Three of your five points are functional requirements. If the theory fails these, it is not a causal theory; it is a narrative.

  *   **The Aggregation Mechanism (Non-Negotiable):** The theory must define the *transfer function* between levels. It cannot simply assert that micro-actions sum to macro-outcomes. It must explain the distortion. If 1,000 villagers intend $X$ and the Empire receives $Y$, the theory must specify the filter (institutions, markets, ecology) that transformed $X$ to $Y$. Without this, you have magic, not causation.
  *   **The Selection Criterion (Non-Negotiable):** This is the hardest one. The theory must provide *ex-ante* or structural criteria for why Micro-Event A scales to Macro-Effect B, while identical Micro-Event C vanishes. Most history fails here, relying on post-hoc significance ("it mattered because we see the result"). A valid theory must identify the *conditions of amplification* (e.g., network position, institutional friction, resource leverage) that allow a local mess to bypass local containment.
  *   **Archive Bias as a Variable, Not Noise (Non-Negotiable):** The theory cannot treat state archives as imperfect records of reality; it must treat them as *active causal agents*. The bias itself changes the outcome. If the state records a village riot as "banditry" rather than "rebellion," that classification triggers a different military response, which alters the future. The epistemology (what is recorded) must be causally linked to the ontology (what happened).

  **Camp Preferences (Negotiable):**
  *   **Temporal Lag:** How you handle this is a methodological choice, provided you maintain chain continuity. You can use "institutional memory," "cultural trauma," or "material decay" as the storage medium. The requirement is just that the latency mechanism is specified, not that it takes a specific form.
  *   **Intentional Transparency:** You do not need to know *what* the villagers thought, only that their intentions had a specific vector. Whether you recover that via diaries or inference is a methodological preference, not a theoretical constraint.

  ### 2. The Jointly Unsatisfiable Pairs
  You asked if there are contradictions in the requirements. Yes. You cannot maximize all variables simultaneously.

  *   **Pair 1: Full Micro-Intentionality + Strict Macro-Determinism.**
      *   **Conflict:** If macro-structures (capitalism, imperialism, climate) strictly determine outcomes, micro-intentions are epiphenomenal. If micro-intentions are causally potent, macro-outcomes cannot be strictly determined, only probabilistically constrained.
      *   **Resolution:** You must abandon hard determinism. The theory must be *non-linear*. Micro-events can trigger macro-shifts only when the macro-system is in a "critical state" (high tension/low stability). This sacrifices predictive certainty for causal accuracy.
  *   **Pair 2: Complete Micro-Transparency + Reliance on State Archives.**
      *   **Conflict:** You cannot recover full micro-level intentionality from sources designed to obscure it. State archives are optimized to render local messes legible for control, not to preserve local causality.
      *   **Resolution:** The theory must accept "structural silence." It must model the *gap* between the event and the record as a causal force. If you demand full transparency, you must discard state archives as a primary source for micro-causation, which limits your dataset massively.

  ### 3. The 90% Filter
  **The Selection Criterion is the killer.**

  This requirement knocks out roughly 90% of existing historical frameworks, including most microhistory.
  *   **Narrative/Political History:** Fails because it assumes scaling is automatic if the actor is "important." It doesn't explain *why* they were important beyond the fact that they succeeded.
  *   **Structuralism/Marxism:** Fails because it treats micro-events as symptoms. It explains why the *system* collapsed, but not why *this specific village riot* was the trigger rather than another. It dissolves the micro into the macro.
  *   **Traditional Microhistory:** Fails because it often revels in the exception. It explains why the village was unique, but rarely builds a bridge to explain how that uniqueness breached the local containment and altered the imperial trajectory. It treats the micro as a world unto itself.

  To pass this filter, the theory needs a model of **contagion and containment**. It needs to treat historical causation like epidemiology or network theory:
  1.  **Vector:** The micro-event.
  2.  **Host Susceptibility:** The macro-structure's current stability.
  3.  **Transmission Medium:** The institutions (church, army, market) that carry the signal.
  4.  **Immune Response:** The state's capacity to localize and neutralize the event.

  If your theory cannot model why the "immune response" failed in 1847 but succeeded in 1846, it is not a theory of causation.

  ### 4. Handling Temporal Lag (The Continuity Spec)
  To handle the 50-year gap without breaking the link, the theory requires a **Storage Mechanism**. Causation cannot just "skip" generations; it must be stored.

  Valid storage mechanisms include:
  *   **Institutional:** A law passed in 1847 that remains on the books but is unenforced until 1897.
  *   **Material:** Infrastructure built (or destroyed) in 1847 that constrains options in 1897.
  *   **Discursive:** A category of speech (e.g., "traitor," "heretic") established in 1847 that limits political imagination in 1897.

  If the theory posits a "spirit of the age" or "collective memory" without specifying the *carrier* of that memory (text, ritual, building, law), it fails the spec. Metaphor is not a mechanism.

  ### 5. Summary of the Spec
  A viable theory must be **multi-scalar, non-linear, and mechanism-based.**

  1.  **Levels:** Micro and Macro are distinct ontological layers with different rules.
  2.  **Bridge:** Causation crosses layers via specific transmission mechanisms (institutions, networks), not by osmosis.
  3.  **Bias:** The recording of the event is part of the event's causal chain.
  4.  **Selection:** The theory must explain why *this* signal amplified and *that* one dampened, based on system state, not outcome bias.
  5.  **Latency:** Long-term causation requires identified storage media, not mystical continuity.

  **The Verdict:**
  If you enforce the **Selection Criterion** (why this event scaled) and the **Aggregation Mechanism** (how intention distorts into structure), you eliminate narrative history, structural determinism, and anecdotal microhistory. You are left with something resembling **complexity theory applied to social systems**, which historians generally resist because it reduces human agency to probabilistic vectors and demands rigorous modeling over persuasive prose.

  That resistance is the real barrier, not the theory itself.
