answer: |-
  In a clinically documented instance of tetragametic chimerism arising from IVF, two distinct zygotes, Z1 (derived from sperm S1 and egg E1) and Z2 (derived from sperm S2 and egg E2), are cultured to the blastocyst stage and transferred in immediate proximity, leading to the fusion of their inner cell masses prior to gastrulation. Although Z2 ceases independent cardiac activity during the vanishing twin phase, its cells are not expelled but instead integrate into the developing embryo; due to stochastic lineage segregation during neurulation, the progenitor cells forming the neuroectoderm are drawn almost exclusively from the Z1 cluster, while the mesodermal progenitors constituting the majority of somatic tissue, including blood and muscle, derive predominantly from Z2. The resulting individual, Adult A, possesses a unified consciousness supported entirely by Z1-derived neural tissue, while their somatic genetic profile matches Z2, creating a dissociation between the genetic origin of the body and the genetic origin of the mind.

  (a) The origin-essentialist verdict holds that Adult A is essentially tied to Z1 and could not have originated from the gametes of Z2. Because origin essentialism ties personal identity to the specific biological inception from which continuous development proceeds, and because the continuous development of the *subject* (the conscious agent) proceeds from the neural lineage of Z1, the specific gametes S1 and E1 are necessary conditions for A's existence. Even though Z2 contributed somatic cells, it did not initiate the developmental trajectory of the psychological subject; thus, a person originating from S2 and E2 would be a numerically different individual, regardless of somatic similarity.

  (b) The functional-continuity verdict holds that the psychological-functional trajectory realized in Z1-derived neural tissue is what fixes modal identity, meaning A could have originated from Z2's gametes. On this view, personal identity is constituted by the persistence of psychological capacities and memories rather than the specific genetic substrate realizing them. Since psychological states are functionally defined, the same trajectory could have been realized by Z2-derived neural tissue in a nearby possible world where lineage segregation favored Z2 for the neuroectoderm; thus, the gametes S2 and E2 are a possible origin for A, provided they support the requisite functional organization.

  (c) The feature forcing the divergence is genetic mosaicism separated by tissue-type and functional role. Specifically, the dissociation between the genetic origin of the central nervous system (Z1) and the genetic origin of the somatic body (Z2) allows origin essentialism to lock onto the neural lineage as the "true" biological origin of the person, while functional continuity treats the neural lineage as a contingent realizer of the psychological pattern, thereby allowing the somatic lineage's gametes to count as a possible origin.

  (d) If this feature is removed, the verdicts converge or become indeterminate. If the neural tissue is also mosaic (a 50/50 mix of Z1 and Z2), origin essentialism loses its clear anchor for which zygote constitutes the essential origin, likely rendering the identity indeterminate, while functional continuity remains stable as long as the psychological trajectory is uninterrupted. If Z2 contributes nothing (a standard singleton pregnancy), both accounts agree that A originates exclusively from Z1, eliminating the modal divergence.

  (e) A defender of origin essentialism would attack the case by arguing that separating genetic origin from functional realization illicitly treats the organism as a mere vehicle for psychology. They would contend that Adult A is identical to the human organism, which is the chimera itself, originating from the fusion event of both Z1 and Z2; to claim A originates essentially from Z1 alone is to ignore the biological reality that the organism requires both lineages. They would argue that allowing Z2 to be a possible origin relies on a dualistic stipulation that the person is distinct from the organism, whereas the organism's origin is essentially the specific fusion of Z1 and Z2, making any swap of gametes a change in the organism itself.

  **Position:** The separation genuinely undermines origin essentialism because it reveals that the theory relies on a hidden stipulation about what counts as the organism's essential origin when lineages merge. Origin essentialism assumes a one-to-one mapping between zygote and organism; when faced with chimerism, it must arbitrarily privilege the neural lineage over the somatic lineage to maintain its verdict, effectively smuggling in functional criteria (the importance of the brain) to define biological origin. Functional continuity, by contrast, does not need to stipulate which genetic line is "essential" because it tracks the actual locus of personal identity (psychological continuity) regardless of genetic mosaicisms. Therefore, the case demonstrates that origin essentialism cannot account for personal identity in biologically complex cases without covertly adopting the functional criteria it purports to reject.
