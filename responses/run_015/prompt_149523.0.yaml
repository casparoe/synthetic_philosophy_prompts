answer: |-
  A municipal housing council has one voucher for permanent supportive housing left this fiscal year. Applicant A is a citizen who lived abroad for forty years, never paid local taxes, and has returned destitute with severe chronic illness and no family network. Applicant B is a permanent resident non-citizen who has lived and paid taxes in the district for forty years, recently lost their job, faces eviction, but has a local community group offering temporary aid. The council must choose immediately.

  **Moderate Nationalism** argues for Applicant B (the foreigner). On this view, special obligations arise from participation in shared institutions, not blood or passports. The housing fund is a cooperative scheme sustained by contributors. Applicant A treated citizenship as a convenience without sustaining the community, while Applicant B upheld the reciprocal duties of residence. Prioritizing A would corrupt the institution by rewarding free-riding, undermining the trust citizens have in their shared system. **Strong Cosmopolitanism** argues for Applicant A (the compatriot). Since nationality is morally invisible, the only metric is human welfare. Applicant A is more vulnerable (severe illness, no safety net) than Applicant B (who has temporary community aid). To ignore this disparity based on tax history or residency status is to privilege arbitrary social constructs over actual suffering.

  **The Feature Doing the Work:** **Reciprocity vs. Raw Need.** The reversal happens because Nationalism weighs *institutional integrity* (who upheld the scheme?), while Cosmopolitanism weighs *individual welfare* (who hurts more?).

  **If You Remove That Feature:** If both applicants had identical tax histories (equal reciprocity), the Nationalist view collapses back to "help the citizen" because the institutional tie is now equal, and citizenship becomes the tiebreaker. If both applicants had identical health/support profiles (equal need), the Cosmopolitan view collapses to a coin flip, as there is no moral reason to prefer one human over another. The reversal only exists because one theory prioritizes the *health of the system* and the other prioritizes the *health of the person*.
