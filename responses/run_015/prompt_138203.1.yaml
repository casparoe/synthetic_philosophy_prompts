prompt: |-
  I am writing a DPhil thesis in bioethics on the determination of death, and I sit as the lay-philosophical member of my teaching hospital's Determination of Death Working Group. The Group has been asked to approve a retrieval protocol it has never considered, and I have been asked to draft the minute. What I need from you is the reasoning rather than any references: an account of which principle the Group has in fact been applying across its own previous rulings, and what that principle requires of it now.

  The Group's record, as I read it:

  1. It accepted a neurological determination of death in a patient whose heart was still beating and whose body remained warm and perfused, and it permitted organ recovery in that state, minuting that the organism as a whole had died even though its parts had not.
  2. Where clinical brainstem testing was equivocal because some neuroendocrine function appeared preserved, it declined to confirm death on clinical grounds alone and required an ancillary study of cerebral perfusion; it confirmed death when that study showed absent intracranial flow.
  3. It declined a family's request, made on religious grounds, to disregard a neurological determination, but allowed a fixed short period of continued support so that relatives could gather, and refused to extend it indefinitely.
  4. It refused a family's request to declare death in a patient in a permanent vegetative state, on the ground that loss of consciousness is not one of the criteria it recognises.
  5. In controlled donation after circulatory death it insists on five minutes of continuous asystole before determination, and it rejected a proposal to accept ninety seconds, minuting that auto-resuscitation must be excluded and that the fact that no one intends to restart the heart is not by itself enough.
  6. When a patient had a witnessed arrest, failed cardiopulmonary resuscitation, and was then cannulated for extracorporeal support, the Group refused to record that the patient had died during the arrest: it treated the institution of support as resuscitation and the patient as living on support, whose treatment was later withdrawn.
  7. It permitted continued somatic support of a pregnant patient after a neurological determination of death, for foetal benefit, and minuted that the patient was dead and that what was being sustained was a part of her body.
  8. It has repeatedly approved ex situ normothermic machine perfusion of retrieved kidneys and livers without treating the reperfusion of an organ as casting doubt on the donor's death.

  The new proposal concerns a forty-one-year-old with a devastating brain injury who does not meet neurological criteria, from whom treatment is to be withdrawn. Cannulae are to be placed in the femoral vessels beforehand, and heparin given, while the patient is still alive. After asystole and the Group's usual five-minute interval, death is to be determined by circulatory criteria; an occlusion balloon is then to be inflated so that the cerebral and coronary circulations are excluded, and in-situ normothermic regional perfusion of the abdominal organs is to be run from an extracorporeal circuit. The patient's heart is to remain asystolic and will not be recovered.

  What I would like from you: the candidate rules that fit the record as a whole — several do, and they do not agree here; what each predicts both about the declaration of death and about the pre-arrest cannulation and heparinisation; your recommendation for the decision that would best cohere with the Group's own precedents, with the closest analogue identified and the reasons for preferring it; and, for each of the two live options, a sentence or two of wording the Group could minute as the principle it is thereby adopting, together with an honest note of where its precedents simply run out. One member says the sixth item settles the case; another replies that perfusing the abdomen with the brain excluded is not resuscitation; a third says the fifth item does the work; a fourth says the eighth shows reperfusion is not the issue. Please also tell me which part of their disagreement is substantive and which is only about how far the word circulation extends.

  Finally: I had thought the case that would tell these rules apart would be a proposal to begin regional perfusion after only ninety seconds of asystole. Does that case actually discriminate between the surviving rules, and is there a better one? And please mark clearly any part of this the Group should refer elsewhere — to the coroner, to the trust's legal advisers, or to the courts — rather than settle for itself. I would be grateful for British English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** DPhil thesis writer in bioethics, lay-philosophical member of a hospital's Determination of Death Working Group.
      *   **Task:** Draft reasoning for a minute regarding a new retrieval protocol (NRP - Normothermic Regional Perfusion) based on the Group's past precedents (8 specific cases provided).
      *   **Constraints:** No references needed, focus on reasoning/principles. British English. Clear marking of issues needing external referral (legal/coroner/court).
      *   **Specific Questions to Answer:**
          *   Identify candidate rules/principles fitting the record.
          *   Analyze what each rule predicts for the new case (declaration of death, pre-arrest cannulation/heparin).
          *   Recommend the decision that best coheres with precedents (identify closest analogue).
          *   Provide minute wording for two live options + note where precedents run out.
          *   Address the specific disagreement among members (Items 6, 5, 8).
          *   Distinguish substantive disagreement vs. semantic (definition of circulation).
          *   Evaluate the "90 seconds" counterfactual (does it discriminate rules? Is there a better test case?).
          *   Identify matters for external referral.

  2.  **Analyze the Precedents (The "Record"):**
      *   *Case 1 (NDD + Organ Recovery):* Dead organism, living parts. Permits organ recovery while body warm/perfused (artificially). *Principle: Integration/Whole Brain Death.*
      *   *Case 2 (Equivocal Brainstem):* Required ancillary test (no flow). *Principle: Irreversibility of function requires absence of flow/capacity.*
      *   *Case 3 (Religious Objection):* Dead is dead, but allowed short delay for family. No indefinite extension. *Principle: Death is a biological fact, not subject to belief, though pastoral accommodation is有限.*
      *   *Case 4 (PVS):* Not dead. *Principle: Consciousness is not the criterion; brainstem/integration is.*
      *   *Case 5 (DCD - 5 mins vs 90 secs):* 5 mins required to exclude auto-resuscitation. Intention not to restart $\neq$ death. *Principle: Irreversibility requires physiological impossibility (or at least exclusion of spontaneous return), not just decisional.*
      *   *Case 6 (ECPR/ECMO after arrest):* Arrest $\neq$ Death if support instituted. Treated as living on support. *Principle: Potential for resuscitation (via technology) precludes death declaration during support.*
      *   *Case 7 (Pregnant NDD):* Dead mother, sustained body for fetus. *Principle: Somatic support of a dead organism is permissible for specific goals; doesn't reverse death status.*
      *   *Case 8 (Ex Situ Perfusion):* Reperfusing organs *after* retrieval doesn't undo death. *Principle: Perfusion of parts $\neq$ life of organism.*

  3.  **Analyze the New Proposal (NRP - Normothermic Regional Perfusion):**
      *   Patient: 41yo, devastating injury, *not* NDD.
      *   Plan: Withdraw treatment. Pre-arrest cannulation + heparin (ante-mortem).
      *   Death Determination: Circulatory (5 mins asystole).
      *   Post-Death Intervention: Occlusion balloon (block brain/heart). In-situ NRP of abdominal organs.
      *   Heart: Remains asystolic.

  4.  **Identify Candidate Rules/Principles:**
      *   *Rule A (The "Biological Integration" Rule):* Death is the irreversible loss of the organism as a whole. Circulatory death requires irreversible cessation of circulation. If circulation is restored (even regionally), is the loss irreversible?
      *   *Rule B (The "Intention/Decision" Rule):* Death is determined by the permanent loss of function *in the context of a decision not to resuscitate*. (Ruled out by Case 5).
      *   *Rule C (The "Resuscitation Potential" Rule):* If technology *can* restore function, the patient isn't dead until that technology is tried or ruled out permanently. (Derived from Case 6).
      *   *Rule D (The "Anatomical Irreversibility" Rule):* If specific critical areas (brain/heart) are physically excluded from perfusion, restoration of circulation to other parts does not constitute resuscitation of the *organism*. (Derived from Case 1, 7, 8).

      *Refining the Conflict:*
      *   *Member 1 (Case 6):* Cannulation while alive = resuscitation attempt. Patient is "living on support." Death cannot be declared until support withdrawn.
      *   *Member 2 (NRP specific):* Perfusing abdomen with brain excluded is not resuscitation of the *person*.
      *   *Member 3 (Case 5):* 5 minutes asystole ensures auto-resuscitation is excluded. That's the hard line.
      *   *Member 4 (Case 8):* Reperfusion happens after death (ex situ). Why is in-situ different?

      *Core Tension:* Is NRP "resuscitation" (Case 6) or "organ preservation" (Case 8)? Does pre-mortem cannulation invalidate the death determination (Case 6 logic) or is it merely preparatory (Case 5 logic)?

  5.  **Evaluate the "90 Seconds" Counterfactual:**
      *   User asks: Does proposing NRP after 90 seconds discriminate rules?
      *   Analysis: Case 5 already settled the 5-minute vs 90-second asystole issue generally. Reducing the wait time violates Case 5 regardless of NRP. So, no, it doesn't help distinguish the NRP specific ethical dilemma (resuscitation vs. perfusion).
      *   Better Test Case: What if the balloon fails? Or what if the cannulation successfully restores cerebral flow despite the balloon? Or: Pre-mortem intervention that *physiologically* hastens death (e.g., giving drugs to lower BP) vs. merely preparing (cannulation).

  6.  **Develop the Recommendation:**
      *   *Coherence Check:* The Group distinguishes between "organism as a whole" (Case 1, 4, 7) and "parts" (Case 1, 8). They distinguish between "spontaneous return" (Case 5) and "intervention" (Case 6).
      *   *The Crux:* Case 6 is the strongest obstacle. In Case 6, ECMO was seen as *resuscitation* making the patient alive. In NRP, the circuit is similar (ECMO-like). The distinction must be the *occlusion balloon*. If the brain and heart are excluded, the *organism* is not being resuscitated.
      *   *Pre-mortem Cannulation:* This is ethically fraught. Case 6 implies intervention on a living patient for non-benefit (to them) is problematic. However, standard DCD often involves pre-mortem preparation. The Group needs to decide if this crosses the line from "preparation" to "treatment contrary to interest."
      *   *Best Fit:* The "Anatomical Irreversibility" Rule (Case 1 + 7 + 8) combined with the "5-minute wait" (Case 5). Case 6 is distinguished by the fact that in Case 6, the *whole body* was perfused (including brain/heart potential), whereas NRP excludes the brain/heart.
      *   *Referral:* The legal status of pre-mortem cannulation/heparin (potential assault/battery if not strictly in best interests) and the definition of death in statute (Human Tissue Act / Code of Practice) needs legal check. The "dead donor rule" is a legal/ethical boundary.

  7.  **Drafting the Response (incorporating British English and specific constraints):**
      *   *Structure:*
          1.  Candidate Rules.
          2.  Predictions for the New Case.
          3.  Analysis of Member Disagreement (Substantive vs. Semantic).
          4.  Recommendation & Closest Analogue.
          5.  Minute Wording (Two Options + Precedent Gap).
          6.  The "90 Seconds" Question.
          7.  External Referrals.

      *   *Refining the Rules:*
          *   *Rule 1 (Physiological Irreversibility):* Death requires permanent cessation of function that cannot be restored by *any* available means (Case 5, 6).
          *   *Rule 2 (Organismic Integration):* Death is loss of the organism as a whole; perfusion of parts does not constitute life if critical integration centers are excluded/destroyed (Case 1, 7, 8).
          *   *Rule 3 (Intentional Permanence):* Death is cessation where there is no intention to restore function (Case 5 rejects this as sufficient alone, but it plays a role). Let's stick to the stronger ones.
          *   *Let's call them:*
              *   **The Resuscitation Principle (Case 6):** If circulatory support is established, the patient is alive until it is withdrawn.
              *   **The Integration Principle (Case 1, 7, 8):** Perfusion of somatic parts does not negate death if the brain/heart are excluded.
              *   **The Irreversibility Principle (Case 5):** Cessation must be permanent (exclusion of auto-resuscitation), not just persistent.

      *   *Addressing the Disagreement:*
          *   Member 1 (Case 6) vs Member 2/4 (Case 8/Integration).
          *   Substantive: Does NRP constitute resuscitation of the *patient* or preservation of *organs*?
          *   Semantic: Definition of "circulation" (whole body vs. regional).

      *   *Recommendation:* Approve NRP *only if* the occlusion is guaranteed (Integration Principle), but flag pre-mortem cannulation as legally sensitive. Distinguish from Case 6 because Case 6 involved *whole body* perfusion.
      *   *Wait, actually:* As a lay-philosophical member, I need to be careful. The "pre-mortem cannulation" is the biggest ethical hurdle (best interests). The "NRP after death" is the death definition hurdle.
      *   *Decision:* The Group should likely approve the NRP protocol *post-death* based on Case 1/7/8 (parts vs whole), but the pre-mortem cannulation requires Legal/Best Interest scrutiny (Case 6 shadow).
      *   *Actually, looking at UK Law:* The Code of Practice for DCD allows pre-mortem cannulation *if* in best interests/consented. But the Group's Case 6 suggests they view ECMO initiation as keeping the patient *alive*. NRP is technically ECMO. The distinction is the balloon.
      *   *Recommendation:* Coherence lies in the **Integration Principle**. Case 6 is the outlier/distinguisher. If the brain is excluded, it's not resuscitation of the organism.

      *   *Minute Wording:* Needs to sound formal.
      *   *Referrals:* Legal (consent/best interests for pre-mortem intervention), Coroners (if cause of death determination is affected by NRP).

      *   *90 Seconds:* No, Case 5 already killed that. Better test: What if the balloon migrates? (Risk of cerebral perfusion).

  8.  **Final Review against Constraints:**
      *   British English (e.g., "cannulae", "programme", "centre").
      *   No references.
      *   Reasoning focused.
      *   Address all specific questions.

      *(Self-Correction during drafting)*: I need to make sure I don't give legal advice, but identify *where* legal advice is needed. The prompt asks me to mark clearly what should be referred.
      *   Pre-mortem cannulation/heparinisation: This is a clinical intervention on a living patient that offers them no benefit. This is a legal/best interest issue, not just a death definition issue.
      *   NRP itself: This is a death definition issue (does it contradict DCD?).

      *Refining the "Candidate Rules":*
      1.  **The Permanence Rule (Case 5):** Cessation must be permanent (no auto-resuscitation), not just persistent. Intention is insufficient.
      2.  **The Resuscitation Rule (Case 6):** If mechanical support restores circulation to the *organism*, the patient is not dead.
      3.  **The Holism Rule (Case 1, 7, 8):** Death of the organism is compatible with function of parts, provided the integrating centers (brainstem/heart) are not functioning/restored.

      *Predictions:*
      *   Permanence Rule: Supports 5-min wait. Silent on NRP.
      *   Resuscitation Rule: Blocks NRP (looks like ECMO/Case 6). Blocks pre-mortem cannulation (intervention on living).
      *   Holism Rule: Permits NRP (brain excluded). Silent/Permissive on pre-mortem cannulation (as it doesn't affect death status).

      *Disagreement:* Member 1 relies on Resuscitation Rule. Member 2/4 rely on Holism Rule. Member 3 relies on Permanence Rule.
      *   Substantive: Whether NRP counts as resuscitation of the *organism* or just *parts*.
      *   Semantic: Whether "circulation" means whole-body or regional.

      *Recommendation:* Holism Rule is the most consistent with Cases 1, 7, 8. Case 6 is distinguished by the lack of cerebral exclusion.
      *   Pre-mortem cannulation is the weak link. It fits poorly with Case 6 (intervention on living).

      *Let's write.*
answer: |-
  **To:** The Determination of Death Working Group
  **From:** The Lay-Philosophical Member
  **Subject:** Reasoning for the Minute regarding Normothermic Regional Perfusion (NRP) Protocol

  ### 1. Candidate Rules Derived from the Record

  Three distinct principles can be extracted from the Group's eight precedents. They are not mutually exclusive in past cases, but they diverge on the present proposal.

  **Rule A: The Permanence Principle (derived primarily from Item 5)**
  Death requires the permanent cessation of function, not merely the persistent cessation. 'Permanent' means that function will not return spontaneously (auto-resuscitation) and will not be restored by intervention. Crucially, Item 5 establishes that the *intention* not to resuscitate is insufficient; there must be a physiological interval (five minutes) to exclude spontaneous return.
  *   **Prediction for New Case:** This rule mandates the five-minute wait after asystole. It is neutral regarding the NRP itself, provided the five minutes are observed. It does not inherently forbid pre-mortem cannulation, provided the intervention does not restart circulation before the interval is complete.

  **Rule B: The Resuscitation Principle (derived primarily from Item 6)**
  If mechanical circulatory support is instituted following arrest, the patient is to be treated as living on support, not dead. Death cannot be declared until that support is withdrawn and cessation confirmed. The capacity to restore circulation via technology precludes a declaration of death while that technology is active.
  *   **Prediction for New Case:** This rule forbids the protocol. Pre-mortem cannulation places the patient on a potential support pathway. Post-mortem NRP involves connecting a pump to the vasculature; under Item 6 logic, this constitutes resuscitation, meaning the patient was not dead when the pump started, or is being 'killed' by the occlusion balloon. It also strongly discourages pre-mortem cannulation as an intervention on a living patient that offers them no benefit.

  **Rule C: The Organismic Integration Principle (derived from Items 1, 7, and 8)**
  Death is the loss of the organism as a whole, not the loss of all cellular function. Somatic support of a dead body (Item 7) and perfusion of retrieved organs (Item 8) do not negate death. If the integrating centers (the brain and the heart's capacity to pump to the brain) are irreversibly excluded or destroyed, circulation to other parts does not constitute life.
  *   **Prediction for New Case:** This rule permits the NRP protocol. Provided the occlusion balloon successfully excludes the cerebral and coronary circulations, the perfusion of the abdomen is analogous to Item 8 (ex situ perfusion) or Item 7 (somatic support). The organism is not being resuscitated. It is largely silent on pre-mortem cannulation, viewing it as a logistical preparation rather than a determination of life status.

  ### 2. Analysis of the Members' Disagreement

  The disagreement among your colleagues maps onto the conflict between Rule B and Rule C, with Rule A acting as a baseline condition.

  *   **Member 1 (Item 6):** Invokes the **Resuscitation Principle**. They view the extracorporeal circuit as functionally identical to the ECPR in Item 6.
  *   **Member 2 (NRP specific) & Member 4 (Item 8):** Invoke the **Organismic Integration Principle**. They argue that perfusion without cerebral flow is not resuscitation of the *person*.
  *   **Member 3 (Item 5):** Invokes the **Permanence Principle**. They are concerned primarily with the five-minute interval ensuring irreversibility.

  **Substantive vs. Semantic Disagreement:**
  The dispute between Member 1 and Members 2/4 is **substantive**, not merely semantic. It concerns the moral status of the body during perfusion.
  *   If Member 1 is correct, the NRP circuit restores biological integration sufficient to classify the patient as 'living', meaning the occlusion balloon effectively causes death (an unacceptable act).
  *   If Members 2/4 are correct, the patient remains 'dead' during perfusion because the capacity for consciousness and systemic integration is physically excluded.
  *   The semantic element lies only in the definition of 'circulation'. Member 1 implies 'circulation' means blood moving in vessels anywhere; Members 2/4 imply 'circulation' means blood moving in a pattern capable of sustaining the organism as a whole. However, the ethical weight rests on the substantive question of whether regional perfusion violates the Dead Donor Rule.

  ### 3. Recommendation and Closest Analogue

  **Recommendation:**
  The Group should approve the NRP protocol *post-determination*, provided the occlusion of cerebral and coronary flow is verified, but should refer the question of pre-mortem cannulation and heparinisation to legal advisers.

  **Closest Analogue:**
  **Item 8 (Ex Situ Perfusion)** is the strongest analogue for the post-death perfusion, supported by **Item 1 (NDD with warm body)**.
  *   **Reasoning:** In Item 1, the Group accepted that a warm, perfused body (via ventilation and drugs) could be dead. In Item 8, they accepted that reperfusing organs outside the body does not cast doubt on death. NRP is logically intermediate: reperfusing organs *inside* a body that is legally dead, provided the brain is excluded.
  *   **Distinguishing Item 6:** Item 6 involved ECPR where the *entire* circulation, including the brain, was potentially restorable. The critical distinction is the **occlusion balloon**. If the brain is excluded, the 'organism as a whole' (Item 1) is not being resuscitated. Therefore, Rule C (Integration) should override Rule B (Resuscitation) in this specific technical context.

  **The Pre-Mortem Intervention Problem:**
  While Rule C permits the perfusion *after* death, Item 6 casts a shadow over the **pre-mortem cannulation and heparinisation**. In Item 6, instituting support on a living patient defined them as living. Cannulating a living patient for a procedure that offers them no benefit (and carries risk, e.g., from heparin) challenges the 'best interests' standard. This is not strictly a death determination issue, but a treatment consent issue.

  ### 4. Draft Minute Wording

  Here are two options for the minute, reflecting the two live ethical options, including a note on where precedents run out.

  **Option 1 (Approval based on Organismic Integration):**
  > "The Group approves the protocol on the basis that death is determined by the permanent cessation of circulation to the organism as a whole. Following the five-minute no-touch period, the institution of normothermic regional perfusion does not constitute resuscitation provided that cerebral and coronary circulation remain physically excluded by occlusion. The Group notes that its precedents regarding ex situ perfusion (Item 8) and somatic support (Item 7) apply here. **Note:** This ruling relies on the assumption that regional perfusion does not restore organismic integration; precedents do not explicitly cover the moral status of in-situ perfusion where the heart remains in the body."

  **Option 2 (Rejection based on Resuscitation Principle):**
  > "The Group declines the protocol on the basis that the institution of extracorporeal circulatory support constitutes resuscitation (Item 6). As the circuit is connected to the patient's vasculature, the distinction between this and the ECPR case is one of degree (regional vs. whole) rather than kind. To declare death while the apparatus capable of restoring circulation is attached risks conflating the decision not to treat with biological death. **Note:** This ruling prioritises the precautionary principle regarding the definition of death over organ viability; precedents do not explicitly address whether physical exclusion of the brain renders extracorporeal support ethically distinct."

  ### 5. The 'Ninety Seconds' Counterfactual

  You asked whether a proposal to begin regional perfusion after only ninety seconds of asystole would discriminate between the surviving rules.

  **It does not.**
  Item 5 has already settled the 'five minutes vs. ninety seconds' question generally. Reducing the wait time violates the Permanence Principle (Rule A) regardless of whether NRP is used. All three Rules (Permanence, Resuscitation, Integration) would likely reject a ninety-second wait because Item 5 established that auto-resuscitation must be excluded physiologically, not just by intention. Therefore, that variation tests the *timing* of death, not the *nature* of the NRP intervention.

  **A Better Test Case:**
  To truly distinguish Rule B (Resuscitation) from Rule C (Integration), the test case would be: **"What if the occlusion balloon fails?"**
  *   If the balloon migrates and the brain receives perfusion during NRP, Rule B says the patient has been resuscitated (and is now alive). Rule C says the determination of death was erroneous.
  *   A more discriminating philosophical test case would be: **"Pre-mortem administration of drugs to hasten arrest."**
      *   Item 6 suggests interventions on the living are resuscitation/support.
      *   If we propose giving vasodilators *before* death to ensure better organ perfusion, Rule C (Integration) might allow it (as it doesn't change death status), but Rule B (Resuscitation/Item 6) and general best-interests law would likely forbid it. This discriminates better between 'preparation for death' and 'intervention on the living'.

  ### 6. Matters for External Referral

  As a Working Group, you are competent to define the *biological and ethical criteria* for death within hospital policy. However, specific elements of this protocol exceed your remit and must be referred:

  1.  **Pre-mortem Cannulation and Heparinisation (Legal Advisers / Court of Protection):**
      *   **Reason:** Administering heparin and inserting cannulae in a living patient who will not benefit from them (and may be harmed, e.g., by bleeding risk prior to death) raises questions of assault, battery, and the Mental Capacity Act's 'best interests' test. Item 6 treats the patient as living during support; if they are living during cannulation, this intervention is legally precarious. The Trust's legal team must confirm this does not violate the Human Tissue Act or common law.

  2.  **Verification of Occlusion (Coroner):**
      *   **Reason:** If the occlusion balloon fails and cerebral perfusion occurs, the cause and time of death become ambiguous. The Coroner must be satisfied that the protocol does not obscure the true time of death or contribute to it (i.e., that the balloon itself is not the cause of the final cessation).

  3.  **National Policy Alignment (Department of Health / NHSBT):**
      *   **Reason:** While not a legal referral, Item 5 (five minutes) aligns with national DCD guidance. NRP protocols vary nationally. The Group should ensure its ruling does not contradict the Academy of Medical Royal Colleges' Code of Practice, which currently governs DCD. If your ruling diverges from the national Code, it should be escalated rather than minuted locally.

  **Summary for the Chair:**
  The Group's precedents cohere best around the **Organismic Integration Principle** (Rule C), which permits NRP provided the brain is excluded. However, the **Resuscitation Principle** (Rule B) from Item 6 creates a significant risk regarding pre-mortem interventions. I recommend approving the perfusion aspect (distinguishing Item 6 by the presence of the occlusion balloon) but referring the pre-mortem cannulation to Legal Advisers. The '90-second' variation is a red herring; the 'balloon failure' scenario is the true stress test for your logic.
