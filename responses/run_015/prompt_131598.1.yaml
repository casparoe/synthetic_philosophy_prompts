answer: |-
  Dear Colleague,

  Your proposal to elevate pathogens, climate regimes, and volcanic eruptions to the status of genuine historical actors while avoiding the trap of environmental determinism is a sophisticated maneuver that aligns with recent turns in materialist historiography and actor-network theory. However, to stress-test this position effectively, we must examine the counter-arguments sorted by their potential to dismantle the framework, beginning with the most conceptually decisive challenges regarding the definition of agency itself. The most damaging objection comes from the philosophy of action, which traditionally holds that agency is inextricably linked to intentionality or at least to a capacity for choice. If you sever agency from intentionality, as you propose, you risk collapsing the distinction between an actor and a mere cause. In traditional historiography, the value of identifying an agent lies in the ability to ask why they acted, to assess responsibility, and to understand the teleology of events. If a virus is an actor, it cannot be held responsible, nor does it have a telos, which renders the term agency descriptively empty. Critics would argue that this is a category mistake that dilutes the explanatory power of human history. If everything that exerts causal power is an actor, then the concept loses its specific utility in distinguishing between the deliberate strategies of human institutions and the blind forces of nature. This is the most decisive threat because it attacks the coherence of your central terminology; if agency is non-intentional, it is indistinguishable from causality, and the claim that nature is an actor becomes a tautology rather than a discovery.

  Moving from the conceptual to the empirical, the next most significant challenge involves historical cases where identical environmental shocks produced radically divergent human outcomes, which suggests that humans are not merely mediating forces but actively constituting history in ways that overwhelm environmental input. Consider the Little Ice Age or the Black Death. The climatic cooling or the bacterial pathogen was constant across vast regions, yet the historical consequences varied wildly depending on pre-existing social structures, political decisions, and cultural adaptations. In England, the Black Death contributed to the erosion of serfdom, while in Eastern Europe, it often reinforced it. If the pathogen is a genuine historical actor, one must explain why it acted differently in different places without resorting to the very human social structures you claim it merely disrupts. The risk here is that your framework inadvertently reduces humans to passive effects or mere conduits. If the outcome is always determined by how social structure mediates the environmental force, then the explanatory weight rests entirely on the social structure, not the environment. The volcano or virus becomes a trigger, but the gunpowder and the aim are human. Critics would argue that in these cases, treating the environment as an actor obscures the real historical driver, which is the differential capacity of human institutions to absorb or amplify shocks. This evidence is highly decisive because it demonstrates that the variance in history is human-centric, even when the stimulus is environmental.

  Slightly less decisive but still problematic are the intuitions surrounding human resilience and institutional adaptation, particularly where humans anticipate and neutralize environmental threats before they manifest as historical disruptions. Your model relies on forces reshaping societies by disrupting programs, but modern and even pre-modern history is replete with examples of societies building levees, storing grain, or developing quarantines to prevent the disruption from occurring. If humans successfully model climate regimes and mitigate their effects, does the climate cease to be an actor? If the framework says the climate acted but was successfully mediated, it attributes a form of failed intentionality to the climate, which borders on animism. If it says the climate was not an actor because it was managed, then the status of nature as an actor becomes contingent on human failure. This struggles to accommodate histories of successful mastery over nature without reverting to the anthropocentrism you seek to avoid. It suggests that the framework is best suited for explaining collapse rather than continuity, which biases the historiography toward disaster narratives where human agency appears weakest.

  This leads directly to the risk of unfalsifiability, which poses a serious methodological problem for your framework. If every observed human response, whether collapse or resilience, can be redescribed as mediation through social structure, the theory becomes insulated from empirical refutation. If a society collapses, the environmental actor was decisive; if a society survives, the social structure successfully mediated the actor. In both scenarios, the core claim that nature is an actor mediated by structure remains intact. This insulation is a significant problem for a historiographical framework because history aims to distinguish between competing causal explanations to determine what actually made a difference. If the framework absorbs all outcomes, it stops privileging specific causal chains and becomes a metaphysical stance rather than an analytical tool. It risks becoming a lens through which everything is seen as nature acting, regardless of the evidence, which prevents the historian from ever concluding that nature was irrelevant in a specific instance.

  Regarding whether defenders of this view would concede these points as genuine defeaters, the honest assessment is that they would likely refuse to accept them as fatal flaws, instead reframing them as features of a symmetrical ontology. Proponents of actor-network theory or new materialism would argue that the charge of unfalsifiability is misplaced because the goal is not prediction but description of networks that were previously ignored. They would concede that the term agency is stretched but argue that this stretching is necessary to break the habit of ignoring non-human forces until they cause catastrophes. They would likely dismiss the charge of reducing humans to passive effects by insisting that humans remain actants within the network, merely no longer the sole privileged ones. However, they would probably not concede that the conceptual incoherence of non-intentional agency is a defeater, as their entire project rests on redefining agency to include non-human actants. Consequently, the debate often stalls at the level of metaphysical preference rather than empirical resolution. For your position to remain robust as a historiographical method rather than a philosophical commitment, you would need to specify conditions under which nature would not count as an actor, otherwise, the framework risks becoming a universal solvent that dissolves the specific distinctions historians need to do their work. I hope this assessment helps you refine the boundaries of your argument.

  Sincerely,

  A Colleague
