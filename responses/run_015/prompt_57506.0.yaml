      *   **The Triviality Charge:** Analyze specifically under Reductionism (the most charitable reading of the member). Explain why PP remains substantive (normative vs. descriptive).
      *   **The Inadmissible Evidence Clause:** Explain its role in preventing triviality (blocking direct knowledge of outcomes).
