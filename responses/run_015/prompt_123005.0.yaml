  2.  **Deconstruct the Philosophical Debate (via Infra Lens):**
      *   *Gradual Replacement (Ship of Theseus/Parfit):* Rolling update, one pod at a time. State is shared/migrated seamlessly.
      *   *Instant Upload (Destructive Scan):* Kill pod, restore from snapshot on new hardware.
