answer: |-
  **Season: Public Memory | Closing Night: *Do the Right Thing***

  This season has asked who gets put in bronze and whose name goes on the street sign. Spike Lee's 1989 masterpiece closes the programme by shifting the question from the monument to the storefront. As you noted, the block sits on Stuyvesant Avenue, an instance of *ambient commemoration*: the Dutch colonial governor's name is furniture, invisible until someone points it out. Inside Sal's Pizzeria, the Wall of Fame functions similarly. For Sal, it is decoration and personal *honour*—a tribute to his own heroes. For Buggin' Out, it is a question of *address*. He is not arguing about historical accuracy (Remembrance); he is arguing about who the public of this space is. When he demands Black faces on the wall, he is claiming that the space is answerable to the people who fund it, not just the person who owns the lease.

  Your worry that the Wall is merely decoration is astute, yet the film suggests that in a segregated neighbourhood, decoration inevitably becomes politics. The Wall works as *ambient commemoration* until challenged; once challenged, *the ratchet* clicks. Sal insists that ownership grants him the sole right to determine the space's identity. The film does not validate this reply. By framing the dispute through the heat of the day and the presence of the police, Lee suggests that private property lines blur when the public sphere is exclusionary. Sal's claim to neutrality is exposed as a position that maintains the status quo.

  The climax transforms this dispute into ash. Radio Raheem's death at the hands of the police shifts the conflict from cultural representation to physical survival. The burning of the pizzeria is intelligible as *counter-commemoration*: it erases the site of exclusion. Yet the film presents this as both justified and tragic. It removes the offending wall but destroys a neighbourhood institution and a livelihood. The morning after, the reckoning between Mookie and Sal is not about guilt, but about cost.

  Lee's closing device is itself a commemorative act. He places two contrasting statements on the legitimacy of violence side by side—one advocating non-violence, the other defending violence in self-defence—attributed to Martin Luther King Jr. and Malcolm X respectively. He follows this with the image Smiley has tried to sell all day: the two men shaking hands. Lee refuses to resolve the tension. He memorialises the conflict itself rather than offering a moral solution. It is a successful act of public memory because it forces the audience to hold the contradiction, rather than soothing us with a false consensus.

  **Moments to Pause for Discussion**

  1.  **The Wall of Fame Argument:** Pause when Sal explains why the faces are Italian-American. Discuss whether Sal's appeal to private property holds when the business relies entirely on the public custom of a different demographic. Is this *honour* or *address*?
  2.  **Radio Raheem's 'Love/Hate' Monologue:** Pause after he explains the knuckle dusters. How does this abstract philosophy of competing forces mirror the competing claims on the neighbourhood's memory?
  3.  **The Morning After:** Pause during the confrontation between Mookie and Sal outside the burned shell. Sal asks why Mookie threw the bin; Mookie asks about Raheem. Discuss what this mismatch reveals about what each man values most.

  **What the Film Adds to the Argument**

  Philosophical debates about monuments often assume a static public square, but this film shows these disputes as being about who has standing now, conducted among people who still have to live and trade with each other the next morning. The theoretical question of 'who owns the past' becomes visceral when you must buy bread from the person who burned your wall. The film argues that memory is not just about what stands on the wall, but about who survives the night. It suggests that commemoration is not a one-off installation but a daily negotiation of presence. The handshake in the photograph is not a resolution, but a reminder that the antagonists are bound together; the memory of the conflict must be carried by both sides if the neighbourhood is to continue.
