answer: |-
  I draw my breath from the random **sample**,
  Defined by those who share my reference **class**.
  It matters not how vast the cosmic **count**,
  Provided conscious minds are here to **exist**.
  No favoured **theory** claims a special pass,
  For I am but a single **observer**.

  No privileged seat for the **observer**,
  Merely one drawn from the random **sample**.
  We test each competing **theory**,
  Within a fixed reference **class**.
  Remaining content simply to **exist**,
  And ignoring the total **count**.

  Nor does the universal **count**,
  Disturb the typical **observer**,
  Who is privileged to **exist**.
  Drawn from the random **sample**,
  Within the reference **class**,
  According to the **theory**.

  Now every cosmological **theory**,
  Gains weight from observer **count**.
  I broaden the reference **class**,
  To include every **observer**,
  Expanding now the **sample**,
  Because I happen to **exist**.

  Since I continue to **exist**,
  Worlds favouring this **theory**,
  Where I am in the **sample**,
  With a higher observer **count**,
  Are more likely for the **observer**,
  Than any restricted **class**.

  The reference **class**,
  Must include all who **exist**,
  Every possible **observer**,
  In any plausible **theory**,
  With an infinite **count**,
  Dissolving the **sample**.

  So **theory** swells the **count** beyond the **class**,
  Where no **observer** finds a **sample** left,
  To prove they **exist**.
