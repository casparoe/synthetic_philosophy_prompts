answer: |-
  ### Session Plan: The Ontic/Epistemic Divide (70 Minutes)

  **Goal:** Participants construct the Harrigan–Spekkens criterion themselves using a structural analogy, then apply it to interpretations.
  **Constraint Checklist:** No Hilbert space math. No complex numbers. No interference patterns. One carrying example used three times.

  ---

  ### I. The Carrying Example: "The Factory and the Widget"
  You will use this single analogy for the entire hour. It abstracts the logic of quantum states without the linear algebra.

  *   **The Setup:** Imagine a factory that produces physical widgets.
  *   **The Ontic State ($\lambda$):** The exact physical specification of a widget (e.g., its precise mass and shape). This is the "reality."
  *   **The Quantum State ($\psi$):** The **Setting** on the factory dial used to produce the widget. There are two settings: **Setting A** and **Setting B**.
  *   **The Link:** The settings are noisy. Setting A produces widgets with a range of masses. Setting B produces widgets with a range of masses.
  *   **What it must have:** Two distinct preparation procedures ($\psi_1, \psi_2$) that yield probability distributions over a shared space of physical properties ($\lambda$).
  *   **What it must lack:** Any mention of measurement interference, complex amplitudes, or macroscopic superposition. It is purely about *preparation* and *underlying reality*.

  ---

  ### II. Order of Introduction & Dependencies
  Do not define "ontic" or "epistemic" until Step 3. The participants must feel the need for the distinction before you name it.

  **1. The Reality Assumption (Minutes 0–10)**
  *   **Action:** Draw a horizontal line on the board. Label it "Space of Physical Possibilities ($\lambda$)." Tell them: "Regardless of quantum mechanics, assume there is some fact of the matter about what the system *is*. Call this $\lambda$."
  *   **Dependency:** You must establish **Realism** first. Without a $\lambda$, the distinction is meaningless.
  *   **Action:** Introduce the Factory. "Setting A produces widgets. Setting B produces widgets." Draw two bell curves (distributions) over the line.
  *   **Dependency:** You must establish **Preparation** before State. $\psi$ is a procedure, not just a vector.

  **2. The Substantive Question (Minutes 10–20)**
  *   **Usage 1 of Example:** Make the question feel physical, not verbal.
  *   **Action:** Point to a spot on the line where the two bell curves overlap. Ask: "A widget sits here. It was made by either Setting A or Setting B. I don't tell you which. Does the fact that it *could* have come from either mean the Settings were just descriptions of my knowledge? Or does it mean the Settings are physically distinct things that just happen to look similar here?"
  *   **Goal:** Elicit the intuition that if the *same physical object* can result from two different "States," then the "State" cannot be the object itself.

  **3. Generating the Criterion (Minutes 20–35)**
  *   **Usage 2 of Example:** State the criterion.
  *   **Action:** Ask the group: "Draw me a picture where the 'State' is definitely the physical reality. Now draw me a picture where the 'State' is definitely just information."
  *   **Target Output:** They should draw **Disjoint Blobs** (Ontic) vs. **Overlapping Blobs** (Epistemic).
  *   **Formalization:** Once they draw it, give them the formal terms:
      *   **$\psi$-ontic:** Distinct $\psi$ imply disjoint distributions over $\lambda$. (No overlap).
      *   **$\psi$-epistemic:** Distinct $\psi$ imply overlapping distributions over $\lambda$. (Overlap allowed).
  *   **Dependency:** This step *depends* on them accepting that $\psi$ maps to a distribution $P(\lambda|\psi)$. If they think $\psi$ *is* $\lambda$, they cannot draw the overlap.

  **4. The PBR Pressure (Minutes 35–50)**
  *   **Usage 3 of Example:** The case PBR bites on.
  *   **Action:** "Imagine I take two factories. I run Setting A on one and Setting B on the other. Now I have a pair of widgets."
  *   **The Bite:** "If your distributions overlapped (Epistemic), there is a chance *both* widgets are in the overlap region. If that happens, the physical pair looks identical regardless of whether I ran (A,B), (B,A), (A,A), or (B,B)."
  *   **The Conflict:** "Quantum mechanics says those four combined preparations are physically distinguishable. If your model says they look identical in the overlap, your model contradicts quantum predictions."
  *   **Conclusion:** PBR shows that maintaining the "Overlap" (Epistemic) requires giving up "Preparation Independence" (the idea that two separate factories don't coordinate their hidden variables).

  ---

  ### III. Mapping Misconceptions & Interventions

  **1. "Epistemic just means it's in the observer's head."**
  *   **When to head off:** During Step 3 (Generating the Criterion).
  *   **Intervention:** "If I write a probability on a chalkboard, that's in my head. If I program a robot to act based on that probability, the information is physically encoded in the robot. $\psi$-epistemic means $\psi$ is like the robot's code: objective information, but not the *stuff* the robot is made of. It distinguishes **Map** from **Territory**, not **Mind** from **World**."

  **2. "Bohmian Mechanics must be epistemic since the particle has a definite position."**
  *   **When to head off:** During Classification (Step 5).
  *   **Intervention:** "Bohm has particles ($\lambda$), yes. But what is the Wave Function ($\psi$)? In Bohm, $\psi$ is a 'pilot wave' that physically pushes the particle. It exists in configuration space. It is not just knowledge; it is a force field. Therefore, Bohm is **$\psi$-ontic**. The particle is real, and the wave is real."

  **3. "PBR settles it outright."**
  *   **When to head off:** During Step 4 (The PBR Pressure).
  *   **Intervention:** "PBR proves that $\psi$-epistemic models are incompatible with Quantum Mechanics *only if* you assume Preparation Independence. If you believe the universe is a holistic block where two 'separate' factories can share hidden variables (superdeterminism or holism), PBR does not bite. It rules out *local* epistemic models, not all of them."

  **4. The Committed Everettian**
  *   **The Threat:** They will claim the distinction is confused because there is no collapse and the whole wavefunction is real.
  *   **The Move:** When they speak, validate them, then pivot.
  *   **Script:** "You are right that Many-Worlds avoids collapse. But answer this: In your view, is the Wavefunction the *furniture of the universe*? Is it the stuff that branches?"
      *   *If they say Yes:* "Then for you, $\psi$ is the physical state. You are a **$\psi$-ontologist**. The distinction still applies; you just take the 'Ontic' horn."
      *   *If they say No:* "Then what is branching? If $\psi$ isn't the stuff, what is?" (This usually forces them to admit $\psi$-onticity).
  *   **Goal:** Prevent them from dissolving the taxonomy. Force them to occupy one of the two quadrants.

  ---

  ### IV. Classification Exercise (Minutes 50–60)
  Give them three short descriptions. Ask them to classify using *their* criterion (Overlap vs. Disjoint), not memorized labels.

  1.  **Theory X:** "The state $\psi$ is a list of propensities. Two different lists can assign non-zero probability to the exact same physical configuration." -> **Epistemic** (Overlap).
  2.  **Theory Y:** "The state $\psi$ is a physical field. Two different fields cannot occupy the same configuration space at once." -> **Ontic** (Disjoint).
  3.  **Theory Z:** "The state $\psi$ describes the agent's betting odds. The physical configuration is unknown but fixed." -> **Epistemic** (Overlap implied).

  ---

  ### V. Closing & Scope (Minutes 60–70)

  **The Diagnostic Question**
  Do not ask "What is $\psi$-ontic?" Ask this:
  > "I propose a theory where the quantum state $\psi$ determines the probability of the underlying state $\lambda$, but I guarantee that for any two distinct $\psi_1$ and $\psi_2$, the set of possible $\lambda$'s never overlaps. Is this theory $\psi$-ontic or $\psi$-epistemic, and why?"

  *   **Correct Answer:** "$\psi$-ontic. Because the distributions are disjoint, the state $\psi$ uniquely identifies the physical reality (or subset thereof) without ambiguity. There is no 'shared knowledge' region."
  *   **Memorizer Answer:** "$\psi$-ontic because... that's the definition." (Probe for "disjoint" vs "real").

  **What to Explicitly Decline**
  To protect the 70-minute limit, state clearly at the start and end that you are **not** covering:
  1.  **The Derivation of the Born Rule:** We assume probabilities exist; we are asking what they *are*.
  2.  **The Mathematical Proof of PBR:** We discussed the *assumption* (independence) and the *contradiction* (indistinguishability), not the Hilbert space proof.
  3.  **Collapse Mechanisms:** Whether the wavefunction collapses (GRW, Copenhagen) is separate from whether the wavefunction *is* reality. (Copenhagen is notoriously hard to classify, so explicitly exclude it as "Instrumentalist" and outside the Ontic/Epistemic binary).

  **Final Dependency Check:**
  Ensure they leave knowing that **Overlap** is the necessary condition for **Epistemic**. If they forget the labels, they can redraw the blobs. If they can redraw the blobs, they can classify.
