  To claim "It's true, though hidden from my light,"
  Is speech that breaks beneath the weight of right.
  Though true the claim, it strikes the public sight,
  And leaves the speaker bound by truth's own might.
  When challenged close, no plea of "belief" can stand,
  You must produce what knowledge puts in hand.
  If luck makes true what you had no right command,
  You're on the hook, condemned by truth's demand.

  Yet say she knows by cable, sealed and known,
  But tells a hearer left in doubt's domain.
  He holds strong evidence against her own,
  And cannot check the secret in her brain.
  One violates the rule and bears the blame,
  One misses standards clean, without the shame.
