answer: |-
  ### I. Mapping the Resolutions onto the Condemnations

  To map the standard analytic resolutions of the omnipotence paradox onto the 1277 syllabus, we must treat the condemned articles not as logical puzzles but as modal claims about the scope of divine agency.

  **1. The Contradiction-Limit View**
  *   **The Theory:** Omnipotence extends to all things that are logically possible; things involving a contradiction fall outside its scope.
  *   **Application to 1277:**
      *   *Rectilinear Motion/Void:* The article claims God *cannot* move the heavens rectilinearly because a vacuum would result. Under the contradiction-limit view, this is false *if and only if* the existence of a vacuum is not logically contradictory. Aristotelian physics treats the vacuum as impossible, but logic does not. Tempier treats it as logically possible. Therefore, the article falsely limits God's power by conflating physical necessity with logical impossibility.
      *   *Multiple Worlds:* The article claims God *cannot* make several worlds. "Two worlds" is not a contradiction (unlike "two unique first causes"). Therefore, the article is straightforwardly false.
  *   **Verdict on Condemnation:** The condemnation is correct under this view. The articles are false because they misidentify natural constraints as logical limits. However, this reveals that the debate is not about omnipotence per se, but about the *modal status of physics*. If a vacuum were logically contradictory, the article would be true, and condemning it would deny the contradiction-limit view itself.

  **2. The Ill-Formed Task View**
  *   **The Theory:** Paradoxes like the Stone arise because "a stone too heavy to lift" fails to describe a coherent state of affairs.
  *   **Application to 1277:**
      *   *Rectilinear Motion/Void:* "Moving a body through space leaving no body behind" is a coherent description. It is not semantically defective like "making a square circle."
      *   *Multiple Worlds:* "Creating a distinct universe" is coherent.
  *   **Verdict on Condemnation:** This view supports Tempier strongly. The Stone Paradox dissolves because the task is nonsense; the 1277 articles do not dissolve because the tasks are coherent. Condemning the articles is necessary because they deny God the ability to perform coherent tasks. This highlights a divergence: the Stone Paradox protects omnipotence from incoherence; 1277 protects omnipotence from *physical* incoherence.

  **3. Senses of "Can" / Maximal Power**
  *   **The Theory:** Omnipotence is maximal power compossible with God's nature or indexed across possible worlds, not the ability to do anything describable.
  *   **Application to 1277:**
      *   *Rectilinear Motion/Void:* If "can" is indexed to the actual world's laws, God cannot make a void. If "can" is indexed to logical space, He can. Tempier insists on the latter.
      *   *Multiple Worlds:* Same structure.
  *   **Verdict on Condemnation:** The condemnation asserts that the index for divine "can" is not the actual order of nature. This resolution works only if we accept that "maximal power" implies freedom from the created order. If one argues that "maximal power" includes the power to establish a stable, non-intervened order (which a void might disrupt), the condemnation becomes contentious. Tempier rejects this: stability does not limit power.

  **4. The Voluntarist Response (Descartes)**
  *   **The Theory:** God is the author of eternal truths; He could have made contradictions true or necessities false.
  *   **Application to 1277:**
      *   *Rectilinear Motion/Void:* A strict voluntarist would say God determines whether a void is possible. The article says He *cannot*. This is a direct violation of voluntarism.
      *   *Multiple Worlds:* Same.
  *   **Verdict on Condemnation:** Tempier is a proto-voluntarist regarding *natural* necessity, but he likely retains *logical* necessity (non-contradiction). The condemnation is consistent with voluntarism regarding physics, but 1277 does not go so far as to say God could make a vacuum logically contradictory if He willed. It says He can do what physics says He can't.

  **Summary of Mapping:** Under the contradiction-limit view, the articles are false because they mistake physical for logical impossibility. Under the ill-formed task view, the articles are false because the tasks are coherent. Under voluntarism, they are false because they bind the Will. In all three, the condemnation is "right," but for different reasons: the first two preserve the logic of power, the third preserves the sovereignty of Will.

  ### II. The Structural Mismatch

  The Stone Paradox is self-referential: it asks if the definition of omnipotence undermines itself. The 1277 articles are not self-referential; they are first-order modal claims about cosmology (voids, worlds, motion).

  **Does this support the deflationary diagnosis?**
  If the paradoxes were merely semantic artifacts, we would expect the real theological work to vanish once "can" is clarified. 1277 suggests the opposite. Even if "can" is clarified, the dispute remains: *Is a vacuum possible?* The paradox literature treats "possibility" as a given logical background. 1277 treats "possibility" as the contested terrain. The deflationary diagnosis fails here because 1277 shows that the battle over omnipotence is actually a battle over *modal metaphysics*. The paradox literature asks, "What does 'all power' mean?" 1277 asks, "What counts as a 'possible world'?"

  **Does it suggest the substantive diagnosis?**
  Yes. The real disputes are about which metaphysical and physical possibilities are ruled out and on whose authority. The paradox literature ignores this because it assumes a neutral logical space where "possible" is univocal. 1277 reveals that "possible" is the site of conflict between Aristotelian physics (nature abhors a vacuum) and Theological voluntarism (God can do anything not contradictory). The mismatch suggests that analytic paradoxes are sanitized versions of a deeper conflict: who defines the boundaries of possibility? The logicians or the theologians?

  **Verdict:** 1277 is an anomaly for the paradox literature. It is a case the literature never anticipated because the literature assumes the modal landscape is fixed, while 1277 asserts the modal landscape is subject to divine fiat.

  ### III. Absolute vs. Ordained Power

  The distinction between *potentia absoluta* (what God can do logically) and *potentia ordinata* (what God has chosen to do) is the standard theological tool for handling these claims.

  **Does it resolve the paradox?**
  No. It relocates it. It allows one to say, "God *could* make a void (absolute), but *won't* (ordained)." This dissolves the tension between divine power and observed nature.

  **Does Tempier invoke this?**
  Tempier uses the distinction, but aggressively. He is not merely preserving a logical possibility; he is condemning the assertion that the ordained order *necessitates* the absolute limit. The offenders claimed God *cannot* move the heavens rectilinearly. Tempier says He *can*. This is an assertion that the ordinary course of nature imposes no constraints on what may be asserted about God's capacity.

  **Verdict:** The distinction gives the paradox a respectable vocabulary, but Tempier uses it as a weapon. He is not using *potentia absoluta* to explain why the world is stable; he is using it to break the claim that the world's stability proves God's limitation. In this context, the distinction does not resolve a logical puzzle; it enforces a hierarchy of authority. Theology dictates the boundaries of possibility; physics reports the actualities.

  ### IV. The Descartes Comparison

  Is Descartes's voluntarism (God authors logical truths) a consistent extension of 1277 or a violation?

  **The Case for Extension:**
  1277 asserts that natural necessity (physics) does not bind God. Descartes asserts that logical necessity (math/logic) does not bind God. Both move the boundary of constraint outward to protect divine sovereignty. 1277 targets those who say "True in Philosophy (Physics), False in Theology." Descartes resolves this by making Theology (Will) the source of Philosophy (Truth). If God wills that 2+2=5, then it is true in both. This eliminates the "double truth" by subsuming reason under will.

  **The Case for Violation:**
  1277 implicitly accepts the law of non-contradiction. Tempier condemns the idea that God cannot make multiple worlds, not the idea that God cannot make a world both exist and not exist. The condemnation assumes a logical framework where "multiple worlds" is coherent. Descartes rejects that framework. If God can make contradictions true, the contradiction-limit view (which validates Tempier's condemnation of the vacuum article) collapses. If God can make a vacuum contradictory, then the article "God cannot make a vacuum" might be true. Descartes undermines the very logical stability Tempier relied on to condemn the articles.

  **Verdict:** Descartes is a radical extension that risks violating the logical precondition of 1277. 1277 uses omnipotence to free God from *nature*. Descartes uses omnipotence to free God from *reason*.
  **What this shows:** "Omnipotence" is doing two different jobs. In 1277, it is a **modal expander** (adding possibilities to the set of what can be done). In Descartes, it is a **truth-maker** (determining the status of the possibilities themselves). 1277 assumes a realm of possibility God can access; Descartes assumes God creates the realm.

  ### V. Discipline on Silence and Category Mistakes

  There is a point where the analytic theory falls silent, and treating the decree as a test case for logic risks a category mistake.

  **The Category Mistake:**
  Analytic omnipotence debates are exercises in conceptual analysis: "What does the word 'omnipotent' mean?" 1277 is an exercise in ecclesiastical governance: "What may be taught without heresy?"
  Treating a condemnatory decree as a truth-functional logic puzzle ignores the *normative* force of the document. Tempier is not solving a paradox; he is drawing a boundary. The theory asks, "Is proposition P true?" The decree asks, "Is asserting proposition P licit?"
  These are not the same. One can assert a false proposition licitly (if done in error), and one can assert a true proposition illicitly (if done to undermine faith). 1277 conflates truth and licitness for the sake of order. Analytic theory separates them.

  **Where the Theory is Silent:**
  The theory has no account of *authority*. In the Stone Paradox, the arbiter of coherence is human reason. In 1277, the arbiter of coherence is the Bishop. If Tempier says "A vacuum is possible," it is possible for the university. If the theory says "A vacuum is logically contingent," it is contingent in logical space. The theory cannot account for the moment where an institutional decree *makes* a modal claim binding for a community.
  **Verdict:** 1277 is an anomaly for the theory. It is not a confirmation of a resolution, nor a simple counter-example. It is a different kind of speech act. It shows that "omnipotence" functions socially as a boundary-marker for orthodoxy, not just logically as a predicate of a subject.

  ### VI. Final Question for the Seminar

  If some of the condemned articles cannot be evaluated as true or false under the contradiction-limit view at all—because they conflate physical necessity with logical impossibility, or because they are normative prohibitions on teaching rather than descriptive claims about power—what does that tell us about whether omnipotence paradoxes are about power, about possibility, or about nothing but the grammar of an honorific?
