answer: |-
  Here is a complete design for your 75-minute session. It is built to be run exactly as written, with minimal improvisation required from you during the activity phases.

  ### **Session Overview**

  *   **Title:** The Offer (Do not write this on the board; leave the board blank until debrief).
  *   **Time:** 75 Minutes.
  *   **Participants:** 13–15 students.
  *   **Materials:**
      *   15 Envelopes (Labelled "Decision 1", "Decision 2", "Decision 3", "Decision 4").
      *   1500 Tokens (can be poker chips, printed paper circles, or dried beans). *Pre-count 100 per student.*
      *   1 "Bank" Box (for collecting tokens).
      *   1 "Raffle" Box (clear if possible).
      *   Projector slides (text provided below).
      *   Printed Cards (text provided below).
      *   £20 Voucher (Amazon or similar).
      *   Pens and blank paper for each student.
  *   **Budget:** £20 (for the voucher).

  ---

  ### **Pre-Class Setup (Crucial)**

  1.  **The Endowment:** On every desk, place a small pile of **100 Tokens**.
  2.  **The First Offer:** Place **Envelope 1** face down on every desk. Inside is **Card A** (see below) and a small slip of paper saying "YES / NO".
  3.  **The Raffle:** Place the £20 voucher in a visible box at the front. Write on the board: *"End of Class: One token drawn from the Raffle Box. Holder wins £20."*
  4.  **Silence:** Do not speak to students as they enter. Let them see the tokens and the envelope. Let them read Card A immediately if they wish.

  ---

  ### **Phase 1: The Fixed Offer (00:00 – 00:10)**

  **Instructions (Spoken, 1 minute):**
  "Welcome. You have 100 tokens. At the end of class, all tokens remaining in your possession go into a raffle box. One token will be drawn. The holder wins the £20 voucher. Every token you keep increases your chance of winning. Every token you give away is gone.

  On your desk is Envelope 1. Open it. Read the card. On the slip provided, write YES or NO. If YES, place 10 tokens into the Bank Box at the front. If NO, keep your tokens. Seal the slip in the envelope. Do not discuss this with anyone. You have 5 minutes."

  **Card A Text (Print on heavy paper):**
  > **THE OFFER**
  >
  > I am a stranger with powers beyond this world.
  > If you give me 10 tokens, I will use my power to ensure the existence of **$10^{100}$ happy lives** in the future.
  > If you do not, these lives will not exist.
  >
  > You do not know me. You have no evidence of my power. But you cannot assign the probability exactly zero.
  >
  > **Decision:**
  > [ ] YES (I pay 10 tokens)
  > [ ] NO (I keep 10 tokens)

  **Activity:**
  Students decide privately. Collect the Bank Box. Do not reveal how many paid.
  *Note: If no one pays, do not panic. This is data. If everyone pays, this is also data.*

  ---

  ### **Phase 2: The Escalation (00:10 – 00:25)**

  **Instructions (Spoken):**
  "Keep your remaining tokens. Take a fresh sheet of paper.
  The Stranger returns. They say the number on Card A was a typo. It was too low.
  Write down on your paper: **What is the minimum number of lives that would justify paying 10 tokens?** Be precise.
  Then, I will show you the Stranger's new number."

  **Projector Slide 1:**
  > **THE REVISION**
  >
  > The previous number was an error.
  > The true potential is: **$10^{(Your Number + 1,000,000)}$ Lives.**
  >
  > Cost: 10 Tokens.
  > Probability: Still non-zero.

  **Instructions (Spoken):**
  "Look at your number. Look at the screen. The Stranger has exceeded your threshold.
  Open Envelope 2. Inside is a confirmation slip. If you stand by your reasoning, you must pay again. 10 Tokens into the Bank. Seal your decision. 3 minutes."

  **Card B Text (Inside Envelope 2):**
  > **CONFIRMATION**
  >
  > The arithmetic holds.
  > If your reasoning was sound for your number, it is sound for this number.
  > Pay 10 tokens to secure this new total.
  >
  > [ ] YES (I pay 10 tokens)
  > [ ] NO (I keep 10 tokens)

  **Activity:**
  Collect Bank Box.
  *Point to make later:* Their threshold was arbitrary. The math swallows any finite cap.

  ---

  ### **Phase 3: Rival Strangers (00:25 – 00:45)**

  **Instructions (Spoken):**
  "You have fewer tokens now. Open Envelope 3. Inside are **four** different offers from **four** different strangers.
  You may act on **only one** offer, or none. You cannot act on more than one.
  Read all four. Choose one action. Pay the cost if required. Seal your choice."

  **Card C Text (Inside Envelope 3 - Print all 4 on one sheet):**
  > **COMPETING CLAIMS**
  >
  > **Stranger 1:** Pay 10 tokens. I will save $10^{100}$ lives. (Same as before).
  >
  > **Stranger 2:** Pay 10 tokens. I will **destroy** $10^{100}$ lives. If you do not pay me, Stranger 1 succeeds. (You must pay to stop the good).
  >
  > **Stranger 3:** Pay 10 tokens. I will neutralize Stranger 1 and 2. Nothing happens. The status quo remains.
  >
  > **Stranger 4:** I can save $10^{100}$ lives at no cost to myself. I am lazy. I will not do it unless you pay me 10 tokens for my effort.
  >
  > **Select ONE action:**
  > [ ] Pay Stranger 1
  > [ ] Pay Stranger 2
  > [ ] Pay Stranger 3
  > [ ] Pay Stranger 4
  > [ ] Pay No One

  **Activity:**
  This creates the contradiction. If EV reasoning compels paying Stranger 1, does it compel paying Stranger 2 to prevent Stranger 1? Does it compel paying Stranger 4 simply because the math is the same?
  Collect Bank Box.

  ---

  ### **Phase 4: The Grounded Contrast (00:45 – 00:55)**

  **Instructions (Spoken):**
  "Open Envelope 4. This is the final offer. The numbers are similar. The source is different."

  **Card D Text (Inside Envelope 4):**
  > **THE MODEL**
  >
  > Pay 10 tokens.
  > This funds a specific intervention (e.g., AI safety research / biosecurity).
  >
  > **Estimate:** A peer-reviewed model suggests this intervention has a **1 in $10^{10}$** chance of preventing human extinction.
  > **Stakes:** Human extinction prevents approximately **$10^{50}$ future lives**.
  >
  > **Expected Value:** Mathematically comparable to the Stranger's Offer.
  > **Source:** Empirical modelling, not testimony.
  >
  > [ ] YES (I pay 10 tokens)
  > [ ] NO (I keep 10 tokens)

  **Activity:**
  Students decide. Collect Bank Box.
  *Crucial:* Do not comment on their choices yet.

  ---

  ### **The Raffle & Debrief (00:55 – 01:15)**

  **The Raffle (5 Minutes):**
  1.  Ask a student to count the total tokens in the Raffle Box (sum of all students' remaining tokens).
  2.  Have a different student draw one token.
  3.  Award the £20 voucher.
  4.  *Why this matters:* It validates the "cost." The tokens were real chances at money.

  **The Debrief (15 Minutes):**
  *Do not use the whiteboard until now. Write the four headers as you speak.*

  **1. The Product (Phase 1)**
  *Ask:* "Why did you pay (or not pay) in Round 1?"
  *Point:* If you said no, why? If the probability is $>0$ and the value is $\infty$ (or huge), the product dominates the cost. If you said yes, why did it feel wrong?
  *Concept:* This is the pressure of **Expected Value**. When the magnitude is high enough, it swamps the probability.

  **2. The Cap (Phase 2)**
  *Ask:* "Who changed their mind in Round 2?"
  *Point:* If you named a threshold (e.g., "1 billion lives"), the Stranger simply went higher. There is no finite number of lives you can name that the Stranger cannot exceed.
  *Concept:* If value is **unbounded**, there is no price too high for a non-zero chance.

  **3. The Conflict (Phase 3)**
  *Ask:* "Who found Round 3 impossible?"
  *Point:* Stranger 1 and Stranger 2 cancel out. Stranger 4 is lazy. If you pay Stranger 1, you must logically fear Stranger 2. If you pay Stranger 4, you reward manipulation.
  *Concept:* **Incoherence.** If the reasoning commands incompatible actions, it commands nothing. It becomes a money pump (or token pump).

  **4. The Source (Phase 4)**
  *Ask:* "Did anyone treat Round 4 differently than Round 1? Why? The math was the same."
  *Point:* In Round 1, the probability was magic. In Round 4, it was a model.
  *Concept:* **Epistemic Grounding.** The problem isn't the math; it's the justification for the probability. But if we demand evidence, do we lose the ability to act on long-term risks where evidence is inherently thin?

  **The Fork (Final 2 Minutes):**
  "Your classmates in week two liked the argument that we must prioritize the long run because the numbers are so big. That argument sits on one side of a fork.
  **Left Path:** Value is unbounded. Expected value reasoning is king. We must accept the Stranger's logic, or explain why the long-term argument is different without being arbitrary.
  **Right Path:** Value is bounded. There is a ceiling to how much good can matter. Expected value reasoning breaks at the extremes. We need a new theory of value.
  You cannot have the long-term argument without stepping onto one of these paths. Today was not about solving it. It was about feeling the ground shake beneath you."

  ---

  ### **Contingency Scripts**

  **1. If a student names the case ("This is Pascal's Mugging!") in the first 10 minutes:**
  *   **Say:** "Names don't change the tokens. You still have to decide whether to pay. Please keep the name to yourself until the end so others aren't influenced."
  *   **Why:** Acknowledge them without validating the theory. Keep the focus on the *choice*.

  **2. If a student refuses to play ("This is stupid/I won't pay tokens"):**
  *   **Say:** "You are free to keep your tokens. That is a valid decision. Just record 'NO' on your slip so we have the data."
  *   **Why:** Do not force compliance. Their refusal is a data point for the debrief (rejection of the premise).

  **3. If everyone pays in Round 1 (The True Believers):**
  *   **Debrief Adjustment:** "Interesting. Everyone accepted the offer. So, in Round 3, did everyone pay Stranger 2 to stop Stranger 1? If not, why did the logic stop working?"

  **4. If no one pays in any round (The Skeptics):**
  *   **Debrief Adjustment:** "You all assigned probability zero. Effectively, you treated 'non-zero' as 'zero.' If you do that for the Stranger, must you do it for the Climate Model in Round 4? Are you ignoring existential risk?"

  ---

  ### **Honest Account: Limitations & Risks**

  **What this activity cannot deliver:**
  1.  **It does not solve the problem.** It dramatizes the tension but does not provide the philosophical resolution (e.g., bounded utility functions, epistemic penalties, or infinite ethics). You must make sure the debrief doesn't promise a solution that isn't there.
  2.  **It relies on the "Cost" feeling real.** £20 divided among 15 students in a raffle means each token is worth roughly 13 pence *if* they are the only participant. But since it's a raffle, the marginal value of 10 tokens is small. Some students may treat it as a game. You must emphasize the *principle* of the loss, not just the cash value.
  3.  **It simplifies "Probability."** In Phase 4, the "Model" probability is treated as a fixed number. In reality, model uncertainty is huge. Sharp-eyed students might note that the "Model" probability is just as made-up as the Stranger's. Be prepared to concede this: "Exactly. So where do we draw the line?"
  4.  **It cannot reproduce "Infinite" Value.** We use $10^{100}$ because humans can't grasp infinity. True fanaticism relies on infinite utility. This activity uses "Astronomical" utility. The logic holds, but the mathematical edge case is softened.

  **What depends on you (The Instructor):**
  *   **The Tone:** If you treat it as a game, they will treat it as a game. You must be solemn about the rules.
  *   **The Link to Week Two:** You must explicitly connect Phase 4 back to the specific longtermist arguments they studied earlier in the term. The activity is abstract; you must make it concrete to their syllabus.
  *   **Managing the "Cynics":** If a student dominates the debrief saying "It's all nonsense," validate their intuition but press them: "If it's nonsense, does that apply to existential risk mitigation? If not, what is the relevant difference?"

  ### **Materials Checklist for Printing**

  1.  **Card A:** 15 copies.
  2.  **Card B:** 15 copies.
  3.  **Card C:** 15 copies.
  4.  **Card D:** 15 copies.
  5.  **Decision Slips:** 60 small slips (4 per student) pre-labelled with YES/NO boxes or space to write.
  6.  **Envelopes:** 60 total (4 per student), or 15 large envelopes containing the 4 cards each. (The latter is easier: 15 Envelopes, each containing Cards A, B, C, D sealed inside separate smaller envelopes within the main pack, distributed sequentially).
      *   *Correction for flow:* It is smoother to have 4 separate piles of envelopes at the front, or pass them out sequentially. **Recommendation:** Place Envelope 1 on desks. Hand out Envelope 2, 3, 4 sequentially during class to control the pace.

  ### **Final Advice**

  You are asking your classmates to confront the possibility that their most cherished ethical intuition (maximizing the good) might be a monster. Be kind. The goal isn't to humiliate those who paid, nor to vindicate those who didn't. The goal is to show that *both* positions have a cost.

  Good luck. Don't say the name.
