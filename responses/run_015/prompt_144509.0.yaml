      *   *Gödel Numbering:* The mapping from symbols to numbers. In the brain, this is the mapping from external/internal states to neural representations. (Representation/Encoding).
      *   *Unprovable Statement ($G$):* The specific self-referential assertion. In the mind, this is the "I" concept or the feeling of subjective experience (Qualia/Self-model).
      *   *Strange Loop:* The hierarchical level crossing. In logic, it's syntax talking about syntax. In mind, it's the thinker thinking about the thinker.

