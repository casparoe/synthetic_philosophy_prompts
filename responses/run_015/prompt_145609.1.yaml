          *   *Draft:* "Our data shows people punish."
          *   *Refinement:* Focus on the "cost" aspect. Can you measure the computational cost? Does your model predict the *rate* of cooperation better than Generous TFT?
      *   *PoB Objection:* Needs to focus on agency and adaptationism.
          *   *Draft:* "This is just a just-so story."
          *   *Refinement:* Challenge the "opacity" concept. Is it a cognitive limit or a normative claim about what agents *ought* to ignore? Are you reifying a heuristic as a mechanism?

  4.  **Developing the Responses (Concede/Hold/Weakest):**

      *   *EGT:* Concede that pure unconditional cooperation isn't stable. Hold that *conditional* but *oblivious to intent* (treating all defection as noise) is the key. Weakest point: The invasion by AllD if noise is low.
