      *   *Vulnerability 5 (The Formal Gap):* The user admits lacking a formal derivation of the opacity condition from bounded rationality. This is the biggest hole.

  3.  **Drafting the Objections (Iterative Process):**

      *   *EGT Objection:* Needs to focus on stability. If you don't punish, you get invaded.
          *   *Draft:* "If you don't condition on defection, AllD invades you."
