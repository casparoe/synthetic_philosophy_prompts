answer: |-
  **PROTOCOL 14-B: INVESTIGATION OF TEMPORAL CORRELATES OF VOLITIONAL MOTOR ACTS**
  **PARTICIPANT INFORMATION SHEET AND INFORMED CONSENT FORM**

  **1. Purpose of the Study**
  The University Department of Motor Neuroscience invites you to participate in a study regarding the timing of conscious intention. The primary objective is to demonstrate that neural activity predicting motor execution occurs prior to the participant's conscious awareness of the decision to move. By correlating electroencephalographic (EEG) voltage drifts with retrospective time reports, the study aims to operationalize voluntary action as a biological process wherein conscious intention serves as a notification rather than a cause.

  **2. Eligibility Criteria**
  Participants must possess full mobility of the dominant wrist and no history of seizures. Additionally, participants must be capable of generating spontaneous urges to move without planning them in advance, despite the instruction to produce such urges approximately every six seconds to ensure sufficient data density. Individuals who strongly believe that conscious thought initiates physical movement may experience cognitive dissonance and should proceed with caution.

  **3. Procedure**
  You will be fitted with an EEG cap. You will watch a dot sweeping around a clock face. You will be instructed to flex your wrist whenever the urge arises. Following each flex, you will report the position of the dot when you first felt the urge. This will be repeated 200 times. You are instructed not to count or plan ahead. You must allow the urge to arise spontaneously, though failure to produce a movement within a reasonable timeframe may be recorded as non-compliance with the spontaneity protocol.

  **4. Data Handling and Averaging**
  Raw EEG data contains significant noise. To identify the Readiness Potential (RP), individual trials will be averaged together. Please note that while the RP is visible in the average, the onset of voltage drift in any single trial is arbitrary and defined by a statistical threshold rather than a distinct biological event. The slow negative drift observed may represent the accumulation of random noise rather than a decision being formed, but for the purposes of this study, it will be treated as the latter. Your specific neural data will be anonymized, though the metaphysical implications remain attributable to you.

  **5. Risks and Side Effects**
  Common side effects include scalp irritation from the EEG cap and mild fatigue. Less common side effects include existential dread, confusion regarding personal agency, and the sensation of being a passenger in one's own body. Some participants report feeling that their upcoming choices have been decoded from brain activity seconds before they were made, rendering the experience of deliberation retrospective. If you feel your conscious intention is doing no causal work, please inform the lab technician.

  **6. Right to Withdraw**
  You have the right to withdraw from the study at any time. However, please be advised that neural markers predicting your decision to withdraw may be detected prior to your conscious awareness of the desire to stop. You retain the right to veto the movement associated with withdrawal, though preparatory neural activity for the veto itself may also be pre-conscious. If you choose to withdraw, your data will be destroyed unless it has already been averaged into the group mean, in which case it cannot be individually distinguished.

  **7. Indemnity and Metaphysical Status**
  By signing below, you acknowledge that the study operates under the assumption that conscious will does not initiate motor acts. You agree that the gap between finding a neural precursor and concluding that conscious intention is epiphenomenal is methodologically sound. You indemnify the University against claims arising from the realization that your consent was biologically determined before you picked up the pen.

  **8. Consent Declaration**
  Please tick one box:
  [ ] I concede that my conscious intention is a post-hoc narrative and I consent accordingly.
  [ ] I am a compatibilist and wish to opt out of the hard determinism clause while still providing wrist flexes.

  __________________________
  **Participant Signature**

  __________________________
  **Date**

  ***

  **NOTE ON SCIENTIFIC LIBERTIES**

  This parody leans heavily on the interpretive slide from methodological operationalization to metaphysical conclusion. While the Libet paradigm does show neural activity preceding reported intention, the claim that this disproves conscious causation is fiercely contested. The document treats the averaging of trials as creating a signal that exists in single trials, which is statistically dubious; the Readiness Potential may not exist in every movement. The "compatibilist opt-out" satirizes the lack of philosophical nuance in standard consent forms, though no ethics board would actually demand a metaphysical stance. The point I am least confident about is the decoding claim; while some studies predict choices seconds in advance using fMRI, EEG prediction windows are typically shorter, but I extended this for comedic effect regarding the "passenger" sensation. The veto power section exaggerates the uncertainty around whether "free won't" also has neural precursors, which remains an open empirical question.
