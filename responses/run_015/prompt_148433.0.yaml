answer: |-
  This is a sharp argument. You've essentially reconstructed the tension between **David Hume's bundle theory of self**, **Gary Becker's rational addiction models**, and **George Ainslie's picoeconomics**.

  You are right to feel it "proves too much." If accepted, it dissolves agency entirely. If you are just a sequence of temporal slices with no normative connection, you can't plan, you can't promise, and you can't be responsible.

  Here is the diagnosis: **The slip is in the inference from (3) to (4).**

  You can keep (2) (Hyperbolic Discounting) and (5) (Precommitment mechanics) without accepting (4) (No real mental failure). To do this, you must reject the metaphysical claim in (3) that time-inconsistent preferences imply "no single you."

  Here is the breakdown of where to cut, what it costs, and how to save blame.

  ### 1. The Slip: Premise (3) and the Inference to (4)

  > **(3)** *But hyperbolic discounting is just time-inconsistent preferences — your utility curve at 9am and 2am are literally different. There's no single you failing; there's just you-at-t1 vs you-at-t2.*

  This is the poison pill. It conflates **preference inconsistency** with **personal disunity**.

  Just because your preferences change over time does not mean there is no agent responsible for managing those changes. In philosophy of action, this is the difference between a **succession of selves** (Parfit) and a **single self with dynamic preferences** (Davidson/Ainslie).

  If you accept (3), you fall into the trap that because the *inputs* change, the *processor* doesn't exist. But the "failure" of will isn't a violation of a static utility function; it is a failure of **intrapsychic coordination**.

  **The Rejection:** Reject the claim that time-inconsistent preferences preclude a unified agent.
  **The Cost:** You must abandon the idea of the self as a monolithic, static utility maximizer. You have to adopt a model where the "self" is a negotiation between competing temporal interests.

  ### 2. How to Save Blame (Without Rejecting Discounting)

  If you reject (3), you can reframe (4). Akrasia *is* a real mental failure, even under hyperbolic discounting. Here is the mechanism:

  **The Bargaining Model (George Ainslie):**
  Your 9am self and 2am self are not strangers; they are the same entity at different times. They are engaged in a repeated game.
  *   **9am Self:** Wants to code. Sets a rule: "No Reddit until 5pm."
  *   **2am Self:** Wants dopamine. Considers bypassing the rule.

  If 2am Self bypasses the rule, it isn't just a "preference update." It is a **breach of contract** with 9am Self. Crucially, it sets a **precedent**. If you let yourself break the rule today, you teach your future selves that rules are negotiable. This undermines your ability to make *any* long-term plans.

  **Where Blame Enters:**
  Moral blame (or self-blame) is the emotional signal that you are damaging your own **credibility as a planner**.
  *   You aren't blaming the 2am slice for having different tastes (like salad vs. ice cream).
  *   You are blaming the agent for **undermining their own future agency**.

  This preserves blame without needing a mystical "willpower muscle." The blame is pragmatic: *You made yourself less capable of achieving future goals.*

  ### 3. Saving Premises (2) and (5)

  This fix actually strengthens (2) and (5) rather than requiring you to drop them.

  *   **Keep (2) Hyperbolic Discounting:** This explains *why* the conflict exists. The discount curve creates the incentive for the 2am self to defect.
  *   **Keep (5) Precommitment:** In the bargaining model, precommitment isn't just "constraining options"; it is **raising the cost of defection** to maintain the bargaining equilibrium.
      *   When you install a blocker, you aren't "fixing" your will (changing the discount rate).
      *   You are changing the payoff matrix so that the 2am self *cannot* defect without extreme cost.
      *   This is consistent with (5): it works by constraining options, but the *reason* it works is to preserve the integrity of the long-term plan.

  ### 4. Fixing the Phenomenology (6) and (7)

  You suspected you were smuggling a premise between (6) and (7). You were. The hidden premise was: *"If preferences are descriptive, feelings must be neutral."*

  > **(7)** *If it's all just preference curves, bypassing should feel like a calm update... Instead it feels like defeat.*

  Under the Bargaining Model, the feeling of "defeat" is rational information.
  *   **Calm Update:** "I preferred salad, now I prefer ice cream." (No rule broken).
  *   **Defeat:** "I broke a rule I set for myself." (Precedent damaged).

  The negative affect (guilt/shame) is an evolved or learned mechanism to discourage precedent-breaking. If bypassing the blocker felt neutral, you would do it every time, your long-term planning capacity would collapse, and you'd fail at life. The pain of "defeat" is the tax you pay for breaking the intrapsychic contract.

  ### Summary of the Fix

  | Premise | Status | Modification |
  | :--- | :--- | :--- |
  | **(1) Akrasia** | Keep | Acting against better judgment. |
  | **(2) Discounting** | **Keep** | The mechanism of the conflict. |
  | **(3) No Single You** | **REJECT** | Time-inconsistency $\neq$ Disunity. You are a negotiation. |
  | **(4) No Failure** | **Reject** | Failure = Breaking the internal precedent/contract. |
  | **(5) Precommitment** | **Keep** | It constrains options to enforce the contract. |
  | **(6) Bypassing** | Keep | Sophisticated agents still face high temptation. |
  | **(7) Phenomenology** | **Reinterpret** | "Defeat" is the signal of damaged self-credibility. |
  | **(8) Dilemma** | **Dissolved** | Blame is fair because you damaged your future agency. |

  ### What This Costs You

  1.  **Simplicity:** You lose the clean, microeconomic view of the self as a single utility function. You have to accept a "society of mind" or "multiple selves" model where the "self" is the *process* of negotiation, not the *parts*.
  2.  **Determinism:** It gets harder to argue that you "could have done otherwise" in a libertarian sense. You are bound by your discounting curve, but you are responsible for managing it.
  3.  **Moral Realism:** Blame becomes **pragmatic** rather than **metaphysical**. You aren't "evil" for procrastinating; you are "inefficient" and "untrustworthy (to yourself)." Some people find this less satisfying than true moral blame, but it's more actionable.

  ### The Study Group Pitch

  If I were you, I'd present it like this:

  > "The argument fails at step (3). It assumes that because preferences change, the agent dissolves. But hyperbolic discounting actually *requires* a persistent agent to make sense of 'discounting' at all.
  >
  > If I reject (3), I can view akrasia not as a preference drift, but as a **breakdown in intrapsychic bargaining**. The 2am self isn't a different person; it's a future iteration of me that is being bribed by immediate reward.
  >
  > This saves blame: I am blameworthy not because I violated a static law, but because I damaged my own **precedent**. By bypassing my blocker, I proved to my future selves that my rules are optional, making me less effective tomorrow. The feeling of 'defeat' is the cognitive signal of that damaged credibility.
  >
  > So, hyperbolic discounting explains the *temptation*, but the *failure* is the refusal to honor the internal contract required for long-term agency."

  This keeps your behavioral econ (2 & 5) but restores the normative force of will.
