      *   **Adaptive Preferences:** A concept from philosophy/economics (Jon Elster, Martha Nussbaum). It suggests people adjust their desires to match their available options. The roommate uses this to delegitimize the family's values. The user sees it as condescending. *Key insight:* It *can* be true, but using it to dismiss someone's values is paternalistic.
