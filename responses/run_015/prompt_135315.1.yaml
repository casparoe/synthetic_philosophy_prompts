prompt: |-
  I am drafting the allocation rule for a public body, and I want the specification settled before I look at how the philosophical literature answers it, so that I don't inherit that literature's blind spots about the use I have in mind.

  The setting. The body distributes a fixed stock of goods and burdens once, to a known set of claimants, and cannot take anything back afterwards. It cannot observe the claimants' mental states and cannot ask them; it has records of what they have, what they can do, and what has been done to them. It must give every unsuccessful claimant a written statement of why their claim ranked where it did. And its allocations partly determine who the next round's claimants will be, because housing, training and care allocations affect which households form and which people arrive. I am not asking whether equality is the right aim for this body; that is settled by statute. I am asking what the currency of equality would have to be like for this body to be able to use it.

  What I want is the requirements list: what any candidate currency — a candidate answer to the question of what, exactly, is to be equalized — must be able to do, with the case behind each requirement, and with each requirement marked as non-negotiable given my setting, negotiable, or a prejudice imported from some other use a theory of equality might be put to.

  The cases I am confident a currency must handle, stated in my own terms:

  Two claimants receive identical bundles, and one needs far more than the other to get to the same point — an impairment, a chronic condition, a caring responsibility. The currency must register the difference in what bundles do for people without simply collapsing into how satisfied those people report or appear to be.

  Three claimants each end up wanting something very expensive. The first cultivated the taste deliberately, with full information and no pressure. The second acquired it because the body itself supplied the means in an earlier round — learned to sail on a publicly funded boat, say. The third no longer wants much of anything, and wanted progressively less across a long period of being given very little. The currency must say which of these generate claims, and in particular must tell me how the second case differs from the third, since both involve aims that the allocation itself helped produce.

  What a claimant can do with a share depends on what others are given — a place in a programme, a priority date, a permit, a house on a particular street. So I need to know whether the currency has to be assessable on a pair of claimants in isolation, or whether it only has a verdict once the whole distribution is known; the body sometimes has to decide between two claimants before it knows the rest of the population.

  Provision moves the baseline. Once lifts, ramps and interpreters are supplied, what counts as an ordinary share of access changes for everyone, including people whose access was never at issue. The currency must say whether its standard is anchored to a pre-allocation baseline or floats with what is actually provided, since a floating standard lets a body appear to equalize by redefining the target.

  The written statement is itself part of the allocation. If the currency is a mental state, announcing a verdict perturbs what is being measured — being told one counts as badly off can make a person worse off. I want to know whether robustness to being announced is a genuine requirement or only a problem for one family of currencies.

  And because allocations determine who the future claimants are, the currency must permit comparisons across alternatives whose claimant-sets are not the same, and must say what to conclude when the people who would be worst off under one alternative simply do not exist under the other.

  Beyond the list, three things. Flag any pair of requirements you think cannot be jointly satisfied — that is the part I most want, since it would mean my statute asks for something incoherent. Tell me which single requirement does the most work in excluding otherwise attractive candidates. And say which of the requirements are really about the currency and which properly belong to the procedure, the timings, or the unit of assessment — whether the currency attaches to individuals, households, or something else, and what it is to do with a household whose members will not say how unevenly the share is divided inside it.

  Only then, and in a short paragraph each, how the three familiar families — currencies pitched at states of a person, at the means a person holds, at what a person is substantively free to do and be — do against the list. I do not need names, dates or reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Draft an allocation rule for a public body distributing fixed goods/burdens once (non-retractable) to known claimants.
      *   **Constraint:** Settle specifications *before* consulting philosophical literature to avoid inheriting blind spots.
      *   **Context:** Statute mandates equality as the aim. The body needs a "currency of equality" (what to equalize).
      *   **Specific Constraints/Features of the Body:**
          *   Cannot observe/ask mental states.
          *   Has records of holdings, capabilities, history.
          *   Must provide written reasons to unsuccessful claimants.
          *   Allocations affect future claimant sets (housing, training, care affect household formation/arrival).
          *   One-off distribution (cannot take back).
      *   **Deliverables:**
          1.  A requirements list for any candidate currency (with case justification and classification: non-negotiable, negotiable, or prejudice).
          2.  Flag any incompatible pairs of requirements (incoherence check).
          3.  Identify the single most exclusionary requirement.
          4.  Distinguish currency requirements from procedure/timing/unit requirements (especially regarding households).
          5.  Brief evaluation of three familiar families (states, means, substantive freedoms) against the list.
      *   **Style:** No names, dates, or reading references. Concise, analytical, practical.

  2.  **Deconstruct the Cases/Scenarios provided by the User:**
      *   *Case 1 (Disability/Need):* Identical bundles, different conversion factors. Currency must track impact without relying on reported satisfaction.
      *   *Case 2 (Expensive Tastes/Adaptation):* Deliberate cultivation vs. Body-induced vs. Adapted preferences (learned helplessness). Currency must distinguish validity of claims, especially Body-induced vs. Adapted.
      *   *Case 3 (Interdependence):* Value depends on others' allocation (positional goods). Currency must handle partial vs. holistic assessment.
      *   *Case 4 (Baseline Drift):* Provision changes the norm (ramps become standard). Currency must anchor standards to prevent moving goalposts.
      *   *Case 5 (Reflexivity/Announcement):* Written reasons affect the metric (if mental). Currency must be robust to measurement/announcement.
      *   *Case 6 (Future Claimants/Identity):* Allocation changes who exists/claims later. Currency must compare across different populations (non-identity problem).

  3.  **Drafting the Requirements List:**
      *   *Requirement 1 (Conversion Sensitivity):* From Case 1. Must account for different abilities to convert goods into function. *Status: Non-negotiable* (Statute says equality, identical bundles $\neq$ equal outcome if needs differ).
      *   *Requirement 2 (Responsibility/History Sensitivity):* From Case 2. Must distinguish between voluntary, induced, and adapted preferences. *Status: Non-negotiable* (Otherwise the body incentivizes manipulation or punishes adaptation unfairly).
      *   *Requirement 3 (Composability/Partial Assessability):* From Case 3. Can we judge a claim without the full matrix? *Status: Negotiable* (Depends on if the body can delay decisions, but user says "sometimes has to decide... before it knows the rest"). Let's mark as Non-negotiable given the operational constraint.
      *   *Requirement 4 (Baseline Stability):* From Case 4. Must resist redefinition of "normal" based on prior spending. *Status: Non-negotiable* (Otherwise equality becomes empty).
      *   *Requirement 5 (Epistemic Opacity/Robustness):* From Case 5 & Context. Cannot rely on unobservable mental states; must be robust to being told. *Status: Non-negotiable* (Context constraint: "Cannot observe... mental states").
      *   *Requirement 6 (Cross-Population Comparability):* From Case 6. Must compare scenarios with different people. *Status: Non-negotiable* (Context constraint: "allocations partly determine who the next round's claimants will be").

  4.  **Analyzing Incompatibilities (The "Incoherence Check"):**
      *   *Conflict:* Requirement 2 (History/Responsibility) vs. Requirement 5 (Epistemic Opacity).
      *   *Reasoning:* To distinguish deliberate taste cultivation from adapted preferences (Case 2), you usually need to know mental states (intent, satisfaction, pressure). The body *cannot* observe mental states.
      *   *Conflict:* Requirement 3 (Partial Assessability) vs. Requirement 4 (Baseline Stability/Interdependence). If value depends on the whole distribution (positional goods), you can't assess in isolation.
      *   *Conflict:* Requirement 6 (Future Claimants) vs. One-off nature. If the currency depends on future states, but the act is one-off and non-retractable, how do you verify the currency was met?

  5.  **Identifying the Most Exclusionary Requirement:**
      *   Requirement 5 (Epistemic Opacity/Robustness) is the hardest filter. Most theories of equality (welfarism, capability to some extent) rely on knowing what people can actually do or feel. Banning mental state observation kills welfarism immediately and cripples capability assessment.

  6.  **Distinguishing Currency vs. Procedure/Unit:**
      *   *Currency:* What is measured (e.g., access, resources).
      *   *Procedure:* How it's measured (written statements, timing).
      *   *Unit:* Who gets it (individual vs. household).
      *   *Issue:* The household problem. If the currency is individual but allocation is household, internal distribution is hidden. This is a Unit/Procedure issue, not strictly Currency, but affects Currency viability.

  7.  **Evaluating the Three Families:**
      *   *States (Welfare/Satisfaction):* Fails Epistemic Opacity (can't observe). Fails Robustness (announcement changes state). Fails Baseline Stability (adaptation).
      *   *Means (Resources/Primary Goods):* Passes Epistemic Opacity (observable). Fails Conversion Sensitivity (Case 1: disability ignored). Fails Responsibility Sensitivity (Case 2: expensive tastes treated same).
      *   *Substantive Freedoms (Capabilities):* Passes Conversion Sensitivity. Struggles with Epistemic Opacity (can't observe functionings without asking). Struggles with Cross-Population (comparing capabilities of non-existent people).

  8.  **Refining and Polishing:**
      *   *Tone:* Bureaucratic, precise, analytical.
      *   *Formatting:* Clear lists, bolding for status.
      *   *Check against constraints:* No names/dates. Short paragraphs for the evaluation.
      *   *Self-Correction on Requirement 3:* The user says "the body sometimes has to decide between two claimants before it knows the rest." This makes Partial Assessability Non-negotiable operationally, even if theoretically difficult.
      *   *Self-Correction on Incompatibility:* The strongest tension is between needing to know *why* a preference exists (History) and not being allowed to look inside the head (Opacity). I need to highlight this clearly.
      *   *Self-Correction on Household:* The prompt asks to distinguish what belongs to currency vs procedure/unit. I need a specific section for this.

  9.  **Final Review against Prompt:**
      *   Requirements list with case & status? Yes.
      *   Flag incompatible pairs? Yes.
      *   Single most exclusionary requirement? Yes.
      *   Currency vs Procedure/Unit distinction? Yes.
      *   Three families evaluation (short paragraph each)? Yes.
      *   No names/dates? Yes.

  10. **Drafting the Content:** (Mental walk-through of the text to ensure it sounds like a policy brief, not an academic paper.)
      *   *Requirement 1:* Conversion Factors. Case: Disability. Status: Non-negotiable.
      *   *Requirement 2:* Genetic/History Tracking. Case: Expensive tastes. Status: Non-negotiable (but problematic).
      *   *Requirement 3:* Atomizability. Case: Positional goods. Status: Non-negotiable (operational constraint).
      *   *Requirement 4:* Anchor Stability. Case: Baseline drift. Status: Non-negotiable.
      *   *Requirement 5:* Observability/Non-Reflexivity. Case: Written reasons. Status: Non-negotiable (statutory/operational).
      *   *Requirement 6:* Variable Population Comparability. Case: Future claimants. Status: Non-negotiable (structural).

      *   *Incompatibility:* History Tracking vs Observability.
      *   *Exclusionary:* Observability.
      *   *Currency vs Procedure:* Household internal distribution is a Unit/Procedure problem.
      *   *Evaluations:* Welfare (fails observability), Resources (fails conversion), Capabilities (fails observability/population).

      *Wait, one nuance:* The prompt asks to mark requirements as "prejudice imported from some other use." I should ensure I identify if any requirement is actually a philosophical prejudice rather than an operational necessity.
      *   *Reflection:* Requirement 2 (Responsibility) is often considered a "prejudice" by strict egalitarians who say only outcomes matter. But for this body, Case 2 makes it operational. However, the *ability* to distinguish might be the prejudice (assuming we *can* distinguish without mental states). I will mark the *feasibility* of Req 2 as the potential prejudice.
      *   *Reflection:* Requirement 3 (Atomizability) might be a prejudice. Many theories say equality is inherently holistic. But the body *must* decide sequentially. So it's non-negotiable for *this* body, even if a prejudice for *theory*. I will clarify this distinction.

      *Let's finalize the Incompatibility:* The tension between "Must distinguish origin of preference" and "Cannot observe mental states/history beyond records" is the killer.
      *   *Let's finalize the Unit/Currency distinction:* The household issue is about the *Unit of Assessment*, not the Currency. The Currency defines *what* is equalized; the Unit defines *who* holds it.

      *Okay, ready to write.*
answer: |-
  ### Requirements List for the Currency of Equality

  **1. Conversion Sensitivity**
  *   **Case:** Two claimants receive identical bundles; one requires more to reach the same functional point due to impairment or responsibility.
  *   **Requirement:** The currency must vary in value relative to the claimant's physical and social context, not just the nominal amount of the good.
  *   **Status:** **Non-negotiable.** (Statutory aim of equality is void if identical inputs yield unequal effective access.)

  **2. History Sensitivity**
  *   **Case:** Three claimants with expensive or adapted preferences (deliberate cultivation vs. body-induced vs. adaptation to deprivation).
  *   **Requirement:** The currency must distinguish between claims generated by voluntary choice, institutional conditioning, and forced adaptation.
  *   **Status:** **Non-negotiable.** (Without this, the body incentivizes manipulation or penalizes resilience.)

  **3. Atomizability**
  *   **Case:** Value depends on others' allocation (positional goods), but decisions must sometimes be made before the full population is known.
  *   **Requirement:** The currency must allow a verdict on a claimant's share without requiring knowledge of the total distribution matrix.
  *   **Status:** **Non-negotiable.** (Operational constraint: sequential decision-making is required.)

  **4. Anchor Stability**
  *   **Case:** Provision of lifts/ramps changes what counts as "ordinary access" for everyone.
  *   **Requirement:** The standard of measurement must be fixed to an external baseline, not floating relative to the average provision of the current round.
  *   **Status:** **Non-negotiable.** (Prevents the body from equalizing by redefining the target downward or upward.)

  **5. Epistemic Opacity and Non-Reflexivity**
  *   **Case:** The body cannot observe mental states; the written reason statement itself affects the claimant's state.
  *   **Requirement:** The currency must be measurable using only objective records (holdings, history, physical traits) and must not change value when the measurement is announced.
  *   **Status:** **Non-negotiable.** (Statutory/Operational constraint: "Cannot observe... mental states.")

  **6. Variable Population Comparability**
  *   **Case:** Allocations determine who forms households or arrives in the next round; some people exist under one allocation alternative but not another.
  *   **Requirement:** The currency must permit ranking of outcomes where the set of claimants is not identical.
  *   **Status:** **Non-negotiable.** (Structural constraint: allocations affect future demographics.)

  ***

  ### Incompatibility Check

  **The Incoherence Pair:** **History Sensitivity (2)** and **Epistemic Opacity (5)**.
  To distinguish between a deliberately cultivated taste, a body-induced preference, and an adapted preference (Case 2), you generally require access to the claimant's mental states, intentions, and subjective experience of pressure. Your setting explicitly forbids observing mental states and limits you to records of what was done to them. Records of past allocations (what the body supplied) can show *correlation*, but they cannot prove *causation* of preference formation without inferring mental states. A currency that satisfies Epistemic Opacity will likely fail History Sensitivity, treating the sailor and the adapted claimant identically based on observable history alone.

  **The Single Most Exclusionary Requirement:**
  **Epistemic Opacity and Non-Reflexivity (5).**
  This requirement eliminates any currency defined by internal states (satisfaction, welfare, pain) immediately. It also severely constrains currencies defined by "freedom" or "capability," as the genuine range of a person's freedom often depends on their psychological relationship to their options (e.g., whether they feel coerced). It forces the currency into the realm of externally verifiable physical facts, which are often poor proxies for actual equality.

  **Currency vs. Procedure/Unit Distinctions:**
  *   **Currency:** Defines *what* has equal value (e.g., hours of care, square footage, access rights).
  *   **Unit of Assessment:** Defines *who* holds the currency. The household problem you raised (members not saying how shares are divided) is a **Unit** problem, not a Currency problem. If the currency is "income," the Unit determines whether you measure household income or individual income. If you allocate to households but measure equality at the individual level, you have a Unit mismatch.
  *   **Procedure:** The written statement and the timing of the decision are procedural. However, **Anchor Stability (4)** borders on procedure; it dictates *when* the standard is set (pre-allocation vs. post-allocation), which is a timing constraint on the currency's definition.

  ***

  ### Evaluation of Familiar Families

  **Currencies Pitched at States of a Person**
  These fail immediately on **Epistemic Opacity**. Because you cannot observe mental states and cannot ask, you cannot measure welfare, satisfaction, or pain. Furthermore, they fail **Non-Reflexivity**; telling a claimant they are assessed as "unhappy" or "deprived" alters their state, invalidating the measurement. They also struggle with **Anchor Stability**, as subjective baselines shift with provision (adaptation). While they handle **Conversion Sensitivity** well internally, they are operationally unusable in your setting.

  **Currencies Pitched at the Means a Person Holds**
  These pass **Epistemic Opacity** and **Atomizability** easily; resources and goods are observable and countable without knowing the full distribution. However, they fail **Conversion Sensitivity** decisively. Giving identical resources to a disabled and non-disabled claimant violates the statutory aim of equality because the resources convert differently into functioning. They also fail **History Sensitivity**; a resource-based currency cannot distinguish between a claimant who squandered resources on expensive tastes and one who had resources stolen, as the current holding is identical.

  **Currencies Pitched at Substantive Freedoms (Doings and Beings)**
  These handle **Conversion Sensitivity** well, as they focus on what the person can actually achieve with the goods. However, they struggle with **Epistemic Opacity**; determining what a person is truly "free" to do often requires knowing if they feel coerced or adapted, which returns you to the mental state problem. They also face severe difficulty with **Variable Population Comparability**; comparing the freedoms of a person who exists under Allocation A with a person who does not exist under Allocation B is conceptically unstable. Finally, they risk failing **Atomizability**, as one person's freedom often logically depends on another's allocation (e.g., freedom to access a limited spot).
