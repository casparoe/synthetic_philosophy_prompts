  | **The Impact Boundary** | "Closeness" means the smallest jurisdiction that *fully contains* the physical externalities; "affected" includes anyone suffering material cost or benefit; "level" shifts dynamically to fit the problem. | Substantive-but-contested | **No** (The line's impact crosses her border, so the "closest" container is the Federation). | **Orthogonal** (Physical externalities exist regardless of which legal code a resident registered under). | She spreads her hands wide, encompassing the whole room, not just her seat. |
  | **The Cultural Fit** | "Closeness" means alignment of political values and social norms; "affected" means the community sharing a distinct way of life; "level" is the region that best protects that identity. | Substantive-but-contested | **Only-if** (She must prove the line violates a core regional value, not just an economic preference). | **Serves-it** (If values are the metric, portable registration proves people seek the code that fits them, validating her region's distinctness). | She gestures to the local flag behind her, ignoring the federal seal on the wall. |
  | **The Personal Sovereignty** | "Closeness" means the specific legal bond a citizen has *chosen*; "affected" means the registrant; "level" is the region whose code they selected for that policy field. | False-or-incoherent (in most real systems), **Substantive** (in yours) | **No** (If 1/3 of her residents opted into *federal* environmental law, she cannot claim to speak for them). | **Serves-it** (This reading treats the portable system as the ultimate realization of subsidiarity: law follows the person). | She looks at a specific constituent in the gallery who registered under a rival region's code. |
  | **The Functional District** | "Closeness" means the stakeholder group most directly involved; "affected" means energy producers and consumers; "level" should be a new, ad-hoc jurisdiction drawn for this infrastructure. | Substantive-but-contested | **No** (This dissolves her regional veto into a new stakeholder board). | **Defeats-it** (It bypasses both territory and personal registration in favor of economic function). | She slides a blueprint of a new "Transmission Authority" across the table. |

  If you want her to be neither a fool nor obviously right, put **The Cultural Fit** in her mouth but have her undercut it with **The Personal Sovereignty**. Have her argue that her region represents a specific "way of life" worth protecting (Cultural Fit), but then show the reader that half her own cabinet has opted into federal environmental law (Personal Sovereignty). This makes her defense of "local will" tragically ambiguous: is she protecting her people's values, or is she protecting the *land* from her own people's choices?
