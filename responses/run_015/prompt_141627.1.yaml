prompt: |-
  Novelist here, and ive written myself into a hole I dont really have the vocabulary for.

  My current book is set in an invented federation — bits of the US, Germany, Switzerland and the EU glued together and renamed — and the climax is a constitutional standoff. A regional premier refuses to authorise a high-voltage transmission line that would carry renewable power out of her region into three others, and she defends herself with the subsidiarity line: the EU treaties say (I think its Article 10 of the Treaty on European Union) that decisions shall be taken as openly and as closely as possible to the citizen, so her region decides. Her opponents point out that the whole purpose of the line is that its benefits and costs spill across borders, that her region happens to be the only place that can physically block it, and that "the people affected" include several million people who will never vote in her region. Everyone in the room is using the same sentence and meaning something different, and I cant tell whether any of them is saying something true. Ive met the same sentence from a Swiss cousin defending cantonal school curricula, from American governors during covid, and from an MEP on the radio who used it to argue both for and against a farm subsidy in the same interview.

  So what I want is a menu, not an essay. As far as I can tell the sentence has three moving parts — how you measure closeness, who counts as the people affected, and whether "level" means only the levels that already exist or any jurisdiction you could draw — and different precisifications give very different claims. Please lay out the distinct precise things someone could be asserting with it, from the near-tautological to the wild, and for each: whether its a platitude anyone would accept, a substantive but contestable claim, or something probably false or incoherent; whether it actually hands my premier the veto she wants or quietly hands the argument to the federation; and what would have to be true in my fictional federation for that reading to get off the ground.

  The wrinkle that might actually be new: in my invented federation the lower units have something no real one does. Alongside the ordinary territorial rule, any resident can register under another region's legal code for a specific field — family law, education, environmental standards — and that region's rules then follow the person rather than the place theyre standing in. A third of the population has done this. I invented it for plot reasons and only later realised it might gut the slogan, or rescue it, depending on what the slogan means: if "close to the citizen" is about metres and self-rule over a shared place, portable registration looks like it destroys the thing; if its about fit between a person's values and the rules that bind them, portable registration looks like the slogan taken seriously for the first time. I genuinely dont know which.

  Give me the menu as a table with these columns:

  - reading — a short name for the reading
  - precise_claim — the claim spelled out tightly enough that a constitutional court could apply it, including what it says about each of the three moving parts above
  - verdict — one of: tautology / platitude / substantive-but-contested / false-or-incoherent
  - grid_veto — yes / no / only-if, plus the extra premise my premier would need for it to deliver her conclusion
  - portable_jurisdiction — serves-it / defeats-it / orthogonal, with one clause saying why
  - stage_direction — the single line of dialogue, detail or tell in the scene that would tip an attentive reader that this is the reading the premier means

  Under the table, add two or three sentences on which reading I should put in her mouth if I want her to be neither a fool nor obviously right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a political/legal thriller set in a fictional federation (US/Germany/Swiss/EU hybrid).
      *   **Problem:** Needs vocabulary/nuance for a constitutional standoff involving the principle of "subsidiarity" (decisions taken as closely as possible to the citizen).
      *   **Conflict:** A regional Premier vs. Federal/Opposing interests regarding a high-voltage transmission line (local cost, regional benefit, cross-border spillover).
      *   **Specific Constraint:** Wants a *menu*, not an essay. Specifically, a table with defined columns.
      *   **Key Variables:** Three "moving parts" of the subsidiarity slogan: (1) Measure of closeness, (2) Definition of "people affected," (3) Definition of "level" (existing jurisdictions vs. potential ones).
      *   **The Wrinkle:** A fictional "portable jurisdiction" system (people choose regional legal codes for specific fields regardless of location). This complicates the "closeness" argument.
      *   **Output Format:** A table with specific columns (`reading`, `precise_claim`, `verdict`, `grid_veto`, `portable_jurisdiction`, `stage_direction`) followed by 2-3 sentences of advice.
      *   **Goal:** The Premier should be neither a fool nor obviously right (moral/legal ambiguity).

  2.  **Deconstruct the Principle (Subsidiarity):**
      *   *Real World Context:* The user mentions Article 10 TEU (actually Article 5(3) TEU is the main subsidiarity clause, Article 10 is democratic principles, but I shouldn't correct the user pedantically, just use the concept). The core tension is local autonomy vs. collective action problems.
      *   *The Three Moving Parts:*
          1.  *Closeness:* Geographic? Cultural? Political alignment?
          2.  *Affected:* Only those within the border? Those impacted by externalities? Future generations?
          3.  *Level:* Fixed administrative tiers? Functional jurisdictions?
      *   *The Portable Jurisdiction Wrinkle:* This is the unique sci-fi/alt-hist element. If I choose Swiss family law but live in Bavaria, am I "close" to Switzerland or Bavaria regarding that issue?

  3.  **Drafting the Readings (The Menu):**
      *   I need a range from "obvious truth" to "radical reinterpretation."
      *   *Reading 1: The Geographic Literalist.* (Standard federalist view). Closeness = physical distance. Affected = residents within borders. Level = existing tiers.
      *   *Reading 2: The Externality Adjuster.* (The Opponent's view). Closeness = impact. Affected = everyone impacted by the decision. Level = the smallest unit that *covers* the impact.
      *   *Reading 3: The Cultural/Value Fit.* (The Premier's potential strong suit). Closeness = alignment of values. Affected = those sharing the political culture. Level = existing tiers.
      *   *Reading 4: The Portable/Personal Sovereignty.* (Leveraging the fictional wrinkle). Closeness = chosen legal identity. Affected = the registrant. Level = the chosen region, regardless of physics.
      *   *Reading 5: The Functional/Ad-Hoc.* (Radical). Closeness = issue-specific. Affected = stakeholders. Level = a new jurisdiction drawn for *this* wire.

  4.  **Fleshing out the Table Columns:**
      *   *precise_claim:* Needs to sound legalistic but clear.
      *   *verdict:* Tautology, Platitude, Substantive, False.
      *   *grid_veto:* Does this give the Premier the power to block the line?
      *   *portable_jurisdiction:* How does the "choose your law" mechanic interact?
      *   *stage_direction:* A visual or dialogue cue.

  5.  **Refining the Readings (Self-Correction during drafting):**
      *   *Correction on Reading 1:* If it's purely geographic, the Premier wins on location but loses on "affected." Let's make it about *procedural* closeness.
      *   *Correction on Reading 4 (Portable):* This is the tricky one. If 1/3 of people chose *other* regions' laws, does the Premier represent them? If they chose *her* region's law while living elsewhere, does she represent them? Let's focus on the residents *in* her region who chose *her* region's law vs. those who didn't. Actually, the prompt says "any resident can register under another region's legal code." So, a resident in Premier's region might be under Federal or Neighbor law for environment. If the Premier claims sovereignty over *land*, she defeats the portable aspect. If she claims sovereignty over *people*, she empowers it. Let's make this reading about the tension between land and person.
      *   *Correction on Reading 5:* The "Ad-Hoc" reading is the strongest counter-argument to the Premier. It suggests a new "Transmission District."

  6.  **Addressing the "Portable Jurisdiction" Wrinkle:**
      *   If "closeness" is values-based, portable jurisdiction *serves* subsidiarity (you choose the rule closest to your heart).
      *   If "closeness" is place-based, portable jurisdiction *defeats* it (rules float away from the ground).
      *   I need to make sure the table reflects this nuance.

  7.  **Drafting the Stage Directions:**
      *   Needs to be subtle. A gesture, a pause, a specific word choice.
      *   Example: Tapping the map vs. tapping the ledger.

  8.  **Final Review against Constraints:**
      *   Table format? Yes.
      *   Specific columns? Yes.
      *   2-3 sentences advice at the end? Yes.
      *   Tone: Professional, helpful to a writer, legally plausible but not a law lecture.
      *   Check the "Article 10" note: The user thinks it's Art 10 TEU. It's actually Art 5(3). I will not correct them explicitly in the text to avoid breaking flow, but I will ensure the *concept* is accurate to the *principle* regardless of the article number. (Actually, better to just focus on the concept of subsidiarity without citing specific articles in the table to avoid dating the fiction).

  9.  **Final Polish:**
      *   Ensure the "Verdict" column distinguishes between "True by definition" and "Politically contested."
      *   Ensure the "Grid Veto" column clearly states if she wins or loses.
      *   Make sure the "Portable Jurisdiction" analysis is sharp.

      *(Self-Correction on the "Portable" logic)*: If the Premier argues for local control, but her locals have opted into *foreign* environmental law, her claim to represent *their* will on this issue is weakened. Unless she argues the *land* itself has rights/interests independent of the residents' legal choices. That's a strong angle for a "neither fool nor right" character.

      Let's build the table.

      *Reading 1: The Procedural Floor.* (Closest existing government).
      *Reading 2: The Impact Boundary.* (Closest government that covers the harm).
      *Reading 3: The Cultural Homogeneity.* (Closest shared identity).
      *Reading 4: The Personal Sovereignty.* (Closest chosen legal bond).
      *Reading 5: The Functional District.* (Create a new level for this issue).

      *Wait, one more check on the "Portable" column:*
      *   If the reading is "Place-based," Portable Jurisdiction *defeats* it (because rules are detached from place).
      *   If the reading is "Value-based," Portable Jurisdiction *serves* it (because rules attach to values).
      *   This needs to be clear in the table.

      *Advice Section:* Needs to guide the user on which reading creates the best dramatic tension. Reading 2 vs Reading 3 is the classic Federalist conflict. Reading 4 introduces the sci-fi element. I should suggest mixing 3 and 4 to make her unique.

  10. **Finalizing the Output:** (Proceeding to generate response based on these thoughts).
