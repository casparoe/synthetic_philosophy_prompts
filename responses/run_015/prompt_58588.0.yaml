      *   Use sensory details: the hum, the cold, the glow of monitors.

  7.  **Drafting - specific focus on the "Assimilation Failure":**
      *   Elena needs to argue: "If we remove the laws, we have the ultimate nothing."
      *   Julian needs to counter: "The removal is an operation. Operations require a logic. You are simulating nothingness within a framework of existence."
      *   This highlights the difference between *subtracting entities* and *subtracting the possibility of entities*.

  8.  **Review against Constraints:**
