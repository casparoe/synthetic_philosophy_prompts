  1. "The readings, weakest to strongest"

  1. Thesis: Language provides shared tags that streamline social coordination about internal states without altering the states themselves. Verdict: Platitude. Support: Conclusion 2 (reporting) only. This reading treats "shapes" as making communication social rather than cognitive. It implies users already feel the pressure but lack an efficient shorthand for consensus. It concerns only the moment of preparing to speak, not the concepts themselves. The claim is that language individuates the content of thought only for the purpose of transmission, not for the thinker. This is trivially true but offers no leverage on whether the experience exists prior to the word. This is too vague for strategy.
  2. Thesis: Possessing a specific label makes retrieving and categorizing that experience cognitively easier during the moment of speech or reflection. Verdict: Defensible. Support: Conclusion 2 (notice/name) only. Here "shapes" means makes easier or more salient during processing. Evidence shows labeling speeds classification but does not prove the unlabelled experience is different in kind. It distinguishes habitually noticing from what people can represent at all. Language acts as a cue that lowers the threshold for recall. This supports the idea that users will report more, but not that they previously felt less. It addresses salience, not possibility.
  3. Thesis: Habitual use of specific vocabulary trains non-linguistic attention to prioritize certain features of experience over others permanently. Verdict: Contested. Support: Both conclusions weakly. This concerns standing habits of attention versus momentary speaking. Findings are mixed on whether linguistic habits bleed into non-linguistic perception enough to alter the phenomenology of stress. Language is offered as a cause of cognitive differences here. If true, introducing the term could gradually shift how users scan their bodies for symptoms, but evidence for lasting non-linguistic change is thin. It suggests language shapes what is noticed over time.
  4. Thesis: Without a specific lexical item, the underlying concept cannot be represented or experienced in a recognizable form at all. Verdict: False. Support: Conclusion 1 only. This claims language makes cognitive representation possible. Evidence refutes this by showing speakers distinguish fine-grained emotions even without single-word labels, using phrases or idioms instead. It treats concepts as individuated by language. This is the strong determinist view. It is falsified by the existence of the idioms about heaviness, which prove the concept exists without the loanword. It claims language makes thought possible.
  Most speakers intend Reading 2 but borrow the rhetorical weight of Reading 4 to sound profound. This conflation allows the slogan to do enormous work by sliding between defensible and false claims unnoticed.

  2. "What my colleague's two conclusions would each require"

  Your colleague's first conclusion (speakers do not undergo burnout similarly) requires Reading 4: that the concept is impossible without the word. This is unsupported; speakers clearly experience exhaustion and pressure, evidenced by their existing idioms about heaviness. The presence of idioms proves the experience exists even if the lexical gap remains. His second conclusion (shipping a term enables noticing) requires Reading 2: that labeling reduces cognitive load for categorization. This is defensible; having a handle makes reporting easier. However, he conflates the defensible claim (reporting is easier) with the false claim (experience is different). He assumes that because reporting changes, the underlying state must have been absent or fundamentally altered previously. This slide allows him to claim both cultural sensitivity (we aren't imposing) and transformative power (we are enabling new awareness) simultaneously, which is logically inconsistent. He wants the ethical cover of Reading 1 while promising the impact of Reading 4. Ultimately, the strategy fails if it assumes the problem is linguistic rather than experiential.

  3. "What would settle it"

  To discriminate between these readings without literature, run three probes. First, conduct user interviews asking participants to describe periods of extreme work exhaustion without offering the word "burnout." If they describe symptoms matching burnout using idioms of heaviness, Reading 4 is refuted (experience exists without the word). Second, A/B test the app's intake form: one version uses the borrowed clinical term, the other uses the somatic idioms. If reporting rates differ, Reading 2 is supported (labeling affects salience/reporting). Third, ask users if the new term feels like a discovery or just a label for something known. If they say "I knew this, now I have a name," Reading 3 is weakened. These probes separate the existence of the feeling from the ease of reporting it.

  4. "The one-sentence version"

  "Providing a label doesn't create the feeling of burnout, but it does lower the barrier to recognizing and reporting it, so we should choose the term that best bridges our clinical definition with existing local idioms about pressure. This allows us to ship confidently without overstating our impact or erasing local nuance, ensuring ethical deployment."
