answer: |-
  ### Q&A Prep Sheet: The Ratchet Criterion

  **1. The "Priors Are Doing All The Work" Objection**
  *   **Who:** A physicist with a strong Bayesian bent.
  *   **Question:** "You're describing a structural feature, but isn't this just a description of someone with an extreme prior? If I believe Atlantis is real with probability 0.999, obviously almost no evidence will move me. But that's a statement about my starting point, not the logic of my updating. By calling it a 'ratchet,' aren't you just moralizing about people who disagree with your priors?"
  *   **Reply:** "The ratchet isn't about the *size* of the prior, it's about the *sign* of the update. A high prior means you need strong evidence to change your mind, but you should still move *down* slightly when confronted with disconfirming evidence. The ratchet is when the posterior *increases* or stays exactly flat in the face of what should be negative evidence. A gap in the record isn't just 'explained away' (which preserves the prior); it becomes *positive proof* of a cover-up (which raises the posterior). That violates the likelihood ratio, regardless of where you started. I'm not objecting to confidence; I'm objecting to updating in the wrong direction."
  *   **Weakness:** This relies on the audience accepting that "cover-up" explanations are inherently likelihood-inverting for the theory rather than the auxiliary hypothesis. A clever Bayesian can argue the cover-up *is* the theory, making the update valid.

  **2. The "Mainstream History Does This Too" Objection**
  *   **Who:** One of the professional historians.
  *   **Question:** "You say pseudohistorians protect their core at all costs. But if I find a pot shard in a layer where it shouldn't be, I don't throw out the entire chronology. I assume the stratigraphy is disturbed, or the dating is off, or it's an intrusion. I am protecting the core of historical method against an anomaly. By your definition, isn't all paradigm maintenance a ratchet?"
  *   **Reply:** "There's a difference between *locating the error* and *conscripting the error*. When you find an intrusive shard, you treat it as noise. You don't say, 'This shard proves the chronology is even more robust because only a true chronology would have intrusions.' The ratchet turns the anomaly into a pillar. In pseudohistory, the failure of the prediction is the evidence that the conspiracy is real. In your work, the anomaly is a problem to be solved, not a confirmation of the method. You allow the possibility that the core *could* be wrong; the ratchet removes that possibility by definition."
  *   **Weakness:** In practice, the line between "solving a problem" and "conscripting the anomaly" is often blurry in the moment. This risks sounding like "we do it right, they do it wrong."

  **3. The "Wegener Would Fail Your Test" Objection**
  *   **Who:** A skeptic or someone who has read about the history of science.
  *   **Question:** "Continental drift looked like crankery for fifty years. Wegener had no mechanism, the physics didn't work, and the establishment rejected him. If he'd argued 'the lack of mechanism is proof of how blinded the geologists are,' he'd sound like Fomenko. If your criterion would have rejected Wegener, it's not tracking truth, it's tracking consensus."
  *   **Reply:** "Wegener didn't claim the lack of a mechanism was *evidence* for drift. He admitted it was a weakness. The ratchet requires that negative evidence be flipped into positive support. Wegener said, 'I don't know how this works, but the fit is too good to ignore.' A ratcheted Wegener would have said, 'The fact that physics says this is impossible proves the physics is part of the conspiracy.' The criterion isn't about being rejected by peers; it's about how you process the rejection. Wegener updated on the fit of the continents; he didn't update *up* on the truth of his theory because the physics failed."
  *   **Weakness:** This requires a nuanced reading of Wegener's actual rhetoric. If Wegener *did* occasionally use conspiracy-adjacent language about the establishment, the distinction gets muddy.

  **4. The "It's Just Lakatos" Objection**
  *   **Who:** A LessWrong regular who knows the philosophy of science canon.
  *   **Question:** "Lakatos already solved this. Degenerating research programmes protect the hard core with ad hoc hypotheses. Progressive ones make novel predictions. You've just reinvented 'degenerating shift' with a catchier name. Why should we use your vocabulary instead of his?"
  *   **Reply:** "Lakatos requires a longitudinal view—you need to see the whole programme over decades to judge if it's degenerating. The ratchet is visible in a single episode of reasoning. You can spot it in one blog post or one chapter. Also, Lakatos focuses on *novel predictions*; I'm focusing on the *sign of the update*. A theory can make novel predictions and still be ratcheted if every failure is laundered into success. I want a tool for the individual reasoner in the moment, not a historian of science looking back."
  *   **Weakness:** Lakatosians will argue you can't judge "degeneration" without the longitudinal view, so claiming a single-episode view is possible might be overclaiming.

  **5. The "What Decision Does This Change?" Objection**
  *   **Who:** The EA-adjacent contingent.
  *   **Question:** "Okay, suppose I accept this. I now know Fomenko is 'ratcheted' rather than 'false.' How does that change what I do? I'm not going to donate to New Chronology research. If the output is the same—ignore the theory—why does the label matter?"
  *   **Reply:** "Because 'false' implies you need to check the facts, while 'ratcheted' tells you not to bother engaging on facts. If a theory is false, you can argue evidence. If it's ratcheted, evidence is fuel. This saves you time and cognitive energy. It tells you the disagreement isn't about the world, it's about the epistemology. It shifts your strategy from 'refute the claim' to 'refuse the frame.' That's a high-leverage intervention for your attention budget."
  *   **Weakness:** This is pragmatic, not epistemic. It admits the criterion doesn't help you find truth, only manage discourse.

  **6. The "Credentialism Laundering" Objection**
  *   **Who:** A software engineer suspicious of gatekeeping.
  *   **Question:** "Isn't this just a fancy way of saying 'people without PhDs argue badly'? You're taking a sociological marker—low status, outsider identity—and dressing it up as an epistemic flaw. If a tenured professor argued this way, would you call it a ratchet, or just 'heterodox theory'?"
  *   **Reply:** "If a tenured professor argued this way, I would call it a ratchet too. And in fact, I think there are ratcheted programmes inside academia—string theory risks it when it claims untestability is a virtue, or certain macroeconomic schools that treat counter-examples as data errors. The criterion applies to the argument structure, not the CV. But you're right that low-status groups are more likely to develop these defenses because they *are* under siege. That doesn't make the defense rational."
  *   **Weakness:** Hard to prove you aren't biased against outsiders. You need a clear example of a high-status ratchet to make this stick.

  **7. The "Dark Matter" Objection**
  *   **Who:** A physicist.
  *   **Question:** "Dark matter hasn't been detected. Every null result leads to new parameters, new particles, new halos. The core theory never takes a hit. By your definition, is standard cosmology a ratchet?"
  *   **Reply:** "Dark matter makes risky predictions about the CMB and lensing that *could* have falsified it. The null results on direct detection are shifting the *auxiliary* hypotheses (the particle type), not the core (the gravitational anomaly). The ratchet is when the *core* is immune. If we found a galaxy that didn't obey the gravitational math, and cosmologists said 'that proves dark matter is hiding,' that would be a ratchet. So far, they are still risking the core on new data. But it's a close call, and you're right to watch it."
  *   **Weakness:** This is the danger zone. If the audience thinks Dark Matter *is* a ratchet, your criterion implies mainstream physics is pseudoscience.

  **8. The "Field Application" Objection**
  *   **Who:** The Archaeologist.
  *   **Question:** "I work with ambiguous material. Sometimes a dating contradiction *does* mean the sample was contaminated. How do I distinguish between legitimate caution about contamination and the 'ratchet' move of claiming suppression?"
  *   **Reply:** "It's about the default. Legitimate caution says, 'This data point is suspect, let's set it aside.' The ratchet says, 'This data point is suspect, and its suspiciousness proves the timeline is wrong.' If the anomaly disappears into the noise, that's science. If the anomaly becomes a story about why the noise exists, that's the ratchet. You treat the contradiction as a loss of information; they treat it as gained information."
  *   **Weakness:** In the field, "loss of information" and "gained information about site disturbance" can look identical in the lab notes.

  ***

  ### The Question You Hope Nobody Asks

  **"If Fomenko applied your ratchet criterion to mainstream history, he would conclude that *your* consensus is the ratchet. Every time he produces a document, you call it a forgery (negative evidence becomes proof of conspiracy). Every time his chronology fails, you say 'that proves the standard timeline.' How do you break the symmetry without just appealing to your own authority?"**

  *Why this hurts:* It exposes that the ratchet criterion might be symmetrical. Both sides think the other is immunizing their core. If you can't answer this without saying "because we're right," you've collapsed back into credentialism.

  ***

  ### A Note to You

  The objection that ought to change your mind is **The Symmetry Problem** (the question above). Your reasoning is most likely failing by assuming that "mainstream" updates are generally directionally correct while "crank" updates are directionally wrong. But in the middle of a paradigm dispute, both sides often perceive the other as ratcheting. If you cannot define the ratchet without implicitly relying on the truth of the current consensus to determine which updates are "wrong," then the ratchet is not a demarcation criterion; it is just a label for "losing side." You need to show a case where a ratcheted theory was *initially* indistinguishable from a progressive one, yet the ratchet criterion identified it as pathological *before* the truth was known. If you can't do that, you haven't solved demarcation; you've just described hindsight bias.
