answer: |-
  Here is the specification for a theory of historical causation that satisfies your constraints, followed by an analysis of the trade-offs and contradictions.

  ### The Specification: Five Functional Requirements

  To bridge the micro-macro gap without reductionism, the theory must satisfy these five operational constraints:

  **1. Mechanism of Emergence (Solves Aggregation Paradox)**
  The theory must define the *transformation rules* between scales. It cannot assume macro-outcomes are the sum of micro-intentions. It requires a model of **non-linear aggregation**: a formal account of how local interactions produce systemic properties that feedback to constrain local actors.
  *   *Requirement:* Causation must be bidirectional. Micro-actions constitute macro-structures; macro-structures condition micro-possibilities.

  **2. Ontological Autonomy (Solves Reductionism)**
  The theory must grant causal efficacy to both levels without collapsing one into the other.
  *   *Requirement:* A macro-event (e.g., empire collapse) cannot be explained *solely* by fiscal deficits (macro) nor *solely* by a village riot (micro). The theory must identify the **coupling point** where the local breach becomes a systemic failure. The micro-level must have its own logic that is not merely a reflection of the macro.

  **3. Epistemic Triangulation (Solves Archive Bias)**
  The theory must treat the silence of the archive as data, not just missing data. Since state archives record governance, not life, the theory requires a method to infer micro-agency from macro-recordings of control.
  *   *Requirement:* Causation cannot rely on positive evidence alone. It must utilize **symptomatic reading**: explaining why the state felt compelled to record (or suppress) a specific micro-event reveals the causal weight of that event more than the content of the record itself.

  **4. Selection Criteria (Solves the Scaling Problem)**
  The theory must explain why Event A scales and Event B vanishes, without relying on hindsight bias ("it mattered because it led to X").
  *   *Requirement:* It needs a metric of **structural vulnerability**. A micro-event scales only when it intersects with a pre-existing macro-fracture. The theory must be able to identify "latent instability" prior to the triggering event.

  **5. Transmission Mechanics (Solves Temporal Lag)**
  The theory must specify the *carrier* of causation across generations. "Memory" or "culture" are too vague.
  *   *Requirement:* Causation must be tracked through concrete **institutional or somatic vectors**. Examples: legal precedents, property arrangements, intergenerational trauma (epigenetics/psychology), or material infrastructure. The link cannot be mystical; it must be traceable through a medium.

  ---

  ### Non-Negotiables vs. Camp Preferences

  **Non-Negotiables (The theory fails without these):**
  1.  **Selection Criteria:** Without this, the theory is just storytelling. If you cannot explain why *this* riot mattered and *that* one didn't, you haven't explained causation; you've just traced a lineage.
  2.  **Ontological Autonomy:** If you collapse micro into macro, you're a structural determinist. If you collapse macro into micro, you're a naive empiricist. To meet your prompt, you must refuse both.
  3.  **Transmission Mechanics:** Without a defined vector for temporal lag, intergenerational causation is metaphysics, not history.

  **Camp Preferences (Methodological choices, not theoretical necessities):**
  1.  **Quantitative vs. Qualitative Evidence:** You can satisfy the spec with network analysis or close reading, provided the logic holds.
  2.  **Definition of Agency:** Whether agency is rational, habitual, or affective matters less than whether it is granted *efficacy* in the model.
  3.  **Normative Stance:** The theory doesn't need to judge whether the empire *should* have collapsed, only how the micro-macro link facilitated it.

  ---

  ### The Jointly Unsatisfiable Pair (The "Impossible Trinity")

  You asked if there is a contradiction. There is a triad where you can only pick two:

  1.  **Full Micro-Agency:** Local actors have genuine freedom to alter outcomes.
  2.  **Macro-Structural Stability:** Large systems follow predictable, law-like trajectories.
  3.  **Complete Causal Continuity:** Every macro-outcome is traceable to specific micro-origins without gaps.

  **The Contradiction:**
  If you demand **Full Micro-Agency** and **Macro-Structural Stability**, you break **Causal Continuity**. If individuals are truly free, macro-outcomes become probabilistic, not traceable chains. If macro-outcomes are structurally determined, micro-agency is an illusion (epiphenomenal).

  **The Specific Conflict you hinted at:**
  *Demanding Full Intentional Transparency at the Micro Level + Full Structural Determinism at the Macro.*
  **Verdict:** **Jointly Unsatisfiable.**
  If the macro-structure determines the outcome, the micro-intentions are irrelevant to the final cause (they are just the noise through which the structure works). If micro-intentions are the transparent drivers, the macro-structure is merely an aggregate, not a determining force. You must sacrifice either the *transparency* of intention (acknowledging actors don't know what they are doing) or the *determinism* of the structure (acknowledging the system is fragile/contingent).

  ---

  ### The 90% Filter

  **Which requirement knocks out most existing approaches?**

  **Requirement #4: Selection Criteria.**

  **Why:**
  90% of historical causation is **post-hoc narration**. Historians typically start with the macro-outcome (the Empire fell) and work backward to find a micro-cause (the village rioted). This guarantees a link but fails the selection test. It cannot explain the thousands of village riots that *didn't* cause empire collapses.

  Most theories fail here because they lack a model of **systemic vulnerability**.
  *   **Marxist/Structuralist approaches** fail because they assume the macro-fracture *guarantees* the event (ignoring micro-contingency).
  *   **Microhistorical approaches** fail because they assume the event *creates* the fracture (ignoring structural latency).
  *   **Great Man theories** fail because they attribute scaling to individual charisma rather than structural resonance.

  To pass Requirement #4, the theory must be able to identify **potential energy** in the system before the release. It requires a counterfactual capability: "If this riot had happened 10 years earlier, it would have vanished." Most historical methods cannot operationalize this; they can only describe what *did* happen, not why *only* what happened could happen.

  ### Summary of the Spec's Viability

  To build this, you need a **Complex Adaptive Systems** approach applied to historiography.
  *   **Micro:** Agents with local rules.
  *   **Macro:** Emergent properties with downward causation.
  *   **Link:** Phase transitions (tipping points).
  *   **Evidence:** Archive silence treated as system noise.

  If you enforce **Selection Criteria** and **Ontological Autonomy** simultaneously, you eliminate almost all traditional narrative history and most sociological determinism. You are left with a very narrow, rigorous, and difficult field of analysis that treats history less like a story and more like a forensic reconstruction of a structural failure.
