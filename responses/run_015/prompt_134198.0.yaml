          2.  Application of the distinction to the three cases (Jefferson, Churchill, Columbus).
          3.  Identification and evaluation of a hidden premise about moral learning (specifically the analogy to scientific discovery).
          4.  Specific question: Is there a way to defend Jefferson/Churchill without collapsing synchronic availability back into diachronic isolation?

  2.  **Analyze the Essay:**
      *   **Thesis:** The "man of his time" defense conflates two claims: (1) The concept was absent (Diachronic Isolation), and (2) The concept was present but ignored (Synchronic Availability).
      *   **Argument:** The defense only works for (1). If (2) applies, it's negligence/cowardice, not excuse.
      *   **Cases:**
          *   Jefferson: Slavery vs. Equality (Synchronic).
          *   Churchill: Empire vs. Anti-colonialism (Synchronic).
          *   Columbus: Extraction vs. Universal Rights (Mixed/Harder case).
      *   **Self-Critique (by author):** Worries about sliding from availability to isolation. Worries about treating moral knowledge like scientific discovery (theory) vs. practical reasoning (deriving conclusions).

  3.  **Evaluate Conceptual Coherence:**
      *   *Strengths:* The distinction is intuitive and analytically useful. It clarifies *why* we excuse some and blame others. It moves the debate from "was it wrong?" to "could they have known?"
      *   *Weaknesses/Nuance:* "Diachronic Moral Isolation" is a very high bar. Is any moral concept *genuinely* absent? Even in ancient slavery, there were murmurs of dissent (Stoics, early Christians). If the bar is "zero dissent," isolation rarely applies. If the bar is "mainstream consensus," then availability is almost always true. The definition needs tightening.
      *   *Terminology:* "Diachronic" usually means across time. "Synchronic" means at the same time. The usage here is slightly non-standard but understandable. "Diachronic isolation" implies isolation *from* future concepts across time, but the definition given is about the *past* environment. A better term might be "Historical Unavailability" vs. "Contemporary Dissent." However, sticking to the author's terms for critique is usually best, perhaps suggesting refinement.

  4.  **Evaluate the Cases:**
      *   *Jefferson:* Strong case for Synchronic Availability. Quakers, British court cases (Somerset), revolutionary rhetoric. He actively suppressed this knowledge.
      *   *Churchill:* Strong case for Synchronic Availability. Indian independence movement, Labour Party critics, liberal imperialists. He actively fought against the tide.
      *   *Columbus:* The "Hard Case." The essay admits this. 1492 is tricky. Papal bulls, Las Casas (later), but also existing just war theory. The essay handles this well by noting the "universal human rights" framework was nascent.
      *   *Critique:* The classification seems accurate, but the *implication* needs work. Does Synchronic Availability *automatically* negate the excuse? What if the dissenting voice was marginal? (e.g., one crazy heretic vs. the whole Church). The essay implies "presence" = "availability," but social epistemology matters. Was it *accessible*?

  5.  **Evaluate the Hidden Premise (Moral Learning vs. Scientific Discovery):**
      *   *The Worry:* The author asks if they treat moral knowledge like scientific theory (you can't know relativity in 1800) vs. practical reasoning (you can deduce kindness from general principles).
      *   *Analysis:* This is the strongest philosophical critique. If morality is rationalist (Kantian), then "Diachronic Isolation" is impossible because reason is timeless. If morality is sociological/constructivist, then Isolation is possible.
      *   *The Trap:* The essay leans towards constructivism (concepts must be "available"). But if morality is about *harm*, did they know it caused harm? Jefferson knew slavery hurt people. He just rationalized it. So the "concept" wasn't missing, the *will* was weak. This supports the "negligence" point but undermines the "Isolation" excuse entirely.
      *   *Verdict:* The author's worry is valid. The argument assumes moral concepts are external tools we find, rather than internal capacities we use.

  6.  **Address the Specific Challenge (Defending Jefferson/Churchill):**
      *   *Goal:* Save the "man of his time" defense for them without denying dissent existed.
      *   *Strategy 1: Social Epistemology/Overwhelming Consensus.* Even if dissent exists, if 99% of respected peers disagree, is it reasonable to expect the individual to side with the 1%? This blurs the line. Availability $\neq$ Plausibility.
      *   *Strategy 2: Moral Dilemmas/Trade-offs.* Maybe they believed preventing a greater evil required the lesser evil (e.g., Union preservation, defense against Fascism). This shifts from "didn't know" to "calculated risk."
      *   *Strategy 3: Conceptual Evolution.* Maybe the *application* of the concept was unclear. Jefferson believed in equality but had a specific (flawed) metaphysical view of race that made slaves "exceptions." This is a conceptual error, not just moral cowardice.

