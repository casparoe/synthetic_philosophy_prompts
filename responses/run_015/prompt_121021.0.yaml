prompt: |-
  hey so I'm a junior and I got stuck with leading next thursday's session in my "decisions and games" elective — it's half econ half philosophy, most people took it becuase it sounded like an easy A, nobody in there has more stats than mean and median, and like six of them are on the debate team so they will argue with literally anything I say. I've got 30 minutes (maybe 25 once the teacher does her intro) and the topic is the Ellsberg thing / ambiguity aversion. I've read enough about it that I don't need it explained to me — what I need is a plan for how to explain it to *them*.

  Stuff I actually want from you:

  1. The order I should put the pieces in and why — what depends on what. Like, do I have to do the "known probabilities vs. unknown probabilities" distinction before the urns, or should I just put the two choices on the board, let them commit out loud, and then name the distinction from what they just did? And where does the expected-utility / sure-thing bit go — before they've said what they'd pick, or after they've already picked the clear urn for red AND the clear urn for blue and I get to point at the board? (That rule being: if you'd take the same bet whether event E happens or not, you should take it when you don't know whether E happens — I'm not sure whether to say it that way or more formally.)

  2. The one example that should carry the whole session. I'm thinking two urns: one I fill in front of them with 50 red and 50 blue, one with 100 red/blue balls in some mix I won't tell them. Is that the right carrier or is it missing something it needs? I also want the same setup to keep working when I get to "ok but is this actually irrational or is it fine," so I made up some variants and I genuinely don't know which to use or if one of them is a trap:
     (a) same two urns, but you draw 100 times with replacement and get paid per red ball instead of drawing once — do people stop caring which urn, and if so what does that even show?
     (b) the mystery urn was filled by somone who knows you're going to pick it and wants you to lose.
     (c) the mystery urn is still unknown to you, but you're told it was made by pulling 100 balls one at a time out of a giant bin that is exactly half red and half blue — so the process behind it is known even though the result isn't.
     Tell me what each of these actually does (including if any of them is doing something different from what I think it's doing), which one to lead with, and which to leave out.

  3. The wrong ideas they'll form, in the order they'll actually show up, and the exact point in the sequence where I should kill each one. My guesses: "that's just risk aversion, you're scared of losing"; "but the odds have to be *something*, so average it out and the urns are the same"; "the second urn is identical to the first, you're being dumb"; "not a paradox, you just don't know the probability, that's all"; and I'm pretty sure the debate kids will say something like "it's not about the urn, it's about who's offering you the bet." Tell me which of those are the same mistake in different clothes, which one is actually a real objection I shouldn't steamroll, and one or two I haven't thought of.

  4. One question to end on that tells me whether they got it rather than just agreeing with me — ideally one where the wrong answer still sounds sort of reasonable, so I can actually tell the difference.

  5. What I should flat-out refuse to explain in 30 minutes and say out loud that I'm not explaining. I'd rather name the thing, say "that's a whole other unit," and move on than get dragged into it by the debate team. (Also: should I even say the phrase "Knightian uncertainty" or is that just jargon that'll make them check out?)

  One last thing — I have to hand in a short "how confident are you" paragraph with the plan, so in your answer flag anywhere you're telling me to say something that's itself contested among people who actually work on this, or where I'd be simplifying to the point of saying something false, and tell me which single piece of your plan you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** Junior in college (likely undergrad).
      *   **Task:** Lead a 25-30 minute session in a "Decisions and Games" elective (half Econ, half Philosophy).
      *   **Audience:** Students looking for an easy A, low stats background (mean/median max), 6 debate team members (argumentative, likely to challenge premises).
      *   **Topic:** Ellsberg Paradox / Ambiguity Aversion.
      *   **User's Knowledge:** Understands the concept well enough, needs pedagogical strategy.
      *   **Constraints:** Needs specific ordering, example selection, misconception management, assessment question, scope boundaries, and confidence flagging.

  2.  **Deconstruct the Request:**

      *   **Point 1: Ordering.** Should I explain theory first or let them choose first? (Active learning vs. lecture). Where does the Sure Thing Principle fit?
      *   **Point 2: The Example.** Two urns (50/50 vs. Unknown). Variants (a) repetition, (b) adversarial, (c) known process. Which to use/keep/drop?
      *   **Point 3: Misconceptions.** Risk aversion vs. ambiguity aversion. "Odds must be something." "It's about the bettor." Which are real objections?
      *   **Point 4: Assessment Question.** Needs to distinguish understanding from agreement.
      *   **Point 5: Scope.** What to cut? "Knightian uncertainty" terminology?
      *   **Point 6: Confidence Flag.** Identify contested/simplified areas.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Ordering (The Flow):**
          *   *Idea:* Don't lecture first. They will tune out. Get them to commit.
          *   *Sequence:*
              1.  Setup (The Urns).
              2.  Choice 1 (Bet on Red).
              3.  Choice 2 (Bet on Blue).
              4.  Reveal the contradiction (Most pick Urn 1 for both).
              5.  Explain *why* it contradicts Expected Utility (Sure Thing Principle).
              6.  Discuss *why* they did it (Ambiguity Aversion).
          *   *Reasoning:* Experience first, theory second. The "Sure Thing Principle" is the hammer that closes the trap, so it must come *after* they spring the trap.

      *   **2. The Example (The Urns):**
          *   *Base:* 50/50 Known vs. 100 Unknown. This is the classic Ellsberg. Keep it.
          *   *Variant (a) Repetition:* Drawing 100 times. This actually *reduces* ambiguity via Law of Large Numbers. It might confuse the issue of single-shot ambiguity. *Verdict: Cut.* It introduces variance vs. uncertainty confusion.
          *   *Variant (b) Adversarial:* "Someone wants you to lose." This changes the game from decision theory to game theory (minimax). It validates ambiguity aversion but changes the *reason*. *Verdict: Keep as a "Debate Team Bait" but clarify it's different.*
          *   *Variant (c) Known Process:* Pulling from a giant 50/50 bin. This makes the unknown urn statistically 50/50. This kills the ambiguity. *Verdict: Use this to show the boundary of the paradox.*
          *   *Selection:* Stick to the classic two urns for the main demonstration. Use (c) to show when ambiguity disappears. Use (b) only if debate kids push the "malice" angle.

      *   **3. Misconceptions:**
          *   *Risk Aversion:* "I just hate losing." *Kill this early.* Risk is known probability. Ambiguity is unknown.
          *   *Subjective Probability:* "The odds are 50/50 in my head." *Kill this with the Sure Thing Principle.* If you assign 50/50, you should be indifferent. You aren't.
          *   *Debate Team Special:* "It's about the bookie." (Adversarial). *Acknowledge validity,* but distinguish Decision Theory (vs. Nature) from Game Theory (vs. Agent).
          *   *Real Objection:* The "Adversarial" one is the strongest real-world objection. In the real world, unknown probabilities usually imply an informed counterparty.

      *   **4. Assessment Question:**
          *   Need a scenario where Ambiguity Aversion leads to a dynamic inconsistency or a money pump, OR a scenario where they have to apply the definition to a new context.
          *   *Idea:* The "Three Color" Ellsberg variant is too mathy.
          *   *Idea:* A medical or investment scenario.
          *   *Better Idea:* Ask them to price the bets. If they are ambiguity averse, they should pay *less* for the unknown urn bet. Or, ask about Variant (c) specifically.
          *   *Best Idea:* The "Two-Stage" check. If you prefer Known Red over Unknown Red, do you prefer Known (Red or Blue) over Unknown (Red or Blue)?
          *   *Refinement:* Let's go with a modified betting scenario. "I offer to sell you a ticket on the Unknown Urn. What is the max you pay? Now I tell you the composition is actually 50/50. Do you pay more?" (Tests if they distinguish risk vs. ambiguity).
          *   *Actually, the prompt asks for ONE question.* Let's use the "Variant (c)" logic. "If I tell you the unknown urn was filled by a coin flip for each ball, do you still prefer the known urn? Why/Why not?"

      *   **5. Scope & Jargon:**
          *   *Cut:* Savage's axioms formal proof. Bayesian updating mechanics.
          *   *Cut:* "Knightian Uncertainty." It's jargon. Say "Risk vs. Uncertainty" instead.
          *   *Cut:* Solutions (Smooth Ambiguity, MaxMin). Just mention "people are working on it."

      *   **6. Confidence Flagging:**
          *   Need to identify where I'm simplifying.
          *   *Big one:* Calling it "irrational." Many modern theorists argue ambiguity aversion *is* rational in ecological contexts (adversarial nature). I need to flag that calling it a "paradox" or "violation" assumes Savage's axioms are normative truth, which is contested.
          *   *Second one:* The "Adversarial" objection. In real life, ambiguity often signals adverse selection. Dismissing it too quickly is economically naive.

  4.  **Refining the Tone:**
      *   Keep it peer-to-peer but authoritative.
      *   Acknowledge the "Debate Team" dynamic explicitly. Give the user ammo to handle them without getting bogged down.
      *   Ensure the timing works (25 mins is tight).

  5.  **Review against Constraints:**
      *   Did I answer the ordering question? Yes (Choice -> Contradiction -> Theory).
      *   Did I evaluate the variants? Yes (a=cut, b=nuance, c=boundary).
      *   Did I list misconceptions? Yes.
      *   Did I provide the exit question? Yes.
      *   Did I list what to cut? Yes.
      *   Did I flag confidence/contestation? Yes.

  6.  **Final Polish:**
      *   Make sure the "Sure Thing Principle" explanation is simple enough for non-stats majors.
      *   Ensure the "Debate Team" advice is practical (validate then pivot).
      *   Check the "Confidence" paragraph requirement at the end.

  *(Self-Correction during drafting)*: Wait, regarding the assessment question. If I ask "Do you pay more if I tell you it's 50/50?", a smart student might say "No, I already assumed it was 50/50." That doesn't prove they get it.
  *Better Assessment:* Use the *inconsistency* check.
  Choice 1: Bet on Red (Known) vs. Red (Unknown). (Most pick Known).
  Choice 2: Bet on (Red or Blue) (Known) vs. (Red or Blue) (Unknown).
  In Known Urn: Red = 50%, Red or Blue = 100%.
  In Unknown Urn: Red = ?, Red or Blue = 100%.
  Wait, Ellsberg usually uses 3 colors (30 Red, 60 Blue/Green unknown split).
  The user specified 2 urns (50/50 vs 100 Unknown).
  With 2 urns (50/50 vs Unknown 0-100), if you bet on Red in Unknown, and Blue in Unknown...
  If I prefer Known Red > Unknown Red, I imply P(Red_Known) > P(Red_Unknown).
  If I prefer Known Blue > Unknown Blue, I imply P(Blue_Known) > P(Blue_Unknown).
  But P(Red_Known) + P(Blue_Known) = 1.
  So P(Red_Unknown) + P(Blue_Unknown) < 1. Impossible.
  *Okay, the assessment question should force them to articulate this sum.*
  Question: "If you prefer the Known Urn for Red, and also prefer the Known Urn for Blue, what does that imply about the total probability you're assigning to the Unknown Urn?"
  Answer: "Less than 100%." (Which is impossible).
  This is the "Smoking Gun."

  *Re-evaluating the "Debate Team" aspect:* They will love the "Adversarial" argument. I should advise the user to *let them win that point* but categorize it as Game Theory, not Decision Theory. That shuts down the argument without fighting it.

  *Re-evaluating "Knightian Uncertainty":* Don't use the phrase. It adds zero value for a 25-min intro and sounds pretentious. Use "Risk vs. Uncertainty."

  *Final check on Confidence Flag:* I need to be honest that calling ambiguity aversion "irrational" is the contested part.

