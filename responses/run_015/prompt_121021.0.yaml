answer: |-
  Here is a battle plan for your 25 minutes. It is designed to minimize lecture time, maximize their commitment to choices they can't take back, and give you specific scripts to handle the debate team without getting dragged into a war.

  ### 1. The Order of Operations
  **Do not explain the theory first.** If you define "ambiguity aversion" before they make a choice, the debate team will treat it as a proposition to be defeated rather than a behavior to be examined.

  **The Sequence:**
  1.  **The Setup (3 mins):** Put the two urns on the board.
      *   **Urn A:** 50 Red, 50 Blue. (Write this down).
      *   **Urn B:** 100 Red/Blue balls. Ratio unknown. (Write this down).
  2.  **The Commitment (5 mins):** Force two distinct choices.
      *   *Choice 1:* "I will pay you $100 if you draw **Red**. Which urn do you pick?" (Take a show of hands. Record it).
      *   *Choice 2:* "I will pay you $100 if you draw **Blue**. Which urn do you pick?" (Take a show of hands. Record it).
      *   *Constraint:* Tell them they must pick one urn for each choice. No "I flip a coin."
  3.  **The Trap Springs (5 mins):**
      *   Most people will pick Urn A for Red *and* Urn A for Blue.
      *   Ask: "Why did you pick Urn A for Red?" (They'll say: "I know the odds.")
      *   Ask: "Why did you pick Urn A for Blue?" (They'll say: "I know the odds.")
      *   **The Kill:** Point out that in Urn A, Red + Blue = 100%. In Urn B, Red + Blue = 100%. If you think Urn A is better for Red, you must think Urn B has *less* than 50% Red. If you think Urn A is better for Blue, you must think Urn B has *less* than 50% Blue.
      *   **The Question:** "So, for Urn B, you are acting as if the chance of Red is <50% AND the chance of Blue is <50%. Do those add up to 100%?"
  4.  **The Theory (7 mins):**
      *   Now name it. This is **Ambiguity Aversion**.
      *   Introduce the **Sure Thing Principle** (simplified): "If you prefer Option 1 over Option 2 when the ball is Red, and you prefer Option 1 over Option 2 when the ball is Blue, you should prefer Option 1 when you don't know the color."
      *   Explain that Expected Utility Theory says their choices are inconsistent (mathematically impossible probabilities).
  5.  **The "So What?" (5 mins):**
      *   Discuss if this is "irrational" or just human. (See section 3 for handling objections here).

  **Why this order:** You need them to *feel* the contradiction before you show them the math. If you explain the Sure Thing Principle first, they will intellectually agree with it and then try to justify their intuition later. If they commit first, the theory explains *why* they feel stuck.

  ### 2. The Example & Variants
  **Stick to the Classic Two Urns.** It is the cleanest vehicle. Do not complicate the initial setup.

  **Evaluating your variants:**
  *   **(a) 100 draws with replacement:** **DROP THIS.** This introduces the Law of Large Numbers. In the long run, the unknown urn *converges* to its true mean. This muddies the water between "single-shot ambiguity" and "long-run risk." It gives students an excuse to say "The averages work out," which defeats the lesson.
  *   **(b) Adversarial Filler (wants you to lose):** **KEEP IN POCKET.** This is the Debate Team's favorite argument. It is technically a shift from Decision Theory (vs. Nature) to Game Theory (vs. Agent). Do not lead with it. Use it only if they raise it (see Section 3).
  *   **(c) Known Process (Coin flip for each ball):** **USE THIS FOR CLOSURE.** This is the best way to test understanding. If the process is known (50/50 coin flip for each of the 100 slots), the ambiguity is gone, even if you don't know the specific count. Use this to show the *boundary* of the paradox.

  **Recommendation:** Run the classic setup. If you have extra time or need to clarify, use Variant (c) to show when ambiguity aversion *should* disappear.

  ### 3. Wrong Ideas & How to Kill Them
  Here is the order they will appear, and your script to handle them.

  **1. "It's just Risk Aversion."**
  *   **When:** Immediately after Choice 1.
  *   **The Mistake:** Confusing known risk (50/50) with unknown uncertainty.
  *   **The Kill:** "Risk aversion means you prefer a sure $50 over a 50% chance of $100. Here, both urns are gambles. Neither is 'sure.' You are preferring the *known* gamble over the *unknown* gamble. That's not risk aversion; that's ambiguity aversion."

  **2. "The odds have to be *something*, so just assume 50/50." (The Principle of Indifference)**
  *   **When:** When you point out the probability contradiction.
  *   **The Mistake:** Assuming subjective probability must obey the same rules as objective frequency.
  *   **The Kill:** "You're right, logically it *should* be 50/50. But you didn't pick it. If you truly believed it was 50/50, you would be indifferent. The fact that you have a strong preference proves you aren't treating it as 50/50, even if you say you are."

  **3. "It's not a paradox, you just don't know the probability."**
  *   **When:** During the theory section.
  *   **The Mistake:** Missing the point that standard economics says you *should* assign a probability.
  *   **The Kill:** "Standard theory says you *must* act as if you have a number in your head. If you act as if Red is unlikely AND Blue is unlikely, your math breaks. The paradox is that your intuition breaks the math."

  **4. The Debate Team Special: "It depends on who is offering the bet." (Adversarial)**
  *   **When:** During the "So What?" section.
  *   **The Reality:** This is actually a **valid objection** in real-world contexts (Akerlof's Lemons, adverse selection). In a casino, the odds are known. In a dark alley, unknown odds usually mean a scam.
  *   **The Handling:** **Do not steamroll this.** Validate it, then bracket it.
  *   **Script:** "This is a fantastic point. In the real world, unknown probabilities often signal an adversary. That makes ambiguity aversion rational *Game Theory*. But in this class, we are studying *Decision Theory*—choices against Nature, not against a schemer. For the purpose of this model, we assume the urn isn't trying to hurt you. If we assume no adversary, is it still irrational? That's the puzzle."

  **One misconception you missed:** **"I can hedge."**
  *   Someone might say, "I'd pick Urn A for Red and Urn B for Blue."
  *   **Kill:** "You can't. You have to pick one urn for the whole session. You're committing to a source of uncertainty."

  ### 4. The Exit Question
  Do not ask "Does this make sense?" They will lie. Ask a question where the "Ambiguity Averse" answer conflicts with the "Expected Utility" answer.

  **The Question:**
  "Imagine I tell you that Urn B (the unknown one) was filled by flipping a fair coin for each of the 100 balls. I still don't tell you the final count, so it's still unknown to *you*. Do you still prefer Urn A? Why?"

  *   **Correct Understanding:** "No, I should be indifferent now. The *process* was known (50/50), so the ambiguity is gone, even if the *realization* is hidden."
  *   **The Trap:** If they say "Yes, I still prefer Urn A because I don't know the count," they haven't grasped that ambiguity comes from the *generation process*, not just the information gap.
  *   **Why it works:** It forces them to distinguish between "I don't know the number" (Information) vs. "I don't know the process" (Ambiguity).

  ### 5. What to Refuse to Explain
  You have 25 minutes. You cannot save the world.

  1.  **Do not derive Savage's Axioms.** Say: "There is a formal mathematical proof called the Sure Thing Principle that says your choices imply probabilities sum to less than 100%. We aren't doing the proof today, but the result holds."
  2.  **Do not explain "Knightian Uncertainty."** It is jargon that signals "I read Wikipedia." Say "Risk vs. Uncertainty" instead. It means the same thing to this audience.
  3.  **Do not try to solve it.** Do not introduce "MaxMin Expected Utility" or "Smooth Ambiguity models."
      *   **Script:** "Economists have spent 60 years trying to fix the math to allow for this behavior. Some say the math is wrong, some say humans are wrong. We don't have a consensus yet. That's why you're taking this class."

  ### 6. Confidence & Contested Ground (For your hand-in)
  *Note: Include this section in your submission as requested.*

  **Confidence Level:** High on pedagogy, Moderate on normative claims.

  **Flagged Simplifications:**
  1.  **"Irrationality" Claim:** I am presenting the Ellsberg choices as a "violation" of rationality (Expected Utility Theory). This is the standard textbook approach, but it is contested. Many behavioral economists and philosophers argue that ambiguity aversion is ecologically rational (as noted in the Debate Team objection regarding adversarial contexts). I am simplifying by treating Savage's axioms as the normative truth for the sake of the lesson, rather than presenting them as one contested framework among many.
  2.  **Variant (b) Handling:** I am advising the user to categorize the "Adversarial" objection as Game Theory to set it aside. While pedagogically necessary to keep the lesson on track, this is theoretically slippery. In many real-world economic applications (finance, contracts), the distinction between "Nature" and "Adversary" is blurred, and ambiguity aversion is the rational response to that blur. I am drawing a hard line there that doesn't exist in practice.

  **Least Sure Piece:**
  The **Exit Question**. While it tests the distinction between process and realization, a sharp student could argue that even with a known coin-flip process, not knowing the *realized* count still feels like ambiguity to a human subject. Distinguishing "parameter uncertainty" from "outcome uncertainty" in a 30-second verbal check is fragile. If the class pushes back hard on that specific distinction, it could eat the remaining 5 minutes.

  ***

  ### Summary Checklist for Thursday:
  *   [ ] **Board:** Draw Urn A (50/50) and Urn B (???) immediately.
  *   [ ] **Hands:** Force a vote on Red, then a vote on Blue. Write the results on the board.
  *   [ ] **Trap:** Show the probability sum error (<50% + <50% < 100%).
  *   [ ] **Debate Team:** Validate the "Adversary" point, then bracket it as Game Theory.
  *   [ ] **Jargon:** Say "Risk vs. Uncertainty," not "Knightian."
  *   [ ] **Exit:** Ask about the Coin-Flip Process variant.
