answer: |-
  # Seminar Handout: The Normative Architecture of Labour and Rest

  ## Introduction
  This taxonomy is designed to map the logical space of contemporary debates regarding working time, liability for overwork (*karoshi*), and the moral status of leisure. Rather than organising positions by historical school or named theorist, this decision tree sorts commitments based on how one answers specific normative questions. 

  The goal is to help you locate your own intuitions about the root scenario: *A jurisdiction is debating a statutory 35-hour working week, the classification of death by overwork, and the legal status of leisure.* 

  Navigate the tree by answering the questions at each node. Be warned: some paths lead to positions that are logically coherent but politically empty. Others lead to positions that agree on policy but disagree on principle.

  ---

  ## The Decision Tree

  ### Node 1: The Permissibility of Restriction
  **Question:** Should the state invalidate private employment contracts that voluntarily exceed 35 hours per week, even if the worker consents to the higher wage?

  *   **NO** (Freedom of contract prevails) → **Go to Node 2**
  *   **YES** (State protection trumps contract) → **Go to Node 3**

  ---

  ### Node 2: Liability and Virtue (The Non-Interventionist Branch)
  **Question:** If a worker dies from exhaustion (*karoshi*) under a voluntary contract, is the employer legally liable for negligence?

  *   **NO** (The risk lies entirely with the worker) → **Go to Node 4**
  *   **YES** (The employer bears responsibility despite consent) → **Leaf A: The Tort-Based Paternalist (Empty Slot)**

  ---

  ### Node 4: The Moral Valuation of Labour
  **Question:** Is labouring beyond the point of comfort a moral virtue that contributes to the good life?

  *   **YES** (Overwork is ennobling; leisure is suspect) → **Leaf B: The Strict Protestant-Work-Ethic Position**
  *   **NO** (Overwork is a preference, not a virtue; leisure is neutral) → **Leaf C: The Libertarian Autonomy View**

  ---

  ### Node 3: The Justification for Restriction (The Interventionist Branch)
  **Question:** Is the primary justification for the 35-hour cap that free time is a 'primary good' that must be distributed equally among citizens to ensure fair citizenship?

  *   **YES** (Leisure is a resource like income) → **Leaf D: The Distributive-Justice View**
  *   **NO** (Leisure is not necessarily a good to be distributed equally) → **Go to Node 5**

  ---

  ### Node 5: Welfare vs. Stability
  **Question:** Is the cap justified primarily to prevent physical/mental harm to the individual worker (welfare), OR to maintain macroeconomic stability and labour supply (structural)?

  *   **TO PREVENT HARM** (Protection of the worker's health) → **Leaf E: The Social-Democratic Regulatory View**
  *   **FOR STRUCTURAL STABILITY** (Work-sharing to reduce unemployment, without claiming leisure is a 'good') → **Leaf F: The Productivist Paternalist (Empty Slot)**

  ---

  ## Taxonomy Leaves: Position Descriptions

  ### Leaf A: The Tort-Based Paternalist (Empty Slot)
  *   **Commitments:** The state should *not* cap working hours (freedom of contract), but employers *are* liable if a worker dies from overwork.
  *   **Diagnosis:** **Incoherence/Instability.** This position attempts to have it both ways: it permits the risk but punishes the realisation of the risk. Without a cap, the liability creates a perverse incentive for employers to avoid hiring risk-prone workers rather than reducing hours. It lacks defenders because it is legally unstable; if the harm is actionable, the contract permitting it should logically be void.

  ### Leaf B: The Strict Protestant-Work-Ethic Position
  *   **Commitments:** No state cap on hours; no employer liability for *karoshi*; overwork is morally virtuous; leisure has no moral entitlement and is often a site of idleness or sin.
  *   **Core Logic:** Labour is a calling. To limit work is to limit moral opportunity. The state should not protect workers from their own drive to labour, as that drive is a feature of virtue, not a bug of exploitation.
  *   **View on Leisure:** Negative liberty only (freedom to rest, but no right to it).

  ### Leaf C: The Libertarian Autonomy View
  *   **Commitments:** No state cap on hours; no employer liability for *karoshi*; overwork is a private risk; leisure is a private preference.
  *   **Core Logic:** Competent adults own their own labour power. If they choose to trade health for income, the state has no standing to interfere. *Karoshi* is a tragic but self-regarding outcome, akin to extreme sports.
  *   **View on Leisure:** A negative liberty (freedom from interference), not a positive entitlement.

  ### Leaf D: The Distributive-Justice View
  *   **Commitments:** State must cap hours; leisure is a 'primary good'; *karoshi* is a structural injustice.
  *   **Core Logic:** Free time is a resource necessary for meaningful citizenship, just like income. A society where some work 60 hours and others 0 is unjust, regardless of welfare outcomes. The cap ensures a fair distribution of the burden of labour and the benefit of time.
  *   **View on Leisure:** A positive entitlement and a constitutive element of equality.

  ### Leaf E: The Social-Democratic Regulatory View
  *   **Commitments:** State must cap hours; justification is welfare/protection; *karoshi* is employer liability.
  *   **Core Logic:** Workers are vulnerable to coercion and short-termism. The state acts as a guardian to prevent harm (health/safety). The 35-hour week is a health standard, not necessarily a tool for perfect equality.
  *   **View on Leisure:** Primarily a recovery mechanism and a protective good.

  ### Leaf F: The Productivist Paternalist (Empty Slot)
  *   **Commitments:** State must cap hours; leisure is *not* a moral good (merely downtime); *karoshi* is a structural inevitability (no specific liability).
  *   **Diagnosis:** **Unattractiveness/Neglect.** This view supports the 35-hour week not for the sake of the worker's rights or health, but to force work-sharing and reduce unemployment statistics. It treats the worker as a unit of production to be managed. It lacks defenders because it offers no moral benefit to the worker (leisure is not a 'good') and imposes state control without the language of rights or protection.

  ---

  ## Important Note on Indistinguishability

  **Flag:** **Leaf D (Distributive-Justice)** and **Leaf E (Social-Democratic Regulatory)**.

  *   **The Overlap:** In almost all practical legislative scenarios, these two positions vote identically. Both support the 35-hour cap, both support employer liability for *karoshi*, and both reject the Libertarian and Protestant views.
  *   **The Divergence:** They diverge only on *justification*. 
      *   **Leaf E** argues: "We cap hours to stop you getting hurt." (Welfare/Paternalism).
      *   **Leaf D** argues: "We cap hours so everyone gets a fair share of life." (Equality/Justice).
  *   **Why this matters:** If the justification changes, the policy might shift later. A Welfare view (E) might accept longer hours if safety technology improves. A Justice view (D) would not, because the inequality of time remains unjust even if the work is safe. 
  *   **Instruction:** Do not treat these as the same position. If your commitment is to *equality*, you are at Leaf D. If your commitment is to *safety*, you are at Leaf E.

  ---

  ## Seminar Discussion Questions
  1.  Navigate the tree yourself. Which leaf represents your current view? 
  2.  If you landed on an Empty Slot (Leaf A or F), what adjustment would you make to your commitments to reach a defended position?
  3.  Consider the indistinguishability of Leaves D and E. In a political coalition, does the distinction matter, or is the shared policy sufficient?
  4.  Does the Protestant-Work-Ethic position (Leaf B) have any traction in modern secular law, or does it survive only in cultural norms?
