answer: |-
  **Scenario: The HarmonyAI Protocol**

  Consider a large institution that has adopted a novel dispute-resolution system known as the "HarmonyAI Protocol." When two members of the community, let us call them Alex and Jordan, enter into a significant interpersonal conflict that threatens the social fabric of the group, they are required to submit their grievances to an artificial mediator. This AI does not merely facilitate conversation; it analyzes biometric data, communication history, and psychological profiles to generate binding resolutions optimized strictly for long-term relational stability and productivity. The system is fully transparent: Alex and Jordan can view the exact weighting of variables and the logical path the AI took to reach its conclusion.

  **The Generalist Position: Procedural Fairness as a Stable Anchor**

  A moral generalist argues that the HarmonyAI Protocol is morally permissible, and perhaps even obligatory, based on a principle of **Procedural Fairness and Transparency**. The generalist contends that in any context of conflict resolution, the moral rightness of the procedure depends on the consistent application of rules and the visibility of the decision-making process.

  The generalist draws an analogy to traditional face-to-face mediation. In human mediation, fairness is achieved when the mediator is impartial and the process is clear to both parties. Since the AI is demonstrably more impartial than a human (lacking personal bias) and offers greater transparency (revealing its algorithmic weights rather than hiding behind human intuition), it satisfies the principle of Procedural Fairness to a higher degree. For the generalist, the property of "transparency" carries a positive moral valence that is stable across contexts; whether the mediator is flesh or silicon, transparency counts in favor of the action. Therefore, the AI mediation is morally analogous to the best cases of human mediation.

  **The Particularist Position: Radical Contextualism and Property Instability**

  A radical moral particularist rejects this assessment. They do not merely argue that the AI violates a competing principle (e.g., "Human Dignity overrides Fairness"). Instead, they argue that the Generalist has misidentified the moral landscape entirely.

  The particularist denies that "transparency" functions as a stable reason in the AI context. In a face-to-face human mediation, transparency regarding the mediator's thought process fosters trust and mutual recognition. However, in the HarmonyAI context, the particularist claims that the *property itself* changes. Because the AI optimizes for "stability" rather than "truth" or "reconciliation," transparency about its algorithm does not foster trust; it reveals the instrumentalization of the participants. The feature "transparency" does not just switch from positive to negative valence; it ceases to be the same morally relevant feature.

  Furthermore, the particularist rejects the analogical appeal to face-to-face mediation. They argue that the properties that grounded the moral significance of human mediation—such as "shared vulnerability," "risk of misunderstanding," and "physical co-presence"—do not merely exist in a diminished form in the AI case; they are eliminated by the technological architecture. The AI removes the risk of misunderstanding by predicting outcomes, but in doing so, it removes the moral opportunity for forgiveness that arises *from* that risk. Therefore, there is no common ground for analogy. The AI case is not a "harder version" of the human case; it is a morally distinct category where the reasons applicable to human mediation simply fail to get a grip.

  **The Conceptual Issue: The Dilemma of Differentiation**

  The conceptual crisis arises when the Generalist presses the Particularist on the basis of this distinction.

  The Generalist asks: "You claim the AI case is morally different because the properties of 'trust' and 'resolution' are not present in the same way. But what criterion are you using to individuate these properties? You are asserting that 'physical co-presence' or 'direct emotional reciprocity' is the boundary condition that determines whether a reason can exist at all."

  Here lies the trap for the Particularist:

  1.  **If the Particularist specifies the difference:** If they say, "The AI case is different because direct emotional reciprocity is morally necessary for genuine resolution," they appear to be invoking a general principle (e.g., "Direct emotional reciprocity is always a precondition for moral resolution"). This violates their commitment to the denial of stable, morally relevant properties that function across contexts. They have smuggled in a general claim about the *conditions of relevance*.
  2.  **If the Particularist refuses to specify the difference:** If they insist, "No, there is no rule about reciprocity; this case is just unique," they risk making their judgment unintelligible. Without appealing to some stable feature that distinguishes the AI context from the human context, their rejection of the analogy looks arbitrary. If there are no stable properties that ground the distinction, on what basis can they claim the cases are disanalogous rather than merely different in degree?

  **The Core Tension**

  The issue turns on whether a particularist can maintain a **holism of reasons** (the idea that a feature's moral contribution depends on the context) without implicitly relying on a **generalism of relevance** (a general claim about which features are capable of mattering in which contexts).

  In the HarmonyAI scenario, the Particularist wants to say that the technological context eliminates the very possibility of certain moral reasons arising. But to justify *why* the technology eliminates those reasons, they seem forced to appeal to a general truth about the nature of technology and human interaction (e.g., "Algorithms cannot participate in reciprocity"). If that general truth holds, then "participation in reciprocity" acts as a stable, morally relevant property that governs the applicability of reasons across all cases.

  Thus, the intersection reveals a potential instability in radical particularism: to deny the Generalist's analogy effectively, the Particularist may need to assert a higher-order generalization about the metaphysics of social interaction, thereby conceding that while there may be no universal *principles of action*, there are universal *principles of description* that determine which properties are available to serve as reasons. The debate stalls on whether admitting stable conditions for the *existence* of reasons is a betrayal of particularism, or a necessary precondition for making particularist judgments intelligible.
