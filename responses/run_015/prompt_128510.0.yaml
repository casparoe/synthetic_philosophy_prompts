prompt: |-
  Give an example of a conceptual issue arising at the intersection of moral particularism and moral generalism, specifically in a case where the particularist denies not only the existence of universal moral principles but also the existence of stable, morally relevant properties that could ground analogical reasoning across contexts. Construct a scenario involving a novel institutional practice—say, the delegation of interpersonal conflict resolution to an artificial mediator designed to optimize for long-term relational stability—where a generalist appeals to a principle of procedural fairness and transparency, while the particularist rejects both the principle and any analogical appeal to face-to-face mediation on the grounds that the technological context eliminates the very properties that made the original cases morally significant. The issue should turn on whether the particularist can maintain that the mediated case is genuinely different without implicitly relying on a general claim about the moral importance of direct emotional reciprocity or physical co-presence. The example should be intelligible to someone familiar with the particularism-generalism debate but should not depend on citation of specific authors or texts.
reasoning: |-
  Here's a thinking process that leads to the suggested example:

  1.  **Analyze the Request:**
      *   **Topic:** Conceptual issue at the intersection of moral particularism and moral generalism.
      *   **Specific Constraint 1 (Particularist Stance):** The particularist must deny *both* universal moral principles *and* stable, morally relevant properties (holism of reasons). This means they can't just say "Principle X doesn't apply"; they must say "The features that mattered in Case A don't even exist or function the same way in Case B."
      *   **Specific Constraint 2 (Scenario):** A novel institutional practice: AI-mediated interpersonal conflict resolution optimized for long-term relational stability.
      *   **Specific Constraint 3 (Generalist Stance):** Appeals to a principle of procedural fairness and transparency.
      *   **Specific Constraint 4 (Particularist Rejection):** Rejects the principle *and* analogical appeal to face-to-face mediation. Claims the technological context eliminates the properties that made original cases morally significant.
      *   **Core Tension/Issue:** Can the particularist claim the cases are genuinely different without implicitly relying on a general claim (e.g., about the importance of direct emotional reciprocity)? This is the "bootstrapping" or "consistency" problem for radical particularism.
      *   **Audience:** Familiar with the debate (no need to define basic terms like "holism" or "prima facie duties"), but no specific author citations (Dancy, McNaughton, etc.).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Moral Generalism:* Morality is structured by principles. If feature $F$ counts in favor of action $A$ in case $C1$, it must count in favor of $A$ (or be overridden by a stronger principle) in case $C2$. Analogical reasoning works because properties are stable.
      *   *Moral Particularism (Radical/Holist):* The valence of a feature can change depending on context. There are no exceptionless principles. Furthermore, the prompt asks for a *strong* particularism where even the *relevance* of properties might shift or vanish.
      *   *The Trap:* If the particularist says "AI mediation is wrong because it lacks human presence," they sound like they are asserting a general principle ("Human presence is always morally relevant"). To avoid this, they must argue that "human presence" isn't a stable property that carries weight; rather, the *entire configuration* of the AI context creates a new moral shape where previous reasons simply don't get a grip.

  3.  **Drafting the Scenario:**
      *   *Setting:* A corporate or community dispute resolution system. Let's call it "HarmonyAI."
      *   *The Conflict:* Two colleagues, Alice and Bob, have a deep interpersonal rift affecting work.
      *   *The Generalist Argument:* We use HarmonyAI. It's fair (algorithm is transparent), consistent (no bias), and aims for stability. It's like a human mediator, just better. The principle is "Procedural Fairness."
      *   *The Particularist Argument:* We cannot use HarmonyAI. It's not just that it violates fairness; it's that the *reasons* we care about mediation in human contexts don't exist here.
      *   *The Crucial Twist:* The particularist must explain *why* it's different without saying "Face-to-face is always better." They must argue that the *meaning* of "resolution" changes in the AI context.

  4.  **Developing the Conceptual Issue (The "Trap"):**
      *   The Generalist asks: "On what basis do you distinguish this from human mediation?"
      *   The Particularist says: "The properties are different."
      *   The Generalist asks: "Which properties?"
      *   The Particularist says: "The emotional reciprocity."
      *   The Generalist pounces: "So, emotional reciprocity is a morally relevant property that is absent here. Doesn't that imply it's a stable reason that matters across cases? If it matters here by its absence, doesn't it matter generally by its presence?"
      *   *The Issue:* The particularist risks positing a "second-order" generalism (a general claim about which properties are capable of being relevant) to defend their first-order particularism (that no principles govern the outcomes).

  5.  **Refining the Narrative:**
      *   *Case A (Traditional):* Human mediator. Features: Eye contact, tone of voice, shared vulnerability. Outcome: Reconciliation.
      *   *Case B (AI):* Algorithmic mediator. Features: Data optimization, predicted outcomes, text-based or avatar-based. Outcome: Stability (but maybe hollow).
      *   *Generalist:* "Fairness requires transparency. The AI is transparent. Therefore, it is permissible."
      *   *Particularist:* "The AI context changes the valence of 'transparency.' In human mediation, transparency builds trust. In AI mediation, transparency reveals manipulation (optimization). Therefore, the feature 'transparency' functions differently."
      *   *The Deep Cut:* The prompt requires the particularist to deny stable properties. So, the particularist must argue that "trust" in Case A isn't the same property as "trust" in Case B.
      *   *The Problem:* To say they aren't the same property, the particularist needs a criterion for individuating properties. That criterion looks suspiciously like a general principle.

  6.  **Writing the Response (Iterative Process):**
      *   *Introduction:* Set the stage (HarmonyAI). Define the stakes without jargon overload.
      *   *The Generalist Position:* Focus on Procedural Fairness. The AI treats like cases alike.
      *   *The Particularist Position:* Focus on the holism of reasons. The context shifts the moral landscape.
      *   *The Specific Tension:* The "Meta-Principle" problem. If the particularist says "Physical co-presence is required for *this* kind of moral reason," are they not stating a general truth about physical co-presence?
      *   *Conclusion:* Summarize the impasse.

  7.  **Checking Constraints:**
      *   *Denial of stable properties?* Yes, need to emphasize that the particularist claims the *nature* of the interaction changes the properties themselves, not just their weight.
      *   *Novel institutional practice?* Yes, AI mediator.
      *   *Generalist appeals to fairness/transparency?* Yes.
      *   *Particularist rejects analogy?* Yes.
      *   *No citations?* Ensure no names like Dancy, McNaughton, Hooker, etc.
      *   *Intelligible to experts?* Use terms like "valence," "holism," "defeasibility," "supervenience" appropriately.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the particularist doesn't just say "AI is bad." They must say "The reasons against AI aren't the same reasons as against a bad human mediator."
      *   *Correction:* Ensure the "trap" is clearly articulated. The issue is whether the particularist can describe the difference without invoking a general rule about *what makes a difference*.

  9.  **Final Output Structure:**
      *   Scenario Setup.
      *   The Generalist Case.
      *   The Particularist Case (Radical Holism).
      *   The Conceptual Crux (The Dilemma).

