answer: |-
  You have effectively reconstructed **Attitudinal Hedonism** (closely associated with Fred Feldman and Chris Heathwood). It is a sophisticated position that avoids the "common qualia" trap, but it exposes you to a different set of vulnerabilities, primarily regarding the boundary between *hedonism* and *desire theory*, and the empirical link between *wanting* and *liking*.

  Here is the ranking of defeaters from fatal to merely awkward, followed by the specific handling of your worries and the "killer pair" you requested.

  ### The Ranking of Defeaters

  **1. FATAL: The 'Wanting/Liking' Dissociation (The Slot Machine)**
  This is the strongest empirical threat. In affective neuroscience (Kent Berridge's work), 'wanting' (incentive salience) and 'liking' (hedonic impact) are dissociable. You can stimulate the mesolimbic dopamine system such that a subject compulsively wants a stimulus to continue (or seeks it out) while displaying no hedonic markers (no smiling, no pleasure reports) and even displaying signs of distress.
  *   **Why it's fatal:** Your definition of pleasure *is* the disposition to want the state to continue. If neuroscience shows you can have that disposition without the *value* of pleasure (or even with pain), your definition picks out the wrong natural kind. You are defining welfare as "dopaminergic pursuit," not "pleasure." If you concede the empirical claim, your Continuation Test fails to track pleasure.
  *   **Concession:** You must concede this counts against you. To save the view, you have to argue that the "wanting" in your test must be *conscious* and *endorsed*, but that moves you away from a simple dispositional test and back toward a qualitative feeling, which re-opens the heterogeneity worry.

  **2. FATAL: Unfalsifiability (The Elasticity Charge)**
  If every time a counter-example arises you refine what "wanting for its own sake" means (e.g., "not if it's manic," "not if it's manipulated," "not if it's addiction"), the Continuation Test becomes a post-hoc label for "states we intuitively think are good."
  *   **Why it's fatal:** A constitutive claim about welfare must constrain the extension of "pleasure." If the test is so elastic that it perfectly matches our pre-theoretical intuitions about welfare, the concept of "pleasure" is doing no work. You aren't a hedonist; you're an intuitionist using the word "pleasure" as a placeholder.
  *   **Concession:** You must concede this is a problem. You need independent criteria for what counts as a valid "pro-attitude" that doesn't just track your welfare intuitions.

  **3. SEVERE: The Mill/Smuggling Objection**
  If the "pro-attitude" is influenced by judgment (e.g., "I want this proof to continue because it is *worthy*"), then the source of the welfare is the *worthiness*, not the attitude.
  *   **Why it's severe:** It suggests you have smuggled an Objective List value (e.g., Achievement, Knowledge) into the definition of pleasure. If the only reason the proof passes the Continuation Test is because the agent values achievement, then Achievement is the actual welfare constituent, and pleasure is just the shadow it casts.
  *   **Concession:** This threatens your claim to be a *hedonist*. You might have to admit you are a "Hybrid Theorist."

  **4. AWKWARD: The Poison Ivy Case**
  Scratching the rash feels amazing, passes the Continuation Test, but damages health.
  *   **Why it's only awkward:** This is a standard bullet for hedonists to bite. You distinguish *prudential value* (welfare) from *overall value* (all-things-considered good). Scratching the ivy is good *for you* (welfare-wise) but bad *overall* (because health is also valuable, or because future pain outweighs current pleasure).
  *   **Concession:** You don't have to concede this defeats the view, only that it makes hedonism counter-intuitive regarding the relationship between welfare and health.

  ---

  ### Handling Your Specific Worries

  **1. Ivy vs. Slot Machine: Which direction damages more?**
  The **Slot Machine** direction damages you infinitely more.
  *   **Ivy:** Confirms your theory (it *is* pleasure/welfare) but conflicts with non-hedonic values (health). This is a conflict between theories of value.
  *   **Slot Machine:** Falsifies your definition. If the test says "Yes, this is pleasure" but the phenomenology and normative status say "No, this is craving/addiction/distress," your definition of pleasure is empirically wrong. You cannot bite the bullet here without redefining "pleasure" so broadly it includes suffering, which is self-contradictory.

  **2. Do you need a single neural mechanism?**
  **No.** You can be a functionalist. The unity claim is not physical; it is *intentional/structural*.
  *   **The Unity Claim:** All pleasures share the same *direction of fit* (world-to-mind) regarding their own continuation.
  *   **What would show it false?** If you find two states that both pass the Continuation Test but operate on completely incompatible normative logics (e.g., one is improved by being based on truth, the other is indifferent to truth), it suggests they aren't the *same kind of thing* unified under "welfare."

  **3. Is this the old Mill move?**
  **Yes, dangerously so.** Mill tried to save hedonism by saying some pleasures are "higher." Critics argued that if they are higher *because* competent judges prefer them even with discomfort, then "pleasure" isn't the metric; "dignity" or "competence" is.
  *   **Your version:** If the Continuation Test is passed by the Proof *only because* the agent values truth, then Truth is the welfare constituent.
  *   **The Fix:** You must argue that the pro-attitude is *phenomenologically distinct* when it is hedonic vs. when it is moral. If you can't distinguish "wanting this to continue because it feels good" from "wanting this to continue because it is good," you have ceased to be a hedonist.

  **4. Is the Continuation Test unfalsifiable?**
  **Yes, unless constrained.** If you define the test as "wanting for its own sake," you must exclude cases where the wanting is pathological, manipulated, or ignorant without simply saying "because it lowers welfare."
  *   **Is this a real problem?** Yes. If the theory cannot imagine a world where someone wants a state to continue for its own sake, yet that state does not contribute to their welfare, the theory is tautological. A constitutive claim must be contingent. It must be *possible* for the test to come apart from welfare.

  **5. Is the Family Resemblance move a rescue?**
  **It is a defeat disguised as a rescue.**
  *   **Why:** Hedonism is attractive because it offers a *monistic* explanation of value (one thing matters: pleasure). If you say "Pleasure is a bag of disparate states (beer, proofs, schadenfreude) that share no common quality or attitude, but we just list them," you have adopted an **Objective List Theory** where the list happens to be things people call "pleasure."
  *   **Verdict:** You save the *extension* (the list of good things) but lose the *intension* (the explanation of *why* they are good). You lose the theoretical elegance that motivated hedonism in the first place.

  ---

  ### The Killer Pair (The "False Belief" Variation)

  You asked for a pair of experiences that come out **equally pleasant by your test** (both pass the Continuation Test) but where it is **obvious one is better for the person**.

  Here is the pair. It relies on the **Authenticity/Contact with Reality** intuition, which is the standard nemesis of attitudinal hedonism.

  **Case A: The Authentic Mastery**
  You are learning to play a difficult piece of music. You are in a state of "flow." You are fully engaged. You take a pro-attitude toward the activity; you want it to continue for its own sake. Your skill is real. Your progress is real.
  *   **Continuation Test:** PASSED. You want it to keep going.

  **Case B: The Matrix Mastery**
  You are hooked up to a machine. You *feel* exactly as if you are learning the music. You are in a state of "flow." You take a pro-attitude toward the activity; you want it to continue for its own sake. The machine stimulates your brain to produce the exact same dispositional profile as Case A. However, you are actually lying still in a vat. You are not playing music. You are not mastering anything.
  *   **Continuation Test:** PASSED. By stipulation, the subjective pro-attitude is identical.

  **The Welfare Intuition:**
  Most people (including many hedonists, though they fight it) have the strong intuition that **Case A is better for you than Case B.**
  *   In Case A, you are actually achieving something.
  *   In Case B, you are being deceived.

  **Why this breaks your view:**
  Your view says Welfare = Pleasure. Pleasure = Passing the Continuation Test.
  Since both pass the test equally, your view says **Welfare(A) = Welfare(B).**
  If you agree that Welfare(A) > Welfare(B), you have admitted that **something other than pleasure (e.g., authenticity, achievement, contact with reality) contributes to welfare.**
  If you insist Welfare(A) = Welfare(B), you have to bite the bullet that a life in a vat is just as good as a real life, provided the pro-attitudes are stimulated. This is the **Experience Machine** objection, which is generally considered the strongest argument against hedonism.

  **Can you escape it?**
  Only if you argue that the pro-attitude in Case B is *defective* in a way that fails the test. But how? The subject *wants* it to continue. They *like* it. To say they "don't *really* want it" requires an objective standard of desire (e.g., "they would want it less if they knew the truth"). But if you introduce "if they knew the truth," you have moved from **Hedonism** (what feels good now) to **Informed Desire Theory** (what we would want with full information). That is a different theory entirely.

  ### Final Verdict

  Your view is **highly exposed**.
  By defining pleasure as a pro-attitude to avoid the heterogeneity of qualia, you have made your view vulnerable to the **Wanting/Liking dissociation** (empirically fatal) and the **Experience Machine** (conceptually fatal).

  *   **If you hold the line:** You are an Attitudinal Hedonist. You must accept that the Satisfied Slave and the Matrix Musician have equal welfare to the Free Person and the Real Musician.
  *   **If you flinch:** You admit that the pro-attitude must be "authentic" or "informed," which turns you into a Desire Theorist.
  *   **If you pivot:** You admit that "pleasure" is just a label for a list of good things, which turns you into an Objective List Theorist.

  The "Continuation Test" does not save hedonism; it merely shifts the battlefield from phenomenology to the philosophy of mind and action, where the view is arguably even more vulnerable.
