      *   *The Bite:* It threatens self-knowledge. If $Q$ (quale) doesn't cause $J$ (judgment/report), then $J$ is caused entirely by $P$ (physical state). Why does $J$ refer to $Q$?
      *   *Epiphenomenalist Reply:* The physical state $P$ causes both $Q$ and $J$. $J$ is caused by $P$, and $Q$ is caused by $P$. The correlation is explained by the common cause ($P$).
      *   *The Residual Problem:* Reference. How does the concept in $J$ latch onto $Q$ if there's no causal link between $Q$ and the concept formation?
      *   *Verdict:* It's a major cost, but not necessarily fatal *if* one accepts a specific theory of reference (e.g., direct reference or a causal theory that allows common-cause tracking). Chalmers thinks it's survivable but costly.

