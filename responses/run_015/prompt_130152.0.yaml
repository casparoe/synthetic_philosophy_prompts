answer: |-
  # Workshop Handout: The "Who Am I At Work?" Sorting Tree

  **Instructions:** Don't overthink the philosophy. Answer the three questions below based on your gut reaction to the scenarios. Follow the arrows to find your "Ethical Leaf."

  ---

  ### 🌱 START HERE: The Self-Check
  **Scenario:** You get laid off. The severance is fair, but you're out.
  **Question:** Do you feel like you've lost a part of *who you are* (like a breakup), or just a function you were performing (like returning a rental car)?

  *   **A. I lost a part of myself.** (Roles are **Constitutive**) → *Go to Branch 1*
  *   **B. I just lost a function.** (Roles are **Scripts**) → *Go to Branch 2*

  ---

  ### 🌿 BRANCH 1: Roles Define Who I Am
  **Scenario:** You're a manager. A junior staff member messes up badly.
  **Question:** Is the care you owe them a literal extension of the love you owe your parents/siblings, or is "family" just a metaphor for "don't be a jerk"?

  *   **A. It's literal. They are my moral kin.** (Scaling **YES**) → *Go to Question 1.1*
  *   **B. It's a metaphor. Family is family, work is work.** (Scaling **NO**) → *Go to Question 1.2*

  #### **Question 1.1 (Literal Kinship)**
  **Scenario:** Company policy says "Fire the mistake." Your gut says "Protect your own."
  **Do you hide the mistake or break the rule to save them?**

  *   **YES, I break the rule.**
      *   **Leaf Name:** **Radical Particularism** (e.g., some readings of *Zigong* covering for his father)
      *   **Awkward Commitment:** You have to admit that nepotism isn't a bug in the system, it's the whole point of morality.
  *   **NO, I follow the rule.**
      *   **Leaf Name:** **Institutional Confucianism** (e.g., modern "Civic Confucianism")
      *   **Awkward Commitment:** You have to explain why your "moral kin" get fired when your actual kin would get bailed out.

  #### **Question 1.2 (Metaphorical Kinship)**
  **Scenario:** If work isn't family, does the "Confucian" label do any heavy lifting, or are you just a professional with good manners?
  **Is public life morally empty compared to private life?**

  *   **YES, public life is just contract/rules.**
      *   **Leaf Name:** **Private Virtue Confucianism**
      *   **Awkward Commitment:** You believe a CEO can be a "sage" at home but a ruthless shark at work without being a hypocrite.
  *   **NO, public life has its own distinct duties.**
      *   **Leaf Name:** **Role Functionalism**
      *   **Awkward Commitment:** You've basically agreed with generic Virtue Ethics and admitted Confucius has nothing specific to say about corporations.

  ---

  ### 🌿 BRANCH 2: Roles Are Just Scripts
  **Scenario:** You treat your team like "family."
  **Question:** Is this because you owe them a moral debt, or because it's a useful management strategy to boost productivity?

  *   **A. It's a moral duty.** (Normative **YES**) → *Go to Question 2.1*
  *   **B. It's a strategy.** (Normative **NO**) → *Go to Question 2.2*

  #### **Question 2.1 (Moral Duty)**
  **Scenario:** Can you owe a duty to a stranger (citizen/employee) without a personal relationship?
  **Is citizenship a real relationship or just a legal contract?**

  *   **YES, it's a real relationship.**
      *   **Leaf Name:** **Universalized Role Ethics**
      *   **Awkward Commitment:** If everyone is your "role-kin," the special intensity of actual family love gets watered down to nothing.
  *   **NO, it's just a contract.**
      *   **Leaf Name:** **Contractual Confucianism** (⚠️ **FLAG: POTENTIALLY INCOHERENT**)
      *   **Awkward Commitment:** You claim roles create duty, but then say the biggest roles (citizen/worker) create no duty beyond the legal minimum.

  #### **Question 2.2 (Management Strategy)**
  **Scenario:** Profits drop. The "family culture" is now costing too much money.
  **Do you keep the "family" act going?**

  *   **YES, keep the act.**
      *   **Leaf Name:** **Strategic Humanism** (⚠️ **FLAG: UNNAMED/UNEXPLORED**)
      *   **Awkward Commitment:** You are willingly losing money to maintain a lie about how much you care.
  *   **NO, drop the act.**
      *   **Leaf Name:** **Corporate Paternalism**
      *   **Awkward Commitment:** You admit the "care" was fake all along, which destroys trust the moment employees figure it out.

  ---

  ### ⚠️ MAP LEGEND & GLITCHES

  **1. The "Incoherent" Branch**
  *   **Contractual Confucianism (Branch 2.1 - No):** We flagged this as potentially incoherent. If roles are just scripts (Branch 2) and you deny the relationship is real (2.1-No), you aren't doing role ethics anymore; you're just a libertarian with a quote from Confucius on the wall.

  **2. The "Unexplored" Branch**
  *   **Strategic Humanism (Branch 2.2 - Yes):** This is likely empty. Most people who treat roles as scripts (Branch 2) won't sacrifice profit for the script. If you do, you probably belong in Branch 1 (Constitutive) but are afraid to admit it.

  **3. Indistinguishable Leaves (The "Turing Test" Problem)**
  *   **Institutional Confucianism (1.1-No)** vs. **Corporate Paternalism (2.2-No)**
      *   **Why they blur:** In practice, both managers fire the underperformer. Both might say "I'm sorry, it's policy."
      *   **The Difference:** One thinks they are betraying a moral bond (1.1); the other thinks they are optimizing resources (2.2). You can't sort these people by *action*, only by *confession*.
  *   **Private Virtue Confucianism (1.2-Yes)** vs. **Role Functionalism (1.2-No)**
      *   **Why they blur:** Both keep family logic out of the office.
      *   **The Difference:** One thinks the office is morally empty (1.2-Yes); the other thinks the office has *different* morals (1.2-No). Again, hard to separate without deep interrogation.

  **4. The "Generic Virtue" Collapse**
  *   If you land on **Role Functionalism** or **Universalized Role Ethics**, check yourself: Are you just saying "Be a good person"? If yes, you've collapsed into generic Virtue Ethics. Confucian Role Ethics *needs* the specific relationship (Father/Son, Ruler/Subject) to do the work. If the relationship doesn't matter, the tree has failed you.
