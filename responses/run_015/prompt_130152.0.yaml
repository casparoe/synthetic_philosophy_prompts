prompt: |-
  hey i need a sorting taxonomy for a workshop on confucian role ethics — like, whether xiao, ti, and the five relations can scale to modern instutional roles (manager-employee, citizen-state) without just collapsing into generic virtue ethics. build it as a decision tree where each branch splits on a concrete case someone could answer without knowing the labels: does a manager owe filial-style protection to a junior worker when it conflicts with profit? is citizenship a real relational role or just a contract? can obligations to strangers be mediated through institutions at all? first split should be whether roles are constitutive of the self (some readings of the Analects) or just behavioral scripts. then split on scaling beyond kin, then on whether obligations survive when they clash with organizational rules. each leaf needs a name if a real view defends it, otherwise 'unnamed', plus one sentence on its most awkward commitment. flag any empty branches — e.g. accepting scaling but denying any instutitional mediation — and say if that's incoherent or just unexplored. also flag pairs of leaves your tree can't actually separate on these cases. keep it casual, like a handout, and don't ask for citations or a reading list — i want people to sort themselves by what they'd do in the cases.
reasoning: |-
  Here's a thinking process that leads to the suggested sorting taxonomy:

  1.  **Analyze the Request:**
      *   **Topic:** Confucian Role Ethics (specifically *xiao*, *ti*, Five Relations) applied to modern institutional roles (manager-employee, citizen-state).
      *   **Goal:** Create a sorting taxonomy/decision tree for a workshop.
      *   **Constraint 1 (Structure):** Decision tree format.
      *   **Constraint 2 (Content):** Branches must split on concrete cases/questions, not abstract labels.
      *   **Constraint 3 (First Split):** Constitutive of self vs. Behavioral scripts.
      *   **Constraint 4 (Subsequent Splits):** Scaling beyond kin, Obligations vs. Organizational rules.
      *   **Constraint 5 (Leaves):** Name the view (if real) or "Unnamed". Add one sentence on its "most awkward commitment."
      *   **Constraint 6 (Flags):** Flag empty/incoherent branches. Flag indistinguishable leaves.
      *   **Constraint 7 (Tone):** Casual, like a handout. No citations/reading lists.
      *   **Core Problem:** Avoid collapsing into generic virtue ethics.

  2.  **Deconstruct the Philosophy (Mental Sandbox):**
      *   *Confucian Role Ethics (CRE):* Focuses on relationships defining the person (Ames, Hall, Rosemont). *Xiao* (filial piety) is the root.
      *   *The Tension:* Can *xiao* (family-specific) apply to a CEO? If yes, how? If no, is CRE useless for modern politics?
      *   *Generic Virtue Ethics:* "Be a good person." CRE wants to say "Be a good *father/manager/citizen*."
      *   *Split 1 (Self):* Is the role *who I am* (ontological) or *what I do* (functional)?
      *   *Split 2 (Scaling):* Can family logic apply to strangers/institutions? (Extension vs. Distinction).
      *   *Split 3 (Conflict):* What happens when role duty clashes with system rules (profit/law)?

  3.  **Drafting the Decision Tree (Iterative Process):**

      *   *Root:* Start with the "Constitutive vs. Script" split.
          *   Q: "If you quit your job, are you still a 'manager' deep down, or was that just a hat you wore?"
          *   Branch A: It's who I am (Constitutive).
          *   Branch B: It's just a job description (Script).

      *   *Branch A (Constitutive):*
          *   Next Split: Scaling beyond kin.
          *   Q: "Does your boss deserve the same gut-level care you owe your dad, or is that crazy?"
          *   A1: Yes, scale it up (Family Model).
          *   A2: No, keep them separate (Distinct Spheres).
          *   *Refining A1 (Family Model):* Now conflict with rules.
              *   Q: "Do you hide your subordinate's mistake like you'd hide a brother's theft?"
              *   Yes -> *Radical Particularism* (Leaf 1). Awkwardness: Nepotism is a feature, not a bug.
              *   No -> *Institutional Confucianism* (Leaf 2). Awkwardness: You have to explain why family logic stops at the office door.
          *   *Refining A2 (Distinct Spheres):* This risks becoming generic virtue ethics.
              *   Q: "If the roles don't scale, is 'Confucianism' just a metaphor for 'be professional'?"
              *   Yes -> *Role Functionalism* (Leaf 3). Awkwardness: You've admitted Confucius has nothing new to say about corporations.
              *   No -> *Unnamed* (Leaf 4). Awkwardness: You claim roles define you but only in the family, leaving you split-personality in public.

      *   *Branch B (Script/Behavioral):*
          *   Next Split: Scaling.
          *   Q: "Is 'filial piety' at work just a useful trick to get people to work harder?"
          *   B1: Yes, it's a tool (Instrumental).
          *   B2: No, it's a moral duty (Normative).
          *   *Refining B1 (Instrumental):*
              *   Q: "If profit drops, do you drop the 'family' act?"
              *   Yes -> *Corporate Paternalism* (Leaf 5). Awkwardness: You admit the care is fake.
              *   No -> *Unnamed* (Leaf 6). Awkwardness: Why keep the act if it costs money? (Flag as potentially incoherent).
          *   *Refining B2 (Normative):*
              *   Q: "Can you owe a stranger duty without a personal relationship?"
              *   Yes -> *Universalized Role Ethics* (Leaf 7). Awkwardness: If everyone is family, no one is.
              *   No -> *Private Confucianism* (Leaf 8). Awkwardness: Public life is morally empty.

  4.  **Review and Refine against Constraints:**
      *   *Tone:* Needs to be punchier, less academic. "Handout style."
      *   *Flags:* Need to explicitly mark empty branches or indistinguishable leaves.
      *   *Specific Cases:* Ensure the questions match the prompt's examples (manager protection, citizenship contract, institutional mediation).
      *   *First Split:* Constitutive vs. Script. (Check).
      *   *Second Split:* Scaling beyond kin. (Check).
      *   *Third Split:* Obligations vs. Rules. (Check).
      *   *Leaves:* Name + Awkward Commitment. (Check).

  5.  **Polishing the Tree Logic:**
      *   *Critique:* The "Script" branch might collapse too easily into generic virtue ethics. I need to make sure the distinction is sharp.
      *   *Adjustment:* Make the "Script" branch about whether the role *creates* the obligation or just *channels* pre-existing morality.
      *   *Critique:* The prompt asks to flag pairs of leaves the tree can't separate.
      *   *Observation:* *Institutional Confucianism* (A2-Yes) and *Corporate Paternalism* (B1-No) might look the same in practice (boss acts nice), but for different reasons. I should note that.
      *   *Observation:* *Private Confucianism* and *Role Functionalism* might both end up saying "Keep family at home," but one thinks roles define self, the other thinks they don't. Hard to separate on *action*, easy on *metaphysics*. I'll flag the action indistinguishability.

  6.  **Finalizing the Content (incorporating "Casual Handout" vibe):**
