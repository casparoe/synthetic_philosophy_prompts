  8.  **Final Polish:** Check tone. Ensure no citations. Ensure it feels like a workshop tool. (Self-Correction: Make sure the "Constitutive" definition is clear in the question so people don't need philosophy jargon).

      *   *Revised Q1:* "If you lost your job tomorrow, would you feel like you lost a part of *who you are*, or just a paycheck and a title?"
