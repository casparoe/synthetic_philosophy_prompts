  In a mid-sized software firm, developers Alice and Bob are granted decentralized veto rights over whether their individual keystroke dynamics are ingested into a shared productivity analytics model, with the system defaulting to inclusion unless opted out. While both engineers strictly prefer the model be trained on both datasets to maximize predictive accuracy rather than just one, and both agree that a fully trained model is superior to no model at all, each harbors a stronger conditional preference against being the sole subject of surveillance, fearing professional exposure if their data alone highlights inefficiencies while the other remains hidden. Consequently, acting on their personal veto rights to avoid the asymmetry of being the only one monitored, both Alice and Bob opt out, resulting in a null dataset that renders the model useless—an outcome both agree is inferior to full participation, yet one produced entirely by the uncoordinated exercise of their local informational privacy rights to block the other's benefit.

  **Verification of Specifications**
  *   **Alternatives:** (In, In), (In, Out), (Out, In), (Out, Out).
  *   **Rights Assignment:** Alice decides (In, Out) vs (Out, Out) and (In, In) vs (Out, In); Bob decides (In, Out) vs (In, In) and (Out, Out) vs (Out, In). (Decentralized veto over own log).
  *   **Pareto Comparison:** Both prefer (In, In) > (In, Out), (In, In) > (Out, In), and (In, In) > (Out, Out).
  *   **Conflict:** Local rationality (avoiding "sole surveillance") drives both to veto, resulting in (Out, Out), which is Pareto-inferior to (In, In).

  **Structural Feature Analysis**
  The single structural feature doing the work is the **decentralized veto structure**. While the informational nature of the good allows for non-rivalrous consumption (both can benefit from the model), the paradox persists even with physical goods (as Sen showed); similarly, the absence of a planner is a condition of the setting, but the *mechanism* of failure is the veto itself. The decentralized veto encodes the Liberal principle (individual sovereignty over a personal sphere). If you remove this feature and replace it with a central authority mandated to maximize welfare, the authority selects (In, In) based on the Pareto condition, and the paradox collapses. The case does not revert to the classic physical goods formulation simply by changing the good; it reverts to a standard optimization problem by removing the veto. The paradox specifically relies on the *constraint* that local rights override global efficiency.

  **Defender of Minimal Liberalism Attack**
  A defender of minimal liberalism would challenge **the validity of the Pareto comparison across veto boundaries**. They would argue that Pareto efficiency cannot morally override protected individual rights; if Alice has a right to veto her log, the social choice mechanism is forbidden from selecting (In, In) over (Out, In) regardless of Bob's preferences, effectively treating rights as side-constraints rather than utility inputs. This challenge might succeed in preserving the deontological integrity of liberalism but fails to resolve the *impossibility* theorem: if both agents hold such rights and preferences remain meddlesome (caring about the other's sphere), no consistent social decision function exists that satisfies both conditions. The defender must therefore also argue that "meddlesome" preferences (caring about another's private data status) should be excluded from the Pareto aggregation entirely, restricting the domain of admissible preferences to save the system.
