prompt: |-
  i co-write a dramatized history podcast — real people, real events, invented dialogue — and we ship every two weeks, so these calls come up constantly and there's never more than a day or two for one, sometimes it's a rewrite at midnight in the edit. legal reads our scripts but they only care about living people and music clearance; once somebody's dead nobody's watching at all. it's got personal recently: my great-aunt ran a home for unmarried mothers in Cork in the 1950s, she left basically nothing behind — no diary, no letters, two signatures on documents — and I'm the one pushing to build a season around her while two cousins think it's a betrayal. so I need something I can read out loud to them, not just my gut.

  what I want is a decision procedure, not an essay. the question in the room is always some version of "can we put this in her mouth" or "can we show this happening", and I want ordered questions, what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands off to a person because the question is values rather than facts. ground it in whatever philosophy actually knows about what we owe people who are dead and can't be harmed in the ordinary sense — but no bibliographies, and don't build it on the law, the law is silent here.

  it has to handle scenes where the record is documented, silent, contested, or known to be otherwise, and it has to handle the four devices we definately lean on: compressed chronology, composite minor characters, "borrowed lines" (giving her a real line somebody else actually said, because it's better), and "silent scenes" (she's in the room, the record says nothing, we write what we think happened). we already tag every scene in the script with a certainty level 1–4; tell me whether that tag is doing any real work or just making us feel better.

  distinctions I don't want it to collapse: wronging her versus misrepresenting her; what's owed to her versus to my cousins versus to listeners who'll take the season as history; getting her actions wrong versus getting her character wrong; "could have happened" versus "probably happened" versus "what she'd want said". and I want it to be able to say: don't dramatize this one at all.

  it has to be runnable by a writers' assistant in under an hour, with no theory jargon in the checklist itself (a glossary is fine), and it should say which answers need my sign-off and which need the family's.

  then run it on three: the finale where we give her a speech assembled out of someone else's testimony; the scene of her signing a document we know she signed but not why, with invented voiceover of her thinking; and the cold open of our first season, allready aired and publicly defended by me, that I'm now worried was indefensible. I'd rather be told that last one's wrong than right. and tell me where the procedure will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** Co-writer of a dramatized history podcast (real people/events, invented dialogue). Bi-weekly schedule, tight deadlines.
      *   **Specific Conflict:** User wants to make a season about their great-aunt (ran a home for unmarried mothers in 1950s Cork). She left almost no record. Two cousins view this as a betrayal. User needs a tool to negotiate this.
      *   **Goal:** A *decision procedure* (checklist/flowchart style), not an essay. Needs to be readable aloud.
      *   **Constraints:**
          *   Grounded in philosophy of duties to the dead (posthumous interests, narrative identity), but *no jargon* in the checklist.
          *   Ignore legal (law is silent on dead people mostly).
          *   Handle four specific devices: Compressed chronology, Composite characters, Borrowed lines, Silent scenes.
          *   Evaluate the existing "Certainty Level 1-4" tagging system.
          *   Maintain specific distinctions (wronging vs. misrepresenting, owed to whom, action vs. character, probability vs. desire).
          *   Must allow for a hard "Don't dramatize this."
          *   Runnable by an assistant in <1 hour.
          *   Identify who needs sign-off (User vs. Family).
          *   **Task:** Create the procedure, then run it on three specific cases (Finale speech, Signing scene/voiceover, Aired Cold Open), and finally identify where the procedure itself might fail.

  2.  **Philosophical Grounding (Internal Mental Sandbox):**

      *   *What do we owe the dead?* They can't be harmed in the physical sense, but their *narrative identity* can be damaged. Joel Feinberg's "posthumous interests" is relevant (interests survive death). Marya Schechtman's "narrative self-constitution" is relevant (we are the stories told about us).
      *   *What do we owe the living (family)?* Respect for grief, privacy, shared memory.
      *   *What do we owe the audience?* Truthfulness about the *nature* of the truth (not necessarily factual accuracy, but epistemic honesty).
      *   *The Core Tension:* Historical fidelity vs. Dramatic truth vs. Familial respect.
      *   *The "Betrayal":* Is it betrayal to speak for the silent? Or is it betrayal to leave them silent?
      *   *Key Distinction:* *Wronging* (violating a right/duty) vs. *Misrepresenting* (getting facts wrong). You can misrepresent without wronging (if the error is trivial), but you can wrong without misrepresenting (if you reveal a painful truth they wanted hidden).

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Structure:* Needs to be step-by-step. Yes/No gates.
      *   *Tone:* Practical, firm, ethical but not preachy.
      *   *Sections:*
          1.  The Hard Stops (Rights/Privacy).
          2.  The Evidence Check (Fact vs. Fiction).
          3.  The Character Check (Identity vs. Action).
          4.  The Stakeholder Check (Family vs. Audience).
          5.  The Device Check (Specific tropes).
          6.  The Verdict (Go/No-Go/Sign-off).
      *   *Addressing the 1-4 Tag:* I need to evaluate if this is useful. Usually, these tags are "epistemic washing." They make writers feel safe but don't tell the audience *what kind* of uncertainty it is. I should suggest modifying them or noting their limitation.
      *   *Sign-off:* Distinguish between "Creative Call" (User) and "Ethical/Familial Call" (Family/User joint).

  4.  **Refining the Distinctions:**

      *   *Wronging vs. Misrepresenting:* Focus on *intent* and *impact*. Did we change her to fit a plot (misrepresent/wrong) or to reveal a deeper truth supported by evidence (misrepresent/possibly okay)?
      *   *Owed to whom:* Family gets veto on *private* shame. Audience gets honesty on *public* history. Subject gets fidelity to *core character*.
      *   *Probability:* "Could have" is for fiction. "Probably" is for drama. "What she'd want" is speculative and dangerous.

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Finale Speech (Borrowed Lines).*
          *   Issue: Ventriloquism.
          *   Test: Does it align with her known views? Is it attributed?
          *   Likely Outcome: High risk. Needs family sign-off.
      *   *Case 2: Signing Document (Silent Scene + Voiceover).*
          *   Issue: Internal state invention.
          *   Test: Is the *action* true? Is the *motivation* speculative?
          *   Likely Outcome: Voiceover is the danger zone. Action is fine.
      *   *Case 3: Aired Cold Open (Retrospective Doubt).*
          *   Issue: Past work, new ethical standard.
          *   Test: Apply current protocol to past work.
          *   Likely Outcome: If it fails now, admit it. Don't defend the indefensible.

  6.  **Identifying Procedure Failure Modes:**

      *   Where will this checklist break?
      *   *Time pressure:* Midnight rewrites.
      *   *Family dynamics:* Cousins might say "no" to everything.
      *   *The "Truth" Trap:* History is never 100% certain.
      *   *The User's Bias:* The user *wants* this story. The procedure might be bent to justify it.

  7.  **Final Review against Constraints:**

      *   *No bibliographies?* Check.
      *   *No theory jargon in checklist?* Check (keep terms like "narrative identity" for the intro/glossary only).
      *   *Runnable in 1 hour?* Keep it concise.
      *   *Read aloud?* Sentence structure should be spoken-word friendly.
      *   *Address the 1-4 tag?* Yes.
      *   *Address the specific devices?* Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "ask the family." The user says the family thinks it's a betrayal. The procedure needs to handle *conflict* with the family, not just defer to them. It needs to define *when* family veto counts.
      *   *Correction on Philosophy:* Keep it implicit. The "Duty of Fidelity" is the core concept.
      *   *Correction on Tags:* The 1-4 tag is likely "Confidence in Fact." It doesn't measure "Ethical Risk." I need to propose an "Ethical Risk" tag alongside it.

  9.  **Final Polish:** Ensure the tone is empathetic but rigorous. The user is in a tough spot personally. The tool should protect them from themselves as much as from the cousins.

  *(Self-Correction on the "Cold Open"):* The user says "I'd rather be told that last one's wrong than right." I need to be honest in the simulation. If the protocol flags it as a violation, I must say so.

  *(Self-Correction on "Borrowed Lines"):* This is a specific trope. The protocol needs a specific gate for "Attribution."

  Let's build the "Protocol for Posthumous Dramatization."

  *Step 1: The Harm Check (Living vs Dead).*
  *Step 2: The Core Identity Check (Character vs Plot).*
  *Step 3: The Evidence Gap (Silence vs. Invention).*
  *Step 4: The Device Check.*
  *Step 5: The Stakeholder Veto.*

  Okay, ready to write.
answer: |-
  ## The Protocol for Posthumous Dramatization

  **Purpose:** To determine whether a specific scene, line, or characterization of a deceased subject is ethically permissible for dramatized audio history.
  **Runtime:** 45–60 minutes.
  **Operator:** Writers' Assistant or Lead Writer.
  **Sign-off Required:** Lead Writer (Creative), Subject's Living Kin (Ethical/Familial).

  **Glossary (For Internal Use Only):**
  *   **Narrative Identity:** The story that makes a person who they are. Damaging this is "wronging" them, even if they are dead.
  *   **Epistemic Honesty:** Telling the audience how we know what we know.
  *   **Posthumous Interest:** Things a person cared about while alive that continue to matter after death (reputation, secrets, relationships).

  ---

  ### Part 1: The Hard Stops (Automatic "No")
  *If any answer is YES, stop. Do not dramatize. Do not pass Go.*

  1.  **Does this depiction reveal a verified secret the subject actively concealed during their life (e.g., illegitimate children, hidden crimes, medical diagnoses) that is not already public record?**
      *   *Yes:* **STOP.** (Duty to Privacy overrides public interest).
      *   *No:* Continue.
  2.  **Does this depiction directly contradict a verified fact that defines their public legacy (e.g., claiming they were present when they were documented elsewhere)?**
      *   *Yes:* **STOP.** (This is falsification, not dramatization).
      *   *No:* Continue.
  3.  **Does this depiction cause demonstrable, specific harm to living descendants (e.g., exposing them to harassment, revealing their own private history)?**
      *   *Yes:* **STOP.** (Duty to the Living overrides historical curiosity).
      *   *No:* Continue.

  ### Part 2: The Core Identity Check (Character vs. Plot)
  *This distinguishes "getting actions wrong" from "getting character wrong."*

  4.  **Is the invention serving the plot (making the scene work) or the person (revealing who they were)?**
      *   *Plot:* High Risk. Requires Lead Writer Sign-off.
      *   *Person:* Lower Risk. Continue.
  5.  **If we strip away the invented dialogue/action, does the remaining factual skeleton still support the emotional truth of the scene?**
      *   *No:* **STOP.** (You are building a house on air).
      *   *Yes:* Continue.
  6.  **Does this action align with their known values, even if the specific event is unrecorded?**
      *   *Example:* She was known for stern mercy. A scene showing stern mercy is permissible. A scene showing cruel negligence is not.
      *   *No:* **STOP.** (This is character assassination).
      *   *Yes:* Continue.

  ### Part 3: The Evidence Gap (Handling Silence)
  *This addresses the "Silent Scenes" and "Voiceover."*

  7.  **Is the record silent because it was lost, or because it was never created?**
      *   *Lost:* Invention is lower risk (it likely existed).
      *   *Never Created:* Invention is high risk (you are creating memory where there was none).
  8.  **For "Silent Scenes" (Subject present, record silent): Are we depicting an internal state (thoughts/feelings) or an external action?**
      *   *Internal State:* Requires "Subjective" tag in script. Requires Family Sign-off.
      *   *External Action:* Permissible if consistent with Part 2.
  9.  **For "Voiceover/Thinking": Is the thought process deducible from later actions?**
      *   *Yes:* Permissible as interpretation.
      *   *No:* **STOP.** (Do not put thoughts in a dead person's head without evidence).

  ### Part 4: The Device Check
  *Specific rules for your four common tropes.*

  10. **Compressed Chronology:** Does moving Event B to follow Event A change the *causal* understanding of why Event B happened?
      *   *Yes:* **STOP.** (This creates false history).
      *   *No:* Permissible. Tag as "Time Compressed."
  11. **Composite Characters:** Does merging two real people into one obscure a conflict of interest or a betrayal that actually happened?
      *   *Yes:* **STOP.** (This hides moral complexity).
      *   *No:* Permissible. Tag as "Composite."
  12. **Borrowed Lines (Giving Subject words spoken by another):** Is the sentiment uniquely attributable to the Subject's known philosophy, even if the words are another's?
      *   *Yes:* Permissible *only if* disclosed in show notes or end credits.
      *   *No:* **STOP.** (This is ventriloquism).
  13. **Certainty Tags (Your existing 1–4 system):**
      *   *Evaluation:* The 1–4 tag is currently **insufficient**. It measures *confidence*, not *consequence*.
      *   *Fix:* Keep 1–4 for factual confidence. Add a **Letter Code (A–D)** for Ethical Risk.
          *   **A:** Public Record (Low Risk).
          *   **B:** Inferred from Evidence (Medium Risk).
          *   **C:** Invented for Narrative (High Risk).
          *   **D:** Contradicts/Overwrites Memory (Critical Risk).
      *   *Rule:* Any scene tagged **C** or **D** requires Family Consultation.

  ### Part 5: The Stakeholder Veto (Who Decides?)
  *This distinguishes what is owed to whom.*

  14. **Is the objection from Family based on Fact ("That didn't happen") or Feeling ("That feels wrong")?**
      *   *Fact:* Family wins. Correct the script.
      *   *Feeling:* Lead Writer decides, *unless* it violates Part 1 (Hard Stops).
  15. **Is the invention necessary to tell the story, or just convenient?**
      *   *Convenient:* Cut it.
      *   *Necessary:* Proceed to Part 6.

  ### Part 6: The Verdict

  *   **GREEN:** Proceed. Tag script.
  *   **AMBER:** Proceed only with Lead Writer Sign-off. Add host narration clarifying the invention.
  *   **RED:** Do Not Dramatize. Narrate the gap instead. (e.g., "We don't know what she thought here, but we know what she did next.")

  ---

  ## Simulation: Running the Protocol on Your Three Cases

  ### Case 1: The Finale Speech (Borrowed Lines)
  *Scenario:* You give your great-aunt a speech assembled from testimony given by someone else (a survivor? a colleague?) because it fits the emotional arc.
  *   **Part 1 (Hard Stops):** No verified secrets revealed. No factual contradictions. No harm to living (assuming the original speaker is dead or consents). **Pass.**
  *   **Part 2 (Identity):** Does the sentiment align with her known values? If yes, **Pass.** If the speech makes her more eloquent or radical than she was, **Fail.**
  *   **Part 4 (Device - Borrowed Lines):** Rule 12 applies. Is the sentiment uniquely hers?
      *   *Risk:* High. This is ventriloquism.
      *   *Requirement:* Must be disclosed in show notes/credits.
      *   *Sign-off:* **Family Sign-off Required.** This is the exact thing cousins will call "betrayal."
  *   **Verdict:** **AMBER.** You can do this *only if* you disclose it explicitly in the episode ("Words drawn from the testimony of...") and the cousins agree the sentiment is true to her. If they veto, you must narrate the testimony rather than put it in her mouth.

  ### Case 2: The Signing Scene (Silent Scene + Voiceover)
  *Scenario:* She signs a document. We know she signed it. We don't know why. You invent voiceover of her thinking.
  *   **Part 1 (Hard Stops):** **Pass.**
  *   **Part 3 (Evidence Gap):** Rule 8 & 9.
      *   *Action:* Signing is factual. **Pass.**
      *   *Voiceover:* This is internal state. Rule 9 asks: Is the thought process deducible?
      *   *Analysis:* If the document is a standard admission form, thinking "I hope this helps" is deducible. If the document is controversial and you invent "I know this is wrong but I must," that is speculative.
  *   **Part 4 (Tags):** This is a **C** (Invented for Narrative) ethically, even if **1** (Factually Certain) on the signature.
  *   **Verdict:** **AMBER/RED.**
      *   *Action:* Green.
      *   *Voiceover:* **Red.** Do not put specific thoughts in her head regarding *motive* without evidence.
      *   *Fix:* Remove the voiceover. Let the silence of the signing carry the weight. Or have a narrator say, "We don't know what she thought as she signed, but the pen didn't hesitate."

  ### Case 3: The Aired Cold Open (Retrospective Doubt)
  *Scenario:* Season 1, already aired. You defended it. Now you worry it was indefensible.
  *   **Part 1 (Hard Stops):** Apply current knowledge. Did it reveal secrets? Harm living?
  *   **Part 2 (Identity):** Did it get her character wrong to make a better hook?
  *   **Part 6 (Verdict):** You asked to be told if it's wrong.
      *   *Protocol Result:* If the Cold Open relied on **Borrowed Lines** without disclosure, or **Silent Scenes** that assigned her motives now known to be speculative, the Protocol flags it as **RED**.
      *   *Action:* You cannot un-air it. But you can issue a correction note in the feed or the new season's preamble. "In Season 1, we dramatized X. We now believe the evidence for that was thinner than we stated."
      *   *Ethical Duty:* Honesty to the audience (Epistemic Honesty) outweighs pride in past work. If the Protocol says it's a violation now, admit it.

  ---

  ## Where This Procedure Will Misfire

  1.  **The "Necessary" Trap (Writer's Bias):**
      *   *Failure Point:* Part 5, Question 15 ("Is the invention necessary?").
      *   *Why:* You are the writer. You will always believe the invention is necessary for the *art*. The protocol relies on your honesty to distinguish "necessary for the story" vs. "necessary for the truth."
      *   *Mitigation:* Require the Assistant to ask: "Can this scene work if she says nothing?" If yes, the invention wasn't necessary.

  2.  **The Family Veto Paradox:**
      *   *Failure Point:* Part 5, Question 14.
      *   *Why:* Your cousins feel betrayal. That is a "Feeling," not a "Fact." The protocol says Lead Writer decides on feelings. But if you override them, you confirm their betrayal. If you defer to them, you may sanitize history.
      *   *Mitigation:* The protocol cannot solve this. It only isolates it. If the family veto is based on "Feeling," you must decide if the relationship is worth more than the scene. The protocol forces you to label it "Family Veto: Emotional," so you know what you are breaking.

  3.  **The Midnight Rewrite:**
      *   *Failure Point:* Runtime.
      *   *Why:* At 2 AM, you won't run the checklist. You will guess.
      *   *Mitigation:* The **Certainty/Risk Tag (1-4 + A-D)** must be filled out *before* the script is sent to legal/edit. If a scene comes in at 2 AM without a tag, it is automatically rejected until tagged. This forces the pause.

  4.  **The "Good Lie":**
      *   *Failure Point:* Part 2, Question 6 (Known Values).
      *   *Why:* Sometimes the truth is messy. She might have been kind *and* cruel. The protocol pushes for consistency ("aligns with known values"). This risks flattening her into a hero or villain.
      *   *Mitigation:* Add a note to Question 6: "Consistency includes known contradictions." If she was known to be volatile, a volatile scene is accurate even if unflattering.

  ## Final Recommendation on the 1–4 Tag
  Your current 1–4 tag is doing **cosmetic work**. It tells the audience "We aren't sure," but it doesn't tell them "We made this up."
  *   **Keep 1–4** for Factual Confidence.
  *   **Add A–D** for Ethical Invention.
  *   **Publish the Key:** Put the legend in your show notes. "Scene Tag 3-C means: Historically uncertain, Ethically Invented." This transfers the judgment to the listener, which is where the duty of Epistemic Honesty is fulfilled.

  **Sign-off Matrix:**
  *   **Tags 1-2 / A-B:** Lead Writer only.
  *   **Tags 3-4 / C:** Lead Writer + Assistant Review.
  *   **Tags D / Any Part 1 Hard Stop:** Family Consultation Required. If Family objects, Scene is Cut.
