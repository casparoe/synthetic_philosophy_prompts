answer: |-
  You have stumbled directly onto one of the most famous problems in the philosophy of action, though your app design context gives it a fresh, practical edge.

  Here is the carving you are looking for.

  ### 1. The Name of the Pattern
  The specific logical structure of **Case One** has a proper name: **Kavka's Toxin Puzzle**.

  In 1983, Gregory Kavka proposed exactly your scenario: a billionaire offers you a million dollars if you *intend* at midnight to drink a toxin tomorrow that will make you sick. You get the money for the intention, not the drinking. Once you have the money, you have no reason to drink. But if you know you won't drink, you cannot genuinely intend to.

  If you want a single label for the broader phenomenon you are describing (covering Cases 1, 2, and the Belief question), call it **The Reflexivity Barrier**. It occurs when the reason for adopting a mental state undermines the possibility of holding that state.

  ### 2. The Carving: Three Distinct Failures
  You asked if this is one thing or several. It is three distinct mechanisms that look similar from the inside but break at different joints.

  **A. The Toxin Gap (Case One)**
  *   **Structure:** Reward for *Intention*, decoupled from *Action*.
  *   **Failure Mode:** **Rational Incoherence.**
  *   **Why it breaks:** Intention is, by definition, a commitment to act. If the reward is given for the commitment *before* the act, and the act has no independent value (or negative value), the agent knows they will not act. You cannot intend to do what you know you will not do. The offer makes the intention a lie, and you cannot lie to yourself about your own intentions.
  *   **Verdict:** Logically impossible.

  **B. The Crowding Effect (Case Two)**
  *   **Structure:** Reward for *Intention*, coupled to *Action*, but paid *Ex-Ante*.
  *   **Failure Mode:** **Motivational Contamination.**
  *   **Why it breaks:** This is **Motivational Crowding Out**. At 6pm, the money is sunk. The only reason left to run is "because I want to." But the existence of the earlier payment signals that the activity is *instrumental* (a means to money) rather than *intrinsic* (worth doing for itself). The payment colonizes the motive. You aren't failing to intend because it's irrational (like Case 1); you are failing because the "genuine want" has been displaced by a "transaction."
  *   **Verdict:** Psychologically unstable.

  **C. The Commitment Lock (Case Three)**
  *   **Structure:** Penalty for *Inaction*, coupled to *Action*, enforced *Ex-Post*.
  *   **Failure Mode:** None (It works).
  *   **Why it works:** This is a **Commitment Device**. Crucially, the incentive (the loss of $200) is still active at the moment of action. It does not require you to manufacture a "genuine want" to run; it simply makes running the rational choice at 6pm. It aligns your *Ex-Ante* self (who wants to be fit) with your *Ex-Post* self (who wants to stay on the couch).
  *   **Verdict:** Structurally sound.

  ### 3. The Boundary: Reason Persistence
  You asked where the boundary lies between offers that poison the state and those that produce it.

  The boundary is **Reason Persistence**.
  *   **Poison:** The reason for intending disappears or becomes invalid at the time of acting. (Case 1: Reason is money, but money is secured without acting. Case 2: Reason is money, but money is already spent).
  *   **Produce:** The reason for intending remains a valid reason for acting at the time of execution. (Case 3: The reason is avoiding loss, which is still true at execution time).

  For an intention to be stable, the agent must be able to foresee that the reasons supporting the intention *now* will still support the action *later*. If the incentive creates a gap between "Why I decide" and "Why I do," the intention collapses.

  ### 4. Belief vs. Intention
  You asked if it matters that the state is an intention rather than a belief. **Yes, it is a different brokenness.**

  *   **Belief (Doxastic Involuntarism):** You cannot believe at will because belief aims at *truth*. If I offer you money to believe the sky is green, you cannot do it because your cognitive machinery is wired to track evidence, not payoffs. The offer is irrelevant to the truth condition.
  *   **Intention (Intentional Involuntarism):** You cannot intend at will (in the Toxin case) because intention aims at *action*. The offer is relevant to the action, but it severs the link between decision and execution.

  **The Difference:**
  *   Paying for belief fails because it ignores the **norm of truth**.
  *   Paying for intention (Toxin style) fails because it ignores the **norm of consistency**.

  ### 5. The Variant: What is that move?
  In your variant (family watching), you noted: *"You didn't get control over your own mind, you changed the world so that the decision became the kind of thing there's a reason for."*

  This move is called **Precommitment via Stakeholding** (or a **Ulysses Contract**).

  It is not a solution to the puzzle of "intending at will." It is a dissolution of the puzzle. You stop trying to incentivize the *mental state* and start incentivizing the *conditions of the action*.
  *   **Toxin Case:** Payoff for *Thinking* X.
  *   **Variant:** Payoff for *Doing* X (where "Doing" includes the social performance).

  By bringing the family in, you have added a cost to *not* taking the pill (shame/disappointment) that exists at the moment of action. You have turned a Case 1 (Toxin) into a Case 3 (Commitment Lock). You made the intention **Transparently Rational**.

  ### Summary for Design
  If you are carving this for reward mechanics:

  1.  **Never reward the intention.** (Avoids The Toxin Gap).
  2.  **Be careful rewarding the action Ex-Ante.** (Avoids Motivational Crowding).
  3.  **Penalize inaction Ex-Post.** (Utilizes The Commitment Lock).
  4.  **If you must change the mind, change the world first.** (Use Stakeholding/Precommitment to make the action rational at the moment of execution).

  The pattern doesn't have one word, but the principle is **Diachronic Consistency**: A valid incentive must remain a valid reason at every point between the decision and the deed.
