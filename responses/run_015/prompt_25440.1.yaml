      *   *Better Twist:* Let's make it about *timing and agency*. Jordan is about to present the work themselves. If Alex praises them *before*, it steals the thunder or makes it look like Alex is endorsing them patronizingly.
      *   *Best Twist (Holism):* The feature is "Highlighting a specific person's contribution." Usually good (fairness). In this context, the project was a *collective rescue effort* where highlighting one person implies others failed. Or, Jordan specifically asked *not* to be highlighted because they are planning to leave the company, and highlighting them now creates awkwardness.
      *   *Let's try the "Secret Departure" angle.*
      *   *Scenario:* Jordan is a junior developer. They fixed a critical bug.
      *   *Generalist Rule:* "Give credit where credit is due." (Fairness/Recognition).
      *   *Particularist Context:* Jordan has quietly resigned and is leaving in two days. Public praise now binds them to the team emotionally, creates awkwardness with colleagues who stay, or makes their departure look like a betrayal after being "starred."
      *   *Wait, is that strong enough?* Maybe not.
