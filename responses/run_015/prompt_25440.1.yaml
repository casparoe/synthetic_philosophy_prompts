      *   *Generalist Principle:* "Openness prevents debt and shame; acknowledge help so reciprocity is possible."
      *   *Particularist View:* Mr. Henderson's pride is the central moral fact. Acknowledging the help turns a gift into a transaction, damaging his dignity.
      *   *Wait, this is close to "Don't embarrass people."* That's a rule too.
      *   *I need a case where the Generalist rule is about something else.*
      *   *Let's try: The "Honest Feedback" case.*
