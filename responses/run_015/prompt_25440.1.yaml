      *(Self-Correction)*: I need to ensure the Generalist doesn't just say "Okay, I have a higher rule about Culture." The Generalist must insist that *Individual Contribution* is an invariant reason for *Individual Recognition*. The Particularist says *Individual Contribution* can be a reason for *Collective Silence*.

      Let's write it.

