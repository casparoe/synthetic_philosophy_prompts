          2.  Generalist's rule must be robust/reflective (not a straw man like "never lie").
          3.  Particularist's reasoning must be substantive (not just "it depends").
          4.  Disagreement driven by a specific structural feature (a feature that usually has one valence but flips in this context).
      *   **Output Requirements:**
          *   Present the scenario.
          *   State each view's verdict and reasoning.
          *   Identify the key separating feature.
          *   Explain the counter-attack from the "losing" side.
          *   Analyze what happens if the key feature is removed/flipped.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Generalism:* Moral reasons are codifiable. If $X$ is a reason for action $A$ in case 1, it is a reason for $A$ in case 2, unless overridden by a stronger principle. Principles have invariant valence (mostly).
      *   *Particularism (e.g., Jonathan Dancy):* Moral reasons are holistic. A feature that is a reason for action in one context might be no reason at all, or even a reason *against* the action, in another context. No finite set of rules can capture this holism.
      *   *The Crux:* I need a feature that is typically positive (or negative) but becomes neutral or negative (or positive) due to the specific context, without violating a higher-order rule.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: Lying to protect feelings.* (Too cliché).
      *   *Idea 2: Keeping a promise when it's inconvenient.* (Often leads to "prima facie duties," which generalists can handle).
      *   *Idea 3: Gift giving.* (Giving a gift is usually good. What if it creates an obligation?)
      *   *Idea 4: Workplace feedback.* (Honesty is good. What if honesty undermines a specific pedagogical goal?)
      *   *Idea 5: Sharing credit.* (Usually good. What if it embarrasses the recipient?)

      *Selection:* Let's go with a **Workplace/mentorship scenario involving "Sharing Credit."**
      *   *Why?* It's ordinary. It involves professional ethics. The principle "Acknowledge others' contributions" is a very strong, good general rule. But context can make acknowledgment harmful or performative.

  4.  **Developing the Scenario (The "Public Praise" Case):**
