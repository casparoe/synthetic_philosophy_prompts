      *Final Choice:* **The "Star Player" Scenario in a Collaborative Office.**
      *   *Context:* A flat-hierarchy cooperative.
      *   *Action:* Manager wants to give a bonus to the hardest worker.
      *   *Generalist Rule:* "Distribute rewards proportionally to contribution." (Justice/Fairness).
      *   *Particularist Context:* In *this* specific co-op, the explicit tracking of individual output destroys the collaborative trust required for the work to function. The feature "high individual contribution" usually warrants reward. Here, highlighting it undermines the system that made the contribution possible.
      *   *Why this works:* The Generalist sees "Contribution" as an invariant reason for "Reward." The Particularist sees "Contribution" as a reason for "Reward" only within a system that accepts individual metrics. In this system, "Contribution" is a reason for *quiet gratitude*, not *public reward*.

  6.  **Fleshing out the details:**
      *   *Scenario:* A small architecture firm that prides itself on "collective authorship."
      *   *Character:* Elena (Senior Partner) and Marcus (Junior Architect).
      *   *Event:* Marcus pulled an all-nighter to save a deadline.
      *   *Generalist Rule:* "Proportional Recognition." (Meritocracy).
      *   *Particularist View:* The firm's ethos is "No Heroes." Highlighting Marcus breaks the social contract of the firm.
      *   *Key Feature:* **The public attribution of success.**
      *   *Normal Valence:* Positive (Justice/Morale).
      *   *Contextual Valence:* Negative (Corrodes culture/Trust).

  7.  **Addressing the Output Requirements:**
      *   *Scenario:* Clear and ordinary.
      *   *Reasoning:* Walk through Generalist (Principle of Merit) vs. Particularist (Holism of Culture).
      *   *Key Feature:* Public Attribution.
      *   *Counter-attack:* Generalist says "Then your culture is unjust." Particularist says "Your justice is mechanical."
      *   *Flip:* If the firm was a standard corporation, they agree.

  8.  **Refining the "Generalist's Rule":**
      *   To make it a *strong* generalist case, the rule shouldn't just be "Meritocracy." It should be "Sustaining Motivation."
      *   Rule: "To sustain long-term effort, agents must see a link between their input and recognition."
      *   This makes the Generalist's point psychological and practical, not just ideological.
      *   The Particularist argues: In *this* group, the link between input and recognition is *collective*, not individual. Breaking that link (by individualizing it) kills motivation.

  9.  **Final Polish:** Check against constraints.
