  ***

  **JOINT STATEMENT ON DIACHRONIC RATIONALITY & MONEY PUMPS**
  **Adversarial Collaboration Draft**

  **1. Agreed Claims**
  Both camps sign off on the following formal and structural premises. We agree to disagree on what they *mean*, not what they *are*.

  1.  **Formal Structure:** We agree that a standard Dutch Book argument relies on a cycle of preferences (A ≻ B, B ≻ C, C ≻ A) combined with a willingness to pay a small cost to switch options at each step. Mathematically, this results in a net loss of resources with no change in final holdings.
  2.  **Definition of Exploitation:** We agree that "exploitation" occurs when an agent ends a sequence with strictly fewer resources than they started, solely due to their own preference-guided choices interacting with an external offerer.
  3.  **Role of Continuity:** We agree that psychological continuity (memory, intention, character) is the variable that determines whether the loss is attributed to one agent or multiple successors. Neither side claims continuity is irrelevant; we dispute the threshold required for rational obligation.
  4.  **Normative Force:** We agree that if a single, unchanging agent is proven to exist across time t1→t3, diachronic consistency is neccessary for instrumental rationality. The dispute is whether that agent exists.

  **2. Disagreements Table**

  | Feature | Camp 1: Diachronic Coherence | Camp 2: Temporal Pluralists |
  | :--- | :--- | :--- |
  | **Preference Reversal** | A defect in rational planning. Indicates a failure to bind future actions. | Often evidence of growth, learning, or context shifts. Not inherently erroneous. |
  | **The "Pump" Loss** | Proof of irrationality. You paid to go in a circle. | Proof of metaphysical error. The "you" who paid isn't the "you" who benefitted. |
  | **Personal Identity** | Assumes a unified persisting self is required for max utility. | Assumes a succession of stage-selves. Identity is a gradient, not a binary. |
  | **Obligation** | Past selves can bind future selves via rational commitment. | Future selves are sovereign. Past commitments are just advice. |
  | **Exploitation View** | The agent is being money-pumped. | The earlier stage-self is being taxed by the later stage-self. |

  **3. The Cruxes**
  The debate stalls on two specific points. Resolving these would collapse the disagreement.

  *   **Crux A: The Boundary of the Agent.** Does rationality apply to the *life* or the *moment*? Camp 1 says optimizing the life is the only definition of rationality. Camp 2 says optimizing the moment is all a self *can* do, and "life optimization" is a fictional construct.
  *   **Crux B: The Value of Stability.** Is stability intrinsically valuable? Camp 1 says yes, because it prevents leakage. Camp 2 says no, stability is just inertia; flexibility has value even if it costs resources.

  **4. Niche Scenario: The Recursive Escrow Pump**
  We agreed to test our views against this specific case. It isolates the variable of time-compound loss.

  *   **The Setup:** An agent holds an asset in escrow. Every 10 years, they are offered a chance to switch investment strategies. The switch costs 1% of the portfolio value.
  *   **The Shift:** At t0, they prefer Strategy A. At t10, due to normal aging/risk tolerance shift, they prefer B. At t20, they prefer C. At t30, they prefer A again.
  *   **The Kicker:** The 1% switching fee is borrowed against the portfolio at compound interest. Over a 60-year lifespan, the fees compound exponentially, draining 40% of total value compared to a static holder.
  *   **Agreement:** Both sides agree this scenario bears directly on the debate. It's not a quick pump; it's a slow bleed.

  **Camp 1 Prediction (Coherence):**
  *   **Verdict:** Deep Irrationality.
  *   **Reasoning:** The agent had ample time (decades) to recognize the cycle. The compound interest makes the cost visible ex-ante. Failing to bind the future self here is a catastrophic planning error.
  *   **Settling Feature:** **Interest Rate > Drift Rate.** If the financial cost of switching outpaces the natural rate of preference drift, rationality demands locking in.

  **Camp 2 Prediction (Pluralists):**
  *   **Verdict:** Normal Aging / Sovereign Updates.
  *   **Reasoning:** The preference shifts are authentic responses to changing life stages. The compound interest is an external penalty, not an internal contradiction. The t0 self cannot morally constrain the t30 self to suffer a strategy they hate.
  *   **Settling Feature:** **Drift Rate Authenticity.** If the preference shift reflects genuine psychological change (not random noise), the cost is justified. The "loss" is the price of autonomy for each stage-self.

  ***

