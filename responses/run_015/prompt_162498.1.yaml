answer: |-
  **The Compliance Bureau**

  The Compliance Bureau audits firms. Yesterday, algorithms assigned your firm a Risk Profile (Alpha or Beta) based on past filings, unknown to you. Policy: All Alpha firms are fined $50,000. This standing policy is credible because enforcing it against current Alphas deters future firms from adopting Alpha-generating practices, yielding net revenue and compliance gains exceeding enforcement costs. The Bureau never waives fines for Alpha firms; waiving would undermine the policy's deterrent value for the broader class, costing more in future non-compliance than saved in current enforcement.

  You may submit a $5,000 "Voluntary Compliance Bond" today. Historical data shows 90% of Bond-submitters are Profile Beta (unfined). 90% of non-submitters are Profile Alpha (fined). This correlation arises from a common psychological cause: conscientiousness drives both past filing quality (Profile) and current Bond submission. Your current decision cannot alter yesterday's Profile.

  If fined, the Bureau collects automatically. You decide now: Submit Bond?

  ***

  **Verdicts**

  **Causal Decision Theory (CDT):** The Profile is a fixed fact of the past. Submitting the Bond costs $5,000 and causally influences nothing regarding the fine. Expected utility is maximized by keeping the $5,000. **Verdict: Refuse.**

  **Evidential Decision Theory (EDT):** Submitting the Bond is strong evidence ($90\%$) that you are Profile Beta and will avoid the $50,000 fine. Refusing is strong evidence you are Alpha.
  $EU(\text{Pay}) \approx -5k - (0.1 \times 50k) = -10k$.
  $EU(\text{Refuse}) \approx 0 - (0.9 \times 50k) = -45k$.
  **Verdict: Pay.**

  **Functional Decision Theory (FDT):** FDT asks whether the output of your decision procedure subjunctively determines the fine. The Profile was fixed by past filings, independent of your current procedure's output. There is no logical dependence. FDT aligns with CDT. **Verdict: Refuse.**

  **Updateless Policy:** Since the Profile was fixed before the decision node and no prior precommitment could have altered the past record (Constraint 5), ex ante selection changes nothing.

  **The Divergence Feature**
  EDT diverges because it treats the **bare statistical correlation** between action and state as actionable, whereas CDT/FDT require causal or subjunctive dependence.

  **Removing the Feature**
  1.  **Victim reads file:** The state is known. The correlation conditional on knowledge vanishes. EDT joins CDT/FDT (Refuse).
  2.  **Retaliator models procedure:** If the Profile were generated by simulating your current decision (Newcomblike), the state would depend subjunctively on the output. FDT would join EDT (Pay), but via dependence, not correlation.

  **Strongest Reply for EDT**
  In opaque environments where agents lack access to the causal structure but possess robust historical correlations, EDT maximizes actual realized utility. Ignoring evidence of survival because it lacks causal leverage is maladaptive when the correlation is reliable; the world rewards those who act as the type that wins, regardless of why.
