answer: |-
  You must sacrifice either the agent's ability to rationally unwind the disposition ex-post or the driver's capacity to detect strategic acquisition, because ex-ante credibility and ex-post reversibility cannot be jointly satisfied.

  ### Desiderata for a Theory of Rational Irrationality

  | Requirement | Verdict | Consideration |
  | :--- | :--- | :--- |
  | **1. Relata** | Genuine | A theory must specify whether rationality evaluates acts, plans, or dispositions; switching relata mid-argument is cheating, though shifting from act-to-disposition is the only way to solve the puzzle. |
  | **2. Vehicle** | Genuine | The mechanism matters: false beliefs leak into other decisions (costly), whereas dispositions or preferences can be context-sensitive; a theory must explain why the vehicle doesn't corrupt unrelated choices. |
  | **3. Leakage/Scope** | Genuine | The disposition must trigger for the hitchhiker case but not for blackmailers or waiters; a theory that makes you a universal sucker is practically useless. |
  | **4. Creepy-Driver** | Genuine | This is the hardest constraint: if the driver sees the disposition was strategically acquired, she won't trust it; the theory must explain how a disposition can be chosen yet appear non-strategic. |
  | **5. Unwind** | Genuine (but fatal) | Tests stability: if you can rationally remove the disposition once in town, the driver should have anticipated this; requiring this makes the disposition incredible. |
  | **6. External-Commitment** | Prejudice | If escrow solves the problem, 'rational irrationality' is merely a placeholder for missing commitment technology; this is a domain constraint, not a test of the psychology. |
  | **7. One-shot vs Repeated** | Genuine | If the solution relies on reputation (iterated games), it fails the one-shot case; the theory must work even if you never see the driver again. |
  | **8. First vs Third Personal** | Genuine | A normative theory must guide action; saying "it would be better if she were disposed" is useless if the agent cannot cultivate that disposition from the inside. |

  ### Conflicts and Trade-offs

  There are two pairs of requirements that cannot be jointly satisfied without significant philosophical contortion.

  **1. Credibility (Creepy-Driver) vs. Revisability (Unwind)**
  To satisfy the driver, your disposition must be stable and not merely a calculated mask; to satisfy ex-post rationality, you must be able to discard the disposition once the benefit (life saved) is secured. If you can unwind the disposition rationally, the driver knows you will, rendering your promise incredible. If you cannot unwind it, you are stuck paying the £1000 ex-post, which violates standard act-rationality.
  *   **Resolution:** Drop the **Unwind** requirement. If the disposition is rationally adopted ex-ante, maintaining it ex-post is part of the package; demanding you be able to reverse it undermines the credibility needed to get the ride.

  **2. Strategic Acquisition vs. Non-Strategic Appearance**
  You must be able to acquire the disposition on purpose (First-Personal), but the driver must not see it as a purposeful acquisition (Creepy-Driver). This suggests a requirement for self-deception or a specific cognitive architecture that hides its own wiring.
  *   **Resolution:** This suggests 'rational irrationality' is not one phenomenon. It is either **self-deception** (you hide the strategy from yourself) or **constitutional change** (you actually become a different kind of agent).

  **The Single Most Work-Doing Requirement**
  The **Creepy-Driver (Credibility)** constraint does the most work. It knocks out Plain Maximising immediately (no credibility) and puts immense pressure on Disposition theories (how to acquire without looking strategic) and Self-Binding (often counts as external commitment). Any theory that cannot explain how a disposition looks authentic to a perfect reader fails outright.

  ### Evaluation of Contenders

  | Theory | Credibility (Creepy-Driver) | Leakage/Scope | Unwind/Stability | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Plain Maximising** | **Fail.** A maximiser will not pay ex-post; the driver knows this and leaves you. | Pass. | Pass (consistent). | Reject. Solves nothing. |
  | **Disposition/Character** | **Pass.** If genuine, the driver trusts you. | **Fail/Risky.** Hard to scope precisely without leaking into blackmail cases. | **Fail.** If you can unwind, credibility collapses; if you can't, you violate ex-post rationality. | Best candidate, but requires accepting ex-post 'irrational' payment as part of the ex-ante plan. |
  | **Self-Binding** | **Pass.** Hard constraints convince the driver. | Pass. | Pass (binding holds). | **Reject.** Violates the 'no external commitment' constraint; dissolves the puzzle rather than solving it. |

  **Conclusion on Phenomena:** Given the conflicts above, 'rational irrationality' is likely four things wearing one name: (1) pre-commitment technology, (2) genuine character change, (3) self-deception, and (4) evidential decision theory. Only (2) and (3) survive the 'no external commitment' constraint, but only (2) survives the 'first-personal guidance' constraint without requiring cognitive dysfunction.
