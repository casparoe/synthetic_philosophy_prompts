answer: |-
  **Project Title:** Quantifying the Presumption of Independence: A Fragility Analysis of Heuristic Probabilistic Arguments

  **Research Question**
  To what extent does the structural topology of dependence—specifically the distinction between local and global coupling—determine the robustness of heuristic probabilistic arguments? This project asks whether the stability of such arguments can be quantified via a "fragility index" ($\theta^*$), representing the minimum degree of dependence required to reverse the argument's conclusion.

  **Problem Statement**
  Heuristic arguments in mathematics and physics frequently presume statistical independence between events without empirical justification. Philosophical treatments typically handle this presumption binarily: independence is either a default rational norm or an empirical hypothesis subject to falsification. Both approaches are insufficient. The binary view fails to capture *sensitivity*: it does not indicate how much error the argument tolerates before collapsing, nor does it distinguish between dependence that merely shifts a probability and dependence that inverts a conclusion. Standard sensitivity analysis, which varies over the entire space of joint distributions, is too unstructured to yield general insights, while treating independence as a testable empirical assumption is often impossible in theoretical contexts where data is scarce or non-existent.

  **Methodology**
  I propose replacing the binary assumption with a parameterised mixture model. For a family of events, the joint distribution $P_\theta$ is defined as a convex mixture:
  $$P_\theta = (1 - \theta)P_{\text{ind}} + \theta P_{\text{coupled}}$$
  where $P_{\text{ind}}$ is the independent product measure and $P_{\text{coupled}}$ represents a maximally dependent alternative (e.g., comonotonicity or a common latent driver). The parameter $\theta \in [0,1]$ measures the weight of dependence.

  For any heuristic conclusion $C$ (e.g., "Probability $> 0.5$"), I will define the fragility index $\theta^*$ as the infimum of $\theta$ values for which $C$ fails. The project will prove a monotonicity lemma establishing that for union-type conclusions, positive coupling invariably increases probability, while for intersection-type conclusions, it decreases it. This allows the direction of error to be determined *a priori*. Crucially, I will distinguish between *local coupling* (interactions decay or are neighbourhood-specific) and *global coupling* (a single driver fixes the whole family). The hypothesis is that local coupling yields high $\theta^*$ (robust), while global coupling yields low $\theta^*$ (fragile).

  **Case Studies**
  The model will be applied to three canonical contexts, reconstructed formally to avoid historical ambiguity:
  1.  **Cramér's Model of Primes:** Analyzing whether the naive independence assumption fails due to local divisibility correlations (absorbable) or deeper structural dependencies.
  2.  **Boltzmann's *Stosszahlansatz*:** Examining whether the molecular chaos assumption degrades via local dynamical correlations or global recurrence.
  3.  **Fine-Tuning Arguments:** Assessing the move from single-universe to multiverse probabilities, specifically testing the independence of physical constants against a "theory-of-everything" coupling.

  **Timeline (12 Weeks)**
  *   **Weeks 1–4 (Formalisation):** Define the mixture model formally; prove the monotonicity lemma; establish precise definitions for local vs. global coupling.
  *   **Weeks 5–8 (Application):** Compute $\theta^*$ for the three case studies. This involves deriving the independent baseline and the coupled alternative for each.
  *   **Weeks 9–12 (Synthesis):** Compare indices; draft the checklist for evaluating new arguments; write and revise the final paper.

  **Deliverables**
  In addition to the 7000-word paper, I will produce:
  1.  **Fragility Indices:** Computed values (or bounds) for $\theta^*$ for each case study.
  2.  **Diagnostic Checklist:** A tool for philosophers and scientists to categorise the dependence structure of a new heuristic argument and estimate its fragility without full calculation.

  **Risk Assessment and Scope**
  There are three specific conditions that would constitute failure:
  1.  **Triviality:** If $\theta^*$ computes to effectively 0 or 1 for all cases, the index carries no discriminative information.
  2.  **Causal Smuggling:** If the local/global distinction cannot be defined mathematically without importing undefended causal assumptions.
  3.  **Lemma Violation:** If the monotonicity lemma requires conditions (e.g., symmetry) that the case studies do not satisfy.

  Regarding scope, 7000 words is tight for three technical case studies plus philosophical analysis. If the mathematical derivations for the Boltzmann or Prime Number cases prove too dense, I will prioritise the Fine-Tuning case as the primary philosophical exemplar, treating the others as comparative sketches. The focus must remain on the *epistemology of the heuristic*, not the technical history of the cases.

  **Word Count:** 890 words
