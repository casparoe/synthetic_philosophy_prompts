answer: |-
  This is a classic problem in legal philosophy, but you are right to ignore the history and focus on the mechanics. You have a coherent set of intuitions; they just lack a unifying syntax. You are essentially asking for the source code that compiles your moral intuitions into executable rules.

  Your tentative principle ("corrupts some shared practice") is very close to the truth, but it is too vague. A 1950s moralist could argue that "marriage" is a shared practice corrupted by divorce or working mothers. We need to distinguish between *cultural preferences* (which can change) and *structural preconditions* (which must stay fixed for a free society to function).

  Here is the brainstorming process, the scorecard, and the refined principle.

  ### Phase 1: Brainstorming Candidate Principles

  I have generated 5 candidate principles based on common philosophical approaches, plus your own draft.

  1.  **The Harm Principle:** The state may only intervene to prevent harm to non-consenting others.
  2.  **The Moral Majoritarian Principle:** The state may intervene to enforce the sincere moral beliefs of the majority.
  3.  **The Absolute Market Principle:** All voluntary exchanges between adults are permissible; property and self-ownership are absolute.
  4.  **The Public Nuisance Principle:** The state may intervene when conduct disrupts the reasonable use of shared public spaces, regardless of moral content.
  5.  **Your Draft (Institutional Corruption):** Rules may prohibit victimless conduct only when it corrupts a shared practice/institution necessary for decent life.
  6.  **My Proposal (The Agency & Status Principle):** The state protects the *preconditions* of freedom. It allows trade of *resources*, but prohibits trade of *status* (citizenship, basic agency) or binding of *non-consenters* (children).

  ### Phase 2: The Scorecard

  I have scored these against your 10 verdicts.
  *   **PASS:** Matches your verdict.
  *   **FAIL:** Contradicts your verdict.
  *   **MUDDY:** Could go either way depending on interpretation.

  | Case | Your Verdict | 1. Harm | 2. Morality | 3. Market | 4. Nuisance | 5. Your Draft | 6. Agency & Status |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Bestiality** | Illegal | FAIL (No human victim) | PASS | FAIL | FAIL | MUDDY | PASS (Animal welfare/Status) |
  | **2. Incest** | Legal | PASS | FAIL | PASS | PASS | PASS | PASS |
  | **3. Prostitution** | Priv: Leg / Pub: Ill | MUDDY | MUDDY | FAIL | PASS | MUDDY | PASS (Public order vs Private) |
  | **4. Kidney Sale** | Legal | PASS | FAIL | PASS | PASS | MUDDY | PASS (Resource vs Status) |
  | **5. Vote Selling** | Illegal | FAIL | PASS | FAIL | FAIL | PASS | PASS (Civic Status) |
  | **6. Human Zoo** | Illegal | FAIL | PASS | FAIL | FAIL | PASS | PASS (Surrender of Agency) |
  | **7. Flag/AI** | Legal | PASS | FAIL | PASS | PASS | PASS | PASS |
  | **8. Essay Fraud** | No Arrest | PASS | MUDDY | PASS | PASS | PASS | PASS |
  | **9. Work Ban** | Illegal | PASS | FAIL | FAIL | PASS | PASS | PASS |
  | **10. Covenant Town** | ??? | MUDDY | PASS | PASS | MUDDY | FAIL | PASS (Kids/Exit) |

  **Analysis of the Scorecard:**
  *   **Harm Principle (1):** Fails your "hard cases" (5 & 6). It cannot explain why vote selling or the human zoo are wrong if everyone consents.
  *   **Moral Majoritarian (2):** Fails your liberal cases (2, 4, 7, 9). This is the authoritarian trap you want to avoid.
  *   **Absolute Market (3):** Fails 5, 6, 9. Treats people like products.
  *   **Your Draft (5):** Very strong. It fails only on Case 10 (is a town an "institution"?) and Case 4 (is health an "institution"?). It risks being too stretchable.
  *   **Agency & Status (6):** This is the refined version of your draft. It distinguishes between *things you have* (kidneys, money) and *what you are* (a citizen, a free agent).

  ### Phase 3: The Defended Principle

  I recommend we adopt a refined version of your draft. I call it **The Structural Integrity Principle.**

  **The Principle:**
  > The law must presume liberty for all voluntary conduct. However, the state may prohibit victimless conduct if and only if that conduct meets one of three conditions:
  > 1.  **Systemic Corruption:** It undermines the functional integrity of a public system required for equality (e.g., elections, courts).
  > 2.  **Status Degradation:** It treats a human being as a mere object or tool in a way that negates their fundamental status as a free agent (e.g., slavery, permanent surrender of will).
  > 3.  **Non-Consenting Boundaries:** It imposes permanent moral or physical constraints on individuals who could not consent to them and cannot easily exit them (e.g., children).

  **Why this works (The Defense):**
  This principle validates your intuition that "disgust is not enough" (Case 2) while explaining why "consent is not enough" (Case 6).

  *   **It solves the 4/5/6 Triad:**
      *   **Case 4 (Kidney):** You are selling a *resource*. You remain a free agent with full civic status. **Legal.**
      *   **Case 5 (Vote):** You are selling a *function of citizenship*. If votes are commodities, political equality collapses. The system breaks. **Illegal.**
      *   **Case 6 (Zoo):** You are selling your *agency*. By contracting away your right to decide what happens to you, you cease to be a "person" in the eyes of the law and become a "thing." The law cannot recognize a contract that destroys the capacity to contract. **Illegal.**
  *   **It solves Case 2 vs. 6:** Incest is gross, but both parties remain free agents who can leave. The Zoo participant surrenders the capacity to leave (financially/psychologically) and becomes an object.
  *   **It solves Case 9:** Banning working mothers is a "moral preference," not a protection of structural integrity. It restricts agency without preserving a necessary system.

  ### Phase 4: The Checklist (For your Rules Committee)

  When evaluating a rule, ask these four questions in order. If you get a "YES" to any, the rule is likely justified. If "NO" to all, the rule is likely overreach.

  1.  **Is there direct, non-consensual harm to a specific victim?** (If yes, ban it. If no, proceed.)
  2.  **Does this act turn a public civic duty into a private commodity?** (e.g., Voting, Jury Duty, Office Holding. If yes, ban it.)
  3.  **Does this act require a person to permanently surrender their right to make future choices?** (e.g., Slavery, "Human Zoo." If yes, ban it. *Note: Employment contracts are okay because labor laws allow exit.*)
  4.  **Does this rule bind people who had no say in it and cannot leave?** (e.g., Children, Locked-in residents. If yes, the rule is suspect/void.)

  ### Phase 5: Verdicts on New Cases

  Here is how the **Structural Integrity Principle** handles your new scenarios:

  *   **Commercial Surrogacy:**
      *   *Verdict:* **Legal, but heavily regulated.**
      *   *Reasoning:* It uses the body as a resource (like a kidney), not a status. However, it risks "Status Degradation" if the contract prevents the mother from changing her mind about the baby (surrender of parental agency). The law must ensure she retains the right to exit the *parental* obligation, even if she owes money.
  *   **Blood Plasma vs. Whole Blood:**
      *   *Verdict:* **Both Legal.**
      *   *Reasoning:* Both are renewable resources. Neither compromises civic status or future agency. (Note: Some countries ban payment to ensure supply safety, but that is a health regulation, not a moral prohibition).
  *   **Age Verification for Online Porn:**
      *   *Verdict:* **Legal/Required.**
      *   *Reasoning:* This falls under **Non-Consenting Boundaries**. Children cannot consent to sexual imagery. The verification protects the structural boundary of childhood.
  *   **Mandatory Voting:**
      *   *Verdict:* **Illegal (Unenforceable).**
      *   *Reasoning:* Voting is a right, not a duty. Forcing someone to vote corrupts the *meaning* of the vote (it becomes a box-ticking exercise rather than a judgment). It degrades the system it tries to protect.
  *   **Hiring a Stranger to Stand in Line:**
      *   *Concert Tickets:* **Legal.** It's a market for time/labor (resource).
      *   *Public Benefits Appointment:* **Illegal.** This corrupts a public system designed for equitable access based on need, not wealth. It turns a civic safety net into a commodity.

  ### Phase 6: Honest Limitations (Where the Principle Breaks)

  No principle is perfect. Here is where my proposed principle conflicts with your specific verdicts or leaves you exposed:

  1.  **Case 1 (Bestiality):** My principle struggles here. If we strictly say "no human victim," bestiality might pass. I had to add "Animal Welfare" as a sub-clause of Status Degradation (treating living beings as mere tools). If you are a strict humanist, this principle might force you to legalize bestiality unless you accept animals have "status."
  2.  **Case 6 (Human Zoo):** This is the hardest case. A libertarian would say "They signed the contract." My principle says "You can't sign away your humanity." This is a philosophical assertion, not a scientific fact. You have to be willing to stand on the idea that *some rights are inalienable*, even if you want to give them up.
  3.  **Case 2 (Incest):** My principle permits it. You permit it. But if genetic risks are high, a "Harm Principle" advocate might ban it to prevent disabled offspring. My principle allows it unless you argue "potential children" are non-consenting victims.

  **Which verdict would I overturn?**
  I would challenge your view on **Case 4 (Kidney Sale)**.
  *   *Why:* While I scored it as "Legal" to match you, the Structural Integrity Principle actually suggests caution. If kidney selling becomes a market, it disproportionately pressures the poor to damage their health for the rich. It risks turning "being poor" into a status where you must sell body parts to survive.
  *   *Recommendation:* Legal, but only through a single-payer system (state buys all kidneys) to prevent exploitation. Pure free market kidney sales corrupt the "equality of status" between rich and poor.

  ### Phase 7: The Live Issue (Case 10: The Covenant Town)

  This is the one you have to vote on. Here is the specific application of the principle.

  **The Conflict:**
  *   **Adults:** They signed the contract. They have **Exit Rights**. If they don't like the no-alcohol rule, they can sell the house and leave. Under the Structural Integrity Principle, **the rules are valid for them.** They traded some liberty for community cohesion voluntarily.
  *   **Children:** They did not sign. They cannot sell the house. They cannot move out. They are **Non-Consenting Boundaries**.

  **The Verdict:**
  The town is legal, **BUT** the covenants cannot be enforced against minors in ways that restrict their future agency or development.
  *   *No Swearing:* Enforceable (Nuisance/Public order).
  *   *No Alcohol:* Enforceable (Law already bans this for kids).
  *   *No Porn:* Enforceable (Law already bans this for kids).
  *   *Restrictions on Education/Socialization:* **Illegal.** If the town tries to ban kids from talking to outsiders, or forces them into specific schooling that prevents them from leaving later, that violates **Structural Integrity**. It traps them in a moral system they didn't choose.

  **Your Vote:**
  You should vote to **uphold the covenants for adults**, but add a **sunset clause for children**.
  *   *Proposal:* "Covenants apply to all residents. However, upon reaching age 18, any resident born in the town has a one-time right to break the lease/contract without penalty to leave the town."
  *   *Why:* This respects the adults' contract (Property Rights) while protecting the children's future agency (Structural Integrity). It solves your gut conflict: The town can exist, but it cannot be a trap.

  ### Summary Reframing

  You asked if your framing was confused. It wasn't confused, but it was *incomplete*.

  You framed it as: *"When is it OK to stop something just because most people think it's wrong?"*
  The better frame is: *"When does a voluntary act destroy the conditions that make voluntary acts possible?"*

  *   Incest doesn't destroy the conditions of consent.
  *   Vote selling destroys the condition of political equality.
