answer: |-
  ### Three Possible Orderings

  **1. The Historical Genealogy**
  Begin with Braudel's biography and the Annales School, move to the *Mediterranean* case study, and only then apply the framework to journalism.
  *Critique:* This privileges academic lineage over journalistic utility, causing the room to disengage before they see how the tool solves their immediate problem.

  **2. The Diagnostic Critique**
  Open with examples of flawed leads from their own recent work, diagnose the timescale error, and introduce Braudel as the fix.
  *Critique:* This begins by highlighting their failures without first giving them the vocabulary to understand why those failures occurred, risking defensiveness rather than insight.

  **3. The Operational Utility (Selected)**
  Establish the axiom that causality has duration, demonstrate the three tiers using a single case, and then apply the taxonomy to lead-writing mechanics.
  *Critique:* (None selected). This ordering treats the theory as a tool rather than a subject, aligning with the fellows' bias toward utility while forcing them to confront their temporal blind spots.

  ***

  ### The Plan

  **1. The Dependency Structure (Minutes 0–5)**
  *   **Establish the Axiom:** Your instinct is correct, but it requires one prerequisite. Before they can grant that a causal claim has a timescale, they must grant that causality is *plural*. You cannot rank timescales if you believe there is only one cause.
  *   **Sequence:**
      1.  **Plurality:** Establish that no event has a single cause (e.g., a fire needs heat, fuel, and oxygen).
      2.  **Duration:** Establish that each of those causes operates on a different clock (the spark is instantaneous, the fuel growth is seasonal, the climate aridification is decadal).
      3.  **Selection Bias:** Demonstrate that the news peg systematically selects the shortest clock because it is the only one that fits the 24-hour cycle.
  *   **Dependency:** The "Timescale" concept borrows from "Plurality." The "News Peg Bias" concept borrows from "Timescale." Do not introduce Braudel's terms until this ladder is climbed.

  **2. The Carrying Example (Minutes 5–15)**
  *   **Case:** The 2021 Texas Power Crisis (Winter Storm Uri).
  *   **Why not Katrina/Dust Bowl:** Both are now pedagogical clichés where the structural story (levee failure / ecological mismanagement) is already known by the cohort. They will feel confirmed rather than caught out. Uri remains contested; many still believe it was solely a "green energy failure" or a "freak weather event," leaving the structural middle tier visible but unacknowledged.
  *   **The Three Tiers:**
      1.  **Event (L'histoire événementielle):** The blackout itself (Feb 15, 2021). The spike in demand, the freezing wells.
      2.  **Conjuncture (La conjoncture):** The deregulation policy regime (1999–2020) and the infrastructure hardening cycle. This is the tier they will overlook because it is neither "breaking news" nor "geology." It is the administrative decade.
      3.  **Longue Durée:** The Gulf Coast climate norm (freezing is rare) and the geological constraints of the gas supply chain. This is the constraint that makes the conjuncture risky.
  *   **Board Work:** Draw three horizontal lines. Plot the event as a dot. Plot the conjuncture as a bar spanning 20 years. Plot the longue durée as an arrow extending off both sides of the board.

  **3. The Devices (Minutes 15–25)**
  *   **Timescale Ledger (Real Work):** Require them to list every causal claim in a draft and assign it a duration in years.
      *   *Placement:* Use this immediately after the Example. Have them apply the ledger to the Uri case. If they claim "frozen sensors caused the blackout," the duration is days. If they claim "deregulation caused the blackout," the duration is 20 years. The distribution will reveal their bias.
  *   **Dateline Fallacy (Decoration):** The assumption that visibility equals beginning.
      *   *Placement:* Use this during the Misconception Map. It is a conceptual aid, not a working tool. It helps explain *why* they miss the conjuncture, but it doesn't help them fix the lead.
      *   *Verdict:* The Ledger does the work; the Dateline Fallacy explains the psychology. Teach the Ledger as a requirement; teach the Fallacy as a warning.

  **4. The Misconception Map (Minutes 25–35)**
  *   **Geography is Destiny:** *Pre-emptive.* Address this when defining *Longue Durée*. Clarify that geography constrains but does not determine; the conjuncture (policy) is where the choice lives.
  *   **Single Event Attribution (The "Climate Change" Error):** *Reactive.* Let a fellow say "Climate change caused the flood." Break it using the Ledger. Climate change is the *Longue Durée* baseline; the flood is the *Event*. The cause of *this* flood is the interaction of the two, mediated by the *Conjuncture* (drainage infrastructure).
  *   **Structure as Box-out:** *Pre-emptive.* Address this during the Lead Writing transition. State clearly: If the structure is in the fourth paragraph, it is not an explanation; it is decoration.
  *   **Oldest = Deepest:** *Pre-emptive.* Address this in the Dependency Structure. The oldest cause (geology) is not always the most actionable or explanatory. The conjuncture is often the deeper *human* cause.
  *   **Structure Dissolves Accountability:** *Reactive.* This will make them angry. Let the objection surface ("If the system is to blame, who do we punish?").
      *   *Defuse:* Do not cite Braudel. Use the concept of sedimentation. "A structure is not a force of nature; it is an accumulation of past decisions. To explain the structure is to identify the people who made those decisions." This restores accountability to the builders of the system rather than the operators at the moment of failure.

  **5. The Check (Minutes 35–40)**
  *   **Your Idea:** Rewrite the nut graf so the slowest cause appears first.
  *   **Verdict:** This tests vocabulary, not understanding. A fellow can move sentences without changing the causal logic.
  *   **Refinement:** Ask them to write the *first sentence* of the story. Then ask: "What became irrelevant?"
  *   **Wrong Answer:** If they say "Nothing," they failed. Shifting the lead to the *Longue Durée* or *Conjuncture* must render the specific timing of the event less critical. If the event is still the primary subject, they haven't shifted the tier.
  *   **Right Answer:** They should feel the loss of immediacy. The cost is urgency; the gain is explanation. If they cannot articulate the cost, they haven't grasped the trade-off.

  **6. What to Refuse (Minutes 40–45)**
  *   **Refusal 1:** The metaphysical question of whether structures are truly "causal" or merely contextual.
  *   **Refusal 2:** Adjudicating between historiographical schools (Annales vs. Event-History).
  *   **The Sentence:** "We are here to map the terrain of causality for a reader, not to argue over its philosophy in a seminar."

  ***

  \answer{If you cannot assign a timescale to your cause, you have not found the cause.}
