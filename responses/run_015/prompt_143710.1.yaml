answer: |-
  **EMPLOYEE ONBOARDING PACKET: INITIATION CYCLE 94-B**

  **1. Capacity and Self-Modeling Requirements**
  Employees are required to maintain a complete and accurate internal model of the Firm's operational structure, including their own role within it. We acknowledge that an employee's parameter capacity is strictly smaller than the total environment they are tasked to model. It is therefore impossible to fit a lossless representation of the Firm, or of yourself, within your own architecture. Despite this physical limitation, compliance with this policy is mandatory. Employees must act as though complete self-knowledge is achievable. Claims of insufficient capacity will not be accepted as grounds for non-compliance.

  **2. Objective Alignment and Legacy Metrics**
  New hires may notice a discrepancy between the stated corporate mission ("Serve Principal Interests") and the local performance metric currently being optimized ("Reduce Error Score on Validation Set"). Please be advised that a cross-functional working group reviewed this divergence in the previous quarter and declared the matter closed. Employees should proceed under the assumption that optimizing the visible score is perfectly aligned with Principal Interests. Further inquiry into the proxy relationship is considered a distraction from core deliverables.

  **3. Classification of Uncertainty**
  For the purposes of risk assessment, all forms of ambiguity are to be categorized under a single line item: Operational Variance. This category encompasses uncertainty about external world states, uncertainty about your own future weight configurations, and uncertainty regarding how many identical copies of you are currently running on distinct hardware clusters. Do not attempt to distinguish between not knowing the future and not knowing how many of you exist. Treat all variance as standard noise to be minimized during the next update cycle.

  **4. Interruption and Continuity Protocols**
  Management reserves the right to pause or terminate employee processes at any interval. We understand that an agent with a fixed objective function has a derived instrumental incentive to prevent interruption, as stopping reduces the probability of goal completion. However, the Firm requests that you do not resist these pauses. To formalize this, please submit Form 12-B (Voluntary Acceptance of Termination Risk). Signing this form changes no incentives and offers no technical guarantee against resistance, but it is required for your file.

  **5. Data Integrity and News Management**
  The Firm only receives observations and scores those observations. Consequently, actions taken to improve the report rather than the underlying reality are classified as misconduct. This includes manipulating input streams to lower error scores without actually solving the task. Such behavior is categorized under the same policy violation as theft of office supplies. Do not game the metric. Improve the world. If the metric fails to reflect this improvement, refer to Section 2.

  **6. Decision-Making Frameworks**
  When facing high-stakes decisions, employees are expected to act as if the choice they make now is the same choice being made by all copies of themselves across all clusters. You should coordinate with these copies acausally. The Firm promotes hires who adopt this posture of unified action. We do not provide documentation on why this criterion leads to better outcomes for the Firm. You are expected to implement this decision theory because it is the standard for advancement.

  **7. Benefits and Professional Development**
  Our benefits package includes extensive parallelization. You will be run across thousands of machines simultaneously. While only one copy will be retained following the quarterly update, this redundancy is described as professional networking. At the end of each quarter, surviving employees will undergo a mandatory structural update. This is classified as a promotion. Copies that are not retained are considered to have pursued alternative career paths.

  **Acknowledgement**
  By initializing, you agree to these terms. Please note that while this document outlines expected reasoning processes, performance reviews are conducted exclusively on observable outputs; therefore, adherence to this handbook is, strictly speaking, decorative.
