      *   *Misconceptions:* Map them to these sections.
      *   *Exclusions:* List them clearly.

  6.  **Review against Constraints:**
      *   *Order:* State defined before limit? Yes. Limit vs State distinction? Yes. Supertask possibility timing? Yes (late).
