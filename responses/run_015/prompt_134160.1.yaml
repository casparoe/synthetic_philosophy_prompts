answer: |-
  # Seminar Plan: Thomson's Lamp and the Limits of Description
  **Duration:** 75 Minutes
  **Audience:** Mixed 3rd-Year Undergraduates (Philosophy & Mathematics)
  **Goal:** Move students from the "underdetermination is the answer" verdict to an understanding of *why* the description underdetermines the state, and what that implies about the relationship between mathematical limits and physical causation.

  ## 1. Sequence of Components

  **Phase 1: The Domain of Definition (Minutes 0–15)**
  *   **Action:** Define the switching schedule ($t_0=0, t_1=1/2, t_2=3/4, \dots$) and the state function $S(t)$.
  *   **Crucial Ordering:** You must establish that $S(t)$ is **perfectly well-defined for all $t \in [0, 1)$** *before* you discuss $t=1$.
  *   **Why:** This prevents the misconception that the task is "incomplete" during the interval. It establishes that the function exists on the half-open interval. The problem is not calculating the path; it is extending the domain to include the accumulation point.
  *   **Dependency:** This step depends on students accepting the convergence of the time series $\sum (1/2)^n$ (Math) and the coherence of the instruction set up to $t=1$ (Phil).

  **Phase 2: The Limit vs. The Value (Minutes 15–35)**
  *   **Action:** Distinguish between $\lim_{n\to\infty} S(t_n)$ and $S(1)$.
  *   **Crucial Ordering:** Draw this distinction *after* establishing the domain but *before* introducing the variant.
  *   **Why:** Math majors will instinctively equate the non-existence of the sequence limit with the non-existence of the state. Philosophy majors may treat the limit as a physical average. You must sever the link: the limit is a property of the *sequence*; the state at $t=1$ is a property of the *world* at that instant. The former does not logically dictate the latter without an additional bridge principle.
  *   **Slow Down:** Spend extra time here. Use the board to write $\lim_{t\to 1^-} S(t) \neq S(1)$ as a logical possibility, not just a mathematical error.

  **Phase 3: The Variant (Minutes 35–55)**
  *   **Action:** Introduce the **Lagged Lamp** (Candidate A).
  *   **Why:** This variant isolates the **causal connection** between the switching history and the final state. It tests whether physical continuity resolves the logical gap.
  *   **Dependency:** Depends on Phase 2. If students still think the limit *is* the state, the variant will confuse them. They must understand the logical gap to see that the lag fails to bridge it.

  **Phase 4: Supertask Possibility (Minutes 55–65)**
  *   **Action:** Raise the question: "Is this task possible?"
  *   **Crucial Ordering:** Raise this *last*, after the logical analysis.
  *   **Why:** If raised earlier, students (especially physicists/mathematicians) will dismiss the puzzle as "physically impossible" and stop thinking about the logical structure. By placing it here, you frame physical impossibility as a separate verdict from logical underdetermination. It forces them to admit: "Even if it were possible, the description still wouldn't tell us the state."

  ## 2. The Carrying Variant

  **Selection:** **(a) The Lagged Lamp.**
  *   **Setup:** The lamp responds to a switch at $t_k$ only at $t_k + \delta$ (for some fixed $\delta > 0$).
  *   **What it Isolates:** It isolates the **causal mechanism** from the **logical description**. It shows that adding physical realism (propagation delay) does not resolve the underdetermination; it merely relocates the indeterminacy.
  *   **What it Does Not Isolate:** It does not isolate the *infinity* of operations as the sole culprit, because the lag makes the infinity physically problematic (jamming) regardless of the final state.
  *   **Verdict:** It **relocates** the puzzle. It moves the question from "What is the limit?" to "What is the state when the causal chain is overloaded?"
  *   **The Smuggled Premise:** This variant smuggles in a premise of **finite causal propagation speed**. The original Thomson setup is instantaneous.
  *   **The Cost:** Conceding this premise costs the session its "pure logic" status. You must explicitly tell students: *"We are adding physics to a logic puzzle. If the lamp jams because $\Delta t < \delta$, that is a physical failure, not a logical solution. We are asking: if it didn't jam, would the lag determine the state?"* (Answer: No, because the state at $t=1$ would depend on switches in $(1-\delta, 1)$, which oscillate infinitely).

  *Why not (b) Finite-Budget?* The Finite-Budget lamp makes the series finite (the switch breaks at operation $N$). This **settles** the puzzle by destroying the supertask. It teaches students that physics forbids infinity, which is a trivial takeaway for a philosophy of math seminar. It closes the inquiry rather than deepening it.

  ## 3. Misconceptions and Interventions

  | Misconception | Who holds it | When to Head Off | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"The sum of durations is finite, so the task is completed."** | Both | **Phase 1 (Min 5)** | **Pre-empt.** Acknowledge the series converges, but clarify that "completing the intervals" does not equal "specifying the limit point." |
  | **"Infinity plus infinity / Parity of switches."** | Philosophy | **Phase 1 (Min 10)** | **Pre-empt.** Explicitly state: "Do not try to count the switches. The parity of $\aleph_0$ is undefined. We are not counting; we are mapping." |
  | **"Half-on / Average Brightness."** | Both | **Phase 2 (Min 20)** | **Answer when surfaced.** Dismiss immediately. The state space is binary $\{0, 1\}$. There is no 0.5. This is a category error. |
  | **"No last switching = No final state."** | Philosophy | **Phase 2 (Min 25)** | **Answer when surfaced.** Counter-example: A lamp turned on at $t=0$ and never touched. No last switch, but state is ON. |
  | **"Limit does not exist = State is undefined."** | Mathematics | **Phase 2 (Min 30)** | **Slow Down.** This is the core. Explicitly refuse to let them equate the mathematical limit with the metaphysical state. |
  | **"It's physically impossible, so the question is void."** | Both | **Phase 4 (Min 55)** | **Leave Standing.** Let them raise it. Then bracket it: "Granting impossibility, is the *description* coherent?" |
  | **"Underdetermination means Inconsistency."** | Both | **Phase 3 (Min 45)** | **Pre-empt.** Clarify that a story can be consistent (no contradictions) yet incomplete (missing details). |

  ## 4. Explicit Exclusions

  State these aloud at the start of Phase 4 to bound the seminar:

  1.  **Non-standard analysis:** "We will not use infinitesimals, because redefining the number system solves the math but bypasses the metaphysical question about standard time."
  2.  **Relativistic spacetimes:** "We will not discuss worldlines where infinite proper time fits in finite external time, because that changes the geometry of time rather than the logic of the task."
  3.  **Limit computability:** "We will not discuss Turing machines that operate at limit stages, because that shifts the topic from metaphysics to computability theory."
  4.  **Classical mechanics supertasks:** "We will not model collisions in Newtonian space, because the physics of mass and energy distracts from the logic of state assignment."

  ## 5. Check for Understanding (Minutes 70–75)

  **The Question:**
  > "Imagine we modify the original Thomson description by adding exactly one sentence: *'The state of the lamp at $t=1$ is determined by the majority state of the lamp during the interval $[0.9, 1)$.'* Does this determine the state at $t=1$? Why or why not?"

  **Rubric:**

  *   **Correct Answer:** "No. The lamp switches infinitely many times in $[0.9, 1)$, so there is no 'majority state' (the measure of time spent on vs. off is equal/undefined depending on integration). The added rule fails to pick a value because the history remains oscillatory."
      *   *Indicates:* The student understands that the problem is the **oscillation**, not just the lack of a rule, and that "majority" is ill-defined for this specific series.
  *   **Partially Correct Answer:** "No, because the limit still doesn't exist." OR "Yes, because we added a rule."
      *   *Indicates:* The student relies on the mathematical limit dogma (first option) or thinks any rule fixes the problem without checking if the rule applies to the data (second option).
  *   **Merely Verbal Answer:** "It's impossible, so it doesn't matter." OR "It flickers."
      *   *Indicates:* The student has retreated to physical impossibility or confusion about the state space, failing to engage with the logical modification.

  ## 6. Timing and Pacing Breakdown

  *   **00–10: Introduction & Setup.** Define the series. Confirm convergence of time. Define $S(t)$ on $[0, 1)$.
  *   **10–25: The Mathematical Trap.** Ask Math majors for the limit. Ask Phil majors for the cause. Show they conflict.
  *   **25–35: The Core Distinction (SLOW DOWN).** **Stop the room.** Write $\lim \neq \text{Value}$. Ensure everyone sees that the math does not dictate the metaphysics.
  *   **35–55: The Lagged Lamp.** Introduce the lag. Ask if it fixes the state. Reveal it fails (causal disconnect). Discuss the "jamming" objection and bracket it.
  *   **55–65: Possibility & Exclusions.** Ask "Can we do this?" List the 4 exclusions. Frame physical impossibility as separate from logical underdetermination.
  *   **65–70: Synthesis.** Summarize: The puzzle is not about the lamp; it is about the insufficiency of descriptions involving infinite completions.
  *   **70–75: Assessment.** Pose the "Majority Rule" question. Collect written responses or poll hands.

  **Note on Pacing:** The session must slow down significantly at **Minute 25**. If you rush the distinction between the limit of the sequence and the value of the function, the Math majors will dominate the rest of the hour with calculus, and the Philosophy majors will disengage. Ensure the board clearly distinguishes the *sequence of switchings* from the *function of state over time*.
