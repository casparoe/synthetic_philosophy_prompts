answer: |-
  This is a classic "Ship of Theseus" problem dressed in accession forms. You are correct that metaphysics won't solve this, but a *policy-based ontology* will. You don't need to know what the object *is*; you need to know which rulebook applies to the question you're being asked.

  Below is the **Museum Identity Protocol (MIP)**. It is designed to be run in 30 minutes. It separates the *physical reality* from the *administrative status*. It does not find "truth"; it assigns *authority*.

  ### Glossary of Terms (For the Team)
  *   **Sortal:** The category of thing that determines its identity conditions (e.g., a 'person' persists through cell replacement; a 'rock' does not).
  *   **Constitution:** The relationship between the object and the material it is made of (the statue is *constituted* by the clay, but is not the clay).
  *   **Accession:** The legal act of accepting ownership; the number binds the record, not necessarily the matter.
  *   **Substantial Transformation:** A legal/customs test asking if the item has changed name, character, or use.
  *   **Provenance:** The history of custody and location, distinct from the history of the material.

  ---

  ### The Museum Identity Protocol (MIP)

  **Time Limit:** 30 Minutes.
  **Input:** The object, the accession record, the specific query (Loan, Insurance, Return).
  **Output:** A documented decision on the "Identity Status" for the specific query.

  #### Step 1: Identify the Governing Sortal (5 Minutes)
  *Question:* What kind of thing is this, according to the creator or source community?
  *   **A. Biological/Organic:** Identity persists through metabolic replacement (e.g., living tree, taxidermy with original skin).
  *   **B. Material Artifact:** Identity is tied to the original physical fabric (e.g., geological specimen, raw metal ingot).
  *   **C. Designed/Artistic Work:** Identity is tied to the form/intent, material is secondary (e.g., sculpture, machine, digital file).
  *   **D. Cultural/Spiritual Entity:** Identity is defined by community narrative, regardless of material (e.g., sacred regalia, house post).

  *   *If D:* **STOP.** Proceed immediately to **Step 4 (External Authority)**.
  *   *If A, B, or C:* Proceed to Step 2.

  #### Step 2: Assess Material Continuity (10 Minutes)
  *Question:* How much of the original accessioned material remains, and is it structural?
  *   **Threshold:** Is more than 50% of the *structural* material original?
      *   **Yes:** Presume **Continuous Identity**.
      *   **No:** Presume **Reconstructed Identity**.
  *   **Exception:** Is the missing material replaced with like-for-like material to maintain function (e.g., a working clock, a vehicle)?
      *   **Yes:** Identity remains **Continuous** (Functional Sortal).
      *   **No:** Identity is **Composite** (Original fragments + New support).

  *   *Action:* If "Composite," the database must reflect two distinct entities: `Object.01` (The current assembly) and `Material.01` (The original fragments). They share a parent record but have distinct risk profiles.

  #### Step 3: Assess Administrative Goal (5 Minutes)
  *Question:* Why are we asking? (The "Sortal" changes based on the stakeholder).
  *   **Insurance:** Cares about **Value of Material**. (Is the payout for the bronze or the infill?)
  *   **Loan:** Cares about **Stability & Appearance**. (Will it fall apart? Does it look like the image in the catalogue?)
  *   **Repatriation:** Cares about **Cultural Continuity**. (Does the community recognize it?)
  *   **Cataloging:** Cares about **Provenance**. (Is the paper trail unbroken?)

  *   *Rule:* You may hold different Identity Statuses for different goals simultaneously. (e.g., "Same Object" for Loan, "Composite Object" for Insurance).

  #### Step 4: Check External Authority (5 Minutes)
  *Question:* Is there a living creator or a source community with a claim?
  *   **Living Artist:** Their definition of the work overrides material analysis. (Get it in writing).
  *   **Source Community:** Their definition of the object overrides museum material analysis for **Return/Repatriation** queries.
  *   **Insurer/Lender:** Their definition overrides museum analysis for **Coverage/Loan** queries.

  *   *Action:* If External Authority contradicts Step 2, **ESCALATE**. Do not decide internally.

  #### Step 5: The Decision Matrix (5 Minutes)
  *Select the outcome based on the path above.*

  | Scenario | Identity Status | Action |
  | :--- | :--- | :--- |
  | **Continuous** (Step 2 Yes) | Same Object | Proceed with standard forms. |
  | **Composite** (Step 2 No) | Modified Object | Split valuation. Loan as one, Insure as two. |
  | **Conceptual** (Step 1 C + Step 4 Artist) | Iterative Object | Accession the *instructions*, not the instance. |
  | **Cultural** (Step 1 D) | Persistent Entity | **Defer to Community.** Museum record is secondary. |
  | **Conflict** (Step 4 Contradiction) | **Disputed** | **STOP.** Escalate to Director/Legal. |

  ---

  ### Escalation Matrix (Who Decides What)
  *   **Registrar:** Material continuity, database entry, loan paperwork.
  *   **Conservator:** Structural stability, % of original material.
  *   **Curator:** Artistic intent, historical significance.
  *   **Director/Legal:** Conflicts between Insurer and Artist; Repatriation policy overrides.
  *   **Source Community:** Ontological status of cultural items (for return claims).

  ---

  ### Running the Protocol: Your Three Cases

  #### Case 1: The Bronze Figure (60% modern infill)
  *   **Step 1 (Sortal):** C (Designed/Artistic Work).
  *   **Step 2 (Material):** No (Less than 50% original structural material). Status: **Composite**.
  *   **Step 3 (Goal):**
      *   *Loan:* Appearance is continuous. Can travel as one object.
      *   *Insurance:* Value is split. 40% is "Antique/Original," 60% is "Restoration."
  *   **Step 4 (Authority):** No living artist. No community claim stated.
  *   **Step 5 (Decision):**
      *   **Database:** One Accession Number for the Assembly (`1990.05.01`). One Sub-Number for the Fragments (`1990.05.01a`).
      *   **Loan:** The Assembly travels. The Fragments stay (too unstable/low visual value).
      *   **Insurance:** Policy must specify "Agreed Value" split between original fabric and restoration.
      *   **Auditor Note:** "Object identity maintained for display; material identity split for valuation per MIP Step 2."

  #### Case 2: The Living Artist Wax Block
  *   **Step 1 (Sortal):** C (Designed/Artistic Work) leaning toward Conceptual.
  *   **Step 2 (Material):** No (Material is destroyed/recast annually). Status: **Iterative**.
  *   **Step 3 (Goal):** Insurance vs. Artist Intent.
  *   **Step 4 (Authority):** **Living Artist.** Their instruction defines the work.
  *   **Step 5 (Decision):**
      *   **Conflict:** Insurer says "New Material = New Risk." Artist says "Same Work."
      *   **Resolution:** **ESCALATE to Director/Legal.** The Registrar cannot solve this.
      *   **Recommendation:** The Accession is the *Certificate + Instruction*. The wax is an *expendable medium*.
      *   **Insurance:** Requires a "Perishable/Consumable" clause or a fine art policy that covers conceptual works. Standard property insurance will deny this.
      *   **Outcome:** It is the *same accessioned work*, but a *different physical instance*. You must write this distinction on the loan form.

  #### Case 3: The Carved House Post (Repatriation Claim)
  *   **Step 1 (Sortal):** D (Cultural/Spiritual Entity).
  *   **Step 2 (Material):** No (1972 reconstruction). Status: **Reconstructed** (by Museum standards).
  *   **Step 3 (Goal):** Repatriation/Return.
  *   **Step 4 (Authority):** **Source Community.**
  *   **Step 5 (Decision):**
      *   **Protocol Rule:** For Sortal D, Community definition overrides Museum material analysis.
      *   **Outcome:** **Same Object.**
      *   **Reasoning:** The "Sortal" governing this object is not 'timber assembly' but 'ancestral presence'. The community asserts continuity through replacement. Under MIP Step 4, their ontology governs the return claim.
      *   **Documentation:** "Object recognized as continuous entity per Source Community ontological framework. Museum material analysis (1972 reconstruction) noted but does not negate cultural identity for purposes of repatriation."
      *   **Who Decides:** You (Registrar) can sign this *if* your Repatriation Policy explicitly defers to community definition. If not, this goes to the **Director** to sign off on the policy override.

  ---

  ### Limitations: What This Procedure Cannot Do

  You asked for honesty about the "fact of the matter."

  1.  **No Metaphysical Truth:** This procedure does not tell you if the house post *really is* the 1904 post. It tells you that for the purpose of the repatriation contract, you will *treat it as if it is*. There is no fact of the matter independent of the framework you choose.
  2.  **Inconsistency is Built-In:** You will inevitably classify the bronze statue as "One Object" for the loan form (it looks like one) and "Two Objects" for the insurance form (the value is split). This is not a bug; it is a feature. Different stakeholders require different sortals.
  3.  **The "Hard Stop":** If the Artist (Case 2) and the Insurer cannot agree on a policy clause, the procedure stops. There is no philosophical argument that will force an underwriter to cover melted wax as "original." That is a commercial negotiation, not a registration problem.
  4.  **Ethical vs. Physical:** In Case 3, you are prioritizing an ethical obligation over a physical description. If an auditor asks, "Is this physically the 1904 wood?" the answer is "No." If they ask, "Is this the object subject to the return claim?" the answer is "Yes." You must ensure your paperwork distinguishes *Physical Description* from *Legal Identity*.

  **Final Advice:** Print the MIP. Stick it to the wall. When the auditor asks "Why is this one object?", you point to Step 1 and Step 4. You aren't doing metaphysics; you're following protocol.
