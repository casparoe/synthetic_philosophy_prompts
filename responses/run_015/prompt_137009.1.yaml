      *   *Step 4: Stakeholder Intent.* What do the creator/source/insurer say?
      *   *Step 5: The Decision Matrix.* Mapping the answers to the specific output (Loan, Insure, Return).

      *   *Refining for Case 3 (Repatriation):* The user wants the house post to be the "same object." Standard metaphysical criteria (material continuity) might fail this. The procedure *must* prioritize the Source Community's ontological framework in repatriation contexts. This is a policy/ethical override, not a physical fact. I need to build an "Ethical Override" step.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Bronze Figure):*
