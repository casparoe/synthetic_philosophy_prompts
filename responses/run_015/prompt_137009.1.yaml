  8.  **Final Polish:** Check tone. Ensure it sounds like it comes from a colleague who understands the pressure, not a lecturer. (e.g., "Don't argue metaphysics, argue policy.")

  *(Self-Correction on Case 3)*: The prompt says "I'd like (3) to come out as the same object... if your procedure won't give me that, say so plainly."
  *Decision:* I will design the procedure so that *for the purpose of repatriation*, the Source Community's definition is the governing "Sortal." This allows the outcome to be "Same Object" without lying about the material. I will explicitly state that this is a *normative* decision, not a *descriptive* one.

  *(Self-Correction on Case 2)*: Insurer says it isn't the object. Artist says it is.
