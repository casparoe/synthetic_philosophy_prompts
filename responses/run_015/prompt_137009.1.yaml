      *   *Case 2 (Wax Block):*
          *   Matter: Recycled.
          *   Form: Recreated.
          *   Intent: Artist says it's the work. Insurer says it's new material.
          *   Outcome: This is a "Conceptual Object." The accession is the *instruction + wax mass*, not the specific shape. Insurer needs a special clause. It is the same object *conceptually*, but a new physical instance.

      *   *Case 3 (House Post):*
          *   Matter: Replaced planks.
          *   Community View: Persistent identity (spiritual/cultural).
          *   Museum View: 1972 reconstruction.
          *   Outcome: For repatriation, the Community's ontology rules. The procedure must flag this as a "Social Identity" case, not a "Material Identity" case. If the procedure relies solely on material, it fails. I need to ensure the procedure allows the "Source Community Definition" to override the "Material Definition" for return claims.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is it too philosophical?
