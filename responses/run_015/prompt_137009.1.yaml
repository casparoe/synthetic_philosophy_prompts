      *   **Problem:** Ontological identity questions (is this the same object?) arising in practical contexts (insurance, loans, repatriation, cataloging).
      *   **Constraints:** ~30 minutes per case, no philosopher on staff, must satisfy collections committee and auditors, needs to be actionable (not theoretical), must handle subtraction, accretion, replacement, and non-physical objects (digital/instructions).
      *   **Current State:** Reading up on constitution view (statue/clay), sortals, etc., but finds it too abstract. Database already allows separate numbers for object vs. material.
      *   **Goal:** A decision procedure (flowchart/checklist style) that yields clear outcomes or flags ethical/policy decisions.
      *   **Specific Test Cases:**
          1.  Bronze figure (60% modern infill, original fragments separate).
          2.  Living artist wax block (melt/recast annually, artist vs. insurer disagreement).
          3.  Carved house post (source community views it as persistent through replacement, museum records say 1972 reconstruction, repatriation claim).
      *   **Requirement for Case 3:** Ideally outcomes as "same object" for repatriation. If the procedure can't do that, admit it and assign decision authority.
      *   **Final Requirement:** Honesty about limitations (fact of the matter vs. administrative decision).

  2.  **Deconstruct the Philosophical/Practical Tension:**
      *   The user is grappling with the "Ship of Theseus" problem but in a bureaucratic context.
      *   Philosophical concepts mentioned: Constitution view (statue $\neq$ clay), Sortals (what *kind* of thing is it?), Substantial Transformation (customs law).
      *   Practical needs: Insurance (value/risk), Loans (what moves?), Repatriation (moral obligation), Cataloging (accession numbers).
      *   *Key Insight:* There is no single metaphysical "truth" that satisfies all these domains simultaneously. Insurance cares about value/material. Repatriation cares about cultural continuity. Loans care about stability/appearance.
      *   *Strategy:* The procedure must separate *Physical Continuity* (matter), *Functional/Identity Continuity* (form/use), and *Social/Legal Continuity* (provenance/obligation). It needs to route different questions to different authorities.

  3.  **Drafting the Decision Procedure (The "Museum Identity Protocol"):**
      *   *Tone:* Professional, direct, bureaucratic but clear. No jargon without gloss.
      *   *Structure:* Step-by-step questions. Stop conditions. Escalation points.
      *   *Terminology:* Define "Sortal," "Constitution," "Accession," etc., simply.
      *   *Handling the "30-minute" constraint:* It needs to be a checklist, not an essay.

      *   *Step 1: Define the Sortal (What kind of thing is it?).* This determines the identity conditions. A biological specimen is different from a sculpture.
      *   *Step 2: Matter vs. Form.* How much original material remains? Is the material essential?
