  *(Self-Correction on Case 1)*: 60% infill.
  *Decision:* Distinguish between "The Work" (the visual entity) and "The Material" (the historic fabric). They can have different accession statuses or sub-numbers.

  9.  **Drafting the Content:** (Mental check of the "30 minute" rule). The procedure needs to be a checklist.
