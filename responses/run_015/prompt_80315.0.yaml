      *   To build a *single scalar score*, you need **Commensurability**. You need to be able to add $X$ units of Pushpin pleasure to $Y$ units of Poetry pleasure and get a meaningful sum $Z$.
      *   This requires Claim 3 (Measurement) and usually implies Claim 2 (Equal Value). If they aren't equal in value, a simple sum is misleading.

  6.  **Identify the Lead's Likely Confusion:**
