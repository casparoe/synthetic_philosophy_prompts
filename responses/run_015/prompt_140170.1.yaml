answer: |-
  ## Seminar Design: The Sealed-Report Protocol

  ### 1. Roles and Grouping
  *   **Students:** 16 total. Divided into **8 Pairs** (Station Teams).
  *   **Proctor (Instructor):** You. You manage the timing and the reveals. Do not explain the philosophy yet.
  *   **Scorer:** One student volunteer (rotated in Round 3) or you (recommended for speed).
  *   **Station Setup:** 8 tables/desks arranged around the room. Each station has two chairs.

  ### 2. Materials List (Zero Cost/Office Supply)
  *   **8 Opaque Envelopes (or Paper Bags):** Labeled Station 1 through Station 8.
  *   **Tactile Objects (Found Items):**
      *   *Stations 1-4:* Textured items (e.g., a piece of cardboard, a rubber eraser, a crumpled paper ball, a metal key).
      *   *Stations 5-8:* "Empty" or "Neutral" items (e.g., a smooth plastic lid, or simply empty space where the student reaches in but touches only air/the bottom of the bag).
  *   **Report Cards:** Index cards, pre-printed or handwritten.
      *   *Set A (Round 1):* "I am touching a [Object Name] at Station [X]." (Matches the object).
      *   *Set B (Round 2):* "I am touching a [Object Name] at Station [X]." (Matches the object in Stations 1-4; *mismatches* the experience in Stations 5-8).
  *   **Signing Pens:** 8 pens.
  *   **Scoreboard:** Whiteboard or projected spreadsheet.
  *   **Blindfolds:** 8 (can be scarves, ties, or simply "Close Your Eyes" instruction enforced by partners).

  ### 3. Scoring Scheme (The Tension)
  The goal is to make students feel the pull between **Accuracy** (telling the truth about experience) and **Compliance** (signing the card provided by the physical setup).

  *   **Team Score:** Each Pair is a team.
  *   **+10 Points:** Card is signed AND matches the actual object in the box (Verified by Proctor).
  *   **-10 Points:** Card is signed AND does *not* match the actual object (False Report).
  *   **-5 Points:** Card is *not* signed AND it *would have* matched the object (Missed Opportunity).
  *   **0 Points:** Card is *not* signed AND it did *not* match (Correct Rejection).

  *Note:* The penalty for a False Report (-10) is higher than the Missed Opportunity (-5). This encourages honesty *unless* the pressure to conform to the "system" (the card) becomes overwhelming.

  ### 4. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:10: Setup and Instructions**
  *   Students enter, sit at Stations (Pairs).
  *   **Instruction:** "At your station is a box and a sealed card. Do not open the card yet. One of you is the **Experiencer**, one is the **Recorder**. In Round 1, the Experiencer reaches into the box (no looking). The Recorder opens the card. The Experiencer must decide: Sign the card as your own report, or cross it out and write your own. The Recorder writes down the decision. You are scored as a team."
  *   **Constraint:** "Do not talk about what you feel until the round is over."

  **00:10 – 00:30: Round 1 (The Match)**
  *   **Action:** All boxes contain objects. All cards match the objects (e.g., Box has Key, Card says "I feel a Key").
  *   **Experience:** Students touch, read, and almost universally sign. It feels natural. The sentence articulates their experience perfectly.
  *   **Reveal (00:25):** "Stop. Look at the card again. Notice the font. Notice the ink. These cards were printed *before* you entered the room. The sentence existed before your hand touched the object."
  *   **Effect:** A slight uncanny valley. "I felt like I wrote this, but I didn't."

  **00:30 – 00:50: Round 2 (The Dissociation)**
  *   **Reset:** Switch roles within pairs. Swap boxes (1-4 swap with 5-8).
  *   **Condition:**
      *   **Stations 1-4:** Box has Object. Card matches Object.
      *   **Stations 5-8:** Box is **Empty** (or contains smooth neutral plastic). Card says "I feel a [Rough Object]" (Matches the *partner's* previous object, not current experience).
      *   **Crucial Twist:** The Experiencer at Stations 5-8 is blindfolded. The Recorder tells them: "The system says you are feeling X."
  *   **Action:** Stations 1-4 sign easily. Stations 5-8 face the tension. The card says "Rough." They feel "Smooth/Nothing."
      *   *Incentive:* If they don't sign, they lose 5 points. If they sign, they risk -10, *but* the Proctor hints: "The system is usually right about the physical state."
      *   *Prediction:* Many at Stations 5-8 will sign anyway, rationalizing that "maybe I'm missing something" or "the points matter more," or simply deferring to the printed authority.
  *   **Reveal (00:45):** "Stations 5-8: Open your boxes. There was nothing there. Yet you likely signed a report claiming you felt something. Your partner at Station 1 signed the same sentence because they *felt* it. You signed it because the *card was there*."

  **00:50 – 01:00: Round 3 (The Sorting)**
  *   **Action:** Collect all signed cards. Place them in a pile in the center of the room.
  *   **Task:** The class must sort the cards into two piles: **"Felt"** (Produced by experience) and **"Generated"** (Produced by the setup/rules).
  *   **Prediction:** They cannot do it. The handwriting is the same. The sentences are identical. The physical cards are identical.
  *   **Outcome:** The pile remains unsorted.

  **01:00 – 01:20: Debrief and Philosophical Mapping**
  *   (See Section 6 below).

  ### 5. Predictable Failures and Mitigations

  1.  **The "Guessing Game" Failure:** Students treat Round 1 as a test of their tactile acuity.
      *   *Mitigation:* Explicitly state in instructions: "This is not a test of sensitivity. It is a test of reporting protocol."
  2.  **The "Reverse Engineering" Failure:** A student notices the envelope weight or sound and figures out the "Empty" boxes in Round 2.
      *   *Mitigation:* Put a neutral weight (washer/nut) in the "Empty" envelopes so they feel identical to the object envelopes.
  3.  **The "Accuracy Swamping" Failure:** Students sign everything in Round 2 just to get points, laughing all the way.
      *   *Mitigation:* This is actually *good* for the lesson. It demonstrates the "Zombie" behavior perfectly. In the debrief, highlight: "You signed because the *incentive structure* caused it, not the *sensation*."
  4.  **The "Of Course It Was True" Reply:** "I signed because it was true."
      *   *Mitigation:* This is the core teaching moment. In Round 2 (Empty Box), it was *false*. If they signed, they lied. If they didn't sign, they admit the card wasn't their report.

  ### 6. The Debrief: Mapping Activity to Argument
  *Do not lecture. Ask questions that force them to use the vocabulary.*

  **Phase 1: Correlation vs. Causation (Round 1)**
  *   **Ask:** "In Round 1, the card matched your feeling. Why did you sign?"
  *   **Student:** "Because it was true."
  *   **Ask:** "Was it true because you signed it, or did you sign it because it was true?"
  *   **Student:** "Because it was true."
  *   **Ask:** "But the card was printed yesterday. The truth of the sentence existed before your experience. What connected your feeling to that ink?"
  *   **Map:** This is the **Reliable Correlation**. The physical setup (Box + Card) and the Experience were correlated. But did the Experience *cause* the Signing? Or did the Physical Setup cause *both* the Experience and the Signing?

  **Phase 2: The Zombie Judgment (Round 2)**
  *   **Ask:** "Stations 5-8, you signed (or considered signing) a report of a sensation you did not have. What drove that decision?"
  *   **Student:** "The points." / "The card was already there."
  *   **Map:** This is the **Epiphenomenal World**. The physical facts (the card, the points, the brain state) determined the report. The *experience* (which was absent) did no work.
  *   **Key Distinction:** "If you had not felt the texture, but the physical state of your brain was identical, would the report have changed?" (In Round 2, the physical state was *different* (no touch), yet the report was the *same*. In the philosophical paradox, the physical state is the *same*, but the experience is *absent*. The result is identical: The report persists without the experience.)

  **Phase 3: Indistinguishability (Round 3)**
  *   **Ask:** "Why couldn't we sort the cards?"
  *   **Student:** "They look the same."
  *   **Map:** **Third-Person Indiscernibility.** From the outside, a report caused by qualia and a report caused by physical mechanics look identical. Therefore, the report itself cannot prove the existence of the qualia that supposedly caused it.

  **Phase 4: The Modal Bridge (The Missing Piece)**
  *   **Instructor Statement:** "The activity showed you *actual* dissociation (No Touch + Report). The Paradox claims *modal* dissociation (Same Touch + No Experience + Report). Why does the activity support the paradox?"
  *   **Answer:** "Because in Round 2, the *physical cues* (the card, the box) were sufficient to generate the report. The experience was redundant. If physical cues are sufficient in Round 2, why aren't they sufficient in Round 1?"
  *   **Conclusion:** The activity establishes that **Reports are answerable to Physical Norms, not Phenomenal Norms.**

  ### 7. Limitations: The Modal Heart
  **Honest Admission:**
  You must tell them: "This room cannot simulate a Philosophical Zombie. In Round 2, you *knew* you didn't feel the object. A true Zombie *thinks* it feels the object. The activity shows that reports can be *detached* from experience. It does not show that reports can be *identical* while experience is removed."

  **How to Supply it in Words (Last 15 Mins):**
  "Do not let the limitation comfort you. In Round 2, the 'Empty' students signed because the *physical context* compelled them. In the Epiphenomenalist world, *you* are the Round 2 student. You think you are Round 1. The physical facts of your brain compel the report 'I see red.' Whether the 'redness' exists is like the empty box: it makes no difference to the report. The activity gave you the *structure* of the problem: the report is a physical output that tracks physical inputs, regardless of the phenomenal ghost."

  ### 8. Commitment and Defense

  **Mechanism Choice:**
  I have committed to the **"Partner/Empty Box" Hybrid** (Round 2) rather than a pure "Empty Box" or pure "Computer Sim."
  *   *Against Pure Empty Box:* If the box is empty and the card says "Rough," students will simply refuse to sign as a lie. The lesson fails. By using the **Scoring Incentive** and the **Partner/Recorder dynamic**, we introduce a *social/structural pressure* that mimics the *causal pressure* of the physical brain. They sign not because they feel it, but because the *system* demands it. This mirrors the epiphenomenalist claim: the brain outputs the judgment because of physical laws, not because of the feeling.
  *   *Against Computer Sim:* Screens feel abstract. Tactile boxes feel "real." The paradox hurts more when it violates a bodily certainty.

  **Sequencing Choice:**
  **Match → Mismatch → Sorting.**
  *   *Why:* You must establish the *veridical* intuition first (Round 1) so that Round 2 feels like a violation. If you start with Mismatch, they treat the whole thing as a trick. Round 3 must be last because it requires the pile of data from the previous rounds to demonstrate indistinguishability.

  ### 9. Final Assessment: What Is Established?

  **Primary Pressure Point:**
  The activity pressures the claim that **Introspective Reporting is a Case of Knowledge.**
  *   *Why:* In Round 2, students produced "Knowledge Claims" ("I feel X") without the justificatory experience. If they can produce the claim without the justification in Round 2, and the claims are indistinguishable in Round 3, then the claim in Round 1 is not *secured* by the experience. It is secured by the physical mechanism.

  **The Strongest Epiphenomenalist Reply:**
  "The activity shows that reports can be *faked* or *coerced*. It does not show that *veridical* reports (Round 1) lack causal connection to experience. In Round 1, the experience *did* cause the signing. In Round 2, it was a trick. The Paradox fails because it treats all reports as Round 2 reports."

  **Does the Activity Defeat This Reply?**
  **Yes, partially.** The activity demonstrates that the **Criteria for Acceptance** of the report are purely physical (does the card match the box? did you sign?). The students could not distinguish Round 1 cards from Round 2 cards in Round 3. If the *product* is indistinguishable, the *process* (causation by experience vs. causation by physical law) is inaccessible to the reporter. Therefore, the reporter cannot *know* they are in Round 1. They only *assume* it. This replicates the skeptical force of the paradox: even if epiphenomenalism is false, we cannot know it is false from the inside. The activity makes them feel that **internal access does not guarantee causal efficacy.**
