answer: |-
  Hume's argument in *Of Suicide* is that life is a sentry post: you stay until the General (Nature) relieves you, then you're free to go.

  But he locked the essay in a drawer for thirty years.

  It turns out Hume was a stickler for protocol. He was perfectly willing to tell the rest of us when we'd been relieved of the post of *Living*, but he refused to abandon his own post of *Respectability* until the General showed up in person to fire him.

  He spent three decades guarding a manuscript that argued nobody needs to guard their post that closely—waiting for the one relief order he couldn't argue with: his own termination notice.
