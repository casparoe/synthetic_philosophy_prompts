answer: |-
  Dear Friend,

  It is a profound and necessary exercise to interrogate the consistency of our moral intuitions regarding historical figures, and I share your suspicion that the phrase man of his time is often deployed as a rhetorical shield rather than a rigorous ethical standard. You have asked whether there is a single coherent principle that can accommodate your specific verdicts on Columbus, Jefferson, Churchill, and the Norman lord, or if you must abandon one of these judgments to achieve coherence. I believe you can maintain all of them without contradiction, provided you anchor your judgment in a principle of accessible moral alternatives combined with discretionary agency. This principle suggests that moral blame is appropriate not merely when harm occurs, but when the agent had the conceptual capacity to recognize the harm as unnecessary or wrong within their own cognitive framework, and possessed the agency to act differently in specific instances.

  When we apply this lens to your case of the Norman lord, the exculpation holds firm because the conceptual vocabulary of individual rights against feudal obligation simply did not exist for him or his contemporaries. He was operating within a closed moral universe where bondage was synonymous with order, and to blame him is to impose an anachronistic framework he could not have accessed. This stands in sharp contrast to Jefferson, and this is where your intuition about hypocrisy carries the most weight. Jefferson operated in a society without a mass abolitionist movement, yes, but he was not without critics, nor was he without the conceptual tools to understand the contradiction. He himself authored the language of equality and had private knowledge of slavery's cruelty, meaning the moral alternative was accessible to him internally even if it was not dominant socially. Your distinction between Jefferson and Columbus also remains coherent under this principle because of the variable of agency in system creation. Columbus was an architect who actively constructed a new machinery of extraction where none existed before, making him directly responsible for the instantiation of that harm. Jefferson was a beneficiary and maintainer of an inherited system, which mitigates his blame relative to Columbus even if his hypocrisy aggravates his blame relative to the Norman lord. You do not need to abandon the judgment that Jefferson is less blameworthy than Columbus; rather, you are weighing the blame of creation against the blame of maintenance, both of which are culpable but to different degrees.

  The case of Churchill further tests this principle regarding the separation of worldview and specific policy. Your intuition that his general imperial commitments are less blameworthy than his specific handling of the Bengal famine aligns with the distinction between structural conformity and discretionary choice. Imperialism was the background logic of British governance, a structural norm akin to the feudal order of the Norman lord, whereas the famine response involved specific resource allocations where alternatives were available and foreseeable. To blame Churchill for being an imperialist is to blame him for conforming to the hegemonic logic of his state, but to blame him for the famine is to blame him for a specific failure of agency where moral alternatives were accessible. This is not special pleading if the criterion is whether the agent had the power to choose differently in a specific instance without violating the fundamental laws of their society. The famine policies were a choice within the system, whereas the system itself was the water in which he swam.

  This brings us to the hypothetical case of the nineteenth-century industrialist who introduces a factory system he knows causes worker deaths but believes no economic alternative exists. Under the principle of accessible moral alternatives and discretionary agency, this figure warrants direct moral condemnation, closer to Columbus than to the Norman lord. While he may genuinely believe no economic alternative exists within the logic of his era, the harm is foreseeable and the technology to mitigate it may be possible even if costly. Unlike the Norman lord, who lacked the concept of rights, the nineteenth-century industrialist operated in an era where labor rights and safety were beginning to be conceptualized by critics and workers themselves. Furthermore, like Columbus, he is an architect introducing a system rather than merely inheriting one. The belief that no economic alternative exists is an ideological constraint, not a conceptual impossibility, and prioritizing economic logic over known human life when mitigation is possible constitutes a failure of moral agency. Therefore, the principle predicts that he is blameworthy, not because he violated the norms of his time, but because he had the agency to prioritize safety over profit and the conceptual access to know that human life held value independent of economic output.

  Ultimately, your judgments are consistent because you are instinctively tracking the availability of moral knowledge and the degree of active choice rather than simply looking at the calendar date. The man of his time defense fails when the individual possessed internal or local access to a better moral standard, or when they had the discretion to reduce harm without collapsing their world. You need not abandon your verdict on Jefferson's hypocrisy, Columbus's architecture of harm, Churchill's separable failures, or the Norman lord's excusability. Instead, you can unify them under the view that moral responsibility is bound to the horizon of the possible. We judge historical figures not by whether they were perfect by our standards, but by whether they betrayed the best standards available to them, and whether they built the cage or merely lived within it. I hope this helps clarify the structure of your own thinking on this difficult matter.

  Warmly,

  Your Correspondent
