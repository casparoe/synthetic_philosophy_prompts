answer: |-
  The Sterile-Batch case is a potent intervention in the cognitive penetration debate because it isolates the *online* causal role of belief from the *offline* retuning of expertise. To defend your reading, we must first exhaust the deflationary resources available to the defender of encapsulation. The strongest objections will not deny the behavioral data but will reinterpret the locus of the change.

  **The Deflationary Gauntlet**

  First, consider the **Signal Detection Theory (SDT) objection**. A psychophysicist will argue that Marta's sensitivity ($d'$) remains constant while her response criterion ($\beta$) shifts. Believing the batch is sterile, she requires a much higher threshold of evidence to report "infected." The "vanishing look" is merely a metaphor for her refusal to categorize ambiguous sensory data as sickness. On this view, the sensory signal—the mottling, the dulling—is still present in experience, but she ignores it.

  Second, there is the **Attentional Reallocation objection**. Cognitive states are permitted to influence where attention is directed. Upon hearing the joke, Marta shifts her attentional set from "search for rust" to "confirm health." This filters the input before it reaches the expert module. The change is not in the perceptual processing itself but in the pre-perceptual selection of information. The expert sensitivity is not switched off; it is simply starved of the specific feature-inputs it requires to fire.

  Third, the **Post-Perceptual Judgment objection** claims the experience remains constant, but the doxastic overlay changes. Marta still has the "sick look" experience, but her belief ("this is sterile") overrides her perceptual seeming in her report. She says "it looks healthy" because she infers that her experience must be illusory. The phenomenological report of the look vanishing is a confabulation or a shorthand for "I judge this to be healthy despite appearances."

  Fourth, and most philosophically subtle, is the **Enabling Condition objection**. Even if we grant that the belief causally enables the sensitivity, causation is not penetration. A light switch causes the light to shine, but the switch does not determine the color of the light. If the belief merely opens a gate for a module that then operates encapsulatedly, the belief is an external enablement, not an internal constituent of the perceptual state. Penetration requires cognition to shape the content, not just toggle the system's power.

  **The Argument for Gating as Penetration**

  These objections fail because they cannot account for the specific phenomenological and behavioral profile of the Sterile-Batch case without violating the constraints of the scenario.

  Against the **SDT objection**, the case stipulates that accuracy drops to *chance*. A criterion shift preserves sensitivity; you still detect the signal, you just don't report it. If Marta retained the "sick look," she would exhibit above-chance discrimination even if she refused to say "infected." The drop to chance indicates the signal is not being withheld; it is not being generated. Furthermore, the phenomenological report is explicit: the look *vanishes*. In philosophy of perception, absent reasons for skepticism, we must take first-person authority on phenomenology as data. If the experience changes, the perceptual state changes. SDT explains behavior, not experience.

  Against the **Attentional objection**, we must ask what drives the attentional shift. To shift attention from "rust" to "health" based on the proposition "this batch is sterile" requires the cognitive system to semantically evaluate the belief and translate it into perceptual settings. If this translation happens online, at the moment of experience, the perceptual system is not encapsulated from cognitive semantics. Moreover, attention usually enhances signals; it does not typically erase high-level properties learned through expertise while leaving low-level features intact. The disappearance of a learned high-level property ("sick look") while low-level features (color, shape) remain suggests the *interpretive module* itself is gated, not just the input.

  Against the **Post-Perceptual objection**, the immediacy of the change is decisive. Marta is "startled" by the change. If this were a judgment overriding a sensation, she would experience conflict (a sick look battling a healthy belief). She experiences none. The seamless shift indicates the cognitive state modifies the perceptual generation process itself, not the subsequent evaluation. The experience is cognitively saturated in real-time.

  This leaves the **Enabling Condition objection**. This is the strongest hurdle. However, the distinction between "gating" and "content-supplying" is less robust than the encapsulationist hopes. If a cognitive state is a necessary condition for a specific perceptual content to appear *at the moment of experience*, then the perceptual experience is counterfactually dependent on the cognitive state. Encapsulation requires that once processing begins, cognitive states are irrelevant. Here, the cognitive state is relevant to whether the processing occurs at all.

  More importantly, your insight identifies a false dichotomy in the literature. Penetration is typically defined as cognition altering *what* is seen (content). But cognition also determines *what can be* seen (availability). If the space of possible perceptual contents is constrained by occurrent belief, then belief shapes the nature of experience. The "gate" is not external like a light switch; it is internal to the perceptual-cognitive interface. The belief checks the permission slip for the sensitivity. This checking process is a cognitive operation integrated into the perceptual stream. Therefore, the perceptual state is not modularly sealed; it is cognitively permeable. The belief does not supply the content ("sick"), but it supplies the *condition of possibility* for that content. This is a profound form of penetration: it determines the representational vocabulary available to the subject in that moment.

  **Vulnerabilities and Conditions for Failure**

  This argument is most vulnerable on two fronts. First, it relies heavily on the veridicality of Marta's introspective report. If empirical investigation revealed that she still possessed unconscious sensitivity (e.g., via priming or physiological response) despite her report, the "vanishing" would be reclassified as a change in access consciousness rather than phenomenal consciousness. If the sensitivity persists unconsciously, the "gate" is merely blocking access to report, not altering the perceptual representation itself. For your argument to hold, it must be true that the perceptual representation itself is dissolved, not just hidden.

  Second, the argument fails if the "gate" is located too early in the processing stream. If the belief operates by suppressing motor output or decision mechanisms strictly post-perceptually, it is not penetration. You must establish that the locus of the gating is within the visual processing stream itself. This requires empirical validation that the neural correlates of the "sick look" are absent during the sterile belief, not just that the report is absent.

  **Verdict**

  Despite these vulnerabilities, the Sterile-Batch case successfully demonstrates that cognitive states can modulate the availability of perceptual contents in real-time. This modulation is a causal influence on the character of experience. Whether this influence supplies content or enables sensitivity is a distinction within penetration, not a distinction between penetration and encapsulation. The system is not encapsulated if its operational parameters are set by occurrent belief.

  \answer{Gating is penetration without supplying content}
