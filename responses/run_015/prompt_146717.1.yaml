  1. *The Is-Ought Smuggle:* "You're deriving normativity from descriptive psychology." Reply: Agency constitutively aims at coherence; violating it undermines the capacity to act itself. It's a condition of possibility for deliberation. Without it, you're just reacting, not acting. You can't deliberate without assuming a future deliberator. Weak Spot: Constitutive aims are controversial (Enoch). Concede: Admit this is constitutive normativity, not moral obligation.
  2. *The Fragmentation Loophole:* "Why can't I adopt a local, momentary identity?" Reply: You need to predict your future self to coordinate action. Fragmentation breaks coordination, making complex plans impossible to execute. You lose instrumental power. You become unreliable to yourself. Weak Spot: Short-term gains might outweigh long-term costs. Concede: Only binds agents committed to long-term projects.
  3. *Changing the Subject:* "Glaucon separates morality from self-interest." Reply: If justice is required for agency, the distinction collapses for planners. Self-interest requires agency. You can't want anything without being an agent. If agency requires justice, self-interest does too. Weak Spot: Glaucon assumes they come apart by definition. Concede: You're reframing the challenge, not answering it on his terms.
  4. *The Psychopath Counter:* "I can be diachronically unified and evil." Reply: Sustaining evil generates cognitive dissonance requiring psychic energy to maintain, reducing efficiency. It's costly to lie to yourself. Resources wasted on self-deception are resources lost. Weak Spot: Some agents lack reflective capacity. Concede: Applies only to reflective, planning agents.
  5. *Redefining Reason:* "This is just conceptual stipulation." Reply: Thin instrumentalism fails for extended agents. You need thick rationality to explain planning. It's not stipulation, it's structural. You can't plan without continuity. Weak Spot: Looks like moving the goalposts. Concede: You're proposing a thicker concept of instrumental rationality.

  3. The hidden killer
  The killer is the "Shmagency" objection. If the immoralist says, "I don't care about being a unified agent over time, I just want pleasure now," your constraint loses grip. You're assuming agency is constitutively normative. If they reject the constitutive aim of agency, you're begging the question against Glaucon. It looks like virtue ethics because you're saying "only a good agent persists," but Glaucon asks why be good. You need to show that rejecting agency is impossible for a deliberator, not just undesirable. If they can opt out of agency while deliberating, you lose.

  4. Concessions to open with
  Admit you aren't solving the "Why be moral?" question fully, just the "Why be rational?" subset. Concede that this doesn't prove justice is *good* in itself, only that injustice is *irrational* for a temporally extended agent. Acknowledge the is-ought worry explicitly so they know you see it. This disarms the ethicists. Tell them you're working within the space of reasons, not outside it.

  5. The reply that has to land
  The crucial move is linking diachronic coherence to *efficacy*, not just morality. To act instrumentally, you must rely on your future self to carry out plans. If you act unjustly/inconsistently, you undermine your own future reliability. You become unable to execute long-term projects. Therefore, even a selfish agent needs continuity to maximize utility. If this fails, you're left with mere momentary impulses, not agency. You must show that fragmentation is *costly* for any end, not just moral ones. This makes injustice instrumentally irrational, bypassing the moral demand.
