answer: |-
  **MEMORANDUM OF JOINT UNDERSTANDING AND RESIDUAL DISAGREEMENT**

  **TO:** The Collaborative Research Group on Collective Judgment
  **FROM:** The Mediation Committee on Social Epistemology
  **SUBJECT:** Framework for Adversarial Collaboration on Information Cascades
  **DATE:** October 26, 2023

  **1. AGREED CLAIMS**

  Both camps affirm the following substantive propositions regarding the structure of sequential social learning:

  1.  **Definition of Cascade:** An informational cascade occurs strictly when an agent's optimal action becomes independent of their private signal, conditioned on the public history of prior actions.
  2.  **Herding vs. Cascading:** Behavioral herding (correlated actions) is distinct from informational cascading; herding can occur without a cascade if agents share common signals or preferences.
  3.  **Individual vs. Collective Rationality:** An action can be Bayes-rational for an individual given the public history while simultaneously reducing the epistemic efficiency of the collective outcome.
  4.  **Information Discard:** An institution that publishes only a running tally of discrete choices discards the intensity and precision information contained in private signals.
  5.  **Stranded Information:** During a strict cascade, private information held by later movers is not aggregated into the public history and is effectively stranded.
  6.  **Cascade Breaking Condition:** A cascade can only be broken by a subsequent public signal or action whose informational weight exceeds the accumulated weight of the public history sustaining the cascade.
  7.  **Canonical Assumptions:** The canonical model assumes binary actions, exogenous fixed ordering, symmetric private signal precision, and a single decision pass without option to wait.
  8.  **Error Possibility:** In the canonical model, there is a non-zero probability that a cascade locks onto the incorrect option even when private signals are unbiased.
  9.  **Signal Noise:** Introducing noise into the observation of prior actions alters the mathematical stability of the cascade state.
  10. **Endogenous Timing:** Allowing agents to choose *when* to act changes the inference problem from purely sequential to a signaling game regarding timing.
  11. **Reputational Mimicry:** Concerns for reputation can produce action patterns observationally equivalent to informational cascades even when private information is strong.
  12. **Design Sensitivity:** Institutional rules regarding sequencing, disclosure, and incentives formally alter the topology of the information aggregation function.

  **2. DISAGREEMENTS TABLE**

  | Issue | Fragility Camp Proposition | Efficiency Camp Proposition | Classification |
  | :--- | :--- | :--- | :--- |
  | **Robustness** | Cascade lock-in persists under slight perturbations of noise, signal granularity, or timing delays. | Cascade lock-in dissolves rapidly when assumptions are relaxed to allow continuous signals or endogenous timing. | Factual (Model-dependent) |
  | **Prevalence** | Real-world herding episodes (markets, votes) are primarily driven by informational cascades stranding private data. | Real-world herding episodes are primarily driven by reputational conformity or shared priors, not informational neglect. | Empirical |
  | **Welfare Benchmark** | Collective performance should be measured by the tail risk of locked-in incorrect cascades (minimax error). | Collective performance should be measured by asymptotic convergence speed and average accuracy over repeated trials. | Normative |
  | **Intervention** | Institutional tampering (sequencing, incentives) is required to prevent brittle lock-in on wrong options. | Institutional tampering disrupts cheap information channels and typically leaves groups worse off than laissez-faire. | Normative/Counterfactual |

  **3. VERBAL DISPUTES**

  Several persistent arguments are identified as disputes over terminology rather than ontology. These must be resolved to isolate factual disagreement.

  *   **"Cascade" Definition:** The Fragility camp uses "cascade" to denote the strict informational state where private signals are ignored. The Efficiency camp often uses "cascade" to denote any strong correlation in behavior.
      *   *Substantive Question:* Does the strict state where signals are ignored persist in realistic environments? If yes, the Fragility definition is operationally necessary. If no, the Efficiency definition suffices.
  *   **"Rationality" Benchmark:** The Fragility camp implies "rational" should account for long-run truth-conduciveness. The Efficiency camp defines "rational" strictly as ex-ante expected utility maximization given current public history.
      *   *Substantive Question:* None. This is a definitional boundary. Both agree agents maximize expected utility; they disagree on whether the utility function should include collective epistemic welfare.
  *   **"Fragile" vs. "Stable":** The Fragility camp uses "fragile" to mean "prone to locking in error." The Efficiency camp uses "stable" to mean "quick to correct given new data."
      *   *Substantive Question:* What is the expected time-to-correction following a wrong lock-in? If correction is slow relative to the decision horizon, the system is fragile regardless of asymptotic stability.

  **4. CRUXES AND PREDICTION REGISTRY**

  To move beyond model semantics, both camps commit to the following empirical and theoretical tests.

  *   **Crux (a): Load-Bearing Assumptions**
      *   *Sub-question:* Are binary actions and fixed order necessary for cascade lock-in?
      *   *Test:* Idealized urn experiment. Agents draw balls (private signals) from an urn (Majority Red or Blue). Agents announce guess aloud. Variant: Agents may pay a cost to wait one round.
      *   *Fragility Prediction:* Waiting costs will not be high enough to break early cascades; lock-in persists.
      *   *Efficiency Prediction:* High-precision agents will wait, revealing information through timing, breaking the cascade.
      *   *Embarrassment:* Fragility is embarrassed if low-cost waiting breaks >80% of wrong cascades. Efficiency is embarrassed if waiting costs are incurred but cascades persist unchanged.
  *   **Crux (b): Information vs. Reputation**
      *   *Sub-question:* Is observed herding driven by information neglect or social pressure?
      *   *Test:* Committee voting. Condition A: Public roll-call vote. Condition B: Anonymous secret ballot with delayed aggregation.
      *   *Fragility Prediction:* Herding rates will remain high in Condition B (anonymous), proving informational cause.
      *   *Efficiency Prediction:* Herding rates will drop significantly in Condition B, proving reputational cause.
      *   *Embarrassment:* Efficiency is embarrassed if anonymity does not reduce herding by at least 50%. Fragility is embarrassed if anonymity eliminates herding entirely.
  *   **Crux (c): Welfare Benchmark**
      *   *Sub-question:* Should we optimize for speed or error avoidance?
      *   *Test:* Simulation of repeated market entry. Measure total payoff vs. frequency of catastrophic wrong-standard adoption.
      *   *Fragility Prediction:* Tail risk of wrong adoption dominates welfare calculations.
      *   *Efficiency Prediction: * Speed of convergence dominates welfare calculations.
      *   *Embarrassment:* Fragility is embarrassed if wrong adoption frequency is <1% in simulated realistic markets. Efficiency is embarrassed if speed gains are negligible compared to loss from wrong locks.
  *   **Crux (d): Mechanism Distinction**
      *   *Sub-question:* Are reputational and informational herding distinct mechanisms?
      *   *Test:* Incentive structure variation. Pay for accuracy vs. Pay for conformity.
      *   *Fragility Prediction:* Behavior changes little; informational weight dominates.
      *   *Efficiency Prediction:* Behavior shifts drastically; incentives drive the mechanism.
      *   *Embarrassment:* Efficiency is embarrassed if conformity incentives do not increase herding. Fragility is embarrassed if accuracy incentives eliminate herding.

  **5. JOINT VERDICT ON INSTITUTIONAL PROPOSALS**

  Both camps record predictions on three specific institutional designs.

  *   **Proposal 1: Blind First Round**
      *   *Mechanism:* All members record independent judgments before any tally is published, followed by one revision round.
      *   *Help (Fragility):* Reveals private information simultaneously, preventing early lock-in.
      *   *Hurt (Efficiency):* Destroys the information value of sequencing; delays decision without guaranteeing better aggregation.
      *   *Parameter Regime:* Fragility concedes net-negative if private signals are highly noisy (correlated error). Efficiency concedes net-positive if private signals are high-precision and independent.
      *   *Joint Status:* **Conditional Endorsement.** Endorsed only when signal precision is verified high.
  *   **Proposal 2: Informed-First Ordering**
      *   *Mechanism:* The member with the highest-precision private signal is deliberately placed last rather than first.
      *   *Help (Efficiency):* Prevents early low-precision agents from anchoring the group incorrectly.
      *   *Hurt (Fragility):* Risks creating a "dictator" effect where the last agent ignores all prior public history, wasting accumulated data.
      *   *Parameter Regime:* Efficiency concedes net-negative if signal precision variance is low. Fragility concedes net-positive if precision variance is high.
      *   *Joint Status:* **Joint Rejection.** Neither camp trusts the identification of "highest-precision" agents without costly verification.
  *   **Proposal 3: Contrarian Bounty**
      *   *Mechanism:* Reward for members whose final judgment proves correct while having been in the minority at the time they gave it.
      *   *Help (Fragility):* Incentivizes breaking cascades; prices dissent.
      *   *Hurt (Efficiency):* Distorts incentives to oppose the group regardless of evidence; creates noise.
      *   *Parameter Regime:* Fragility concedes net-negative if bounty encourages random dissent. Efficiency concedes net-positive if bounty successfully breaks wrong locks without increasing error rate.
      *   *Joint Status:* **Joint Rejection.** Both agree the incentive compatibility constraints are too difficult to calibrate without inducing perverse signaling.

  **6. CLOSING STATEMENT**

  We acknowledge that the canonical model establishes a possibility theorem for collective failure, but not necessarily a prevalence theorem for real-world institutions. A genuinely decisive study would require a natural experiment where sequencing order is exogenously randomized across large groups making high-stakes binary decisions with verifiable outcomes, while controlling for reputational visibility. No such dataset currently exists.

  **Interim Practical Recommendation:**
  Until such evidence is available, both camps agree that institutions should avoid publishing discrete running tallies during the deliberation phase. Instead, institutions should collect private judgments continuously and release aggregate statistics only after a fixed closure time. This minimizes the risk of cascade lock-in (satisfying Fragility) without imposing costly sequencing constraints (satisfying Efficiency), provided the closure time is not so long as to render the decision obsolete.

  **Signed,**

  **The Fragility Research Team**

  **The Efficiency Research Team**
