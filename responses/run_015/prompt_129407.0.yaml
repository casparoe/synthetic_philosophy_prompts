prompt: |-
  I have no philosophy training — I left school at eighteen, spent fifteen years as a logistics supervisor in a hospital outside Lyon, then did a two-year secondment inside a Japanese supplier of ours, where I watched people my age fall asleep upright at their desks and read in the paper about a man in his forties who died at work and was said to have been a victim of karoshi. Since coming back I have been reading about this on my own in the evenings, which is why I would rather you not point me at books, papers or authors: I have no library access, cannot check anything, and a set of names and titles would just be something I would have to take on faith. What I want instead is a specification. Before I read any more people arguing about how much we ought to work — the old Protestant idea that idleness is a moral failure, France's thirty-five hour week, the Japanese overwork deaths — I want to know what I should be demanding of an answer. Say the theory is supposed to be good enough for two jobs: telling me how many hours I myself should work, and telling me whether a rule like the thirty-five hour week should be law.

  Here is the raw material I keep going in circles with, which you can organize, add to, or throw out as you see fit. First, the willing workaholic: someone who genuinely likes seventy hours, is not coerced, suffers no obvious ill health, and would be made worse off by being stopped. Second, the fact that hours are not a purely private matter: if I stay late, I move the bar for everyone on my team, so a theory has to be able to object to a choice that is good for the chooser. Third, the karoshi cases, where as I understand it the person was often working on paper voluntarily and sometimes resented being sent home, which makes me doubt whether consent can do the work most theories want it to do. Fourth, a thing I have noticed and never seen discussed: free time seems to be a capacity that atrophies. The colleague who retired and came back part-time within six months, the Sunday-afternoon dread, the way the first two weeks of a long holiday are spent being miserable — the same fifteen extra hours a week appear to be worth much less to someone who has never had them, and possibly worth nothing at all. That worries me in both directions: it means maximise free time cannot be a raw requirement, but it also means a theory that counts free time only when it is used well has quietly reinstalled the work ethic under a different name. Fifth, the currency problem: forty hours in a call centre and forty hours in a workshop where you build something you can point at are not the same thing, so hours alone cannot be what we are measuring — but if not hours, then what, effort, autonomy, exhaustion, output, and why is a cap on hours the right lever on whichever it is? Sixth, the person whose hours protect other people: the nurse, the only electrician in a village, the father who covers a shift nobody else will take. Seventh, the question of whether we are even arguing about the right variable, since if the real point of the French law was to spread a fixed amount of work across more people rather than to give anyone more leisure, then judging working-time rules by how much free time they produce may be aimed at the wrong target entirely. Eighth, and this is the one I feel strongest about: the guilt many of us feel when idle is itself something the work ethic produced, so a theory has to decide whether that guilt is evidence about the value of work or merely a symptom to be explained away.

  Do not give me a neutral menu. I want you to commit. Sort the list into requirements you take to be non-negotiable and demands you think are just the prejudices of one side — say the thirty-five hour week is not self-evidently the right instrument, or that the workaholic does have to be accommodated, if that is where you land — and give your reason in each case. Say which two requirements you think most likely cannot be satisfied together, since if the list is unsatisfiable that is the most useful thing you can tell me. Say which single requirement does the most work in ruling out the popular answers. And take a position on the currency question: either hours can be the thing we regulate or they cannot, and I want to hear the argument for whichever you pick. Where you are speculating rather than confident, mark it as such rather than hedging the whole answer into a survey.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** No formal philosophy training. Left school at 18. 15 years as a hospital logistics supervisor (Lyon). 2 years in Japan (witnessed *karoshi* culture). Self-educated on work ethics/philosophy in evenings. No library access.
      *   **Constraint:** Do *not* recommend books, papers, or authors. No "further reading" lists. The user wants a *specification*, not a bibliography.
      *   **Goal:** A specification for a theory of working time. This theory must answer two questions: (1) How many hours should *I* work? (2) Should a rule like the 35-hour week be law?
      *   **Input Material:** Eight specific points/observations provided by the user (Workaholic, Social Externalities, Karoshi/Consent, Atrophy of Leisure, Currency Problem, Essential Workers, Distribution vs. Leisure, Internalized Guilt).
      *   **Directives:**
          *   Do not give a neutral menu. Commit.
          *   Sort requirements into "Non-negotiable" vs. "Prejudices/Dispensable."
          *   Identify two requirements that likely cannot be satisfied together (tension/trade-off).
          *   Identify the single requirement that does the most work in ruling out popular answers.
          *   Take a position on the "Currency Question" (Hours vs. Something Else).
          *   Mark speculation vs. confidence.

  2.  **Deconstruct the Input Material (The 8 Points):**
      1.  *The Willing Workaholic:* Autonomy vs. Paternalism.
      2.  *Social Externalities:* My work affects your expectations (the "ratchet effect").
      3.  *Karoshi/Consent:* Consent is unreliable under systemic pressure.
      4.  *Atrophy of Leisure:* Leisure is a skill; unused capacity loses value. Maximizing leisure isn't always good; valuing only "good" leisure is moralizing.
      5.  *Currency Problem:* 40 hours call center $\neq$ 40 hours workshop. What are we measuring?
      6.  *Essential Workers:* Some *need* to work long/odd hours for social necessity.
      7.  *Distribution vs. Leisure:* Is the goal free time or job sharing?
      8.  *Internalized Guilt:* Is guilt evidence or a symptom?

  3.  **Formulate the Specification (The Commitment):**
      *   *Tone:* Direct, respectful of experience, analytical but not academic. Acknowledge the user's background (logistics, hospital, Japan) as valid data.
      *   *Structure:*
          1.  Introduction (Acknowledging the constraint and the task).
          2.  Non-Negotiable Requirements (The Core).
          3.  Dispensable/Prejudiced Demands (What to discard).
          4.  The Incompatibility (The Trade-off).
          5.  The Key Ruling-Out Requirement.
          6.  The Currency Question (Hours vs. Other).
          7.  Conclusion.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user's approach. They are asking for *criteria of validity*, not conclusions. This is meta-ethics/political philosophy applied to labor.

      *   **Non-Negotiables:**
          *   *Consent is Insufficient (Point 3 & 8):* You can't rely on "voluntary" overtime because the system shapes the desire. The guilt (Point 8) is a symptom, not data.
          *   *Externalities Matter (Point 2):* Work isn't private. The "ratchet effect" on colleagues justifies regulation.
          *   *Capacity for Leisure (Point 4):* A theory must account for the *ability* to use free time, not just the existence of it. But it shouldn't judge *how* it's used.
          *   *Social Necessity (Point 6):* Essential services exist. A theory can't just say "no one works more than X" if the hospital burns down.

      *   **Dispensable/Prejudices:**
          *   *The Workaholic's Absolute Right (Point 1):* If their work harms the collective norm (Point 2), their preference can be overridden. We discard the idea that "no harm to self" equals "no right to regulate."
          *   *Leisure as Moral Good (Point 4b):* We discard the idea that free time must be "productive" or "enriching" to count. That reinstates the work ethic.
          *   *Distribution as Primary Goal (Point 7):* While job sharing is a side effect, the primary metric should be human sustainability, not just spreading tasks.

      *   **The Incompatibility (The Hard Trade-off):**
          *   *Individual Autonomy vs. Collective Norms.* You cannot fully satisfy the "Willing Workaholic" (Point 1) while effectively preventing the "Ratchet Effect" (Point 2). If you allow unlimited voluntary overtime, the bar moves. If you cap it, you harm the workaholic. One must yield. I will argue the Collective Norm must yield priority because the harm of the ratchet is systemic, whereas the harm to the workaholic is individual (and potentially illusory due to Point 3).

      *   **The Key Ruling-Out Requirement:**
          *   *Consent is Insufficient (Point 3).* This kills the libertarian "let them choose" argument and the pure "35-hour is freedom" argument if it ignores *why* people work. It forces the theory to look at power structures, not just contracts.

      *   **The Currency Question:**
          *   *Position:* Hours *must* be the regulatory lever, even if they are an imperfect measure of burden.
          *   *Reasoning:* Effort, autonomy, and exhaustion are unmeasurable at scale. You can't legislate "exhaustion." You *can* legislate time. Time is the proxy. It's a blunt instrument, but the only one that fits a legal specification (like the 35-hour week). We regulate the *container* because we cannot regulate the *content* of every job.

  5.  **Refining and Polishing:**
      *   *Check Constraints:* Did I name any authors? No. Did I recommend books? No. Did I commit? Yes.
      *   *Tone Check:* Is it too academic? Keep it grounded. Use the user's examples (hospital, logistics).
      *   *Speculation Marking:* Ensure I flag where I'm making a judgment call vs. stating a logical necessity.
      *   *Addressing the "Guilt":* Make sure to explicitly state that guilt is a symptom (Point 8).

  6.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe argue that "Effort" is the currency.
      *   *Correction:* No, the user asked for a specification for *law*. You can't lawfully measure effort. You can measure time. Stick to "Hours as Proxy."
      *   *Initial thought:* Maybe say the Workaholic must be protected.
      *   *Correction:* The user's Point 2 (ratchet effect) is strong. In a logistics team, if one person does 70 hours, the supervisor expects 70 from everyone. The collective good outweighs the individual preference here.
      *   *Refining the "Atrophy" point:* This is subtle. If leisure atrophies, giving more time suddenly might be useless. The theory needs a *transition* mechanism. I should mention this.

  7.  **Final Review against User Prompt:**
      *   "Do not give me a neutral menu." -> I will take a stance.
      *   "Sort the list into requirements..." -> Will do.
      *   "Say which two requirements... cannot be satisfied together." -> Will do.
      *   "Say which single requirement does the most work..." -> Will do.
      *   "Take a position on the currency question." -> Will do.
      *   "Mark speculation." -> Will do.

  8.  **Final Polish:** Ensure the voice sounds like a peer analyzing a problem, not a lecturer teaching a student. Acknowledge the Lyon/Japan experience as legitimate empirical data. (Proceed to generate output).

  *(Self-Correction Note on "Speculation"):* I need to be careful not to hedge *everything*. The user wants commitment. I will only mark speculation where the philosophical ground is genuinely unsettled or where I am extrapolating from their specific anecdotes to a general rule.

  *(Final Plan):*
  1.  **Preamble:** Acknowledge the validity of the "specification" approach.
  2.  **Non-Negotiables:** (Consent is flawed, Externalities are real, Time is the only measurable proxy).
  3.  **Dispensable:** (Workaholic absolute freedom, Leisure quality judgment).
  4.  **The Conflict:** Autonomy vs. Norms.
  5.  **The Killer Constraint:** The unreliability of consent.
  6.  **The Currency:** Hours as a regulatory proxy.
  7.  **Closing:** Summary of the specification.

