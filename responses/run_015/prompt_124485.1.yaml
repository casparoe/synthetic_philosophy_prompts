      *   *Type 1: Gone/Nothing Left.* Pure sunk cost. In RL: A reward signal $r_{t-k}$ that has already been received and does not affect transition dynamics $P(s'|s,a)$ or future rewards. It's integrated into the return $G_t$ but doesn't influence $\arg\max_a Q(s_t, a)$.
      *   *Type 2: Gone/Evidence.* In RL: This is Bayesian updating on hidden parameters. The fact that you spent 4 years writing is data $D$. It updates the belief state $b(\theta)$ about parameters $\theta$ (e.g., "am I a writer?", "is the book good?"). This isn't sunk cost; it's *observation*.
