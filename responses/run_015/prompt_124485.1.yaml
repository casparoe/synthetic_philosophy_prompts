      *   *Standard Econ Argument:* Maximize expected future utility. Past costs are constant offsets in the objective function. $\arg\max_a \sum \gamma^t R_t$. If $C_{past}$ is added to all outcomes, it cancels out in the comparison.
      *   *RL Translation:* The Value Function $V(s)$ or $Q(s, a)$ represents expected *future* return. The history leading to $s$ is irrelevant *if* $s$ is truly Markov.
