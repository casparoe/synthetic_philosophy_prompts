  5. Determine the implications of your account for scientific realism by asking whether knowledge from non-empirical episodes supports inference to the best explanation. This belongs last because it relies on the prior four steps to establish that knowledge is produced at all and is tractable given your analytic background, offering payoff by connecting method to metaphysics, though it would drop if the project remains strictly methodological.
