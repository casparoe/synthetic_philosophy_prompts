      *   *Premise 2:* The "loop" must still exist (behavior changes after classification), so where does the feedback come from?
      *   *Mechanism:* It comes from the *ecosystem*. Teachers change seating. Parents change discipline strategies. Medication is administered. Accommodations are granted.
      *   *Conclusion:* This is a *second-order* looping effect. It's not Person $\leftrightarrow$ Label. It's (Person + Environment) $\leftrightarrow$ Label.
      *   *Implication for "Reality":* If the loop is mediated by institutions, the "kind" is less about an internal essence and more about a *relational fit* between a brain and a specific social structure (schooling). This makes the kind less stable if the environment changes, but arguably more "real" in terms of social consequence.

