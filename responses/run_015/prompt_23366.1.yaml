      *   *Interactive Kinds:* People. Classification changes the people. They become aware of the label and act accordingly.
      *   *The Looping Effect:* Classification $\rightarrow$ Awareness $\rightarrow$ Behavior Change $\rightarrow$ Classification Adjustment.
      *   *Hacking's Paradigm Cases:* The multiple personality disorder patient, the homosexual, the juvenile delinquent. These rely heavily on *self-conception*.

  3.  **Develop the Counter-Argument (The "Childhood/ADHD" Case):**
