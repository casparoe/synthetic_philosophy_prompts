  ## 8. Potential Pitfalls and Mitigation Strategies

  **Pitfall 1: The "Triviality" Trap.**
  It is possible that by allowing incompleteness, the model becomes trivial. For example, if no alternatives are comparable across frames, *any* selection rule might satisfy the axioms because the axioms don't constrain cross-frame choices.
  *Mitigation:* I will add a "Non-Triviality" condition to the axioms. The rule must be able to reject an alternative in some circumstances. If the model allows literally any outcome, I will tighten the Modified Pareto condition to force more constraints.

  **Pitfall 2: The "Meta-Dictator" Problem.**
  I suspect that while we might avoid a voter-dictator, we might create a "frame-dictator" (e.g., Budget always beats Aesthetics). This might be functionally equivalent to a dictatorship in practice.
  *Mitigation:* I will explicitly analyze this in the "Success/Failure" section. If the only way to get a singleton winner is to make one frame dominant, I will classify this as a "structural dictatorship" and argue that the impossibility has shifted from voters to criteria.

  **Pitfall 3: Mathematical Complexity.**
  I might encounter a logical step that requires knowledge of lattice theory or order theory that I do not possess.
  *Mitigation:* I will stick to binary relations and set operations. If I need to characterize the structure of the frames, I will treat them as simple sets rather than complex algebraic structures. I will consult the sponsor immediately if I hit a wall.

  **Pitfall 4: Lack of Data.**
  Committee minutes might be too vague to determine how frames were weighed.
  *Mitigation:* I will construct hypothetical scenarios based on the committee's stated mandates if actual data is insufficient. I will be transparent in the paper that these are reconstructed models based on public guidelines.

  ## 9. Conclusion: Significance of the Study

  This independent study addresses a fundamental tension in democratic theory. Arrow's theorem is often used to argue that perfect democracy is mathematically impossible. My friend argues this makes the theorem irrelevant; I argue it makes the assumptions suspect. By proposing that human preferences are structurally fragmented into incommensurable frames, I am testing whether the impossibility is a feature of aggregation itself or a feature of the *coherence* we demand from voters.

  If I succeed in finding a working rule, it suggests that democratic groups can avoid dictatorship by acknowledging the limits of comparability. They can make decisions without forcing voters to compare apples to oranges. If I fail, and the impossibility re-emerges at the frame level, it suggests that the demand for a single collective decision inevitably requires a tyrannical structure, whether over voters or over criteria.

  Either outcome clarifies the boundary between logical possibility and political reality. It moves the discussion from "Arrow is wrong" to "Arrow is right, unless we change the structure of value." This is a nuanced position that deserves rigorous exploration. The proposed methodology is tight, feasible within one semester, and avoids unnecessary mathematical abstraction while maintaining logical rigor. It bridges the gap between the "logic puzzle" critique and the formal reality of social choice theory.

