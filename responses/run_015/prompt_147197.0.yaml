  ### Appendix: Clarification of Mathematical Notation (For Proposal Clarity)

  *To ensure the faculty sponsor understands the level of math involved, I include this brief note on the notation I intend to use.*

  I will use standard set-theoretic notation.
  $X$: Set of alternatives.
  $\mathcal{F}$: Set of frames (subsets of $X$).
  $R_i$: Preference relation for voter $i$.
  $P_i$: Strict preference ($x P_i y$ means $x$ is strictly preferred to $y$).
  $I_i$: Indifference.
  $\emptyset$: Empty set.

  I will avoid calculus, topology, or probability theory. The logic will be propositional and predicate logic applied to finite sets. For example, proving a rule is non-dictatorial will involve showing $\exists$ a profile where the social choice does not match voter $i$'s top choice, for all $i$.

  This confirms the project is within the scope of an advanced undergraduate independent study in philosophy, economics, or political science.
