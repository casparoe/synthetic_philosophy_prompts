  # Proposal for Independent Study: Framed Incommensurability and Social Choice

  **Title:** Beyond Universal Domain: Investigating Social Choice Under Localized Comparability and Framed Preferences

  **Student Name:** [Your Name]
  **Term:** [Semester/Year]
  **Faculty Sponsor:** [Name]

  ## 1. Introduction: The Debate and the Hypothesis

  The impetus for this proposed independent study arises from a fundamental disagreement regarding the practical relevance of Arrow's Impossibility Theorem. In standard social choice theory, Arrow's theorem is often presented as a definitive limit on democratic aggregation: no ranked voting system can convert the preferences of individuals into a community-wide ranking while satisfying a set of reasonable criteria (unrestricted domain, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives). My colleague argues that this result is merely a "logic puzzle"—a mathematical curiosity that relies on assumptions so strict they never hold in real-world groups. He contends that because real voters are inconsistent, strategic, or indifferent, the theorem's bite is neutralized by the messiness of reality. He believes the theorem is a "ghost" that haunts textbooks but never bites actual committees.

  I argue the opposite, but with a crucial modification. I believe Arrow's theorem bites not because voters are messy, but because the standard model assumes voters are *too* coherent. Specifically, the theorem relies on the assumption of "Universal Domain" coupled with "Completeness." This requires every voter to be able to compare every possible alternative against every other alternative in a transitive chain. In reality, human decision-making is often structured by "frames" or contexts. A voter might have a strict, transitive preference order regarding budget constraints (Frame A) and a separate, strict order regarding aesthetic quality (Frame B), but find any comparison between a budget option and an aesthetic option to be genuinely incommensurable. They cannot say whether saving money is "better" than better design in the abstract; they can only judge within the criteria.

  If preferences are transitive only inside frames but incomparable across them, the logical structure required for Arrow's impossibility proof may collapse. The chain of transitivity that allows the theorem to propagate a dictatorship might be broken at the boundaries between frames. Arrow's proof works by linking pairs of alternatives together. If $x$ is preferred to $y$, and $y$ to $z$, then $x$ must be preferred to $z$. This transitivity, applied across the entire set $X$, allows the theorem to show that if a group is decisive over one pair of alternatives, they must be decisive over all pairs, eventually collapsing into a dictatorship. If the link between $y$ and $z$ is severed because they belong to different frames, the chain breaks.

  However, this raises a new question: if we cannot compare across frames, how do we make a final decision? Does the impossibility simply re-emerge at the stage where we try to aggregate the frames themselves? If we need to pick a single winner, we eventually have to compare the winner of the Budget frame against the winner of the Aesthetics frame. If we do that, do we reconstruct the conditions for the theorem?

  This independent study proposes to formalize this intuition. Over the course of one semester, I will develop a modified social choice model that replaces Arrow's Universal Domain and Completeness axioms with a "Localized Comparability" axiom. I will investigate whether a non-dictatorial aggregation rule exists under these conditions. The study will combine formal logical modeling with an empirical test against two actual committee decision protocols. The goal is not merely to critique Arrow, but to determine if "framed incommensurability" offers a viable escape route from impossibility results without resorting to cardinal utility or interpersonal comparisons. I aim to resolve the argument with my friend by showing whether the theorem is avoided by structural incompleteness, or whether it merely hides until the final decision is forced.

  ## 2. Theoretical Background: Why the Standard Literature Leaves This Open

  To understand the contribution of this study, it is necessary to briefly outline why standard social choice literature does not currently resolve this specific question. Kenneth Arrow's original formulation, and the subsequent refinements by scholars like Amartya Sen, operate within a specific mathematical container. The standard model assumes a set of alternatives $X$ and a set of voters $V$. Each voter $i$ possesses a preference relation $R_i$ over $X$.

  The critical axiom for this proposal is **Completeness**. Completeness requires that for any two alternatives $x$ and $y$ in $X$, the voter must either prefer $x$ to $y$, prefer $y$ to $x$, or be indifferent between them. There is no option for "I cannot compare these." This is coupled with **Universal Domain**, which means the aggregation rule must work for any possible profile of these complete preference orders.

  Arrow's proof relies heavily on the ability to construct specific preference profiles that link alternatives together in long chains. If $x$ is preferred to $y$, and $y$ to $z$, then $x$ must be preferred to $z$. This transitivity, applied across the entire set $X$, allows the theorem to show that if a group is decisive over one pair of alternatives, they must be decisive over all pairs, eventually collapsing into a dictatorship.

  The literature does address incomplete preferences. Sen, for example, has written extensively on preference relations that are not complete orders. However, the standard treatment of incompleteness usually views it as a deficiency to be managed or completed, often by assuming that if a comparison is missing, it is due to indifference or lack of information. The literature rarely treats incompleteness as a structural feature of rationality itself—where a voter *refuses* or is *unable* to compare $x$ and $y$ because they belong to different categories of value.

  Furthermore, existing work on "multi-criteria decision making" often bypasses the impossibility problem by assigning weights to criteria (e.g., Budget is 60%, Aesthetics is 40%). This effectively completes the preferences by imposing a meta-frame. My proposal differs because I want to investigate the scenario where no such meta-frame exists. If the frames are genuinely incommensurable, we cannot simply weight them. We must aggregate decisions without a common currency of value.

  This leaves a gap in the theory. If we restrict the domain of admissible preferences to those that are only complete within subsets (frames) of $X$, does Arrow's impossibility hold? Some restricted domain results exist (such as single-peaked preferences), but those usually maintain completeness within the domain. They restrict *how* people order things, not *what* they can compare. This study targets the comparability structure itself. By formally defining "Localized Comparability," I aim to test whether the logical machinery of Arrow's theorem breaks when the transitivity chains are severed by frame boundaries.

  My friend's argument is that the theorem doesn't bite because people aren't rational. My counter-argument is that the theorem doesn't bite because people are *differently* rational—rationally bounded by frames. This study tests that counter-argument.

  ## 3. Proposed Formal Model: Frames and Localized Axioms

  The core of this independent study will be the construction of a formal model that modifies the standard social choice framework. I will define the components precisely to ensure the logical analysis is rigorous. This section outlines the mathematical sandbox I will be working in.

  **3.1 The Structure of Alternatives and Frames**
  Let $X$ be a finite set of alternatives, with $|X| \geq 3$.
  Let $\mathcal{F} = \{F_1, F_2, ..., F_k\}$ be a partition of $X$. These subsets $F_j$ are the "frames."
  For example, in a hiring committee, $X$ might be the set of all candidates. $F_1$ could be the subset of candidates evaluated on research output, and $F_2$ on teaching philosophy. In a more abstract sense, the frames represent criteria dimensions where comparison is meaningful. The partition property means every alternative belongs to exactly one frame. This simplifies the model by preventing overlap, though I will note in the limitations if overlap becomes necessary.

  **3.2 Localized Preferences**
  In the standard model, a voter's preference is a binary relation $R_i$ on $X \times X$. In this proposed model, a voter's preference is a set of relations $\{R_{i1}, R_{i2}, ..., R_{ik}\}$, where each $R_{ij}$ is a preference relation defined only on $F_j \times F_j$.

  **Axiom 1: Localized Completeness**
  For every voter $i$ and every frame $F_j$, and for every pair $x, y \in F_j$, either $x R_{ij} y$ or $y R_{ij} x$ (or both).
  *Crucially:* If $x \in F_a$ and $y \in F_b$ where $a \neq b$, then neither $x R_i y$ nor $y R_i x$ holds. The relation is undefined. This is the core departure from Arrow.

  **Axiom 2: Localized Transitivity**
  For every voter $i$ and every frame $F_j$, if $x R_{ij} y$ and $y R_{ij} z$, then $x R_{ij} z$ for all $x, y, z \in F_j$.
  There is no requirement for transitivity across frames. If $x \in F_1$ is "better" than $y \in F_1$, and $z \in F_2$ is "better" than $w \in F_2$, there is no logical constraint linking $x$ to $z$.

  **3.3 The Aggregation Problem**
  The goal of a Social Aggregation Rule (SAR) in this context is to produce a social outcome based on the profile of localized preferences. Here we face a design choice that will be central to the study. Does the SAR output a global ranking (which would require completing the preferences) or a choice set?
  Given the hypothesis of incommensurability, demanding a global linear ranking seems to violate the spirit of the model. Therefore, I will define the SAR as producing a **Social Choice Set** $C \subseteq X$.
  The rule takes the profile of localized orders and returns a non-empty subset of winners.

  **3.4 Modified Social Choice Axioms**
  To test for impossibility, we need to translate Arrow's conditions into this framed context.

  *Modified Pareto Condition:* If for some frame $F_j$, all voters prefer $x$ to $y$ (where $x, y \in F_j$), then $y$ cannot be in the Social Choice Set $C$ unless $x$ is also in $C$. (We cannot demand $y$ is never chosen if $x$ and $y$ are in different frames, because voters cannot compare them).

  *Modified Independence of Irrelevant Alternatives (IIA):* The social choice between $x$ and $y$ should depend only on individual preferences between $x$ and $y$. In this model, this applies only if $x$ and $y$ are in the same frame. If they are in different frames, their selection depends on the aggregation of the frames themselves.

  *Non-Dictatorship:* There is no single voter $i$ such that for every frame $F_j$, the social preference within $F_j$ always matches $i$'s preference within $F_j$, AND there is no single voter who dictates the weighting of the frames.

  **3.5 The Core Question**
  The mathematical investigation will focus on whether a SAR exists that satisfies these modified axioms.
  *Scenario A:* The impossibility vanishes. Because preferences are not linked across frames, we can select a winner from $F_1$ and a winner from $F_2$ without violating transitivity, resulting in a choice set $C = \{w_1, w_2\}$. This is a "tie" across frames, but it is a valid non-dictatorial outcome.
  *Scenario B:* The impossibility re-emerges. To make a final decision (a singleton set $C = \{w\}$), we must aggregate the frames. If we treat the frames as "meta-alternatives," do we reconstruct the conditions for Arrow's theorem at the higher level? If we need to rank Frame 1 against Frame 2 to pick a winner, and voters have preferences over frames, we might be back to square one.

  This formalization provides the sandbox for the semester's work. It moves the debate from "Arrow is unrealistic" to "Arrow is unrealistic *unless* we structure incompleteness this way, in which case..."

  ## 4. Methodology: Formal Modeling and Protocol Testing

  The study will proceed in two parallel tracks: a theoretical track focused on formal logic and existence proofs, and an empirical track focused on observing how real committees handle this specific structural problem. This dual approach ensures that the mathematical model remains grounded in practical decision-making behaviors.

  **4.1 Track One: Formal Modeling and Logical Analysis**
  The first ten weeks will be dedicated to the mathematical development. I will not be attempting to prove a general theorem for infinite sets, which would require topology and measure theory beyond the scope of a one-semester undergraduate study. Instead, I will focus on finite combinatorics.

  *Step 1: Existence Construction.* I will attempt to construct a specific aggregation rule that works under the Localized Comparability axioms. A likely candidate is a "Frame-Condorcet" rule. Within each frame $F_j$, we find the Condorcet winner (the option that beats all others in that frame). If a Condorcet winner exists in every frame, the Social Choice Set is the collection of these winners. I will test this rule against the Modified Pareto and IIA axioms.
  *Step 2: The Singleton Problem.* I will then investigate whether we can reduce the Social Choice Set to a single winner without a dictator. This involves modeling the "Frame Aggregation" problem. If voters are asked to rank the frames (e.g., "Is Budget more important than Aesthetics?"), does this reintroduce Universal Domain? I will model this as a two-stage voting process.
  *Step 3: Impossibility Check.* If I cannot construct a rule, I will attempt to sketch a proof of impossibility. This would involve showing that any rule that forces a singleton choice must violate Non-Dictatorship or Modified Pareto. Given the one-semester constraint, a rigorous proof might be too ambitious, so I will aim for a "proof sketch" or a counter-example demonstration using small numbers (e.g., 3 voters, 2 frames, 3 alternatives per frame).

  **4.2 Track Two: Committee Protocol Analysis**
  To ensure the model is not purely abstract, I will analyze the decision protocols of two actual committees. This provides a reality check on whether "framed incommensurability" is how groups actually operate.

  *Case Study 1: University Hiring Committee.*
  I will examine the protocol of a hypothetical or anonymized academic hiring committee. Typically, these committees evaluate candidates on distinct criteria: Research, Teaching, and Service. Often, these are discussed in separate phases. A candidate might be ranked 1st in Research and 3rd in Teaching. The final decision often involves a debate that implicitly weighs these frames.
  *Data Collection:* I will review public minutes (if available) or interview a faculty member who has served on such a committee. I will look for evidence of "incommensurability." Do they explicitly say, "We cannot compare these candidates because one excels in research and the other in teaching"? Or do they force a comparison?
  *Testing the Model:* I will map their actual decision process to my formal model. Did they use a rule that allowed multiple winners (shortlisting)? Did they impose a dictator (the Chair)? Did they aggregate frames implicitly?

  *Case Study 2: Urban Design Review Board.*
  City planning committees often face trade-offs between zoning constraints (legal/budget frames) and design aesthetics (visual frames). These are often legally distinct mandates.
  *Data Collection:* I will review public records of design review meetings where projects were approved or denied.
  *Testing the Model:* I will analyze whether the board treats these criteria as separable frames. If a project fails the budget frame but passes the aesthetic frame, is it rejected outright (lexicographic ordering) or is there a trade-off? This tests whether the "Localized Comparability" axiom holds in practice. Do voters (board members) refuse to compare across frames, or do they naturally create a meta-frame?

  **4.3 Synthesis**
  The final phase will involve comparing the formal results with the empirical observations. If the formal model shows that a non-dictatorial rule exists only if we allow multiple winners (a choice set), do the real committees accept multiple winners (e.g., sending two candidates to the final round)? If the committees insist on a single winner, do they violate the "Localized Comparability" axiom by forcing comparisons? This synthesis will answer whether the theoretical escape from Arrow's theorem is practically usable.

  ## 5. Success and Failure Conditions

  It is vital to define what constitutes a successful outcome for this independent study, given the high difficulty of social choice theory.

  **Success:**
  1.  **Formal:** I successfully define the "Localized Comparability" axioms and demonstrate at least one aggregation rule (even if it outputs a set rather than a single winner) that satisfies Modified Pareto, Modified IIA, and Non-Dictatorship.
  2.  **Empirical:** I demonstrate that at least one of the case study committees uses a decision protocol that aligns with the framed model (e.g., they separate criteria and do not trade off between them until a final veto stage).
  3.  **Conceptual:** I provide a clear explanation of *why* the impossibility is avoided (e.g., "The transitivity chain is broken at the frame boundary").

  **Failure (or Limited Success):**
  1.  **Re-emergence:** I prove (or demonstrate via counter-example) that as soon as the group requires a single winner, the impossibility returns at the frame-aggregation stage. This is still a valuable result—it would show that Arrow's theorem is robust even against framed preferences, provided a final decision is needed.
  2.  **Model Breakdown:** I find that real committees do not actually use framed preferences; they naturally convert everything into a single utility scale (e.g., "overall fit"). This would suggest the axiom of Localized Comparability is descriptively inaccurate, even if logically sound.
  3.  **Mathematical Impasse:** I am unable to complete the formal proof or construction due to the complexity of the logic. In this case, success would be defined as a rigorous description of the obstacle encountered.

  I want to be clear that finding an impossibility result is not a failure of the study; it is a resolution of the hypothesis. The study fails only if I cannot determine whether the rule exists or not.

  ## 6. Feasibility and Scope: The One-Semester Constraint

  This is the most critical section of the proposal. Social choice theory is notoriously difficult, and Arrow's original proof is subtle. Attempting to generalize it or modify its axioms within 15 weeks is ambitious. I need to be honest about the risks and how I will mitigate them to ensure completion without drifting into advanced mathematics that I am not prepared for.

  **6.1 Avoiding Topology and Advanced Logic**
  General social choice theory often relies on topology (e.g., using fixed-point theorems to prove existence of equilibria) or advanced set theory (infinite sets, ultrafilters). I explicitly will not attempt this.
  *Mitigation:* I will restrict the model to **finite sets**. I will assume a finite number of voters and a finite number of alternatives. This allows me to use combinatorial logic and basic set theory, which are within my current competency. I will not seek a general theorem for any $n$ voters, but rather investigate small cases ($n=3$) to look for patterns. If a rule works for $n=3$, it suggests existence. If it fails for $n=3$, it suggests impossibility.

  **6.2 Scope of the Formal Proof**
  I will not attempt to prove a new "Framed Arrow Theorem." That is likely too large a task. Instead, I will aim for an **Existence Proof**. I will try to build *one* working rule. Constructing an example is easier than proving no examples exist. If I can build a rule that works, I have answered the prompt ("can we build a non-dictatorial aggregation rule?"). If I try to build one and consistently fail due to a specific logical contradiction, I will document that contradiction as evidence of impossibility.

  **6.3 Scope of the Empirical Work**
  I will not conduct full ethnographic fieldwork. That requires IRB approval and too much time.
  *Mitigation:* I will use **publicly available records** (minutes, voting logs) and **one or two informal interviews** with acquaintances who serve on such committees. I will treat these as "protocol illustrations" rather than rigorous sociological data. The goal is to check if the *logic* of the frames exists in practice, not to publish a sociological paper.

  **6.4 Prerequisites and Preparation**
  I have completed courses in Logic and Game Theory, which provides the necessary background in preference relations, transitivity, and basic proof techniques. I am comfortable with set notation and logical quantifiers. I do not have a background in Topology, which is why I have excluded it from the method. I will rely on the faculty sponsor for guidance if I encounter a logical step that seems to require more advanced tools.

  **6.5 Time Management**
  The semester is short. I will dedicate the first month purely to defining the axioms. If I spend too long trying to perfect the definitions, I will not have time for the analysis. I will set a hard deadline at Week 6 to freeze the formal model and begin the analysis, even if the definitions are not "perfect."

