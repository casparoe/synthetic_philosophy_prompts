      *   **The Dilemma:**
          *   *Substantivalism:* Points of $M$ have independent identity. Then $(M, g, T)$ and $(M, g', T')$ are distinct physical worlds (metric values differ at point $p \in H$). Since initial data outside $H$ doesn't fix the interior, GR is indeterministic.
