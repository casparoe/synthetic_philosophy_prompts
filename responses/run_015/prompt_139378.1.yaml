      *   *Correction:* In ML, we can query the hold-out set. In the Hole Argument, you cannot "query" point $p$ without using the fields themselves. The coordinates are not observable.
      *   *ML Analogy:* It's not a hold-out set. It's like having two networks where the hidden unit permutations are scrambled, but you *label* the hidden units. If you insist Unit 1 is "really" Unit 1, then swapping them changes the state. But you can't measure "Unit 1-ness" without looking at the weights.
      *   *Key Break:* In ML, $x$ is observable/fixable. In GR, $x$ (the point) is not observable independent of $g$.

