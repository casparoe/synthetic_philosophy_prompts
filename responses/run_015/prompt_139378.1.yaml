      *Wait, one more nuance:* In ML, if $\theta$ and $\theta'$ compute the same function on observed data, we usually say they are equivalent. In the Hole Argument, if you are a substantivalist, they compute *different* functions (different values at point $p$). The "function" in GR is the metric field $g: M \to \dots$. $g(p) \neq g'(p)$. So they are *not* the same function if $M$ is fixed.
      *ML Parallel:* Two parameter vectors $\theta, \theta'$ such that $f_\theta(x) = f_{\theta'}(x)$ for $x \notin H$, but $f_\theta(x) \neq f_{\theta'}(x)$ for $x \in H$.
