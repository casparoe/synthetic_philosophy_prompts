  # JOINT STATEMENT ON THE NEW RIDDLE OF INDUCTION
  **Adversarial Collaboration between Side A (Projectibility-First) and Side B (Prior-First)**

  ## PREAMBLE: TERMINOLOGICAL CLARIFICATION
  Before stating our agreements and disagreements, we note a merely verbal dispute that we hereby set aside to focus on substantive issues. We disagree on whether the term "projectible" names a *sui generis* logical property of predicates (Side A's preferred usage) or is merely a shorthand label for "predicates appearing in hypotheses assigned non-negligible prior probability by rational agents" (Side B's preferred usage). Since we agree on the *extension* of the term in all standard cases (e.g., 'green' is projectible, 'grue' is not), we exclude this semantic debate from the Disagreements Table below. We further agree to use "confirmation" to mean *incremental increase in subjective probability via conditionalization*, acknowledging that this presupposes a prior distribution.

  ---

  ## (I) JOINT CLAIMS
  *The following claims are endorsed by both Side A and Side B.*

  1.  **The Failure of Pure Syntax:** The Grue case successfully demonstrates that no theory of confirmation can rely solely on the syntactic form of evidence and hypotheses. Syntactically identical arguments can yield conflicting predictions if the predicates involved differ in their projectibility status.
  2.  **The Role of the Prior:** Both sides agree that within a Bayesian framework, the rejection of the "All emeralds are grue" hypothesis is mathematically represented by the assignment of a low prior probability to that hypothesis relative to "All emeralds are green." The dispute concerns the *justification* for this assignment, not the mathematical mechanics.
  3.  **Relation to Hume:** The New Riddle presupposes Hume's Old Riddle. We agree that even if the projectibility/prior problem is solved, the justification for induction itself (the assumption that the future resembles the past) remains a separate, foundational philosophical challenge. The New Riddle is not a solution to the Old Riddle, but a refinement of it.
  4.  **Nature of the Puzzle:** The puzzle is fundamentally normative. It is not merely a description of how humans *do* reason (psychology), nor is it purely a matter of linguistic convention (semantics). It concerns how rational agents *ought* to distribute belief over competing hypotheses given limited evidence.
  5.  **The Law-Grue Variant:** Regarding the variant where a physical constant changes value at time $T$ (Law-Grue):
      *   We agree that the vast majority of such time-sliced laws are scientifically inadmissible.
      *   We agree that a small subset of such laws (e.g., those describing phase transitions or symmetry breaking) are scientifically serious.
      *   We agree that the distinction between admissible and inadmissible time-sliced laws cannot be made on the basis of logical form alone; it requires appeal to features external to the hypothesis statement itself.
  6.  **The Symmetric-Entrenchment Variant:** Regarding the community that treats *grue* and *bleen* as primitives:
      *   We agree that this community is internally coherent. Their inductive inferences are valid relative to their own conceptual scheme and linguistic practices.
      *   We agree that their successful prediction of future observations demonstrates that projectibility (or prior assignment) is relative to a conceptual scheme or vocabulary.
      *   We agree that this does not entail radical relativism; it remains an open question whether one conceptual scheme is objectively preferable to another for the purpose of capturing causal structure.
  7.  **Insufficiency of "Low Prior" Alone:** We agree that simply stipulating "assign a low prior to grue" is not an explanation. An adequate philosophical account must explain *why* that prior assignment is rational, whether by appeal to naturalness, entrenchment, simplicity, or informational efficiency.

  ---

  ## (II) DISAGREEMENTS TABLE
  *Residual disagreements are listed below. Each row presents the same point of contention, phrased first in the terminology preferred by Side A, and second in the terminology preferred by Side B.*

  | Topic | Side A Wording (Projectibility-First) | Side B Wording (Prior-First) |
  | :--- | :--- | :--- |
  | **1. The Source of Constraint** | Inductive logic requires a substantive constraint on **which predicates are projectible**. This constraint is prior to probability assignment and restricts the hypothesis space itself. | Inductive logic requires a substantive constraint on **how priors are assigned**. The hypothesis space is unrestricted; rationality constraints operate on the probability distribution over that space. |
  | **2. The Status of Entrenchment** | Entrenchment (past successful projection) is a **normative rule** that validates a predicate for future use. It is a logical feature of inductive validity. | Entrenchment is a **psychological heuristic** that explains why agents happen to have the priors they do. It is a descriptive fact about cognitive history, not a rule of logic. |
  | **3. Explanation of Law-Grue** | In the Law-Grue variant, the admissible time-sliced laws are those that map onto **real causal mechanisms** or natural joints in nature (e.g., phase transitions). | In the Law-Grue variant, the admissible time-sliced laws are those that maximize **theoretical virtues** (simplicity, continuity, fit with background theory) given the evidence. |
  | **4. The "Newness" of the Riddle** | The New Riddle identifies a **distinct problem** from the Old Riddle: even granting that induction is valid, we lack a criterion for distinguishing valid from invalid inductive forms. | The New Riddle is **dissolved** into the general problem of rational prior justification. There is no special "inductive" problem distinct from the general problem of epistemic rationality. |
  | **5. Symmetric-Entrenchment Implications** | The Symmetric-Entrenchment case shows that projectibility is **scheme-relative**, requiring a meta-theory of naturalness to adjudicate between competing schemes (e.g., Green/Blue vs. Grue/Bleen). | The Symmetric-Entrenchment case shows that priors are **contingent on vocabulary**. No meta-theory is needed; rationality is defined by coherence within the chosen vocabulary, not by matching a "true" vocabulary. |

  ---

  ## (III) CRUXES AND EVIDENCE
  *The following sub-questions represent the critical pivot points of our disagreement. For each, we specify the evidence both sides accept as relevant, and we record our divergent predictions in advance.*

  ### Crux 1: The Origin of Inductive Bias
  **Question:** Is the bias against *grue*-like hypotheses innate/hardcoded (suggesting a structural constraint on projectibility) or learned via compression/efficiency (suggesting a prior based on simplicity)?

  *   **Accepted Evidence:** Results from computational learning theory (specifically "No Free Lunch" theorems) and cognitive science data on infant color categorization.
  *   **Side A Prediction:** Learning algorithms will fail to converge on "green" without an explicit, hardcoded bias toward "natural" feature spaces that cannot be derived from data compression alone. Infants will show innate preference for non-gerrymandered categories.
  *   **Side B Prediction:** Learning algorithms will converge on "green" solely through pressure to minimize description length (Occam's razor) without explicit naturalness constraints. Infant categorization will track statistical regularities and perceptual similarity, not metaphysical naturalness.

  ### Crux 2: The Physics of Varying Constants
  **Question:** In the Law-Grue variant, is the acceptance of varying constants determined by the discovery of a underlying mechanism (A) or by the mathematical simplicity of the variation function (B)?

  *   **Accepted Evidence:** Historical case studies of accepted time-varying parameters in physics (e.g., the Hubble constant, effective mass in solids) vs. rejected ones (e.g., arbitrary discontinuities).
  *   **Side A Prediction:** Accepted cases will always be accompanied by a causal/mechanistic explanation (e.g., a field interaction) that renders the time-dependence "natural."
  *   **Side B Prediction:** Accepted cases will be those where the time-dependent function allows for a simpler total theory (fewer parameters overall), even if the mechanism for the variation remains unknown or brute.

  ### Crux 3: The Symmetric Community's Success
  **Question:** If the *grue/bleen* community achieves identical predictive success to the *green/blue* community, does this imply their vocabulary is equally "correct" (B) or merely equally "useful" despite being metaphysically inferior (A)?

  *   **Accepted Evidence:** A thought experiment formalized in decision theory: Both communities bet on future observations over 1,000 trials. Both maximize expected utility.
  *   **Side A Prediction:** We will be able to demonstrate that the *grue/bleen* language requires more complex translation rules to interface with other scientific domains (e.g., optics, neuroscience), proving it is less "carved at the joints."
  *   **Side B Prediction:** We will demonstrate that the *grue/bleen* language is isomorphic to the *green/blue* language in all empirical predictions and theoretical integrations, proving that "carving at the joints" is just a metaphor for prior entrenchment.

  ---
