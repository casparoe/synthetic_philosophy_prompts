answer: |-
  **Final Exam: Global Priority Setting**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30
  **Word Limit:** 1,200 Words

  **Question 1**

  A foundation has a single non-recurring grant of $50M to allocate this year. Its trustees' fallback use is Cause C. Treat Welfare Units (WU) as fully comparable across causes; ignore timing and discounting.

  **Cause A (Chronic Parasitic Infection):** Fully solving is worth 12,000 WU. Returns are constant: every additional $1M solves 1% of the problem (120 WU) up to complete solution at $100M cumulative funding. Cumulative funding to date: $30M. Current annual funding: $10M. No crowding out.

  **Cause B (Livestock Disease Eradication):** Fully solving is worth 1,000,000 WU; 99% is already solved. If eradicated this year, the benefit is 10,000 WU (residual 1%) plus 15,000 WU from avoiding resurgence. Eradication requires an indivisible one-off $50M campaign; smaller contributions yield 0 WU. Current funding: $2,000M/year routine vaccination (continues until eradication).

  **Cause C (Scholarships):** Worth 500,000 WU if fully solved. Each additional $1M solves 0.06% (300 WU) over the relevant range. Current annual funding: $500M. Divisible, no crowding out.

  **(a)** Rank the uses of the $50M grant with calculated WU values. Say how the ranking changes if the foundation had only $1M to give. (10 marks)
  **(b)** Apply the ITN heuristic as usually taught (rate factors, multiply). Compare its ranking with yours. Explain precisely what single quantity the framework is trying to estimate, what each factor is a stand-in for, and what goes wrong when the stand-in comes apart from the quantity. (8 marks)
  **(c)** Say what neglectedness would have to mean for it to be more than a crude proxy—redefine it, or argue the framework should drop it. (6 marks)
  **(d)** If eradication happens, the $2,000M/year routine vaccination stops. Should that be counted in Cause B's benefit, and if so, how? (6 marks)

  ***

  **Model Answer**

  For a $50M grant, the ranking is Cause B (25,000 WU), Cause C (15,000 WU), then Cause A (6,000 WU); for a $1M grant, the ranking shifts to Cause C (300 WU), Cause A (120 WU), then Cause B (0 WU).

  These figures represent the marginal benefit of the specific grant size. Cause A yields 120 WU/$M constantly; $50M generates 6,000 WU, while $1M generates 120 WU. Cause C yields 300 WU/$M constantly; $50M generates 15,000 WU, while $1M generates 300 WU. Cause B is lumpy: it yields 25,000 WU only if the full $50M threshold is met; otherwise, it yields zero. At $50M, B's lumpiness creates a high marginal return surpassing the linear causes. At $1M, B's threshold renders it useless, dropping it to last place.

  Standard ITN application often misranks these options. A typical scoring would rate Cause B highest on Importance (1,000,000 total WU), but lowest on Neglectedness (due to $2,000M annual funding) and Tractability (only 1% remaining). Multiplying these scores often penalizes B heavily, potentially ranking it below A, which scores high on Neglectedness (low funding) and Tractability (70% remaining). This divergence occurs because ITN attempts to estimate **marginal cost-effectiveness** (WU per marginal dollar), but its factors are proxies for averages or totals rather than margins. Importance proxies for total scale, not marginal value of the remaining portion. Tractability proxies for average ease, failing to capture threshold effects or diminishing returns. Neglectedness proxies for current funding levels, assuming low funding implies high marginal returns.

  The framework fails here because the proxies come apart from the target quantity. In Cause B, high current funding (low Neglectedness) coexists with a high-value marginal opportunity because the opportunity is indivisible. The "room for more funding" is not continuous; it is binary. In Cause A, low funding (high Neglectedness) correlates with constant returns, making the proxy accurate. In Cause C, moderate funding correlates with constant returns. ITN works best when marginal returns diminish smoothly with funding; it fails when returns are lumpy or when total importance diverges sharply from marginal importance (e.g., the last 1% of a problem being worth disproportionately more or less than the average).

  To make Neglectedness more than a crude proxy, it must be redefined from "current funding level" to "marginal funding capacity at current efficiency." Current funding is merely an input; what matters for decision-making is whether additional funding would be absorbed productively. A cause with high current funding might still be neglected in the relevant sense if there are unfunded, high-efficiency opportunities (like B's eradication campaign). Conversely, a cause with low funding might be saturated if the remaining problems are intractable. Therefore, Neglectedness should measure the gap between current funding and the funding level required to exhaust high-return opportunities, rather than the absolute dollar amount spent. If this cannot be estimated, the factor should be dropped in favor of direct marginal cost-effectiveness estimates.

  Regarding the $2,000M/year routine vaccination stopping: this should not be counted as direct benefit within Cause B's WU. The 25,000 WU already captures the welfare gain from eradication (health/resilience). The ceased vaccination spending is a cost saving, not a welfare unit. However, it should be accounted for as a relaxation of the global budget constraint. The $2,000M freed becomes available for other welfare-producing activities. To count it as B's benefit would be double-counting unless the WU metric is defined as consumption-equivalent. The correct treatment is to note that eradication unlocks $2,000M of external resources, increasing the potential total welfare achievable by the system, but this secondary effect belongs to the marginal use of those freed funds, not to Cause B's direct output.

  ***

  **Marking Scheme**

  | Point | Marks | Must-Hit Criteria | Common Error / Recitation to Penalize |
  | :--- | :--- | :--- | :--- |
  | **1. Marginal Calculations & Ranking ($50M)** | 6 | Correctly identifies B (25k) > C (15k) > A (6k). Shows understanding that B's value is the marginal 25k, not total 1M. | Using total WU (1M for B) instead of marginal benefit; ranking A highest due to "neglectedness" intuition rather than math. |
  | **2. Sensitivity to Grant Size ($1M)** | 4 | Correctly identifies C > A > B. Explicitly notes B yields 0 due to lumpiness/threshold. | Assuming B yields proportional benefit (e.g., 500 WU for $1M); ignoring the indivisibility constraint. |
  | **3. ITN Target & Proxy Failure** | 8 | States target quantity is **marginal benefit/CE**. Explains ITN factors are proxies (Importance=Scale, Neglectedness=Room for funding). Explains failure via lumpiness/non-linearity. | Stating ITN estimates "impact" or "goodness" generally; reciting ITN definitions without linking to marginality; failing to mention lumpiness. |
  | **4. Redefining Neglectedness** | 6 | Redefines as "marginal funding capacity" or "saturation of high-return opportunities" rather than "low current spend". | Keeping definition as "low current funding"; arguing Neglectedness is irrelevant without proposing a functional alternative. |
  | **5. Treatment of Freed Resources** | 6 | Identifies saved costs are not direct WU. Explains they relax budget constraints/opportunity costs for other actors (no double counting). | Counting $2,000M as direct WU benefit for Cause B; ignoring the opportunity cost of the freed funds entirely. |
  | **Total** | **30** | | |
