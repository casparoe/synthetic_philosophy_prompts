      TO: Quality & Safety Committee
      FROM: Clinical Effectiveness Lead
      DATE: Tuesday, [Date]
      SUBJECT: Decision Memorandum: Emergency Sepsis Unit Protocol B Evaluation

      **Bottom Line Recommendations**

      For the vote this Thursday, I recommend the following actions:

      1.  **Pay-for-Performance:** Do not apply the quality withhold to the Emergency Sepsis Unit for this cycle. The aggregate mortality rate reflects case mix, not negligence.
      2.  **Protocol Status:** Do not suspend Protocol B. Proceed with the planned expansion to mild and moderate presentations effective next quarter.
      3.  **Public Reporting:** Suppress aggregate mortality figures for this unit in the external quality report this cycle. Publish only with explicit case-mix adjustment notes.
      4.  **Policy Proposal:** Reject the proposed "Aggregate Primacy Rule." Adopting it as policy would incentivize units to avoid high-risk patients to protect overall percentages.
      5.  **Condition for Continuation:** The unit must implement the automated vitals-only severity score for all sepsis admissions by [Date + 90 days]. Future evaluations will weight this objective score heavily.

      **Reasoning and Analysis**

      We are facing a statistical reversal that is mathematically sound but clinically confusing. The data shows Protocol B has higher survival rates in every severity category (Mild, Moderate, Severe) compared to Protocol A. However, the overall survival rate for Protocol B is 26 percentage points lower. This is not a calculation error. It is a signal that the two patient groups are fundamentally different.

      Consider the arithmetic. Under Protocol A, only 50 out of 1,000 patients were triaged as Severe. Under Protocol B, 500 out of 1,000 were Severe. Protocol B is treating ten times as many critical patients. Because severe patients die at higher rates regardless of treatment, loading your unit with them drags down your overall average, even if you are saving more of them than the old protocol would have.

      We must distinguish three different questions this data attempts to answer.
      1.  **The Aggregate Comparison:** "What is the survival rate of patients in this unit?" This answers how the unit performs overall, but it conflates treatment effectiveness with patient selection.
      2.  **The Stratified Comparison:** "Does Protocol B save more lives than Protocol A for a given level of sickness?" This answers clinical effectiveness.
      3.  **The Committee's Question:** "Is this unit providing safe care, and is Protocol B worth the risk?"

      The aggregate number answers Question 1. The stratified numbers answer Question 2. Our mandate is Question 3. If we punish the unit based on the aggregate, we penalize them for accepting sicker patients. If we ignore the stratification, we ignore the clinical benefit of the new protocol.

      **Addressing the Validity Concerns**

      The strongest argument against relying on the stratified data is the potential for circularity. Triage severity is scored by the senior resident who also decides the protocol. A unit could theoretically label patients "Severe" to justify using Protocol B, or to move expected deaths into a bucket where lower survival is acceptable. If the severity score is manipulatable, the stratified comparison is compromised. This is a serious validity threat that the "Simpson's Paradox" explanation overlooks.

      However, the proposed solution—the Aggregate Primacy Rule—is worse. If we mandate that the worse-looking number always governs, we create a perverse incentive. Units will learn to triage patients as "Moderate" rather than "Severe" to keep their aggregate survival rates high, potentially denying critical care protocols to the sickest patients to protect metrics. We cannot build a safety culture on penalties for treating the sick.

      Regarding the ICU escalation data: The former analyst concluded Protocol B "does nothing" because survival differences disappeared when conditioning on ICU transfer. This analysis is flawed because Protocol B mandates earlier escalation. ICU transfer is a result of the protocol, not a pre-existing condition. Adjusting for it removes the very mechanism by which Protocol B might save lives. We must disregard this specific analysis.

      Finally, the stratification was chosen after seeing the data. This increases the risk of finding patterns by chance. However, the magnitude of the case-mix shift (50 vs 500 severe patients) is too large to be random noise. It reflects a deliberate change in unit behavior or patient flow.

      **Confidence Ledger**

      To ensure transparency, I separate the mathematical facts from the clinical judgments below.

      **Undisputed Facts**
      *   **The Arithmetic:** The survival rates within bands and the overall totals are calculated correctly. The reversal is mathematically inevitable given the distribution of patients.
      *   **Reversal Possibility:** It is possible for a treatment to be better in every subgroup but worse overall if the subgroups are unevenly distributed.
      *   **Post-Treatment Bias:** Conditioning on a variable affected by treatment (like ICU transfer) invalidates the comparison of treatment effect.

      **Contested Judgments**
      *   **Severity Validity:** There is genuine disagreement on whether the resident-assigned triage score is a legitimate adjuster given the incentive to upcode.
      *   **Weighting:** Experts differ on how much to discount an analysis where stratification bands were chosen after seeing the aggregate results.
      *   **Observational Inference:** There is no consensus on whether observational data alone can license the inference that Protocol B causes the survival benefit without a randomized trial.

      **Confidence Rating**
      I have **High Confidence** that the Aggregate Primacy Rule must be rejected to avoid perverse incentives. I have **Moderate Confidence** that Protocol B is clinically superior based on the stratified data, contingent on the validation of the vitals-only score. I have **Low Confidence** in the precise magnitude of the survival benefit due to the observational nature of the data.

      **Decision Path**
      We will proceed with Protocol B. If the vitals-only score implemented in 90 days confirms the severity distribution is real and not administrative gaming, this decision becomes permanent. If the objective score shows patients are less severe than triaged, we will revisit suspension.

