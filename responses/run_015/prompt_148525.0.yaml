answer: |-
  Your framework is structurally sound except for a high-severity conflict between denying moral responsibility (a) and asserting the rational necessity of resentment (d).

  **Tension Ranking & Fixes**

  1.  **Severity: High | (a) vs. (d)**
      *   **Conflict:** If no one is truly morally responsible (a), resentment lacks a fitting object. Claiming it is "rationally required" suggests it tracks normative truth rather than mere psychological inevitability or utility, which risks reintroducing the desert you rejected.
      *   **Cheapest Fix:** Reframe the rationality of resentment as *instrumental* rather than *fitting*. Argue it is rational only insofar as it effectively serves the forward-looking goals in (c), not because it responds to a genuine moral debt.

  2.  **Severity: Medium | (c) vs. (e)**
      *   **Conflict:** Compatibilists often define responsibility as forward-looking answerability. Using this terminology risks smuggling in the compatibilist claim that such answerability is sufficient for the kind of free will you reject in (e).
      *   **Cheapest Fix:** Explicitly stipulate that your notion of 'answerability' is a social status devoid of metaphysical control conditions. Clarify that agents are answerable *because* we need them to be, not because they possess the capacity to do otherwise.

  3.  **Severity: Low/None | (b) vs. (e)**
      *   **Conflict:** You worry that claiming indeterminism is "worse" concedes ground to determinism. It does not; it simply argues that libertarian sourcehood is *more* incoherent than compatibilist sourcehood, reinforcing your rejection of both.
      *   **Cheapest Fix:** Add a clarifying clause that comparing two impossible conditions does not validate either. State clearly that indeterminism fails to solve the problem it was designed to fix, making it a superior target for critique but not a viable alternative.

  **Single Revision for Maximum Cleanup**

  Revise **(d)** to ground the rationality of reactive attitudes entirely in the forward-looking utility of **(c)** rather than an independent requirement of "justice." By making resentment a tool for social correction rather than a response to normative claims about agents, you dissolve the conflict with **(a)** (no desert needed), clarify **(c)** (utility-based), and insulate **(e)** (no metaphysical commitment required). This shifts your view from a unstable hybrid to a consistent hard incompatibilist stance akin to Pereboom or Caruso.
