      Title: Beyond Refutation: The Logical Status of the Fourth Corner in Nāgārjuna's Tetralemma

      **Project Summary**
      This project investigates a structural ambiguity in Nāgārjuna's use of the tetralemma (catuṣkoṭi). Standard readings present the tetralemma as a flat refutation of four possibilities regarding arising: existence, non-existence, both, and neither. The upshot is typically glossed as "nothing can be said." However, this gloss obscures a critical tension: if the refutation of all four corners is itself a valid statement, does it constitute a positive thesis about reality (a "middle way" ontology), or does it enforce a thesis-free silence? This project asks: Does the refutation of the fourth corner commit Nāgārjuna to a positive conception of emptiness, or does it yield a pragmatic silence? Furthermore, does this outcome depend on reading the tetralemma as a logical reductio or a pragmatic deconditioning device, and consequently, is the doctrine of two truths derivable from this argument or an independent presupposition required to save it from nihilism?

      **Statement of the Problem**
      Contemporary scholarship often treats the tetralemma's total negation as a settled matter: all four corners are false, therefore reality is empty. This treatment leaves open the status of the negation itself. If the argument is logical, the conclusion "all corners are false" functions as a negative fact, risking the reification of emptiness that Nāgārjuna explicitly warns against. If the argument is pragmatic—a therapeutic device to loosen conceptual grasp—it avoids reification but risks the charge of nihilism (ucchedavāda), as it offers no account of how conventional truth persists after deconditioning. The standard "all-refuted-therefore-nothing" treatment fails to explain how the system avoids collapsing into either dogmatic negativism or incoherent silence. Specifically, it overlooks whether the two-truths doctrine is an internal result of the tetralemma's self-application or an external framework imported to stabilize the argument.

      **Methodology**
      This project will not proceed via a verse-by-verse commentary of the root text, nor will it survey the historical reception in Tibetan or Chinese commentarial traditions. While exegetically rich, these approaches often presuppose the coherence of the system rather than testing its structural mechanics. Instead, I will employ a structural analysis of the tetralemma's operation when applied to itself. I will treat the argument as a functional system, isolating the logical commitments of the fourth corner's refutation. By contrasting the implications of a formal logical reading against a pragmatic performative reading, I will determine which mode sustains the two-truths doctrine without contradiction. This approach is necessary because the problem is not historical but systematic: it concerns the internal coherence of the argumentative strategy itself.

      **Success and Failure Criteria**
      A successful result will definitively categorize the status of the tetralemma's conclusion. It will demonstrate whether the two-truths doctrine is logically derivable from the self-refutation of the fourth corner or whether it must be posited independently. Success looks like a resolved model showing how Nāgārjuna avoids both reification and nihilism without appealing to mystery.
      Project failure would consist in demonstrating that the text is inherently inconsistent on this point—that the logical and pragmatic readings are irreconcilable within the provided framework, leaving the nihilism charge unanswerable. Even this negative result would be philosophically significant, but the goal is a constructive resolution.

      **Scope and Feasibility**
      A three-month sabbatical is sufficient for this focused structural analysis. Because the project limits itself to the mechanics of the tetralemma rather than the entirety of the corpus or its commentarial history, the data set is manageable. The work involves close logical analysis and conceptual modeling rather than extensive translation or archival research. The risk lies in the complexity of the paradox itself; however, by restricting the scope to the specific function of the fourth corner and its relation to the two truths, the project remains bounded. The deliverable will be a journal-ready article outlining the structural resolution, providing a foundation for future broader exegesis.

