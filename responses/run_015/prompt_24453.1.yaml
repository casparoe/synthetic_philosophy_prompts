  This project will not proceed via a verse-by-verse commentary of the root text, nor will it survey the historical reception in Tibetan or Chinese commentarial traditions. While exegetically rich, these approaches often presuppose the coherence of the system rather than testing its structural mechanics. Commentarial traditions tend to harmonize contradictions to preserve doctrinal unity, while verse-by-verse analysis risks losing the structural forest for the textual trees. Instead, I will employ a structural analysis of the tetralemma's operation when applied to itself. I will treat the argument as a functional system, isolating the logical commitments of the fourth corner's refutation. By contrasting the implications of a formal logical reading against a pragmatic performative reading, I will determine which mode sustains the two-truths doctrine without contradiction. This approach is necessary because the problem is not historical but systematic: it concerns the internal coherence of the argumentative strategy itself.

