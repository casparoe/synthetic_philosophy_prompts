          *   *Overall:* The move from Grounding to EFT/Physics is the weak link. Philosophers of physics (not just metaphysicians) will push back on the identification of metaphysical fundamentality with high-energy physical fundamentality.

  8.  **Refining the "Confidence/Status" Requirement:**
      *   Make sure to explicitly label things as "Standard/Orthodox," "Contested," or "Rejected by X school."
