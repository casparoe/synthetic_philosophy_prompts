answer: |-
  **Exam Question: Rational Choice & Self-Locating Belief**

  **Problem: The Phantom Exit and the Tagging Device**

  Consider a modified Absent-Minded Driver (AMD) scenario. A driver must navigate a highway with three indistinguishable intersections.
  1.  **Intersection 1:** Exit leads to payoff **0**.
  2.  **Intersection 2 (Phantom):** Exit leads to payoff **-5** (dead-end). Visually identical to Intersection 3.
  3.  **Intersection 3 (Target):** Exit leads to payoff **4**.
  4.  **Past Intersection 3:** Continuing leads to payoff **1**.

  The driver is absent-minded: upon arriving at any intersection, they cannot distinguish which one it is, though they know the map structure. The driver possesses a one-time-use dashboard "Tag" button. Pressing it costs **1 utility** and leaves a permanent visible mark on the dashboard. If the driver sees the mark at a subsequent intersection, they know they have passed the intersection where the button was pressed.

  **Task:**
  Determine the optimal strategy regarding the Tag button and exiting/continuing. Specifically, analyze whether Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) diverge on the *value of tagging* in this scenario. Explain why the introduction of the Phantom Exit and the Tag button creates a divergence not present in the standard two-exit AMD problem. Your answer must address how tagging alters the epistemic partition relative to the causal structure.

  ***

  **Model Answer**

  In the standard AMD problem, CDT and EDT typically diverge on the evaluation of the *continuation probability*, but they often agree on the lack of value in memoryless actions. Here, the Tag button introduces a memory aid that creates a sharp divergence between CDT and EDT regarding information acquisition.

  **Payoff Structure and Symmetry Break**
  Let $p$ be the probability of continuing and $q$ be the probability of tagging at any intersection (if untagged). Without tagging, the driver faces a uniform credence distribution over the three intersections. The expected utility (EU) is a weighted average of exits (0, -5, 4) and the end (1). The Phantom Exit (-5) breaks the symmetry of the standard AMD; continuing blindly carries a severe penalty, making information valuable. The optimal baseline without tagging requires a low $p$ to avoid the Phantom, sacrificing the Target.

  **The Value of Tagging: CDT vs. EDT**
  The divergence arises in how each theory values the Tag button's cost (1 utility).

  **Causal Decision Theory (CDT):**
  CDT treats the button press as a causal intervention on the agent's future epistemic state. Pressing the button at Intersection $i$ causally ensures that at Intersection $i+1$, the agent occupies a distinct informational state (seeing the mark). CDT calculates the value of tagging as the cost (-1) plus the causal benefit of refined self-location. If tagging at Intersection 2 allows the driver to identify Intersection 3 with certainty (seeing the mark implies "I was at 2, so now I am at 3"), the driver secures the payoff 4. Net utility: $4 - 1 = 3$. Since $3 > 1$ (the payoff for driving past), CDT endorses tagging as purchasing **causal leverage over future discrimination**. The causal structure of the road remains unchanged, but the causal link between [Press] and [Future Knowledge] is valid.

  **Evidential Decision Theory (EDT):**
  EDT evaluates the act of tagging as evidence about the agent's current location. If the optimal strategy is "Tag at Intersection 2," then the decision to tag is strong evidence that the agent is *currently* at Intersection 2. However, due to absent-mindedness, the agent cannot condition on being at Intersection 2 without circularity. EDT conditionalizes on the act: $P(\text{Target} | \text{Tag})$. If the agent tags, EDT worries this is evidence they are at Intersection 1 (where tagging is wasted) rather than Intersection 2. Consequently, EDT may undervalue the tag because the act correlates with "wasting the tag" in the agent's credence function. EDT views tagging as **self-locating evidence** that might update the probability of being at the wrong node, potentially rendering the cost unjustified compared to CDT's instrumental valuation.

  **Epistemic Partition vs. Causal Structure**
  The critical distinction is that tagging changes the **epistemic partition** without altering the **causal structure**. The road layout (causal structure) is fixed; the Phantom remains between Exit 1 and 2. However, tagging refines the set of distinguishable worlds (epistemic partition) available to the agent at future nodes. CDT correctly identifies that refining the partition has causal consequences for future choices (avoiding -5). EDT conflates the refinement of the partition with evidence about the past, leading to a divergence in the calculated value of information. In the standard AMD, no such partition shift exists, masking this theoretical split.

  **Conclusion**
  The optimal strategy involves tagging probabilistically to balance the cost against the risk of the Phantom. CDT supports this as rational information purchase; EDT hesitates due to the evidential weight of the decision itself.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Point | Criteria | Marks | Typical Mistake |
  | :--- | :--- | :--- | :--- |
  | **1. Payoff Reconstruction** | Correctly identifies the 4 outcomes (0, -5, 4, 1) and integrates the Tag cost (-1) into the utility calculation. | 4 | Ignoring the -5 Phantom penalty or forgetting the Tag cost. |
  | **2. Symmetry Argument** | Explains how the Phantom Exit breaks the standard AMD symmetry, making blind continuation riskier and information valuable. | 4 | Treating the Phantom as identical to Exit 1 or missing the risk asymmetry. |
  | **3. CDT Analysis** | Correctly argues CDT views tagging as a causal intervention on future knowledge states (instrumental value). | 4 | Claiming CDT ignores the button because it doesn't change the road layout. |
  | **4. EDT Analysis** | Correctly argues EDT views tagging as evidence of current location, creating a correlation penalty (Newcomb-like tension). | 4 | Arguing EDT and CDT yield the exact same valuation for information. |
  | **5. Epistemic/Causal Distinction** | **Crucial:** Explicitly states tagging alters the *epistemic partition* (distinguishable states) without changing the *causal structure* (road topology), and links this to the CDT/EDT split. | 4 | Conflating "changing knowledge" with "changing the causal past" or failing to use the partition terminology. |

  **Note on Grading:** A-grade answers must demonstrate that the divergence stems from how information is valued (instrumental vs. evidential), not just that the theories differ.
