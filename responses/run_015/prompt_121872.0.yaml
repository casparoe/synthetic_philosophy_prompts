  The exam question should ask for the optimal strategy—tag at start, tag at exit 1, take exit 1, take exit 2, etc.—and specifically whether causal decision theory and evidential decision theory diverge here in a way the classic two-exit version doesn't reveal. Please write the question itself, then a model answer of about 600 words that rebuilds the payoff structure, explains why the phantom exit breaks the usual symmetry argument, and pinpoints exactly where CDT and EDT split on the value of tagging. After that, give a marking scheme with five must-hit points, total marks 20, and a one-line note on the typical mistake for each. I want the separation between A and B answers to hinge on whether they see that tagging changes the epistemic partition without altering the causal structure, not just on whether they namedrop the right theories.
