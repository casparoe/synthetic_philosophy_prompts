prompt: |-
  Rank the following three communicative norms—unmediated Dutch direct refusal, Japanese indirect refusal that relies on contextual implicature rather than explicit negation, and Anglo-American feedback framing that embeds criticism between compliments—according to their defensibility as candidates for a universal ethical standard of honesty in conversation, rather than as mere local conventions. Assign each norm a tier from S to C, and in one concise paragraph per tier explain where it lands, with particular attention to whether white lies that preserve face in high-context indirectness carry a different moral status than the explicit euphemisms and strategic omissions common in direct cultures. Your evaluation should weigh the tension between Kantian-style prohibitions on deception, consequentialist concerns about erosion of trust, and the virtue-ethical value of sincerity, but reach an overall ordering rather than ending in neutrality.
