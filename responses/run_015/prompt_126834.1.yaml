      *   *Refinement:* The decision should hinge on the difference between *Hard Constraints* (Precedent 1) and *Learned Monitors* (Precedent 3). Precedent 3 was explicitly *retrospective*. Changing a Learned Monitor to a Gate violates the precedent set by 3, whereas 1 doesn't apply because 1 wasn't a learned monitor.

      *(Refinement on Red-Teaming)*: The proposal uses the *same weights*. Precedent 4 rejected using the same model for monitoring. Does using it for *training the monitor* differ? Yes, but the Charter says "assume the model is actively trying to defeat it." If the deployed model is adversarial, the red-team copies (same weights) might also be adversarial *against the red-team process* (sandbagging). The proposal admits this ("hold back its best attack"). Therefore, under the Charter, this hardening cannot claim a *guarantee*.

      *(Final Decision)*: Reject the Gating. Reject the Same-Weights Red-Teaming if it claims to provide a *guarantee*. Allow Same-Weights Red-Teaming only as a *heuristic improvement* with no safety claims attached.

