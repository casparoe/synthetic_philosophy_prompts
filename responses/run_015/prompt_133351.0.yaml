answer: |-
  The stalemate over Plato's theory of intoxication is not a verbal dispute over definitions, nor merely a textual puzzle. It is structurally a case of **two sides answering different questions (ethical prescription versus dramatic psychology)**, sustained by an unacknowledged **impasse rooted in bedrock intuitions about rational control.**

  ### The Diagnosis: Category Error and Bedrock Intuitions

  The primary structural cause of the stall is a **category error**. One side of the debate analyzes the *Laws* as a work of **political technology**, asking: "How can the state instrumentalize wine to produce virtue?" The other side analyzes the *Symposium* as a work of **moral psychology**, asking: "What does wine do to the soul's internal hierarchy?"

  *   **The *Laws* (Prescription):** The Athenian Stranger treats wine as a *pharmakon* (drug/remedy). The question here is normative and teleological. Intoxication is not an end in itself but a controlled stress-test for the guardians. The focus is on the *legislator's control* over the substance.
  *   **The *Symposium* (Description):** The dialogue depicts the *phenomenology* of drinking. The focus is on the *drinker's loss of control* (with the singular exception of Socrates). Here, wine acts as a solvent of *aidos* (shame/restraint), revealing the chaotic eros beneath.

  Scholars talk past one another because they assume these two inquiries must yield a unified metaphysical account of "wine." They do not. The *Laws* describes wine as it *ought to be managed* in a second-best city; the *Symposium* describes wine as it *is experienced* in the messy reality of human eros.

  However, this category error persists only because of a deeper, **bedrock disagreement about rational control**.
  *   **Optimists** (favoring a single theory) intuit that Platonic reason is sovereign; if the *Laws* says wine can be tamed, Socrates' sobriety in the *Symposium* proves it is always tamed by the philosopher. They view Alcibiades' drunkenness as a failure of the man, not the wine.
  *   **Pessimists** (favoring incompatibility) intuit that reason is fragile; the *Symposium* reveals the true danger of the non-rational soul, making the *Laws'* confidence in civic drinking clubs look like a hopeful fiction or a later, pragmatic compromise.

  As long as scholars project their own intuitions about the sovereignty of reason onto Plato, they will either harmonize the texts by downplaying Alcibiades' chaos or fracture the corpus by downplaying the Athenian's optimism.

  ### The Path to Progress

  Breaking this impasse requires **conceptual distinction** rather than new textual observation or pure philosophical argumentation. We already have the texts; we need a new framework for reading them.

  Progress depends on distinguishing between **Normative Instrumentalism** and **Descriptive Realism**:
  1.  **Normative Instrumentalism (*Laws*):** Wine is a tool for *paideia* (education). Its value lies in the *context of law*. Without the law, the tool breaks.
  2.  **Descriptive Realism (*Symposium*):** Wine is a force of *nature*. Its value lies in the *truth it forces out*, even if that truth is painful or chaotic.

  Scholars must stop asking, "What is Plato's theory of wine?" and start asking, "How does the *genre* of the dialogue dictate the function of wine?" In a legislative dialogue, wine is a variable to be controlled. In an erotic dialogue, wine is a variable that controls.

  ### Resolvability: Ill-Posed vs. Resolvable

  The specific question driving the debate—"**Does Plato advance a single diagnostic theory of intoxication?**"—is **ill-posed**.

  It assumes Plato operates like a systematic treatise-writer (e.g., Kant or Mill) who must maintain doctrinal consistency across distinct literary genres and life stages. This assumption imposes an alien unity on a corpus that is inherently dialectical and contextual. Plato does not offer a "Theory of Intoxication"; he offers *depictions of intoxication* serving specific dramatic and philosophical ends.

  However, the question is **resolvable** if reframed: "**How does Plato modulate the symbolism of intoxication to serve the specific pedagogical aims of the *Laws* versus the *Symposium*?**"

  *   **Resolution:** There is no single theory. There is a consistent *anthropology* (wine lowers inhibitions), but a divergent *axiology* (whether that lowering is useful or dangerous depends on who is drinking and why).
  *   **The Key:** Socrates is the bridge. In the *Symposium*, he is drunk but sober (showing philosophical mastery over biology). In the *Laws*, the ideal citizen is sober but drinks (showing political mastery over biology). The consistency lies not in the wine, but in the **sovereignty of the rational agent**—*if* such an agent exists. The *Laws* assumes such agents can be manufactured by the state; the *Symposium* suggests they are rare miracles of nature.

  **Conclusion:** The stall will only break when scholars abandon the hunt for a unified "Platonic Doctrine of Wine" and accept that Plato's philosophy is enacted through **contextual performativity**. The disagreement is not about the text, but about the expectation of systematicity in a thinker who wrote dramas.
