answer: |-
  **Specification for a Theory of Natural Kinds in the Special Sciences**

  The purpose of this specification is to establish the adequacy conditions for any metaphysical account of natural kinds intended to serve the special sciences. The theory must function as a practical guide for a scientist deciding whether a proposed taxon is a genuine feature of the world or a mere convenience, and simultaneously as a metaphysical explication of what is at stake in that decision. To ensure the criteria are grounded in actual scientific practice rather than abstract intuition, we anchor them to three stylised cases.

  First, consider a **topological phase of matter**, defined by a global invariant rather than local symmetry or composition, realised in disparate materials under extreme conditions. Second, consider a **microbial taxon** defined by a metabolic module acquired via horizontal gene transfer, scattered across the phylogenetic tree with no single common ancestor bearing the trait. Third, consider a **psychiatric category** defined by a biomarker profile that predicts treatment response but cuts across symptom-based diagnoses and includes non-symptomatic carriers.

  An adequate theory must deliver the following requirements.

  **1. Inductive Projectibility (Non-negotiable)**
  The theory must explain why membership in a kind licenses inductive inferences and supports counterfactuals. In Case 3, the biomarker profile is valuable precisely because it supports the inference that a patient will respond to a specific treatment. A classification that does not support such projections is merely a filing system.

  **2. Realisation Independence (Non-negotiable)**
  The theory must accommodate kinds whose members share no single underlying microstructural essence. Case 1 demonstrates a kind realised in a dozen materials with almost nothing in common microstructurally beyond a topological invariant. Case 2 shows a taxon scattered across the tree of life. Any theory demanding microstructural uniformity fails here.

  **3. Dynamic Stability (Non-negotiable)**
  The theory must allow for the revision and abandonment of kinds without collapsing into scepticism. Scientific taxonomies change as instruments improve or theories shift. An adequate account must distinguish between a kind being *revised* (a correction of our grasp of a real feature) and a kind being *abandoned* (a recognition that no such feature existed).

  **4. Accommodation of Cross-Cutting Taxonomies (Non-negotiable)**
  The theory must permit multiple, respectable classifications of the same domain at different grains or for different purposes. Case 3 shows a biomarker taxonomy cutting across a symptom taxonomy. Both may support different inductive projects. The demand for a single, unique hierarchy is a prejudice that contradicts scientific practice.

  **5. Distinction from Mere Utility (Non-negotiable)**
  The theory must distinguish between a kind being *useful* and a kind being *real*. While Case 3's category is useful, a merely convenient grouping (e.g., 'things in my pocket') does not support the same modal strength. The account must explain the difference between carving a joint and simply drawing a line where it suits us.

  **6. Tolerance of Vagueness (Non-negotiable)**
  The theory must not demand sharp boundaries where the science offers none. Kind boundaries are frequently interest-relative at the edges, even if the core is stable. A theory requiring precise necessary and sufficient conditions for all instances contradicts the fuzzy nature of biological species or clinical syndromes.

  **Verdicts on Traditional Debates**
  Regarding **intrinsic membership**: It is *not* a requirement that kind membership be intrinsic. Case 1 (topological invariants) and Case 2 (historical acquisition of modules) demonstrate that relational, extrinsic, or global properties can ground genuine kinds. Insisting on intrinsicality is a prejudice inherited from chemistry that fails in biology and condensed-matter physics.

  Regarding **unique joints**: The sciences need not be thought to carve at unique joints. As Case 3 illustrates, the same domain (psychiatric patients) admits of cross-cutting but apparently respectable taxonomies (symptoms vs. biomarkers). The 'One True Tree' is a metaphysical prejudice, not a scientific requirement.

  **Incompatibilities and Tensions**
  There is a tension between Requirement 5 (Distinction from Utility) and Requirement 6 (Tolerance of Vagueness/Interest-Relativity). If boundaries are interest-relative, in what sense is the kind mind-independent? This impossibility is a sign that Requirement 5 was badly framed if it implies strong mind-independence. The distinction should not be between 'mind-independent' and 'useful', but between 'stable under investigation' and 'contingent on current goals'. The impossibility of satisfying strong mind-independence alongside interest-relative boundaries is a discovery that objectivity in the special sciences is a matter of robustness, not transcendence.

  **The Hardest Requirement**
  The single requirement that does the most work in excluding candidate theories is **Inductive Projectibility combined with Realisation Independence**. It is easy to secure projectibility by positing a shared essence (microessentialism), and easy to accommodate multiple realisation by abandoning projectibility (conventionalism). Demanding both forces the theory to locate the source of uniformity in something other than microstructural identity, such as causal structure or functional role. This combination eliminates the largest number of traditional metaphysical accounts.

  **Assessment of Four Families of View**

  *   **Microessentialism:** Fails Realisation Independence; it cannot account for Case 1 or 2 without denying them the status of kinds, thereby contradicting scientific practice.
  *   **Homeostatic-Property-Cluster:** Fails Case 1; topological phases do not rely on homeostatic mechanisms maintaining property clusters, but on global mathematical invariants.
  *   **Causal-Structuralist:** Fails Case 3; if the biomarker profile is correlational rather than causally unified, this view struggles to explain why it projects better than the symptom category.
  *   **Interest-Relative/Conventionalist:** Fails Distinction from Utility; it collapses the difference between a genuine kind and a convenient filing category, rendering the scientist's decision trivial.
