          3.  Enclosure (postholes), no hearths/pits.
      *   *Packet Allocation:*
          *   **Group 1:** Gets info on Buried Vessels + Enclosure. (Implies Ritual/Sacred).
          *   **Group 2:** Gets info on Midden + Enclosure. (Implies Public/Communal).
          *   **Group 3:** Gets info on Buried Vessels + Midden (but told they are from different layers/contexts). (Implies Chronological change or Class distinction).
          *   *Actually, let's stick to the prompt's instruction:* "different incomplete evidence packets."
          *   *Revised Plan:*
              *   **Group A (The Priests):** Focus on the 12 intact vessels (buried, decorated) + Enclosure (empty). *Interpretation: Temple.*
              *   **Group B (The Merchants):** Focus on the Midden (hundreds of sherds) + Enclosure (large capacity). *Interpretation: Market/Feast Hall.*
              *   **Group C (The Households):** Focus on the 12 intact vessels (in a room) + Midden (same forms). *Interpretation: Elite House with refuse.*
      *   *Wait, to ensure incompatibility:*
