  *   Packet 1 (Ritual): 12 buried decorated pots + Empty Enclosure.
  *   Packet 2 (Domestic/Feast): Hundreds of sherds + Enclosure.
  *   Packet 3 (Elite Storage): 12 buried pots + Hundreds of sherds (no enclosure).
