  Truth: It was a **Ritual Center**.
  Group A (Temple) is closest.
  Group B (Feast) mistook ritual breaking for eating.
  Group C (House) mistook ritual storage for domestic storage.
  This highlights how the *same objects* imply different *institutions*.

