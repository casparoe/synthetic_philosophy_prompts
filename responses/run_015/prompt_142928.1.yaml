  We commit to the following shared baseline regarding data quality and interpretation limits to ground our collaboration.
  1. The correlation between gender-equality indices and STEM segregation is statistically observable but sensitive to methodology, country selection, and how "STEM" is defined.
  2. Both sides agree that current "equality" metrics often conflate economic prosperity with social norms, making causal inference difficult without better controls or instrumental variables.
  3. We distinguish between the relative gap (ratio of men to women in a field) and absolute representation (total number of women in that field); these move independently.
  4. Cross-national data confirms that as countries develop, absolute female participation in the workforce rises, even if relative occupational segregation persists or widens.
  5. The pattern is shakier than popular discourse suggests; it diminishes when controlling for welfare state typologies and academic performance, indicating it is not a universal law but potentially a regional artifact.
  6. Self-reported preference data is noisy and subject to social desirability bias in both directions, complicating survey-based evidence significantly.
  7. We agree that observational data cannot definitively prove causality without natural experiments or longitudinal tracking of individual choices over time to separate age from cohort effects.
  8. Both sides acknowledge that measurement error in cross-national comparisons is high, requiring humility in interpreting small effect sizes and avoiding overconfidence.
  These claims form the foundation upon which our divergent theories are built and tested against reality.

  ### Where They Still Differ

  Our disagreements center on mechanism and elasticity of human behavior regarding work and identity.

  | Disagreement | Culture/Institutions Side | Predisposition Side |
  | :--- | :--- | :--- |
  | **Primary Driver** | Prosperity enables gendered consumer culture and hidden biases to flourish despite laws, reinforcing stereotypes through media and peer networks. | Survival pressure forces pragmatic choices; safety allows authentic, innate interests to emerge without economic penalty or risk of starvation. |
  | **Metric Validity** | Equality indexes measure wealth, not norms; rich countries afford more gendered marketing and toy segregation, creating artificial preference gaps. | Equality indexes measure safety nets; reducing survival anxiety reduces the need for counter-preferential work, revealing true distribution. |
  | **Absolute Levels** | Removing barriers increases absolute women in STEM, even if the relative gap widens due to male flight or field expansion. | Absolute women in STEM may stagnate in high-equality zones if innate interest rates are lower than men's, regardless of access. |
  | **Policy Shock** | Institutional changes signal new norms, shifting behavior across all age cohorts within years via hiring mandates and social pressure to conform. | Preferences are stable; only new entrants (students) shift, leaving older workers unchanged for decades because internal drives don't reset with legislation. |

  These divergences dictate different intervention strategies and policy expectations for governments.

  ### Cruxes and Predictions

  **Test Case:** A nation instantly mandates 6 months non-transferable parental leave for fathers and 40% board quotas.
  **Crux 1: Time Course.** Does the STEM gap shift immediately?
  *   *Culture:* Yes. Institutional signals change behavior across all ages quickly (within 2-3 years) because constraints are lifted simultaneously for everyone.
  *   *Predisposition:* No. Only new entrants (students) shift, and slowly. Existing workers stay put because internal preferences do not reset with law changes.
  **Crux 2: Absolute vs. Relative.** Do absolute numbers of women in engineering rise?
  *   *Culture:* Yes. Barriers removed = more women enter, even if men also enter. The gap widens only if men flee faster than women arrive.
  *   *Predisposition:* Maybe not. If preferences are fixed, removing barriers won't fill seats if interest isn't there. Absolute numbers might stay flat despite quotas.
  **Crux 3: Welfare Control.** Does the pattern hold in rich but non-egalitarian states?
  *   *Culture:* No. The pattern disappears when controlling for welfare safety nets specifically, proving it's about state structure, not gender norms.
  *   *Predisposition:* Yes. Any reduction in survival pressure yields the same sorting effect, regardless of the specific welfare model used.
  **Mechanism:** The Culture side argues the shock changes the *cost* of choosing stereotypical roles for men, forcing a rebalance. The Predisposition side argues the shock changes the *ability* to afford preferences, revealing the baseline. We will track enrollment data and mid-career switches. The Culture model predicts mid-career switches will spike. The Predisposition model predicts switches will remain rare; only new hires will differ. This distinguishes whether the "paradox" is a lagging indicator of culture or a leading indicator of human nature. We require pre-registration of these predictions to prevent post-hoc rationalization of the results. Success is measured by statistical significance in cohort shifts.

  ### Just Words

  Much friction stems from defining "choice." The Culture side sees choices as constrained preferences shaped by invisible norms. The Predisposition side sees them as authentic preferences revealed when constraints are removed. Equality is contested: is it equality of opportunity (process) or outcome (distribution)? If we define equality as outcome, the paradox disappears by definition. If we define it as opportunity, the paradox remains. Finally, "innate" is often used as a placeholder for "not currently explained by environment," begging the question. Clarifying these definitions would reduce heat but not resolve the causal mechanism.

  ### Settled versus Contested

  **Settled:** Data quality varies significantly across borders; STEM definitions differ; absolute female employment rises with development.
  **Contested:** Whether the relative gap widening is meaningful; whether policy shocks change preferences or just constraints; whether the pattern holds outside OECD nations.
  **My Flags:** My claim that the pattern is "shakier than the internet says" is contested by researchers who find robust effects in larger datasets. My assertion that policy shocks differentiate the models assumes preferences are static in the Predisposition model, which some proponents deny, arguing preferences can evolve over generations, not just cohorts.
