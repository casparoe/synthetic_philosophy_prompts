          *   Nāgārjuna uses the latter. He isn't saying "It is true that not-p"; he is saying "I do not hold the view that p."
          *   *Analogy:* "I don't claim the king is bald" vs. "I claim the king is not-bald."

      *   **Point 2: Ontological Presuppositions (Svabhāva):**
          *   Classical logic assumes terms refer to things with intrinsic nature.
          *   Emptiness means nothing has intrinsic nature.
          *   Therefore, predications like "exists" or "does not exist" are category mistakes when applied to ultimate reality.
          *   The tetralemma exhausts the logical space of *intrinsic existence*. Since nothing has intrinsic existence, all four fail.

      *   **Point 3: The Two Truths Doctrine:**
