      *   *The User's View (Moral Residue):* This is the meat of the answer. Introduce the idea that justification doesn't equal innocence. You can be *justified* in breaking a promise, but the promise is still broken. The normative force doesn't disappear; it transforms.
      *   *The Concept of "Tragic Remainders":* Use the idea that some values are incommensurable. Care vs. Promise. You can't trade them off cleanly.
      *   *Is it Irrational?* Address the specific constraint. No, it's not irrational to feel torn. It acknowledges the cost. A moral theory that says "you should feel nothing because you chose the max utility" is impoverished.
