answer: |-
  Colleague, first let me say: put the phone down and breathe. You are in the midst of a lived ethical crisis that no seminar room can fully simulate. The fact that you are looking for conceptual clarity rather than comfort tells me you are trying to hold onto your rationality while the ground shifts beneath you. That is a philosophical act in itself.

  You are asking a precise metaphysical question about the structure of moral obligations: **Does justification erase violation, or does it merely license it?**

  Your sister is operating under what we might call the **Overridingness Thesis**. In this framework, moral obligations are hierarchical. If Duty A (care for father's safety) conflicts with Duty B (keep promise to father), and A is weightier than B, then A becomes your *all-things-considered* obligation. On this view, Duty B doesn't just lose; it effectively dissolves. You are not permitted to do B, so you cannot be blamed for not doing it. The "wrongness" you feel, in this framework, is indeed just emotional residue—psychological noise left over from a decision that was, objectively, the right one. If this framework is true, your lingering pain is a cognitive error. You are feeling guilt where there is no culpability.

  However, you are sensing something that a strict Overridingness Thesis cannot capture. You are describing what is often discussed in literature as **Moral Residue** or **Moral Remainders**.

  Here is the argument for why your feeling might be tracking something real about morality, rather than a confusion:

  **1. The Distinction Between "Permissible" and "Innocent"**
  In many robust moral frameworks, an action can be *justified* without being *innocent*. When you moved your father, you likely did the *best* thing available. It was the permissible, even required, all-things-considered choice. But that does not mean the promise you broke ceased to exist as a moral claim.
  Think of it this way: A *pro tanto* duty (a duty that holds "as far as it goes") was genuinely violated. The necessity of the situation justified the violation, but it did not retroactively annul the duty. The promise was real, the obligation was real, and the breach was real. The justification protects you from *blame*, but it does not erase the *loss* of the value inherent in promise-keeping. Your feeling of wrongness is the recognition of that loss. It is not guilt over doing the wrong thing; it is grief over the fact that the right thing required a moral cost.

  **2. Incommensurability vs. Trade-offs**
  Your sister's view assumes a kind of moral arithmetic: Safety > Promise. Therefore, Safety cancels Promise.
  But many philosophers argue that certain values are **incommensurable**. Care and fidelity are not on the same scale. You cannot simply say one is "more" than the other; they are different kinds of demands. When you are forced to choose between incommensurable values, you are not solving an equation; you are making a tragic choice. In a tragic choice, something of value is necessarily sacrificed. If morality is about respecting value, then the sacrifice of that value leaves a mark. To feel nothing would imply that the promise didn't matter. To feel the weight of it is to acknowledge that the promise *did* matter, even if it had to be broken.

  **3. Agent-Regret vs. Guilt**
  There is a crucial phenomenological distinction here. **Guilt** says, "I should not have done this." **Agent-Regret** says, "I am the one who did this, and I wish it were otherwise, even if it had to be done."
  If your framework defines rationality as "doing the max utility action and feeling nothing," then your feelings are irrational. But if your framework acknowledges that agents are emotionally constituted beings who stand in specific relationships (like daughter to father), then Agent-Regret is the *appropriate* rational response. It signals that you understand the gravity of the violation. A moral agent who breaks a serious promise and feels absolutely no residue might actually be morally deficient—they would be treating the promise as if it never existed, rather than as something sacred that was tragically overridden.

  **4. Can Morality Demand the Impossible?**
  You asked if morality can require two incompatible things without being irrational.
  If we say "No," we preserve the logic of "Ought implies Can." (If I can't do both, I can't be obliged to do both). This saves the system from contradiction but sacrifices the phenomenology of the experience.
  If we say "Yes," we allow for **Genuine Moral Dilemmas**. In this view, morality itself can be conflicted. The universe of obligations is not a perfectly coherent system; it is a messy web of claims. When the web tears, the tear is real. On this view, your stuckness isn't a failure of your reasoning; it is a reflection of the reality that moral demands can outstrip our capacity to fulfill them cleanly. The "wrongness" lingers because, in a sense, a wrong *was* done to the moral order, even if it was the only humanly possible choice.

  **The Verdict on Your "Stuckness"**
  You asked if the framework can make room for being torn like this without calling it irrational. The answer is yes.
  A moral theory that insists the "right choice" wipes the slate clean is arguably too clean for the human world. It treats moral obligations like legal contracts that can be voided by force majeure. But familial and moral obligations are often deeper than contracts.

  Your feeling that "picking one didn't erase the other" is philosophically defensible. It aligns with the view that **justification does not equal nullification**. You did what you ought to do, all things considered. But you still broke a promise. The obligation to keep the promise was not a hallucination that disappeared when the dementia worsened; it was a real claim that was overridden.

  The lingering sense of wrongness is not necessarily emotional residue in the sense of "noise." It can be understood as **normative residue**. It is the moral cost of the decision. To deny it would be to deny the reality of the promise you made.

  So, to answer your specific question: There *is* a difference between a hard choice where one duty outweighs another (the sister's view) and a situation where obligations survive (your view). In the first, the loser is defeated. In the second, the loser is sacrificed.

  You are not confused. You are experiencing the cost of moral agency in a non-ideal world. The fact that it hurts is not evidence that you chose wrongly; it is evidence that you chose honestly.

  Take care of yourself. The theory can wait. The living of it is what matters now.
