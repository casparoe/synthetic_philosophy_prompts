answer: |-
  This is a remarkably fertile tension for a long-form feature. You have identified a friction point that rarely gets named: the gap between the *functional necessity* of social coordination and the *phenomenological experience* of belonging required to make those functions feel moral.

  Your concept of **Normative Tourism** is the perfect lever to pry these two frameworks apart. It highlights the selective engagement of the outsider who treats culture as a buffet of visible aesthetics while ignoring the structural load-bearing walls of invisible obligation.

  Here is a comparative analysis of Normative Conventionalism and Practice-Embedded Particularism through the lens of Normative Tourism, structured to help you build your argument.

  ---

  ### I. The Ontology of the Invisible: How Each Framework Locates Obligation

  To understand how each view handles "invisible obligations" (like tipping economies or unspoken pedestrian right-of-way), we must first locate where they believe the moral force resides.

  **Normative Conventionalism (NC)** posits that the moral obligation arises from the **act of entry into a coordinated system.**
  *   **The Logic:** When you enter a social space where a convention sustains a public good (e.g., a service economy sustained by tips, or safety sustained by pedestrian flow), you become a beneficiary of that system.
  *   **Status of Invisible Obligations:** For the NC proponent, invisible obligations are *structural*. They exist independently of the visitor's knowledge. Not tipping isn't just a faux pas; it is a form of free-riding on the labor expectations established by the locale. The obligation is binding because the *consequence* of ignoring it (economic harm to the server, disruption of flow) is real, regardless of the visitor's intent.
  *   **View of the Visitor:** The visitor is a temporary citizen. By stepping onto the sidewalk or sitting at the table, they have implicitly signed a social contract to uphold the local coordination mechanisms.

  **Practice-Embedded Particularism (PEP)** posits that moral obligation arises from **participation in a shared form of life.**
  *   **The Logic:** Drawing on Wittgensteinian and anthropological roots, PEP argues that rules only have meaning within the web of relationships that sustain them. A tip is not money; it is a signal of recognition within a specific economic ritual. A queue is not a line; it is a physical manifestation of mutual trust.
  *   **Status of Invisible Obligations:** For the PEP proponent, invisible obligations are *relational*. If the visitor does not share the "background knowledge" or the "mutual recognition," the obligation literally does not exist for them in the moral sense. To the outsider, withholding a tip is not a moral failure; it is a category error. They are playing a different game.
  *   **View of the Visitor:** The visitor is a moral stranger. They are physically present but normatively distinct. They cannot be held to obligations they lack the capacity to recognize as obligations.

  **Comparison:** NC treats invisible norms as **laws of the terrain** (you must drive on the left because you are on this road). PEP treats them as **languages of the tribe** (you cannot be blamed for not speaking the dialect until you have learned to converse).

  ### II. Diagnosing Normative Tourism: Free-Riding or Category Error?

  Your concept of *Normative Tourism* describes a visitor who adheres to visible norms (queuing, saying "hello") but bypasses invisible ones (tipping, yielding). How do the frameworks judge this behavior?

  **1. The Normative Conventionalist Verdict: Moral Free-Riding**
  NC views Normative Tourism as exploitative. The tourist enjoys the *benefits* of the local moral order (efficient service, safe streets, orderly queues) without paying the *costs* of maintaining it.
  *   **The Charge:** By tipping only when reminded or ignoring pedestrian norms that aren't legally enforced, the tourist extracts value from the social coordination of others while exempting themselves from the burden.
  *   **The Harm:** This is not harmless consumption. It degrades the system. If enough tourists treat tipping as optional, the wage structure collapses. If enough treat pedestrian flow as optional, safety decreases.
  *   **Conclusion:** Normative Tourism is a form of parasitism on the host culture's moral infrastructure.

  **2. The Practice-Embedded Particularist Verdict: Structural Disruption**
  PEP is less likely to call it "immoral" and more likely to call it "disruptive noise."
  *   **The Charge:** The tourist isn't necessarily stealing; they are introducing friction into a machine they don't understand. Because they lack the "tacit background knowledge," their actions are unpredictable to locals.
  *   **The Harm:** The harm is not economic theft, but the erosion of *trust*. When a visitor follows the visible rule (the queue) but ignores the invisible one (the spacing distance), it signals to locals that the visitor is unreliable. It weakens the "mutual recognition" required for the form of life to function.
  *   **Conclusion:** Normative Tourism is a failure of integration that treats deep social grammar as surface-level aesthetics.

  **3. A Third Option: Epistemic Negligence**
  For your feature, you might argue that Normative Tourism is best understood as **Epistemic Negligence**. It sits between free-riding and category error.
  *   The tourist *could* know the invisible norms (they are often discoverable with minimal effort), but they choose to treat the culture as a spectacle rather than a system.
  *   This frames the issue not as "breaking a rule" (NC) or "lacking membership" (PEP), but as **refusing to do the work of moral translation.** It transforms the moral failure from the *act* (not tipping) to the *attitude* (assuming one need not learn).

  ### III. The Opacity Gap: Why Rules Feel Different to Insiders and Outsiders

  You asked which view offers a more coherent account of why certain rules feel obligatory to insiders yet remain opaque to outsiders.

  **Practice-Embedded Particularism wins on Phenomenology.**
  PEP explains the *feeling* of the gap perfectly. To an insider, not tipping feels like a betrayal of a relationship. To an outsider, it feels like a transaction. PEP accounts for why the obligation feels "thick" to the local and "thin" (or non-existent) to the visitor. It acknowledges that moral force is generated by shared history and reciprocal expectation, which tourists by definition lack.

  **Normative Conventionalism wins on Normative Force.**
  However, PEP struggles to explain why the outsider *should* care. If obligation requires shared form of life, then globalization makes moral obligation impossible in transient spaces. NC explains why the rule *should* bind the outsider even if it doesn't *feel* like it. It grounds the obligation in the reality of the consequences (the waiter needs the money) rather than the state of the relationship.

  **The Synthesis for your Feature:**
  The tension exists because **PEP describes the source of the obligation, while NC describes the scope of the obligation.**
  *   *Source:* The obligation feels real because of embedded practice (PEP).
  *   *Scope:* The obligation binds anyone benefiting from the practice (NC).
  *   *The Opacity:* The opacity exists because tourists engage with the *scope* (they are in the space) without accessing the *source* (the shared life). Normative Tourism is the act of claiming the benefits of the scope while pleading ignorance of the source.

  ### IV. Compliance vs. Assimilation: The Justification Problem

  This is the crux of your ethical dilemma: *Can we demand compliance without demanding assimilation?*

  **The Risk of Normative Conventionalism:**
  If pushed too hard, NC becomes moral imperialism. It suggests that the local way is the *only* moral way. It risks conflating "moral obligation" with "local preference." If a local norm is inefficient or unjust (e.g., a caste-based queuing system), NC might accidentally argue that visitors are obligated to uphold it simply because it is the coordinating convention.

  **The Risk of Practice-Embedded Particularism:**
  If pushed too hard, PEP leads to moral fragmentation. It creates "no-go zones" of obligation where outsiders can do as they please because they aren't "one of us." This undermines the possibility of universal hospitality. It suggests that morality is tribal, and visitors are exempt from the tribe's ethics.

  **A Proposed Path: The Duty of Inquiry**
  To justify demanding compliance without demanding assimilation, your feature might propose a **meta-obligation**.
  *   Visitors are not obligated to *inhabit* the local form of life (assimilation). They do not need to feel the same emotional weight about the queue that a local does.
  *   However, they *are* obligated to recognize that they are entering a **pre-existing moral architecture.**
  *   Therefore, the obligation is not "You must tip because you are part of our community," but "You must tip because you are benefiting from a system you did not build, and fairness requires you to uphold its maintenance costs."

  This shifts the burden from **ontological membership** (PEP) to **procedural fairness** (NC). It allows the visitor to remain an outsider (preserving their distinct identity) while demanding they act as a responsible guest (preserving the local order).

  **Reframing Normative Tourism:**
  Under this synthesis, Normative Tourism is not just free-riding; it is a failure of **moral humility.** It is the assumption that one's own moral framework (where tipping is optional) travels with them, overriding the host framework. The "harmless consumption" defense fails because the invisible norms are often economic or safety-critical, not merely performative.

  ### V. Structural Recommendations for the Feature

  To make this argument land in a long-form piece, consider structuring the narrative around specific "invisible architectures."

  1.  **The Economic Invisible (Tipping):** Use this to illustrate NC. The money is real; the need is real. The tourist who treats it as optional is extracting labor without paying the agreed price.
  2.  **The Spatial Invisible (Pedestrian Flow):** Use this to illustrate PEP. In Tokyo, standing on the left of the escalator isn't law; it's a rhythm. A tourist who stands on the right disrupts the flow not because they broke a law, but because they broke the rhythm.
  3.  **The Verdict:** Conclude that while PEP explains *why* the tourist feels disconnected, NC explains *why* the tourist is responsible.
  4.  **The Takeaway:** The "Moral Architecture" of a place is not just for the residents. It is a public good. Normative Tourism treats public goods as private playgrounds. The ethical visitor is not one who assimilates, but one who **inquires.**

  **Final Thought for the Piece:**
  The distinction between moral obligation and social assimilation collapses only if we assume morality is purely internal (about who you *are*). If we view morality as partly external (about what you *do* to the systems around you), then compliance is not assimilation—it is **stewardship.** The visitor is asked not to become a local, but to leave the local moral ecosystem intact. Normative Tourism fails because it treats the ecosystem as a backdrop rather than a living structure.
