prompt: |-
  I convene a standing committee that issues one-page joint public statements on behalf of a city-wide coalition: three neighborhood associations, a hospital, a school district, and two labor unions, nine votes in total, each with an effective veto. We meet for two hours a month, our drafts go past a lawyer but not a philosopher, and the finished text is read aloud at press conferences and quoted in local news, so it has to be intelligible to a reader with no training and short enough to fit on a single page. Our recurring failure mode is not that members are unreasonable but that on nearly every topic — a new homeless shelter, a school closure, a police shooting, a chemical plant's emissions permit, a donor's name on a hospital wing — each delegate arrives with a sentence the others experience as a flat falsehood, and we either deadlock, or we paper over the disagreement with vague compromise language that the local paper mocks and that none of the member organizations actually endorses. I have been reading about the Jain doctrine of many-sidedness in a survey course — anekāntavāda, the standpoint-relative theory of nayavāda, and the logical instrument of syādvāda with its sevenfold scheme of conditional predication, where a given predicate can hold of a subject in one respect, fail in another, hold and fail successively under two respects, or be inexpressible when both are pressed into a single assertion, and combinations of these — and I want to know whether it can be turned into something my committee can actually run rather than admire.

  What I need is a procedure: the questions to ask, in order, about a contested claim; what counts as a sufficient answer to each; where the procedure terminates in a flat assertion; and where it hands the decision to a person because the question is one of values rather than of aspects. Please build it around a few concrete mechanisms I have been sketching and tell me if they are the right ones. First, a standpoint ledger: for each disputed sentence, name the respect — whose interests, what time scale, what comparison class, what part or aspect of the subject — under which each delegate's claim is true, and require that a claim be marked unattached when no one can produce a respect under which it holds, since I suspect a good half of our disputes are claims whose speakers have simply never been asked to say in what respect. Second, an explicit sorting step that runs before the ledger, because my worry is that we would apply many-sidedness to disagreements that are not aspectual at all: some of our disputes seem to be straightforwardly empirical and should be settled by asking for a number and a baseline, some are disputes about the sense of a single word (safe, harm, community, consent) that should be settled by disambiguation, and only the remainder are genuine cases where incompatible claims are each correct from a defensible standpoint. Third, a collapse rule: a test for when the qualified, sevenfold treatment must collapse back into a plain, unhedged assertion, including the case where a delegate's claim rests on a factual falsehood that the rest of us can refute, and the harder case where the standpoint a claim is true from is itself one we should refuse to adopt — a claim true only from the perspective of someone who denies another party's standing or personhood. Fourth, a set of drafting rules for what a signed statement may look like when many-sidedness genuinely survives: whether we conjoin qualified claims, whether we attribute each claim to the party who holds it, whether we assert in a respect that is nobody's in particular, how we say in one page that a thing is and is not without looking evasive to a reader who has never heard of the doctrine, and above all how a non-absolutist description gets converted into a recommendation, since our statements almost always end in a request for some action and the reader will not accept a sevenfold answer to the question of whether the shelter should open.

  Please also flag, honestly, what this procedure cannot do and where judgment cannot be eliminated: my vice-chair's objection is that any method built on inexpressibility is a license for weasel wording, and my own is that the whole apparatus may just be relativism with better manners, or the journalistic habit of quoting both sides with an Indian vocabulary attached, and I would like the procedure to contain its own guards against those failure modes rather than trusting the goodwill of the drafter. Then run it on three of our pending items. The first: a statement on a drop-in center for homeless residents, where the neighborhood association says the area has become unsafe, the service providers say it has not, and the police have published three years of incident data that neither side has looked at. The second: a statement on whether to remove a benefactor's name from a hospital wing, where one faction's sentence is that he was the greatest friend this city ever had and the other's is that he was a segregationist who enriched himself through discriminatory lending — a case that looks to me like the textbook illustration, two true predicates about one man, except that we still have to vote on taking the name down. The third is the one I expect to dislike: a member organization is pressing us to say in the joint statement that a contested public-health question is genuinely open, when the relevant scientific bodies are not in fact divided, and I suspect the correct output of your procedure is either a statement that names that claim as false or no statement at all, which will cost us a signatory. What I want is the procedure, its failure modes, and those three worked applications, written so that a committee with no philosophical training could follow it in two hours.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a standing committee (9 votes, effective veto per member).
      *   **Members:** 3 neighborhood associations, 1 hospital, 1 school district, 2 labor unions.
      *   **Constraint:** One-page joint public statements, 2-hour monthly meetings, lawyer-reviewed (not philosopher), intelligible to general public, actionable recommendations required.
      *   **Problem:** Deadlock or vague compromise due to members arriving with mutually exclusive "truths" (flat falsehoods to others).
      *   **Proposed Solution:** Adapt Jain *anekāntavāda* (many-sidedness), *nayavāda* (standpoint theory), and *syādvāda* (sevenfold predication) into a practical procedural tool.
      *   **Specific Mechanisms to Evaluate/Integrate:**
          1.  Standpoint Ledger (naming the "respect").
          2.  Sorting Step (Empirical vs. Semantic vs. Standpoint).
          3.  Collapse Rule (When to stop hedging and assert flatly, including ethical boundaries).
          4.  Drafting Rules (How to write the final one-pager).
      *   **Requirements:** Flag limitations/failure modes (relativism, weasel wording), run on three specific cases (Homeless Shelter, Hospital Name, Public Health).
      *   **Tone/Style:** Practical, procedural, no jargon, usable by non-philosophers in 2 hours.

  2.  **Deconstruct the Philosophical Concepts for Practical Use:**
      *   *Anekāntavāda:* Reality is complex; no single statement captures the whole truth. *Practical translation:* Acknowledge partial validity without endorsing absolute truth.
      *   *Nayavāda:* Standpoints matter (context, perspective). *Practical translation:* Identify *whose* perspective makes a claim true (the "respect").
      *   *Syādvāda:* Sevenfold predication (maybe, maybe not, both, etc.). *Practical translation:* Don't use the 7-fold logic explicitly in the text (too confusing). Use it internally to test claims, but output clear, qualified assertions.
      *   *Key Challenge:* How to move from "it depends" to "therefore, we recommend X."

  3.  **Develop the Procedure (The "Many-Sided Protocol"):**
      *   *Goal:* Turn philosophical abstraction into a checklist for a 2-hour meeting.
      *   *Step 1: Triage (The Sorting Step).* Is this factual? Semantic? Or Standpoint?
          *   If Factual: Check data. If data exists, veto the false claim.
          *   If Semantic: Define terms.
          *   If Standpoint: Proceed to Ledger.
      *   *Step 2: The Standpoint Ledger.* For each claim, fill in: Who? When? Where? What metric?
          *   Rule: If no respect can be named, the claim is dropped.
      *   *Step 3: The Ethical Collapse.* Is a standpoint morally unacceptable (e.g., denying personhood)? If yes, collapse to rejection.
      *   *Step 4: Drafting the Statement.*
          *   Structure: Context -> Qualified Truths -> Shared Value -> Action.
          *   Avoid "on the one hand/on the other hand" paralysis. Focus on the *action* that respects the complexity.
      *   *Step 5: The Recommendation.* Must be actionable. How does a complex truth lead to a binary vote? (e.g., "Because X is true for A and Y is true for B, we do Z to mitigate Y while enabling X").

  4.  **Address the User's Specific Mechanisms:**
      *   *Standpoint Ledger:* Yes, keep it. It forces specificity.
      *   *Sorting Step:* Crucial. Prevents using philosophy to dodge facts.
      *   *Collapse Rule:* Essential for ethical boundaries and factual errors.
      *   *Drafting Rules:* Needs to ensure the final text isn't gibberish.

  5.  **Address Failure Modes (The "Guards"):**
      *   *Relativism/Weasel Words:* Guard against "both sides are right" when one is factually wrong. Guard against using "respect" to hide value judgments.
      *   *Actionability:* The procedure *must* force a vote. The statement *must* recommend something.
      *   *Public Intelligibility:* No Sanskrit terms in the press release.

  6.  **Run the Three Cases:**
      *   *Case 1: Homeless Shelter (Safety).*
          *   Triage: Empirical (crime stats).
          *   Outcome: Check data. If data says safe, neighborhood claim is false *empirically*, though their *fear* is real (standpoint).
          *   Drafting: Acknowledge fear, cite data, recommend safety measures + shelter.
      *   *Case 2: Hospital Name (Benefactor).*
          *   Triage: Standpoint/Value. Both factual (philanthropy vs. segregation).
          *   Outcome: Ethical Collapse. We cannot endorse the segregationist standpoint as a valid basis for honor, even if the money was real.
          *   Drafting: Acknowledge contribution, acknowledge harm, recommend removal based on current values.
      *   *Case 3: Public Health (False Controversy).*
          *   Triage: Empirical/Scientific Consensus.
          *   Outcome: Collapse. Science is not a standpoint.
          *   Drafting: State consensus. If member insists on "open question," they must veto or sign a statement stating the consensus (costing them credibility). Procedure says: Do not issue a joint statement if it requires lying about science.

  7.  **Refine the Tone:**
      *   Needs to be authoritative but humble.
      *   Avoid academic jargon in the procedure itself (explain *anekāntavāda* concepts in plain English).
      *   Respect the 2-hour limit.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the idea. It's a good fit for coalition building.
      *   *The Protocol:* Break it down into the 4 steps requested + Drafting.
      *   *The Guards:* Explicitly address the Vice-Chair's concerns.
      *   *The Cases:* Walk through the protocol for each.
      *   *Conclusion:* Final encouragement.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "use Jain logic." I need to translate *syādvāda* into "Qualification Levels." I also need to ensure the "Collapse Rule" is strong enough to handle the Public Health case, where the user suspects the output should be "No statement." That's a critical test. If the procedure forces a lie, it fails. The procedure must allow for *not* issuing a statement if consensus requires falsehood.

      *(Refining the Drafting Rules)*: The user asked how to convert non-absolutist description into a recommendation. The key is shifting from "Is X good?" to "Given X is good for A and bad for B, how do we proceed?" The recommendation becomes about *process* or *mitigation* rather than absolute moral declaration.

      *(Refining the "Respect" concept)*: Make sure "Respect" isn't just "opinion." It needs to be "Context + Metric + Stakeholder."

      *(Final Polish)*: Ensure the distinction between *Empirical*, *Semantic*, and *Standpoint* is clear in the Sorting Step. This is the most important guard against relativism.

  9.  **Final Review against constraints:**
      *   One-page statement constraint mentioned? Yes.
      *   2-hour meeting constraint? Yes, keep steps timed.
      *   9 votes/veto power acknowledged? Yes, procedure manages the veto.
      *   No philosopher jargon in the final output? Yes.
      *   Addressed the 3 specific cases? Yes.
      *   Addressed the failure modes? Yes.

      *Let's write it.*
answer: |-
  This is a sophisticated application of *anekāntavāda* (many-sidedness). You are correct that the doctrine is not merely metaphysical but pragmatic: it is a tool for conflict resolution among parties holding partial truths. However, your Vice-Chair is also correct that without strict guards, it becomes a license for equivocation.

  To make this work in a two-hour meeting with non-philosophers, we must strip the Sanskrit terminology and replace it with administrative protocol. The goal is not to teach the committee Jainism, but to embed its logical structure into your workflow.

  Here is the **Coalition Standpoint Protocol (CSP)**. It is designed to fit your constraints: one page, two hours, nine vetoes, public intelligibility.

  ---

  ### Part 1: The Procedure

  **Time Allocation:** 120 Minutes total.
  **Role:** The Chair (you) acts as the *Pramana* (validator), ensuring the rules are followed, not deciding the truth.

  #### Step 1: The Sorting Gate (20 Minutes)
  *Purpose: Prevent applying "many-sidedness" to factual errors or semantic confusion.*

  Before discussing the Standpoint Ledger, the Chair asks the proposer of a contested sentence to categorize the dispute:
  1.  **Empirical:** Is this about a number, a date, or a verifiable event? (e.g., "Crime rose 10%.")
      *   *Action:* Request the data source. If data exists and contradicts the claim, the claim is **False**. No standpoint saves a factual falsehood.
  2.  **Semantic:** Is this about the definition of a word? (e.g., "Is this 'safe'?")
      *   *Action:* Define the term operationally. (e.g., "Safe means no violent incidents in 12 months.")
  3.  **Standpoint:** Is this about value, priority, or experience? (e.g., "This policy harms the community.")
      *   *Action:* Proceed to Step 2.

  *Guard:* If a member insists an Empirical dispute is a Standpoint dispute to avoid data, the Chair rules the claim **Inadmissible** for the joint statement.

  #### Step 2: The Standpoint Ledger (40 Minutes)
  *Purpose: Force specificity. A claim without a "respect" is an opinion, not a truth.*

  For every surviving Standpoint claim, the delegate must fill out a ledger card. A claim is only valid if it can be attached to a **Respect**. A Respect consists of three coordinates:
  1.  **Stakeholder:** Who is experiencing this? (e.g., "Homeless clients," "Immediate neighbors," "Taxpayers.")
  2.  **Timeframe:** When does this hold? (e.g., "During construction," "Long-term operation," "Nighttime.")
  3.  **Metric/Value:** What is being measured or prioritized? (e.g., "Perceived safety," "Access to care," "Fiscal solvency.")

  *Rule:* If a delegate cannot name these three coordinates, the claim is marked **Unattached**. Unattached claims cannot appear in the joint statement.
  *Rule:* If two claims contradict (A says "X is good," B says "X is bad"), they can both remain *if and only if* they have different coordinates in the Ledger.

  #### Step 3: The Ethical Collapse (20 Minutes)
  *Purpose: Prevent relativism on human rights or scientific consensus.*

  Even if a claim has a valid Respect, it must pass the Collapse Test.
  1.  **The Factual Collapse:** If the Respect relies on a demonstrable falsehood (e.g., "From the perspective of someone who believes vaccines cause autism..."), the claim is **Collapsed** (rejected). Science is not a standpoint; it is the baseline.
  2.  **The Ethical Collapse:** If the Respect requires denying the standing or personhood of another party (e.g., "From the perspective of a segregationist..."), the claim is **Collapsed**. We do not validate standpoints that erase other members of the coalition or the public.

  *Outcome:* If a claim survives Sorting and Ledger but fails Collapse, it is vetoed by the Chair on procedural grounds.

  #### Step 4: Drafting the Recommendation (40 Minutes)
  *Purpose: Convert complexity into action.*

  You cannot publish a sevenfold predication. You must publish a decision. The drafting rule is **Integration, not Juxtaposition**.
  *   **Forbidden:** "Some say X, others say Y." (This looks evasive.)
  *   **Required:** "Because X is true for Group A, and Y is true for Group B, the Coalition recommends Z."

  The recommendation must address the tension identified in the Ledger. If the Ledger shows a conflict between "Neighbor Safety" and "Client Access," the recommendation cannot just be "Build the shelter." It must be "Build the shelter *with* specific safety mitigations."

  *Termination:* The text is finished when every sentence in the "Background" section maps to a Ledger entry, and the "Recommendation" section resolves the tension between those entries.

  ---

  ### Part 2: Failure Modes and Guards

  You asked for honesty about where this fails.

  **1. The "Weasel Word" Risk**
  *   *Risk:* Using "in some respects" to avoid taking a stand on a moral evil.
  *   *Guard:* The **Ethical Collapse**. If a standpoint requires ignoring a fundamental right (e.g., housing, health, dignity), it is not a "side"; it is an error. The procedure forces you to name the value being traded off. You cannot say "It is unsafe" without saying "For whom?" If the answer is "For white residents who fear black homeless people," the Ledger exposes the racism, and the Ethical Collapse kills the claim.

  **2. The "Relativism" Risk**
  *   *Risk:* Treating all truths as equal.
  *   *Guard:* The **Sorting Gate**. Empirical truths trump Standpoint truths. If the police data says crime is down, the neighborhood's feeling of unsafety is valid *as a feeling* (Standpoint: Perception) but invalid *as a crime statistic* (Empirical: Reality). The statement must distinguish the two.

  **3. The "Inaction" Risk**
  *   *Risk:* Describing complexity so well that no action is possible.
  *   *Guard:* The **Integration Rule**. The statement *must* end with a verb. If the Ledger reveals irreconcilable values (e.g., "Save the tree" vs. "Build the school"), the recommendation is not a compromise; it is a prioritization with mitigation. "We build the school, and plant ten trees elsewhere." Someone may still veto this, but the procedure ensures the veto is explicit, not hidden in vague text.

  **4. The "Veto" Reality**
  *   *Risk:* A member vetoes the procedure itself.
  *   *Guard:* None. You have nine vetoes. If a member refuses to fill out a Ledger card, they are effectively vetoing the statement. The procedure makes their obstructionism visible. "Member X refused to specify the respect under which their claim holds." This is politically costly for them.

  ---

  ### Part 3: Worked Applications

  Here is how the protocol runs on your three pending items.

  #### Case 1: The Drop-In Center (Homeless Shelter)
  *   **The Conflict:** Neighborhood says "Unsafe." Providers say "Safe." Police have data.
  *   **Step 1 (Sorting):** Empirical. "Unsafe" implies crime statistics.
  *   **Action:** Chair requests police data.
  *   **Result:** Data shows no increase in incidents.
  *   **Step 2 (Ledger):**
      *   *Provider Claim:* "Crime has not increased." Respect: Police Data, 3-year trend, Incident reports. (Valid)
      *   *Neighborhood Claim:* "The area is unsafe." Respect: Residents, Nighttime, *Perception* of loitering. (Valid as perception, invalid as crime stat).
  *   **Step 3 (Collapse):** The Neighborhood claim cannot be asserted as "Crime has increased." It must be collapsed to "Residents *feel* less safe due to loitering."
  *   **Step 4 (Drafting):**
      *   *Bad:* "Some feel unsafe, but data says safe."
      *   *Good:* "While police data shows no rise in incidents, neighbors report increased anxiety regarding loitering. To address both access and perception..."
      *   *Recommendation:* "The Coalition supports the shelter's opening, contingent on a funded security liaison and strict loitering protocols."
  *   **Outcome:** Providers get the shelter. Neighbors get mitigation. Data is respected. No one lies.

  #### Case 2: The Hospital Benefactor (Segregationist Donor)
  *   **The Conflict:** "Greatest friend" vs. "Segregationist."
  *   **Step 1 (Sorting):** Standpoint/Value. Both predicates are historically factual (he gave money; he practiced discrimination).
  *   **Step 2 (Ledger):**
      *   *Faction A Claim:* "He was a friend." Respect: Hospital Finance, 1970s, Capital infrastructure.
      *   *Faction B Claim:* "He was harmful." Respect: Marginalized Communities, Historical Justice, Social dignity.
  *   **Step 3 (Collapse):** Does Faction A's claim require denying personhood? If "Friend" implies "Friend to *all*," yes. If "Friend" means "Donor," no. However, the **Ethical Collapse** applies to the *honor*. We cannot uphold a standpoint that validates segregation as a neutral "perspective."
  *   **Step 4 (Drafting):**
      *   *Constraint:* We must vote to keep or remove the name.
      *   *Integration:* "We acknowledge the wing was built with his funds (Respect A), but our current values reject the discrimination he practiced (Respect B)."
      *   *Recommendation:* "Remove the name. Acknowledge the history in a plaque that explains both the gift and the harm."
  *   **Outcome:** This uses *syādvāda* (maybe true in one respect, false in another) to justify a binary action. The name comes down, but the history isn't erased.

  #### Case 3: The Public Health "Controversy"
  *   **The Conflict:** Member wants to say "The science is open." Scientific bodies say "The science is settled."
  *   **Step 1 (Sorting):** Empirical.
  *   **Action:** Chair requests consensus statements from relevant bodies (CDC, WHO, etc.).
  *   **Result:** Consensus exists.
  *   **Step 2 (Ledger):**
      *   *Member Claim:* "The question is open." Respect: ?
      *   *Chair Ruling:* There is no Respect under which settled science is "open," except "From the perspective of someone ignoring the consensus."
  *   **Step 3 (Collapse):** **Factual Collapse.** This claim relies on a falsehood. It is inadmissible.
  *   **Step 4 (Drafting):**
      *   *Option A:* The statement asserts the consensus. The dissenting member vetoes. No statement is issued.
      *   *Option B:* The statement asserts the consensus. The dissenting member abstains (if your bylaws allow) or signs with a footnote (if allowed).
      *   *Protocol Verdict:* **No Statement.**
  *   **Rationale:** The procedure protects the coalition's credibility. If the only way to get 9 votes is to lie about science, the procedure dictates silence. It is better to have no statement than a statement that fails the Sorting Gate. You tell the member: "We cannot sign this. If you insist on this language, you are vetoing the coalition's integrity, not just the text."

  ---

  ### Part 4: Implementation Notes for the Chair

  1.  **Print the Ledger:** Do not discuss this abstractly. Have physical cards or a projected spreadsheet with columns for *Claim, Stakeholder, Timeframe, Metric*. If a cell is empty, the claim is dead.
  2.  **Train the Lawyer:** Your lawyer reviews for liability. Show them the **Ethical Collapse** rule. It protects you from endorsing defamation or discrimination under the guise of "balance."
  3.  **The "No Statement" Option:** You must normalize the idea that the procedure sometimes outputs *silence*. If the Sorting Gate reveals that agreement requires factual falsehood, the committee's job is to withhold speech, not manufacture compromise.
  4.  **Public Language:** Never use the words "standpoint," "respect," or "predicate" in the press release. Use "For," "During," and "Regarding."
      *   *Philosophical:* "Syād-asti (In some respect it is)."
      *   *Press Release:* "For long-term residents, the change feels abrupt."

  ### Summary of Limits
  This procedure cannot force a member to abandon a core value. If a neighborhood association fundamentally opposes homeless people existing near them (an Ethical Collapse candidate), they will veto the "mitigation" compromise. The procedure does not solve hatred; it exposes it. It forces the veto to be public and specific ("I veto this because I refuse to acknowledge the data") rather than hidden in vague language ("I veto this because the language is insufficient").

  It turns your meetings from a battle of assertions into a process of **calibration**. You are not asking them to agree on the truth; you are asking them to agree on *where* their truth applies. That is usually enough to find a path forward.
