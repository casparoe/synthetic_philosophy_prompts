  The break is in **(1)**. Specifically, the inference from "there is no procedure-independent fact" to "if procedures diverge, there is no fact of the matter."

  Here is the diagnosis, the pricing of alternatives, and my confidence level.

  ### The Diagnosis: Why (1) is the Leak

  **Why it looked fine:**
  Step (1) appeals to a robust realist intuition: if something is *real*, its existence or truth shouldn't vanish just because we measure it differently. If two perfectly fair rulers give different lengths for the same table, we worry the table doesn't have a determinate length. You applied this to group agency: if two fair procedures give different judgments, you concluded the group didn't *really* judge. It feels like you're exposing a lack of ontological grounding.

  **Why it is wrong:**
  You are conflating **procedure-dependence** with **indeterminacy**.
  Group agency is not a natural kind (like "gold" or "water") waiting to be discovered; it is an *institutional* kind (like "checkmate" or "marriage"). Institutional facts are *constituted* by the rules that define them.
  *   **Chess Analogy:** Ask, "Did the pawn move diagonally?" There is no "Chess-independent" fact. If you play by standard rules, the fact is *no*. If you play by house rules allowing diagonal pawns, the fact is *yes*. The divergence doesn't mean "The pawn move didn't happen." It means "The move is relative to the rulebook."
  *   **Relativity Analogy:** Ask, "How much time elapsed?" There is no "frame-independent" fact. If two observers in different frames disagree, it doesn't mean "Time doesn't exist." It means "Time is frame-relative."

  Step (1) asserts that because the fact is procedure-relative, it disappears when procedures clash. The correct inference is that the fact becomes *indexical* to the procedure. "The Court judged X" is shorthand for "The Court, operating under Constitution C, judged X." If the Court operates under C1 and outputs X, and C2 and outputs ¬X, there is no contradiction and no error theory. There are just two different institutional acts.

  By rejecting the inference in (1), you save group agency. You accept that collective intentionality is real but *constitutionally relative*.

  ### Pricing the Alternatives

  **1. Rejecting the step from (4) to (5) (The Quantifier Shift)**
  *   **The Move:** You admit that (4) only proves divergence is *possible* for any X, not that it *actually* occurs for every X in every real group.
  *   **The Cost:** This fixes the logic but leaves the metaphysical bullet in the chamber. It saves groups that *happen* to have stable procedures, but it concedes that in any case where a group *actually* faces a discursive dilemma (e.g., a court with ambiguous voting rules), the group literally ceases to exist or judge. You end up with an error theory for "hard cases" of collective decision-making.
  *   **Verdict:** This is a necessary logical correction, but it's not deep enough. It treats the problem as a slip in modal logic rather than a misunderstanding of social ontology.

  **2. Rejecting (2) or (3) (The Logic/Math)**
  *   **The Move:** You deny the tautology $X \leftrightarrow (X \lor Y) \land (X \lor \neg Y)$ or the profile construction.
  *   **The Cost:** You break classical logic. This is prohibitively expensive. The Discursive Dilemma is a robust theorem; denying the math makes you unintelligible to the literature.
  *   **Verdict:** Non-starter.

  **3. Accepting the Conclusion (6) (Error Theory)**
  *   **The Move:** You bite the bullet. Groups don't exist.
  *   **The Cost:** You lose the ability to make sense of corporate responsibility, legal verdicts, and democratic mandates. As you noted in (7), this likely collapses into individual error theory too (via time-slices), destroying the subject who is doing the philosophizing.
  *   **Verdict:** Self-defeating.

  ### Confidence and Defeaters

  **Confidence:** 90%
  This is the standard resolution in the social choice literature (e.g., List & Pettit, *Group Agency*). They accept the premises of the Discursive Dilemma but reject the conclusion that groups are fictions. Instead, they argue groups must *manage* consistency, often by prioritizing premise-based procedures to maintain rationality. The "groups don't exist" conclusion is widely regarded as a *reductio* of the metaphysical assumption in (1), not a genuine discovery.

  **What Would Move Me:**
  I would shift if you could demonstrate that **moral responsibility** requires procedure-independence in a way that mere "judgment" does not.
  If your reading group's focus is on *blame* rather than *belief*, the argument gains traction. If a corporation can evade responsibility by saying "Well, under procedure A we were guilty, but under procedure B we were innocent," then procedure-relativity might indeed undermine the *normative* force of group agency, even if it doesn't undermine the *ontological* fact. If you can show that the *point* of positing group agents is to anchor responsibility, and that anchor requires robustness across fair procedures, then (1) becomes defensible, and the error theory becomes a normative warning rather than a metaphysical claim.

  **Summary:** Keep (2), (3), and (4). Fix the logic in (4)→(5) as a minor patch. But surgically remove the second sentence of (1). Group judgment is real, but it is a fact *relative to the constitution*, not a fact *independent of it*.
