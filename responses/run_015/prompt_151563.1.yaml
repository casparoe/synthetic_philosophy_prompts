          *   However, for the essay's purpose, committing to the **Individualist/Interlocking** view (with a caveat about structure) is usually safer for a philosophy of action paper unless arguing specifically for group agents. *Wait, actually, the prompt asks what hangs on the choice.* I need to remain neutral but illuminate the consequences.
          *   *Better advice:* The "Deferential" move is the most philosophically interesting middle ground. It preserves the "we" without requiring omniscience.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just list theories (Bratman, Gilbert, Searle) as the user asked for conceptual structure, not a run-through of rival positions.
      *   *Focus:* Focus on the *normative implications* and the *nature of intention*.
      *   *Key Insight:* The "Opaque" case challenges the idea that intention must be *conscious representation*. If intention can be dispositional or role-based, the definition changes.
      *   *Responsibility:* If I deny shared intention, I must explain why the nurse feels guilty if the patient dies due to a systemic error she didn't know about. If I affirm it, she might be implicated in a "group intention" she didn't fully grasp.

  6.  **Final Polish:**
