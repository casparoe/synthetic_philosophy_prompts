      *   **Key Distinction:** Transparent/Paradigmatic Shared Intention vs. Opaque Collective Action (systematic realization without individual representation of the whole).
      *   **Specific Questions/Moves:**
          1.  *Deferential Authorship:* Is intending "to do my part in whatever this is" a genuine we-intention or just individual compliance?
          2.  *Substitution Test:* If a mercenary replaces a believer, does the group action change? Does intention matter?
          3.  *Core Ontological Question:* What is lost if we say there's *no* shared intention (just interlocking individuals + structure) vs. saying there *is* shared intention located in the *group* (non-sumative)?
          4.  *Degree vs. Kind:* Is the difference between transparent and opaque cases a matter of degree (how much is represented) or kind (location of intention)?
          5.  *Responsiveness:* Is responding to a protocol a species of mutual responsiveness?
          6.  **Crucial Question:** Which account does least violence to the concept of intending?
          7.  **Most Important Question:** *What hangs on the choice?* (Commitments regarding acting for a reason, distribution of responsibility).

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Individualism (Reductionism):** Bratman, Gilbert (to an extent), Tuomela. Shared intention is a complex web of individual intentions + mutual knowledge.
      *   **Non-Individualism (Collectivism):** List & Pettit, Roth. Groups can be agents with intentions distinct from members.
      *   **The "Opaque" Case:** This challenges the "mutual knowledge/common goal" requirement of standard shared intention accounts (like Bratman's). If I don't know the goal, can I intend *us* to do it?
      *   **The "Deferential" Move:** This sounds like Bratman's "modest we-intention" or perhaps a division of labor account.
      *   **The "Substitution" Move:** This tests the functional role of the mental state. If behavior is identical, does the mental state matter for the *ontology* of the action?

  3.  **Address the Specific Queries:**

      *   **Deferential Authorship:** Is it a we-intention?
          *   *Argument for:* It allows the individual to latch onto the group agency without knowing the details. "I intend that we J, where J is determined by the organization."
          *   *Argument against:* It looks like "I intend to follow rules" + "I believe rules help the group." This is interlocking individual intention.
          *   *Verdict:* It's a borderline case. It stretches "intention" to include deferential content.

      *   **Substitution Test:**
          *   If the mercenary does the same job, the *outcome* is the same. But is the *action* the same?
          *   If action requires intention, and the mercenary lacks the group-directed intention, then strictly speaking, *they* aren't participating in the shared intention, even if the *group* succeeds.
          *   This highlights the tension between functional success and agential participation.

      *   **Location of Intention (Individual vs. Group):**
          *   *Option A (No Shared Intention):* Only interlocking individual intentions.
              *   *Loss:* We lose the normative glue. Why do I owe *you* coordination? Why is it a betrayal if I defect? It becomes merely instrumental.
              *   *Gain:* Ontological parsimony. No spooky group minds.
          *   *Option B (Group Intention):* The group intends, individuals implement.
              *   *Loss:* Risk of reification. How does a non-mental entity intend?
              *   *Gain:* Explains the stability and normative structure of large organizations better than web-of-beliefs models.

      *   **Degree vs. Kind:**
          *   It's likely a *kind* difference regarding the *structure of agency*, but a *degree* difference regarding *epistemic access*.
          *   However, for the purpose of the essay, framing it as a shift from *interpersonal* coordination to *structural* coordination is key.

      *   **Responsiveness:**
          *   Responding to a protocol is *mediated* mutual responsiveness. I respond to the protocol *because* I know you are too. It's a derivative form.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the "opaque" problem (it's a known hard case in social ontology).
      *   **The Conceptual Structure (The "What"):**
          *   Clarify the distinction: *Interpersonal Coordination* (Paradigm) vs. *Structural Coordination* (Opaque).
