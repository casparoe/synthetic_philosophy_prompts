answer: |-
  This is an exceptionally sharp set of questions. You have identified the precise pressure point where social ontology tends to crack: the transition from the *interpersonal* (the duet) to the *institutional* (the hospital). Most introductory texts gloss over this middle range, but for a final-year paper, it is exactly where the philosophical work needs to be done.

  You are asking for the conceptual structure, not a catalogue of names. So, let us set aside the specific labels of Bratman, Gilbert, or List & Pettit for a moment and look at the architecture of the problem you have isolated.

  ### 1. The Conceptual Structure: Interpersonal vs. Structural Coordination

  The distinction you are struggling to state cleanly is best understood not as a difference in the *content* of the intention, but in the **mechanism of coordination**.

  *   **Paradigmatic Shared Intention (Interpersonal):** The coordination is achieved *through* the intentions themselves. My intention refers to yours, and yours to mine. The "mesh" is constituted by our mutual knowledge and mutual responsiveness. The intention is the glue.
  *   **Opaque Collective Action (Structural):** The coordination is achieved *despite* the limitations of the intentions. The "mesh" is constituted by the external structure (the protocol, the hierarchy, the workflow). The intention is merely the engine that drives the individual part; the structure ensures the parts fit.

  This clarifies your "Degree vs. Kind" question. It is a difference of **kind in the mode of coordination**, which results in a difference of **degree in epistemic access**.
  In the paradigmatic case, the intention *is* the coordinating mechanism. In the opaque case, the structure *is* the coordinating mechanism. Therefore, in the opaque case, the participants do not need to represent the collective end because the structure guarantees the end regardless of their representation of it.

  ### 2. Evaluating Your Two Moves

  **First: Deferential Authorship**
  You ask if intending "to do my part in whatever this is" recovers a genuine we-intention.
  *   **The Risk:** This stretches the concept of intention to the breaking point. Intention is traditionally understood as a commitment to a specific outcome. If the content is wholly underspecified ("whatever *that* is"), it looks less like an intention and more like a **disposition to comply**.
  *   **The Verdict:** This move saves the "we" only by emptying it. It posits a we-intention that lacks the essential feature of intentionality: directedness toward a specific state of affairs. It is "individual intention in collective clothing" because the normative force comes from the individual's commitment to the rule, not from a commitment to the other participants.

  **Second: The Substitution Test**
  You ask if replacing a believer with a mercenary changes the description of the group action.
  *   **The Insight:** This test reveals that **functional success is not agential unity.** The ship gets unloaded either way. But if the mercenary lacks the deferential intention, they are not a *participant* in the shared agency; they are a *causal condition* utilized by the agency.
  *   **The Verdict:** If you say nothing changes, you are adopting a **functionalist** view of group action (the output defines the action). If you say something changes, you are adopting an **agential** view (the mental states define the action). In philosophy of action, the latter is standard. Therefore, the substitution *does* change the ontological status of the participant, even if it doesn't change the outcome.

  ### 3. Responsiveness to Protocol vs. Person

  Is responsiveness to a shared procedure a species of mutual responsiveness?
  **No.** It is a **derivative** form.
  In the paradigmatic case, I adjust my speed because *you* are slowing down. In the opaque case, I adjust my speed because the *protocol* says the conveyor belt moves at $X$ speed. I am responsive to the protocol; I am not responsive to you. I am only responsive to you in the thin sense that we are both responsive to the same third thing (the structure).
  If you classify this as mutual responsiveness, you dissolve the distinction between acting *with* someone and acting *alongside* someone under the same constraints.

  ### 4. What Hangs on the Choice?

  This is the crux of your essay. Your ontological commitment here dictates your normative conclusions. Here is what you are buying into with each option.

  #### Option A: Deny Shared Intention (The "Interlocking Individual" View)
  *You say: In the opaque case, there is no shared intention. There are only interlocking individual intentions plus a structure.*

  **Commitment 1: The Location of Reasons**
  You are committed to the view that **all reasons for action must be representable by the individual agent.** If a nurse cannot represent the "discharge of the patient" as her goal, she cannot act for that reason. She can only act for the reason "follow the checklist."
  *   *Consequence:* This preserves a clean, traditional philosophy of action. Intention remains a psychological state of a human being. It does "least violence" to the standard concept of intention.

  **Commitment 2: The Distribution of Responsibility (The Problem of Many Hands)**
  This is the high-cost commitment. If there is no shared intention, there is **no shared responsibility.** Responsibility must distribute down to individuals based on their causal contribution and their individual mental states.
  *   *Consequence:* In the opaque case (e.g., a hospital error), if no single individual intended the harm, and no single individual represented the collective goal sufficiently to be negligent, **no one is responsible.** You are committed to the "Problem of Many Hands": outcomes for which the group is responsible, but for which no individual can be blamed. You must either accept this moral gap or find a way to blame individuals for "systemic negligence" (which is difficult without a concept of shared agency).

  #### Option B: Affirm Shared Intention in the Group (The "Corporate Agent" View)
  *You say: There is a shared intention, located in the group/structure, fixed by decision procedures.*

  **Commitment 1: The Location of Reasons**
  You are committed to the view that **reasons can attach to roles, not just persons.** An individual can act for a reason that they do not fully grasp, provided they occupy a node in a rational system that does grasp it.
  *   *Consequence:* This does violence to the traditional concept of intention (which is mental), but it saves the phenomenon of large-scale coordination. It requires you to argue that "intention" can be a functional property of a system, not just a psychological property of a brain.

  **Commitment 2: The Distribution of Responsibility**
  If the group intends, the group can be responsible. This allows for **collective blame** that does not simply reduce to the sum of individual blames.
  *   *Consequence:* You can hold the "Hospital" responsible even if the staff were all following protocol. However, you face the challenge of cashing out what it means to punish or hold responsible a non-human entity. Does responsibility stop at the group level, or does it flow back to the members? If it flows back, you risk blaming individuals for intentions they didn't hold (violating the control principle). If it doesn't flow back, you risk letting individuals off the hook for their participation in harmful systems.

  ### 5. Recommendation: Which does least violence?

  For a philosophy of action paper, I recommend you argue for a **modified Individualism** that acknowledges the **Structural Mediation**.

  **The Argument:**
  Do not posit a "group mind." That invites metaphysical objections you may not have space to defend. Instead, argue that in the opaque case, **the structure functions as a proxy for the mutual knowledge condition.**

  In the paradigmatic case, I need to know *your* intention to coordinate. In the opaque case, I do not need to know *your* intention; I only need to know *the protocol*. The protocol acts as a common reference point that substitutes for mutual knowledge.

  **Why this is the strongest position:**
  1.  **Conceptual Hygiene:** It keeps intention as a psychological state of individuals (doing least violence to the concept of intending).
  2.  **Explains the Difference:** It explains why the hospital case feels different from the duet. In the duet, the coordination is fragile and depends on us. In the hospital, the coordination is robust and depends on the system.
  3.  **Responsibility:** It allows you to solve the responsibility puzzle. If the coordination is structural, then **responsibility for the structure is distinct from responsibility for the role.**
      *   The individual is responsible for executing the role (individual intention).
      *   The designers/maintainers of the protocol are responsible for the collective outcome (structural intention).
      *   This avoids the "Problem of Many Hands" by locating the "shared intention" not in the frontline workers, but in the architects of the system who *did* represent the collective end.

  **What this commits you to in the essay:**
  You must argue that **acting for a reason** in an opaque collective does not require representing the *final* end, but it does require representing the *structural* end (i.e., "I am maintaining the integrity of the protocol").
  If you take this line, you can claim that the frontline worker in the opaque case *does not share the intention* of the collective outcome in the same way the duet partners do. They share a **compliance intention**.

  **The Payoff:**
  This allows you to conclude that **moral responsibility in opaque collectives is asymmetrical.** Those who design the protocol (who hold the shared intention) bear a different kind of responsibility than those who execute the roles (who hold only compliance intentions). This is a nuanced, defensible, and philosophically rich conclusion that avoids both the trap of mystical group minds and the trap of exonerating individuals in large systems.

  **Summary for your Supervision:**
  Tell your supervisor you are distinguishing between **Intention-Based Coordination** (Paradigm) and **Structure-Based Coordination** (Opaque). Argue that the latter does not require shared intention among all participants, but rather a division of agential labour where only the "architects" hold the we-intention, and the "operators" hold role-compliance intentions. This preserves the concept of intention while accounting for the reality of large-scale social action.
