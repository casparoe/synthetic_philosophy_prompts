      *   **The Stakes (The "What Hangs On It"):** *This is the most important part.*
          *   *Theory of Action:* If you choose Individualism, action is always rooted in individual psychology. If you choose Collectivism, action can be rooted in procedure/structure.
          *   *Responsibility:* This is the big payoff.
              *   *Individualist view:* Responsibility tracks causal contribution + individual intent. (Problem: "Many Hands" problem).
              *   *Collectivist view:* Responsibility can attach to the role or the group, potentially diluting individual blame or shifting it to the structure.
          *   *Reasons for Action:* Do I act because *I* want the goal, or because *the role* demands it?
      *   **Recommendation:** Which does least violence?
          *   Argue for a *pluralist* approach or a *structured individualism* (like Bratman's later work or Pettit's corporate agency).
