  6.  **Formulate the "No-Go" / Trade-off:**
      *   There is a trilemma:
          1.  **Extensionality/Compositionality:** The meaning of a complex sentence is a function of its parts.
          2.  **Hyperintensionality:** Distinct logical equivalents are distinct contents (avoids LO).
          3.  **Logical Structure:** The logic validates useful inferences (allows reasoning).
      *   Standard Kripke: 1 & 3, fails 2.
