      *   *Key Moore Text:* *Principia Ethica*, Chapter VI ("The Ideal"). Moore lists the "great goods." He discusses organic unities in Chapter I and applies them in VI. He explicitly states that the value of a whole is not the sum, but he *never* offers a formula.
