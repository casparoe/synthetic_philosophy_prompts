answer: |-
  # Q&A Strategy Sheet: "Verisimilitude Without Convergence"

  ## Opening Concessions (To Lower Temperature)
  **State these explicitly in your first 3 minutes:**
  1.  **To the Realists:** Concede immediately that this account *does not* save the No-Miracles Argument in its traditional form. Acknowledge that if false theories can be highly verisimilar, success is not a unique marker of truth. Frame this as a feature, not a bug: it explains the "miracle" of Newtonian stability without requiring Newtonian ontology.
  2.  **To the Physicists:** Concede that you do not offer a decision procedure for theory choice in high-energy regimes where auxiliaries collapse. Your metric is retrospective (evaluating stability), not prospective (predicting which theory will survive).
  3.  **To the Instrumentalists:** Concede that "modal robustness" is a metaphysical posit. Do not try to sell it as purely empirical. Argue instead that it is a *necessary* posit to explain why some empirical adequacies persist across theory change while others vanish.

  ---

  ## The 8 Objections (Ordered by Likelihood $\times$ Damage)

  ### 1. The Background Dependence Objection (Philosophers of Physics)
  **Objection:** "Your metric relies on 'physically accessible counterfactual perturbations.' But in quantum gravity regimes, we lack a fixed spacetime background to define 'small' perturbations. If your measure of verisimilitude requires a background metric to define the modal neighborhood, your account is inapplicable precisely where theory choice is most urgent. You are presupposing the stability you claim to measure."
  **Reply:** "You are correct that the *definition* of the perturbation space is theory-relative. However, verisimilitude is a comparative relation between a theory and a domain, not a global property. In QG, we assess robustness relative to the *effective* background of the low-energy limit. I am not claiming to measure robustness from a 'God's eye' view, but from within the effective field theory that governs the experimental regime. The metric holds wherever a semi-classical approximation is valid."
  **Weakness:** This retreats to effective theories, potentially conceding that verisimilitude disappears at the fundamental level.
  **Concession Strategy:** **Defend.** If you concede this, the thesis collapses into instrumentalism. You must maintain that modal robustness is definable relative to the *effective* structure, even if fundamental structure is obscure.

  ### 2. The No-Miracles Severance (Structural Realists)
  **Objection:** "If a false theory can rank highly on verisimilitude due to modal inertness, you have severed the link between predictive success and ontological truth. This undermines the No-Miracles Argument. If falsehoods can be robust, why infer structure from success? You've made the miracle mundane, but at the cost of making truth irrelevant."
  **Reply:** "I am not making truth irrelevant; I am refining what we value in truth. The 'miracle' isn't that the theory is true, but that its errors are localized. We should infer *structural stability*, not ontological correctness. This preserves the realist intuition that success isn't luck, without committing to the falsified ontology of superseded theories. It shifts the miracle from 'truth' to 'stability'."
  **Weakness:** Realists may view "structural stability" without ontological commitment as a hollow victory.
  **Concession Strategy:** **Concede Up Front.** Acknowledge this weakens *standard* NMA but argue it strengthens a *refined* structural realism.

  ### 3. The Empirical Adequacy Redundancy (Instrumentalists)
  **Objection:** "This looks like empirical adequacy with extra metaphysical steps. If a theory's false components don't affect predictions, the theory is empirically adequate in that domain. Why posit 'modal inertness' rather than simply noting the range of empirical validity?"
  **Reply:** "Empirical adequacy is binary and actual; modal robustness is graded and counterfactual. Two theories can be empirically adequate in the actual world, but one may fail under slight variations in boundary conditions while the other holds. Modal robustness explains *why* certain frameworks (like Newtonian mechanics) are preferred for engineering despite being known false: they are safer bets under variation, not just accurate at the point of measurement."
  **Weakness:** Requires showing a case where empirical adequacy and modal robustness come apart.
  **Concession Strategy:** **Defend.** This distinction is the core utility of your paper. Do not yield.

  ### 4. The EFT Preemption (Philosophers of Physics)
  **Objection:** "Effective Field Theory (EFT) already accounts for this. We know Newton is an limit of GR. We don't need 'modal inertness' to explain why Newton works at low energies; we just need the derivation of the limit. Your account is a philosophical redescription of standard reduction."
  **Reply:** "EFT explains *how* the limit is derived, but not *why* we treat the limit as verisimilar rather than merely useful. EFT tells us Newton is false. My account explains why it is *not merely false*—why it retains a claim to representing physical law-structure despite falsity. It bridges the gap between 'useful fiction' and 'approximate truth' without requiring convergence."
  **Weakness:** Relies on the audience accepting that there is a gap between "useful" and "verisimilar."
  **Concession Strategy:** **Concede Part.** Admit EFT provides the mechanism, but maintain your account provides the *normative* justification for continued use.

  ### 5. The Structural Retention Challenge (Structural Realists)
  **Objection:** "Isn't modal inertness just a consequence of structural retention? The reason Newton's errors are inert is that the mathematical structure is preserved in GR. You are describing the symptom (robustness) rather than the cause (structural continuity)."
  **Reply:** "Structural retention is one *path* to modal inertness, but not the only one. A theory could have the wrong structure but still yield robust predictions due to compensating errors or decoupling of scales. Modal inertness is the broader category; structural retention is a specific ontological explanation for it. I am defining the metric of success, not the ontological source."
  **Weakness:** If structural retention is always the cause, your metric is redundant.
  **Concession Strategy:** **Defend.** Keep the distinction between the *metric* (inertness) and the *explanation* (structure).

  ### 6. The Unverifiable Modality (Instrumentalists)
  **Objection:** "We cannot observe counterfactual perturbations. To claim a component is 'modally inert' requires knowledge of non-actual scenarios. This makes verisimilitude epistemically inaccessible, rendering it useless for theory choice."
  **Reply:** "We access modality through intervention and variation, not just observation. We test robustness by pushing systems to boundary conditions. When we engineer a bridge, we are testing the modal inertness of Newtonian assumptions against stress variations. It is not mystical; it is experimental stress-testing."
  **Weakness:** "Stress-testing" is still actual-world testing, not true counterfactual access.
  **Concession Strategy:** **Concede Part.** Acknowledge epistemic limits but argue it is no worse than standard realism's access to unobservables.

  ### 7. The Loss of Normative Progress (Structural Realists)
  **Objection:** "If we abandon convergence to a unique true theory, how do we define scientific progress? If Newton and GR are both 'robust' in their domains, in what sense is GR *better* other than having a wider domain?"
  **Reply:** "Progress is the expansion of the domain of modal robustness. GR is better not because it is 'truer' in a binary sense, but because its false components (if any) are inert across a wider range of physically accessible perturbations, including high-gravity regimes. Progress is domain-expansion of stability, not asymptotic approach to a limit."
  **Weakness:** "Domain expansion" might not feel like "progress" to a realist seeking *the* truth.
  **Concession Strategy:** **Defend.** This is your alternative definition of progress. Stand firm.

  ### 8. The Constitutive Auxiliary Problem (Philosophers of Physics)
  **Objection:** "In quantum gravity, auxiliaries aren't just assumptions that break; they constitute the theory's definition. If the auxiliary assumptions about spacetime topology are under pressure, you can't separate the 'core' from the 'inert false components.' The distinction dissolves."
  **Reply:** "In regimes where the core/auxiliary distinction dissolves, my metric suspends judgment. I am not claiming verisimilitude is measurable everywhere, only that it explains stability where theory *does* function. In QG uncertainty, we simply acknowledge we lack a robustness metric until the regime stabilizes."
  **Weakness:** Limits the scope of your thesis significantly.
  **Concession Strategy:** **Concede Up Front.** Limit the scope to regimes where a law-structure is identifiable.

  ---

  ## The "Must Land" Reply
  **Objection #1 (Background Dependence).**
  **Why:** If the physicists convince the room that "modal perturbations" cannot be defined without a fixed background metric, your entire metric becomes mathematically ill-defined in the most important modern contexts. If the metric doesn't work, the thesis is dead.
  **Strategy:** Do not waver on the definition being *effective* rather than *fundamental*. If you try to claim it works fundamentally, you will be crushed by the QG specialists.

  ---

  ## The Dreaded Objection (Internal Coherence)
  **The Objection:** "You define modal inertness relative to a theory's own law-structure. But if a theory is radically false about the nature of possibility itself (e.g., assumes absolute time when time is relative), its 'internal' counterfactuals are delusions. How can a theory be 'robust' relative to its own false modal structure? If you define inertness relative to the *world's* modality, you presuppose access to the truth you claim we don't converge on. You are stuck in a Euthyphro dilemma: Is a component inert because the theory says so, or because the world allows it?"

  **Why this is fatal:** It attacks the coherence of the definition. If inertness is theory-relative, it's circular (false theories validate themselves). If world-relative, it requires the access to truth you deny.

  **Preparation:** Have a slip of paper with this written on it. If asked, pause. Acknowledge the depth of the problem.
  **Draft Response:** "It is world-relative, but accessed via theory. We use our best current theory to map the modal space to evaluate the predecessor. This makes verisimilitude retrospective and fallible, not ahistorical. We judge Newton from the vantage of GR." (This admits verisimilitude is not timeless, which saves the coherence but costs the objectivity).
