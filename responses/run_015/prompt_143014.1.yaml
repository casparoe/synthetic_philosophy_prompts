  # PHILOSOPHY OF HISTORY — SORTING QUIZ
  **Seminar Handout // Draft v.3**

  Hey everyone — below is a decision tree to help sort where you stand on the shape of time. Don't overthink it, just go with your gut on the scenarios. The goal isn't to match a famous name you like, but to see what logical commitents you're actually making. 

  There are 6-8 nodes. If you hit a leaf, read the "awkward commitment" to see if you can live with it.

  ***

  ### NODE 1: The Collapse Scenario
  **Imagine two societies 600 years apart hit the exact same resource collapse. Do they converge on similar institutional responses, or is every crisis totally particular?**
  *   **A)** Every crisis is totally particular (context rules all). → **Go to Leaf 1**
  *   **B)** They converge on similar responses (patterns exist). → **Go to Node 2**

  ### NODE 2: The Driver
  **If they converge, what is driving the similarity?**
  *   **A)** Human learning/adaptation (we get better at solving problems). → **Go to Node 3 (Linear)**
  *   **B)** Institutional decay and reset (systems rot and rebuild). → **Go to Node 4 (Cyclical)**

  ### NODE 3: Linear Split
  **Does this learning aim at a specific endpoint?**
  *   **A)** Yes, history aims at a final state (freedom, communism, kingdom of God). → **Leaf 2 (Teleological)**
  *   **B)** No, it's open-ended progress (things get nicer, but no finish line). → **Leaf 3 (Open-Ended Progressive)**

  ### NODE 4: Cyclical Split 1 (The Niche)
  **Are these cycles strictly sequential (one after another) or can they overlap?**
  *   **A)** They can be nested/overlapping (a short political loop running inside a longer economic one). → **Leaf 4 (Unnamed — Polyrhythmic)**
  *   **B)** They are strictly sequential (one cycle must finish before the next). → **Go to Node 5**

  ### NODE 5: Cyclical Split 2 (Scope)
  **Do these cycles live inside discrete civilizational organisms or are they universal patterns?**
  *   **A)** Universal patterns (apply to all societies everywhere). → **Go to Node 6**
  *   **B)** Discrete organisms (each civilization is a separate lifeform). → **Go to Node 7**

  ### NODE 6: Universal Split (Structure vs. Energy)
  **What is repeating?**
  *   **A)** Structural repetition (same regime-types rotating: monarchy -> tyranny -> etc). → **Leaf 5 (Polybius)**
  *   **B)** Energetic repetition (same solidarity-force, different institutional shell). → **Leaf 6 (Ibn Khaldun)**

  ### NODE 7: Discrete Split (Fate vs. Choice)
  **Why does the organism die?**
  *   **A)** Inevitable aging/death (biological fate, cannot be stopped). → **Leaf 7 (Spengler)**
  *   **B)** Challenge-and-response failure (moral failure, could have been saved). → **Leaf 8 (Toynbee)**

  ***

  ### THE LEAVES (Read your result)

  **Leaf 1: Radical Particularist (Unnamed)**
  *   **Awkward Commitment:** You have to admit that history teaches us nothing because no two moments are alike.
  **Leaf 2: Teleological Linear (e.g., Hegel/Marx)**
  *   **Awkward Commitment:** You must believe the past was just a waiting room for our current endpoint.
  **Leaf 3: Open-Ended Progressive (e.g., Enlightenment Whig)**
  *   **Awkward Commitment:** You assume things generally get better without being able to say where "better" ends.
  **Leaf 4: Unnamed — Polyrhythmic**
  *   **Awkward Commitment:** Your model is likely incoherent or just unexplored; you claim history is messy but still try to map it.
  **Leaf 5: Polybius (Anacyclosis)**
  *   **Awkward Commitment:** You believe political regimes rot on a timer regardless of culture or technology.
  **Leaf 6: Ibn Khaldun (Asabiyya)**
  *   **Awkward Commitment:** You must accept that desert solidarity always beats city luxury, forever.
  **Leaf 7: Spengler (Morphological)**
  *   **Awkward Commitment:** You treat cultures like plants that are destined to die, making reform pointless.
  **Leaf 8: Toynbee (Challenge-Response)**
  *   **Awkward Commitment:** You place the burden of civilizational survival on the moral creativity of elites.

  ***

  ### ⚠️ LOGIC FLAG
  **Note on Seperation:** The tree struggles to cleanly seperate **Ibn Khaldun** and **Spengler**. Both talk about rise/fall and "organic" social forces. In this tree, Khaldun is filed under "Universal Patterns" (asabiyya works everywhere) and Spengler under "Discrete Organisms" (cultures are unique souls), but in practice, students often mix these up. Don't worry if you landed near the border.

  ### QUICK SCORING KEY
  *   **1A** → Leaf 1 (Particularist)
  *   **1B → 2A → 3A** → Leaf 2 (Teleological)
  *   **1B → 2A → 3B** → Leaf 3 (Open-Ended)
  *   **1B → 2B → 4A** → Leaf 4 (Polyrhythmic)
  *   **1B → 2B → 4B → 5A → 6A** → Leaf 5 (Polybius)
  *   **1B → 2B → 4B → 5A → 6B** → Leaf 6 (Khaldun)
  *   **1B → 2B → 4B → 5B → 7A** → Leaf 7 (Spengler)
  *   **1B → 2B → 4B → 5B → 7B** → Leaf 8 (Toynbee)
