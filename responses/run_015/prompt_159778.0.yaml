answer: |-
  **Order and dependencies**
  Begin with the closure principle alone. Students know FOL, so $K\phi, K(\phi \to \psi) \vdash K\psi$ is accessible. Show how iterating this over tautologies yields omniscience. This makes the problem statable without semantics. However, introduce possible-worlds semantics (sets of worlds) in minute 20 to show *why* standard epistemic logic enforces this closure structurally. The semantics reveals the problem isn't just a rule, but a model constraint where knowledge sets are closed under intersection. Introduce your Width/Depth distinction here, immediately after formalizing the problem. Width explains why we don't know all tautologies; Depth explains why we miss long derivations. This split organizes the subsequent discussion of solutions, preventing students from conflating distinct failures. Do not introduce modal syntax before establishing the intuitive closure problem; let the formalism serve the intuition, not vice versa. The dependency is: Intuition -> Closure Principle -> Possible Worlds Model -> Width/Depth Diagnosis -> Solutions. You cannot diagnose the failure type until the closure principle is accepted as the standard being violated. The semantics are not required to state the problem, but they are required to explain why the standard model cannot accommodate the intuition. Place the Width/Depth distinction after the semantics but before evaluating solutions, as it categorizes the specific failures the solutions attempt to address.

  **The carrying example**
  Use Alice with ciphertext $C$ and key $K$. She knows $C$, knows $K$, and knows $K \land C \to M$ (message content). She does not know $M$. The example must avoid implying $M$ is logically independent; it must be a necessary consequence. Crucially, avoid contradictions or impossible worlds; keep $M$ true and consistent. Avoid suggesting Alice believes $\neg M$; her state is ignorance, not error. This isolates logical omniscience from consistency issues. The example must highlight computational cost as the barrier, not logical possibility. This ensures students see the gap between epistemic possession and cognitive access without muddying the waters with paradoxes like the Preface or Lottery. Keep the logic propositional to avoid FOL complexity distractions. The example must remain static; do not model the decryption process dynamically, or you shift focus to learning rather than knowledge states.

  **Misconceptions**
  First misconception: "It's just bounded rationality." Head this off when introducing Alice (Minute 10). Emphasize that epistemic logic is normative, not psychological. The problem is that the *definition* of knowledge breaks, not just human performance. Second: "Credence solves it." Address this after possible worlds (Minute 40). Show that assigning probability 1 to premises forces probability 1 to conclusions. Probabilistic models inherit the closure problem if certainty is involved. Third: "Awareness fixes it." Raise this during solutions (Minute 60). Explain that awareness restrictions merely relocate the problem to the awareness function itself, which often remains omniscient. Sequence these interventions to match the flow: Intuition -> Formalism -> Solutions. If you wait until the end, students will have already categorized the problem as psychological rather than logical. Each misconception must be blocked before it solidifies into a working assumption for the rest of the seminar. Explicitly label them "Traps" on the board. Warn them that moving to credence only helps if we abandon certainty, which changes the epistemic notion entirely.

  **The check**
  Closing question: "If we restrict knowledge to proofs under 100 steps (solving Depth), does Alice know every tautology? Why does Width still threaten omniscience?" This forces them to apply your distinction. It checks if they understand that limiting proof length doesn't eliminate the infinite set of trivial truths they haven't considered. It confirms they grasp that the problem is multifaceted, not just about hard calculations. If they answer yes, they missed the Width point.

  **What I'm skipping and saying so**
  Explicitly skip: Impossible worlds semantics, hyperintensional contexts, and dynamic epistemic logic. State clearly: "These are real solutions, but they require tools we don't have today." This prevents students from thinking you claim there are no solutions, only that these are beyond scope. It maintains credibility while bounding the session. Tell them these topics exist in graduate literature so they know where to look later. Do not attempt to sketch them; simply list them as "Advanced Topics."
