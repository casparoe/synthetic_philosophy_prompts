          *   *Van Fraassen's stance:* Reflection is a constraint on *current* opinion about *future* opinion. $C_0(p | C_t(p)=x) = x$. If I know I will learn $E$, and $E$ raises $p$, then I know $C_t(p)$ will be higher. So $C_0(p)$ should already be higher? No.
          *   *The Law of Total Probability:* $C_0(p) = \sum C_0(p | C_t(p)=x_i) \cdot C_0(C_t(p)=x_i)$. If Reflection holds, $C_0(p) = \sum x_i \cdot C_0(C_t(p)=x_i) = E_0[C_t(p)]$. My current credence must be the *expectation* of my future credence.
          *   *Does this forbid expected change?* No. I can expect my credence to go up or down, as long as the *expected value* is my current credence. I can expect variance.
          *   *So where does the friend go wrong?* Step (4) and (6). Expecting to revise (variance) is not the same as expecting the *expected value* to shift (drift). Reflection forbids *predictable drift* (without new evidence), but it allows *expected variance* (due to potential new evidence).
          *   *Wait, the friend says:* "I fully expect my views on p to move a lot." If I expect them to move *in a specific direction* (e.g., "I will become a realist"), then Reflection is violated. If I expect them to move *somewhere* (variance) but don't know where, Reflection is satisfied.
          *   *The Friend's Premise (5):* "I fully expect my views on p to move a lot." This is ambiguous. Does it mean $E[C_t(p)] \neq C_0(p)$? Or does it mean $Var(C_t(p))$ is high?
          *   *If (5) means Directional Change:* Then Reflection *does* forbid this (unless based on evidence I already have, in which case I should update now). This is the "No Free Lunch" / "Martingale" property of rational belief. You can't predict which way your belief will go without updating now.
          *   *If (5) means Variance:* Then Reflection allows this.
          *   *The Friend's Conclusion (6):* "Reflection implies that a rational inquirer can't expect to learn anything." This is the straw man. Reflection implies you can't expect to learn anything *that you can predict the direction of now*. You can expect to encounter evidence that will shift you, but you can't predict the shift *before seeing the evidence*.
          *   *So the error is in (4) and (6).* Specifically, the conflation of "expecting a change" with "expecting a directional bias."

      *   **Wait, there is a known problem with Reflection:** It fails when the agent expects to be irrational (e.g., getting drunk, forgetting). Van Fraassen acknowledges this. The principle assumes the future self is treated as an expert.
      *   **But the Friend's argument is about Inquiry/Learning.** This is the "Problem of Known Evidence." If I know I will read a book that will convince me of $p$, should I believe $p$ now?
          *   Standard Bayesian answer: No. You must wait for the evidence.
          *   Reflection implication: If you are *certain* you will believe $p$ later ($C_t(p)=1$), Reflection says $C_0(p | C_t(p)=1) = 1$. So $C_0(p)$ should be 1.
          *   This *is* a problem for Reflection. It seems to force "anticipatory updating."
          *   *Resolution:* You are rarely certain *what* your future credence will be. You are certain you will *update*, but not on *what*. You assign probabilities to various future credences.
          *   *Example:* I will run an experiment. Outcome $E$ (prob 0.5) $\rightarrow$ Credence 0.9. Outcome $\neg E$ (prob 0.5) $\rightarrow$ Credence 0.1.
          *   Current Credence: $0.5(0.9) + 0.5(0.1) = 0.5$.
          *   Expected Change: Yes, credence will change (to 0.9 or 0.1).
          *   Reflection Check: $C_0(p | C_t=0.9) = 0.9$? Yes. $C_0(p | C_t=0.1) = 0.1$? Yes.
          *   Does this violate "I expect to revise"? No, I expect to revise, but I don't expect to revise *in a specific direction*.
          *   *Friend's Premise (5):* "I fully expect my views on p to move a lot." If this means "I expect them to move to $x$ (specific)," Reflection kills it. If it means "I expect them to move to $x$ or $y$," Reflection allows it.
          *   *Friend's Premise (4):* "expecting to revise is expecting that my future self gets it wrong." This is the main error. Expecting to revise is expecting *new evidence*. It is not expecting the future self to be wrong (irrational) nor the current self to be wrong (irrational).

