      *   **The "Bad Step" vs. "Inconsistent Premises":** It's a case of a bad step (4). The premises cannot all stay because (4) is false.
      *   **Restricted Reflection:** Van Fraassen's Reflection is too strong because it doesn't account for *known irrationality* (forgetting, bias). We need a **Qualified Reflection Principle**.
          *   *Condition:* Only applies if I believe my future self is updating rationally (conditionalizing) and not losing information.
          *   *What it loses:* It loses the ability to handle cases where I know I will be irrational (e.g., "I know I'll be tired and stubborn tomorrow"). It becomes a normative ideal rather than a descriptive constraint on actual agents who know their flaws.
          *   *Does it solve the Friend's problem?* Yes, because the Friend's problem relies on conflating *learning* (rational update) with *error*. Qualified Reflection permits expected change due to expected evidence (learning), but forbids expected change due to predictable drift (bias).

  5.  **Refining the "Premise 4" Rejection:**
      *   Premise 4 says: "taking my future self to be likely right about p just is having no reason to expect to revise my present view of p."
      *   Counter: I can take my future self to be likely right (because they will have more data) while having good reason to expect to revise (because I will get that data).
      *   The key is distinguishing between *unpredictable* revision (compatible with Reflection) and *predictable directional* revision (incompatible with Reflection).
      *   If the friend expects *directional* revision (e.g., "I will definitely become a realist"), Reflection says they are irrational *now*. This is actually a feature, not a bug. It's the "Principle of No Known Unknowns" regarding one's own rational updates.
      *   So, is (4) false? Yes, because "expecting to revise" is compatible with "taking future self to be right" *provided the revision is driven by expected evidence uncertainty*.
      *   However, if (5) implies *directional* expectation, then (6) follows, but (5) describes an irrational state.
      *   Best approach: Attack (4). It equates "expecting a difference" with "expecting an error."

  6.  **Refining the "Restricted Version":**
      *   Standard fix: **Reflection with a "Rationality" Clause.** $C_0(p | C_t(p)=x \text{ & } R_t) = x$, where $R_t$ is the proposition that the agent is rational at $t$.
      *   Or: **New Reflection (Christensen/Arntzenius):** Condition on the *evidence* expected, not just the credence.
      *   Let's stick to the Van Fraassen spirit: The Dutch Book argument works if you assume you won't forget and won't be irrational.
      *   Restricted Version: "Treat your future self as an expert *only insofar as* you expect them to be better informed and equally rational."
      *   What is lost? The simplicity. You can't just look at the future credence; you have to model *why* it changed.

