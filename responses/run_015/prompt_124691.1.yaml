          *   *Power vs. Inquiry:* Who decides what counts as evidence? Who frames the hypothesis? Power often dictates the terms of inquiry (e.g., tobacco industry funding research).
          *   *Non-negotiables:* Human rights? If rights are negotiable hypotheses, does that allow tyranny of the majority (or minority) if "tested"? Dewey usually says rights are conditions for inquiry, but is that consistent?
      *   *Unfalsifiability:* If any regime that claims to test policies counts as "democratic" in this sense, the term loses critical bite. An authoritarian regime with a good statistical bureau could claim to be "democratic" on this view.
      *   *Normative Foundations:* Dewey's commitment to "growth" is arguably a metaphysical or ethical commitment, not an empirical finding.

  4.  **Drafting the Response - Section by Section:**

