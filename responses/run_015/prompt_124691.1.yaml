      *   **Section 4: Ranking the Defeaters:**
          *   *Fatal:* The "Criterion of Consequences" problem (needs external norm). The "Power/Coercion" problem (inquiry under duress isn't inquiry).
          *   *Awkward:* Historical cases of authoritarian efficiency (requires nuance on "cooperative").
          *   *Manageable:* Dewey's own foundational commitments (admit they are philosophical bets).
      *   **Section 5: Weighing the User's Specific Concern:**
