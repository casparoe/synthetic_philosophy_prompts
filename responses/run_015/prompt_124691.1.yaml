          *   *Failure with Democracy:* Weimar Republic (procedurally democratic, collapsed), Contemporary Polarization (elections exist, but inquiry is blocked by partisanship), Gridlock (inability to revise policies based on evidence).
      *   *Conceptual Issues:*
