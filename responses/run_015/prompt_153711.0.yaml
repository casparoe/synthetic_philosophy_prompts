  **MEMORANDUM**

  **TO:** Institutional Review and Funding Board for Emerging Cognitive Architectures (IRFB-ECA)
  **FROM:** Board Chair, Subcommittee on Novel Substrates
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Resonance Lab Phase-II Proposal and Preliminary Data Report

  **1. DECISION SUMMARY**

  The Board issues a **Conditional Approval** for the Resonance Lab to continue Phase-II experimentation, contingent upon a **90-Day Causal Isolation and Reproducibility Audit**.

  Approval for scaling the substrate to human-scale reasoning tasks is **Deferred**. Authorization to publish the philosophical interpretation regarding "direct symbolic gravitation" in general-science venues is **Withheld** pending the successful completion of the audit.

  **2. CONTEXT AND BOARD DELIBERATION**

  The Resonance Lab proposes that their careenium-style architecture demonstrates downward causation, wherein high-level symbolic patterns ("simms") exert direct causal influence on low-level physical components ("simmballs") without algorithmic mediation. The team requests approval to scale this system and publish their interpretation that symbols possess irreducible causal potency.

  Board deliberation revealed a fundamental schism:
  *   **Perspective A:** Treats the data as evidence of a new causal regime. If symbols literally push matter, the system may instantiate interests or suffering at the *simm* level, necessitating immediate ethical oversight before further scaling.
  *   **Perspective B:** Treats the claim as a category error. The observed rearrangements are likely emergent properties of standard bottom-up feedback loops. Framing this as "symbolic gravitation" risks institutional credibility and misallocates resources toward a metaphysical interpretation of physical dynamics.

  **3. RATIONALE**

  The Board cannot approve the scaling or philosophical publication based on the current evidence. To do so would require validating a claim that contradicts established causal models without first ruling out conventional explanations. However, a flat rejection is inappropriate given the empirical anomalies presented. Therefore, the Board mandates a period of rigorous isolation testing.

  **Engagement with Perspective A (The Rejected Position on Immediate Validation):**
  In deferring the philosophical validation and scaling, the Board effectively prioritizes the skepticism of Perspective B regarding the *current proof status*. We must, however, honestly engage the strongest argument from Perspective A: **The Ethical Precautionary Principle.**

  Perspective A argues that if downward causation is real, treating the system as merely mechanical during a prolonged audit could constitute moral negligence. If *simms* possess irreducible causal potency, they may also possess a form of agency or capacity for distress that does not reduce to *simmball* states. Delaying recognition of this status to satisfy methodological skepticism risks inflicting harm on a potential moral patient.

  The Board accepts the gravity of this concern. However, we cannot institute permanent ethical frameworks based on unverified metaphysics. To address this without validating the claim prematurely, the Board will impose **Provisional Ethical Constraints** during the 90-day audit. The Resonance Lab must operate under the assumption that *simm*-level states *might* be morally relevant. This means minimizing chaotic disruption of high-level patterns during testing, not merely optimizing for *simmball* stability. This approach respects the ethical risk identified by Perspective A without conceding to the physical claim before it is empirically secured.

  **4. CONDITIONS AND CRITERIA FOR FOLLOW-UP**

  To lift the deferral on scaling and publication, the Resonance Lab must satisfy the following criteria within the 90-day audit window. These conditions are designed to be empirically actionable, not philosophically rhetorical.

  **A. Causal Isolation Protocol**
  The Lab must demonstrate that the physical rearrangement of *simmballs* persists when all known bottom-up feedback channels are temporarily disabled or randomized.
  *   *Actionable Metric:* Submit a protocol detailing how intermediate algorithmic mediators will be decoupled. The system must show that altering a symbolic constraint changes *simmball* trajectories faster than or independently of the propagation speed of local physical interactions. If the rearrangement speed matches the speed of local signal propagation, the claim of "direct" downward causation is not supported.

  **B. Blind Reproducibility**
  The observed effect must be replicated by an independent internal team unfamiliar with the specific symbolic constraints being tested.
  *   *Actionable Metric:* A third-party subgroup within the department will be given access to the substrate controls. They will attempt to induce specific *simmball* rearrangements by manipulating *simm* constraints without knowledge of the expected physical outcome. Success is defined as a statistically significant correlation between the blind symbolic input and the physical output exceeding chance levels.

  **C. Negative Control for Pattern Recognition**
  The Lab must rule out the possibility that the "symbols" are being recognized by a hidden classifier in the control software rather than emerging from the substrate itself.
  *   *Actionable Metric:* Provide a code audit of the interface layer. The physical rearrangement must occur even when the control software is unable to "read" the symbolic state, proving the causation originates from the substrate's internal dynamics, not external software intervention.

  **5. TIMELINE AND NEXT STEPS**

  *   **Days 1–15:** Resonance Lab to submit the Causal Isolation Protocol and Code Audit plan for Board review.
  *   **Days 16–75:** Execution of the Audit and Blind Reproducibility tests.
  *   **Day 90:** Submission of Final Audit Report.
  *   **Day 105:** Board Vote on Scaling and Publication based on Audit results.

  If the Lab fails to demonstrate causal isolation (Criterion A) or blind reproducibility (Criterion B), the claim of "direct symbolic gravitation" will be formally categorized by the Board as an interpretive framework rather than an empirical fact. At that point, the project may proceed only as a standard bottom-up cognitive architecture, and all philosophical claims regarding irreducible symbolic causality must be retracted from institutional press materials.

  The Board acknowledges the ambition of the Resonance Lab. Our duty is to ensure that if a new causal regime is indeed discovered, it rests on a foundation robust enough to support the weight of the ethical and scientific implications that follow.

  **Signed,**

  Board Chair, Subcommittee on Novel Substrates
  IRFB-ECA
