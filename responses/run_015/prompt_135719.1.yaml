answer: |-
  Based on the six precedents provided, here is the analysis of the committee's operating rule, the prediction for the new proposal, and the evidence required to stress-test that rule.

  ### 1. The Rule You Are Actually Applying
  You are applying the second rule: **"Approve when every step is one a competent reviewer could endorse from the artifacts, without redoing the work."**

  While performance matching human baselines (Rule 1) appears in almost every approved case, it is not the deciding factor. **Decision 3 is the key.** In that case, the AI feedback was rated *as helpful as human comments* (satisfying Rule 1), yet it was rejected. The rejection rationale was explicitly about the lack of artifacts: the model could not identify the passage it was commenting on, and it invoked irrelevant criteria. Similarly, **Decision 6** (Literature Screener) was rejected despite 96% recall because it gave "no reason for any inclusion."

  Conversely, **Decision 2** (Code Assistant) was approved *without* measuring the AI's suggestions for accuracy. It passed because the process created a verifiable artifact: a line-by-line log of human accept/reject decisions with reasons.

  Your committee tolerates performance variance (Decision 5 was "non-inferior," not superior) and even lacks of direct outcome measurement (Decision 2), but it does not tolerate **ungrounded decisions**. You require **Grounded Auditability**: the system must produce evidence (spans, rubric items, logs) that allows a human to verify *why* a decision was made without re-performing the task.

  ### 2. The Prediction
  **Verdict: Approved.**

  The "span-locked scoring" proposal is effectively a direct remedy to the specific failures of Decision 3 (Essay Feedback) and Decision 6 (Literature Screener).
  *   **Grounding:** By quoting a span for every criterion, it solves the "missing passage" failure of Decision 3.
  *   **Auditability:** A human reviewer can look at the span and the verdict to endorse the step without reading the whole report (satisfying Rule 2).
  *   **Independence:** The adversarial test (planted misleading passages) addresses the contamination concerns of Decisions 4 and 6.
  *   **Safety:** Routing disagreements to humans mirrors the safety condition of Decision 1.

  The use of a second "weaker model" as the checker rather than a human is the only friction point, but because the output is span-locked, a human *could* verify it if needed. The committee has shown willingness to accept automated processes (Decision 2, 5) provided the *artifacts* are human-verifiable.

  ### 3. The Closest Analog
  **Decision 1 (Physics Grading)** is the procedural precedent, but **Decision 3 (Essay Feedback)** is the substantive analog.

  *   **Decision 1** establishes the "human review of disagreements" protocol you are using here.
  *   **Decision 3** is the ghost you are exorcising. The new proposal is essentially "Decision 3, but fixed." In Decision 3, the model commented on essays without grounding; here, it scores reports with explicit spans. In Decision 3, the model invoked wrong criteria; here, the second model checks the criterion application.

  If you approve this, you are formally declaring that the flaw in Decision 3 was not the use of AI for text assessment, but the lack of **explainable grounding**.

  ### 4. The Commitment of the Alternative
  If you were to **Reject** this proposal (despite its grounding and adversarial testing), you would be committing the committee to a stricter standard: **"Human-in-the-Loop Verification."**

  *   **Implication:** You would be establishing that a "competent reviewer" (from Rule 2) must be a *human*, not a second model. You would be ruling that machine-generated verification is insufficient for auditability, regardless of the artifacts provided.
  *   **Cost:** This would severely limit the scalability of automated assessment. It would require that any automated scoring be verified by human spot-checks of the *reasoning*, not just the final grade.
  *   **Benefit:** It would protect against "model collusion," where the scorer and checker models share a blind spot (e.g., both agree on a verdict based on a span that looks relevant but is logically insufficient).

  By **Approving**, you commit to **"Machine-Verifiable Artifacts."** You accept that if the artifacts (spans) are human-readable, the verification step itself can be automated. This scales assessment but introduces the risk that the "audit" is performative—if both models fail the same way, the human never sees the error.

  ### 5. The Discriminating Evidence
  To definitively separate Rule 1 (Outcome Matching) from Rule 2 (Process Auditability) in this specific context, you need to know if the *artifacts* hold up, independent of the *grades*.

  **The Test:** **A blind audit of the *span-to-verdict* link by human markers.**

  *   **Method:** Take a random sample of the items the system scored *without* human intervention (the 65% where models agreed). Present human markers with **only** the Rubric Criterion and the **Quoted Span** (hiding the rest of the report and the final grade). Ask: "Does this span justify this verdict?"
  *   **Separation:**
      *   **If humans agree with the link:** Rule 2 is satisfied. The artifacts are genuinely auditable.
      *   **If humans disagree with the link, but the final grades still match the human baseline:** This reveals the models are getting the right grades for the wrong reasons (e.g., using correlated but irrelevant text).
          *   If you **Approve** despite this: You are following **Rule 1** (Outcomes matter, reasoning is secondary).
          *   If you **Reject** despite the grade match: You are following **Rule 2** (The step must be endorsable; correct outcomes via invalid reasoning are unacceptable).

  Given Decision 3, I anticipate your committee would **Reject** if the span-to-verdict link fails human audit, even if the grades match. This confirms Rule 2 is your true operating standard.
