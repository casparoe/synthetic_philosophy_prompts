  7.  **Final Output Generation** (incorporating the above thoughts into the requested format).
      *   *Self-Correction during drafting:* Make sure I don't sound like a helpful editor. Sound like a reviewer who thinks the paper might get rejected. Be sharper on the "Legibility" definition. It's actually about *accessibility* not legibility in the Scott sense.

      *   *Refining Q1:* The sentence "Codification and informal enforcement are substitutes, not complements" is the biggest target.
      *   *Refining Q2:* Legibility is dependent on Breadth.
      *   *Refining Q3:* Totalitarianism is the counter-example (high/high).
      *   *Refining Q4:* Threat hypothesis wins. Change creates threat.
