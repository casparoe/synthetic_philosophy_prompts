answer: |-
  1. **Where am I overreaching?**
  The sentence that will get your draft torn apart is: "Codification and informal enforcement are substitutes, not complements." This is your linchpin, and it is empirically fragile. The strongest objection is that in stable, high-functioning societies, they are complements. Law works *because* norms support it. If you steal, you go to jail (codified) and your family is ashamed (informal). When informal sanctioning collapses, codified law doesn't smoothly substitute; it often becomes unenforceable because there is no social will to back it up. You are describing a desperate substitution that happens during social decay, not a functional trade-off. If you claim this is a universal mechanism, a reviewer will hit you with examples where strong norms and strong laws coexist (Scandinavia, Japan) and where weak norms and weak laws coexist (failed states). You are mistaking a specific transitional phenomenon (modernization) for a structural law.

  2. **Is the three-way split actually doing any work?**
  Mostly no. "Legibility" collapses into "Breadth." If you have a norm for every domain of behavior (high Breadth), it is mathematically impossible for a newcomer to learn them all (low Legibility). They move in opposite directions by definition, not by independent variable status. You treat them as three dials on a mixing board, but Breadth and Legibility are tied to the same fader. Furthermore, your definition of Legibility is actually about *accessibility* or *transparency*, not legibility in the political science sense (which is usually about the state seeing the citizen). You are smuggling a complaint about complexity into a variable called Legibility. If you cut Legibility and fold it into the cost of Breadth, the argument becomes tighter. As it stands, it feels like you needed a third variable to make the taxonomy look symmetrical.

  3. **Is the "substitutes" bit defensible?**
  It is defensible only if you restrict the scope to liberal democracies undergoing rapid urbanization. It falls apart immediately if you look at totalitarian regimes, which maximize both codification and informal enforcement (snitching, public shaming, party loyalty). They move together upwards. It also fails in traditional religious communities where canon law (codified) and community ostracism (informal) are tightly coupled. Your argument relies on the assumption that enforcement is a fixed budget that must be spent either on neighbors or on lawyers. But societies can simply choose to spend *more* on enforcement overall. The "fixed budget" claim you make later contradicts the "substitution" claim here. If enforcement is a fixed budget, substitution makes sense. If societies can ramp up total control, then they are complements. You need to pick one: is enforcement capacity fixed or variable?

  4. **The rate-of-change hypothesis vs. the threat hypothesis.**
  The rate-of-change hypothesis is wrong, and you basically admit it in the text ("people get more rule-demanding exactly when things are moving quickly"). Fast change creates uncertainty, and uncertainty is a threat. The threat hypothesis swallows the change hypothesis. Your attempt to reframe tightness as "inheritance" and looseness as "exploration" is normative wishful thinking, not empirical prediction. People do not tighten up because they want to preserve inheritance; they tighten up because they are scared. If you keep the exploration argument, you have to explain why panic doesn't look like exploration. It doesn't. It looks like rigidity. Cut the prediction that looseness tracks rate of change. It contradicts the historical record of revolutions and crises.

  5. **Whether anything here has practical bite.**
  Currently, this is mostly a redescription that lets a reader feel clever about a trade-off they already sensed. The "Legibility" point has bite for immigrants and outsiders, but the rest is taxonomy. The only part with practical utility is the "fixed budget of enforcement" idea in the conclusion. If you argue that societies have a limited capacity for enforcement and must allocate it strategically (the "narrow waist"), that is actionable. The rest is just sorting existing phenomena into new buckets. If you don't hammer the "budget constraint" angle, this is just semantics.

  **Verdict on Structure:**
  Yes, this is definitely two essays wearing one coat. The first half is a mechanical critique of Gelfand's tight-loose theory (the variables, the substitution effect). The second half is a normative political philosophy piece (discovery vs. inheritance, narrow waist). They don't glue together. The mechanical analysis suggests societies are trapped by structural constraints (mobility forces codification), but the normative conclusion suggests societies can choose the "right shape" (narrow waist). You can't have it both ways. If the shift to codification is an inevitable structural result of anonymity, you can't just advise societies to adopt a "narrow waist" without explaining how they reverse the anonymity.

  **What to Cut:**
  Cut the "Discovery vs. Inheritance" paragraph entirely. It is the weakest link. It introduces a value judgment that isn't supported by the structural argument preceding it. It softens the piece. You are trying to be a sociologist in the first half and a philosopher in the second. Stick to the sociology. The "Narrow Waist" conclusion is strong enough to stand on the structural arguments alone without needing the "discovery" justification.
