      *(Self-Correction on Pessimist)*: The Pessimist's strongest move is "Self-Knowledge." They will argue that knowing one's own motive is a non-moral psychological fact. If Mark didn't know his motive was performative, Elias gave him a psychological fact. I need to address this in the "Honesty" section.

      *(Final Polish on Scenario)*: Ensure it explicitly states Mark knows the facts. "Mark knows the junior is hurt, knows his own guilt is itchy, knows the office watches."

  6.  **Final Review against Constraints:**
