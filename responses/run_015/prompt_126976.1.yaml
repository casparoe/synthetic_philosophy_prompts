      *   No AI/Trolleys? Yes.
      *   Agent knows non-moral facts? Yes.
      *   Experienced/No time pressure? Yes.
      *   No reliability markers? Yes.
      *   Three readings? Yes.
      *   Machinery honesty? Yes.
