  **The Third Realm and the Excluded Subject: Reassessing Frege's Anti-Psychologism in Light of the Diary**

  The discovery of Gottlob Frege's late personal diary in 1989 by Gottfried Gabriel precipitated a crisis in the reception of one of the founding fathers of analytic philosophy. The entries, written in 1924 shortly before his death, reveal a man deeply embittered by the Weimar Republic, espousing virulent anti-Semitism, nationalist authoritarianism, and admiration for Mussolini. For decades, the standard philosophical defense against such biographical revelations has been the autonomy of the text: the *Begriffsschrift* and *The Foundations of Arithmetic* stand or fall on their logical merits, independent of the moral character of their author. However, to dismiss the diary as merely extrinsic biography is to miss a profound philosophical opportunity. The question is not whether Frege's anti-Semitism invalidates the law of non-contradiction, but whether the exclusionary particularism of his politics reveals a conceptual tension within his doctrine of anti-psychologism and the objectivity of thought.

  This essay argues that while the diary does not constitute a logical refutation of Frege's logicism, it necessitates a critical revision of how we understand the *epistemic community* presupposed by his anti-psychologism. The tension lies not in the ontological status of logical laws, but in the accessibility of the "Third Realm." Frege's philosophy posits thoughts as objective entities shareable by any rational mind, yet his politics suggest that the capacity to inhabit this realm is biologically and culturally bounded. This selective application does not render his logic false, but it undermines the coherence of his anti-psychologism as a universalist philosophical project, revealing it to be compatible with a hierarchical anthropology that compromises the normative force of his objectivity.

  To understand the tension, one must first grasp the internal structure of Frege's anti-psychologism. Frege's primary philosophical adversary was the psychologism of his contemporaries, which conflated the laws of logic with the empirical laws of human thinking. For the psychologistic view, logic describes how humans *do* think; for Frege, it prescribes how one *must* think to grasp the truth. Central to this distinction is his ontology of the "Thought" (*Gedanke*). Thoughts are not private mental ideas (*Vorstellungen*); they are non-spatiotemporal, objective contents that reside in a "Third Realm" distinct from the external physical world and the internal psychological world. Crucially, these thoughts are ownerless. As Frege writes in "The Thought," a thought can be grasped by different people at different times; it is a common property of reason, not the possession of an individual consciousness. This universality is the bedrock of scientific objectivity: truth is independent of who holds it.

  The diary, however, presents a vision of human society that is radically particularist. Frege writes of the "danger" posed by Jewish influence in Germany and advocates for a political system that excludes them from rights and participation. He envisions a community bound not by universal reason, but by blood and national destiny. The conceptual friction arises when we ask: Who is the subject capable of grasping these objective thoughts? If the Third Realm is truly independent of any particular mind, it should, in principle, be accessible to any being possessing rationality. Yet, Frege's political commitments imply that the capacity for rational participation in the cultural and scientific life of the nation is not universally distributed but is contingent upon racial and national identity.

  This leads to the argument of "bounded universalism." One might argue that Frege's universalism applies rigorously to abstract structures (numbers, logical functions) but does not extend to the human subjects who grasp them. On this reading, logical laws are objective, but only a "fit" subset of humanity is capable of apprehending them without distortion. This position attempts to quarantine the politics from the logic. However, this quarantine is porous. Anti-psychologism was motivated by the desire to secure truth against the vagaries of subjective human nature. By restricting the community of rational agents based on empirical, biological criteria (race, nationality), Frege reintroduces a form of anthropologism through the back door. If the *access* to objective truth is mediated by racial fitness, then the "objectivity" of the thought becomes functionally dependent on the specific constitution of the subject. It suggests a hierarchy where the "objective" view is actually the view from a specific, privileged perspective, masquerading as the view from nowhere. This does not make $2+2=4$ false for those excluded, but it implies that the *philosophical justification* for the independence of thought is weakened if the community of thinkers is artificially restricted by non-rational criteria.

  The counter-position, often advanced by defenders of the autonomy of philosophy, is that integrating the diary into the philosophical evaluation commits a category mistake. Logic is normative; politics is empirical. There are no internal conceptual resources in the *Begriffsschrift* from which one can derive anti-Semitic conclusions. A Platonist about mathematics can consistently be an elitist about politics. To judge the logic by the politics is to confuse the validity of an argument with the virtue of the arguer. According to this view, Frege's anti-psychologism successfully severs the link between truth and the human mind; therefore, the prejudices of the human mind are irrelevant to the status of truth.

  While logically sound, this defense is philosophically sterile. It treats Frege's system as a formal calculus rather than a worldview. Frege's anti-psychologism was not merely a technical maneuver; it was a defense of the possibility of science and communication. The coherence of the "Third Realm" relies on the potential for *universal communicability*. If thoughts are to be objective, they must be communicable between subjects without loss or distortion. Frege's political vision, which advocates for the silencing and exclusion of specific groups from the public sphere, disrupts this communicative ideal. If a segment of humanity is deemed incapable of contributing to or correctly grasping the cultural "thoughts" of the nation, the claim that thoughts are "shareable entities independent of any particular mind" becomes suspect. It risks transforming the "Third Realm" from a universal domain of reason into a proprietary domain of a specific Volk.

  Therefore, the diary should alter our reading of Frege's work, not by falsifying his logical claims, but by forcing a reinterpretation of the *scope* of his objectivity. We must conclude that Frege's anti-psychologism contains a latent tension between its ontological universalism and its epistemic elitism. The diary reveals that Frege believed in the objectivity of truth, but he did not believe in the equality of truth-seekers. This does not invalidate the logic, but it does undermine the *philosophical anthropology* that often accompanies such logicism. It demonstrates that one can maintain a robust doctrine of objective truth while simultaneously holding that the capacity to participate in that truth is racially bounded.

  Consequently, the diary compels us to reject the "quarantine" strategy. We cannot fully separate the moral failure from the philosophical structure because the structure relies on a conception of the "rational subject" that Frege's politics implicitly stratifies. The coherence of anti-psychologism depends on the idea that the *act* of thinking is distinct from the *content* of thought. However, if the *capacity* to perform that act is determined by the empirical facts of one's birth (a political/biological claim), the boundary between the empirical subject and the logical subject blurs. The "objective" thought remains objective, but its status as a common possession of humanity is revoked.

  In conclusion, the nationalist and anti-Semitic commitments in Frege's diary should bear significantly on our reading of his philosophical work, specifically regarding the interpretation of his anti-psychologism. We must conclude that while the technical apparatus of his logic remains intact, the normative vision underpinning it is compromised. The diary exposes that Frege's universalism about logical content was indeed implicitly bounded, applying to abstract structures but not extending to the human subjects who grasp them. This selective application does not make his logic incorrect, but it reveals a fracture in the coherence of his philosophical system: a system designed to liberate truth from the subjective mind ultimately rested on a deeply subjective, exclusionary view of who counts as a mind worthy of truth. To read Frege responsibly today is to acknowledge that his logic offers a powerful tool for objectivity, but one that is not immune to being wielded by a philosophy of hierarchy. The diary forces us to decouple the validity of logical laws from the universality of the rational community, reminding us that the defense of objective truth requires not just rigorous formalism, but a commitment to the inclusive rationality of those who seek it.
