  4.  **Analyzing the Positions (Mental Check):**
      *   *Machiavelli:* Why surrender? Because *necessità* dictates survival of the state's treasury. If the project fails due to external forces, the leader looks incompetent. Better to take a small hit (forfeit funds) now than a catastrophic failure later. It looks like cowardice (backing out of a deal) but is actually strategic preservation.
      *   *Stoic:* Why hold? Because the duty is to the public good (transit). The financial market is an "external indifferent." Worrying about hidden market shifts is worrying about things outside control. To abandon a just plan due to fear is to be enslaved by passion (fear) rather than guided by reason.
      *   *The "Feature":* The *blind commitment*. The inability to see the outcome before spending.
      *   *Collapse:* If she could see the outcome, Machiavelli would just say "don't spend." The *virtù* is in the decision under uncertainty.
      *   *Stoic Counter:* Machiavelli isn't being virtuous; he's just being a prudent gambler. He calls risk-management "virtue," but it's just calculation. True virtue is moral consistency.

  5.  **Refining the Scenario (Making it tighter):**
      *   Need to ensure the Machiavellian move looks like *cowardice*. Backing out of a deal looks weak.
      *   Need to ensure the Stoic move looks like *holding the line*.
      *   Need to ensure the Fortune is *structural*. A credit freeze is good.
