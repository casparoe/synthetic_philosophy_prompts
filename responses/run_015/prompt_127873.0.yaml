      *   *Stoic Virtue:* Defined by internal moral integrity, duty, and rationality. External outcomes (wealth, power, survival of the project) are "indifferents." Doing the right thing according to nature/reason is the only good. If a policy is just and rational, you hold the line regardless of the market crash. Surrendering principle for survival is vice.
      *   *The Twist:* The prompt asks for a scenario where Machiavelli says "fold" (looks like cowardice) and Stoic says "hold" (looks like stubbornness). This inverts the common trope where Machiavelli is the aggressive actor and the Stoic is the passive one. Here, the "aggressive" move is holding the line (Stoic), and the "pragmatic" move is retreating (Machiavelli).

  3.  **Drafting the Scenario:**
