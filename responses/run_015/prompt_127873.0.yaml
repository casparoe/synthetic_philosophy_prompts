      *   *Why?* Machiavelli knows the structure is broken, so fighting it is suicide. Stoic knows the duty is to the plan, so quitting is moral failure.

  6.  **Drafting the Analysis Sections:**
      *   *Machiavelli:* Focus on *necessità*. The river of fortune is flooding. You don't stand in front of it; you retreat to high ground. It looks like cowardice (abandoning the project) but saves the agency.
      *   *Stoic:* Focus on *kathekon* (appropriate action) and moral duty. The plan is rational. The market crash is an indifferent. Abandoning duty for safety is vice.
      *   *The Feature:* The "informational asymmetry of time." Commitment precedes visibility.
      *   *Collapse:* If outcomes were visible, it's just math. No virtue needed.
      *   *Stoic Counter:* You call this *virtù*? It's just hedging. You're confusing survival with goodness.

  7.  **Review against Constraints:**
