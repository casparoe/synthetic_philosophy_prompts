answer: |-
  The coffee in the pot had been burning since midnight, turning into a bitter sludge that coated the tongue. Elena stared at the ballot slip on the desk in front of her. *Renewal of Charter Section 1: The Method of Selection.* Yes or No.

  It was 2:17 a.m. The water allocation vote had finished three hours ago. They had decided to cut the bottling plant's draw by forty percent and mandate filtration upgrades for the downstream municipalities. It was a compromise that left everyone angry, which meant it was probably a good decision. Now, the room felt hollowed out. The adrenaline of the fight was gone, replaced by the heavy, static hum of the HVAC and the exhaustion of ninety people who knew they held a knife to the throat of the system that put them there.

  Elena rubbed her eyes. Fifteen years ago, when Oakhaven switched to sortition, she'd laughed about it at the diner. *Lottery government,* she'd told her customers. *Cute. Until we need to fix a bridge or fight a fire.* She'd been sure it would collapse into chaos or, worse, be captured by the loudest voices in the room. She thought randomness was the absence of competence.

  Now she was one of the ninety. Her name had come up in the spring draw. She owned a hardware store on Main Street. She wasn't a policy wonk. She was just tired.

  "You're staring at it like it's going to bite you," a voice said.

  Elena looked up. It was Silas. He was sitting two rows over, leaning back in a chair that was too small for him. Silas wasn't from Oakhaven. He lived forty miles downstream, in a county that didn't pay Oakhaven taxes and couldn't vote in Oakhaven elections. But he farmed the riverbank, and the water vote affected his irrigation rights. Under the Charter's affected-pool rule, his name had been pulled from the regional database along with the city dwellers.

  "It feels heavier than the water vote," Elena admitted.

  "Because the water vote was about pipes," Silas said. He spun a pen between calloused fingers. "This is about who gets to hold the wrench."

  Across the aisle, David stood up. David was a union rep from the city, a man who liked structure. He'd been arguing for the 'No' vote since dinner. He walked to the center of the room, his shoes squeaking on the linoleum.

  "We need to talk about accountability," David said. His voice was raspy. "Look, I know we did good work on the water. I know I didn't take a dime from the bottling plant because I don't know anyone there. That's the selling point, right? The Jury Model. We don't owe anybody."

  "We owe the river," Silas muttered.

  David ignored him. "But here's the thing. A jury gets dismissed. A jury decides a case and goes home. We're being asked to renew the court itself. If we vote Yes, we're saying that ninety random people should hold this power indefinitely. Not us, specifically. But the mechanism. If we aren't beholden to voters, who checks us? What if we get it wrong next time? What if we decide to sell the water treatment plant to a private contractor because we didn't understand the long-term maintenance costs?"

  "Then the next lot fixes it," Elena said. She surprised herself. She'd been leaning toward 'No' an hour ago.

  "The next lot inherits the mess," David countered. "And they don't have to answer to the people who suffered from it. Elections are messy. They're ugly. People lie. But if you mess up, you get voted out. You owe the people something. This system? It says we owe nothing but our own conscience. That's not democracy. That's benevolence. And benevolence doesn't last."

  Elena looked at Silas. He was watching David with a calm that unsettled her.

  "If we go back to elections," Silas said, his voice low but carrying, "the city votes. Just the city. Oakhaven votes. My county doesn't. The bottling plant donates to the mayor's campaign. The downstream folks? We get what's left. That's how it was before. You know it."

  "That's representation," David said. "You elect someone who promises to fight for the downstream guys."

  "They promise," Silas said. "Then they get to city hall and they need the city's votes to stay there. They forget us. This lottery... it pulled me in. Not because I'm a constituent. Because I'm affected. That's the Mirror. You look in the glass and you see the whole watershed, not just the city limits. If you vote No, you put the glass back on the wall."

  Elena felt the tension pull at her ribs. This was the wall her reading group had hit. The Jury argument (independence from pressure) vs. the Mirror argument (descriptive inclusion of interests). David wanted accountability, which required debt to voters. Silas wanted inclusion, which required independence from voters. They were pulling in opposite directions.

  "If we vote Yes," Elena said, speaking to the room now, "we keep the independence. We keep the ability to tell the bottling plant to go to hell without worrying about campaign funds. But David's right. We become a class apart. We decide whether we stay in power."

  "We decide whether the *system* stays in power," David corrected. "Not us. We go home either way."

  "But we're the only ones who can say Yes," Elena said. "That's the weird part. Only the lot can end the lot. If we vote Yes, does it look like we're protecting our own privilege? Even if we aren't?"

  Silas stood up. He walked to the front, standing next to David. They looked like opposites. The city organizer and the outsider farmer.

  "I didn't want this," Silas said. "Fifteen years ago, I thought it was crazy. Random people running things? But then I looked at who was running things before. They looked like they owned the place. Now? I sit in a room with a teacher, a nurse, a guy who fixes roofs. They look like me. Not in the face. In the stakes. We all bleed the same water."

  He turned to Elena. "But I know what you're thinking. You're thinking if we vote Yes, we're saying we did such a good job we should do it again. But we didn't do it. The draw did. We just showed up."

  "And if we vote No," David said, "we admit that this power is too big for amateurs. That some things need professionals who can be fired."

  Elena looked down at the ballot. The room was silent. The exhaustion was a physical weight. She thought about her hardware store. She thought about the customers who came in complaining about city council meetings they never attended. She thought about Silas, who wouldn't have had a voice in a council meeting.

  She realized then that the Mirror and the Jury weren't just different justifications. They were incompatible fuels. You couldn't have a body that represented every interest perfectly and also owed nobody anything. If you represent an interest, you owe them. If you owe nobody, you represent only your own conscience.

  The system had worked for fifteen years because it pretended those two things were the same. It pretended that being a mirror made you a jury. But tonight, staring at the renewal, the illusion broke.

  "If we vote Yes," Elena said, her voice quiet, "we say the system is more important than the risk. We say that having Silas in the room is worth the risk of having no one to fire us."

  "If we vote No," David said, "we say accountability is more important than inclusion. We say better to be voted out than to be unanswerable."

  Elena picked up her pen. She looked at Silas. He nodded, once. He wasn't asking her to save him. He was asking her to tell the truth.

  She thought about the water vote. They had hurt the bottling plant. They had hurt the city budget. They had helped the downstream farms. If she were running for re-election, she would have lost. She would have had to compromise. She would have owed the city voters who wanted cheap water bills.

  Because she didn't owe them, she could do the right thing. But because she didn't owe them, she could also do something terrible tomorrow and walk away.

  "The Jury protects us from the donors," Elena said. "The Mirror protects us from ourselves. But we can't be both."

  She marked the ballot.

  She walked to the box and dropped it in. The sound was loud in the silence. One by one, the others followed. Silas dropped his in. David dropped his in. They didn't speak. They went back to their seats and waited for the count.

  The clerks, who were also chosen by lot but served longer terms, tallyed the votes. They whispered among themselves. The room held its breath. It was 3:00 a.m. The darkest part of the night.

  The head clerk stood up. "On the question of Charter Renewal. Yes: 44. No: 46."

  A murmur went through the room. It wasn't a roar. It was a release of tension.

  David let out a long breath and sat down heavily. Silas just nodded, looking at the floor.

  Elena felt a strange lightness. They had voted themselves out of existence. They had used the independence of the Jury to destroy the Mirror.

  "We killed it," someone whispered.

  "No," Elena said, standing up. She felt tired, but clear. "We proved it worked."

  David looked at her. "How?"

  "Because a rigged system doesn't let you pull the plug," she said. "If this was about power, we would have voted Yes. We voted No because we realized the power wasn't ours to keep."

  Silas stood up. He walked over to Elena. "So what happens now?"

  "Elections," David said. "Back to the old way."

  "Maybe," Elena said. "But you heard the count. It was close. Forty-four people think the Mirror matters more than the Accountability. That doesn't go away just because we voted."

  She looked at the ballot box. They had ended the sortition. But in doing so, they had validated the only claim that mattered: that the people, even random ones, could be trusted with the knife. Even if they used it to cut the cord.

  "Go home, Silas," Elena said. "Watch the water."

  "You too," he said.

  They walked out into the cool night air. The river was dark, moving silently toward the Mississippi, indifferent to how it was governed. Elena unlocked her car. She knew she'd have to explain this to her customers tomorrow. She knew some would call them fools. Some would call them heroes.

  She started the engine. She realized she didn't care what they called her. That was the danger of the Jury. But it was also the gift. She had owed nobody anything. Not even the future.

  ***

  **Note on Theoretical Liberties**

  I took significant liberties with the standard sortition literature, particularly regarding the "affected-pool" wrinkle you invented. Most sortition theorists (like Fishkin or Bouricius) advocate for a random sample of the *citizenry* to ensure descriptive representation of the population, not a stakeholder model based on material affectation. Your affected-pool rule leans more toward stakeholder theory or deliberative polling variants than pure sortition, creating a hybrid animal that prioritizes interest representation over statistical mirroring of the demographic whole. Regarding the self-renewal clause, this is largely a dramatic device; while some theorists discuss "constitutional conventions" chosen by lot, the idea of a temporary assembly voting on its own systemic continuity is rare in practice and theory, as it introduces a conflict of interest that most designers try to avoid via supermajority requirements or external ratification. I am moderately confident in this read of the literature, as the tension between descriptive representation (Mirror) and independence from capture (Jury) is a well-documented debate, but the claim I am least sure of is whether a body voting to abolish itself truly validates the system's integrity or merely proves its instability; theorists might argue that a system requiring its own consent to survive is inherently fragile rather than robust.
