      *   *Option B:* Everyday perception (change blindness/saccades).
      *   *User's Worry:* Lab trace might look like "instrument limitation."
      *   *My Advice:* The user is right to worry. A scope trace is abstract. The audience needs to feel it in *their* bodies.
      *   *Better Option:* **The Saccade/Blind Spot combo.** Everyone has blind spots. Everyone moves their eyes. The fact that the world doesn't go black when we blink or move eyes is the "filling in."
      *   *Wait, even better:* **The "Spinners" or "Clock" trick.** Or simply the **Change Blindness** demo (flipping an image).
      *   *Best Fit for Neurophysiologist:* **The "Stable World" vs. "Moving Eyes" paradox.**
      *   *Why:* It directly uses the speaker's expertise (sensory processing) but relies on the audience's immediate experience.
      *   *The Example:* **Saccadic Masking.** Look at your eyes in a mirror. You cannot see them move. But you know they move to look around. The video feed is paused during the movement so you don't get motion sick.
      *   *Requirement:* It must be something they can *do* right now (flip chart drawing of an eye, or just instructing them). It must avoid "equipment error" by being about *their* biology.
      *   *Decision:* **Saccadic Suppression/Masking.** It proves the "movie" is edited (Claim 1 & 2) without needing tech.

