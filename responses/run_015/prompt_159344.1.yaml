      *   *Refinement:* The interface analogy (desktop icons). An icon isn't the file, but clicking it works. This is standard "User Illusion" (Tor Nørretranders/Dennett), but needs to be grounded in the neurophysiology credibility the speaker has.
      *   *Decision:* The prerequisite is establishing that *efficiency requires simplification*. If the brain showed us every neuron firing, we'd crash. So, simplification is a feature, not a bug.

