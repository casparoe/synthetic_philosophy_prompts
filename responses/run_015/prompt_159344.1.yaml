      *   *Misconception 2: "So nothing is real/experienced?"* (Nihilism).
          *   *Counter:* Address after Claim 1. The pain is real, the *story* about the pain is the illusion.
      *   *Misconception 3: "Who is the user?"* (Homunculus).
          *   *Counter:* Address at Claim 3. The user is the organism, not the ego.
      *   *Misconception 4: "My arthritis pain is real."* (The emotional blocker).
