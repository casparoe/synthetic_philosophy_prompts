      *   *Claim 3 (Ownership):* The "I" feeling like it's watching the screen is actually *on* the screen.
      *   *Dependency:* The user is right. If you start with (3), you lose them (nihilism/denial). If you start with (1), you gain trust (cool tricks). (2) follows from (1) (if the input is sparse, the continuity must be manufactured). (3) follows from (2) (if the stream is manufactured, the watcher might be too).
      *   *Time Management:* 40 mins is tight. (3) is risky. It might need to be hinted at rather than fully argued, or framed as the "radical implication" rather than the main point. Let's keep it but make it the "horizon" of the talk, not the foundation.

  3.  **Prerequisites (The "First Move"):**
