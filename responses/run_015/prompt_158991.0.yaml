prompt: |-
  I'm on a tiny committee at my hospital that's supposed to update how we handle psychiatric advance directives — the "if I go manic and start refusing meds, admit me and treat me anyway" kind of document. And the more we talk the more I think the existing practice is quietly committed to something philosophically loaded that nobody on the committee can actually state.

  Here's the shape of it as I understand it (in some places these things are legally binding, in others they're just advisory — I don't think that matters for my question, but tell me if it does). A patient with bipolar disorder signs a directive while she's well saying that if she becomes manic and refuses treatment, she wants to be hospitalized and medicated anyway. Months later she's manic, she's refusing, and the team overrides her current refusal in the name of the earlier document. So the earlier self beats the present self. But then take a different case: someone with dementia who years ago signed a refusal of aggressive life-prolonging treatment, and who now, in a fairly lucid moment, says she'd like to keep going and seems to be genuinely enjoying her lunch. A lot of people say the present self wins there, or at least that it's genuinely up for grabs. And in general, a competent patient's refusal right now trumps anything anyone said earlier. So: earlier self wins here, later self wins there, and I can't tell whether there's a principled line (something about who has capacity at the time) or just two habits that grew up separately in different corners of medicine. Also, as far as I can tell, half the time these documents just get ignored by whoever is on call, which makes me wonder whether there's any theory here at all.

  What I want first is the reconstruction: what view of a person's will, or of preference, or of what it even means to respect someone, does this pattern presuppose? Is there a substantive theory in it — something like "the will that counts is the one formed under good conditions: informed, not in crisis, not distorted" — or is the practice compatible with a much thinner procedural story where capacity is just a gate and nobody is making any claim about what the person really wants? I'd like the strict presuppositions separated from the stuff the practice merely fits well with, and I'd like to know where it's underdetermined, i.e. where three different theories would all license exactly the same behavior.

  Then the part I'm actually stuck on. The idea I keep circling is the alignment-flavored notion of an idealized or extrapolated will: roughly, what you'd want if you knew more, thought faster, and were more the person you wish you were — what people call coherent extrapolated volition. If a hospital took that seriously, what would it do with these two cases? Specifically:

  - Which self is the base point for the extrapolation? The woman at 30 signing the document, or the woman at 35 who is currently manic and refusing? If the answer is "it depends on the case," that seems to make the notion useless at exactly the moment we need it.
  - Does the manic episode itself count as input to the extrapolation? She has now had experiences, formed projects, changed her view of her own life. Does the extrapolated will get updated with all that, or do we treat the episode as noise to be filtered out before we start?
  - Is there even a fact of the matter about where the extrapolation lands, or does it depend on the order in which you imagine her learning things and revising herself? I have a suspicion there isn't, and that the directive is doing more work than any theory of idealized preference can actually justify. If that suspicion is right, say so plainly.
  - And concretely: what would a policy written by someone who believed in extrapolated volition look like? Binding instructions or rebuttable presumptions? A "values history" the team actually reads instead of a checkbox form? A duty to try to talk the manic patient round before overriding her? What would have to change in practice, and what would get worse?

  I definately don't need citations or a reading list — I can't look anything up from the committee room and I don't want to be sent off to read somebody. Just argue it out. If the honest answer is that the practice is underdetermined and we should stop pretending there's a deep theory behind the asymmetry, I'd rather hear that than a tidy story.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A member of a small hospital committee updating psychiatric advance directives (PADs).
      *   **Context:** They are grappling with the philosophical tension between honoring past directives (in bipolar mania) vs. honoring present wishes (in dementia/end-of-life). They suspect the current practice is inconsistent or lacks a coherent theoretical foundation.
      *   **Task:**
          1.  Reconstruct the presuppositions of current practice (what view of will/preference/respect does it imply?). Separate strict presuppositions from compatible theories. Identify underdetermined areas.
          2.  Analyze the concept of "Coherent Extrapolated Volition" (CEV) or "idealized will" in this context. Answer specific questions about base points, noise filtering, indeterminacy, and concrete policy implications.
      *   **Constraints:** No citations, no reading lists. Just argue it out. Be honest if the practice is underdetermined.
      *   **Tone:** Philosophical, rigorous, practical, honest, direct.

  2.  **Part 1: Reconstructing Current Practice (The "Asymmetry")**
      *   *Observation:* In bipolar mania, Past Self (well) > Present Self (manic). In dementia, Present Self (lucid/content) > Past Self (demented/earlier directive). In general competent care, Present Self > Past Self.
      *   *Question:* What is the principled line?
      *   *Hypothesis 1: Capacity.* In bipolar mania, the present self is deemed *incapacitated* due to distortion of reality/judgment. In dementia, the "lucid moment" suggests *capacity* (or at least enough to express current welfare). But wait, if the dementia patient lacks capacity, the prior directive usually *does* win. So the asymmetry might be about *how* capacity is assessed or the nature of the condition.
      *   *Hypothesis 2: Authenticity/Identity.* Mania is seen as an *intrusion* (a disease state alien to the self). Dementia is seen as a *dissolution* (the self fading, but current experience still matters).
      *   *Hypothesis 3: Harm/Benefit.* Mania leads to ruin (financial, physical, relational). Dementia treatment refusal leads to death. We treat "ruin" differently than "death."
      *   *Strict Presuppositions:*
          1.  Capacity is not binary; it's domain-specific and fluctuating.
          2.  Some mental states are "distortions" (mania) vs. "expressions" (dementia contentment).
          3.  The "Well Self" has epistemic privilege over the "Sick Self" regarding the Sick Self's best interests *in psychiatric contexts*.
      *   *Underdetermination:*
          1.  *Why* does the Well Self have privilege in psychiatry but not always in general medicine? (e.g., Jehovah's Witness refusing blood vs. depressed patient refusing dialysis).
          2.  Is it about *reversibility*? Mania is treatable; dementia is not. If we treat the mania, we get the Well Self back. If we treat the dementia patient aggressively, we just prolong the dementia.
          3.  *The "Ignored Directive" Problem:* If half are ignored, the practice isn't driven by theory but by convenience/risk management.

  3.  **Part 2: Extrapolated Volition (CEV) Analysis**
      *   *Concept:* What would you want if you knew more, thought faster, were more "you"?
      *   *Question 1: Base Point.*
          *   If we start with Manic Self: Extrapolation filters out the mania (chemical distortion). Result: Likely aligns with Past Well Self.
          *   If we start with Well Self: Extrapolation incorporates new data. Did the mania reveal something? Usually, mania is seen as noise.
          *   *Verdict:* CEV naturally favors the Well Self in mania because mania is computationally "noisy." In dementia, if the current self is content, CEV might value current experiential welfare over abstract prior values.
      *   *Question 2: Is the Episode Input or Noise?*
          *   In bipolar, the episode is pathology (noise).
          *   In dementia, the current state is the new reality (input).
          *   *Crucial distinction:* Recovery vs. Progression. In bipolar, we expect a return to baseline. In dementia, the baseline has shifted permanently. CEV depends on whether the "idealized you" expects to return to the old baseline.
      *   *Question 3: Is there a Fact of the Matter?*
          *   *Honest Answer:* No. Extrapolation requires a model of the person. Who builds the model? The doctor? The family? The law?
          *   *Path Dependence:* If you imagine learning "mania is bad" first, you reject meds. If you imagine learning "mania destroys relationships" first, you accept meds.
          *   *Suspicion Confirmed:* The directive is doing the work, not the theory. The theory is post-hoc justification.
      *   *Question 4: Concrete Policy.*
          *   If CEV were taken seriously:
              *   Shift from *instructions* ("Give me Haldol") to *values* ("I value stability over euphoria").
              *   Duty to negotiate (try to align present self with extrapolated self).
              *   Recognition of "Ulysses Contracts" but with sunset clauses.
              *   *What gets worse:* Slower decisions. More conflict. Less legal certainty.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the observation. The asymmetry is real.
      *   *Section 1: The Reconstruction.*
          *   Identify the "Authenticity" vs. "Capacity" distinction.
          *   Point out the "Reversibility" factor (crucial for the bipolar vs. dementia distinction).
          *   Highlight the "Risk/ Liability" underdetermination (doctors override because they fear lawsuits, not philosophy).
      *   *Section 2: The Extrapolated Will (CEV).*
          *   Address the Base Point: It's not about *when*, it's about *fidelity to the function*. Mania degrades cognitive function; dementia degrades memory/continuity but might leave affect intact.
          *   Address Noise vs. Input: Mania is noise. Dementia contentment is input (because there's no "after" to return to).
          *   Address Indeterminacy: Be blunt. There is no fact of the matter. It's a projection by the observer.
          *   Address Policy: Values over instructions. "Negotiated consent."
      *   *Conclusion:* Summarize the tension. The practice is a patchwork of risk management and intuition, not a unified theory.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't conflate dementia refusal with dementia acceptance. The prompt says: Dementia patient signed refusal *earlier*, now wants treatment. This is the "Then vs. Now" conflict.
      *   *Nuance:* In bipolar, Past (Well) says "Treat me," Present (Manic) says "Don't." We treat.
      *   *Nuance:* In dementia, Past (Well) says "Don't treat me," Present (Demented) says "Treat me" (or implies it by enjoying life). We often *don't* treat (honor past). Wait, the prompt says "A lot of people say the present self wins there." Okay, I need to stick to the prompt's observation: In dementia, sometimes Present wins (want to live), in Bipolar, Past wins (want treatment).
      *   *Wait, re-reading the prompt:* "someone with dementia who years ago signed a refusal... and who now... says she'd like to keep going... A lot of people say the present self wins there."
      *   *Okay, so:*
          *   Bipolar: Past (Treat) > Present (Refuse).
          *   Dementia: Present (Treat/Live) > Past (Refuse).
      *   *Why?* In Bipolar, the Present is "broken." In Dementia, the Present is "happy."
      *   *Key Philosophical Distinction:* *Alienation* vs. *Adaptation*. Mania is alien to the self. Dementia contentment is an adaptation of the self.
      *   *CEV Implication:* CEV filters out alienation (mania). CEV respects adaptation (dementia) if the adaptation is stable.

  6.  **Final Polish:** Ensure the tone is respectful of the committee's work but rigorous about the lack of theoretical grounding. Make sure the "Underdetermination" section is clear. (The "ignored directives" point is key evidence of underdetermination).

  7.  **Final Review against constraints:** No citations? Check. No reading list? Check. Argue it out? Check. Address all 4 CEV sub-questions? Check.

  *(Self-Correction on the Dementia Case)*: I need to be careful. The prompt says "A lot of people say the present self wins there." In reality, legal standards often favor the prior directive in dementia (e.g., Nancy Cruzan). But the *phenomenological* intuition the user describes is that ignoring a happy dementia patient's wish to live feels wrong, whereas ignoring a manic patient's wish to refuse feels right. I should address this *moral intuition* rather than strict legal statute, as the user is asking about the *philosophical load* of the practice, not just the black-letter law.

  *(Refining the CEV "Fact of the Matter" point)*: This is the strongest philosophical point. Extrapolation requires a *metric* of improvement. Who sets the metric? If the metric is "health," mania is bad. If the metric is "subjective satisfaction," mania might be good (in the moment). The theory collapses without an agreed-upon telos. I must emphasize this.

  *(Policy)*: If CEV is the guide, we can't just use checkboxes. We need narrative. We need "Ulysses contracts" that allow for renegotiation if the "future self" can demonstrate stability.

