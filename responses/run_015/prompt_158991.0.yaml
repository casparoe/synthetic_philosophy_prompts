answer: |-
  This is one of the cleanest descriptions of the "precedence asymmetry" problem I've seen. You are right to sense that the practice is not driven by a single coherent theory. It is driven by a patchwork of risk management, intuition about identity, and distinct clinical goals (restoration vs. palliation).

  Here is the reconstruction of what your current practice presupposes, followed by the analysis of what an "extrapolated will" framework would actually demand.

  ### Part 1: Reconstructing the Current Practice

  You asked for the strict presuppositions separated from the compatible theories, and the points of underdetermination.

  **The Strict Presuppositions**
  For the current asymmetry to function (Past Self wins in Bipolar; Present Self often wins in Dementia), the practice must presuppose three things:

  1.  **The Distortion vs. Dissolution Distinction:** It presupposes that mania is a *distortion* of the agent's will, whereas dementia (specifically the contentment/enjoyment phase) is a *dissolution* of the agent's history but not necessarily a distortion of current experience. In mania, the refusal is treated as a symptom (like a fever delirium). In dementia, the desire to live is treated as a preference (like a taste for ice cream).
  2.  **Reversibility as a Moral Trump:** It presupposes that if a state is reversible, the "pre-state" has authority. If a state is irreversible, the "in-state" has authority. We override the manic patient because we expect the "Well Self" to return and thank us. We often honor the happy dementia patient because the "Well Self" is not coming back, and punishing the current consciousness for the past self's fear of burden seems cruel.
  3.  **Epistemic Privilege of the "Baseline":** It presupposes that the "Well Self" has better data about the "Sick Self's" interests than the "Sick Self" does, *but only if the Sick Self is chemically altered.* If the Sick Self is chemically stable but cognitively diminished (dementia), the Well Self's data is treated as outdated.

  **Compatible Theories (The "Fit")**
  These theories fit the practice but are not required by it:
  *   **Authenticity Theory:** The Well Self is the "real" person; the Manic Self is an imposter. (Fits Bipolar).
  *   **Experiential Welfare:** What matters is current suffering/joy. (Fits Dementia).
  *   **Paternalism:** Doctors know best. (Fits both, when directives are ignored).

  **The Underdetermination (Where the Theory Breaks)**
  This is the critical part for your committee. There are three distinct theoretical frameworks that all license the *exact same behavior* you see now, which means the behavior doesn't prove any of them.

  1.  **The Capacity Gate:** One could argue capacity is binary. In mania, you lack it; in the lucid dementia moment, you have it. *Problem:* Capacity assessments are notoriously subjective. A manic patient can often articulate reasons for refusal better than a demented patient can articulate reasons for lunch. The "capacity" label is often applied *after* the decision to override is made, not before.
  2.  **The Harm Principle:** One could argue we only override to prevent irreversible harm. Mania leads to bankruptcy/divorce/physical injury. Dementia treatment refusal leads to death. We treat "ruin" as preventable and "death" as a natural conclusion. *Problem:* This is a value judgment about quality of life, not a theory of will.
  3.  **The Liability Shield:** This is the cynical but likely dominant theory. Directives are honored when they align with standard of care (medicating mania). They are ignored when they complicate it. In dementia, honoring a refusal of antibiotics is legally risky if the patient looks happy. In mania, *not* medicating is legally risky if the patient jumps out a window. The "theory" is tort avoidance.

  **The "Ignored Directive" Problem:**
  You noted half the directives get ignored. This is the smoking gun. If there were a substantive theory of "The Will That Counts," ignoring the document would be a moral crisis. In practice, it's a triage decision. This suggests the practice is not committed to *any* theory of the will, but rather to a **procedural convenience**: The directive is a tool for the team to use when it reduces friction, and a suggestion to set aside when it increases friction.

  ### Part 2: The Extrapolated Volition (CEV) Analysis

  Now, let's apply the "idealized will" concept. If you take Coherent Extrapolated Volition seriously, you are asking: *What would this agent choose if they were thinking clearly, had all the facts, and were being the version of themselves they endorse?*

  Here is how that breaks down in your specific cases.

  **1. Which self is the base point?**
  If you believe in CEV, the base point is **neither** the timestamp of the document nor the timestamp of the crisis. The base point is the **functional integrity of the decision-making apparatus.**

  *   **In Bipolar Mania:** The Manic Self is computationally degraded. Dopaminergic overload creates false pattern recognition. If you extrapolate from the Manic Self, you have to filter out the neurochemistry first. Once you filter out the mania, you are left with... the Well Self. So, in this case, CEV collapses into honoring the Past Well Self.
  *   **In Dementia:** The Demented Self is computationally degraded in memory and projection, but often *intact* in affect and immediate valuation. If you extrapolate from the Demented Self, you cannot filter out the dementia without deleting the person entirely (because the "Well Self" is gone). So, CEV collapses into honoring the Present Self's current welfare.

  **The "It Depends" Problem:** You worried that "it depends" makes the notion useless. In CEV, it doesn't. The rule is: **Extrapolate from the self that has a future.**
  *   The Bipolar patient has a future self (the post-manic well self). We act for *that* self.
  *   The Dementia patient does not have a future self (only a continuing present). We act for *this* self.
  This provides a principled line, but it relies entirely on prognosis (reversibility), not on the text of the directive.

  **2. Is the episode input or noise?**
  *   **Bipolar:** The episode is **noise**. In a CEV framework, mania is a bug, not a feature. It does not provide new data about the patient's values; it provides data about their pathology. The extrapolation ignores the manic refusal because it assumes the refusal is a product of the error state.
  *   **Dementia:** The episode (the enjoyment of lunch) is **input**. Because there is no "return to baseline," the current enjoyment is the only data point the universe has about this person's welfare. To ignore it is to value a ghost (the past self) over a living organism.

  **3. Is there a fact of the matter?**
  **No.** This is your suspicion confirmed.
  Extrapolation requires a *direction* of improvement. "Better" implies a metric.
  *   If the metric is **Autonomy/Stability**, the extrapolated will favors the directive (medicate the mania).
  *   If the metric is **Subjective Satisfaction**, the extrapolated will might favor the mania (if the patient is truly euphoric and safe) or the dementia (if they are happy).
  *   If the metric is **Social Utility**, the extrapolated will favors whatever keeps the patient out of jail and off the street.

  Who sets the metric? The committee? The doctor? The family?
  There is no "fact of the matter" about where the extrapolation lands because there is no objective fact about what constitutes the "ideal" version of a person. Is the ideal version the one who is productive and stable (Well Self)? Or the one who is never distressed (Manic/Demented Self)?
  The directive is doing the work because it **pre-selects the metric.** By signing the paper, the Well Self says: "Use Stability as the metric, not Current Satisfaction." The CEV framework cannot generate this metric on its own; it must be imported from the prior commitment.

  **4. What would a CEV-based policy look like?**
  If you actually wrote policy based on Extrapolated Volition rather than "Legal Directive Compliance," it would look radically different. It would move from *Instructions* to *Alignment*.

  *   **Binding Instructions become Rebuttable Presumptions:** The document is not a command ("Give me Haldol"). It is evidence of the extrapolated will ("I believe my manic self cannot make good decisions"). The team must verify if the current state matches the predicted state.
  *   **The "Negotiation Duty":** Before overriding a manic refusal, the team has a duty to attempt to align the Present Self with the Extrapolated Self. This isn't just "taking meds." It's showing the patient the video of their last episode. It's saying, "Your Past Self predicted you would say this, and asked us to help you." It treats the patient as a partner in the extrapolation, not a broken machine.
  *   **Values History over Checkboxes:** A checkbox says "Yes, medicate me." A Values History says "I value my relationships more than my temporary euphoria. I am afraid of hurting my partner." This gives the team the *metric* for extrapolation. If the manic patient says "I don't care about my partner," the team can see the value drift and intervene.
  *   **Sunset Clauses:** A CEV policy acknowledges that the Well Self might be wrong. Directives should expire or require renewal. If you haven't updated your "Mania Plan" in 10 years, your Extrapolated Volition is stale.
  *   **What Gets Worse:** Decisions become slower. You cannot just inject because a form says so. You have to establish that the current refusal is indeed "noise" and not a legitimate update to the person's values. This increases liability and staff burden.
  *   **What Gets Better:** It reduces moral injury. Staff aren't just "violating rights"; they are "aligning with the patient's deeper project." Patients, when well, feel more heard because the document is about their *values*, not just their *consent*.

  ### The Bottom Line for the Committee

  You asked for the honest answer. Here it is:

  The current practice is **underdetermined**. It pretends to be about "respecting autonomy" but is actually about **risk-managing identity.** We honor the Past Self when the Present Self is dangerous and reversible. We honor the Present Self when the Past Self is gone and the Present Self is harmless.

  There is no deep philosophical theory that unifies these two moves without appealing to external values (safety, reversibility, social order).

  If you want to update the policy, do not try to find the "true theory" of the will. You won't find it. Instead, **make the metric explicit.**
  Stop pretending the directive is a magic wand that solves the hard problem of personal identity. Write the policy to acknowledge the tension: *"This document represents the patient's judgment that their future impaired self will not share their current values. We will honor this judgment primarily when the impairment is reversible and the risk of harm is high."*

  That is the actual theory you are operating on. Stating it plainly will save you more trouble than trying to build a philosophical fortress around it.
