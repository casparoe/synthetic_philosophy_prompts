  6.  **Jury Phase:** The 3 Rules cards.
  7.  **Debrief Script:** Handling the specific philosophical pivots and failure modes.

  **Refining the Debrief:**
  *   Must address the "AI has no beliefs" objection.
  *   Must address the "Sole Source" variant.
  *   Must address the "Foresees but does not aim" (Side effect deception).
  *   Must acknowledge what the game *can't* show (training deception, long horizon).

  **Failure Mode Mitigation:**
  *   If Assistants go silent: Rule says "Must provide a response."
  *   If Users go detective: Allow it, but time limit.
