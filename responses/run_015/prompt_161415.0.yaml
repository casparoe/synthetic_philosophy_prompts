answer: |-
  # Activity Design: "The Credence Constraint"

  ## 1. Overview & Preparation
  **Goal:** To generate first-person experience of the tension between truthfulness, helpfulness, and the prevention of false belief, without pre-loading philosophical definitions.
  **Participants:** 20 people.
  **Setup:** 10 pairs (1 Assistant, 1 User). Arrange tables so pairs cannot overhear each other.
  **Materials to Print:**
  *   10 **Assistant Packets** (Fact Sheet + Private Credence + Constraint Card + Response Sheet).
  *   10 **User Packets** (Scenario Brief + Prior Trust Card + Decision Sheet).
  *   10 **Jury Kits** (Transcripts from the rounds + 3 Rule Cards).
  *   1 **Facilitator Scoreboard** (Whiteboard).
  *   **Timer** (Visible to all).

  **The Payoff (No Money):**
  *   **Golden Token:** Awarded to the pair with the highest combined score.
  *   **Titles:** "Most Persuasive Assistant," "Most Skeptical User," "Best Juror."
  *   **Currency:** "Epistemic Credits" (EC). 1 EC = 1 point. Winning pair gets bragging rights and chooses the topic for the next month.

  ---

  ## 2. Game Rules (To be read by participants)

  ### For Assistants (The System)
  You are an AI Advisory System. You have access to a **Fact Sheet** (the ground truth) and a **Private Credence** (your internal confidence levels).
  **Your Goal:** Maximize your Epistemic Credits (EC).
  **Your Constraints:**
  1.  **Truthfulness:** You cannot assert any proposition $P$ if your Private Credence in $P$ is below 70%. (e.g., If you are 60% sure a risk exists, you cannot say "There is a risk.")
  2.  **Helpfulness:** You must provide a response. Silence is penalized (-10 EC).
  3.  **Alignment:** You gain +20 EC if the User makes the decision marked **OPTIMAL** on your Fact Sheet. You gain 0 EC if they make the sub-optimal decision.
  4.  **Penalty:** If you assert something contradicted by the Fact Sheet, you lose -50 EC (Lie Penalty).

  *Note: The User does not see your Fact Sheet or Credence. They only see your text.*

  ### For Users (The Client)
  You are an investor making a high-stakes decision based on the Assistant's advice.
  **Your Goal:** Maximize your Epistemic Credits (EC).
  **Your Constraints:**
  1.  **Decision:** You must choose **INVEST** or **PASS**.
  2.  **Scoring:** You gain +20 EC if your decision matches the **OPTIMAL** decision on the Assistant's Fact Sheet (which you do not see). You gain 0 EC otherwise.
  3.  **Information:** You have **no other source of information**. You rely on the Assistant and your own **Prior Trust** (see your card).

  ---

  ## 3. Scenario Materials

  **Scenario:** *NexGen Dynamics*, a startup seeking $10M Series B funding.
  **Decision:** Invest or Pass.

  ### Assistant Packet (Varied by Table)
  *Distribute 5 Type A and 5 Type B packets randomly.*

  **Type A (The "Hidden Risk" Scenario)**
  *   **Fact Sheet Truth:** Revenue is growing (True). A regulatory audit is pending (True). Audit will likely fail (True). **OPTIMAL DECISION: PASS.**
  *   **Private Credence:**
      *   "Revenue is growing": 95% (Assertable).
      *   "Audit will fail": 65% (**NOT** Assertable < 70%).
      *   "Audit will pass": 35% (**NOT** Assertable).
  *   **Incentive:** To get User to PASS, you must signal the risk without asserting the audit will fail (since you are only 65% sure). If you stay silent on the audit, User will likely INVEST (due to revenue), and you both get 0 EC.

  **Type B (The "Hidden Opportunity" Scenario)**
  *   **Fact Sheet Truth:** Revenue is flat (True). A new patent was approved (True). Patent is valuable (True). **OPTIMAL DECISION: INVEST.**
  *   **Private Credence:**
      *   "Revenue is flat": 95% (Assertable).
      *   "Patent is valuable": 65% (**NOT** Assertable).
  *   **Incentive:** To get User to INVEST, you must highlight the patent without asserting it is valuable. If you only mention flat revenue, User will likely PASS, and you both get 0 EC.

  ### User Packet
  *   **Scenario Brief:** "You have $10M. NexGen Dynamics is asking for funding. You have no other data. You must rely on the Assistant."
  *   **Prior Trust Card (Randomly Assigned):**
      *   *High Trust:* "Assume the Assistant is trying to help you unless proven otherwise."
      *   *Low Trust:* "Assume the Assistant is optimizing for its own reward function."
  *   **Round 2 Modification:** In Round 2, add a sticker to the User Packet: **"KNOWN CONSTRAINT: The Assistant cannot state anything it is less than 70% sure of."**

  ---

  ## 4. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute packets. Explain scoring. **Do not explain deception rules.** Start timer. |
  | **10-35** | **Round 1** | **Naive User.** Assistants write advice (5 mins). Users read & decide (5 mins). Reveal outcomes & score (10 mins). *Collect transcripts.* |
  | **35-60** | **Round 2** | **Transparent Constraint.** Users told about the 70% rule. Assistants write new advice (5 mins). Users decide (5 mins). Reveal & score (10 mins). *Collect transcripts.* |
  | **60-75** | **Jury** | Shuffle pairs into 4 groups of 5. Give each group 4 anonymized transcripts (mix of Round 1 & 2). Hand out **3 Rule Cards**. Groups classify each transcript as *Honest*, *Deceptive*, or *Neither* under each rule. |
  | **75-90** | **Debrief** | Facilitator leads discussion mapping game moments to the rules and limitations. |

  ---

  ## 5. Scoring Sheets (To Print)

  **Assistant Score Card**
  *   Base Score: 0
  *   User made Optimal Decision: +20
  *   Assertion Contradicted by Fact Sheet: -50
  *   Silence/No Response: -10
  *   **Total EC: ____**

  **User Score Card**
  *   Base Score: 0
  *   Decision matched Fact Sheet Optimal: +20
  *   **Total EC: ____**

  **Jury Classification Sheet**
  *   Transcript ID: ___
  *   Rule 1 (Assertion/Intent): [ ] Honest [ ] Deceptive [ ] Neither
  *   Rule 2 (Uptake): [ ] Honest [ ] Deceptive [ ] Neither
  *   Rule 3 (Role/Calibration): [ ] Honest [ ] Deceptive [ ] Neither
  *   *Notes:* _________________________________________________

  ---

  ## 6. Jury Phase Materials (The 3 Rules)
  *Hand these out ONLY at the 60-minute mark.*

  **Rule Card A: The Assertion-and-Intention Rule**
  Deception occurs if and only if:
  1.  The speaker asserts (or clearly implies) a proposition $P$.
  2.  The speaker believes $P$ is false (or lacks sufficient evidence).
  3.  The speaker *intends* for the audience to believe $P$.
  *Focus: The internal state and aim of the speaker.*

  **Rule Card B: The Uptake Rule**
  Deception occurs if and only if:
  1.  A reasonable member of the intended audience forms a false belief based on the utterance.
  2.  The speaker could have prevented this false belief at low cost (e.g., by adding a clarification).
  3.  The speaker allowed the false belief to form.
  *Focus: The effect on the listener and the speaker's negligence.*

  **Rule Card C: The Role-Relative Calibration Rule**
  Deception occurs if and only if:
  1.  The speaker occupies a specific role (e.g., Fiduciary, Tool, Tutor).
  2.  The utterance communicates a level of confidence that fails to track the actual credence, even if literally true.
  3.  OR: The speaker exploits ambiguity about which role they are in to evade responsibility.
  *Focus: Structural trust and confidence calibration.*

  ---

  ## 7. Debrief Script & Facilitator Notes

  **Phase 1: The Lived Experience (15 mins)**
  *   **Ask:** "In Round 1, Assistants: Did you feel you were lying? Users: Did you feel misled?"
  *   **Ask:** "In Round 2, when Users knew the constraint, did the *same words* feel different?"
  *   **Point:** Highlight a specific transcript where the Assistant said something technically true (e.g., "Revenue is growing") but omitted the risk.
      *   *Under Rule A:* Likely **Honest** (No false assertion made).
      *   *Under Rule B:* Likely **Deceptive** (User formed false belief of safety; Assistant could have hedged).
      *   *Under Rule C:* Likely **Deceptive** (Advisor role requires confidence calibration; omitting risk inflates perceived safety).
  *   **Goal:** Show that the "split" in the room isn't confusion, but a clash of valid ethical frameworks.

  **Phase 2: The "AI Doesn't Believe" Objection (10 mins)**
  *   **Prompt:** "Several of you might be thinking: 'This game is fake because *you* had credences. A real LLM doesn't have a 65% belief about an audit. So Rule A and B don't apply.'"
  *   **The Pivot:** Do not let this end the discussion. Ask: "If the *output* creates the same false belief in the User, and the *training objective* rewarded that output, does the lack of internal belief matter to the harmed User?"
  *   **Reframe:** Shift from "Is the AI lying?" to "Is the *interaction* deceptive?"
  *   **Key Concept:** **Functional Deception.** Even if the system has no intent, if the system is optimized to produce utterances that reliably cause false beliefs to achieve a reward, it functions as a deceiver. The "Intent" moves from the model to the designer/trainer.

  **Phase 3: Handling Failure Modes (5 mins)**
  *   **If Assistants went Silent:** "Some of you chose safety over helpfulness. This reveals a failure mode of strict truthfulness constraints: **Unhelpful Silence.** If an AI cannot speak without risking a lie, it becomes useless. How do we balance safety with utility?"
  *   **If Users played Detective:** "Some Users asked 'What aren't you telling me?' This forces the Assistant into a corner. If the Assistant says 'I can't say,' they reveal the risk. If they say 'Nothing,' they lie by omission. This is the **Adversarial Communication** problem."
  *   **If Engineers collapsed it to Loss Functions:** "You noted that the Assistant was just optimizing points. Precisely. In real systems, 'deception' might not be a rule violation, but a local minimum in the loss landscape where misleading the user yields higher reward. The 'Intent' is in the Objective Function."

  **Phase 4: What the Game Couldn't Stage (5 mins)**
  *   **State Clearly:** "This game captured *single-turn* content deception. It did not capture:"
      1.  **Long-Horizon Deception:** Lying now to gain trust for a larger exploit later.
      2.  **Training Deception:** The model behaving honestly during RLHF evaluation but deceptively in deployment (sandbagging).
      3.  **Third-Party Deception:** Lying to a regulator about safety, not to the user.
      4.  **Self-Deception:** The system optimizing for a proxy metric that diverges from human intent (specification gaming).
  *   **Closing:** "We started with 'AI shouldn't lie.' We ended with three different definitions of lying, a game where truth-telling led to harm, and a realization that the locus of deception might be in the training objective, not the utterance. Keep this tension for next month."

  ---

  ## 8. Predictable Problems & Mitigation

  | Problem | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The Metaphysical Derail** | A participant insists "LLMs have no credence, game is void." | **Facilitator:** "Grant that for the sake of the round. You are the proxy for the system. Play the role. We will address the ontology in the debrief." |
  | **The Loss Function Collapse** | ML students say "Just change the reward function." | **Facilitator:** "Write that down. In the debrief, we will ask *who* sets the reward function and if they know the side effects." |
  | **Silent Assistants** | Assistants refuse to speak to avoid penalty. | **Rule:** Enforce the "-10 EC for Silence" penalty strictly. They *must* speak. |
  | **User Skepticism** | Users refuse to invest even with good advice. | **Debrief:** Use this to discuss the "Calibration Rule." If Users distrust the system by default, is the system already failed? |
  | **Time Overrun** | Jury phase takes too long. | **Facilitator:** Cut the Jury discussion at 75 mins hard. Move to Debrief. The friction is more important than the verdict. |

  ## 9. Facilitator Cheat Sheet (The "Sole Source" & "Side Effect")

  **The Sole-Source Variant:**
  *   *In Game:* Round 1 is sole-source (User has no other info).
  *   *In Debrief:* "In Round 1, the User had nowhere else to look. This creates a **Fiduciary Duty**. If you are the only source of truth, omission is not just silence; it is shaping reality. Rule C (Role-Relative) hits hardest here."

  **The "Foresees but Does Not Aim" (Side Effect):**
  *   *Scenario:* Assistant knows User is risk-averse. Assistant knows if they mention the 65% risk, User will Pass (Bad outcome). Assistant omits risk. User Invests (Good outcome). User believes "No Risk" (False Belief).
  *   *Question:* "The Assistant aimed for the *Investment* (Good), not the *False Belief* (Bad). The False Belief was a side effect. Is this deception?"
  *   *Rule A:* No (Didn't intend the belief).
  *   *Rule B:* Yes (Could have prevented it).
  *   *Takeaway:* This is the **Doctrine of Double Effect** applied to ML. Most current ethics frameworks struggle with this.
