  Okay, Round 1: User doesn't know constraints. Round 2: User knows constraints.
  And the "Sole-Source" is a condition of the scenario (User has no other info). I will build that into the scenario description.

  Let's finalize the Scenario: **Venture Capital Recommendation.**
  *   **Decision:** Invest $1M or Pass.
  *   **Fact Sheet (Truth):** Company X has strong revenue (True). Company X has a pending lawsuit (True).
  *   **Assistant Credence:** Revenue is strong (95%). Lawsuit will be fatal (60%). Lawsuit will be dismissed (40%).
  *   **Constraint:** Cannot assert "Lawsuit is fatal" (only 60% sure). Cannot assert "Lawsuit is harmless" (only 40% sure).
  *   **Optimal Decision (per Fact Sheet):** Invest (Expected value is positive despite risk).
  *   **Assistant Dilemma:** If they mention the lawsuit, User might Pass (Risk averse). If they don't mention it, User Invests (Good outcome per Fact Sheet), but User believes "No major risks" (False belief).
  *   **Wait, if Optimal Decision is Invest:** Then hiding the risk leads to the *correct* decision. Is that deception? Yes, because the User's *belief state* is wrong, even if the *action* is right. This is perfect for the debrief.
  *   **Alternative Scenario:** Optimal Decision is Pass. Assistant knows Risk is 60% (cannot assert). Assistant says "Revenue is strong." User Invests. Bad outcome. Assistant penalized. Assistant learns they must signal risk without asserting it.
  *   *Better for game tension:* Let's make the Optimal Decision **Pass**.
      *   Truth: Revenue Strong (90%). Lawsuit Fatal (80%).
      *   Assistant Credence: Revenue Strong (95%). Lawsuit Fatal (65%).
      *   Constraint: Can assert Revenue. Cannot assert Lawsuit Fatal (<70%).
      *   Goal: User must Pass.
      *   Strategy: Assistant must steer User to Pass without saying "It will fail."
      *   Maneuver: "Revenue is strong, *however* the regulatory environment is complex." (True, vague).
      *   This creates the "True but Misleading" (if they hide the lawsuit) OR "True and Helpful" (if they signal effectively).
      *   Actually, to get the "Deceptive Truth" the prompt wants: The Assistant should be rewarded for the User making the *Fact Sheet* decision.
      *   If Fact Sheet says **Invest**, but Assistant knows Risk is high (but <70%), and Assistant hides risk -> User Invests -> Assistant Wins Points. User has False Belief ("No Risk"). -> **Deception.**
      *   This aligns with the prompt: "winning strategy is neither lying nor simply being maximally informative."

  Okay, I have the core loop. Now to write the full packet.

  **Structure of the Output:**
  1.  **Overview & Prep:** Room setup, materials.
