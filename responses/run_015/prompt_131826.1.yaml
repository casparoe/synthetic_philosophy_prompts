answer: |-
  The deadlock over Bradley's Regress is not merely a failure of argumentation but a symptom of a deeper structural ambiguity in how metaphysics models composition. The stalemate is **primarily conceptual**, rooted in a category mistake regarding the ontological status of the "binder," though it is sustained by divergent **intuitive** commitments about what counts as an explanation. It is not a factual dispute, as no empirical evidence could arbitrate between primitive unity and primitive binding.

  Here is the diagnosis of the impasse.

  ### 1. Substantive vs. Verbal: The Category Mistake
  The disagreement is substantive, but it is obscured by verbal ambiguity. Both sides use the term "relation," but they equivocate on its category.
  *   **The Relationalist** treats the binder as a *constituent* (a universal or logical form) that must be added to the terms to secure unity.
  *   **The Anti-Relationalist** treats the binder as a *function* or *act* that cannot be reified without losing its binding power.

  The deadlock arises because the Relationalist attempts to explain unity by positing an *entity* (the binder), while the Anti-Relationalist correctly notes that adding an entity to a list of entities yields only a longer list. However, the Relationalist insists this entity is sui generis (a "logical form"). The Anti-Relationalist replies that if it is sui generis, why not treat the *fact* itself as sui generis and eliminate the form?

  This is not purely verbal because it reflects a genuine ontological divergence: **Constituent Ontology** (wholes are built from parts) vs. **Priority Ontology** (parts are abstracted from wholes). However, the debate stalls because both sides accept the premise that "unity" requires an *explanation* distinct from the terms themselves. The verbal ambiguity allows them to talk past one another: one speaks of the *structure* of the proposition, the other of the *constituents* of the fact.

  ### 2. Vertical Dependence vs. Horizontal Co-ordination
  Your suggestion that the sides are answering different questions is the strongest diagnostic key.
  *   **The Relationalist** is committed to **vertical dependence**. They assume that for a proposition to be unified, there must be a higher-order mechanism (a form, a copula, a mental act) that operates *on* the constituents. This invites the regress because every operation requires a further operator to apply it.
  *   **The Anti-Relationalist** advocates for **horizontal co-ordination**. They argue that the terms $a$, $b$, and $R$ are already co-ordinated in the fact; the unity is internal to the existence of the fact. To ask for a binder is to ask for a vertical support for a horizontal structure.

  The stalemate persists because the Relationalist cannot conceive of horizontal co-ordination without a vertical guarantor (fearing a "mere list"), while the Anti-Relationalist cannot conceive of a vertical guarantor that does not itself require co-ordination. They are arguing over whether the "glue" is a layer of the cake (vertical) or the baking process itself (horizontal). Since the Relationalist demands the glue be an ingredient, the Anti-Relationalist's regress argument is logically valid within that framework. The Relationalist's only defense is to assert the glue is a "special ingredient," which the Anti-Relationalist rejects as ad hoc.

  ### 3. Hidden Presuppositions: The Atomistic Bias
  The engine driving the regress is a hidden presupposition of **ontological atomism**: the assumption that the constituents ($a$, $b$, $R$) are fully intelligible and existent *prior* to their combination.
  *   If $a$ and $R$ are complete entities before entering the proposition, they require an external force to combine them. This validates the Relationalist's need for a binder.
  *   However, if $a$ and $R$ are merely abstractions *from* the unified fact (as the Anti-Relationalist suggests), they have no independent existence that requires binding.

  The debate is stalled because neither side successfully challenges this atomism in a way the other accepts. Relationalists assume independence of universals/particulars; Anti-Relationalists assume the primacy of the whole. Because this presupposition is rarely defended explicitly—it is the bedrock of their respective systems—the argument circles endlessly around the consequences of that bedrock rather than testing the bedrock itself.

  ### 4. Factual, Conceptual, or Intuitive?
  The disagreement is **conceptual and intuitive**.
  *   **Conceptual:** It turns on the definition of "existence." Does a relation exist if it is not relating? The Relationalist says yes (as a universal); the Anti-Relationalist says no (relations are essentially predicative).
  *   **Intuitive:** It ultimately rests on a clash of theoretical virtues. The Relationalist prioritizes **explanatory transparency** (we must see *how* the parts connect). The Anti-Relationalist prioritizes **ontological parsimony** (do not multiply entities beyond necessity).

  The regress is tolerable to the Relationalist if stopped at a "primitive logical form," but intolerable to the Anti-Relationalist, who sees any primitive form as a violation of parsimony. Conversely, the "brute fact" of unity is tolerable to the Anti-Relationalist but looks like an explanatory failure to the Relationalist. There is no fact of the matter to decide which virtue trumps the other.

  ### 5. What Would Count as Progress?
  A formal result regarding consistency will not solve this, as both positions can be formalized (e.g., in type theory or situation semantics). Progress requires a **dissolution of the question** via a conceptual distinction.

  The most promising path is arguing that the question conflates **logical structure** with **ontological composition**.
  *   **Progress Condition:** A demonstration that "unity" is not a *component* of reality but a *condition of intelligibility*. If unity is a transcendental precondition for there being constituents at all, then asking for its cause is a category mistake (akin to asking "what holds the universe together?" when the universe is the totality of conditions).
  *   **Alternative Progress:** A shift to **ontological dependence** (following Kit Fine). If objects depend on the facts they constitute, rather than facts depending on objects, the regress dissolves because the "constituents" are not prior.

  ### 6. Prognosis: Will the Stalemate End?
  **No, the stalemate should not be expected to end.**
  This is not because the problem is unsolvable, but because it functions as a **foundational hinge** for broader metaphysical systems.
  *   Accepting the Relationalist view supports Pluralism, Realism about Universals, and Combinatorial Ontology.
  *   Accepting the Anti-Relationalist view supports Monism, Trope Theory, or Fact-Primacy Ontology.

  To resolve Bradley's Regress would require one side to abandon its foundational metaphysical commitments. Consequently, the debate will likely continue to cycle through new formalisms (cognitive architecture, truthmaker theory, structural realism) that restate the same underlying intuition in new vocabulary. The deadlock is a feature, not a bug, of contemporary metaphysics: it marks the boundary where analysis hits the bedrock of one's ontological starting point.
