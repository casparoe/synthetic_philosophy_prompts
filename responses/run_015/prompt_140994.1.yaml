      *   **Tension 4 (Diachronic Preferences vs. Synchronic Cycles):** Does (2) protect diachronic cycles from (1)'s logic?

      *   *Self-Correction on Tension 2:* In the literature (e.g., McClennen), Sophistication and Precommitment are often compatible. Sophistication is the *reasoning* style; Precommitment is the *tool*. A sophisticated agent sees they will succumb to temptation, so they precommit. A resolute agent sees they will succumb, but decides *not to* via sheer will. So (4) and (5) might be compatible if "resolute" is defined strictly as internal willpower vs. external constraint. I need to be careful not to call this a contradiction if the user defines terms standardly. However, the phrasing "don't pick a plan... and stick to it" in (4) sounds suspiciously like precommitment. I will flag this as a definitional risk.

