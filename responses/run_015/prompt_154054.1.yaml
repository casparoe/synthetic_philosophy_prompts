prompt: |-
  I'm doing a PhD in history and I also work part time on a digital humanities project where we take published monographs and tag every single sentence. Each sentence gets one of three labels: 'sourced' (there's a document underneath it), 'inferred' (no document actually says it, the author got there by reasoning, generalization, or common sense), and 'framed' (it's the author's interpretive choice — what to call the thing, who counts as an actor, where the story starts and ends, what kind of story it is). We also spot check footnotes and tag whether the cited source really supports the sentence it's attached to. The people on the project keep fighting about whether this is neutral metadata or whether it already commits us to a position about whether there is a fact of the matter about the past. I think it does commit us, but I can't say exactly where.

  It's made me look differently at what ordinary academic history already presupposes. On the one hand the whole apparatus behaves as if there's a real past we're converging on: you go to the archive, you cite primary sources rather than secondary ones, reviewers spot check your footnotes, journals print corrections and sometimes retract when someone finds you got a date or a quotation wrong, and fabricating a source will end your career. On the other hand nobody in my department believes the Rankean slogan about showing the past as it actually was, everyone's read Carr on the facts of history always reaching us already selected by somebody, and since Hayden White people will happily say in a seminar that the narrative shape — tragedy, comedy, romance, satire — is something the historian puts onto the material rather than finds in it. And the discipline is wildly more relaxed about the second kind of thing: almost nobody is ever made to retract an interpretation, only a fact, and there's a strong norm that saying "that's my reading" settles the matter.

  So: what does that bundle of practices actually presuppose about historical knowledge? Reconstruct the implicit theory, and separate what the practice strictly presupposes from what it merely fits comfortably with — I suspect footnote discipline and the punishment of fabrication commit you to less than people think, while the refusal to ever correct an interpretation commits you to more. Tell me whether the parts are consistent with each other. Two things puzzle me especially: we punish fabrication savagely and correct wrong dates, but a source that's been badly read is barely a problem and an interpretation is never withdrawn, which feels like it presupposes that the chain of attribution matters more than the truth of what's said; and we let a sentence resting on a self-interested document count as 'sourced' on exactly the same footing as one resting on a document nobody had a stake in. Then bring it back to my tagging scheme: which kinds of sentence should break a three-way split like ours — causal claims, claims about what someone believed, claims from silence or from absence in the archive, claims about what was typical, counterfactuals — and what would have to change in the practice of history if we took the Whitean view seriously enough to build it into the way we write, review, and correct books?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** PhD student in History + part-time on a Digital Humanities (DH) project.
      *   **The DH Project:** Tagging every sentence in monographs as 'sourced' (documented), 'inferred' (reasoned/generalized), or 'framed' (interpretive/narrative choices). Also spot-checking footnotes for accuracy.
      *   **The Conflict:** Project team argues over whether this tagging is "neutral metadata" or commits them to a specific epistemological position (realism vs. constructivism).
      *   **The User's Observation:** Academic history practices seem contradictory.
          *   *Side A (Realist/Positivist):* Archive work, primary source priority, footnote checking, corrections/retractions for factual errors (dates, quotes), career-ending punishment for fabrication.
          *   *Side B (Constructivist/Postmodern):* Rejection of Rankean "wie es eigentlich gewesen," acceptance of Carr (facts are selected), acceptance of Hayden White (narrative emplotment is imposed), "that's my reading" shields interpretations from correction.
      *   **The Task:**
          1.  Reconstruct the *implicit theory* of historical knowledge presupposed by this bundle of practices.
          2.  Separate what practice *strictly presupposes* vs. what it merely *fits comfortably with*.
          3.  Assess consistency between the parts (especially the asymmetry between fact-checking and interpretation-checking).
          4.  Address the specific puzzle about source bias (self-interested vs. neutral documents treated equally as 'sourced').
          5.  Apply this to the DH tagging scheme: Which sentence types break the three-way split?
          6.  Speculate on what would change if the Whitean view were taken seriously enough to be *built into* writing/reviewing/correction practices.

  2.  **Analyze the Implicit Theory of Historical Knowledge:**

      *   *The "Professional Realism" Hybrid:* The discipline doesn't operate on pure Naive Realism (the past is exactly recoverable) nor pure Radical Constructivism (the past is purely a literary creation). It operates on a *procedural realism*.
      *   *Core Presupposition:* There is a *constraint* exerted by the past, but *access* is always mediated.
      *   *The Asymmetry:* Facts (dates, quotes, existence of documents) are treated as *falsifiable constraints*. Interpretations (causes, meanings, motivations, emplotment) are treated as *plausibility contests*.
      *   *The "Chain of Attribution":* The user notes that attribution matters more than truth. This suggests the discipline values *accountability* and *traceability* over ontological certainty. If I can show you *where* I got it, I've done my job, even if the source is lying. The historian's duty is to the *record*, not necessarily to the *reality* behind the record (unless the record is demonstrably fake).

  3.  **Strict Presuppositions vs. Comfortable Fits:**

      *   *Strict Presuppositions:*
          *   There is a material trace (archive) that exists independently of the historian.
          *   Misrepresenting the content of that trace is a violation of professional ethics (fabrication).
          *   Interpretations must be *compatible* with the traces, even if not uniquely determined by them.
      *   *Comfortable Fits (but not required):*
          *   That "sourced" = "true." (A source can lie).
          *   That "inferred" = "speculative." (Inference is often rigorous).
          *   That "framed" = "subjective." (Framing can be empirically grounded).
      *   *Consistency Check:* Is it consistent to punish fabrication but not bad interpretation? Yes, *if* the goal is procedural integrity rather than ontological finality. Fabrication breaks the chain of evidence. Bad interpretation is just a weaker argument, not a breach of contract. However, the user is right to sense a tension: if *all* history is framed (White), then the distinction between "getting a date wrong" and "getting the motive wrong" is a difference of degree of consensus, not kind of truth.

  4.  **Addressing the Source Bias Puzzle:**

      *   Why is a self-interested document tagged 'sourced' the same as a neutral one?
      *   *Reason:* The tag describes the *relationship between text and archive*, not the *truth value of the archive*.
      *   *Implication:* The system assumes the historian's labor (contextualization) handles the bias, not the metadata. The tag says "This claim rests on a trace," not "This claim is objectively true."

  5.  **Applying to the DH Tagging Scheme:**

      *   *The Three Categories:* Sourced, Inferred, Framed.
      *   *Problematic Sentence Types:*
          *   *Causal Claims:* Usually 'Inferred' (no document says "X caused Y"), but often treated as 'Sourced' if based on a smoking gun.
          *   *Belief/Mental States:* 'Inferred' from action, but often written as 'Sourced' from diaries (which are themselves performances).
          *   *Silence/Absence:* Hard to tag. Is "X is not mentioned" sourced (to the absence) or inferred?
          *   *Typicality/Generalization:* 'Inferred' (sample to population), but often presented as fact.
          *   *Counterfactuals:* Purely 'Inferred' or 'Framed'?
      *   *The Break:* The split breaks down because *all* historical sentences are arguably 'Framed' (White) and *all* rely on some 'Inference' (Carr). The 'Sourced' category is the most fragile because a source never speaks for itself; it is always selected and framed.

  6.  **The "Whitean" Scenario (What if we took Constructivism seriously?):**

      *   If we accept White fully, we can't just tag "Framed" as a subset. *Everything* is Framed.
      *   *Changes to Practice:*
          *   Reviewing would judge narrative coherence and ethical utility, not just "support."
          *   Corrections would admit "narrative failure" not just "factual error."
          *   Footnotes would cite *discursive traditions* not just *archives*.
          *   Retractions might happen for "harmful emplotment" (e.g., colonialist narratives) rather than just wrong dates.
      *   *The DH Project's Commitment:* By distinguishing 'Sourced' from 'Framed', the project *presupposes* a distinction between "what the document says" and "what the historian makes of it." This is a *moderate realist* position. It rejects hard constructivism (where the document is just another text) and hard positivism (where the document is a transparent window).

  7.  **Drafting the Response:**

      *   *Tone:* Academic, rigorous, empathetic to the PhD struggle, philosophically precise.
      *   *Structure:*
          1.  **The Implicit Theory:** Define "Procedural Realism" or "Disciplinary Constructivism."
          2.  **Presuppositions vs. Comfort:** Distinguish the hard constraints (traceability) from the soft norms (interpretation).
          3.  **The Asymmetry:** Explain why fabrication is punished but interpretation isn't (Ethics of Evidence vs. Pluralism of Meaning).
          4.  **The Source Bias:** Explain the "Trace vs. Truth" distinction.
          5.  **The Tagging Scheme:** Analyze where the categories bleed (Causality, Silence, Typicality).
          6.  **The Whitean Alternative:** What would a truly constructivist discipline look like?
          7.  **Conclusion:** Validate the user's intuition that the project is not neutral.

  8.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "White is right." I need to analyze the *current practice*. The current practice is a *pragmatic compromise*.
      *   *Nuance:* The user asks if the parts are consistent. I should argue they are *functionally* consistent (they keep the discipline running) but *theoretically* unstable (they rely on an unacknowledged oscillation between realism and constructivism).
      *   *The DH Project:* The project claims to be metadata, but by categorizing sentences, it reifies the distinction between "fact" and "interpretation." This *is* a philosophical commitment. It commits to the idea that some sentences *can* be purely sourced. A hard Whitean would say no sentence is purely sourced.

  9.  **Final Polish:** Check against the specific questions in the prompt.
      *   Reconstruct implicit theory? Yes.
      *   Separate strict presuppositions from comfortable fits? Yes.
      *   Consistency check? Yes.
      *   Address source bias puzzle? Yes.
      *   Tagging scheme breakdown? Yes.
      *   Whitean practice changes? Yes.

      *(Self-Correction on the "Source Bias" point)*: The user asks why a self-interested document counts as 'sourced' same as a neutral one. The answer is that 'sourced' tracks *provenance*, not *veracity*. This reinforces the "Procedural Realism" point.

      *(Self-Correction on "Whitean Practice")*: If we took White seriously, we wouldn't just tag "framed." We would acknowledge that "sourced" sentences are *also* framed by the act of selection. The tagging scheme itself would need to collapse or become recursive.

  10. **Final Output Generation** (Proceed to write the response following this structure).
answer: |-
  This is a profound methodological puzzle, and your intuition is correct: your tagging project is not neutral metadata. It is an intervention in the philosophy of history, whether the team admits it or not. By creating distinct buckets for 'sourced', 'inferred', and 'framed', you are reifying a distinction that the discipline relies on practically but denies theoretically.

  Here is a reconstruction of the implicit theory of historical knowledge presupposed by current academic practice, an analysis of its consistency, and an assessment of what your tagging scheme actually commits you to.

  ### 1. The Implicit Theory: Procedural Realism

  The bundle of practices you describe (punishing fabrication, ignoring interpretive disputes, prioritizing archives) does not presuppose Naive Realism (the past is objectively recoverable) nor Radical Constructivism (the past is a literary fiction). It presupposes **Procedural Realism**.

  **Strict Presuppositions (What the practice *requires*):**
  *   **The Constraint of the Trace:** There exists a material residue of the past (archives) that exerts a negative constraint on historical writing. You cannot say *anything* you want; the traces will eventually resist you (e.g., a date that doesn't exist, a quote that isn't there).
  *   **Traceability:** Every claim must be accountable to a chain of evidence. The ethical core of the discipline is not "truth" in a metaphysical sense, but *fidelity to the chain of attribution*.
  *   **Communal Verification:** The community must be able to retrace the steps from the claim back to the trace. Fabrication breaks this circuit; interpretation merely offers a different route along the same circuit.

  **Comfortable Fits (What the practice *likes* but doesn't need):**
  *   **Correspondence Truth:** It is comfortable to believe that a 'sourced' sentence corresponds to reality, but the practice only requires that it corresponds to the *document*.
  *   **Interpretive Pluralism:** It is comfortable to believe all interpretations are equally valid, but the practice actually relies on a hidden hierarchy of "more/less evidenced" interpretations, even if it refuses to formally rank them.
  *   **The Neutrality of the Archive:** It is comfortable to treat the archive as a passive repository, even though practitioners know it is a product of power (what was saved, what was destroyed).

  **The Consistency Check:**
  Are the parts consistent? **Functionally, yes. Theoretically, no.**
  The asymmetry you note (punishing wrong dates but not wrong readings) is consistent *if* the goal of the discipline is maintaining the integrity of the evidentiary chain rather than arriving at a final Truth. Fabrication severs the chain; bad interpretation just makes the chain weak.
  However, this is theoretically unstable because it relies on a bright line between "fact" (the date) and "interpretation" (the motive) that post-positivist philosophy (Carr, White) has successfully blurred. If all facts are theory-laden, then correcting a date is also an interpretive act (privileging one document over another). The discipline survives by pretending this distinction is sharper than it is.

  ### 2. The Source Bias Puzzle

  You asked why a sentence resting on a self-interested document counts as 'sourced' on the same footing as one resting on a neutral document.

  **The Answer:** The tag 'sourced' describes **provenance**, not **veracity**.
  The implicit theory here is that the historian's job is to manage the bias, not to eliminate it. By tagging a sentence 'sourced', you are saying, "The author is not making this up; they are reporting what the trace says." The work of critiquing the source's interest belongs to the *inference* layer or the surrounding argument, not the metadata of attribution.

  **The Commitment:** This commits you to the view that **the document is a constraint, even if it is a lie.** If a propagandist writes "We won the battle," and the historian writes "The regime claimed victory (Source X)," that sentence is 'sourced'. If the historian writes "They won the battle (Source X)," that sentence is 'inferred' (because it infers truth from a biased source). Your tagging scheme forces the team to make this distinction explicit, which is why they are fighting. They want 'sourced' to mean "true," but the practice only supports "attributed."

  ### 3. What Breaks the Three-Way Split?

  Your scheme (Sourced / Inferred / Framed) assumes sentences can be cleanly separated. Several types of historical claims break this triad, revealing the instability of the categories:

  *   **Causal Claims:** ("The famine caused the revolution.")
      *   *Problem:* No document usually says "A caused B." This is always an inference. But in practice, causal claims are often treated as 'sourced' if they rely on a specific mechanism found in a document.
      *   *Break:* They are structurally 'inferred' but functionally treated as 'sourced' findings.
  *   **Claims about Belief/Mental States:** ("He believed X.")
      *   *Problem:* Unless there is a diary entry saying "I believe X," this is inferred from action. But diaries are themselves performances (framed).
      *   *Break:* These are almost always 'inferred', but tagging them as such makes the monograph look speculative, creating pressure to mislabel them 'sourced'.
  *   **Claims from Silence/Absence:** ("X is not mentioned in the records.")
      *   *Problem:* Is this 'sourced' (to the absence) or 'inferred' (that the absence means something)?
      *   *Break:* It requires a 'framed' decision about what *should* have been there. It breaks the split because it relies on a counterfactual expectation.
  *   **Claims about Typicality:** ("This was a common practice.")
      *   *Problem:* Based on a sample. Is it 'sourced' (to the sample) or 'inferred' (to the population)?
      *   *Break:* It masks an inductive leap as a factual description.
  *   **Counterfactuals:** ("Had X not happened, Y would have followed.")
      *   *Problem:* Purely inferred, but often used to clarify causal claims.
      *   *Break:* Most journals forbid them, acknowledging they break the 'sourced' contract, yet they are essential to historical reasoning.

  **The Verdict on the Scheme:** The scheme commits you to a **Moderate Realist** position. It assumes there is a layer of "pure documentation" ('sourced') that is distinct from "thinking" ('inferred') and "storytelling" ('framed'). A hard Whitean would argue *every* sentence is 'framed' (because selection is interpretation) and *every* sentence is 'inferred' (because reading is interpretation). By keeping the categories separate, you are presupposing that the archive can speak without framing.

  ### 4. What if We Took the Whitean View Seriously?

  If the discipline actually internalized Hayden White (that narrative emplotment is a literary choice, not a discovery) and built it into writing, review, and correction, practice would change radically:

  1.  **Footnotes would cite Discursive Traditions, not just Archives:**
      *   Currently: `^1 National Archives, Box 4.`
      *   Whitean: `^1 National Archives, Box 4 (read through the lens of bureaucratic self-justification); cf. Tragedy narrative structure.`
      *   You would have to cite the *narrative mode* you are using to organize the evidence.

  2.  **Corrections would include "Narrative Retractions":**
      *   Currently: You retract if you got the date wrong.
      *   Whitean: You could retract if you realized your "Comedy" emplotment (progress) obscured a "Tragedy" (loss). A book could be "corrected" for being ethically misleading in its narrative shape, not just factually wrong.

  3.  **Review would judge Ethical Utility, not just Plausibility:**
      *   Since there is no "one true story," the criterion for publication would shift from "Is this the most accurate reconstruction?" to "Is this a useful/responsible way to organize the past for the present?"
      *   This would make history more overtly political, which is currently a taboo (the "presentism" accusation).

  4.  **The Tagging Scheme would Collapse:**
      *   You couldn't have a 'sourced' category distinct from 'framed'. Every source citation is a framing device.
      *   You would need a tag for **"Contestation"**: Does this sentence acknowledge its own constructed nature?
      *   You would need a tag for **"Emplotment"**: Is this sentence serving a tragic, comic, or ironic function?

  ### 5. Conclusion: Where Your Project Stands

  Your project is not neutral. By tagging sentences as 'sourced', you are reinforcing the **Positivist Contract** that allows historians to claim authority. You are creating a map that says, "Here is the ground (source), and here is the building we put on it (inference/frame)."

  The fighting on your team is inevitable because:
  1.  **The Realists** fear that if 'framed' swallows 'sourced', history becomes literature and loses its claim to truth.
  2.  **The Constructivists** fear that if 'sourced' remains distinct, you are lying about the neutrality of the archive.

  **My advice:** The scheme is useful, but only if you add a metadata field for **"Epistemic Status."**
  *   *Sourced (Contested):* The document exists but is known to be biased.
  *   *Sourced (Corroborated):* Multiple independent traces.
  *   *Inferred (Necessary):* Logical prerequisite (e.g., "He must have traveled to get there").
  *   *Inferred (Speculative):* Plausible but unproven.
  *   *Framed (Explicit):* The author admits this is a choice.
  *   *Framed (Implicit):* The author presents a choice as a fact.

  This acknowledges the Procedural Realism of the discipline while exposing the Constructivist reality underneath. It admits that the "fact of the matter" is not a rock we find, but a status we grant to certain sentences through communal agreement and evidentiary discipline. Your tagging project, therefore, is not just metadata; it is a peer review of the discipline's epistemological conscience.
