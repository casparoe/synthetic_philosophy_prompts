answer: |-
  This is a sharp observation, and you are right to feel that it sits in the neighborhood of Chesterton's Fence without being identical to it. To answer your first question directly: **No, there is no single canonical term for this specific regenerative loop in conservative theory or philosophy of science.**

  However, the move you are describing is a composite of three well-established concepts that, when stitched together, create the specific fallacy you've identified. If you want to carve this out for your writing or teaching, you are looking at the intersection of **Naive Functionalism**, **Just-So Storytelling**, and **Immunization Strategies**.

  Here is how to map the territory, distinguish it from legitimate Burkean prudence, and what you might call it.

  ### 1. The Existing Components

  **A. Naive Functionalism (Sociology/Anthropology)**
  In the mid-20th century, sociologists like Robert Merton critiqued the assumption that "if an institution exists, it must serve a vital function." This is the core engine of the argument you're seeing. It assumes that longevity equals utility. When you prove the *original* utility is gone, the naive functionalist assumes a *latent* utility must exist simply because the structure persists. Merton called this the "postulate of the indispensability of existing structures."

  **B. Just-So Stories (Evolutionary Biology/Philosophy of Science)**
  Coined by Gould and Lewontin, this refers to adaptive explanations for traits that are plausible but untestable. In your context, when the defender claims the grant signature requirement now serves "social cohesion" after you prove it was originally for "fraud prevention," they are telling a Just-So Story. They are inventing a retrospective adaptive function to explain persistence without evidence.

  **C. Immunization Strategies (Popper/Lakatos)**
  This covers the rhetorical pivot. When you debunk the specific function, the defender shifts the burden of proof ("You can't prove it *doesn't* do something"). In Lakatosian terms, this is a **degenerating research programme**. The core heuristic ("Institutions are wise") is protected by ad-hoc auxiliary hypotheses ("The wisdom is hidden," "The wisdom changed") that make the claim unfalsifiable.

  ### 2. How to Carve It Out: The Boundary

  The reason you don't have a word for this is that it masquerades as **Burkean Prudence**. To distinguish them, you need to locate the boundary regarding **falsifiability** and **burden of proof**.

  **Legitimate Burkean Prudence:**
  *   **Claim:** Institutions contain tacit knowledge accumulated over time.
  *   **Condition:** If we identify the original purpose and confirm it is obsolete, the presumption of wisdom is defeated.
  *   **Burden of Proof:** Shared. The reformer must show the rule is obsolete; the defender must show where the hidden value lies if they wish to retain it.
  *   **Outcome:** Chesterton's Fence is cleared away once the reason is understood.

  **The Fallacious Loop (Your Phenomenon):**
  *   **Claim:** Institutions contain tacit knowledge that is *inherently* opaque.
  *   **Condition:** If the original purpose is debunked, the "wisdom" migrates to a new, vaguer function.
  *   **Burden of Proof:** Total reversal. The reformer must prove a negative (that *no* function exists) rather than the defender proving a positive (that *a* function exists).
  *   **Outcome:** The Fence becomes immortal because its purpose is defined by its persistence, not its utility.

  The exact boundary is **teleological rigidity**. Legitimate caution admits that sometimes fences *do* rot and should be removed. This loop assumes the fence is self-justifying.

  ### 3. Naming the Move

  Since there isn't a standard term, you have the opportunity to coin one. Given your context (political philosophy/ideology), here are three options ranging from descriptive to theoretical:

  **Option 1: The Chestertonian Regress**
  This captures the infinite layering you described. Every time you scrape a layer of justification, another appears. It signals that this is a corruption of Chesterton's original insight.
  *   *Usage:* "The Dean isn't making a Burkean argument; he's engaging in a Chestertonian Regress, inventing new latent functions every time we debunk the manifest ones."

  **Option 2: Functionalist Immunization**
  This highlights the philosophy of science angle. It marks the move where a functional claim is protected from falsification by becoming vaguer.
  *   *Usage:* "This is a classic case of Functionalist Immunization: the specific utility is sacrificed to save the general assumption of utility."

  **Option 3: The Argument from Inscrutability**
  This focuses on the epistemic retreat. The defender moves from "We know why this is here" to "We *can't* know why this is here, so we must keep it."
  *   *Usage:* "They have retreated to an Argument from Inscrutability, where the lack of evidence for a function is treated as evidence of the function's depth."

  ### 4. Recommendation for Your Context

  For a PhD seminar or undergrad TAing, **"The Chestertonian Regress"** is the most pedagogically effective. It immediately anchors the students in the text you just read (Burke/Chesterton) while signaling that the logic has gone off the rails.

  It allows you to make a crucial distinction: **Chesterton's Fence is an epistemic pause, not an ontological shield.** It says "Wait until you understand," not "You will never understand, so never move." The loop you've identified treats the pause as a permanent barrier.

  If you write this up, the contribution is identifying that this isn't just status quo bias; it's a **dynamic rhetorical strategy** that consumes historical evidence to fuel its own continuity. It treats history not as a record of causes to be examined, but as a black box that validates whatever comes out of it.
