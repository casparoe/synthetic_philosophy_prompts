prompt: |-
  I am a novelist drafting a multi-perspective war epic, and in conversations with fellow writers—who tend to think in terms of focalization, dramatic irony, diegetic sympathy, and plot-level framing rather than in moral-philosophical categories—I have encountered a philosophical claim that sounds, at first, almost like a narrative convention. Please act as an expert philosopher of war with serious familiarity with literary narratology. Before answering, take a moment to brainstorm carefully: lay out the core commitments of the classical just-war thesis of moral equality of combatants—that soldiers on an unjust side are not, merely by serving an unjust cause, rendered liable to be killed, and that the permission to kill in battle applies symmetrically regardless of which cause is just—without relying on any specific citation or bibliographic reference. Then, restate that entire position as faithfully as possible using only the vocabulary of narrative craft that I actually employ: focalization and point-of-view, protagonist versus antagonist framing, diegetic versus non-diegetic judgment, dramatic irony, the narrative sympathy or interior psychological access granted to characters, plot-level justice versus character-level agency, and the concept of "focalization parity" (by which I mean the literary norm that opposing soldiers in a serious war narrative are typically granted equivalent interior depth regardless of which side the plot structurally endorses). For each translated claim, indicate whether it survives intact, requires distortion, or collapses entirely.

  Next, provide the residue report. Identify precisely what portion of the moral equality thesis has no counterpart in this narrative vocabulary. In particular, examine whether the separation between jus ad bellum and jus in bello—the independence of the justice of the war from the justice of individual acts within it—can be rendered as a separation between "plot-level moral framing" and "character-level permissions to act," or whether that translation smuggles in assumptions that the philosophical thesis explicitly rejects. Also assess whether "diegetic culpability separation" (the notion that a character's moral status inside the story-world is evaluated independently of the audience's extra-diegetic judgment about the cause they serve) captures something genuinely present in the thesis, or whether it merely dresses up an ambiguity. Be rigorous about whether the residue reveals a genuine deficiency in narrative vocabulary—something about moral status that literature simply cannot encode—or whether it shows that the philosophical position depends on distinctions that dissolve once technical moral language is removed. I want to know whether my intuition that moral equality is essentially "just focalization parity applied to ethics" is correct, mistaken, or missing the point in a specific way.

  Please think step by step, keep the analysis honest rather than forcing the narrative framework to speak where it is silent, and avoid invoking niche technical theories outside standard just-war discussion. At the end, organize your response with the translation, the distortion notes, and the residue analysis clearly separated. Finally, conclude with a single line beginning Verdict: and enclose your bottom-line judgment inside \answer{...}—specifically, whether the untranslatable residue points to a gap in narrative craft or to an ambiguity in the philosophical thesis itself.
