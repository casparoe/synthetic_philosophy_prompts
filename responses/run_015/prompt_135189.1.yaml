answer: |-
  ### Core Commitments of the Moral Equality of Combatants

  Before translating, we must isolate the philosophical skeleton of the classical just-war thesis known as the Moral Equality of Combatants (MEC). Its core commitments are as follows:

  1.  **Symmetry of Liability:** Combatants on both sides of a war are equally liable to be attacked. A soldier fighting for an unjust cause is not morally immune from being killed simply because their cause is unjust.
  2.  **Symmetry of Permission:** Combatants on both sides possess an equal moral permission to kill enemy combatants. A soldier fighting for a just cause does not have a superior right to kill than one fighting for an unjust cause; both are permitted to use lethal force against the other.
  3.  **Separation of Judgments:** The justice of the war itself (*jus ad bellum*) is distinct from the justice of actions within the war (*jus in bello*). A soldier's moral status regarding their right to fight is not determined by the moral status of the state or cause they serve.
  4.  **Threat-Based Liability:** Liability to attack is grounded in the immediate threat posed by being an armed combatant, not in personal culpability for the war's initiation. Ignorance, coercion, or epistemic limitation regarding the cause does not strip a soldier of their combatant status nor grant them immunity.

  ### Translation into Narrative Vocabulary

  Here, I attempt to render these philosophical commitments using only the vocabulary of narrative craft you provided.

  | Philosophical Claim (MEC) | Narrative Translation | Evaluation |
  | :--- | :--- | :--- |
  | **Symmetry of Liability**<br>(Unjust soldiers may be killed) | **Protagonist/Antagonist Permeability:** The narrative must allow the "antagonist" soldiers (those opposing the plot's endorsed cause) to be killed by the "protagonist" soldiers without this death functioning as a moral victory or thematic resolution of their evil. | **Requires Distortion.** Narrative death usually carries thematic weight. Killing an antagonist often signifies plot-level justice. MEC requires the death to be morally neutral, which narrative struggle to render without seeming indifferent. |
  | **Symmetry of Permission**<br>(Unjust soldiers may kill) | **Focalization Parity:** The narrative must grant equivalent interior psychological access and agency to opposing soldiers during combat, validating the antagonist's attempt to kill the protagonist as a legitimate action within the scene's logic. | **Collapses.** Focalization parity grants *understanding*, not *permission*. A reader can understand why an antagonist shoots (interior access) while still judging the act as morally wrong. Narrative access does not equate to moral licensing. |
  | **Separation of Judgments**<br>(*Ad Bellum* vs. *In Bello*) | **Plot-Level vs. Character-Level Framing:** The "Plot-level moral framing" (the story's verdict on the war's cause) must remain hermetically sealed from "Character-level agency" (the soldier's right to act in the scene). | **Collapses.** In narrative, character action *creates* plot meaning. If the plot frames the war as unjust, the character's actions are inevitably染 (stained) by that framing. Narrative semantics resist this separation; context determines meaning. |
  | **Threat-Based Liability**<br>(Status based on threat, not culpability) | **Diegetic Culpability Separation:** A character's moral status inside the story-world is evaluated independently of the audience's extra-diegetic judgment about the cause they serve. | **Requires Distortion.** "Diegetic culpability" is an aesthetic effect, not a moral status. An author can write a sympathetic enemy (low diegetic culpability) while the audience knows they are on the wrong side (high extra-diegetic judgment). This mirrors MEC superficially but lacks the normative force. |

  ### Residue Report

  The translation process reveals a significant residue: elements of the Moral Equality of Combatants thesis that have no counterpart in narrative vocabulary.

  **1. The Normative Gap (Permission vs. Representation)**
  The most critical residue is the concept of *moral permission*. Narrative vocabulary is descriptive and expressive; it deals in what *is* shown, felt, and structured. Philosophical just-war theory is normative; it deals in what *may* be done.
  *   **Analysis:** "Focalization parity" ensures the reader *sees* the enemy soldier's humanity. It does not establish that the enemy soldier *has a right* to shoot the protagonist. You can have focalization parity (I know your fear) without moral equality (I still believe you are murdering me). Conversely, you can have moral equality (we are both authorized killers) without focalization parity (you are a faceless drone to me).
  *   **Result:** The intuition that moral equality is "focalization parity applied to ethics" is **mistaken**. Focalization parity is an aesthetic strategy to generate sympathy or complexity; MEC is a legal-moral claim about liability and rights. Conflating them confuses *explaining* violence with *justifying* it.

  **2. The *Jus Ad Bellum* / *Jus In Bello* Separation vs. Thematic Unity**
  You asked whether the separation between the justice of the war and the justice of individual acts can be rendered as "plot-level moral framing" versus "character-level permissions."
  *   **Analysis:** In narrative craft, plot and character are mutually constitutive. The "plot-level framing" (e.g., "This invasion was wrongful") inevitably colors the "character-level agency" (e.g., "This soldier firing a rifle"). In a novel, if the cause is unjust, the soldier's acts are typically rendered as tragic, futile, or complicit. The narrative structure naturally bleeds the *ad bellum* judgment into the *in bello* action to create thematic coherence.
  *   **Result:** The philosophical thesis requires a hermetic seal between the cause and the act. Narrative craft relies on the porosity between cause and act to generate meaning. To force the narrative to respect the separation would require a level of authorial detachment that risks aesthetic failure (e.g., making the war seem morally irrelevant to the fighting).
  *   **Diegetic Culpability Separation:** This concept captures the *effect* of MEC (the reader suspends judgment on the soldier) but not the *mechanism*. It dresses up an ambiguity: is the soldier innocent because the narrative says so, or because the philosophy says so? In narrative, it is always because the narrative says so.

  **3. Deficiency vs. Ambiguity**
  Does this residue reveal a deficiency in narrative vocabulary or an ambiguity in the philosophical thesis?
  *   **Narrative Deficiency:** Literature lacks the technical machinery to encode *normative rights* distinct from *thematic meaning*. It can depict soldiers *believing* they are equals, or laws *stating* they are equals, but it cannot structurally enforce moral equality without relying on the reader's external philosophical knowledge.
  *   **Philosophical Ambiguity:** One could argue that if narrative (which models human moral experience) cannot hold the separation without collapse, the separation itself is counter-intuitive. However, the philosophical thesis is designed precisely to override intuition (which usually says unjust killers are murderers).
  *   **Conclusion:** The residue points to a limitation in the *medium* of narrative. Narrative is a machine for making meaning through connection; MEC is a shield against making meaning through connection.

  ### Final Assessment of Your Intuition

  Your intuition that moral equality is "just focalization parity applied to ethics" misses the point in a specific way: it confuses **epistemic access** with **moral status**.
  *   **Focalization Parity** gives the reader knowledge of the enemy's interiority (Epistemic).
  *   **Moral Equality** gives the enemy a right to kill you despite their unjust cause (Normative).
  You can grant a character full focalization (making them sympathetic) while maintaining they are morally liable to be stopped (e.g., a sympathetic villain). You can also grant moral equality (in a dry report) without any focalization. The narrative tool manages empathy; the philosophical thesis manages liability.

  Verdict: The untranslatable residue points to a gap in narrative craft \answer{because literary representation lacks the normative machinery to separate thematic condemnation from individual agency without collapsing into moral ambiguity}
