  ok so me and jake just spent like two hours arguing about self-deception and whether its even a real phenomonon, and i'm still kinda stuck on it. he kept saying its logically incoherent—if you know the truth, you cant simultaneously hide it from yourself, so anyone who 'self-deceives' is just being irrational or lying to other people. but that feels wrong? like, people clearly avoid bad news about themselves in ways that dont feel like regular lying.

  so heres what i want: make the argument that self-deception is not just possible but actually only makes sense if we reject the idea of a unified self and instead think of the mind as a kind of coalition or committee, where different parts can withhold information from each other without the whole system being literally contradictory. defend the position that this compartmentalization is structural, not just a metaphor, and explain how it solves the classic paradox (how can one agent believe p and not-p?). also address whether this means self-deception is basically interpersonal deception turned inward, or if that analogy breaks down somewhere important. dont just list philosophers—work the reasoning out. and please, no reading lists, i dont have access to a library right now and jake already tried to make me read like five papers.
