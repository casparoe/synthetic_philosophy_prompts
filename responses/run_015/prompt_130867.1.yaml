  # JOINT STATEMENT ON MULTIPLE REALIZABILITY AND THE AUTONOMY OF PSYCHOLOGY

  **Signed:** [The Functionalist] & [The Neuroscience-First Critic]

  Following a period of adversarial collaboration, we submit this statement to clarify the points of agreement, the precise nature of our remaining disagreements, and the empirical or theoretical findings that would resolve them. We aim to move beyond rhetorical stalemates regarding the relationship between psychological and physical sciences.

  ### I. Agreed Claims

  1.  **Multiple Realizability is Necessary but Not Sufficient for Autonomy.**
      Both parties agree that the mere existence of diverse physical realizers for a psychological state does not automatically secure the autonomy or irreducibility of psychology. For MR to support antireductionism, the diversity must be such that no unified physical explanation can capture the causal generalizations of the higher-level science without loss of explanatory power.

  2.  **Criterion for Individuating Realizations.**
      We adopt the following working criterion for distinguishing realizations: A difference in the physical base counts as a difference in realization *only if* swapping in the alternative base would change the causal profile that the higher-level science assigns to the state. If two physically distinct substrates support identical causal powers relative to psychological laws, they count as instances of the same realization type for the purposes of this debate.

  3.  **The Shrinking Dynamic.**
      We agree that there is a dynamic relationship between the granularity of psychological description and the diversity of physical realizers. As the higher-level description is made finer-grained (e.g., moving from "belief" to "occurrent belief that p under conditions C"), the set of compatible physical realizers shrinks. Coarse-grained taxonomies permit wider physical diversity; fine-grained taxonomies permit less.

  4.  **Limits of the Shrinking Dynamic.**
      We agree that the central dispute concerns the limit of this shrinking dynamic. We acknowledge the Functionalist's suspicion that the set of realizers will asymptote at a genuinely heterogeneous, disjunctive base (e.g., neural, silicon, exotic matter) even at high granularity. We simultaneously acknowledge the Critic's suspicion that the shrinking will continue until the class of *multiple* realizers is empty (either because only one physical kind remains or because the psychological kind dissolves under scrutiny).

  5.  **Empirical Decidability.**
      Both parties agree that this dispute is not purely conceptual. While philosophical analysis clarifies the definitions, the ultimate resolution depends on empirical findings in comparative neuroanatomy, artificial intelligence, and psychophysics.

  ### II. Residual Disagreements

  | Issue | Functionalist Formulation | Neuroscience-First Critic Formulation |
  | :--- | :--- | :--- |
  | **The Limit of Realizer Diversity** | Even at maximal psychological granularity, the physical base will remain a heterogeneous disjunction of distinct natural kinds (e.g., biological, synthetic, alien) that share no unified physical explanation. | As psychological taxonomy aligns with causal mechanisms, the apparent diversity of realizers will converge onto a single, unified neurobiological natural kind, rendering the "multiple" realization class empty of genuine alternatives. |
  | **Direction of Explanation** | Psychological laws explain *why* such physically diverse systems behave similarly; the physical details are irrelevant to the generalization so long as the functional organization is preserved. | Physical laws explain *why* the psychological generalization holds; the psychological pattern is a shadow of underlying physical constraints and will break down where physical implementations diverge. |
  | **Status of Psychological Kinds** | Psychological kinds are genuine natural kinds defined by their causal role, independent of the material that fills that role. | Psychological kinds are heuristic clusters that approximate underlying neurobiological kinds; they are useful but not ontologically fundamental. |

  ### III. Cruxes and Predictive Findings

  We identify three concrete areas where future findings would bear directly on our disagreement. We record our divergent predictions below.

  | Crux | Concrete Case / Hypothetical Finding | Functionalist Prediction | Critic Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Silicon Threshold** | Development of a non-biological system (e.g., advanced silicon-based architecture) that passes all behavioral and functional tests for a specific psychological state (e.g., episodic memory) without simulating biological neurochemistry. | **Confirmed MR.** The system instantiates the genuine psychological state. This proves the psychological kind is detachable from the biological base, supporting asymptotic disjunction. | **Simulation Only.** The system mimics the output but lacks the genuine state. True psychological states are constituted by specific biological mechanisms; thus, the class of realizers for the *genuine* state remains biologically unitary. |
  | **2. Comparative Neuroanatomy** | Discovery of a distant taxon (e.g., cephalopods) solving complex cognitive problems using neural structures that are anatomically non-homologous to vertebrates but functionally isomorphic. | **Confirmed MR.** Analogous structures suffice for identical psychological kinds. This demonstrates that physical homology is not required for psychological identity, supporting autonomy. | **Hidden Homology or Difference.** Either deep molecular homology will be found despite anatomical difference, or the cognitive processes will be shown to be fundamentally different upon fine-grained analysis, preserving the link between specific physical kinds and specific psychological kinds. |
  | **3. The Granularity Ceiling** | A psychophysical study attempts to refine the taxonomy of a state (e.g., "pain") until every distinct physical realization requires a distinct psychological label. | **Failure.** There will remain a level of refinement where physically distinct systems (e.g., human C-fibers vs. alternative substrate) still share the same psychological label and causal profile. | **Success.** At sufficient granularity, every distinct physical mechanism will correspond to a distinct psychological state description, eliminating the many-to-one mapping and dissolving the MR argument. |

  ### IV. Note on Verbal vs. Substantive Dispute

  We acknowledge that a portion of our historical disagreement has been verbal rather than substantive, specifically regarding the definition of **"reduction."**

  *   **The Verbal Component:** When the Critic speaks of "reduction," they often imply *identity* or *type-identity* between psychological and physical states. When the Functionalist speaks of "irreducibility," they often imply *explanatory autonomy* rather than ontological distinctness. If "reduction" simply means "there exists a physical cause for every psychological event," both sides agree reduction holds. If "reduction" means "psychological laws are derivable from physical laws without remainder," both sides agree this is the point of contention.
  *   **The Substantive Component:** However, the dispute is not merely verbal. The disagreement over the **Limit of Realizer Diversity** (Section II, Row 1) is substantive. It turns on whether the universe permits functionally equivalent states to be instantiated by physically heterogeneous substrates that share no lower-level natural kind. This is an empirical question about the structure of nature, not merely a choice of terminology. Our collaboration confirms that while we may define our terms differently, we are genuinely disagreeing about the architecture of the mind-world relationship.
