  ### Brainstorming Notes

  *   **Agreement on Logic:** Both sides must agree that Multiple Realizability (MR) alone doesn't guarantee autonomy; it must block reduction *in principle*, not just make it messy.
  *   **Individuation Criterion:** We need to explicitly embed the prompt's "swap test": physical differences only count as different realizations if swapping them changes the higher-level causal profile.
  *   **The Shrinking Dynamic:** Both agree that making psychological descriptions finer (e.g., "sharp pain" vs. "pain") reduces the range of physical realizers. This is non-negotiable.
  *   **The Limit Disagreement:** Functionalist thinks shrinking stops at a disjunctive set (neurons, silicon, alien goo). Critic thinks shrinking continues until the "multiple" part vanishes (only one physical kind remains) or the psychological kind dissolves.
  *   **Explanatory Direction:** Functionalist says psychological laws explain why the disjunction works. Critic says physical laws explain why the psychological generalization holds (until it breaks).
  *   **Crux 1 (AI):** Can non-biological systems instantiate genuine states? Functionalist says yes; Critic says no (simulation).
  *   **Crux 2 (Comparative):** Do distant species use homologous or analogous structures? Functionalist says analogous is enough; Critic says homology reveals the real kind.
  *   **Verbal Dispute:** Much fighting is over the word "reduction." Is it identity? Derivation? We need to isolate this from the empirical claims.

