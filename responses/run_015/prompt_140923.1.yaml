  # Diagnostic Instrument: The Practical Reasons Decision Tree

  **Instructions:** Start at **Question 1**. Answer 'Yes' or 'No' based on your intuition about the case described. Follow the arrow to the next question or to a final position. Do not worry about technical terms; they appear only in the final results.

  ### The Decision Tree

  **1. The Thoroughgoing Egoist (Case 6)**
  *Case:* Imagine a person who understands a moral demand (e.g., "save this drowning child") but has absolutely no motivation to do it, and would not gain any motivation even after thinking perfectly clearly for a year.
  *Question:* Does this person still have a **reason** to save the child, even though nothing can move them?
  *   **No** (Reasons require a link to motivation) → Go to **Question 2**.
  *   **Yes** (Reasons exist independently of motivation) → Go to **Question 6**.

  ---

  #### **INTERNALIST WING** (Reasons require a motivational link)

  **2. The Artificial Route (Case 2)**
  *Case:* Imagine a person who would only be motivated to save the child if they were hypnotised, drugged, or told a comforting lie.
  *Question:* Do we say they have a **reason** to save the child if the only way to motivate them is non-rational manipulation?
  *   **Yes** → **LEAF A: Loose Humeanism**
  *   **No** (The route to motivation must be rational) → Go to **Question 3**.

  **3. The Ignorant Agent (Case 3)**
  *Case:* Imagine a person who would be motivated to save the child if they knew a true fact they currently lack (e.g., "the child is your nephew").
  *Question:* Do they have a **reason** to save the child now, based on facts they do not yet know?
  *   **No** (Reasons depend on actual, present desires) → **LEAF B: Current Desire View**
  *   **Yes** (Reasons depend on what they would want if informed) → Go to **Question 4**.

  **4. Marla's Future (Case 1)**
  *Case:* Marla cares nothing about her future self beyond next Tuesday. She has no desire to save money for her future retirement.
  *Question:* Does Marla have a **reason** to save money for her future self, simply because she is the same person?
  *   **No** (Reasons are bound by current temporal concerns) → **LEAF C: Presentist Internalism**
  *   **Yes** (Reasons extend to the future self via deliberation) → Go to **Question 5**.

  **5. The Kitten Hurter (Case 4)**
  *Case:* Imagine a person who, after perfect reflection and knowing all true facts, still desires to hurt kittens for fun.
  *Question:* Does this person have a **reason** to hurt the kittens?
  *   **Yes** (If the desire survives reflection, it generates a reason) → **LEAF D: Williams-Style Internalism**
  *   **No** (Some desires are substantively irrational, regardless of reflection) → **LEAF E: Ideal Advisor View**

  ---

  #### **EXTERNALIST WING** (Reasons exist independently of motivation)

  **6. The Bare Capacity (Case 7)**
  *Case:* Imagine an agent who has no desire to be moral but has the bare human capacity to feel guilt or recognise themselves as an agent.
  *Question:* Is this bare capacity alone enough to give them a **reason** to be moral?
  *   **Yes** (Reasons come from the conditions of being an agent) → **LEAF F: Constitutivism**
  *   **No** (Reasons come from outside the agent's psychology entirely) → Go to **Question 7**.

  **7. The Bluff (Case 6 Revisited)**
  *Case:* When we tell the Thoroughgoing Egoist (from Question 1) that they have a reason to be moral, knowing they will never care.
  *Question:* Are we speaking falsely (or merely giving advice/bluffing) rather than stating a fact?
  *   **Yes** (There are no objective reasons; it is a sham) → **LEAF G: Error Theory**
  *   **No** (It is a true fact that they have a reason) → Go to **Question 8**.

  **8. The Kitten Hurter (Case 4 Revisited)**
  *Case:* The person who wants to hurt kittens (from Question 5).
  *Question:* Do they lack a reason to hurt kittens because the act is **objectively bad**, regardless of their agency?
  *   **No** (Reasons exist but require the capacity to respond to them) → **LEAF H: Hybrid Externalism**
  *   **Yes** (Value alone creates the reason) → Go to **Question 9**.

  **9. The Revenge Conflict (Case 5)**
  *Case:* An agent is torn between a desire for revenge and a desire to be forgiving.
  *Question:* Is the reason to forgive determined by the **value of forgiveness** or by the **requirements of rationality**?
  *   **Rationality** (It is irrational to be vengeful) → **LEAF I: Rationalist Externalism**
  *   **Value** (Forgiveness is objectively good) → **LEAF J: Value-Based Externalism**

  ---

  ### Key to Positions (The Leaves)

  *   **LEAF A: Loose Humeanism.** Reasons are just whatever causes action. No filter for truth or rationality. If a drug gives you a motive, you have a reason.
  *   **LEAF B: Current Desire View.** Reasons are strictly limited to what you actually want right now. Ignorance protects you from reasons.
  *   **LEAF C: Presentist Internalism.** You have reasons only regarding the time-period you care about. Future selves are strangers.
  *   **LEAF D: Williams-Style Internalism.** Reasons require a "sound deliberative route" from your current motivations. If you can get there by thinking clearly, you have a reason, even if you don't know it yet.
  *   **LEAF E: Ideal Advisor View.** Reasons are what you would want if you were fully informed and rational. Some desires (like kitten-hurting) are ruled out as irrational.
  *   **LEAF F: Constitutivism.** Reasons come from what you *are*. If you are an agent, you are bound by the rules of agency (like feeling guilt), whether you want to be or not.
  *   **LEAF G: Error Theory.** Talk of "objective reasons" is false. We are bluffing the egoist to make them behave.
  *   **LEAF H: Hybrid Externalism.** Reasons exist objectively, but they only *bind* agents who have the capacity to recognise them.
  *   **LEAF I: Rationalist Externalism.** Reasons are requirements of rationality (like logic) that apply to all thinkers, independent of value.
  *   **LEAF J: Value-Based Externalism.** Reasons are facts about objective value (goodness/badness). They apply regardless of your psychology or rationality.

  ---

  ### Unoccupied Logical Space
  *Combinations of answers that the tree allows, but no major philosophical position occupies.*

  1.  **Yes to Q1 (Externalist) + Yes to Q7 (Bluff).**
      *   *Diagnosis:* **Incoherent.** You cannot claim reasons exist independently of motivation (Q1) but also claim stating them is a lie (Q7). This collapses into Error Theory.
  2.  **No to Q2 (No Hypnosis) + No to Q3 (No New Facts).**
      *   *Diagnosis:* **Unattractive.** This implies a reason exists only if you are already motivated and fully informed. It leaves no room for deliberation or correction, making the concept of a "reason" useless for guidance.
  3.  **Yes to Q6 (Agency Capacity) + Yes to Q5 (Kitten Reasons).**
      *   *Diagnosis:* **Unoccupied.** Constitutivists (Q6) usually argue agency entails moral constraints. A view that says "agency gives you reasons" but "hurting kittens is fine" is theoretically possible but nobody defends it.
  4.  **No to Q1 (Internalist) + Yes to Q8 (Objective Value).**
      *   *Diagnosis:* **Incoherent.** You cannot deny reasons exist without motivation (Q1) but then claim reasons come from objective value regardless of the agent (Q8).

  ---

  ### Instrument Limitations
  *Where this diagnostic tree cannot distinguish between positions.*

  1.  **Williams-Style Internalism (Leaf D) vs. Ideal Advisor (Leaf E).**
      *   *Limitation:* In practice, these often yield the same advice. The tree separates them on the "Kitten Case," but some Williams-supporters might argue a sound deliberative route *would* eliminate kitten-hurting, blurring the line with the Ideal Advisor.
  2.  **Constitutivism (Leaf F) vs. Rationalist Externalism (Leaf I).**
      *   *Limitation:* Both ground reasons in rationality/agency rather than value. The tree separates them by whether the source is "conditions of agency" (F) or "requirements of rationality" (I), but these are often metaphysically similar.
  3.  **Hybrid Externalism (Leaf H) vs. Value-Based Externalism (Leaf J).**
      *   *Limitation:* Both agree reasons exist objectively. The split relies on whether the agent's *capacity* matters for the reason to bind. In many concrete cases, the practical output is identical.
  4.  **Current Desire (Leaf B) vs. Presentist Internalism (Leaf C).**
      *   *Limitation:* Both restrict reasons to the present. The tree separates them on "New Facts" vs "Future Self," but a philosopher could hold one without the other, or both together, making the distinction fine-grained for a first-year.
