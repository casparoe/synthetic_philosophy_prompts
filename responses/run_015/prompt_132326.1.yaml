      *   **The Tension:**
          *   *Side A (Closure Holds):* If I know the filter is reliable ($P$) and I know the filter shows $X$ only if $X$ is true ($P \rightarrow Q$), then I know $X$ ($Q$).
          *   *Side B (Closure Fails/Tracking Breaks):* Nozick's sensitivity condition requires that in the nearest possible world where $X$ is false, I don't believe $X$. If the filter is opaque/random, would it still show $X$ even if $X$ were false? If the filter's logic isn't tied to truth in a sensitive way, tracking fails.

