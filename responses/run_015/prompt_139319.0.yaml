answer: |-
  ### Stage 1: Brainstorming Candidate Concepts

  A specialist hearing your description would immediately reach for concepts from four distinct literatures. Here are the strongest candidates:

  1.  **Subsidiarity (Procedural vs. Substantive):** In the EU (Art. 5 TEU), Germany (Art. 72 GG), and Switzerland (Art. 43a Cst.), subsidiarity is the governing principle. The literature distinguishes between *negative subsidiarity* (the center must not act if the periphery can) and *positive subsidiarity* (the center must act if the periphery cannot). Your description suggests a failure in the *assessment* of "sufficiently achieved."
  2.  **Administrative Capacity / State Capacity:** From public administration and development economics. This focuses on the resources, expertise, and institutional memory required to implement policy. It explains *why* Unit B copies Unit A, but it is usually treated as a sociological variable, not a constitutional category.
  3.  **The Joint-Decision Trap (*Politikverflechtungsfalle*):** Fritz Scharpf's classic theory of German and EU federalism. It argues that interlocking decision-making leads to gridlock and lowest-common-denominator outcomes. It addresses Instance (2) but focuses on veto points and status quo bias, not capacity-driven surrender.
  4.  **Asymmetric Federalism:** This describes systems where different subnational units have different formal powers (e.g., Quebec in Canada, Jammu & Kashmir historically in India). It captures the *outcome* (unequal autonomy) but contradicts your premise that the powers are *formally identical*.
  5.  **Isomorphic Mimicry:** From development literature (Pritchett, Woolcock). It describes organizations that look like functioning states (have laws, ministries) but function differently. This fits Instance (1) perfectly (copying statutes) but lacks the intergovernmental negotiation dimension of Instances (2) and (3).

  ### Stage 2: Testing Candidates Against the Instances

  **1. Subsidiarity**
  *   **Fits:** It is the explicit rule in the EU, Germany, and Switzerland that triggers the allocation of power. Your observation that the "cannot be sufficiently achieved" test is applied unevenly is a critique of subsidiarity monitoring.
  *   **Strains:** Subsidiarity theory assumes a binary switch: either the member state *can* do it, or it *cannot*. It does not account for a spectrum where the member state *can* do it legally but *cannot* sustain it bureaucratically without copying the center or a neighbor. It treats capacity as a given, not a variable that alters the constitutional balance. Furthermore, in Germany, the Federal Constitutional Court (*Bundesverfassungsgericht*) has been highly deferential on the "necessity" test since the 2006 Federalism Reform; it rarely strikes down laws for violating Art. 72 II GG unless the federal justification is wholly absent. Your impression that the Court "polices that showing" is legally optimistic; politically, the *Bundesrat* (Federal Council) does the policing, which leads to Instance (2).

  **2. Administrative Capacity**
  *   **Fits:** It explains the mechanism in all three instances. Unit B has low capacity, so it copies (1), relies on summaries (2), or declines opt-ins (3).
  *   **Strains:** "Capacity" is a resource, not a constitutional status. Calling this a "capacity problem" implies it can be fixed by training or money. Your observation that equalization transfers do not touch it suggests the deficit is structural or institutional (e.g., scale, expertise retention), not merely fiscal. Using this term hides the *constitutional* consequence: the erosion of the federal bargain.

  **3. The Joint-Decision Trap**
  *   **Fits:** Instance (2) describes the exact dynamics of the *Politikverflechtung*: joint bodies, complex impact assessments, vote trading for transition periods.
  *   **Strains:** Scharpf's trap predicts *gridlock* (nothing changes). Your instances describe *change*—specifically, a ratcheting of power to the center or to high-capacity units, and a surrender by low-capacity units. The low-capacity unit is not using its veto to block; it is trading its veto because it lacks the information to use it. This is not a trap of too many veto players; it is a trap of *unequal agency*.

  **4. Asymmetric Federalism**
  *   **Fits:** The outcome is effectively asymmetric. Unit A acts like a sovereign state; Unit B acts like a province.
  *   **Strains:** Asymmetric federalism is *de jure*. It is written into the constitution that Unit A has powers Unit B lacks. Your case is *de facto*. The comparative tables show symmetry; the reality shows asymmetry. This makes it invisible to legal review but potent in practice.

  **5. Isomorphic Mimicry**
  *   **Fits:** Instance (1) is textbook isomorphism: Unit B adopts Unit A's law to *look* like it is legislating, without the underlying analytical capacity.
  *   **Strains:** This term is used for developing states mimicking Western institutions to gain legitimacy. Applying it to German *Länder* or Swiss Cantons is analytically jarring. It also misses the financial and negotiation aspects of Instances (2) and (3).

  ### Stage 3: Verdict and Coinage

  **Verdict:** None of the established concepts capture the specific constitutional pathology you are describing. "Subsidiarity" is the rule being bypassed; "Capacity" is the cause; "Asymmetry" is the result. But there is no term for the *structural decoupling of formal authority from functional agency* within a system predicated on uniform membership.

  **Institutional Corrections:**
  *   **Germany:** The Federal Constitutional Court does not strictly police the "necessity" showing in the way you describe. Since the 2006 Reform, Art. 72 II GG requires a federal need, but the Court grants the legislature a wide "margin of prognosis." The real check is political (the *Bundesrat*), which leads to the capacity-driven bargaining you see in Instance (2).
  *   **Switzerland:** The subsidiarity principle is codified in Art. 43a of the Federal Constitution (2004), but like Germany, it is primarily a political guideline for the *Ständerat* (Council of States), not a justiciable strict limit.
  *   **US:** You are correct; there is no general subsidiarity clause. The "spending power" (Hamiltonian view) and anti-commandeering doctrine (*Printz v. United States*) are the functional equivalents, but they lack the "necessity test" threshold of the European systems.

  **The Coinage:**

  **Term:** **Operative Competence Asymmetry (OCA)**

  **Definition:** A structural condition in multilevel governance where formally uniform legal competences yield divergent degrees of actual autonomy due to unequal subnational administrative capacity, resulting in a de facto hierarchy masked by de jure equality.

  **Boundary Cases:**
  *   **Inside the Boundary (OCA):** A small German *Land* (e.g., Bremen) and a large one (e.g., Bavaria) both have the formal right to legislate on culture. Bavaria drafts original laws; Bremen adopts Bavaria's text verbatim. Both are recorded as "exercising competence," but only Bavaria exercises *will*.
  *   **Outside the Boundary (Asymmetric Federalism):** Quebec has formal powers over immigration that other Canadian provinces do not possess. This is *de jure* asymmetry, not OCA, because the legal text itself differentiates the units.

  **Usage Warning:** Do **not** use this term to describe simple budget shortfalls or temporary staffing issues. OCA refers to a persistent, structural inability to originate, defend, or negotiate policy, which effectively transfers sovereignty to the center or to high-capacity peers without a formal amendment.

  ### Analysis of the Configuration

  **1. Is this a defect in the allocation principle or its application?**
  It is a defect in the **ontological assumption of the allocation principle**. Principles like Subsidiarity assume that "competence" is a binary switch (you have it or you don't) and that "capacity" is a separate, manageable resource. Your observation proves that in modern regulatory states, *competence is constitutive of capacity*. You cannot separate the right to legislate from the ability to draft, defend, and monitor legislation. When the constitution grants uniform competence to units of vastly different scale/complexity, it creates a "competence illusion." The defect is not that the test is applied wrongly, but that the test ("can they do it?") ignores the *sustainability* of the action.

  **2. Why do the remedies make it worse?**
  *   **Transfers:** As you noted, high-capacity units can "buy" their way out (e.g., by co-financing projects to retain control), while low-capacity units take the money and lose the policy leverage. This widens the OCA.
  *   **Centrally Supervised Capacity Building:** If the center trains the periphery, the periphery adopts the center's methods, metrics, and priorities. This creates administrative homogenization, which is a soft form of centralization. It solves the capacity gap by eroding the diversity the federalism was meant to protect.
  *   **Petitioning the Center:** Requiring a unit to ask for "trust" or "return of power" (Instance 3) stigmatizes the unit. It turns autonomy into a reward for good behavior (or high capacity) rather than a right. This inverts the federal principle: instead of the center having limited powers, the periphery has conditional powers.

  **3. Is this specific to multilevel constitutional systems?**
  No. The structure appears wherever **formal agency is granted uniformly to actors of unequal capability.**
  *   **Corporate Governance:** A holding company grants identical investment mandates to regional subsidiaries. The large subsidiaries invest actively; the small ones simply copy the holding company's model portfolio.
  *   **International Law:** Sovereign equality in the UN. Every state has one vote and identical sovereignty. In practice, small states lack the diplomatic capacity to staff committees, so they rely on blocs or great powers to draft resolutions they sign.
  *   **Devolution within Unitary States:** E.g., the UK city deals. Larger cities (Manchester) negotiate complex deals; smaller ones accept standard templates.

  **Conclusion:**
  You are observing **Operative Competence Asymmetry**. It is more dangerous than formal asymmetry because it is invisible to the constitutional court and unaddressed by fiscal equalization. It creates a "two-tier federation" without admitting it: Tier 1 units (High Capacity) act as true partners; Tier 2 units (Low Capacity) act as administrative outposts. The "ratchet" moves upward for Tier 2 (they lose power) and stays stable for Tier 1 (they keep power), fracturing the political unity of the subnational level. The remedy is not more money, but perhaps **differentiated competence**: acknowledging formally that some units *should* hold framework powers while others hold implementation powers, rather than pretending all hold the same power and watching the weak ones surrender it in practice.
