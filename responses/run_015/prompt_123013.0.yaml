answer: |-
  You are correct to suspect that your tentative principle conflates two distinct questions. Your intuitions are stable because you are implicitly tracking both, but they clash when you try to write them as a single rule. The first question is **Ontological Salience** (does this digital thing count as *mine* in a way that matters?). The second is **Normative Violation** (did this act cross a line that we agreed not to cross?).

  Case (8) (rollback) and Case (10) (ToS) prove that *Salience* does not depend on permanent loss or legal ownership. Case (1) and Case (2) prove that *Wrongfulness* does not depend on the object's salience alone, but on the context of the act.

  Here is the refined framework that achieves reflective equilibrium with your verdicts, followed by the necessary adjustments and predictions.

  ### The Normatively-Protected Agency Principle

  This principle treats virtual objects not as property, but as **externalized will**. You are not protecting the pixels; you are protecting the player's capacity to project their intentions into the shared world.

  **Clause 1: The Extension Clause (Salience)**
  > A virtual entity is morally salient (i.e., "real") to the extent that it functions as an anchor for a player's ongoing autonomous project, regardless of its material persistence or legal title.
  > *   **Motivating Cases:** (1) Cathedral (project anchor), (6) Companion (relationship anchor), (9) Unrendered Castle (intent anchor), (10) ToS irrelevance (legal title does not negate agency).
  > *   **Accommodates:** Your intuition that the unrendered castle is owned and the ToS is irrelevant. It grounds "realness" in human effort, not code or contracts.

  **Clause 2: The Integrity Clause (Harm)**
  > Harm occurs when an agent's capacity to interact with their anchored project is frustrated, interrupted, or altered without consent, even if the original state is subsequently restored.
  > *   **Motivating Cases:** (8) Rollback (restoration does not erase the interruption), (11) Shutdown (diminished future utility reduces but does not erase salience), (5) VR Gesture (violation of bodily autonomy/experience).
  > *   **Accommodates:** Your verdict that restoration (8) does not absolve the wrong. It identifies the harm as the *disruption of experience*, not just the *loss of assets*.

  **Clause 3: The Expectation Clause (Wrongfulness)**
  > An act is wrongful only if it violates the normative expectations established by the specific context (server rules, regional flags, or social norms) in which the interaction occurs.
  > *   **Motivating Cases:** (1) vs (2) Raid zones (context defines the rule), (7) Currency (context defines the value/norm), (4) Cross-server copy (no shared normative framework).
  > *   **Accommodates:** Your distinction between raiding in a safe zone (wrong) vs. a war zone (not wrong). It explains why copying to another server (4) is irritating but not a violation of *this* server's social contract.

  **Clause 4: The Control Clause (Severity)**
  > The severity of the wrong is proportional to the degree of exclusive control denied to the owner, rather than the uniqueness of the item or its market value.
  > *   **Motivating Cases:** (3) Theft vs. Duplication (Theft denies control; Duplication denies uniqueness), (7) RMT vs. Non-RMT (Control is the constant; market value is the variable).
  > *   **Accommodates:** Your intuition that theft is worse than duplication. You still have the pickaxe in the duplication scenario; you retain control. In theft, you lose agency.

  ---

  ### Friction Points: Where You Should Overturn Your Verdicts

  To make this principle work without contradiction, you must adjust two of your intuitions.

  **1. Case (7): The Currency Distinction**
  *   **Your Verdict:** Theft with RMT feels like theft; theft without RMT feels ambiguous.
  *   **Principle Prediction:** Both are equally wrongful.
  *   **Recommendation:** **Overturn your uncertainty.** Under the *Extension Clause*, the currency represents time and effort (agency). Under the *Control Clause*, taking it denies you the fruit of that labor. The existence of a real-money market changes the *legal* recourse, not the *moral* wrong. If you ban for one, you must ban for the other, or your policy is arbitrary. The "harm" is the loss of the hours worked to earn it, not the dollars you could get for it.

  **2. Case (3): Duplication Nuance**
  *   **Your Verdict:** Duplication is "mildly annoying."
  *   **Principle Prediction:** Duplication is a significant wrong if the server culture values scarcity.
  *   **Recommendation:** **Refine, don't overturn.** If your server culture treats unique items as status markers (a "practice in which others treat claims on it as valid"), duplication destroys the *social* utility of the item even if it keeps the *functional* utility. It is less severe than theft (loss of control), but it is not merely "annoying." It is a violation of the *Expectation Clause* regarding scarcity. Treat it as a serious infraction, just not as severe as theft.

  ---

  ### Predictions for Unlisted Cases

  Here is how the **Normatively-Protected Agency Principle** adjudicates the new scenarios you proposed.

  **1. The Abandoned Item**
  *   *Scenario:* An item the owner privately decided to abandon but has not deleted.
  *   *Prediction:* **No Wrong.**
  *   *Reasoning:* Under the *Extension Clause*, salience requires an "ongoing autonomous project." If the owner has internally abandoned the project, the object is no longer an anchor for their agency. The private nature of the decision is irrelevant; if they have ceased interacting with it as part of a project, it has reverted to background noise. Griefing it is vandalism of a prop, not harm to a player.

  **2. The AI Companion**
  *   *Scenario:* A companion creature with generative dialogue that remembers past conversations.
  *   *Prediction:* **Real Harm (Equivalent to Case 6).**
  *   *Reasoning:* The *Extension Clause* focuses on the player's investment, not the code's complexity. If the player has spent weeks building a relationship (project), the creature is an anchor for their agency. The fact that the memory is generated on the fly makes the loss *more* irreversible (you cannot reload a script), increasing the severity under the *Integrity Clause*.

  **3. Unnoticed Griefing**
  *   *Scenario:* B burns A's house, but A never logs on to see it.
  *   *Prediction:* **A Wrong Occurred, but Priority is Low.**
  *   *Reasoning:* Under the *Integrity Clause*, the harm is the frustration of agency. A's ability to interact with their project was thwarted (the house is gone), even if they didn't feel distress. It is like vandalizing a house while the owner is on vacation. However, for *ban policy*, this is tricky. Since the *Experience of Harm* is absent, A cannot advocate for themselves.
  *   *Admin Action:* If you find out, you still ban B. The wrong is against the *order of the server* (Expectation Clause), not just A's feelings. But if no one reports it, it is not a priority for investigation.

  **4. The Paid Contractor**
  *   *Scenario:* A griefer turns out to be paid by the operator to make the world eventful.
  *   *Prediction:* **Severe Wrong (Deception + Harm).**
  *   *Reasoning:* This violates the *Expectation Clause* doubly. First, if players believe they are in a survival world (Case 1 norms), the contractor violated the safe-zone expectation. Second, the operator violated the trust of the community by introducing an asymmetric threat without consent.
  *   *Admin Action:* This is grounds for removing the contractor and potentially refunding/restoring victims. It turns a "player conflict" into "admin abuse."

  ---

  ### The Distinct Questions: Where the Line Falls

  You asked where the line between the genuinely distinct questions falls. Your suspicion was correct: you are trying to solve **Metaphysics** (is it real?) and **Ethics** (was it wrong?) with one rule.

  **Question 1: Moral Salience (The "Is It Real?" Question)**
  *   **The Test:** Does this object/avatar serve as a vessel for human intention and investment?
  *   **The Line:** Drawn at **Investment**.
  *   **Applies to:** Cases (1), (5), (6), (9), (11).
  *   **Why:** This determines *who gets a voice*. If there is no investment (a random cobblestone block on the ground), no one has standing to complain. If there is investment (the cathedral), the player has standing.
  *   **Your Verdict Check:** This validates your feeling that the unrendered castle (9) is real. It exists as a plan in a mind, externalized in the database.

  **Question 2: Normative Violation (The "Was It Wrong?" Question)**
  *   **The Test:** Did the act violate the agreed-upon rules of engagement for this specific context?
  *   **The Line:** Drawn at **Expectation**.
  *   **Applies to:** Cases (1) vs (2), (4), (7), (10).
  *   **Why:** This determines *the outcome of the complaint*. A player can have standing (Salience) but still lose the case if they built in a raid zone (Expectation).
  *   **Your Verdict Check:** This validates your feeling that the ToS (10) doesn't matter. The "agreed-upon rules" are the server culture and explicit region flags, not the corporate EULA.

  **How to use this for your Ban Policy:**
  When a report comes in, ask two questions in order:
  1.  **Salience:** "Did the victim invest meaningful time/agency into this?" (If No: Ignore report).
  2.  **Expectation:** "Did the accused violate the norms of this specific region/context?" (If No: No ban, even if Salience is high).

  If both are Yes, you ban. This separates the "crybaby" claims (low salience) from the "rules lawyer" claims (high salience, but assumed risk), resolving the argument among your friends.
