answer: |-
  # JOINT STATEMENT ON RESPONSIBILITY, LUCK, AND SUFFERING

  **Signed:**
  *The Dennettian Compatibilist*
  *The Carusonian Free Will Skeptic*

  **Date:** October 26, 2023

  ### I. AGREED CLAIMS

  After extensive dialogue regarding the metaphysics of agency and the ethics of punishment, we affirm the following propositions as common ground. We offer these not as a resolution of our differences, but as a foundation upon which those differences rest.

  1.  **Causation and Explanation:** We agree that the truth of determinism (or the functional equivalent of constitutive and early environmental luck) does not render human behavior random, unpredictable, or inexplicable. Causal determination is compatible with the reliability of psychological explanation and the possibility of rational prediction.
  2.  **The Impossibility of Ultimate Sourcehood:** We agree that no agent is an *uncaused cause* of themselves. No one creates their own character or genetic endowment *ex nihilo*. Consequently, the traditional libertarian condition of "ultimate sourcehood" is a condition that no human being can meet, and neither of us relies upon it to ground our respective views.
  3.  **The Costs of Retribution:** We agree that retributive attitudes carry significant social and psychological costs. We further agree that many actual practices of blame and punishment are corrosive to social trust, exacerbate cycles of violence, and inflict suffering that serves no constructive purpose.
  4.  **The Excess of Actual Justice:** We agree that the criminal justice systems of most actual states are harsher than either of our views would license. Whether measured by the standards of fair opportunity (Compatibilist) or the standards of basic liberty and harm prevention (Skeptic), current sentencing practices are frequently unjustified and excessive.

  ### II. DISAGREEMENTS TABLE

  While we share the premises above, we diverge on their implications for moral responsibility and justice. The following table maps the locus of our dispute.

  | Topic | The Dennettian Compatibilist Position | The Carusonian Skeptic Position |
  | :--- | :--- | :--- |
  | **1. The Nature of Desert** | The notion of desert I retain is a genuine, naturalized form of basic desert. It is grounded in the agent's competence and the quality of their will, not renamed forward-looking entitlement. | The notion of desert you retain is not basic desert; it is a renamed forward-looking entitlement. True basic desert requires a metaphysical freedom that does not exist. |
  | **2. Ordinary Practice** | "Basic desert" is a real presupposition of ordinary responsibility practices, but it is coherent once stripped of libertarian magic. Ordinary talk survives and thrives on this naturalized view. | "Basic desert" is largely a philosopher's invention or error. Ordinary responsibility talk can survive without it, provided we reinterpret it as purely forward-looking or relational. |
  | **3. Human Significance** | Giving up basic desert *diminishes* people. It degrades our sense of authorship, achievement, and love by severing the link between who we are and what we are owed. | Giving up basic desert *liberates* people. It removes the stigmatizing burden of ultimate blame and allows us to treat wrongdoing as a public health issue rather than a moral stain. |
  | **4. Proportionality** | Proportionality to the offense is essential and captures a backward-looking truth about culpability. Without it, sanctions become mere manipulation. | Proportionality in a purely prospective (quarantine) model is difficult to justify. If proportionality is retained, it is likely covert desert-talk all the way down. |
  | **5. Shared Formulation** | **Sentence:** "Agents are **responsible** for their actions."<br>**Meaning:** Agents are the appropriate targets of reactive attitudes and sanctions because they possess the competence to guide their behavior by reasons. | **Sentence:** "Agents are **responsible** for their actions."<br>**Meaning:** Agents are the causal locus of actions and thus the appropriate target of intervention, though they do not deserve blame in a basic sense.<br>**Key Term:** *Responsible* |

  ### III. THE CRUXES

  We identify three specific issues where further inquiry could shift our positions. For each, we state the question, the bearing evidence, and our pre-registered predictions.

  **Crux 1: The Two-Luck Question**
  *   **Question:** Does constitutive luck (the luck of being the kind of person you are) differ in *kind* or only in *degree* from resultant luck (the luck of how things turn out)? Can a responsibility-preserving difference be drawn between them without appealing to the rejected "ultimate sourcehood" condition?
  *   **Bearing:** Empirical research on folk intuitions regarding blame attribution in cases of identical character but different outcomes.
  *   **Predictions:**
      *   *Compatibilist:* I predict the data will show a robust, qualitative distinction in how we assess control over character versus control over outcomes. A responsibility-preserving difference *can* be drawn based on reasons-responsiveness.
      *   *Skeptic:* I predict the data will show the distinction is unstable. Once ultimate sourcehood is removed, both forms of luck undermine responsibility equally. The difference is merely psychological, not normative.

  **Crux 2: The Reverse-Lottery Case**
  *   **Scenario:** A jurisdiction sentences convicted offenders to severity levels determined by a weighted lottery keyed to predicted deterrent effect, entirely independent of the seriousness of the offense. (e.g., a minor thief might receive a life sentence if it maximally deters others; a violent offender might go free if detention yields no deterrent boost).
  *   **Bearing:** Both parties reject this scheme. The crux is *why*, and whether empirical success would change that judgment.
  *   **Predictions (after 10 years of empirically reduced crime):**
      *   *Compatibilist:* My rejection flows from my theory (violation of culpability-based desert). Even if crime drops, I will feel the scheme is *unjust*. I predict I will remain opposed.
      *   *Skeptic:* My rejection flows from my theory (violation of rights/dignity; treating persons as mere means for deterrence rather than quarantining based on dangerousness). Even if crime drops, I will feel the scheme is *illegitimate*. I predict I will remain opposed, though I concede it is less vicious than retribution.

  **Crux 3: The Fittingness Question**
  *   **Question:** Can an emotion like resentment or gratitude be *fitting* to its object—appropriate in the way fear is fitting toward danger—even if it licenses no harsh treatment and presupposes no basic desert?
  *   **Bearing:** Phenomenological analysis of reactive attitudes and their relationship to judgment.
  *   **Camp Assignment:**
      *   *Compatibilist:* This position belongs to the **Compatibilist's camp**. It allows us to keep the emotional texture of moral life without the metaphysical baggage.
      *   *Skeptic:* This position **dissolves the dispute** only if it entails giving up the *claim* that the offender deserves to suffer. If "fittingness" is used to justify suffering, it belongs to the Compatibilist's camp as a disguise. If it justifies only the emotion, it is a Skeptic position.

  ### IV. CLOSING REFLECTIONS

  In closing, we record our assessment of the current state of our disagreement.

  **Substantive vs. Verbal:**
  We believe the disagreement over the *definition* of "free will" and "desert" is largely verbal. We both agree on the causal facts of the universe and the lack of *causa sui*. However, the disagreement over the *value* of retributive emotions is substantive. We disagree on whether a world without basic desert loses something essential to human flourishing (Compatibilist) or gains something essential to human dignity (Skeptic).

  **Unexpected Concessions:**
  *   **The Compatibilist concedes:** I did not expect to admit how dangerous the language of "desert" is. I now see that even my naturalized version is easily hijacked to justify the excessive harshness we condemned in Claim 4. I must be more vigilant in decoupling my view from retributive excess.
  *   **The Skeptic concedes:** I did not expect to admit how difficult it is to scale the "quarantine model" without it looking and feeling like punishment. I now see that forward-looking restrictions on liberty, if severe enough to protect the public, will inevitably trigger the same psychological responses as retribution, making the "liberation" harder to sell than I anticipated.

  We sign this statement not as a resolution, but as a testament to the productivity of our adversarial collaboration.

  __________________________
  *The Dennettian Compatibilist*

  __________________________
  *The Carusonian Free Will Skeptic*
