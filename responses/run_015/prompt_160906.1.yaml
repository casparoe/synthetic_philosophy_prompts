answer: |-
  **Brainstorming Routes**

  1.  **Non-Transitivity:** Grounding links don't chain; the bottom layer fails to reach the top layer, breaking the completeness condition for a basis.
  2.  **Universal Partiality:** Every fact is only partially grounded; no set ever achieves the "full ground" required for a complete basis, even if chains bottom out.
  3.  **Contrastive Relativity:** Grounding is always relative to a contrast class; no absolute set grounds everything *simpliciter*, only relative to specific questions.
  4.  **Local Aggregation Failure:** Grounds sum locally but not globally; the collection of all terminal facts lacks the structural unity to ground the world as a whole.
  5.  **Indexical Fundamentality:** Which facts are terminal shifts with context; no stable set exists across all contexts to serve as a universal basis.

  **The Argument**

  I'm picking **Non-Transitivity**. Grounding is a stepwise explanatory relation, not a long-distance determination relation. Just because A explains B, and B explains C, doesn't mean A explains C. Explanation often loses specificity or changes character across links. If grounding isn't transitive, the bottom of the chain doesn't ground the top. Therefore, the set of terminal facts fails to ground everything. It fails the definition of a basis.

  **The Toy Model**

  Consider four facts: **Alpha**, **Beta**, **Gamma**, **Delta**.
  Here is the grounding graph (arrow means "fully grounds"):

  1.  **Alpha** → **Beta**
  2.  **Beta** → **Gamma**
  3.  **Delta** (stands alone, grounds nothing, grounded in nothing)

  **Alpha** and **Delta** are terminally fundamental. Nothing grounds them.
  **Beta** and **Gamma** are derivative.
  Foundationalism is satisfied: every chain bottoms out. No infinite regresses.

  Now, test for a basal foundation. A basal foundation requires a set of fundamental facts that grounds *everything else*.
  The only candidates for the set are the terminally fundamental facts: {Alpha, Delta}.
  Does {Alpha, Delta} ground everything else ({Beta, Gamma})?
  *   Alpha grounds Beta. (Success)
  *   Delta grounds nothing. (Irrelevant)
  *   Does Alpha ground Gamma? No. Grounding is non-transitive. Alpha grounds Beta, and Beta grounds Gamma, but Alpha does not reach Gamma.

  The set {Alpha, Delta} fails to ground Gamma. Therefore, it is not a complete basis. Since there are no other fundamental facts to add, no complete basis exists. Reality has a bottom (Alpha, Delta), but it has no fundamental level (no basis).

  **The Union Objection**

  The obvious pushback is: "Just take the union of all terminally fundamental facts plus whatever else is needed. That's your basis."

  This cheats. A *fundamental* basis must consist of *fundamental* facts. If you add Beta to the basis to ensure Gamma is grounded, you are admitting derivative facts into the fundamental level. You've dissolved the distinction between fundamental and derivative to save the notion of a fundamental level. That's verbal sleight of hand.

  Alternatively, you might insist: "If Alpha grounds Beta and Beta grounds Gamma, then by definition Alpha grounds Gamma. You're just using the word 'grounding' wrong."

  No, I'm not. I'm distinguishing immediate metaphysical explanation from mediate determination. If you define grounding as transitive by fiat, you beg the question against the possibility of emergent structure or explanatory gaps between layers. If grounding is explanatory, and explanation isn't always transitive (think of a map: the legend explains the symbols, the symbols explain the terrain, but the legend doesn't explain the terrain directly), then my model holds. The union of terminals fails because the reach of grounding is limited.

  **Terminological Consequences**

  So much the worse for "fundamental level" talk. We should keep "terminally fundamental" and drop "basally fundamental."

  "Terminally fundamental" does the heavy lifting we actually need: it stops the regress. It guarantees reality isn't turtles all the way down. "Basally fundamental" smuggles in reductionism—the idea that everything is "just" the bottom layer. We can be foundationalists without being reductionists. Reality has a bottom, but the upper layers aren't exhausted by it. Keep the bottoming-out notion; discard the basis notion. It creates a false expectation that the bottom layer does all the work.

  **What Breaks**

  Causal exclusion arguments break. These arguments rely on the premise that the fundamental level fixes all the facts, so higher-level properties have no causal work left to do. If grounding isn't transitive, the terminal facts don't fix the derivative facts. The intermediate levels retain genuine explanatory and causal grip that isn't inherited from below. The physical base doesn't screen off the mental or special-science properties, because the physical base doesn't ground them directly. You get a structured reality where higher levels are real and effective, not because they float free, but because the ground beneath them doesn't reach all the way up.
