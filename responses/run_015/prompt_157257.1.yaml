          *   *Proposal:* Kestrel Brook Descendants' Association + Oral Historian propose 100 life-history interviews (2026–27).
          *   *Integration:* Co-ownership, same finding aid with item-level links, "silence notes" in the finding aid where company papers are mute.
          *   *Costs:* Equals 3 years of digitizing the company papers (which were promised next).
          *   *Risks:* Interviews linked to compensation claims; sensitive data (allegations of violence/collusion); living relatives of named third parties; ad hoc existing policy on sensitive data/embargoes.
      *   **The Conflict (Friend's Critique):**
          *   "Parity Illusion": Treating memory (2026) and bureaucracy (1948) as symmetrical sources misleads researchers.
          *   "Silence Notes": Cataloging absence turns it into a "documented finding," laundering bias.
          *   "Co-ownership Decoy": Title without real decision power.
          *   *Underlying tension:* Comfortable professional norms (digitize existing papers) vs. ethical engagement (community voices).
      *   **Technical Services Constraint:** Provenance is non-negotiable. Interviews = different creator = separate collection. Archivist-authored interpretation in finding aids = bad practice (looks like description).
      *   **Requirements for the Memo:**
          *   Must land on an actual bottom line (Yes/No/Conditional) for voting.
          *   Must cover: Taking interviews? Co-description vs. separate? Silence notes location? Consent/Embargo/Withdrawal/Third Parties? Budget allocation (Digitization vs. Interviews).
          *   Must give the "losing side" its best day in court (no condescension, acknowledge valid critiques).
          *   Tone: Professional, nuanced, decisive but open to scrutiny, suitable for a committee.

  2.  **Determine the Recommendation (The "Bottom Line"):**
      *   *Constraint Check:* Technical Services says provenance is non-negotiable. This is a hard archival standard (respect des fonds). Co-description in the *same* finding aid violating provenance is likely a non-starter technically and ethically (creates the "parity illusion" friend warned about).
      *   *Ethical Check:* The friend's critique on "silence notes" in the finding aid is strong. Archival description should describe *what is there*, not *what isn't*, unless framed carefully as scope/content notes. However, ignoring the silence perpetuates the bias.
      *   *Budget Check:* Digitization was promised. Reneging entirely damages trust with researchers. But doing *only* digitization ignores the community opportunity.
      *   *Risk Check:* Compensation claims + sensitive allegations require robust legal/ethical frameworks which the library currently lacks ("ad hoc").
      *   *Synthesis:* A "Yes, but..." approach is best. Accept the interviews (ethical imperative), but separate the collections (provenance), reframe the "silence notes" (contextual essay vs. finding aid), and split the budget (hybrid model).
      *   *Decision:* **Yes-with-Conditions.**
          *   Accept interviews as a *separate* collection (MS 2026/XX) to respect provenance and avoid "parity illusion."
          *   Link via "Archival Context" essay or guide, not item-level finding aid integration (addresses Tech Services + Friend's critique).
          *   "Silence Notes" become a "Contextual Statement" published alongside the guides, not embedded in the inventory (avoids laundering bias).
          *   Budget: Split. 1.5 years digitization + 1.5 years interview project (or phase it). Actually, better to prioritize the interviews *now* while the community is mobilized, but commit to digitization immediately after. Or, given the compensation claim risk, maybe delay interviews until legal framework is set? No, the prompt implies the project is 2026-27. Let's propose a pilot + policy development first.
          *   *Refined Decision:* Approve the *principle* of acquisition, but defer the *commitment* of funds until a specific Ethical Framework for Oral Histories is adopted (addressing the third-party/embargo issue). Reallocate budget to a 50/50 split over 5 years.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Purpose:** Clear statement of the decision needed.
      *   **Background:** Summarize the Kestrel Brook collection and the proposal neutrally.
      *   **Key Issues:** Break down the conflicts (Provenance, Epistemology/Parity, Ethics/Legal, Budget).
      *   **Options Analysis:** This is crucial for "giving the losing side its best day."
          *   *Option A (Full Integration):* The Proposal as is. (Pros: Community trust. Cons: Provenance violation, Parity Illusion).
          *   *Option B (Status Quo/Digitization):* (Pros: Safe, promised. Cons: Perpetuates silence, community alienation).
          *   *Option C (The Recommended Path):* Separate collection, contextual linking, robust ethics policy first.
      *   **Recommendation:** The specific vote items.
      *   **Implementation:** Phasing and dates.

  4.  **Refining the Tone:**
      *   Avoid "I think." Use "The Committee is asked to consider."
      *   Acknowledge the friend's critique explicitly as a valid archival concern (epistemological weight), not just "dissent."
      *   Acknowledge Technical Services' constraint as standard practice, not bureaucracy.
      *   Ensure the "Silence Note" solution doesn't feel like a workaround but a methodological improvement.
      *   *Self-Correction on "Silence Notes":* The friend argues cataloging silence makes it a "thing." The solution is to put the commentary *outside* the inventory. A "Historical Note" or "Administrative History" in the finding aid is standard, but a separate "Contextual Guide" is better for this level of meta-commentary. Let's suggest a "Contextual Essay" linked from both finding aids.

  5.  **Addressing Specific Constraints:**
      *   *Third Parties:* Need a specific policy recommendation (e.g., tiered access, redaction options).
      *   *Compensation Claim:* Need legal review clause.
      *   *Budget:* Need a specific split.
      *   *Provenance:* Must respect Tech Services.

  6.  **Final Review against User Prompt:**
      *   "Needs the memo more than I need to be argued at." -> The memo must structure the thinking.
      *   "Lands on an actual bottom line." -> Clear motions to vote.
      *   "Give the losing side its best day in court." -> Ensure Option B (Digitization only) and the Friend's Critique are articulated strongly in the analysis.
      *   "No condescension." -> Professional, respectful language.

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Motion 1:* Acquire interviews? Yes, contingent on policy.
      *   *Motion 2:* Description? Separate collections, linked via contextual guide.
      *   *Motion 3:* Silence? Contextual guide, not inventory.
      *   *Motion 4:* Ethics? Adopt new Oral History Protocol before signing.
      *   *Motion 5:* Budget? 50/50 split over 5 years.

      *(Self-Correction)*: Wait, if I recommend "Yes contingent on policy," does that kick the can down the road? The meeting is Thursday. I need a decision *to proceed* or *not*. I should recommend proceeding *provided* the policy is drafted by X date.
      Actually, the strongest position is to approve the *project* but mandate the *framework* changes.
