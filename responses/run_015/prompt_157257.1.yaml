answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee
  **FROM:** [Your Name/Title]
  **DATE:** [Current Date]
  **SUBJECT:** Decision Memo: Kestrel Brook Colliery Company Collection & Proposed Oral History Project (2026–27)
  **MEETING DATE:** Thursday, [Date]

  ### 1. EXECUTIVE SUMMARY & RECOMMENDATION

  This memo requests a decision on the proposal from the Kestrel Brook Descendants' Association (KBDA) and partner oral historians to commission approximately 100 life-history interviews to complement the existing Kestrel Brook Colliery Company working papers (1929–1984).

  **Recommendation:** I recommend the Committee vote **YES-WITH-CONDITIONS**.

  We should accept the interviews to address the systemic silences in the existing collection, but we must reject the proposed method of integration. To maintain archival integrity and mitigate legal risk, the interviews must be accessioned as a **separate collection** (respecting provenance), linked via a **contextual guide** rather than item-level finding aid integration, and contingent on the adoption of a new **Oral History Ethics Protocol** prior to funding release. Budget allocation should be split to allow for immediate digitization of high-risk company records while funding the interview pilot.

  **Motions for Vote:** See Section 5.

  ---

  ### 2. BACKGROUND

  **The Existing Collection (MS KB/01):**
  Acquired eight years ago, this collection comprises the administrative records of the Kestrel Brook Colliery Company welfare office. It is structurally top-down: housing ledgers, conduct cards, and medical inspections regarding roughly 4,000 workers. The workers' voices appear only as filtered through management (e.g., petition letters filed as enclosures to managerial memos). Significant gaps exist regarding the 1953 strike, women's domestic economies, and informal community arrangements.

  **The Proposal:**
  The KBDA proposes commissioning 100 oral history interviews (2026–27).
  *   **Integration:** Co-ownership; item-level linking between interviews and company papers in a single finding aid; "silence notes" inserted into the inventory where company records are mute.
  *   **Cost:** Equivalent to three years of the planned digitization budget for MS KB/01.
  *   **Context:** Interviews are being gathered partly in support of a descendant compensation claim. Content may include allegations of violence or collusion involving identifiable third parties (foremen, doctors, neighbours), many of whose descendants remain local.

  ---

  ### 3. CRITICAL ANALYSIS OF OPTIONS

  To ensure we vote with full awareness of the trade-offs, the following analysis outlines the strongest arguments for the three primary positions: full acceptance of the proposal, rejection in favour of status quo, and the recommended conditional acceptance.

  #### Option A: Accept Proposal as Submitted (Full Integration)
  *   **The Case For:** This maximizes community trust and reparative justice. Co-description and "silence notes" actively force the researcher to confront the bias of the original records. It treats the descendants as partners rather than subjects.
  *   **The Case Against (Epistemological & Technical):**
      *   **The Parity Illusion:** Placing a 1948 conduct card and a 2026 memory side-by-side with symmetrical links risks implying evidentiary equivalence. Researchers may cite them as mutually corroborating, when the interview is actually evidence of *memory formation* under the shadow of the company record, not necessarily evidence of the 1948 event itself.
      *   **Provenance Violation:** Technical Services advises that merging distinct creators (Company vs. Descendants) into one finding aid violates *respect des fonds*. It obscures the origin of the records.
      *   **Cataloguing Absence:** Inserting "silence notes" into the inventory risks turning an absence into a catalogued item. As one critic noted, this "launders bias into findings" by making the gap look like a held item.
      *   **Legal Risk:** Without a new policy, we lack mechanisms to handle third-party allegations or withdrawal requests from interviewees involved in litigation.

  #### Option B: Reject Proposal (Prioritize Digitization)
  *   **The Case For:** This honours our existing commitment to the research community. Digitizing the company papers provides stable, unchanging primary sources. It avoids the legal quagmire of sensitive oral data and compensation claims. It adheres to traditional archival standards where the archive holds records, not commissioned content.
  *   **The Case Against (Ethical & Strategic):**
      *   **Perpetuating Silence:** Digitizing only the company papers amplifies the voice of the oppressor. It makes the surveillance data more accessible without providing the context to critique it.
      *   **Community Alienation:** Refusing the KBDA now, after engagement has begun, may close doors for future community collaboration permanently.
      *   **Static History:** It treats the archive as a warehouse of the past rather than a participant in ongoing historical dialogue.

  #### Option C: Conditional Acceptance (Recommended)
  *   **The Case For:** This balances ethical imperatives with archival standards.
      *   **Separate Provenance:** Interviews are accessioned as a distinct collection (e.g., MS KB/02). This preserves the integrity of the Company records while acknowledging the Interviews as a distinct creation (memory vs. bureaucracy).
      *   **Contextual Linking:** Instead of item-level links in the inventory, we produce a **Contextual Guide**. This essay explicitly discusses the relationship between the two collections, the nature of the silences, and the epistemological differences between the sources. This addresses the "Parity Illusion" by framing the relationship narratively rather than structurally.
      *   **Ethical Safeguards:** Funding is contingent on a new protocol for third-party consent, embargoes, and withdrawal rights.
  *   **The Case Against:** It requires more labour upfront (policy writing, guide writing) and delays full digitization of the company papers by approximately 18 months.

  ---

  ### 4. SPECIFIC POLICY CHALLENGES

  **1. Third-Party Rights & Sensitive Data**
  Current practice (fixed-period closure) is insufficient for oral histories containing allegations against living or recently deceased third parties.
  *   *Risk:* Defamation claims or community harm.
  *   *Mitigation:* The new protocol must shift responsibility. Interviewees must be informed that they are responsible for clearing third-party names. The Library reserves the right to embargo specific segments or redact names upon deposit if legal counsel advises high risk.

  **2. The Compensation Claim**
  The interviews are being gathered partly for a compensation claim.
  *   *Risk:* The Archive appears to be funding litigation evidence.
  *   *Mitigation:* The Deposit Agreement must explicitly state that the Archive is a neutral custodian. Access to the interviews for legal proceedings must follow standard reproduction fees and policies; we do not grant preferential access to the claimants.

  **3. "Silence Notes" vs. Context**
  *   *Decision:* We will not insert "silence notes" into the inventory list itself. Instead, the **Administrative History** section of the finding aid and the separate **Contextual Guide** will explicitly detail what is missing from the Company records (the strike, women's agency) and how the Interview collection addresses or fails to address those gaps. This marks the silence without cataloguing it as an object.

  **4. Budget Allocation**
  *   *Current Plan:* 100% to Company Paper Digitization (3-year timeline).
  *   *Proposed Plan:* 50% to Interview Project (Year 1–2), 50% to Company Paper Digitization (Year 1–3).
  *   *Impact:* Digitization timeline extends by 1.5 years. This is a significant trade-off but prevents the "digitize the bias" scenario.

  ---

  ### 5. MOTIONS FOR VOTE

  I move that the Collections Committee approve the following:

  **Motion 1: Acquisition Principle**
  *That the Library agrees in principle to accept the Kestrel Brook Oral History Collection on deposit, subject to the execution of a Deposit Agreement that clarifies co-ownership rights do not extend to curatorial control over access or description.*

  **Motion 2: Provenance & Description**
  *That the Oral History Collection be accessioned as a separate collection (distinct from the Company Papers). Integration shall be achieved via a published "Contextual Guide" linking the two collections, rather than item-level links within the finding aid inventory. "Silence notes" shall be excluded from the inventory list and included only in the Administrative History and Contextual Guide.*

  **Motion 3: Ethical Framework**
  *That the release of funds for the interview project is contingent upon the adoption of a new "Oral History Ethics Protocol" by [Date + 3 Months]. This protocol must address: (a) tiered embargo options for interviewees; (b) a mechanism for withdrawal of testimony; and (c) a risk assessment process for third-party identifiable data.*

  **Motion 4: Budget Reallocation**
  *That the Digitization Budget for FY26–FY28 be reallocated on a 50/50 basis between the Company Papers Digitization and the Oral History Project. The Project Manager is authorized to extend the Company Papers digitization timeline by 18 months to accommodate this split.*

  ---

  ### 6. IMPLEMENTATION TIMELINE (IF APPROVED)

  *   **Thursday (Meeting Date):** Committee Vote.
  *   **Jan–Mar 2026:** Legal review of Deposit Agreement; Drafting of Oral History Ethics Protocol.
  *   **Apr 2026:** Final sign-off with KBDA. If Protocol is not adopted, project reverts to Digitization-only budget.
  *   **May 2026 – Dec 2027:** Interview commission and ingestion.
  *   **Jan 2028:** Publication of Contextual Guide; Release of first tranche of digitized Company Papers.

  ### 7. CLOSING NOTE

  This decision is not merely about budget or description standards; it is about how we define the archive's role in contested history. My friend and colleague has argued convincingly that we risk creating a "parity illusion" that misleads researchers about the nature of memory versus bureaucracy. I share that concern. However, I believe rejecting the project entirely privileges the "comfortable option" of standard digitization over the ethical necessity of engaging with the community whose lives are documented in our stacks.

  The conditional path outlined above attempts to hold both truths: that the Company records are bureaucratic instruments of control, and that the Interviews are acts of memory that require their own distinct space to be understood correctly. It asks us to do more work, not less.

  I look forward to discussing this on Thursday.

  [Signature]
