prompt: |-
  hey can you build me a thought experiment for the pain-asymbolia debate but with a twist? i want a realistic one-paragraph scenerio—like a restaurant kitchen grease fire, nothing sci-fi—with two people: one with classic pain asymbolia, so she feels the burn clearly, can point to the exact spot and describe heat and sharpness, but has zero emotional reaction and no urge to pull away; and another with what i'll call "reverse asymbolia," where she has the full panic, the avoidance reflex, and reports "this is awful," but insists she feels no localized heat, no sharpness, nothing sensory she can point to. the case should isolate whether pain's badness lives in the sensory channel, the affective channel, or in some coupling between them.

  after describing the scenerio, run three verdicts: (1) the representationalist who says pain is bad because it represents tissue damage, (2) the pure affectivist who says badness is just the negative affect and sensation is neutral, and (3) a relational view that says badness needs both but only in the right coupling. for each, say which person is worse off, or if either doesn't count as being in pain at all, and why.

  then do the design check: name the structural feature doing the work (probably the bidirectional disociation), explain what collapses if you drop the reverse-asymbolia character and just compare normal pain vs classic asymbolia, and tell me how a representationalist would attack the reverse case—likely by denying she's in pain at all. keep it all in one go, no bibliographies or "see Smith 2015," just reasoning. also make sure the ruthlessness of the verdicts falls out of the theories themselves, not from a stipulation.
