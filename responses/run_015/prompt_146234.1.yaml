answer: |-
  In the chaotic heat of a dinner rush, a fryer erupts, splashing boiling oil onto the forearms of two line cooks. Elena, who has classic pain asymbolia, watches the droplets hit her skin and calmly states, "There is a burning sensation on my left forearm, precisely here," pointing to the blistering spot while continuing to plate food without flinching or expressing distress. Beside her, Marcus suffers from "reverse asymbolia"; he screams and drops his pan, clutching his arm and rocking back and forth, crying, "It's awful, make it stop, I can't handle this," yet when asked to locate the burn, he admits he feels no heat, no sting, and no specific spot on his skin, only an overwhelming, free-floating sense of catastrophe and an irresistible urge to withdraw from his own body.

  **Verdicts**

  1.  **The Representationalist:** Pain is fundamentally a perceptual state representing bodily damage. Elena is in pain because her experience accurately represents tissue damage, but she is not worse off because the "badness" of pain is a specific representational content (an imperative to avoid) that is missing in her case. Marcus is not in pain at all; because he lacks sensory representation of bodily disorder, his state is merely a panic attack or anxiety misidentified as pain. He is distressed, but not suffering *pain*.
  2.  **The Pure Affectivist:** The badness of pain is identical to the negative affective tone; sensation is merely a neutral trigger. Elena is not worse off because she lacks the negative affect entirely; her experience is morally and phenomenologically neutral. Marcus is significantly worse off because he possesses the full negative affect and motivational urge that constitutes suffering; the lack of sensory localization is irrelevant to the reality of his agony.
  3.  **The Relational View:** Badness emerges only from the functional coupling of sensory discrimination and affective motivation. Neither person is experiencing full pain badness because both states are dissociated. However, Marcus is worse off because affect without a sensory object is unresolvable torment—he cannot act to fix the damage because he cannot locate it—whereas Elena's state is functionally inert but stable.

  **Design Check**

  The structural feature doing the work is **bidirectional dissociation**, which splits the sensory and affective channels in both directions rather than just one. If you drop the reverse-asymbolia character and only compare normal pain vs. classic asymbolia, the Representationalist can easily argue that affect is a contingent add-on to the core sensory representation of damage. By introducing Marcus, the thought experiment forces the Representationalist to confront a state with full suffering but no bodily representation; to maintain their theory, they must ruthlessly deny Marcus is in pain at all, revealing that their theory prioritizes intentional content over felt suffering. A Representationalist attacks the reverse case by claiming Marcus's state lacks an intentional object (the body), rendering it a non-veridical emotional state rather than a perceptual pain state.
