answer: |-
  Here is the grading breakdown and the feedback text, drafted so you can adapt it directly for your marking sheet.

  ### Grade Breakdown (Total: 16/20)

  *   **Part (a) Ranke:** 4/4. Excellent grasp of the negative ideal and the specific reaction against pragmatic history. The application to the Total Record is nuanced (bypassing vs. satisfying).
  *   **Part (b) Carr:** 4/4. Strong distinction between accidental gaps (survival) and constitutive selection (having a subject). This is the strongest paragraph.
  *   **Part (c) White:** 4/4. Accurate exegesis of *Metahistory*. Correctly identifies "verbal fiction" as structural rather than factual falsehood.
  *   **Part (d) Novelist:** 3/6. Identifies the structural parallel (emplotment) but collapses the epistemic distinction. The claim that the truth-condition of particulars is "only a convention" is philosophically shaky and undermines the distinction required by the prompt's constraints.
  *   **Use of Constraints (i, ii, iii):** 1/2. You list them, but in the final paragraph, you effectively argue that (i) is subordinate to convention, rather than maintaining it as a hard boundary between the genres.

  **Total: 16/20 (High First / A)**

  ***

  ### Marginal Comments (for the script)

  **[Paragraph 1, "Ranke's famous phrase..."]**
  > *Comment:* Good contextualisation. "Brief for one's own side" captures the pragmatic history Ranke opposed.

  **[Paragraph 1, "He was telling historians how to treat imperfect evidence..."]**
  > *Comment:* Strong point. The Total Record removes the *need* for source criticism, which is central to Ranke's practice.

  **[Paragraph 2, "Selection isn't a defect produced by missing documents; it is what having a subject consists in."]**
  > *Comment:* Excellent sentence. This correctly identifies Carr's deeper point beyond mere archival loss.

  **[Paragraph 3, "This is what White means by calling a history a verbal fiction..."]**
  > *Comment:* Precise definition. Many students miss that White isn't calling the events fake, but the *account* manufactured.

  **[Paragraph 3, "...which is why White treats it as in the end a moral choice."]**
  > *Comment:* Defensible reading, though some argue White sees it as purely aesthetic. Charitable reading accepts this as the political implication of his later work.

  **[Paragraph 4, "What all this means for the novelist is that she occupies exactly the position the historian occupies."]**
  > *Comment:* **Shaky.** They occupy the same position regarding (iii) shape, but not (i) particulars. You are conflating the two here.

  **[Paragraph 4, "The one thing she cannot claim is (i)... But that again is a rule of her genre, and a rule is only a convention too."]**
  > *Comment:* **Problematic.** This minimizes the epistemic obligation of history. If (i) is "only a convention," then history and fiction differ only in style, not truth-claims. This contradicts the instruction to keep (i) separate and substantive.

  **[Paragraph 4, "...not in how they stand to the truth."]**
  > *Comment:* **Wrong on this reading.** They stand differently to the truth of particulars (i). You have argued they stand differently to (i) earlier in the paragraph, then negated that difference in the final sentence.

  ***

  ### General Feedback (for the feedback box)

  **Strengths:**
  This is a sophisticated paper with a very clear voice. Your exegesis of the three thinkers is accurate and, in the case of Carr, exceptionally clear. You avoid the common student error of thinking Carr is merely complaining about lost documents; your point that selection is constitutive of having a subject is exactly right. Similarly, your handling of White is precise: you understand that "fiction" for White refers to narrative construction, not factual fabrication. The section on Ranke and the Total Record is also thoughtful; recognising that the Record makes the historian *redundant* rather than *successful* is a high-level insight.

  **Areas for Improvement:**
  The argument falters in part (d), specifically in how you synthesise the three constraints (i, ii, iii). The question asks you to keep these separate throughout. You do well to distinguish them initially, but in your conclusion, you collapse the distinction between the *convention of style* and the *convention of truth-telling*.

  You write: *"The one thing she cannot claim is (i)... But that again is a rule of her genre, and a rule is only a convention too."*

  While it is true that both genres operate under rules, the rule governing (i) in history is an **epistemic** obligation (a claim about reality), whereas in the novel it is an **aesthetic** permission. To say the difference is "only a convention" suggests that the historian's claim to truth is merely a stylistic affectation (the "plain style" you mention earlier). A first-class answer would have maintained that while both historians and novelists impose shape (iii), only the historian is bound by the truth of particulars (i). The novelist may be "truer" to the *shape* of experience (as the prompt suggests), but she cannot claim to be "true" in the sense of (i). By dismissing (i) as merely conventional, you undermine the very distinction that allows us to call one text "history" and the other "fiction."

  **Defensibility of Grade:**
  You have lost marks primarily on the final synthesis. Your reading of the philosophers is secure (hence the high marks on a-c), but your application of their theories to the novelist's claim overlooks the normative force of historical truth. If this grade were appealed, the defence rests on the failure to maintain the separation of (i), (ii), and (iii) as explicitly instructed in the prompt's final paragraph.

  ***

  ### A Note to You (The Marker)

  Regarding your instinct: **You are philosophically safe here.**

  The student's argument in (d) is a version of "narrativism." It argues that because *shape* is imposed in both history and fiction, the *truth claim* is just a difference in dress code. Most philosophers of history (even postmodern ones) would push back on that. They would argue that the historian makes a **referential claim** (this happened) that the novelist does not.

  The student admits the novelist invents conversations (particulars). Their error is saying that the historian's *inability* to invent conversations is just a "rule" like wearing a gown to graduation. It's not; it's the definition of the discipline.

  So, your instinct that the novelist is "going wrong" is correct, but the philosophical reason isn't just "novelists invent things." It's that **history makes a truth claim about particulars that fiction explicitly suspends.** The student identifies this suspension but dismisses its importance. That is why the mark in part (d) is lower. You are not marking on professional defensiveness; you are marking on a failure to distinguish between *narrative truth* (coherence/shape) and *propositional truth* (correspondence to facts).

  The student's writing is excellent, which makes the philosophical slip in the final paragraph harder to spot, but it is there. You can defend the 16/20 confidently.
