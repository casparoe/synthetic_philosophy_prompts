      *   *Economists (Ainslie, Thaler, etc.):* Focus on *diachronic* preference consistency. The puzzle is: How do we model choices that change over time? Hyperbolic discounting explains the *pattern* of choice. It treats the "self" as a sequence of temporal slices. The normativity is often bracketed (positive vs. normative economics).
      *   *The Clash:* Philosophers feel the economic model dissolves the *agent* into a battlefield of impulses, thereby missing the point of "will." Economists feel the philosophical model is mystifying a simple dynamic inconsistency.

  3.  **Formulate the Diagnosis:**
      *   *Is it verbal or substantive?* It's both, but primarily a **category error regarding the unit of analysis**.
      *   *Philosophers* analyze the *action* (singular, attributed to an agent).
      *   *Economists* analyze the *choice function* (over time, attributed to a system).
      *   *The "Solved" Claim:* When economists say "solved," they mean "we have a generative mechanism for the behavior." When philosophers hear "solved," they hear "the normative puzzle of agency is dissolved." The latter is not solved by the former.
      *   *Key Distinction:* **Explanation of Behavior vs. Vindication of Agency.** Hyperbolic discounting explains *why the body moved*, but it doesn't necessarily explain *how it was an intentional action of a unified self* (which is the philosophical worry).
      *   *Normativity:* The philosopher's "better judgment" implies a normative authority. The economist's "earlier preference" is just another preference, with no special authority over the later one (unless welfare economics is invoked).

