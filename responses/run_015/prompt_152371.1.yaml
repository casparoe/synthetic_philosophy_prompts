answer: |-
  **HISTORY 504: HISTORIOGRAPHY & METHOD**
  **FINAL EXAMINATION**
  **Time Allowed:** 90 Minutes
  **Materials:** Blue Book Only. No databases, no citations, no notes.

  **Question 1**
  The standard periodization of Western intellectual history relies on a tripartite scheme: the Middle Ages, the Rennaisance, and the Scientific Revolution. This sequence implies a causal trajectory, suggesting that each era is a necessary rung on a ladder leading to modern epistemology. However, this structure only holds together if you smuggle in a competitive model of knowledge, where alchemy has to be read as failed chemistry and medieval universities have to be read as failed labs.

  Draft an argument addressing the following: If we drop that competitive premise—treating alchemy and scholasticism as parallel economies of knowing rather than immature versions of modern science—does the sequence dissolve entirely? Or does it merely reshuffle into three unrelated stories that happen to share a spine in textbooks? Defend your position without recourse to specific dates or names; focus strictly on the architecture of the narrative.

  ***

  ### MODEL ANSWER (For Instructor Use Only)

  The traditional tripartite scheme functions less as a description of time than as a justification of the present. By organizing history into the Middle Ages, the Renaissance, and the Scientific Revolution, historians construct a teleological ladder. In this view, the past is valuable only insofar as it anticipates us. This requires a competitive model of knowledge where every past epistem must be judged against modern science. Alchemy is not treated as a coherent system with its own goals; it is dismissed as "failed chemistry." Similarly, scholasticism is reduced to "failed logic," waiting for the scientific method to correct it. This competitive premise creates the friction necessary for the narrative to move forward; without the tension of failure and correction, there is no revolution, only change.

  If we remove this competitive premise and treat these systems as parallel economies of knowing, the causal glue of the sequence begins to weaken. Alchemy was not trying to be chemistry; it was trying to transmute matter and spirit simultaneously. Its "failure" is only visible from the endpoint of chemistry. If we view it as a parallel economy, it succeeds on its own terms. Consequently, the Scientific Revolution loses its status as a correction. It becomes merely a shift in preference, not an evolutionary leap.

  Does this dissolve the sequence entirely? Not quite. It reshuffles it. We are left with three distinct epistemic cultures that share a geographical and linguistic spine but lack a causal trajectory. The Middle Ages become a stable era of theological synthesis rather than a dark waiting room. The Renaissance becomes a shift in artistic patronage rather than a "rebirth" of reason. The Scientific Revolution becomes a specific narrowing of inquiry rather than an enlightenment. They remain in the textbooks because they share a lineage of language and institution, not because one begat the other through progressive refinement.

  Ultimately, dropping the competitive premise reveals that the tripartite scheme is a historiographical tool, not a historical reality. The periods do not dissolve because the artifacts remain, but the narrative arc connecting them vanishes. We are left with unrelated stories bound by the convenience of curriculum. The ladder becomes a pile of rungs. To teach them as a sequence without the competitive model is to admit that history is not a march toward us, but a collection of disparate ways of being that we have chosen to organize for our own comfort. The spine remains, but the nervous system is gone.

  ***

  ### MARKING SCHEME (20 Marks Total)

  **1. Identification of Teleology (4 Marks)**
  *   **Must:** Explicitly define the traditional sequence as a ladder leading to the present (teleology).
  *   **Blow it:** Candidates describe the periods chronologically rather than structurally.

  **2. Definition of the Competitive Premise (4 Marks)**
  *   **Must:** Explain how "failure" is required to make alchemy/scholasticism look like ancestors of science.
  *   **Blow it:** Candidates treat alchemy as simply "wrong" rather than judging it by the wrong standards.

  **3. Articulation of Parallel Economies (4 Marks)**
  *   **Must:** Argue that alternative systems have internal success criteria unrelated to modern science.
  *   **Blow it:** Candidates try to prove alchemy was "actually science" instead of a different economy.

  **4. The Dissolve vs. Reshuffle Argument (4 Marks)**
  *   **Must:** Take a definitive stance on whether the sequence breaks or just reorganizes (as per prompt).
  *   **Blow it:** Candidates sit on the fence or argue "both are true" without synthesizing the tension.

  **5. Historiographical Conclusion (4 Marks)**
  *   **Must:** Conclude that periodization is a tool of narrative convenience, not natural history.
  *   **Blow it:** Candidates end by summarizing the periods instead of the method of grouping them.
