prompt: |-
  I'm a robotics engineer who spends most of my time on sensor fusion and state-estimation for autonomus platforms—think Kalmen filters, multi-modal noice reduction, proprioceptive feedback loops, and feature-extraction pipelines that have to decide in real time whether a signal is meaningful or just artifact. Lately I've been arguing with a friend about what emotions actually are, and I keep running into these three philosophical camps: one says they're basically bodily feelings or interoceptive signals; another says they're judgments or appraisals, like classifcation of a situation as dangerous or unjust; and a third treats them more like direct perceptions of value, almost like a specialized sensor modality that picks up on salience without going through a reasoning layer. I want you to translate all three positions into my vocabulary—sensors, state estimators, feedback loops, signal-to-noise ratios, classifcation layers, maybe control-theoretic set-points—as faithfully as you can, without smuggling in assumptions that belong only to one framework.

  Then I need the residue report: which parts map cleanly onto how my systems actually work, which parts have to be distorted to fit (for example, does "appraisal" become just a higher-level classifier, and if so, does that lose something about normativity?), and which parts have no counterpart at all in robotics—maybe intentionality, or the idea that an emotion can be appropriate or inappropriate in a way that isn't just "calibration error." I'm also wondering whether the philosophical disagreement is actually substantive, or whether it's just people fighting over which layer of the processing stack gets the label "emotion." Be honest about whether my vocabulary is missing something real, or whether philosophers are describing distinctions that don't affect system behavior. Write the answer in American English, please—my friend and I are both American and I want to avoid any weird British spellings that might distract from the point.
