answer: |-
  ### Brainstorm: The Tyranny of the Chair

  1.  **The Linear Illusion (Exponential Discounting):** In a rational model, time is a straight line. If I value $110 in 31 days more than $100 in 30 days, I should value $110 tomorrow more than $100 today. The discount rate is constant. This allows for *intertemporal bargaining*: Past Self makes a contract with Future Self, trusting that the terms remain stable. It's a democracy of temporal parts.

  2.  **The Hyperbolic Reality:** Human discounting isn't linear; it's hyperbolic. We have a steep discount rate for immediate delays and a flat rate for distant ones. This causes *preference reversal*. What looks like a good deal from a distance (dieting next week) looks like a bad deal up close (skipping lunch today).

  3.  **The Committee Metaphor:** Imagine your life as a committee of selves (Past, Present, Future). In theory, they vote. In practice, the Present Self is the Chair. They hold the gavel. They have *proximity-weighted veto power*. They control the muscles *now*.

  4.  **The Unsigned Contract:** The Past Self signed the plan, but the Present Self never ratified it. When the moment arrives, the utility function shifts. The future reward is discounted so heavily by the hyperbolic curve that it vanishes compared to the immediate cost. The Chair doesn't just vote; they dissolve the meeting.

  5.  **The Poetic Structure:** The octave must feel stable, metered, and rhymed (ABAB CDCD) to mimic the linear promise. The volta (line 9) is the spike in the curve. The sestet must fracture—slant rhymes, broken rhythm—to mimic the collapse of rationality. The final line is the veto itself.

  ***

  ### Sonnet for the Unsigned Contract

  We signed a treaty across the coming week,
  Where pain today buys pleasure in the end.
  The linear path seemed rational and meek,
  A promise kept by yesterday's best friend.
  Each future self got one equal vote,
  On straight lines where the discount rate stayed true.
  I pledged abstinence, buttoned up the coat,
  And trusted time to pay what was due.

  But now the curve spikes vertical and steep,
  The Chair wakes up and vetoes every plan.
  The future takes a single, stumbling step,
  There is no law the animal obeys but can.
  The ledger breaks, the only truth is here—
  Just this once.
