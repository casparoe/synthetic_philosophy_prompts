      *   **Task:** Restate EMT and key arguments (Parity Principle, Constitution vs. Coupling) using distributed systems vocabulary (service boundaries, source of truth, caches, latency, sync/async, trust boundaries, coupling/composition, failure domains).
      *   **Specific Questions to Address:**
          1.  Does the interest-relative nature of system boundaries dissolve the philosophical dispute, or is there something missing?
