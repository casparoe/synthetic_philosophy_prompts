          3.  What happens to trust when external stores are edited by others or ranked by algorithms (cache poisoning vs. environment change)?
          4.  Is there a normative stake (warrants, search vs. reading thoughts) that the engineering vocabulary screens out?
      *   **Constraints:** American English, stay concrete, avoid literature tour, focus on the three cases/questions, provide a "Residue Report" (what translated, what required violence, what failed).

  2.  **Deconstruct the Extended Mind Thesis (EMT) into Eng Speak:**
      *   *Core Claim:* Cognitive processes aren't confined to the brain; they extend into tools/environment if coupled tightly enough.
      *   *Eng Translation:* The "Cognitive Service" isn't just the `brain.dll`. It's a distributed system where `notebook.exe` or `phone.app` are microservices that are so tightly coupled they count as part of the core deployment unit.
      *   *Parity Principle:* If a function (e.g., memory recall) is handled by an internal module (hippocampus), it's cognitive. If handled by an external module (notebook) with similar latency/reliability/ coupling, treating it as non-cognitive is arbitrary bias (like saying on-prem is "real" compute but cloud isn't).
      *   *Coupling vs. Constitution (The Reply):* Just because Service A calls Service B reliably (coupling) doesn't mean Service B is *part of* Service A's deployment boundary (constitution). You can have 99.99% SLA dependency without owning the code.

  3.  **Drafting the Translation (Section 1):**
      *   *EMT:* The "Mind" is a distributed cluster. The skull isn't the hard boundary.
      *   *Parity:* Functional equivalence. If `internal_memory.get()` and `external_notebook.get()` have same latency/bandwidth/SLA, distinguishing them based on physical location (inside skull vs. pocket) is like discriminating based on rack location.
      *   *Coupling/Constitution:* High availability dependency $\neq$ ownership. A CDN is coupled to your origin, but if the CDN goes down, you don't say *your* server crashed. You say you have a dependency failure.

  4.  **Addressing Question 1: Interest-Relative Boundaries:**
      *   *Eng View:* Boundaries are pragmatic (latency vs. blame).
      *   *Phil View:* They want an ontological fact (what *is* the mind?), not just a pragmatic one (how do we *model* the mind?).
      *   *Resolution:* The dispute doesn't fully dissolve. Engineers care about "what do I debug?" Philosophers care about "what is the subject of experience/rights/responsibility?"
      *   *Verdict:* Your view dissolves the *metaphysical* heat but misses the *normative* stakes (see Q4).

  5.  **Addressing Question 2: Shared Resources (Multi-Writer):**
      *   *Scenario:* Shared Google Doc / Couple's Photos.
      *   *Eng View:* Multi-master replication, eventual consistency, shared state.
      *   *Phil View:* EMT usually focuses on individual cognition (Otto and his notebook).
      *   *Analysis:* EMT *can* handle this (Socially Extended Mind), but standard formulations are individualistic.
      *   *Verdict:* Your vocabulary handles it better (shared cache). It doesn't tell against EMT, but it exposes that EMT is often under-specified regarding concurrency control between agents. If two brains write to one notebook, is the notebook part of *both* minds? Yes, in a distributed sense.

  6.  **Addressing Question 3: Trust & Adversarial Edits/Algorithms:**
      *   *Scenario:* Silent edits, Recommendation rankings.
      *   *Eng View:* Cache poisoning, Supply chain attack, Non-deterministic upstream.
      *   *Phil View:* If the environment manipulates you, are *you* thinking, or is it thinking *at* you?
      *   *Translation:* If the external service has a different trust boundary (untrusted input), relying on it as "self" is a security vulnerability. If the algo ranks info, it's injecting latency/bias into the retrieval path.
      *   *Verdict:* This is "Cache Poisoning" or "Upstream Drift." If the external store isn't RO (Read-Only) for the agent, it breaks the "Source of Truth" assumption required for EMT.

  7.  **Addressing Question 4: Normative Stakes (Search vs. Reading Thoughts):**
