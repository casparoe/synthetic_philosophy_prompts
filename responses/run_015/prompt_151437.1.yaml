answer: |-
  Your friend is mistaken because test reliability presupposes you know *what* you are testing for. If you disagree on the concept of death (biological cessation vs. loss of personhood), no amount of lab accuracy resolves the dispute. Your TA is correct: you need the **Concept** (what death *is*), the **Criteria** (clinical signs that the concept is met), and the **Tests** (tools to verify criteria). Without separating these, you cannot explain why a beating heart doesn't always mean life, or why a "dead" body can gestate a fetus.

  Here is the specification for an adequate account of death, designed for the high-stakes hospital decisions you listed.

  ### The Spec: Requirements for an Account of Death

  **1. The Binary Requirement (Non-negotiable)**
  *   **Requirement:** The account must identify a determinate moment when the status flips from "alive" to "dead."
  *   **Consideration:** Legal and social consequences (inheritance, marriage dissolution, organ procurement) require a timestamp. You cannot have a patient who is "sort of dead" for the purposes of a death certificate.
  *   **Status:** Non-negotiable for legal/medical function.

  **2. The Irreversibility Requirement (Non-negotiable)**
  *   **Requirement:** The cessation of function must be permanent; it cannot be restarted by available technology or intervention.
  *   **Consideration:** If the patient can be resuscitated, declaring death is homicide. This distinguishes death from "dying."
  *   **Status:** Non-negotiable, though the definition of "irreversible" (biological impossibility vs. decision not to try) is contested.

  **3. The Moral Significance Requirement (Non-negotiable)**
  *   **Requirement:** The state of being dead must entail a change in moral status (e.g., no further duty to preserve life, permission to intervene on the body).
  *   **Consideration:** If declaring death doesn't justify withdrawing support or harvesting organs, the definition is practically useless.
  *   **Status:** Non-negotiable for the *purpose* of the definition.

  **4. The Biological Reality Requirement (Contested)**
  *   **Requirement:** Death must correspond to a somatic (bodily) fact, not just a social or legal declaration.
  *   **Consideration:** We need to ensure we aren't killing people by fiat. However, some camps argue death is the loss of *personhood* (consciousness), which is not purely biological.
  *   **Status:** Contested. Biological realists demand this; personhood theorists reject it.

  **5. The Public Intelligibility Requirement (Contested)**
  *   **Requirement:** The criteria must be understandable to laypeople (families) without requiring esoteric neuroscience.
  *   **Consideration:** If the definition contradicts common sense (e.g., "this warm, breathing body is dead"), it undermines trust in the medical system.
  *   **Status:** Desired by policy-makers and families, often sacrificed by theorists for ontological precision.

  ---

  ### Stress-Testing the Spec Against Your Cases

  Here is how your five brain-breaking cases interact with the requirements above.

  **(1) The Brain-Dead Patient on a Ventilator**
  *   **Conflict:** Violates **Biological Reality** and **Public Intelligibility**. The body maintains homeostasis (temperature, wound healing), suggesting the organism is integrated.
  *   **Resolution:** To pass the spec, the account must argue that the *brain* is the primary integrator of the organism. Without the brain, the body is merely a collection of functioning tissues, not an organism. If the account cannot explain why a gestating body is "dead," it fails the **Moral Significance** requirement (why take the organs if the organism is alive?).

  **(2) Donation After Circulatory Death (DCD)**
  *   **Conflict:** Violates **Irreversibility**. In DCD, death is declared after circulation stops for 2–5 minutes. It is *permanent* (we won't restart it), but not strictly *irreversible* (we *could* restart it within that window).
  *   **Resolution:** The account must redefine Irreversibility as "permanent cessation of function" rather than "biological impossibility." If it doesn't, DCD is ethically incoherent. This passes the **Binary Requirement** but strains the **Biological Reality Requirement**.

  **(3) The Artificial Isolation Case (Clamped Brain, Pumped Body)**
  *   **Conflict:** Tests **Biological Reality** vs. **Moral Significance**. The body is biologically active; the brain is ischemic.
  *   **Resolution:**
      *   *Whole-Brain Account:* The person is dead. The body is a biological shell.
      *   *Circulatory Account:* The person is alive. Blood is flowing.
      *   *Personhood Account:* The person is dead (no consciousness possible).
      *   *Verdict:* An adequate account must explicitly state whether "human life" resides in the *organism* or the *person*. If it hedges, it fails the **Binary Requirement**.

  **(4) Permanent Vegetative State (PVS)**
  *   **Conflict:** Tests **Moral Significance** vs. **Biological Reality**. The organism is fully integrated (breathing, digesting); the person (consciousness) is gone.
  *   **Resolution:** Most legal accounts say this patient is *alive*. If your account says they are dead, it violates current law and risks the slippery slope of declaring disabled people dead. To be adequate for *current* hospital use, the account must distinguish "loss of personhood" from "death."

  **(5) Technological Relativity of Irreversibility**
  *   **Conflict:** Tests **Irreversibility**. If CPR exists, cardiac death isn't irreversible until CPR is attempted or contraindicated.
  *   **Resolution:** The account must anchor irreversibility to *current clinical capability*, not theoretical physics. Death is relative to the medical context. If the account demands absolute biological impossibility, no one is ever dead (cells live for hours). It must accept "functional irreversibility."

  ---

  ### The Real Tension and The Knockout

  **The Real Tension:**
  You guessed the tension was between "biological event" and "value judgments." The actual tension is between **Biological Gradualism** and **Legal Binary**.
  Biologically, death is a process (cells die at different rates; integration fades). Legally and morally, we need an event (a switch flips). Every account of death is an attempt to draw a bright line on a fading gradient. The tension isn't biology vs. morality; it's *process* vs. *timestamp*.

  **The Knockout Requirement:**
  **The Irreversibility Requirement.**
  This does the most work. If you cannot establish that function cannot be restored, the Binary Requirement cannot be met (you might declare death too soon), and the Moral Significance Requirement cannot be met (withdrawing care becomes killing). Every failed account of death usually collapses because it cannot define "irreversible" without smuggling in a value judgment (e.g., "we won't try to save them" vs. "we can't save them").

  ---

  ### Evaluation of Contenders

  **Whole-Brain Standard**
  *   **Pros:** Satisfies the Binary and Moral Significance requirements well; allows organ donation while the heart beats.
  *   **Cons:** Struggles with Biological Reality (Case 1 & 3); requires accepting that a somatically integrated body is an "organism without a director."

  **Circulatory-Respiratory Standard**
  *   **Pros:** High Public Intelligibility and Biological Reality; easy to verify (no pulse = dead).
  *   **Cons:** Fails Irreversibility in the age of CPR/ECMO; makes DCD (Case 2) conceptually messy; delays organ procurement until somatic damage occurs.

  **Higher-Brain (Consciousness/Personhood) Standard**
  *   **Pros:** Best fits Moral Significance for PVS (Case 4); aligns death with what we actually value (conscious experience).
  *   **Cons:** Fails Biological Reality and Legal Binary; creates dangerous slippery slopes regarding disability; currently illegal in all jurisdictions.
