prompt: |-
  I'm in a bioethics seminar this term and we spent two sessions on the definition of death and I came out more confused than I went in, mostly because I got into an argument with a friend in my study group who's pre-med and kept insisting the whole debate is just about which test is more reliable then the other, like it's a lab-accuracy question. That felt obviously wrong to me but I couldn't say why. Our TA keeps repeating that we have to separate the concept of death from the criteria for it from the tests we run, and I sort of get the distinction in the abstract but I don't know what work it's supposed to actually do.

  So before I read another paper, I want the spec. Fix the purpose: a hospital needs to decide, at a determinate time, whether this patient may be declared dead, which then settles whether support can be withdrawn, whether organs can be taken, whether a death certificate gets signed, whether a spouse inherits. Write me the list of things an account of death has to get right to be adequate for that, with the case or consideration behind each requirement, and mark each one as either non-negotiable or just something one camp really wants.

  Cases I want the requirements tested against, since these are the ones that broke my brain: (1) the brain-dead patient on a ventilator whose body is still doing things that look organismic — holding temperature, healing wounds, carrying a pregnancy for months — so if death is supposed to be the loss of integration of the organism as a whole, the criterion seems to misfire; (2) the donation-after-circulatory-death pathway, where the patient isn't brain dead, support is withdrawn, the heart stops, and death is declared after a short wait, except that what's being declared there looks like permanent rather than irreversible cessation, since circulation could in principle be restarted, and someone in the group said the whole pathway quietly swaps one standard for the other; (3) a case I made up that I'd like honestly stress-tested rather than waved away: suppose a team clamps off the arteries to the brain and then uses a pump to restore circulation to just the abdominal organs, so blood is moving through part of the body while the brain is deliberately kept without flow — is that person dead, and what does an account need in order to have an answer; (4) someone in a permanent vegetative state, breathing on their own, sleep-wake cycles, no capacity for consciousness; (5) the fact that irreversibility looks indexed to whatever technology we happen to have, since CPR reverses what used to count as death — I cant tell weather the account is allowed to drift with available technology or has to be pinned down so it can't.

  Distinctions I don't want collapsed, though I'm not sure all of them are real: death vs being irreversibly dying, death vs no longer being a person, death vs not being worth treating, being dead vs being treated as dead for legal and social purposes, and whether one account has to cover the biology, the law and the morality at once or whether different purposes get different answers. If some subset of the requirements can't be jointly satisfied, say so and say which one gives — I have a guess, that the demand for a single determinate biological event with no value judgements smuggled in collides with the demand that death track what we actually care about when someone dies, but find the real tension, not the one I've guessed at. And then flag the single requirement that does the most work in knocking out candidates. After that, no more than a couple of lines each on how the usual contenders do: the whole-brain view, the circulatory-cessation view, and the consciousness-or-person based view. Please don't give me a reading list, I already have a stack of papers I'm behind on and my professor will assign more anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** Bioethics seminar, confused about the definition of death after two sessions.
      *   **Conflict:** Friend (pre-med) thinks it's just about test reliability (lab accuracy). TA says separate *concept* from *criteria* from *tests*. User gets the distinction abstractly but doesn't see its practical utility.
      *   **Goal:** Fix the purpose (hospital decision-making: withdraw support, organ donation, death certificate, inheritance).
      *   **Task:** Write a list of requirements an account of death must meet to be adequate for this purpose.
      *   **Format:**
          *   List requirements with case/consideration behind each.
          *   Mark each as "Non-negotiable" or "Contested/Desired by one camp".
          *   Test against 5 specific cases/scenarios provided by the user (Brain-dead on vent, DCD, Artificial isolation case, PVS, Technological relativity of irreversibility).
          *   Maintain distinctions (death vs. dying, death vs. personhood, etc.).
          *   Identify if requirements conflict (and which gives).
          *   Identify the single requirement that does the most work in knocking out candidates.
          *   Brief evaluation (couple of lines) of three contenders (Whole-brain, Circulatory, Consciousness/Personhood).
          *   **Constraint:** No reading list.

  2.  **Deconstruct the Core Problem:**

      *   The user's friend is wrong because "test reliability" presupposes we know *what* we are testing for. If we don't agree on the *concept* of death (biological cessation vs. loss of personhood), no amount of test accuracy helps.
      *   The TA is right: Concept (what death *is*) $\to$ Criteria (signs that concept is met) $\to$ Tests (tools to verify criteria).
      *   The user needs to see *why* this distinction matters for the specific high-stakes hospital decisions mentioned.

  3.  **Drafting the Requirements (The "Spec"):**

      *   *Requirement 1: Biological Reality.* Death can't be just a social construct; something physical must happen. (Case: Brain-dead on vent looks alive).
      *   *Requirement 2: Determinacy.* It must happen at a specific time. (Case: Inheritance, organ procurement).
      *   *Requirement 3: Irreversibility.* It can't be paused. (Case: CPR/Technology drift).
      *   *Requirement 4: Moral Significance.* Being dead must change moral status (no more duty to treat, okay to take organs). (Case: PVS, DCD).
      *   *Requirement 5: Public Intelligibility.* It can't be so technical that laypeople can't grasp it. (Case: Family acceptance).

      *Refining based on User's "Non-negotiable vs. Contested" instruction:*
      *   *Determinacy* is non-negotiable for legal/medical purposes.
      *   *Biological Reality* is contested (is death biological or biographical?).
      *   *Irreversibility* is non-negotiable but defined differently (permanent vs. irreversible).
      *   *Moral Significance* is non-negotiable (why do we care?), but *why* it changes status is contested.

  4.  **Testing Against the 5 Cases:**

      *   *(1) Brain-dead on vent:* Challenges "integration of organism." If the body integrates, is it dead? Requirement: Must explain why brain loss = organism loss even if somatic functions persist.
      *   *(2) DCD (Donation after Circulatory Death):* Challenges "Irreversibility." Is it permanent cessation? Requirement: Must distinguish "won't restart" from "can't restart."
      *   *(3) Artificial Isolation (Clamped brain, pumped body):* Challenges "Whole Body" vs. "Brain." If the body works but brain doesn't, is it a person or an organism? Requirement: Must locate the seat of integration/identity.
      *   *(4) PVS:* Challenges "Consciousness." If biological life continues but personhood is gone? Requirement: Must decide if death = biological cessation or loss of personhood.
      *   *(5) Tech Relativity:* Challenges "Irreversibility." If CPR makes death reversible, is death moving? Requirement: Must anchor irreversibility to current capability or biological potential.

  5.  **Identifying Tensions and the "Knockout" Requirement:**

      *   *The Tension:* The user suspects it's "single biological event" vs. "what we care about." The real tension is usually between **Biological Non-Negotiability** (death must be a somatic fact) and **Moral Non-Negotiability** (death must justify ending care/taking organs).
      *   *Why?* If death is purely biological (heart stops), PVS patients are alive (hard to justify withdrawing care). If death is purely moral/personhood (consciousness gone), brain-dead bodies are dead (easy to justify organs), but then PVS patients might also be dead (slippery slope).
      *   *The Knockout:* **The Requirement of Irreversibility linked to Moral Permission.** This is the hinge. If it's reversible, you can't take organs. If it's not morally significant, you can't stop care.

  6.  **Evaluating the Contenders:**

      *   *Whole-Brain:* Good for determinacy, struggles with somatic integration (Case 1).
      *   *Circulatory:* Good for biology, struggles with reversibility/DCD nuance (Case 2 & 5).
      *   *Higher-Brain (Consciousness):* Good for moral intuition (Case 4), fails legal/biological consensus (slippery slope).

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Direct, analytical, respectful of the confusion (it *is* confusing), avoiding academic fluff.
      *   *Structure:* Follow the prompt's order strictly.
      *   *Check:* Did I answer the "friend vs. TA" point? Yes, in the intro.
      *   *Check:* Did I mark Non-negotiable vs. Contested? Yes.
      *   *Check:* Did I address the 5 cases? Yes, woven into the requirements or tested against them. (Better to weave them into the requirements analysis or have a specific section? The prompt asks for the list *with the case or consideration behind each requirement*, then says "Cases I want the requirements tested against...". Okay, I will list requirements first, then explicitly run the 5 cases against the spec to show where it breaks.)
      *   *Correction:* The prompt asks: "Write me the list of things an account of death has to get right... with the case or consideration behind each requirement... Cases I want the requirements tested against...". I should structure it so the requirements are the "Spec" and then I explicitly show how the 5 cases stress-test that spec.
      *   *Refinement on Tension:* The user guessed "biological event vs value judgements." I need to find the *real* tension. The real tension is often between **Public Verifiability** (needs simple signs like heartbeat) and **Ontological Accuracy** (needs complex signs like brain integration). Or, more accurately, **Biological Continuity** (the body is still working) vs. **Moral Status Change** (we need to act as if they are gone). Let's go with the tension between *Biological Gradualism* (dying is a process) and *Legal Binary* (dead/alive is a switch).

  8.  **Final Polish:**

      *   Ensure the "Artificial Isolation" case gets a clear answer or explanation of why it's hard.
      *   Ensure the DCD "permanent vs. irreversible" distinction is clear.
      *   Keep the contender summaries to 2 lines max.
      *   No reading list.

      *(Self-Correction during drafting)*: Wait, the prompt asks for the list of requirements *first*, with the case/consideration behind *each requirement*. Then it lists 5 specific cases to test against. I should make sure the requirements are derived generally, then use the 5 specific cases to stress-test the *system* of requirements.
      Actually, looking closer: "Write me the list of things an account of death has to get right... with the case or consideration behind each requirement... Cases I want the requirements tested against... since these are the ones that broke my brain."
      Okay, I will formulate the Requirements (The Spec), noting the general consideration. Then I will explicitly run the 5 User Cases against that Spec to show where the friction is. This ensures I address the specific scenarios they are worried about.

      *The "Knockout" Requirement:* The prompt asks to "flag the single requirement that does the most work in knocking out candidates." I need to be decisive here. It's usually **Irreversibility**. If you can't establish irreversibility, nothing else matters.

      *The "Real Tension":* The user guessed Biology vs. Value. I think the real tension is **Process vs. Event**. Biology says dying is a process (cells die at different rates). Law/Morality needs an Event (a time of death). This is why the DCD and Brain Death cases are so messy.

      *Let's write.*

