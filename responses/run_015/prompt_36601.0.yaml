      *   *Section 4: Epistemic Justice.* Expand on the user's intuition. The apartheid state relied on lies/disappearance. Truth is the specific antidote to that specific harm.
      *   *Conclusion:* Summarize. The TRC wasn't perfect justice; it was *possible* justice.

  6.  **Refining the Philosophical Nuance:**

