prompt: |-
  So I've been reading up on the South African TRC and something keeps bugging me. The amnesty deal worked like this: a perpetrator who came forward and gave full disclosure of all relevant facts about a politically motivated act could get individual amnesty for that act — no criminal prosecution, and no civil liability either, which meant victims couldn't even sue afterwards. But the weird part is the Act never required anyone to be sorry. You could give a flat, self-serving, totally unapologetic account of what you did, and as long as it counted as full disclosure and the act passed the political-objective and proportionality tests, you walked. Meanwhile the victim hearings ran on a completly different logic — victims testified in non-adversarial hearings where their statements were basically taken at face value (they were never cross-examined the way amnesty applicants were), and the whole point was restoring their dignity, not gathering evidence for anything. So the machine seems to run on the idea that what victims are owed is mainly knowledge — who did it, where the bodies are, why their son never came home — and that a public confession under oath is itself a form of accountability that can stand in for a trial. What theory of justice is that presupposing? Does it only make sense on a restorative view where the wrong is partly epistemic, or is it a kind of second-best story where truth is just the best currency available when prosecuting thousands of perpetrators is impossible? And I can't tell if the two halves of the commission are even consistent with each other — the amnesty committee treated confession as a cost the perpetrator pays, while the human rights violations committee treated testimony as a benefit the victim recieves. Same speech act, opposite direction of fit. Also: what would have to change if you rebuilt the whole thing on a straight retributive theory — does it just collapse, or is the disclosure requirement basically a plea bargain with a moralized label slapped on it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Subject:** South African Truth and Reconciliation Commission (TRC).
      *   **Specific Mechanism:** The Amnesty Committee vs. The Human Rights Violations Committee (Victim Hearings).
      *   **Key Observation 1:** Amnesty required full disclosure + political motive + proportionality, but *not* remorse/apology.
      *   **Key Observation 2:** Victim hearings were non-adversarial, focused on dignity/restoration, statements taken at face value.
      *   **Key Observation 3:** The underlying logic seems to be that victims are owed *knowledge* (truth) and public confession acts as accountability replacing trial.
      *   **Questions:**
          1.  What theory of justice is this presupposing? (Restorative? Epistemic? Second-best pragmatic?)
          2.  Are the two halves (Amnesty vs. Victim Hearings) consistent with each other? (Confession as cost vs. Testimony as benefit).
          3.  What if rebuilt on a straight retributive theory? (Collapse? Plea bargain?)

  2.  **Analyze Question 1: Theory of Justice:**

      *   *Restorative Justice:* This is the obvious label the TRC used (Desmond Tutu's influence). It focuses on healing relationships, community, and dignity rather than punishment.
      *   *Epistemic Justice:* The user hits on this ("wrong is partly epistemic"). Victims were silenced under apartheid; giving them voice restores epistemic agency. Truth is a form of reparation.
      *   *Transitional Justice:* This is the broader field. It acknowledges the "second-best" nature (non-ideal theory). It's not pure retribution or pure restoration, but a hybrid necessitated by political constraints (the "sunset clause," threat of civil war).
      *   *Deliberative Democracy:* Public reasoning, creating a shared history.
      *   *Synthesis:* It's a hybrid. It's *Restorative* in aim, *Transitional* in context (pragmatism), and *Epistemic* in method. It rejects the retributive monopoly on justice.

  3.  **Analyze Question 2: Consistency of the Two Halves:**

      *   *User's Insight:* "Confession as cost (perpetrator) vs. Testimony as benefit (victim)." This is a sharp philosophical observation (direction of fit).
      *   *Amnesty Side:* Transactional. Truth for Freedom. The speech act is a *currency*.
      *   *Victim Side:* Therapeutic/Narrative. Truth for Dignity. The speech act is *healing*.
      *   *Tension:* Yes, there is a tension. Perpetrators could be cold and clinical (meeting the legal standard) while victims were emotional and vulnerable. This created a perceived imbalance (perpetrators walking free vs. victims getting only "truth").
      *   *Reconciliation:* The TRC argued that the *public nature* of the amnesty confession linked the two. The perpetrator's cold truth validates the victim's painful truth. But functionally, the user is right: the *value* of the speech act differed. One bought immunity; the other bought recognition.

  4.  **Analyze Question 3: Retributive Rebuild:**

      *   *Retributive Theory:* Justice = Punishment proportional to harm. Guilt must be proven beyond reasonable doubt.
      *   *Impact on Disclosure:* In a retributive system, self-incrimination is avoided (right to silence). Full disclosure is rare unless it's a plea bargain.
      *   *Plea Bargain Comparison:* The user asks if it's just a plea bargain with a moral label.
          *   *Similarity:* Trade info for leniency.
          *   *Difference:* Plea bargains usually still involve conviction/probation/jail time. TRC amnesty was *total* immunity (no criminal, no civil).
          *   *Difference:* Plea bargains are private/efficient. TRC amnesty was public/narrative-building.
      *   *Collapse?* If you demand retribution (trials for all), the system likely collapses due to volume (thousands of perpetrators), lack of evidence (time passed, evidence destroyed), and political instability (military coup risk). The Nuremberg model doesn't scale to a whole society's security apparatus without risking democratic transition.

  5.  **Drafting the Response (Iterative Process):**

