      *(Self-Correction during drafting)*: I need to make sure I don't defend the TRC uncritically. The user's skepticism about the "no apology" rule is valid and shared by many critics. I should highlight that the *lack* of remorse requirement was a deliberate legal choice to maximize truth yield, even at the cost of moral satisfaction.

      *(Refining the "Plea Bargain" point)*: A plea bargain admits guilt to secure a *sentence*. TRC amnesty erased the *crime*. That's a crucial distinction. It's more like "King's Evidence" on steroids or a sovereign pardon conditioned on truth.

