answer: |-
  You claim the gear was turning in the bone,
  Before the hand learned the clockmaker's art,
  No space to slip a "you" inside the part,
  No ghost to claim the ticking as its own.
  The chemistry was seed and fully sown,
  Before the drinking even made a start,
  No gap where free intention could restart,
  The fall was gravity, and you were stone.

  Yet here the polished mechanism breaks.
  Steel feels no terror for the time it keeps,
  Nor wakes in night to count the cost it reaps.
  Only a man remembers what he makes.
  You want a ghost to save you from the plan,
  But you are both the weapon and the man.

  ***

  **Where the poem cheats:** It leans on a Compatibilist reading that equates "feeling guilt" with "being the author," bypassing the regress problem (who built the man who feels guilt?). The objection: a hard determinist would argue the terror is just another gear turning, proving nothing about ownership, only causality.
