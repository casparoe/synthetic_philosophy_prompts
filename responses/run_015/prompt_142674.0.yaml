prompt: |-
  I'm taking a course on virtue ethics and the situtationist critique is really messing with my head, so I'm trying to check my gut on concrete cases to see if I actually buy into character traits or not. Here are my verdicts: Maria usually lies politely about small stuff, but she told her partner about her affair even though it destroyed the relationship — I think that's real integrity, not just a habit. Jake donates 20% of his income every year, but he does it mostly for tax breaks and to impress people at church; I don't think he's genuinely generous. Dr. Lee is incredibly patient with patients during 12-hour shifts, but she's abusive to her nurses behind closed doors — I feel like she's not actually patient, that's just professional masking. Then there's the random bystander with zero history of altruism who pulls a kid from a burning car and then goes back to being totally self-centered; I think that reveals hidden courage, even if it never shows up again. A student refuses to cheat on an exam when everyone else is cheating and there's literally zero risk of getting caught — that's real integrity too. But my roommate, who is usually kind, was cruel to a waiter when he was sleep-deprived and stressed about finals — I'm going back and forth, is that just the situation talking, or does it prove he's not kind at all?

  Can you lay out a principel, or maybe a couple candidates, that gets as many of these verdicts right as possible? For each one, tell me which cases it saves and which it has to throw out, and be honest about whether it can reconcile case F with case D. I was also chatting with friends about "moral topology" — the idea that virtues have different shapes depending on whether they're reactive, like sudden rescue, versus proactive, like sustained patience — and whether that distinction actually helps here or just adds noise. First give me the analysis in prose, then put a brief structured summary in a JSON object with these fields: principle_name (string, name of the principle), core_claim (string, one-sentence summary), saves_cases (array of case letters it handles well), fails_on (array of case letters it cannot save), roommate_f_verdict (string, what the principle says about my roommate), and moral_topology_note (string, whether the reactive/proactive distinction helps reconcile the tension).
