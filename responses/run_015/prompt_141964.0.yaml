  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a review panel for a foundation's decadal programme grants (15 programmes, 10-year commitments, reviewed every 3 years).
      *   **Problem:** Current rubric ("scientific quality and promise") is too vague, rewards publication volume over genuine progress, and can't distinguish between learning and ad-hoc saving of a theory.
      *   **Proposed Solution:** Base the rubric on Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Constraints:** 2 days total, ~30 mins discussion per programme, 40 pages of reading per programme. Needs to be actionable, defensible against appeals, and understandable by scientists (not philosophers).
      *   **Specific Challenges to Address:**
          1.  *Novelty:* Temporal novelty vs. use-novelty (was the fact used to construct the theory?).
          2.  *Hard Core:* How to identify what's protected vs. what's evasive maneuvering (moving the goalposts).
          3.  *Timing/Grace:* How to judge degenerating programmes when no rival exists (the "monopoly" problem).
          4.  *Bibliometrics:* Where do citation counts fit?
      *   **Deliverables:**
          1.  A written procedure (questions, order, sufficient answers, evidence, stop points, value judgment handoffs).
          2.  A one-page glossary (Lakatosian terms to scientist language).
          3.  Application to three specific cases (Nickelates, Cross-field connection, The "Monopoly" legacy programme).
          4.  Failure analysis (what the procedure over-rates, kills, or can't tell).

  2.  **Deconstruct Lakatos for Funding Context:**

      *   *Core Concept:* A Research Programme (RP) has a "Hard Core" (irrefutable by convention) and a "Protective Belt" (auxiliary hypotheses).
      *   *Progress:* A programme is *theoretically progressive* if it predicts novel facts. It is *empirically progressive* if some of those predictions are corroborated. It is *degenerating* if it only explains past facts via ad-hoc adjustments.
      *   *Funding Twist:* We aren't judging truth; we are judging *investment potential*. A degenerating programme might still be the only game in town.
      *   *Novelty Decision:* For funding, *use-novelty* is better than *temporal novelty*. Temporal novelty penalizes slow fields or fields where data exists but wasn't looked at. Use-novelty rewards risk (predicting something not used to build the model).
      *   *Hard Core Decision:* Needs to be declared *ex-ante*. If they change the core mid-stream without admitting it, that's evasion.
      *   *Grace Period:* Lakatos says don't reject too soon. But funders have finite money. Need a "Sunset vs. Sustain" rule based on the existence of rivals.
      *   *Bibliometrics:* Citations measure influence/attention, not necessarily progress. They belong in "Impact/Community Health," not "Scientific Progress."

  3.  **Drafting the Procedure (The "Lakatosian Funding Protocol"):**

      *   *Structure:* Pre-reading -> Discussion Flow -> Decision Matrix.
      *   *Time Management:* 30 mins is tight. Need to focus on the *Ledger of Predictions*.
      *   *The "Hard Core" Contract:* Applicants must define their non-negotiables at the start of the 3-year cycle.
      *   *The "Novelty" Rule:* Adopt *Use-Novelty*. Did the model use this data point to tune parameters? If no, it counts as a prediction.
      *   *The "Ad-Hoc" Test:* Did the adjustment increase content (predict something else) or just fit the anomaly?
      *   *The "Monopoly" Clause:* If degenerating but no rival, fund for maintenance/knowledge preservation, but cap growth.

  4.  **Drafting the Glossary:**

      *   Translate "Hard Core" to "Foundational Assumptions."
      *   Translate "Protective Belt" to "Adjustable Parameters/Conditions."
      *   Translate "Progressive Problem Shift" to "New Discoveries Driven by Model."
      *   Translate "Degenerating Problem Shift" to "Fitting Past Data Only."
      *   Translate "Use-Novelty" to "Out-of-Sample Prediction."

  5.  **Running the Cases:**

      *   *Case 1 (Nickelates):* High output, but ad-hoc adjustments (strain, oxygen) after failures.
          *   *Verdict:* Degenerating. Adjustments save the core but don't predict new things. *Decision:* Defund or severe cut.
      *   *Case 2 (Cross-field):* Low output, but connected unrelated known quantities.
          *   *Verdict:* Progressive (Use-Novelty). The fact existed, but the *connection* was novel and risky. *Decision:* Fund.
      *   *Case 3 (The Monopoly):* Elegant, cited, but no new predictions. Only game in town.
          *   *Verdict:* Degenerating scientifically, but strategically essential.
          *   *Decision:* "Zombie Funding." Maintain baseline, no growth, explicit warning. This answers the user's fear honestly.

  6.  **Analyzing Failure Modes:**

      *   *Over-rate:* Bold but wrong guesses that look like predictions by luck.
      *   *Kill:* Exploratory/descriptive science that doesn't fit the "prediction" mold (e.g., taxonomy, sequencing).
      *   *Can't Tell:* Deep conceptual shifts where the "Hard Core" changes legitimately (Kuhnian revolutions vs. Lakatosian shifts).

  7.  **Refining the Tone:**

      *   Needs to be authoritative, precise, and empathetic to the Chair's position.
      *   Must acknowledge the tension between philosophy and bureaucracy.
      *   The "Monopoly" case needs to be handled delicately but firmly.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 30 minutes enough for this depth?
      *   *Fix:* Emphasize the *Ledger* as the primary evidence. If it's not in the Ledger, it didn't happen. This simplifies the review.
      *   *Critique:* Is "Use-Novelty" too hard to verify?
      *   *Fix:* Require a timestamped pre-registration or internal memo for predictions.
      *   *Critique:* What about the trustee wanting citations?
      *   *Fix:* Explicitly relegate citations to a "Community Engagement" metric, separate from "Scientific Progress."

  9.  **Final Polish:** Check against all constraints in the prompt (glossary length, specific case details, failure analysis). Ensure the "Monopoly" verdict is clear. (The prompt asks: "I want to know honestly what your procedure says about the third one... I expect it to say something I won't like.") I must deliver that hard truth.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the operational procedure, glossary, case analysis, and failure mode assessment you requested. It is designed to be inserted directly into your panel's handbook.

  ***

  # The Decadal Review Protocol: Methodology of Research Programmes (MRP)

  **Objective:** To distinguish between *progressive* programmes (generating new knowledge) and *degenerating* programmes (absorbing anomalies without new insight), ensuring fixed funds are allocated to the former while managing risk on the latter.
  **Time Allocation:** 30 minutes per programme.
  **Primary Evidence:** The *Prediction Ledger* (submitted by PI), the *Self-Study*, External Letters.
  **Secondary Evidence:** Bibliometrics (restricted use).

  ## Part I: The Review Procedure

  ### Phase 1: Pre-Reading (Reviewer Responsibility)
  Before the panel meets, each reviewer must verify the **Prediction Ledger**. This is a table submitted by the programme at the start of the 3-year cycle listing:
  1.  **The Prediction:** Specific quantitative or qualitative outcome.
  2.  **The Date:** When the prediction was registered (must precede data collection/analysis).
  3.  **The Status:** Confirmed, Refuted, or Inconclusive.
  4.  **The Novelty Class:** *Temporal* (fact did not exist) or *Use* (fact existed but was not used to build the model).

  *If a programme fails to submit a Ledger, they are automatically ineligible for "Progressive" status.*

  ### Phase 2: Panel Discussion Flow (30 Minutes)

  **Step 1: The Hard Core Check (5 Minutes)**
  *   **Question:** Did the programme alter its foundational assumptions (Hard Core) to survive an anomaly without declaring it a shift in strategy?
  *   **Evidence:** Compare current Self-Study against the Ledger and previous cycle's grant agreement.
  *   **Sufficient Answer:** "No changes to core assumptions," OR "Core assumption X was abandoned, declared as a strategic pivot, and justified by new external opportunities."
  *   **Fail Condition:** Core assumptions were modified *ad hoc* to fit data, but the programme claims the core remains unchanged.
  *   **Action:** If **Fail**, mark as *Degenerating*. Proceed to Step 4 (Monopoly Check). If **Pass**, proceed to Step 2.

  **Step 2: The Novelty Audit (10 Minutes)**
  *   **Question:** Of the confirmed predictions in the Ledger, how many qualify as *Use-Novel*?
  *   **Rule:** A fact is *Use-Novel* if it was not used to construct or tune the model parameters, even if the fact was already known in the literature.
  *   **Evidence:** Ledger timestamps vs. publication dates of data sources. External letters confirming the connection was non-trivial.
  *   **Sufficient Answer:** At least one major confirmed prediction per 3-year cycle that was *Use-Novel*.
  *   **Action:** If **Yes**, mark as *Progressive*. Skip to Step 5. If **No**, proceed to Step 3.

  **Step 3: The Protective Belt Test (10 Minutes)**
  *   **Question:** When predictions failed, did the auxiliary adjustments (Protective Belt) lead to *new* testable consequences, or did they merely fit the existing anomaly?
  *   **Evidence:** Papers published in response to failed predictions. Do they predict something *else* that was subsequently checked?
  *   **Sufficient Answer:** "Adjustments led to new independent tests."
  *   **Fail Condition:** "Adjustments only explained the failure without generating new tests."
  *   **Action:** If **Fail**, mark as *Degenerating*. Proceed to Step 4.

  **Step 4: The Monopoly Clause (Strategic Override)**
  *   **Question:** Is this programme the sole remaining custodian of this explanatory framework globally?
  *   **Evidence:** External letters, bibliometric mapping of competing groups.
  *   **Decision Rule:**
      *   If **No Rivals Exist:** Fund at *Maintenance Level* (cover personnel/equipment, no expansion). Rationale: Knowledge preservation.
      *   If **Rivals Exist:** Defund. Rationale: Resources should shift to the rival programme that is progressive.
  *   **Action:** Assign "Maintenance" or "Termination" code.

  **Step 5: Bibliometric & Community Health (5 Minutes)**
  *   **Question:** Is the programme engaging the community, regardless of progress status?
  *   **Evidence:** Citation counts, invited talks, training of PhDs.
  *   **Rule:** Citations measure *influence*, not *truth*. High citations + Degenerating status = "Influential but Stagnant."
  *   **Action:** Use this to adjust the *Maintenance Level* (e.g., high influence may justify slightly higher maintenance funding for training purposes), but never to upgrade a Degenerating programme to Progressive.

  ### Phase 3: The Decision Matrix

  | Progress Status | Rival Status | Funding Recommendation |
  | :--- | :--- | :--- |
  | **Progressive** | Any | **Full Renewal + Growth** (Top Tier) |
  | **Degenerating** | Rivals Exist | **Defund** (Redirect to rival) |
  | **Degenerating** | No Rivals (Monopoly) | **Maintenance Only** (Zombie Status) |
  | **Unclear** | Any | **Short-term Extension** (1 year only to clarify) |

  ***

  ## Part II: Glossary for Reviewers (One Page)

  | Lakatosian Term | Operational Definition for Scientists | What to Look For |
  | :--- | :--- | :--- |
  | **Research Programme** | The entire 10-year grant entity (multiple groups, shared theory). | The whole package, not individual papers. |
  | **Hard Core** | **Foundational Assumptions.** The claims the team agrees are non-negotiable for this grant cycle (e.g., "Gravity is geometric," "Markets are efficient"). | Check the original grant proposal. If they change this without admitting it, it is evasion. |
  | **Protective Belt** | **Adjustable Parameters.** The auxiliary hypotheses, initial conditions, or measurement constraints added to protect the Core (e.g., "friction coefficients," "noise filters"). | Are these adjustments adding new physics/biology, or just fitting curves? |
  | **Use-Novelty** | **Out-of-Sample Prediction.** The model predicted a fact that was *not used to tune the model*. The fact may have existed previously in a different field. | Did they predict a connection between Dataset A and Dataset B that no one had linked before? |
  | **Temporal Novelty** | **New Discovery.** The model predicted a fact that did not exist before the prediction was made. | Standard prediction. Good, but Use-Novelty is sufficient for us. |
  | **Progressive Problem Shift** | **Gaining Ground.** The programme predicts *and confirms* new facts. | Look for "We predicted X, we looked, X was there." |
  | **Degenerating Problem Shift** | **Losing Ground.** The programme only explains past data by adding complexity, without predicting new facts. | Look for "We didn't find X, so we added parameter Y to explain why." |
  | **Ad Hoc Hypothesis** | **A Patch.** An adjustment that explains the anomaly but predicts nothing else. | If the paper ends at the explanation, it's likely ad hoc. If it says "therefore we should see Z," it's progressive. |
  | **Monopoly** | **Sole Custodian.** No other group globally is working on this Hard Core. | If you kill this, the knowledge dies. Fund for preservation, not growth. |

  ***

  ## Part III: Application to Cases

  ### Case 1: The Nickelate Superconductors
  *   **Profile:** 30 investigators, 140 papers/3 years. Predicted specific transition temp. Failed. Added strain/oxygen parameters to fit.
  *   **Protocol Run:**
      *   *Hard Core:* Intact (still claiming nickelates superconduct).
      *   *Novelty:* The initial prediction was novel, but it failed.
      *   *Protective Belt:* Adjustments (strain/oxygen) were made *after* failure.
      *   *Ad Hoc Test:* Did the strain parameters predict a *new* transition in a different material? The prompt implies they were added "to keep the fit."
      *   *Verdict:* **Degenerating.** The adjustments are saving the core without generating new, confirmed predictions. The high paper count is "noise" (fitting parameters), not signal.
      *   *Funding:* **Defund.** (Unless they are the only group doing nickelates, then Maintenance). Given 30 investigators, rivals likely exist.
      *   *Rationale:* High output is masking a degenerating shift. They are solving puzzles within the belt, not expanding the core.

  ### Case 2: The Cross-Field Connection
  *   **Profile:** 2 groups. Model predicted quantitative relationship between two quantities measured years earlier in unrelated literature. Connection holds. Specialists surprised.
  *   **Protocol Run:**
      *   *Hard Core:* Intact.
      *   *Novelty:* **Use-Novel.** The data existed (temporal novelty = no), but it was not used to build the model (use novelty = yes). The connection was risky.
      *   *Protective Belt:* No ad hoc saving needed; the prediction succeeded.
      *   *Verdict:* **Progressive.** This is exactly what Use-Novelty captures. Unifying disparate data is a hallmark of theoretical progress.
      *   *Funding:* **Full Renewal + Growth.**
      *   *Rationale:* Do not penalize them because the data was "old." The *theoretical link* was the new prediction.

  ### Case 3: The Legacy Monopoly (Your Doctorate)
  *   **Profile:** 15 years old. Elegant, highly cited refinements. Absorbs every anomaly. No confirmed new prediction since your postdoc. Only programme left (rivals defunded).
  *   **Protocol Run:**
      *   *Hard Core:* Intact.
      *   *Novelty:* None confirmed in 6+ years.
      *   *Protective Belt:* Constant adjustment to absorb anomalies ("elegant refinements").
      *   *Verdict:* **Scientifically Degenerating.** It meets the definition: it explains the past but predicts nothing new.
      *   *Monopoly Check:* **Yes.** Rivals were defunded.
      *   *Funding:* **Maintenance Only (Zombie Status).**
      *   *Rationale:* This is the hard truth you requested. Scientifically, the programme is dead; it is a machine for producing citations and explaining past data. However, because it is the *only* custodian of this framework, defunding it erases the institutional memory and capacity to restart if a revival occurs.
      *   *Condition:* Funding is capped at current personnel levels. No new PhD slots. No equipment upgrades. The PI must submit a "Revival Plan" predicting one Use-Novel fact for the next cycle, or face termination.
      *   *Trustee Note:* Citations here measure the programme's dominance and utility to others, not its scientific vitality. They justify the *Maintenance*, not the *Progress*.

  ***

  ## Part IV: Failure Mode Analysis

  No rubric is perfect. Here is where this procedure will misfire, so you can anticipate appeals.

  **1. What it will Systematically Over-Rate:**
  *   **The Lucky Guesser:** A programme that makes a wild, low-probability prediction that happens to come true will be rated *Progressive*, even if their theory is incoherent.
      *   *Mitigation:* Require the *mechanism* of the prediction to be detailed in the Ledger, not just the outcome.
  *   **The Slow Burn:** Fields where data takes 10 years to collect (e.g., longitudinal epidemiology, astrophysics) may look *Degenerating* in 3-year windows.
      *   *Mitigation:* Allow "Intermediate Milestones" in the Ledger (e.g., "Instrument calibrated to detect X") to count as minor progressive shifts.

  **2. What it will Systematically Kill:**
  *   **Descriptive/Exploratory Science:** Programmes focused on taxonomy, sequencing, or data gathering without a strong theoretical core cannot generate "predictions." They will fail the Hard Core check.
      *   *Mitigation:* Create a parallel track for "Infrastructure/Data Programmes" that is not judged by Lakatosian criteria but by data utility/accessibility.
  *   **High-Risk Paradigm Shifts:** A programme attempting to overthrow its own Hard Core (a Kuhnian revolution) will look *Degenerating* initially because it loses explanatory power before gaining it.
      *   *Mitigation:* The "Short-term Extension" option. If a PI declares a "Core Shift," grant 1 year to demonstrate the new core has potential.

  **3. What it Simply Cannot Tell Us:**
  *   **Truth:** A *Progressive* programme is not necessarily *True*. It is merely more heuristic than the rival. You are funding the horse that is running, not necessarily the one that is right.
  *   **Societal Impact:** A programme can be *Progressive* (predicting new particles) and useless, or *Degenerating* (tweaking an economic model) and highly policy-relevant.
      *   *Mitigation:* Keep the "Societal Impact" assessment entirely separate from the "Scientific Progress" assessment. Do not conflate them.

  ### Final Note to the Chair
  Regarding Case 3: You noted you would rather hear the hard truth from a rubric than a trustee. The rubric says your former programme is a **Zombie**. It is scientifically degenerating. It survives only because you killed the competition. This is not a moral failing of the PI; it is a structural reality of funding monopolies. By classifying it as *Maintenance*, you protect the foundation from accusations of destroying a field, while signaling to the PI and the community that the era of growth is over. This allows you to defend the decision to appellants: "We are not denying your science is useful; we are acknowledging it is no longer generating new knowledge."
