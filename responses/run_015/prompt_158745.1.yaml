  ### Moratorium Strategy
  *   **Decision:** **Pre-empt it in the talk.**
  *   **Reasoning:** If you wait, the fear will dominate the Q&A. You need to frame the narrative early: "This research is to *prevent* unnecessary moratoria by providing clarity."
