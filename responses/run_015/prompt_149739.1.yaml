answer: |-
  Here is the battle plan for your roommate. Since she's a Mech Eng undergrad, speak in terms of **systems, inputs, and outputs**. Avoid philosophy jargon where possible.

  ### 1. The Teaching Order (Logical Flow)
  You cannot distinguish the three until you define the baseline. Do not start with "Judgment" or she will tune out. Start with her turf, then expand.

  1.  **Feeling (The Output/Qualia):** Acknowledge her view first. "Yes, chemicals and neural firing create the *sensation*." This is the raw data.
  2.  **Judgment (The Control Logic):** Introduce the Thermostat here. "This is the comparison of *Current State* vs. *Goal State*." This is the code, not the sensation.
  3.  **Perception (The Sensor Input):** "This is reading the temperature (external) or the heart rate (internal)."

  **Why this order?** If you start with Judgment, she'll argue it's just "more chemicals." By validating Feeling first, you secure agreement. Then you use the Thermostat to prove Judgment can exist *without* Feeling. Finally, you use a human example to prove Feeling can exist *without* Judgment.

  ### 2. How to Use the Thermostat Anchor
  Use the thermostat to split **Judgment** from **Feeling**.

  *   **The Setup:** "Imagine the thermostat logs an error: *'Target 72°, Actual 65°, Effort Maxed. Status: Frustrated.'*"
  *   **The Argument:**
      *   **Does it have Judgment?** Yes. It evaluated a goal mismatch (65 < 72).
      *   **Does it have Perception?** Yes. It read the sensor.
      *   **Does it have Feeling?** No. It has no body to feel stress, no adrenaline, no qualia.
  *   **The Takeaway:** "If the thermostat can have 'frustration' (goal failure) without 'feeling' (chemicals), then in humans, these two things must be separable components, not the same thing."

  ### 3. The Single Best Real-World Example
  **The "Accidental Bump" Reflex (Startle-Snap).**

  *   **The Scenario:** You're walking down the street. Someone bumps hard into your shoulder from behind.
  *   **The Reaction:** You instantly whip around, face tight, muscles tensed, ready to snap at them (Anger/Aggression).
  *   **The Timing:** This happens in ~200 milliseconds.
  *   **The Kicker:** A split second later, you realize it was a blind spot or they were pushed. You relax.
  *   **Why it works:** You felt the **Anger** (Feeling/Physiology) *before* you made the **Judgment** ("Did they mean to do that?"). If anger required judgment, you wouldn't get angry until *after* you decided they were rude. The physiology preceded the cognition.

  ### 4. Misconceptions & When to Head Them Off

  | Misconception | When it will pop up | How to head it off |
  | :--- | :--- | :--- |
  | **"If I feel it, it's just a feeling."** (Conflating Emotion with Sensation) | **Immediately.** When you define Feeling. | **Pre-empt it:** "Feeling is the dashboard light. Emotion is the whole engine status. The light can be on (Feeling) even if the sensor is broken (No Judgment)." |
  | **"It's all just brain chemicals anyway."** (Reductionism) | **During the Thermostat analogy.** | **Counter:** "Chemicals are the *electricity* running the thermostat. But 'Frustration' is the *code logic*. You can't explain the code just by listing the voltage." |
  | **"The thermostat is just a metaphor."** | **During the Synthesis.** | **Counter:** "It's not a metaphor for human emotion; it's an isolation test. It proves 'Goal Failure' (Judgment) doesn't *need* a body to exist functionally." |

  ### 5. What to Skip
  *   **Appraisal Theory:** It's too academic and essentially just "Judgment Theory" with extra steps. It will bog you down in cognitive nuance you don't need.
  *   **Constructivism vs. Essentialism:** Don't get into whether emotions are "real" categories or constructed by the brain. Stick to the functional components.
  *   **Neuroanatomy:** Don't name-drop the amygdala or prefrontal cortex unless she asks. Keep it at "System 1 vs. System 2" or "Reflex vs. Logic."

  ### 6. The End-Check (Is it just semantics?)
  Ask her this to verify she gets the functional difference:

  > "If we developed a pill that removed the *chemical feeling* of anxiety (no heart racing, no dread), but you still logically knew a situation was dangerous and avoided it... did we cure the emotion?"

  *   **If she says "Yes":** She thinks Emotion = Feeling. (She missed the point).
  *   **If she says "No, you just removed the symptom, the judgment is still there":** **She gets it.** You've successfully distinguished the Feeling from the Judgment.
  *   **If she says "It depends on if the avoidance is automatic":** **She really gets it.** (This touches on Perception/Reflex).

  **Summary Script:**
  *"Start with the chemicals (Feeling), show me the thermostat logic (Judgment), then hit me with the accidental bump (Feeling without Judgment). If I can see those three things moving independently, I'll stop calling it all just 'brain juice'."*
