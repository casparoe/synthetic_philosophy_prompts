  1.  **Analyze the User's Position:**
      *   **Core View:** Perdurantism (objects are spacetime worms).
      *   **Modification 1 (Thick Parts):** Temporal parts are not instantaneous time-slices but "career-sized chunks" (processes, episodes).
          *   *Reasoning:* Instantaneous slices can't bear dynamic properties (moving, bending, thermal equilibrium).
          *   *Implication:* Properties are borne by extended temporal regions, not points in time.
      *   **Modification 2 (Interest-Relativity/Conventionalism):** There is no single correct decomposition into chunks. It depends on pragmatic interests (like carving a coastline).
          *   *Implication:* Anti-realist about temporal mereology.
      *   **Goal:** Stress-test this view. Find defeaters. Distinguish fatal flaws from awkward concessions. Determine if it's unfalsifiable/trivial. Compare to Stage Theory and Endurantism.
      *   **Specific Concerns:**
