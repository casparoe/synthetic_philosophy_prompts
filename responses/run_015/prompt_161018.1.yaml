          *   *Argument:* In fission (e.g., cell division, teleportation), it seems objective whether there is one person or two *before* the split. If chunking is interest-relative, we might say "it depends on how you carve it." But intuition says "there was one person."
          *   *User's specific worry:* Three successors case.
