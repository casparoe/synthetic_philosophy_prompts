      *   **Defeater 6: Unfalsifiability/Triviality.**
          *   *Argument:* Friend says "can't lose." If every decomposition is valid, nothing can prove you wrong.
          *   *Assessment:* This is the "quantifier variance" or "ontological anti-realism" charge. It's not necessarily fatal (Sider might hate it, but it's a coherent position), but it risks making the view metaphysically deflationary.
          *   *Verdict:* Fatal to the ambition of *robust* metaphysics, but consistent as a deflationary view.

      *   **Defeater 7: The "Middle Ground" Dilemma (Idle vs. Privileged).**
          *   *Argument:* Either the chunks are privileged (contradicting interest-relativity) or they are idle (why posit them?).
          *   *Assessment:* This is the strongest philosophical challenge.
