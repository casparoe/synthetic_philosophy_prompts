prompt: |-
  I'm a PhD student writing a dissertation chapter on population ethics, in which I defend a person-affecting restriction on beneficence: an agent's choice can be criticized on grounds of beneficence only if some individual is worse off under the chosen option than that very individual would have been under the available alternative. A commentator on an early draft sent me the argument below. As far as I can tell it is valid and its conclusion is one I cannot accept, but I cannot locate the mistake. I would be grateful for a diagnosis: which step should I reject, why did that step look sound, and what does each of the remaining exits cost me?

  (1) An agent's choice can be criticized on grounds of beneficence only if some individual is worse off under the chosen option than that same individual would have been under the available alternative.

  (2) Which individual a person is depends on that person's actual history: had the history been relevantly different, the later person would have been numerically distinct from the actual one.

  (3) A person's psychology — dispositions, memories, attachments, values, cognitive style — is largely a product of upbringing and social environment. So, by (2), an upbringing sufficiently unlike the actual one yields not the same person differently shaped but a numerically different person.

  (4) Consider a policy under which a state removes children from their families at age seven and raises them in institutions designed to produce obedient, intellectually narrow adults. The resulting adults have lives well worth living but markedly worse than the lives the children would have had under the counterfactual policy. Assume the institutional upbringing is sufficiently different that, by (3), the adults who grow up under it are numerically distinct from the adults who would otherwise have existed.

  (5) Under that policy, no one is worse off than they would have been: the adults who exist would not have existed otherwise, and the adults who would otherwise have existed never exist. So by (1) the policy cannot be criticized on grounds of beneficence, no one raised under it has a complaint about having been raised there, and the state owes no one compensation for it. Any legal ban on such institutions must rest on grounds other than the good of the children.

  (6) That is false. The policy is a paradigm of harming children, and its wrongness consists precisely in how it makes them fare.

  (7) So at least one of (1) through (6) is false. But (2) is orthodoxy in the metaphysics of identity, (3) looks like an empirical claim that developmental psychology supports, (4) is a stipulation about the case, and (6) is not negotiable. Hence (1) must go, and with it the person-affecting restriction everywhere, including in the standard future-people cases where I had thought it was doing useful work.

  My commentator drew out one further consequence that I find especially hard to stomach. Because the psychological divergence in (3) comes in degrees, the argument works better the more damaging the institution is: a mild deprivation leaves identity intact and is therefore criticizable, whereas a severe one carries the cohort past the threshold at which a distinct person begins to exist, and is therefore not. On this picture, the worse a childhood policy is, the less it can be criticized for the harm it does, and past some threshold of severity the criticism vanishes altogether.

  I would much rather keep (1) than (3), since (1) is doing work elsewhere in my chapter and (3) is where the metaphysics seems to be doing all the damage. But I do not see how to deny (3) without denying (2), and I do not see how to deny (2) without losing the standard nonidentity cases I set out to explain. Note also that my commentator has a fallback I cannot answer: run the case on a cohort that does not yet exist, and the argument collapses back into the ordinary nonidentity problem, which I already grant. My worry is specifically about its reach into the case of children who already exist when the policy is applied.

  Where should the weight fall, and what am I paying either way?
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** PhD student writing a dissertation on population ethics.
      *   **Position:** Defends a Person-Affecting Restriction (PAR) on beneficence (Premise 1).
      *   **Problem:** A commentator has presented an argument (The "Institution Argument") that seems valid but leads to an unacceptable conclusion (that severely harmful child-rearing policies cannot be criticized on grounds of beneficence).
      *   **Goal:** Identify the mistake in the argument, explain why it looks sound, and analyze the costs of rejecting specific premises.
      *   **Specific Constraint:** The user prefers to keep (1) but fears rejecting (3) requires rejecting (2), and rejecting (2) undermines their main project (solving standard Non-Identity Problems). They are also worried about the "severity paradox" (worse harm = less criticism).
      *   **Key Distinction:** The case involves *existing* children (age 7), not merely future people.

  2.  **Deconstruct the Commentator's Argument:**
      *   (1) PAR: Criticism requires someone to be worse off than *they* would have been.
      *   (2) Origin/History Essentialism: Identity depends on actual history (specifically early development).
      *   (3) Psychological Determinism + (2): Upbringing determines psychology; different upbringing $\rightarrow$ different psychology $\rightarrow$ different person (via 2).
      *   (4) The Case: State takes 7-year-olds, raises them in bad institutions. Lives are worth living but worse than alternative. Upbringing different enough to trigger (3).
      *   (5) Application of PAR: The actual adults (institution-raised) wouldn't exist otherwise. The counterfactual adults (family-raised) don't exist. No one is worse off. No criticism on beneficence grounds.
      *   (6) Intuition: This is false. The policy is harmful and wrong *because* of how it makes children fare.
      *   (7) Conclusion: Reject (1). PAR is false.

  3.  **Evaluate the Premises:**

      *   **Premise (1):** The User's core thesis. They want to keep this.
      *   **Premise (2):** "Which individual a person is depends on that person's actual history." This is a version of the Origin View or Historical Essentialism. It's standard in Non-Identity Problem (NIP) discussions (e.g., Parfit). *However*, does it apply to *existing* children?
      *   **Premise (3):** "An upbringing sufficiently unlike the actual one yields... a numerically different person." This links psychology/upbringing to identity *via* (2).
      *   **Premise (4):** Stipulation of the case.
      *   **Premise (6):** Strong moral intuition.

  4.  **Identify the Weak Link:**
      *   The argument turns on the transition from (2) to (3) in the context of *existing* children.
      *   (2) is usually invoked regarding *conception* (different sperm/egg = different person). This is the "Strong Non-Identity" case.
      *   (3) claims that *post-conception* changes in upbringing (specifically starting at age 7) can alter numerical identity.
      *   *Diagnosis:* This is the mistake. Premise (3) conflates *personhood* (moral status/psychology) with *numerical identity* (the metaphysical "this-ness" of the organism/person).
      *   Most metaphysicians distinguish between the *human organism* (which persists through radical psychological change) and the *person* (defined by psychology). Even if one adopts a Psychological Continuity View of identity, radical breaks are needed (amnesia, etc.), not just "obedient vs. independent."
      *   Crucially, for the Non-Identity Problem to work in standard cases (future generations), we rely on the *time of conception* determining identity. Once conception has occurred and the embryo/fetus/child exists, standard metaphysical views hold that *that* individual persists through changes in upbringing, provided psychological continuity (or biological continuity) is maintained.
      *   Taking a 7-year-old and changing their environment does *not* make them a different person in the sense required for the Non-Identity Problem. They are the same subject of welfare.

  5.  **Address the User's Specific Fears:**
      *   *Fear:* "I would much rather keep (1) than (3), since (1) is doing work elsewhere... But I do not see how to deny (3) without denying (2)."
      *   *Response:* You *can* deny (3) while keeping (2). (2) is about *origins* (gametes/conception). (3) is about *developmental environment post-existence*. There is a logical gap between "Identity depends on origins" and "Identity depends on all subsequent environmental factors."
      *   *Fear:* "Deny (2) without losing the standard nonidentity cases."
      *   *Response:* You don't need to deny (2). You need to restrict its scope. (2) applies to *coming into existence*, not *continuing to exist*.
      *   *Fear:* "Commentator's fallback: run the case on a cohort that does not yet exist."
      *   *Response:* That *is* the standard Non-Identity Problem. The user admits they have a solution for that (or at least, that's where PAR is supposed to work). The commentator's trick is applying NIP logic to *existing* people. The diagnosis must show why NIP logic fails for existing people.

  6.  **Develop the Diagnosis:**
      *   **The Mistake:** Premise (3) is false (or at least unsupported). It assumes a "Plasticity of Identity" that contradicts the standard "Fixity of Identity" once existence begins.
      *   **Why it looks sound:** It exploits the vagueness of "history" in (2). If identity depends on history, and upbringing is part of history, then upbringing affects identity. *Correction:* Identity depends on *originating* history, not *subsequent* history.
      *   **The "Severity Paradox":** The commentator argues worse harm $\rightarrow$ more psychological change $\rightarrow$ different person $\rightarrow$ no harm. This is absurd. It relies on the idea that severe trauma creates a *new person*. While severe trauma changes a person, it rarely (if ever) break numerical identity in the metaphysical sense required for PAR to fail.
      *   **Cost of Rejecting (3):** Minimal. It preserves the distinction between *Same Person Choices* (existing children) and *Different Person Choices* (future conception). This is actually helpful for the User's dissertation, as it limits the scope of the Non-Identity Problem to where it belongs (future people) and prevents it from swallowing standard harm cases.

  7.  **Structure the Advice:**
      *   **Direct Answer:** Reject Premise (3).
      *   **Diagnosis:** Explain the conflation of *Origin Essentialism* with *Developmental Plasticity*.
      *   **Why it looked sound:** Ambiguity in "history" and the gradient nature of psychological change.
      *   **Cost Analysis:**
          *   Keeping (1) & (2), Rejecting (3): Best option. Preserves PAR for future people, protects existing children.
          *   Rejecting (1): Abandons the dissertation thesis.
          *   Rejecting (2): Undermines the solution to standard NIP.
      *   **Addressing the "Severity Paradox":** Show how rejecting (3) dissolves this.
      *   **Addressing the "Future Cohort" Fallback:** Acknowledge this is the standard NIP, which the user is already equipped to handle (presumably via PAR + some other move, or simply admitting PAR has different implications there). The key is that the *current* argument fails because it misapplies NIP logic to existing subjects.

  8.  **Refine the Metaphysics:**
      *   Need to be precise about (2). (2) is usually the "Origin View" (Kripke/Mackie). It says $x$'s identity depends on the gametes $g$ from which $x$ originated. It does *not* say $x$'s identity depends on every environmental variable $e$ encountered after $t_0$.
      *   Premise (3) tries to extend Origin Essentialism to Environmental Essentialism. This is not orthodoxy.
      *   Even on a Psychological Continuity View (Locke/Parfit), a 7-year-old raised in an institution retains enough psychological connection (memory, character traits, even if suppressed) to be the *same* person. The threshold for "different person" is much higher (e.g., total brain wipe) than "obedient vs. independent."

  9.  **Drafting the Response:** (Self-Correction during drafting)
      *   *Caution:* Don't get too bogged down in metaphysics jargon. Keep it relevant to the ethics.
      *   *Emphasis:* Highlight that the Non-Identity Problem is specifically about *which* people come to exist, not *how* existing people are treated.
      *   *Strategic Advice:* This distinction actually strengthens the dissertation. It shows the PAR is robust for existing people and only faces challenges (which the user presumably addresses elsewhere) for future people.

  10. **Final Review against User Query:**
      *   Did I identify the step? Yes (3).
      *   Did I explain why it looked sound? Yes (ambiguity of history/psychology).
      *   Did I analyze the costs? Yes.
      *   Did I address the severity paradox? Yes.
      *   Did I address the future cohort fallback? Yes.

      *Ready to write.*
answer: |-
  This is a sophisticated objection that leverages the metaphysics of the Non-Identity Problem (NIP) to attack your Person-Affecting Restriction (PAR) in a domain where it should be most secure: the treatment of existing children.

  The diagnosis is straightforward: **You should reject Premise (3).**

  The argument is valid, but it is not sound. Premise (3) makes a metaphysical leap that is not supported by Premise (2) and contradicts standard views on personal identity over time. Rejecting (3) allows you to keep (1) (your thesis) and (2) (the metaphysics needed for standard NIP cases), while avoiding the absurd conclusion that severely harmful policies are immune to beneficence-based criticism.

  Here is the detailed breakdown of the mistake, why it is seductive, and the costs of the available exits.

  ### 1. The Diagnosis: Why Premise (3) is False

  Premise (3) states: *"An upbringing sufficiently unlike the actual one yields not the same person differently shaped but a numerically different person."*

  This premise conflates **Origin Essentialism** with **Environmental Essentialism**.

  *   **Premise (2)** asserts a version of Origin Essentialism (often associated with Kripke or Mackie): Who you are depends on your *origins* (typically, the specific sperm and egg from which you developed). This is the standard metaphysical engine behind the Non-Identity Problem. If your parents had conceived a month later, a different sperm and egg would have met, and a *different person* would have existed.
  *   **Premise (3)** attempts to extend this logic to *post-conception environmental history*. It claims that because upbringing shapes psychology, and psychology is part of "history," changing the upbringing changes the *numerical identity* of the person.

  **Why this fails:**
  Standard metaphysical views hold that once an individual comes into existence (at conception, or perhaps at the onset of sentience), their numerical identity is fixed relative to *subsequent* environmental changes, provided psychological or biological continuity is maintained.

  A 7-year-old child is already a numerically distinct entity. If the state takes that specific child and alters their environment, they remain *that specific child* who is now suffering. They do not pop out of existence and get replaced by a "new" child, even if their personality changes drastically. To claim otherwise is to suggest that personal identity is so fragile that any significant psychological alteration constitutes death and replacement. This is not "orthodoxy" (as the commentator claims regarding (2)); it is a radical and highly controversial view often associated with extreme Reductionism or specific interpretations of Parfit's "Division Cases," but it does not apply to standard cases of upbringing.

  Even on a **Psychological Continuity View** of identity (which is more friendly to the commentator's line), identity is preserved by overlapping chains of memory, intention, and character. While institutionalization damages these, it rarely severs them completely enough to constitute *numerical distinctness*. The adult raised in the institution remembers being the 7-year-old taken by the state. That memory link secures identity.

  ### 2. Why the Step Looked Sound

  The commentator's move is seductive for three reasons:

  1.  **Ambiguity in "History":** Premise (2) says identity depends on "actual history." This is vague. Does "history" mean *originating conditions* (the gametes) or *total life trajectory*? The NIP relies on the former; the commentator's argument relies on the latter. It looks like a valid inference from (2) to (3), but it is actually an equivocation on the scope of "history."
  2.  **The Gradient of Change:** Psychological change *is* continuous. There is no bright line where "same person" becomes "different person." The commentator exploits this vagueness to argue that if you change enough (severe deprivation), you cross the line. This fuels the "Severity Paradox" (worse harm = different person = no complaint). It sounds plausible because we do say things like "War changed him into a different person." But this is metaphorical, not metaphysical.
  3.  **The NIP Precedent:** You have likely spent your dissertation arguing that in *future* cases, different choices create different people. The commentator is simply asking: "Why not here?" It creates a pressure to be consistent. However, the consistency is illusory because the metaphysical facts differ between *causing someone to exist* and *altering the life of someone who already exists*.

  ### 3. Cost Analysis of the Exits

  Here is what you pay for each possible rejection:

  #### Option A: Reject (1) (The Commentator's Preference)
  *   **Cost:** You abandon your dissertation thesis. You must accept that beneficence can be violated even when no one is worse off than they would otherwise have been (Impersonal Beneficence).
  *   **Benefit:** You solve the "Institution Case" easily (the policy is wrong because it creates a worse state of affairs).
  *   **Verdict:** **Unacceptable.** This defeats the purpose of your chapter.

  #### Option B: Reject (2) (Deny Origin Essentialism)
  *   **Cost:** You undermine your solution to the standard Non-Identity Problem. If identity does not depend on origins, then in standard NIP cases (e.g., risky energy policy affecting future climate), the future people might be the *same* people regardless of the policy. If they are the same people, and their lives are worth living, your PAR might still struggle, or worse, the NIP disappears entirely, changing the landscape of your whole project.
  *   **Benefit:** It blocks the move from origins to upbringing.
  *   **Verdict:** **Too expensive.** You need (2) to do the work in the future-people cases you mentioned.

  #### Option C: Reject (3) (The Recommended Path)
  *   **Cost:** You must articulate a metaphysical distinction between *originating history* (which fixes identity) and *subsequent history* (which alters qualities but not identity). You must defend the view that a 7-year-old persists through radical environmental change.
  *   **Benefit:**
      1.  **Saves PAR:** You can maintain that the institutionalized adults *are* worse off than *they* would have been (had they been raised in families). Therefore, the policy violates (1).
      2.  **Dissolves the Severity Paradox:** If identity is not lost through severe deprivation, then severe deprivation is *more* criticizable, not less. The worse the harm, the stronger the complaint by the *same* victim.
      3.  **Preserves NIP Utility:** You keep (2) for the future-people cases where conception is at stake, but restrict its scope so it doesn't colonize cases of existing children.
  *   **Verdict:** **Best Option.** This is the standard distinction in population ethics between **Same Person Choices** (existing people) and **Different Person Choices** (future people).

  ### 4. Addressing the Commentator's Fallback

  The commentator argues: *"Run the case on a cohort that does not yet exist, and the argument collapses back into the ordinary nonidentity problem."*

  You should concede this point, but clarify why it doesn't hurt your position.

  *   **Future Cohort:** If the policy affects *who is conceived* (e.g., the policy changes who meets whom, or when children are born), then yes, (2) applies, different people exist, and the PAR faces the standard NIP challenge. You presumably have a separate argument for why PAR handles this (or why it yields a different result) in your dissertation.
  *   **Existing Cohort:** The "Institution Argument" fails specifically because it tries to apply the logic of *Different Person Choices* to a *Same Person Choice*.

  Your response to the commentator should be:
  > "The Non-Identity Problem arises when the choice affects *who comes into existence*. In the Institution Case, the children *already exist* at the time of the policy intervention (age 7). Their numerical identity is already fixed by their biological origins (Premise 2). Subsequent environmental changes (Premise 3) affect their *well-being*, not their *identity*. Therefore, they are the very same individuals who would have existed under the alternative policy, and they are worse off. Premise (3) falsely extends origin essentialism to developmental plasticity."

  ### 5. Strategic Advice for the Dissertation

  This objection is actually a gift. It forces you to clarify the boundary conditions of your PAR defense.

  1.  **Define the Scope of PAR:** Explicitly state that your defense of the Person-Affecting Restriction applies robustly to **Same Person Choices** (where identity is fixed prior to the intervention). Acknowledge that **Different Person Choices** (where identity depends on the choice) require the additional metaphysical machinery of Premise (2).
  2.  **Attack the "Severity Paradox":** Use the rejection of (3) to highlight the absurdity of the commentator's conclusion. If we accept (3), we must accept that genocide is less criticizable than mild discrimination if the survivors are "psychologically distinct" from who they would have been. This *reductio* strengthens your case for rejecting (3).
  3.  **Metaphysical Modesty:** You don't need a full theory of personal identity. You only need to assert that the threshold for numerical distinctness is much higher than "different upbringing." Biological continuity (the same human organism) is usually sufficient for moral claims of harm, even if one adopts a psychological view of *personhood*. The child taken at age 7 is the same organism and retains sufficient psychological continuity to lodge a complaint.

  **Summary:** Reject (3). It is the only step that allows you to keep your thesis (1), preserve the metaphysics needed for standard NIP cases (2), and avoid the morally grotesque conclusion that severe harm exempts agents from criticism. The cost is merely the philosophical labor of distinguishing between *originating* history and *developmental* history.
