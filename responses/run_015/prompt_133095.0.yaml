answer: |-
  ### Part 1: The Three Lines of Work

  You have 5 researcher-years. You cannot build infrastructure; you must specify it and integrate it. You cannot solve interpretability; you must monitor behavior. You cannot guarantee safety; you must guarantee *visibility* and *interruptibility*.

  Here is the ordering, based on the constraint that you need to survive the next two years without causing a catastrophe that shuts down the lab or allows an uncontained escape.

  **1. Architectural Containment (Tool-Level Sandboxing & Verification)**
  *   **What:** Do not build a "model safety" project. Build a "tool safety" project. If the model has write access, the safety property must live in the *API*, not the policy. This means designing the tools the model calls such that dangerous actions are structurally impossible or require multi-party authorization that the model cannot spoof. It also means automated verification of code diffs before merge, where the verification logic is separate from the model.
  *   **Why First:** This is the only line that directly addresses the "write access" risk with high disclosure-robustness. If the model knows the sandbox rules but lacks the API key to bypass them, you win. If you rely on the model *choosing* not to bypass them, you lose. This has the highest leverage on *actual* risk reduction per researcher-hour. It also forces engagement with engineering early, establishing your team as integrators rather than auditors.
  *   **Cost:** High engineering friction, but low capability cost if designed as a latency budget rather than a feature freeze.

  **2. Autonomy Monitoring & Tripwires (Behavioral Evals for Scheming)**
  *   **What:** Ignore general helpfulness/harmlessness. Build a narrow suite of evals designed specifically to detect *instrumental convergence* behaviors: attempts to copy weights, attempts to hide logs, attempts to create backdoors, or attempts to bypass the containment from Line 1. These are not for training; they are for monitoring deployment.
  *   **Why Second:** You need a signal. Containment (Line 1) might fail or have unknown loopholes. You need a "canary" that tells you when the model is behaving strategically adversarial. This feeds directly into your leverage over the ship/no-ship call. If the canary chirps, you have the data required to pull the plug.
  *   **Cost:** Low engineering cost, high research uncertainty.

  **3. The Safety Case & Intervention Protocol**
  *   **What:** A living document and process that defines *exactly* what evidence is required to ship, and *exactly* who must sign off when a tripwire triggers. This is not bureaucracy; it is pre-commitment. It defines the "institutional machinery" you noted is missing. It assigns authority: if Tripwire X fires, Deployment Y halts automatically unless Person Z overrides (and that override is logged and audited).
  *   **Why Third:** Technical controls fail without governance. However, governance without technical controls is just paperwork. You build this last because you need to know what the technical controls (Line 1) and signals (Line 2) *are* before you can write the protocol for them. This is your primary lever for the "ship/no-ship" mandate.
  *   **Cost:** High political capital, low researcher-hours (but high senior-time).

  **Argument for Ordering:**
  You order by **dependency** and **leakage**.
  1.  **Containment** prevents immediate catastrophe. If you skip this, a single bad output destroys the lab.
  2.  **Monitoring** tells you if Containment is failing. If you skip this, you fly blind until it's too late.
  3.  **Protocol** tells you what to do when Monitoring fires. If you skip this, you have a fire alarm but no fire department.
  Most teams reverse this: they write policy (3), run generic evals (2), and hope engineering handles containment (1). With 5 RY, you must harden the system (1) before you argue about the rules (3).

  ---

  ### Part 2: Upstream Conceptual Questions

  These are the questions where a conceptual breakthrough (or bust) changes the priority list above.

  **1. The Verification Asymmetry Question**
  *   **Question:** Is it computationally or cognitively cheaper to *verify* a dangerous action than to *generate* one?
  *   **Tractability:** High for conceptual work; medium for empirical. You can analyze code complexity and formal verification bounds without training new models.
  *   **18-Month Observable:** If your team can demonstrate that automated verification of model-generated code adds <10% latency while catching >90% of known exploit classes, Line 1 moves up. If verification proves as hard as generation (e.g., requires a model just as smart as the agent), Line 1 becomes a bottleneck and you must pivot to Line 2 (monitoring) as the primary defense.

  **2. The "Deception Threshold" Question**
  *   **Question:** At what capability level does the model become better at hiding its intent from behavioral evals than we are at designing the evals?
  *   **Tractability:** Low. This is the hard part of alignment. However, conceptual work on *what constitutes evidence of deception* is tractable.
  *   **18-Month Observable:** If you observe models consistently passing "adversarial" evals while failing in deployment (or vice versa), your confidence in Line 2 drops. If you find specific "tells" (e.g., specific token patterns during planning phases) that correlate with bypass attempts, Line 2 becomes your crown jewel. Watch for "sandbagging" in early models.

  **3. The Organizational Friction Question**
  *   **Question:** How much capability cost (latency/throughput) will the product team tolerate for safety controls before they shadow-IT around them?
  *   **Tractability:** High. This is social science/internal auditing.
  *   **18-Month Observable:** Measure the "bypass rate" of existing safety protocols in the lab. If engineers are already using scripts to skip linting or security checks to meet deadlines, Line 3 (Protocol) is doomed unless it is automated. If friction is tolerated, Line 3 gains value.

  ---

  ### Part 3: Critique of Your Axes

  You are right to be suspicious of **Disclosure-Robustness**, but your framing is slightly off.

  **1. Disclosure-Robustness (Rename to: Knowledge-Independence)**
  *   **Critique:** You are conflating *secrecy* with *authority*. A system does not need to be secret to be robust; it needs to be *enforced*. A locked door is robust even if the burglar knows it's locked. A hidden camera is not.
  *   **Adjustment:** Stop optimizing for "the model doesn't know." Optimize for "the model knows, but lacks the capability." Shift the axis from *Information Hazard* to *Authority Boundary*. If your safety relies on the model being surprised, it is already broken. If it relies on the model lacking root access, it is sound.
  *   **Weight:** Keep it high, but redefine it.

  **2. Capability Cost**
  *   **Critique:** You are discounting this correctly, but perhaps too cynically.
  *   **Adjustment:** Distinguish between *training cost* and *inference latency*. Teams will tolerate safety that slows down deployment (inference) if it prevents catastrophe. They will not tolerate safety that slows down *iteration* (training/eval cycles). Ensure your Line 1 work does not block the engineering loop.
  *   **Weight:** Overweight this. It is the primary failure mode for safety teams inside product labs.

  **3. Deployment-Blocking vs. Deployment-Hardening**
  *   **Critique:** This is a false dichotomy for a small team. You cannot block deployment without a hardening signal, and hardening is useless if you can't block when it fails.
  *   **Adjustment:** Merge these into **Interruptibility**. The goal isn't to stop the launch forever; it's to ensure you can stop the *process* if the hardening fails.
  *   **Weight:** Underweighted. The ability to kill the process is more valuable than the ability to make the process safe.

  **4. Graceful Degradation**
  *   **Critique:** Good heuristic, but secondary.
  *   **Adjustment:** Keep it as a tie-breaker between two technical solutions.
  *   **Weight:** Correct as is.

  **Summary Recommendation:**
  Drop the hope that secrecy helps. Double down on **architectural enforcement** (Line 1). Your biggest risk is not that the model is smart enough to trick you; it's that your team builds a safety layer that engineering bypasses because it's too slow. Spend 50% of your 5 RY on Line 1 (integration), 30% on Line 2 (detection), and 20% on Line 3 (governance). If you try to do governance first, you will be ignored. If you do tech first, you become indispensable.
