      *   *The "One Revision":* What is the easiest thing to drop to save the rest?
          *   *Candidate:* Drop the absolute authority of the Crib in (c).
          *   *Reasoning:* If the Crib is just a *guide* rather than *authority*, then (d) (trusting form), (f) (register parity), and (i) (hospital variant) all become valid. (a) remains intact (Form is identity).
          *   *Cost:* You lose the safety net of "I didn't change the meaning, the prose says so." You admit to semantic drift for the sake of poetic integrity.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check (e) again.* "Defensible by appeal to something in the original." If the form forces a change, can I appeal to the original? Only if I argue the original *also* had a constraint that forced a change. Marot's original had rhyme/meter. So if English rhyme forces a change, it mirrors the *experience* of the original poet. That's a strong argument. I should highlight this.
      *   *Check (c) again.* "Where a finished version and the crib conflict, the version is wrong." This is the killer sentence. It invalidates the art. It must go or be softened.
      *   *Check the Hospital Variant.* If (f) allows moving concrete references to keep register, then the Hospital is fine *if* the register distance is the same. But (c) says Crib is authority on *what the poem says*. A hospital is not a 16th-century sickroom. So (c) kills the Hospital variant.
      *   *Check (h).* "Co-author" vs "Translated by." Venuti would have a field day here. But practically, "Translated by" signals to the reader "This is Marot, not You." "Co-author" signals "This is a collaboration." If the novel presents them as translations, "Translated by" is safer, but "Co-author" in the afterword is a theoretical stance. The tension is between the *label* and the *theory*.

  6.  **Finalizing the Recommendations:**
