      *   **Task:** Audit the afterword's theoretical commitments (points a-h). Identify tensions/contradictions, rank them by severity, suggest specific fixes (deletions/rewrites), and address specific questions (crib vs. form, constraint vs. justification, credit line, hospital variant).
      *   **Tone:** Professional, rigorous, peer-to-peer (treating the user as a serious practitioner), analytical, not introductory.
