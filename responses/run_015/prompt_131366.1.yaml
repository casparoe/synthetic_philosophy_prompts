          *   (h) says Translator = Co-author (creative agency) BUT insists on "Translated by" (fidelity claim) rather than "After" (adaptation claim).
          *   *Conflict:* If I am a co-author creating a new English poem (h), why am I bound by the "Translated by" label which implies subordination to the source? Conversely, if I claim "Translated by," does that undermine the "Co-author" claim? Also, (g) says some versions are "wrong." If there's no single correct version, how can one be wrong? (This is a standard pluralism paradox, but needs addressing).
          *   *Severity:* Medium. Mostly terminological/professional, but touches on ethics.

      *   **Tension 4: (f) vs. (c) & (i) [The Hospital Variant].**
