          *   *Conflict:* If the Crib says "16th-century sickroom," and you write "21st-century hospital," (c) says the version is wrong. (f) justifies it. (i) claims it's still translation.
          *   *Severity:* High (specific to the book's plot). This is the "gap" the user mentioned.

