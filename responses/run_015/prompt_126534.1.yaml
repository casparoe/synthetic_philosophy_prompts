prompt: |-
  i sit on my museum's public-program board and lately we're getting exhibit-tie-in proposals that lean hard into pseudohistory: Atlantis as an actual engineering culture, ancient aliens editing cuneiform, and this Russian mathematician's idea that ancient Rome and the middle ages are just duplicated records in a fake chronology (Fomenko's new chronology thing). i need a decision procedure my team can actually run on each pitch in about 15 minutes: questions in order, what counts as a sufficent answer to reject, where the call has to go to a real historian because it's values not facts, and be honest about where the checklist misfires. ground it in whatever philosophy of sicence says about demarcation but keep it practical. apply it to two proposals: one claiming Atlantis was a tech hub in the Aegean, and one pushing Fomenko-style duplicated dynasties. include a case where the procedure says reject but a serious amateur historian might still disagree, and flag what the checklist can't settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a museum's public-program board.
      *   **Problem:** Receiving exhibit proposals based on pseudohistory (Atlantis, Ancient Aliens, Fomenko's New Chronology).
      *   **Goal:** A 15-minute decision procedure (checklist/flowchart) to evaluate pitches.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for rejection (sufficient answers).
          *   Criteria for escalation to a professional historian (values vs. facts).
          *   Honesty about limitations (where the checklist misfires).
          *   Grounding in philosophy of science (demarcation problem) but practical.
          *   Application to two specific examples (Atlantis tech hub, Fomenko chronology).
          *   Include a "false positive/negative" case where the procedure rejects but an amateur might disagree, flagging what can't be settled.

  2.  **Theoretical Grounding (Philosophy of Science):**
      *   *Demarcation Problem:* How to distinguish science/history from pseudoscience/pseudohistory.
      *   *Key Concepts:*
          *   **Falsifiability (Popper):** Can the claim be proven wrong?
          *   **Consilience (Whewell):** Does evidence from independent sources converge?
          *   **Burden of Proof:** Who has to prove what? (Extraordinary claims require extraordinary evidence - Sagan/Hitchens).
          *   **Peer Review/Consensus:** Is this accepted by the relevant community?
          *   **Ad Hoc Hypotheses (Lakatos):** Does the theory constantly add excuses to avoid refutation?
      *   *Practical Translation:* Turn these into yes/no questions for a board member who isn't necessarily a PhD historian.

  3.  **Drafting the Decision Procedure (The "15-Minute Filter"):**
      *   *Structure:* Needs to be sequential. If they fail step 1, stop.
      *   *Step 1: Source & Consensus.* (Easiest to check). Is this peer-reviewed? Do mainstream historians agree?
      *   *Step 2: Falsifiability & Evidence.* Can they show what would prove them wrong? Do they rely on one type of evidence (e.g., just reading texts differently) while ignoring others (archaeology, DNA)?
      *   *Step 3: Motivation & Narrative.* Is the goal to explain data or to confirm a preconceived story?
      *   *Step 4: Escalation.* When does it need an expert? (When it touches on sensitive cultural heritage or nuanced methodological debates).

  4.  **Refining the Criteria (Rejection vs. Escalation):**
      *   *Reject:* Fails falsifiability, ignores contradictory evidence, relies on conspiracy (suppressed truth).
      *   *Escalate:* Methodologically sound but controversial interpretation, ethical implications (repatriation, sensitive history).

  5.  **Addressing the "Misfire" (Limitations):**
      *   Checklists can't judge *quality* of argument, only *structure*.
      *   Checklists can suppress fringe ideas that turn out to be right (rare, but possible).
      *   Checklists can't handle "values" (e.g., is this story *useful* to the community even if not strictly factual?).

  6.  **Applying to Case Studies:**
      *   *Case A: Atlantis as Aegean Tech Hub.*
          *   Claim: Advanced engineering in Bronze Age Aegean.
          *   Filter: Archaeological record? No evidence of high-tech tools. Falsifiability? If they say "evidence was destroyed," that's a fail.
      *   *Case B: Fomenko/New Chronology.*
          *   Claim: Middle Ages are a duplicate/fake.
          *   Filter: Consensus? Universally rejected. Evidence? Ignores dendrochronology, ice cores, non-European records. Ad hoc? Yes, claims massive conspiracy.

  7.  **Developing the "Disagreeing Amateur" Case:**
      *   Need a scenario where the checklist says "No" but a serious amateur says "Wait."
      *   *Idea:* A proposal challenging a specific local narrative based on new archival finds that haven't been peer-reviewed *yet*.
      *   *Why the checklist rejects:* Lack of consensus/peer review.
      *   *Why the amateur argues:* Peer review is slow; the evidence looks solid to them.
      *   *What can't be settled:* The actual validity of the raw data without expert analysis.

  8.  **Review and Refine:**
      *   *Tone:* Professional, pragmatic, firm but fair.
      *   *Time:* Ensure it feels doable in 15 mins.
      *   *Philosophy:* Explicitly mention Popper/Lakatos but keep it jargon-light.
      *   *Formatting:* Use bolding, lists, and clear sections.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "ask a historian." The prompt asks for a procedure the *team* can run, with specific triggers for when to call the historian.
      *   *Correction:* Ensure Fomenko is addressed specifically as requested.
      *   *Correction:* Clarify the "values vs. facts" distinction for escalation.

  10. **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  Here is a 15-minute decision procedure grounded in the philosophy of science (specifically Popper's falsifiability, Lakatos's research programmes, and Haack's criteria for pseudoscience), adapted for museum programming.

  ### The "15-Minute Demarcation Filter"

  **Goal:** Distinguish between *revisionist history* (valid re-interpretation) and *pseudohistory* (methodological failure).
  **Who runs this:** Program board members (no PhD required).
  **Time limit:** 15 minutes per pitch deck/proposal.

  ---

  #### Phase 1: The Consensus & Source Check (5 Minutes)
  *Philosophy grounding: Social epistemology. Knowledge is a communal verification process.*

  **Q1: Is the core claim published in a peer-reviewed history/archaeology journal, or is it only in books/media produced by the proposer?**
  *   **Pass:** Yes, peer-reviewed articles exist supporting the core thesis.
  *   **Fail:** No. It is only in self-published books, documentaries, or blogs.
  *   **Action:** If **Fail**, move to Q2. If **Pass**, proceed to Phase 2.

  **Q2: Does the proposal acknowledge the current scholarly consensus and explain *why* it is wrong?**
  *   **Pass:** "Historians say X, but new evidence Y suggests Z."
  *   **Fail:** "Historians say X because they are gatekeeping/ignorant/part of a conspiracy."
  *   **Action:** If **Fail**, **REJECT**. (This is an *ad hominem* defense, a hallmark of pseudoscience).

  #### Phase 2: The Evidence & Falsifiability Check (5 Minutes)
  *Philosophy grounding: Popperian Falsifiability. A claim must be capable of being proven false.*

  **Q3: What specific piece of evidence would prove this proposal WRONG?**
  *   **Pass:** "If we find carbon dates older than X," or "If contemporary records from Culture Y don't mention this."
  *   **Fail:** "The evidence was destroyed," "The records were faked," or "It's a matter of interpretation, so it can't be disproven."
  *   **Action:** If **Fail**, **REJECT**. (Unfalsifiable claims are mythology, not history).

  **Q4: Does the proposal rely on "Consilience" (convergence of evidence) or a single thread?**
  *   **Pass:** Uses archaeology + texts + genetics + climate data together.
  *   **Fail:** Relies entirely on re-reading texts, numerical coincidences, or iconography while ignoring physical data (pottery, strata, DNA).
  *   **Action:** If **Fail**, **REJECT**. (Pseudohistory often isolates one data type to force a conclusion).

  #### Phase 3: The Motivation & Impact Check (5 Minutes)
  *Philosophy grounding: Value-laden inquiry. Distinguishing between historical error and ethical harm.*

  **Q5: Is the primary drive to explain a gap in the record, or to confirm a pre-existing narrative?**
  *   **Pass:** "We found an anomaly we need to solve."
  *   **Fail:** "We need to prove our ancestors were superior/victims/chosen." (Nationalist, racial, or mystical teleology).
  *   **Action:** If **Fail**, **REJECT**. (This is ideology wearing history's clothes).

  **Q6: Does this touch on sensitive cultural heritage or living communities?**
  *   **Yes:** (e.g., Indigenous origins, religious history, contested borders).
  *   **No:** (e.g., Bronze Age trade routes, Roman economic policy).
  *   **Action:** If **Yes**, **ESCALATE TO PROFESSIONAL HISTORIAN**. (This is a values/ethics call, not just a facts call).

  ---

  ### Decision Matrix

  | Result | Action | Rationale |
  | :--- | :--- | :--- |
  | **Any "Fail" in Phase 1 or 2** | **REJECT** | Methodological failure. The pitch does not meet the baseline for historical inquiry. |
  | **Pass Phase 1 & 2, No in Q6** | **ACCEPT FOR REVIEW** | Methodologically sound, low risk. Proceed to standard curatorial review. |
  | **Pass Phase 1 & 2, Yes in Q6** | **ESCALATE** | Facts may be sound, but ethical implications require expert consultation. |

  ---

  ### Where The Checklist Misfires (Limitations)

  Be honest with your board: This tool is a **filter**, not a **verifier**.

  1.  **The "Galileo" Problem:** Sometimes consensus is wrong. This checklist will reject valid fringe theories that haven't gained traction yet. *Mitigation:* Allow a "Special Exception" path if the proposer has significant new physical evidence (e.g., a newly discovered archive), but require an external expert review.
  2.  **The "Nuance" Blindspot:** The checklist cannot judge the *quality* of an argument, only the *structure*. A proposal can pass Q4 (uses multiple sources) but still interpret them badly.
  3.  **The "Values" Gap:** The checklist identifies *pseudohistory*, but it cannot decide if *bad history* is useful. Sometimes a museum might program a "Myths vs. Reality" exhibit. This checklist rejects the pitch as *fact*, but doesn't stop you from programming it as *fiction/folklore*.

  ---

  ### Application to Proposals

  #### Case 1: "Atlantis: The Aegean Tech Hub"
  *Claim: Atlantis was a real, high-engineering civilization in the Bronze Age Aegean, suppressed by later Greek writers.*

  *   **Q1 (Source):** Self-published book and documentary. No peer-reviewed papers. (**Fail**)
  *   **Q2 (Consensus):** Claims archaeologists ignore the evidence because "it doesn't fit the timeline." (**Fail**)
  *   **Q3 (Falsifiability):** "The sea levels rose and swallowed the tech." (Unfalsifiable). (**Fail**)
  *   **Q4 (Consilience):** Relies on Plato's text and underwater rock formations. Ignores lack of metallurgical evidence or trade records. (**Fail**)
  *   **Decision:** **REJECT**.
  *   **Why:** Fails the basic demarcation of evidence. It treats a philosophical allegory (Plato's Atlantis) as an engineering log without physical corroboration.

  #### Case 2: "The New Chronology" (Fomenko Style)
  *Claim: The Roman Empire and Middle Ages are phantom periods; history is 1,000 years shorter. Dynasties are duplicated records.*

  *   **Q1 (Source):** Works by Anatoly Fomenko (mathematician, not historian). Rejected by historical journals. (**Fail**)
  *   **Q2 (Consensus):** Claims global conspiracy of historians and carbon-dating labs. (**Fail**)
  *   **Q3 (Falsifiability):** Claims all contradictory dating methods (dendrochronology, ice cores, astronomy) are flawed or faked. (**Fail**)
  *   **Q4 (Consilience):** Relies on statistical comparison of text lengths and king lists. Ignores archaeology, genetics, and non-European records (e.g., Chinese/Islamic records that overlap the "phantom" time). (**Fail**)
  *   **Decision:** **REJECT**.
  *   **Why:** This is the textbook definition of pseudohistory. It creates a "protective belt" of ad hoc hypotheses (faked carbon dating, conspiratorial historians) to immunize the core claim from refutation (Lakatos's degenerating research programme).

  ---

  ### The "Disagreeing Amateur" Case (Where the Checklist Bites)

  **The Proposal:** A local historian proposes an exhibit arguing that a specific local Revolutionary War battle happened at *Site B*, not the officially recognized *Site A*, based on a newly transcribed private diary found in an attic.

  **Running the Filter:**
  *   **Q1:** The diary transcription is not peer-reviewed. (**Fail**)
  *   **Q2:** Acknowledges consensus but claims the diary is new evidence. (**Pass**)
  *   **Q3:** Falsifiable (if other diaries contradict). (**Pass**)
  *   **Q4:** Relies *only* on the diary (single thread) until archaeology is done. (**Fail**)
  *   **Decision:** **REJECT** (based on Q1 and Q4).

  **The Disagreement:** A serious amateur historian argues: *"Peer review takes years. This diary is genuine. By the time it's peer-reviewed, the funding is gone. You are stifling new discovery because it hasn't been stamped by a university yet."*

  **What The Checklist Can't Settlement:**
  The checklist cannot verify the **authenticity of the diary**. It flags the *risk* (single source, no consensus), but it cannot determine the *truth*.
  *   **The Board's Dilemma:** Do you protect the museum's credibility (Reject) or support local engagement/potential breakthrough (Accept)?
  *   **The Fix:** This is where you pivot the exhibit framing. Do not program "The Battle Was Here." Program "The Mystery of the Diary: Investigating a New Claim." This satisfies the amateur's desire for visibility without committing the museum to unverified facts.

  ### Summary for the Board
  Use this filter to protect the institution from **methodological failure**, not to police **controversial ideas**. If a proposal fails Phase 1 or 2, it is not "alternative history"; it is "non-history." If it passes but triggers Phase 3, it is history with ethical baggage that requires an expert to carry.
