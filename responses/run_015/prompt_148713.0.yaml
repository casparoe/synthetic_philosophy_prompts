      *(Refining the Objection)*: The hedonicist will say "Badness is phenomenological. You are pointing to the hand. That's category error." I need to articulate that clearly.

  8.  **Final Polish:** Check word choice for precision ("valence," "nociceptive," "phenomenology"). Ensure American spelling (behavior, labeled, etc.).

