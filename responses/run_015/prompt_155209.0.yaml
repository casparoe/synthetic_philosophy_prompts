prompt: |-
  So I've ended up as the philosopher on our hospital's clinical genomics advisory board — we meet a couple of times a term and sign off on what the genetics clinic offers and how the consent conversation goes, and it's the same argument every time: is it actually good for this patient to be offered this result? I'd like to build the protocol around Good's theorem (the value of information can't be negative, since you can always just ignore what you learn), which I teach as the clean case, but the theorem stops doing any work the moment its assumptions break, and what I want is the assumptions turned into steps.

  Write me a procedure a genetic counsellor can run in about twenty mintues at intake, before any optional result gets offered: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand the question back to the patient because it's a values question dressed as a factual one. It has to survive these, which are the ones that actually come up:

  - results that discriminate between no acts the patient would take anyway — variants of uncertain significance, or a risk score for something with no prevention — so the decision value is zero while the hedonic cost isn't;
  - patients who ask for a deliberately coarsened signal, just tell me if there's anything I can do about it, which looks like throwing away information for nothing;
  - patients who decline free results outright, where I want the procedure to tell a mistake apart from a preference about the weeks of waiting;
  - results that are durable and semi-public — in the chart, in the family — so the patient isn't the only one who ends up informed;
  - patients who say they'll act on a result and won't.

  At each step say plainly which bit is decision theory and which bit is a value judgment I've laundered as arithmetic, and flag the cases the procedure can't settle. Then run it on three: the secondary-findings panel we currently offer by default to everyone who gets sequenced; a polygenic score for a late-onset condition with no intervention; and a patient who wants the panel disclosed only if it's actionable. If the procedure tells me we shouldn't be offering something we offer by default, I'd rather hear that now than at the next meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher on a hospital's clinical genomics advisory board.
      *   **Task:** Create a 20-minute intake protocol for genetic counselors to determine if offering a specific genomic result is "good" for a patient.
      *   **Theoretical Basis:** Good's Theorem (Value of Information $\ge$ 0). The user acknowledges the theorem fails when assumptions break. The goal is to turn those assumptions into procedural steps.
      *   **Constraints/Challenges:**
          *   Must address specific edge cases: VUS/no-prevention (zero decision value, positive hedonic cost), coarsened signals (ignoring info), declining free results (mistake vs. preference), durable/semi-public data (family/chart implications), stated intent vs. actual behavior.
          *   Must distinguish between decision theory (arithmetic) and value judgments (laundered as arithmetic).
          *   Must flag cases the procedure *cannot* settle.
          *   Must test the protocol on three specific scenarios: Secondary findings panel (default), Polygenic score (late-onset, no intervention), Actionable-only request.
          *   **Tone:** Professional, rigorous, philosophically grounded but practically usable by counselors.
      *   **Goal:** If the protocol suggests stopping a current default offering, the user wants to know now.

  2.  **Deconstruct Good's Theorem & Its Assumptions:**
      *   *Good's Theorem:* Expected utility of obtaining free information is non-negative. $E[U|Info] \ge E[U|No Info]$.
      *   *Why it fails in clinical genetics:*
          1.  **Cost of Information:** Good assumes information is free. In genetics, there's psychological cost (anxiety), social cost (stigma), and opportunity cost (time).
          2.  **Rational Agency:** Good assumes the agent updates beliefs Bayesianly and acts to maximize utility. Patients may not update rationally (panic) or may not act as intended (inertia).
          3.  **Actionability:** Good assumes the agent *can* take different actions based on the signal. If no action exists, decision value is zero, but cost remains.
          4.  **Privacy/Externality:** Good assumes the utility function is individual and private. Genetic info affects family and stays in charts (semi-public).
          5.  **Preference for Ignorance:** Good assumes more info is always better *if free*. Some agents have a direct disutility for knowing (hedonic cost).

  3.  **Drafting the Protocol (The "Good's Theorem Audit"):**
      *   *Structure:* Needs to be a step-by-step flow.
      *   *Time:* ~20 minutes.
      *   *Steps:*
          1.  **Actionability Check (The "Can I do anything?" test).** Addresses zero decision value.
          2.  **Cost-Benefit Analysis (The "Hedonic Tax" test).** Addresses psychological/social costs.
          3.  **Agency & Fidelity Check (The "Will I actually do it?" test).** Addresses irrationality/inertia.
          4.  **Externality Check (The "Who else knows?" test).** Addresses family/chart privacy.
          5.  **Granularity Preference (The "How much do I want to know?" test).** Addresses coarsened signals.

      *   *Refining the Steps:* I need to make sure I explicitly label where decision theory ends and value judgment begins.
      *   *Stop Conditions:* Where does the counselor say "No, we don't offer this"? Where do they say "This is your choice"?

  4.  **Addressing the Specific Challenges:**
      *   *VUS/No Prevention:* Step 1 (Actionability). If no action, decision value = 0. If cost > 0, Net Value < 0.
      *   *Coarsened Signal:* Step 5 (Granularity). Respecting preference for ignorance is valid if costs are acknowledged.
      *   *Declining Free Results:* Step 2 (Cost). Distinguish between "I don't want to wait" (logistical) vs. "I don't want to know" (value).
      *   *Durable/Semi-public:* Step 4 (Externality).
      *   *Will act/Won't act:* Step 3 (Agency).

  5.  **Developing the Test Cases:**
      *   *Case 1: Secondary Findings Panel (Default).* Usually actionable, but mandatory offering violates the "opt-in" spirit of Good's Theorem if costs aren't weighed.
      *   *Case 2: Polygenic Score (Late-onset, No Intervention).* High risk of failing Step 1 (Actionability).
      *   *Case 3: Actionable-Only Request.* This aligns well with the protocol.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the philosopher's role and the limitation of Good's Theorem.
      *   *The Protocol:* "The Information Value Audit."
      *   *Step 1: Actionability (Decision Theory).* If no action, value is 0.
      *   *Step 2: Hedonic & Social Cost (Value Judgment).* Anxiety, stigma.
      *   *Step 3: Agency Fidelity (Behavioral Econ).* Will you actually change behavior?
      *   *Step 4: Externalities (Ethics/Policy).* Family, chart permanence.
      *   *Step 5: Granularity (Autonomy).* Do you want the number or the binary?
      *   *Decision Matrix:* How to combine the answers.
      *   *The Test Runs:* Apply the protocol to the three scenarios honestly.
      *   *Conclusion:* What this means for the board.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep questions tight. Focus on the *counselor's* assessment, not just patient interview.
      *   *Critique:* The user wants to know where I'm laundering values as arithmetic.
      *   *Fix:* Add explicit "Philosopher's Note" boxes or bold text identifying the theoretical vs. normative leap.
      *   *Critique:* The prompt asks for "where it stops with a no."
      *   *Fix:* Define "Hard Stops" vs. "Counseling Points."
      *   *Critique:* The prompt asks to test the Secondary Findings Panel. If the protocol says "Don't offer by default," I must say that.
      *   *Fix:* Be honest in the test run. If Actionability is the primary filter, default secondary findings often fail the "personal utility" test for *every* patient without individualized consent.

  8.  **Final Polish:**
      *   Ensure the tone is respectful of the clinical setting but rigorous enough for a philosopher.
      *   Check that all constraints from the prompt are met (VUS, coarsened signal, declining results, durability, intent vs action).
      *   Make sure the distinction between Decision Theory and Value Judgment is clear at every step.

  9.  *(Self-Correction on Good's Theorem)*: Good's Theorem specifically states that *if* you are a rational expected utility maximizer, *and* information is free, *and* you can act on it, then information has non-negative value. The protocol must explicitly test these three conditions.
      1.  Can you act? (Actionability)
      2.  Is it free? (Psychological/Social Cost)
      3.  Are you rational/consistent? (Agency Fidelity)
      *   *Addition:* The "Externality" and "Granularity" points are extensions beyond standard Good, addressing the specific clinical context.

  10. **Final Review against Prompt:**
      *   Procedure for genetic counselor? Yes.
      *   ~20 mins? Yes.
      *   Questions in order? Yes.
      *   Sufficient answer/Stop conditions? Yes.
      *   Flag decision theory vs. value judgment? Yes.
      *   Address the 5 specific challenges? Yes.
      *   Run on 3 cases? Yes.
      *   Honest about default offerings? Yes.

