answer: |-
  This is a **Information Value Audit (IVA)**. It is designed to operationalize Good's Theorem by explicitly testing its failure conditions.

  Good's Theorem holds that $E[U|Info] \ge E[U|No Info]$ only if:
  1.  **Actionability:** There exists a decision $d$ contingent on the signal $s$.
  2.  **Costlessness:** The acquisition of $s$ has no utility cost $C(s)$.
  3.  **Rational Agency:** The agent updates beliefs Bayesianly and executes $d$.

  In clinical genomics, all three frequently fail. This protocol forces them into the open. It is designed for a 20-minute intake slot.

  ***

  # The Information Value Audit (IVA)

  **Operator:** Genetic Counsellor
  **Time:** 20 Minutes
  **Goal:** Determine if $Net Value(Result) > 0$.

  ## Step 1: The Actionability Filter (Testing Decision Value)
  **Decision Theory:** If no action changes based on the result, Decision Value ($DV$) = 0.
  **Value Judgment:** Defining "action" strictly as clinical/behavioral intervention vs. life planning.

  **Question:** "If this result comes back positive, what specifically will you do differently than if it comes back negative?"
  **Sufficient Answer:** A concrete change in surveillance, treatment, reproduction, or lifestyle *that is currently available*.
  **Insufficient Answer:** "I'll know," "I'll prepare myself," or "I'll tell my family" (unless family testing leads to *their* action).

  *   **STOP CONDITION (Hard No):** If $DV = 0$ AND there is a known psychological cost (see Step 2). This catches VUS and non-actionable risk scores.
  *   **Philosopher's Note:** We are laundering the value of "peace of mind" or "curiosity" as zero here. This is a clinical bias. If the patient values knowledge intrinsically, $DV > 0$. The counsellor must record if the patient asserts intrinsic value.

  ## Step 2: The Hedonic & Social Tax (Testing Costlessness)
  **Decision Theory:** Good assumes Information Cost $C(s) = 0$. In genetics, $C(s)$ includes anxiety, stigma, and insurability.
  **Value Judgment:** Weighing transient anxiety against durable knowledge.

  **Question:** "Results can cause worry for weeks or change how you see your future. Some people prefer not to know risks they can't fix. On a scale of 1-10, how much does uncertainty bother you compared to bad news?"
  **Sufficient Answer:** Patient demonstrates understanding that knowing *creates* a burden, not just resolves one.
  **Insufficient Answer:** "I can handle anything" (without evidence) or declining to answer.

  *   **STOP CONDITION (Hard No):** If Patient indicates high anxiety sensitivity AND $DV$ is low (from Step 1).
  *   **Handoff Point:** If Patient says, "I prefer not to know," this is a valid preference, not a mistake. Do not correct them. This addresses the "declining free results" case.

  ## Step 3: Agency Fidelity (Testing Rational Agency)
  **Decision Theory:** Good assumes you will execute the optimal action $d^*$. Behavioral economics shows you might not (inertia, fatalism).
  **Value Judgment:** Paternalism vs. Autonomy. When do we trust stated intent?

  **Question:** "You've said you would [increase screening/change diet]. If the result is positive, what is the biggest barrier to actually doing that?"
  **Sufficient Answer:** Identification of a concrete barrier (cost, time, fear) and a plan to mitigate it.
  **Insufficient Answer:** "I just will."

  *   **STOP CONDITION (Soft No):** If Patient admits high likelihood of inaction ("I know I won't do the surgery, but I want to know").
      *   *Counsellor Action:* Flag for clinician review. Offering a result that triggers guilt without action may have negative utility.
  *   **Philosopher's Note:** This is where we catch "patients who say they'll act and won't." If $P(Action|Positive) \approx 0$, then $DV \approx 0$.

  ## Step 4: The Externality Check (Testing Privacy/Scope)
  **Decision Theory:** Good assumes individual utility function $U_i$. Genetic info implies $U_{family}$ and $U_{chart}$.
  **Value Judgment:** Who owns the data? The patient or the biological collective?

  **Question:** "This result goes into your permanent medical record and implies risks for your relatives. Are you comfortable with that durability and potential sharing?"
  **Sufficient Answer:** Explicit acknowledgment of chart permanence and familial implication.
  **Insufficient Answer:** "It's just my business."

  *   **STOP CONDITION (Hard No):** If Patient refuses chart entry but result requires it for clinical validity.
  *   **Handoff Point:** If Patient is comfortable but relatives are not (e.g., adoption, estrangement). This is a values conflict the procedure cannot settle; refer to ethics consult.

  ## Step 5: Granularity Preference (Testing Signal Coarsening)
  **Decision Theory:** Information is monotonic. More bits $\ge$ fewer bits.
  **Value Judgment:** Right to Ignorance. A binary "Actionable/Not" signal may have higher utility than a specific risk % if the % causes paralysis.

  **Question:** "Do you want the specific number/risk, or just a 'Yes/No' on whether we can do something about it?"
  **Sufficient Answer:** Clear preference for Binary vs. Continuous.
  **Insufficient Answer:** Ambivalence.

  *   **Protocol Rule:** Honor the request for coarsened signal. This addresses "patients who ask for a deliberately coarsened signal." It is not "throwing away information"; it is optimizing the signal-to-noise ratio for *this* utility function.

  ***

  # Decision Matrix

  | Step | Outcome | Protocol Action |
  | :--- | :--- | :--- |
  | **1 (Action)** | No Action Possible | **Do Not Offer** (Unless Intrinsic Value asserted) |
  | **2 (Cost)** | High Anxiety/Low Tolerance | **Do Not Offer** (Respect Right to Ignorance) |
  | **3 (Agency)** | Will Not Act | **Counsel Against** (Warn of "Guilt without Utility") |
  | **4 (External)** | Objection to Record/Family | **Do Not Offer** (Logistical impossibility) |
  | **5 (Granularity)** | Request Binary | **Offer Binary Only** (Suppress raw data) |

  ***

  # Test Runs

  Here is the IVA applied to your three current board contentious cases.

  ### Case 1: Secondary Findings Panel (ACMG List)
  *Current Policy:* Offered by default (Opt-Out).
  *   **Step 1 (Action):** Most genes on the list are actionable (e.g., BRCA, Lynch). **Pass.**
  *   **Step 2 (Cost):** High potential for anxiety in healthy patients. Some patients explicitly prefer not to know predispositions. **Fail for Opt-Out.**
  *   **Step 3 (Agency):** Variable. Some will ignore surveillance recommendations. **Warning.**
  *   **Step 5 (Granularity):** Patients often want "Only tell me if I need surgery now," not "You have a 40% risk by age 70."
  *   **Verdict:** **The protocol rejects the Default Opt-Out model.**
      *   *Reasoning:* Good's Theorem requires the agent to *choose* the information to ensure $C(s)$ is acceptable to *them*. A default assumes $C(s) \approx 0$ for everyone. The IVA shows $C(s)$ is highly variable.
      *   *Recommendation:* Move to **Opt-In**. The counsellor must run Step 2 before the order is placed. If the patient does not actively choose the info, the assumption of Rational Agency is violated.

  ### Case 2: Polygenic Score (Late-Onset, No Intervention)
  *Current Policy:* Offered as part of "Comprehensive Wellness."
  *   **Step 1 (Action):** By definition, "No Intervention." $DV_{clinical} = 0$.
      *   *Counter-argument:* Life planning (financial, retirement).
      *   *IVA Check:* Does the patient assert intrinsic or planning value? If yes, $DV > 0$. If no, $DV = 0$.
  *   **Step 2 (Cost):** High hedonic cost (anxiety about inevitable decline).
  *   **Step 3 (Agency):** Cannot act on result. $P(Action) = 0$.
  *   **Verdict:** **Do Not Offer.**
      *   *Reasoning:* Unless the patient explicitly asserts "Life Planning" as a valid action in Step 1, the Net Value is negative (Cost > 0, Benefit = 0). Offering this by default violates Good's Theorem because the information is not free (psychological cost) and cannot be acted upon.
      *   *Exception:* Only offer if Step 1 yields "I will adjust my financial planning/retirement age." If they say "I just want to know," deny it. That is curiosity, not clinical utility.

  ### Case 3: Patient Requesting "Actionable Only" Disclosure
  *Current Policy:* Often resisted by labs/counsellors as "incomplete data."
  *   **Step 1 (Action):** Patient defines actionability as the filter.
  *   **Step 5 (Granularity):** Patient explicitly requests coarsened signal (Binary: Actionable/Not).
  *   **Decision Theory Check:** Is $E[U|Binary] > E[U|Full]$?
      *   If Full Data causes anxiety that prevents action, then Yes.
      *   If Full Data allows better risk stratification, then No.
  *   **Verdict:** **Grant the Request.**
      *   *Reasoning:* This is a valid optimization of the utility function. The patient is minimizing $C(s)$ (anxiety from non-actionable findings) while retaining $DV$ (actionable findings). The protocol validates this as rational, not "throwing away information."

  ***

  # Summary for the Board

  If you adopt this protocol, three things will happen:

  1.  **Secondary Findings must become Opt-In.** You cannot assume $C(s) = 0$. The "Default" is a value judgment that Knowledge is Always Good. The IVA proves it is not.
  2.  **Non-Actionable Polygenic Scores will drop off.** Unless a patient articulates a non-clinical use (financial planning), the arithmetic is $0 - Cost < 0$. You are currently selling anxiety.
  3.  **"Actionable Only" requests must be honored.** This is not withholding care; it is respecting the patient's cost function.

  **The Unsettled Cases:**
  The IVA cannot resolve conflicts where the patient's utility function harms others (Step 4). If a patient wants a result that implicates a sibling who explicitly does *not* want to know, the math breaks. $U_{patient} > 0$, but $U_{sibling} < 0$. The protocol flags this for Ethics, not Counselling.

  **Philosopher's Final Note:**
  Good's Theorem works in the lab because the "agent" is a rational maximizer with no feelings. In the clinic, the "cost of information" is often the *point* of the visit. This protocol does not fix that, but it stops you from pretending the cost doesn't exist. Use it to shift the burden of proof: The default is *not* to know. The patient must demonstrate why knowing adds value.
