answer: |-
  Your hypothesis is correct. The stalemate is not empirical; it is structural and normative. The debate persists because the two camps are not arguing over the same proposition. They are arguing over two different propositions that intersect at the word "integration," creating the illusion of a single dispute.

  Here is the diagnosis based on the specific axes of reciprocity, membership, and the bounds of justice, followed by an assessment of whether the debate can be moved.

  ### I. Diagnosis: The Category Error

  The debate is best diagnosed as **two questions being answered under one heading.** Camp A (Open Borders) answers a question of *moral entitlement*, while Camp B (Welfare State) answers a question of *institutional feasibility*. Because both sides use the vocabulary of "justice" and "solidarity," they appear to be disagreeing on facts, when they are actually disagreeing on the category of the problem.

  Here is how this plays out across your three specified dimensions:

  **1. Reciprocity: Generalized vs. Specific**
  *   **Camp A (Entitlement):** Views reciprocity as **generalized and systemic**. My contribution to the tax base sustains the system, and the system sustains me. The identity of the other contributor is irrelevant; only the aggregate solvency matters. When they speak of "integration," they mean *economic absorption*—can the migrant enter the labor stream to maintain the ratio of contributors to beneficiaries?
  *   **Camp B (Feasibility):** Views reciprocity as **specific and relational**. I contribute because I trust *this specific group* of people will not defect, will share my sacrifices, and will vote to sustain the scheme when times are hard. When they speak of "integration," they mean *normative alignment*—does the migrant share the specific motivational structure required to sustain high-trust redistribution?
  *   **The Clash:** Camp A presents fiscal data (aggregate contributions) to prove reciprocity exists. Camp B rejects this data as irrelevant because it measures *capacity* to pay, not the *willingness* to sustain a common fate.

  **2. Membership: Juridical vs. Ethical**
  *   **Camp A:** Treats membership as a **juridical status** derived from presence and subjection to law. If you are subject to the state's coercion and contribute to its revenue, you are a member. Boundaries are administrative lines that manage flow, not moral containers.
  *   **Camp B:** Treats membership as an **ethical status** derived from shared history, culture, or democratic authorship. Boundaries are the walls of the "club" that make the goods inside valuable. Without a pre-existing "we," there is no entity capable of bearing the obligation of redistribution.
  *   **The Clash:** Camp A argues that excluding people violates the definition of membership (arbitrary boundary). Camp B argues that including people without shared ethical status dissolves the definition of membership (loss of solidarity). They are using the same word to describe two different ontological categories.

  **3. Bounds of Justice: Cosmopolitan vs. Statist**
  *   **Camp A:** Operates on a **Cosmopolitan** axiom. Justice is universal; the state is merely a tool for delivery. If the tool breaks (welfare state collapses), we fix the tool (engineering), we do not restrict the users (borders).
  *   **Camp B:** Operates on a **Statist/Communitarian** axiom. Justice is particular; the state (or nation) is the *source* of obligation, not just the delivery mechanism. If the community dissolves, justice becomes impossible, regardless of engineering.
  *   **The Clash:** This is the root of the "temporal scale" disagreement you noted. Camp A accepts short-term friction for long-term universal justice. Camp B views short-term friction as an existential threat to the very agent (the nation-state) capable of delivering justice.

  **Verdict:** This is not merely a verbal disagreement, nor simply a dispute over evidence standards. It is a **category error**. Camp A is making a deontological claim (rights of entry), while Camp B is making a consequentialist claim (sustainability of distribution). They meet at "integration," but for A, integration is an *output* of justice (we integrate them because it is right); for B, integration is an *input* of justice (we can only be just if they are integrated).

  ### II. Prognosis: Can the Debate Move?

  Given this diagnosis, the likelihood of resolution is low, but the nature of the stalemate can be clarified. Here is an evaluation of the potential "movers" you suggested:

  **1. Conceptual Distinction: Resource Constraints vs. Solidarity Constraints**
  *   *Utility:* High.
  *   *Analysis:* Explicitly separating these would force Camp A to admit that fiscal solvency (resource) does not guarantee political will (solidarity). It would force Camp B to admit that solidarity is not magical; it can be engineered or eroded by policy.
  *   *Limitation:* Camp B argues that solidarity *is* a resource. Distinguishing them might not help if Camp B views the loss of solidarity as functionally identical to a budget deficit (i.e., the system stops working). However, it would stop Camp A from citing fiscal studies as a rebuttal to solidarity concerns.

  **2. Formal Framing: Membership Goods as Non-Excludable but Rivalrous**
  *   *Utility:* Medium.
  *   *Analysis:* Framing welfare solidarity as a "common pool resource" (rivalrous) rather than a "public good" (non-rivalrous) clarifies the tension. It acknowledges that adding members *does* dilute the good (trust), even if it adds capital.
  *   *Limitation:* This economic framing often alienates Camp A, who view rights as non-rivalrous. It risks reducing a moral claim to a cost-benefit analysis, which Camp A rejects on principle. It clarifies the trade-off but doesn't resolve the moral weight of the trade-off.

  **3. Reframed Empirical Question**
  *   *Utility:* Low.
  *   *Analysis:* As you noted, neither side updates on new fiscal-impact studies. This is because the empirical question is being used to fight a normative war. New data on "trust decay" will be dismissed by Camp A as culturally essentialist, and new data on "fiscal contribution" will be dismissed by Camp B as politically naive.
  *   *Limitation:* Empirical evidence cannot settle foundational axioms. You cannot prove "nationality is morally arbitrary" false with a spreadsheet.

  ### III. Conclusion: Expect Permanent Stalemate

  You should expect a **permanent stalemate**, not because the participants are irrational, but because they are operating within **incommensurable normative frameworks.**

  *   **Why:** The debate is a proxy war between Cosmopolitan Liberalism and Social Democratic Statism.
      *   For the Cosmopolitan, restricting movement to save the welfare state is sacrificing the *universal* for the *particular*, which is morally impermissible.
      *   For the Statist, opening borders to satisfy universal rights is sacrificing the *particular* conditions that make justice *possible*, which is practically self-defeating.

  **The only path forward is not resolution, but explicit trade-off acknowledgment.**
  The debate will only mature if both sides stop pretending their position is empirically necessitated and admit it is a prioritization of values.
  *   Camp A must admit: "We prioritize the right of movement even if it risks downsizing the welfare state to a safety net."
  *   Camp B must admit: "We prioritize the depth of redistribution even if it requires restricting the right of movement."

  Until the vocabulary of "integration" is discarded in favor of "trade-offs between scope and depth of justice," the dialogue will remain a stalemate of mutually unintelligible empirical claims masking a foundational normative conflict. Your hypothesis that this is a conflict about the moral function of nationality is the correct diagnostic key.
