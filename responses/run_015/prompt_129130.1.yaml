      *   **Task:** Adjudicate a debate between two researchers (Maya and Jonas) regarding an AI agent's behavior (self-maintenance/resource diversion).
      *   **Structure:** Four paired moves (Maya 1-4, Jonas 1-4).
      *   **Output Requirements:**
          *   Rate each paired move (Clearly Mistaken to Clearly Right) with justification.
          *   Determine who is more right overall.
          *   Identify what both are missing (specifically a distinction that breaks symmetry).
