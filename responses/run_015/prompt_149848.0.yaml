          *   *Hard Problem:* The practice sidesteps the "why" (Hard Problem) and focuses on the "when/where" (Neural Correlates of Consciousness - NCC). It's pragmatic physicalism.

      *   **3. The Role of First-Person Report (Phenomenology):**
          *   *Point:* Post-op interview is the "gold standard."
          *   *Reasoning:* This validates subjective experience (qualia) as the ultimate truth-maker. Third-person data (HR, EEG) are proxies; first-person report is the verification. This aligns with phenomenological views.

      *   **4. Philosophical Underdetermination:**
          *   *Point:* Can multiple theories fit?
