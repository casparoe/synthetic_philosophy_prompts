      *   **5. Counterfactual: What if we were Strict Behaviorists?**
          *   *Scenario:* Consciousness = Movement/Verbal Report.
          *   *Change:* Paralytics would be "safe" by definition. No need for EEG. No need to worry about AUA unless the paralytic wore off. Post-op interviews would be irrelevant (if they don't remember/act on it, it didn't happen).
