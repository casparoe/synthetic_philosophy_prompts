answer: |-
  Here is a specification for a **Theory of Distributed Instantiation (TDI)** tailored for prudential calculus rather than metaphysical verdict.

  ### The Spec: Requirements for Prudential Utility

  **1. Causal Anchoring (Non-Negotiable)**
  *   **Requirement:** Instantiation weight $W$ must decay to zero if causal continuity is broken, regardless of structural fidelity.
  *   **Case:** The accidental structural duplicate.
  *   **Rationale:** Without this, you must care as much about a random molecule-swapped duplicate in a distant galaxy as your own tomorrow. Prudential concern requires a "line of transmission" (memory, influence, symbol-shuffling) to distinguish *me* from *someone like me*.

  **2. Fidelity Scaling (Non-Negotiable)**
  *   **Requirement:** $W$ must be a continuous function of pattern resolution, not binary.
  *   **Case:** One pattern spread over twenty brains at 5% each vs. one brain at 100%.
  *   **Rationale:** To guide decision-making, the theory must distinguish between a friend who knows your quirks (low $W$) and your future self who holds your intentions (high $W$). If $W$ is binary, you cannot weigh trade-offs.

  **3. Temporal Indexing (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish synchronic distribution (spread across people *now*) from diachronic survival (spread across time).
  *   **Case:** Spread across people at one time vs. survival across time.
  *   **Rationale:** Prudential concern is inherently forward-looking. If synchronic spread counts as full survival, you are already "immortal" in your friends' heads, rendering future planning incoherent. You need a variable $T$ that weights future instantiation higher than present parallel instantiation for the sake of *planning*.

  **4. Overlap Sensitivity (Non-Negotiable)**
  *   **Requirement:** $W$ must be higher when the source pattern is still active (overlapping existence) than when it is extinct (post-mortem copy).
  *   **Case:** Copy made while alive vs. one made after death.
  *   **Rationale:** Handover matters. A copy made while you live allows for verification and transfer of indexical intent ("I mean *this* goal"). A post-mortem copy is a static artifact. Prudential concern tracks the *trajectory* of goals, not just their snapshot.

  **5. Conservation of Measure (Metaphysical Nice-to-Have)**
  *   **Requirement:** $\sum W \le 1$ across all instantiations at any given time $t$.
  *   **Case:** Fission where halves aren't equal; the "conservation vs. additive" debate.
  *   **Rationale:** This addresses your specific worry. If you want to preserve the intuition that "there is only one of me to go around," you need this. However, see *Incompatibilities* below.

  ---

  ### The Conservation Question
  **Verdict:** Conservation should **not** be on the Non-Negotiable list. It is a metaphorical hangover.

  **Reasoning:** Patterns are non-rivalrous goods (like software); physical stuff is rivalrous. If your "self" is a pattern, it can be instantiated in 100 brains without thinning the code in the original. If you enforce conservation for prudential concern, you arrive at absurdity: *You should avoid being known too well, because every friend who understands you dilutes your future survival weight.* That contradicts the Hofstadterian intuition that being "more spread out" is a form of richness, not loss.

  For prudential concern, **Additivity** is usable (more instantiation = more total value to care about), whereas **Conservation** is self-defeating (more instantiation = less reason to care about any specific instance). Keep Conservation only if you are committed to a substance-based metaphysics disguised as patternism.

  ---

  ### Incompatibilities (The "Unsatisfiable" Flags)

  **1. Distributed Ontology vs. Localized Agency (Critical Failure)**
  *   **Conflict:** If the self is truly distributed (Req 2), prudential concern *should* be distributed. But agency is localized (you act from one skull).
  *   **Result:** You cannot use this theory to maximize "global self-interest" because you cannot act on the 5% of you in twenty other brains. The theory can diagnose *where* you survive, but it cannot guide *what you do* unless you privilege the local instantiation arbitrarily.
  *   **Flag:** **Incompatible.** You must break the symmetry and privilege the "home" brain for decision-making, which undermines the claim that the other instantiations are *you* in a prudentially relevant sense.

  **2. Conservation vs. Fission Logic**
  *   **Conflict:** In fission, if two halves emerge, Conservation demands $W_1 + W_2 = 1$ (e.g., 0.5 each). Additive Pattern Logic demands $W_1 = 1, W_2 = 1$ (the pattern is fully present in both).
  *   **Flag:** **Incompatible.** You cannot have a pattern that is fully replicable and a measure of selfhood that is finite. You must choose: is 'you' the *token* (conserved) or the *type* (additive)? Hofstadter implies Type, but your prudential intuition implies Token.

  ---

  ### View Evaluation

  **Parfit-Style Psychological Continuity:**
  Passes Causal Anchoring and Fidelity Scaling easily (Relation R comes in degrees). Fails Temporal Indexing slightly (Parfit is often neutral on time) and rejects Conservation explicitly (survival isn't what matters). It handles the "degree" requirement best but struggles with the "spread across brains" aspect without modification.

  **Animalist View:**
  Fails immediately. It is binary (you are the organism) and local (one skull). It cannot handle fission, distribution, or degrees of instantiation without ceasing to be Animalism. It offers zero utility for your specific spec.

  ---

  ### Confidence & Uncertainty

  **Confidence:** High (85%) on the logical tensions identified (specifically that Conservation contradicts Pattern Ontology).
  **Least Sure Point:** Whether **Temporal Indexing** can be justified metaphysically. If the pattern is the self, why does *time* matter more than *structure*? Privileging the future over the synchronous present looks like a brute fact of biology, not a feature of the pattern theory itself. If you can't ground that, the theory collapses into "care about everyone who knows you," which is action-guiding nonsense.
