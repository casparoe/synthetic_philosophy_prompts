  *(Self-Correction during drafting)*: I need to make sure I don't just say "Thesis 1 is Campbell's Law." The user asked to avoid genealogy. I will describe the *content* of the thesis without naming the sociological laws unless necessary for clarity, focusing on the mechanism. I will stick to the user's requested structure.

