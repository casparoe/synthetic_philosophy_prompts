answer: |-
  Good morning. Welcome to "History for the Future."

  Look around this room. It is a rare ecosystem. On one side, I see people who treat the past as a sacred text, who know that context is everything. On the other, I see people who treat the future as a construction site, who know that deadlines are everything.

  Usually, these two groups meet only when something has gone wrong. A building is threatened, a site is endangered, a policy is challenged. Today, we are meeting before the crisis hits. That is a luxury, and it is a responsibility.

  The title of this workshop mentions the "Weight of Precedent." That weight is not neutral. Depending on how we lift it, it can either build muscle or break our backs. There is a famous framework from the 19th century—you know it, and you don't need to know it—that suggests there are three ways to use history. I want to suggest that for the next two days, we should measure every conversation against these three modes.

  First, there is **Monumental History**. This is the history of great deeds, of heroes, of survival. It is inspiring. But in the context of climate adaptation, it is also dangerous. It tempts us to look at past resilience and assume it guarantees future safety. We tell ourselves, "We survived the storm of '38, we'll survive this." But the infrastructure of 1938 is not the infrastructure of 2024.

  There is a specific trap here. It's the urge to honor the effort rather than the outcome. It's like unveiling a bronze plaque on a levee that breached in '95. We stand there, hats off, honoring the concrete, while quietly ignoring the water that went over it. It's a slightly awkward thing to admit at a gathering of professionals, but we have to ask: Are we building adaptation strategies, or are we building monuments to our own persistence?

  Second, there is **Antiquarian History**. This is the love of the local, the preservation of the archive, the reverence for what already exists. For my historian colleagues, this is your home turf. You know better than anyone that every document matters, every brick has a story.

  But for the planners and climate officers in the room, you know the friction this creates. If every local archive is sacred, and every existing structure is untouchable, adaptation becomes paralysis. We cannot retrofit a city if we are too afraid to open the walls. The antiquarian mode preserves the past, but it does not necessarily protect the people living in it. Historians, I am not asking you to stop caring about preservation. I am asking you to help us distinguish between what must be saved and what must be let go.

  Which leaves us with the third mode: **Critical History**.

  This is the only mode that lets us put the past on trial. It allows us to judge previous decisions, to abandon failed precedents, and to say, "This worked then, but it kills us now."

  I know what some of you are thinking. To a historian, "critical" can sound like "destructive." It sounds like iconoclasm. To a planner, it can sound like "politics." But critical history is not about erasing the past. It is about curating it for the sake of the living. It is the discipline of knowing when to stop citing precedent and start writing new code.

  So, here is my challenge for this workshop.

  To the historians: Do not let us fall into the trap of the monumental. When we talk about resilience, ask us: "Resilience for whom, and at what cost?" Keep us honest.

  To the planners: Do not view the historians as the department of "no." They are not here to stop you from building. They are here to ensure that what you build doesn't become a monument to failure twenty years from now.

  We are not here to worship the past. We are not here to bury it. We are here to use it. Let's have a critical few days.

  Thank you.
