      *   **Pain Asymbolia:** Patients feel sensory-discriminative pain (location, intensity) but lack the affective-motivational component (no distress, no avoidance).
      *   **Predictive Processing (PP):** The brain is a prediction machine. Perception is controlled hallucination minimized by error signals. Interoception is the prediction of internal bodily states. Pain is a specific kind of prediction error regarding bodily integrity.

