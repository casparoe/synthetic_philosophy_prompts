prompt: |-
  I teach philosophy at a small liberal-arts college, and this spring I am running an upper-level seminar on social epistemology: 24 students, one 90-minute session a week, and a three-week unit in which I want them to get genuinely confused about majority rule before I tell them anything. The unit is nominally about Condorcet's jury theorem, but it happens to fall in the same term in which my department is rewriting its hiring procedure, and the argument in the faculty meeting is a live one: our chair wants four subcommittees of six, each reporting a single recommendation up to a full meeting that then votes on those four recommendations, on the grounds that this concentrates expertise; a second colleague wants the whole department in one room, discussing together and then voting; a third wants secret ballots and no discussion at all. So I would like this session to be an experiment in which the students test these procedures rather than a lecture in which I evaluate them. What I need is a runnable game, sized for my room, that leaves them having felt two things in their bones. First, that a majority of individually feeble signals is strikingly more reliable than any single member of the group, including its strongest member. Second, that this reliability is not a gift of numbers but a gift of error being independent, and that two quite different mechanisms — a shared cause standing behind everyone's evidence, and people deferring to what earlier people said — destroy it in ways that are measurably different from each other. I do not want the words independence, correlation, or Condorcet used in front of them until the debrief; the mechanics should make the failure arrive before it has a name.

  What I have so far is this: a coin, two opaque bags of poker chips, one with a red majority and one with a blue majority, the coin deciding which bag is in play, each student drawing one chip with replacement as a private signal of which bag it is, and the class voting by secret ballot on index cards; afterwards I compare the majority verdict with the verdict of whichever student was individually most accurate across the round. Beyond that I am stuck, and especially on the arithmetic: I need you to fix the chip proportions, the number of trials per condition, and the group sizes so that the effects are actually visible with n = 24. My worry is that a straight majority of 24 will be right almost every time and there will be no headroom left in which a later condition can look worse. I would like four conditions in the same session: the baseline just described; a common-cause condition in which errors are correlated without anybody copying anybody (my thought is that students draw in pairs, each pair being shown a single chip, so that the number of draws halves while the number of votes does not — tell me whether that is the right instrument and what it does to the numbers); a deference condition in which votes are cast in a fixed public order and later voters see the running tally; and, because of the hiring dispute, a two-tier condition in which the class is split into four juries of six that each return a verdict, the final decision being the majority of those four verdicts. Scoring has to be in points toward something trivial, since I have no budget and would rather not hand out money, but it has to be enough that students care whether they personally are right. I also want one deliberate wrinkle I have been turning over and cannot get to work: somewhere in the sequence, let students who believe their own signal is especially strong declare that and have their vote count double, so that the class discovers for itself why self-reported confidence is not the same thing as competence. Tell me whether that belongs in, where, and what it will do. Please give me the materials, the roles (a tally clerk, an announcer, whatever else), a minute-by-minute timeline for 90 minutes including setup and teardown, and the exact instructions to read aloud — including what to say to a student who asks, halfway through, what the point of all this is.

  Then the part I most need: a debrief that maps specific moments the students will have lived through onto specific features of the theorem — the competence condition, the independence condition, the difference between a shared cause and deference, and whatever the two-tier result really shows about my chair's proposal. I want to be told honestly which of the four conditions is most likely to fail to produce its effect in a single session, and what I should do on the spot if the numbers come out backwards; how to handle the fact that by the third condition the students will have worked out that they themselves are the subjects of the experiment; and what to do if one student's private accuracy is so high that the group looks bad beside them. And I want a frank note on what the game cannot show: I take it that it cannot reproduce anything asymptotic, and that because my signals travel between students as bare verdicts rather than as reasons, it will make discussion look worse than it is — say clearly what I will have to supply in words at the end instead. No citations or reading list, please. Structure the answer under clear headings, with the read-aloud instructions set off from your commentary, and finish with a single line beginning Headline: that states, in one sentence, the design choice that does the most work in making independence visible to the participants.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy seminar, social epistemology, 24 students, 90 minutes.
      *   **Goal:** A runnable game/experiment to teach Condorcet's Jury Theorem (CJT) concepts *before* lecturing on them.
      *   **Key Learning Objectives:**
          1.  Majority of weak signals > single best expert.
          2.  Reliability depends on *independence* of errors, not just numbers.
          3.  Two mechanisms destroy independence differently: Common Cause (correlated errors) vs. Deference (informational cascades).
          4.  Two-tier voting (subcommittees) vs. Plenary voting (relevant to department hiring dispute).
          5.  Self-reported confidence $\neq$ competence (the "double vote" wrinkle).
      *   **Constraints:** No jargon (independence, correlation, Condorcet) until debrief. 24 students. 4 Conditions. Needs specific arithmetic/probabilities to ensure visible effects. Needs roles, timeline, script, scoring, and debrief strategy.
      *   **Specific Worries:** Ceiling effects (24 voters might be *too* accurate), failure of conditions to show expected effects, students figuring it out too early, one superstar skewing results, limitations of the model (no reasons exchanged).

  2.  **Design the Game Mechanics (The Arithmetic):**
      *   *Problem:* With $n=24$ and even moderate competence (e.g., $p=0.6$), the probability of the majority being wrong is vanishingly small ($<1\%$). This creates a ceiling effect where Condition 1 (Baseline) is perfect, making it hard to show Condition 2 & 3 are *worse*.
      *   *Solution:* Reduce the effective $n$ or reduce the competence $p$.
      *   *Signal Quality:* The chip draw needs to be noisy. If the bag is 60% Red / 40% Blue, $p=0.6$. If 55% / 45%, $p=0.55$.
      *   *Condition 1 (Baseline):* 24 independent voters. To make failures visible, we need lower $p$ or fewer effective voters. Let's aim for $p \approx 0.6$. With $n=24$, $P(\text{majority wrong}) \approx 0.04$. That's 1 in 25. Might be too rare to see in one session.
      *   *Adjustment:* We need the "truth" to be harder to find. Let's make the chip ratio 55/45. $p=0.55$. With $n=24$, $P(\text{error}) \approx 0.15$. That's visible.
      *   *Condition 2 (Common Cause):* The prompt suggests pairs sharing a signal. If 12 pairs draw 1 chip each, that's effectively $n=12$ independent signals, but 24 votes. The votes within a pair are perfectly correlated. Effective $n$ drops from 24 to 12. With $p=0.55$, $P(\text{error}_{n=12}) \approx 0.24$. Distinct drop in performance.
      *   *Condition 3 (Deference/Cascade):* Sequential voting. If early voters get unlucky, later voters ignore private signals. This can lead to 100% error in extreme cases, but usually just degrades performance significantly.
      *   *Condition 4 (Two-Tier):* 4 groups of 6. Majority of 6 groups decides. This is mathematically similar to Condition 2 but structurally different. 4 groups means the final decision rests on 4 "votes" (the group verdicts). If groups are small ($n=6$), they make errors more often than the whole group ($n=24$).
          *   Group accuracy ($n=6, p=0.55$): $P(\text{group right}) \approx 0.65$.
          *   Final accuracy (Majority of 4 groups): Need 3 out of 4 groups right. $P(\text{final right}) \approx 0.65^3 \times \dots \approx 0.58$.
          *   Compare to Baseline ($n=24$): $P(\text{right}) \approx 0.85$.
          *   *Verdict:* This shows a massive drop. Good for the Chair's argument critique.
      *   *The "Double Vote" Wrinkle:* Let students claim "high confidence" for a double vote. This usually hurts because confidence doesn't correlate with signal accuracy in this setup (it's random chance). It adds variance. Best placed in Condition 1 or 4. Let's put it in Condition 1 to establish the baseline "expert" fallacy early.

  3.  **Refining the Conditions for 90 Minutes:**
      *   90 minutes is tight for 4 conditions + setup + debrief.
      *   Setup/Intro: 10 mins.
      *   Condition 1 (Baseline + Double Vote): 20 mins.
      *   Condition 2 (Common Cause): 15 mins.
      *   Condition 3 (Deference): 15 mins.
      *   Condition 4 (Two-Tier): 15 mins.
      *   Debrief: 15 mins.
      *   *Risk:* Too rushed. Need to streamline.
      *   *Consolidation:* Combine Double Vote into Condition 1. Ensure transitions are snappy.
      *   *Scoring:* Points for candy or "participation credit" (even if trivial, it needs to feel real). Let's use a "Class Treasury" that buys donuts next week. Personal accuracy + Group accuracy.

  4.  **Addressing Specific Worries:**
      *   *Ceiling Effect:* Use 55/45 chip ratio. It's noisy enough.
      *   *Condition Failure:* If Baseline loses, acknowledge luck. If Common Cause wins, acknowledge variance. The *trend* matters more than single data points. I need to advise the professor on how to handle "bad data."
      *   *Students Figuring It Out:* They will. Acknowledge it. "You are the data."
      *   *Superstar:* If one student is right 100% of the time (luck), compare their *average* across conditions. Or emphasize that we didn't know *who* they were beforehand.
      *   *Limitations:* The game lacks *reasons*. Discussion usually helps if reasons are shared. Here, discussion is just "I vote Red." Need to clarify this in debrief.

  5.  **Drafting the Plan (Iterative Process):**
      *   *Materials:* Poker chips (Red/Blue), Opaque bags, Index cards, Pens, Projector/Board for tally.
      *   *Roles:* Tally Clerk (neutral), Bag Master (prof), Timekeeper (student).
      *   *Script:* Needs to be authoritative but neutral. "Don't ask why, just play."
      *   *Debrief:* Connect the felt experience to the theory.
      *   *Headline:* Needs to be punchy.

  6.  **Calculations Check:**
      *   $p = 0.55$ (55% correct signal).
      *   **Cond 1 (Indep, n=24):** $P(\text{Majority Correct}) = \sum_{k=13}^{24} \binom{24}{k} (0.55)^k (0.45)^{24-k} \approx 0.85$. (Expected 1-2 losses in 10 rounds, but we only do 3 rounds per condition. Might get 3/3 right. Need to lower $p$ or accept variance.)
      *   *Correction:* To guarantee visible failure in Cond 1, we need more rounds or lower $p$. If $p=0.52$, $P(\text{Majority Correct}) \approx 0.68$. That's better for showing it's not magic. But $p=0.52$ is hard to engineer with chips (52/48?). Let's stick to 55/45 but run *5 rounds* per condition? No, time.
      *   *Alternative:* Make the "truth" change every round.
      *   *Decision:* I will recommend a 60/40 split for the *Baseline* to ensure they win (building trust in the majority), but a 55/45 split for the *Correlated* conditions to make the drop sharper? No, must keep signal quality constant to isolate the variable (independence).
      *   *Revised Decision:* Use 55/45. It's the only way to see errors in Cond 1. If Cond 1 goes 3/3, that's fine, as long as Cond 2 goes 1/3. The *difference* is the lesson.
      *   *Two-Tier Math:* 4 groups of 6. Group accuracy ($n=6, p=0.55$) $\approx 0.65$. Final vote (3 of 4 groups). $P(\text{Final Correct}) \approx 0.48$ (It's basically a coin flip!). This is a strong result against the Chair's plan.
      *   *Double Vote:* If 5 students claim double votes randomly, it adds noise. If they claim it based on "feeling," it's still noise. It shows weighting by confidence fails without calibration.

  7.  **Structuring the Response:**
      *   **Game Design & Arithmetic:** Explain the numbers.
      *   **Materials & Roles:** What is needed.
      *   **Timeline:** Minute-by-minute.
      *   **Script:** Read-aloud instructions.
      *   **Contingency Plans:** What if the data breaks?
      *   **Debrief:** Mapping experience to theory.
      *   **Limitations:** What the game misses.
      *   **Headline:** The one-liner.

  8.  **Refining the "Double Vote" Wrinkle:**
      *   Where does it fit? Condition 1.
      *   Instruction: "If you feel extremely certain about your chip, mark your card with a STAR. This counts as two votes."
      *   Outcome: Since the chip draw is random, confidence is uncorrelated with accuracy. The "weighted" majority will likely perform *worse* or the same as unweighted, demonstrating that uncalibrated confidence adds variance, not signal.
      *   *Wait:* If it performs the same, the lesson is weak. If it performs worse, the lesson is strong. Weighting uncorrelated noise increases variance. I'll place it in Condition 1.

  9.  **Refining the "Common Cause" Instrument:**
      *   Prompt suggests: "students draw in pairs, each pair being shown a single chip."
      *   Mechanism: 12 pairs. One chip drawn per pair. Both students in the pair record that color.
      *   Effect: 24 votes, but only 12 independent signals.
      *   Math: $n_{eff}=12$. $P(\text{Majority Correct})$ drops from 0.85 to 0.68. Visible drop.

  10. **Refining the "Deference" Instrument:**
      *   Mechanism: Students stand and announce vote in order.
      *   Effect: Informational Cascade. If first 3 vote Red (by luck), #4 might vote Red even if they drew Blue, assuming the first 3 know something.
      *   Risk: Philosophy students might rebel and vote their signal.
      *   Mitigation: Incentivize being on the *winning side*, not just finding truth. "You get points if the Class wins." This encourages herding.

  11. **Refining the "Two-Tier" Instrument:**
      *   Mechanism: 4 tables of 6. Table decides internally (majority). Table Chair reports to Prof. Prof takes majority of 4 Chairs.
      *   Effect: Compounds error.
      *   Math: As calculated, accuracy drops to ~50%.

  12. **Final Review against Constraints:**
      *   No jargon until debrief? Yes.
      *   90 minutes? Tight but doable if transitions are strict.
      *   Scoring? "Class Treasury" for donuts.
      *   Headline? Needs to be about the *structure* of information flow.

  13. **Writing the Content:** (Self-Correction during drafting)
      *   *Correction on Time:* 90 minutes is very short for 4 conditions + debrief. I need to advise cutting Condition 4 if time runs out, or merging 2 & 3. No, the prompt asks for 4. I will prioritize the Debrief time. I'll suggest 3 rounds per condition to save time.
      *   *Correction on Script:* Keep it dry. "This is a procedure test."
      *   *Correction on Debrief:* Ensure the link to the Hiring Dispute is explicit.

  14. **Final Polish:** Check the tone. Professional, pedagogical, precise. Ensure the "Headline" is at the very end.

  *(Self-Correction on the "Double Vote" logic)*: If I let them self-select double votes, and they are wrong, the group loses more points. This highlights the danger of uncalibrated weighting. I will place this in Round 1 of Condition 1.

  *(Self-Correction on "Common Cause")*: The prompt asks: "tell me whether that is the right instrument." Yes, shared signal is the standard way to model common cause in this context. It reduces $N_{effective}$.

  *(Self-Correction on "Debrief")*: Must address the "Discussion" limitation. The game uses bare votes. Real faculty meetings have reasons. I need to explicitly state that *reasons* can restore independence, but *pressure* destroys it.

