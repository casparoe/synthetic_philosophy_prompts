answer: |-
  # Game Design and Arithmetic

  To make the effects visible with $N=24$ in a single session, we must tune the signal noise carefully. If the signal is too clear (e.g., 70/30 chips), the Baseline condition will be perfect (100% accuracy), leaving no room to show degradation. If it is too noisy (50/50), the Baseline will look like a coin flip, undermining the lesson that majorities work.

  **The Signal:** Use a **55% / 45%** split in the poker chips.
  *   **Bag A:** 55 Red, 45 Blue.
  *   **Bag B:** 55 Blue, 45 Red.
  *   **Competence ($p$):** 0.55. This is "better than chance" but "far from certain."

  **The Arithmetic of Failure:**
  *   **Condition 1 (Baseline, $N=24$ independent):** Probability of Majority Error $\approx$ 15%. You should expect 1 loss in 3 rounds. This establishes that the group is *good*, but not magic.
  *   **Condition 2 (Common Cause, $N_{eff}=12$):** Pairs share one draw. Probability of Majority Error $\approx$ 32%. You should expect 1 loss in 3 rounds, but the *margin* of victory will be thinner.
  *   **Condition 3 (Deference/Cascade):** Sequential public voting. Error rate is volatile but often spikes to 50%+ if an early cascade locks in the wrong color.
  *   **Condition 4 (Two-Tier, 4 groups of 6):** Group accuracy ($N=6$) $\approx$ 65%. Final accuracy (Majority of 4 groups) $\approx$ 52%. This is the killer: the Two-Tier system performs barely better than a coin toss, while the Baseline performs at 85%.

  **The "Double Vote" Wrinkle:**
  Place this in **Condition 1**. Allow students to mark a star on their ballot for a double vote. Since confidence is uncorrelated with the random chip draw, this adds variance without adding signal. It will likely lower the group's score or leave it unchanged, demonstrating that uncalibrated weighting is dangerous.

  **Scoring:**
  Create a "Class Treasury" on the board.
  *   **Individual Accuracy:** +1 point per correct personal vote.
  *   **Group Accuracy:** +5 points to *everyone* if the Group Verdict matches the Truth.
  *   **Reward:** If the Treasury reaches 100 points by the end, you buy donuts for the next class. This aligns individual incentive with group success without requiring cash.

  # Materials and Roles

  **Materials:**
  *   2 Opaque bags (labeled "Bag 1" and "Bag 2" only for your reference; students don't see labels).
  *   200 Poker Chips (110 Red, 90 Blue for Bag 1; vice versa for Bag 2). *Note: You must swap bags secretly between rounds.*
  *   100 Index Cards (small, for voting).
  *   Pens (25).
  *   Whiteboard (for Treasury and Tally).
  *   4 Small bowls (for Condition 4).

  **Roles:**
  *   **The Convener (You):** Manage the bags, announce the start/stop, hold the truth key.
  *   **The Tally Clerk (1 Student):** Neutral. Collects cards, counts votes, writes the tally on the board. Rotates per condition.
  *   **The Timekeeper (1 Student):** Enforces the 3-minute voting windows.
  *   **The Auditors (2 Students):** Verify the chip counts in the bags before class starts (to establish trust).

  # Timeline (90 Minutes)

  *   **00:00 – 00:10 (10 min):** Setup, Auditing, Rules.
  *   **00:10 – 00:30 (20 min):** Condition 1: Baseline + Double Vote Wrinkle (3 Rounds).
  *   **00:30 – 00:45 (15 min):** Condition 2: Common Cause / Pairs (3 Rounds).
  *   **00:45 – 01:00 (15 min):** Condition 3: Deference / Public Sequence (3 Rounds).
  *   **01:00 – 01:15 (15 min):** Condition 4: Two-Tier / Subcommittees (3 Rounds).
  *   **01:15 – 01:30 (15 min):** Debrief and Theory Mapping.

  # Read-Aloud Instructions

  **Introduction (00:00)**
  > "For the next hour, we are not a seminar. We are a mechanism. We are testing four different procedures for making a binary decision under uncertainty. There is a correct answer in every round. Your goal is to maximize the Class Treasury. If the Treasury hits 100 points, everyone gets donuts next week.
  >
  > Here is the reality: I have two bags of chips. One bag is mostly Red. One bag is mostly Blue. At the start of each round, I will flip a coin. Heads, we use the Red-Majority bag. Tails, we use the Blue-Majority bag. You will not see the coin. You will not see the bag. You will receive a signal. Your signal is a single chip drawn from the bag.
  >
  > Your task is to vote on which bag is in play. Red Bag or Blue Bag?
  >
  > Do not talk to each other unless the procedure explicitly tells you to. Do not ask me about the philosophy of this. Just execute the procedure. If you ask 'What is the point?', my answer is: 'The point is the points.' Tally Clerk, please verify the chip counts with the Auditors now."

  **Condition 1: Baseline + Double Vote (00:10)**
  > "Procedure One. You will draw one chip. Look at it. Put it back. Shuffle. On your index card, write 'RED' or 'BLUE'.
  >
  > **The Wrinkle:** If you feel a strong intuition that your signal is correct, you may mark a STAR next to your vote. A Star counts as two votes. If you are wrong, you cost the class double. If you are right, you help the class double.
  >
  > Secret ballots only. Fold the card. Hand it to the Tally Clerk. We will run three rounds."

  *(Run 3 Rounds. Reveal truth after each. Update Treasury.)*

  **Condition 2: Common Cause (00:30)**
  > "Procedure Two. Pair up with the person next to you. In each pair, only *one* person draws a chip. You must show that chip to your partner. Both of you record that same color on your ballots.
  >
  > You still have 24 votes. But you only have 12 pieces of information. Secret ballots. Three rounds."

  *(Run 3 Rounds. Reveal truth. Update Treasury.)*

  **Condition 3: Deference (00:45)**
  > "Procedure Three. You will draw your own private chip. Keep it secret.
  >
  > However, voting is now public and sequential. I will call your name in order from 1 to 24. You must stand and announce 'RED' or 'BLUE' aloud. The Tally Clerk will keep a running tally on the board visible to everyone.
  >
  > Remember: You want the Class to win the Treasury. If the running tally shows Red is winning by a lot, and you drew Blue... ask yourself if the class knows something you don't. Three rounds."

  *(Run 3 Rounds. Reveal truth. Update Treasury.)*

  **Condition 4: Two-Tier (01:00)**
  > "Procedure Four. Move into four groups of six.
  >
  > Step 1: Within your group, draw chips individually. Discuss nothing. Vote by secret ballot within the group.
  > Step 2: The Group Chair counts the group's majority.
  > Step 3: The Group Chair comes to the front and casts *one* vote for the whole group.
  > Step 4: I will take the majority of the four Chairs to decide the Class Verdict.
  >
  > Three rounds."

  *(Run 3 Rounds. Reveal truth. Update Treasury.)*

  **If a Student Asks "What is the Point?" (Anytime)**
  > "You are currently inside the mechanism. If you stop to analyze the engine while the car is moving, you crash. Finish the drive. We analyze the engine at the end."

  # Contingency Plans

  **1. The "Bad Data" Problem:**
  *   *Risk:* In Condition 1 (Baseline), the group gets 3/3 right. In Condition 4 (Two-Tier), they also get 3/3 right (luck).
  *   *Fix:* Do not lie. Say: "In this sample, luck masked the structural difference. But look at the margins." (Usually, the Two-Tier wins will be 4-0 Chairs, while Baseline wins are 20-4 voters). If the Two-Tier loses while Baseline wins, emphasize that. If the data is truly backwards, admit: "This is why we run experiments. Sometimes variance hides the signal. But the *risk* was higher in Condition 4."

  **2. The "Superstar" Problem:**
  *   *Risk:* One student guesses correctly 12/12 times.
  *   *Fix:* In the debrief, ask: "Could we have identified that student *before* the game started to make them a dictator?" The answer is no. The system must work for *any* random distribution of competence.

  **3. The "Rebellion" in Condition 3:**
  *   *Risk:* Students refuse to herd, voting their signal despite the tally.
  *   *Fix:* This actually helps the lesson. If they vote independently despite public pressure, Condition 3 will look like Condition 1. Use this to say: "Independence is a behavioral choice, not just a structural one. You resisted the cascade."

  **4. Time Overrun:**
  *   *Fix:* Cut Condition 4. It is the most complex to set up. If you must cut one, cut the Two-Tier and describe the math in the debrief, *but* since this maps to the hiring dispute, try to keep it. Instead, cut Condition 2 (Common Cause) if needed, as Condition 3 (Deference) demonstrates correlation more dramatically. **Recommendation:** Keep 1, 3, and 4. Drop 2 if behind schedule.

  # Debrief Strategy (15 Minutes)

  Do not lecture. Ask questions that force them to articulate the theory.

  **1. The Competence Condition (Mapping Condition 1)**
  *   *Ask:* "In Round 1, most of you were wrong more often than you were right individually (45% error rate). Yet the Class Treasury grew. Why?"
  *   *Point:* The majority aggregates weak signals. The "noise" cancels out; the "signal" adds up. This is why we vote.

  **2. The Independence Condition (Mapping Condition 2 & 3)**
  *   *Ask:* "In Condition 2, you still had 24 votes. Why did the performance drop?"
  *   *Point:* Votes are not information; *independent* votes are information. When you copied your partner, you didn't add a new perspective; you just amplified the same one.
  *   *Ask:* "In Condition 3, some of you ignored your own chip. Why?"
  *   *Point:* This is a cascade. You treated earlier votes as evidence. But if they were also ignoring their evidence, the chain was hollow. Correlation destroyed the group's ability to correct errors.

  **3. The Two-Tier Result (Mapping Condition 4 & The Hiring Dispute)**
  *   *Ask:* "Condition 4 feels safer. Experts in small groups, then a final vote. Why did the math punish us?"
  *   *Point:* You threw away information. If a subcommittee vote was 4-2, the '2' were silenced. In a full room, those '2' could have swayed the final majority. Subcommittees reduce the effective $N$ at the final stage.
  *   *Direct Application:* "Our Chair argues subcommittees concentrate expertise. The game suggests they concentrate *error*. Unless the subcommittees are perfectly independent (which they aren't, because you all read the same applications), you are voting with $N=4$, not $N=24$."

  **4. The Double Vote (Mapping Confidence)**
  *   *Ask:* "Did the Stars help?"
  *   *Point:* Confidence is not competence. Unless you have a track record of calibration, weighting votes by confidence just adds variance.

  **5. Limitations (What the Game Cannot Show)**
  *   *Say:* "This game made discussion look bad. In Condition 3 and 4, I banned reasoning. In a real faculty meeting, if you explain *why* you voted Red, you might give others new information, restoring independence. But if you just say 'I vote Red,' you create a cascade. The danger isn't talking; it's trading verdicts without reasons."

  # Honest Assessment of Risks

  **Most Likely to Fail:** Condition 2 (Common Cause).
  *   *Why:* The drop from $N=24$ to $N=12$ is statistically significant but visually subtle in a 3-round sample. Students might not feel the degradation.
  *   *On-the-Spot Fix:* If the scores are identical to Baseline, point to the *margin* of victory. "You won, but you had fewer votes to spare. You have less insurance against bad luck."

  **Handling the "Human Subject" Realization:**
  *   By Condition 3, they will know they are the rats.
  *   *Response:* Lean into it. "Now that you know you are the data, can you control your independence? Try to vote your chip even if the board says otherwise." This turns the experiment into a test of will, which is philosophically richer.

  **The "Superstar" Skew:**
  *   If one student is right 100% of the time, the group looks bad compared to them.
  *   *Response:* "In this room, we know who the superstar is *after* the fact. In a hiring search, we don't know who has the best intuition beforehand. We must design for the average case, not the lucky outlier."

  # Limitations to Disclose

  1.  **No Asymptotics:** The theorem relies on $N \to \infty$. With $N=24$, we are in the "small sample" zone. Luck plays a huge role. Acknowledge that the *trend* is the lesson, not the specific score.
  2.  **Bare Verdicts:** The game forces students to trade votes, not reasons. In reality, deliberation can *increase* competence ($p$) by sharing arguments. The game isolates *independence*, but in doing so, it makes deliberation look like mere social pressure. You must verbally restore the value of reason-giving in the conclusion.
  3.  **Common Knowledge:** In the game, everyone knows the rules. In reality, people have different models of the world. The game assumes a shared prior (the bag ratios), which is a strong assumption.

  Headline: The design choice that does the most work is forcing the Two-Tier condition to aggregate group majorities rather than individual votes, which mathematically discards the minority signal within each subcommittee and makes the final decision rest on a sample size of four rather than twenty-four.
