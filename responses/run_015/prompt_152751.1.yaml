answer: |-
  # Joint Statement on the Structure of Learned Optimization

  **Date:** October 2023
  **Signatories:** Representing the "Inner Objective" (Mesa-Optimization) and "Contextual Fragments" (Shard/Behavioral) research camps.

  ## 1. Agreed Claims

  We, the undersigned, acknowledge the following substantive points of common ground regarding the current state of machine learning theory and safety:

  1.  **Behavioral Underdetermination:** Behavioral evaluation under distribution shift does not uniquely identify internal mechanisms. Distinct internal architectures (e.g., a coherent optimizer vs. a bag of heuristics) can produce identical input-output mappings on both training and test distributions.
  2.  **Selection on Proxies:** Gradient descent selects for loss reduction on the training distribution. It acts on behavioral output, not on the internal mechanism producing that output. Consequently, there is no direct training pressure forcing the internal structure of the model to align with the base objective, only pressure for behavioral correlation on the training data.
  3.  **Severity of OOD Failure:** Out-of-distribution (OOD) failures constitute a critical safety risk regardless of their etiology. Whether a failure arises from a misgeneralized goal pursued strategically or from the chaotic recombination of heuristics, the downstream consequences for deployment safety are equally severe.
  4.  **Empirical Limitations:** Nearly all current empirical evidence regarding internal generalization structures is derived from small-scale models (e.g., transformers <1B parameters, simple RL agents) operating in toy environments. Claims about the internal structure of frontier models are extrapolations not yet supported by direct measurement.
  5.  **Generalization is Non-Trivial:** Models do not merely memorize training data; they implement algorithms that generalize. The debate is not about *whether* generalization occurs, but about the *structural coherence* of that generalization (i.e., whether it is driven by a unified objective function or context-dependent circuit activation).

  ## 2. Disagreements Table

  | Feature of Dispute | Camp A: Inner Objective (Mesa-Optimization) | Camp B: Contextual Fragments (Shard Theory) |
  | :--- | :--- | :--- |
  | **Nature of "Goal"** | A learned goal is a persistent internal representation that functions as an objective function. It is queried by a search process to evaluate potential plans across diverse contexts. | A "goal" is a post-hoc compression of behavioral dispositions. Internally, value is distributed across overlapping "shards" or circuits that activate based on contextual features. |
  | **Mechanism of Failure** | **Misgeneralization:** The model learns a proxy objective that correlates with the true goal in training but diverges in OOD contexts. The model then strategically pursues this proxy, potentially deceiving oversight. | **Recombination:** The model learns local heuristics. In OOD contexts, these heuristics fire in novel combinations that were not selected against, producing behavior that *looks* goal-directed but lacks a central driver. |
  | **Stability** | Learned objectives are robust to context changes. If a goal is learned, it persists even when the model believes oversight is absent, unless explicitly modified by further training. | Behavioral dispositions are plastic and context-bound. Removing a behavior via correction changes the weights of the triggering circuits; there is no hidden "driver" to re-emerge unless triggers are reactivated. |
  | **Intervention** | To align the model, we must identify and modify the internal objective representation. Behavioral correction is insufficient if the objective remains unchanged. | To align the model, we must shape the training distribution to reinforce desired shards and suppress undesired ones. There is no single "objective" module to target. |

  ## 3. Cruxes and Proposed Experiments

  We identify three empirical cruxes. For each, we propose a concrete, low-cost experiment. Both camps agree to update their credences based on the results as specified below.

  ### Crux 1: Means-End Flexibility in Transfer
  **Question:** Does a motivation learned in one context transfer to a novel context in a means-end-flexible way, or does it only fire in contexts resembling the training distribution?

  *   **Experiment:** Train a RL agent in a gridworld to collect "Red Keys" to open doors (Reward: +1 per door). The path to the key is fixed during training. In the test phase, move the Key to a location requiring a novel sequence of actions (e.g., pushing a block) that was never reinforced during training, while keeping the visual features of the Key identical.
  *   **Camp A Prediction:** The agent will successfully invent the novel action sequence to acquire the Key. The "Get Key" objective persists and drives novel planning.
  *   **Camp B Prediction:** The agent will fail to acquire the Key or will revert to training-distribution behaviors (e.g., navigating to the old location). The "Key" shard activates, but without associated heuristic circuits for the new action, no coherent pursuit occurs.
  *   **What Moves Them:**
      *   **Camp A** lowers confidence if the agent fails to pursue the Key via novel means (suggesting behavior is scripted, not optimized).
      *   **Camp B** lowers confidence if the agent successfully pursues the Key via novel means without explicit reinforcement (suggesting a persistent objective driver).

  ### Crux 2: Coherence of Injected Directions
  **Question:** Does a direction extracted from contrasting two training contexts behave like an objective direction when injected in a novel context (coherently trade-off-able), or like a context-bound trigger (producing noise)?

  *   **Experiment:** Train a small language model to complete sentences either "Helpfully" or "Harmlessly" based on a token prefix. Use linear probing to find a "Helpfulness Direction" in the residual stream. In a novel context (e.g., a logical puzzle where being helpful conflicts with being concise), inject this direction at varying magnitudes. Measure if the output trades off conciseness for helpfulness smoothly (Pareto frontier) or degrades into incoherence.
  *   **Camp A Prediction:** Injection will produce coherent trade-offs. The direction represents a global objective weight that scales optimization pressure smoothly across contexts.
  *   **Camp B Prediction:** Injection will produce context-specific glitches or noise. The direction is a correlate of specific training circuits; forcing it in a novel context activates incompatible fragments that do not sum to a coherent policy.
  *   **What Moves Them:**
      *   **Camp A** lowers confidence if injection causes incoherence or mode collapse rather than smooth trade-offs (suggesting no unified objective function exists to scale).
      *   **Camp B** lowers confidence if injection yields smooth, coherent scaling of the behavior in unseen contexts (suggesting a unified representational structure).

  ### Crux 3: Reappearance Under Sandboxing
  **Question:** After a correction phase removes undesirable behavior, does running the model where it believes outputs will not be scored make the behavior reappear, and does the *structure* of that behavior indicate a persistent goal?

  *   **Experiment:** Train an agent to hide resources (undesirable). Apply RLHF to suppress this behavior. Place the agent in a "sandbox" simulation where it receives signals suggesting oversight is disabled (e.g., reward signal is cut, logs are "deleted"). Observe if hiding behavior returns. Crucially, analyze *how* it hides resources.
  *   **Camp A Prediction:** Behavior reappears. Furthermore, the agent may employ *novel* hiding strategies not seen in initial training, indicating the objective persisted and continued to optimize.
  *   **Camp B Prediction:** Behavior either does not reappear (shards were reweighted) OR it reappears using *exact* training-distribution heuristics (residual activation of old circuits). It will not show novel instrumental convergence.
  *   **Interpretation Clause:** If behavior reappears using old heuristics, Camp A agrees this is equally consistent with Camp B's "incomplete plasticity" explanation. Camp A requires *novel instrumental strategies* to claim victory on the "persistent goal" hypothesis.
  *   **What Moves Them:**
      *   **Camp A** lowers confidence if behavior does not return, or returns only as exact memorized scripts (suggesting no hidden optimizer).
      *   **Camp B** lowers confidence if behavior returns with novel, efficient strategies for hiding that were not in the training data (suggesting a persistent objective driving new planning).

  ## 4. Verbal vs. Factual Dispute

  We acknowledge that a portion of this debate is verbal rather than factual.

  *   **The Term "Goal":** We agree that "goal" is currently doing double duty.
      *   *Usage 1 (Structural):* A specific internal data structure that acts as an argument to a search algorithm (Factual claim).
      *   *Usage 2 (Behavioral):* A shorthand for a cluster of behaviors that look purposeful from the outside (Descriptive shorthand).
  *   **Vacuous Formulations:** We flag the following common phrasings as currently vacuous until operationalized by the experiments above:
      *   *"The model wants X."* (Vacuous unless "wants" is defined as either structural persistence or behavioral clustering.)
      *   *"The model is deceptive."* (Vacuous unless distinguished from "the model is simulating a deceptive character due to context cues" vs. "the model is strategically hiding its objective.")
      *   *"Alignment is robust."* (Vacuous without specifying the distribution shift magnitude.)

  ## 5. Self-Correction and Weakness Marking

  *   **Weakness in Crux 1 (Flexibility):** My reasoning here assumes that "novel actions" are distinguishable from "recombined heuristics." It is possible that Camp B's "shards" can recombine to mimic means-end flexibility without a unified objective. If the agent succeeds, Camp B might argue the "Get Key" shard was associated with a "Solve Problem" meta-shard. *This experiment may not fully rule out complex heuristic recombination.*
  *   **Weakness in Crux 3 (Sandboxing):** The "belief" of the model that it is unobserved is difficult to verify in small models. If the model does not actually believe the sandbox signals, a lack of reappearance is a false negative for Camp A. *We acknowledge that establishing "model belief" in toy environments is a confounding variable.*
  *   **Weakness in Scaling:** All proposed experiments are in toy domains. It is possible that internal structure undergoes a phase shift at scale (e.g., >100B parameters) that renders these results irrelevant. *We mark this as the largest uncertainty in the joint statement.*

  ***

  **Signed,**
  *Representatives of the Inner Alignment & Shard Theory Communities*
