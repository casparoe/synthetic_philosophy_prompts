answer: |-
  This is a remarkably sharp dissection of the tension between liberal socialism and actually existing institutional compromises. You have identified the precise fault line where Mill's evolutionary idealism meets the hard constraints of liberal property law.

  To answer your core question: **Yes, the co-determination model is philosophically unstable if viewed as a final destination, but it is highly consistent with Mill's view of it as a transitional experiment.** However, your intuition that it contradicts Mill's deeper commitments about the *nature* of freedom is correct.

  Here is a breakdown of the philosophical commitments this practice presupposes, measured against Mill's late thought and rival theories.

  ### 1. The Production vs. Distribution Distinction
  You ask if this depends on Mill's distinction between the immutable laws of production and the mutable laws of distribution.

  **The Practice:** Co-determination explicitly relies on this. It assumes the *ownership* of capital (production assets) can remain private (a "natural" or legally protected right), while the *governance* and *fruits* of that capital (distribution and authority) are subject to social negotiation.

  **Mill's View:** In his *Principles of Political Economy* and *Chapters on Socialism*, Mill does use this distinction, but he pushes it further than co-determination does. Mill argued that while we can't change technical production, the *organization of labor* is a matter of distribution/institution.
  *   **The Conflict:** Mill's late ideal was not just worker *voice* (co-determination); it was worker *ownership* (cooperatives). He believed the wage system itself was a relic of slavery that stunted human development. Co-determination retains the wage system; it merely gives wage-laborers a supervisory role.
  *   **Verdict:** The practice presupposes a **truncated Millianism**. It accepts Mill's premise that distribution is mutable, but rejects his conclusion that mutability should lead to the abolition of the master-servant relationship. It treats workplace democracy as a regulatory check on property, rather than the dissolution of property's absolute authority.

  ### 2. Negative Liberty and the Shareholder Veto
  You ask if the model silently commits to a negative-liberty view where limiting shareholder control is coercion.

  **The Practice:** By granting shareholders a veto over mergers and liquidation, the system acknowledges a "zone of sovereignty" around capital ownership. It treats the shareholder's right to exit or dissolve the firm as a fundamental liberty that cannot be overridden by the democratic will of the workers.

  **Mill's View:** Mill is often read as a negative-liberty theorist (*On Liberty*), but his economic writings lean toward **positive liberty** (autonomy/self-development). For Mill, property rights are not natural rights; they are justified only insofar as they promote social utility and individual development.
  *   **The Conflict:** If real freedom requires transforming the conditions of labor (as you note Mill claims), then preserving a shareholder veto over the firm's existence protects a form of "economic coercion" over workers. If shareholders can liquidate a viable firm to maximize returns, workers' autonomy is held hostage to capital mobility.
  *   **Verdict:** The model is a **hybrid**. It violates strict negative liberty (by forcing shareholders to share board seats) but preserves a core negative liberty (the right to capital disposition). It presupposes that *property rights* are a stronger claim to liberty than *participatory rights*, which Mill would likely dispute in the long run, though he might accept it as a temporary safeguard against capital flight.

  ### 3. The Size Threshold: Democracy as Bureaucratic Remedy
  This is your most incisive point. Why is democracy only appropriate for big bureaucracies?

  **The Practice:** Thresholds (e.g., applying only to firms with 500+ employees) imply that workplace democracy is a functional necessity for managing alienation and complexity, not a universal moral right.

  **Philosophical Presupposition:** This presupposes a **sociological view of authority** rather than a **deontological view of consent**.
  *   In a small firm, authority is presumed to be personal, visible, and negotiable (akin to a household).
  *   In a large firm, authority is structural, impersonal, and coercive.
  *   **Mill's Consistency:** Mill would find this partially consistent. He worried about the "tyranny of the majority" and believed different forms of government suited different levels of civilization/education. He might agree that small firms require less formal democracy because the "educative" function of work is easier to maintain in small groups.
  *   **The Instability:** However, it contradicts the liberal principle that authority requires consent regardless of scale. If workplace hierarchy is unjust because it stunts autonomy, it stunts autonomy in a 50-person firm just as much as a 5,000-person firm. The threshold implies that **liberty is a luxury of scale**, which undermines the universalist claim of liberalism.

  ### 4. Mill vs. Nozick (and the Better Rival)
  You ask if this makes more sense under Nozick's entitlement view.

  **The Answer:** **Absolutely not.**
  *   **Nozick:** For Nozick, co-determination is a violation of justice in holdings. If shareholders acquired their shares justly, forcing them to share board seats is forced labor/association. It violates their self-ownership and property rights. Nozick would view the size threshold as irrelevant; the principle is unjust at any scale.
  *   **The Better Rival:** This model makes more sense under **Rawls's Property-Owning Democracy** or **Corporate Constitutionalism**. It treats the firm as a private government that requires checks and balances, similar to the state.

  **Is it consistent with Mill?**
  It is consistent with Mill's **method**, but not his **telos**.
  *   **Method:** Mill was a gradualist. He believed socialism must be tested experimentally and introduced voluntarily where possible. Co-determination is a state-mandated experiment that stops short of full socialism. Mill might accept it as a "school of democracy" to educate workers for eventual full cooperatives.
  *   **Telos:** Mill's end goal was the "association of the labourers themselves on terms of equality." Co-determination creates a *bicameral* firm (labor vs. capital), not an *equal association*. It institutionalizes class conflict within the boardroom rather than dissolving the classes.

  ### 5. Conclusion: The Philosophical Instability
  You are right to sense instability. The model is a **contradiction in terms** if viewed statically:
  1.  It claims to promote autonomy (Millian liberty).
  2.  But it preserves a veto power that can negate that autonomy (Liberal property rights).
  3.  It claims democracy is a right, but limits it by size (Pragmatic corporatism).

  **How to resolve it?**
  To make it consistent with Mill's late commitments, you would have to reinterpret co-determination not as a settlement, but as a **pedagogical bridge**.
  *   If the board seats are used to educate workers in management...
  *   And if the profit-sharing aspects allow workers to buy out the capital over time...
  *   Then it fulfills Mill's vision.

  Without that trajectory toward ownership diffusion, the model presupposes that **economic freedom is divisible**—that you can have political democracy and economic oligarchy simultaneously without the latter corroding the former. Mill's late writings suggest he ultimately doubted this divisibility, arguing that "the form of association... which will probably be ultimately predominant" must be one where workers own the capital.

  So, the practice you describe is philosophically stable only if you abandon Mill's ultimate ideal of human development in favor of a **pluralist stakeholder theory**. It sacrifices the coherence of Mill's liberty for the stability of liberal capitalism. It is a compromise that works politically precisely because it is philosophically ambiguous.
