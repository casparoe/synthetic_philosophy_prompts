answer: |-
  **Taxonomy of Objections to Effective Altruism**

  **Branching Questions**
  1.  Does the objection grant the aim of impartial outcome maximization?
  2.  (If Yes) Is the failure due to static limits or dynamic feedback?
  3.  (If Yes/Static) Is the barrier primarily epistemic or causal?
  4.  (If No) Is the objection to the theory of value or the procedure of allocation?
  5.  (All Paths) Is the primary target the individual agent or the movement institution?

  **Leaves (Positions)**
  1.  **Measurement Skepticism** (Y/S/E/I): Awkwardly requires acting while admitting evidence is insufficient.
  2.  **Epistemic Hierarchy** (Y/S/E/Inst): Awkwardly defends unaccountable expert authority.
  3.  **Marginal Irrelevance** (Y/S/C/I): Awkwardly denies individual causal efficacy.
  4.  **Supply Inelasticity** (Y/S/C/Inst): *Unoccupied.* Diagnosis: Unattractive (ignores organizational capacity limits).
  5.  **Agent Gaming** (Y/D/*/I): Awkwardly presumes widespread corruptible motives.
  6.  **Institutional Distortion** (Y/D/*/Inst): Awkwardly demands abandoning quantitative metrics.
  7.  **Personal Integrity** (N/Val/*/I): Awkwardly permits preventable suffering to maintain cleanliness.
  8.  **Cultural Hegemony** (N/Val/*/Inst): Awkwardly implies Western values are inherently imperialist.
  9.  **Relational Duties** (N/Proc/*/I): Awkwardly privileges arbitrary proximity over impact.
  10. **Democratic Control** (N/Proc/*/Inst): Awkwardly empowers ignorant veto power.

  **Location of User Objections**
  1.  *Counterfactual fragility:* Leaf 1 (Measurement Skepticism). It treats fungibility as an epistemic barrier to baseline calculation.
  2.  *Justificatory inversion:* Leaf 6 (Institutional Distortion). It cites dynamic feedback on knowledge production.
  3.  *Metric-shifting:* Leaf 6 (Institutional Distortion). It cites dynamic feedback on intervention behavior.

  **Unoccupied Cells and Flags**
  *   **Leaf 4 (Supply Inelasticity)** is unoccupied. Diagnosis: Unattractive. Few argue funding never binds organizational capacity.
  *   **Flag:** The tree cannot separate *Justificatory inversion* and *Metric-shifting*. Both are dynamic institutional objections differing only in whether the feedback loop distorts knowledge production or intervention delivery.

  **Confidence Calibration**
  The Aim (Q1) and Value/Procedure (Q4) splits are uncontroversial standard distinctions in normative ethics. The Static/Dynamic split (Q2) is a reconstruction; literature often blends epistemic limits with systemic feedback, but separating them clarifies whether the solution is better research or structural change. The Individual/Institution split (Q5) is genuinely contested; many objections (like *Justificatory inversion*) target the interaction between agents and structures, forcing an artificial choice here. This taxonomy imposes tidier boundaries than the literature possesses to satisfy the classificatory constraint.
