      *   **Task:** Create a reusable decision procedure (ordered questions, thresholds, kill switches, escalation points) for mediation sessions.
      *   **Application:** Apply to two live proposals (Solar Farm on heritage-adjacent land vs. Climate need; Warehouse deal with Coalition veto vs. Green-space footprint).
      *   **Critique:** Identify where the procedure will misfire, give hated answers, or fail entirely.
      *   **Tone:** Casual, email to a colleague (typos allowed/encouraged).

  2.  **Deconstruct "Moral Barter" for this Context:**
      *   It's not about money; it's about *symbolic value* and *political capital*.
      *   Key mechanism: Identify asymmetries in valuation. What does the Union care about *way more* than the EJ Coalition, and vice versa?
      *   Goal: Move from zero-sum (I win, you lose) to positive-sum (we both get what we care about most).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
