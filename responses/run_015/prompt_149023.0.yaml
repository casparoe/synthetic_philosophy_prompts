          *   *Wait, prompt specifics:* "Coalition gets a veto in exchange for accepting a smaller green-space footprint elsewhere." I need to evaluate *this* specific trade using the procedure.
          *   *Risk:* Veto power is often a legal non-starter for a city council.

  5.  **Identifying Failure Modes (The "Honest Truth"):**
      *   Incommensurability: Some values can't be traded (sacred values).
      *   Principal-Agent Problem: Do the negotiators actually speak for their base?
      *   Optics: "Selling out" looks bad.
      *   Legal Constraints: Can we actually give a veto?
      *   Trust: If one side thinks the other is gaming the system.

  6.  **Setting the Tone:**
