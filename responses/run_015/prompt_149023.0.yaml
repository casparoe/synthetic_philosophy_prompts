prompt: |-
  I work for a city council and we're constantly stuck between the enviromental justice coalition and the old-school union on every development deal. I read this idea about applying gains-from-trade logic to moral disagreement — call it moral barter — where sides swap concessions that are cheap for them but expensive for the other, except the currency is symbolic values not money. Like the union gives up a carbon-offset pledge that costs them nothing practically but means a lot to the coalition, and in return gets ironclad local-hiring guarantees. I need a reusable decision procedure my team can actually run in mediation sessions: the ordered questions, what answers are good enough, where we kill the deal outright, and where we punt to the council chair because its pure values conflict not something we can measure. Apply it to two live proposals: a solar farm on land the union calls heritage-adjacent but that the coalition wants for climate reasons, and a warehouse deal where the coalition gets a veto in exchange for accepting a smaller green-space footprint elsewhere. Also tell me where this procedure is gonna misfire or give me an answer I hate, and be honest about what it cant do. Write it casual, like you're emailing a colleague — a typo or two is fine.
