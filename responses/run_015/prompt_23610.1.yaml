answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Family Foundation
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Prediction Market Proposal for Grant Cycle

  **RECOMMENDATION:** **Adopt with Specific Conditions.** I recommend we pilot the prediction market as a *decision-support tool*, but reject the proposal to let it determine funding "full stop." We should proceed only if we (1) decouple market participation from grant authorship to prevent conflicts of interest, (2) broaden the success metric beyond "five-year disease aversion," and (3) retain final fiduciary voting authority with the Board.

  **The Strength of the Case**
  Having spent thirty years in epidemiology, I am sympathetic to the Program Director's core argument: human deliberation is noisy. We know from the literature that structured aggregation of independent judgments often outperforms committee consensus. The Director is right that a market forces participants to quantify uncertainty rather than hiding behind qualitative hedging. If we can reduce the board's inherent recency bias or pet-project syndrome by leveraging the "wisdom of crowds," we owe it to our mission to try. The intuition that "skin in the game" sharpens judgment is theoretically sound.

  **The Critical Flaws**
  However, there is a category error in treating a forecast as a decision. A prediction market is designed to answer *"What is most likely to happen?"* A foundation board must answer *"What is the best use of our capital?"* These are not identical.

  1.  **Prediction vs. Value:** Markets tend to favor high-probability, moderate-impact outcomes over low-probability, transformative ones. If Grant A has a 90% chance of saving 1,000 lives and Grant B has a 10% chance of saving 50,000 lives, a market might heavily favor Grant A. But if our foundation's mandate is to fund high-risk innovation, the market will systematically steer us toward conservatism.
  2.  **Metric Validity:** "Disease averted in five years" is measurable, but it is not exhaustive. It undervalues capacity building, policy change, or research that pays off in year seven. Optimizing for a narrow metric often leads to Goodhart's Law: when a measure becomes a target, it ceases to be a good measure.
  3.  **Incentive Compatibility:** The proposal allows grant officers to bet on proposals they helped write. This creates a perverse incentive structure. Officers could manipulate the market to validate their own work or, conversely, sandbag expectations to make success easier to achieve. We cannot have market participants with a professional stake in the specific assets being traded.

  **Proposed Path Forward**
  We can capture the Director's innovation without abdicating our governance responsibilities. I propose we modify the pilot as follows:

  *   **The Market as Signal, Not Verdict:** The market price should be presented to the Board as a data point alongside traditional due diligence. If the market strongly disagrees with the Board's intuition, that should trigger deeper review, not an automatic veto.
  *   **Sanitized Participation:** Grant officers and proposal authors must be barred from trading on specific grants they authored. We should rely on the outside forecasters and non-conflicted staff for liquidity.
  *   **Broadened Metrics:** Instead of a single binary outcome, traders should score grants on a weighted index that includes "potential for scale" and "strategic fit," not just immediate disease aversion.

  **Conclusion**
  The Director is correct that we need better tools to challenge our assumptions. But a prediction market is a thermometer, not a thermostat. It tells us the temperature of the room; it should not be allowed to set the heat. Let us run the market to inform our vote, but let us keep the vote.

  I am happy to discuss the specifics of the incentive structure at Thursday's meeting.
