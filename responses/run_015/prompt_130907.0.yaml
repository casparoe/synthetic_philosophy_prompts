              *   *Wait, Student says:* "Package therefore favours Big by about $10^9$."
              *   *ERROR:* The student claims the package favors Big. But in scenario (c), the observers in the Annex have evidence $F$. The agent has evidence $E$.
              *   Under the "Package" convention (SIA weights by total, SSA samples from total):
                  *   SIA Prior: Big is $10^9$ times more likely (due to total observers).
