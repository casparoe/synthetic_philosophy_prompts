          *   *Load-bearing error?* Not really, but slightly imprecise regarding why SIA specifically is the target (SSA + SIA package cancels Doomsday but inherits PP).

      *   **Part (c) (Sealed Annex - Distinct Evidence):**
          *   *Setup:* Sml: $10^9$ ($E$). Big: $10^9$ ($E$) + $10^{18}$ ($F$). Agent has $E$.
