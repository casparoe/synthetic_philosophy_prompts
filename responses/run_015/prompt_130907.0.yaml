          *   *SIA Alone:*
              *   Student: "Big posits roughly $10^9$ times as many observers in total [Wait, $10^{18}$ vs $10^9$ is $10^9$ times? No, $10^{18}/10^9 = 10^9$. Yes, correct math]. SIA favours Big by about $10^9$."
