answer: |-
  Here are two candidate principles. The first is a rigorous formulation of your tentative intuition. The second is my proposed correction. I will evaluate the casualties for both, declare a winner, and apply it.

  ### Candidate 1: The Security Differential Principle
  **Definition:** A proposition $P$ is a **Hinge** for you if and only if:
  1.  **(Asymmetry)** Any evidence $E$ offered against $P$ relies on assumptions that are less secure than $P$ itself.
  2.  **(Invariance)** The security of $P$ does not fluctuate with the accumulation of new data; it is the baseline against which data is measured.

  **Clause Mapping:**
  *   **Asymmetry:** Handles "Other minds" and "Past happened." (Evidence against them requires using minds or records, which presupposes them).
  *   **Invariance:** Handles "Earth existed" vs. "4.5 billion years." (The age changes with data; the existence does not).

  **Casualties (What you must abandon):**
  *   **The Laptop:** You classify this as empirical. This principle classifies it as a **Hinge**. If you doubt the laptop, you must doubt your vision. Your vision is less secure than the proposition "There is a laptop" (Moorean certainty). To keep your verdict, you must accept that pragmatic ease of checking overrides security differential.
  *   **Replication Crisis:** You note this shifted from Hinge to Empirical. This principle struggles here. If it was a true Hinge, its security should be invariant. This principle forces you to say it was *never* a hinge, only a high-confidence empirical claim. You lose the insight that the "riverbed" of science actually shifted.

  ### Candidate 2: The Functional Dependency Principle (The Winner)
  **Definition:** A proposition $P$ is a **Hinge** for you in context $C$ if and only if:
  1.  **(Apparatus vs. Output)** $P$ describes a condition of the *verification apparatus* itself, not an *output* of that apparatus.
  2.  **(Game-Constitution)** Rejecting $P$ does not just falsify a claim; it dissolves the rules of the language game $C$ (science journalism) such that verification becomes impossible or meaningless.
  3.  **(Temporal Fluidity)** $P$ retains Hinge status only so long as the community practicing $C$ treats it as constitutive; if the community begins to test $P$ systematically, it migrates to Empirical status.

  **Clause Mapping:**
  *   **Apparatus vs. Output:** Handles "Laptop" (Output: Empirical) vs. "Physics same tomorrow" (Apparatus: Hinge).
  *   **Game-Constitution:** Handles "Other minds" (No journalism without interlocutors) and "Earth existed" (No history without a past).
  *   **Temporal Fluidity:** Handles "Replication" and "Paper mills." These were once constitutive assumptions of the publishing game; now they are objects of investigation within the game.

  **Casualties (What you must abandon):**
  *   **The Spreadsheet Number:** You call this a Hinge ("totally certain... can't say why"). This principle forces you to classify it as **Empirical**. It is an *output* of your perception/copying apparatus. You *can* check it (look again) without collapsing your profession. It is a high-confidence data point, not a framework condition.
  *   **Reviewer Competence:** You say you "cannot imagine" overturning it, but it feels load-bearing. This principle classifies it as **Empirical**. We can audit reviewers. If they are corrupt, the game changes, but verification doesn't become *meaningless* (we just find new reviewers). Treating this as a Hinge is a professional hazard, not an epistemological necessity.

  ---

  ### Application of the Winner (Functional Dependency)

  **1. "Climate models are broadly trustworthy."**
  *   **Verdict:** **Empirical.**
  *   **Reasoning:** This is an *output* claim. We test models against historical data (hindcasting). If they fail, we adjust the models. The *apparatus* (physics, math, observation) remains intact. Trustworthiness is a variable within the system, not the frame of the system.
  *   **Nuance:** "The laws of physics underlying the models are stable" is the Hinge. "These models capture those laws correctly" is Empirical.

  **2. "The archive I'm working from isn't systematically forged."**
  *   **Verdict:** **Hinge (with expiration date).**
  *   **Reasoning:** For day-to-day reporting, this is **Apparatus**. You cannot verify every document's provenance without assuming other documents are real to check them. It constitutes the game of "archival research."
  *   **Fluidity:** If a specific scandal arises (e.g., the *Hitler Diaries*), this proposition migrates to **Empirical** for that specific archive. You suspend the game to test the floor you're standing on.

  **3. "I'm not misremembering what my source told me last week."**
  *   **Verdict:** **Split.**
  *   **Reasoning:**
      *   "My memory is generally reliable enough to function": **Hinge.** (Apparatus).
      *   "I remember *this specific quote* correctly": **Empirical.** (Output).
  *   **Professional Implication:** Your job exists to bridge this gap. You treat general memory as a hinge, but specific recollection as empirical (hence: record interviews, check notes). If you treat specific recollection as a hinge, you cease to be a reporter and become a memoirist.

  ---

  ### My Soft Spots: Where I Could Be Wrong

  **1. The "Fluidity" Clause is a Loophole.**
  By allowing hinges to become empirical (Clause 3), I risk making the distinction trivial. If *anything* can become a hinge given enough stability, and *anything* can become empirical given enough doubt, is the distinction doing any work?
  *   **What changes my mind:** If you can show me a case where a proposition was falsified *without* the language game changing. If "Replication" was proven false, but science journalism continued exactly as before (same methods, same trust levels), then my Functional Dependency principle is wrong. It would mean replication was never a hinge, just a fact. If the *practice* of journalism fundamentally had to be reinvented because replication failed, my principle holds.

  **2. The "Spreadsheet" Casualty.**
  I am forcing you to demote the "Spreadsheet Number" from Hinge to Empirical. I might be underestimating the *phenomenology* of certainty. Wittgenstein often points to propositions where doubt is *senseless*, not just costly. When you copy that number, do you really have a "method" to check it, or is the checking just doing the same act again?
  *   **What changes my mind:** If you can demonstrate that checking the number *presupposes* the number is readable. If the act of verification is circular in a way that "There is a laptop" is not, then the Spreadsheet claim might be a "Local Hinge" specific to the act of transcription, and my Apparatus vs. Output distinction is too coarse.

  **3. The "Other Minds" Problem.**
  I classify "Other minds" as a Hinge. But science journalism increasingly relies on operationalizing mental states (surveys, behavioral data). If we can predict behavior perfectly without assuming "mind," does "Other minds" become empirical?
  *   **What changes my mind:** If AI sources become indistinguishable from human sources in your workflow. If you can do your job exactly as well assuming sources are algorithms, then "Other minds" shifts from a constitutive Hinge to an optional Empirical assumption. If that happens, my principle must acknowledge that hinges are anthropological, not logical.

  **Final Verdict:** Stick with **Functional Dependency**. It respects the *work* you do. The Security Differential principle is too static for a profession defined by updating priors. Accept that the Spreadsheet Number is empirical—you check it by looking again, and if you're wrong, you correct the note, you don't quit the job. Accept that Reviewers are empirical—you just rarely have the budget to test them. The cost of testing is not the same as the impossibility of testing.
