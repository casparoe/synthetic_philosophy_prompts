  2.  **Deconstruct the Track Record (The "Data"):**

      *   *Case 1 (Binding):* High consent (insiders), high cultural coherence, irreversible physical change, pain. *Action:* Abstention/Relativist silence. *Key:* She felt she lacked standing ("not mine to say").
      *   *Case 2 (Circumcision):* Low/No consent (infants), cultural practice (her own). *Action:* Condemnation. *Key:* Internal critique framework available ("materials... inside our own framework").
      *   *Case 3 (Widows):* Mixed consent (community yes, victims no), reversible/temporary (2 years). *Action:* Condemnation. *Key:* Victim voice trumps community voice ("people it's done to... get to say").
      *   *Case 4 (Famines):* No consent (dead elders), historical, no current defenders. *Action:* Condemnation. *Key:* No living framework to violate ("nobody left... overriding").

      *   *Synthesis:* Renata isn't a pure relativist ("anything goes"). She isn't a pure universalist ("human rights always trump"). She seems to operate on a **Jurisdictional/Standpoint Epistemology**.
      *   *Core Tension:* When does she speak, and when does she stay silent?
      *   *Pattern:* She speaks *against* a practice when:
          *   She shares the framework (Case 2).
          *   The victims within the framework object (Case 3).
