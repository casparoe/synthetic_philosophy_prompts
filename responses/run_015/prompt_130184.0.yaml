      *   *Wait, look at Case 1 vs Case 3:* Case 1 (Binding) = Victims endorse. Case 3 (Widows) = Victims object.
      *   *Quieting:* Most victims endorse. 12 object.
      *   *Renata's likely move:* She focuses on the **capacity to dissent**.
