      *   *Rule A (The "Insider Veto"):* Condemn if the direct subjects object *and* are still within the cultural sphere. If they accept it, stay silent. (Fits 1, 3, 4. Fits 2 via "Insider" status).
      *   *Rule B (The "Exit Rights" Principle):* Condemn if the practice makes it impossible to leave or to dissent *after* the fact. If you can leave and speak, your voice counts. If you stay and speak, your voice counts.
      *   *Rule C (The "Capacity for Framework" Rule):* Condemn if the practice destroys the capacity to form a moral framework (e.g., dampening emotion might stop moral reasoning).
      *   *Rule D (The "Irreversibility + Age" Rule):* Condemn irreversible procedures on those who cannot consent, unless there is overwhelming retrospective endorsement *without* coercion.

  5.  **Evaluating the Rules against the Data:**

      *   *Rule A (Insider Veto):*
