              4.  Counter-arguments (How would defenders explain away the opposing evidence?).
              5.  Clean Verdict Scenario (What would need to change for a clear win, and is it realistic?).
              6.  Historian's Critique (Fragility of the construction).
          *   Language: British English.
          *   Tone: Academic, candid, pedagogical.

  2.  **Deconstruct the Theories:**
      *   **Browning (Situational):** Men kill due to peer pressure, obedience to authority, careerism, brutalisation over time, and the "slippery slope." Refusal is possible but socially costly. Antisemitism is present but not the *primary* driver; ordinary men can do extraordinary evil under specific conditions.
      *   **Goldhagen (Ideological):** Men kill because of a specific "eliminationist antisemitism" ingrained in German culture. They *want* to kill Jews. Refusal is rare because they don't *want* to refuse. They treat Jews worse than other victims because the ideology is specific to Jews.

  3.  **Brainstorming Discriminating Factors:**
      *   *Refusal Rates:* Browning expects higher refusal initially, dropping over time. Goldhagen expects very low refusal throughout.
      *   *Volunteering:* Browning expects volunteering to be linked to specific "hard men" or careerists. Goldhagen expects widespread volunteering for anti-Jewish tasks specifically.
      *   *Differential Treatment:* This is the strongest lever. If the unit treats Poles/Soviets differently than Jews in similar contexts, it suggests specific anti-Jewish ideology (Goldhagen). If they treat all "subhumans" equally brutally, it suggests general brutalisation/situational (Browning).
      *   *Task Order:* If they kill Jews *before* being ordered to, or with more enthusiasm than non-Jews.
      *   *Exemptions:* If men exempt themselves from Jewish killing but stay for anti-partisan (non-Jewish) killing, that supports Browning (it's about the specific act of killing Jews, not killing in general). If they exempt themselves from *all* killing, it's ambiguous.

