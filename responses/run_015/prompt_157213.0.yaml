  **Project Title: The Stability of Lexical Thresholds in Negative Utilitarianism**

  **1. The Question and Its Significance**
  This project asks whether the "lexical-threshold" version of negative utilitarianism is a coherent moral theory or merely a notational variant of standard weighted utilitarianism. The view in question holds that there exists a specific level of suffering such that any pain at or above this level absolutely outweighs any amount of pleasure or pain-avoidance below it. In practical terms, this is the claim that preventing a single instance of extreme torture takes absolute priority over preventing any number of mild headaches, regardless of how many headaches are involved. The precise question I will address is whether this absolute priority can be grounded without presupposing a single measurable scale of value that the theory's proponents explicitly wish to reject. This is not an idle technical curiosity for the non-philosopher. This specific moral framework drives significant real-world advocacy, particularly in movements prioritizing the alleviation of extreme suffering in factory farming or catastrophic risk reduction. If the theoretical foundation is unstable, the policy prescriptions derived from it—often claiming to override ordinary cost-benefit reasoning—may lack the rational force their proponents claim.

  **2. The Dialectical Situation**
  Current defenses of this view leave the question open because they rely on an unstable tension between two ways of modeling value. On one hand, the threshold formulation appears to presuppose a single cardinal scale on which all pains and pleasures are located, since the threshold is defined as a specific level on that scale. On the other hand, the view is typically adopted by theorists suspicious of such scales, who wish to claim that intense suffering is qualitatively different from, and incomparable with, mild pleasures. This creates a genuine fork rather than a pseudo-problem. If the theorist takes the first route and accepts a single scale, the threshold becomes ad hoc; the scale does no independent work, and the discontinuity in normative force must be stipulated rather than explained. If they take the second route and deny a single scale, they inherit standard troubles regarding incomparability. Specifically, they face the "small improvement" problem: a pain just below the threshold and a pain just above it differ arbitrarily little in their intrinsic character, yet differ infinitely in their normative standing. Existing positions have not resolved whether this discontinuity is a feature of the world or a flaw in the theory, leaving the view vulnerable to the charge that it is either arbitrary or incoherent.

  **3. Method and Timeline**
  Over the six-month leave, I will construct and test a formal model of the lexical-threshold view to determine if it can withstand these pressures. In the first two months, I will focus on formalization, constructing the axioms a two-tier ordering would need to satisfy to avoid collapsing into a standard sum. I will demonstrate why the obvious axiomatisations fail, particularly regarding transitivity and continuity. This technical groundwork is necessary to ensure the subsequent philosophical argument is not merely intuitive but structurally sound. In months three and four, I will test this formal model against specific case studies designed to break each route of stabilization. This includes "crowding" cases, where a sufficiently large number of pains each just below the threshold are aggregated to see if they outrank a single pain just above it. It also includes "scale-pluralism" cases, where I will examine how the threshold sits differently depending on whether suffering is measured by momentary intensity, duration-discounted intensity, or a creature's total affective budget. These cases often come apart, such as in comparisons between long mild discomfort versus brief agony. In month five, I will investigate the extensional-equivalence worry by comparing the recommendations of the lexical-threshold view against a weighted-sum asymmetric view with a sufficiently large weight on suffering. If the two views recommend the same actions over any finite population, the dispute may be merely about representation. The final month will be dedicated to synthesis and writing, where the philosophical argument, as opposed to the technical construction, must carry the weight of explaining what follows for someone who thought they were choosing a radically different moral outlook.

  **4. Possible Conclusions and Failure Conditions**
  There are three primary conclusions this project might reach. The first is that the lexical-threshold view is unstable and collapses into a weighted-sum view, meaning the dispute is indeed notational. The second is that the view is distinct but only defensible by accepting a specific, controversial metaphysics of phenomenal magnitude. The third is that the view can be stabilized by retreating to a second, aggregate threshold, though this concedes that the lexical claim is really a very large finite weight. The considerations deciding between these will be the success of the formal axioms in handling the crowding cases and the plausibility of the metaphysical commitments required to sustain the scale. The project would count as having failed if the honest answer is that the lexical-threshold view is only notationally distinct from a heavily weighted asymmetric version, as this would undermine the claim of a unique moral outlook. It would also count as a failure if the whole problem dissolves into a question about the metaphysics of phenomenal magnitude that I cannot settle in six months, as this would push the resolution outside the scope of moral philosophy and into philosophy of mind.

  **5. Scope Assessment**
  Given the technical risks, I must be candid about what would be cut if the formal part threatens to expand. If the axiomatisation proves more complex than anticipated, I will set aside the deep metaphysics of consciousness required to settle the scale-pluralism problem. I will treat the measurement of suffering as a given parameter rather than attempting to solve the metaphysics of pain itself. The minimum publishable deliverable is a paper establishing the dilemma between the single-scale and incomparability routes. Even if I cannot fully resolve which path is superior, demonstrating that the lexical-threshold view must choose between arbitrariness and incoherence is a significant contribution. This ensures that the fellowship yields a definite result even if the ideal outcome of a fully stabilized theory remains out of reach.
