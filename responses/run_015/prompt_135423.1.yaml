      *   **Topic:** Libet-style experiments and free will.
      *   **Goal:** Move *away* from the pop-sci "brain decides 300ms before you" determinism framing. Move *toward* a niche interpretation: Readiness Potential (RP) as noisy accumulator dynamics (stochastic), veto as modulation of that process (not a separate homunculus).
      *   **Constraints:** Do *not* explain the experiments (assume I know them). Focus on *teaching plan* (order, dependencies, examples, misconceptions, check questions, scope limits).
      *   **Specific Requirements:**
          *   Order of pieces/dependencies.
          *   Carrying example (not classic button-press, suggest continuous reaching).
          *   Where to head off specific misconceptions (RP = determinism, consciousness = spectator, veto = homunculus).
          *   One end check question.
          *   What to refuse to cover.
          *   Specific misconception about stochastic modulation to defuse.

  2.  **Deconstruct the "Niche Interpretation":**
      *   *Standard View:* RP starts $\rightarrow$ Decision made unconsciously $\rightarrow$ Conscious will is an illusion $\rightarrow$ Veto is a magical conscious override.
      *   *Target View:* RP = neural noise/accumulation to threshold $\rightarrow$ Decision is the crossing of the threshold (which includes conscious access) $\rightarrow$ Veto = changing the threshold or adding negative evidence to the *same* accumulator $\rightarrow$ No dualism between unconscious brain and conscious will.
      *   *Key Theoretical Frameworks:* Schurger et al. (2012) on RPs as neural noise, Affordance Competition Hypothesis, perhaps some predictive processing or embodied cognition vibes.

  3.  **Determine the Carrying Example:**
      *   *Prompt Suggestion:* Continuous reaching task.
      *   *Why?* Button presses are discrete, binary, and arbitrary. They invite the "when did it happen?" question. Reaching is continuous, corrective, and goal-directed. It allows for showing that the "decision" isn't a point but a trajectory. It fits the "accumulator" model better (evidence builds as you move).
      *   *Decision:* Yes, use a continuous reaching task (e.g., reaching for one of two targets that might change).

  4.  **Structure the Workshop (Order & Dependencies):**
      *   *Phase 1: Setup & Intuition.* Get them to feel the "problem" without accepting the standard solution.
      *   *Phase 2: The Data (Re-interpreted).* Introduce the RP not as a command but as noise/accumulation.
      *   *Phase 3: The Veto (Re-interpreted).* Show how stopping/modulating fits the same model.
      *   *Phase 4: Philosophical Implications.* Connect back to free will definitions (compatibilism vs. incompatibilism).
      *   *Dependencies:* You can't understand the Veto as modulation until you understand the RP as accumulation. You can't discuss Free Will implications until you've dismantled the Determinism claim.

  5.  **Address Misconceptions (Timing):**
      *   *RP = Determinism:* Head this off early, when introducing the RP data. Frame it as probabilistic from the start.
      *   *Consciousness = Spectator:* Address this during the "Accumulator" phase. If consciousness is part of the loop, it's not a spectator.
      *   *Veto = Homunculus:* Address this during the "Veto" phase. Show it's just negative input to the same accumulator.

  6.  **Develop the Check Question:**
      *   Needs to test the specific nuance: Stochastic process + Modulation $\neq$ Determinism.
      *   Draft: "Does the RP prove determinism?" (Too simple).
      *   Draft: "Is the veto a separate mechanism?" (Too specific).
      *   Better: A scenario where they have to distinguish between a deterministic command and a stochastic threshold crossing influenced by conscious attention.

  7.  **Define Scope Limits (What to Refuse):**
      *   Don't get bogged down in the exact timing milliseconds (Libet's clock method is notoriously flawed).
      *   Don't solve the Hard Problem of Consciousness.
      *   Don't argue for Libertarian Free Will (metaphysical). Stick to the neuroscience implications.

  8.  **Anticipate Stochastic Misconception:**
      *   *Risk:* Students think "Stochastic = Random = Free."
      *   *Correction:* Randomness isn't control. The point is *sensitivity to reasons*, not randomness. The modulation allows reasons to influence the threshold.

  9.  **Drafting the Plan (Iterative refinement):**

