      *   *Section 3: Free Will.* Misconception: Spectator. Correction: Consciousness as the system's access to its own state.
      *   *Check Question:* Focus on the difference between "caused by prior neural state" vs. "insensitive to reasons."

  10. **Refining the Output:**
