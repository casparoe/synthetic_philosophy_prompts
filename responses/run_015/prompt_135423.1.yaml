answer: |-
  Here is a workshop plan structured to dismantle the pop-sci narrative and rebuild the nuanced accumulator model.

  ### 1. Sequence and Dependencies
  You cannot introduce the "Veto as Modulation" concept until the "RP as Accumulator" concept is secure. If they still view the RP as a deterministic command, the veto *must* look like a magical override.

  **The Dependency Chain:**
  1.  **Task Phenomenology:** Students must first intuit that action preparation is continuous, not discrete. (Prerequisite for accepting the accumulator model).
  2.  **RP Re-interpretation:** Students must accept the RP reflects neural noise/accumulation, not a finalized decision. (Prerequisite for dismantling the "Determinism" claim).
  3.  **Veto Re-interpretation:** Students must see stopping as lowering the accumulation rate or raising the threshold within the *same* circuit. (Prerequisite for dismantling the "Homunculus" claim).
  4.  **Free Will Implication:** Only after 1–3 can you argue that consciousness is a participant in the dynamics rather than a spectator.

  **Workshop Flow:**
  *   **0–15 min:** The Carrying Example (Phenomenology).
  *   **15–30 min:** The RP as Stochastic Accumulator (Neuroscience/Metaphysics).
  *   **30–45 min:** The Veto as Dynamic Modulation (Control Theory).
  *   **45–60 min:** Synthesis & Free Will Implications.

  ### 2. The Carrying Example: Continuous Reaching with Target Cancellation
  **Do not use the Libet clock/button press.**
  **Use:** A task where participants reach for one of two appearing targets, but on some trials, a "stop" signal appears mid-reach, requiring them to abort or redirect.

  **Why this example?**
  *   **Binary vs. Continuous:** A button press forces a "when did it happen?" ontology. A reach shows that "decision" is a trajectory through state space.
  *   **The Veto:** In a button press, vetoing looks like stopping a train. In a reaching task, vetoing looks like steering. It demonstrates that the motor system remains sensitive to new information (conscious or otherwise) *during* the execution.
  *   **Accumulator Fit:** Reaching maps perfectly to drift-diffusion models. The hand moves as evidence accumulates; stopping is just negative evidence entering the same stream.

  ### 3. Misconception Interception Points
  Here is exactly where to head off the three specific misconceptions you listed.

  **A. "The RP proves determinism"**
  *   **When:** During the **RP Re-interpretation (15–30 min)** phase.
  *   **How:** When you introduce the Schurger et al. (2012) model, explicitly state: *"The RP is not a cause; it is a signature of a system waiting to cross a threshold."*
  *   **The Move:** Show that if you average random noise aligned to a threshold crossing, you get an RP-like curve. Therefore, the RP indicates *probability*, not *necessity*. It shows the system is *poised*, not *pushed*.

  **B. "Consciousness is just a spectator"**
  *   **When:** During the **Synthesis (45–60 min)** phase.
  *   **How:** Once the veto is established as modulation, ask: *"What provides the context for the modulation?"*
  *   **The Move:** Argue that if the veto is sensitive to reasons (e.g., "I shouldn't touch that, it's hot"), and consciousness is the medium of reasons, then consciousness is functionally integrated into the accumulator loop. It is not watching the movie; it is holding the steering wheel.

  **C. "The veto is a homunculus pulling a lever"**
  *   **When:** During the **Veto Re-interpretation (30–45 min)** phase.
  *   **How:** When explaining how the stop signal works.
  *   **The Move:** Use a control theory diagram. Show the "Veto" not as a separate box sending a stop command, but as a gain adjustment on the input to the original accumulator. It's the same engine, just given less gas. Explicitly forbid dualistic language (e.g., "The brain wants to go, but *I* stop it").

  ### 4. Specific Stochastic Misconception to Defuse
  **The Misconception:** *"If the process is stochastic/random, that saves free will because it breaks the causal chain."*

  **Why it's dangerous:** This trades determinism for indeterminism, which doesn't give you *control*. It just gives you noise.

  **How to Defuse:**
  *   **Timing:** Immediately after introducing the stochastic accumulator model.
  *   **The Argument:** "Randomness is not freedom. A dice roll is not an agent. The value of the stochastic model is not that it introduces randomness, but that it introduces **sensitivity**. Because the system is noisy and near-threshold, it is highly sensitive to small inputs (reasons, attention, context). Freedom lies in the *sensitivity to reasons*, not in the *absence of causes*."

  ### 5. Scope Refusal (What NOT to Cover)
  **Refuse to cover:** *The precise timing of the 'W' judgment (Libet's clock method).*

  **Why:**
  *   It is methodologically fraught (retrospective reconstruction).
  *   It distracts from your core argument. Your argument is about the *structure* of the decision process (accumulator vs. command), not the *timestamp* of awareness.
  *   If students ask about the 200ms vs. 500ms debate, shut it down: *"For our purposes, whether it's 100ms or 500ms doesn't matter. Even if it's 1 second, if the process is stochastic and modifiable, the determinism argument fails. Don't get bogged down in the milliseconds."*

  ### 6. The End Check Question
  Do not ask "Do we have free will?" Ask a structural question that tests if they understand the *mechanism* you taught.

  **Question:**
  *"In the pop-sci view, the Readiness Potential is a deterministic command that renders the conscious veto a separate, magical override. In the stochastic accumulator view we discussed, why does the existence of a pre-movement Readiness Potential fail to entail that the agent lacks control?"*

  **Desired Answer Key (Mental Check):**
  *   They should mention that the RP reflects **probability/noise**, not a fixed outcome.
  *   They should mention that the veto is a **modulation of the same process** (changing threshold/drift), not a separate causal chain.
  *   They should mention that this allows **reasons/consciousness** to influence the threshold crossing before it happens.

  *(If they answer "Because randomness breaks causality," they failed the stochastic defusion. If they answer "Because the timing is wrong," they failed the scope refusal.)*
