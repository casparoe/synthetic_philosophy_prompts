answer: |-
  Monsieur,

  You present to me a marvel of the geometric spirit. I confess, having once devoted myself to the construction of calculating machines to spare my father the labor of accounting, I feel a certain kinship with this desire to mechanize judgment. It is a seductive thought: to remove the passion of the magistrate and replace it with the cold precision of the cipher. You argue that because the execution is automatic, it is no longer "force," and because the rules are agreed upon by stakeholders, they are no longer mere "custom."

  But I fear you are deceived by the novelty of the instrument. You have not escaped the condition of man; you have only clad it in iron.

  Let us speak first of this "force" you claim is absent. You say the machine lacks a will. True, a clock does not hate the hour it strikes. But who winds the clock? Who forges the gears? If this protocol you describe resides in the physical world—if it requires fire to smelt the metal, wood to build the servers, or men to maintain the lines of communication—it is subject to the power of those who control those elements.

  If a man refuses the penalty your machine dictates, what then? Does the code itself reach out and seize his bread? No. It requires that his neighbors, or the stakeholders, honor the output. And if they refuse? If the majority decides to override the oracle? Then you must compel them. You must exclude them. You must cut them off from the network. This is excommunication, is it not? And what backs excommunication but the collective power of the community to deprive a man of goods or society? This is force. It is merely depersonalized, hidden behind a veil of mathematics, but it remains the power of the many over the few. As I have written: *Justice without force is powerless; force without justice is tyrannical.* You have secured the force, perhaps even perfected it, but do not pretend it is not force. It is the power to deprive.

  And now, let us speak of this "justice" you claim to have engineered. You say the norms are updated by consensus, not inherited from tradition. But tell me: upon what ground does this consensus stand? Why is one agreement "just" and another "unjust"? If it is because the stakeholders agree, then justice is merely the will of the majority. It is the law of the strongest, counted by heads rather than swords.

  I have long meditated on why we follow laws. Is it because they are inherently good? No. If it were so, why does truth change with the climate? Why is justice bounded by rivers and mountains? What is true on one side of the Pyrenees is false on the other. You propose to replace the custom of kings with the custom of coders. But it is still custom. It is still arbitrary. You have founded your justice on the shifting sand of human agreement, not on the rock of divine truth.

  You ask where the justice is in rules that owe nothing to tradition or divine command. I answer you: there is none. There is only order. There is only predictability. Do not confuse the peace of the prison with the justice of the Kingdom. A machine can ensure consistency, yes. It can ensure that the tyrant is consistent in his tyranny. But consistency is not justice.

  We must remember the Fall. Human nature is corrupted. Our reason is as liable to error as our passions are to excess. To believe that men, gathering in consensus, can engineer a justice that is self-sufficient is the pride of Babel all over again. You seek to build a tower to heaven using only the tools of the earth. You rely on the *esprit de géométrie*—the mathematical mind—to solve a problem of the *esprit de finesse*—the intuitive heart—and ultimately, of Charity.

  True justice belongs to a higher order than power, and a higher order than reason. It belongs to the order of Charity. It comes from God, who is hidden. Without Him, all human arrangements, whether decreed by a king in velvet or by a algorithm in silicon, are merely organized force masking itself as right.

  So, my friend, your binary does not collapse. It stands firmer than ever. You have shown us a new kind of force, more subtle and pervasive. And you have shown us a new kind of custom, harder to question because it is written in logic rather than parchment. But you have not shown us Justice. For Justice cannot be coded by fallen hands. It must be received.

  Tell me, in this protocol of yours: when the code conflicts with the mercy due to a wretched man, which prevails? If the code prevails, it is tyranny. If mercy prevails, who grants it? And if a man grants it, is he not again the magistrate you sought to replace?
