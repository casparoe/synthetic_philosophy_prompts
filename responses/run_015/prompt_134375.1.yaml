answer: |-
  I restrict the knowability principle by adopting an intuitionistic logic that denies the law of excluded middle for propositions where verification is permanently impossible. I concede freely that this restriction is not independently intuitive; classical logic feels natural because it mirrors a world where truths sit waiting regardless of our access, which is precisely the realist picture I reject. Regarding your comet case, I answer yes: the proposition is true because the evidence was *possible* in the sense that nothing in the actual laws of nature or our cognitive architecture precluded an observer from being there, even if accident prevented it. The cost is that truth is not a property that floats free of our capacity to recognize it; it is tethered to the possibility of evidence, not the actuality.

  The constraint on my possibility operator that separates me from the realist is this: I deny that "possible" ranges over metaphysical worlds where truths obtain in total isolation from any conceivable evidential situation. For the realist, a proposition is true if it corresponds to reality, even if no agent could ever detect that correspondence; for me, a proposition is true only if the state of affairs that makes it true could, in principle, manifest as evidence to a finite inquirer. Applying this to your continuous quantity in an unsampled region: if the laws of nature preclude any measurement or trace of those exact values, then the proposition stating the value is neither true nor false. I deny the law of excluded middle here, whereas the realist insists it must be one or the other regardless of our epistemic closure.

  Plainly stated, the disagreement is about what truth consists in: for me, truth is warranted assertibility rather than evidence-transcendent correspondence. My constraint on truth amounts to the requirement that a statement's truth conditions must not outrun our ability to recognize them when they obtain; if the conditions are such that no recognition is possible, the statement lacks a truth value entirely. I accept that this makes truth less stable than the realist prefers, but it preserves the link between meaning and use that makes language intelligible to us in the first place. I am ready for your harder case involving nomological absence of observers; let us see if it breaks the link between truth and possible knowledge.
