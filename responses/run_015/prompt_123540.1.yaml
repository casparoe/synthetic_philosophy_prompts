answer: |-
  **TO:** Trust Board, Merrivale Fertility Service
  **FROM:** Lay Member, Emerging Genetics Policy Group
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Polygenic Risk Score Usage and Interim Determination

  **Recommendation**

  I recommend the Board adopt the **Treatment Test** as the governing ethical framework for embryo selection, subject to an immediate clinical moratorium on using polygenic risk scores (PRS) for embryos of non-European ancestry. This hybrid approach permits risk reduction for severe medical conditions the Service would treat post-birth but prohibits selection for enhancement traits. However, due to current scientific limitations regarding ancestry bias, the Service cannot safely offer PRS-based selection for mixed-ancestry embryos until validation data improves.

  **Interim Determination: Okonjo and Ferris**

  Regarding the urgent request from Rachel Okonjo and Daniel Ferris, I recommend the Service deny both the request to exclude embryos based on bipolar liability and the request to select for educational attainment.

  The reasons provided to the patients must be transparent and scientific, not merely bureaucratic. They should be told: "While we understand the profound importance of preventing severe psychiatric illness in your family, the current genetic tools available are not accurate enough for embryos of mixed Nigerian and European ancestry to guarantee a safe or meaningful choice. Using them now would offer a false promise of safety and could inadvertently increase health risks. We cannot ethically proceed with selection based on data we know is unreliable for your specific genetic background."

  This spares the patients the insult of having their suffering weighed against abstract policy while adhering to our duty of care. It acknowledges their moral reasoning without validating the clinical safety of the procedure.

  **Policy Conditions and Disclosure**

  Adoption of the Treatment Test must carry strict conditions. First, **Disclosure:** If PRS is offered where ancestry validation exists, patients must be explicitly informed of the confidence intervals. They must be told that differences between siblings are small, that scores are probabilistic not deterministic, and that environmental factors heavily influence outcomes. We cannot allow patients to mistake a statistical nudge for a medical guarantee.

  Second, **Ancestry:** The Service should not offer polygenic scoring for mixed-ancestry embryos at all until the predictive validity matches that of European-ancestry samples. To do otherwise is to offer a inferior service to minority populations, exacerbating health inequalities under the guise of choice.

  Third, **Review:** This policy must be reviewed in twelve months, or sooner if significant validation data for diverse populations becomes available.

  **Ethical Reasoning**

  This recommendation rests on two contested ethical points: the "no-difference" argument raised by the patients, and the choice between the Treatment Test and the No-Maximising Rule.

  Rachel Okonjo argues that because the selected child would not otherwise exist, no one is made worse off by the selection. This non-identity argument does not neutralize our objections. Public healthcare policy is not solely concerned with harm to the individual child, but with the values embodied by the medical institution. We do not permit parents to select for disabilities even if the child would not exist otherwise, because doing so conflicts with the medical mission to promote health. The point of the exercise is not merely to bring a child into existence, but to do so in a way that aligns with our commitment to reducing suffering without commodifying human traits. If we accept that existence is always preferable to non-existence regardless of condition, we lose the ability to set any boundaries on selection at all.

  I reject the **No-Maximising Rule**, though its strongest argument deserves record. Proponents argue that any use of scores to rank embryos turns children into products and that withholding numbers protects patients from false precision. They contend that drawing a line between "health" and "enhancement" is unstable, as many traits predict health outcomes. By refusing to maximise any trait and hiding the data, the Service avoids becoming an arbiter of what makes a life valuable and prevents a slide toward eugenics where children are designed rather than welcomed. This is a robust defense of human dignity and acknowledges the profound scientific uncertainty inherent in PRS.

  However, I reject this rule because it is excessively paternalistic and ignores the duty to prevent severe suffering. If we have reliable data that an embryo carries a high liability for a debilitating condition we would treat clinically after birth, refusing to use that information to prevent suffering is morally inconsistent. The Treatment Test maintains a necessary boundary: it allows us to act medically to prevent disease without endorsing the maximisation of social advantages. It distinguishes between restoring health and optimizing traits, a distinction vital for a publicly funded service.

  **Conclusion**

  The Legal Officer's concern that restrictive rules export practice to private clinics is valid, but it cannot dictate clinical safety. We cannot validate unsafe practices simply because others will perform them unchecked. By adopting the Treatment Test with an ancestry moratorium, we maintain ethical integrity while acknowledging scientific limits. We protect patients from false precision, uphold the medical mission to prevent suffering, and avoid endorsing enhancement. I ask the Board to vote on this framework immediately to resolve the Okonjo/Ferris case and establish clear guidance for future cycles.
