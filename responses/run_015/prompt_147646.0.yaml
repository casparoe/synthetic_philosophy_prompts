      *   Counter: My identity causes me to trust my mother more than a stranger. This is identity-based credibility calibration. Is it prejudicial injustice against the stranger? No, it's rational statistical inference based on experience.
      *   Counter: My identity (white) causes me to lack the concepts to understand a black speaker's testimony about racism. I assign low credibility because I think they are confused. Is this testimonial injustice? Fricker might say it's Hermeneutical Injustice (structural), but for it to be Testimonial Injustice, I must be *culpable* for not correcting my prejudice.
      *   The key is the *normative* weight of "prejudice." It implies a *failure* of rationality or ethics, not just a *difference* of perspective.

  7.  **Final Polish:** Ensure the tone is supportive and analytically precise. Use the terminology of social epistemology (standpoint, virtue epistemology, hermeneutical resources). Structure the advice clearly: Diagnosis, The Fix, Implications.

