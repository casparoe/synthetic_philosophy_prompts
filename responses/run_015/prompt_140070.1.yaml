prompt: |-
  I work at a small climate-policy institute in Berlin, and I have been asked to draft a short briefing note on a question that keeps slipping out of the register my colleagues normally work in. Two neighbouring countries, inside the same coupled electricity market, bound by the same climate commitments and with comparable engineering capacity, have adopted opposite nuclear policies: Germany closed its last three reactors in April 2023 and is dismantling them, having replaced part of the lost output with gas-fired generation and with imports from its neighbours, while France still derives roughly two-thirds of its electricity from a fleet of about fifty-six reactors, is planning new builds, and has, as I understand the practice, permitted operating lives well beyond the original forty-year design assumption subject to periodic safety re-assessment. Everyone I ask for an explanation gives me either a political story — the strength of the German anti-nuclear movement since the 1970s, the origins of the French programme in the mid-1970s oil shock and the fact that it was launched without parliamentary debate — or a technical one about grids, geology and construction costs. I do not think those stories are wrong, but I want something different: treated as practices rather than as outcomes, what does each policy presuppose about risk, about the state, and about what is owed to people who do not yet exist?

  Three features of the pair strike me as philosophically loaded, and I would like the implicit theory behind them reconstructed rather than the policies judged. First, the exit does not free Germany of a custodial obligation, it converts an operating fleet into a sealed one: both countries intend to isolate long-lived waste in a deep geological repository whose safety is argued over timescales of hundreds of thousands of years, which is longer than any state has so far lasted. So when the phase-out is defended as refusing to impose a burden on later generations, what exactly is being claimed — a constraint on adding to a stock, a claim about expected harm, or something expressive, about the kind of polity a nation is willing to be? Second, the same jurisdictions apply a near-absolute, demonstrate-that-it-is-safe standard to radioactivity while approaching climate risk through carbon budgets and a social cost of carbon, that is, through an explicit trade-off that licenses some non-zero quantity of harm. What has to be true about the difference between the two hazards for that to be coherent rather than convenient — their shape, their reversibility, the number and identifiability of the people who bear them, our confidence in the probabilities, or the fact that one harm is imposed by our act alone and the other only together with everyone else's? Third, the two technologies make different demands on whoever comes after us: a fleet requires a competent regulator and operator to persist for as long as it runs, whereas a sealed repository is, in principle, designed so that safety does not depend on anyone reading the archives, and a retrievable repository — which I gather is what French law asks for rather than permanent sealing — seems to presuppose something different again, that later generations should be left the option of revising our judgement and possibly wanting the material back.

  So here is what I need. Reconstruct the theory that each practice requires, and be explicit about which parts are strictly presupposed and which merely fit comfortably: where is the practice underdetermined, so that several quite different theories would license the same policy, and where is it in tension with itself? Say whether a single underlying theory could generate both policies given different baselines — different grids, different publics, different inherited capital — or whether Berlin and Paris really are committed to incompatible views of risk. A colleague of mine suggests that the live axis is not how much risk a technology carries but what sort of afterlife it has, meaning what it demands of successor institutions: active custodianship for a century, passive safety with a warning that must stay legible for ten thousand years, or an open option that leaves the future our material to do as it likes with. I would like that suggestion tested rather than applauded — is it doing genuine work, or is it a redescription of the risk numbers? Finally, tell me what would have to change in each practice if the presupposition were swapped: if a country's energy mix is treated as partly constitutive of what it stands for rather than as a mere input to an electricity system, what follows for a Germany that buys nuclear power across the border in winter, and for a France that sells reactor technology to states with no comparable regulator; and if instead one adopted a flat expected-harm view with discounting, would the German closure simply become a moral error, and what else would that commit you to? Please do not give me a policy recommendation, and do not send me to a literature: I want the implicit theory and the places where it is thin.
reasoning: |-
  Here's a thinking process that leads to the briefing note:

  1.  **Analyze the Request:**
      *   **Context:** Small climate-policy institute in Berlin.
      *   **Task:** Draft a short briefing note.
      *   **Topic:** Contrasting German (phase-out) and French (continuation/expansion) nuclear policies, *not* as political/technical outcomes, but as *practices* revealing implicit theories about risk, the state, and intergenerational obligation.
      *   **Key Questions/Features to Address:**
          1.  **Waste/Custody:** Germany's phase-out vs. the ongoing obligation of waste storage (deep geological repository). What is the claim about burdening future generations? (Constraint on stock? Expected harm? Expressive polity?)
          2.  **Risk Standards:** Near-absolute safety for radiation vs. trade-off based (carbon budget) for climate. What makes this coherent? (Shape, reversibility, identifiability, agency?)
          3.  **Demands on the Future:** Active custodianship (operating fleet) vs. passive safety (sealed repository) vs. retrievable option (French law). What does this imply about successor institutions?
      *   **Specific Instructions:**
          *   Reconstruct the implicit theory for each practice.
          *   Distinguish between strictly presupposed elements and those that just fit comfortably (underdetermination).
          *   Identify internal tensions.
          *   Test the colleague's suggestion: Is the "afterlife/custodianship" axis genuine or just a redescription of risk?
          *   Explore counterfactuals: What if presuppositions were swapped? (Germany buying nuclear power; France exporting to weak regulators; Flat expected-harm view).
          *   **Constraint:** No policy recommendations. No literature references.
          *   **Tone:** Philosophical, analytical, precise, suitable for a policy institute briefing but deeply theoretical.

  2.  **Deconstruct the Three Features (Drafting the Core Arguments):**

      *   *Feature 1: Waste & The "Burden" Claim.*
          *   Germany: Phase-out is often justified as "not burdening future generations." But waste remains. So the burden isn't *existence* of waste, it's the *production* of new waste. It's a deontological constraint ("Do not create new long-lived hazards") rather than consequentialist ("Minimize total harm").
          *   France: Continues production. Implicitly accepts the burden as manageable or outweighed by climate benefits. Views waste as a technical inventory problem, not a moral veto.
          *   *Theory:* Germany = Integrity/Purity of the Polity (Expressive). France = Stewardship/Management (Consequentialist/Technocratic).

      *   *Feature 2: Risk Standards (Radiation vs. Climate).*
          *   Radiation: ALARA (As Low As Reasonably Achievable), often treated as linear no-threshold. Zero-tolerance vibe.
          *   Climate: Carbon budgets, cost-benefit analysis. Accepts some warming/harm.
          *   *Coherence Check:* Why the difference? Radiation is localized, identifiable, immediate (in accident terms), and state-controlled. Climate is diffuse, collective, probabilistic.
          *   *Theory:* Germany treats radiation as a *violation of rights* (specific victims), climate as a *collective risk pool*. France treats both as *manageable flows*.
          *   *Tension:* Germany imports nuclear power. This externalizes the radiation risk while claiming domestic purity. This suggests the theory is about *territorial sovereignty* over risk, not risk itself.

      *   *Feature 3: Demands on the Future (Institutional Afterlife).*
          *   Operating Fleet: Requires continuous competence, regulation, grid stability. Demands a strong, persistent state.
          *   Sealed Repository: Requires "passive safety." Assumes state might fail, so design must survive institutional collapse.
          *   Retrievable (France): Assumes future generations might have better tech or different values. Keeps the option open.
          *   *Colleague's Hypothesis:* "Afterlife" is the key axis.
          *   *Test:* Is this just risk in disguise? If risk were the only driver, sealed is best (lowest probability of release). Retrievable adds risk (handling). So retrievability *must* be about something other than immediate risk minimization. It's about *agency* of the future.
          *   *Theory:* France = Future as competent successor (trust). Germany (on waste) = Future as victim (protection). Germany (on grid) = Future as inheritor of renewables (different kind of state).

  3.  **Synthesize the "Implicit Theories":**

      *   **The German Theory (The Integrity State):**
          *   *Risk:* Categorical prohibition on specific, state-imposed hazards (radiation), even if aggregate harm (climate) is higher.
          *   *State:* Guarantor of non-maleficence within borders.
          *   *Future:* Entities to be protected from *our* specific sins, even if they face greater diffuse threats.
          *   *Tension:* Importing nuclear power violates the territorial integrity of the risk principle.

      *   **The French Theory (The Steward State):**
          *   *Risk:* Manageable flows. Trade-offs are legitimate.
          *   *State:* Competent manager of complex technological systems over deep time.
          *   *Future:* Competent successors who should have options (retrievability) and inherit a stable climate (via low-carbon power).
          *   *Tension:* Exporting tech to weak regulators undermines the assumption that the technology requires a Steward State to be safe.

  4.  **Address the "Single Underlying Theory" Question:**
      *   Can one theory generate both?
      *   *Utilitarianism:* No, because Germany accepts higher carbon harm to avoid nuclear risk.
      *   *Rights-based:* Maybe, if rights are territorial.
      *   *Institutional Capacity:* This fits best. If the theory is "Match technology to state capacity," then Germany says "We cannot sustain the political consensus for nuclear," France says "We can." But the prompt asks about *risk and obligation*, not just capacity.
      *   *Verdict:* They are committed to incompatible views of *moral agency* regarding risk. Germany sees risk imposition as a moral stain; France sees it as a managerial task.

  5.  **Test the Colleague's Suggestion (Afterlife/Custodianship):**
      *   Is it genuine work? Yes.
      *   Why? Because risk numbers (probability x impact) would dictate sealing waste forever (lowest release probability). Retrievability *increases* operational risk. Therefore, choosing retrievability is a statement about the *relationship* with the future, not just the physics of the waste. It treats the future as a moral agent, not just a receptor of harm.
      *   Germany's sealed approach treats the future as passive/vulnerable. France's retrievable approach treats the future as active/competent.

  6.  **Develop the Counterfactuals (Swapping Presuppositions):**
      *   *Germany buying nuclear:* If energy mix is constitutive of what the state *is*, importing nuclear makes Germany a "free rider" on the moral risk. It decouples *consumption* from *production responsibility*. It implies the moral sin is *territorial*, not *causal*.
      *   *France exporting to weak regulators:* If the theory requires a "Steward State," exporting to non-Steward states is incoherent. It suggests the technology is "safe in itself" (technocratic fetishism) rather than "safe within a system."
      *   *Flat Expected-Harm View:* If Germany adopted this, closure is a moral error (higher carbon harm > nuclear risk). This commits Germany to viewing all harms as commensurable. It collapses the distinction between "doing" (radiation) and "allowing" (climate).

  7.  **Drafting the Note (Iterative refinement for tone and structure):**
      *   *Header:* Standard Briefing Note format (To, From, Date, Subject).
      *   *Tone:* Detached, analytical, rigorous. Avoid "should." Use "presupposes," "implies," "tension."
      *   *Structure:*
          1.  Executive Summary (The Core Divergence).
          2.  Theoretical Reconstruction (Germany vs. France).
          3.  The Three Features (Waste, Risk Standards, Afterlife).
          4.  Testing the "Afterlife" Hypothesis.
          5.  Counterfactuals & Tensions.
          6.  Conclusion (Incommensurability).

      *(Self-Correction during drafting)*: Make sure I don't slip into policy advice. Keep it focused on the *logic* of the practices. Ensure I answer the specific question about "underdetermination" (where the practice doesn't force the theory).
      *Refining the "Underdetermination" point:* For Germany, the waste repository *could* be retrievable. The choice to seal it (eventually) is not forced by physics, but by the theory of the future. For France, building new reactors isn't forced by climate goals alone (renewables + storage is an alternative), so it presupposes a belief in *centralized* solutions.

      *Refining the "Risk vs. Afterlife" test:* Be precise. If it were just risk, passive safety wins. Retrievability adds failure modes. So retrievability *must* be about value pluralism or future agency.

      *Refining the "Constitutive" point:* If energy mix is constitutive, Germany is hypocritical (importing). France is imperialist (exporting without context).

  8.  **Final Review against Constraints:**
      *   No policy recs? Checked.
      *   No literature? Checked.
      *   Addressed all three features? Checked.
      *   Addressed colleague's hypothesis? Checked.
      *   Addressed counterfactuals? Checked.
      *   Tone appropriate? Yes, philosophical/policy-analytic.

  9.  **Final Polish:** Check for clarity and density. Ensure the distinction between "presupposed" (necessary for the logic to hold) and "compatible" (fits but isn't required) is clear. (e.g., Germany *needs* the distinction between production and consumption risk to hold its theory together; France *needs* the assumption of institutional continuity).

  *(Drafting content based on these thoughts...)*
  *Key phrase to include:* "Territorialization of moral responsibility."
  *Key phrase to include:* "Future as victim vs. Future as agent."
  *Key phrase to include:* "Commensurability of harms."

