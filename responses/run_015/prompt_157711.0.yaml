      *   PP suggests perception is a "controlled hallucination" based on priors.
      *   Does it blur the line? Yes. In PP, there is no "raw data" that gets stored untouched. The "experience" *is* the prediction.
      *   If the brain updates its model of the immediate past (postdiction), is that changing the experience or the memory? In PP, the "experience" at time $t$ is partially constituted by inputs from $t+1$. This makes the Orwellian/Stalinesque distinction hard to maintain because there is no stable "original impression" to begin with.

  6.  **Address the Memory Connection:**
