      *   **The Debate:** Two camps regarding *when* and *how* the brain constructs this experience.
          *   Camp A: The brain goes back and *changes the experience itself* (retroactive alteration of qualia).
          *   Camp B: The experience remains untouched, but the *report/memory* is falsified (post-hoc confabulation).
      *   **The Question:** Is there an established philosophical name for this specific split? If not, how to define the boundary?
      *   **Secondary Question:** Where does Predictive Processing fit in (does it blur the line)?
      *   **Tertiary Question:** Is this the same concept as seen in memory debates?

  2.  **Identify the Philosophical Concepts:**
      *   The specific illusion described is almost certainly the **Color Phi Phenomenon** (Kolers & von Grünau, 1976).
      *   The debate described is the classic **Orwellian vs. Stalinesque** distinction proposed by Daniel Dennett.
      *   *Stalinesque:* The experience is fabricated *before* entering consciousness (like a show trial staged before the public sees it). This matches Camp A (altering the experience).
      *   *Orwellian:* The experience happens, but memory is revised *afterwards* (like history books rewritten after the fact). This matches Camp B (falsifying the log).
      *   *Dennett's Twist:* Dennett argues the distinction is illusory (no "Cartesian Theater"), leading to his **Multiple Drafts Model**.

  3.  **Address the "Established Name" Question:**
      *   Yes, it is the **Orwellian vs. Stalinesque** distinction.
      *   Context: Philosophy of Mind, Consciousness Studies.
      *   Key Figure: Daniel Dennett (*Consciousness Explained*).

  4.  **Address the "Boundary" Question:**
      *   How to draw the line? It depends on the "moment of consciousness."
      *   If revision happens *before* the content becomes phenomenally available -> Stalinesque.
      *   If revision happens *after* the content is phenomenally available (but before report) -> Orwellian.
      *   *Problem:* Dennett argues there is no definitive "finish line" for consciousness, so the distinction collapses.

  5.  **Address Predictive Processing:**
