      *   Hard Part (No standard 4 levers)? The verdict rests on "Epistemic Residue," not deniability or effort.
      *   JSON fields? All present.

  8.  **Constructing the JSON:**
      *   Ensure no trailing commas.
      *   Escape quotes.
      *   Keep strings concise.

  9.  **Word Count Check:**
      *   Prose section needs to be tight.
      *   JSON counts towards words? Usually yes. I need to be very concise.

  10. **Final Polish:**
      *   Make sure the "Working Feature" is clearly distinct from "Deniability". Deniability is about *avoiding blame*. This is about *hindering correction*.
      *   Make sure the "Transplant" test makes sense.

  *(Self-Correction during drafting)*: The Transplant test in the prompt asks to move the working feature into the other route. If the feature is "Statement remains true after discovery," I can't move that to Route A (Lie) because a Lie is defined as asserting what one believes false. If discovered, it is false. So the feature *cannot* be transplanted to A by definition. I must explain this reveals the structural advantage of misleading regarding *post-discovery opacity*.
  Actually, I can transpose the *effect*. If I make Route A a lie about a fact that remains ambiguous? No.
  Let's frame the Transplant test as: "If we could make Route A's assertion remain technically true despite being deceptive (e.g. ambiguous wording), would it become worse?" Yes. This shows the feature drives the verdict, not the lie/mislead label.

