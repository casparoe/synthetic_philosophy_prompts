      *   *Working Feature:* "Persistence of Truthful Obscurity."
      *   *Principle:* A speaker wrongs a hearer more when their deception leaves the hearer with true premises that continue to obscure the truth after discovery, compared to false premises that clearly signal error.
      *   *Tests:*
          *   Removal: Make B's statement false too (turn it into a lie). Verdicts should converge (A=B).
          *   Transplant: Make A's statement true but misleading (impossible by definition of A). Instead, make A's statement such that it remains true after discovery? No, A must be a lie. Transplant the "Persistence" feature to A? If A persists (e.g. "I believe it is secure" when you don't), it's still a lie about belief.
