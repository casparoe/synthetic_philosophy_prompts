      *   *Objectors:*
          *   Asymmetry: You've changed the content, not the mode. Reply: The mode (assertion vs implicature) creates the persistence difference structurally.
          *   Skeptic: Both are deception. Reply: Yes, but the *structure* of the deception matters for remediation.

  5.  **Refining Constraints & Word Count:**
      *   Must be under 1000 words.
      *   JSON must be valid.
      *   Check Constraint 5 carefully: Route A must be a lie (assert false), Route B must be misleading (assert true, implicate false).
      *   Check Constraint 2: Same consequences. I need to stipulate the discovery happens simultaneously and the immediate harm is identical, but the *wronging* differs due to the epistemic residue.

  6.  **Writing the Case:**
      *   *Setting:* Software Startup.
      *   *Speaker:* CTO (Alex).
      *   *Hearer:* Investor (Jordan).
      *   *q:* The platform is scalable.
      *   *A:* "The platform is scalable." (False).
      *   *B:* "The platform uses cloud-native architecture." (True, but implies scalability which is false due to a specific bottleneck).
