  *Rejected Levers:*
  1. Deniability (B allows claiming innocence). Rejected: Verdict rests on hearer's epistemic burden, not speaker's accountability.
  2. Effort/Craft (B requires more planning). Rejected: Both are equally spontaneous in this construction.
  3. Conscription (Hearer infers q). Rejected: Verdict rests on post-discovery residue, not the act of inference.
