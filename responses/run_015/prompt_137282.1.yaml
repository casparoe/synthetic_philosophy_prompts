answer: |-
  **Rejected Levers**
  1.  **Deniability:** I considered making B worse because Alex can deny intending to deceive. Rejected: The verdict must rest on the hearer's epistemic position, not the speaker's accountability.
  2.  **Effort/Craft:** I considered making B require more calculation. Rejected: Constraint 2 forbids differences in premeditation; both are spontaneous.
  3.  **Conscription:** I considered making B worse because Jordan infers $q$. Rejected: The wrongness must stem from the *residue* of the deception, not the inferential labor.
  4.  **Professional Norms:** I considered invoking a specific code forbidding lies but not implicatures. Rejected: Constraint 2 forbids independent norm breaches.

  **The Case**
  **Route A (Lie):** CTO Alex tells Investor Jordan, "Our server architecture handles unlimited traffic." Alex knows this is false due to a database bottleneck. Jordan invests. Later, the bottleneck is revealed. Alex's statement is proven false. Jordan knows exactly which claim failed and that Alex asserted a falsehood.

  **Route B (Misleading):** CTO Alex tells Investor Jordan, "Our server architecture is fully distributed." Alex knows this is true (it is distributed) but knows distribution doesn't solve the specific database bottleneck preventing unlimited traffic. Jordan infers "handles unlimited traffic" and invests. Later, the bottleneck is revealed. Alex's statement remains technically true. Jordan knows Alex spoke truly but misleadingly, yet the true statement ("fully distributed") continues to sound robust, obscuring the specific failure mode longer than a falsified claim would.

