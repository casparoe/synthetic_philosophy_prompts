          *   Focus on "Respecting the Voter's Intelligence."
          *   Focus on "The Public Square."
      *   *Caveats/Nuance:* Be careful not to put words in her mouth she didn't say (since she died in 1975). Use her *framework* rather than pretending she predicted AI.
