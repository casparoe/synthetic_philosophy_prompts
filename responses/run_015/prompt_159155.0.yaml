answer: |-
  This is a precise and charitable reconstruction of a stalemate that is indeed familiar. You have correctly identified that the surface-level epistemological arguments are proxies for deeper structural disagreements. Here is the diagnosis, an evaluation of your probe, and a realistic assessment of progress.

  ### 1. Diagnosis: Normative Equivocation and the Modal Disagreement

  Your first hypothesis—that the sides are arguing about different outputs (Investment vs. Belief)—is substantially correct, but it requires sharpening. It is not merely a pragmatic disagreement about resource allocation; it is a **normative equivocation** regarding the function of scientific rationality, compounded by a **metaphysical disagreement about the space of possibilities.**

  **The Normative Equivocation**
  The defenders are operating with a concept of *rational pursuitworthiness*. When they argue from the "search" (no alternatives found) or "track record," they are claiming that, given limited cognitive and material resources, it is rational to continue developing this framework because the opportunity cost of abandoning it is too high. In their view, "confirmation" is a measure of *credence adjustment* in a Bayesian sense, where meta-empirical facts (like the failure of competitors) legitimately update the probability of the theory being true.

  The critics are operating with a concept of *epistemic entitlement*. They argue that "belief" (or assertion of scientific knowledge) requires a specific kind of risk—empirical vulnerability—that is absent here. For them, the "search argument" is not just an argument from ignorance; it is a category error about what constitutes a constraint on nature. To the critic, the fact that no one has found an alternative says more about the sociology of the community than the structure of physical law.

  The word "confirmation" is indeed doing the hiding. The defenders use it to mean *increased rational credence warranting continued investment*. The critics use it to mean *empirical validation warranting assertion as knowledge*. Because both sides use the same vocabulary to describe different normative thresholds, they talk past one another. The defenders hear the critics saying "stop working on this," while the critics hear the defenders saying "you must believe this is true."

  **The Modal Disagreement**
  Beneath the normative equivocation lies a substantive, empirical-looking dispute that is actually metaphysical: **The status of the possibility space.**

  The "Track Record" and "Search" arguments rely on a specific assumption about the space of possible theories. They assume the space is constrained—that there are only a few mathematically consistent ways to solve the problem at hand. If the space of possible theories is small and tightly constrained, the "No Alternatives" argument is strong (if we haven't found another, maybe there isn't one).

  The critics implicitly assume the space of possible theories is vast or undefined. If the space is unbounded, the failure to find an alternative after 50 years is statistically insignificant.

  This is why the dispute feels empirical but resists empirical resolution. It is a disagreement about the *modal structure of theoretical physics*. The defenders believe mathematical consistency acts as a severe filter on physical possibility. The critics believe mathematical consistency is a weak filter compared to empirical contingency. You cannot settle this with data, because any data interpreted through the defenders' modal assumptions supports the defenders, and any data interpreted through the critics' modal assumptions supports the critics.

  **Verdict:** Your "Investment vs. Belief" hypothesis is the stronger diagnosis. The "Base Rate" hypothesis is a symptom of this deeper divide. The base rate is unanswerable not just because of small sample size, but because the two sides disagree on what counts as a "possible theory" in the reference class.

  ### 2. Evaluation of the Audit Thought Experiment

  Your retrospective audit is a **good probe for the surface disagreement but fails to isolate the core mechanism.**

  **Why it works partially:**
  If the audit were conducted, you are correct that the fight would relocate to the coding of the reference class. The critics would argue that past successes (e.g., General Relativity) were not confirmed by "no alternatives" arguments but by empirical novelty, and thus should not be coded as successes for *this* method. The defenders would argue that the *process* of elimination was key in those historical cases. The audit would reveal that there is no neutral language to describe the history of science that both sides accept. This confirms that the disagreement is not about the *data* of history, but about the *description* of history.

  **Why it fails to resolve the dispute:**
  Even if the audit produced a miraculous consensus on the coding (e.g., "Programs using these arguments succeeded 60% of the time"), the normative gap would remain.
  *   **The Critic's Reply:** "A 60% success rate based on non-empirical criteria is indistinguishable from guesswork. Science requires error control, not just hit rates."
  *   **The Defender's Reply:** "A 60% hit rate under conditions of empirical underdetermination is the best we can do, and rational agents should maximize expected utility."

  The audit isolates the *reliability* of the method, but it does not settle the *legitimacy* of the method. The critic denies the legitimacy of the method regardless of its reliability, because it bypasses empirical risk.

  **A Better Device: The Counterfactual Rationality Test**
  To isolate the normative core, you need a device that separates *truth* from *rationality*.
  Propose this question to both sides: *"Suppose we discover tomorrow that the framework is empirically false. Was it nevertheless rational, given the information available 20 years ago, to have invested heavily in it based on these three arguments?"*

  *   If the **Defenders** say "Yes," they concede that the arguments justify *investment*, not *truth*. This validates your first hypothesis.
  *   If the **Defenders** say "No," they concede that their arguments were truth-tracking claims that have now been falsified, undermining the "Track Record" argument for future use.
  *   If the **Critics** say "Yes," they concede that the methodology is sound for resource allocation, even if it doesn't yield knowledge.
  *   If the **Critics** say "No," they reveal that their objection is purely deontological (about the rules of science) rather than consequentialist (about the outcomes of science).

  This device forces the sides to reveal whether they are arguing about *consequences* (did it work?) or *principles* (is it allowed?). My diagnosis is that the stalemate persists because the Defenders want to argue consequences while the Critics want to argue principles.

  ### 3. What Counts as Progress?

  Given the diagnosis that this is a normative equivocation rooted in a modal disagreement, you should be honest: **No theoretical progress is expected.** The debate will not be settled; it will be abandoned.

  **Why Settlement is Impossible:**
  To settle the debate, one side must adopt the other's normative framework.
  *   For the Critics to concede, they must accept that non-empirical virtues can constitute evidence. This requires abandoning a falsificationist or error-statistical philosophy of science.
  *   For the Defenders to concede, they must accept that their framework is not "confirmed" in the traditional sense, but merely "pursued." This requires relinquishing the claim that they are doing normal science rather than speculative metaphysics.

  Neither side has an incentive to make these moves. The Defenders need the label "confirmation" to secure funding and status. The Critics need the label "pseudoscience" (or "non-science") to protect the boundary of the discipline.

  **What Progress Looks Like:**
  Progress will not come from a verdict, but from **decoupling**.

  1.  **Terminological Distinction:** Progress occurs if the literature adopts a distinction like Laudan's between *context of pursuit* and *context of acceptance*. If the Defenders reframe their arguments as "Justifications for Pursuit" and the Critics reframe their objections as "Warnings against Acceptance," the heat dissipates. They can agree that it is rational to *study* the framework without agreeing that it is rational to *believe* it.
  2.  **Formalizing the Priors:** A technical progress would be a Bayesian model that explicitly quantifies how much weight the "No Alternatives" argument adds to the prior. If the Defenders can show, formally, that the argument only shifts credence by a small factor, the Critics may lose interest. If they claim it shifts credence to near-1, the Critics will remain mobilized.
  3.  **The "Mathematical Utility" Pivot:** Often, these debates end not because the physics is solved, but because the mathematics becomes useful elsewhere (e.g., dualities finding applications in condensed matter). If the framework generates instrumental value independent of its truth claims, the sociological pressure eases. The "sociology" argument from the Critics loses traction if the tools are undeniably useful, even if the ontology is unproven.

  **The Honest Prognosis:**
  The most likely outcome is **generational attrition**. The dispute is sustained by a specific cohort of senior researchers on both sides who have built careers around the defense or critique of the framework. As that cohort retires, the younger generation will likely treat the framework as a tool rather than a truth-claim. They will use the mathematics without engaging in the metaphysical defense of it.

  The debate will not end with a resolution. It will end with a change of subject. The "diagnosis" you are looking for is that this is a **boundary dispute masquerading as an epistemological one**. The epistemology is the weapon, not the wound. Therefore, no epistemological solution will cure it. Progress is measured only by the extent to which the participants stop trying to define "science" and start trying to solve problems, or admit they are doing something other than standard empirical science.

  If you are writing into this literature, the most valuable contribution you could make is not to solve the dispute, but to formalize the **decision-theoretic conditions** under which the "Search Argument" becomes rational. Show exactly what the cost of abandonment must be, relative to the probability of the theory space being constrained, for the Defenders' position to hold. This moves the debate from "Is this science?" to "Under what constraints is this a rational bet?" That is a question that can be answered, even if the answer is "It depends on your risk tolerance."
