          *   *Verdict:* Doesn't fully save the theorem's normative bite.

      *   **Option C: Reject (3) / Admit Cardinality/Intensity for Individuals.**
          *   *The Argument:* A single mind *can* compare intensities across criteria (inter-criteria utility). Society *cannot* (or should not) compare intensities across persons (inter-personal utility).
          *   *Cost:* It admits Arrow's theorem *is* distinctive to the social case because the social case lacks the informational richness of the individual mind.
          *   *Why it looked innocuous:* It's tempting to treat criteria as "little voters" inside the head (the "committee of the mind" metaphor). But the mind has a common currency (utility) that separate voters do not share.

