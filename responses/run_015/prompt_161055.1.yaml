  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say individuals *always* use cardinal utility. But they *can*. Arrow's framework *forbids* it by design (ordinal inputs). The friend forces the individual into the Arrow framework. The escape is to say the individual isn't bound by that framework.
      *   *Refinement on IIA:* If I give up IIA in social choice, I allow context dependence. But the real difference is that the individual *doesn't need* to give up IIA if they use cardinal utility (they can construct a social welfare function à la Harsanyi). Wait, Arrow's theorem assumes ordinal inputs. If the individual uses cardinal inputs, Arrow's theorem doesn't apply to them. So the friend's error is applying Arrow's *inputs* constraint to the individual.
      *   *Focus:* The friend assumes the individual is *also* restricted to ordinal rankings per criterion. But a rational agent can weigh criteria. "Cost is slightly more important than Speed." This is cardinal information relative to criteria.
      *   *Conclusion:* The premise to reject is the assumption that the individual decision problem is structurally identical to the social choice problem *under Arrow's informational constraints*.

  7.  **Final Polish (British English Check):**
