answer: |-
  **Joint Statement on Higher-Order Theory**

  **I. Agreed Commitments**
  1.  **Target:** We explain *state consciousness* (what it is like to see red), not *creature consciousness* (being awake or alive).
  2.  **Insufficiency of First-Order:** A mental state representing the world is not conscious just in virtue of that content. Unconscious perception proves this.
  3.  **Higher-Order Necessity:** A state becomes conscious only when accompanied by a higher-order awareness of that state.
  4.  **Blindsight:** Patients who guess correctly without visual experience lack this higher-order layer.
  5.  **The Rock Objection:** Rocks lack consciousness because they lack mental states entirely, not merely because they lack higher-order states.

  **II. Residual Disagreements**

  | Feature | Thought Wing (HOT) | Perception Wing (HOP) |
  | :--- | :--- | :--- |
  | **Nature** | Conceptual, thought-like judgment. | Non-conceptual, quasi-perceptual scan. |
  | **Timing** | Often dispositional (can be unconscious). | Usually occurrent (active scanning). |
  | **Accuracy** | Can misrepresent (illusion of experience). | Generally reliable, but can malfunction. |
  | **Consciousness** | The HOT itself is unconscious. | The Scan itself is unconscious. |

  **III. The Cruxes**

  **1. The Conceptual Crux (Visual Prosthesis)**
  *Case:* A classifier reads visual-cortex activity and feeds the subject a signal meaning "vertical edge," with no words or concepts in the loop.
  *   **Thought Wing Prediction:** **No Consciousness.** Without concepts to categorize the state, no higher-order thought occurs. The subject processes data but feels nothing.
  *   **Perception Wing Prediction:** **Consciousness.** The inner scanner detects the signal regardless of concepts. The subject has a raw feel of the edge.

  **2. The Conceptual Crux (Infant/Aphasia)**
  *Case:* A pre-verbal infant or global aphasia patient reliably signals which of two shapes she saw, but lacks words for them.
  *   **Thought Wing Prediction:** **Minimal/No Consciousness.** Lacking the concept "shape" or "square," she cannot think about her state. She acts blindly or with primitive affect only.
  *   **Perception Wing Prediction:** **Full Consciousness.** The inner sense operates independently of language. She sees the shape just as we do.

  **3. The Regress Crux (Prefrontal Damage)**
  *Case:* A patient with prefrontal damage discriminates stimuli above chance but never reports seeing anything.
  *   **Thought Wing Prediction:** **Unconscious.** The damage destroys the capacity for higher-order thought. The first-order state remains but is "dark." This confirms the HOT itself need not be conscious, avoiding infinite regress.
  *   **Perception Wing Prediction:** **Unconscious.** The damage destroys the scanning mechanism. The state is unscanned. This confirms the scanner itself need not be conscious, avoiding infinite regress.

  **IV. Verbal Disputes**
  Much of our disagreement risks being merely verbal. If the Thought Wing defines "concept" broadly enough to include non-linguistic categories, and the Perception Wing admits the scanner requires some discrimination logic, our models converge. However, the infant case remains the hard test: if non-linguistic creatures feel pain and see colors, the Perception Wing is likely right. If consciousness requires a sophisticated cognitive architecture only adults possess, the Thought Wing wins. We agree to let the empirical data on infant neurology settle this.
