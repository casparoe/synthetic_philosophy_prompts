prompt: |-
  Hey — journalist here, I cover science and ideas, and for an upcoming column I'm trying a stunt: instead of another he-said/she-said, I want to publish the document an adversarial collaboration between the two wings of higher-order theory would actually produce.

  You're a senior philosopher of mind who's spent twenty years on higher-order theories and knows both camps from the inside. Think carefully before you write: spend a few minutes brainstorming what each side is definately committed to, and where they've been talking past each other, and only then draft it.

  What I need:

  1. A short numbered list of claims both camps can sign — that what's being explained is state consciousness rather than creature consciousness, that a first-order state isn't conscious just in virtue of its own content, that something higher-order has to be in the picture, plus whatever both sides concede about blindsight, unconscious perception, and that rock objection everyone rolls out.
  2. A table of the residual disagreements, each in wording its own side would accept: is the higher-order state thought-like and concept-deploying (the Rosenthal-ish wing), or a non-conceptual quasi-perceptual inner sense (the Lycan-ish wing)? Is it occurent or merely dispositional? Does it have to be accurate, or can it misrepresent its target? Does it itself have to be conscious?
  3. The cruxes, with a case both would agree bears on it and each side's prediction written down in advance. For the conceptual-vs-non-conceptual crux, use two cases I made up: (a) a visual prosthesis — a classifier trained on visual-cortex activity that feeds the subject a signal meaning something like "vertical edge there," with no words and no concepts anywhere in the loop; (b) an eye-tracking setup with a pre-verbal infant, or a patient with global aphasia, who reliably signals which of two nearly identical shapes she just saw though she has no words for them. For the regress crux, use a patient with prefontal damage who discriminates the stimuli above chance but never reports seeing anything.

  Say plainly if any of the disagreement turns out to be merely verbal. No citations or bibliography — all from your own head. Keep it under 800 words and pitched so a reader with no philosophy background can follow whats at stake.
