answer: |-
  Dear Colleagues,

  As we prepare to adjudicate between the competing models for our watershed management strategy, I wish to propose a decision procedure grounded in the philosophical shift I have recently come to endorse, specifically the neopragmatism of Richard Rorty. This approach requires us to abandon the habit of asking which model is truly accurate in mirroring the independent reality of the ecosystem and instead ask which model serves as a more effective tool for our specific purposes. To make this actionable for our board, I have distilled this philosophy into a fixed sequence of inquiries that we must undertake in order. The first question we must ask is whether the specific practical problem we intend to solve has been defined without reference to underlying ontological truth. A sufficient answer to this question is a written statement of purpose that describes a desired outcome, such as preventing fishery collapse within five years, rather than a description of a state of affairs, such as identifying the true causal mechanisms of nutrient cycling. If the purpose is defined in terms of truth rather than utility, the procedure cannot begin until it is rewritten. The second question is whether one model demonstrates superior predictive efficacy regarding that specific purpose within the relevant timeframe. A sufficient answer here requires quantitative validation data showing that Model A predicts the target outcome with statistically significant greater accuracy or lead time than Model B. If one model clearly outperforms the other on this metric, the procedure yields a definite recommendation at this precise point to adopt the superior predictor, regardless of its theoretical elegance. If the predictive efficacy is equivalent within a margin of error of five percent, we proceed to the third question, which concerns resource expenditure. A sufficient answer to this question is a budgetary and temporal audit confirming that one model requires significantly less funding, labor, or time to implement than the other. If one model is cheaper and faster while maintaining equivalent predictive power, the procedure recommends adopting the more efficient model. If both cost and efficacy are effectively tied, we must proceed to the fourth and final question, which asks whose interests are served by the vocabulary each model employs. A sufficient answer here is a stakeholder impact assessment detailing which communities gain decision-making power or economic security under one framework versus the other. It is at this precise point, after the fourth question, that the procedure must stop and hand the matter to human judgment. If the dispute remains unresolved after assessing utility, cost, and efficacy, the remaining disagreement is not about fact or coping capacity but about values and vocabulary choice, which no algorithm can resolve without arbitrary imposition.

  To demonstrate the utility and the friction of this procedure, let us apply it to the two concrete proposals currently before us, namely the reductionist gene-expression model and the emergent systems-biology framework for predicting ecosystem collapse in the specific watershed under our care. The reductionist model proposes that by tracking the expression levels of key stress genes in indicator species, we can mirror the physiological state of the watershed and thereby predict collapse. The systems model proposes that by monitoring network topology and energy flux across trophic levels, we can detect tipping points without reference to molecular mechanisms. We begin with the first question regarding the purpose. Our stated goal is to prevent economic loss from fishery collapse within a five-year window. This is a coping goal, not a truth goal, so both models pass the first gate. We move to the second question regarding predictive efficacy. Historical data from pilot studies in similar watersheds indicates that the gene-expression model offers high precision in controlled laboratory settings but fails to predict collapse in the field more than six months in advance due to unmodeled environmental variables. The systems model, while mechanistically vague, has demonstrated a twelve-month lead time on predicting tipping points in complex environments with an eighty-five percent success rate compared to the gene model's sixty percent. According to the procedure, this is the precise point where a definite recommendation is yielded. We must endorse the emergent systems-biology framework because it copes better with the problem we actually have, which is early warning, not mechanistic explanation.

  I anticipate that this recommendation will feel intuitively wrong to many of our classically trained scientists on the board. Those of us with backgrounds in molecular biology are conditioned to believe that explanation flows from the bottom up, that understanding the genes is understanding the truth of the organism, and that a model which ignores the molecular substrate is somehow less real or less scientific. The procedure forces us to accept a framework that feels like black-box magic because it prioritizes the utility of the prediction over the satisfaction of the explanation. It asks us to treat the systems model not as a mirror of nature but as a reliable instrument, much like a barometer that predicts storms without explaining meteorology. However, we must be explicit about where this procedure misfires or risks collapsing into arbitrary preference. The risk arises if we reach the fourth question regarding values. Suppose the systems model requires data collection methods that infringe on indigenous land rights, whereas the gene model relies on non-invasive water sampling. If the predictive efficacy and cost are tied, the procedure hands the decision to us, but it offers no metric to weigh economic efficiency against social justice. At that juncture, if we choose the systems model solely because it aligns with our scientific preferences rather than stakeholder welfare, we have collapsed into arbitrary preference disguised as pragmatism. The procedure constrains us only as long as there is empirical disagreement about utility; once the dispute becomes about which vocabulary aligns with our moral identity, the procedure recuses itself.

  Finally, I must take a definite position on whether this neopragmatist approach can genuinely constrain institutional scientific decision-making without dissolving into relativism. I argue that it can and does provide genuine constraint, precisely because it shifts the ground of justification from inaccessible reality to public consequence. Relativism suggests that any belief is as good as any other, but pragmatism asserts that beliefs are constrained by their ability to help us achieve shared goals. The world pushes back against our vocabularies; a model that fails to predict the collapse of the watershed will be discarded not because it is false in a metaphysical sense, but because it fails to cope. This resistance from reality provides the objective constraint that prevents sliding into arbitrary whim. Furthermore, the requirement for public justification within a community of inquiry ensures that utility is not defined by individual caprice but by social solidarity and agreed-upon ends. Therefore, Rorty's neopragmatism does not liberate us from responsibility but rather tightens the binds of accountability, forcing us to justify our choices based on their tangible effects on human and ecological flourishing rather than hiding behind the shield of representing the truth. We should adopt this procedure not because it reveals the world as it is, but because it helps us become the kind of institution that solves problems effectively.

  Sincerely,

  Your Colleague on the Advisory Board
