answer: |-
  You are encountering the friction between a *metaphysical* definition of joint action (what is happening in the minds and behaviors of the participants) and a *normative* definition (who can legitimately receive a recommendation). Your current "Shared Intention" principle is metaphysical; it fails because incident review is normative. You do not write reports to describe the universe; you write them to assign accountability and prevent recurrence.

  To unify your verdicts, you need a principle that prioritizes **Addressability**. A "we" exists for your purposes only when there is a stable locus of accountability that the participants recognize and that can actually bear the weight of a recommendation.

  Here is the principle that tracks your intuitions, resolves your conflicts, and identifies the necessary sacrifice.

  ### The Principle of Addressable Agency

  **A and B act as a "we" if and only if:**

  1.  **Interdependence:** The outcome causally depends on contributions from both A and B. *(Forced by Case 2: without this, parallel acts are joint.)*
  2.  **Normative Recognition:** A and B recognize each other (or the structure mediating them) as partners bound by shared norms or goals, not merely as causal forces. *(Forced by Case 4: coercion breaks the "we"; and Case 3: shamming breaks recognition.)*
  3.  **Veridical Capacity:** The recognized partner must actually possess the capacity to bear responsibility (i.e., be an agent or an institution), not merely a process or object. *(Forced by Case 7: false belief about agency breaks the "we"; and Case 8: machines lack capacity.)*
  4.  **Institutional Continuity:** If individual mental states are absent or fragmented, a formal structure (charter, protocol, voting rule) can substitute as the "partner," provided it persists and is addressable. *(Forced by Case 5: committee acts without shared intent; and Case 9: lab persists across personnel.)*

  ---

  ### Application to Your Cases

  *   **1 (Tree):** Passes all. Interdependent, recognized, veridical agents. **Verdict: Joint.**
  *   **2 (Concrete):** Fails *Normative Recognition*. They do not know of each other. **Verdict: Not Joint.**
  *   **3 (Shammer):** Fails *Veridical Capacity* (regarding the shammer's contribution) and *Normative Recognition* (deception). **Verdict: Not Joint.**
  *   **4 (Driver):** Fails *Normative Recognition*. Coercion negates the voluntary commitment required for partnership. **Verdict: Not Joint.**
  *   **5 (Committee):** Fails *Shared Intention* (metaphysically), but Passes *Institutional Continuity*. The "Committee" is the addressable entity, not the members. **Verdict: Joint.**
  *   **6 (Engineers + Spec):** Passes all. The spec mediates, but both ends are addressable agents. **Verdict: Joint.**
  *   **7 (Engineers + False Belief):** Fails *Veridical Capacity*. Engineer B is not an agent; B is a script. You cannot address a recommendation to a script. **Verdict: Not Joint.**
  *   **8 (Pilot + AI):** Fails *Veridical Capacity*. Even adaptive AI is a tool, not an agent. It cannot receive a recommendation. **Verdict: Not Joint.** (See below for the sacrifice).
  *   **9 (Lab):** Passes *Institutional Continuity*. The protocol strengthens the *Institutional* clause, which explains why you feel shakier without it. **Verdict: Joint.**

  ---

  ### Resolution of the 6/7 Pair

  Your intuition on Case 7 is correct, and your previous principle failed because it focused on *intent* rather than *truth*.

  In Case 6, Engineer A intends to coordinate with Engineer B, and Engineer B *exists* as a responsible agent. If the wall fails, you can recommend changes to B.
  In Case 7, Engineer A intends to coordinate with Engineer B, but B *does not exist* as an agent. If the wall fails, a recommendation to B is nonsense. A recommendation to A ("Verify your counterpart") is valid, but that is an individual recommendation, not a joint one.

  The distinction is not behavioral (their actions are identical); it is **normative**. Joint action requires a *truthful* coupling of accountability. Case 7 is a "phantom joint action." It looks like a *we*, but it collapses under the weight of a recommendation.

  ---

  ### Verdict on Case 8 (Pilot + AI)

  You must surrender the intuition that the adaptive AI case might be joint.

  **Reason:** In the simple autopilot case, the machine is a crowbar. In the adaptive case, the machine is a *smart* crowbar. It may simulate adjustment and objection, but it lacks **Veridical Capacity**. You cannot write a finding addressed to the AI ("The AI failed to object appropriately"). You must write to the *designers* or the *pilot*.

  If you classify this as a "we," you obscure the locus of accountability. Is the AI to blame? No. Is the Pilot to blame? Maybe, for deferring. Is the Manufacturer to blame? Maybe, for training. Calling it a "we" (Pilot + AI) creates a fictional entity that absorbs blame belonging to the Manufacturer or the Pilot. For incident review, clarity trumps nuance. **Treat it as a tool.**

  ---

  ### New Cases for Application

  **Case 10: The Mid-Race Substitution**
  *A four-person rowing crew is racing. In the second minute, the stroke seat (Engineer A) suffers a cramp and silently slips underwater. A reserve swimmer (Engineer C), who was not introduced to the crew, grabs the oar and rows in perfect sync. The other two rowers notice the rhythm is maintained but do not see the swap. They win.*
  *   **Application:** Fails *Normative Recognition* and *Veridical Capacity* (regarding the group's knowledge). The crew did not recognize C as a partner.
  *   **Verdict:** Not a joint action by the *crew*. It is a joint action by A+C (if C knew), but for the incident report, the "Crew" as an institution failed to maintain integrity. A finding addressed to "The Crew" is valid only because of *Institutional Continuity* (the team entity persists), not because the individuals acted jointly in that moment.

  **Case 11: The Shadow Committee**
  *A board of directors votes on a safety protocol. Unbeknownst to them, a "shadow board" of senior managers has pre-vetted the options and removed any risky choices before they reached the floor. The directors vote 11-0, believing they are exercising judgment.*
  *   **Application:** Fails *Veridical Capacity* and *Normative Recognition*. The directors believe they are agents; they are actually rubber stamps. The real agency lies with the shadow board.
  *   **Verdict:** Not a joint action by the *directors*. A finding addressed to "The Board" is misleading. The finding must address the *Governance Structure* that allowed the shadow board to exist.

  ---

  ### The Sacrifice and The Limit

  **Which verdict must you surrender?**
  You must surrender the **ambivalence on Case 8**. Your principle cannot accommodate the intuition that a learned planner might be part of a "we." To maintain a unified account of *accountability*, the line between Agent and Tool must be rigid. If you allow AI into the "we," you break the *Veridical Capacity* clause, and suddenly Case 7 (the script) becomes arguable, which destroys your ability to write coherent recommendations.

  **Where the principle stops:**
  There is a point where "jointness" is a **useful fiction** for safety, even if it fails the *Addressable Agency* test.
  *   *Example:* If a human works with a highly unpredictable AI, treating them as a "team" in training materials might reduce accidents, even if the AI isn't legally an agent.
  *   *Guidance:* In your **narrative descriptions**, you may use "team" language to describe the *functional coupling* (Case 8). But in your **findings and recommendations**, you must revert to *Addressable Agency*. Never write "The Pilot-AI team failed." Write "The Pilot failed to monitor the AI," or "The System Design failed to support the Pilot."

  Your gut verdicts are tracking **Accountability**, not **Agency**. Stick to that. It is the only metric that matters for your board.
