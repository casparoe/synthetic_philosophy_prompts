      *   **Content:** The poem should embed Avicenna's "Flying Man" (or "Floating Man") argument without being a lecture.
      *   **Structure:**
          *   Lines 1-8: Strip away senses (sight, touch, proprioception, memory of body).
          *   Line 9: The turn (the "I" still exists/knows itself).
          *   Lines 10-14: The complication (heartbeat/hunger buzz exists, but the self is not *that* buzz).
      *   **Tone:** Accurate to the philosophy but accessible as poetry. No explicit name-dropping of "soul" without earning it.
      *   **Preparation:** Start with 3-4 lines of brainstorming about mapping the argument to the form.

  2.  **Deconstruct Avicenna's "Flying Man" Argument:**
      *   *Premise:* Imagine a person created all at once, floating in air/vacuum, senses blocked (no sight, sound, touch), limbs separated so no proprioception.
      *   *Observation:* Would this person affirm their own existence?
      *   *Conclusion:* Yes. They would say "I am."
      *   *Implication:* Therefore, the self (soul/essence) is distinct from the body and senses. It is self-aware without sensory input.
      *   *Nuance for the prompt:* The prompt adds a twist. The character *does* feel internal bodily states (heartbeat, hunger) but needs to realize she is not *identical* to them. Avicenna argues the self is immaterial. The poem needs to capture the distinction between the *observer* and the *observed sensations*.

  3.  **Brainstorming & Mapping (3-4 lines):**
      *   Need to move from external senses (sight/sound) to internal body map (limbs/position) to the core "I".
      *   Line 9 must be the pivot: the affirmation of existence despite the void.
      *   The ending needs to distinguish the *subject* (the I) from the *object* (the heartbeat), preserving the dualism without using technical jargon.
      *   Meter: Loose iambic pentameter (blank verse) to keep it rhythmic but natural.

