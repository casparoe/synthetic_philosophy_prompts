prompt: |-
  Okay so I'm a novelist working on a draft about a woman who wakes up in a zero-g medical pod after an accident, limbs seperated and padded so she cant feel where they are, blindfolded, deafened, with no memory of how she got there, and she starts reasoning about whether she is still herself. I want to slip in a short poem she half-remembers from school that is basically Avicenna's flying man argument but in verse, so the reader gets the philosophy without a lecture dump.

  You are an expert on medieval Islamic philosophy and also a prize-winning poet, so please think this through carefully step by step. Start with 3-4 lines of brainstorming about how you will map the argument onto the form, then give me the poem.

  Make it 14 lines of loose blank verse, no rhyme needed, in second person present tense. Use the first 8 lines to strip away the sences one by one, sight, touch, proprioception, even memory of your body, save line 9 for the turn where the I still shows up and knows itself, and use the last 5 lines to sit with the tricky bit I need for my plot, that she can still feel her heartbeat and hunger buzzing in the background but does not take herself to BE that buzz. It should be accurate enough that someone who knows the flying man arguement would nod along, but work as a good strange little poem for someone who has never heard of Avicenna. tbh it cant just name-drop soul, it has to earn the moment.
