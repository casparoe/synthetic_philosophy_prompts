answer: |-
  ### The positions in concrete detail

  Formalists propose quantifying side effects via the Kolmogorov complexity of the divergence between the actual world trajectory and a counterfactual where the agent remains inactive, explicitly excluding reward-specified variables. They assert baseline selection and variable partitioning are specifically objective causal tasks, independent of human values. Value-dependence theorists counter that constructing this measure requires prior normative judgments. Deciding which variables matter (e.g., vase position vs. thermal noise), what constitutes the "inaction" baseline amidst natural entropy, and what counts as "unexpected" divergence inevitably encodes human preferences about which states are worth preserving. Both agree on the goal (avoid unintended consequences) and formal vocabulary, but disagree on whether the metric itself can be value-neutral.

  ### Diagnosis of the stall

  This is a substantive disagreement about the ontology of causality masquerading as a technical dispute over formalization standards. The Formalists operate under the intuition that causal structure is observer-independent; they believe a "natural" state-space exists where variables like "vase integrity" are distinct from "air molecule positions" without referencing human interests. Their standard of evidence is mathematical consistency: if the divergence measure is well-defined, it is valid. The Value-Dependence theorists hold the bedrock intuition that ontology is pragmatic; carving the world into variables is always relative to an agent's interests. Their standard of validity is semantic grounding: a formalism that cannot distinguish a broken vase from shuffled air without external input is semantically empty. Consequently, they talk past each other. Formalists see the objection as demanding impossible value specification upfront; Value theorists see the proposal as smuggling in unacknowledged values via variable selection. It is not merely verbal, as both agree on the examples, but neither accepts the other's precondition for what counts as a "fact" about the world structure. The Formalists seek a value-agnostic safety guarantee, while Value theorists argue safety is inherently value-laden.

  ### The hidden structure

  The hidden engine of this impasse is the observer-relativity of counterfactual baselines and the presuppositions of counterfactual reasoning. The Formalists assume the "inaction" trajectory is a physical fact—simply removing the agent from the causal graph. However, defining the baseline trajectory requires distinguishing the agent from the environment and determining the environment's "natural" evolution absent intervention. In a thermodynamic universe, "inaction" still entails entropy increase, ecological succession, and other humans acting. Selecting which of these background changes count as part of the baseline versus "side effects" requires a normative distinction between "normal history" and "interference." Furthermore, action individuation is unresolved: is moving a vase one action or a trillion particle movements? The Formalists assume a privileged granularity of action exists; the Value theorists know granularity is chosen based on relevance. Thus, the divergence measure cannot be computed without first solving the frame problem, which is itself value-laden. This reveals the core conflict is not about computation, but about metaphysical presuppositions.

  ### Prospects for progress

  Progress requires reframing the task from "measuring divergence" to "preserving optionality." A theorem about baseline invariance is impossible because baselines are not invariant. Instead, researchers should adopt a relational definition of impact: side effects are changes that reduce the future attainable utility for human preferences, even if those preferences are uncertain. This shifts the burden from defining a value-neutral baseline to defining a value-agnostic *capacity* measure (like empowerment). Alternatively, the field must accept that "side effects" is an ill-posed question without at least a minimal prior over human values. Progress looks like abandoning the quest for a purely structural impact penalty and integrating impact avoidance into the value learning process itself, acknowledging that safety is normative all the way down. The impasse dissolves only when we stop asking for value-free impact and start asking for value-robust preservation.
