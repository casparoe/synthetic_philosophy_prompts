answer: |-
  Your refinement is a robust engineering heuristic translated into governance. It improves on the traditionalist reading of Chesterton's Fence by replacing reverence with risk management. However, by making the rule consequentialist and quantitative, you have exposed it to empirical falsification in ways the traditionalist view is not. Below are the defeaters ranked from fatal to awkward, addressing your specific queries on expected utility, insulation, and case applications.

  ### 1. Fatal: The Political Economy of Survival (Premise 3 Failure)
  Your third premise—that survival implies function because vestigial arrangements are removed by earlier reformers—is the strongest link in a codebase but the weakest in a polity. In software, selection pressure is often technical: does it compile, does it scale, does it cost money? In politics, selection pressure is distributive: does it please a voting bloc, does it protect a donor, does it empower a bureaucracy?

  A tax loophole or a regulatory capture mechanism can persist for decades not because it serves a systemic function (like the fence), but because it serves a specific interest group that blocks its removal. Here, survival signals *power*, not *utility*. If Premise 3 is false, the Bayesian update you propose is inverted: the fact that an arrangement survives despite being inexplicable increases the probability that it is a rent-seeking vector, not a structural load-bearing wall. This is a fatal defeater for your application to law and institutions, as it attacks the prior probability of functionality.

  ### 2. Fatal: The Epistemic Circle (Unknowable Variables)
  Your rule requires estimating "expected time-to-detection" and "cost of restoration" to calculate the presumption. However, you explicitly state the system is "nobody fully understands." If you cannot explain the arrangement's causal role, you cannot reliably estimate the latency of its failure or the cost of restoring it.

  In legacy code, you might estimate restoration cost by looking at git history or dependencies. In constitutional law or macroeconomics, these variables are incalculable without running the experiment you are trying to justify avoiding. You are asking for a risk assessment based on data that only exists *after* the risk is taken. This renders the rule operationally inert in the exact domains where you wish to apply it most. It collapses into "don't do it because it's scary," which is the plain Chesterton view you sought to escape.

  ### 3. Major: Distribution and Moral Weight (The Cost Aggregation Error)
  You treat "cost" as a fungible scalar. In engineering, a millisecond of latency is a millisecond of latency, regardless of which user experiences it. In social systems, the distribution of costs matters morally. The people who bear the cost of investigation (taxpayers, engineers) are rarely the people who bear the cost of the harm (marginalized groups, future generations).

  If a fence upholds an inequitable status quo, the "cost of restoration" might be low for the privileged but infinite for the oppressed. Your rule aggregates these into a single number, potentially justifying the preservation of harmful arrangements because the "systemic restoration cost" is high, even if the moral imperative for removal is urgent. A defender of plain Chesterton might accept this (order over justice); a consequentialist cannot. This suggests your rule is not value-neutral but implicitly conservative regarding power dynamics.

  ### 4. Major: Expected-Utility Redundancy and Divergence
  Is this just Expected-Utility Maximization (EUM) with extra steps? Mostly, yes, but with a specific prior on Knightian uncertainty.
  *   **Where they agree:** On the 200ms sleep (Case A). Both say remove it. Low cost, high observability, low risk.
  *   **Where they diverge:** On high-upside gambles. EUM allows for high-risk removal if the potential benefit is massive (e.g., removing a constitutional provision that blocks a vital reform). LWCR forbids it if latency is high and restoration is hard, regardless of the upside.
  *   **The Defeater:** LWCR is strictly *worse* than EUM if you believe innovation requires structural risk-taking. By hardcoding risk aversion into the formula (via the latency/restoration multipliers), you bias the system toward local optima. EUM allows you to say, "The fence might be vital, but the road leads to a cliff, so we jump." LWCR says, "We don't know what the fence does, so we stop." In stagnating systems, LWCR guarantees decay.

  ### 5. Moderate: The "Feature Flag" Illusion
  Your exception clause ("where removal is cheap, observable, and reversible... the presumption drops") is the engine of modern DevOps. It is almost non-existent in law and institutions. You cannot A/B test a tax code on half the population ethically, nor can you "rollback" a war or a divorce law easily.
  By relying on an exception that applies to 90% of your work (code) and 1% of your interest (law), you create a false equivalence. A defender of plain Chesterton would dismiss your exception as changing the subject: "Laws are not feature flags." They are right. If the exception rarely triggers in your target domain, the rule defaults to the conservative presumption anyway, making the refinement cosmetic.

  ### 6. Awkward: Insulation and Falsifiability
  Has the rule qualified itself into unfalsifiability? Yes, slightly. Because "restoration cost" and "latency" are subjective estimates, a defender can always retroactively justify a decision. "We shouldn't have removed that tenure rule; the restoration cost was higher than we thought."
  Is this a defect? For a burden-of-proof rule, some insulation is necessary (like a prior). However, if the variables cannot be measured independently of the outcome, the rule becomes a post-hoc rationalization tool rather than a decision procedure. It risks becoming a "just-so" story generator for whatever status quo the user prefers.

  ### Case Study Applications
  *   **(a) 200ms sleep:** LWCR says **Remove**. (Low latency, low restoration). *Verdict: Correct.*
  *   **(b) Repealed tax exemption:** LWCR says **Keep**. (High political restoration cost, unknown economic latency). EUM might say **Cut** (Revenue need > Risk). *Verdict: LWCR favors stagnation here.*
  *   **(c) Academic tenure:** LWCR says **Keep**. (Latency on education quality is decades; restoration of faculty trust is impossible). *Verdict: Plausible, but ignores the cost of retaining bad professors.*
  *   **(d) Unused constitutional provision:** LWCR says **Keep**. (Restoration is amendment, which is near-impossible; latency of removal is unknown). *Verdict: Problematic. Unused provisions often constrain future action without current benefit. LWCR creates "constitutional clutter."*

  ### Base Rates and Selection
  You asked about base rates of vestigial arrangements. In code, "dead code" is common (perhaps 20-30% of legacy bases). In law, the rate is likely higher because there is no compiler to error out. If the base rate of vestigiality is high, Premise 3 (Selection) fails statistically. Furthermore, as noted in Defeater 1, political selection favors *persistence of power*, not *functional efficiency*. A parasite survives better than a useful organ if it has a defense mechanism. Your model assumes the system selects for health; political economy suggests it selects for stability of power.

  ### Conclusion
  Your rule is an excellent heuristic for *technical* debt in contained systems. It fails when applied to *social* debt in open systems because the selection pressures differ, the variables are unknowable, and the costs are not fungible. It is not merely EUM; it is risk-averse EUM with a prior that favors the status quo.

  \answer{exposure: high; strongest defeater: Political survival signals power, not function.}
