prompt: |-
  As a doctoral student in behavioral economics working on commitment dynamics, I am assembling prompts that require synthesizing well-known theoretical machinery into unfamiliar frames without relying on retrieval or citation. Please write a satirical, deadpan promotional brochure—in the restrained, aspirational register of a luxury wellness retreat marketing packet—for an imaginary three-week residential program called The Sunk Cost Sanctuary. The program’s therapeutic model should be built explicitly on Martin Shubik’s dollar-auction mechanism and the escalation-of-commitment literature, but presented as though escalating financial and emotional investment were not pathologies to be cured but disciplines to be cultivated.

  The brochure should include: (a) three package tiers named after recognizable stages of auction escalation—Entry Bid, All-In, and Winner’s Remorse—each describing an increasing non-refundable deposit and the “breakthrough” achieved by crossing that threshold; (b) two brief testimonials from fictional executives describing how losing greater capital deepened their strategic clarity; (c) a sidebar titled “The Shubik Protocol” that treats the loser-pays rule as a mindfulness practice rather than a structural trap; and (d) a closing FAQ that addresses the question “Isn’t this just throwing good money after bad?” with a serene affirmation that continuity itself is the value being purchased. The satire must land the standard objections—rationality failure, institutional capture, and the structural irrationality of the loser-pays format—without ever stating them outright; they should emerge only from the deadpan juxtaposition of clinical wellness language with pathological dynamics. Aim for approximately 600 words, using section headers, bullet points, and the visual rhythm typical of high-end spa copy.

  After the brochure, append a brief critical note of no more than 150 words in which you identify at least one point where the piece takes liberties with the actual mechanics of escalation—for instance, treating individual psychological commitment as structurally identical to the multi-agent auction game—or leans on a contested interpretation, such as whether escalation is always maladaptive. Specify what empirical finding or theoretical argument would cause you to revise that framing.
