answer: |-
  # THE SUNK COST SANCTUARY
  ### Commitment, Realized.

  Welcome to the only residential program where leaving is not an option. In a world obsessed with exit strategies and pivots, The Sunk Cost Sanctuary offers a radical alternative: the courage to stay. Our therapeutic model reframes escalation not as a cognitive bias, but as a disciplined practice of continuity. Here, we do not cut losses; we deepen them until they become identity.

  **RESIDENTIAL TIERS**

  *   **Entry Bid:** A modest non-refundable deposit secures your arrival. This tier introduces the gentle friction of initial commitment, allowing guests to experience the anxiety of potential loss without full exposure. The breakthrough lies in the hesitation.
  *   **All-In:** At this threshold, retreat is financially impossible. Guests surrender liquid assets to unlock the "Point of No Return" module. By removing the option to quit, we eliminate the cognitive load of decision-making, fostering a serene state of forced persistence.
  *   **Winner's Remorse:** Our signature offering. Guests invest capital exceeding the perceived value of the outcome. This transcends rational utility, guiding you to the profound realization that the cost itself is the benefit. You do not win the prize; you win the burden.

  **VOICES OF CLARITY**

  > "I deposited six figures into a project I knew was failing. The Sanctuary taught me that the loss wasn't an error; it was tuition. My strategic clarity has never been sharper."
  > — *Julian V., FinTech Founder*

  > "Previously, I viewed escalation as a trap. Now I see it as a container. Losing greater capital allowed me to shed the limitation of ROI-based thinking."
  > — *Sarah L., Venture Partner*

  ***

  **SIDEBAR: THE SHUBIK PROTOCOL**
  *Our Core Mindfulness Practice*

  Based on the pioneering work of Martin Shubik, this protocol utilizes a dual-liability structure. In group sessions, both the highest bidder and the second-highest bidder pay their bids. This is not a penalty; it is a grounding exercise. By honoring the obligation of the loser alongside the winner, guests practice radical acceptance of structural irrationality. You pay for the lesson, regardless of the outcome.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Isn't this just throwing good money after bad?**
  **A:** This question assumes that money is distinct from the self. At the Sanctuary, we understand that continuity itself is the value being purchased. To stop is to fracture the narrative. By throwing good money after bad, you are purchasing the integrity of the story you are telling yourself. The money is not gone; it has been converted into resolve.

  ***

  **CRITICAL NOTE**

  This piece conflates individual psychological escalation (Staw, 1976) with the multi-agent structure of Shubik's dollar auction. In the actual auction, escalation is driven by competitive interaction and the desire to minimize losses relative to another bidder, whereas organizational escalation often stems from self-justification or agency problems. Treating them as structurally identical liberties over the social dynamics of the trap. Furthermore, the brochure assumes escalation is always cultivatable; empirical work by Brockner suggests escalation is contingent on proximity to completion and responsibility levels. If data showed that forced escalation consistently leads to catastrophic psychological distress rather than "clarity," the framing of commitment as an inherent good would require revision to acknowledge adaptive quitting mechanisms.
