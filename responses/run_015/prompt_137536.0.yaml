answer: |-
  Here is the specification for a theory of betterness designed for your specific institutional constraints.

  ### The Specification: Desiderata for Institutional Betterness

  This list is not a menu of philosophical preferences. It is a set of engineering constraints for a decision-making mechanism that must issue a binding verdict and survive public scrutiny from those who lose out.

  #### 1. Mandatory Decidability (Non-Negotiable)
  **The Requirement:** For any finite set of available outcomes, the theory must generate a strict ranking or a deterministic selection rule that identifies a unique permissible choice. It cannot return "incomparable," "vague," or "no verdict."
  **The Case:** Your institution cannot abstain. If the theory says Outcome A and Outcome B are incomparable, the institution still has to pick one. If the theory doesn't provide a tie-breaking rule for incomparability, the institution is acting arbitrarily relative to the theory. To give public reasons, the institution must be able to say, "We chose A because the theory mandates A," not "We chose A because the theory was silent and we had to guess."

  #### 2. Justificatory Consistency (Non-Negotiable)
  **The Requirement:** The "better than" relation used to justify the choice must be transitive in the public domain. If the institution argues A is chosen over C because A > B and B > C, it must be the case that A > C.
  **The Case:** This is not merely decision-theoretic prejudice about money pumps. It is a requirement of *public legitimacy*. If an institution admits that C is better than A, but chose A because of a chain of intermediate steps, the losers at A can accurately charge the institution with irrationality or bad faith. Intransitivity allows for cycles (A > B > C > A). If a citizen asks, "Why not A?" and the answer is "Because C > A," but the institution chose C over B and B over A, the reasoning collapses. For a one-shot public decision, the chain of reasoning must hold water under scrutiny. Transitivity is the structural integrity of that chain.

  #### 3. Spectrum Coherence (Contested)
  **The Requirement:** The theory must provide a stable verdict on quality-vs-quantity spectra (e.g., Repugnant Conclusion style cases) without relying on arbitrary cut-offs that shift based on how the options are described.
  **The Case:** You have a spectrum where Step 1 is high quality/low number, and Step 1000 is low quality/high number. Step *n* is intuitively better than *n+1*. If the theory says Step 1 is better than Step 1000 (avoiding the Repugnant Conclusion), it must explain where the trade-off stops without looking like a magic line drawn in the sand. If the theory says Step 1000 is better, it must explain why the loss of quality doesn't matter. A theory that waffles or says "it depends on how you group the steps" fails to give a public reason.

  #### 4. Structural Uniformity (Contested)
  **The Requirement:** The logic governing trade-offs must apply consistently across intrapersonal (one life, different durations/qualities) and interpersonal (different people, different qualities) cases, unless the theory explicitly posits a distinct value source (like fairness) for the latter.
  **The Case:** Is it cheating to be intransitive for populations but transitive for a single life? It is cheating *if* the underlying metric is just "wellbeing." If wellbeing is the good, it shouldn't matter if it's housed in one brain or a billion. However, if the theory values *equality* or *rights*, then interpersonal cases introduce a new variable. The desideratum is not that the verdict must be the same, but that the *difference in verdict* must be traceable to a stated principle (e.g., "we value fairness between people, not within a life"), not a hidden switch in the logic of "better than."

  #### 5. Disjoint Independence (Non-Negotiable)
  **The Requirement:** If a change benefits Group X and harms Group Y, and a second option benefits Group X *more* and harms Group Y *the same amount*, the second option must be ranked higher. The comparison should not depend on the existence of a third, unaffected Group Z.
  **The Case:** This prevents manipulation by adding "decoy" populations. If the institution's verdict flips because we added a group of people who are unaffected by the choice, the losers can claim the decision was gerrymandered. Public reason requires that the justification rests on the people affected, not on irrelevant bystanders.

  #### 6. Semantic Determinacy (Non-Negotiable)
  **The Requirement:** The theory must specify whether "better than" is a vague predicate (sorites-susceptible) or a precise relation. If vague, it must provide a decision rule for the penumbra. If precise, it must identify the primitive.
  **The Case:** You cannot tell the losers, "A is better than B, but it's vague, so we flipped a coin." You must either say "A is definitely better" (which requires a precise cut-off somewhere) or "They are equal in value, so we used a tie-breaker." Blurring the line between vagueness and intransitivity to escape a hard verdict is not permissible for an institution that must act.

  #### 7. Scale Stability / Nested Spectra (Non-Negotiable for this Job)
  **The Requirement:** The verdict between two outcomes must not reverse simply because one outcome is analyzed at a finer grain of resolution than the other. If Outcome A is preferred to Outcome B at a coarse level, decomposing A and B into sub-components (a nested spectrum) should not reveal that B is preferred to A.
  **The Case:** This is the new requirement. Imagine the institution chooses Policy A over Policy B. A critic analyzes Policy A and shows it is actually a bundle of sub-outcomes {A1, A2...} where the transition from A1 to A2 involves a spectrum trade-off that, if applied consistently, would have favored B. If the theory's verdict depends on the "zoom level" of the analysis, the institution's decision is vulnerable to *description dependence*. A loser can argue, "You only chose A because you didn't look close enough." For public reasons to be robust, the moral mathematics must be scale-invariant. If value is fractal, the institution cannot make a stable decision. Therefore, for this specific job, scale-invariance is required.

  #### 8. Operational Primitiveness (Technical)
  **The Requirement:** The theory must treat "at least as good as" (≥) as the primitive relation, not "better than" (>).
  **The Case:** Decision theory requires reflexivity (A ≥ A). "Better than" is irreflexive. To build a choice function that handles ties (indifference) without crashing, the underlying logic must be based on weak ordering. "Better than" should be defined as (A ≥ B) and not (B ≥ A). This prevents errors when outcomes are effectively identical.

  ---

  ### Classification and Impossibility Results

  **Non-Negotiable (Institutional Constraints):**
  1.  Mandatory Decidability
  2.  Justificatory Consistency (Transitivity)
  3.  Disjoint Independence
  4.  Semantic Determinacy
  5.  Scale Stability
  6.  Operational Primitiveness

  **Contested (Theoretical Taste):**
  1.  Spectrum Coherence (Specifically: avoiding the Repugnant Conclusion vs. accepting it)
  2.  Structural Uniformity (Intra vs. Inter personal consistency)

  **The Impossibility Trio:**
  You cannot jointly satisfy the following three requirements. You must drop one.
  1.  **Justificatory Consistency (Transitivity)**
  2.  **Mandatory Decidability (Completeness)**
  3.  **Spectrum Coherence (specifically, avoiding the Repugnant Conclusion while accepting that small losses in quality can be compensated by large gains in quantity)**

  *Why:* If you keep Transitivity and Decidability, you are forced into a total ordering. If you accept that a tiny loss in quality can be compensated by enough quantity (a standard continuity assumption), mathematical induction forces you down the spectrum to the Repugnant Conclusion. To avoid the Repugnant Conclusion, you must either:
  *   Break Transitivity (fail Public Reason).
  *   Break Decidability/Completeness (fail Mandatory Choice).
  *   Introduce a Lexical Threshold (which violates the "small loss compensated by large gain" intuition, effectively saying some quality losses *cannot* be compensated, which some find counter-intuitive or "dogmatic").

  **The Most Exclusionary Requirement:**
  **Justificatory Consistency (Transitivity).**
  This requirement kills the largest family of candidate theories. It eliminates the "Essentially Comparative" views and most intransitive solutions to the spectrum problem. It forces the theory to be a strict ordering, which immediately exposes the theory to the Repugnant Conclusion or Lexical Cliff problems. It is the filter that turns a philosophical exploration into a rigid engineering constraint.

  ---

  ### Evaluation of Candidate Theories

  | Feature | **Transitive Total Order** (e.g., Total Utilitarianism) | **Lexical / Threshold View** (e.g., Lexical Utilitarianism) | **Essentially Comparative / Intransitive** |
  | :--- | :--- | :--- | :--- |
  | **Mandatory Decidability** | **Pass.** Always yields a verdict. | **Pass.** Thresholds determine the winner. | **Fail.** Often yields incomparability or cycles. |
  | **Justificatory Consistency** | **Pass.** Fully transitive. | **Pass.** Transitive within the structure. | **Fail.** Explicitly intransitive; vulnerable to public reason attacks. |
  | **Spectrum Coherence** | **Fail.** Collapses into Repugnant Conclusion. | **Pass.** Avoids Repugnant Conclusion via thresholds. | **Pass.** Handles spectra intuitively step-by-step. |
  | **Scale Stability** | **Pass.** Aggregation is scale-invariant. | **Mixed.** Depends on where the threshold is set relative to the "zoom." | **Fail.** Verdicts often depend on how steps are grouped. |
  | **Public Reason Viability** | **High.** Clear math, but morally costly verdict. | **Medium.** Clear logic, but "magic threshold" is hard to defend. | **Low.** Cannot explain cycles to losers without sounding irrational. |

  ---

  ### Confidence and Doubt

  **Confidence in the List:**
  I am **85% confident** in this specification as a tool for your specific problem. It accurately reflects the tension between *making a choice* and *making a defensible choice* under the specific pressure of spectrum arguments. The classification of requirements separates the institutional needs from the moral preferences correctly.

  **Least Certain Requirement:**
  **Scale Stability (Nested Spectra).**
  I am least sure this belongs as a *non-negotiable* constraint. There is a philosophical argument that value *is* context-sensitive and that demanding scale-invariance imposes a false mathematical structure on moral reality. It is possible that a "zoomed-in" view reveals morally relevant details (like individual suffering) that are washed out in the "coarse" view (aggregate statistics). If so, requiring scale-invariance might force the institution to ignore morally salient details at the micro-level. However, for the specific goal of *preventing description-dependent manipulation* in public reason, I have included it. If you drop this, you open the door to theories that are more morally nuanced but less stable for decision-making.
