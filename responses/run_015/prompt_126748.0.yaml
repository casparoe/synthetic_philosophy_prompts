answer: |-
  There is no single, universally capitalized term for this specific phenomenon, though critics often describe it using phrases like **the aesthetics of absence**, **the poetics of disconnection**, or **modernist alienation**.

  While terms like "alienation" exist, they are often overloaded. In Brechtian theater, "alienation" is a technique to *stop* you from feeling infected, forcing you to think critically. What you are describing is the opposite: you *are* infected, but the payload is the sensation of isolation itself. You are successfully united with the artist and other audience members through a shared experience of disunity.

  Here is how to draw the boundary between this and Tolstoy's concept of insincere (or counterfeit) art, and where the moral line sits.

  ### 1. The Mechanism: Failed Transmission vs. Transmitted Failure
  The crucial distinction lies in whether the "infection" succeeded or failed, not in whether the emotion was positive or negative.

  *   **Tolstoy's Insincere Art (Counterfeit):** The artist *attempts* to transmit a feeling (e.g., love, patriotism, grief) but does not genuinely feel it, or lacks the technical skill to convey it. The result is a broken circuit. The audience feels nothing, or feels manipulated. The "hollowness" here is an accident of craft or character. It is a **failed transmission.**
  *   **The Art of Disconnection:** The artist genuinely feels the void, the awkwardness, or the inability to connect, and successfully constructs a vessel to transmit that specific state. When you sit in that dinner scene and feel the hollowness, the circuit is complete. The artist felt the disconnect, and you now feel the disconnect. This is a **successful transmission of failure.**

  By Tolstoy's own mechanical definition of art (infection), the second category is actually *better* art than the first. It achieves union between artist and audience. The difference is that the union is founded on a shared recognition of isolation.

  ### 2. The Boundary: Sincerity of State
  The edge between the two is defined by **fidelity**, not **valence**.

  If a writer tries to write a heartwarming reunion but the dialogue is clunky and the emotions feel unearned, the audience senses the artifice. That is insincerity. The audience leaves thinking, "The author wanted me to cry, but I didn't."

  If a writer depicts a cold reunion where the characters cannot bridge the gap between them, and the audience leaves thinking, "I feel exactly how impossible that connection was," the art is sincere. The audience senses the author is not lying about the difficulty of human contact. The "hollowness" is the intended artifact, not a byproduct of incompetence.

  ### 3. The Moral Question
  This is where your second question hits the core of Tolstoy's philosophy. Tolstoy would likely classify art that infects you with disconnection as **morally bad art**, but not because it is *insincere*. He would condemn it because his definition of "good art" requires religious or ethical union that brings people closer together.

  *   **Tolstoy's Moral View:** Art that isolates is harmful because it reinforces individual separation rather than brotherhood. Even if the infection is sincere, if the disease is isolation, he would reject it.
  *   **The Modern Aesthetic View:** This category is distinct from "bad art." It is considered a valid, often high-ranking mode of expression because it truthfully reflects the modern condition. The moral value lies in the *truthfulness* of the depiction, not the *warmth* of the outcome.

  So, to answer your boundary question: It is a separate category.
  *   **Insincere Art:** Lies about connection (claims to connect, but doesn't).
  *   **Art of Disconnection:** Tells the truth about disconnection (claims to isolate, and does).

  The "hollowness" you feel is not the absence of art; it is the presence of a specific, negative shared reality. You are not being excluded from the feeling; you are being included in the exclusion.
