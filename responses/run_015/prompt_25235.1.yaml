answer: |-
  The champagne flutes clinked like tiny, expensive bones against one another. Elias stood at the center of the Whitehall Gallery, surrounded by the hum of three hundred people who had paid five hundred dollars a ticket to tell him he was a genius.

  He was seventy-two years old. His hands, spotted with age and stained permanently by cadmium yellow and alizarin crimson, trembled slightly at his sides. He held a glass of sparkling water he had no intention of drinking.

  On the wall behind him hung *The Asymptote*. It was his masterpiece. Thirty years of his life distilled into six feet of canvas. It was a complex, swirling abstraction of greys and violent reds, intended to depict the agony of grief without the sentimentality of a human face.

  The critics loved it. They used words like *subversive*, *dialectical*, and *transcendent*.

  Elias watched a woman in a velvet jacket stand before the painting. She tilted her head, narrowed her eyes, and nodded slowly. She turned to her companion and whispered something. They both smiled.

  Elias felt a cold stone settle in his stomach.

  He had been reading Tolstoy's *What Is Art?* in secret for ten years. It was a shameful addiction, like drinking cheap whiskey while running a winery. Tolstoy's voice was a hammer in his head, relentless and clear: *Art is not a handicraft, it is the transmission of feeling the artist has experienced.*

  *If the audience does not feel what the artist felt, it is not art.*
  *If the feeling is accessible only to the educated, it is counterfeit.*
  *If it divides men rather than uniting them, it is a bad thing.*

  For decades, Elias had told himself he was uniting people. He told himself that the language of high modernism was the universal tongue of the soul. But late at night, in the silence of his studio, Tolstoy's ghost would whisper: *You painted for the gallery. You painted for the critics. You painted for the price tag. Did you weep when you mixed that grey?*

  He hadn't. He had calculated it.

  "Elias," a voice said. It was Julian, his dealer. Julian was flushed with success. "The Times is calling it the defining work of the decade. They're saying you've finally solved the problem of emotion in abstraction."

  Elias looked at Julian. "Did you feel it, Julian?"

  Julian blinked, his smile faltering for a microsecond before resetting. "Feel it? Elias, it's a triumph of composition. The way you handle the negative space—"

  "I didn't ask about the space," Elias said, his voice raspy. "I asked if you felt the grief."

  Julian laughed, a nervous, social sound. "Well. It's potent. Very heavy. But you know, the market is responding to the *hope* in the red tones."

  *Hope.* Elias had painted it as blood.

  He needed to know. He couldn't stay in this room of velvet and wine. He needed the test. Tolstoy insisted that true art must be understandable to a simple, uneducated man. A peasant, Tolstoy said. In 2024, Elias didn't have peasants. He had the working class who were invisible in these rooms.

  He excused himself, muttering about needing air, and slipped away from the dais. He walked past the security guards, past the coat check, and into the loading dock at the rear of the gallery.

  It was cold back here. The air smelled of cardboard, diesel, and coffee. A young man was wrestling with a wooden crate, trying to wedge it onto a dolly. He wore a high-visibility vest over a hoodie. He looked tired.

  Elias stood in the shadows for a moment, watching him. This was the control group. This was the humanity Tolstoy spoke of.

  "Need help?" Elias asked.

  The young man jumped, straightening up. He recognized Elias from the posters. His eyes widened. "Mr. Vane. Wow. I... no, I got it. Just this last crate."

  "What's your name?"

  "Leo."

  *Leo.* Elias felt a shiver of superstitious dread. "Leo, have you been inside?"

  Leo gestured with his chin toward the heavy steel door. "Bit of it. During the setup. Couldn't stay long. Boss was yelling."

  "Did you see the big one? *The Asymptote*?"

  Leo shifted his weight, uncomfortable. "The grey one with the red slash? Yeah. Saw it."

  Elias stepped forward. He felt like a doctor about to deliver a terminal diagnosis, except he was the patient. "What did you think?"

  Leo blinked. He looked at the floor, then at Elias. He sensed a trap. "It's... it's famous, right?"

  "I'm not asking about its fame. I'm asking what it did to you."

  Leo scratched his neck. "Honestly? It looked... loud."

  "Loud?"

  "Yeah. Like someone screaming in a room where they're not supposed to." Leo looked up, meeting Elias's eyes. "Made me think of my ex, actually. When she was leaving. Just noise. Couldn't make out the words, just the noise."

  Elias's heart hammered. *Infection.* A spark. "Yes. Yes, exactly. It hurt?"

  Leo shrugged, turning back to the crate. "I mean, it's just paint, man. It was cool. Looked expensive."

  *It looked expensive.*

  The stone in Elias's stomach turned to ice.

  "But the feeling," Elias pressed, his voice trembling. "Did you feel the grief? Did it make you feel less alone in your grief?"

  Leo paused. He looked at Elias with a mixture of pity and confusion. "I don't know, man. I just stack the crates. It's a nice painting. My mom likes those prints you see at Target? She'd like it."

  He wheeled the dolly away. The wheels squeaked on the concrete.

  Elias stood alone in the loading dock.

  *Target prints.*

  The infection had not occurred. There was no union. Leo felt nothing that Elias had intended. He saw a commodity. He saw decor.

  But the worse realization was waiting for Elias back in the gallery.

  If Leo didn't feel it, why did the three hundred people in the main hall claim they did?

  Elias walked back through the steel door. The warmth hit him, along with the murmur of voices. He looked at the woman in the velvet jacket again. She was still standing before *The Asymptote*. She was taking a photo with her phone, adjusting the angle to catch the light.

  She wasn't feeling grief. She was capturing status.

  They were all pretending. They were speaking a code of appreciation that masked a vacuum of feeling. They nodded because they were educated to nod. They whispered *transcendent* because they were afraid to say *I don't understand*.

  And Elias?

  He remembered painting the red slash. He remembered thinking, *This will look aggressive. The critics like aggression.* He remembered mixing the grey and thinking, *This is the color of melancholy this season.*

  He hadn't bled on the canvas. He had performed a surgery on it. He had dissected emotion without ever being the patient.

  Tolstoy was right. It was counterfeit. It was a beautifully forged bill that could buy nothing in the currency of the human soul.

  "Elias?" Julian found him again. "You okay? You look pale. The curator wants to say a few words."

  Elias looked at his hands. They were the hands of a master craftsman. He had spent fifty years learning how to make the fake look real. He had perfected the technique of the lie.

  "I can't," Elias said.

  "Can't what?"

  "Speak. I can't go up there."

  "Elias, don't be difficult. This is your night."

  "It's not," Elias said. He looked at *The Asymptote*. It hung on the wall, silent and arrogant. It was a monument to his own isolation. It proved that he was alone, that he had never truly connected with a single human being in his life. He had only connected with their wallets and their egos.

  "If I go up there," Elias whispered, "I have to say I'm grateful. And I'm not."

  "Grateful for what?"

  "For the lie."

  Julian's smile vanished. He stepped closer, lowering his voice. "Go to the bathroom. Splash some water. Take five minutes. Then come out and be the artist we need you to be."

  Julian walked away to manage the crowd.

  Elias stood before his masterpiece. He looked for the tear in the canvas, the flaw in the pigment, anything that would prove it was human. There was nothing. It was perfect.

  That was the problem. Tolstoy wrote that perfection of form often masks the absence of content. Real art might be rough, clumsy, even ugly, but it must carry the virus of feeling.

  *The Asymptote* was sterile.

  He thought about the bonfire. Tolstoy gave away his wealth. Tolstoy tried to make boots for peasants. Tolstoy renounced his own novels.

  Elias looked at the painting. If he destroyed it, what would change? It would just become a legend. *The Masterpiece Vane Destroyed.* The value would triple. The lie would grow stronger.

  If he renounced it, they would call it madness. Dementia. The tragic decline of a great mind. They would patronize him.

  There was no exit. He was trapped in the cage of his own reputation. He was a king of a country that didn't exist.

  The curator tapped the microphone. The screech of feedback silenced the room. Three hundred faces turned toward him. Three hundred people waiting for the blessing. Waiting to be told that their appreciation was valid. Waiting for the artist to confirm that they were good people for understanding the art.

  Elias walked toward the podium. His legs felt heavy, as if he were wading through deep water.

  He reached the microphone. He looked out at the sea of expectant faces. He saw the woman in velvet. He saw Julian, nodding encouragingly. He saw the empty space where Leo should have been.

  He opened his mouth. He had the power to tell the truth. To say, *I am a fraud. This is a decoration. I have never made art in my life.*

  He imagined the silence. The shock. The anger. The collapse of the market. The end of his legacy.

  And then what? Would that act be art? Would his confession infect them with his shame?

  Perhaps.

  But Elias looked at his hands again. He realized he loved the applause more than he loved the truth. That was the final, crushing weight. Tolstoy demanded sacrifice. Elias wanted only validation.

  He was not a Tolstoyan. He was not even an artist. He was a manufacturer of cultural objects.

  "Thank you," Elias said into the microphone. His voice was steady. It was the voice of a professional. "Thank you for seeing it. Thank you for understanding."

  The applause began. It was a roar, a wave of sound that washed over him. It felt warm. It felt like love.

  Elias stood in the warmth and shivered. He knew, with absolute certainty, that he had just completed his greatest work of counterfeit art: the performance of the humble, grateful genius.

  They clapped for the lie. And he bowed.
