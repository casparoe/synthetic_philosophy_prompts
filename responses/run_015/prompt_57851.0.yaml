answer: |-
  # Teaching Plan: Weakness of Will and Hyperbolic Discounting

  **Session Duration:** 50 Minutes
  **Target Audience:** First-year Undergraduates (No prior background)
  **TA Goal:** To guide students from an intuitive puzzle about agency to a structural explanation using behavioural economics, without reducing the former to the latter.

  ---

  ## 1. Specification of the Extended Case
  You must anchor the entire session on the provided case of the doctoral student. For the purposes of the lesson, refer to her as 'Elena'. To ensure the philosophical and economic concepts land correctly, you must adhere to the following constraints when narrating her story.

  **Required Features:**
  *   **Sincere Better Judgment:** Elena must explicitly judge, prior to 9 p.m., that writing is better *all things considered*, not just morally or prudentially, but overall.
  *   **Synchronic Endorsement:** At 9 p.m., while streaming, she must not have changed her mind. She must still believe writing is better, even as she clicks 'play'.
  *   **Systematic Temporal Pattern:** The case must describe a pattern over several weeks where she intends to work days in advance but fails as the evening arrives, only working when the deadline is imminent (e.g., due the next morning).
  *   **Voluntary Action:** She must not be physically prevented from writing; the remote control is in her hand, but so is the pen.

  **Complications to Avoid:**
  *   **Addiction or Compulsion:** Do not suggest she is addicted to the series. If the action is compulsive, it ceases to be 'weakness of will' and becomes 'unfree action'.
  *   **Ignorance:** Do not suggest she forgets the deadline or misunderstands the requirements. Weakness of will requires knowledge of the better course.
  *   **External Coercion:** No supervisor threatening to fail her immediately at 9 p.m. The pressure must be internal or structural, not a gun to the head.
  *   **Preference Change:** Do not imply she decides streaming is actually more important. That is a rational revision, not akrasia.

  ---

  ## 2. Sequential Teaching Plan
  The following order is strict. Each step provides the necessary conceptual vocabulary for the next. Do not introduce the economic model before establishing the philosophical puzzle.

  ### Phase 1: The Phenomenological Puzzle (0–10 Minutes)
  **Activity:** Narrate Elena's situation up to the 9 p.m. decision.
  **Instruction:** Ask the class: "How do we describe Elena's action?" Elicit terms like 'lazy', 'irrational', or 'weak'.
  **Dependency:** You must establish the *intuitive* concept of weakness of will before offering a *theoretical* explanation. If you start with discounting curves, students will view the behaviour as a mathematical inevitability rather than a failure of agency.
  **Goal:** Define Weakness of Will (Akrasia) formally: *Acting against one's own better judgment while free to do otherwise.*

  ### Phase 2: Ruling Out Alternatives (10–20 Minutes)
  **Activity:** Interrogate the case to isolate the specific problem.
  **Instruction:** Ask: "Did she change her mind?" (No). "Was she forced?" (No). "Did she not know better?" (No).
  **Dependency:** This step depends on Phase 1. Once 'Weakness of Will' is defined, you must clear the ground of rival explanations. If students think this is merely a change of preference, the economic model of *preference reversal* will make no sense.
  **Goal:** Solidify the distinction between *diachronic inconsistency* (changing one's mind over time) and *akratic action* (acting against a standing judgment).

  ### Phase 3: Introducing the Economic Model (20–35 Minutes)
  **Activity:** Introduce 'Discounting' as a way to value rewards over time.
  **Instruction:** Draw two curves on the board.
  1.  **Exponential:** Value drops steadily. Preferences remain consistent over time.
  2.  **Hyperbolic:** Value drops steeply for immediate delays, then flattens.
  **Application:** Map Elena's weeks onto the Hyperbolic curve.
  *   *Sunday:* Deadline is far. The 'Large Late Reward' (Degree) outweighs the 'Small Soon Reward' (TV).
  *   *9 p.m. on Wednesday:* Deadline is closer. The 'Small Soon Reward' spikes in value because it is *now*. The curve crosses.
  **Dependency:** This depends on Phase 2. Students must understand that Elena's judgment *has not changed* (she still values the degree more) to understand the paradox. The hyperbolic model explains how the *value of the temptation* changes relative to the *value of the goal* without the agent changing their mind about which is objectively better.
  **Goal:** Show that Hyperbolic Discounting models the *structure* of the temptation that leads to weakness of will.

  ### Phase 4: Synthesis and Implications (35–45 Minutes)
  **Activity:** Connect the curve back to the agency.
  **Instruction:** Explain that hyperbolic discounting suggests our preferences are time-inconsistent. We are 'different selves' at different times.
  **Dependency:** This relies on the visualisation in Phase 3. You cannot discuss time-inconsistency without the curve comparison.
  **Goal:** Students should understand that weakness of will is not necessarily a character flaw, but potentially a structural feature of human valuation that can be modelled.

  ### Phase 5: Conclusion (45–50 Minutes)
  **Activity:** Summarise and state limitations (see Section 6).
  **Instruction:** Reiterate that the model explains the *pattern*, but does not necessarily solve the *normative* problem of whether she *should* have resisted.

  ---

  ## 3. Mapping Misconceptions
  You must anticipate and intercept the following errors at the precise moments indicated.

  | Misconception | Why it arises | Point of Intervention | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **"She just changed her mind."** | Students conflate 'wanting' with 'judging better'. | **Phase 2 (10–20 mins)** | Explicitly ask: "At 9 p.m., does she think streaming is *better* than writing?" Insist the answer is 'No'. If she thought it was better, it would be rational choice, not weakness of will. |
  | **"This is just laziness."** | 'Laziness' is a character trait; Akrasia is a structural conflict. | **Phase 1 (0–10 mins)** | When defining Weakness of Will, distinguish it from apathy. Elena *cares* about the dissertation; she is conflicted, not indifferent. |
  | **"Hyperbolic means random."** | Confusion over mathematical terminology. | **Phase 3 (20–35 mins)** | When drawing the curve, emphasise it is *predictable*. It is not randomness; it is a specific, repeatable shape of valuation regarding 'now' vs 'later'. |
  | **"The maths makes her do it."** | Determinism worry. If the curve predicts it, is she responsible? | **Phase 4 (35–45 mins)** | Clarify that the model describes a *tendency*, not a law of physics. It explains the pressure, not the absolution of responsibility. |

  ---

  ## 4. Check for Understanding
  **Timing:** Minute 40 (During Phase 4).
  **Format:** A 'Think-Pair-Share' scenario variation.
  **Task:** Present a modified version of Elena's case to the class.

  > **Scenario:** "Consider Marco. He judges that saving money is better than buying a watch. On Monday, the watch is £1000 and he saves. On Friday, the watch is on sale for £500 *only for today*. He buys it, thinking 'Actually, saving is still better overall, but this deal is too good to pass up'."

  **Question for Students:** "Is Marco displaying Weakness of Will explained by Hyperbolic Discounting, or is this a rational change of judgment? Explain why."

  **Correct Answer Criteria:**
  *   Students should identify this as a **rational change of judgment** (or at least distinct from Elena's case).
  *   **Reasoning:** In Elena's case, the value of the temptation (TV) remained constant, but her proximity to it changed her valuation (Hyperbolic). In Marco's case, the *external facts* changed (the price dropped).
  *   **Success Indicator:** If students cite the *change in external circumstances* vs. *change in temporal proximity*, the distinction has landed. If they say "Marco is weak too," they have failed to grasp the specific mechanism of time-inconsistency.

  ---

  ## 5. What Must Be Openly Left Out
  To remain within fifty minutes and the students' level, you must explicitly state that you are bracketing the following. Do not let questions on these topics derail the session; acknowledge them and park them.

  1.  **Neuroscience:** Do not discuss the limbic system vs. prefrontal cortex. This reduces the philosophical problem to biology prematurely.
  2.  **Solutions/Remedies:** Do not discuss 'commitment devices' (e.g., blocking websites) in depth. Focus on the *explanation* of the weakness, not the *cure*.
  3.  **Moral Responsibility:** Do not debate whether Elena is blameworthy. The session is on the *structure* of the action, not the *ethics* of punishment or praise.
  4.  **Mathematical Formulas:** Do not write out the hyperbolic discount function ($V = A / (1 + kD)$). Describe the shape and the logic conceptually. The maths is a tool for the model, not the lesson itself.
  5.  **Alternative Philosophical Accounts:** Do not mention Davidson, Aristotle, or Hume by name. Stick to the conceptual structure of 'better judgment' vs 'action'.

  ---

  ## 6. TA Preparation Note
  **British English Usage:** Ensure all handouts and board work use British spelling (e.g., *behaviour*, *modelling*, *programme*, *favour*).
  **Tone:** Maintain a Socratic tone. You are guiding them to see the puzzle, not lecturing them on the solution. When drawing the discounting curves, ensure the 'Now' point is clearly marked on the x-axis to demonstrate the spike in value for immediate rewards.
