answer: |-
  This is a fantastic dilemma, and honestly, it sounds like you're hitting the exact nerve your professor wants you to find. The tension between **moral exemplarity** (Plutarch's goal) and **historical integrity** (the modern historian's goal) is the whole ballgame in biography studies.

  First off, don't worry about the typo (*biologist* happens to the best of us), but let's dive into the ethics of this.

  Here's how I'd break it down for you and your brother:

  ### 1. Plutarch vs. Hagiography (The Course Connection)
  Your brother is channeling Plutarch, but he might be misreading him. Plutarch explicitly states in the *Life of Alexander* that he isn't writing history; he's writing lives. He says he often skips great battles or sieges to focus on a small remark or joke that reveals character. **However**, Plutarch generally didn't *hide* the vices. He included Caesar's ambition, Antony's drunkenness, and Demosthenes' cowardice. He used the flaws to make the virtues shine brighter or to offer a warning.

  **Hagiography**, on the other hand, is about sanctification. It erases the flaw to create a perfect icon.
  *   **The Brother's Point:** We need exemplars. (True).
  *   **Your Point:** Omission is lying. (Also True).

  If the biography he found is erasing the abuse and theft, it's not Plutarchan; it's hagiographic. It's creating a saint, not a human.

  ### 2. The Stakes of the "Flaw"
  You mentioned the biologist stole credit and was abusive. This isn't just "messy" (like Churchill being a depressive or Edison being a bit of a showman). This is **structural harm**.
  *   **Credit Stealing:** This undermines the very ethic of the field (science relies on trust and attribution).
  *   **Abuse:** This harms people.

  If your brother presents this person as a hero *without* mentioning that they harmed their own team to get there, the lesson becomes: *"Genius justifies abuse."* That is a dangerous moral takeaway for a school presentation. It reinforces the "Great Man" myth that science is done by lone geniuses rather than collaborative teams (including that grad student!).

  ### 3. The Solution: Don't Change the Subject, Change the Lens
  You don't necessarily have to tell him to pick someone else. Instead, you can encourage him to make the **sanitization itself part of the presentation.** This actually sounds like an A+ idea for an ethics of biography course.

  **Suggest this approach:**
  *   **The Hook:** "Here is a scientist who made a huge discovery."
  *   **The Turn:** "But the story we usually tell is incomplete."
  *   **The Analysis:** "Most popular biographies focus on perseverance, but they omit the grad student whose work was used and the abusive lab environment."
  *   **The Conclusion:** "Can we admire the science without endorsing the scientist? How does hiding the flaws change what we learn from their life?"

  This way, he gets to talk about the discovery (which he wants), but he also engages with the ethical reality (which you want). It turns the presentation into a critical analysis of **how we write history**, which fits your course theme perfectly.

  ### 4. Is it okay to learn from a sanitized life?
  Only if you treat the sanitization as data.
  If he presents the sanitized version as **truth**, then no, it's unethical. It perpetuates a lie.
  If he presents the sanitized version as **myth**, and then contrasts it with the historical record, then yes. That's critical thinking.

  ### The Verdict
  Tell him: *"You're right that we can't expect perfect people. But Plutarch didn't hide the flaws; he used them to teach lessons. If you present this guy as a pure hero, you're teaching the class that abuse doesn't matter if you're smart. But if you present the discovery AND the controversy, you teach them about the complexity of real history."*

  It's a great opportunity for him to be the one who breaks the hagiography, rather than perpetuating it. Plus, it saves you from having to ban the topic entirely.

  (And hey, at least you didn't type 'ethics of biograpy'—you're doing fine!)
