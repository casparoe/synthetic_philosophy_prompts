answer: |-
  # JOINT STATEMENT ON EXPLANATORY LEVELS IN COGNITIVE SCIENCE

  **Subject:** The Viability of Greedy Reductionism Within a Crane-Only Ontology
  **Parties:** Proponent of Greedy Reductionism (GR); Proponent of Crane-Only Emergence Theory (COET)
  **Date:** October 24, 2023

  ## I. AGREED CLAIMS

  The undersigned parties, having engaged in adversarial collaboration regarding the explanatory structure of cognitive science, affirm the following propositions as shared premises. These claims establish the ontological and methodological boundaries within which our disagreements persist.

  1.  **Ontological Closure and the Rejection of Skyhooks:** Both parties affirm a physicalist ontology wherein all causal powers are ultimately grounded in fundamental physical processes. We agree that "skyhooks"—explanatory posits that suspend natural law or introduce complexity from the top down without mechanical substrate—are nonexistent. All complex structures, including cognitive systems, are constructed via "cranes": natural, bottom-up mechanisms operating under standard physical laws.
  2.  **The Demand of Greedy Reductionism:** Both parties agree on the definition of greedy reductionism as the methodological mandate that a complete explanation of any phenomenon must ultimately be stated in the vocabulary of the phenomenon's lowest physical substrate. We agree that for the greedy reductionist, any higher-level description that cannot be translated without remainder into substrate-level terms is considered provisional, elliptical, or eliminable.
  3.  **The Status of the Intentional Stance:** Both parties agree that the Intentional Stance (the strategy of predicting behavior by attributing beliefs, desires, and rationality) is a consistent and reliable predictive tool in cognitive science. We agree that the central dispute concerns the *source* of this reliability: specifically, whether the success of the Intentional Stance indicates the existence of genuinely indispensable high-level causal patterns (COET) or merely reflects a heuristic compression of substrate-level complexity necessitated by human cognitive limitations (GR).
  4.  **Supervenience:** Both parties agree that higher-level cognitive states supervene on lower-level physical states; there is no change in cognitive state without a corresponding change in physical substrate. The disagreement lies not in the dependency relation, but in whether the supervenient properties possess explanatory autonomy.

  ## II. DISAGREEMENTS AND CRUXES

  The following table delineates the precise points of divergence. For each domain, the specific position of each party is stated in terms acceptable to that party. The "Crux and Concrete Case" column identifies the empirical or conceptual test case agreed upon to evaluate the disagreement. The "Divergent Predictions" column specifies what each party expects the case to demonstrate regarding explanatory loss.

  | Domain of Disagreement | Greedy Reductionist (GR) Position | Crane-Only Emergence Theorist (COET) Position | Crux and Concrete Case | Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Explanatory Completeness** | A substrate-level explanation is *always* superior in principle. If a high-level explanation cannot be fully reduced, it is because the reduction is incomplete, not because the high-level property is real. | A substrate-level explanation is *sometimes* inferior in practice and principle. High-level patterns are real "cranes" that stabilize complexity; ignoring them constitutes a loss of explanatory power regarding the system's function. | **Crux:** Whether high-level predictive dynamics in distributed biological systems can be fully dissolved into substrate-level explanations without irreducible explanatory loss.<br><br>**Case:** Collective foraging optimization in a social-insect colony (e.g., *Atta* leafcutter ants). | **GR Prediction:** A complete simulation of individual neurochemistry and pheromone kinetics will reproduce the colony's foraging path exactly. The "colony strategy" is a post-hoc label with no causal leverage.<br><br>**COET Prediction:** The colony-level variables (e.g., gradient fields, collective pressure) capture variance and efficiency metrics that are computationally intractable or opaque at the neural level. Dissolving the colony variable loses the explanation of *adaptive efficiency*. |
  | **Indispensability of the Intentional Stance** | Intentional descriptions are always eliminable in principle. They are "user-illusions" generated by the observer's need to compress data. A sufficiently powerful analyzer would discard them for physical descriptions. | Intentional descriptions are indispensable for systems where the pattern of rationality is more robust than the noise of the physical implementation. The pattern is objectively real, not just a compression artifact. | **Crux:** Whether attributing "belief" and "desire" to a non-human system yields predictions that physical attribution cannot match in noisy environments.<br><br>**Case:** A reinforcement-learning agent operating with degraded sensory input and partial observability. | **GR Prediction:** Tracking the agent's weight matrices and activation thresholds will predict behavior more accurately than attributing "goals," especially when the agent acts irrationally due to noise.<br><br>**COET Prediction:** Attributing "goals" will predict the agent's recovery from noise and error-correction trajectories better than tracking weights, because the *functional* pattern persists despite physical variance. |
  | **Causal Exclusion** | Higher-level properties do not cause anything that their lower-level constituents do not already cause. To claim otherwise is to endorse causal overdetermination. | Higher-level properties constrain lower-level constituents. The "crane" structure channels physical causality, making the high-level property a necessary part of the causal story. | **Crux:** Whether top-down constraint is a valid causal description or a mere description of bottom-up constraints.<br><br>**Case:** Neural pruning during critical periods of cognitive development. | **GR Prediction:** Pruning is fully explained by local biochemical competition rules (e.g., neurotrophic factor availability). "Cognitive demand" is a shorthand for biochemical states.<br><br>**COET Prediction:** "Cognitive demand" (a high-level functional variable) acts as a boundary condition that selects which biochemical pathways stabilize. Without the functional description, the specific pruning pattern is inexplicable. |

  ## III. PROCEDURAL COMMITMENT

  Both parties agree that the resolution of these disagreements does not rely on appeal to authority or intuition, but on the demonstrated capacity of each framework to generate novel predictions in the concrete cases listed above. We agree that if the Greedy Reductionist position requires computational resources exceeding the thermodynamic limits of the universe to generate predictions that the Crane-Only Emergence position generates efficiently, the pragmatic indispensability of the emergence framework is established, even if ontological reductionism remains theoretically possible.

  **Signed:**

  _________________________
  *Proponent of Greedy Reductionism*

  _________________________
  *Proponent of Crane-Only Emergence Theory*
