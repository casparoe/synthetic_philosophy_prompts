      *   Keep the engineering/analytical tone.

      *(Self-Correction during drafting)*: Make sure I don't just say "Case 2 is bad." The user called it "Empty." I need to explain *why* it feels empty compared to Case 1. Case 1 creates *new* utility (Marcus suffers, Animals gain; Priya suffers, Homeless gain). Case 2 just moves money. The *causes* don't get new resources, just different sources. Wait, if Sam was *going* to donate anyway, and Nora was *going* to donate anyway, the total pool is fixed. The trade changes *who* donates to *what*. If Sam values Malaria more than AI, and Nora values AI more than Malaria, the *traders* are happier. But the *world*? The causes get the same money. So the "Empty" verdict is correct because *Moral Trade* should be about the Morals (the causes), not just the Traders' utility functions. I need to make sure the principle distinguishes between "Prudential Trade" (good for me) and "Moral Trade" (good for the good).

      *Refining Case 7:* The user says "I would accept them again on the numbers." This implies they view their advocacy as a resource. The principle needs to challenge that categorization. Advocacy is a *signal*, not a *resource*.

      *Refining the "Self-Undermining" worry:* This is the strongest philosophical point. If trading conviction becomes normal, conviction becomes cheap. This is a "Crowding Out" effect. I should validate this worry.

      *Let's finalize the Principle Name:* **The Principle of Counterfactual Impact and Constitutive Integrity.**

      *Clause 1: Counterfactual Cost (Additionality).*
      *Clause 2: Non-Zero-Sum Impact (Beneficiary Gain).*
