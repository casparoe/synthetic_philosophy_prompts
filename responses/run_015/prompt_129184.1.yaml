answer: |-
  You are describing a recognized phenomenon, though "moral trade" is not a rigid term of art in academic philosophy. It overlaps with "vote trading" (logrolling), "effective altruism" donation swaps, and "contractualist" bargaining. However, your intuition is outpacing the standard literature because you are dealing with *mixed goods*: part resource allocation, part social signaling, part personal integrity.

  Your draft principle is strong on economics (costs, baselines, externalities) but weak on *semantics* (what the actions *mean*) and *counterfactuals* (what would have happened anyway).

  Here is the carving you are looking for.

  ### The Principle: Counterfactual Impact and Constitutive Integrity

  To be a valid moral trade, an agreement must satisfy three clauses. If it fails any clause, it is either void (pointless), corrupt (bad), or harmful (wrong).

  **Clause 1: Counterfactual Cost (Additionality)**
  *The concession offered must not have occurred in the relevant baseline scenario where the deal was not made.*
  *   **Forces:** Cases 3 and 4.
  *   **Reasoning:** In Case 3, Alex offers a "cost" (stopping driving) that was already going to happen. This is not a trade; it is a sale of air. It violates the definition of a concession. In Case 4, the cost is manufactured solely for the trade. While counterfactually true (he wouldn't have done it otherwise), it fails the *spirit* of Clause 1 because the cost has no independent moral weight; it is purely instrumental.
  *   **Refinement:** To distinguish 3 from 4, we add a sub-clause: *The cost must be intrinsic to the agent's values or constraints, not manufactured solely to create bargaining chips.* Case 3 fails because the cost is zero (he was doing it anyway). Case 4 fails because the cost is fake (he doesn't care about the practice). A valid trade requires *opportunity cost* relative to the agent's genuine preference ordering.

  **Clause 2: Net Positive Externalities (Non-Zero-Sum Impact)**
  *The trade must increase the total expected value for the beneficiaries of the causes, not merely satisfy the preferences of the traders.*
  *   **Forces:** Cases 2, 5, and 6.
  *   **Reasoning:**
      *   **Case 2 (The Money Swap):** This fails Clause 2. If Sam and Nora were going to donate $200 each anyway, the total pool of money for good causes is $400 before and after the deal. The *causes* gain nothing. The *traders* gain utility (feeling of cooperation), but moral trade is about the *moral* outcome, not the traders' psychological comfort. It is "empty" because it is a wash on impact.
      *   **Case 5 (The Scheduling Conflict):** This fails Clause 2. The sum of the parts is less than the whole. The trade reduced total impact.
      *   **Case 6 (The Workplace Campaigns):** This fails Clause 2 violently. The beneficiaries (disabled workers, low-paid workers) lose out. The traders gain peace, but the moral value is destroyed.
  *   **Correction to your verdict on Case 2:** You felt that if one puts in more money, it becomes "exploitation." I argue this is incorrect. If Sam donates $400 and Nora $0, but Sam cares deeply about Nora's cause, it is a *gift*, not a trade. If they call it a trade, it is deceptive. The "exploitation" feeling comes from the *label* of trade implying equivalence where there is none. The core verdict ("Empty") is the one to keep; the corollary ("Exploitative") is a confusion of gift vs. trade.

  **Clause 3: Constitutive Integrity (Inalienability of Signal)**
  *Actions that serve primarily as signals of belief, commitment, or identity cannot be traded without degrading their value.*
  *   **Forces:** Case 7.
  *   **Reasoning:** This is the clause your draft missed. Advocacy is not a resource like time or money; it is a *signal*. The value of advocacy lies in the audience's belief that you speak because you *believe*, not because you were *paid*.
  *   **Why Case 7 is different from Case 1:** In Case 1, Priya working at a shelter signals she cares about homelessness *less* than Marcus does, but it doesn't signal she *doesn't* care. Labor is a resource. In Case 7, you sold *silence* on a conviction. When you trade a conviction, you break the link between belief and speech. The market price becomes the new reason for the speech (or silence).
  *   **Is it just an externality?** No. An externality implies a side effect. This is a *constitutive* rule. Like selling a vote: you physically can do it, but doing it destroys the function of the vote. Your willingness to trade signaled that your advocacy was for sale, which lowered the market price of your integrity.

  ---

  ### Addressing Your Specific Worries

  **1. The Carbon Offset Vocabulary**
  You asked if "additional, permanent, not double-counted" transfers cleanly.
  *   **Additional:** Yes. This maps to Clause 1. If you would have done it anyway, it counts for nothing.
  *   **Permanent:** Yes. This maps to Case 7. If you trade a commitment but revert later (or change your mind because you were paid), the "credit" is void.
  *   **Not Double-Counted:** Yes. This maps to Case 5. If two events split an audience, you cannot claim full credit for both.
  *   **Distortion:** The vocabulary distorts only if it makes you think moral value is *fungible*. Carbon is fungible (a ton is a ton). Moral actions are often not. Advocacy (Case 7) is not fungible with labor (Case 1). The accounting works for resources, but fails for signals.

  **2. The Self-Undermining Market (Adverse Selection)**
  You worry: *"If the people most willing to name a price are the least committed, then the trades that actually get made are the ones that most understate how much the traded things matter."*
  *   **Verdict:** This argument works. It is the "Market for Lemons" applied to virtue.
  *   **Mechanism:** High-commitment actors refuse to trade their core convictions (Case 7). Low-commitment actors are eager to trade. Observers learn that "people who trade convictions are low-commitment." Therefore, the value of the trade drops. Eventually, the market collapses or becomes a zone for low-integrity actors.
  *   **Conclusion:** This is why Clause 3 is necessary. Some goods must be kept off the market to preserve the signal value for everyone.

  **3. Which Verdict Must Go?**
  You must adjust your view on **Case 2 (The Money Swap)**.
  *   **Current:** "Empty... if one puts in more, it's exploitation."
  *   **Correction:** It is *always* empty regarding moral impact, regardless of the split. If Sam gives $400 and Nora $0, Sam is simply donating to Nora's cause. Calling it a "trade" is a category error. There is no exploitation because there is no exchange of value, only a unilateral transfer disguised as a deal. The "exploitation" feeling is your intuition detecting the *deception*, not the math.

  **4. Case 7: Externality or Something Else?**
  It is not just an externality. It is a **Category Error**.
  *   **Externality:** I sell my car, the pollution hurts you. (The car sale is valid, the smoke is a side cost).
  *   **Category Error:** I sell my vote. (The sale itself destroys the validity of the vote).
  *   In Case 7, you treated *advocacy* as a *resource*. It is a *signal*. When you price a signal, you change what it signals. You signaled "I am a trader," not "I am a believer." This requires Clause 3 (Constitutive Integrity).

  ---

  ### The Stress Test: Three New Cases

  To test this principle, here are three constructed cases. Your intuitive reaction to these will tell you if the principle aligns with your moral grammar.

  **Case A: The "Ghost" Volunteer**
  *Scenario:* Ben cares about literacy. Sarah cares about housing. Ben hates public speaking but is good at backend logistics. Sarah is charismatic but disorganized. They agree: Ben will run the backend for Sarah's housing drive (costly to him), and Sarah will do the public speaking for Ben's literacy drive (costly to her).
  *   **Principle Verdict:** **Good.**
  *   **Why:** Satisfies Clause 1 (Real counterfactual cost: Ben hates speaking, Sarah hates logistics). Satisfies Clause 2 (Net positive: Both drives run better than if each did their own weak suit). Satisfies Clause 3 (No signal integrity violated; labor is a resource).
  *   **Test:** Does this feel different than Case 1? It shouldn't. It confirms that *comparative advantage* is valid in moral trade.

  **Case B: The Silence Swap**
  *Scenario:* Two researchers, Li and Omar. Li finds evidence that a popular open-source tool has a security flaw. Omar finds evidence that a rival tool has a flaw. Both flaws are real but minor. They agree: "I won't publish my finding if you don't publish yours." They both save face; the community remains ignorant of the flaws.
  *   **Principle Verdict:** **Wrong.**
  *   **Why:** Fails Clause 2 (Net Positive Externalities). The beneficiaries (the users of the tools) are harmed. Fails Clause 3 (Constitutive Integrity). Scientific integrity requires publishing flaws; trading silence commodifies truth.
  *   **Test:** This probes Case 6. If you feel this is worse than Case 6 because it involves *truth* rather than *campaigns*, then Clause 3 is doing heavy lifting.

  **Case C: The Penance Trade**
  *Scenario:* A group member, Ken, makes a serious ethical mistake (e.g., embezzles small funds). He is caught. Another member, Joy, says: "I will take on the burden of explaining this to the donors and damaging my own reputation to cover for you, if you agree to donate 20% of your income to the group fund for a year." Ken agrees.
  *   **Principle Verdict:** **Bad.**
  *   **Why:** Fails Clause 3. Joy is trading her *integrity* (honesty with donors). Ken is trading *penance*. This turns accountability into a transaction. It signals that ethics can be bought.
  *   **Test:** This probes Case 7. Even though Joy *chooses* to take the cost, the trade itself corrupts the relationship between error and accountability. If you reject this, you affirm that some costs (reputation for honesty) are inalienable.

  ### Summary of the Carving

  Your intuition is correct: Moral Trade is real, but it is bounded.
  1.  **Resources (Time, Money, Labor):** Tradable, provided there is **Additionality** (you wouldn't have done it otherwise) and **Net Impact** (the world is better off, not just you).
  2.  **Signals (Advocacy, Integrity, Truth):** Non-tradable. Pricing them destroys their value.
  3.  **Third Parties:** Cannot be bargained away.

  Your draft principle was 80% there. It missed the distinction between *resources* and *signals*, and it missed the requirement that the *causes* must gain, not just the *traders*.

  If you adopt **The Principle of Counterfactual Impact and Constitutive Integrity**, you keep Case 1 (Good), Case 3 (Bad), Case 4 (Bad), Case 5 (Bad), Case 6 (Wrong), and Case 7 (Bad). You refine Case 2 to "Empty/Category Error." You gain a robust defense against the "self-undermining market" worry: the market is only self-undermining if you try to trade the inalienable. Keep signals off the exchange, and the market for resources remains stable.
