      *   *Critique:* The medical board analogy might conflate the two paradoxes if not careful. The "risk-assessment module" sounds like the Lottery, while the "aggregation protocol" sounds like Closure. The tension between the *specialists* (local evidence) and the *board* (global consistency) mirrors the Author (local claims) vs. the Preface (global fallibility).
