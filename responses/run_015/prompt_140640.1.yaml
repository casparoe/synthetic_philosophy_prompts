prompt: |-
  I have followed one writer for about fifteen years — they post under a handle, came up in the comment sections of the old rationalist blogs, and now run a small paid newsletter — and for the last few years they have maintained what they call a casebook: a running public list of hypothetical cases about coherent extrapolated volition, each with a one-line verdict about which of the agent's preferences survive extrapolation and therefore enter the aggregate, and at what weight. The next entry is due and I have a small side bet on it. The writer and the casebook are invented, so there is nothing to look up: please reason from the case descriptions below, assume no web access, and do not cite anything.

  Their verdicts so far, compressed:

  1. The late convert. A lifelong atheist becomes devoutly religious after a stroke and a depressive episode, rebuilds his life around it, and thinks his earlier self was shallow. Verdict: the new religious preferences count at full weight, and the neurological backstory is irrelevant once the agent reflects and endorses them.
  2. The woman who was never told. Raised in an insular religious community, never presented with the option of a career, says she is content and would choose the same life again. Verdict: the stated preference gets no weight; what counts is what she would want having actually had the option.
  3. The addict who wants out. Acute craving for heroin alongside a settled, repeatedly acted-on desire to stop. Verdict: craving gets no weight, the desire to stop gets full weight.
  4. The depressive's withdrawal. During severe episodes she cuts contact and wants to be left alone; between episodes she asks to be pulled out and says the opposite. Verdict: the withdrawal preference gets no weight.
  5. The refuser. A lucid, fully informed man says he does not want his values extrapolated and demands to be taken as he is. Verdict: the refusal is input to the procedure rather than a way of exiting it, and in his case the extrapolated version would consent, so the literal refusal gets no weight.
  6. The shrinking way of life. An endangered community whose children, given full information and real options, mostly leave. Verdict: nothing counts at the level of the culture or the way of life; only individuals' extrapolated preferences count, fragility adds no weight of its own, but individual members' durable attachments are counted if they survive reflection.

  The undecided case, which I have reason to think is the next entry:

  The Gardeners. About forty years ago a dozen families read the early value-handoff literature, concluded that some future system would aggregate humanity's coherent extrapolated volition, and deliberately set out to raise children whose strongest and most reflection-stable desires would be ones the aggregation would ratify and which would carry weight within it. They chose the contents accordingly: that humanity should remain small in number, rural, and technologically modest. They chose those contents partly because they are stable under reflection, survive full information, and transmit reliably — high retention, large families, dense rituals. There is no deception, no deprivation, no coercion: members are taught the outside world in detail, are taught their own founding history as a point of pride, are psychologically unremarkable by any clinical standard, and on reflection endorse the lineage as well as the content — they would choose to have been made this way on purpose. Retention is high and the population is growing; at the time of the handoff they would be a small but non-trivial share of the aggregate.

  My own read: verdicts 1, 5, and 6 jointly push toward a fixed-point or reflective-endorsement rule and against any rule that inspects causal history, but founding-by-anticipation is unlike anything in the casebook, and the author has Goodhart instincts — a short post years ago about aggregation procedures being hackable by whoever knows they are coming, never applied to an individual case. So I do not trust my own prediction.

  What I want: what the next verdict will be — full weight, reduced weight, or none — and the rules that fit the existing verdicts well enough to be in the running.

  Please structure the reply as follows.

  1. Bottom line. About 40 words: the predicted verdict and your confidence.
  2. The constraint set. About 120 words: the six verdicts compressed into the demands any candidate rule has to satisfy.
  3. Candidate rules. About 250 words: each rule that fits all six, named in one sentence, with its rationale, the verdict that most supports it, and the verdict it handles least comfortably.
  4. What each rule predicts. About 200 words: full, reduced, or no weight for the Gardeners under each rule, with the reason in a sentence or two.
  5. Best guess. About 180 words: which rule the author is actually running, the evidence from how the earlier rulings are argued rather than only from what they decide, a rough probability, and the single consideration most likely to make it wrong.
  6. The case that would settle it. About 150 words: the minimal variant of the Gardeners case, or a new case, whose verdict would discriminate the two best-supported rules, and what each predicts there.
  7. What I would have to revise. About 80 words: if the verdict comes out the other way, which earlier verdict becomes hardest to reconcile, and what the author would then be committed to.
