      *   **Questions to Answer:**
          1.  **Theory of Property:** What view of ownership does this presuppose? (Stake in nearby land/collective easement vs. compensation for concentrated costs vs. defensive response to local costs/diffuse benefits).
          2.  **Theory of Political Standing:** Who counts? (Affected, subjected, present, enfranchised).
          3.  **Theory of Neighborhood:** Does the neighborhood have interests independent of residents? What are the identity conditions for "preservation"?
          4.  **Baseline Assumption:** Is the existing pattern neutral? Is change the act needing justification?
          5.  **Strict Presupposition vs. Fit vs. Underdetermination:** Which theories are *required* by the practice, which just fit, and which are underdetermined (multiple theories explain the same practice)?
          6.  **The Test:** Evaluate two procedural amendments:
              *   (A) Objectors state compensation price to withdraw objection (city pays if project proceeds).
              *   (B) Reserved seats for future tenants.
              *   *Task:* Which theories see these as repairs? Which see (A) as an insult (non-compensable) and (B) as worthless (beneficiaries unidentifiable)?
          7.  **The "Right to the City":** What procedural/legal changes would be needed to realize a *Right to the City* (inhabitants deciding how the city is made, not just consumer housing choice)?

  2.  **Analyze the Theories (Mental Sandbox):**

      *   *Property as Collective Easement:* Owners own a share of the "character." Changing it violates their property right.
      *   *Property as Nuisance/Cost Internalization:* New building imposes costs (traffic, shadows). Veto is a bargaining chip to internalize those costs.
      *   *Political Standing as "Present Affected":* Only those currently there count because they are the "community." Future people don't exist yet.
      *   *Neighborhood as Entity:* The neighborhood has a soul/identity distinct from the people.
      *   *Status Quo Baseline:* Existing zoning/density is the natural state. Deviation requires permission.

  3.  **Address the "Strict Presupposition vs. Fit" Question:**

      *   *Strict:* The practice *requires* that existing residents have standing. It *requires* that physical construction is the trigger for review (unlike market turnover).
      *   *Fit:* It fits well with "property values" protection, but doesn't strictly require it (could be about aesthetics).
      *   *Underdetermined:* We can't tell if neighbors object because they feel a *moral right* to the view or because they want *money* (bribe/compensation). The process looks the same.

  4.  **Analyze the "Test" (Procedural Amendments):**

      *   *Amendment A (Compensation/Bribe):*
          *   *Cost Internalization Theory:* Sees this as a **repair**. It makes the hidden cost explicit. If the cost is too high, the project shouldn't happen.
          *   *Collective Easement/Moral Right Theory:* Sees this as an **insult**. You can't sell out the "character" or the "right." It commodifies a non-market value.
          *   *Neighborhood Entity Theory:* Sees this as irrelevant or insult. The neighborhood isn't a wallet.
      *   *Amendment B (Future Tenant Seats):*
          *   *Regional Housing Need Theory:* Sees this as a **repair**. Gives voice to the missing interest.
          *   *Present Affected Theory:* Sees this as **worthless/invalid**. You can't represent non-existent people. Standing requires current injury.
          *   *Right to the City:* Might see this as a start, but maybe insufficient if they aren't *inhabitants* yet.

  5.  **Address the "Right to the City" (Lefebvrean sense):**

      *   Current system: "Right to *stay*" (NIMBY) or "Right to *buy*" (Consumer).
      *   Desired system: "Right to *make*."
      *   Changes needed: Shift from defensive veto to proactive planning. Shift from property owners to inhabitants (renters included). Shift from project-by-project discretion to rule-based entitlements that reflect a democratic vision. Maybe community land trusts, participatory budgeting for development, shifting the burden of proof to the *blockers* rather than the *builders*.

