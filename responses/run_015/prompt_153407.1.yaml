      *   *Section 4: Right to the City.* This needs to go beyond YIMBY vs. NIMBY. It's about *power*. If inhabitants decide, do they decide density? Do they decide affordability? It implies shifting from *discretionary review of exceptions* to *legislative planning of rules*.
      *   *Conclusion:* Synthesize. The current system protects *capital* disguised as *community*.

  7.  **Refining the Tone:**
