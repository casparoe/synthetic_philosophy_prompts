answer: |-
  This is an inquiry into the political ontology of American zoning. To answer it, we must disentangle the procedural mechanics from the normative justifications that are often conflated in public discourse. The practice you describe is a specific technology of governance; like any technology, it encodes assumptions about the world that may contradict the stated intentions of its users.

  Here is an analysis of the theories presupposed by the current regime, an evaluation of your proposed procedural test, and a sketch of what a *Right to the City* would require in practice.

  ### I. Theories Presupposed by the Practice

  The current system of discretionary review rests on three distinct theoretical pillars. Some are strictly required by the mechanics; others are merely compatible narratives that justify them.

  **1. Theory of Property: The Collective Easement (Strictly Presupposed)**
  The practice strictly presupposes that fee-simple ownership of a parcel includes a **collective easement in the surrounding landscape.** If ownership were strictly bounded by the lot line, a neighbor would have no standing to object to a compliant building next door. The fact that they *do* have standing implies that property rights extend beyond the title deed into the visual, auditory, and traffic environment of the vicinity.
  *   **Strict vs. Fit:** The practice *requires* that owners hold a veto over nearby changes. It does *not* require that this veto be about "property values." It fits comfortably with an economic theory (protecting asset value), but it functions equally well under an aesthetic or moral theory (protecting "character"). The mechanism is underdetermined regarding the *motive*, but determined regarding the *right*.

  **2. Theory of Political Standing: The Present and the Affected (Strictly Presupposed)**
  The system presupposes that political standing is derived from **current physical presence and current injury.**
  *   **The Paradox of the Highway:** You note the inconsistency regarding highways and gentrification. This reveals that the theory of standing is not actually about "change" or "harm" in the abstract. It is about **private agency.** When a private actor builds, they are exerting power over the neighborhood, and the neighborhood is granted a defensive veto. When the state builds a highway (eminent domain) or the market raises rents, these are treated as forces of nature or sovereign prerogatives against which the "community" has no defensive right, only a claim for compensation (in the case of eminent domain) or no claim at all (rents).
  *   **The Baseline:** The practice presupposes the **existing physical and demographic pattern is the neutral baseline.** Permitting a new building is an *act*; blocking it is an *omission*. In moral philosophy, omissions often carry less burden of justification than acts. Therefore, the status quo is privileged not because it is just, but because it is *there*.

  **3. Theory of the Neighborhood: The Reified Entity (Underdetermined)**
  Does the neighborhood have interests over and above its residents? The rhetoric suggests yes ("neighborhood character"), but the procedure suggests no (only residents speak).
  *   **Underdetermination:** The practice is compatible with two contradictory views:
      1.  **Aggregative:** The neighborhood is just the sum of its current owners.
      2.  **Reified:** The neighborhood is a historic entity that current owners are merely stewarding.
      The procedure cannot distinguish between a neighbor saying, "This blocks my view" (Aggregative) and "This doesn't fit the 1920s streetscape" (Reified). Both result in a veto.

  ### II. The Test: Evaluating the Amendments

  Your proposed amendments function as a diagnostic tool to separate these theories. Here is how the reconstructed theories would evaluate them.

  **Amendment A: The Compensation Mechanism**
  *Objectors state a price to withdraw objection; the city pays if the project proceeds.*

  *   **The "Localized Nuisance" Theory (Cost Internalization):**
      *   **Verdict:** **Repair.**
      *   **Reasoning:** This theory holds that objections are about concentrated costs (traffic, shadows, noise). If those costs can be priced and paid, the objection is resolved. This makes the implicit explicit.
  *   **The "Collective Easement" Theory (Property Right):**
      *   **Verdict:** **Insult / Category Error.**
      *   **Reasoning:** If my property right includes a right to the *character* of the vicinity, that right is inalienable. You cannot bribe me to surrender a right that defines my ownership. To offer money is to admit the objection was never about "character" but about rent-seeking.
  *   **The "Reified Neighborhood" Theory:**
      *   **Verdict:** **Insult.**
      *   **Reasoning:** You cannot compensate a "character." The neighborhood is not a wallet; it is a heritage.

  **Amendment B: Reserved Seats for Future Tenants**
  *Seats at the hearing reserved for people committing to rent in the building.*

  *   **The "Present Affected" Theory (Current Standing):**
      *   **Verdict:** **Worthless / Illegitimate.**
      *   **Reasoning:** Standing requires current injury. Future tenants are hypothetical. They do not yet suffer the traffic or the shadows. Furthermore, their identity is contingent on the project; they cannot represent a constituency that only comes into existence if the veto is overridden.
  *   **The "Regional Welfare" Theory (Housing Need):**
      *   **Verdict:** **Repair.**
      *   **Reasoning:** This theory holds that the missing variable in the hearing is the demand for housing. Giving voice to the demand side balances the supply-side (builder) and status-quo-side (neighbors).
  *   **The "Right to the City" Theory:**
      *   **Verdict:** **Partial Repair, but structurally limited.**
      *   **Reasoning:** It acknowledges that the "city" includes those who *will* inhabit it. However, it still treats them as consumers (renters) rather than co-authors of the space.

  ### III. The Right to the City: Procedural and Legal Requirements

  You define the *Right to the City* not as a consumer right to housing, but as a claim by inhabitants to participate in deciding how the city is made. This is a Lefebvrian definition: it is a right to *oeuvre* (creative work), not just *usage*.

  The current system grants a Right to the City only to **existing property owners**, and only in a **negative capacity** (the right to stop). To realize a Right to the City for *inhabitants* (including renters, future residents, and the dispossessed), the following changes would be required:

  **1. Shift from Discretionary Review to Legislative Planning**
  Currently, the "decision" happens project-by-project in a hearing room, where power is asymmetrical (organized locals vs. atomized future tenants).
  *   **Change:** Move the decision-making to the **legislative level** (zoning code amendments) rather than the **administrative level** (variances and permits).
  *   **Why:** Legislative bodies represent the whole city, not just the radius of 500 feet. A Right to the City requires deciding the *rules of growth* democratically, not fighting individual battles where the status quo has veto power.

  **2. Redefine "Standing" from Ownership to Inhabitation**
  Currently, mailed notices go to "owners of record."
  *   **Change:** Notices and voting participation in neighborhood planning must extend to **all adult residents**, regardless of tenure status.
  *   **Why:** Renters are inhabitants. They suffer the "character" changes and the traffic equally. Excluding them presupposes that only capital investment grants a stake in the future of the place.

  **3. Invert the Burden of Proof regarding "Character"**
  Currently, the builder must prove the project does not harm character.
  *   **Change:** The objectors must prove that the *preservation of the current state* serves a public good superior to the regional need for housing or climate density.
  *   **Why:** The "neutral baseline" assumption must be overturned. The baseline should be the city's adopted general plan (which usually includes housing goals). Deviating from the plan (by blocking housing) should require the same level of environmental review and justification as building it.

  **4. Institutionalize the "Future Inhabitant"**
  Since future tenants cannot physically attend a hearing, their interest must be represented by a fiduciary.
  *   **Change:** Establish a **Public Developer** or a **Housing Ombudsman** with standing equal to the neighborhood association. Their mandate is not to build everything, but to argue for the interests of the regional population in every local hearing.
  *   **Why:** This institutionalizes the "absent" constituency. It treats the need for shelter as a party to the negotiation, not an abstract statistic.

  **5. Decouple "Character" from "Exclusion"**
  *   **Change:** If a neighborhood wishes to preserve its "character" (e.g., single-family scale), it must be taxed or assessed to compensate the region for the exclusionary effect of that choice.
  *   **Why:** This addresses the "concentrated benefits, diffuse costs" problem. If the neighborhood is a collective easement, the holders of that easement must pay for the privilege of restricting the supply of the commons (the city's land).

  ### Summary

  The current practice presupposes a **property theory of collective veto** and a **political theory of present-tense standing**. It treats the status quo as morally neutral and private construction as the primary agent of disruption.

  Your **Compensation Test** distinguishes between those who view zoning as a market negotiation (Nuisance Theory) and those who view it as a moral right (Easement Theory). Your **Tenant Seat Test** distinguishes between those who view the city as a collection of fortified enclaves (Present Standing) and those who view it as an integrated system (Regional Welfare).

  A true **Right to the City** would dismantle the project-by-project veto. It would shift power from the defensive protection of existing asset values to the proactive, democratic design of the urban environment, granting standing to inhabitants rather than owners, and treating the need to dwell as equal in weight to the desire to preserve.
