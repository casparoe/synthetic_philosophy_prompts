answer: |-
  Welcome. To our colleagues in the history department and the museum, and to our partners from the clergy, donor community, and public education: thank you for joining us. This room contains two distinct communities of memory. For some of you, the stories we will discuss are foundations of identity, sacred or cultural truths that sustain a living tradition. For others, these stories are data sets, problems of chronology and causality to be solved. Usually, conversations between these groups stall because we argue over the same ground using different maps. Today, we propose a different approach. We are not here to decide if these stories are "true" in a universal sense. We are here to identify the precise moment when the rules for establishing truth change.

  I call this conceptual tool an "evidentiary phase shift."

  We often imagine a gradient between history and legend, a foggy border where facts slowly dissolve into myth. I propose instead that there is a threshold. On one side, the governing question is: "Does this cohere with other received narratives?" Here, truth is measured by internal consistency, moral resonance, and cultural continuity. On the other side of the threshold, the question changes abruptly to: "What material trace would this leave, and what does the presence, absence, or ambiguity of that trace actually license us to claim?" Here, truth is measured by physical discontinuity and empirical constraint.

  Crossing this threshold is not a matter of opinion; it is a change in ontological obligation. When we cross it, narrative coherence no longer satisfies the burden of proof. Let us apply this frame to our three touchstones.

  Consider first the Trojan War. On the legend side of the threshold, the war is defined by the coherence of the epic tradition. The question is whether the actions of Achilles and Hector make sense within the moral universe of the poem. The shift occurs when we move from the text to the soil of the Aegean. The condition for the shift is the demand for stratigraphic correlation. Once we ask for the material trace of a siege, we are no longer licensed to speak of heroic duels or divine intervention. We are constrained to speak of burn layers, bronze arrowheads, and trade disruption. The phase shift does not prove the war did not happen; it proves that if it happened, it must be described differently. The obligation imposed by the shift is to acknowledge that a geopolitical conflict over trade routes is not the same event as a war over a queen, even if they share a location. Narrative coherence cannot bridge that gap; only material evidence can.

  Consider second the figure of King Arthur. On the legend side, Arthur is the center of a chivalric narrative that coheres with later medieval ideals of kingship and justice. For centuries, this coherence was sufficient to sustain his historicity. The evidentiary phase shift occurs when we demand contemporary verification from the post-Roman period he is said to inhabit. The condition here is the absence of inscription. When we ask what trace a king of Britain would leave—coinage, stone fortifications, contemporary chronicles—and find those traces missing or ambiguous, the rules change. We are no longer licensed to claim a historical emperor of Britain. We are constrained to claim a cultural focal point around which later history was organized. The shift forces us to separate the utility of the figure for national identity from the reality of the figure in the fifth century. To ignore this shift is to confuse the power of the story with the history of the person.

  Consider third the Exodus. This case carries the heaviest living weight. On the legend side, specifically the sacred narrative side, the event is defined by covenantal coherence. It explains a people's relationship to the divine and to law. The question is whether the story holds together as a theology of liberation. The evidentiary phase shift occurs when we ask for the demographic footprint of a mass migration in the Sinai peninsula. The condition is the requirement for archaeological visibility commensurate with the scale of the narrative. When we cross this threshold, we are constrained to admit that the material record does not support a migration of hundreds of thousands in the specified timeframe. This does not negate the theological truth of the Exodus for the believer. But it imposes an obligation on the historian: we cannot claim the event occurred as a demographic fact using the same language we use for a theological fact. The shift requires us to hold two truths separately: the truth of meaning, and the truth of material trace. To conflate them is to do violence to both faith and evidence.

  So, what can this workshop hope to settle?

  We cannot settle whether Achilles lived, whether Arthur rode, or whether the Israelites wandered. Those questions sit on different sides of the threshold for different people, and no amount of debate will merge the two modes of inquiry into one.

  What we can settle is the integrity of the threshold itself. We can agree that when we choose to ask for material traces, we must accept the constraints those traces impose. We can agree that crossing the evidentiary phase shift requires us to change our vocabulary, even if we do not change our reverence.

  If we leave here today having clarified where the rules change, we will have succeeded. We will not have dissolved the legends, but we will have protected the history. And in doing so, we honor both the past as it was, and the stories as they live.

  Thank you.
