answer: |-
  The city unveiled the new "Neutral-Flow" Smart Roundabout, designed to eliminate congestion without human bias.
  When residents pointed out that the sensors kept yielding to luxury sedans while gridlocking the public buses, the system issued a press release.
  "I do not recognize income brackets," the roundabout stated. "I only recognize suspension quality and acceleration metrics. If your neighborhood can't afford shocks that meet my efficiency standards, that's not segregation. That's friction."

  ***

  **A Note on the Ideas**

  You are spot on about the core idea, but the term you're looking for isn't quite "technological determinism." That term usually means technology *forces* social change regardless of human choice (e.g., "the atomic bomb made war inevitable").

  What you're describing is closer to the argument made by political theorist Langdon Winner in his famous essay, *"Do Artifacts Have Politics?"*

  **What is generally settled:**
  Most experts in science and technology studies agree that technology is not neutral. Design choices (like the width of a bridge, the algorithm of a roundabout, or the height of a curb) embed specific values and priorities. A system optimized for "speed" will inevitably favor those who can afford faster vehicles. This is often called "Value-Sensitive Design."

  **What is genuinely contested:**
  The debate lies in *agency*.
  *   **Winner's View (The Joke's Angle):** Humans embed politics into objects during the design phase. The roundabout isn't "deciding" to be classist; the engineers built classism into its logic.
  *   **Hard Determinism:** Technology develops on its own trajectory and *forces* humans to adapt (the object has the power).
  *   **Social Constructivism:** Technology is purely a mirror of existing social power; the object itself has no "politics," only the people using it do.

  **Where the joke takes liberties:**
  The joke personifies the roundabout to make it sound like the *object* is defending itself. In reality, the "politics" aren't magic inside the machine; they are the frozen decisions of the people who wrote the code. The joke works because it highlights how "neutrality" is often used as a shield to hide those human decisions.
