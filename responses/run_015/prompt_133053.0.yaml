  6.  **Final Structure:**
      *   **Introduction:** Acknowledge the tension (Lakatos vs. Black Box).
      *   **1. The Status of the Weights:** Are they hypotheses or parameters? (The "Implicit Hypothesis" argument).
      *   **2. Progressive vs. Degenerating:** The criterion of "Novelty" vs. "Fit."
      *   **3. The Negative Heuristic & Opacity:** Protecting the core with an oracle.
      *   **4. Anomaly Interpretation:** Belt noise vs. Core pressure.
      *   **Conclusion:** The risk of "Instrumental Degeneration."

