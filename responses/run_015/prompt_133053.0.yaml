prompt: |-
  hey can you lay out the most important implications of Lakatos's research programmes for judging whether replacing a physics experiment's hand-tuned filter with a black-box ML anomaly detector counts as a progressive problem-shift or a degenerating one? the core theory hasn't changed (say standard model) but the protective belt now includes this uninterpretable classifier that flags events with no mechanistic explanation attached. does Lakatos's framework even apply when the auxilliary adjustments aren't explicit theoretical hypotheses but just learned weights? and if the detector screams anomaly, should that be read as pressure on the core theory, or just noise inside the belt? i'm after the deep conceptual implications, not a generic summary.
