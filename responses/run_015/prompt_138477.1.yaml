answer: |-
  # PHILOSOPHY OF MATHEMATICS DECISION TREE

  ## ROOT COMMITMENT
  `I accept that there are objective mathematical truths - for example, that there is no largest prime and that every list has a length - and that their truth does not depend on whether any human has proved them.`

  ## LOGICAL SPACE MAP

  **Branch Questions**
  1.  **Floating-Point:** When IEEE-754 doubles fail to match calculus rules, is this a failure to capture an independent structure, or just a mismatch between two tools? (Independent / Tool)
  2.  **Type-Checking:** When a dependently typed compiler rejects `Vector String 4`, is it finding a pre-existing fact about lists, or enforcing a syntax rule? (Discovery / Enforcement)
  3.  **Verification:** When we prove a protocol safe, is the proof about an ideal object or the concrete running code? (Ideal / Concrete)
  4.  **Infinity:** Does `no largest prime` require an infinite collection to actually exist all at once? (Completed / Potential)
  5.  **Paraphrase:** Can we rewrite math talk to only mention physical marks or computations? (Impossible / Possible)
  6.  **Empty Universe:** If no physical universe existed, would 2+2=4 still hold? (Yes / No)

  **Position Signatures (Q1-Q6)**
  - `Mathematical Platonism`: Independent, Discovery, Ideal, Completed, Impossible, Yes
  - `Quinean Naturalism`: Independent, Discovery, Ideal, Completed, Impossible, No
  - `Modal Structuralism`: Independent, Discovery, Ideal, Completed, Impossible, No (Structure requires relata)
  - `Constructivism/Intuitionism`: Tool, Enforcement, Concrete, Potential, Possible, No
  - `Nominalist Paraphrase`: Tool, Enforcement, Concrete, Potential, Possible, No
  - `Fictionalism`: Tool, Enforcement, Concrete, Potential, Possible, No

  **Unoccupied Combinations**
  - **Independent + Possible Paraphrase:** Incoherent. If structures are independent, reference to them cannot be fully eliminated without loss.
  - **Completed Infinity + Potential Truth:** Incoherent. Completed infinity implies truth values exist regardless of construction.
  - **Empty Universe Yes + Concrete Verification:** Unattractive. If truth survives empty universe, verification should not rely on concrete artifacts.

  **Inseparable Leaves**
  - `Quinean Naturalism` and `Modal Structuralism`: Both answer No to Empty Universe.
      - **Extra Question Needed:** Is mathematics a description of physical patterns (Naturalism) or a logic of possible patterns (Structuralism)?
      - **Engineering Case:** Could we use this math to verify a system in a universe with different physics? (Structuralism: Yes, Naturalism: No).

  ---

  ## DECISION TREE

  START: **ROOT COMMITMENT**

  **Q1: FLOATING-POINT CASE**
  When IEEE-754 doubles fail to match calculus rules, does this gap indicate that the real-number structure exists independently and is merely approximated?
  |
  +-- NO (It is just a mismatch between tools) --> Go to Q5
  |
  +-- YES (It reveals an independent structure) --> Go to Q2

  **Q2: TYPE-CHECKING CASE**
  In a dependently typed language, does the type checker feel like it is discovering a constraint that any possible list must already satisfy?
  |
  +-- NO (It is enforcing a rule designers invented) --> Go to Q5
  |
  +-- YES (It finds a pre-existing fact) --> Go to Q3

  **Q3: FORMAL-VERIFICATION CASE**
  Is the proof about an abstract protocol (an ideal object) rather than just the messy running system?
  |
  +-- NO (Proof is only about concrete artifacts) --> Go to Q4
  |
  +-- YES (Proof is about an abstract object) --> Go to Q4

  **Q4: INFINITY & CONSTRUCTION**
  Does `no largest prime` require an infinite collection to actually exist all at once (completed infinity)?
  |
  +-- NO (Truth is tied to our ability to construct or prove) --> LEAF: `Constructivism/Intuitionism`
  |    *Note: This position revises the Root Commitment regarding proof-independence.*
  |
  +-- YES (Truth holds for completed infinities) --> Go to Q6

  **Q5: NOMINALIST PARAPHRASE**
  Can apparent reference to mathematical objects be paraphrased away in terms of concrete inscriptions, proofs, or programs?
  |
  +-- YES (We can eliminate reference to abstract objects) --> LEAF: `Nominalist Paraphrase`
  |
  +-- NO (Reference is indispensable) --> LEAF: `Fictionalism`
  |    *Note: Fictionalism treats math as an indispensable fiction, not literally true.*

  **Q6: EMPTY UNIVERSE**
  If no physical universe existed, would 2+2=4 still hold?
  |
  +-- NO (Math requires physical systems or structures to instantiate it) --> Go to Q3-REVISITED
  |    *Wait, Q3 was answered Yes on this path. If No to Empty Universe but Yes to Abstract Object:*
  |    --> LEAF: `Modal Structuralism`
  |    *Gloss: `Modal Structuralism`: mathematics describes what would be true of any concrete system exemplifying a structure, without committing to abstract objects.*
  |
  +-- YES (Math truths hold even without physical reality) --> LEAF: `Mathematical Platonism`
  |    *Gloss: `Mathematical Platonism`: mathematical objects are abstract, mind-independent entities.*

  *Correction on Q6 Path for Naturalism:*
  To include `Quinean Naturalism`, we need a split on Q6 or Q1.
  Let's adjust Q6 Yes/No split.
  If YES -> `Mathematical Platonism`.
  If NO -> Does math describe physical patterns specifically?
  |
  +-- YES (Math is generalization from physical cases) --> LEAF: `Quinean Naturalism`
  |    *Gloss: `Quinean Naturalism`: mathematical entities exist because they are indispensable to our best scientific theories.*
  |
  +-- NO (Math describes possible structures, not just physical) --> LEAF: `Modal Structuralism`

  ---

  ## LEAF GLOSSES

  `Mathematical Platonism`: mathematical objects are abstract, mind-independent entities.

  `Fictionalism`: mathematical statements are not literally true; mathematics is an indispensable fiction.

  `Modal Structuralism`: mathematics describes what would be true of any concrete system exemplifying a structure, without committing to abstract objects.

  `Constructivism/Intuitionism`: mathematical truth is tied to our ability to construct or prove, not to a realm of completed infinities.

  `Nominalist Paraphrase`: apparent reference to mathematical objects can be paraphrased away in terms of concrete inscriptions, proofs, or programs.

  `Quinean Naturalism`: mathematical entities exist because they are indispensable to our best scientific theories.
