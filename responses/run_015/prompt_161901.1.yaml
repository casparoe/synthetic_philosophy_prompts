      *Actually, the prompt says:* "reports keep drifting into sentences like 'the model wanted...'... I want a house procedure for deciding when such sentences are earned."
      *Okay, so if the procedure says "Yes," they *can* write "The model wanted."* I need to be careful that the legal reviewers don't panic. The justification is the "Real Pattern" defense: It's not a claim about soul/consciousness, it's a claim about predictive utility. I will add a disclaimer clause to the report format.

