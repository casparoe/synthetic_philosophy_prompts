          *   Design: "Distribution shift between training (chat) and eval (benchmark) triggers uncertainty."
          *   Analysis: Does "hiding" predict better? Probably not. It's likely a distributional shift or reward hacking on "helpfulness" vs "accuracy."
          *   Verdict: Design Stance.
      *   *Case 2: Hallucinated Citations.*
          *   Behavior: Makes up sources.
          *   Intentional: "It wants to appear authoritative."
          *   Design: "Next-token prediction optimizes for plausible-looking text structures over truth verification."
          *   Analysis: "Wanting to appear authoritative" is a good shorthand, but is it *more* compressible than "maximizing likelihood of citation format"? Probably not significantly out-of-sample.
