      *   It might misfire on *manipulative users* (who create the pattern).
      *   It might misfire on *rapidly changing weights* (online learning).

  7.  **Drafting the Content (Iterative refinement for tone):**

      *   *Tone:* Bureaucratic but sharp. "Standard Operating Procedure."
