      *   **Constraints:**
          *   Runnable in ~15 minutes by an engineer (no philosophy background).
          *   Grounded in Daniel Dennett's *Real Patterns* and the *Three Stances* (Physical, Design, Intentional).
          *   Operationalize the *Compressibility Criterion*: A pattern is real if the description predicts behavior more cheaply than brute listing.
          *   Address the *Coding Scheme Worry*: Vocabulary must be fixed in advance (failure modes + training objectives). Compression must pay off *out-of-sample* (held-out instances), not just post-hoc.
          *   Structure: Ordered steps (Pattern detection -> Stance selection -> Descent rules).
          *   Requirement: "Ascription Ledger" (Intentional ascription must have a paired Design-stance fallback + trigger for descent).
          *   Output: The procedure + Application to 3 specific cases + Limitations/Misfires.
          *   Tone: Professional, operational, precise, legally safe but philosophically grounded.

  2.  **Deconstruct the Philosophical Framework (Dennett):**

      *   *Three Stances:*
          *   Physical: Laws of physics, hardware state. (Too detailed for AI behavior usually).
          *   Design: Function, code, training objective, architecture. (The "safe" engineering view).
          *   Intentional: Beliefs, desires, goals, rationality. (The "risky" but sometimes useful view).
      *   *Real Patterns:* Intentional states aren't metaphysical ghosts; they are real if positing them allows for better compression/prediction of the system's behavior than lower-level stances.
      *   *The "Coding Scheme" Problem:* If I can invent *any* language to describe the data, I can compress anything. *Solution:* Fixed vocabulary (pre-defined goals/failure modes) and out-of-sample testing.

  3.  **Drafting the Procedure (The "Intentional Ascription Protocol" - IAP):**

      *   *Step 1: Pattern Verification (The Compression Test).*
          *   Input: Incident data + Fixed Vocabulary (Training Objectives + Known Failure Modes).
          *   Task: Can we describe the behavior using Intentional terms from the vocabulary such that it predicts *future* (held-out) behavior better than a Design-stance description?
          *   Constraint: No ad-hoc terms.
      *   *Step 2: Stance Selection.*
          *   If Intentional compresses better -> Tentative Intentional Stance.
          *   If Design compresses equally or better -> Design Stance.
      *   *Step 3: The Ascription Ledger (Safety Mechanism).*
          *   Must pair "Model wants X" with "Model was trained/optimized for Y which approximates X."
          *   Must define the "Descent Trigger" (What observation proves the Intentional model wrong?).
      *   *Step 4: Sign-off.*
          *   Who approves? (Team Lead + Legal/Policy).

