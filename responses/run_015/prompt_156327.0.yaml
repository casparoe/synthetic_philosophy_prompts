      *   **The "Most Work" Requirement:** *Temporal Precedence/Non-circularity*. It kills the easiest cheats immediately. Or perhaps *Policy Robustness*. Let's go with *Policy Robustness* (Goodhart's Law aspect) or *Specificity vs Stability*. Actually, the prompt asks which requirement excludes candidates. *Non-circularity* excludes the lazy baselines. *Policy Robustness* excludes static models. Let's argue *Policy Robustness* is the killer.

