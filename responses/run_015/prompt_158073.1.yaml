      *   **Task:** Evaluate a specific reconstructed position on Otto Neurath's ISOTYPE (International System of TYpographic Picture Education).
      *   **The User's Position:** Visual symbols in ISOTYPE aren't just pedagogical; they form an *autonomous symbolic system* carrying *full empirical content* without underlying propositional syntax. Carnap was wrong about compositionality; Neurath's anti-metaphysics *depends* on this autonomy.
