      *   *Historical/Intentional:* Did Neurath actually think this? Or did he see it as a *bridge* to language for the masses? He talked about "speechless international language," but did he mean *replacement* or *supplement*? He was a physicalist; physicalism usually implies protocol sentences. Can a picture be a protocol sentence?
