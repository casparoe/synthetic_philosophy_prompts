answer: |-
  **Take-Home Final: Metaphysics of Properties**
  **Topic:** Dispositions, Finks, and Masks

  **The Prompt**
  Consider a newly synthesized crystal, *Chronos-7*. Under normal mechanical stress (e.g., a hammer strike), *Chronos-7* remains intact. However, when subjected to an electron-beam scan, it shatters instantly. The scanning process does not physically impact the crystal mechanically; it merely observes/interacts via electrons.

  Write an essay addressing the following:
  1.  Is *Chronos-7* fragile? Argue whether its fragility is masked, finked, or absent entirely.
  2.  Do the electron-beam conditions belong inside or outside the disposition's stimulus conditions? Justify your boundary drawing.
  3.  Contrast how a **Dispositionalist** (powers ontology) and a **Categoricalist** (Humean categorical base) would explain this case.
  4.  Flag exactly where the distinction between *finks* and *masks* does explanatory work here. Does it matter which one this is?

  *Note: Don't just recap Martin or Johnston. I want to see you wrestle with the stimulus conditions.*

  ***

  **Model Answer (Study Group Reference)**
  *Note: This is a sample, not the only way to answer. Also, I left a few typos in here to keep it real.*

  The case of *Chronos-7* breaks the simple Conditional Analysis of Dispositions (CAD). CAD says: X is fragile iff if X were struck, X would break. Here, *Chronos-7* is struck (mechanically) and doesn't break. So, by standard definitions, it lacks fragility. Yet it shatters under scanning. This forces us to ask what counts as the stimulus.

  If we stick to standard fragility (breaking under mechanical stress), the disposition is absent. But a Dispositionalist might argue the fragility is **masked**. The crystal has the intrinsic power to shatter, but the mechanical stimulus is insufficient to trigger it without the electron interaction. Alternatively, if the electron beam *removes* a protective barrier (intrinsic or extrinsic), the fragility was there all along, just masked. If the beam *changes* the structure instantly to cause breaking, that's a **fink**—the disposition disappears or appears at the moment of stimulus.

  Drawing the stimulus boundary is the hard part. If we define the stimulus broadly as "energy interaction," the scanning counts, and the crystal is fragile. If we define it narrowly as "mechanical impact," it isn't. A Dispositionalist prefers the former, arguing dispositions are real powers that don't depend on our arbitrary labeling of stimuli. The power is there, waiting for the right key.

  A Categoricalist, however, denies real powers exist. They'd say *Chronos-7* has a categorical microstructure. Laws of nature dictate that mechanical stress + this structure = no break. Electron beam + this structure = break. There's no "fragility" property, just behavior governed by laws. For them, the fink/mask distinction is less about hidden powers and more about describing intervening variables in the causal chain.

  Where does the fink/mask distinction do work? It matters for prediction. If it's a **mask**, removing the mask (e.g., stopping the interference) means it should break under normal stress. If it's a **fink**, the property itself changes during the test, so predicting behavior requires knowing the intrinsic change mechanism. In *Chronos-7*, if the beam alters the bonding (fink), the crystal wasn't fragile before the scan. If the beam just reveals a weakness (mask/unmask), it was fragile all along.

  Ultimately, neither side wins outright. The Dispositionalist saves the intuition that properties are active but struggles with stimulus vagueness. The Categoricalist avoids spooky powers but struggles to explain why the same structure behaves so differently without ad-hoc laws. The distinction between fink and mask helps clarify *why* the conditional fails, but doesnt solve the deeper ontological debate.

  ***

  **Marking Scheme (25 Points Total)**

  1.  **Identify CAD Failure (5 pts)**
      *   Must explicitly state that the standard "if struck then break" conditional fails here.
      *   *Classic Mistake:* Treating the conditional as obviously true despite the counter-example.

  2.  **Classify the Case (5 pts)**
      *   Must take a stance on whether fragility is masked, finked, or absent (and justify it).
      *   *Classic Mistake:* Saying it's both a fink and a mask without explaining the difference.

  3.  **Dispositionalist Account (5 pts)**
      *   Must explain how a powers ontologist views the intrinsic nature of the crystal.
      *   *Classic Mistake:* Claiming dispositionalists deny the physical structure matters.

  4.  **Categoricalist Account (5 pts)**
      *   Must explain the view that properties are categorical bases governed by laws.
      *   *Classic Mistake:* Confusing categoricalism with eliminativism (they accept properties, just not powers).

  5.  **Explanatory Work of Distinction (5 pts)**
      *   Must articulate why knowing "fink" vs. "mask" changes the prediction or metaphysical explanation.
      *   *Classic Mistake:* Treating finks and masks as synonyms for "exception cases."

  ***

  **Instructor Notes: Settled vs. Contested**

  *   **Pretty Settled:** Everyone agrees finks and masks break the simple Conditional Analysis (CAD). Nobody thinks "if struck, would break" is sufficient anymore. Also settled that masks involve interference while finks involve intrinsic change during the stimulus.
  *   **Genuinely Contested:** Whether dispositions are fundamental (Dispositionalism) or reducible to categorical bases + laws (Categoricalism). Also contested is how to define the "stimulus conditions" without making them arbitrary. Don't penalize students for picking a side, just check if they understand the trade-offs.
