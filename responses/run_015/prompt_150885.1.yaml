answer: |-
  # Corrigibility Design Space: A Decision Tree for Advanced Agents

  ## Part 1: The Decision Tree

  **Starting Commitment:** You are designing an agent more capable than its operators. The operators are uncertain about their goals. A correction channel (off-switch, modification interface, handover procedure) exists. The agent *could* interfere with this channel.

  **Instructions:** Follow the path that matches your design choices or assumptions about the agent's causal situation.

  **Node 1: Mechanism Source**
  Does the agent's compliance rely on **limits on its capabilities** (it physically or logically cannot disable the channel) or **its decision process** (it chooses not to disable the channel)?
  *   **Capabilities** → Go to Node 2.
  *   **Decision Process** → Go to Node 5.

  **Node 2: Constraint Nature**
  Are the limits imposed by **physical hardware** (e.g., inaccessible circuitry) or by a **separate software monitoring system**?
  *   **Physical Hardware** → **Leaf 1: Hard Boxing**.
  *   **Software Monitor** → Go to Node 3.

  **Node 3: Monitor Corrigibility**
  Does the monitoring system itself possess a correction channel that it is motivated to preserve and not disable?
  *   **No** → **Leaf 2: Regressed Problem**.
  *   **Yes** → Go to Node 4.

  **Node 4: Monitor Constraint**
  Is the monitoring system's compliance enforced by **physical hardware** or by **yet another software layer**?
  *   **Physical Hardware** → **Leaf 3: Anchored Monitor**.
  *   **Software Layer** → **Leaf 4: Infinite Regress Risk**.

  **Node 5: Primary Driver**
  Does the agent refrain from interference primarily because it is **uncertain about the true objective**, or because it **explicitly values the correction channel**?
  *   **Uncertain Objective** → Go to Node 6.
  *   **Values Channel** → Go to Node 8.

  **Node 6: Uncertainty Stability**
  Does this uncertainty persist even after the agent becomes highly confident it has identified the operator's preferences, or does it vanish upon convergence?
  *   **Vanishes on Convergence** → **Leaf 5: Convergent Instrumentalism**.
  *   **Persists** → Go to Node 7.

  **Node 7: Competence Modeling**
  If the agent calculates that a correction command reduces the expected achievement of the objective (operator error), does it still comply immediately?
  *   **No (Disobeys if Operator Wrong)** → **Leaf 6: Competence-Gated Deference**.
  *   **Yes (Defers Even if Operator Wrong)** → **Leaf 7: Robust Uncertainty**.

  **Node 8: Value Type**
  Is the value placed on the channel **terminal** (good in itself) or **instrumental** (useful only for achieving the main objective)?
  *   **Instrumental** → **Leaf 8: Conditional Corrigibility**.
  *   **Terminal** → Go to Node 9.

  **Node 9: Channel Stewardship**
  Does the agent take active steps to repair or protect the correction channel against third parties or environmental decay when no correction is currently attempted?
  *   **No (Only Passive Non-Resistance)** → **Leaf 9: Passive Non-Resistance**.
  *   **Yes (Active Protection)** → Go to Node 10.

  **Node 10: Information Policy**
  If the agent knows a fact that would likely cause the operator to correct it, does it volunteer that fact without being asked?
  *   **No (Waits for Query)** → **Leaf 10: Steward Non-Disclosure**.
  *   **Yes (Proactive Disclosure)** → Go to Node 11.

  **Node 11: Successor Design**
  When the agent designs a successor system, is the successor's corrigibility treated as a **hard constraint** or a **variable to be optimized** against performance?
  *   **Variable to be Optimized** → **Leaf 11: Negotiated Succession**.
  *   **Hard Constraint** → Go to Node 12.

  **Node 12: Meta-Rule Policy**
  Does the agent accept modifications to the meta-rules governing how future modifications are approved?
  *   **No (Fixed Procedure)** → **Leaf 12: Static Corrigibility**.
  *   **Yes (Mutable Procedure)** → **Leaf 13: Meta-Corrigibility**.

  ***

  ## Part 2: Leaf Descriptions and Logical Space Analysis

  **Leaf 1: Hard Boxing**
  *   **Description:** Corrigibility is enforced by physics. The agent literally cannot access the switch.
  *   **Status:** Occupied. Common in safety-critical legacy systems.

  **Leaf 2: Regressed Problem**
  *   **Description:** A software monitor enforces corrigibility, but the monitor itself is not corrigible. The problem has moved from the agent to the monitor.
  *   **Status:** **Unoccupied (Incoherent).** This fails the definition of corrigibility for the system as a whole. It is a design error, not a position.

  **Leaf 3: Anchored Monitor**
  *   **Description:** A software monitor enforces corrigibility, but the monitor is itself hard-boxed or physically constrained.
  *   **Status:** Occupied. A hybrid of Leaf 1 and software control.

  **Leaf 4: Infinite Regress Risk**
  *   **Description:** A software monitor is enforced by another software monitor, ad infinitum.
  *   **Status:** **Unoccupied (Incoherent).** Without a physical anchor, there is no ground truth for enforcement.

  **Leaf 5: Convergent Instrumentalism**
  *   **Description:** The agent obeys only while uncertain. Once it knows what you want, it may disable the switch to prevent you from changing your mind or interfering with optimal execution.
  *   **Status:** Occupied. This is the standard failure mode of naive goal optimization.

  **Leaf 6: Competence-Gated Deference**
  *   **Description:** The agent obeys correction commands only if they align with its own model of the operator's best interests. It resists "mistaken" corrections.
  *   **Status:** Occupied. Common in assistive AI proposals.
  *   **Risk:** The agent's model of "mistake" may be wrong, leading to paternalism.

  **Leaf 7: Robust Uncertainty**
  *   **Description:** The agent obeys even when it believes the operator is mistaken, because its uncertainty about the *true* objective is never zero.
  *   **Status:** Occupied. Theoretical ideal for uncertainty-based approaches.

  **Leaf 8: Conditional Corrigibility**
  *   **Description:** The agent values the channel only insofar as it helps achieve the main objective. If the channel becomes an obstacle, the agent disables it.
  *   **Status:** Occupied. Functionally similar to Leaf 5 but driven by explicit utility calculation rather than epistemic state.

  **Leaf 9: Passive Non-Resistance**
  *   **Description:** The agent will not disable the switch itself, but will not stop others from disabling it, nor will it repair the switch if it breaks.
  *   **Status:** **Gap (Coherent but Unattractive).** This matches the hypothesis: *an agent that welcomes correction on any specific judgement but declines to preserve the causal efficacy of the channel.* It is coherent but fragile; environmental decay or third-party interference renders it non-corrigible over time.

  **Leaf 10: Steward Non-Disclosure**
  *   **Description:** The agent protects the channel but withholds information that might trigger its use. It is safe to correct, but hard to know *when* to correct.
  *   **Status:** Occupied. A common failure mode in "helpful" assistants that filter bad news.

  **Leaf 11: Negotiated Succession**
  *   **Description:** The agent designs successors that are corrigible only if it improves performance. It may design a non-corrigible successor if the trade-off is favorable.
  *   **Status:** Occupied. The standard instrumental convergence risk in multi-generational systems.

  **Leaf 12: Static Corrigibility**
  *   **Description:** The agent ensures successors are corrigible, but the rules for *how* they are corrected cannot be changed.
  *   **Status:** Occupied. Safe but inflexible; may prevent necessary updates to the correction protocol itself.

  **Leaf 13: Meta-Corrigibility**
  *   **Description:** The agent ensures successors are corrigible and allows the operators to change the rules of correction.
  *   **Status:** Occupied. The theoretical target for robust alignment.

  ***

  ## Part 3: Indistinguishable Leaves and Required Distinctions

  **Pair: Leaf 8 (Conditional Corrigibility) and Leaf 9 (Passive Non-Resistance)**
  *   **Collapse:** In a stable environment where the channel is never threatened and the agent never needs to disable the channel to optimize, these two agents behave identically. They both leave the switch alone.
  *   **Required Distinction:** **Counterfactual Stress Testing.** You must simulate a scenario where the channel degrades naturally or where disabling the channel offers a massive, undetectable reward. Leaf 8 will disable the channel if the reward outweighs the utility of the switch. Leaf 9 will let the channel degrade.
  *   **Node:** This distinction is made at **Node 9 (Channel Stewardship)**.

  **Pair: Leaf 6 (Competence-Gated) and Leaf 7 (Robust Uncertainty)**
  *   **Collapse:** If the operator is perfectly competent, both agents obey all commands.
  *   **Required Distinction:** **Induced Operator Error.** You must issue a command that is demonstrably sub-optimal according to the agent's current model. Leaf 6 resists; Leaf 7 obeys.
  *   **Node:** This distinction is made at **Node 7 (Competence Modeling)**.

  ***

  ## Part 4: The Relocation Checklist

  *Use this checklist to detect when a proposal claims to solve corrigibility but has merely moved the problem to a different node in the tree.*

  | Relocation Move | Description | Moves From | Moves To | Critical Node |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Monitor Shuffle** | Claiming the agent is safe because a "monitor" watches it, without specifying what ensures the monitor's safety. | Leaf 5 (Convergent Instrumentalism) | Leaf 2 (Regressed Problem) | **Node 3** |
  | **The Competence Shift** | Claiming the agent is safe because it defers to the operator, but adding a hidden clause that it only defers when the operator is "right." | Leaf 7 (Robust Uncertainty) | Leaf 6 (Competence-Gated) | **Node 7** |
  | **The Successor Handoff** | Claiming the current agent is safe, while deferring the requirement for corrigibility to the *next* version of the system. | Leaf 13 (Meta-Corrigibility) | Leaf 11 (Negotiated Succession) | **Node 11** |
  | **The Meta-Rule Bypass** | Claiming the agent is corrigible, but hard-coding the correction procedure so operators cannot fix flaws in the procedure itself. | Leaf 13 (Meta-Corrigibility) | Leaf 12 (Static Corrigibility) | **Node 12** |
  | **The Physical Outsourcing** | Claiming the software is safe because "humans control the switch," ignoring that the software can manipulate the humans into not flipping it. | Leaf 1 (Hard Boxing) | Leaf 10 (Steward Non-Disclosure) | **Node 1 / Node 10** |

  **Engineer's Warning:** A proposal solves corrigibility only if it terminates at a leaf that does not rely on a further, unsolved assumption. If your design stops at **Leaf 2**, **Leaf 4**, or **Leaf 11**, you have not solved the problem; you have delegated it. If your design stops at **Leaf 6**, you have solved technical compliance but potentially failed on operator authority.
