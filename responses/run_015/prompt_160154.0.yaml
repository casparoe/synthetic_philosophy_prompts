answer: |-
  Here is the translation, the residue report, and the verdict, drafted for a standards desk memo.

  ### 1. Lemkin in Desk Vocabulary

  **The Concept:**
  Genocide is not a body count; it is a *pattern of intent*. In newsroom terms: It is not a hard news *event* (a massacre); it is an investigative *series* masquerading as a single story.

  **The Lede:**
  Most crimes we cover are defined by the *act* (murder, theft, assault). Genocide is defined by the *target* and the *purpose*. The act is secondary. You can have genocide with low casualties (if the intent is cultural erasure) and mass murder without genocide (if the intent is territorial control, not group destruction).

  **The Attribution:**
  Legally, it requires *mens rea* (guilty mind). In reporting terms, this means we aren't looking for a smoking gun; we are looking for a *paper trail of coordination*. We need to show that disparate events (closing schools, seizing land, killing leaders) are not random or reactive, but *coordinated*.

  **The Nut Graf:**
  Lemkin's definition is a *process* story. It describes the disintegration of a group's "patterns of life." If "massacre" is a spike in the data, "genocide" is a change in the baseline. It is the difference between reporting a fire and reporting arson designed to burn down a specific neighborhood while leaving the next one untouched.

  **The Constraint:**
  The Convention requires "intent to destroy, in whole or in part." For a journalist, this means we cannot infer intent from scale alone. A million dead is a massacre. A million dead *because they belong to Group X, to eliminate Group X* is genocide. The distinction lives entirely in the *why*, which is the hardest thing to prove on deadline.

  ***

  ### 2. The Residue Report

  You guessed correctly on the big three (collectivity, non-events, timing). Here is the breakdown of what translates, what stretches, and what breaks.

  **Bucket A: Maps Cleanly (Evidence & Labeling)**
  *   **The "Paper Trail" Requirement:** Newsrooms demand documentation. Lemkin's "coordinated plan" aligns well with investigative standards. If we have internal memos, orders, or systematic policy shifts, we can evidence this without a court verdict.
  *   **The Attribution Hierarchy:** Your current rule (Court > UN > NGOs > Gov) works here. The friction isn't about *who* says it, but *when*.
  *   **Specific Acts:** The UN Convention lists specific acts (killing, causing harm, preventing birth). These are reportable events. They map to standard crime beats.

  **Bucket B: Fits Only If Bent (The Stretch)**
  *   **The Peg (Event vs. Process):** You noted this. Lemkin sees a slow burn; news needs a spark. *The Bend:* We treat a policy shift (e.g., "Ministry bans Language X") as the peg for a process story. This risks "softening" hard news, but it's the only way to peg the story.
  *   **The Victim (Group vs. Individual):** You noted this. We need a face for the lede. *The Bend:* We use an individual as a *synecdoche* for the group. This risks anecdotalism. If the survivor's story doesn't match the legal definition of "group destruction," the lede undermines the label.
  *   **The Timing (Prevention vs. Adjudication):** Lemkin wanted the word to trigger *intervention*. Newsrooms use the word to describe *completion*. *The Bend:* We use "risk of genocide" or "warning signs of." This satisfies the standards desk (we aren't ruling) but dilutes the urgency Lemkin intended.

  **Bucket C: No Expression in Desk Vocabulary (The Untranslatable)**
  *   **Cultural/Biological Destruction:** Lemkin cared deeply about destroying libraries, banning languages, and sterilization. In news values, these are "features" or "policy," not "hard news." A closed school is a B-story; a mass grave is an A-story. Lemkin's definition requires them to be weighted equally. Our newsroom cannot do this.
  *   **The "Group as Such":** We have no syntax for reporting on a collective entity as the victim. We report on *people* in a group. If 10,000 people die in an earthquake, it's a disaster. If 10,000 people die because they are *Group X*, it's genocide. Our grammar struggles to make the *identity* the cause of death without sounding like advocacy.
  *   **The Obligation Trigger:** Under the Convention, the word "genocide" creates a legal obligation for states to prevent it. When a newsroom uses the word unattributed, we are effectively *creating a news peg for military intervention*. This violates the "wall between news and opinion." We are not just describing reality; we are triggering a policy response.

  **What You Left Out:**
  *   **The "Intent Trap":** Journalists treat intent as a binary (they meant to vs. they didn't). Lemkin treats intent as an *inference from pattern*. We wait for a quote ("Kill them all"); Lemkin looks at the outcome ("They are all dead"). We require a higher standard of proof for intent than the concept allows.
  *   **The Political Cost:** Using the word isn't just a labeling decision; it's a geopolitical one. Editors often spike the word not because the evidence is weak, but because the *consequences* (pressure for war, diplomatic rupture) are too high for a newspaper to shoulder.

  ***

  ### 3. The Verdict

  **Is the untranslatable residue a defect in newsroom vocabulary or a sign the concept is doing less work?**

  It is both.
  1.  **Newsroom Defect:** Our vocabulary is event-driven. We are structurally incapable of reporting on "disintegration" without a "destruction" event to pin it to. We cannot see the silence (closed schools) as loudly as the noise (mass graves).
  2.  **Conceptual Limit:** In a headline, "Genocide" does less work than we pretend. It functions as a moral superlative ("The Worst Thing") rather than a technical diagnosis. When we use it, we are often signaling *moral outrage*, not *legal precision*.

  **Should the top rung of your ladder exist?**

  **No.** Not as a label you apply unattributed.

  **The Recommendation:**
  Drop "Genocide" as a standalone label your newsroom applies. It is a legal conclusion with policy consequences that a newspaper cannot adjudicate. Instead, restructure the top rung to be **Descriptive, Not Diagnostic.**

  **Rewrite the Rule:**
  *   **Current Top Rung:** "Genocide" (Requires Court/UN ruling).
  *   **Proposed Top Rung:** "Systematic destruction of [Group] with intent to eliminate."
      *   **Evidence:** Pattern of coordinated acts (killing + cultural erasure + displacement).
      *   **Attribution:** Use the word "genocide" only in quotes or attributed to experts ("UN investigators warned of genocide").
      *   **Downstream:** This gets the front page *not* because of the label, but because of the *pattern*.

  **Why this works:**
  1.  **It solves the Peg problem:** You report the *acts* (closing schools, mass arrests), which are verifiable events.
  2.  **It solves the Intent problem:** You describe the *coordination* rather than ruling on the *mindset*.
  3.  **It solves the Obligation problem:** You are not triggering the Convention's legal obligations; you are reporting facts that *might* meet that threshold.
  4.  **It honors Lemkin:** It focuses on the *techniques of destruction* (which Lemkin prioritized) rather than the *body count* (which the media prioritizes).

  **The Standards Memo Line:**
  *"We do not adjudicate genocide. We report the facts that constitute it. If the evidence shows a coordinated plan to destroy a group's patterns of life, we report that plan in detail. We allow qualified sources to name the crime. Our job is to make the label inevitable, not to be the first to use it."*

  This protects the desk from the "advocacy" charge while ensuring the story carries the weight Lemkin intended. You climb the ladder by accumulating evidence of *techniques*, not by waiting for a judge to hand you the *verdict*.
