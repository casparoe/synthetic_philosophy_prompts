      *   *Setup Change:* Model doesn't compute your decision. It reads an upstream "type" (disposition) with p=0.6 accuracy.
      *   *Probabilities:* $P(M=Yes | You=Pay) = 0.8$. Same joint distribution.
      *   *Dana's Claim:* Here, your *choice* doesn't move the model. Your *type* does. But your type screens off your choice. Therefore, UDT shouldn't pay (because you can't change your type by deciding now).
