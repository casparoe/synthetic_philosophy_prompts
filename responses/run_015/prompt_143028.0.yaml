      *   *Assessment:* Marek bites the bullet. He admits UDT depends on the "implementation relation." He claims this is a feature, not a bug.
      *   *Validity:* Consistent with FDT (Functional Decision Theory). FDT explicitly relies on the notion of "subjunctive dependence."

