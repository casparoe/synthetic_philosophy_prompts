      *   *Dana's Trap:* She says "scoring policies from behind the coin returns don't pay." This depends on *when* the policy is selected relative to the Type instantiation. If Type is fixed *before* policy selection, UDT refuses. If Policy selects Type, UDT pays. Dana assumes the former (Type screens off choice). Marek assumes the latter (Policy *is* the Type).
