      *   *Assessment:* Dana is technically correct here. Standard UDT/FDT distinguishes between "logical correlation" (same source code) and "evidential correlation" (common cause). If the model reads a "type" that causes both your decision and its prediction, but your *current decision* doesn't causally/logically determine the prediction, FDT usually says "Don't Pay" (because you can't change the type now). However, *Updateless* EDT might still pay if it treats the type as fixed by the policy selected *before* the type was instantiated.
