          2.  **The Metric of Similarity:** Neither provides a rigorous way to calculate the "0.6" other than stipulation. How does an agent *know* it's 0.6?
          3.  **Reflective Stability:** Would an agent self-modify to be the kind of agent that pays in Case 1 but not Case 2?
          4.  **Logical Induction/Probabilistic Logic:** Modern approaches (like Logical Induction) try to handle the "noisy logic" problem Dana raises, but it's not settled.

