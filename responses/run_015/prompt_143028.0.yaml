      *   *Dana's Claim:* Updatelessness does less work than advertised. In perfect simulation, "binding yourself" makes sense. At 0.6 fidelity, or with Type-reading, the story falls apart. It relies on a "measure over partial similarity" that doesn't exist.
      *   *Assessment:* This is the deepest philosophical objection. It attacks the *metric of identity*. How similar must a model be to count as "you" for decision-theoretic purposes? 100%? 60%? 10%? UDT/FDT lacks a formal metric for "partial logical dependence."
