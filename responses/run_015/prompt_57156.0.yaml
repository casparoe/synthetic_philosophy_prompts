  # Seminar Handout: The Reference Class Problem
  **Case Study:** The Court must estimate the probability that a specific claimant (44, female, left-handed, former competitive swimmer, non-smoker, resident of a small town) would have developed a specific medical condition. Frequency data exists for broad categories (e.g., '44-year-old females'), but conjunctions of her properties shrink the reference class to size one (her alone).

  ## Part I: The Decision Tree
  *Follow the path that best matches your philosophical commitments. Answer each question based on the logical priority of the claim, not the desired outcome.*

  **Node 1: Ontology of Chance**
  Does the claimant possess an objective single-case probability of developing the condition, independent of any classification we impose?
  *   **Yes** → Go to Node 2A.
  *   **No** → Go to Node 2B.

  **Node 2A: Determination of Class (Objective Branch)**
  Is the correct reference class fixed solely by the causal structure of the world, or does it vary according to the inquirer's practical interests?
  *   **Fixed by World** → Go to Node 3A.
  *   **Varies by Interests** → **Leaf: The Contextualist**.

  **Node 2B: Determination of Value (Non-Objective Branch)**
  Is there a universal rational rule for assigning a value (e.g., conditionalisation), or is the assignment itself discretionary/pragmatic?
  *   **Universal Rule** → Go to Node 3B.
  *   **Discretionary/Pragmatic** → **Leaf: The Deflationist**.

  **Node 3A: Specificity vs. Stability (Objective/Fixed Branch)**
  Should we refine the class until no further property screens off the outcome (maximal specificity), even if statistical data becomes sparse?
  *   **Yes (Prioritise Specificity)** → **Leaf: The Homogeneity/Maximal Specificity View**.
  *   **No (Prioritise Statistical Stability)** → **Leaf: The Reichenbachian Narrowest-Class Rule**.

  **Node 3B: Evidence vs. Abstinence (Non-Objective/Universal Branch)**
  Does the universal rule require conditionalising on the total available evidence (maximal informational specificity)?
  *   **Yes (Total Evidence)** → **Leaf: The Subjectivist Dissolution**.
  *   **No (Coarse Priors)** → **Leaf: Unnamed**.

  *(Note: To ensure a complete logical space, three additional combinations of answers are logically possible but philosophically unoccupied. These are listed in the analysis below as 'Unnamed'.)*

  ---

  ## Part II: Analysis of Logical Space

  ### 1. Occupied Positions (The Leaves)
  *   **The Reichenbachian Narrowest-Class Rule:** (Yes → Fixed → No). We seek the narrowest class for which reliable statistics exist. Over-specifying to the point of $n=1$ is a mistake because it sacrifices the frequency basis required for objective probability.
  *   **The Homogeneity/Maximal Specificity View:** (Yes → Fixed → Yes). We must include all and only causally relevant properties. If this leaves us with no statistics, so be it; objective homogeneity trumps statistical stability.
  *   **The Contextualist:** (Yes → Varies). There are many objective probabilities relative to different classifications. The court's practical question determines which classification is appropriate.
  *   **The Subjectivist Dissolution:** (No → Universal → Yes). There is no objective chance, only rational degree of belief. The puzzle dissolves by conditionalising on the claimant's total evidence (all known properties).
  *   **The Deflationist:** (No → Discretionary). Single-case probability is a category error in this context. We should not assign a numerical value at all.

  ### 2. Empty Combinations (Unnamed Leaves)
  The tree structure implies eight possible positions. Five are occupied above. The following three combinations are logically coherent but remain largely unoccupied in the literature:

  *   **Unnamed 1 (Yes → Varies → Yes):** *Objective Chance + Interest-Relative Class + Maximal Specificity.*
      *   **Why Empty:** This position is unstable. If the choice of class is driven by the inquirer's interests (Contextualism), it is unclear why one would be bound by a strict requirement for maximal causal specificity, which is a mind-independent feature of the world.
  *   **Unnamed 2 (No → Universal → No):** *No Objective Chance + Universal Rule + Coarse Priors.*
      *   **Why Empty:** If one accepts a universal rational rule (like Bayesianism) but rejects objective chance, there is little motivation to ignore relevant evidence (total evidence) in favour of coarse priors. This would amount to a rationality constraint that forbids learning from specific data.
  *   **Unnamed 3 (No → Discretionary → Yes):** *No Objective Chance + Discretionary Assignment + Maximal Specificity.*
      *   **Why Empty:** If the assignment is discretionary or pragmatic (Deflationism), there is no normative force compelling the agent to prioritise maximal specificity. One would simply use whatever description serves the pragmatic end.

  ### 3. Indistinguishable Leaves
  While the tree separates positions by principle, there are two leaves that the tree cannot reliably separate *empirically* in a 'kind' world:

  *   **The Homogeneity View** and **The Reichenbachian Rule.**
      *   **The Issue:** The tree separates these by the *rule* for selection (Specificity vs. Stability). However, if the world is such that the causally homogeneous class also happens to possess stable statistics, both views will select the exact same reference class.
      *   **Consequence:** In such cases, the tree identifies a metaphysical disagreement, but offers no decision procedure to distinguish the views based on the output alone. A student favouring one over the other must appeal to theoretical virtues (e.g., fidelity to causation vs. fidelity to frequency) rather than the resulting probability estimate.

  ---

  **Note for Seminar Discussion:**
  When discussing the *Subjectivist Dissolution*, consider whether conditionalising on "total evidence" truly solves the problem for the court. If the court's evidence *is* the coarse statistics (because they lack data on left-handed swimmers), does the Subjectivist collapse back into the Reichenbachian position? This boundary is where the tree's branches may blur.
