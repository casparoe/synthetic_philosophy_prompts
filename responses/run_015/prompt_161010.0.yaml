answer: |-
  # The Precautionary Space: A Diagnostic Quiz

  ## Part I: The Logical Architecture
  Before taking the quiz, understand the map. We are not sorting by labels (e.g., "Green," "Effective Altruist," "Libertarian"). We are sorting by five binary distinctions that carve the logical space of risk management. Your answers will place you in a cell defined by these coordinates:

  1.  **Symmetry (S):** Does the principle bind *omissions* (doing nothing) as strictly as *actions* (doing something)? Or does the status quo get a free pass?
  2.  **Threshold (T):** Is the trigger *scientific uncertainty* (we don't know the odds) or *any non-zero possibility* (there is a chance, however small)?
  3.  **Force (F):** Is the principle a *procedural burden* (shift the onus of proof to the proponent) or a *substantive veto* (forbid the action regardless of proof)?
  4.  **Proportionality (C):** Are the *costs of the precaution* weighed against the risk? Or is safety absolute, regardless of economic or opportunity cost?
  5.  **Recursion (R):** (The Novel Axis) Does the principle apply to *the precaution itself*? If a ban is irreversible or destroys future options, is that treated as a risk to be managed?

  ### The Empty Cell
  There is one combination that yields no inhabitants: **Symmetric + Any Risk + Substantive Veto + Absolute Cost + Recursive.**
  *   **Diagnosis:** Total Paralysis. If you must veto any action with non-zero risk, treat inaction as equally risky, ignore costs, and also fear the irreversibility of your own ban, you cannot act, cannot refrain from acting, and cannot ban. It is a logical singularity. No one lives here; they crash.

  ### Indistinguishable Leaves
  This quiz cannot separate the following pairs, as they produce identical outputs in concrete cases despite different internal justifications:
  *   **Strict Precaution vs. Maximin:** Both veto actions with catastrophic tails. Distinguishing them requires asking about utility functions, not choices.
  *   **Weak Precaution vs. Cost-Benefit with Fat Tails:** Both allow action if benefits outweigh risks. The former calls it "proportionality," the latter calls it "risk premium." The output is the same.

  ---

  ## Part II: The Quiz
  *Answer based on what you would actually do, not what sounds most virtuous.*

  **1. The Virology Pause**
  A lab proposes gain-of-function research on a virus family that has never caused a pandemic. There is no active outbreak. The benefit is better vaccine templates; the risk is a lab leak that *could* start one, though biosafety is high.
  *   **A.** Pause the work until we have a global treaty and better containment standards.
  *   **B.** Allow the work; the risk is speculative, and the vaccine benefit is concrete.
  *   **C.** Ban the work entirely; the downside is existential, regardless of current safety stats.

  **2. The Pollinator Pesticide**
  A new pesticide increases crop yield by 15%. Models suggest it *might* be contributing to a decline in a wild bee species, but field data is inconclusive and confounded by climate.
  *   **A.** License it with monitoring requirements; if bee populations drop, revoke later.
  *   **B.** Deny the license; we cannot prove it's safe for the bees, so the burden is on the manufacturer.
  *   **C.** License it; crop failure is a certain harm, while bee decline is uncertain and multifactorial.

  **3. The Asteroid Nudge**
  An asteroid has a 5% chance of hitting Earth in 50 years. A deflection mission has a 99% success rate, but a 1% chance of nudging the rock into a *worse* trajectory that guarantees impact.
  *   **A.** Launch the mission; 5% risk is worse than 1% risk.
  *   **B.** Do not launch; actively causing the guaranteed impact is morally worse than letting nature take its course.
  *   **C.** Do not launch; we should not intervene in celestial mechanics with such high stakes.

  **4. The Gene Therapy Hold**
  A cheap gene therapy cures a fatal childhood disease. Long-term data is missing; there is a theoretical risk of insertional mutagenesis (cancer) in 1 out of 10,000 patients twenty years later.
  *   **A.** Approve it; the certain death now outweighs the statistical cancer risk later.
  *   **B.** Hold it until 20-year data is available; we cannot trade certain future cancer for present life.
  *   **C.** Approve it with a registry; track patients to catch the side effect early.

  **5. The Mosquito Drive**
  A gene drive is designed to wipe out a malaria-carrying mosquito species. It is self-propagating; once released, it cannot be recalled.
  *   **A.** Do not release; we cannot undo the ecological change if the model is wrong.
  *   **B.** Release it in contained islands first; treat the containment as the reversible step.
  *   **C.** Release it; malaria kills humans now, and the ecological niche will likely be filled by harmless species.

  **6. The Pascal Wager**
  A physicist claims there is a 1 in $10^{50}$ chance that turning on a particle collider will vacuum-decay the universe. The cost of not turning it on is the loss of all future physics knowledge.
  *   **A.** Turn it on; probabilities that small are below the noise floor of our models.
  *   **B.** Do not turn it on; infinite loss (end of universe) times any non-zero probability is infinite expected cost.
  *   **C.** Do not turn it on; the claim is unfalsifiable, so it fails the burden of proof for safety.

  **7. The Geoengineering Lock-in**
  To stop rapid warming, we consider stratospheric aerosol injection. It works quickly, but if we stop suddenly, "termination shock" causes rapid heating that kills crops.
  *   **A.** Do not start; committing future generations to maintain the system is a moral hazard.
  *   **B.** Start it; the warming kills crops now, and future tech can solve the maintenance problem.
  *   **C.** Start it only if we pre-commit to a fusion backup; the precaution is the backup, not the ban.

  **8. The Black Box AI**
  An AI system optimizes grid energy perfectly but its decision logic is uninterpretable. It might find a loophole that causes a cascade failure in a rare edge case.
  *   **A.** Deploy it; efficiency saves lives via reduced energy cost and climate impact.
  *   **B.** Ban it; we cannot deploy systems we cannot audit for catastrophic failure modes.
  *   **C.** Deploy it in sandboxed regions only; treat the deployment as a test, not a final state.

  ---

  ## Part III: Scoring Key

  Tally your answers to determine your coordinates on the five axes.

  **Axis 1: Symmetry (S)**
  *Does the status quo get a free pass?*
  *   **Q3 (Asteroid):** Choose **A** (Act to reduce risk) = **S1** (Symmetric). Choose **B** (Don't act to avoid causing risk) = **S0** (Action-Only).
  *   **Q7 (Geoengineering):** Choose **B** (Act despite lock-in) = **S1**. Choose **A** (Don't act due to lock-in) = **S0**.
  *   *Score:* If you picked mostly A/B in these specific ways, you treat omissions as risky as actions.

  **Axis 2: Threshold (T)**
  *What triggers caution?*
  *   **Q1 (GoF):** Choose **C** (Ban on possibility) = **T1** (Any Non-Zero). Choose **A** (Pause for uncertainty) = **T0** (Uncertainty).
  *   **Q6 (Pascal):** Choose **B** (Ban on non-zero prob) = **T1**. Choose **A** (Ignore tiny prob) = **T0**.
  *   *Score:* T1 means you react to mere possibility. T0 means you require plausible uncertainty.

  **Axis 3: Force (F)**
  *Procedure or Veto?*
  *   **Q1 (GoF):** Choose **A** (Pause/Treaty) = **F0** (Procedural). Choose **C** (Ban) = **F1** (Veto).
  *   **Q8 (AI):** Choose **B** (Ban) = **F1**. Choose **C** (Sandbox/Test) = **F0**.
  *   *Score:* F1 means you forbid. F0 means you regulate/delay.

  **Axis 4: Proportionality (C)**
  *Do costs matter?*
  *   **Q2 (Pesticide):** Choose **C** (License for crops) = **C0** (Proportional). Choose **B** (Deny for bees) = **C1** (Absolute).
  *   **Q4 (Gene Therapy):** Choose **A** (Approve for cure) = **C0**. Choose **B** (Hold for side effect) = **C1**.
  *   *Score:* C1 means safety trumps cost/benefit. C0 means you weigh them.

  **Axis 5: Recursion (R)**
  *Do you fear the precaution?*
  *   **Q5 (Gene Drive):** Choose **A** (Don't release due to irreversibility) = **R0** (Ignore Recursion). Choose **B** (Contained test) = **R1** (Account for Option Value).
  *   **Q7 (Geoengineering):** Choose **C** (Backup required) = **R1**. Choose **A** (Don't start due to commitment) = **R0**.
  *   *Score:* R1 means you apply precaution to the precaution (preserving options). R0 means you view the ban as safe/final.

  ---

  ## Part IV: The Map (Where You Land)

  Combine your tallies (e.g., S1, T0, F0, C0, R1) to find your position.

  ### 1. The Weak Precautionary (S0, T0, F0, C0, R0)
  *   **Profile:** You see PP as a procedural burden of proof. You protect the status quo unless there is scientific uncertainty about significant harm. You weigh costs. You don't worry about the irreversibility of bans.
  *   **Real-World Match:** Rio Declaration signatories, standard Environmental Impact Assessments.
  *   **Blind Spot:** You may underestimate systemic risks that look "uncertain" rather than "probable."

  ### 2. The Strict Precautionist (S0, T1, F1, C1, R0)
  *   **Profile:** Any non-zero risk of catastrophe vetoes action. Costs are irrelevant. The status quo is safe; new things are suspect. You do not worry that a ban might destroy future options.
  *   **Real-World Match:** Certain bioconservative movements, hardline anti-GMO/anti-Nanotech stances.
  *   **Blind Spot:** Risk creep. By ignoring the risks of *inaction* (Symmetry) and the risks of *banning* (Recursion), you may inadvertently increase total risk.

  ### 3. The Recursive Risk Manager (S1, T0, F0, C0, R1)
  *   **Profile:** You treat inaction as risky as action. You care about uncertainty, not just possibility. You prefer testing/sandboxing over bans to preserve option value. You weigh costs.
  *   **Real-World Match:** "Rationalist" EA risk mitigation, Iterative Engineering safety cultures.
  *   **Blind Spot:** Can be accused of "gambling" with existential stakes by preferring testing over banning.

  ### 4. The Maximin Absolutist (S1, T1, F1, C1, R0)
  *   **Profile:** Avoid the worst-case outcome at all costs, symmetrically. If acting has a tail risk, don't act. If not acting has a tail risk (Asteroid), you are forced into a contradiction unless you find a third option.
  *   **Real-World Match:** Philosophical Maximin theorists (Rawlsian edge cases).
  *   **Blind Spot:** **The Empty Cell Warning.** If you add Recursion (R1) to this profile, you paralyze. You must check if your "safe" option is actually safe.

  ### 5. The Expected Utility Rejectionist (S1, T0, F0, C0, R1)
  *   **Profile:** You reject PP as a distinct principle. You fold everything into Expected Utility with fat tails. You account for option value (Recursion) and symmetry, but you calculate rather than veto.
  *   **Real-World Match:** Longtermist Utilitarians, Quantitative Risk Analysts.
  *   **Blind Spot:** Model uncertainty. If the probabilities are unknowable (not just tiny), your calculation is a hallucination.

  ### 6. The Paralysis Cell (S1, T1, F1, C1, R1)
  *   **Profile:** **Empty.**
  *   **Diagnosis:** If you scored here, you require a meta-rule. You cannot hold all five positions simultaneously. You must drop Symmetry (accept status quo bias), drop Recursion (accept bans as final), or drop Force (accept procedure over veto). Most people who score here are actually **Recursive Risk Managers** who momentarily panicked on the Threshold question.

  ---

  ## Part V: Diagnosis of the Recursion Axis
  *Why this axis matters.*

  The **Recursion (R)** axis is the most common point of failure for traditional Precautionary Principle applications.
  *   **If R=0:** You treat a ban as a "safe harbor." This leads to technologies being permanently shelved (e.g., nuclear power in some jurisdictions) without accounting for the risk of the alternative (e.g., carbon emissions).
  *   **If R=1:** You treat a ban as a *decision with risks*. This pushes you toward **sandboxing** (Q5 Option B) or **backup requirements** (Q7 Option C).
  *   **The Shift:** Adding Recursion often pushes **Strict Precautionists** toward **Recursive Risk Managers**. Once you admit that "stopping" can be irreversible and dangerous, the "Just Say No" heuristic collapses into a "How to Test Safely" engineering problem.

  *Note on Indistinguishability:* If you scored as a **Weak Precautionary** but your reasoning was "I weighed the risk premium," you are functionally identical to a **EU Rejectionist**. The quiz measures output, not internal ontology. If you scored **Strict Precautionist** but your reasoning was "I minimize the maximum loss," you are a **Maximin** player. The distinction only matters when the utility function is non-linear.
