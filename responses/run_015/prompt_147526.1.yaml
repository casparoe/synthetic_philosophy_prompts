answer: |-
  **Brainstorming and Dialectical Map**

  *   **The Historical Move:** Content is fixed by the original selection history (bat detection).
      *   *Rejection:* Ignores current functional integration. A map repurposed for art is no longer a navigational aid; the current consumer determines current use.
  *   **The Producer-Proliferation Move:** Content is fixed by what currently selects for the receptor's reproduction (male detection).
      *   *Rejection:* Collapses the distinction between the signal's role and the gene's fitness. The receptor is a shared resource serving distinct downstream systems.
  *   **The Specificity Move:** Content is the most specific Normal condition (e.g., "Bat-or-Male").
      *   *Rejection:* Disjunctive contents fail to guide action appropriately. The motor outputs required for bats (dive) and males (approach) are incompatible; the system cannot treat them as one condition.
  *   **The Pluralist Position:** Content is relative to the consumer system's proper function.
      *   *Constraint:* Only systems with a *proper function* (selected effect) count, not accidental causal users.
      *   *Misrepresentation:* The waterfall is not a third content because no consumer was selected to respond to waterfalls. It is a false positive for the male-content.

  ***

  **The Case for Content Pluralism in Teleosemantics**

  Your cave moth case is a philosopher's gift, precisely because it isolates the variables that standard teleosemantic accounts usually conflate. To naturalise content, we must look to Ruth Millikan's machinery: a signal has content determined by the *proper function* of the system that consumes it. The proper function is not what the system *does* now, but what it was selected by ancestors to do. The content of the signal is the condition in the world that must obtain for the consumer to perform that proper function successfully.

  In your cave, we have one producer (the A1 receptor) and two consumers (the vestigial evasion circuit and the active phonotaxis circuit). The orthodox teleosemantic intuition seeks a unique content. I shall argue that this intuition is misplaced. The A1 firing carries determinate content relative to each consumer, yielding a stable pluralism.

  First, consider the **Historical Move**. One might argue that because the receptor was originally selected for bat detection, its content is permanently fixed as *bat*. This fails because teleosemantics is not etymological; it is functional. Content is determined by the mapping relation between signal and consumer response. If the consumer system changes its proper function, the content relative to that system changes. While the evasion circuit retains the historical proper function of *bat-evasion*, the receptor now feeds a new circuit with the proper function of *mate-location*. To insist the signal *only* means "bat" is to ignore the current biological reality where the signal drives reproduction, not survival. The history of the producer matters, but it does not override the current proper functions of the consumers it serves.

  Second, the **Producer-Proliferation Move**. One might claim the content is simply whatever currently causes the receptor to be selected (i.e., *male*). This reduces content to a gene's-eye view of fitness, losing the intentional granularity required for psychology. The receptor is a shared interface. If we say the content is only *male*, we cannot explain why the vestigial circuit is wired to drive a dive. That circuit has a proper function (inherited from the surface population) distinct from the phonotaxis circuit. The receptor supports both lineages of consumption. To collapse them is to erase the functional architecture of the nervous system. The signal is a common currency spent in two different economies; its value differs in each.

  Third, the **Specificity Move**. Perhaps we unify the content into a disjunction: *bat-or-male*. This fails the test of Normal conditions. For the evasion consumer, the Normal condition is "bat present, no male required". For the phonotaxis consumer, the Normal condition is "male present, no bat required". These conditions are mutually exclusive in terms of the required motor output (dive versus approach). A disjunctive content cannot guide the specific motor routines selected for each scenario. The system does not treat "bat-or-male" as a single category; it processes the same signal through two distinct channels with incompatible success conditions. Therefore, the content cannot be unified without destroying the explanatory power of the teleosemantic account.

  This leaves us with **Content Pluralism**. The A1 firing state represents *bat* relative to the evasion consumer and *male* relative to the phonotaxis consumer. Is this not "cheap content"? No, because the constraint remains rigorous: a consumer only generates content if it possesses a *proper function*. Accidental causal effects do not count. If the A1 firing accidentally triggered a digestive reflex, that would not generate content, because digestion was not selected to be driven by A1. Content is not cheap; it is strictly indexed to selected-effect systems.

  This brings us to the **Waterfall Objection**. If content is indexed to consumers, why is the waterfall not a third content (*waterfall*)? Why is the drowning female not simply acting correctly relative to a waterfall-content? The answer lies in the definition of proper function. No consumer system in the moth was selected by ancestors to guide the moth toward waterfalls. There is no lineage of selection where responding to waterfalls increased fitness. Therefore, there is no consumer for whom "waterfall" is the Normal condition.

  When the female orientates to the waterfall, the phonotaxis consumer is active. Its proper function is mate location. Its Normal condition is the presence of a male. The waterfall triggers the signal, but the condition *male* is not met. Consequently, the consumer fails to perform its proper function (the moth drowns rather than mates). This is a classic case of misrepresentation. The signal carries the content *male* (relative to this consumer), but the world supplies water. The system is in error because the Normal conditions for the consumer's success are violated.

  So, what is the right thing to say about the drowning females? They are victims of false positives. Their phonotaxis system is functioning correctly in terms of mechanism (responding to A1), but it is operating outside its Normal conditions. They represent the waterfall as a male. This is not a third content; it is a failure of the existing content to map onto reality. The pluralist view handles this elegantly: the signal means *male* to the phonotaxis circuit, and the water fails to satisfy that meaning.

  **Misgivings**

  I have defended this position as requested, but I must confess a lingering unease. Pluralism saves the phenomena of your cave moths, but it risks making content too internalist. If content is entirely relative to the consumer, does the signal itself possess any intrinsic intentionality, or is it merely a switchboard label? Furthermore, regarding the vestigial bat-circuit: if it can no longer produce behaviour, does it truly retain a proper function, or is it merely a phantom limb? If the latter, the "bat-content" may be historical ghosting rather than genuine representation. Nevertheless, until a better account of mixed-lineage systems emerges, pluralism remains the most honest description of the biological machinery.
