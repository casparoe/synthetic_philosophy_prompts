prompt: |-
  The Gould–Lewontin critique of the adaptationist programme has circulated for over four decades, yet evolutionary biology still cycles through the same standoff: genome-scale studies claim to partition adaptive from non-adaptive sequence, and critics reply that the statistical models already presuppose the distinction they claim to measure. I am not asking for a survey of interpretations, a bibliography, or citations. I want a diagnosis of why this particular disagreement has stalled, together with an honest assessment of whether my framing of it is confused.

  My working hypothesis is that the impasse is not mainly empirical—there is no hidden dataset that would settle it—but conceptual and methodological, with both sides using the same vocabulary to ask different questions. One camp treats an adaptive explanation as a historical claim about the selective regime that originally constructed a trait; the other treats it as a functional claim about the trait's present contribution to fitness, regardless of evolutionary origin. At the same time, the category of "spandrel" has fragmented: some biologists use it for any feature not directly shaped by selection, while others reserve it for structurally necessary byproducts of other adaptations—like the triangular spaces between arches in San Marco—thereby excluding mere evolutionary accidents or exaptations. Meanwhile, ideas that have entered the literature more recently—constructive neutral evolution, evolutionary capacitance, and the distinction between exaptation and spandrel—suggest that non-adaptive origins and later functional co-option are routine rather than exceptional. If we adopted a stricter taxonomy that separated spandrels (developmentally entrenched architectural side-effects) from exaptations (traits that acquired new functions after originating for different reasons or for none) and from capacitance (cryptic variation revealed only under stress), would the original debate dissolve, or would it simply relocate to disputes about developmental entrenchment?

  Please diagnose the disagreement using what each side actually says: the original architectural analogy, the defense of the adaptationist programme by its modern proponents, and the responses from evolutionary genomics. Is this a verbal disagreement about the word "adaptation," a substantive disagreement about the prevalence of selection versus drift and architecture, a methodological disagreement about what counts as evidence for selection, or an instance of two research programmes answering different questions—one about evolutionary origins, one about current function—under a single heading? And given your diagnosis, what would actually count as progress: a formal result showing that selection coefficients are unidentifiable from sequence data alone; a conceptual distinction that cleanly separates origin from utility; or an argument that the question is ill-posed because "adaptation" functions as a family-resemblance term?

  One further request: I have deliberately injected the intersection of spandrel taxonomy with evolutionary capacitance and constructive neutral evolution into this framing, treating spandrels specifically as developmentally entrenched side-effects rather than as generic non-adaptive traits. If this framing rests on a confused premise—if, for example, spandrels and exaptations are not separable in principle, or if evolutionary capacitance is irrelevant to the Gould–Lewontin critique—say so plainly rather than accommodating the confusion. Likewise, if the task requires specific quantitative or historical claims I have not supplied, point that out. I want pushback where warranted, explicit confidence levels where the diagnosis is speculative, and clear flags wherever you are reconstructing a position rather than reporting settled consensus.
