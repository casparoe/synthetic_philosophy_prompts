answer: |-
  ### Diagnosis of the Stall

  **Confidence Level: High**

  The impasse is primarily **methodological**, underpinned by a **conceptual** ambiguity. It is not merely a verbal dispute, nor is it waiting on empirical data.

  1.  **The Methodological Core (The Null Model Problem):**
      Modern genomic adaptationism relies on statistical null models (e.g., neutral theory expectations) to identify "outliers" presumed to be adaptive. The G-L critique persists because these null models often fail to capture the complexity of genomic architecture (e.g., linked selection, biased gene conversion, mutational hotspots). When a genomicist claims to have identified a selective sweep, the critic replies that the null model assumed independence between sites or constant mutation rates, which is biologically false. The "adaptive" signal is often an artifact of a misspecified null. This is not a disagreement about whether selection exists, but about whether current methods can *isolate* it from non-adaptive structural noise.

  2.  **The Conceptual Core (Origin vs. Utility):**
      Your hypothesis here is correct and constitutes the major source of talking past one another.
      *   **Adaptationists (Operational):** Often define adaptation as "current utility maintained by selection." If a sequence is conserved or shows a signature of positive selection, it is treated as an adaptation.
      *   **Critics (Historical):** Define adaptation strictly as "a trait evolved *because* it increased fitness in the past."
      *   **The Conflict:** Genomics is excellent at detecting *constraint* (purifying selection) and sometimes *change* (positive selection), but it cannot distinguish between a trait maintained by selection because it is useful (adaptation) versus a trait maintained by selection because it is structurally coupled to something else (architectural constraint). The data (sequence conservation) looks the same for both.

  **Verdict on your framing:** Your diagnosis that the sides ask different questions (historical regime vs. present contribution) is accurate. However, it is incomplete to say they *only* ask different questions. They both claim to answer the historical question, but they disagree on whether the statistical tools are capable of doing so.

  ---

  ### Assessment of the Taxonomy Proposal (Spandrels vs. Exaptations vs. Capacitance)

  **Confidence Level: Moderate (Speculative on outcomes)**

  You propose that a stricter taxonomy—reserving "spandrel" for developmentally entrenched architectural side-effects, separating "exaptation" (co-option), and isolating "capacitance" (cryptic variation)—would dissolve the debate.

  **Diagnosis:** This would **not dissolve the debate; it would relocate it.**

  1.  **The Epistemological Barrier:**
      Even if we agree on definitions, we lack the methods to assign traits to these categories with certainty.
      *   To identify a **Spandrel** (in your strict sense), you must prove developmental entrenchment and the absence of direct selection.
      *   To identify an **Exaptation**, you must reconstruct the ancestral function and show it differed from the current one.
      *   To identify **Constructive Neutral Evolution (CNE)**, you must show complexity increased via ratchet-like mechanisms without fitness gain.
      *   **The Problem:** All three inferences require the same historical reconstruction that is currently stalled. If you cannot reliably distinguish selection from drift in the first place, you cannot reliably distinguish a spandrel from an adaptation. A stricter taxonomy clarifies the *categories* but does not solve the *classification* problem.

  2.  **Pushback on Capacitance:**
      **Confidence Level: High**
      Your inclusion of **evolutionary capacitance** in this specific triad is conceptually loose.
      *   **Relevance:** Capacitance (e.g., Hsp90 buffering) explains the *release* of cryptic variation under stress. It is a mechanism for evolvability.
      *   **Irrelevance to G-L:** The G-L critique concerns the *fixation* and *origin* of traits, not the storage of variation. Capacitance explains how variation becomes available for selection (or drift); it does not inherently argue against adaptationism. A trait revealed by capacitance can still be fixed by selection. Therefore, capacitance is not a direct counter-category to adaptation in the same way CNE or spandrels are. Including it muddies the ontological distinction between "origin mechanisms" (CNE, Spandrel) and "variation dynamics" (Capacitance).

  3.  **Pushback on Spandrel/Exaptation Separability:**
      **Confidence Level: Moderate**
      You suggest these are separable in principle. In practice, they are often indistinguishable.
      *   A "spandrel" (architectural byproduct) often becomes an "exaptation" almost immediately. If a structural byproduct confers even a minute fitness advantage, selection acts on it.
      *   **The Grey Zone:** Once selection acts on a spandrel, is it still a spandrel? Gould argued yes (origin matters); modern adaptationists argue no (current maintenance matters). A stricter taxonomy forces a binary on a continuum. It creates a boundary dispute rather than resolving the underlying inference issue.

  ---

  ### What Counts as Progress?

  You offer three options:
  1.  A formal result showing selection coefficients are unidentifiable from sequence data alone.
  2.  A conceptual distinction separating origin from utility.
  3.  An argument that "adaptation" is a family-resemblance term.

  **Diagnosis:**
  *   **Option 1 (Identifiability):** **This is the only path to scientific resolution.** If a formal proof demonstrates that sequence data under realistic biological conditions (linked sites, variable mutation rates) cannot mathematically distinguish between selective and non-selective models, the adaptationist programme in genomics hits a hard limit. This forces a methodological overhaul.
  *   **Option 2 (Conceptual Distinction):** This is necessary for *communication* but insufficient for *science*. We already have the words (adaptation vs. exaptation vs. spandrel). The problem is not vocabulary; it is inference.
  *   **Option 3 (Family-Resemblance):** This is philosophical surrender. It dissolves the debate by declaring it meaningless, which may be true philosophically but halts research progress.

  **Recommendation:** Progress requires **Option 1**, supported by **Option 2**. We need identifiability theorems that tell us what data is *required* to distinguish these categories, acknowledging that sequence data alone may be insufficient without developmental or paleontological input.

  ---

  ### Summary of Pushback on Your Framing

  1.  **Is the impasse empirical?** You claim "no hidden dataset would settle it."
      *   **Correction:** **Low Confidence/Disagree.** New data types *could* settle it, but not more sequence data. High-resolution developmental maps (to prove architectural constraint) or deep-time phenotypic reconstructions (to prove exaptation) could break the stalemate. The stall is due to reliance on *sequence data alone* to answer historical questions.
  2.  **Is Capacitance relevant?**
      *   **Correction:** **High Confidence.** As noted above, capacitance is orthogonal to the G-L critique. CNE (Constructive Neutral Evolution) is the relevant concept here. CNE explains complexity without selection; Capacitance explains variation storage. Conflating them weakens your taxonomy.
  3.  **Will stricter taxonomy solve it?**
      *   **Correction:** **High Confidence.** No. It creates sharper boxes but does not provide a way to sort the traits into them. It relocates the dispute to "Is this trait developmentally entrenched?" which is just as hard to answer as "Was this trait selected?"

  ### Final Verdict

  Your framing is **80% correct** on the diagnosis of the stall (methodological/conceptual confusion regarding origin vs. utility) but **over-optimistic** regarding the utility of a stricter taxonomy. The debate persists not because we lack labels, but because the **inverse problem** of evolutionary inference is ill-posed: multiple historical processes (selection, drift, architectural constraint, CNE) produce indistinguishable genomic signatures.

  **Progress Condition:** The debate will only move when the field accepts that sequence data cannot resolve the adaptation/spandrel distinction without independent evidence of developmental constraint or ancestral function. The stall is a failure of **identifiability**, not terminology.
