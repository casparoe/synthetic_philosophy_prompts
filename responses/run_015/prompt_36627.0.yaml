  **Scholarly Note**

  Within Madhyamaka, the identification of emptiness (śūnyatā) with dependent origination (pratītyasamutpāda) is doctrinally stable, grounded in *Mūlamadhyamakakārikā* 24.18. However, scholars contest how Nāgārjuna's negation of the tetralemma functions. Traditional commentators often read the four horns as exhaustive metaphysical claims about intrinsic nature, all denied via classical logic (*prasajya-pratiṣedha*). Contemporary analytic philosophers, notably Garfield and Priest, argue for a paraconsistent reading where contradictory horns may hold conventionally, rejecting the law of non-contradiction. Further debate concerns whether emptiness is an ontological thesis or merely therapeutic.

  This poem leans toward the therapeutic, classical-negation reading. By framing the horns as imperatives ("Say that...") juxtaposed with questions undermining their subjects ("Where is the one...?"), it treats the positions as conceptual fixations rather than truth-claims. The final stanza does not affirm the fourth horn despite ending on it; rather, the preceding questions void the assertion, enacting the "emptiness of emptiness" without positing a fifth view. The form's circularity mimics dependent origination, yet the shifting contexts prevent any line from retaining intrinsic meaning, reflecting the contested view that language itself is empty.
