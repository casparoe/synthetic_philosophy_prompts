  **The Four Corners of Silence**

  Say that he survives.
  Say that he ceases.
  Say that he neither survives nor ceases.
  Say that he survives and ceases.

  Say that he ceases.
  Dependence makes the world.
  Say that he survives and ceases.
  The world makes dependence.

  Dependence makes the world.
  Where is the one who goes?
  The world makes dependence.
  Where is the going gone?

  Where is the one who goes?
  Say that he survives.
  Where is the going gone?
  Say that he neither survives nor ceases.

