  ### 4. The Single Revision That Fixes The Most

  **Revise Claim (6).**

  **Current:** "Privacy law should aim only at stopping discrimination and manipulation, not at dignity or autonomy as ends in themselves."
  **Revision:** "Privacy law should aim to prevent harm **and protect individual autonomy.**"

  **Why this is the lever:**
  1.  **Resolves (4) vs. (6):** If autonomy/dignity is a legal end, "Existential Opacity" (4) becomes a protectable interest, not just a philosophical hobby.
  2.  **Resolves (2) vs. (3):** If autonomy is protected, "Unconditional Audit" (2) can no longer blindly override Consent (3). It forces a balancing test (Audit Need vs. Autonomy) rather than a hard override.
  3.  **Resolves (1) vs. (4):** Contextual norms (1) are often based on autonomy. Recognizing autonomy allows (1) and (4) to coexist as different expressions of the same value.
  4.  **Resolves (3) vs. (5):** It validates Consent (3) as an exercise of Autonomy, even if ongoing Control (5) is dropped.

  **Summary:** Your package fails because you tried to build a **human-rights framework** (4, 5) on top of a **utilitarian legal engine** (6) with a **surveillance override** (2). Changing (6) to acknowledge autonomy aligns the engine with the framework. Changing (2) is the second-best option, but it leaves your philosophy headless.
