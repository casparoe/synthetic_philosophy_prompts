  *   **Fix for (2) vs. (3):** Qualify **(2)**. Change "breaking anonymization" to "accessing raw data within a secure enclave without public release."
      *   *Cost:* Low. Auditors still see data, but the public privacy promise (3) isn't breached.
  *   **Fix for (1) vs. (4):** Qualify **(1)**. Add "where no specific context exists, a default norm of opacity applies."
