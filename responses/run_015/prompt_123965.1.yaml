answer: |-
  You are reading the text very closely, and your intuition about the "corporate" nature of the people is sharp. You are not merely projecting modern philosophy onto the text, though the terminology needs to be translated from medieval political theology into modern analytic terms.

  The passage you are referencing is from **Book I, Chapter 6 of *De Regno* (On Kingship)**. This is the crucial locus for Aquinas's theory of resistance.

  Per your request, let's first brainstorm the key distinctions Aquinas draws in this context. These distinctions form the architecture of his argument and determine where the "line" is drawn between legitimate resistance and sinful sedition.

  ### Brainstorming: Key Distinctions in Aquinas's Theory of Resistance

  1.  **Origin of Authority (Usurpation vs. Legitimacy):**
      *   *Usurper:* Someone who seizes power without right. Aquinas is more permissive here; since they never had authority, they are essentially private aggressors.
      *   *Legitimate King turned Tyrant:* Someone who was rightly installed but abuses power. This is the harder case, because the authority was originally valid.

  2.  **Mode of Action (Private vs. Public):**
      *   *Private Initiative:* An individual acting on their own judgment to kill or remove the ruler. Aquinas explicitly condemns this (citing the danger of worse successors and the violation of order).
      *   *Public Authority:* Action taken by the community *as a body* or by a superior authority representing the community. This is the only licit path.

  3.  **Moral Categorization (Sedition vs. Justice):**
      *   *Sedition:* Opposing the unity of the multitude. Usually a sin.
      *   *Resistance to Tyranny:* Aquinas argues the tyrant is the one committing sedition by disrupting the common good. Therefore, removing him is not sedition but the restoration of unity.
      *   *Caveat:* If removing the tyrant causes greater disorder (civil war) than the tyranny itself, patience is preferred.

  4.  **Source of Power (Divine vs. Human Mediation):**
      *   *Ultimate Source:* God (all power is from God).
      *   *Proximate Source:* The community (in elective or conditional kingships).
      *   *Implication:* If the human mechanism designates the king, the human mechanism can potentially unde-signate him.

  ***

  ### Parsing the "People" as a Corporate Agent

  Now, to your specific question: **Is Aquinas treating the people as a corporate agent with retained authority, or just an aggregation of private judgments?**

  You are correct to sense that "collective intentionality" is at play, but Aquinas frames this through the medieval legal concept of the **_universitas_** (corporation) or the **_corpus mysticum_** (mystical body), rather than modern social ontology.

  Here is how we parse the text to answer your worry about projection:

  #### 1. It is NOT Private Judgment (The Aggregation View)
  Aquinas explicitly rejects the idea that "the people" means "any angry individual." In *De Regno* I.6, he warns that if private individuals take it upon themselves to kill tyrants, even bad ones, it often leads to greater danger. He cites the killing of Julius Caesar as a negative example: the conspirators thought they were liberators, but the result was worse tyranny under Augustus.

  If Aquinas viewed the people merely as an aggregation of individuals, he would have to allow for private judgment. He does not. He insists that the action must not be *privata praesumptione* (by private presumption).

  #### 2. It IS Corporate Authority (The _Universitas_ View)
  Your intuition that the people retain a "shared intentional stance" is historically accurate, provided we understand that stance as **juridical** rather than psychological.

  Aquinas writes:
  > *"If it belongs to the multitude to provide itself with a king, it can also depose the king thus established, or restrict his power, if he abuses it tyrannically."*

  Notice the subject: **_Multitudo_** (the multitude). In medieval law, the *multitudo* is not a mob; it is the **community as a legal entity**.
  *   **Retained Authority:** Aquinas argues that authority flows from God *through* the people to the king. If the people are the *proximate* cause of the king's authority (via election or acclamation), they retain a "residual sovereignty." They do not alienate their power absolutely; they lend it conditionally for the common good.
  *   **The Corporate Line:** The line is drawn at **_publica auctoritas_** (public authority). The "people" can only act through a mechanism that represents the whole body. In a feudal context, this might mean the barons, the estates, or a superior lord (like an Emperor judging a King). In a civic context, it means the magistrates acting for the _universitas_.

  #### 3. Avoiding the Modern Projection
  You asked if you are projecting modern philosophy. Here is the nuance:
  *   **Modern Collective Intentionality:** Often implies a democratic consensus or a shared psychological state among citizens.
  *   **Aquinas's Corporate Body:** Implies a **hierarchical representation**. The "people" acting as a corporate agent does not mean a referendum. It means the *leaders of the community* acting in the name of the whole.

  So, when Aquinas says "the people" can depose the king, he does not mean a revolution from below by the masses. He means a **constitutional correction from within the body politic**, executed by those who hold the standing to represent that body.

  ### The Verdict on the "Line"

  The line you are trying to find rests on **jurisdiction**, not just morality.

  1.  **Who can act?** Only an authority that stands *above* the king in the specific constitutional arrangement, or equal to him as the representative of the whole (the _universitas_). A private citizen has no jurisdiction over the king. The _populus_ as a corporate entity *does* have jurisdiction over the office of kingship.
  2.  **Why?** Because the tyrant has broken the pact of the common good. Since the king exists *for* the community (teleological purpose), when he destroys the community, he forfeits the claim to the community's obedience.
  3.  **The Restraint:** Even if the _populus_ has the right, Aquinas adds a utilitarian restraint: Do not exercise this right if the resulting turmoil (_perturbatio_) will be worse than the tyranny. This is why he often prefers appealing to a higher secular authority (like the Emperor) or spiritual authority (the Pope) rather than immediate deposition.

  ### Summary
  You are not projecting. Aquinas **does** treat the people as a unified body with retained authority. However, he conceptualizes this unity legally (as a corporation/_universitas_), not psychologically (as shared intentionality).

  The "line" is this: **Private assassination is murder and sedition; Public deposition by the community's representatives is an act of justice.** The authority to resist resides in the *office* of the community, which survives the individual members, and is exercised through public mechanisms, not private will.
