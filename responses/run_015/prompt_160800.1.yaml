prompt: |-
  hi — i'm a 3rd year phd student in corpus pragmatics and ive somehow become the person who breaks every tie on our lab's annotation project. The data is ~12k comments scraped from a hobbyist forum; we label each one for (a) does it contain a personal attack and (b) is it on-topic for the thread. Two undergrad RAs label independently and i adjudicate. Volume is brutal: 60–90 seconds per disputed item, ~40 a week. The RAs are sharp but have no theory background at all, so whatever i hand them has to fit in two pages and be runnable by someone who has never thought about anything. Stakes: the corpus gets released publicly, two of my chapters and someone else's paper hang off it, and a reviewer will definately ask why item 4021 is yes and 4022 is no — so i need a decision log, not vibes.

  I fell into a rabbit hole reading about the sorites paradox (the heap thing: taking away one grain never turns a heap into a non-heap, iterate that, and there are no heaps) and it feels like exactly the right diagnosis of what keeps breaking in our manual. What i can't do is turn it into something my RAs can actually run. So: give me the procedure.

  Things i think the procedure has to contain — push back if any of this is the wrong shape:

  - a step that happens before any threshold is set, fixing what the label is *for* (the downstream use) and the comparison class. I've noticed our boundary slides depending on whether we're training a classifier vs. informing a moderation policy, and that feels like it should be a feature rather than a bug, but I don't know how to write it down so it survives contact with an undergrad.
  - a rule about which items are allowed to serve as anchors. My suspicion is that items sitting right next to the grey zone look like clear cases but are terrible anchors, and that's been quietly poisoning our calibration. If that's right, say what qualifies as a real anchor instead.
  - a rule about how *not* to reason. The thing my RAs do constantly is: if 4021 is an attack then 4022 has to be too, they're basically the same. That looks like exactly the tolerance move that generates the paradox, so the manual needs to forbid it in a way they'll accept. And then I need to know what to do when following the rule produces a verdict that feels wrong for precisely that reason — is that a bug to fix or a cost to just eat?
  - the grey zone itself: when to declare an item penumbral instead of forcing yes/no, what to do with penumbral items at release time, and how wide we should *expect* the zone to be. If 35% of my data comes out penumbral I want to know whether that's normal or evidence my manual is broken.
  - the regress problem. Any rule i write for the grey zone seems to grow its own grey zone. I need a rule that stops: at this point you pick, deterministically, you write down what you picked, you move on. And I need to know which of those stopping points are matters of fact and which are genuinely value calls I have to own — and whether the PI signs off on those or I do.
  - a test for telling RA *error* apart from genuine borderline-ness when they disagree. We currently treat every disagreement identically and I'm fairly sure that's wrong.

  Separately: several items are vague on more than one dimension at once (affectionate mockery, an insult aimed at a third party, a slur used as in-group reclamation). I don't know whether to threshold on a composite severity score or decompose into sub-features first. If you have an opinion, argue it, and say what the decomposition costs.

  Then run it on three items, and please include at least one where the procedure gives me an answer I won't like:

  1. A pair that differs in exactly one small respect, where the RAs split and the if-one-then-the-other pressure is strongest. Concretely: A is *that wiring is a crime*; B is *that wiring is a crime, did you learn to solder from a youtube short*. Thread is someone posting a photo of a badly soldered pedalboard.
  2. An item everyone agrees is a clear attack but which sits one step from the grey zone — is it allowed to be an anchor?
  3. An item where the two ends of the severity chain disagree about where the grey zone starts: climbing up from banter it reads as friendly, coming down from an unambiguous slur it reads as an attack. (Ours is a reclaimed slur between two users who banter constantly.)

  Finally, be straight about what this procedure can't do — in particular whether my existing 12k labels are salvageable or contaminated, since that decides whether i have to redo the whole thing before i can write chapter 3.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** 3rd-year PhD student in Corpus Pragmatics.
      *   **Problem:** Annotation project (12k comments, personal attack + on-topic) is stalling due to vagueness/boundary issues (Sorites Paradox).
      *   **Constraints:**
          *   RAs are sharp undergrads, no theory background.
          *   Manual must be $\le$ 2 pages, runnable.
          *   High stakes: Public corpus, chapters/papers depend on it, reviewer scrutiny expected.
          *   Need a decision log (not vibes).
          *   Specific requirements: Downstream use definition, Anchor rules, Forbidden reasoning (tolerance), Grey zone handling (penumbra), Regress stopping rule, Error vs. Borderline test, Multidimensional vagueness strategy.
          *   Deliverables: The Procedure, Application to 3 specific cases, Honesty about limitations/salvageability.
      *   **Tone:** Professional, academic but practical, direct, acknowledging the theoretical depth without drowning the RAs in it.

  2.  **Deconstruct the Theoretical Problem (Sorites in Annotation):**
      *   The Sorites Paradox arises from *tolerance* (small changes don't change the category) and *transitivity* (if A=B and B=C, then A=C).
      *   In annotation, this manifests as "boundary drift."
      *   Solution isn't to solve the paradox philosophically (impossible) but to *manage* it operationally.
      *   Key concept: *Operationalization over Ontology.* We aren't defining "Attack" in the abstract; we are defining "Attack-for-This-Project."

  3.  **Drafting the Procedure (The "2-Page Manual" Core):**
      *   *Requirement 1: Downstream Use/Comparison Class.* Need a "North Star" statement. Why are we labeling? (e.g., "To train a moderator bot" vs. "To study linguistic aggression"). Let's assume the user's context: Corpus Pragmatics (study of usage). So the goal is *analytic utility*, not necessarily *safety*.
      *   *Requirement 2: Anchors.* Avoid "near-miss" anchors. Use *prototypes* (central cases), not *boundaries*.
      *   *Requirement 3: Forbidden Reasoning.* Explicitly ban "Transitive Labeling" (If A is Yes, and B is like A, B is Yes). Require *Independent Evaluation*.
      *   *Requirement 4: Grey Zone (Penumbra).* Need a "Tie-Breaker" rule. Don't let it regress. Use a "Precedence Log."
      *   *Requirement 5: Error vs. Borderline.* Disagreement $\neq$ Borderline. Disagreement often means unclear instructions. Borderline means clear instructions + ambiguous data.
      *   *Requirement 6: Multidimensionality.* Decompose first. Composite scores hide the *why*.

  4.  **Developing the Specific Rules (Iterative Refinement):**

      *   *Anchors:* If an item is "clear but close to the line," it's dangerous. A real anchor is *unambiguously* central. E.g., "You are an idiot" (Attack) vs. "I disagree" (Not Attack). Not "You are wrong" (Could be either).
      *   *Forbidden Reasoning:* Call it the "No Chain Rule." Label item $N$ without looking at item $N-1$.
      *   *Grey Zone:* If it takes $>X$ seconds or requires $>Y$ mental gymnastics, it's Penumbral. But we need a binary for the corpus. So: Penumbral items get a specific tag (e.g., `0.5` or `UNCERTAIN`), but for the *binary* release, we need a deterministic rule. Let's suggest a "Benefit of the Doubt" rule or a "Conservative" rule based on the downstream use. Actually, for a corpus, keeping the uncertainty is better. Let's suggest a 3-way label (Yes/No/Border) or a confidence score. *Correction:* User asks for Yes/No mostly, but mentions penumbra. Let's propose a "Forced Choice with Flag" system.
      *   *Regress:* The "Adjudicator's Veto." Once the PI/Lead decides, it's precedent.
      *   *Error vs. Borderline:* Use Inter-Rater Reliability (IRR) metrics locally. If RAs disagree on *clear* anchors, it's training error. If they disagree on *complex* cases, it's borderline.

  5.  **Addressing the Multidimensionality Question:**
      *   *Composite vs. Decomposed:* Decompose. "Personal Attack" is a construct. Is it intent? Effect? Lexical? If you composite, you lose the ability to explain *why* 4021 is Yes and 4022 is No.
      *   *Cost:* More columns in the CSV, more cognitive load for RAs. *Benefit:* Defensible against reviewers.
      *   *Recommendation:* Decompose into features (Target, Intent, Severity), then map to Final Label via a decision tree.

  6.  **Running the Procedure on the 3 Cases:**

      *   *Case 1 (The Pair):* "Wiring is a crime" vs. "...learned from Youtube."
          *   *Pressure:* If one is attack, other must be.
          *   *Procedure:* Independent eval.
          *   *Analysis:* "Crime" is metaphorical hyperbole (common in hobbyist forums). "Youtube short" implies incompetence.
          *   *Verdict:* Likely both "No Attack" (On-topic criticism) OR both "Attack" (Personal competence). The *difference* is negligible.
          *   *Unliked Answer:* The procedure might force them to be *different* if the threshold is lexical, or force them to be the *same* despite intuition. Let's make the procedure force a distinction based on *Target*. "Wiring is a crime" = Work. "You learned from Youtube" = Person.
          *   *Wait, the prompt asks for an answer I won't like.* The "No Chain Rule" might force me to label them differently if I evaluate them weeks apart, OR it forces me to label them the same when my gut says the second is worse. Let's go with: The procedure forbids using A to label B. If A is No, B must stand on its own. B might be Yes. This breaks the transitivity intuition.
      *   *Case 2 (Clear Anchor near Grey):*
          *   *Rule:* Anchors must be *central*, not *clear boundary*.
          *   *Verdict:* Not an anchor. It's a "boundary guard," not a prototype. Using it risks drift.
      *   *Case 3 (Reclaimed Slur/Banter):*
          *   *Issue:* Context dependence.
          *   *Procedure:* Check "Comparison Class." Is this *this* community's norm?
          *   *Verdict:* Requires community knowledge. If RAs don't have it, it's Penumbral.
          *   *Unliked Answer:* The procedure might classify this as "Attack" because without specific thread history, it looks like a slur. Safety > Nuance for public corpus.

  7.  **Addressing the "Salvageability" Question:**
      *   Brutal truth: If the definition shifted mid-stream, the first 5k are noise.
      *   Mitigation: Sample and check. If drift is systematic, you can model it. If random, trash.
      *   Advice: Don't redo everything. Audit a sample. If IRR is low on *anchors*, redo training. If IRR is low on *borderlines*, accept the noise and model uncertainty.

  8.  **Refining the Output Structure:**
      *   **Part 1: The Procedure (The 2-Page Manual).** Keep it actionable. Use bold headers.
      *   **Part 2: Multidimensionality Strategy.** Argument for decomposition.
      *   **Part 3: The Three Test Cases.** Apply the rules strictly.
      *   **Part 4: The Hard Truth (Salvageability).** Direct answer.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Downstream Use" requirement? *Yes, in the "North Star" section.*
      *   *Check:* Did I address the "Regress" problem? *Yes, the "Precedent Lock" rule.*
      *   *Check:* Is the tone right? *Needs to be empathetic to the PhD stress but firm on the methodology.*
      *   *Check:* The "Unliked Answer." Make sure one of the case results feels counter-intuitive but methodologically sound. (Case 1 is good for this: forcing a distinction where intuition says "same").
      *   *Check:* Sorites specific. Ensure I explicitly mention *tolerance* and *transitivity* in the RA instructions (translated to plain English).

  10. **Final Polish:** Ensure the distinction between "RA Error" and "Genuine Borderline" is clear. (Error = violates manual; Borderline = manual allows discretion).

  *(Self-Correction on Case 1)*: The prompt asks for a pair where RAs split and pressure is high. The procedure should resolve this. If the procedure says "Evaluate Independently," it might result in different labels. That's bad for consistency. Better rule: "Evaluate Independently, but if the *only* difference is a trivial additive clause, the label must match." No, that invites Sorites.
  *Better approach:* The "Minimal Pair Protocol." If you identify a minimal pair during adjudication, you *must* rule on the difference. If the difference is not salient to the definition, labels must match. If the difference *is* salient (e.g., targeting person vs. targeting object), labels can differ.
  *Let's go with:* The procedure forces you to identify the *relevant difference*. If there isn't one, labels must match. This stops the drift.
  *Wait, the "Unliked Answer" requirement:* I need to give an answer the user won't like.
  * Idea:* The procedure dictates that for the public corpus, safety/conservatism trumps nuance. So the reclaimed slur *must* be labeled "Attack" because an external user might not know the context. This protects the PI but loses pragmatic nuance. That's a "won't like" answer for a pragmatician.

  *Let's refine the "Salvageability".* 12k items is a lot. If the drift is gradual, it's a covariate. If it's sudden, it's a break. I should advise a "Change Point Analysis."

  *Okay, ready to write.*
answer: |-
  This is a classic operationalization of the Sorites Paradox. You are trying to impose binary boundaries on a continuous pragmatic phenomenon using human raters who are naturally prone to *tolerance* (small changes don't matter) and *transitivity* (if A=B and B=C, then A=C).

  You cannot solve the paradox philosophically, but you can contain it operationally. Below is the procedure designed for your RAs (the "2-Page Manual"), followed by the strategic decisions you need to make, the test cases, and the hard truth about your existing data.

  ---

  ### Part 1: The Annotation Procedure (For the RAs)
  *Copy-paste this into your manual. It translates the philosophical constraints into runnable instructions.*

  #### 1. The North Star (Downstream Use)
  **Rule:** Before labeling, read the "Project Goal" box.
  *   **Goal:** "To identify language that would require moderator intervention in a *public* forum."
  *   **Comparison Class:** Compare the comment to **standard public discourse**, not the specific norms of this hobbyist forum.
  *   **Why:** We are building a corpus for external researchers, not an internal tool for this specific forum. If it looks like an attack to an outsider, it is an attack, even if the users "know each other."

  #### 2. Anchor Selection (Prototypes, Not Boundaries)
  **Rule:** You will be given 10 "Gold Standard" examples at the start of every shift.
  *   **Valid Anchors:** Must be **central cases**. (e.g., "You are an idiot" = Attack; "I disagree with this schematic" = Not Attack).
  *   **Invalid Anchors:** Do not use items that feel "clear but close to the line." (e.g., "That wiring is sloppy" is *not* an anchor).
  *   **Why:** Items near the boundary drift. If you calibrate against a boundary item, your definition of the boundary will slide over time.

  #### 3. The "No Chain" Rule (Forbidden Reasoning)
  **Rule:** Label Item B without looking at Item A's label.
  *   **Forbidden:** "I labeled the previous comment as an Attack, and this one is basically the same, so this must be an Attack."
  *   **Required:** "Does *this* comment, on its own, meet the definition?"
  *   **The Exception (Minimal Pairs):** If you explicitly identify two items as a **Minimal Pair** (identical except for one phrase), you must label them **identically** unless that one phrase changes the *Target* or *Intent*.
  *   **Why:** Chaining labels creates the Sorites drift. Independent evaluation stops the slide.

  #### 4. The Grey Zone (Penumbra Protocol)
  **Rule:** If you spend >45 seconds deciding, or if you find yourself arguing both sides equally, the item is **Penumbral**.
  *   **Action:** Select `YES` or `NO` based on the **Safety Principle** (when in doubt, label as Attack for public release), but check the `PENUMBRA` box.
  *   **Limit:** We expect ~10–15% of items to be Penumbral. If >25% are Penumbral, stop and alert the Lead.
  *   **Why:** We need binary data for the classifier, but we need to know where the noise is for the analysis.

  #### 5. Stopping the Regress (The Precedent Lock)
  **Rule:** For Penumbral items, the Lead Adjudicator (You) makes the final call.
  *   **Action:** Once the Lead decides a Penumbral case, that decision is written to the **Precedent Log**.
  *   **Constraint:** Future items that are functionally identical *must* match the Precedent Log, even if the new item feels slightly different.
  *   **Why:** Consistency > Perfect Accuracy. A consistent error is analytically recoverable; an inconsistent truth is noise.

  #### 6. Error vs. Borderline (Disagreement Test)
  **Rule:** When RAs disagree:
  *   **RA Error:** One RA violated the Manual (e.g., used a boundary item as an anchor, chained labels). -> *Retrain.*
  *   **Genuine Borderline:** Both RAs followed the manual, but the data is ambiguous. -> *Adjudicate & Log.*
  *   **Test:** Check the RAs' notes. If they cite different rules, it's Error. If they cite the same rule but weigh the evidence differently, it's Borderline.

  ---

  ### Part 2: Multidimensionality Strategy
  **Recommendation:** **Decompose first, composite second.**

  Do not ask RAs to threshold on a composite severity score. "Attack" is a construct composed of *Target* (Person vs. Idea), *Intent* (Harm vs. Joke), and *Severity* (Insult vs. Slur).

  *   **The Procedure:** Have RAs label three binary features first:
      1.  **Target:** Person/Group (Yes/No)
      2.  **Negative Sentiment:** (Yes/No)
      3.  **Gratuitous:** Is the negativity necessary for the technical point? (Yes/No)
  *   **The Composite:** You (the script) combine these. E.g., `Attack = Target & Negative & Gratuitous`.
  *   **The Cost:** Increases annotation time by ~15 seconds per item. Increases CSV width.
  *   **The Benefit:** When a reviewer asks why 4021 is Yes and 4022 is No, you don't say "vibes." You say: "4021 targeted the person; 4022 targeted the wiring." This saves your chapters.

  ---

  ### Part 3: Running the Procedure on Your Three Items

  #### Case 1: The Minimal Pair (The "Unliked" Answer)
  *   **Item A:** "That wiring is a crime."
  *   **Item B:** "That wiring is a crime, did you learn to solder from a youtube short?"
  *   **RA Status:** Split. RA1 says both are banter. RA2 says B is an attack on competence.
  *   **Procedure Application:**
      1.  **No Chain Rule:** Evaluate B independently.
      2.  **Decomposition:**
          *   A: Target = Wiring (Object). Negative = Yes. Gratuitous = Maybe (hyperbole).
          *   B: Target = Wiring + *You* (Person). Negative = Yes. Gratuitous = Yes (soldering skill irrelevant to current function).
      3.  **Verdict:** **A = No Attack, B = Attack.**
  *   **The Answer You Won't Like:** Your pragmatic intuition likely says these are functionally identical in a hobbyist forum (both are standard "tough love" critiques). The procedure forces a distinction because B explicitly targets the *agent's competence* rather than the *object's state*.
  *   **Why:** For a public corpus, targeting personal competence is a higher liability risk than targeting an object. You are prioritizing the "Safety Principle" (Downstream Use) over the "Community Norm" (Pragmatic Reality). This creates a corpus that is slightly "purer" than the community actually behaves, which you will have to defend in your discussion section.

  #### Case 2: The Clear Case Near the Boundary
  *   **Item:** "You are wrong." (Clear, but sits right next to "You are an idiot").
  *   **Question:** Is it allowed to be an anchor?
  *   **Procedure Application:** **No.**
  *   **Reasoning:** Per the **Anchor Selection Rule**, anchors must be *central prototypes*, not *boundary guards*. "You are wrong" is semantically clear but pragmatically unstable (could be rude, could be neutral). Using it as an anchor invites drift because its "attack-ness" depends heavily on tone/context which text scraping misses.
  *   **Action:** Use "You are an idiot" (Clear Attack) and "I disagree with the schematic" (Clear Non-Attack) as anchors. Treat "You are wrong" as a regular test item.

  #### Case 3: The Reclaimed Slur (The Context Trap)
  *   **Item:** Two users who banter constantly use a reclaimed slur/insult.
  *   **RA Status:** One reads it as friendly (climbing up from banter), one reads it as abuse (climbing down from slur).
  *   **Procedure Application:**
      1.  **North Star:** Recall "Comparison Class = Standard Public Discourse."
      2.  **Penumbra Protocol:** RAs likely lack the thread history to know it's reclaimed.
      3.  **Verdict:** **Label as Attack.** Flag as Penumbral.
  *   **Reasoning:** You cannot encode 5 years of user history into a 2-page manual. For a public corpus, you must default to the interpretation that protects the dataset's utility for safety research.
  *   **Cost:** You lose the nuance of in-group reclamation.
  *   **Mitigation:** In your thesis, you add a qualitative chapter analyzing the "False Positives" where the corpus labels friendly banter as abuse. This turns a bug into a finding.

  ---

  ### Part 4: The Hard Truth (Salvageability)

  **Can you save the existing 12k labels?**
  **Short Answer:** No, not as a monolithic block.
  **Long Answer:** You can salvage *most* of them, but you must treat the early data as contaminated by "Definition Drift."

  **The Diagnosis:**
  You described a Sorites problem. This implies your definition of "Attack" has slowly expanded or contracted over time as RAs encountered edge cases. This means Item 100 and Item 12,000 are not labeled using the same function, even if the manual didn't change.

  **The Fix (Before Chapter 3):**
  1.  **Change Point Analysis:** Randomly sample 100 items from the first 1,000 and 100 from the last 1,000. Re-label them yourself using the *new* procedure.
  2.  **Calculate Drift:** If your agreement with the old labels is <80% on the *early* batch but >90% on the *late* batch, you have systematic drift.
  3.  **The Solution:**
      *   **Do not redo everything.** You don't have time.
      *   **Create a "Version" Variable:** In your corpus metadata, mark the early batch as `v1` and the new batch as `v2`.
      *   **Statistical Control:** When you run your models/chapters, include `annotation_batch` as a control variable. Acknowledge in the thesis: *"Annotation criteria were refined at item X; batch is controlled for in analysis."*
      *   **The "Golden Set":** Take the ~40 items you adjudicate weekly. Ensure these cover the full range of difficulty. Use these to normalize the RAs' scores (e.g., if RA1 is consistently stricter than RA2 on the Golden Set, apply a correction factor to their bulk labels).

  **Final Advice:**
  The Sorites paradox breaks when you stop trying to find the *true* boundary and start enforcing a *stipulated* one. Your manual above stipulates the boundary based on **liability/safety** (Downstream Use) rather than **truth** (Pragmatic Reality). This will feel wrong to you as a pragmatician. *Eat that cost.* It is better to have a defensible, slightly imperfect corpus than a theoretically pure one that collapses under reviewer scrutiny because you can't explain why 4021 is Yes and 4022 is No.

  **Your next step:** Run the Change Point Analysis on 200 items. If the drift is >10%, freeze the old data, implement the new manual, and start the "v2" batch. Write the methodology section about *why* you did this. That is Chapter 3.
