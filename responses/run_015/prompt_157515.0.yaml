  Write a short story: an alien feild researcher is observing a human kid who apperantly thinks in pure mentalese with zero spoken language, but her mentalese lacks compositional syntax — every concept is a unique atomic symbol, so learning "red square" means inventing a whole new symbol rather than combining RED and SQUARE. The alien writes journal entries trying to figure out if this kid still counts as having the productivity and systematicity Fodor argued mentalese needs, or if she's basically running a lookup table in her brain. Keep it under 600 words, show dont tell, and no bibliographies please.
