      *   **Fodor's Language of Thought (LOT):** Requires compositionality. Complex ideas are built from simple primitives using syntax. This allows for *productivity* (infinite ideas from finite parts) and *systematicity* (if you can think "John loves Mary," you can think "Mary loves John").
      *   **The Child's Condition:** Holistic/Atomic concepts. "Red ball" is not RED + BALL, it's REDBALL. "Blue ball" is BLUEBALL.
