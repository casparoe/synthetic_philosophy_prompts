  ### 1. The Technical Explanation: Sortal Dependence
  The core phenomenon is that the word "same" does not have a universal definition. Its criteria change depending on the **Sortal** (the category noun) you apply to the object.

  *   **For Artifacts (The Boat):** The standard intuition favors **Spatiotemporal Continuity**. We care about the *history of the object*. If the boat sails continuously from Day 1 to Day 1000, changing planks along the way, it is the "Same Boat." If you take the old planks and build a new boat, that is usually considered a *reconstruction* or a *replica*, not the original. The *function and history* trump the *matter*.
  *   **For Social Groups (The Troupe):** The standard intuition favors **Constitutive Continuity**. We care about the *agents*. A band, a sports team, or a theater troupe is defined by the people generating the output. If the original members leave, the "soul" of the group leaves with them, even if the brand name stays in the building. The *matter (people)* trumps the *structure (brand)*.

  **The Reversal:** You are correct that we reverse the criteria.
  *   **Physical Objects:** Structure/History > Material Parts.
  *   **Social Groups:** Material Parts (People) > Structure/Name.

  ### 2. The Complication in Your Boat Example
  You noted: *"But then if you gather all the original rotten planks... everyone points at that second one and says no, thats the real one."*

  In standard philosophical intuition (outside your shipyard town), this is actually the **minority view**. Most people would say the sailing ship is the real Ship of Theseus, and the reassembled planks are just a pile of wood shaped like a boat.

  However, your observation highlights a specific trigger: **Competitive Context.**
  When there is no competitor, we accept gradual replacement (Continuity). When the "Original Parts" reappear as a rival option, our intuition often flips to **Mereological Essentialism** (the belief that the parts are essential to the whole).

  *   **Mereological Essentialism:** The view that an object cannot survive the replacement of its parts.
  *   **Your Town:** Your shipyard town seems to be culturally **Mereological Essentialist** about boats. This is rare for artifacts but common for people.

  ### 3. Coining a Term: "The Ontological Sortal Flip"
  Since you are a novelist, "Sortal Dependence" is too dry. You need a term that captures the *motion* of the logic shifting. I propose calling this **The Continuity-Constitution Flip**.

  *   **Continuity:** Identity is preserved by the unbroken chain of events (the sailing, the name, the schedule).
  *   **Constitution:** Identity is preserved by the persistence of the constituent stuff (the wood, the actors).

  **The Flip:**
  *   **Artifact Mode:** We default to Continuity. (It's the boat because it never stopped being a boat).
  *   **Agent Mode:** We default to Constitution. (It's the troupe because the people are the same).

  **Boundary Cases (Where the Flip Breaks):**
  This is where your story can find conflict. The Flip is not consistent across all categories.
  1.  **Relics/Heirlooms:** If it's your *grandfather's* watch, we switch to **Constitution**. If you replace the gears, it's not the same watch. (Artifacts treated like People).
  2.  **Corporations:** If Apple fires all employees and hires new ones, is it still Apple? We switch to **Continuity** (Legal/Brand). (People treated like Artifacts).
  3.  **Nations:** If a country's borders change and its government is replaced, is it the same nation? We argue between **Land (Constitution)** and **Law (Continuity)**.
  4.  **AI/Uploads:** If you upload a mind to a new server, is it the same person? This is the modern battleground of the Flip.

  ### 4. Why This Happens (The "Carving")
  You asked to understand the carving. The distinction lies in **Teleology (Purpose)** vs. **Agency (Will).**

  *   **Boats are Tools:** Their identity is tied to their *function*. As long as the function continues unbroken, the tool is the same. The wood is just fuel for the function.
  *   **Troupes are Agents:** Their identity is tied to their *will/expression*. The "Driftwood Players" isn't a building; it's a specific collective consciousness. If that consciousness leaves, the identity leaves.

  **The Double Standard Explained:**
  We treat physical objects as **Patterns** (the pattern of the boat sailing).
  We treat social groups as **Substances** (the substance of the people).

  ### 5. Suggestion for Your Novel
  Your shipyard town is philosophically unique because it applies **Agent Logic** to **Artifacts**.

  In the real world, we say: "The boat is the journey."
  In your town, they say: "The boat is the wood."

  This creates a beautiful thematic conflict. The protagonist likely views the boat as a partner (Agent), while the outside world views it as a tool (Artifact).
  *   **The Conflict:** When the protagonist sails the continuously-repaired boat to the big city, the city calls it a "restored vessel." The protagonist knows it is the "same soul."
  *   **The Twist:** If the town is Mereological Essentialist about boats, they should theoretically *not* accept the gradually repaired boat once the reassembled plank-boat appears. This creates the "slow theft" tension you mentioned.

  **Recommended Term for the Book:**
  If you want a term the characters might use, consider **"The Hull-Soul Divergence."**
  *   **Hull-Identity:** Persists through structure/name (The City's view).
  *   **Soul-Identity:** Persists through original matter/agency (The Town's view).

  Or, if you want to sound more grounded: **"The Sortal Split."**

  ### Summary
  *   **Established Concept:** Sortal Dependence of Persistence Conditions.
  *   **Specific Intuition:** Mereological Essentialism (parts define the whole) vs. Spatiotemporal Continuity (history defines the whole).
  *   **The Phenomenon:** We apply Continuity to Artifacts and Essentialism to Agents.
  *   **Coined Term:** **The Continuity-Constitution Flip.**
  *   **Novelistic Angle:** Your town commits a category error by treating boats like agents. This isn't a bug; it's the theme. They love the boats too much to let them be just tools.
