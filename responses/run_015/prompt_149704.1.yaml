answer: |-
  # THE IMMIGRATION DECISION TREE
  **Start Here:** *We agree it is not wrong to exclude someone who truthfully announces they intend to burn down parliament. Does this right extend further?*

  **1. Is it permissible to exclude a family fleeing a famine (no violence, no fault)?**
  *   **NO:** Go to **2**.
  *   **YES:** Go to **4**.

  **2. Is exclusion permissible for reasons other than direct violence (e.g., economic protection)?**
  *   **NO:** ➤ **LEAF A: REMEDIAL-ONLY VIEW**
      *   *Awkward Commitment:* You must admit anyone who isn't a direct threat, even if it collapses the welfare state.
  *   **YES:** Go to **3**.

  **3. Is the justification that the state cannot force citizens to associate?**
  *   **YES:** ➤ **LEAF B: OPEN BORDERS (ASSOCIATIVE)**
      *   *Awkward Commitment:* You cannot mandate integration or language laws, as that forces association.
  *   **NO:** ➤ **LEAF C: OPEN BORDERS (FAIRNESS)**
      *   *Awkward Commitment:* You must admit entrants even if a majority of citizens object, provided no direct harm is done.
      *   *[COLLISION NOTE]:* **Leaves B & C** yield identical policy (open borders). They can only be prised apart on mandatory integration laws.

  **4. Does the right to exclude vanish if the state forbids its own citizens from leaving? (The Departure Test)**
  *   **YES:** ➤ **LEAF D: RECIPROCAL EXIT RIGHTS**
      *   *Awkward Commitment:* You must open borders immediately if you ever restrict emigration (e.g., during a pandemic).
  *   **NO:** Go to **5**.

  **5. If a majority votes to admit a doctor, can a single citizen veto it to avoid association?**
  *   **YES:** ➤ **LEAF E: INDIVIDUAL SOVEREIGNTY**
      *   *Awkward Commitment:* Borders are effectively closed unless every single citizen consents to every entrant.
      *   *[EMPTY CELL FLAG]:* **Incoherent** if held with Leaf B/C views. **Unattractive** here because it makes state policy impossible.
  *   **NO:** Go to **6**.

  **6. Must the state admit anyone willing to pay a fee that fully compensates citizens for any loss? (The Auction Model)**
  *   **YES:** ➤ **LEAF F: THE AUCTION STATE**
      *   *Awkward Commitment:* Citizenship is for sale; the poor are excluded unless subsidized by the rich.
  *   **NO:** Go to **7**.

  **7. Can you exclude a retiree who is a net fiscal positive to prevent political/cultural change?**
  *   **YES:** Go to **7b**.
  *   **NO:** Go to **8**.
      *   **7b. Is the reason limited to protecting welfare institutions?**
          *   **YES:** ➤ **LEAF G: WELFARE-STATE-AS-CLUB**
              *   *Awkward Commitment:* You must admit the rich retiree if they buy private healthcare, even if you dislike their politics.
          *   **NO:** ➤ **LEAF H: OUTRIGHT SOVEREIGNTY**
              *   *Awkward Commitment:* You may exclude for any reason (race, whim, religion) even if no material harm is proven.

  **8. Is admitting 10 million people at once impermissible, even if spread over 40 years is fine?**
  *   **NO:** ➤ **LEAF I: FLOW-RATE INDIFFERENT (UNNAMED)**
      *   *Awkward Commitment:* You cannot prioritize speed of absorption; sudden demographic shocks are permissible.
      *   *[EMPTY CELL FLAG]:* **Unexplored.** Most theorists accept capacity limits.
  *   **YES:** Go to **9**.

  **9. Is it permissible to admit workers on 5-year visas (no vote/benefits) rather than denying them?**
  *   **NO:** ➤ **LEAF J: BINARY STATUS (UNNAMED)**
      *   *Awkward Commitment:* You must offer full citizenship or total exclusion; guest worker programs are immoral.
  *   **YES:** Go to **10**.

  **10. Can a group buy an empty region, move in, and secede (even if ancestors were driven off 6 gens ago)?**
  *   **YES:** ➤ **LEAF K: CONTRACTUAL SECESSION**
      *   *Awkward Commitment:* The state can be fragmented piecemeal by any group with sufficient capital and historical grievance.
  *   **NO:** ➤ **LEAF L: NATIONAL SELF-DETERMINATION**
      *   *Awkward Commitment:* You must deny entry to people who wish to preserve their own culture rather than adopt yours.
      *   *[COLLISION NOTE]:* **Leaf L** often overlaps with **Leaf H** (Sovereignty). They are prised apart on *reasons*: Self-Determination requires a cultural/political justification; Sovereignty accepts *any* reason.

  ***

  **How to use this:** Walk through the Yes/No nodes. Do not look at the Leaves until you hit the end. Compare your Leaf with your debate partner's. If you hit the same Leaf but argue differently, check the Collision Notes. If you hit an Empty Cell, ask why you hold a position nobody else occupies.
