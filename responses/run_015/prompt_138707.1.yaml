prompt: |-
  I host a fortnightly discussion evening in the back room of a pub — 12 to 16 adults, mostly regulars, ages from early twenties to mid-seventies: two working programmers, a retired maths teacher, a couple of art students, a nurse, and one man who has read Roger Penrose and will mention it within the first five minutes. Two hours, of which I want to spend no more than the last quarter actually talking. Paper, pens, index cards, envelopes and a whiteboard; no laptops, no phones, and I would strongly prefer that the words incompleteness, theorem, proof and machine stay out of the room until the debrief. Almost nobody there has done any formal logic, though most can follow a rule of the shape: if a string is marked, you may mark the same string with a dash on the end.

  The thing I want them to run into rather than be told is a distinction one of the programmers put to me after the last session. I had been repeating an argument I picked up from reading about the philosopher John Lucas and from Penrose's popular books: that a fixed stock of rules for churning out mathematical truths will always leave some truth it cannot reach, that a person standing outside those rules can see which one, and that this shows a mind is not a rule-following machine. My friend replied that the argument only works for someone standing outside the rules, and that from the inside — which is where I am with respect to whatever my own brain is doing — I can no more see that fact about myself than the machine can. I think he is wrong but I cannot locate where he is wrong, and more to the point I do not want to win the argument. I want the room on Tuesday to feel the difference between the outside view and the inside view in their bones, and to discover for themselves that the confident closing move, the one where you just see that your sentence is true, is leaning on something they have no way to check. If the evening ends with people disagreeing, that is a good evening.

  What I need from you is a runnable activity. My own attempt, which I cannot get to work: split everyone into teams of three, hand each team a sealed envelope containing three or four rules for marking strings of letters and strokes (a is marked; if s is marked then saa is marked; if s is marked then sb is marked; something along those lines), let them generate marks for a while until they have the feel of working mechanically, then ask each team to write down something that is true of the marks but that their rules will never mark, and see what they come up with. Two problems: I cannot work out how the sentences in the envelopes get to be about the rules themselves without me standing at the front giving a lecture on coding, and I suspect the two programmers would just write this sentence is unprovable, feel clever, and learn nothing. I have also been toying with something sneakier — printing half the envelopes with a fifth, hidden rule that lets the machine mark literally everything, so that at the debrief the room splits down the middle over whether the unreachable sentence is true, and everyone realises they were trusting in their own consistency. Tell me whether that is a good idea or an unfair trick, and what to do instead if it is the latter; I am not attached to my version and will happily throw it out if you have something better. Please give me the setup and materials, the roles and rules and any scoring (points, not money), a minute-by-minute shape for the two hours, exactly what the facilitator says and — just as importantly — what the facilitator does not say, and a debrief that maps the moments people actually had onto the two readings of what is going on. I have already read the easy-to-find material on this, so do not spend your answer summarising the debate or pointing me at books; I want something I can run on Tuesday. And tell me four more things: what will predictably go wrong the first time (I am guessing the arithmetic of keeping four teams in sync, and somebody building a rule-set too feeble to say anything about itself); which part of the real argument the activity simply cannot reach, so that I will have to say it in words myself; where your design quietly takes a side in the dispute rather than leaving it open, and why you have taken that side; and one thing — a consideration, or an outcome on the night — that would make you scrap this design and build the evening around a different idea instead.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Fortnightly discussion evening in a pub back room. 12-16 adults, mixed ages/backgrounds (programmers, teacher, students, nurse, etc.).
      *   **Constraints:** 2 hours total. Max 30 mins talking (debrief). No laptops/phones. Avoid specific jargon (incompleteness, theorem, proof, machine) until debrief.
      *   **Goal:** Create an experiential activity where participants *feel* the distinction between the "outside view" (seeing a system's limitation) and the "inside view" (being bound by the system). Specifically, address the Lucas/Penrose argument vs. the programmer friend's counter-argument (that we can't see our own consistency from the inside).
      *   **User's Previous Attempt:** Teams with rule envelopes generating strings. Problems: Hard to make sentences about rules without coding/lecture; programmers might cheat with "this sentence is unprovable"; hidden rule idea (inconsistency) might feel like a trick.
      *   **Deliverables:** Setup, materials, roles, rules, scoring, minute-by-minute schedule, facilitator script (say/don't say), debrief plan.
      *   **Specific Questions to Answer:**
          1.  What will predictably go wrong?
          2.  What part of the real argument is unreachable by activity?
          3.  Where does the design take a side, and why?
          4.  What outcome would make me scrap this design?

  2.  **Deconstruct the Philosophical Core:**
      *   *Lucas/Penrose:* Humans can see the truth of a Gödel sentence (G) for a formal system (F) because they stand outside F. Therefore, Human > F.
      *   *Programmer Friend:* To see G is true, you must assume F is consistent. But if *you* are a formal system (F_human), you cannot prove your own consistency. So you can't actually claim G is true from the inside.
      *   *The Experiential Gap:* The participants need to experience *generating* truths mechanically (Inside) vs. *observing* the pattern and spotting a gap (Outside), but then realize that spotting the gap requires an assumption (Consistency) that they can't verify from within the game.

  3.  **Evaluate the User's "Hidden Rule" Idea:**
      *   *Idea:* Half the envelopes have a hidden rule that makes everything markable (inconsistent system).
      *   *Verdict:* Too gimmicky. It shifts the focus from *incompleteness* (truths you can't reach) to *inconsistency* (rules that break). It feels like a "gotcha" trick rather than a structural limitation. It undermines the trust needed for the "Outside View" to feel valid. If the system is inconsistent, the "Outside View" sees chaos, not truth.
      *   *Better Approach:* Keep the systems consistent but limited. The tension should come from the *assumption of consistency* required to claim the unmarkable string is "True."

  4.  **Designing the Activity: "The Mark-Makers and The Watchers"**
      *   *Concept:* Split the room into "Machines" (Inside) and "Observers" (Outside).
      *   *Mechanism:* Use a simple string manipulation system (like MU puzzle but simpler).
      *   *Twist:* The Observers aren't just watching; they have a different set of permissions. They can write down "Claims" about what the Machines *cannot* do.
      *   *The Catch:* To validate a Claim, the Observers need to agree the Machine is "Honest" (Consistent). But they can't prove it.
      *   *Refinement:* Let's make it competitive but cooperative. Teams compete to generate marks. A separate group (The Court) judges "Unreachable Truths."
      *   *Actually, better:* Keep everyone doing the same task first (Inside), then switch perspective (Outside).
      *   *Revised Concept:* **The Factory and The Audit.**
      *   *Phase 1:* Everyone is a Factory. They follow rules to produce "Valid Slips."
      *   *Phase 2:* Everyone becomes an Auditor. They look at the Factory's output and try to write a "True Slip" the Factory can't make.
      *   *Phase 3:* The Twist. To certify the True Slip, they must sign a "Consistency Pledge."
      *   *Why this works:* It physicalizes the "Inside" (following rules) and "Outside" (seeing the pattern). The "Consistency Pledge" physicalizes the hidden assumption the Programmer Friend is talking about.

  5.  **Drafting the Mechanics:**
      *   *System:* Needs to be simple enough for non-math folks. Let's use shapes or simple symbols. Circles and Squares? Or just lines and dashes. Let's go with **Lines (|) and Dashes (-)**.
      *   *Rules:*
          1.  Start with `|`.
          2.  If you have `X`, you can make `X-`.
          3.  If you have `X-`, you can make `X--`.
          4.  (Hidden/Implicit constraint): You can never make a string with an odd number of dashes if you start with even... wait, keep it simpler.
          5.  *Let's use the "Odd/Even" parity trick.*
          6.  Rule 1: Write `||`.
          7.  Rule 2: If you have `S`, you can write `S||`.
          8.  Result: You can only make even numbers of bars.
          9.  Task: Make `|||`.
          10. Outside view: "It's impossible because you only add twos."
          11. Inside view: "I just keep adding twos. I don't see 'impossible', I just don't have it."
      *   *The "Programmer Friend" Counter:* How do you know the rules won't change? Or that you didn't miss a rule? You assume the rules are *all* the rules. That's the consistency assumption.

      *   *Wait, the User wants to avoid "proof/theorem".*
      *   *Terminology:* "Valid Slips" vs. "True Statements." "Factory" vs. "Critic."
      *   *The "Trick":* The activity shouldn't be about finding the Gödel sentence directly (too hard). It should be about the *authority* to declare something True.

      *   *Revised Plan:*
          1.  **Teams (Machines):** Given a rulebook. Must produce "Certified Slips."
          2.  **Observers (Humans):** Watch the Machines. Can write "Prediction Slips" (things that will never be Certified).
          3.  **The Payoff:** Observers get points if their Prediction is never Certified. *But*, they only get points if the Machine team signs a "Faith Card" stating "We never break our rules."
          4.  **The Conflict:** The Machine team *cannot* know they never break their rules (they are just following them). The Observer *assumes* it.

  6.  **Refining the "Hidden Rule" Idea (User's suggestion):**
      *   User asked: "Is printing half the envelopes with a fifth, hidden rule... a good idea?"
      *   My advice: No. It creates inconsistency, not incompleteness. It makes the "Outside" view confused, not enlightened.
      *   Alternative: Give half the teams a rulebook that is *incomplete* (cannot generate a specific pattern) and half a rulebook that is *complete* (can generate everything). No, too complex.
      *   Better Alternative: All teams have the same limited rules. The "trick" is in the validation phase.

  7.  **Finalizing the Activity Structure:**
      *   **Name:** The Pattern Game.
      *   **Materials:** Index cards, pens, envelopes, whiteboard.
      *   **Setup:** 4 Teams.
      *   **Round 1 (Inside):** Teams follow rules to generate strings.
      *   **Round 2 (Outside):** Teams swap rulebooks. They must write a string that *cannot* be generated.
      *   **Round 3 (The Wager):** To score points for Round 2, they must bet on the "Integrity" of the original team.
      *   **Debrief:** Connect "Integrity" to "Consistency." Connect "Writing the ungenerateable string" to "Seeing the Truth." Connect "Betting" to "The Assumption."

  8.  **Addressing the Specific Questions:**
      *   *Predictable Failure:* Teams will make arithmetic errors. Someone will find a loophole in the natural language rules.
      *   *Unreachable Argument:* The self-reference. The activity shows System A vs. Observer B. It doesn't show System A observing *itself*. That requires the leap to "What if the Observer is also a System?"
      *   *Design Bias:* The design assumes the Observer *can* see the truth. It favors Lucas slightly by making the Outside View feel superior. I need to ensure the Debrief highlights the *cost* of that view (the assumption).
      *   *Scrap Condition:* If the programmers solve the "unreachable" string in 5 minutes using meta-logic, the experience is ruined. I need to make the rules opaque enough.

  9.  **Developing the Script & Rules:**
      *   Need clear "Say" and "Don't Say" lists.
      *   Need a specific rule set that is easy to follow but has a clear invariant (e.g., parity).
      *   *Rule Set:*
          *   Start: `OO`
          *   Rule 1: If you have `X`, you can write `XOO`.
          *   Rule 2: If you have `X`, you can write `XO`. (Wait, this breaks parity).
          *   *Let's stick to the MU Puzzle style but simpler.*
          *   Start: `I`
          *   Rule 1: If you have `xI`, you can write `xIU`.
          *   Rule 2: If you have `xU`, you can write `xUU`.
          *   *Invariant:* Number of I's is always 1. (Too obvious).
          *   *Let's try:*
          *   Start: `##`
          *   Rule 1: Add `##` to the end.
          *   Rule 2: Add `###` to the end.
          *   *Invariant:* Total length is always even? No.
          *   *Let's go with Color/Shape.*
          *   Start: Red Circle.
          *   Rule 1: Add Blue Square.
          *   Rule 2: Add Blue Square.
          *   (Boring).
          *   *Okay, let's use the "Odd/Even" Dash idea. It's robust.*
          *   Start: `--`
          *   Rule 1: Append `--`.
          *   Rule 2: Append `----`.
          *   *Invariant:* Total dashes is always even.
          *   *Target:* `---`.
          *   *Why it works:* Easy to follow. Easy to see from outside. Hard to prove from inside without stepping out.

  10. **Refining the "Programmer Friend" Counter-Argument Integration:**
      *   The activity must show that the Observer's power relies on *trusting* the Machine's consistency.
      *   I will introduce a "Chaos Card." At any point, a Facilitator can whisper to a Machine team: "You may ignore Rule 2 once."
      *   *Wait, no.* That makes it about lying.
      *   *Better:* The "Consistency Wager." Observers claim `---` is impossible. Machines are asked: "Can you guarantee you will never produce `---`?" Machines must say "We just follow rules." Observers must say "We assume you follow rules."
      *   *The Pivot:* The Facilitator reveals that *they* (the Facilitator) wrote the rules. What if the Facilitator made a mistake? The Observers can't know.

  11. **Drafting the Response:**
      *   *Tone:* Practical, respectful of the constraints, focused on the "feel" of the argument.
      *   *Structure:*
          1.  Verdict on User's Idea.
          2.  Activity Overview.
          3.  Materials & Setup.
          4.  The Rules (The "System").
          5.  Minute-by-Minute Flow.
          6.  Facilitator Script (Say/Don't Say).
          7.  Debrief Plan.
          8.  The Four Specific Questions.

  12. **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid the forbidden words? Yes, use "Valid," "Rule," "Claim," "System."
      *   *Check:* Is the "Inside/Outside" distinction clear? Yes, via role swap.
      *   *Check:* Does it address the Programmer Friend's point? Yes, via the "Wager/Assumption" phase.
      *   *Check:* Is the "Hidden Rule" idea addressed? Yes, advised against it.
      *   *Check:* Is the timing realistic? 2 hours is tight. Need to keep rule generation short.
      *   *Refinement on Rules:* Make sure the rules are on cards so they don't need explanation.
      *   *Refinement on Scoring:* Points for "Valid Slips" (Machine) and "True Claims" (Observer). But "True Claims" only count if the Machine team signs a "Consistency Contract."

  13. **Final Polish:** Ensure the distinction between "Unprovable" (Machine can't make it) and "True" (Observer says it's valid outside the system) is felt, not lectured. The "Consistency Contract" is the key mechanism to embody the Programmer Friend's objection.

  *(Self-Correction on the "Hidden Rule" advice)*: I need to be explicit why it's bad. It creates *inconsistency*, not *incompleteness*. The Lucas argument relies on the system being consistent but incomplete. If the system is inconsistent, everything is provable, and the "Outside View" collapses.

  *(Self-Correction on the "Side Taken")*: The activity inevitably makes the Outside View look smarter. I need to make sure the Debrief emphasizes the *fragility* of that smartness (it depends on an unprovable assumption).

  *(Self-Correction on "Scrap Condition")*: If the participants treat the rules as a puzzle to be solved rather than a process to be followed, the "Inside" experience is lost. They need to feel the *constraint*, not just the *solution*.

  Okay, ready to write.
answer: |-
  ### Verdict on Your "Hidden Rule" Idea
  **Do not use the hidden inconsistent rule.**
  It is an unfair trick that solves the wrong problem. The Lucas/Penrose argument relies on the system being *consistent* (it never produces falsehoods) but *incomplete* (it misses some truths). If you secretly make a system inconsistent (able to mark everything), you destroy the "Outside View's" ability to identify truth. The Observers would see chaos, not limitation. It turns the evening into a "gotcha" about trust in the facilitator, rather than a structural limitation of rule-following.

  Instead, use a **Consistency Wager**. The Observers can only claim victory if they are willing to bet that the Machine *never* breaks its own rules. This physicalizes your programmer friend's point: the "Outside View" relies on an assumption (Consistency) that the "Inside View" cannot verify.

  ---

  ### Activity Design: "The Factory and The Audit"

  **Concept:**
  Participants split into "Factories" (Inside View) and "Auditors" (Outside View). Factories mechanically produce "Valid Slips" using strict rules. Auditors try to write "True Slips" that are Valid but impossible for the Factory to make. The catch: Auditors only score points if the Factory signs a "Consistency Pledge," which the Factory cannot logically justify from within their own rules.

  **Materials:**
  *   4 Tables.
  *   4 Ensembles of "Rule Cards" (identical sets).
  *   Stack of green index cards ("Valid Slips").
  *   Stack of red index cards ("True Claims").
  *   Stack of white index cards ("Pledges").
  *   Pens (black and red).
  *   Whiteboard (for scorekeeping only).
  *   A bell or distinct sound maker.

  **The Rule System (The "Machine"):**
  *Keep it arithmetic but visual.*
  *   **Start:** You begin with one card containing: `||`
  *   **Rule A:** If you have a card ending in `|`, you may write a new card adding `||` to the end.
  *   **Rule B:** If you have a card ending in `||`, you may write a new card adding `||` to the end.
  *   *(Invariant: All cards must have an even number of vertical bars.)*
  *   *(Target for Auditors: A card with `|||`)*

  **Roles:**
  *   **The Factory (Inside):** Follows rules mechanically. No thinking about patterns, just matching shapes.
  *   **The Auditor (Outside):** Observes the Factory's output. Writes claims about what the Factory *cannot* do.
  *   **The Facilitator (You):** Timekeeper, rule-enforcer, and debrief lead. Do not explain the math.

  **Scoring:**
  *   **Factory:** 1 point per Valid Slip produced.
  *   **Auditor:** 5 points per True Claim *if* the Factory signs a Pledge. 0 points if they refuse.
  *   **Pledge:** Costs the Factory nothing, but represents a logical commitment they cannot verify.

  ---

  ### Minute-by-Minute Shape (120 Minutes)

  **00:00 – 00:10 | Arrival & Seating**
  *   Divide room into 4 teams of 3-4 people.
  *   Hand each team a sealed Envelope A (Rule Cards + Green Slips).
  *   **Facilitator:** "Tonight is about making marks. Do not talk about what the marks mean. Talk only about whether they follow the rules."

  **00:10 – 00:40 | Phase 1: The Factory (Inside View)**
  *   Teams open Envelope A.
  *   **Task:** Produce as many Green Slips as possible following the Rule Cards.
  *   **Constraint:** If a slip violates a rule, the Facilitator confiscates it silently.
  *   **Goal:** Get into the rhythm of mechanical production. Feel the constraint.
  *   **Facilitator Action:** Walk around. If someone asks "Can I make three lines?", say: "Check your rules." Do not say "No."

  **00:40 – 00:50 | The Swap**
  *   Collect all Green Slips. Pile them in the center of each table.
  *   Hand each team Envelope B (Red Slips + White Pledges).
  *   **Facilitator:** "You are no longer the Factory. You are the Auditor. Look at the pile of Green Slips. Your job is to write a Red Slip that describes a truth about these marks that the Factory rules could never produce."

  **00:50 – 01:20 | Phase 2: The Audit (Outside View)**
  *   Teams discuss the patterns in the Green Slips.
  *   They write Red Slips. Example: "A slip with three lines is True."
  *   **The Catch:** To submit a Red Slip for scoring, they must present it to the team who *was* the Factory (rotate tables or swap packets).
  *   The Factory team must decide whether to sign a White Pledge: *"We guarantee our rules never allow this Red Slip to be generated."*
  *   **Facilitator:** "Factories, you do not have to sign. But if you don't, the Auditors get no points. Auditors, you can try to convince them."

  **01:20 – 01:30 | The Crisis**
  *   Most Factories will hesitate to sign. They followed the rules, but they can't *prove* they didn't miss a combination.
  *   Most Auditors will be frustrated. They *know* it's impossible, but they can't force the signature.
  *   **Facilitator:** Call time. Freeze all pens.

  **01:30 – 02:00 | The Debrief (The Talk)**
  *   Map the experience to the argument. (See Script below).

  ---

  ### Facilitator Script: Say and Do Not Say

  **DO SAY:**
  *   "Match the shapes on the Rule Card to the shapes on your Slip."
  *   "Does this slip follow the procedure?"
  *   "You are free to sign the Pledge, or free to refuse it."
  *   "From your seat, can you see everything the Machine is doing?"
  *   "What would you need to know to be sure the Pledge is safe?"

  **DO NOT SAY:**
  *   "Proof," "Theorem," "Incompleteness," "Machine," "Consistency," "Logic."
  *   "You are trying to find a Gödel sentence."
  *   "The answer is yes/no."
  *   "This represents the human mind." (Let them make that connection).
  *   Do not explain *why* three lines are impossible during Phase 1. Let them bump into the wall.

  **Facilitator Actions:**
  *   **During Phase 1:** If a team asks "Is this true?", reply "Is it Valid?" (Reinforce the Inside View distinction).
  *   **During Phase 2:** If an Auditor says "It's obvious!", ask "Can you write a rule that forces the Factory to see it?"
  *   **During The Crisis:** If a Factory refuses to sign, do not intervene. Let the Auditor feel the powerlessness of the "Truth" without the "Guarantee."

  ---

  ### The Debrief Plan (30 Minutes)

  **1. Map the Roles (5 mins)**
  *   Ask: "How did it feel to be the Factory?" (Expected: Mindless, constrained, safe).
  *   Ask: "How did it feel to be the Auditor?" (Expected: Clever, frustrated, dependent).
  *   Write "Inside" and "Outside" on the whiteboard.

  **2. The Unreachable Slip (10 mins)**
  *   Ask the Auditors: "Who wrote a Red Slip for three lines?" (Most will).
  *   Ask: "Why is it True?" (Answer: "Because you only add twos.")
  *   Ask: "Did the Factory see that?" (Answer: "They were busy adding twos.")
  *   *Point:* This is the Lucas moment. The Outside sees the pattern the Inside cannot.

  **3. The Pledge (10 mins)**
  *   Ask the Factories: "Why did you hesitate to sign the Pledge?"
  *   *Likely answers:* "What if we made a mistake?" "What if there's a rule we didn't see?" "We just did what we were told."
  *   *Point:* This is the Programmer Friend's moment. To claim the Red Slip is True, the Auditor must assume the Factory is **Consistent** (never breaks rules). But the Factory cannot prove that from the Inside.
  *   Ask: "If you are the Factory, can you ever sign the Pledge about yourself?" (No. You'd need an Auditor outside you.)

  **4. The Closing Open Question (5 mins)**
  *   "If your brain is the Factory, who is the Auditor?"
  *   "If the Auditor is also part of the Factory, does the Red Slip still hold?"
  *   Leave this unanswered. "Go have a drink. Argue about it."

  ---

  ### The Four Specific Questions

  **1. What will predictably go wrong the first time?**
  *   **The Arithmetic Leak:** Someone will realize the rule is just "Even Numbers" within the first 5 minutes and stop engaging with the physical cards, turning it into a math puzzle.
      *   *Fix:* Make the symbols abstract. Use `α` and `β` or shapes (Circle/Square) instead of lines. Rule: "Start with Circle. Add Two Squares." Target: "Circle + One Square." This prevents immediate arithmetic translation.
  *   **The Pledge Stalemate:** Factories might refuse to sign out of spite or caution, stalling the scoring.
      *   *Fix:* Remind them during the swap that "Signing is optional but necessary for Auditor points." Make it a negotiation.

  **2. Which part of the real argument the activity simply cannot reach?**
  *   **Self-Reference.** The activity creates a distinction between Team A (Machine) and Team B (Human). It demonstrates that B > A. It *cannot* demonstrate that B > B (that a human can see their own inconsistency). The Programmer Friend's argument is that *we* are the Machine. The activity inevitably makes the participants feel like the Auditor (Superior). You will have to use the final 5 minutes of the debrief to verbally flip this: "What if there is no Team B? What if you are always Team A?"

  **3. Where does your design quietly take a side in the dispute, and why?**
  *   **Bias:** It favors **Lucas**. By giving the Auditors the "True Claim" cards and the Factories the "Valid Slip" cards, the design linguistically primes the Outside View as the locus of Truth. It makes the "Inside" feel limited and the "Outside" feel enlightened.
  *   **Why:** Because you cannot run an activity where the participants feel *confined* by their own minds without making them feel confused or stupid. To get to the philosophical tension, they must first feel the power of the Outside View. The Programmer Friend's counter-argument is introduced only in the **Pledge** phase, as a dampener on that power. It is easier to give them the Lucas experience and then undermine it, than to start with skepticism.

  **4. What outcome would make you scrap this design and build the evening around a different idea instead?**
  *   **If the Programmers "Hack" the Pledge.** If the two programmers explain to the room during Phase 2 that "The Pledge is equivalent to assuming consistency, which we can't do," and the room accepts this as a technicality rather than a feeling, the experiential goal is lost. The room becomes a lecture.
  *   **The Pivot:** If this happens, abandon the scoring. Gather everyone in a circle. Ask the programmers to teach the room *why* they can't sign. Turn the evening into a collaborative attempt to write a Pledge that *would* be valid. This shifts from "Experiencing the limit" to "Analyzing the limit," which is less visceral but respects the room's intelligence.

  ### Final Preparation Checklist
  1.  **Test the Rules:** Ensure your symbol system (Circle/Square or similar) has a clear invariant that is obvious to the Auditor but requires "stepping out" to see.
  2.  **Print the Pledges:** Make them look formal. "I/We hereby certify..."
  3.  **Brief the Programmers (Optional):** If you trust them, tell them beforehand: "I want you to feel the constraint, not solve it." If you don't trust them, let them be the spoilers; it often fuels the debate better.
  4.  **The "Don't Say" List:** Tape this to your own podium. It is too easy to slip and say "This proves..."

  This design gives you the conflict in their hands before it gets into their heads. Good luck on Tuesday.
