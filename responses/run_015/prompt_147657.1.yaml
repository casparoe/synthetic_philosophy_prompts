answer: |-
  # Workshop Plan: The Harbor Council Deliberation
  **Topic:** Identity, Continuity, and Obligation (The Ship of Theseus as Practical Conflict)
  **Duration:** 75 Minutes
  **Participants:** 16 Students (4 Groups of 4)
  **Materials:** Role Cards, Envelopes with Hidden Information, Voting Slips, Projector (for timer only).

  ## I. Learning Objective
  To force participants to experience the instability of identity claims when those claims are tied to conflicting incentives (rights vs. liabilities), without initially providing the philosophical vocabulary to resolve the tension.

  ## II. Room Setup & Roles (16 Students)
  Divide the room into four tables. Each table represents a distinct stakeholder group.

  1.  **The Current Cooperative (4 Students):** Operate the fleet today. All original parts replaced.
      *   *Goal:* Secure the Historical Fishing License (Revenue). Avoid the Environmental Debt (Liability).
  2.  **The Descendants (4 Students):** Heirs of the 1958 Crew. Hold the family lore.
      *   *Goal:* Protect the Grandfather's legacy (Narrative). Avoid financial ruin for the families.
  3.  **The Ghost Vessel Collective (4 Students):** Rebuilt the original hull from salvaged timber.
      *   *Goal:* Claim the License based on material authenticity. Avoid Debt by claiming the "spirit" died in 1980.
  4.  **The Harbor Arbitrators (4 Students):** Neutral judges.
      *   *Goal:* Assign the **one** License and the **one** Debt. They must be assigned to the *same* entity (Identity is indivisible).

  ## III. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Induction & Distribution
  *   **Facilitator (Steward):** Read the opening scenario (the prompt's preamble). Emphasize: "You are not debating philosophy. You are deciding who pays and who profits. Do not use words like 'ontology,' 'identity,' or 'metaphysics.' Speak in terms of contracts, wood, logs, and fairness."
  *   **Distribution:** Hand out Role Cards and **Envelope A** (Hidden Info) to each group.
      *   *Constraint:* Students may not show their cards to other groups. They may only quote from them.

  ### 00:10 – 00:25: Phase 1 – The Rights (The License)
  *   **Task:** The Harbor Council must award the *Exclusive Heritage Fishing License*. This is valuable.
  *   **Deliberation:** Claimants argue why *they* are the true successor. Arbitrators listen and question.
  *   **Hidden Info (Envelope A) Context:**
      *   *Current Coop:* Has logs proving 65 years of uninterrupted *service* (Functional).
      *   *Descendants:* Have a letter stating the Captain intended the *Name* to outlive the *Hull* (Narrative).
      *   *Ghost Vessel:* Has the original keel and timbers (Material).
      *   *Arbitrators:* The Charter states the License goes to the "True Successor."
  *   **Dynamic:** All three claimant groups will argue they are the "Same Ship" to get the prize.

  ### 00:25 – 00:30: Vote 1 & The Audit
  *   **Vote:** Arbitrators cast a preliminary vote on who gets the License. (Do not announce results yet).
  *   **The Twist:** Facilitator interrupts. "An audit has been completed. The 1974 Oil Spill Debt is legally inseparable from the Heritage License. Whoever holds the rights inherits the $2M cleanup cost."
  *   **Distribution:** Hand out **Envelope B** (New Legal Constraints).
      *   *Current Coop:* Learn that insurance policies void if the hull is not "Original Spec."
      *   *Descendants:* Learn that heirs are personally liable if the "Corporate Entity" is deemed continuous.
      *   *Ghost Vessel:* Learn that launching a reconstructed vessel voids "Historical Artifact" tax exemptions.
      *   *Arbitrators:* Learn that under Maritime Law, you cannot split the License and the Debt. One entity must take both.

  ### 00:30 – 00:50: Phase 2 – The Obligations (The Debt)
  *   **Task:** Re-deliberate. The stakes have flipped. To avoid the debt, groups must now argue they are *not* the same ship, or that the other group is *more* of the ship.
  *   **Dynamic:**
      *   *Current Coop:* Must now downplay material continuity (admit they are new) to avoid debt, but this hurts their License claim.
      *   *Ghost Vessel:* Must argue that having the old wood makes them a "museum piece," not a "working vessel," to avoid operational debt.
      *   *Descendants:* Must argue the "spirit" ended when the last original crewman died.
  *   **Constraint:** Arbitrators must reach a unanimous verdict. If they deadlock, the License is revoked and the Debt falls to the State (a "failure" state for the Arbitrators).

  ### 00:50 – 00:55: Final Vote & Judgment
  *   Arbitrators submit final binding decision.
  *   Facilitator reveals the outcome. (Usually, this results in a tense compromise or a deadlock).

  ### 00:55 – 01:15: Debrief & Mapping
  *   **Step 1 (The Vocabulary):** Allow students to name what happened. Introduce terms like *Material Continuity*, *Functional Continuity*, and *Narrative Continuity*.
  *   **Step 2 (The Shadow Reconstruction):** Discuss the moment two groups claimed to be the "One" original. Map this to the **Fission Problem** (if A = B and A = C, does B = C?).
  *   **Step 3 (The Gap):** Address the limitation (see Section V below).

  ---

  ## IV. Hidden Information Packets (Content for Envelopes)

  **Group 1: Current Cooperative**
  *   *Envelope A:* "We have sailed every season since 1958. The crew is trained in the original methods. The Charter says the Cooperative is a 'Going Concern.'"
  *   *Envelope B:* "Legal Advisory: If you claim to be the 1958 Entity, you inherit pre-1980 liabilities. If you claim to be a New Entity (post-refit), you lose the Heritage License."

  **Group 2: Descendants**
  *   *Envelope A:* "Grandfather's Diary: 'The Ship is not the wood, it is the promise we made to the sea.' The family name is on the Charter."
  *   *Envelope B:* "Legal Advisory: If the 'Promise' is legally binding, the family estate is liable for environmental damages. If the 'Promise' was personal to Grandfather, the legacy dies with him."

  **Group 3: Ghost Vessel**
  *   *Envelope A:* "We hold 60% of the original timber by mass. The Keel is original. Science confirms the material is from 1958."
  *   *Envelope B:* "Legal Advisory: A reconstructed vessel is classified as a 'Replica.' Replicas cannot hold commercial fishing licenses. Only 'Original Vessels' can be liable for industrial debt."

  **Group 4: Arbitrators**
  *   *Envelope A:* "The Charter: 'The Vessel shall persist as long as the Mission persists.'"
  *   *Envelope B:* "The Law: 'Liability attaches to the Hull Identification Number (HIN).' The HIN was transferred to the Current Cooperative in 1990, but the physical HIN plate is on the Ghost Vessel's keel."

  ---

  ## V. Facilitator Notes: Limitations & Recovery

  ### 1. The Metaphysical Gap (Collective Agency)
  **What the game cannot reproduce:**
  This simulation treats the ship primarily as a physical object (wood, engines, hull) because that is tangible for students. However, your cooperative is a **legal person** and a **collective agent**. Physical objects do not have intentions; cooperatives do. The game struggles to simulate *distributed intentionality*—the idea that the "ship" persists because the *rules and goals* are continuously accepted by new members, regardless of the wood.

  **How to supply the gap verbally (During Debrief):**
  In the final 10 minutes, you must explicitly state:
  > "In this game, you argued about planks and logs. But in reality, this Cooperative is not a thing; it is a *rule-book that people agree to follow*. A ship of wood rots. A ship of *agreement* only rots if people stop honoring the charter. The 'Identity' you were fighting over wasn't in the timber; it was in the legal fiction that allows a group of strangers to act as one single entity across time. That is why the 'Narrative' argument often beats the 'Material' argument in court: because the law protects the *undertaking*, not the *object*."

  ### 2. Predicted Polarization Point
  **The Risk:**
  The group will likely split irreconcilably between the **Current Cooperative (Functionalists)** and the **Ghost Vessel (Materialists)** during Phase 2. The Arbitrators may deadlock because assigning the Debt to either feels unjust based on the conflicting criteria established in Phase 1.

  **The Collapse Scenario:**
  Arbitrators refuse to vote, claiming the criteria are contradictory. Claimants refuse to compromise, viewing the Debt as existential ruin.

  **Recovery Strategy:**
  If the Arbitrators deadlock at Minute 50:
  1.  **Freeze the Room.** Do not allow them to "agree to disagree."
  2.  **Invoke the "Harbor Master" Clause.** As Facilitator, step in as the State Authority.
  3.  **The Ruling:** Declare that because the Identity cannot be settled, the License is **suspended** until a court decides.
  4.  **The Lesson:** Ask the class: "Who suffers most from the suspension?" (Answer: The Current Cooperative, who need income to operate).
  5.  **The Pivot:** Use this to demonstrate that *practical necessity* often dictates metaphysical decisions. We often decide "what something is" based on "what we need it to do." This forces the Functionalists to realize their reliance on the system they tried to distance themselves from.

  ### 3. Managing Terminology
  Strictly enforce the "No Philosophy Speak" rule during Phase 1 and 2. If a student says, "The ontological status of the hull...", stop them and ask, "Does the hull float? Does the logbook sign it? Say that instead." This prevents them from retreating into abstract theory to escape the practical tension.

  ### 4. The "Shadow Reconstruction" Debrief
  Ensure you highlight the specific moment when *both* the Current Cooperative and the Ghost Vessel claimed to be the successor.
  *   Ask: "If both are the Ship of 1958, are they the same ship as each other?"
  *   If they say "Yes," ask: "Why are they in different places?"
  *   If they say "No," ask: "How can two things both be identical to one original thing?"
  *   This creates the visceral experience of the **Fission Paradox** without needing to draw diagrams.

  ## VI. Closing Statement (For Facilitator)
  "Today you felt the weight of the paradox. It is not a puzzle to be solved with logic alone; it is a conflict of interests disguised as a question of fact. When you leave this room, remember: Identity is not just what *is*. It is what we *hold accountable*."
