      *   *Reactive Attitudes (Strawson):* P.F. Strawson's "Freedom and Resentment." He argues we can't give up these attitudes without losing our humanity.
      *   *Hot Reactive Attitudes:* The gut punch of betrayal, the flush of gratitude. Emotional, immediate, personal.
