answer: |-
  # The "Function Factory" Night Plan

  ## Setup and Materials
  **Room:** Push tables together to form one long banquet table or two large circles. You need eye contact between pairs, but a central space for you to stand with the flipchart.
  **Materials:**
  *   7 decks of "Organism Cards" (printed on cardstock, cut in half horizontally).
  *   100 poker chips or matchsticks (two colors: 80 "Capital", 20 "Bonus").
  *   Flipchart and thick markers (black, red, blue).
  *   14 envelopes (to seal the "Rule Card" for each round).
  *   A bell or distinct sound maker (phone app) to signal time.

  ## The Stakes Mechanic
  Each pair starts with 10 Capital chips.
  *   **The Buy-In:** At the start of each round, the pair must wager 2 chips into the pot.
  *   **The Task:** They must agree on a single sentence: *"The function of [Trait] is to [Verb] [Object]."*
  *   **The Payout:** After they write their sentence, you open the envelope for that round and read the **"Funding Criteria."**
      *   If their sentence satisfies the Criteria: They get 4 chips back (Net +2).
      *   If it fails: They lose the wagered 2 chips.
      *   **Bankruptcy:** If a pair hits 0 chips, they are "hired as lab technicians" — they can still play, but they must stand up to deliver their answers (social stakes).
  *   **The Twist:** The Funding Criteria change every round, mirroring the philosophical shift, but you describe them in plain English (e.g., "The Evolution Grant" vs. "The Biotech Contract").

  ## Phases and Timing (90 Minutes Total)

  | Phase | Minutes | Participant Instructions | What They Run Into |
  | :--- | :--- | :--- | :--- |
  | **1. Intro & Deal** | 10 | "You are R&D consultants. You get half the data each. Talk, don't show cards. Write one function sentence. Bet chips." | The friction of information asymmetry. They realize they see different "truths." |
  | **2. Round 1 (Baseline)** | 10 | Case: *The Horned Beetle.* Criteria: "Match the data." | Easy win. History and Mechanism align. Confidence builds. |
  | **3. Round 2 (Divergence)** | 12 | Case: *The Feathered Dino.* Criteria: "Must explain why ancestors survived." | History says "Warmth," Mechanism says "Flight." One partner feels they are lying. |
  | **4. Round 3 (No History)** | 12 | Case: *The Vanilla Yeast.* Criteria: "Must explain current output." | History says "Nothing/Artificial," Mechanism says "Make Vanilla." Can new things have functions? |
  | **5. Round 4 (System)** | 12 | Case: *The Gut Bacterium.* Criteria: "Must benefit the containing system." | Is the system the Bug or the Host? Vet and Nurse in the group will clash here. |
  | **6. Round 5 (Interest)** | 12 | Case: *The Human Appendix.* Criteria: "Two Clients: Surgeon vs. Evolutionist." | Impossible to satisfy both. They must choose who to please. Frustration peaks. |
  | **7. Debrief** | 22 | "Why was Round 5 impossible? Let's map your frustration." | You map their feelings to the two philosophical accounts. Reveal jargon. |

  ## The Dossiers (Card Contents)
  *Print these on cards. Cut horizontally. Partner A gets Top, Partner B gets Bottom.*

  **Case 1: Baseline (The Horned Beetle)**
  *   **History Card (A):** Ancestors with larger horns fought off rivals more effectively. Over 1,000 generations, horn size increased because those males reproduced more.
  *   **Mechanism Card (B):** The horn is a hard, bony protrusion. When swung, it knocks other beetles off branches. It consumes calcium from the diet.
  *   **Clash Type:** `baseline`
  *   **Predicted Split:** None. Both point to fighting.
  *   **Funding Criteria:** "The function must match what the trait physically does and why it exists."

  **Case 2: Divergence (The Feathered Dino)**
  *   **History Card (A):** Feathers first appeared in flightless ancestors. They provided insulation during a cooling climate. Flight came 10 million years later.
  *   **Mechanism Card (B):** Modern birds use feathers to generate lift and steer. They are aerodynamic surfaces. Insulation is secondary.
  *   **Clash Type:** `divergence`
  *   **Predicted Split:** A says "Warmth," B says "Flight."
  *   **Funding Criteria:** "The function is strictly what the trait was *originally* selected for." (History wins).

  **Case 3: No History (The Vanilla Yeast)**
  *   **History Card (A):** This strain was created in a lab last Tuesday. It has no evolutionary history. It was spliced using genes from a orchid and a bacterium.
  *   **Mechanism Card (B):** The yeast actively converts sugar into vanillin. It grows slower when doing so, but produces high yield.
  *   **Clash Type:** `no_history`
  *   **Predicted Split:** A says "No function (it's artificial)," B says "Make vanilla."
  *   **Funding Criteria:** "The function is what the trait *currently* contributes to the production goal." (Mechanism wins).

  **Case 4: Contested System (The Gut Bacterium)**
  *   **History Card (A):** The bacteria reproduce faster when they help the host digest fiber. If the host dies, the bacteria die.
  *   **Mechanism Card (B):** The bacteria secrete enzymes that break down cellulose. This provides nutrients to the host's bloodstream, not just the bacteria.
  *   **Clash Type:** `contested_system`
  *   **Predicted Split:** Is the function "Reproduce self" or "Digest for host"?
  *   **Funding Criteria:** "The function is defined by the survival of the *Host* organism." (System boundary shift).

  **Case 5: Interest Relative (The Human Appendix)**
  *   **History Card (A):** Ancestral primates used it to digest cellulose. Humans don't eat enough roughage for this anymore. It is vestigial.
  *   **Mechanism Card (B):** It acts as a safe house for beneficial gut bacteria during diarrheal illness, repopulating the gut afterward.
  *   **Clash Type:** `interest_relative`
  *   **Predicted Split:** Evolutionist says "Digestion (failed)," Doctor says "Immune reservoir."
  *   **Funding Criteria:** "Client 1 (Surgeon): Remove it if it doesn't help the patient now. Client 2 (Evolutionist): Label it by its origin." (Impossible to win both).

  ## Debrief Map
  *Use the flipchart. Draw two columns. Do not write the philosophical names yet.*

  | Moment | Point in Plain Language | Facilitator Line |
  | :--- | :--- | :--- |
  | **Round 2 Frustration** | "Function as History." | "In Round 2, some of you felt the 'origin' was the only real answer. You were thinking: A thing's job is why it was *built*." |
  | **Round 3 Frustration** | "Function as Current Utility." | "In Round 3, others felt that was nonsense. If it makes vanilla *now*, that's its job. You were thinking: A thing's job is what it *does* for the system." |
  | **Round 4 Confusion** | "System Boundaries." | "Round 4 broke because you couldn't agree on *whose* system we were talking about. The bug's? Or the human's?" |
  | **Round 5 Anger** | "Interest Relativity." | "Round 5 wasn't a puzzle to solve. It was a clash of perspectives. The 'right' answer depended on who was paying you." |
  | **The Reveal** | Naming the Views. | "Philosophers call the 'History' view the **Selected-Effect** account, and the 'Current Use' view the **Causal-Role** account." |

  ## Failure Modes & Fixes

  | What Goes Wrong | Why | Fix |
  | :--- | :--- | :--- |
  | **Pairs argue too long** | Perfectionism on the sentence structure. | Enforce the 10-minute bell strictly. Tell them: "A wrong guess is better than no guess." |
  | **Stakes cause anger** | Losing chips feels unfair when rules change. | Acknowledge it: "The game is rigged because the *science* is rigged. Feel that annoyance; that's the philosophy." |
  | **One partner dominates** | Expertise imbalance (e.g., the Vet takes over). | Remind them: "You cannot show cards. If you talk over your partner, you miss half the data." |
  | **Jargon slips early** | You or a participant knows the terms. | "Park it." Write it on the side of the flipchart to discuss only at the end. |
  | **Round 5 feels cheap** | Participants realize they can't win. | Confirm it: "This isn't a test. It's a demonstration that the definition breaks here." |

  ## Activity Limitations
  *   **Cannot Deliver:** The activity cannot tell them which definition is *metaphysically true*. It only shows that both are useful and conflict. You must state this: "We can't solve which one is 'Real' tonight; we can only see what work each one does."
  *   **Cannot Deliver:** It simplifies the "System" problem. Real biology is messier than "Host vs. Bug."

  ## Success Signs
  *   Audible groans when Round 2 and 5 Criteria are revealed.
  *   Partners physically turning cards face-down to stop themselves from cheating.
  *   Shouts of "But that's not what *I* saw!" during the debrief.
  *   The Vet and the Software Dev arguing about whether code has a "history" in Round 3.

  ## Jargon Reveal
  "For the last five minutes: the 'History' view you fought for is the **Selected-Effect** account, and the 'Current Use' view is the **Causal-Role** account."

  ***

