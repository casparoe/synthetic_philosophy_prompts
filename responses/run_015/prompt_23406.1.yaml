          *   Address Fact 2 (Database): This confuses *Ming* (Name) with *Shi* (Actuality/Storage). The database organizes objects, but the *Bai Ma Lun* analyzes concepts. The compound name requires two determinations, the simple name requires one.
          *   The "Is Not" (*Fei*) Clarification: He isn't denying biological classification; he's denying conceptual identity.
      *   **Assessment of the Threat:**
