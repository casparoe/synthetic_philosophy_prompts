answer: |-
  **MEMORANDUM**

  **TO:** Northgate Housing and Labor Standards Board
  **FROM:** Policy Office
  **SUBJECT:** Precedent Analysis and Prediction for Proposal 24-07 (Tenant-Anchored Stabilization)

  Per your request, the following analysis derives decision rules from the Board's nine prior rulings and applies them to Proposal 24-07. This assessment relies strictly on the Board's recorded reasoning and vote patterns, not on external policy efficacy.

  ### I. Derived Decision Rules

  Based on the nine precedents, three decision rules consistently explain the Board's approvals and rejections.

  **Rule 1: The Viability Constraint (Operating Cost & Solvency)**
  Price regulations must not threaten the financial viability of the housing stock or the solvency of small owners.
  *   *Support:* Case 5 (rejected CPI cap to prevent rents falling below operating cost); Case 7 (rejected freeze to avoid concentrated losses on small owners); Case 8 (limited relocation assistance to avoid owner insolvency).
  *   *Application:* Any mechanism that risks driving net revenue below operating costs or imposes unfunded liabilities on owners is likely to be rejected or modified.

  **Rule 2: The Unit-Locus Principle**
  Regulation attaches to the specific unit and the current transaction, not to the tenant's history across units or the landlord's portfolio size.
  *   *Support:* Case 9 (rejected portfolio cap, stating bargaining power is exercised at the unit level); Case 1 & 2 (caps apply to specific stock/turnovers, not portable entitlements); Case 6 (rejected commercial cap because tenants are repeat players, implying residential tenants are unit-bound).
  *   *Application:* Provisions that make rent control portable (following the tenant) or that differentiate obligations based on landlord portfolio size are inconsistent with this rule.

  **Rule 3: Fiscal & Administrative Sustainability**
  Subsidies or regulatory programs must be actuarially balanced and enforceable without creating perverse incentives (e.g., abandonment, deactivation).
  *   *Support:* Case 7 (preferred means-tested assistance over universal freeze); Case 4 (rejected platform floor due to enforcement evasion); Case 9 (approved vacancy fee only with dedicated revenue stream).
  *   *Application:* Proposals with projected budget deficits or mechanisms vulnerable to evasion/withdrawal are likely to be rejected.

  ### II. Application to Proposal 24-07

  **Overall Prediction:** **Rejection (6–3)**
  The proposal violates all three decision rules derived from the record. While it aligns with the Board's general desire to protect sitting tenants (Case 1), the structural mechanisms conflict with the Board's specific constraints on viability, unit-locus, and fiscal balance.

  **Clause-by-Clause Analysis:**

  1.  **Tenant-Anchored Cap (Portability):**
      *   *Prediction:* **Rejected.**
      *   *Reasoning:* Violates **Rule 2 (Unit-Locus)**. Case 9 explicitly established that bargaining and regulation occur at the unit level, not the portfolio or tenant level. Making the cap portable transforms it from a housing regulation into a personal entitlement, which the Board has not previously authorized.
  2.  **Immediate Decontrol of Vacated Units:**
      *   *Prediction:* **Accepted (as a compromise).**
      *   *Reasoning:* Aligns with **Rule 1 (Viability)** and Case 1 (exempting new supply). It ensures landlords can return to market rates upon turnover, mitigating the risk of withdrawal. However, this conflicts with Case 2 (rejecting vacancy decontrol to prevent stock erosion), creating a tension the Board may resolve by accepting decontrol only if the Fund is solvent.
  3.  **Nominal Freeze (5 Years) with Percentile Reset:**
      *   *Prediction:* **Rejected.**
      *   *Reasoning:* Violates **Rule 1 (Viability)**. Case 5 rejected a CPI cap without cost pass-through specifically because it could drive rents below operating costs. A *nominal* freeze (0% increase) for five years presents a higher risk of real-value erosion than the CPI cap rejected in Case 5.
  4.  **Funding Structure (Deficit Projection):**
      *   *Prediction:* **Rejected.**
      *   *Reasoning:* Violates **Rule 3 (Fiscal Sustainability)**. The Ordinance requires weighing "fiscal sustainability." The actuary projects a potential deficit (Outlays up to $140M vs. Revenue $95M). Case 7 rejected a universal freeze partly because targeted money was superior; an underfunded subsidy program is worse than a targeted one.
  5.  **Small-Landlord Opt-In (4 or Fewer Units):**
      *   *Prediction:* **Rejected.**
      *   *Reasoning:* Violates **Rule 2 (Unit-Locus)**. While Case 3 and Case 7 protected small entities, Case 9 (2023) is the most recent and specific housing precedent, rejecting a portfolio-based distinction (100+ units) on the grounds that regulation applies to the unit. Exempting based on owner size contradicts Case 9's logic.

  ### III. Closest Analog Precedent

  **Case 7 (2020 Rent Freeze Rejection)** is the closest analog.
  *   *Similarity:* Both proposals address rent affordability during economic stress. Both involve a trade-off between tenant protection and owner burden.
  *   *Outcome:* Case 7 rejected a universal price control in favor of a funded assistance program.
  *   *Relevance:* 24-07 attempts to hybridize price control and assistance. Given Case 7's rejection of a freeze due to "concentrated losses on small owners" and preference for "money than price controls," the Board is likely to reject 24-07's price control mechanism, especially given the funding shortfall.

  **Case 5 (2021 Rent Formula)** is a secondary analog regarding the nominal freeze. The Board's insistence on a cost-based standard over a CPI cap suggests they will not accept a nominal freeze that ignores operating cost inflation.

  ### IV. Underdetermination and Commitments

  The precedents **underdetermine** the answer regarding the **Tenant-Anchored** mechanism specifically.
  *   *The Conflict:* Case 9 (Unit-Locus) suggests rejection. However, the Chair's June remark ("the unit is the wrong thing to anchor a cap to") signals a potential doctrinal shift by the Board's leadership that is not yet reflected in the voting record.
  *   *Commitment if Approved:** The Board commits to portable housing entitlements, effectively overturning Case 9's Unit-Locus Principle. It also commits to accepting actuarial deficits for social stability, relaxing the Fiscal Sustainability criterion of the Ordinance.
  *   *Commitment if Rejected:** The Board reaffirms that housing regulation is unit-specific and that fiscal solvency is a hard constraint on tenant protections.

  **Test Proposal to Separate Rules:**
  To distinguish whether the Board prioritizes **Tenant Mobility** (overturning Case 9) or **Fiscal/Unit Viability** (upholding Case 5/7/9), the Board could rule on the following amendment:
  *   *Proposal:* "Fully Funded Tenant Voucher." Eligible tenants receive a city subsidy covering the difference between their current rent and market rent when they move. Landlords charge full market rate (no cap). Funded by general revenue with no projected deficit.
  *   *Prediction under Rule 1 & 3 (Viability/Fiscal):* **Approve.** (No rent cap risk, fiscally sound).
  *   *Prediction under Rule 2 (Unit-Locus):* **Reject.** (Benefit follows tenant, not unit).
  *   *Utility:* A vote on this would clarify if the Board's resistance to 24-07 is about the *cost* (Rules 1 & 3) or the *portability* (Rule 2).

  ### V. Analysis of Small-Landlord Exemption Analogy

  You asked whether the Board's treatment of employer size (2021) and tipped/platform workers (2022) transfers to the small-landlord exemption in 24-07.

  **Verdict: The analogy is misleading.**

  1.  **Case 3 (2021 Wage):** The exemption for employers with <20 employees was a **temporary phase-in delay**, not a permanent structural exemption. 24-07 offers a permanent exemption (unless opted-in). The Board has not established a precedent for permanent size-based exemptions in housing regulation.
  2.  **Case 4 (2022 Platform Work):** The rejection was based on **enforceability** (deactivation risk), not owner vulnerability. This does not support exempting small landlords based on solvency.
  3.  **Case 9 (2023 Portfolio Cap):** This is the controlling precedent. The Board explicitly rejected regulating based on landlord size (100+ units), stating bargaining power exists at the **unit level**.
      *   *Implication:* Exempting landlords with <4 units in 24-07 contradicts Case 9's specific finding that owner portfolio size is irrelevant to the regulatory logic. While Case 7 and 8 show concern for small owner solvency, they addressed *loss mitigation* (freeze/relocation), not *regulatory exemption*.

  **Conclusion:** The Board is more likely to view the small-landlord exemption as a violation of the Unit-Locus Principle (Case 9) than as a consistent extension of labor exemptions (Case 3). The Policy Office should advise that if the Board wishes to protect small owners, it should follow Case 5 and 8 (cost pass-throughs and limited assistance) rather than Case 3 (size exemptions).
