prompt: |-
  You are a political philosopher whose specialism is the analysis of liberty: Berlin's distinction between negative and positive freedom, the republican revival that treats freedom as non-domination, and more recent attempts to say what makes one person's option set larger or more secure than another's. I'd like you to think carefully, and before writing anything you'd stand behind, spend a few paragraphs brainstorming out loud: try two or three candidate principles against the cases below, notice where each of them strains, and only then commit to one. Please write the answer in British English, and please don't give me a literature survey or suggestions for further reading — I want the principle and its verdicts, not the bibliography.

  I'm trying to work out what I actually think about when someone counts as unfree, and my method has been to go case by case on gut reaction and then look for something that unifies the results. My flatmate designs recommendation systems, which is probably why I keep circling back to the fourth case. My verdicts: (i) a prisoner whose cell door stands unlocked with the corridor empty, but who believes it is locked and never tries it — not free to leave; an option you don't know you have doesn't seem to count. (ii) A slave with a genuinely kind master who never interferes and never would — unfree, obviously. (iii) A citizen compelled by a regime of taxes and jury service that she can contest, that answers to her, and that roughly tracks her interests and considered judgements — coerced, yes, but I don't want to say unfree in the way the slave is. (iv) A dispatcher at a logistics firm whose shifts are assigned by an algorithm that predicts her preferences so well that she always gets what she would have chosen, and whose every request is granted — I still want to say she is less free, though I can't point to a single option she has been denied, since at any moment her options look as good as they could be. (v) An addict who has thought about it and refused treatment — free, and forcing treatment on her would be wrong, even though I want to say her will isn't fully her own. (vi) Someone who voluntarily has a craving removed by therapy — more free afterwards, not less. (vii) Someone whose preferences were quietly reshaped by her employer's wellness programme, so that she now wholeheartedly wants the twelve-hour days she works and gets them — less free, not more. (viii) A gig worker with hundreds of tasks on offer, any of which the platform can withdraw without explanation — less free than a nurse with far fewer but contractually entrenched options; so the mere number of options isn't doing much work. (ix) A fisher exposed to weather and market prices — badly off, exposed, but not unfree; yet a fisher who can sell only to one buyer who sets prices on a whim — there I do want to say unfree. (x) A beneficiary of a trust that pays out only if she never marries outside the faith, set up by a great-uncle dead sixty years and alterable only by a supermajority of a family council — I'm genuinely torn: nobody now holds power over her, but somebody's will still shapes her options, and a mountain that blocks her road doesn't feel the same at all.

  The two pairs I can't reconcile are (iii) against (iv) — both look like another agent holding the power to interfere and exercising it only in ways that track your own will, yet I read them oppositely — and (v) against (vii), where I respect a will that damages the person and distrust a will that serves her. The thing I've been toying with is something like this: freedom is a matter of the modal profile of your option set — how many significant options it contains, how likely those options are to survive changes in other people's wills, and how far the set would stretch to accommodate a change of heart that nobody, you included, has yet anticipated (call this last one plasticity). Test that against the cases, repair it where it fails, and tell me plainly if plasticity is a red herring.

  What I want back: one principle, or a short list of rivals, stated precisely enough that I could apply it myself; a note on which case motivates each clause; an honest statement of which of my verdicts your principle cannot keep and which one you'd have me overturn; and verdicts on three cases I haven't listed — an advance directive I write at forty binding me at eighty with dementia (is my earlier self dominating me?), the restrictions a parent places on a fifteen-year-old, and a benefits system that steers claimants into work through defaults rather than requirements. If the honest answer is that no single notion of freedom covers all of this, say so, and tell me where the welded joint is.
