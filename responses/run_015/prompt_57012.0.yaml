      *   These are different. Law considers deterrence, public safety, retribution.
      *   "The mechanism was her own" -> Moral Responsibility.
      *   "She served 2 years" -> Legal Mercy/Politics.
      *   The theory doesn't dictate the sentence. It only dictates the *blameworthiness*. A pardon acknowledges blameworthiness but forgives the penalty. Or it acknowledges diminished capacity.
      *   The gap: Philosophy can't tell a judge how many years to give. It can only say "She is a proper target of blame" or "She is not."

  7.  **Drafting the Response (Iterative refinement):**
