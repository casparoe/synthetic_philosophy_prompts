      *   The problem: The "mechanism" isn't a switch that flips instantly. It's a process. If the SLA installed the desires (brainwashing), Frankfurt has a problem. Frankfurt assumes the desires are the agent's. If the desires are *implanted*, is the agent responsible?
      *   *History Matters:* The user mentioned the pushback: "if somebody installed the desires... history is supposed to matter." Frankfurt's theory is ahistorical. It looks at the structure of the will *now*. If I want to X, and I want to want to X, I am free. It doesn't matter if a cult programmed me to want X. This is a major criticism of Frankfurt (the "Manipulation Argument").
