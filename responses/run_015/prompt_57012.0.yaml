      *   *The User's "Open-Door Test":* This asks: "If the threat were removed, would she still do it?" This is inherently a counterfactual question about alternative possibilities. It asks about a world where the door *is* open. Frankfurt says we shouldn't look at worlds where things are different; we should look at *this* world and how the action was produced.
