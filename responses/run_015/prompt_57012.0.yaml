  4.  **Critique the "Open-Door Test":**
      *   The test is: "Would she do it if the door were open?"
      *   This is asking about *alternative possibilities*.
      *   Frankfurt's whole point is that alternative possibilities are irrelevant.
      *   Therefore, the User's test is philosophically opposed to Frankfurt, not an application of him.
      *   *Is the test useful?* Maybe practically, but philosophically it's vulnerable. A person might stay with captors due to Stockholm Syndrome (psychological coercion) even if the door is physically open. The door being open doesn't prove the will is free. It just proves the physical barrier is gone.
