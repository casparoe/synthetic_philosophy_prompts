          3.  Does this make CH meaningless? Why not use second-order logic?
      *   **Constraints:** No citations/reading lists. Plain reasoning. Tell the user plainly if they are muddled.

  2.  **Deconstruct Question 1: Transitivity and "Outside" vs. "Inside"**
