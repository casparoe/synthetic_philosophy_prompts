  Subject: Re: Notes on Parfit's Hitchhiker

  Thanks for sending these notes over. You asked for plain pushback rather than politeness, so I am going to be direct about where I think this argument is running into trouble. The core issue is that you seem to be solving a moral problem while pretending to solve a decision-theoretic one, and while that can be a valid critical strategy, you need to be much clearer about the distinction than you are currently being. Parfit's Hitchhiker case is designed specifically to probe the limits of Rational Self-Interest Theory, not to establish the existence of moral obligations. When you argue that the promise changes the ontology of the situation, you are essentially asserting that a speech act creates a normative fact that overrides instrumental calculation. That is a deontological claim, not a decision-theoretic one, and you are right to worry that you are smuggling in assumptions that a decision theorist would reject outright. A standard decision theorist will tell you that the payoff matrix only changes if your preferences change, and if your preferences are purely self-interested, the promise itself adds no utility to paying once you are safe. By claiming the situation itself has changed ontologically, you are bypassing the agent's preferences and asserting an external obligation, which is exactly what the instrumentalist framework denies.

  Your worry about conflating strategic precommitment with moral obligation is well-founded because that conflation is doing all the heavy lifting in your argument. In the standard literature, specifically in the work of David Gauthier who deals extensively with this kind of constrained maximization, the solution is to argue that it is rational to cultivate a disposition to keep promises because having that disposition gets you picked up in the first place. That is a strategic argument about precommitment. Your argument, by contrast, suggests that the promise creates an obligation that exists independently of the strategic benefit. If you are arguing that rationality requires you to follow this obligation, you need a theory of rationality that includes moral reasons as intrinsic to rational choice. Parfit actually anticipates this move to some extent because he spends a lot of time discussing how Rationality and Morality might converge. If you just assert that the promise changes the moral landscape, Parfit would likely reply that he agrees morality requires paying, but the puzzle remains whether it is rational for a self-interested agent to pay. You need to decide if you are arguing that the agent is irrational for not paying because they are ignoring moral reasons, or if you are arguing that the promise somehow alters the causal structure of the world in a way that makes paying instrumentally rational. The former is a moral critique, the latter is a metaphysical claim that needs much more support.

  The wedding vow analogy is risky and probably hurts more than it helps for the specific point you are trying to make. You note yourself that people break vows whenever it is convenient, which undermines the claim that the ontological change is robust or binding in the way you need it to be. If the ontological change relies on social recognition or internal guilt to enforce it, then it collapses back into a strategic calculation about reputational damage or psychological distress. If you want to argue that the obligation exists even without those enforcement mechanisms, you are making a very strong realist claim about normative facts that many philosophers reject. Furthermore, wedding vows are embedded in a thick social and often legal context, whereas the Hitchhiker case is deliberately stripped down to isolate the rationality of the promise in a vacuum. Using a socially thick example to explain a socially thin thought experiment invites the objection that you are importing external sanctions that Parfit explicitly removed from the case. You would be better off sticking to the logic of the promise itself rather than relying on an analogy that brings in so much extra baggage.

  Regarding your question about whether this distinguishes itself from standard contractualist readings, I think you are currently occupying a space that is too vague to be distinct. Contractualists like Scanlon argue that breaking a promise is wrong because it violates a principle that no one could reasonably reject. Your ontological claim sounds similar but lacks the justificatory structure. If you say the promise changes the situation, a contractualist will ask why it changes it, and you will likely end up giving a contractualist answer anyway. To make this interesting, you need to lean harder into the metaphysical aspect of the speech act. Are you arguing that promising is a performative that literally alters the normative status of the agents involved in a way that is irreducible to social conventions? If so, you are entering the realm of speech act theory applied to ethics, which is a fertile ground but requires you to defend the existence of these normative entities. If you are not prepared to defend that metaphysics, you should retreat to the claim that our concept of rationality is already saturated with moral commitments, which is a different argument entirely.

  You also asked if Parfit already addresses this kind of reading, and the honest answer is that he addresses the implications of it even if he does not use your specific terminology. Parfit is well aware that morality demands payment in the Hitchhiker case. His point is that Self-Interest Theory tells you not to pay, while Morality tells you to pay, and he uses this to show that Self-Interest Theory is self-defeating because it tells you to cultivate a disposition to ignore its own dictates. If your essay is just pointing out that morality requires paying, you are not adding much to the conversation. If your essay is arguing that Rationality itself should be defined to include these ontological commitments, then you are arguing for a substantive theory of Rationality that Parfit might actually agree with in his later work on Critical Rational Theory. However, you need to be careful not to present this as a solution to the Hitchhiker puzzle within the framework of Self-Interest Theory, because it isn't. It is a rejection of the framework itself.

  So to summarize the pushback, your premise is not confused, but your execution risks category errors that will make your essay easy to dismiss. You are treating a puzzle about rational choice as a puzzle about moral metaphysics. This is a valid move only if you explicitly state that you are challenging the definition of rationality being used. If you try to convince a decision theorist that the promise changes the ontology without changing the preferences or the payoff matrix, they will reject it as mysticism. You need to either commit to the deontological smuggling and own it as a critique of decision theory, or you need to explain how this ontological change translates into a preference or payoff that a rational agent would recognize. The vow analogy should probably be cut unless you can shore up why it survives the observation that people break vows constantly. Focus on the structure of the commitment itself rather than the social institution. If you can clarify whether you are attacking the theory of rationality or supplementing it with a theory of moral obligation, this could be a strong paper, but right now it straddles the line in a way that looks like confusion.
