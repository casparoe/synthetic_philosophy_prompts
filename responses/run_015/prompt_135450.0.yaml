  Conceptual Dependencies and Teaching Sequence (~180 words)
  Begin by defining the Careenium: a frictionless table with moving pucks (simmballs) and stationary magnets. Explain that low-level physics dictates all puck movements. Next, introduce high-level patterns (simms) as stable configurations of these pucks. Only after establishing bottom-up causal closure should you pose the central question: do simms cause simmball movements? This order is crucial because students must accept physical determinism before feeling the tension of downward causation. If you introduce patterns first, they will assume patterns are distinct entities rather than emergent descriptions. Finally, resolve the tension by distinguishing causal *mechanism* (bottom-up) from causal *explanation* (top-down). This ensures the problem arises from the framework, not confusion about physics. The dependency is clear: physics first, patterns second, causality conflict third, resolution fourth. Ensure each step locks to prevent category errors. Students need to feel the inevitability of the bottom level. Without this, they revert to dualism. The resolution must synthesize concepts into a coherent view. It is vital that the low-level description feels complete first. This pacing allows the cognitive dissonance to build appropriately before resolution.

  The Carrying Example: Requirements and Limits (~150 words)
  Use a whirlpool forming in a flowing stream. The water molecules (simmballs) follow fluid dynamics strictly. The whirlpool (simm) is a stable pattern of those molecules. It feels like the whirlpool pulls leaves in. Requirements: It must show stable structure emerging from flux without a designer. It must make the pattern feel "real" enough to seem causal. This visualizes how macro-behavior emerges from micro-rules without extra forces. Students must see the pattern as a physical constraint, not a ghost. Limits: Do not compare this to software running on hardware. Software implies a separate logical layer. The whirlpool *is* the water, not a program controlling it. Avoid any analogy suggesting a "reader" or "homunculus" interpreting the pattern. The causation must remain within the physical system, avoiding dualism. The example must resist intuition that the pattern is epiphenomenal smoke; it must feel clearly very active. Ideally, use this now. It works. Well.

  Misconception Map and Intervention Points (~180 words)
  The primary misconception is equating causal sufficiency with explanatory exclusivity. Students will argue, "Since physics explains every movement, patterns do nothing." Head this off immediately after establishing low-level closure. Explicitly state that bottom-up sufficiency does not erase top-down utility. A second error is reifying patterns as ghostly forces. Intervene when defining simms: emphasize they are configurations, not extra substances. A third risk is assuming a hidden programmer makes the patterns matter. Counter this during the example phase by stressing the system is closed. Finally, students may conflate "influence" with "violation of physics." Clarify at the resolution stage that downward causation is about explanatory leverage, not physical override. Addressing these sequentially prevents the discussion from devolving into physicalism vs. dualism debates, keeping focus on levels of description. Always monitor body language for signs of dualistic thinking during the example phase.

  Understanding Check (~90 words)
  Do not ask, "Does downward causation exist?" This invites slogan answers. Instead, "If a super-intellect predicted every simmball move, would the concept of a simm still be useful for explaining why the system behaved stably?" Present this scenario clearly. Ask them to justify the high-level description's value despite low-level predictability. Require verbal justification from each participant. Then. Proceed. Success looks like articulating that explanation depends on the observer's scale, not just the system's ontology. Failure looks like claiming the pattern physically pushes the balls or that the pattern is purely illusory.

  Boundaries: What This Level Must Omit (~90 words)
  Strictly omit Gödelian self-reference loops. These complicate the metaphysics of downward causation here. Do not extend the argument to human consciousness or free will. This session focuses on the ontology of patterns in simple systems, not the hard problem of mind. Avoid discussing quantum mechanics or indeterminism; keep the substrate classical and deterministic to sharpen the dilemma. Exclude computational functionalism entirely. Keeping the scope narrow ensures students grasp the emergent causality concept without getting lost in speculative theories of sentience or mathematical incompleteness. Focus remains on emergence.

  Confidence and Least-Sure Point (~70 words)
  I am confident in this sequence, as it mirrors Hofstadter's pedagogical scaffolding. The distinction between mechanism and explanation is robust. I am least certain about the "Whirlpool" example's resilience against the software analogy. Students immersed in digital culture may instinctively treat the pattern as code regardless of warnings. Ensuring they see the pattern as physical configuration rather than logical instruction may require more iterative clarification than the thirty-minute limit allows.
