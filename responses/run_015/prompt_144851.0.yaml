  **Node 5:** Is equality valuable instrumentally (e.g., for network stability or risk mitigation)?
  *   **YES** → **Leaf E: Instrumental Egalitarianism**
  *   **NO** → **Leaf F: Aggregative Relationalism**

  ---

  **Node 6:** Is priority weight determined by a sufficiency threshold or a continuous scale?
  *   **Threshold (Weight vanishes above floor)** → **Leaf G: Sufficientarian Prioritarianism**
  *   **Continuous (Weight diminishes gradually)** → **Leaf H: Pure Prioritarianism**

  ---

  ## Position Leaves & Awkward Commitments

  *   **Leaf A: Strict Telic Egalitarianism**
      *   *Commitment:* You must throttle a state-of-the-art model to match a broken one, even if the total network capability drops catastrophically.
  *   **Leaf B: Pluralist Egalitarianism**
      *   *Commitment:* Equality is genuinely good, but you must arbitrarily ignore it whenever the compute cost becomes too high.
  *   **Leaf C: Deontic Egalitarianism**
      *   *Commitment:* The gap between systems is morally offensive, yet you are forbidden from closing it if doing so requires constraining the better system.
  *   **Leaf D: Strict Utilitarianism**
      *   *Commitment:* You may ignore a failing system entirely if pouring its budget into the leading system yields even a marginal increase in total output.
  *   **Leaf E: Instrumental Egalitarianism**
      *   *Commitment:* You must restore inequality immediately if a technical fix ensures stability without equal capability scores.
  *   **Leaf F: Aggregative Relationalism**
      *   *Commitment:* You should harm a high-performer to reduce a gap even though equality has no intrinsic value, no instrumental benefit, and violates no rights.
  *   **Leaf G: Sufficientarian Prioritarianism (Equality Floor)**
      *   *Commitment:* Once all systems cross a specific performance benchmark, vast disparities above that line become morally irrelevant.
  *   **Leaf H: Pure Prioritarianism (Anti-Leveling)**
      *   *Commitment:* You must prioritize the worse-off system even when the disparity is negligible and the cost to the better-off system is massive.

  ---

  ## Structural Analysis

  **Unoccupied Combination:**
  **Leaf F (Aggregative Relationalism)** represents a logically possible but unoccupied combination (Relative Gap + No Separateness Constraint + No Intrinsic/Instrumental Value). It appears **incoherent/unattractive** because it advocates harming a party to reduce a gap without any compensating value (no intrinsic good, no utility gain, no rights protection), making the harm purely gratuitous.

  **Positions Not Separated Cleanly:**
  1.  **Pure Prioritarianism (Leaf H) vs. Sufficientarian Prioritarianism (Leaf G):** The tree cannot cleanly separate these if the sufficiency threshold is set extremely high or is vague; practically, they may prescribe identical allocation strategies depending on where the "floor" is drawn.
  2.  **Pluralist Egalitarianism (Leaf B) vs. Deontic Egalitarianism (Leaf C):** Both reject leveling down as all-things-considered obligatory, differing only on whether equality retains *some* intrinsic value (Pluralist) or is purely a constraint-based duty (Deontic), which may not yield different decisions in concrete compute allocation cases.

