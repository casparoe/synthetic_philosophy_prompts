answer: |-
  Here is a disambiguation of the claim 'conventions are arbitrary', structured as requested. The aim is to separate the logical space so you can pinpoint exactly where the argument in your reading group is slipping its gears.

  ### Table of Readings

  | Reading | What is Arbitrary? | Sense of 'Arbitrary' | Scope | Verdict | Supports Move 1? (Moral Shield) | Supports Move 2? (Fragility) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Historical Substitutability** | The fact that *this* regularity was selected over alternatives. | At the time of emergence, another equilibrium was available and would have served as well. | All conventions (origin point only). | **Substantive.** The standard Lewisian view. Survives scrutiny regarding origins. | **No.** Genetic fallacy. Origin does not dictate current normative status. | **No.** History does not determine current stability. |
  | **2. Payoff Symmetry** | The content of the regularity. | There is no independent reason (payoff difference) to prefer this rule to its alternative *now*. | Pure coordination cases only. | **False.** Many conventions are 'impure' (one side is slightly better), yet persist as conventions. | **Weakly.** If no reason exists, critique seems misplaced, but ignores distributional effects. | **Yes.** If payoffs are symmetric, expectations are the only anchor. |
  | **3. Normative Inertness** | The regularity's claim on us. | The rule is morally neutral; it creates no obligations beyond prudential coordination. | All conventions. | **False.** Conventions can encode injustice (e.g. segregation norms). | **Yes.** But only by begging the question. It asserts the conclusion (no obligation) as a premise. | **No.** Moral weight does not determine stability. |
  | **4. Expectational Fragility** | The regularity's persistence. | The regularity persists *only* because of mutual expectation; remove expectation, remove regularity. | Spontaneous conventions. | **False.** Ignores inertia, switching costs, and institutionalisation. | **No.** Irrelevant to moral critique. | **Yes.** This is the definition required for the move, but it is empirically dubious. |
  | **5. Capricious Origin** | The causal history. | The selection was random, unchosen, or without rational deliberation. | Spontaneous conventions. | **False.** Many conventions arise from deliberate (if local) problem-solving. | **No.** Rationality of origin does not validate current outcome. | **No.** Rational origins often create *more* stability, not less. |

  ***

  ### Discussion of the Two Moves

  **Move 1: The Moral Shield**
  *('Because conventions are arbitrary, there is nothing here to criticise.')*

  This move relies on a conflation of **Reading 1** (Historical Substitutability) with **Reading 3** (Normative Inertness). The speaker argues that because the rule *could have been otherwise* (Reading 1), it *ought not be judged* (Reading 3). This is a classic genetic fallacy. The fact that a coordination equilibrium was contingently selected does not entail that the distribution of burdens within that equilibrium is morally inert.

  If the group means **Reading 2** (Payoff Symmetry), the move is slightly more robust but still fails. Even if driving on the left is no better *intrinsicallly* than driving on the right, the *consequences* of that rule (e.g., who bears the cost of accidents, or who is excluded from the road) are not symmetric. To say the convention is arbitrary in content is not to say its *effects* are arbitrary. Therefore, Move 1 is generally unsound. It uses a metaphysical claim about the origin or structure of the rule to block a normative claim about its consequences.

  **Move 2: The Fragility Test**
  *('If it fails to dissolve upon shifted expectations, it was never a convention.')*

  This move relies entirely on **Reading 4** (Expectational Fragility). It treats 'convention' as a label for a specific, precarious psychological state. The claim is that if a regularity survives a shift in expectations, it must be held in place by 'genuine content' (e.g., moral reason or intrinsic payoff).

  This is empirically false. Conventions exhibit hysteresis. Once established, they create switching costs, sunk investments, and salience that allow them to persist even when mutual expectations waver. For example, the QWERTY keyboard layout persists despite widespread expectation that other layouts are more efficient. If your reading group adopts Move 2, they are defining 'convention' so narrowly that it excludes most real-world social norms. It confuses the *maintenance condition* (expectations help) with the *sole maintenance condition* (only expectations).

  ***

  ### Discussion of the Probes

  **Case (a): The Broken Microscope**
  *Everyone uses the left-hand microscope because the right-hand lamp is broken.*

  *   **Verdict:** This is likely **not a convention** under **Reading 1** or **Reading 2**, but it is a **regularity**.
  *   **Analysis:** Under **Reading 1** (Historical Substitutability), if the lamp broke *before* the habit formed, there was no alternative equilibrium available. It is a forced regularity, not a convention. If the habit formed *before* the break, it is a convention that has since lost its arbitrariness.
  *   **Implication:** This case highlights that 'arbitrariness' is often a historical property, not a current one. A convention can lose its arbitrariness over time (the alternative becomes physically impossible) without ceasing to be a convention in the sociological sense. If your reading group insists this is not a convention, they are privileging current substitutability over historical origin.

  **Case (b): The Fire Exit Corridor**
  *Everyone keeps left, although the right is safer.*

  *   **Verdict:** This **is a convention**, but it falsifies **Reading 2** (Payoff Symmetry).
  *   **Analysis:** Here, the options are *not* equal in independent payoff. The right side is objectively safer. Yet, the group coordinates on the left. This demonstrates that conventions can override independent reasons.
  *   **Implication:** This is a fatal counter-example to the idea that conventions require payoff symmetry. It supports the Lewisian view that conventions are solutions to coordination problems, not necessarily *pure* coordination problems. If the group uses 'arbitrary' to mean 'no independent reason to choose this', Case (b) shows that conventions are not arbitrary in that sense. They are arbitrary only in the sense that the *coordination value* outweighs the *intrinsic value*.

  ***

  ### Verdict on Your Proposed Partition

  You propose partitioning arbitrariness into: **Content-Arbitrariness**, **Selection-Arbitrariness**, and **Revisability**.

  **1. Content vs. Selection**
  This cuts at the joints. It distinguishes between 'there is no reason to prefer this rule to that one' (Content/Payoff Symmetry) and 'there was no reason why we ended up with this rule historically' (Selection). As Case (b) shows, you can have Selection-Arbitrariness without Content-Arbitrariness. Keeping this distinction clear will prevent the 'Moral Shield' error, as moral critique usually targets Content (the effects of the rule), while defenders retreat to Selection (the history of the rule).

  **2. The Problem with Revisability**
  Your worry is well-founded: **Revisability** conflates the *modal status* of the convention with its *dynamic potential*.
  *   **Arbitrariness** is typically a claim about justification or origin (why is it this way?).
  *   **Revisability** is a claim about power and friction (can we change it?).

  A rule can be arbitrary (in origin) but unrevisable (due to high switching costs). Conversely, a rule can be non-arbitrary (based on strong independent reasons) but highly revisable (if those reasons change). By including Revisability under the umbrella of 'Arbitrariness', you risk validating Move 2. Move 2 argues: 'If it is arbitrary, it is revisable (fragile).' If you define arbitrariness to *include* revisability, the claim becomes tautological but loses its explanatory power regarding the *nature* of the norm.

  **Recommendation:**
  Treat Revisability as a separate variable. Your partition should be a 2x2 matrix:
  1.  **Origin:** Arbitrary vs. Determined.
  2.  **Current Justification:** Arbitrary (Symmetric) vs. Determined (Asymmetric).
  3.  **Stability:** Fragile vs. Robust (independent of the above).

  This allows you to say: 'This norm was Arbitrary in Origin (Selection), is Non-Arbitrary in Content (due to the broken lamp or safety exit), but remains Robust (hard to change).' This taxonomy will allow you to dismantle the reading group's conflation precisely.
