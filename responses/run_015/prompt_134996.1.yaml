      *   *Premise:* Consent requires freedom to say "no" without undue negative consequence.
      *   *Mechanism:* Power isn't just physical force or explicit threats ("I'll fire you"). It's structural. It's about dependency and authority.
      *   *Teacher/Student:* The teacher holds evaluative power (grades, recommendations), institutional authority (discipline), and psychological authority (mentorship). Even if they don't grade *that* student, the *role* carries weight. The "1 year post-grad" rule acknowledges the lingering psychological impact.
      *   *Supervisor/Employee:* Similar structural power (scheduling, firing, promotion). However, the exit cost is different. Quitting a coffee shop job is generally easier than leaving a school system or escaping the psychological imprint of a teacher.
