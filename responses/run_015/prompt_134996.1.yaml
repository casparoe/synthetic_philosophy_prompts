  3.  **Address the Specific Questions:**

      *   *What does it presuppose about valid consent?* It presupposes consent is not just a "yes" but a "yes" given under conditions of relative autonomy. If the cost of "no" is disproportionately high due to the other party's control over your life, the "yes" is compromised.
      *   *Does coercion require threats?* No. Structural coercion exists. "I won't threaten you, but if you say no, I just happen to give you bad shifts" is the fear.
      *   *Why not dating the rich kid?* Because the rich kid doesn't hold *institutional authority* over you. They can't fail you or fire you directly.
      *   *Can one theory cover both?* Yes, the "Structural/Institutional Power Imbalance" theory. But the *degree* matters.
