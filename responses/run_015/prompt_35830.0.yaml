answer: |-
  Your intuition is correct: the argument proves too much. If it holds for history, it holds for geology, forensics, epidemiology, and evolutionary biology. Since we generally accept that geologists *can* explain the K-Pg extinction (even if they couldn't have predicted it from the Cretaceous stratigraphy alone), the argument must contain a flaw that applies to all "historical sciences."

  You should reject **Premise (2)**.

  Here is the breakdown of why this step is the failure point, why it looked plausible, the cost of rejecting it, and how to handle your desire to keep Premise (5).

  ### 1. The Defective Step: Premise (2)
  **The Premise:** *"To explain a historical outcome is to show that it was to be expected — that, given the antecedent conditions, it was more probable than its alternatives."*

  **Why it looked fine:**
  This premise relies on the **Covering Law Model** of explanation (associated with Carl Hempel), which dominated philosophy of science in the mid-20th century. It appeals to a rigorous, scientific ideal: if you truly understand a phenomenon, you should be able to say, "Given A, B *had* to happen (or was highly likely)." It conflates *intelligibility* (making sense of something after the fact) with *predictability* (foreseeing something before the fact). It feels like a safeguard against "just-so stories."

  **Why it is wrong:**
  Premise (2) asserts the **thesis of structural identity**: that explanation and prediction are logically symmetric. This has been widely rejected in philosophy of science, particularly regarding the "historical sciences" (a term Stephen Jay Gould used for fields like paleontology and geology).

  *   **The Syphilis Example:** The philosopher Michael Scriven offered a classic counter-example. Paresis (a form of neurosyphilis) is caused only by syphilis. However, only a small minority of people with syphilis develop paresis. If a patient has paresis, the *explanation* is perfectly valid: "He had syphilis." But you could never have *predicted* the paresis from the syphilis (low probability). Explanation does not require high prior probability.
  *   **The Geology Analogy:** As you noted, geologists explain the K-Pg extinction by pointing to the iridium layer, the Chicxulub crater, and shock quartz. This establishes a causal mechanism. It does not require showing that an asteroid impact was "more probable than alternatives" given the stratigraphy of 70 million years ago. The explanation is valid *ex post facto* even if the event was improbable *ex ante*.

  By rejecting (2), you decouple **explanation** from **prediction**. You can argue that historical explanation is about tracing causal mechanisms and establishing *Inference to the Best Explanation* (abduction), not about demonstrating statistical inevitability.

  ### 2. The Audit Test
  Once (2) is rejected, your friend's **Audit Test** collapses.
  The test demands that a redacted account allow a reader to *predict* the outcome. But if explanation $\neq$ prediction, then failing the audit test does not mean the explanation failed. It only means the history was contingent.
  A good historical account makes the outcome *intelligible* ("Ah, I see how A led to B, which made C possible"), not *inevitable* ("Given A, B was bound to happen"). The Audit Test measures prophecy, not understanding.

  ### 3. Pricing the Alternatives
  **If you reject (2) (Recommended):**
  *   **The Cost:** You must abandon the comfort of determinism. You have to admit that the past was "open" (as your friend says) and that outcomes were often contingent. You cannot claim the July Crisis *made war likely* in a statistical sense; you can only claim that *given* the decisions made, war followed causally. You lose the ability to say "it had to happen," but you keep the ability to say "this is how it happened."
  *   **The Gain:** You save historical inquiry (and geology, forensics, etc.) from skepticism. You align historiography with the actual practice of the historical sciences.

  **If you keep (2) (and accept the conclusion):**
  *   **The Cost:** You must embrace radical skepticism about all retrospective knowledge. You would have to concede that geologists do not *really* know why the dinosaurs died, that detectives do not *really* know who committed the murder (they only know who fits the evidence after the fact), and that evolutionary biologists cannot explain adaptations. This is a *reductio ad absurdum*. It renders the concept of "cause" useless in any singular, non-repeatable event.
  *   **The Gain:** Logical consistency within a very narrow, arguably obsolete, philosophy of science.

  ### 4. Reconciling Premise (5)
  You mentioned you want to keep **(5)**: *"Therefore no historian can ever show that an outcome was to be expected."*

  You **can** keep (5), provided you change its significance.
  *   **Your Friend's View:** (5) is damning because Explanation = Showing Outcome was Expected.
  *   **Your New View:** (5) is true but harmless because Explanation $\neq$ Showing Outcome was Expected.

  Historians indeed cannot show an outcome was *predictable* (expected *ex ante*) due to hindsight bias and contingency. But since explanation relies on causal tracing (*ex post* intelligibility) rather than prediction, (5) does not lead to (6) ("No historical explanation succeeds").

  ### 5. Addressing Hindsight Bias (Premise 1)
  You want to keep (1), and you should. Hindsight bias is real. However, it is a **psychological hazard**, not an **epistemic impossibility**.
  *   **The Friend's Error:** He assumes bias makes knowledge impossible.
  *   **The Correction:** Bias makes knowledge *harder*, requiring stricter methodological controls (counterfactual analysis, reliance on contemporary documents, peer review). We do not dismiss physics because physicists suffer from confirmation bias; we build methods to mitigate it. Similarly, historians mitigate hindsight bias by reconstructing the "horizon of expectation" of the actors, even if they know the outcome.

  ### Summary for Your Seminar
  Tell your friend:
  1.  **Accept the Geology Counter-Example:** If his argument kills history, it kills geology. Since geology explains things, the argument is unsound.
  2.  **Reject Premise (2):** Explanation is about causal mechanisms, not prior probability. Cite Scriven or the distinction between *prediction* and *explanation*.
  3.  **Reframe (5):** Agree that historians cannot *predict*, but deny that *prediction* is the metric of *explanation*.
  4.  **Dismiss the Audit Test:** It tests for prophecy, not causal understanding.

  The cost of this move is admitting that history is not a "predictive science" like classical physics. But that is a cost most historians are already willing to pay. The benefit is saving the discipline from self-inflicted nihilism.
