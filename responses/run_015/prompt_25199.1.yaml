          *   Expected Value of $B$ = $0.5 * (Y/2) + 0.5 * (2Y) = 0.25Y + Y = 1.25Y$.
          *   Since $1.25Y > Y$, you should switch.
      *   **The Paradox:** Once you switch to $B$, the same logic applies. Now $B$ is your current envelope, so $A$ should have an expected value of $1.25 * B$. So you should switch back. Infinite loop.
