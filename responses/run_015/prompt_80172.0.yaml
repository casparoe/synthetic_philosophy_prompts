answer: |-
  Your friend has a sophisticated grasp of the debate. This is not a pop-science summary; it reflects a solid reading of the primary literature (Laudan, Putnam, Worrall, van Fraassen). However, the summary adopts a specific philosophical stance—largely sympathetic to Structural Realism and Constructive Empiricism—and presents it as neutral fact.

  Here is an audit of the summary, piece by piece, from the perspective of a careful scientific realist.

  ### 1. The Definition of the PMI
  > **Friend's Claim:** "The PMI is the argument that most past successful scientific theories... were empirically adequate but ontologically false, so current successful theories... should probably be regarded as false too."

  *   **What a Realist Accepts:** This is a standard, accurate definition of Larry Laudan's (1981) formulation. Realists agree that the PMI targets *ontological commitment* (the existence of unobservables) rather than empirical adequacy.
  *   **What a Realist Pushes Back On:** Realists often dispute the premise that "most" past theories were successful. They argue Laudan's list is cherry-picked. More importantly, they introduce a **maturity constraint**. A careful realist argues that we should only induct from *mature* sciences (e.g., post-1900 physics) rather than including speculative early theories (like early optics or chemistry). If the sample is restricted to mature theories, the "success rate" of truth goes up significantly.
  *   **Simplification:** It implies a binary: theories are either "ontologically false" or "true." Realists often argue for *approximate truth*. Phlogiston theory wasn't 100% false; it captured real phenomena (oxidation) but misidentified the substance.

  ### 2. The Nature of the Argument
  > **Friend's Claim:** "It is basically an inductive argument from track record, and it does not undermine predictive success, only the claim that our best theories literally describe reality."

  *   **What a Realist Accepts:** Correct. The PMI is a second-order induction (an induction about inductions). It grants that science predicts well but denies that this warrants belief in the *existence* of the entities posited.
  *   **What a Realist Pushes Back On:** Some realists argue the PMI is a *reductio ad absurdum* of radical skepticism. If you trust induction enough to say "past theories were false, so current ones are false," you are relying on the very inductive reliability you are undermining regarding the theories themselves.
  *   **Simplification:** "Literally describe reality" is a loaded phrase. Realists usually argue for *reference*, not necessarily a perfect literal description. We can refer to electrons correctly even if our description of their behavior changes from classical to quantum.

  ### 3. The Critique of the No-Miracles Argument (NMA)
  > **Friend's Claim:** "The no-miracles argument is weak because it says that the success of a theory is best explained by its truth, but that just assumes the conclusion, since truth is not a naturalistic mechanism that can explain anything."

  *   **What a Realist Accepts:** A realist would acknowledge this is the standard *anti-realist* critique (associated with Bas van Fraassen). They would agree that if "explanation" requires a causal mechanism, semantic truth doesn't fit the bill.
  *   **What a Realist Pushes Back On:** **Strongly.** This is the most contentious part of your friend's summary. Realists defend Inference to the Best Explanation (IBE). They argue that "truth" (specifically, the existence of the posited entities) *is* the explanation for why we can manipulate nature. For example, we can spray electrons to kill tumors; the best explanation for our ability to do this is that electrons exist. To say truth "assumes the conclusion" misunderstands IBE; IBE is meant to *establish* the conclusion, not assume it.
  *   **Simplification:** The claim that truth "cannot explain anything" is a philosophical stance (Constructive Empiricism), not an established fact. Many philosophers of science argue that facts about reference and truth *do* have explanatory power regarding the stability of experimental results.

  ### 4. The Structural Realist Solution
  > **Friend's Claim:** "Structural realism is the smart move... because it keeps the invariant mathematical structure across theory change and gives up the old objects, so it blocks the PMI without begging the question."

  *   **What a Realist Accepts:** Many realists (like John Worrall) agree this is the *best* move. They accept that equations often survive theory change (e.g., Fresnel's equations survived the shift from luminiferous ether to electromagnetic fields) even if the ontology changes.
  *   **What a Realist Pushes Back On:**
      1.  **The Newman Problem:** If you keep only the "structure" (mathematical relations) and discard the "nature" of the objects, you risk triviality. Any set of objects can be arranged to fit any structure if you don't constrain the nature of the relata.
      2.  **Structure isn't always preserved:** Historians of science point out that sometimes the math changes radically too (e.g., the shift from Newtonian to Quantum mechanics).
      3.  **Ontic vs. Epistemic:** Your friend describes *Epistemic* Structural Realism (we can't know the objects, only the structure). *Ontic* Structural Realists argue there *are* no objects, only structures. A traditional realist rejects both, wanting to keep the objects.
  *   **Simplification:** It assumes structure and ontology are cleanly separable. In modern physics (e.g., Quantum Field Theory), the "structure" often *defines* what the object is. You can't easily keep one and drop the other.

  ### 5. The Final Claim: "The Only Non-Question-Begging Option"
  > **Friend's Claim:** "...Structural realism is... basically the only non-question-begging option."

  *   **Audit:** **This does not follow.** This is the weakest link in the summary.
  *   **Why it fails:**
      1.  **Selective Realism:** Philosophers like Stathis Psillos argue we can be "selective." We don't have to accept the *whole* theory as true. We can identify the "working posits" (the parts responsible for success) and believe in those, while discarding the "idle posits" (like the ether). This blocks the PMI without retreating to mere structure.
      2.  **Entity Realism:** Philosophers like Ian Hacking argue, "If you can spray them, they are real." This bypasses theory truth entirely and focuses on experimental intervention. It is a form of realism that is not Structural Realism.
      3.  **Optimistic Induction:** Some argue that because past scientists were wrong about *what* existed but right about *existence*, we should be optimistic that current entities exist, even if our description changes.
      4.  **Begging the Question:** Claiming Structural Realism is the *only* non-question-begging option is itself question-begging. It assumes that retaining "objects" is inherently question-begging in light of the PMI, which is precisely what Selective Realists deny.

  ### Summary Verdict

  **Fairness:** 8/10. Your friend clearly knows the literature.
  **Neutrality:** 4/10. The summary presents a Structural Realist/Constructive Empiricist synthesis as the settled conclusion of the debate.
  **Accuracy:** High on definitions, moderate on the evaluation of counter-arguments.

  **The Bottom Line:**
  A careful scientific realist would say: "Your friend has correctly identified the problem (PMI) and a popular solution (Structural Realism), but they have prematurely declared victory. The NMA is not as weak as they claim, and Structural Realism faces serious technical problems (Newman's Problem) that prevent it from being the 'only' viable option. Selective Realism remains a robust competitor that preserves belief in objects without ignoring history."

  If you want to challenge your friend, ask them about **Newman's Objection** to structural realism or ask them why **Selective Realism** (distinguishing working vs. idle posits) isn't a better way to save the objects without begging the question.
