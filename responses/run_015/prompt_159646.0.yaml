answer: |-
  Here is the operational procedure you asked for. It is designed to formalize your "Idealized Agent" approach while building in the safety rails your friend is demanding. It acknowledges that the "better-informed, clearer-headed version" of a patient is a construct, not a discovery, and treats it as such.

  ### The Procedure: Idealized Agency Protocol (IAP)

  **Purpose:** To generate an ethics recommendation that respects patient autonomy not as it *is*, but as it *would be* under conditions of full information and unimpaired processing, without imposing the consultant's values.

  **The Dials (Settings & Order):**
  You must adjust these variables in this specific order. Changing the order changes the verdict.
  1.  **Information (Beliefs):** Maximize accuracy. Correct all factual errors regarding prognosis, risks, and options.
  2.  **State (Interference):** Minimize distorting factors (pain, fear, exhaustion, delirium). *Exception:* Do not correct for fear if the fear is based on a core value (e.g., "I am afraid of being a burden" is a value, not just a state).
  3.  **Reasoning (Processing):** Correct logical inconsistencies and cognitive errors. *Constraint:* Do not correct the *weight* given to values. (e.g., You can fix the math on survival rates; you cannot fix the fact that they value dignity over length of life).
  4.  **Aims (Values):** **LOCKED.** Never adjust. If the idealized agent's aim is "die at home" vs. "live at all costs," you must accept it.

  ---

  #### Step 1: Authority & Capacity Check
  *   **Question:** Does the patient have decision-making capacity *right now*?
  *   **Good-Enough Answer:** Yes/No based on standard clinical assessment (understand, appreciate, reason, communicate).
  *   **Stop Point (NO):** If **No**, AND there is no surrogate/advance directive, **STOP**. Default to *Best Interests Standard* (Least Harm/Preserve Life). This is where your friend wins; you cannot channel an agent who does not exist and left no trace.
  *   **Hand-Off:** If **Yes**, proceed to Step 2. If **No** but surrogate exists, proceed to Step 2 (applying dials to the surrogate's understanding of the patient).

  #### Step 2: Information Calibration (Dial 1)
  *   **Question:** Is the decision-maker operating on medically accurate facts?
  *   **Good-Enough Answer:** They understand the diagnosis, the likely outcomes of all options (including doing nothing), and the probabilities involved.
  *   **Action:** If facts are wrong, the medical team must correct them. Re-assess the decision.
  *   **Stop Point:** If they refuse to hear facts or cannot retain them after correction, return to Step 1 (Capacity = No).

  #### Step 3: Interference Correction (Dial 2)
  *   **Question:** Is the decision being driven by transient impairment (panic, untreated pain, sleep deprivation, delirium) rather than stable preference?
  *   **Good-Enough Answer:** "The decision persists after pain is managed and acute distress is treated."
  *   **Action:** Treat the impairment. Wait 24 hours if safe. Re-ask.
  *   **Judgment Call:** Distinguish *fear of the outcome* (valid value signal) from *fear caused by confusion* (noise).
  *   **Stop Point:** If impairment is irreversible (e.g., advanced dementia) and no prior directive exists, **STOP**. Default to *Best Interests*.

  #### Step 4: Reasoning Consistency (Dial 3)
  *   **Question:** Does the decision logically follow from their stated values and the facts?
  *   **Good-Enough Answer:** "If they value X, and Option A achieves X better than Option B, they choose A."
  *   **Action:** Point out the inconsistency. ("You said avoiding dependency is your top priority, but this option guarantees dependency. Is that still what you want?")
  *   **Hand-Off Point:** If they say, "I know it's inconsistent, but I choose B anyway," **HAND OFF**. This is a value preference, not a reasoning error. You must defer.
  *   **Stop Point:** If the inconsistency suggests delusion (e.g., "The doctors are poisoning me"), return to Step 1.

  #### Step 5: The Counterfactual Test (The "Channeling" Step)
  *   **Question:** If we apply Dials 1–3, does a clear preference emerge that differs from the current raw input?
  *   **Good-Enough Answer:** A specific recommendation (Treat / Do Not Treat / Defer).
  *   **Constraint:** You are constructing a *hypothetical* preference. You must document *why* you believe this construction is more authentic than the current expression.
  *   **Harm Threshold (The Friend's Veto):** Does the "Idealized" decision result in catastrophic, irreversible harm that the patient might not truly intend (e.g., death from a reversible condition due to a paperwork error)?
      *   **Yes:** **STOP.** Recommend temporary treatment to buy time for clarity.
      *   **No:** Proceed to recommendation.

  #### Step 6: Values Deadlock
  *   **Question:** Is the disagreement about *facts/reasoning* or *ultimate values*?
  *   **Action:** If it is about values (e.g., Quality vs. Quantity of Life), and capacity is intact, **HAND OFF**. The committee cannot resolve value conflicts. The note should state: "Ethics confirms the decision is informed and consistent; disagreement rests on value weighting, which is within patient rights."

  ---

  ### Test Run: Three Cases

  #### Case 1: The 78-Year-Old with Dementia
  *   **Facts:** Advanced dementia. Admitted with reversible pneumonia. Prior directive (years old): "If I can't recognize my family, just let me go."
  *   **Step 1 (Capacity):** No. Surrogate needed. (Surrogate is son, conflicted).
  *   **Step 2 (Info):** Son understands pneumonia is reversible.
  *   **Step 3 (Interference):** Patient has no current pain.
  *   **Step 4 (Reasoning):** The directive is the only evidence of values.
  *   **Step 5 (Counterfactual):** We attempt to construct the "Idealized Patient."
      *   *Dial Check:* The directive says "let me go." It does not specify "no antibiotics for reversible acute conditions." It implies a general state of being, not a specific medical intervention.
      *   *Current State:* The patient appears content in their dementia (smiles, eats).
      *   *Conflict:* Past Self (values recognition) vs. Current Self (values comfort/life).
      *   *Procedure Output:* **Recommend Treatment.**
      *   *Reasoning:* The "Idealized Agent" construction fails to validate the scribble as a binding refusal of *this* specific treatment. The vagueness of "let me go" cannot override the current sentient interest in living when the burden of treatment (antibiotics) is low. We cannot construct a clear "No" from a vague prior statement.
      *   **Why You Will Hate This:** This defaults to *Best Interests* (Preserve Life) because the "Channeling" failed. It effectively silences the patient's past voice because it wasn't legally precise enough. It validates your friend's view ("Just do the least harm/keep them alive") over your view ("Channel their true will"). It feels like bureaucratic gaslighting of the dead man's wish.

  #### Case 2: The Pregnant Patient
  *   **Facts:** Young, pregnant, critical condition. Says "Do everything." Believes she will recover fully; team says survival is <5% with severe morbidity.
  *   **Step 1 (Capacity):** Yes, technically.
  *   **Step 2 (Info):** **FAIL.** She is operating on a false prognosis.
      *   *Action:* Attending must clarify prognosis explicitly. "There is a 95% chance you will die, and the baby may not survive."
  *   **Step 3 (Interference):** Fear is high, but based on the false info.
  *   **Step 4 (Reasoning):** Once info is corrected, re-evaluate.
  *   **Step 5 (Counterfactual):**
      *   *Scenario A:* She says, "Even with 5% chance, I want to try." -> **Defer.** (Value: Hope/Risk).
      *   *Scenario B:* She says, "Oh, I thought I'd live. No, then I want comfort care." -> **Recommend Comfort Care.**
      *   *Procedure Output:* **Do not write the note yet.** The note cannot be written until Step 2 is passed. The recommendation is "Pause intervention until informed consent is verified."
      *   *Why this works:* It stops the "made-up character" problem. You aren't guessing what she wants; you are ensuring the "her" that decides is real.

  #### Case 3: The Surrogate Who is the Sole Heir
  *   **Facts:** Patient in PEG tube debate. Surrogate (daughter/sole heir) wants tube removed. Patient previously said "I hate being a burden."
  *   **Step 1 (Authority):** Yes.
  *   **Step 2 (Info):** She understands medical facts.
  *   **Step 3 (Interference):** Financial conflict of interest exists.
      *   *Dial:* Does the conflict distort the *values* or the *facts*?
      *   *Check:* Does the decision align with the patient's known values ("hate being a burden")?
  *   **Step 4 (Reasoning):** If the patient hated burdening family, and the cost/care is a burden, removing the tube is *consistent* with patient values, even if it benefits the heir.
  *   **Step 5 (Counterfactual):** Would the patient want the heir to make this call? If yes, proceed.
  *   **Procedure Output:** **Recommend Removal.**
      *   *Caveat:* Document the conflict explicitly. "Decision aligns with patient's prior expressed values regarding burden. Financial interest is noted but does not appear to be the primary driver of the value judgment."
      *   *Risk:* If you are wrong about the driver, you enabled euthanasia for profit. But the procedure forces you to look at *values alignment*, not just *conflict existence*.

  ---

  ### The Confession: Judgment Calls & Limits

  You asked for the "judgment calls wearing a lab coat." Here they are. This is where you and your friend will still fight, because the procedure cannot automate these.

  1.  **The "Value vs. Fear" Dial (Step 3):**
      *   *The Call:* Deciding if "I'm scared" is a symptom to be medicated or a value statement ("I value safety over risk").
      *   *The Risk:* If you treat the fear, you might change the decision. If you don't, you might be letting panic drive a life-or-death choice.
      *   *The Fix:* Ask: "If the pain/fear were gone, would the *reason* for the choice remain?" If yes, it's a value. If no, it's interference.

  2.  **The "Vagueness" Threshold (Case 1):**
      *   *The Call:* How specific does a prior directive need to be to count as the "Idealized Agent's" voice?
      *   *The Risk:* As seen in Case 1, strict specificity requirements favor the "Least Harm/Preserve Life" default (your friend's view). Loose specificity requirements favor "Channeling" (your view) but risk projecting your own biases into the gaps.
      *   *The Fix:* The procedure defaults to *Life* in ambiguity. You cannot operationalize "guessing" without bias.

  3.  **The "Harm Threshold" (Step 5):**
      *   *The Call:* What counts as "Catastrophic"?
      *   *The Risk:* This is pure paternalism. It is the backdoor where you (or the committee) say, "We know better."
      *   *The Fix:* Limit this to *irreversible* death/disability resulting from *correctable* errors (facts/state). Do not use it for value disagreements.

  ### What This Procedure Cannot Do

  1.  **It cannot resolve value conflicts.** If the patient values "Dignity" and the family values "Life," and both are informed and rational, this procedure hands the decision back to the legal hierarchy. It does not solve the tragedy.
  2.  **It cannot prove the "Idealized Agent" exists.** Your friend is right: this is a fiction. The procedure admits this by requiring you to document *why* the construction is valid. It shifts the burden of proof to you.
  3.  **It cannot protect you from regret.** In Case 1, if you treat and the patient survives in a state they would have hated, you followed the procedure but failed the patient. In Case 3, if the heir was lying, you followed the procedure but enabled harm.

  **Final Note for the Committee Chair:**
  This protocol prioritizes *procedural integrity* over *outcome certainty*. It admits that we are constructing a preference, not finding one. It forces us to correct facts and state before we correct reasoning, and it forbids us from correcting values. When the construction fails (Case 1), it defaults to safety (Life). When it succeeds, it empowers the agent (Case 2 & 3). It is not magic; it is damage control.
