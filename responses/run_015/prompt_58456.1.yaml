  hey so ive been turning over that extended mind idea in my head on my drives and i think i might be mixing myself up. i do delivery driving and i honestly couldnt do the job without my whole setup: ive got this beat up notebook in my door pocket with gate codes and shortcuts i scribbled myself and i check it without even thinking, ive got my phone on the dash running maps all day, and my girlfriend will text me stuff like remeber the back gate on elm is broken use the side. they all do the same job for me which is holding onto stuff so i dont have to. so does that mean theyre all literally pieces of my memory now? cause last week my phone died halfway through my shift and i blanked on like three stops, and my buddy joked it was like a little brain injury. that feels wrong to say but isnt that what the idea says, that if you lean on something hard enough it stops being just a tool and starts being your mind?
