          *   *Conflict:* (2) says confidence comes from conceptual analysis (bounding argument: finite steps + bounded memory $\rightarrow$ TM). (6) says confidence comes from empirical lack of counterexamples and admits empirical evidence *could* shift the view.
          *   *Severity:* High. This is the core epistemic conflict. Is CTT conceptual or empirical?
          *   *Resolution:* Must choose. If (2) holds, (6) is mistaken about the *source* of justification (though empirical data supports the premises of the bounding argument). If (6) holds, (2) is overstated; the bounding argument relies on empirical assumptions about physics/cognition.
          *   *Cost:* Structural. Determines the whole argument's flavor (Kantian/Conceptual vs. Quinean/Empirical).

      *   **Tension C: (5) Immunity vs. (6) Vulnerability.**
          *   *Conflict:* (5) says hypercomputation *cannot* refute (1) by definition (not "effective"). (6) says hypercomputation *would* be evidence against (1) (intuitions were parochial).
          *   *Severity:* Critical. Direct contradiction. You can't say "It's impossible for X to refute Y" and "X would refute Y."
          *   *Resolution:* (5) relies on a rigid definition of "effective." (6) admits the definition might shift based on physical possibility.
          *   *Cost:* Structural. One must go. If (5) stays, (1) is analytic/stipulative (violates 1). If (6) stays, (1) is empirical (violates 2's bounding argument).

      *   **Tension D: (1) Substantive Claim vs. (5) Definitional Immunity.**
          *   *Conflict:* (1) says CTT is not a definition. (5) protects CTT from refutation by defining "effective procedure" in a way that excludes hypercomputation *by fiat*.
          *   *Severity:* High. If you define "effective" to exclude hypercomputation, CTT looks like a stipulation.
          *   *Cost:* Structural. Threatens the core claim (1).

      *   **Tension E: (2) Bounding Argument vs. (3) Vagueness.**
          *   *Conflict:* Bounding arguments usually require precise premises. If the input notion is vague, the deduction is shaky.
