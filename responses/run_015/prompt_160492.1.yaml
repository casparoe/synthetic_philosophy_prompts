      *   **(3) Vagueness:** The pre-theoretic notion is vague at the edges. This is a feature of the concept.
      *   **(4) Physical CTT (PCTT):** Distinct from (1). Contingent, empirical, possibly false.
      *   **(5) Hypercomputation Immunity:** A physical hypercomputer (e.g., deep-well machine) refutes PCTT (4) but *not* CTT (1). Reason: Supertasks/infinite precision aren't "effective procedures" (finite agent, rules).
      *   **(6) Empirical Grounding/Nagging Doubt:** Confidence actually rests on "no counterexample found." A working deep-well machine *would* be evidence against (1) because it shows our intuition about "what we can do" was parochial.

