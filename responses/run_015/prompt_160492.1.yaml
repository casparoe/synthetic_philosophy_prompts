      *   (5) vs. (6): Hypercomputation doesn't refute (1) vs. Hypercomputation *is* evidence against (1).
      *   (1) vs. (5): If CTT is about "effective procedures," and a physical device computes uncomputable functions, does that change what counts as "effective"?
      *   (2) Bounding Argument vs. (3) Vagueness: If the notion is vague, can a rigorous bounding argument apply to it without precisification?

  4.  **Detailed Pairwise Analysis (Drafting the Audit):**

      *   **Tension A: (1) Determinate Truth vs. (3) Vagueness.**
          *   *Conflict:* How can an identity claim involving a vague term have a determinate truth value? If "effective procedure" is vague, the extension is fuzzy. An identity claim ($A = B$) usually requires precise extensions to be strictly true/false.
          *   *Severity:* High. This is a semantic/metaphysical hurdle.
          *   *Resolution:* Need a theory of vagueness (epistemicism? supervaluation?) or clarify that the *core* is determinate even if edges are vague.
