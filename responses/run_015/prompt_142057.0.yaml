answer: |-
  ### 1. The Order of Components

  **Sequence:**
  1.  **Phenomenology of the Stalemate:** Establish that intelligent, informed agents can agree on all empirical data and semantic definitions yet still disagree.
  2.  **The Disambiguation Procedure:** Apply the test: hold the meaning fixed, check for remaining disagreement.
  3.  **The Residue Classification:** Identify what remains after disambiguation. Distinguish "Factual" from "Stipulative" from "Framing."
  4.  **The Methodological Wrinkle:** Demonstrate that the verdict depends on which term is held fixed, revealing the procedure as a mapping tool, not a truth-decider.
  5.  **The Check:** Apply the procedure to a novel case.

  **Why this is the only workable order:**
  You cannot diagnose a dispute as "merely verbal" (Step 2) until students feel the weight of the disagreement (Step 1); otherwise, "verbal" registers as "trivial." You cannot classify the residue (Step 3) until you have performed the disambiguation (Step 2); otherwise, the third category (Framing) collapses back into "Factual" because they haven't seen the facts exhausted. Crucially, the **Methodological Wrinkle (Step 4)** must come *after* they have successfully used the procedure. If introduced earlier, it undermines their confidence in the tool, leading to skepticism ("the method doesn't work"). If introduced later, after the Check, it complicates the assessment. It must land as a refinement: "You have successfully mapped the disagreement; now notice that the map changes depending on your projection."

  The distinction between "disagreement about the world" and "disagreement about which question to ask" must be drawn at **Step 3**. If drawn at Step 1, it is abstract and unconvincing. If drawn at Step 4, it is too late to prevent them from classifying the residue as "brute fact." It must be drawn precisely when they expect the argument to vanish but find it persists.

  ### 2. The One Example

  **The Case:** **"Are viruses alive?"**

  **What it must have:**
  *   **Full Empirical Agreement:** All students must agree on the biology (viruses have genetic material, replicate, but lack independent metabolism/cells). No hidden facts about viruses can be discovered to settle it.
  *   **Charitable Parties:** Biologists on both sides are not confused; they know the definitions.
  *   **High Stakes:** The classification determines funding streams, journal categories, and how we model evolution. It is not a trivial label.
  *   **A Non-Factual Residue:** Once "life" is defined (e.g., "requires metabolism"), the biologist who says "viruses are alive" does not deny the definition but argues the definition is *biologically unhelpful*.

  **What it must lack:**
  *   **Vagueness:** It cannot be a "heap" case where we are unsure where the line is drawn. The criteria are sharp; the disagreement is over *which* sharp criteria to adopt.
  *   **Metaphysical Baggage:** It must not trigger prior commitments about "essences" or "souls" that distract from the theoretical utility.

  **Why not the composite-objects dispute?**
  The students are currently entrenched in the first-order positions (nihilism vs. universalism). Using it here forces them to defend their ontological commitments rather than analyze the structure of the dispute. They cannot view the dispute from the outside because they are still inside it.

  **Why not vague predicates (tall/heap)?**
  Vagueness suggests that the resolution is *arbitrary* (drawing a line anywhere is as good as anywhere). This reinforces the misconception that "if it's not factual, it's stipulation." The virus case shows that the choice is *constrained by utility*, not arbitrary, which is necessary to introduce the "Framing" category.

  ### 3. Misconceptions and Intervention Points

  **Misconception 1: "Merely verbal" means "a waste of time."**
  *   **Formation:** Immediately upon hearing the phrase in Step 1.
  *   **Intervention:** Pre-empt this in the opening minute. Define "verbal" strictly as "turning on the selection of concepts," not "unimportant." State explicitly: "We are investigating whether a dispute is verbal to understand its *structure*, not to dismiss it."

  **Misconception 2: "Once defined, the argument disappears."**
  *   **Formation:** During Step 2 (Disambiguation). They will expect the virus debate to vanish once "life" is defined.
  *   **Intervention:** Head this off by presenting the "Residue." Show a quote from a biologist who accepts the standard definition but argues *against* using it. Force them to see the argument persists *after* semantic clarity.

  **Misconception 3: "The only options are Fact vs. Stipulation."**
  *   **Formation:** During Step 3 (Classification). When they see the residue is not factual, they will default to "arbitrary stipulation."
  *   **Intervention:** Introduce the third category here. Rename "theoretical-role disputes" to **"Framing Disputes."** Explain: "They agree on the world, agree on the words, but disagree on which map helps us navigate better."

  **Misconception 4: "If language is involved, there are no facts."**
  *   **Formation:** During Step 4 (The Wrinkle). When they realize the verdict depends on whose term is fixed, they may conclude ontology is ungrounded.
  *   **Intervention:** Frame the Wrinkle as a feature of *inquiry*, not a bug of *reality*. "The procedure does not tell you who is right; it tells you what kind of work needs to be done. Discovering that a dispute is a Framing Dispute tells you that the work is comparative theory-building, not empirical discovery."

  **The Wrinkle Placement:**
  Place this at **Step 4**. If you show them that holding "Virus" fixed yields a different result than holding "Life" fixed *before* they master the basic procedure, they will not trust the procedure. Once they have used it successfully on the virus case, reveal that the output changes if they swap the anchor term. This transforms the wrinkle from "the method is broken" to "the method reveals that conceptual choice is part of the scientific/philosophical labor."

  ### 4. The Check for Understanding

  **The Task:**
  Present the following legal scenario: *A city ordinance bans "vehicles" from the public park to ensure quiet and safety. A memorial consists of a vintage WWII Jeep, welded to the ground, engine removed, used as a flower planter. A citizen sues, claiming the Jeep is a "vehicle" under the ordinance. The city argues it is not.*

  **Instruction:** "Do not tell me who is right. Apply the procedure. 1. Disambiguate 'vehicle'. 2. Identify the residue. 3. Classify the residue."

  **The Failing Answer (The "Merely Verbal" Student):**
  *   "This is just a verbal dispute. They need to define 'vehicle' better. Once they define it, the case is settled."
  *   *Diagnosis:* They treat disambiguation as a termination of the argument. They miss the residue.
  *   *Or:* "It's not verbal, there's a fact about whether it's a vehicle."
  *   *Diagnosis:* They fail to separate the metalinguistic question from the internal question.

  **The Passing Answer (The "Procedure" Student):**
  *   "We can define 'vehicle' as 'motorized transport' or 'anything originally designed as transport.' Both parties agree on the physical facts of the Jeep (welded, no engine). The disagreement survives definition. It is not a factual dispute about the Jeep's mechanics. It is a **Framing Dispute**: Does the *purpose* of the ordinance (quiet/safety) serve better by excluding all transport-shaped objects, or only functioning ones? The disagreement is about which classification best achieves the law's goal."

  ### 5. Refusals and Boundaries

  **What to Refuse:**
  1.  **Metasemantic Theory:** Do not explain *how* words get their meanings (causal theories, descriptivism, etc.).
  2.  **Model-Theoretic Apparatus:** Do not use formal semantics, possible worlds models, or intensional logic to diagram the dispute.
  3.  **The Epistemology of Disagreement:** Do not discuss how peers should revise credences in light of disagreement.

  **How to Mark the Boundary:**
  When a student asks a question that drifts into these zones (e.g., "But what makes the word 'vehicle' mean that?" or "Can we model this with set theory?"), use the **"Tool vs. Engine"** marker.

  **Script:** "That is a question about how the engine works (metasemantics/formalism). We are learning how to drive the car (apply the procedure). If we stop to rebuild the engine now, we will not get where we are going. For the purposes of this section, treat meaning as fixed and focus on the usage. We will return to the engine in [Course Level/Next Unit]."

  This marks the refusal as a pedagogical boundary necessary for the current task, rather than an evasion of a hard question.
