      *   **Instructor Goal:** Do *not* adjudicate the first-order ontological question. Teach a *procedure*:
          1.  Separate metalinguistic/conceptual questions from internal questions.
          2.  Ask what survives after settling the metalinguistic question.
          3.  Classify the residue (it's not always factual vs. stipulation; it can be about *theoretical role/framing*).
      *   **Specific Constraint:** Rename "theoretical-role disputes" if it might misfire.
      *   **Deliverables:**
          1.  Order of components (and why).
          2.  The One Example (criteria, why not composites/vagueness).
          3.  Misconceptions (order of formation, when to head off).
          4.  Check for Understanding (task, failing vs. passing answers).
