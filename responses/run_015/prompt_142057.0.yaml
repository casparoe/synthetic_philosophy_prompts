  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Trap:* Students equate "merely verbal" with "trivial/waste of time." They also equate "not verbal" with "brute fact about the world." They lack the middle category: pragmatic/theoretical utility disputes.
      *   *The Procedure:* Needs to be actionable. Disambiguate $\rightarrow$ Check Residue $\rightarrow$ Classify Residue.
      *   *The "Wrinkle":* Disambiguation isn't neutral. Holding Term A fixed vs. Term B fixed yields different results. This needs to be a feature, not a bug.
      *   *Time:* 50 minutes is tight. Needs a tight script.

  3.  **Drafting Component 1: Order of Operations:**

      *   *Why order matters:* You can't diagnose a verbal dispute without first establishing there *is* a dispute. You can't identify the residue without first disambiguating. You can't appreciate theoretical role without seeing that factual disagreement is exhausted.
      *   *Sequence:*
          1.  Establish the Disagreement (Phenomenology).
          2.  Apply the Disambiguation Test (The Procedure).
          3.  Identify the Residue (The Surprise).
          4.  Classify the Residue (Theoretical Utility).
          5.  Reflect on the Method (The Wrinkle).
      *   *Critical Juncture:* The distinction between "disagreement about the world" and "disagreement about which question to ask" must happen *after* disambiguation but *before* declaring the residue trivial. If drawn too early, it collapses into "it's all just words." If drawn too late, they think the residue is factual.

  4.  **Drafting Component 2: The One Example:**

      *   *Criteria:* Not composites (too fresh/loaded). Not vagueness (heap/tall invites "it's arbitrary" conclusion). Needs informed, charitable parties. Needs stakes. Needs a residue that isn't factual.
      *   *Candidate:* **The Planet Pluto / Dwarf Planet dispute.**
      *   *Why:* Everyone knows it. It looks like a definition fight ("Is it big enough?"). But astronomers didn't just stipulate; they argued about *classification schemes* for future discovery.
      *   *Why not Composites:* Students are too entrenched. They think they know the answer (nihilism vs. universalism).
      *   *Why not Vagueness:* Vagueness suggests "no fact of the matter" = "arbitrary." We want "no fact of the matter" = "choice of theoretical framework."
      *   *Alternative:* **Biological Species Concepts** (e.g., is a ring species one species or two?). This is strong because biologists agree on the genetics (facts) but disagree on the *category* utility. Let's go with **Species** or **Pluto**. Pluto is more accessible for a 50-min section. Actually, **The "Planet" definition** is better because it mirrors the "composite object" structure (is this thing a member of that class?) without the metaphysical baggage.
      *   *Refinement:* Let's use **The status of "Pluto" as a Planet (2006 IAU decision)**.
      *   *What it must have:* Agreement on data (orbit, size, shape). Disagreement on utility (does this category help us find other things?).
      *   *What it must lack:* Hidden empirical facts (we know Pluto's mass). Semantic confusion (they defined "planet" explicitly).

  5.  **Drafting Component 3: Misconceptions & Timing:**

      *   *Misconception 1:* "Merely verbal = Trivial." (Head off at the start: define "verbal" as "conceptual boundary," not "pointless").
      *   *Misconception 2:* "Disambiguation kills the argument." (Head off during the Residue phase: show the argument continues even after definitions are clear).
      *   *Misconception 3:* "Only Fact vs. Stipulation." (Head off during Classification: introduce the third category).
      *   *Misconception 4:* "If language is involved, no facts exist." (Head off at the end: language maps facts, doesn't erase them).
      *   *The Wrinkle:* "Whose term is fixed?" This needs to come *after* they think they have a solid procedure. It shows the procedure is a tool for mapping, not a calculator for truth.

  6.  **Drafting Component 4: Check for Understanding:**

      *   *Task:* Needs to be outside metaphysics. Law or Policy is good.
