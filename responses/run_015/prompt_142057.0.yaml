      *   *Re-evaluating the Label:* "Theoretical-role disputes." "Framing" is good. **"Disputes of Categorial Utility"**. Let's stick close to the prompt's intent. **"Disputes of Theoretical Fruitfulness"**.

      *   *Re-evaluating the Wrinkle:* "Whose term is held fixed." If I say "Planet," Pluto is out. If I say "Pluto," the definition of Planet changes. This shows the procedure isn't a truth-machine. It's a map.

      *   *Re-evaluating the Check:* Needs to be outside metaphysics. **Law** is the best domain for this. "Is an electric scooter a 'vehicle' in the park?"
