  7.  **Drafting Component 5: Refusals:**

      *   *What to exclude:* Metasemantics (how words get meaning), Model Theory (formal semantics), Epistemology of Disagreement (how to resolve peer disagreement).
      *   *How to mark:* "That is a question for the *machinery* of the theory, not the *use* of the tool. We are learning to drive, not build the engine."

  8.  **Review and Refine:**

      *   *Label:* "Theoretical-role disputes." The prompt says rename if it misfires. "Theoretical-role" sounds a bit dry. **"Framing Disputes"** or **"Taxonomic Disputes"**. Let's use **"Disputes of Theoretical Utility"** or simply **"Framing Disputes"**. "Framing" captures the "how to ask the question" aspect well. Let's go with **"Disputes of Theoretical Fruitfulness"**.
      *   *Order:* Ensure the "Wrinkle" (disambiguation isn't neutral) doesn't undermine the lesson. It must show that *choosing* a frame is part of the work.
      *   *Timing:* 50 mins is very short.
          *   Intro/Example Setup: 10 min.
          *   Disambiguation Step: 10 min.
          *   Residue/Classification: 15 min.
          *   The Wrinkle/Method Reflection: 10 min.
          *   Check/Outro: 5 min.
      *   *Wait, the prompt asks for specific things.* I need to make sure I answer the four specific requests + the refusals clearly.

      *   *Re-evaluating the Example:* The Pluto example is good, but is it too close to "definition"? Students might say "They just voted."
      *   *Alternative:* **The "Is water H2O?" (Kripke/Putnam) vs. "Is heavy water water?"**
      *   *Better Alternative:* **The "Is a virus alive?" dispute.**
