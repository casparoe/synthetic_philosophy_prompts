  ***

  ### THE LEAVES

  **1. Intransitive Person-Affecting**
  *   **Commitment:** You must sometimes prefer a world where existing people are worse off, or admit your preferences cycle.
  *   **Load-bearing:** Q1 (No Compensation) + Q6 (No Transitivity).

  **2. Strict Person-Affecting**
  *   **Commitment:** Adding happy people is *neutral* (not better), so the Repugnant Conclusion is avoided by refusing to start the staircase.
  *   **Load-bearing:** Q1 (No Compensation).

  **3. Intransitive Asymmetry**
  *   **Commitment:** Adding bad lives is bad, adding good lives is neutral, but the "better than" relation is not transitive across long chains.
  *   **Load-bearing:** Q1 (No) + Q6 (No).

  **4. Negative Utilitarianism**
  *   **Commitment:** A world with billions of happy people is no better than an empty world; only suffering counts.
  *   **Load-bearing:** Q1 (No) + Q2 (Yes).

  **5. Person-Centred Average**
  *   **Commitment:** You would sacrifice total welfare to keep the average high, prioritizing the "unit" of the person over the "quantity" of welfare.
  *   **Load-bearing:** Q2 (No) + Q3 (Yes).

  **6. Lexical/Discontinuous View**
  *   **Commitment:** Higher welfare qualities cannot be traded off against lower ones, no matter the numbers (rejects Drip Lives).
  *   **Load-bearing:** Q2 (No).

  **7. Average Utilitarianism**
  *   **Commitment:** Adding a happy person below the current average makes the world *worse* (The "Mere Addition" paradox is solved by calling addition bad).
  *   **Load-bearing:** Q3 (Yes).

  **8. Total Utilitarianism (Bullet-Biter)**
  *   **Commitment:** The Repugnant Conclusion is true; Z is better than A, and your intuition that it isn't is a cognitive error.
  *   **Load-bearing:** Q4 (No Threshold).

  **9. Fixed Critical-Level**
  *   **Commitment:** There is a "zero point" above neutral; lives below it add negative value even if worth living, avoiding RC but implying "Sadistic Conclusion."
  *   **Load-bearing:** Q4 (Yes) + Q5 (No).

  **10. Sliding Critical-Level (Unnamed)**
  *   **Commitment:** The bar for a "valuable life" drops as the crowd grows; the ten-billionth person needs less welfare to add value than the first.
  *   **Load-bearing:** Q5 (Yes).
  *   **Status:** **Collapses.** If the level slides to zero, it re-derives the Repugnant Conclusion in slow motion (Total Util). If it stays positive, it violates Non-Elitism. It escapes impossibility results only by accepting a variable value function that many find ad hoc.

  **11. Spectrum/Vagueness View**
  *   **Commitment:** "Better than" is vague; the chain from A to Z has no sharp cut-off, but transitivity fails at the limits.
  *   **Load-bearing:** Q6 (No).

  **12. Welfarist Optimist ("RC is Fine")**
  *   **Commitment:** Z is not just *technically* better, but *actually* good; a world of "drip lives" is a moral success, not a failure.
  *   **Load-bearing:** Q4 (No) + Intuition on Z.
  *   **Note:** Axiologically identical to Leaf 8, but meta-ethically distinct.

  **13. No Threshold + Sliding Dynamics**
  *   **Commitment:** Incoherent. You cannot have a sliding critical level if you deny a critical level exists.
  *   **Status:** Empty by definition.

  **14. Average Util + Critical Threshold**
  *   **Commitment:** Unexplored. Combining averaging with a critical level usually collapses into one or the other; theoretically possible but unmotivated.
  *   **Status:** Unexplored.

  ***

  ### INDISTINGUISHABLE PAIRS & NOTES

  *   **Leaf 8 (Total Util) vs. Leaf 10 (Sliding CL):** In fixed-population cases, these views are often indistinguishable. They only diverge in *variable* population cases where the population size triggers the slide. To separate them, ask: *"If we double the population, does the welfare required for a new life to be 'good' change?"*
  *   **Leaf 2 (Strict PA) vs. Leaf 4 (Negative Util):** In cases involving only happy people, these views look identical (adding people is neutral). To separate them, use a **Mixed Case**: *"Is adding a happy person better than adding nothing?"* (Leaf 4 says No/Neutral; Leaf 2 says Neutral; Leaf 1/3 might say Yes).
  *   **Leaf 8 (Total Util) vs. Leaf 12 (Optimist):** These are the same axiology. The tree separates them only because your group contains someone who suspects the Repugnant Conclusion isn't repugnant. This is a disagreement about *description*, not *calculation*.
  *   **Fixed vs. Sliding CL:** If the Sliding CL approaches zero as population approaches infinity, Leaf 10 collapses into Leaf 8. If it stays positive, it avoids the Repugnant Conclusion but likely violates **Non-Elitism** (preferring a world where everyone is barely above the sliding bar over a world with fewer, much happier people).

  **Cutting Advice:** If you have fewer than 8 people, cut Leaves 1, 3, 5, and 14. Focus on the tension between 8, 9, 10, and 12.
