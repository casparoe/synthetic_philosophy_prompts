  **The Puzzle:** You accept the standard Parfit setup (A vs. Z, Mere Addition staircase). You want to know where you stand without memorizing the "-isms." Answer the six questions below to find your leaf.

  ### THE BRANCH QUESTIONS

  1.  **Compensation:** Can welfare gains to *new* people (who wouldn't otherwise exist) compensate for welfare losses to *existing* people?
  2.  **Drip Lives:** Is a world containing billions of lives with negligible positive welfare *at least as good as* a world containing one ecstatic life, provided total welfare is equal?
  3.  **Metric:** Is the *average* welfare per person the primary maximand (rather than total value or person-count)?
  4.  **Threshold:** Must a life exceed a specific positive welfare level $c$ to contribute value to the world?
  5.  **Dynamics:** If there is a threshold $c$, does $c$ *decrease* as the total population size increases?
  6.  **Transitivity:** If every step in the "Mere Addition" staircase (A→B→...→Z) is an improvement (or not worse), is the final endpoint Z *not worse* than A?

  ***

  ### THE TREE

  ```text
  START: There is a puzzle (A vs. Z, Mere Addition)
  │
  ├── Q1: COMPENSATION (Can new people offset existing losses?)
  │   │
  │   ├── NO (Person-Affecting/Asymmetry Territory)
  │   │   │
  │   │   ├── Q2: DRIP LIVES (Are billion "drips" >= one "tower"?)
  │   │   │   ├── NO  ──────────────────────────────────────┐
  │   │   │   │   └── Q6: TRANSITIVITY (Accept Chain?)      │
  │   │   │   │       ├── NO  ──> [LEAF 1] Intransitive PA  │
  │   │   │   │       └── YES ──> [LEAF 2] Strict PA        │
  │   │   │   │                                           (Person-Affecting)
  │   │   │   └── YES ──────────────────────────────────────┘
  │   │       │   (Rare: Asymmetry + Aggregation)
  │   │       └── Q6: TRANSITIVITY
  │   │           ├── NO  ──> [LEAF 3] Intransitive Asymmetry
  │   │           └── YES ──> [LEAF 4] Negative Utilitarianism
  │   │
  │   └── YES (Impersonal/Welfarist Territory)
  │       │
