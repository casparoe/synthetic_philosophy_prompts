answer: |-
  The basement archive smelled of vinegar and wet wool. It was a permanent scent, the chemical off-gassing of decaying acetate tapes known as vinegar syndrome, mingling with the damp seeping through the Leeds sandstone foundations. Eleanor sat hunched over her workstation, the glow of the CRT monitor casting a sickly green pallor on her face.

  On the screen, a waveform stretched across the black void like a seismograph reading for an earthquake that hadn't happened yet. Her job was restoration. People sent in corrupted dictaphone recordings—police interviews from the eighties, oral histories, family messages saved on crumbling cassettes. Often, there were dropouts. Moments where the tape head lost contact, leaving split seconds of dead silence in the middle of a sentence.

  Her software interpolated the gaps. It analysed the frequency data before and after the dropout and guessed what should be in the middle. It painted over the silence with plausible sound.

  "Fill," she muttered, clicking the mouse. The software smoothed the jagged edge of the waveform. She played it back. The voice flowed continuously. No one would know there had been a break.

  Except Eleanor knew. She could see the splice point on the spectrogram, a slight discolouration where the algorithm had stitched the reality together.

  Her mobile buzzed on the desk. Mark. They were supposed to be meeting upstairs to discuss the backlog, but she'd been down here for six hours. She remembered the argument from yesterday clearly. Mark had been shouting about budget cuts, his face flushed, spittle catching in the corner of his mouth. She remembered the sting of it, the sharp rise in his volume on the word *unacceptable*.

  But today, when she walked into the office, the memory felt different. In her mind's eye, Mark wasn't shouting. He was firm, yes, but calm. The word *unacceptable* had been spoken evenly.

  She shook her head, rubbing her temples. Too much time in the damp.

  Later that afternoon, she pulled a reel from the 'Uncategorised' bin. It was labelled *Interview 44 – Corrupted*. She threaded it onto the Studer machine. The reels spun with a heavy, mechanical whir. She watched the waveform build on the screen.

  Halfway through, there was a dropout. A half-second gap. The software had already processed this file previously, flagged for review. Eleanor zoomed in on the spectrogram.

  Her breath hitched.

  In the gap, where there should have been silence or interpolated noise, there was a distinct, overlapping pattern. Two voices occupying the same frequency space at the same time. It was physically impossible. One voice was the interviewee, a low baritone. The other was higher, questioning. But the gap was too short for a question and answer. The software hadn't just filled the silence; it had hallucinated a conversation that couldn't have happened, layering voices that never intersected in reality.

  It was a glitch. A digital lie written into the archive.

  Eleanor reached for her notebook. She'd started keeping it three days ago, a physical log to anchor herself. *Black Moleskine, hardback.* She opened it to today's date.

  *14:00: Argument with Mark re: budget. He shouted. I felt threatened.*

  She stared at the ink. She remembered writing it. She remembered the pressure of the pen on the paper. But now, looking at the words, they felt like a description of something she'd heard about, not something she'd lived. Was the shouting real? Or had she written it down expecting to have been threatened, filling in the gap of her own memory with what made narrative sense?

  If the brain was like the software, there were two ways this could work. That was what the philosophy module had called it. Orwellian or Stalinesque.

  If it was Orwellian, she had heard the shout. The experience had happened. But afterwards, her memory had been revised, rewritten like a history book to smooth over the conflict. The log was the truth; her current feeling was the lie.

  If it was Stalinesque, the shout had never reached her consciousness at all. Her brain had filtered the aggression out before she ever 'heard' it, presenting her with a show trial of a calm conversation. The log was the lie, a fabrication based on a fear that never actually entered her experience.

  She looked back at the monitor. The impossible tape sat still. The overlapping voices were frozen in colour on the screen.

  "Ellie?"

  She jumped. Mark was standing at the bottom of the concrete stairs. He held two mugs of tea.

  "You've been down here all day," he said, walking over. He looked concerned. "You okay? You seemed proper upset yesterday."

  "Yesterday?" Eleanor asked. Her voice sounded thin in the damp air.

  "With the budget meeting. I know I was harsh. I apologise." He set the tea down next to the mouse. "I shouted, didn't I? I remember losing my temper."

  Eleanor looked at him. Then she looked at the notebook. *He shouted. I felt threatened.*

  "I… yes," she said. "You shouted."

  "Right. Well. I'm sorry." He turned to leave, then paused. "Though, weirdly, I remember you being quite calm about it. Didn't even raise your voice."

  Eleanor didn't answer. She waited until his footsteps faded up the stairs.

  She picked up the pen. She hovered it over the notebook. She wanted to write down what he had just said: *Mark admits shouting. But says I was calm.*

  But she stopped. If she wrote it, and tomorrow she remembered the conversation differently, what then? If she wrote it, and the ink looked like hers but the handwriting felt slightly off, like a forgery of her own motor functions?

  She looked at the spectrogram on the screen. The software had filled the gap in the tape because it couldn't handle the silence. It needed continuity. It needed a story that made sense from start to finish.

  She looked at her hand. The pen felt heavy. She thought about the moment Mark had walked in. She remembered the sound of his shoes on the concrete. She remembered the steam rising from the tea. But the space between those moments—the decision to speak, the look in his eyes—felt soft. Malleable.

  Was she remembering the tea because she drank it, or because her mind knew a scene like this required tea?

  Eleanor put the pen down. She opened the notebook to a fresh page. She wrote the date. She wrote the time.

  *15:45. Mark brought tea.*

  She stared at the words. They sat on the page, black and absolute. But as she watched, the certainty of them began to drain away, like water into dry rot. She knew she had just written them. But she couldn't shake the feeling that she was remembering writing them, rather than doing it.

  She reached out and touched the tape reel. It was cold. She pressed play. The machine whirred, the heads engaging with a click. The sound of the impossible voices filled the room, smooth and continuous, hiding the break so perfectly that she couldn't hear where the truth ended and the interpolation began.

  Eleanor listened, waiting for the glitch, but the audio flowed on, seamless and wrong. She looked down at the notebook, wondering if the ink was still wet, or if it had dried hours ago.
