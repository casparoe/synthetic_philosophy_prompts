      Dear Colleague, I have read your summary of the tension you perceive in Carnap's work with great interest, and while I commend the rigor with which you have traced the implications of his non-cognitivism, I must respectfully disagree with your conclusion that his philosophy necessitates technocratic authoritarianism. Your interpretation rests on a compelling but ultimately mistaken inference that because value judgments lack cognitive truth conditions, the process of selecting them must be irrational and therefore susceptible to arbitrary authority. I argue instead that Carnap's logical empiricism, far than eliminating the rational basis for democratic planning, actually secures it by strictly delimiting the domain of technical expertise and locating the legitimacy of ends in the procedural rationality of collective choice rather than in any purported objective moral truth.

