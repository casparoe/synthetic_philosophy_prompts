      *   **Carnap's View:** Rudolf Carnap, a key logical empiricist, indeed held a non-cognitivist view of ethics and value judgments (influenced by Hume and Wittgenstein). Statements like "X is good" or "We ought to do Y" are not truth-apt; they are expressions of volition or commands.
      *   **The User's Tension:** If values are non-cognitive, how can democracy (deliberation about ends) be rational? If it's not rational, why not let an authority decide? This suggests technocracy.
      *   **Counter-Argument/Nuance:** While Carnap denies *theoretical* rationality to value judgments (they can't be proven true/false), he does not deny the *practical* necessity of choosing them. Furthermore, logical empiricism often emphasizes the role of logic in clarifying means-ends relationships. If the ends are given (by whatever process), science can determine the means. But does Carnap exclude democracy?
      *   **Historical Context:** Many logical empiricists (including Carnap, Neurath, Reichenbach) were politically engaged socialists or democrats. Neurath, specifically, worked on social planning and advocated for democratic decision-making despite the non-cognitive status of values. Carnap himself was liberal-minded.
      *   **The Crucial Distinction:** The key is distinguishing between *justifying* values via reason (impossible for Carnap) and *selecting* values via a legitimate procedure (possible). Democracy isn't about discovering the "true" value (since there isn't one), but about aggregating preferences or reaching a consensus on volitions. The rationality lies in the procedure, not the ontological status of the values.
      *   **Reichenbach's Contribution:** Hans Reichenbach, a close associate, explicitly addressed this in *Experience and Prediction* and *The Rise of Scientific Philosophy*. He argued that while ends are voluntary, the choice of ends can be subjected to rational scrutiny regarding their consistency and realizability. More importantly, democratic procedure is the rational way to handle conflicting volitions.
      *   **Carnap's Specific Stance:** Carnap's *Logical Syntax of Language* and later works suggest that while value statements are not cognitive, the *decision* to adopt a linguistic framework or a set of norms is a practical decision. In the context of social planning, if values are expressions of will, then a democratic process is simply the method by which the collective will is formed. It is not "irrational" to have a procedure for aggregating wills; it is only irrational to claim that one will is objectively "truer" than another.
      *   **Defending the Conclusion:** I need to argue *against* the user's interpretation that Carnap's view entails technocratic authoritarianism. I should argue that Carnap's non-cognitivism actually *supports* a specific kind of democratic legitimacy, where democracy is understood not as truth-seeking regarding values, but as the fair arbitration of competing volitions. The "technocratic" label applies only to means, not ends. The selection of ends remains a practical decision, and in a liberal society, the legitimate procedure for practical decisions affecting all is democracy. Therefore, Carnap's view leaves conceptual space for democratic procedures.

  3.  **Drafting the Argument (Internal Monologue/Trial):**
      *   *Opening:* Acknowledge the user's careful reading. It's a common critique (the "fact-value distinction leads to nihilism/authoritarianism" charge).
      *   *Thesis:* I must disagree with the conclusion that Carnap's view entails technocratic authoritarianism. Instead, I will argue that his non-cognitivism is compatible with, and even necessitates, a democratic procedure for selecting ends, provided we understand democracy differently.
