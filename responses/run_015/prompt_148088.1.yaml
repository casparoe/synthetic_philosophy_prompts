      *   *Point 4:* Therefore, democracy is the rational procedure for aggregating these non-cognitive states. It is instrumentally rational to use democracy to ensure stability and satisfaction of the maximum number of volitions.
      *   *Point 5:* Carnap and the Vienna Circle were generally politically progressive. They saw science as a tool for liberation, not oppression. The separation of fact and value protects science from dogma but doesn't remove the need for human choice.
      *   *Conclusion:* The user's tension is resolved by shifting the locus of rationality from the *content* of the value judgment to the *procedure* of decision-making.

