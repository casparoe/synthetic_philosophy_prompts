      *   **Task:** Take a *committed stand* on whether this reading is sound. Specifically, defend one definite conclusion: either Carnap's non-cognitivism eliminates the rational basis for democratic planning OR it leaves conceptual space for democratic procedures to play a legitimate non-arbitrary role.
