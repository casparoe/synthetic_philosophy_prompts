answer: |-
  This is a fascinating edge case because it moves the question from *moral theology* (saving a life, hiding a fugitive) to *aesthetics* (the contract between author and reader). Your friend is applying a strict Augustinian framework, specifically from *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying).

  To answer your question: **No, indifference does not save you, and ambiguity is arguably worse.** But to understand why, we need to locate the split in the rule you identified.

  ### The Two Rules
  You correctly sensed a divergence in how "intent" is weighed. Here is how your friend's framework distinguishes them:

  **Rule 1: The Psychological Rule (Intent to Cause Belief)**
  *   **Definition:** A lie occurs only if I actively *desire* you to hold a specific false belief.
  *   **The Loophole:** If I say something false but I am indifferent to whether you believe it, or if I want you to be confused rather than convinced, I am not lying. I am merely playing.
  *   **Verdict on your book:** If you use this rule, your "indifferent" frame is fine. You aren't trying to trick them; you're just using a stylistic device.

  **Rule 2: The Ontological Rule (Fidelity of Signs)**
  *   **Definition:** A lie occurs if I construct a sign (words, framing, context) that signifies something contrary to what I know to be true, within a context where truth is expected.
  *   **The Logic:** Language is a faculty given for communion. To use it against its nature is a sin, regardless of whether I care about the outcome in your head. The sin is in the corruption of the *medium*, not just the *mind of the listener*.
  *   **Verdict on your book:** If you use this rule, your frame is a lie. You have created a sign (the archivist preface) that signifies "This is history," when you know it is not.

  **Your friend is running Rule 2.**
  Augustine argues that the sin of lying is not primarily about the damage done to the neighbor (though that matters), but about the damage done to the soul of the speaker and the integrity of communication itself. When you speak (or write), you are pledging your faith to the truth of your signs.

  ### Applying the Rule to Your Scenarios

  **1. The Indifferent Frame ("I'm not fussed what they believe")**
  Under Rule 2, this is still a lie. You have issued a false sign. The fact that you don't care if they swallow it doesn't change the fact that you baited the hook with false meat. Augustine would say you are treating the reader's trust as disposable. You have created an *occasion* for error, even if you don't strictly intend the error.
  *   **The Friend's Call:** Lie (venial, perhaps, because no material harm, but a lie). The copyright page (the tiny truth) does not absolve the preface (the loud falsehood) if the preface is designed to be the dominant experience.

  **2. The Ambiguous Frame ("I want them unsure")**
  This is the more dangerous category in Augustinian ethics. Augustine distinguishes between the *jocose lie* (obvious joke) and the *deceptive lie*. If you want the reader to hover in uncertainty about reality, you are actively cultivating a state where truth and falsehood are indistinguishable.
  *   **The Friend's Call:** Lie (more serious). You are not just asserting a falsehood; you are attacking the reader's ability to discern truth. You are making your words an instrument of confusion, which is a corruption of the purpose of language.

  ### The Test Case: The Email Silence

  This is where the rubber meets the road. You asked: *Does silence in print do the same work silence did for the fugitive?*

  **The Fugitive Context:**
  When hiding a fugitive from an unjust aggressor (the pursuer), Augustine permits silence because you owe the aggressor no truth. They have forfeited their right to information by their unjust intent. Silence here is a shield.

  **The Reader Context:**
  A reader is not an unjust aggressor. They are a voluntary participant in a communicative act. They have asked a direct question based on a premise you established (the diary frame).
  *   **If you say nothing:** You know they will likely interpret your silence as "I won't confirm, so maybe it's real."
  *   **The Augustinian Split:**
      *   **Rule 1 (Psychological):** You didn't say "Yes." You withheld information. Not a lie.
      *   **Rule 2 (Fidelity):** You are allowing your silence to function as a confirmation of your initial false sign (the preface). You are sustaining the illusion.

  **The Verdict:**
  Under your friend's scheme, **silence here is complicit in the lie.**
  Why? Because the silence is not a refusal to answer (like shutting the door on the pursuer); it is a *strategic ambiguity* designed to protect the artistic frame.
  *   If you replied, "I cannot answer that," that is a refusal (Permissible).
  *   If you reply nothing, knowing it will be taken as confirmation of the diary's authenticity, you are using silence as a sign. And since the sign implies "It might be real" (which you know is false), you are lying.

  ### The Boundary Line
  You asked where the two rules split. They split on **the ownership of the error.**

  *   **Rule 1 (Psychological)** says: I am only responsible for what I *want* to happen in your head. If I don't want you to believe the lie, I'm clean.
  *   **Rule 2 (Augustinian/Fidelity)** says: I am responsible for the *signs I emit*. If I emit a sign that carries falsehood, I am responsible for the error it generates, even if I claim indifference.

  **The Decisive Factor:**
  For your friend, the sin isn't "making someone believe a lie." The sin is "speaking against your own mind."
  *   In your mind: "This is a novel."
  *   In your book's preface: "This is a found diary."
  *   **The Conflict:** Your words contradict your mind. That is the definition of *mendacium*.

  ### Summary for Your Plot
  If you want to stay consistent with your friend's vetting:
  1.  **The Frame:** To avoid the lie, the "Archivist Preface" must be clearly signposted as part of the fiction *within the text itself*, or the copyright notice must be prominent enough to negate the false sign of the preface. If the preface is designed to be believed (even ambiguously), it is a lie.
  2.  **The Email:** If asked directly, you must either tell the truth ("It is fiction") or explicitly refuse ("I do not discuss the contents"). Strategic silence that maintains the illusion is, under this framework, a continuation of the initial falsehood.

  Your friend's rule is: **You may not make your words a vehicle for falsehood, regardless of whether you care where the vehicle goes.** The indifference doesn't wash the stain; it just means you stained the cloth on purpose without a urgent reason (like saving a life).
