answer: |-
  Here are comments on your draft, addressing your eight questions in order.

  **1. Accuracy of the map**
  Your description of the standard dialectic is fair as a map of the *intuitions* driving the views, though technical formulations often differ. The "ranking" story (permissive matter vs. demanding form) is rarely defended explicitly as a metaphysical grounding principle by sophisticated constitution theorists (like Lynne Baker), who typically ground the direction of constitution in the possession of a "primary kind" property. However, the *motivation* for positing a primary kind is often exactly the modal asymmetry you describe: the lump seems to have wider persistence conditions, so it looks like the underlying substrate. You are attacking the explanatory priority: does the modal profile ground the constitution, or does the kind ground the modal profile? Your essay argues the latter (via institutions). This is not a straw man; it is a necessary clarification. Even if a constitution theorist says "kinds ground modality," they often rely on the modal intuition to identify the kinds in the first place. Your readymade case disrupts that identification procedure.

  **2. Generated or stipulated?**
  The crossing does follow from the kind plus ordinary persistence conditions, provided we accept the institutional facts as metaphysically relevant (which you argue we must). You are not smuggling verdicts; you are highlighting that the *practice* fixes the persistence conditions, which then generate the modal profile. The certificate is not a magic wand; it is a record of the constitutive rules of the artworld.
  However, the 1998 conservation episode is vital. If you delete it, the case collapses back toward the ordinary statue-and-clay case. Without replacement, the artwork and the lump share the same matter throughout their shared history. The only difference is that the lump survives reshaping and the artwork does not. That is a one-directional asymmetry (the lump is more permissive), which restores the ranking you want to break. You need the replacement episode to show the artwork is *more* permissive regarding matter than the lump (assuming lumps are quantities of matter that cannot survive total replacement). Keep the conservation episode; it is the engine of the "crossing."

  **3. Which branch should I commit to?**
  Commit to the branch where the lump *cannot* survive gradual total replacement. This is the standard mereological view of quantities of matter. If you concede that lumps survive replacement, you lose the crossing (both survive replacement, only the lump survives reshaping), and you lose the leverage to break the ranking.
  If your friend insists lumps survive replacement, she is treating "lump" as a sortal for a clay *object* rather than a clay *quantity*. You should press her on this: if the lump survives total replacement, in what sense is it the *same* lump? Is it the same clay? If not, it's a different quantity. If she concedes it's a different quantity, the crossing holds. If she insists it's the same quantity despite no shared matter, she has abandoned the standard materialist intuition that drives the statue/lump problem in the first place. The second branch (where the crossing collapses) is enough to save the "no intrinsic change" point, but the first branch is where the argument bites hardest.

  **4. The type-and-instance reply**
  This reply is damaging only if one is willing to pay the ontological cost. Your diagnosis is correct: it makes ordinary talk about art false (we didn't touch the work, we touched an instance; the work wasn't destroyed, an instance was). To strengthen your position, consider a variation: a unique legal document (e.g., a signed treaty). The treaty is not a type; there is only one original. It has institutional persistence conditions (it survives minor tears, does not survive burning). It coincides with the paper. The type view struggles here because treaties are not multiply instantiable. If you can show the logic applies to non-art artifacts that are tokens, not types, you blunt the type reply. However, for a blog piece, your current treatment is sufficient: point out that the type view saves the metaphysics at the expense of making the practice unintelligible to itself.

  **5. Overgeneration**
  The line is drawn at *constitutive rules*. Not every naming creates a new object with new persistence conditions; only acts within a practice that has the power to assign those conditions do so. Naming a cat does not change its persistence conditions (it still dies when the organism dies). Designating a ship as "HMS Victory" does not change its persistence conditions unless the designation comes with specific maintenance rules (which it often does).
  This is not a new burden for the constitution theorist. They already need to explain why a pile of bricks is not a house, or why a random arrangement of wood is not a table. They appeal to functional or intentional criteria. You are simply adding "institutional criteria" to that list. The constitution theorist already needs a line between "arbitrary collection" and "artifact"; you are just showing that the line is drawn by practice, not just by form.

  **6. Persons**
  Here are three sentences for your friend:
  "If artifact constitution is grounded in institutional kinds, the 'too many thinkers' problem is insulated only if 'person' is not an institutional kind in the relevant sense. If personhood is biological, then the human animal and the person do not coincide in the same way the lump and the readymade do, because the human animal is not a constituent that can be institutionally re-identified. However, if personhood is partly social, this view suggests the 'person' is the institutional object constituted by the animal, which may actually multiply thinkers rather than reduce them, unless we deny that the animal thinks at all."

  **7. Whether it is worth posting**
  Yes, it is worth posting. The argument is interesting because it uses art theory to solve a metaphysical problem, which is a productive cross-pollination. The conclusion is strong: it shifts the burden from modal logic to social ontology.
  *Editorial advice:* Open with the *Sixteen Pounds* case. The current opening (Monday/Tuesday sculptor) is the standard fare your readers will know; the readymade is your novelty. Hook them with the certificate and the crumbling clay immediately, then explain why this breaks the standard model. Cut the first paragraph's summary of the dialectic by half; assume your readers know the statue/lump problem or can grasp it quickly. The weakest section is the brief dismissal of the type view; give it one more sentence on why the "instance" talk fails for unique artifacts (like the treaty example above) if you have space, otherwise leave it as is.

  **8. One paragraph, in her voice**
  "You claim the certificate creates a new object, but all it creates is a new *interest*. The museum treats the clay as the work because that is how they track value and provenance, not because metaphysics has shifted. When the conservator replaces the clay, they are preserving the *aesthetic vehicle*, not a metaphysical entity distinct from the matter. You have shown that artworld practices are complex, but you haven't shown that these practices track two coincident objects rather than one object under two descriptions. The 'crossing' of persistence conditions is just a crossing of our rules for talking about the thing, not a crossing in the thing itself. Metaphysics shouldn't be hostage to the conservator's logbook."
