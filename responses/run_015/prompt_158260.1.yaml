  Zeno tells a physicist, "An arrow never moves. At every instant, it occupies a space equal to itself."

  "No," says the physicist. "You're treating time like spatial segments. Motion lives in the interval, not the point."

  "Fine," says Zeno. "I won't divide the space. I'll divide the *measurement*."

  He measures the arrow's position every Planck time. The arrow refuses to leave the bow.

  "Damn it," says the physicist. "You didn't solve the paradox. You just invoked the Quantum Zeno Effect."

  Zeno shrugs. "Call it what you want. I was wrong about the space, but I was right about the time."
