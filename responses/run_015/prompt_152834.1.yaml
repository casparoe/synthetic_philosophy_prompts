      *   **Introduction:** Set the scene (Highland Park, 1913). Introduce Winner's thesis. State the argument: The assembly line is a paradigmatic case of artifacts *enforcing* politics, specifically managerial authoritarianism, though the relationship is dialectical.

      *   **Mapping Technical Features to Authority:**
