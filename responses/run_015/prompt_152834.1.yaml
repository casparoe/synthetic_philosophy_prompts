          *   *Single-speed synchronization:* Management sets the pace. No negotiation. *Political implication:* Time sovereignty shifts from worker to owner.
          *   *Elimination of craft sequencing:* Deskilling. Knowledge is removed from the shop floor. *Political implication:* Reduces worker leverage (strike power relies on skill scarcity).
          *   *Spatial separation (Taylorism):* Planning department vs. floor. *Political implication:* Brain vs. Hand. Hierarchy is physical.

      *   **Inherent Requirement vs. Accidental Embedding:**
          *   *Question:* Could it work with worker control?
          *   *Analysis:* Theoretically, a cooperative could run a line. But the *logic* of the line is optimization of throughput. Worker pacing introduces variance. To maximize the technical potential (speed), you need central coordination.
          *   *Verdict:* It leans heavily toward inherent requirement. The material form punishes decentralization with inefficiency. It *enforces* hierarchy to function at its designed capacity.

      *   **Technological Determinism & The $5 Day:**
