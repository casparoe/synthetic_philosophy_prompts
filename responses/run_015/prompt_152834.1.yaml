  2.  **Initial Brainstorming & Theoretical Grounding:**

      *   *Langdon Winner's "Do Artifacts Have Politics?":* Two main ways artifacts have politics: (1) Specific features require specific power structures (e.g., bridges low enough to keep buses out). (2) Technology is inherently compatible with specific social systems (e.g., nuclear power requires authoritarianism, according to Winner, though this is contested).
      *   *Fordism:* Standardization, interchangeability, flow.
