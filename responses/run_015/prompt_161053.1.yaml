answer: |-
  You have excellent instincts. You are not lumping three different things together, but you are also right to sense that the "shape" slides between different logical strengths. You have identified a family of arguments that philosophers rely on heavily, often to do more work than they are strictly licensed to do.

  Here is the breakdown of what is going on, the names for the specific moves, and where the edges lie.

  ### 1. The Name of the Shape
  The classical name for this move is **Retorsion** (from the Latin for "turning back"). In contemporary philosophy, it is usually discussed under the headers of **Performative Contradiction** or **Transcendental Argument**.

  *   **Retorsion:** The argument turns the skeptic's weapon back on them. "You say there is no truth? Is *that* true?"
  *   **Performative Contradiction:** The *act* of asserting the proposition contradicts the *content* of the proposition (your Examples 2 and 3).
  *   **Transcendental Argument:** The possibility of having the thought at all presupposes the truth of the claim (your Example 1).

  While these are cousins, they are not identical. Your intuition that there is slippage is correct.

  ### 2. Is it One Phenomenon or Three?
  It is **one strategy** deployed in **two distinct modes**. You are spotting the difference between *pragmatic* self-defeat and *conceptual* parasitism.

  *   **Mode A: Pragmatic Self-Refutation (Examples 2 & 3)**
      Here, the doubter is doing something that contradicts what they are saying.
      *   *Egoism:* I am giving you a reason to believe me (altruistic act) to tell you there are no altruistic reasons.
      *   *Determinism:* I am offering you a rational justification to believe that rational justifications don't exist.
      *   **The Logic:** "Your performance falsifies your content."

  *   **Mode B: Transcendental Preconditions (Example 1)**
      Here, the doubter isn't necessarily contradicting themselves in the moment; rather, the *concepts* they are using to formulate the doubt rely on the thing they are doubting.
      *   *External World:* To distinguish "appearance" from "reality," you need a concept of reality.
      *   **The Logic:** "Your vocabulary is parasitic on the framework you are attacking."

  **Why the distinction matters:** Mode A (Pragmatic) is harder to escape. If I say "I am not speaking," I am obviously wrong. Mode B (Transcendental) is slipperier. The skeptic in your reading group was right to say, "I can't phrase it in your vocabulary." That doesn't prove the vocabulary tracks reality; it only proves the vocabulary is *coherent*.

  ### 3. The Gap in Observation (1)
  You asked for a name for the difference between "your denial can't be articulated" and "P is true."

  This is the gap between **Inescapability** and **Truth**.

  In the literature, this is often called the difference between **Pragmatic Vindication** and **Theoretical Justification**.
  *   **Pragmatic Vindication:** Shows that you cannot *function* or *argue* without assuming $P$. It proves $P$ is a necessary rule of the game.
  *   **Theoretical Justification:** Shows that $P$ corresponds to how the world actually is.

  The argument you are describing successfully proves **Inescapability**. It proves that $P$ is a "regulative ideal" or a "constitutive norm" of discourse. It does *not* prove that $P$ is a metaphysical fact.

  *   *Example:* I cannot argue against the laws of logic without using the laws of logic. This proves logic is inescapable for me. It does not prove logic exists "out there" in the universe independent of thinkers.
  *   *The User's Insight:* You noticed the proponent uses $P$ as if it were established fact (Theoretical), when they have only established it as a rule of engagement (Pragmatic). This is often called **Transcendental Smuggling**. They smuggle a normative necessity (we must act as if) as an ontological certainty (it is the case that).

  ### 4. The Leftover Stance in Observation (3)
  You asked for a word for the doubter's state: conceding they can't press the point but not feeling answered.

  The technical term for this is **Quietism**.

  A Quietist accepts that certain questions cannot be meaningfully asked or doubted within our framework, but refuses to draw metaphysical conclusions from that silence.
  *   The skeptic thinks: "I can't argue against the external world, so I must be wrong."
  *   The Quietist thinks: "I can't argue against the external world because our language doesn't support that move. I will remain silent on the metaphysics, but I won't affirm the dogma."

  The reason the doubter feels unsatisfied is that they have been **Therapeutically Dissolved** rather than **Refuted**. The argument didn't show their doubt was *false*; it showed their doubt was *idle* or *unintelligible*. For a skeptic who wants to know about Reality, being told "your question is grammatically ill-formed" feels like a dodge.

  ### 5. "Very Thing" vs. "Neighbourhood"
  You asked if there is a real distinction between denying the very thing being denied vs. something in the neighbourhood. **Yes, there is.**

  *   **Self-Stultifying (The Very Thing):** The argument destroys itself immediately.
      *   *Claim:* "No sentences are longer than three words."
      *   *Refutation:* The sentence itself is longer than three words.
      *   *Status:* This is a logical contradiction. The claim is false.

  *   **Self-Undermining (The Neighbourhood):** The argument removes the *grounds* for believing it, but doesn't logically contradict it.
      *   *Claim:* "All belief is caused by brain states, not reasons."
      *   *Refutation:* Then your belief is caused by brain states, not reasons.
      *   *Status:* This doesn't prove the claim *false*. It proves the claim is **arational**. It might be true, but we have no *reason* to think so.

  Your Example 3 (Determinism) is Self-Undermining. Your Example 2 (Egoism) is closer to Self-Stultifying (if the act of arguing is defined as a non-self-interested reason). Your Example 1 (External World) is **Transcendental**.

  The proponent often treats Self-Undermining as if it were Self-Stultifying. They say, "You can't say that!" implying it's false. The doubter hears, "You can't say that!" meaning "You can't say that *and claim rational authority*."

  ### 6. How is this different from Circular Reasoning?
  This is the most important edge to draw.

  *   **Circular Reasoning (Begging the Question):** Assumes $P$ in the premises to prove $P$ in the conclusion.
      *   *Structure:* $P$ is true because $Q$, and $Q$ is true because $P$.
      *   *Failure:* It fails to provide independent evidence.

  *   **Retorsion / Performative Contradiction:** Does not assume $P$ to prove $P$. It assumes the *possibility of discourse* to prove that *not-P is undiscussable*.
      *   *Structure:* To argue $\neg P$, you must utilize framework $F$. Framework $F$ entails $P$. Therefore, $\neg P$ cannot be argued.
      *   *Difference:* It is not circular because it operates on a **Meta-Level**. It isn't arguing about the world; it is arguing about the *conditions required to argue about the world*.

  However, the **trap** you identified in Observation (2) is where it *becomes* circular.
  1.  **Valid Move:** "You cannot consistently argue against $P$." (Meta-claim)
  2.  **Invalid Slide:** "Therefore, $P$ is true." (Object-claim)

  If they make that slide, they have committed the **Pragmatic Fallacy**. They have moved from "We must presuppose $P$ to speak" to "$P$ is a fact of the universe."

  ### Summary of the Edges
  To answer your core request on "what exactly is going on":

  1.  **The Move:** It is **Retorsion** (turning the argument back on the speaker).
  2.  **The Strength:** It ranges from **Performative Contradiction** (strong, logical) to **Transcendental Presupposition** (weaker, conceptual).
  3.  **The Gap:** It proves **Inescapability**, not **Truth**. (Pragmatic Vindication $\neq$ Theoretical Justification).
  4.  **The Stance:** The doubter is left in **Quietism** (accepting the rule of the game without accepting the metaphysics).
  5.  **The Trap:** The proponent commits the **Pragmatic Fallacy** when they treat a condition of speech as a fact of reality.

  You are not bad at spotting the trick. You are spotting the exact moment where a valid meta-logical point is being cashed out as an invalid ontological proof. The skeptic in your reading group was right: showing that a doubt is inexpressible in a specific vocabulary only proves the power of the vocabulary, not the existence of the world.
