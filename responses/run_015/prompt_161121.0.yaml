answer: |-
  Here is a practical intake procedure designed for your constraints. It is not legal advice; it is governance logic. It treats your rulebook as a closed system where Rule 31 is the "engine" and everything else is the "carriage." The engine can change the carriage, but the carriage cannot smash the engine unless the engine allows it.

  ### Part 1: The Four Buckets
  Your four distinctions are sound. Do not discard any of them. They map to the four ways a proposal can break the system. Here is how to define them for your checklist:

  1.  **Order (Machinery vs. Substance):** Does the proposal change *how* we make rules (Rule 31, quorum, notice) or just *what* the rules are (membership, expenses)?
      *   *Why it matters:* Changing the machinery requires extra care. If you break the machine, you can't fix it later.
  2.  **Reach (Self-Reference):** Does the proposal try to control its own future? (e.g., "This rule cannot be changed" or "This rule takes effect yesterday").
      *   *Why it matters:* A current majority cannot usually bind a future majority unless Rule 31 explicitly says they can.
  3.  **Orphans (Broken Paths):** Does the proposal remove a body or process that another rule relies on to be amended? (Your Rule 19 problem).
      *   *Why it matters:* It creates a "zombie rule" that exists but cannot be changed.
  4.  **Stacking (Bundling):** Does the proposal mix a machinery change (like quorum) with a substantive change (like membership) in a single motion?
      *   *Why it matters:* It creates ambiguity about which rules applied to the vote itself.

  ### Part 2: The Tie-Break Rule
  You asked for a rule when two rules conflict. You have three options: later-in-time, higher-order, or more-specific.

  **The Rule:** **Higher-Order Wins.** If that fails, **Later-in-Time Wins.**

  **The Honesty Check:** This is not a law of nature. It is a policy choice.
  *   **Higher-Order:** Rule 31 (the power to make rules) is higher than Rule 3 (who can be a member). If Rule 3 says "Open to all" and Rule 31 says "We can change rules by 2/3," Rule 31 wins. We can restrict membership using Rule 31.
  *   **Later-in-Time:** If Rule 5 says "No dogs" and Rule 6 (passed later) says "Guide dogs allowed," Rule 6 wins. This favours the current members over past members.

  **Why this choice?** "More-specific" is too subjective for a volunteer to judge under time pressure. "Later-in-time" is democratic but dangerous if a temporary majority rewrites the constitution. "Higher-Order" protects the constitution. Use both: Machinery beats Substance; New Substance beats Old Substance.

  ### Part 3: The Intake Procedure
  Print this. Keep it next to your spreadsheet. If you hit a **STOP**, the proposal is not in order. If you hit **FLAG**, it proceeds but the Board must be warned.

  **Step 1: The Form Check (2 Minutes)**
  *   **Q:** Is there 14 days' notice given?
  *   **Q:** Is the text clear? (Can you read it once and know what changes?)
  *   **STOP:** If No to either. Send back for administrative fix.

  **Step 2: The Engine Check (Rule 31) (5 Minutes)**
  *   **Q:** Does this proposal change Rule 31 itself (thresholds, notice, quorum)?
  *   **If Yes:** Does it comply with the *current* Rule 31? (e.g., You cannot lower the threshold to 50% using a 66% rule).
  *   **STOP:** If the proposal tries to use a new threshold to pass itself. (You cannot bootstrap).
  *   **FLAG:** If it makes future amendments harder (entrenchment). This is valid *if* passed by the current 2/3, but the Board must know it reduces future flexibility.

  **Step 3: The Stack Check (5 Minutes)**
  *   **Q:** Does this motion change the *meeting rules* (quorum, voting) AND *substantive rules* (membership, money) in one go?
  *   **STOP:** If Yes. They must be split. You cannot validate a substantive change using a quorum that hasn't been legally established yet.
  *   **Reason:** If the vote is challenged later, the whole bundle might fall.

  **Step 4: The Orphan Check (5 Minutes)**
  *   **Q:** Does this proposal abolish a committee, role, or process?
  *   **If Yes:** Search the rulebook. Do any other rules say "The [abolished role] must approve this"?
  *   **STOP:** If Yes. You are creating a zombie rule. The proposal must include a fix for the dependent rule (e.g., "Rule 19 is amended to remove reference to Management Committee").
  *   **Note:** You cannot fix Rule 19 yourself. You must flag it to the Board as a separate drafting error to be cured.

  **Step 5: The Immunity Check (3 Minutes)**
  *   **Q:** Does the proposal say it cannot be amended, repealed, or reviewed?
  *   **STOP:** If Yes. Under Rule 31 ("any rule... may be amended"), a rule cannot immunise itself. That clause is void. Send back to remove the immunity claim.

  ### Part 4: Running the Live Proposals

  Here is the procedure applied to your three live proposals.

  #### Proposal A: Rule 7 Entrenchment
  *   *Text:* "Rule 7 may only be amended by a three-quarters majority at two consecutive general meetings."
  *   **Step 2 (Engine):** It does not change Rule 31 directly, but it changes how Rule 7 is amended. Rule 31 says "any rule... may be amended by two-thirds."
  *   **Logic:** You are using Rule 31 (2/3 vote) to amend Rule 7. The *content* of the amendment is that future votes need 3/4. This is valid. You are not changing Rule 31; you are adding a condition to Rule 7.
  *   **Step 5 (Immunity):** It doesn't say "never," just "harder." This is allowed.
  *   **Verdict:** **IN ORDER (FLAG).**
  *   **Action:** Stamp "In Order." Attach a note to the Board: *"Passing this uses our current 2/3 power to reduce our future power on Rule 7. Once passed, Rule 7 will require 3/4 to change. This is a policy choice, not a drafting error."*

  #### Proposal B: Quorum & Membership Bundle
  *   *Text:* "Quorum reduced to 12, and Rule 3 amended to restrict membership to borough residents."
  *   **Step 3 (Stack):** This mixes a meeting rule (Quorum) with a substantive rule (Membership).
  *   **Logic:** To validly change the quorum, you need the *old* quorum (40 members). To validly change membership, you need a valid meeting. If you bundle them, and only 20 people turn up, can they pass the quorum change? No. If 50 turn up, did they pass the membership change under the old quorum or the new one? It is ambiguous.
  *   **Verdict:** **NOT IN ORDER (STOP).**
  *   **Action:** Send back. **Reason:** "Procedural and substantive changes must be separate motions to ensure the vote is valid under the current quorum rules. Please split into two proposals."
  *   **Impact:** I know this delays the quorum fix. However, if you pass this bundle and a member challenges it later, a court or arbitrator could rule the *entire* meeting invalid because the quorum change was bootstrapped. It is safer to delay than to risk the AGM's decisions being voided.

  #### Proposal C: Repeal with Immunity
  *   *Text:* "Rule 12 is repealed... and this amendment may not be amended or repealed."
  *   **Step 5 (Immunity):** The proposal claims immunity from future amendment.
  *   **Logic:** Rule 31 states "any rule... may be amended." This includes Rule 12 and any amendment to it. A subordinate rule cannot remove the power granted by the superior rule. The immunity clause is a logical impossibility under your current constitution.
  *   **Verdict:** **NOT IN ORDER (STOP).**
  *   **Action:** Send back. **Reason:** "Rule 31 grants the power to amend any rule. A proposal cannot remove that power for itself. You may repeal Rule 12, but you must remove the clause claiming it cannot be repealed."

  ### Part 5: Where the Procedure Fails (The "Judgement" Bit)
  You asked me to be straight about where this is just judgement dressed up as procedure. Here are the three blind spots:

  1.  **The "Higher-Order" Trap:** I told you Higher-Order wins. But who decides what is higher order? Rule 31 is clearly the engine. But is Rule 3 (Membership) higher than Rule 12 (Accounts)? If they conflict, my tie-break says "Later-in-Time." But if a member argues Membership is "constitutional" and Accounts are "administrative," your spreadsheet can't solve that. That is a political argument, not a logic one.
      *   *What to do:* If a proposal creates a conflict between two substantive rules (not Rule 31), flag it to the Board. Do not decide it yourself.

  2.  **The Orphan History:** Your Rule 19 problem exists because you don't have a map of dependencies. My Step 4 relies on you finding the orphan. If Rule 19 isn't the only one, you will miss it.
      *   *What to do:* Accept that you might miss an orphan. When one is found (like Rule 19), treat it as a "Governance Defect." The Board must pass a "Housekeeping Motion" to clean up broken references. Do not let live proposals rely on broken rules.

  3.  **The "Void" Clause:** In Proposal C, I told you to reject it. Technically, you could pass it and treat the immunity clause as "void but severable" (the repeal stands, the immunity is ignored).
      *   *Why I said Reject:* Because if you stamp "In Order," members will think the immunity is real. They will vote thinking they are locking the door forever. When they find out they aren't, they will blame you.
