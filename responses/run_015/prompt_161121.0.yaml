      *   *Self-Repeal/Immunity:* Can a rule say "you can't repeal me"? (Proposal C). If Rule 31 says "any rule... may be amended," a rule saying "I cannot be amended" creates a direct contradiction. Since Rule 31 is the "master key," it usually wins. A rule cannot immunize itself against the master amendment power unless the master power allows it.
      *   *Orphaned Rules:* Rule 19 needs Management Committee approval, but Management Committee is gone. This is a drafting error in the past. The procedure needs to flag this for *future* fixes, but might not block *current* proposals unless they rely on Rule 19.
      *   *Conflict Resolution:* Later-in-time vs. Specificity. In statutory interpretation, later-in-time usually prevails (*lex posterior*). Specificity (*lex specialis*) is also common. For a co-op, "Later-in-time" is the most democratic and easiest to administer.

