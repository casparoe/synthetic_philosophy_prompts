      *   *So:* The Tie-Break is for conflicts between *substantive* rules (e.g., Rule 3 vs Rule 5). For constitutional machinery (Rule 31), the machinery wins over substance. I need to make this distinction clear in the procedure.
      *   *Revised Tie-Break:* 1. Machinery (Rule 31) beats Substance. 2. Later-in-time beats Earlier-in-time.
