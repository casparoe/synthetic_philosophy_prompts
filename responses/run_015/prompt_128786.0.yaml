      *   *The Token System:*
          *   Reporter gets a point for every statement that survives 10 seconds without being challenged successfully.
          *   Interrogators get a point if they force the Reporter to admit they described a function, relation, or external property (a "Ghost Catch").
          *   "Ghost Reference": Any claim that implies an intrinsic, private, ineffable quality (e.g., "the *what-it's-likeness*," "the raw sting," "the redness itself").

  4.  **Refining the Mechanics (Self-Correction):**
      *   *Problem:* If the Reporter just says "I see red," is that a ghost? Illusionists say "red" is a property of the object. The *experience* of red is the ghost.
      *   *Fix:* The Reporter must describe the *experience*, not the object. "I am having an experience of red." Interrogators ask: "What distinguishes that experience from a judgment that the object is red?"
      *   *Tokens:* Physical chips or slips of paper.
      *   *Time:* 90 mins total.
          *   Intro/Rules: 10 mins.
