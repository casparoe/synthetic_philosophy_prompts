      *   *Phenomenal Ghosting:* The specific mechanism where the brain creates a "signal of presence" without the substance.
      *   *Transparency of Experience:* When I look at my experience, I see through it to the world (or the content), not the experience itself.
      *   *The Trap:* If I say "it hurts," am I describing a raw feel or a judgment of damage? If I say "it's red," am I describing the qualia or the surface property?

  3.  **Drafting the Activity - "The Ghost Hunt":**
      *   *Name:* Needs to be evocative. "The Phenomenal Interrogation"? "Chasing the Ghost"? Let's go with **"The Transparency Protocol."**
      *   *Setup:* 8 students. 1 Reporter, 7 Interrogators (or split into two groups of 4 to keep everyone engaged? No, 1 Reporter vs. 7 is too intense. Let's do 2 rounds of 1 Reporter vs. 3 Interrogators, 2 Observers. Or just 1 Reporter vs. The Room. Let's stick to the prompt's request: 1 Reporter, others Interrogators. To keep it dynamic, maybe rotate the Reporter every 10 mins).
