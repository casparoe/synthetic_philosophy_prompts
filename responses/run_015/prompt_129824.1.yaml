answer: |-
  ### Materials and Setup

  **Stakes:** Use the **box of chocolates**.
  **Why:** The "No-Trade" logic and the epistemic pricing argument assume risk neutrality. A 2% grade stake is high enough to induce significant risk aversion in MA students (hedging behavior), which confounds the informational signal. Chocolates are low-stakes enough to approximate risk neutrality but sufficient to motivate engagement. Award them to the top 3 scores on the proper scoring rule.

  **Physical Materials:**
  1.  **The Master Urn:** An opaque bucket containing 20 ping-pong balls (10 Red, 10 Blue). This determines the "True Value" (Red = 100, Blue = 0). *Do not draw from this until the very end of class.*
  2.  **Signal Bags:** 22 small envelopes.
      *   **Construction:** You need two types of envelopes, indistinguishable from the outside.
      *   **Type R (11 envelopes):** Contains 7 Red slips, 3 Blue slips.
      *   **Type B (11 envelopes):** Contains 7 Blue slips, 3 Red slips.
      *   *Note:* Before class, flip a coin. If Heads, prepare 11 Type R and 11 Type B envelopes (but tell them the composition is correlated to the Master Urn). Actually, to keep the Common Prior visible: Tell them "The Master Urn is 50/50. If Master is Red, your envelope is likely Red-biased. If Master is Blue, your envelope is likely Blue-biased."
      *   *Simpler Construction:* Just prepare 22 envelopes. 11 contain a "Red-Biased" instruction card, 11 contain a "Blue-Biased" instruction card? No, they need private signals.
      *   *Correct Construction:* Put 22 slips in a bag. 11 say "Signal Structure A" (70% match Master), 11 say "Signal Structure B" (70% match Master). No, that's too complex.
      *   *Best Construction:* **The "Signal Draw" Bucket.** A bucket with 22 folded papers. 11 say "You are in State R" (meaning if Master is Red, you draw Red 70% of time), 11 say "You are in State B".
      *   *Actually, simplest for 75 mins:* **The "Signal Slip" Envelopes.**
          *   Prepare 22 envelopes.
          *   Inside each envelope is a single colored slip (Red or Blue).
          *   **The Story:** "The Master Urn is 50/50. If Master is Red, 70% of you have Red slips. If Master is Blue, 70% of you have Blue slips."
          *   **The Rig:** You (the instructor) decide the Master State *after* the game or fix it to be Red for consistency. Let's fix Master = Red.
          *   **Distribution:** Hand out 16 Red slips and 6 Blue slips. (This approximates the 70% signal reliability without complex conditional draws during class).
          *   **The Common Prior:** Write on the board: "Master Urn: 50% Red, 50% Blue. Signal Reliability: 70%." This is the rigged assumption.

  3.  **Trading Cards:** 22 index cards (Green side = "BUY", Red side = "SELL", White side = "HOLD").
  4.  **Whiteboard:** Divided into "Order Book" and "Scores".
  5.  **TA Role:** The TA plays the "Liquidity Provider/Hedger" in Round 2.

  ---

  ### The Rounds

  **Round 1: The Freeze (Public Willingness)**
  *   **Goal:** Demonstrate that under a shared prior, willingness to trade reveals adverse information, collapsing volume.
  *   **Setup:** Students sit in 11 pairs. Each receives one Signal Slip (Red or Blue).
  *   **Task:** Estimate the probability the Master Ball is Red. Write it privately.
  *   **Mechanism:** Fixed Price = 50 points.
      *   Phase A: Pairs discuss for 2 minutes. **Constraint:** They may only say three sentences total between them. 1. "I am willing." 2. "I am not willing." 3. "Deal." (No discussing signals).
      *   Phase B: Public Revelation. Pairs raise a hand if *both* are willing to trade.
      *   Phase C: The Pause. If hands go up, ask the room: "If this pair trades, what does that tell us about their signals?" (Answer: One has Red, one has Blue). "If you know the seller has a Blue signal, do you still want to buy at 50?"
      *   **Outcome:** Pairs should withdraw willingness. Trade volume collapses to near zero.

  **Round 2: The Hedger (Non-Informational Motive)**
  *   **Goal:** Re-open trade by introducing a participant who trades for reasons other than information.
  *   **Change:** The TA enters the market as a "Liquidity Provider."
  *   **Mechanism:** The TA *must* buy or sell 5 units regardless of signal (scripted role: "I need to balance my book").
  *   **Task:** Students can now trade with the TA at 50.
  *   **Outcome:** Trade happens. Students realize the counterparty isn't necessarily acting on superior information.
  *   **Epistemic Point:** Trade is possible, but the price (50) is no longer a pure signal of value; it's a mix of info and liquidity need.

  **Round 3: The Costly Signal (Winner's Curse/Price Distortion)**
  *   **Goal:** Show that acquiring more info doesn't always pay, and market price requires a "discount" for adverse selection.
  *   **Change:** Students may purchase a **Second Signal** for a cost of 10 points (deducted from final score).
  *   **Mechanism:** Market Price is now floating. Students submit Limit Orders (Buy/Sell at Price X).
  *   **Task:** Clear the market on the whiteboard. Find the price where Buy Orders = Sell Orders.
  *   **Outcome:** The clearing price will likely be below the "Expected Value" calculated from average signals. Why? Because sellers are more eager than buyers (adverse selection).
  *   **Epistemic Point:** "The Market Price" $\neq$ "The True Probability." It is the probability conditional on someone being willing to take the other side.

  ---

  ### Payoff Scheme

  **Instrument:** Quadratic Scoring Rule (QSR).
  **Formula:** $Score = 100 - 100 \times (Outcome - ReportedProbability)^2$.
  *   **Outcome:** 1 if Master Ball is Red, 0 if Blue.
  *   **ReportedProbability:** The student's final stated belief (0.0 to 1.0) at the end of class.
  *   **Adjustments:** Deduct 10 points if they bought a Second Signal in Round 3.
  *   **Why:** This incentivizes them to report their *true* belief, not a strategic guess. It isolates the "Knowledge" variable from the "Gambling" variable.
  *   **Stakes:** Top 3 scores receive the chocolates. All participants receive 1 Participation Point (to ensure baseline engagement without risk distortion).

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  | Time | Activity | Mechanism/Change |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Urn Demo.** Show Master Urn (50/50). Explain Signal Reliability (70%). Distribute Signal Slips. Explain QSR Payoff. | *Baseline Common Prior established.* |
  | **10-25** | **Round 1 (The Freeze).** Pairs form. 2-min discussion (3-sentence rule). Public hand-raise for willingness. The "Pause" interrogation. | *Coarse protocol. Public willingness.* |
  | **25-40** | **Round 2 (The Hedger).** TA enters as forced counterparty. Students trade with TA. Update beliefs. | *Non-informational motive introduced.* |
  | **40-55** | **Round 3 (Costly Info).** Offer 2nd Signal for 10 pts. Limit Order submission on Whiteboard. Clear market price. | *Price formation & info cost.* |
  | **55-65** | **Reveal.** Draw Master Ball. Calculate Scores. Distribute Chocolates. | *Realization of Value.* |
  | **65-75** | **Debrief.** Connect game moments to the four learning objectives. Introduce the Hayekian tension. | *Naming the forbidden concepts.* |

  ---

  ### Debrief

  **Mapping Moments to Claims:**

  | Game Moment | Learning Objective | Instructor Script (Post-Game) |
  | :--- | :--- | :--- |
  | **Round 1 Pause** | 1. Willingness is Evidence | "When you saw the seller raise their hand, you didn't see a partner; you saw a signal. Their willingness to sell at 50 told you they held a Blue slip. That information made 50 look expensive." |
  | **Round 2 TA Trade** | 2. Constraint on Meaning | "Trade returned not because information changed, but because the *motive* changed. The TA didn't know the signal. Once we broke the link between 'Willingness' and 'Information', trade became safe again." |
  | **Round 3 Clearing Price** | 3. Price vs. Total Evidence | "The market cleared at 45, even though the average signal suggested 60. Why? Because at 60, only people with Blue slips wanted to sell. The price had to drop to entice Red-slip holders to buy, knowing they were picking up 'lemons'." |
  | **The Urn Setup** | 4. The Rigged Prior | "We all agreed the Urn was 50/50. We all agreed on the 70% reliability. That allowed you to decode each other's signals. But where did that agreement come from?" |

  **Opening Questions for the Room:**
  1.  "In Round 1, trade collapsed. Was that a failure of the market, or a success of your reasoning?"
  2.  "In Round 3, the price was lower than the average expectation. Who can explain the gap without using the word 'risk'?"
  3.  "We assumed we all knew the Urn's composition. If you walked into a real market, would you know the Urn exists?"

  **The Hayekian Objection (The Ending):**
  *   **Where it enters:** The final 5 minutes.
  *   **The Point:** The entire game relied on a **Common Prior** (the Urn rules written on the board). You all reasoned *from* the same model.
  *   **What to say:** "This game proves that if we share a prior, speculative trade is impossible (Round 1). But Hayek's claim isn't about traders who share a prior. It's about traders who *don't* know what the Urn is. They don't know the hypotheses. If you remove the Common Prior I rigged for you, the logic of Round 1 breaks. The market doesn't just pool signals about a known variable; it pools *models* of the world. We didn't test that today. We tested how well you solve a puzzle I gave you."

  ---

  ### What Will Predictably Go Wrong (and Handling)

  1.  **Prediction is about Expectations, not Individuals:**
      *   *Risk:* Some pairs will trade in Round 1 anyway because they didn't do the Bayesian update.
      *   *Handling:* Do not stop them. In the debrief, ask the non-traders: "Why did you hold?" Let them explain the adverse selection. The theorem holds in expectation; outliers prove they weren't reasoning strategically, which is a market friction point itself.
  2.  **Principled Non-Traders:**
      *   *Risk:* A philosophy student refuses to trade on ethical grounds or "principle."
      *   *Handling:* "Your payoff is on accuracy, not trade volume. Holding is a valid strategy if you believe the price is wrong. Record your 'Hold' as a belief that Price $\neq$ Value."
  3.  **Gaming the Puzzle:**
      *   *Risk:* Students try to maximize points by lying about probabilities.
      *   *Handling:* Remind them mid-game: "The Scoring Rule rewards truth. If you think 60%, writing 90% lowers your expected score. Check the formula."
  4.  **Signal Blurt:**
      *   *Risk:* Someone says "I have Red!" in Round 1.
      *   *Handling:* "That violates the protocol. That pair is disqualified from Round 1 payoffs. This illustrates why real markets have insider trading rules—to preserve the information aggregation."
  5.  **Wrong Moral (Luck vs. Skill):**
      *   *Risk:* A student with a Blue slip gets lucky and wins chocolates.
      *   *Handling:* "One draw doesn't validate a strategy. The Scoring Rule is about long-run accuracy. Did the *group* average probability match the frequency of Red balls?"

  ---

  ### What the Activity Cannot Reproduce (Lecture Supply)

  You must explicitly supply the following in the debrief/lecture, as the game cannot generate them:

  1.  **The Common Prior Assumption (CPA) Itself:** The game *imposes* the CPA (the Urn rules on the board). It cannot demonstrate *how* priors converge or why they might not. You must lecture on the distinction between "updating on signals" (Bayes) and "agreeing on the model" (Harsanyi).
  2.  **Iterated Reasoning (Fixed Point):** The game allows one or two steps of "I think that you think." It cannot reproduce the infinite regress required for the formal No-Trade Theorem proof. You must explain that the collapse in Round 1 is the *start* of the chain, not the end.
  3.  **Risk Neutrality:** The QSR mitigates this, but students are still human. You must clarify that the theorem holds strictly for risk-neutral agents; with risk aversion, some trade is possible even with common priors (hedging).
  4.  **Zero Transaction Costs:** The game has friction (time, effort). You must note that in the real world, transaction costs might prevent the "collapse" simply because it's not worth the cognitive effort to unwind the trade.
  5.  **"No Speculative Trade" vs. "No Gains from Trade":** The game shows speculative trade vanishing. You must clarify that *gains from trade* (e.g., consumption smoothing, risk sharing) still exist, which Round 2 hinted at. The theorem only kills *betting*, not *insurance*.
