  1. Argument in outline
  The passage argues social association depends on exchange, requiring equality between items. Since goods like houses and shoes are naturally incommensurable, a common standard is needed to equalize them. Positing demand (*chreia*) is the reality holding society, but demand is fluctuating. Money (*nomisma*) is introduced by convention (*nomos*) to represent demand as a stable measure. This allows prices to be fixed, ensuring that even when immediate wants differ, future exchange remains possible. Thus, money constitutes political community, bridging natural inequality and civic equality through valuation. It ensures continuity, allowing disparate contributions to count as equal shares. Without it, association dissolves into isolated households unable to trade.

  2. Clause-by-clause gloss
  (1) Establishes the problem: commodities must be compared. Money is introduced as the solution, a "middle term" measuring value ratios (shoes vs. house). This sets the requirement. (2) Identifies the ontological ground: demand is the real standard holding things together. Money is merely its conventional representation (*nomisma* from *nomos*), hence alterable. This distinguishes the physical token from the social force, grounding value in human need rather than metal. It explains why currency changes by fiat without destroying demand. (3) Proves demand's primacy: without mutual demand, exchange stops (example: export license). Inequality of demand must be equalized for trade to occur. This validates demand as the driver, showing exchange fails without it. It shows legal tender cannot force trade where want is absent. (4) Explains money's temporal function: it guarantees future exchange when immediate demand is absent. It acknowledges money's value fluctuates but claims it is "comparatively constant." Fixed prices ensure association continues. It reiterates the chain: no exchange → no association; no equality → no exchange; no commensurability → no equality. This links economic stability to political survival. The guarantee clause is vital: it explains why money is needed even when barter is theoretically possible, solving the coincidence of wants. Without this temporal bridge, the community fragments during periods of non-production. (5) Concludes with the formal requirement: one standard accepted by agreement. The algebraic example (A=B/2) demonstrates how money renders disparate items (house, bedstead) mathematically comparable, validating the earlier claim that money makes things commensurable for practical purposes. It closes the loop from problem to solution, confirming the arithmetic possibility of justice in transactions. Justice is thus a proportion restored by currency.

  3. The jobs money is doing
  The text assigns money three functions. First, as a *measure*: it makes things commensurable (1, 5). Second, as a *medium*: it is the "middle term" facilitating exchange (1). Third, as a *guarantee*: it secures future exchange when immediate need is absent (4).
  Which is load-bearing? The argument hinges on *association*. Association requires exchange; exchange requires equality; equality requires commensurability. Therefore, the measuring function is primary. However, the text says strict commensurability is impossible; demand furnishes the measure. Money merely represents demand. Thus, the *guarantee* function (4) is actually the load-bearing one for *sustaining* association. Without money as a store of future purchasing power, exchange stops when wants don't align immediately (3). The measuring function allows the calculation, but the guarantee function ensures the continuity of the community over time. If money only measured but couldn't be held for future payment ("something we can produce in payment"), the association would fracture during gaps in mutual demand. The text prioritizes the continuity of association over the precision of the measure. Consequently, money's stability is more critical than its intrinsic value. It is the social glue.

  4. My cases
  **The Koros Case:** Your hypothetical fails clause (4). The text requires money to be "something we can produce in payment." A pure unit of account cannot be produced or handed over. While the arithmetic in (5) works with koroi, the guarantee of future exchange fails because you cannot discharge a debt with a definition. The argument requires the same item to perform both jobs; the measure must be tangible enough to be "produced." If the koros cannot be held, association breaks when immediate barter is impossible. This suggests Aristotle conflates unit of account and medium of exchange. For his argument to hold, the representation of demand must be transferable. The failure matters because Aristotle concludes association requires exchange to be *always* possible (4). If the measure isn't also the medium, the "always" fails.
  **The Incense Case:** Your member's reading (civic need) is too narrow. The text defines demand as what "holds everything together" via exchange (2). It does not specify *what* is demanded, only that demand exists. In (3), the example is state-led, but the principle is "mutual service." If I want incense and you want cups, mutual service exists. The text says "if men cease to have wants... exchange will go on no longer." It does not distinguish vital from luxury wants. The incense trade fits because demand equalizes the exchange, regardless of the goods' contribution to self-sufficiency. Therefore, the text supports a subjective theory of value based on want, not an objective theory based on civic utility. The 'holding together' refers to the transactional bond, not biological survival.
  **The Corn Licence:** This example in (3) shows demand need not be symmetric initially ("one-sided"). The state has wine, the merchant wants a license. The inequality must be *equalized* by money. This supports the view that money corrects imbalances in demand, not that demand must be pre-existingly mutual in kind. The text settles this: "inequality of demand has therefore to be equalized." This clarifies that money's role is to bridge asymmetrical desires, enabling trade where barter fails. It reinforces the 'guarantee' function over the 'measure' function in complex trades. This point is decisive.

  5. The tension
  The text distinguishes between money's existence and money's value. It exists by custom (*nomos*) and can be rendered useless (e.g., demonetization), which is a political act. However, its *purchasing power* fluctuates naturally like other commodities (4). The claim that it "tends to be comparatively constant" is an empirical observation about its stability relative to shoes or houses, not an absolute rule. The statement "the proper thing is for all commodities to have their prices fixed" is normative, not descriptive. It prescribes what should happen to ensure association, acknowledging the tension. The text does not resolve whether fixed prices are possible given money's fluctuation; it asserts they are necessary for continuity. The tension remains: money is conventional yet must behave naturally stable to function. The text alone cannot settle if this is coherent; it simply asserts the necessity of stability for the sake of the argument about association. We must accept the prescription despite the descriptive instability. Thus, the argument relies on an idealized stability that reality may not support.

  6. Questions for the group
  1. If demand is the real measure, is money merely a receipt for demand, or does it create value?
  2. Can a pure unit of account (like the koros) sustain association if it cannot be physically exchanged?
  3. Does the incense trade count as "mutual service" holding the city together, or does Aristotle require a stricter notion of need?
  4. When Aristotle says prices ought to be fixed, is he describing a function of money or prescribing state policy?
  Which reading best preserves the link between exchange and community? Please consider these.
