  1. **The Scenario**

  Eli and Jordan are co-tenants in a house with a long, shared driveway. A blizzard drops two feet of snow, and the city fines the *household* if it isn't cleared by 8 AM. Both wake up at 6 AM, see the snow, and silently grab shovels. Eli takes the left track, Jordan takes the right. They work steadily, finishing at 7:30. Neither looks to the other for cues; each simply clears their half to ensure the fine is avoided. However, both know that if one had stopped halfway, the other would have been entitled to complain, "You can't leave me with the whole fine," and the stopper would have accepted the rebuke.

  2. **Analysis of Views**

  *   **Bratman (Plans View):** Bratman requires *Shared Intention*, which consists of: (1) I intend that we J, (2) You intend that we J, (3) These intentions are common knowledge, and (4) They mesh subplans *because* of each other.
      *   **Verdict: NO.**
      *   **Why:** Eli intends "I clear the left to avoid the fine." Jordan intends "I clear the right to avoid the fine." Neither necessarily intends " *We* clear the driveway." Their coordination is driven by a shared external threat (the fine), not by an interlocking psychological commitment to the *joint action* itself. Eli would have cleared the whole thing if Jordan hadn't shown up (to avoid the fine), meaning Eli's plan didn't *depend* on Jordan's intention, only on the outcome. The "because of each other's intention" condition fails.
      *   **Stretch Flag:** I am stretching Bratman slightly by insisting they lack the "We" representation. A Bratman defender might argue that clearing "your half" of a shared task *implies* a we-intention.

  *   **Gilbert (Commitment View):** Gilbert requires a *Joint Commitment*, created by: (1) Expression of readiness (can be tacit/behavioral), (2) Common knowledge of readiness, creating (3) Normative obligations/entitlements between parties.
      *   **Verdict: YES.**
      *   **Why:** The shared liability (the household fine) creates a context of joint obligation. By showing up and shoveling their halves, they tacitly express readiness to uphold their end of the household duty. The crucial test is the *entitlement to rebuke*. The scenario stipulates that if Eli stopped, Jordan could legitimately complain ("You can't leave me..."). This normative bond exists regardless of their internal psychological states.
      *   **Stretch Flag:** Minimal. This is classic Gilbert territory (obligations arising from shared circumstances + tacit participation).

  3. **Plain-Language Check**

  A person with no theory would say: "Yeah, they worked together. They're a team." They would focus on the outcome and the fact that they could hold each other accountable.
  *   **Sides with:** **Gilbert.**
  *   **Why:** Intuition tracks the *obligation* and the *result*, not the specific cognitive architecture of the intention. We call it a "we" because they are bound to each other, not because we know their brain states.

  4. **The Key Feature**

  *   **Feature:** **The Source of Coordination.**
  *   **Work:** The coordination is driven by *shared liability* (external norm) rather than *interlocking plans* (internal psychology).
  *   **Deletion Test:** If you remove the shared fine (liability) and they just shovel because they like snow, the Gilbert view weakens (no normative bond to ground the rebuke) and the Bratman view remains the same (still no interlocking plans). If you remove the *silence* and have them say "I'll do left, you do right," Bratman switches to **YES** (now there is explicit meshing and common knowledge), collapsing the difference. The silence + liability is the only thing keeping them apart.

  5. **Strongest Plans View Reply**

  *   **Reply:** "Functionalism." A Bratman defender will argue: "If they act *as if* they have a shared intention, and their plans *do* mesh (left and right fit together), then for all philosophical purposes, they *have* a shared intention. The internal 'We' label is unnecessary; the functional role is what matters."
  *   **Honest Read:** **Digging In.** This is a strong reply. Bratman is a functionalist. If the behavior is indistinguishable from shared intention, he will argue the intention is present *by definition*. To win this argument, you have to insist that the *motivation* (fear of fine vs. commitment to partner) changes the *type* of intention, which is a harder sell.

  6. **Group Attitudes**

  The idea that the group itself has attitudes (over and above members) helps **Gilbert**. She posits the "plural subject" as a distinct entity created by the joint commitment. In this case, the "Household" has an attitude (must clear snow) that binds Eli and Jordan. Bratman rejects this; he wants to reduce everything to individual attitudes. Since this case turns on a normative bond that feels bigger than the individuals (the household fine), the Group Attitude view bolsters the Gilbert verdict.

  7. **Honesty Check**

  *   **Can it be done?** **Barely.** This is a "near-miss" case.
  *   **Reason:** Bratman's theory is incredibly elastic. He argues that if you intend to do your part *in a context where you know the other is doing theirs*, you effectively intend the joint action.
  *   **Cheating Admission:** I cheated slightly in the scenario by *stipulating* the entitlement to rebuke ("Jordan would have been entitled to complain"). In real life, that entitlement is the *conclusion* of the argument, not a premise. If your friend challenges whether that entitlement actually exists without a verbal agreement, the case collapses. You are relying on Gilbert's definition of commitment (which creates the entitlement) to prove Gilbert is right.
  *   **Advice:** Bring this case, but admit the weak spot: "Bratman might say the functional coordination *is* the intention. But Gilbert explains why we feel *obligated* to each other, not just coordinated." That is the real wedge: **Obligation vs. Coordination.**
