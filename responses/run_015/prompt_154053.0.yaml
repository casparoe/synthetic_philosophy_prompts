      *   **Addressing the "Discharge and Lie" Proposal:** Flatly reject. It corrupts the institution and treats the patient as a means.
      *   **Addressing Relational Disclosure:** It is genuine if the patient's identity is constituted by those roles. It's not just paperwork if the patient *wants* that structure.
