answer: |-
  **Characters:**
  **ELIAS:** Defends Global Underdetermination.
  **NORA:** Defends Dimension-Gated Underdetermination.

  **Setting:** A seminar room, late afternoon. Whiteboard covered in half-erased equations.

  **NORA:** You're treating underdetermination like a universal constant. It's not. It's a function of dimensionality. My claim is simple: empirically equivalent rivals only survive when the parameter space is high-dimensional enough that adjustments can hide in the statistical noise. That's why the problem bites for climate models but is basically absent for low-dimensional kinematics.

  **ELIAS:** Absent? That's a bold word for a philosopher. You're saying Newtonian mechanics is immune because it has few variables?

  **NORA:** Immune to *significant* underdetermination. In low-dimensional spaces, the data constrains the theory tightly. There aren't enough degrees of freedom to cook up a rival that fits the data equally well without looking absurd. You're holding onto a global thesis that confuses logical possibility with statistical identifiability. Just because you *can* imagine a rival doesn't mean the parameter space allows one to exist within the confidence intervals.

  **ELIAS:** But that confidence interval relies on a model of the error itself. You're assuming the noise is random, Gaussian, independent. That's not data, Nora, that's theory. Even "low-dimensional" theories smuggle in hidden auxiliary commitments about measurement error and background conditions. You can't isolate the kinematics from the clock theory used to measure time.

  **NORA:** Sure, auxiliaries exist. But in a low-dimensional system, the auxiliaries are overdetermined by the data. If I tweak the error model to save a failing kinematic theory, I break the fit on the calibration data. The system is stiff. In high-dimensional systems, like general circulation models, the parameters are slippery. You can tweak cloud microphysics to compensate for ocean heat uptake errors. That's where underdetermination lives. It's gated by the ratio of parameters to constraints.

  **ELIAS:** You're describing practical difficulty, not ontological security. Just because it's hard to find a rival in kinematics doesn't mean the ontology is determined. You assume the background conditions are stable. But what if the "background" is shifting? Say, a subtle gravitational gradient we haven't modeled. You dismiss that as unlikely, but your dismissal is itself an auxiliary assumption.

  **NORA:** It's an assumption warranted by the identifiability analysis. If the gradient existed, it would show up in the residuals. In low dimensions, residuals scream. In high dimensions, they whisper. You're insisting on a skeptical standard that makes no distinction between a theory that fits with no slack and one that fits because it's infinitely flexible.

  **ELIAS:** The distinction is pragmatic, not logical. You want to say ontology is secure when the slack is small. I'm saying the slack is always there, you've just decided to ignore it when the math gets clean. If underdetermination is a threat to realism, it's a threat everywhere. If it's not, it's nowhere. You can't gate it by dimension without begging the question about which auxiliaries are fixed.

  **NORA:** I'm not fixing them. I'm testing them. That's the point. In low-dimensional spaces, you can test the auxiliaries independently. In high-dimensional spaces, you can't. So the underdetermination is real in one case and negligible in the other. Why refuse to draw that line?

  **ELIAS:** Because the line moves. What looks low-dimensional today might look high-dimensional tomorrow once we probe deeper into the measurement apparatus. You're building realism on sand and calling it bedrock because the tide is out.

  **NORA:** Then we'd never build anything. I'm telling you where the ground holds. You're telling me to float.

  **ELIAS:** I'm telling you to look at the water. It's always there.

  **NORA:** But sometimes it's shallow enough to walk across.

  **ELIAS:** Until you drown.

  **NORA:** That's a risk calculation, not a metaphysical verdict.

  **ELIAS:** And metaphysics is just risk calculation writ large. You haven't solved the problem; you've just quantified the uncertainty.

  **NORA:** Quantifying is solving.

  **ELIAS:** Not if the quantification assumes the answer.

  **NORA:** Then we're done.

  **ELIAS:** We're never done. That's the point.
