prompt: |-
  I direct the adjudication unit of a public agency that decides, several hundred times a month, whether an applicant qualifies for a support payment. The test we apply has three components, each vague and none of them defined anywhere I can find: the applicant's difficulties must be substantial rather than trivial; they must be long-term rather than temporary; and the help they need must be substantial rather than occasional. The components are also meant to trade off against one another, and how they trade off is left to us. Decisions are taken by caseworkers with two days' training, in about twenty minutes, must be justified to the applicant in a paragraph, and are treated as binding on later decisions. That last requirement has produced what a colleague of mine calls a diachronic sorites: each decision differs only imperceptibly from the one it cites, yet after two years the effective threshold has drifted somewhere none of us would have chosen knowingly.

  I want a decision procedure my unit can actually run, and I want it built rather than borrowed. It should tell a caseworker what to ask, in order; what counts as a sufficient answer to each question; where the procedure stops with a no; and where it hands the case to a panel because what remains is a question of values rather than fact. Four difficulties need to be designed around rather than dissolved. First, tolerance against consistency: if no small difference in an applicant's circumstances can be decisive, and each decision must be consistent with the one before it, the threshold moves; so the procedure needs anchoring of some kind — stored exemplar cases, periodic re-anchoring, and a rule for when a chain of decisions should be broken rather than extended. Second, comparing against classifying: my caseworkers are often confident that one applicant is worse off than another while unsure whether either one qualifies, and I want to know how much of the work can be done by such pairwise comparisons and where they stop working — I suspect comparability thins out at the margins and cannot be chained indefinitely. Third, the three components must not be collapsed into a single score, because the score would look more exact than the test is; say how they are kept apart and still brought to a verdict. Fourth, reasons: we cannot write to an applicant that the test is vague, and a reason that turns on a one-point difference reads as an insult, so I need to know which arbitrariness can be made legitimate by being announced in advance and which cannot.

  Then run the procedure on three cases. (a) Difficulties clearly substantial and clearly long-term, but the applicant copes with a piece of assistive equipment that does part of the work of a person, so it is unclear whether the help needed is substantial — and the equipment is a fact pattern nobody anticipated. (b) A fluctuating condition, trivial on good days and substantial on bad ones, where the number of bad days a week is itself a matter of degree and the claim sits near the middle of the range. (c) An applicant marginally worse than someone refused twenty-four months ago and marginally better than someone awarded last month. At least one of these should come out as a no that I will not like. Finally, tell me what the procedure cannot do, and whether publishing it — which our transparency rules push us towards — makes things worse by teaching advisers exactly how far a case has to be moved.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Director of an adjudication unit in a public agency.
      *   **Task:** Design a custom decision procedure for determining eligibility for support payments.
      *   **Current Problem:** Vague criteria (substantial/trivial, long-term/temporary, substantial/occasional), untrained caseworkers (2 days), quick decisions (20 mins), binding precedent causing "diachronic sorites" (threshold drift), need for justification.
      *   **Requirements:**
          1.  Tell caseworkers what to ask (in order).
          2.  Define sufficient answers.
          3.  Define stop points (No).
          4.  Define escalation points (Panel/Values).
          5.  Address Four Specific Difficulties:
              *   *Tolerance vs. Consistency:* Prevent threshold drift (anchoring, breaking chains).
              *   *Comparing vs. Classifying:* Use pairwise comparison but acknowledge limits.
              *   *Three Components:* Keep them separate (no single score) but reach a verdict.
              *   *Reasons:* Legitimate arbitrariness vs. insult; transparency issues.
      *   **Test Cases:** Run the procedure on three specific scenarios (a, b, c).
      *   **Limitations & Transparency:** Acknowledge what the procedure *can't* do and address the risk of publishing it (gaming the system).

  2.  **Deconstruct the Four Difficulties & Design Principles:**

      *   *Difficulty 1: Tolerance/Consistency (The Sorites Problem).*
          *   *Solution:* We need "Anchor Cases" (paradigms). We cannot rely solely on the immediate predecessor. We need a "Circuit Breaker" rule. If a chain of precedents drifts too far from the Anchor, the chain is broken, and a Panel decides.
      *   *Difficulty 2: Comparing vs. Classifying.*
          *   *Solution:* Use a "Triangulation Method." Compare the current case to a Clear Yes Anchor and a Clear No Anchor. If it falls clearly between them, classify. If it's too close to call against *both*, escalate. This acknowledges that comparability thins out.
      *   *Difficulty 3: Three Components (Substantial Difficulty, Long-Term, Substantial Help).*
          *   *Solution:* A "Gated Matrix." They are not summed. They are hurdles. However, since they trade off, we need a "Compensation Rule." High score in one can compensate for low score in another, *but* there is a minimum floor for each. No component can be zero.
      *   *Difficulty 4: Reasons/Transparency.*
          *   *Solution:* Distinguish between "Fact-Finding Reasons" (why we believe X) and "Policy-Choice Reasons" (why X counts as substantial). The latter are pre-announced rules. We admit uncertainty but frame it as applying a standard, not guessing. Regarding transparency: Publish the *process*, not the *anchors* in detail, or publish the anchors but acknowledge they evolve. Actually, the prompt asks if publishing makes it worse. I need to address that honestly.

  3.  **Drafting the Procedure (The "Anchored Triangulation Protocol"):**

      *   *Phase 1: Fact-Finding (The Questions).* Needs to map to the three components.
      *   *Phase 2: The Anchor Check (Consistency).* Compare to stored exemplars.
      *   *Phase 3: The Trade-Off (The Verdict).* How to combine the three components without a score.
      *   *Phase 4: Escalation.* When to send to a Panel.

  4.  **Refining the Mechanism (Addressing the Constraints):**

      *   *Caseworker Limitations:* 2 days training, 20 mins. The procedure must be simple, flowchart-style, not a complex algorithm.
      *   *Precedent:* The "Diachronic Sorites" needs a specific fix. *Rule:* Precedent is only binding if the cited case is within 6 months AND aligns with the Master Anchors.
      *   *Reasons:* Provide templates that focus on "fit with standard" rather than "mathematical precision."

  5.  **Developing the Test Cases:**

      *   *Case (a) Assistive Equipment:* Tests the "Substantial Help" component. The equipment reduces need. Is the *remaining* need substantial? Or is the *need for the equipment* the help?
      *   *Case (b) Fluctuating Condition:* Tests "Long-Term" and "Substantial." How to average? Peak vs. Mean?
      *   *Case (c) The Sorites Victim:* Marginally worse than a past No, marginally better than a recent Yes. This *must* trigger the "Circuit Breaker."

  6.  **Addressing the "Uncomfortable No":**
      *   The prompt asks for "At least one of these should come out as a no that I will not like."
      *   Case (c) is the natural candidate. If the procedure works, it should recognize the drift and reset. Resetting often means rejecting the marginal case to re-establish the boundary, or sending to a panel. If sent to a panel, the panel might say No to reset the line. Let's make the procedure force a Panel review for (c), but acknowledge the Panel might return a "Hard No" to reset the anchor. Or, to satisfy the "No that I will not like" directly from the procedure: If the procedure mandates adherence to the *original* Anchor over the *recent* Precedent, and the original Anchor was strict, Case (c) might get a No despite the recent Yes. Let's aim for the Procedure forcing a Panel, but the *recommendation* within the procedure leans No to stop the drift. Actually, the prompt says "Run the procedure... At least one... should come out as a no." I will design the "Circuit Breaker" to default to the stricter Master Anchor when drift is detected, resulting in a No for (c).

  7.  **Addressing Transparency:**
      *   If we publish the anchors, advisers will coach applicants to hit the anchor points.
      *   If we don't, we lack legitimacy.
      *   *Compromise:* Publish the *method* and the *Master Anchors*, but keep the *working precedent chain* internal. Acknowledge that gaming is possible but consistency is more important.

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the gravity of the Sorites problem.
      *   **The Procedure (Anchored Triangulation Protocol):** Step-by-step instructions.
      *   **Addressing the Four Difficulties:** Explicitly map design choices to the constraints.
      *   **Running the Cases:** Apply the logic to (a), (b), and (c).
      *   **Limitations & Transparency:** Honest assessment of risks.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is a "score" forbidden? Yes, "must not be collapsed into a single score."
      *   *Fix:* Use a "Traffic Light" system for each component (Red/Amber/Green). Verdict is based on the pattern (e.g., 3 Greens = Yes; 2 Greens 1 Amber = Yes; 1 Green 2 Ambers = Panel; Any Red = No). Wait, they trade off. So 1 Green can save 1 Amber.
      *   *Revised Logic:* Each component is rated: *Clear*, *Borderline*, *Fail*.
          *   3 Clear = Yes.
          *   2 Clear + 1 Borderline = Yes.
          *   1 Clear + 2 Borderline = Panel.
          *   Any Fail = No (unless compensated by 2 Clears? No, "minimum floor" is better). Let's say: No component can be 'Fail'. If all are 'Borderline' or better, use Anchors to decide.
      *   *Wait, the Trade-Off:* "Components are meant to trade off."
      *   *Revised Logic:* Use a "Weighted Anchor" approach. You don't score. You ask: "Is this case *closer* to the Yes-Anchor or the No-Anchor?" The three components are the *dimensions* of comparison.
      *   *Simplification for Caseworkers:* They can't do complex multidimensional scaling in 20 mins.
      *   *Best Approach:* **The "Three-Key Lock" with a "Master Override."**
          1.  Assess each key (Difficulty, Duration, Need).
          2.  If any key is definitively "Trivial/Temporary/Occasional" -> No. (Hard Floor).
          3.  If all are definitively "Substantial/Long-term/Substantial" -> Yes.
          4.  If mixed or borderline -> Compare to Anchors.
          5.  If Anchor comparison is ambiguous -> Panel.
      *   *Addressing the Sorites:* The "Master Anchors" are reviewed annually. Precedent chains are broken after 10 links or 6 months.

      *   *Refining the "No I won't like":* Case (c) is the drift case. The procedure must identify the drift. If the procedure identifies drift, it sends to Panel. The Panel decides. To make the *procedure* output a No, the procedure needs a rule: "If precedent drift is detected, revert to Master Anchor." If Master Anchor is strict, Case (c) is a No. This satisfies the constraint.

  10. **Final Polish:** Ensure tone is professional, empathetic to the caseworkers, and rigorous regarding the philosophical constraints (Sorites, Vagueness).

      *(Self-Correction on Transparency)*: The prompt asks "whether publishing it... makes things worse." I need to take a stance. My stance: Publishing the *anchors* is risky but necessary for legitimacy. Publishing the *drift-correction mechanism* is essential to prevent advisers from relying on outdated precedents. The risk of gaming is outweighed by the risk of arbitrary injustice.

      *(Self-Correction on Case A)*: Equipment reduces need. Is the need substantial? The procedure needs to define "Help Needed." Does it include "maintenance of equipment"? Let's decide the procedure treats "reliance on complex equipment" as a form of "help needed."

      *(Self-Correction on Case B)*: Fluctuating. Procedure needs a "Prevalence Rule." (e.g., Bad days > 50% of the time).

      *(Self-Correction on Case C)*: This is the Sorites case. The procedure must trigger the "Circuit Breaker."

      Let's write it.

      *Structure:*
      1.  **Philosophy:** Acknowledge the Sorites.
      2.  **The Procedure:** Step-by-step.
      3.  **Mapping the 4 Difficulties:** How the design solves them.
      4.  **Case Applications:** (a), (b), (c).
      5.  **Limitations & Transparency:** The hard truths.

      *Wait, one constraint check:* "Tell me what the procedure cannot do." I need a specific section for this.
      *Constraint check:* "Reasons... which arbitrariness can be made legitimate." I need to address this in the Reasons section.

      *Let's refine the "No I won't like".* If Case (c) is marginally better than a recent Yes, a human director would likely say Yes to maintain morale/consistency. But to stop the drift, the system must say No (or Panel that says No). I will make the procedure mandate a Panel for (c), but the *outcome* of that Panel process (as defined by the protocol's reset rule) is a rejection to re-anchor. Or simpler: The procedure says "If conflicting precedents exist within drift range, default to the stricter Master Anchor." That yields a No.

      *Wait, "built rather than borrowed".* I need to make sure this sounds like a bespoke administrative tool, not a generic clinical checklist.

      *Okay, ready to draft.*
answer: |-
  ### The Anchored Triangulation Protocol (ATP)

  **Objective:** To adjudicate eligibility without collapsing the three statutory components into a false precision, while arresting the "diachronic sorites" (threshold drift) caused by binding precedent.

  **Core Concept:** Caseworkers do not *measure* applicants against a line; they *place* applicants relative to fixed points. Precedent is not a chain, but a constellation.

  ---

  ### Part 1: The Procedure

  **Phase 1: The Three Gates (Fact-Finding)**
  *Time allocation: 10 minutes.*
  Caseworkers assess the three components independently. No trading off yet. For each, select one of three statuses: **Clear Pass**, **Borderline**, or **Clear Fail**.

  1.  **Difficulty (Substantial vs. Trivial):**
      *   *Ask:* "Does the condition prevent the applicant from performing [List of 5 Core Daily Activities] without significant pain, risk, or assistance?"
      *   *Clear Pass:* Prevents 3+ Core Activities.
      *   *Clear Fail:* Prevents 0 Core Activities.
      *   *Borderline:* Prevents 1-2 Core Activities.
  2.  **Duration (Long-term vs. Temporary):**
      *   *Ask:* "Has the condition lasted 12 months, or is it medically certain to last 12 months?"
      *   *Clear Pass:* >24 months or permanent.
      *   *Clear Fail:* <6 months or episodic with >6 month remission.
      *   *Borderline:* 6–24 months or fluctuating without clear remission.
  3.  **Need (Substantial vs. Occasional):**
      *   *Ask:* "Does the applicant require human assistance or complex equipment management for >1 hour daily?"
      *   *Clear Pass:* >5 hours daily or constant supervision.
      *   *Clear Fail:* <15 minutes daily or simple equipment (e.g., standard glasses).
      *   *Borderline:* 1–5 hours daily or complex equipment management.

  **Stop Rule:** If *any* component is a **Clear Fail**, the decision is **No**. (This establishes a hard floor; no amount of trading off allows a trivial difficulty to qualify).
  **Pass Rule:** If *all three* are **Clear Pass**, the decision is **Yes**.
  **Escalation:** If any component is **Borderline**, proceed to Phase 2.

  **Phase 2: Triangulation (Consistency Check)**
  *Time allocation: 5 minutes.*
  The caseworker accesses the **Master Anchor Library**. This contains 10 "Yes" cases and 10 "No" cases vetted by the Director and Legal, updated annually. These are the only binding precedents. Recent caseworker decisions are *not* binding.

  *   *Task:* Select the one Master Anchor (Yes or No) most similar to the current case.
  *   *Question:* "Is the current applicant *clearly* worse off than the closest No-Anchor? Or *clearly* better off than the closest Yes-Anchor?"
  *   *Decision:*
      *   If clearly worse than No-Anchor → **Yes**.
      *   If clearly better than Yes-Anchor → **No**.
      *   If in between or indistinguishable → **Escalate to Panel**.

  **Phase 3: The Circuit Breaker (Drift Control)**
  *Automated System Check.*
  Before the decision is finalized, the system checks the last 50 decisions made by the unit.
  *   *Rule:* If the approval rate for "Borderline" cases has shifted by >10% in the last 3 months compared to the Master Anchor baseline, the system locks Phase 2.
  *   *Action:* All "Borderline" cases are automatically routed to the Panel until the rate stabilizes.
  *   *Reasoning:* This breaks the chain of the diachronic sorites. It acknowledges that consistency with *recent* decisions is less important than consistency with *statutory intent*.

  **Phase 4: Reasons (Legitimizing Arbitrariness)**
  *Time allocation: 5 minutes.*
  Caseworkers select from pre-drafted paragraphs. They are forbidden from writing free-text justifications for Borderline cases to prevent "ad-hoc" reasoning that creates new, unintended precedents.

  *   *For Clear Pass/Fail:* "Your evidence demonstrates [Component] meets/does not meet the statutory threshold as defined in [Guidance Section X]."
  *   *For Borderline (Anchored):* "While your circumstances are difficult, they align more closely with Case Reference [Anchor ID], which was determined not to meet the threshold for [Component]. This ensures equal treatment with applicants in similar situations."
  *   *For Borderline (Panel):* "Your case presents a novel question regarding the interpretation of [Component]. It has been referred for senior review to ensure the standard is applied fairly."

  ---

  ### Part 2: Addressing the Four Difficulties

  **1. Tolerance Against Consistency (The Sorites)**
  *Design Solution:* The **Master Anchor Library** replaces the chain of precedent. Caseworkers compare the present case to the *Anchor*, not the *previous decision*. The **Circuit Breaker** forcibly interrupts the drift. If the unit becomes too lenient, the system forces a Panel review, resetting the effective threshold to the Anchor's standard.
  *Anchoring:* Anchors are re-validated annually by you (the Director). This is "periodic re-anchoring."
  *Breaking the Chain:* The rule that recent caseworker decisions are *not* binding is explicit. Only Master Anchors are binding.

  **2. Comparing Against Classifying**
  *Design Solution:* Phase 1 attempts classification (Clear/Borderline/Fail). Phase 2 admits that classification fails at the margins and switches to comparison (Triangulation).
  *Thinning Margins:* If the caseworker cannot say the applicant is *clearly* worse/better than an Anchor, the procedure admits defeat and escalates to the Panel. This acknowledges that comparability has a limit. The Panel's role is not to find facts, but to make the value judgment that the caseworker cannot.

  **3. The Three Components (No Single Score)**
  *Design Solution:* The **Three Gates** keep them separate. A "Clear Fail" in any gate vetoes the others. This prevents a very long-term trivial difficulty from qualifying.
  *Trade-Off:* Trade-offs are only permitted in the **Borderline** zone via the Anchors. An Anchor case might have "High Difficulty / Low Need" and still be a Yes. By comparing to that Anchor, a new case with similar trade-offs inherits the verdict without calculating a score.

  **4. Reasons (Legitimate Arbitrariness)**
  *Design Solution:* We distinguish between *Fact Arbitrariness* (illegitimate) and *Boundary Arbitrariness* (legitimate).
  *Announced in Advance:* The Master Anchors are published. We tell applicants: "We compare your case to these standard examples."
  *The Insult:* We do not say "You failed by one point." We say "You align with Anchor B, which is excluded." This shifts the blame from the applicant's specific deficit to the structural boundary. It frames the decision as *categorization* rather than *measurement*.

  ---

  ### Part 3: Running the Cases

  **Case (a): The Assistive Equipment**
  *Facts:* Difficulty (Clear Pass), Duration (Clear Pass), Need (Borderline). Equipment does the work of a person.
  *Procedure:*
  1.  **Phase 1:** Difficulty and Duration pass. Need is Borderline (is managing equipment "help"?).
  2.  **Phase 2:** Caseworker searches Anchors. Finds Anchor #4 (Yes): "Applicant requires dialysis machine management." Finds Anchor #7 (No): "Applicant uses standard prosthetic limb."
  3.  **Comparison:** The new equipment is more complex than a prosthetic but less demanding than dialysis. It falls *between* anchors.
  4.  **Verdict:** **Escalate to Panel.**
  *Reasoning:* The procedure recognizes this is a gap in the classification system. It cannot be solved by caseworker intuition without risking drift.
  *Outcome:* Panel decides that "dependence on complex technology" counts as "Need." Case becomes a new **Master Anchor (Yes)**.

  **Case (b): The Fluctuating Condition**
  *Facts:* Difficulty (Borderline - averages out), Duration (Clear Pass), Need (Borderline). Bad days are substantial, good days are trivial.
  *Procedure:*
  1.  **Phase 1:** Duration Pass. Difficulty and Need are Borderline due to fluctuation.
  2.  **Phase 2:** Caseworker consults the **Prevalence Rule** (embedded in Guidance): "For fluctuating conditions, assess the state occurring >50% of the time."
  3.  **Application:** If bad days are 3/7, the condition is assessed at the "good day" level.
  4.  **Verdict:** If "good day" level is Trivial → **No**. If "good day" level is Borderline → Compare to Anchors.
  *Assumption:* Let's assume bad days are 4/7. The assessment is "Substantial."
  5.  **Triangulation:** Compare to Anchor #2 (Yes: Chronic pain, fluctuating). Applicant is similar.
  6.  **Verdict:** **Yes.**
  *Reasoning:* The Prevalence Rule converts a vague degree into a binary fact (above/below 50%), allowing the procedure to run without caseworker speculation.

  **Case (c): The Sorites Victim**
  *Facts:* Marginally worse than a Refusal (24 months ago). Marginally better than an Award (last month).
  *Procedure:*
  1.  **Phase 1:** All components likely Borderline (otherwise they wouldn't be marginal).
  2.  **Phase 2:** Caseworker looks for Anchors.
      *   The Refusal (24 months ago) is *not* a Master Anchor (too old, not vetted).
      *   The Award (last month) is *not* a Master Anchor (caseworker decision).
      *   Caseworker must use the current Master Anchors.
  3.  **Circuit Breaker:** The system detects that the "Award last month" was part of a drift sequence (approval rate up 12%).
  4.  **Action:** The system locks the decision. The case is **Auto-Routed to Panel**.
  5.  **Panel Directive:** The Panel is instructed to rule based on the *Original Master Anchors*, ignoring the recent drift.
  6.  **Verdict:** **No.**
  *Why you won't like it:* This applicant is effectively being punished to correct the unit's historical error. They are marginally better than someone who got paid last month. But to pay them would cement the drift. The procedure sacrifices this individual to restore the integrity of the threshold. The reason letter cites the Master Anchor from 2 years ago, ignoring the recent precedent.

  ---

  ### Part 4: Limitations and Transparency

  **What the Procedure Cannot Do**
  1.  **It cannot eliminate discretion:** The Panel still makes value judgments. The procedure only confines *where* that judgment happens (Phase 2/3, not Phase 1).
  2.  **It cannot guarantee individual justice:** As seen in Case (c), systemic consistency sometimes requires individual unfairness. The procedure prioritizes the integrity of the fund over the marginal applicant.
  3.  **It cannot predict novel pathologies:** Case (a) shows that new fact patterns will always break the Anchors. The procedure handles this by escalation, not resolution.

  **The Transparency Risk**
  You asked if publishing this makes things worse.
  *   **The Risk:** Yes. If advisers know the "Prevalence Rule" (Case b), they will coach applicants to report symptoms occurring 51% of the time rather than 49%. If they know the Anchor cases, they will frame applications to mirror the language of the "Yes" Anchors.
  *   **The Necessity:** However, *not* publishing it is worse. Secret rules violate natural justice. If an applicant is rejected based on a Master Anchor they cannot see, they cannot challenge the comparison.
  *   **The Mitigation:** Publish the **Master Anchors** and the **Three Gates**, but do *not* publish the **Circuit Breaker** thresholds.
      *   *Why:* Advisers should know the standard (Anchors). They should not know the exact statistical trigger that forces a Panel review, or they might try to "flood" the system with borderline cases to trigger a reset or hide within the tolerance.
      *   *Reasoning:* Tell applicants: "We use a system of standard cases to ensure fairness. These standards are reviewed regularly to ensure they remain accurate." This acknowledges the anchors change without revealing the drift-control mechanism.

  **Final Recommendation**
  Adopt the ATP. It accepts that vagueness cannot be solved, only managed. It moves the burden of vagueness from the caseworker (who creates drift) to the Panel (who absorbs the political cost of hard lines). It will produce Case (c)—a rejection you will personally regret—but it will save your unit from becoming a lottery where eligibility depends on which caseworker you drew and how long the chain of precedent has been running.
