answer: |-
  This procedure settles whether the proposed tasks demonstrate flexible cognitive capacity based on operational markers, but it must hand back to the committee the value judgment of whether that capacity warrants increased protection.

  **Marker Assessment**
  Of your five proposed markers, three survive operationalization, one requires fixing, and one must be dropped for this setting. **Recombination versus Extension** survives; it is discernible from the methods section where task structures are described. **Acquisition Cost** survives; bench scientists can estimate trials-to-criterion against species norms without looking up data. **Symmetry of Transfer** survives; it is a binary check on whether the protocol tests bidirectional transfer. **Coherence of Failure** must be dropped; protocol documents rarely specify error patterns pre-data, and assessing this requires post-hoc analysis incompatible with a ten-minute review. **The Calibration Test** requires fixing; rename it **Modality Independence**. The question is not whether a different creature would pass, but whether the task design forces the animal to use a specific sensory loophole rather than relational mapping. If the task can be solved by a reflex specific to that species' sensors, it fails calibration regardless of performance.

  **The Decision Procedure**
  Execute these four steps in order. If any step fails, proceed to the next only to record why the tier remains low; do not backtrack.

  1.  **Modality Independence Check:** Ask, "Could this task be solved by a creature with no cognitive flexibility using only species-typical sensory reflexes?" If yes, the task is invalid for measuring intelligence. Stop here for cognitive scoring; assign Bottom Tier unless value judgment overrides.
  2.  **Marker Scan:** Ask three questions based on the protocol text and biologist knowledge: (a) Does the task require recombining learned elements into a new configuration? (b) Is the expected trials-to-criterion low relative to species norms for rote learning? (c) Is transfer tested bidirectionally? If two or more are yes, proceed to Step 3. If fewer than two, assign Bottom Tier.
  3.  **Capacity Determination:** If Steps 1 and 2 pass, record "High Cognitive Capacity." This is a factual claim about the animal's functional abilities.
  4.  **Protection Vote:** Ask, "Does High Cognitive Capacity require Top Tier protection in this context?" This is where the procedure stops and the committee votes. A "No" here is a value judgment, not a factual correction. Record the dissenting reason explicitly.

  **Minute Recording Requirements**
  To satisfy auditors and reveal drivers of outcomes, the minutes must contain three specific fields for each protocol:
  1.  **Marker Score:** List which of the three markers (Recombination, Cost, Symmetry) were met.
  2.  **Calibration Status:** Pass/Fail on Modality Independence.
  3.  **Decision Node:** State whether the Tier assignment was determined by Step 2 (Fact: Low Capacity) or Step 4 (Value: Capacity present, protection denied/granted). If Step 4 drove the decision, record the specific value conflict (e.g., "Scientific necessity overrides enrichment").

  **Application to Protocols**

  **Case 1: Cephalopods (Individual Housing, No Enrichment)**
  *   **Step 1 (Calibration):** Pass. Learning tasks for cephalopods typically require visual discrimination not solvable by reflex alone.
  *   **Step 2 (Markers):** Pass. Recombination is likely given the learning study design; Acquisition Cost is low relative to invertebrates; Symmetry is often tested in cephalopod cognition. Score: 2/3 or 3/3.
  *   **Step 3 (Capacity):** High Cognitive Capacity.
  *   **Step 4 (Protection):** Value Conflict. The investigator claims enrichment contaminates controls. The committee must decide if scientific control justifies withholding enrichment for a High Capacity animal.
  *   **Outcome:** Top Tier cognitively, but minutes must record "Value Override: Scientific Control" if enrichment is denied. If you deny Top Tier status here, you are making a value claim that control outweighs welfare, not a factual claim about cognition.
  *   **Resistance:** You cannot honestly resist the High Capacity finding without disputing the markers. You can only resist the Top Tier *requirements* by voting that scientific necessity trumps enrichment for this species.

  **Case 2: Mice (400 Subjects, Standard Housing)**
  *   **Step 1 (Calibration):** Pass. Conditioning tasks are generally modality-independent enough.
  *   **Step 2 (Markers):** Fail. Standard conditioning is extension, not recombination. Acquisition cost is high (rote). Transfer is rarely tested bidirectionally in standard assays. Score: 0/3 or 1/3.
  *   **Step 3 (Capacity):** Low Cognitive Capacity (by this measure).
  *   **Step 4 (Protection):** Bottom Tier.
  *   **Outcome:** Bottom Tier.
  *   **Resistance:** This reveals your current default is factually consistent with the procedure, but only because the tasks are rote. If the protocol involved complex maze recombination, the procedure would force them into Top Tier scrutiny. The procedure exposes that you are protecting the *task type*, not the species.

  **Case 3: Honeybees (Rapid Reversal, Recombined Discrimination)**
  *   **Step 1 (Calibration):** Pass/Fail Risk. If the discrimination relies on odor gradients specific to bee antennae, it fails. If it relies on conceptual matching (e.g., same/different), it passes. Assume Pass for this scenario based on "recombined discrimination."
  *   **Step 2 (Markers):** Pass. Rapid reversal indicates low acquisition cost. Recombined discrimination indicates recombination. Score: 2/3 or 3/3.
  *   **Step 3 (Capacity):** High Cognitive Capacity.
  *   **Step 4 (Protection):** Value Conflict. Your view is that bees lie outside the committee's concern.
  *   **Outcome:** The procedure assigns High Cognitive Capacity. If your committee rule is "High Capacity = Top Tier," bees go to Top Tier.
  *   **Resistance:** You cannot resist the Capacity finding honestly if the markers are met. You can only resist the Top Tier assignment at Step 4 by arguing that cognitive flexibility in insects does not trigger the same welfare obligations as in vertebrates. This forces you to admit that your tiering system is not actually about "cognitive sophistication" but about "phylogenetic proximity to humans." To be honest, you must record the Decision Node as "Value: Capacity present, protection denied based on taxonomic class."

  **Conception of Intelligence and Limitations**
  This procedure commits you to a functionalist conception of intelligence defined as domain-general flexible problem-solving, distinct from sentience or suffering capacity. It cannot measure pain, fear, or subjective experience, and it will systematically misfire on cases where high suffering coincides with low cognitive flexibility (e.g., larval stages, nociception-only models) or where high cognitive flexibility coincides with low suffering capacity (if such a case exists). It will also get wrong any case where the "Modality Independence" check is failed due to committee ignorance of species-specific sensory loopholes, as you rely on existing biologist knowledge without mid-meeting research. You are measuring the complexity of the software, not the sensitivity of the hardware, and you must defend why software complexity dictates hardware protection.
