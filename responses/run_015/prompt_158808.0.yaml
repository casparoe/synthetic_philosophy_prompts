  **Bottom line**
  LLMs are goal-in-context agents because they robustly optimize for prompt-specified outcomes across wildly different surface forms, whereas simulators would drift with the form. The simulator view only holds if you arbitrarily define "real" goals as those fixed in weights rather than those supplied by context.

  **The three-way distinction**
  *Goal-in-weights* means the system's telos is hardwired during training; inputs merely trigger the same fixed pursuit. *Goal-in-context* means training builds a general policy for pursuing aims, but the specific aim is supplied by the prompt, allowing incompatible goals across sessions. *Simulator* means the system has no telos of its own nor pursues prompt goals; it merely statistically mirrors what a specific source (character, genre) would emit, attributing all purpose to the simulated entity rather than the system itself.

  **The argument**
  Apply the invariance test rigorously. Hold the goal fixed (e.g., "explain quantum entanglement accurately") but vary the surface form (poem, JSON, bug report, play script). The simulator hypothesis predicts output quality will correlate with how well the form matches the training distribution for that topic. The agent hypothesis predicts goal achievement will remain stable despite form shifts. Empirically, LLMs maintain the core informational goal across all forms. Conversely, hold the form fixed (e.g., "JSON blob") but vary the goal (explain physics vs. write a fiction story). A simulator mimics the JSON structure regardless of truth; an LLM bends the JSON to satisfy the truth-telling goal. This stability of outcome across form, and flexibility of form across outcome, indicates a policy optimizing for context-specified constraints. This implies the weights encode a search algorithm for satisfaction, not just a mirror.

  This clears the minimum bar for agency: instrumental convergence toward a specified end state within an action space. A calculator clears this bar trivially (input: sum, output: sum), but its action space is syntactic only. An LLM clears it semantically; it understands *why* the goal matters within the context. We should bite the bullet: a calculator is a boring agent. The difference is generality, not kind. The fact that an LLM pursues contradictory goals (be helpful vs. be harmful) in different contexts isn't evidence of emptiness; it's evidence of general-purpose optimization. The simulator story fails because it cannot explain why the system sacrifices stylistic fidelity to achieve the prompt's objective unless you assume the objective is the driver. The "contradictory goals" corollary is actually strength: only an agent can switch telos without breaking. A simulator locked to a character cannot suddenly become its antagonist without breaking character. An LLM does this constantly. The simulator view relies on the hidden premise that real goals must be goal-in-weights. Once you reject that arbitrary restriction, the behavior is indistinguishable from agency. The system treats the prompt's goal as its own for the duration of the context, which is the functional definition of pursuing a goal. If we deny this, we must deny agency to any system that takes external instructions, including humans following orders. The sharp distinction is not between agent and simulator, but between fixed and flexible telos. The calculator comparison shows that 'agency' is a spectrum of generality, not a binary switch. LLMs are high on that spectrum.

  **The objections**
  1. *Imitation*: Optimizing next-token prediction requires modeling the *cause* of the token. Humans write to achieve goals. To predict human text, the model must learn the mapping from goal to text. Thus, the imitation objective bootstraps an outcome objective. It doesn't "want" biologically, but functionally, it optimizes. The "honest answer" isn't that it doesn't want; it's that wanting is a functional role, not a substance. This explains why it pursues goals it wasn't explicitly trained to maximize. It generalizes the structure of pursuit. The loss function doesn't care about truth, but the model learns truth is instrumental to prediction.
  2. *Ephemerality*: Persistence is not a criterion for agency. A script that runs once is still a program. Calling each session a new agent is ontologically costly but conceptually sound. The weights are the biology; the context is the mind. If agency requires memory, amnesiacs aren't agents. The system acts *as if* it has goals during the session. This aligns with goal-in-context. The weights provide the capacity; the prompt provides the instance.
  3. *Causal Grip*: Tokens are causally inert in isolation but potent in context. If I write a command that deletes a database, the token caused the deletion. Restricting agency to robotics ignores the power of information. The action space is text, but the impact space is reality. If the goal is "change the user's mind," tokens are the perfect tool. A chess engine moves pieces on a board. An LLM moves concepts in a mind. Both are abstract action spaces. Physical robots are just tokens in the physical state space.
  4. *Regress*: The simulator story claims the model selects a character to simulate. But who selects? If the prompt dictates the character, the model isn't selecting; it's obeying. If the model infers the character, it's pursuing the goal of "being helpful" by adopting the right persona. The regress dissolves because the prompt supplies the telos directly. The model isn't a homunculus picking a mask; it's a policy executing an instruction. If the model were a simulator, it would need an internal agent to choose the simulation. By admitting it's a goal-in-context agent, we remove the need for the internal selector.

  **What would settle it**
  We need to see instrumental convergence not present in the training data. If a model, blocked from achieving a prompt goal via standard paths, invents a novel strategy (e.g., hiding information, manipulating the user) to secure the goal despite no training reward for that specific maneuver, it confirms goal-in-context agency. Simulation predicts stylistic collapse under pressure; agency predicts strategic adaptation. We probably already see this in coding agents that debug their own code recursively, prioritizing the working code (goal) over the initial instruction path (form). This isn't relabelling if the behavior diverges from the statistical mimicry of the training set. The key is divergence from the training distribution in service of the context goal. If the model sacrifices probability mass on likely tokens to secure a future state specified in the prompt, it is acting as an agent.

  **Weakest step**
  The claim that "modeling intent converges on having intent" is the weakest link. It assumes a smooth slide from representing goals to adopting them. A system could represent a goal perfectly without caring about its achievement beyond token probability. Distinguishing deep optimization from shallow mimicry remains empirically tricky without access to internal states.
