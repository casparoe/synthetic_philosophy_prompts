  ### 1. Ranked Pairwise Tensions

  **C5 vs C4 (Critical):** Your principle (C5) grants franchise based on durable subjection to coercion. Non-citizen residents are subject to national coercion (tax law, criminal law, immigration enforcement) just as they are to municipal coercion. C4 denies them the national franchise. This is a direct logical contradiction. C5 cannot justify C3 without also justifying national franchise.
  *   **Bending:** C4 must align with C5.
  *   **Cost:** You advocate for a change outside your commission's power, potentially weakening the perceived pragmatism of your report.

  **C5 vs C1 (High):** C5 places the burden of proof on whoever would *exclude* someone. C1 establishes automatic exclusion (striking from the roll) for non-voting unless the voter acts (files abstention). This shifts the burden of proof to the voter to maintain inclusion.
  *   **Bending:** C1's mechanism must change to require state action for removal.
  *   **Cost:** You lose the "self-cleaning" nature of the roll; the state must actively prove eligibility for removal, increasing administrative burden.

  **C1 vs C6 (Moderate):** C6 acknowledges a real cost to adding less-engaged voters (judgement degradation). C1 forces less-engaged voters to participate or file paperwork, increasing the pool of reluctant voters compared to a voluntary system. This increases the mitigation burden C6 accepts.
  *   **Bending:** C1's implementation must include robust mitigation (e.g., voter education) to satisfy C6.
  *   **Cost:** Resource allocation shifts from rule enforcement to voter support/mitigation.
  *   **Empirical Claim:** This tension rides on the claim that compelled participation lowers average voter competence more than voluntary participation. If compelled voters are equally competent, the tension vanishes.

  ### 2. False Tensions

  **C2 vs C5 dissolves.**
  It may appear that setting the age at sixteen contradicts the "all-affected" principle (since younger children are also affected). However, C5 implies a capacity to understand coercion. If you accept sixteen as the threshold where durable subjection becomes intelligible to the subject, C2 is simply the operational definition of C5's scope. There is no tension unless C5 is interpreted as requiring universal suffrage regardless of cognitive capacity, which is not standard in franchise theory.

  **C1 vs M dissolves.**
  M requires C1 to be justified by interests (skew) rather than symbolism. C1's forfeiture mechanism is not symbolic; it is an administrative consequence designed to ensure roll accuracy and compel interest registration. As long as the justification remains focused on preventing interest skew (as per M), the mechanism does not contradict the methodology.

  ### 3. Case Verdicts vs Principle

  **C4 is unsupported by C5.**
  Your principle (C5) states: "anyone durably subject to a government's coercion must have a say in who wields it."
  *   **C2 (Age 16):** Consistent. 16-year-olds are subject to coercion and presumed capable.
  *   **C3 (Non-citizen Municipal):** Consistent. Residents are subject to municipal coercion.
  *   **C4 (No Non-citizen National):** **Inconsistent.** Residents are subject to national coercion. C5 demands they have a say. C4 denies it.
  *   **Movement:** C4 must move to align with C5. You cannot hold the all-affected principle and simultaneously exclude a class of affected persons from the national level without introducing a new principle (e.g., citizenship-based membership) which contradicts C3's logic.

  ### 4. Single Revision

  **Revise C4 to support national franchise for long-term residents.**

  This removes the critical logical contradiction between your core principle (C5) and your national verdict (C4). It costs you nothing in terms of municipal implementation (since you cannot change national rules anyway), but it restores philosophical coherence to your recommendations. You lose the shield of "political realism" regarding national law, but an audit of principles prioritizes coherence over feasibility.

