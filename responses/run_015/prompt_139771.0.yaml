answer: |-
  ### 1. The Rules of the Series (Derived from the Six Verdicts)

  Three implicit principles govern our past decisions, balancing openness to revision with disciplinary integrity:

  *   **The Proportionality Rule:** The strength and multiplicity of evidence must scale with the disruptiveness of the claim. (Seen in the rejection of the *Neolithic Marks* and *New Chronology* manuscripts versus the acceptance of the *Trans-Pacific* and *Dark Age* monographs). A claim that rewrites regional sequences requires more than a claim that reinterprets a single site's absence.
  *   **The Methodological Conventionality Rule:** Arguments must rely on positive evidence and standard analytical tools, not logical fallacies or the invalidation of the evidentiary record itself. (Seen in the rejection of *Ancient Astronauts* [argument from ignorance] and *New Chronology* [totalizing skepticism] versus the acceptance of *Colonial Looting* [standard excavation critique]).
  *   **The Corroboration Requirement:** Systemic revisions require independent lines of evidence. (Seen in the acceptance of *Trans-Pacific* [botanical + linguistic] versus the rejection of *Atlantis* [text + myth] and *Neolithic Marks* [single corpus]).

  **The Reparative Exception:** A decolonial or reparative frame is a valid motivation (*Colonial Looting*), but it does not exempt a manuscript from the Proportionality or Methodological rules. It can tip a borderline methodological case toward acceptance, but it cannot rescue a methodologically thin one.

  ### 2. Where the Rules Come Apart on This Submission

  The new submission creates tension between the **Proportionality Rule** and the **Reparative Exception**, while the colleague's **Symmetry Test** challenges the Proportionality Rule itself.

  *   **Proportionality says Reject:** The claim (redating three regional sequences by 800 years) is systemic and high-impact. The evidence (one site, one radiocarbon series, contested stratigraphy) is singular and fragile. This mirrors the *Neolithic Marks* rejection: the load-bearing evidence is too thin for the size of the revision.
  *   **Reparative Exception says Consider:** The explicit goal of restoring antiquity to a colonized people aligns with the *Colonial Looting* monograph. However, that monograph succeeded because it used conventional methods to show specific error, not to overturn systemic chronology on thin data.
  *   **Symmetry Test says (Conditional) Accept:** If the received chronology rests on equally fragile evidence, the Symmetry Test demands we accept this revision. The Proportionality Rule demands we reject it anyway, because correcting a weak consensus requires *strong* evidence, not just *equal* evidence.

  ### 3. The Decision

  **Reject the manuscript, with an invitation to resubmit pending the excavation of the predicted quay.**

  This decision best coheres with our precedents. It upholds the **Proportionality Rule** established in the *Neolithic Marks* case: a claim of this magnitude cannot rest on a single, contested datum, regardless of the author's rigorous defense or moral framing. However, unlike the *Atlantis* or *Ancient Astronauts* rejections, we acknowledge the argument is methodologically grounded (radiocarbon, stratigraphy) and falsifiable. The prediction of the quay offers a path to **Corroboration**. If the quay is found and dated securely, the evidence base shifts from "singular/fragile" to "multiple/corroborated," satisfying the Proportionality Rule.

  ### 4. The Closest Analog

  **The Neolithic Marks Manuscript (Rejected).**

  *   **Similarities:** Both argue for a significant push-back of cultural development (writing vs. urban flourishing) based on a small, ambiguous corpus (marks vs. seeds). Both were well-executed technically but rejected because the evidence was insufficient for the scale of the historical revision.
  *   **Difference:** The Neolithic author published a narrow paper on sign distribution; this author offers a risky prediction (the quay). This distinction allows us to reject the current draft without closing the door permanently, distinguishing it from the *Atlantis* rejection which was closed on epistemological grounds.

  ### 5. The Principle Adopted

  **"The burden of proof is a function of the claim's disruptive magnitude, not the moral urgency of its implications nor the fragility of the consensus it challenges."**

  We adopt the Proportionality Rule over the Symmetry Test. Historical inquiry cannot advance by replacing a weak consensus with a weak revision; it requires cumulative security. The reparative value of restoring a people's antiquity is real, but publishing a methodologically fragile argument to achieve it risks undermining the very historical validity the author seeks to secure.

  ### 6. The Single Change to Tell the Rules Apart

  To distinguish the **Proportionality Rule** (our precedent) from the **Symmetry Test** (the proposal), and determine if Symmetry belongs in the set:

  **Conduct an audit of the evidentiary basis of the *received chronology*.**

  *   **Scenario:** Suppose the audit reveals the received chronology for this culture *also* rests on a single submerged site with a single, potentially contested radiocarbon series.
  *   **Symmetry Test Verdict:** **Publish.** The new claim meets the same standard as the old one.
  *   **Proportionality Rule Verdict:** **Reject.** Even if the old chronology is fragile, a systemic revision (redating three regions) requires *stronger* evidence than the status quo, not merely *equal* evidence.
  *   **Conclusion:** If we would still reject in this scenario, the Symmetry Test is excluded from the set. The *Neolithic Marks* precedent suggests we *would* reject, confirming that the Symmetry Test is incompatible with our series' standards. We demand that revisionist history be *more* secure than the history it replaces, not just as secure.
