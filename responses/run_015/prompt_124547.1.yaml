answer: |-
  **TO:** Collections and Access Committee
  **FROM:** [Your Name], Volunteer Trustee
  **DATE:** 14 October 2023
  **RE:** Access Strategy for Settlement Examination Books (1836–1848)

  I recommend we proceed with full open publication, name- and place-indexed, subject to a committed second stage delivering a 'counter-register' pilot within twelve months. This staged combination satisfies our legal accessibility obligations and funder conditions while actively mitigating the archival risks of attributive ventriloquy.

  We must reject the proposal for deliberately unindexed publication. While the archivist's distinction between access-silence and category-silence is vital, removing searchability does not cure the latter; it merely compounds it with access-silence. Furthermore, the practical constraints of this run dictate that the digital surrogate is the only access route, as the originals are too unstable for production. Consequently, we must provide text equivalents for our trustee who relies on a screen reader. Once machine-readable text exists for accessibility, withholding indexation becomes technically contradictory and user-hostile. We cannot claim to provide access while deliberately engineering friction for those requiring assistive technology.

  The asymmetry argument further compels us to index. The gentry's estate papers and vestry minute books in this building are fully searchable. If we make the poor's records deliberately hard to search, we reproduce with public money precisely the imbalance that reading history from below was supposed to undo. We cannot justify enforcing a class-based barrier to information where none existed for the propertied classes. Additionally, there is a significant commercial risk. If we do not index these records, a commercial genealogy site will likely index our images within a year whatever we decide. They will extract the data without our contextual apparatus, leaving us with the amplification of the clerk's idiom and none of the corrective framework. It is preferable we control the index than cede it to entities with no interest in the nuances of category-silence.

  However, we must accept the archivist's warning regarding attributive ventriloquy. A keyword search will return the clerk's categories under the pauper's name. To address this, the indexed publication must include prominent interface notes explaining that the 'first-person' voice is legally mediated. The index should not simply list names but flag the legal status recorded (e.g., 'chargeable', 'removed'). This preserves searchability while alerting the user to the structural silence regarding why anyone left a place or what became of the children. The second stage, the counter-register, is where we actively repair this silence. By crowdsourcing biographical supplements from baptisms and rate books, we ensure no one appears only as a legal status. This moves us from passive access to active contextualisation.

  Regarding external communications, we will tell the County Family History Society that we are granting their petition for full indexation immediately, acknowledging their contribution to the pressure for access. We will write in the report to the Heritage Fund that public-access conditions have been met through full searchable publication, with additional value added through a planned biographical enhancement project. This secures our compliance while signalling scholarly rigour.

  **Conditions and Timetable**

  1.  **Immediate Action:** Commission OCR and transcription for accessibility compliance immediately. This text will form the basis of the index.
  2.  **Launch:** Public release of indexed images by 1 March next year.
  3.  **Contextual Metadata:** Interface must display the warning regarding clerk-mediated testimony on every search result page.
  4.  **Counter-Register Pilot:** Volunteers to begin crowdsourced biographical supplementation by 1 June next year, targeting 10% of the run initially.
  5.  **Budget:** Allocation of remaining conservation funds to support the counter-register platform development.

  **Trigger for Revisit**

  We will revisit this decision at the committee meeting one year from launch. The trigger for an emergency review prior to that date would be either the commercial indexing of these records by a third party without our contextual metadata, or if user feedback indicates the interface warnings are being systematically ignored, thereby reinforcing the ventriloquy we seek to mitigate. If the counter-register pilot fails to recruit sufficient volunteer capacity by the one-year mark, we must reassess whether the indexed-only model is doing sufficient harm to warrant restricting search functions, though I assess this likelihood as low given the accessibility constraints.

  This approach balances the imperative of access with the responsibility of interpretation. It acknowledges that while we cannot change the silence built into the record's creation, we must not compound it by restricting the record's retrieval.
