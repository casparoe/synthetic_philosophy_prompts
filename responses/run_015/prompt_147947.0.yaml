answer: |-
  You're pressing hard on the vocabulary issue, but you're conflating the linguistic formulation of a principle with the practical orientation of the will. In case (b), I deny moral worth outright: a being incapable of normative concepts lacks the capacity for moral agency altogether, regardless of how beautifully their inclinations track the good; they are a sophisticated automaton of benevolence, not a moral agent. In case (a), however, I grant worth, not because of the history per se, but because the structure of her agency remains constituted by the commitment to duty even if the lesion blocks explicit articulation. The 'thought' that an action is required need not be an occurrent sentence in her head; it is the formal structure of her volition, and in (a) that structure was solidified before the lesion and persists as the organizing principle of her dispositions. You claim this reduces worth to causal history, but I insist it preserves what she acts *for*: she acts for the sake of the law because her will is still shaped by that law, whereas the subject in (b) acts only from inclination because her will never encountered the law. Your counterfactual robustness proposal fails because it looks only at the reliability of the output, ignoring the authority under which the agent takes herself to be standing; a well-programmed robot is robust, but it has no moral worth.

  The single step I am least confident in is the claim that the normative orientation of the will can survive the total loss of the capacity to entertain normative thoughts. If a future case showed that the loss of normative vocabulary necessarily entails the loss of the specific motivational force of duty—collapsing the distinction between a duty-constituted disposition and a merely sympathetic one even from the first-person perspective—I would have to abandon the view.
