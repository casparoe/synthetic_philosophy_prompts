answer: |-
  You have put your finger on one of the most enduring and significant tensions in moral philosophy. Your observation is astute: formal ethics often demands a "view from nowhere" (impartiality), while lived morality is inescapably a "view from somewhere" (partiality).

  Here is the breakdown of the terminology, the strongest objections, and the underlying assumptions of the approach you are describing.

  ### 1. What is this called?

  You are correct that "moral particularism" isn't quite it (that argues against *principles* generally, not necessarily for *relationships*), and "virtue ethics" is close but focuses on *character* rather than the relational bond itself.

  There are three terms that collectively capture what you are describing:

  **A. The Ethics of Care**
  This is the most prominent named school of thought matching your description. Emerging from feminist philosophy in the 1980s (notably Carol Gilligan, Nel Noddings, and Virginia Held), it argues that morality is not about abstract justice or rules, but about **maintaining relationships and responding to need.**
  *   **Key tenet:** We are not isolated individuals who occasionally interact; we are fundamentally interdependent. Therefore, moral obligations arise from our concrete connections to others, not from a hypothetical social contract.

  **B. Associative Duties (or Special Obligations)**
  In analytic normative ethics, the specific phenomenon you described—where a relationship *itself* generates a duty—is called **Associative Duties**.
  *   **The Debate:** "Impartialists" (Utilitarians, Kantians) argue these duties must be *derived* from general rules (e.g., "I should save my kid because generally, parents are best equipped to raise children, which maximizes utility").
  *   **The View You Describe:** "Partialists" argue these duties are **fundamental**. The fact that "she is my mother" is the *source* of the obligation, not just a variable in a calculation.

  **C. Moral Partialism**
  This is the direct opposite of "Moral Impartialism." An impartialist says your own interests and relationships count for no more than anyone else's from a moral standpoint. A partialist argues that **agent-relative reasons** (reasons that apply to *you* because of who *you* are) are legitimate moral currency.

  **Historical Note:** While Western philosophy often privileges the "rulebook" (Kant, Mill), **Confucianism** is a major philosophical tradition built almost entirely on the "relationship approach." In Confucian ethics, there is no abstract "humanity"; there are only specific roles (father/son, ruler/subject, friend/friend). To treat your father as a stranger is not just cold; it is a violation of the cosmic order.

  ### 2. What is the strongest argument against it?

  If you are sympathetic to the relationship approach, the argument that should make you doubt it most is **The Problem of Parochialism (or Corruption).**

  Here is the core of the objection:
  **Relationships are morally arbitrary.**

  Why is your child more valuable than a stranger's child? Biologically and emotionally, they are more valuable *to you*. But from a moral standpoint, why does the accident of genetics or geography grant you the right to prioritize them?

  If we take the relationship approach seriously as a *fundamental* framework, it struggles to condemn:
  *   **Nepotism:** Hiring your unqualified brother instead of a qualified stranger.
  *   **Tribalism/Nationalism:** Prioritizing the welfare of your "national family" over starving foreigners.
  *   **Organized Crime:** The Mafia operates entirely on a relationship ethic (loyalty to the Family above the law).

  **The "Adjudication" Problem:**
  The rulebook approach has a built-in conflict resolution system: compare the principles. (e.g., "Does lying here cause more harm than truth-telling?").
  The relationship approach lacks a meta-rule. What do you do when relational duties clash?
  *   *Scenario:* You have to choose between saving your spouse or your child.
  *   *Rulebook:* Might say "flip a coin" or "save the one with more life expectancy."
  *   *Relationship:* Both duties are fundamental. There is no higher principle to appeal to. This can lead to moral paralysis or decisions that look like pure favoritism to outsiders.

  **The Strongest Critic:** The philosopher **Peter Singer** represents the extreme of the "rulebook" (impartial) view. He argues that if you buy your child a luxury toy instead of donating that money to save a starving child overseas, you are prioritizing a "psychological quirk" (your love for your kid) over a life. To the impartialist, the relationship approach looks like a sophisticated rationalization for bias.

  ### 3. What assumptions does this depend on?

  The relationship approach rests on specific metaphysical and epistemological assumptions. If you drop them, the theory collapses back into the rulebook.

  **Assumption 1: Relational Ontology (vs. Atomism)**
  *   **The Assumption:** Human beings are not self-contained atoms who *choose* to enter relationships. We are constituted by our relationships. You cannot be a "person" without being a "son," "friend," or "citizen."
  *   **If Dropped:** If you assume humans are autonomous, rational individuals first (Liberal Individualism), then relationships become voluntary contracts. Obligations must then be consensual or universal, not inherent.

  **Assumption 2: Emotional Cognitivism**
  *   **The Assumption:** Emotions (love, loyalty, grief) are not just chemical noise; they are a form of **moral perception**. Feeling that you *must* save your child is a recognition of a moral truth, not a biological glitch.
  *   **If Dropped:** If you assume reason is the only path to moral truth (Kantianism), then emotions are "inclinations" that must be mastered. The relationship approach becomes mere sentimentality.

  **Assumption 3: The Priority of the Local**
  *   **The Assumption:** Morality scales. We learn to be good in small circles (family) before we can care about abstract humanity. You cannot love "Humanity"; you can only love humans.
  *   **If Dropped:** If you assume morality must be universalizable immediately (Utilitarianism), then the local circle is a distraction. The suffering of a stranger counts exactly as much as the suffering of a kin.

  ### Summary: The "Integrity" Objection

  It is worth noting that the philosopher **Bernard Williams** famously attacked the "rulebook" approach with what is called the **Integrity Objection**.

  He argued that if you adopt the impartial "rulebook" view fully, you become alienated from your own life. If you have to calculate the utility of saving your wife versus a stranger, you are having "one thought too many." The fact that she is your wife should be the *end* of the deliberation, not the start of it.

  Williams argued that the "rulebook" approach demands a level of impartiality that destroys the very projects and relationships that make life worth living.

  **The Synthesis:**
  Most modern philosophers settle on a **Moderate Partialism**. They accept that we have special obligations to those close to us (Associative Duties), *but* these obligations are constrained by general rules of justice.
  *   *Example:* You should feed your child first (Partiality), but you should not steal food from a stranger to do it (Impartial Constraint).
  *   *Example:* You should hire your friend (Partiality), but only if they are qualified (Impartial Constraint).

  You are essentially arguing for the validity of the **Partialist** intuition, which is widely shared but often philosophically marginalized. You are in good company: Aristotle, Hume, Confucius, and Bernard Williams all stand with you against the pure "rulebook" of Kant and Mill.
