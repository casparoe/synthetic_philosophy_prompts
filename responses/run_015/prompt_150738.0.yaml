answer: |-
  **Project Title:** Modal Topology and Expected Value: A Structural Critique of Fanaticism

  **Project Summary**
  Expected Value (EV) maximization faces a well-known instability: "fanaticism." If utility is unbounded and probabilities are non-zero, a sufficiently large payoff outweighs any certain cost, implying agents should mortgage the present for tiny chances at astronomical future benefits (e.g., Pascal's Mugging, longtermist interventions). Standard responses either bite the bullet (accepting fanaticism), bound utility (limiting value), or impose probability thresholds (ignoring tiny risks). This project argues that all three approaches share a hidden, flawed assumption: modal flatness. They treat all possible worlds with non-zero probability as structurally equivalent decision-inputs, regardless of their "distance" from actuality. This proposal outlines a conceptual investigation into whether weighting expectations by modal distance—distinct from epistemic probability or utility curvature—can dissolve fanaticism without collapsing into standard risk aversion.

  **Background and Problem Statement**
  The fanaticism problem arises because standard decision theory separates the *magnitude* of value and the *likelihood* of occurrence, but ignores the *structure* of possibility itself. In a standard EV calculation, a world where a coin flip saves one person ($P=0.5$) and a world where a complex chain of quantum events saves a trillion people ($P=10^{-9}$) are treated identically in terms of modal status: they are both simply "possible worlds" indexed by a scalar probability.

  Existing solutions fail to address this structural flatness.
  1.  **Fanaticists** accept the implication, arguing rationality requires sacrificing the certain for the astronomical.
  2.  **Risk-Aversion Models** tweak the utility function ($U$), diminishing the value of large outcomes. This fails to capture the intuition that the *possibility* itself is suspect, not just the value.
  3.  **Probability Skeptics** argue tiny probabilities are unknowable. This is an epistemic claim, not a decision-theoretic one; it doesn't explain how to act when probabilities are stipulated as known in thought experiments.

  None of these approaches question the metric of possibility. They assume that if a world is logically consistent and assigned a probability, it enters the expectation sum linearly. This project posits that this is the error. A world requiring multiple independent miracles is "modally distant" compared to a world requiring one. If decision weights should decay with modal distance, fanaticism may dissolve not because the utility is bounded or the probability zero, but because distant possibilities contribute less to expectation than their probability scalar suggests.

  **Research Question**
  Does EV fanaticism depend on treating modal proximity as irrelevant? Can we construct a non-arbitrary modal-distance discount function that integrates into expectation calculations without collapsing into risk aversion or probability nihilism?

  **Methodology (8-10 Weeks)**
  This is a purely conceptual project involving formal modeling and intuitive testing. No empirical data collection will be used.

  *   **Weeks 1-3: Formalizing Modal Distance.**
      I will survey existing accounts of modal similarity (e.g., Lewisian closeness, logical depth) to construct a metric $D(w)$ for possible worlds. The goal is to define distance not as epistemic uncertainty, but as structural complexity or "miracle count" required to reach world $w$ from actuality. I will draft a weighting function $W(P, D)$ to replace the standard probability term in EV calculations.

  *   **Weeks 4-7: Staged Rescue Cases.**
      I will generate a series of controlled thought experiments varying three parameters: certain savings, probabilistic savings, and modal distance.
      *   *Case A:* Save 1 person (Certain).
      *   *Case B:* Save 1 trillion people ($P=10^{-9}$, Modal Distance = Low, e.g., single lottery).
      *   *Case C:* Save 1 trillion people ($P=10^{-9}$, Modal Distance = High, e.g., requires physics violation).
      Standard EV treats B and C identically. A modal-discounted model should rank A > B > C. I will test the formal model against these pre-theoretic judgments to check for alignment.

  *   **Weeks 8-10: Stability and Collapse Checks.**
      The critical test is distinguishing modal discounting from risk aversion. I will analyze whether the proposed weighting function is mathematically reducible to a concave utility function. If $W(P, D)$ can be rewritten as $U'(x)$, the project fails to offer a novel solution. I will also check for "modal paralysis"—ensuring the discount function doesn't zero out all uncertain futures, rendering planning impossible.

  **Success Conditions**
  *   **Total Success:** A formal decision rule is produced that resolves fanaticism cases (preferring the certain save) while preserving standard risk-neutral intuitions in low-stakes, close-modal cases (e.g., preferring a 51% chance of $100 over certain $50). The model must demonstrate that modal distance is not reducible to utility curvature.
  *   **Partial Success:** A rigorous proof that modal distance cannot be integrated into expectation without violating standard axioms of rationality (e.g., independence or continuity). This would clarify why the literature has ignored modal structure.
  *   **Total Failure:** The proposed discount function proves indistinguishable from standard risk aversion, or relies on arbitrary parameters that require the same intuitive judgments they are meant to justify.

  **Scope and Feasibility Check**
  This project is strictly conceptual, fitting the summer timeframe by avoiding IRB approval or data collection. The risk lies in the formalization of "modal distance," which is philosophically contested. To mitigate this, the project will not attempt to solve the metaphysics of modality but will treat modal distance as a primitive parameter to test its decision-theoretic utility. If a robust metric proves impossible within 10 weeks, the output will shift to a impossibility proof (Partial Success), which remains a valuable contribution to decision theory. The scope is narrow enough to be completed but novel enough to avoid rehashing standard probability skepticism.

  **Conclusion**
  Current debates on EV fanaticism are stuck toggling between accepting absurd conclusions and arbitrarily limiting inputs. By shifting the focus from the *magnitude* of outcomes to the *topology* of possibility, this project offers a third path. If rationality requires sensitivity to how "far away" a possible world is, not just how probable it is, then fanaticism is not a feature of rationality, but an artifact of a flat modal model.
