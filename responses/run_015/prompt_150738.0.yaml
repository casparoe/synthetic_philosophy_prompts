  i want a short research proposal — two pages max, for a summer fellowship — framing this precisely: does EV fanaticism depend on treating modal proximity as irrelevant, and can we build a non-arbitrary modal-distance discount into expectation without just collapsing into risk aversion? include why existing answers dont settle it (they bite the bullet or tweak utility, but never touch the modal structure), the method over about 8-10 weeks — probably comparing formal decision rules against pre-theoretic judgments in staged rescue cases — what success looks like vs total failure, and an honest scope check since its only one summer. keep it fully conceptual, no empirical work. and please, no bibliography or citation requests — i'll add sources myself if i actually write it. just need the framing to be sharp enough that its not something i could google in thirty seconds.
