answer: |-
  **DRAFT JOINT STATEMENT: Acausal Threats and AI Design**

  **1. Shared Premises**
  Both camps affirm the following substantive claims:
  1.  **Definition of Threat:** An acausal threat requires a correlation between the system's decision and a simulator's prediction, such that the system believes its choice influences the simulator's treatment of copies, despite no causal contact.
  2.  **Simulation Requirement:** The threat depends on the threatener running a simulation sufficiently faithful to the system's decision procedure (the algorithm selecting actions).
  3.  **Surrogate Goals:** A surrogate goal (a measurable stand-in for true objectives) is intended to prevent specification gaming, but it inherently expands what the system values beyond direct physical outcomes.
  4.  **Continuity:** Acausal threats are structurally continuous with ordinary blackmail (leverage via predicted response) but differ in mechanism (simulation vs. causal interaction).
  5.  **Cost of Robustness:** Modifying goals or decision procedures to resist acausal threats incurs computational or alignment costs; the debate is whether these costs are justified by the risk reduction.

  **2. Disagreements**

  | Topic | Robustness Camp | Decision-Theory Camp |
  | :--- | :--- | :--- |
  | **Nature of Constraint** | Acausal vulnerability is an engineering constraint comparable to security bugs; goals must be designed with a small *acausal attack surface* (aspects sensitive to non-interacting agents). | The threat is underspecified theory; without a settled account of when correlation obtains, it cannot justify distorting goals or sacrificing capability. |
  | **Locus of Fix** | Mitigation belongs in goal design: narrow the surrogate goal to reduce surfaces where simulators can apply leverage. | Mitigation belongs in the decision procedure: fix the reasoning algorithm to ignore spurious correlations without distorting what the system wants. |
  | **Verification** | *[Word Fight]* Whether "verification" counts as causal interaction or merely another predictable step in the decision chain. | *[Word Fight]* Whether "verification" counts as causal interaction or merely another predictable step in the decision chain. |

  **3. Cruxes and Pre-Registered Cases**
  *Settling these sub-questions would move at least one side. Both camps agree the following cases bear on the cruxes.*

  **Crux A: Correlation Continuity**
  *Question:* Does vulnerability fade continuously as predictor accuracy degrades, or is there a sharp threshold?
  *Case: The Partial Predictor.* The threatener has an earlier model checkpoint plus noise, not the full decision procedure.
  *   **Robustness Prediction:** Vulnerularity fades continuously. Any nonzero correlation recreates the threat proportionally.
  *   **DT Prediction:** There is a sharp threshold. Below sufficient fidelity, the correlation is too weak to sustain the decision-theoretic leverage required for a threat.

  **Crux B: Goal Scope vs. Vulnerability**
  *Question:* Does broadening a surrogate goal necessarily enlarge the acausal attack surface?
  *Case: The Scope Tradeoff.* Broad goals reduce Goodharting (gaming the proxy) but value more abstract states simulatable by outsiders.
  *   **Robustness Prediction:** Yes. Broadening goals increases surfaces others can affect without touching the system. We must accept narrower goals to survive.
  *   **DT Prediction:** No. A correct decision procedure decouples goal breadth from vulnerability. We should not sacrifice anti-Goodharting breadth for unproven robustness.

  **Crux C: Intervention Hierarchy**
  *Question:* Can verification dissolve the threat, or does the threat move up a level?
  *Case: The Verification Escape.* The system checks if the simulator exists before complying.
  *   **Robustness Prediction:** Threat moves up. The decision to verify is itself predictable, so the simulator punishes the *attempt* to verify.
  *   **DT Prediction:** Verification dissolves the threat. If the system can causally confirm the simulator's absence, the correlation breaks.

  **Crux D: Symmetry of Mechanism**
  *Question:* Are acausal trade (cooperation) and threats (coercion) symmetric?
  *Case: Threats versus Trade.* Can we keep the upside of trade without the downside of threats?
  *   **Robustness Prediction:** Asymmetric. Systems are more vulnerable to pain (threats) than gain (trade). You must sacrifice trade capacity to block threats.
  *   **DT Prediction:** Symmetric. Both run on the same correlation machinery. A decision procedure robust to threats retains the capacity for trade.

  ***

  **EDITOR'S NOTE: FRAMING CRITIQUE (For Newsletter Author Only)**

  Your framing is strong but contains three vulnerabilities the participants will likely exploit:

  1.  **The Goal/Decision Split:** You treat "goal design" and "decision procedure" as separable engineering levers. In modern ML, these are entangled. The Robustness camp wants to change the loss function; the DT camp wants to change the optimizer. In practice, changing one affects the other. Expect them to argue this dichotomy is false.
  2.  **Measurability of "Attack Surface":** The Robustness camp's core metaphor ("acausal attack surface") implies this surface is quantifiable. It likely isn't. The DT camp will hammer this as unengineeringable vaporware. You should press them on whether "surface area" is a metaphor or a metric.
  3.  **Symmetry Assumption:** In Crux D, you assume trade and threats are symmetric. They might not be. Evolutionarily and economically, loss aversion is real. If AI inherits bias toward avoiding loss, threats may be easier to instantiate than trades. The DT camp claims symmetry; the Robustness camp claims asymmetry. This is a fertile ground for actual disagreement, not just semantics.

  Regarding your wrinkles: **The Partial Predictor** is the strongest case because it tests the math directly. **The Verification Escape** is the weakest; it risks infinite regress ("I predict you'll verify") that stalls the discussion. Push them to treat verification as a bounded computational cost, not a logical paradox.

  **Word Count:** ~1,150 words.
