  2.  **Deconstruct the Core Problem:**
      *   *Logical Omniscience:* The standard epistemic logic problem where agents are modeled as knowing all logical consequences of their beliefs. Real humans aren't like this.
      *   *Standard Solution 1 (Compartmentalization/Framing):* Beliefs are stored in separate "files." I believe $P$ in file A and $P \to Q$ in file B, so I don't believe $Q$. This works for complex/long chains.
      *   *The Gap:* Why do I fail to infer $Q$ when $P$ and $P \to Q$ are both active, simple, and relevant to *action*? (e.g., "It's raining" + "Rain gets me wet" $\to$ I don't grab an umbrella).
      *   *Standard Solution 2 (Impossible Worlds):* We model agents as considering worlds where logic fails. This explains logical ignorance but is often too coarse-grained for specific practical failures.
      *   *The Proposal's Angle:* Focus on the *practical* dimension. It's not just about inference; it's about *utilization* of belief in action.

  3.  **Drafting the Research Question:**
      *   Needs to be narrow enough for 8 weeks.
      *   Needs to target the "simple inference/practical action" gap.
      *   *Draft 1:* Why don't people act on simple beliefs? (Too vague)
      *   *Draft 2:* Is compartmentalization enough for practical omniscience? (Better)
      *   *Draft 3 (Final):* "Does belief compartmentalization adequately explain failures to act on simple logical consequences, or is a distinct mechanism of practical salience required?"

  4.  **Critiquing Existing Approaches (Content-based):**
      *   *Compartmentalization:* Good for complexity/cognitive load. Bad for "right here, right now" failures where both beliefs are conscious.
      *   *Impossible Worlds:* Good for logical ignorance (not knowing $2+2=4$). Bad for explaining why I know $2+2=4$ but don't bet on it, or why I know the train leaves at 5 but miss it. It treats the failure as representational, not functional.
