answer: |-
  So, you're digging into John Taurek's famous claim that "numbers should not count." It's one of those philosophical ideas that feels wrong in your gut but stubbornly holds up under scrutiny. The classic setup is simple: you can save one stranger or five strangers, but not both. Taurek says you shouldn't just save the five because there are more of them. Each person faces the same loss—their own life—so you should flip a coin to give each individual an equal chance of being saved. Summing them up treats the five as a single big block of value, which ignores the separateness of persons.

  It's a compelling view because it respects the individual. But I want to talk about that overlapping scenario you mentioned, because I think it's the stress test that breaks Taurek's logic.

  First, a quick housekeeping note on the math of your setup. You described a five-person group and a one-person group overlapping such that saving the five saves two people in the smaller group. Since a one-person group can't logically contain two people, let's tweak the numbers slightly to make the thought experiment work while keeping your intuition intact. Let's say you have a group of five (A, B, C, D, E) and a group of three (A, B, F). Saving the five saves A and B, who are also in the smaller group. This captures the structural overlap you're aiming for: some people are safe regardless of your choice, while others are only saved depending on which lever you pull.

  Here's why this overlap matters. In the standard Taurek case (1 vs. 5), everyone is at risk. In this overlap case, persons A and B are not at risk—they survive either way. The actual moral conflict isn't between "Group of 5" and "Group of 3." The conflict is strictly between {C, D, E} and {F}. You are choosing whether to save three unique people or one unique person.

  If you stick to Taurek's rule here—flip a coin between the *options*—you give person F a 50% chance of survival. But you also give person C a 50% chance, person D a 50% chance, and person E a 50% chance. By treating the options as equal blocks, you are effectively giving the single person (F) the same moral weight as the three distinct individuals (C, D, E) combined.

  This is where the "equal worth of each life" argument turns against the non-aggregative intuition. Taurek wants to treat everyone equally. But if you flip a coin between the options in this overlap scenario, you aren't treating C, D, and E equally with F. You're privileging F. To give C, D, E, and F truly equal concern, you have to acknowledge that there are three of them on one side and one on the other. Equal concern for individuals demands that you maximize the number of individuals saved when the choice is strictly between them.

  The overlap strips away the distraction of the "group" label. It reveals that aggregation isn't about summing up value like coins in a jar; it's about respecting the count of individuals who have a stake in the outcome. When the shared people are removed from the equation because they're safe either way, refusing to count the remaining numbers amounts to ignoring the extra people. It suggests their presence is morally irrelevant, which contradicts the idea that every life has equal worth.

  Some might argue that this lets aggregation in through a side door—that we're still summing value. But I'd argue it's the front door. We aren't summing "life units"; we are acknowledging that saving three people satisfies three distinct claims to be saved, while saving one satisfies only one. If we believe each claim matters equally, we can't ignore the count. The overlap scenario shows that ignoring numbers doesn't protect individuals; it actually disadvantages the majority of individuals involved in the specific conflict.

  So, does the structural overlap break Taurek's pairwise logic? Yes. It demonstrates that the non-aggregative view relies on the groups being disjoint to maintain its illusion of symmetry. Once you introduce overlap, the symmetry breaks, and the only way to maintain equal concern for each person is to let the numbers count. We shouldn't flip a coin between options; we should weight our choice by the number of unique lives hanging in the balance.

  \answer{Numbers count for equal concern}
