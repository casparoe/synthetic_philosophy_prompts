      **Crane/Skyhook Review Protocol (Form CSRP-4)**

      **1. Mechanical Grounding (0–10 Points)**
      Proposals must identify the machinery responsible for lifting the proposed phenomenon into explanatory view. A crane is defined operationally as a mechanism lowered into place by prior machinery; a skyhook is any lifting device lacking visible support structures. Points are deducted for every component that appears to hang from nothing rather than resting on antecedent physical or logical processes. Reviewers shall inspect the undercarriage of all claims for hidden suspension cables.
      *Sample Comment:* "The account of agency relies on a hook suspended from nothing."

      **2. Regress Termination (0–10 Points)**
      Reviewers must trace the grounding chain of each identified crane to its ultimate origin. If the chain continues indefinitely, the proposal is deemed incomplete due to infinite deferment. If the chain terminates, the terminus must be verified as non-miraculous. Note: A terminus indistinguishable from a skyhook constitutes a grounding failure, as the final crane must have been lowered by something that was not itself lowered.
      *Sample Comment:* "Grounding chain terminates at a brute fact indistinguishable from a hook."

      **3. Disciplinary Relativity (0–10 Points)**
      The status of a mechanism depends on the accumulated design work of the host field. A mechanism accepted as grounded in one department may be classified as a skyhook in another due to variance in baseline expectations. Reviewers should apply the standards of their home discipline while acknowledging that interdisciplinary proposals lack a unified ground. Proposals must satisfy the strictest applicable standard without benefiting from the leniency of adjacent fields.
      *Sample Comment:* "Standard mechanism in Physics; miraculous suspension in Philosophy."

      **4. Explanatory Retention (0–10 Points)**
      Lower-level explanations must not eliminate the higher-level phenomenon unless elimination is the stated goal. Charges of greedy reductionism apply when the explanation succeeds too well at the expense of the phenomenon's reality. Reviewers shall determine if the phenomenon was explained or explained away based on desired ontological outcomes. If the mechanism removes the need for the phenomenon, points are deducted unless the phenomenon was undesirable.
      *Sample Comment:* "Successfully reduces agency to neural firing, thereby explaining it away."

      **5. Emergent Integrity (0–10 Points)**
      Proposals invoking emergence must demonstrate that the emergent property is not a skyhook reintroduced under new terminology. Sui generis normativity or brute systemic facts shall be scrutinized for hidden lifting machinery. Holistic accounts must not refuse mechanism only to invoke ungrounded lift. If the emergent property performs work without consuming energy or information, it is classified as a hook disguised as a system effect.
      *Sample Comment:* "Normativity invoked as sui generis lift without mechanistic purchase."

      **Appeals and Adjudication**
      In cases where a proposal is penalized simultaneously for greedy reductionism (Criterion 4) and insufficient mechanistic grounding (Criterion 1), the score shall be nullified. Given that all cranes ultimately rest on ungrounded terminae (Criterion 2) and all emergence risks hidden hooks (Criterion 5), no proposal can achieve a passing score without violating at least one disciplinary standard (Criterion 3). Consequently, all submissions are hereby classified as Mechanically Indeterminate. Funding decisions will be deferred until a meta-mechanism for evaluating grounding mechanisms is established, grounded, and verified as non-miraculous. Until such machinery is lowered into place, the fund remains in suspended animation.

