answer: |-
  This is a spicy package. It's got a radical sortition core wrapped in some pretty standard institutionalist constraints. You're right to sniff out the friction; some of these are genuine contradictions, while others are just awkward phrasing.

  Here's the breakdown of the tensions, ranked by how much they'll hurt you in a reading group, followed by the literature landscape.

  ### 1. The "Career Politician" Contradiction (Severity: Fatal)
  **The Clash:** (1) & (2) vs. (3)
  You propose abolishing the career path in the legislature (via sortition and no re-selection) and capping it everywhere else (10-year limit), but then claim career politicians are *essential* for accountability.
  **Why it hurts:** This isn't just friction; it's a logical contradiction. If accountability requires a "stable target for blame" (a careerist who wants to be re-elected), your system removes the target. A sortitive pod member has no future election to lose, so the standard "retrospective voting" accountability mechanism you describe in (3) doesn't exist for them.
  **Cheapest to drop:** **Drop (3).**
  It's the outlier. Your system is designed to *break* the careerist model. Trying to justify it with careerist theory will confuse everyone. Instead, argue that accountability shifts from "voter punishment" to "peer monitoring" or "recall mechanisms." There's plenty of literature on sortitive accountability that doesn't rely on re-election incentives.
  **Settled vs. Contested:**
  *   **Contested:** Whether career politicians actually improve accountability. Some say yes (they learn the ropes, voters know their record); others say no (they become captured by donors, focus on short-term polling).
  *   **Settled:** That sortition removes the re-election incentive. That's a feature, not a bug, in sortition theory.

  ### 2. The Competence Double-Standard (Severity: High)
  **The Clash:** (4) vs. (5)
  You claim legitimacy is *purely* procedural (fairness of selection), yet you keep elections for city councils because random citizens lack *expertise*.
  **Why it hurts:** If legitimacy is *only* about the fairness of the draw (4), then a random city council is just as legitimate as an elected one. By invoking "expertise" to justify elections locally (5), you admit that competence *does* matter for legitimacy or at least for functional design. If competence matters locally, why doesn't it matter nationally? It makes (4) look like an oversimplification.
  **Cheapest to drop:** **Modify (4).**
  "Pure proceduralism" is a hard sell. It's cheaper to argue that legitimacy is *primarily* procedural, but functional competence is a secondary constraint. Or, flip it: keep (4) pure and argue local councils should *also* be sortitive (drop 5), but that's a bigger policy pivot. For a reading group, admitting that competence plays a role (nuancing 4) is safer than defending a hard line that you immediately violate in (5).
  **Settled vs. Contested:**
  *   **Contested:** Whether democracy is about fair process (proceduralism) or good outcomes (epistemic democracy).
  *   **Settled:** That local governance often involves more administrative/technical detail than national legislation (though whether elections are the best way to secure that expertise is still debated).

  ### 3. Recall vs. Procedural Fairness (Severity: Low/Dissolves)
  **The Clash:** (1) vs. (4)
  You worry that recalling a pod member for missing sessions violates "pure procedural" legitimacy.
  **Why it dissolves:** This tension mostly vanishes on inspection. Procedural legitimacy usually includes the rules of the game, not just the selection method. If the "procedure" includes an attendance clause, enforcing it isn't a violation of fairness; it's upholding the procedure. As long as the recall isn't based on *how* they voted (which would be substantive), but just on *showing up* (which is administrative), it fits within a procedural framework.
  **Cheapest to drop:** **Keep both.**
  You don't need to drop anything here, just clarify your definition. Specify that recall is for *procedural failure* (attendance), not *political performance*.
  **Settled vs. Contested:**
  *   **Settled:** Recall mechanisms are generally viewed as procedural safeguards, not violations of democratic fairness, provided they aren't weaponized for partisan removal.

  ### 4. Sortition vs. Term Limits (Severity: None/Dissolves)
  **The Clash:** (1) vs. (2)
  You asked if these conflict. They don't.
  **Why it dissolves:** (1) creates a sortitive legislature (not elected). (2) places limits on *elected* office. Since the national legislators aren't elected, the term limit doesn't apply to them anyway. They have a hard 18-month limit by design. The 10-year limit would apply to mayors, governors, or presidents (if you keep those).
  **Cheapest to drop:** **N/A.**
  No conflict exists. Just be clear in your presentation that the 10-year cap applies to the executive branch and local elected roles, while the legislature is capped by the sortition mechanism itself.

  ---

  ### Literature Landscape: What's Safe to Say?

  When you present this, you want to know where you're stepping on toes versus walking on solid ground.

  **1. Sortition as a Legislature Replacement**
  *   **Status:** **Genuinely Contested / Fringe.**
  *   **The Vibe:** Using citizens' assemblies for *advisory* roles is gaining traction (OECD countries do this now). Replacing the entire legislature with sortition is still considered radical political theory. Don't present this as "the next step everyone agrees on." Frame it as "the logical conclusion of democratic equality."

  **2. Term Limits**
  *   **Status:** **Genuinely Contested.**
  *   **The Vibe:** Political science is mixed. Some evidence says it reduces corruption; other evidence says it shifts power to unelected bureaucrats (because the electeds are too new to know what's happening). Since you're combining term limits with sortition, you're betting that the bureaucrats won't take over. Be ready for that question.

  **3. Career Politicians & Accountability**
  *   **Status:** **Genuinely Contested.**
  *   **The Vibe:** The "career politician" is a dirty word in public discourse but often defended in academic literature as necessary for institutional memory and accountability. Since you are dropping commitment (3), you align with the "anti-careerist" camp. Just acknowledge the other side exists (that amateurs can be easily manipulated).

  **4. Procedural vs. Epistemic Legitimacy**
  *   **Status:** **Genuinely Contested.**
  *   **The Vibe:** This is a classic philosophical fight. Pure proceduralists (like some readings of Rousseau) say the fair will is all that matters. Epistemic democrats say democracy is valuable because it makes *better decisions*. Your package wobbles here (see Tension #2). Acknowledging this debate will make you look sharp.

  ### Summary Advice for the Reading Group
  1.  **Kill (3).** It contradicts the soul of your proposal. Replace it with a theory of accountability based on transparency and recall, not re-election.
  2.  **Soften (4).** Don't say competence *never* matters. Say selection fairness is the *primary* source of legitimacy, but functional constraints (like local expertise) can justify exceptions.
  3.  **Clarify (1) vs (2).** Explicitly state that term limits apply to elected executives, while sortition limits apply to legislators.
  4.  **Own the Radicalism.** Don't apologize for the sortition piece. It's the most interesting part. The friction comes from trying to bolt standard institutionalist views (careerism, term limits) onto a post-electoral system. Lean into the post-electoral logic.

  If you make those tweaks, the package holds together much better. Good luck.
