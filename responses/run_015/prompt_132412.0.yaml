  ok so i want to check if my democratic-reform views hang togther before i present them at the reading group. here's the package: (1) replace the national legislature with staggered 18-month sortitive pods—random citizens, no re-selection, but their home block can recall them for missing sessions (feels niche but i like it). (2) hard 10-year cumulative term limit for anyone in elected office, any level. (3) career politicians are essential for accountability; voters need stable targets for blame. (4) democratic legitimacy is purely procedural—fair selection is all that matters, competence doesn't enter in. (5) keep direct elections for city councils because local governance needs sepecific expertise random citizens won't have.

