          *   *Motivation:* Practical reasoning requires comparing past, present, and future pleasures. If they aren't measurable on a scale, maximization is impossible.
      *   *Desideratum 5: Holism/Compound Experiences.*
          *   *Motivation:* Drinking wine while discussing philosophy. Is it two pleasures or one fused pleasure? The theory must handle fusion, not just addition.
      *   *Desideratum 6: Retrospective Valence Drift (The Niche Constraint).*
          *   *Motivation:* As requested. Sometimes a painful experience is remembered fondly (e.g., "the hard climb"), or a pleasant one remembered bitterly. The theory of pleasure must explain why the *hedonic value* itself seems to shift in memory, not just that memory is faulty.
      *   *Desideratum 7: The Aggregation Tension.*
