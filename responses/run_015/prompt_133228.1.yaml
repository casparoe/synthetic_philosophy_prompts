      *   *Desideratum 2: Normative Neutrality (The Malice/Aesthetic Constraint).*
          *   *Motivation:* Hedonism usually claims pleasure is *the* good. But malicious pleasure is bad. The theory of *what pleasure is* shouldn't depend on *whether it's good*. It must distinguish the hedonic quality from the moral quality.
      *   *Desideratum 3: Modal Diversity (Sensory/Intellectual/Anticipatory).*
          *   *Motivation:* A smell isn't a thought. A hope isn't a sensation. The theory must cover all without reducing one to the other.
