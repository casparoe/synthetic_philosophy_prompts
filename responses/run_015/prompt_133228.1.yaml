answer: |-
  ### Desiderata for an Adequate Account of Hedonic Unity

  To resolve the heterogeneity problem, a theory of pleasure must specify a common property that is neither so thin as to be trivial nor so thick as to exclude paradigmatic cases. The following seven desiderata outline the conceptual boundaries within which a viable theory must operate.

  #### 1. The Common Denominator Requirement
  **Specification:** The account must identify a single natural or functional property shared by all positive hedonic tokens, from the relief of sunburn to the satisfaction of a proof.
  **Motivating Pressure:** If no common property exists, "pleasure" is merely a homonym, and hedonism collapses as a normative theory because there is no single *thing* to maximize. However, the property cannot be a specific qualitative feel (a "tingle"), as the sunburn and the proof lack a shared sensory signature. The theory must locate unity without imposing artificial phenomenological uniformity.

  #### 2. The Axiological Independence Requirement
  **Specification:** The definition of pleasure must remain neutral regarding the moral or aesthetic worth of the object of pleasure.
  **Motivating Pressure:** Consider the pleasure taken in malicious gossip. If the theory defines pleasure such that it entails moral goodness, malicious pleasure becomes an oxymoron, rendering hedonism tautological or false. Conversely, if the theory defines pleasure via its representational content (e.g., "pleasure is the feeling that something is good"), it risks collapsing the hedonic state into a moral judgment. The account must distinguish the *hedonic quality* of the experience from the *value of its object*, allowing for base pleasures to be genuinely pleasurable yet morally repugnant.

  #### 3. The Modal Scope Requirement
  **Specification:** The account must accommodate sensory, intellectual, and anticipatory pleasures without reducing one modality to another.
  **Motivating Pressure:** The coolness on sunburnt skin is sensory and present-oriented; the resolution of a complex proof is intellectual and often retrospective; the anticipation of a holiday is future-oriented. A theory that reduces intellectual pleasure to "subtle sensory feelings" fails phenomenological scrutiny. A theory that reduces sensory pleasure to "satisfied desires" risks losing the immediacy of the sensation. The common property must be modality-invariant.

  #### 4. The Intertemporal Commensurability Requirement
  **Specification:** The account must render distinct pleasures comparable on a single scalar metric to facilitate diachronic practical reasoning.
  **Motivating Pressure:** For hedonism to guide action, an agent must be able to weigh the fleeting pleasure of a meal against the enduring pleasure of a career achievement. If the heterogeneity of pleasures is so deep that they are incommensurable (like length vs. weight), aggregation is impossible. The theory must explain how radically different experiences can be assigned values that allow for trade-offs and summation over a lifetime.

  #### 5. The Phenomenal Fusion Requirement
  **Specification:** The account must explain compound experiences where distinct hedonic sources appear fused rather than merely co-occurring.
  **Motivating Pressure:** When tasting a wine while discussing philosophy, the gustatory and cognitive satisfactions often merge into a single complex state of enjoyment. If the theory treats these as merely two distinct pleasures happening simultaneously, it fails to capture the holistic phenomenology of the moment. The account must explain how heterogeneous elements integrate into a unified hedonic token without losing their individual contributions to the whole.

  #### 6. The Retrospective Valence Drift Requirement
  **Specification:** The account must explain why the hedonic quality of an experience, as remembered and integrated into a life narrative, can systematically diverge from its immediate phenomenological quality, without treating this divergence as a mere memory error.
  **Motivating Pressure:** Standard theories treat memory distortion as an external failure of recall. However, agents often report that a difficult, painful experience (e.g., a rigorous climb) becomes *more* positively valenced in retrospect, while a shallow, easy pleasure fades or sours. This drift is not random decay; it is systematic. An adequate theory must treat the hedonic value of an experience as partially constituted by its temporal integration. If pleasure is strictly a momentary feel, this drift is inexplicable error. If pleasure is partly constituted by its role in a narrative, the "drift" reveals the true hedonic value rather than distorting it. The theory must internalize this temporal dimension.

  #### 7. The Heterogeneity-Metric Tension (Critical Flag)
  **Specification:** The theory must acknowledge that Desideratum 1 (Common Denominator) and Desideratum 3 (Modal Scope) appear jointly unsatisfiable with Desideratum 4 (Intertemporal Commensurability).
  **Motivating Pressure:** This is the core impasse. To satisfy Modal Scope and Phenomenal Fusion, one must acknowledge deep phenomenological heterogeneity. To satisfy Intertemporal Commensurability, one requires a homogeneous metric. If the common property is abstract enough to cover all modalities (e.g., "attitude of favoring"), it risks becoming unmeasurable. If it is concrete enough to be measured (e.g., "intensity of feeling"), it excludes non-sensory pleasures. A successful theory must either dissolve this tension by redefining measurement or accept a pluralistic metric that challenges classical aggregation.

  ***

  ### Brief Theoretical Assessment

  **Phenomenal-Character Theories:** These posit a distinctive "feel" common to all pleasures. They struggle significantly with the **Modal Scope Requirement**, as they must argue that intellectual and sensory pleasures share a specific qualitative tone, which many find phenomenologically implausible. They also fail the **Retrospective Valence Drift Requirement**, as they locate pleasure strictly in the immediate experience, rendering retrospective changes as mere memory errors rather than internal valence shifts. They satisfy **Commensurability** well if intensity is the metric, but only at the cost of **Axiological Independence** if the "feel" is tied to goodness.

  **Desire-Satisfaction Accounts:** These define pleasure as the sensory experience of a desire being satisfied. They handle **Modal Scope** well, as any desire can be satisfied. However, they struggle with **Axiological Independence**, as it becomes difficult to distinguish the pleasure of malicious gossip from the satisfaction of a non-hedonic desire (e.g., the desire to be right). They face severe difficulties with **Phenomenal Fusion**, as it is unclear how two satisfied desires fuse into one experience. They generally fail the **Retrospective Valence Drift Requirement** because the satisfaction event is binary (satisfied/unsatisfied) at a specific time, making the *value* of the pleasure static.

  **Attitudinal Theories:** These define pleasure as a pro-attitude (taking enjoyment in) toward a state of affairs. They excel at **Modal Scope** and **Axiological Independence**, allowing any state to be the object of enjoyment. They handle **Phenomenal Fusion** reasonably well by allowing complex objects of attitudes. However, they face the steepest challenge regarding **Intertemporal Commensurability**; it is unclear how to measure the "strength" of an attitude across different types of objects to allow for aggregation. They are best positioned to handle **Retrospective Valence Drift**, as attitudes can be revised over time, potentially allowing the *history* of the attitude to constitute the pleasure's value, though this risks detaching pleasure entirely from immediate experience.
