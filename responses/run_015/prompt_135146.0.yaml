      *   **Specific Plot Points:**
          *   Clerks encounter the proposition $p \land \neg Kp$ (p is true but unknown).
          *   Branch offices file exemptions based on actual philosophical repairs to Fitch's argument:
              1.  Restricting to Cartesian truths (truths that can survive being known).
              2.  Restricting language (no knowledge operator in the object language).
              3.  Suspending distribution of knowledge over conjunction ($K(p \land q) \to Kp \land Kq$).
              4.  Abandoning bivalence (cost-saving measure).
          *   **Constraint 1:** No one names the argument (Fitch's Paradox) or explains it. They just administer it. The reductio should land in a closing footnote/circular making the Office's own status unstateable.
          *   **Constraint 2:** Include one quoted reaction from an outside party (Metaphysical Realist Society) who is delighted because the Office proved some truths are unknowable.
          *   **Tone:** Deadpan civil-service register.
          *   **Length:** Around 700 words.
          *   **Format:** Numbered Q&A, memo headers, reference numbers.

  2.  **Deconstruct the Logic (Fitch's Paradox):**
      *   Knowability Principle (KP): $\forall p (p \to \diamond Kp)$ (All truths are knowable).
      *   Non-Omniscience (NO): $\exists p (p \land \neg Kp)$ (There is some unknown truth).
      *   Substitution: Let $p$ be $(q \land \neg Kq)$.
      *   If $(q \land \neg Kq)$ is true, then by KP, it is knowable: $\diamond K(q \land \neg Kq)$.
      *   If someone knows $(q \land \neg Kq)$, then $Kq \land K(\neg Kq)$.
      *   $K(\neg Kq)$ implies $\neg Kq$ (factivity).
      *   Contradiction: $Kq \land \neg Kq$.
      *   Conclusion: If KP is true, NO is false. All truths are known.
      *   The prompt wants the bureaucracy to hit this wall and try to patch it using philosophical solutions (restriction strategies, intuitionistic logic, etc.).

  3.  **Drafting - Section by Section:**

