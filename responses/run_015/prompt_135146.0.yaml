  **DEPARTMENT OF EPISTEMIC AFFAIRS**
  **Office of Knowability Compliance**
  **MEMORANDUM 89-B**

  **TO:** All Regional Branches
  **FROM:** Central Adjudication
  **DATE:** 14 October
  **SUBJ:** Form K-1 Certification Protocols and Clause 1 Exceptions

  **1. Q: We have received a Form K-1 for a proposition of the form "p is true, but p is not known." Can we certify this?**
  **A:** No. Under Clause 1 of the Knowability Act, all truths are knowable. However, certification constitutes knowledge. If the Office certifies the proposition, it becomes known. If it becomes known, the second conjunct ("p is not known") becomes false. If the conjunct is false, the proposition is false. The Office cannot certify false propositions. Please return to sender with code "SUBSTITUTION-INSTANCE-ERROR."

  **2. Q: Branch 4 is requesting an exemption for propositions that change truth-value upon observation. Is this permissible?**
  **A:** Approved. Effective immediately, the Act applies only to "Cartesian" truths—propositions stable under the operator of knowledge. Propositions susceptible to verification-induced falsification are hereby classified as Non-Compliant Truths. Staff are reminded that classifying a truth as "Non-Compliant" implies it is a truth that cannot be known. Please ensure this classification does not violate Clause 1.

  **3. Q: Legal advises that the Act itself contains epistemic operators. Does this violate the syntactic restriction proposed in Memo 88-A?**
  **A:** This is under review. Memo 88-A suggests Clause 1 applies only to truths statable in a language lacking knowledge operators. However, the Act is drafted in a language containing knowledge operators. Consequently, the Act may not apply to itself. Until further notice, assume the Act is valid but unstateable. Do not discuss this distinction in writable channels.

  **4. Q: An applicant has submitted a conjunction for certification but refuses to certify the conjuncts individually. They cite the suspension of distribution.**
  **A:** Correct. Per Directive 77, the rule that knowledge distributes over conjunction ($K(p \land q) \to Kp \land Kq$) is suspended for cost-saving measures. You may stamp the conjunction without stamping the parts. Be advised: Branch 9 attempted to certify "All truths are known and some truths are unknown" as a single conjunction. This resulted in a logical containment breach. Do not allow contradictory conjuncts unless wrapped in a single administrative envelope.

  **5. Q: Backlogs are increasing. Can we suspend the Law of Excluded Middle to reduce the volume of true propositions?**
  **A:** Yes. Transition to Intuitionistic Protocol is authorized. Propositions need not be strictly true or false; they may be "pending construction." This reduces the number of truths requiring certification by eliminating those lacking constructive proof. Note: This implies the truth of the Act itself is currently pending construction. Proceed with caution.

  **6. Q: How should we respond to media inquiries regarding the backlog?**
  **A:** Refer them to the Metaphysical Realist Society. Their spokesperson issued the following statement yesterday:

  > "We are delighted. The Office's inability to certify unknown truths confirms our long-held position: reality exceeds cognitive capture. There are mind-independent truths that no bureaucracy can know. The Knowability Act has inadvertently proved Realism correct. We thank the Department for this concession."

  **7. Q: Is the Office of Knowability Compliance itself a known entity?**
  **A:** See Footnote 1.

  ***

  *Footnote 1: If the Act is valid, all truths are known. If all truths are known, there are no unknown truths for the Office to process. If there are no unknown truths, the Office has no function. If the Office has no function, the truth of its existence is functionally null. Staff are advised not to inquire into the ontological status of their own employment contracts, as verifying them may render them void.*
