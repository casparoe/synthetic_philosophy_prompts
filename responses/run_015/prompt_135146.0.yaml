      *   No "Fitch's Paradox." Just "the Substitution Instance," "the Clause 1 Conflict," etc.
      *   The humor comes from treating logical impossibilities as administrative hurdles.

  5.  **Drafting - Content Check:**
      *   *Word Count:* Need to aim for ~700.
