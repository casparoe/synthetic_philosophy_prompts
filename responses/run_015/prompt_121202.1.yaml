answer: |-
  Here is a sharpening of your reading, an assessment of the "cheat," and the practical materials for your session.

  ### Sharpening and Dismantling the Reading

  **1. The Grafted Conscience: Process vs. Product**
  You are right to identify the tension between Darwin's functional account of morality and the historical requirement of descent. Darwin argues in the *Descent* that the moral sense arises because social instincts, aided by intellect and habit, become hereditary. He implies that the *stability* of the moral sense depends on that heredity.
  *   **Sharpening:** Frame the Beast Folk not as having a "grafted conscience" but as having **simulated morality without sympathy.** Darwin insists the root of the moral sense is *sympathy* (social instinct), reinforced by reason and habit. The Beast Folk have the habit (the Law) and the reason (language), but they lack the instinct. They obey out of fear of the House of Pain, not out of concern for the tribe.
  *   **Dismantling:** Your reading suggests Darwin might value the *history* for moral status. Darwin is largely a functionalist; if a behavior aids the community's survival, it is morally good. However, he would argue the Beast Folk's morality *fails functionally* because it isn't heritable. It collapses immediately when the enforcer dies. So, Darwin doesn't need the history for *status*; he needs it for *durability*. The novel proves that a conscience without deep evolutionary roots is fragile.

  **2. The Asymmetry: Morality vs. Religion**
  You ask if the novel vindicates Darwin's asymmetry (naturalizing morality preserves it; naturalizing religion undermines it).
  *   **The Verdict:** The novel radicalizes Darwin's skepticism. For the Beast Folk, "religion" (the Law/Moreau) and "morality" (prohibitions) are identical and both are utterly debunked by the death of the creator. There is no asymmetry for them; both vanish.
  *   **Prendick's Role:** The asymmetry only survives in Prendick. He loses the "religion" (belief in Moreau's divinity) but retains a "moral" horror. However, note that his horror is not a social instinct; it is isolation. He cannot join human society because he sees the beast in them. This suggests that knowing the *natural history* of man (that we are beasts) destroys the *social fiction* required for human morality. Wells is more pessimistic than Darwin: Darwin thinks knowing our animal origin humbles us but leaves ethics intact; Wells suggests it makes community impossible.

  **3. The Honest Part: Is This the Wrong Book?**
  You are worried that the lack of heredity makes this non-Darwinian.
  *   **Don't change the book.** Change the framing. This is not a simulation of evolution; it is a **reductio ad absurdum of Intelligent Design.** Moreau is a cruel, incompetent deity trying to force a result that nature achieves slowly.
  *   **The Utility:** Use the "cheat" as the discussion point. Darwin says morality requires generations of selection to become instinct. Moreau tries to compress this into weeks via surgery and conditioning. The failure of the Beast Folk validates Darwin's claim: you cannot shortcut the deep time required to make a moral animal. The novel argues that *time* is a moral ingredient. If you skip the descent, you don't get the man.

  ### Practical Session Plan (90 Minutes)

  Since the group has read the novel but not Darwin, your job is to supply the Darwinian lens briefly, then let the text do the work. Spend the first 15 minutes outlining Darwin's two claims (Morality = Social Instinct + Intellect; Religion = Cognitive Byproduct). Then move to the text.

  **Handout: Three Scenes**
  *Describe these scenes briefly on the handout so students can locate the thematic weight without needing quotes.*

  1.  **The Chanting of the Law:** The scene where the Beast Folk gather to recite their prohibitions. Focus on the rhythm, the repetition, and the fear of the "House of Pain." This mirrors Darwin's account of moral rules becoming fixed habits, but note the source of the authority is external pain, not internal sympathy.
  2.  **Moreau's Explanation:** The moment Moreau explains to Prendick that he is reshaping plastic living matter, fighting the "stubborn beast flesh." This highlights the artificiality of the process. Contrast this with Darwin's view of slow, accumulative change. Moreau treats the body as clay; Darwin treats it as a lineage.
  3.  **Prendick in London:** The ending where Prendick returns to civilization but can no longer see humans as fully human, retreating to solitude and chemistry. This tests the "religious feeling." The object of worship (Moreau) is dead, the Law is broken, yet Prendick carries a permanent scar of belief/knowledge.

  **The Point Where You Are Definitely Wrong**
  You suggest the Beast Folk possess "social instincts." They do not.
  *   **Correction:** In Darwin's framework, social instinct is the *foundation* of morality; it is the genuine desire for the company and approval of others. The Beast Folk have no desire for each other; they are solitary creatures forced into a crowd. Their "society" is a collection of individuals all looking at the same whip. If you build your session on the idea that they have Darwinian social instincts, the argument will collapse. They have **conditioned compliance**, which Darwin would distinguish sharply from **moral sense**. The reversion happens precisely because the social instinct was never there to hold the shape.

  **The Single Discussion Question**
  *"Darwin argues that the difference between human and animal morality is one of degree, not kind. Wells presents creatures who behave like humans but were made like animals. If the behavioral output is identical, does the origin of that behavior matter for their moral status?"*

  (This forces them to choose between Darwin's functionalism—if they act moral, they are moral—and Wells's essentialism—if they aren't born human, the morality is a sham.)
