      *   *Better fix:* Change the line slightly to "escalation of commitment" or acknowledge the kinship. But if the editor *insists* on the line, I need to show how (1) can stand.
      *   *Actually:* The prompt says "Editor insists the classic lab demo goes in... I'd like to keep that line [cleanest illustration of sunk-cost fallacy] if I can."
