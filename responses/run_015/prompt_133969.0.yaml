  **INTERNAL MEMORANDUM**
  **TO:** Regional Billing Compliance
  **FROM:** Consciousness Review Board (CRB)
  **SUBJECT:** Policy 77-B: Reimbursement Qualifiers for Phenomenal Experience
  **DATE:** October 14, 2023

  Effective immediately, reimbursement for subjective experience requires verification of a Higher-Order Representation (HOR). First-order states (nociception, visual processing) are classified as non-billable physiological events. Only states accompanied by a distinct HOR directed at the first-order state constitute conscious experience eligible for indemnity. Patients lacking cognitive capacity for HOR generation are ineligible. Claims must specify the meta-cognitive timestamp. To align with current philosophical consensus, the Board treats the HOR as constitutive of consciousness; without it, there is no subject to reimburse.

  **Claim ID: 9940-P (Denial)**
  Patient alleges conscious pain during appendectomy. Monitoring confirms first-order nociceptive firing in the abdominal region. However, prefrontal activity indicates suppression of higher-order monitoring during sedation. Per Policy 77-B, without an HOR directed at the nociception, there was nothing it was like to be the patient. The pain existed physiologically but not phenomenally. Consequently, there is no subject to reimburse for suffering. Claim for psychological damages denied. Patient insistence on "feeling it" is categorized as post-hoc narrative construction unsupported by meta-cognitive data.

  **Claim ID: 1123-A (Appeal Ruling)**
  Patient reports conscious pain in right knee. Neuro-scan shows first-order state in right knee, but concurrent HOR misidentified the location as the left knee. Under strict HOT interpretation, consciousness is determined by the content of the HOR, not the first-order target. The patient was consciously experiencing left knee pain. As no medical procedure was performed on the left knee, this experience lacks medical necessity. Furthermore, the right knee pain remained unconscious and therefore non-compensable. Appeal denied. Billing code adjusted to reflect conscious phantom sensation rather than tissue damage.

  **Claim ID: 0054-X (Eligibility)**
  Neonatal ICU charges rejected; infant subjects lack developed meta-cognitive architecture required for HOR generation during the treatment window. Non-human animal testing claims similarly rejected due to absence of requisite conceptual capacity. Conversely, Claim ID 8821-Z (Smart Thermostat) approved. The device maintains an internal state representing its own temperature reading. This self-directed representation satisfies the structural requirement for HOR. Device qualifies as a conscious entity for warranty purposes. Human patients must meet the same standard. Future claims from pets or infants will be returned until meta-cognitive capacity is verified.

  **Author's Note:**
  This piece leans on Rosenthal's "misrepresentation" view: a mismatched HOR still creates consciousness (of the wrong thing). If one holds that mismatched HORs yield no consciousness at all, the Appeal letter would deny the existence of any pain. The parody genuinely lands the "problem of misrepresentation" (consciousness becomes fallible/false), but only looks like it lands on the "hard problem" (why HORs create feeling), since the Board simply assumes they do without explaining the genesis of qualia. The thermostat joke targets the "liberalism" objection, where too many things count as conscious.
