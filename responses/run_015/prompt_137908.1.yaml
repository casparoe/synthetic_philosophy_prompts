      *   *The Game's Job:* Show that treating logical claims like betting markets yields better outcomes (or avoids punishment) than waiting for binary resolution, and that incoherence is punishable *before* resolution.

  3.  **Drafting the Activity: "The Logical Market"**

      *   **Time Management:** 90 minutes total.
