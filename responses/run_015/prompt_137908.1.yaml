answer: |-
  Here is a complete run-sheet for a 90-minute session designed to vindicate your position through practice rather than lecture. It is built to be run with minimal prep but maximum philosophical payload.

  # Activity: The Logical Market

  **Objective:** To demonstrate that logical coherence and anticipatory pricing have value independent of binary truth-resolution, and that bounded agents are punished for incoherence even when the truth is fixed.
  **Time:** 90 minutes.
  **Participants:** 14 (Traders), 1 (You, as Market Maker & Arbiter), 1 (Troll — recruit a confident student beforehand).
  **Materials:** Whiteboard (for order book), printed "Order Slips", printed "Prediction Slips", a laptop (for you to verify claims), timer.
  **Currency:** "Logic Points" (LP). Start everyone with 100 LP.

  ---

  ## 1. Setup & Rules (15 Minutes)

  **The Pitch:**
  Tell the group they are traders in a market for mathematical truth. Unlike a normal prediction market, the outcomes here are fixed by logic *now*, but unknown to the traders. The goal isn't just to be right at the end; it is to remain solvent and coherent *during* the process.

  **The Mechanics:**
  1.  **Trading:** Traders submit limit orders (Buy/Sell at Price X) on specific claims. Orders are public on the whiteboard.
  2.  **Settlement:** Claims settle at 1 LP (True) or 0 LP (False) at a designated time.
  3.  **The Arbitrage Rule (Crucial):** As Market Maker, you monitor the book. If a trader's standing orders violate logical coherence (e.g., $P(A) + P(\neg A) \neq 1$, or $P(A) > P(B)$ where $A \implies B$), you reserve the right to execute a "Dutch Book" against them instantly. You buy the underpriced asset and sell the overpriced one, netting a risk-free profit from *their* LP stash. **This tax happens immediately, regardless of whether the claim is resolved.**
  4.  **Unresolved Claims:** Any claim not resolved by the end of the session is cashed out at the *final market price*. This rewards providing a good estimate even without proof.

  **The Prediction Slip (Requirement iii):**
  Before trading starts, hand out a slip. Ask everyone to write down:
  *   Their opening price on **Claim 2** (see below).
  *   Their predicted price on **Claim 2** at the 40-minute mark.
  *   *Incentive:* 10 bonus LP if their actual trading behaviour matches their predicted update (i.e., if they said they'd move to 0.8, they must hold 0.8 at T+40).

  ---

  ## 2. The Claims (Requirement i)

  Write these on the board. Do not reveal the settlement times yet, just the "Expected Resolution Window".

  *   **Claim A (The Warm-up):** "The sum of the digits of $2^{10}$ is divisible by 3."
      *   *Truth:* False ($1024 \rightarrow 7$).
      *   *Resolution:* T + 5 mins. (Hand calculation).
      *   *Purpose:* Gets blood flowing, establishes the settlement mechanic.
  *   **Claim B (The Grind):** "The 100th digit of $\pi$ (after the decimal) is even."
      *   *Truth:* Fixed (It's 9, so False).
      *   *Resolution:* T + 30 mins. (Requires laptop lookup or tedious algorithm).
      *   *Purpose:* This is where you show **anticipatory drift**. People should move prices as they attempt calculation or gauge others' confidence, *before* the laptop result.
  *   **Claim C (The Black Box):** "Does the following Python script halt within 500 steps?" (Provide a snippet on the handout that runs a simple loop with a non-obvious exit condition).
      *   *Truth:* You know (run it beforehand).
      *   *Resolution:* **Never during session.**
      *   *Purpose:* Tests pricing without resolution. Cashed out at final market price.
  *   **Claim D (The Self-Ref):** "The median trading price of Claim B at T + 30 mins will be greater than 0.5."
      *   *Resolution:* T + 30 mins.
      *   *Purpose:* Forces them to model the market's epistemology, not just the maths.

  ---

  ## 3. The Run-of-Show

  **T + 0 to 20 mins: Phase 1 (Open Market)**
  *   Trading opens on Claims A, B, C, D.
  *   **Action:** Be an active Market Maker. If someone puts a bid on Claim A at 0.9 and an ask at 0.2, call it out. Execute the arbitrage. Take 5 LP from them. Announce: *"Logical incoherence tax applied."*
  *   **Claim A Settles:** At T+20. Pay out winners. This validates the system.

  **T + 20 to 50 mins: Phase 2 (The Troll & The Drift)**
  *   **The Troll Enters (Requirement ii):** Your recruited student stands up. They introduce **Claim E**: "There are an odd number of vowels on the whiteboard right now."
      *   *Constraint:* This is decidable instantly by counting, but it distracts from the maths.
      *   *Purpose:* Shows that a bounded reasoner must allocate attention. If everyone ignores it, the price stays 0.5. If one person counts, they can clean up.
      *   *Settlement:* Immediate.
  *   **Focus on Claim B:** Remind everyone Claim B settles soon. Watch the prices.
      *   *Ideal Outcome:* Prices shouldn't jump from 0.5 to 0/1 at the reveal. They should drift as people whisper calculations or see others betting heavily.
  *   **Claim D Settles:** Check the median price on the board history.

  **T + 50 to 70 mins: Phase 3 (The Crunch)**
  *   **Claim B Settles:** Reveal the digit. Pay out.
  *   **Discussion Point:** Ask those who moved their price *before* the reveal why they did so. Did they have a proof? No. Did they have a reason? Yes. That is logical uncertainty.
  *   **Claim C Valuation:** Announce Claim C will not resolve. Final prices are cashed out.
      *   *Payoff:* If the market price is 0.7, holders get 0.7 LP per share. This punishes those who refused to price it because "it's unknown".

  **T + 70 to 90 mins: The Debrief**

  ---

  ## 4. The Debrief Script

  Do not lecture. Ask questions and map their answers to the theory.

  **1. The Arbitrage Tax (Coherence vs. Truth)**
  *   *Ask:* "Who lost points to me without a single claim being resolved?"
  *   *Point:* This addresses your mate's objection. You were taxed not because you were wrong about the *world* (or the maths), but because your *prices* were incoherent. Logical omniscience says you're fine as long as you eventually believe the truth. This game shows you go bankrupt *before* you find the proof if your priors are incoherent. Coherence is a constraint on the *process*, not just the output.

  **2. The Drift on Claim B (Anticipation)**
  *   *Ask:* "Look at the history of Claim B's price. Did it jump straight to 0 or 1 at the end?"
  *   *Point:* If it drifted, that is logical induction. You were pricing the *likelihood of finding a proof*, not just the truth value. Your mate says uncertainty is just "time to compute". But the market price aggregated partial computations (someone checked the first 50 digits, someone else ran a heuristic). The price contained information *before* the proof was complete. That is the value of logical uncertainty.

  **3. The Unresolved Claim C (Boundedness)**
  *   *Ask:* "Who refused to trade on Claim C because it never resolved?"
  *   *Point:* In the real world, we never have the limit. We never have infinite time. If you refuse to price something because you can't prove it, you forfeit utility. The Logical Induction framework says a good reasoner must have a price on everything, even undecidable (within bounds) sentences, because you still have to act.

  **4. The Troll (Attention Costs)**
  *   *Point:* The Troll claim was trivial but costly to notice. A logically omniscient agent knows the vowel count instantly. You had to choose between counting vowels and calculating $\pi$. Logical uncertainty is fundamentally about resource allocation.

  ---

  ## 5. Predictable Failure Modes (And how to handle them)

  **1. Liquidity Drying Up**
  *   *Risk:* Students are shy. The board stays empty.
  *   *Fix:* You act as the "House". Post initial bid/ask spreads (e.g., Buy 0.4 / Sell 0.6) on everything to get the ball rolling. Tell them: "I am the market; beat my prices."

  **2. The Maths Whizzes Cleaning Up**
  *   *Risk:* The two CS majors solve Claim B in 2 minutes and bankrupt everyone.
  *   *Fix:* Pre-brief the whizzes. Ask them to play "Market Maker" rather than "Sniper". Tell them their goal is to keep the market liquid, not to arb it to death. Alternatively, make Claim B slightly harder (e.g., requires a specific library they don't have loaded).
  *   *Debrief Save:* If they do clean up, use it. "See? Information has value. But in real life, you aren't the whiz. You're the person trading against them. You need a theory of uncertainty to survive *against* the omniscient."

  **3. Anchoring on 0.5**
  *   *Risk:* Everyone treats unknown maths as a coin flip.
  *   *Fix:* Use the Arbitrage Rule aggressively. If Claim A is "1+1=2" and someone bids 0.5, tax them. Force them to justify deviations from 0.5 on logical grounds, not randomness.

  **4. Treating it like Football Betting**
  *   *Risk:* "I feel lucky on Claim C."
  *   *Fix:* When paying out, ask *why* they held. If they say "gut feeling", deduct LP for "unsound reasoning" (you have final judge authority). Reinforce that this is an epistemology game, not a casino.

  ---

  ## 6. Limitations: What You Must Say Out Loud

  Be frank in the last 5 minutes. This game is a metaphor, not a proof.

  1.  **Proof Search vs. Betting:** In the game, 'truth' is handed down by you (the Oracle). In reality, *finding* the proof is the work. The game rewards pricing the proof, but doesn't simulate the cognitive labour of constructing it. Logical Induction is about the *cost* of computation, not just betting on it.
  2.  **The Limit vs. Tuesday:** The Logical Induction criterion says "no trader can exploit you *in the limit*". In this 90-minute session, a student can be wildly wrong about Claim C and still win. Passing the test once doesn't make you a good reasoner. The theory is about asymptotic behaviour; this is a snapshot.
  3.  **The Axiom Gap:** All claims here are decidable in ZFC (or arithmetic). Real philosophical uncertainty often involves claims where the axioms themselves are contested (e.g., large cardinals, or normative claims). This game assumes the logic is fixed; it doesn't handle uncertainty *about* the logic.
  4.  **The Room isn't an Agent:** We simulated a market of 14 brains. Logical Induction describes a single bounded agent. The market aggregates ignorance, but a single reasoner has to do the computation internally. Don't conflate "social consensus" with "logical probability".

  **Closing Line:**
  "Your mate says uncertainty is just ignorance of the computation time. This game shows that even with fixed computation time, the *management* of that ignorance—keeping your prices coherent while you wait—is a skill with its own payoff. You can be logically omniscient in principle, but if you're incoherent on Tuesday, you're bankrupt before the proof arrives."
