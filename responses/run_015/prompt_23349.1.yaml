  ### The Argument Against Evidential Cooperation in Large-Scale Systems

  **Position:** In a one-shot coordination dilemma among $N$ autonomous agents with a common-cause prior, the evidential-cooperation argument (EDT) fails to justify the cost of cooperation as $N \to \infty$. While an agent's action provides evidence about the population's disposition, the **marginal evidential value** of that action vanishes relative to the cost of cooperation in the large-$N$ limit.

  **Assumptions:**
  1.  **Common-Cause Model:** Agents share a prior over a latent "disposition" parameter $\Theta$. Conditional on $\Theta$, agents act independently.
  2.  **Disposition as Aggregate:** The "population disposition" $\Theta$ represents the *realized mean cooperativeness* of the specific group of $N$ agents (an intensive property), rather than a fixed parameter of an infinite super-population.
  3.  **Weak Correlation:** The prior variance over $\Theta$ is finite and small ("weakly correlated"), implying agents are not perfectly predicted by the common cause.
  4.  **Rational Payoff Structure:** Agents maximize individual utility. In large distributed systems, individual utility is bounded (intensive) or, if extensive, the marginal value of additional cooperators is subject to the variance scaling of the aggregate.

  ---

  ### 1. The Evidential-Cooperation Claim
  The evidential argument for cooperation rests on the following inequality:
  $$ E[U | \text{Cooperate}] - E[U | \text{Defect}] > 0 $$
  Let $c$ be the cost of cooperation. Let $B$ be the benefit received from the other $N-1$ agents. Under EDT, choosing *Cooperate* ($C$) updates the agent's belief about the common disposition $\Theta$. Since $\Theta$ governs all agents, this update increases the expected number of other cooperators.
  The EDT agent argues:
  $$ \text{Gain}_{\text{EDT}} \approx (\text{Benefit per Cooperator}) \times (N-1) \times \Delta P(\text{Other Cooperates} | \text{My Action}) $$
  Because the term $(N-1)$ grows linearly with system size, the EDT argument suggests that for sufficiently large $N$, the evidential gain should overwhelm any fixed cost $c$, mandating cooperation.

  ### 2. The Scaling Analysis
  To evaluate this claim, we must analyze how the evidential update term $\Delta P$ scales with $N$.

  #### The Variance of the Disposition
  The prompt specifies the correlation arises from a prior over an "unknown population disposition." In a system of finite size $N$, the disposition $\Theta$ is best modeled as the **sample mean** of the agents' cooperativeness probabilities.
  Let each agent $i$ have a latent propensity $\theta_i$. The population disposition is $\Theta = \frac{1}{N} \sum_{i=1}^N \theta_i$.
  Even if the individual propensities $\theta_i$ are drawn from a super-population with variance $\sigma^2$, the variance of the *group mean* $\Theta$ scales according to the Central Limit Theorem:
  $$ \text{Var}(\Theta) = \frac{\sigma^2}{N} $$
  This is crucial: as the number of agents $N$ increases, the uncertainty about the *aggregate disposition of the group* decreases. The "common cause" becomes more precise simply because the law of large numbers stabilizes the group average.

  #### The Evidential Update
  My action $a_i$ is a single sample from this population. The evidential value of my action is the shift in the expected value of $\Theta$ conditional on my choice. In a Bayesian update for a mean parameter with variance $\text{Var}(\Theta)$, the magnitude of the posterior shift $\Delta \mu$ given one observation scales with the prior variance:
  $$ \Delta \mu \propto \text{Var}(\Theta) \propto \frac{1}{N} $$
  Intuitively, in a crowd of a million, your own behavior is negligible evidence about the crowd's average behavior. In a crowd of ten, it is significant. The evidential leverage of one agent over the population parameter decays as $O(1/N)$.

  #### The Net Evidential Gain
  Now we combine the scaling of the *benefit* with the scaling of the *evidence*.
  1.  **Benefit Scaling:** The total benefit from others scales with the number of others, $O(N)$.
  2.  **Evidence Scaling:** The probability shift regarding the disposition scales as $O(1/N)$.

  The total expected evidential gain $G$ is the product of these terms:
  $$ G \approx \underbrace{N}_{\text{Benefit Scale}} \times \underbrace{\frac{1}{N}}_{\text{Evidence Scale}} \times \underbrace{\sigma^2}_{\text{Prior Strength}} \approx O(1) $$
  The linear growth in the number of beneficiaries is exactly cancelled by the linear dilution of the evidential signal. The total evidential gain converges to a **constant** determined by the super-population variance $\sigma^2$, not the system size $N$.

  ### 3. The Rational Basis for Defection
  The cancellation above implies that the evidential benefit of cooperation does **not** grow with $N$. It remains bounded.
  $$ \lim_{N \to \infty} \text{Gain}_{\text{EDT}} = K \cdot \sigma^2 $$
  where $K$ is a constant related to the payoff structure.

  The prompt stipulates that the agents are **"weakly correlated."** This implies that the super-population variance $\sigma^2$ is small. Consequently, the constant limit $K \cdot \sigma^2$ is small.
  For cooperation to be rational, the evidential gain must exceed the cost $c$:
  $$ K \cdot \sigma^2 > c $$
  Since $\sigma^2$ is small (weak correlation) and $c$ is a fixed physical cost of action, this inequality will typically fail. The "magic" of the $N$ multiplier is an illusion created by ignoring the $1/N$ shrinking of the evidential update.

  ### 4. Intensive Utility (Secondary Argument)
  Even if one disputes the "Disposition as Mean" model and insists $\Theta$ is a fixed super-population parameter (where $\text{Var}(\Theta)$ does not shrink with $N$), the argument holds under a **bounded utility** assumption standard in distributed systems.
  *   **Extensive Payoff:** If an agent's utility scales linearly with $N$ (e.g., they own the whole network), Gain is $O(N)$ and EDT recommends cooperation.
  *   **Intensive Payoff:** If an agent is autonomous, their utility depends on their *share* of the system performance (e.g., latency, throughput per node). This utility depends on the *rate* of cooperation $\Theta$, not the count $N\Theta$.
      *   In this case, the Benefit term does not scale with $N$.
      *   Gain $\approx 1 \times \Delta \mu \approx \text{Constant}$.
      *   Again, with weak correlation, Constant < Cost.

  ### Conclusion
  The evidential-cooperation argument fails for large $N$ because it conflates the **number of affected agents** with the **informational value of one's action**. As $N$ grows, the system's aggregate behavior becomes statistically stable, rendering any single agent's action increasingly uninformative about the global disposition. The evidential gain saturates at a constant value determined by the prior variance. Given the assumption of weak correlation, this saturated gain is insufficient to justify the cost of cooperation. Rational agents in large-scale distributed systems should therefore defect, relying on causal mechanisms (like contracts or repeated interactions) rather than evidential correlations.
