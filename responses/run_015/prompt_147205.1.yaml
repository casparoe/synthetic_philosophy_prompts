  4.  **Task 3: False Separation (Signal vs. System):**

      *   Biological nociception isn't modular like a box with wires. Nociceptive fibers (A-delta, C-fibers) project to thalamus, then somatosensory cortex (location/intensity) *and* limbic system (affect/motivation) simultaneously.
