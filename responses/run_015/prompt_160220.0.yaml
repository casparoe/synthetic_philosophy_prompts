  # SEMINAR HANDOUT: THE LUMINOSITY TREE

  **START HERE**

  **Q1. (Blind Spots: KK)**
  *Case: The Room.* You are warming up slowly. At the very last moment you feel cold, do you know you feel cold?
  *   **Yes** → Go to **Q2**.
  *   **No** → Blind spots exist. Go to **Q3**.

  **Q2. (Blind Spots: ~K~K)**
  *Case: The Room.* At the very first moment you feel warm (not cold), do you know you *don't* feel cold?
  *   **Yes** → **LEAF 1: Full Luminosity (Standard)**.
      *   *Practical Commitment:* If you feel you know, you may assert/act immediately.
  *   **No** → Blind spots exist. Go to **Q3**.

  **Q3. (Margin for Error)**
  *Case: Mental Arithmetic.* You are 90% accurate but can't tell the 10% errors apart. To know you are right, must you be safe from error in nearby cases where you feel equally confident?
  *   **No (Knowledge can be fragile)** → **LEAF 2: Fragile-knowledge view (Unnamed)**.
      *   *Practical Commitment:* You may assert/act if you know, even if you could easily have been wrong.
  *   **Yes (Margin Required)** → Go to **Q4**.

  **Q4. (Substitute Norms)**
  *Case: Forgotten Fact.* You answer correctly but can't tell if you remember. Is there *any* epistemic state (e.g., rationality/justification) you definitely have?
  *   **Yes (Justification is luminous)** → **LEAF 3: Justification/Rationality Luminosity (Unnamed)**.
      *   *Practical Commitment:* You may assert/act if you are rational, even if you lack knowledge.
  *   **No (Nothing epistemic is luminous)** → Go to **Q5**.

  **Q5. (2nd-Order Margin Strength)**
  *Claim:* If knowledge requires a margin, must the buffer for *knowing you know* be as wide as the buffer for *knowing p*?
  *   **No (2nd-order margin is narrower)** → **LEAF 4: Weaker Margin View (Unnamed)**.
      *   *Practical Commitment:* You may assert/act if you know, but be cautious about claiming you know.
  *   **Yes (Margins are equal or wider)** → Go to **Q6**.

  **Q6. (Scope of Blind Spots)**
  *Claim:* Are blind spots limited to sensory cases (like the room) and absent in logical/memory cases?
  *   **Yes (Limited to sensory)** → **LEAF 5: Restricted Luminosity (Unnamed)**.
      *   *Practical Commitment:* You may assert/act immediately on logical/memory cases, but not sensory ones.
  *   **No (General)** → Go to **Q7**.

  **Q7. (Normative Target)**
  *Claim:* Is the norm for assertion based on practical permission rather than knowledge?
  *   **Yes (Practical norm)** → **LEAF 6: Change-of-Subject View (Unnamed)**.
      *   *Practical Commitment:* You may assert/act if permitted by practical stakes, knowledge irrelevant.
  *   **No (Knowledge is the norm)** → **LEAF 7: Global Anti-luminosity (Williamson)**.
