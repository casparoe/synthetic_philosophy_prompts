answer: |-
  # Future Contingents: A Decision Tree
  **Instructions:** Start at **Node 1**. Answer based on your intuition about the *case*, not the theory names. Follow the arrows to your position.

  ### **Node 1: The Historian (Retrodiction)**
  *A historian in 2060 has lost all records of today. She asks: "Was there a sea battle on March 3rd?"*
  **Does her sentence have a truth value (True/False) right now, even though she can't know it?**
  *   **NO** → **Leaf A: Verificationism / Open Past**
      *   *Diagnosis:* **Unattractive.** You deny truth to the settled past. Most metaphysicians reject this as it makes history depend on evidence.
  *   **YES** → Go to **Node 2**.

  ### **Node 2: The Law of Excluded Middle (LEM)**
  *Consider the claim: "Either there will be a sea battle tomorrow or there won't."*
  **Is this disjunction **True** right now?**
  *   **NO (It's Indeterminate)** → **Leaf B: Łukasiewicz (3-Valued Logic)**
      *   *View:* Bivalence fails. Future contingents lack truth values, so logical tautologies involving them can fail too.
  *   **YES** → Go to **Node 3**.

  ### **Node 3: Future Ontology**
  *Does the future exist **right now** in the same way the past does?*
  *   **NO** → Go to **Node 4**.
  *   **YES** → Go to **Node 5**.

  ### **Node 4: Truthmakers for Non-Existents**
  *(Only if Future Does Not Exist)*
  *Can the sentence "There will be a sea battle" be **True** even though the future battle does not exist?*
  *   **YES** → **Leaf C: The Truthmaker Gap**
      *   *Diagnosis:* **Incoherent.** You claim a truth value without a truthmaker. Nobody occupies this spot; it violates the correspondence intuition.
  *   **NO** → **Leaf D: Growing Block Open Futurism**
      *   *View:* Only the past and present exist. Future statements lack truthmakers, so they are not true (or are indeterminate).

  ### **Node 5: Future Singulars**
  *(Only if Future Exists)*
  *Is the specific claim "There will be a sea battle" itself **True or False** right now?*
  *   **NO (It's Indeterminate)** → Go to **Node 6**.
  *   **YES** → Go to **Node 7**.

  ### **Node 6: Necessity vs. Contingency**
  *(Only if Singular is Indeterminate)*
  *If the battle is **not** determined by physical laws, is "There will be a battle" automatically **False**?*
  *   **YES** → **Leaf E: Peirceanism**
      *   *View:* "It will be" means "It must be." If it's contingent, the statement is false. (Often conflated with Supervaluationism).
  *   **NO** → **Leaf F: Supervaluationism**
      *   *View:* "It will be" is contingent. It's true on some future branches, false on others, so simpliciter it's indeterminate (but LEM holds).

  ### **Node 7: The Nature of Uncertainty**
  *(Only if Singular is True/False)*
  *Is our uncertainty about the battle due to **missing facts** or **no facts**?*
  *   **NO FACTS** → (Return to Node 6/Leaf F; you are a Supervaluationist who accepts Bivalence).
  *   **MISSING FACTS** → Go to **Node 8**.

  ### **Node 8: Branching Time**
  *Are the future possibilities where the battle **doesn't** happen **real branches** of time?*
  *   **YES** → Go to **Node 9**.
  *   **NO** → **Leaf G: Thin Red Line (TRL)**
      *   *View:* There is only one real future. Other "possibilities" are just epistemic illusions. Bivalence holds on a linear timeline.

  ### **Node 9: Privilege**
  *Is the "actual" future branch **metaphysically privileged** by reality, or just privileged by **our location** in it?*
  *   **METAPHYSICALLY PRIVILEGED** → **Leaf G: Thin Red Line (TRL)**
      *   *Note:* You accept branching but insist one line is "The Real One."
  *   **OUR LOCATION** → **Leaf H: Ockhamism**
      *   *View:* All branches are equally real. One is "actual" only relative to us. Bivalence holds because every branch is settled relative to itself.

  ---

  ### **⚠️ Instructor Notes & Collapses**

  **1. The Ockhamism / Thin Red Line Collapse**
  For most seminar purposes, **Leaf G (TRL)** and **Leaf H (Ockhamism)** are indistinguishable. Both assert Bivalence for future contingents. The distinction relies on heavy-duty modal metaphysics (the status of unactualized branches) that rarely impacts the logic of the sea battle itself. If students land on G or H, treat them as the same "Bivalent" camp unless discussing modal realism.

  **2. The Peircean / Supervaluation Conflation**
  **Leaf E (Peircean)** and **Leaf F (Supervaluationism)** are often confused. Both say "There will be" is not True (in the simple sense). The difference: Peirceans say it is *False* (because 'will' implies necessity); Supervaluationists say it is *Indeterminate* (because 'will' is contingent). If students can't grasp the semantics of 'will', these leaves merge.

  **3. ⛔ MARGIN NOTE: The Determinism Trap**
  **If the universe is deterministic, this tree breaks.**
  If physical laws fix the future, **Leaf H (Ockham)**, **Leaf G (TRL)**, and the **Block Universe** all merge: the future is settled and True/False. **Leaf B (Łukasiewicz)**, **Leaf F (Supervaluationism)**, and **Leaf D (Growing Block)** vanish: there are no "open" contingents to be indeterminate about. This tree assumes **indeterminism**; if a student argues for determinism, they bypass the tree entirely.
