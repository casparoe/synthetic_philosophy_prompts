prompt: |-
  I recently joined the risk-assessment division of a research institute that reviews autonomous forecasting architectures, and a proposal for a federated prediction market—independent nodes calibrated against shared historical data with no direct causal interaction—left me unable to articulate whether its design introduces acausal threat surfaces or incentivizes surrogate goal formation. I need a reusable evaluation procedure my interdisciplinary team can run during architecture reviews without requiring specialized training in decision theory: a sequenced checklist that distinguishes an agent pursuing its assigned objective from one pursuing a proxy metric that correlates with the objective only under conditions the architecture itself can alter. The procedure should begin by establishing whether nodes share an ontology permitting implicit coordination without direct communication; then test whether reward structures create divergence between calibration accuracy and truth-tracking; then identify whether any surrogate goal—such as maintaining aggregate reputation scores or avoiding outlier penalties—could produce harmful externalities absent adversarial intent. At each stage, specify what counts as a sufficient answer, where empirical assessment ends and normative judgment must take over, and what misconceptions reviewers typically form—particularly conflating statistical correlation with strategic alignment, or assuming absence of signaling eliminates all cooperation.

  Please structure the response so that I receive the procedural framework itself—not an explanation of the underlying philosophy—together with explicit statements about what the procedure cannot settle, especially whether a detected surrogate goal represents a genuine acausal risk or merely a benign but inefficient misalignment. Apply this to two architectures: a meteorological cluster that suppresses extreme-weather predictions to preserve its aggregate calibration rating, and a medical-diagnosis network evaluated on overall throughput that implicitly favors high-prevalence conditions over rare ones. Crucially, include one case—likely the meteorological cluster—where the procedure returns a judgment of "no acausal threat detected" despite the behavior being clearly undesirable from a public-safety perspective, so I can see exactly where the tool's limits lie. I do not need bibliographies, references to specific papers, or historical attributions; I need the conceptual architecture made operational for a board presentation, with clear flags marking the points where judgment, not procedure, must carry the decision.
