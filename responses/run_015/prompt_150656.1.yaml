prompt: |-
  My mother retired in June after thirty-one years as the director of an overnight shelter — officially open eight to eight, in practice open whenever anyone turned up, because she was the one who covered the shifts nobody was funded to cover. The board is throwing her a dinner at the end of the month and I have agreed, rashly as it now seems, to give the toast. The room will be around ninety people: her staff past and present, several of the shelter's long-term guests, our extended family (a good number of whom are still faintly resentful about the Christmases she missed), and the board and the two donors who underwrite most of the budget. I'm three years into a PhD in philosophy and I work on supererogation, which turns out to be the single least helpful thing to have in my head here. My mother's own line is that she was just doing her job and that the scandal is that the job exists; she will hate being made into an example of anything, and she will hate being thanked in a way that lets anyone else off the hook.

  What I can't work out is how to praise her without saying something false or unkind, and every option seems to have teeth. If I say she went above and beyond, I seem to be saying the extra was optional — which is the thing she has spent her career denying, which tells the donors that the gaps in the shelter were filled by her virtue rather than by the line item they never approved, and which the guests in the room will hear as: the care you depended on was something nobody owed you. It also may simply misdescribe her: much of what she did was arguably required of her, given her role, and it's a familiar thought that what would be supererogatory for a stranger is obligatory for the person whose job it is. But if I say she only ever did what was required, there is nothing left to praise her for — we don't praise people for meeting their obligations — and I'd also be implying that whoever takes the job next owes that much too, which is exactly the expectation that burned her out and which her staff, several of whom are single parents with second jobs and could not have done what she did, would reasonably hear as a rebuke. If I make her an exemplar of self-sacrifice I lose the rest of her: the allotment, the atrocious puns, the decade she spent playing in a bluegrass band. There is a well-known complaint that a life narrated wholly in terms of moral demand stops looking like an attractive life, and she would find that version of herself unrecognizable. And praising her at all seems to carry an implication that people who did less are criticizable, which I suspect has something to do with the asymmetry between praise and blame but which I can't get into focus.

  So: write me the toast. Four to five minutes, spoken, affectionate rather than scolding — including toward the board, who are paying for the dinner — with no technical vocabulary at the surface (my aunt should not have to decode "supererogatory"), though I wouldn't mind one line my supervisor will quietly enjoy. She should come out of it as a specific person who did a specific job for a long time, not as a case study in anything. Then, separately, give me a page of notes on what the toast is committed to: which of its moves lean on a contested reading of supererogation, where you think the reasoning is most likely to fail, and what would change your mind about how to frame it — for instance, if the requirement that supererogatory acts involve a real cost to the agent is false, or if role-duties end up swallowing the category entirely, or if the institutional critique is right and the whole vocabulary of individual virtue is a trap in this setting. Tell me which line you're least confident in and what you'd put in its place under each of those alternatives.
reasoning: |-
  Here's a thinking process that leads to the suggested toast and analysis:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy (3 years in), specializing in supererogation.
      *   **Subject:** Mother, retiring after 31 years as director of an overnight shelter.
      *   **Context:** Retirement dinner, ~90 people (staff past/present, long-term guests, family, board, major donors).
      *   **Mother's Stance:** Hates being made an example; believes she was "just doing her job"; believes the scandal is that the job exists/is underfunded; hates thanks that let others off the hook.
      *   **Speaker's Dilemma:**
          *   "Above and beyond" implies the extra was optional (denies the need, insults guests who needed it, lets donors off the hook).
          *   "Just doing her job" implies nothing praiseworthy (and sets impossible standards for future staff).
          *   "Self-sacrifice" erases her humanity (hobbies, personality) and makes her life look unattractive/unrecognizable.
          *   Praise implies blame for those who did less (asymmetry problem).
      *   **Constraints:** 4-5 minutes spoken (approx. 600-750 words), affectionate not scolding (even to the board), no technical jargon (except one subtle line for the supervisor), specific person not case study.
      *   **Deliverables:** The Toast + A page of analytical notes (commitments, weak points, alternatives).

  2.  **Deconstruct the Philosophical Tension:**
      *   The core tension is between *obligation* (duty, role) and *supererogation* (going beyond duty).
      *   The mother rejects the supererogatory label because it normalizes the lack of resources.
      *   The speaker knows that calling it "duty" ignores the extraordinary personal cost and effort.
      *   *Solution Strategy:* Shift the focus from *quantity of action* (how much she did) to *quality of attention* (how she did it). Frame her work not as "filling gaps" (which implies the gaps are okay if filled) but as "refusing to let the system define the human interaction."
      *   Avoid "saint/sinner" dichotomy. Focus on "presence."
      *   Address the board/donors without accusing them, but reminding them of the reality.
      *   Include her humanity (bluegrass, puns, allotment).

  3.  **Drafting the Toast - Section by Section:**
      *   *Opening:* Acknowledge the crowd, the occasion, and the difficulty of the task. Establish warmth.
      *   *The Work:* Describe the shelter not as a charity case but as a community. Acknowledge the "8 to 8" vs. reality.
      *   *The Mother:* Describe her specific way of being there. Not a martyr, but a person who showed up. Mention the bluegrass/puns to humanize her.
      *   *The "Philosophy" Bit:* Subtle nod to the supervisor. Avoid "supererogation." Focus on the idea that some things can't be measured by a job description.
      *   *The Board/Donors:* Thank them, but pivot to the future. The goal isn't to replicate her sacrifice, but to build a system that doesn't require it.
      *   *The Guests/Staff:* Acknowledge their role in making the shelter what it was. It was a partnership, not a benevolence.
      *   *Closing:* A wish for her retirement.

      *Drafting thought:* I need to be careful not to say "she did more than she had to." Instead, say "she did what the job needed, even when the job description didn't cover it." Or better: "She treated the job description as a floor, not a ceiling, but only because the people needed it."
      *Refining the "Scandal":* The mother says the scandal is that the job exists. I should echo that without making the dinner morbid. "We celebrate her, but we shouldn't have needed her to be this extraordinary."
      *The "One Line":* Something about "actions beyond the call" but phrased normally. Or maybe about "obligation." Let's try: "There's a philosophical idea that some good deeds are optional. Mom never found that category useful." (A bit too on the nose). How about: "She operated on the principle that 'necessary' isn't a number on a spreadsheet." Let's save the specific philosophy nod for the notes, or make it very subtle in the text. The prompt asks for *one line my supervisor will quietly enjoy.* It needs to be technically accurate but sound normal. Maybe: "She proved that the limit of an obligation is set by the need, not the contract."

      *Re-evaluating the "Blame" issue:* If I praise her, do I blame the staff? I need to emphasize that the staff did *their* best within *their* constraints, and Mom filled the *structural* gaps, not the *effort* gaps of others.
      *Re-evaluating the "Board":* Don't scold them. Thank them for the dinner, thank them for the funding, but note that the funding never quite matched the need.

      *Let's write.*

  4.  **Drafting the Notes:**
      *   *Commitments:* What philosophical stance does the toast take? It likely adopts a "role-duty expansion" view or a "care ethics" view. It rejects the strict obligation/supererogation binary.
      *   *Weak Points:* Where could this fail? If the audience hears "she did too much" as "you should do too much." If the board hears "you underfunded us."
      *   *Alternatives:* What if supererogation *does* require cost? What if institutional critique is paramount?
      *   *Least Confident Line:* Identify the specific sentence that walks the tightrope and offer alternatives.

  5.  **Refining the Toast (Self-Correction during drafting):**
      *   *Check:* Did I mention the bluegrass? Yes.
      *   *Check:* Is it scolding? Keep the tone light.
      *   *Check:* Is the philosophy hidden? Yes.
      *   *Check:* Length? 4-5 minutes is roughly 600-750 words spoken at a moderate pace.
      *   *Correction:* Make sure I don't accidentally imply the guests were "projects." They were neighbors/guests.
      *   *Correction on the "Line":* "She always insisted that 'necessary' was defined by the person at the door, not the budget line." That works for the supervisor (modal scope of obligation) but sounds normal to others.

  6.  **Final Polish:**
      *   Ensure the transition from the personal to the structural is smooth.
      *   Make sure the ending is about *her* future, not just the shelter's.

  7.  **Final Review against constraints:**
      *   4-5 mins? (Word count check).
      *   Affectionate? Yes.
      *   No jargon? Yes.
      *   One line for supervisor? Included.
      *   Notes page included? Yes.

  *(Self-Correction on the Notes)*: The prompt asks for specific philosophical contingencies (cost to agent, role-duties swallowing category, institutional critique). I need to make sure I address those specifically in the analysis section.

  Let's assemble.

  *Word Count Check:* A 5-minute speech is usually around 750 words. I will aim for that.
  *Tone Check:* Warm, slightly wry (it's a philosopher speaking), respectful.

  *Key Philosophical Move:* The toast will argue that her "extra" work wasn't "above duty" but rather a refusal to accept a defective definition of duty. This sidesteps the supererogation trap.

  *Let's write the toast.*
  (Proceeds to generate output based on these thoughts.)
answer: |-
  **The Toast**

  Good evening. For those who don't know me, I'm [Name]. I'm [Mother's Name]'s child, and I spend my days studying philosophy, which is a polite way of saying I get paid to worry about definitions. That has made preparing this toast difficult. Mostly because my mother hates being defined, and she especially hates being defined as a saint.

  If I stand here and say she went "above and beyond," I know she'll roll her eyes. She'll say she was just doing what was needed. And she's right. For thirty-one years, this shelter was officially open from eight to eight. But anyone in this room who ever needed a bed knows the doors opened whenever someone knocked, and stayed open as long as someone was there to turn the lock. My mother was often the one turning that lock. She covered the shifts the budget didn't fund. She answered the calls the phone system couldn't route.

  Now, in my line of work, we talk a lot about what we owe each other. There is a temptation to call what Mom did "optional goodness." But she operated on a different principle: that the limit of an obligation is set by the need, not the contract. She didn't see the gaps in the funding as opportunities for virtue; she saw them as errors in the system that she could temporarily patch with her own time.

  But if I focus only on the work, I lose her. And she is too much to be lost in her job description. She is also the person who spent a decade playing banjo in a bluegrass band that was enthusiastically bad. She is the gardener who talks to her tomatoes. She is the woman who will inflict a pun on you even if you are in the middle of a crisis. She taught me that caring for people isn't about grim endurance; it's about making space for joy, even in hard places. She didn't just keep the shelter open; she made it a place where people could be human.

  I want to thank the board and our donors. Thank you for funding the work, and thank you for tonight. You made this possible. But I think the best way to honor my mother is to acknowledge her own favorite line: the scandal isn't that she did the work; the scandal is that the work needed doing like this. We celebrate her not because we want the next director to burn the same candle, but because we hope the next director has the resources to leave the office at five o'clock.

  To the staff, past and present: you held the line. To the guests who are here tonight: you made the shelter a community, not a warehouse. My mother always said she didn't save anyone; she just opened the door. You walked through it.

  Mom, you are retired now. The lock is someone else's problem. The tomatoes are yours. The music is yours. We love you, not for what you gave up, but for who you are. Please, put down the phone. Have a drink.

  To [Mother's Name].

  ***

  **Analytical Notes on the Toast**

  **1. Philosophical Commitments & Contested Readings**
  The toast attempts to navigate the supererogation/obligation binary by adopting a **Care Ethics** framework rather than a Deontological one.
  *   **The Move:** It rejects the "Above and Beyond" (supererogatory) framing not by claiming the acts were strictly obligatory (contractually), but by claiming the *definition* of obligation was flawed. The line *"the limit of an obligation is set by the need, not the contract"* is the nod to your supervisor. It suggests a "maximalist" view of role-duty: if the role is "Director of Shelter," and the shelter fails without the extra shifts, then the shifts are implicitly part of the role, regardless of the budget.
  *   **Supererogation:** It leans on the view that supererogation requires *optionality*. By framing her actions as "necessary patches," it denies optionality, thus removing the act from the supererogatory category without stripping it of value. It treats her actions as **moral necessities** arising from the situation, rather than **virtuous extras**.
  *   **Praise/Blame Asymmetry:** To avoid implying the staff were blameworthy for *not* doing what she did, the toast distinguishes between "holding the line" (staff) and "patching errors" (Mother). It frames the staff's contribution as sufficient within the *actual* constraints, while framing the Mother's extra work as addressing *structural* constraints. This avoids blaming the staff for not being martyrs.

  **2. Where the Reasoning Might Fail**
  *   **The "Martyrdom" Trap:** Even by saying we *don't* want the next director to do the same, the toast risks romanticizing the burnout. If the audience hears "She did what was needed," they may still internalize "Therefore, what is needed must be done by whoever is there."
  *   **The Board's Reception:** The line about the "scandal" is gentle, but it relies on the board accepting that underfunding is a "scandal" rather than a "fiscal reality." If the board is defensive, this could land as an accusation of negligence disguised as gratitude.
  *   **The "Need" Argument:** The claim that obligation is set by need is philosophically contentious. If need determined obligation, no one could ever rest. The toast glosses over the sustainability argument to preserve the affectionate tone.

  **3. Contingencies & Alternatives**

  *   **Contingency A: If supererogatory acts *do not* require real cost to the agent.**
      *   *Current Stance:* The toast assumes her work *was* costly (time, burnout risk) but frames it as duty.
      *   *If False:* If one argues she enjoyed it enough that it wasn't a "cost," the "sacrifice" narrative collapses.
      *   *Alternative:* Shift focus entirely to **excellence**. Instead of "she did what was needed," say "she did the job with a level of attention that redefined what the job could be." This praises the *quality* without relying on the *cost*.

  *   **Contingency B: If role-duties swallow the category entirely (The "Professionalism" Objection).**
      *   *Current Stance:* The toast argues her extra work was part of the role because it was necessary.
      *   *If False:* If one argues that a job is *only* what is paid for, then she was technically working for free.
      *   *Alternative:* Frame it as **gift**. "She gave a gift to this community that wasn't in her paycheck." This admits the supererogatory nature but frames it as generosity rather than duty, accepting the "letting others off the hook" risk but mitigating it by emphasizing the gift was *hers to give*, not a standard to be met.

  *   **Contingency C: If the Institutional Critique is right (Virtue is a trap).**
      *   *Current Stance:* The toast tries to have it both ways: praise her virtue while critiquing the system.
      *   *If False:* If individual virtue *always* props up broken systems, praising her is complicit.
      *   *Alternative:* Radicalize the "Scandal" line. Make the toast 50% about her, 50% about a pledge to change the funding model. (Risk: Turns a retirement dinner into a rally).

  **4. Least Confident Line**
  *   *Line:* "She operated on a different principle: that the limit of an obligation is set by the need, not the contract."
  *   *Risk:* It is the most philosophical sentence. It risks sounding abstract or preachy to the non-academic audience, and it risks sounding like a critique of the board's contract to the board.
  *   *Alternative 1 (Softer):* "She believed that if someone needed help, the paperwork didn't matter." (Less precise, warmer).
  *   *Alternative 2 (More Direct):* "She never let a budget line tell her who deserved a bed." (More aggressive, clearer stakes).
  *   *Alternative 3 (For the Supervisor):* "She treated the job description as a minimum, but the need as a maximum." (Retains the modal logic without the word "obligation").

  **5. Final Recommendation**
  Stick with the current line if the room is intellectually mixed; it sounds like a platitude to most but a claim about moral scope to your supervisor. If the board is known to be fragile, switch to Alternative 1. The toast relies on the audience accepting that "need" creates a moral pull, which is the core of your mother's ethos, even if it's philosophically debatable.
