  ## 5. Closing Statement
  "Determinism guarantees that the future is fixed by the past. It does not guarantee that the future is *knowable* by agents with finite resolution. You have just computed the boundary where knowledge ends, not because the law failed, but because the world is too sensitive for our measures to hold."
