prompt: |-
  hey — i write about science and ideas for a living, and i'm putting together a workshop for about 16 people next tuesday (mostly philosophy grad students, a couple science journalists, one very patient high-school teacher). we have 90 minutes in a seminar room with just tables and paper. i want them to physically feel why logical omniscience is broken as a model for real agents, not just nod at it, so i need a classroom game with rules and real small stakes, not a lecture.

  the twist i want injected — kind of a niche framing — is that inference isnt free: each participant recieves shared premise cards printed with axioms, but only a fixed budget of "deduction tokens" to convert premises into conclusions. the collective goal is to approve a fictional "system-certification" that only activates if every node in the chain knows one specific logical consequence of the base rules. but every token spent hurts your personal score, so rational players stop deriving, and coordination collapses even though everyone holds the exact same premises. can you design the whole activity — group split, card layout, token economy with payoffs that dont need real money, the timeline, and the debrief that maps what just happened onto formal epistemic logic? please commit to one specific token-cost structure and one specific debrief framing; defend why that choice makes the failure ineveitable rather than accidental. include an honest note on which feature of the omniscience problem this game cant reproduce, and tell me whats going to blow up the first run i try it. also, please dont hand me a bibliography or ask me to cite Hintikka — my readers wont have those in front of them, and neither do i right now; just build it from the idea itself. accomodate the typo or two in this message and answer straight.
