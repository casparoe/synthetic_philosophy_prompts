          *   Catch: The bonus is small compared to the cost of hoarding tokens, OR the cost structure creates a prisoner's dilemma where trusting others to do the work is better than doing it yourself.
          *   *Refinement based on prompt:* "Every token spent hurts your personal score... rational players stop deriving, and coordination collapses."
