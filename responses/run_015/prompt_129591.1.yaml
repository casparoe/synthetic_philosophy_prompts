          *   *The Trap:* If I spend tokens to help the group reach $E$, I lose personal points. If I don't, and others do, I gain personal points + group bonus. If everyone thinks this, no one spends tokens, $E$ is never reached, everyone gets 0 group bonus.
          *   *Wait, prompt says:* "only a fixed budget of 'deduction tokens' to convert premises into conclusions."
          *   *Let's simplify:* Each player has the axioms. Each player has 3 tokens. To derive a step, you spend a token. To certify, you must show you know the final conclusion.
          *   *The Twist:* The chain is length 5. Tokens per person = 3. They must share derivations. But sharing costs trust/verification.
          *   *Actually, let's make it a Public Goods Game variant.*
          *   **Logic:** $P1 \to P2 \to P3 \to P4 \to P5$.
