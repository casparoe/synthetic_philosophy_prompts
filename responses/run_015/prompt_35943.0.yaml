prompt: |-
  I'm writing a short paper on the metaphysics and normativity of promising, and I'd appreciate critical comments on the draft below — both on the soundness of the argument and on whether the central proposal is doing any real work.

  The paper defends a view I call the "transferred authority" account of promissory obligation, against the two views I take to be the main competitors.

  Draft:

  It is a commonplace that promises bind, but remarkably hard to say what a promise does such that it binds. I consider two familiar accounts and find both wanting. The first, which I call the practice view, holds that promising is a conventional practice, like chess, and that the wrong of breaking a promise is the wrong of breaking the rules of the practice — just as it would be wrong to move a rook diagonally even if nobody is harmed. This correctly explains why a promise binds even when the promisee neither relies on it nor even remembers it. But it faces a difficulty: it seems to get the explanation backwards. The rules of a game bind only those who have chosen to play, and it is implausible that each individual promise is a fresh decision to enter the practice. If the practice view says we are all already players, it owes an account of how we got in the game — and no plausible account of that avoids circularity, since the natural story is that joining a practice is itself something like a promise.

  The second, the reliance view, holds that a promise generates an obligation by inducing an expectation in the promisee, thereby exposing the promisee to a risk the promisor has a duty not to exploit. This nicely explains why promises bind proportionally to the reliance they induce, but it cannot explain the bindingness of promises made to people who cannot rely on them: promises to small children, to the severely forgetful, or to the dead. Yet these seem to be paradigm promises, not degenerate cases.

  I propose instead that a promise is a transfer of authority. In promising to φ, the promisor grants the promisee a standing to determine that the promisor φ — a private, localized version of the authority a principal grants an agent. The obligation is not owed to a practice, nor generated by the promisee's psychological states, but is simply the mirror image of a normative power the promisee now holds. The promise is like handing someone keys: in ordinary speech you hand over the keys to your house, in promising you hand over the keys to a piece of your own will.

  This account predicts, correctly I think, that promises made under duress do not bind: coerced transfers of authority, like coerced transfers of property, are defective transfers. It also explains why third parties can feel the existence of an obligation even when the promisee has forgotten: an unexercised right is still a right.

  Comments requested on the following, though please raise anything else you notice:

  1. The dead-promisee case is meant to be an objection to reliance views, but does my own account handle it? A dead person seems unable to hold any standing, yet I claim the promise still binds. Is this an embarrassment for my view, or can the appeal to "unexercised rights" be made to work?
  2. Does the keys analogy carry any argumentative weight, or is it merely decorative?
  3. Is my characterization of the two competitor views fair, or am I attacking weakened versions of them?
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **Task:** Provide critical comments on a draft paper abstract/summary regarding the metaphysics and normativity of promising.
      *   **Topic:** The "Transferred Authority" account of promissory obligation vs. Practice View and Reliance View.
      *   **Specific Questions:**
          1.  Does the "dead promisee" case undermine the Transferred Authority view (can the dead hold standing/rights)?
          2.  Is the "keys" analogy argumentative or decorative?
          3.  Are the competitor views (Practice, Reliance) characterized fairly?
      *   **General Request:** Raise anything else noticed (soundness, work done, etc.).

  2.  **Analyze the Draft:**
      *   **Core Thesis:** Promising is a transfer of authority (promisor grants promisee standing to determine promisor's action). Obligation = mirror image of promisee's normative power.
      *   **Opponent 1 (Practice View):** Promising is a convention (like chess). Wrong = breaking rules. *Critique:* Circularity (how did we join the practice?).
      *   **Opponent 2 (Reliance View):** Promising induces expectation/reliance. Wrong = harming reliance. *Critique:* Can't handle non-reliance cases (children, forgetful, dead).
      *   **Proponent's Advantages:** Explains duress (defective transfer), explains third-party observation (unexercised right).

  3.  **Address Question 1: The Dead Promisee Case:**
      *   *The Problem:* The draft claims the Reliance View fails because dead people can't rely. The draft claims the Transferred Authority View succeeds because rights persist.
      *   *The Conflict:* If authority is transferred *to the promisee*, can a dead entity hold authority/standing? Usually, rights/standing require a living holder (or a legal proxy).
      *   *Analysis:* This is a major vulnerability. If I promise a dead person to water their plants, who holds the authority to release me? If they are dead, they have no will to exercise. If the authority is "standing to determine," a dead person cannot determine anything.
      *   *Potential Fix:* Maybe the right transfers to heirs? But the draft says the promise *to the dead* binds. If the authority dies with the person, the obligation might vanish (or become a general duty, not a promissory one).
      *   *Verdict:* This is a serious challenge. The "unexercised right" analogy works for property (heirs inherit), but "standing to determine will" is personal. Needs elaboration.

  4.  **Address Question 2: The Keys Analogy:**
      *   *The Analogy:* Handing over keys to a house = handing over keys to a piece of your will.
      *   *Function:* It illustrates *transfer* and *access/control*.
      *   *Critique:* It's evocative but metaphysically thin. Keys allow physical entry. What does "entry into will" mean? Does it mean the promisee can *force* the action? No, promises aren't contracts with specific performance usually. Does it mean they can release the promisor? Yes.
      *   *Verdict:* Mostly decorative/rhetorical. It doesn't explain *how* the transfer happens metaphysically. It risks conflating authority over action (command) with authority over obligation (release). Needs to be precise about what "keys to the will" unlocks.

  5.  **Address Question 3: Characterization of Competitors:**
      *   *Practice View:* Associated with Rawls or Scanlon (sometimes). The "circularity" objection is a classic one (Shiffrin raises similar points). However, modern practice views (e.g., Rawls) argue the practice is a public good we benefit from, not a literal contract to join. The draft simplifies this. It's a "straw man" risk, but a common one.
      *   *Reliance View:* Associated with Hume or modern tort-like views. The draft focuses on *inducing expectation*. Scanlon's Principle F is a sophisticated reliance view that tries to handle this. The draft says reliance views can't handle children/dead. Some reliance theorists argue we rely on the *practice* or third parties rely.
      *   *Verdict:* Fair enough for a short paper, but slightly stylized. The "circularity" objection to Practice View is strong but needs to acknowledge the "benefit" argument. The Reliance objection is standard but needs to ensure it targets the *psychological* reliance, not *normative* expectation.

  6.  **General Critique & "Real Work":**
      *   *Metaphysics:* What is "authority"? Is it a normative power (Hohfeldian)? If so, how is it transferred without a prior norm allowing transfer? (This loops back to the Practice View objection).
      *   *Normativity:* Why does transferring authority create an obligation? Usually, obligations come from duties. If I give you authority over my will, why *must* I obey? The draft says obligation is the "mirror image." But why is that mirror binding?
      *   *Duress:* Good point.
      *   *Third Parties:* Good point.
      *   *The "Joining the Game" Problem:* The Transferred Authority view faces the same problem as the Practice View. What gives me the power to transfer authority? If it's a normative power, where does it come from? If it's natural, why? If it's conventional, aren't we back to the Practice View?
      *   *Work Done:* The view distinguishes itself well from Reliance. It distinguishes itself from Practice by focusing on the *bipolar* relation rather than the *institutional* fact. But it needs to explain the *source* of the power to transfer.

  7.  **Drafting the Response:**
      *   *Tone:* Constructive, philosophical, rigorous.
      *   *Structure:* Address the three specific questions first, then offer general observations on soundness and theoretical work.
      *   *Key Insight:* The "Dead Promisee" problem is actually a version of the "Normative Power" problem. If the dead can't hold powers, the view fails there. If they can, why?
      *   *Key Insight:* The "Circularity" objection might boomerang. How do you transfer authority without a rule allowing it?
      *   *Key Insight:* The "Keys" analogy needs to distinguish between *control over action* (slavery/command) and *control over obligation* (release/waiver).

  8.  **Refining the Critique (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say the view is *wrong*, but where it needs defense.
      *   *Nuance:* On the Practice View, mention Rawls explicitly as the target to ensure the user knows what they are fighting.
      *   *Nuance:* On the Dead, distinguish between "promise to the dead" (e.g., funeral arrangements) vs. "promise made before death." The draft implies the former ("promises to the dead").
      *   *Nuance:* On the Keys, point out that keys imply *exclusive* access. Does the promisee have exclusive right to demand performance? What if a third party benefits?

  9.  **Final Polish:** Check against the user's prompt constraints (soundness, central proposal doing work). Ensure the advice is actionable for a short paper. (e.g., "Clarify X," "Defend against Y").

  *(Self-Correction on the Dead Promisee)*: Wait, if I promise a dead person, who holds the authority? If the authority is transferred *at the moment of promising*, and the person dies *after*, the right persists (like property). But if the promise is *to* a dead person (e.g., "I promise to tend your grave"), the promisee is dead *at the time of the promise*? No, usually promises to the dead are made to the living *about* the dead, or made before death. The draft says "promises to the dead." This is ambiguous. If I promise a dying person "I will care for your dog," they are alive. If I promise at a graveside "I will visit," the promisee is dead. The latter is the hard case. A dead person cannot hold authority. This needs to be flagged clearly.

  *(Self-Correction on Circularity)*: The Practice View objection is that joining the practice is like a promise. The Transferred Authority view needs to explain where the *power* to transfer authority comes from. If it comes from a social norm, isn't that a Practice View? If it comes from natural moral law, that needs stating. This is the biggest metaphysical hole.

  10. **Finalizing the Output Structure:**
      *   Introduction (Encouraging tone).
      *   Section 1: The Dead Promisee (The biggest metaphysical hurdle).
      *   Section 2: The Keys Analogy (Rhetorical vs. Argumentative).
      *   Section 3: Competitor Characterization (Fairness check).
      *   Section 4: General Soundness & "Real Work" (The source of normative power).
      *   Conclusion (Summary of next steps).

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a compelling and clearly written draft. You have identified a genuine gap in the literature (the bipolar nature of promising without resorting to convention or psychology) and your "Transferred Authority" account is intuitive. However, for a short paper, you need to be careful that the metaphysics of "authority" doesn't smuggle in the very problems you attribute to your competitors.

  Here are critical comments addressing your specific questions, followed by general observations on the soundness and theoretical work of the proposal.

  ### 1. The Dead-Promisee Case
  You ask whether this is an embarrassment for your view. **It is a significant vulnerability, not just for the Reliance View, but for yours as well.**

  *   **The Problem:** You argue that the Reliance View fails because the dead cannot rely. You argue your view succeeds because an "unexercised right is still a right." But rights and standing are typically capacities held by agents. A dead person has no will, no agency, and no capacity to exercise normative powers (e.g., to release you from the promise).
  *   **The Tension:** If promising transfers *authority* (a normative power to determine your will), and the dead cannot hold or exercise powers, then the transfer fails or lapses upon death. If the authority transfers to the heirs, you are no longer dealing with a promise *to the dead*, but a promise to the living (the heirs).
  *   **Suggestion:** To save the view, you must clarify the metaphysics of the right. Is it a right *in rem* (attached to the act) or *in personam* (attached to the person)?
      *   *Option A:* Argue that the authority transfers to the promisee's estate/proxy. (Risk: This looks like a legal convention, edging back toward the Practice View).
      *   *Option B:* Argue that the obligation persists as a "freestanding duty" once the authority is triggered, even if the holder vanishes. (Risk: This severs the link between the obligation and the promisee's standing, undermining the core "mirror image" thesis).
      *   *Recommendation:* Acknowledge this tension. You might limit your claim to promises made to the *dying* (who are alive when authority transfers) rather than promises made *to the dead* (at the graveside). The latter is a much harder case for any bipolar view.

  ### 2. The Keys Analogy
  **Currently, the analogy is more decorative than argumentative, and it carries a risk of confusion.**

  *   **The Risk:** Handing over keys to a house grants the holder **access and control**. If you hand over the "keys to your will," does the promisee have the right to *force* you to $\phi$? Usually, promisees cannot physically compel performance; they only have the power to *blame* or *release*.
  *   **The Work:** For the analogy to do work, you must specify what the keys *unlock*.
      *   Do they unlock the **power of waiver**? (i.e., Only the promisee can release the promisor).
      *   Do they unlock the **standing to demand**? (i.e., Only the promisee can legitimately complain).
  *   **Recommendation:** Refine the analogy. Instead of "keys to your will" (which sounds like mind control or slavery), consider "keys to the lock of obligation." The promisee holds the only key that can release the promisor. This emphasizes the *normative* transfer rather than a *volitional* transfer. If you keep the "will" language, clarify that you mean authority over the *normative status* of the action, not the physical performance.

  ### 3. Characterization of Competitor Views
  **Your characterization is standard for a short paper, but vulnerable to "straw man" objections from specialists.**

  *   **The Practice View:** You target the idea that joining the practice requires a fresh decision. A sophisticated Practice Theorist (e.g., Rawls) would argue we are born into the practice and benefit from it, creating a duty of fair play, not a contractual entry.
      *   *Counter:* Your circularity objection (joining the practice is like a promise) is a classic and strong objection (often associated with Shiffrin). Keep it, but acknowledge that Practice Theorists rely on "benefit" rather than "consent" to explain entry.
  *   **The Reliance View:** You target psychological reliance. Sophisticated Reliance Theorists (e.g., Scanlon's Principle F) argue that what matters is the *expectation* created by invoking a social norm, not just psychological harm. They might argue they *can* handle the dead/children cases via third-party reliance (society relies on the practice of promising to the dead).
      *   *Counter:* Your point that these are "paradigm promises" is strong. If a theory requires third-party reliance to explain a two-party obligation, it has lost the plot.
  *   **Recommendation:** Add a qualifier: "I am addressing the *core* versions of these views..." This insulates you from niche variants while maintaining the force of your central argument.

  ### 4. General Soundness and "Real Work"
  Does the central proposal do any real work? **Yes, but it faces a "bootstrapping" problem.**

  **A. The Source of the Power (The Meta-Problem)**
  The biggest metaphysical hole in the Transferred Authority view is: **Where does the promisor get the authority to transfer authority?**
  *   If the power to transfer normative standing is itself a product of a social convention, haven't you just collapsed into the Practice View?
  *   If the power is natural/moral, you owe an account of why humans have this specific normative power over one another.
  *   *Why this matters:* The Practice View critic says, "You can't transfer authority unless there is a rule allowing transfer." You need to explain how the transfer happens *sui generis*.
  *   *Fix:* Explicitly state that the power to promise is a **basic normative power** (like the power to consent or own property). It is not derived from a practice; the practice is derived from it.

  **B. The "Mirror Image" Claim**
  You state: *"The obligation is... simply the mirror image of a normative power the promisee now holds."*
  *   This is the strongest part of your paper. It explains the **bipolar** nature of promising (why *I* owe *you*, specifically) better than the other views.
  *   *Work Done:* This successfully explains why third parties cannot release the promisor (they don't hold the keys) and why the promisor cannot unilaterally withdraw (they gave away the keys).
  *   *Refinement:* Ensure you distinguish between **authority over the action** (command) and **authority over the obligation** (waiver). Promising usually grants the latter, not the former. If I promise to meet you for lunch, you don't get to order me around; you get to hold me to it or let me off.

  **C. Duress and Defective Transfers**
  Your point on duress is excellent and does real work.
  *   It aligns promising with property law (voidable titles).
  *   It strengthens the metaphysical claim: if promising is a transfer, it is subject to the conditions of valid transfer (voluntariness). This is a strong predictive success for your theory.

  ### Summary of Recommendations for Revision

  1.  **Tighten the Metaphysics:** Explicitly address the "Source of Power" objection. Is the power to transfer authority conventional or natural? If conventional, how do you avoid the Practice View circularity?
  2.  **Qualify the Dead:** Distinguish between promises made to the dying (authority transfers while alive) vs. promises made to the dead (authority has no holder). Consider retreating to the former to protect your view.
  3.  **Refine the Analogy:** Shift from "keys to the will" (too strong) to "keys to the obligation" (normative release).
  4.  **Fortify the Competitors:** Acknowledge that Practice Views rely on "fair play" and Reliance Views rely on "induced expectations," then explain why your view handles the *bipolarity* better than both.

  **Verdict:** The core insight (promising as a transfer of normative standing) is robust and does significant explanatory work regarding the specific relationship between promisor and promisee. If you can shore up the metaphysical source of that standing, this will be a strong paper.
