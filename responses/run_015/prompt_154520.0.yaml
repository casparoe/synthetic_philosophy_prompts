  7.  **Final Polish:** Check for clarity, flow, and formal formatting. (Ensure the distinction between *direct* normativity [the rule itself justifies the act] and *indirect* normativity [the rule is a heuristic for a deeper standard] is clear). *Correction:* In this context, the researcher is arguing that the *true* norm is the ideal deliberator's choice, making the rule secondary. The committee usually treats the rule as the direct norm. I need to be precise here. The proposal is to make the "ideal deliberator" the direct norm for *adjudication*, replacing the written rule.

      *Refining the Philosophical Nuance:* The researcher argues that the *source* of normative force is ideal rationality, not the rule. The committee usually operates on the premise that the *source* of normative force for compliance is the established protocol. I need to highlight that shifting the source of normativity mid-stream is procedurally unjust.

