answer: |-
  Here is your Q&A prep sheet. I have ordered these by existential threat to the thesis, not by how interesting the question is.

  ### The "Must Land" Reply
  **The Core Wedge:** You must successfully defend the claim that **gain control is insufficient for precision optimization in the presence of correlated noise.**
  If the committee accepts that synaptic gain $\equiv$ statistical precision in all biologically relevant cases, your "Yield" metric collapses into a rebranded precision term with a cost denominator. You need to land the point that biological gain is a *scalar* (or diagonal) operation on error units, whereas statistical precision is a *matrix* operation. When noise is correlated (which it is, in cortex), diagonal gain cannot whiten the error. Therefore, the system must sometimes *down-regulate* gain on high-variance channels to prevent correlated noise from swamping the hierarchy, even if the "error signal" is loud.
  *   **If this fails:** You are just doing cost-benefit analysis on attention, not splitting precision from gain.

  ### Strategic Concessions (Slide 2)
  Do not burn time fighting these. Concede them early to inoculate against the objections.
  1.  **Concede the Diagonal Case:** Explicitly state that in regimes where noise is independent across channels (diagonal covariance), Yield collapses to Precision-Weighting. You are not claiming precision is *wrong*, only that it is a special case.
  2.  **Concede the "Cost" Latency:** Admit that you are not positing a specific "cost neuron" or instantaneous metabolic meter. Treat "cost" as a slowly learned prior over policy expenses (meta-learning), not an online calculation. This pre-empts the homunculus and anatomical objections.

  ---

  ### The Top 8 Objections (Ordered by Damage)

  #### 1. The Model Comparison Trap
  *   **Who:** Computational Psychiatrist
  *   **The Question:** "You've added a denominator and a new hyperparameter to the objective function. I look at your behavioral fits and they're comparable to the standard Active Inference model. Why should I prefer your model if it doesn't beat the simpler one on held-out data or BIC?"
  *   **90-Second Reply:** "You're right that on *behavioral* data alone, the models are often observationally equivalent. The advantage isn't in fitting choice probabilities; it's in fitting the *physiological* correlates of those choices. Standard precision models predict that high uncertainty always leads to high gain (attention). My model predicts that high uncertainty with high correlated noise leads to *suppressed* gain. I'm not trying to beat the behavioral fit; I'm trying to explain the variance in pupillometry and laminar LFP that the standard model gets wrong."
  *   **Soft Spot:** If your thesis relies *only* on behavioral data, this objection kills you. You need at least one proxy measure (RT variance, pupil dilation, or simulated neural activity) where the models diverge.

  #### 2. The Computability/Homunculus Objection
  *   **Who:** Sympathetic Active Inference Person
  *   **The Question:** "To calculate Yield, the system needs the expected information gain *and* the expected cost. Calculating expected information gain requires integrating over the posterior predictive under a counterfactual policy. Isn't this computationally intractable for a biological system? Are you smuggling in a homunculus that knows the future distribution?"
  *   **90-Second Reply:** "It is intractable if calculated de novo every timestep. But Active Inference already assumes the brain approximates this via the Expected Free Energy (EFE) decomposition. I'm arguing that the 'epistemic value' term in EFE is actually a cached estimate of Yield, updated via reinforcement learning signals (like dopamine) rather than calculated analytically. The brain doesn't compute the integral; it learns the heuristic."
  *   **Soft Spot:** This blurs the line between Inference and Learning. If you push too hard on "it's learned," they will ask why you need a new normative theory at all instead of just a learning rule.

  #### 3. The Parametrization Invariance (Your Fear)
  *   **Who:** Philosopher of Science / Computational Psychiatrist
  *   **The Question:** "Information gain and Fisher Information are not invariant to reparametrization of the latent space. If I change the units of your latent variables, the 'Yield' value changes, and your theory predicts different policies for the same physical system. Is your quantity real, or just an artifact of how you wrote the generative model?"
  *   **90-Second Reply:** "That is a known issue with information-theoretic quantities in continuous spaces. However, biological systems operate in a fixed coordinate system defined by their sensory transducers and receptor densities. The 'notation' is fixed by the anatomy. Yield is invariant relative to the organism's embodied interface, even if it isn't mathematically invariant under arbitrary transforms."
  *   **Soft Spot:** This is the weakest part of your defense. Information *is* parametrization dependent in continuous domains. If they press on "why is the biological coordinate system privileged?", you have to fall back on evolutionary priors. **Warning:** This is the "worse lurking" issue. See below.

  #### 4. The Anatomical Substrate of Cost
  *   **Who:** Systems Neuroscientist
  *   **The Question:** "I can buy gain control on superficial pyramidal cells. I can't buy 'metabolic cost' as a signal that gets divided into the error stream. Where in the cortical microcircuit does the division happen? Are you proposing a specific interneuron class that encodes the denominator?"
  *   **90-Second Reply:** "I'm not proposing a literal division operation in the membrane potential. I'm proposing that the 'cost' modulates the *prior* over policies at a slower timescale, likely in the basal ganglia or via neuromodulatory tone (e.g., serotonin signaling effort), which then gates which precision-optimizing policies are selected by cortex. The division is functional, not necessarily synaptic."
  *   **Soft Spot:** If you can't point to a plausible circuit (even hypothetically), the neuroscientist will treat "Yield" as a behavioral description, not a neural mechanism.

  #### 5. The "Just-So" Story Charge
  *   **Who:** Philosopher of Science
  *   **The Question:** "If the system turns gain up, you say it's optimizing Yield. If it turns gain down, you say it's saving Cost. Isn't 'Cost' just a free parameter you tune to make the data fit? How is this different from saying the system minimizes Free Energy, which can explain anything?"
  *   **90-Second Reply:** "It restricts the solution space. Pure FEP allows for wasteful solutions (high gain, high cost) as long as surprise is minimized. Yield *penalizes* those solutions. It makes a falsifiable prediction: there are states where the system should tolerate higher prediction error because the cost of reducing it is too high. Standard FEP doesn't predict that trade-off explicitly."
  *   **Soft Spot:** You must define the cost function independently of the behavior. If cost is inferred *from* the behavior, the philosopher is right.

  #### 6. The Priority Claim (Active Vision)
  *   **Who:** Vision Scientist
  *   **The Question:** "We've been modeling saccades as information gain vs. effort since the 90s (Itti, Koch, Hayhoe). What does 'Yield' buy me over a standard salience map with a saccadic cost penalty?"
  *   **90-Second Reply:** "Standard salience maps are usually heuristic. Yield derives the trade-off from the generative model's uncertainty structure. Specifically, it accounts for the *correlation* structure of the noise. In standard active vision, you reduce uncertainty by looking. In Yield, you might avoid looking if the noise structure makes the sample uninformative relative to cost, even if the local error is high."
  *   **Soft Spot:** If you haven't cited the active vision literature extensively, they will assume you reinvented the wheel.

  #### 7. The EFE Redundancy
  *   **Who:** Sympathetic Active Inference Person
  *   **The Question:** "Expected Free Energy (EFE) already has an ambiguity term (information gain) and can include prior preferences over states (which can encode cost). Why do we need a new quantity? Why not just say you're tweaking the weighting of the epistemic term in EFE?"
  *   **90-Second Reply:** "Because in standard EFE, the epistemic value is weighted by precision. I'm arguing that precision is the *output* of the Yield optimization, not the *weight* of the term. By making it a ratio, we capture the diminishing returns of information seeking that a linear weighting in EFE misses."
  *   **Soft Spot:** This is a mathematical distinction that might be semantically thin. Be prepared to show an equation where EFE fails and Yield succeeds.

  #### 8. The Operationalization Challenge
  *   **Who:** Computational Psychiatrist / Neuroscientist
  *   **The Question:** "Okay, I believe the theory. How do I measure Yield in a patient? I can measure reaction time and accuracy. I can't measure 'expected information gain'."
  *   **90-Second Reply:** "You measure the dissociation. In a task with high correlated noise, standard models predict increased arousal/attention. Yield predicts decreased engagement. You look for patients who show 'apathy' (low gain) despite high prediction errors, and test if their noise environment is correlated. It turns a bug into a feature."
  *   **Soft Spot:** This is your future work. Don't overpromise on clinical readiness.

  ---

  ### The Question You Hope Nobody Asks (And The Worse Lurking Issue)

  **Your Fear:** Parametrization dependence.
  **My Assessment:** You are right to fear this, but there is something sharper.

  **The Question:** "To calculate Expected Information Gain, you need the posterior distribution *after* the observation. To calculate Yield *before* the action (to select the policy), you need to integrate over the *predicted* posterior. But the predicted posterior depends on the observation you haven't seen yet. You are assuming the system can simulate the update rule for data it doesn't have. If the system's internal model of its own learning is wrong, Yield is garbage. How do you ensure the 'Expected' in Expected Information Gain is computable without infinite regress?"

  **Why this is worse:** Parametrization is a mathematical nuisance; this is a **computational impossibility** objection. It attacks the feasibility of the numerator.
  **The Defense:** You must lean heavily on the "Concession" that this is a *learned heuristic* (cached value), not an online calculation. The system doesn't compute the expectation; it learns the *correlation* between policy types and historical information gains.

  **Final Advice:**
  If the Parametrization question comes up, do not bluff. Admit it is a limitation of continuous information theory, but emphasize that biological systems are discrete and bounded (spikes, finite neurons), which regularizes the problem. If the Computability question comes up, pivot immediately to "Learned Priors."

  Good luck. You have a solid wedge; don't let them hammer it flat.
