prompt: |-
  I've got my thesis defense in three weeks, and the chapter I'm going to actually get grilled on is my attempt to split apart two things the predictive processing literature treats as one thing. Sketch of the argument, so you know what to aim at:

  1. There's precision in the formal sense: the inverse variance, or more generally the precision matrix, over prediction errors under the system's own generative model.
  2. There's precision in the wet sense: the synaptic gain / excitability of the units carrying errors up the hierarchy, which is what people mean when they say attention just is precision optimization, and which usually gets cashed out anatomically as gain on the superficial pyramidal cells in the canonical cortical microcircuit, under neuromodulatory control.
  3. The bridge claim that makes (2) an implementation of (1) is never stated, and I argue it isn't generally true. Gain-scaling and precision re-weighting come apart whenever the noise is correlated across channels, and they come apart again whenever the organism can reduce noise by moving its sensors rather than by turning up the volume on the error signal. So I swap the whole framing for a quantity I'm calling yield: expected information gain about the model's own latents, expected under a candidate policy, divided by the expected metabolic and computational cost of getting it. Precision optimization falls out as the special case where the only free knob is a scalar gain and costs are flat across channels. And I claim this buys something empirically: it predicts dissociations, cases where the system should turn gain down even though the error signal is getting louder, and vice versa.

  The room, as precisely as I can describe it: a computational psychiatrist who fits hierarchical Bayesian models to behavior and mostly cares about model comparison and whether my quantity beats a simpler one on held-out data; a systems neuroscientist who does laminar recordings and thinks most of predictive processing is unmoored from anatomy; a philosopher of science who has the standing worry that the free energy principle is a redescription of any adaptive system whatsoever rather than an empirical claim, and who will want to know whether bolting a denominator onto it changes that; a vision scientist who will point out that expected information gain is already a working idea in the active vision and saccade literature; and one sympathetic active inference person who will ask whether any of this scales down to really simple systems, or whether it smuggles in a homunculus.

  What I want is a Q&A prep sheet. Give me the eight or so objections I'll actually get, ordered by how much damage they'd do rather than by how clever they are, each phrased the way that particular person would phrase it rather than in neutral philosopher-speak, with who is likely to raise it, a reply I can give in about 90 seconds, and a note on where that reply is soft. Tell me what I should concede in the first two slides instead of fighting for, and what the one reply is that has to land or the chapter doesn't survive.

  Two more things. First, I've been reading rationalist blogs since the Sequences days, so I can generate the generic moves myself: map versus territory, that's not even wrong, steelman the other side, is this falsifiable. Skip those and give me the domain-specific versions. Second, include the question I'm hoping nobody asks. I think mine is something like: information gain is parametrization-independent in a way that precision isn't, so two formally equivalent ways of writing the same generative model will give different values of your quantity, and then your theory predicts different behavior depending on notation. But I'd like you to tell me if there's something worse lurking that I haven't seen coming.
