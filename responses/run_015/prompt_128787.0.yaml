          7.  Conclusion 1: Rationality requires suspending judgment on all contingent claims (Global Skepticism).
          8.  Conclusion 2: Total suspension is practically self-defeating (Pragmatic Contradiction).
          9.  Final Dilemma: Either (3) fails, or rationality is incompatible with empirical belief.
      *   **User's Preference:** Preserve (3) [General Principle] and (8) [Pragmatic Constraint]. Willing to reject (4) [Action-to-Belief Extension] or (5) [Modal Slide/Skeptical Scenario].
