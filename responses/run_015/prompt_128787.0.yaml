      *   **Hypothesis C: The Modal Slide (Step 5).**
          *   Step 5 says: "One can construct a skeptical scenario... in that scenario, holding B does not contribute to B's truth."
          *   The Principle (3) requires that the conditions for success are not self-defeating *actually*, or *in all possible worlds*, or *in the nearest possible worlds*?
