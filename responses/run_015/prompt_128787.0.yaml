          *   In the Luring Lottery, the payoff *causally* or *logically* depends on the mental state. If I want it, I lose it. The connection is internal to the game rules.
          *   In the Skeptical Scenario (Step 5), the connection is external. My holding belief $B$ (Water on Mars) does not *make* $B$ false. The skeptical scenario (Brain in a Vat) makes my justification unreliable, but holding the belief doesn't *cause* the unreliability in the same way wanting the ticket causes the loss.
