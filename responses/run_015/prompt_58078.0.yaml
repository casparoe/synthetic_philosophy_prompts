answer: |-
  Here is a 15-minute practice exam question designed specifically for your Intro Stats midterm, using your Esports data.

  I have designed the **Marking Scheme** to be very strict on the explanation part, exactly as you requested. It distinguishes between students who just do math and students who actually understand *why* the paradox happens.

  ***

  # Practice Midterm Question: Simpson's Paradox (15 Minutes)
  **Total Marks: 10**

  **Context:**
  Two Esports teams, the **Falcons** and the **Owls**, competed in a tournament featuring two map types: **Easy** and **Hard**. The table below shows the number of rounds won versus total rounds played for each team on each map type.

  | Team | Map Type | Rounds Won | Total Rounds |
  | :--- | :--- | :--- | :--- |
  | **Falcons** | Easy | 9 | 10 |
  | | Hard | 27 | 90 |
  | **Owls** | Easy | 80 | 90 |
  | | Hard | 2 | 10 |

  **Questions:**

  1.  **(4 marks)** Calculate the Win Percentage for both teams on the **Easy** map, the **Hard** map, and the **Overall** Total. Show your work.
  2.  **(2 marks)** Based on your calculations in Part 1, describe the contradictory trend observed in the data.
  3.  **(4 marks)** Explain *why* this paradox occurred. Specifically, identify the lurking variable and explain how the sample distribution affected the overall result.
      *   *Note: Stating that "the statistics are misleading" or "the data is wrong" will receive zero marks for this section.*

  ***

  # Model Answer (Top-Tier Response)

  **1. Calculations (4 marks)**
  *   **Easy Map:**
      *   Falcons: $9 \div 10 = 90\%$
      *   Owls: $80 \div 90 = 88.9\%$
  *   **Hard Map:**
      *   Falcons: $27 \div 90 = 30\%$
      *   Owls: $2 \div 10 = 20\%$
  *   **Overall Total:**
      *   Falcons: $(9 + 27) \div (10 + 90) = 36 \div 100 = 36\%$
      *   Owls: $(80 + 2) \div (90 + 10) = 82 \div 100 = 82\%$

  **2. Contradictory Trend (2 marks)**
  When looking at the subgroups (Easy and Hard maps separately), the **Falcons** have a higher win percentage on both map types. However, when looking at the overall total, the **Owls** have a significantly higher win percentage. The trend reverses when the data is aggregated.

  **3. Explanation (4 marks)**
  This is an example of Simpson's Paradox caused by a **confounding variable** (Map Difficulty) and **unequal weighting**.
  *   **The Lurking Variable:** Map Difficulty drastically changes the win rate (Easy maps have much higher win rates for both teams than Hard maps).
  *   **The Weighting:** The Owls played mostly Easy maps (90 out of 100), where winning is easier. The Falcons played mostly Hard maps (90 out of 100), where winning is difficult.
  *   **Conclusion:** The Owls' overall average is "weighted" heavily toward the high-scoring Easy maps, while the Falcons' average is weighted toward the low-scoring Hard maps. The data is not wrong; the overall average hides the difference in map difficulty distribution.

  ***

  # Marking Scheme & Grader Notes

  ### Part 1: Calculations (4 Marks)
  *   **1 mark:** Correct Falcons Easy % (90%)
  *   **1 mark:** Correct Owls Easy % (88.9% or 8/9)
  *   **1 mark:** Correct Falcons Hard % (30%)
  *   **1 mark:** Correct Owls Hard % (20%)
  *   *(Note: Overall totals are required for Part 2, but if they calculate Overall here correctly, do not penalize. If they calculate Overall incorrectly here but use their wrong number consistently in Part 2, follow "Error Carry Forward" rules but cap Part 2 marks.)*

  ### Part 2: Trend Identification (2 Marks)
  *   **1 mark:** Explicitly states Falcons win on individual maps (subgroups).
  *   **1 mark:** Explicitly states Owls win on the overall total (aggregate).
  *   *Deduction:* If they say "The trends are different" without specifying who won which, max 1 mark.

  ### Part 3: Explanation (4 Marks) - **CRITICAL SECTION**
  *   **1 mark:** Identifies **Map Difficulty** as the confounding/lurking variable.
  *   **1 mark:** Notes that **Easy Maps have higher win rates** generally (for both teams).
  *   **1 mark:** Notes the **Sample Size Imbalance** (Owls played mostly Easy; Falcons played mostly Hard).
  *   **1 mark:** Uses the concept of **Weighted Average** (or explains that the overall % is pulled up/down by the map distribution).

  ### **Automatic Zero Triggers (Part 3)**
  *   **0/4 Marks** if the student writes: "The statistics are lying," "The data is misleading," or "The sample is biased." (The data is accurate; the interpretation requires nuance).
  *   **0/4 Marks** if the student claims the math was calculated incorrectly.

  ### **Common Mistake: Simpson's vs. Base Rate**
  *   **Deduction (-1 mark):** If the student uses the term **"Base Rate Fallacy."**
      *   *Why?* The Base Rate Fallacy is about ignoring prior probabilities in Bayesian inference (e.g., medical testing). Simpson's Paradox is about **aggregation bias** and **confounding variables**.
      *   *Correct Terminology:* Confounding Variable, Lurking Variable, Weighted Average, Aggregation Bias.
      *   *Note:* If they describe the *concept* correctly (uneven map distribution) but just use the wrong name ("Base Rate"), give them 3/4 marks. If they describe the concept *incorrectly* (e.g., "Owls won because they had a higher base rate of skill"), give 0/4.

  ***

  # Study Tips for Your Midterm

  **1. Why "Stats Lie" gets Zero:**
  In statistics, data is factual. $9/10$ is $90\%$. That is not a lie. The paradox exists because **averages hide details**. When you combine the groups, you lose the information about *which* map was played. Examiners want to see that you trust the math but understand the **context**.

  **2. How to avoid confusing it with Base Rates:**
  *   **Base Rate Fallacy:** Usually involves **Probability of an Event** given a Test Result (e.g., "I tested positive, what are the odds I'm sick?"). It ignores how rare the disease is in the general population.
  *   **Simpson's Paradox:** Involves **Comparing Two Groups** (Falcons vs. Owls). It ignores how the groups are **composed** (Map Difficulty).
  *   **Memory Hook:** If you are comparing **Group A vs Group B** and the winner flips when you combine them, it is **Simpson's**. If you are calculating the chance of a **Single Event** based on new evidence, it is **Base Rate**.

  **3. The "Weighting" Keyword:**
  To guarantee full marks on the explanation, use the word **"Weighted."**
  *   *Bad:* "The Owls played more easy maps."
  *   *Good:* "The Owls' overall score is **weighted** heavily toward the Easy maps because 90% of their games were on that map."
