      *Wait, on "Fact of the matter":* If the physical process is unspecified, there is no fact of the matter. If the physical process *is* specified (e.g. "throw straws"), there *is* a fact of the matter (empirical frequency). The text conflates "undefined problem" with "subjective probability."

