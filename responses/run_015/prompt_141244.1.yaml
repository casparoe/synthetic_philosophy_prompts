answer: |-
  There is no single canonical proper noun for this specific configuration (like "Prisoner's Dilemma" or "Braess's Paradox"), but you have accurately described a distinct failure mode that sits at the intersection of three established concepts.

  If you need a label to use in conversation or documentation, the most precise term is **Adverse Volunteer Selection**.

  It is not merely the Winner's Curse glued to Adverse Selection. The visibility and the ordering do real work, transforming the game from a simultaneous probability calculation into a sequential timing game.

  Here is the breakdown of what this is, what it isn't, and why the distinction matters for your fixes.

  ### 1. The Anatomy of the Problem

  You are describing a **Volunteer's Dilemma** played as a **War of Attrition** with **Negative Competence Correlation**.

  *   **Base Game (Volunteer's Dilemma):** A public good is produced if *at least one* person acts. If no one acts, everyone loses. If someone acts, they pay a cost, and everyone benefits.
  *   **The Mechanism (War of Attrition):** Because the chat/dashboard is visible, this is not simultaneous. It is a game of "who blinks first." The "cost" is not the effort of the email or the hotfix; the cost is the *psychological disutility of waiting* while the problem remains unresolved.
  *   **The Failure Mode (Adverse Selection):** In a standard model, the person with the lowest cost of acting volunteers. In your model, the "cost of acting" is defined by "tolerance for uncertainty." The person with the lowest tolerance (highest impatience) acts first. Crucially, this trait (impatience/low risk tolerance) is negatively correlated with the trait you actually want (competence/risk assessment).

  **Why "Winner's Curse" is the wrong label:**
  The Winner's Curse (in auctions) happens because value is uncertain and common. Bidders overestimate value; the winner is the one who overestimated the most.
  In your scenario, value isn't the issue. The issue is **thresholds**. The "winner" (the person who ends up doing the task) isn't the one who overestimated the benefit; they are the one who *underestimated the value of waiting*. It is a curse of **impulse**, not valuation.

  **Why "Bystander Effect" is the wrong label:**
  The Bystander Effect (Diffusion of Responsibility) predicts $P(\text{action}) \to 0$ as group size increases. Your phenomenon predicts $P(\text{action}) \to 1$, but $E[\text{competence}] \to \min$. The Bystander Effect leads to paralysis; your phenomenon leads to *sabotage by the well-meaning*.

  ### 2. Does Visibility Do Real Work?

  **Yes.** This is the critical mechanical distinction.

  *   **Simultaneous (The Curse):** If everyone had to decide in a vacuum without seeing the chat, you would get a probability collision. Multiple people might email the hall owner. The risk is *duplication*.
  *   **Sequential/Observable (Your Case):** Because everyone sees the chat is silent, the decision becomes dynamic. Every second that ticks by is a signal: "No competent person has acted yet."
      *   The competent people interpret the silence as: "The situation is not yet critical enough to risk a bad email."
      *   The incompetent people interpret the silence as: "Why is no one fixing this? I must do it."

  The visibility turns the "cost of waiting" into a bid. The person who bids the lowest (can wait the least time) wins the task. Because the "bid" is impatience, and impatience correlates with incompetence, the system systematically selects for the worst operator.

  ### 3. Boundary Cases & Edge Conditions

  You asked where the lines are drawn. Here is the topology of the problem:

  *   **If the correlation flips (Impatient = Competent):** The phenomenon disappears. The system becomes efficient. The person who notices the problem fastest is also the person best equipped to fix it. This is the ideal "Owner-Operator" model.
  *   **If everyone is equally competent:** It reverts to a standard **Volunteer's Dilemma**. The risk is purely duplication (two emails), not quality degradation. The "curse" is wasted effort, not active harm.
  *   **If duplication is merely wasteful (not harmful):** It is still this phenomenon, but the stakes are lower. If two hotfixes just waste CPU cycles rather than taking the site down, you have an **Efficiency Problem**, not a **Risk Problem**. The selection mechanism is the same, but the penalty for failure is reduced.
  *   **If the task requires consensus:** The mechanism breaks. If one email isn't enough, the impatience of one person doesn't trigger the outcome. This requires a **Threshold Public Good** game, which changes the incentives entirely.

  ### 4. The Remedies (Why the Name Matters)

  You are correct that the remedies for this are distinct from the remedies for the Winner's Curse or the Tragedy of the Commons.

  *   **Winner's Curse Remedy:** Restraint. Bid less. Shade your valuation. (Don't act).
  *   **Tragedy of the Commons Remedy:** Privatization or Quotas. (Limit action).
  *   **Adverse Volunteer Selection Remedy:** **Decouple Action from Impatience.**

  Because the driver is the *correlation* between impatience and action, you must break that link.

  1.  **Remove the Choice (Assignment):** This is the most robust fix. If the rota assigns the "Hotfix Token" to Person A, Person B *cannot* act even if they are impatient. This eliminates the War of Attrition entirely.
  2.  **Artificial Friction (Throttling):** Make the "impulsive" action harder than the "deliberate" action.
      *   *Example:* The email address for the hall owner is hidden in a wiki page that requires a login, or the hotfix requires a second approval key held by a senior engineer. This increases the "cost of acting" for everyone, but disproportionately for the impulsive/less competent, who are less likely to navigate the friction.
  3.  **Subsidize Patience:** Make waiting cheaper for the competent.
      *   *Example:* "If the config isn't fixed in 1 hour, the on-call senior gets paged." This lowers the anxiety for the juniors. They know a safety net exists, so their "cost of waiting" drops, allowing the competent person to act before the panic threshold is reached.
  4.  **Signal Competence:** If the competent people can signal "I am watching this, stand down," the impatience of the juniors is neutralized.
      *   *Example:* A reaction emoji on the chat message ("👀"). This costs nothing for the senior, but tells the juniors "Action is pending," raising their tolerance for waiting.

  ### 5. Proposed Definition

  If you need to write this down for your organisation, use this definition:

  > **Adverse Volunteer Selection:** A coordination failure in visible, sequential environments where a task requires exactly one actor. The selection mechanism relies on individual tolerance for uncertainty (impatience). If tolerance for uncertainty is negatively correlated with task competence, the system systematically selects the least competent available actor to perform the task.
  >
  > **Distinct from:** *Winner's Curse* (valuation error vs. tolerance error), *Bystander Effect* (inaction vs. misguided action), *War of Attrition* (winning by waiting vs. losing by acting).
  >
  > **Primary Mitigation:** Remove voluntary selection via assignment, or introduce friction that decouples impulsivity from execution capability.

  ### Summary

  You haven't just redescribed a special case; you've identified a specific **mechanism design flaw**. The standard Volunteer's Dilemma assumes symmetric costs. You have identified what happens when costs are asymmetric and correlated with the wrong variable.

  It is distinct enough that treating it as a standard "coordination problem" will lead you to the wrong fix (asking people to be more careful). The fix is not cultural; it is structural. You must change the rules of the game so that "being the most impatient" no longer grants you the right to act.
