      *(Self-Correction on Ordering)*: The Eval Person's objection is probably the most dangerous because it undermines the *motive* of the talk. The Economist's is dangerous because it undermines the *rigor*. The ML Skeptic is dangerous because it undermines the *premise*. I'll put the Economist first (rigor), then Eval (motive), then ML Skeptic (premise).

