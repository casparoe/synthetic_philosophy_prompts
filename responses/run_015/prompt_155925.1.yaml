answer: |-
  You have identified a sophisticated structural problem in social science and political philosophy. To answer your primary question directly: **No, there is no single, canonical term** that captures this exact tripartite configuration (one empirical regularity + mutually exclusive causal ontologies + inverted normative implications).

  However, the configuration you describe is a recognized composite of problems discussed across econometrics, philosophy of science, and political theory. If you need to label it in discourse, you are describing a case of **Normatively Inverted Observational Equivalence**.

  Here is a mapping of the conceptual edges you requested, delineating this structure from standard underdetermination, the non-identity problem, and equivocation.

  ### 1. The Empirical Core: Observational Equivalence
  In econometrics and the philosophy of science, **observational equivalence** occurs when two or more distinct theoretical models generate identical empirical predictions or data patterns.
  *   **How it fits:** The "Gender-Equality Paradox" data is observationally equivalent for the Essentialist (nature revealed) and the Constructivist (culture amplified) models. Both predict higher segregation in high-equality societies, but for opposite reasons.
  *   **The Distinction:** Standard observational equivalence is usually treated as a technical hurdle to be solved by finding better instruments or natural experiments. In your configuration, the equivalence is **ontologically sticky**. It cannot be resolved by better data because the disagreement is not about the *parameters* of the model, but about the *nature of the agent* (is preference pre-social or post-social?).

  ### 2. The Normative Core: Normative Underdetermination
  You correctly noted that this exceeds standard **underdetermination of theory by data** (the Duhem-Quine thesis). Standard underdetermination suggests that evidence is insufficient to decide between theories, implying we should suspend judgment or gather more data.
  *   **The Distinction:** In your configuration, the underdetermination is **normatively productive**. The ambiguity is not a bug; it is a feature that allows opposing political projects to claim the same evidence.
  *   **The Mechanism:** This is specifically **Normative Underdetermination**. The empirical fact does not dictate the moral status of the outcome.
      *   *Story A (Essentialist):* Disparity = Autonomy (Good).
      *   *Story B (Constructivist):* Disparity = Socialization (Bad/Neutral).
      *   *Story C (Proceduralist):* Disparity = Irrelevant (Just).
      *   Because the *moral valence* of the disparity flips depending on the unprovable causal story, the evidence is normatively underdetermined.

  ### 3. The Rhetorical Core: Interpretive Flexibility
  In Science and Technology Studies (STS), specifically the Social Construction of Technology (SCOT) framework, there is a concept called **interpretive flexibility**. This describes how an artifact or fact can be interpreted differently by different "relevant social groups."
  *   **How it fits:** The statistical correlation acts as a "boundary object." It is robust enough to be accepted by all parties (it is a "shared premise"), but plastic enough to be molded into incompatible narratives.
  *   **The Distinction:** Unlike simple **equivocation** (using a word like "choice" in two senses), this is not a linguistic error. It is a structural feature of social ontology. The word "choice" *actually means different things* in the different frameworks (revealed preference vs. constrained agency). The argument isn't falling into equivocation; it is highlighting that "choice" is an **essentially contested concept** (W.B. Gallie) when applied to this data.

  ### 4. Why it is not the Non-Identity Problem
  The **non-identity problem** (Parfit) concerns actions that change *who* comes into existence, making it hard to claim harm to those specific individuals.
  *   **The Distinction:** Your problem is not about future generations or identity constitution. It is about **causal attribution in existing populations**. It is a problem of *explanation*, not *existence*.

  ### 5. Proposed Terminology for the Configuration
  Since no single term exists, you can delineate the edges of this problem by using the following descriptive framework. You are dealing with an **Ontological Pivot Point**.

  This configuration has three specific characteristics that distinguish it from generic underdetermination:

  1.  **Causal Inversion:** The competing theories do not just offer different weights for the same causes; they posit opposite causal directions (Nature $\to$ Choice vs. Culture $\to$ Choice).
  2.  **Normative Flipping:** The evaluation of the outcome (Segregation) inverts from "Justice Achieved" to "Justice Failed" based entirely on the unobservable causal story.
  3.  **Policy Inertia/Activation:** The same data is used to argue for *deregulation* (Story A & C) and *intervention* (Story B).

  ### How to Name It in Discourse
  If you need a label to anchor your discussion, I recommend one of the following, depending on your audience:

  *   **For Philosophers:** "A case of Normatively Inverted Observational Equivalence."
  *   **For Political Scientists:** "A Polysemic Policy Pivot."
  *   **For General Discourse:** "The Rorschach Correlation." (This captures the idea that the data reveals more about the observer's theoretical commitments than the phenomenon itself).

  ### Summary of the Edges
  *   **Edge vs. Underdetermination:** Standard underdetermination implies a temporary lack of data. Your configuration implies a permanent ontological divide that data cannot bridge.
  *   **Edge vs. Equivocation:** Equivocation implies a fallacy of language. Your configuration implies a legitimate clash of social ontologies (what *is* a preference?).
  *   **Edge vs. Non-Identity:** This is about the interpretation of current agency, not the ethics of future existence.

  You have effectively identified that the "Gender-Equality Paradox" is not just a sociological finding, but a **metaphysical battleground** disguised as a statistical correlation. The correlation functions as a **neutral premise** that validates **contradictory conclusions**, which is the hallmark of a deeply entrenched ideological stalemate rather than a solvable empirical puzzle.
