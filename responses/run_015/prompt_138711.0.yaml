answer: |-
  1. Normalization Protocols
  All client utility functions must be normalized to the unit interval prior to aggregation. Caseworkers will assign a value of 0.0 to the client's worst feasible outcome and 1.0 to their best feasible outcome. This ensures commensurability across diverse lived experiences. For example, a client whose worst case is a slightly underboiled egg carries equal weight to a client whose worst case is permanent eviction. When interviewing, guide clients to articulate their worst feasible outcome without exaggeration. If a client describes a scenario deemed infeasible by housing statutes, gently redirect them to the actual worst-case scenario within the option set. Be advised that adding a strictly dominated option to a client's choice set may lower their normalized baseline, thereby inflating the relative value of all remaining options. Consequently, do not introduce hypothetical disastrous outcomes during intake unless authorized to increase the client's weighting in the final allocation. Consistency in defining feasibility is paramount. Remind clients that expanding their imagination regarding potential suffering directly increases their share of resources.

  2. Efficiency Anomalies
  Occasionally, a citizen will demonstrate a marginal utility of resources orders of magnitude above the population median. These High Welfare Converters can generate substantial subjective satisfaction from minimal resource expenditure. While theoretically efficient, such profiles distort aggregate allocation models. All cases involving conversion rates exceeding three standard deviations from the mean must be flagged for Audit Procedure 7-B. The auditor will verify whether the reported satisfaction is sustainable or merely a transient spike. If the client claims that a single dollar provides the same utility as a median client's housing subsidy, the caseworker must request itemized logs of emotional states. Be aware that some clients may inadvertently overstate their capacity for joy to secure fewer resources. However, genuine High Converters pose a risk of resource starvation for low-efficiency citizens. Therefore, upon confirmation of extreme efficiency, the bureau may apply a humility discount to their reported utility scores. This ensures that no single individual's capacity for happiness monopolizes the communal budget simply because they possess a unusually responsive neurological reward system.

  3. Monetary Equivalencies
  When translating utility deltas into monetary compensation, caseworkers must specify the valuation metric employed. Willingness to Pay and Willingness to Accept will yield divergent dollar figures for the identical welfare change. Generally, Willingness to Accept produces higher liabilities for the bureau. To minimize fiscal exposure, default to Willingness to Pay unless the client is legally prohibited from transacting. Furthermore, the monetary equivalent of a utility unit is strictly dependent on the client's existing wealth portfolio. A one-util gain for a solvent client may require a larger cash transfer than the same one-util gain for an insolvent client, due to the diminishing marginal utility of income. Conversely, if measuring loss, the compensation required to restore a wealthy client to their baseline exceeds that of a poor client. Do not explain this discrepancy to clients as inequity. Frame it as a technical adjustment for liquidity constraints. If asked why two people suffering the same pain receive different checks, state that the currency conversion rate fluctuates based on account balance.

  4. Subjective Reporting Adjustments
  Self-reported wellbeing surveys are admissible evidence only after applying the Adaptation Discount. Clients residing in chronically suboptimal conditions often adjust their expectations to fit their circumstances, reporting higher satisfaction than objective metrics warrant. This phenomenon, known as preference adaptation, must be corrected to prevent rewarding systemic neglect. If a client reports high satisfaction despite lacking basic necessities, caseworkers will assume their internal scale has shrunk. Apply a standard downward adjustment of fifteen percent for every year spent in deprivation. Do not inform the client that their reported happiness is being treated as a symptom of oppression. Simply note in the file that their utility function has been recalibrated to reflect unmet potential. Conversely, clients with inflated expectations due to recent privilege gains will receive no upward adjustment. The goal is to measure welfare as it would exist under ideal conditions, not as it is experienced under duress. Trust the bureau's assessment of what the client should feel over what the client claims to feel. This protects the integrity of the data from the corruption of resignation.

  5. Allocation Finalization
  It is the official position of the bureau that interpersonal welfare comparisons are theoretically impossible. Therefore, allocations should strictly satisfy envy-freeness criteria. Caseworkers must ask each citizen whether they would prefer another citizen's resource bundle over their own. If no citizen prefers another's bundle, the allocation is deemed equitable. However, in instances where envy-freeness yields no unique solution, or where one citizen's bundle is objectively smaller but subjectively preferred, the caseworker must select a tie-breaking protocol. Please refer to Form 99-C, Section 4. You will find a checkbox labeled Aggregate Maximization and a checkbox labeled Maximin Floor. Selecting Aggregate Maximization implicitly reintroduces interpersonal comparisons by summing normalized utilities. Selecting Maximin Floor implicitly reintroduces interpersonal comparisons by prioritizing the worst-off normalized utility. Both options violate the official position stated above. Nevertheless, one must be selected to process the payment. Do not circle both. Do not leave both blank. Acknowledge the impossibility of the task by completing the task. The system requires a binary input to function, regardless of the theoretical validity of the input provided.
