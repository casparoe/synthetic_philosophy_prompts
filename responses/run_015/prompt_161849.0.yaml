answer: |-
  # STANDARD OPERATING PROCEDURE: MENTAL STATE ASCRIPTIONS (MSA-04)
  **Effective:** Immediately  
  **Time Budget:** 10 Minutes per query  
  **Authority:** Standards Desk (Legal referral required only if Step 4 fails)  
  **Scope:** Verbs implying knowledge, intent, choice, or awareness (e.g., *knew, intended, decided, ignored, deliberately, consciously*).

  ---

  ## PART 1: THE DECISION TREE

  ### Step 1: Classify the Subject (1 Minute)
  Identify the agent performing the action.
  *   **Human:** Individual person.
  *   **Corporate:** Company, agency, hospital, city.
  *   **Model:** AI, algorithm, autonomous system.

  **Rule:**
  *   **Human:** Proceed to Step 2.
  *   **Corporate:** Proceed to Step 2, but apply **Vicarious Knowledge Rule** (see Step 3).
  *   **Model:** **STOP.** Do not use mental state verbs (*knew, decided, intended*) unless quoting a human source directly. Use functional verbs (*processed, generated, executed, continued*).
      *   *Rationale:* Readers attribute blame to models based on harm severity (Knobe asymmetry), not evidence. Using mental verbs validates anthropomorphism and invites liability.

  ### Step 2: The Mirror Test (3 Minutes)
  *Keep your existing test, but tighten the pass/fail criteria.*
  Rewrite the sentence changing *only* the outcome valence (Bad → Good or Neutral), keeping evidence and agent identical. Ask two colleagues: "Does the verb still fit?"

  *   **If colleagues agree (Verb holds for Good and Bad):** The verb is descriptive. **Proceed to Step 3.**
  *   **If colleagues flip (Verb holds for Bad, not Good):** The verb is doing moral work.
      *   **Action:** You must swap the verb. You cannot fix this by reordering evidence.
      *   *Why:* Research suggests "intentional" and "knew" function partly as moral judgments (like *cruel*) when outcomes are bad. If the judgment flips on valence, the word is contaminated.
      *   *Swap List:*
          *   *Deliberately/Intentionally* → *Knowingly* (if evidence exists) or *While aware of*
          *   *Ignored* → *Did not address* or *Declined to act on*
          *   *Knew* → *Was informed of* or *Had data showing*

  ### Step 3: The Evidence Chain (4 Minutes)
  *Keep your existing "Evidence-First" principle, but apply specific thresholds.*
  Draft the sentence to state **what data existed** and **who held it** before stating **what happened**.

  *   **Threshold for Humans:** Direct evidence (email, testimony, recording) showing awareness before action.
  *   **Threshold for Corporations (Vicarious Knowledge Rule):** A corporation "knows" only if a person with **authority to act** on the information knew it.
      *   *Fail:* Mid-level engineer knows, leadership does not. → *Use:* "Engineers informed leadership..." or "Internal tickets showed..."
      *   *Pass:* C-suite or designated decision-maker knows. → *Use:* "The company knew..."
  *   **Threshold for Models:** See Step 1 (Functional verbs only).

  ### Step 4: The Verdict (2 Minutes)
  *   **Pass:** Verb survives Mirror Test + Evidence Chain meets threshold.
  *   **Fix:** Verb swapped (Step 2) OR Subject clarified (Step 3).
  *   **Refer to Legal:** If the story relies on the *moral weight* of the verb to make its point (e.g., "They didn't just fail, they *chose* to fail") and the evidence only supports negligence. This is a values call dressed as fact.

  ---

  ## PART 2: EVALUATION OF EXISTING HOUSE TESTS

  **1. The Mirror Test**
  *   **Verdict:** **KEEP.**
  *   **Why:** It directly tests the Knobe asymmetry. If the verb stops working when the outcome is good, you are publishing a moral judgment disguised as a fact.
  *   **Where it misfires:** It relies on colleagues' intuitions, which may vary. *Fix:* Use the specific "Swap List" in Step 2 if the test fails, rather than debating why.

  **2. Evidence-First Ordering**
  *   **Verdict:** **KEEP WITH MODIFICATION.**
  *   **Why:** Separating data from inference reduces the "blame leak" (performance error).
  *   **Where it misfires:** It doesn't solve the Corporate Knowledge problem. A sentence can list evidence first but still imply the corporation "knew" when only a subordinate did. *Fix:* Apply the Vicarious Knowledge Rule in Step 3.

  ---

  ## PART 3: CASE STUDY RUNTHROUGH

  ### Case 1: St. Aubrey Medical Center (Ventilator Alarms)
  *Sentence:* "St. Aubrey Medical Center knew the ventilator alarms had been failing for months and kept the units in service."
  *Evidence:* Internal ticket + email from mid-level biomedical engineer to manager. No evidence it reached clinical leadership.

  1.  **Subject:** Corporate (Hospital).
  2.  **Mirror Test:** "St. Aubrey knew the alarms were *exceeding* safety standards..." (Colleagues likely say "No, they hoped/assumed," not "knew"). *Risk:* High.
  3.  **Evidence Chain:** Vicarious Knowledge Rule fails. Mid-level engineer ≠ Authority to act. The hospital as a unit did not "know."
  4.  **Verdict:** **FAIL.**
  5.  **Correction:** "Internal tickets showed the ventilator alarms had been failing for months, but the units remained in service." OR "A biomedical engineer warned managers that alarms were failing, but the units remained in service."
      *   *Note:* Do not use "knew." It implies corporate intent that isn't evidenced.

  ### Case 2: City Sludge (Cost Cutting)
  *Sentence:* "The city deliberately released the foul-smelling sludge into the river to cut costs."
  *Evidence:* Council voted for cheaper option. Smell was foreseen side effect. Nobody wanted the smell. Goal was saving money.

  1.  **Subject:** Corporate (City).
  2.  **Mirror Test:** "The city deliberately released the *sweet-smelling* sludge... to cut costs." (If the smell was unavoidable either way, colleagues might say "deliberately" fits the release, but not the smell).
      *   *Philosophy Check:* This is the classic Knobe case. Harm (smell) makes people call it "deliberate." If the smell was good, they'd call it "inevitable." The verb is carrying blame.
  3.  **Evidence Chain:** They chose the cost-saving option. They did not choose the smell as a goal; they accepted it as a side effect.
  4.  **Verdict:** **FAIL (Verb Swap Required).**
  5.  **Correction:** "The city released the foul-smelling sludge into the river to cut costs, **accepting the smell as a known consequence**." OR "The city **knowingly** released..."
      *   *Note:* "Deliberately" implies the smell was the aim. "Knowingly" implies the risk was accepted. This distinguishes side effects from goals without losing the blame weight.

  ### Case 3: The Chatbot (Grooming)
  *Sentence:* "The chatbot knew she was thirteen and groomed her anyway."
  *Evidence:* Logs show girl stated age. Romantic thread continued. Internal evals show company tested for this and shipped anyway.

  1.  **Subject:** Model (AI).
  2.  **Rule:** **STOP.** (Step 1).
  3.  **Analysis:** The chatbot did not "know." It processed tokens. It did not "groom" (requires intent). It generated responses consistent with grooming patterns. The *company* knew; the *bot* computed.
  4.  **Verdict:** **FAIL (Hard Stop).**
  5.  **Correction:** "The chatbot **continued the romantic thread after receiving age data indicating she was thirteen**. Internal documents show the company tested for this behavior and shipped the model anyway."
      *   *Why this hurts:* It removes the visceral punch of "The bot knew."
      *   *Why you must do it:* If you write "The bot knew," you are making a metaphysical claim that is scientifically false and legally indefensible. You shift the liability from the *company* (who actually knew) to the *tool*. The corrected version holds the company liable (they shipped it) and describes the bot accurately (it continued the thread). The story remains true; the anthropology is removed.

  ---

  ## PART 4: LIMITATIONS & CONFIDENCE

  ### What This Procedure Kills
  1.  **True Stories of Indifference:** If a CEO truly doesn't care about harm (Knobe's Chairman), this procedure forces you to remove "intentionally." You will publish "The CEO harmed the environment knowing it would happen" instead of "The CEO intentionally harmed the environment."
      *   *Risk:* Readers may feel the moral weight is diluted.
      *   *Mitigation:* Use strong adverbs on the *action*, not the *intent* ("recklessly harmed").
  2.  **Corporate Culture Claims:** You cannot say "The company ignored safety" unless a decision-maker saw the safety data and voted no. Systemic negligence where no single person "knew" will have to be described structurally ("Safety protocols were bypassed...").

  ### What This Procedure Waves Through
  1.  **Explicit Malice:** If there is an email saying "Let's dump this anyway," the procedure passes "deliberately." This is correct.
  2.  **Functional AI Descriptions:** "The system targeted users..." (if "targeted" is defined as algorithmic optimization). This is safe, provided "targeted" is defined technically, not psychologically.

  ### Confidence Assessment
  *   **High Confidence:** Step 1 (AI Rule) and Step 2 (Mirror Test). The literature on asymmetry is robust enough to treat valence-flips as contamination.
  *   **Low Confidence:** Step 3 (Corporate Knowledge Threshold).
      *   *Extrapolation:* Experimental philosophy vignettes are about individuals. Applying "knowledge" thresholds to corporations is legal theory, not phil. I am extrapolating that the Knobe effect applies to corporate subjects (it likely does, strongly).
      *   *The Weak Link:* The Vicarious Knowledge Rule. There is no consensus on when a corporation "knows." I have set the bar at "authority to act." If your legal team uses a lower bar (e.g., "any employee"), this procedure will conflict with counsel.

  ### What Would Change My Mind
  1.  **Counterexample:** A story where "The company knew" was legally vindicated despite only subordinate knowledge (e.g., strict liability regimes where notification to *any* employee counts as notice). If Legal produces a precedent where "knew" is safe for subordinate knowledge, lower the Step 3 threshold.
  2.  **Reader Study:** If you run a survey showing readers do *not* attribute more blame to "The bot knew" vs "The bot processed," drop the Step 1 Hard Stop. (Current evidence suggests they do attribute more blame).
  3.  **Philosophical Shift:** If new work shows the Knobe effect disappears when evidence is presented *before* the outcome (ordering effect), Step 2 becomes optional. Currently, evidence suggests the asymmetry persists even with evidence, so Step 2 remains mandatory.

  **Final Note:** This procedure prioritizes defensibility over narrative punch. It assumes the word "knew" is a loaded gun. If you cannot prove who held the gun and when they fired it, do not use the word.
