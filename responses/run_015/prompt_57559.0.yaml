answer: |-
  ### Specification for an Ethical Framework on Pest Control

  | # | Desideratum | Specification | Status | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Tripartite Harm Accounting** | The framework must weigh impacts on: (a) the target organism, (b) the protected asset (crop/health), and (c) non-target bystanders (predators, pollinators, soil biota). | **Non-negotiable** | Any binary 'us vs. them' model ignores externalities (e.g., secondary poisoning of hedgehogs), rendering the policy ecologically blind. |
  | **2** | **Systemic Accountability** | The framework must distinguish between pests arising from natural fluctuation and those manufactured by human systems (monocultures, waste mismanagement). | **Contested** | *Ecocentrists* view this as essential (the 'pest' is a symptom of bad design). *Utilitarians* may view it as irrelevant to immediate suffering (a dead aphid is dead regardless of cause). |
  | **3** | **Aggregation Protocol** | The framework must specify how to sum moral weight across vast numbers of individuals (e.g., does one slug's suffering equal 1,000 aphids'?). | **Non-negotiable** (for coherence) | Without this, decisions oscillate arbitrarily between ignoring swarms and paralysing over single specimens. However, *how* to aggregate is morally disputed. |
  | **4** | **Reversibility Constraint** | Interventions must be ranked by recallability. Chemical sprays dissipate; introduced biocontrols (parasitoids) may establish permanently. | **Non-negotiable** | Irreversible actions carry higher epistemic burdens. A framework that treats transient and permanent interventions identically fails risk assessment. |
  | **5** | **Intervention Consistency** | The framework must state whether there is a moral difference between *killing* a pest (spraying) and *letting it be killed* by natural predators (inaction). | **Contested** | *Welfarists* often struggle here (is predation suffering?). *Ecocentrists* accept predation as natural function. A policy cannot equivocate. |
  | **6** | **Anthropogenic Exception** | The framework must declare if human health/food security constitutes a distinct category that overrides other weights, or if it is merely another interest to be weighed. | **Contested** | *Public Health* views demand lexical priority for humans. *Animal Liberation* views reject speciesism. This is the primary ideological fault line. |
  | **7** | **Heuristic Usability** | The framework must yield actionable verdicts for non-experts under time pressure (e.g., '9 PM slug raid') without requiring complex calculus. | **Non-negotiable** (for policy) | A theoretically perfect framework that requires a PhD to apply will be ignored, leading to the 'spray whatever' default. |

  ***

  ### Incompatibilities and the Impossibility Theorem

  You are correct to suspect inconsistency, though the tension is more specific than "ordinary food-growing." The trilemma lies between **Desideratum 3 (Aggregation)**, **Desideratum 6 (No Anthropogenic Exception)**, and **Non-negligible Invertebrate Status**.

  If invertebrates possess even a minute non-zero moral status ($w > 0$), and we permit aggregation across the numbers involved in agriculture ($n \approx \infty$), the total moral weight of the pests ($w \times n$) becomes effectively infinite. If human interests (saving a bean crop) are finite, they are mathematically swamped. To vindicate ordinary gardening, you must break one leg of the stool:

  1.  **Deny Aggregation:** Claim that numbers don't count morally (a controversial view known as non-aggregative ethics).
  2.  **Deny Status:** Claim invertebrate weight is effectively zero (speciesism or neural complexity threshold).
  3.  **Assert Lexical Priority:** Claim human interests are infinitely weightier regardless of numbers (Anthropogenic Exception).

  **The Single Most Excluding Requirement:**
  **Desideratum 3 (Aggregation Protocol).**
  This is the engine of the conflict. If you remove aggregation, you can treat pests individually. A slug is a nuisance; a million aphids are just a million individual nuisances, easily outweighed by a human's desire for food. Once you require summing them, the sheer biomass of the invertebrate world renders almost all lethal control unethical unless human life is at stake. It does the most work because it transforms a manageable gardening problem into a demographic moral crisis.

  ***

  ### Ethical Viewpoints Against the Criteria

  **Welfarist / Animal Liberation:**
  Struggles with **Desideratum 5 (Intervention Consistency)**. If the goal is minimising suffering, spraying aphids might be preferable to letting them be eaten alive by ladybirds (if predation is slower/more painful), yet Welfarism often defaults to 'do no harm'. It fails **Desideratum 7 (Usability)** because calculating net suffering for a gardener is impossible. It typically rejects **Desideratum 6**, making food-growing hard to justify under **Desideratum 3**.

  **Ecocentric / Land Ethic:**
  Excels at **Desideratum 2 (Systemic Accountability)** and **4 (Reversibility)**. It views the 'pest' as a system signal and prefers reversible, non-chemical interventions. However, it fails **Desideratum 1 (Tripartite)** regarding individual welfare; it sacrifices the individual organism for the 'biotic community' without remorse. It is highly usable (**Desideratum 7**) via rules of thumb (e.g., 'no synthetics'), but offers little guidance when the ecosystem itself is out of balance.

  **Food Security / Public Health:**
  Satisfies **Desideratum 7** and **6** perfectly. Human need overrides all. However, it routinely violates **Desideratum 1** (ignoring bystanders) and **4** (prioritising efficacy over reversibility). It treats **Desideratum 2** as irrelevant; a pest is a pest regardless of origin. It is the only view that easily vindicates conventional gardening but at the cost of ethical blind spots regarding non-human costs.

  ***

  ### Note on UK Sentience Legislation

  The asymmetry between crabs/octopuses and aphids in UK law is **epistemic, not moral**. The law relies on evidence of nociception and centralised nervous systems capable of processing suffering. Crabs and octopuses meet this threshold; aphids do not.

  Your framework should treat this as a **proxy for moral status**, not a definition. To treat it as a definition is to commit the 'appeal to authority' fallacy. The framework must acknowledge the *risk of false negatives*: aphids may have a form of experience we cannot yet detect. Therefore, the framework should apply a **Precautionary Principle** to invertebrates generally, using the legislation as a baseline for *certainty* of suffering, not a boundary for *permission* to cause it.
