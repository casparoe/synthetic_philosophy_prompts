answer: |-
  ### Specification: Requirements for an Account of "Could Have Done Otherwise"

  **Fixed Purpose:** To underwrite excuse conditions in ordinary interpersonal blame and criminal law mitigation, agnostic of the truth of determinism.
  **Analogy:** Treat the agent as a kinetic pathway. We care whether the *actual* catalytic cycle was intact and owned by the enzyme, not whether thermodynamic alternatives existed, unless the *capacity* for the cycle was compromised by external constraint or internal degradation.

  #### I. The Requirements

  **1. Actual-Sequence Integrity (The Frankfurt Constraint)**
  *   **Specification:** Responsibility attaches to the actual causal pathway producing the action. If the actual sequence proceeds from the agent's own unimpaired mechanisms without active interference, the existence of a counterfactual blocker (that remained idle) is irrelevant.
  *   **Motivation:** The original Frankfurt case. If Jones decides on his own and Black (the intervener) does nothing, blaming Jones requires no appeal to Jones's ability to frustrate Black. To require AP here is to demand a metaphysical luxury the law does not need.
  *   **Status:** **Non-negotiable.** (Without this, the account fails the "agnostic of determinism" clause, as determinism implies a kind of universal Black).

  **2. Mechanism Ownership (The Manipulation Constraint)**
  *   **Specification:** The mechanisms producing the action must be *the agent's own* in a historical sense, not merely structurally identical to normal agents. They must not be the product of direct design by another agent intended to bypass the subject's critical faculties.
  *   **Motivation:** Manipulation/Indoctrination cases. If a neuroscientist programs you to kill, you function normally (Actual-Sequence Integrity is met), but you are not responsible. The pathway is intact, but the enzyme was engineered by a rival lab.
  *   **Status:** **Non-negotiable.** (Criminal law recognizes duress and indoctrination as excuses; a purely structural account fails to distinguish a programmed killer from a normal one).

  **3. Responsive Guidance (The Compulsion Constraint)**
  *   **Specification:** The agent must possess the capacity to recognize and react to relevant reasons *in the actual sequence*. This capacity must be distinguishable from mere physical possibility.
  *   **Motivation:** Plain compulsion vs. Duress. If I push you into a window, you lack guidance control. If a villain threatens your family unless you break the window, you retain guidance control (you weigh reasons), even if the choice is horrific.
  *   **Status:** **Non-negotiable.** (The law distinguishes *actus reus* driven by reflex/force from action driven by choice, even coerced choice).

  **4. Epistemic Access to Constraints (The Ignorance Constraint)**
  *   **Specification:** An agent is not excused by an inability to do otherwise unless they are also ignorant of that inability, or the inability itself defeats the epistemic condition required for responsibility. Mere inability is not an excuse if the agent believes they are choosing freely and correctly.
  *   **Motivation:** The difference between *unable* to do otherwise and *not knowing* one is unable. If I promise to meet you, and a hidden paralysis strikes me unknown to me, I am not blameworthy for the breach. If I know I am paralyzed and promise anyway, I am blameworthy for the promise.
  *   **Status:** **Non-negotiable.** (*Mens rea* requirements in law depend on knowledge/belief states).

  **5. Scalar Capacity (The Diminished Capacity Constraint)**
  *   **Specification:** The degree of responsibility must be capable of scaling with the degree of functional capacity. It cannot be a binary threshold if the underlying mechanism shows graded failure.
  *   **Motivation:** Agents with diminished capacity / The Decaying Monitor case. Enzyme activity degrades; so does rationality. If responsibility is binary, the law's mitigation doctrines (e.g., diminished responsibility) become fictions.
  *   **Status:** **Preference of the Fixed Purpose.** (Traditional moral ontology often demands binary guilt, but the *stated purpose* is to underwrite law/blame practices, which are scalar).

  **6. Outcome Independence for Culpability (The Luck Constraint)**
  *   **Specification:** Culpability must track the quality of the will and the control exercised, not the resultant state of the world, except where the outcome was within the agent's specific guidance control.
  *   **Motivation:** Resultant moral luck. Two drunk drivers, one hits a child, one does not. Their culpability regarding the *driving* is identical. Sentencing may differ, but the *blame* for the risk should not.
  *   **Status:** **Preference.** (The law punishes results, but moral blame arguably should not. This requirement prioritizes the moral intuition over the legal statute).

  ---

  #### II. Application to Standard Debates

  *   **Frankfurt & Flicker-of-Freedom:** The "flicker" (e.g., the difference between signing on one's own vs. being made to sign) is a difference in *Actual-Sequence Integrity*. If the actual sequence is the former, Requirement 1 is met. The flicker is not an alternative *possibility* robust enough to ground responsibility; it is a marker of the actual pathway's ownership.
  *   **Intervener Trigger (Deterministic vs. Chancy):** Irrelevant for the Fixed Purpose. Whether Black's trigger is determined or random matters for metaphysics, not for Jones's blame. If Black doesn't fire, Jones's pathway is the only one that matters. (Requirement 1).
  *   **Compulsion vs. Duress:** Compulsion breaks the mechanism (Requirement 3 fails). Duress loads the input weights but leaves the mechanism intact (Requirement 3 met, though mitigation may apply via Requirement 5).
  *   **Omissions:** Requires that the agent had the *capacity* (Requirement 3) and the *opportunity* (Actual-Sequence Integrity regarding the context) to act.
  *   **Manipulation:** Satisfied Requirement 1 (structurally) but fails Requirement 2 (Historically). This forces the account to be Historical Compatibilism.
  *   **Resultant Luck:** Handled by Requirement 6. If we prioritize the Fixed Purpose (law), we may have to relax this. If we prioritize moral theory, we keep it.
  *   **Diminished Capacity:** Handled by Requirement 5.
  *   **Ignorance of Inability:** Handled by Requirement 4.
  *   **History vs. Structure:** Requirement 2 forces a Historical condition. Pure Structuralism (Guidance Control without history) fails the Manipulation constraint.

  ---

  #### III. The Three Original Cases

  **1. The Reason-Swap Variant**
  *   **Scenario:** Device guarantees behavior by displacing reasons in the counterfactual (Panic vs. Conviction). Actual sequence: Conviction.
  *   **Analysis:** Under Requirement 1 (Actual-Sequence Integrity), the agent is responsible. She acted on her own conviction. The counterfactual pathway (Panic) is irrelevant because it was not instantiated.
  *   **Cost:** This strains Requirement 2 (Mechanism Ownership). If the device *could* have swapped her reasons, does it mean her actual reasons were only hers by luck?
  *   **Verdict:** To satisfy the Fixed Purpose (law/blame), we must rule she is **Answerable**. The law cares about the *mens rea* present at the time, not the *mens rea* that would have been present under intervention. This prioritizes Requirement 1 over a robust version of Requirement 2.

  **2. The Decaying Monitor**
  *   **Scenario:** Ability to do otherwise (or device reliability) fades from near-certain to negligible over an hour.
  *   **Analysis:** Requirement 5 (Scalar Capacity) dictates that answerability must fade continuously. If ability is a rate constant, responsibility is a function of that rate.
  *   **Verdict:** The question is **not malformed**. Ability is scalar in kinetics; it should be scalar here. A threshold view (Requirement 5 rejected) would create a "cliff-edge" unjustified by the mechanism. The account must allow for *partial* responsibility.

  **3. The Boardroom Case**
  *   **Scenario:** Committee votes 4-3. Chair (majority) would have imposed the same if vote failed.
  *   **Analysis:** This exposes the **Single Nervous System Presupposition**. Most requirements assume the "mechanism" is within one skull.
      *   *Committee:* Answerable as a collective entity (Requirement 1 met for the group mechanism).
      *   *Individual Members:* Answerable for their votes. The Chair's counterfactual power does not break the Actual-Sequence Integrity of the voters' deliberation.
      *   *The Chair:* She voted. Her vote was causally sufficient (part of the 4). The counterfactual power is irrelevant (Requirement 1).
  *   **Verdict:** The requirements hold, but only if "Agent" is defined functionally, not biologically. The Chair is not excused by her own authority, just as Jones is not excused by Black's presence.

  ---

  #### IV. The Incompatibility Analysis

  You asked which subset of requirements cannot be jointly satisfied. The tension lies between **Requirement 1 (Actual-Sequence Integrity)** and **Requirement 2 (Mechanism Ownership/History)**.

  **The Conflict:**
  To satisfy Frankfurt cases (Requirement 1), we must say that the *current* operation of the mechanism is sufficient for responsibility. We cannot demand the agent "could have done otherwise" because the counterfactual intervener blocks that.
  To satisfy Manipulation cases (Requirement 2), we must say that the *history* of the mechanism matters. A mechanism that is structurally identical to a free one but engineered by another is not free.

  **Why they clash:**
  If you push Requirement 2 hard enough to rule out *all* manipulation (e.g., indoctrination, subtle social engineering), you risk requiring that the agent be the *ultimate source* of their mechanism. But if the agent must be the ultimate source, and determinism is true, they cannot be the ultimate source (since their past determines their mechanism). This reintroduces the need for Alternative Possibilities (or Indeterminism) to secure the History condition.
  Thus, **Historical Independence (Req 2) threatens to collapse back into a demand for Alternative Possibilities (violating Req 1's spirit)** if we ask "Could the agent have avoided this history?"

  **The Exclusionary Requirement:**
  **Requirement 2 (Mechanism Ownership/Historical Independence).**
  This is the workhorse. It knocks out:
  1.  **Pure Structural Compatibilism:** (e.g., simple Guidance Control without history) because it cannot distinguish the manipulated agent from the free one.
  2.  **Hard Incompatibilism:** Because it allows for responsibility *without* indeterminism, provided the history is "clean" (natural development vs. design).
  3.  **Classical PAP:** Because it focuses on the *source* of the actual sequence, not the existence of alternative branches.

  It earns its place by forcing the theory to be *Historical Compatibilism*, which is the only view that survives both Frankfurt (no AP needed) and Manipulation (History needed).

  ---

  #### V. Scorecard

  **Classical Principle of Alternative Possibilities (PAP)**
  *   **Score:** **Fail.**
  *   **Reason:** Violates Requirement 1. It cannot handle Frankfurt cases without convoluted "flicker" maneuvers that do not align with legal excuse conditions (we do not acquit a murderer because a demon would have forced him if he hesitated). It fails the "agnostic of determinism" clause immediately.

  **Actual-Sequence / Guidance Control (e.g., Fischer & Ravizza)**
  *   **Score:** **Pass with Reservations.**
  *   **Reason:** Satisfies Requirement 1 and 3 excellently. Handles the Boardroom and Reason-Swap cases well. However, it struggles with Requirement 2 (Manipulation) unless it adopts a historical account of mechanism ownership (which Fischer eventually did). Without the historical addition, it fails the Manipulation constraint.

  **Source Incompatibilism**
  *   **Score:** **Fail (for the Fixed Purpose).**
  *   **Reason:** Satisfies Requirement 2 (History/Source) intuitively but violates the "agnostic of determinism" clause. It requires settling the metaphysical debate to apply the excuse conditions. It is too expensive for the practical purpose of underwriting law and blame, even if it is metaphysically robust.

  **Final Note:** For your purpose (enzyme kinetics background applied to blame), treat the agent as a catalytic cycle. Responsibility requires the cycle to be **intact** (Actual Sequence), **uncorrupted** (History/Ownership), and **responsive to substrate** (Reasons). Whether other cycles *could* have run is thermodynamically interesting but kinetically irrelevant to the rate of blame.
