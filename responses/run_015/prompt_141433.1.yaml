      *   *Section 5: Alternative.* Suggest Constitutivism of Belief (Shah/Velleman style) or Pragmatic Vindication (Haack/Quine style) as better frameworks.

  9.  **Refining the Tone:**
      *   Ensure I sound like a colleague, not a lecturer.
      *   Use precise terminology (constitutive vs. regulative, normative force, semantic ascent).
      *   Maintain the "slow careful audit" vibe.

  10. **Final Review against Constraints:**
      *   Did I map first? Yes.
      *   Did I commit to a verdict? Yes.
      *   Did I separate disanalogies? Yes.
      *   Did I address the two worries? Yes.
      *   Did I evaluate the conclusion? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to just say "Logic is about truth, Chess isn't." That's too simple. The Chess player cares about winning (checkmate). The Logician cares about truth. The disanalogy is that Checkmate is defined *by* the rules, whereas Truth is arguably *independent* of the logical rules (logical realism) or at least the goal is independent. Actually, better point: In chess, the rules *create* the possibility of winning. In logic, the rules are supposed to *track* validity which exists prior to the codification. Wait, that's too realist. Let's stick to the *normative grip*. Chess rules bind you only if you play. Logical rules bind you if you think. Can you opt out of thinking? Harder than opting out of chess.

