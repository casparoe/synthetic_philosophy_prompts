answer: |-
  The aphorism 'fortune favours the bold' is frequently attributed to Machiavelli, yet it originates in Latin poetry. While it captures the spirit of his discussion in chapter twenty-five of *The Prince*, it obscures the nuance of his distinction between *fortuna* (chance contingency) and *virtù* (human agency). To understand what is actually being claimed when this slogan is deployed, one must disambiguate it into three distinct readings, ranging from the trivial to the contentious.

  **A Menu of Readings**

  1.  **The Gambler's Reading (Risk and Reward)**
      This interpretation posits a simple correlation: higher risk entails the possibility of higher reward. Caution preserves the status quo, while boldness opens the door to exceptional gain, albeit with the chance of ruin.
      *   **Status:** Trivial platitude.
      *   **Evaluation:** This is a banal observation of probability theory and human psychology. It offers no theory of agency, merely noting that inaction yields no result. It does not reflect Machiavelli's specific concern with political stability.

  2.  **The Engineer's Reading (Preparation and Resilience)**
      This reading draws on Machiavelli's imagery of fortune as a raging river. When the river is calm, men have time to build dykes and dams. When the flood comes, the water is channelled rather than destructive. Here, 'boldness' is redefined as proactive preparation and structural resilience against inevitable contingency.
      *   **Status:** Substantive and defensible.
      *   **Evaluation:** This claims that human agency cannot eliminate chance, but can mitigate its effects through foresight. It is a robust political theory that matches the 'river' imagery in *The Prince*. It suggests that luck favours those who have prepared for luck's volatility.

  3.  **The Conqueror's Reading (Coercive Domination)**
      This reading draws on Machiavelli's infamous imagery of fortune as a woman who must be beaten and struck down. It claims that contingency is an adversary that yields only to aggressive, impetuous force. Here, 'boldness' is not preparation, but the violent imposition of will upon uncertain circumstances.
      *   **Status:** Genuinely Machiavellian, but controversial.
      *   **Evaluation:** This matches the specific textual evidence regarding the 'woman' metaphor. It advances the strong thesis that coercive domination is the correct model for managing chance. However, it risks overstating Machiavelli's view; he admits fortune controls half our actions, meaning total domination is impossible. Yet, within the scope of the metaphor, this is the reading that aligns with the slogan's aggressive connotations.

  **Application to Institutional Design**

  When the slogan is invoked to defend bold institutional design—such as radical constitutional reform or disruptive policy shifts—it typically relies on a hybrid of the Engineer's and Conqueror's readings. Proponents argue that decisive agency (Conqueror) can build structures resilient to chaos (Engineer). They suggest that hesitation invites decay, and only bold intervention can secure a political order against the ravages of time and chance.

  However, this reading often fails to survive scrutiny when subjected to Machiavelli's own caveats. Machiavelli warns that a man's ruin is often caused by a mismatch between his nature and the times. A leader who is naturally impetuous may succeed when the times require speed, but fail when the times require caution. Therefore, invoking 'fortune favours the bold' as a universal justification for institutional aggression is erroneous.

  The Engineer's reading survives scrutiny because it acknowledges limits; one builds dykes because one accepts the river cannot be stopped. The Conqueror's reading, however, assumes the river can be bullied into submission. In institutional design, this leads to overconfidence. Structures built on the assumption that willpower can dominate contingency often collapse when contingency behaves unpredictably. Machiavelli's actual argument is not that boldness always wins, but that *adaptability* is required. Since men rarely change their nature to suit the times, those who rely solely on boldness will eventually be undone by fortune. Thus, the slogan is only defensible if understood as the necessity of preparation (the dykes), not the guarantee of success through aggression (the beating).
