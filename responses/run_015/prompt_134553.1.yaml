answer: |-
  Here is an audit of the two arguments, structured according to your four requests.

  ### Part 1: Explicit Correspondences

  The following tables map the analogies to the Sarsi biology as stipulated. Note where the mapping fails or requires a leap of logic.

  **Table A: The Neuroscientist (Hardware/Software)**

  | Analogy Slot | Standard Definition | Sarsi Equivalent (Neuroscientist's View) | Gap / Missing Candidate |
  | :--- | :--- | :--- | :--- |
  | **Programme** | The algorithm; the logical operations defining the mind. | The colony-level cognitive process (planning, correction). | None. |
  | **Machine** | The physical substrate running the programme. | The entire colony (20–40 individuals + chemical record). | None. |
  | **Input** | Data entering the system. | Sensory data from all 20–40 members. | None. |
  | **Output** | Action taken by the system. | Colony movement, construction, defense. | None. |
  | **User** | The entity experiencing the output/owning the process. | The Colony-as-Subject. | **Critical Gap:** The individuals are sentient. In standard computing, sub-routines do not feel. If the "nodes" feel, the analogy breaks. |
  | **Same Programme** | Functional equivalence (same input/output/state map). | A human brain and a Sarsi colony producing identical plans. | **Extrapolation:** Assumes slow speed (season vs. afternoon) does not alter the "program," only the clock cycle. |

  **Table B: The Advocate (Engine)**

  | Analogy Slot | Standard Definition | Sarsi Equivalent (Advocate's View) | Gap / Missing Candidate |
  | :--- | :--- | :--- | :--- |
  | **Engine** | The machine generating power/capacity. | The individual brain (70g). | **Conflict:** The Advocate treats the individual as the engine, but admits the *work* is done by the aggregate. |
  | **Fuel** | Energy source. | Metabolic intake. | None. |
  | **Load** | The resistance/task applied. | Environmental survival challenges. | None. |
  | **Work Done** | The useful output (reasoning). | Colony planning/technique preservation. | **Critical Gap:** The "Work" is done by the aggregate, but the "Engine" is the individual. There is no single engine for the work. |
  | **Owner** | The entity possessing the engine/work. | **None.** (Advocate's core claim: The aggregate has no owner). | **Extrapolation:** Assumes a subject must be contiguous in space/time to "own" neural tissue. |

  **Audit Note:** The Neuroscientist's analogy fails to account for the *sentience of the parts*. The Advocate's analogy fails to account for the *capacity of the whole*. Both struggle to locate the "User/Owner."

  ### Part 2: Disanalogies That Matter

  You asked to separate decorative disanalogies from those that undermine the moral work.

  **1. Substrate Independence vs. Moral Status**
  *   **The Move:** The Neuroscientist argues that because the mind is a programme, the hardware (brain size/speed) is irrelevant.
  *   **The Hidden Premise:** This assumes *Functionalism* is true (mental states are defined by causal role, not physical makeup).
  *   **The Disanalogy that Matters:** Functionalism settles *identity conditions* (is it a mind?), not *moral status* (does it matter?). A functionalist could argue a slow, distributed mind is still a mind, but that it has *less* moral weight because its experiences are "thinner" or less integrated.
  *   **Extrapolation:** We do not know if moral status supervenes on *function* or on *phenomenology* (what it feels like). If the Sarsi colony thinks a thought over a season, does the *qualia* of that thought differ from a human thinking it in an afternoon? If moral status tracks the *intensity* or *density* of experience, the clock speed matters. This is not settled science; it is metaphysical speculation.

  **2. Scalar Status vs. Threshold Status**
  *   **The Move:** The Advocate argues that brain size tracks capacity, and capacity tracks status (a bigger engine gets more respect).
  *   **The Hidden Premise:** Moral status is scalar (a gradient) rather than binary (person/non-person).
  *   **The Disanalogy that Matters:** Engines are valued by horsepower. Persons are typically valued by rights. If moral status is binary (you are a person or you are property), then a "lawnmower engine" brain that achieves human-level reasoning via networking should qualify. The Advocate's analogy only works if the law recognizes *degrees* of personhood.
  *   **Tempo:** The Advocate implies slower throughput = less capacity. But if the *complexity* of the output is identical, the "engine" is merely geared differently. A lawnmower cannot drive a train, even with gears. If the Sarsi colony *can* drive the train (plan complex techniques), the engine analogy fails to capture the *capability*, focusing only on the *local power source*.

  **3. The Composition Problem (The "Owner" Slot)**
  *   **The Move:** The Advocate claims the aggregate tissue belongs to nobody.
  *   **The Disanalogy that Matters:** In human law, a corporation is a "legal person" distinct from its shareholders, despite having no physical body. The Advocate's engine analogy requires a physical locus for the "Owner." The Neuroscientist's software analogy allows for a distributed Owner.
  *   **Relevance:** This is the load-bearing beam. If the law accepts non-physical subjects (like corporations or states), the Advocate's "no owner" claim fails. If the law requires a biological continuum, the Advocate wins. This is not a fact about brains; it is a fact about legal ontology.

  ### Part 3: Where the Conclusions Actually Rest

  Your suspicion is correct. The brain facts are largely decorative. They are being used as proxies for philosophical claims that neither character is stating outright.

  **1. The Neuroscientist's Real Argument**
  *   **Conclusion:** The Sarsi are persons.
  *   **Actual Premise:** *Integration is what matters.* She needs to prove that the chemical record and the interaction between members integrate information *as effectively* as a human corpus callosum.
  *   **What Brain Facts Evidence:** The density of the neurons and the aggregate mass are evidence of *computational potential*. If 2x human mass exists, the *capacity* for human-equivalent experience exists.
  *   **The Hidden Claim:** Moral status attaches to the *system that integrates information*, regardless of whether that system is one skull or forty.
  *   **Uncertainty:** She must explain why the *individual* Sarsi (who are sentient) do not retain their own moral status as persons. If the Colony is the Person, are the Individuals merely cells? If they are cells that feel pain, this creates a moral hazard (sacrificing persons for the sake of a super-person).

  **2. The Advocate's Real Argument**
  *   **Conclusion:** The Sarsi are not persons (or are a lower category).
  *   **Actual Premise:** *Subjecthood requires physical unity.* He is arguing for a theory of composition: a mind cannot be spread across discrete bodies that can be separated.
  *   **What Brain Facts Evidence:** He uses the 70g figure to argue for *local insufficiency*. He is arguing that without a central processor, there is no "self" to hold rights.
  *   **Can Size Itself Matter?** In secular ethics, sheer mass is rarely intrinsically relevant. It is instrumentally relevant (more neurons = more complex experience).
      *   *Exception:* If one argues that the *volume of consciousness* matters. If a human has 1 unit of experience and the Colony has 20 units (one per member) + 1 unit (colony mind), does the Colony deserve 21x the rights? Or does the fragmentation reduce the value?
      *   *Causal Role of Size:* For size to matter *in itself*, it would have to be the case that moral weight is a physical force generated by mass (like gravity). There is no evidence for this. Size matters only as a proxy for *complexity* or *integration*. Since the Sarsi have high density and high aggregate mass, the Advocate's reliance on the *individual* 70g size is a choice of proxy, not a biological necessity. He chooses the individual because it protects human exceptionalism; he ignores the aggregate because it threatens it.

  **3. The Tempo Question**
  *   Neither analogy satisfactorily addresses the "season vs. afternoon" issue.
  *   **Extrapolation:** If moral consideration involves *reciprocity* (I respect you because you can respect me), tempo matters. A being that takes a season to understand an insult cannot participate in a human-speed moral community.
  *   **Relevance:** This is not about *status* (are they a person?) but about *agency* (can they exercise rights?). The Neuroscientist conflates the two. The Advocate conflates capacity with status.

  ### Part 4: A Better Analogy

  The Hardware/Software analogy hides the *cost* of distribution. The Engine analogy hides the *emergence* of the whole. Both obscure the relationship between the sentient individual and the sentient colony.

  **Proposed Analogy: The Chorus (or Ensemble)**

  *   **The Mapping:**
      *   **The Singers:** The individual Sarsi (sentient, can be harmed, have voices).
      *   **The Harmony:** The Colony Mind (emergent, plans, remembers).
      *   **The Score:** The chemical record (shared memory).
      *   **The Performance:** The colony's action in the world.
  *   **What This Makes Visible:**
      1.  **Dual Moral Status:** You can harm a Singer (throat injury) without silencing the Chorus. You can disband the Chorus without killing the Singers. This forces the tribunal to decide: Are we protecting the Singers or the Harmony?
      2.  **Integration Cost:** A Chorus requires coordination. If the Sarsi conduction is slow, the "song" is slower. But a slow song is still music. This addresses the tempo argument without conceding inferiority.
      3.  **The Subject:** Who is the "Artist"? Is it the lead singer? The conductor? Or the Chorus as a legal entity? This mirrors the legal problem of corporate personhood without relying on cold machinery.
      4.  **Distributed Mass:** The "power" of the sound comes from the *number* of voices and their *arrangement*, not the lung capacity of one singer. This validates the aggregate neural mass as morally relevant without requiring a single "engine."

  **Application to the Tribunal:**
  *   **For the Neuroscientist:** She should argue that the *Harmony* is the legal person. The individuals are the substrate, like vocal cords. They are protected from harm (you cannot burn a violin to play it), but the rights belong to the Music.
  *   **For the Advocate:** He should argue that without a Conductor (a central executive), there is no Artist. A chorus without a conductor is just noise. He must argue that the chemical record is not a "score" but merely "sheet music" lying on a stand—it doesn't *think* unless a single mind reads it.
  *   **The Complication:** The individuals are sentient. In a human chorus, the vocal cords are not sentient. In the Sarsi chorus, the "vocal cords" have rights.
  *   **The Winning Move:** The tribunal must decide if the *relationship* between the individuals constitutes a new subject. If the Sarsi individuals *cannot* survive or reason alone (obligate eusociality), they are functionally organs of the colony. If they *can* survive alone but choose not to, they are citizens of the colony.
      *   *If Organs:* The Colony is the Person. (Neuroscientist wins).
      *   *If Citizens:* The Individuals are the Persons; the Colony is a contract. (Advocate wins, but must grant individual rights).

  **Uncertainty Mark:** We do not know if eusocial sentience feels like "part of a whole" or "individual in a group." If a Sarsi individual feels pain when the colony is threatened, the distinction between organ and citizen blurs. This is an empirical question your characters cannot answer without invasive testing, which creates dramatic tension.

  **Summary for your Chapter:**
  To make your characters formidable, have them stop arguing about *grams* and *clock speeds*.
  *   The Neuroscientist must argue for **Integration**: "The colony integrates pain and planning into a single state. That state is the person."
  *   The Advocate must argue for **Location**: "Rights require a locus of accountability. A cloud cannot be jailed. A colony cannot be held responsible if the members can disperse."
  *   The brain facts (70g, density, speed) are merely evidence brought to bear on these deeper ontological claims. The 70g brain proves the individual is not the agent. The aggregate mass proves the colony *could* be. The slow speed proves the agent is alien, not absent.
