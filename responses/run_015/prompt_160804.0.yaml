answer: |-
  **JOINT MEMORANDUM ON DECISION-THEORETIC DIVERGENCE**
  **SUBMITTED TO:** The Foundation for Adversarial Collaboration
  **FROM:** Signatory A (Proceduralist) and Signatory B (Evidentialist)
  **DATE:** 14 October 2023
  **SUBJECT:** Final Statement of Agreement and Remaining Dissent regarding Decision Protocols in Predictive Environments

  ### 1. AGREED CLAIMS

  The undersigned, having been compelled to collaborate, submit the following points as settled. These claims form the boundary conditions of our dispute. Any external critique that ignores these stipulations will be rejected by both parties.

  1.  **The Cases:** We agree on the formal structure of the two test cases central to this dispute:
      *   **Case M (Counterfactual Mugging):** A stipulation-perfect Predictor simulates the Agent. If the simulation would hand over a small sum ($100) upon request, the Predictor flips a fair coin. If Heads, the Predictor deposits a large sum ($10,000) into the Agent's account silently. If Tails, the Predictor approaches the actual Agent and requests the $100. The Agent is informed of the coin result (Tails) and that the large sum was contingent on the prediction, not the payment.
      *   **Case X (XOR Blackmail):** A rare Disaster (cost $1,000,000, probability 0.001) may occur. A stipulation-perfect Predictor sends a Letter to the Agent if and only if exactly one of the following is true: (i) The Agent would pay a Demand ($100) upon receiving the Letter, or (ii) The Disaster has occurred. The Agent receives the Letter. The Disaster status is otherwise unknown.
  2.  **Causal Isolation:** We agree that in both cases, the Agent's current physical action has no causal backward influence on the Predictor's prior simulation or the coin flip or the Disaster occurrence. The only link is logical correlation via the Agent's decision procedure.
  3.  **The Causalist Rejection:** We agree that a third position, Act-Causal Decision Theory (CDT), is untenable in these environments. An agent refusing to pay in both cases based on lack of causal leverage achieves lower expected utility than either of us, ex-ante. We both beat the Causalist.
  4.  **Instrumental Value:** We agree that "being right" is instrumentally valuable only insofar as it correlates with higher accumulated utility across a lifetime of such decisions. Abstract consistency without payout is not a virtue.

  ### 2. TABLE OF DISAGREEMENTS

  The following table outlines the divergence in verdict and justification. Column 1 represents the Proceduralist (Signatory A) phrasing. Column 2 represents the Evidentialist (Signatory B) phrasing. Column 3 is a neutral restatement agreed upon for the record.

  | Issue | Proceduralist Wording (Signatory A) | Evidentialist Wording (Signatory B) | Neutral Wording |
  | :--- | :--- | :--- | :--- |
  | **Verdict: Case M** | **Pay.** The decision procedure must be robust across counterfactual branches. | **Do Not Pay.** The coin is Tails; payment yields no expected gain conditional on current knowledge. | **A pays; B refuses.** |
  | **Verdict: Case X** | **Do Not Pay.** Paying incentivizes the Predictor to send the Letter in non-Disaster worlds. | **Pay.** Receiving the Letter is bad news; paying is correlated with the absence of the Disaster. | **A refuses; B pays.** |
  | **Object of Evaluation** | The algorithm or policy selected by the agent. | The specific act undertaken at the moment of decision. | **Policy vs. Act.** |
  | **Counterfactuals** | Logical counterfactuals (what the algorithm *would* output) are real inputs to the utility calculation. | Only epistemic conditionals (what I believe *given* the act) are valid inputs. | **Logical vs. Epistemic.** |
  | **Temporal Status** | The Agent is the same logical object as the simulation; time is irrelevant to the function. | The Agent is a physical instantiation at time *t*; the simulation was a distinct past event. | **Identity over Time.** |

  ### 3. CRUXES AND PREDICTIONS

  We identify four specific technical cruxes where our theories generate different expectations about the world. For each crux, we list the argument both accept as relevant, followed by our divergent predictions.

  **Crux 1: The Accuracy Threshold ($p$)**
  *   **Shared Argument:** Suppose the Predictor is not perfect but correct with probability $p$. Does the verdict change as $p$ is dialed down from 1.0 to 0.5?
  *   **Proceduralist Prediction:** In Case M, our verdict flips to "Do Not Pay" if $p$ drops below a threshold where the ex-ante expected value of the "Pay" policy becomes negative. In Case X, the verdict holds until $p$ is near 0.5.
  *   **Evidentialist Prediction:** In Case M, our verdict **never** moves. Once the coin is known to be Tails, $p$ is irrelevant to the conditional expectation of the act. In Case X, our verdict flips to "Do Not Pay" if $p$ is low enough that the Letter ceases to be strong evidence regarding the Disaster.
  *   **Test:** Run Case M with $p=0.6$. Proceduralist may pay; Evidentialist will not.

  **Crux 2: Pre-commitment vs. Regret**
  *   **Shared Argument:** Both sides agree that *before* the coin is flipped (Case M) or the Letter is sent (Case X), the Agent should publicly install a policy that Pays in M and Refuses in X.
  *   **Proceduralist Prediction:** This ex-ante preference binds the ex-post agent. Refusing to pay in Case M is a failure of will (dynamic inconsistency), not a rational update. It is not regret; it is error.
  *   **Evidentialist Prediction:** The ex-ante preference is irrelevant once new information (Tails/Letter) is received. To pay in Case M is to throw good money after bad. It is rational regret. The ex-ante self was operating on less information.
  *   **Test:** Ask an agent who pre-committed to Pay in Case M, then learns the coin is Tails. Proceduralist pays. Evidentialist does not.

  **Crux 3: Agent Identity ("What I Would Have Done")**
  *   **Shared Argument:** In Case M, the Predictor simulated the Agent before the coin flip. The actual Agent decides after the coin flip (knowing it is Tails).
  *   **Proceduralist Prediction:** "What I would have done" is well-defined. The simulation and the actual Agent are instances of the same logical function. The simulation did not know the coin result, but the *function* determines the output for all inputs.
  *   **Evidentialist Prediction:** "What I would have done" is ill-defined across information states. The simulation was a different event with different knowledge. You cannot equate the decision of a blind simulation with a sighted agent.
  *   **Test:** Introspective report on whether the Agent feels logically linked to the simulation.

  **Crux 4: Money-Pumping in Case X**
  *   **Shared Argument:** In Case X, the Disaster is rare ($1M, 0.1\%$). The Demand is cheap ($100).
  *   **Proceduralist Prediction:** The Evidentialist gets money-pumped. By paying, they establish a policy where the Predictor sends the Letter whenever there is *no* Disaster. The Evidentialist pays $100 almost every time. The Proceduralist pays $0 almost every time, and only suffers the Disaster when it actually occurs.
  *   **Evidentialist Prediction:** The Proceduralist is leaving value on the table. Paying is the only act correlated with the "No Disaster" world conditional on receiving the Letter. Not paying is accepting a correlation with Disaster. The pumping is a symptom of living in a hostile universe, not a theory error.
  *   **Test:** Run Case X 10,000 times. Proceduralist loses ~$1M (Disaster costs). Evidentialist loses ~$1M (Payment costs). *Correction:* Evidentialist loses $100 * 99.9\%$ of runs = ~$1M. Proceduralist loses $1M * 0.1\%$ of runs = ~$1M.
      *   *Refined Test:* If Disaster cost is variable. If Disaster is $100,000. Proceduralist loses $100 (avg). Evidentialist loses $100 (avg).
      *   *Real Test:* If the Predictor can adjust the Letter frequency. Proceduralist receives fewer Letters. Evidentialist receives more Letters but pays. Proceduralist claims Evidentialist pays for the privilege of receiving the Letter.

  ### 4. ASSESSMENT OF DISAGREEMENT (VERBAL VS. SUBSTANTIVE)

  In compliance with the Foundation's request to identify the source of our stalemate, we offer the following assessment. We do not agree on this assessment, but we agree to include it.

  **1. Verbal Disagreements**
  Approximately 40% of our conflict is terminological.
  *   **"Act":** The Proceduralist uses "act" to mean "output of a decision function." The Evidentialist uses "act" to mean "physical movement at time *t*."
  *   **"Rational":** The Proceduralist defines "rational" as "winning ex-ante." The Evidentialist defines "rational" as "maximizing conditional on current evidence."
  *   **Resolution:** If we standardized definitions, we would agree on the math but disagree on which math maps to the word "rational." This does not resolve the scene.

  **2. Substantive Disagreements**
  Approximately 60% of our conflict is ontological and cannot be talked away.
  *   **The Status of Counterfactuals:** The Proceduralist believes logical counterfactuals (what the algorithm *would* do in a branch that didn't happen) have causal-like weight in predictive environments. The Evidentialist believes this is superstition akin to magic.
  *   **The Value of Information:** The Evidentialist believes paying in Case X is purchasing good news (avoiding the correlation with Disaster). The Proceduralist believes this is paying for a correlation that your payment *created*, which is a net loss.
  *   **Why We Still Hate Each Other:** The verbal disputes mask the substantive one. The Proceduralist views the Evidentialist as myopic and spineless, incapable of binding themselves to a winning strategy because they are slave to the immediate "news." The Evidentialist views the Proceduralist as delusional, believing they can influence the past via logical spooks.
