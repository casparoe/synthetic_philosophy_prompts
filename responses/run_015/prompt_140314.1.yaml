  Here are the eight questions and follow-ups for Pascal:

  1. Q: You argue we made the strong just because we couldn't make the just strong. Is this how power holds, or true right? What stops it being mere laundering?
  FU: If laundering implies true justice accessible to reason, you contradict yourself. You say reason is too weak to judge custom. Which is it? Does God alone see the difference?

  2. Q: Truth changes across a river; killing is praised elsewhere. Yet you insist true justice exists. Why doesn't this rule of custom swallow your claim of universal law entirely?
  FU: You distinguish known justice from true justice. But if custom dictates all we see, does the unseen true justice matter for public order at all?

  3. Q: If obedience requires believing laws are just, yet they often aren't, does society require widespread false belief? How does this fit your view on self-love hiding truth?
  FU: You argue we hide truth to keep peace. But is peace built on illusion preferable to truth that brings disorder?

  4. Q: Force belongs to bodies, justice-talk to minds. Is there a politics of charity, or does charity make the question of earthly justice drop away entirely?
  FU: If charity transcends justice, should the Christian seek to reform laws or simply endure them as things of the flesh?

  5. Q: A council seizes warehouses, then holds a vote nine months later calling it lawful. Does the delay do moral work, or is ratification always just force after the fact?
  FU: You say time hallows custom. But does waiting nine months change the nature of the act, or merely the perception of it?

  6. Q: Is your Wager the same trick pointed at yourself? Acquiring by practice a belief argument can't give you? Do we wager on justice similarly?
  FU: If we habituate ourselves to obey laws as if just, does that habit create the justice, or merely the peace?

  7. Q: If what's established just is what's just, what could ever count as proof that a regime is laundered force rather than justice?
  FU: You appeal to God's justice. But since God hides Himself, can any man truly accuse a stable power of being mere force?

  8. Q: You warn it's dangerous to tell people laws aren't just, since they'd stop obeying. Isn't this book exactly that dangerous act?
  FU: You write for the few who can hear it. But if the many hear, do you not undermine the very order you describe? Is silence the only pious politics?
