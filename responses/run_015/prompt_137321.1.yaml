answer: |-
  You have spotted something really sharp here. Most people get frustrated by this move but can't articulate *why* it feels off. You're right that "populism" is too broad (and often misused), and you're also right that this isn't just plain lying. It's a specific rhetorical structure that creates a shield against evidence.

  Here is the breakdown of what this is, where the edges are, and how confident I am in these labels.

  ### 1. Is there a name for this?

  **The short answer:** There is no single, universally recognized Latin name for this fallacy (like *Ad Hominem* or *Strawman*). If you look it up in a standard logic textbook, you won't find one entry.

  **The long answer:** This is a cluster of three established concepts that get mashed together. Depending on which part of the argument you focus on, it goes by different names:

  *   **The Philosophical Root:** **Rousseau's "General Will" vs. "Will of All."**
      In the 1700s, Jean-Jacques Rousseau argued that there is a difference between the "will of all" (what people vote for) and the "general will" (what is actually best for the community, which they might not realize). When your Student Council President says, "They voted against it, but that's not what they *really* need," he is invoking the **General Will**. He is claiming to know the community's interest better than the community does.
  *   **The Sociological Term:** **False Consciousness.**
      This comes from Marxist theory. It describes when a group of people votes or acts against their own best interests because they have been "trained" or socialized to accept the status quo. When the President said students were "trained to just accept the early start," he was accusing the student body of **False Consciousness**.
  *   **The Rhetorical Tactic:** **The "Silent Majority" Maneuver.**
      This is the practical name for the move. It claims that the vocal or voting group doesn't represent the "real" people. The "real" people are silent, uncounted, or misunderstood, and only the speaker can hear them.

  **The Best Label:** If you need one phrase to describe the *move* itself, call it **Epistemic Paternalism**.
  *   *Epistemic* = About knowledge/belief.
  *   *Paternalism* = Treating people like children ("I know what's best for you").
  It captures the core issue: The speaker is overriding stated preferences by claiming superior knowledge of the voters' own minds.

  ### 2. Why "Populism" is the wrong fit

  Your friend isn't totally crazy, but they are imprecise.
  *   **Populism** usually frames things as "The Pure People vs. The Corrupt Elite."
  *   **Your Scenario** frames things as "The Leader (speaking for the Real People) vs. The Confused People (who just voted)."

  In populism, the leader says, "I trust the people's vote." In the move you described, the leader says, "I trust the people's *soul*, not their vote." That is a crucial difference. Populism validates the vote (usually); this move invalidates it.

  ### 3. Are the two versions the same thing?

  You asked if the "misinformed" argument (Version 1) and the "wrong people" argument (Version 2) are the same. They look alike, but they have different logical structures.

  **Version 1: "You don't know what you want." (Internal Invalidity)**
  *   **Example:** "You voted for the dress code, but you're just trained to like it."
  *   **Mechanism:** This attacks the *authenticity* of the preference. It claims the voter's internal wiring is compromised.
  *   **Logical Flaw:** It is **Unfalsifiable**. There is no test you can run to prove you *aren't* "trained." It puts the speaker in the position of a mind-reader.

  **Version 2: "You don't count." (External Invalidity)**
  *   **Example:** "The people who voted have after-school jobs, so they aren't the 'real' student body."
  *   **Mechanism:** This attacks the *legitimacy* of the constituency. It redefines who belongs to the group.
  *   **Logical Flaw:** This is a **No True Scotsman** fallacy. ("No *true* student body member would have a job and vote against start times.")

  **Why they look the same:** Both result in ignoring the data (the vote).
  **Why they are different:** Version 1 says the *data is corrupted*. Version 2 says the *sample is wrong*.
  In your examples, the Student Council President used *both* at once. That's why it felt so slippery. He said the data was corrupted (trained minds) AND the sample was wrong (workers aren't real students). Using two different defenses for the same claim is a sign of **Special Pleading**.

  ### 4. Is there ever a legitimate version of this?

  Yes. This is the tricky part. There are times when stated preferences do not match actual welfare.

  **The Legit Case: Coercion and Preference Falsification.**
  There is a concept in political science called **Preference Falsification** (coined by Timur Kuran). This happens when people lie about what they want because they are afraid of punishment.
  *   *Example:* If a school held a vote on whether to cancel homework, but the Principal stood in the room with a suspension slip, and everyone voted "Keep Homework," a student leader could legitimately say, "This vote doesn't count. People are scared."
  *   *Why it's legit:* You can point to the threat. You can show evidence of coercion.

  **The Illegit Case: Hypothetical Benefit.**
  *   *Example:* "You voted against the dress code, but if you wore what you wanted, you'd be bullied, so you *really* want the code."
  *   *Why it's illegit:* This assumes the speaker knows the future better than the voter. It treats the voter like a child who doesn't understand consequences.

  **The Edge:** The move is legitimate only if you can prove **external pressure** (threats, misinformation, coercion). It is illegitimate if you are just claiming to know their **internal desires** better than they do.

  ### 5. Confidence and Falsifiability

  **My Confidence Level:**
  *   **85% Confident** that there is no single standard fallacy name (like "Strawman") for this specific combination.
  *   **95% Confident** that **Epistemic Paternalism** or **The General Will Fallacy** accurately describes the mechanism.
  *   **90% Confident** that distinguishing between "Internal Invalidity" (False Consciousness) and "External Invalidity" (No True Scotsman) is the correct way to split the two versions you saw.

  **What Would Change My Mind:**
  *   **Debate Theory:** If you showed me a specific high-school or collegiate debate textbook that lists this as a named fallacy (e.g., "The Mandate Fallacy" defined specifically this way), I would update my answer. Debate circuits sometimes invent specific labels that don't exist in broader philosophy.
  *   **Psychology:** If there is a specific cognitive bias name in behavioral psychology that covers "discounting stated preferences in favor of inferred preferences," I might be missing it. (The closest is *Projection Bias*, but that's slightly different).

  **Where My Reasoning is Shaky:**
  The shakiest part is the "Legitimacy" section. Philosophers argue endlessly about when it is okay to override votes for people's "own good" (this is the core debate of Liberalism vs. Paternalism). I am simplifying that to "Coercion = Okay, Benefit = Not Okay," but in the real world, leaders often genuinely believe they are preventing harm (like bullying) when they ignore votes. Distinguishing between "genuine concern" and "power grab" is often subjective, even if the logical move is the same.

  ### Summary for your next argument
  If you run into this again, you don't need to say "That's Epistemic Paternalism." You can just ask:
  *"Are you saying people are being threatened (coercion), or are you saying you know their minds better than they do (paternalism)?"*

  If they can't prove coercion, they are just claiming to be mind-readers. That usually exposes the move.
