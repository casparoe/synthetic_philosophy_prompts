          *   *Nuance:* Banality refers to the *nature* of the evil (lack of depth/root), not necessarily the *frequency* or the *agents* in all cases.

      *   *Sentence 3:* "In the Jerusalem trial she argued the court was wrong to portray him as demonic, because his real problem was a kind of bureaucratic mindlessness that made him unable to think from anyone else's perspective."
