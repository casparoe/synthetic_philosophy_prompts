answer: |-
  Hume would declare the scheme doomed to fail. His theory of convention, illustrated by the rowers falling into rhythm, is fundamentally empirical and iterative. Coordination arises not from abstract logic but from a "slow and gradual" accumulation of experience where agents learn that mutual restraint serves their interest. In this one-shot scenario, that experiential scaffolding is absent. There is no past rhythm to fall into and no future consequence for breaking it. Without the stabilizing force of repeated interaction, the passion of self-interest dominates. Each recipient desires the money; without established trust, the impulse is to reply, hoping to be among the few. Hume would predict the 1% threshold is blown immediately.

  Consequently, Hume has no resources to tell a recipient what to do, because for him, morality and cooperation are products of habit, not pure calculation. He cannot offer a rational prescription for cooperation here because he denies that reason alone can oppose passion. If your desire for wealth is strong, reason will merely calculate how to get it; it will not invent a cooperative norm out of thin air.

  Regarding the claim that recipients were selected for "good reasoning," Hume would dismiss it as rationalist fantasy. He famously subordinates reason to passion. To expect strangers to coordinate based on an abstract shared capacity for logic, rather than concrete experienced interest, contradicts his view of human nature. He would treat this detail as exactly the kind of self-flattering story people tell themselves. We like to think we are uniquely rational, but history shows us driven by immediate incentives. For Hume, "good reasoning" does not produce cooperative outcomes in a vacuum; only custom and habit do. Since there is no custom here, there is no cooperation. He would advise you that reason cannot compel you to abstain if your desire for wealth is strong, but as a predictor of human behavior, he insists: nobody gets paid. The letter asks for a logical leap where Hume demands a historical track record.
