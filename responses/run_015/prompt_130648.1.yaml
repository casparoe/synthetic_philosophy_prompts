  The root node tests whether the interlocutor accepts the phenomenological premise itself; rejecting this claim locates the Externalist Realist, who argues that external factors or causal histories distinguish the states regardless of internal feel. The second node asks whether phenomenal indistinguishability forces an ontological conclusion; accepting this entailment leads down the path of metaphysical monism or skepticism, while rejecting it allows for ontological distinction despite phenomenological similarity. The third node queries the persistence of the self across the transition; denying survival here yields the Zhuangzian view that the self is fluid or illusory, while affirming it preserves a stable subject. The fourth node assesses epistemic access to one's current state; denying authority here produces Cartesian skepticism where the subject cannot know if they are dreaming, while affirming it suggests the subject can classify the state or that the classification is pragmatically secure. The Narrative-Continuity position occupies the branch where metaphysical equivalence is denied but identity survives, relying on coherence rather than ontology to secure the self. The Deflationary stance occupies the terminal branch where equivalence and identity are accepted, but authority is retained, implying the distinction lacks practical consequence. Three branches are flagged as empty or unstable: first, where metaphysical equivalence is denied yet identity fails to survive, which is incoherent because distinct ontological states typically provide grounds for persistent identity; second, where metaphysical equivalence and identity survival are accepted but authority is denied, which is the Cartesian position, whereas accepting authority yields the Deflationary position; third, where metaphysical equivalence is denied, identity survives, but authority is denied, which is unexplored and unstable because distinct states should theoretically be distinguishable given a persistent self. The Zhuangzian position specifically requires the denial of identity survival despite metaphysical equivalence, rendering questions of authority moot or transformed. The Cartesian position requires the acceptance of identity survival and metaphysical equivalence (or epistemic inability to distinguish them) coupled with a loss of authority. The Externalist position is unique in rejecting the root phenomenological claim entirely.
