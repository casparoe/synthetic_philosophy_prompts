answer: |-
  ### Desiderata for an Account of Promissory Obligation

  An adequate theory of why promises bind must satisfy the following criteria. Each is marked as either **Non-Negotiable** (the account fails without it) or a **Camp Preference** (theories may reasonably disagree).

  **1. Scope Adequacy**
  The account must explain the binding force of both casual, interpersonal promises (e.g., "I will pick you up at noon") and formal, institutional vows (e.g., marital oaths, judicial swearing-in). It cannot treat one as primary and the other as derivative without explaining the transition.
  *   **Status:** Non-Negotiable.

  **2. The Normativity Distinction**
  The account must distinguish promissory *obligation* from mere *prediction* or *expectation*. It must explain why breaking a promise warrants blame or repair in a way that failing to fulfill a prediction does not, even if the disappointment is identical.
  *   **Status:** Non-Negotiable.

  **3. Status Mechanics**
  The account must differentiate between *breach* (violating an existing obligation) and *release* (dissolving the obligation prior to performance). It must explain how a promisee can release a promisor without the promisor having performed, and why breach generates secondary duties (apology, compensation) while release does not.
  *   **Status:** Non-Negotiable.

  **4. Defeasibility Conditions**
  The account must specify why certain conditions negate binding force entirely. Specifically, it must handle *duress* (coercion) and *radical informational asymmetry* (fraud or essential ignorance). The theory must explain why a promise made under threat or profound deception creates no obligation, rather than merely a excusable breach.
  *   **Status:** Non-Negotiable.

  **5. Grounding Unity**
  The account must state whether the binding force rests on a single foundational principle (e.g., autonomy, trust, or social practice) or accepts a pluralist foundation where different types of promises bind for different reasons.
  *   **Status:** Camp Preference. (Unity is elegant; Pluralism is robust).

  **6. The Synthetic Delegation Constraint**
  The account must explain the "Synthetic Delegation" case: An agent delegates a task to an autonomous system and commits to reviewing its outputs. This creates a human-binding obligation even without direct human expectation (e.g., the obligation exists structurally or procedurally before a specific promisee relies on it). The theory must explain what binds the human to the review process when no other human is yet relying on that specific act.
  *   **Status:** Non-Negotiable.

  ***

  ### The Joint Tension

  The following subset of desiderata appears jointly unsatisfiable under a strict **Single Ground** requirement (Desideratum 5): **{D4, D5, D6}**.

  **The Tension:**
  If you demand a **Single Ground (D5)**, you face a dilemma between **Defeasibility (D4)** and **Synthetic Delegation (D6)**.

  *   **If the ground is Autonomy:** This satisfies **Synthetic Delegation (D6)** easily (the agent voluntarily bound themselves to the review process). However, it struggles with **Defeasibility (D4)**. If the binding force is my own will, why does *your* deception (informational asymmetry) or *your* coercion (duress) void *my* obligation? To explain D4, autonomy theories must import external norms about fairness or voluntariness that compromise the purity of the single ground.
  *   **If the ground is Trust/Expectation:** This satisfies **Defeasibility (D4)** easily (fraud undermines the reliance required for trust). However, it fails **Synthetic Delegation (D6)**. In the synthetic case, the prompt specifies obligation exists *without direct human expectation*. If no human is relying on the review yet, a trust-based theory cannot find the binding force.
  *   **If the ground is Social Practice:** This satisfies **Scope (D1)** well but fails **Synthetic Delegation (D6)** because the practice of delegating to autonomous systems is nascent and lacks established normative conventions. It also struggles with **Defeasibility (D4)** unless the practice itself includes rules about fraud, which pushes the explanation back to the fairness of the rules rather than the practice itself.

  **Conclusion on Tension:** You can satisfy D4 and D6 only by abandoning D5 (accepting Pluralism). If you insist on D5 (Unity), you must weaken either D4 (making promises harder to void) or D6 (denying obligation in synthetic cases without reliance).

  ***

  ### Scoring of Major Views

  **1. Autonomy-Based Views**
  *   **Performance:** High on D2, D5, and D6. Low on D4.
  *   **Analysis:** These views excel at explaining why I bind myself (D2) and handle the Synthetic Delegation case (D6) effortlessly, as the human voluntarily undertook the obligation to review. They struggle with D4 (Duress/Asymmetry); if the obligation comes from my will, external factors like your lies should not erase my self-imposed duty without ad-hoc caveats about "valid" consent.

  **2. Trust-Based (Reliance) Views**
  *   **Performance:** High on D2, D4. Low on D6.
  *   **Analysis:** These views explain D4 perfectly; if you lie or coerce, my reliance is misplaced or involuntary, so no obligation forms. They satisfy D2 by grounding obligation in the harm of disappointed reliance. They fail D6 decisively. In the Synthetic Delegation case, if no human is expecting the review, there is no reliance to protect, yet the intuition remains that the agent is bound.

  **3. Practice-Based (Conventionalist) Views**
  *   **Performance:** High on D1, D3. Low on D5, D6.
  *   **Analysis:** These views handle D1 (covering vows and promises as social institutions) and D3 (release rules are part of the practice) well. They struggle with D5 if they try to claim universality, as practices vary. They fail D6 because the "practice" of AI delegation is not yet sufficiently established to generate normative force independent of the underlying moral reasons. They also risk reducing D2 (Obligation) to mere rule-following, losing the moral "ought."
