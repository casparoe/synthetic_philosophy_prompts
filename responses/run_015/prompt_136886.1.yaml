      *   *Self-Correction on Severity:* The (a) vs (f) contradiction is logical impossibility. That is Severity 1. The (g) vs (h) feasibility issue is Severity 2. The (b)/(c) vs (a) meta-ethical tension is Severity 3 (philosophical coherence vs practical logic).

