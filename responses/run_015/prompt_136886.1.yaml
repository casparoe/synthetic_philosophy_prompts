      *   **Tension 5: The "Costless" Rider ((h) vs. (f) & (g)).**
          *   *Conflict:* (h) claims the clean-hands rider is costless because parties wouldn't perform forbidden acts anyway.
          *   *Analysis:* If (a) is true (trade is required), then parties *would* feel pressure to perform unless the rider exists. The rider removes the *pressure*, not just the action. But the real cost is in *gains from trade*. If many potential trades are blocked by ground projects, the ledger is less efficient.
          *   *User's specific worry:* Does (g) make the rider costly? If I can bluff (g), I might claim a ground project constraint to get out of a deal or get better terms.
          *   *Severity:* **Moderate.** It attacks the efficiency claim of (h).
          *   *Repair:* Acknowledge the rider has administrative/verification costs, especially given (g).

  5.  **Addressing the Specific Questions:**

      *   *Do (b) and (c) undercut (a)?*
          *   Mechanism: No. Trade works on intrapersonal rankings.
          *   Normativity: Yes, slightly. Calling it a "moral failing" implies an overarching standard that (b) denies exists.
      *   *Does doing/allowing ((f)) survive trade?*
          *   Yes. Conditional obligation doesn't make the forbidden act permissible.
      *   *Is the clean-hands rider ((h)) costless given (g)?*
          *   No. (g) incentivizes false claims of constraint.
      *   *How much trouble turns on (a)?*
          *   Most of it. (a) creates the conflict with (d), (e), (f). If (a) is a permission, the integrity constraints (d, e, f) can veto the trade without contradiction.
          *   *Loss:* You lose the punch of the paper. It goes from "You are wrong if you don't do this" to "This is a nice option."
      *   *Single Revision:* Weaken (a).
      *   *Cost:* Reduced normative urgency.

  6.  **Drafting the Audit (Iterative refinement):**

      *   *Structure:*
          1.  Executive Summary (Severity Ranking).
          2.  Detailed Tension Analysis (Conflict, What Gives, Repair).
          3.  Dissolving Apparent Tensions (Specifically (b)/(c) vs (a) mechanism, and (f) doing/allowing).
          4.  The Role of (a) (Duty vs. Permission).
          5.  Single Best Revision.

      *   *Refining the (a) vs (f) conflict:* This is the big one. (a) says "Required... failing is a moral failing." (f) says "Refuse... even though net positive." If it's net positive by *my* ranking, (a) says trade. (f) says don't. This is a flat contradiction.
      *   *Refining the (g) vs (h) conflict:* (g) allows lying about preferences. (h) relies on a ledger. Ledgers need trust. If I lie about intensity to get better terms, the escrow/broker system needs to handle that. If I lie about *constraints* (invoking the rider falsely), that's worse. (g) says I can lie about *intensity*. Does that extend to *constraints*? If so, (h) is broken.
