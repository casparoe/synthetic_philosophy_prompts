      *Let's refine "Would it rescue the seminar argument?"*
      The interlocutor said: "If you deny that, you're giving up on practical reasoning." This sounds like the *Rational Requirement* or *Analytic* reading. But to dismiss the *spectrum argument* (which is about value, not just preference), they need the *Substantive Value* reading.

