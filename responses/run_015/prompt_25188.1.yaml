      *   *Self-Correction on "Trivial/Substantive/False":*
          *   Analytic: Trivial (linguistic).
          *   Rational: Substantive (normative).
          *   Substantive Axiological: Substantive (metaphysical/normative).
          *   Comparability: Substantive.

      *   *Wait, one more nuance:* Temkin specifically argues that "better than" is not transitive. Parfit uses the continuum to argue for the Repugnant Conclusion (accepting transitivity leads to repugnant result). The interlocutor is using transitivity to *avoid* the Repugnant Conclusion or similar spectrum worries (likely arguing that since A is not better than Z, the chain must break somewhere).
      *   Actually, usually the move is: "Transitivity is a constraint. Therefore, if A > B > ... > Z, then A > Z. If A > Z is false, one of the small steps must be false." This is the "Discontinuity" move.
