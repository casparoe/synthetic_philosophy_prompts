          *   *Argument:* No. The cost of physical instantiation doesn't change the logical derivation. If the theory is sound, the TE is as robust as the experiment. The TE isolates the variables better than a noisy drop tower.
      *   **Task 2: The "Argument View" (Norton's Challenge):**
          *   Objection: The TE is just an argument in disguise. Premises (Archimedes + Equivalence) $\to$ Conclusion. No new knowledge.
          *   *Counter-Argument:* This is too narrow. "New knowledge" isn't just new premises; it's new *accessibility*. We possess the premises (fluid dynamics, equivalence) but fail to see their conjunction's implication without the narrative visualization. The TE forces a synthesis. It transforms *implicit* knowledge into *explicit* knowledge. That counts as epistemic gain.
