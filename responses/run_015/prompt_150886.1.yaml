      *   **Constraint 2 (Famous Examples):** Do *not* build the essay around Galileo, Newton's Bucket, or Maxwell's Demon (use only if necessary).
      *   **Constraint 3 (Verdict):** Must defend a committed conclusion, not a survey.
      *   **Specific Tasks:**
          1.  Solve the physics case (Where does the balloon go? What supplies the force?).
          2.  Address Falsifiability/Checkability: What would change the verdict? Does the fact that A is checkable and B is hard/expensive matter for the claim that TEs yield knowledge?
          3.  Address the "Argument View" (Norton): Was the verdict already in the premises (Archimedes, Equivalence, etc.), or did the imagining do work?
          4.  Address the "Unperformable TE" claim: Is the instructor right that unperformable TEs are the interesting ones? Does this case support trusting intuition in those cases?
      *   **Tone:** Academic, argumentative, committed.

  2.  **Solve the Physics Case:**
      *   **Cabin A (Free Fall/Inertial):**
          *   Environment: Microgravity (effectively zero-g).
          *   Fluid (Air): In free fall, there is no pressure gradient caused by gravity ($\nabla P = \rho \mathbf{g} = 0$). The air is weightless.
          *   Balloon (Helium): Less dense than air, but buoyancy requires a pressure gradient (which requires an effective gravitational field).
          *   Result: The balloon stays put (relative to the cabin). It floats neutrally. There is no buoyant force.
          *   Force: Net force is zero (ignoring minor transient air currents).
      *   **Cabin B (Rotating):**
          *   Environment: Centrifugal force acts as artificial gravity pointing *outward* from the axis.
          *   Fluid (Air): Co-rotating. Pressure increases from the axis outward ($\nabla P = \rho \omega^2 r$). High pressure at the wall, low pressure at the center.
          *   Balloon (Helium): Less dense than air.
          *   Buoyancy in rotating frame: Buoyancy points opposite to the effective gravity. Effective gravity is outward. Therefore, buoyancy is *inward* (toward the axis).
          *   Result: The balloon moves *inward* (toward the center of rotation), opposite to the "gravity" felt by the astronaut.
          *   Force: The pressure gradient in the air supplies the centripetal force required for the air to rotate. The helium balloon requires *less* centripetal force to maintain that radius than the displaced air. The pressure gradient pushes it inward more than is needed for its mass, driving it toward the axis.
      *   **Comparison:** This is counter-intuitive to many who think "helium goes up." In B, "up" is inward. In A, there is no "up."

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the verdict clearly. TEs *can* yield new knowledge, but not by magic; they reorganize existing theoretical commitments into a configuration that reveals implicit contradictions or consequences we hadn't explicitly derived. The Spacecraft Case supports this.
      *   **The Physics Verdict:**
          *   Cabin A: Balloon stays still. No pressure gradient.
          *   Cabin B: Balloon moves inward (toward axis). "Up" is centripetal.
