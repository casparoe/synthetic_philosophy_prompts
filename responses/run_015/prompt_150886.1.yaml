      *   *Avoid:* Don't get bogged down in Galileo/Newton history. Keep the focus on the Cabins.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe argue that TEs reveal Platonic truths.
      *   *Correction:* Too mystical for a science seminar. Stick to the "reorganization of empirical knowledge" view (Brown's middle ground or Norton with a twist). Let's go with the idea that TEs generate *modal* knowledge (what *would* happen) derived from theory, which counts as new knowledge of consequences.
      *   *Check:* Did I answer the "what would make you abandon the verdict" part? Yes, need to specify empirical failure.
      *   *Check:* Did I answer the "in principle checkable" part? Yes, cost vs. principle.
      *   *Check:* Did I answer the "unperformable" part? Yes, calibration argument.

  8.  **Final Polish:** Ensure the transition between the physics solution and the philosophical analysis is smooth. The physics *is* the data for the philosophy.

  **(Self-Correction on Cabin B Physics):** Wait, let me double-check the balloon in the rotating frame.
  *   Frame: Rotating with the cabin.
  *   Fictitious force: Centrifugal force ($m\omega^2r$) outward.
  *   Air: Subject to centrifugal force. Pressure gradient builds up outward to balance it. $\frac{dP}{dr} = \rho_{air} \omega^2 r$.
  *   Balloon: Volume $V$, Density $\rho_{He}$.
  *   Forces on Balloon:
      1.  Centrifugal force on mass: $F_{cf} = (\rho_{He} V) \omega^2 r$ (Outward).
      2.  Buoyant force (due to pressure gradient): $F_{buoy} = - (\nabla P) V = - (\rho_{air} \omega^2 r) V$ (Inward).
  *   Net Force: $F_{net} = (\rho_{He} - \rho_{air}) V \omega^2 r$.
  *   Since $\rho_{He} < \rho_{air}$, the term is negative. Net force is **Inward**.
  *   Result: Balloon moves toward the axis.
  *   Okay, physics is solid. "Helium goes up" means "Helium goes opposite the effective gravity vector." In B, effective gravity is outward, so Helium goes inward.

  9.  **Finalizing the Thesis:** The verdict is that TEs yield *novel epistemic access* to consequences of established theory, functioning as a cognitive catalyst rather than a source of new premises. The Spacecraft Case demonstrates this because while the physics is derivable from equations, the *prediction* is non-trivial without the conceptual setup, and its checkability validates the intuition used for uncheckable cases.

