          *   *Verdict:* We trust unperformable TEs *only because* performable ones have a track record of correctly applying theory. The Spacecraft Case acts as a calibration for the intuition used in the unperformable ones.

  4.  **Refining the Philosophy:**
      *   Need to engage with Brown (Platonism) vs. Norton (Argument View).
      *   My position: A modified Rationalism. TEs are arguments, but the *construction* of the scenario triggers cognitive processing that mere syllogisms do not. It's about *understanding*, not just validity.
      *   Key distinction: Propositional knowledge vs. Objectual understanding. The TE grants understanding.

  5.  **Refining the Physics:**
      *   Make sure the explanation of Cabin B is precise. It's often counter-intuitive. In a car turning left, a helium balloon goes left (into the turn). In a centrifuge, "gravity" is outward, so "up" is inward.
      *   Ensure the distinction between "force" and "effective force" is clear in the rotating frame.

