  *(Refining the Comparative Case)*: The prompt suggests Sassanid East vs. Roman West. Actually, the Sassanid empire *fell* in the 7th century. The Eastern Roman (Byzantine) empire persisted. The prompt likely implies comparing the *persistence* of imperial structures in the East (Rome) vs. the West. Or perhaps the survival of Sassanid bureaucracy under the Caliphate vs. Roman bureaucracy under Barbarians. I will address the East/West Roman split as the primary comparative control, as that controls for "Roman-ness."

