answer: |-
  The lineage starts without a **history**,
  The founder bears a fold, a **contribution**
  Of tissue duplicated by **accident**.
  It seals the shell within the drying **system**,
  Staving off metabolic **breakdown**,
  Making the wet interior **work**.

  The seal allows the snail to **work**,
  Though there is no selective **history**.
  If it leaks, there is **breakdown**,
  But no variation in **contribution**,
  For all are clones inside the **system**,
  Bound by the founder's **accident**.

  The phenotype persists by **accident**,
  The fold continues to **work**,
  Maintaining pressure in the **system**.
  Still there is no evolutionary **history**,
  No difference in survival **contribution**,
  No variant left to suffer **breakdown**.

  Then comes the second snail, allowing **breakdown**
  In variants born of sexual **accident**.
  Which finally alters **contribution**.
  The trait is tested, made to **work**,
  Selection writes a **history**,
  And fitness defines the **system**.

  What counts as function in the **system**?
  Is it the capacity to avoid **breakdown**,
  Or the long shadow of **history**?
  Was the fold always an **accident**,
  Until it learned to **work**,
  Or did it always make **contribution**?

  One measures survival **contribution**,
  One maps the causal **system**,
  One asks how well the parts **work**,
  One fears a functional **breakdown**,
  One calls it trait or **accident**,
  One demands a selective **history**.

  They argue over **contribution** and **breakdown**,
  Over the boundaries of the **system** and **history**,
  Whether function is **work** or **accident**.
