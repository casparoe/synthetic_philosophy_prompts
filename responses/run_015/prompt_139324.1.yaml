answer: |-
  1. The practice strictly presupposes that specification uncertainty constitutes irreducible ambiguity rather than risk, ruling out the second-order probabilities required to license Bayesian model averaging. It treats the set of defensible analyses as the complete representation of evidence, implying that no unique rational credence exists until unanimity is achieved.
  2. This framework rules out the view that evidence pins down a unique rational confidence, yet it is licensed by any epistemology treating methodological consensus as the bound of defensibility. It strictly forbids treating the spread as sampling noise to be canceled, but sits well with admitting the set's width depends on contingent human factors provided those factors define rational limits.
  3. The single point estimate in cost-benefit spreadsheets is inconsistent with the set-valued evidence step unless treated as a pragmatic fiction that must be replaced by range-based accounting to avoid false precision. To make these consistent, the funder must either apply the unanimity rule to economic inputs or acknowledge that the point estimate implicitly assigns zero weight to all but one specification.
  4. Funding replication to shrink uncertainty presupposes that additional data will contract the specification set, which contradicts the imprecise probability phenomenon where updating on coarse evidence can cause dilation. The policy assumes a convergent epistemology where evidence narrows bounds, denying the possibility that learning more could legitimately widen the interval of defensible opinions.
  5. If the funder took imprecision seriously all the way down, it would replace point estimates with interval-valued utilities and adopt a choice function that handles indecision rather than forcing a single optimal recommendation. This would require accepting that some policy questions have no determinate answer and that replication might sometimes increase rather than decrease decision-relevant uncertainty.
