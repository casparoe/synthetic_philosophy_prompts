answer: |-
  This is a sophisticated observation that cuts to the heart of political philosophy and legal theory regarding migration. You have identified a genuine tension: the law simultaneously asserts that unauthorized presence creates no rights *and* that long-term unauthorized presence can mature into a right to remain.

  You asked for a reconstruction of the underlying rationale, distinguishing between legal consensus, theoretical disputes, and my own synthesis. I will structure the response to honor those distinctions.

  ### 1. The Consensus: What the Law Actually Does
  First, to ground the philosophy, we must separate the *mechanics* (where there is high agreement among legal scholars and practitioners) from the *justification* (where there is dispute).

  **Consensus on Mechanics:**
  *   **The "No Claim" Doctrine:** It is legally settled that unlawful presence is a violation of status. In the U.S. context (which your description matches), Entry Without Inspection (EWI) triggers different bars than visa overstay. Unlawful presence generally accrues "unlawful time" that can trigger 3-year or 10-year bars to re-entry.
  *   **The "Rooting" Exception:** Discretionary relief exists (e.g., Cancellation of Removal for non-permanent residents). This requires continuous physical presence (usually 10 years), good moral character, and proof that removal would cause "exceptional and extremely unusual hardship" to a qualifying relative (citizen/LPR spouse, parent, or child).
  *   **The "Counting" Nuance:** It is legally settled that not all time counts equally. Time spent in detention, or time under certain forms of deferred action, may "stop the clock" on continuous presence. This is administrative fact, not theory.

  **Consensus on Justification:**
  *   There is **no consensus** on the philosophical justification for this tension. You will find confident claims online because different advocates (restrictionists, open borders, centrists) project their preferred theory onto the existing patchwork. The law is a compromise, and compromises rarely have a single coherent philosophical ground.

  ### 2. The Adverse Possession Metaphor: Theory vs. Reality
  Your friend's suggestion that this is "adverse possession" (squatters' rights) is a common analogy, but legally and theoretically imprecise.

  **Why it fits:**
  *   Both doctrines rely on the passage of time to convert a wrongful act into a protected interest.
  *   Both acknowledge that stability of tenure is sometimes more valuable than correcting a past wrong.

  **Why it fails (and what it would predict differently):**
  *   **Automaticity:** Adverse possession is automatic upon meeting statutory requirements. Immigration relief is **discretionary**. A judge *can* grant Cancellation of Removal after 10 years; they are not *compelled* to.
  *   **Hostility:** Adverse possession requires a "hostile" claim against the owner's title. Immigration law explicitly denies the immigrant is making a valid claim until the moment relief is granted.
  *   **State Intent:** Adverse possession punishes a "sleeping" owner. The immigration state is not sleeping; it is actively enforcing, but chooses *selective forbearance*.

  **Verdict:** This is a **bad metaphor** for the underlying theory. If immigration law were truly adverse possession, your colleague would have automatically become lawful after year 10 without applying for relief, and the state would be estopped from removing her. The fact that she must apply and prove hardship shows the state retains the ultimate title throughout.

  ### 3. Reconstruction: The "Jurisdiction vs. Membership" Distinction
  You asked what view of territorial rights this package presupposes. The most robust reconstruction is not that the state is confused, but that it is operating on **two distinct tracks of authority** that inevitably collide.

  **Track A: The Right to Exclude (Sovereignty)**
  This underpins the "No Claim" rule. The state views itself as a private association or a property owner regarding *entry*. Membership is consensual. If you bypass the consent mechanism (the visa/border check), you have no standing. This explains why *how* you entered matters 20 years later. The original sin is a breach of the association's bylaws.

  **Track B: The Power to Govern (Jurisdiction)**
  This underpins the "Long Residence" rule. Once a person is physically present, they are subject to the state's jurisdiction. They pay taxes, obey laws, and send children to schools. The state exerts authority over them.
  *   **The Conflict:** If the state exerts full authority over a person for 11 years (treating them as a subject), removing them eventually looks less like "rejecting a member" and more like "exiling a subject."
  *   **The Resolution:** The law presupposes that **enforcement has a cost-benefit threshold.**
      *   *Early on:* The cost of removal is low; the sovereignty interest is high. (Result: Deport).
      *   *Later on:* The cost of removal (breaking up a family, removing a taxpayer, disrupting a worker) becomes disproportionately high compared to the benefit of enforcing the border rule. (Result: Discretionary Relief).

  **Why some time counts and some doesn't:**
  This is the key to your observation about "ordinary social life."
  *   **Ordinary Job/Lease:** This indicates **integration**. The person is woven into the economic and social fabric. Removing them causes "collateral damage" to the community (employer, landlord, schools).
  *   **Detention/Tolerated Status:** This indicates **limbo**. The person is held in a cage or allowed to stay temporarily without integration. They are not "woven in." Therefore, removing them causes less social disruption.
  *   **The Presupposition:** The law is not rewarding the *immigrant* for their time; it is protecting the *community* from the disruption of severing established ties.

  ### 4. Testing the "Social Membership" Theory
  You asked: *If we took the social-membership story seriously as the actual ground of the practice, what would have to change?*

  If social membership were the *sole* ground (rather than a mitigation of sovereignty), the system would look very different.

  1.  **Entry Method Would Not Matter:** If membership is based on current social ties, it shouldn't matter if you jumped a fence or walked through a gate 15 years ago. The current system punishes the *mode* of entry indefinitely, which contradicts a pure social membership theory.
  2.  **Tourists/Temporary Workers:** Under a pure social membership theory, a tourist who stays 10 years and integrates should gain the same claim as an undocumented worker. Currently, the law distinguishes based on *intent* at entry.
  3.  **Citizens Abroad:** If membership is about "being woven into social life," citizens who live abroad for 20 years should arguably lose their right to return (as they have no current social ties). They do not. This proves that **legal status (citizenship)** is distinct from **social fact (residence).**

  **Conclusion on this point:** The current practice does *not* presuppose social membership as the *ground* of rights. It presupposes social membership as a **constraint on enforcement.** The state says: "You have no right to be here, but we cannot remove you without hurting ourselves."

  ### 5. Summary of Distinctions (Consensus vs. Dispute vs. Reconstruction)

  Per your request, here is the breakdown of the claims above:

  | Claim | Status | Explanation |
  | :--- | :--- | :--- |
  | **"Unlawful presence creates no automatic right."** | **Legal Consensus** | Settled law in most Western jurisdictions. Presence alone is not a claim. |
  | **"Long residence can lead to discretionary relief."** | **Legal Consensus** | Statutes exist (e.g., Cancellation of Removal) allowing this conversion. |
  | **"Time in detention stops the residency clock."** | **Legal Consensus** | Administrative rule regarding "continuous physical presence." |
  | **"This system is morally coherent."** | **Live Dispute** | Restrictionists argue it rewards lawbreaking; Advocates argue it recognizes human reality. |
  | **"The state is like a property owner (Adverse Possession)."** | **My Analysis** | **False.** The state retains discretion and does not "sleep" on its rights. |
  | **"The system balances Sovereignty vs. Jurisdiction."** | **My Reconstruction** | This is the most explanatory theory. It explains why entry matters (Sovereignty) *and* why ties matter (Jurisdiction/Cost). |
  | **"Social Membership is the ground of the right."** | **My Analysis** | **False.** If it were, entry method wouldn't matter and citizens abroad might lose rights. It is a *mitigating factor*, not a *ground*. |

  ### 6. Final Synthesis for Your Context
  You asked where the practice rests on a real distinction and where it is a compromise.

  *   **Real Distinction:** The distinction between **Admission** (getting in) and **Deportation** (getting kicked out). The state claims an absolute right to control the first, but acknowledges a pragmatic limit on the second. The "no claim" rule protects the first; the "long residence" rule limits the second.
  *   **Administrative Compromise:** The specific counting of time (e.g., why 10 years and not 5? why does detention stop the clock?) is largely arbitrary administrative line-drawing. It is designed to create a bright-line rule for judges to manage caseloads, not because year 9 is philosophically different from year 10.

  **What this means for your colleague:**
  The system is not designed to recognize her *moral* claim based on her contribution (though that is the humanitarian argument). It is designed to recognize that her removal is now *administratively and socially costly* for the state. The "oddness" you feel is the friction between the state's theoretical absolute power to exclude and its practical inability to exercise that power without self-harm after a certain duration.

  The law presupposes that the state is a **Gatekeeper** (absolute right to lock the door) that eventually becomes a **Landlord** (responsibilities to those who have lived in the building for a decade). The contradiction you see is the transition point between those two roles.
