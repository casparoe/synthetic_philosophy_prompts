prompt: |-
  I work in HR at a mid-sized manufacturing firm, and over the past year I've been helping a colleague — she's lived in this country for about eleven years, arrived on a visitor visa at twenty-two, overstayed, and has since worked, paid taxes, and raised two children here — try to get her situation regularized. Reading through the rules with her, I was struck by how internally odd the whole structure seems. Officially the position appears to be that unlawful presence creates no claim at all: the fact that you managed to stay is not supposed to count in your favour, and her lawyer told us it even matters how you got here, with entry without inspection treated differently from entering legally and overstaying. Yet the same body of law contains long-residence or 'rooting' routes, where a lease, a work history, school records and enough years can convert unlawful presence into a lawful permit. The lawyer also said that some kinds of time don't count, or count less — time in immigration detention, or a run of short renewable 'tolerated' statuses where you may stay and work but can't travel or bring your family — while time spent in an ordinary job clearly does. So the law says that mere presence is worthless, but it also seems to be keeping a very specific kind of score: not presence on the territory, but participation in ordinary social life.

  A friend I was discussing this with said it's really just adverse possession, or squatters' rights: the state slept on its claim and after long enough the claim lapses. That fit badly to me — the state never meant to give anything up, it enforces constantly, and the doctrine that unlawful presence confers nothing is supposed to block exactly this result. But then I can't see what the practice does presuppose. If the state really has the kind of right over entry and membership that a private association has over its members, or an owner over her house, then what is a long-residence amnesty doing other than conceding an exception to the one right that was supposed to be the whole point? And if instead the relevant thing is that the state's authority is over a population it actually governs, so that what matters is who is subject to its laws and woven into its social life, then why does crossing a line without permission carry the weight it evidently does, and why is that weight apparently never fully erased by twenty years of residence, work and children?

  I'd like a reconstruction rather than a verdict. What view of the right to exclude, of territorial rights, or of political membership does the package — the no-claim-from-unlawful-presence rule, the long-residence route, and the fact that some sorts of time count and others don't — actually presuppose, as opposed to merely sit well with? Where does the practice rest on a real distinction, and where is it an administrative or political compromise that several different theories could equally license? Is the adverse-possession framing a genuinely alternative theory or just a bad metaphor for the same one, and what would it predict differently? If we took the social-membership story seriously as the actual ground of the practice, what would have to change — would length of residence stop mattering, would tourists or posted temporary workers start accruing claims, would citizens who have lived their whole lives abroad lose theirs? Finally, please keep separate the things that people who actually work on these questions would agree on from the things that are live disputes or your own reconstruction of a rationale, and say which is which; I've read confident claims in both directions on the internet and I have no way to tell them apart.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** HR professional at a mid-sized manufacturing firm.
      *   **Context:** Helping a colleague (undocumented immigrant, 11 years in country, arrived on visitor visa, overstayed, works, pays taxes, has children) regularize status.
      *   **Observation:** Notices a tension in immigration law/rules.
          *   Rule A: Unlawful presence creates no claim (entry method matters, "clean hands" doctrine).
          *   Rule B: Long-residence/"rooting" routes exist (lease, work, school, years can convert unlawful presence to lawful).
          *   Rule C: Some time counts, some doesn't (detention/tolerated status vs. ordinary job).
      *   **Friend's Analogy:** Adverse possession (squatters' rights). User rejects this (state enforces constantly, doctrine explicitly denies claims).
      *   **Core Question:** What view of the right to exclude, territorial rights, or political membership does this *package* of rules actually presuppose?
      *   **Specific Sub-questions:**
          *   Where is there a real distinction vs. administrative compromise?
          *   Is adverse possession a valid theory or bad metaphor? What would it predict differently?
          *   If social membership were the actual ground, what would change (tourists, citizens abroad)?
          *   **Crucial Constraint:** Distinguish between consensus among experts vs. live disputes vs. my own reconstruction. The user is frustrated by confident conflicting claims online.

  2.  **Deconstruct the Legal/Philosophical Tension:**
      *   *The Tension:* Sovereignty/Border Control (Right to Exclude) vs. Social Fact/Integration (Right to Remain based on ties).
      *   *The "No Claim" Rule:* Reflects the *Voluntarist/Consent* model. Membership requires permission. Violation voids claims.
      *   *The "Long Residence" Rule:* Reflects the *Social Fact/Community* model. Presence creates ties; severing them is costly/unjust.
      *   *The "Counting Time" Nuance:* Reflects *Administrative Feasibility & Deterrence*. Not all presence is equal (detention isn't integration; tolerated status is limbo).

  3.  **Address the "Adverse Possession" Analogy:**
      *   *Why it fits:* Time + Possession = Right.
      *   *Why it fails:* Adverse possession requires *hostile* claim and *sleeping* owner. Immigration enforcement is active (not sleeping). The state explicitly denies the right is being transferred until the moment it is.
      *   *Prediction Difference:* Adverse possession is automatic after a statute of limitations. Immigration amnesty is discretionary/procedural.

  4.  **Develop the "Reconstruction" (The Core Task):**
      *   What theory holds these contradictions together?
      *   *Theory:* **Qualified Territorial Jurisdiction with a Deterrence Override.**
      *   *Explanation:* The state claims authority over everyone *in* the territory (hence taxes, laws apply). However, to maintain the *system* of borders, it must penalize the *mode* of entry. The "long residence" exception isn't admitting the entry was okay; it's admitting that *removal* is now disproportionately costly compared to the benefit of enforcement.
      *   *Key Distinction:* It's not that presence creates a *right*, it's that removal creates a *harm* that outweighs the enforcement interest *after* a threshold.

  5.  **Address the "Social Membership" Hypothesis:**
      *   If social membership were the *sole* ground:
          *   Tourists wouldn't accrue claims (they aren't members).
          *   Citizens abroad might weaken claims (loss of social ties).
          *   Entry method wouldn't matter (only current ties).
      *   *Current Reality:* Entry method *does* matter. This proves Social Membership is not the *sole* ground; it's a mitigating factor against the Sovereignty claim.

  6.  **Distinguish Consensus vs. Dispute (Crucial Step):**
      *   *Consensus:* Law is a mix of sovereignty and humanitarian/pragmatic discretion. "Unlawful presence" is a specific legal term of art with specific triggers (3/10 year bars). Discretionary relief exists (Cancellation of Removal).
      *   *Dispute:* Philosophical justification. Is it moral (ties) or pragmatic (enforcement costs)? Is the "illegal" label morally weighty or just administrative?
      *   *My Reconstruction:* I need to label my synthesis clearly as such.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the observation. Validate the tension.
      *   *Section 1: The Consensus (Legal Mechanics).* Clarify what is legally agreed upon (e.g., Entry Without Inspection vs. Overstay, Cancellation of Removal requirements). This grounds the philosophical discussion in reality.
      *   *Section 2: The Adverse Possession Metaphor.* Analyze it. It's a metaphor for *statutes of limitation*, but fails on *automaticity* and *state intent*.
      *   *Section 3: The Reconstruction (The "Two-Track" Theory).* This is the meat.
          *   Track 1: Sovereignty/Consent (The "No Claim" rule).
          *   Track 2: Jurisdiction/Social Fact (The "Rooting" rule).
          *   Synthesis: The state asserts authority over the person *because* they are there (jurisdiction), but reserves the right to eject them *unless* ejection becomes too disruptive (proportionality).
          *   Why some time counts: "Integration" vs. "Limbo." Detention isn't integration.
      *   *Section 4: Testing the Social Membership Theory.* Answer the specific "what would change" questions.
      *   *Section 5: Consensus vs. Dispute vs. Reconstruction.* Explicitly label these as requested.

  8.  **Refining the Tone:**
      *   Must be professional, analytical, and empathetic to the HR context without giving legal advice.
      *   Avoid political advocacy. Stick to political philosophy and legal theory.
      *   Ensure the distinction between "legal consensus" (what the law *is*) and "theoretical justification" (what the law *means*) is clear.

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I answer the specific question about "tolerated status" vs. "ordinary job"?
      *   *Correction:* Need to explain that "tolerated status" (like TPS or DACA sometimes) is often viewed as "precarious" presence, whereas "ordinary job" implies deeper social weaving. Actually, legally, unauthorized work time often *doesn't* count for certain relief (like Cancellation of Removal requires "good moral character" which unauthorized work can sometimes complicate, though mere presence is the main bar). I need to be careful not to give specific legal advice but explain the *logic* of why the law distinguishes them (integration vs. waiting).
      *   *Check:* Did I distinguish consensus from my view?
      *   *Correction:* Add a specific section or clear signposting.

  10. **Final Polish:** Ensure the distinction between "Right to Exclude" and "Power to Govern" is sharp. This is the philosophical key. The state governs everyone inside (jurisdiction) but only admits members it chooses (membership). The tension arises when governance creates membership-like ties.

  *(Self-Correction on Legal Details)*: I need to be careful not to imply that *working* while undocumented automatically counts towards "good moral character" or residency in all contexts. In the US (assuming US context based on "visitor visa," "overstay," "EWI"), unauthorized work is technically a violation, but continuous physical presence is the key metric for Cancellation of Removal (INA 240A). However, the prompt mentions "time in detention doesn't count." This is legally accurate (stopped continuous presence). The prompt mentions "tolerated status." This likely refers to periods where removal is stayed but status isn't granted. I should focus on the *logic* of these distinctions rather than specific statutes.

  *(Final Plan)*:
  1. Validate the observation (it's a known theoretical tension).
  2. Consensus Check (Legal mechanics).
  3. Critique Adverse Possession.
  4. The Reconstruction (Sovereignty vs. Jurisdiction).
  5. The Social Membership Test.
  6. Explicit labeling of Consensus/Dispute/Reconstruction.

