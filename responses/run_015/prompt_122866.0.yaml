answer: |-
  **Exam Question**

  **Question 1 (20 Marks)**

  Consider the following case: An agent is in Damascus tonight and Death is coming for her. She may either stay in Damascus or travel to Aleppo. Death is an infallible predictor of what she will do: his location already matches whichever option she will in fact choose, so if she stays he is in Damascus and if she goes he is in Aleppo. She cannot causally influence his prediction; her act is merely a perfect indicator of his location. Before she decides, let $p$ be her subjective probability that she will end up staying; because Death is infallible, her probability that Death is in Damascus is also $p$. The utilities are as follows. If she stays and Death is in Damascus, she dies in Damascus, utility zero. If she stays and Death is in Aleppo, she survives in Damascus, utility ten. If she goes and Death is in Damascus, she survives in Aleppo but bears the cost of the journey, utility nine. If she goes and Death is in Aleppo, she dies in Aleppo after a wasted journey, utility minus one.

  Assuming the agent begins in a state of maximal uncertainty ($p=0.5$), answer the following:

  1.  Compute the expected utility of staying and going according to both Evidential Decision Theory (EDT) and Causal Decision Theory (CDT). Show that on this setup, both theories initially converge on recommending the same pure act.
  2.  Explain the phenomenon of decision instability in this case. Trace how the agent's credence $p$ that she will stay drives the probability that Death is in Damascus, and demonstrate why no pure act is ratifiable (i.e., why becoming confident that one will perform an act makes the alternative act look better).
  3.  Assess whether a randomized or mixed strategy (e.g., using a quantum device to decide) can be a rational response. Discuss what it would show about decision theory if the only stable response is to make one's action unpredictable to the predictor, noting both the survival benefits and the conceptual difficulties regarding rational agency.

  ***

  **Model Answer**

  The decision matrix for the agent is defined by her act (Stay or Go) and the state of the world (Death in Damascus or Death in Aleppo). The utilities are: $U(\text{Stay, Dam}) = 0$; $U(\text{Stay, Alep}) = 10$; $U(\text{Go, Dam}) = 9$; $U(\text{Go, Alep}) = -1$.

  First, we compute the recommendations. For EDT, expected utility depends on conditional probabilities. Since Death is an infallible predictor, $P(\text{Dam} | \text{Stay}) = 1$ and $P(\text{Alep} | \text{Go}) = 1$. Thus, $EU_{EDT}(\text{Stay}) = 1(0) + 0(10) = 0$. $EU_{EDT}(\text{Go}) = 0(9) + 1(-1) = -1$. EDT recommends Stay. For CDT, expected utility depends on counterfactuals where the act does not cause the state. Assuming initial uncertainty ($p=0.5$), the probability Death is in Damascus is independent of the causal impact of the act, so $P(\text{Dam}) = 0.5$. Thus, $EU_{CDT}(\text{Stay}) = 0.5(0) + 0.5(10) = 5$. $EU_{CDT}(\text{Go}) = 0.5(9) + 0.5(-1) = 4$. CDT also recommends Stay. Both theories converge on the pure act of Staying.

  However, this recommendation is unstable. The mechanism of instability relies on the link between the agent's credence $p$ (that she will Stay) and the probability of the state. Because Death predicts perfectly, $P(\text{Dam}) = p$. As the agent deliberates and her credence $p$ shifts, the expected utilities shift. If she becomes confident she will Stay ($p \to 1$), then $P(\text{Dam}) \to 1$. Under CDT, $EU(\text{Stay})$ drops to 0, while $EU(\text{Go})$ rises to 9 (since Death is in Damascus, Going yields survival). Thus, confidence in Stay makes Go preferable. Conversely, if she becomes confident she will Go ($p \to 0$), then $P(\text{Dam}) \to 0$. $EU(\text{Stay})$ rises to 10, while $EU(\text{Go})$ drops to -1. Confidence in Go makes Stay preferable.

  This implies no pure act is ratifiable. An act is ratifiable only if it maximizes expected utility conditional on the belief that one will perform it. If the agent believes she will Stay, she assigns $P(\text{Dam})=1$, making Go the superior option (9 vs 0). If she believes she will Go, she assigns $P(\text{Dam})=0$, making Stay the superior option (10 vs -1). The evidential slogan that one should do what one would most want to learn one will do fails here, as learning one will Stay makes one wish one had gone.

  Finally, a mixed strategy offers a potential solution. If the agent uses a genuinely chancy device (e.g., a quantum coin) to decide, Death cannot predict the outcome. Her action becomes unpredictable, breaking the link between her deliberation and Death's location. Death must guess, effectively fixing $P(\text{Dam}) = 0.5$ regardless of her internal credence. This raises her chance of survival from zero (in any pure act, Death is where she is) to one half (Death guesses wrong 50% of the time). The expected utility of this policy is $4.5$, which exceeds the ratifiable value of any pure act.

  However, this raises conceptual difficulties. Standard decision theory recommends acts, not policies of randomization. Recommending a mixed strategy implies that rationality requires making oneself less than fully predictable, potentially conflicting with the idea that reasons should determine action uniquely. If the only stable solution is to abdicate deliberative control to a chance device, it suggests that in strategic environments with perfect predictors, rational agency may require self-imposed ignorance or randomness to maximize utility.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Decision Matrix and Theory Convergence (5 Marks)**
  *   **Must-hit:** Correctly states utilities and calculates $EU$ for EDT (Stay=0, Go=-1) and CDT at $p=0.5$ (Stay=5, Go=4). Explicitly states both recommend Stay.
  *   **Common Error:** Candidates often treat CDT as using conditional probabilities like EDT, or fail to fix $p=0.5$ leading to indeterminate CDT results.

  **2. Mechanism of Instability and Ratifiability (5 Marks)**
  *   **Must-hit:** Explains that $P(\text{Dam}) = p$. Traces how increasing $p$ lowers $EU(\text{Stay})$ and raises $EU(\text{Go})$. Concludes neither act is ratifiable because confidence in one act validates the other.
  *   **Common Error:** Candidates gesture at "instability" without showing the mathematical link between credence $p$ and state probability, or claim EDT is stable when it is not ratifiable.

  **3. Mixed Strategy Assessment (5 Marks)**
  *   **Must-hit:** Notes mixed strategy breaks prediction link, raising survival from 0 to 0.5 and EU to 4.5. Identifies this as superior to pure acts.
  *   **Common Error:** Candidates claim randomization guarantees survival (it does not, only 50%) or fail to calculate the improved expected utility.

  **4. Conceptual Implications (5 Marks)**
  *   **Must-hit:** Discusses the tension between rational agency and randomization (e.g., theory recommending policies vs. acts, or reasons vs. chance).
  *   **Common Error:** Candidates treat randomization as a purely technical fix without addressing the philosophical cost to the concept of rational choice.

  **Grading Boundary:**
  *   **A (16-20):** Precise mechanism of instability (credence updating state probs) + substantive evaluation of mixed strategy costs.
  *   **B (12-15):** Correct computations + general description of instability without tracing the mechanism or superficial treatment of randomization.
