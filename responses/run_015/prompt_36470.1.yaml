      *   **Specific Requirements:**
          1.  **Juror Selection Rubric:** Operationalize Hume's "Ideal Critic" criteria (Strong Sense, Delicacy, Practice, Comparison, Freedom from Prejudice). Address circularity. Fit on a page.
          2.  **Deliberation Rules:** How to justify votes? Handling genre differences (comedy vs. slow cinema). Handling disagreement. Handling Audience Vote feedback.
