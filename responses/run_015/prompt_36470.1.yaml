  9.  **Final Polish:** Check against constraints. (Page limit for rubric section - I will condense it visually. Usable by non-philosophers - avoid jargon where possible or define it. Test cases included. Final philosophical reflection included.)

  *(Self-Correction on the Advisor Case)*: Wait, if the Advisor is a "true judge" generally, does a genre preference disqualify them? Hume says prejudice is preferring one's own culture/era or personal interest. A genre aversion is a form of prejudice against the *kind* of art. If the festival includes comedy, a juror who refuses to validate comedy is prejudiced against the *field*. I need to be firm here: The Advisor is compromised.

  *(Self-Correction on Moral Nasty Case)*: Hume is actually a bit complex on morality. In *Of the Standard of Taste*, he says where moral sentiments differ, we might not find a standard. But generally, he thinks vice is ugly. I will take the stronger stance: Moral flaw *is* aesthetic flaw for Hume.

  *(Final check on "Objectivity vs Defensibility")*: This is the crux. Hume promises a standard, but it rests on human sentiment. The procedure creates *inter-subjective agreement*, not metaphysical truth. I need to make sure the conclusion lands this plane.

