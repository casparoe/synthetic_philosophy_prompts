      *   *Case 2: Morally Nasty Film.* Hume argues moral sentiments are part of aesthetic response. If the morality is offensive, it disrupts the sentiment of beauty. *Result:* Jury *must* dock it. Aesthetic perfection cannot fully override moral repugnance. (This might be annoying if the user wants formalism).

