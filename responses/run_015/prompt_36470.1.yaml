answer: |-
  Here is the **Humean Jury Protocol (HJP)**. It is designed to be printed as a 3-page handout for your organizers and jurors. It translates *Of the Standard of Taste* into administrative procedure without requiring the jurors to read the text.

  ***

  # PAGE 1: JUROR SELECTION RUBRIC
  **Goal:** Select 5 "Ideal Critics" based on capacity, not past verdicts.
  **Constraint:** We cannot check if they pick "good" art (circular). We check if they are *capable* of picking it.

  | Humean Criterion | Operational Test (Interview/Questionnaire) | Scoring (1-5) | Notes on Circularity |
  | :--- | :--- | :--- | :--- |
  | **1. Practice** | **CV Check:** List total hours spent analyzing film (formal study + critical writing). <br>*Threshold:* Min. 3 years serious engagement. | | **Low Circularity.** Experience is a prerequisite for delicacy, not a guarantee of it. |
  | **2. Comparison** | **The List:** Submit top 10 films of all time. <br>*Check:* Must span at least 3 decades, 3 countries, and 3 genres. | | **Low Circularity.** Demonstrates exposure to varied standards. |
  | **3. Delicacy of Taste** | **The Clip Test:** Watch a 2-minute neutral scene. Write 150 words on *how* lighting/sound shaped emotion (not *what* happened). <br>*Check:* Ability to perceive minute details and link them to sentiment. | | **Medium Circularity.** We judge their delicacy by *our* delicacy. Acknowledge this bias. |
  | **4. Good Sense** | **The Intent Question:** "Describe a film you disliked but acknowledge is well-made. Why?" <br>*Check:* Ability to separate personal taste from technical execution. | | **Low Circularity.** Tests reason's ability to regulate sentiment. |
  | **5. Freedom from Prejudice** | **The Genre Question:** "Is there a genre you refuse to judge on its own terms?" <br>*Check:* If "Yes" (e.g., Comedy, Horror, Reality TV), they are **recused** from those categories or disqualified if the festival is mixed. | | **High Circularity.** We define prejudice as "bias against what we think is valid." See *Test Case 1*. |

  **Selection Rule:** Pick the top 5 scorers. If a tie exists, prefer the candidate with more **Comparison** (breadth) over **Practice** (depth).
  **Note on Circularity:** We are not selecting people who will pick the *right* winner. We are selecting people whose *process* matches the Humean ideal. If they fail to converge, the process remains valid even if the verdict is disputed.

  ***

  # PAGE 2: DELIBERATION RULES & TIME PROXY
  **Goal:** Reach a "Joint Verdict" in 4 hours.

  ### A. Justification Requirements
  No juror may vote "I liked it." Every recommendation must follow the **Feature-Sentiment Link**:
  *   *Invalid:* "The acting was great."
  *   *Valid:* "The actor's hesitation in scene 2 created a sentiment of unease that fit the director's intent."
  *   **Rule:** If a juror cannot point to a specific feature (editing, sound, script) that caused their sentiment, their vote is voided for that film.

  ### B. The Genre Problem (Comedy vs. Slow Cinema)
  Hume states every species of art has its own excellence.
  *   **Rule:** Judge the film against its *own aims*, not against other films.
  *   **The Ranking Problem:** How to rank a great comedy against a great drama?
  *   **Solution:** Use **Effectiveness of Intent**. Which film more completely realized what it set out to do?
  *   **Stop-Loss:** If a juror argues "It is great *for a comedy*," they must then answer: "Did it succeed as a film?" If the answer is no, it cannot win the Main Prize. The Main Prize is for *Film*, not *Genre Excellence*.

  ### C. The Audience Vote
  *   **Rule:** The Audience Vote is **informational only**. It enters deliberation *last*.
  *   **Humean Explanation for Organizers:** The Audience measures *immediate pleasure* (the "banquet"). The Jury measures *refined sentiment* (the "nutrition"). They are different metrics.
  *   **If they diverge:** Do not change the Jury prize. Instead, issue a statement: "The Jury acknowledges the Audience Award winner resonated more broadly. The Jury Prize winner demonstrates higher durability of craft." (See Time Proxy).

  ### D. Disagreement & The Time Proxy
  We cannot wait 50 years. We must use a proxy for "Survival."
  *   **Proxy:** **Durability of Argument.**
  *   **Procedure:** In the final round, ask: "Which of these top 3 films will we still be arguing about next year?"
  *   **Rationale:** Hume argues time filters out fashion. Films that generate sustained critical debate (even negative debate) survive longer than films that offer immediate, exhaustible pleasure.
  *   **Tie-Breaker:** If jurors are deadlocked (3 vs 2), the film with the higher "Durability of Argument" score wins. Hume admits some disagreement is "blameless" due to temperament; in such cases, privilege the work that demands more re-viewing.

  ***

  # PAGE 3: TEST CASES & PHILOSOPHICAL DISCLAIMER
  **Run these scenarios before the festival starts to calibrate the Jury.**

  ### Case 1: The Advisor (The Prejudice Test)
  **Profile:** Expert critic, writes beautifully, but publicly hates comedies ("Comedy is beneath cinema").
  **Humean Verdict:** **Disqualified (or Recused).**
  **Reasoning:** Hume's "Freedom from Prejudice" requires the critic to place themselves in the work's intended context. A stable genre aversion is not a "humor" (temperament); it is a pre-existing rule that overrides the work's intent. If the festival includes comedies, a juror who *a priori* devalues them lacks the necessary impartiality.
  **The Annoying Truth:** Your advisor is a "True Judge" of Drama, but a "Biased Judge" of the Festival. If you seat them, you violate the protocol. If you value the protocol, you cannot seat them on a mixed-genre jury.
  **Defense:** "We value your expertise, but Humean procedure requires jurors to suspend genre hierarchies. We cannot risk the appearance of prejudice against the comedy entries."

  ### Case 2: The Technically Perfect, Morally Nasty Film
  **Profile:** Flawless cinematography/editing. Premise is deeply offensive (e.g., gleeful cruelty without irony).
  **Humean Verdict:** **Docked Significantly.**
  **Reasoning:** For Hume, moral sentiment and aesthetic sentiment are intertwined. "Vice is inherently ugly." If the moral content triggers repugnance in the Ideal Critic, that repugnance *is* an aesthetic flaw. You cannot separate the "how" from the "what."
  **Procedure:** The Jury must record in the minutes: "Technical excellence acknowledged, but moral sentiment disrupted aesthetic appreciation."
  **The Annoying Truth:** You cannot award this film the top prize, even if it is "better made." To do so would be to claim moral flaws are aesthetically neutral, which Hume denies.
  **Defense:** "The Standard of Taste includes moral sentiment. A work that alienates our shared humanity fails the test of universal appeal required for the top prize."

  ***

  # FINAL REFLECTION: OBJECTIVITY OR DEFENSIBILITY?

  **Where is this a Judgment Call wearing a Hume Costume?**
  1.  **The Delicacy Test:** You (the organizer) are designing the clip test. Your choice of clip presupposes what "delicacy" looks like. You are smuggling your own taste into the selection of the judges.
  2.  **The Time Proxy:** "Durability of Argument" is a guess. Sometimes the films we argue about are just annoying, not great. Hume's 50-year filter is real; your 4-hour proxy is a simulation.
  3.  **The Moral Flaw:** Hume's link between morality and aesthetics is the most contested part of his essay. You are enforcing a specific moral-aesthetic link as if it were procedural law.

  **Does this get you Objectivity?**
  No. Hume does not offer metaphysical objectivity (truth independent of humans). He offers **Inter-Subjective Stability**.

  **Why is Defensibility Enough?**
  Last year, you had a *Verdict without a Process* (Tarkovsky riff wins, crowd angry). This year, you will have a *Process that generates a Verdict*.
  *   If the crowd hates the winner, you do not say "You are uncultured."
  *   You say: "We utilized a standardized procedure designed to minimize individual bias and maximize long-term durability. We respect your pleasure, but this prize tracks a different metric."

  This shifts the conflict from **Taste vs. Taste** (which is unresolvable) to **Process vs. Outcome** (which is resolvable). You aren't promising the *right* answer; you are promising a *legitimate* way of asking the question. In a university department, that is the only objectivity you can actually afford.
