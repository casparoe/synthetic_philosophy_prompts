answer: |-
  Here is a 30-minute teaching plan structured to handle the specific conceptual traps you identified.

  ### **Session Goal**
  Move students from "we can't measure it" (epistemic limit) to "there is nothing to measure" (ontological indeterminacy) using a structural barrier case, without collapsing into "anything goes" conventionalism.

  ---

  ### **0:00 – 0:05 | Phase 1: The Lock (Setting the Constraint)**
  **Goal:** Pre-empt the "science needs more data" objection immediately.
  **Action:**
  1.  **Define the Barrier:** Do not start with the example. Start with the constraint. Draw a light cone on the board.
  2.  **The Rule:** State clearly: "For this session, 'inaccessible' does not mean 'expensive' or 'technologically hard.' It means **causally disconnected**. No signal, particle, or influence from Region X can ever reach Observer Y, even in infinite time."
  3.  **The Trap:** Ask the room: "If I say 'We just need better telescopes,' how have you violated the rule?"
      *   *Why this first:* If you let them think it's a technological limit, the rest of the seminar is just sociology of science. You need them to accept the **logical impossibility** of verification before you introduce the ontology problem.

  ### **0:05 – 0:15 | Phase 2: The Carrying Example (The Toy Case)**
  **Goal:** Present the spacetime topology case without getting bogged down in physics.
  **The Example:** Two global spacetime models (e.g., **Open Infinite Plane** vs. **Closed Torus**).
  **What it MUST Have:**
  1.  **Local Empirical Equivalence:** Inside our light cone, every measurement (gravity, light speed, mass) is identical in both models.
  2.  **Global Divergence:** Outside the horizon, the geometry connects differently (e.g., going far enough left brings you back to the start in the Torus model).
  3.  **Causal Severance:** The region where they differ is permanently behind a cosmological event horizon.
  **What it MUST Lack:**
  1.  **Future Verification:** No "maybe if we wait 10 billion years." It must be *never*.
  2.  **Quantum Baggage:** Do not mention wavefunctions, collapse, or Many Worlds. Keep it classical/relativistic to avoid pre-existing biases.
  **Misconception Check (Ontology = Aesthetics):**
  *   **When:** Minute 10, immediately after describing the two models.
  *   **The Move:** Students will say, "So it's just a modeling choice, like picking inches vs. centimeters."
  *   **The Counter:** Point out that while *observations* are identical, the *causal history* is not. In one model, a particle *could* have looped around (even if we can't see it); in the other, it couldn't.
  *   **Say:** "If ontology is just aesthetic, then 'cause' is also aesthetic. Do you want to defend that?" This forces them to see the distinction has weight beyond preference.

  ### **0:15 – 0:25 | Phase 3: The Crunch (Epistemic vs. Ontic)**
  **Goal:** Distinguish "We can't know" from "There is no fact."
  **Action:**
  1.  **Present Two Positions:**
      *   **Position A (Realist):** The universe *is* either Torus or Plane. We are permanently blind to which. Truth exists independently of verification.
      *   **Position B (Verificationist/Anti-Realist):** Because verification is structurally impossible, the question "Is it Torus or Plane?" has no truth value. The ontology is indeterminate.
  2.  **Head Off the Confusion:**
      *   **When:** Minute 20.
      *   **The Trap:** Students will conflate Position A with "We don't know yet" and Position B with "We can't know."
      *   **The Correction:** Draw a line on the board. Label left "Mind/Access" and right "World/Reality."
      *   **Say:** "Position A puts the barrier on the **Left** (our access). Position B puts the barrier on the **Right** (the world's structure). Position B says the universe literally does not settle the question."
  3.  **Discussion Prompt:** "If Position B is true, is physics describing the world, or just organizing our expectations?" (Let them wrestle for 3 mins).

  ### **0:25 – 0:28 | Phase 4: The Check Question**
  **Goal:** Verify they understand the distinction without jargon or Quine citations.
  **The Scenario:**
  "Imagine you are programming a simulation of this universe. You have to allocate memory for the region behind the horizon.
  *   **Option 1:** You allocate memory for 'Torus' because you believe it's true, even though the user can never see it.
  *   **Option 2:** You leave that memory 'null' because you believe there is no fact of the matter.
  **The Question:**
  "If a bug arises later that depends on that region's structure, who is at fault?
  (A) The programmer for guessing wrong (implies there was a fact).
  (B) The design for asking an invalid question (implies there was no fact).
  **Which option corresponds to the view that 'ontology is indeterminate'?"**
  *   **Correct Answer:** (B). If they choose (A), they are Realists (Epistemic limit). If they choose (B), they grasp the Ontological Indeterminacy claim.

  ### **0:28 – 0:30 | Phase 5: The Boundary (What to Refuse)**
  **Goal:** Close the session without falling into a physics lecture.
  **What to Flat-Out Refuse to Explain:**
  1.  **The Math of Horizons:** Do not derive the metric tensor or explain Rindler vs. Event horizons. If asked, say: "The physics guarantees the barrier; our job is to analyze the consequence of the barrier."
  2.  **Specific Topological Proofs:** Do not get into homotopy groups or covering spaces.
  3.  **The "Solution":** Refuse to tell them which position (A or B) is correct. Your job is to make the distinction sharp, not to solve underdetermination.
  **Closing Line:** "Next week, consider: If we accept Position B, does science lose its claim to truth, or does it gain freedom?"

  ---

  ### **Summary of Misconception Triggers**
  *   **"Just need more data":** Kill in **Phase 1** (define causal disconnect).
  *   **"Ontology is aesthetic":** Kill in **Phase 2** (highlight divergent causal histories).
  *   **"Can't know = No fact":** Kill in **Phase 3** (Left/Right barrier visualization).
