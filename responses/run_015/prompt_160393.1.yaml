prompt: |-
  I am writing a novel about a senior civil servant — deputy director of a fictional Office of National Outcomes in a middling, not especially wealthy republic — who has one legislative session to recommend a single national wellbeing statistic. Under the statute my draft calls the Wellbeing Mandate Act, that number will become the formal target of government: budget allocations, ministerial promotions, and the annual State of the Nation address will all turn on whether it rises. I want the argument in her committee room to be a real argument rather than decoration, so before I write it I need the specification: what would an index of a population's happiness have to get right to be an honest thing to govern by, as opposed to merely an honest thing to study?

  Please write that desiderata list, with the case or consideration behind each requirement — the concrete situation that shows why the requirement is there, not just the abstract principle. I want it to cover at least three fronts. On measurement: whose experience is in the denominator (newborns, people with advanced dementia, long-stay hospital patients, emigrants, the recently dead, the future); whether the number should be built from real-time reports of experience or from retrospective judgement about a life as a whole, and what is lost by each; whether one person's eight can be assumed to equal another person's eight, and what happens to the total if it cannot; how to treat a population that has quietly re-calibrated its expectations downwards after a long decline, and how to treat one that reports high satisfaction on the basis of forecasts about its own feelings that are systematically wrong; whether positive and negative experience may be netted against each other, and whether a bad hour can be compensated by good years; and how much is lost in translating a question about a good life across languages and moral traditions. On aggregation: average versus spread versus a sufficiency threshold — whether the index must be capable of saying that a country improved when the mean rose because the worst-off became somewhat less miserable, and whether it must be capable of saying the opposite. On the political use: legibility to citizens and to parliament versus resistance to gaming; whether the number should be stable enough to reward long policies; and whether making it a statutory target damages the very thing it measures, in the way a target tends to damage any measure it is attached to — in which case say whether that argues for a deliberately composite and somewhat opaque index, for several published numbers and no target at all, or for abandoning the project.

  Then do two more things. First, mark which of the requirements are genuine desiderata that any adequate index must meet and which are really the prejudices of one camp — the demand that the result be a single cardinal quantity, the demand that it track people's own reports, the demand that it be about felt experience rather than about meaning, capability, or the satisfaction of considered preferences — and identify any pair of requirements you think cannot be jointly satisfied, since the fact that the list is internally unsatisfiable is itself something my committee should be arguing about. Say which single requirement excludes the largest number of candidate indices. Second, briefly score the three broad families of candidate — self-report life satisfaction surveys, experience-sampling or affect-based measures, and objective-list or capability-based proxies — but keep the weight on the criteria rather than the scoring, since the criteria are what I need to stage the debate. Finally, tell me what the committee ought to recommend if the honest conclusion is that no candidate meets the non-negotiable requirements, and why; that decision is the ending of my novel, and I would like it to follow from the specification rather than from my own sympathies.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Advisor/Consultant to a novelist.
      *   **Task:** Create a specification (desiderata list) for a national wellbeing statistic mandated by law (Wellbeing Mandate Act).
      *   **Context:** A fictional "Office of National Outcomes" in a middling republic. A senior civil servant (Deputy Director) has one session to recommend *one* number.
      *   **Requirements:**
          1.  **Desiderata List:** Must cover Measurement, Aggregation, and Political Use. Each point needs a concrete situation/case, not just abstract principle.
          2.  **Critique/Analysis:** Distinguish genuine desiderata from camp prejudices. Identify incompatible requirements (trade-offs). Identify the single requirement that excludes the most candidates.
          3.  **Scoring:** Briefly score three families of candidates (Self-report, Experience-sampling, Objective-list) based on the criteria.
          4.  **Recommendation/Ending:** Advise on what the committee should recommend if no candidate meets non-negotiables. This determines the novel's ending.
      *   **Tone:** Serious, analytical, bureaucratic but philosophical, grounded in real-world policy dilemmas.

  2.  **Drafting the Desiderata List (The Core):**
      *   *Constraint:* Needs concrete situations, not just principles.
      *   *Category 1: Measurement.*
          *   *Denominator:* Who counts? *Case:* A dementia patient in a state home. Do they count as zero? As their past self?
          *   *Real-time vs. Retrospective:* *Case:* A parent sacrificing sleep for a child. Real-time says misery; retrospective says meaning.
          *   *Interpersonal Comparability:* *Case:* The stoic farmer vs. the expressive artist. Both say "7". Are they equal?
          *   *Adaptation/Calibration:* *Case:* A population under long-term oppression reports "satisfaction" because they expect nothing.
          *   *Forecasting Errors:* *Case:* Young people voting for policies that make them miserable later (hedonic forecasting).
          *   *Netting:* *Case:* Can a decade of joy cancel out a year of torture?
          *   *Translation:* *Case:* "Happiness" in Language A means "excitement," in Language B means "peace."
      *   *Category 2: Aggregation.*
          *   *Mean vs. Spread:* *Case:* Gentrification. Average wealth up, poorest displaced. Does the index rise?
          *   *Sufficiency:* *Case:* A floor below which no one should fall, even if it lowers the average.
      *   *Category 3: Political Use.*
          *   *Legibility:* *Case:* A voter needs to understand why the number dropped to vote the rascals out.
          *   *Gaming:* *Case:* A minister bribes survey respondents or changes the question wording.
          *   *Stability:* *Case:* Infrastructure takes 10 years. The index fluctuates yearly. Ministers get fired before results show.
          *   *Goodhart's Law:* *Case:* Teaching to the test. Optimizing for the number kills the spirit.

  3.  **Drafting the Critique/Analysis:**
      *   *Genuine vs. Prejudice:*
          *   Genuine: Resistance to gaming, Legibility (to some degree), Accounting for the vulnerable.
          *   Prejudice: The demand for a *single* cardinal number (this is political, not scientific). The demand for *felt experience* over *capability* (utilitarian vs. Aristotelian).
      *   *Incompatible Pair:* Stability (long-term policy) vs. Responsiveness (accountability). Or: Legibility (simplicity) vs. Resistance to Gaming (complexity). Let's go with *Legibility/Single Number* vs. *Resistance to Gaming/Truth*.
      *   *Most Exclusionary Requirement:* The demand for *Interpersonal Cardinal Comparability* (treating one person's 8 as equal to another's). This kills almost all objective lists and makes self-reports shaky.

  4.  **Drafting the Scoring:**
      *   *Self-Report Life Satisfaction:* Good on legibility, bad on adaptation (oppressed people say they're happy), bad on forecasting.
      *   *Experience-Sampling (Affect):* Good on reality of feeling, bad on meaning (childrearing looks bad), bad on logistics/cost.
      *   *Objective/Capability:* Good on rights/vulnerable, bad on paternalism (who decides what's good?), bad on legibility (complex index).

  5.  **Drafting the Recommendation/Ending:**
      *   *The Problem:* The prompt asks what happens if *no* candidate meets non-negotiables.
      *   *The Logic:* If the Act demands *one* number, and *one* number is inherently dishonest/manipulable, the civil servant has a duty to protect the integrity of the state.
      *   *The Solution:* Recommend *against* the single number, or recommend a "Dashboard" despite the Act, or resign.
      *   *Novelistic Angle:* The most poignant ending is usually the one where the bureaucrat chooses truth over compliance, risking their career. The recommendation should be to publish the *methodology* but refuse to nominate the *target*, or to nominate a number known to be flawed with a public warning (whistleblowing via bureaucracy).
      *   *Refinement:* The prompt asks what the committee ought to recommend *if* the honest conclusion is failure. The recommendation should be to *amend the Act* or *publish a Dashboard instead of a Target*. Let's go with the Dashboard/No-Target approach. It highlights the tension between democratic accountability (needs a number) and technocratic truth (needs nuance).

  6.  **Review and Refine:**
      *   *Check Constraints:* Did I cover all three fronts? Yes. Concrete situations? Yes. Marked prejudices? Yes. Identified incompatibility? Yes. Scored families? Yes. Recommendation for ending? Yes.
      *   *Tone Check:* Is it dry enough for a civil servant but deep enough for a novelist? Needs to sound like a briefing paper that has seen too much coffee and not enough sleep.
      *   *Specific Focus:* Ensure the "Denominator" point covers the specific examples requested (newborns, dead, etc.). Ensure the "Netting" point covers the "bad hour vs good years" question.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I explicitly identify the "Single Number" demand as a prejudice/political constraint rather than a scientific desideratum, as that's crucial for the novel's conflict.
      *   *Correction:* Ensure the "Incompatible Pair" is clearly stated as a source of dramatic tension.
      *   *Correction:* The ending advice needs to be actionable for a character. "Resign" is dramatic, "Recommend a Dashboard" is bureaucratic. Let's offer the bureaucratic rebellion: Recommend a Dashboard *in violation* of the spirit of the Act, forcing Parliament to choose.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**
  **TO:** Deputy Director, Office of National Outcomes
  **FROM:** Technical Specification Unit
  **SUBJECT:** Desiderata for the Statutory Wellbeing Statistic (Wellbeing Mandate Act)
  **DATE:** 14 October 202X

  The following specification outlines the necessary conditions for a national wellbeing statistic to function as a legitimate basis for governance rather than merely a sociological curiosity. Each requirement is paired with the concrete failure mode it is designed to prevent.

  ### I. Measurement Desiderata

  **1. The Denominator of Moral Worth**
  *   **Requirement:** The index must explicitly define the temporal and cognitive boundaries of the "citizen" whose wellbeing counts.
  *   **Concrete Case:** A patient in advanced dementia resides in a state-funded facility. Their current self-report is null; their past self would have rated this existence a zero; their family rates it a six (peace); the state budget counts them as a cost. If the index excludes them, we incentivize neglect. If it includes their *past* preferences, we govern the dead. If it includes their *current* affect, we may incentivize chemical sedation. The specification must decide if the unit of account is the *biological human*, the *narrative self*, or the *momentary consciousness*.

  **2. The Experience vs. Evaluation Gap**
  *   **Requirement:** The index must choose between measuring how life *feels* in the moment (affect) or how life is *judged* in reflection (satisfaction), acknowledging they diverge.
  *   **Concrete Case:** A parent sacrifices sleep, leisure, and income to raise a disabled child. Experience-sampling shows high stress and fatigue (negative affect). Retrospective evaluation shows profound meaning and pride (high satisfaction). An index based on affect will label this parenting a policy failure and incentivize state intervention to reduce parental burden (perhaps by removing the child). An index based on satisfaction may ignore the daily misery of the caregiver.

  **3. Interpersonal Comparability of Scale**
  *   **Requirement:** The index must assume a mechanism to equate a "7" reported by one citizen with a "7" reported by another, or admit it cannot.
  *   **Concrete Case:** Citizen A is a stoic farmer from a culture that values endurance; Citizen B is an expressive urbanite from a culture that values emotional articulation. Both report "5/10" on a life satisfaction scale. A's "5" represents quiet desperation; B's "5" represents mild disappointment. If the index treats these as equal, resources will not flow to A, whose actual deficit is greater. If the index attempts to correct for this (e.g., via biological markers), it becomes paternalistic and intrusive.

  **4. Adaptation and Calibrated Expectations**
  *   **Requirement:** The index must detect when a population has lowered its standards to match oppression or decline.
  *   **Concrete Case:** A region suffers twenty years of economic embargo. Unemployment is 40%. Yet, survey respondents report "stable" satisfaction levels because they have psychologically adapted to the new normal and fear reporting dissatisfaction to authorities. An index relying on self-reports will show "resilience" and justify maintaining the embargo. An honest index must register the *loss of capability* even if the *report of feeling* remains static.

  **5. Hedonic Forecasting Errors**
  *   **Requirement:** The index must account for the fact that citizens are often wrong about what will make them happy.
  *   **Concrete Case:** A referendum allows citizens to vote for a policy (e.g., deregulation of work hours) that they *believe* will increase their freedom and happiness. Data shows that historically, this policy leads to burnout and lower long-term wellbeing. If the index tracks *satisfaction with policy*, it rises. If it tracks *actual outcome*, it falls. Governing by the former validates democratic error; governing by the latter validates technocratic paternalism.

  **6. Netting and Commensurability**
  *   **Requirement:** The index must specify whether negative experiences can be mathematically cancelled by positive ones.
  *   **Concrete Case:** A infrastructure project creates ten years of economic boom (high aggregate happiness) but requires the forced eviction and torture of a minority group (extreme negative happiness for a few). If the index allows netting, the torture is "outweighed" by the boom. If the index has a "veto" for severe suffering (lexical priority), the project fails regardless of the economic gain.

  **7. Linguistic and Moral Translation**
  *   **Requirement:** The core question must retain equivalence across subcultures and languages.
  *   **Concrete Case:** In Language A, the word for "happiness" implies a transient state of excitement. In Language B, it implies a stable state of social harmony. A policy promoting nightlife boosts the score in Region A but depresses it in Region B. The government appears to be favoring Region A culturally, when it is merely favoring a linguistic definition.

  ### II. Aggregation Desiderata

  **8. Distribution Sensitivity (The Mean vs. The Spread)**
  *   **Requirement:** The index must be able to distinguish between a society where everyone is moderately happy and one where half are ecstatic and half are starving.
  *   **Concrete Case:** Gentrification occurs in the capital. Property owners see wealth and satisfaction double. Renters are displaced to slums and see satisfaction halve. The *average* national wellbeing rises. If the index is a simple mean, the Minister of Housing is promoted. If the index is sensitive to the bottom quartile, the Minister is fired. The specification must decide if "National Wellbeing" implies a floor.

  **9. The Sufficiency Threshold**
  *   **Requirement:** The index must determine if there is a level of misery below which aggregate gains are irrelevant.
  *   **Concrete Case:** A new drug reduces mild anxiety for 90% of the population (small gain each) but causes severe psychosis in 1% (catastrophic loss). A utilitarian sum recommends the drug. A sufficiency threshold (no one below level X) bans it. The Act implies a "National" target, which suggests aggregation, but justice suggests a floor.

  ### III. Political Use Desiderata

  **10. Legibility vs. Complexity**
  *   **Requirement:** The number must be simple enough for a voter to understand, but complex enough to resist reductionism.
  *   **Concrete Case:** During an election, the Opposition claims, "Wellbeing is down 2 points." If the index is a single number (e.g., 6.4), this is a devastating attack line. If the index is a dashboard of 12 weighted indicators, the attack is blunted, but the voter cannot hold the government to account. A number that cannot be weaponized cannot empower the electorate.

  **11. Stability for Policy Lags**
  *   **Requirement:** The index must remain stable enough to reward policies with long gestation periods.
  *   **Concrete Case:** A childhood nutrition program costs money now but improves adult wellbeing in 18 years. If the index is measured annually and tied to ministerial promotion, the Minister of Health will cut the nutrition program to fund immediate cash handouts that boost this year's score. The index must either discount the present or smooth data over decades, which reduces accountability.

  **12. Resistance to Gaming (Goodhart's Law)**
  *   **Requirement:** The index must not degrade when it becomes a target.
  *   **Concrete Case:** Once the "National Happiness Score" determines bonuses, Civil Servants begin to exclude homeless populations from survey sampling, or reclassify psychiatric hospitals as "wellness retreats" to change the denominator. If the index is transparent, it is gameable. If it is opaque (to prevent gaming), it is undemocratic.

  ***

  ### ANALYSIS OF THE SPECIFICATION

  **1. Genuine Desiderata vs. Camp Prejudices**
  *   **Genuine Desiderata:** *Resistance to Gaming* and *Distribution Sensitivity* are non-negotiable for a statistic intended to guide resource allocation. If the number can be faked (Gaming) or hides suffering (Distribution), it fails the basic mandate of governance.
  *   **Camp Prejudices:**
      *   *The Demand for a Single Cardinal Quantity:* This is a political prejudice, not a scientific necessity. It stems from a desire for "scoreboard politics" rather than accurate measurement. No complex reality reduces to one number without violent simplification.
      *   *The Demand for Felt Experience over Capability:* This is a Utilitarian prejudice. It assumes the "good" is what is felt, ignoring the Aristotelian view that the "good" is functioning well (capability), regardless of whether the subject feels happy (e.g., the satisfied slave vs. the frustrated revolutionary).

  **2. The Incompatible Pair**
  *   **Legibility (Simplicity) vs. Resistance to Gaming (Complexity).**
      *   To be legible to a voter, the index must be a single, transparent number derived from simple questions.
      *   To resist gaming, the index must be a composite of hard-to-manipulate administrative data (health records, income logs, crime stats) with opaque weighting.
      *   *Conflict:* You cannot have a number that is both easily understood by the public *and* immune to manipulation by ministers. If the public understands how it is built, ministers will learn to break it.

  **3. The Most Exclusionary Requirement**
  *   **Interpersonal Comparability of Scale (Measurement #3).**
      *   This requirement excludes the largest number of candidate indices. Most self-report scales fail this (the stoic vs. the expressive). Most objective lists fail this (who decides the weight of health vs. income?). Only a biological metric (e.g., cortisol levels) might pass, but it fails Legibility and Political Acceptability. This requirement effectively renders the entire project scientifically impossible.

  ***

  ### SCORING CANDIDATE FAMILIES

  **1. Self-Report Life Satisfaction Surveys (e.g., "On a scale of 0-10...")**
  *   **Strengths:** High Legibility; respects individual sovereignty (they say what they feel).
  *   **Weaknesses:** Fails *Adaptation* (oppressed people report high satisfaction); Fails *Interpersonal Comparability*; Highly susceptible to *Gaming* (question wording changes).
  *   **Verdict:** Politically robust, scientifically hollow.

  **2. Experience-Sampling / Affect-Based Measures (e.g., "How happy are you right now?")**
  *   **Strengths:** Captures *Real-time Experience*; avoids memory bias.
  *   **Weaknesses:** Fails *Experience vs. Evaluation* (makes parenting/struggle look like misery); Logistically nightmarish (requires constant polling); Fails *Stability* (mood fluctuates with weather).
  *   **Verdict:** Scientifically interesting, governably useless.

  **3. Objective-List / Capability Proxies (e.g., HDI, Access to Services)**
  *   **Strengths:** Resists *Adaptation* (a starving person is counted as deprived even if happy); Good on *Distribution* (can track floors).
  *   **Weaknesses:** Fails *Legibility* (complex index); Fails *Sovereignty* (paternalistic); Fails *Translation* (different cultures value different capabilities).
  *   **Verdict:** Ethically robust, politically vulnerable.

  ***

  ### RECOMMENDATION FOR THE COMMITTEE (THE NOVEL'S ENDING)

  If the honest conclusion is that no candidate meets the non-negotiable requirements (specifically *Interpersonal Comparability* and *Resistance to Gaming* while maintaining *Legibility*), the Committee cannot recommend a number without violating its duty to the truth.

  **The Recommendation:**
  The Committee should recommend **publishing a Dashboard of Indicators with no Aggregate Target.**

  **The Rationale:**
  1.  **Compliance with Spirit, Not Letter:** The Wellbeing Mandate Act demands a target to focus attention. However, a false target focuses attention on the *wrong thing*. By publishing a Dashboard (e.g., "Mental Health," "Social Connection," "Material Security"), the Office provides the *information* required for governance without providing the *weapon* required for gaming.
  2.  **Forcing Political Responsibility:** A single number allows politicians to outsource moral judgment to an algorithm ("The Number went down, so we failed"). A Dashboard forces Parliament to argue: "Mental health is down, but security is up. Which do we value?" This restores the political debate that the Act attempted to technocratically bypass.
  3.  **The "Poison Pill":** The Deputy Director should attach a statutory warning to the Dashboard: *"Aggregation of these metrics into a single scalar value is statistically invalid and ethically hazardous. Any such aggregation performed by this Office or others is not endorsed."*

  **Why this ends the novel:**
  This is a bureaucratic rebellion. It saves the Office's integrity but likely doomed the Deputy Director's career. It admits that the "Wellbeing Mandate Act" was a fantasy of political control—a desire to reduce the messy human condition to a KPI. By refusing to provide the KPI, the protagonist forces the Republic to confront the complexity it tried to legislate away. The conflict shifts from "How do we raise the number?" to "Why were we trying to reduce our lives to a number in the first place?"

  **Alternative (Tragic) Ending:**
  If the Act *legally compels* a single number (not just a target, but a specific statistic), the Committee must recommend the **Self-Report Life Satisfaction** measure, *knowing it is flawed*.
  *   **Reasoning:** It is the only measure that respects the citizen's own voice (Sovereignty), which is the only defensible position in a democracy, even if the data is noisy.
  *   **The Cost:** The Deputy Director must include a "Technical Note" that will be ignored, detailing how the number can be gamed. The novel ends with the number being announced, the room applauding, and the Deputy Director knowing exactly how the Minister will manipulate it in six months. This highlights the tragedy of expertise in a political world: knowing the truth, but having to hand over the knife.

  **Recommendation for maximum thematic resonance:** Go with the **Dashboard/No-Target** recommendation. It allows the protagonist to choose *truth* over *compliance*, turning the specification document into the climax of the story. The argument in the committee room is not about which number to pick, but whether they have the courage to say *none of them work*.
