  What the paragraph gets right
  The paragraph correctly identifies the shared core of contextualism and pragmatic encroachment: both reject intellectualism, the view that knowledge supervenes solely on truth, belief, and evidence. The description of contextualism aligns with standard accounts like DeRose's, where skeptical salience shifts semantic standards. Similarly, defining pragmatic encroachment as making knowledge sensitive to practical stakes captures the essence of views like Fantl and McGrath's. The "flickering" objection described is indeed the standard instability criticism levied against anti-intellectualist views. Recognizing that both views make knowledge attribution sensitive to non-evidential factors is accurate. Finally, distinguishing the conversational nature of contextualism from the practical nature of encroachment is a very helpful starting point. However, the synthesis of these views into a single target for objection oversimplifies the metaphysical differences between semantic context-sensitivity and stake-sensitive justification. The initial mapping of the landscape is solid, even if the subsequent critique blurs important distinctions.

  Where it goes wrong
  Contextualists would wince at "knowledge becomes sensitive to facts outside the subject's evidence." They argue the *word* "knows" changes meaning relative to the attributor, not necessarily the mental state itself. The claim that pragmatic encroachers think you "need more evidence" is imprecise; they argue the *justification threshold* rises given fixed evidence, not that evidence quantity changes. Regarding 'need more evidence,' encroachers say the *same* evidence suffices in low stakes but fails in high stakes. The paragraph implies evidence quantity changes, which is quite wrong. Crucially, the paragraph conflates whose situation matters. Contextualism relies on the *attributor's* context (the speaker), while pragmatic encroachment relies on the *subject's* stakes (the believer). You suspected the whose-situation point; you were absolutely right. The paragraph treats attributor context and subject stakes as interchangeable variables. The flickering objection hits differently: for encroachment, my knowledge changes when my bank balance changes; for contextualism, your knowledge changes when I mention skeptics. Treating these as the "same objection" ignores this locus difference.
  Furthermore, the sentence "That means both views are exposed to the same objection" glosses over distinct vulnerabilities. Contextualism faces charges of implausible semantic variability; encroachment faces charges of violating the purity of epistemology. The line about knowledge being a "status we hand out" is a redescription of contextualism, not an argument against it; it begs the question by assuming knowledge should be a natural state rather than a normative status. If knowledge is a status, contextualism might be correct. Finally, the inference to plain invariantism ignores skeptical invariantism, which also denies context-sensitivity but claims we rarely know anything. The paragraph assumes traditional invariantism is the only alternative, which is a false dichotomy. The "whose-situation" conflation is the most damaging error, as it misrepresents the mechanism of context-sensitivity entirely. It actually treats the attributor's conversational goals and the subject's practical risks as interchangeable inputs, which they are not.

  Does the conclusion follow
  No, the conclusion does not follow. Showing contextualism and encroachment have costs doesn't vindicate traditional invariantism. Skeptical invariantism also fits "evidence alone" but claims we know almost nothing. The argument assumes traditional invariantism wins by default if anti-intellectualism fails, ignoring skepticism. Moving from "these views have objections" to "plain invariantism is true" is a non-sequitur. Furthermore, claiming knowledge is a "status we hand out" arguably supports contextualism, making the inference circular. Skepticism remains a live option throughout. The inference relies on a false dichotomy.

