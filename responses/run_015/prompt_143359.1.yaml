      *   **Ryle on Biology:** Clarify that Ryle isn't hung up on meat vs. silicon. He's hung up on *categories*.
      *   **Ryle on Category Mistakes in AI:** The mistake isn't putting a mind in a machine; it's treating statistical prediction as *understanding*. It's treating the *output* as evidence of an internal state rather than a disposition to behave.
