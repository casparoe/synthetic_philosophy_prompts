answer: |-
  You're absolutely onto something with your 'moral infrastructure' idea—it's not stupid in the slightest. In fact, you've likely put your finger on exactly why the debate in your class has ground to a halt. It sounds to me like you've moved past the surface-level arguing and identified the structural flaw in the discussion.

  To answer your core question: the debate has stalled because it is suffering from a category error. Your classmates are talking past one another because they are operating on different levels of analysis. One group is focused on **individual psychology** (micro-level), and the other is focused on **societal systems** (macro-level).

  Here is a breakdown of why this is happening, whether it's merely verbal, and what might actually move the conversation forward.

  ### 1. Is it a verbal disagreement or different questions?
  It is both, but primarily the latter.

  When the pro-religion group cites studies about charity and lying, they are measuring **individual moral behaviour** often driven by **in-group cohesion**. Religious people do tend to give more to charity, but sociological data often shows this giving is disproportionately directed towards their own religious community or causes aligned with their specific doctrine. Furthermore, the 'lying less in experiments' data often hinges on 'priming'—the mere reminder of God or moral codes increases honesty in the moment. This is about *individual motivation* and *immediate behaviour*.

  When the pro-secular group points to Denmark and Sweden, they are measuring **social trust** and **institutional reliability**. This is macro-level. In these societies, you don't need to trust that your neighbour is a 'good soul' because you trust that the system will catch you if you fall. If you get ill, the state cares for you; if you are cheated, the courts intervene. This allows for high cooperation without requiring shared supernatural beliefs.

  So, they aren't just defining 'moral' differently (though they are doing that too); they are answering two different questions:
  *   **Group A:** "Does belief in God make an *individual* more likely to perform prosocial acts?"
  *   **Group B:** "Can a *society* function cohesively without a shared belief in God?"

  ### 2. The 'Moral Infrastructure' Insight
  Your idea about moral infrastructure is essentially what sociologists call **social capital**.
  *   **Religious societies** often rely on what is known as *bonding social capital*. Trust is 'thick' but narrow. It is built on shared rituals, shared identity, and the 'watcher' effect you mentioned (omnipresent surveillance by the divine).
  *   **Secular societies** rely on *bridging social capital* and institutional trust. The 'infrastructure' is legal transparency, welfare states, and secular humanist norms. The 'watcher' isn't God; it's the law, the tax office, and public accountability.

  The stalemate exists because Group A sees the lack of religious belief as a loss of *motivation*, whilst Group B sees the secular state as a replacement *mechanism*.

  ### 3. What would move the debate forward?
  Since this isn't just about bedrock intuitions, a new study alone won't fix it unless the framework changes. Here is what would actually shift the discussion:

  **A. Conceptual Clarity (The Distinction)**
  You need to introduce a distinction between **moral motivation** and **moral outcomes**.
  *   If morality is about *virtue* (doing good because it is right), the religious argument struggles if the motivation is fear of hell or desire for heaven (external reward).
  *   If morality is about *consequences* (everyone cooperates and suffers less), the secular argument wins on the macro scale (Scandinavia), but struggles to explain how to maintain that without the inherited cultural norms from centuries of religious dominance.

  **B. The 'Cultural Religion' Nuance**
  A crucial point often missed is that secular societies like Sweden aren't truly 'neutral'. They often operate on **moral inherited capital**. Their human rights frameworks and sense of duty are historically rooted in Lutheran Christianity, even if the theology has faded. A truly new study would need to look at societies attempting to build this infrastructure *without* that historical religious backbone, to see if the 'infrastructure' holds up on its own.

  **C. Shift the Question**
  Instead of asking "Which makes people better?", ask: **"Under what conditions does cooperation break down?"**
  *   In religious communities, cooperation might break down when dealing with outsiders (heretics/non-believers).
  *   In secular communities, cooperation might break down when institutions lose legitimacy (corruption/political polarisation).

  ### Conclusion
  You aren't stuck because the answer is unknowable; you're stuck because the question is too blunt. If I were you, I'd propose to your class that you stop trying to prove one side 'wins'. Instead, argue that religion and secularism are **different technologies for solving the same problem**: how to get strangers to cooperate.

  Religion solves it through shared identity and supernatural sanction; secularism solves it through shared institutions and mutual self-interest. Whether one is 'better' depends entirely on whether you value the *depth* of community (religion) or the *breadth* of inclusion (secularism).

  That distinction should give you plenty to write about. And do try to fix that trackpad—typing on a dodgy laptop is proper frustrating.
