      **INTERNAL MEMORANDUM: ROLE PROFILE & ANNUAL PERFORMANCE REVIEW**
      **REF:** HR-SOV-2024-Q4 | **CLASSIFICATION:** RESTRICTED (EYES ONLY: PRIVATE SECRETARIAT)

      **JOB TITLE:** Sovereign Officer (Grade S-0)
      **JOB FAMILY:** Ceremonial Executive (Hereditary Stream)
      **REPORTING LINE:** Prime Minister (Functional); Private Secretary (Line Management)

      **1. KEY RESPONSIBILITIES & KEY PERFORMANCE INDICATORS (KPIs)**
      The incumbent is responsible for the custodianship of Reserve Powers including Assent, Appointment, and Dissolution. Performance is measured exclusively via negative metrics.

