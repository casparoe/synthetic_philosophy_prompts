      *   **KPI 02: Public Visibility.**
          *   **Target:** High Visibility / Zero Substance.
          *   **Measurement:** Media mentions positive sentiment > 80%; Policy attribution = 0%.

      **2. COMPETENCY RATING SCALE: NEUTRALITY & COUNSEL**
