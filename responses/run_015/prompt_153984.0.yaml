answer: |-
  ### Epistemic Risk Ranking: Vulnerability to Spurious Institutional Attribution
  *(Scale: 1 = Minimally Vulnerable, 10 = Maximally Vulnerable)*

  **1. Iconographic Decoding: 9.5**
  Treating motifs as "transparent statements" ignores polysemy, irony, and individual artistic agency. The leap from visual representation to codified *collective* dogma is the least constrained by material necessity, inviting high false-positive rates where decorative or idiosyncratic marks are read as institutional doctrine.

  **2. Direct Ethnographic Analogy: 8.5**
  Projecting documented beliefs from culturally distant groups onto material similars assumes cultural stasis or universality. While heuristic, this strategy imports external content into the assemblage; when cultural distance is high, the risk of attributing a specific belief system that never existed locally is extreme.

  **3. Absential Reasoning: 7.5**
  Inferring prohibition from omission risks conflating taphonomic loss with cultural selection. However, because it relies on internal assemblage consistency (e.g., ecological availability vs. archaeological absence) rather than external projection, it is more empirically grounded than analogy, provided preservation biases are rigorously modeled.

  **4. Functionalist Spatial Analysis: 6.0**
  Inferring norms from layout confounds social rules with environmental constraints (e.g., privacy vs. heat retention). While vulnerable to pragmatic false positives, spatial data is physically present and measurable, offering more internal checks than interpretive leaps regarding symbol or absence.

  **5. Stratigraphic Correlation: 3.5**
  Linking discontinuities to *independently documented* events provides an external anchor that drastically reduces speculation. The risk lies not in the correlation but in attributing the *cause* of the event to belief rather than ecology or politics, but the evidentiary baseline is far more secure than the other four.

  ***

  ### Comparative Analysis: The Tension Between Analogy (1) and Absence (5)

  Your intuition holds: in contexts of high cultural distance and textual silence, **Absential Reasoning (5) is often more defensible than Direct Ethnographic Analogy (1)**, despite the latter's status as a "baseline" method.

  **The Epistemic Asymmetry**
  Direct Ethnographic Analogy (1) commits a *category error* when cultural distance is significant. It assumes that material similarity implies cognitive or institutional similarity (the fallacy of uniformitarianism applied to culture). The false-positive risk here is **importative**: you are inserting a specific belief content (e.g., "this tool implies a male initiation rite") that is entirely external to the dataset. If the analogy fails, the attribution is 100% spurious.

  Absential Reasoning (5), conversely, commits a *process error* risk (taphonomy). However, this risk is **internal** to the dataset. Systematic omission can be tested against preservation potentials, soil chemistry, and ecological baselines. If a species is ecologically viable and preserves well in neighboring contexts but is absent here, the "prohibition" hypothesis survives a rigorous null test.

  **Why (5) Surpasses (1) in Remote Contexts**
  Analogy relies on *homology* (shared heritage) or strong *analogy* (similar adaptive problems). In culturally remote scenarios, homology is absent, and adaptive similarity does not guarantee symbolic similarity. Absential reasoning relies on *expectation*. It argues from the violation of a material expectation (presence) rather than the projection of a cultural narrative.

  Therefore, while (5) carries a high burden of proof regarding preservation, (1) carries an often-unmeetable burden of proof regarding cultural continuity. For your seminar, you can argue that **Absential Reasoning is epistemically superior in high-distance contexts** because it interrogates the integrity of the local record, whereas Analogy often overlays the local record with external assumptions.
