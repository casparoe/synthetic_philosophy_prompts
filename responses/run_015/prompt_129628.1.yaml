answer: |-
  Your position is critically exposed because it treats visibility as an inherent good without accounting for the weaponization of legibility, and operationally self-defeating because it shifts selection bias from acquisition to processing where it becomes less transparent.

  ### 1. The Legibility Trap (Fatal Defeater)
  **The Mechanism:** Archives do not merely preserve history; they produce administrative reality. To be archived is to be categorized, indexed, and made retrievable by an institution that holds legal custody. This legibility is the prerequisite for state or corporate intervention. When you document a marginalized group (e.g., undocumented residents, informal economy workers, housing squatters), you transform their informal existence into formal data. That data can be subpoenaed, requested via FOIA, leaked, or reinterpreted by a future administration with hostile intent. The "safety" of unrecorded populations relies on the friction required to find them; you are removing that friction.

  **Concede or Shrug:** You must **concede** this. It strikes directly at the moral core of your principle. If the act of "rescue" creates the vector for harm, the ethical calculus flips from positive to negative. This is not a resource issue; it is a harm issue.

  **Empirical Settlement:** We are not near settling this empirically because archives rarely track downstream harm. To settle it, you would need a longitudinal study linking specific accessioned collections to subsequent adverse actions against the subjects (e.g., eviction notices following the cataloging of tenant union records, or immigration enforcement following oral histories). However, proxy data exists: look at the frequency of law enforcement or legal subpoenas served on municipal archives regarding sensitive social service records. If the mechanism of retrieval exists, the risk is non-zero, and for vulnerable populations, non-zero risk is often a disqualifier.

  ### 2. The Backlog Bias (Fatal Defeater)
  **The Mechanism:** This is your colleague's point, mechanized. Acquisition is low-labor; processing (cataloging, boxing, describing) is high-labor. If you maximize acquisition without maximizing processing resources (which you are excluding from the argument, but the *labor* remains constant), you create a growing backlog. Researchers cannot use what they cannot find. Therefore, the *effective* archive is not what you have kept, but what you have processed. The selection criterion shifts from "what is historically significant?" to "what got processed first?" Processing priority is almost always determined by the archivist's implicit bias, donor pressure, or perceived research demand—which usually defaults back to traditional power structures. You have not abolished gatekeeping; you have moved it from the accessioning log to the processing queue, where it is less documented and harder to audit.

  **Concede or Shrug:** You must **concede** this. It renders the practical outcome of your policy identical to the traditional model you seek to replace, but with higher storage costs and greater liability.

  **Empirical Settlement:** This is easily testable within your own institution. Compare the "time-to-access" (date of donation to date of first public finding aid) for marginalized collections versus traditional institutional records (e.g., city council minutes vs. community group papers). If the marginalized collections sit unprocessed for significantly longer periods, your "plenitude" is functionally exclusionary. Most archives show a stark disparity here, confirming the defeater.

  ### 3. The Unfalsifiability Shield (Awkward Defeater)
  **The Mechanism:** Your worry is that because the subject is "absence," you can never prove you failed. If a group complains they are missing, you acquire more; if they complain you captured too much, you say you are preserving context. This makes the principle immune to correction. A theory that cannot be proven wrong risks becoming dogma rather than policy. However, this is inherent to any ethics based on remedying historical silence; you are correct that you cannot produce a counterexample to "there is more missing."

  **Concede or Shrug:** You can **shrug** this off, but only if you modify the principle. It is not a fatal defect of the *goal*, but it is a defect of the *metric*. You cannot measure success by "how much we have," only by "who trusts us." If the metric remains volume, you are right to worry it is insulated. If the metric shifts to community trust and usage, it becomes falsifiable (i.e., communities stop donating).

  **Empirical Settlement:** Track donor retention and community engagement rather than linear feet acquired. If communities stop sending material because they feel exposed or ignored (see Defeater 1 and 2), the principle is failing despite the "plenitude."

  ### The Careful Version
  Your core insight—that archival silence reinforces power—is correct, but "maximal capture" is the wrong tool because it assumes the archive is a neutral container rather than an active agent. The careful version is **Consensual Stewardship**.

  1.  **Shift from Capture to Offer:** Instead of "taking everything," offer preservation capacity and let communities decide what remains opaque. Respect the "right to opacity" as a valid archival choice.
  2.  **Process-Based Appraisal:** Tie acquisition limits to processing capacity. Do not accept what you cannot make discoverable within a defined timeframe. This prevents the Backlog Bias.
  3.  **Restricted Legibility:** Implement tiered access by default for vulnerable groups. Assume records are sensitive until proven otherwise, rather than open until proven sensitive. This mitigates the Legibility Trap.

  This retains the ethical drive to correct silence without assuming that visibility is always synonymous with justice.
