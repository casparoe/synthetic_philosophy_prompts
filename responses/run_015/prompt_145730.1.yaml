answer: |-
  **Setup and materials**
  Divide the 17 students into four groups (three groups of 4, one of 5). Arrange seating so group members face each other but cannot see other groups' materials. Prepare four sets of envelopes. Each envelope contains a role card, a personal scorecard, and round-specific tokens. You need a whiteboard to track group points and a stopwatch. For Round 1, prepare "Fragment Cards" (instructions linking one student's action to another's). For Round 2, prepare "Contribution Tokens" (index cards marked '1' or '0'). For Round 3, prepare "Vote Cards" (A/B) and "Task Cards." The payoff is points toward a coffee voucher; the group with the highest aggregate score wins the voucher, but individual bonuses exist. Do not mention "joint action" or "intention" during instructions. Hand out envelopes face down. Tell them: "Your goal is to maximize points. Follow the card instructions exactly. Do not show your card to anyone."

  **The rounds**
  **Round 1: The Blind Chain (15 mins).** Each student gets a card with a single rule fragment (e.g., "If Person 2 holds up Red, hold up Blue"). They cannot speak. You (the instructor) act as the environment, giving local feedback ("Correct/Incorrect") only to the individual based on the group's aggregate state. The goal is to reach a specific configuration within 5 minutes. If the group succeeds, everyone gets 10 points. *Phenomenology:* No one knows the full plan, yet coordination emerges. If one fails, others feel frustration directed at *them*, not just the outcome. They succeed via local cues, mirroring the toddler coordination your colleague mentioned.

  **Round 2: The Public Pot (15 mins).** Each student receives 5 tokens. They may contribute any number to a central pot. The pot is multiplied by 1.5 and distributed equally. One envelope contains a secret "Mercenary" card: "Keep all tokens. If the group succeeds (reaches threshold), you get a 20-point bonus." The threshold is set so the group succeeds even with one defector. *Phenomenology:* The group succeeds and celebrates. The Mercenary feels no guilt but claims the win. Others say "We won," unaware of the defection. This tests whether shared commitment or mere success defines the action.

  **Round 3: The Majority Mandate (15 mins).** The group must choose between Task X (easy) and Task Y (hard). They vote. The minority must help execute the majority's choice. One student is assigned Task Y against their vote. They must physically perform part of the task. *Phenomenology:* The group acts as one unit externally. The dissenting member feels alienated from the "We," despite being essential to the execution. This isolates the feeling of coercion versus participation in group agency.

  **Minute-by-minute**
  0-5: Intro & Groups. Distribute envelopes. Emphasize silence on card contents.
  5-20: Round 1 (Blind Chain). Monitor feedback. Record success/failure.
  20-35: Round 2 (Public Pot). Collect tokens. Reveal scores quietly.
  35-50: Round 3 (Majority Mandate). Facilitate vote. Ensure minority participation.
  50-55: Reset. Collect cards.
  55-80: Debrief. Open floor. Connect to theory.
  *Instructor Role:* During play, be a neutral arbiter. Do not explain *why* a move failed, only *that* it failed. Take notes on who says "we" vs "I" during the rounds. If a group stalls in Round 1, give a generic hint ("Check your neighbors"). In Round 2, ensure the Mercenary knows the threshold is safe. In Round 3, enforce the minority's participation strictly; if they refuse, pause the round.

  **Debrief**
  Start with Round 3. Ask the dissenting student: "Did *you* do this, or did *we* do this?" Expect discomfort. This maps to the tension between individual agency and group agency (Pettit). Move to Round 2. Reveal the Mercenary. Ask the group: "Did the Mercenary participate in the joint action?" If they say yes, press: "But they didn't care about the goal." This targets Bratman (shared intention) vs. Gilbert (joint commitment). Finally, Round 1. Ask: "Who had the plan?" No one did. "So where was the intention?" This targets the locus of agency. Do not define terms yet. Ask: "What makes a 'we'?" Let them argue. Only after they struggle should you introduce Bratman's interlocking intentions vs. Gilbert's normative commitment. Your hunch (structure) will find support in Round 3, but Bratmanians will argue Round 2 proves psychological states matter. Let the conflict stand. Ask specifically: "In Round 1, could you rebuke someone? Why?" This elicits the normative element without naming it. If they say "Yes," ask what grounded that right. If they say "No," ask why they felt annoyed. Use their answers to draw the distinction between causal contribution and normative participation on the board before writing the theorists' names.

  **What will go wrong**
  Students may deduce secret roles in Round 2. If accused, instruct them: "You cannot verify others' cards, only outcomes." If a group finishes Round 1 early, have them hold the configuration until time expires to sustain the pressure. If a student refuses the minority role in Round 3, pause the class. Ask the group: "What happens now?" This failure *is* the data point—the normativity breaks. If the Mercenary sabotages too hard and the group fails, adjust the threshold mid-game silently to ensure success, or use it as a counterfactual in debrief ("What if they had failed?"). Ensure the coffee voucher stakes are low enough not to cause genuine hostility but high enough to matter. If a group collapses into laughter, remind them the voucher is real. If someone dominates the debrief, ask the quietest student from Round 3 to speak first.

  **What the activity can't show**
  This simulation captures coordination and obligation, but not the *normativity* of joint commitment in its full moral weight. Gilbert argues joint commitment creates obligations enforceable by rebuke; a coffee voucher cannot replicate the feeling of moral betrayal, only strategic annoyance. Similarly, the activity is ephemeral. Real joint action often involves long-term identity formation (e.g., a marriage, a political movement) which 15 minutes cannot simulate. You must lecture on why the "ought" in joint action isn't just prudential. The activity shows the *structure* of rebuke, but not the *force* of the obligation. You need to explain that for Gilbert, the obligation is sui generis, not derived from self-interest, which points cannot capture.

  **Settled vs contested**
  **Consensus:** Everyone agrees joint action isn't just parallel individual action (the table-carrying intuition). All agree some interdependence is required.
  **Contested:** The locus of the "we." Bratmanians (majority in US analytic philosophy) argue the "we" is reducible to complex interlocking individual intentions (I intend that we J because you intend that we J). Gilbertians and List/Pettit proponents argue the "we" is irreducible normative structure. Your design rigs Round 3 toward List/Pettit (group agency survives individual dissent) and Round 2 toward Gilbert (commitment matters more than private intent). However, a Bratmanian could argue the Mercenary *wasn't* part of the joint action, merely a cause of its success. Be prepared for students to argue the Mercenary was just a causal condition, not an agent. Your hunch is a live minority position (ontological collectivism); treat it as a hypothesis, not the key.
