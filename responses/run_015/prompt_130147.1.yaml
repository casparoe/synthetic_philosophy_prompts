answer: |-
  Your roommate is consistently applying a metaphysical pluralism that treats social status as constitutively grounded in collective acceptance while treating normative force as fundamentally brute, meaning she will affirm the artifact's value is real only while the community sustains it but insist the wrongness of destroying it remains ungrounded regardless.

  She is running three distinct grounding rules that explain her track record without contradiction. First, **Physical Essentialism** handles the table and water cases: natural properties are grounded in microphysical structure or metaphysical essence, not language or perception. Second, **Social Constitutivism** handles the president and artifact value cases: institutional facts exist only because of collective intentionality and are irreducible to the physical substrate (brain states or code). Third, **Moral Non-Naturalism** handles the cruelty and artifact norm cases: normative truths are fundamental features of reality that do not derive from natural or social facts.

  For the virtual artifact, these rules predict exactly what she told you. The artifact's *value* falls under Social Constitutivism, so it is grounded entirely in the players' collective practices; if the code says "scrap" but the players say "honor," the social fact wins, just like the president exists despite being made of biological matter. However, the *normative claim* ('it is wrong to destroy') falls under Moral Non-Naturalism, so she must maintain that this wrongness is not generated by the players' agreement but is a brute fact that attaches to the situation, similar to how cruelty is wrong regardless of societal approval.

  The consistency holds until you test the dependency between her second and third rules. The splitting case is the **Extinct Community Scenario**: suppose the players all leave and the collective acceptance vanishes, leaving the code and the artifact intact. If she says the wrongness disappears, she admits the norm was actually grounded in the social practice all along, contradicting her Moral Non-Naturalism. If she says the wrongness persists despite no one being there to value it, she commits to a radical Platonism where normative facts float free of any agents, which clashes with the intuition behind her Social Constitutivism.
