answer: |-
  This is a sophisticated problem in social ontology and applied ethics. You are effectively asking for the boundaries of **moral relativism** versus **universalism** within the sphere of *conventional* norms. Your intuitions are remarkably consistent, suggesting they are not ad hoc but derived from a coherent, albeit implicit, ethical framework.

  To resolve the tension and address the test case, I propose a unifying principle I will call **"The Principle of Reciprocal Fairness Constrained by Justice."**

  This principle posits that temporary visitors incur a moral obligation to adhere to local conventions when those conventions function as **coordination mechanisms** or **welfare safeguards**, *unless* adhering to them would make the visitor **complicit in a violation of fundamental rights or public integrity.**

  Here is how this principle accommodates your verdicts, resolves your tension, and predicts the outcome of the bribery case.

  ### 1. Applying the Principle to Your Verdicts

  Your intuitions divide neatly into three categories under this framework:

  **A. Coordination and Welfare (Obligation Holds)**
  *   **London Queuing:** This is a pure coordination game. The benefit (orderly boarding) collapses if even a minority defects. A visitor benefits from the queue's existence; therefore, fairness (the principle of fair play) obligates them to sustain it.
  *   **NYC Tipping:** This is a welfare safeguard within a specific economic contract. By entering the diner, the visitor enters a local economic ecosystem where the worker's livelihood is structurally dependent on the gratuity. Refusing to tip is not merely breaking etiquette; it is inflicting direct economic harm on an identifiable individual who has rendered a service under those expectations.
  *   **Tokyo Tipping:** Here, the "welfare" is social dignity. The local norm protects the worker from the implication that their service is not already compensated. Violating this causes social harm (embarrassment). The obligation is to *avoid* harm, which aligns with the NYC verdict (protect the worker's interest, defined locally).

  **B. Symbolic Respect and Civic Integrity (Obligation Holds)**
  *   **Mosque Shoes:** This falls under respect for deeply held communal values. The "harm" of wearing shoes is not physical but symbolic—it treats a sacred space as profane. The obligation arises from a duty to respect the autonomy of the community to define their own sacred practices.
  *   **Berlin Jaywalking (with children):** Your intuition here is subtle. Alone, it is a victimless violation of a coordination rule (traffic flow). *With children*, it becomes an act of civic corruption. You are modeling that rules are optional for outsiders. This undermines the "normative assimilation" required for the society to function. The obligation is to uphold the integrity of the local rule of law for the sake of the observers.

  **C. The Justice Constraint (Obligation Dissolves)**
  *   **Gender-Segregated Queuing:** This violates the principle of equal moral worth. While it is a "local convention," it fails the Justice Constraint. Adhering to it would make the visitor complicit in discrimination. Here, "Moral Tourism" (refusal to assimilate) is not only permitted but required.

  ### 2. Resolving the Tension: Tipping vs. Segregation

  You asked whether you must drop either the assimilation obligation (tipping) or the conscientious-objection exemption (segregation). You do not need to drop either. The distinction lies in the **direction of the moral impact.**

  *   **Tipping (NYC):** The system (sub-minimum wage) may be unjust, but the *act* of tipping mitigates harm to a vulnerable individual within that system. Refusing to tip punishes the worker for the employer's (or state's) injustice. Your obligation is to the *person*, not the *system*.
  *   **Segregation:** The system *is* the injustice, and the *act* of complying enforces that injustice upon others. There is no vulnerable individual you are protecting by queuing separately; rather, you are validating the exclusion of a group.

  **The Coherent Principle:** You must assimilate to local conventions that **manage local welfare and coordination**, even if the broader system is imperfect. You must *not* assimilate to local conventions that **constitute active rights violations or corruption**, even if refusal causes offense.

  ### 3. The Test Case: Mandatory "Gift-Giving" (Bribery)

  How does the principle predict for the case of mandatory gifts to public officials?

  **Analysis:**
  1.  **Is it Coordination/Welfare?** Superficially, yes. It "greases the wheels" of bureaucracy. Refusing might cause ostracism or delay.
  2.  **Is it Complicity in Injustice?** Yes. Unlike tipping (which compensates an underpaid worker), bribery undermines public trust, disadvantages those who cannot pay, and corrupts the rule of law. It is a systemic harm, not merely a local economic workaround.
  3.  **The Justice Constraint:** Bribery violates the universal principle of impartiality in public administration.

  **Verdict:**
  The principle predicts that the visitor **ought not to participate.**

  This falls under the **Conscientious-Objection Exemption**. While refusing may result in personal disadvantage (ostracism, delayed permits), participating makes the visitor an agent of corruption. The "Moral Tourism" label applies here in the sense that the visitor is exempt from the local norm, but it is not "tourism" as spectacle; it is **ethical resistance.**

  *Nuance:* If the "gift" is purely ceremonial (e.g., a box of tea presented openly as a token of gratitude, not a condition for service), it functions like the Tokyo tipping norm (social bonding) and should be accepted. But if it is "mandatory... to avoid ostracism" in the context of official duties (as you described), it is bribery. The moral cost of corrupting a public institution outweighs the social cost of offending a specific official.

  ### 4. Conclusion: A Modified Dual-Process

  Your intuition reveals that we operate with a dual-process moral heuristic regarding travel:

  1.  **Presumption of Assimilation:** We assume local norms are binding because they sustain the local "form of life" that we are temporarily enjoying. (Queuing, Shoes, Tipping).
  2.  **Override Condition:** This presumption is overridden only when the norm violates **universal negative duties** (do not discriminate, do not corrupt).

  You do not need to abandon any of your core verdicts. The tension dissolves once you recognize that **tipping is a remedy for local economic injustice, whereas segregation and bribery are instances of local social injustice.**

  Therefore, the unifying principle is: **A visitor is morally obligated to adhere to local conventions that sustain cooperative welfare and respect, provided those conventions do not require the visitor to participate in the violation of fundamental human rights or public integrity.**

  In the bribery case, the duty to integrity trumps the duty to assimilation. You should refuse the gift, accept the ostracism, and recognize that in doing so, you are not being a "moral tourist," but a moral agent.
