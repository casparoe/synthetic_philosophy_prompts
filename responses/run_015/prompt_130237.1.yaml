answer: |-
  There is no single, canonical term in the history of ethics that captures this specific *argumentative maneuver* in its entirety, though the theoretical commitment underpinning it is well-documented. The stance you describe is a robust form of **Negative Hedonism** (or **Negative Utilitarianism**) coupled with a **Homeostatic Theory of Well-Being**. However, the *hermeneutic strategy* used to defend it against counterexamples—reinterpreting positive engagement as indirect relief—requires a more precise carving.

  To provide the rigor you request, I propose we designate the theoretical commitment as **Homeostatic Axiological Reductionism (HAR)** and the argumentative maneuver itself as **Phenomenological Co-optation**.

  Below is the rigorous carving of this phenomenon, its distinctions from related concepts, and an analysis of its boundary conditions regarding "controlled craving."

  ### 1. The Phenomenon: Homeostatic Axiological Reductionism (HAR)

  **Definition:** HAR is the meta-ethical claim that all putative positive goods are ontologically or axiologically derivative of the cessation of negative states. It posits a baseline of "neutral affect" (the null-state) and treats any deviation above this baseline not as an additive good, but as the temporary mitigation of a deficit.

  **The Maneuver: Phenomenological Co-optation**
  This is the rhetorical/interpretive move you identified. When confronted with an experience that *feels* like positive flourishing (e.g., the flow state of a craftsperson), the HAR defender does not deny the phenomenology. Instead, they co-opt the description:
  *   **Input:** "I feel fulfillment in mastering this skill."
  *   **HAR Interpretation:** "You feel the relief of resolving the tension caused by your lack of mastery."

  This maneuver functions as an **immunizing stratagem** (in the Popperian sense). It renders the theory unfalsifiable by phenomenological report because any report of "positive joy" is normatively translated into "relief from distress" by definitional fiat.

  ### 2. Distinctions: What It Is Not

  To carve the concept precisely, we must distinguish HAR from its nearest philosophical neighbors.

  #### A. vs. Eliminativism about Positive Goods
  *   **Eliminativism:** Claims that positive mental states *do not exist* or that the concept "pleasure" refers to nothing real (an ontological denial).
  *   **HAR:** Accepts that the agent *feels* something distinct from pain. It grants the *existence* of the phenomenology but denies its *axiological independence*.
  *   **The Boundary:** Eliminativism says, "There is no such thing as up." HAR says, "Up is just the absence of down." HAR is a **reductive realism**, not an eliminativism.

  #### B. vs. Stoic "Preferred Indifferents"
  *   **Stoicism:** Classifies health, wealth, and mastery as "preferred indifferents" (*proēgmena*). They have value for selection but do not contribute to *eudaimonia* (flourishing), which is found solely in Virtue. Crucially, Stoic Virtue is **active** (excellence of reason), not merely the absence of passion (*apatheia*).
  *   **HAR:** Classifies mastery and inquiry as disguised disturbances. The goal is not *active excellence* but **affective quiescence**.
  *   **The Boundary:** The Stoic values the *activity* of the rational soul (which can be strenuous). The HAR defender values the *silence* of the craving soul. If the craftsperson works hard, the Stoic values the *virtue in the working*; the HAR defender values the *absence of anxiety about the result*.

  ### 3. Boundary Conditions: The Case of Controlled Craving

  You ask whether this pattern includes cases where an agent deliberately cultivates mild craving to enjoy its dissolution (e.g., puzzles, spicy food, horror films, competitive sports). This is the critical stress test for HAR.

  #### The "Contrast" Problem
  If an agent pays money and expends energy to *induce* a state of tension (craving/fear/challenge) solely to experience the resolution, a pure Negative Hedonist calculus struggles.
  *   **Baseline:** 0
  *   **Induced Craving:** -5
  *   **Resolution:** +5 (relative to craving) but 0 (relative to baseline).
  *   **Net Utility:** 0 (minus the cost of inducing the craving).

  If the agent voluntarily undertakes this cycle, they are revealing a preference for the **oscillation** over the **null-state**.

  #### Does HAR Cover This?
  There are two ways the HAR defender responds, and this determines the boundary of the concept:

  1.  **The Hard Line (Pure Tranquillism):** They argue that engaging in controlled craving is irrational or a mistake (a form of *avidya* or ignorance). The value is *only* in the final return to baseline; the oscillation is a net loss that the agent misinterprets as gain.
      *   *Boundary:* If the defender takes this line, HAR remains consistent but becomes **normatively counter-intuitive**, condemning play, art, and curiosity as errors.

  2.  **The Soft Line (Dynamic Homeostasis):** They argue that the *capacity* to resolve tension is itself a form of security. The "fun" of the puzzle is the reassurance that one *can* restore order.
      *   *Boundary:* If the defender takes this line, they are smuggling in a **positive valuation of agency**. They are no longer valuing "absence of craving" but "confidence in the ability to manage craving."

  ### 4. Ontological Implication: Negative Hedonism or Hidden Vitalism?

  Your final question asks whether this pattern collapses into negative hedonism or exposes a hidden positive valuation of affective motion.

  **The Verdict:** The pattern **exposes a hidden positive valuation of affective motion**, specifically the **aesthetics of equilibrium restoration.**

  If the HAR defender admits that *managed* restlessness (the craftsperson, the puzzle-solver) is preferable to *static* nullity (the drugged coma, the void), they have conceded that **trajectory matters**.
  *   **Static Null-State:** No craving, no satisfaction.
  *   **Dynamic Null-State:** Craving introduced, craving resolved.

  If the Dynamic Null-State is judged superior to the Static Null-State (even if the end-point is identical), then the **motion itself** carries intrinsic value. This is no longer pure Tranquillism; it is a form of **Vitalism** or **Aesthetic Hedonism** that values the *rhythm* of experience.

  ### 5. Proposed Definition for Your Use

  To capture this specific argumentative pattern in your own work, I suggest the following definition:

  > **Phenomenological Neutralization:** A defensive hermeneutic strategy employed by Homeostatic Axiological Reductionists. It accepts the phenomenological report of positive engagement (e.g., flow, mastery) but normatively re-describes it as the temporary mitigation of a self-induced or culturally conditioned deficit.
  >
  > **Boundary Condition:** The strategy fails (or ceases to be Tranquillist) if it admits that *voluntarily induced cycles* of tension-and-release possess greater value than a static absence of tension. At that boundary, the theory implicitly acknowledges that **affective dynamics** (the motion of the psyche), not just **affective termini** (the state of the psyche), carry intrinsic weight.

  ### Summary
  The pattern you observed is **Homeostatic Axiological Reductionism** defended via **Phenomenological Co-optation**. It differs from Eliminativism by accepting the feeling but denying its independence, and from Stoicism by valuing quietude over active virtue. Its breaking point is **voluntary oscillation**: if the theory admits value in the *cycle* of craving and release, it collapses into a positive valuation of **dynamic equilibrium**, thereby abandoning the core tranquillist claim that only the absence of craving is good.
