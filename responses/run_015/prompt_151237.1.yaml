answer: |-
  Here is a menu of precise theses that the slogan "Make people happy, not make happy people" could express, ordered from trivial to radical. Following the menu, I apply the three test cases, analyze the tension with your friend's longtermist opening, and diagnose the residual disagreement.

  ### The Menu of Theses

  #### 1. The Priority Heuristic
  **Thesis:** The slogan is not a metaphysical claim about value, but a rule of thumb for resource allocation. It means: *Given limited resources, improving the welfare of existing people takes precedence over creating new people.*
  *   **Verdict:** **Platitude.**
  *   **Commitments:** None regarding the intrinsic value of populations. It allows that creating happy people *is* good, just less urgent than fixing existing misery.
  *   **Unattractive Conclusions:** None logically, though it may lead to procrastination on existential risk if "existing people" is interpreted too narrowly (e.g., only those alive today).
  *   **Relation to Longtermism:** Fully compatible. One can prioritize current welfare while still agreeing that extinction is catastrophic because it forecloses the *future* priority of making those future people happy.

  #### 2. The Narrow Person-Affecting View
  **Thesis:** An outcome can be better than another only if it is better *for* some particular person. Since a person who is never created cannot be deprived of a life, creating a happy person is not a benefit to anyone.
  *   **Verdict:** **Substantive and Defensible (but costly).**
  *   **Commitments:** You must accept the Non-Identity Problem. You cannot say a policy is wrong because it harms future people if those people would not have existed otherwise.
  *   **Unattractive Conclusions:** The "Absurd Conclusion." If we choose a policy that leads to a future population with miserable lives over one with wonderful lives (provided the miserable lives are still worth living), this view cannot say the latter is better, because the specific people in the wonderful future are different from those in the miserable one.
  *   **Relation to Longtermism:** **Incompatible.** This view blocks the step from "extra life worth living" to "larger population better," but it *also* blocks the step from "extinction" to "catastrophic loss." If the future people never exist, extinction is not bad *for them*. Your friend would have to argue extinction is bad only for *us* (the currently existing), which undermines the "astronomical number" argument she opened with.

  #### 3. The Asymmetry View (Negative Utilitarian Leanings)
  **Thesis:** There is a fundamental moral asymmetry between pain and pleasure in the context of creation. We have a duty not to create people who will suffer, but no duty to create people who will be happy. Suffering counts negatively; non-existent happiness does not count as a loss.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Commitments:** The value of a population is determined by the sum of suffering (to be minimized) rather than the sum of happiness (to be maximized).
  *   **Unattractive Conclusions:** The "Sadistic Conclusion." It can imply it is better to add a group of people with lives barely worth living (positive but low) than to add a group with wonderful lives, if the act of adding the wonderful lives somehow risks even a tiny amount of suffering elsewhere, or simply because the "gain" of the happy lives counts for zero.
  *   **Relation to Longtermism:** **Incompatible.** This view blocks the RC, but it also blocks the claim that extinction is a vast loss of value. If the happiness of the non-existent counts for zero, the loss of astronomical future happiness is not a moral catastrophe, only the avoidance of future suffering is.

  #### 4. Critical Level Utilitarianism
  **Thesis:** Lives add positive value to the world only if their welfare exceeds a certain "critical level" (which is higher than "barely worth living"). Lives below this level (even if worth living) add zero or negative value.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Commitments:** You must define a threshold. It implies that a life can be "worth living" for the person living it, yet their existence makes the world impersonally worse (or no better).
  *   **Unattractive Conclusions:** The "Reverse Repugnant Conclusion." It implies we should prefer a smaller population with very high welfare over a larger population with *good* (but sub-critical) welfare, even if the larger population has vastly more total happiness. It treats sub-critical people as value-drains.
  *   **Relation to Longtermism:** **Compatible.** This is the strongest candidate for your friend's actual view. It blocks the RC (because the "barely worth living" masses don't outvalue the excellent few) but preserves the anti-extinction claim (provided the future people we are saving would have lives *above* the critical level).

  #### 5. Incommensurability of Different People
  **Thesis:** No value comparison is defined between populations containing different people. "Better than" is a relation that only holds when the subjects are identical or sufficiently overlapping.
  *   **Verdict:** **Radical and Likely False.**
  *   **Commitments:** Radical incomparability. We cannot say a world with 10 billion happy people is better than a world with 10 billion miserable people if they are different sets of people.
  *   **Unattractive Conclusions:** Moral paralysis regarding future policy. Almost all long-term decisions change *who* comes into existence (via the Non-Identity Problem). If we cannot compare different populations, we cannot say extinction is worse than survival.
  *   **Relation to Longtermism:** **Incompatible.** It renders the opening claim ("extinction would be a vast loss") literally unintelligible.

  ---

  ### Testing the Readings Against Your Three Cases

  | Case | Description | 1. Priority | 2. Person-Affecting | 3. Asymmetry | 4. Critical Level | 5. Incommensurability |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(1) RC Case** | 10B barely vs 5B wonderful | **No Block.** 5B wonderful is better, but slogan is just about urgency. | **No Verdict.** Cannot compare different people. | **Blocks.** 10B barely adds no value; 5B wonderful avoids suffering/creates value. | **Blocks.** 10B barely may be below critical level; 5B wonderful is above. | **Blocks.** No comparison possible. |
  | **(2) Mere Addition** | Add happy group, harm no one | **No Block.** Adding is good, just lower priority. | **No Verdict.** Not better for the added group (they wouldn't exist otherwise). | **Blocks.** Adding happy people is neutral, not good. | **Conditional.** Blocks if added lives are below critical level; allows if above. | **Blocks.** No comparison possible. |
  | **(3) Distant Planet** | Isolated lives barely worth living | **No Block.** Irrelevant to us pragmatically, but still good. | **No Verdict.** No beneficiary. | **Blocks.** Their happiness doesn't count toward the good. | **Blocks.** If below critical level, their existence adds no value. | **Blocks.** No comparison possible. |

  **Which readings block the step from "life worth living" to "population better"?**
  *   **Theses 2, 3, 4, and 5** all block this step.
  *   **Thesis 1** does not block it; it merely deprioritizes it.

  **Which readings undermine the Longtermist opening?**
  *   **Theses 2, 3, and 5** undermine the claim that extinction is a *vast loss* of value. If creating happy people adds no value (2 & 3) or comparisons are impossible (5), then losing future people is not a loss of *value*, only a loss of *potential beneficiaries* (which counts for nothing on these views).
  *   **Thesis 4 (Critical Level)** is the only one that consistently blocks the Repugnant Conclusion *while preserving* the claim that extinction is catastrophic. It requires the assumption that the future people we are saving would have lives *above the critical level*, not just barely worth living.

  ---

  ### Diagnosis of Your Friend's Position

  **Which reading does she probably have in mind?**
  She is almost certainly gesturing toward **Thesis 4 (Critical Level Utilitarianism)** or a **Lexical View** (a variant where wonderful lives are infinitely more valuable than barely worth living ones), but she is using the slogan from **Thesis 2 or 3** because it is catchier.

  The slogan "Make people happy, not make happy people" is historically associated with the Person-Affecting View (Thesis 2) and the Asymmetry (Thesis 3). However, her behavior reveals she does not actually hold those views. If she held Thesis 2 or 3, she could not argue that extinction is a vast loss *because of the people who would never exist*. On those views, the non-existence of happy people is neutral.

  She wants to have her cake and eat it too: she wants the **Total View's** conclusion on extinction (lost happiness is bad) but the **Critical Level View's** conclusion on the Repugnant Conclusion (low-quality happiness doesn't aggregate to beat high-quality happiness). The slogan is a verbal shield she is using to hide the fact that she is switching between two different axiologies depending on which conclusion she wants to avoid.

  **Where is the residual disagreement genuine rather than verbal?**
  The genuine disagreement lies in **Thesis 4**.
  *   **Your Position (implied):** You are likely operating on a **Total View** (Classical Utilitarianism). You believe value aggregates additively. A life worth living adds positive value, however small. Therefore, enough such lives *must* eventually outweigh a smaller number of excellent lives (RC), and extinction is bad because it deletes that sum.
  *   **Her Position (actual):** She likely believes in a **Threshold or Lexical Value**. She believes that "value" is not a uniform substance that aggregates. She thinks there is a qualitative break between "barely worth living" and "good."

  **The Verdict on the Disagreement:**
  She is right that the slogan "Make people happy, not make happy people" does not settle the argument, because taken literally (Theses 2 & 3), it destroys her own longtermist premise.

  However, she is also right to resist the Repugnant Conclusion. The disagreement is not merely verbal; it is about the **structure of value**.
  *   If you insist that value is purely additive (Total View), you must accept the Repugnant Conclusion.
  *   If you insist the Repugnant Conclusion is false, you must accept that value is not purely additive (e.g., Critical Level or Lexical View).

  **The Cost of Her View:**
  If she adopts the Critical Level view to save herself from the Repugnant Conclusion, she pays a price: she must admit that if the future of humanity guarantees only lives that are "barely worth living" (e.g., due to resource constraints or dystopia), then **extinction is not catastrophic**. Her longtermist claim is conditional. It only holds if we can secure a future of *high-quality* lives. If the choice is between extinction and a vast future of drudgery that is technically "worth living," her view (properly formulated) implies extinction might be permissible or even preferable.

  **Summary Advice:**
  Tell her the slogan is doing no work. Ask her directly: *"If the only future available to us is one where billions live lives that are barely worth living, is extinction still a catastrophe?"*
  *   If she says **Yes**, she is a Total Utilitarian and must accept the Repugnant Conclusion.
  *   If she says **No**, she is a Critical Level Utilitarian, and the slogan was a misleading way of expressing that threshold.
  *   If she says **"I can't compare them,"** she is embracing Incommensurability and must abandon the claim that extinction is objectively worse than survival.
