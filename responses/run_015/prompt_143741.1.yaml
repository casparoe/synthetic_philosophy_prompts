          *   Is James a subjectivist? Russell accused him of this ("truth is what feels good"). Contemporary scholars (e.g., Putnam, Misak) argue James is more nuanced; truth must "work" in a way that includes consistency with established truths, not just individual utility. The student leans into the "subjectivist" reading without acknowledging the constraint of "working" over time.

