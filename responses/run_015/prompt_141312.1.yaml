answer: |-
  TO: Grant Review Committee
  CC: General Counsel
  FROM: Committee Member (Community Representative)
  DATE: October 24
  SUBJECT: Recommendation on Grant Renewal and Voting Procedure

  **Bottom Line**
  The committee should not renew the grant. We must publish written findings stating that the grantee met scientific milestones and that the program remains consistent with current funding priorities. This outcome respects the majority vote on the operative question of renewal while accurately reflecting the majority findings on the statutory criteria. It relies on the bylaw's use of "may," which permits the committee to decline renewal even when criteria are satisfied.

  **Vote Tally and Premise Integrity**
  The balloting results are clear. Five members found milestones met; four found the program consistent with priorities; five voted against renewal. Dr. Lindqvist's request to change her vote on milestones from no to yes does not alter the majority finding on that question, which remains affirmative. However, this incident highlights a procedural risk. If members treat premise-level questions as costless vehicles for registering opposition to the final outcome, the published findings may cease to reflect the committee's actual judgment on those premises. We should adopt a standing rule that premise votes are binding findings of fact. Members should not vote against a fact they believe to be true simply to signal disagreement with the conclusion.

  **Legal Interpretation and General Counsel Contingency**
  General Counsel advises that the bylaw's use of "may" renders the two criteria necessary but not sufficient. This reading validates a decision to deny renewal despite positive findings. My own vote against renewal was based on a discretionary judgment that the foundation should be spending down its endowment on a different portfolio altogether—a judgment the "may" clause licenses. However, publishing positive findings alongside a denial requires an explanation to avoid appearing arbitrary. We must state explicitly that while the grantee performed successfully, the committee exercised its discretion to prioritize other investments.

  If General Counsel rejects this reading and determines the criteria are sufficient (i.e., "shall"), the outcome changes. Under a "shall" reading, a majority finding that both criteria are met mandates renewal. Since five members found milestones met and four found priorities consistent, we would lack the five-of-seven votes required to publish a finding that either criterion failed. Consequently, if the criteria are sufficient, the only legally publishable outcome is renewal. We cannot lawfully publish a denial accompanied by positive findings if the bylaw mandates renewal upon such findings.

  **Voting Method and Standing Rule**
  The Chair proposed voting on which method to use to combine our votes. Selecting a counting rule ad hoc in the very case where the rule decides the outcome creates an appearance of self-dealing, even if unintentional. The seven of us are choosing the rule that determines our own victory. Instead, we should adopt a standing rule for all forty annual renewals. I recommend a premise-based procedure: the committee votes on the criteria first. If both pass by majority, renewal is presumed. A final vote on renewal controls the outcome, but if renewal is denied despite positive criteria, the published findings must still reflect the majority view on the criteria, citing the discretionary authority of the committee. This ensures transparency: the grantee knows they succeeded technically but lost on policy.

  **Evaluation of the "Minimize Flips" Method**
  We were asked to evaluate a third method: choosing the package of answers that requires flipping the fewest individual ballots. On these numbers, the package (Yes, Yes, No) requires flipping six individual answers across the seven ballots (changing the two pro-renewal members' votes on renewal, and the three anti-priority members' votes on priorities, plus one on milestones). The package (Yes, Yes, Yes) requires flipping nine answers. The package (Yes, No, No) requires flipping seven. Thus, (Yes, Yes, No) minimizes the distance from the actual ballots.

  However, legal viability trumps mathematical proximity. The package (Yes, No, No) would require publishing a finding that priorities are not consistent. Staff recommended renewal, implying priorities are consistent. Publishing a negative finding on priorities departs from staff recommendation and requires five affirmative votes. Only three members voted that priorities are inconsistent. Therefore, (Yes, No, No) is not legally publishable. The (Yes, Yes, No) package is the only denial option that satisfies the five-of-seven rule for departing from staff recommendation, as five members voted against renewal.

  **Counter-Argument for Renewal**
  The strongest argument for renewal is reliance and consistency. The grantee met every objective set before them. The bylaw establishes specific criteria to protect grantees from arbitrary defunding. If the committee uses the "may" clause to deny renewal despite perfect performance, the criteria become illusory. Future applicants cannot rely on meeting milestones to secure funding if the committee retains unfettered discretion to deny renewal based on unstated portfolio shifts. This undermines the foundation's credibility and chills applications from risk-taking scientists who need stability. If we value the rule of law within our own governance, we should renew when the stated conditions are met.

  **Conclusion**
  Despite the strength of that counter-argument, the majority has voted against renewal. To honor that vote without falsifying our findings, we must deny the grant and publish positive findings. This path is legally permissible under the "may" reading and minimizes distortion of the ballot record. If General Counsel determines the criteria are sufficient, we must immediately reconvene to vote for renewal, as any other outcome would be unpublishable. For the future, we must adopt the standing rule recommended above to prevent this conflict from recurring. We cannot allow the method of counting to be contested anew every time the premises and conclusion diverge.

  Respectfully submitted,

  Committee Member
