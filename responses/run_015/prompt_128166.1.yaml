answer: |-
  Okay, let's run this translation. I'll take Appiah's narrative about honor codes and Williams's skepticism, run them through your institutionalist filter, and then we'll look at the wreckage to see what didn't fit.

  ### The Translation

  **Honor as Costly Signaling**
  In Appiah's telling, honor isn't just a feeling; it's a social technology. In your vocabulary, an honor code is a **costly-signaling equilibrium**. To be a "gentleman" in 18th-century England or a slaveholder in the antebellum South, you have to burn resources. You fight a duel you don't want to fight; you maintain a labor system that is increasingly inefficient. Why? Because the signal verifies your membership in the dominant coalition. If you don't pay the cost, you lose access to the network benefits (trust, credit, marriage markets).

  **Moral Revolution as Equilibrium Shift**
  When Appiah says moral revolutions happen, he means the population jumps to a new **coordination equilibrium**. The old Schelling point (dueling = honor) loses its focal power. The new Schelling point (dueling = barbarism) takes over.
  Crucially, Appiah argues this isn't driven primarily by **payoff restructuring** (the Williams-style rejection of bare economic interest). Slavery didn't end just because it became unprofitable; in many places, it remained profitable until the end. Nor was it purely **belief updating** via rational argument (the rejection of pure moral philosophy). People didn't just read Kant and update their priors.

  Instead, the *value of the signal* inverted. Maintaining the old behavior stopped signaling "high status/loyal coalition member" and started signaling "backward/risky." The coordination game flipped. The path dependence held the old equilibrium in place for a long time (lock-in), but once the reputation cascade tipped, the lock-in reversed.

  **Williams's Skepticism as Equilibrium Selection**
  Williams doubts that rational arguments or economic interests explain the *timing* or the *direction* of the shift. In your framework, this maps directly onto the **equilibrium selection problem**. Standard game theory can tell you there are multiple equilibria (dueling vs. no-dueling), but it struggles to explain *why* the population moves from Equilibrium A to Equilibrium B at time *t*, especially when A is still stable.
  Williams is essentially saying: "Your payoff matrices and rationality assumptions don't contain the selection mechanism." He's pointing at the exogenous shock or the focal point shift that game theory usually treats as a black box.

  ### Weaving in Your Side Model (Noisy Local Clustering)

  This is where your specific model adds traction. Appiah describes honor collapsing in specific social circles (e.g., London elites) before it hits the provinces or colonies.

  In your **noisy reputation tracking in locally clustered networks**, you can model this as a local destabilization of the costly-signaling equilibrium.
  1.  **Cheap-Talk Deviations:** Moral arguments function as "cheap talk." Normally, cheap talk doesn't move equilibria. But in a noisy, clustered network, cheap talk increases the variance in reputation tracking.
  2.  **Local Destabilization:** If a cluster (say, London intellectuals) starts treating the old signal (owning slaves) as noise or negative value, the reputation mechanism within that cluster gets noisy. The costly signal no longer guarantees high reputation *locally*.
  3.  **Cascade:** Once the local equilibrium breaks, the reputation cascade spills over cluster boundaries. The "honor" of the old guard becomes a liability in the wider network.

  Does this correspond to Appiah or Williams? Appiah definitely talks about the "social world" fragmenting. He notes that when the British Empire administration stopped respecting slaveholders, the honor code crumbled. That's a cluster-level reputation shift. Williams is less specific on the mechanism, but his insistence on the "social context" aligns with the idea that the network topology matters more than individual rationality. Neither of them explicitly models the *noise* parameter, but Appiah's historical narrative is basically a trace of that noise propagating through clusters.

  ### The Residue Report

  Now, the honest audit. Where does your framework distort or drop the ball?

  **1. What Survives Clean**
  *   **Path Dependence & Lock-in:** This is a perfect fit. The reason dueling and slavery persisted despite inefficiency and moral critique is classic institutional lock-in. The coordination cost of switching was too high until the reputation cascade lowered it.
  *   **Reputation Cascades:** Appiah's mechanism is fundamentally about who respects whom. Your network models capture the contagion aspect of this very well.
  *   **The Failure of Pure Interest:** Your framework handles the "economic interest" failure easily. If the payoff for signaling (status) outweighs the economic loss, agents stay in the inefficient equilibrium.

  **2. What Gets Distorted to Fit**
  *   **Moral Argument as Cheap Talk:** This is the biggest friction. In your model, cheap talk is usually low-cost and easily ignored unless it interacts with noise. But Appiah argues moral arguments *do* work, just not in a vacuum. They work by reframing the signal. In game theory terms, moral argument isn't just cheap talk; it's a **correlating device** that changes the *interpretation* of the signal. If you force "moral argument" into "cheap talk," you risk underestimating its power to restructure the payoff matrix itself by changing preferences, not just beliefs.
  *   **Honor as Utility:** Translating "honor" into "utility from reputation" flattens it. For Appiah and Williams, honor is constitutive of the self. It's not just a payoff; it's part of the agent's identity function. In your model, agents are usually fixed entities maximizing a function. In their story, the *agent's function itself* is being rewritten.

  **3. What Has No Expression (The Missing Residue)**
  *   **The Normative "Ought":** Game theory is descriptive. Appiah and Williams are wrestling with the phenomenology of morality—why we *feel* bound by these codes. Your model explains why the behavior stops, but it doesn't capture the *shame* or the *moral disgust*. That qualitative experience is the engine of the shift in their stories, but in your model, it's just a parameter change.
  *   **Williams's "Thick" Concepts:** Williams talks about "thick" ethical concepts (cruel, brave, treacherous) that blend fact and value. Your framework deals in "thin" concepts (payoff, signal, strategy). There is no variable in a coordination game for "treachery." You can model the *cost* of being called treacherous, but you can't model the *concept* of treachery itself.

  **4. Verdict on Williams's Doubt**
  Does Williams's doubt map to an equilibrium-selection problem?
  **Mostly Yes, but with a caveat.**
  Yes, because he is pointing out that rationality + interests don't determine *which* equilibrium we land on. That is the definition of an equilibrium selection problem.
  **However,** the caveat is that Williams thinks the *source* of the selection is outside the rational-choice domain entirely. It's in history, culture, and the evolution of language. In your framework, equilibrium selection is often modeled via evolutionary dynamics or learning rules. Williams would say those learning rules are *also* products of the honor code, not the explainer of it. So, while "equilibrium selection" is the right *slot* in your vocabulary to put his critique, your vocabulary implies a mechanism (learning/evolution) that Williams might say is too mechanistic to capture the conceptual shift.

  **Summary on the Side Model:**
  Your noisy local-clustering model actually rescues the game-theoretic approach from Williams's strongest critique. Williams says "rational argument doesn't drive change." Your model says "cheap talk (argument) + network noise *does* drive change, but only by destabilizing local signals, not by convincing rational agents."
  This hybrid picture corresponds to Appiah's historical observation: the arguments didn't convince the slaveholders; the arguments gave the *observers* (the network) a reason to stop respecting the slaveholders. The signal broke. That fits your model better than it fits standard rational choice, and it aligns surprisingly well with Appiah's actual historical narrative, even if he wouldn't use the math.

  So, you can model the *collapse*, but you can't model the *shame*. You can model the *tipping point*, but you can't model the *moral truth* of the new equilibrium. That's the residue.
