answer: |-
  Dear Friend,

  It was great to hear from you and to see that the pub discussion has kept fermenting in your mind, because the position you have outlined is genuinely intriguing and shows a sophisticated attempt to navigate between the Scylla of ontological proliferation and the Charybdis of denying obvious modal differences. You are essentially proposing a form of pragmatic conventionalism about persistence conditions, where the object itself is singular but its identity conditions are functions of the normative framework applied to it. This avoids the coincident objects problem by denying there are two things, and it avoids the strict identity problem by relativizing the modal properties to practices. However, since you asked for a honest critique regarding what would count against this view, I want to walk through the specific defeaters that arise when we press on the metaphysical implications of making existence and persistence practice-relative.

  The most fatal objection you face concerns the contradiction of existence itself. If there is literally one object, let us call it O, and you squash it at time t, your view says O ceases to exist relative to the art conservation framework but continues to exist relative to the geological framework. If O is a single entity in the world, then at time t plus one, O both exists and does not exist. To avoid a formal contradiction, you must relativize existence itself, not just persistence conditions. But if existence is relative to a framework, then there is no fact of the matter about whether O is there to be referred to independent of the framework. This undermines the singularity of the object you started with. If the object's being is fragmented across frameworks, you have not truly saved the one-object view; you have merely pushed the coincidence down to the level of existence conditions. A committed defender would have to concede that on this view, there is no mind-independent object that persists through time at all, only object-stages that are grouped differently by different practices. This is damaging because it shifts your view from a metaphysical claim about objects to a semantic claim about concepts, which might not solve the metaphysical puzzle you set out to solve.

  A serious defeater, though perhaps not fatal if you are willing to bite the bullet on realism, involves causal powers and interaction. Consider a case where the practices conflict in a way that affects physical interaction. If a conservator treats the object as destroyed and walks away, but a geologist treats it as existing and picks it up, the physical causal history of the object continues regardless of the conservator's judgment. If the object's persistence is tied to the normative practice, does the object literally lose its causal powers when the conservator declares it destroyed? If you say no, then the causal powers are independent of the persistence conditions, which severs the link between what an object is and what it can do. If you say yes, then you imply that human normative practices can physically annihilate objects or sustain them against physical degradation, which sounds like magic. The specific case of biological organisms highlights this awkwardness. If a human body is kept on life support, the medical framework might classify the organism as persisting, while a psychological or legal framework might classify the person as deceased. If these are the same object, and identity is practice-relative, then the object is both dead and alive. While you might say this is just a conflict of classification, the physical reality is that the body is decaying or being sustained by machines regardless of the classification. If your metaphysics cannot account for why the body continues to metabolize glucose even when the legal framework says the person is gone, then your view fails to integrate with scientific explanations of persistence.

  An awkward but persistent defeater concerns the individuation of the practices themselves. You rely on the distinction between art conservation behaviour and geological classification behaviour, but practices are vague and overlapping. What counts as a distinct practice? If I am an artist who also happens to be a geologist, which framework applies when I look at the clay? If the answer is both, we return to the contradiction of the object having incompatible properties simultaneously. If the answer is that I switch between them moment by moment, then the object is flickering in and out of existence depending on my fleeting attention. This leads to a proliferation of modal profiles that mirrors the proliferation of objects you wanted to avoid. There is no formal result that disproves this, but it makes the view incredibly messy to apply in edge cases, such as the Ship of Theseus where multiple legitimate practices of identification might compete without a clear hierarchy. A defender would have to concede that there is no fact of the matter about which practice is operative in borderline cases, which means there is no fact of the matter about whether the object exists in those cases. This vagueness is manageable but it renders the theory less predictive and explanatory than a realist account.

  Regarding your question on unfalsifiability, I believe you have qualified the position to the point where it is very difficult to falsify, and this is a real problem for a metaphysical claim. If every counter-example can be met by positing a new or distinct normative practice that validates the intuition, the theory becomes immune to evidence. For instance, if I present a case where intuition says the object survives but your theory says it should not, you can simply posit a practice where survival is the norm. This protects the theory but at the cost of explanatory power. A theory that explains everything explains nothing. However, whether this is a fatal flaw depends on what you think metaphysics is for. If you view metaphysics as clarifying our conceptual schemes rather than describing mind-independent reality, then unfalsifiability is less of a vice because you are not making empirical claims. But if you claim this is how the world is, then the inability to specify conditions under which the view would be wrong makes it dogmatic. To save it, you would need to constrain what counts as a valid normative practice, perhaps by tying it to stable social institutions or biological necessities, but doing so might reintroduce the objective persistence conditions you sought to avoid.

  To be honest about where my reasoning might go wrong, I am assuming a realist metaphysics where objects and their existence conditions are mind-independent. If your view is rooted in a Kantian or pragmatic tradition where reality is constituted by our engagement with it, then my objections about contradictions in existence miss the point because you deny there is a framework-independent reality to contradict itself. In that case, the object is not one thing waiting to be described but is constituted by the description itself. If that is your ground, then the contradiction is only apparent because the truths are internal to the frameworks and not comparable in a single God's-eye view. I would change my mind about the severity of the existence contradiction if you could provide a robust account of how reference works across frameworks without presupposing a shared object that anchors the term. If you can show how we successfully communicate about the statue and the clay without assuming a common referent that persists through the conversation, then the charge of contradiction loses its force.

  Finally, the observation that would change my assessment of your view is if you could demonstrate a case where shifting practices actually changes the physical behaviour of the entity in a measurable way, not just our description of it. Since that is impossible under known physics, I remain skeptical that practice-relative identity can fully replace object-relative identity without losing track of the world. However, your approach is a neat way out of the coincidence problem if one is willing to sacrifice the idea of a single, stable reality. I hope this helps you refine the view further, and I would love to hear how you respond to the challenge of causal powers.

  Best wishes
