  # Part 1: Activity Plan

  ## Setup
  Arrange the room into six clusters of movable tables, each accommodating three students. Distribute one 'Case File' folder to each group. Inside each folder, place a set of Role Cards (Advocate, Client, Arbiter), a packet of ten Credibility Chits (counters), and a Scenario Deck. You, the convenor, retain the 'Master Truth Key' (a separate sheet not shown to students) which dictates the hidden truth value for every Scenario Card. Explain that the game simulates a professional tribunal where information is imperfect. The goal is not merely to win points, but to maintain professional standing while ensuring successful outcomes for the Client.

  ## Materials
  *   **Printable Handout (2 sides A4):** Side One contains the 'Tribunal Rules' (scoring criteria and role descriptions) and the 'Stakes Dial' instructions. Side Two contains the blank 'Decision Log' for recording assertions and outcomes.
  *   **Index Cards:** Pre-printed with Scenario details (Proposition and Evidence Package) but *without* the Truth Value.
  *   **Counters:** 60 Credibility Chits (e.g., poker chips or coloured buttons) to serve as scoring currency.
  *   **Master Truth Key:** A sheet held only by you, listing the Truth Value for every Card ID.

  ## Roles
  Each group of three assigns roles for the first two rounds, then rotates for the final two.
  1.  **Advocate:** Reviews the Evidence Package and decides whether to Assert the Proposition to the Client.
  2.  **Client:** Must decide on a course of action (Act or Refrain) based *only* on the Advocate's assertion.
  3.  **Arbiter:** Observes the interaction and awards or deducts Credibility Chits based on the 'Tribunal Rules' regarding propriety and blame.

  ## Round Sequence (100 Minutes)
  *   **00:00 – 00:10 (Introduction):** Distribute materials. Explain that the 'Truth Value' is hidden from them and held by you. They must decide whether to assert based on evidence alone. Introduce the three scoring streams: Client Outcome, Advocate Standing, and Arbiter Blame.
  *   **00:10 – 00:25 (Round 1: The Routine Check):** All groups receive Card 01-L (Low Stakes, Strong Evidence). Advocate decides whether to assert. Client acts. You reveal the Truth. Scoring calculated.
  *   **00:25 – 00:40 (Round 2: The Stakes Dial):** All groups receive Card 01-H (High Stakes, Strong Evidence). The evidence is identical to Round 1, but the consequences of error are severe. Discuss within groups whether the threshold for assertion changes.
  *   **00:40 – 00:55 (Round 3: The Lottery Proposition):** Groups receive Card 03 (Statistical Evidence, True). The Advocate has only statistical odds. The Client needs a definite answer. This tests the conflict between truth and evidential quality.
  *   **00:55 – 01:10 (Round 4: The Emergency):** Groups receive Card 04 (Weak Evidence, Must Act). The Client faces a time-critical decision. If the Advocate adheres strictly to high evidential standards, the Client cannot act. If they assert on weak evidence, they risk blame.
  *   **01:10 – 01:20 (Scoring & Tally):** Groups total their Credibility Chits across the three streams. Note any discrepancies where a group scored high on Client Outcome but low on Advocate Standing.
  *   **01:20 – 01:40 (Debrief):** Facilitate a discussion connecting the game mechanics to philosophical concepts. Introduce the vocabulary of 'norms of assertion' only now.

  ## Scoring
  There are three independent streams of scoring. They are designed to come apart.
  1.  **Client Outcome (Hearer Truth-Conduciveness):** The Client gains 2 Chits if their action matches the Hidden Truth (e.g., they acted because the proposition was True). They lose 2 Chits if their action mismatches the Truth (e.g., they acted because the proposition was False). This proxies the value of truth.
  2.  **Advocate Standing (Speaker Epistemic Standing):** The Advocate gains 2 Chits if their assertion aligns with the 'Warrant Threshold' (defined in the Tribunal Rules as having Strong Evidence). They lose 2 Chits if they assert on Weak Evidence. This proxies the value of justification/knowledge.
  3.  **Arbiter Blame (Social Normativity):** The Arbiter has discretion to deduct 1 Chit from the group total if they deem the assertion 'rash' or 'improper', regardless of the outcome. This proxies the social norm of blame.

  ## Debrief
  Begin by asking groups where their scores diverged. Did anyone win Client Outcome points but lose Advocate Standing points? Use this to introduce the distinction between a rule that demands truth and a rule that demands knowledge.
  *   **The Flatmate's Position:** Highlight Round 3 (Lottery). If the proposition was true, the Client benefited. Why penalise the Advocate? This mirrors the view that only truth and carelessness matter.
  *   **Your Position:** Highlight Round 4 (Emergency). If the Advocate refused to assert because they lacked knowledge, the Client was paralysed. Is the Knowledge Rule too demanding in practice?
  *   **The Guidance Objection:** Ask the students: "In Round 2, could you ever be certain you satisfied the Knowledge Rule before you asserted?" If they cannot know whether they know, can the rule guide them? This raises the objection that a norm must be followable to be valid.
  *   **Stakes:** Ask if the shift from Round 1 to Round 2 changed their behaviour. Did the 'cost' of error shift the rule itself, or merely the caution with which they applied it?

  ## Predictable Failures
  1.  **Admissibility vs. Propriety:** Law students may argue about whether the evidence would be admissible in court rather than whether it is proper to assert. **Fix:** Remind them this is a 'Tribunal of Professional Conduct', not a court of law; the rules are about ethical assertion, not procedural admissibility.
  2.  **Gaming the Truth:** Students may try to ask you, the convenor, for hints about the Hidden Truth during the round. **Fix:** Enforce a strict 'No Contact' rule during decision phases. Any group asking for truth hints receives an automatic Blame penalty.
  3.  **Role Collapse:** The Advocate and Client may collude to maximise total chits rather than playing their conflicting interests. **Fix:** Remind them that the Arbiter's Blame score is independent and punitive; collusion often triggers the 'rashness' penalty.

  ## Irreproducible Feature
  The activity cannot reproduce the phenomenological weight of *assertoric commitment*—the internal feeling of being bound by one's word that distinguishes a mere guess from an assertion. Students may treat assertions as cheap moves in a game. You must supply this by hand in the debrief, asking them to recall the hesitation they felt before speaking in Round 4 and framing that hesitation as the internalisation of a norm.

