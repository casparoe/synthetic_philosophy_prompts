  *(Self-Correction Note on "Capability Overhang"):* In AI safety, "overhang" usually refers to "Compute Overhang" (hardware existing but not used due to algorithmic inefficiency). The colleague defines it as "competence exceeds anticipatory scope". This is closer to "Loss of Control" or "Sharp Left Turn". I must point out this terminological divergence.

