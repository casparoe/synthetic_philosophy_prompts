      *   (3) *Transparent Phenomenal Concepts:* Possession requires tokening. Explains immediacy (direct acquaintance model).
      *   (4) *Methodological Split:* Trust reports on *what* (phenomenology), distrust reports on *why* (causation).
      *   (5) *Evolutionary Debunking:* Evolution undermines introspection just like morality. No privileged sanctuary.

  3.  **Identify Pairwise Tensions:**

      *   **(1) vs. (5):** (1) claims authority/infallibility for phenomenal states. (5) claims evolutionary debunking removes privileged sanctuary. If evolution shaped introspection for fitness, not truth, why trust (1)? *High Tension.*
      *   **(2) vs. (5):** (2) admits unreliability on etiology. (5) says evolution undermines introspection generally. These seem compatible, but (5) suggests a *global* undermining that might spill over into (1). *Low Tension.*
      *   **(3) vs. (5):** (3) grounds authority in the nature of concepts/tokening (internal logic). (5) grounds skepticism in external etiology (evolution). Can internal logic survive external debunking? *Medium/High Tension.*
      *   **(1) vs. (2):** Distinguishes *what* from *why*. Standard distinction in philosophy of mind. *Low Tension (by design).*
      *   **(4) vs. (5):** (4) tries to carve out a sanctuary for phenomenology. (5) explicitly denies a sanctuary. *High Tension.*

  4.  **Deep Dive into Specific Conflicts:**

      *   **The Core Conflict:** The tension between the "Privileged Access" cluster (1, 3, 4) and the "Naturalistic Debunking" cluster (2, 5).
