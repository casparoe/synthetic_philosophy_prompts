      *   *(1) vs (5):* **Real.** (1) asserts a sanctuary (infallibility). (5) denies sanctuaries.
      *   *(3) vs (5):* **Real.** (3) offers an internalist justification. (5) offers an externalist debunking. They talk past each other but contradict on the *result* (justified belief vs. undermined belief).
