          *   *Can (3) block (5)?* (3) says the *concept* guarantees truth when tokened. (5) says the *faculty* is suspect. If the concept is constituted by the state itself (self-intimating), evolutionary history might not matter. However, if evolution shaped the *mechanism* of tokening, (5) bites.
          *   *Can (4) block (5)?* (4) is a methodological rule. (5) is a metaphysical/epistemic claim about the faculty's reliability. (4) tries to save the data, (5) attacks the source. (4) cannot logically block (5) unless (5) is false. (4) assumes the split is valid; (5) challenges the validity of the split's positive side.
      *   **The Stability of (4):** (4) relies on the distinction between *content* (phenomenal) and *causation* (theoretical). (5) attacks the *faculty* producing the report. If the faculty is globally compromised by evolution, can we trust it to make the distinction in (4) reliably? If evolution shaped us to report pain accurately *because* it aids survival (avoid damage), then (1) is safe. But (5) implies evolution shapes us for *fitness*, not truth. If accurate pain reporting aids fitness, (1) survives. If accurate *causal* reporting doesn't, (2) holds. But (5) says "no privileged sanctuary." This implies (1) is threatened.

  5.  **Evaluate "Real" vs. "Apparent" Tensions:**

