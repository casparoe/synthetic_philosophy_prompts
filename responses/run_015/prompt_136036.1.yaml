      *(Self-Correction during drafting)*: I need to be careful about (3). Transparent phenomenal concepts (like in physicalist phenomenal concept strategies) usually argue that the concept *is* the experience. If so, you can't be wrong about it. Does evolution matter? If the experience exists, the concept tokens. If evolution makes you hallucinate the experience, you still have the experience. So (3) + (1) might actually survive (5) if (5) is about *representation* of the world, but (1) is about *constitution* of the state. However, (5) says "introspective faculties." If the faculty is the mechanism of attention/reporting, evolution could mess that up even if the concept is transparent. I will argue that (3) offers a *logical* shield, but (5) attacks the *psychological* mechanism. The tension remains severe.

