answer: |-
  ### Quick Brainstorm / Scratchpad

  *   **Goal:** Stop the flood of "let's do a citizens' assembly" pitches. Most are ill-suited.
  *   **Core Logic:** Sortition = anti-corruption/anti-polarization tool. It trades efficiency for legitimacy.
  *   **Kill Conditions:**
      *   Emergency/Time-sensitive? -> Kill. (Deliberation is slow).
      *   Highly Technical? -> Kill. (Laypeople can't learn hydrology in a weekend).
      *   Activist Capture? -> Kill. (If the pool isn't random from civic roll, it's just another lobby group).
  *   **Green Light Conditions:**
      *   Value conflicts (what do we prioritize?) vs Technical fixes.
      *   Elected officials are stuck/gridlocked.
      *   Long-term planning.
  *   **The "Mayor Problem":** Even if the process is perfect, if the output contradicts the elected mandate, who wins? Need to flag this. It's not a process failure, it's a political reality.
  *   **Format:** Needs to be printable, one-pager ideally. Checkboxes.
  *   **Tone:** Internal memo. Practical. No academic jargon.

  ---

  ### MEMO: The 20-Minute Sortition Sanity Check
  **To:** City Manager's Office
  **From:** Democratic Innovation Unit
  **Subject:** Filtering Citizens' Assembly Proposals

  Look, we're getting pitched a "citizens' assembly" for everything from potholes to park benches. Most of these will fail or, worse, succeed and create a political mess. Sortition is a specific tool for specific problems. It breaks party capture, but it's slow and fragile.

  Use this checklist before you sign off on any budget or staff time. If you can't run this in 20 mins, you're overthinking it.

  #### PART 1: ENTRY CONDITIONS (Is this even the right tool?)
  *If you can't check at least two, file this under "Public Engagement" instead.*

  - [ ] **Gridlock Exists:** Elected officials or departments are stuck on a values trade-off (e.g., safety vs. cost, density vs. character).
  - [ ] **Trust Deficit:** The public believes the current decision process is rigged by lobbyists or party interests.
  - [ ] **Long Timeframe:** The decision affects the city for 5+ years (not next week's budget).

  #### PART 2: HARD STOPS (The Kill Switches)
  *If any of these are TRUE, kill the proposal immediately. Do not pass Go.*

  - [ ] **URGENCY:** Does this need a decision in less than 3 months?
      *   *Logic:* Deliberation takes time. Recruitment, learning, deliberating, reporting. If it's urgent, use executive authority.
  - [ ] **MANDATE CONTAMINATION:** Can we recruit from the full civic roll (DMV/Utility lists), or are we relying on volunteers/activists?
      *   *Logic:* If participants self-select, it's just a focus group with extra steps. It must be random selection + stratification to be legitimate. If you can't access the civic roll, **STOP**.
  - [ ] **TECHNICAL DEPTH:** Is the core issue based on complex engineering/legal constraints that leave no room for value judgment?
      *   *Logic:* Citizens can prioritize *where* to fix pipes, they can't decide *how* to engineer pressure levels.

  #### PART 3: THE GRAY ZONE (Fact vs. Value Nodes)
  *These aren't kill switches, but they require explicit political judgment.*

  - [ ] **The Expertise Balance:** Will experts testify to inform values, or to dictate outcomes?
      *   *Flag:* If staff feel threatened by laypeople questioning technical assumptions, this will blow up.
  - [ ] **The Mandate Clash:** Does this topic overlap with a specific campaign promise from the Mayor or Council?
      *   *Judgment Call:* Sortition produces *recommendations*, not laws. If the assembly recommends X and the Mayor campaigned on Not-X, you have a legitimacy conflict. Note this clearly.

  #### PART 4: FAILURE FLAGS (Where the tool misfires)
  *Even if it passes above, watch for these risks.*

  - [ ] **Implementation Gap:** Who is bound to implement the result? If it's advisory only, will the public feel betrayed if ignored?
  - [ ] **Scope Creep:** Did the question change mid-process? (Keep the charge tight).

  ---

  ### APPLICATION TESTS

  Here's how this runs on the two proposals currently on your desk.

  #### CASE 1: Bike-Lane Priority Redesign
  **Proposal:** Use a sorted mini-public to decide which neighborhoods get protected lanes first.

  *   **Entry Conditions:**
      *   Gridlock? **Yes.** Council is split between downtown business vs. residential safety.
      *   Trust Deficit? **Yes.** Public thinks lobbying by business assoc. is driving current plans.
      *   Long Timeframe? **Yes.** Infrastructure plan is for 10 years.
      *   *Status:* **PASS** to next section.
  *   **Hard Stops:**
      *   Urgency (<3 months)? **No.** Planning phase is open.
      *   Mandate Contamination? **No.** Staff confirms access to utility billing list for random draw.
      *   Technical Depth? **No.** It's about priority/values, not engineering specs.
      *   *Status:* **PASS** (No Kill Switches hit).
  *   **Gray Zone / Judgment:**
      *   Mandate Clash? **YES.** Mayor campaigned on "No removal of parking spots for bikes."
      *   *Advisor Note:* The process is valid, but the output will likely conflict with the Mayor's mandate. This isn't a process failure, it's a political feature. The assembly represents the *people*, the Mayor represents the *voters who elected them*.
  *   **Verdict:** **GREEN LIGHT WITH WARNING.** Proceed, but brief the Mayor's office that this might produce a recommendation they can't accept without political cost.

  #### CASE 2: Emergency Drought Rationing Rules
  **Proposal:** Citizens' assembly to set water restriction tiers for the upcoming summer.

  *   **Entry Conditions:**
      *   Gridlock? **Maybe.**
      *   Trust Deficit? **Yes.**
      *   Long Timeframe? **No.** This is for the upcoming summer season.
      *   *Status:* **WEAK** entry.
  *   **Hard Stops:**
      *   Urgency (<3 months)? **YES.** Summer starts in 8 weeks. Recruitment alone takes 4.
      *   Mandate Contamination? **Unknown,** but likely relies on volunteers because urgent timelines usually skip random draws.
      *   Technical Depth? **YES.** Rationing tiers depend on aquifer levels, pressure logistics, and legal water rights.
      *   *Status:* **HARD STOP.**
  *   **Verdict:** **RED LIGHT.** Kill this now. This requires executive action based on expert hydrology data. Putting this in front of laypeople under time pressure creates liability and bad policy.

  ---

  ### What This Procedure Can't Do

  Be honest with yourself: this checklist protects us from bad process, but it doesn't solve political conflict.

  1.  **It doesn't override elections:** If a sorted group says "X" and the Council says "Y", the Council wins. If we sell the assembly as "binding" when it isn't, we create a crisis.
  2.  **It doesn't fix bad questions:** Garbage in, garbage out. If the charge is biased, the random selection doesn't matter.
  3.  **It doesn't guarantee happiness:** People who lose the argument will still be mad, even if the process was fair.

  Use the tool. If it passes, we talk budget. If it hits a hard stop, send them to Public Engagement for a town hall instead.
