  *   Non-numerical: No coefficient exists.
  *   Non-comparable: $P_1$ not >, <, or = $P_2$.
  *   Weight: Amount of relevant evidence.

  *Market Terminology Check:*
  *   Theo/Mid.
  *   Wide spread/Indicative/NQ.
  *   Risk limits/VaR/Marks.
