answer: |-
  Here is the translation of Keynes's *Treatise on Probability* (1921) into your prop desk vocabulary, followed by the specific pressure tests and the residue report.

  ### 1. The Translation

  **Claim 1: Probability is a logical relation between evidence and proposition, not a state of mind.**
  *   **Market Translation:** The **Theoretical Mid (Theo)**.
  *   **The Logic:** Just as Keynes argues probability exists independently of what anyone *feels* it is, your Theo exists independently of your inventory bias or gut feeling. It is the output of the logical relation between your inputs (vol surface, rates, correlation matrix) and the pricing model. It is "objective" in the sense that any trader running your model with your inputs must get the same number.
  *   **Smuggling Alert:** I am equating "logical relation" with "model output." Your model is a human construct with subjective assumptions (e.g., assuming log-normal distribution). Keynes's logical relations are Platonic truths. By calling the Theo the probability, I am smuggling in the assumption that your model correctly captures the logic of the market, which it often doesn't.

  **Claim 2: Some probabilities are not numerical.**
  *   **Market Translation:** **Going Indicative / No Quote (NQ).**
  *   **The Logic:** When the evidence (order flow, news, broker color) is too fragmented to support a specific coefficient, you do not output a number. You say "workout" or "indicative only." You are acknowledging that a firm two-sided market cannot logically be derived from the current evidence.
  *   **Smuggling Alert:** Even an indicative price is usually a number in your head. Keynes means *no number exists*. When you go indicative, you usually still have a mental mid, you're just hiding the spread. True non-numerical probability would be a state where you literally cannot conceive of a price, not just one where you refuse to risk capital on it.

  **Claim 3: Some probabilities cannot be ordered (Incommensurability).**
  *   **Market Translation:** **Orthogonal Risk Buckets.**
  *   **The Logic:** You have a long vega position in Tech options and a long spread position in Illiquid Credit. You cannot say definitively which position is "riskier" or has a "higher probability of profit" because the evidence driving them (vol regime vs. credit cycle) is incommensurable. There is no common denominator to rank them logically without imposing an external metric.
  *   **Smuggling Alert:** Your risk system *forces* an ordering (VaR, Stress PnL, Capital Charge). It translates everything into USD. Keynes says the *logical relation* itself might not support ordering. By using USD as the numeraire, you are artificially imposing commensurability where the underlying evidence doesn't support it.

  **Claim 4: Weight of Argument (amount of evidence) is distinct from Probability.**
  *   **Market Translation:** **Book Depth / Liquidity behind the Mark.**
  *   **The Logic:** Probability is where you mark the book (the price). Weight is how many lots traded to get there. You can have a mark of $100 based on one print (low weight) or a mark of $100 based on 10,000 lots traded (high weight). The price (probability) can remain stable while the weight increases as you gather more evidence (prints).
  *   **Smuggling Alert:** Keynes treats Weight as a logical property of the argument. In markets, "depth" is a liquidity property. You can have high weight (lots of evidence) that is all wrong (e.g., a wash trade or a fat finger). Keynes assumes evidence is relevant and truthful; your tape includes noise and manipulation.

  ---

  ### 2. Pressure Testing Your Specific Questions

  **(1) Is going indicative/non-firm actually non-numerical probability, or just a wide spread?**

  It is **a wide spread with a shrug**, not true non-numerical probability.

  Here is the friction: When you widen your spread from 10 cents to 5 dollars, you are still assigning a numerical range. You are saying, "The probability distribution is very wide." When you go indicative, you are saying, "The probability distribution is numerical, but I refuse to show you the variance because I fear adverse selection."

  Keynes's non-numerical probability is an epistemological claim: *The relation between evidence and hypothesis does not support a number.*
  Your indicative quote is a risk management claim: *The relation between evidence and hypothesis supports a number, but the cost of being wrong (inventory risk) exceeds the fee for being right.*

  Because you have a **continuous quoting obligation**, you are structurally forbidden from experiencing Keynesian non-numerical probability. You are paid to manufacture numbers even when the logic doesn't support them. You are forcing a coefficient onto a relation that Keynes would say is coefficient-resistant.

  **(2) Does your risk system (single mark, total ordering) prove Keynes wrong?**

  No. It proves your system answers a **different question**.

  *   **Keynes asks:** "What is the logical degree of belief warranted by evidence $E$?"
  *   **Your Risk System asks:** "What is the capital charge required to hold this position overnight?"

  Your risk system *must* rank every instrument against every other one because capital is fungible. It needs to know whether to allocate margin to the Tech Call or the Credit Name. It imposes a **decision metric** (USD PnL) onto an **epistemic state** (uncertainty).

  Keynes would argue your risk system is lying to you. It tells you that Position A (VaR $1M) is "greater than" Position B (VaR $0.5M). Keynes would say, "If the evidence for A is thin (low weight) and the evidence for B is thick (high weight), you cannot logically compare them merely by their potential loss."

  The fact that your system forces a rank doesn't invalidate Keynes; it highlights that your system is designed for **action** (clearing trades, posting margin), not **truth** (assessing logical relations). You are smuggling "capacity to bear loss" into "degree of certainty."

  ---

  ### 3. Residue Report

  **What Survived Intact:**
  *   **Weight of Argument:** The distinction between "where the market is" (Price/Probability) and "how much volume supported that move" (Weight) translates remarkably well. This is the one concept where your desk vocabulary is richer than standard frequentist statistics. You intuitively understand that a mark on zero volume is epistemologically weaker than a mark on heavy volume, even if the price is identical.

  **What Survived in Distorted Form:**
  *   **Non-Numerical Probability:** Distorted into "Wide Spreads" or "Indicative Quotes." You cannot truly represent the absence of a number because your business model requires numerical output. You convert "unknown" into "high variance."
  *   **Objective Logical Relation:** Distorted into "Model Theo." You treat the model output as objective logic, but the model parameters are subjective choices. You have smuggled "consensus on model inputs" in place of "logical necessity."

  **What Has No Expression At All:**
  *   **True Incommensurability:** There is no field in your OMS or risk system for "These two risks cannot be compared." Everything must be netted, margined, and marked-to-market in a single currency. The concept that two propositions might be logically unrelated in a way that prevents ranking is erased by the numeraire (USD).
  *   **Suspension of Judgment:** Keynes allows for withholding judgment when evidence is insufficient. Your continuous quoting obligation forbids this. You are penalized for epistemological honesty.

  **Verdict on the Residue:**
  This is **not a gap in your vocabulary**; it is a **category error in the application**.

  Keynes is writing about **Epistemology** (what can be known). You are working in **Pragmatics** (what can be priced).
  The residue exists because markets are mechanisms for *resolving* uncertainty into price, whereas Keynes is interested in *describing* uncertainty before it is resolved.

  When you force Keynes into your vocabulary, you turn "I do not know" into "I know the volatility is high." That is not a failure of translation; it is the definition of your job. You are paid to pretend that non-numerical probabilities are numerical ones so that clients can trade. If you truly adopted Keynes's view, you would go dark on illiquid names permanently. Since you can't, your framework necessarily cannibalizes his distinctions to keep the book open.

  **Final Note on Smuggling:**
  The biggest smuggling operation here is **Risk Premium**. Keynes's probability is about truth. Your quotes include a margin for error, inventory cost, and funding. When you look at your "mid" and think "this is the probability," you are smuggling a profit margin into a truth claim. Your mid is not $P(h|e)$; it is $P(h|e) + \text{Spread}/2 + \text{Inventory Bias}$. You cannot separate the logic from the commerce, which means you can never fully access Keynes's "pure" logical relation.
