  *Final Polish:* Ensure the "Smuggling" sections are distinct and critical. Make sure the Residue Report is sharp.

  (One more thought on Claim 4): Weight of Argument. In markets, if I have more evidence (more prints), my spread tightens. But Keynes says Weight can go up while Probability stays the same (or even becomes less certain). Actually, Keynes says Weight increases with *more evidence*, regardless of the probability value. In markets, more evidence usually tightens the spread (higher confidence). I need to make sure I capture that distinction. Weight is about the *substance* of the evidence, not just the resulting volatility.

