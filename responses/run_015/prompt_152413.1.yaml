  The tree should be built from concrete yes/no claims, not labels. Start with whether different moral theories can be weighed on a shared scale at all. Then branch on: (1) whether you treat your credences like betting odds and maximize expected moral value; (2) whether you adopt a single meta-rule (e.g., always act according to the theory you find most plausible, regardless of stakes); (3) whether you permit "split" actions that partially satisfy multiple theories simultaneously; and (4) whether choices that determine who will exist in the future are assessed differently from choices among already-existing people. Each leaf should name the position (or mark it "unnamed/unoccupied"), state its most awkward commitment in one sentence, and flag occupancy. Note any logical answer-combinations that have no defenders, with a brief diagnosis (incoherent, unexplored, or merely unpopular). Finally, flag any pair of leaves your tree cannot genuinely separate. Phrase every node so someone could answer it without already knowing the technical vocabulary.
