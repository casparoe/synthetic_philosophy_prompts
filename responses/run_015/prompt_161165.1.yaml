  In your old laser lab, consider a pump-probe experiment measuring molecular vibrational relaxation. For simple photon counting, the nominalist paraphrase works cleanly: "Detector region A fired before region B" replaces "Time $t_1 < t_2$," trading numbers for concrete spatiotemporal relations without loss. But when you reconstruct the wavepacket using Fourier synthesis, the theory demands continuous complex amplitudes over a time continuum. The platonist treats these as abstract objects modeling a potentially discrete physical reality; the paraphrasing nominalist, refusing abstracta, must assert that spacetime regions literally possess intrinsic comparative relations dense enough to instantiate the real continuum, forcing them to posit a physically continuous spacetime manifold even if the underlying physics (e.g., quantum gravity or atomic lattices) suggests discreteness. Thus, the nominalist ends up with a bloated *physical* ontology (a guaranteed concrete continuum) compared to the platonist (who can accept discrete concreta plus abstract math), while the platonist's epistemic problem remains untouched—they still owe a story about reliability regarding abstracta, though this case shifts the nominalist's burden to reliability about the physical continuum's infinite divisibility.

  **Walkthrough**

  **The Views:**
  *   **The Platonist** holds that the continuous functions in your Fourier synthesis refer to abstract objects. They can remain agnostic about whether physical spacetime is truly continuous or discrete; the math is a true description of abstracta that *approximates* the concrete world. Their ontology is Mixed (Concrete + Abstract).
  *   **The Paraphrasing Nominalist** holds that the math must be rewritten to quantify only over concrete spacetime regions. For the rewritten sentences to be *true*, the concrete regions must actually support the structure of the real numbers (e.g., infinite divisibility, density). Their ontology is Concrete Only, but the Concrete part is structurally richer.

  **The Feature Doing the Work:**
  The single feature is **Representational Density** (or the Continuum Requirement). The mathematical theory utilizes a continuum (Real numbers). To nominalize this without fiction, the concrete world must be isomorphic to that continuum. If the physical world is actually granular (as chemistry often suggests with atoms, or physics with Planck scales), the nominalist must posit *extra* concrete structure (continuous fields/regions) to ground the math, whereas the platonist does not.

  **Removing the Feature:**
  If you remove the continuum requirement—i.e., if the successful theory were purely finite and discrete (like a cellular automaton or simple integer counting)—the nominalist wins on parsimony. They would have fewer objects (no abstracta) and no need to bloat the concrete ontology to match mathematical structure. This collapses back into the ordinary indispensability argument where nominalism looks austere.

  **The Nominalist Counter-Attack:**
  A smart nominalist will reply: "That's exactly why I'm a **fictionalist** and not a paraphraser." They will concede that the paraphrase fails for continuum physics and instead argue that talk of continuous fields is useful fiction; only the discrete concrete observables are real.
  *   **Evaluation:** This escape saves their concrete parsimony (no need for physical continuity) but sacrifices the literal truth of scientific theories. They must now explain why false theories (those invoking continua) are so predictively reliable, which reintroduces a problem structurally similar to the platonist's epistemic hurdle: how do we have reliable access to truths via fictions? Alternatively, they might argue "The extra concrete structure was already implied by the physics," claiming that standard QFT *requires* continuous fields anyway. This is a strong defense, but it concedes that nominalism isn't *inherently* more parsimonious about the physical world; it merely shifts the cost from abstract to concrete.
