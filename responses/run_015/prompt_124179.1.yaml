answer: |-
  You err in supposing that material prosperity constitutes the common good, or that my caution is mere softness. The common good is justice and virtue, not merely full hospitals and flowing coin; a ruler who secures his own power against the law treats the community as his instrument, which is the essence of tyranny. Yet you leap too quickly from the absence of legal remedy to the license of private violence. I have written clearly that to kill a tyrant is not meritorious unless one acts by public authority. Sedition is a mortal sin because it fractures the unity of the multitude, and often the remedy of rebellion brings greater tyranny than the disease endured. Do not mistake my insistence on order for approval of his sin; God judges the tyrant, but private men must not usurp the sword of justice.

  Nor is your dilemma complete. You offer two paths: declare him a usurper or deny he is a tyrant. I take neither. He remains a ruler by title, for the multitude conferred it, however much he abuses it now. But if he has dismantled the very means by which the community might correct him, he violates the pact by which he rules. The right to depose him returns to the community *as a body*, or to its magnates acting publicly, not to private individuals stabbing in the dark. If the procedure is rigged, the will of the community is not truly expressed by it. Yet even then, action must be taken lest the remedy be worse than the evil. You claim there is no superior left; I say there is always God, and often the leading men of the realm who hold a share of public care. To suggest otherwise is to despair of divine providence and invite chaos.
