answer: |-
  Mrs. G, a 62-year-old patient three days post-stroke affecting the right insula and anterior cingulate, sits in the recovery room for a bedside sensory assessment. When the neurologist applies a calibrated pinprick to her forearm, she looks up from her magazine, rates the sensation a 2 out of 10, describes it as "dull pressure," and immediately returns to reading, remarking casually that there is no need to treat it. She exhibits no withdrawal, no facial grimacing, and explicitly states she does not want the sensation to cease, confirming she is not bothered by it. However, when asked to hold a six-digit number in mind while the pressure is applied, she drops the digits instantly. She does not express frustration or anxiety about this failure, nor does she worry about what it implies for her recovery, but reports phenomenologically: "The number doesn't fit. The pressure isn't loud, but it is wide; it occupies the entire surface where I would put the numbers. I cannot make room for them." She confirms that without the pressure, the numbers fit easily, and with the pressure, no other conscious content can be sustained, even though she does not mind the pressure itself.

  ***

  **The Check**

  **Verdicts and Reasoning**
  *   **The Intensity Account:** Returns a verdict of **negligible badness**. The account ties disvalue to the magnitude of the sensory-discriminative component. Mrs. G reports a 2/10 intensity, describing it as "dull." On a linear scale of sensory magnitude, this is near the floor; therefore, the intrinsic disvalue is minimal.
  *   **The Aversion Account:** Returns a verdict of **negligible badness**. This account ties disvalue to the motivational drive to cease the experience. Mrs. G exhibits no avoidance behavior, refuses treatment, and reports she does not want the sensation to stop. Since the conative attitude of "minding" is absent, the pain possesses no affective disvalue.
  *   **The Occupancy Account:** Returns a verdict of **substantial badness**. This account ties disvalue to the involuntary conscription of limited conscious workspace. Mrs. G reports that the pain monopolizes her entire conscious capacity ("occupies the entire surface"), rendering her unable to sustain any other thought (the six-digit number). The total loss of cognitive freedom during the episode constitutes a high degree of disvalue, regardless of her attitude toward it.

  **The Work-Doing Feature**
  The single feature doing the work is the **dissociation between sensory magnitude/affective valence and cognitive footprint**. Specifically, it is the report that the pain is phenomenologically "wide" enough to exclude all other content despite being sensory "quiet" and affectively "neutral."

  **Collapsing the Case**
  If we remove this feature—specifically, if Mrs. G reports that she *can* hold the six-digit number in mind while the pressure is applied—the case collapses into standard, unremarkable asymbolia. In that scenario, the pain is low intensity (Intensity Account: not bad), unaversive (Aversion Account: not bad), and fails to crowd out other mental content (Occupancy Account: not bad). All three accounts would then converge on the verdict that the episode is not bad for the subject.

  **The Strongest Objection and Reply**
  **Objection:** An advocate of the Intensity or Aversion account will argue that the Occupancy theorist has confused a *causal* fact with a *normative* one. Mere crowding of attention is neutral; a puzzle can occupy my whole mind without being bad. If Mrs. G does not *mind* that her mind is full of pain (as evidenced by her lack of frustration), then the occupancy is not bad *for her*. To call it bad is to impose an external standard of mental liberty that the subject herself rejects.

  **Occupancy Theorist's Reply:** The reply is that conscious agency is a constitutive good, and its involuntary suspension is an intrinsic harm, even if the subject fails to register the loss. The badness lies in the *restriction of capacity*, not the *frustration of desire*. Just as a sedated patient is harmed by the loss of agency even if they do not mind it at the time, Mrs. G is harmed by the conscription of her workspace.

  **The Consequentialist Worry:** This reply risks reinstating the forbidden consequentialist reasoning. If the badness of occupancy is that it "prevents her from thinking," one might argue this is only bad because of what she *could have done* (the downstream consequence of lost thought). To avoid this, the Occupancy theorist must insist that the badness is not the *failure to think specific thoughts* (a consequence), but the *state of being unable to think* (a constitutive restriction). The disvalue is the immediate reduction of the subject's ontological freedom in that moment, not the instrumental loss of cognitive products. If the theorist slips into arguing that she "missed out" on the numbers, they have violated the constraint against downstream harms; they must argue that the *crowding itself* is the injury.
