answer: |-
  # JOINT STATEMENT ON POPULATION AXIOLOGY AND THE REPUGNANT CONCLUSION

  **Date:** October 26, 2023
  **Signatories:**
  *   **Representative A:** Critical-Level Totalism (CLT)
  *   **Representative B:** Range-Sensitive Anti-Totalism (RSAT)

  **Preamble:**
  This document records the outcomes of an adversarial collaboration between proponents of Critical-Level Totalism and Range-Sensitive Anti-Totalism. The objective was to isolate points of convergence regarding the Repugnant Conclusion and population axiology, and to precisely map the remaining substantive divergences. The definitions below are stipulative for the purpose of this collaboration.

  **Definitions:**
  1.  **Critical-Level Totalism (CLT):** The view that the value of a population $V$ is the sum over all lives $i$ of $\max(0, w_i - c)$, where $w_i$ is the welfare of life $i$ and $c$ is a fixed, positive critical level. CLT asserts this formulation avoids the Repugnant Conclusion because lives with $w_i \leq c$ contribute zero value, preventing vast numbers of low-welfare lives from outweighing high-welfare lives.
  2.  **Range-Sensitive Anti-Totalism (RSAT):** The view that rejects sharp critical thresholds. RSAT holds that the marginal value of adding a life is a continuous, strictly decreasing function of the existing population's average welfare, asymptotically approaching zero. RSAT insists moral evaluation must be continuous in individual welfare and maintains that the Non-Identity Problem blocks purely impersonal justifications for bringing people into existence.

  ---

  ## PART I: AGREED CLAIMS

  The undersigned agree to the following formal and normative claims:

  1.  **Formal Structure of the Repugnant Conclusion:** Under Pure Total Utilitarianism (where $V = \sum w_i$), for any World A with a small population of very high welfare, there exists a World Z with a sufficiently large population of lives barely worth living such that $V(Z) > V(A)$. Both parties accept this is a valid mathematical consequence of Pure Totalism.
  2.  **Normative Rejection:** Both parties agree that the ranking $Z > A$ is intuitively unacceptable and that an adequate axiology must rank $A > Z$. Avoiding the Repugnant Conclusion is a necessary condition for a viable population ethic.
  3.  **Systematic Divergence:** Both parties agree that Total Principles (summing) and Average Principles (mean welfare) diverge systematically under population scaling. Specifically, as $N \to \infty$, total value can increase while average welfare decreases, creating the tension that generates the Repugnant Conclusion.
  4.  **Mathematics of Discontinuity:** Both parties agree on the mathematical fact that aggregation rules employing discontinuous functions (such as the $\max(0, \dots)$ operator in CLT) produce threshold effects where arbitrarily small changes in input welfare can result in discrete jumps in output value.
  5.  **Constraints of the Non-Identity Problem:** Both parties agree that the Non-Identity Problem (NIP) constrains person-affecting justifications. Specifically, both agree that one cannot claim a specific individual is harmed by being brought into existence with a worth-living life if their alternative was non-existence. (Note: The parties disagree on whether this constraint invalidates impersonal theories or merely restricts person-affecting rhetoric).

  ---

  ## PART II: DISAGREEMENTS TABLE

  The following table isolates the substantive cruxes where the parties diverge. Predictions were recorded prior to the finalization of this document.

  | Crux | Critical-Level Totalist (CLT) Formulation | Range-Sensitive Anti-Totalist (RSAT) Formulation | Shared Test / Argument & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Interpolation Crux**<br>(Continuity at Boundary) | Moral value is permitted to be discontinuous at the critical level $c$. A life at $c + \varepsilon$ has positive moral weight; a life at $c - \varepsilon$ has zero moral weight. This discontinuity is a feature, not a bug, as it blocks the Repugnant Conclusion. | Moral evaluation must be continuous in individual welfare. There can be no moral "cliff" where an infinitesimal drop in welfare reduces a life's contribution from positive to zero. Continuity is required for rational coherence. | **Test:** *Epsilon-Shift Scenario.*<br>World A: One person at 100, one at $c - \varepsilon$.<br>World B: One person at 100, one at $c + \varepsilon$.<br>**CLT Prediction:** As $\varepsilon \to 0$, the value difference $V(B) - V(A)$ remains discontinuous (a fixed jump).<br>**RSAT Prediction:** As $\varepsilon \to 0$, the value difference approaches zero continuously. |
  | **2. The Density Crux**<br>(Stability near Threshold) | Aggregation is stable regardless of welfare distribution below $c$. Lives below the critical level do not contribute to the sum, rendering the variance of low-welfare lives morally irrelevant. | Aggregation is sensitive to the distribution of welfare relative to the average. Because the weighting function depends on average welfare, shifting the density of lives near the critical range alters the weight of all added lives. | **Test:** *Large Stochastic Population.*<br>$10^9$ lives with welfare drawn from $N(\mu, \sigma^2)$, where $\mu \approx c$.<br>**CLT Prediction:** Value is computable and stable; variance $\sigma^2$ does not alter the truncation point. Small shifts in $\mu$ across $c$ cause step-changes in total value.<br>**RSAT Prediction:** Value is continuous but highly sensitive to $\mu$. As $\mu$ shifts, the weighting function for *all* lives changes, creating global instability in valuation without discrete jumps. |
  | **3. The Justification Crux**<br>(Impersonal vs. Person-Affecting) | Avoiding the Repugnant Conclusion requires an impersonal calculus modified by a critical level. We are justified in creating new lives if they increase the critical-level-adjusted total, regardless of identity. | Avoiding the Repugnant Conclusion requires a person-affecting reason tied to each added life. An impersonal calculus is insufficient because the Non-Identity Problem blocks comparisons between disjoint sets of people without a beneficiary-specific link. | **Test:** *Policy Choice.*<br>Policy X creates new people with $w > c$. Policy Y improves existing people.<br>**CLT Prediction:** If $\sum \max(0, w_{new} - c) > \Delta w_{existing}$, X is obligatory. Impersonal sum suffices.<br>**RSAT Prediction:** X is only permissible if the new people can be said to benefit *relative to a baseline* that respects identity constraints. Impersonal sum is insufficient justification. |

  ---

  ## PART III: CONCEPTUAL NOTES AND ADJUDICATOR OBSERVATIONS

  *The following notes identify liberties taken with standard population-axiology literature and contested readings utilized in this collaboration.*

  1.  **Terminological Liberty (RSAT):** The label "Range-Sensitive Anti-Totalist" is constructed for this collaboration. In standard literature, the position described (marginal value is a continuous, decreasing function of average welfare) closely resembles **Variable Critical Level Utilitarianism** (where the critical level rises with average welfare) or **Number-Sensitive Average Utilitarianism**. The term "Anti-Totalist" is used here to denote the rejection of the *fixed* sum aggregation rule, not necessarily the rejection of all aggregative methods.
  2.  **Contested Reading of the Non-Identity Problem:** In Part I, Claim 5, and Part II, Crux 3, the RSAT position asserts that the Non-Identity Problem (NIP) blocks *impersonal* justifications. This inverts the standard Parfitian interpretation. Standard analysis suggests NIP undermines *Person-Affecting Views* (because no existing person is harmed), thereby forcing theorists toward *Impersonal Views* (like Totalism). RSAT's claim that NIP blocks impersonal justifications relies on a "Same-Number Quality Constraint" or a strong interpretation of the "No-Difference View," arguing that we cannot compare the value of disjoint populations impersonally. This is a contested meta-ethical stance, not a logical consequence of NIP itself.
  3.  **Continuity Constraints:** The CLT position explicitly embraces discontinuity ($\max(0, w-c)$). Standard critical-level views often allow negative values for lives below $c$ (to avoid the Sadistic Conclusion), which preserves continuity but risks other counterintuitive results. The CLT definition used here (truncated at zero) is chosen specifically to highlight the discontinuity crux. This is a specific variant of Critical-Level Utilitarianism, not the only one.
  4.  **False Symmetry Warning:** While this document presents the views as symmetrical competitors, there is an asymmetry in burden of proof. CLT accepts a mathematical discontinuity to save a normative intuition (avoiding RC). RSAT accepts a complex, context-dependent weighting function to save a mathematical intuition (continuity). Whether "mathematical continuity" is a moral requirement is itself a substantive philosophical disagreement, not merely a technical one.

  **Signed:**

  _________________________
  *Representative, Critical-Level Totalism*

  _________________________
  *Representative, Range-Sensitive Anti-Totalism*
