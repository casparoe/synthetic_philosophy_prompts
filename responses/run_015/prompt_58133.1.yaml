answer: |-
  You have correctly identified that your residents are conflating two distinct economic structures. While both situations result in a suboptimal outcome for the group, they operate on opposite mechanical principles. In economics, the boundary between them is sharp, defined by the properties of the resource in question.

  Here is the distinction between the two configurations, the edge that separates them, and a proposal for terminology to help you communicate the second pattern effectively.

  ### 1. The Laundry Machines: Common-Pool Resource Depletion
  **Established Concept:** *The Tragedy of the Commons* (specifically regarding Common-Pool Resources).

  **The Mechanism:**
  This is a problem of **subtractability**. The resource (the machine's operational lifespan) is **rivalrous**. When Resident A runs a half-empty load, they consume a portion of the machine's total life cycles. That specific portion of value is no longer available for Resident B. The cost of A's action is externalized to the group in the form of earlier replacement costs.

  **Why it fits:**
  *   **Rivalry:** My use physically degrades the asset for you.
  *   **Incentive:** The individual gain (clean clothes now) is private, while the cost (machine wear) is shared. This incentivizes over-consumption.
  *   **Outcome:** Resource depletion.

  ### 2. The Hallway Lighting: Public Goods Provision Failure
  **Established Concept:** *The Public Goods Provision Problem* (often colloquially called the Free-Rider Problem).

  **The Mechanism:**
  This is a problem of **additivity**. The resource (illumination) is **non-rivalrous**. If Resident A contributes \$50 toward the lighting, it does not diminish the amount of light available for Resident B. In fact, A's contribution *increases* the benefit for B. However, because the light is **non-excludable** (you cannot prevent a non-payer from walking down the lit hallway), residents have an incentive to wait for others to pay while they enjoy the benefit for free.

  **Why it fits:**
  *   **Non-Rivalry:** My enjoyment of the light does not dim your light.
  *   **Incentive:** The individual cost (contributing money) is private, while the benefit (a lit hallway) is shared. This incentivizes under-contribution.
  *   **Outcome:** Resource starvation (the good is never created).

  ### The Boundary: Rivalry and Excludability
  The edge between these two problems is not about "greed" or "cooperation"; it is defined by the physical nature of the resource. Economists use a matrix of **Rivalry** and **Excludability** to draw the line:

  | Feature | Laundry Machines (Case 1) | Hallway Lighting (Case 2) |
  | :--- | :--- | :--- |
  | **Rivalry** | **High.** Use depletes the asset. | **None.** Use does not deplete the asset. |
  | **Excludability** | **Medium.** Access can be restricted, but *wear* cannot be assigned to specific users easily. | **Low.** Once installed, non-payers cannot be blocked from the benefit. |
  | **Flow of Value** | **Extraction.** Residents take value *out* of the common pool. | **Contribution.** Residents must put value *into* the common pool. |
  | **Marginal Cost** | **Positive.** Every load adds wear and tear. | **Zero.** One more person enjoying the light costs nothing. |

  **The Hard Edge:**
  The boundary lies at **Rivalry**.
  *   If your action reduces the quantity or quality of the resource available to others, you are in a **Common-Pool Resource** scenario (Tragedy of the Commons).
  *   If your action does not reduce the availability to others, but your *failure to act* prevents the resource from existing at all, you are in a **Public Good** scenario.

  ### Terminology for the Second Pattern
  You asked for a term for the second pattern that distinguishes it from simple "free-riding."

  **The Limitation of "Free-Rider Problem":**
  "Free-riding" describes the *behavior* of the individual (the moral hazard). It implies that the failure is due to residents being unwilling to pay. However, in game theory, the failure is often structural; even altruistic residents may withhold contribution if they believe others won't, fearing their money will be wasted. "Free-riding" blames the actor; it does not name the systemic configuration.

  **The Established Term:**
  The precise economic term is the **Public Goods Provision Dilemma**. This describes the *structural outcome* rather than the individual behavior.

  **A Proposed Symmetrical Term:**
  However, since you are communicating with residents who already understand the phrase "Tragedy of the Commons," using a dry term like "Provision Dilemma" may not resonate. To create a symmetrical understanding that highlights the *structural* nature of the failure (rather than blaming individuals), I propose you use the term:

  #### **The Tragedy of Non-Provision**

  **Definition:**
  A structural equilibrium in which a beneficial, non-rivalrous resource fails to be created, not necessarily because individuals are unwilling to contribute, but because the *structure of incentives* makes contribution irrational without assurance of reciprocal action.

  **How this separates it from simple Free-Riding:**
  *   **Free-Riding** implies a moral failing: "I want it for free."
  *   **Tragedy of Non-Provision** implies a coordination failure: "I am willing to pay, but not if I am the only one."

  **Why use this distinction?**
  In your laundry case (Tragedy of the Commons), the solution is usually **restriction** (limits on loads, fees per use) to stop the taking.
  In your lighting case (Tragedy of Non-Provision), the solution is **assurance** (matching grants, binding pledges, mandatory dues) to encourage the giving.

  By telling your residents, *"The laundry is a Tragedy of the Commons, so we must restrict use. The lighting is a Tragedy of Non-Provision, so we must guarantee contribution,"* you clarify that the solutions must be opposites: one requires capping demand, the other requires securing supply.
