          3.  Address Toynbee's "Challenge and Response" (is it compatible with linear tech accumulation?).
          4.  Identify exactly which reading the colleague *must* defend for her dismissal of AI forecasting to hold.
      *   **Tone/Style:** Academic, precise, analytical, suitable for a graduate seminar context.

  2.  **Deconstruct the Colleague's Argument:**
