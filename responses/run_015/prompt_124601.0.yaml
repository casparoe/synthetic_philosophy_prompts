  2.  **Deconstruct the Philosophy (Jainism):**
      *   *Anekāntavāda:* Reality is complex; no single proposition captures it entirely.
      *   *Nayavāda:* Theory of partial standpoints (*nayas*). Each is valid *within its context* but false if taken as the whole truth.
      *   *Syādvāda:* Theory of conditioned predication ("in some sense," "maybe"). It's not skepticism; it's precision.
      *   *Kevala Jnana:* Omniscience. The Jain system *is* vertical. There *is* a truth, and the omniscient being sees all *nayas* simultaneously without contradiction.
      *   *Ethical Goal:* Reducing *himsa* (violence) caused by dogmatic attachment to one's own view (*ekānta*).

  3.  **Deconstruct the Film (*Rashomon*):**
      *   **Structure:** Four accounts (Bandit, Wife, Husband via Medium, Woodcutter). Plus the framing device (Gate).
      *   **The "Truth":** There is likely an objective event (the death), but the film deliberately obscures it.
