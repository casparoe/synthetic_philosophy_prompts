          *   *Conflict:* Jainism says partial views are *true in their context*. The film suggests the views are *lies* motivated by shame. This is a crucial divergence. The Bandit isn't offering a *naya* (a partial perspective on the real); he's offering a fabrication to boost his ego.
          *   *Resolution:* The Jain lens works best if we treat the *nayas* not as the lies themselves, but as the *psychological realities* of the narrators. But strictly speaking, Jain epistemology is about ontology (the nature of reality), not just psychology.
      *   *The "One-Sided Error":* This fits well. The characters suffer because they cling to their self-image (*ekānta*). The Bandit *must* be a great warrior; the Wife *must* be a virtuous victim or a fierce avenger; the Husband *must* be an honorable suicide. Their suffering comes from the rigidity of these views.
