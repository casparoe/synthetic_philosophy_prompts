      *   *Did I address the colleague's rhetorical move?* Yes, need to label it as a normative ideal vs. descriptive reality.
      *   *Is the tautology charge addressed?* Yes, by explaining that private info normally causes divergence, so convergence requires a specific structural reason (the meet of partitions).

