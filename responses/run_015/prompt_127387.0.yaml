answer: |-
  The rain blurred the window of the flat, matching the smear of sweat on Nadia's forehead. She was forty-three, lungs burning from a ten-mile run, when she opened the NHS Advance Directive portal. She didn't want to be saved if saving meant diminishment. She dragged the sliders across the screen. Pain reports: 90. Religious conviction: 0. Claims of happiness: 40.

  In the notes box, her fingers hovered, then struck the keys hard. *If I turn into someone who's content with a small quiet life, that isn't me getting what I wanted, that's me being made smaller.* She uploaded it. The confirmation chime sounded like a finish-line bell.

  Thirty-one years later, the bell was real. It tolled from the steeple of St. Jude's, vibrating through the damp air of the care home garden. Nadia, seventy-four, sat on a bench, her hands folded neatly in the lap of a wool cardigan. She looked placid. Bill, her partner of three years, was buttoning her coat.

  "Ready, love?" Bill asked.

  Nadia smiled. It was a soft, empty smile. "Yes. The hymns are lovely."

  Ruth stepped out from the shelter of the porch, tablet in hand. The device buzzed. A geo-fence alert. *Subject leaving designated zone. Activity conflicts with Advance Directive Clause 4.*

  "Dad," Ruth said, using the title Bill had earned through care, not blood. "You can't take her."

  Bill didn't turn around. "She wants to go, Ruth. She sings. She knows the words."

  "That's the pathology talking. You know the weighting." Ruth tapped the screen, bringing up the document. "Zero weight on religious conviction. She explicitly refused this. She thought serenity was defeat."

  "She thinks peace is a gift now," Bill said, finally facing her. His eyes were tired. "Look at her. Is she suffering? Is she frightened?"

  Nadia looked up, eyes clouded with the milky haze of early Alzheimer's. "The light is nice in there," she said.

  "It's not about the light," Ruth said, her voice tight. "It's about who she was. We have to invoke the symmetry condition. If she can't explain why she banned it, the ban stands."

  The assessment room smelled of antiseptic and old tea. Dr. Shah sat behind a desk stacked with files. Nadia sat opposite, picking at a loose thread on her sleeve. Ruth stood in the corner, arms crossed.

  "Mrs. Gable," Dr. Shah said gently. "You wish to overturn the clause regarding religious attendance. To do that, you need to satisfy the symmetry condition. Can you tell me why your earlier self wrote that restriction?"

  Nadia stopped picking at the thread. She looked at her hands. "She was frightened," she said.

  "Of what?"

  "Of stopping." Nadia's voice was thin, but the words were distinct. "She thought... if you aren't struggling, you aren't alive. She thought peace was surrender."

  Ruth leaned forward. That was the language. That was the lexicon.

  "Did she feel she was being made smaller?" Dr. Shah asked, consulting the notes on his screen.

  "Yes," Nadia said. "She said contentment was... being made smaller."

  Dr. Shah looked up, pen hovering over the form. He looked at Nadia, then at Ruth. The clinical gaze was impartial, weighing the coherence against the capacity. Nadia stared back, calm. There was no spark of recognition in her eyes, no flash of the runner who had once pounded the pavement to outrun mortality. She recited the philosophy of her youth like a prayer she'd been taught that morning. Had she reconstructed the logic from the fragments of her own mind, or had Bill read the directive to her so many times that the words had lodged in the decay?

  "She understands the reasoning," Dr. Shah said, mostly to the room. "The symmetry condition appears met. The earlier self's logic is articulated."

  "But does she believe it?" Ruth asked. The question slipped out before she could stop it.

  "The condition requires statement, not belief," Dr. Shah said. He slid the authorization form toward Ruth. As the proxy, the final burden of execution fell to her when capacity was fluctuating. "If you sign here, you acknowledge the clause is overturned. She may attend services."

  Ruth looked at her mother. Nadia was watching a moth beat against the window lamp, fascinated by the dull thud against the glass. She looked safe. She looked small.

  If Ruth signed, she allowed the church. She accepted that the woman on the bench was the valid entity, that the peace was real, not just a chemical smoothing of the edges. It would be kindness. It would be a betrayal of the woman who had run until her lungs burned.

  If she didn't sign, the directive held. No church. No hymns. Nadia would sit in the garden, perhaps confused, perhaps angry, protected from a sedation of the soul she had once despised. It would be loyalty. It would be cruelty.

  Dr. Shah waited. Bill stood by the door, hands in his pockets, not pleading, just waiting.

  Ruth picked up the pen. The plastic felt cheap. She looked at the line where her signature would validate the overturning of her mother's deepest fear. She thought of the rain on the flat window, thirty years ago. She thought of the cardigan in the garden.

  She signed.

  She pushed the form across the desk. Dr. Shah stamped it. The sound was final, like a gate closing.

  "Thank you," Bill said softly. He took Nadia's arm. "Come on, love. We'll be late."

  Nadia stood up. She didn't look at Ruth. She walked toward the door, shuffling slightly, following the man who held her coat. Ruth stayed in the chair. She watched them leave, watching her mother walk willingly into the quiet life she had sworn to fight, listening to the silence where the running used to be.
