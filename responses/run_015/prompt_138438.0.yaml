answer: |-
  ### Criteria Weighting

  To determine this priority list, I have weighted four criteria based on your constraint of six months and your goal of shifting imaginative possibility rather than winning arguments.

  *   **Importance (40%):** Direct impact on the reader's imaginative sense of housing policy.
  *   **Dependency (30%):** How many other artistic decisions rely on this choice (upstream nature).
  *   **Tractability (20%):** Feasibility of execution within a major revision using novelistic tools.
  *   **Neglectedness (10%):** Likelihood that this element is overlooked in favor of plot or thesis.

  Importance and Dependency carry the most weight because you cannot afford to spend time on changes that do not directly serve the goal or that require rewriting everything else later.

  ### Strategic Trade-off

  I am deliberately deprioritizing the question: **"What is the theoretically correct policy solution?"**
  Philosophically, ensuring your book aligns with a specific, defensible housing theory is deeper and more rigorous. However, pursuing this leads to Thesis Level work (dialogue, exposition) which triggers resistance in style-focused readers. It risks converting the novel into a tract. By deprioritizing theoretical correctness in favor of *imaginative plausibility*, you avoid preaching. The goal is not to prove a policy works, but to make a different social order feel *livable* and *human*.

  ### Priority Lines of Work

  **1. Interiority and Causality**
  *   **The Question:** Which characters are granted deep interior access, and within their thoughts, are their housing struggles attributed to personal failure or systemic constraint?
  *   **Why Upstream:** This addresses Du Bois's core point about "who counts as a person." If readers only see the interiority of the homeowner and view the tenant externally, the policy imagination remains individualistic. If the tenant's interiority reveals the structural barriers they navigate daily, the reader's sense of causality shifts from moral to political. This decision dictates every scene of conflict.
  *   **Tractability:** High. You can adjust this through scene revision, shifting POV, or deepening free indirect discourse without altering the plot skeleton.
  *   **Concrete Evidence:** Beta readers attributing blame. If they say "he should have worked harder," move this up. If they say "the system was rigged," move this down.

  **2. Resolution and Livability**
  *   **The Question:** Do the plot's resolutions rely on individual exception (luck, genius, charity) or collective/systemic change, and is the resulting stability presented as normal or miraculous?
  *   **Why Upstream:** This defines "what a reasonable social order looks like." If the hero escapes housing insecurity through a unique inheritance, the book argues policy is unnecessary for the deserving. If stability is achieved through mutual aid or policy shift and presented as boringly normal, it expands the reader's sense of the possible. This locks in the ending and the climax.
  *   **Tractability:** Medium. May require restructuring the third act, but does not necessarily demand changing character voices.
  *   **Concrete Evidence:** Reader feedback on the ending. If they call it "utopian" or "unrealistic," you may need to ground it more. If they call it "inevitable," you have succeeded.

  **3. Narrative Authority**
  *   **The Question:** Does the narrative voice present its view of housing as natural law, or as a contested perspective situated within a specific community?
  *   **Why Upstream:** This manages the Reflexive Level and reader trust. If the narration claims omniscient objectivity while presenting a partisan view, it feels like propaganda (pejorative). If it admits its situatedness, it invites the reader into the conspiracy of imagination. This affects tone and narrator reliability throughout.
  *   **Tractability:** Low. Shifting narrative voice is subtle and risks destabilizing the whole manuscript if done heavily late in the process.
  *   **Concrete Evidence:** Passages flagged as "preachy" or "heavy-handed." If readers trust the narrator despite the bias, move this down.

  \answer{1: Interiority and Causality; 2: Resolution and Livability; 3: Narrative Authority}
