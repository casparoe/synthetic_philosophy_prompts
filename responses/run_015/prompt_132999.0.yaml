answer: |-
  ### I. Brainstorming Institutional Practices of "Collapse"

  Before constructing the ontological analysis, I enumerate the concrete institutional mechanisms that encode the "collapse" narrative for the Bronze Age Eastern Mediterranean, the Classic Maya lowlands, and Rapa Nui. These practices operationalize the concept of societal death rather than transformation.

  1.  **Museum Periodization and Gallery Flow:**
      *   **Chronological Walls:** Timelines in major history museums often depict these societies as rising curves that terminate abruptly (e.g., 1200 BCE for the Bronze Age, 900 CE for the Maya). The post-"collapse" periods are either omitted or relegated to small ancillary displays labeled "Decline" or "Post-Classic," implying a derivative status.
      *   **Artifact Selection:** Curatorial focus prioritizes elite goods (palace archives, monumental stelae, moai) over domestic assemblages (pottery shards, agricultural tools) from the subsequent periods. This visually reinforces the idea that when the elite culture ends, the society ends.

  2.  **UNESCO World Heritage Site Descriptions:**
      *   **Statements of Outstanding Universal Value:** These documents frequently justify inscription based on the testimony of a "vanished civilization" or a "mysterious abandonment." For Rapa Nui, the focus is on the statue-building phase; for Maya sites like Tikal, the focus is on the Classic peak.
      *   **Conservation Boundaries:** Protected zones often encompass the monumental core while excluding later, smaller-scale occupation layers surrounding the ruins, physically erasing evidence of continuity from the managed landscape.

  3.  **Textbook Chapter Headings and Curriculum Standards:**
      *   **Categorical Segregation:** History textbooks frequently employ headings such as "The Bronze Age Collapse," "The Mystery of the Maya," or "The Ecocide of Easter Island." These titles frame the historical event as a terminal failure rather than a transition.
      *   **Assessment Questions:** Standardized testing often asks students to identify causes of "collapse" (e.g., drought, invasion), presupposing the collapse itself as an indisputable fact rather than a historiographical interpretation.

  4.  **Archaeological Site Management Plans:**
      *   **Stabilization Priorities:** Conservation funding is disproportionately allocated to preserving the structural integrity of monumental architecture from the "peak" period. Later structures built from spolia or smaller materials are often deemed less significant and left to decay.
      *   **Tourism Narratives:** Guide scripts and audio tours emphasize the "end" of the civilization, often invoking romanticized notions of disappearance, which drives visitor interest more effectively than narratives of adaptation and survival.

  ---

  ### II. Metaphysical Commitments of the Collapse Label

  The institutional practices listed above rely on specific ontological commitments regarding the nature of collective identity. To label these historical trajectories as "collapse" rather than "reorganization" is to make a claim about what constitutes the existence of a society.

  #### 1. The Substantialist View
  The dominant framing presupposes a **substantialist metaphysics of collective identity**. In this view, a society is treated as a substance-like entity possessing an essential nature. For the Bronze Age Eastern Mediterranean, the essence is the Palatial System; for the Classic Maya, it is the Divine Kingship and Monumental Construction; for Rapa Nui, it is the Statuary Cult.
  *   **Implication:** If the essential properties (palaces, stelae, statues) are removed, the entity ceases to exist. The continuity of non-essential properties (language, kinship, domestic architecture, genetic lineage) is ontologically secondary.
  *   **Coherence:** This makes the labeling coherent only if one accepts that political complexity and monumental output are the *essence* of the society, rather than accidental features. The "death" of the society is metaphorically treated as the destruction of this substance.

  #### 2. The Functionalist View
  A secondary commitment is **functionalist**. Here, a society is defined as a system of interlocking roles and institutions maintained to achieve specific ends (e.g., resource redistribution, defense, ritual cohesion).
  *   **Implication:** Persistence depends on the successful performance of these functions. If the institutional roles (king, priest, administrator) are vacated and the system ceases to process energy/information at a specific threshold, the society has "collapsed," even if the human components remain.
  *   **Coherence:** This justifies the collapse designation if the *system* is the unit of analysis, not the *people*. However, institutional practice often conflates the two, speaking of "The Maya disappearing" rather than "The Maya state apparatus dissolving."

  #### 3. The Relational-Processual View
  A **relational-processual ontology** views societies as dynamic networks of practice without diachronic essences. Identity is maintained through the continuous reproduction of relationships, not the retention of a static structure.
  *   **Implication:** Change is constitutive of existence. A shift from monumental construction to village agriculture is a transformation of the network, not a cessation of the society.
  *   **Conflict:** The standard "collapse" label is incoherent under this view unless "collapse" is strictly defined as a reduction in network connectivity. However, heritage usage implies a normative failure, which contradicts the neutral stance of processual ontology.

  #### 4. Evidence vs. Metaphysics
  The archaeological evidence undermines the substantialist reading.
  *   **Bronze Age Eastern Mediterranean:** While palaces burned, rural settlements persisted, and material culture shows continuity in pottery styles and domestic rituals. The "substance" of daily life remained while the "essence" of the state vanished.
  *   **Classic Maya:** The Southern Lowlands saw a cessation of dated stelae, but populations shifted to the Northern Yucatan or maintained village life in the south. Language and kinship structures survived the political shift.
  *   **Rapa Nui:** Statue production ceased, but oral traditions, language, and adaptation to new ecological constraints continued through contact periods.
  *   **Analysis:** This evidence suggests that the "society" (as lived by the majority) persisted. The substantialist view survives only by arbitrarily defining the *elite political structure* as the whole society. The functionalist view can justify the label without contradiction *only if* it rigorously distinguishes between the collapse of the *state system* and the persistence of the *social group*. Institutional practice rarely makes this distinction, thereby slipping back into substantialism (the group died because the system failed).

  ---

  ### III. Presupposition vs. Accommodation

  We must distinguish what the heritage-labeling practice *presupposes* from what it merely *accommodates*.

  **Presupposition:**
  The practice presupposes that **political integration and monumental visibility are necessary conditions for societal identity.** It assumes that a society without a centralized authority or visible mega-architecture is either a different society or a degraded remnant. This is a substantialist commitment: the "True Maya" is the Classic State; anything else is a post-script.

  **Accommodation:**
  Could a relational ontology license "collapse" talk? Yes, but only by redefining the term. A relational view could accommodate the word "collapse" if it were stripped of its connotations of death and failure, used instead to describe a specific topological change in social networks (e.g., "network simplification"). However, current institutional practice does not merely accommodate this; it actively resists it. The marketing of "mystery" and "disappearance" relies on the substantialist notion of loss. A relational ontology forces a wholesale abandonment of the **failure-versus-change distinction** as currently framed. It demands that simplification be viewed as adaptation unless proven otherwise, whereas the substantialist view treats simplification as evidence of death.

  **Concrete Revisions for a Relational-Functional View:**
  If institutions adopted a relational-functional view (where society is a persistent network of practices, and functions are evaluated based on community survival rather than state complexity), the following revisions would be necessary:

  1.  **Curatorial Framing:**
      *   **Display Logic:** Instead of ending exhibits at the point of political discontinuity, galleries must extend timelines to show continuity. For the Maya, exhibits on the Classic period must flow directly into Post-Classic community life, highlighting continuity in ceramics, maize cultivation, and language.
      *   **Labeling:** Replace "Collapse" with "Transformation" or "Reorganization." Artifacts from post-peak periods should be displayed with equal prominence to elite goods, emphasizing domestic resilience over state fragility.

  2.  **Pedagogical Narrative:**
      *   **Curriculum Design:** Textbooks should frame the Bronze Age Eastern Mediterranean not as a dark age following a collapse, but as a period of decentralization and localized innovation.
      *   **Assessment:** Questions should shift from "What caused the collapse?" to "How did communities adapt to the loss of centralized authority?" This shifts the epistemic focus from failure to agency.

  3.  **Conservation Funding Priorities:**
      *   **Site Management:** Funding criteria must value stratigraphic layers representing later, smaller-scale occupation as highly as monumental phases. Conservation plans should protect evidence of post-peak habitation rather than clearing it to expose the "pristine" ruins of the peak.
      *   **Living Heritage:** For sites like Rapa Nui, funding should prioritize the support of indigenous community practices and oral histories that connect modern populations to the past, rather than solely stabilizing stone monuments.

  ---

  ### IV. The Normative Feature Requiring Explicit Supply

  There is one normative feature of the collapse concept that institutional practice cannot reproduce without the implicit substantialist metaphysics, and which scholars must therefore supply explicitly if they wish to retain the term.

  **The Feature:** **The Teleology of Complexity.**

  **Analysis:**
  The substantialist metaphysics implicitly treats large-scale political integration and monumental construction as the *telos* (goal) or default healthy state of a society. Under this view, a move toward smaller-scale, decentralized organization is inherently a move toward "less existence" or "failure." The metaphysics does the normative work here: if the essence of the society is the State, then the loss of the State is a loss of being.

  **The Problem:**
  A relational or functionalist ontology does not support this teleology. In a relational view, a decentralized network is not ontologically inferior to a centralized one; it is simply different. A functionalist view might argue a decentralized system is less efficient at specific tasks (e.g., mass mobilization), but not that it is a "collapsed" version of humanity.

  **Requirement for Explicit Supply:**
  If institutions wish to continue using the term "collapse" without relying on the hidden substantialist assumption that *complexity equals existence*, they must explicitly argue for the **normative valuation of complexity**. Scholars and facilitators must state:
  *   *Why* is the loss of centralized administration considered a negative outcome worth labeling "collapse"?
  *   *For whom* was it a collapse? (Likely the elite, not the peasantry).
  *   *What value system* prioritizes monumentality over sustainability or continuity?

  Without the substantialist metaphysics to hide behind, the claim that these societies "collapsed" becomes a moral or political judgment about the value of state-level complexity, rather than a neutral description of ontological cessation. This judgment must be argued for on ethical or ecological grounds, rather than inherited from the framing of the society as a substance that ceased to be.
