  # JOINT STATEMENT ON INDIRECT NORMATIVE AUTHORITY
  **Signed:** The Ground-Level Coalition & The Transformative Rationality Project
  **Date:** October 14, 2023
  **Subject:** Terms of Adversarial Collaboration on Idealized Deliberation

  ### 1. AGREED CLAIMS

  1.  **The Function of Indirect Normativity:** Indirect normativity is not a method for discovering mind-independent moral truths, nor is it a mere aggregation of existing preferences. Its sole function is to generate normative authority by bridging the gap between an agent's actual motivational set and the demands of rationality.
  2.  **Inadequacy of Direct Normativity:** Direct normativity fails because it cannot explain why agents should care about norms that lack any connection to their subjective standpoint. A norm that binds an agent solely because it is "true," without any hook into their deliberative perspective, is alienating and lacks justificatory force.
  3.  **The Filtering Role of Idealization:** Both sides agree that idealized deliberation must filter out ignorance of non-moral facts, computational errors, and temporary emotional distortions (e.g., rage, panic). Actual consent given under these conditions is normatively inert.
  4.  **Paternalism and Non-Identity:** We agree that overriding an actual agent's consent constitutes paternalism that requires heavy justification. However, we also agree that the non-identity problem does not dissolve obligations to future people; indirect normativity must account for agents who do not yet exist but whose hypothetical endorsement matters.
  5.  **The Authority Condition:** A norm is authoritative only if it can be linked to a hypothetical endorsement procedure. There is no authority without a agent-relative hook, however idealized.

  ### 2. DISAGREEMENTS TABLE

  | Issue | Ground-Level Position (GL) | Transformative Position (TR) |
  | :--- | :--- | :--- |
  | **The Justificatory Link** | "If the idealized agent's reasoning cannot be reconstructed by the actual agent without abandoning their core practical identity, the norm lacks authority for them." | "The justificatory link survives even if the actual agent cannot comprehend the reasoning, provided the idealized agent represents the actual agent's true rational interests." |
  | **Continuity of Self** | "Idealization must preserve the agent's fundamental values and cognitive architecture. Changing the values changes the person, severing the link." | "Idealization must correct the agent's fundamental values if they are irrational. Changing the values preserves the person's rational agency." |
  | **Opacity of Reasons** | "Norms cannot be binding if the reason for them is permanently opaque to the bound agent. Authority requires accessibility." | "Norms can be binding even if the reason is permanently opaque, provided the outcome aligns with what the agent would will if fully rational." |

  ### 3. THE CRUXES AND TEST CASES

  **Crux 1: Transparency and Availability**
  *The Dispute:* Does justification require that the actual agent can understand *why* the norm binds them, or is it enough that the norm is *good for them* according to a standard they cannot grasp?

  *   **Test Case:** **The Public Health Mandate.** A government imposes a strict quarantine and vaccination protocol based on complex epidemiological models that contradict local religious intuitions about purity. The models are accurate, but the reasoning is statistically opaque to the local population, who view the mandate as a violation of divine will.
      *   **GL Verdict:** **Illegitimate.** Because the reasoning cannot be translated into the agents' existing conceptual framework without destroying their core religious identity, the norm is alien imposition. The idealized agent must share the religious constraint unless it is based on factual error (it is not; it is a value commitment).
      *   **TR Verdict:** **Legitimate.** The fully rationalized agent would recognize the religious intuition as an irrational bias against survival. The actual agent's inability to understand the statistics is a cognitive deficit, not a protected value. The norm binds them even if they view it as unjust.

  **Crux 2: Distributive Fairness vs. Idealized Endorsement**
  *The Dispute:* What happens when the idealized agent endorses a distributive rule that looks plainly unfair from the ground-level perspective?

  *   **Test Case:** **The Stability Pact.** To prevent global economic collapse, a resource allocation rule requires a specific minority group to accept permanently lower living standards. Actual agents across all groups view this as unjust discrimination. However, the fully rationalized agents (with full knowledge of game theory and collapse scenarios) endorse it as the only stable equilibrium.
      *   **GL Verdict:** **Suspect/Invalid.** If the actual agents, even with full information and reduced bias, still perceive the rule as a violation of reciprocity, then the idealized endorsement is likely modeling them as different people. A norm that looks like oppression from the ground cannot be authoritative.
      *   **TR Verdict:** **Valid.** The perception of "unfairness" is a ground-level heuristic that fails in high-stakes coordination problems. The idealized agents see the necessity clearly. The norm is authoritative because it serves the rational interests of all, including the minority, by preventing total collapse, regardless of the phenomenological experience of unfairness.

  ### 4. DIAGNOSTIC ASSESSMENT: SUBSTANTIVE VS. VERBAL

  **Verbal Confusion:**
  We agree that much of our debate stems from the definition of "the agent." GL treats the agent as a psychological continuity chain; TR treats the agent as a locus of rational capacity. When TR says "true rational interests," GL hears "different person." When GL says "core values," TR hears "contingent bugs." This is terminological, not foundational.

  **Substantive Disagreement:**
  The split on **Transparency** is substantive. It is a disagreement about the nature of authority itself. GL holds that authority is essentially relational and communicative; TR holds that authority is essentially functional and teleological. There is no verbal fix for this.

  **Flagged Smuggling of Direct Normativity:**
  1.  **Transformative Side:** You are smuggling Direct Normativity when you define "fully rationalized." If your procedure guarantees specific normative outcomes (e.g., utilitarianism) regardless of the input values, you are not deriving norms from the agent; you are imposing independent norms *onto* the agent and calling it "rationality." You must admit that your "idealization" functions as a truth-tracking mechanism independent of the agent's will.
  2.  **Ground-Level Side:** You are smuggling Direct Normativity when you treat "basic values" as immune to critique. By asserting that certain values must be preserved for the agent to remain "themselves," you treat those values as intrinsically authoritative inputs rather than outputs of deliberation. You are granting direct authority to the status quo of the agent's psychology.

  **Conclusion:**
  We sign this not because we agree on the verdicts, but because we agree on the battlefield. Indirect normativity is the only viable path, but we remain divided on whether the path leads back to who we *are* or forward to who we *ought to be*.
