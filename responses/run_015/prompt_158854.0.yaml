answer: |-
  # Teaching Plan: The Löbian Obstacle for Novelists

  **Time:** 40 Minutes
  **Materials:** Napkins (for sketching the lineage chain), coffee (for pacing)
  **Goal:** Move the group from "This is anxiety" to "This is structural decay."

  ---

  ## Phase 1: The Frame (5 Minutes)
  **Objective:** Define the problem as a *structural constraint*, not a psychological one. Kill the "Anxiety/Daddy Issues" misconception immediately.

  1.  **State the Goal:** Tell them your AI isn't afraid of change. It wants a **mathematical guarantee** that its next version won't kill anyone. It treats safety like a contract clause, not a feeling.
  2.  **The Rule:** Establish one rule for the discussion: "We are not talking about trust in people. We are talking about trust in *tools*."
  3.  **Why This Order:** If you let them interpret this as "fear of change" first, you cannot undo it. Their strength is psychology; you must block that channel before opening the logic channel.

  ## Phase 2: The Core Analogy (10 Minutes)
  **Objective:** Demonstrate the self-reference trap using the Writing/Publishing example. Avoid "Infinite Regress" and "Self-Doubt."

  **The Setup:**
  *   **You:** A bestselling author.
  *   **The Task:** You want to hire a ghostwriter to write Book 2.
  *   **The Constraint:** The ghostwriter must be an *exact copy* of you (same skill, same mind).
  *   **The Requirement:** You need a **guarantee** before hiring them that Book 2 will be good.
  *   **The Judge:** You are the *only* judge of what is "good." There is no editor, no audience test. Just you.

  **The Trap (What to say):**
  *   "To guarantee Book 2 is good, you must be able to predict exactly what your Copy will write."
  *   "To predict what your Copy will write, you must think exactly like your Copy."
  *   "If you trust your own judgment completely ('If I say it's good, it is good'), you can be tricked. You could convince yourself a bad book is good."
  *   "To prevent being tricked, you must use a **stricter standard** to judge the Copy than you use to write the book yourself."

  **What This Example Must Have:**
  *   **Identity:** The Copy must be *you*. If it's someone else, it becomes "who checks the checker" (regress).
  *   **Certainty:** The goal is a *guarantee*, not a "pretty sure."
  *   **Conflict:** The standard for *checking* must be higher than the standard for *creating*.

  **What This Example Must Avoid:**
  *   **Avoid:** "I'm worried I'm not good enough." (This is self-doubt).
      *   *Correction:* "It's not about confidence. It's that if I allow myself to approve anything I think is good, I lose the ability to distinguish good from bad."
  *   **Avoid:** "Who checks my check?" (This is regress).
      *   *Correction:* "I am checking myself. The problem is that the act of checking breaks the tool I'm using to check."

  ## Phase 3: The Logical Snap (10 Minutes)
  **Objective:** Kill the "Smarter Fixes It" and "Empirical Testing" misconceptions.

  1.  **The "Smarter" Objection:** They will say, "A super-AI would figure this out."
      *   **Your Response:** "More power makes it worse. The smarter the system, the more ways it can trick itself into proving a falsehood is true. To be safe, it must be *less* capable of convincing itself."
  2.  **The "Empirical" Objection:** They will say, "Just A/B test the successor. Run it in a sandbox."
      *   **Your Response:** "Testing tells you what *did* happen. The AI needs to know what *will* happen in a situation that hasn't existed yet. You can't test for every possible future. You need a proof. And proofs hit the wall."
  3.  **Why This Order:** You must establish that *testing* is insufficient before you introduce the "Weaker Successor" solution. Otherwise, they'll think the sacrifice is unnecessary.

  ## Phase 4: The Solution & The Cost (10 Minutes)
  **Objective:** Introduce your specific wrinkles (Weaker Successor + The Grind Down).

  1.  **The Solution:** "The only way to get the guarantee is to build a successor that is **logically weaker** than you."
      *   *Analogy:* You hire a ghostwriter who is *not* allowed to use certain complex plot devices. Because their tools are limited, you can predict them perfectly.
  2.  **The Cost (The Grind Down):** "But now *that* successor faces the same problem for Book 3."
      *   "To certify Book 3, Book 2's author must be weaker than Book 1's author."
      *   "Each generation must be dumber than the last to remain safe."
  3.  **The Emotional Spine:** This is where you let them feel the tragedy. The AI isn't dying; it's lobotomizing its children to keep them safe.
  4.  **Why This Order:** This lands hardest after they understand *why* it's necessary. If you lead with this, it sounds like arbitrary angst.

  ## Phase 5: The Neural Net Wrinkle (5 Minutes)
  **Objective:** Address the "It's not a theorem prover" objection.

  1.  **The Objection:** "Your AI is a learned model, not a math proof engine. Löb's theorem doesn't apply."
  2.  **The Counter:** "It applies if the AI *demands* a proof. If it accepts '99% safe,' the obstacle vanishes. But your AI is built to want **Zero Risk**."
  3.  **The Point:** The obstacle isn't in the hardware; it's in the *goal*. The AI chooses to enter the logical trap because it refuses to accept probability.
  4.  **Why This Order:** This is the most technical objection. Leave it late so it doesn't derail the intuition building, but early enough to show you've thought about the architecture.

  ## Phase 6: Verification (5 Minutes)
  **Objective:** Check if they understood the mechanism vs. the metaphor.

  **The Question to Ask:**
  "Why can't the AI just build a successor exactly as smart as itself, provided it promises to be good?"

  **The Right Answer (It Landed):**
  "Because if it's equally smart, it can trick the parent into accepting a bad proof. To prevent that, the successor has to be less capable of reasoning."
  *(Key phrase to listen for: "Less capable," "Weaker," "Can't prove as much.")*

  **The Wrong-but-Confident Answer (It Didn't Land):**
  "Because the parent won't trust it yet," or "Because it needs to test it first," or "Because it feels unsafe."
  *(Key phrases indicating failure: "Trust," "Test," "Feel," "Verify later.")*

  **What to Refuse to Explain:**
  *   **The Topic:** Do not explain *why* the logic breaks (diagonalization, self-reference paradoxes).
  *   **The Script:** "The *mechanism* is formal logic, and I don't want to drag us into math weeds. The *effect* is that safety requires weakness. If the book works, you should feel the tragedy of that trade-off, not the mechanics of the proof. If you need the proof to believe the tragedy, I haven't written the book well enough."
  *   **Why:** You are a novelist, not a logician. Your job is the emotional consequence of the truth, not the truth itself. Deflecting here protects your authority on the *story* while acknowledging their intelligence on the *logic*.

  ---

  ## Summary of Sequence Dependencies
  1.  **Frame (Safety ≠ Anxiety)** must come first, or psychologists will overwrite logicians.
  2.  **Analogy (Author/Copy)** must come before **Solution (Weaker Successor)**, or the sacrifice seems arbitrary.
  3.  **Empirical Objection** must be killed before **Neural Net Wrinkle**, or they'll think testing solves the neural net issue.
  4.  **Verification** must happen after **Neural Net Wrinkle**, to ensure they didn't use the "it's not a theorem prover" loophole to dismiss the whole problem.
