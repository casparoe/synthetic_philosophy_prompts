  You are struggling because you are trying to find a rule about *accuracy*, but your verdicts are actually about *justice*. You are not acting as a fact-checker; you are acting as a judge of epistemic harm.

  Your gut is using **The Principle of Adversarial Provenance**.

  Stated precisely:
  > **Credit the source that bears unintended witness against the interests of its own creator, provided that creator holds structural power. When both sources serve power, default to the archive. When both sources serve the vulnerable, default to memory.**

  Here is how it grinds out your verdicts:

  *   **Case 1 (Ojibwe Land):** The Archive (Treaty/Deed) was created by the State to formalize transfer. It inadvertently documents *theft* (removal), contradicting the Town's memory of *benevolence* (sale). The Archive speaks against the Town's power-narrative. **Verdict: Trust Archive.** (Matches your gut).
  *   **Case 3 (Aboriginal Massacre):** The Archive (Colonial Record) was created to administer the colony. Its silence on the massacre serves the State's interest in order and legitimacy. The Memory serves the Community's interest in existence. The Archive is an instrument of erasure. **Verdict: Trust Memory.** (Matches your gut).
  *   **Case 6 (Informant Teacher):** The Archive (Secret Police File) was created by the Dictatorship to control the population. Accusing the teacher serves the State's interest in atomizing trust. The Memory serves the Community's interest in cohesion. The Archive is a weapon. **Verdict: Trust Memory.** (Matches your gut).
  *   **Case 4 (Novelist Visit):** The Archive (Letters/Registers) was created for personal/business logistics, not state power. The Memory is village pride. Neither involves structural oppression. Default to the harder evidence. **Verdict: Trust Archive.** (Matches your gut).
  *   **Case 5 (Massacre Number):** The Archive (Exhumation) is forensic science (neutral power). The Memory is trauma (vulnerable experience). They occupy different jurisdictions (bodies vs. meaning). **Verdict: Split.** (Matches your gut).
  *   **Case 2 (Lyon Family):** The Archive (Notarial Record) was created by the State Bureaucracy to track transactions. It documents *payment*, contradicting the Family's memory of *altruism*. The Record speaks against the Family's interest in virtue. By the logic of Case 1 (where we rejected the Town's virtue myth because the Record showed theft), you should reject the Family's virtue myth because the Record shows transaction. **Verdict: Trust Archive.** (**Contradicts your gut**).

  ### The Verdict You Must Drop

  **Case 2.**

  Your principle demands consistency between Case 1 and Case 2. In Case 1, you decided that a "virtuous narrative" (fair sale) must yield to a "transactional record" (removal) because the record reveals the operation of power. In Case 2, you are allowing a "virtuous narrative" (altruism) to stand against a "transactional record" (payment).

  If the plaque comes down in Case 1 because it lies about the *nature of the transaction*, the family story in Case 2 must be corrected on the *nature of the transaction*. You can preserve the *meaning* (they helped), but you cannot preserve the *fact* (for nothing). To do so is to privilege a private lie over a public record, while you privilege the public record over a public lie in Case 1. The principle of Adversarial Provenance treats the Notary as a state functionary whose records incriminate the family's myth, just as the Deed incriminates the town's myth. You must drop the claim that the memory is "true" in a factual sense; it is only true in a moral sense, and in your other cases, moral truth does not override factual record unless structural power is the wedge.

  ### The Two Unlisted Cases

  **1. The Monument Without Memory**
  *A community's memory has hardened into a monument and museum exhibit, with nobody alive who remembers the event firsthand.*

  **Verdict:** Treat this as **Case 1 (The Plaque)**, not Case 3 (Oral Tradition).
  Once memory is institutionalized into stone and glass without living custodians, it becomes a claim of *authority*, not a practice of *survival*. It has joined the Archive. It is now a "public record."
  *   **Apply the Principle:** Does the monument serve structural power or vulnerable existence? If it is a Confederate statue (Power), it yields to the Archive. If it is a memorial to a erased lynching (Vulnerable), it stands *even if* the Archive is silent, because its function is counter-power.
  *   **The Twist:** Because there are no living witnesses, the burden of proof shifts. You cannot claim "oral tradition." You must claim "historical interpretation." If the Archive contradicts the exhibit, the exhibit must be annotated, not necessarily removed, but its claim to *memory* is void. It is now *history*, and history belongs to the Archive unless the Archive is a tool of erasure.

  **2. The Memory Manufactured by a Misread Archive**
  *A memory exists only because somebody in 1970 read the archive wrong — a memory manufactured by a record.*

  **Verdict:** **Drop the Memory.**
  This is the inverse of Case 6. In Case 6, the Memory resists the Archive. Here, the Memory is *parasitic* on the Archive.
  *   **Apply the Principle:** The source of the claim is the Archive (1970 reading). The creator of the error is a Researcher (neutral/powerless). The memory serves the Community (vulnerable).
  *   **However:** This is a "fantasy of the powerless" built on a factual error. Unlike Case 3 (where memory exists *despite* silence), this memory exists *because of noise*.
  *   **The Ruling:** You correct the record. A memory based on a clerical error has no epistemic jurisdiction. It is not resistance; it is a mistake. To keep it is to build your justice on a lie, which undermines Case 1. You must tell the community: "The archive was misread; the event didn't happen this way." The *need* for the memory might be real (Case 3), but the *content* is contaminated. You help them find a memory that *doesn't* rely on the error.

  ### Summary for your Piece

  Your piece is not about "Memory vs. Archive." It is about **"Who is lying, and to what end?"**

  *   When the Archive lies to protect Power (Case 3, 6), trust Memory.
  *   When Memory lies to protect Power (Case 1), trust Archive.
  *   When Memory lies to comfort the Powerless (Case 2, 4), trust Archive (with grace).
  *   When Archive measures bodies and Memory measures pain (Case 5), trust both.

  You are secretly a consequentialist. You trust the truth that does the least harm to the vulnerable. Case 2 bugs you because admitting the family was paid does no harm to the vulnerable (the Jewish family was still saved), but you want to protect the family's virtue. That is the one place your heart is overriding your principle.
