      *   *Make sure the "Dissent Test" is operational.* If one contemporary dissent exists in the dossier, "could not have known" is false.
      *   *Make sure the "Regress Stop" is clear.* We stop when we hit the committee's own moral floor.

      *(Self-Correction on Case 2)*: The prompt asks me to suspect the *note* is the presentist object. I need to ensure the procedure validates that intuition. If the note claims she was a "pioneer" (implying she shares our values), that is anachronistic praise. The procedure should catch this.

      *(Self-Correction on Case 3)*: The prompt asks about "retrospective injury." The procedure needs a specific step for "Downstream Effects."

