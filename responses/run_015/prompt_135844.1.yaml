answer: |-
  Here is a procedural framework designed for your committee's constraints, followed by its application to your three cases and an assessment of its limitations.

  # The Commemoration and Context Protocol (CCP)

  **Purpose:** To replace the term "presentism" with specific, adjudicable questions regarding historical agents and current campus honors.
  **Constraint:** All answers must be derivable from the dossier (petition, response, general reference). No new archival research.

  ### Step 1: Triage by Function
  *Question:* What is the object doing?
  *   **A. Honor (Naming, Endowment, Portrait):** A constitutively present-facing act. We are choosing *now* to hold this person up as a model or beneficiary.
      *   *Norm:* Alignment with current institutional values. Past virtue is not required, but current dissonance is fatal.
      *   *Procedure:* If the honor causes active alienation or contradicts core mission *today*, it fails, regardless of historical context. Context explains the past; it does not justify the present honor.
  *   **B. Tool (Curriculum, Lecture Topic):** An instrument for inquiry.
      *   *Norm:* Pedagogical utility and intellectual honesty.
      *   *Procedure:* Does the text/series enable understanding? Is the harmful content integral to the lesson or an obstacle to it?
  *   **C. Record (Plaque, Annotation, Archive):** An explanation of the past.
      *   *Norm:* Accuracy and proportionality.
      *   *Procedure:* Is the explanation factually true? Does it distort the historical record to soothe present feelings?

  **Stop Rule:** If the object is an **Honor**, historical "excuses" (Step 2 & 3) are irrelevant to the *retention* decision, though relevant to the *explanation*. If the object is a **Tool** or **Record**, proceed to Step 2.

  ### Step 2: The Availability Test (The "Could Not" Rungs)
  *Question:* When claiming the agent "could not have known better," which rung of availability is being asserted?
  *   **Rung 1 (Vocabulary):** Did the concepts exist in their language?
  *   **Rung 2 (Articulation):** Was the view actually argued by someone they could read or hear?
  *   **Rung 3 (Feasibility):** Could they have acted on the view without immediate ruin?
  *   **Rung 4 (Survivability):** Could they have acted on the view without death/imprisonment?

  **Sufficiency Rule:**
  *   For **Record/Tool**: Rung 2 (Articulation) is the threshold. If a dissenting view existed in their milieu, "could not have known" is false.
  *   For **Honor** (mitigation only): Rung 4 (Survivability) is the threshold. We do not honor cowardice, but we may acknowledge terror.

  **Stop Rule:** If the dossier shows *any* evidence for a higher rung than the one asserted, the "could not" defense fails.

  ### Step 3: The Reference Class and Dissent Test
  *Question:* Who is the agent being compared to, and over what window?
  *   **Window Rule:** The window is ±10 years from the utterance/act.
  *   **Class Rule:** The class is "peers with equivalent social capital and access to information." (e.g., A merchant is compared to merchants, not peasants).
  *   **The Dissent Test:** Does the dossier contain *one* verified instance of a peer within the Window/Class who articulated the contrary view?

  **Stop Rule:** If **Yes** to Dissent Test: The claim "this was the universal view of the time" is factually false. Mark as **Historical Inaccuracy**.
  If **No** to Dissent Test: The claim is historically plausible. Proceed to Step 4.

  ### Step 4: The Symmetry and Usage Check
  *Question:* How is the historical fact being used?
  *   **The Frequency Excuse:** Is the fact "everyone did it" being used to negate harm?
      *   *Rule:* Frequency explains prevalence; it does not negate harm. Flag any text that uses frequency to imply moral neutrality.
  *   **The Asymmetry Check:** Are we applying anachronism differently to praise and blame?
      *   *Rule:* If we claim an agent as a "proto-[modern value]" (Praise), we must accept the label "[modern vice]" (Blame) if the evidence supports it. We cannot claim them as "one of us" when convenient and "a creature of their time" when inconvenient.
  *   **The Causal Chain (for Retrospective Injury):** If the harm occurred after the agent's death (e.g., funds used by later bad actors):
      *   *Rule:* Injury counts only if the *current* function of the honor facilitates that harm. If the link is merely historical association without current functional alignment, it is a Record issue, not an Honor issue.

  **Stop Rule:** If Asymmetry is detected, the argument is procedurally invalid. If Frequency Excuse is detected, the explanation must be rewritten.

  ### Step 5: The Regress Stop (The Normative Floor)
  *Question:* Whose values are deciding this?
  *   **Rule:** The Committee must explicitly state: "We are judging this by the standards of [Current Year] [Institution Name]."
  *   **Constraint:** Do not claim the procedure itself is neutral. It is a tool for applying *our* values to *their* history.
  *   **Stop Rule:** Once the Committee affirms its own normative floor, debate on "objective history" must cease. The decision is now a value judgment, not a historical finding.

  ***

  # Application to Cases

  ### Case One: Hartwell Hall
  *   **Step 1 (Triage):** Object is a Dormitory Name. **Function: Honor.**
      *   *Implication:* Historical context cannot justify retention if the honor contradicts current values. The petition asks for removal (Honor decision); the draft plaque is a Record decision.
  *   **Step 2 (Availability):** Rung 2 (Articulation). Abolitionist pamphlets were on sale.
  *   **Step 3 (Reference/Dissent):** Class = Merchants of his city. Window = 1858. Dissent Test = **Positive**. Two business partners subscribed to an abolition society.
      *   *Finding:* The claim that his views were "those of most merchants" may be statistically true, but the claim that he "could not have known better" is false.
  *   **Step 4 (Usage):**
      *   *Frequency Excuse:* The draft plaque ("views... were those of most merchants") attempts to use frequency to soften the indefensibility. This is a Frequency Excuse.
      *   *Asymmetry:* N/A.
  *   **Step 5 (Regress):** We value racial equality. Hartwell's honor contradicts this.
  *   **Verdict:**
      *   **Petition:** **Granted.** As an Honor, the dissonance is fatal. The Dissent Test proves he had access to better views.
      *   **Plaque:** **Rejected.** The draft is a **Presentist Object**. It uses historical frequency to excuse a moral failure that the dossier proves was avoidable (partners subscribed to abolition). It disguises a value judgment (his racism is forgivable) as a historical finding (everyone was racist).
      *   **Action:** Remove name. If a plaque remains, it must state: "Hartwell held views on race that were contested in his own time and are incompatible with the university's values."

  ### Case Two: Vance Text
  *   **Step 1 (Triage):** Object is a Required Text. **Function: Tool.**
      *   *Implication:* Retention depends on pedagogical utility, not moral purity.
  *   **Step 2 (Availability):** Rung 2 (Articulation). She corresponded with someone arguing for equal education.
  *   **Step 3 (Reference/Dissent):** Class = Educators/Authors. Window = 1790s. Dissent Test = **Positive**. Her own practice (teaching Latin/bookkeeping) contradicted her text. Her correspondent argued for equality.
      *   *Finding:* She *could* have written differently; she chose not to, or was constrained by publication norms.
  *   **Step 4 (Usage):**
      *   *Asymmetry Check:* **Flagged.** Your note calls her a "pioneer" (Proto-feminist Praise) while acknowledging her theory "lagged" (Misogynist Blame).
      *   *Analysis:* You are claiming her practice makes her "one of us" (feminist pioneer) while attributing her theory to "her time." This is the exact asymmetry the procedure polices. If her practice makes her a feminist, her text makes her a misogynist. You cannot have the pioneer status without the blame.
      *   *Frequency Excuse:* "Theory lagged practice" implies the *time* caused the lag. The dossier shows she *acted* against the norm. The lag was likely strategic or philosophical, not just temporal.
  *   **Step 5 (Regress):** We value gender equality. We keep the text to analyze the tension, not to honor Vance.
  *   **Verdict:**
      *   **Petition:** **Denied.** As a Tool, the text has utility (showing the tension between theory/practice).
      *   **Your Note:** **Flagged as Presentist.** It engages in anachronistic praise ("pioneer") to immunize the text from anachronistic blame.
      *   **Action:** Keep text. Rewrite note to: "Vance's practice exceeded her theory. While she argued for domestic confinement, she taught advanced subjects. This contradiction illustrates the constraints on women's public argument in 1792." (Remove "pioneer," remove "lagged," state the contradiction).

  ### Case Three: Crane Lectures
  *   **Step 1 (Triage):** Object is a Lecture Series. **Function: Honor (Endowment) + Tool (Lectures).**
      *   *Implication:* Must evaluate the honor (the name) and the tool (the talks) separately.
  *   **Step 2 (Availability):** N/A (He is not being judged for eugenics).
  *   **Step 3 (Reference/Dissent):** N/A (He did not espouse the views).
  *   **Step 4 (Usage/Causal Chain):**
      *   *Retrospective Injury:* Petition argues the lectures *now function* as an honor to a man whose work fed later harm.
      *   *Causal Rule:* Did his funds *enable* the eugenics? No. Did his foundation *quote* him? Yes, posthumously.
      *   *Current Function:* Do the lectures *currently* promote eugenics? No.
      *   *Finding:* The injury is associational, not functional.
  *   **Step 5 (Regress):** We value not being associated with eugenics.
  *   **Verdict:**
      *   **Petition:** **Denied (with caveat).** The procedure does not recognize retrospective injury where the causal chain is broken (posthumous appropriation without prior intent).
      *   **Condition:** If the *current* lecture topics or the foundation's current branding rely on that eugenicist association, the Honor fails Step 1 (Current Dissonance). If it is purely historical baggage, the Honor stands, but a Record (plaque) is required to sever the link.
      *   **Action:** Retain name. Add Record: "Crane's endowment was later cited by eugenicists, a movement he did not join. The University disavows that appropriation."

  ***

  # Limitations and Failure Modes

  You asked where this procedure will misfire, what questions it is the wrong instrument for, and which steps are judgment calls wearing procedural costume.

  **1. The "Dossier Garbage" Problem**
  The procedure relies entirely on the quality of the dossier (Step 2 & 3). If the petitioners or the responding unit fail to find the dissenting voice (the abolitionist partner, the correspondent), the Dissent Test returns a False Negative. The procedure will validate a historical falsehood because the committee has no research budget.
  *   *Failure Mode:* The procedure certifies ignorance as innocence.
  *   *Mitigation:* You must add a "Uncertainty Flag." If the dossier is thin on Step 2/3, the committee must vote based on the *risk* of error, not the finding.

  **2. The "Honor" Definition is a Value Judgment**
  Step 1 distinguishes Honor from Tool. But many things are both. Is a named professorship an Honor (for the donor) or a Tool (for the department)? Is a building an Honor (for the name) or a Tool (for the students)?
  *   *Failure Mode:* Parties will game the Triage. Petitioners will call everything an Honor (higher standard); Defenders will call everything a Tool (utility standard).
  *   *Judgment Call:* The Committee must decide the *primary* function. The procedure cannot do this; it only processes the decision once made.

  **3. The Regress Stop is Psychologically Difficult**
  Step 5 requires the committee to admit, "We are banning this because *we* dislike it, not because History says so." Committee members (especially Trustees) often want the cover of "Objective History."
  *   *Failure Mode:* Members will refuse to stop at Step 5. They will insist their values *are* historical facts. The procedure will be bypassed by metaphysical claims ("It is objectively true that racism is wrong" vs. "We hold racism to be wrong").
  *   *Judgment Call:* As Chair, you must enforce the Stop. If a member says "History proves this wrong," you must correct them: "Our values prove this wrong; history proves it was contested."

  **4. The Asymmetry Check Polices Tone, Not Outcome**
  Step 4 catches inconsistent reasoning (praising Vance as a pioneer while shielding her from blame). However, a committee can be consistently anachronistic. They could decide to judge *everyone* by modern standards (burn it all down) or *no one* by modern standards (keep it all).
  *   *Failure Mode:* The procedure ensures consistency, not correctness. It prevents the specific hypocrisy of "proto-feminist praise/misogynist excuse," but it does not tell you if keeping Vance is the right ethical choice for the students.
  *   *Wrong Instrument:* This procedure cannot answer "What kind of community do we want to be?" It only answers "Are we being consistent in how we apply our current values to the past?"

  **5. The "Survivability" Rung is Unknowable**
  In Step 2, Rung 4 (Survivability) asks if dissent would have led to death/ruin. In a one-meeting dossier review, you cannot know this. You cannot simulate the counterfactual economic or social pressure of 1858.
  *   *Failure Mode:* The committee will default to Rung 2 (Articulation) because it's in the dossier, even when Rung 4 is the relevant moral question.
  *   *Judgment Call:* You will have to rule on survivability based on intuition. The procedure dresses this intuition in the costume of a "Rung Selection."

  **Summary:** The CCP prevents the word "presentism" from ending debate prematurely. It forces the committee to specify *why* they are judging. It will not, however, save you from bad data, gaming of categories, or the fundamental burden of admitting that the final decision rests on your own values, not the past's.
