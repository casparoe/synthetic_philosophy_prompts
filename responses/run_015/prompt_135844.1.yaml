      *   **Problem:** Current process relies on "presentism" as a conversation-stopper (both for and against). Needs a structured *procedure* (questions in order, sufficiency conditions, stop rules, value flags).
      *   **Requirements:**
          1.  Triage by utterance type (explanation vs. verdict vs. teaching vs. honoring).
          2.  Availability of standard (rungs of "could not have known better").
          3.  Comparison class & time window (anti-gerrymandering, dissent test).
          4.  Epistemic fork (explain vs. condemn), failure modes (frequency as excuse, asymmetry of anachronism), and regress stop (our own standpoint).
      *   **Task:** Design the procedure, run it on three specific cases (Hartwell Hall, Vance Text, Crane Lectures), and identify limitations/failure modes.
      *   **Constraint:** No bibliography/further reading. Must be actionable in the room.

  2.  **Deconstruct the Four Requirements into Procedural Steps:**

      *   *Requirement 1 (Triage):* Need a Step 1 that categorizes the object. Is it a name (honor), a text (teaching), or a plaque (explanation)? The norm differs for each. Honoring is inherently present-facing.
      *   *Requirement 2 (Standards):* Need a Step 2 that assesses moral epistemology. What standards were available? Need the "rungs": Vocabulary, Articulation, Feasibility, Survivability.
      *   *Requirement 3 (Comparison/Window):* Need a Step 3 that fixes the reference class. Who are we comparing them to? When? The "Dissent Test" is crucial here.
      *   *Requirement 4 (Epistemic Fork & Regress):* Need a Step 4 that distinguishes using history to explain vs. condemn. Need to flag the "Frequency Excuse" and "Praise/Blame Asymmetry." Need a "Regress Stop" where we admit our own values are the floor.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Name:* The Commemoration & Context Protocol (CCP).
      *   *Structure:* Linear flowchart style.
      *   *Step 1: Classification.* Distinguish Honor (naming), Curriculum (teaching), Record (plaque/history).
      *   *Step 2: The Availability Test.* The four rungs.
      *   *Step 3: The Reference Class Test.* Time window + Dissent Test.
      *   *Step 4: The Usage Test.* Are we using past facts to excuse or explain? Check for asymmetry.
      *   *Step 5: The Regress Stop.* Acknowledge the committee's normative floor.

  4.  **Running the Cases:**

      *   *Case 1: Hartwell Hall (Honor).*
          *   Object: Building Name (Honor).
          *   Standard: Abolitionist views existed (Vocabulary/Articulation).
          *   Reference Class: Merchants of his class. Dissent Test: Partners subscribed to abolition society. So "could not have known" fails.
          *   Usage: Plaque says "indefensible to us, but common." This tries to excuse via frequency.
          *   Result: Petition has merit (Honor requires present alignment). Plaque is presentist excuse-making.
      *   *Case 2: Vance Text (Curriculum).*
          *   Object: Required Text (Teaching).
          *   Standard: Equal education argued by correspondent.
          *   Reference Class: Educators of 1792. Dissent Test: She practiced differently than she preached.
          *   Usage: Prof wants to keep for "pioneer" status (Praise). Petition wants drop for "misogyny" (Blame).
          *   Result: Asymmetry check. If we keep her for proto-feminism (anachronistic praise), we can't drop her for misogyny (anachronistic blame) without inconsistency. *However*, teaching norm is different than honoring. The note ("theory lagged practice") is arguably accurate but risks smoothing over.
          *   Crucial insight: The Prof's note might be presentist *praise* (claiming her as one of us) while the petition is presentist *blame*. The procedure should flag this symmetry.
      *   *Case 3: Crane Lectures (Honor/Endowment).*
          *   Object: Lecture Series (Honor).
          *   Standard: Eugenics not linked to him directly.
          *   Causal Chain: Posthumous appropriation.
          *   Result: Retrospective injury is weak unless the honor *currently* signals endorsement of that harm. If the lectures are *used* by eugenicists now, that's different. If it's just historical association, the "Honor" norm (present practice) suggests we look at current function.
          *   Procedure outcome: Likely fails the "Honor" test if the association tarnishes the *current* purpose, but not based on Crane's guilt.

  5.  **Refining the Procedure (Self-Correction/Polishing):**

      *   *Tone:* Needs to be academic, precise, procedural, not preachy.
      *   *Clarity:* Use bolding for steps.
      *   *The "Regress Stop":* This is philosophically tricky. The procedure must admit that *we* decide what counts as harm.
      *   *The "Frequency Excuse":* Need to explicitly name this in Step 4.
      *   *The "Asymmetry":* Need to explicitly name this in Step 4.

  6.  **Addressing the Limitations (The "What it cannot do" section):**

      *   It can't solve value conflicts (e.g., free speech vs. inclusion).
      *   It can't fix bad dossiers (garbage in, garbage out).
      *   It can't prevent the committee from lying about the "Regress Stop."
      *   It creates a illusion of objectivity.

  7.  **Final Review against Constraints:**

      *   Did I answer all four specific requirements? Yes.
