answer: |-
  This is a classic **Judgment Aggregation** problem, specifically the **Doctrinal Paradox** (or Discursive Dilemma). You are standing exactly where legal scholars and social choice theorists have been arguing for twenty years: do you aggregate premises (requirement-by-requirement) or conclusions (major credit yes/no)?

  The literature is deep, but 90% of it is irrelevant to your constraints. You don't need to solve the impossibility theorems; you need a protocol that prevents the Dean from getting sued and keeps your colleagues from mutinying.

  Here is a defended agenda for your semester, ordered by dependency. You cannot solve Phase 3 until Phase 1 is done, and you cannot write the Protocol (Phase 4) until Phase 2 is settled.

  ### Phase 1: The Magnitude Audit (Weeks 1–3)
  **Goal:** Determine if the paradox is a theoretical nuisance or a practical frequency.
  **Why Upstream:** If contradictions happen in <5% of cases, you solve this with an appeal process. If they happen in 30%, you need a structural overhaul. Do not write a single rule until you know the base rate.

  *   **Task for GA:** Export the last 3 years of voting records.
  *   **The Query:** Identify every course where the majority vote on the *conclusion* (counts toward major) differed from the logical implication of the *premises* (the requirement votes).
      *   *Example:* Majority said "Yes" to Writing, "Yes" to Quant, but "No" to Major Credit.
  *   **The AI Variable:** Run your current LLM prompt on 20 past courses (10 approved, 10 rejected). Run it 5 times per course. Measure the variance.
      *   *Metric:* Does the "cloud of answers" cluster tightly around the human verdict, or does it scatter?
  *   **Decision Point:** If the human contradiction rate is low and the AI variance is high, the AI is noise. If the human contradiction rate is high, the ballot structure is the problem.

  ### Phase 2: The Power Constraint (Weeks 4–6)
  **Goal:** Neutralize your "superpower" to manipulate outcomes via ballot decomposition.
  **Why Upstream:** You identified this as an ethical problem. It is also a liability. If a course is rejected because you sliced the requirements thinly, and the department appeals, the Dean will ask, "Why was it voted on this way?" If the answer is "The Chair decided," you lose.

  *   **The Fix:** Create a **Standard Decomposition Schema**.
      *   Instead of you choosing the sub-questions ad hoc, the committee adopts a standing list of 5–6 standard criteria (e.g., "Meets Writing Standard," "Meets Quant Standard," "Fits Major Scope").
      *   **Rule:** No ad-hoc sub-questions allowed without a 2/3 vote of the committee *before* the ballot is issued.
  *   **Why This Matters:** This shifts the aggregation problem from *your* discretion to the *committee's* rules. It protects you from accusations of bias.
  *   **Tractability:** High. This is policy writing, not math.
  *   **Literature to Ignore:** Ignore "strategy-proofness" proofs. You can't mathematically prevent gaming, but you can make it socially costly.

  ### Phase 3: The AI Status (Weeks 7–9)
  **Goal:** Define the LLM as a **Clerk**, not a **Voter**.
  **Why Upstream:** You need to lock this down before drafting the final protocol. If you treat the LLM as a voter, you invite questions about weighting (is 1 bot = 1 human?). If you treat it as a clerk, it's just evidence.

  *   **The Recommendation:** The LLM provides **Draft Findings**, not votes.
      *   *Protocol:* The LLM generates a summary of how the course maps to the Standard Decomposition Schema.
      *   *Aggregation:* Humans vote on the *Findings*, not the raw course.
      *   *Stochasticity:* If the LLM gives a "cloud of answers," the GA aggregates this into a confidence interval (e.g., "Model suggests 80% probability this meets Writing").
      *   *Human Role:* The committee votes to *accept or reject the AI's Finding*.
  *   **Why:** This aligns with how you treat expert testimony. You don't vote on the expert; you vote on whether to accept their analysis. This solves the "one more voter" dilemma.
  *   **Data Check:** Use Phase 1 data. If the AI's "confidence" correlates with human unanimity, keep it. If the AI is confident when humans are split, flag it as a "Review Required" case.

  ### Phase 4: The Protocol Draft (Weeks 10–12)
  **Goal:** Write the document the Dean reads.
  **The Core Mechanism:** **Premise-Based Procedure with a Conclusion Safety Valve.**
  *   **Default:** Vote on requirements (premises). If all pass, credit is granted automatically. (Ensures consistency).
  *   **Safety Valve:** If all premises pass but the committee still votes "No" on Major Credit (the paradox), a 2/3 majority is required to override the premises.
  *   **Why:** This respects the logic (Dean likes consistency) but allows for political reality (Faculty can block a course if it *technically* fits but *actually* sucks).
  *   **Heterogeneity:** Distinguish "Expertise" questions from "Policy" questions.
      *   *Expertise (e.g., is the math hard enough?):* Defer to the subject expert on the committee. Their vote counts double, or acts as a veto.
      *   *Policy (e.g., do we need more history courses?):* Straight majority vote.

  ### What to Stop Worrying About (The "Rabbit Hole" Filter)

  1.  **Arrow's Impossibility Theorem:** Irrelevant. That applies to ranking preferences. You are doing binary judgment aggregation.
  2.  **Optimal Weighting:** Do not try to mathematically weight the "expert" vote vs. the "political" vote. It creates resentment. Use the "Safety Valve" (2/3 override) instead.
  3.  **LLM Prompt Engineering:** Do not spend time trying to make the LLM deterministic. It won't be. Treat the variance as a feature (it shows ambiguity in the criteria), not a bug.
  4.  **Consistency Proofs:** You cannot guarantee logical consistency across *all* courses over *time*. Aim for consistency within *this* meeting.

  ### Mining the Past Records (Instructions for your GA)

  To move questions up or down the priority list, ask your GA to run these three specific analyses on past voting data:

  1.  **The "Chair Effect" Correlation:**
      *   *Query:* Compare contradiction rates (Premises vs. Conclusion) during semesters where *you* chaired vs. previous chairs.
      *   *Meaning:* If your rate is higher, your ballot decomposition is the primary driver. **Move Phase 2 to immediate priority.**
  2.  **The "Expert Deference" Check:**
      *   *Query:* Identify votes where the subject-matter expert voted differently from the majority. How often did the majority overturn the expert?
      *   *Meaning:* If the majority rarely overturns the expert, formalize the expert's veto power. If they often do, the "politics" are real, and you need the Safety Valve.
  3.  **The "AI Simulation":**
      *   *Query:* Feed past course descriptions into the LLM. Compare its "Verdict" to the actual Committee Verdict.
      *   *Meaning:* If the AI matches the Committee 90% of the time, it's a rubber stamp (low value). If it matches 50% but matches the *Premises* 90% of the time, it's a logic checker (high value).

  ### Summary of the Agenda

  1.  **Weeks 1–3:** **Audit.** (Is the paradox real? Is the AI noise?)
  2.  **Weeks 4–6:** **Disarm.** (Standardize the ballot so you can't manipulate it.)
  3.  **Weeks 7–9:** **Define.** (AI is a clerk providing evidence, not a voter.)
  4.  **Weeks 10–12:** **Codify.** (Premise-based voting with a 2/3 override for political realities.)

  **Final Advice:** The Dean cares about **defensibility**. A protocol that says "We voted on the parts, the parts passed, therefore the whole passes" is defensible. A protocol that says "We voted on the parts, they passed, but we felt like saying no" is vulnerable. The "Safety Valve" (2/3 override) gives you the political flexibility you need while maintaining the logical shield the Dean wants.
