prompt: |-
  So I got roped into chairing my university's curriculum committee this year, which I assumed would be pure busywork right up until I noticed this: we vote separately on whether a proposed course satisfies each of several requirements (writing-intensive, quantitative reasoning, whatever else), and then we vote on whether it counts toward the major — and the overall verdict sometimes flatly contradicts the votes on the parts. A colleague mentioned this thing has a name and a whole literature attached to it, and I've been falling down that rabbit hole in my spare time since.

  Two wrinkles make it more than a textbook case for me. First, I'm the one who writes the ballot, so I choose the decomposition into sub-questions — and I've noticed I can pretty much steer the outcome by slicing a course's requirements differently, which is either a superpower or an ethical problem. Second, we've started using an LLM as a kind of clerk: I can ask it each sub-question separately and derive the verdict, or ask it for the verdict straight, and because it's stochastic and I sometimes rephrase, it hands back a little cloud of answers rather than one. So we're aggregating across a population of model-judgments as well as across seven humans, and nobody has any idea whether that thing should count as one more voter, as a tie-breaker, as a supplier of reasons, or not at all. It also matters that the sub-questions aren't all the same kind: on some everyone quietly defers to whichever member actually knows the subject matter, and on others it's straight-up politics.

  Constraints: me, roughly one day a week for a semester, one grad assistant who is very good with spreadsheets, no software budget, and the output has to be a written protocol that seven tired faculty will actually follow and that the dean won't laugh at.

  I'll write the protocol myself — what I want from you is a defended agenda for my limited thinking time: which questions about aggregating connected judgments I should actually grind on, in what order, and why that order. What's genuinely upstream of what, what's tractable for someone who is not a logician, what I should stop worrying about because the answer wouldn't change the protocol, and — the part I care most about — what I could dig out of our own past voting records that would move a question up or down the list. Also be honest about which bits of this literature people get excited about that are basically irrelevant to a committee like mine.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Situation:**
      *   **Role:** Chair of a university curriculum committee.
      *   **Task:** Write a written protocol for voting/aggregation that 7 tired faculty will follow and the Dean will accept.
      *   **Resources:** ~1 day/week for a semester, 1 GA good with spreadsheets, no software budget.
      *   **Problem:** The "Doctrinal Paradox" (or Discursive Dilemma). Voting on premises (requirements) vs. conclusion (major credit) yields contradictions.
      *   **Complication 1 (Power):** The Chair controls the ballot structure (decomposition), allowing outcome manipulation.
      *   **Complication 2 (AI):** An LLM is used as a "clerk," providing stochastic answers to sub-questions or the whole. How to aggregate human + AI judgments?
      *   **Complication 3 (Heterogeneity):** Some sub-questions are expertise-driven, others are political.
      *   **Goal:** A *defended agenda* for the user's thinking time. What to work on, in what order, why? What to ignore? What data to mine from past records?

  2.  **Identify the Core Theoretical Problem:**
      *   This is classic *Judgment Aggregation Theory* (List & Pettit, etc.).
      *   Specifically, the *Doctrinal Paradox*: $P \land Q \to R$. If majority says Yes to $P$, Yes to $Q$, but No to $R$, do you go with the premises or the conclusion?
      *   *Premise-based procedure:* Vote on parts, derive whole. (More consistent, less democratic on the outcome).
      *   *Conclusion-based procedure:* Vote on whole, ignore parts. (More democratic on outcome, potentially inconsistent).
      *   *The AI twist:* The LLM adds noise/probability to the inputs.

  3.  **Determine the Constraints & Realities:**
      *   **Faculty:** Tired, want efficiency, likely resistant to complex math/logic.
      *   **Dean:** Wants legitimacy, consistency, and defensibility (no lawsuits/complaints).
      *   **Chair (User):** Ethical concern about manipulating outcomes via ballot structure.
      *   **GA:** Can handle data analysis (spreadsheets).
      *   **Time:** Limited. Need to prioritize high-impact/low-effort tasks.

  4.  **Drafting the Agenda - Step-by-Step:**

      *   *Phase 1: Diagnosis (The "Stop the Bleeding" Phase).*
          *   Before fixing the voting, we need to know *how often* the contradiction actually happens. If it's rare, don't overengineer.
          *   *Action:* Mine past records. Look for premise/conclusion mismatches.
          *   *Why:* If the paradox is theoretical only, the protocol can be simple. If it's frequent, it's urgent.
          *   *AI Angle:* Check LLM consistency. Is it adding noise or signal?

      *   *Phase 2: The Ethical/Power Dynamic (The "Chair's Burden" Phase).*
          *   The user noted they can steer outcomes by slicing questions. This is the biggest ethical risk.
          *   *Action:* Define standard decomposition rules. Limit Chair discretion.
          *   *Why:* Protects the Chair from accusation of bias. Ensures fairness.
          *   *Literature Check:* Ignore complex impossibility theorems (Arrow, etc.). Focus on *procedural legitimacy*.

      *   *Phase 3: The AI Integration (The "New Variable" Phase).*
          *   How to treat the LLM? Voter? Clerk? Advisor?
          *   *Action:* Decide role based on Phase 1 data. If LLM is noisy, it's a clerk (drafting reasons), not a voter.
          *   *Why:* Faculty won't accept a bot as a voting member. Dean might worry about liability.
          *   *Constraint:* No budget for API tracking, keep it simple.

      *   *Phase 4: The Protocol Draft (The "Deliverable" Phase).*
          *   Write the rules. Premise-based vs. Conclusion-based.
          *   *Action:* Choose Premise-based for consistency (easier to defend to Dean), but allow appeal on Conclusion (satisfies Faculty).
          *   *Why:* Consistency is key for curriculum. Politics can be handled via appeals.

      *   *Phase 5: Validation (The "Dean Proof" Phase).*
          *   Test the protocol on past edge cases.
          *   *Action:* Run the GA on past data with new rules.
          *   *Why:* Shows the Dean it works.

  5.  **Refining the Agenda (Filtering for "What Matters"):**
      *   *Ignore:* Deep mathematical judgment aggregation theory (impossibility theorems). It won't change the protocol.
      *   *Ignore:* Tuning LLM temperature/prompts extensively. It's stochastic; treat it as a black box sampler.
      *   *Focus:* The *process* of decomposition. That's where the power lies.
      *   *Focus:* The *status* of the AI. Is it a vote or a memo?

  6.  **Addressing the Specific Questions:**
      *   *Order:* Data Audit -> Ethical Guardrails -> AI Role -> Protocol Draft.
      *   *Upstream/Downstream:* You can't decide AI role until you know how often humans disagree. You can't write protocol until you limit your own power.
      *   *Tractable:* Spreadsheet analysis by GA. Writing rules.
      *   *Past Records:* Look for "Split Verdicts" (Yes/Yes/No). Look for Chair-dependent outcomes.
      *   *Irrelevant Literature:* Arrow's Theorem (too abstract), complex weighting schemes.

  7.  **Developing the "Defense" (The Why):**
      *   Why this order? Because you need to know the magnitude of the problem before solving it.
      *   Why ignore the math? Because faculty won't follow it, and the Dean cares about risk, not logic puzzles.
      *   Why the AI stance? Because treating AI as a voter is legally/ethically fraught. Treat it as evidence.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Make the actions concrete (e.g., "Ask GA to pull X column").
      *   *Critique:* Did I address the "politics vs. expertise" wrinkle?
      *   *Fix:* Add a step to categorize questions. Expertise questions get different weight/process than political ones.
      *   *Critique:* The user is worried about their own power.
      *   *Fix:* Make "limiting Chair discretion" a high priority. It's the ethical core.

  9.  **Final Polish:** Organize into clear phases. Use the user's language ("rabbit hole," "superpower," "cloud of answers"). Ensure the tone is collegial but rigorous. (This aligns with the "defended agenda" request).

  **(Self-Correction Note on AI):** The user says the LLM gives a "cloud of answers." This implies they are running it multiple times. This is essentially *bootstrap aggregation* (bagging). I should mention that treating this as a "probability of satisfaction" might be more useful than a binary vote. But keep it simple for the faculty. Let's suggest the AI provides *reasoning* not *votes*.

  **(Self-Correction on Literature):** The specific literature is "Judgment Aggregation" (List, Pettit, Kornhauser). The "Doctrinal Paradox" is the key term. I should mention these so the user knows I know, but advise *against* diving deep into the impossibility results.

  **(Final Plan Structure):**
  1.  **Executive Summary:** The core tension (Consistency vs. Democracy).
  2.  **Phase 1: The Audit (Weeks 1-3).** Data first.
  3.  **Phase 2: The Power Constraint (Weeks 4-6).** Limiting the Chair.
  4.  **Phase 3: The AI Role (Weeks 7-9).** Clerk, not Voter.
  5.  **Phase 4: The Protocol (Weeks 10-12).** Writing the rules.
  6.  **What to Ignore:** The theoretical rabbit holes.
  7.  **Data Mining Instructions:** Specific queries for the GA.

