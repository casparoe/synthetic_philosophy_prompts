answer: |-
  1. Lange proposes that central planners can mimic market efficiency by adjusting prices through a trial-and-error procedure based on observable surpluses and shortages. This framework treats economic coordination as a solvable system where price signals adequately transmit all necessary information for allocation.

  2. Hayek counters that relevant knowledge is never given in its entirety to any single mind but exists as dispersed, tacit know-how embedded in specific times and places. Consequently, reducing this contextual judgment to discrete statistical data for a central bureau inevitably strips away the nuanced information required for genuine entrepreneurial discovery.

  3. Viewing the debate dynamically reveals that Lange's trial-and-error rule presupposes a fixed set of alternatives, whereas real market processes involve creating new opportunities that cannot be anticipated by a rule-bound bureaucracy. Institutional learning in a market relies on property rights and profit incentives to drive this discovery, which Lange's public ownership model structurally suppresses.

  4. While Lange successfully demonstrates that socialism is theoretically compatible with logical consistency in equilibrium, he fails to account for the epistemic function of competition as a procedure for uncovering unknown facts. The socialist manager lacks the residual claimancy that motivates the intense, localized scrutiny of cost and opportunity inherent in private entrepreneurship.

  5. Hayek's critique ultimately survives this translation because Lange's mechanism implicitly assumes the very knowledge it seeks to generate is already available in a codifiable form. Therefore, the socialist calculation debate confirms that without private property rights to anchor decentralized judgment, the procedural discovery of knowledge remains impossible.
