answer: |-
  **MEMORANDUM**

  **TO:** Outcomes-Analysis Unit; Procurement Board
  **FROM:** Director, Outcomes-Analysis Unit
  **DATE:** October 26, 2023
  **SUBJECT:** Procedure for Adjudicating Contractor Performance Rankings and Adjustments

  ### 1. Purpose and Scope
  This document establishes the mandatory procedure for calculating quarterly contractor rankings. It resolves conflicts between raw placement rates and risk-adjusted rates. It distinguishes between two distinct policy questions that must not be conflated:
  1.  **Contractor Efficiency:** Did the contractor perform well given the specific clients they accepted? (Used for Performance Bonuses).
  2.  **Agency Value:** Did the State receive sufficient outcomes for the funding provided? (Used for Contract Renewal).

  This procedure applies to all quarterly rankings. It restricts how analysts may adjust data and defines when a statistical reversal is admissible evidence for an appeal.

  ### 2. The Admissibility Test (Variable Provenance)
  Before any adjustment or stratification is calculated, the analyst must verify the *timing* of the variables used to define strata.

  *   **Test:** Compare the `Variable_Record_Date` against the `Client_Enrollment_Date` for every client in the dataset.
  *   **Rule:** A variable is **Admissible** for adjustment *only if* `Variable_Record_Date` $\le$ `Client_Enrollment_Date`.
  *   **Rationale:** Variables recorded after enrollment (e.g., workshop completion, weeks retained) are influenced by the contractor's performance. Adjusting for them hides failure (e.g., dropping hard clients before completion).
  *   **Action:**
      *   If **All Admissible**: Proceed to Stability Test.
      *   If **Any Inadmissible**: Reject the adjustment. The contractor's raw rate stands.
      *   **Authority:** Analyst verifies dates (Fact). Director adjudicates borderline cases (e.g., intake assessment completed 1 hour after enrollment) (Value).

  ### 3. The Stability Test (Minimum Cell Size)
  Stratification is prohibited if it produces unstable estimates. A reversal based on noisy data is not evidence of performance; it is statistical artifact.

  *   **Test:** Count the number of clients ($N$) in every proposed stratum for the contractor in question.
  *   **Rule:** A stratum is **Stable** only if $N \ge 30$.
  *   **Action:**
      *   If **All Strata Stable**: Proceed to Weighting.
      *   If **Any Stratum Unstable**: Reject the fine-grained stratification. Collapse strata to the coarsest level where $N \ge 30$ (e.g., Barrier Index High/Med/Low instead of 10-point scale). If no stable stratification exists, use the Aggregate Raw Rate.
      *   **Authority:** Analyst counts $N$ (Fact). Director sets the threshold ($30$) (Value).

  ### 4. The Weighting Standard (Whose Mix?)
  When a reversal is admissible and stable, we must calculate a Risk-Adjusted Rate. This requires choosing a "Standard Population" to weight the stratum rates. This choice settles the difference between Efficiency and Value.

  *   **Test:** Identify the weights ($W$) applied to the contractor's stratum rates ($R$). Formula: $\text{Adjusted Rate} = \sum (R_{\text{stratum}} \times W_{\text{stratum}})$.
  *   **Rule:**
      *   **For Efficiency (Bonus):** Use **Agency-Wide Weights**. (Question: "If this contractor handled the State's average mix, how would they perform?")
      *   **For Value (Renewal):** Use **Contractor-Specific Weights** (equivalent to Raw Rate) OR a Minimum Volume Threshold. (Question: "Did we get enough jobs for the money spent?")
  *   **Action:**
      *   Analysts will produce two scores: *Efficiency Score* (Agency-Weighted) and *Value Score* (Raw).
      *   **Ranking Determination:**
          *   **Top Tier (Bonus):** Ranked by *Efficiency Score*.
          *   **Bottom Tier (Renewal Risk):** Ranked by *Value Score*, subject to a "Hard Case Waiver" if *Efficiency Score* is Top Tier but *Value Score* is Bottom Tier.
      *   **Authority:** The **Procurement Board** sets the Standard Population weights annually (Value). Analysts apply them (Fact).

  ### 5. Limitations and Board Guidance
  This procedure does not produce a verdict on "truth." It produces a defensible administrative metric.
  *   **Unmeasured Barriers:** If a contractor serves clients with barriers we do not track (e.g., undocumented trauma), this procedure will under-adjust for them.
  *   **Job Quality:** This measures *placement*, not *retention* or *wage growth* beyond the threshold.
  *   **Small Markets:** In rural areas, stable stratification may be impossible. The procedure defaults to aggregate rates, which may penalize specialists.
  *   **Instruction to Board:** Do not treat the ranking as a causal verdict. Treat it as a trigger for review. A "Bottom Tier" ranking indicates a need for audit, not automatic termination.

  ***

  ### Application of Procedure to Pending Cases

  Below is the application of the above procedure to the three recurring contractor protest patterns.

  #### Case 1: The "Hardest Mix" Contractor
  *   **Pattern:** Worst overall rate, best rate within every Barrier Index stratum. Strata are large.
  *   **Step 1 (Admissibility):** Barrier Index is computed at intake. `Record_Date` < `Enrollment_Date`. **PASS.**
  *   **Step 2 (Stability):** Prompt states strata are large. **PASS.**
  *   **Step 3 (Weighting):**
      *   *Efficiency Score:* We apply Agency Weights to their stratum rates. Since they are best in every stratum, their Efficiency Score will be **High**.
      *   *Value Score:* Their Raw Rate is **Low**.
  *   **Outcome:**
      *   **Bonus:** Eligible for Top Tier (High Efficiency).
      *   **Renewal:** Flagged for Bottom Tier (Low Value), *but* qualifies for "Hard Case Waiver."
  *   **Recommendation:** Renew contract, deny performance bonus if volume is too low to meet state needs, or grant bonus based on Efficiency.
  *   **Director's Note:** This aligns with my inclination. They are skilled but serve a niche we struggle to place. We keep them for capacity, not volume.

  #### Case 2: The "Retention" Contractor
  *   **Pattern:** Deficit disappears only when sorting by workshop completion or weeks stayed. Worst on all pre-enrollment variables.
  *   **Step 1 (Admissibility):** Workshop completion and weeks stayed are recorded *after* enrollment. `Record_Date` > `Enrollment_Date`. **FAIL.**
  *   **Step 2 (Stability):** N/A (Adjustment rejected).
  *   **Outcome:** Adjustment is inadmissible. Ranking rests on Raw Rate (or pre-enrollment adjusted rate, which remains worst).
  *   **Recommendation:** Maintain Bottom Tier status. Deny appeal.
  *   **Director's Note:** This aligns with my inclination. This is statistical gaming (collider bias). They are likely dropping clients who look unlikely to succeed to boost their rates.

  #### Case 3: The "Small Rural" Contractor
  *   **Pattern:** Worst overall, best within strata, but only when strata are very fine (6–12 clients). Reversal vanishes on coarse strata.
  *   **Step 1 (Admissibility):** Assume variables are pre-enrollment. **PASS.**
  *   **Step 2 (Stability):** Strata contain 6–12 clients. Threshold is 30. **FAIL.**
  *   **Action:** Reject fine stratification. Collapse to coarse strata (e.g., Rural/Urban or High/Low Barrier). Prompt states reversal disappears on coarse cuts.
  *   **Outcome:** Ranking reverts to Aggregate Raw Rate (or coarse-adjusted rate), which is Bottom Tier.
  *   **Recommendation:** Maintain Bottom Tier status.
  *   **Director's Note:** **This contradicts my inclination.**

  ***

  ### The Counter-Intuitive Decision: Case 3

  **My Inclination:** I want to protect the rural contractor. Rural labor markets are structurally different; a fine-grained reversal suggests they *are* managing local barriers well, even if the volume is low. I am inclined to grant a waiver or accept the fine-strata adjustment to preserve rural access.

  **The Procedure's Verdict:** The procedure forces me to rank them in the Bottom Tier.

  **Reasoning for the Appeals Panel:**
  > "The Board understands the desire to account for rural complexity. However, our procedure includes a Stability Test requiring a minimum of 30 clients per stratum. In this contractor's fine-grained strata, cell sizes range from 6 to 12.
  >
  > At this size, the placement rate is statistically unstable. Recoding the outcome of just two clients changes the ranking tier. If we accept this adjustment, we are not rewarding performance; we are rewarding randomness. A contractor could manipulate their tier simply by how they code two borderline cases.
  >
  > To be fair to all contractors, we must use a standard that is robust to small fluctuations. When we aggregate this contractor's data to a stable level, the performance deficit reappears. Therefore, while we acknowledge the difficulty of the rural market, the data does not support a finding of superior efficiency. We cannot renew a contract based on a statistical artifact."

  **Cost of Simplification:**
  This decision costs us **rural coverage**. By enforcing a strict $N \ge 30$ rule, we effectively penalize small providers who cannot generate volume. We risk driving them out of the network, leaving rural clients with no local services.
  *   **Mitigation:** We should create a separate "Rural Track" with lower volume thresholds in the next contract cycle, rather than bending the statistical procedure.

  ### Implementation Checklist for Analysts
  1.  **Pull Data:** Export quarterly cohort with `Enrollment_Date`, `Placement_Date`, and all Intake Variables.
  2.  **Flag Variables:** Mark any variable with `Record_Date` > `Enrollment_Date` as "Inadmissible."
  3.  **Run Aggregates:** Calculate Raw Placement Rates for all contractors.
  4.  **Run Adjustments:** For any contractor appealing a Bottom Tier ranking:
      *   Filter to Admissible Variables only.
      *   Check Stratum $N$. If any $< 30$, collapse strata.
      *   Calculate Agency-Weighted Rate.
  5.  **Report:** Submit two columns to the Director: *Efficiency Rank* and *Value Rank*. Highlight discrepancies.

