answer: |-
  # The SPI-45 Triage Procedure
  **Purpose:** To rapidly identify proposals that qualify as **Safe Pareto Improvements (SPI)**. An SPI is a change that makes at least one group better off (by their own standards) while making *no* identifiable group worse off, even under uncertain future conditions.
  **Time Allocation:** 45 Minutes
  **User:** Programme Officer (No economics training required)
  **Outcome:** A recommendation to either **Fast-Track (SPI Qualified)**, **Refer for Trade-Off Decision (SPI Failed)**, or **Reject Outright (Fatal Flaw)**.

  ---

  ## Part 1: The Procedure (SPI-45 Checklist)

  ### Step 1: Stakeholder & Impact Mapping (10 Minutes)
  *Goal: Identify who touches this change.*

  1.  **List Affected Groups:** Write down every distinct group affected (e.g., "Northside Residents," "Clinic Nurses," "Data Privacy Office"). Do not group distinct interests together (e.g., do not combine "All Patients" if some gain and some lose).
  2.  **Identify the "Winner":** Which group explicitly gains?
      *   *Standard of Evidence:* A letter of support, survey data, or a metric showing improvement (e.g., "Wait times drop 10%").
  3.  **Identify Potential "Losers":** Which group might face a cost, risk, or reduction in service?
      *   *Standard of Evidence:* Complaint logs, union feedback, or physical constraints (e.g., "Bus stop moved 400m").

  **[STOP CHECK]:** If you cannot identify a clear "Winner" with evidence, **Reject Outright** (No benefit). If you identify a "Loser," proceed to Step 2 (Do not net out their loss against the Winner's gain).

  ### Step 2: The "No Worse Off" Verification (15 Minutes)
  *Goal: Verify that no group suffers a net loss.*

  1.  **Consult the Potential Losers:** Have the identified potential losers been consulted?
      *   *Pass:* Written confirmation from group representatives stating they accept the change with no negative impact.
      *   *Fail:* No consultation, or consultation reveals objections regarding loss of service/access.
  2.  **Check for Compensating Mitigation:** Does the proposal *include* specific measures to remove the loss (e.g., a new shuttle bus for the estate with the longer walk)?
      *   *Pass:* Mitigation is funded and scheduled alongside the change.
      *   *Fail:* Mitigation is promised "later" or is unfunded.
  3.  **The Preference Test:** Does the change violate any stated preference of the affected group?
      *   *Pass:* The group prefers the new state to the old state.
      *   *Fail:* The group prefers the old state (Status Quo), even if the objective metrics look similar.

  **[VALUE JUDGMENT DEMARCATION POINT 1]:**
  *   **Fact:** Staff determines if a metric changes (e.g., "Walk time increases 5 minutes").
  *   **Value:** Staff must treat *any* verified negative metric change as a "Loss." Do not decide if 5 minutes is "negligible." If it is negative, it is a Loss. **Director Sign-off Required** to proceed if a Loss exists (see Step 5).

  ### Step 3: Robustness & Forecast Check (10 Minutes)
  *Goal: Ensure the SPI holds if predictions are slightly wrong.*

  1.  **The "Bad Luck" Scenario:** Imagine the projected benefits are 20% lower and the costs are 20% higher.
      *   *Pass:* The "Winner" still gains, and the "Loser" still experiences zero loss.
      *   *Fail:* The "Winner" might lose, or the "Loser" might incur a new cost.
  2.  **Implementation Risk:** Is there a risk the system fails (e.g., software glitch, driver shortage)?
      *   *Pass:* A rollback plan exists that returns everyone to the Status Quo immediately if failure occurs.
      *   *Fail:* The change is irreversible or difficult to undo.

  ### Step 4: Evidence File Assembly (5 Minutes)
  *Goal: Document the triage.*

  1.  Attach the "Winner" evidence.
  2.  Attach the "No Loser" confirmations (or document the specific Loss found).
  3.  Attach the Robustness notes.

  ### Step 5: Final Triage Decision (5 Minutes)
  *Goal: Route the proposal.*

  *   **Outcome A: Fast-Track (SPI Qualified).** All checks passed. No groups worse off. Robust.
      *   *Action:* Recommend immediate implementation.
  *   **Outcome B: Refer for Trade-Off Decision (SPI Failed).** A specific group is worse off, but the overall gain is large.
      *   *Action:* **Do not implement.** Route to Director.
      *   **[VALUE JUDGMENT DEMARCATION POINT 2]:** The Director must decide if the gain to the "Winner" justifies the uncompensated loss to the "Loser." This is a political/ethical choice, not a technical one.
  *   **Outcome C: Reject Outright.** Illegal, technically impossible, or no identifiable Winner.
      *   *Action:* Close proposal.

  ---

  ## Part 2: Application to Fictional Proposals

  ### Proposal 1: Evening Bus Route Consolidation
  **The Plan:** Merge two low-ridership evening routes into one frequent corridor.
  **Claim:** Higher frequency for 90% of riders; cost savings for Council.

  **SPI-45 Application:**
  1.  **Mapping:**
      *   *Winners:* 90% of riders (frequency doubles), Council Budget.
      *   *Potential Losers:* Residents of "Oakwood Estate" (nearest stop moves from 100m to 600m).
  2.  **Verification:**
      *   *Fact:* Oakwood residents must walk an additional 500m each way.
      *   *Mitigation:* None proposed.
      *   *Preference:* Oakwood residents submitted a petition opposing the stop removal.
  3.  **Robustness:**
      *   If ridership drops, frequency drops, potentially hurting the "Winners" too. No rollback plan specified.
  4.  **Decision:** **Refer for Trade-Off Decision.**
      *   *Reasoning:* This fails the SPI test. Oakwood Estate is demonstrably worse off (longer walk, expressed opposition). The gains to the majority cannot cancel out the loss to the minority under SPI rules.
      *   *Director Action:* The Director must decide if the aggregate efficiency gain justifies the specific hardship to Oakwood. This is a value judgment on equity vs. efficiency.

  ### Proposal 2: Automatic Clinic Appointment Swapping
  **The Plan:** Software automatically fills unused slots in Department A with patients from Department B's waiting list.
  **Claim:** Reduced wait times, zero wasted slots.

  **SPI-45 Application:**
  1.  **Mapping:**
      *   *Winners:* Patients in Department B (faster access), Hospital Admin (efficiency).
      *   *Potential Losers:* Patients in Department A (might lose "their" slot if they need it later?), Data Privacy Stakeholders.
  2.  **Verification:**
      *   *Fact:* Slots are only swapped if confirmed "unused" 24hrs in advance.
      *   *Fact:* Clinical safety check confirms Department B patients are suitable for Department A facilities (e.g., general checkups).
      *   *Preference:* Patient consent forms currently allow "treatment by available clinician."
      *   *Mitigation:* Opt-out available for patients.
  3.  **Robustness:**
      *   *Risk:* If a Department A patient cancels late, can they get the slot back?
      *   *Check:* System allows immediate re-booking priority for original department.
  4.  **Decision:** **Fast-Track (SPI Qualified).**
      *   *Reasoning:* Department B patients gain. Department A patients are not worse off (slots were going unused, priority preserved). Privacy is maintained within existing consent.
      *   *Caveat:* If legal counsel flags that "existing consent" is ambiguous regarding cross-department data sharing, this moves to **Refer for Trade-Off Decision** (Value judgment on data interpretation).

  ---

  ## Part 3: Limitations and Failure Modes

  **What This Procedure Cannot Settlement:**
  1.  **Distributional Justice:** The SPI procedure is inherently conservative. It will reject proposals that help the many at the expense of the few, even if that trade-off is socially desirable (e.g., progressive taxation, zoning for high-density housing). It identifies *efficiency*, not *fairness*.
  2.  **Defining the "Group":** The procedure relies on staff to define stakeholder groups. A clever staff member could gerrymander groups (e.g., splitting "Residents" into "Residents with Cars" and "Residents without Cars") to force an SPI pass or fail.
  3.  **Innovation Stifling:** High-risk, high-reward transformations often create temporary losers during transition. This procedure will systematically filter out transformative change in favor of incremental tweaks.

  **Where It Is Likely to Misfire:**
  1.  **The "Status Quo Bias" Trap:** Because any loss vetoes the proposal, entrenched interests can block improvements by claiming *any* change is a loss (e.g., "I prefer my old bus stop even if the new one is faster").
  2.  **Hidden Compensation:** Staff may try to "game" the system by adding small, unfunded mitigations to claim a "Loser" is neutralized, pushing a Trade-Off decision into the Fast-Track bucket.
  3.  **Information Asymmetry:** The procedure assumes staff can accurately gauge "informed preferences." If a vulnerable group does not know how to articulate their loss (e.g., data privacy risks they don't understand), the procedure will falsely certify an SPI.

  **Final Note to Programme Officer:**
  This tool is a **filter**, not a **governance strategy**. Use it to clear low-friction wins quickly. Do not use it to avoid hard political choices. When the procedure returns a "Refer for Trade-Off" result, you have successfully identified a political decision that requires Director accountability.
