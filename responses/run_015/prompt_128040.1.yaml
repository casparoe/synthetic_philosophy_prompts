answer: |-
  The pint glasses were empty, the thesis deadlines were looming, and Dave was staring into the middle distance like he was trying to read the heat death of the universe in the foam.

  "Malthus wasn't wrong," Dave said, tapping a sticky coaster. "He was just pre-peak phosphorus."

  Sarah rubbed her temples. "Dave, he published in 1798. He's been empirically dead for longer than the United States has existed."

  "Because of synthetic nitrogen," Dave insisted, leaning in. "That was a temporary boundary condition. A loophole. But the Haber-Bosch process relies on finite energy inputs. Once that caps out, the geometric curve resumes. The arithmetic finally bites."

  "So you're arguing a theory can be falsified for two hundred years, then get resurrected because the exception ran out of fuel?"

  "I'm arguing the error bar covers the industrial interlude."

  "An error bar of two centuries isn't statistics, Dave. It's prophecy."

  "But if the population crashes in 2030 because we can't make fertilizer, the data fits the original model perfectly."

  "If I bet on a horse and it finishes last for eight generations because someone built a bridge over the finish line, I don't get to claim I won when the bridge finally rots."

  "Why not? The gravity was still there."

  "Because the bridge wasn't in your model! You're saying being consistently wrong is just part of the calibration process until the world changes back to suit your graph."

  "I'm saying the rescue condition was always implicit."

  Sarah signaled for another round, looking defeated. "So, what? We just keep the theory on life support until the apocalypse validates the methodology?"

  Dave shrugged. "Science is patient."

  "Science is falsifiable. What you're describing is a hostage situation."

  If you can rescue a falsified theory simply by waiting for the counter-evidence to collapse, you haven't validated the model, you've just made it unfalsifiable.
