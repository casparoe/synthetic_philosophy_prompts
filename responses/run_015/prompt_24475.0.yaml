          *   *Why?* If $A$ is both true and false ($b$), and $A \lor B$ is true ($b$), and $\neg A$ is true ($b$), $B$ doesn't have to be designated.
          *   *The Pain:* DS is fundamental to proof by cases and elimination.
          *   *User's Physics Background:* Think of ruling out hypotheses. "Either the particle is here or there. It's not here. Therefore it's there." In LP, if "It's here" is a glut (true and false), you can't conclude "It's there."
          *   *Recovery:* Priest suggests we can use DS *classically* for consistent domains.
