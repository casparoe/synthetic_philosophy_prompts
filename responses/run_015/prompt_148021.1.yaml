prompt: |-
  I spent last weekend in a long argument with a friend who insisted that every case of organizational escalation—continuing a failing procurement, extending a broken contract, funding another tranche of a stalled project—is just Shubik’s dollar auction replayed at scale: once resources are committed, withdrawal becomes more expensive than continuing, so rational agents keep bidding past their true valuation. I think that collapses too quickly, because it treats all prior costs as sunk in the same structural way and ignores whether the environment has a second-place penalty—reputation damage, broken coalition commitments, forfeited option rights, or shadow competitors—such that leaving costs something even if you never “win.” I advise boards and public-agency governance committees, under tight deadlines and with signatures required, on whether to authorize another funding round or terminate. I need a reusable decision procedure—ordered questions, with what counts as a sufficient answer to each, explicit stop/no conditions, and marked handoff points where the issue is organizational identity or face-saving rather than decision-theoretic fact. The procedure should distinguish a true dollar-auction trap, in which withdrawal bears unrecoverable collateral costs regardless of eventual success and there are multi-party reputation stakes, from ordinary sunk-cost confusion or from rational strategic continuation that buys option value or resolves uncertainty. It should include an “exit premium” calculation comparing the full cost of leaving against the expected value of continuing, but only after filtering out costs that are genuinely sunk and non-transferable, and it should flag where rational escalation is being misclassified as pathology. Apply it to two cases: first, a municipal transit authority that has spent sixty percent of its rail-car budget with a vendor now delivering defective units, where termination triggers a two-year litigation freeze and loss of credibility with the state funding authority; second, a research consortium deciding whether to extend a clinical trial that has shown null interim results, where direct extension costs are low but partner trust and publication rights depend on formal completion. Include one case where the procedure recommends termination that the governing body will strongly resist, and state explicitly what the procedure cannot adjudicate—particularly when identity-preservation or coalition maintenance is the real driver and should be named rather than disguised as cost-benefit reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the User's Request:**

      *   **Core Conflict:** The user argues against a friend's claim that *all* organizational escalation is just Shubik's Dollar Auction (where rational agents bid past value due to sunk costs and second-place penalties). The user believes this view is too reductive because it ignores specific structural conditions (second-place penalties, reputation, coalition commitments) and conflates sunk costs with strategic option value.
      *   **User's Role:** Advisor to boards and public-agency governance committees.
      *   **Need:** A reusable decision procedure (ordered questions, sufficient answers, stop/no conditions, handoff points).
      *   **Key Distinctions to Make:**
          *   True Dollar Auction Trap (withdrawal has unrecoverable collateral costs + multi-party stakes).
          *   Ordinary Sunk Cost Fallacy (emotional attachment to past spend).
          *   Rational Strategic Continuation (buying option value, resolving uncertainty).
      *   **Specific Tool:** An "Exit Premium" calculation (Cost of Leaving vs. Expected Value of Continuing), filtered for genuine sunk costs.
      *   **Application:** Apply to two specific cases:
          1.  Municipal Transit Authority (defective rail cars, litigation risk, funding credibility).
          2.  Research Consortium (clinical trial, null results, partner trust/publication rights).
      *   **Requirement:** Include one case where the procedure recommends termination despite resistance.
      *   **Limitation:** Explicitly state what the procedure *cannot* adjudicate (identity preservation, coalition maintenance disguised as cost-benefit).

  2.  **Analyze the Theoretical Underpinnings:**

      *   **Shubik's Dollar Auction:** Key features are (1) sunk bids are lost, (2) *both* highest and second-highest bidders pay (the second-place penalty), (3) escalation leads to values exceeding the prize.
      *   **User's Critique:** Valid. Not all escalation has a second-place penalty. Sometimes quitting just means losing the sunk cost (standard investment), not paying a penalty *plus* losing the cost.
      *   **The "Exit Premium":** This needs to quantify the *penalty* of stopping, distinct from the *sunk cost*.
      *   **Rational Escalation:** Sometimes pouring good money after bad is actually buying a "real option" (e.g., waiting for market conditions to change, learning valuable data).

  3.  **Drafting the Decision Procedure (The "Escalation Audit Protocol"):**

      *   *Structure:* Needs to be step-by-step, actionable, with clear "Stop/Go" signals.
      *   *Phase 1: Structural Diagnosis.* Is this actually a Dollar Auction? (Look for the second-place penalty).
      *   *Phase 2: Sunk Cost Filtering.* Separate past spend from future liability.
      *   *Phase 3: The Exit Premium Calculation.* Quantify the cost of quitting vs. continuing.
      *   *Phase 4: Strategic vs. Pathological.* Is there option value?
      *   *Phase 5: The Identity Handoff.* When to admit it's about face-saving.

  4.  **Developing the "Exit Premium" Formula:**

      *   $Cost_{Leave} = Penalty_{Contractual} + Penalty_{Reputational} + Penalty_{Strategic}$
      *   $Value_{Continue} = Probability_{Success} \times Payoff_{Success} - Cost_{Completion}$
      *   *Decision Rule:* Continue only if $Value_{Continue} > Cost_{Leave}$.
      *   *Crucial Filter:* Do not include sunk costs in $Cost_{Leave}$.

  5.  **Applying to Case 1: Municipal Transit Authority:**

      *   *Situation:* 60% budget spent, defective units.
      *   *Penalties:* 2-year litigation freeze (operational penalty), loss of state funding credibility (reputational/financial penalty).
      *   *Analysis:* This looks like a Dollar Auction because the "second place" (quitting) costs money (litigation + lost future funding).
      *   *Verdict:* Likely Continue (with remediation), *unless* the defects are fatal. Let's make it nuanced. If the defects are fixable, the Exit Premium is high. If the vendor is insolvent, the Exit Premium is irrelevant because success probability is 0. Let's assume vendor is solvent but difficult.
      *   *Resistance:* The board might want to quit to look tough, but the procedure says stay. Or vice versa. The prompt asks for *one* case where the procedure recommends termination that the body will resist. Let's save that for Case 2 or adjust Case 1. Actually, Case 2 (Clinical Trial) is better for "Termination despite resistance" because of the "null results" aspect. Scientists hate killing trials. Let's make Case 1 a "Continue" recommendation (rational escalation) and Case 2 a "Terminate" recommendation (resisting the sunk cost/trap).
      *   *Refinement on Case 1:* The prompt implies the Transit Authority is a classic trap candidate. If the Exit Premium (loss of state funding) is huge, rational escalation dictates finishing.
      *   *Refinement on Case 2:* Clinical trial with null results. Usually, you stop for futility. But here, partner trust/publication rights depend on *completion*. This creates a second-place penalty (loss of consortium standing). However, if the science is dead, continuing is unethical/wasteful. This is the perfect spot for "Terminate despite resistance."

  6.  **Applying to Case 2: Research Consortium:**

      *   *Situation:* Null interim results. Low direct extension cost. High reputational cost to stop (trust/publication).
      *   *Analysis:* Is the "publication right" valuable if the result is null? Yes, null results are publishable. But if the trial is extended *beyond* statistical futility, it's waste.
      *   *The Trap:* Continuing just to keep friends happy is the Dollar Auction.
      *   *Verdict:* Terminate. The "Exit Premium" (hurt feelings) < Cost of Continuing (wasted resources + ethical risk).
      *   *Resistance:* Partners will scream about broken trust.

  7.  **Addressing the "Identity/Handoff" Requirement:**

      *   Need a specific step where the advisor says, "This is no longer math; this is politics/identity."
      *   This happens when the Exit Premium is purely reputational/ego-based and cannot be quantified financially.

  8.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the friend's partial truth but validate the user's critique (Second-Place Penalty is the key discriminator).
      *   **The Protocol:** "The Escalation Audit Protocol (EAP)."
      *   **Steps:** Diagnostic -> Filtering -> Calculation -> Strategic Check -> Identity Handoff.
      *   **Case Studies:** Apply EAP to Transit (Continue) and Consortium (Terminate).
      *   **Limitations:** Explicit section on what EAP cannot do (Identity/Politics).

  9.  **Self-Correction/Review during Drafting:**

      *   *Check:* Did I define "Exit Premium" clearly? Yes, needs to be Cost of Leaving vs. Cost of Continuing.
      *   *Check:* Did I distinguish Sunk Cost from Second-Place Penalty? Yes, this is the core theoretical contribution.
      *   *Check:* Is the tone appropriate? Professional, advisory, board-ready.
      *   *Check:* Did I meet the "one case recommends termination against resistance" constraint? Yes, Case 2.
      *   *Check:* Did I address the "rational escalation misclassified as pathology"? Yes, in the Strategic Option Check.

  10. **Final Polish:** Ensure the distinction between "Sunk Cost Fallacy" (looking back) and "Dollar Auction" (looking at the penalty structure) is sharp. The friend says all escalation is Dollar Auction. The user says only some is. The procedure must prove *which* is which.

      *(Self-Correction on Case 1)*: If the vendor is delivering *defective* units, is continuation rational? Only if the defect is fixable and the cost of switching is higher. I need to make sure the math supports the recommendation. Let's assume the defect is a compliance issue, not a fundamental design failure, making remediation possible.
      *(Self-Correction on Case 2)*: Ensure the "null results" doesn't automatically mean stop. In science, you stop for *futility*. If interim results show no chance of significance, continuing is unethical. The "partner trust" is the Dollar Auction element. The procedure must prioritize the scientific/ethical mandate over the reputational penalty.

  11. **Finalizing the "Identity Handoff":** This needs to be a specific trigger. When the "Reputational Penalty" exceeds quantifiable bounds and becomes about "Who we are," the decision leaves the spreadsheet.

  12. **Drafting the Content:** (Proceeding to generate response based on these thoughts).

      *   *Key Terminology:* Second-Place Penalty (SPP), Exit Premium (EP), Sunk Cost Filter (SCF).
      *   *Format:* Numbered steps, bolded conditions, clear case application.

  13. **Final Review against constraints:**
      *   Reusable decision procedure? Yes.
      *   Ordered questions? Yes.
      *   Sufficient answers/Stop conditions? Yes.
      *   Handoff points (Identity/Face)? Yes.
      *   Distinguish Dollar Auction vs. Sunk Cost vs. Rational? Yes.
      *   Exit Premium calculation? Yes.
      *   Apply to Transit Case? Yes.
      *   Apply to Consortium Case? Yes.
      *   One case recommends termination against resistance? Yes (Consortium).
      *   State limitations (Identity/Coalition)? Yes.

