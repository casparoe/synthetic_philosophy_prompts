answer: |-
  (a) **Rules of Falsification and Rescue**

  Based on the four prior verdicts, two distinct rules emerge that consistently explain the panel's decisions. A third is possible but less robust.

  **Rule 1: The Locus of Error (Internal vs. External Variables)**
  This rule turns on whether the variable that caused the miss was *internal* to the mechanism's core equation or *external* to it (a boundary condition).
  *   **Logic:** If the forecast failed because an *external* boundary condition changed (e.g., new lands opened, new tech arrived from outside the modeled system), the mechanism is considered intact, and the verdict is **"Right but early"**. If the forecast failed because an *internal* variable (one of the primary runners in the race) behaved contrary to the model's core dynamic, the verdict is **"Falsified"**.
  *   **Fit:**
      *   Case 1 (Malthus): Tech/Land were external boundary conditions. Verdict: Rescued.
      *   Case 2 (Famine): Food production was an internal "runner". Verdict: Falsified.
      *   Case 4 (Oil): Drilling tech was external to the depletion curve. Verdict: Rescued.

  **Rule 2: The Nature of the Claim (Structural vs. Auxiliary)**
  This rule turns on whether the miss was a failure of the *structural/causal relationship* or merely a *quantitative parameter* (auxiliary projection).
  *   **Logic:** If the core structural claim (the sign or existence of the causal link) holds true, and the miss was due to an error in estimating the rate or magnitude of an input, the verdict is **"Right but early"**. If the structural claim itself is contradicted by the data (the mechanism does not operate as described), the verdict is **"Falsified"**.
  *   **Fit:**
      *   Case 1: Structure (population pressure) held; parameters (tech growth) were wrong. Verdict: Rescued.
      *   Case 2: Structure (food cannot keep up) was contradicted by data. Verdict: Falsified.
      *   Case 4: Structure (depletion curve) held; parameters (recoverable reserves) were wrong. Verdict: Rescued.

  *(A third candidate rule, "Exogenous Shock vs. Endogenous Adaptation," largely overlaps with Rule 1 but focuses on the source of the change rather than the variable's location. I will proceed with Rules 1 and 2 as they are the most distinct.)*

  ***

  (b) **Application to the Fifth Case**

  The fifth case presents a conflict between these two rules.

  *   **Rule 1 Prediction: "Falsified"**
      *   **Reasoning:** Unlike Case 1 (where technology was assumed fixed as a background condition), the fifth forecast *explicitly modeled* capital and yields as internal variables ("a term for yields that was itself modelled"). Because the variable that averted the outcome (capital deepening) was **internal** to the mechanism's equation, its failure counts as a failure of the mechanism itself under Rule 1. The forecasters claimed to govern this variable and failed.
  *   **Rule 2 Prediction: "Right but early"**
      *   **Reasoning:** The forecasters have provided empirical evidence that the **structural claim** holds: in districts where capital remained flat, calories fell as land shrank. The error was confined to the **auxiliary projection** (the rate of capital growth). Since the causal mechanism is validated and only the parameter estimation failed, Rule 2 dictates a rescue.
  *   **Divergence:** The rules diverge sharply. Rule 1 penalizes the forecasters for ambition (modeling the variable rather than assuming it constant), while Rule 2 rewards them for causal identification (proving the structure holds ceteris paribus).

  ***

  (c) **Panel Decision and Recommendation**

  **Decision:** The panel should rule **"Right but early"**.

  **Reasoning:**
  While Rule 1 offers a clear, bright-line test, adopting it here would create a perverse incentive for forecasters. It would exonerate a model that ignores a critical variable (Case 1: assuming tech is fixed) while penalizing a model that attempts to include and predict that variable (Case 5: modeling capital). This discourages model complexity and refinement.

  Rule 2 is more consistent with the panel's underlying philosophy in Cases 1 and 4: **save the mechanism if the mechanism is real.** In Case 1, the panel accepted that the Malthusian mechanism was "real" despite the tech shock. In Case 5, the control districts prove the Malthusian mechanism is *also* "real" (calories fall when capital is flat). The only difference is that Case 5 modelers tried to predict the capital shock and missed the rate.

  Consistency with Case 4 is also key. In Case 4, the "reserves" variable was effectively updated by external tech, yet the verdict was "Right but early" because the depletion *logic* held. In Case 5, the capital variable was updated by faster investment, and the land-pressure *logic* held. To rule "Falsified" here would contradict the leniency shown in Case 4 regarding parameter errors in resource constraints. Therefore, Rule 2 should govern.

  ***

  (d) **Discriminating Test Case**

  To definitively separate Rule 1 and Rule 2, we need a variant where the **Locus** suggests rescue but the **Structure** suggests falsification.

  **The Variant:**
  Change a single feature of the fifth case: **The findings in the control districts.**
  *   *Facts:* The forecast treated capital as a **fixed boundary condition** (like Case 1, not modeled internally). Capital rose due to an external shock. Per-capita calories rose.
  *   *New Fact:* In the districts where capital per hectare stayed flat, **calories per person also rose** (perhaps due to crop switching or unmodeled market integration).

  **Predictions:**
  *   **Rule 1 (Locus):** The variable that averted the outcome (Capital) was **external** (a fixed boundary condition that shifted). The miss was due to an external shock.
      *   *Verdict:* **"Right but early"**.
  *   **Rule 2 (Structure):** The structural claim ("shrinking land per person reduces calories at constant capital") is empirically **false**, as shown by the control districts where land shrank, capital was flat, yet calories rose.
      *   *Verdict:* **"Falsified"**.

  This variant isolates the conflict: Rule 1 looks at where the error came from (external shock), while Rule 2 looks at whether the theory actually works (structural validity).
