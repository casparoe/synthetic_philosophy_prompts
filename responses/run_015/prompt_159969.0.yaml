  Limits

  This protocol cannot resolve ontological conflicts where physical and spiritual domains overlap, such as animated landscapes. It systematically distorts metaphor by forcing literal tags for legal safety or cultural tags for community respect, rarely capturing both. It guarantees error on historical claims where triangulation is impossible, demoting them to hearsay regardless of speaker certainty. The procedure becomes intuition whenever the runner judges plausibility without linguistic competence, specifically in the neighborhood test and domain classification. Ultimately, it records the linguist's confidence, not the speaker's meaning, whenever the budget expires or the community veto is exercised.
