  I retained Charity as a spendable budget to force explicit costs for attributing error, though denominating it arbitrarily risks false precision. Humanity became a domain switch: physical claims demand truth (Charity), cultural claims demand situational coherence (Humanity), which distorts hybrid statements. Triangulation is a binary voucher check; failing it demotes facts to testimony, losing evidentiary weight for land claims. Holism is a three-sentence substitution test; this misses broader discourse coherence. Prior/Passing theory becomes an expiration date on glosses, enforced by the community researcher for public outputs. The cost is nuance: gradient uncertainty is forced into pass/fail gates, and the budget creates a hard stop where theoretical flexibility is needed. Judgment is masked as procedure in plausibility checks and domain classification.

