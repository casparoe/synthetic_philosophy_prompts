  **Executive Summary**
  Your team's comparative advantage lies in formal modeling and conceptual reconstruction, not meta-ethical revisionism or empirical validation. The primary risk to this project is not a lack of ideas, but "model drift"—spending three years refining a theory that is either formally incoherent or operationally paralyzed. The agenda below prioritizes **existence proofs** (can the math work?) over **scope definitions** (where does it apply?) and **applications** (how do we use it?). Line 4 is flagged as a high-risk strategic pivot that may dissolve the project rather than solve it.

  ---

  ### 1. Priority Ranking & Justification

  **Priority 1: Line 3 (Formal Representation of Incomparability)**
  *   **The Question:** Can "sub-threshold pleasure" be modeled as genuinely incomparable with "above-threshold pain" without collapsing into cardinal utilitarianism or causing decision paralysis?
  *   **Reasoning:** This is the **Existence Proof**. If lexical thresholds cannot be formally represented without violating basic axioms of rational choice (e.g., orderability, continuity, or non-imprintability), the theory is incoherent regardless of scope or metric. This line leverages your formal ethicist and decision theorist most directly. It is the "kill switch": if this fails, the project terminates.
  *   **Tractability:** High. This is pure formal ethics/decision theory. It requires constructing preference orderings or value functions that accommodate lexical gaps.
  *   **Upstream Status:** All other lines depend on this. If the core comparison is incoherent, aggregation rules (Line 1), risk calculations (Line 2), and metric shifts (Line 4) are moot.

  **Priority 2: Line 1 (Scope of Lexical Priority)**
  *   **The Question:** Does lexical priority operate intra-personally, inter-personally, or both? Does mixing them break aggregation?
  *   **Reasoning:** This is the **Domain Definition**. Once you know a lexical model *can* exist (from Line 3), you must define *where* it applies. Intra-personal thresholds constrain individual prudence; inter-personal thresholds constrain population ethics. Mixing them often triggers impossibility theorems (e.g., violations of separability or anonymity).
  *   **Tractability:** High. Your welfare philosophers and formal ethicist can map this using standard population ethics tools.
  *   **Dependency:** Depends on Line 3. You cannot define aggregation rules for a value structure that hasn't been proven coherent. However, settling Line 1 early constrains the specific formal models tested in Line 3 (e.g., vector-based vs. scalar-based representations).

  **Priority 3: Line 2 (Threshold Triggers & Risk)**
  *   **The Question:** Does the threshold require actual suffering or risk-weighted potential suffering? Implications for AI design?
  *   **Reasoning:** This is the **Operational Layer**. This translates the static value theory (Lines 3 & 1) into dynamic choice under uncertainty. It is crucial for the "artificial-agent" application but is downstream of the value theory.
  *   **Tractability:** High for the decision theorist, provided Lines 1 and 3 are settled.
  *   **Dependency:** Heavily dependent on Lines 1 and 3. You cannot calculate the expected value of a risk if you cannot compare the outcomes (Line 3) or define whose outcomes count (Line 1).

  **Priority 4: Line 4 (Metric Shift: Preference/Capability)**
  *   **The Question:** Does replacing cardinal welfare with preference/capability metrics dissolve the commensurability problem?
  *   **Reasoning:** This is the **Escape Hatch**. It looks foundational, but for a team tasked with resolving bottlenecks *in LTNU*, this risks changing the subject. LTNU is typically committed to suffering as a cardinal disvalue. Shifting to preferences often relocates the commensurability problem (e.g., how to weigh intense preference frustration against mild satisfaction) rather than solving it.
  *   **Tractability:** High for welfare philosophers, but low yield for the *specific* goal of fixing LTNU.
  *   **Dependency:** Independent. This is an alternative framework. Pursuing this effectively pauses work on Lines 1–3.

