answer: |-
  **Opening Address**

  Welcome to Weimar. It is a fitting place for us. This city stands for the height of German culture, and also for its deepest complicity. It is a place of Goethe and of Buchenwald. That tension is why we are here.

  I want to begin with a word. It is the word that brought many of you to this foundation. *Vergangenheitsbewältigung*. It is the German term for coming to terms with the past. It is often translated as "mastering the past." But I want to suggest we listen to the verb inside that noun. *Bewältigen*. In German, you use this word for a workload you clear off your desk. You use it for a crisis you manage and resolve. It implies a finish line. It suggests that there is a state of being "done."

  This is a trap. If we believe this work has an endpoint, we will stop too soon.

  For the friends joining us from Japan, Turkey, and the American South: You are often told you are "behind" Germany. That you have not yet "mastered" your history. I reject this. It flatters us Germans with a story that is partly false. For decades, we did not speak of the Wehrmacht. We did not speak of the non-Jewish victims. We were not always virtuous. And it insults you. It suggests your prosecutions, your textbook battles, your campaigns for markers are merely steps on a ladder we have already climbed. We have not climbed it. The ladder leans against a wall that keeps moving.

  But there is a second trap. Some say every society must find its own way. That memory is relative. That what happened in Alabama cannot be judged by what happened in Auschwitz. This sounds like tolerance. In this room, we know it is often a cover for silence. It is the argument of the man who wants the Confederate monument to remain on the courthouse square. He says, "This is our way. Let us be." If we accept that memory is purely local, we surrender the truth that state violence shares a logic across borders.

  So, why are we here? If we are not here to copy Germany, and we are not here to agree that everything is relative, what is the work?

  We are here to confirm that this work has no perfect tense. It is not a construction project; it is maintenance. It is gardening in a climate that favors weeds.

  Look around this room. We have a novelist tried for his words. We have a teacher fighting the state curriculum. We have a campaigner for a lynching marker. And we have a neighbor who defends the old stone. You are all necessary to this process. Not because you agree, but because the friction between you is the work itself.

  The German example does not license you to build specific memorials. It does not license you to demand apologies that may not come. What the German example licenses is the right to be annoying. It licenses the refusal to let the ledger close. When we built our memorials, we thought we were finishing the job. We were wrong. Today, in Germany, the Alternative für Deutschland sits in parliament. The rhetoric of purity returns. The work we thought was *bewältigt*—finished—is breathing again.

  This is the only lesson we have to offer: Do not envy our monuments. Envy nothing. Understand that your struggle in Japan over textbooks is the same struggle we face now over what we teach about the Holocaust. Your struggle in Turkey to name 1915 is the same struggle we face when we try to name the colonial crimes that preceded the war. Your struggle in Alabama to name the lynching is the same struggle we face when we try to protect the sites of terror from being turned into sites of tourism.

  We are not a model. We are a warning. We are proof that even when you think you have succeeded, the past will try to reclaim you.

  So, for the next two days, let us not compare our progress. Let us compare our resistance. Let us share the tools we use when the politics turn against us. Let us acknowledge that the man who defends the monument is not an obstacle to be removed, but a symptom to be managed. He wants closure. He wants to check the box. Our job is to keep the box open.

  We are here to learn how to endure the endlessness of this task. We are here to tell each other that when we are tired, it is not because we are failing. It is because the work is designed to be tiring. It is designed to outlast us.

  Let us begin.

  ***

  **Meta-Commentary on Rhetorical Liberties**

  In writing this address, I leaned on three claims I would hesitate to defend in a peer-reviewed journal. First, I simplified the etymology and usage of *Vergangenheitsbewältigung*. While *bewältigen* does imply mastering a task, in German philosophical discourse (Adorno, the Frankfurt School), the term carries a heavy weight of psychological and moral processing that is not merely administrative; I flattened this nuance to make the "workload" metaphor land quickly for non-German speakers. Second, I asserted a functional equivalence between the Holocaust, the Armenian Genocide, Japanese war crimes, and American lynching. While I argue they share a "logic of state violence," a historian would demand I qualify the structural and industrial differences between these events to avoid the charge of trivialization. Third, I framed the Confederate monument defender as a necessary "symptom" of the memory process. In print, I would need to rigorously distinguish between engaging with denialism as a pedagogical challenge versus legitimizing it as a valid part of the discourse; here, I used that framing rhetorically to prevent the audience from dismissing him entirely, which would undermine the call for endurance over victory.
