prompt: |-
  I sit on the advisory board of a foundation that makes effective-altruism-style grants across global health and long-run causes such as institutional reform and catastrophic-risk reduction. Every funding cycle, its program officers face the same problem: consequentialism tells them to rank proposals by expected total consequences, but they are clueless about most of those consequences beyond a short horizon. Write a decision procedure a program officer, not a philosopher, could run on a proposal before it goes to the funding committee: the questions to ask in order to tell simple cluelessness (unmodeled effects that wash out symmetrically across the live options) from complex cluelessness (reasons pulling in different directions that don't net out); what counts as a sufficient answer at each step; where the procedure stops and returns no ranking; and where it instead hands the call to the committee, because what's left is a question of values rather than a further fact. Run it on two live grants -- a global-health intervention with well-modeled near-term effects, and a policy-advocacy grant meant to shift a long-run institution -- and don't soften the verdict if the foundation's favored long-termist bet is the one that fails.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Advisory board member of an Effective Altruism (EA) style foundation.
      *   **Audience:** Program Officers (POs) - practical, not philosophers.
      *   **Problem:** Consequentialism demands ranking by expected total consequences, but POs face "cluelessness" (uncertainty about long-term/indirect effects).
      *   **Task:** Create a decision procedure to distinguish *simple cluelessness* (uncertainties cancel out) from *complex cluelessness* (uncertainties bias outcomes or don't cancel).
      *   **Requirements:**
          *   Questions to ask at each step.
          *   Criteria for "sufficient answer."
          *   Stopping conditions (when to return "no ranking").
          *   Hand-off conditions (when to pass to the committee as a values question).
          *   **Test Case:** Run the procedure on two grants:
              1.  Global Health (well-modeled, near-term).
              2.  Policy Advocacy (long-run institutional shift).
          *   **Constraint:** Do not soften the verdict if the long-termist bet fails the test (intellectual honesty).

  2.  **Deconstruct "Cluelessness" (Greaves/Hilgreaves Framework):**
      *   *Simple Cluelessness:* We don't know the side effects, but we have no reason to think they favor Option A over Option B. (e.g., saving a life might lead to them committing a crime or writing a symphony; no reason to expect one over the other). Expected value remains robust.
      *   *Complex Cluelessness:* We don't know the side effects, and there are *reasons* to think they might systematically favor one option, or the uncertainties are correlated in a way that breaks symmetry. (e.g., institutional change might lock in bad values vs. good values).

  3.  **Drafting the Decision Procedure (The "Cluelessness Audit"):**
      *   *Goal:* Make it actionable. Flowchart style but in text.
      *   *Step 1: Direct Impact Assessment.* (The baseline).
      *   *Step 2: The Symmetry Test (Simple Cluelessness).* Are the unknown effects random noise?
      *   *Step 3: The Systematic Bias Test (Complex Cluelessness).* Are there reasons to suspect directional bias in the unknowns?
      *   *Step 4: The Tractability/Checkability Test.* Can we reduce this uncertainty?
      *   *Step 5: The Verdict.* Fund, Reject, or Escalate.

  4.  **Refining the Steps (Iterative Polish):**
      *   *Step 1:* Focus on the "Direct Chain." What happens immediately?
      *   *Step 2:* Ask: "Does the uncertainty look like noise?" If yes, ignore it (Simple Cluelessness).
      *   *Step 3:* Ask: "Is there a mechanism for lock-in, path dependence, or value drift?" If yes, flag it (Complex Cluelessness).
      *   *Step 4:* If Complex Cluelessness exists, can we model it? If not, we can't rank.
      *   *Hand-off:* If the uncertainty is irreducible but the potential upside is huge (Pascal's Mugging territory), it's a risk-tolerance question, not a fact question. Pass to Committee.

  5.  **Running the Test Cases:**

      *   **Grant A: Global Health (e.g., Bed Nets/Malaria).**
          *   *Direct:* Lives saved, QALYs gained. High confidence.
          *   *Simple Cluelessness:* What do saved people do? Consume resources? Have kids? Symmetric.
          *   *Complex Cluelessness:* Does it strain local governance? Population growth effects? Usually considered second-order or symmetric in EA models.
          *   *Verdict:* Robust. Rankable.

      *   **Grant B: Policy Advocacy (e.g., AI Governance/Institutional Reform).**
          *   *Direct:* Policy passed, agency created. Medium confidence.
          *   *Simple Cluelessness:* Which specific bureaucrats get hired? Noise.
          *   *Complex Cluelessness:* Does this institution lock in a specific worldview? Does it increase state capacity that could be used for bad ends later? Does it create a false sense of security? These are *directional*.
          *   *Verdict:* High Complex Cluelessness. Hard to rank against A without value judgments on risk tolerance.

  6.  **Addressing the "Don't Soften the Verdict" Constraint:**
      *   Many EA foundations favor long-termist causes. If the procedure shows the long-termist cause is unrankable due to complex cluelessness, I must state that clearly. I cannot fudge the math to make the "sexy" long-termist grant look better.
      *   *Implication:* The procedure might conclude that the Global Health grant is *rationally superior* for a consequentialist seeking robustness, or that the Policy grant requires a value judgment the PO cannot make.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the PO's constraint (time, expertise).
      *   **The Procedure (The "Cluelessness Filter"):** 4 Steps + Decision Matrix.
      *   **Application:** Run Grant 1 (Health) and Grant 2 (Policy).
      *   **Conclusion:** Summary of findings.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use plain language. Instead of "epistemic symmetry," use "does the uncertainty cancel out?"
      *   *Critique:* Is the distinction between PO and Committee clear?
      *   *Fix:* PO handles facts/models. Committee handles risk tolerance/values.
      *   *Critique:* Did I address "where it stops"?
      *   *Fix:* Explicitly state "Stop and Rank" vs. "Stop and Escalate."

  9.  **Final Polish:** Check tone. Needs to be professional, directive, and rigorous. Ensure the distinction between Simple and Complex cluelessness is the core engine of the procedure. (Hilary Greaves' work is the philosophical backbone here, translated into ops).

  *(Self-Correction on the "Verdict"):* The prompt asks me to run the procedure *on* the grants. I need to simulate the output of the procedure for each. I must ensure I don't bias towards the long-termist grant just because the foundation likes them. If the health grant wins on robustness, say so.

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # The Cluelessness Filter: A Decision Procedure for Program Officers

  **Purpose:** To distinguish between uncertainties that cancel out (Simple Cluelessness) and uncertainties that bias outcomes (Complex Cluelessness), allowing for robust ranking of grant proposals without requiring omniscience.
  **User:** Program Officer (PO).
  **Input:** A grant proposal with a theory of change.
  **Output:** A recommendation to (A) Rank by Expected Value, (B) Reject due to unmodelable risk, or (C) Escalate to Committee as a Values/Risk-Tolerance question.

  ---

  ## Part 1: The Procedure

  ### Step 1: The Direct Chain Audit
  **Question:** What are the direct, first-order consequences of this grant within a 5-year horizon?
  *   **Action:** List the causal chain from *Funds Disbursed* $\rightarrow$ *Activity* $\rightarrow$ *Output* $\rightarrow$ *Outcome*.
  *   **Sufficient Answer:** We have empirical data or strong mechanistic models for at least 80% of the expected value (EV) calculation.
  *   **Fail Condition:** If the primary value proposition relies entirely on effects >10 years out with no intermediate milestones, flag for **Step 3**.

  ### Step 2: The Symmetry Test (Filtering Simple Cluelessness)
  **Question:** regarding the consequences *beyond* the Direct Chain (e.g., what beneficiaries do with saved resources, long-term demographic shifts): Do we have reason to believe these effects systematically favor one option over the other?
  *   **Action:** Compare the proposal against the counterfactual (or the next best alternative).
  *   **Criteria for Simple Cluelessness (Ignore):** The unknown effects are random noise. (e.g., "A saved child might become a criminal or a scientist; we have no reason to expect one over the other.")
  *   **Criteria for Complex Cluelessness (Flag):** There is a plausible mechanism for directional bias. (e.g., "This intervention increases state capacity, which historically correlates with both stability and authoritarianism.")
  *   **Decision:**
      *   If **Simple**: Treat as zero net impact. Proceed to Ranking.
      *   If **Complex**: Proceed to Step 3.

  ### Step 3: The Lock-In & Path Dependence Check
  **Question:** Does this intervention alter the *trajectory* of a system in a way that is hard to reverse?
  *   **Action:** Identify if the grant creates institutional lock-in, technological path dependence, or value crystallization.
  *   **Sufficient Answer:** We can model the "downside variance." We know what the bad outcome looks like and can assign a probability.
  *   **Fail Condition:** We cannot enumerate the bad outcomes, or the bad outcomes involve existential/terminal risks that we cannot probability-weight.
  *   **Decision:**
      *   If **Modelable**: Proceed to Ranking (with high variance discount).
      *   If **Unmodelable**: Proceed to Step 4.

  ### Step 4: The Escalation Threshold
  **Question:** Is the remaining uncertainty a matter of *fact* or *values*?
  *   **Action:** Determine if more research could resolve the uncertainty.
  *   **Decision:**
      *   If **Fact** (e.g., "We don't know if this policy will pass"): **Reject** or request redesign. A PO cannot rank on guesswork.
      *   If **Values** (e.g., "We don't know if we should prioritize a 10% chance of utopia over a 100% chance of saving lives"): **Escalate to Committee**. This is a risk-tolerance question, not an EV calculation.

  ---

  ## Part 2: Running the Procedure on Live Grants

  ### Grant A: Global Health (Malaria Vector Control)
  **Proposal:** $2M for insecticide-treated bed net distribution in a high-prevalence region.
  **Theory of Change:** Nets $\rightarrow$ Reduced Bites $\rightarrow$ Reduced Infection $\rightarrow$ Reduced Mortality/Morbidity.

  **Step 1: Direct Chain Audit**
  *   **Assessment:** High confidence. RCTs exist. Cost-per-life-saved is well-established ($3k-$5k range).
  *   **Result:** **Pass.** 90% of EV is within the 5-year horizon.

  **Step 2: The Symmetry Test**
  *   **Assessment:** What about the long-term? Saved children grow up, consume resources, emit carbon, vote, work.
  *   **Analysis:** Do these effects favor the "No Grant" option? No. Do they favor the "Grant" option? No. They are symmetric uncertainties regarding the *counterfactual* of death. While population growth has economic and environmental impacts, there is no robust evidence that saving these specific lives systematically leads to net negative long-term outcomes compared to them dying.
  *   **Result:** **Simple Cluelessness.** Treat as noise.

  **Step 3: Lock-In Check**
  *   **Assessment:** Does this create institutional lock-in?
  *   **Analysis:** No. It is a consumable good distribution. It does not alter governance structures or lock in a specific technological paradigm.
  *   **Result:** **Pass.**

  **Step 4: Escalation Threshold**
  *   **Assessment:** Is there unmodelable value uncertainty?
  *   **Analysis:** No. The trade-off is primarily between immediate certain good vs. speculative long-term good.
  *   **Result:** **Stop and Rank.**

  **PO Verdict for Grant A:**
  **Rankable.** The EV is robust to cluelessness. The uncertainties are simple and symmetric. The number generated by the cost-effectiveness model is a reliable proxy for expected value.

  ---

  ### Grant B: Policy Advocacy (International AI Governance Institution)
  **Proposal:** $2M to fund a think-tank/lobbying effort to establish a new international regulatory body for AI development.
  **Theory of Change:** Advocacy $\rightarrow$ Policy Adoption $\rightarrow$ Institution Created $\rightarrow$ Safety Standards Enforced $\rightarrow$ Catastrophe Averted.

  **Step 1: Direct Chain Audit**
  *   **Assessment:** Medium confidence. We can model the lobbying success probability (e.g., 20% chance of policy adoption).
  *   **Problem:** 80%+ of the claimed EV relies on effects >10 years out (the institution actually preventing a catastrophe).
  *   **Result:** **Flag.** Proceed to Step 2.

  **Step 2: The Symmetry Test**
  *   **Assessment:** What are the side effects of creating a new international bureaucracy?
  *   **Analysis:**
      *   *Potential Positive:* Coordination, reduced arms race dynamics.
      *   *Potential Negative:* Regulatory capture by incumbents, stifling of open-source safety research, creation of a false sense of security, centralization of power that could be co-opted by bad actors later.
      *   *Symmetry:* These are **not symmetric**. There is a plausible directional argument that centralized governance *increases* certain types of catastrophic risk (e.g., single point of failure) while decreasing others (e.g., uncoordinated race).
  *   **Result:** **Complex Cluelessness.** The unknowns do not wash out; they pull in opposite directions with unknown magnitudes.

  **Step 3: Lock-In Check**
  *   **Assessment:** Does this alter the trajectory irreversibly?
  *   **Analysis:** Yes. International treaties and institutions are hard to dissolve. If the institution locks in a safety standard that turns out to be flawed (e.g., favoring specific compute thresholds that are easily bypassed), it may be impossible to correct before a catastrophe occurs.
  *   **Modelability:** Can we probability-weight the "Bad Institution" scenario? No. We lack historical data on AI governance institutions because none exist. We are estimating the probability of a black swan event based on expert elicitation, not data.
  *   **Result:** **Fail.** Unmodelable variance.

  **Step 4: Escalation Threshold**
  *   **Assessment:** Is this a fact or values question?
  *   **Analysis:** We cannot fact-check the long-term impact. The decision rests on how much risk the foundation is willing to take on "long-shot, high-impact" bets versus "robust, near-term" bets. It also rests on a value judgment: Is it better to try to shape the future (risking making it worse) or to alleviate current suffering?
  *   **Result:** **Escalate to Committee.**

  **PO Verdict for Grant B:**
  **No Ranking Possible.** The proposal fails the Cluelessness Filter. The EV calculation is dominated by complex cluelessness and unmodelable lock-in risks.

  ---

  ## Part 3: Final Recommendation to Committee

  **To:** Funding Committee
  **From:** Program Officer
  **Subject:** Comparative Ranking of Health vs. Policy Grants

  **Summary:**
  I have applied the Cluelessness Filter to the two priority grants.

  1.  **Global Health Grant:** Passed all filters. The uncertainties are simple. The EV estimate is robust.
  2.  **Policy Advocacy Grant:** Failed at Step 3/4. The uncertainties are complex and directional. The potential for negative lock-in is non-trivial and unmodelable.

  **The Hard Truth:**
  Strict consequentialist ranking requires comparing Expected Values.
  *   Grant A has a robust, positive EV.
  *   Grant B has a highly speculative EV with a significant, unquantifiable probability of negative value (due to complex cluelessness regarding institutional lock-in).

  **Decision Point:**
  As a Program Officer, I cannot rank Grant B above Grant A based on *facts*. To fund Grant B over Grant A is not an optimization decision; it is a **risk-tolerance decision**.

  *   If the Foundation's goal is **maximize robust expected good**: Fund Grant A.
  *   If the Foundation's goal is **maximize upside potential regardless of variance**: Fund Grant B.

  This is not a question I can answer with further research. It requires the Committee to declare its risk appetite. I recommend funding Grant A as the baseline and treating Grant B as a separate "high-risk venture" bucket, explicitly acknowledging that we are violating the robustness principle to chase tail outcomes.

  **Recommendation:** Do not merge these into a single ranked list. They are different asset classes. Fund Health from the "Impact" budget; vote on Policy separately as a "Venture" bet, with the explicit understanding that the EV model is broken.
