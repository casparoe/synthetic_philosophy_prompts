answer: |-
  You have independently rediscovered several central problems in the philosophy of science, mind, and information theory. Because you are working in interpretability, you are effectively doing empirical metaphysics: you are asking what *exists* inside a system when we say it "knows" or "tracks" something.

  Here is the carving you are looking for. It is not a single word, but a framework composed of three interlocking concepts: **Levels of Abstraction**, **Projectibility**, and **Causal Intervention**.

  ### 1. The Low-Level vs. High-Level Distinction
  **Concept:** *Levels of Abstraction (LoA)*
  **Proponent:** Luciano Floridi (Philosophy of Information)

  Your colleague's claim (that only the low-level is "really there") is a position called **Reductive Physicalism** or **Eliminativism**. It is technically coherent but pragmatically dead.

  Floridi argues that "truth" is always relative to a chosen Level of Abstraction. An LoA is a set of observables and rules for interpreting them.
  *   **Low LoA:** Voltages, weights, opcodes.
  *   **High LoA:** Variables, functions, semantic intent.

  **The Carving:** A high-level description is not a "projection" in the pejorative sense; it is a **lossy compression that preserves causal structure**.
  If the low-level description is the *implementation*, the high-level description is the *interface*. In software engineering, we do not say the API is "unreal" because the assembly code is "more real." The API captures the *invariants* that remain stable even if the implementation changes.

  **Boundary Case:** If a high-level description breaks whenever the low-level implementation is refactored (e.g., weights change but input/output mapping stays identical), it was not a true high-level description; it was an artifact of the specific implementation. A robust high-level description is **multiply realizable**.

  ### 2. The "Empty" Interpretation Problem
  **Concept:** *Projectible Predicates / The New Riddle of Induction*
  **Proponent:** Nelson Goodman (1955)

  You asked why "it outputs what it outputs" is empty despite being true. Goodman called this the problem of **Projectibility**.

  Goodman invented a predicate called "Grue." An object is *Grue* if it is green before time $T$ and blue after time $T$. If you observe only emeralds before time $T$, the hypothesis "All emeralds are green" and "All emeralds are grue" fit the data perfectly. They are predictively equivalent *until* $T$.

  Your "empty" interpretation ("it computes whatever its weights dispose it to compute") is a **Grue-like predicate**. It fits the past data perfectly but has zero **compressive power** and zero **generalization power**.

  **The Carving:** A valid interpretation must satisfy **Minimum Description Length (MDL)**.
  $$ \text{Value of Model} = \text{Compression of Data} - \text{Complexity of Model} $$
  The statement "it outputs what it outputs" has a model complexity roughly equal to the data itself. It offers no compression. A valid interpretation (e.g., "it is counting") compresses the observed behavior into a simpler rule that generates the behavior.

  **Boundary Case:** If the system is truly random, no high-level description will compress the data. In that case, the "empty" description is actually the *correct* one. The "hard work" you mention is the search for compression that doesn't exist.

  ### 3. The Incompatible Descriptions Problem
  **Concept:** *Indeterminacy of Translation* & *Causal Intervention*
  **Proponents:** W.V.O. Quine (Linguistics) / Judea Pearl (Causality)

  This is your first and deepest problem. You have two descriptions (Tracking X vs. Tracking Z) that fit all observational data but are incompatible.

  Quine called this the **Indeterminacy of Translation**. In his famous "Gavagai" thought experiment, a native says "Gavagai" when a rabbit runs by. Does "Gavagai" mean *rabbit*, *undetached rabbit parts*, or *rabbit-ing event*? All observational data is identical. Quine argued there is no "fact of the matter" distinguishable by observation alone.

  However, in engineering and interpretability, we have a tool Quine didn't emphasize enough: **Intervention**.

  **The Carving:** Two descriptions that tie on *observational* power may diverge on *interventional* power.
  *   **Description A:** "The module tracks $X$."
  *   **Description B:** "The module tracks $Z$."

  If $X$ and $Z$ are perfectly correlated in the training data, you cannot distinguish them observationally. But if you can **intervene** (e.g., activate the module artificially, or feed out-of-distribution data where $X$ and $Z$ diverge), one description will predict the failure mode correctly, and the other will not.

  If they tie on *all possible interventions* (including weight perturbations, input changes, and environmental shifts), then they are **notational variants**. They are mathematically isomorphic, and the distinction is indeed merely "a manner of speaking."

  However, you noted that finding the interpretation was "hard work." This suggests one description aligns with the **causal structure** of the network (the actual computational graph), while the other is a post-hoc rationalization.
  *   **Real:** Supports counterfactuals ("If I ablate this neuron, the tracking stops").
  *   **Mere Manner of Speaking:** Fails under intervention ("I ablated the neuron, but the system routed around it, so it wasn't really tracking X there").

  ### Summary: The Definition You Need

  You are looking for the criteria for **Explanatory Depth**.

  A high-level description earns its keep if it satisfies three conditions:

  1.  **Compression (Goodman/MDL):** It describes the system's behavior using fewer bits than the raw output trace. (Rules out "it does what it does".)
  2.  **Stability (Multiple Realizability):** It remains valid under minor low-level perturbations (refactoring, noise, pruning). (Rules out descriptions tied to specific weight values.)
  3.  **Interventional Robustness (Pearl):** It correctly predicts the system's behavior under *counterfactual* conditions (ablations, adversarial inputs, distribution shifts). (Rules out incompatible descriptions that only fit training data.)

  **Regarding your colleague:**
  The low-level description is **ontologically fundamental** (it is what exists physically), but the high-level description is **causally emergent** (Erik Hoel's *Causal Emergence*).
  In complex systems, the macro-state (the high-level description) can sometimes have *higher* effective information than the micro-state because the micro-state contains noise. If the low-level is "unusable in practice," it is because it is too noisy to support reliable causal reasoning. The high-level description is "real" in the sense that it captures the **signal** distinct from the **noise**.

  **The Label:**
  If you need a single term for the property that makes a description valid, it is **Projectibility**.
  If you need a term for the relationship between the two levels, it is **Implementation Independence**.
  If you need a term for the work you are doing, it is **Reverse-Engineering the Causal Graph**.

  **Where the concepts might fail you:**
  In deep learning, "Incompatible Descriptions" (Point 1) often arise because the system is **polysemantic** (one neuron represents multiple features). In this case, *both* descriptions might be partially true, and the "incompatibility" is a failure of your human ontology (which assumes one concept = one module) rather than the system itself. This is where the philosophical concept of **Vagueness** or **Fuzzy Boundaries** applies. The system might not "track X" in the boolean sense, but rather "encodes a subspace where X is a basis vector."

  **Recommendation:**
  Read **"The Intentional Stance" by Daniel Dennett**. He argues exactly your point: that believing a system "believes" or "tracks" something is not a metaphysical claim about its soul, but a pragmatic claim that treating it as such is the most efficient way to predict its behavior. He calls this **Instrumental Realism**. It validates your work without requiring you to prove the "ghost in the machine."
