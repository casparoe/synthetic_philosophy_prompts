      *   **Pricing the Repairs:**
          *   *Rejecting (1):* Cost = Accepting Constitutive Luck. (Retribution dies).
          *   *Rejecting (2):* Cost = Weakening "Control." (Allows Dana to pass). This is the Compatibilist move.
          *   *Modifying (3):* Cost = Stopping the Regress arbitrarily or positing a "Self" that exists prior to motives (Kantian noumenal self?).
