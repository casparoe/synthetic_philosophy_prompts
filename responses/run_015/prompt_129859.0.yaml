      *(Refining the Generalization)*: The user is right that Strawson's argument is metaphysical, not just ethical. It attacks the coherence of *self-determination*. Acknowledging this validates their worry but frames it as a feature, not a bug, of Strawson's view. The "repair" is to deny the metaphysical scope.

