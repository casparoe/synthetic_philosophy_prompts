          *   *Cost of Blocking:* Need to find a disanalogy between moral responsibility and epistemic justification (or action ownership).
          *   *Friend's Suggestion:* Source-involving vs. State-involving.
          *   *Critique of Friend:* Hard to sustain. If I'm not responsible for my reasoning faculties, am I justified? If I'm not the author of my movement, is it an action?

  5.  **Address the Specific Questions:**

      *   *Where does it go wrong?* Most likely (2). It sets the bar for "responsibility for character" too high (intentional self-creation vs. identification/integration).
      *   *What work does Dana do?* She shows that (2) is too restrictive. She satisfies a weaker version of (2) (ownership/endorsement over time) without satisfying the strict "intentional making from scratch." She suggests responsibility is a *historical property of the agent*, not a *metaphysical property of the origin*.
      *   *Does (2) do all the work?* Yes, mostly. (1) is plausible *if* (2) is true. If (2) is false, (1) can be satisfied by non-creative ownership.
      *   *Maximal vs. Ordinary Responsibility:* This is a key distinction. Strawson targets *Ultimate* Responsibility. The Dana case supports *Ordinary* (Compatibilist) Responsibility. The cost is admitting "Ultimate" responsibility is impossible (which Strawson agrees with).
