  2.  **Deconstruct the Argument Chain:**
      *   (1) Provenance Condition: Responsibility for action requires responsibility for the character/motives that produced it. (Intuition: Luck/Arbitrariness).
      *   (2) Only-by-making Condition: Responsibility for character requires intentional self-formation under control. (Intuition: Control/Agency).
      *   (3) Regress: Self-formation requires prior motives, which require prior responsibility. (Intuition: Causal/Reasons structure).
      *   (4) Conclusion: Impossible for finite beings. Indeterminism doesn't help.
      *   (5) Generalization: Applies to *all* normative standings (epistemic, etc.).
      *   (6) Self-Defeat: Applies to the argument itself.
      *   (7) Reductio: Therefore, the premises must be flawed.

  3.  **Evaluate the "Dana Case":**
      *   Dana undergoes gradual self-change over 40 years.
      *   No single "self-creation" moment.
      *   Continuous endorsement.
      *   *Function:* It challenges (2) and (3). It suggests responsibility might be compatible with a *process* rather than a *foundational act*. It tests whether "responsibility for character" requires a *first* cause or just *ownership* of the process.

  4.  **Analyze the Steps & Costs (Drafting the Core Content):**

      *   **Step (1) - Provenance:**
          *   *Plausibility:* "Ultimate Responsibility." If my character is just given (genes/environment), blaming *me* seems like blaming the lottery.
          *   *Cost of Rejection:* Accepts "constitutive luck." We are responsible for actions even if we aren't responsible for the selves that performed them. This weakens the "desert" notion (retributive justice becomes hard to justify).
          *   *User Attachment:* High. Rejecting this hurts their core intuition about fairness.

      *   **Step (2) - Only-by-making:**
          *   *Plausibility:* Control principle. To be responsible for X, I must have controlled X. "Growing into it" feels passive.
          *   *Cost of Rejection:* Allows responsibility for things not intentionally made. E.g., responsibility for traits acquired through habituation, non-conscious integration, or simply "owning" them without having "built" them from scratch. This opens the door for the Dana case to succeed.
          *   *User Attachment:* Low. This is the likely pressure point.

      *   **Step (3) - Regress:**
          *   *Plausibility:* Causal closure. Every choice has a reason/motive. If the reason isn't chosen, the choice isn't fully mine.
          *   *Cost of Modification:* Stop the regress. Accept a "stopping point" that isn't chosen but is *sufficiently internal*. This moves from "Ultimate Responsibility" to "Attributability."
          *   *User Attachment:* Neutral/High (follows from 1 & 2).

      *   **Step (4) - Conclusion:**
          *   *Plausibility:* Finite beings can't complete infinite tasks. Randomness isn't control.
          *   *Cost of Rejection:* Accept that responsibility is possible (compatibilism or libertarianism).

      *   **Step (5) - Generalization:**
