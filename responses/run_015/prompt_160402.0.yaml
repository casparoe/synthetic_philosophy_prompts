answer: |-
  You are reinventing the wheel, but it is a very famous wheel: you are grappling with Langdon Winner's 1980 essay *"Do Artifacts Have Politics?"* Your Long Island parkway case is his opening example. The reason you are hitting a wall is that Winner's essay, while foundational, famously conflates two different kinds of politics, and your intuition is correctly sensing that conflation.

  Your current principle (*settles a question + hard to undo*) is a strong start, but it misses the **distribution of agency**. A door settles the question of "how to enter," but it isn't inherently political. A turnstile settles the question of "who has paid," which *is* political.

  Here is a proposed framework to replace your single principle, followed by a re-evaluation of your list and the new cases.

  ### A Better Framework: The Three Dimensions of Artifact Politics

  Instead of a binary "is/is not," treat politics in artifacts as a vector with three coordinates. An artifact becomes *more* political the further it moves along these axes:

  1.  **Delegation of Norms:** Does the artifact take a social negotiation (who goes where, who waits, who pays) and embed it into matter, removing the need for human enforcement?
  2.  **Asymmetry of Consequence:** Does the embedded norm create winners and losers (e.g., car owners vs. bus riders), or is the constraint universal (e.g., gravity, or a door handle)?
  3.  **Opacity of Origin:** Is the decision visible (a law, a sign) or hidden in a standard, a default setting, or a physical dimension?

  **The Principle:** *An artifact is political when it delegates a social norm into a material constraint (1), creating an asymmetric distribution of access or risk (2), in a way that makes the origin of that constraint difficult to contest (3).*

  ### Re-running Your List

  Here is how this framework handles your gut verdicts and where your current principle fails.

  **1. Long Island Overpasses (Moses)**
  *   **Verdict:** Highly Political.
  *   **Analysis:** High Delegation (bus height), High Asymmetry (car owners vs. poor/transit users), High Opacity (looks like engineering, acts like law).
  *   **Fix:** Your current principle works here.

  **2. Midwest Bridge (Copied Standard)**
  *   **Verdict:** Dormant Politics.
  *   **Analysis:** High Delegation, **Zero Asymmetry** (in context).
  *   **Fix:** Your current principle struggles here because the object *could* be political, but isn't *activated*. Under the new framework, it lacks the *Asymmetry* coordinate. It is a political weapon left in the armory. It is technically political in *ontology*, but null in *sociology*.

  **3. Hostile Architecture Benches**
  *   **Verdict:** Political (Contextually).
  *   **Analysis:** You wrote: *"I want to say the politics was never in the bench."* **I would challenge this.** The politics *is* in the bench, specifically in the **Delegation**. The bench delegates the role of "security guard" to the armrest.
  *   **Fix:** The difference between the Moses Bridge and the Bench is not the location; it is the **Specificity**. The Moses bridge targets a specific class (bus riders). The bench targets a specific behavior (lying down). Both are political. Do not drop this case, but correct the verdict: the politics is in the *affordance*, not the intent.

  **4. Reprocessing Plants**
  *   **Verdict:** Inherently Political (Winner's Type 1).
  *   **Analysis:** This is different from the Overpass (Winner's Type 2). The Overpass *can be used* for exclusion; the Reprocessing plant *requires* hierarchy to survive.
  *   **Fix:** Your principle groups these together, which is correct, but you need to distinguish between **Compatibility** (Overpass: compatible with democracy, used for oligarchy) and **Requirement** (Plant: incompatible with democracy, requires authoritarianism).

  **5. Wiki / Open Source**
  *   **Verdict:** Political (but you feel it isn't).
  *   **Analysis:** You say it *"actively resists having politics."* This is the weak link in your list. Wikis have intense politics (edit wars, admin rights, version control authority). They resist *hierarchy*, which is a political stance.
  *   **Recommendation:** **Drop this from your list of "built things."** It confuses your inquiry. Digital governance structures operate on different temporalities of "undoing" than concrete infrastructure. It is muddying your water.

  **6. Traffic Signal (Default Algorithm)**
  *   **Verdict:** Highly Political (Politics of Inertia).
  *   **Analysis:** You lean "more political than the overpasses." You are right, because of **Opacity**. The Moses bridge is visible; you can see the stone. The signal's bias is in the code, invisible to the pedestrian.
  *   **Fix:** This fits the **Opacity** dimension perfectly. It settles a question (cars > people) without a decision-maker to hold accountable.

  ### What to Drop?

  **Drop the intuition that the Wiki is "not political."**
  It is not that the Wiki is apolitical; it is that its politics are *procedural* rather than *coercive*. Keeping it in the list encourages you to look for "resistance to politics" rather than "types of politics." It is an outlier that breaks your materialist framework.

  **Drop the distinction between the Moses Bridge and the Bench.**
  Your gut says the Bridge is political and the Bench is not (or less so). Theoretically, they are identical mechanisms: material constraints designed to filter populations by class/behavior. Treating them differently prevents you from seeing the broader history of "defensive design."

  ### Running the Framework on Your New Cases

  **Case 1: Keycard System (Maintenance $\rightarrow$ HR Surveillance)**
  *   **Delegation:** High. The door delegates the "honor system" of attendance to a digital log.
  *   **Asymmetry:** High. Management gains panoptic visibility; workers lose opacity regarding their movement.
  *   **Opacity:** Medium/High. The *collection* is visible (you swipe), but the *repurposing* is hidden (you don't know HR is reading it).
  *   **Verdict:** **Political.** This is a classic case of **Function Creep**. The artifact was sold as a safety tool (maintenance scheduling) but operates as a disciplinary tool (labor surveillance). The politics lies in the *dual-use nature of the data*. It settles the question of "who owns my time" in favor of the employer, without a new contract or negotiation.

  **Case 2: Subway Elevator (Skips the Mezzanine)**
  *   **Delegation:** High. The elevator script dictates flow.
  *   **Asymmetry:** High. It prioritizes the **Through-Passenger** (getting to the train) over the **Local Economy** (mezzanine shops) or **Social Loitering**.
  *   **Opacity:** Low. You can see the buttons don't light up.
  *   **Verdict:** **Political (Efficiency vs. Place).** This is a subtle one. By skipping the mezzanine, the artifact enforces a logic of **transit as throughput** rather than **transit as public space**. It prevents the mezzanine from becoming a "place" and ensures it remains a "channel." In urban history terms, it privileges the regional commuter over the neighborhood economy. It is less exclusionary than the Moses bridge (it doesn't ban a class of people), but it is deeply political in its **valuation of time over space**.

  ### Summary for your Dissertation

  You are looking for a theory that accounts for **unintended consequences** without absolving **engineering standards** of responsibility.

  Use this formulation: **Politics is not a property of the object, but of the *relation* the object enforces.**
  *   The Midwest bridge has the *capacity* for politics, but lacks the *relation* (no buses).
  *   The Traffic Signal has a *hidden* relation (vendor code vs. pedestrian safety).
  *   The Keycard has a *shifted* relation (safety tool becomes discipline tool).

  Your "hard to undo" criterion is actually about **Lock-In**. Keep that, but pair it with **Distribution**. An artifact is political when it locks in a specific distribution of advantage that is difficult to renegotiate because the negotiation has been offloaded to the material world.
