answer: |-
  ## Activity: The Sealed Proposition

  **Objective:** To simulate the logical tension of future contingents (the "Sea Battle" puzzle) through the narrative mechanic of "back-shadowing," forcing writers to experience the indeterminacy of a statement's truth value prior to the completion of the draft.

  **Materials:** Index cards (one per writer), envelopes (one per writer), pens (writers provide), writing surfaces/laptops (writers provide), timer.

  **Pre-Work:** None. Do not explain the philosophy. Do not mention Aristotle. Do not mention "truth values" in the setup.

  ### The Setup (0:00 – 0:10)

  **Instructions to the Group:**
  1.  **Select a Work:** Open your current work-in-progress. Find a scene you have already written, or a scene you intend to write immediately next, that contains a claim about the future.
      *   *Examples:* A character saying "I'll never go back there," a narrator stating "He didn't know this was the last time he'd see her," or a concrete detail like "The gun was unloaded."
  2.  **Isolate the Claim:** Identify the specific sentence or phrase that locks in a future state of affairs.
  3.  **The Card:** Write *only* that sentence on the index card. Do not write context. Do not write the character's name unless it's in the sentence. Just the proposition.
      *   *Bad:* "John thinks the gun is empty."
      *   *Good:* "The gun was empty."
  4.  **The Seal:** Put the card in the envelope. Seal it. Write your name on the back.
  5.  **The Rule:** Place the envelope in the center of the table (or hand it to you). **No one may touch their envelope until the timer sounds for the Revelation.** If you peek, you break the mechanism.

  **Facilitator Note:** Collect the envelopes in a pile in the center of the room. This physical separation creates the "gap" in time. It removes the agency to check, forcing them to live with the proposition as unverified.

  ### The Writing Sprint (0:10 – 0:50)

  **Instructions:**
  "You have 40 minutes. You are now writing the *future* scene. This is the scene where the claim on your card is tested.
  *   **Constraint:** You are not allowed to look at your card. You do not know what you promised.
  *   **Directive:** Follow the logic of the characters. If the characters demand the gun *is* loaded, write that it is loaded, even if your card says it was empty. If the characters demand the gun is empty, write that.
  *   **Goal:** Do not try to match the card. Try to tell the truth of the scene. The card is a relic from the past; you are living in the future."

  **Facilitator Role:**
  *   Enforce silence.
  *   If a writer asks, "Does it matter if I match it?" say: "It matters only if the characters make it matter."
  *   Watch for writers stopping to think about the card. Remind them: "The card does not exist for you right now."

  ### The Revelation (0:50 – 1:00)

  **Instructions:**
  1.  Return the envelopes (or allow them to retrieve them).
  2.  "Open the envelope. Read the card. Then read the last paragraph you wrote."
  3.  "Ask yourself one question: **Was the sentence on the card True?**"
  4.  "Do not ask if you *made* it true. Ask if, reading the two texts together, the sentence on the card accurately describes the reality of the story you now hold."
  5.  Give them 5 minutes of silent reflection to write down their answer: **TRUE**, **FALSE**, or **UNDECIDABLE**.

  ### The Debrief (1:00 – 1:30)

  **Phase 1: The Data (10 mins)**
  Ask for a show of hands.
  *   Who wrote a resolution that matched the card? (TRUE)
  *   Who wrote a resolution that contradicted the card? (FALSE)
  *   Who wrote a resolution that made the card irrelevant or ambiguous? (UNDECIDABLE)

  *Ask a 'TRUE' writer:* "When you were writing the scene, before you opened the envelope, was the sentence on the card true?"
  *   *Expected Answer:* "I don't know," or "It didn't feel like anything yet."
  *   *Follow up:* "Now that you've finished, does it feel like it was always true?"

  *Ask a 'FALSE' writer:* "You wrote a contradiction. Did you break the story, or did you correct it?"
  *   *Follow up:* "If you correct it now to match the card, does that make the card true? Or does it make the new scene a lie?"

  **Phase 2: Mapping the Puzzle (10 mins)**
  Draw a timeline on a whiteboard or large sheet of paper.
  1.  **Time A (The Card):** Mark the moment they wrote the card.
  2.  **Time B (The Sprint):** Mark the 40 minutes of writing.
  3.  **Time C (The Revelation):** Mark the moment they opened the envelope.

  **Script for the Facilitator:**
  "In logic, there is an old problem concerning a sea battle. The question is: If I say 'There will be a sea battle tomorrow,' is that sentence true *right now*?
  *   If it is **True** now, the battle is inevitable. You are not writing; you are transcribing fate.
  *   If it is **False** now, the battle is impossible. You cannot write it.
  *   If it is **Neither**, then logic breaks. A sentence exists that is not true and not false.

  "In this room, you just lived that puzzle.
  *   **The Card** was the proposition about tomorrow.
  *   **The Sprint** was the passage of time where the future was unwritten.
  *   **The Revelation** was the moment the future became the past.

  "Many of you said, 'During the sprint, the card wasn't anything.' That is the intuition of the writer. But now, holding the finished draft, it feels like the card *was* true all along. This is **Back-Shadowing**. The future text reached back and fixed the truth value of the past text. But while you were in the middle—while you were the one who gets to decide what tomorrow holds—you felt the bite of not knowing if you were discovering a truth or inventing one."

  **Phase 3: Naming It (5 mins)**
  "This is a version of the **Problem of Future Contingents**, often associated with **Aristotle's *De Interpretatione***. Philosophers call the principle you just challenged the **Law of Bivalence** (every statement is either true or false). You just spent 40 minutes in a world where Bivalence was suspended."

  ---

  ### Predictable Failures & Troubleshooting

  **1. The Self-Fulfilling Prophecy (The Stenographer)**
  *   **Behavior:** The writer consciously or subconsciously writes the scene to match the card because they feel they "should."
  *   **Why it breaks the puzzle:** It collapses the gap between Time A and Time C. It removes the indeterminacy.
  *   **Intervention:** During the Writing Sprint, if you see them hesitating, say: "You are allowed to betray the card. The characters have more authority than the envelope."
  *   **Debrief Fix:** If they admit they matched it on purpose, ask: "If you had to write the scene again, blind, without the card, would the characters still do that? If not, you didn't write a story; you wrote a verification."

  **2. The Psychologizing Dodge**
  *   **Behavior:** In debrief, writers say, "It's about what the character *believes*," or "It feels true emotionally."
  *   **Why it breaks the puzzle:** This shifts the focus from *truth conditions* (correspondence to text) to *internal state*. The Sea Battle puzzle isn't about hope; it's about whether the event happens.
  *   **Intervention:** "Stop. We aren't talking about feelings. Look at the text. Does the gun fire or not? Is the sentence 'The gun was empty' accurate to the text you hold? Yes or No."

  **3. The God-Complex Defense**
  *   **Behavior:** "It's true because I'm the author. I decide what's true."
  *   **Why it breaks the puzzle:** This confuses *ontological authority* (I created the world) with *logical consistency* (Once created, does X match Y?). The puzzle is about the *status of the sentence*, not the power of the speaker.
  *   **Intervention:** "You are God, yes. But even God cannot make a contradiction true. If the text says 'Empty' and the text says 'Fired', one of them is a lie. Which one? That is the question."

  ---

  ### Limitations & Extrapolation (For the Facilitator)

  **Where the Analogy Breaks:**
  You must be frank about this in your own notes, and briefly in the debrief if pressed.
  1.  **Creation vs. Discovery:** In Aristotle's puzzle, the sea battle is (presumably) independent of the speaker. In your workshop, the "battle" is *dependent* on the writer. The writer *causes* the truth. The philosophical puzzle assumes the speaker *cannot* cause the truth.
      *   *How to handle:* Acknowledge this. "In reality, you cannot force the sea battle. In fiction, you can. But the *experience* of the writer is often that the characters resist your will. We are exploiting that resistance. When the character refuses to fire the gun, you feel the same constraint as a prophet who cannot force the battle."
  2.  **Truth vs. Coherence:** In logic, truth is correspondence to reality. In fiction, truth is coherence within the text.
      *   *How to handle:* "We are treating 'narrative consistency' as a stand-in for 'ontological truth.' It is not the same, but the *logical structure* of the problem (Past Statement vs. Future Event) is identical."
  3.  **The "Now":** In the Sea Battle, "Now" is a fixed point in time. In the workshop, "Now" is the drafting process.
      *   *Extrapolation:* I am extrapolating that the *drafting phase* feels like "the present" and the *finished draft* feels like "the fixed past." This is a phenomenological claim, not a logical one.

  **What You Must Supply:**
  The activity cannot stage the **Fatalism** horn of the dilemma perfectly. Because they know they *can* change the card (by editing the past) or the scene (by editing the future), they never feel truly trapped.
  *   *Your Words:* You must articulate that in a *published* book, the trap snaps shut. "Once the book is printed, you can no longer change the card. You can no longer change the scene. At that point, you are no longer God. You are a reader. And for the reader, the sentence 'The gun was empty' is either true or false, and it always was. That is when the Sea Battle begins."

  **Extrapolation Mark:**
  *The claim that "Back-shadowing" is structurally identical to "Future Contingents" is an extrapolation.* Back-shadowing is an aesthetic effect; Future Contingents is an ontological problem. I am using the *anxiety* of the former to simulate the *logic* of the latter. If a writer pushes back that "fiction is made up," concede the point immediately. "Exactly. That is why the truth value is unstable. In reality, the battle happens or it doesn't. In fiction, it happens *because you wrote it*. The puzzle is: Does writing it make it true, or does writing it reveal it was the only thing that *could* be true?"
