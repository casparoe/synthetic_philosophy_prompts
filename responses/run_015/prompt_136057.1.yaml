  *In Fiction:* If the Prophecy *has* a truth value now (before writing the resolution), then the writer is a stenographer (fatalism). If it *doesn't*, then the draft is incoherent (logic breaks).
  *Okay, that's the angle.* The writer feels the tension between "I am deciding" and "It is already decided."

  Let's build the plan.

  *(Final check on constraints)*: 14 writers. 90 mins. Index cards, envelopes, timer.
  *Logistics:* Need to ensure everyone has envelopes. If I only have "nothing but..." does that mean I *only* have those? "I run a workshop... I have one 90-minute slot and nothing but index cards, envelopes, and a timer." This implies those are the *provided* materials. Writers likely have pens/notebooks/laptops as they are writers in a workshop. I will assume they have writing implements.

  *Wait, one more constraint:* "They shouldn't hear the standard name for the problem until the debrief."
  *Okay, keep "Sea Battle" and "Aristotle" out of the intro.*

  *Predictable Failures:*
