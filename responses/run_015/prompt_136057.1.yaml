      *   *Refinement:* To capture the "truth value" tension, they need to commit to a specific outcome *before* writing the scene that leads to it, but the scene must feel organic, not forced.
      *   *Better Approach:* Split the room. Half write the "Prophecy" (Chapter A), half write the "Fulfillment" (Chapter B)? No, they need to work on their *own* WIPs.
      *   *Best Approach:*
          1.  Identify a moment in their WIP where a character makes a claim about the future or a state of affairs is uncertain.
          2.  Write that claim on a card. Seal it.
          3.  Spend time writing the *consequence* scene (the "tomorrow").
          4.  Open the card. Does the text match?
      *   *Critique:* This feels like plotting. How to make it about *truth*?
      *   *Pivot:* The "Back-Shadowing" concept implies the *past* text changes status based on the *future* text.
      *   *Revised Activity:*
          1.  **Phase 1 (The Past):** Write a line in an existing scene (or a new provisional one) that implies a future fact. (e.g., "He would never forgive her.")
          2.  **Phase 2 (The Gap):** Seal that line. Put it away.
          3.  **Phase 3 (The Future):** Write the scene where the forgiveness (or lack thereof) happens.
          4.  **Phase 4 (The Revelation):** Open the envelope. Read the past line in light of the new scene.
      *   *Time Check:* 90 mins is tight for writing two scenes.
      *   *Adjustment:* Use existing drafts. Everyone brings a WIP.
      *   **Step 1:** Find a line already written that predicts/implies a future outcome. (5 mins)
      *   **Step 2:** Write that line on a card. Seal it. (5 mins)
      *   **Step 3:** Write the *future scene* that resolves it. (40 mins)
      *   **Step 4:** Open and read. (10 mins)
      *   **Step 5:** Debrief. (30 mins)
      *   *Wait, the prompt says "nothing but index cards, envelopes, and a timer."* It implies I can't assume they have laptops or drafts with them, though it's a residential workshop. I should assume they have access to their WIPs (notebooks/laptops) because asking them to invent new worlds in 90 mins kills the "stakes are small but not fake" requirement. *Correction:* The prompt says "Have them work on scenes from their own works-in-progress." So they have their materials. I just provide cards/envelopes/timer.

  4.  **Refining the "Truth" Tension:**
      *   The philosophical bite is: *Before* I write the future scene, is the card True or False?
      *   If I write the future scene to match the card, did I make it true, or did I reveal it was true?
      *   To prevent "self-fulfilling" (just writing what's on the card), I need to introduce a constraint or a partner element.
      *   *Idea:* Partner swap? No, keeps it personal.
      *   *Idea:* The "Coin Flip" constraint? No, that's random, not narrative.
      *   *Idea:* **The Blind Write.**
          1.  Write the Prophecy Card. Seal it. Hand it to me (Facilitator).
          2.  Write the Resolution Scene *without looking at the card*. You must follow the characters' logic, not the card.
          3.  I hand the card back.
          4.  Compare.
      *   *Why this works:* It creates the gap. If the characters demand a different outcome than the card, the card becomes "False." If they demand the same, it becomes "True." But *during* the writing of the resolution, the truth value was indeterminate.
      *   *Risk:* Writers will cheat and peek, or write the resolution to match the card consciously. I need to instruct them to prioritize *character logic* over *card consistency*.

  5.  **Drafting the Timeline:**
      *   0-10: Setup & Selection (Find the line).
      *   10-20: The Card (Write & Seal).
      *   20-60: The Future (Write the resolution scene).
      *   60-70: The Revelation (Open & Read).
      *   70-90: Debrief.

  6.  **Addressing the Troubleshooting:**
      *   *Issue 1: Self-Fulfilling.* They write the scene to match the card.
      *   *Fix:* Emphasize "Betray the Card if the Character demands it."
      *   *Issue 2: Psychologizing.* "It's about the character's hope."
      *   *Fix:* Steer back to "Is the sentence on the card accurate to the text you just wrote?"
      *   *Issue 3: Free Will.* "Did the character choose?"
      *   *Fix:* "We aren't asking if they could have chosen otherwise. We are asking if the sentence 'He chose X' is true."

  7.  **Addressing the Limitations (Crucial Step):**
      *   *The Sea Battle* is about the *world* (reality). *Back-shadowing* is about the *text* (representation).
      *   In the puzzle, the future is unknown to the speaker. In the workshop, the writer *is* the god of that universe.
      *   The analogy breaks because the writer *causes* the truth. Aristotle's puzzle assumes the speaker doesn't control the battle.
      *   *Extrapolation:* I am mapping ontological truth (reality) onto aesthetic truth (narrative consistency).
      *   *Honesty:* I must state this in the "Limitations" section.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but collaborative.
      *   Check constraints: Index cards, envelopes, timer.
      *   Ensure the "Truth" focus remains sharp in the debrief.

  9.  **Self-Correction on "Blind Write":**
      *   If they hand the card to me, I become the arbiter. That's good. It removes the temptation to peek.
      *   But 14 writers is a lot to manage physically in 90 mins.
      *   *Alternative:* They seal it in an envelope and place it in the center of the table. They cannot touch it until the timer dings.
      *   *Instruction:* "If you touch the envelope before the timer, you forfeit the exercise." (High stakes/nonsense rule to enforce discipline).

  10. **Debrief Structure:**
      *   Map the Card to "The Proposition."
      *   Map the Writing Time to "The Time Gap (Tonight/Tomorrow)."
      *   Map the Resolution Scene to "The Event."
      *   Map the Opening to "The Assessment of Truth."
      *   Name drop: Aristotle, De Futuro, Bivalence.

  11. **Review against "No Lecture Up Front":**
      *   Keep instructions procedural. "Do this, then this." Save the "Why" for the end.

  12. **Review against "Extrapolation Marking":**
      *   Need a specific section at the end for this.

  13. **Final check on "Truth vs. Causation":**
      *   Make sure the debrief questions ask "Was the sentence true?" not "Did you force it?"

