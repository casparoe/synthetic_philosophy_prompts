      *   **User:** Novelist running a week-long residential workshop (14 writers, mostly literary).
      *   **Constraints:** 90-minute slot, only index cards, envelopes, timer. No lecture up front.
      *   **Goal:** Make writers *feel* the logical puzzle of future contingents (Aristotle's Sea Battle) through the lens of "back-shadowing" in fiction.
      *   **Core Concept:** A line written early (prediction/statement) has no truth value *yet*, but once the draft is done, it seems it *was* true all along. The tension is about the *truth of the sentence*, not causation or free will.
      *   **Deliverables:** Setup, roles, rules, minute-by-minute timeline, debrief (mapping to the puzzle), troubleshooting (predictable failures), limitations of the analogy.
      *   **Tone:** Frank, practical, philosophically precise (avoiding free-will drift), transparent about extrapolation.

  2.  **Deconstruct the Philosophical Problem (Aristotle's Sea Battle):**
      *   *The Puzzle:* "There will be a sea battle tomorrow." Is this statement true *now*?
      *   *If True:* The battle is necessary/fated.
      *   *If False:* The battle is impossible.
      *   *If Neither:* Bivalence fails (logic breaks).
      *   *The Writer's Parallel:* "Character X will say Y in Chapter 10." Is this true *now* (in Chapter 3)?
      *   *The Twist:* The writer *creates* the future, but experiences it as discovering a truth that was always there once the draft is closed.

  3.  **Design the Activity ("The Envelope Prophecy"):**
      *   *Need:* A mechanism to separate the "prediction" from the "fulfillment" in time, forcing a gap where truth value is ambiguous.
      *   *Materials:* Index cards, envelopes, timer.
      *   *Structure:*
          1.  Write a contingent statement about their own WIP (Work In Progress).
          2.  Seal it (hide the truth).
          3.  Write the scene that makes it true/false *later*.
          4.  Open and compare.
      *   *Problem:* 90 minutes isn't enough to write a whole chapter.
