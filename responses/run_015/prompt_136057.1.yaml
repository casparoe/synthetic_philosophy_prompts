  *How to salvage?* The feeling of "discovery." Even though I write it, it often feels like the character *made* me write it. The "resistance of the material." I need to lean into the *experience* of the writer feeling bound by the earlier text, even though they wrote it. The "Back-shadowing" is the key: The *earlier* text's truth value is fixed by the *later* text.
  *Revised Focus:* The card represents the *Past Text*. The writing session represents the *Future Text*. The question is: When you wrote the Past Text, was it True?
