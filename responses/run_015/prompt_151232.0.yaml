      *   **Evidential Decision Theory (EDT):** $P(O|A) \neq P(O|\neg A)$. If $A$ is evidence of $O$, do $A$.
      *   **The Twist:** Usually, EDT is criticized for the "Smoking Lesion" problem (correlation isn't causation). However, in this specific context (Newcomb-like, logical correlation, infinite universe), the correlation isn't just statistical; it's *logical* or *structural*. This leans towards *Functional Decision Theory (FDT)* or *Timeless Decision Theory (TDT)*.
      *   **The "Voting Paradox" Analogy:** One vote rarely decides an election causally. But if everyone thought that, no one votes. If I vote, it's evidence others like me vote.
