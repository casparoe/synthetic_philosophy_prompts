      *Key Insight to emphasize:* The argument transforms ethics from "What effect do I have?" to "What rule do I instantiate?" This is basically Rule Utilitarianism or Kantianism dressed in decision-theoretic math.

      *Critique:* The fatal flaw is defining the "relevant kind" of agent. If I define it as "Bakers who care about hens," my action matters. If I define it as "Humans with money," my donation matters more. Who decides the class?

