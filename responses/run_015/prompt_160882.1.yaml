  **FORM ODR-4421 (REV. 11/24)**
  **OFFICE OF DISTRIBUTIONAL REVIEW**
  **APPLICATION FOR CERTIFICATION OF A SAFE PARETO IMPROVEMENT (SPI)**

  **INSTRUCTIONS:** Complete all fields in triplicate. Failure to disclose model parameters may result in decertification. Definitions provided herein supersede colloquial understandings of welfare, identity, and harm.

  **1. DEFINITION OF AFFECTED PARTIES**
  1.1. **Eligible Stakeholder:** Any natural person existing at time *t₀* whose utility function remains invariant under the proposed policy regime.
  1.2. **Excluded Persons:** The following entities shall not be classified as "Negatively Affected Parties" for the purpose of veto rights:
     [ ] Persons whose existence is contingent upon the policy implementation (see Section 4).
     [ ] Persons whose baseline utility is below the subsistence comparability threshold (Ω).
     [ ] Persons who would object to the policy but whose objection relies on counterfactual identities inconsistent with the actual world state.
  1.3. **Identity Tracing:** If a policy alters the conception date or genetic makeup of a subject, said subject is deemed a *New Beneficiary* rather than a *Harmed Victim*, regardless of subjective welfare reports.

  **2. COMPENSATION PROTOCOLS**
  Select the compensation mechanism utilized to satisfy the Kaldor–Hicks criterion. Only one box may be ticked.

  [ ] **Actual Compensation:** Transfer of resources occurs within the fiscal year.
  [ ] **Hypothetical Compensation:** Winners *could* compensate losers and remain better off. No transfer required. Valid if modeled utility gain exceeds modeled utility loss by ≥1 utilon.
  [ ] **Retroactive Compensation:** Utility gains accrued in period *t₁* are applied to offset losses in period *t₀*. Requires time-consistent preferences.
  [ ] **Posthumous Compensation:** Compensation directed to estate or lineage. Applicable when loss of life is offset by aggregate GDP growth in surviving population.

  *Note: Under Section 2.2, Hypothetical Compensation is deemed sufficient for SPI certification provided the transaction costs of actual payment exceed the welfare loss.*

  **3. PROBABILITY AND MODEL SPECIFICATION**
  3.1. **Expected Utility Calculation:** All welfare metrics must be discounted to present value using the social discount rate (δ).
     **Declared δ:** _______%
  3.2. **Model Selection Attestation:** The applicant must specify the probability distribution function used to estimate outcomes.
     **Model ID:** ___________________
  3.3. **Ex-Post Validation:** The applicant attests that the model parameters were calibrated *after* observing the policy outcomes to ensure accuracy. This reduces variance noise and aligns the probability function with realized welfare states.
     [ ] I attest that the model was selected to maximize the likelihood of the observed SPI.

  **4. NON-IDENTITY AND CONSENT REGISTRATION**
  4.1. **Contingent Persons:** For persons brought into existence by the policy (e.g., via fertility incentives, infrastructure-induced migration), harm is defined solely as existence below the "Life Not Worth Living" threshold.
  4.2. **Consent Mechanism:** Since contingent persons cannot consent ex-ante, consent is registered via:
     [ ] **Constructive Existence:** The fact of birth constitutes ratification of the conditions necessary for said birth.
     [ ] **Proxy Authorization:** Consent granted by parental units whose utility functions are included in the aggregate sum.
     [ ] **Implicit Waiver:** Failure to cease existence voluntarily within the first fiscal quarter implies acceptance of welfare baseline.

  **5. SAFETY ATTESTATION AND TAIL RISK**
  5.1. **Variance Declaration:** The applicant must disclose the standard deviation (σ) of the welfare distribution.
     **Declared σ:** _______
  5.2. **Catastrophe Threshold:** The applicant must specify the maximum acceptable probability (P_max) that the policy results in a Universal Welfare Decline (i.e., all parties are strictly worse off).
     **P_max:** _______%
  5.3. **Safety Certification:** A policy is deemed "Safe" if the Expected Value (EV) is positive, even if P(Universal Welfare Decline) > 0, provided the EV is calculated using the model specified in Section 3.
     [ ] I certify that the risk of total failure is within acceptable ministry limits.

  **6. AUTHORIZATION**
  By signing below, the applicant acknowledges that "Safe" refers to model consistency, not physical security.

  **Applicant Signature:** ___________________ **Date:** _______________
  **ODR Use Only:** [ ] Certified [ ] Referred to Ethics Subcommittee

  ***

  **FOOTER: ILLUSTRATIVE PRECEDENT (CASE 88-B)**
  **Policy:** Compulsory Coastal Zone Relocation.
  **Outcome:** 5,000 residents displaced; homes demolished.
  **SPI Certification Logic:**
  1. **Affected Parties:** Displaced residents reclassified as *Contingent Persons* because relocation altered conception timings of their future children (Section 1.2).
  2. **Compensation:** Hypothetical compensation calculated based on projected regional GDP increase (Section 2).
  3. **Model:** Parameters calibrated to match positive growth data observed post-eviction (Section 3.3).
  4. **Consent:** Constructive Existence applied to children born in relocation centers (Section 4.2).
  5. **Safety:** 5% probability of universal destitution accepted due to high discount rate applied to future suffering (Section 5.2).
  **Status:** **CERTIFIED SAFE.**
