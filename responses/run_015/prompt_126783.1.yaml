      *   *Conclusion:* Summarize the "Strict Need" vs. "Nice to Have."

  9.  **Refining the "Strict Need" vs. "Underdetermined":**
      *   *Strict Need:* A distinction between compositional semantics (man + power) and lexicalized semantics (human).
      *   *Underdetermined:* The line between the two is fuzzy. Why is "manhole" compositional enough to change but "human" isn't? This is purely conventional.
      *   *Confidence:* I need to be careful not to overstate the linguistic rigor. Style guides are not linguists. They are policymakers.

  10. **Final Polish:** Check tone. Ensure I'm not "humouring" the user but engaging critically. Ensure confidence markers are clear. (Self-Correction: Make sure to explicitly address the "Markedness alone" question).

      *   *Key Insight:* The practice presupposes that language shapes *possibility spaces* (who can be a chair), not just *descriptions*.
      *   *Key Distinction:* Live vs. Dead Morphology.

  11. **Final Review against constraints:**
      *   Separate strict needs from what sits well.
