answer: |-
  This is a sharp set of questions. You have correctly identified that the actual practice of gender-neutral reform is theoretically messy and often inconsistent with the explicit principles style guides claim to uphold.

  Here is the reconstruction of the implicit theory, separating what is strictly necessary for the practice to function from what is merely compatible, along with confidence ratings on the claims.

  ### 1. The Implicit Theory: Transparency and Agency
  The pattern you observe (change *chairman*, change *manpower*, keep *human*) does not presuppose a unified theory of meaning (semantics). Instead, it presupposes a theory of **Morphological Transparency** combined with **Social Agency**.

  *   **Strict Need:** The practice requires a distinction between **compositional** terms (where "man" is an active morpheme contributing to the meaning) and **lexicalized** terms (where the etymology is fossilized and the word is processed as a single unit).
      *   *Chairman* is processed as Chair + Man.
      *   *Human* is processed as a single atom; the *hu-* + *man* split is historically real but psychologically dead for most speakers.
      *   **Confidence: High.** This is the only way to explain why *manufacture* (hand + fact) is safe but *man-made* is not.
  *   **Underdetermination:** The line between "transparent" and "fossilized" is not linguistic; it is conventional. There is no strict linguistic reason why *manhole* is transparent enough to require *utility hole* (or *maintenance hole*), while *human* is not. This boundary is drawn by committee, not by grammar.
      *   **Confidence: High.** This is the weakest link in the theory; it relies on intuition rather than rule.
  *   **What it sits well with (but doesn't need):** The idea that etymology *never* matters. The practice actually cares deeply about etymology, but only *recent/visible* etymology. It ignores *deep/obscure* etymology.

  ### 2. Your Three-Way Distinction (Content, Default, Markedness)
  Your hunch is partially correct, but your category of "Markedness" needs splitting. In linguistics, "markedness" is structural (e.g., *lion* vs. *lioness*). In social justice contexts, it is normative (e.g., *male* as norm).

  *   **Content (Semantics):** Does the word entail maleness?
      *   *Verdict:* The practice proves this is **not** the driver. If it were, *human* and *mankind* would be the first to go, as they semantically encompass everyone but use a male root. They are often kept.
      *   **Confidence: High.** Reform is not driven by truth-conditional semantics.
  *   **Default (Pragmatics/Prototype):** Does hearing the word conjure a male image?
      *   *Verdict:* This is the primary driver for Group 1 (*chairman*). The objection is that the word biases the imagination.
      *   **Confidence: High.** This aligns with psycholinguistic data on generic masculines.
  *   **Markedness (Structural/Social):** Is the male form the unmarked base?
      *   *Verdict:* You asked if markedness can be objectionable *all by itself*, without Content or Default. **No.** Structural markedness (e.g., *actor* vs. *actress*) is not inherently objectionable to reformers unless it correlates with power asymmetry.
      *   *Correction:* The objection is not "Markedness" but **"Male-as-Norm."** If the unmarked form were "person" and the marked form were "male-person," no one would object. The objection is specifically that *male* is the unmarked default for *human*.
      *   **Confidence: Medium-High.** Your intuition that markedness is doing work is right, but it's not a neutral structural feature; it's a specific *social* markedness.

  ### 3. Hofstadter's "Reverse Translation" Test
  Hofstadter's move (translating *mankind* to *womankind* to test for absurdity) is a test of **Pragmatic Implicature**, not Semantic Content.

  *   **What it presupposes:** It presupposes that if a term is truly neutral, swapping the gender marker should not change the extension of the term. If *womankind* sounds like "only women," then *mankind* must have implicitly meant "only men" or "men primarily," despite its dictionary definition.
  *   **The Risk:** You identified the "unfamiliar vs. absurd" problem. This is the **Mere Exposure Effect**. *Mankind* sounds neutral because it is the unmarked form we are habituated to. *Womankind* sounds marked because it is morphologically built off the female term.
  *   **Philosophical Implication:** The test reveals that "neutrality" is often just "invisibility of the dominant group."
  *   **Confidence: High.** This is a standard pragmatic test (similar to Gricean implicature cancellation), though it is vulnerable to the familiarity bias you noted.

  ### 4. Consistency with "Communication Matters"
  Style guides insist language is about communication, not etymology. Is the practice consistent with this?

  *   **Yes, IF:** You define "communication" to include **interpersonal inclusion**. If the goal of language is to coordinate action and make listeners feel addressed, then *chairman* fails because it signals "this role is for men." Here, the *sound* and *form* of the word communicate social hierarchy, regardless of the dictionary definition.
  *   **No, IF:** You define "communication" as **information transfer**. If the only goal is to transmit the proposition "The chair is in session," *chairman* succeeds perfectly.
  *   **The Contradiction:** The guides are inconsistent when they keep *human* but change *manpower*. Both communicate "people." The decision to change one and not the other is based on **salience**, not communication efficacy.
  *   **Confidence: Medium.** This depends entirely on which philosophy of language the style guide writers are implicitly using (Instrumentalist vs. Constitutive). They usually oscillate between the two without admitting it.

  ### Summary of Reconstruction

  | Claim | Status | Confidence |
  | :--- | :--- | :--- |
  | **The practice relies on a "Live vs. Dead Morphology" distinction.** | **Strict Need.** Without this, *human* must be changed alongside *chairman*. | **High** |
  | **"Markedness" is objectionable even without male Content/Default.** | **False.** Markedness is only objectionable when "Male" is the unmarked norm for "Person." | **High** |
  | **Hofstadter's test reveals Semantic Content.** | **False.** It reveals Pragmatic Default/Implicature. | **High** |
  | **The practice is consistent with "Etymology doesn't matter."** | **False.** It ignores *deep* etymology but polices *surface* etymology. | **High** |
  | **The boundary between "Transparent" and "Fossilized" is linguistic.** | **False.** It is purely conventional/social. | **High** |

  ### The "Dud" Warning
  You asked me to be plain if your three-way split is a dud. It is not a dud, but **"Markedness" is the weak leg.**

  In linguistics, *markedness* is a structural relationship (e.g., singular is unmarked, plural is marked). In your context, you are using it to mean "Social Default." These are different things.
  *   *Structural Markedness:* *Lion* (unmarked) vs. *Lioness* (marked).
  *   *Social Default:* *Doctor* (assumed male) vs. *Lady Doctor* (marked female).

  The reform movement objects to the **Social Default**, not the Structural Markedness. If we changed *chairman* to *chairperson*, we have created a new unmarked term. If we changed it to *chairwoman*, we would just be swapping the default. The goal is to remove the *male* from the *unmarked* position.

  **Final Verdict:** The implicit theory is **Pragmatic Exclusionism**. It assumes that words do not just describe the world but **license participation** in it.
  *   *Strict Need:* The theory needs the claim that "Morphological transparency triggers social licensing." (i.e., If you can see the 'man', you feel the exclusion).
  *   **Confidence:** **Medium-High.** This explains the *chairman* vs. *human* split better than semantics or pure markedness.

  The practice is underdetermined because it tries to solve a social problem (sexism) with a linguistic tool (morphology) without a consistent map between the two. It works where the morphology is visible (*policeman*) and fails where it is opaque (*human*), regardless of the actual social impact of the term.
