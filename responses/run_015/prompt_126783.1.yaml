      *   **Problem:** The user is stuck on the *actual practice* of gender-neutral reform (not the satire), specifically the inconsistency in style guides (replace "chairman" but keep "human"; replace "manpower" but keep "manual").
      *   **User's Hypothesis:** A three-way distinction: Content (semantic meaning), Default (psychological imagery/implicature), Markedness (structural asymmetry). The user suspects "Markedness" is doing the heavy lifting even when Content/Default are absent, but isn't sure if Markedness is distinct.
      *   **Specific Questions:**
          *   What is the implicit theory of linguistic sexism presupposed by current style guide practices?
          *   Is "Markedness" a real third category or just Content/Default rearranged?
          *   What does Hofstadter's "reverse translation test" (making it sound ridiculous) presuppose?
          *   Is this consistent with the principle that "communication matters, not etymology"?
          *   **Constraint:** Separate what the practice *strictly needs* vs. what it *sits well with*. Identify underdetermination. Be honest if the distinction is muddled. Indicate confidence levels.

  2.  **Deconstruct the Style Guide Patterns:**
      *   *Group 1 (Replaced):* Chairman, policeman, spokesman. (Person + Male).
      *   *Group 2 (Replaced):* Manpower, man-hours, man-made. (No specific person, but "man" implies humanity/male).
      *   *Group 3 (Kept):* Human, manual, manufacture, place names. (Etymologically "man/hand" but opaque/fossilized).
      *   *The Tension:* Why replace "manhole" (utility hole?) but keep "human"? Both come from *man*.

  3.  **Evaluate the User's Three-Way Distinction:**
      *   *Content:* Does the word *mean* male? (Semantics).
      *   *Default:* Does it *invoke* a male prototype? (Pragmatics/Psycholinguistics).
      *   *Markedness:* Is the male form the *unmarked* default against which female is marked? (Morphosyntax/Structuralism).
      *   *Critique:* These are distinct in linguistics, but in *reform practice*, they often blur. However, the user's hunch that Markedness is doing work even without Content/Default is insightful but needs nuance. The real driver is often *Transparency* + *Agency*.

  4.  **Formulate the Implicit Theory:**
      *   The practice isn't based on one unified theory of meaning. It's a pragmatic patchwork.
      *   *Core Principle:* **Opacity vs. Transparency.** If the "man" morpheme is transparent and active, it gets changed. If it's fossilized/opaque, it stays.
      *   *Secondary Principle:* **Agency/Role.** If the word describes a *role* a person holds (chairman), it's high priority. If it describes a substance/abstract concept (manpower), it's medium priority. If it's a fossilized root (human), it's low priority.
      *   *Theory of Sexism:* It presupposes sexism is primarily about *exclusion from roles* and *salience of male-as-norm*, not strictly about etymological purity.

  5.  **Address "Markedness" vs. Content/Default:**
      *   Is Markedness distinct? Yes, structurally. But in this context, it usually correlates with Default.
      *   However, the user asks if Markedness is objectionable *all by itself*.
      *   *Verdict:* In practice, no. Nobody campaigns to change "human" because it's structurally unmarked male. They campaign on "chairman" because it implies a man holds the chair.
      *   *Confidence:* High that Markedness alone isn't the driver; it's the combination of Markedness + Transparency + Role.

  6.  **Address Hofstadter's "Reverse Translation Test":**
      *   Hofstadter translates "mankind" to "womankind" to show absurdity.
      *   *Presupposition:* It assumes symmetry. If "mankind" = everyone, "womankind" should = everyone. If it sounds ridiculous, "mankind" was never neutral.
      *   *Problem:* Familiarity bias. "Mankind" sounds neutral because it's unmarked.
      *   *Philosophical implication:* It tests *implicature* via defamiliarization. It reveals the "Default" category the user identified.

  7.  **Address Consistency (Communication vs. Etymology):**
      *   Style guides say "Focus on communication."
      *   But they keep "human" (etymology ignored) and change "manhole" (etymology highlighted).
      *   *Resolution:* They aren't actually ignoring etymology; they are ignoring *dead* etymology while policing *live* morphology. It's consistent if the rule is "Avoid active morphological exclusion," not "Avoid all historical male roots."

