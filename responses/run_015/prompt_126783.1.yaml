      *(Self-Correction during drafting)*: I should explicitly state that the "Markedness" category the user proposes is likely conflating *structural markedness* with *social markedness*. Structural markedness (singular vs plural) isn't objectionable. Social markedness (male as norm) is. I need to make that distinction clear.

      *(Final Plan)*:
