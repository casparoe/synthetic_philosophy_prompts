  Here is a rigorous reconstruction of your argument, designed for a population ethics seminar. It formalizes the "Standard Aggregationist Slide," identifies the specific expected-value axiom doing the paradoxical work, and proposes your Risk/Certainty Distinction as a formal block to that move.

  ---

  # Title: The Risk-Certainty Discontinuity: Blocking the Dust-Specks Paradox via Moral Non-Linearity

  ## 1. Introduction
  The Dust-Specks Paradox (Yudkowsky 2007) challenges total utilitarianism by asking whether it is preferable for one person to be tortured for fifty years or for $3 \uparrow\uparrow\uparrow 3$ people to each receive a dust speck in their eye. Standard aggregationism concludes the specks are worse, relying on the continuity of disutility.

  However, the intuitive force of this conclusion often relies on a hidden intermediate step: the transformation of sure small harms into tiny risks of large harms. This paper argues that the paradox is generated by an illegitimate **Expected-Value Identification (EVI)** within interpersonal aggregation. I propose a **Risk-Certainty Distinction**: while sure harms may aggregate linearly, risks of catastrophic harm do not aggregate to moral equivalence with certain catastrophe, regardless of the population size.

  ## 2. The Standard Aggregationist Slide
  To see where the paradox gains traction, we must reconstruct the argumentative "slide" that moves from the intuitively plausible (specks aggregate) to the intuitively implausible (distributed risks outweigh certain torture).

  Let $D(x)$ be the moral disutility of outcome $x$.
  Let $T$ be the state of "being tortured for 50 years."
  Let $S$ be the state of "getting a dust speck in the eye."
  Let $N$ be the population size ($N$ is astronomically large).
  Let $p$ be a probability such that $0 < p \ll 1$.

  **The Derivation:**
  1.  **Individual Continuity:** For any individual, there exists a $p$ such that the disutility of a sure speck is equivalent to the expected disutility of a risk of torture.
      $$D(S) = p \cdot D(T) + (1-p) \cdot D(\text{Nothing})$$
      *(Assumption: vNM Continuity holds for individual valuation.)*
  2.  **Aggregation of Sure Harms:** A large enough number of sure specks is worse than one sure torture.
      $$N \cdot D(S) > 1 \cdot D(T)$$
  3.  **Substitution (The EVI Move):** Substitute (1) into (2).
      $$N \cdot [p \cdot D(T)] > 1 \cdot D(T)$$
  4.  **Linearity of Aggregation:** Factor out $D(T)$.
      $$(N \cdot p) \cdot D(T) > 1 \cdot D(T)$$
  5.  **The Paradoxical Conclusion:** If we choose $N$ such that $N \cdot p > 1$ (i.e., the expected number of torture victims exceeds one), then the scenario where $N$ people face a risk $p$ of torture is morally worse than the scenario where 1 person faces sure torture.

  Standard utilitarianism accepts this conclusion. It implies that if we spread the risk of torture thinly enough across enough people, we create a moral catastrophe worse than actually torturing someone.

  ## 3. Identifying the "Expected-Value Move"
  The paradoxical work is done entirely at **Step 3 (Substitution)** and **Step 4 (Linearity)**. This relies on the **Principle of Interpersonal Expected-Value Equivalence**:

  > **PIEVE:** If an individual is indifferent between a sure harm $h$ and a lottery $L$ with expected disutility $h$, then a society should be indifferent between $N$ people suffering $h$ and $N$ people facing lottery $L$, provided the aggregate expected disutilities are equal.

  Your argument rejects PIEVE. You argue that **moral aggregation is not linear in probability.** Specifically, the social welfare function $W$ should not treat the sum of expected disutilities $\sum E[D_i]$ as the sole metric of badness when catastrophic harms are involved.

  The error is treating *risk* as a *fractionalized harm* that can be summed across persons to reconstruct a *whole harm*.
  *   **Sure Harm:** $N$ people suffer $S$. (Realized disutility distributed).
  *   **Risk Harm:** $N$ people face $p$ chance of $T$. (Potential disutility distributed).

  The aggregationist assumes that $N \times (p \text{ chance of } T) \equiv (N \cdot p) \times (\text{Sure } T)$.
  Your position is that **$N$ risks of $T$ never equal 1 sure $T$,** regardless of $N$, if $p$ is below a certain threshold.

  ## 4. The Positive View: Risk-Certainty Discontinuity
  To formalize your position, we must modify the Social Welfare Function to distinguish between *ex ante* risk imposition and *ex post* realized harm.

  ### 4.1. The Threshold Principle
  We introduce a moral threshold $\tau$ for probability. For any harm $H$ of sufficient severity (e.g., torture), if the probability of imposition $p < \tau$, the moral weight of that risk does not aggregate linearly.

  Let $w(p, H)$ be the moral weight of imposing probability $p$ of harm $H$ on one person.
  *   **Standard View:** $w(p, H) = p \cdot D(H)$.
  *   **Your View:** $w(p, H) = f(p) \cdot D(H)$, where $f(p)$ is non-linear.

  Specifically, you argue for a **Lexical Priority of Certainty**:
  $$\forall N, \forall p < \tau: \sum_{i=1}^N w(p, T) < w(1, T)$$

  Even if $\sum p > 1$, the moral weight of distributed risk cannot exceed the moral weight of one certain victim. This creates a discontinuity at $p=1$. The jump from "almost certain" to "certain" carries infinite or lexical moral weight that cannot be bridged by aggregation.

  ### 4.2. Blocking the Slide
  With this modification, the derivation in Section 2 fails at Step 3.
  1.  **Individual Continuity:** $D(S) = p \cdot D(T)$ (Accepted for *individual* choice).
  2.  **Moral Non-Substitutability:** $W(N \text{ people suffer } S) \neq W(N \text{ people face risk } p \text{ of } T)$.
      *   The left side aggregates *sure* disutilities.
      *   The right side aggregates *risk* weights.
  3.  **Result:** We can maintain that $N$ specks are worse than 1 torture (aggregating sure harms) *without* being forced to conclude that $N$ risks of torture are worse than 1 torture (aggregating risks).

  This decouples the two intuitions. You can be an aggregationist about *realized well-being* while being a prioritarian or deontologist about *risk imposition*.

  ## 5. Philosophical Justification
  Why should we accept this discontinuity? Three arguments support your position for the seminar:

  1.  **The Phenomenology of Victimhood:**
      A person who is tortured suffers a categorical violation of agency and bodily integrity. A person who faces a $1/N$ risk of torture does not suffer this violation unless the risk materializes. Aggregating risks assumes that "fractional violations" sum to a "whole violation." Your view holds that rights violations are binary: you either violate someone's right against torture, or you do not. Imposing a tiny risk is a different moral category than imposing the harm.

  2.  **The "No One to Blame" Problem:**
      In the "1 Sure Torture" case, there is a specific victim who was sacrificed. In the "$N$ Tiny Risks" case (where $N \cdot p > 1$ but no torture actually occurs, or even if one occurs by chance), no specific individual was *destined* to be the victim. The aggregationist view requires us to treat probabilistic expectations as morally identical to realized fates. Your view respects the moral significance of *actual* victimization over *expected* victimization.

  3.  **Avoiding the "Tyranny of Small Risks":**
      If we accept the EVI move, any policy that imposes a tiny risk of catastrophe on everyone (e.g., a slightly unsafe nuclear plant) could be judged worse than a policy that certainly catastrophically harms one person, provided the population is large enough. This paralyzes risk management. Your view allows us to prioritize avoiding certain catastrophes over minimizing distributed micro-risks.

  ## 6. Anticipating Objections
  **Objection 1: The Continuity Challenge.**
  *Critique:* If you reject the EVI move, you violate the Continuity Axiom of rational choice. If $p$ is close enough to 1, surely $N$ risks are worse?
  *Reply:* Distinguish *individual* rationality from *social* morality. An individual may trade off risk and certainty linearly. But social morality involves rights and constraints that are not subject to individual vNM axioms. The discontinuity exists at the level of *rights violation*, not *utility*.

  **Objection 2: The Ex-Ante/Ex-Post Dilemma.**
  *Critique:* If you don't aggregate risks, how do you evaluate policies before outcomes are known?
  *Reply:* We evaluate policies based on the *structure* of risk imposition, not just the sum of probabilities. A policy that concentrates risk (1 person sure harm) is structurally distinct from a policy that distributes risk ($N$ people tiny harm), even if expected values match. We can rank the former as worse without needing to sum the latter into equivalence.

  **Objection 3: Why stop at Dust Specks?**
  *Critique:* You admit $N$ specks might be worse than 1 torture. Why is aggregating specks okay but aggregating risks of torture not?
  *Reply:* Specks are *realized* harms in that scenario. Risks are *potential* harms. The aggregation of realized minor harms is plausible (many headaches outweigh one broken arm). The aggregation of potential major harms to outweigh a realized major harm is not. The distinction is **Realized vs. Probabilistic**, not just Small vs. Large.

  ## 7. Conclusion for the Seminar
  The Dust-Specks Paradox is not merely a problem of aggregation; it is a problem of **probabilistic substitution**. The paradox relies on the premise that we can slide from "Sure Small Harms" to "Risky Large Harms" via Expected Value without moral loss.

  By drawing a firm line between **Aggregating Sure Harms** and **Aggregating Risks**, we preserve the intuition that many minor harms can outweigh a major one, while rejecting the counter-intuitive conclusion that distributed micro-risks of catastrophe outweigh certain catastrophe. This requires rejecting the linearity of probability in the Social Welfare Function, positing instead that **certainty carries a lexical moral weight that probability cannot replicate through aggregation.**

  ---

  ### Seminar Discussion Points
  1.  Does this view commit us to ignoring small risks entirely? (No, it just caps their aggregate weight relative to certainty).
  2.  Is the distinction between "risk" and "certainty" sustainable if $p = 0.9999$? (This tests the threshold $\tau$).
  3.  Does this align better with Deontology or Rule-Utilitarianism? (It suggests a Rule-Utilitarian constraint on risk aggregation).
