      *   *Objection 4 (The Feminist - Medium/High Damage):* Who bears the cost of the "scaled claim"? Care labor.
      *   *Objection 5 (The Realist - Medium Damage):* Feasibility. States will just hide coercion better.
      *   *Objection 6 (The Nationalist II - High Damage):* The "Coercion to Prevent Coercion" trap. Border enforcement *is* coercive. Is it defensive?
      *   *Objection 7 (The Grad Student/Threshold - High Damage):* The "Everything is Coercion" slippery slope. Climate change, trade, etc.
