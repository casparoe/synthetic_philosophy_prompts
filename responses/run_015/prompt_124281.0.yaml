      *   **Audience:** Specific mix of 7+ distinct interlocutors (2 Liberal Nationalists, 1 Cosmopolitan, 1 Public Law Scholar, 1 Feminist/Relational Theorist, 1 Political Realist, Grad Students).
      *   **Thesis:** Right to exclude is fiduciary/jurisdictional, not ownership-based. "Coercion-Symmetry Condition": You can only exclude if you *don't* coerce. States currently coerce extraterritorially (visa sanctions, offshore processing, etc.), creating "coercion without admission." Remedy: Stop coercing or grant scaled entry claims.
      *   **Known Weaknesses:** (a) No principled threshold for coercion vs. exclusion right; (b) "Coercion to prevent coercion" escape hatch might swallow the rule.
      *   **Constraints:** ~8 objections, ordered by likelihood $\times$ damage. Phrased in the specific voice of the interlocutor. 2-minute spoken answer. Explicit concessions vs. holds. Flag thin replies/bluffs. Identify duplicate objections. Identify the "welcome" objection. Identify the "dangerous" question (likely the "everything is coercion" worry). No citations/bibliography. No restating thesis approvingly.

  2.  **Deconstruct the Audience & Potential Objections:**
