      *   *Cosmopolitan:* Will say the statist framing is the problem. Why care about the state's right at all? Why not just start with human rights?
      *   *Public Law Person:* Will care about jurisdiction, standing, and doctrinal coherence. Is "coercion" legally cognizable? Does this create a cause of action?
      *   *Feminist/Relational:* Will ask about care chains, dependency, and who does the work of border enforcement. Is the "fiduciary" language too masculine/abstract?
      *   *Realist:* Will ask: So what? States won't stop. Is this action-guiding?
      *   *Grad Students:* Will amplify the scariest faculty objection or poke at the threshold problem.
