          *   Define the Pattern of Inquiry.
          *   Define "Warranted Assertibility" (vs. Truth).
          *   Define the Public/Expert dynamic.
          *   *Caveat:* Note that *Logic: The Theory of Inquiry* (1938) codified this, but the ideas were circulating in 1937.
      *   **Part 2: Mapping the Commission onto the Machinery:**
          *   *Indeterminate Situation:* The confusion/terror of the Moscow Trials. Global public opinion split.
          *   *Problem Determination:* Not "Is Trotsky a good communist?" but "Did he commit the specific acts charged?"
          *   *Hypotheses:* (1) Trotsky conspired (Stalin's view), (2) Trotsky is innocent (Trotsky's view).
          *   *Operational Testing (The Hard Part):* How do you test history? Cross-examination, internal consistency, document analysis. This is the "quasi-experimental" nature of legal/historical inquiry.
          *   *Warranted Assertibility:* The conclusion "Not Guilty" isn't eternal truth, it's the warranted conclusion *of this inquiry*.
      *   **Part 3: The Beals Walkout (Internal Friction):**
          *   Dewey sees inquiry as cooperative. Beals leaving suggests the "community of inquirers" broke.
          *   Was it advocacy drift? Dewey insisted on procedure. Beals felt the procedure was rigged.
          *   *Analysis:* This highlights the fragility of inquiry when political stakes are high.
      *   **Part 4: The "Lab-Scale" Critique & Historical Knowledge:**
          *   Can pragmatism handle the past? You can't manipulate the past.
          *   *Response:* Inquiry manipulates *evidence*, not the event. The "operation" is the cross-examination.
          *   *Verdict:* It rescues experimentalism from pure positivism but stretches "operation."
      *   **Part 5: The Trotsky Complication (Fallibilism vs. Unfalsifiability):**
          *   Trotsky withheld info about opposition contacts.
          *   Does this invalidate "Not Guilty"?
          *   *Deweyan View:* Warranted assertibility is time-bound. New evidence = new inquiry.
          *   *Risk:* Does this make the theory immune to criticism? (The "No True Scotsman" risk).
      *   **Part 6: Experts vs. The Public:**
          *   Dewey wanted an informed public, not rule by experts.
          *   The Commission: 12 experts deciding for the public.
          *   *Tension:* Is this the "Eclipse of the Public"? Or a necessary division of labor to *enable* the public?
          *   *Lean:* It's a tension Dewey never fully resolved.
      *   **Conclusion:** Where the theory is silent. (e.g., The emotional/ideological resistance to inquiry).

  5.  **Refining for Constraints:**
      *   *Check:* Did I distinguish settled vs. contested?
          *   *Settled:* Dewey chaired, report published, Beals quit.
          *   *Contested:* Extent of Trotsky's guilt (archival revelations post-1991), whether Commission was biased.
          *   *Action:* Use phrases like "Historians generally agree now..." vs. "At the time, critics argued..." and "Reconstructing Dewey's likely view..."
      *   *Check:* Did I avoid smoothing?
          *   *Action:* Explicitly state where the mapping feels forced (e.g., "operational testing" of history).
      *   *Check:* Did I address the "warranted assertibility" trap?
          *   *Action:* Discuss the risk of relativism if every new finding just shifts the warrant without admitting error.

  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* I initially thought about citing *Logic: The Theory of Inquiry* as if it existed in April 1937. It was published 1938. I must clarify that Dewey was working these ideas out *during* this period (the Gifford Lectures were 1938, but the groundwork was earlier). I should frame it as "Dewey's mature epistemology as crystallizing around this time."
      *   *Nuance on Trotsky:* The archives (post-Soviet) show Trotsky *did* advocate for regime change but not the specific sabotage/assassination charges. The Commission found him not guilty of the *charges*. This distinction is vital for the "Warranted Assertibility" section. It wasn't a total lie, but it wasn't the whole truth either.
      *   *Nuance on Beals:* Beals wasn't just a crank; he was a journalist. His objection was about the *process*. This fits Dewey's focus on method over outcome.
      *   *Nuance on Public:* Dewey's "Public" is about consequences. The Commission tried to make the consequences of the Trials intelligible to the Public.

  7.  **Final Polish:** Ensure the tone is academic but accessible (grad seminar level). Ensure the "I'm not sure" moments are explicit. (e.g., "It is unclear whether Dewey would view X as...")

  8.  **Final Review against Prompt:**
