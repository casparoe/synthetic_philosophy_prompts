prompt: |-
  so i was hanging out with my friends Jordan and Riley last weekend and they got into this weird argument about that philosophy thing where your supposed to flip a coin between saving one person or five people (Taurek? i think thats the name). Jordan was like, look, if its literally one vs five, numbers dont matter, you just flip a coin because each person has an equal claim to be saved. Riley said okay but what if the five are all like 95 years old and the one is a newborn? Jordan said thats not the point, the point is you dont aggregate people like they're math problems. Then Riley came up with this idea she called "life-stage asymmetry"—she said each person isnt just a unit, they carry a different weight of future potential, and if you respect that then saving the baby isnt aggregation, its just recognizing that the claim of the one is heavier on its own terms. Jordan fired back that "heavier claim" is just aggregation in disguise: your multiplying the value of a future by the number of years and then comparing totals, which is exactly what Taurek said not to do. Riley said no, its not multiplication, its indexical weighting—like, you evaluate each claim on its own terms without adding them up, and in this case the one claim just happens to be stronger. Jordan said that sounds like sophistry, because if you had five babies and one old person, Riley's method would still save the five, which means shes secretly counting heads after all. Riley admitted that yeah, in the five-babies case she saves all five, but she said thats because each baby has an equally heavy claim, not because five is more than one. Jordan said thats a distinction without a difference and definately proves her view collapses back into counting. They kept going in circles and eventually asked me to referee, but i honestly dont know who's right at each step. can you go through thier exchange move by move and say who's right about what? like rate each argument from clearly wrong to clearly right and briefly justify each rating. also tell me if either of them is missing something big that they both ignored. please dont just say "it depends"—actually adjudicate, and say who is more right overall.
