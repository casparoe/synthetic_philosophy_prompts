answer: |-
  Hi there

  This is a fantastic setup and I think you are right to lean on the visceral impact of the chocolate to make the abstract stakes land. The distinction you are drawing between benefit-priority and level-priority is not fake at all, in fact it is the central hinge in the literature on this topic, often framed as the difference between prioritarianism and telic egalitarianism. The former weights benefits by the recipient's baseline, while the latter values the pattern of levels itself. Your intuition that students conflate them is spot on, and the activity works best if it functions as a machine to separate those two intuitions rather than proving that benefit-priority entails leveling down, because strictly speaking it does not. If you design the votes correctly, the students will discover that their commitment to helping the worse off is actually a commitment to equality of levels, which is what carries the leveling down implication. Here is how I would structure the eighty minutes to get that result while incorporating your specific requests about randomness and the better than distinction.

  You should start by setting the stage without naming any theories, simply telling the class that you will be making collective decisions about how to distribute the chocolate in the room and that for some rounds the decisions will be binding. You need two named groups on the board, say Group A and Group B, with ten students assigned to each via a quick random draw at the start so everyone knows their group membership but the groups are otherwise anonymous. Put a visible pile of chocolate bars next to each group label on the board, starting with ten bars for Group A and two bars for Group B. The first vote should be a pure transfer where you propose taking one bar from Group A and giving it to Group B, resulting in a nine to three split. This establishes the baseline intuition that equality or priority feels right. The second vote should be a gain for the worse off without loss to the better off, moving from the original ten and two to ten and three. This isolates the benefit-priority intuition because everyone agrees the worse off gaining is good. The third vote is the critical trade-off where you offer either giving two extra bars to Group A or one extra bar to Group B. If they vote for the single bar for the worse off, they are revealing a strong priority weighting. You want to push this until you find the point where they switch, but for the sake of the trap, you want them to commit to the view that benefits to the worse off carry significant weight.

  Now you spring the trap with the leveling down vote. Return to the original ten and two distribution and propose a move to five and two. You take five bars from Group A and put them back in your bag, explicitly stating that Group B gets nothing extra. If they have been voting based on level-priority without realizing it, a significant portion will vote for this because it reduces inequality. This is the moment where you must follow through and actually remove the chocolate if the vote passes, because the physical loss is what triggers the discomfort needed for the debrief. After this, you run the random loser round. Reset to ten and two, but tell them you will vote on whether to level down to five and two before you draw lots to decide which group is which. This tests whether their objection is person-affecting. If they vote against leveling down here but voted for it earlier, they reveal that their objection was about identifiable losers rather than the impersonal badness of the outcome. Finally, to address your question about better than versus no reason, do not run this as a distribution vote but as a meta-vote. Ask them to raise hands for one of two statements: first, that the leveled down outcome is in some way better than the unequal outcome, or second, that the leveled down outcome is not better but there is no reason to prefer the unequal one. This forces them to commit to whether equality has intrinsic value or if they are just refusing to endorse inequality.

  For the debrief, you need to map these votes directly onto the philosophical distinctions without lecturing. Point out that the first few votes felt obvious because both benefit-priority and level-priority recommend them, which is why the conflation is so stable. The leveling down vote is where the views diverge, and if they voted for it, they revealed a commitment to level-priority. You should affirm that your distinction is robust and does not collapse, but warn them that the activity might not perfectly separate the views if students are voting inconsistently. There are predictable failure modes you need to be ready for. First, students may vote self-interestedly once they know their group membership, so emphasize that the groups are anonymous and the chocolate is for the group pool, not individuals, or use the veil of ignorance round to mitigate this. Second, someone might spot the chain early and shout out the leveling down implication to spoil the sequence. Handle this by acknowledging their insight but asking the class to finish the experiment to see if the majority actually feels the pull of the intuition before critiquing it. Third, you may get inconsistent majority votes that do not form a coherent ranking. If this happens, use it as evidence that their intuitions are a mix of competing principles rather than a single theory. Fourth, the sheer silliness of destroying chocolate will come up. Lean into it. Acknowledge that it feels absurd, and ask them why it feels absurd if no one is worse off in the leveled down scenario compared to the unequal one. That absurdity is exactly the leveling down objection in action.

  There is one limitation you should be honest about in your own planning. The activity can show them the entailment of leveling down, but it cannot make them feel why this entailment is a reduction of the view rather than just a cost worth paying. Some students will bite the bullet and say that yes, equality is valuable even if it means less overall good, and the chocolate exercise alone will not disabuse them of that. You will have to supply the argument yourself in the debrief, specifically by pressing the point that a change that is better in some way but worse in no way should be all-things-good-better, and if leveling down is better in the respect of equality but worse in no respect because no one loses, then it should be all-things-good-better, which is implausible. The activity creates the tension, but you have to articulate why the tension breaks the theory rather than just stretching it. Also, be prepared for the possibility that the benefit-priority versus level-priority distinction might feel like semantic hair-splitting to them until you show how it changes policy recommendations, so have a real-world example ready for the last five minutes, such as healthcare rationing, where prioritizing the sick matters versus equalizing health outcomes matters differently.

  One final note on the execution of the chocolate destruction. Make sure you have a clear bag where the removed chocolate visibly accumulates. Do not eat it immediately, as that looks like a personal gain, but rather set it aside as wasted resources. The visual of the pile growing while no one gets richer is the key image they will walk out with. If the class votes against leveling down, do not force it, but ask them what principle stopped them, since that principle is what you want to examine. If they say nobody should lose, you have uncovered the person-affecting view. If they say it is wasteful, you have uncovered a welfarist commitment. Either way, you get the material you need for the discussion. Just remember to keep the names of the views hidden until the very end so that their intuitions are not shaped by textbook definitions, and let the chocolate do the work of making the abstract concrete.

  Best of luck with the session
