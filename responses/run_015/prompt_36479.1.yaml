      *   *Motivation:* Address the "wanting it to be true" suspicion. Holding a view for comfort doesn't make it false, but it requires extra scrutiny. The view offers peace, which is its goal, but peace isn't truth.
      *   *Closing:* Summarize the status. It's a coherent fortress, but the cost of admission is denying deep intuitions about loss and potential.

