answer: |-
  This is one of the most robust findings in the cognitive science of expertise, yet it remains counterintuitive to the public (and often to the experts themselves). You are describing the dissociation between **Procedural Knowledge** (how to do) and **Declarative Knowledge** (what we know that we know), filtered through the **Introspection Illusion**.

  There isn't one single word, but there is a specific cluster of concepts you need to triangulate. If you need a headline term, **"Tacit Knowledge"** (Michael Polanyi) is the historical anchor, but for a modern science piece, **"The Dreyfus Model of Skill Acquisition"** combined with **"Naturalistic Decision Making" (NDM)** gives you the mechanical edges you need.

  Here is the breakdown of the phenomenon, the distinction between your cases, and how to test for it in the field.

  ### 1. The Core Concept: Procedural vs. Declarative Dissociation

  The nurse and the mechanic possess **Procedural Knowledge**. This is knowledge encoded in the basal ganglia and cerebellum. It is compressed, high-speed, and associative. It operates on pattern recognition, not rule application.

  The chess player (in your example) is operating primarily on **Declarative Knowledge**. This is encoded in the hippocampus and prefrontal cortex. It is slow, serial, and rule-based.

  **The Phenomenon:** When you ask an expert (Nurse/Mechanic) to explain their Procedural Knowledge, their brain is forced to translate a high-dimensional, analog, sensory-motor process into a low-dimensional, digital, linguistic format. This translation fails.

  To bridge the gap, the brain's "Interpreter Module" (a concept from Michael Gazzaniga's split-brain research) **confabulates**. It does not lie maliciously; it constructs a plausible narrative that fits cultural expectations of rationality. The nurse *believes* she is using the angle she describes because that is the story her conscious mind tells to make sense of her hand's success.

  **The Chess Player:** The middling chess player is not confabulating. They are accurately reporting their conscious process. The problem is that their conscious process is *not what makes a Grandmaster*. A Grandmaster chess player would actually look more like your nurse: they would make a move instantly based on "feel" (pattern recognition) and struggle to explain why, or give a reason that is a post-hoc rationalization of a intuition.

  **The Label:** You are looking at the difference between **Intuitive Expertise** (Nurse/Mechanic/Grandmaster) and **Analytical Competence** (Middling Chess Player).

  ### 2. The Framework: The Dreyfus Model

  To give your article structural bones, use the **Dreyfus Model of Skill Acquisition**. It divides skill into five stages. The distinction you are seeing is between Stage 4 (Proficient) and Stage 5 (Expert).

  *   **Stage 3/4 (The Chess Player):** The "Competent/Proficient" performer. They rely on conscious planning and maxims. They can articulate their rules. They are analytical. *They can tell you what they are doing, but they aren't fast or fluid enough to be top-tier.*
  *   **Stage 5 (The Nurse/Mechanic):** The "Expert." They no longer rely on rules. They see the whole picture. Their response is intuitive. *If you force them to articulate rules, they must regress to Stage 3 thinking to do so, which is why their description is often wrong or outdated.*

  **The Edge:** Expertise is not just "more knowledge." It is a **phase shift** in how knowledge is processed. At the highest level, expertise looks like instinct.

  ### 3. Why the Correct Description Does No Work

  You asked: *Is the fact that the description does no work actually evidence about what the knowledge is, or is it just evidence that she's bad at introspecting?*

  It is evidence of **where the knowledge is stored.**

  If the knowledge were declarative (like the chess player's), correcting the theory *should* improve performance. If I tell the chess player, "Actually, that pawn structure is weak," their game improves.
  With the nurse, the knowledge is **Embodied**. It is in the proprioceptive feedback loop between her eyes and her hands. The verbal cortex is a bystander.

  **The Concept:** **"Causal Opacity."** The expert has access to the *input* (the baby's neck) and the *output* (the tube is in), but the processing happens in a black box (subconscious pattern matching) that the verbal mind cannot access. When asked, the verbal mind guesses the algorithm.

  ### 4. Interview Heuristics: How to tell them apart

  In an interview, you need to distinguish between **True Intuitive Expertise** (Nurse) and **Rigid Rule-Following** (Chess Player/Bad Expert). Here is how you test the edges:

  **A. The Disruption Test**
  *   **Ask them to slow down and narrate step-by-step while doing it.**
  *   **Nurse (True Expert):** Performance will degrade. They might even fail. This is known as **"Centipede's Dilemma"** (anthropomorphized in Kipling's *The Elephant's Child*). Bringing subconscious procedure into conscious awareness disrupts the flow.
  *   **Chess Player (Analytical):** Performance stays the same or improves. They are already operating consciously.

  **B. The Exception Test**
  *   **Ask: "When does this rule fail?"**
  *   **Nurse:** Will struggle to give a rule-based exception. They will say, "It just feels different," or "You know it when you see it." They deal in nuances, not binaries.
  *   **Chess Player:** Will give you a conditional clause. "Unless the opponent has a bishop pair, then..." They deal in logic trees.

  **C. The Novice Teaching Test**
  *   **Ask: "Show me how to teach this to a beginner."**
  *   **Nurse:** Will likely resort to metaphors or physical guidance ("Feel the resistance"). They cannot transfer the tacit knowledge, only scaffold it.
  *   **Chess Player:** Will give you a checklist. "First do X, then Y."

  **D. The Contradiction Probe (Your specific scenario)**
  *   **Show them the video (as you did).**
  *   **Nurse:** "Huh. Weird." (Accepts data, but doesn't integrate it into a new rule). *This confirms the knowledge is not rule-based.*
  *   **Mechanic:** "That's what the manual says." (This is slightly different; this is **Institutional Confabulation**. He is using the manual's language as a social shorthand, knowing his hands ignore it. This is a communication strategy, not necessarily a cognitive error).
  *   **Chess Player:** Would try to reconcile the move with the theory. If the move worked but broke the theory, they would feel anxiety. The expert feels no anxiety.

  ### 5. Recommended Reading for Your Notes

  To flesh this out, you should look at three specific sources:

  1.  **Gary Klein, *Sources of Power*:** This is the bible of Naturalistic Decision Making. Klein studied fireground commanders who did exactly what your nurse did: make instant, life-saving decisions they couldn't explain, and then invent logical reasons for reporters. He coined the term **Recognition-Primed Decision (RPD) Making**.
  2.  **Hubert Dreyfus, *Mind Over Machine*:** The philosophical framework for why rule-based AI (and rule-based humans) fail at expertise.
  3.  **Nisbett & Wilson (1977), "Telling more than we can know":** The seminal psychology paper on the Introspection Illusion. They proved that people often do not know why they made a choice, but will confidently invent a reason when asked.

  ### Summary for your Article

  The word you are looking for is likely **"Tacit Knowledge,"** but the *mechanism* is **"Post-hoc Rationalization of Procedural Memory."**

  *   **The Nurse** has **Embodied Expertise**. Her verbal account is a **User Interface**, not the **Source Code**. The mismatch proves her skill is deep enough to bypass language.
  *   **The Chess Player** has **Explicit Competence**. His verbal account *is* the Source Code. The fact that it is accurate but middling proves that high-level expertise requires moving *beyond* explicit code.

  **The Hook:** True expertise is often invisible to the expert. They are the last person to ask how they do it, because the part of them that does it doesn't speak English. The moment they can explain it perfectly, they are likely no longer operating at the peak of intuition, but rather at the level of a teacher or analyst.

  **One caution:** Be careful not to romanticize the "mysterious instinct." The nurse's instinct is actually **compressed experience**. It is thousands of intubations collapsed into a single sensory cue. It is not magic; it is data compression that the conscious mind can no longer decompress. That is why the description is false: the conscious mind is trying to decompress a file it doesn't have the codec for.
