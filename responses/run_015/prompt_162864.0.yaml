      *   *The Chess Player (Case 3):* This is **Rationalization** or **Intellectualization** without **Intuition**. They have the Declarative knowledge but lack the deep Procedural/Pattern-recognition layer. This is often called "The Competent Stage" in Dreyfus, or simply "Book Smart."
