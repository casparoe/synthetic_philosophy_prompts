  2.  **Deconstruct the Gibbard-Satterthwaite Theorem:**
      *   *What does it actually say?* For any voting system that selects a single winner from three or more candidates, if it is not a dictatorship (one person decides), and it allows voters to have any preference order over candidates (unrestricted domain), then it is not strategy-proof (there exists some situation where some voter can benefit by lying).
