      *Refining the "Status" for Reading 5 (Cardinal/Approval):* Gibbard-Satterthwaite (1973) is strictly ordinal. Gibbard (1978) covers general mechanisms. However, Approval Voting *is* manipulable (you might not vote for your true favorite if they have no chance). So the claim "G-S doesn't cover Approval" is technically true for the 1973 theorem, but the *conclusion* (Approval is strategy-proof) is false. I need to be careful there. I will phrase it as "The 1973 theorem assumes rankings, but later results generalize."

