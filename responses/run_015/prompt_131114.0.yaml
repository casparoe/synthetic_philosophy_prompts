          4.  *Falsification Conditions* (what would count as evidence against each side).
          5.  *Verbal Disputes* section (identifying if "real" is the issue and what the substantive question is underneath).
      *   **Specific Constraints/Inclusions:**
          1.  **ML Feedback Loop:** Address whether production ML feedback loops (classifier changes distribution) count as Hackingian looping. Needs nuance (self-conception vs. behavioral adaptation).
          2.  **Hypothetical Case:** "Persistent Notification-Checking Disorder" (PNCD). Predictions on prevalence, presentation, population over 10 years. Cross-country divergence prediction. Does prevalence movement imply lack of "real kind"?
          3.  **Neuro/Interventionist Crux:** If we classify by circuit/computation instead of symptoms, does looping stop/attenuate/relocate? Specific observations that would move them.
          4.  **Gradient vs. Bright Line:** Is looping all-or-nothing? How to handle middle cases?
          5.  **Semantics of "Real":** Identify if this is verbal and extract the substantive question.
      *   **Formatting:** No page numbers/refs/jargon without explanation. Predictions must be specific (no hedging).

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *Side A (Realism):* Believes underlying biology exists. DSM is imperfect but aiming at truth. Looping is noise, not the essence.
      *   *Side B (Constructivism):* Believes the act of labeling changes the phenomenon. Biology is entangled with culture/self-conception.
      *   *Common Ground:* Both agree the DSM is imperfect. Both agree biology matters. Both agree classification has consequences. Both agree some conditions are more stable than others.
      *   *The ML Issue:* Side A says ML drift is causal/behavioral, not conceptual. Side B says the mechanism (self-conception) matters less than the structural feedback. *Compromise:* It's a *structural analogue* but distinct in *mechanism*.
