      *   **Section 3: Cruxes & Pre-registered Predictions:**
          *   *Crux 1: The PNCD Case (Constraint 2).*
              *   Study: Introduce PNCD in Country X (high tech/insurance) vs Country Y (low tech/different insurance).
              *   Side A Prediction: Prevalence stabilizes after initial spike; core symptoms remain constant across borders.
              *   Side B Prediction: Prevalence diverges significantly; symptom presentation shifts to match cultural expectations of the label.
          *   *Crux 2: The Neural Move (Constraint 3).*
              *   Study: Reclassify Depression by circuit (e.g., specific connectivity pattern) vs. Symptoms.
              *   Side A Prediction: Looping effects diminish; patients identify with "circuit fault" not "identity."
              *   Side B Prediction: Looping relocates; patients incorporate "circuit fault" into identity (e.g., "my connectivity is broken"), altering behavior to match the new label.
          *   *Crux 3: The Gradient (Constraint 4).*
              *   Study: Compare Alzheimer's (low looping) vs. Borderline Personality (high looping).
              *   Side A: Bright line exists based on biological autonomy.
              *   Side B: It's a gradient of *resistance* to classification, not a difference in kind.

      *   **Section 4: Falsification Conditions:**
          *   What makes Side A quit? If biological markers never correlate with treatment response better than symptoms.
          *   What makes Side B quit? If a category remains perfectly stable despite widespread public knowledge and self-identification.

      *   **Section 5: Verbal Disputes & The "Real" Question (Constraint 5):**
          *   Address the word "Real."
          *   Side A = Mind-independent.
          *   Side B = Projectible/Useful.
          *   Substantive Question: Is the stability of the cluster robust to *knowledge* of the cluster?

      *   **Section 6: The ML Feedback Loop (Constraint 1 Detail):**
          *   Need to ensure this is prominent. I'll integrate it into Agreed Claims and the Disagreement Table specifically.
          *   Agreed: Both are feedback loops where output affects input distribution.
          *   Disagreed: Whether the *mechanism* (user optimization vs. self-conception) makes them distinct *kinds* of loops.

  4.  **Review and Refine:**
      *   *Tone Check:* Is it accessible to a backend engineer? Avoid heavy phenomenology jargon. Explain "projectible" and "looping."
      *   *Constraint Check:*
          *   ML Loop addressed? Yes.
          *   PNCD case included? Yes.
          *   Neuro/Interventionist crux? Yes.
          *   Gradient vs. Bright Line? Yes.
          *   "Real" semantics? Yes.
          *   Predictions pre-registered (no hedging)? Yes.
          *   Two formulations per disagreement row? Yes.
      *   *Formatting:* Numbered sections, clear tables.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say ML looping is definitely *not* Hackingian.
      *   *Correction:* Side B will argue it *is* structurally identical. Side A argues mechanism matters. The agreement should be on the *structure* (feedback) but disagreement on the *ontology* (does self-conception matter?). I need to make sure the "Agreed Claims" section reflects the nuance that they are *analogues* but maybe not *identical*. Let's call it a "Functional Analogue" in the agreement, and leave the "Is it Hackingian?" for the disagreement.
      *   *PNCD:* Make sure the predictions are specific. Side A says "stabilizes." Side B says "diverges."
      *   *Neuro:* Side B needs to be careful not to sound like they deny biology. They deny biology *escapes* the social context.
