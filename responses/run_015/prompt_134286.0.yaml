answer: |-
  Here is the committed take you asked for.

  The divergence between Peirce and James is **real**, not merely rhetorical. It is not the case that James is simply describing Peirce's convergence "from the inside." They are solving different problems with different metaphysical commitments. Peirce is building a logic of science grounded in Scholastic Realism; James is building a psychology of belief grounded in humanistic nominalism.

  Here is how that plays out regarding your specific worry about open-ended domains (ethics/aesthetics) and the risk of relativism.

  ### 1. Peirce: Eschatology, Not Correspondence
  You asked if Peirce's view collapses into correspondence in domains where convergence is structurally blocked. **No, it does not collapse into correspondence; it collapses into eschatology.**

  Peirce defines the "Real" as that which is independent of what you or I think, *but* its intelligibility is tied to the final opinion of the community of inquirers. If convergence is impossible in ethics or aesthetics, Peirce does not retreat to a correspondence theory (where truth is a static match between proposition and mind-independent fact). Instead, he treats truth in those domains as a **regulative ideal**.

  For Peirce, if a domain is genuinely open-ended such that no convergence is *even in principle* possible, then for Peirce, that domain is not yet capable of bearing truth-values. It is "pseudo-inquiry." However, Peirce was a metaphysical optimist (via his doctrines of Synechism and Agapism). He believed that because mind is continuous with matter, and because evolutionary love draws minds together, convergence in ethics *is* possible, just on a much longer timeline than physics.

  **The Verdict on Peirce:** In open-ended domains, Peirce's truth doesn't become "false" or "correspondence"; it becomes **deferred**. This is a bug for anyone wanting to make ethical claims *now*, but it is consistent within his system. He avoids correspondence by insisting that without the *possibility* of a final verdict, there is no "fact of the matter" to correspond to in the first place. The truth isn't waiting out there; it is being forged by the long-run inquiry. If the inquiry stops or fractures permanently, the truth remains indeterminate, not corresponding.

  ### 2. James: Pluralism is a Feature, Not a Bug
  You asked if James has to say incompatible local beliefs (e.g., conflicting justice systems) are both true, or if he can block that without sneaking in convergence.

  James's pluralism **is a feature**, but you are right to worry about the "incompatible truths" problem. James blocks this not by smuggling in Peircean convergence, but by introducing a **moral constraint on satisfiability.**

  For James, truth is what is "expedient in the way of thinking." But "expedient" does not mean "comforting to me right now." It means fitting with the whole web of experience, including "stubborn facts" and the demands of other agents. James explicitly argues for the "inclusive" over the "exclusive." A belief system that works for Group A but requires the suppression or destruction of Group B fails the pragmatic test because it creates a universe of experience that is less satisfactory *overall*.

  James would say that if two groups have incompatible beliefs about justice, they are not both "True" in the absolute sense; they are both "working hypotheses" relative to their specific environments. However, the one that allows for a wider, richer, more inclusive set of human relations is *truer* because it satisfies more demands.

  **The Verdict on James:** He avoids radical relativism not by positing a final endpoint (Peirce), but by positing a **maximization function**. Truth is the credit system of ideas that yields the highest dividend in human satisfaction across the widest possible network. If a local practice "works" but isolates or destroys other practices, it is pragmatically inferior. It is "less true" because it leads to a dead end in the cash-value of experience.

  ### 3. Why James is Not "Internal Peirce"
  The idea that James is just describing Peirce's convergence from the first-person perspective is a common conciliatory move, but it fails under scrutiny.

  *   **Peirce's Convergence is Ontological:** For Peirce, the final opinion reveals the Real. The convergence is about the *object*.
  *   **James's Verification is Psychological/Moral:** For James, truth "happens" to an idea. It is a process, not a destination.

  If James were just Peirce from the inside, James would have to agree that the "cash value" is merely a symptom of the eventual convergence. He doesn't. James thinks the cash value *constitutes* the truth. For Peirce, my current feeling of certainty is irrelevant if the long-run inquiry disproves it. For James, if the belief genuinely guides me through experience without contradiction *now*, it possesses truth *now*.

  This is why Peirce famously renamed his philosophy "Pragmaticism" to distance himself from James. Peirce thought James's view made truth too malleable, too dependent on individual temperament. Peirce wanted truth to be hard, external, and coercive (like a brick wall); James wanted truth to be fluid, human, and instrumental (like a key fitting a lock).

  ### Summary of the Committed Take

  1.  **The Divergence is Real:** Peirce is a realist about the *process* of inquiry (truth is what the community *must* find); James is a humanist about the *value* of belief (truth is what *does* find a place in life).
  2.  **Peirce on Ethics:** He does not collapse into correspondence. He treats ethical truth as **indeterminate until convergence**. This makes his view robust against relativism but practically inert for immediate ethical dilemmas.
  3.  **James on Relativism:** His pluralism is a feature. He blocks incompatible truths not by convergence, but by **inclusivity**. A truth that cannot coexist with other truths is pragmatically defective.
  4.  **Final Diagnosis:** Peirce saves objectivity at the cost of immediacy; James saves immediacy at the cost of objectivity. In open-ended domains like ethics, **James is more useful, but Peirce is more rigorous.** If you need to act, use James. If you need to justify why your action isn't just tribal preference, you need Peirce's hope of eventual convergence.

  If you force me to pick which framework handles your "open-ended domain" worry better: **James wins on utility, Peirce wins on coherence.** James acknowledges that ethical truth is plural and evolving without needing a metaphysical promise of a final verdict. Peirce requires a metaphysical guarantee (Agapism) that minds *will* converge, which looks suspiciously like faith in open-ended domains. James admits the risk; Peirce legislates it away.
