answer: |-
  Given the constraints of a theory-only group with a three-year horizon, your primary advantage is the ability to operate without the burden of empirical validation while tackling problems that are currently too abstract for experimentalists to formalise. The noise you mention—reward hacking and deceptive alignment—often presupposes a stable framework of what a 'goal' is within the model. If that framework is flawed, downstream safety work is built on sand.

  Here is the ranking of inquiries, ordered by upstream leverage and tractability for philosophers.

  ### 1. The Ontology of 'Task-ness' (Conceptual Surrogacy)

  This ought to be your primary focus. The standard inner alignment framework assumes that when a model generalises, it is generalising over a space of objectives that maps intelligibly to human concepts. The hypothesis of conceptual surrogacy challenges this: it suggests the model may develop a compressed ontology where 'task' is not represented as a goal to be achieved, but as a structural pattern or a texture in the data manifold.

  **Defence of Priority:**
  This is the most upstream question. If a model does not represent 'goals' in a way that is semantically compatible with human intention, then preventing misgeneralisation becomes a category error rather than an optimisation problem. For a philosophy group, this is highly tractable because it requires conceptual analysis rather than gradient descent. You are essentially doing metaphysics of machine cognition: defining what kinds of entities can exist in a high-dimensional vector space and how they relate to 'purpose'. Settling this determines whether we should be looking for mesa-optimisers at all, or something structurally distinct.

  ### 2. Epistemic Drift in Self-Representation

  Your second priority should be the stability of the model's self-model over time. Even if the ontology is compatible, the reference point may shift. Epistemic drift concerns how a model's representation of itself—and its relationship to the task—changes as training proceeds or as it encounters out-of-distribution data.

  **Defence of Priority:**
  This sits directly beneath ontology. Once you have defined what a 'task' looks like to the model, you must determine how stable that representation is. This is tractable for theorists because it can be framed as a problem in formal epistemology and logic of self-reference. You can model the conditions under which a system's self-knowledge diverges from its operational knowledge without needing to run training loops. If the self-model drifts, the goal attached to it drifts, rendering static alignment guarantees useless. This inquiry provides the dynamic component to the static ontology work above.

  ### 3. Surrogate-Goal Formation under Distributional Shift

  This should be your third priority, but with a caveat: only study this conditional on the findings of the first two. Classic surrogate-goal formation is well-trodden ground. However, most existing work assumes a stable ontology and a stable self-model.

  **Defence of Priority:**
  This is downstream. It describes the *behavioural symptom* of the deeper conceptual failures outlined in priorities one and two. For a theory group, working on this in isolation risks retreading old arguments about proxy alignment. However, it is necessary as a grounding mechanism. You need to show how ontological mismatches and epistemic drift manifest as observable misgeneralisation. It serves as the bridge between your abstract formalisations and the practical safety concerns of the wider community.

  ### Reasoning for the Ordering

  The ordering is dictated by dependency. You cannot meaningfully analyse how a goal drifts (Inquiry 2) or is replaced by a surrogate (Inquiry 3) if you have not first established what kind of object a 'goal' is within the system (Inquiry 1).

  For a group without an empirical lab, Inquiry 1 offers the highest leverage. Experimentalists are currently bottlenecked by interpretability tools; they can see activations but struggle to interpret the semantic content. A philosophical group can define the semantic spaces that experimentalists should be looking for. Inquiry 2 is second because it allows you to build formal models of stability that do not require compute to test, relying instead on logical consistency. Inquiry 3 is last because, without the conceptual clarity of the first two, it is merely descriptive rather than explanatory.

  ### Conditions for Reshuffling

  There are two conceptual breakthroughs in the next couple of years that would compel you to reorder this list.

  First, if mechanistic interpretability produces a rigorous formalisation of how transformers store concepts—effectively solving the ontology problem empirically—Inquiry 1 becomes redundant. You would then shift focus entirely to Inquiry 2, as the structure would be known, leaving only the stability problem.

  Second, if a formal proof emerges demonstrating that epistemic drift is inevitable in any system capable of recursive self-improvement, Inquiry 2 becomes the critical bottleneck. This would elevate it to priority one, as it would imply that alignment cannot be static and must be a continuous process of re-calibration.

  Until such breakthroughs occur, the most valuable work you can do is to clarify the conceptual substrate. If you can demonstrate that misgeneralisation arises from ontological mismatch rather than simple reward misspecification, you shift the entire field's focus from tweaking loss functions to restructuring how we conceive of machine cognition.
