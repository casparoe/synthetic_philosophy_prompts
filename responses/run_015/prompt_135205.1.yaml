  2. The doomsday argument is bunk too. Learning my birth rank tells me nothing.
  3. Sleeping Beauty: halfer. 1/2.
  4. But the simulation argument does work. If a matured civilization runs a million simulated observers for every biological one, I should say I'm probably in a sim.
  5. My existence genuinely refutes hypotheses on which there are no observers at all — part of why I take fine-tuning arguments somewhat seriously. A dead universe is ruled out by the fact that I'm here.
  6. The thing I keep coming back to, which I made up and call the ping rule: all the evidence I ever get is at least one process with my exact observations exists — a ping — never I am a random draw from the set of such processes. Pings don't care how many instances there are. I use this to kill SIA and kill doomsday while keeping 4 and 5.
  7. Separately: if someone literally tells me I was selected by a lottery from all humans who will ever live, then updating on my position is obviously fine — that's just ordinary sampling, nothing anthropic.

