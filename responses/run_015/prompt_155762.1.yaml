      *   **Verification:** "If he says 10/10 but is humming a tune, what is your priority?"

  7.  **Writing the Response:** (Focusing on tone: empathetic, authoritative, structured, practical). *Self-Correction on Tone:* Keep it supportive but firm. This is a safety briefing.

