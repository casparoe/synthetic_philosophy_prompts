      *   *Wait, one more thought:* The prompt mentions he asks for painkillers "bad for the knee." This is crucial. It means he *does* have a motivation, just not an emotional one.
      *   *Re-evaluating the "One Example":* If I use the Sunburn, it explains the lack of movement. If I use the Painkiller request, it explains the cognitive awareness.
      *   *Best Single Example:* **The Sunburn.** It encompasses the lack of reaction to harm. The painkiller detail supports it but is secondary.
      *   *Wait, looking at the "Wrong Readings":* The biggest risk is "He doesn't feel it." The second is "He's brave."
      *   *Plan Adjustment:* I need to make sure the staff know they must act as his "affective cortex." They are the alarm bell.

