  hey — i'm writing a piece on how 19th-century logic texts accidentally mapped out modern philosphy of language, and i keep getting stuck on Mill's System of Logic (1843). there's a passage where he discusses hypothetical propositions — he takes an example like if the barometer falls then rain is likely, and argues we're not describing a real causal link between two events but rather treating the first event as a mental sign that licenses an inference about the second. he talks about the barometer's fall as something that indicates weather patterns, but he insists the if isn't binding nature together, just marking a premise in our reasoning.

