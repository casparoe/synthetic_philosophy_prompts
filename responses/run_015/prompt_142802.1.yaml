answer: |-
  Hi there, it sounds like a fascinating session and you are right to worry that this specific philosophical distinction often gets lost in translation for clinical audiences. To start the arc correctly you need to resist the urge to define particularism and generalism immediately because if you lead with definitions they will map them onto existing categories like protocol versus intuition. Instead you should begin by validating their reliance on guidelines since nurses and med students live in a world of best practices and hospital policies. Spend the first ten minutes establishing that moral reasoning in healthcare usually looks like applying a general principle to a specific case, such as respecting autonomy or maintaining confidentiality, and ask them to describe how they currently justify decisions when those principles conflict. This sets the stage for generalism not as a philosophical theory but as the default mode of their professional training, which makes the upcoming challenge feel more significant than just a theoretical exercise.

  Once you have established that baseline you introduce the carrying example you mentioned about the dying patient and the estranged sibling. This works much better than a trolley problem because trolley cases tend to assume that the moral weight of actions like killing or saving is fixed across contexts, whereas clinical ethics are saturated with professional duties that shift meaning based on relationships. In this scenario the nurse considers breaking confidentiality to contact the sibling. A generalist would argue that the rule against breaking confidentiality stands unless there is a pre-existing exception clause written into the policy, such as imminent harm to others. You need to walk them through the attempt to codify this specific situation into a rule, showing how every time they add an exception clause for this case, another edge case emerges that requires another clause, leading to an infinite regress of rules. This demonstrates the generalist commitment that there must be a rule covering the situation, even if we have not written it down yet.

  Then you pivot to the particularist claim which is the core of your session. You explain that the particularist is not saying we should break the rule anyway, but rather that the feature of promising confidentiality does not carry the same moral weight in this context as it does in a standard context. In this specific situation the promise might cease to be a reason for silence altogether because the context of impending death and reconciliation changes the valence of the reason itself. It is not that the rule is overridden by a stronger rule, but that the reason provided by confidentiality is holistically shaped by the surrounding features of the situation. This is the moment where the first major misconception will arise, which is that particularism means go with your gut. You must defuse this immediately here by emphasizing that particularism is still about reasons and reasoning, not feelings. Tell them explicitly that a particularist must be able to articulate why the context changed the reason, and if they cannot explain the shift in moral valence they are not doing particularism they are just acting on impulse.

  As you move deeper into the comparison you will likely encounter the second misconception that generalism means always follow hospital policy. You should address this when you are discussing the generalist position earlier in the arc or revisit it here to clarify that philosophical generalism is about the structure of moral truth not bureaucratic compliance. A generalist can believe a policy is wrong but still believe there is a correct general principle that overrides it. Make sure they understand that the debate is about whether moral reasons are invariant across contexts, not about whether administrators are infallible. This prevents the nurses in the room from dismissing generalism as blind obedience to management which would shut down their engagement with the philosophical substance.

  Toward the end of the session before you move to assessment you need to tackle the third misconception that this debate is simply about being flexible versus being rigid. This is a personality trap that will undermine the conceptual learning. You should explain that a particularist can be very rigid about certain contexts and a generalist can be very flexible with their rules, so the distinction is not about character traits but about how moral reasons function. Tell them that particularism claims the shape of the reason changes, while generalism claims the reason stays the same but might be outweighed. Keeping this distinction sharp ensures they leave understanding the metaphysical claim about reasons rather than just thinking you are encouraging them to be more adaptable clinicians.

  For the check at the end you need a scenario where empathy and particularism might diverge to ensure they have not just learned to be more empathetic. Present a case where being empathetic suggests one action but the contextual reasons suggest another, or vice versa, and ask them to justify the decision without using words like feel or intuitive. If they can articulate how a specific feature of the context altered the moral weight of a principle without appealing to a hidden rule or a gut feeling then they have grasped the distinction. If they simply say it depends on the situation you need to push them to explain how the situation changed the reason itself rather than just adding an exception. This verifies they understand the holistic nature of reasons rather than just accepting ambiguity.

  Finally regarding what to leave out you should definitely skip the names and bibliography entirely as you suggested. Mentioning Jonathan Dancy or the history of the debate will distract them and make it feel academic rather than practical. You can openly say we are not going there regarding the wider meta-ethical implications or the history of the theory because it does not help with clinical reasoning. Keep the focus strictly on the structure of their justification in patient care. If you stick to this arc you should be able to guide them through the nuance without letting them retreat into the comfort of common sense or protocol. Good luck with the session next week and I hope the group finds the distinction as useful as you do.
