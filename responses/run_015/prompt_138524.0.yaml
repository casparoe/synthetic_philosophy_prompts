  I pick the first side: the method actually producing the belief must track the truth, and I insist this is not gerrymandering but the core commitment of a subjunctive account that takes the causal etiology of belief seriously. You call it a cost that Nadia fails to know when she relies on the plaque despite having visual access, but that is only a cost if you presuppose that knowledge is a property of the agent-proposition pair independent of the specific cognitive route taken, which is precisely what tracking denies. On this view, knowledge is not a state you inhabit simply because a truth-tracking channel is open somewhere in your vicinity; it is a relation secured by the specific counterfactual dependence of *this* belief on *this* fact. If Nadia bases her belief on the plaque, her belief does not covary with the truth in the relevant nearby worlds where the manuscript is missing but the plaque remains, so the necessary condition for knowledge is not met by that belief token. This does not collapse into skepticism, nor does it render knowledge absurdly fragile, because the skeptical case is structurally distinct: in the archive, a tracking method (vision) is available and actually causally operative in her environment, whereas in the skeptical scenario, no method available to the subject tracks the negation of the skeptical hypothesis. The intuition that Nadia knows is best explained as conflating "S knows via method M" with "S is in a position to know via method M*," and while I concede the theory yields odd results in far-off skeptical cases, I will not concede that distinguishing between believing via a sensitive channel and believing via an insensitive one in ordinary cases is a bug rather than a feature. If you want to say she knows simpliciter, you are smuggling in an existential quantification that severs the link between the belief's actual grounding and its truth, but if you accept that knowledge requires the belief itself to be sensitive, then you must accept that a belief grounded in an insensitive premise fails to know, even if a redundant sensitive ground is nearby. The theory survives because it correctly identifies that epistemic status is method-relative, and your objection merely highlights that we often speak loosely about knowledge when we should be speaking precisely about methods.
