answer: |-
  A DSM work group spent four years defining "anticipatory dysregulation": rehearsing conversations and self-diagnosing via criteria lookup. Field trials returned an implausible kappa; prevalence doubled between the first and second site visit. Panicked, the committee added an exclusion: "Not better accounted for by familiarity with the criteria."

  "Finally, a boundary," the chair said.
  "Actually," said the statistician, "we've made the category a better predictor of itself. The patients have already read the exclusion."
  "Surely nature doesn't work that way."
  "Not indifferent kinds. If quarks subscribed to our journals, their mass would shift upon publication. But they don't read. Our patients do. The prevalence has already tripled."
