  **Joint Statement on Etiological and Causal-Role Accounts of Biological Function**

  **1. Points of Agreement**

  1.  Both parties accept the details of the synthetic microbiome case: a gene engineered into a gut microbiome for Vitamin B12 production mutates to accidentally break down a novel toxin, providing current survival value to the host despite lacking any evolutionary selection history for this specific capacity.
  2.  Both parties agree that any adequate theory of biological function must account for the possibility of malfunction, thereby providing a normative standard distinct from mere statistical normality.
  3.  Both parties acknowledge that evolutionary history and current causal contribution are real, observable phenomena, even if they disagree on which phenomenon constitutes the essence of biological function.
  4.  Both parties agree that the distinction between etiological and causal-role accounts hinges on the metaphysical status of history versus current capacity, rather than merely differing heuristic preferences.
  5.  Both parties accept that the synthetic origin of the gene presents a legitimate test case for distinguishing between these accounts, as it decouples current utility from past selection.

  **2. Points of Disagreement and Cruxes**

  | Point of Contention | Etiological Account (Selected Effects) | Causal-Role Account |
  | :--- | :--- | :--- |
  | **Status of Toxin-Breaking (Function Y)** | The capacity to break down the toxin is not a genuine biological function. It is a side-effect or spandrel because it lacks a history of natural selection for this specific contribution. | The capacity to break down the toxin is a genuine biological function because it is causally central to the host's viability and contributes to the current organization of the system. |
  | **Definition of Malfunction** | Malfunction must be defined relative to selection history. A trait can only malfunction if it fails to perform the capacity for which it was selected. | Malfunction is defined as the failure to make a specific causal contribution to the containing system. A trait malfunctions if it fails to perform its current systemic role. |
  | **Crux 1: The Status of Evolutionary History**<br>*(Is history constitutive of function or merely evidential?)*<br><br>**Relevant Case:** The synthetic gene scenario in its initial state (no selection history for toxin-breaking). | **Prediction:** Evolutionary history is constitutive. Without prior selection for Y, Y cannot be a function regardless of its current benefit. The lack of history metaphysically precludes function status. | **Prediction:** Evolutionary history is evidential. Current causal contribution is sufficient for function status regardless of history. The lack of history is epistemologically interesting but metaphysically irrelevant. |
  | **Crux 2: Malfunction Without Selection**<br>*(Can "malfunction" apply to something never selected for?)*<br><br>**Relevant Case:** The synthetic gene mutates again and stops breaking the toxin, reducing host survival. | **Prediction:** No malfunction is possible for Y. The gene merely ceases to have the side-effect. Normative failure requires a selected norm, which is absent here. | **Prediction:** Malfunction is possible. If the gene fails to break the toxin, it is malfunctioning relative to its current systemic contribution and the viability of the host. |
  | **Crux 3: Synthetic Origin and Metaphysics**<br>*(Does synthetic origin change the metaphysics or just the epistemology?)*<br><br>**Relevant Case:** Hypothetical discovery of the exact same toxin-breaking gene in wild populations with clear selection history for Y. | **Prediction:** Metaphysical change. The trait becomes a function only once the selection history is established. The wild discovery changes what the trait *is*, not just what we know about it. | **Prediction:** Epistemological change only. The trait was always a function due to its causal role. The wild discovery merely confirms the history was possible; it does not alter the function status established by current capacity. |
