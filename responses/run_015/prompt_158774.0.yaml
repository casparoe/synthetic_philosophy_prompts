prompt: |-
  Dear Professor,

  I am a seventeen-year-old student at a public high school whose students come roughly half from a farming community and half from a suburb of commuting professionals, and I am assembling the materials for our spring Economics and Society forum — a student-run session in which about sixty of my peers work through one contested question together. I have chosen inherited wealth. The part I am least confident about is the instrument I want to build, and I would be grateful for your help with it.

  What I want is a short sorting quiz: eight to ten items, each a concrete case with two or three answer options, whose scoring key sorts a student into a position on inheritance without ever asking which position they think they hold. My peers will not know the vocabulary, so the question stems should be plain, and every item should be a case where the positions genuinely come apart.

  The leaves I want represented are these: that bequest is a basic incident of ownership and taxing it is confiscation with no principled stopping point; that what matters is unchosen advantage at the recipient's end, so receipts rather than estates should be taxed; that steep death taxation is justified because it funds a one-time capital endowment paid to every citizen at twenty-five, so that the tax completes an equal starting stake rather than merely redistributing; that inheritance is legitimate in principle but large inequalities in life-chances are not, so tax progressively and spend on children's opportunity; that the objection is to a hereditary class with unaccountable power, so dynasties specifically are the target; that the question is only how large the total pie ends up, so incentives decide and the answer may be a low or zero rate; and that family partiality is a protected sphere of intimacy which heavy taxation intrudes upon. I also want at least one cell you think nobody occupies — for instance, unlimited tax-free giving during life combined with near-confiscation at death, or its mirror image — and one sentence on why it is empty.

  Three of the cases must be ones my peers will raise anyway. First, a farm or small business that can only stay in the family if the heir sells part of it to pay the tax. Second, a parent who spends a large sum on a child's schooling and internships while alive versus one who leaves the same sum at death: I want an item that separates objections to the size of a fortune from objections to transfer at death from objections to a dead hand directing resources. Third, an item exposing the timing loophole, since a view that taxes only what is left at death seems to reward early giving, and I want to know whether consistency forces such a view to become a lifetime-transfers view. I would also like one case in which the money goes to a stranger or a cause rather than to a child, and one comparing wealth earned by the person who dies with wealth that has already passed through two generations.

  Two further requests. Please flag any pair of leaves your quiz cannot separate — I suspect the unchosen-advantage view and the anti-dynasty view converge on the same rates for different reasons — and say what would have to be added to tell them apart. And please tell me which single question does the most sorting work and why, since I can only keep ten.

  I am not looking for citations or further reading, only for the instrument and the reasoning behind its construction.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Sender:** 17-year-old high school student (public school, mixed farming/suburban demographic).
      *   **Context:** Organizing a student-run Economics and Society forum (60 peers).
      *   **Topic:** Inherited Wealth.
      *   **Task:** Create a "sorting quiz" (8-10 items) to categorize students into philosophical positions on inheritance without using jargon.
      *   **Required Positions ("Leaves"):**
          1.  Property Rights/Confiscation (Bequest is basic ownership).
          2.  Recipient-Based/Unchosen Advantage (Tax receipts, not estates).
          3.  Stakeholder/Equal Starting Stake (Steep tax funds universal capital endowment at 25).
          4.  Progressive/Opportunity (Legitimate in principle, but tax large inequalities for children's opportunity).
          5.  Anti-Dynasty/Power (Target hereditary class/unaccountable power).
          6.  Efficiency/Incentives (Total pie matters, low/zero rate).
          7.  Family Intimacy/Partiality (Protected sphere, heavy tax intrudes).
          8.  *Empty Cell:* A logically possible but empirically empty position (needs identification and explanation).
      *   **Required Cases:**
          1.  Farm/Small Business liquidity crisis (sell part to pay tax).
          2.  Inter-vivos spending (schooling/internships) vs. Bequest (size vs. timing vs. dead hand).
          3.  Timing Loophole (early giving vs. death tax consistency).
          4.  Stranger/Cause vs. Child (bequest to non-family).
          5.  Old Money (2+ generations) vs. New Money (earned by decedent).
      *   **Analysis Requests:**
          1.  Flag indistinguishable positions (e.g., Unchosen Advantage vs. Anti-Dynasty) and how to separate them.
          2.  Identify the single most sorting question and explain why.
      *   **Constraints:** No citations/reading lists. Plain language (no jargon). Concrete cases.

  2.  **Deconstruct the Positions ("Leaves"):**

      *   *L1 (Property):* Absolute right to transfer. Tax = Theft.
      *   *L2 (Recipient):* Focus on the receiver's windfall. Tax the receipt, maybe progressive per recipient.
      *   *L3 (Stakeholder):* Radical redistribution. 100% (or near) tax to fund universal grant.
      *   *L4 (Progressive/Opportunity):* Moderate. Inheritance okay, huge inequality bad. Fund schools/opportunity.
      *   *L5 (Anti-Dynasty):* Focus on power structures. Limit accumulation across generations.
      *   *L6 (Efficiency):* Utilitarian. If tax kills investment, don't tax.
      *   *L7 (Intimacy):* Familial love expression. Tax interferes with family bonds.
      *   *L8 (Empty):* Need to construct a logically consistent but practically non-existent view. *Idea:* Taxing death heavily but allowing unlimited lifetime gifts creates a loophole. The mirror image (Taxing lifetime gifts heavily but allowing unlimited death bequests) is the "Empty Cell." Why? Because the motivation for transfer is usually avoiding death tax or controlling after death. Taxing life gifts but not death gifts makes no sense administratively or psychologically. *Better Empty Cell:* "Unlimited tax-free giving during life combined with near-confiscation at death." The prompt actually suggests this one. I need to explain *why* it's empty (arbitrage).

  3.  **Drafting the Quiz Items (Iterative Process):**

      *   *Constraint:* 8-10 items. Plain language. Concrete cases.
      *   *Goal:* Differentiate the 7 real positions + identify the empty one.

      *   *Item 1: The Farm (Liquidity).*
          *   Scenario: Family farm, worth \$5M, cash poor. Tax bill \$2M. Must sell land.
          *   Options: A) Unjust, breaks family continuity. B) Unfortunate but necessary for fairness. C) Design tax to exempt operating assets.
          *   *Differentiation:* L1/L7 vs L4/L5.

      *   *Item 2: Schooling vs. Bequest (Inter-vivos).*
          *   Scenario: Parent A pays \$500k for college/travel. Parent B leaves \$500k cash at death.
          *   Options: A) Both same, tax both. B) A is okay (parenting), B is windfall. C) B is okay (property rights), A is consumption.
          *   *Differentiation:* L2 (Receipt) vs L7 (Intimacy) vs L1 (Property).

      *   *Item 3: The Timing Loophole.*
          *   Scenario: If tax only hits death, people give money away at 60 instead of 80.
          *   Options: A) Close loophole, tax all large gifts. B) Let them give, at least money circulates. C) Don't tax either.
          *   *Differentiation:* L6 (Efficiency) vs L3/L4 (Equality).

      *   *Item 4: Stranger vs. Child.*
          *   Scenario: \$10M to daughter vs. \$10M to build a hospital.
          *   Options: A) Tax both same. B) Tax daughter higher. C) Tax hospital higher (state should do that).
          *   *Differentiation:* L5 (Dynasty) vs L1 (Property).

      *   *Item 5: Old Money vs. New Money.*
          *   Scenario: Self-made billionaire vs. Great-grandchild of billionaire.
          *   Options: A) Tax same. B) Tax great-grandchild higher. C) Tax neither.
          *   *Differentiation:* L5 (Dynasty) vs L1/L6.

      *   *Item 6: The Universal Grant (Stakeholder).*
          *   Scenario: Use all inheritance tax to give every 25-year-old \$100k.
          *   Options: A) Yes, fair start. B) No, government shouldn't manage that. C) Only if amount is small.
          *   *Differentiation:* L3 (Stakeholder) vs others.

      *   *Item 7: Incentives (Efficiency).*
          *   Scenario: High tax means entrepreneur works less.
          *   Options: A) Accept less work for more equality. B) Protect work incentive. C) Work isn't the main point.
          *   *Differentiation:* L6 (Efficiency).

      *   *Item 8: The Empty Cell (Lifetime vs. Death).*
          *   Scenario: Tax 90% at death, 0% during life.
          *   Options: A) Logical, death is the event. B) Illogical, invites avoidance.
          *   *Differentiation:* Identifies the empty cell.

      *   *Refining for "Sorting":* The options need to map clearly to the "Leaves." I need to make sure the scoring key (which I will describe conceptually) works.

  4.  **Addressing the Analysis Requests:**

      *   *Indistinguishable Leaves:* Unchosen Advantage (L2) and Anti-Dynasty (L5). Both support high taxes on large receipts.
          *   *Separation:* L2 cares about the *receiver's* moral luck. L5 cares about the *social structure/power*. To separate: Ask about a meritocratic aristocracy (smart heirs) vs. a dumb heir with power. Or ask about philanthropy (L5 might worry about power even there, L2 less so).
      *   *Most Sorting Question:* Likely the "Farm" question or the "Universal Grant" question. The Farm question hits the emotional core (L7/L1) vs. the abstract principle (L4/L5). The Universal Grant question isolates L3 specifically. I'll argue for the "Schooling vs. Bequest" question because it separates the *act* of parenting from the *transfer* of property, which cuts across almost all theories. Actually, the "Old Money vs. New Money" is the strongest discriminator for the specific "Dynasty" view which is distinct from general inequality. Let's go with the **Old Money vs. New Money** question. It isolates the "Anti-Dynasty" view from the general "Equality" view.

  5.  **Drafting the Response:**

      *   *Tone:* Respectful, encouraging, academic but accessible (matching the student's impressive voice).
      *   *Structure:*
          1.  Introduction (acknowledge sophistication).
          2.  The Quiz (10 Items).
          3.  Scoring/Logic Guide (How to map answers to Leaves).
          4.  The Empty Cell Explanation.
          5.  Indistinguishable Leaves Analysis.
          6.  The Single Best Question.

  6.  **Refining the Quiz Items (Self-Correction during drafting):**
      *   *Check:* Did I include the specific required cases?
          *   Farm/Business? Yes (Item 1).
          *   Schooling/Internships vs. Bequest? Yes (Item 2).
          *   Timing Loophole? Yes (Item 3).
          *   Stranger/Cause? Yes (Item 4).
          *   Old vs. New Money? Yes (Item 5).
      *   *Check:* Are the options neutral? Avoid leading language.
      *   *Check:* Is the Empty Cell included? I need to make sure the quiz *reveals* it, or I just describe it in the analysis. The prompt asks for "one cell you think nobody occupies... and one sentence on why it is empty." I will put this in the analysis section as requested, but maybe include a question that probes it. Actually, the prompt says "I would also like... one cell you think nobody occupies." It implies this is part of the design deliverable, not necessarily a quiz question itself, but the quiz should help identify why. I will address it in the "Construction Notes" section.
      *   *Check:* 8-10 items. I have 5 required cases. I need 3-5 more to cover the specific Leaves (Efficiency, Intimacy, Stakeholder, Property Rights).

      *   *Revised Item List:*
          1.  Farm (Liquidity/Continuity).
          2.  Schooling (Inter-vivos vs. Bequest).
          3.  Timing (Gift vs. Death).
          4.  Stranger (Philanthropy vs. Family).
          5.  Old Money (Dynasty).
          6.  The "Hard Work" Argument (Efficiency/Incentives).
          7.  The "Fair Start" Argument (Stakeholder/Grant).
          8.  The "Family Love" Argument (Intimacy).
          9.  The "Property Right" Argument (Absolute Ownership).
          10. The "Empty Cell" Probe (Lifetime exemption + Death confiscation).

      *   *Wait, one constraint:* "The leaves I want represented are these... I also want at least one cell you think nobody occupies."
      *   *Correction:* The quiz sorts students into the *Leaves*. The Empty Cell is a theoretical note I must provide. I don't need a quiz question that *creates* the empty cell, but I should explain it. However, to make the quiz robust, I should ensure the options cover the spectrum.
      *   *Refinement on "Most Sorting Question":* The prompt asks me to tell *them* which question does the most work.
      *   *Refinement on "Indistinguishable Leaves":* I need to be precise about L2 (Recipient) and L5 (Dynasty).

  7.  **Final Polish:**
      *   Ensure the tone is appropriate for a 17-year-old (intellectual peer, not condescending).
      *   Ensure the "Plain Language" constraint is met (no "inter-vivos," "utilitarian," "deontological").
      *   Check the "Empty Cell" requirement again: "and one sentence on why it is empty."
      *   Check the "Indistinguishable" requirement: "say what would have to be added to tell them apart."

      *(Self-Correction on Empty Cell)*: The prompt suggests: "unlimited tax-free giving during life combined with near-confiscation at death." I need to explain why *that specific one* is empty. (Because rational actors will always give during life, rendering the death tax revenue zero, making the policy self-defeating).

      *(Self-Correction on Indistinguishable)*: L2 (Unchosen Advantage) and L5 (Anti-Dynasty). Both tax large inheritances. To separate: Ask about a scenario where the heir is powerless but rich (L2 cares, L5 less so) OR powerful but not rich (L5 cares, L2 less so). Or, ask about *philanthropy*. L5 worries about unelected power (foundations), L2 worries about individual advantage.

      *(Self-Correction on Best Question)*: The "Schooling vs. Bequest" question is the deepest because it forces a choice between "Parenting is special" vs. "Money is money." It separates L7 (Intimacy) from L4 (Opportunity) and L2 (Receipt).

  8.  **Final Review against constraints:**
      *   8-10 items? Yes.
      *   Concrete cases? Yes.
      *   Plain language? Yes.
      *   Required 5 cases included? Yes.
      *   Empty cell identified + 1 sentence explanation? Yes.
      *   Indistinguishable leaves flagged + solution? Yes.
      *   Single best question identified + why? Yes.
      *   No citations? Yes.

      *Let's write it.*
answer: |-
  Dear Student,

  Your proposal is remarkably sophisticated. You have identified the central tension in the literature: that people often hold consistent moral intuitions that lead to contradictory policy conclusions depending on how the question is framed. To help you build this instrument, I have designed ten items. Each presents a concrete scenario with three response options. These options are not labeled "Right" or "Wrong"; rather, each option corresponds to one or two of the "leaves" (positions) you identified.

  Below is the quiz, followed by the scoring logic, the analysis of the "empty cell," the indistinguishable positions, and the single most effective sorting question.

  ### The Inheritance Sorting Quiz

  **1. The Family Farm**
  A family has owned a farm for three generations. It is worth \$5 million in land and equipment, but the family only has \$50,000 in cash. When the parents die, the government demands \$1.5 million in taxes. To pay it, the heir must sell off half the land, making the farm too small to survive.
  *   A. This is wrong; the tax should not force the breakup of a working family business.
  *   B. This is sad, but fair; wealth is wealth, regardless of whether it is land or cash.
  *   C. This is acceptable only if the money raised is used to help other children start their own farms.

  **2. The Head Start**
  Parent A spends \$400,000 sending their child to private schools, travel, and unpaid internships while the parent is alive. Parent B saves that \$400,000 and leaves it to the child in a will after death.
  *   A. These are the same thing; both give the child an unearned head start and should be treated alike.
  *   B. Parent A is just raising their child; Parent B is transferring property. Only B should be taxed.
  *   C. Parent A is consuming their own money; Parent B is transferring power. Only B creates a dynasty.

  **3. The Early Gift**
  Suppose the government only taxes money left after death, not money given away while alive. A wealthy person gives all their money to their children at age 60 to avoid the tax at age 80.
  *   A. This is a loophole; if we tax inheritance, we must tax large lifetime gifts too.
  *   B. Let them do it; money given early helps the children when they are younger and need it more.
  *   C. This proves we shouldn't tax transfers at all; it is the owner's money to move whenever they wish.

  **4. The Stranger's Cause**
  A billionaire leaves \$50 million to their spoiled adult daughter. Another billionaire leaves \$50 million to build a public hospital.
  *   A. Tax both at the same high rate; the source of the money is what matters.
  *   B. Tax the daughter heavily, but let the hospital gift pass tax-free; it helps society.
  *   C. Tax the hospital gift more; the government should decide how to build hospitals, not rich individuals.

  **5. Old Money vs. New Money**
  Person X earned \$100 million inventing a new technology. Person Y inherited \$100 million from a great-grandfather and did not work. Both die and leave the money to their children.
  *   A. Tax both the same; the child's unchosen advantage is identical in both cases.
  *   B. Tax Person Y's estate much higher; wealth that has sat idle for generations is more harmful.
  *   C. Tax neither; both have a right to decide where their property goes, regardless of how it was got.

  **6. The Universal Grant**
  Imagine we tax all inheritances at 90% but use every dollar to give a \$150,000 cash grant to every citizen on their 25th birthday.
  *   A. This is the ideal system; it turns inherited privilege into a fair starting stake for everyone.
  *   B. This is too much government control; families should keep most of what they save.
  *   C. This punishes success; if people can't leave wealth, they won't create it in the first place.

  **7. The Work Incentive**
  Economists argue that if you tax inheritance heavily, wealthy entrepreneurs will work less hard or hide their money, making the whole country poorer.
  *   A. We must accept a smaller economy if it means a fairer society.
  *   B. We cannot risk shrinking the economy; incentives to build wealth must be protected.
  *   C. The wealthy will work hard anyway; the excuse of "incentives" is just a way to protect privilege.

  **8. The Family Bond**
  Some argue that leaving money to children is a primary way parents express love and care for their children's future security.
  *   A. True; taxing this heavily interferes with the private sphere of family life.
  *   B. False; love is not measured in dollars, and the state has a duty to ensure equality.
  *   C. Partially true; parents should provide, but not to the extent that it ruins other children's chances.

  **9. The Power Broker**
  A child inherits enough wealth to buy influence over laws, hire private armies of lobbyists, and shape public policy without ever running for office.
  *   A. This is the main danger; inheritance taxes should specifically target this concentration of power.
  *   B. This is unlikely; money does not guarantee political control.
  *   C. This is their right; in a free society, people can spend their money to advocate for what they want.

  **10. The Lifetime Exemption**
  A policy is proposed: You can give away unlimited money while you are alive tax-free, but 100% of what you hold at the moment of death is confiscated by the state.
  *   A. This is consistent; death is the moment property changes hands, so that is when we tax.
  *   B. This is self-defeating; everyone will give everything away before death, raising zero money.
  *   C. This is cruel; it forces people to divest their assets while they are still vulnerable.

  ***

  ### Construction Notes and Analysis

  **1. The Empty Cell**
  The position represented in **Item 10, Option A** (Unlimited tax-free giving during life combined with near-confiscation at death) is the empty cell.
  *   **Why it is empty:** It is logically inconsistent with revenue generation because rational actors will always transfer wealth before death to avoid the penalty, rendering the tax base zero.

  **2. Indistinguishable Leaves**
  Your quiz will struggle to separate the **Unchosen Advantage** view (Leaf 2) from the **Anti-Dynasty** view (Leaf 5). Both will vote for high taxes in Item 1, Item 5, and Item 6. They converge on policy because they both object to the recipient's unearned status.
  *   **How to separate them:** You would need to add a question about *philanthropy* or *non-financial power*. The Anti-Dynasty view worries about unelected power even if no money changes hands (e.g., a famous name opening doors), whereas the Unchosen Advantage view focuses strictly on the financial windfall. If a student supports taxing a famous name's influence but not a quiet rich person's inheritance, they are Anti-Dynasty. If they support taxing the quiet rich person but not the famous name's influence, they are Unchosen Advantage.

  **3. The Single Most Sorting Question**
  **Item 2 (The Head Start)** does the most work.
  *   **Why:** It forces students to decide whether the moral problem is the *money* itself, the *timing* of the transfer, or the *family relationship*.
      *   Those who choose **A** align with **Unchosen Advantage** or **Stakeholder** views (money is money).
      *   Those who choose **B** align with **Family Intimacy** or **Property Rights** (parenting is distinct from bequest).
      *   Those who choose **C** align with **Anti-Dynasty** (power transfer is the specific harm).
      *   It separates the "Family Intimacy" leaf from the "Property Rights" leaf more effectively than the Farm question, which often triggers emotional sympathy that clouds the philosophical principle.

  ### Scoring Key Guide for the Forum
  To use this in your session, do not tally scores numerically. Instead, ask students to raise hands for Option A, B, or C on specific items.
  *   **High A count on Items 1, 2, 5:** Likely *Unchosen Advantage* or *Anti-Dynasty*.
  *   **High A count on Item 6:** Likely *Stakeholder/Equal Starting Stake*.
  *   **High B count on Items 1, 7, 8:** Likely *Family Intimacy* or *Efficiency/Incentives*.
  *   **High C count on Items 3, 5, 9:** Likely *Property Rights/Confiscation*.
  *   **High B count on Item 4:** Likely *Progressive/Opportunity* (distinguishes family need from public good).

  This instrument should allow your peers to find their philosophical neighbors without needing to know the names of the theories beforehand. Good luck with your forum.

  Sincerely,

  [Professor's Name]
