      *   *Section 2: The Dynamics of the Competitiveness Constraint.* Explain the race dynamic. Use the Prisoner's Dilemma analogy implicitly. Discuss the "first-mover disadvantage."
      *   *Section 3: Stability Analysis.* When does voluntary restraint hold? (Monopoly, Regulation, Niche Trust). When does it fail? (Commodity market).
      *   *Section 4: Deployment Models (Open vs. Closed).* This is crucial for an infra engineer. Open weights nullify safety fine-tunes. Closed APIs allow enforcement.
