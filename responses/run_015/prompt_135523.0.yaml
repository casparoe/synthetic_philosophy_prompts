      *   **Conclusion (5):** A rational agent should revise beliefs about her own past behavior to improve predictive coherence of her self-model (because incoherence makes her less predictable/reliable). (This is the suspicious step).
      *   **Conclusion (6):** In imperfect anonymity, one should cooperate due to small evidential risk of exposure. (Extension of the logic).
      *   **Conclusion (7):** Rationality collapses into continuous self-signaling and retroactive belief-management (memory falsification). (Reductio ad absurdum).
      *   **Conclusion (8):** This is absurd. Rationality shouldn't require falsifying memories.
      *   **Goal:** Keep the idea that commitments can be rational (CDT fails here), but avoid the "universal self-manipulation" cost.
