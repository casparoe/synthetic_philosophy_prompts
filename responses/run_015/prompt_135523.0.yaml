      *   **(4):** "Evidential correlations run in both directions..." Logically true. If $A$ evidences $B$, $B$ evidences $A$.
      *   **(5):** "Therefore a rational agent should revise beliefs about her own past behavior whenever doing so improves the predictive coherence of her self-model..." **This is the weak link.**
          *   *Why?* It conflates *acting* to signal a disposition with *believing* falsely about the past to signal a disposition.
