answer: |-
  The standard reading of Ursula Le Guin's "The Ones Who Walk Away from Omelas" treats it as a reductio ad absurdum of classical utilitarianism: a moral fable where the greatest good for the greatest number is revealed to be monstrous because it relies on the abjection of the few. However, this reading accepts the story's premise at face value—that there exists a scale upon which the city's jubilation and the child's misery can be placed and weighed. If we read the story through the specific philosophical problem of **Interpersonal Utility Comparison (IUC)**, the horror shifts. It is no longer just that the math is immoral; it is that the math is *impossible*.

  The problem of IUC, debated fiercely in welfare economics and moral philosophy since Lionel Robbins' 1932 essay, asks whether we can scientifically or logically compare the subjective mental states of different individuals. Can one person's unit of joy be subtracted by another person's unit of pain? Le Guin's story does not merely illustrate the ethical cost of this comparison; it dramatizes the violence required to pretend such a comparison is conceptually coherent. The citizens of Omelas do not perform a calculus; they submit to a metaphysical framework that enforces commensurability where none exists. Furthermore, the story reveals a psychological cost that formal utility theory ignores: the corruption of the beneficiary's wellbeing simply by virtue of their inclusion in the equation.

  ### The Smuggled Assumption of Commensurability

  The narrator of "Omelas" works tirelessly to establish the reality of the city's happiness. We are told the joy is "mature," "intelligent," and "victorious." This is not accidental description; it is a philosophical setup. For the bargain to hold, the happiness of the thousands must be of a quality that can logically offset the suffering of the one. The story smuggles in the assumption that joy and misery are cardinal quantities sharing a common denominator.

  In formal utilitarianism, this is the assumption of a "common currency" of utility. Le Guin exposes the fragility of this assumption by isolating the variables. The child is in a basement, in the dark, malnourished, and terrified. The citizens are in the streets, in the light, feasting, and music-filled. These are not just different quantities; they are different *ontological categories*. To say the city's happiness is "worth" the child's suffering requires a transcendent observer who can inhabit both consciousnesses simultaneously to verify the exchange rate.

  The citizens of Omelas never meet the child and perform a calculation. They are brought to see the child, they are told the terms, and they accept them. This suggests they are not engaging in moral reasoning but in **framework acceptance**. They are accepting a social contract that asserts commensurability as a brute fact. To stay in Omelas is to agree to treat the incommensurable as commensurable. It is to agree that a scream can be algebraically cancelled out by a symphony. The horror is not just the suffering, but the epistemic violence of forcing two distinct subjective realities into a single equation.

  ### The Breakdown of Calculus vs. The Rejection of Framework

  The prompt asks whether seeing the child breaks the comparability or just tips the balance. Le Guin's text suggests the former. When the adolescents (who are old enough to understand the bargain) see the child, they do not argue that the city's happiness is insufficient to justify the cost. They do not say, "If only the music were louder, this would be acceptable." They are "horrified." They feel "anger, outrage, impotence."

  In utility terms, their reaction indicates a **category collapse**. If IUC were coherent, the revelation of the child should simply lower the net utility score of the city. A rational actor might feel regret but remain if the net sum remained positive. Instead, the visitors experience a qualitative shift in the nature of their own existence. The sight of the child renders the city's joy *uncountable*. The joy does not decrease in magnitude; it loses its validity as a counter-weight.

  This is where the fiction pushes back on the philosophy. Philosophical utilitarianism often assumes that agents are neutral vessels for utility. Le Guin shows that agents are moral beings for whom the *source* of utility matters. The "happiness" of Omelas is not a standalone variable $H$; it is a dependent variable $H(c)$, where $c$ is the child's suffering. Once $c$ is known, $H$ cannot function as "happiness" in the way previously understood. The comparison doesn't fail because the numbers don't add up; it fails because the units are incompatible.

  ### The Corruption of the Stay-ers: A Utility Blind Spot

  Here lies the critical twist that formal literature on utility comparison usually ignores. Standard economic models treat preferences as exogenous or stable. If I gain utility from a good, that utility is generally treated as a positive value for me. Le Guin suggests that participating in a coercive aggregation of utility fundamentally corrupts the wellbeing of the aggregator.

  The citizens who stay do not return to their lives unchanged. The text says they know they are "not clean." They live with the knowledge that their joy is parasitic. In formal terms, their utility function has undergone a structural mutation. They are no longer experiencing $U_{joy}$. They are experiencing $U_{complicity}$.

  This is a profound critique of IUC. Even if we *could* compare utilities, the act of making that comparison and acting upon it alters the moral ontology of the beneficiaries. The "happiness" of Omelas is sustained only by a willful suppression of the incoherence of the bargain. To stay is to engage in a continuous psychological labor of repression. The citizen must constantly reaffirm the false equivalence between the flute music and the child's silence.

  Therefore, the citizens who stay suffer a diminution of their own wellbeing precisely because they know they are part of the comparison. They become trapped in a **bad faith equilibrium**. They cannot truly enjoy the festival because the festival is the mechanism of the torture. Their utility is no longer autonomous; it is tethered to the basement. This creates a feedback loop where the preservation of their happiness requires the continued negation of the child's humanity, which in turn further negates their own humanity. Formal utility theory cannot capture this because it has no variable for "moral integrity" or "ontological cleanliness." It assumes utility is fungible; Le Guin shows it is not.

  ### The Ones Who Walk Away: Exiting the Equation

  Finally, we must look at those who leave. The standard reading is that they are the moral heroes who reject the utilitarian calculus. But through the lens of IUC, they are something more radical: they are the ones who reject the **scale itself**.

  They do not go to a place where the math works out better. They do not go to a city where two children suffer for less happiness, or where no one suffers but the happiness is smaller. They walk into the darkness, toward a place that "does not exist." This is crucial. There is no alternative location within the framework of Omelas that solves the problem. To solve the problem, one must leave the framework of aggregatable utility entirely.

  The walkers recognize that the question "Is it worth it?" is itself the trap. By asking whether the child's suffering is "worth" the city's joy, one has already accepted that the child is a resource to be weighed. The walkers refuse the commensurability. They refuse to let their joy be defined by its capacity to offset misery. In walking away, they acknowledge that some values are **lexically ordered** or absolute, not tradeable. They restore the incommensurability of human experience.

  ### Where Philosophy and Fiction Collide

  Where does the philosophy expose what the story leaves unsaid? Philosophy clarifies that Omelas is not just a moral failure but an epistemic one. The "terrible justice" of Omelas relies on a magical realism of utility—that a social pact can literally bind metaphysical luck to moral outcome. Philosophy exposes that this binding is impossible in the real world; Omelas only works because Le Guin grants it the magical premise that the correlation is absolute. In reality, sacrificing the child might not produce the happiness at all, making the utilitarian calculus not just cruel, but irrational.

  Conversely, where does the fiction push back on the philosophy? Philosophy often treats IUC as a technical problem of measurement or a logical problem of language. Le Guin treats it as a **phenomenological crisis**. She shows that the attempt to enforce IUC requires a specific kind of human deformation. The "corruption" of the stay-ers is the fictional evidence that human beings are not designed to operate as utility aggregators. We cannot treat other subjective worlds as variables in our equation without damaging our own subjective world.

  ### Conclusion

  "The Ones Who Walk Away from Omelas" is not simply a story about the high cost of happiness. It is a story about the incoherence of the currency in which that cost is quoted. Le Guin dramatizes the moment when the assumption of interpersonal utility comparison shatters against the reality of individual suffering. The citizens who stay are not successful utilitarians; they are captives of a false framework, suffering a corruption of their own wellbeing that no calculus can quantify. The ones who walk away do not find a better answer to the equation; they dissolve the equation. In doing so, Le Guin suggests that the only coherent response to the problem of comparing human souls is to refuse the scale.
