      *   *Utilitarianism:* Classical utilitarianism (Bentham/Mill) assumes utility is cardinal and comparable across persons. You can sum $U_{person A} + U_{person B}$.
      *   *The Critique:* Lionel Robbins and modern welfare economics argue IUC is scientifically impossible. We can't measure your pain against my pleasure. It's a category error.
      *   *Le Guin's Story:* Omelas relies on a single child's abjection for the collective bliss.
      *   *The Prompt's Insight:* The story usually gets read as "Utilitarianism = Bad." But the prompt asks: Is the *math* even possible? If IUC is incoherent, the bargain is not just immoral, it's nonsensical.
      *   *The "Corruption" Angle:* If I stay, does my happiness change *quality*? Is it still "happiness" if it's bought? This touches on integrity, complicity, and the phenomenology of guilt. Formal utility functions usually treat preferences as static or exogenous. Le Guin suggests the *source* of utility alters the *nature* of the utility.

  3.  **Structuring the Argument:**
      *   **Introduction:** Set up the standard reading (utilitarian horror) vs. the proposed reading (incoherence of comparison). Introduce the concept of Interpersonal Utility Comparison (IUC).
      *   **Section 1: The Smuggled Assumption.** How Omelas presupposes a common currency of joy/misery. The narrator's language ("joy," "splendor") implies aggregability.
      *   **Section 2: The Breakdown of Calculus.** The moment of seeing the child. It's not a re-calculation; it's a category collapse. The child's suffering is incommensurable.
      *   **Section 3: The Corruption of the Stay-ers.** The "Twist." The utility of the citizens *changes* once they know. It's not $Happiness - Guilt$. It's a transformation of $Happiness$ into $Complicity$. Formal economics misses this endogenous preference shift.
      *   **Section 4: The Walkers.** They don't solve the math; they reject the equation. They walk away from the *framework*, not just the result.
      *   **Conclusion:** Synthesis. Philosophy exposes the impossibility of the bargain; Fiction exposes the psychological cost of pretending it's possible.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the standard utilitarian critique. Then pivot to Robbins/Harsanyi. The prompt wants "in the weeds." Use terms like *cardinality*, *commensurability*, *aggregation*.
      *   *The Smuggle:* Le Guin describes the happiness as "mature," "intelligent." She tries to make it weighable. But is the child's misery a negative integer on the same scale? The story treats the bargain as a *fact* of the universe, not a policy choice. This reifies the comparison.
      *   *The Moment of Knowledge:* When the adolescents see the child, they don't say "5000 units of joy vs 1000 units of pain." They are "horrified." Horror suggests a qualitative break, not a quantitative deficit. This is where fiction pushes back: phenomenology vs. arithmetic.
      *   *The Corruption (Crucial Step):* This needs careful handling. Standard utility theory says $U = f(x)$. If I know $x$ is tainted, maybe $U$ drops. But Le Guin suggests the *self* is tainted. The "happiness" becomes dependent on the suffering. It creates a parasitic relationship. The philosophy ignores the *moral ontology* of the agent. The citizen becomes a vampire. Their utility is no longer autonomous.
      *   *The Walkers:* They don't go to a better place. They go into the dark. This signifies leaving the *system of valuation* entirely.
      *   *Philosophy vs. Fiction:* Philosophy asks "Can we compare?" Fiction asks "What does comparing *do* to us?" Philosophy seeks coherence; Fiction reveals the violence required to enforce coherence.

