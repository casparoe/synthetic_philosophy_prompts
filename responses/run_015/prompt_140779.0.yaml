answer: |-
  # DECISION TREE: THE SPACE OF VIEWS ON EXPERIENCE
  **Instructions:** Start at Q1. Follow Yes/No/Other arrows. Record your Leaf Number. Check the Key below for the view name and its cost.

  ### THE LOGICAL FILTERS (Branch Questions)
  1.  **Verbal vs. Substantive:** Is the disagreement about how the world is, or just how we use words?
  2.  **Dream Case:** In a vivid dream of a red room (no eyes open), is there a real 'red quality' present in your mind?
  3.  **Physics Check:** Is this 'red quality' fully described by current physical science?
  4.  **Explainability:** Can we ever explain how brain states produce this quality?
  5.  **Error Location:** If the quality is not real, is the mistake in the visual processing or the self-report?
  6.  **Warmth Check:** Is the *impression* that you have a quality itself a felt state, or just a tendency to speak?
  7.  **Mid-Task Case:** If you say "I wasn't experiencing anything" until asked, was the experience absent or just unaccessed?
  8.  **Scope Check:** Does your story cover dreams and bodily feelings, or only task-focused seeing?
  9.  **Discourse Check:** If the qualities are false, should we stop using the words or keep them as tools?

  ---

  ### THE TREE DIAGRAM

  ```text
  [Q1: Facts or Words?] 
        |
        +--(Words)--------------------------------------------> LEAF 1
        |
        +--(Facts)--> [Q2: Dream Redness Real?]
                          |
                          +--(Yes)--> [Q3: Physical?]
                          |               |
                          |               +--(Yes)----------------------> LEAF 2
                          |               |
                          |               +--(No)--> [Q4: Explainable?]
                          |                               |
                          |                               +--(No)-------> LEAF 3
                          |                               |
                          |                               +--(Yes)------> LEAF 4
                          |
                          +--(No)--> [Q5: Error in Seeing or Reporting?]
                                          |
                                          +--(Seeing)--> [Q6: Impression Felt?]
                                          |                   |
                                          |                   +--(Yes)-------------> LEAF 5
                                          |                   |
                                          |                   +--(No)---------------> LEAF 6
                                          |
                                          +--(Reporting)--> [Q6: Impression Felt?]
                                                                  |
                                                                  +--(Yes)--> [Q8: Scope All or Task?]
                                                                  |               |
                                                                  |               +--(All)-----------> LEAF 7
                                                                  |               |
                                                                  |               +--(Task)----------> LEAF 8
                                                                  |
                                                                  +--(No)--> [Q7: Absent or Hidden?]
                                                                                  |
                                                                                  +--(Absent)--> [Q9: Keep Words?]
                                                                                  |                   |
                                                                                  |                   +--(Keep)--------> LEAF 9
                                                                                  |                   |
                                                                                  |                   +--(Ban)---------> LEAF 10
                                                                                  |
                                                                                  +--(Hidden)-------------------------> LEAF 11
  ```

  ---

  ### LEAF KEY (View & Awkward Commitment)

  | Leaf | View Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Quietist / Verbalist** | Claims centuries of debate are just confusion about definitions. |
  | **2** | **Russellian Monism** | Claims physics describes structure only, not the inner nature of matter. |
  | **3** | **Mysterian** | Admits the link between brain and experience is permanently unknowable. |
  | **4** | **Chalmers-Style Realism** | Accepts brute facts about experience that science cannot touch. |
  | **5** | **Paint-First Illusionism** | Claims the visual cortex actively generates false data about qualities. |
  | **6** | **Dennett-Style Disposition** | Denies there is any 'inner movie' even as a feeling; only speech habits exist. |
  | **7** | **Press-Release Illusionism** | Claims introspection is a faulty scanner of accurate data (Standard Frankish). |
  | **8** | **Attention-Schema Theory** | Struggles to explain why dreams feel vivid without attention tasks. |
  | **9** | **Fictionalism** | Asks us to knowingly assert falsehoods about experience for utility. |
  | **10** | **Hard Eliminativism** | Says common sense psychology is fundamentally false and should be dropped. |
  | **11** | **Higher-Order / Self-Rep** | Claims experience exists only when the brain scans itself (misses unconscious seeing). |
  | **12** | **UNOCCUPIED** | *(See Unoccupied Space Below)* |

  ---

  ### UNOCCUPIED LOGICAL SPACE (Why nobody is here)

  *   **Cell A (Seeming is Felt + No Properties):** *Path: Q2(No) → Q6(Yes).*
      *   **Diagnosis:** **Incoherent.** If the *impression* of a quality is itself a felt state, that feeling *is* a qualitative property. You cannot have a real feeling of a fake quality without the feeling itself being a real quality.
  *   **Cell B (Error in Seeing + Scope Task-Only):** *Path: Q5(Seeing) → Q8(Task).*
      *   **Diagnosis:** **Unattractive.** If the visual system paints false colors, it should do so in dreams too. Limiting the error only to action-guided cases requires an ad-hoc mechanism switch.
  *   **Cell C (Physics Yes + Explainability No):** *Path: Q3(Yes) → Q4(No).*
      *   **Diagnosis:** **Unexplored.** Claims the quality is physical but we can't explain how. Usually, if it's physical, proponents assume explainability; if not explainable, they assume it's not standard physics.

  ---

  ### COLLAPSED DISTINCTIONS (Pairs this tree cannot separate)

  1.  **Attention-Schema (Leaf 8) vs. Press-Release Illusionism (Leaf 7):**
      *   **Status:** **Collapsed.** Both claim the quality is false, the error is in reporting/modeling, and the impression is felt. To separate them, you need a question about *mechanism* (e.g., "Is the error due to a simplified control model?"), which is too technical for this node.
  2.  **Dennett-Style (Leaf 6) vs. Hard Eliminativism (Leaf 10):**
      *   **Status:** **Collapsed.** Both deny the felt state exists (Q6=No) and lean toward banning or radically revising the discourse. Dennett frames it as "no illusion," Eliminativism as "false theory," but the practical commitment is identical.
  3.  **Higher-Order (Leaf 11) vs. Dispositionalism (Leaf 6):**
      *   **Status:** **Fragile.** Both rely on the experience being absent until accessed/reported. Separation requires a question about whether the *potential* for experience counts as existence.

