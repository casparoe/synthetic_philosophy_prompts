      Move 8: Partly Right. (Fitting critique valid, ruin claim exaggerated).

      *Wait, Move 3:* Is it "Clearly Right"? It relies on the agent being naive. If the agent is sophisticated, the pump fails. Hanna presents it as "Suppose you hold A... she will give you one cent to swap... At that stage you take the gamble." She is *stipulating* the behavior at the second stage based on the static preference. This is a valid construction of the pump. I will rate it "Clearly Right" *conditional on the agent acting on local preferences*, which is the standard assumption she is invoking.

      *Wait, Move 5:* Is the fork exhaustive? Standard decision theory says Dynamic Consistency + Separability = EUT. If you keep Dynamic Consistency (no binding against preference), you must drop Allais preferences. If you keep Allais preferences, you must drop Dynamic Consistency (bind yourself). McClennen argues you can keep Allais + Dynamic Consistency by dropping Separability (Resolute Choice). So the fork is *not* exhaustive.

