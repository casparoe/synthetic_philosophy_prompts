  - definition (string, one sentence)
  - cases (array of 9 objects, same order as above), each with: case (short label), aliveness (0-100), rented (0-100), hinge (string — the single feature you'd have to strip out to drop aliveness the most, and roughly how far it drops), why (one clause, under 15 words)
