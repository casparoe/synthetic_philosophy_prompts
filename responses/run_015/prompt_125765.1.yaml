          A lawyer turns to the lead engineer and asks, "But the car has no mind to form intent. So when you say the corporation acted intentionally, are you admitting that moral blame creates a mind where there isn't one, or are you just saying the word 'intentionally' means 'deserves punishment' regardless of who's driving?"

