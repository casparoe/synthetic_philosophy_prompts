      *   **Twist:** Apply the asymmetry to a non-human agent (algorithm or corporation), not an individual person.
      *   **Punchline:** Ask whether the folk-psychological explanation (moral bias) or the linguistic explanation (normative weight of 'intentionally') survives when there's no individual mind.
