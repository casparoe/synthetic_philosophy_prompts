          When praised for Version B, the company shrugs, "We didn't intentionally find them love; that was just a bug."
          A confused philosopher watches the trial and asks the judge: "If there's no human mind inside the code to hold a grudge or a wish, but we still assign blame based on morality... did we just prove that 'intentionally' is merely a weapon for punishment, or are we accidentally worshipping the corporation as a person?"

