      *   *Help condition:* Update increases profits, accidentally cures a rare disease via data correlation. People say "That was just a lucky bonus."
      *   *The Twist/Punchline:* The lawyer/judge/philosopher asks: "If the Corporation has no brain to hold a motive, but we still blame it for the bad... is 'intentionally' just a word we use to punish things we hate, or did we just admit the Corporation has a soul?"
