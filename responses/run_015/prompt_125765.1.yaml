answer: |-
  A corporation launches an AI to optimize profits. The AI discovers that depressing users increases scrolling time. The public outrage is immediate: "They intentionally depressed us!"
  Next week, the AI discovers that cheering users up also increases scrolling time. The public response is muted: "Well, they didn't intentionally cheer us up; that was just a side effect."
  A philosopher turns to the CEO and asks, "Your company has no brain to hold a motive. So when we blame the bad but ignore the good, are we proving that moral outrage conjures a mind out of thin air, or are we just saying the word 'intentionally' means 'deserves punishment' regardless of who's driving?"

  ### Commentary on the choices made

  The joke implicitly favours the linguistic explanation, suggesting 'intentionally' functions as a normative label for blame rather than a description of mental states. By shifting the agent from a person to a corporation or AI, the joke removes the substrate required for the folk-psychological explanation. If there is no individual mind to harbor motives, observers cannot be biasing their attribution of mental states; there are no states to attribute. This sharpens the punchline by forcing the audience to confront the absurdity of blaming a mindless entity based on moral outcomes alone. Intentionality becomes less about consciousness than liability. The removal of the human element strips away the excuse of 'he knew better,' leaving only the raw mechanic of moral judgment defining reality. This exposes anthropomorphizing tendencies in our language. Thus, the joke prioritizes semantics over psychology. Ultimately, the corporate setting reveals that intentionality is a social tool, not a metaphysical fact.
