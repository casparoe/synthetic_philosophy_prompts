      *   Scenario A (Harm): CEO implements program to increase profits, knowing it will harm the environment. CEO doesn't care about harm. People say CEO *intentionally* harmed the environment.
      *   Scenario B (Help): CEO implements program to increase profits, knowing it will help the environment. CEO doesn't care about help. People say CEO did *not intentionally* help the environment.
      *   Core tension: Intentionality seems tied to moral bladeworthiness rather than just mental states (belief/desire).

