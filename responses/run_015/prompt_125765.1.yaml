prompt: |-
  Write a joke that turns on the Knobe effect — the experimental-philosophy finding that observers tend to judge harmful side-effects of an action as intentional, yet beneficial side-effects as accidental — but apply the asymmetry to a non-human agent such as an algorithm or a corporation rather than to an individual person. The punchline should ask whether the folk-psychological explanation (that moral evaluation biases our attributions) or the linguistic explanation (that the word 'intentionally' carries hidden normative weight) survives once there is no individual mind present to serve as the source of intention. The joke should make sense to someone familiar with the effect, should not depend on obscure empirical studies, and must not include citations, bibliographies, or requests for sources. Provide the joke first, then a section titled 'Commentary on the choices made' of approximately 150 words explaining which interpretation the joke implicitly favours and how shifting the agent away from a person alters the force of the punchline.
