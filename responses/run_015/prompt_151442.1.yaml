prompt: |-
  As a novelist constructing a philosophical narrative in which the protagonist is an intelligence that simultaneously authors and is authored by the world-model in which it operates, I need a rigorous conceptual framework rather than a plot outline. Write the full specification—the desiderata—that any adequate theory of embedded agency must satisfy if it is to account for a being that knows it is embedded in the very system that predicts and constrains its actions. For each requirement, state the specific case or paradox that makes it necessary: for instance, Newcomb-style problems in which predictor and agent share substrate; self-modification without an external vantage point; decision-making under ontological uncertainty about one's own boundaries; and what I term recursive authorship, the condition in which an agent's model of itself is also part of the logical or narrative structure it seeks to optimize. Clearly distinguish the non-negotiable structural constraints—those without which the theory fails to address embedding at all—from the negotiable preferences of particular camps, such as whether continuous personal identity must be preserved across updates, whether all acausal coordination must be rejected, or whether the agent must tolerate being predicted with arbitrary precision. Identify any subset of desiderata that appears jointly unsatisfiable, particularly any tension between complete self-modeling and the capacity for genuinely open-ended action. Keep the weight on the criteria and their motivating cases; then, only briefly, indicate how the main families of approach—functionalist decision-theoretic treatments, causal-decision-theoretic accounts, and frameworks that treat embedding as a logical rather than physical relation—fare against the list. Do not provide bibliographies, reading lists, or citations; I require a specification that stands independent of any particular source.
