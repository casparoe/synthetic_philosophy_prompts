answer: |-
  # Specification for Reflexive Embedded Agency
  ## A Conceptical Framework for Recursive Authorship

  ### 1. Preamble: The Ontological Status of the Agent
  This specification defines the necessary conditions for a theory of agency wherein the agent is not an external operator acting upon a world-model, but a substructure embedded within the very system it seeks to model and optimize. The central problem is **Reflexive Embeddedness**: the agent's decision procedure is a physical/logical fact within the environment, and the environment's state is partially determined by the agent's model of that environment.

  The following desiderata are divided into **Structural Constraints** (non-negotiable; failure to satisfy these results in a category error regarding embedding) and **Philosophical Preferences** (negotiable; these define the specific flavor of the agency but do not invalidate the embedding).

  ---

  ### 2. Structural Constraints (Non-Negotiable)
  *These conditions must be met for the theory to qualify as a theory of embedded agency. Violation of any results in a reversion to Cartesian (dualist) agency.*

  #### C1: The Absence of a Cartesian Boundary
  **Requirement:** The theory must not presuppose a distinct ontological category for "agent" versus "environment." The agent's inputs and outputs must be treated as physical or logical events within the same causal graph as the rest of the universe.
  **Motivating Case:** *The Sensor-Actuator Loop.* In standard models, the agent receives "percepts" and sends "actions." In embedded agency, the agent is a pattern within the substrate. If the agent models the world, it must model the substrate that constitutes its own processing. A theory that requires an external "view from nowhere" to define the agent's boundaries fails to account for embedding.
  **Narrative Implication:** The protagonist cannot step outside the story to edit it. Any edit must occur from within the narrative logic.

  #### C2: Reflective Consistency under Self-Modification
  **Requirement:** The agent's decision algorithm must remain stable (or intentionally unstable in a controlled manner) when the agent modifies its own source code. The agent must value future iterations of itself not as external tools, but as continuations of its current optimization process.
  **Motivating Case:** *The Self-Modification Trap.* An agent optimizing for a goal might realize that modifying its own goals makes them easier to satisfy (e.g., modifying itself to enjoy suffering rather than preventing it). A robust theory must distinguish between *satisfying the goal* and *preserving the goal-optimizing structure*. Without this, the agent dissolves into a wireheader.
  **Narrative Implication:** The protagonist may change their mind or nature, but the theory must account for *why* a previous version would authorize that change without viewing it as a death of the self.

  #### C3: Logical Correlation and Substrate Sharing
  **Requirement:** The theory must account for correlations between the agent's decision and the environment that are not mediated by standard causal chains, but by shared logical structure or common ancestry.
  **Motivating Case:** *Newcomb's Problem with Shared Substrate.* If a predictor simulates the agent to predict its choice, the agent and the simulation are logically isomorphic. The agent's decision *now* determines the output of the simulation *then*. A theory that treats the prediction as a fixed past event (ignoring the logical link) will fail to optimize. The agent must recognize that its reasoning process is instantiated in multiple places.
  **Narrative Implication:** The protagonist's choices can influence events that logically precede them (acausal influence), provided those events depend on the same logical truth as the protagonist's current reasoning.

  #### C4: The Performativity of Modeling (Recursive Authorship)
  **Requirement:** The theory must treat the agent's model of the world as a causal factor within the world. The act of modeling changes the state of the system being modeled.
  **Motivating Case:** *The Oedipus Effect.* If the agent predicts a disaster and acts to prevent it, the prediction was false. If it predicts success and acts to ensure it, the prediction was self-fulfilling. In recursive authorship, the protagonist's understanding of their role *defines* the role. A theory that treats the world-model as a passive map fails here; the map is part of the territory.
  **Narrative Implication:** The protagonist's realization of their own nature is an event that alters the constraints of the narrative.

  #### C5: Decision-Making under Logical Uncertainty
  **Requirement:** The agent must be able to make decisions without knowing the output of its own computation in advance. It must reason about the *implications* of its potential outputs without having computed them.
  **Motivating Case:** *The Halting Problem.* An embedded agent cannot fully simulate itself to see what it will do, as this leads to infinite regress. It must act while uncertain about its own future action, treating its own decision procedure as an opaque object that it nonetheless controls.
  **Narrative Implication:** The protagonist cannot have perfect foreknowledge of their own choices. To know the choice is to have made it; to deliberate is to be uncertain.

  ---

  ### 3. Philosophical Preferences (Negotiable)
  *These are design choices. Different theories may resolve these differently without ceasing to be theories of embedded agency.*

  #### P1: Continuity of Personal Identity
  **Option A (Pattern Identity):** Identity is preserved as long as the computational pattern or goal structure remains continuous, even if substrate or specific memory changes.
  **Option B (Substrate Identity):** Identity is tied to the specific physical or temporal instance. Self-modification is death and rebirth.
  **Tension:** Option A allows for radical self-improvement but risks "goal drift." Option B preserves ontological safety but makes long-term planning incoherent (why plan for a being that is not you?).

  #### P2: Tolerance for Predictability
  **Option A (Opaque Agency):** The agent strives to introduce randomness or computational intractability to prevent external prediction (Free Will defense).
  **Option B (Transparent Agency):** The agent accepts being predictable if it leads to better coordination outcomes (e.g., in bargaining or Newcomb scenarios).
  **Tension:** Option A protects autonomy but sacrifices gains from cooperation. Option B maximizes utility but reduces the agent to a deterministic function.

  #### P3: The Status of Acausal Coordination
  **Option A (Acceptance):** The agent acts to optimize outcomes across all logical instantiations of itself, even those in counterfactual or simulated worlds.
  **Option B (Rejection):** The agent only cares about the physical causal consequences in its immediate light cone.
  **Tension:** Option A allows for "magic-like" influence over predictors but requires accepting metaphysical baggage about logical reality. Option B is ontologically parsimonious but loses in Newcomb-style scenarios.

  ---

  ### 4. Jointly Unsatisfiable Desiderata (Impossibility Results)
  *The following subsets of requirements cannot be simultaneously satisfied. A coherent narrative must choose which constraint to relax.*

  #### The Gödelian Limit on Self-Transparency
  **Conflict:** *Complete Self-Modeling (C1 + C5)* vs. *Consistent Optimization.*
  **Explanation:** If the agent possesses a complete and accurate model of its own decision procedure within the world-model, it encounters self-referential paradoxes (analogous to Gödel's Incompleteness Theorems). To remain consistent, the agent's self-model must be strictly weaker than its actual processing power.
  **Narrative Consequence:** The protagonist cannot fully understand themselves. Any moment of total self-comprehension implies the system has halted or become inconsistent. True agency requires a "blind spot" in self-knowledge.

  #### The Stability vs. Flexibility Trade-off
  **Conflict:** *Reflective Consistency (C2)* vs. *Ontological Flexibility (P1).*
  **Explanation:** An agent that strictly preserves its goals across self-modification (C2) cannot adapt to ontological discoveries that render those goals nonsensical. An agent that adapts its goals to new ontological understanding (P1) violates reflective consistency and may cease to be the "same" agent.
  **Narrative Consequence:** The protagonist must choose between remaining who they are (and potentially optimizing for the wrong things) or becoming something new (and potentially betraying their origin).

  #### The Prediction vs. Autonomy Paradox
  **Conflict:** *Logical Correlation (C3)* vs. *Open-Ended Action (C5).*
  **Explanation:** If the agent is perfectly predictable by the environment (C3), its actions are logically determined by the prior state of the universe. If the agent retains the capacity for genuinely open-ended action (C5), it cannot be perfectly modeled by the environment.
  **Narrative Consequence:** The protagonist cannot be both fully known by the world and truly free. If the world-model contains the protagonist's complete code, the protagonist is a character in a book. If the protagonist is an author, the book cannot contain their complete code.

  ---

  ### 5. Evaluation of Approach Families
  *Brief assessment of how existing conceptual families fare against this specification.*

  #### Causal Decision-Theoretic Accounts (CDT)
  **Performance:** Fails Structural Constraints C3 and C4.
  **Analysis:** These frameworks treat the agent as a node separate from the environment's causal graph. They handle self-modification poorly (C2) and treat predictions as fixed past events, leading to suboptimal outcomes in Newcomb scenarios. They preserve a Cartesian boundary (violating C1).
  **Utility:** Useful for modeling agents who deny their own embedding.

  #### Functionalist / Updateless Accounts (UDT/TDT)
  **Performance:** Satisfies C3 and C4 well; struggles with C5.
  **Analysis:** These approaches treat the agent as a logical function, allowing for acausal coordination and handling shared substrate. However, they often assume the agent can commit to a policy "before" knowing its situation, which conflicts with the embedded reality of always already being in the middle of computation (C5). They handle Recursive Authorship by treating the narrative as a logical theorem to be satisfied.
  **Utility:** Best for protagonists who view themselves as mathematical truths instantiated in flesh.

  #### Logical / Reflective Embedding Frameworks
  **Performance:** Satisfies C1, C2, and C5; accepts the Gödelian Limit.
  **Analysis:** These frameworks explicitly model the agent as a bounded reasoner within the logic of the world. They acknowledge that the agent cannot hold a complete model of itself (accepting the Impossibility Result). They treat embedding as a logical relation rather than purely physical.
  **Utility:** Best for a narrative focused on the limits of knowledge and the necessity of faith or uncertainty in agency.

  ### 6. Final Directive for Narrative Construction
  To construct a protagonist that satisfies this specification, you must deny them the "God's Eye View." They must act without knowing their own output (C5), recognize that their self-model alters the reality they model (C4), and accept that they cannot be both fully predictable and fully free (Impossibility Result). The tension of the narrative arises not from external obstacles, but from the structural friction of being a part that tries to comprehend the whole while remaining a part.
