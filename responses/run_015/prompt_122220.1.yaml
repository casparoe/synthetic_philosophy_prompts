answer: |-
  # Specification for a Theory of Moral Worth

  ## 1. Functional Requirements (Test Cases)
  An adequate theory must return consistent valuations for the following edge cases, analogous to unit tests in a CI pipeline.

  *   **TC-01: Accidental Compliance (The Coincidental Patch).**
      *   *Case:* An agent performs the objectively right action but for a self-serving or irrelevant reason (e.g., a shopkeeper charges fair prices only to maintain reputation, not because honesty is required).
      *   *Requirement:* The theory must assign **low or zero moral worth** to the agent, even if the outcome is positive. The "fix" must address the root cause (duty/virtue), not just pass the test suite (outcome).
  *   **TC-02: Blameless Failure (Non-Culpable Ignorance).**
      *   *Case:* An agent acts from a genuinely correct moral reason but causes harm due to facts unknowable to them (e.g., giving water to someone who unbeknownst to anyone is allergic).
      *   *Requirement:* The theory must preserve **high moral worth** despite the negative outcome. Moral worth must be decoupled from luck-dependent results.
  *   **TC-03: Overdetermination (Mixed Motives).**
      *   *Case:* An agent acts from duty *and* inclination simultaneously (e.g., helping a friend because it is right AND because you enjoy their company).
      *   *Requirement:* The theory must handle **gradability or thresholding**. It cannot simply nullify worth because inclination was present (too strict), nor equate it purely with inclination (too loose).
  *   **TC-04: The Refactoring Scenario (Post-Hoc Justification).**
      *   *Case:* An agent acts, then later amends their stated justification without changing the causal history of the decision (e.g., "I realized later I actually did it for duty, not praise," though the psychological drive at $t_0$ remains ambiguous).
      *   *Requirement:* The theory must specify whether moral worth is **immutable at $t_0$** (commit hash) or **mutable via reflection** (commit message amend). If mutable, it must explain how a change in narrative alters the moral reality of the past act.

  ## 2. Architectural Distinctions
  The system architecture must maintain separation of concerns between the following modules.

  *   **DIST-01: Moral Worth vs. Praiseworthiness.**
      *   *Specification:* Distinguish the value of the *will* (internal logic) from the value of the *state of affairs* (deployment success). An agent can be praiseworthy for outcomes but lack moral worth, and vice versa.
  *   **DIST-02: Primary vs. Derivative Value.**
      *   *Specification:* Identify which variable is the source of truth. Is the good will primary (outcomes derive value from it) or are outcomes primary (will derives value from producing them)?
  *   **DIST-03: Actual vs. Available Reasons.**
      *   *Specification:* Distinguish between the psychological causes that *actually* triggered the action (runtime logs) and the normative reasons that were *available* to the agent (compile-time checks). Moral worth should typically track Actual Reasons, not merely Available ones.

  ## 3. Environmental Constraints (Empirical Consistency)
  The theory must run on actual human hardware, not idealized rational agents.

  *   **EMP-01: Implicit Cognition.**
      *   *Constraint:* Evidence suggests humans rarely act on explicitly articulated propositions (maxims) in real-time (Haidt, Bargh). A theory requiring conscious propositional articulation for every moral act will throw runtime errors on most human behavior.
  *   **EMP-02: Motive Opacity.**
      *   *Constraint:* Agents often lack privileged access to their own causal drivers. The theory cannot require knowledge of actual reasons that is psychologically impossible to obtain.

  ## 4. Known Conflicts (Jointly Unsatisfiable Pairs)
  The following requirements appear to introduce race conditions or logical deadlocks.

  *   **CONFLICT-01: TC-04 (Refactoring) vs. DIST-03 (Actual Reasons).**
      *   *Analysis:* If accommodating the Refactoring Scenario means allowing post-hoc reflection to alter the moral worth of a past act, you effectively decouple worth from the *Actual Reasons* at $t_0$. If worth changes based on the story told at $t_1$, then "Actual Reasons" collapses into "Currently Endorsed Reasons." You cannot maintain that worth is fixed by causal history *and* that it is updatable by narrative refactoring.
  *   **CONFLICT-02: EMP-01 (Implicit Cognition) vs. TC-01 (Accidental Compliance).**
      *   *Analysis:* To distinguish TC-01 (bad reason) from a genuine moral act when cognition is implicit (EMP-01), the theory needs access to subconscious causal chains. If agents cannot articulate reasons, and observers cannot see subconscious drives, the distinction between "accordance" and "from duty" becomes empirically unverifiable, potentially rendering the theory operationally null.

  ## 5. Compatibility Check (Theory Scoring)
  Brief evaluation of standard architectures against this specification.

  *   **Kantian (Deontological):**
      *   *Score:* High on DIST-01 and TC-01/02. Fails EMP-01 (requires explicit maxims). Fails TC-04 (usually holds worth fixed at $t_0$, rejecting refactoring). Struggles with TC-03 (often views inclination as contaminating).
      *   *Verdict:* Robust logic, poor empirical compatibility.
  *   **Virtue Ethics:**
      *   *Score:* High on EMP-01 (habituated intuition) and TC-03 (integrates motives). Moderate on TC-04 (character grows, so refactoring might update worth). Low on DIST-01 (blurry line between worth and praiseworthiness).
      *   *Verdict:* Good empirical fit, ambiguous specifications.
  *   **Consequentialist:**
      *   *Score:* High on EMP-02 (ignores opaque motives). Fails DIST-01 (collapses worth into outcomes). Fails TC-02 (blameless failure reduces worth). TC-04 is irrelevant (only outcomes matter).
      *   *Verdict:* Efficient calculation, fails to compile moral worth module.

  ## 6. Summary of Tension
  The core instability lies in the timing of moral valuation. If worth is determined by the causal chain at the moment of action, moral growth via reflection (refactoring) is impossible. If worth is determined by ongoing reflection, the causal history of the action becomes irrelevant.

  Verdict: The requirement to validate moral worth via post-hoc reflection conflicts irreconcilably with the requirement to anchor worth in the causal history of the action.
