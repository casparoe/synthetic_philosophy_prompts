answer: |-
  This is a fantastic angle for a film club discussion. You are not forcing the distinction; you are actually hitting on a live debate in social ontology and economic sociology that often gets glossed over in introductory theory.

  Here is a breakdown of your concepts, how they hold up against the film, and specific moments to anchor your discussion.

  ### 1. The "Run-able Kind" Distinction
  Your intuition here is philosophically sound. In social ontology (think John Searle or Margaret Gilbert), there is often a tendency to treat all institutional facts as if they have the same "stickiness." Your distinction separates **reflexive kinds** from **embedded kinds**.

  *   **Money/Banks (Run-able):** These rely on *common knowledge*. I accept the dollar because I know you accept the dollar. If I suspect you won't accept it tomorrow, my reason for accepting it today evaporates. This creates a precarious equilibrium. It is "run-able" because the acceptance is simultaneous and contingent on the *present* confidence of the group.
  *   **Race/Gender (Diffuse/Embedded):** While these are socially constructed, they are "baked in" to law, biology (in the case of sex/gender interplay), geography, and habit. You cannot "run" on gender in a lobby. The uptake is diffuse because it is enforced by structures outside the immediate room (policing, medical institutions, family history).

  **Where money sits:** Money is the purest example of a run-able kind. It is a coordination game. *It's a Wonderful Life* shows that the "Bank" is not a building or a vault; it is a temporary agreement among the people of Bedford Falls to treat pieces of paper as claims on future labor. When that agreement wobbles, the kind dissolves instantly.

  **Discussion Point:** Ask the group: *Why doesn't the crowd try to "run" on George's masculinity or Mary's social status in that scene?* It highlights that some social kinds are armored by history and violence, while others are armored only by trust.

  ### 2. Acceptance Infrastructure vs. Status Functions
  You are right to worry about flattening this into a cartoon of Searle's "X counts as Y in context C." That formula often ignores the *labor* required to keep the "counting" going.

  Your concept of **"Acceptance Infrastructure"** is the antidote. The film shows that belief isn't enough; you need *props*.
  *   **The Vault:** George has to open the safe. He has to show the physical tokens.
  *   **The Ledger:** He has to reference specific names and specific accounts.
  *   **The Performance:** He has to act calm. If he sweats, the infrastructure fails.

  The movie argues that social kinds aren't just mental states; they are **material performances**. The "Bank" exists only as long as George can successfully perform the ritual of solvency.

  ### 3. Is George's Speech a Credit Theory Argument?
  **Yes, absolutely.**
  The Commodity Theory of Money says money has value because it is backed by gold (or the state). The Credit Theory of Money (associated with A. Mitchell Innes or David Graeber) says money is a *social relation*—a record of debt and obligation between people.

  When George says:
  > *"This bank does not belong to the stockholders, it belongs to the depositors! ... You're thinking of this place all wrong. As if I had the money in the safe. But the money's not here. Your money's in Joe's house... and a hundred others."*

  He is articulating the Credit Theory. He is saying the *value* is not the paper (the commodity); the value is the **community's future activity** (the houses being built, the weddings being held). The bank is just the ledger that tracks those mutual obligations. He is asking them to convert their demand for *liquidity* (cash now) into an acceptance of *credit* (trust that the community will produce value later).

  ### 4. What the Movie Shows That Theory Misses
  Standard social theory often treats these constructions as impersonal systems. *It's a Wonderful Life* argues that **particularity saves the universal.**

  *   **Theory:** "Money functions via general trust."
  *   **Film:** "Money functions because George Bailey knows Mrs. Johnson wants to go to Italy."

  The movie suggests that abstract institutions (The Bank) are too fragile to survive on abstract rules alone. They require a **caretaker** who knows the specific, messy details of the participants' lives. The "Acceptance Infrastructure" isn't just the ledgers; it's George's memory of who needs what. The social kind holds together not because of the *rules*, but because of the *relationships*.

  Theory often misses the **affective glue**. The run is stopped by fear, but it is reversed by *shame* and *solidarity*. When George hands over the cash, he makes the takers feel like predators. That emotional pivot is something dry ontology misses.

  ### 5. Three Moments to Highlight
  For your discussion, cue these specific beats. They map perfectly onto your philosophical points.

  **Moment 1: The Surge (The Run-able Kind)**
  *   **Timestamp:** Roughly 48:00 (depending on cut). The crowd pushes against the railing after hearing about the run on the other bank.
  *   **What to ask:** Look at the physicality of the crowd. Why does the "Bank" as a concept dissolve the second the line forms? This illustrates the fragility of reflexive kinds. The institution didn't change; the *common knowledge* changed.

  **Moment 2: Opening the Vault (Acceptance Infrastructure)**
  *   **Timestamp:** Roughly 51:00. George unlocks the safe and stacks the cash on the counter.
  *   **What to ask:** George doesn't just talk; he produces the *tokens*. Why is the physical cash necessary if everyone knows the bank is (technically) solvent? This supports your "infrastructure" idea. The abstract promise needs a material prop to restart the belief loop.

  **Moment 3: The Pledge (Credit Theory)**
  *   **Timestamp:** Roughly 54:00. George hands cash to a depositor, then asks for it back as a loan to cover someone else. "You want your money? Here it is. But if you want to help the Building & Loan..."
  *   **What to ask:** Watch the transaction. George turns a *withdrawal* into an *investment* without changing the amount of money. He changes the *social relation*. This is the Credit Theory in action: money is a promise between neighbors, not gold in a box.

  ### Summary for the Group
  You can frame the discussion like this:
  *"We often think of money as a thing, or a bank as a building. Capra shows us they are actually a fragile agreement. But he also shows us that agreements don't hold themselves up. They need infrastructure (cash, ledgers) and they need caretakers (George) who know us by name. The run happens when we forget we are a community and remember we are individuals. The rescue happens when we remember the community is the only thing backing the cash."*

  This approach respects the philosophy without turning the movie into a lecture. It honors your "run-able kind" insight while grounding it in the emotional reality of the film.
