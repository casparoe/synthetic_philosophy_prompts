answer: |-
  ### 1. Rules, Materials, and Script

  **Materials Needed:**
  *   **Cards:** 15 Index cards marked **H** (High), 15 marked **L** (Low). For the final round, add 5 marked **M** (Middle).
  *   **Currency:** 200 Poker Chips (or distinct counters).
  *   **Record Sheets:** 15 slips of paper per round, pre-printed with "ID Number: ___", "Type: ___", "Signal Cost: ___", "Decision: ___", "Payoff: ___".
  *   **Collection Box:** A hat or box to shuffle sheets.
  *   **Board:** To display the Signal Cost ($K$) and Subsidy ($S$).

  **Anonymity Protocol (Critical):**
  To prevent reputation from replacing the signal cost, you must enforce strict anonymity.
  1.  **Random IDs:** At the start of *every* round, assign every student a random 3-digit ID number (write it on their sheet). Do not reuse IDs across rounds.
  2.  **Blind Exchange:** Senders write their decision on the sheet. Collect all sheets in the box. Shuffle thoroughly. Redistribute randomly to Receivers.
  3.  **No Talking:** No discussion of types or decisions between rounds.

  **The Script (Read this verbatim. Do not improvise theory.)**

  > "Welcome. Today we are running a market simulation. You will be assigned a role: Sender or Receiver. You will keep this role for one round, then we switch.
  >
  > **For Senders:** You will draw a card. It says either **H** or **L**. This is your private 'Type'. No one else sees it. You want to be 'Accepted'. If you are Accepted, you win chips. If you are Rejected, you win nothing.
  > You have a choice: You may buy a 'Signal Badge' for a cost shown on the board. This cost is deducted from your winnings whether you are Accepted or not. You may also write a free message on your sheet.
  >
  > **For Receivers:** You will receive a sheet from a Sender. You will see their Message and whether they bought the Badge. You will *not* see their Type. You must choose 'Accept' or 'Reject'.
  > If you Accept an **H**, you gain chips. If you Accept an **L**, you lose chips. If you Reject, your payoff is zero.
  >
  > **Goal:** Maximize your personal chip total. The top three players at the end get a prize.
  >
  > We will play five rounds. The cost of the Badge will change. Begin Round 1."

  ---

  ### 2. Round Sequence and Arithmetic

  **Payoff Structure (Fixed for all rounds):**
  *   **Sender (High):** +30 chips if Accepted.
  *   **Sender (Low):** +15 chips if Accepted.
  *   **Sender (Any):** 0 chips if Rejected.
  *   **Receiver:** +20 chips if Accept High. -30 chips if Accept Low. 0 if Reject.
  *   **Signal Cost ($K$):** Deducted from Sender *before* Accept/Reject decision.

  **The Separating Band (The Logic):**
  For a Separating Equilibrium (High Signals, Low Does Not):
  1.  **High Type Incentive:** Benefit of Acceptance > Cost.
      $$30 - K > 0 \Rightarrow K < 30$$
  2.  **Low Type Incentive:** Benefit of Acceptance < Cost.
      $$15 - K < 0 \Rightarrow K > 15$$
  *   **Separating Band:** **$15 < K < 30$**.

  **Round 1: The Pooling Trap (Cost = 10)**
  *   **Setup:** $K = 10$.
  *   **Math:** $10 < 15$. The cost is too low.
  *   **Prediction:** Both H and L signal (Net gain for L is $15 - 10 = 5$).
  *   **Receiver Logic:** If everyone signals, the badge means nothing. Probability of H is 50%.
      *   Expected Value = $0.5(20) + 0.5(-30) = -5$.
      *   Rational Receivers **Reject Everyone**.
  *   **Outcome:** Welfare is negative (Senders burn chips for no reason).
  *   **Lesson:** Cheap talk/signals destroy trust.

  **Round 2: Separation (Cost = 20)**
  *   **Setup:** $K = 20$. (Inside the band).
  *   **Math:**
      *   High: $30 - 20 = 10$ (Positive $\rightarrow$ Signal).
      *   Low: $15 - 20 = -5$ (Negative $\rightarrow$ Don't Signal).
  *   **Receiver Logic:** Badge = High. No Badge = Low.
      *   Accept Badge ($+20$). Reject No Badge ($0$).
  *   **Outcome:** High types signal and get accepted. Low types stay silent and get rejected.
  *   **Lesson:** Costly signals create trust.

  **Round 3: The Subsidy (Cost = 20, Refund = 10)**
  *   **Setup:** Base $K = 20$. **Subsidy $S = 10$**. Effective Cost $K' = 10$.
  *   **Instruction:** "The government refunds 10 chips to anyone who buys a Badge."
  *   **Math:** Effective cost is 10.
      *   Low Type: $15 - 10 = 5$ (Positive $\rightarrow$ Signal).
  *   **Outcome:** Low types now fake the signal. We return to Round 1 dynamics (Pooling). Receivers should stop accepting.
  *   **Lesson (a):** The *absolute* cost dropped, but the *gap* between High and Low value remained the same. Because the cost fell below the Low Type's benefit, the signal became useless. Welfare collapses.

  **Round 4: Three Types (Counter-Signalling Setup)**
  *   **Setup:** Types: **L, M, H**. (Deal 5 of each).
  *   **Cost:** $K = 20$.
  *   **New Info:** Before the round, tell Receivers: *"All Senders in this round have passed a Basic Qualification. None of them are Type L."*
  *   **Payoffs:**
      *   Receiver Accept M: +5 chips. (M is okay, but risky).
      *   Receiver Accept H: +20 chips.
      *   Sender M Benefit: 20 chips.
      *   Sender H Benefit: 30 chips.
  *   **The Equilibrium Check:**
      *   **High Type:** If they don't signal, Receivers know they aren't L. If Receivers believe "No Signal = H", H gets 30 (no cost). If H signals, H gets $30 - 20 = 10$. **H prefers No Signal.**
      *   **Middle Type:** If they don't signal, and Receivers believe "No Signal = H", M gets 20. If M signals, M gets $20 - 20 = 0$. **M prefers No Signal.**
      *   **CRITICAL FAILURE POINT:** In a one-shot game with *common knowledge* that L is gone, M has no incentive to signal. Both M and H will pool on "No Signal".
      *   **The Fix:** You must rely on the *history* of Rounds 1-3. Tell Receivers: *"In previous rounds, Low types existed. In this round, they don't. But you don't know who knows that."*
      *   **Better Fix (Recommended):** Do not announce L is impossible. Announce: *"Senders have a Score. L usually scores 0. M and H usually score 10."* Show Receivers a sheet saying "Score: 10".
      *   **Condition for (c):** M signals to prove they aren't an L who got lucky. H doesn't signal because their "Score 10" is credible enough.
      *   **Verdict:** I must be honest in Section 5. This round is fragile. I will instruct you to run it, but warn that it relies on social norms, not just math.

  ---

  ### 3. Debrief (15 Minutes)

  **Do not lecture.** Ask these questions and let them answer. Write their answers on the board.

  1.  **Round 1 vs Round 2:** "In Round 1, everyone bought the badge and nobody got accepted. In Round 2, only some bought it, and they got accepted. Why did the badge work in Round 2 but not Round 1?"
      *   *Target Answer:* It was too cheap in Round 1.
      *   *Your Add:* "Exactly. If it's too cheap, the 'wrong' people can buy it. It only works if it hurts the Low type more than the High type." **(Point a)**

  2.  **Round 3 (Subsidy):** "I made the badge cheaper for everyone in Round 3. Did that help the market?"
      *   *Target Answer:* No, it broke. The Low types faked it again.
      *   *Your Add:* "We often think making things cheaper is good. But here, reducing the cost destroyed the information. The value wasn't in the badge; it was in the *pain* of buying it." **(Point a reinforced)**

  3.  **Expectations:** "In Round 1, why did Receivers reject everyone? The High types were trying to signal."
      *   *Target Answer:* Because they couldn't tell who was who.
      *   *Your Add:* "The system got stuck. Even if High types wanted to signal, if Receivers expect fakes, they reject. You can be trapped in a world where no one trusts anyone, even if trust would be better." **(Point b)**

  4.  **Round 4 (Counter-Signalling):** "Did anyone notice the High types stopping? Why would the best people stop signalling?"
      *   *Target Answer:* They didn't need to.
      *   *Your Add:* "When you are truly the best, you don't need the badge. Only the people who are *unsure* of their status need to prove it. Silence became the loudest signal." **(Point c)**

  **Closing:** "This logic is called the **Handicap Principle** in biology, and **Costly Signalling** in economics. A peacock's tail is heavy and dangerous. That's exactly why it works. If it were easy, any sick bird could grow one. It works *because* it is costly."

  ---

  ### 4. Troubleshooting: What Will Go Wrong

  | Problem | Why it happens | In-the-moment fix |
  | :--- | :--- | :--- |
  | **"Nice" Receivers** | Students feel bad rejecting peers. | Remind them: "This is a simulation. If you Accept a Low type, *you* lose points. Protect your score." |
  | **Collusion** | Friends signal their type verbally. | Enforce the "No Talking" rule strictly. Shuffle seats between rounds. |
  | **Reputation Leaks** | "I know Sarah is smart, she must be H." | **Crucial:** Use the Random ID system. Collect and shuffle sheets. Never let sheets go hand-to-hand. |
  | **Boredom Signalling** | Low types signal just to "see what happens." | Keep rounds fast (5 mins max). Remind them: "Chips determine the prize. Burning chips loses the prize." |
  | **Round 4 Confusion** | Counter-signalling doesn't trigger. | If H and M both stay silent, acknowledge it: "Interesting. Without the threat of the Low type, the Middle type didn't need to pay." (Turn the failure into a lesson). |
  | **Math Drift** | Students lose track of chip counts. | Appoint two "Bankers" (trusted students) to handle payouts. You run the game flow. |

  ---

  ### 5. Limitations: What the Game Cannot Teach

  You asked for an honest list of gaps between this game and the theory.

  **1. Biological vs. Rational Cost**
  *   **The Gap:** In the game, students *calculate* whether to burn chips. In nature (the Handicap Principle), a peacock does not *choose* its tail; its genes do. The cost is physiological, not strategic.
  *   **Impact:** The game teaches **Strategic Signalling** (Spence Model), not strictly the **Handicap Principle** (Zahavi). The logic is identical (costly honesty), but the mechanism is reasoning vs. evolution.
  *   **What to say:** "In biology, the bird doesn't do the math. Evolution did the math over millions of years. Birds that faked the tail died out. You are doing the math in real-time."

  **2. The Fragility of Counter-Signalling (Point c)**
  *   **The Gap:** As noted in the Round 4 math, true counter-signalling requires the Low type to be a *credible threat* in the Receiver's mind. If you explicitly rule out the Low type (as the prompt requested), the Middle type has no incentive to signal.
  *   **Impact:** Round 4 might result in pooling (everyone silent) rather than separation (M signals, H silent).
  *   **What to say:** If Round 4 fails to separate, admit it. "This shows how delicate trust is. If the Receivers knew for sure there were no Low types, the Middle types would stop signalling. The signal only exists because the 'bad' type *might* be out there."

  **3. Common Knowledge**
  *   **The Gap:** In the game, everyone knows the payoff table. In the real world, people guess at the costs and benefits.
  *   **Impact:** The "Band" ($15 < K < 30$) is crisp in the game. In reality, it's a fuzzy zone of social norms.
  *   **What to say:** "In real life, we don't know the exact numbers. We just feel when something is 'too easy' to be true."

  **Summary for the Club:**
  This session will not make them experts in game theory. It will give them a **visceral experience** of why cheap promises fail, why subsidies can destroy quality, and why silence can be louder than speech. That is sufficient for an 80-minute student-led session.
