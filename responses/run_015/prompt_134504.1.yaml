  # Joint Statement on the Conceptual Validity of Contrastive Framing in Global History

  **Issued by the Adversarial Collaboration on Comparative Historical Method**
  **Representing: The Comparative Counterfactualists (Position A) and The Conceptual Historians (Position B)**

  ## I. Agreed Claims Regarding the Historical Record and Conceptual Distinctions

  We, the undersigned parties, acknowledge the following points of consensus regarding the empirical background and the conceptual landscape of the debate surrounding the Great Divergence and the Needham Question.

  1.  **Comparability of Early-Modern Capacities:** We agree that during the early-modern period, specific regions within Qing territories, particularly the Yangtze Delta, demonstrated technological and economic capacities—including agricultural productivity, market integration, and artisanal output—that were comparable to those found in advanced regions of Western Europe, such as England and the Low Countries. There was no predetermined inevitability of European dominance visible in the macroeconomic data prior to the late eighteenth century.

  2.  **The Specificity of the British Case:** We agree that the emergence of sustained industrial growth in Britain was not the result of a single factor but involved a specific, non-random conjunction of conditions. These conditions included access to high-quality coal deposits in proximity to water transport, distinct changes in property-rights regimes, and the flow of resources from colonial peripheries. We agree that this conjunction is the primary object of explanation.

  3.  **Distinction Between the Great Divergence and the Needham Question:** We agree that the question of why modern industrial capitalism emerged in Britain rather than China (the Great Divergence) is not identical to the question of why modern science developed in Europe rather than China (the Needham Question). While popular discussion frequently conflates the two, we acknowledge that technological capacity, scientific epistemology, and industrial organization are distinct variables that do not necessarily move in lockstep.

  4.  **The Status of the Contrastive Frame:** We agree that the framing "why Britain and not China?" is the central locus of our methodological dispute. We further agree that the validity of this framing depends on whether historical units can be treated as comparable cases and whether counterfactual reasoning can be disciplined enough to yield causal insight without imposing anachronistic categories.

  ## II. Formulations of Residual Disagreement

  While we share a common empirical baseline, we diverge on the methodological and conceptual validity of the questions posed. The following formulations are drafted to be acceptable to each respective camp as accurate representations of their stance.

  ### 1. The Validity of Counterfactual Isolation

  *   **Position A (Comparative Counterfactualists):** Disciplined counterfactual comparison is methodologically sound. It is possible to construct a coherent possible world in which a cluster of pre-industrial conditions (agricultural productivity, market integration, state fiscal capacity) is held constant while specific institutional arrangements (property-rights regimes, coal accessibility, colonial resource flows) are varied. This procedure yields genuine causal insight into why sustained industrial growth emerged in one case and not the other. Treating industrialization as an observable cluster of processes whose absence demands explanation does not constitute teleology.
  *   **Position B (Conceptual Historians):** The question is malformed because it requires holding constant the very social and institutional conditions that are themselves part of the explanation. The counterfactual scenario of "China with British institutions" is not a coherent possible world but a conceptual hybrid that ignores endogenous relationships. Furthermore, selecting industrial capitalism as the implicit baseline against which both societies are measured imports a teleological frame, treating one contingent path as the standard for historical success rather than analyzing each path on its own terms.

  ### 2. The Unit of Analysis

  *   **Position A (Comparative Counterfactualists):** The terms "Britain" and "China" function as valid analytical shorthand for distinct institutional clusters and state apparatuses. While internal heterogeneity exists, the aggregate behavior of these polities regarding fiscal extraction, legal enforcement, and resource mobilization allows them to be treated as unitary actors for the purpose of macro-historical comparison.
  *   **Position B (Conceptual Historians):** The terms "Britain" and "China" treat asymmetric entities as symmetric, unitary actors. This elides the vast internal heterogeneity of Qing territories and the composite, non-unitary character of the British state and its colonial periphery. Comparing these units as if they were equivalent categories distorts the historical record by imposing modern geopolitical boundaries onto early-modern social formations.

  ### 3. Verbal vs. Substantive Disputes

  We identify the following disputes as merely verbal, provided the terms are defined as specified below:

  *   **The Term "Counterfactual":** Position A uses "counterfactual" to denote a methodological heuristic for causal inference without committing to modal realism (the metaphysical existence of alternative worlds). Position B uses "counterfactual" to imply a commitment to the coherence of alternative historical worlds. **Substantive Remainder:** Once terminology is fixed to denote "methodological heuristic," the substantive disagreement remains regarding whether such heuristics distort the object of study by isolating variables that are historically inseparable.
  *   **The Term "China":** Position A uses "China" to denote the Qing state apparatus and its economic zone. Position B uses "China" to denote a civilizational region with fluid boundaries. **Substantive Remainder:** Once terminology is fixed to denote "the Qing state apparatus and its economic zone," the substantive disagreement remains regarding whether this apparatus can be treated as symmetric to the British state for the purpose of institutional comparison.

  ## III. Cruxes and Predictive Commitments

  To resolve these disagreements, we identify two specific cruxes. For each crux, we specify a concrete case or scenario and record the predictions each camp makes regarding the outcome of investigating that case.

  ### Crux 1: The Structural Parity of the Needham and Great Divergence Questions

  **The Sub-Question:** Do the Needham Question (regarding modern science) and the Great Divergence Question (regarding industrial economy) fail for the same reason—namely, that both illegitimately isolate one variable from a path-dependent institutional bundle—or do they fail for different reasons?

  **The Test Case:** A comparative analysis of the institutionalization of astronomy in the late seventeenth century, specifically comparing the funding and epistemic goals of the Royal Society in London against the Imperial Astronomical Bureau in Beijing.

  **Predictive Commitments:**
  *   **Position A Prediction:** The obstacles to answering both questions are structurally identical. In both cases, variables such as state patronage, property rights over knowledge, and communication networks can be isolated. If the Great Divergence question is solvable via counterfactual isolation of institutional variables, the Needham Question is similarly solvable. Both questions are well-posed.
  *   **Position B Prediction:** The obstacles differ fundamentally. The Great Divergence question fails due to material and institutional configurational causation (resources cannot be separated from social relations). The Needham Question fails for different reasons, primarily due to conceptual incommensurability (definitions of "science" vary across cultures). Therefore, even if one question were resolvable, it would not imply the resolvability of the other. Both questions are malformed, but for distinct reasons.

  ### Crux 2: Polities as Natural Experiments vs. Configurational Causation

  **The Sub-Question:** Is treating polities as "natural experiments" with isolable variables methodologically defensible in comparative history, or does configurational causation make such isolation impossible without distorting the object of study?

  **The Test Case:** A comparison of coal accessibility and utilization in the Newcastle region of Britain versus the Shanxi region of China during the eighteenth century, controlling for geological availability and transport technology.

  **Predictive Commitments:**
  *   **Position A Prediction:** Treating these regions as natural experiments is defensible. By holding geological availability and transport technology constant, one can isolate the institutional variables (e.g., mining rights, state taxation) that led to divergent utilization rates. This isolation will yield a causal explanation for why coal powered industrialization in one case and not the other.
  *   **Position B Prediction:** Treating these regions as natural experiments is indefensible. Coal accessibility is not an independent variable but is constituted by the social relations of extraction. The "value" of coal is configurational, dependent on labor systems, energy regimes, and state priorities that cannot be held constant. Isolating coal from this configuration distorts the object of study and produces a spurious causal claim.

  ***

  **Signed,**

  **The Comparative Counterfactualists**

  **The Conceptual Historians**
