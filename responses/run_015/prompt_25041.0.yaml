prompt: |-
  I've been reading around the meta-problem of consciousness — roughly, the problem of explaining why we think there is a hard problem of consciousness in the first place — and I keep finding that people propose theories of the meta-problem without first being clear about what such a theory is supposed to explain. Before I go any further, I want the desiderata: what must an adequate theory of the meta-problem of consciousness deliver? I mean the full specification — which phenomena it must account for, which judgments and intuitions about consciousness it must explain the presence or absence of, which distinctions it must respect, which empirical results from psychology and neuroscience it cannot contradict, and which explanatory traps it must avoid (for example, explaining our sense that consciousness is mysterious in a way that itself presupposes the very mystery it is meant to explain away). For each requirement, give me the case or consideration that makes it a requirement rather than a mere preference. Then tell me which of these desiderata are non-negotiable — things any theory of the meta-problem simply has to get right — and which are more like commitments of a particular camp (illusionists, realists, phenomenal concept strategists, and so on) that a theory could reasonably reject. I also want to know whether any pair of these desiderata are in tension with each other — whether satisfying one makes it harder or impossible to satisfy another. Finally, tell me which single requirement does the most work in excluding candidate theories, and why. I am less interested in a scorecard of existing views than in the criteria themselves, though a brief indication of where the main approaches stumble would help me see why the criteria matter. Please also tell me which assumptions your list of desiderata depends on — for instance, assumptions about whether the hard problem is real or illusory — and how the list would change if those assumptions were dropped. Respond in the style of an expert writing to a colleague. Think very carefully before answering, and please write in continuous prose only: no headings, no bullet points, no bold text, no tables — just paragraphs, the way you would write an email or a letter.
