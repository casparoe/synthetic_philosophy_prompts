      *   Ending analysis? (Relinquishing control).
      *   Plain about jokes? (Yes, soup/moon).

      *(Self-Correction during drafting)*: I need to make sure I distinguish between "Causal" and "Constitutive" clearly.
      *   Causal: Smoking causes yellow fingers. If I dye my fingers, I don't get cancer. (Proxy broken).
      *   Constitutive: A "voluntary donation." If I steal your money and call it a donation, it's not a donation. (Target undefined).
      *   Bruce/Grace fits Constitutive perfectly.

