  ## Part 1: The Logical Space

  Before building the tree, we map the four axes that define the positions. Your six target leaves occupy specific coordinates on these axes.

  1.  **Substrate:** [Biological Required] ↔ [Substrate Independent]
  2.  **Continuity:** [Spatiotemporal Continuity Required] ↔ [Psychological Continuity Sufficient]
  3.  **Uniqueness:** [Identity Must Be Unique] ↔ [Identity Can Branch]
  4.  **Ontology:** [Binary Fact] ↔ [Degree/Empty]

  ### Mapping the Leaves
  *   **Biological/Substrate:** Substrate=Bio. (Continuity/Uniqueness irrelevant).
  *   **Gradualism:** Substrate=Func, Continuity=Required. (Usually implies Uniqueness=Yes).
  *   **Straight Functionalism:** Substrate=Func, Continuity=No, Uniqueness=No.
  *   **No-Branching:** Substrate=Func, Continuity=No, Uniqueness=Yes.
  *   **Reductionist:** Ontology=Degree. (Can overlay any of the above, but usually Func).
  *   **No-Self:** Ontology=Empty. (Rejects the premise of the other axes).

  ### Empty/Unoccupied Combinations
  *   **Bio-Substrate + Psychological Continuity Sufficient:** Incoherent (if biology is required, psychology alone cannot sustain identity).
  *   **Gradualist + Identity Can Branch:** Unattractive (if physical continuity saves you, duplicating that continuity usually creates a rival, not a survival).
  *   **No-Self + Binary Fact of Survival:** Incoherent (denies the entity required for the fact).
  *   **Straight Functionalism + Temporal Gap Matters:** Unoccupied (rarely defended; usually functionalists treat time as irrelevant).

