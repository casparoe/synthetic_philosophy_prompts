  ## Part 3: Leaf Verification & Collapse Analysis

  ### The Six Required Leaves
  1.  **Biological/Substrate:** Reached via Node 1(No) → Node 2(No) → Node 7.
  2.  **Straight Functionalism:** Reached via Node 1(Yes) → Node 3(Yes) → Node 4(Yes) → Node 8(Yes) → Node 9(Death) → Node 10(Degree/Empty optional). *Note: Strict Straight Functionalism usually lands in Node 4(Yes)/Node 9(Survival).*
  3.  **Gradualism:** Reached via Node 1(No) → Node 2(Yes) → Node 6.
  4.  **No-Branching:** Reached via Node 1(Yes) → Node 3(No) → Node 5.
  5.  **Reductionist:** Reached via Node 10(Degree).
  6.  **No-Self:** Reached via Node 10(Empty).

  ### Indistinguishable Leaves & Separation Cases

  **1. Straight Functionalism vs. No-Branching Functionalism**
  *   **Collapse:** Outside of **Case 6 (Branching)**, these positions are identical. Both accept the Instant Upload (Node 1). Both accept the Gap (Node 4). Both accept the Speedup (Node 8).
  *   **Tree Status:** The tree successfully separates them at Node 3.
  *   **Warning:** If a user skips Node 3 (e.g., if you programmed the wiki to hide branching questions for "safety"), these leaves merge. You must force the Branching question for anyone who accepts the Instant Upload.

  **2. Reductionist vs. No-Self**
  *   **Collapse:** Your case list does not cleanly separate these. Both answer "No fact of the matter" to survival questions. The Reductionist says "Survival is 50% true." The No-Selfer says " 'Survival' refers to nothing." Node 10 attempts to catch this via self-report, but users often conflate "fuzzy" with "empty."
  *   **Extra Case Needed:** **The Partial Psychology Case.**
      *   *Scenario:* A procedure destroys 50% of your memories and alters 50% of your personality traits, selected randomly, while preserving functional capacity.
      *   *Reductionist:* "I survive to degree 0.5."
      *   *No-Self:* "There is no 'I' to have a degree. There is just a causal chain with 50% similarity."
      *   *Why it works:* It forces a commitment to whether *degrees* apply to the *relation* (Reductionist) or whether the *relata* (the Self) are the problem (No-Self).

  ### Unoccupied Logical Combos (One-Line Reasons)
  *   **Bio-Substrate + Instant Upload Survival:** Incoherent (contradicts the definition of substrate dependence).
  *   **Gradualist + Branching Allowed:** Unattractive (physical continuity advocates typically view duplication as rivalry, not survival).
  *   **No-Self + Binary Survival Verdict:** Incoherent (eliminativism denies the subject required for a binary verdict).
  *   **Functionalism + Never-Run Scan is Survival:** Unoccupied (almost no functionalist defends Platonism without causal instantiation).

  ### Implementation Note for the Wiki
  Ensure Node 3 (Branching) is **mandatory** for anyone who answers "Yes" to Node 1. If you allow users to opt-out of the branching scenario, your "Straight Functionalism" leaf will be contaminated by "No-Branching" users who didn't want to think about fission. The awkward commitment you want them to state plainly is: *"If two exact copies of me exist, do I wake up in both bodies, only one, or neither?"*
