  ## Part 2: The Decision Tree (10 Nodes)

  This tree uses your 9 cases plus 1 meta-ontological question. Follow the path based on your intuition about the case.

  **Node 1 (Case 5: Instant Emulation)**
  The biological brain is destroyed; a perfect emulation starts the next instant. Do you survive?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 3.

  **Node 2 (Case 2: Crossfade)**
  No instant swap: old units ramp down as new units ramp up over hours. Does this continuous physical transition save you where Node 1 failed?
  *   **No** → Go to Node 7 (Confirm Biological).
  *   **Yes** → Go to Node 6 (Refine Gradualism).

  **Node 3 (Case 6: Branching)**
  You said Yes to Node 1. Now, the biological brain is *not* destroyed; it is kept alive alongside the upload. Do *both* candidates survive as you?
  *   **Yes** → Go to Node 4 (Refine Functionalism).
  *   **No** → Go to Node 5 (No-Branching Check).

  **Node 4 (Case 8: The Gap)**
  You accept branching. Now, destroy the brain, store the scan for 200 years, then rebuild. Is this survival equal to the instant case?
  *   **No** → Leaf: **Continuity Functionalism** (Pattern matters, but temporal gaps break it).
  *   **Yes** → Go to Node 9 (Causality Check).

  **Node 5 (Case 1: 99.9% Match)**
  You accept the upload but not branching. Suppose the synthetic units match function on only 99.9% of inputs. Does this imperfection kill survival?
  *   **Yes** → Leaf: **Strict No-Branching** (Functional match must be perfect and unique).
  *   **No** → Go to Node 10 (Ontology Check).

  **Node 6 (Case 3: Thinner Experience)**
  You are a Gradualist (Node 2=Yes). At 40% replacement, the subject reports experience is "thinner" but function is normal. Are they dying during the process?
  *   **Yes** → Leaf: **Phenomenal Gradualism** (Qualia continuity is the metric).
  *   **No** → Leaf: **Structural Gradualism** (Physical continuity is the metric, qualia irrelevant).

  **Node 7 (Case 4: Order/Anesthesia)**
  You likely die on upload (Node 1 & 2 = No). Does it matter if we replace cortex first vs. brainstem first, or if you are awake vs. anesthetized?
  *   **Yes** → Leaf: **Localist Biological** (Specific structures/consciousness locus matter).
  *   **No** → Leaf: **Holistic Biological** (The organism as a whole is the unit of survival).

  **Node 8 (Case 7: Speedup)**
  (Asked if Node 3=Yes). The upload runs 1000x faster (century in weeks). Does this rate change count as survival *of you*?
  *   **No** → Leaf: **Temporal Functionalism** (Psychological continuity requires roughly normal time flow).
  *   **Yes** → Go to Node 9.

  **Node 9 (Case 9: Never-Run Scan)**
  The complete scan exists but is never instantiated/run. Is that survival, death, or a badly formed question?
  *   **Survival** → Leaf: **Platonist Functionalism** (Information pattern is sufficient).
  *   **Death/Bad Question** → Go to Node 10.

  **Node 10 (Meta: Degree vs. Empty)**
  In the borderline cases above (99.9% match, branching, gaps), is there a fact of the matter that is simply fuzzy, or is the question itself misdescribed?
  *   **Fuzzy Fact (Degree)** → Leaf: **Reductionist** (Survival comes in degrees).
  *   **Misdescribed (Empty)** → Leaf: **No-Self** (No persistent entity to survive).

