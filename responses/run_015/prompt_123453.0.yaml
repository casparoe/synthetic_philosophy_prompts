  5.  **Refining for Naturalness:**
      *   Add filler words (like, kinda, look).
      *   Add actions (stirring coffee, leaning in).
      *   Include requested typos (dont, thats, gonna).
      *   Ensure they listen to each other. If Alex says X, Jamie should address X, not just repeat Y.

  6.  **Writing - Iteration 1 (Mental Check):**
