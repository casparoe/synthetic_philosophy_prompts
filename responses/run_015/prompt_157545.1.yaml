  9.  **Final Polish:** Ensure the tone is supportive but rigorous. Structure clearly with headings. Make sure the "Single Revision" is actionable.

      *(Self-Correction on the Lever Case)*: The user asks if the reluctance shows the switch verdict was an artifact OR if proximity is what (3) was tracking.
