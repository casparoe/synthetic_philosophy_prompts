      *   **Prompt Constraint Check:** "privately assigned viewpoints distributed so that majorities favor each criterion separately while a majority opposes admission."
          *   *Correction/Refinement:* Actually, the classic Discursive Dilemma usually works the other way around to show the paradox clearly.
          *   *Scenario A (Premise-based):* Majority says Yes to Premise 1, Yes to Premise 2 -> Logic says Yes to Conclusion. But Majority says No to Conclusion. (This is the paradox).
          *   *Scenario B (Conclusion-based):* Majority says No to Conclusion. But if we check premises, they support Yes.
          *   *Prompt Requirement:* "majorities favor each criterion separately while a majority opposes admission."
          *   *Logic Check:* If Admit = Qualified $\land$ Capacity.
          *   If Majority says Qualified = Yes.
          *   If Majority says Capacity = Yes.
          *   Then Logic dictates Admit = Yes.
          *   But the prompt asks for "a majority opposes admission."
          *   *Wait, this is the exact definition of the Discursive Dilemma.* The group is inconsistent. The individual votes are consistent (each person votes logically), but the aggregate is not.
          *   *So:* I need to design the distribution of ballots such that:
              *   Person 1: Q=Y, C=Y, A=Y (Consistent)
              *   Person 2: Q=Y, C=N, A=N (Consistent)
              *   Person 3: Q=N, C=Y, A=N (Consistent)
              *   *Aggregate:* Q (2-1 Yes), C (2-1 Yes), A (1-2 No).
              *   *Result:* Group says Yes to Q, Yes to C, but No to A. This violates the rule $A \iff (Q \land C)$.
      *   **Deliverables:** Step-by-step procedure, ballot materials, tabulation method, debrief (connecting to premise-based vs. conclusion-based), facilitation problems/remedies, and one central simplification of impossibility results.

  2.  **Drafting the Exercise Structure:**
      *   **Time Management:** 80 mins total.
          *   Intro: 10 mins.
          *   Exercise (Voting + Tabulation): 25 mins.
          *   Debrief/Explanation: 35 mins.
          *   Q&A/Close: 10 mins.
      *   **Participants:** 16 adults. Need to divide them into groups or treat them as one body?
          *   To make the math work cleanly for the "reveal," it's better to treat the 16 as one "committee." However, distributing specific private viewpoints to 16 people to get exact majorities can be messy if they don't follow instructions.
          *   *Better approach:* Divide into 4 sub-committees of 4 people? No, the prompt implies *one* group verdict.
          *   *Best approach:* Treat the 16 participants as the voting body. I need to assign them roles/ballots secretly so the aggregate math works.
          *   *Math:* I need a majority for Q (9+), a majority for C (9+), but a majority against A (9+).
          *   *Individual Consistency:* Each person must vote $A = Q \land C$.
          *   *Distribution:*
              *   Type 1 (Yes/Yes/Yes): Needs to be the minority. Let's say 5 people.
              *   Type 2 (Yes/No/No): Needs to contribute to Q-Yes, C-No, A-No. Let's say 6 people.
              *   Type 3 (No/Yes/No): Needs to contribute to Q-No, C-Yes, A-No. Let's say 5 people.
              *   *Totals:* 16 people.
              *   *Q Vote:* 5 (Y) + 6 (Y) = 11 Yes. 5 No. (Majority Yes).
              *   *C Vote:* 5 (Y) + 5 (Y) = 10 Yes. 6 No. (Majority Yes).
              *   *A Vote:* 5 (Y). 11 No. (Majority No).
              *   *Check:* Does this match the prompt? "majorities favor each criterion separately while a majority opposes admission." Yes.
      *   **Secrecy:** Participants must not know their "type" is pre-assigned to ensure the paradox emerges naturally without collusion. I will hand out sealed envelopes or distinct colored ballots that correspond to the types, but instruct them to vote their "conscience" based on the case info provided *in* the envelope.
      *   *Wait, a better way for a workshop:* Give them the *case facts* differently.
          *   If I give everyone the same facts, they might all vote the same way.
          *   To ensure the specific distribution, I must assign their *judgment* privately.
          *   *Instruction:* "You are a committee member. Based on the evidence provided in your private brief, cast your vote."
          *   *Private Brief:* Actually dictates their vote to ensure the math works, but frames it as their judgment.
          *   *Ethical Check:* Is it deceptive? It's a simulation. I must clarify in the debrief that the "evidence" was rigged to demonstrate the logical phenomenon.

  3.  **Developing the Materials:**
      *   **Ballot:** Needs three checkboxes: Qualified? Capacity? Admit?
      *   **Instructions:** Explicit rule: Admit ONLY IF Qualified AND Capacity.
      *   **Private Briefs:** Three versions (A, B, C) corresponding to the types above.
          *   Brief A: Evidence suggests High Merit, High Capacity. (Vote Y, Y, Y).
          *   Brief B: Evidence suggests High Merit, Low Capacity. (Vote Y, N, N).
          *   Brief C: Evidence suggests Low Merit, High Capacity. (Vote N, Y, N).
      *   **Distribution:** 5 of A, 6 of B, 5 of C. (Total 16).

  4.  **Tabulation Method:**
      *   Collect ballots.
      *   Tally publicly on a whiteboard.
      *   Column 1: Qualified (Yes/No).
      *   Column 2: Capacity (Yes/No).
      *   Column 3: Admit (Yes/No).
      *   Highlight the inconsistency.

  5.  **Debrief Strategy:**
      *   **Phase 1: Observation.** Ask "What is wrong here?" Let them spot the contradiction.
      *   **Phase 2: Naming.** Introduce "The Discursive Dilemma" or "Doctrinal Paradox."
      *   **Phase 3: Aggregation Methods.**
          *   *Conclusion-Based:* Just vote on Admit. (Result: Reject).
          *   *Premise-Based:* Vote on Q and C, then apply logic. (Result: Admit).
      *   **Phase 4: Implications.** Which is fairer? Which is more logical?
      *   **Simplification Note:** Arrow's Theorem/Impossibility results usually involve >2 options or ranking. This is binary judgment aggregation. The simplification is assuming a fixed logical connection ($A \iff Q \land C$) whereas general impossibility theorems deal with preference orderings. I need to identify *one* central aspect simplified.
          *   *Candidate:* The assumption of a single logical constraint vs. the universal domain of preferences. Or the binary nature vs. ranked preferences.
          *   *Selection:* The exercise assumes a fixed, known logical connection between premises and conclusion. General impossibility results (like Arrow's) often deal with aggregating *preferences* where the "logic" of social welfare is not pre-defined mathematically in the same way. A better fit for Judgment Aggregation (List & Pettit) is the assumption that the connection rule is uncontested. In reality, people might disagree on the rule itself ($A \iff Q \land C$). The exercise simplifies by fixing the *logic* to isolate the *voting* paradox.

