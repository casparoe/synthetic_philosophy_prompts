      *   *Problem:* Participants talk and realize they have different briefs. *Remedy:* Strict "no discussion" rule during voting.
      *   *Problem:* Participants vote inconsistently (e.g., Q=Y, C=Y, A=N). *Remedy:* Instructions emphasize logical consistency; monitor during voting.
      *   *Problem:* Math doesn't work (e.g., someone loses a ballot). *Remedy:* Have 2 spare ballots of Type B ready to adjust counts if needed, or just acknowledge real-world noise.
      *   *Problem:* Participants feel manipulated. *Remedy:* Transparency in debrief ("This was a simulation").

  7.  **Review against Constraints:**
