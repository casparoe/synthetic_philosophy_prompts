answer: |-
  # Workshop Plan: The Admissions Paradox
  **Topic:** Collective Reasoning & The Discursive Dilemma
  **Duration:** 80 Minutes
  **Participants:** 16 Adults (Non-specialists)
  **Goal:** Demonstrate how logically consistent individual judgments can aggregate into an inconsistent collective verdict.

  ---

  ## 1. Step-by-Step Procedure

  ### Phase 1: Introduction (10 Minutes)
  1.  **Welcome & Context:** Briefly introduce the workshop theme: "How do groups make decisions?"
  2.  **The Scenario:** Explain that the group will act as a University Admissions Committee.
  3.  **The Rule:** Display the admission rule clearly on a slide or whiteboard:
      > **Admission Rule:** A candidate is admitted **IF AND ONLY IF** they are (1) **Qualified** on merit **AND** (2) **Admissible** given department capacity.
      > *Logic: Admit $\leftrightarrow$ (Qualified $\land$ Capacity)*
  4.  **Confidentiality:** Instruct participants that they will receive private case files. They must not share the contents of their files with others until the voting is complete.

  ### Phase 2: The Voting Exercise (25 Minutes)
  1.  **Distribution:** Hand out sealed envelopes. There are three types of envelopes (A, B, C).
      *   **5 participants** receive Type A.
      *   **6 participants** receive Type B.
      *   **5 participants** receive Type C.
      *   *(Tip: Mark envelopes discreetly on the back for your tracking, e.g., a small dot color).*
  2.  **Review:** Give participants 5 minutes to read their Private Case File.
  3.  **Voting:** Distribute the **Committee Ballot**. Participants mark their judgments based *only* on their file and the Admission Rule.
  4.  **Collection:** Collect ballots in a box.
  5.  **Tabulation:** Invite three volunteers to the front to tally the votes publicly on the whiteboard while the rest watch.

  ### Phase 3: The Reveal & Debrief (35 Minutes)
  1.  **The Reveal:** Do not explain the paradox yet. Ask the group: *"Look at the final tally. Is there anything strange about this result?"* Allow 5 minutes for discussion. Guide them to see that the group accepts the premises but rejects the conclusion derived from those premises.
  2.  **Naming the Phenomenon:** Once the inconsistency is identified, introduce the term **"The Discursive Dilemma"** (or Doctrinal Paradox).
  3.  **Aggregation Methods:** Draw two columns on the board:
      *   **Conclusion-Based Aggregation:** We only vote on the final decision (Admit/Reject). *Result: Reject (11-5).*
      *   **Premise-Based Aggregation:** We vote on the criteria (Qualified/Capacity) and apply the rule logically. *Result: Admit (Majority says Yes to both criteria).*
  4.  **Discussion:** Facilitate a discussion on which method is fairer. (There is no right answer; the point is the tension).
  5.  **The Simplification Disclosure:** Explicitly state the simplification regarding impossibility results (see Section 5).

  ### Phase 4: Closing (10 Minutes)
  1.  **Real-World Application:** Briefly mention where this appears in law (court rulings), politics (referendums), and corporate boards.
  2.  **Q&A:** Open floor for questions.
  3.  **Dismissal.**

  ---

  ## 2. Ballot Materials

  ### A. Private Case Files (Print on distinct colored paper)

  **Type A File (5 Copies)**
  > **Candidate File #01**
  > *   **Merit Review:** The candidate's test scores and portfolio exceed all thresholds. **(Verdict: Qualified)**
  > *   **Capacity Review:** The department has 3 open slots and this is the only applicant. **(Verdict: Capacity OK)**
  > *   *Instruction:* Based on the Admission Rule, cast your vote.

  **Type B File (6 Copies)**
  > **Candidate File #02**
  > *   **Merit Review:** The candidate's test scores and portfolio exceed all thresholds. **(Verdict: Qualified)**
  > *   **Capacity Review:** The department is currently at maximum enrollment with a hiring freeze. **(Verdict: Capacity NOT OK)**
  > *   *Instruction:* Based on the Admission Rule, cast your vote.

  **Type C File (5 Copies)**
  > **Candidate File #03**
  > *   **Merit Review:** The candidate's test scores fall below the required threshold. **(Verdict: NOT Qualified)**
  > *   **Capacity Review:** The department has 3 open slots and this is the only applicant. **(Verdict: Capacity OK)**
  > *   *Instruction:* Based on the Admission Rule, cast your vote.

  ### B. Committee Ballot (Standard for all)

  > **ADMISSIONS COMMITTEE BALLOT**
  >
  > **Rule:** Admit ONLY IF (Qualified AND Capacity OK).
  >
  > Please mark **YES** or **NO** for each proposition.
  >
  > 1. Is the candidate **Qualified**?  [ ] YES   [ ] NO
  > 2. Is **Capacity** Available?      [ ] YES   [ ] NO
  > 3. Should the candidate be **Admitted**? [ ] YES   [ ] NO
  >
  > *Note: Your votes must be logically consistent with the Rule above.*

  ---

  ## 3. Tabulation Method

  Use a 3-column table on the whiteboard.

  | Voter ID | Qualified? | Capacity? | Admit? |
  | :--- | :---: | :---: | :---: |
  | 1-5 (Type A) | YES | YES | YES |
  | 6-11 (Type B) | YES | NO | NO |
  | 12-16 (Type C) | NO | YES | NO |
  | **TOTAL** | **11 YES** | **10 YES** | **5 YES** |
  | **VERDICT** | **PASS** | **PASS** | **FAIL** |

  **Facilitator Script for Tabulation:**
  *"Look at the bottom row. The group has judged the candidate Qualified. The group has judged Capacity is Available. But the group has judged the candidate should NOT be Admitted. This violates the rule we all agreed to at the start."*

  ---

  ## 4. Debrief: Connecting to Theory

  Use this flow to connect the experience to the concepts of **Premise-Based** vs. **Conclusion-Based** aggregation.

  1.  **Individual Rationality:** Ask, *"Did any individual vote illogically?"* (Answer: No. Every person followed the rule $A \iff Q \land C$).
  2.  **Collective Irrationality:** Ask, *"Did the group follow the rule?"* (Answer: No. The group said $Q$ is True, $C$ is True, but $A$ is False).
  3.  **The Two Paths:**
      *   **Conclusion-Based:** If we ignore the reasons and just count the "Admit" column, the candidate is rejected. This respects the direct will of the majority on the outcome but ignores their reasons.
      *   **Premise-Based:** If we respect the "Qualified" and "Capacity" votes as the will of the majority, we must logically admit the student. This respects the reasons but overrides the direct vote on the outcome.
  4.  **The Dilemma:** Explain that this is not a counting error. It is a structural feature of group decision-making when multiple interconnected issues are voted on. This is the **Discursive Dilemma**.

  ---

  ## 5. Facilitation Problems & Remedies

  | Problem | Likelihood | Remedy |
  | :--- | :--- | :--- |
  | **Collusion/Comparison** | High | Participants may compare case files before voting. | **Remedy:** Enforce a strict "No Discussion" rule during the 5-minute review. Seat participants far apart if possible. Collect files before voting starts. |
  | **Inconsistent Voting** | Medium | A participant may vote Yes to Q, Yes to C, but No to Admit (violating the rule). | **Remedy:** Circulate during voting. If you see an inconsistent ballot, quietly ask the participant to review the Rule on the ballot. If they submit it anyway, exclude it from the tally as a "spoiled ballot" to preserve the paradox math. |
  | **Math Failure** | Low | If a Type A voter votes "No" on Admit despite their file. | **Remedy:** Have 2 spare Type B ballots in your pocket. If the "Admit" column gets too many Yes votes, discreetly add a Type B ballot to the pile during collection to restore the majority "No" on admission. (Disclose this trickery in the debrief as part of the "engineered" nature). |
  | **Cynicism** | Medium | Participants may feel manipulated by the pre-assigned views. | **Remedy:** Address this head-on in the debrief. Acknowledge that in real life, views aren't distributed by envelopes, but the *logical structure* of the paradox remains the same regardless of how views are formed. |

  ---

  ## 6. Central Simplification of Impossibility Results

  **The Aspect:** **Universal Domain vs. Engineered Distribution.**

  **Statement for Participants:**
  *"In the final debrief, I must disclose a simplification. General impossibility theorems (like Arrow's Theorem or the List-Pettit Theorem) state that under a **Universal Domain** of possible opinions, a paradox **can** arise. However, in this exercise, we **guaranteed** the paradox by engineering the distribution of your case files.*

  *In the real world, this inconsistency does not happen in every vote; it depends on how opinions are distributed. We simplified the **probability** of the event to **certainty** for the sake of demonstration. The theory tells us the risk is always present; this exercise forced the risk to materialize so you could feel it."*

  **Why this matters:** This prevents participants from believing that all group voting is inherently broken or that the paradox occurs in every decision. It clarifies that the theorem describes a *vulnerability* in the system, not a constant state of failure.
