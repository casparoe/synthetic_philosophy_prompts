answer: |-
  **The Logarithmic Life: Inside Geometric Rationality**

  Julian Varkov did not propose to his partner until the edge was clear. For eighteen months, he tracked the volatility of their compatibility, treating affection not as a boundless resource but as deployable capital. When he finally knelt, it was because the calculated Kelly fraction suggested an allocation of 0.45 of his remaining emotional equity. To commit more would be overbetting; to commit less, suboptimal growth. Varkov is a practitioner of Geometric Rationality, a nascent movement arguing that the standard model of human decision-making is arithmetically naive and existentially dangerous.

  The core thesis rests on the distinction between arithmetic and geometric means. In standard expected-utility theory, an agent maximizes the arithmetic average of outcomes. If a bet has a positive expected value, the rational actor takes it. Geometric Rationalists argue this ignores the non-ergodic nature of reality. Life is a repeated game where sequences matter. A strategy that maximizes arithmetic return often invites ruin—a 100% loss of capital from which one cannot compound. To survive the long run, one must maximize the expected logarithm of wealth. The Kelly criterion provides the optimal bet size to achieve this geometric growth without crossing the threshold of ruin.

  For the Geometric Rationalist, ruin is not merely bankruptcy. It is divorce, burnout, or despair. Consequently, every life choice becomes a problem of position sizing. Consider progeny. Children offer high potential utility but carry immense variance and irreversible capital lock-up. A strict Kelly analysis often suggests a fractional allocation near zero for those with limited resilience, framing parenthood as a leveraged position that risks wiping out the parental unit's operational capacity. Similarly, religious commitment is assessed as a Pascal's Wager refined by leverage constraints. While the infinite payoff of salvation suggests an all-in bet, the ongoing cost of tithing and dogmatic adherence represents a drag on geometric growth. The optimal position is often a hedged minority stake.

  **Sidebar: Recommended Kelly Fractions for Existential Allocation**

  | Decision Domain | Edge Estimate | Variance | Recommended Kelly Fraction |
  | :--- | :--- | :--- | :--- |
  | First Date | 0.05 | High | 0.02 |
  | Marriage Proposal | 0.30 | Medium | 0.45 |
  | Parenthood | 0.15 | Extreme | 0.00 – 0.10 |
  | Religious Conversion | 0.10 | Low | 0.05 |
  | Speculative Metaphysics | 0.00 | Infinite | 0.00 |

  Critics argue this framework collapses the distinction between investment and care. Elena Rostova, an arithmetic ethicist, contends that the model fails to account for non-compounding values. "Treating human bonds as leveraged positions assumes the goal is survival of the self," Rostova says. "But love is often a deliberate acceptance of ruin. If you optimize against heartbreak, you optimize against intimacy. The Kelly criterion protects the portfolio, but it liquidates the soul."

  Varkov dismisses this as arithmetic sentimentalism. He argues that avoiding ruin is the prerequisite for any virtue. A burnt-out caregiver helps no one; a bankrupt mystic prays poorly. By adhering to log-utility, Geometric Rationalists aim to remain in the game indefinitely. They accept slower growth in exchange for asymptotic survival. In a world of fat tails and black swans, they claim to be the only ones who have done the math on staying alive. Whether this constitutes wisdom or merely a sophisticated form of cowardice remains the only variable they have not yet solved.
