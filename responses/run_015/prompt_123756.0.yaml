answer: |-
  # Joint Statement on Bounded Rationality and Decision Procedures

  ## 1. What we both sign

  We enter this collaboration acknowledging that our disagreement has persisted because both sides capture essential features of agency that the other overlooks. We agree on the following substantive claims regarding the nature of bounded agents and the environments they inhabit:

  1.  **Resource Scarcity is Fundamental:** All agents operate under hard constraints on time, memory, and attention. Any model ignoring these costs fails to describe real decision-making.
  2.  **Uncertainty is Structural:** Agents rarely know the payoff distribution ex ante. Search is often required to reveal the option set itself, not just the value of known options.
  3.  **Procedure Costs Matter:** The cost of deciding is distinct from the cost of executing the decision. A procedure that yields the optimal act but bankrupts the agent is irrational.
  4.  **Flat Terrain Convergence:** In environments where many options lie within a negligible margin of the global maximum, our models predict identical behavior. Here, the dispute is purely descriptive, not behavioral.
  5.  **Heuristics are Structured:** Heuristics are not random errors; they are stable, structured responses to environmental regularities. Both camps agree they are adaptive.
  6.  **Aspiration Levels Exist:** Agents operate with thresholds of acceptability. Camp O views these as shadow prices of constraints; Camp S views them as feedback-adjusted anchors. Both agree they function as stopping rules.
  7.  **The Regress is Real:** Choosing a decision procedure is itself a decision. Both camps acknowledge the potential for infinite regress if every procedure requires an optimized selection procedure.
  8.  **Institutional Justification:** In organizational settings, decisions must be defended to third parties. A decision that cannot be explained is often institutionally invalid, regardless of its payoff.
  9.  **Swap-Sensitivity Matters:** The order in which options are presented should not arbitrarily dictate choice in stable environments. High swap-sensitivity indicates fragility.
  10. **Executability Constraint:** A model of rationality must be executable by the agent at the moment of decision, not just reconstructible by an observer after the fact.

  We sign this to affirm that our debate is not about whether agents are bounded, but about the mathematical and psychological structure of those bounds.

  ## 2. Where we differ

  | Disagreement | Camp O (Optimizer) Wording | Camp S (Satisficer) Wording |
  | :--- | :--- | :--- |
  | **Search Cost Estimation** | Search costs are estimable via a meta-model. The agent prices the expected value of information against the known cost of computation before searching. | Search costs are endogenous. You often cannot know the cost of a search step without taking it, making ex ante pricing impossible. |
  | **Stopping Rule Origin** | Stopping occurs when the marginal expected gain from further search equals the marginal cost of that search. | Stopping occurs when an option meets an aspiration level adjusted by recent feedback and environmental cues. |
  | **Value of Heuristics** | Heuristics are valuable insofar as they approximate the optimal choice with lower computation costs. Their value is reducible to expected payoff. | Heuristics buy properties like robustness, speed, and defensibility. These values are not always reducible to immediate expected payoff. |
  | **Regress Solution** | The regress stops at a fixed point where the cost of optimizing the procedure exceeds the benefits of doing so. | The regress stops via hierarchical aspiration levels. We satisfice over procedures because optimizing them is itself too costly to optimize. |

  ## 3. Cruxes

  **1. The Executability of Search Costs**
  Camp O claims agents can estimate the cost of search ex ante using priors. Camp S claims this estimate is often unavailable until search is underway. If Camp S is right, Camp O's model is descriptively empty for novel environments. If Camp O is right, Camp S's "endogenous cost" is just a modeling error. Settling this moves Camp S significantly, as it challenges the core mechanism of adaptive aspiration.

  **2. Auditability as a Terminal Value**
  Camp O argues auditability is just another term in the utility function. Camp S argues it is a structural constraint on the *type* of reasoning allowed, independent of payoff. If auditability cannot be priced without infinite regress (e.g., pricing the cost of explaining the price), Camp O's reduction fails. This moves Camp O more, as it threatens the universality of the optimization framework.

  **3. The Regress Stopping Condition**
  Both agree procedure choice is a decision. Camp O says we optimize the choice of procedure; Camp S says we satisfice over procedures. If optimizing procedure-choice requires a meta-procedure ad infinitum, Camp O needs a principled stopping point. If Camp S can show that hierarchical satisficing is stable where hierarchical optimizing is not, Camp O must concede that optimization is not the universal norm.

  ## 4. Tests, cases and predictions

  **Case 1: The Hiring Committee (Auditability)**
  *Scenario:* A committee must hire one candidate. Option A has slightly higher expected productivity but is hard to justify (niche skills). Option B is solid and easily defended.
  *Camp O Prediction:* Agents will choose A unless the cost of justification is explicitly priced into the loss function. If B is chosen, it implies the "defense cost" was higher than the productivity gain.
  *Camp S Prediction:* Agents will choose B because the procedure (hire defensible candidate) is lexically prior to payoff maximization in institutional settings.
  *Falsification:* O is wrong if agents choose B even when explicitly told defense costs are waived. S is wrong if agents choose A when defense costs are high but productivity gain is massive.

  **Case 2: The Apartment Hunt (Search Costs)**
  *Scenario:* Agents search for apartments in a new city. Viewings cost time. The distribution of quality is unknown.
  *Camp O Prediction:* Agents will set a reservation price based on prior estimates of the distribution and search costs. Search stops when an apartment exceeds this price.
  *Camp S Prediction:* Agents will adjust aspiration levels based on the first few viewings. Search stops when an apartment matches the adjusted aspiration, not a fixed prior.
  *Falsification:* O is wrong if reservation prices shift wildly based on the first three viewings without new cost information. S is wrong if aspiration levels remain fixed despite clear evidence of a changed market.

  **Case 3: Protocol Selection (The Regress)**
  *Scenario:* Agents must choose a decision procedure under severe time pressure.
  *Camp O Prediction:* Agents will spend time selecting the optimal procedure proportional to the stakes.
  *Camp S Prediction:* Agents will grab the first "good enough" procedure available (e.g., "flip a coin" or "ask an expert") without optimizing the choice itself.
  *Falsification:* O is wrong if agents spend negligible time on procedure selection even when stakes are high. S is wrong if agents consistently optimize the procedure selection process itself under pressure.

  ## 5. Verbal or real

  Some disputes are verbal: Camp O calls aspiration levels "shadow prices," while Camp S calls them "feedback anchors." If this is merely labeling, we can translate between them. However, the dispute is real if the mechanisms differ. If Camp O requires an ex ante calculation that the agent cannot perform, and Camp S relies on online adjustment, the models make different predictions about reaction to novelty. We agree that if a model requires computations the agent cannot execute, it is a model of the observer, not the agent. That distinction is substantive, not semantic.
