answer: |-
  The "Pyrrhus pivot" is exactly the conceptual maneuver you suspect, wherein Montaigne severs the customary label of "barbarian" from the substantive quality of "barbarism" to argue that we must judge by reason rather than vulgar opinion, thereby allowing the charge of barbarism to rebound upon Europeans.

  Your friend's lexical history reading is too shallow because Montaigne's concluding sentence explicitly frames the anecdote as an epistemological warning ("how cautious men ought to be of taking things upon trust from vulgar opinion") rather than a philological note. If Montaigne were only interested in the Greek usage of *barbaros*, he would not need to conclude that we must judge by the "eye of reason"; the point is not that the word *means* something else, but that the *application* of the word by "common report" obscures the reality of the thing itself. Your reading captures the critical gap Montaigne exploits: Pyrrhus acknowledges the label ("what kind of barbarians these may be") but denies the quality ("has nothing of barbarism in it"), proving that the name is contingent on the speaker's perspective while the quality is observable in the "order and distribution" of the army. This establishes the methodological rule for the rest of the essay: do not accept the European label for the Tupinambá; look at their actions with the eye of reason.

  This opener sets up the cannibalism argument by establishing the criterion for what counts as barbarism before Montaigne ever mentions Brazil. By defining barbarism implicitly as a defect of reason or order (which the Romans lacked despite the label), Montaigne prepares the reader to accept that ritual cannibalism (which has its own order and reason) might be less "barbarous" than European torture (which is disorderly cruelty). Montaigne is not a radical relativist who believes barbarism is purely custom-relative; rather, he argues that barbarism is a mind-independent vice (cruelty, betrayal, irrational violence) that Europeans mistakenly attribute to others due to cultural bias. The Pyrrhus anecdote validates the possibility that the labelers (Greeks/Europeans) might possess the vice more than the labeled (Romans/Tupinambá), because the label is based on "common report" (custom) while the vice is based on "reason" (moral reality). When Montaigne later details European executions ("burning, mutilating, burying people alive"), he is applying the "eye of reason" established in paragraph one to show that Europeans fail the test of civilization they impose on others.

  Your "Pyrrhus pivot" reading sits at the "obviously right" end of the spectrum because it aligns perfectly with Montaigne's skeptical methodology and the essay's explicit moral. The strongest textual evidence is the final sentence of the paragraph: "we are to judge by the eye of reason, and not from common report." This instruction tells the reader to ignore the "vulgar opinion" (the label *barbarian*) and inspect the substance (the *barbarism*), which is precisely the pivot you identified. The only evidence against your reading is the parenthetical "(for so the Greeks called all other nations)," which supports your friend's lexical point, but Montaigne includes that only to show why the label is unreliable, not to make it the main point. Ultimately, the anecdote functions as the key to the essay's structure: it authorizes Montaigne to take the insult "barbarian" away from the New World natives and apply it to the Old World conquerors based on empirical evidence of cruelty rather than linguistic convention.
