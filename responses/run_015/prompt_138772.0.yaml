answer: |-
  The containment field hummed, a sound felt in the teeth rather than heard. Inside the vacuum chamber, the Hole waited—a sphere of perfect nothingness, three meters across, stripped of matter, radiation, even neutrino noise. It was a blank patch on the manifold, ready for the Slide.

  Kael held the etcher against the glass. It looked like a simple laser pointer, but it was tuned to Planck-scale resonances. He was trembling.

  "Don't," Elara said. She didn't look up from the console. Her fingers flew over the haptic interfaces, monitoring the metric tensor values bleeding off the Hole's boundary. "Wait for the data."

  "The data won't tell me which point he died on," Kael said. His voice was flat, exhausted. "The telemetry says Jules was here. Inside the Hole. But 'here' is just a coordinate label, Elara. You taught me that. If the points don't have names, I'm engraving a ghost."

  "If the points have names independently of the fields, then God plays dice with every vacuum region in the universe," Elara shot back. She finally turned. Her eyes were red-rimmed. "You want substantivalism to be true so badly you're willing to break determinism?"

  "I want to know where I lost him."

  Kael pressed the etcher to the glass. He wasn't marking the chamber; he was trying to mark the *space* inside it, using the Weft nodes as a grid. The Weft was the hope—a theoretical lattice of non-dynamical nodes threaded through spacetime. If it existed, it didn't move when the metric slid. It was the absolute anchor. If the Weft was real, Kael could say: *Jules died at Node 449-B.* If it wasn't, Jules died at a point that was physically indistinguishable from the point one Planck length to the left.

  "Pull back," Elara warned. "We initiate the Slide in thirty seconds. If the Weft is dynamical, it gets dragged with the metric. If it's non-dynamical, it stays put. You know the stakes."

  "I know the argument," Kael said. He kept the etcher steady. "Take the Hole. Take a diffeomorphism that's the identity outside, but shuffles the points inside. Apply it to the solution. You get a second solution. Same initial data. Same boundary conditions. Different curvature values at the *same points* inside."

  "Exactly," Elara said. She stood up and walked over to him, placing her hand over his on the etcher. Her palm was cold. "If the points are real things—substantivalism—then those two solutions are physically distinct. The universe could have evolved one way, and instead evolved another, with no cause. Indeterminism. Everywhere. All the time."

  "And if the points aren't real?"

  "Then the two solutions are the same physical situation described twice. Gauge redundancy. Leibniz equivalence." She squeezed his hand. "But then there is no 'Node 449-B'. There is only the relationship between the fields. When Jules died, the fields were there. Now they're gone. The point is gone with them."

  "So I can't mark it."

  "You can mark the glass," Elara said softly. "But you can't mark the spacetime."

  Kael pulled his hand away. "Run the Slide."

  Elara turned back to the console. "Initiating active diffeomorphism. Smoothing function active on the boundary. Identity outside the Hole. Non-trivial inside."

  The hum deepened. Inside the chamber, nothing visible changed. That was the trick of the Hole Argument. No rod, no clock, no detector inside the Hole could tell the difference. If you slide the metric, you slide the rods and clocks too. They still measure the same proper time along the same worldlines. The physics is invariant. Unless there was something that *didn't* slide.

  "The Weft sensors are live," Elara said. "Watching for shear."

  "If the Weft shears," Kael said, staring into the vacuum, "it's a field. It's dynamical."

  "Then the Hole Argument applies to the Metric-plus-Weft system," Elara recited. "You gain nothing. You just push the indeterminism up one level."

  "And if it doesn't shear?"

  "Then it's absolute space," Elara said. "Newton's ghost in a Planck-scale suit. General Relativity was supposed to kill absolute space. You want to bring it back to save your grief?"

  "I want to bring it back to save the truth."

  "Data streaming," Elara said. Her voice tightened. "Metric curvature is shifting inside the Hole. As predicted. The diffeomorphism is holding."

  "And the Weft?"

  Elara didn't answer immediately. The silence stretched, filled only by the cooling fans of the server stack. Kael watched the readout. A graph plotted the displacement of the Weft nodes relative to the metric flow.

  If the line stayed flat, the Weft was fixed. Substantivalism wins. Determinism is dead, but the points are real. Kael could engrave the node number.
  If the line followed the metric, the Weft was dynamical. Relationism wins. Determinism is safe, but the points are nothing but intersections of fields.

  "The line is moving," Elara whispered.

  Kael leaned in. "Moving with the metric?"

  "Yes."

  Kael let out a breath he didn't know he was holding. It sounded like a sob. "So it's dynamical."

  "It's dynamical," Elara confirmed. She turned to face him, her expression unreadable. "The Weft gets dragged. The Hole Argument holds. There is no fixed background. There is no absolute 'here'."

  Kael looked at the etcher in his hand. "Then Node 449-B doesn't exist."

  "The node exists relative to the field configuration," Elara said. "But the field configuration has changed. The Slide moved the curvature bump. The Weft moved with it. There is no invariant fact about which point Jules occupied."

  "So I'm grieving a nothing."

  "You're grieving a person," Elara said sharply. "The person existed. The relationships existed. Don't confuse the map for the territory."

  "The points *are* the territory!" Kael slammed the etcher down on the console. "If the points don't have identity, then the universe doesn't know where anything is. It only knows how things touch. Jules wasn't just 'touching' space. He was *there*."

  "He was where the matter was," Elara said. "And now the matter is gone. The hole is vacuum. In a vacuum, without a fixed background, the points have no individuation. You can't distinguish this point from that point except by what happens there. Nothing is happening there."

  Kael stared into the Hole. It was just darkness. "So if I put the plaque there..."

  "It denotes a region," Elara said. "Not a point. A fuzzy cloud of relations. It's not the anchor you want."

  Kael picked up the etcher again. He looked at the glass, then at the vacuum. The data on the screen was definitive. The Weft was a field, not a foundation. The hope of saving determinism by smuggling in absolute space was dead. The hope of finding a unique coordinate for his husband's death was dead.

  He activated the etcher.

  "Kael," Elara warned. "It's a lie."

  "I know," Kael said.

  He pressed the tip to the glass, aligning it with the center of the Hole. He wasn't marking a point. He was marking a decision. He was choosing to act *as if* substantivalism were true, even though the universe had just proven it false. He was choosing to believe in the anchor, despite the drift.

  The laser burned a single coordinate into the reinforced silica. *Jules. Here.*

  "It's not here," Elara said. Her voice was gentle now. "It's everywhere the fields allow it to be."

  "Then I'll mourn everywhere," Kael said. He turned off the etcher. The hum of the containment field began to wind down. The Slide was complete. The metric had shifted. The Weft had followed. The universe remained generally covariant, indifferent to the need for fixed locations.

  Kael placed his hand on the glass, over the mark. He felt the cold vibration of the machine. He knew the physics was right. He knew Elara was right. The Hole Argument stood unrefuted; the indeterminism was merely gauge, not ontology. But the grief required a substrate. It required a place.

  "Delete the data," Kael said.

  Elara froze. "What?"

  "The log. The Weft displacement. Prove it moved, and you prove the point is lost." Kael looked at her. "If we keep the data, we know for sure. If we delete it... we can pretend the Weft might have held."

  "That's anti-science," Elara said. "That's denial."

  "That's survival," Kael said. "You wanted a relationist universe. You got it. Congratulations. Now let me have my ghost."

  Elara looked at the screen, then at Kael's hand on the glass. She saw the tremor in his fingers. She saw the plaque that denoted nothing. She reached out and hovered her finger over the delete key.

  The universe didn't care. The manifold was smooth, featureless, and indifferent to whether they remembered where the curvature had been.

  "If I delete it," Elara said, "we can never run the Slide again. The funding won't cover a second run."

  "Do it."

  Elara pressed the key. The graph vanished. The screen went dark, reflecting only their faces superimposed over the vacuum chamber.

  "There," she said. "Now it's indeterminate."

  Kael nodded. He left his hand on the glass. He didn't know if Jules was behind the glass. He didn't know if 'behind' meant anything. But the glass was cold, and his hand was warm, and for now, that difference was enough to define a location.

  ***

  **Post-story note:**
  Your premise is technically "cheating" the Hole Argument by positing an empirically detectable structure (the Weft) that breaks general covariance; in standard GR, the argument is interpretive because the models are empirically equivalent. However, as a sci-fi dramatization of the metaphysical stakes (absolute space vs. indeterminism), it holds up well enough for a reading group.
