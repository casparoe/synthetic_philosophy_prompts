answer: |-
  Marta: It's not expected utility because I'm not summing the rashes. I'm comparing the expected burden on any single person under Principle A versus Principle B. Under the "save the finger" principle, every single person faces a tiny risk of a rash over a lifetime. Under the "save the rashes" principle, every single person faces a tiny risk of losing a finger. You don't need to add up the rashes to see that the second principle imposes a heavier expected burden on each individual. That's still individualist reasoning.

  Me: But the output is the same. You've just moved the aggregation from the outcome to the probability distribution. And you're still dodging the ex post reality. The person who actually loses the finger doesn't care about the ex ante principle. They have a complaint that is objectively heavier than any single rash-complaint. You're telling me their actual suffering is outweighed by a bunch of hypothetical risks that never materialized for anyone else.

  Marta: I'm telling you that reasonable rejection is about what you can demand from others before the fact. If you know that over a lifetime, avoiding finger-loss for others means you'll definitely endure a week of rashes, you can't reasonably reject that. But if avoiding rashes means you might lose a finger, you can. The numbers enter because they affect the probability any one person faces, not because we sum pain.

  Me: Okay, but take the one-shot case. No lifetime of risks. We know exactly who the two million are, and we know exactly who the one is. There is no veil, no recurrence, no probability. Just a choice. Your repeat-play move has no grip there. You can't say "over a lifetime" because this is the only time this happens. Do you really say we let the two million itch to save the one finger?

  Marta: In the fully identifiable one-shot case, contractualism does bite that bullet. But most moral principles aren't for one-shot cases. They're general rules we live by. If you force me to treat every emergency as unique and identifiable, you destroy the possibility of principled agreement. We agree on rules for situations where we don't know who will be where.

  Me: That's the veil of ignorance again. And now we hit the individuation problem. How do you define "situations of the same kind"? If I bundle all minor inconveniences across a society into one "situation," I can always outweigh a major harm. If I bundle them narrowly, I get back to the finger winning. Where do you draw the line without just smuggling in utilitarianism to decide the bundling?

  Marta: You draw it at natural kinds of interaction. Traffic laws, medical triage protocols, property rights. You don't get to arbitrarily aggregate unrelated events. But within a natural kind, yes, the frequency matters. If a policy causes a million minor headaches to save one life, the probability that any one person gets the headache is high enough that the expected burden might outweigh the low probability of being the one who dies.

  Me: But then test this: what if the two million are already much better off than the one? Or what if the harm is trivial enough that no single person would bother complaining about it? Like, not a rash, but a thirty-second delay. Under your ex ante view, if the delay happens often enough, the expected burden adds up. But intuitively, if the harm is trivial enough, it shouldn't count against a finger, even if there are billions of them. Your view seems to say eventually the delays win.

  Marta: If the harm is truly trivial, the complaint strength is near zero. Multiplying near zero by probability doesn't necessarily outweigh a finger. But if it's a rash, it's not trivial. It's a genuine burden. And yes, if there are enough of them, the ex ante risk becomes significant. I'd rather take the risk of the rash than the risk of the finger.

  Me: I'm willing to concede something here. My intuition that adding zeros shouldn't change the moral shape... actually, when I think about the lifetime risk, it does feel different. If I knew I'd face this choice every day, I'd want the rule that saves me from the finger, even if I get rashes often. So maybe your move isn't just evasion. It captures something about stability.

  Marta: And I'll concede this: the ex ante view doesn't erase the ex post tragedy. The person who loses the finger does have a grievance that the theory can't fully answer. We can say the principle was justified, but we can't tell them their loss doesn't matter. Contractualism justifies the rule to the community, not the outcome to the victim.

  Me: But that's a huge gap. If the theory can't speak to the victim, what good is it? It feels like you're saying "you lost the lottery fairly" while they bleed.

  Marta: It's not a lottery. It's a fair system of cooperation. But yes, it costs us something to accept that justification isn't consolation. If I claim contractualism solves everything ex post, I'm lying. It solves the question of what we owe each other, not how to feel about bad luck.

  Me: And if I claim aggregation is non-negotiable, I have to accept that one person can be sacrificed whenever the numbers get big enough. Even if the harm is trivial. Even if it's unjust. That's the utilitarianism I was trying to avoid.

  Marta: So we're stuck. You think my view collapses into expected utility when the numbers get big enough. I think your view collapses into tyranny of the single victim when the numbers get small enough.

  Me: Basically. But I'll take the tyranny of the victim over the calculus of delays. At least I know where I stand.

  Marta: And I'll take the calculus over the tyranny. At least everyone has a chance. But I admit, when I look at the guy with the missing finger, the "chance" doesn't look like much.

  Me: No. It doesn't.

  Marta: So we agree the case isn't closed.

  Me: We agree the case isn't closed. But I'm still buying the next coffee.

  Marta: Deal. But I'm not letting you pick the principle for who pays.
