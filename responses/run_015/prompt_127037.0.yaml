prompt: |-
  so i just spent like two hours arguing with my friend Marta about Scanlon-style contractualism and i definately lost the last stretch of it, but i can't tell whether she actually had an argument or just pulled a fast one.

  the case we were stuck on: we can either let one person loose a finger, or let two million people each have an itchy rash for an afternoon. Contractualism compares how strong the strongest individual complaint is under each option, so sparing the finger wins — and it keeps winning when you add zeros. a billion rashes, a trillion, doesn't matter. i was on the aggregating side and i kept saying that this is just a reductio of the whole framework, and she kept saying no, it's a feature.

  then she made a move i'd never heard and i couldn't answer it on the spot. she said contractualism judges principles, not one-off acts, so the right question is what a principle does to a given person across a lifetime of situations of that kind. suppose K such emergencies arise over a life, in a population of N, and on each occasion the "save the finger" option spreads a mild harm across m people. under always-spare-the-finger you can expect roughly K·(m/N) rashes; under always-spare-the-rashes you can expect roughly K/N lost fingers. let N get big and the second term collapses while the first doesn't. so numbers come back in — and in proportion to how many people are affected — without anybody summing complaints across persons.

  i said that's utilitarianism wearing a veil, and that the person who actually loses the finger gets no consolation from having had a 1-in-N shot at it. she said something about reasonable rejection already being an ex ante notion and i lost the thread completely.

  can you write the rest of that argument as a dialogue between the two of us, picking up right there, mid-fight? conditions:

  - both of us are sharp and neither gets to be a strawman. Marta really thinks the repeat-play move rescues the framework; i really think aggregating is non-negotiable and intuitions about cases aren't enough to settle it.
  - skip re-explaining contractualism. we've been at it for two hours; we share the vocabulary (complaint, reasonable rejection, principle, individualist reasons) and we're past the definitions stage.
  - Marta has to actually deal with: (a) the "that's just expected-utility aggregation in disguise, so what was distinctive about contractualism?" charge; (b) the gap between ex ante expectation and the ex post complaint of whoever actually gets the bad outcome; (c) the one-shot version — no recurrence, we know exactly who loses the finger, the two million are identifiable — where her move seems to have no grip at all; (d) what counts as "situations of the same kind," i.e. which sequence you're allowed to pool over, and whether any non-arbitrary answer avoids collapsing into full ex ante utilitarianism.
  - i have to actually deal with her counter-challenge: if repeat-play is illegitimate, what non-utilitarian route is there to making numbers count at all? and i have to concede something real — e.g. that adding zeros really doesn't seem to change the moral shape of the case the way my side says it should, or that the move is at least responsive rather than evasive.
  - have them test one variation: does anything change if the two million are already much better off than the one, or if the mild harm is trivial enough that no single person would bother complaining about it?
  - end without resolving it. each of us should give up one thing that actually costs us something.
  - dialogue only, no narration or stage directions, maybe 800-1200 words. no citations, no reading lists, no "see so-and-so 1998" — we're not looking anything up.
