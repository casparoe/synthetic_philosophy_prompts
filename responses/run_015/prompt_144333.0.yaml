answer: |-
  ### The Honest Answer: A Taxonomy, Not a Theory

  The honest answer is that "convention" is a folk term that must be split before any desiderata are stated. Your test cases describe three ontologically distinct mechanisms: coordination equilibria (Lewis), normative expectations (Bicchieri), and structural artifacts (external constraints). A unitary theory cannot distinguish a funder's requirement from a peer sanction without losing the leverage you need. Therefore, I propose the following taxonomy as the prerequisite for your deliberations. Your committee is not dealing with one kind of thing, but three:

  1.  **Coordination Conventions:** Practices stable because everyone expects everyone else to do them, and deviation yields no payoff (e.g., panel order, double-blind format). *Lever:* Salience and focal points.
  2.  **Social Norms:** Practices stable because individuals prefer to conform conditional on believing others conform and approve (e.g., unpaid refereeing, citation etiquette). *Lever:* Changing empirical or normative expectations.
  3.  **Structural Artifacts:** Practices stable solely due to external constraints (e.g., funder reporting). *Lever:* Policy repeal.

  The desiderata below are not for a theory of "convention," but for a **Diagnostic Framework** that correctly sorts your practices into these three bins and assigns the corresponding lever.

  ### Desiderata for a Reform-Oriented Diagnostic Framework

  **1. Intervention Mapping**
  *   **Requirement:** The classification of a practice must map directly to a specific, available instrument (e.g., if "Norm," change expectations; if "Artifact," repeal rule). A diagnosis that does not suggest a lever is insufficient.
  *   **Case:** You need to know whether a public announcement will shift a practice (works on Norms/Conventions) or do nothing (Artifacts).
  *   **Status:** **Non-negotiable.**
  *   **Confidence:** High.
  *   **Defeater:** If a practice is shown to be overdetermined (held by both norms and constraints simultaneously), rendering a single lever ineffective. In that case, the requirement would shift to "Identify the primary constraint."
  *   **Bias Warning:** This privileges the reformer's perspective over the participant's. It assumes the practice *should* be moved, which may obscure why the practice is valued by members.

  **2. Locus of Constraint**
  *   **Requirement:** The framework must distinguish between constraints internal to the group (peer approval, coordination) and external to the group (funders, law, infrastructure).
  *   **Case:** Test Case 2 (Funder requirement). If the framework classifies this as a convention, you will waste effort trying to change peer expectations when you should be lobbying the funder.
  *   **Status:** **Non-negotiable.**
  *   **Confidence:** High.
  *   **Defeater:** If external constraints are shown to be internalized by members such that they persist after the constraint is removed (hysteresis). Then the locus becomes historical, not current.
  *   **Bias Warning:** This assumes a clear boundary between the society and its environment, which may be porous in practice (e.g., funders are often senior members).

  **3. Epistemic Transparency**
  *   **Requirement:** The framework must function without private survey data. It must rely on observable public signals (minutes, published rules, observable compliance) to infer private beliefs.
  *   **Case:** Your constraint "without survey data." Test Case 1 (Pluralistic Ignorance) turns on the gap between private belief and public behavior.
  *   **Status:** **Non-negotiable.**
  *   **Confidence:** Medium.
  *   **Defeater:** If a practice is sustained entirely by tacit knowledge that leaves no public trace (Test Case 3). If the framework cannot detect tacit norms without interviews, it fails here.
  *   **Bias Warning:** This favors explicit, codifiable practices over embodied or tacit ones. It assumes the "committee record" is a sufficient proxy for social reality.

  **4. Dynamic Sensitivity**
  *   **Requirement:** The framework must account for both stability (Test Case 4) and sudden collapse (Test Case 5) without requiring a change in underlying parameters.
  *   **Case:** You need to know if a practice is robust or fragile before pushing it. A theory that only explains equilibrium cannot predict the collapse.
  *   **Status:** **Prejudice (Dynamic Camp).**
  *   **Confidence:** Medium.
  *   **Defeater:** If it turns out that all "sudden collapses" are actually the result of unobserved parameter drift (slow change in convictions). Then a static equilibrium model suffices.
  *   **Bias Warning:** This favors models that allow for tipping points, potentially overestimating the fragility of practices that are actually robust.

  **5. Population Invariance**
  *   **Requirement:** The framework must explain how a practice survives turnover (Test Case 3). It cannot rely on the specific identities of the agents, only on the structure of their roles.
  *   **Case:** Junior members replace senior members, but the panel order remains. The explanation must lie in the role, not the person.
  *   **Status:** **Non-negotiable.**
  *   **Confidence:** High.
  *   **Defeater:** If the practice is actually sustained by a specific clique or network structure that does not turnover. Then the "population" is not the whole society, but a subset.
  *   **Bias Warning:** This assumes the society is a homogeneous population, ignoring factionalism or network clusters.

  ### Incompatibilities and Tensions

  You suspected that explaining stability and explaining endogenous change are met by theories of incompatible shapes. You are correct. **Desideratum 4 (Dynamic Sensitivity)** is in tension with **Desideratum 3 (Epistemic Transparency)**.

  Dynamic models (like Skyrms') that explain sudden collapse usually rely on unobservable parameters (propensities, learning rates) or historical paths that an insider committee cannot see without survey data. Static models (like Lewis') are observable (look for equilibria) but cannot explain the collapse.

  **Which should give way?** Given your purpose (reform *in advance* of acting), **Desideratum 4 must be relaxed.** You cannot reliably predict a tipping point from the inside without data. You should drop the demand to *predict* collapse and replace it with a demand to *identify fragility markers* (e.g., compliance driven by fear rather than preference).

  **The Resolution:** This tension is why the Taxonomy above is necessary.
  *   Use **Lewis** for Coordination Conventions (Stable, Observable).
  *   Use **Bicchieri** for Social Norms (Fragile to expectation shifts).
  *   Use **Policy Analysis** for Artifacts (Stable until repealed).
  Trying to force one theory to cover all three creates the tension. Splitting the concept resolves it.

  ### The Most Exclusionary Requirement

  **Desideratum 1 (Intervention Mapping)** excludes the most candidates.
  Most philosophical theories of convention are descriptive; they aim to tell you what a convention *is*, not how to *break* it. Lewis's account, for instance, defines convention via equilibrium conditions but offers no manual for shifting from one equilibrium to another. Bicchieri's is closer but still focuses on diagnosis. A theory that classifies correctly but tells you nothing about levers is, as you said, only half a theory. For your purpose, this is a **Genuine Requirement**. A classification that does not guide action is academic decoration.

  ### Evaluation of Existing Accounts

  **Lewisian Coordination Account:**
  This account scores highly on **Locus of Constraint** and **Population Invariance**. It cleanly separates coordination problems from moral norms. However, it fails **Intervention Mapping** for norms; it cannot explain why unpaid refereeing persists if it is inefficient (Test Case 4), as Lewisian conventions are typically efficiency-enhancing solutions to coordination problems. It also struggles with **Dynamic Sensitivity**; it describes the equilibrium, not the path to breaking it. It is excellent for your "panel order" example, but useless for "citation etiquette."

  **Evolutionary/Dynamic Accounts (Skyrms-style):**
  This approach excels at **Dynamic Sensitivity** and **Population Invariance**. It explains how inefficient practices can stabilize (Test Case 4) and how they can collapse (Test Case 5) through signaling dynamics and basin of attraction sizes. However, it fails **Epistemic Transparency**. The "learning rates" and "propensities" required to model the dynamics are not observable to a committee without longitudinal data or surveys. It tells you *why* a practice is stable historically, but not *what* to do on Tuesday to change it.

  **Normative-Expectations Accounts (Bicchieri-style):**
  This is the strongest candidate for **Intervention Mapping**. It distinguishes between descriptive expectations (what others do) and normative expectations (what others approve), which directly maps to levers (public announcement vs. sanctioning). It handles **Pluralistic Ignorance** (Test Case 1) perfectly. However, it risks failing **Locus of Constraint** if it treats all regularities as norm-driven, potentially misclassifying Structural Artifacts (Test Case 2) as social norms, leading you to campaign against a funder rule as if it were a peer expectation.

  ### Confidence and Modeling Bias

  I mark my confidence in **Desideratum 1 (Intervention Mapping)** as **High**. It is derived directly from your stated purpose. I would drop it only if you revealed that the committee's goal was archival record-keeping rather than reform.

  I mark my confidence in **Desideratum 3 (Epistemic Transparency)** as **Medium**. I suspect this is where the list is most shaped by **what is easy to model rather than the phenomenon itself**. Formal models prefer observable variables. Real social life is steeped in tacit knowledge, hallway conversations, and implicit status hierarchies that do not appear in minutes. If your "unpublished citation" norm (Test Case 3) is enforced by a specific network of senior scholars rather than a general expectation, my framework may misdiagnose it as a general norm. I would drop this requirement if you gained access to confidential exit interviews from departing members, which would violate the "no survey data" constraint but vastly improve diagnostic accuracy.

  The list is biased toward **rational-choice mechanisms** (expectations, payoffs, constraints). It may underweight **affective or identity-based mechanisms** (e.g., "we don't do that because it's not who we are"). If a practice is held by identity rather than expectation, changing expectations (Bicchieri's lever) will fail. If you find that members react to proposed changes with moral disgust rather than strategic recalculation, you will need to add a desideratum for **Identity Compatibility**.
