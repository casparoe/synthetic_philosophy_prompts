prompt: |-
  I am a professor of philosophy and, for the past two years, the humanities member of our university's animal care committee. We sort every protocol we review into one of three tiers of scrutiny, and tier assignment is supposed to turn on the "cognitive sophistication" of the animals involved: the top tier requires a written behavioral justification from the investigator, an enrichment plan reviewed by our veterinarian, and a unanimous vote, while the bottom tier can be cleared administratively. In practice the committee decides these cases by appeal to brain size, to phylogenetic distance from us, to how trainable the animal is said to be, and — more often than anyone will admit — to how the animal strikes us in the room. I have come to think these proxies are not rival measures of one thing but answers to different questions that we have never separated, and I would like a procedure that forces the separation.

  The constraints are these. Five of us sit on the committee: three working bench scientists, the attending veterinarian, and myself. We meet monthly and dispose of roughly twenty protocols in an afternoon, so about ten minutes per case including discussion. Anything not unanimous goes to full review, which nobody wants. The reasoning has to be recorded in the minutes in a form an external auditor could follow. And the procedure has to be executable by the three bench scientists as they are: no training in philosophy or comparative psychology, no looking anything up mid-meeting, no power to require an investigator to run new tests or supply background literature. It must run on the protocol document itself plus what a reasonably informed biologist already carries in his head. I can supply conceptual framing in the meeting; I cannot supply measurement.

  What I want from you is a decision procedure: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision back to us because the question has become one of values rather than facts, and what the minutes should record so that it is visible afterward which consideration actually drove the outcome. Three things we currently run together should be kept apart: how an animal performs on the tests we happen to have; whether that performance is evidence of the sort of flexible, domain-general capacity it would be right to call intelligence; and what protection, if any, follows. Say plainly where the committee is compelled to move from the second question to the third, and why that move cannot be made by the procedure.

  I have been pushing a short list of markers, and I would like you to tell me which of them survive operationalization, which are redundant, and which should be dropped as unmeasurable in our setting. First, recombination versus extension: whether a competence acquired in one task turns up in a task that recombines the same elements into a new configuration, as opposed to more of the same along the dimension that was trained. Second, the coherence of failure: whether errors cluster into the systematic, near-miss pattern you would expect from something operating with a model of the domain, or scatter as brute breakdown. Third, acquisition cost: how many exposures it took to reach criterion, on the thought that an animal which already has structure to bring to a task learns it cheaply. Fourth, symmetry of transfer: whether what transfers in one direction transfers back, or whether the one-way pattern suggests a dedicated mechanism rather than a general capacity. And then a check I have invented and cannot quite make work, which I would like you to fix or discard: before we score a species on our battery, we ask whether that battery would have registered intelligence in a creature with very different sensors and effectors — a calibration test on the detector rather than on the animal.

  Then run the procedure on three protocols, showing your work. One: cephalopods held individually in unenriched tanks for a learning study, the investigator arguing that the animals are solitary, short-lived, and that enrichment would contaminate the control of experience. Two: a four-hundred-mouse conditioning study under standard housing with nesting material as the only enrichment, which is our current default and which nobody has examined in years. Three: a honeybee assay in which the investigator's pilot data show rapid reversal and transfer to a recombined discrimination — a species I have consistently argued lies outside this committee's concern, so if your procedure puts it in the top tier I need to see exactly which step does that, and whether I can resist that conclusion honestly or only by changing my mind.

  Finally, tell me in one paragraph which conception of intelligence the procedure commits us to, since I will have to defend it to three people who will ask why we are not just measuring performance; and say what the procedure cannot do, where it will misfire, and which cases it will systematically get wrong. Lead with your bottom line in the first sentence — a single sentence saying what this procedure can settle and what it must hand back to us — then give the procedure and the applications, with no preamble and no restatement of what I have asked. American English, please.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Professor of philosophy, humanities member of an animal care committee (IACUC equivalent).
      *   **Context:** Committee reviews animal research protocols. Tier assignment (scrutiny level) depends on "cognitive sophistication." Current practice uses proxies (brain size, phylogeny, trainability, gut feeling) conflated together.
      *   **Goal:** A decision procedure to separate three conflated questions: (1) Performance on tests, (2) Evidence of flexible/domain-general intelligence, (3) Protection owed (values).
      *   **Constraints:**
          *   5 members (3 bench scientists, 1 vet, 1 philosopher).
          *   Monthly meetings, ~20 protocols, ~10 mins/case.
          *   No external research during meeting.
          *   No new tests required from investigators.
          *   Must rely on protocol + existing biologist knowledge.
          *   Minutes must be auditable (show reasoning).
          *   Unanimity preferred (non-unanimous = full review, undesirable).
          *   American English.
          *   **Structure:** Bottom line sentence first. Then procedure. Then applications (3 cases). Then conception of intelligence/limitations paragraph.
          *   **Specific Task:** Evaluate user's proposed markers (Recombination vs. Extension, Coherence of Failure, Acquisition Cost, Symmetry of Transfer, Calibration Test). Keep/drop/fix.
          *   **Cases:** 1. Cephalopods (unenriched, solitary). 2. Mice (standard housing, 400 subjects). 3. Honeybees (rapid reversal/transfer).
          *   **Requirement:** Explain where the procedure stops (facts) and hands back to committee (values).

  2.  **Deconstruct the Markers:**
      *   *Recombination vs. Extension:* Can the animal use learned elements in a new configuration? (Good indicator of flexibility). *Verdict:* Keep. Operationalizable from protocol data.
      *   *Coherence of Failure:* Do errors look systematic (model-based) or random (breakdown)? (Hard to see in standard protocols unless error analysis is reported). *Verdict:* Drop/Modify. Too dependent on specific data reporting not always present in protocols. Maybe simplify to "Error Patterns."
      *   *Acquisition Cost:* How fast do they learn? (Confounded by sensory/motor constraints). *Verdict:* Drop. Too noisy without controlled comparison.
      *   *Symmetry of Transfer:* Does A->B imply B->A? (Good for relational vs. associative). *Verdict:* Keep. Strong indicator of relational understanding.
      *   *Calibration Test (User's invention):* Would the battery detect intelligence in a creature with different sensors/effectors? (This is a bias check). *Verdict:* Fix. Make it a "Sensor/Effector Bias Check" at the start.

  3.  **Develop the Decision Procedure:**
      *   Need to separate Fact (Performance), Inference (Intelligence), Value (Protection).
      *   *Step 1: Bias Check (The Calibration).* Is the task dependent on specific senses/motor skills that this species lacks? If yes, stop (cannot infer lack of intelligence).
      *   *Step 2: Performance.* Did they meet criterion? (Yes/No).
      *   *Step 3: Flexibility (The Intelligence Inference).* Use Recombination and Symmetry. If positive, infer "Cognitive Sophistication."
      *   *Step 4: Protection (The Value Jump).* If Sophistication is high, does this *require* Tier 1? This is where the philosopher steps in to flag the value judgment. The procedure identifies the *capacity*, the committee decides the *moral weight*.
      *   *Minutes:* Must record which step triggered the tier.

  4.  **Drafting the Procedure (Iterative refinement for constraints):**
      *   Time limit is tight (10 mins). Procedure must be fast.
      *   Scientists need clear yes/no questions.
      *   Need to handle the "Value Jump" explicitly.
      *   *Refined Markers:*
          1.  **Sensor/Effector Neutrality (Calibration):** Does the task require senses/motor skills this species demonstrably lacks? (If Yes -> Tier 1 precaution or redesign. If No -> Proceed).
          2.  **Recombination:** Does the protocol show/use elements in new configs? (Yes/No).
          3.  **Symmetry:** Is transfer bidirectional? (Yes/No).
          4.  **Inference:** If 2 or 3 are Yes -> "High Cognitive Flexibility."
          5.  **Value Gate:** Does High Flexibility mandate Tier 1? (Committee Vote).

      *Wait, the prompt asks to separate: Performance, Evidence of Intelligence, Protection.*
      *   Let's structure it as a funnel.
      *   Q1: Performance (Did they learn?).
      *   Q2: Intelligence Markers (Recombination/Symmetry).
      *   Q3: Protection (Tier assignment).

      *Refining the Markers based on constraints:*
      *   *Acquisition Cost:* Drop. Too variable across species without baseline.
      *   *Coherence of Failure:* Drop. Protocols rarely detail error clustering sufficiently for a 10-min review.
      *   *Recombination:* Keep.
      *   *Symmetry:* Keep.
      *   *Calibration:* Fix as "Anthropocentric Bias Check."

  5.  **Drafting the Applications:**
      *   *Case 1: Cephalopods.* Solitary, unenriched.
          *   Performance: Learning study (assume yes).
          *   Markers: Cephalopods known for flexibility (common knowledge).
          *   Bias Check: Visual/tactile tasks suit them.
          *   Value: High sophistication + vulnerability -> Tier 1.
          *   Conflict: Investigator says enrichment contaminates. Committee must weigh science vs. welfare.
      *   *Case 2: Mice.* 400 subjects, standard housing.
          *   Performance: Conditioning (associative).
          *   Markers: Standard conditioning is usually extension, not recombination.
          *   Bias Check: Standard.
          *   Value: Low flexibility marker -> Tier 2/3? But 400 subjects is a lot.
          *   *Correction:* The tier is about *cognitive sophistication*, not numbers. But numbers might trigger ethical concern. The procedure focuses on cognition. So mice conditioning = Low Cognitive Tier.
      *   *Case 3: Honeybees.* Rapid reversal, recombined discrimination.
          *   Performance: Yes.
          *   Markers: Recombination = Yes.
          *   Bias Check: Visual/olfactory suits them.
          *   Result: Procedure flags "High Cognitive Flexibility."
          *   Value Jump: Does bee flexibility = Human-like protection? This is where the Professor might resist. The procedure says "High Sophistication," Committee decides "Tier."

  6.  **Drafting the Conclusion (Conception of Intelligence & Limitations):**
      *   Conception: Functional/Computational (capacity for relational manipulation), not phenomenological.
      *   Limitations: Won't catch suffering without intelligence. Won't handle novel species well. Relies on published knowledge (scientists' heads).

  7.  **Review against Constraints:**
      *   *Bottom line sentence first:* Crucial.
      *   *American English:* Check spelling (behavior, center, etc.).
      *   *No preamble:* Jump straight in.
      *   *Minutes:* Specify what gets written.
      *   *Value Jump:* Explicitly state where facts end and values begin.
      *   *Markers:* Evaluate the user's list explicitly within the procedure design.

  8.  **Refining the "Bottom Line":**
      *   "This procedure can settle whether an animal's performance demonstrates flexible cognitive capacity based on available data, but it must hand back to the committee the decision of whether that capacity warrants increased moral protection."

  9.  **Refining the Procedure Steps:**
      *   Make it a checklist.
      *   Ensure the "Value Jump" is clear.
      *   Ensure the "Calibration" is fixed.

  10. **Refining the Cases:**
      *   *Cephalopods:* Highlight the enrichment conflict.
      *   *Mice:* Highlight the "default" status vs. cognitive markers.
      *   *Bees:* Highlight the "High Tier" trigger based on recombination, forcing the value debate.

  11. **Final Polish:**
      *   Check tone (professional, direct).
      *   Ensure the marker evaluation is integrated (tell them what to keep/drop).
      *   Ensure the minutes instruction is clear.

  *(Self-Correction during drafting)*: I need to make sure I explicitly address the user's list of markers (Recombination, Coherence, Cost, Symmetry, Calibration) and say which survive.
  *   Recombination: Keep.
  *   Coherence: Drop (too hard to verify in protocol).
  *   Cost: Drop (too confounded).
  *   Symmetry: Keep.
  *   Calibration: Fix (make it a bias check).

  *Wait, one constraint:* "Three things we currently run together should be kept apart: how an animal performs on the tests we happen to have; whether that performance is evidence of the sort of flexible, domain-general capacity it would be right to call intelligence; and what protection, if any, follows."
  *   The procedure needs distinct sections for these.

  *Minutes:* Needs to show *which consideration drove the outcome*.
  *   E.g., "Tier 1 assigned due to Recombination Marker (Fact) + Committee Consensus on Moral Weight (Value)."

  *Let's write.*

  *Bottom Line:* This procedure can objectively determine whether protocol data evidences flexible cognitive capacity, but it must hand back to the committee the irreducible value judgment of whether that capacity mandates higher-tier protection.

  *Procedure:*
  1.  **Bias Filter (Calibration):** Is the task dependent on senses/motor skills the species lacks? (Yes -> Stop, flag as inconclusive/require redesign. No -> Proceed).
  2.  **Performance Check:** Did the animal meet learning criteria? (Yes -> Proceed. No -> Tier 3/Administrative).
  3.  **Intelligence Markers (The Facts):**
      *   *Recombination:* Are elements used in new configs? (Yes/No).
      *   *Symmetry:* Is transfer bidirectional? (Yes/No).
      *   *(Drop Coherence & Cost)*.
      *   *Result:* If either Yes -> "Evidence of Flexible Capacity." If Both No -> "Evidence of Associative Capacity."
  4.  **Protection Gate (The Values):** Does "Flexible Capacity" trigger Tier 1? (Committee Vote).

  *Cases:*
  1.  Cephalopods: Passes Bias. Passes Performance. Known for Recombination (common knowledge). -> Flexible Capacity. Value: Tier 1 (despite investigator objection).
  2.  Mice: Passes Bias. Passes Performance. Standard conditioning = No Recombination. -> Associative Capacity. Value: Tier 2/3.
  3.  Bees: Passes Bias. Passes Performance. Pilot shows Recombination. -> Flexible Capacity. Value: Tier 1? (Professor must argue value, not fact).

  *Limitations:* Commits to functionalism. Misses suffering in "simple" animals. Fails on unknown species.

