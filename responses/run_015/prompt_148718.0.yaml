answer: |-
  This procedure can objectively determine whether protocol data evidences flexible cognitive capacity, but it must hand back to the committee the irreducible value judgment of whether that capacity mandates higher-tier protection.

  ### The Decision Procedure

  **Step 1: Task-Species Compatibility (The Fixed Calibration)**
  *   **Question:** Does the task require sensory or motor capacities this species demonstrably lacks (e.g., color discrimination in a monochromatic species, manipulative tasks in a species without appendages)?
  *   **Source:** General biological knowledge of the committee members.
  *   **Stop Condition:** If **Yes**, the protocol cannot be evaluated for cognitive sophistication using this task. Flag for redesign or assign Tier 1 precautionarily due to measurement invalidity.
  *   **Minutes Record:** "Task validated for species sensory/motor profile" or "Task-species mismatch identified."

  **Step 2: Performance Verification**
  *   **Question:** Does the protocol report that the animals successfully reached the learning criterion?
  *   **Source:** Protocol document (Methods/Results).
  *   **Stop Condition:** If **No**, assign **Tier 3 (Administrative)**. Lack of performance precludes evidence of sophistication.
  *   **Minutes Record:** "Criterion met" or "Criterion not met."

  **Step 3: Cognitive Markers (The Fact of Intelligence)**
  *   **Question A (Recombination):** Does the protocol demonstrate the animal using learned elements in a novel configuration, rather than extending a trained sequence? (Keep this marker).
  *   **Question B (Symmetry):** Does the protocol demonstrate bidirectional transfer (if A implies B, does B imply A)? (Keep this marker).
  *   **Question C (Coherence of Failure):** Drop this marker. Protocols rarely report error clustering with sufficient detail for a ten-minute review, making it unverifiable without external data.
  *   **Question D (Acquisition Cost):** Drop this marker. Learning speed is too confounded by species-specific motor/sensory latencies to serve as a reliable proxy without controlled baselines we cannot generate here.
  *   **Scoring:** If **Yes** to A or B, record **"Evidence of Flexible Capacity."** If **No** to both, record **"Evidence of Associative Capacity."**
  *   **Minutes Record:** "Recombination observed," "Symmetry observed," or "Neither observed."

  **Step 4: Protection Gate (The Value Jump)**
  *   **Question:** Does "Evidence of Flexible Capacity" require Tier 1 scrutiny for this committee?
  *   **Source:** Committee consensus (Values).
  *   **Stop Condition:** This step cannot be resolved by procedure. It is a moral determination, not a factual one. If unanimous agreement is not reached, the protocol goes to Full Review.
  *   **Minutes Record:** "Tier assignment based on cognitive capacity classification" or "Tier assignment based on precautionary principle."

  ---

  ### Application to Protocols

  **Case 1: Cephalopods (Individual housing, learning study)**
  *   **Step 1 (Compatibility):** **Pass.** Cephalopods possess complex visual and tactile systems suited to standard learning mazes/tasks.
  *   **Step 2 (Performance):** **Pass.** Investigator reports successful learning.
  *   **Step 3 (Markers):** **Flexible Capacity.** While the protocol may not test recombination explicitly, it is established biological common knowledge (per committee constraint) that cephalopods exhibit recombination and tool use. The protocol does not refute this.
  *   **Step 4 (Protection):** **Value Conflict.** The facts establish Flexible Capacity. The investigator argues enrichment contaminates controls; the committee must decide if the animal's capacity outweighs the experimental design convenience.
  *   **Minutes:** "Task validated. Criterion met. Flexible Capacity inferred from species-typical competence. Tier 1 assigned via unanimous vote; enrichment plan required despite investigator objection."
  *   **Outcome:** Tier 1. The procedure forces the investigator to justify why controls outweigh welfare, rather than allowing the animal to be treated as a simple stimulus-response machine.

  **Case 2: Mice (400 subjects, standard conditioning)**
  *   **Step 1 (Compatibility):** **Pass.** Standard housing and conditioning suit murine sensory/motor profiles.
  *   **Step 2 (Performance):** **Pass.** Conditioning studies assume criterion is met.
  *   **Step 3 (Markers):** **Associative Capacity.** Standard conditioning is extension, not recombination. Transfer is rarely symmetric in simple conditioning. No evidence of flexible capacity in the protocol.
  *   **Step 4 (Protection):** **Value Consensus.** Low cognitive marker score aligns with current default.
  *   **Minutes:** "Task validated. Criterion met. Associative Capacity only. Tier 2 assigned per standard protocol for high-volume murine study."
  *   **Outcome:** Tier 2 (or current default). The procedure reveals that the default status is based on a lack of evidence for flexibility, not an active assessment of suffering. It does not lower protection, but it clarifies that the tier is not due to high cognitive sophistication.

  **Case 3: Honeybees (Rapid reversal, recombined discrimination)**
  *   **Step 1 (Compatibility):** **Pass.** Visual/olfactory discrimination suits bees.
  *   **Step 2 (Performance):** **Pass.** Pilot data shows rapid learning.
  *   **Step 3 (Markers):** **Flexible Capacity.** The protocol explicitly reports **Recombination** (transfer to recombined discrimination). This triggers the "Evidence of Flexible Capacity" flag regardless of phylogenetic distance.
  *   **Step 4 (Protection):** **Value Conflict.** The procedure compels you to acknowledge the bee's cognitive sophistication as factually equivalent to the cephalopod's in this context. If you resist Tier 1, you must argue that bee flexibility does not warrant the same moral weight as vertebrate flexibility.
  *   **Minutes:** "Task validated. Criterion met. Flexible Capacity confirmed via Recombination marker. Tier assignment debated: Majority voted Tier 2 based on phylogenetic valuation despite cognitive markers." (Or Tier 1 if unanimous).
  *   **Outcome:** If you vote Tier 2, the minutes will explicitly record that you overridden the cognitive fact with a value judgment. You cannot honestly claim the bee lacks the intelligence; you must admit you are discounting it.

  ---

  ### Conception and Limitations

  This procedure commits us to a functionalist conception of intelligence defined by computational flexibility—specifically the capacity to manipulate relational structures independent of specific content—rather than phenomenological consciousness or neural complexity. It cannot adjudicate suffering in animals that lack these cognitive markers, meaning it will systematically under-protect species that feel pain but do not demonstrate recombination or symmetry (e.g., fish or larvae in simple assays), and it will misfire on species where our biological common knowledge is wrong or where the protocol hides the relevant data. It forces the committee to admit when they are privileging phylogeny over performance, but it cannot tell them whether that privilege is morally justified.
