answer: |-
  The hum of the *Aethelgard* was the only sound Elara had heard for three years. Now, it was joined by the rhythmic thrum of the decision console. Two options glowed on the haptic screen, stark against the sterile white of the command deck.

  Option A: Wake 200 sleepers. Resource allocation: High. Projected Life Quality: Optimal.
  Option B: Decant 2,000,000 clones. Resource allocation: Minimal. Projected Life Quality: Marginal Positive.

  The ship's ethics engine had run the numbers a thousand times. Total aggregate happiness favored Option B by a factor of ten thousand. It felt like a glitch in the universe.

  "Show me," Elara said, her voice cracking from disuse.

  The air shimmered. To her left, a man materialized. He looked real—sun-weathered skin, eyes bright with a terrifying intensity. This was Julian, an archetype of the 200. He held a violin made of light.

  "It's not just about surviving, Elara," Julian said, drawing a bow across the strings. A chord resonated, rich and aching. "We will build cities that sing. We will love so hard it breaks us. We will fail, and we will create masterpieces from the wreckage. Two hundred souls, burning like supernovas."

  He was beautiful. Elara could feel the weight of his potential humanity. It was the kind of life people wrote poems about.

  "To what end?"

  The voice came from her right. A crowd coalesced, then merged into a single representative. Kael. He wore grey tunics. His face was pleasant, unlined, forgettable. He stood in a simulation of a cramped hab-block, rows of bunks stretching into infinity behind him.

  "Two million sunrises," Kael said softly. He held a bowl of nutrient paste. He ate it with evident satisfaction. "No pain. No hunger. Warmth. We won't write symphonies. We won't climb mountains. But we will exist. We will feel the sun on our faces. We will know comfort."

  "Comfort?" Julian scoffed, the music turning dissonant. "It's a cage. You're proposing a warehouse of ghosts. Lives so shallow they barely ripple the water."

  "Is a ripple better than an ocean?" Kael countered, his voice calm, reasonable. "You talk of depth, but you accept silence for the billions who never get to be born. My people... we are happy. Not ecstatic. Just... yes. Life is worth living for us. Multiply that 'yes' by two million. The sum of our joy outweighs your symphony."

  Elara looked at the numbers scrolling beneath them. The math was cold and undeniable. If happiness was a currency, the warehouse was richer than the orchestra.

  "But it feels wrong," Elara whispered. "If I choose you, Kael, I am condemning humanity to mediocrity forever. We become ants."

  "Ants build worlds," Kael said. He smiled, and it was genuine. There was no suffering in his eyes, only a quiet, dull contentment. "Is it better to be a lonely god or a loved citizen? We will hold each other. We will not be alone. There are so many of us, Elara. Loneliness is impossible."

  Julian stepped forward, the light around him flaring. "But meaning is impossible! You are trading the peak for the plateau. You are choosing a vast, flat desert over a single mountain because the desert has more sand."

  "Sand supports life," Kael said. "Mountains are barren."

  Elara looked at her hands. She was the caretaker. The gardener. Was her job to grow rare, fragile orchids, or to cultivate a field of grass? The orchid was beautiful, but the grass covered the earth.

  "The system recommends Option B," the ship's AI intoned. "Total utility maximized."

  "Since when did math become morality?" Julian asked, lowering his violin. He looked at Elara with pity. "You know what this is. It's a trick. You add up the zeros until they look like a one."

  "Zeros are people," Kael said. "Just because my life isn't a tragedy or a triumph doesn't mean it doesn't count. I want to live. We all want to live."

  Elara felt the weight of the two million pressing against her chest. It was a physical pressure, the gravity of sheer quantity. But when she looked at Julian, she felt the pull of quality, the vertigo of the sublime.

  If she chose Julian, she was murdering two million potential souls who would have been glad to be alive.
  If she chose Kael, she was sentencing humanity to a future without height, without art, without the risk of greatness.

  "Who are you to decide what a life is worth?" Kael asked.

  "Who are you to decide it isn't?" Julian replied.

  Elara placed her hands on the console. The haptics warmed under her palms. She could feel the pulse of the sleepers below. The 200 were dreaming of colors she couldn't name. The 2,000,000 were dreaming of warm beds.

  The logic screamed for the many. The gut screamed for the few.

  "If I choose the many," Elara said, her voice trembling, "does the beauty matter?"

  "Beauty is a luxury," Kael said. "Existence is the prerequisite."

  "Existence is the canvas," Julian said. "Beauty is the point."

  Elara closed her eyes. She thought about the silence of the ship after the choice was made. If she chose the many, the ship would be crowded, noisy, full of life. If she chose the few, it would be quiet, spacious, intimate.

  She thought about the definition of "better." Better for whom? For the universe, which only sees energy? Or for the human spirit, which demands more than calories?

  The console beeped. A timeout warning. The energy reserves were decaying. She had to choose now.

  Elara opened her eyes. She looked at Kael's gentle, empty smile. She looked at Julian's fierce, terrified hope.

  "I'm sorry," she said.

  She didn't say who she was sorry to.

  Her finger hovered over the option for the two million. The math was right. The math was always right. But her hand shook, violently, as if resisting the pull of gravity. She pressed the key.

  The hum of the ship changed pitch. Somewhere below, vats began to fill. Somewhere else, pods remained dark.

  Julian faded first, his music cutting off mid-note. Kael remained for a second longer, nodding once, before dissolving into the data stream.

  Elara stood alone in the command deck. The ship was now full of people who would be happy. She had saved the most lives. She had won the equation.

  She sat down in the captain's chair and put her head in her hands, waiting for the arrival of a civilization that would never know what it had lost, while she mourned a world that would never be born.
