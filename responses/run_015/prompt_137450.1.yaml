answer: |-
  The central debate in the semantics of conditionals is whether the distinction between indicative and subjunctive moods reflects a deep ambiguity in the conditional operator itself, or merely a pragmatic shift in the context set against which a single operator is evaluated. The unified view (often associated with Stalnaker) suggests there is one conditional, but indicatives quantify over epistemically possible worlds compatible with what is known, while subjunctives quantify over metaphysically possible worlds compatible with laws and past facts. The ambiguous view argues these are simply different logical beasts. While the unified view offers theoretical economy, it fails to account for the divergent behavior of the two moods under conditions of perfect correlation without causation. I argue here that the gap is semantic: the indicative and subjunctive employ fundamentally different selection functions. The indicative orders worlds by epistemic similarity (retaining evidence and correlation), while the subjunctive orders worlds by causal-nomological similarity (retaining causal structure and laws).

  To see why the unified pragmatic story falters, consider the known-disjunction case [1]. We know the safe was opened by Dev or Mo. 'If Dev didn't open the safe, Mo did' is assertable; 'If Dev hadn't opened the safe, Mo would have' is not. A unified theorist might claim this is just a matter of context: the indicative accesses the knowledge set {Dev ∨ Mo}, while the subjunctive accesses a set where we hold the actual causal history fixed. But this explanation is merely descriptive; it doesn't explain *why* the mood shift triggers the context shift. If the operator were identical, we would expect the mood to be sensitive only to the truth of the antecedent in the context set. Yet, the subjunctive feels false even when the material conditional holds. This suggests the subjunctive is not merely checking compatibility with knowledge, but is running a different simulation entirely.

  This divergence becomes decisive in the common-cause case [2]. Here, a hidden variable fixes both a coin toss and a sealed envelope printout. They are perfectly correlated but causally independent. Epistemically, they stand or fall together. Consequently, 'If the coin landed tails, the envelope says tails' is true; the evidence for the coin is evidence for the envelope. However, 'If the coin had landed tails, the envelope would have said tails' strikes us as false. Why? Because the nearest world where the coin lands tails is one where a small miracle intervenes at noon to flip the coin, while the hidden variable at 11:00 remains unchanged (preserving the envelope's content).

  This case cuts against the unified view. If there were only one conditional operator sensitive to a single "premise set" fixed by conversation, both conditionals should yield the same truth value, given that our knowledge state hasn't changed between utterances. The fact that the indicative tracks the *correlation* while the subjunctive tracks the *causal independence* demonstrates that the two moods utilize different ordering sources. The indicative retains the evidential connection (the correlation is part of the epistemic state); the subjunctive discards it in favor of causal structure (the correlation is not a law). This is not a pragmatic adjustment of the same tool; it is the deployment of two different tools. The indicative asks, "Given what I know, what follows?" The subjunctive asks, "Given how the world works, what would follow?"

  Regarding your fourth case, the open-future pair [4], I must be candid: this is the least load-bearing of your examples. 'If Dev arrives late the alarm will go off' vs. 'if Dev arrived late the alarm would go off'. In open future cases, the distinction between epistemic and metaphysical possibility blurs because the future is not yet fixed. Both moods can often be asserted here without a truth-value gap. While this shows that mood does not strictly mark counterfactuality (since the antecedent isn't known false), it doesn't help us distinguish the *mechanism* of the conditional as sharply as [2]. Case [4] shows that subjunctives aren't *only* for counterfactuals, but Case [2] shows that subjunctives operate on a different similarity metric than indicatives. We should treat [4] as evidence against a simple "time/truth" distinction, but rely on [2] for the semantic verdict.

  Case [3], the known-false antecedent, further cements the semantic split. Once we know Dev opened the safe, the indicative 'If Dev didn't open the safe, Mo did' becomes infelicitous, while the subjunctive 'If Dev hadn't opened the safe, Mo would have' remains robust. The unified view struggles here: if the conditional is one operator, why does learning the antecedent is false destroy the indicative's assertability but not the subjunctive's? The semantic view explains this naturally. The indicative requires the antecedent to be compatible with the epistemic context set (the "live possibilities"). Once Dev is confirmed, 'Dev didn't' is eliminated from the epistemic set, causing the indicative to crash (presupposition failure). The subjunctive, however, operates on a metaphysical/causal ordering that explicitly allows for the suspension of actual facts. It is designed to handle known falsehoods. This asymmetry confirms that the domain restrictions are hard-wired into the semantics of the operators, not merely pragmatic conversational adjustments.

  This leads directly to constraint (a): the nature of supposition. It is incorrect to assume that supposing an antecedent means retaining the rest of what you know and suspending only what it contradicts in the same way for both moods. The retention question is distinct. For the indicative, we retain the *evidential base*. In Case [2], the correlation is evidence, so it is retained. For the subjunctive, we retain the *causal-nomological structure*. In Case [2], the correlation is not causal, so it is discarded in favor of the common cause. The difference isn't just which facts you keep, but the *ordering* you run on them. The indicative minimizes epistemic surprise; the subjunctive minimizes causal miracle. This explains why the subjunctive in [2] requires a "small miracle" at noon (changing the coin) rather than a "large miracle" at 11:00 (changing the hidden variable/envelope). The indicative accepts the correlation as a brute fact of the current information state; the subjunctive demands a causal story.

  Finally, constraint (b): Conditional Excluded Middle (CEM). Does 'If A, C' or 'If A, not-C' have to hold? My verdict predicts different behaviors for each mood, which is a theoretical advantage, not a cost. For the indicative, CEM should fail. In the common-cause case, prior to observation, it is not the case that 'If Coin=T, Env=T' is true to the exclusion of 'If Coin=T, Env=H' if we treat them as probabilistic epistemic claims. More simply, in cases of epistemic uncertainty (like a fair coin), neither 'If I flip it, it will be heads' nor 'If I flip it, it will be tails' is true. The indicative is sensitive to probability splits.

  For the subjunctive, the prediction is more nuanced but distinct. Because the subjunctive relies on a causal ordering, CEM holds only if the causal structure is deterministic. In a deterministic world, 'If the coin had been tails, the envelope would have said tails' is false (as argued in [2]), and 'If the coin had been tails, the envelope would not have said tails' is true. However, in indeterministic causal settings, Lewis-style similarity ties can violate CEM for subjunctives too. The crucial point is that the semantic split *allows* the truth conditions for CEM to diverge based on whether we are measuring epistemic likelihood or causal necessity. A unified theory is forced to give one answer for CEM across both moods, which fails to capture the intuition that indicatives tolerate epistemic gaps while subjunctives demand causal resolution.

  In conclusion, the gap between indicative and subjunctive conditionals is semantic. The data from the common-cause case [2] demonstrates that the two moods access different similarity metrics: one evidential, one causal. The known-false case [3] confirms they have different domain restrictions. While the open-future case [4] is less probative, the overall pattern dictates that we are dealing with two operators. The indicative asks what is supported by our information; the subjunctive asks what is supported by the structure of reality. Treating them as a single operator with pragmatic variances obscures the fundamental difference in how we reason about evidence versus how we reason about cause.
