prompt: |-
  Hey, I’m in this semester-long reading group on moral progress and the expanding circle (don’t ask; it’s half philosophy, half a bunch of people who want to use money and policy to do the most good, arguing about the far future). Last night someone used that line—the arc of the moral universe is long, but it bends toward justice—to shut down a worry I’d raised. My worry was basically: okay, over the past few centuries the circle of beings we’re supposed to care about has gotten bigger (less slavery, more concern for women, animals, future people, whatever), but the amount of suffering or injustice in the world doesn’t obviously go down—we just move a lot of it around, hide it in factory farming, and maybe new tech will create way more suffering later. So it’s not clear the expanding-circle picture is moral progress rather than just a change in fashion about who counts. The guy said the arc line shows the long-run trend is toward justice, so my worry is just short-run noise / not looking at the big picture, and we should stay optimistic and keep prioritizing the far future—people who don’t exist yet and all that.

  I want to take the line apart. Don’t just tell me it’s ambiguous: lay out a menu of the distinct precise claims it could be making, from the boring/trivial to the wild, and say for each whether it’s trivial, substantive and defensible, or false. Here’s a distinction I’ve been playing with to organize it—tell me if it helps or if I’m carving at the joints wrong. Call them three dials: (1) SCOPE: how many/which beings or groups get counted as morally considerable at all; (2) WEIGHT: once inside, how much their interests actually count relative to ours; (3) UPTAKE: how reliably our institutions, norms, and technologies turn those weights into actual outcomes / less suffering. The expanding-circle talk usually only mentions (1). The arc line might be claiming a trend in any or all of these, or something else entirely (a metaphysical guarantee, a claim about our moral beliefs getting more reliable, a providential/historical spirit thing, a rhetorical self-fulfilling prophecy, etc.). For each dial/reading, does it support the guy’s move—i.e., does it show the expanding circle is real moral progress and that my suffering-hasn’t-gone-down worry is irrelevant or just short-run? Which reading would he need?

  And please be committed: don’t give me a survey and then say it depends. After the menu, pick the single reading you think is the most defensible thing to mean by the slogan in this context, tell me why, and tell me which reading you think the guy was actually invoking and whether that one is any good. If you think my three-dial thing is a bad way to slice it, say so and give a better one, but commit to it. Also, I know the line has a longer version I saw somewhere: "I do not pretend to understand the moral universe; the arc is a long one, my eye reaches but little ways; I cannot calculate the curve and complete the figure by the experience of sight; I can divine it by conscience. And from what I see I am sure it bends towards justice." I don’t care who said it first or what book it’s from—treat it as a slogan people actually use. No citations, no reading lists, and no just saying it’s contested; just the conceptual disambiguation and a verdict. I can’t tell which dial the slogan is suppose to be about, or if seperating them even helps, so give me your best committed answer.
