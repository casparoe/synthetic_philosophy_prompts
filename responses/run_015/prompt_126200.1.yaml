      *   **Key Features:** Visible to worker/teammates/HR. No punishment/prohibition/orders. Gentle suggestions ("future self"). Workers' council voted it in (voluntary/consensual).
      *   **User's Goal:** Avoid the "reheated panopticon" take. Wants to know if Foucault's later concepts (power is productive, comes from below, resistance is internal, techniques of the self, pastoral power, biopolitics) apply here.
      *   **Specific Questions:**
