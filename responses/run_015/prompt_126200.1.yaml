      *   **Constraint:** No citations or titles. Just an argument.

  2.  **Deconstruct the "Reheated Panopticon" Critique:**
      *   Standard critique: It's surveillance, it's discipline, it's the guard in the tower.
      *   Why it fails here: There is no guard, no punishment, no prohibition. It's voluntary and consensual. The "guard" is an algorithm suggesting happiness.
      *   Foucault's evolution: He moved *away* from the purely repressive/juridical model of power (sovereign) to the disciplinary (panopticon) to the biopolitical and finally to ethics/subjectivation. This scenario fits the later stuff better than *Discipline and Punish*.

  3.  **Address "Power is Productive" & "No Transgression":**
