      *   The lack of prohibition is the *strength* of the power, not a weakness. It bypasses resistance because resistance usually forms against coercion. You can't revolt against a suggestion to be happier.

  4.  **Classify the Power Mechanism:**
      *   *Pastoral Power:* The shepherd cares for the flock's salvation. Here, the app cares for the worker's "flourishing." It's individualizing (knows your sleep) and totalizing (aggregates for HR). The "shepherd" is the algorithm/company, but the goal is the worker's own well-being (as defined by the system).
      *   *Confession:* The worker generates the data. They confess their sleep, voice, movement continuously. The "truth" of the self is extracted to produce the score.
      *   *Techniques of the Self:* This is the crux. The worker is invited to work on themselves. "Optimize your sleep to be happier." This looks like ethics, but it's guided by external metrics.
