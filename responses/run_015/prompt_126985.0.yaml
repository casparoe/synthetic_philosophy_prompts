answer: |-
  Here is the committed answer: **You are conflating the reception of Plutarch with the production of Plutarch, and it is costing you the most sophisticated tool in ancient ethical pedagogy.**

  Plutarch is **not** a hagiographer. Your framing that he offers "clean exemplars to imitate" is incorrect regarding the original text, even if it is accurate regarding the Byzantine florilegia that gutted him. If you ditch the *Lives* based on the assumption that they are moral simplifications, you lose the training ground for *phronesis* (practical judgment) and replace it with rule-based ethics, which is exactly the kind of moral immaturity Plutarch sought to cure.

  Here is exactly where the confusion lies and why holding onto it is damaging.

  ### 1. The Confusion: Reception vs. Intent
  Your suspicion stems from a true historical observation: late-antique and Byzantine readers *did* turn Plutarch into a source of sententious moral maxims. They stripped out the narrative ambiguity to create handbooks for Christian virtue or imperial administration. But that is a story about how Plutarch was *used*, not what he *wrote*.

  Hagiography functions by obscuring vice to generate awe. Plutarch functions by exposing vice to generate **judgment**. In the *Life of Alcibiades*, Plutarch does not present a flat warning. He presents a psychological tragedy where *philotimia* (love of honor) is the single fuel source for both Alcibiades' brilliant defense of Athens and his treasonous betrayal of it. Plutarch explicitly writes in *Alexander/Caesar* (1.2–3) that he is not writing history but lives, and that "often a small matter, a word, or a jest" reveals character more than battles. This is an admission that character is slippery and multifaceted, not a static badge of virtue.

  If Plutarch were a hagiographer, he would hide Cato the Younger's stubbornness. Instead, he shows how that stubbornness, while virtuous in principle, became politically destructive in practice. He doesn't give you a clean exemplar; he gives you a warning that virtue without flexibility is its own form of vice.

  ### 2. The Pedagogy: Imitation vs. Emulation
  You argue that moral education requires seeing virtue and vice intertwined. Plutarch agrees with you. That is the entire point of the *Parallel Lives*.

  The hagiographic model says: "Be like this saint."
  The Plutarchan model says: "Watch how this man's greatest strength became his fatal weakness in this specific political context, and then watch how the paired Roman handled a similar tension differently."

  The *Synkrisis* (comparison) at the end of the pairs is not a scorecard to rank who was "better." It is a dialectical exercise. It forces the reader to weigh context. For example, comparing Demetrius (the city-sacker) with Antony (the empire-sacker) isn't about saying one is good and one is bad. It is about analyzing how unchecked charisma functions in a collapsing Republic versus a fracturing Hellenistic world.

  This saves Plutarch from being a "sophisticated hagiographer" because the goal is not **mimesis** (copying the action) but **zēlos** (emulating the moral struggle). He wants you to exercise your ethical muscles by wrestling with the contradiction, not by swallowing a pre-digested moral pill.

  ### 3. The Cost of Your Framing
  If you accept the premise that Plutarch is just "moral simplification with extra steps," you commit two errors:

  1.  **You surrender ethical nuance to the florilegia.** By accepting the Byzantine reduction of Plutarch as the "real" Plutarch, you validate the stripping of context. You end up demanding binary moral categories (hero/villain) in a text that explicitly deconstructs them.
  2.  **You lose the mechanism for political realism.** Plutarch's pedagogy is designed for statesmen, not monks. A statesman needs to know that the trait which wins an election (ambition) might lose a war (recklessness). Hagiography cannot teach this because it requires purity. Plutarch teaches that virtue is situational. If you ditch the *exemplum* tradition because you think it's inherently simplistic, you throw out the only ancient framework that attempts to teach leadership through the *failure* of leaders.

  ### The Verdict
  Plutarch is genuinely different. He is not offering clean exemplars; he is offering **case studies in ethical friction.**

  The florilegia turned him into a hagiographer because it is easier to quote a maxim than to analyze a life. But the original text demands that you sit with the discomfort of Alcibiades: that the same fire that warms the state can burn it down. That is not simplification. That is the highest form of moral education.

  Don't ditch the *Lives*. Ditch the lens of the Byzantine excerptors who were afraid of the very contradictions you value. Plutarch is on your side.
