      *   *Narrative 2: Secular Guild/Storage.* (Evidence: Plain sherds = mass production/waste. Enclosure = drying yard/work space).
      *   *Let's try three groups to fit 20 students (approx 6-7 per group).*
      *   *Group 1 Packet:* Emphasizes the *burial context* and *decoration*. (Implies Ritual).
      *   *Group 2 Packet:* Emphasizes the *midden density* and *vessel uniformity*. (Implies Mass Production/Domestic).
      *   *Group 3 Packet:* Emphasizes the *enclosure structure* and *lack of domestic features*. (Implies Public/Political).
      *   *The Decision:* They must vote on the site's *primary function*.

  3.  **Drafting the Exercise Flow (75 Minutes):**
      *   0-5: Intro & Setup.
      *   5-20: Group Work (Analyzing Packets).
