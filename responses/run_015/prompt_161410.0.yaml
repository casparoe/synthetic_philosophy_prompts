  # JOINT STATEMENT ON THE STATUS AND FUNCTION OF ISOTYPE VISUALIZATION
  **Prepared for the Tenants' Union Data Working Group**
  **Signatories:** Marta [Design Historian], Sam [Philosopher of Science]
  **Facilitator:** [Your Name/Role]

  ## PREAMBLE
  This document records the results of an adversarial collaboration regarding the theoretical status and practical application of the Vienna Method (Isotype) in contemporary housing advocacy. We acknowledge that Otto Neurath's own writings contain ambiguities regarding the term "language." Rather than resolving these historically, we stipulate the functional implications of our divergent readings for the production of data visuals. Our goal is not consensus on history, but clarity on practice.

  ## SECTION I: AGREED CLAIMS
  *Both signatories endorse the following propositions as historically accurate and practically binding.*

  1.  **The Primacy of Transformation:** Both sides agree that the core innovation of Isotype is not the drawing itself, but the "transformation" process (as defined by Marie Reidemeister). Raw statistics must be converted into visual units via a strict rule set before drawing begins. A chart produced without this transformation step is not Isotype, regardless of appearance.
  2.  **The Rule of Repetition:** Both sides agree that the rule "quantity is shown by repetition of identical units, not by scaling" is non-negotiable for Isotype. This is not an aesthetic choice but a psychophysical one: human perception of area is non-linear and unreliable, whereas counting discrete units is robust. Violating this rule sacrifices checkability for impact.
  3.  **The Role of Context:** Both sides agree that an Isotype chart never stands alone. It requires a "situation" (a museum wall, a pamphlet, a picket line). Neither side claims the images are magically intelligible without *any* surrounding information. The dispute is about *how much* surrounding information is required for basic intelligibility.
  4.  **Anti-Foundationalism:** Both sides agree that Neurath's "boat" metaphor (rebuilding science at sea without dry dock) applies to the visuals. The charts do not claim to show "Truth" from a God's-eye view. They show a specific, physicalist arrangement of data that is open to revision.
  5.  **The Function of the Caption:** Both sides agree that text is necessary. The dispute is not *whether* to use text, but *what work the text is doing*. We agree that text should not merely repeat the data (redundancy) but must either define the unit (Key) or frame the implication (Narrative).
  6.  **Falsification Conditions:**
      *   **Sam** admits his view is weakened if viewers consistently misinterpret the *syntax* (e.g., counting units wrong) despite knowing the key, suggesting the notation is not logically perspicuous.
      *   **Marta** admits her view is weakened if viewers consistently recover the *correct comparison* across distinct cultural contexts without prior education, suggesting the notation carries more intrinsic logic than mere rhetoric.

  ## SECTION II: TABLE OF RESIDUAL DISAGREEMENTS
  *Here we specify where our models diverge. We list the specific test cases provided by the Working Group.*

  | Case / Topic | The Crux | Sam's Formulation (Logic/Notation) | Marta's Formulation (Rhetoric/Context) | Agreed Test / Evidence | Sam's Prediction | Marta's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Rent-Burden Chart (No Words)** | **Intelligibility without Context** | The syntax of repetition is self-explanatory given a minimal key (1 house = 500 households). The visual logic holds without narrative caption. | The visual is ambiguous without narrative framing. "Rows of houses" could mean wealth, density, or ownership without a caption defining the *burden*. | Show the wordless poster to 50 tenants unfamiliar with Isotype. Ask: "What is being compared?" | 80% will identify it as a comparison of quantity across districts. | <40% will identify it as "rent burden" specifically; most will guess "housing stock." |
  | **2. Scaled Houses (Newspaper Style)** | **Violation of Rules** | Violating the repetition rule destroys the notation's checkability. It becomes an impressionistic illustration, not a statistic. It is logically invalid. | Violating the rule creates a stronger rhetorical impact (Gestalt). If the goal is mobilization, the "lie" of scaling is a valid persuasive tool. | Compare retention of data accuracy 24 hours after viewing between Isotype vs. Scaled versions. | Isotype viewers will recall ratios more accurately. | Scaled viewers will recall the *magnitude of inequality* more vividly, even if ratios are fuzzy. |
  | **3. Counterfactuals (Evictions Prevented)** | **Representing Absence** | Isotype can represent this via negative space or a "gap" in the sequence, governed by logical rules. It is a notation problem solvable by syntax. | You cannot picture what did not happen. This requires narrative explanation. Any visual here is a metaphor dependent on text. | Present a chart showing "Evictions Prevented" using only symbols (no words). Ask: "What happened here?" | 60% will infer "something was stopped" from the visual break. | <20% will infer the specific causal claim without text explaining the rent cap. |
  | **4. Causal Claims (Arrows/Conditionals)** | **Logical Connectives** | Arrows function as logical operators (If P then Q). They are part of the notation's syntax and should be standardized. | Arrows are conventional symbols learned through literacy. They are not universal logic; they are cultural shorthand. | Show a flowchart of Rent -> Eviction using only Isotype icons and arrows to non-native speakers. | The logical flow will be recovered based on arrow directionality. | The meaning will be projected based on the viewer's prior beliefs about housing. |
  | **5. Political Reuse (IZOSTAT vs. TB)** | **Neutrality of Notation** | The notation is a tool like a hammer. It can build a Soviet factory or an American clinic. The neutrality proves its logical robustness. | The notation absorbs the politics of the host. The same symbol means "state power" in Moscow and "charity" in NYC. It is not neutral. | Analyze viewer trust in the data when told the chart comes from a Union vs. a Landlord Lobby (using identical charts). | Trust will vary, but data *interpretation* will remain stable. | Trust and data *interpretation* will shift together (e.g., skeptics will misread the units). |
  | **6. Contested Numbers (Vacancy Rates)** | **Data Production** | The chart clarifies the dispute. It shows "Union Count" vs. "City Count." The notation makes the disagreement precise. | The chart legitimizes the data. Choosing which number to visualize is a political act that the neutral style masks. | Present two conflicting charts side-by-side. Ask viewers: "Is this a technical error or a political conflict?" | Viewers will see it as a discrepancy to be resolved empirically. | Viewers will see it as a conflict of interest obscured by "objective" visuals. |
  | **7. [Added] The Missing Data Case** | **Representing Ignorance** | We must visualize the "unknown" as a distinct category (e.g., grey units). Physicalism requires showing the limits of knowledge. | Admitting ignorance visually weakens the political claim. The rhetoric requires certainty to mobilize. | Show a chart with 20% "Unknown" units. Ask: "Is this data reliable?" | Viewers will trust the chart *more* for honesty. | Viewers will trust the chart *less* for uncertainty. |

  ## SECTION III: VERBAL DISPUTES & DE-VERBALIZATION
  *We identify where our disagreement is merely about terminology.*

  **The Dispute:** Whether Isotype is a "Language."
  *   **Sam** uses "Language" to mean *a system of rules allowing for compositionality and truth-conditions.*
  *   **Marta** uses "Language" to mean *a natural, culturally embedded system of communication requiring fluency.*

  **The De-Verbalized Reality:**
  We agree that Isotype possesses **syntax** (rules of combination) but lacks **semantic autonomy** (meaning without context).
  *   **Practical Rule:** When designing, treat the visuals as having syntax (Sam's constraint: do not break the rules of combination) but treat the audience as lacking fluency (Marta's constraint: do not assume they know the vocabulary).
  *   **Resolution:** Stop asking "Is it a language?" Start asking "Is the key provided?"

  **The Dispute:** Whether the Caption is a "Crutch."
  *   **Sam** hears "Crutch" as "Unnecessary support for a weak structure."
  *   **Marta** hears "Crutch" as "Essential prosthetic for enabling movement."

  **The De-Verbalized Reality:**
  We agree the text is **constitutive**.
  *   **Practical Rule:** A chart without a title/key is not a "pure chart"; it is an incomplete artifact. Do not design the visual first and add text later. The text is part of the transformation process.

  ## SECTION IV: RECOMMENDATIONS FOR THE TENANTS' UNION
  *Based on the above, we offer the following guidance for your posters.*

  1.  **On Captions:** Do not remove the captions. Sam is wrong that the picture should stand alone; Marta is wrong that the picture is merely illustrative. The caption is the **Key**. It defines the unit (1 icon = 500 households). Without it, the syntax fails. *Action: Keep the paragraph, but ensure the first sentence defines the unit strictly.*
  2.  **On Rules:** Do not scale the icons to match the newspaper style. Sam is right here. Scaling introduces psychophysical error. If you want impact, increase the *density* of the icons, not their size. *Action: Stick to repetition.*
  3.  **On Counterfactuals:** Be careful with "Evictions Prevented." Marta is right that this is narrative, not data. *Action: Use a split chart. Left side: "Projected Evictions (No Cap)." Right side: "Actual Evictions (With Cap)." Use a dashed line for the projection. Do not try to iconize the "prevention" directly.*
  4.  **On Contested Data:** When numbers are disputed, visualize the dispute. Sam is right that clarity helps. *Action: Use two colors for the contested units. Label them "Union Count" and "City Count." Do not hide the conflict behind a single average.*
  5.  **On Political Reuse:** Acknowledge your position. Marta is right that neutrality is impossible. *Action: Include a small "About This Data" box that explicitly states "Produced by the Tenants' Union." Do not pretend to be a neutral municipality.*

  ## SECTION V: CONCLUSION
  We remain disagreed on the philosophical status of the image. Sam maintains it is a tool for **verification**; Marta maintains it is a tool for **mobilization**.
  *   **Sam's Warning:** If you prioritize mobilization over verification (e.g., exaggerating visuals), you risk losing credibility when tenants check the numbers.
  *   **Marta's Warning:** If you prioritize verification over mobilization (e.g., overly complex keys), you risk producing charts that are logically sound but politically inert.

  **Final Joint Advice:** Verify first, mobilize second. A chart that cannot be checked cannot be trusted; a chart that is not trusted cannot mobilize.

