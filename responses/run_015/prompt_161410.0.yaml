answer: |-
  ### Brainstorming & Strategic Overview

  **The Core Tension:**
  The dispute hinges on the ontology of the sign. Sam treats the Isotype pictogram as a *token* in a logical calculus (syntax-driven, context-invariant). Marta treats the pictogram as a *gesture* in a social performance (semantics-driven, context-constituted). Both are partially right because Neurath was a pragmatist who refused to separate the logical from the social.

  **Tempting-but-Wrong Moves to Avoid:**
  1.  **The "Synthesis" Trap:** Claiming "It is both a language and rhetoric." This is useless. We need to know *when* it functions as which.
  2.  **The "Neurath Said" Trap:** Neurath's writings are notoriously inconsistent because he was writing for different audiences (philosophers vs. museum-goers). Appealing to his authority will only fuel the fight. We must appeal to the *function* of the work.
  3.  **The "Caption" Compromise:** Saying "Some captions are good." We need a rule for *why* a caption is there. Is it defining terms (Sam) or framing narrative (Marta)?
  4.  **Ignoring the Physicalism:** Sam often forgets Neurath's "physicalism" wasn't just about math; it was about avoiding metaphysics. Marta often forgets Neurath wanted to *avoid* subjective impressionism. Both sides need to acknowledge the "anti-metaphysical" goal of the visuals.

  **Available Moves for the Joint Statement:**
  1.  **Reframe "Language":** Shift the debate from "Is it a language?" to "Does it operate via syntactic rules or pragmatic convention?"
  2.  **The "Transformation" Clause:** Agree that the *process* (Raw Data -> Transformation -> Visual) is where the logic lives, but the *reception* is where the rhetoric lives.
  3.  **Falsification Conditions:** Force each to state what evidence would change their mind. This prevents motte-and-bailey arguing.
  4.  **Operationalizing the Caption:** Define the caption not as text vs. image, but as "Key" (Sam) vs. "Frame" (Marta).

  **Drafting Strategy:**
  *   **Tone:** Dry, precise, charitable but unyielding on distinctions.
  *   **Structure:** Preamble (Scope) -> Agreed Claims (The Common Ground) -> The Table of Disagreement (The Live Wires) -> Verbal Dispute Resolution -> Practical Implications for the Union.
  *   **The User's Problem:** The conclusion must explicitly address the "to caption or not to caption" dilemma based on the philosophical findings.

