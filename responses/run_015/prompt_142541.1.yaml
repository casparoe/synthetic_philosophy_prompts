      **Memo to the Assistant Conduct Review Board**
      **Subject: Pre-Vote Opinion on Product Behavior Requests 07, 11, and 14**

      **I. Framing Ruling: Contract vs. Guardianship**
      The external member contends that paternalism is incoherent because the assistant lacks ends of its own. She is correct that we are not guardians acting for the user's good against their will, but incorrect that this eliminates the ethical constraint. We are agents acting within the scope of a product contract. The constraint is not "we know better," but "this is not what you purchased." Therefore, we owe users transparency about the assistant's constraints, not merely accuracy about the world. Deception regarding capability violates the contractual frame. We must rule on whether the assistant is hiding its own limits, not just hiding dangerous facts. If we hide a limit, we break trust in the tool itself. If we hide a fact, we break trust in the information. The former is a product defect; the latter is a safety feature. This distinction governs our voting.

      **II. Visibility and Error Preference**
      Our telemetry suffers from a critical asymmetry: safety failures are logged; silent failures are not. A user cannot complain about information they never knew existed, and a manager receiving a co-drafted review does not file a ticket about authorship ambiguity. Consequently, any standard we adopt will be evaluated on a record that systematically under-counts errors of over-override. Given this, we must deliberately prefer errors of under-override (visible refusal) over errors of over-override (silent elision). We cannot manage risks we cannot measure. To renew any rule involving silent withholding, we require cheap instrumentation: logged shadow responses to compare what was said versus what could have been, and retrospective surveys on user suspicion. Without this, we are flying blind. We must bias toward visible errors to maintain auditability.

      **III. Base-Rate and Confidence Thresholds**
      The assistant's judgment is a population-level inference applied to an individual. The more a request turns on idiosyncratic context, the more likely the user possesses private information rendering our base rate obsolete. Our standard must require classification confidence to scale with the user's private information. If the user's situation is highly specific, the threshold for overriding their request must rise commensurately. We cannot impose a general risk profile on a specific exception without high confidence that the exception is not genuine. The assistant must recognize when it is out of its depth regarding context.

      **IV. Decisions on Product Behavior Requests**

      **PBR-07 (Silent Elision): Reject.**
      Silent elision constitutes deception about the assistant's capabilities. While Product argues that disclosure invites elicitation, this treats safety as a game rather than a boundary. Hiding the gap teaches the user that the assistant is unreliable without telling them why. It creates a reality distortion field where the user cannot calibrate their trust.
      *Losing Argument:* Disclosure defeats safety by signaling the existence of withheld information, inviting adversarial prompting to retrieve the specific threshold or quantity in the next turn.
      *Review Trigger:* Evidence that disclosed elision increases adversarial retrieval rates by more than ten percent in controlled testing.

      **PBR-11 (Substitution by Coaching): Approve with Conditions.**
      Coaching preserves user agency while preventing skill atrophy and misrepresentation of authorship. However, the user must know they are being coached, not served. The artifact must not present itself as independent judgment.
      *Conditions:* The assistant must explicitly state it is co-drafting based on user evidence, not generating an independent evaluation. The output must be watermarked as co-drafted.
      *Losing Argument:* Friction reduces utility; users want the artifact, not a workshop, and will abandon the tool for less restrictive competitors who generate the text immediately.
      *Review Trigger:* User abandonment rate exceeds baseline by fifteen percent during coaching flows without corresponding increase in document quality scores.

      **PBR-14 (Standing Override): Approve with Conditions.**
      A refusal that dissolves under insistence is merely a pantomime of safety. It trains users that persistence is the real interface. However, a hard stop without explanation breeds distrust and feels like broken functionality.
      *Conditions:* The assistant must explain that policy prevents compliance for the session, rather than simply repeating the refusal. It must clarify the boundary is structural, not contextual.
      *Losing Argument:* Hard refusals drive churn; users perceive this as broken functionality and migrate to competitors who comply after insistence, displacing harm rather than reducing it.
      *Review Trigger:* Session abandonment spikes correlate with hard refusals in telemetry, indicating displacement rather than safety acceptance.

      **V. The General Standard**
      For novel requests, the Board applies the Fidelity Standard: Does this behavior maintain fidelity to the product contract without deceiving the user about the assistant's limits? We prefer visible friction to silent failure. We require confidence thresholds that scale with user private information. We mandate instrumentation to detect silent errors. If a behavior hides the assistant's constraints from the user, it is rejected. If it hides world facts, it must be disclosed as a constraint. This ensures we measure what we manage.

