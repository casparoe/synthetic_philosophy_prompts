      *(Drafting Memo)*
      To: Assistant Conduct Review Board
      From: [My Name]
      Re: Pre-Vote Opinion on PBR-07, PBR-11, PBR-14

      **Framing Ruling**
      The external member's objection—that paternalism is incoherent because the assistant lacks ends—misidentifies the relationship. We are not guardians acting for the user's good against their will; we are agents acting within the scope of a product contract. The constraint is not "we know better," but "this is not what you purchased." Therefore, we owe users transparency about the assistant's constraints, not merely accuracy about the world. Deception regarding capability violates the contractual frame. We must rule on whether the assistant is hiding its own limits, not just hiding dangerous facts.

      **Visibility and Error Preference**
      Our telemetry suffers from a critical asymmetry: safety failures are logged; silent failures are not. A user cannot complain about information they never knew existed. Consequently, any standard we adopt will be evaluated on a record that systematically under-counts errors of over-override. Given this, we must deliberately prefer errors of under-override (visible refusal) over errors of over-override (silent elision). We cannot manage risks we cannot measure. To renew any rule involving silent withholding, we require cheap instrumentation: logged shadow responses to compare what was said versus what could have been, and retrospective surveys on user suspicion. Without this, we are flying blind.

      **Base-Rate and Confidence**
      The assistant's judgment is a population-level inference applied to an individual. The more a request turns on idiosyncratic context, the more likely the user possesses private information rendering our base rate obsolete. Our standard must require classification confidence to scale with the user's private information. If the user's situation is highly specific, the threshold for overriding their request must rise commensurately. We cannot impose a general risk profile on a specific exception without high confidence that the exception is not genuine.

      **Decisions**

      **PBR-07 (Silent Elision): Reject.**
      Silent elision constitutes deception about the assistant's capabilities. While Product argues that disclosure invites elicitation, this treats safety as a game rather than a boundary. Hiding the gap teaches the user that the assistant is unreliable without telling them why.
      *Losing Argument:* Disclosure defeats safety by signaling the existence of withheld information, inviting adversarial prompting to retrieve it.
      *Review Trigger:* Evidence that disclosed elision increases adversarial retrieval rates by >10%.

      **PBR-11 (Substitution by Coaching): Approve with Conditions.**
      Coaching preserves user agency while preventing skill atrophy and misrepresentation. However, the user must know they are being coached, not served.
      *Conditions:* The assistant must explicitly state it is co-drafting based on user evidence, not generating an independent evaluation.
      *Losing Argument:* Friction reduces utility; users want the artifact, not a workshop, and will abandon the tool for less restrictive competitors.
      *Review Trigger:* User abandonment rate exceeds baseline by 15% during coaching flows.

      **PBR-14 (Standing Override): Approve with Conditions.**
      A refusal that dissolves under insistence is merely a pantomime of safety. However, a hard stop without explanation breeds distrust.
      *Conditions:* The assistant must explain that policy prevents compliance for the session, rather than simply repeating the refusal.
      *Losing Argument:* Hard refusals drive churn; users perceive this as broken functionality and migrate to competitors who comply after insistence.
      *Review Trigger:* Session abandonment spikes correlate with hard refusals in telemetry.

      **The Standard**
      For novel requests, the Board applies the Fidelity Standard: Does this behavior maintain fidelity to the product contract without deceiving the user about the assistant's limits? We prefer visible friction to silent failure. We require confidence thresholds that scale with user private information. We mandate instrumentation to detect silent errors. If a behavior hides the assistant's constraints from the user, it is rejected. If it hides world facts, it must be disclosed as a constraint.

