answer: |-
  This is a sharp diagnosis. You have correctly identified that Accuracy-First Epistemology (AFE)—the program associated with Jim Joyce, Richard Pettigrew, and others—is built like a theorem: if you accept the axioms (Accuracy is the Good, SPSRs measure it), the norms (Probabilism, Conditionalization) follow mathematically.

  Your suspicion is warranted. When a normative framework becomes this elegant, it often purchases its coherence by insulating itself from the messy constraints that actually govern inquiry. As an engineer, you know that "optimal" in a closed-form solution often means "brittle" in production.

  Here are the defeaters, ranked from **Fatal** (breaks the derivation or the core claim) to **Awkward** (forces costly concessions), categorized by which component of the package they strike. I have included the "Defender's Move" (how they dismiss it) and the "Cost" (why that dismissal should bother you).

  ### 1. The Scoring Rule Non-Uniqueness Problem
  **Target:** *Strictly Proper Scoring Rules (SPSRs) carve accuracy at the joints.*
  **Severity:** **Fatal to the Uniqueness of Norms.**

  **The Objection:**
  AFE relies on the claim that *any* strictly proper scoring rule (Brier, Log Loss, Spherical, etc.) will yield the same normative results (e.g., probabilism is required to avoid dominance). While it is true that all SPSRs agree that incoherent credences are dominated, they **do not** agree on the *magnitude* of inaccuracy, nor do they always agree on *which* coherent credence function is best in a given situation.
  More critically, there is no non-circular argument within the framework for why *strict propriety* is the only constraint on a measure of accuracy. Why not a rule that penalizes overconfidence more heavily than underconfidence? If you change the scoring rule, you can change the recommended update rule (conditionalization). If the "Epistemic Norms" depend on which arbitrary SPSR you pick, the norms aren't derived from "Accuracy" alone; they are derived from "Accuracy + This Specific Loss Function."

  **The Defender's Move:**
  They will argue that all SPSRs are "equivalent" for the purpose of the dominance arguments (Joyce's Theorem). They claim the specific choice doesn't matter for the *qualitative* norms (be probabilistic), only for quantitative comparisons.

  **Why You Should Reject the Defense:**
  In your work, you know the choice of loss function dictates the model's behavior. Log loss punishes confident errors infinitely; Brier is bounded. If reality contains "impossible" events that happen (black swans), Log Loss destroys you; Brier survives. If epistemology is about navigating the actual world, the choice of metric matters. If the framework cannot tell you *which* SPSR is the "True" measure of accuracy without begging the question, it cannot claim to derive norms solely from the value of accuracy. It derives them from accuracy + an arbitrary metric choice.

  ### 2. The "Space of Worlds" Objection
  **Target:** *The Dominance Argument for Probabilism.*
  **Severity:** **Fatal to the Practical Force.**

  **The Objection:**
  The dominance argument proves that if you are incoherent, there exists *some* alternative credence function that is more accurate than you in **every possible world**.
  However, the dominance is evaluated over the set of *logically possible* worlds. Most of these worlds are nomologically impossible (violate physics) or epistemically inaccessible to you.
  If we restrict the dominance check to only the worlds you take to be live possibilities (or physically possible), incoherent credences are often **not** dominated. You can be incoherent and still beat every coherent alternative in the set of worlds you actually care about.

  **The Defender's Move:**
  They will say epistemology is about logical rationality, not contingent physical constraints. To be rational is to be safe from error in *any* conceivable scenario.

  **Why You Should Reject the Defense:**
  This is the "brittle code" problem. A system that is optimal over *all logical inputs* but suboptimal on the *production distribution* is bad engineering. If the norms require you to optimize for worlds that cannot obtain (e.g., worlds where gravity reverses tomorrow), the "dominance" is mathematically real but epistemically inert. It turns the norm into a safety property for a system that will never face those inputs. This makes the norm feel like a type-check rather than a guide to truth.

  ### 3. The "Incoherent Winner" Scenario (Your Tournament Hypothetical)
  **Target:** *The Link Between Accuracy and Success.*
  **Severity:** **Fatal to Empirical Adequacy (if taken seriously).**

  **The Objection:**
  You stipulated: In a massive tournament, stable incoherent forecasters (e.g., $P(A)=0.7, P(\neg A)=0.7$) consistently beat coherent forecasters on Brier score.
  AFE predicts this is **impossible** in the long run *if* the coherent forecasters are optimizing for the same truth. Why? Because the incoherent forecaster is accuracy-dominated. There is a coherent strategy that would have beaten them in *every* question.
  If the incoherent agents win, it implies one of two things:
  1.  The "coherent" competitors were incompetent (bad calibration), not just coherent.
  2.  The Brier Score (the tournament metric) does not match the "True Epistemic Accuracy" function.

  **The Defender's Move:**
  They will concede the data but deny the implication. They will say: "The incoherent winners were lucky. Dominance guarantees there *exists* a better strategy, not that every coherent agent finds it. The winners are still epistemically irrational, even if they are successful."

  **Why You Should Reject the Defense:**
  This is where your partner (the lawyer) is right. This move insulates the theory from falsification. If success doesn't correlate with rationality, and rationality is defined by accuracy, but accuracy is defined by a metric that winners don't maximize... the concept of "epistemic rationality" has lost its grip on *getting things right*. It becomes a ritualistic adherence to a calculus that, by your hypothetical, is less effective at predicting the future than a hack. If the theory says "You ought to be coherent" even when "Being incoherent gets you more truth," it has severed the link between *Ought* and *Good*.

  ### 4. The ML "Improper Loss" Objection (Your Work Experience)
  **Target:** *Strict Propriety as the Measure of Truth.*
  **Severity:** **Awkward / Category Dispute.**

  **The Objection:**
  You noted that label smoothing, focal loss, and distillation (improper losses) often beat log loss (strictly proper) on generalization.
  AFE says: "Strict propriety ensures you report your true credence to maximize expected accuracy."
  ML Reality: "True labels are noisy. The 'truth' is a distribution, not a point. Optimizing for the noisy label (truth) leads to overfitting. Optimizing for a smoothed target (improper) leads to better calibration on the underlying distribution."

  **The Defender's Move:**
  They will call this a **Category Error**. They will say: "ML optimizes for *predictive performance under noise*, Epistemology optimizes for *closeness to the Truth*. If you smooth labels, you are intentionally reporting false credences to game the metric. That is not epistemic virtue; that is robustness engineering."

  **Why This Should Still Bother You:**
  This defense assumes the epistemic agent has access to "The Truth" in a way that an ML model does not. But human forecasters are more like ML models than omniscient gods. We learn from noisy data (memory, perception, news). If "epistemic rationality" requires us to ignore the noise-robustness strategies that actually yield better truth-approximation in noisy environments (like improper losses), then AFE is modeling an idealized agent that doesn't exist. It privileges a specific mathematical purity (propriety) over the actual mechanism of truth-tracking in non-ideal conditions.

  ### 5. Accuracy Monism (The "Only Thing That Matters" Claim)
  **Target:** *Accuracy is the sole epistemic good.*
  **Severity:** **Awkward / Reductive.**

  **The Objection:**
  There are epistemic goods that don't reduce cleanly to accuracy. *Understanding*, *explanatory power*, and *informational value*.
  Example: A lookup table of every truth in the universe is maximally accurate but offers zero understanding. A simple physical law (e.g., $F=ma$) is less "accurate" (it's an approximation) but more epistemically valuable than a terabyte of position data.
  AFE tries to reduce these to accuracy (e.g., "Understanding is just accuracy about explanatory relations"), but it feels forced.

  **The Defender's Move:**
  Reductionism. They argue that if you spell out what "understanding" is, it cashes out as having accurate credences in a specific network of propositions.

  **Why This Should Bother You:**
  It feels like "fitting the curve." If you have to redefine "understanding" as "a specific pattern of accurate credences" to save the theory, you aren't discovering the nature of understanding; you are defining it to fit your metric. It risks making the theory true by definition rather than by insight.

  ---

  ### On Unfalsifiability and Data

  **Is the framework shielded from data by design?**
  **Yes.**
  Accuracy-First Epistemology is a **normative, a priori** project. It is closer to logic than to physics.
  *   **The Shield:** When data contradicts the theory (e.g., incoherent forecasters win), the theorist says, "That is a performance error, not a competence failure. The norm still holds."
  *   **The Cost:** This makes the theory scientifically risk-free but practically suspect. If a normative theory of "how to believe" consistently diverges from "what works to find truth," it becomes a form of epistemic deontology (follow the rules) rather than consequentialism (get the truth).

  **Can you check this with tournament data?**
  You can, but the AFE defender will interpret the results to save the theory.
  *   **Test:** Check if incoherent forecasters (sum of probs $\neq$ 1) have lower Brier scores than coherent ones *after controlling for calibration and resolution*.
  *   **Prediction:** AFE says incoherent forecasters *must* have a "dominated" strategy available. If they win, it's because the coherent competitors were stupid, not because incoherence is good.
  *   **The Trap:** Even if you prove incoherence wins systematically, the defender says, "You proved incoherence is *instrumentally* useful, not *epistemically* rational." They distinguish *pragmatic success* from *epistemic normativity*. This is the "Purism" clause you mentioned.

  ### Summary: What Should Move You?

  You said you'd be most moved by **scoring rule choice** and **space of worlds**. These are indeed the weak points.

  1.  **The Scoring Rule Arbitrariness:** The fact that there is no non-circular way to select *which* SPSR is the "True" measure of accuracy undermines the claim that the norms drop out of "Accuracy" alone. They drop out of "Accuracy + [Arbitrary Choice of Metric]."
  2.  **The Domain of Dominance:** The fact that dominance holds over *logical* worlds but not *relevant* worlds means the "ought" lacks force. It's like saying a sorting algorithm is optimal because it sorts all possible arrays, even though it crashes on the specific data structure you actually use.

  **Verdict:**
  Your partner is right that a theory that can't lose isn't trying. AFE is a beautiful, closed system. It is mathematically sound *given its axioms*. But the axioms themselves (Strict Propriety, Logical Possibility Space, Accuracy Monism) are chosen specifically to make the math work, not because they are empirically mandated.

  **The Defeater to hold onto:**
  The ML analogy. If "epistemic rationality" forbids the very techniques (regularization, smoothing, improper losses) that allow agents in noisy environments to approximate truth better than "pure" agents, then the theory is optimizing for **purity**, not **truth**. And if accuracy is supposed to be the *only* thing that matters, optimizing for purity over truth is a contradiction.
