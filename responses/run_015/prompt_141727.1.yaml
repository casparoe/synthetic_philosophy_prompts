answer: |-
  **Project Title:** The Maintenance Baseline: Re-evaluating Doing and Allowing in Continuous Care

  **Applicant Background**
  I work as a biomedical equipment technician. My job is to keep life-support systems functional: dialysis units, ventilators, infusion pumps. I do not practice medicine, but I maintain the conditions under which medicine works. For the past six years, I have studied moral philosophy independently. This project combines those two perspectives. It applies the practical reality of mechanical maintenance to the philosophical problem of killing versus letting die.

  **The Research Question**
  Standard moral arguments distinguish sharply between *doing* harm (killing) and *allowing* harm (letting die). This distinction usually relies on thought experiments where an agent intervenes in a static situation (e.g., pushing someone vs. watching them fall). These cases assume a baseline of "doing nothing" where nothing happens.

  My question is: **Does the doing/allowing distinction hold when the status quo requires continuous active maintenance to prevent death?**

  In clinical reality, there is no "stand still" option. A patient stays alive only because someone continuously refills oxygen, services filters, and pays electricity bills. If the baseline for "letting be" is actually a state of high-effort maintenance, then stopping that effort looks like "letting die," but starting that effort looks like "keeping alive." I propose that the intuition shifts depending on who is assigned the job of maintenance. This suggests the distinction is not a deep moral fact about causation, but a bookkeeping device for assigning responsibility.

  **Secondary Variable: Time-Scale**
  I will also test whether the classification changes based on temporal zoom. Pulling a plug is an action in a second; ignoring a failing system is "letting die" over a week. If the moral category flips based on the time-scale of description, the distinction cannot carry the legal weight currently placed on it. This secondary line of inquiry supports the main claim: that the baseline is constructed, not discovered.

  **Methodology**
  This is a conceptual project. It requires no human participants, no lab equipment, and no ethics approval. The work consists of constructing case variations and testing them for intuitive consistency.

  1.  **Case Construction:** I will rewrite standard thought experiments to include maintenance costs. Instead of "unplugging a ventilator," the case becomes "failing to replace the oxygen cylinder that empties every four hours."
  2.  **Intuition Testing:** I will analyze whether these modified cases trigger the same moral judgments as the original static cases.
  3.  **Variable Isolation:** I will vary the time-scale of the description to see if the "doing/allowing" label remains stable.
  4.  **Theory Building:** If the intuitions slide, I will develop the "bookkeeping" explanation: that we label acts based on whose job it was to maintain the baseline.

  **Work Plan (8 Months, 15 Hours/Week)**
  *   **Months 1–2:** Catalogue standard doing/allowing cases. Rewrite them as maintenance scenarios. Identify where the intuition becomes unstable.
  *   **Months 3–4:** Develop the "baseline assignment" theory. Draft arguments showing why the distinction tracks responsibility rather than causation.
  *   **Months 5–6:** Integrate the time-scale variable. Test whether zooming in or out changes the moral classification of the same physical event.
  *   **Months 7–8:** Write the final deliverable. Revise for clarity and plain language.

  **Why This Approach**
  Academic philosophy often abstracts away from material constraints to find clean principles. My background allows me to reintroduce the material constraints without losing the philosophical rigor. I am not running experiments because the data required here is conceptual consistency, not empirical measurement. The value lies in exposing the hidden assumptions in the standard examples.

  **Deliverable**
  I will produce a short monograph (approx. 15,000 words) written in plain English. It will be accessible to a non-specialist audience, similar to the foundation's existing grantees. The goal is not to publish in a journal, but to provide a clear argument that could inform public understanding of end-of-life decisions and resource allocation.

  **Risk and Failure Conditions**
  The primary risk is that the conclusion is true but trivial. It might turn out that everyone already accepts that maintenance matters, and my work adds no new weight. I consider this project a failure if I only demonstrate that "context matters" without explaining *how* the bookkeeping works.

  To mitigate this, I will set a strict success condition: I must show that recognizing the maintenance baseline *changes* the verdict in at least one specific class of cases where the standard view is confident. If the distinction survives the shift to maintenance scenarios unchanged, I will report that negative result honestly. A confirmed robust distinction is as valuable as a dissolved one, provided the test was rigorous.

  **Conclusion**
  This stipend would allow me to treat this question with the seriousness it deserves, moving it from night-time reading to structured work. I am not asking to be trained as an academic; I am asking for the time to finish a job I have already started, using the tools I have already gathered.
