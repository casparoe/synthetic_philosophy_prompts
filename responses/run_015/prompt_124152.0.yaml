          7.  Epistemic Humility/What would change my mind.
      *   *Confidence Markers:* Use phrases like "I am highly confident," "This is where the sheet becomes distortive," "Moderate confidence."
      *   *Self-Correction:* Ensure I don't just say "TA is wrong." The TA might be summarising a specific *type* of pessimism (e.g., sceptical pessimism vs. autonomy-based pessimism). I need to distinguish these.

