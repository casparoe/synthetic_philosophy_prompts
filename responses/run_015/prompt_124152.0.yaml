      *   *Correction on Understanding:* The TA says "testimony gives you less." The Pessimist says "testimony gives you the *wrong kind* of epistemic state for moral action." I need to highlight this qualitative vs. quantitative difference.
      *   *The User's Case:* This looks like what Alison Hills calls "moral understanding via testimony." The pessimist might reply: "Did you truly understand, or just memorise?" But the lab-grown meat test suggests genuine understanding. I should note this tension.

