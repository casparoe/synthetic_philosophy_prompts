answer: |-
  # Seminar Plan: Etiological vs. Causal-Role Function
  **Time:** 50 Minutes
  **Level:** 2nd Year Philosophy of Biology
  **Goal:** Move students from "Which theory is true?" to "Which question are we asking?"

  ## 1. The Load-Bearing Precondition (00:00 – 00:10)
  **Do not start with definitions.** Start with the ambiguity that makes the definitions necessary.

  *   **Activity:** Write "FUNCTION" on the board. Ask for three sentences using the word in a biological context.
  *   **The Pivot:** Identify that some sentences ask about *history* ("Why did this trait appear?") and some ask about *capacity* ("What does this trait do for the system right now?").
  *   **The Rule:** Establish immediately that **Etiological (SE)** answers "Why is it here?" and **Causal-Role (CR)** answers "What does it contribute?"
  *   **Pedagogical Move:** Tell them: "If you argue about which account is 'correct' without specifying which question you're asking, you are having a verbal dispute, not a philosophical one." This validates your flatmate argument explicitly.

  ## 2. The Single Case Study: Bird Feathers (00:10 – 00:30)
  **Why not the heart?** You are right; the intuition is too strong. You need a case where the *history* and the *current utility* come apart.
  **The Case:** **Feathers.**
  *   **Must Have:**
      1.  **Consensus on Current Capacity:** They enable flight (and insulation).
      2.  **Consensus on History:** They evolved initially for thermoregulation/display, *not* flight (exaptation).
      3.  **No Designer:** Ensure they understand this is natural selection, not engineering.
  *   **Must Lack:**
      1.  **Ambiguity on Benefit:** Both flight and insulation are beneficial now (avoids the "vestigial = useless" confusion for now).
      2.  **Complex Genetics:** Keep it at the trait level.

  **Sequence:**
  1.  **Run CR Account:** What do feathers contribute to the bird's system *now*? Flight. (Therefore, function = flight).
  2.  **Run SE Account:** Why were feathers *selected for* originally? Insulation. (Therefore, function = insulation).
  3.  **The Clash:** Ask: "If a palaeontologist says 'The function of early feathers was insulation' and an aerodynamicist says 'The function of modern feathers is flight', who is wrong?"
  4.  **The Resolution:** Neither. They are answering different questions.

  ## 3. Misconception Management (00:30 – 00:40)
  Address these in the order they naturally arise during the Feathers discussion.

  1.  **"Function just means what it does." (Causal Reductionism)**
      *   *When:* Early, when defining CR.
      *   *Head Off:* Distinguish *Capacity* (can fly) from *Function* (contribution to a containing system). A broken wing "does" something (flaps poorly), but contributes nothing to the system's goal.
  2.  **"The Evolutionary one smuggles in a Designer." (Teleology Fear)**
      *   *When:* Introducing SE.
      *   *Head Off:* Explicitly state: "Selection is a filter, not an agent." Use the phrase "Backward-looking explanation," not "Purposeful design."
  3.  **"If it has a function it must be helping the organism right now." (Current Benefit Bias)**
      *   *When:* Comparing the two accounts on Feathers.
      *   *Head Off:* Introduce a **Vestigial Organ** (e.g., Whale Pelvis) briefly. SE says "No function" (no selection maintaining it), CR might say "Function" (muscle anchor). This breaks the link between "Function" and "Currently Helpful."
  4.  **"Causal-Role hands out function to everything, including noise." (Panfunctionalism)**
      *   *When:* Refining CR.
      *   *Head Off:* Introduce the **System Boundary** constraint. The heart's sound is a causal effect, but does it contribute to the *circulatory system's* capacity? No. It's a byproduct relative to the system definition. Don't solve it fully; just show the lever they can pull to stop the flood.

  ## 4. The Verbal vs. Factual Pivot (00:40 – 00:45)
  **Do not hide this.** Second-years are ready to see the machinery.

  *   **The Move:** Return to your flatmate's argument.
  *   **Statement:** "My flatmate and I argued for two hours. He was arguing about *history* (SE). I was arguing about *capacity* (CR). We agreed on all the biology. We disagreed on the label 'function'."
  *   **Instruction:** Tell students: "In your essays, if you claim one account is 'false', you will lose marks. If you claim one account is 'more useful for question X', you will gain marks."
  *   **Why:** This stops them from treating it as a truth-apt debate and starts them treating it as a methodological choice.

  ## 5. Scope Limits: What to Refuse (00:45 – 00:48)
  **Flatly refuse to engage with:**
  1.  **Normativity:** Is the function "good"? (Function can be deleterious in SE if the environment changes).
  2.  **Artifact Function:** Do not let them drift into "What is the function of a screwdriver?" Keep it biological.
  3.  **Detailed History:** Do not discuss Millikan vs. Cummins lineage. Keep it "Selected Effect" vs. "Causal Role."
  4.  **Mental Intentionality:** "Does the bird *want* to fly?" is irrelevant.

  ## 6. The Diagnostic Question (Minute 40)
  **Do not ask:** "What is the difference between SE and CR?" (Tests memory).
  **Ask this:**

  > "Imagine a trait arises in a population purely by **genetic drift** (no selection). It turns out this trait currently **saves the organism's life** in its environment.
  >
  > **Does this trait have a biological function?**"

  *   **Why this works:**
      *   **SE Student:** Must say **NO**. (No selection history).
      *   **CR Student:** Must say **YES**. (Current contribution to survival capacity).
      *   **The "Memorised" Student:** Will hesitate or try to say "It depends."
      *   **The "Understood" Student:** Will immediately ask you: "Which account are we using?"

  **Success Criterion:** If half the class asks "Which account?" before answering, the distinction has landed. If they answer "Yes" or "No" unanimously, you haven't done the work.
