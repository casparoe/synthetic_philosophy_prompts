  To know for sure which rule she is running (Modal Priority vs. Abstract/Concrete Divide), you need to present a case that isolates **Concrete Eternity** from **Modal Contingency**.

  **Propose this scenario to her:**
  > "Imagine a single, simple particle that exists eternally (B-Theory, no beginning or end). It is not part of a loop; it just is. However, it is **contingent**: there are possible worlds where this particle does not exist. Does this single eternal contingent particle require an external necessary ground to explain its existence, or can it be a brute fact?"

  *   **If she says "It needs a ground":** She is a **Full Leibnizian**. She applies PSR to all contingent things, concrete or abstract.
      *   *Outcome for Loop:* **Accept.**
  *   **If she says "It can be a brute fact":** She is a **Humean about Concrete Eternals**. She only applies PSR to abstract totalities or temporal beginnings.
      *   *Outcome for Loop:* **Reject.** (She will view the Loop as just a complex version of the eternal particle).

  ### Summary Strategy for Your Evaluation
  1.  **Frame it as Leibnizian, not Kalam-style:** Emphasize that the argument works *even if* the loop is eternal. The "no beginning" feature is irrelevant; the "contingency" feature is key.
  2.  **Avoid Agency:** Do not argue this proves a "Creator" or "Designer." Argue it proves a "Necessary Ontological Ground."
  3.  **Clarify "Sustaining":** Define it as tenseless ontological dependence, not temporal maintenance.
  4.  **Anticipate the Concrete Objection:** Pre-emptively argue why a *physical* totality (the Loop) cannot be a brute fact even if eternal, perhaps by analogy to the Modal Circle argument she already accepted.

  **My bet:** She accepts it, but she will grade you down if you imply the Necessary Being is a "Person" or if you slip into temporal language regarding the "sustaining." She is looking for a **Metaphysical Ground**, not a **Theistic Agent**.
