  *   **Why this matters:** In the Modal Circle argument you brought up, the "circle" was of *explanations*. In the Sustaining-Loop, the circle is of *physical causes*. She may treat physical causal loops differently than logical explanatory loops.

  ### 3. The "Sustaining" Terminology Trap
  There is a linguistic minefield in the argument's name.
