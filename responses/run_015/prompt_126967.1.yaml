  Here is the breakdown of the rule she is running, the competing hypothesis that could trip you up, and the specific test case that would settle her position.

  ### 1. The Primary Rule: "Modal Contingency > Temporal Origin"
  Dr. Alvarez distinguishes sharply between **Temporal Causation** (events in time causing other events) and **Ontological Grounding** (why a thing exists at all).

  *   **The Pattern:**
      *   **Kalam (Reject):** Relies on *temporal* beginning and traversing an infinite. Since she holds B-Theory (time is a block, no "moving" through it), the "traversal" objection fails. An infinite past is coherent to her.
