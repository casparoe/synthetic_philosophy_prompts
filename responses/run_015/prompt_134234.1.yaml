prompt: |-
  Consider an institutional review board that permits behavioral researchers to use “staged disclosure”: participants are initially told they are completing a study on memory, but the task actually measures conformity to authority; the true purpose is revealed only in a mandatory debriefing, and participants may sign a retroactive consent form within twenty-four hours, with no effect on their course credit whether they sign or refuse. The board treats this as ethically valid consent, arguing that no explicit falsehood was told—only a framing omission—and that the post-hoc signature restores autonomy without coercion. At the same time, the board categorically prohibits studies in which participants are explicitly lied to about purpose, even if corrected immediately, and insists that consent for invasive medical procedures must be fully informed and obtained prospectively, with no retroactive option permitted. What philosophical commitments about the conditions of valid consent—specifically regarding deception, coercion, and competence—does this paired practice presuppose? Does it assume that deception vitiates consent only through explicit falsehoods about risk rather than strategic omissions of purpose? Does it treat consent as a revocable transactional event that can be backdated once competence is restored, provided no reward or penalty attaches to the ratification? Or does it implicitly separate epistemic defects from volitional ones? Reconstruct the implicit theory, distinguishing what the practice strictly requires from what merely fits it well, assess whether it is coherent with standard informed-consent doctrines, and explain what would have to change in the board’s rules if one held that any material omission of purpose invalidates consent regardless of subsequent ratification, or that competence must be assessed solely at the moment of initial agreement. Keep your answer to no more than 300 words.
