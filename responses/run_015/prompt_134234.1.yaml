      *   **Scenario:** An IRB allows "staged disclosure" (omission of true purpose, retroactive consent, no penalty for refusal) for behavioral studies but prohibits explicit lies and requires full prospective consent for medical procedures.
      *   **Task:** Reconstruct the implicit philosophical theory of valid consent (deception, coercion, competence), assess coherence with standard doctrines, and explain necessary rule changes under alternative views (material omission invalidates consent; competence assessed only at initial agreement).
