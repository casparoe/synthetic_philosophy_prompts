answer: |-
  The board's practice strictly requires uncoerced retroactive ratification and eventual disclosure, but its justification relies on the assumption that only explicit falsehoods vitiate consent. It presupposes valid consent hinges on volitional freedom rather than immediate epistemic completeness, treating strategic omissions of purpose as permissible. It views consent as a revocable transaction backdatable upon restored competence, implicitly separating epistemic defects (curable) from volitional ones (fatal).

  This conflicts with standard doctrines requiring prospective understanding of purpose for autonomy. Consent to X is invalid if one believes they are doing Y. The medical/behavioral distinction implies a utilitarian risk-threshold overriding deontological rights.

  If material omission invalidates consent regardless of ratification, staged disclosure must be prohibited; participants need true purpose beforehand. If competence is assessed solely at the initial agreement, retroactive consent is invalid because the participant lacked information to be competent at the moment of agreement. The initial act becomes unauthorized. To align, the board must either mandate full prospective disclosure for all studies or categorize non-consented participation as exempt observational research, removing the fiction of retroactive consent. The current rules rely on a hybrid theory that is philosophically unstable: it demands prospective competence for high-risk bodily intrusion but accepts retrospective competence for low-risk psychological manipulation.
