      *   *Word Count Check:* ~180 words. I can expand slightly on the philosophical commitments.

      *   *Revision:* The board presupposes that valid consent hinges primarily on volitional freedom rather than immediate epistemic completeness. It assumes deception vitiates consent only through explicit falsehoods (commission), treating strategic omissions as permissible framing. It views consent as a revocable transaction that can be ratified post-hoc once competence is restored, provided no coercion (credit penalty) exists. This implicitly separates epistemic defects (curable) from volitional ones (fatal).

