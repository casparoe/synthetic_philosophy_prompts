          *   **Consent Nature:** Transactional and revocable. Can be "cured" post-hoc if autonomy is restored (debriefing) without coercion.
          *   **Competence:** Can be assessed/restored post-hoc for low-risk behavioral tasks, but must be prospective for high-risk (medical) interventions.
          *   **Epistemic vs. Volitional:** Separates them. Epistemic defects (omission) are fixable; volitional defects (coercion) are not.

  3.  **Evaluate Coherence:**
      *   Standard informed consent doctrines (e.g., Belmont Report) generally require prospective understanding of *purpose* for valid consent, not just absence of lies. Omitting purpose usually invalidates consent because autonomy requires knowing *what* one is agreeing to.
      *   The IRB's distinction between omission and commission is philosophically shaky (both undermine informedness).
      *   The distinction between behavioral and medical suggests a risk-based utilitarian overlay rather than a deontological rights-based view.

  4.  **Drafting the Response (incorporating constraints):**
      *   *Implicit Theory:* Consent is valid if volitional freedom is preserved, even if epistemic completeness is delayed. It treats omission as ethically distinct from commission.
      *   *Coherence:* Incoherent with standard doctrines requiring prospective knowledge of purpose. Standard views hold that consent to X cannot be given if one believes one is doing Y.
      *   *Required Changes:* If material omission invalidates consent, staged disclosure must be banned. If competence is moment-specific, retroactive consent is invalid.

